<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two animation paths: JS-driven vs. native-driven</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Where each frame's math runs, and whether it depends on the JS thread being free</text>

  <defs>
    <marker id="ap-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="ap-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a33333"/>
    </marker>
    <marker id="ap-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="195" y="70" font-size="13" font-weight="bold" fill="#a33333" text-anchor="middle">JS-driven</text>
  <text x="195" y="86" font-size="9.5" fill="#666666" text-anchor="middle">Animated without useNativeDriver,</text>
  <text x="195" y="99" font-size="9.5" fill="#666666" text-anchor="middle">PanResponder-style, react-native-animatable</text>

  <text x="585" y="70" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native-driven</text>
  <text x="585" y="86" font-size="9.5" fill="#666666" text-anchor="middle">useNativeDriver: true,</text>
  <text x="585" y="99" font-size="9.5" fill="#666666" text-anchor="middle">Reanimated worklets</text>

  <!-- JS-driven path -->
  <rect x="30" y="115" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="141" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">JS thread</text>
  <text x="130" y="158" font-size="9.5" fill="#333333" text-anchor="middle">computes next frame's value</text>

  <line x1="130" y1="175" x2="130" y2="210" stroke="#a33333" stroke-width="1.5" marker-end="url(#ap-arrow-red)"/>
  <text x="205" y="196" font-size="9" fill="#a33333" text-anchor="middle">per-frame round trip</text>

  <rect x="30" y="210" width="200" height="60" rx="8" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="130" y="236" font-size="12" font-weight="bold" fill="#a35d00" text-anchor="middle">Bridge / JSI</text>
  <text x="130" y="253" font-size="9.5" fill="#333333" text-anchor="middle">crossed again every frame</text>

  <line x1="130" y1="270" x2="130" y2="305" stroke="#a33333" stroke-width="1.5" marker-end="url(#ap-arrow-red)"/>

  <rect x="30" y="305" width="200" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="130" y="331" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native side</text>
  <text x="130" y="348" font-size="9.5" fill="#333333" text-anchor="middle">applies the value it was given</text>

  <!-- feedback loop arrow showing repetition -->
  <path d="M 230 145 C 300 145, 300 335, 232 335" fill="none" stroke="#a33333" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#ap-arrow-red)"/>
  <text x="300" y="240" font-size="9" fill="#a33333" text-anchor="middle" transform="rotate(90 300 240)">repeats ~60/120 times per second</text>

  <text x="130" y="392" font-size="10" fill="#a33333" text-anchor="middle" font-weight="bold">Stutters when the JS thread is busy</text>

  <!-- Native-driven path -->
  <rect x="420" y="115" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="520" y="141" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">JS thread</text>
  <text x="520" y="158" font-size="9.5" fill="#333333" text-anchor="middle">describes the animation once</text>

  <line x1="520" y1="175" x2="520" y2="210" stroke="#2d6a34" stroke-width="1.5" marker-end="url(#ap-arrow-green)"/>
  <text x="640" y="196" font-size="9" fill="#2d6a34" text-anchor="middle">handed off a single time</text>

  <rect x="420" y="210" width="200" height="60" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="520" y="232" font-size="12" font-weight="bold" fill="#7a3b8f" text-anchor="middle">UI / native thread</text>
  <text x="520" y="249" font-size="9.5" fill="#333333" text-anchor="middle">runs every subsequent frame</text>
  <text x="520" y="262" font-size="9.5" fill="#333333" text-anchor="middle">(worklet or serialized animation)</text>

  <line x1="520" y1="270" x2="520" y2="305" stroke="#2d6a34" stroke-width="1.5" marker-end="url(#ap-arrow-green)"/>

  <rect x="420" y="305" width="200" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="520" y="331" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native renderer</text>
  <text x="520" y="348" font-size="9.5" fill="#333333" text-anchor="middle">applies each frame directly</text>

  <path d="M 620 240 C 690 240, 690 335, 622 335" fill="none" stroke="#2d6a34" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#ap-arrow-green)"/>
  <text x="690" y="288" font-size="9" fill="#2d6a34" text-anchor="middle" transform="rotate(90 690 288)">no per-frame JS round trip</text>

  <text x="520" y="392" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">Smooth even when the JS thread is busy</text>

  <text x="390" y="410" font-size="10.5" fill="#666666" text-anchor="middle">Both paths eventually move a real native view -- the difference is who does the per-frame arithmetic</text>
</svg>
