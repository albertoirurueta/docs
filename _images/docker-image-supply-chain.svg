<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The image supply chain</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The image supply chain</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">each step adds evidence that the next one can verify</text>
  <rect x="12" y="90" width="98" height="110" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="61.0" y="134.5" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Source</text>
  <text x="61.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">Git commit</text>
  <text x="61.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">pinned base digests</text>
  <line x1="110" y1="145" x2="119" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="119" y="90" width="98" height="110" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="168.0" y="134.5" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">Build</text>
  <text x="168.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">BuildKit / Buildx</text>
  <text x="168.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">fixed timestamps</text>
  <line x1="217" y1="145" x2="226" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="226" y="90" width="98" height="110" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="275.0" y="134.5" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">Attest</text>
  <text x="275.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">SBOM (SPDX)</text>
  <text x="275.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">SLSA provenance</text>
  <line x1="324" y1="145" x2="333" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="333" y="90" width="98" height="110" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="382.0" y="134.5" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Registry</text>
  <text x="382.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">image index +</text>
  <text x="382.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">attestation manifests</text>
  <line x1="431" y1="145" x2="440" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="440" y="90" width="98" height="110" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="489.0" y="134.5" font-size="11" font-weight="bold" fill="#8f2a2a" text-anchor="middle">Scan</text>
  <text x="489.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">Docker Scout</text>
  <text x="489.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">CVEs + policies</text>
  <line x1="538" y1="145" x2="547" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="547" y="90" width="98" height="110" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="596.0" y="134.5" font-size="11" font-weight="bold" fill="#1f6b6b" text-anchor="middle">Sign / verify</text>
  <text x="596.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">Sigstore cosign</text>
  <text x="596.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">or Notation</text>
  <line x1="645" y1="145" x2="654" y2="145" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="654" y="90" width="98" height="110" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="703.0" y="134.5" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Deploy</text>
  <text x="703.0" y="149.5" font-size="9" fill="#333333" text-anchor="middle">admission policy</text>
  <text x="703.0" y="162.5" font-size="9" fill="#333333" text-anchor="middle">pull by digest</text>
  <text x="380" y="240" font-size="10" fill="#8f2a2a" text-anchor="middle">Docker Content Trust (Notary v1) is retired: removed from the CLI in Engine 29; notary.docker.io shuts down 8 Dec 2026</text>
  <text x="380" y="265" font-size="10" fill="#555555" text-anchor="middle">Hardened base images (DHI) arrive with their own SBOM, VEX and SLSA Build Level 3 provenance</text>
</svg>
