<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ctx-lost-vs-survives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What a context loss destroys and what it keeps</text>
<rect x="20" y="50" width="350" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="74.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Destroyed: GPU side</text>
<rect x="390" y="50" width="350" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="74.5" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Survives: CPU side</text>
<rect x="20" y="100" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="120.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Every WebGLBuffer, texture, program, shader</text>
<rect x="390" y="100" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="120.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The canvas element and its event listeners</text>
<rect x="20" y="138" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="158.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Framebuffers, renderbuffers, VAOs, samplers</text>
<rect x="390" y="138" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="158.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Your typed arrays and decoded image data</text>
<rect x="20" y="176" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="196.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Queries, sync objects, transform feedback</text>
<rect x="390" y="176" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="196.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Parameters: shader sources, uniform values</text>
<rect x="20" y="214" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="234.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Bound state, viewport, blend and depth settings</text>
<rect x="390" y="214" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="234.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Scene and game state: score, timer, camera</text>
<rect x="20" y="252" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="272.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Enabled extensions and their extension objects</text>
<rect x="390" y="252" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="272.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Loaded files (glb bytes, ImageBitmaps)</text>
<rect x="20" y="290" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="310.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Drawing buffer contents (canvas becomes blank)</text>
<rect x="390" y="290" width="350" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="310.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Your own code, including the restore handler</text>
<text x="380" y="346" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Rule of thumb: anything you could only get by asking the GPU is gone; anything stored in JavaScript is still there.</text>
</svg>
