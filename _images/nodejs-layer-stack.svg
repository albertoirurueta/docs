<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Node.js layer stack</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">a call travels down to the operating system; the result comes back up as a callback or promise</text>

  <!-- Layer 1: your code -->
  <rect x="60" y="62" width="420" height="62" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="270" y="86" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Your code</text>
  <text x="270" y="104" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">scripts, packages from npm, frameworks</text>
  <text x="270" y="118" font-size="10" fill="#666666" text-anchor="middle">JavaScript or type-stripped TypeScript</text>

  <!-- Layer 2: Node APIs -->
  <rect x="60" y="140" width="420" height="78" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="270" y="162" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Node.js core library (JavaScript)</text>
  <text x="270" y="180" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">node:fs  node:http  node:stream  node:crypto  node:test</text>
  <text x="270" y="196" font-size="11" fill="#444444" text-anchor="middle">plus globals: fetch (Undici), URL, AbortController, timers</text>
  <text x="270" y="211" font-size="10" fill="#666666" text-anchor="middle">validates arguments, shapes the public API</text>

  <!-- Layer 3: bindings -->
  <rect x="60" y="234" width="420" height="66" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="270" y="258" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">C++ bindings and Node-API</text>
  <text x="270" y="276" font-size="11" fill="#444444" text-anchor="middle">glue between JavaScript objects and native code</text>
  <text x="270" y="292" font-size="10" fill="#666666" text-anchor="middle">internal bindings are not public; native addons use Node-API</text>

  <!-- Layer 4: V8 + libuv side by side -->
  <rect x="60" y="316" width="204" height="82" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="162" y="340" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">V8</text>
  <text x="162" y="358" font-size="11" fill="#444444" text-anchor="middle">parses and runs JavaScript,</text>
  <text x="162" y="373" font-size="11" fill="#444444" text-anchor="middle">JIT compiler, garbage</text>
  <text x="162" y="388" font-size="11" fill="#444444" text-anchor="middle">collector, WebAssembly</text>

  <rect x="276" y="316" width="204" height="82" fill="#f4f4f4" stroke="#5a2f7a" stroke-width="1.6"/>
  <text x="378" y="340" font-size="14" font-weight="bold" fill="#5a2f7a" text-anchor="middle">libuv</text>
  <text x="378" y="358" font-size="11" fill="#444444" text-anchor="middle">event loop, async I/O,</text>
  <text x="378" y="373" font-size="11" fill="#444444" text-anchor="middle">timers, thread pool</text>
  <text x="378" y="388" font-size="10" fill="#666666" text-anchor="middle">also llhttp, OpenSSL, zlib, c-ares</text>

  <!-- Layer 5: OS -->
  <rect x="60" y="414" width="420" height="52" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="270" y="436" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Operating system</text>
  <text x="270" y="453" font-size="11" fill="#444444" text-anchor="middle">epoll, kqueue, IOCP, sockets, files, threads</text>

  <!-- arrows -->
  <line x1="270" y1="400" x2="270" y2="412" stroke="#444444" stroke-width="1.4"/>
  <polygon points="270,414 265,406 275,406" fill="#444444"/>

  <!-- side notes -->
  <rect x="520" y="140" width="170" height="160" fill="#f4f4f4" stroke="#444444" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="605" y="164" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">One main thread</text>
  <text x="605" y="186" font-size="11" fill="#444444" text-anchor="middle">runs all your JavaScript</text>
  <text x="605" y="206" font-size="11" fill="#444444" text-anchor="middle">libuv pool threads</text>
  <text x="605" y="222" font-size="11" fill="#444444" text-anchor="middle">do blocking file, DNS</text>
  <text x="605" y="238" font-size="11" fill="#444444" text-anchor="middle">and crypto work</text>
  <text x="605" y="258" font-size="11" fill="#444444" text-anchor="middle">workers add isolated</text>
  <text x="605" y="274" font-size="11" fill="#444444" text-anchor="middle">JavaScript threads</text>

  <text x="520" y="82" font-size="11" fill="#222222" font-weight="bold">Reading the stack</text>
  <text x="520" y="98" font-size="11" fill="#444444">V8 knows nothing of files</text>
  <text x="520" y="114" font-size="11" fill="#444444">or sockets; Node adds them.</text>
</svg>
