<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Keyframes and easing: how values are interpolated</text>
<g transform="translate(30,70)"><rect x="-10" y="-10" width="180" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><line x1="0" y1="100" x2="160" y2="100" stroke="#4B5563"/><line x1="0" y1="100" x2="0" y2="0" stroke="#4B5563"/><path d="M0,100 L160,0" fill="none" stroke="#3730A3" stroke-width="2.5"/><circle cx="0" cy="100" r="5" fill="#B45309"/><circle cx="160" cy="0" r="5" fill="#B45309"/></g><text x="110" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Linear</text><text x="110" y="236" font-size="12" fill="#374151" text-anchor="middle">Constant speed</text>
<g transform="translate(210,70)"><rect x="-10" y="-10" width="180" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><line x1="0" y1="100" x2="160" y2="100" stroke="#4B5563"/><line x1="0" y1="100" x2="0" y2="0" stroke="#4B5563"/><path d="M0,100 C80,100 120,40 160,0" fill="none" stroke="#3730A3" stroke-width="2.5"/><circle cx="0" cy="100" r="5" fill="#B45309"/><circle cx="160" cy="0" r="5" fill="#B45309"/></g><text x="290" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Ease in</text><text x="290" y="236" font-size="12" fill="#374151" text-anchor="middle">Slow start, fast end</text>
<g transform="translate(390,70)"><rect x="-10" y="-10" width="180" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><line x1="0" y1="100" x2="160" y2="100" stroke="#4B5563"/><line x1="0" y1="100" x2="0" y2="0" stroke="#4B5563"/><path d="M0,100 C40,60 80,0 160,0" fill="none" stroke="#3730A3" stroke-width="2.5"/><circle cx="0" cy="100" r="5" fill="#B45309"/><circle cx="160" cy="0" r="5" fill="#B45309"/></g><text x="470" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Ease out</text><text x="470" y="236" font-size="12" fill="#374151" text-anchor="middle">Fast start, slow end</text>
<g transform="translate(570,70)"><rect x="-10" y="-10" width="180" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><line x1="0" y1="100" x2="160" y2="100" stroke="#4B5563"/><line x1="0" y1="100" x2="0" y2="0" stroke="#4B5563"/><path d="M0,100 C80,100 80,0 160,0" fill="none" stroke="#3730A3" stroke-width="2.5"/><circle cx="0" cy="100" r="5" fill="#B45309"/><circle cx="160" cy="0" r="5" fill="#B45309"/></g><text x="650" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Ease in and out</text><text x="650" y="236" font-size="12" fill="#374151" text-anchor="middle">Slow at both ends</text>
<rect x="30" y="256" width="700" height="56" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="380" y="279" font-size="12" fill="#92400E" text-anchor="middle">Horizontal axis: time between two keyframes. Vertical axis: progress from the first value to the second.</text><text x="380" y="298" font-size="12" fill="#92400E" text-anchor="middle">Also available: back variants (overshoot), Hold, springs, custom bezier and custom spring.</text></svg>
