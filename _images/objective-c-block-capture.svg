<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="bc-ar" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#2f6fa8"/>
    </marker>
    <marker id="bc-arr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#a33a3a"/>
    </marker>
  </defs>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Block capture: by value, by __block, and the copy to the heap</text>

  <!-- STACK region -->
  <rect x="25" y="50" width="345" height="300" rx="8" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="197" y="72" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Stack &#8212; the enclosing scope</text>

  <!-- captured-by-value variable -->
  <rect x="45" y="86" width="140" height="58" rx="5" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="115" y="106" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c" text-anchor="middle">NSInteger counter</text>
  <text x="115" y="123" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">0</text>
  <text x="115" y="138" font-size="10" fill="#5b7089" text-anchor="middle">ordinary local</text>

  <!-- __block variable -->
  <rect x="205" y="86" width="145" height="58" rx="5" fill="#f6e9cf" stroke="#b08a34" stroke-width="2"/>
  <text x="277" y="106" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d" text-anchor="middle">__block NSInteger n</text>
  <text x="277" y="123" font-size="13" font-weight="bold" fill="#6b4f0d" text-anchor="middle">shared box</text>
  <text x="277" y="138" font-size="10" fill="#8a7340" text-anchor="middle">moves to the heap with the block</text>

  <!-- the stack block -->
  <rect x="45" y="168" width="305" height="160" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="197" y="190" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">__NSStackBlock__</text>
  <text x="60" y="212" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">^{ NSLog(@"%ld", counter); n++; }</text>

  <rect x="60" y="226" width="128" height="44" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.2"/>
  <text x="124" y="243" font-size="10.5" font-weight="bold" fill="#14395c" text-anchor="middle">captured copy</text>
  <text x="124" y="259" font-size="10.5" fill="#14395c" text-anchor="middle">counter = 0 (const)</text>

  <rect x="205" y="226" width="130" height="44" rx="4" fill="#f6e9cf" stroke="#b08a34" stroke-width="1.2"/>
  <text x="270" y="243" font-size="10.5" font-weight="bold" fill="#6b4f0d" text-anchor="middle">pointer to the box</text>
  <text x="270" y="259" font-size="10.5" fill="#6b4f0d" text-anchor="middle">n is read/write</text>

  <text x="197" y="291" font-size="10.5" fill="#5b7089" text-anchor="middle">Later writes to `counter` outside the block are NOT seen:</text>
  <text x="197" y="306" font-size="10.5" fill="#5b7089" text-anchor="middle">the value was frozen when the block was created.</text>
  <text x="197" y="321" font-size="10.5" fill="#8a7340" text-anchor="middle">Writes through `n` ARE seen, in both directions.</text>

  <!-- scope-exit warning -->
  <text x="197" y="343" font-size="11" font-weight="bold" fill="#a33a3a" text-anchor="middle">When the scope exits, this stack memory is gone.</text>

  <!-- HEAP region -->
  <rect x="400" y="50" width="335" height="300" rx="8" fill="#f2f7f0" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="567" y="72" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Heap &#8212; after the copy</text>

  <rect x="420" y="86" width="295" height="58" rx="5" fill="#f6e9cf" stroke="#b08a34" stroke-width="2"/>
  <text x="567" y="106" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d" text-anchor="middle">__block box for n (moved here)</text>
  <text x="567" y="124" font-size="10.5" fill="#8a7340" text-anchor="middle">the stack copy is forwarded to this one, so both</text>
  <text x="567" y="138" font-size="10.5" fill="#8a7340" text-anchor="middle">the block and the original scope see one value</text>

  <rect x="420" y="168" width="295" height="160" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="567" y="190" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">__NSMallocBlock__</text>
  <text x="567" y="211" font-size="10.5" fill="#2f5424" text-anchor="middle">survives the scope; reference-counted like any object</text>

  <rect x="435" y="224" width="128" height="46" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  <text x="499" y="241" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">counter = 0</text>
  <text x="499" y="258" font-size="10.5" fill="#2f5424" text-anchor="middle">copied with the block</text>

  <rect x="580" y="224" width="130" height="46" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  <text x="645" y="241" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">captured objects</text>
  <text x="645" y="258" font-size="10.5" fill="#2f5424" text-anchor="middle">retained by the block</text>

  <text x="567" y="292" font-size="10.5" fill="#2f5424" text-anchor="middle">Any captured object &#8212; including self &#8212; is retained for the</text>
  <text x="567" y="307" font-size="10.5" fill="#2f5424" text-anchor="middle">block's whole lifetime. If the object also owns the block,</text>
  <text x="567" y="322" font-size="10.5" font-weight="bold" fill="#a33a3a" text-anchor="middle">that is a retain cycle &#8212; break it with __weak.</text>

  <!-- copy arrow -->
  <path d="M352 248 L415 248" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#bc-ar)"/>
  <text x="383" y="238" font-size="10.5" font-weight="bold" fill="#2f6fa8" text-anchor="middle">copy</text>
  <path d="M352 112 L415 112" stroke="#b08a34" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#bc-ar)"/>

  <!-- bottom notes -->
  <text x="380" y="378" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">What triggers the copy</text>
  <text x="380" y="398" font-size="11" fill="#5b7089" text-anchor="middle">Under ARC the compiler copies the block automatically when it is returned from a function, stored in a strong</text>
  <text x="380" y="414" font-size="11" fill="#5b7089" text-anchor="middle">variable, ivar or `copy` property, or passed to an API that keeps it (dispatch_async, a completion handler).</text>
  <text x="380" y="435" font-size="11" fill="#5b7089" text-anchor="middle">A block that captures nothing is a __NSGlobalBlock__ singleton: there is nothing to copy, and no cycle to worry about.</text>
  <text x="380" y="456" font-size="11" fill="#5b7089" text-anchor="middle">Declare every block property `copy`, and always nil-check a block before calling it &#8212; calling a NULL block crashes.</text>
</svg>
