<svg viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Widget lifecycle: render, interact, update state, sync</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
<rect x="20" y="55" width="130" height="120" rx="10"/><rect x="170" y="55" width="130" height="120" rx="10"/><rect x="320" y="55" width="130" height="120" rx="10"/><rect x="470" y="55" width="130" height="120" rx="10"/><rect x="620" y="55" width="120" height="120" rx="10"/></g>
<g fill="#4F46E5"><circle cx="32" cy="67" r="11"/><circle cx="182" cy="67" r="11"/><circle cx="332" cy="67" r="11"/><circle cx="482" cy="67" r="11"/><circle cx="632" cy="67" r="11"/></g>
<g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="32" y="71">1</text><text x="182" y="71">2</text><text x="332" y="71">3</text><text x="482" y="71">4</text><text x="632" y="71">5</text></g>
<g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">
<text x="85" y="100">Render</text><text x="235" y="100">Interaction</text><text x="385" y="100">State update</text><text x="535" y="100">Multiplayer</text><text x="680" y="100">Re-render</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="85" y="122">Function reads</text><text x="85" y="138">synced state and</text><text x="85" y="154">returns JSX</text>
<text x="235" y="122">A user clicks or</text><text x="235" y="138">picks a property</text><text x="235" y="154">menu item</text>
<text x="385" y="122">Handler runs on</text><text x="385" y="138">that client and</text><text x="385" y="154">calls the setter</text>
<text x="535" y="122">New state is saved</text><text x="535" y="138">in the file and</text><text x="535" y="154">sent to others</text>
<text x="680" y="122">Every client</text><text x="680" y="138">draws the same</text><text x="680" y="154">widget</text></g>
<g stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"><line x1="152" y1="115" x2="168" y2="115"/><line x1="302" y1="115" x2="318" y2="115"/><line x1="452" y1="115" x2="468" y2="115"/><line x1="602" y1="115" x2="618" y2="115"/></g>
<path d="M680 177 L680 205 L85 205 L85 179" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="382" y="198" font-size="12" fill="#4B5563" text-anchor="middle">the cycle repeats on every change</text>
<rect x="20" y="230" width="340" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190" y="254" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Rendering code</text>
<text x="190" y="274" font-size="12" fill="#92400E" text-anchor="middle">Synchronous. Depends only on state.</text>
<text x="190" y="292" font-size="12" fill="#92400E" text-anchor="middle">Cannot read other canvas nodes.</text>
<rect x="400" y="230" width="340" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570" y="254" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">State-updating code</text>
<text x="570" y="274" font-size="12" fill="#047857" text-anchor="middle">Asynchronous. May use the Plugin API,</text>
<text x="570" y="292" font-size="12" fill="#047857" text-anchor="middle">network requests via an iframe, user input.</text>
</svg>
