<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One index, 3 primary shards + 1 replica each, on 3 nodes</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">index: products &#8226; number_of_shards: 3 (fixed) &#8226; number_of_replicas: 1 (dynamic)</text>

  <rect x="14" y="60" width="732" height="284" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="740" y="74" font-size="10" fill="#999999" text-anchor="end">one cluster</text>

  <!-- Node A -->
  <g>
    <rect x="28" y="86" width="224" height="238" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="46" y="112" font-size="14" font-weight="bold" fill="#222222">Node A</text>
    <text x="46" y="130" font-size="10.5" fill="#666666">data node</text>

    <rect x="46" y="140" width="188" height="74" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
    <text x="60" y="168" font-size="16" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">P0</text>
    <text x="60" y="188" font-size="11" fill="#666666">primary shard 0</text>
    <text x="60" y="205" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads + writes</text>

    <rect x="46" y="222" width="188" height="74" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="60" y="250" font-size="16" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">R1</text>
    <text x="60" y="270" font-size="11" fill="#666666">replica of primary 1</text>
    <text x="60" y="287" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads only</text>
  </g>

  <!-- Node B -->
  <g>
    <rect x="268" y="86" width="224" height="238" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="286" y="112" font-size="14" font-weight="bold" fill="#222222">Node B</text>
    <text x="286" y="130" font-size="10.5" fill="#666666">data node</text>

    <rect x="286" y="140" width="188" height="74" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
    <text x="300" y="168" font-size="16" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">P1</text>
    <text x="300" y="188" font-size="11" fill="#666666">primary shard 1</text>
    <text x="300" y="205" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads + writes</text>

    <rect x="286" y="222" width="188" height="74" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="300" y="250" font-size="16" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">R2</text>
    <text x="300" y="270" font-size="11" fill="#666666">replica of primary 2</text>
    <text x="300" y="287" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads only</text>
  </g>

  <!-- Node C -->
  <g>
    <rect x="508" y="86" width="224" height="238" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="526" y="112" font-size="14" font-weight="bold" fill="#222222">Node C</text>
    <text x="526" y="130" font-size="10.5" fill="#666666">data node</text>

    <rect x="526" y="140" width="188" height="74" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
    <text x="540" y="168" font-size="16" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">P2</text>
    <text x="540" y="188" font-size="11" fill="#666666">primary shard 2</text>
    <text x="540" y="205" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads + writes</text>

    <rect x="526" y="222" width="188" height="74" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="540" y="250" font-size="16" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">R0</text>
    <text x="540" y="270" font-size="11" fill="#666666">replica of primary 0</text>
    <text x="540" y="287" font-size="10" fill="#999999" font-family="'Courier New', monospace">serves reads only</text>
  </g>

  <!-- legend -->
  <rect x="28" y="356" width="16" height="12" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="52" y="366" font-size="11" fill="#222222">primary shard &#8212; the write copy; its number is fixed at index creation</text>
  <rect x="28" y="376" width="16" height="12" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="52" y="386" font-size="11" fill="#222222">replica shard &#8212; a full copy on another node; add or remove them any time</text>

  <text x="28" y="412" font-size="10.5" fill="#444444">No primary shares a node with its own replica &#8594; losing any one node still leaves every shard available (cluster stays green after recovery).</text>
</svg>
