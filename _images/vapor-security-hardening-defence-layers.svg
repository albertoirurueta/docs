<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where each security control sits on the way to a Vapor handler</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">cheap and coarse checks first (outside), checks that need the session or the route later (inside)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="70" width="170" height="250" rx="10" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="105" y="94" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">1. Edge</text>
  <text x="105" y="110" font-size="11" fill="#222222" text-anchor="middle">reverse proxy or load balancer</text>
  <text x="105" y="140" font-size="12" fill="#222222" text-anchor="middle">TLS termination</text>
  <text x="105" y="162" font-size="12" fill="#222222" text-anchor="middle">HTTP to HTTPS redirect</text>
  <text x="105" y="184" font-size="12" fill="#222222" text-anchor="middle">connection and body caps</text>
  <text x="105" y="206" font-size="12" fill="#222222" text-anchor="middle">coarse rate limit</text>
  <text x="105" y="228" font-size="12" fill="#222222" text-anchor="middle">X-Forwarded-For set here</text>

  <rect x="205" y="70" width="170" height="250" rx="10" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="290" y="94" font-size="14" font-weight="bold" fill="#b7410e" text-anchor="middle">2. Global middleware</text>
  <text x="290" y="110" font-size="11" fill="#222222" text-anchor="middle">before ErrorMiddleware</text>
  <text x="290" y="140" font-size="12" fill="#222222" text-anchor="middle">security headers</text>
  <text x="290" y="162" font-size="12" fill="#222222" text-anchor="middle">CORS allow-list</text>
  <text x="290" y="184" font-size="12" fill="#222222" text-anchor="middle">defaultMaxBodySize 64kb</text>
  <text x="290" y="206" font-size="12" fill="#222222" text-anchor="middle">ErrorMiddleware (no leaks)</text>

  <rect x="390" y="70" width="170" height="250" rx="10" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="475" y="94" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">3. Route group</text>
  <text x="475" y="110" font-size="11" fill="#222222" text-anchor="middle">only the routes in the group</text>
  <text x="475" y="140" font-size="12" fill="#222222" text-anchor="middle">RateLimitMiddleware</text>
  <text x="475" y="162" font-size="12" fill="#222222" text-anchor="middle">SessionsMiddleware</text>
  <text x="475" y="184" font-size="12" fill="#222222" text-anchor="middle">CSRF: origin, then token</text>
  <text x="475" y="206" font-size="12" fill="#222222" text-anchor="middle">authentication guard</text>

  <rect x="575" y="70" width="170" height="250" rx="10" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="660" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">4. Handler</text>
  <text x="660" y="110" font-size="11" fill="#222222" text-anchor="middle">per-route decisions</text>
  <text x="660" y="140" font-size="12" fill="#222222" text-anchor="middle">body: .collect(maxSize:)</text>
  <text x="660" y="162" font-size="12" fill="#222222" text-anchor="middle">input validation</text>
  <text x="660" y="184" font-size="12" fill="#222222" text-anchor="middle">upload signature check</text>
  <text x="660" y="206" font-size="12" fill="#222222" text-anchor="middle">ownership and role checks</text>
  <text x="660" y="228" font-size="12" fill="#222222" text-anchor="middle">bound Fluent queries</text>

  <rect x="760" y="70" width="160" height="250" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="840" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">5. Response</text>
  <text x="840" y="110" font-size="11" fill="#222222" text-anchor="middle">travelling outward</text>
  <text x="840" y="140" font-size="12" fill="#222222" text-anchor="middle">Set-Cookie: Secure,</text>
  <text x="840" y="158" font-size="12" fill="#222222" text-anchor="middle">HttpOnly, SameSite</text>
  <text x="840" y="184" font-size="12" fill="#222222" text-anchor="middle">CSP, nosniff, HSTS</text>
  <text x="840" y="206" font-size="12" fill="#222222" text-anchor="middle">RateLimit-* headers</text>
  <text x="840" y="228" font-size="12" fill="#222222" text-anchor="middle">generic error bodies</text>

  <line x1="190" y1="340" x2="205" y2="340" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="375" y1="340" x2="390" y2="340" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="340" x2="575" y2="340" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="745" y1="340" x2="760" y2="340" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="470" y="372" font-size="12" fill="#222222" text-anchor="middle">A request that fails in an outer layer never reaches the inner ones: forged requests still count against the rate limit,</text>
  <text x="470" y="390" font-size="12" fill="#222222" text-anchor="middle">because the limiter sits outside the CSRF check.</text>
</svg>
