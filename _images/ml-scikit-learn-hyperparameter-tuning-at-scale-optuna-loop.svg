<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">An Optuna study with pruning</title>
<desc id="d">A sampler proposes a parameter set for a trial, the trial trains an incremental model epoch by epoch and reports the validation score, a pruner either stops the trial early or lets it finish, and every trial is written to the study storage that the sampler reads for the next proposal and that several worker processes can share.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">One Optuna study: propose, train, report, prune</text>
<rect x="30" y="70" width="140" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="100" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Sampler</text>
<text x="100" y="117" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">TPESampler</text>
<rect x="215" y="70" width="170" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="300" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Trial</text>
<text x="300" y="117" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">suggest_float, partial_fit</text>
<rect x="430" y="70" width="140" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="500" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Pruner</text>
<text x="500" y="117" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">MedianPruner</text>
<rect x="590" y="70" width="100" height="64" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="640" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Stop</text>
<text x="640" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">TrialPruned</text>
<line x1="170" y1="102" x2="213" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="385" y1="102" x2="428" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="570" y1="102" x2="588" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="400" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">report(score, step)</text>
<path d="M500,134 L500,160 L300,160 L300,136" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="400" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">not pruned: next epoch</text>
<rect x="30" y="215" width="660" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Storage: every trial with its parameters, intermediate scores and state</text>
<text x="360" y="266" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">in memory, or sqlite:///study.db shared by several worker processes</text>
<path d="M100,215 L100,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="112" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">history informs</text>
<text x="112" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">the next proposal</text>
<path d="M640,134 L640,215" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
</svg>
