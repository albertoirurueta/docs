<svg viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Resource graph of the Bookshelf configuration: the network is created first, then PostgreSQL and Redis, then catalog-api and reviews-api, and finally web; the covers bucket is independent and only catalog-api waits for it</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="490" fill="#ffffff"/>
  <text x="350" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf resource graph</text>
  <text x="350" y="44" font-size="10.5" fill="#555555" text-anchor="middle">arrows point in creation order; on destroy the order is reversed</text>
  <line x1="435" y1="104" x2="300" y2="160" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="435" y1="104" x2="570" y2="160" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="285" y1="204" x2="285" y2="270" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="204" x2="540" y2="270" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="204" x2="585" y2="270" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="204" x2="330" y2="270" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="292" x2="210" y2="292" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="314" x2="400" y2="380" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="314" x2="470" y2="380" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="360" y="60" width="150" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="435.0" y="79" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">network</text>
  <text x="435.0" y="95" font-size="10" fill="#0d3c75" text-anchor="middle">docker_network</text>
  <rect x="210" y="160" width="150" height="44" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="285.0" y="179" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">postgres</text>
  <text x="285.0" y="195" font-size="10" fill="#5d4200" text-anchor="middle">docker_container</text>
  <rect x="510" y="160" width="150" height="44" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="585.0" y="179" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">redis</text>
  <text x="585.0" y="195" font-size="10" fill="#5d4200" text-anchor="middle">docker_container</text>
  <rect x="210" y="270" width="150" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="285.0" y="289" font-size="13" font-weight="bold" fill="#2e1a63" text-anchor="middle">catalog-api</text>
  <text x="285.0" y="305" font-size="10" fill="#2e1a63" text-anchor="middle">docker_container</text>
  <rect x="510" y="270" width="150" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="585.0" y="289" font-size="13" font-weight="bold" fill="#2e1a63" text-anchor="middle">reviews-api</text>
  <text x="585.0" y="305" font-size="10" fill="#2e1a63" text-anchor="middle">docker_container</text>
  <rect x="20" y="270" width="150" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="95.0" y="289" font-size="13" font-weight="bold" fill="#1b4d20" text-anchor="middle">covers bucket</text>
  <text x="95.0" y="305" font-size="10" fill="#1b4d20" text-anchor="middle">no upstream dependency</text>
  <rect x="360" y="380" width="150" height="44" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="435.0" y="399" font-size="13" font-weight="bold" fill="#6d0f35" text-anchor="middle">web</text>
  <text x="435.0" y="415" font-size="10" fill="#6d0f35" text-anchor="middle">docker_container</text>
  <text x="20" y="460" font-size="10.5" fill="#555555">Independent branches (for example the bucket and the network) can be applied in parallel.</text>
  <text x="20" y="476" font-size="10.5" fill="#555555">A resource waits only for the resources it references or lists in depends_on.</text>
</svg>
