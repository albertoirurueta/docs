<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="pbtPoCfgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a Poetry setting value comes from</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">The first source that defines the setting wins; credentials have two extra stores</text>

<!-- precedence column -->
<rect x="60" y="74" width="420" height="58" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="76" y="97" font-size="13" font-weight="bold" fill="#1c4b73">1. Environment variable</text>
<text x="76" y="118" font-size="11" fill="#333333" font-family="Courier New, monospace">POETRY_VIRTUALENVS_IN_PROJECT=true</text>
<rect x="60" y="146" width="420" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="76" y="169" font-size="13" font-weight="bold" fill="#333333">2. Project: poetry.toml</text>
<text x="76" y="190" font-size="11" fill="#444444" font-family="Courier New, monospace">poetry config --local virtualenvs.create false</text>
<rect x="60" y="218" width="420" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="76" y="241" font-size="13" font-weight="bold" fill="#333333">3. User: config.toml in the config directory</text>
<text x="76" y="262" font-size="11" fill="#444444" font-family="Courier New, monospace">poetry config virtualenvs.in-project true</text>
<rect x="60" y="290" width="420" height="58" fill="#fff4e0" stroke="#a65e00"/>
<text x="76" y="313" font-size="13" font-weight="bold" fill="#7a4500">4. Built-in default</text>
<text x="76" y="334" font-size="11" fill="#444444">as printed by poetry config --list</text>
<line x1="270" y1="132" x2="270" y2="144" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtPoCfgArrow)"/>
<line x1="270" y1="204" x2="270" y2="216" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtPoCfgArrow)"/>
<line x1="270" y1="276" x2="270" y2="288" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtPoCfgArrow)"/>
<text x="40" y="214" font-size="11" fill="#555555" text-anchor="middle" transform="rotate(-90 40 214)">not set here: look further down</text>

<!-- credentials -->
<text x="700" y="88" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">CREDENTIALS (http-basic, pypi-token)</text>
<rect x="540" y="104" width="320" height="52" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="556" y="126" font-size="12" font-weight="bold" fill="#1c4b73">Environment variable</text>
<text x="556" y="144" font-size="11" fill="#333333" font-family="Courier New, monospace">POETRY_HTTP_BASIC_&lt;NAME&gt;_PASSWORD</text>
<rect x="540" y="172" width="320" height="52" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="556" y="194" font-size="12" font-weight="bold" fill="#1b5e20">System keyring</text>
<text x="556" y="212" font-size="11" fill="#333333">service poetry-repository-&lt;name&gt;</text>
<rect x="540" y="240" width="320" height="52" fill="#f5f5f5" stroke="#777777"/>
<text x="556" y="262" font-size="12" font-weight="bold" fill="#333333">auth.toml (plaintext)</text>
<text x="556" y="280" font-size="11" fill="#444444">when no keyring, or keyring.enabled = false</text>
<line x1="700" y1="156" x2="700" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtPoCfgArrow)"/>
<line x1="700" y1="224" x2="700" y2="238" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtPoCfgArrow)"/>
<text x="700" y="330" font-size="11" fill="#666666" text-anchor="middle">poetry config http-basic stored them in auth.toml, not config.toml</text>
</svg>
