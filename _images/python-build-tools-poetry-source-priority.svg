<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="pbtSrcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which package sources Poetry searches for a dependency</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Within each priority class, sources are tried in the order they appear in pyproject.toml</text>

<!-- start -->
<rect x="350" y="66" width="260" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
<text x="480" y="93" font-size="13" font-weight="bold" fill="#0d3c7a" text-anchor="middle">Dependency to resolve</text>
<line x1="480" y1="110" x2="480" y2="132" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtSrcArrow)"/>

<!-- decision -->
<polygon points="480,134 640,170 480,206 320,170" fill="#fffde7" stroke="#8d6e00"/>
<text x="480" y="166" font-size="12" font-weight="bold" fill="#5d4600" text-anchor="middle">source = "name"</text>
<text x="480" y="182" font-size="12" font-weight="bold" fill="#5d4600" text-anchor="middle">on the dependency?</text>

<!-- yes branch -->
<line x1="640" y1="170" x2="700" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtSrcArrow)"/>
<text x="668" y="162" font-size="11" fill="#444444" text-anchor="middle">yes</text>
<rect x="702" y="130" width="230" height="80" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="817" y="154" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Only that source</text>
<text x="817" y="174" font-size="11" fill="#333333" text-anchor="middle">any priority, even explicit;</text>
<text x="817" y="190" font-size="11" fill="#333333" text-anchor="middle">no other source is asked</text>

<!-- no branch -->
<line x1="480" y1="206" x2="480" y2="236" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtSrcArrow)"/>
<text x="492" y="226" font-size="11" fill="#444444">no</text>

<rect x="200" y="238" width="560" height="62" fill="#f5f5f5" stroke="#777777"/>
<text x="216" y="260" font-size="13" font-weight="bold" fill="#333333">1. Primary sources (all of them are queried)</text>
<text x="216" y="282" font-size="11" fill="#444444">or the implicit PyPI, only while no primary source is configured</text>
<line x1="480" y1="300" x2="480" y2="322" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtSrcArrow)"/>
<text x="492" y="316" font-size="11" fill="#444444">no compatible distribution found</text>

<rect x="200" y="324" width="560" height="62" fill="#f5f5f5" stroke="#777777"/>
<text x="216" y="346" font-size="13" font-weight="bold" fill="#333333">2. Supplemental sources (until one has it)</text>
<text x="216" y="368" font-size="11" fill="#444444">PyPI too, when it was added back with --priority=supplemental</text>

<!-- explicit note -->
<rect x="28" y="130" width="250" height="80" fill="#fbe9e7" stroke="#bf360c"/>
<text x="153" y="154" font-size="13" font-weight="bold" fill="#8a2500" text-anchor="middle">Explicit sources</text>
<text x="153" y="174" font-size="11" fill="#333333" text-anchor="middle">never searched unless a</text>
<text x="153" y="190" font-size="11" fill="#333333" text-anchor="middle">dependency names them</text>

<text x="480" y="418" font-size="11" fill="#666666" text-anchor="middle">Source keys are not inherited: a dependency of a dependency is looked up by these rules again</text>
</svg>
