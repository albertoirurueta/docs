<svg viewBox="0 0 760 320" width="760" height="320" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A slice and slash-separated names become folders</text>
<rect x="30" y="50" width="300" height="250" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="46" y="72" font-size="12" fill="#374151">Frame: Bookshelf header</text>
<rect x="50" y="90" width="260" height="170" rx="6" fill="#EEF2FF" stroke="#E5E7EB"/>
<rect x="70" y="110" width="60" height="80" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><rect x="140" y="110" width="60" height="80" rx="4" fill="#FFFFFF" stroke="#4F46E5"/>
<rect x="60" y="100" width="150" height="100" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>
<text x="62" y="218" font-size="12" font-weight="bold" fill="#92400E">Slice: only this area is exported</text>
<text x="62" y="240" font-size="12" fill="#374151">Padding stays fixed when shapes resize.</text>
<path d="M340,175 L400,175" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="410" y="50" width="320" height="250" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="426" y="76" font-size="13" font-weight="bold" fill="#1F2937">Layer names</text>
<text x="426" y="100" font-size="12" fill="#374151">icons/shelf/add</text><text x="426" y="118" font-size="12" fill="#374151">icons/shelf/remove</text>
<text x="426" y="152" font-size="13" font-weight="bold" fill="#1F2937">Exported structure</text>
<g font-size="12" fill="#3730A3"><text x="426" y="176">icons/</text><text x="446" y="194">shelf/</text><text x="466" y="212">add@2x.png</text><text x="466" y="230">add@3x.png</text><text x="466" y="248">remove@2x.png</text><text x="466" y="266">remove@3x.png</text></g>
</svg>
