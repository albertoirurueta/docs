<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="16.5" font-weight="bold" fill="#222222" text-anchor="middle">Keeping a write and its published event consistent: three options</text>

  <!-- column headers -->
  <rect x="30" y="50" width="180" height="46" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.4"/>
  <text x="120" y="78" font-size="11.5" font-weight="bold" fill="#444444" text-anchor="middle">Concern</text>

  <rect x="212" y="50" width="180" height="46" rx="6" fill="#fbecea" stroke="#a8412e" stroke-width="1.8"/>
  <text x="302" y="70" font-size="11.5" font-weight="bold" fill="#a8412e" text-anchor="middle">Plain synchronous call</text>
  <text x="302" y="86" font-size="9" fill="#a8412e" text-anchor="middle">inline publish inside the request</text>

  <rect x="394" y="50" width="180" height="46" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="484" y="70" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Transactional outbox</text>
  <text x="484" y="86" font-size="9" fill="#1c4b73" text-anchor="middle">write together, relay after</text>

  <rect x="576" y="50" width="174" height="46" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="663" y="70" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Listen to yourself</text>
  <text x="663" y="86" font-size="9" fill="#2d6a34" text-anchor="middle">publish first, apply second</text>

  <!-- row 1: dual-write safety -->
  <rect x="30" y="100" width="180" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="42" y="124" font-size="10.5" fill="#333333">Safe against the</text>
  <text x="42" y="138" font-size="10.5" fill="#333333">dual-write problem</text>

  <rect x="212" y="100" width="180" height="60" fill="#fdf3f1" stroke="#dddddd" stroke-width="1"/>
  <text x="302" y="126" font-size="10" fill="#a8412e" text-anchor="middle" font-weight="bold">No</text>
  <text x="302" y="142" font-size="9" fill="#666666" text-anchor="middle">commit and publish can still</text>
  <text x="302" y="154" font-size="9" fill="#666666" text-anchor="middle">tear apart independently</text>

  <rect x="394" y="100" width="180" height="60" fill="#f4f8fb" stroke="#dddddd" stroke-width="1"/>
  <text x="484" y="126" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="484" y="142" font-size="9" fill="#666666" text-anchor="middle">one local transaction covers</text>
  <text x="484" y="154" font-size="9" fill="#666666" text-anchor="middle">the aggregate and the event</text>

  <rect x="576" y="100" width="174" height="60" fill="#f2f8f2" stroke="#dddddd" stroke-width="1"/>
  <text x="663" y="126" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="663" y="142" font-size="9" fill="#666666" text-anchor="middle">only one write happens at all,</text>
  <text x="663" y="154" font-size="9" fill="#666666" text-anchor="middle">and it is the publish itself</text>

  <!-- row 2: extra infrastructure -->
  <rect x="30" y="160" width="180" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="42" y="184" font-size="10.5" fill="#333333">Extra infrastructure</text>
  <text x="42" y="198" font-size="10.5" fill="#333333">needed</text>

  <rect x="212" y="160" width="180" height="60" fill="#fdf3f1" stroke="#dddddd" stroke-width="1"/>
  <text x="302" y="186" font-size="10" fill="#a8412e" text-anchor="middle" font-weight="bold">None</text>
  <text x="302" y="202" font-size="9" fill="#666666" text-anchor="middle">which is exactly the problem</text>

  <rect x="394" y="160" width="180" height="60" fill="#f4f8fb" stroke="#dddddd" stroke-width="1"/>
  <text x="484" y="186" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">Outbox table + relay</text>
  <text x="484" y="202" font-size="9" fill="#666666" text-anchor="middle">poller or CDC connector</text>

  <rect x="576" y="160" width="174" height="60" fill="#f2f8f2" stroke="#dddddd" stroke-width="1"/>
  <text x="663" y="186" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">None</text>
  <text x="663" y="202" font-size="9" fill="#666666" text-anchor="middle">the topic already exists for</text>
  <text x="663" y="214" font-size="9" fill="#666666" text-anchor="middle">every other consumer</text>

  <!-- row 3: read-your-writes -->
  <rect x="30" y="220" width="180" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="42" y="244" font-size="10.5" fill="#333333">Read-your-writes</text>
  <text x="42" y="258" font-size="10.5" fill="#333333">on response</text>

  <rect x="212" y="220" width="180" height="60" fill="#fdf3f1" stroke="#dddddd" stroke-width="1"/>
  <text x="302" y="246" font-size="10" fill="#a8412e" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="302" y="262" font-size="9" fill="#666666" text-anchor="middle">but only by accident of</text>
  <text x="302" y="274" font-size="9" fill="#666666" text-anchor="middle">being unsafe elsewhere</text>

  <rect x="394" y="220" width="180" height="60" fill="#f4f8fb" stroke="#dddddd" stroke-width="1"/>
  <text x="484" y="246" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="484" y="262" font-size="9" fill="#666666" text-anchor="middle">aggregate saved synchronously,</text>
  <text x="484" y="274" font-size="9" fill="#666666" text-anchor="middle">201 Created with the resource</text>

  <rect x="576" y="220" width="174" height="60" fill="#f2f8f2" stroke="#dddddd" stroke-width="1"/>
  <text x="663" y="246" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">No</text>
  <text x="663" y="262" font-size="9" fill="#666666" text-anchor="middle">local row created only after</text>
  <text x="663" y="274" font-size="9" fill="#666666" text-anchor="middle">the self-consumer runs</text>

  <!-- row 4: response shape -->
  <rect x="30" y="280" width="180" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="42" y="304" font-size="10.5" fill="#333333">HTTP response</text>
  <text x="42" y="318" font-size="10.5" fill="#333333">on success</text>

  <rect x="212" y="280" width="180" height="60" fill="#fdf3f1" stroke="#dddddd" stroke-width="1"/>
  <text x="302" y="310" font-size="11" fill="#a8412e" text-anchor="middle" font-weight="bold">201 Created</text>
  <text x="302" y="326" font-size="9" fill="#666666" text-anchor="middle">may be a lie under failure</text>

  <rect x="394" y="280" width="180" height="60" fill="#f4f8fb" stroke="#dddddd" stroke-width="1"/>
  <text x="484" y="310" font-size="11" fill="#1c4b73" text-anchor="middle" font-weight="bold">201 Created</text>
  <text x="484" y="326" font-size="9" fill="#666666" text-anchor="middle">with the saved order body</text>

  <rect x="576" y="280" width="174" height="60" fill="#f2f8f2" stroke="#dddddd" stroke-width="1"/>
  <text x="663" y="310" font-size="11" fill="#2d6a34" text-anchor="middle" font-weight="bold">202 Accepted</text>
  <text x="663" y="326" font-size="9" fill="#666666" text-anchor="middle">no resource body yet</text>

  <!-- footer verdict -->
  <rect x="30" y="352" width="720" height="70" rx="8" fill="#fdf9ee" stroke="#a66a1e" stroke-width="1.6"/>
  <text x="390" y="374" font-size="10.5" fill="#5a4522" text-anchor="middle">Plain synchronous publish is never a safe default -- it reintroduces the dual-write problem for no benefit.</text>
  <text x="390" y="391" font-size="10.5" fill="#5a4522" text-anchor="middle">Choose the outbox when callers need read-your-writes and a synchronous confirmation; choose listen-to-yourself</text>
  <text x="390" y="408" font-size="10.5" fill="#5a4522" text-anchor="middle">when write throughput matters more than an immediate answer and the command is naturally asynchronous.</text>
</svg>
