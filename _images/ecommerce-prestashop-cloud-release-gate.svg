<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Three kinds of Pocket Coffee PrestaShop release and the ways back</title>
  <desc id="d">Three horizontal lanes show how a release of the Pocket Coffee PrestaShop shop on Kubernetes differs by kind. The first lane is a release that only changes code, a theme or a module without schema changes: build the image tagged with the git SHA, take an RDS snapshot, run the pre-upgrade migrate Job that upgrades the modules as the migration database user, roll out the new pods, whose init container warms the cache, and verify; no maintenance mode is needed. The second lane is a module release with a schema change, which follows the same steps but the upgrade script must be additive so the old pods keep working while the Job runs. The third lane is a PrestaShop core upgrade: freeze and snapshot, maintenance mode on, a core Job that runs the Update Assistant against a disposable copy of the old image with the release archive, the migrate Job of the new image, a rolling update, verification and maintenance mode off. At the bottom two ways back are shown: helm rollback returns the code only, and restoring the snapshot into a new RDS instance returns the database but loses the orders placed after the snapshot.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="38" font-size="18" font-weight="bold" fill="#f4b860">Release kinds: the database step decides how much ceremony a release needs</text>
  <text x="30" y="66" font-size="14" font-weight="bold" fill="#f4b860">1  Code, theme or module without schema change</text>
  <text x="930" y="66" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="end">rolling, no maintenance mode</text>
  <rect x="30" y="76" width="167.2" height="92" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="113.6" y="96" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Build</text>
  <text x="113.6" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">image tag git SHA</text>
  <text x="113.6" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">modules + theme</text>
  <text x="113.6" y="146" font-size="12" fill="#9fd3c7" text-anchor="middle">push to ECR</text>
  <line x1="198.2" y1="122" x2="212.2" y2="122" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="213.2" y="76" width="167.2" height="92" rx="8" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="2"/>
  <text x="296.79999999999995" y="96" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Snapshot</text>
  <text x="296.79999999999995" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS manual</text>
  <text x="296.79999999999995" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-pre-</text>
  <text x="296.79999999999995" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">git SHA</text>
  <line x1="381.4" y1="122" x2="395.4" y2="122" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="396.4" y="76" width="167.2" height="92" rx="8" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
  <text x="480.0" y="96" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Migrate Job</text>
  <text x="480.0" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">pre-upgrade hook</text>
  <text x="480.0" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">module install/upgrade</text>
  <text x="480.0" y="146" font-size="12" fill="#f4b860" text-anchor="middle">as ps_migrate</text>
  <line x1="564.5999999999999" y1="122" x2="578.5999999999999" y2="122" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="579.5999999999999" y="76" width="167.2" height="92" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="663.1999999999999" y="96" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Roll out</text>
  <text x="663.1999999999999" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">rolling update</text>
  <text x="663.1999999999999" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">init: cache:warmup</text>
  <text x="663.1999999999999" y="146" font-size="12" fill="#9fd3c7" text-anchor="middle">PDB respected</text>
  <line x1="747.8" y1="122" x2="761.8" y2="122" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="762.8" y="76" width="167.2" height="92" rx="8" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
  <text x="846.4" y="96" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Verify</text>
  <text x="846.4" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">smoke URLs</text>
  <text x="846.4" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">modules active</text>
  <text x="846.4" y="146" font-size="12" fill="#9fd3c7" text-anchor="middle">no maintenance</text>
  <text x="30" y="210" font-size="14" font-weight="bold" fill="#f4b860">2  Module release with a schema change</text>
  <text x="930" y="210" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="end">rolling, additive only</text>
  <rect x="30" y="220" width="167.2" height="92" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="113.6" y="240" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Expand</text>
  <text x="113.6" y="258" font-size="12" fill="#f2f5f8" text-anchor="middle">additive upgrade</text>
  <text x="113.6" y="274" font-size="12" fill="#f2f5f8" text-anchor="middle">script: new column</text>
  <text x="113.6" y="290" font-size="12" fill="#f2f5f8" text-anchor="middle">nullable, new table</text>
  <line x1="198.2" y1="266" x2="212.2" y2="266" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="213.2" y="220" width="167.2" height="92" rx="8" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="2"/>
  <text x="296.79999999999995" y="240" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Snapshot</text>
  <text x="296.79999999999995" y="258" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS manual</text>
  <text x="296.79999999999995" y="274" font-size="12" fill="#f2f5f8" text-anchor="middle">before the Job</text>
  <text x="296.79999999999995" y="290" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <line x1="381.4" y1="266" x2="395.4" y2="266" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="396.4" y="220" width="167.2" height="92" rx="8" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
  <text x="480.0" y="240" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Migrate Job</text>
  <text x="480.0" y="258" font-size="12" fill="#f2f5f8" text-anchor="middle">old pods keep serving</text>
  <text x="480.0" y="274" font-size="12" fill="#f2f5f8" text-anchor="middle">on the new schema</text>
  <text x="480.0" y="290" font-size="12" fill="#f4b860" text-anchor="middle">as ps_migrate</text>
  <line x1="564.5999999999999" y1="266" x2="578.5999999999999" y2="266" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="579.5999999999999" y="220" width="167.2" height="92" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="663.1999999999999" y="240" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Roll out</text>
  <text x="663.1999999999999" y="258" font-size="12" fill="#f2f5f8" text-anchor="middle">new code reads</text>
  <text x="663.1999999999999" y="274" font-size="12" fill="#f2f5f8" text-anchor="middle">and writes the column</text>
  <text x="663.1999999999999" y="290" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <line x1="747.8" y1="266" x2="761.8" y2="266" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="762.8" y="220" width="167.2" height="92" rx="8" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
  <text x="846.4" y="240" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Contract</text>
  <text x="846.4" y="258" font-size="12" fill="#f2f5f8" text-anchor="middle">drop the old column</text>
  <text x="846.4" y="274" font-size="12" fill="#f2f5f8" text-anchor="middle">in a later release</text>
  <text x="846.4" y="290" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <text x="30" y="354" font-size="14" font-weight="bold" fill="#f4b860">3  PrestaShop core upgrade</text>
  <text x="930" y="354" font-size="12" font-weight="bold" fill="#f4b860" text-anchor="end">maintenance window</text>
  <rect x="30" y="364" width="136.66666666666666" height="92" rx="8" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="2"/>
  <text x="98.33333333333333" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Freeze + snapshot</text>
  <text x="98.33333333333333" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">calendar gate</text>
  <text x="98.33333333333333" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS manual</text>
  <text x="98.33333333333333" y="434" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <line x1="167.66666666666666" y1="410" x2="181.66666666666666" y2="410" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="182.66666666666666" y="364" width="136.66666666666666" height="92" rx="8" fill="#7a5c3a" stroke="#f4b860" stroke-width="2"/>
  <text x="251.0" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Maintenance on</text>
  <text x="251.0" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">PS_SHOP_ENABLE=0</text>
  <text x="251.0" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">PS_MAINTENANCE_IP</text>
  <text x="251.0" y="434" font-size="12" fill="#f4b860" text-anchor="middle">503 + Retry-After</text>
  <line x1="320.3333333333333" y1="410" x2="334.3333333333333" y2="410" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="335.3333333333333" y="364" width="136.66666666666666" height="92" rx="8" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
  <text x="403.66666666666663" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Core Job</text>
  <text x="403.66666666666663" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">old image, copy of tree</text>
  <text x="403.66666666666663" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">Update Assistant</text>
  <text x="403.66666666666663" y="434" font-size="12" fill="#f4b860" text-anchor="middle">local archive</text>
  <line x1="473.0" y1="410" x2="487.0" y2="410" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="488.0" y="364" width="136.66666666666666" height="92" rx="8" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
  <text x="556.3333333333334" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Migrate Job</text>
  <text x="556.3333333333334" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">new image</text>
  <text x="556.3333333333334" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">version gate</text>
  <text x="556.3333333333334" y="434" font-size="12" fill="#f2f5f8" text-anchor="middle">modules</text>
  <line x1="625.6666666666666" y1="410" x2="639.6666666666666" y2="410" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="640.6666666666666" y="364" width="136.66666666666666" height="92" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="709.0" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Roll out</text>
  <text x="709.0" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">rolling update</text>
  <text x="709.0" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">warm-up</text>
  <text x="709.0" y="434" font-size="12" fill="#f2f5f8" text-anchor="middle">verify</text>
  <line x1="778.3333333333333" y1="410" x2="792.3333333333333" y2="410" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="793.3333333333333" y="364" width="136.66666666666666" height="92" rx="8" fill="#7a5c3a" stroke="#f4b860" stroke-width="2"/>
  <text x="861.6666666666666" y="384" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Maintenance off</text>
  <text x="861.6666666666666" y="402" font-size="12" fill="#f2f5f8" text-anchor="middle">only after</text>
  <text x="861.6666666666666" y="418" font-size="12" fill="#f2f5f8" text-anchor="middle">the smoke test</text>
  <text x="861.6666666666666" y="434" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <rect x="30" y="476" width="430" height="64" rx="8" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
  <text x="245" y="498" font-size="12.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Way back 1: helm rollback</text>
  <text x="245" y="516" font-size="12" fill="#f2f5f8" text-anchor="middle">previous image, code only; safe while the schema is additive</text>
  <text x="245" y="532" font-size="12" fill="#f2f5f8" text-anchor="middle">it does not run the Jobs and never reverts the database</text>
  <rect x="500" y="476" width="430" height="64" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="2"/>
  <text x="715" y="498" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Way back 2: restore the snapshot to a new instance</text>
  <text x="715" y="516" font-size="12" fill="#f2f5f8" text-anchor="middle">database returns to the snapshot, orders placed since are lost</text>
  <text x="715" y="532" font-size="12" fill="#f2f5f8" text-anchor="middle">point database.host at the new endpoint, reconcile payments</text>
</svg>
