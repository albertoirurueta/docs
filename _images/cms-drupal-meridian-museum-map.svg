<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Meridian Museum site map</title>
<desc id="d">The Meridian Museum Drupal site: a content model, the meridian theme, the meridian_collection module and the meridian_events recipe feed one site, which a Next.js JSON:API kiosk and an MCP server for AI agents consume.</desc>
<rect width="960" height="680" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5a6a"/></marker></defs>
<g stroke="#4a5a6a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M270 130 L395 215"/><path d="M690 130 L565 215"/><path d="M270 470 L395 385"/><path d="M690 470 L565 385"/>
<path d="M565 300 L650 300"/><path d="M480 385 L480 565"/>
</g>
<rect x="395" y="215" width="170" height="170" rx="85" fill="#e8f1fb" stroke="#2a6bb0" stroke-width="3"/>
<text x="480" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a">Meridian</text><text x="480" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a">Museum site</text><text x="480" y="336" text-anchor="middle" font-size="12" fill="#2c3e50">Drupal 11.4, PHP 8.3+</text>
<rect x="60" y="60" width="330" height="110" rx="10" fill="#fdf3e0" stroke="#c9892b" stroke-width="2"/>
<text x="225.0" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Content model</text>
<text x="225.0" y="110" text-anchor="middle" font-size="13" fill="#2c3e50">exhibition, event, news, basic page</text>
<text x="225.0" y="128" text-anchor="middle" font-size="13" fill="#2c3e50">collection_object entity (accession_number,</text>
<text x="225.0" y="146" text-anchor="middle" font-size="13" fill="#2c3e50">period, material, on_display)</text>
<text x="225.0" y="164" text-anchor="middle" font-size="13" fill="#2c3e50">topic and gallery vocabularies, media</text>
<rect x="570" y="60" width="330" height="110" rx="10" fill="#e9f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="735.0" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Theme: meridian</text>
<text x="735.0" y="110" text-anchor="middle" font-size="13" fill="#2c3e50">Starterkit sub-theme, Twig templates</text>
<text x="735.0" y="128" text-anchor="middle" font-size="13" fill="#2c3e50">SDC: card, hero, exhibition-teaser,</text>
<text x="735.0" y="146" text-anchor="middle" font-size="13" fill="#2c3e50">opening-hours; responsive images</text>
<text x="735.0" y="164" text-anchor="middle" font-size="13" fill="#2c3e50">Canvas code component ticket-banner</text>
<rect x="60" y="430" width="330" height="110" rx="10" fill="#f3ebfa" stroke="#7b4fa8" stroke-width="2"/>
<text x="225.0" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Module: meridian_collection</text>
<text x="225.0" y="480" text-anchor="middle" font-size="13" fill="#2c3e50">custom entity, routes, settings form</text>
<text x="225.0" y="498" text-anchor="middle" font-size="13" fill="#2c3e50">OOP hooks, event subscriber, queue worker</text>
<text x="225.0" y="516" text-anchor="middle" font-size="13" fill="#2c3e50">block "On display now", Drush meridian:sync</text>
<text x="225.0" y="534" text-anchor="middle" font-size="13" fill="#2c3e50">Update API, Migrate CSV source, access policy</text>
<rect x="570" y="430" width="330" height="110" rx="10" fill="#fbeaea" stroke="#b84a4a" stroke-width="2"/>
<text x="735.0" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Recipe: meridian_events</text>
<text x="735.0" y="480" text-anchor="middle" font-size="13" fill="#2c3e50">recipe.yml: content type, fields, view,</text>
<text x="735.0" y="498" text-anchor="middle" font-size="13" fill="#2c3e50">permissions; applied to a fresh site</text>
<text x="735.0" y="516" text-anchor="middle" font-size="13" fill="#2c3e50">roles: Administrator, Editor, Curator,</text>
<text x="735.0" y="534" text-anchor="middle" font-size="13" fill="#2c3e50">Reviewer, Member</text>
<rect x="650" y="250" width="270" height="100" rx="10" fill="#e6f4f7" stroke="#2a8a9c" stroke-width="2"/>
<text x="785.0" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">JSON:API gallery kiosk</text>
<text x="785.0" y="300" text-anchor="middle" font-size="13" fill="#2c3e50">Next.js front end, Simple OAuth</text>
<text x="785.0" y="318" text-anchor="middle" font-size="13" fill="#2c3e50">reads exhibitions and objects</text>
<rect x="330" y="565" width="300" height="100" rx="10" fill="#f4f4e2" stroke="#8a8a2a" stroke-width="2"/>
<text x="480.0" y="591" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">AI and MCP</text>
<text x="480.0" y="615" text-anchor="middle" font-size="13" fill="#2c3e50">AI module: alt-text generation</text>
<text x="480.0" y="633" text-anchor="middle" font-size="13" fill="#2c3e50">MCP Server: collection search for agents</text>
</svg>
