<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Pixel Arena architecture: browser clients send input batches at 60 Hz and receive snapshots at 20 Hz from an authoritative game server whose tick loop applies inputs, simulates, filters by interest and encodes deltas, while a lobby and matchmaker create rooms over a reliable WebSocket</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Pixel Arena: authoritative server, dumb clients</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">inputs go up at 60 Hz, snapshots come down at 20 Hz, the server tick is 50 ms</text>

  <rect x="20" y="70" width="230" height="170" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="135" y="94" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser client (60 Hz render)</text>
  <text x="135" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">1. sample keys, stamp input seq</text>
  <text x="135" y="138" font-size="10.5" fill="#0d3c75" text-anchor="middle">2. predict own player locally</text>
  <text x="135" y="158" font-size="10.5" fill="#0d3c75" text-anchor="middle">3. reconcile on lastProcessedInput</text>
  <text x="135" y="178" font-size="10.5" fill="#0d3c75" text-anchor="middle">4. interpolate others, 100 ms behind</text>
  <text x="135" y="198" font-size="10.5" fill="#0d3c75" text-anchor="middle">5. draw on canvas 1280 x 720</text>
  <text x="135" y="224" font-size="10" fill="#0d3c75" text-anchor="middle">holds no authority over the world</text>

  <rect x="20" y="290" width="230" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="135" y="314" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Lobby UI</text>
  <text x="135" y="338" font-size="10.5" fill="#0d3c75" text-anchor="middle">list rooms, create, join, ready</text>
  <text x="135" y="358" font-size="10.5" fill="#0d3c75" text-anchor="middle">reliable JSON over WebSocket</text>
  <text x="135" y="378" font-size="10.5" fill="#0d3c75" text-anchor="middle">same socket or a separate one</text>

  <rect x="310" y="70" width="270" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="445" y="94" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Game room (authoritative, 20 Hz)</text>
  <text x="445" y="118" font-size="10.5" fill="#1b4d1f" text-anchor="middle">a. drain input queues, drop old seq</text>
  <text x="445" y="138" font-size="10.5" fill="#1b4d1f" text-anchor="middle">b. simulate 50 ms: move, collide, fire</text>
  <text x="445" y="158" font-size="10.5" fill="#1b4d1f" text-anchor="middle">c. keep 1 s of history for rewind</text>
  <text x="445" y="178" font-size="10.5" fill="#1b4d1f" text-anchor="middle">d. interest filter per client</text>
  <text x="445" y="198" font-size="10.5" fill="#1b4d1f" text-anchor="middle">e. delta-encode against acked baseline</text>
  <text x="445" y="224" font-size="10" fill="#1b4d1f" text-anchor="middle">uWebSockets.js or Colyseus room</text>

  <rect x="310" y="290" width="270" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="445" y="314" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Lobby and matchmaker</text>
  <text x="445" y="338" font-size="10.5" fill="#1b4d1f" text-anchor="middle">room registry, capacity, skill buckets</text>
  <text x="445" y="358" font-size="10.5" fill="#1b4d1f" text-anchor="middle">hands the client a room id and a ticket</text>
  <text x="445" y="378" font-size="10.5" fill="#1b4d1f" text-anchor="middle">spawns or reuses a game room</text>

  <rect x="640" y="290" width="140" height="110" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="710" y="314" font-size="13" font-weight="bold" fill="#7a3200" text-anchor="middle">Shared store</text>
  <text x="710" y="338" font-size="10.5" fill="#7a3200" text-anchor="middle">Redis: rooms,</text>
  <text x="710" y="356" font-size="10.5" fill="#7a3200" text-anchor="middle">presence, queue</text>
  <text x="710" y="378" font-size="10.5" fill="#7a3200" text-anchor="middle">across servers</text>

  <line x1="250" y1="130" x2="310" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="190" x2="250" y2="190" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="122" font-size="9.5" fill="#37474f" text-anchor="middle">input 60 Hz</text>
  <text x="280" y="206" font-size="9.5" fill="#37474f" text-anchor="middle">snapshot 20 Hz</text>
  <line x1="250" y1="345" x2="310" y2="345" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="445" y1="290" x2="445" y2="240" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="520" y="268" font-size="9.5" fill="#37474f" text-anchor="middle">create room, add player</text>
  <line x1="580" y1="345" x2="640" y2="345" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="424" font-size="10" fill="#555555" text-anchor="middle">Solid arrows: traffic between components. Dashed arrow: server-internal control. Lobby traffic must be reliable and ordered; game traffic tolerates loss.</text>
</svg>
