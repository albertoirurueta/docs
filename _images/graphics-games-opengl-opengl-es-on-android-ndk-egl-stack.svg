<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-es-on-android-ndk-egl-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Native OpenGL ES on Android: from Kotlin to the GPU</text>
<rect x="20" y="56" width="440" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240.0" y="85.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Kotlin: Activity + SurfaceView (SurfaceHolder.Callback)</text>
<line x1="240" y1="106" x2="240" y2="122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="20" y="122" width="440" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240.0" y="151.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">JNI: ANativeWindow_fromSurface(env, surface)</text>
<line x1="240" y1="172" x2="240" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="20" y="188" width="440" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240.0" y="217.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">C++ render thread: EGL setup, GLES calls, eglSwapBuffers</text>
<line x1="240" y1="238" x2="240" y2="254" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="20" y="254" width="440" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240.0" y="283.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">libEGL.so and libGLESv3.so (the system loader)</text>
<line x1="140" y1="304" x2="140" y2="324" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<line x1="340" y1="304" x2="340" y2="324" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="20" y="324" width="230" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="135.0" y="353.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Vendor GLES driver</text>
<rect x="270" y="324" width="190" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="365.0" y="353.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">ANGLE (GLES on Vulkan)</text>
<line x1="365" y1="374" x2="365" y2="394" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="270" y="394" width="190" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="365.0" y="420.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vendor Vulkan driver</text>
<line x1="135" y1="374" x2="135" y2="394" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="20" y="394" width="230" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="420.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">GPU</text>
<line x1="270" y1="416" x2="252" y2="416" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-ndk-egl-stack)"/>
<rect x="490" y="56" width="250" height="330" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="615" y="80" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">EGL call order</text>
<circle cx="512" cy="108" r="11" fill="#4F46E5"/>
<text x="512" y="112.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="530" y="112" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglGetDisplay(EGL_DEFAULT_DISPLAY)</text>
<circle cx="512" cy="146" r="11" fill="#4F46E5"/>
<text x="512" y="150.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="530" y="150" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglInitialize</text>
<circle cx="512" cy="184" r="11" fill="#4F46E5"/>
<text x="512" y="188.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="530" y="188" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglChooseConfig (ES3 bit)</text>
<circle cx="512" cy="222" r="11" fill="#4F46E5"/>
<text x="512" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="530" y="226" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglCreateWindowSurface(window)</text>
<circle cx="512" cy="260" r="11" fill="#4F46E5"/>
<text x="512" y="264.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="530" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglCreateContext (client version 3)</text>
<circle cx="512" cy="298" r="11" fill="#4F46E5"/>
<text x="512" y="302.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="530" y="302" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eglMakeCurrent(display, surface...)</text>
<circle cx="512" cy="336" r="11" fill="#4F46E5"/>
<text x="512" y="340.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="530" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">draw, then eglSwapBuffers</text>
<text x="380" y="455" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">GLSurfaceView does steps 1 to 6 for you; in native code you own them and the thread they run on.</text>
</svg>
