<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Purple, a block theme, compared with Storefront, a classic theme</title>
  <desc id="d">A two column comparison read from the theme files installed on the test store. Purple 1.0.3 is a block theme that requires WordPress 7.1, PHP 7.4 and WooCommerce 11.1, ships 19 HTML templates, 11 template parts, 63 patterns, 9 colour variations and 10 typography variations, and is edited in the Site Editor with theme.json. Storefront 4.6.2 is a classic theme that requires PHP 5.6, declares tested up to WordPress 6.7, ships PHP templates, defines 51 storefront action hooks, and is customised in the Customizer, with child themes, hooks and woocommerce folder overrides.</desc>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Purple (block) and Storefront (classic), as installed on the test store</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Counts are taken from the theme files of Purple 1.0.3 and Storefront 4.6.2 on WooCommerce 11.2.1</text>

  <g font-size="13" font-weight="bold" fill="#f4b860">
    <text x="40" y="96">Aspect</text>
    <text x="250" y="96">Purple 1.0.3 (block theme)</text>
    <text x="610" y="96">Storefront 4.6.2 (classic theme)</text>
  </g>
  <g fill="#3d5266">
    <rect x="40" y="108" width="880" height="46" rx="5"/>
    <rect x="40" y="162" width="880" height="46" rx="5"/>
    <rect x="40" y="216" width="880" height="46" rx="5"/>
    <rect x="40" y="270" width="880" height="46" rx="5"/>
    <rect x="40" y="324" width="880" height="46" rx="5"/>
    <rect x="40" y="378" width="880" height="46" rx="5"/>
    <rect x="40" y="432" width="880" height="46" rx="5"/>
  </g>
  <g stroke="#6f8aa3" stroke-width="1">
    <path d="M240 108 L240 478"/>
    <path d="M600 108 L600 478"/>
  </g>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="52" y="136" font-weight="bold">Requirements</text>
    <text x="252" y="130">WordPress 7.1, PHP 7.4,</text>
    <text x="252" y="146">WooCommerce 11.1 or newer</text>
    <text x="612" y="130">PHP 5.6 (header), tested up</text>
    <text x="612" y="146">to WordPress 6.7</text>

    <text x="52" y="190" font-weight="bold">Layout files</text>
    <text x="252" y="184">19 templates/*.html, 11 parts/*.html,</text>
    <text x="252" y="200">63 patterns</text>
    <text x="612" y="184">PHP files: header.php, footer.php,</text>
    <text x="612" y="200">page.php, content-*.php</text>

    <text x="52" y="244" font-weight="bold">Design settings</text>
    <text x="252" y="238">theme.json, Site Editor Styles,</text>
    <text x="252" y="254">9 colour + 10 typography variations</text>
    <text x="612" y="238">Customizer options, style.css,</text>
    <text x="612" y="254">inc/customizer</text>

    <text x="52" y="298" font-weight="bold">Woo pages</text>
    <text x="252" y="292">Woo block templates in templates/:</text>
    <text x="252" y="308">single-product, archive-product, cart</text>
    <text x="612" y="292">WooCommerce PHP templates, styled</text>
    <text x="612" y="308">by the theme, add_theme_support</text>

    <text x="52" y="352" font-weight="bold">Extension points</text>
    <text x="252" y="346">Blocks, block styles, patterns,</text>
    <text x="252" y="362">Block Bindings, theme.json styles</text>
    <text x="612" y="346">51 storefront_* action hooks plus</text>
    <text x="612" y="362">the WooCommerce hooks</text>

    <text x="52" y="406" font-weight="bold">Child theme holds</text>
    <text x="252" y="400">theme.json overrides, templates/,</text>
    <text x="252" y="416">parts/, patterns/, styles/</text>
    <text x="612" y="400">functions.php hooks and a</text>
    <text x="612" y="416">woocommerce/ override folder</text>

    <text x="52" y="460" font-weight="bold">Typical break</text>
    <text x="252" y="454">Site Editor edit hides a theme file;</text>
    <text x="252" y="470">block markup changes with Woo</text>
    <text x="612" y="454">override @version older than core,</text>
    <text x="612" y="470">removed storefront_* hook</text>
  </g>
  <text x="40" y="512" font-size="12.5" fill="#f2f5f8">Both themes work with the Cart and Checkout blocks: those blocks live in page content, not in the theme.</text>
</svg>
