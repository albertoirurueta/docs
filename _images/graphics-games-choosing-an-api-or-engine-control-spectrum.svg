<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="chs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Control versus productivity</text>
<line x1="40" y1="84" x2="720" y2="84" stroke="#4B5563" stroke-width="2" marker-end="url(#chs)"/>
<text x="40" y="66" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">more control, more code to write</text>
<text x="720" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="end">more productivity, more convention</text>
<rect x="40" y="110" width="130" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="163.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Vulkan</text>
<text x="105.0" y="179.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you manage memory,</text>
<text x="105.0" y="194.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sync, pipelines</text>
<text x="105" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">also: Metal</text>
<rect x="180" y="110" width="130" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="245.0" y="163.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">OpenGL</text>
<text x="245.0" y="179.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">state or objects,</text>
<text x="245.0" y="194.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">driver does more</text>
<text x="245" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">also: WebGPU</text>
<rect x="320" y="110" width="130" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="385.0" y="163.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">three.js</text>
<text x="385.0" y="179.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scene graph and</text>
<text x="385.0" y="194.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">materials provided</text>
<text x="385" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">also: Filament</text>
<rect x="460" y="110" width="130" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="525.0" y="163.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Godot</text>
<text x="525.0" y="179.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scene, physics and</text>
<text x="525.0" y="194.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">tools included</text>
<text x="525" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">also: RealityKit</text>
<rect x="600" y="110" width="130" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665.0" y="163.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Unity</text>
<text x="665.0" y="179.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">editor, assets,</text>
<text x="665.0" y="194.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">build targets</text>
<text x="665" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">also: Unreal Engine</text>
<text x="380" y="306" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="middle">Positions are a rough guide: a level of abstraction, not a quality ranking.</text>
<text x="380" y="328" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="middle">Engines let you drop to the native API for a custom pass; APIs never give you an editor for free.</text>
</svg>
