<svg viewBox="0 0 760 495" width="760" height="495" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sg-lab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="495" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Anatomy of the hand-written BookGlow shader in URP</text>
<rect x="20" y="50" width="720" height="340" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="380" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">BookGlow.shader (a ShaderLab file that wraps HLSL)</text>
<rect x="36" y="88" width="688" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="104.3" text-anchor="middle" font-size="11" fill="#3730A3">Properties: _BaseMap, _BaseColor, _GlowColor, _GlowPower, _Hover</text>
<text x="380.0" y="119.3" text-anchor="middle" font-size="11" fill="#3730A3">the material fields the Inspector shows</text>
<rect x="36" y="136" width="688" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="152.3" text-anchor="middle" font-size="11" fill="#374151">SubShader Tags: RenderPipeline = UniversalPipeline, RenderType = Opaque</text>
<text x="380.0" y="167.3" text-anchor="middle" font-size="11" fill="#374151">the shader is skipped by other render pipelines</text>
<rect x="36" y="184" width="688" height="82" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="203.3" text-anchor="middle" font-size="11" fill="#92400E">HLSLINCLUDE, shared by every pass</text>
<text x="380.0" y="220.3" text-anchor="middle" font-size="11" fill="#92400E">#include Core.hlsl, the _BaseMap texture and sampler</text>
<text x="380.0" y="237.3" text-anchor="middle" font-size="11" fill="#92400E">CBUFFER UnityPerMaterial { _BaseMap_ST, _BaseColor, _GlowColor, _GlowPower, _Hover }</text>
<text x="380.0" y="254.3" text-anchor="middle" font-size="11" fill="#92400E">one buffer with the same layout in all passes keeps the SRP Batcher on</text>
<rect x="36" y="280" width="224" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="148.0" y="312.2" text-anchor="middle" font-size="12" fill="#3730A3">Pass ForwardLit</text>
<text x="148.0" y="334.2" text-anchor="middle" font-size="12" fill="#3730A3">LightMode = UniversalForward</text>
<text x="148.0" y="356.2" text-anchor="middle" font-size="12" fill="#3730A3">lighting, shadows and rim glow</text>
<rect x="36" y="414" width="224" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="148.0" y="432.9" text-anchor="middle" font-size="11" fill="#1F2937">Opaque pass of the renderer</text>
<text x="148.0" y="449.9" text-anchor="middle" font-size="11" fill="#1F2937">draws the UniversalForward</text>
<text x="148.0" y="466.9" text-anchor="middle" font-size="11" fill="#1F2937">pass of every object</text>
<line x1="148" y1="414" x2="148" y2="384" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-sg-lab)"/>
<rect x="268" y="280" width="224" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="312.2" text-anchor="middle" font-size="12" fill="#3730A3">Pass ShadowCaster</text>
<text x="380.0" y="334.2" text-anchor="middle" font-size="12" fill="#3730A3">LightMode = ShadowCaster</text>
<text x="380.0" y="356.2" text-anchor="middle" font-size="12" fill="#3730A3">depth as seen from each light</text>
<rect x="268" y="414" width="224" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="432.9" text-anchor="middle" font-size="11" fill="#1F2937">Shadow map rendering</text>
<text x="380.0" y="449.9" text-anchor="middle" font-size="11" fill="#1F2937">draws ShadowCaster once</text>
<text x="380.0" y="466.9" text-anchor="middle" font-size="11" fill="#1F2937">per light and cascade</text>
<line x1="380" y1="414" x2="380" y2="384" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-sg-lab)"/>
<rect x="500" y="280" width="224" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="612.0" y="312.2" text-anchor="middle" font-size="12" fill="#3730A3">Pass DepthOnly</text>
<text x="612.0" y="334.2" text-anchor="middle" font-size="12" fill="#3730A3">LightMode = DepthOnly</text>
<text x="612.0" y="356.2" text-anchor="middle" font-size="12" fill="#3730A3">camera depth for the prepass</text>
<rect x="500" y="414" width="224" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="612.0" y="432.9" text-anchor="middle" font-size="11" fill="#1F2937">Depth prepass, depth texture</text>
<text x="612.0" y="449.9" text-anchor="middle" font-size="11" fill="#1F2937">draws DepthOnly; used by</text>
<text x="612.0" y="466.9" text-anchor="middle" font-size="11" fill="#1F2937">SSAO and soft effects</text>
<line x1="612" y1="414" x2="612" y2="384" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-sg-lab)"/>
<text x="392" y="402" text-anchor="start" font-size="11" fill="#374151">requested by</text>
</svg>
