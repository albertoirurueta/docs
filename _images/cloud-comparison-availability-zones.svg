<title id="availability-zones-t">Availability zones over time</title>
<desc id="availability-zones-d">Number of availability zones of AWS and Google Cloud from archived infrastructure pages, 2014 to 2026-10-26, and the single Azure figure of 124 zones in 41 of 58 listed regions in 2026-10-26 (Azure published no earlier total). Zone definitions differ between providers. Gaps mean no figure was found for that year.</desc>
