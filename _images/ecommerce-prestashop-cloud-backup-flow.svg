<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What is backed up for the Pocket Coffee shop and where the copies go</title>
  <desc id="d">Five rows, one per thing that must survive a loss, read from left to right: the source in eu-west-1, how it is protected, and its copy in the disaster recovery region eu-central-1. The RDS instance pocketcoffee-prod is protected by automated backups with point-in-time recovery and by an AWS Backup daily plan and a manual snapshot before every release, and is copied to a backup vault in eu-central-1. The EFS file system pocketcoffee-shared with the img, upload and download directories is protected by the same AWS Backup plan and copied to the same vault. The Secrets Manager secret pocketcoffee/prod/prestashop keeps its versions and has a replica in eu-central-1, because the the cookie keys must never be lost. The ECR repository has immutable tags and is replicated. The Git repository with the chart, the OpenTofu code and the Dockerfile is the recovery plan itself and is applied in eu-central-1. A strip at the bottom lists what is deliberately not backed up: the Valkey sessions, the Memcached SQL cache and the per-pod var/cache directory.</desc>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="30" y="30" font-size="18" font-weight="bold" fill="#f2f5f8">Five things to recover, and where each copy lives</text>
  <g font-size="12.5" font-weight="bold" fill="#f4b860">
    <text x="30" y="56">In eu-west-1 (production)</text>
    <text x="320" y="56">How it is protected</text>
    <text x="680" y="56">In eu-central-1 (disaster recovery)</text>
  </g>
  <rect x="30" y="70" width="250" height="60" rx="10" fill="#3d5266"/>
  <rect x="320" y="70" width="310" height="60" rx="10" fill="#3d5266"/>
  <rect x="680" y="70" width="250" height="60" rx="10" fill="#2f4a44"/>
  <line x1="282" y1="100" x2="318" y2="100" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="100" x2="678" y2="100" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="42" y="95" font-size="13.5" font-weight="bold" fill="#f2f5f8">RDS pocketcoffee-prod</text>
  <text x="42" y="114" font-size="12" fill="#f2f5f8">MySQL 8.4, database pocketcoffee</text>
  <text x="332" y="95" font-size="13" font-weight="bold" fill="#9fd3c7">Automated backups + PITR</text>
  <text x="332" y="114" font-size="12" fill="#f2f5f8">AWS Backup daily + snapshot per release</text>
  <text x="692" y="95" font-size="13" font-weight="bold" fill="#f2f5f8">Copy in a vault in eu-central-1</text>
  <text x="692" y="114" font-size="12" fill="#f2f5f8">restore creates a new instance</text>
  <rect x="30" y="139" width="250" height="60" rx="10" fill="#33485c"/>
  <rect x="320" y="139" width="310" height="60" rx="10" fill="#33485c"/>
  <rect x="680" y="139" width="250" height="60" rx="10" fill="#2f4a44"/>
  <line x1="282" y1="169" x2="318" y2="169" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="169" x2="678" y2="169" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="42" y="164" font-size="13.5" font-weight="bold" fill="#f2f5f8">EFS pocketcoffee-shared</text>
  <text x="42" y="183" font-size="12" fill="#f2f5f8">img/, upload/, download/</text>
  <text x="332" y="164" font-size="13" font-weight="bold" fill="#9fd3c7">AWS Backup daily plan</text>
  <text x="332" y="183" font-size="12" fill="#f2f5f8">one recovery point per day</text>
  <text x="692" y="164" font-size="13" font-weight="bold" fill="#f2f5f8">Copy in a vault in eu-central-1</text>
  <text x="692" y="183" font-size="12" fill="#f2f5f8">restore into a new file system</text>
  <rect x="30" y="208" width="250" height="60" rx="10" fill="#3d5266"/>
  <rect x="320" y="208" width="310" height="60" rx="10" fill="#3d5266"/>
  <rect x="680" y="208" width="250" height="60" rx="10" fill="#2f4a44"/>
  <line x1="282" y1="238" x2="318" y2="238" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="238" x2="678" y2="238" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="42" y="233" font-size="13.5" font-weight="bold" fill="#f2f5f8">Secrets Manager</text>
  <text x="42" y="252" font-size="12" fill="#f2f5f8">pocketcoffee/prod/prestashop</text>
  <text x="332" y="233" font-size="13" font-weight="bold" fill="#9fd3c7">Versions kept by Secrets Manager</text>
  <text x="332" y="252" font-size="12" fill="#f2f5f8">the cookie keys must never be lost</text>
  <text x="692" y="233" font-size="13" font-weight="bold" fill="#f2f5f8">Replica secret in eu-central-1</text>
  <text x="692" y="252" font-size="12" fill="#f2f5f8">replica is promoted when needed</text>
  <rect x="30" y="277" width="250" height="60" rx="10" fill="#33485c"/>
  <rect x="320" y="277" width="310" height="60" rx="10" fill="#33485c"/>
  <rect x="680" y="277" width="250" height="60" rx="10" fill="#2f4a44"/>
  <line x1="282" y1="307" x2="318" y2="307" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="307" x2="678" y2="307" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="42" y="302" font-size="13.5" font-weight="bold" fill="#f2f5f8">ECR repository</text>
  <text x="42" y="321" font-size="12" fill="#f2f5f8">pocketcoffee/prestashop:&lt;git-sha&gt;</text>
  <text x="332" y="302" font-size="13" font-weight="bold" fill="#9fd3c7">Immutable tags</text>
  <text x="332" y="321" font-size="12" fill="#f2f5f8">the image can be rebuilt from Git</text>
  <text x="692" y="302" font-size="13" font-weight="bold" fill="#f2f5f8">Replicated to eu-central-1</text>
  <text x="692" y="321" font-size="12" fill="#f2f5f8">pulled by the DR cluster</text>
  <rect x="30" y="346" width="250" height="60" rx="10" fill="#3d5266"/>
  <rect x="320" y="346" width="310" height="60" rx="10" fill="#3d5266"/>
  <rect x="680" y="346" width="250" height="60" rx="10" fill="#2f4a44"/>
  <line x1="282" y1="376" x2="318" y2="376" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="376" x2="678" y2="376" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="42" y="371" font-size="13.5" font-weight="bold" fill="#f2f5f8">Git repository</text>
  <text x="42" y="390" font-size="12" fill="#f2f5f8">chart, infra/ OpenTofu, Dockerfile</text>
  <text x="332" y="371" font-size="13" font-weight="bold" fill="#9fd3c7">Versioned state bucket</text>
  <text x="332" y="390" font-size="12" fill="#f2f5f8">the platform code is the recovery plan</text>
  <text x="692" y="371" font-size="13" font-weight="bold" fill="#f2f5f8">tofu apply in eu-central-1</text>
  <text x="692" y="390" font-size="12" fill="#f2f5f8">rebuilds cluster, RDS, EFS</text>
  <rect x="30" y="417" width="900" height="34" rx="10" fill="none" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="42" y="439" font-size="12.5" fill="#f2f5f8">Not backed up on purpose: Valkey sessions, Memcached SQL cache, var/cache of each pod, Smarty cache. They are rebuilt on start.</text>
</svg>
