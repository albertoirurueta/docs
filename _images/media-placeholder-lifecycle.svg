<svg viewBox="0 0 900 300" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
    <linearGradient id="blur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a56b"/><stop offset="0.5" stop-color="#b7788f"/><stop offset="1" stop-color="#5b6fa8"/></linearGradient>
    <linearGradient id="sharp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a040"/><stop offset="0.3" stop-color="#c05060"/><stop offset="0.7" stop-color="#704090"/><stop offset="1" stop-color="#304fa0"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Placeholder to image lifecycle on the client</text>

  <rect x="30" y="60" width="150" height="110" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
  <text x="105" y="120" text-anchor="middle" font-size="12" fill="#555">empty box</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#333">1. Layout</text>
  <text x="105" y="206" text-anchor="middle" font-size="11" fill="#555">width and height reserve the space</text>

  <rect x="260" y="60" width="150" height="110" rx="6" fill="url(#blur)" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="335" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#333">2. Placeholder</text>
  <text x="335" y="206" text-anchor="middle" font-size="11" fill="#555">BlurHash decoded to 32 px,</text>
  <text x="335" y="220" text-anchor="middle" font-size="11" fill="#555">scaled up by the browser</text>

  <rect x="490" y="60" width="150" height="110" rx="6" fill="url(#blur)" stroke="#1f5fa6" stroke-width="1.4"/>
  <rect x="490" y="150" width="75" height="20" fill="#1f5fa6" opacity="0.85"/>
  <text x="527" y="164" text-anchor="middle" font-size="10" fill="#ffffff">downloading</text>
  <text x="565" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#333">3. Fetch</text>
  <text x="565" y="206" text-anchor="middle" font-size="11" fill="#555">AVIF or WebP over the network,</text>
  <text x="565" y="220" text-anchor="middle" font-size="11" fill="#555">lazy unless it is the LCP image</text>

  <rect x="720" y="60" width="150" height="110" rx="6" fill="url(#sharp)" stroke="#2b7a2b" stroke-width="1.4"/>
  <text x="795" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#333">4. Decoded</text>
  <text x="795" y="206" text-anchor="middle" font-size="11" fill="#555">cross-fade, then remove</text>
  <text x="795" y="220" text-anchor="middle" font-size="11" fill="#555">the placeholder from the DOM</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr2)">
    <path d="M182,115 L256,115"/><path d="M412,115 L486,115"/><path d="M642,115 L716,115"/>
  </g>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#333">The API response carries the hash, so step 2 needs no extra request. Use the image's load event (or decode()) to start step 4.</text>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#333">Respect prefers-reduced-motion: swap without a fade when the user asks for less motion.</text>
</svg>
