<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>XMPP federation: clients connect to their own domain's server over WebSocket, servers talk to each other over server-to-server streams, and a component such as a multi-user chat service attaches to a server</title>
  <defs>
    <marker id="xf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">XMPP federation: every domain runs its own server</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">a JID's domain part tells a server where to deliver a stanza</text>

  <rect x="20" y="70" width="330" height="320" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="185" y="94" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Domain chat.example.test</text>
  <rect x="100" y="150" width="170" height="64" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="185" y="178" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">XMPP server A</text>
  <text x="185" y="198" font-size="10.5" fill="#0d3c75" text-anchor="middle">ejabberd, Prosody, ...</text>
  <rect x="36" y="296" width="130" height="52" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="101" y="318" font-size="11" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser client</text>
  <text x="101" y="336" font-size="10" fill="#0d3c75" text-anchor="middle">alice@chat.example.test</text>
  <rect x="204" y="296" width="130" height="52" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="269" y="318" font-size="11" font-weight="bold" fill="#0d3c75" text-anchor="middle">Phone client</text>
  <text x="269" y="336" font-size="10" fill="#0d3c75" text-anchor="middle">alice@chat.example.test</text>
  <rect x="36" y="104" width="130" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="101" y="122" font-size="10.5" font-weight="bold" fill="#6d4c00" text-anchor="middle">Component</text>
  <text x="101" y="136" font-size="9.5" fill="#6d4c00" text-anchor="middle">conference.chat.example.test</text>

  <rect x="450" y="70" width="330" height="320" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="615" y="94" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Domain team.example.org</text>
  <rect x="530" y="150" width="170" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="615" y="178" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">XMPP server B</text>
  <text x="615" y="198" font-size="10.5" fill="#1b5e20" text-anchor="middle">Openfire, MongooseIM, ...</text>
  <rect x="550" y="296" width="130" height="52" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="615" y="318" font-size="11" font-weight="bold" fill="#1b5e20" text-anchor="middle">Desktop client</text>
  <text x="615" y="336" font-size="10" fill="#1b5e20" text-anchor="middle">bob@team.example.org</text>

  <line x1="270" y1="182" x2="530" y2="182" stroke="#37474f" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#xf-arrow)" marker-end="url(#xf-arrow)"/>
  <text x="400" y="172" font-size="11" font-weight="bold" fill="#37474f" text-anchor="middle">server-to-server</text>
  <text x="400" y="200" font-size="10" fill="#37474f" text-anchor="middle">TCP 5269, TLS, dialback or SASL EXTERNAL</text>

  <line x1="101" y1="296" x2="150" y2="214" stroke="#37474f" stroke-width="2" marker-end="url(#xf-arrow)"/>
  <line x1="269" y1="296" x2="220" y2="214" stroke="#37474f" stroke-width="2" marker-end="url(#xf-arrow)"/>
  <line x1="615" y1="296" x2="615" y2="214" stroke="#37474f" stroke-width="2" marker-end="url(#xf-arrow)"/>
  <line x1="101" y1="144" x2="130" y2="150" stroke="#37474f" stroke-width="2" marker-end="url(#xf-arrow)"/>
  <text x="60" y="262" font-size="10" fill="#0d3c75">WebSocket</text>
  <text x="60" y="274" font-size="10" fill="#0d3c75">RFC 7395</text>
  <text x="270" y="262" font-size="10" fill="#0d3c75">TCP 5222</text>
  <text x="630" y="262" font-size="10" fill="#1b5e20">TCP 5222</text>
  <text x="400" y="410" font-size="10" fill="#555555" text-anchor="middle">alice@chat.example.test writes to bob@team.example.org: server A resolves team.example.org, opens a stream to server B and hands the stanza over</text>
</svg>
