<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Architecture of the Webflow MCP server: an AI client talks to the remote MCP server, which calls the Webflow Data API and, through the Bridge App, a live Designer session; agent changes land in the site activity log">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker></defs>
<rect width="960" height="520" fill="#FFFFFF"/>
<text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">How an agent reaches a Webflow site</text>
<rect x="20" y="170" width="200" height="130" rx="8" fill="#FBE0E0" stroke="#B3261E" stroke-width="2"/>
<text x="120" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#7A1A14">AI client</text>
<text x="120" y="222" text-anchor="middle" font-size="13" fill="#7A1A14">Claude Code, Claude Desktop</text>
<text x="120" y="240" text-anchor="middle" font-size="13" fill="#7A1A14">ChatGPT, Codex, Postman</text>
<text x="120" y="262" text-anchor="middle" font-size="13" fill="#7A1A14">Skills and prompts</text>
<text x="120" y="280" text-anchor="middle" font-size="13" fill="#7A1A14">(runs on your machine)</text>
<rect x="290" y="150" width="240" height="170" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="410" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Remote MCP server</text>
<text x="410" y="202" text-anchor="middle" font-size="13" fill="#0B4F6C">mcp.webflow.com/mcp</text>
<text x="410" y="224" text-anchor="middle" font-size="13" fill="#0B4F6C">OAuth, one workspace per grant</text>
<text x="410" y="246" text-anchor="middle" font-size="13" fill="#0B4F6C">Tool families: data, designer,</text>
<text x="410" y="264" text-anchor="middle" font-size="13" fill="#0B4F6C">utility; resources; guidance</text>
<text x="410" y="290" text-anchor="middle" font-size="13" fill="#0B4F6C">Translates intent into API calls</text>
<rect x="610" y="60" width="330" height="110" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="775" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Webflow Data API</text>
<text x="775" y="112" text-anchor="middle" font-size="13" fill="#0B4F6C">CMS, pages, elements, styles, variables,</text>
<text x="775" y="130" text-anchor="middle" font-size="13" fill="#0B4F6C">components, assets, fonts, forms</text>
<text x="775" y="150" text-anchor="middle" font-size="13" fill="#0B4F6C">Works with the Designer closed</text>
<rect x="610" y="205" width="330" height="110" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="775" y="233" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4800">MCP Bridge App</text>
<text x="775" y="257" text-anchor="middle" font-size="13" fill="#7A4800">Runs inside an open Designer tab</text>
<text x="775" y="275" text-anchor="middle" font-size="13" fill="#7A4800">Snapshots, selection, page, mode,</text>
<text x="775" y="293" text-anchor="middle" font-size="13" fill="#7A4800">branch, canvas, breakpoints</text>
<rect x="610" y="350" width="330" height="100" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="775" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">Governance</text>
<text x="775" y="402" text-anchor="middle" font-size="13" fill="#1B5E20">Your roles and permissions apply</text>
<text x="775" y="420" text-anchor="middle" font-size="13" fill="#1B5E20">Agent Instructions stored per site</text>
<text x="775" y="438" text-anchor="middle" font-size="13" fill="#1B5E20">Changes recorded in the activity log</text>
<rect x="290" y="360" width="240" height="90" rx="8" fill="#F4F4F4" stroke="#555555" stroke-width="2"/>
<text x="410" y="388" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Local alternative</text>
<text x="410" y="412" text-anchor="middle" font-size="13" fill="#333333">webflow-mcp-server (npm)</text>
<text x="410" y="430" text-anchor="middle" font-size="13" fill="#333333">API token, your own Bridge App</text>
<line x1="220" y1="235" x2="288" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="200" x2="608" y2="130" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="250" x2="608" y2="260" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="300" x2="608" y2="380" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<line x1="120" y1="300" x2="120" y2="405" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="120" y1="405" x2="288" y2="405" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="480" y="498" text-anchor="middle" font-size="13" fill="#333333">Most tools need only the Data API path; live-Designer tools need the Bridge App as well</text>
</svg>
