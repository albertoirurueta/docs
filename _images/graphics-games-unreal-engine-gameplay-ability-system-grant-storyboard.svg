<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: grant the Speed-read ability in the editor</text>
<rect x="14" y="60" width="134" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="30" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="81.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Edit &gt; Plugins</text>
<text x="81.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">search Gameplay</text>
<text x="81.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">Abilities, tick it</text>
<text x="81.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">and restart</text>
<text x="81.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Enable the plugin</text>
<line x1="149" y1="145" x2="159" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160" y="60" width="134" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="176" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="176" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">GE_SpeedRead</text>
<text x="227.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">Infinite, x2</text>
<text x="227.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">plus a Cost and</text>
<text x="227.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">a Cooldown effect</text>
<text x="227.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create effects</text>
<line x1="295" y1="145" x2="305" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="306" y="60" width="134" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="322" cy="76" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="322" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="373.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">BP_GA_SpeedRead</text>
<text x="373.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">child of</text>
<text x="373.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">UGA_SpeedRead</text>
<text x="373.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">set cost and tags</text>
<text x="373.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create the ability</text>
<line x1="441" y1="145" x2="451" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="452" y="60" width="134" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="468" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="468" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="519.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">DefaultAbilities array</text>
<text x="519.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">on the character</text>
<text x="519.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">GiveAbility runs</text>
<text x="519.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">on the server</text>
<text x="519.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Grant it</text>
<line x1="587" y1="145" x2="597" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="598" y="60" width="134" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="614" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="614" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="665.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Play as Client</text>
<text x="665.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">press IA_SpeedRead</text>
<text x="665.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">showdebug</text>
<text x="665.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">abilitysystem</text>
<text x="665.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Test with a client</text>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">Each panel is one step of the numbered procedure; panel 3 is where cost, cooldown and tags are wired.</text>
<text x="380" y="318" text-anchor="middle" font-size="11" fill="#374151">The grant itself is code on the server, so the ability never exists on a client that did not earn it.</text>
</svg>
