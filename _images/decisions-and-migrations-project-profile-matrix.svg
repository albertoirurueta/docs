<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="24" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Project profile x concern matrix</text>

  <!-- Table grid: 4 columns x (1 header + 7 rows) -->
  <!-- Column boundaries: 30-200-380-590-750 -->
  <!-- Row boundaries: header 70-104, rows 104,148,192,236,280,324,368,412 -->

  <rect x="30" y="70" width="720" height="342" fill="none" stroke="#999999" stroke-width="1.2"/>

  <!-- Header -->
  <rect x="30" y="70" width="720" height="34" fill="#1c4b73"/>
  <text x="115" y="91" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Scenario</text>
  <text x="290" y="91" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Architecture style</text>
  <text x="485" y="91" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Data &amp; messaging</text>
  <text x="670" y="91" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Deployment</text>

  <!-- Row background stripes -->
  <rect x="30" y="104" width="720" height="44" fill="#ffffff"/>
  <rect x="30" y="148" width="720" height="44" fill="#f6f6f6"/>
  <rect x="30" y="192" width="720" height="44" fill="#ffffff"/>
  <rect x="30" y="236" width="720" height="44" fill="#f6f6f6"/>
  <rect x="30" y="280" width="720" height="44" fill="#ffffff"/>
  <rect x="30" y="324" width="720" height="44" fill="#f6f6f6"/>
  <rect x="30" y="368" width="720" height="44" fill="#ffffff"/>

  <!-- Column separators -->
  <line x1="200" y1="70" x2="200" y2="412" stroke="#cccccc" stroke-width="1"/>
  <line x1="380" y1="70" x2="380" y2="412" stroke="#cccccc" stroke-width="1"/>
  <line x1="590" y1="70" x2="590" y2="412" stroke="#cccccc" stroke-width="1"/>

  <!-- Row separators -->
  <line x1="30" y1="148" x2="750" y2="148" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="192" x2="750" y2="192" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="236" x2="750" y2="236" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="280" x2="750" y2="280" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="324" x2="750" y2="324" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="368" x2="750" y2="368" stroke="#dddddd" stroke-width="1"/>

  <!-- Row a -->
  <text x="115" y="130" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(a) One-shot / internal tool</text>
  <text x="290" y="130" font-size="8.5" fill="#333333" text-anchor="middle">Monolith</text>
  <text x="485" y="130" font-size="8.5" fill="#333333" text-anchor="middle">1 relational DB, no broker</text>
  <text x="670" y="130" font-size="8.5" fill="#333333" text-anchor="middle">Single JAR / PaaS</text>

  <!-- Row b -->
  <text x="115" y="174" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(b) Startup MVP</text>
  <text x="290" y="174" font-size="8.5" fill="#333333" text-anchor="middle">Modular monolith</text>
  <text x="485" y="174" font-size="8.5" fill="#333333" text-anchor="middle">PostgreSQL, no broker yet</text>
  <text x="670" y="166" font-size="8.5" fill="#333333" text-anchor="middle">Container,</text>
  <text x="670" y="178" font-size="8.5" fill="#333333" text-anchor="middle">managed platform</text>

  <!-- Row c -->
  <text x="115" y="218" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(c) Long-lived LOB app</text>
  <text x="290" y="218" font-size="8.5" fill="#333333" text-anchor="middle">Modular monolith</text>
  <text x="485" y="210" font-size="8.5" fill="#333333" text-anchor="middle">RabbitMQ for</text>
  <text x="485" y="222" font-size="8.5" fill="#333333" text-anchor="middle">background work</text>
  <text x="670" y="210" font-size="8.5" fill="#333333" text-anchor="middle">Container, observability</text>
  <text x="670" y="222" font-size="8.5" fill="#333333" text-anchor="middle">from day one</text>

  <!-- Row d -->
  <text x="115" y="254" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(d) High-traffic</text>
  <text x="115" y="266" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">consumer app</text>
  <text x="290" y="254" font-size="8.5" fill="#333333" text-anchor="middle">Gateway + microservices</text>
  <text x="290" y="266" font-size="8.5" fill="#333333" text-anchor="middle">(hot paths only)</text>
  <text x="485" y="254" font-size="8.5" fill="#333333" text-anchor="middle">Search + Kafka +</text>
  <text x="485" y="266" font-size="8.5" fill="#333333" text-anchor="middle">CQRS reads</text>
  <text x="670" y="262" font-size="8.5" fill="#333333" text-anchor="middle">Kubernetes</text>

  <!-- Row e -->
  <text x="115" y="294" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(e) Large multi-team</text>
  <text x="115" y="306" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">platform</text>
  <text x="290" y="294" font-size="8.5" fill="#333333" text-anchor="middle">Microservices by</text>
  <text x="290" y="306" font-size="8.5" fill="#333333" text-anchor="middle">business capability</text>
  <text x="485" y="294" font-size="8.5" fill="#333333" text-anchor="middle">Per-service DBs +</text>
  <text x="485" y="306" font-size="8.5" fill="#333333" text-anchor="middle">events</text>
  <text x="670" y="294" font-size="8.5" fill="#333333" text-anchor="middle">Kubernetes +</text>
  <text x="670" y="306" font-size="8.5" fill="#333333" text-anchor="middle">distributed tracing</text>

  <!-- Row f -->
  <text x="115" y="338" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(f) Multi-tenant SaaS</text>
  <text x="115" y="350" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">product</text>
  <text x="290" y="338" font-size="8.5" fill="#333333" text-anchor="middle">Control plane +</text>
  <text x="290" y="350" font-size="8.5" fill="#333333" text-anchor="middle">pooled application plane</text>
  <text x="485" y="338" font-size="8.5" fill="#333333" text-anchor="middle">Tiered, tenant-</text>
  <text x="485" y="350" font-size="8.5" fill="#333333" text-anchor="middle">partitioned data</text>
  <text x="670" y="338" font-size="8.5" fill="#333333" text-anchor="middle">Serverless control</text>
  <text x="670" y="350" font-size="8.5" fill="#333333" text-anchor="middle">plane</text>

  <!-- Row g -->
  <text x="115" y="382" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">(g) Batch / data-</text>
  <text x="115" y="394" font-size="8.5" font-weight="bold" fill="#222222" text-anchor="middle">processing job</text>
  <text x="290" y="382" font-size="8.5" fill="#333333" text-anchor="middle">Batch job, no</text>
  <text x="290" y="394" font-size="8.5" fill="#333333" text-anchor="middle">web layer</text>
  <text x="485" y="382" font-size="8.5" fill="#333333" text-anchor="middle">RDBMS via</text>
  <text x="485" y="394" font-size="8.5" fill="#333333" text-anchor="middle">Spring Batch</text>
  <text x="670" y="382" font-size="8.5" fill="#333333" text-anchor="middle">Scheduled batch</text>
  <text x="670" y="394" font-size="8.5" fill="#333333" text-anchor="middle">job</text>

  <text x="390" y="434" font-size="10" fill="#666666" text-anchor="middle">One row per scenario card below -- see the page text for the full stack, the links, and what to explicitly not do.</text>
</svg>
