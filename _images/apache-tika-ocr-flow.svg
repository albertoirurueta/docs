<svg viewBox="0 0 960 640" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
<text x="480.0" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">How Tika 4.1 reaches an OCR engine</text>
<text x="480.0" y="46" text-anchor="middle" font-size="12" fill="#444444">Blue: input, green: parsers that call the engine, amber: policy and gates, violet: engines, grey: output</text>
<rect x="20" y="70" width="200" height="80" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="120.0" y="91" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Image file</text>
<text x="120.0" y="110" text-anchor="middle" font-size="11.5" fill="#333333">book-cover.jpg, a PNG or TIFF scan</text>
<text x="120.0" y="125" text-anchor="middle" font-size="11.5" fill="#333333">(top-level or embedded in</text>
<text x="120.0" y="140" text-anchor="middle" font-size="11.5" fill="#333333">a DOCX, EML or ZIP)</text>
<rect x="20" y="300" width="200" height="80" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="120.0" y="321" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">PDF</text>
<text x="120.0" y="340" text-anchor="middle" font-size="11.5" fill="#333333">scanned-loan-form.pdf</text>
<text x="120.0" y="355" text-anchor="middle" font-size="11.5" fill="#333333">catalogue.pdf (text layer)</text>
<rect x="270" y="70" width="200" height="80" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="370.0" y="91" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">image-parser</text>
<text x="370.0" y="110" text-anchor="middle" font-size="11.5" fill="#333333">JpegParser, TIFFParser, ...</text>
<text x="370.0" y="125" text-anchor="middle" font-size="11.5" fill="#333333">parses metadata first,</text>
<text x="370.0" y="140" text-anchor="middle" font-size="11.5" fill="#333333">then calls the recognizer</text>
<rect x="270" y="300" width="200" height="80" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="370.0" y="321" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">pdf-parser</text>
<text x="370.0" y="340" text-anchor="middle" font-size="11.5" fill="#333333">extracts each page text</text>
<text x="370.0" y="355" text-anchor="middle" font-size="11.5" fill="#333333">layer, counts characters</text>
<text x="370.0" y="370" text-anchor="middle" font-size="11.5" fill="#333333">and unmapped glyphs</text>
<rect x="520" y="60" width="200" height="110" rx="8" fill="#f7e7c4" stroke="#9a6b10" stroke-width="1.6"/>
<text x="620.0" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">text-recognizers entry</text>
<text x="620.0" y="100" text-anchor="middle" font-size="11.5" fill="#333333">_mime-include / _mime-exclude</text>
<text x="620.0" y="115" text-anchor="middle" font-size="11.5" fill="#333333">_min-width / _min-height</text>
<text x="620.0" y="130" text-anchor="middle" font-size="11.5" fill="#333333">images under 2 x 2 never sent</text>
<text x="620.0" y="145" text-anchor="middle" font-size="11.5" fill="#333333">engine byte gates:</text>
<text x="620.0" y="160" text-anchor="middle" font-size="11.5" fill="#333333">min/maxFileSizeToOcr</text>
<rect x="270" y="410" width="200" height="110" rx="8" fill="#f7e7c4" stroke="#9a6b10" stroke-width="1.6"/>
<text x="370.0" y="431" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">pages.text policy</text>
<text x="370.0" y="450" text-anchor="middle" font-size="11.5" fill="#333333">EXTRACT: never OCR</text>
<text x="370.0" y="465" text-anchor="middle" font-size="11.5" fill="#333333">AUTO: OCR pages with few</text>
<text x="370.0" y="480" text-anchor="middle" font-size="11.5" fill="#333333">chars or many unmapped (10)</text>
<text x="370.0" y="495" text-anchor="middle" font-size="11.5" fill="#333333">OCR / EXTRACT_AND_OCR</text>
<text x="370.0" y="510" text-anchor="middle" font-size="11.5" fill="#333333">ocr.maxPages caps the count</text>
<rect x="520" y="410" width="200" height="110" rx="8" fill="#f7e7c4" stroke="#9a6b10" stroke-width="1.6"/>
<text x="620.0" y="431" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">pages.render</text>
<text x="620.0" y="450" text-anchor="middle" font-size="11.5" fill="#333333">page rendered to an image</text>
<text x="620.0" y="465" text-anchor="middle" font-size="11.5" fill="#333333">dpi 300, GRAY, PNG</text>
<text x="620.0" y="480" text-anchor="middle" font-size="11.5" fill="#333333">maxImagePixels 100 M</text>
<text x="620.0" y="495" text-anchor="middle" font-size="11.5" fill="#333333">renderingStrategy (PDFBox)</text>
<text x="620.0" y="510" text-anchor="middle" font-size="11.5" fill="#333333">minWidth / minHeight 2</text>
<rect x="770" y="60" width="170" height="100" rx="8" fill="#e6dcf2" stroke="#5b3a8a" stroke-width="1.6"/>
<text x="855.0" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">TesseractOCRParser</text>
<text x="855.0" y="100" text-anchor="middle" font-size="11.5" fill="#333333">tesseract child process</text>
<text x="855.0" y="115" text-anchor="middle" font-size="11.5" fill="#333333">per image: --psm, -l, -c</text>
<text x="855.0" y="130" text-anchor="middle" font-size="11.5" fill="#333333">optional ImageMagick</text>
<text x="855.0" y="145" text-anchor="middle" font-size="11.5" fill="#333333">preprocessing</text>
<rect x="770" y="180" width="170" height="85" rx="8" fill="#e6dcf2" stroke="#5b3a8a" stroke-width="1.6"/>
<text x="855.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Tess4JParser</text>
<text x="855.0" y="220" text-anchor="middle" font-size="11.5" fill="#333333">in-process via JNA</text>
<text x="855.0" y="235" text-anchor="middle" font-size="11.5" fill="#333333">pooled instances</text>
<text x="855.0" y="250" text-anchor="middle" font-size="11.5" fill="#333333">(crash takes the JVM)</text>
<rect x="770" y="285" width="170" height="85" rx="8" fill="#e6dcf2" stroke="#5b3a8a" stroke-width="1.6"/>
<text x="855.0" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">VLM or custom</text>
<text x="855.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333">openai/claude/gemini</text>
<text x="855.0" y="340" text-anchor="middle" font-size="11.5" fill="#333333">-vlm-parser, or your</text>
<text x="855.0" y="355" text-anchor="middle" font-size="11.5" fill="#333333">TextRecognizer</text>
<text x="855" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#5b3a8a">engine = the one named</text>
<text x="855" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#5b3a8a">in text-recognizers</text>
<text x="855" y="420" text-anchor="middle" font-size="11" fill="#5b3a8a">(no list: found on classpath;</text>
<text x="855" y="434" text-anchor="middle" font-size="11" fill="#5b3a8a">[] turns OCR off)</text>
<rect x="20" y="560" width="920" height="64" rx="8" fill="#e8e8e8" stroke="#555555" stroke-width="1.6"/>
<text x="480.0" y="581" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Result</text>
<text x="480" y="600" text-anchor="middle" font-size="11.5" fill="#333333">OCR text lands in the body (XHTML, Markdown or plain text). AUTO replaces a page text layer only when the engine is a TextRecognizer that wrote text.</text>
<text x="480" y="615" text-anchor="middle" font-size="11.5" fill="#333333">Metadata: pdf:ocr-page-count, tk:parsed-by / tk:parsed-by-full-set name the engine, tess:* keys with --psm 0. Each call: min(timeoutMillis, task time left).</text>
<line x1="220" y1="110" x2="268" y2="110" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="220" y1="340" x2="268" y2="340" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="470" y1="110" x2="518" y2="110" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="380" x2="370" y2="408" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="405" y="397" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">per page</text>
<line x1="470" y1="465" x2="518" y2="465" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="720" y1="110" x2="768" y2="110" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="620" y1="410" x2="620" y2="172" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="628" y="300" font-size="11" font-style="italic" fill="#444444">rendered page</text>
<text x="628" y="314" font-size="11" font-style="italic" fill="#444444">(image/png)</text>
<path d="M745,110 L745,327" fill="none" stroke="#555555" stroke-width="1.5"/>
<line x1="745" y1="222" x2="768" y2="222" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="745" y1="327" x2="768" y2="327" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M855,370 L855,380" fill="none" stroke="#555555" stroke-width="1.5"/>
<path d="M855,440 L855,558" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M120,380 L120,558" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="128" y="470" font-size="11" font-style="italic" fill="#444444">text layer</text>
<text x="128" y="484" font-size="11" font-style="italic" fill="#444444">(EXTRACT, AUTO</text>
<text x="128" y="498" font-size="11" font-style="italic" fill="#444444">on good pages)</text>
<line x1="420" y1="300" x2="420" y2="152" stroke="#777777" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="428" y="215" font-size="10.5" fill="#666666">embedded</text>
<text x="428" y="229" font-size="10.5" fill="#666666">PDF images</text>
<text x="428" y="243" font-size="10.5" fill="#666666">(extractInline-</text>
<text x="428" y="257" font-size="10.5" fill="#666666">Images: true)</text>
</svg>
