<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The naive Bayes independence assumption</title>
<desc id="d">A class node points to four feature nodes, with no arrows between the features. Below, the prediction multiplies the class prior by one likelihood per feature and picks the class with the largest product.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">Naive Bayes: features are independent given the class</text>
<rect x="290" y="62" width="140" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360" y="84" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">class y</text>
<text x="360" y="102" font-size="12" fill="#475569" text-anchor="middle">prior P(y)</text>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="320" y1="112" x2="123" y2="168"/><line x1="342" y1="112" x2="293" y2="168"/><line x1="378" y1="112" x2="427" y2="168"/><line x1="400" y1="112" x2="597" y2="168"/>
</g>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2">
<rect x="50" y="170" width="146" height="50" rx="6"/><rect x="220" y="170" width="146" height="50" rx="6"/><rect x="354" y="170" width="146" height="50" rx="6" transform="translate(0,0)"/><rect x="524" y="170" width="146" height="50" rx="6"/>
</g>
<g font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">
<text x="123" y="200">x1</text><text x="293" y="200">x2</text><text x="427" y="200">x3</text><text x="597" y="200">x4</text>
</g>
<text x="360" y="246" font-size="12" fill="#475569" text-anchor="middle">no arrows between features: each P(xi | y) is estimated on its own</text>
<rect x="40" y="272" width="640" height="84" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="300" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">score(y) = P(y) × P(x1 | y) × P(x2 | y) × P(x3 | y) × P(x4 | y)</text>
<text x="360" y="326" font-size="14" fill="#0F172A" text-anchor="middle">predicted class = the y with the largest score (sums of logs in practice)</text>
<text x="360" y="346" font-size="12" fill="#475569" text-anchor="middle">GaussianNB, MultinomialNB, ComplementNB, BernoulliNB and CategoricalNB differ only in the form of P(xi | y)</text>
</svg>
