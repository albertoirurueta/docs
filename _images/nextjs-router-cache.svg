<svg viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Next.js client router cache</title>
  <desc id="d">The in-memory client router cache holds shared layout segments, a loading boundary and the page segment, each entry with a freshness lifetime. A list shows what clears or refreshes the cache. With Cache Components, up to three visited routes also stay mounted but hidden behind Activity.</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a4600"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f25"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The client router cache of the App Router</text>
  <text x="430" y="47" font-size="12" fill="#555555" text-anchor="middle">what the browser keeps between navigations, for how long, and what throws it away</text>

  <!-- Cache container -->
  <rect x="20" y="70" width="580" height="330" fill="#f4f6fa" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="36" y="94" font-size="14" font-weight="bold" fill="#1d3557">In-memory cache, one per browser tab</text>
  <text x="36" y="111" font-size="12" fill="#333333">React Server Component payloads, keyed by route segment</text>

  <rect x="36" y="122" width="548" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="48" y="141" font-size="13" font-weight="bold" fill="#1d3557">Shared layout segments (root layout, books layout)</text>
  <text x="48" y="159" font-size="12" fill="#333333">Fetched once and reused by every navigation below them</text>

  <rect x="36" y="176" width="548" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="48" y="195" font-size="13" font-weight="bold" fill="#1d3557">loading.js boundary</text>
  <text x="48" y="213" font-size="12" fill="#333333">The prefetched fallback of a dynamic route, reusable for the static period</text>

  <rect x="36" y="230" width="548" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="48" y="249" font-size="13" font-weight="bold" fill="#1d3557">Page segment, for example /books/2</text>
  <text x="48" y="267" font-size="12" fill="#333333">Only the segment that changes is requested; the layouts above stay</text>

  <text x="36" y="298" font-size="13" font-weight="bold" fill="#1d3557">How long an entry counts as fresh</text>

  <rect x="36" y="308" width="131" height="82" fill="#ffffff" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="101.5" y="328" font-size="15" font-weight="bold" fill="#1d3557" text-anchor="middle">5 minutes</text>
  <text x="101.5" y="346" font-size="12" fill="#333333" text-anchor="middle">static route or</text>
  <text x="101.5" y="361" font-size="12" fill="#333333" text-anchor="middle">prefetch={true}</text>
  <text x="101.5" y="376" font-size="12" fill="#333333" text-anchor="middle">(staleTimes.static)</text>

  <rect x="175" y="308" width="131" height="82" fill="#ffffff" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="240.5" y="328" font-size="15" font-weight="bold" fill="#1d3557" text-anchor="middle">0 seconds</text>
  <text x="240.5" y="346" font-size="12" fill="#333333" text-anchor="middle">dynamic page,</text>
  <text x="240.5" y="361" font-size="12" fill="#333333" text-anchor="middle">default since 15</text>
  <text x="240.5" y="376" font-size="12" fill="#333333" text-anchor="middle">(staleTimes.dynamic)</text>

  <rect x="314" y="308" width="131" height="82" fill="#ffffff" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="379.5" y="328" font-size="15" font-weight="bold" fill="#1d3557" text-anchor="middle">30 s or more</text>
  <text x="379.5" y="346" font-size="12" fill="#333333" text-anchor="middle">cacheLife stale,</text>
  <text x="379.5" y="361" font-size="12" fill="#333333" text-anchor="middle">set per function</text>
  <text x="379.5" y="376" font-size="12" fill="#333333" text-anchor="middle">(Cache Components)</text>

  <rect x="453" y="308" width="131" height="82" fill="#ffffff" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="518.5" y="328" font-size="15" font-weight="bold" fill="#1d3557" text-anchor="middle">Kept</text>
  <text x="518.5" y="346" font-size="12" fill="#333333" text-anchor="middle">browser back and</text>
  <text x="518.5" y="361" font-size="12" fill="#333333" text-anchor="middle">forward reuse the</text>
  <text x="518.5" y="376" font-size="12" fill="#333333" text-anchor="middle">entry, no refetch</text>

  <!-- Invalidation box -->
  <rect x="640" y="70" width="200" height="330" fill="#fdf3ea" stroke="#8a4600" stroke-width="1.6"/>
  <text x="740" y="94" font-size="14" font-weight="bold" fill="#5c3000" text-anchor="middle">What clears it</text>
  <text x="656" y="126" font-size="12" fill="#333333">Reloading the page</text>
  <text x="656" y="164" font-size="12" fill="#333333">router.refresh() clears</text>
  <text x="656" y="179" font-size="12" fill="#333333">the current route</text>
  <text x="656" y="217" font-size="12" fill="#333333">In a Server Action:</text>
  <text x="656" y="232" font-size="12" fill="#333333">revalidatePath,</text>
  <text x="656" y="247" font-size="12" fill="#333333">revalidateTag, updateTag,</text>
  <text x="656" y="262" font-size="12" fill="#333333">refresh (clears it all)</text>
  <text x="656" y="300" font-size="12" fill="#333333">cookies().set or delete</text>
  <text x="656" y="315" font-size="12" fill="#333333">in a Server Action</text>
  <text x="656" y="353" font-size="12" fill="#333333">Expiry: the next time a link</text>
  <text x="656" y="368" font-size="12" fill="#333333">is seen, it is prefetched</text>
  <text x="656" y="383" font-size="12" fill="#333333">again</text>
  <line x1="640" y1="234" x2="602" y2="234" stroke="#8a4600" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>

  <!-- Activity strip -->
  <rect x="20" y="420" width="820" height="200" fill="#f3f9f3" stroke="#1f5f25" stroke-width="1.6"/>
  <text x="36" y="444" font-size="14" font-weight="bold" fill="#1b4a20">With cacheComponents: visited routes stay mounted behind Activity</text>

  <rect x="36" y="458" width="196" height="76" fill="#ffffff" stroke="#1f5f25" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="134" y="480" font-size="13" font-weight="bold" fill="#1b4a20" text-anchor="middle">Route A: /books/1</text>
  <text x="134" y="499" font-size="12" fill="#333333" text-anchor="middle">hidden (display: none)</text>
  <text x="134" y="515" font-size="12" fill="#333333" text-anchor="middle">state and DOM kept</text>

  <rect x="248" y="458" width="196" height="76" fill="#ffffff" stroke="#1f5f25" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="346" y="480" font-size="13" font-weight="bold" fill="#1b4a20" text-anchor="middle">Route B: /</text>
  <text x="346" y="499" font-size="12" fill="#333333" text-anchor="middle">hidden (display: none)</text>
  <text x="346" y="515" font-size="12" fill="#333333" text-anchor="middle">state and DOM kept</text>

  <rect x="460" y="458" width="196" height="76" fill="#e6f4e6" stroke="#1f5f25" stroke-width="2.2"/>
  <text x="558" y="480" font-size="13" font-weight="bold" fill="#1b4a20" text-anchor="middle">Current: /books/2</text>
  <text x="558" y="499" font-size="12" fill="#333333" text-anchor="middle">visible and interactive</text>

  <rect x="696" y="458" width="128" height="76" fill="#ffffff" stroke="#777777" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="760" y="480" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Evicted</text>
  <text x="760" y="499" font-size="12" fill="#333333" text-anchor="middle">the oldest beyond</text>
  <text x="760" y="515" font-size="12" fill="#333333" text-anchor="middle">three renders fresh</text>
  <line x1="660" y1="496" x2="692" y2="496" stroke="#1f5f25" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <text x="36" y="560" font-size="12" fill="#333333">A push or replace navigation changes router.bfcacheId, so a subtree keyed by it resets; back and forward keep the id and restore state.</text>
  <text x="36" y="580" font-size="12" fill="#333333">Without cacheComponents, pages are unmounted on navigation and only the payload cache above is reused.</text>
  <text x="36" y="600" font-size="12" fill="#333333">Preserving up to three routes is documented behaviour; the limit and the Activity mechanism may change.</text>
</svg>
