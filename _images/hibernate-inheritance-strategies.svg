<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="380" fill="#ffffff"/>
  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Payment / CardPayment / BankTransferPayment under each inheritance strategy</text>

  <!-- SINGLE_TABLE -->
  <text x="130" y="55" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">SINGLE_TABLE</text>
  <rect x="30" y="65" width="200" height="150" rx="4" fill="#eef3f8" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="130" y="85" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">payment</text>
  <text x="130" y="103" font-size="10" fill="#1c4b73" text-anchor="middle">id (PK)</text>
  <text x="130" y="119" font-size="10" fill="#1c4b73" text-anchor="middle">payment_type (discriminator)</text>
  <text x="130" y="135" font-size="10" fill="#1c4b73" text-anchor="middle">amount</text>
  <text x="130" y="151" font-size="10" fill="#1c4b73" text-anchor="middle">last4_digits (nullable)</text>
  <text x="130" y="167" font-size="10" fill="#1c4b73" text-anchor="middle">iban (nullable)</text>
  <text x="130" y="195" font-size="9.5" fill="#1c4b73" text-anchor="middle">one table, no joins</text>

  <!-- JOINED -->
  <text x="390" y="55" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">JOINED</text>
  <rect x="310" y="65" width="160" height="90" rx="4" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="390" y="85" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">payment</text>
  <text x="390" y="103" font-size="10" fill="#2f5424" text-anchor="middle">id (PK)</text>
  <text x="390" y="119" font-size="10" fill="#2f5424" text-anchor="middle">amount</text>

  <rect x="230" y="185" width="140" height="60" rx="4" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="300" y="203" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">card_payment</text>
  <text x="300" y="219" font-size="9.5" fill="#2f5424" text-anchor="middle">id (PK, FK)</text>
  <text x="300" y="233" font-size="9.5" fill="#2f5424" text-anchor="middle">last4_digits</text>

  <rect x="400" y="185" width="140" height="60" rx="4" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="470" y="203" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">bank_transfer_payment</text>
  <text x="470" y="219" font-size="9.5" fill="#2f5424" text-anchor="middle">id (PK, FK)</text>
  <text x="470" y="233" font-size="9.5" fill="#2f5424" text-anchor="middle">iban</text>

  <line x1="360" y1="155" x2="300" y2="185" stroke="#444444" stroke-width="1.5"/>
  <line x1="420" y1="155" x2="470" y2="185" stroke="#444444" stroke-width="1.5"/>
  <text x="390" y="270" font-size="9.5" fill="#2f5424" text-anchor="middle">normalized, one join per concrete row</text>

  <!-- TABLE_PER_CLASS -->
  <text x="650" y="55" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">TABLE_PER_CLASS</text>
  <rect x="570" y="65" width="160" height="75" rx="4" fill="#fbf1e4" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="650" y="83" font-size="10.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">card_payment</text>
  <text x="650" y="99" font-size="9.5" fill="#8a3d10" text-anchor="middle">id (PK)</text>
  <text x="650" y="113" font-size="9.5" fill="#8a3d10" text-anchor="middle">amount</text>
  <text x="650" y="127" font-size="9.5" fill="#8a3d10" text-anchor="middle">last4_digits</text>

  <rect x="570" y="155" width="160" height="75" rx="4" fill="#fbf1e4" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="650" y="173" font-size="10.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">bank_transfer_payment</text>
  <text x="650" y="189" font-size="9.5" fill="#8a3d10" text-anchor="middle">id (PK)</text>
  <text x="650" y="203" font-size="9.5" fill="#8a3d10" text-anchor="middle">amount (repeated)</text>
  <text x="650" y="217" font-size="9.5" fill="#8a3d10" text-anchor="middle">iban</text>

  <text x="650" y="260" font-size="9.5" fill="#8a3d10" text-anchor="middle">no shared table; polymorphic query = UNION ALL</text>

  <rect x="20" y="300" width="740" height="60" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="390" y="322" font-size="11.5" fill="#444444" text-anchor="middle">Polymorphic query cost (e.g. "all Payments"): SINGLE_TABLE cheapest (no join) &lt;</text>
  <text x="390" y="340" font-size="11.5" fill="#444444" text-anchor="middle">JOINED (one join per subtype touched) &lt; TABLE_PER_CLASS (UNION ALL across every concrete table)</text>
</svg>
