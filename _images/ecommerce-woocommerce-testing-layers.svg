<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 486" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Test layers of a WooCommerce plugin and what each costs</title>
<desc id="d">Five layers for the Pocket Coffee plugin from the cheapest at the bottom to the most expensive at the top: PHPCS static checks, unit-level rules, PHPUnit integration tests against a real database, API and REST contract checks, and Playwright browser tests. Each layer lists what it checks and the time measured on the local WordPress 7.1.3 and WooCommerce 11.2.1 stack.</desc>
<rect width="1100" height="486" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Test layers of the Pocket Coffee plugin: cheapest at the bottom</text>
<polygon points="164,56 416,56 430,126 150,126" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290" y="86" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Browser: Playwright</text>
<text x="290" y="106" font-size="11.5" fill="#f2f5f8" text-anchor="middle">3 tests, real Chrome</text>
<line x1="440" y1="91" x2="540" y2="91" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="76" font-size="12.5" fill="#f2f5f8">Checkout block and REST v3 checks.</text>
<text x="552" y="93" font-size="12.5" fill="#f2f5f8">Creates orders; depends on the state of the shared store.</text>
<text x="552" y="112" font-size="12" font-weight="bold" fill="#8fd18f">about 1 to 2 s for the checkout spec</text>
<polygon points="152,132 428,132 442,202 138,202" fill="#4a5a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290" y="162" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">API and REST contract</text>
<text x="290" y="182" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Playwright request, createClient</text>
<line x1="452" y1="167" x2="540" y2="167" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="152" font-size="12.5" fill="#f2f5f8">Product lookup by SKU, 401 for Basic auth over HTTP.</text>
<text x="552" y="169" font-size="12.5" fill="#f2f5f8">Needs a running site and consumer keys.</text>
<text x="552" y="188" font-size="12" font-weight="bold" fill="#8fd18f">0.05 to 0.1 s per request</text>
<polygon points="140,208 440,208 454,278 126,278" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290" y="238" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Integration: PHPUnit</text>
<text x="290" y="258" font-size="11.5" fill="#f2f5f8" text-anchor="middle">WP_UnitTestCase, real database</text>
<line x1="464" y1="243" x2="540" y2="243" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="228" font-size="12.5" fill="#f2f5f8">Abilities, capability gate, HPOS tables, CRUD objects.</text>
<text x="552" y="245" font-size="12.5" fill="#f2f5f8">Dedicated database that the suite wipes.</text>
<text x="552" y="264" font-size="12" font-weight="bold" fill="#8fd18f">7 tests, 19 assertions, 0.05 to 0.2 s</text>
<polygon points="128,284 452,284 466,354 114,354" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290" y="314" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Unit-level rules</text>
<text x="290" y="334" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Plain functions, data providers</text>
<line x1="476" y1="319" x2="540" y2="319" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="304" font-size="12.5" fill="#f2f5f8">Shipping rates, thresholds, error codes.</text>
<text x="552" y="321" font-size="12.5" fill="#f2f5f8">No HTTP; WordPress is loaded once per run.</text>
<text x="552" y="340" font-size="12" font-weight="bold" fill="#8fd18f">part of the PHPUnit run</text>
<polygon points="116,360 464,360 478,430 102,430" fill="#2f6b6b" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290" y="390" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Static: PHPCS</text>
<text x="290" y="410" font-size="11.5" fill="#f2f5f8" text-anchor="middle">WooCommerce-Core, PHPCompatibilityWP</text>
<line x1="488" y1="395" x2="540" y2="395" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="380" font-size="12.5" fill="#f2f5f8">Escaping, nonces, i18n, capabilities, PHP 7.4 syntax.</text>
<text x="552" y="397" font-size="12.5" fill="#f2f5f8">Works on the files only.</text>
<text x="552" y="416" font-size="12" font-weight="bold" fill="#8fd18f">0.2 to 0.5 s</text>
<text x="30" y="466" font-size="13" fill="#f4b860" font-weight="bold">Not run here: QIT managed tests and the Marketplace review need a Woo.com partner account.</text>
</svg>
