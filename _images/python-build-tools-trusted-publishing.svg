<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="pbtTpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
<text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Trusted Publishing: the token exchange and the attestations</text>
<text x="490" y="48" font-size="12" fill="#666666" text-anchor="middle">No long-lived secret is stored in CI; every credential below is minted for this run</text>

<!-- lanes -->
<rect x="20" y="66" width="250" height="380" fill="#f5f5f5" stroke="#bbbbbb"/>
<text x="145" y="88" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">CI job (publish, id-token: write)</text>
<rect x="365" y="66" width="250" height="380" fill="#f5f5f5" stroke="#bbbbbb"/>
<text x="490" y="88" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">CI provider (OIDC issuer) / Sigstore</text>
<rect x="710" y="66" width="250" height="380" fill="#f5f5f5" stroke="#bbbbbb"/>
<text x="835" y="88" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">PyPI</text>

<!-- step boxes -->
<rect x="40" y="104" width="210" height="44" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="145" y="122" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. Request an ID token</text>
<text x="145" y="139" font-size="11" fill="#333333" text-anchor="middle">audience "pypi" (or "testpypi")</text>

<rect x="385" y="104" width="210" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="490" y="122" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">2. Signed OIDC token (JWT)</text>
<text x="490" y="139" font-size="11" fill="#333333" text-anchor="middle">claims: repository, owner id,</text>
<text x="490" y="154" font-size="11" fill="#333333" text-anchor="middle">workflow file, environment</text>

<rect x="40" y="186" width="210" height="44" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="145" y="204" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">3. POST /_/oidc/mint-token</text>
<text x="145" y="221" font-size="11" fill="#333333" text-anchor="middle">{"token": "&lt;the JWT&gt;"}</text>

<rect x="730" y="176" width="210" height="76" rx="6" fill="#fff4e0" stroke="#a65e00"/>
<text x="835" y="194" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">4. Verify and match</text>
<text x="835" y="211" font-size="11" fill="#333333" text-anchor="middle">signature, then claims against</text>
<text x="835" y="226" font-size="11" fill="#333333" text-anchor="middle">the (pending) trusted publishers</text>
<text x="835" y="241" font-size="11" fill="#333333" text-anchor="middle">of every project</text>

<rect x="730" y="272" width="210" height="44" rx="6" fill="#fff4e0" stroke="#a65e00"/>
<text x="835" y="290" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">5. API token, 15 minutes</text>
<text x="835" y="307" font-size="11" fill="#333333" text-anchor="middle">scoped to the matching projects</text>

<rect x="385" y="272" width="210" height="62" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
<text x="490" y="290" font-size="12" font-weight="bold" fill="#4a148c" text-anchor="middle">6. Sigstore: sign each file</text>
<text x="490" y="307" font-size="11" fill="#333333" text-anchor="middle">keyless, bound to the same identity,</text>
<text x="490" y="322" font-size="11" fill="#333333" text-anchor="middle">logged in the transparency log</text>

<rect x="40" y="356" width="210" height="62" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="145" y="374" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">7. Upload files + attestations</text>
<text x="145" y="391" font-size="11" fill="#333333" text-anchor="middle">username __token__,</text>
<text x="145" y="406" font-size="11" fill="#333333" text-anchor="middle">password = the minted token</text>

<rect x="730" y="356" width="210" height="62" rx="6" fill="#fbe9e7" stroke="#bf360c"/>
<text x="835" y="374" font-size="12" font-weight="bold" fill="#8a2500" text-anchor="middle">8. Release published</text>
<text x="835" y="391" font-size="11" fill="#333333" text-anchor="middle">provenance served by the</text>
<text x="835" y="406" font-size="11" fill="#333333" text-anchor="middle">Integrity API; repo URLs verified</text>

<!-- arrows -->
<line x1="250" y1="126" x2="383" y2="126" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<line x1="385" y1="160" x2="250" y2="200" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<line x1="250" y1="208" x2="728" y2="208" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<line x1="835" y1="252" x2="835" y2="270" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<line x1="730" y1="300" x2="252" y2="370" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<line x1="250" y1="364" x2="383" y2="320" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#pbtTpArrow)"/>
<line x1="250" y1="396" x2="728" y2="396" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtTpArrow)"/>
<text x="318" y="356" font-size="10" fill="#6a1b9a" text-anchor="middle">before 7</text>
</svg>
