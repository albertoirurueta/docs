<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">A two-input, two-output Functional model</title>
<desc id="d">A graph of layers: an image input and a tags input are each processed, concatenated, and then split into a classification head and a score head, built with keras.Model(inputs, outputs).</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A Functional model is a graph of layer calls</text>
<rect x="30" y="70" width="130" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="95" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Input</text>
<text x="95" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">image (None,32,32,3)</text>
<rect x="30" y="190" width="130" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="95" y="212" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Input</text>
<text x="95" y="230" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">tags (None,10)</text>
<rect x="210" y="70" width="130" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Conv2D+GAP</text>
<text x="275" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">-> (None,16)</text>
<rect x="210" y="190" width="130" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275" y="212" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Dense(16)</text>
<text x="275" y="230" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">-> (None,16)</text>
<rect x="390" y="130" width="130" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="455" y="152" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Concatenate</text>
<text x="455" y="170" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">-> (None,32)</text>
<rect x="570" y="70" width="130" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="635" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Dense(5)</text>
<text x="635" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">output: label</text>
<rect x="570" y="190" width="130" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="635" y="212" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Dense(1)</text>
<text x="635" y="230" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">output: score</text>
<line x1="160" y1="95" x2="208" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="160" y1="215" x2="208" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="340" y1="100" x2="388" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="340" y1="210" x2="388" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="520" y1="145" x2="568" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="520" y1="165" x2="568" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="280" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">keras.Model(inputs=[image, tags], outputs=[label, score]) records this graph; each box is a layer call on a symbolic KerasTensor.</text>
</svg>
