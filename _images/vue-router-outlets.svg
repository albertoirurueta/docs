<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="450" fill="#ffffff"/>

  <defs>
    <marker id="vro-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One URL selects a chain of route records</text>

  <!-- URL bar -->
  <rect x="200" y="44" width="320" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="360" y="66" font-size="14" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">/users/42/posts</text>
  <text x="262" y="95" font-size="10.5" fill="#2f6fa8" text-anchor="middle">matches /users/:id</text>
  <text x="440" y="95" font-size="10.5" fill="#c25a1d" text-anchor="middle">matches posts</text>

  <!-- left: route records -->
  <text x="177" y="124" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">route records</text>

  <rect x="34" y="136" width="286" height="96" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="48" y="160" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">{ path: '/users/:id',</text>
  <text x="48" y="180" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">  component: UserLayout,</text>
  <text x="48" y="200" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">  children: [</text>
  <text x="48" y="220" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">    ... ] }</text>

  <line x1="120" y1="232" x2="120" y2="264" stroke="#999999" stroke-width="1.4"/>
  <polygon points="114,262 126,262 120,270" fill="#999999"/>
  <text x="150" y="253" font-size="10.5" fill="#444444">children</text>

  <rect x="70" y="270" width="250" height="74" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="84" y="294" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">{ path: 'posts',</text>
  <text x="84" y="314" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">  component:</text>
  <text x="84" y="333" font-size="12.5" fill="#1c4b73" font-family="'Courier New', monospace">    UserPosts }</text>

  <!-- right: nested outlets -->
  <text x="542" y="124" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">nested &lt;RouterView&gt; outlets</text>

  <rect x="392" y="132" width="300" height="286" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="404" y="151" font-size="12" font-weight="bold" fill="#222222">App.vue</text>
  <text x="404" y="169" font-size="10.5" fill="#666666" font-family="'Courier New', monospace">&lt;RouterView/&gt;</text>

  <rect x="410" y="178" width="264" height="222" rx="6" fill="#f4f8fd" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="422" y="197" font-size="12" font-weight="bold" fill="#1c4b73">UserLayout.vue</text>
  <text x="422" y="215" font-size="10.5" fill="#666666" font-family="'Courier New', monospace">&lt;RouterView/&gt;</text>

  <rect x="428" y="224" width="228" height="160" rx="6" fill="#fdf1e8" stroke="#c25a1d" stroke-width="1.8"/>
  <text x="440" y="245" font-size="12" font-weight="bold" fill="#c25a1d">UserPosts.vue</text>
  <text x="440" y="265" font-size="10.5" fill="#7a4a2a">rendered leaf view</text>

  <!-- arrows: records -> outlets -->
  <line x1="320" y1="172" x2="402" y2="182" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#vro-arrow)"/>
  <line x1="320" y1="300" x2="420" y2="234" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#vro-arrow)"/>

  <text x="360" y="438" font-size="12" fill="#444444" text-anchor="middle">Each matched record renders into the &lt;RouterView&gt; of the record above it.</text>
</svg>
