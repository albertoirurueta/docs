<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-us-ai-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The Sentis workflow, from a model file to a number in your game</text>
<rect x="20" y="60" width="130" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="90.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Import</text>
<text x="85.0" y="105.5" text-anchor="middle" font-size="11" fill="#3730A3">model.onnx in Assets</text>
<text x="85.0" y="120.5" text-anchor="middle" font-size="11" fill="#3730A3">becomes a ModelAsset</text>
<circle cx="32" cy="60" r="11" fill="#4F46E5"/><text x="32" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="150" y1="102" x2="164" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-f)"/>
<rect x="164" y="60" width="130" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="229.0" y="90.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Load</text>
<text x="229.0" y="105.5" text-anchor="middle" font-size="11" fill="#3730A3">ModelLoader.Load</text>
<text x="229.0" y="120.5" text-anchor="middle" font-size="11" fill="#3730A3">returns a Model</text>
<circle cx="176" cy="60" r="11" fill="#4F46E5"/><text x="176" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="294" y1="102" x2="308" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-f)"/>
<rect x="308" y="60" width="130" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="373.0" y="90.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Create worker</text>
<text x="373.0" y="105.5" text-anchor="middle" font-size="11" fill="#3730A3">new Worker(model,</text>
<text x="373.0" y="120.5" text-anchor="middle" font-size="11" fill="#3730A3">backend)</text>
<circle cx="320" cy="60" r="11" fill="#4F46E5"/><text x="320" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="438" y1="102" x2="452" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-f)"/>
<rect x="452" y="60" width="130" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="517.0" y="90.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Schedule</text>
<text x="517.0" y="105.5" text-anchor="middle" font-size="11" fill="#3730A3">worker.Schedule(input)</text>
<text x="517.0" y="120.5" text-anchor="middle" font-size="11" fill="#3730A3">queues the layers</text>
<circle cx="464" cy="60" r="11" fill="#4F46E5"/><text x="464" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="582" y1="102" x2="596" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-f)"/>
<rect x="596" y="60" width="130" height="84" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="661.0" y="90.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Read output</text>
<text x="661.0" y="105.5" text-anchor="middle" font-size="11" fill="#1F2937">PeekOutput(), then</text>
<text x="661.0" y="120.5" text-anchor="middle" font-size="11" fill="#1F2937">async readback</text>
<circle cx="608" cy="60" r="11" fill="#4F46E5"/><text x="608" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<rect x="20" y="170" width="340" height="96" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="199.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Backends</text>
<text x="190.0" y="214.0" text-anchor="middle" font-size="11" fill="#374151">CPU: small models, data already on the CPU</text>
<text x="190.0" y="229.0" text-anchor="middle" font-size="11" fill="#374151">GPUCompute: usually fastest, needs compute shaders</text>
<text x="190.0" y="244.0" text-anchor="middle" font-size="11" fill="#374151">GPUPixel: only where compute is missing</text>
<line x1="190" y1="170" x2="373" y2="144" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-us-ai-f)"/>
<rect x="400" y="170" width="340" height="96" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="199.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Input tensor</text>
<text x="570.0" y="214.0" text-anchor="middle" font-size="11" fill="#374151">Tensor&lt;float&gt; with a TensorShape</text>
<text x="570.0" y="229.0" text-anchor="middle" font-size="11" fill="#374151">TextureConverter.ToTensor(texture, tensor)</text>
<text x="570.0" y="244.0" text-anchor="middle" font-size="11" fill="#374151">array constructor for numbers</text>
<line x1="570" y1="170" x2="517" y2="144" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-us-ai-f)"/>
<rect x="20" y="286" width="720" height="92" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="313.0" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Rules that keep it fast and leak free</text>
<text x="380.0" y="328.0" text-anchor="middle" font-size="11" fill="#92400E">Read results asynchronously (ReadbackAndCloneAsync) so the main thread does not stall on the GPU.</text>
<text x="380.0" y="343.0" text-anchor="middle" font-size="11" fill="#92400E">Dispose tensors you own and the Worker in OnDisable. PeekOutput does not transfer ownership.</text>
<text x="380.0" y="358.0" text-anchor="middle" font-size="11" fill="#92400E">Profile with the Unity Profiler before choosing a backend; unsupported operators assert on a backend.</text>
</svg>
