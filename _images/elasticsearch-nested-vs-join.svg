<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One post, many comments &#8212; nested block vs. the join field</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Both keep the related data on one shard; they differ in whether the children are separate, independently updatable documents</text>

  <line x1="380" y1="60" x2="380" y2="352" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: nested -->
  <text x="197" y="78" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">nested &#8212; children inside the parent doc</text>

  <rect x="34" y="90" width="326" height="250" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="48" y="108" font-size="10.5" fill="#666666">shard 1</text>

  <rect x="48" y="118" width="298" height="168" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <g font-family="'Courier New', monospace" font-size="11" fill="#222222">
    <text x="60" y="138">{ _id: "post-1",</text>
    <text x="60" y="156">&#160;&#160;title: "Sharding",</text>
    <text x="60" y="174">&#160;&#160;comments: [</text>
    <text x="60" y="192">&#160;&#160;&#160;&#160;{ author: "alice", stars: 5 },</text>
    <text x="60" y="210">&#160;&#160;&#160;&#160;{ author: "bob",&#160;&#160;&#160;stars: 1 },</text>
    <text x="60" y="228">&#160;&#160;&#160;&#160;{ author: "cara",&#160;&#160;stars: 4 }</text>
    <text x="60" y="246">&#160;&#160;]</text>
    <text x="60" y="264">}</text>
  </g>
  <text x="48" y="308" font-size="10.5" fill="#666666">1 visible doc + 3 hidden Lucene sub-docs, one segment.</text>
  <text x="48" y="326" font-size="10.5" fill="#666666">Change one comment &#8594; reindex the whole post.</text>

  <!-- RIGHT: join field -->
  <text x="563" y="78" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">join field &#8212; separate parent + child docs</text>

  <rect x="400" y="90" width="326" height="250" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="108" font-size="10" fill="#666666">shard 1&#160;&#160;(same shard &#8212; routing=post-1 on every child)</text>

  <rect x="470" y="118" width="244" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="482" y="142" font-family="'Courier New', monospace" font-size="11" fill="#222222">{ _id: "post-1", join: "post" }</text>

  <rect x="470" y="170" width="244" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="482" y="191" font-family="'Courier New', monospace" font-size="11" fill="#222222">{ _id: "comment-1", parent: "post-1" }</text>

  <rect x="470" y="214" width="244" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="482" y="235" font-family="'Courier New', monospace" font-size="11" fill="#222222">{ _id: "comment-2", parent: "post-1" }</text>

  <rect x="470" y="258" width="244" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="482" y="279" font-family="'Courier New', monospace" font-size="11" fill="#222222">{ _id: "comment-3", parent: "post-1" }</text>

  <!-- connectors child -> parent -->
  <g stroke="#999999" stroke-width="1.4" fill="none">
    <path d="M470,187 H452 V145 H466"/>
    <path d="M470,231 H452 V145"/>
    <path d="M470,275 H452 V145"/>
  </g>
  <polygon points="466,141 466,149 474,145" fill="#999999"/>

  <text x="414" y="312" font-size="10.5" fill="#666666">Each child routed to the parent's shard.</text>
  <text x="414" y="330" font-size="10.5" fill="#666666">Update or delete one comment on its own.</text>

  <!-- decision strip -->
  <rect x="34" y="362" width="692" height="94" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="48" y="386" font-size="12.5" font-weight="bold" fill="#222222">Choosing a model</text>
  <text x="48" y="410" font-size="11.5" fill="#222222">Bounded child set, always queried with the parent, changes rarely?&#160;&#160;&#8226;&#160;&#160;Large or churny child set, written on its own?&#160;&#160;&#8226;&#160;&#160;Neither?</text>
  <text x="48" y="436" font-size="12" font-weight="bold" fill="#2f5424">&#8594; nested</text>
  <text x="200" y="436" font-size="12" font-weight="bold" fill="#1c4b73">&#8594; join field</text>
  <text x="360" y="436" font-size="12" font-weight="bold" fill="#444444">&#8594; denormalize + application-side join</text>
</svg>
