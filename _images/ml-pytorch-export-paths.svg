<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">torch.export is the common entry point</title>
<desc id="d">A model is captured once with torch.export into an ExportedProgram. From there three paths lead to deployment artifacts: AOTInductor produces a compiled .pt2 package for C++ or Python servers, torch.onnx.export produces an ONNX file for ONNX Runtime and other runtimes, and ExecuTorch lowering produces a .pte file for mobile and edge devices.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">torch.export is the common entry point for deployment</text>
<rect x="20" y="140" width="130" height="60" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="85" y="166" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">nn.Module</text><text x="85" y="184" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">+ example inputs</text>
<rect x="190" y="140" width="170" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="275" y="166" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">torch.export.export</text><text x="275" y="184" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">ExportedProgram</text>
<line x1="150" y1="170" x2="188" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="60" width="280" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="560" y="86" font-size="14" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">AOTInductor</text><text x="560" y="106" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">model.pt2 (C++ or Python)</text>
<line x1="360" y1="170" x2="418" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="160" width="280" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="560" y="186" font-size="14" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">torch.onnx.export</text><text x="560" y="206" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">model.onnx (ONNX Runtime)</text>
<line x1="360" y1="170" x2="418" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="260" width="280" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="560" y="286" font-size="14" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ExecuTorch lowering</text><text x="560" y="306" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">model.pte (mobile and edge)</text>
<line x1="360" y1="170" x2="418" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="340" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Server and C++, portable runtimes, and on-device are three different targets</text>
</svg>
