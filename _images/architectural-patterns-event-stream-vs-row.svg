<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">State-based persistence vs. event sourcing</text>

  <defs>
    <marker id="es-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
    <marker id="es-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Left: state-based row -->
  <text x="190" y="62" font-size="13" font-weight="bold" fill="#a8412e" text-anchor="middle">State-based: Order row (overwritten in place)</text>

  <rect x="80" y="80" width="220" height="46" rx="6" fill="#f6f6f6" stroke="#bbbbbb" stroke-width="1.6" opacity="0.4"/>
  <text x="190" y="107" font-size="9.5" fill="#999999" text-anchor="middle" opacity="0.7">APPROVAL_PENDING, lines: [A, B, C] -- gone</text>

  <rect x="80" y="134" width="220" height="46" rx="6" fill="#f6f6f6" stroke="#bbbbbb" stroke-width="1.6" opacity="0.65"/>
  <text x="190" y="161" font-size="9.5" fill="#999999" text-anchor="middle" opacity="0.85">APPROVAL_PENDING, lines: [A, C] -- gone</text>

  <rect x="80" y="188" width="220" height="46" rx="6" fill="#fbecea" stroke="#a8412e" stroke-width="2.2"/>
  <text x="190" y="211" font-size="10.5" font-weight="bold" fill="#a8412e" text-anchor="middle">current row (only this survives)</text>
  <text x="190" y="226" font-size="9.5" fill="#333333" text-anchor="middle">APPROVED, lines: [A, C]</text>

  <line x1="190" y1="126" x2="190" y2="134" stroke="#bbbbbb" stroke-width="1.6" marker-end="url(#es-arrow-grey)"/>
  <line x1="190" y1="180" x2="190" y2="188" stroke="#a8412e" stroke-width="2" marker-end="url(#es-arrow-grey)"/>
  <text x="230" y="132" font-size="9" fill="#999999" text-anchor="middle">UPDATE</text>
  <text x="230" y="186" font-size="9" fill="#a8412e" text-anchor="middle">UPDATE</text>

  <text x="190" y="266" font-size="10" fill="#555555" text-anchor="middle">No history: every prior value is unrecoverable</text>
  <text x="190" y="282" font-size="10" fill="#555555" text-anchor="middle">the moment a later UPDATE commits.</text>

  <!-- Divider -->
  <line x1="390" y1="60" x2="390" y2="300" stroke="#dddddd" stroke-width="1.5"/>

  <!-- Right: event stream -->
  <text x="590" y="62" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Event sourcing: event_store stream (append-only)</text>

  <rect x="480" y="80" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="590" y="102" font-size="10" fill="#2d6a34" text-anchor="middle">v1  OrderPlaced (lines A, B, C)</text>

  <rect x="480" y="122" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="590" y="144" font-size="10" fill="#2d6a34" text-anchor="middle">v2  line B removed</text>

  <rect x="480" y="164" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="590" y="186" font-size="10" fill="#2d6a34" text-anchor="middle">v3  OrderApproved</text>

  <text x="590" y="216" font-size="16" fill="#999999" text-anchor="middle">...</text>

  <text x="590" y="246" font-size="10" fill="#555555" text-anchor="middle">Every event ever raised is still present --</text>
  <text x="590" y="262" font-size="10" fill="#555555" text-anchor="middle">nothing is overwritten, nothing is deleted.</text>

  <!-- Fold arrow to current state -->
  <rect x="480" y="278" width="220" height="40" rx="6" fill="#fdf3e3" stroke="#a8781f" stroke-width="2"/>
  <text x="590" y="302" font-size="10" font-weight="bold" fill="#a8781f" text-anchor="middle">fold(apply, v1..v3) -&gt; APPROVED, [A, C]</text>

  <line x1="590" y1="198" x2="590" y2="274" stroke="#a8781f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#es-arrow-green)"/>
  <text x="640" y="238" font-size="9" fill="#a8781f" text-anchor="middle">replay</text>

  <text x="390" y="350" font-size="11" fill="#333333" text-anchor="middle">Both sides agree on current state -- APPROVED, lines [A, C] -- but only the stream can still answer</text>
  <text x="390" y="368" font-size="11" fill="#333333" text-anchor="middle">"what did this order look like before line B was removed," or "when exactly was it approved."</text>

  <text x="390" y="404" font-size="10.5" fill="#444444" text-anchor="middle">A snapshot at some version lets replay start from there instead of from v1, bounding replay cost.</text>
</svg>
