<svg viewBox="0 0 820 460" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Azure Storage redundancy options</text>
  <text x="410" y="44" text-anchor="middle" font-size="11.5" fill="#5f6368">Primary-region copies vs. secondary-region copies vs. read access to the secondary</text>

  <!-- Column headers -->
  <text x="145" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">LRS</text>
  <text x="265" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">ZRS</text>
  <text x="385" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GRS</text>
  <text x="505" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">RA-GRS</text>
  <text x="625" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GZRS</text>
  <text x="745" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">RA-GZRS</text>

  <!-- Row labels -->
  <text x="8" y="105" font-size="11" font-weight="600" fill="#1a1a1a">Primary region</text>
  <text x="8" y="150" font-size="11" font-weight="600" fill="#1a1a1a">Secondary region</text>
  <text x="8" y="195" font-size="11" font-weight="600" fill="#1a1a1a">Secondary read access</text>
  <text x="8" y="240" font-size="11" font-weight="600" fill="#1a1a1a">Durability / year</text>

  <!-- grid geometry: columns centered at 145,265,385,505,625,745 each 100 wide -->
  <!-- Row 1: Primary region replication -->
  <g font-size="10" text-anchor="middle">
    <rect x="95" y="82" width="100" height="34" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="145" y="103" fill="#123a70">1 datacenter</text>

    <rect x="215" y="82" width="100" height="34" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="265" y="98" fill="#0d4c22">3+ availability</text>
    <text x="265" y="110" fill="#0d4c22">zones</text>

    <rect x="335" y="82" width="100" height="34" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="385" y="103" fill="#123a70">1 datacenter (LRS)</text>

    <rect x="455" y="82" width="100" height="34" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="505" y="103" fill="#123a70">1 datacenter (LRS)</text>

    <rect x="575" y="82" width="100" height="34" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="625" y="98" fill="#0d4c22">3+ availability</text>
    <text x="625" y="110" fill="#0d4c22">zones (ZRS)</text>

    <rect x="695" y="82" width="100" height="34" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="745" y="98" fill="#0d4c22">3+ availability</text>
    <text x="745" y="110" fill="#0d4c22">zones (ZRS)</text>
  </g>

  <!-- Row 2: Secondary region -->
  <g font-size="10" text-anchor="middle">
    <rect x="95" y="127" width="100" height="34" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/>
    <text x="145" y="148" fill="#5f6368">none</text>

    <rect x="215" y="127" width="100" height="34" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/>
    <text x="265" y="148" fill="#5f6368">none</text>

    <rect x="335" y="127" width="100" height="34" fill="#fbe8cf" stroke="#f29900" stroke-width="1"/>
    <text x="385" y="143" fill="#7a4a00">async copy,</text>
    <text x="385" y="155" fill="#7a4a00">LRS in secondary</text>

    <rect x="455" y="127" width="100" height="34" fill="#fbe8cf" stroke="#f29900" stroke-width="1"/>
    <text x="505" y="143" fill="#7a4a00">async copy,</text>
    <text x="505" y="155" fill="#7a4a00">LRS in secondary</text>

    <rect x="575" y="127" width="100" height="34" fill="#fbe8cf" stroke="#f29900" stroke-width="1"/>
    <text x="625" y="143" fill="#7a4a00">async copy,</text>
    <text x="625" y="155" fill="#7a4a00">LRS in secondary</text>

    <rect x="695" y="127" width="100" height="34" fill="#fbe8cf" stroke="#f29900" stroke-width="1"/>
    <text x="745" y="143" fill="#7a4a00">async copy,</text>
    <text x="745" y="155" fill="#7a4a00">LRS in secondary</text>
  </g>

  <!-- Row 3: Read access to secondary -->
  <g font-size="10.5" text-anchor="middle" font-weight="600">
    <rect x="95" y="172" width="100" height="28" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
    <text x="145" y="190" fill="#7a1a17">n/a</text>

    <rect x="215" y="172" width="100" height="28" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
    <text x="265" y="190" fill="#7a1a17">n/a</text>

    <rect x="335" y="172" width="100" height="28" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
    <text x="385" y="190" fill="#7a1a17">no</text>

    <rect x="455" y="172" width="100" height="28" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="505" y="190" fill="#0d4c22">yes</text>

    <rect x="575" y="172" width="100" height="28" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
    <text x="625" y="190" fill="#7a1a17">no</text>

    <rect x="695" y="172" width="100" height="28" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="745" y="190" fill="#0d4c22">yes</text>
  </g>

  <!-- Row 4: Durability -->
  <g font-size="10" text-anchor="middle" font-weight="600">
    <rect x="95" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="145" y="235" fill="#1a1a1a">11 nines</text>

    <rect x="215" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="265" y="235" fill="#1a1a1a">12 nines</text>

    <rect x="335" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="385" y="235" fill="#1a1a1a">16 nines</text>

    <rect x="455" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="505" y="235" fill="#1a1a1a">16 nines</text>

    <rect x="575" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="625" y="235" fill="#1a1a1a">16 nines</text>

    <rect x="695" y="217" width="100" height="28" fill="#ffffff" stroke="#c7c7c7" stroke-width="1"/>
    <text x="745" y="235" fill="#1a1a1a">16 nines</text>
  </g>

  <line x1="0" y1="255" x2="820" y2="255" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Outage-survival matrix -->
  <text x="8" y="278" font-size="12" font-weight="700" fill="#1a1a1a">Survives without failover:</text>

  <text x="8" y="302" font-size="10.5" fill="#1a1a1a">Node failure</text>
  <text x="8" y="326" font-size="10.5" fill="#1a1a1a">Datacenter/zone loss</text>
  <text x="8" y="350" font-size="10.5" fill="#1a1a1a">Region-wide outage</text>

  <g font-size="11" text-anchor="middle" font-weight="700">
    <!-- Node failure row: all yes -->
    <text x="145" y="302" fill="#188038">Yes</text>
    <text x="265" y="302" fill="#188038">Yes</text>
    <text x="385" y="302" fill="#188038">Yes</text>
    <text x="505" y="302" fill="#188038">Yes</text>
    <text x="625" y="302" fill="#188038">Yes</text>
    <text x="745" y="302" fill="#188038">Yes</text>

    <!-- Datacenter/zone loss: LRS no, others yes -->
    <text x="145" y="326" fill="#c5221f">No</text>
    <text x="265" y="326" fill="#188038">Yes</text>
    <text x="385" y="326" fill="#188038">Yes*</text>
    <text x="505" y="326" fill="#188038">Yes*</text>
    <text x="625" y="326" fill="#188038">Yes</text>
    <text x="745" y="326" fill="#188038">Yes</text>

    <!-- Region-wide outage: only GRS family, with failover -->
    <text x="145" y="350" fill="#c5221f">No</text>
    <text x="265" y="350" fill="#c5221f">No</text>
    <text x="385" y="350" fill="#188038">Yes*</text>
    <text x="505" y="350" fill="#188038">Yes*</text>
    <text x="625" y="350" fill="#188038">Yes*</text>
    <text x="745" y="350" fill="#188038">Yes*</text>
  </g>

  <text x="8" y="374" font-size="9.5" fill="#5f6368">* Write availability requires an account failover to the secondary region; RA-GRS/RA-GZRS keep read access without one.</text>

  <line x1="0" y1="388" x2="820" y2="388" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Legend -->
  <g font-size="10">
    <rect x="8" y="398" width="14" height="14" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="26" y="409" fill="#3c4043">Single datacenter (LRS-style)</text>

    <rect x="220" y="398" width="14" height="14" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="238" y="409" fill="#3c4043">Zone-redundant (ZRS-style)</text>

    <rect x="420" y="398" width="14" height="14" fill="#fbe8cf" stroke="#f29900" stroke-width="1"/>
    <text x="438" y="409" fill="#3c4043">Async geo-replicated secondary</text>

    <rect x="8" y="420" width="14" height="14" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
    <text x="26" y="431" fill="#3c4043">Secondary readable (RA- variants)</text>

    <rect x="260" y="420" width="14" height="14" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
    <text x="278" y="431" fill="#3c4043">Secondary not readable / n/a</text>
  </g>

  <text x="8" y="452" font-size="9.5" fill="#5f6368">Geo priority replication targets an RPO &#8804; 15 minutes for block blobs on geo-redundant accounts.</text>
</svg>
