<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One package of DTOs, imported by the server and by every Apple client</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the wire types are written once; the compiler checks both ends of every request</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3d9a"/></marker>
  </defs>

  <!-- shared package -->
  <rect x="190" y="64" width="560" height="150" rx="10" fill="#fff8e1" stroke="#b58900" stroke-width="1.8"/>
  <text x="470" y="88" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">BookshelfShared (SwiftPM package, Foundation only)</text>
  <rect x="210" y="104" width="240" height="92" rx="6" fill="#ffffff" stroke="#b58900"/>
  <text x="330" y="124" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">library BookshelfShared</text>
  <text x="330" y="146" font-size="11" fill="#222222" text-anchor="middle">BookDTO, TokenDTO, ErrorDTO</text>
  <text x="330" y="164" font-size="11" fill="#666666" text-anchor="middle">Codable, Sendable, Hashable</text>
  <text x="330" y="182" font-size="11" fill="#666666" text-anchor="middle">no Vapor, no SwiftUI import</text>
  <rect x="470" y="104" width="260" height="92" rx="6" fill="#ffffff" stroke="#b58900"/>
  <text x="600" y="124" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">library FieldNotesWire</text>
  <text x="600" y="146" font-size="11" fill="#222222" text-anchor="middle">RemoteNote, ServiceStatus</text>
  <text x="600" y="164" font-size="11" fill="#222222" text-anchor="middle">FieldNotesCoding (snake_case, ISO 8601)</text>
  <text x="600" y="182" font-size="11" fill="#666666" text-anchor="middle">the /v1/notes contract</text>

  <!-- consumers -->
  <rect x="30" y="300" width="250" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="155" y="324" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">BookshelfServer (Vapor)</text>
  <text x="155" y="346" font-size="11" fill="#222222" text-anchor="middle">adds @retroactive Content</text>
  <text x="155" y="364" font-size="11" fill="#222222" text-anchor="middle">maps Fluent models to DTOs</text>
  <text x="155" y="382" font-size="11" fill="#222222" text-anchor="middle">/api/v1/books, /v1/notes, /status</text>
  <text x="155" y="400" font-size="11" fill="#666666" text-anchor="middle">Linux or macOS</text>

  <rect x="345" y="300" width="250" height="110" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.6"/>
  <text x="470" y="324" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">iOS app (SwiftUI)</text>
  <text x="470" y="346" font-size="11" fill="#222222" text-anchor="middle">API-client actor, URLSession</text>
  <text x="470" y="364" font-size="11" fill="#222222" text-anchor="middle">token in the Keychain</text>
  <text x="470" y="382" font-size="11" fill="#222222" text-anchor="middle">decodes the same DTO types</text>
  <text x="470" y="400" font-size="11" fill="#666666" text-anchor="middle">iOS 17+</text>

  <rect x="660" y="300" width="250" height="110" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.6"/>
  <text x="785" y="324" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">macOS and tvOS targets</text>
  <text x="785" y="346" font-size="11" fill="#222222" text-anchor="middle">same client package</text>
  <text x="785" y="364" font-size="11" fill="#222222" text-anchor="middle">same SwiftUI views where the</text>
  <text x="785" y="382" font-size="11" fill="#222222" text-anchor="middle">platform allows</text>
  <text x="785" y="400" font-size="11" fill="#666666" text-anchor="middle">macOS 14+, tvOS 17+</text>

  <!-- imports -->
  <line x1="155" y1="298" x2="270" y2="216" stroke="#6a3d9a" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="470" y1="298" x2="470" y2="216" stroke="#6a3d9a" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="785" y1="298" x2="670" y2="216" stroke="#6a3d9a" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="205" y="262" font-size="11" fill="#6a3d9a" text-anchor="end">import</text>
  <text x="480" y="262" font-size="11" fill="#6a3d9a">import</text>
  <text x="735" y="262" font-size="11" fill="#6a3d9a">import</text>

  <!-- http -->
  <line x1="282" y1="355" x2="343" y2="355" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="343" y1="375" x2="282" y2="375" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="313" y="346" font-size="11" fill="#222222" text-anchor="middle">HTTPS</text>
  <text x="313" y="392" font-size="11" fill="#222222" text-anchor="middle">JSON</text>
  <!-- optional openapi -->
  <rect x="190" y="470" width="560" height="50" rx="8" fill="#f5f5f5" stroke="#888888" stroke-dasharray="6 4"/>
  <text x="470" y="491" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Optional alternative: OpenAPI document served by the server</text>
  <text x="470" y="509" font-size="11" fill="#666666" text-anchor="middle">swift-openapi-generator creates the client types instead of a hand-shared package</text>
</svg>
