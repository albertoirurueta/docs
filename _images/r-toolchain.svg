<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="15">
<title id="t">The R toolchain: editor, interpreter, libraries and package sources</title>
<desc id="d">A layered diagram. At the top an editor or IDE sends code to the R interpreter and shows its output. The interpreter offers the R console, Rscript for scripts and R CMD tools, and reads packages from libraries with library(). The libraries are the system library that ships with R, holding the base and recommended packages, and the site and user libraries listed by .libPaths(), where install.packages() writes. CRAN and Bioconductor are the sources that install.packages() and BiocManager::install() copy packages from into the user library. A dashed box shows that compilers (Rtools, the Xcode command-line tools, gcc and gfortran) are needed by R only to build source packages that contain C, C++ or Fortran code.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker></defs>
<rect width="960" height="540" fill="#ffffff" stroke="#9aa3ad"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f2933">The R toolchain, from the editor down to the packages on disk</text>

<rect x="40" y="46" width="880" height="66" fill="#fbe7b5" stroke="#52606d"/>
<text x="480" y="72" text-anchor="middle" font-weight="bold" fill="#1f2933">Editor or IDE</text>
<text x="480" y="97" text-anchor="middle" font-size="14" fill="#1f2933">RStudio, Positron, VS Code, Emacs with ESS, R.app on macOS, or a plain terminal</text>

<line x1="210" y1="112" x2="210" y2="152" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="224" y="137" font-size="14" fill="#3e4c59">code in, output out</text>

<rect x="40" y="154" width="340" height="190" fill="#cfe3f7" stroke="#52606d"/>
<text x="56" y="180" font-weight="bold" fill="#1f2933">R: the interpreter</text>
<rect x="56" y="192" width="308" height="40" fill="#ffffff" stroke="#9aa3ad"/>
<text x="68" y="210" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">R</text>
<text x="68" y="226" font-size="14" fill="#3e4c59">interactive console with the &gt; prompt</text>
<rect x="56" y="242" width="308" height="40" fill="#ffffff" stroke="#9aa3ad"/>
<text x="68" y="260" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">Rscript file.R</text>
<text x="68" y="276" font-size="14" fill="#3e4c59">non-interactive scripts</text>
<rect x="56" y="292" width="308" height="40" fill="#ffffff" stroke="#9aa3ad"/>
<text x="68" y="310" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">R CMD INSTALL | BATCH | check</text>
<text x="68" y="326" font-size="14" fill="#3e4c59">command-line tools</text>

<line x1="380" y1="262" x2="460" y2="262" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="420" y="250" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">library()</text>

<rect x="460" y="154" width="460" height="190" fill="#f5f7fa" stroke="#52606d"/>
<text x="476" y="180" font-weight="bold" fill="#1f2933">Libraries: folders of installed packages</text>
<rect x="476" y="192" width="428" height="72" fill="#d9efd6" stroke="#52606d"/>
<text x="488" y="212" font-size="14" font-weight="bold" fill="#1f2933">System library (.Library), shipped with R</text>
<text x="488" y="232" font-size="14" fill="#1f2933">base: base, stats, utils, methods, graphics, ...</text>
<text x="488" y="252" font-size="14" fill="#1f2933">recommended: MASS, lattice, Matrix, survival, ...</text>
<rect x="476" y="274" width="428" height="60" fill="#fbe7b5" stroke="#52606d"/>
<text x="488" y="294" font-size="14" font-weight="bold" fill="#1f2933">Site and user libraries, listed by .libPaths()</text>
<text x="488" y="316" font-size="14" fill="#1f2933">install.packages() writes to the first entry</text>

<line x1="570" y1="394" x2="570" y2="346" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<line x1="810" y1="394" x2="810" y2="346" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="460" y="396" width="220" height="70" fill="#cfe3f7" stroke="#52606d"/>
<text x="570" y="420" text-anchor="middle" font-weight="bold" fill="#1f2933">CRAN</text>
<text x="570" y="440" text-anchor="middle" font-size="14" fill="#1f2933">mirrors of the archive</text>
<text x="570" y="458" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">install.packages()</text>
<rect x="700" y="396" width="220" height="70" fill="#cfe3f7" stroke="#52606d"/>
<text x="810" y="420" text-anchor="middle" font-weight="bold" fill="#1f2933">Bioconductor</text>
<text x="810" y="440" text-anchor="middle" font-size="14" fill="#1f2933">genomics and omics packages</text>
<text x="810" y="458" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">BiocManager::install()</text>

<line x1="210" y1="396" x2="210" y2="348" stroke="#52606d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="224" y="378" font-size="14" fill="#3e4c59">builds source packages</text>
<rect x="40" y="398" width="380" height="68" fill="#ffffff" stroke="#52606d" stroke-dasharray="6 4"/>
<text x="56" y="420" font-weight="bold" fill="#1f2933">Build tools, only for compiled code</text>
<text x="56" y="440" font-size="14" fill="#1f2933">Rtools (Windows), Xcode command-line tools</text>
<text x="56" y="458" font-size="14" fill="#1f2933">(macOS), gcc and gfortran (Linux)</text>

<text x="20" y="500" font-size="14" fill="#3e4c59">Library folders and compiled binary packages belong to one x.y series of R (4.6 here), so a new minor release</text>
<text x="20" y="520" font-size="14" fill="#3e4c59">starts with its own empty user library.</text>
</svg>
