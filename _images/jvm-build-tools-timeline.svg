<text x="432.6" y="490" font-size="11" fill="#444444" text-anchor="middle">2010</text>
<line x1="578.9" y1="470" x2="578.9" y2="476" stroke="#444444"/>
<text x="578.9" y="490" font-size="11" fill="#444444" text-anchor="middle">2015</text>
<line x1="725.2" y1="470" x2="725.2" y2="476" stroke="#444444"/>
<text x="725.2" y="490" font-size="11" fill="#444444" text-anchor="middle">2020</text>
<line x1="871.5" y1="470" x2="871.5" y2="476" stroke="#444444"/>
