<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From Make to Ant, Maven and Gradle: a timeline of JVM build tools</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Release dates from each project's own history pages; JDK 8+ and JVM 17+ are the Java versions needed to run the tool</text>
<rect x="20" y="62" width="920" height="26" fill="#f3f3f3" stroke="#bbbbbb"/>
<text x="480" y="80" font-size="12" fill="#333333" text-anchor="middle">Before the axis: Make (1970s) described builds as files that depend on files; Ant, Maven and Gradle each answer its limits differently</text>
<text x="20" y="154" font-size="13" font-weight="bold" fill="#7a4500">Ant and Ivy</text>
<line x1="140" y1="150" x2="930" y2="150" stroke="#a65e00" stroke-width="2"/>
<text x="20" y="274" font-size="13" font-weight="bold" fill="#1c4b73">Maven</text>
<line x1="140" y1="270" x2="930" y2="270" stroke="#1c4b73" stroke-width="2"/>
<text x="20" y="394" font-size="13" font-weight="bold" fill="#1b5e20">Gradle</text>
<line x1="140" y1="390" x2="930" y2="390" stroke="#2e7d32" stroke-width="2"/>
<circle cx="156.1" cy="150" r="5" fill="#a65e00"/>
<line x1="156.1" y1="145" x2="156.1" y2="128" stroke="#a65e00"/>
<text x="156.1" y="110" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="start">Ant 1.1</text>
<text x="156.1" y="124" font-size="11" fill="#555555" text-anchor="start">Jul 2000, first stand-alone release</text>
<circle cx="367.6" cy="150" r="5" fill="#a65e00"/>
<line x1="367.6" y1="155" x2="367.6" y2="172" stroke="#a65e00"/>
<text x="367.6" y="186" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">Ivy graduates</text>
<text x="367.6" y="200" font-size="11" fill="#555555" text-anchor="middle">Oct 2007, subproject of Ant</text>
<circle cx="921.2" cy="150" r="5" fill="#a65e00"/>
<line x1="921.2" y1="145" x2="921.2" y2="128" stroke="#a65e00"/>
<text x="921.2" y="110" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="end">Ant 1.10.18</text>
<text x="921.2" y="124" font-size="11" fill="#555555" text-anchor="end">Sep 2026, runs on JDK 8+</text>
<circle cx="272.5" cy="270" r="5" fill="#1c4b73"/>
