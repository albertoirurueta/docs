<text x="625.7" y="440" font-size="11" fill="#555555" text-anchor="middle">2016, first Kotlin build scripts</text>
<circle cx="693.0" cy="390" r="5" fill="#2e7d32"/>
<line x1="693.0" y1="385" x2="693.0" y2="368" stroke="#2e7d32"/>
<text x="693.0" y="350" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">Gradle 5.0</text>
<text x="693.0" y="364" font-size="11" fill="#555555" text-anchor="middle">Nov 2018, Kotlin DSL 1.0</text>
<circle cx="888.5" cy="390" r="5" fill="#2e7d32"/>
<line x1="888.5" y1="395" x2="888.5" y2="412" stroke="#2e7d32"/>
<text x="888.5" y="426" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="end">Gradle 9.0</text>
<text x="888.5" y="440" font-size="11" fill="#555555" text-anchor="end">Jul 2025, JVM 17+</text>
<circle cx="923.6" cy="390" r="5" fill="#2e7d32"/>
<line x1="923.6" y1="385" x2="923.6" y2="368" stroke="#2e7d32"/>
<text x="923.6" y="350" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="end">Gradle 9.8.1</text>
<text x="923.6" y="364" font-size="11" fill="#555555" text-anchor="end">Oct 2026</text>
