<text x="922.4" y="230" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="end">Maven 3.10.0</text>
<text x="922.4" y="244" font-size="11" fill="#555555" text-anchor="end">Sep 2026, runs on JDK 8+</text>
<circle cx="921.8" cy="270" r="5" fill="#1c4b73"/>
