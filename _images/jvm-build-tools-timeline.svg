<text x="309.7" y="320" font-size="11" fill="#555555" text-anchor="middle">Oct 2005</text>
<circle cx="452.2" cy="270" r="5" fill="#1c4b73"/>
<line x1="452.2" y1="265" x2="452.2" y2="248" stroke="#1c4b73"/>
<text x="452.2" y="230" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Maven 3.0</text>
<text x="452.2" y="244" font-size="11" fill="#555555" text-anchor="middle">Sep 2010</text>
<circle cx="922.4" cy="270" r="5" fill="#1c4b73"/>
