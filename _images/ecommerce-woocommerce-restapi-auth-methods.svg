<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a request to the WooCommerce REST API proves who it is</title>
  <desc id="d">Four authentication methods lead to a WordPress user. Basic authentication over HTTPS sends the consumer key as user name and the consumer secret as password. OAuth 1.0a one-legged over plain HTTP sends signed oauth parameters. Both look the key up in the woocommerce_api_keys table, which gives a user and a read, write or read_write permission. An application password over HTTPS and a logged-in cookie with an X-WP-Nonce header are resolved by WordPress core instead. Once the current user is set, the controller checks the capabilities of that user and answers 403 if they are missing. Three notes at the bottom say that keys only authenticate routes in the wc/ and wc- namespaces, that the wc-auth endpoint creates keys for an app, and that WP-CLI skips HTTP and uses the user flag.</desc>
  <rect x="0" y="0" width="980" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Four ways to prove who calls /wp-json/wc/v3</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="52" width="290" height="84" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="74" font-weight="bold" font-size="14">Basic over HTTPS</text>
    <text x="32" y="94">consumer key = user name, secret = password</text>
    <text x="32" y="112">or consumer_key and consumer_secret</text>
    <text x="32" y="128">as query arguments (proxy fallback)</text>

    <rect x="20" y="148" width="290" height="84" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="170" font-weight="bold" font-size="14">OAuth 1.0a one-legged over HTTP</text>
    <text x="32" y="190">oauth_consumer_key, timestamp, nonce,</text>
    <text x="32" y="206">signature_method and oauth_signature</text>
    <text x="32" y="222">HMAC-SHA1 or HMAC-SHA256</text>

    <rect x="20" y="244" width="290" height="84" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="32" y="266" font-weight="bold" font-size="14">Application Password (WordPress)</text>
    <text x="32" y="286">user name plus a 24-character password,</text>
    <text x="32" y="302">sent as Basic auth over HTTPS</text>
    <text x="32" y="318">acts as that user, no key row involved</text>

    <rect x="20" y="340" width="290" height="84" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="32" y="362" font-weight="bold" font-size="14">Cookie + X-WP-Nonce header</text>
    <text x="32" y="382">logged-in browser session, for example</text>
    <text x="32" y="398">the React pages inside wp-admin</text>
    <text x="32" y="414">no header: request is anonymous (401)</text>

    <rect x="370" y="52" width="250" height="180" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="382" y="76" font-weight="bold" font-size="14">WC_REST_Authentication</text>
    <text x="382" y="98">is_ssl() ? Basic : OAuth</text>
    <text x="382" y="120">hash_hmac(sha256, key, 'wc-api')</text>
    <text x="382" y="138">looks up the row in</text>
    <text x="382" y="156" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_api_keys</text>
    <text x="382" y="178">row = user_id + permissions</text>
    <text x="382" y="196">read | write | read_write</text>
    <text x="382" y="216">GET, HEAD need read; the rest write</text>

    <rect x="370" y="244" width="250" height="180" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="382" y="268" font-weight="bold" font-size="14">WordPress core</text>
    <text x="382" y="290">determine_current_user</text>
    <text x="382" y="312">validates the application password</text>
    <text x="382" y="330">or the cookie and its REST nonce</text>
    <text x="382" y="352">and sets the current user</text>

    <rect x="680" y="130" width="280" height="190" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="692" y="154" font-weight="bold" font-size="14">Controller permission check</text>
    <text x="692" y="178">current_user_can() through</text>
    <text x="692" y="196" font-family="Menlo, Consolas, monospace" font-size="11">wc_rest_check_post_permissions()</text>
    <text x="692" y="220">key role too weak: 403</text>
    <text x="692" y="238" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_rest_cannot_view</text>
    <text x="692" y="262">key permission too weak: 401</text>
    <text x="692" y="280" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_rest_authentication_error</text>
    <text x="692" y="304">otherwise the handler runs</text>

    <rect x="20" y="448" width="300" height="92" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="32" y="472" font-weight="bold">Scope of a key</text>
    <text x="32" y="492">a key authenticates routes in the wc/ and wc-</text>
    <text x="32" y="508">namespaces only; wp/v2 and other namespaces</text>
    <text x="32" y="524">are not authenticated by it (hardened 11.1.0)</text>

    <rect x="340" y="448" width="300" height="92" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="352" y="472" font-weight="bold">Where keys come from</text>
    <text x="352" y="492">WooCommerce &gt; Settings &gt; Advanced &gt; REST API,</text>
    <text x="352" y="508">or /wc-auth/v1/authorize, which creates</text>
    <text x="352" y="524">the pair for an app after the merchant agrees</text>

    <rect x="660" y="448" width="300" height="92" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="672" y="472" font-weight="bold">WP-CLI (wp wc ...)</text>
    <text x="672" y="492">runs the same controllers in the process,</text>
    <text x="672" y="508">no HTTP and no key: the --user flag</text>
    <text x="672" y="524">decides who the command acts as</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M310 94 H 340 V 110 H 368"/>
    <path d="M310 190 H 340 V 170 H 368"/>
    <path d="M310 286 H 368"/>
    <path d="M310 382 H 340 V 340 H 368"/>
    <path d="M620 140 H 650 V 170 H 678"/>
    <path d="M620 334 H 650 V 270 H 678"/>
  </g>
</svg>
