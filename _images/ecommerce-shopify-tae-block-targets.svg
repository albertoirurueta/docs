<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Where theme app extension blocks land in a storefront page</title>
  <desc>A page skeleton shows that the compliance_head and head app embed blocks are injected into the document head, content app blocks sit inside theme sections, and body app embed blocks are injected before the closing body tag. The extension folder on the left lists the Pocket Coffee blocks and their targets.</desc>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">One extension, four injection points</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">The target value in each block schema decides where Shopify renders the block and how a merchant switches it on</text>

  <!-- Extension folder -->
  <rect x="20" y="70" width="300" height="400" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <rect x="20" y="70" width="300" height="34" rx="8" fill="#2f6db5"/>
  <text x="170" y="93" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">extensions/pocket-coffee-theme</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#1f2933">
    <text x="36" y="132">blocks/</text>
    <text x="52" y="154">consent_defaults.liquid</text>
    <text x="68" y="172" font-size="11">"target": "compliance_head"</text>
    <text x="52" y="198">club_widget.liquid</text>
    <text x="68" y="216" font-size="11">"target": "body"</text>
    <text x="52" y="242">roast_date_badge.liquid</text>
    <text x="68" y="260" font-size="11">"target": "content"</text>
    <text x="36" y="292">assets/</text>
    <text x="52" y="314">club-widget.js  club-widget.css</text>
    <text x="52" y="332">roast-badge.css</text>
    <text x="36" y="362">snippets/   (render only, no include)</text>
    <text x="36" y="392">locales/</text>
    <text x="52" y="414">en.default.json  es.json</text>
    <text x="52" y="432">en.default.schema.json</text>
    <text x="36" y="458">shopify.extension.toml  type = "theme"</text>
  </g>

  <!-- Page skeleton -->
  <rect x="350" y="70" width="590" height="400" rx="8" fill="none" stroke="#7b8794" stroke-width="1.5"/>
  <text x="365" y="92" font-size="12" font-weight="bold" fill="#7b8794">Rendered storefront page</text>

  <rect x="365" y="102" width="560" height="104" rx="6" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.2"/>
  <text x="378" y="122" font-family="Courier New, monospace" font-size="12" fill="#1f2933">&lt;head&gt;</text>
  <rect x="392" y="130" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#b4690e"/>
  <text x="404" y="150" font-size="12" fill="#1f2933"><tspan font-weight="bold">compliance_head</tspan>  first in the head; only for consent banners and consent defaults</text>
  <rect x="392" y="166" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#b4690e"/>
  <text x="404" y="186" font-size="12" fill="#1f2933"><tspan font-weight="bold">head</tspan>  meta tags, analytics snippets, structured data</text>

  <rect x="365" y="214" width="560" height="140" rx="6" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <text x="378" y="234" font-family="Courier New, monospace" font-size="12" fill="#1f2933">&lt;body&gt;  theme section with blocks of type @app</text>
  <rect x="392" y="244" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#1f8a5b"/>
  <text x="404" y="264" font-size="12" fill="#1f2933">theme block (text, price, buy buttons ...)</text>
  <rect x="392" y="280" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#1f8a5b"/>
  <text x="404" y="300" font-size="12" fill="#1f2933"><tspan font-weight="bold">content</tspan>  app block: Roast date badge (placed by the merchant, can be moved)</text>
  <rect x="392" y="316" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#1f8a5b"/>
  <text x="404" y="336" font-size="12" fill="#1f2933">theme block (description, share ...)</text>

  <rect x="365" y="362" width="560" height="96" rx="6" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.2"/>
  <rect x="392" y="372" width="520" height="30" rx="4" fill="#ffffff" fill-opacity="0.65" stroke="#b4690e"/>
  <text x="404" y="392" font-size="12" fill="#1f2933"><tspan font-weight="bold">body</tspan>  app embed: Coffee Club widget (floating, no UI slot)</text>
  <text x="378" y="436" font-family="Courier New, monospace" font-size="12" fill="#1f2933">&lt;/body&gt;</text>
  <text x="378" y="452" font-size="11" fill="#1f2933">schema javascript / stylesheet files are added to the head once per page</text>

  <!-- Footer strip -->
  <rect x="20" y="484" width="920" height="60" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g font-size="12.5" fill="#7b8794" text-anchor="middle">
    <text x="480" y="506">App blocks: added by the merchant from Apps in the theme editor; need a JSON template and a section that accepts @app</text>
    <text x="480" y="525">App embeds: off after install until activated under Theme settings, App embeds; work on vintage themes too; Global Liquid scope only</text>
  </g>
</svg>
