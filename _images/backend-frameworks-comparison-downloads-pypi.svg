<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" width="800" height="414" role="img" aria-labelledby="backend-downloads-pypi-t backend-downloads-pypi-d">
<title id="backend-downloads-pypi-t">PyPI downloads in the last 30 days</title>
<desc id="backend-downloads-pypi-d">PyPI downloads in the last 30 days. pypistats recent endpoint; PyPI history beyond 180 days is not available without BigQuery</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="414" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">PyPI downloads in the last 30 days</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Downloads in the last 30 days (millions, PyPI only)</text></g></g><line class="grid" x1="183" y1="78" x2="183" y2="312"/><text class="muted" x="183" y="330" text-anchor="middle">0</text><line class="grid" x1="323.25" y1="78" x2="323.25" y2="312"/><text class="muted" x="323.25" y="330" text-anchor="middle">100</text><line class="grid" x1="463.5" y1="78" x2="463.5" y2="312"/><text class="muted" x="463.5" y="330" text-anchor="middle">200</text><line class="grid" x1="603.75" y1="78" x2="603.75" y2="312"/><text class="muted" x="603.75" y="330" text-anchor="middle">300</text><line class="grid" x1="744" y1="78" x2="744" y2="312"/><text class="muted" x="744" y="330" text-anchor="middle">400</text><path class="axis" d="M183 78V312H744"/><text x="175" y="95" text-anchor="end">FastAPI</text><rect class="f0" x="183" y="82" width="535.16" height="18"/><text class="muted" x="723.16" y="95">381.6M</text><text x="175" y="121" text-anchor="end">Flask</text><rect class="f0" x="183" y="108" width="191.41" height="18"/><text class="muted" x="379.41" y="121">136.5M</text><text x="175" y="147" text-anchor="end">Tornado</text><rect class="f0" x="183" y="134" width="136.96" height="18"/><text class="muted" x="324.96" y="147">97.7M</text><text x="175" y="173" text-anchor="end">Django</text><rect class="f0" x="183" y="160" width="57.7" height="18"/><text class="muted" x="245.7" y="173">41.1M</text><text x="175" y="199" text-anchor="end">Django REST framework</text><rect class="f0" x="183" y="186" width="33.73" height="18"/><text class="muted" x="221.73" y="199">24.1M</text><text x="175" y="225" text-anchor="end">Django Ninja</text><rect class="f0" x="183" y="212" width="5.15" height="18"/><text class="muted" x="193.15" y="225">3.7M</text><text x="175" y="251" text-anchor="end">Pyramid</text><rect class="f0" x="183" y="238" width="2.83" height="18"/><text class="muted" x="190.83" y="251">2M</text><text x="175" y="277" text-anchor="end">Litestar</text><rect class="f0" x="183" y="264" width="2.39" height="18"/><text class="muted" x="190.39" y="277">1.7M</text><text x="175" y="303" text-anchor="end">Sanic</text><rect class="f0" x="183" y="290" width="1.54" height="18"/><text class="muted" x="189.54" y="303">1.1M</text><text class="axis-label" x="463.5" y="352" text-anchor="middle">Downloads in the last 30 days (millions, PyPI only)</text><text class="axis-label" transform="translate(16 195) rotate(-90)" text-anchor="middle">Framework (package)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="378" text-anchor="start"><tspan x="24" dy="0">Sources: pypistats (see the Bibliography). Data as of 2026-10-27. pypistats recent endpoint; PyPI history beyond 180 days is not</tspan><tspan x="24" dy="15">available without BigQuery.</tspan></text>
</svg>
