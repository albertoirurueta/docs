<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The 60 fps Frame Budget: JS Thread vs. UI/Native Thread</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Every frame gives the two threads about 16.67 ms total; either one running long past its share drops the frame</text>

  <defs>
    <marker id="fb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a33333"/>
    </marker>
  </defs>

  <!-- budget threshold line -->
  <line x1="630" y1="62" x2="630" y2="224" stroke="#666666" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="630" y="56" font-size="10.5" font-weight="bold" fill="#444444" text-anchor="middle">~16.67 ms budget (60 fps)</text>

  <!-- Row 1: on-budget frame -->
  <text x="100" y="78" font-size="12.5" font-weight="bold" fill="#222222">Frame N -- on budget</text>
  <rect x="100" y="86" width="220" height="44" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <rect x="320" y="86" width="310" height="44" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="210" y="104" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">JS thread</text>
  <text x="210" y="119" font-size="9.5" fill="#333333" text-anchor="middle">render / re-render</text>
  <text x="475" y="104" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">UI / native thread</text>
  <text x="475" y="119" font-size="9.5" fill="#333333" text-anchor="middle">layout + paint</text>
  <text x="630" y="146" font-size="10.5" fill="#2d6a34" text-anchor="middle">frame presented on time</text>

  <!-- Row 2: dropped frame -->
  <text x="100" y="172" font-size="12.5" font-weight="bold" fill="#222222">Frame N+1 -- JS thread runs long</text>
  <rect x="100" y="180" width="380" height="44" rx="4" fill="#fbecec" stroke="#a33333" stroke-width="1.8"/>
  <rect x="480" y="180" width="250" height="44" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="290" y="198" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">JS thread</text>
  <text x="290" y="213" font-size="9.5" fill="#333333" text-anchor="middle">still busy past budget</text>
  <text x="605" y="198" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">UI / native thread</text>
  <text x="605" y="213" font-size="9.5" fill="#333333" text-anchor="middle">waiting, then paints late</text>

  <line x1="630" y1="238" x2="730" y2="238" stroke="#a33333" stroke-width="1.4" marker-start="url(#fb-arrow)" marker-end="url(#fb-arrow)"/>
  <text x="680" y="230" font-size="10" font-weight="bold" fill="#a33333" text-anchor="middle">overrun</text>
  <text x="630" y="260" font-size="10.5" font-weight="bold" fill="#a33333" text-anchor="middle">frame missed -- dropped/janky frame</text>

  <text x="380" y="292" font-size="10" fill="#666666" text-anchor="middle">The same overrun happens if the UI/native thread runs long instead -- e.g. an expensive layout or paint pass.</text>
  <text x="380" y="308" font-size="10" fill="#666666" text-anchor="middle">Some devices run their display at 120 Hz, halving the budget to about 8.3 ms per frame.</text>
</svg>
