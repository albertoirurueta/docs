<svg viewBox="0 0 900 420" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Video on Demand on AWS: S3, Step Functions, MediaConvert, CloudFront</text>

  <rect x="20" y="150" width="120" height="70" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="80" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">S3 uploads</text>
  <text x="80" y="196" text-anchor="middle" font-size="11" fill="#2b7a2b">bookshelf-uploads</text>
  <text x="80" y="210" text-anchor="middle" font-size="11" fill="#2b7a2b">uploads/42/original</text>

  <rect x="190" y="150" width="120" height="70" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="250" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">EventBridge</text>
  <text x="250" y="196" text-anchor="middle" font-size="11" fill="#4a1d75">Object Created rule</text>
  <text x="250" y="210" text-anchor="middle" font-size="11" fill="#4a1d75">starts the workflow</text>

  <rect x="360" y="60" width="300" height="250" rx="10" fill="#fff8ec" stroke="#b36b00" stroke-width="1.6"/>
  <text x="510" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Step Functions state machine</text>
  <rect x="380" y="96" width="260" height="38" rx="6" fill="#fde8c8" stroke="#b36b00"/>
  <text x="510" y="119" text-anchor="middle" font-size="12" fill="#333">1. Validate (ffprobe Lambda), QUEUED</text>
  <rect x="380" y="146" width="260" height="38" rx="6" fill="#e1f0ff" stroke="#1f5fa6"/>
  <text x="510" y="169" text-anchor="middle" font-size="12" fill="#333">2. MediaConvert createJob.sync</text>
  <rect x="380" y="196" width="260" height="38" rx="6" fill="#fde8c8" stroke="#b36b00"/>
  <text x="510" y="219" text-anchor="middle" font-size="12" fill="#333">3. BlurHash Lambda on the cover frame</text>
  <rect x="380" y="246" width="260" height="38" rx="6" fill="#fde8c8" stroke="#b36b00"/>
  <text x="510" y="269" text-anchor="middle" font-size="12" fill="#333">4. Write status READY (or FAILED) to the table</text>

  <rect x="720" y="95" width="160" height="70" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="800" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">S3 media</text>
  <text x="800" y="141" text-anchor="middle" font-size="11" fill="#2b7a2b">HLS, covers, JSON</text>

  <rect x="720" y="205" width="160" height="70" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="800" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">CloudFront</text>
  <text x="800" y="251" text-anchor="middle" font-size="11" fill="#1f5fa6">signed cookies</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr3)">
    <path d="M140,185 L188,185"/><path d="M310,185 L358,185"/>
    <path d="M660,165 L718,130"/><path d="M800,166 L800,203"/>
  </g>
  <text x="686" y="152" font-size="10" fill="#333">writes</text>
  <text x="808" y="190" font-size="10" fill="#333">origin</text>

  <rect x="190" y="340" width="470" height="48" rx="8" fill="#f2f2f2" stroke="#999"/>
  <text x="425" y="360" text-anchor="middle" font-size="12" fill="#333">Failures: Catch states write FAILED with the reason, and a dead-letter queue or an SNS topic alerts the team.</text>
  <text x="425" y="378" text-anchor="middle" font-size="12" fill="#333">MediaConvert job events also reach EventBridge, for dashboards and for workflows without .sync.</text>
  <path d="M510,312 L510,338" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr3)"/>
</svg>
