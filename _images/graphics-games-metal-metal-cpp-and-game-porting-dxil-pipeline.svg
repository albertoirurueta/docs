<text x="155.0" y="198.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">compiler, offline binary generator, textures</text>
<text x="380" y="252" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">At runtime the app loads the metallib with MTLDevice and binds resources the way the root signature describes.</text>
<text x="380" y="270" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The converter also ships as a library, so a game can convert shaders in its own build step.</text>
<rect x="160" y="285" width="440" height="30" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="303.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">SM 6.0 to 6.6 features are covered, including ray tracing and mesh shaders</text>
