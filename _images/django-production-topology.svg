<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>

  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A production topology for the Bookshelf Django project</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">TLS ends at the proxy; Django trusts X-Forwarded-Proto only because the proxy always sets it</text>

  <!-- Clients -->
  <rect x="20" y="215" width="100" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="70" y="243" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="70" y="261" font-size="11" fill="#444444" text-anchor="middle">browsers,</text>
  <text x="70" y="275" font-size="11" fill="#444444" text-anchor="middle">API clients</text>

  <!-- CDN (optional) -->
  <rect x="170" y="70" width="170" height="74" fill="#ffffff" stroke="#5b3f8c" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="255" y="92" font-size="13" font-weight="bold" fill="#5b3f8c" text-anchor="middle">CDN (optional)</text>
  <text x="255" y="110" font-size="11" fill="#444444" text-anchor="middle">hashed /static/ files</text>
  <text x="255" y="125" font-size="11" fill="#444444" text-anchor="middle">cached for a year</text>
  <text x="255" y="138" font-size="10" fill="#666666" text-anchor="middle">origin: proxy or bucket</text>

  <!-- Reverse proxy -->
  <rect x="170" y="180" width="170" height="160" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="255" y="204" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Reverse proxy</text>
  <text x="255" y="221" font-size="11" fill="#444444" text-anchor="middle">NGINX (or a cloud load balancer)</text>
  <text x="255" y="241" font-size="11" fill="#444444" text-anchor="middle">TLS, HTTP to HTTPS redirect</text>
  <text x="255" y="257" font-size="11" fill="#444444" text-anchor="middle">unknown Host: 444</text>
  <text x="255" y="273" font-size="11" fill="#444444" text-anchor="middle">serves /static/ and /media/</text>
  <text x="255" y="289" font-size="11" fill="#444444" text-anchor="middle">buffers slow clients</text>
  <text x="255" y="305" font-size="11" fill="#444444" text-anchor="middle">sets X-Forwarded-Proto</text>
  <text x="255" y="328" font-size="10" fill="#666666" text-anchor="middle">only component on port 443</text>

  <!-- App server -->
  <rect x="400" y="120" width="250" height="250" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="525" y="142" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Application server</text>
  <text x="525" y="158" font-size="10" fill="#666666" text-anchor="middle">one per VM or container, replicated</text>

  <rect x="418" y="170" width="214" height="52" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="525" y="190" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">WSGI: Gunicorn, Granian</text>
  <text x="525" y="208" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">config.wsgi:application</text>

  <text x="525" y="238" font-size="11" fill="#666666" text-anchor="middle">or</text>

  <rect x="418" y="248" width="214" height="52" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="525" y="268" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ASGI: Uvicorn, Daphne, Hypercorn</text>
  <text x="525" y="286" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">config.asgi:application</text>

  <text x="525" y="322" font-size="11" fill="#444444" text-anchor="middle">Django checks ALLOWED_HOSTS,</text>
  <text x="525" y="338" font-size="11" fill="#444444" text-anchor="middle">reads SECURE_PROXY_SSL_HEADER,</text>
  <text x="525" y="354" font-size="11" fill="#444444" text-anchor="middle">settings from the environment</text>

  <!-- Backing services -->
  <rect x="710" y="110" width="130" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="775" y="134" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">PostgreSQL</text>
  <text x="775" y="152" font-size="10" fill="#666666" text-anchor="middle">DATABASES, backups,</text>
  <text x="775" y="166" font-size="10" fill="#666666" text-anchor="middle">app servers only</text>

  <rect x="710" y="210" width="130" height="60" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="775" y="234" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Cache</text>
  <text x="775" y="252" font-size="10" fill="#666666" text-anchor="middle">Redis or Memcached</text>
  <text x="775" y="265" font-size="10" fill="#666666" text-anchor="middle">CACHES, sessions</text>

  <rect x="710" y="300" width="130" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="775" y="324" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Object storage</text>
  <text x="775" y="342" font-size="10" fill="#666666" text-anchor="middle">user uploads (media)</text>
  <text x="775" y="356" font-size="10" fill="#666666" text-anchor="middle">STORAGES["default"]</text>

  <!-- Arrows: clients -> proxy -->
  <line x1="120" y1="250" x2="164" y2="250" stroke="#444444" stroke-width="1.6"/>
  <polygon points="170,250 162,245 162,255" fill="#444444"/>
  <text x="145" y="241" font-size="10" fill="#666666" text-anchor="middle">HTTPS</text>

  <!-- clients -> CDN -->
  <line x1="95" y1="215" x2="166" y2="116" stroke="#5b3f8c" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="170,110 161,114 168,120" fill="#5b3f8c"/>
  <text x="108" y="160" font-size="10" fill="#666666" text-anchor="middle">/static/</text>

  <!-- proxy -> app -->
  <line x1="340" y1="250" x2="394" y2="250" stroke="#444444" stroke-width="1.6"/>
  <polygon points="400,250 392,245 392,255" fill="#444444"/>
  <text x="370" y="241" font-size="10" fill="#666666" text-anchor="middle">HTTP or</text>
  <text x="370" y="270" font-size="10" fill="#666666" text-anchor="middle">socket</text>

  <!-- app -> services -->
  <line x1="650" y1="170" x2="704" y2="148" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="710,145 700,144 704,153" fill="#2f5424"/>
  <line x1="650" y1="240" x2="704" y2="240" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="710,240 702,235 702,245" fill="#2f5424"/>
  <line x1="650" y1="310" x2="704" y2="330" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="710,333 701,326 699,336" fill="#2f5424"/>

  <!-- Release step -->
  <rect x="400" y="408" width="250" height="62" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="525" y="428" font-size="12" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Release step, once per deploy</text>
  <text x="525" y="445" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">check --deploy, collectstatic</text>
  <text x="525" y="460" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">migrate --noinput</text>
  <path d="M650,439 L852,439 L852,145 L846,145" fill="none" stroke="#8a1f1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="840,145 848,140 848,150" fill="#8a1f1f"/>
  <path d="M400,439 L255,439 L255,346" fill="none" stroke="#8a1f1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="255,340 250,350 260,350" fill="#8a1f1f"/>
  <text x="320" y="432" font-size="10" fill="#666666" text-anchor="middle">static files</text>
  <text x="750" y="456" font-size="10" fill="#666666" text-anchor="middle">migrate before new code serves</text>
</svg>
