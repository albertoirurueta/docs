<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf application with Vapor</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">one Vapor service, the stores it uses, and the systems around it -- the running example of this section</text>

  <!-- clients -->
  <g font-size="12">
    <rect x="20" y="70" width="170" height="44" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.3"/>
    <text x="105" y="90" text-anchor="middle" font-weight="bold" fill="#6a3d9a">iOS / macOS app</text>
    <text x="105" y="106" text-anchor="middle" fill="#222222">shares Codable models</text>
    <rect x="20" y="126" width="170" height="44" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.3"/>
    <text x="105" y="146" text-anchor="middle" font-weight="bold" fill="#6a3d9a">Browser</text>
    <text x="105" y="162" text-anchor="middle" fill="#222222">Leaf pages, JavaScript SPA</text>
    <rect x="20" y="182" width="170" height="44" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.3"/>
    <text x="105" y="202" text-anchor="middle" font-weight="bold" fill="#6a3d9a">API clients</text>
    <text x="105" y="218" text-anchor="middle" fill="#222222">JSON, WebSocket</text>
  </g>

  <!-- proxy -->
  <rect x="230" y="104" width="130" height="56" rx="6" fill="#f5f5f5" stroke="#777777" stroke-width="1.3"/>
  <text x="295" y="127" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Reverse proxy</text>
  <text x="295" y="144" font-size="11" fill="#444444" text-anchor="middle">TLS, load balancing</text>

  <!-- the service -->
  <rect x="385" y="66" width="340" height="330" rx="10" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.8"/>
  <text x="555" y="90" font-size="14" font-weight="bold" fill="#b7410e" text-anchor="middle">Bookshelf service (Vapor 4.122)</text>
  <g font-size="12">
    <rect x="397" y="102" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="122" text-anchor="middle" font-weight="bold" fill="#222222">SwiftNIO HTTP server</text>
    <text x="555" y="140" text-anchor="middle" font-size="11" fill="#444444">event loops, HTTP/1.1 and HTTP/2, TLS, compression</text>
    <rect x="397" y="164" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="184" text-anchor="middle" font-weight="bold" fill="#222222">Middleware and router</text>
    <text x="555" y="202" text-anchor="middle" font-size="11" fill="#444444">errors, CORS, sessions, auth, /api/v1, pages, fallback</text>
    <rect x="397" y="226" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="246" text-anchor="middle" font-weight="bold" fill="#222222">Controllers and handlers</text>
    <text x="555" y="264" text-anchor="middle" font-size="11" fill="#444444">Content DTOs, validation, Abort errors, Leaf views</text>
    <rect x="397" y="288" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="308" text-anchor="middle" font-weight="bold" fill="#222222">Fluent models and services</text>
    <text x="555" y="326" text-anchor="middle" font-size="11" fill="#444444">catalogue, loans, reviews -- Book, Author, Loan</text>
    <text x="555" y="368" text-anchor="middle" fill="#666666">Application: services, logger, Environment, lifecycle</text>
    <text x="555" y="384" text-anchor="middle" fill="#666666">commands: serve, migrate, queues</text>
  </g>
  <g stroke="#b7410e" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="555" y1="154" x2="555" y2="162"/>
    <line x1="555" y1="216" x2="555" y2="224"/>
    <line x1="555" y1="278" x2="555" y2="286"/>
  </g>

  <!-- stores and dependencies -->
  <g font-size="12">
    <rect x="765" y="70" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="91" text-anchor="middle" font-weight="bold" fill="#1c4b73">PostgreSQL</text>
    <text x="852" y="108" text-anchor="middle" fill="#222222">Fluent: books, loans, users</text>
    <rect x="765" y="134" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="155" text-anchor="middle" font-weight="bold" fill="#1c4b73">Redis</text>
    <text x="852" y="172" text-anchor="middle" fill="#222222">sessions, cache, queues</text>
    <rect x="765" y="198" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="219" text-anchor="middle" font-weight="bold" fill="#1c4b73">S3 object storage</text>
    <text x="852" y="236" text-anchor="middle" fill="#222222">book covers, uploads</text>
    <rect x="765" y="262" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="283" text-anchor="middle" font-weight="bold" fill="#1c4b73">APNs</text>
    <text x="852" y="300" text-anchor="middle" fill="#222222">push: due-date reminders</text>
    <rect x="765" y="326" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="347" text-anchor="middle" font-weight="bold" fill="#1c4b73">Email provider</text>
    <text x="852" y="364" text-anchor="middle" fill="#222222">SMTP or HTTP API</text>
  </g>
  <g stroke="#444444" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="92" x2="228" y2="122"/>
    <line x1="190" y1="148" x2="228" y2="132"/>
    <line x1="190" y1="204" x2="228" y2="142"/>
    <line x1="360" y1="132" x2="383" y2="130"/>
    <line x1="725" y1="300" x2="763" y2="95"/>
    <line x1="725" y1="306" x2="763" y2="159"/>
    <line x1="725" y1="312" x2="763" y2="223"/>
    <line x1="725" y1="318" x2="763" y2="287"/>
    <line x1="725" y1="324" x2="763" y2="351"/>
  </g>

  <!-- workers -->
  <rect x="385" y="430" width="340" height="56" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.4"/>
  <text x="555" y="453" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">Queues worker (same codebase, queues command)</text>
  <text x="555" y="470" font-size="11" fill="#444444" text-anchor="middle">emails, push notifications, scheduled overdue checks</text>
  <g stroke="#444444" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="555" y1="430" x2="555" y2="398" stroke-dasharray="4 3"/>
    <line x1="725" y1="458" x2="852" y2="186" stroke-dasharray="4 3"/>
  </g>
  <text x="480" y="525" font-size="11" fill="#666666" text-anchor="middle">solid arrows: synchronous request path; dashed: asynchronous work through the queue</text>
</svg>
