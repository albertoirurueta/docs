<svg viewBox="0 0 760 290" width="760" height="290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="290" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Mask types on a Bookshelf book cover (schematic)</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
  <rect x="20" y="50" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="50" y="70" width="100" height="110" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="4 3"/>
  <circle cx="100" cy="125" r="45" fill="#6366F1"/>
  <text x="100" y="222" font-size="13" font-weight="bold" fill="#3730A3">Source layers</text><text x="100" y="240">Cover under a circle mask</text>
  <rect x="200" y="50" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="280" cy="125" r="45" fill="#818CF8" fill-opacity="0.5"/><circle cx="280" cy="125" r="45" fill="none" stroke="#4F46E5"/>
  <text x="280" y="222" font-size="13" font-weight="bold" fill="#3730A3">Alpha (default)</text><text x="280" y="240">Mask opacity decides</text><text x="280" y="256">how much shows</text>
  <rect x="380" y="50" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="460" cy="125" r="45" fill="#6366F1"/>
  <text x="460" y="222" font-size="13" font-weight="bold" fill="#3730A3">Vector</text><text x="460" y="240">Outline only; fill and stroke</text><text x="460" y="256">opacity are ignored</text>
  <rect x="560" y="50" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="640" cy="125" r="45" fill="#9CA3AF"/><circle cx="640" cy="125" r="22" fill="#1F2937"/>
  <text x="640" y="222" font-size="13" font-weight="bold" fill="#3730A3">Luminance</text><text x="640" y="240">Brighter reveals more;</text><text x="640" y="256">black reveals nothing</text>
  </g>
</svg>
