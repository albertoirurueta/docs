<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Coffee Club membership lifecycle in the custom plugin</title>
  <desc id="d">An order that contains the Coffee Club annual pass reaches processing or completed. The plugin loads the order with wc_get_order, adds the coffee_club role, stores the expiry date in user meta and schedules one Action Scheduler action for that date. Members see the content, may buy club-only products and get a member price. On the expiry date the action removes the role and the meta, unless a renewal extended the membership.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="30" y="30" width="250" height="80" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="56.0" text-anchor="middle" font-weight="bold">Order paid</text>
  <text x="155.0" y="74.0" text-anchor="middle">status processing or completed</text>
  <text x="155.0" y="92.0" text-anchor="middle">item has _pc_grants_club_days</text>
  <rect x="325" y="30" width="250" height="80" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="56.0" text-anchor="middle" font-weight="bold">Grant (idempotent)</text>
  <text x="450.0" y="74.0" text-anchor="middle">wc_get_order(), role coffee_club,</text>
  <text x="450.0" y="92.0" text-anchor="middle">_coffee_club_until, order meta</text>
  <rect x="620" y="30" width="250" height="80" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="56.0" text-anchor="middle" font-weight="bold">Action Scheduler</text>
  <text x="745.0" y="74.0" text-anchor="middle">one pending action per user,</text>
  <text x="745.0" y="92.0" text-anchor="middle">replaced on renewal</text>
  <line x1="280" y1="70" x2="325" y2="70" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="70" x2="620" y2="70" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="170" width="250" height="80" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="205.0" text-anchor="middle" font-weight="bold">Members-only content</text>
  <text x="155.0" y="223.0" text-anchor="middle">[coffee_club_only] shortcode</text>
  <rect x="325" y="170" width="250" height="80" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="196.0" text-anchor="middle" font-weight="bold">Members-only store</text>
  <text x="450.0" y="214.0" text-anchor="middle">category club-only,</text>
  <text x="450.0" y="232.0" text-anchor="middle">woocommerce_is_purchasable</text>
  <rect x="620" y="170" width="250" height="80" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="196.0" text-anchor="middle" font-weight="bold">Member price</text>
  <text x="745.0" y="214.0" text-anchor="middle">woocommerce_product_get_price,</text>
  <text x="745.0" y="232.0" text-anchor="middle">10% off simple products</text>
  <line x1="450" y1="110" x2="155" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="110" x2="450" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="110" x2="745" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="150" y="310" width="600" height="80" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="336.0" text-anchor="middle" font-weight="bold">Expiry date reached</text>
  <text x="450.0" y="354.0" text-anchor="middle">pocket_coffee_club_expire( user_id ): if not extended, remove role and delete _coffee_club_until</text>
  <text x="450.0" y="372.0" text-anchor="middle">access checks now fail: guests and ex-members see the members-only notice</text>
  <line x1="450" y1="250" x2="450" y2="310" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="155" y1="250" x2="300" y2="310" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="745" y1="250" x2="600" y2="310" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="870,70 890,70 890,350 750,350" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="845" y="375" text-anchor="middle" font-size="12">runs on the expiry date</text>
</svg>
