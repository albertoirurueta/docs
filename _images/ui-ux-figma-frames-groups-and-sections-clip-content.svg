<svg viewBox="0 0 740 300" width="740" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="740" height="300" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip content on and off</text>
  <rect x="40" y="60" width="140" height="150" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="60" y="80" width="150" height="46" rx="4" fill="#C7D2FE" stroke="#4F46E5"/>
  <text x="70" y="108" font-size="11" fill="#3730A3">Cover image (wider)</text>
  <rect x="60" y="150" width="100" height="40" rx="4" fill="#E5E7EB"/>
  <text x="110" y="232" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Clip content off</text>
  <text x="110" y="250" font-size="12" fill="#374151" text-anchor="middle">overflow stays visible</text>
  <path d="M230 135 L300 135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="265" y="125" font-size="11" fill="#374151" text-anchor="middle">tick Clip content</text>
  <rect x="330" y="60" width="140" height="150" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <path d="M338 80 L470 80 L470 126 L338 126 z" fill="#C7D2FE"/>
  <rect x="350" y="150" width="100" height="40" rx="4" fill="#E5E7EB"/>
  <text x="400" y="232" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Clip content on</text>
  <text x="400" y="250" font-size="12" fill="#374151" text-anchor="middle">overflow hidden at the edge</text>
  <rect x="520" y="60" width="190" height="150" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="535" y="84" font-size="12" font-weight="bold" fill="#374151">Clipping belongs to frames</text>
  <text x="535" y="106" font-size="12" fill="#374151">Clip content is listed as a frame</text>
  <text x="535" y="124" font-size="12" fill="#374151">property, so a card that must</text>
  <text x="535" y="142" font-size="12" fill="#374151">crop its cover image should</text>
  <text x="535" y="160" font-size="12" fill="#374151">be a frame.</text>
  <text x="370" y="284" font-size="11" fill="#6B7280" text-anchor="middle">Schematic; where the Clip content option is shown in the right sidebar can change between releases.</text>
</svg>
