<svg viewBox="0 0 960 570" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Visual Basic family tree: BASIC, Visual Basic 1 to 6, VBA, VBScript and Visual Basic .NET</title>
  <desc id="d">BASIC (1964) leads to Visual Basic 1.0 to 6.0 (1991 to 1998). Visual Basic 6 has three relatives that are alive today: VBA, embedded in Office and other hosts and supported with the host; VBScript, used by Windows Script Host and Classic ASP, deprecated and being removed in phases; and VB6 itself, whose IDE has been out of support since 2008-04-08 while its runtime is supported with Windows. Visual Basic .NET (2002) is a rewrite, not source compatible with VB6, and continues through versions 7.1 to 16.9 to the current stable version 17.13.</desc>
  <rect x="0" y="0" width="960" height="570" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Visual Basic family tree</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">Status as checked on 2026-10-19. Solid arrows: same lineage. Dashed arrow: a new language with the same spirit, not source compatible.</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  </defs>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="20" y="268" width="130" height="78" fill="#eeeeee" stroke="#555555"/>
    <text x="85" y="294" font-weight="bold">BASIC</text>
    <text x="85" y="312" font-size="11">1964, Dartmouth</text>
    <text x="85" y="327" font-size="11">many dialects</text>

    <rect x="190" y="250" width="190" height="114" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="285" y="276" font-weight="bold">Visual Basic 1.0 to 6.0</text>
    <text x="285" y="294" font-size="11">1991 to 1998</text>
    <text x="285" y="312" font-size="11">forms, events, COM,</text>
    <text x="285" y="327" font-size="11">Variant, 16-bit Integer,</text>
    <text x="285" y="342" font-size="11">Type, ByRef by default</text>
  </g>

  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="150" y1="307" x2="188" y2="307"/>
    <path d="M380,290 C400,290 400,95 418,95"/>
    <path d="M380,295 C400,295 400,180 418,180"/>
    <line x1="380" y1="307" x2="418" y2="307"/>
  </g>
  <path d="M380,325 C400,325 400,405 418,405" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>

  <g font-size="13" fill="#222222">
    <rect x="420" y="58" width="210" height="74" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="525" y="82" font-weight="bold" text-anchor="middle">VBA</text>
    <text x="525" y="100" font-size="11" text-anchor="middle">Visual Basic for Applications</text>
    <text x="525" y="115" font-size="11" text-anchor="middle">macros inside a host application</text>
    <rect x="650" y="58" width="290" height="74" fill="#f4f8ec" stroke="#4f7a28"/>
    <text x="662" y="80" font-weight="bold" font-size="12">Status: supported with its host</text>
    <text x="662" y="98" font-size="11">Lives in Office (Excel, Word, Access)</text>
    <text x="662" y="113" font-size="11">and other hosts; documented in the</text>
    <text x="662" y="128" font-size="11">Office VBA language reference</text>

    <rect x="420" y="148" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="525" y="172" font-weight="bold" text-anchor="middle">VBScript</text>
    <text x="525" y="190" font-size="11" text-anchor="middle">untyped, interpreted scripting</text>
    <text x="525" y="205" font-size="11" text-anchor="middle">Windows Script Host, Classic ASP,</text>
    <text x="525" y="220" font-size="11" text-anchor="middle">hosted scripts</text>
    <rect x="650" y="148" width="290" height="82" fill="#fdf1e3" stroke="#a35f0c"/>
    <text x="662" y="170" font-weight="bold" font-size="12">Status: deprecated</text>
    <text x="662" y="188" font-size="11">Removed in phases: optional feature,</text>
    <text x="662" y="203" font-size="11">then off by default, then gone. Use</text>
    <text x="662" y="218" font-size="11">PowerShell or .NET for new scripts</text>

    <rect x="420" y="262" width="210" height="90" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="525" y="286" font-weight="bold" text-anchor="middle">VB6 today</text>
    <text x="525" y="304" font-size="11" text-anchor="middle">executables and ActiveX/COM</text>
    <text x="525" y="319" font-size="11" text-anchor="middle">components still running in the field,</text>
    <text x="525" y="334" font-size="11" text-anchor="middle">no new language features</text>
    <rect x="650" y="262" width="290" height="90" fill="#fdf1e3" stroke="#a35f0c"/>
    <text x="662" y="284" font-weight="bold" font-size="12">Status: IDE unsupported, runtime supported</text>
    <text x="662" y="302" font-size="11">IDE out of support since 2008-04-08.</text>
    <text x="662" y="317" font-size="11">Runtime supported for the lifetime of the</text>
    <text x="662" y="332" font-size="11">Windows version it ships with (serious</text>
    <text x="662" y="347" font-size="11">regressions, critical security fixes)</text>

    <rect x="420" y="372" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="525" y="396" font-weight="bold" text-anchor="middle">Visual Basic .NET (7.0)</text>
    <text x="525" y="414" font-size="11" text-anchor="middle">2002: a new language on the CLR,</text>
    <text x="525" y="429" font-size="11" text-anchor="middle">classes, inheritance, structured</text>
    <text x="525" y="444" font-size="11" text-anchor="middle">exceptions, no Variant</text>
    <rect x="650" y="372" width="290" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="662" y="394" font-weight="bold" font-size="12">VB 7.1 to 16.9 (2003 to 2019)</text>
    <text x="662" y="412" font-size="11">My, LINQ, XML literals, Async, Roslyn,</text>
    <text x="662" y="427" font-size="11">interpolation, tuples, .NET Core support;</text>
    <text x="662" y="442" font-size="11">ASP.NET Web Forms code-behind</text>

    <rect x="650" y="486" width="290" height="62" fill="#f4f8ec" stroke="#4f7a28"/>
    <text x="662" y="506" font-weight="bold" font-size="12">VB 17.0 to 17.13 (2021 to 2025): current</text>
    <text x="662" y="524" font-size="11">Status: supported on .NET 10; stable,</text>
    <text x="662" y="539" font-size="11">consumption-only, no new syntax</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="630" y1="413" x2="648" y2="413"/>
    <line x1="795" y1="454" x2="795" y2="484"/>
  </g>
  <text x="20" y="470" font-size="11" fill="#666666">Reading guide: VBA and VBScript are separate</text>
  <text x="20" y="485" font-size="11" fill="#666666">products with VB6-style syntax; only Visual Basic</text>
  <text x="20" y="500" font-size="11" fill="#666666">.NET shares the compiler, runtime and libraries</text>
  <text x="20" y="515" font-size="11" fill="#666666">of this section.</text>
</svg>
