<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Mapping contexts: the highest priority wins the key</text>
<rect x="20" y="66" width="400" height="76" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="34" y="90" text-anchor="start" font-size="13" fill="#92400E" font-weight="bold">IMC_ReadingMode</text>
<text x="406" y="90" text-anchor="end" font-size="12" fill="#92400E" font-weight="bold">Priority 2</text>
<text x="34" y="118" text-anchor="start" font-size="12" fill="#374151">E: IA_Close</text>
<rect x="20" y="156" width="400" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="34" y="180" text-anchor="start" font-size="13" fill="#3730A3" font-weight="bold">IMC_Bookshelf</text>
<text x="406" y="180" text-anchor="end" font-size="12" fill="#3730A3" font-weight="bold">Priority 1</text>
<text x="34" y="208" text-anchor="start" font-size="12" fill="#374151">E: IA_Grab  |  Left Mouse: IA_Select</text>
<rect x="20" y="246" width="400" height="76" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="34" y="270" text-anchor="start" font-size="13" fill="#374151" font-weight="bold">IMC_Default</text>
<text x="406" y="270" text-anchor="end" font-size="12" fill="#374151" font-weight="bold">Priority 0</text>
<text x="34" y="298" text-anchor="start" font-size="12" fill="#374151">WASD: IA_Move  |  Mouse: IA_Look  |  Space: IA_Jump</text>
<text x="220" y="52" text-anchor="middle" font-size="12" fill="#374151">Added to the local player in this order</text>
<line x1="440" y1="70" x2="440" y2="330" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah)"/>
<text x="450" y="205" text-anchor="start" font-size="11" fill="#3730A3">evaluated</text>
<text x="450" y="220" text-anchor="start" font-size="11" fill="#3730A3">top down</text>
<rect x="535" y="66" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="640" y="88" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Player presses E</text>
<text x="640" y="110" text-anchor="middle" font-size="11" fill="#374151">ReadingMode maps E to IA_Close</text>
<text x="640" y="125" text-anchor="middle" font-size="11" fill="#374151">and IA_Close consumes input,</text>
<text x="640" y="140" text-anchor="middle" font-size="11" fill="#374151">so IA_Grab does not fire.</text>
<rect x="535" y="214" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640" y="236" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">ReadingMode removed</text>
<text x="640" y="258" text-anchor="middle" font-size="11" fill="#374151">E now reaches IMC_Bookshelf</text>
<text x="640" y="273" text-anchor="middle" font-size="11" fill="#374151">and IA_Grab fires again.</text>
<rect x="20" y="336" width="725" height="66" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="382" y="358" text-anchor="middle" font-size="11" fill="#374151">Input Action property bConsumeInput (default on) decides whether a mapped action swallows the key.</text>
<text x="382" y="375" text-anchor="middle" font-size="11" fill="#374151">Turn it off for an action that should let lower-priority contexts see the same key as well.</text>
</svg>
