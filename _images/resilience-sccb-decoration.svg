<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What breaker.run(supplier, fallback) builds around your supplier</text>
  <defs>
    <marker id="sc-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="sc-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- Caller -->
  <rect x="14" y="120" width="104" height="96" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="66" y="148" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Caller</text>
  <text x="66" y="168" font-size="10.5" fill="#444444" text-anchor="middle">PricingService</text>
  <text x="66" y="184" font-size="10.5" fill="#444444" text-anchor="middle">calls run(...)</text>
  <text x="66" y="200" font-size="10.5" fill="#666666" text-anchor="middle">on its own thread</text>

  <!-- CircuitBreaker -->
  <rect x="140" y="60" width="746" height="250" rx="10" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="152" y="80" font-size="12.5" font-weight="bold" fill="#1c4b73">CircuitBreaker  (named by id, "pricing")</text>

  <!-- Bulkhead -->
  <rect x="160" y="92" width="610" height="200" rx="9" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="172" y="112" font-size="12" font-weight="bold" fill="#222222">Bulkhead  (named by group, "pricing-service")</text>
  <text x="540" y="112" font-size="10.5" fill="#666666">thread pool by default, semaphore on request</text>

  <!-- TimeLimiter -->
  <rect x="182" y="124" width="400" height="152" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="194" y="144" font-size="12" font-weight="bold" fill="#222222">TimeLimiter  (id, then group, then 1 s default)</text>
  <text x="194" y="160" font-size="10.5" fill="#666666">Future.get(timeout) on the future of the executor task</text>

  <!-- Executor -->
  <rect x="204" y="174" width="176" height="86" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="292" y="194" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">executorService</text>
  <text x="292" y="211" font-size="10.5" fill="#444444" text-anchor="middle">cached pool, one per group</text>
  <text x="292" y="227" font-size="10.5" fill="#444444" text-anchor="middle">executor.submit(supplier)</text>
  <text x="292" y="246" font-size="10.5" fill="#666666" text-anchor="middle">cancel(true) on timeout</text>

  <rect x="420" y="174" width="140" height="86" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="490" y="208" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">your supplier</text>
  <text x="490" y="226" font-size="10.5" fill="#444444" text-anchor="middle">client.fetch(isbn)</text>
  <text x="490" y="244" font-size="10.5" fill="#666666" text-anchor="middle">runs on a pool thread</text>
  <line x1="380" y1="217" x2="418" y2="217" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sc-in)"/>

  <!-- Inward arrow -->
  <line x1="118" y1="150" x2="180" y2="150" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#sc-in)"/>

  <!-- Fallback box -->
  <rect x="610" y="124" width="150" height="152" rx="8" fill="#ffffff" stroke="#b03030" stroke-width="1.4"/>
  <text x="685" y="148" font-size="12" font-weight="bold" fill="#b03030" text-anchor="middle">where it breaks</text>
  <text x="685" y="170" font-size="10.5" fill="#444444" text-anchor="middle">TimeLimiter rethrows the</text>
  <text x="685" y="185" font-size="10.5" fill="#444444" text-anchor="middle">original cause or a</text>
  <text x="685" y="200" font-size="10.5" fill="#444444" text-anchor="middle">TimeoutException</text>
  <text x="685" y="224" font-size="10.5" fill="#b03030" text-anchor="middle">thread-pool bulkhead calls</text>
  <text x="685" y="239" font-size="10.5" fill="#b03030" text-anchor="middle">CompletableFuture.get():</text>
  <text x="685" y="254" font-size="10.5" fill="#b03030" text-anchor="middle">wraps it in ExecutionException</text>

  <!-- Outward path -->
  <line x1="880" y1="326" x2="880" y2="296" stroke="#b03030" stroke-width="1.8"/>
  <line x1="880" y1="326" x2="66" y2="326" stroke="#b03030" stroke-width="1.8"/>
  <line x1="66" y1="326" x2="66" y2="218" stroke="#b03030" stroke-width="1.8" marker-end="url(#sc-out)"/>
  <text x="474" y="344" font-size="11" fill="#b03030" text-anchor="middle">result or Throwable travels outwards: the CircuitBreaker records it (it unwraps ExecutionException), then the fallback receives it</text>
  <text x="474" y="360" font-size="11" fill="#b03030" text-anchor="middle">fallback.apply(throwable) runs on the caller thread, outside every layer</text>

  <!-- Legend -->
  <rect x="14" y="378" width="872" height="40" rx="6" fill="#f4f4f4" stroke="#999999"/>
  <text x="26" y="395" font-size="10.5" fill="#444444">create("pricing") uses id = group = "pricing". Without resilience4j-bulkhead on the classpath the Bulkhead layer disappears and the fallback sees the TimeLimiter result directly.</text>
  <text x="26" y="411" font-size="10.5" fill="#444444">disable-thread-pool=true drops the executor and the TimeLimiter; the bulkhead, if present, still wraps the supplier.</text>
</svg>
