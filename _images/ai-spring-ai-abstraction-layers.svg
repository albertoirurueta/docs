<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>The Spring AI abstraction layers</title>
  <desc>Five stacked layers. At the top, your application (the DocsAssistant controllers, @Tool beans and MCP server). Below it, the fluent ChatClient with its advisor chain (memory, RAG, tool calling, guardrails, logging). Below that, the portable interfaces: ChatModel, EmbeddingModel, ImageModel, TranscriptionModel, TextToSpeechModel, ModerationModel, VectorStore and ChatMemory. Below that, provider modules wired by Spring Boot starters and spring.ai properties: Ollama, OpenAI and OpenAI-compatible servers, Anthropic, Google GenAI, Mistral, Bedrock, ElevenLabs, Stability AI, pgvector, Redis and JDBC. At the bottom, the model runtimes and stores themselves. A column on the right lists the cross-cutting concerns: observability, resilience, MCP, security and quality.</desc>
  <rect x="0" y="0" width="920" height="700" fill="#f8fafc"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">The Spring AI abstraction layers</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#334155">Spring AI 2.0.1 on Spring Boot 4.1 -- your code depends only on the upper three layers</text>

  <!-- layer 1: application -->
  <rect x="24" y="72" width="660" height="96" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="44" y="96" font-size="15" font-weight="bold" fill="#1e3a8a">Your application</text>
  <text x="44" y="114" font-size="12" fill="#1e3a8a">DocsAssistant, a Spring Boot 4.1 service</text>
  <rect x="44" y="124" width="196" height="32" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="142" y="145" text-anchor="middle" font-size="12" fill="#1e3a8a">REST and SSE controllers</text>
  <rect x="256" y="124" width="196" height="32" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="354" y="145" text-anchor="middle" font-size="12" fill="#1e3a8a">@Tool beans, searchDocs</text>
  <rect x="468" y="124" width="196" height="32" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="566" y="145" text-anchor="middle" font-size="12" fill="#1e3a8a">record types for entity()</text>

  <!-- arrow -->
  <path d="M354 168 L354 186" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M348 180 L354 190 L360 180 Z" fill="#334155"/>

  <!-- layer 2: ChatClient + advisors -->
  <rect x="24" y="192" width="660" height="110" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="44" y="216" font-size="15" font-weight="bold" fill="#4c1d95">ChatClient and the advisor chain</text>
  <text x="44" y="234" font-size="12" fill="#4c1d95">prompt().user(..).call() / stream(); content(), entity(), chatResponse()</text>
  <rect x="44" y="246" width="116" height="42" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="102" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Memory</text>
  <text x="102" y="280" text-anchor="middle" font-size="11" fill="#4c1d95">per conversation</text>
  <rect x="172" y="246" width="116" height="42" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="230" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">RAG</text>
  <text x="230" y="280" text-anchor="middle" font-size="11" fill="#4c1d95">vector-store search</text>
  <rect x="300" y="246" width="116" height="42" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="358" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Tool calling</text>
  <text x="358" y="280" text-anchor="middle" font-size="11" fill="#4c1d95">ToolCallingAdvisor</text>
  <rect x="428" y="246" width="116" height="42" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="486" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Guardrails</text>
  <text x="486" y="280" text-anchor="middle" font-size="11" fill="#4c1d95">SafeGuardAdvisor</text>
  <rect x="556" y="246" width="116" height="42" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="614" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Logging</text>
  <text x="614" y="280" text-anchor="middle" font-size="11" fill="#4c1d95">SimpleLoggerAdvisor</text>

  <path d="M354 302 L354 320" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M348 314 L354 324 L360 314 Z" fill="#334155"/>

  <!-- layer 3: portable interfaces -->
  <rect x="24" y="326" width="660" height="128" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="44" y="350" font-size="15" font-weight="bold" fill="#14532d">Portable interfaces</text>
  <text x="44" y="368" font-size="12" fill="#14532d">the model interfaces extend Model&lt;Request, Response&gt;; swap the provider, keep the code</text>
  <rect x="44" y="380" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="118" y="399" text-anchor="middle" font-size="12" fill="#14532d">ChatModel</text>
  <rect x="204" y="380" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="278" y="399" text-anchor="middle" font-size="12" fill="#14532d">EmbeddingModel</text>
  <rect x="364" y="380" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="438" y="399" text-anchor="middle" font-size="12" fill="#14532d">ImageModel</text>
  <rect x="524" y="380" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="598" y="399" text-anchor="middle" font-size="12" fill="#14532d">ModerationModel</text>
  <rect x="44" y="416" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="118" y="435" text-anchor="middle" font-size="12" fill="#14532d">TranscriptionModel</text>
  <rect x="204" y="416" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="278" y="435" text-anchor="middle" font-size="12" fill="#14532d">TextToSpeechModel</text>
  <rect x="364" y="416" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="438" y="435" text-anchor="middle" font-size="12" fill="#14532d">VectorStore</text>
  <rect x="524" y="416" width="148" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="598" y="435" text-anchor="middle" font-size="12" fill="#14532d">ChatMemory</text>

  <path d="M354 454 L354 472" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M348 466 L354 476 L360 466 Z" fill="#334155"/>

  <!-- layer 4: provider modules -->
  <rect x="24" y="478" width="660" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="44" y="502" font-size="15" font-weight="bold" fill="#78350f">Provider modules and auto-configuration</text>
  <text x="44" y="520" font-size="12" fill="#78350f">spring-ai-starter-model-*, -vector-store-*, -model-chat-memory-repository-*; spring.ai.* properties</text>
  <text x="44" y="544" font-size="12" fill="#78350f">Chat and models: Ollama, OpenAI (and OpenAI-compatible vLLM, llama.cpp, LM Studio),</text>
  <text x="44" y="561" font-size="12" fill="#78350f">Anthropic, Google GenAI, Mistral AI, Bedrock Converse, ElevenLabs, Stability AI, ONNX</text>
  <text x="44" y="578" font-size="12" fill="#78350f">Stores: pgvector, Redis, JDBC, Cassandra, MongoDB, Neo4j and more</text>

  <path d="M354 588 L354 606" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M348 600 L354 610 L360 600 Z" fill="#334155"/>

  <!-- layer 5: runtimes -->
  <rect x="24" y="612" width="660" height="64" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
  <text x="44" y="636" font-size="15" font-weight="bold" fill="#0f172a">Model runtimes and stores</text>
  <text x="44" y="656" font-size="12" fill="#0f172a">local Ollama (llama3.1:8b, nomic-embed-text), hosted APIs, PostgreSQL 17 with pgvector</text>

  <!-- cross-cutting column -->
  <rect x="704" y="72" width="192" height="604" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="800" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">Cross-cutting</text>
  <rect x="720" y="112" width="160" height="92" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="800" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Observability</text>
  <text x="800" y="154" text-anchor="middle" font-size="11" fill="#7f1d1d">Micrometer observations</text>
  <text x="800" y="170" text-anchor="middle" font-size="11" fill="#7f1d1d">gen_ai.client.* metrics</text>
  <text x="800" y="186" text-anchor="middle" font-size="11" fill="#7f1d1d">execute_tool spans</text>
  <rect x="720" y="220" width="160" height="92" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="800" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Resilience</text>
  <text x="800" y="262" text-anchor="middle" font-size="11" fill="#7f1d1d">spring.ai.retry.*</text>
  <text x="800" y="278" text-anchor="middle" font-size="11" fill="#7f1d1d">spring.ai.tools.limits.*</text>
  <text x="800" y="294" text-anchor="middle" font-size="11" fill="#7f1d1d">timeouts</text>
  <rect x="720" y="328" width="160" height="108" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="800" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">MCP</text>
  <text x="800" y="370" text-anchor="middle" font-size="11" fill="#7f1d1d">client: remote tools</text>
  <text x="800" y="386" text-anchor="middle" font-size="11" fill="#7f1d1d">as ToolCallbacks</text>
  <text x="800" y="402" text-anchor="middle" font-size="11" fill="#7f1d1d">server: @McpTool and</text>
  <text x="800" y="418" text-anchor="middle" font-size="11" fill="#7f1d1d">@Tool beans over /mcp</text>
  <rect x="720" y="452" width="160" height="92" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="800" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Security</text>
  <text x="800" y="494" text-anchor="middle" font-size="11" fill="#7f1d1d">Spring Security,</text>
  <text x="800" y="510" text-anchor="middle" font-size="11" fill="#7f1d1d">@PreAuthorize on tools,</text>
  <text x="800" y="526" text-anchor="middle" font-size="11" fill="#7f1d1d">per-user memory IDs</text>
  <rect x="720" y="560" width="160" height="100" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="800" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Quality</text>
  <text x="800" y="602" text-anchor="middle" font-size="11" fill="#7f1d1d">evaluators,</text>
  <text x="800" y="618" text-anchor="middle" font-size="11" fill="#7f1d1d">Testcontainers,</text>
  <text x="800" y="634" text-anchor="middle" font-size="11" fill="#7f1d1d">Docker Compose services</text>
</svg>
