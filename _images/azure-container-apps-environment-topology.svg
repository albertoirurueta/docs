<svg viewBox="0 0 780 460" width="780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Container Apps environment topology</text>

  <!-- Environment boundary -->
  <rect x="16" y="42" width="748" height="400" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="32" y="64" font-size="12.5" font-weight="700" fill="#173d73">Environment: cae-bookshelf</text>
  <text x="32" y="80" font-size="10.5" fill="#3c4043">Shared virtual network, Log Analytics workspace, workload profiles (Consumption + optional Dedicated)</text>

  <!-- App 1: catalog-api -->
  <rect x="36" y="94" width="340" height="330" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.3"/>
  <text x="50" y="114" font-size="12" font-weight="700" fill="#0d4c22">Container app: catalog-api</text>

  <!-- Revision 1 (old, low traffic) -->
  <rect x="50" y="126" width="308" height="94" rx="6" fill="#fbe8cf" stroke="#c77c00" stroke-width="1"/>
  <text x="60" y="144" font-size="11" font-weight="700" fill="#7a4a00">Revision: catalog-api--rev1 (20% traffic)</text>
  <rect x="62" y="152" width="130" height="56" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="127" y="168" text-anchor="middle" font-size="10" fill="#7a4a00">Replica</text>
  <text x="127" y="182" text-anchor="middle" font-size="9" fill="#5f6368">container: catalog-api</text>
  <text x="127" y="194" text-anchor="middle" font-size="9" fill="#5f6368">sidecar: log-agent</text>
  <rect x="204" y="152" width="130" height="56" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="269" y="168" text-anchor="middle" font-size="10" fill="#7a4a00">Replica</text>
  <text x="269" y="182" text-anchor="middle" font-size="9" fill="#5f6368">container: catalog-api</text>
  <text x="269" y="194" text-anchor="middle" font-size="9" fill="#5f6368">sidecar: log-agent</text>

  <!-- Revision 2 (new, high traffic, label) -->
  <rect x="50" y="230" width="308" height="104" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
  <text x="60" y="248" font-size="11" font-weight="700" fill="#0d4c22">Revision: catalog-api--rev2 (80% traffic, label: prod)</text>
  <rect x="62" y="256" width="90" height="66" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="107" y="272" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>
  <text x="107" y="286" text-anchor="middle" font-size="9" fill="#5f6368">catalog-api</text>
  <text x="107" y="298" text-anchor="middle" font-size="9" fill="#5f6368">init: db-migrate</text>
  <rect x="162" y="256" width="90" height="66" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="207" y="272" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>
  <text x="207" y="286" text-anchor="middle" font-size="9" fill="#5f6368">catalog-api</text>
  <text x="207" y="298" text-anchor="middle" font-size="9" fill="#5f6368">init: db-migrate</text>
  <rect x="262" y="256" width="90" height="66" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="307" y="272" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>
  <text x="307" y="286" text-anchor="middle" font-size="9" fill="#5f6368">catalog-api</text>
  <text x="307" y="298" text-anchor="middle" font-size="9" fill="#5f6368">init: db-migrate</text>

  <text x="50" y="352" font-size="10.5" fill="#3c4043">Revision mode: multiple. Traffic split and the "prod" label are both</text>
  <text x="50" y="366" font-size="10.5" fill="#3c4043">assigned at the app's ingress, independently of each other.</text>
  <text x="50" y="386" font-size="10.5" fill="#3c4043">Each replica is an independently scaled instance of the revision's</text>
  <text x="50" y="400" font-size="10.5" fill="#3c4043">containers (main + sidecars) and init containers.</text>

  <!-- App 2: orders-api (collapsed) -->
  <rect x="392" y="94" width="356" height="120" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.3"/>
  <text x="406" y="114" font-size="12" font-weight="700" fill="#0d4c22">Container app: orders-api</text>
  <rect x="406" y="126" width="328" height="76" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
  <text x="416" y="144" font-size="11" font-weight="700" fill="#0d4c22">Revision: orders-api--rev1 (single mode, 100%)</text>
  <rect x="418" y="152" width="94" height="40" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="465" y="176" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>
  <rect x="522" y="152" width="94" height="40" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="569" y="176" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>
  <rect x="626" y="152" width="94" height="40" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="673" y="176" text-anchor="middle" font-size="10" fill="#0d4c22">Replica</text>

  <!-- Job note -->
  <rect x="392" y="226" width="356" height="60" rx="8" fill="#fde2e1" stroke="#c5221f" stroke-width="1.2"/>
  <text x="406" y="246" font-size="11" font-weight="700" fill="#7a1a17">Job: notifier (not a container app)</text>
  <text x="406" y="262" font-size="10" fill="#7a1a17">Runs to completion per trigger; no revisions or</text>
  <text x="406" y="276" font-size="10" fill="#7a1a17">ingress. See the scaling/jobs/Dapr sibling page.</text>

  <text x="392" y="316" font-size="10.5" fill="#3c4043">catalog-api and orders-api share this environment's virtual</text>
  <text x="392" y="330" font-size="10.5" fill="#3c4043">network, DNS suffix and Log Analytics destination, but each app,</text>
  <text x="392" y="344" font-size="10.5" fill="#3c4043">revision and replica scales and fails independently.</text>

  <text x="390" y="452" text-anchor="middle" font-size="10.5" fill="#5f6368">Nesting: environment &#8594; container apps &#8594; revisions &#8594; replicas &#8594; containers (main, sidecars, init).</text>
</svg>
