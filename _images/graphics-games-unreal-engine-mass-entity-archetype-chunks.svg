<text x="235" y="442" text-anchor="middle" font-size="11" fill="#374151">Entities that lost the tag live here</text>
<line x1="250" y1="250" x2="250" y2="268" stroke="#B45309" stroke-width="2" marker-end="url(#a1)"/>
<text x="262" y="262" text-anchor="start" font-size="11" fill="#92400E">RemoveTag command moves an entity</text>
<rect x="470" y="50" width="270" height="410" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="605" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">What a processor sees</text>
<rect x="490" y="90" width="230" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="605.0" y="106.8" text-anchor="middle" font-size="11" fill="#3730A3">EntityQuery requires:</text>
<text x="605.0" y="121.8" text-anchor="middle" font-size="11" fill="#3730A3">Transform and PatronWalk ReadWrite,</text>
<text x="605.0" y="136.8" text-anchor="middle" font-size="11" fill="#3730A3">WalkingTag All</text>
<line x1="605" y1="146" x2="605" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<rect x="490" y="168" width="230" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="186.3" text-anchor="middle" font-size="11" fill="#065F46">Matches archetype A only</text>
<text x="605.0" y="201.3" text-anchor="middle" font-size="11" fill="#065F46">archetype B has no tag</text>
<line x1="605" y1="212" x2="605" y2="234" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<rect x="490" y="234" width="230" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="605.0" y="250.8" text-anchor="middle" font-size="11" fill="#3730A3">ForEachEntityChunk calls the lambda</text>
<text x="605.0" y="265.9" text-anchor="middle" font-size="11" fill="#3730A3">once per chunk with contiguous</text>
<text x="605.0" y="280.9" text-anchor="middle" font-size="11" fill="#3730A3">array views over the fragments</text>
<text x="605" y="316" text-anchor="middle" font-size="11" fill="#374151">Entity handle = index + serial</text>
<text x="605" y="331" text-anchor="middle" font-size="11" fill="#374151">number: a stale handle is detected,</text>
<text x="605" y="346" text-anchor="middle" font-size="11" fill="#374151">so it never aliases a new entity.</text>
<text x="605" y="361" text-anchor="middle" font-size="11" fill="#374151"></text>
<text x="605" y="376" text-anchor="middle" font-size="11" fill="#374151">Shared fragments hold one value for</text>
<text x="605" y="391" text-anchor="middle" font-size="11" fill="#374151">many entities; chunk fragments hold</text>
<text x="605" y="406" text-anchor="middle" font-size="11" fill="#374151">one value per chunk.</text>
