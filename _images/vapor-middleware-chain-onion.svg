<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The middleware chain is an onion around the route handler</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">registration order = outside to inside; code before next.respond runs inward, code after it runs outward</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- rings -->
  <rect x="100" y="60" width="560" height="440" rx="10" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="116" y="82" font-size="14" font-weight="bold" fill="#1f5f99">1. CORSMiddleware (registered at: .beginning)</text>
  <text x="116" y="98" font-size="11" fill="#222222">adds Access-Control headers to every response, also to errors and preflights</text>

  <rect x="136" y="108" width="488" height="352" rx="10" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="152" y="130" font-size="14" font-weight="bold" fill="#b7410e">2. RouteLoggingMiddleware, ErrorMiddleware (defaults)</text>
  <text x="152" y="146" font-size="11" fill="#222222">ErrorMiddleware turns anything thrown further in into a Response with a status</text>

  <rect x="172" y="156" width="416" height="264" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="188" y="178" font-size="14" font-weight="bold" fill="#2e7d32">3. Your global middleware, in order</text>
  <text x="188" y="194" font-size="11" fill="#222222">RequestID, Timing, FileMiddleware, SessionsMiddleware ... (app.middleware.use)</text>

  <rect x="208" y="204" width="344" height="176" rx="10" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="224" y="226" font-size="14" font-weight="bold" fill="#6a3d9a">4. Route-group middleware</text>
  <text x="224" y="242" font-size="11" fill="#222222">grouped(APIKeyMiddleware): only for routes in the group</text>

  <rect x="244" y="252" width="272" height="96" rx="10" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="380" y="282" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">5. Route handler</text>
  <text x="380" y="300" font-size="11" fill="#222222" text-anchor="middle">the router has matched GET /admin/stats</text>
  <text x="380" y="316" font-size="11" fill="#222222" text-anchor="middle">and returns the Response upward</text>

  <!-- request and response arrows -->
  <text x="8" y="276" font-size="12" font-weight="bold" fill="#222222">request</text>
  <line x1="8" y1="286" x2="242" y2="286" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="242" y1="324" x2="8" y2="324" stroke="#444444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="8" y="344" font-size="12" font-weight="bold" fill="#222222">response</text>

  <!-- note on 404 -->
  <text x="380" y="372" font-size="11" fill="#6a3d9a" text-anchor="middle">A 404 never reaches layer 4 or 5:</text>
  <text x="380" y="388" font-size="11" fill="#6a3d9a" text-anchor="middle">only the global layers wrap the not-found responder</text>

  <!-- sequence -->
  <text x="690" y="84" font-size="13" font-weight="bold" fill="#222222">Order of execution</text>
  <text x="690" y="106" font-size="11" fill="#222222">in:  CORS, logging, error, global,</text>
  <text x="690" y="122" font-size="11" fill="#222222">     group, then the handler</text>
  <text x="690" y="146" font-size="11" fill="#222222">out: group, global, error (throws</text>
  <text x="690" y="162" font-size="11" fill="#222222">     become responses here), logging,</text>
  <text x="690" y="178" font-size="11" fill="#222222">     CORS adds its headers last</text>

  <rect x="690" y="208" width="232" height="104" rx="6" fill="#f6f6f6" stroke="#999999" stroke-width="1"/>
  <text x="702" y="228" font-size="12" font-weight="bold" fill="#222222">Short-circuit</text>
  <text x="702" y="246" font-size="11" fill="#222222">A middleware that does not call</text>
  <text x="702" y="262" font-size="11" fill="#222222">next.respond (or throws) turns the</text>
  <text x="702" y="278" font-size="11" fill="#222222">request around at its own ring:</text>
  <text x="702" y="294" font-size="11" fill="#222222">inner rings and the handler never run</text>

  <rect x="690" y="328" width="232" height="104" rx="6" fill="#f6f6f6" stroke="#999999" stroke-width="1"/>
  <text x="702" y="348" font-size="12" font-weight="bold" fill="#222222">Why the order matters</text>
  <text x="702" y="366" font-size="11" fill="#222222">Outer rings see the result of inner</text>
  <text x="702" y="382" font-size="11" fill="#222222">ones: a CORS or request-id header can</text>
  <text x="702" y="398" font-size="11" fill="#222222">decorate an error only if that ring is</text>
  <text x="702" y="414" font-size="11" fill="#222222">outside the one that throws</text>
</svg>
