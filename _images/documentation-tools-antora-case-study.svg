<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="cs-title cs-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="cs-title">Architecture of the Irurueta Docs site build</title>
  <desc id="cs-desc">A nightly or manual GitHub Actions run feeds the playbook, fifteen content sources, a custom UI bundle with supplemental files and two extensions into Antora, whose output folder is deployed to the gh-pages branch and served at www.irurueta.com.</desc>
  <defs>
    <marker id="cs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="520" rx="14" fill="#1e293b"/>

  <!-- trigger -->
  <rect x="30" y="20" width="860" height="56" rx="8" fill="#475569" stroke="#94a3b8"/>
  <text x="460" y="43" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">GitHub Actions: publish (cron 0 3 * * *) and manual_publish (workflow_dispatch)</text>
  <text x="460" y="63" text-anchor="middle" font-size="13" fill="#e2e8f0">checkout, Node 24, npm install, validate Mermaid, antora antora-playbook.yml, deploy</text>

  <!-- column titles -->
  <text x="165" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#93c5fd">Content (content.sources)</text>
  <text x="460" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#93c5fd">Antora run</text>
  <text x="755" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#93c5fd">Output and hosting</text>

  <!-- sources -->
  <rect x="30" y="122" width="270" height="108" rx="8" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="165" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">This repository (url: .)</text>
  <text x="165" y="165" text-anchor="middle" font-size="12.5" fill="#e0f2fe">branches: HEAD, antora.yml at the root</text>
  <text x="165" y="183" text-anchor="middle" font-size="12.5" fill="#e0f2fe">component ROOT, version null</text>
  <text x="165" y="201" text-anchor="middle" font-size="12.5" fill="#e0f2fe">home page with the project picker,</text>
  <text x="165" y="218" text-anchor="middle" font-size="12.5" fill="#e0f2fe">guides, nav.adoc, images</text>

  <rect x="30" y="244" width="270" height="108" rx="8" fill="#0f766e" stroke="#5eead4"/>
  <text x="165" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">13 Java library repositories</text>
  <text x="165" y="287" text-anchor="middle" font-size="12.5" fill="#ccfbf1">start_path: docs</text>
  <text x="165" y="305" text-anchor="middle" font-size="12.5" fill="#ccfbf1">release branch globs, one component</text>
  <text x="165" y="323" text-anchor="middle" font-size="12.5" fill="#ccfbf1">version per matching release branch</text>
  <text x="165" y="341" text-anchor="middle" font-size="12.5" fill="#ccfbf1">(hermes, irurueta-units, ...)</text>

  <rect x="30" y="366" width="270" height="70" rx="8" fill="#7c3aed" stroke="#c4b5fd"/>
  <text x="165" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ai-catalog</text>
  <text x="165" y="410" text-anchor="middle" font-size="12.5" fill="#ede9fe">branch main, start_path: docs</text>
  <text x="165" y="427" text-anchor="middle" font-size="12.5" fill="#ede9fe">one rolling version</text>

  <!-- antora -->
  <rect x="340" y="122" width="240" height="314" rx="10" fill="#334155" stroke="#94a3b8"/>
  <text x="460" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">antora-playbook.yml</text>

  <rect x="356" y="160" width="208" height="76" rx="6" fill="#b45309" stroke="#fcd34d"/>
  <text x="460" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">UI: ui-bundle.zip</text>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#fef3c7">local custom bundle, snapshot: true</text>
  <text x="460" y="217" text-anchor="middle" font-size="12" fill="#fef3c7">supplemental files: ui.yml,</text>
  <text x="460" y="231" text-anchor="middle" font-size="12" fill="#fef3c7">.nojekyll, ads.txt</text>

  <rect x="356" y="250" width="208" height="76" rx="6" fill="#be185d" stroke="#f9a8d4"/>
  <text x="460" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Extensions</text>
  <text x="460" y="290" text-anchor="middle" font-size="12" fill="#fce7f3">Mermaid: script added to the head,</text>
  <text x="460" y="306" text-anchor="middle" font-size="12" fill="#fce7f3">diagram drawn in the browser</text>
  <text x="460" y="321" text-anchor="middle" font-size="12" fill="#fce7f3">MathJax: SVG drawn at build time</text>

  <rect x="356" y="340" width="208" height="84" rx="6" fill="#475569" stroke="#cbd5e1"/>
  <text x="460" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">site and asciidoc keys</text>
  <text x="460" y="380" text-anchor="middle" font-size="12" fill="#e2e8f0">site.url, start_page, robots,</text>
  <text x="460" y="396" text-anchor="middle" font-size="12" fill="#e2e8f0">analytics key, MathJax attributes,</text>
  <text x="460" y="412" text-anchor="middle" font-size="12" fill="#e2e8f0">experimental</text>

  <!-- output -->
  <rect x="620" y="122" width="270" height="92" rx="8" fill="#15803d" stroke="#86efac"/>
  <text x="755" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">build/site</text>
  <text x="755" y="166" text-anchor="middle" font-size="12.5" fill="#dcfce7">static HTML, UI files in the _ folder,</text>
  <text x="755" y="184" text-anchor="middle" font-size="12.5" fill="#dcfce7">.nojekyll, ads.txt, robots.txt,</text>
  <text x="755" y="202" text-anchor="middle" font-size="12.5" fill="#dcfce7">sitemaps</text>

  <rect x="620" y="244" width="270" height="76" rx="8" fill="#15803d" stroke="#86efac"/>
  <text x="755" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">gh-pages branch</text>
  <text x="755" y="288" text-anchor="middle" font-size="12.5" fill="#dcfce7">crazy-max/ghaction-github-pages</text>
  <text x="755" y="306" text-anchor="middle" font-size="12.5" fill="#dcfce7">publishes build/site</text>

  <rect x="620" y="350" width="270" height="86" rx="8" fill="#0369a1" stroke="#7dd3fc"/>
  <text x="755" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">www.irurueta.com</text>
  <text x="755" y="394" text-anchor="middle" font-size="12.5" fill="#e0f2fe">GitHub Pages with a custom domain</text>
  <text x="755" y="412" text-anchor="middle" font-size="12.5" fill="#e0f2fe">Mermaid library loaded from a CDN</text>

  <!-- arrows -->
  <line x1="300" y1="176" x2="338" y2="176" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>
  <line x1="300" y1="298" x2="338" y2="298" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>
  <line x1="300" y1="401" x2="338" y2="401" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>
  <line x1="580" y1="168" x2="618" y2="168" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>
  <line x1="755" y1="214" x2="755" y2="242" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>
  <line x1="755" y1="320" x2="755" y2="348" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cs-arrow)"/>

  <text x="460" y="472" text-anchor="middle" font-size="13" fill="#e2e8f0">Every run is a clean checkout, so remote repositories are cloned fresh and new release branches are picked up.</text>
  <text x="460" y="494" text-anchor="middle" font-size="13" fill="#e2e8f0">No component is changed in this repository when a library publishes a new release.</text>
</svg>
