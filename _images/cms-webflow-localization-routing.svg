<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How a request for the Fernbrook Gardens site is routed to a locale: subdirectory paths select the locale directly, while automatic routing applies only to the root homepage and only on higher Localize tiers">
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">Locale routing on fernbrook.example</text>
<rect x="20" y="60" width="190" height="64" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="115" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">Visitor request</text>
<text x="115" y="108" text-anchor="middle" font-size="13" fill="#0B4F6C">URL + Accept-Language</text>
<line x1="210" y1="92" x2="270" y2="92" stroke="#0B4F6C" stroke-width="2"/>
<polygon points="270,86 282,92 270,98" fill="#0B4F6C"/>
<polygon points="282,92 380,52 478,92 380,132" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="380" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4800">Which path?</text>
<text x="380" y="106" text-anchor="middle" font-size="12" fill="#7A4800">subdirectory prefix</text>
<line x1="478" y1="92" x2="520" y2="92" stroke="#0B4F6C" stroke-width="2"/>
<rect x="520" y="60" width="360" height="64" rx="8" fill="#F4F4F4" stroke="#555555"/>
<text x="700" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Locale taken from the prefix</text>
<text x="700" y="106" text-anchor="middle" font-size="13" fill="#333333">the browser language is ignored</text>
<rect x="40" y="170" width="250" height="110" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="165" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">/plants/lavender</text>
<text x="165" y="218" text-anchor="middle" font-size="13" fill="#0B4F6C">no prefix = primary locale</text>
<text x="165" y="238" text-anchor="middle" font-size="13" fill="#0B4F6C">English (en)</text>
<text x="165" y="260" text-anchor="middle" font-size="12" fill="#0B4F6C">item: Lavender</text>
<rect x="325" y="170" width="250" height="110" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="450" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1B5E20">/es/plantas/espliego</text>
<text x="450" y="218" text-anchor="middle" font-size="13" fill="#1B5E20">subdirectory /es</text>
<text x="450" y="238" text-anchor="middle" font-size="13" fill="#1B5E20">Spanish (es), secondary</text>
<text x="450" y="260" text-anchor="middle" font-size="12" fill="#1B5E20">item: Espliego (own slug)</text>
<rect x="610" y="170" width="250" height="110" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="735" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1B5E20">/de/pflanzen/lavendel</text>
<text x="735" y="218" text-anchor="middle" font-size="13" fill="#1B5E20">subdirectory /de</text>
<text x="735" y="238" text-anchor="middle" font-size="13" fill="#1B5E20">German (de), secondary</text>
<text x="735" y="260" text-anchor="middle" font-size="12" fill="#1B5E20">item: Lavendel (own slug)</text>
<line x1="380" y1="132" x2="380" y2="150" stroke="#0B4F6C" stroke-width="2"/>
<line x1="165" y1="150" x2="735" y2="150" stroke="#0B4F6C" stroke-width="2"/>
<line x1="165" y1="150" x2="165" y2="170" stroke="#0B4F6C" stroke-width="2"/>
<line x1="450" y1="150" x2="450" y2="170" stroke="#0B4F6C" stroke-width="2"/>
<line x1="735" y1="150" x2="735" y2="170" stroke="#0B4F6C" stroke-width="2"/>
<rect x="40" y="320" width="400" height="170" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="56" y="346" font-size="15" font-weight="700" fill="#7A4800">Request for the root homepage only</text>
<text x="56" y="370" font-size="13" fill="#7A4800">Advanced and Enterprise Localize tiers:</text>
<text x="56" y="390" font-size="13" fill="#7A4800">automatic routing matches the browser language</text>
<text x="56" y="410" font-size="13" fill="#7A4800">to a published locale and redirects to it.</text>
<text x="56" y="436" font-size="13" fill="#7A4800">Language-only browser (fr) is not sent to a</text>
<text x="56" y="456" font-size="13" fill="#7A4800">country locale (fr-CA). Other tiers: no redirect.</text>
<rect x="470" y="320" width="410" height="170" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="486" y="346" font-size="15" font-weight="700" fill="#0B4F6C">Every page also tells search engines</text>
<text x="486" y="370" font-size="13" fill="#0B4F6C">link rel="alternate" hreflang="en" ... /plants/lavender</text>
<text x="486" y="390" font-size="13" fill="#0B4F6C">link rel="alternate" hreflang="es" ... /es/plantas/espliego</text>
<text x="486" y="410" font-size="13" fill="#0B4F6C">link rel="alternate" hreflang="de" ... /de/pflanzen/lavendel</text>
<text x="486" y="436" font-size="13" fill="#0B4F6C">Only locales with publishing enabled appear in the</text>
<text x="486" y="456" font-size="13" fill="#0B4F6C">head tags and in the generated sitemap.</text>
<line x1="450" y1="280" x2="450" y2="300" stroke="#555555" stroke-width="2"/>
<line x1="240" y1="300" x2="675" y2="300" stroke="#555555" stroke-width="2"/>
<line x1="240" y1="300" x2="240" y2="320" stroke="#555555" stroke-width="2"/>
<line x1="675" y1="300" x2="675" y2="320" stroke="#555555" stroke-width="2"/>
</svg>
