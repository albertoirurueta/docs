<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ext-compressed-picker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Choosing a compressed texture delivery strategy</text>
<rect x="20" y="50" width="190" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="76.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Which formats are</text>
<text x="115.0" y="91.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">in the supported list?</text>
<rect x="270" y="50" width="220" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="68.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Ship one KTX2 or Basis file</text>
<text x="380.0" y="83.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">transcode at load time</text>
<rect x="270" y="106" width="220" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="124.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Ship per-format files</text>
<text x="380.0" y="139.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(S3TC, ETC, ASTC)</text>
<rect x="550" y="50" width="190" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="68.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Pick format at runtime</text>
<text x="645.0" y="83.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">from the transcoder target</text>
<rect x="550" y="106" width="190" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="124.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Serve the matching</text>
<text x="645.0" y="139.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">file, keep PNG as backup</text>
<line x1="210" y1="72" x2="270" y2="72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-compressed-picker)"/>
<line x1="210" y1="92" x2="270" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-compressed-picker)"/>
<line x1="490" y1="72" x2="550" y2="72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-compressed-picker)"/>
<line x1="490" y1="128" x2="550" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-compressed-picker)"/>
<rect x="20" y="190" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="106.0" y="219.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">WEBGL_compressed_texture_s3tc</text>
<text x="106.0" y="232.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">desktop GPUs; BC1 to BC3</text>
<rect x="202" y="190" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="288.0" y="219.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">WEBGL_compressed_texture_etc</text>
<text x="288.0" y="232.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">mobile GPUs; ETC2 and EAC</text>
<rect x="384" y="190" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="219.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">WEBGL_compressed_texture_astc</text>
<text x="470.0" y="232.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">mobile, some desktop</text>
<rect x="566" y="190" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="652.0" y="219.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">WEBGL_compressed_texture_pvrtc</text>
<text x="652.0" y="232.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">legacy Apple GPUs</text>
<text x="380" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Compressed data stays compressed in VRAM: smaller memory and bandwidth, but lossy and best for colour maps.</text>
<text x="380" y="302" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Avoid compressing normal maps with generic colour formats unless the tool supports a normal-map mode.</text>
<text x="380" y="326" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The Bookshelf textures ship as PNG; produce KTX2 versions with toktx or ktx create and compare memory.</text>
</svg>
