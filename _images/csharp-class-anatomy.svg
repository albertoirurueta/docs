<svg viewBox="0 0 830 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Anatomy of a C# class: the declaration line carries access and inheritance modifiers; the body holds constants and static fields shared by the type, instance fields owned per object, constructors, properties with their accessors, methods, indexers, nested types and a finalizer, each marked public, protected, internal or private.</title>
  <rect x="0" y="0" width="830" height="520" fill="#ffffff"/>

  <text x="415" y="27" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a class</text>
  <text x="415" y="46" font-size="11" fill="#666666" text-anchor="middle">what lives in a class body, and which members belong to the type rather than the object</text>

  <!-- declaration line -->
  <rect x="30" y="66" width="620" height="40" rx="5" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="46" y="92" font-size="13.5" fill="#1f3b5c" font-family="Consolas, monospace">public sealed class Order : IOrder</text>
  <text x="664" y="84" font-size="10" fill="#3d6fa5">accessibility</text>
  <text x="664" y="98" font-size="10" fill="#3d6fa5">+ inheritance</text>

  <!-- outer body box -->
  <rect x="30" y="118" width="770" height="356" rx="6" fill="#fcfcfd" stroke="#b9c2cc" stroke-width="1.2"/>

  <!-- type-level band -->
  <rect x="46" y="134" width="738" height="92" rx="5" fill="#f3eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="60" y="153" font-size="11.5" font-weight="bold" fill="#3c2a5c">Belongs to the TYPE — one copy, shared by every instance</text>
  <text x="60" y="175" font-size="11.5" fill="#3c2a5c" font-family="Consolas, monospace">public const decimal MaxDiscount = 0.5m;</text>
  <text x="60" y="194" font-size="11.5" fill="#3c2a5c" font-family="Consolas, monospace">private static int s_created;</text>
  <text x="60" y="213" font-size="11.5" fill="#3c2a5c" font-family="Consolas, monospace">static Order() { ... }</text>
  <text x="520" y="175" font-size="10" fill="#7a68a0">compile-time constant</text>
  <text x="520" y="194" font-size="10" fill="#7a68a0">static field</text>
  <text x="520" y="213" font-size="10" fill="#7a68a0">static constructor: runs once</text>

  <!-- instance band -->
  <rect x="46" y="240" width="738" height="218" rx="5" fill="#eefaf4" stroke="#2f7d51" stroke-width="1.4"/>
  <text x="60" y="259" font-size="11.5" font-weight="bold" fill="#1d5236">Belongs to each OBJECT — one copy per instance</text>

  <text x="60" y="282" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">private readonly List&lt;OrderLine&gt; _lines = [];</text>
  <text x="560" y="282" font-size="10" fill="#5a8a70">instance field (state)</text>

  <text x="60" y="305" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">public Order(string customer) { ... }</text>
  <text x="560" y="305" font-size="10" fill="#5a8a70">constructor</text>

  <text x="60" y="334" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">public string Customer { get; init; }</text>
  <text x="560" y="334" font-size="10" fill="#5a8a70">auto property</text>
  <text x="60" y="353" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">public decimal Total { get =&gt; field; set =&gt; ... }</text>
  <text x="560" y="353" font-size="10" fill="#5a8a70">accessors + `field` (C# 14)</text>

  <text x="60" y="382" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">public void Add(OrderLine line) { ... }</text>
  <text x="560" y="382" font-size="10" fill="#5a8a70">method (behaviour)</text>
  <text x="60" y="401" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">public OrderLine this[int index] =&gt; _lines[index];</text>
  <text x="560" y="401" font-size="10" fill="#5a8a70">indexer</text>

  <text x="60" y="430" font-size="11.5" fill="#1d5236" font-family="Consolas, monospace">private sealed class Entry { ... }</text>
  <text x="560" y="430" font-size="10" fill="#5a8a70">nested type (private by default)</text>
  <text x="60" y="449" font-size="11.5" fill="#8a5030" font-family="Consolas, monospace">~Order() { ... }</text>
  <text x="560" y="449" font-size="10" fill="#a06a4a">finalizer — almost never needed</text>

  <!-- accessibility legend -->
  <text x="415" y="494" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">Accessibility, widest to narrowest</text>
  <text x="415" y="511" font-size="10.5" fill="#666666" text-anchor="middle">public  ›  protected internal  ›  internal (default for types)  ›  protected  ›  private protected  ›  private (default for members)  ›  file</text>
</svg>
