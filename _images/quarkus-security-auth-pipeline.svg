<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Authentication -&gt; identity -&gt; authorization pipeline</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">every incoming request passes through the same three stages before a resource method runs</text>

  <!-- stage 1: Authentication -->
  <rect x="30" y="80" width="210" height="240" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="135" y="106" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. Authentication</text>
  <text x="135" y="122" font-size="10" fill="#555555" text-anchor="middle">HttpAuthenticationMechanism</text>
  <text x="46" y="146" font-size="10" fill="#333333">- inspects the request (header,</text>
  <text x="46" y="160" font-size="10" fill="#333333">  cookie, cert) for credentials</text>
  <text x="46" y="176" font-size="10" fill="#333333">- several mechanisms can be</text>
  <text x="46" y="190" font-size="10" fill="#333333">  registered at once; each</text>
  <text x="46" y="204" font-size="10" fill="#333333">  declares a path-matching</text>
  <text x="46" y="218" font-size="10" fill="#333333">  selector</text>
  <text x="46" y="238" font-size="10" fill="#333333">- proactive auth (default) runs</text>
  <text x="46" y="252" font-size="10" fill="#333333">  this before routing; can be</text>
  <text x="46" y="266" font-size="10" fill="#333333">  turned off to defer it</text>
  <text x="46" y="286" font-size="9.5" fill="#1c4b73" font-style="italic">produces: raw credentials handed</text>
  <text x="46" y="298" font-size="9.5" fill="#1c4b73" font-style="italic">to an IdentityProvider</text>

  <!-- stage 2: Identity -->
  <rect x="275" y="80" width="210" height="240" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="106" font-size="13.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">2. Identity</text>
  <text x="380" y="122" font-size="10" fill="#555555" text-anchor="middle">IdentityProviderManager</text>
  <text x="291" y="146" font-size="10" fill="#333333">- dispatches to the</text>
  <text x="291" y="160" font-size="10" fill="#333333">  IdentityProvider matching the</text>
  <text x="291" y="174" font-size="10" fill="#333333">  credential type (password,</text>
  <text x="291" y="188" font-size="10" fill="#333333">  JWT, token, certificate)</text>
  <text x="291" y="208" font-size="10" fill="#333333">- SecurityIdentityAugmentor(s)</text>
  <text x="291" y="222" font-size="10" fill="#333333">  can add roles/attributes</text>
  <text x="291" y="236" font-size="10" fill="#333333">  after the base identity is</text>
  <text x="291" y="250" font-size="10" fill="#333333">  built</text>
  <text x="291" y="270" font-size="9.5" fill="#2d6a34" font-style="italic">produces: an immutable</text>
  <text x="291" y="282" font-size="9.5" fill="#2d6a34" font-style="italic">SecurityIdentity (principal,</text>
  <text x="291" y="294" font-size="9.5" fill="#2d6a34" font-style="italic">roles, attributes, credential)</text>

  <!-- stage 3: Authorization -->
  <rect x="520" y="80" width="210" height="240" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="625" y="106" font-size="13.5" font-weight="bold" fill="#a33" text-anchor="middle">3. Authorization</text>
  <text x="625" y="122" font-size="10" fill="#555555" text-anchor="middle">policy + annotation checks</text>
  <text x="536" y="146" font-size="10" fill="#333333">- quarkus.http.auth.permission.*</text>
  <text x="536" y="160" font-size="10" fill="#333333">  path-based policies checked</text>
  <text x="536" y="174" font-size="10" fill="#333333">  first, in HTTP security</text>
  <text x="536" y="188" font-size="10" fill="#333333">- then method-level checks:</text>
  <text x="536" y="202" font-size="10" fill="#333333">  @RolesAllowed, @Authenticated,</text>
  <text x="536" y="216" font-size="10" fill="#333333">  @PermissionsAllowed</text>
  <text x="536" y="236" font-size="10" fill="#333333">- a denial short-circuits before</text>
  <text x="536" y="250" font-size="10" fill="#333333">  the resource method body runs</text>
  <text x="536" y="270" font-size="9.5" fill="#a33" font-style="italic">produces: 401 (no/invalid</text>
  <text x="536" y="282" font-size="9.5" fill="#a33" font-style="italic">identity), 403 (denied), or the</text>
  <text x="536" y="294" font-size="9.5" fill="#a33" font-style="italic">resource method executes</text>

  <!-- arrows between stages -->
  <line x1="240" y1="200" x2="275" y2="200" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="485" y1="200" x2="520" y2="200" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- caption -->
  <text x="380" y="356" font-size="10.5" fill="#666666" text-anchor="middle">SecurityIdentity, once built, is the single source of truth every later check reads from -- it can be</text>
  <text x="380" y="370" font-size="10.5" fill="#666666" text-anchor="middle">looked up again via CurrentIdentityAssociation without repeating authentication.</text>

  <rect x="30" y="392" width="700" height="46" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="412" font-size="9.5" fill="#666666" text-anchor="middle">no HttpAuthenticationMechanism matches / no credentials present -&gt; request proceeds as the built-in</text>
  <text x="380" y="426" font-size="9.5" fill="#666666" text-anchor="middle">anonymous SecurityIdentity, which still flows through stage 3 and is denied by any non-@PermitAll check</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
