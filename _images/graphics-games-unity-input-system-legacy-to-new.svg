<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-in-leg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Legacy Input class compared with the Input System</text>
<rect x="20" y="45" width="340" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="63.5" text-anchor="middle" font-size="13" fill="#92400E">Legacy (UnityEngine.Input)</text>
<rect x="400" y="45" width="340" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="63.5" text-anchor="middle" font-size="13" fill="#3730A3">Input System (UnityEngine.InputSystem)</text>
<rect x="20" y="88" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="107.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetAxis("Horizontal")</text>
<rect x="400" y="88" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="107.5" text-anchor="middle" font-size="11" fill="#374151">moveAction.ReadValue&lt;Vector2&gt;().x</text>
<line x1="360" y1="104" x2="400" y2="104" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="128" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="147.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetButton("Jump")</text>
<rect x="400" y="128" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="147.5" text-anchor="middle" font-size="11" fill="#374151">jumpAction.IsPressed()</text>
<line x1="360" y1="144" x2="400" y2="144" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="168" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="187.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetButtonDown("Jump")</text>
<rect x="400" y="168" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="187.5" text-anchor="middle" font-size="11" fill="#374151">jumpAction.WasPressedThisFrame()</text>
<line x1="360" y1="184" x2="400" y2="184" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="208" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="227.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetButtonUp("Jump")</text>
<rect x="400" y="208" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="227.5" text-anchor="middle" font-size="11" fill="#374151">jumpAction.WasReleasedThisFrame()</text>
<line x1="360" y1="224" x2="400" y2="224" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="248" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="267.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetKeyDown(KeyCode.Space)</text>
<rect x="400" y="248" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="267.5" text-anchor="middle" font-size="11" fill="#374151">Keyboard.current.spaceKey.wasPressedThisFrame</text>
<line x1="360" y1="264" x2="400" y2="264" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="288" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="307.5" text-anchor="middle" font-size="11" fill="#374151">Input.mousePosition</text>
<rect x="400" y="288" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="307.5" text-anchor="middle" font-size="11" fill="#374151">Mouse.current.position.ReadValue()</text>
<line x1="360" y1="304" x2="400" y2="304" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<rect x="20" y="328" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="347.5" text-anchor="middle" font-size="11" fill="#374151">Input.GetAxisRaw(...)</text>
<rect x="400" y="328" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="347.5" text-anchor="middle" font-size="11" fill="#374151">moveAction.ReadUnprocessedValue()</text>
<line x1="360" y1="344" x2="400" y2="344" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-leg)"/>
<text x="380" y="382" text-anchor="middle" font-size="10" fill="#374151">Project Settings &gt; Player &gt; Active Input Handling selects Input Manager (Old), Input System Package (New) or Both.</text>
<text x="380" y="398" text-anchor="middle" font-size="10" fill="#92400E">Calling a legacy Input method while only the new back end is enabled throws InvalidOperationException at run time.</text>
</svg>
