<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>ACL inheritance down the shelf tree</title>
  <defs>
    <marker id="aci-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">ACL inheritance down the Bookshelf Shelves tree</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the lookup starts at the context and walks up through __parent__ until an ACE matches</text>

  <!-- tree edges -->
  <line x1="360" y1="116" x2="360" y2="142" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="360" y1="196" x2="360" y2="214" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="190" y1="214" x2="530" y2="214" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="190" y1="214" x2="190" y2="236" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="530" y1="214" x2="530" y2="236" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="190" y1="340" x2="190" y2="376" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="530" y1="340" x2="530" y2="376" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>

  <!-- root -->
  <rect x="190" y="54" width="340" height="62" rx="6" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="73" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Root (name '', parent None)</text>
  <text x="360" y="92" font-size="11" fill="currentColor" text-anchor="middle">(Allow, Everyone, 'view')</text>
  <text x="360" y="107" font-size="11" fill="currentColor" text-anchor="middle">(Allow, 'group:admins', ALL_PERMISSIONS)</text>

  <!-- shelves -->
  <rect x="190" y="142" width="340" height="54" rx="6" fill="#808080" fill-opacity="0.20" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="162" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Shelves container</text>
  <text x="360" y="182" font-size="11" fill="currentColor" text-anchor="middle">(Allow, Authenticated, 'create')</text>

  <!-- ada shelf -->
  <rect x="30" y="236" width="320" height="104" rx="6" fill="#808080" fill-opacity="0.20" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="256" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Shelf 'ada' (public)</text>
  <text x="190" y="276" font-size="11" fill="currentColor" text-anchor="middle">__acl__() returns:</text>
  <text x="190" y="294" font-size="11" fill="currentColor" text-anchor="middle">(Allow, 'user:ada', ('add', 'edit', 'delete'))</text>
  <text x="190" y="316" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">no DENY_ALL: unmatched permissions</text>
  <text x="190" y="331" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">continue to the Shelves and Root ACLs</text>

  <!-- grace shelf -->
  <rect x="370" y="236" width="320" height="104" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2.5"/>
  <text x="530" y="256" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Shelf 'grace' (private)</text>
  <text x="530" y="276" font-size="11" fill="currentColor" text-anchor="middle">(Allow, 'group:admins', ALL_PERMISSIONS)</text>
  <text x="530" y="294" font-size="11" fill="currentColor" text-anchor="middle">(Allow, 'user:grace', ALL_PERMISSIONS)</text>
  <text x="530" y="316" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">DENY_ALL</text>
  <text x="530" y="331" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">the walk stops here: nothing above is read</text>

  <!-- books -->
  <rect x="80" y="376" width="220" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="397" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Book 'dune'</text>
  <text x="190" y="416" font-size="11" fill="currentColor" text-anchor="middle">no ACL of its own: inherits all</text>
  <rect x="420" y="376" width="220" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="530" y="397" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Book 'emma'</text>
  <text x="530" y="416" font-size="11" fill="currentColor" text-anchor="middle">no ACL of its own: inherits all</text>

  <!-- lookup arrows (upwards) -->
  <path d="M 70 376 C 20 340 20 300 30 270" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aci-arrow)"/>
  <text x="14" y="360" font-size="11" fill="currentColor" text-anchor="start" opacity="0.9">1</text>
  <path d="M 30 236 C 0 200 60 170 190 170" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aci-arrow)"/>
  <text x="8" y="200" font-size="11" fill="currentColor" opacity="0.9">2</text>
  <path d="M 190 142 C 120 120 120 90 190 86" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aci-arrow)"/>
  <text x="104" y="112" font-size="11" fill="currentColor" opacity="0.9">3</text>

  <path d="M 650 376 C 710 340 710 300 690 270" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aci-arrow)"/>
  <text x="702" y="360" font-size="11" fill="currentColor" opacity="0.9">1</text>
  <line x1="500" y1="224" x2="560" y2="224" stroke="currentColor" stroke-width="5"/>
  <text x="572" y="228" font-size="11" font-weight="bold" fill="currentColor">stop</text>

  <!-- legend -->
  <rect x="30" y="456" width="660" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <text x="46" y="478" font-size="12" font-weight="bold" fill="currentColor">Reading the figure</text>
  <text x="46" y="498" font-size="11.5" fill="currentColor">Dashed arrows: the order in which ACLHelper.permits consults the lineage of the context (numbers = order).</text>
  <text x="46" y="516" font-size="11.5" fill="currentColor">First ACE whose principal is in the caller's principals and whose permission matches decides: Allow or Deny.</text>
  <text x="46" y="534" font-size="11.5" fill="currentColor">Thick bar: DENY_ALL ends the walk, so an admin entry must come before it; no ACE found anywhere means denied.</text>
</svg>
