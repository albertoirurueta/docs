<svg viewBox="0 0 900 380" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Private S3 origin protected by Origin Access Control</text>

  <rect x="20" y="110" width="130" height="80" rx="10" fill="#f3f4f6" stroke="#5b6670" stroke-width="1.8"/>
  <text x="85" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Viewer</text>
  <text x="85" y="165" text-anchor="middle" font-size="11" fill="#3c4a58">www.example.com</text>

  <rect x="290" y="80" width="220" height="140" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="400" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">CloudFront distribution</text>
  <text x="400" y="124" text-anchor="middle" font-size="11" fill="#123a72">bookshelf-cdn (E1EXAMPLE1234)</text>
  <rect x="310" y="140" width="180" height="62" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#123a72">Origin access control</text>
  <text x="400" y="177" text-anchor="middle" font-size="11" fill="#3c4a58">signing: always, SigV4</text>
  <text x="400" y="193" text-anchor="middle" font-size="11" fill="#3c4a58">service principal cloudfront.amazonaws.com</text>

  <rect x="650" y="80" width="230" height="140" rx="10" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="2"/>
  <text x="765" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">S3 bucket (private)</text>
  <text x="765" y="124" text-anchor="middle" font-size="11" fill="#14532d">bookshelf-web-111122223333</text>
  <text x="765" y="150" text-anchor="middle" font-size="11" fill="#14532d">Block Public Access: on</text>
  <text x="765" y="168" text-anchor="middle" font-size="11" fill="#14532d">ACLs disabled (bucket owner enforced)</text>
  <text x="765" y="186" text-anchor="middle" font-size="11" fill="#14532d">bucket policy: allow s3:GetObject to</text>
  <text x="765" y="202" text-anchor="middle" font-size="11" fill="#14532d">CloudFront if AWS:SourceArn = this distribution</text>

  <g stroke="#3c4a58" stroke-width="2" fill="#3c4a58">
    <line x1="150" y1="150" x2="288" y2="150"/><polygon points="290,150 280,145 280,155"/>
    <line x1="510" y1="150" x2="648" y2="150"/><polygon points="650,150 640,145 640,155"/>
  </g>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#3c4a58">HTTPS</text>
  <text x="580" y="140" text-anchor="middle" font-size="11" fill="#3c4a58">signed GetObject</text>

  <!-- direct access denied -->
  <rect x="20" y="270" width="130" height="60" rx="10" fill="#f3f4f6" stroke="#5b6670" stroke-width="1.8"/>
  <text x="85" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Anyone else</text>
  <text x="85" y="314" text-anchor="middle" font-size="11" fill="#3c4a58">direct S3 URL</text>
  <path d="M 150 300 L 760 300 L 760 222" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="440" y1="288" x2="460" y2="312" stroke="#b3261e" stroke-width="3"/>
  <line x1="460" y1="288" x2="440" y2="312" stroke="#b3261e" stroke-width="3"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#b3261e">403 AccessDenied: no public access and no matching principal</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#3c4a58">Objects are reachable only through the distribution named in the policy condition.</text>
</svg>
