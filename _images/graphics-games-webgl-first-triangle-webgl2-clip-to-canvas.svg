<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-first-triangle-webgl2-clip-to-canvas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where the three vertices land on a 400 by 300 canvas</text>
<rect x="40" y="60" width="240" height="240" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<line x1="40" y1="180" x2="280" y2="180" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="160" y1="60" x2="160" y2="300" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="160,108 232,252 88,252" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="160" y="100" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(0, 0.6)</text>
<text x="250" y="268" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(0.6, -0.6)</text>
<text x="70" y="268" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(-0.6, -0.6)</text>
<text x="160" y="322" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Normalised device coordinates</text>
<text x="160" y="338" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x and y from -1 to 1, y up</text>
<text x="40" y="54" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">-1</text>
<text x="280" y="54" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">+1</text>
<line x1="300" y1="180" x2="370" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-first-triangle-webgl2-clip-to-canvas)"/>
<text x="335" y="168" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">viewport</text>
<text x="335" y="200" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">(0, 0, 400, 300)</text>
<rect x="390" y="60" width="320" height="240" fill="#1E293B" stroke="#4B5563" stroke-width="1.5"/>
<polygon points="550,108 646,252 454,252" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="550" y="100" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(200, 240)</text>
<text x="646" y="268" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(320, 60)</text>
<text x="454" y="268" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(80, 60)</text>
<text x="550" y="322" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Window coordinates in canvas pixels</text>
<text x="550" y="338" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">origin at the bottom-left corner, y up</text>
