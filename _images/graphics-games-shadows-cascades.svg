<svg viewBox="0 0 760 480" width="760" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="480" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Cascaded shadow maps: one frustum, several maps</text>
<polygon points="235,400 203.5,330 296.5,330 265,400" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<polygon points="203.5,330 158.5,230 341.5,230 296.5,330" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<polygon points="158.5,230 86.5,70 413.5,70 341.5,230" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="250" cy="408" r="7" fill="#374151" stroke="none" stroke-width="1"/>
<text x="250" y="430" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">camera</text>
<text x="250" y="446" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">view direction points up</text>
<line x1="250" y1="400" x2="250" y2="60" stroke="#4B5563" stroke-width="1.2" marker-end="url(#sc)" stroke-dasharray="4 3"/>
<rect x="430" y="278" width="300" height="76" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="446" y="300" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Cascade 0</text>
<text x="446" y="320" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">near plane to split 1</text>
<text x="446" y="340" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">highest texel density, sharp contact shadows</text>
<line x1="430" y1="316" x2="282.75" y2="365" stroke="#047857" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="430" y="178" width="300" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="446" y="200" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Cascade 1</text>
<text x="446" y="220" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">split 1 to split 2</text>
<text x="446" y="240" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">medium density</text>
<line x1="430" y1="216" x2="321" y2="280" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="430" y="78" width="300" height="76" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="446" y="100" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Cascade 2</text>
<text x="446" y="120" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">split 2 to far plane</text>
<text x="446" y="140" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">lowest density, soft distant shadows</text>
<line x1="430" y1="116" x2="379.5" y2="150" stroke="#B45309" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="466" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Practical split scheme: blend of uniform and logarithmic split distances, controlled by a lambda in [0,1]</text>
</svg>
