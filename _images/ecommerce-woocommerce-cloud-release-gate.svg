<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Release gate of the Pocket Coffee store on Kubernetes</title>
  <desc id="d">A release of the Pocket Coffee store passes six gates from left to right. First the freeze calendar decides whether a release may start at all. Second, the build produces an image tagged with the git SHA that contains WooCommerce, the extensions and the mu-plugin that turns off the automatic database update in the Job. Third, a manual RDS snapshot is taken and waited for. Fourth, the pre-upgrade Job pocketcoffee-migrate runs wp wc update with the migrate database user and compares the WooCommerce code version with woocommerce_db_version. Fifth, the web, worker and cron workloads roll to the new image. Sixth, smoke checks look at the shop, the failed and pending Action Scheduler actions and the HPOS status. Below the gates three recovery paths are shown with decreasing comfort: helm rollback returns the old image and works while the database is compatible, a forward fix releases a new image, and restoring the snapshot creates a new RDS instance and loses the orders placed after the snapshot, so the workers must stay stopped until payments are reconciled.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="38" font-size="18" font-weight="bold" fill="#f4b860">Release gate: nothing reaches the shop before the database is ready</text>

  <rect x="20" y="62" width="136" height="150" rx="9" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="88" y="86" font-size="13" font-weight="bold" fill="#f4b860" text-anchor="middle">1 Freeze gate</text>
  <text x="88" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">release-freeze.txt</text>
  <text x="88" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">UTC date inside a</text>
  <text x="88" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">window: stop</text>
  <text x="88" y="170" font-size="12" fill="#9fd3c7" text-anchor="middle">override needs the</text>
  <text x="88" y="186" font-size="12" fill="#9fd3c7" text-anchor="middle">production approval</text>

  <rect x="177" y="62" width="136" height="150" rx="9" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="245" y="86" font-size="13" font-weight="bold" fill="#f4b860" text-anchor="middle">2 Build</text>
  <text x="245" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">image tag git SHA</text>
  <text x="245" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">core + extensions</text>
  <text x="245" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">pinned, mu-plugin</text>
  <text x="245" y="170" font-size="12" fill="#9fd3c7" text-anchor="middle">push to ECR</text>
  <text x="245" y="186" font-size="12" fill="#9fd3c7" text-anchor="middle">through OIDC</text>

  <rect x="334" y="62" width="136" height="150" rx="9" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="2"/>
  <text x="402" y="86" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">3 Snapshot</text>
  <text x="402" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS manual snapshot</text>
  <text x="402" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-pre-</text>
  <text x="402" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">git SHA, waited for</text>
  <text x="402" y="170" font-size="12" fill="#f2f5f8" text-anchor="middle">the way back from</text>
  <text x="402" y="186" font-size="12" fill="#f2f5f8" text-anchor="middle">a committed change</text>

  <rect x="491" y="62" width="136" height="150" rx="9" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
  <text x="559" y="86" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">4 Migrate Job</text>
  <text x="559" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">pre-upgrade hook</text>
  <text x="559" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">wp wc update as</text>
  <text x="559" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">wc_migrate</text>
  <text x="559" y="170" font-size="12" fill="#f4b860" text-anchor="middle">code version must</text>
  <text x="559" y="186" font-size="12" fill="#f4b860" text-anchor="middle">equal db version</text>

  <rect x="648" y="62" width="136" height="150" rx="9" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="716" y="86" font-size="13" font-weight="bold" fill="#f4b860" text-anchor="middle">5 Roll out</text>
  <text x="716" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-web</text>
  <text x="716" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-worker</text>
  <text x="716" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-cron</text>
  <text x="716" y="170" font-size="12" fill="#9fd3c7" text-anchor="middle">rolling update,</text>
  <text x="716" y="186" font-size="12" fill="#9fd3c7" text-anchor="middle">PDB respected</text>

  <rect x="805" y="62" width="136" height="150" rx="9" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
  <text x="873" y="86" font-size="13" font-weight="bold" fill="#c9b3e6" text-anchor="middle">6 Verify</text>
  <text x="873" y="110" font-size="12" fill="#f2f5f8" text-anchor="middle">/shop/ answers</text>
  <text x="873" y="130" font-size="12" fill="#f2f5f8" text-anchor="middle">failed actions: 0</text>
  <text x="873" y="146" font-size="12" fill="#f2f5f8" text-anchor="middle">db-updates drained</text>
  <text x="873" y="170" font-size="12" fill="#f2f5f8" text-anchor="middle">wp wc hpos status</text>
  <text x="873" y="186" font-size="12" fill="#f2f5f8" text-anchor="middle">unchanged</text>

  <line x1="156" y1="137" x2="175" y2="137" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="313" y1="137" x2="332" y2="137" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="137" x2="489" y2="137" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="627" y1="137" x2="646" y2="137" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="784" y1="137" x2="803" y2="137" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <text x="30" y="250" font-size="15" font-weight="bold" fill="#f4b860">Ways back, from comfortable to costly</text>

  <rect x="20" y="266" width="300" height="140" rx="9" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
  <text x="170" y="290" font-size="13" font-weight="bold" fill="#9fd3c7" text-anchor="middle">helm rollback (image only)</text>
  <text x="170" y="314" font-size="12" fill="#f2f5f8" text-anchor="middle">Old image, old replicas, same database.</text>
  <text x="170" y="334" font-size="12" fill="#f2f5f8" text-anchor="middle">Works while the old code reads the new</text>
  <text x="170" y="350" font-size="12" fill="#f2f5f8" text-anchor="middle">schema. The Job does not run again, and</text>
  <text x="170" y="366" font-size="12" fill="#f2f5f8" text-anchor="middle">an older wp wc update would lower the</text>
  <text x="170" y="382" font-size="12" fill="#f2f5f8" text-anchor="middle">recorded database version.</text>

  <rect x="340" y="266" width="280" height="140" rx="9" fill="#33485c" stroke="#f4b860" stroke-width="2"/>
  <text x="480" y="290" font-size="13" font-weight="bold" fill="#f4b860" text-anchor="middle">Forward fix (usual answer)</text>
  <text x="480" y="314" font-size="12" fill="#f2f5f8" text-anchor="middle">New commit, new image, same gates.</text>
  <text x="480" y="334" font-size="12" fill="#f2f5f8" text-anchor="middle">WooCommerce database updates only move</text>
  <text x="480" y="350" font-size="12" fill="#f2f5f8" text-anchor="middle">forward, so the fix is another release</text>
  <text x="480" y="366" font-size="12" fill="#f2f5f8" text-anchor="middle">that is compatible with both shapes</text>
  <text x="480" y="382" font-size="12" fill="#f2f5f8" text-anchor="middle">of the data.</text>

  <rect x="640" y="266" width="300" height="140" rx="9" fill="#33485c" stroke="#c9b3e6" stroke-width="2"/>
  <text x="790" y="290" font-size="13" font-weight="bold" fill="#c9b3e6" text-anchor="middle">Restore the snapshot (last resort)</text>
  <text x="790" y="314" font-size="12" fill="#f2f5f8" text-anchor="middle">A new RDS instance, a new endpoint.</text>
  <text x="790" y="334" font-size="12" fill="#f2f5f8" text-anchor="middle">Orders placed after the snapshot are gone</text>
  <text x="790" y="350" font-size="12" fill="#f2f5f8" text-anchor="middle">from the database; payments are not.</text>
  <text x="790" y="366" font-size="12" fill="#f2f5f8" text-anchor="middle">Keep worker and cron at zero until the</text>
  <text x="790" y="382" font-size="12" fill="#f2f5f8" text-anchor="middle">gateway report is reconciled.</text>

  <line x1="559" y1="212" x2="170" y2="264" stroke="#f4b860" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <line x1="559" y1="212" x2="480" y2="264" stroke="#f4b860" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <line x1="559" y1="212" x2="790" y2="264" stroke="#f4b860" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="560" y="236" font-size="12" fill="#f4b860" text-anchor="middle">failure at gate 4, 5 or 6</text>

  <rect x="20" y="428" width="920" height="112" rx="9" fill="#2f4a44" stroke="#4d7c5a" stroke-width="2"/>
  <text x="36" y="452" font-size="13" font-weight="bold" fill="#9fd3c7">Why the order matters for a store</text>
  <text x="36" y="474" font-size="12" fill="#f2f5f8">The Job is the first process that boots WordPress with the new WooCommerce code: it creates the tables and records the new version.</text>
  <text x="36" y="492" font-size="12" fill="#f2f5f8">Web pods that still run the old image ignore a newer woocommerce_version. Customers keep ordering during gates 4 and 5.</text>
  <text x="36" y="510" font-size="12" fill="#f2f5f8">Every order written after the snapshot is lost by the last-resort path, which is why gate 1 keeps releases away from a campaign</text>
  <text x="36" y="528" font-size="12" fill="#f2f5f8">and gate 3 fixes the exact moment of the snapshot.</text>
</svg>
