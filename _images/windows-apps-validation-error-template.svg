<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf Desktop: edit book dialog with validation errors</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Original mock-up: Validation.HasError and Validation.Errors drive the red border and the message list</text>
  <rect x="20" y="62" width="470" height="344" rx="10" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <rect x="20" y="62" width="470" height="30" rx="10" fill="#1c4b73"/>
  <rect x="20" y="80" width="470" height="12" fill="#1c4b73"/>
  <text x="36" y="83" font-size="14" font-weight="bold" fill="#ffffff">Edit book</text>
  <text x="40" y="122" font-size="13" fill="#222222">Title</text>
  <rect x="120" y="106" width="340" height="26" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="124" font-size="13" fill="#888888">(empty)</text>
  <text x="127" y="148" font-size="11" fill="#a32a1c">! Title is required.</text>
  <text x="40" y="190" font-size="13" fill="#222222">ISBN</text>
  <rect x="120" y="174" width="340" height="26" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="192" font-size="13" fill="#222222">978-0-00-000000-1</text>
  <text x="127" y="216" font-size="11" fill="#a32a1c">! ISBN check digit is wrong.</text>
  <text x="127" y="231" font-size="11" fill="#a32a1c">! This ISBN is already in the library.</text>
  <text x="40" y="272" font-size="13" fill="#222222">Year</text>
  <rect x="120" y="256" width="120" height="26" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="130" y="274" font-size="13" fill="#222222">2026</text>
  <text x="40" y="312" font-size="13" fill="#222222">Pages</text>
  <rect x="120" y="296" width="120" height="26" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="314" font-size="13" fill="#222222">abc</text>
  <text x="127" y="338" font-size="11" fill="#a32a1c">! Value 'abc' could not be converted.</text>
  <rect x="270" y="364" width="90" height="28" rx="4" fill="#e6e6e6" stroke="#8a8a8a"/>
  <text x="315" y="383" font-size="13" fill="#777777" text-anchor="middle">Save</text>
  <rect x="372" y="364" width="90" height="28" rx="4" fill="#ffffff" stroke="#1c4b73"/>
  <text x="417" y="383" font-size="13" fill="#1c4b73" text-anchor="middle">Cancel</text>
  <text x="40" y="382" font-size="11" fill="#555555">Save is disabled while HasErrors is true</text>
  <rect x="510" y="62" width="232" height="344" rx="10" fill="#fdf8ee" stroke="#a07820" stroke-width="1.5"/>
  <text x="526" y="86" font-size="13" font-weight="bold" fill="#7a5a10">What the error template shows</text>
  <text x="526" y="112" font-size="12" fill="#333333">Adorner layer above the TextBox:</text>
  <text x="526" y="132" font-size="12" fill="#333333">- AdornedElementPlaceholder keeps</text>
  <text x="540" y="148" font-size="12" fill="#333333">the TextBox in place</text>
  <text x="526" y="168" font-size="12" fill="#333333">- red border drawn around it</text>
  <text x="526" y="188" font-size="12" fill="#333333">- ItemsControl lists every entry</text>
  <text x="540" y="204" font-size="12" fill="#333333">of Validation.Errors</text>
  <text x="526" y="236" font-size="12" font-weight="bold" fill="#7a5a10">Where each error comes from</text>
  <text x="526" y="258" font-size="12" fill="#333333">Title: DataAnnotations Required</text>
  <text x="526" y="276" font-size="12" fill="#333333">ISBN: custom rule + async check</text>
  <text x="540" y="292" font-size="12" fill="#333333">(INotifyDataErrorInfo)</text>
  <text x="526" y="312" font-size="12" fill="#333333">Pages: conversion exception</text>
  <text x="540" y="328" font-size="12" fill="#333333">(ValidatesOnExceptions)</text>
  <text x="526" y="356" font-size="12" fill="#333333">The template is rebuilt each time</text>
  <text x="526" y="372" font-size="12" fill="#333333">Validation.Errors changes.</text>
</svg>
