<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-arch-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">An event channel decouples the book from the score and the HUD</text>
<rect x="20" y="70" width="190" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Publisher</text>
<text x="115.0" y="114.0" text-anchor="middle" font-size="12" fill="#3730A3">Book.OnCaught()</text>
<text x="115.0" y="130.0" text-anchor="middle" font-size="12" fill="#3730A3">raises the channel</text>
<rect x="285" y="60" width="190" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="90.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Event channel</text>
<text x="380.0" y="106.0" text-anchor="middle" font-size="12" fill="#92400E">BookCaughtChannel</text>
<text x="380.0" y="122.0" text-anchor="middle" font-size="12" fill="#92400E">(ScriptableObject asset)</text>
<text x="380.0" y="138.0" text-anchor="middle" font-size="12" fill="#92400E">event Action&lt;Book&gt;</text>
<rect x="550" y="50" width="190" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="74.0" text-anchor="middle" font-size="12" fill="#1F2937">ScoreCounter</text>
<text x="645.0" y="90.0" text-anchor="middle" font-size="12" fill="#1F2937">adds points</text>
<rect x="550" y="120" width="190" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="144.0" text-anchor="middle" font-size="12" fill="#1F2937">HudPresenter</text>
<text x="645.0" y="160.0" text-anchor="middle" font-size="12" fill="#1F2937">updates the label</text>
<rect x="550" y="190" width="190" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="214.0" text-anchor="middle" font-size="12" fill="#1F2937">AudioCue</text>
<text x="645.0" y="230.0" text-anchor="middle" font-size="12" fill="#1F2937">plays a thump</text>
<line x1="210" y1="110" x2="285" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-event)"/>
<text x="248" y="100" text-anchor="middle" font-size="10" fill="#374151">Raise(book)</text>
<line x1="475" y1="110" x2="550" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-event)"/>
<line x1="475" y1="110" x2="550" y2="148" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-event)"/>
<line x1="475" y1="110" x2="550" y2="218" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-event)"/>
<text x="512" y="98" text-anchor="middle" font-size="10" fill="#374151">invoke</text>
<rect x="20" y="200" width="230" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="231.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Wiring</text>
<text x="135.0" y="246.0" text-anchor="middle" font-size="11" fill="#374151">Drag the same asset into the</text>
<text x="135.0" y="261.0" text-anchor="middle" font-size="11" fill="#374151">publisher and each listener.</text>
<text x="135.0" y="276.0" text-anchor="middle" font-size="11" fill="#374151">No scene reference between them.</text>
<rect x="285" y="200" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="238.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Listener rule</text>
<text x="380.0" y="253.5" text-anchor="middle" font-size="11" fill="#374151">OnEnable: channel.Raised += h</text>
<text x="380.0" y="268.5" text-anchor="middle" font-size="11" fill="#374151">OnDisable: channel.Raised -= h</text>
<line x1="380" y1="200" x2="380" y2="160" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-arch-event)"/>
<text x="380" y="335" text-anchor="middle" font-size="11" fill="#374151">Publishers know the channel, listeners know the channel, and neither knows the other.</text>
</svg>
