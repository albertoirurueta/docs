<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Layered defense for a WordPress site</title>
  <desc id="d">Requests from visitors, bots and attackers cross five nested layers before reaching the data. The edge (CDN or WAF, TLS and HSTS, global rate limits), the web server (limit_req on wp-login.php, XML-RPC denied, no PHP in uploads, security headers), WordPress itself (updates, few vetted plugins, DISALLOW_FILE_EDIT, must-use hardening plugins), accounts (bcrypt hashes, two-factor authentication, least-privilege roles, application passwords per tool) and data (least-privilege database user, unique salts, backups). Monitoring and incident response span every layer.</desc>
  <rect width="760" height="560" rx="12" fill="#2b3a4a"/>

  <g font-size="12" fill="#1b2733">
    <rect x="20" y="20" width="130" height="200" rx="8" fill="#f7d6d6"/>
    <text x="32" y="42" font-weight="bold">Incoming traffic</text>
    <text x="32" y="64">visitors</text>
    <text x="32" y="82">search engines</text>
    <text x="32" y="100">credential stuffing</text>
    <text x="32" y="118">vulnerability scans</text>
    <text x="32" y="136">XML-RPC abuse</text>
    <text x="32" y="154">user enumeration</text>
    <text x="32" y="172">exploit payloads</text>
    <text x="32" y="190">(XSS, SQLi, uploads)</text>

    <rect x="20" y="240" width="130" height="150" rx="8" fill="#f7d6d6"/>
    <text x="32" y="262" font-weight="bold">Supply chain</text>
    <text x="32" y="284">outdated plugins</text>
    <text x="32" y="302">abandoned plugins</text>
    <text x="32" y="320">nulled themes</text>
    <text x="32" y="338">changed ownership</text>
    <text x="32" y="356">stolen FTP/SSH</text>
    <text x="32" y="374">credentials</text>
  </g>

  <rect x="175" y="20" width="565" height="430" rx="12" fill="#cfe3f7"/>
  <rect x="200" y="82" width="515" height="350" rx="12" fill="#fbe5c8"/>
  <rect x="225" y="144" width="465" height="270" rx="12" fill="#d9ead3"/>
  <rect x="250" y="206" width="415" height="190" rx="12" fill="#e6dcf2"/>
  <rect x="275" y="268" width="365" height="110" rx="12" fill="#ffffff"/>

  <g font-size="12" fill="#1b2733">
    <text x="190" y="42" font-weight="bold">1. Edge: CDN or WAF</text>
    <text x="190" y="62">TLS and HSTS, bot challenges, global rate limits on login endpoints</text>
    <text x="215" y="104" font-weight="bold">2. Web server: nginx or Apache</text>
    <text x="215" y="124">limit_req, XML-RPC denied, no PHP in uploads, headers</text>
    <text x="240" y="166" font-weight="bold">3. WordPress: core, plugins, themes</text>
    <text x="240" y="186">updates, vetted plugins, DISALLOW_FILE_EDIT, mu-plugins</text>
    <text x="265" y="228" font-weight="bold">4. Accounts</text>
    <text x="265" y="248">bcrypt, two-factor, least roles, app passwords</text>
    <text x="290" y="290" font-weight="bold">5. Data</text>
    <text x="290" y="310">database user with SELECT, INSERT, UPDATE, DELETE</text>
    <text x="290" y="330">unique salts in wp-config.php (mode 400 or 440)</text>
    <text x="290" y="350">tested off-site backups of database and wp-content</text>
  </g>

  <rect x="175" y="470" width="565" height="70" rx="10" fill="#3d5266"/>
  <g font-size="12" fill="#ffffff">
    <text x="190" y="494" font-weight="bold">Monitoring and incident response, across every layer</text>
    <text x="190" y="516">logs, verify-checksums, activity log, uptime checks, vulnerability alerts</text>
    <text x="190" y="532">rotate salts and credentials, restore from a clean backup</text>
  </g>

  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M150 120 H168"/>
    <path d="M150 315 H168"/>
  </g>
  <g fill="#ffffff">
    <path d="M166 114 L175 120 L166 126 Z"/>
    <path d="M166 309 L175 315 L166 321 Z"/>
  </g>
</svg>
