<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A Pod containing an init sidecar container and two application containers sharing one network namespace and one volume</title>
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a Pod</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">one Pod IP and localhost, one shared volume, three containers with independent filesystems</text>

  <!-- Pod boundary -->
  <rect x="30" y="60" width="720" height="360" rx="8" fill="#f7f9fb" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="60" y="82" font-size="12.5" font-weight="bold" fill="#1c4b73">Pod/catalog-api-7d4b6c9f9c-x2p7q</text>
  <text x="700" y="82" font-size="10" fill="#555555" text-anchor="end">IP 10.244.1.12</text>

  <!-- shared network namespace band -->
  <rect x="50" y="96" width="680" height="34" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.1"/>
  <text x="390" y="118" font-size="10.5" fill="#1c4b73" text-anchor="middle">shared network namespace -- one IP, one port space, containers reach each other over localhost</text>

  <!-- init sidecar container -->
  <rect x="50" y="146" width="190" height="140" rx="6" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="145" y="166" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">log-shipper</text>
  <text x="145" y="180" font-size="9" fill="#333333" text-anchor="middle">init container</text>
  <text x="145" y="194" font-size="9" fill="#333333" text-anchor="middle">restartPolicy: Always</text>
  <text x="145" y="208" font-size="9" fill="#333333" text-anchor="middle">(native sidecar)</text>
  <text x="145" y="226" font-size="9" fill="#555555" text-anchor="middle">starts first,</text>
  <text x="145" y="240" font-size="9" fill="#555555" text-anchor="middle">stops last</text>
  <rect x="70" y="252" width="150" height="24" rx="3" fill="#ffffff" stroke="#9a5a12" stroke-width="1"/>
  <text x="145" y="268" font-size="9" fill="#333333" text-anchor="middle">own filesystem</text>

  <!-- main container 1 -->
  <rect x="270" y="146" width="220" height="140" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">catalog-api</text>
  <text x="380" y="180" font-size="9" fill="#333333" text-anchor="middle">main application container</text>
  <text x="380" y="194" font-size="9" fill="#333333" text-anchor="middle">listens on :8080</text>
  <text x="380" y="212" font-size="9" fill="#555555" text-anchor="middle">env, envFrom,</text>
  <text x="380" y="226" font-size="9" fill="#555555" text-anchor="middle">Downward API</text>
  <rect x="290" y="252" width="180" height="24" rx="3" fill="#ffffff" stroke="#2d6a34" stroke-width="1"/>
  <text x="380" y="268" font-size="9" fill="#333333" text-anchor="middle">own filesystem</text>

  <!-- main container 2 -->
  <rect x="540" y="146" width="190" height="140" rx="6" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="635" y="166" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">ambassador</text>
  <text x="635" y="180" font-size="9" fill="#333333" text-anchor="middle">ordinary container</text>
  <text x="635" y="194" font-size="9" fill="#333333" text-anchor="middle">proxies localhost:6379</text>
  <text x="635" y="212" font-size="9" fill="#555555" text-anchor="middle">to the real</text>
  <text x="635" y="226" font-size="9" fill="#555555" text-anchor="middle">Redis backend</text>
  <rect x="560" y="252" width="150" height="24" rx="3" fill="#ffffff" stroke="#5b3a8c" stroke-width="1"/>
  <text x="635" y="268" font-size="9" fill="#333333" text-anchor="middle">own filesystem</text>

  <!-- shared volume -->
  <rect x="50" y="330" width="680" height="66" rx="6" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="390" y="350" font-size="11" font-weight="bold" fill="#1f6b6b" text-anchor="middle">volumes: logs (emptyDir)</text>
  <text x="390" y="366" font-size="9.5" fill="#333333" text-anchor="middle">mounted read-write by log-shipper and read-write by catalog-api at /var/log/bookshelf</text>
  <text x="390" y="382" font-size="9.5" fill="#666666" text-anchor="middle">outlives a container restart, not the Pod itself</text>

  <!-- mount lines -->
  <line x1="145" y1="286" x2="145" y2="330" stroke="#9a5a12" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="380" y1="286" x2="380" y2="330" stroke="#2d6a34" stroke-width="1.4" stroke-dasharray="4,3"/>
</svg>
