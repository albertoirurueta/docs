<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">A z/OS system</title>
  <desc id="d">A developer workstation reaches a z/OS LPAR on an IBM Z machine through TN3270 and Zowe. Inside the LPAR, JES2, TSO/E, CICS, Db2, IMS and z/OS UNIX run as address spaces above the data sets, VSAM clusters, catalog and spool.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933">

    <!-- workstation -->
    <rect x="20" y="70" width="190" height="400" rx="10" fill="#f1f3f5" stroke="#37474f" stroke-width="2"/>
    <text x="115" y="96" text-anchor="middle" font-weight="bold" font-size="15">Developer workstation</text>
    <rect x="36" y="116" width="158" height="62" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="115" y="142" text-anchor="middle">3270 terminal</text>
    <text x="115" y="162" text-anchor="middle">emulator (ISPF)</text>
    <rect x="36" y="196" width="158" height="62" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="115" y="222" text-anchor="middle">VS Code with</text>
    <text x="115" y="242" text-anchor="middle">Z Open Editor</text>
    <rect x="36" y="276" width="158" height="62" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="115" y="302" text-anchor="middle">Zowe CLI and</text>
    <text x="115" y="322" text-anchor="middle">Zowe Explorer</text>
    <rect x="36" y="356" width="158" height="62" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="115" y="382" text-anchor="middle">GnuCOBOL and Git</text>
    <text x="115" y="402" text-anchor="middle">(local, not z/OS)</text>
    <text x="115" y="450" text-anchor="middle" font-size="12" fill="#52606d">ASCII side</text>

    <!-- network arrows -->
    <line x1="210" y1="147" x2="300" y2="147" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="255" y="138" text-anchor="middle" font-size="12">TN3270</text>
    <line x1="210" y1="307" x2="300" y2="307" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="255" y="283" text-anchor="middle" font-size="12">Zowe</text>
    <text x="255" y="298" text-anchor="middle" font-size="12">z/OSMF REST</text>

    <!-- IBM Z machine -->
    <rect x="300" y="20" width="640" height="560" rx="12" fill="#eef2f7" stroke="#37474f" stroke-width="2.5"/>
    <text x="320" y="46" font-weight="bold" font-size="15">IBM Z machine (z16, z17 and earlier generations)</text>

    <!-- LPAR -->
    <rect x="316" y="62" width="608" height="396" rx="10" fill="#e3ecf8" stroke="#1e5aa8" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="332" y="88" font-weight="bold" font-size="15">LPAR (logical partition) running z/OS</text>
    <text x="908" y="88" text-anchor="end" font-size="12" fill="#52606d">other LPARs: test, production, Linux</text>

    <!-- address spaces -->
    <rect x="332" y="104" width="116" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="390" y="130" text-anchor="middle" font-weight="bold">JES2</text>
    <text x="390" y="150" text-anchor="middle" font-size="12">job entry,</text>
    <text x="390" y="166" text-anchor="middle" font-size="12">initiators, spool</text>
    <rect x="460" y="104" width="116" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="518" y="130" text-anchor="middle" font-weight="bold">TSO/E</text>
    <text x="518" y="150" text-anchor="middle" font-size="12">ISPF, SDSF,</text>
    <text x="518" y="166" text-anchor="middle" font-size="12">one per user</text>
    <rect x="588" y="104" width="116" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="646" y="130" text-anchor="middle" font-weight="bold">CICS</text>
    <text x="646" y="150" text-anchor="middle" font-size="12">online region,</text>
    <text x="646" y="166" text-anchor="middle" font-size="12">transaction CINQ</text>
    <rect x="716" y="104" width="96" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="764" y="130" text-anchor="middle" font-weight="bold">Db2</text>
    <text x="764" y="150" text-anchor="middle" font-size="12">table LOAN</text>
    <rect x="824" y="104" width="86" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="867" y="130" text-anchor="middle" font-weight="bold">IMS</text>
    <text x="867" y="150" text-anchor="middle" font-size="12">hierarchical</text>
    <text x="867" y="166" text-anchor="middle" font-size="12">databases</text>

    <!-- batch jobs and USS -->
    <rect x="332" y="194" width="260" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="462" y="220" text-anchor="middle" font-weight="bold">Batch job address space</text>
    <text x="462" y="240" text-anchor="middle" font-size="12">compile and link, then the nightly</text>
    <text x="462" y="256" text-anchor="middle" font-size="12">run: sort, update, report</text>
    <rect x="604" y="194" width="306" height="74" rx="6" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="757" y="220" text-anchor="middle" font-weight="bold">z/OS UNIX System Services (USS)</text>
    <text x="757" y="240" text-anchor="middle" font-size="12">hierarchical file system, shell,</text>
    <text x="757" y="256" text-anchor="middle" font-size="12">Zowe and z/OSMF servers</text>

    <!-- z/OS base -->
    <rect x="332" y="284" width="578" height="52" rx="6" fill="#cfe0f5" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="621" y="308" text-anchor="middle" font-weight="bold">z/OS base: Language Environment (LE), security (RACF or equivalent), DFSMS</text>
    <text x="621" y="326" text-anchor="middle" font-size="12">EBCDIC is the native character encoding of everything above</text>

    <!-- arrows down -->
    <line x1="462" y1="270" x2="462" y2="282" stroke="#37474f" stroke-width="1.5"/>

    <!-- storage -->
    <rect x="332" y="352" width="578" height="90" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="344" y="372" font-weight="bold">Data (DASD volumes)</text>
    <rect x="344" y="382" width="126" height="48" rx="4" fill="#f1f3f5" stroke="#546e7a"/>
    <text x="407" y="402" text-anchor="middle" font-size="12">Sequential data sets</text>
    <text x="407" y="418" text-anchor="middle" font-size="12">and GDGs</text>
    <rect x="478" y="382" width="126" height="48" rx="4" fill="#f1f3f5" stroke="#546e7a"/>
    <text x="541" y="402" text-anchor="middle" font-size="12">PDS and PDSE</text>
    <text x="541" y="418" text-anchor="middle" font-size="12">libraries, members</text>
    <rect x="612" y="382" width="126" height="48" rx="4" fill="#f1f3f5" stroke="#546e7a"/>
    <text x="675" y="402" text-anchor="middle" font-size="12">VSAM clusters</text>
    <text x="675" y="418" text-anchor="middle" font-size="12">(KSDS, ESDS, RRDS)</text>
    <rect x="746" y="382" width="74" height="48" rx="4" fill="#f1f3f5" stroke="#546e7a"/>
    <text x="783" y="402" text-anchor="middle" font-size="12">Catalog</text>
    <text x="783" y="418" text-anchor="middle" font-size="12">(ICF)</text>
    <rect x="828" y="382" width="74" height="48" rx="4" fill="#f1f3f5" stroke="#546e7a"/>
    <text x="865" y="402" text-anchor="middle" font-size="12">JES2</text>
    <text x="865" y="418" text-anchor="middle" font-size="12">spool</text>

    <line x1="621" y1="338" x2="621" y2="350" stroke="#37474f" stroke-width="1.5"/>

    <!-- footer -->
    <text x="620" y="486" text-anchor="middle" font-size="12.5" fill="#1f2933">Address spaces use access methods to reach data sets; the catalog maps a name to a volume.</text>
    <rect x="316" y="506" width="608" height="56" rx="8" fill="#fff8e1" stroke="#a67c00" stroke-width="1.5"/>
    <text x="620" y="530" text-anchor="middle" font-size="13">Conceptual sketch for orientation only. The z/OS content of these pages is not run here:</text>
    <text x="620" y="548" text-anchor="middle" font-size="13">it is checked statement by statement against IBM documentation.</text>
  </g>
</svg>
