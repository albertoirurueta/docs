<svg viewBox="0 0 720 502" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Bookshelf blueprint tree with URL prefixes</title>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The Bookshelf blueprint tree</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">each blueprint adds a URL prefix and an endpoint prefix to one application</text>
  <rect x="30" y="56" width="660" height="30" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="360" y="76" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">app = create_app(): one Flask application, one URL map, one config</text>
  <line x1="44" y1="86" x2="44" y2="458" stroke="currentColor" stroke-width="1.5"/>
  <line x1="44" y1="122" x2="56" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="100" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="119" font-size="14" font-weight="bold" fill="currentColor">core</text>
  <text x="174" y="119" font-size="11.5" fill="currentColor">URL prefix: none  |  endpoints: core.*</text>
  <text x="68" y="136" font-size="11" fill="currentColor" opacity="0.9">home page; app-wide hooks: before_app_request, app_errorhandler, app_context_processor</text>
  <line x1="44" y1="178" x2="56" y2="178" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="156" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="175" font-size="14" font-weight="bold" fill="currentColor">catalog</text>
  <text x="174" y="175" font-size="11.5" fill="currentColor">URL prefix: /books  |  endpoints: catalog.*</text>
  <text x="68" y="192" font-size="11" fill="currentColor" opacity="0.9">own templates folder (catalog/); /books/ and /books/&lt;isbn&gt;</text>
  <line x1="44" y1="234" x2="56" y2="234" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="212" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="231" font-size="14" font-weight="bold" fill="currentColor">auth</text>
  <text x="174" y="231" font-size="11.5" fill="currentColor">URL prefix: /auth  |  endpoints: auth.*</text>
  <text x="68" y="248" font-size="11" fill="currentColor" opacity="0.9">login and logout; own templates and forms</text>
  <line x1="44" y1="290" x2="56" y2="290" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="268" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="287" font-size="14" font-weight="bold" fill="currentColor">admin</text>
  <text x="174" y="287" font-size="11.5" fill="currentColor">URL prefix: /admin  |  endpoints: admin.*</text>
  <text x="68" y="304" font-size="11" fill="currentColor" opacity="0.9">own templates and own static folder, served at /admin/static/&lt;path&gt;</text>
  <line x1="44" y1="346" x2="56" y2="346" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="324" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="343" font-size="14" font-weight="bold" fill="currentColor">api</text>
  <text x="174" y="343" font-size="11.5" fill="currentColor">URL prefix: /api  |  endpoints: api.*</text>
  <text x="68" y="360" font-size="11" fill="currentColor" opacity="0.9">JSON for the single-page app; its error handlers return JSON</text>
  <line x1="44" y1="402" x2="96" y2="402" stroke="currentColor" stroke-width="1.5"/>
  <rect x="96" y="380" width="594" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="108" y="399" font-size="14" font-weight="bold" fill="currentColor">v1</text>
  <text x="214" y="399" font-size="11.5" fill="currentColor">URL prefix: /v1  |  endpoints: api.v1.*</text>
  <text x="108" y="416" font-size="11" fill="currentColor" opacity="0.9">nested in api: /api/v1/books, built with url_for('api.v1.list_books')</text>
  <line x1="44" y1="458" x2="56" y2="458" stroke="currentColor" stroke-width="1.5"/>
  <rect x="56" y="436" width="634" height="44" rx="6" fill="#808080" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="68" y="455" font-size="14" font-weight="bold" fill="currentColor">pages</text>
  <text x="174" y="455" font-size="11.5" fill="currentColor">URL prefix: /en and /es  |  endpoints: pages_en.* and pages_es.*</text>
  <text x="68" y="472" font-size="11" fill="currentColor" opacity="0.9">one blueprint registered twice, with name= and url_defaults</text>
</svg>
