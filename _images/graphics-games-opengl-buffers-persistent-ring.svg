<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-buffers-persistent-ring" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Persistent mapping: a triple-buffered ring</text>
<text x="380" y="52" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">glBufferStorage(... GL_MAP_WRITE_BIT | GL_MAP_PERSISTENT_BIT | GL_MAP_COHERENT_BIT)</text>
<rect x="40" y="80" width="210" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="145.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Region 0</text>
<text x="145.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU writes frame N</text>
<rect x="270" y="80" width="210" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="375.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Region 1</text>
<text x="375.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU reads frame N-1</text>
<rect x="500" y="80" width="210" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="605.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Region 2</text>
<text x="605.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU reads frame N-2</text>
<text x="380" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one persistent pointer returned by glMapBufferRange, never unmapped</text>
<rect x="40" y="200" width="330" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="205.0" y="228.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Frame N: write region (N mod 3)</text>
<text x="205.0" y="243.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">draw with an offset into the buffer</text>
<rect x="390" y="200" width="330" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="555.0" y="228.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">After the draw: glFenceSync(...)</text>
<text x="555.0" y="243.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">before reusing the region: glClientWaitSync</text>
<rect x="40" y="286" width="680" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Without COHERENT: glFlushMappedBufferRange after writing the region</text>
<text x="380.0" y="324.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Never write a region the GPU may still read: the classic persistent-mapping bug</text>
</svg>
