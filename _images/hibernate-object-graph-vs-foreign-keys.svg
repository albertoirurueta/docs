<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Object graph (left) vs. foreign keys and join table (right)</text>

  <!-- Left: object graph -->
  <text x="180" y="55" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">In-memory object graph</text>

  <rect x="100" y="70" width="160" height="55" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="180" y="93" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Author</text>
  <text x="180" y="112" font-size="10.5" fill="#1c4b73" text-anchor="middle">books: List&lt;Book&gt;</text>

  <rect x="100" y="170" width="160" height="55" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="180" y="193" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Book</text>
  <text x="180" y="212" font-size="10.5" fill="#2f5424" text-anchor="middle">author: Author</text>

  <rect x="60" y="270" width="100" height="50" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="110" y="300" font-size="11.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Category A</text>
  <rect x="200" y="270" width="100" height="50" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="250" y="300" font-size="11.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Category B</text>
  <text x="180" y="345" font-size="10.5" fill="#8a3d10" text-anchor="middle">Book.categories: Set&lt;Category&gt;</text>

  <line x1="180" y1="125" x2="180" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="225" x2="115" y2="270" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="225" x2="245" y2="270" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="380" y1="45" x2="380" y2="400" stroke="#cccccc" stroke-width="1"/>

  <!-- Right: relational tables -->
  <text x="580" y="55" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Relational tables</text>

  <rect x="480" y="70" width="200" height="55" rx="4" fill="#eef3f8" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="580" y="90" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">author</text>
  <text x="580" y="108" font-size="10.5" fill="#1c4b73" text-anchor="middle">id (PK)</text>

  <rect x="480" y="170" width="200" height="65" rx="4" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="580" y="190" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">book</text>
  <text x="580" y="207" font-size="10.5" fill="#2f5424" text-anchor="middle">id (PK)</text>
  <text x="580" y="223" font-size="10.5" fill="#2f5424" text-anchor="middle">author_id (FK -&gt; author.id)</text>

  <rect x="440" y="280" width="110" height="50" rx="4" fill="#fbf1e4" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="495" y="310" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">category</text>

  <rect x="590" y="280" width="140" height="65" rx="4" fill="#fbf1e4" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="660" y="298" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">book_category</text>
  <text x="660" y="315" font-size="10" fill="#8a3d10" text-anchor="middle">book_id (FK)</text>
  <text x="660" y="330" font-size="10" fill="#8a3d10" text-anchor="middle">category_id (FK)</text>

  <line x1="580" y1="125" x2="580" y2="170" stroke="#444444" stroke-width="1.5"/>
  <line x1="580" y1="235" x2="620" y2="280" stroke="#444444" stroke-width="1.5"/>
  <line x1="620" y1="305" x2="590" y2="305" stroke="#444444" stroke-width="1.5"/>

  <text x="380" y="390" font-size="11.5" fill="#444444" text-anchor="middle">One directional reference each way becomes one undirected foreign key;</text>
  <text x="380" y="405" font-size="11.5" fill="#444444" text-anchor="middle">the many-to-many association becomes a join table with no object-model counterpart.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444444"/>
    </marker>
  </defs>
</svg>
