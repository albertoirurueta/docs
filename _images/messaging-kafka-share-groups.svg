<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Partition-exclusive vs. record-level cooperative consumption</text>
  <text x="380" y="42" font-size="10.5" fill="#666666" text-anchor="middle">topic "orders", 4 partitions -- a consumer group assigns whole partitions; a share group acquires individual records</text>

  <!-- Topic outer box -->
  <rect x="20" y="76" width="150" height="300" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="95" y="96" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Topic: orders</text>

  <rect x="33" y="108" width="124" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="95" y="139" font-size="11.5" fill="#222222" text-anchor="middle">Partition 0</text>

  <rect x="33" y="170" width="124" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="95" y="201" font-size="11.5" fill="#222222" text-anchor="middle">Partition 1</text>

  <rect x="33" y="232" width="124" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="95" y="263" font-size="11.5" fill="#222222" text-anchor="middle">Partition 2</text>

  <rect x="33" y="294" width="124" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="95" y="325" font-size="11.5" fill="#222222" text-anchor="middle">Partition 3</text>

  <!-- Consumer Group box (partition-exclusive) -->
  <rect x="255" y="76" width="200" height="300" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="355" y="96" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer Group</text>
  <text x="355" y="110" font-size="9.5" fill="#555555" text-anchor="middle">partition-exclusive assignment</text>

  <rect x="270" y="122" width="170" height="106" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="355" y="146" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer 1</text>
  <text x="355" y="163" font-size="10" fill="#333333" text-anchor="middle">owns Partition 0</text>
  <text x="355" y="178" font-size="10" fill="#333333" text-anchor="middle">owns Partition 1</text>
  <text x="355" y="196" font-size="9" fill="#777777" text-anchor="middle">(exclusively, until</text>
  <text x="355" y="209" font-size="9" fill="#777777" text-anchor="middle">a rebalance)</text>

  <rect x="270" y="250" width="170" height="106" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="355" y="274" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer 2</text>
  <text x="355" y="291" font-size="10" fill="#333333" text-anchor="middle">owns Partition 2</text>
  <text x="355" y="306" font-size="10" fill="#333333" text-anchor="middle">owns Partition 3</text>
  <text x="355" y="324" font-size="9" fill="#777777" text-anchor="middle">(exclusively, until</text>
  <text x="355" y="337" font-size="9" fill="#777777" text-anchor="middle">a rebalance)</text>

  <!-- 1:1 arrows consumer group -->
  <line x1="157" y1="135" x2="270" y2="150" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowCG)"/>
  <line x1="157" y1="197" x2="270" y2="180" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowCG)"/>
  <line x1="157" y1="259" x2="270" y2="278" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowCG)"/>
  <line x1="157" y1="321" x2="270" y2="308" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowCG)"/>

  <!-- Share Group box (record-level cooperative) -->
  <rect x="530" y="76" width="210" height="300" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="635" y="96" font-size="12" font-weight="bold" fill="#a33333" text-anchor="middle">Share Group</text>
  <text x="635" y="110" font-size="9.5" fill="#555555" text-anchor="middle">record-level cooperative acquisition</text>

  <rect x="545" y="122" width="180" height="60" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="635" y="144" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer A</text>
  <text x="635" y="160" font-size="9.5" fill="#333333" text-anchor="middle">acquires records from any partition</text>

  <rect x="545" y="192" width="180" height="60" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="635" y="214" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer B</text>
  <text x="635" y="230" font-size="9.5" fill="#333333" text-anchor="middle">acquires records from any partition</text>

  <rect x="545" y="262" width="180" height="60" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="635" y="284" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer C</text>
  <text x="635" y="300" font-size="9.5" fill="#333333" text-anchor="middle">acquires records from any partition</text>

  <text x="635" y="345" font-size="9" fill="#777777" text-anchor="middle">each record: an acquisition lock,</text>
  <text x="635" y="358" font-size="9" fill="#777777" text-anchor="middle">then ACCEPT / RELEASE / REJECT</text>

  <!-- crossing dashed arrows: every partition to every consumer -->
  <line x1="157" y1="135" x2="545" y2="152" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="135" x2="545" y2="222" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="197" x2="545" y2="152" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="197" x2="545" y2="292" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="259" x2="545" y2="222" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="259" x2="545" y2="292" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="321" x2="545" y2="152" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>
  <line x1="157" y1="321" x2="545" y2="292" stroke="#a33333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowSG)"/>

  <defs>
    <marker id="arrowCG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowSG" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#a33333"/>
    </marker>
  </defs>

  <text x="30" y="398" font-size="10.5" fill="#666666">Consumer Group: each partition is owned by exactly one consumer -- parallelism is capped at 4 partitions.</text>
  <text x="30" y="414" font-size="10.5" fill="#666666">Share Group: any consumer may acquire a record from any partition under a time-limited lock -- a 5th or 6th</text>
  <text x="30" y="428" font-size="10.5" fill="#666666">worker keeps adding throughput, and one bad record only blocks itself, not the records behind it.</text>
</svg>
