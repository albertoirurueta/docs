<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From commit to Marketplace listing</title>
<desc id="d">Six stages of a WooCommerce extension release: commit and tag, continuous integration, building a clean zip, the QIT managed tests, the submission in the vendor dashboard, and the Marketplace review. The first three were executed locally; the last three need a Woo.com partner account.</desc>
<rect width="1100" height="320" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">From commit to Marketplace listing: what ran here and what needs an account</text>
<rect x="30" y="70" width="160" height="170" rx="10" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="110.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">1  Commit</text>
<text x="110.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Git branch, tag v0.1.0</text>
<text x="110.0" y="143" font-size="11" fill="#7fb3e6" text-anchor="middle">Version in header and</text>
<text x="110.0" y="157" font-size="11" fill="#7fb3e6" text-anchor="middle">readme match</text>
<text x="110.0" y="228" font-size="11.5" font-weight="bold" fill="#8fd18f" text-anchor="middle">ran: git archive</text>
<polygon points="193,149.0 207,155.0 193,161.0" fill="#7fb3e6"/>
<rect x="210" y="70" width="160" height="170" rx="10" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="290.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">2  CI</text>
<text x="290.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">phpcs, phpunit matrix,</text>
<text x="290.0" y="137" font-size="11.5" fill="#f2f5f8" text-anchor="middle">e2e</text>
<text x="290.0" y="158" font-size="11" fill="#7fb3e6" text-anchor="middle">PHP 7.4 and 8.3; WP</text>
<text x="290.0" y="172" font-size="11" fill="#7fb3e6" text-anchor="middle">7.0 and latest</text>
<text x="290.0" y="228" font-size="11.5" font-weight="bold" fill="#8fd18f" text-anchor="middle">ran locally, workflow parsed</text>
<polygon points="373,149.0 387,155.0 373,161.0" fill="#7fb3e6"/>
<rect x="390" y="70" width="160" height="170" rx="10" fill="#2f6b6b" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="470.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">3  Build zip</text>
<text x="470.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">git archive or rsync</text>
<text x="470.0" y="137" font-size="11.5" fill="#f2f5f8" text-anchor="middle">.distignore</text>
<text x="470.0" y="158" font-size="11" fill="#7fb3e6" text-anchor="middle">No tests, no dev</text>
<text x="470.0" y="172" font-size="11" fill="#7fb3e6" text-anchor="middle">files, one folder</text>
<text x="470.0" y="228" font-size="11.5" font-weight="bold" fill="#8fd18f" text-anchor="middle">ran: zip validated</text>
<polygon points="553,149.0 567,155.0 553,161.0" fill="#7fb3e6"/>
<rect x="570" y="70" width="160" height="170" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="650.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">4  QIT</text>
<text x="650.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">security, activation,</text>
<text x="650.0" y="137" font-size="11.5" fill="#f2f5f8" text-anchor="middle">phpcompatibility,</text>
<text x="650.0" y="152" font-size="11.5" fill="#f2f5f8" text-anchor="middle">malware, validation,</text>
<text x="650.0" y="167" font-size="11.5" fill="#f2f5f8" text-anchor="middle">woo-api, woo-e2e</text>
<text x="650.0" y="188" font-size="11" fill="#7fb3e6" text-anchor="middle">Needs qit connect</text>
<text x="650.0" y="228" font-size="11.5" font-weight="bold" fill="#f4b860" text-anchor="middle">not run: partner account</text>
<polygon points="733,149.0 747,155.0 733,161.0" fill="#7fb3e6"/>
<rect x="750" y="70" width="160" height="170" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="830.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">5  Submission</text>
<text x="830.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Vendor dashboard</text>
<text x="830.0" y="137" font-size="11.5" fill="#f2f5f8" text-anchor="middle">upload</text>
<text x="830.0" y="158" font-size="11" fill="#7fb3e6" text-anchor="middle">Failed test: Changes</text>
<text x="830.0" y="172" font-size="11" fill="#7fb3e6" text-anchor="middle">required, replace zip</text>
<text x="830.0" y="228" font-size="11.5" font-weight="bold" fill="#f4b860" text-anchor="middle">not run: partner account</text>
<polygon points="913,149.0 927,155.0 913,161.0" fill="#7fb3e6"/>
<rect x="930" y="70" width="160" height="170" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="1010.0" y="98" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">6  Review</text>
<text x="1010.0" y="122" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Business, code, UX,</text>
<text x="1010.0" y="137" font-size="11.5" fill="#f2f5f8" text-anchor="middle">launch</text>
<text x="1010.0" y="158" font-size="11" fill="#7fb3e6" text-anchor="middle">Decision within 30</text>
<text x="1010.0" y="172" font-size="11" fill="#7fb3e6" text-anchor="middle">days of business</text>
<text x="1010.0" y="186" font-size="11" fill="#7fb3e6" text-anchor="middle">review</text>
<text x="1010.0" y="228" font-size="11.5" font-weight="bold" fill="#f4b860" text-anchor="middle">not run: Marketplace team</text>
<text x="30" y="280" font-size="12.5" fill="#f2f5f8">Green: executed on the local WordPress 7.1.3 and WooCommerce 11.2.1 stack. Orange: documented from the official pages, not executed.</text>
<text x="30" y="300" font-size="12.5" fill="#f2f5f8">Hard gates of the Marketplace: HPOS compatibility declared, support for the two latest WordPress and WooCommerce majors, accessibility coding standards.</text>
</svg>
