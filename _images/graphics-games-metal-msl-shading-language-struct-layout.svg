<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-struct-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Why float3 needs care: size, alignment and padding</text>
<text x="20" y="66" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">struct A { float3 a; float b; }  (MSL, 32 bytes, 12 px per byte)</text>
<rect x="20" y="76" width="192" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="116.0" y="95.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">float3 a: 12 + 4 padding</text>
<rect x="212" y="76" width="48" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="236.0" y="95.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">float b</text>
<rect x="260" y="76" width="144" height="34" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="332.0" y="95.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">12 bytes padding</text>
<text x="414" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<text x="20" y="146" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">struct B { packed_float3 a; float b; }  (16 bytes, 12 px per byte)</text>
<rect x="20" y="156" width="144" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="92.0" y="175.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">packed_float3 a: 12</text>
<rect x="164" y="156" width="48" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="188.0" y="175.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">float b</text>
<text x="222" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">a is 4-byte aligned, no padding</text>
<text x="20" y="226" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">struct C { float4x4 m; float3 d; }  (80 bytes, 6 px per byte)</text>
<rect x="20" y="236" width="384" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="212.0" y="255.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">float4x4 m: 64 bytes, 16-byte aligned</text>
<rect x="404" y="236" width="96" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="452.0" y="255.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">float3 d: 12 + 4</text>
<text x="510" y="258" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<rect x="20" y="290" width="720" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="327.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Rules of thumb</text>
<text x="380.0" y="341.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Swift SIMD3&lt;Float&gt; has a 16-byte stride, like MSL float3 (not packed_float3).</text>
<text x="380.0" y="355.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A buffer of 12-byte [Float] triples needs packed_float3 or a vertex descriptor.</text>
<text x="380.0" y="369.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">One struct in the shared header plus SHARED_ASSERT avoids the mismatch.</text>
</svg>
