<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Multi-Dimensional Scaling: Couchbase services placed per node</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">One cluster, four nodes &#8212; every node runs Data; the other services are placed independently</text>

  <rect x="14" y="60" width="732" height="292" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="740" y="74" font-size="10" fill="#999999" text-anchor="end">one cluster</text>

  <!-- Node 1: data + query -->
  <g font-family="'Courier New', monospace">
    <rect x="24" y="80" width="158" height="262" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="40" y="104" font-size="14" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">Node 1</text>
    <text x="40" y="121" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">data + query</text>
    <circle cx="42" cy="146" r="5" fill="#2f5424"/><text x="56" y="150" font-size="12" fill="#222222">Data</text>
    <circle cx="42" cy="174" r="5" fill="#1c4b73"/><text x="56" y="178" font-size="12" fill="#222222">Index</text>
    <circle cx="42" cy="202" r="5" fill="#1c4b73"/><text x="56" y="206" font-size="12" fill="#222222">Query</text>
    <circle cx="42" cy="230" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="56" y="234" font-size="12" fill="#999999">Search</text>
    <circle cx="42" cy="258" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="56" y="262" font-size="12" fill="#999999">Analytics</text>
    <circle cx="42" cy="286" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="56" y="290" font-size="12" fill="#999999">Eventing</text>
  </g>

  <!-- Node 2: data + query -->
  <g font-family="'Courier New', monospace">
    <rect x="208" y="80" width="158" height="262" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="224" y="104" font-size="14" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">Node 2</text>
    <text x="224" y="121" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">data + query</text>
    <circle cx="226" cy="146" r="5" fill="#2f5424"/><text x="240" y="150" font-size="12" fill="#222222">Data</text>
    <circle cx="226" cy="174" r="5" fill="#1c4b73"/><text x="240" y="178" font-size="12" fill="#222222">Index</text>
    <circle cx="226" cy="202" r="5" fill="#1c4b73"/><text x="240" y="206" font-size="12" fill="#222222">Query</text>
    <circle cx="226" cy="230" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="240" y="234" font-size="12" fill="#999999">Search</text>
    <circle cx="226" cy="258" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="240" y="262" font-size="12" fill="#999999">Analytics</text>
    <circle cx="226" cy="286" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="240" y="290" font-size="12" fill="#999999">Eventing</text>
  </g>

  <!-- Node 3: data + search -->
  <g font-family="'Courier New', monospace">
    <rect x="392" y="80" width="158" height="262" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="408" y="104" font-size="14" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">Node 3</text>
    <text x="408" y="121" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">data + search</text>
    <circle cx="410" cy="146" r="5" fill="#2f5424"/><text x="424" y="150" font-size="12" fill="#222222">Data</text>
    <circle cx="410" cy="174" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="424" y="178" font-size="12" fill="#999999">Index</text>
    <circle cx="410" cy="202" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="424" y="206" font-size="12" fill="#999999">Query</text>
    <circle cx="410" cy="230" r="5" fill="#1c4b73"/><text x="424" y="234" font-size="12" fill="#222222">Search</text>
    <circle cx="410" cy="258" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="424" y="262" font-size="12" fill="#999999">Analytics</text>
    <circle cx="410" cy="286" r="5" fill="#1c4b73"/><text x="424" y="290" font-size="12" fill="#222222">Eventing</text>
  </g>

  <!-- Node 4: data + analytics -->
  <g font-family="'Courier New', monospace">
    <rect x="576" y="80" width="158" height="262" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="592" y="104" font-size="14" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">Node 4</text>
    <text x="592" y="121" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">data + analytics</text>
    <circle cx="594" cy="146" r="5" fill="#2f5424"/><text x="608" y="150" font-size="12" fill="#222222">Data</text>
    <circle cx="594" cy="174" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="608" y="178" font-size="12" fill="#999999">Index</text>
    <circle cx="594" cy="202" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="608" y="206" font-size="12" fill="#999999">Query</text>
    <circle cx="594" cy="230" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="608" y="234" font-size="12" fill="#999999">Search</text>
    <circle cx="594" cy="258" r="5" fill="#1c4b73"/><text x="608" y="262" font-size="12" fill="#222222">Analytics</text>
    <circle cx="594" cy="286" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/><text x="608" y="290" font-size="12" fill="#999999">Eventing</text>
  </g>

  <!-- legend -->
  <circle cx="30" cy="374" r="5" fill="#2f5424"/>
  <text x="44" y="378" font-size="11" fill="#222222">Data service &#8212; runs on every node (KV store, vBuckets, replication)</text>
  <circle cx="30" cy="396" r="5" fill="#1c4b73"/>
  <text x="44" y="400" font-size="11" fill="#222222">other service &#8212; placed on a chosen subset of nodes</text>
  <circle cx="30" cy="418" r="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="44" y="422" font-size="11" fill="#999999">service not running on that node</text>

  <text x="30" y="446" font-size="10.5" fill="#444444">MDS &#8226; add Data nodes for dataset size or replicas; add Query, Index, Search, Analytics or Eventing nodes for each service's own load.</text>
</svg>
