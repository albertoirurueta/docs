<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Spring Boot Redis caching: the layers behind @Cacheable</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Each layer delegates to the one below it; application code only ever talks to the top layer</text>

  <!-- Layer 1: Spring Cache abstraction -->
  <rect x="130" y="66" width="500" height="56" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.4" rx="4"/>
  <text x="380" y="90" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Spring Cache abstraction</text>
  <text x="380" y="108" font-size="11" fill="#3a4a55" text-anchor="middle">@Cacheable / @CachePut / @CacheEvict (BookCatalogService)</text>

  <line x1="380" y1="122" x2="380" y2="136" stroke="#999999" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Layer 2: RedisCacheManager -->
  <rect x="130" y="136" width="500" height="56" fill="#f3ecf9" stroke="#5b3b7a" stroke-width="1.4" rx="4"/>
  <text x="380" y="160" font-size="14" font-weight="bold" fill="#5b3b7a" text-anchor="middle">RedisCacheManager</text>
  <text x="380" y="178" font-size="11" fill="#3a4a55" text-anchor="middle">per-cache RedisCacheConfiguration (TTL, prefix, serializer), RedisCacheWriter</text>

  <line x1="380" y1="192" x2="380" y2="206" stroke="#999999" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Layer 3: Spring Data Redis -->
  <rect x="130" y="206" width="500" height="56" fill="#fdf3e3" stroke="#7a3b12" stroke-width="1.4" rx="4"/>
  <text x="380" y="230" font-size="14" font-weight="bold" fill="#7a3b12" text-anchor="middle">Spring Data Redis</text>
  <text x="380" y="248" font-size="11" fill="#3a4a55" text-anchor="middle">RedisConnectionFactory, RedisSerializer, spring.data.redis.* properties</text>

  <line x1="380" y1="262" x2="380" y2="276" stroke="#999999" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Layer 4: Lettuce -->
  <rect x="130" y="276" width="500" height="56" fill="#eaf6ec" stroke="#2f5424" stroke-width="1.4" rx="4"/>
  <text x="380" y="300" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Lettuce client driver</text>
  <text x="380" y="318" font-size="11" fill="#3a4a55" text-anchor="middle">async, shared connection, ReadFrom routing, cluster topology refresh</text>

  <line x1="380" y1="332" x2="380" y2="346" stroke="#999999" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Layer 5: Redis server -->
  <rect x="130" y="346" width="500" height="56" fill="#fbeaea" stroke="#a83a3a" stroke-width="1.4" rx="4"/>
  <text x="380" y="370" font-size="14" font-weight="bold" fill="#a83a3a" text-anchor="middle">Redis server</text>
  <text x="380" y="388" font-size="11" fill="#3a4a55" text-anchor="middle">standalone, Sentinel or Cluster -- e.g. bookshop:cache:books::&lt;isbn&gt;</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
  </defs>

  <text x="380" y="424" font-size="11" fill="#444444" text-anchor="middle">Application code calls only the top layer; RedisCacheManager, Spring Data Redis, and the client driver are</text>
  <text x="380" y="440" font-size="11" fill="#444444" text-anchor="middle">configuration choices, not code the caller interacts with directly.</text>
  <text x="380" y="460" font-size="11" fill="#888888" text-anchor="middle">Jedis is an alternative to Lettuce at the same layer -- see the page text for the trade-offs.</text>
</svg>
