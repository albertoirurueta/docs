<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Test layers of a Magento module and what each costs</title>
<desc id="d">A pyramid of five test layers for the Pocket Coffee module, from the cheapest and most numerous at the bottom to the most expensive and fewest at the top: static checks, unit tests, integration tests, API and setup tests, and browser tests with MFTF. Each layer lists what it needs and the time measured on the local Mage-OS 3.6.0 store.</desc>
<rect width="1000" height="520" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Test layers of PocketCoffee_Testing: cheapest at the bottom</text>
<polygon points="195,56 345,56 380,140 160,140" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="270" y="92" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">MFTF in a browser</text>
<text x="270" y="112" font-size="11.5" fill="#f2f5f8" text-anchor="middle">1 test, XML</text>
<line x1="362" y1="98.0" x2="540" y2="98.0" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="86" font-size="12.5" fill="#f2f5f8">Needs Selenium, a browser and a running shop. Generated and</text>
<text x="552" y="102" font-size="12.5" fill="#f2f5f8">statically checked here; not run.</text>
<text x="552" y="122" font-size="12" font-weight="bold" fill="#f4b860">not run (no browser)</text>
<polygon points="160,146 380,146 415,230 125,230" fill="#4a5a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="270" y="182" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">API functional and setup integration</text>
<text x="270" y="202" font-size="11.5" fill="#f2f5f8" text-anchor="middle">REST, GraphQL, installer</text>
<line x1="398" y1="188.0" x2="540" y2="188.0" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="176" font-size="12.5" fill="#f2f5f8">Need a running instance or a dedicated database. Not run for</text>
<text x="552" y="192" font-size="12.5" fill="#f2f5f8">this module.</text>
<text x="552" y="212" font-size="12" font-weight="bold" fill="#f4b860">not run</text>
<polygon points="125,236 415,236 450,320 90,320" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="270" y="272" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Integration tests</text>
<text x="270" y="292" font-size="11.5" fill="#f2f5f8" text-anchor="middle">5 tests, 10 assertions</text>
<line x1="432" y1="278.0" x2="540" y2="278.0" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="266" font-size="12.5" fill="#f2f5f8">Real installation in a sandbox database, OpenSearch,</text>
<text x="552" y="282" font-size="12.5" fill="#f2f5f8">attributes for config and data fixtures.</text>
<text x="552" y="302" font-size="12" font-weight="bold" fill="#f4b860">27 s with reinstall, 2.3 s with TESTS_CLEANUP disabled</text>
<polygon points="90,326 450,326 485,410 55,410" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="270" y="362" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Unit tests</text>
<text x="270" y="382" font-size="11.5" fill="#f2f5f8" text-anchor="middle">15 tests, 17 assertions</text>
<line x1="468" y1="368.0" x2="540" y2="368.0" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="356" font-size="12.5" fill="#f2f5f8">No database, stubs and mocks only, PHPUnit 12.</text>
<text x="552" y="376" font-size="12" font-weight="bold" fill="#f4b860">6 ms of test time</text>
<polygon points="55,416 485,416 520,500 20,500" fill="#2f6b73" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="270" y="452" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Static checks</text>
<text x="270" y="472" font-size="11.5" fill="#f2f5f8" text-anchor="middle">phpcs, PHPStan, PHPMD, MFTF static checks</text>
<line x1="502" y1="458.0" x2="540" y2="458.0" stroke="#7fb3e6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="446" font-size="12.5" fill="#f2f5f8">Read the source only: Magento2 standard, types, dependencies</text>
<text x="552" y="462" font-size="12.5" fill="#f2f5f8">between modules.</text>
<text x="552" y="482" font-size="12" font-weight="bold" fill="#f4b860">phpcs: 0.15 s on the module</text>
</svg>