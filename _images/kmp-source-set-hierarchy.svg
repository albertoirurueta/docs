<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The default hierarchy template of Kotlin Multiplatform</title>
  <defs>
    <marker id="arrKh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The default hierarchy template</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">each arrow points from a source set to the source set it dependsOn, whose declarations it can see</text>

  <!-- edges (child -> parent) -->
  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#arrKh)">
    <path d="M 110 120 L 330 84"/>
    <path d="M 300 120 L 370 84"/>
    <path d="M 470 120 L 395 84"/>
    <path d="M 650 120 L 430 84"/>
    <path d="M 110 200 L 110 156"/>
    <path d="M 290 200 L 140 156"/>
    <path d="M 110 280 L 110 236"/>
    <path d="M 300 280 L 140 236"/>
    <path d="M 80 360 L 100 316"/>
    <path d="M 250 360 L 120 316"/>
    <path d="M 650 200 L 650 156"/>
    <path d="M 560 200 L 640 156" stroke-dasharray="4 3"/>
  </g>

  <!-- commonMain -->
  <rect x="300" y="50" width="160" height="34" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="380" y="72" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">commonMain</text>

  <!-- row 2 -->
  <rect x="40" y="120" width="140" height="36" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="110" y="143" font-size="12.5" fill="#333333" text-anchor="middle">nativeMain</text>
  <rect x="240" y="120" width="120" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="300" y="143" font-size="12.5" fill="#2d6a34" text-anchor="middle">androidMain</text>
  <rect x="410" y="120" width="120" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="470" y="143" font-size="12.5" fill="#2d6a34" text-anchor="middle">jvmMain</text>
  <rect x="590" y="120" width="120" height="36" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="650" y="143" font-size="12.5" fill="#333333" text-anchor="middle">webMain</text>

  <!-- row 3 -->
  <rect x="40" y="200" width="140" height="36" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="110" y="223" font-size="12.5" fill="#333333" text-anchor="middle">appleMain</text>
  <rect x="230" y="200" width="120" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="290" y="223" font-size="12.5" fill="#2d6a34" text-anchor="middle">linuxX64Main</text>
  <rect x="590" y="200" width="120" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="650" y="223" font-size="12.5" fill="#2d6a34" text-anchor="middle">wasmJsMain</text>
  <rect x="500" y="200" width="60" height="36" rx="6" fill="#fafafa" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="530" y="223" font-size="11" fill="#777777" text-anchor="middle">jsMain</text>

  <!-- row 4 -->
  <rect x="40" y="280" width="140" height="36" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="110" y="303" font-size="12.5" fill="#333333" text-anchor="middle">iosMain</text>
  <rect x="240" y="280" width="140" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="310" y="303" font-size="12.5" fill="#2d6a34" text-anchor="middle">macosArm64Main</text>

  <!-- row 5 -->
  <rect x="10" y="360" width="140" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="80" y="383" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">iosArm64Main</text>
  <rect x="170" y="360" width="190" height="36" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="265" y="383" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">iosSimulatorArm64Main</text>

  <!-- legend -->
  <rect x="440" y="300" width="300" height="150" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="456" y="320" font-size="12" font-weight="bold" fill="#222222">Legend</text>
  <rect x="456" y="330" width="22" height="14" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="486" y="342" font-size="11" fill="#333333">common source set (all targets)</text>
  <rect x="456" y="352" width="22" height="14" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="486" y="364" font-size="11" fill="#333333">intermediate source set (group of targets)</text>
  <rect x="456" y="374" width="22" height="14" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="486" y="386" font-size="11" fill="#333333">platform source set (one target)</text>
  <line x1="456" y1="404" x2="478" y2="404" stroke="#444444" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="486" y="408" font-size="11" fill="#333333">present only if the js() target is declared</text>
  <text x="456" y="428" font-size="10.5" fill="#666666">Test source sets (commonTest, iosTest, ...) form the same tree.</text>
  <text x="456" y="442" font-size="10.5" fill="#666666">androidMain exists with the Android-KMP library plugin.</text>
</svg>
