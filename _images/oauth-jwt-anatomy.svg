<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a JWT</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">the dot-separated compact form above, each segment decoded below</text>

  <!-- Compact form bar -->
  <rect x="30" y="66" width="700" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="45" y="94" font-family="'Courier New', monospace" font-size="10">
    <tspan fill="#1c4b73" font-weight="bold">eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYzEyMyJ9</tspan><tspan fill="#333333">.</tspan><tspan fill="#2d6a34" font-weight="bold">eyJpc3MiOiJhcy5leGFtcGxlLmNvbSIsLi4ufQ</tspan><tspan fill="#333333">.</tspan><tspan fill="#8a5a1c" font-weight="bold">c2lnbmF0dXJlLWJ5dGVz</tspan>
  </text>

  <!-- connector lines -->
  <line x1="150" y1="112" x2="150" y2="150" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="400" y1="112" x2="400" y2="150" stroke="#2d6a34" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="640" y1="112" x2="640" y2="150" stroke="#8a5a1c" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Header box -->
  <rect x="30" y="150" width="240" height="140" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="150" y="172" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Header (JOSE header)</text>
  <text x="46" y="196" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">{</text>
  <text x="58" y="212" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"alg": "RS256",</text>
  <text x="58" y="228" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"typ": "JWT",</text>
  <text x="58" y="244" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"kid": "abc123"</text>
  <text x="46" y="260" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">}</text>
  <text x="150" y="278" font-size="9.5" fill="#666666" text-anchor="middle">names the algorithm and signing key</text>

  <!-- Payload box -->
  <rect x="280" y="150" width="290" height="200" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="425" y="172" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Payload (claims set)</text>
  <text x="296" y="196" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">{</text>
  <text x="308" y="212" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"iss": "https://as.example.com",</text>
  <text x="308" y="228" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"sub": "alice",</text>
  <text x="308" y="244" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"aud": "https://api.example.com",</text>
  <text x="308" y="260" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"exp": 1758000000,</text>
  <text x="308" y="276" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"iat": 1757996400,</text>
  <text x="308" y="292" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">"scope": "orders:read"</text>
  <text x="296" y="308" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">}</text>
  <text x="425" y="330" font-size="9.5" fill="#666666" text-anchor="middle">registered, public and private claims --</text>
  <text x="425" y="343" font-size="9.5" fill="#666666" text-anchor="middle">readable by anyone holding the token</text>

  <!-- Signature box -->
  <rect x="590" y="150" width="140" height="140" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="660" y="172" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Signature</text>
  <text x="660" y="200" font-size="9.5" fill="#333333" text-anchor="middle">computed over</text>
  <text x="660" y="214" font-family="'Courier New', monospace" font-size="9.5" fill="#333333" text-anchor="middle">Header.Payload</text>
  <text x="660" y="232" font-size="9.5" fill="#333333" text-anchor="middle">with the alg and key</text>
  <text x="660" y="246" font-size="9.5" fill="#333333" text-anchor="middle">named in the header</text>
  <text x="660" y="270" font-size="9.5" fill="#8a5a1c" text-anchor="middle" font-weight="bold">verified, not decoded</text>

  <!-- Base64url note -->
  <rect x="30" y="370" width="700" height="60" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="390" font-size="10.5" fill="#666666" text-anchor="middle">Header and payload are base64url-encoded, not encrypted -- decodable by anyone who has the token.</text>
  <text x="380" y="406" font-size="10.5" fill="#666666" text-anchor="middle">Only the signature protects integrity; confidentiality, when needed, comes from JWE (nested encryption)</text>
  <text x="380" y="420" font-size="10.5" fill="#666666" text-anchor="middle">or from transport security (TLS) -- see "Nested and encrypted JWTs" on this page.</text>

  <!-- Validation summary -->
  <rect x="30" y="450" width="700" height="90" fill="#fbecec" stroke="#a33" stroke-width="1.2"/>
  <text x="380" y="472" font-size="12" font-weight="bold" fill="#a33" text-anchor="middle">A resource server trusts none of this until it validates:</text>
  <text x="380" y="492" font-size="10" fill="#333333" text-anchor="middle">alg on an allow-list -- signature verifies against a cached, trusted JWKS key -- iss matches --</text>
  <text x="380" y="508" font-size="10" fill="#333333" text-anchor="middle">aud names this resource server -- exp / nbf are within range -- required claims present -- scope sufficient</text>
  <text x="380" y="526" font-size="9.5" fill="#666666" text-anchor="middle">A signed JWT that passes every check is still valid until exp -- it cannot be revoked earlier.</text>
</svg>
