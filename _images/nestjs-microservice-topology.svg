<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf microservice topology</text>
  <text x="390" y="44" font-size="12" fill="#666666" text-anchor="middle">requests go through one gateway; services own their data and talk over a transport or a broker</text>

  <!-- Clients -->
  <rect x="20" y="170" width="100" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="70" y="198" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="70" y="216" font-size="11" fill="#444444" text-anchor="middle">browsers, apps</text>
  <text x="70" y="230" font-size="10" fill="#666666" text-anchor="middle">HTTPS only</text>

  <!-- Gateway -->
  <rect x="165" y="140" width="150" height="130" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="240" y="166" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Gateway</text>
  <text x="240" y="184" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">apps/gateway</text>
  <text x="240" y="204" font-size="11" fill="#444444" text-anchor="middle">HTTP in, ClientProxy out</text>
  <text x="240" y="220" font-size="11" fill="#444444" text-anchor="middle">auth, timeouts, error</text>
  <text x="240" y="234" font-size="11" fill="#444444" text-anchor="middle">mapping, saga orchestrator</text>
  <text x="240" y="256" font-size="10" fill="#666666" text-anchor="middle">no business data of its own</text>

  <!-- Catalog -->
  <rect x="400" y="62" width="170" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="485" y="86" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">catalog</text>
  <text x="485" y="104" font-size="11" fill="#444444" text-anchor="middle">books, authors</text>
  <text x="485" y="120" font-size="10" fill="#666666" text-anchor="middle">@MessagePattern (TCP)</text>
  <text x="485" y="136" font-size="10" fill="#666666" text-anchor="middle">scaled out behind DNS</text>

  <!-- Reviews -->
  <rect x="400" y="172" width="170" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="485" y="196" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">reviews</text>
  <text x="485" y="214" font-size="11" fill="#444444" text-anchor="middle">ratings, comments</text>
  <text x="485" y="230" font-size="10" fill="#666666" text-anchor="middle">@MessagePattern (TCP)</text>
  <text x="485" y="246" font-size="10" fill="#666666" text-anchor="middle">emits review.created</text>

  <!-- Notifications -->
  <rect x="400" y="340" width="170" height="86" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="485" y="364" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">notifications</text>
  <text x="485" y="382" font-size="11" fill="#444444" text-anchor="middle">email, digests</text>
  <text x="485" y="398" font-size="10" fill="#666666" text-anchor="middle">@EventPattern, idempotent</text>
  <text x="485" y="414" font-size="10" fill="#666666" text-anchor="middle">manual ack, dead-lettering</text>

  <!-- Databases -->
  <rect x="640" y="70" width="110" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="695" y="96" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">catalog DB</text>
  <text x="695" y="114" font-size="10" fill="#666666" text-anchor="middle">PostgreSQL schema</text>
  <text x="695" y="128" font-size="10" fill="#666666" text-anchor="middle">owned by catalog</text>

  <rect x="640" y="180" width="110" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="695" y="206" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">reviews DB</text>
  <text x="695" y="224" font-size="10" fill="#666666" text-anchor="middle">MongoDB</text>
  <text x="695" y="238" font-size="10" fill="#666666" text-anchor="middle">owned by reviews</text>

  <rect x="640" y="348" width="110" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="695" y="374" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">notif. DB</text>
  <text x="695" y="392" font-size="10" fill="#666666" text-anchor="middle">processed_messages,</text>
  <text x="695" y="406" font-size="10" fill="#666666" text-anchor="middle">digests</text>

  <!-- Broker -->
  <rect x="165" y="340" width="150" height="86" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="240" y="364" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Broker</text>
  <text x="240" y="382" font-size="11" fill="#444444" text-anchor="middle">RabbitMQ queue</text>
  <text x="240" y="398" font-size="10" fill="#666666" text-anchor="middle">durable, manual ack</text>
  <text x="240" y="414" font-size="10" fill="#666666" text-anchor="middle">dead-letter queue beside it</text>

  <!-- Clients -> gateway -->
  <line x1="120" y1="205" x2="159" y2="205" stroke="#444444" stroke-width="1.6"/>
  <polygon points="165,205 157,200 157,210" fill="#444444"/>
  <text x="142" y="196" font-size="10" fill="#666666" text-anchor="middle">HTTP</text>

  <!-- gateway -> catalog -->
  <line x1="315" y1="170" x2="394" y2="108" stroke="#444444" stroke-width="1.4"/>
  <polygon points="400,104 390,105 396,113" fill="#444444"/>
  <!-- gateway -> reviews -->
  <line x1="315" y1="210" x2="394" y2="214" stroke="#444444" stroke-width="1.4"/>
  <polygon points="400,214 392,209 392,219" fill="#444444"/>
  <text x="302" y="124" font-size="10" fill="#666666" text-anchor="end">send(): request-response</text>
  <!-- gateway -> notifications (dashed, saga commands) -->
  <line x1="300" y1="270" x2="410" y2="336" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="414,340 404,338 410,330" fill="#444444"/>
  <text x="400" y="312" font-size="10" fill="#666666">saga steps</text>

  <!-- reviews -> broker (emit) -->
  <path d="M 400 245 L 340 245 L 340 360 L 321 360" fill="none" stroke="#7a4a00" stroke-width="1.6"/>
  <polygon points="315,360 323,355 323,365" fill="#7a4a00"/>
  <text x="334" y="326" font-size="10" fill="#7a4a00" text-anchor="end">emit(): review.created</text>

  <!-- broker -> notifications -->
  <line x1="315" y1="400" x2="394" y2="400" stroke="#7a4a00" stroke-width="1.6"/>
  <polygon points="400,400 392,395 392,405" fill="#7a4a00"/>
  <text x="357" y="418" font-size="10" fill="#7a4a00" text-anchor="middle">deliver</text>

  <!-- service -> db -->
  <line x1="570" y1="105" x2="634" y2="105" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="640,105 632,100 632,110" fill="#2f5424"/>
  <line x1="570" y1="215" x2="634" y2="215" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="640,215 632,210 632,220" fill="#2f5424"/>
  <line x1="570" y1="383" x2="634" y2="383" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="640,383 632,378 632,388" fill="#2f5424"/>

  <text x="20" y="455" font-size="10" fill="#666666">dark lines: synchronous request-response; brown lines: broker traffic; dashed: orchestrated saga steps</text>
</svg>
