<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">How operations are grouped by tags on a generated REST page</title>
  <desc id="d">Three operations of a Swagger 2.0 file are placed under the Conversion tag, the Catalog tag, or the Other APIs section.</desc>
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#1f2a37"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f3f4f6">
    <text x="30" y="36" font-size="16" font-weight="bold">Swagger 2.0 file (operations and their tags)</text>
    <text x="430" y="36" font-size="16" font-weight="bold">Generated page (one HTML file)</text>

    <rect x="30" y="60" width="260" height="64" rx="8" fill="#2f5d8a" stroke="#9ec5ee"/>
    <text x="44" y="86" font-weight="bold">convert_length</text>
    <text x="44" y="108" font-size="13">tags: Conversion</text>

    <rect x="30" y="150" width="260" height="64" rx="8" fill="#2f5d8a" stroke="#9ec5ee"/>
    <text x="44" y="176" font-weight="bold">list_units</text>
    <text x="44" y="198" font-size="13">tags: Conversion, Catalog</text>

    <rect x="30" y="240" width="260" height="64" rx="8" fill="#2f5d8a" stroke="#9ec5ee"/>
    <text x="44" y="266" font-weight="bold">health_check</text>
    <text x="44" y="288" font-size="13">no tags</text>

    <rect x="430" y="58" width="300" height="96" rx="8" fill="#3b4a5c" stroke="#9ca3af"/>
    <text x="444" y="82" font-weight="bold">Section: Conversion</text>
    <text x="444" y="106" font-size="13">convert_length</text>
    <text x="444" y="128" font-size="13">list_units</text>

    <rect x="430" y="166" width="300" height="72" rx="8" fill="#3b4a5c" stroke="#9ca3af"/>
    <text x="444" y="190" font-weight="bold">Section: Catalog</text>
    <text x="444" y="214" font-size="13">list_units (again)</text>

    <rect x="430" y="250" width="300" height="72" rx="8" fill="#5a4a2a" stroke="#e5c07b"/>
    <text x="444" y="274" font-weight="bold">Section: Other APIs</text>
    <text x="444" y="298" font-size="13">health_check</text>

    <path d="M290 92 L430 106" stroke="#e5e7eb" stroke-width="2" fill="none"/>
    <path d="M290 172 L430 120" stroke="#e5e7eb" stroke-width="2" fill="none"/>
    <path d="M290 190 L430 200" stroke="#e5e7eb" stroke-width="2" fill="none"/>
    <path d="M290 272 L430 284" stroke="#e5e7eb" stroke-width="2" fill="none"/>
    <text x="30" y="338" font-size="13">An operation with several tags appears once per tag; an untagged operation goes to Other APIs.</text>
  </g>
</svg>
