<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-deferred-gbuffer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The G-buffer of the Bookshelf deferred pass</text>
<defs><linearGradient id="g-depth" x1="0" x2="1"><stop offset="0" stop-color="#F3F4F6"/><stop offset="1" stop-color="#6B7280"/></linearGradient></defs>
<rect x="100" y="70" width="200" height="120" rx="6" fill="url(#g-depth)" stroke="#4B5563" stroke-width="1.5"/>
<rect x="70" y="100" width="200" height="120" rx="6" fill="#C7D2FE" stroke="#4B5563" stroke-width="1.5"/>
<rect x="85" y="115" width="170" height="90" rx="4" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
<rect x="40" y="130" width="200" height="120" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="52" y="145" width="24" height="90" fill="#B45309" opacity="0.85"/>
<rect x="82" y="145" width="24" height="90" fill="#047857" opacity="0.85"/>
<rect x="112" y="145" width="24" height="90" fill="#4F46E5" opacity="0.85"/>
<rect x="142" y="145" width="24" height="90" fill="#9D174D" opacity="0.85"/>
<rect x="172" y="145" width="24" height="90" fill="#B45309" opacity="0.85"/>
<rect x="202" y="145" width="24" height="90" fill="#047857" opacity="0.85"/>
<rect x="46" y="236" width="188" height="8" fill="#92400E"/>
<text x="140" y="270" text-anchor="middle" font-size="12" fill="#374151">Three layers, one pixel grid</text>
<text x="140" y="288" text-anchor="middle" font-size="11" fill="#374151">(drawn offset to show the stack)</text>
<rect x="300" y="62" width="440" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="314" y="84" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">RT1  albedo</text>
<text x="724" y="84" text-anchor="end" font-size="12" fill="#3730A3">rgba8Unorm, 4 B</text>
<text x="314" y="104" text-anchor="start" font-size="11" fill="#374151">rgb = base colour, a unused</text>
<rect x="300" y="128" width="440" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="314" y="150" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">RT2  normal and shininess</text>
<text x="724" y="150" text-anchor="end" font-size="12" fill="#3730A3">rgba16Float, 8 B</text>
<text x="314" y="170" text-anchor="start" font-size="11" fill="#374151">xyz = view-space normal, w = shininess</text>
<rect x="300" y="194" width="440" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="314" y="216" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">RT3  linear depth</text>
<text x="724" y="216" text-anchor="end" font-size="12" fill="#3730A3">r32Float, 4 B</text>
<text x="314" y="236" text-anchor="start" font-size="11" fill="#374151">distance along -z, used to rebuild the position</text>
<rect x="300" y="260" width="440" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="314" y="282" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Depth attachment</text>
<text x="724" y="282" text-anchor="end" font-size="12" fill="#374151">depth32Float, 4 B</text>
<text x="314" y="302" text-anchor="start" font-size="11" fill="#374151">hardware depth test while filling the G-buffer</text>
<rect x="300" y="332" width="440" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="520" y="351" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">RT0  lit colour = the drawable (bgra8Unorm_srgb or rgba16Float)</text>
<text x="520" y="367" text-anchor="middle" font-size="11" fill="#374151">the only attachment with storeAction .store</text>
<rect x="40" y="392" width="700" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390" y="411" text-anchor="middle" font-size="11" fill="#92400E">RT1 to RT3 and depth are memoryless (.dontCare): 20 B per pixel never reach system memory.</text>
</svg>
