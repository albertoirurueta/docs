<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A buffered channel: make(chan string, 3)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a fixed-size FIFO queue plus two lists of parked goroutines; at most one of the two lists is ever non-empty</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <!-- buffer -->
  <text x="470" y="92" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">buffer: cap = 3, len = 2</text>
  <g font-size="14" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">
    <rect x="320" y="104" width="100" height="56" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="370" y="138">"Dune"</text>
    <rect x="420" y="104" width="100" height="56" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="470" y="138">"Emma"</text>
    <rect x="520" y="104" width="100" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="570" y="138" fill="#999999">free</text>
  </g>
  <text x="370" y="182" font-size="12" fill="#444444" text-anchor="middle">front: next to receive</text>
  <text x="570" y="182" font-size="12" fill="#444444" text-anchor="middle">next send goes here</text>
  <!-- senders / receivers -->
  <g font-size="13" fill="#222222">
    <rect x="40" y="104" width="190" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="135" y="128" text-anchor="middle" font-weight="bold">sender goroutine</text>
    <text x="135" y="146" text-anchor="middle" font-family="Courier New, monospace">ch &lt;- v</text>
    <rect x="710" y="104" width="190" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="805" y="128" text-anchor="middle" font-weight="bold">receiver goroutine</text>
    <text x="805" y="146" text-anchor="middle" font-family="Courier New, monospace">v := &lt;-ch</text>
  </g>
  <line x1="230" y1="132" x2="316" y2="132" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="624" y1="132" x2="706" y2="132" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 0)"/>
  <!-- rules -->
  <line x1="470" y1="214" x2="470" y2="384" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="236">Buffer full (len == cap)</text>
    <text x="705" y="236">Buffer empty (len == 0)</text>
  </g>
  <g font-size="13" fill="#222222">
    <text x="40" y="262">A send parks the sender in the channel's</text>
    <text x="40" y="280">send queue until a receiver takes the front</text>
    <text x="40" y="298">element and frees a slot.</text>
    <text x="40" y="326" font-family="Courier New, monospace" fill="#a33">send on full: blocks</text>
    <text x="40" y="346" font-family="Courier New, monospace" fill="#a33">select + default: skips the case</text>
    <text x="510" y="262">A receive parks the receiver in the channel's</text>
    <text x="510" y="280">receive queue until a sender arrives.</text>
    <text x="510" y="298">Closed and drained: returns the zero value.</text>
    <text x="510" y="326" font-family="Courier New, monospace" fill="#a33">receive on empty: blocks</text>
    <text x="510" y="346" font-family="Courier New, monospace" fill="#a33">close then drain: v == zero, ok == false</text>
  </g>
  <text x="470" y="384" font-size="12" fill="#666666" text-anchor="middle">cap = 0 (unbuffered) removes the buffer: sender and receiver must meet</text>
</svg>
