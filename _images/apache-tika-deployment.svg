<svg viewBox="0 0 960 580" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
<text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf intake on Kubernetes: app, tika-server pod and forked JVMs</text>
<text x="480" y="46" text-anchor="middle" font-size="12" fill="#444444">Blue: your application, green: Tika processes, amber: files and volumes mounted into the pod, grey: cluster services</text>
<rect x="20" y="110" width="180" height="100" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="110" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Bookshelf intake</text>
<text x="110" y="154" text-anchor="middle" font-size="11.5" fill="#333333">Spring Boot service</text>
<text x="110" y="170" text-anchor="middle" font-size="11.5" fill="#333333">PUT /rmeta, /tika, /detect</text>
<text x="110" y="186" text-anchor="middle" font-size="11.5" fill="#333333">429: back off and retry</text>
<text x="110" y="202" text-anchor="middle" font-size="11.5" fill="#333333">503: quarantine the file</text>
<rect x="20" y="320" width="180" height="70" rx="8" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.6"/>
<text x="110" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Prometheus</text>
<text x="110" y="364" text-anchor="middle" font-size="11.5" fill="#333333">ServiceMonitor scrapes</text>
<text x="110" y="380" text-anchor="middle" font-size="11.5" fill="#333333">GET :9404/metrics</text>
<rect x="20" y="420" width="180" height="86" rx="8" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.6"/>
<text x="110" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">kubelet probes</text>
<text x="110" y="464" text-anchor="middle" font-size="11.5" fill="#333333">startup, liveness:</text>
<text x="110" y="480" text-anchor="middle" font-size="11.5" fill="#333333">GET :9998/version</text>
<text x="110" y="496" text-anchor="middle" font-size="11.5" fill="#333333">readiness: GET /status</text>
<rect x="244" y="120" width="116" height="80" rx="8" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.6"/>
<text x="302" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Service</text>
<text x="302" y="164" text-anchor="middle" font-size="11.5" fill="#333333">tika-server</text>
<text x="302" y="180" text-anchor="middle" font-size="11.5" fill="#333333">ClusterIP</text>
<text x="302" y="196" text-anchor="middle" font-size="11.5" fill="#333333">:9998 and :9404</text>
<rect x="385" y="64" width="560" height="500" rx="12" fill="none" stroke="#2b7a2b" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="400" y="84" font-size="13" font-weight="700" fill="#1a1a1a">tika-server pod: apache/tika:4.1.0-1-full</text>
<text x="400" y="100" font-size="11.5" fill="#333333">runs as UID/GID 35002, read-only root filesystem, limits cpu 8 and memory 8Gi (requests equal)</text>
<rect x="400" y="120" width="230" height="170" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="515" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Parent JVM</text>
<text x="515" y="164" text-anchor="middle" font-size="11.5" fill="#333333">TikaServerCli -h 0.0.0.0</text>
<text x="515" y="180" text-anchor="middle" font-size="11.5" fill="#333333">Jetty parse port :9998</text>
<text x="515" y="196" text-anchor="middle" font-size="11.5" fill="#333333">metrics port :9404</text>
<text x="515" y="212" text-anchor="middle" font-size="11.5" fill="#333333">routes requests, holds results</text>
<text x="515" y="228" text-anchor="middle" font-size="11.5" fill="#333333">heap: MaxRAMPercentage=12</text>
<text x="515" y="244" text-anchor="middle" font-size="11.5" fill="#333333">pool: pipes.numClients = 3</text>
<text x="515" y="260" text-anchor="middle" font-size="11.5" fill="#333333">waits maxWaitForClientMillis,</text>
<text x="515" y="276" text-anchor="middle" font-size="11.5" fill="#333333">then answers 429</text>
<rect x="700" y="114" width="230" height="64" rx="8" fill="#eef7ee" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="815" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Forked JVM 1</text>
<text x="815" y="154" text-anchor="middle" font-size="11.5" fill="#333333">-Xmx1500m</text>
<text x="815" y="170" text-anchor="middle" font-size="11.5" fill="#333333">-XX:ActiveProcessorCount=2</text>
<rect x="700" y="192" width="230" height="64" rx="8" fill="#eef7ee" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="815" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Forked JVM 2</text>
<text x="815" y="232" text-anchor="middle" font-size="11.5" fill="#333333">-Xmx1500m</text>
<text x="815" y="248" text-anchor="middle" font-size="11.5" fill="#333333">-XX:ActiveProcessorCount=2</text>
<rect x="700" y="270" width="230" height="64" rx="8" fill="#eef7ee" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="815" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Forked JVM 3</text>
<text x="815" y="310" text-anchor="middle" font-size="11.5" fill="#333333">-Xmx1500m</text>
<text x="815" y="326" text-anchor="middle" font-size="11.5" fill="#333333">-XX:ActiveProcessorCount=2</text>
<text x="815" y="354" text-anchor="middle" font-size="11.5" fill="#333333">one document at a time per fork; an OOM,</text>
<text x="815" y="370" text-anchor="middle" font-size="11.5" fill="#333333">timeout or crash kills only that fork:</text>
<text x="815" y="386" text-anchor="middle" font-size="11.5" fill="#333333">the request gets 503, the fork restarts</text>
<text x="515" y="316" text-anchor="middle" font-size="11.5" fill="#333333">CPU: 2 for the parent</text>
<text x="515" y="332" text-anchor="middle" font-size="11.5" fill="#333333">+ 3 forks x 2 = 8 cores</text>
<text x="515" y="352" text-anchor="middle" font-size="11.5" fill="#333333">heap: 3 x 1.5 GB = 4.5 GB</text>
<text x="515" y="368" text-anchor="middle" font-size="11.5" fill="#333333">(under 75% of 8 GiB)</text>
<text x="515" y="384" text-anchor="middle" font-size="11.5" fill="#333333">+ about 1 GB for the parent</text>
<rect x="400" y="420" width="125" height="124" rx="8" fill="#fbe9c8" stroke="#a66b00" stroke-width="1.6"/>
<text x="462" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">/config</text>
<text x="462" y="462" text-anchor="middle" font-size="11.5" fill="#333333">ConfigMap</text>
<text x="462" y="478" text-anchor="middle" font-size="11.5" fill="#333333">tika-config.json</text>
<text x="462" y="494" text-anchor="middle" font-size="11.5" fill="#333333">read-only,</text>
<text x="462" y="510" text-anchor="middle" font-size="11.5" fill="#333333">passed with -c</text>
<rect x="535" y="420" width="125" height="124" rx="8" fill="#fbe9c8" stroke="#a66b00" stroke-width="1.6"/>
<text x="597" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">/tmp</text>
<text x="597" y="462" text-anchor="middle" font-size="11.5" fill="#333333">emptyDir</text>
<text x="597" y="478" text-anchor="middle" font-size="11.5" fill="#333333">spooled uploads,</text>
<text x="597" y="494" text-anchor="middle" font-size="11.5" fill="#333333">unpack and fork</text>
<text x="597" y="510" text-anchor="middle" font-size="11.5" fill="#333333">temp directories</text>
<rect x="670" y="420" width="130" height="124" rx="8" fill="#fbe9c8" stroke="#a66b00" stroke-width="1.6"/>
<text x="735" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">/opt/tika-server</text>
<text x="735" y="462" text-anchor="middle" font-size="11.5" fill="#333333">from the image:</text>
<text x="735" y="478" text-anchor="middle" font-size="11.5" fill="#333333">server jar, lib/,</text>
<text x="735" y="494" text-anchor="middle" font-size="11.5" fill="#333333">plugins/ (mount</text>
<text x="735" y="510" text-anchor="middle" font-size="11.5" fill="#333333">extra plugins here)</text>
<rect x="810" y="420" width="120" height="124" rx="8" fill="#fbe9c8" stroke="#a66b00" stroke-width="1.6"/>
<text x="870" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">/tika-extras</text>
<text x="870" y="462" text-anchor="middle" font-size="11.5" fill="#333333">optional jars</text>
<text x="870" y="478" text-anchor="middle" font-size="11.5" fill="#333333">on the classpath</text>
<text x="870" y="494" text-anchor="middle" font-size="11.5" fill="#333333">of parent and</text>
<text x="870" y="510" text-anchor="middle" font-size="11.5" fill="#333333">forks (trusted)</text>
<line x1="200" y1="160" x2="242" y2="160" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="360" y1="175" x2="398" y2="175" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<text x="221" y="153" text-anchor="middle" font-size="10.5" fill="#444444">HTTP</text>
<line x1="630" y1="160" x2="698" y2="146" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="630" y1="205" x2="698" y2="224" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="630" y1="250" x2="698" y2="302" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<text x="664" y="140" text-anchor="middle" font-size="10.5" fill="#444444">IPC</text>
<path d="M200,355 L300,355 L300,250 L398,250" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<text x="250" y="347" text-anchor="middle" font-size="10.5" fill="#444444">:9404</text>
<path d="M200,463 L330,463 L330,275 L398,275" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
<text x="265" y="455" text-anchor="middle" font-size="10.5" fill="#444444">:9998</text>
<text x="400" y="410" font-size="11.5" font-weight="700" fill="#1a1a1a">Mounted into the pod and shared by the parent and its forks</text>
</svg>
