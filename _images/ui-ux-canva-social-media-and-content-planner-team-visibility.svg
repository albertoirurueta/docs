<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Who can see and publish to a connected channel</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Who can see and publish to a connected channel</text>
  <rect x="290" y="50" width="180" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="380" y="72" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Connected channel</text><text x="380" y="89" font-size="11" fill="#374151" text-anchor="middle">owned by whoever connected it</text>
  <path d="M340,100 L120,140" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M380,100 L380,138" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M420,100 L640,140" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="20" y="142" width="200" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="120" y="168" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Private</text><text x="120" y="192" font-size="12" fill="#374151" text-anchor="middle">Only the owner sees</text><text x="120" y="208" font-size="12" fill="#374151" text-anchor="middle">the account and</text><text x="120" y="224" font-size="12" fill="#374151" text-anchor="middle">schedules to it</text>
  <rect x="280" y="142" width="200" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="168" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Team-viewable</text><text x="380" y="192" font-size="12" fill="#374151" text-anchor="middle">Teammates see what</text><text x="380" y="208" font-size="12" fill="#374151" text-anchor="middle">has been published</text><text x="380" y="224" font-size="12" fill="#374151" text-anchor="middle">in their planner</text>
  <rect x="540" y="142" width="200" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="640" y="168" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Team-publishable</text><text x="640" y="192" font-size="12" fill="#374151" text-anchor="middle">Teammates can also</text><text x="640" y="208" font-size="12" fill="#374151" text-anchor="middle">publish to the account;</text><text x="640" y="224" font-size="12" fill="#374151" text-anchor="middle">posts show for everyone</text>
  <text x="380" y="290" font-size="12" fill="#374151" text-anchor="middle">Unsharing makes every scheduled post visible only to the owner, who then owns those posts.</text>
  <text x="380" y="312" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of the three visibility levels, not a screenshot of any product.</text>
</svg>
