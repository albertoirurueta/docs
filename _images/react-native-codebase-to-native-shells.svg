<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One codebase, two native app shells</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Places's TypeScript source bundled once by Metro, embedded into each platform's own native shell</text>

  <defs>
    <marker id="cns-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Source -->
  <rect x="30" y="150" width="150" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="105" y="180" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">src/ (TypeScript)</text>
  <text x="105" y="197" font-size="10" fill="#333333" text-anchor="middle">Places's one</text>
  <text x="105" y="211" font-size="10" fill="#333333" text-anchor="middle">JS/TS codebase</text>

  <line x1="180" y1="190" x2="255" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#cns-arrow)"/>

  <!-- Metro -->
  <rect x="260" y="150" width="150" height="80" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="335" y="180" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Metro bundler</text>
  <text x="335" y="197" font-size="10" fill="#333333" text-anchor="middle">one JS bundle,</text>
  <text x="335" y="211" font-size="10" fill="#333333" text-anchor="middle">Hermes bytecode</text>

  <line x1="410" y1="180" x2="470" y2="110" stroke="#333333" stroke-width="1.4" marker-end="url(#cns-arrow)"/>
  <line x1="410" y1="200" x2="470" y2="270" stroke="#333333" stroke-width="1.4" marker-end="url(#cns-arrow)"/>

  <!-- iOS shell -->
  <rect x="480" y="55" width="250" height="110" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="605" y="80" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">iOS app shell (.ipa)</text>
  <text x="605" y="100" font-size="10" fill="#333333" text-anchor="middle">Hermes engine (JS thread)</text>
  <text x="605" y="116" font-size="10" fill="#333333" text-anchor="middle">Fabric renders into UIView/</text>
  <text x="605" y="130" font-size="10" fill="#333333" text-anchor="middle">CALayer native views</text>
  <text x="605" y="150" font-size="10" fill="#666666" text-anchor="middle">reviewed and shipped via the App Store</text>

  <!-- Android shell -->
  <rect x="480" y="215" width="250" height="110" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="605" y="240" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Android app shell (.apk/.aab)</text>
  <text x="605" y="260" font-size="10" fill="#333333" text-anchor="middle">Hermes engine (JS thread)</text>
  <text x="605" y="276" font-size="10" fill="#333333" text-anchor="middle">Fabric renders into native</text>
  <text x="605" y="290" font-size="10" fill="#333333" text-anchor="middle">Android View hierarchy</text>
  <text x="605" y="310" font-size="10" fill="#666666" text-anchor="middle">reviewed and shipped via Google Play</text>

  <text x="380" y="360" font-size="10.5" fill="#666666" text-anchor="middle">Each shell runs its own Hermes engine and Fabric instance -- the JS bundle is identical, the runtime and native views are not.</text>
</svg>
