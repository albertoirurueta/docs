<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ray-tracing-acceleration-structures" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="370" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Instance and primitive acceleration structures</text>
<rect x="280" y="50" width="200" height="64" rx="8" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.5"/>
<text x="380.0" y="71.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Instance AS (TLAS)</text>
<text x="380.0" y="85.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">instances: 9 books + shelf</text>
<text x="380.0" y="99.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">each with transform, mask, id</text>
<rect x="40" y="185" width="190" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="135.0" y="209.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Primitive AS: book</text>
<text x="135.0" y="223.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">triangles of one book</text>
<text x="135.0" y="237.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">built once, shared</text>
<rect x="285" y="185" width="190" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="209.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Primitive AS: shelf</text>
<text x="380.0" y="223.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">triangles of the shelf</text>
<text x="380.0" y="237.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">built once</text>
<rect x="530" y="185" width="190" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="209.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Primitive AS: lamp</text>
<text x="625.0" y="223.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">optional second BLAS</text>
<text x="625.0" y="237.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">e.g. the desk lamp</text>
<line x1="380" y1="114" x2="135" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-acceleration-structures)"/>
<line x1="380" y1="114" x2="380" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-acceleration-structures)"/>
<line x1="380" y1="114" x2="625" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-acceleration-structures)"/>
<rect x="40" y="300" width="300" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="322.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">built on the GPU, residency required</text>
<text x="190.0" y="336.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">compact after the first build</text>
<rect x="400" y="300" width="320" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="322.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">refit for animation, rebuild after big changes</text>
<text x="560.0" y="336.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">the TLAS is rebuilt every frame (cheap)</text>
<text x="380" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Nine instances share one book BLAS: moving a book only changes its transform.</text>
</svg>
