<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img">
<title>A multilayer perceptron</title>
<desc>A fully connected network with three inputs, two hidden layers of four units and two outputs, with each layer computing an affine map followed by an activation.</desc>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Multilayer perceptron: layers of affine map + activation</text>
<line x1="110" y1="117.5" x2="260" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="117.5" x2="260" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="117.5" x2="260" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="117.5" x2="260" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="172.5" x2="260" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="172.5" x2="260" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="172.5" x2="260" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="172.5" x2="260" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="227.5" x2="260" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="227.5" x2="260" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="227.5" x2="260" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="110" y1="227.5" x2="260" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="90.0" x2="410" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="90.0" x2="410" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="90.0" x2="410" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="90.0" x2="410" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="145.0" x2="410" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="145.0" x2="410" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="145.0" x2="410" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="145.0" x2="410" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="200.0" x2="410" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="200.0" x2="410" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="200.0" x2="410" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="200.0" x2="410" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="255.0" x2="410" y2="90.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="255.0" x2="410" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="255.0" x2="410" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="260" y1="255.0" x2="410" y2="255.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="90.0" x2="560" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="90.0" x2="560" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="145.0" x2="560" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="145.0" x2="560" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="200.0" x2="560" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="200.0" x2="560" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="255.0" x2="560" y2="145.0" stroke="#94A3B8" stroke-width="1"/>
<line x1="410" y1="255.0" x2="560" y2="200.0" stroke="#94A3B8" stroke-width="1"/>
<circle cx="110" cy="117.5" r="15" fill="#93C5FD" stroke="#334155" stroke-width="1.5"/>
<circle cx="110" cy="172.5" r="15" fill="#93C5FD" stroke="#334155" stroke-width="1.5"/>
<circle cx="110" cy="227.5" r="15" fill="#93C5FD" stroke="#334155" stroke-width="1.5"/>
<text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Input x</text>
<circle cx="260" cy="90.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="260" cy="145.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="260" cy="200.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="260" cy="255.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<text x="260" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Hidden h1</text>
<circle cx="410" cy="90.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="410" cy="145.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="410" cy="200.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<circle cx="410" cy="255.0" r="15" fill="#86EFAC" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Hidden h2</text>
<circle cx="560" cy="145.0" r="15" fill="#FCA5A5" stroke="#334155" stroke-width="1.5"/>
<circle cx="560" cy="200.0" r="15" fill="#FCA5A5" stroke="#334155" stroke-width="1.5"/>
<text x="560" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Output y</text>
<text x="185" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">W1, b1 then activation</text>
<text x="335" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">W2, b2 then activation</text>
<text x="485" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">W3, b3 (no activation or softmax)</text>
<text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="start">h = f(Wx + b)</text>
<text x="640" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">each unit sums its weighted</text>
<text x="640" y="188" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">inputs, adds a bias and applies</text>
<text x="640" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">a nonlinearity f</text>
</svg>
