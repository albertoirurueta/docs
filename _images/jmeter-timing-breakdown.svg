<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Where JMeter measures connect time, latency, elapsed time and idle time</title>
<desc id="d">Two timelines. The first shows one HTTP request on a new connection: connecting and the TLS handshake take 40 ms, sending the request 15 ms, the server works until the first response byte arrives at 160 ms, and the last byte arrives at 230 ms. All three metrics start at the sample start: Connect is 40 ms, Latency is 160 ms and includes Connect, elapsed is 230 ms. The second timeline shows a Transaction Controller parent sample whose children are a 230 ms search, a 300 ms timer and pre- or post-processor gap, and a 120 ms book view. The wall-clock span is 650 ms, IdleTime is 300 ms and the reported elapsed time is 350 ms.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#94a3b8" fill-opacity="0.18"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.7"/>
</pattern>
</defs>
<text x="20" y="26" font-size="15" font-weight="bold">Timing of a sample: Connect, Latency, elapsed and IdleTime</text>
<text x="20" y="44" font-size="11" opacity="0.75">Every metric is measured from the same sample start; times are in milliseconds, as in the JTL file</text>

<!-- Panel A -->
<text x="20" y="66" font-size="13" font-weight="bold">A. One HTTP Request on a new connection (HttpClient4)</text>
<text x="110" y="84" font-size="10" text-anchor="start">sample start (timeStamp)</text>
<text x="526" y="84" font-size="10" text-anchor="middle">first byte</text>
<text x="708" y="84" font-size="10" text-anchor="middle">last byte (sample end)</text>
<line x1="110" y1="88" x2="110" y2="214" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="526" y1="88" x2="526" y2="214" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="708" y1="88" x2="708" y2="214" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.6"/>

<text x="100" y="109" text-anchor="end">Phases</text>
<rect x="110" y="92" width="104" height="26" fill="#a855f7" fill-opacity="0.35" stroke="#a855f7"/>
<text x="162" y="109" font-size="10" text-anchor="middle">connect + TLS</text>
<rect x="214" y="92" width="39" height="26" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6"/>
<text x="233.5" y="109" font-size="10" text-anchor="middle">send</text>
<rect x="253" y="92" width="273" height="26" fill="#94a3b8" fill-opacity="0.25" stroke="#94a3b8"/>
<text x="389.5" y="109" font-size="10" text-anchor="middle">server processing (client waits)</text>
<rect x="526" y="92" width="182" height="26" fill="#10b981" fill-opacity="0.35" stroke="#10b981"/>
<text x="617" y="109" font-size="10" text-anchor="middle">receive rest of response</text>

<text x="100" y="147" text-anchor="end">Connect</text>
<rect x="110" y="134" width="104" height="18" rx="3" fill="#a855f7" fill-opacity="0.6" stroke="#a855f7"/>
<text x="222" y="147" font-size="11">40 ms (0 on a reused connection)</text>
<text x="100" y="175" text-anchor="end">Latency</text>
<rect x="110" y="162" width="416" height="18" rx="3" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b"/>
<text x="534" y="175" font-size="11">160 ms: to first byte, includes Connect</text>
<text x="100" y="203" text-anchor="end">elapsed</text>
<rect x="110" y="190" width="598" height="18" rx="3" fill="#ef4444" fill-opacity="0.55" stroke="#ef4444"/>
<text x="716" y="203" font-size="11">230 ms</text>

<line x1="110" y1="222" x2="770" y2="222" stroke="currentColor"/>
<line x1="110" y1="222" x2="110" y2="227" stroke="currentColor"/>
<text x="110" y="239" font-size="11" text-anchor="middle">0</text>
<line x1="240" y1="222" x2="240" y2="227" stroke="currentColor"/>
<text x="240" y="239" font-size="11" text-anchor="middle">50</text>
<line x1="370" y1="222" x2="370" y2="227" stroke="currentColor"/>
<text x="370" y="239" font-size="11" text-anchor="middle">100</text>
<line x1="500" y1="222" x2="500" y2="227" stroke="currentColor"/>
<text x="500" y="239" font-size="11" text-anchor="middle">150</text>
<line x1="630" y1="222" x2="630" y2="227" stroke="currentColor"/>
<text x="630" y="239" font-size="11" text-anchor="middle">200</text>
<line x1="760" y1="222" x2="760" y2="227" stroke="currentColor"/>
<text x="760" y="239" font-size="11" text-anchor="middle">250</text>
<text x="440" y="256" text-anchor="middle">Time since the sample started (ms)</text>

<!-- Panel B -->
<text x="20" y="292" font-size="13" font-weight="bold">B. Transaction Controller parent sample, timers and pre-/post-processors not included</text>

<text x="100" y="327" text-anchor="end">Children</text>
<rect x="110" y="310" width="207" height="26" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6"/>
<text x="213.5" y="327" font-size="10" text-anchor="middle">search: 230 ms</text>
<rect x="317" y="310" width="270" height="26" fill="url(#hatch)" stroke="#94a3b8"/>
<text x="452" y="327" font-size="10" text-anchor="middle">timer and processors: 300 ms</text>
<rect x="587" y="310" width="108" height="26" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6"/>
<text x="641" y="327" font-size="10" text-anchor="middle">view book: 120 ms</text>

<text x="100" y="361" text-anchor="end">Wall clock</text>
<rect x="110" y="348" width="585" height="18" rx="3" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
<text x="703" y="361" font-size="11">650 ms</text>
<text x="100" y="389" text-anchor="end">IdleTime</text>
<rect x="317" y="376" width="270" height="18" rx="3" fill="url(#hatch)" stroke="#94a3b8"/>
<text x="595" y="389" font-size="11">300 ms (column IdleTime)</text>
<text x="100" y="417" text-anchor="end">elapsed</text>
<rect x="110" y="404" width="207" height="18" rx="3" fill="#ef4444" fill-opacity="0.55" stroke="#ef4444"/>
<line x1="317" y1="413" x2="587" y2="413" stroke="#ef4444" stroke-dasharray="2 4"/>
<rect x="587" y="404" width="108" height="18" rx="3" fill="#ef4444" fill-opacity="0.55" stroke="#ef4444"/>
<text x="703" y="417" font-size="11">650 − 300 = 350 ms</text>

<line x1="110" y1="432" x2="770" y2="432" stroke="currentColor"/>
<line x1="110" y1="432" x2="110" y2="437" stroke="currentColor"/>
<text x="110" y="449" font-size="11" text-anchor="middle">0</text>
<line x1="200" y1="432" x2="200" y2="437" stroke="currentColor"/>
<text x="200" y="449" font-size="11" text-anchor="middle">100</text>
<line x1="290" y1="432" x2="290" y2="437" stroke="currentColor"/>
<text x="290" y="449" font-size="11" text-anchor="middle">200</text>
<line x1="380" y1="432" x2="380" y2="437" stroke="currentColor"/>
<text x="380" y="449" font-size="11" text-anchor="middle">300</text>
<line x1="470" y1="432" x2="470" y2="437" stroke="currentColor"/>
<text x="470" y="449" font-size="11" text-anchor="middle">400</text>
<line x1="560" y1="432" x2="560" y2="437" stroke="currentColor"/>
<text x="560" y="449" font-size="11" text-anchor="middle">500</text>
<line x1="650" y1="432" x2="650" y2="437" stroke="currentColor"/>
<text x="650" y="449" font-size="11" text-anchor="middle">600</text>
<line x1="740" y1="432" x2="740" y2="437" stroke="currentColor"/>
<text x="740" y="449" font-size="11" text-anchor="middle">700</text>
<text x="440" y="466" text-anchor="middle">Time since the transaction started (ms)</text>
<text x="20" y="494" font-size="11" opacity="0.8">elapsed = end − start − IdleTime. Latency and Connect subtract IdleTime too. For an ordinary sampler IdleTime is normally 0.</text>
<text x="20" y="510" font-size="11" opacity="0.8">Illustrative values for the Bookshelf API; Connect is only computed by the HTTP Request, TCP and JDBC samplers.</text>
</svg>
