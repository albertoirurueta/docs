<svg viewBox="0 0 900 880" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="880" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf: end-state architecture on AWS</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#5f6368">Region us-east-1 (placeholder), account 111122223333 (placeholder) -- schematic, not to scale. The earlier ECS stage
    (cluster bookshelf) is covered on the ECS pages.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Internet -->
  <ellipse cx="110" cy="92" rx="72" ry="27" fill="#e8eaed" stroke="#5f6368" stroke-width="1"/>
  <text x="110" y="88" text-anchor="middle" font-size="10.5" fill="#3c4043">Internet</text>
  <text x="110" y="101" text-anchor="middle" font-size="9" fill="#5f6368">users / browsers</text>

  <line x1="182" y1="92" x2="246" y2="92" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CloudFront -->
  <rect x="250" y="64" width="240" height="56" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="370" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#173d73">bookshelf-cdn</text>
  <text x="370" y="99" text-anchor="middle" font-size="9" fill="#3c4043">CloudFront -- WAF, TLS (ACM), edge caching</text>

  <line x1="300" y1="120" x2="170" y2="168" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="440" y1="120" x2="620" y2="168" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- S3 static site -->
  <rect x="40" y="170" width="260" height="72" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="170" y="192" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d4c22">bookshelf-web-&lt;account-id&gt;</text>
  <text x="170" y="208" text-anchor="middle" font-size="9" fill="#0d4c22">S3 static site (SPA front end), private bucket</text>
  <text x="170" y="222" text-anchor="middle" font-size="9" fill="#0d4c22">+ bookshelf-uploads-&lt;account-id&gt; (covers, invoices)</text>
  <text x="170" y="236" text-anchor="middle" font-size="8.5" fill="#5f6368">read only through CloudFront origin access control (OAC)</text>

  <!-- API Gateway -->
  <rect x="520" y="170" width="260" height="72" rx="7" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="650" y="192" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a4a00">bookshelf-api</text>
  <text x="650" y="208" text-anchor="middle" font-size="9" fill="#7a4a00">API Gateway HTTP API</text>
  <text x="650" y="222" text-anchor="middle" font-size="9" fill="#7a4a00">JWT authorizer, throttling, CORS</text>
  <text x="650" y="236" text-anchor="middle" font-size="8.5" fill="#5f6368">VPC link to alb-bookshelf</text>


  <!-- VPC outer box -->
  <rect x="380" y="270" width="460" height="450" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="396" y="292" font-size="13" font-weight="700" fill="#173d73">bookshelf VPC</text>
  <text x="396" y="307" font-size="9.5" fill="#3c4043">10.0.0.0/16 -- public, private and isolated subnets, two AZs</text>

  <!-- Public subnet / ALB -->
  <rect x="400" y="318" width="420" height="54" rx="8" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="414" y="336" font-size="11" font-weight="700" fill="#7a4a00">public subnets -- alb-bookshelf (Application Load Balancer), NAT gateway</text>
  <text x="414" y="355" font-size="8.5" fill="#5f6368">pods registered by the AWS Load Balancer Controller (Gateway API)</text>

  <!-- EKS subnet -->
  <rect x="400" y="382" width="420" height="152" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="414" y="400" font-size="11" font-weight="700" fill="#0d4c22">private app subnets -- bookshelf-eks (EKS, Pod Identity)</text>

  <rect x="414" y="410" width="130" height="112" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="479" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">catalog-api</text>
  <text x="479" y="444" text-anchor="middle" font-size="8.5" fill="#3c4043">Deployment</text>
  <text x="479" y="457" text-anchor="middle" font-size="8.5" fill="#3c4043">+ HPA / Karpenter</text>
  <text x="479" y="476" text-anchor="middle" font-size="8" fill="#5f6368">Pod Identity role</text>
  <text x="479" y="488" text-anchor="middle" font-size="8" fill="#5f6368">reads bookshelf-catalog</text>
  <text x="479" y="500" text-anchor="middle" font-size="8" fill="#5f6368">and bookshelf-cache</text>

  <rect x="554" y="410" width="130" height="112" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="619" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">orders-api</text>
  <text x="619" y="444" text-anchor="middle" font-size="8.5" fill="#3c4043">Deployment</text>
  <text x="619" y="457" text-anchor="middle" font-size="8.5" fill="#3c4043">+ HPA / Karpenter</text>
  <text x="619" y="476" text-anchor="middle" font-size="8" fill="#5f6368">Pod Identity role</text>
  <text x="619" y="488" text-anchor="middle" font-size="8" fill="#5f6368">reads/writes Orders</text>
  <text x="619" y="500" text-anchor="middle" font-size="8" fill="#5f6368">(DynamoDB), sends to SQS</text>

  <rect x="694" y="410" width="114" height="112" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="751" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">Cluster-wide</text>
  <text x="751" y="444" text-anchor="middle" font-size="8.5" fill="#3c4043">+ ConfigMaps</text>
  <text x="751" y="460" text-anchor="middle" font-size="8" fill="#5f6368">secrets from</text>
  <text x="751" y="472" text-anchor="middle" font-size="8" fill="#5f6368">Secrets Manager,</text>
  <text x="751" y="484" text-anchor="middle" font-size="8" fill="#5f6368">settings from</text>
  <text x="751" y="496" text-anchor="middle" font-size="8" fill="#5f6368">Parameter Store</text>
  <text x="751" y="508" text-anchor="middle" font-size="8" fill="#5f6368">and AppConfig</text>

  <line x1="620" y1="372" x2="620" y2="410" stroke="#188038" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Data subnets -->
  <rect x="400" y="544" width="420" height="166" rx="8" fill="#f4e8fd" stroke="#8430ce" stroke-width="1.2"/>
  <text x="414" y="562" font-size="11" font-weight="700" fill="#5a1a99">isolated data subnets and VPC endpoints (no internet route)</text>

  <rect x="410" y="574" width="92" height="124" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="456" y="592" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">Aurora</text>
  <text x="456" y="608" text-anchor="middle" font-size="8" fill="#3c4043">bookshelf-catalog</text>
  <text x="456" y="621" text-anchor="middle" font-size="7.5" fill="#5f6368">PostgreSQL</text>
  <text x="456" y="633" text-anchor="middle" font-size="7.5" fill="#5f6368">Serverless v2</text>
  <text x="456" y="647" text-anchor="middle" font-size="7.5" fill="#5f6368">db: catalog</text>

  <rect x="510" y="574" width="92" height="124" rx="-94" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="556" y="592" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">ElastiCache</text>
  <text x="556" y="608" text-anchor="middle" font-size="8" fill="#3c4043">bookshelf-cache</text>
  <text x="556" y="621" text-anchor="middle" font-size="7.5" fill="#5f6368">Valkey</text>
  <text x="556" y="633" text-anchor="middle" font-size="7.5" fill="#5f6368">serverless</text>

  <rect x="610" y="574" width="92" height="124" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="656" y="592" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">DynamoDB</text>
  <text x="656" y="608" text-anchor="middle" font-size="8" fill="#3c4043">Orders</text>
  <text x="656" y="621" text-anchor="middle" font-size="7.5" fill="#5f6368">on-demand table</text>
  <text x="656" y="633" text-anchor="middle" font-size="7.5" fill="#5f6368">via gateway</text>
  <text x="656" y="645" text-anchor="middle" font-size="7.5" fill="#5f6368">endpoint</text>

  <rect x="710" y="574" width="102" height="124" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="761" y="592" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">Config and keys</text>
  <text x="761" y="608" text-anchor="middle" font-size="8" fill="#3c4043">bookshelf/catalog/db</text>
  <text x="761" y="621" text-anchor="middle" font-size="7.5" fill="#5f6368">Secrets Manager</text>
  <text x="761" y="633" text-anchor="middle" font-size="7.5" fill="#5f6368">/bookshelf/*</text>
  <text x="761" y="645" text-anchor="middle" font-size="7.5" fill="#5f6368">Parameter Store</text>
  <text x="761" y="657" text-anchor="middle" font-size="7.5" fill="#5f6368">AppConfig, KMS</text>
  <text x="761" y="671" text-anchor="middle" font-size="7.5" fill="#5f6368">(interface endpoints)</text>

  <line x1="479" y1="522" x2="456" y2="574" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="619" y1="522" x2="656" y2="574" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="479" y1="522" x2="556" y2="574" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="760" y1="242" x2="760" y2="318" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Client VPN -->
  <rect x="40" y="512" width="260" height="90" rx="8" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="170" y="534" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a00">cvpn-bookshelf</text>
  <text x="170" y="550" text-anchor="middle" font-size="9" fill="#7a4a00">Client VPN endpoint (or Site-to-Site VPN)</text>
  <text x="170" y="564" text-anchor="middle" font-size="8.5" fill="#5f6368">admin/operator access into the data subnets,</text>
  <text x="170" y="577" text-anchor="middle" font-size="8.5" fill="#5f6368">e.g. psql against bookshelf-catalog</text>
  <text x="170" y="591" text-anchor="middle" font-size="8" fill="#5f6368">associated with a subnet of the VPC</text>

  <line x1="300" y1="557" x2="400" y2="557" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <ellipse cx="170" cy="660" rx="120" ry="30" fill="#f1f3f4" stroke="#5f6368" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="170" y="656" text-anchor="middle" font-size="10" fill="#3c4043">Admin laptop / on-premises</text>
  <text x="170" y="670" text-anchor="middle" font-size="8.5" fill="#5f6368">VPN client or customer gateway</text>

  <line x1="170" y1="630" x2="170" y2="602" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Event-driven: SQS, Lambda notifier, thumbnailer, SES -->
  <rect x="40" y="290" width="150" height="60" rx="7" fill="#e0f7fa" stroke="#00707f" stroke-width="1.2"/>
  <text x="115" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00505c">SQS order queue</text>
  <text x="115" y="327" text-anchor="middle" font-size="8.5" fill="#00505c">orders-api sends events</text>
  <text x="115" y="340" text-anchor="middle" font-size="8" fill="#5f6368">with a dead-letter queue</text>

  <line x1="190" y1="320" x2="214" y2="320" stroke="#00707f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="218" y="290" width="150" height="60" rx="7" fill="#e0f7fa" stroke="#00707f" stroke-width="1.2"/>
  <text x="293" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00505c">notifier (Lambda)</text>
  <text x="293" y="327" text-anchor="middle" font-size="8.5" fill="#00505c">SQS event source mapping</text>
  <text x="293" y="340" text-anchor="middle" font-size="8" fill="#5f6368">sends confirmation email</text>


  <rect x="218" y="392" width="150" height="60" rx="7" fill="#e0f7fa" stroke="#00707f" stroke-width="1.2"/>
  <text x="293" y="414" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00505c">Amazon SES</text>
  <text x="293" y="429" text-anchor="middle" font-size="8.5" fill="#00505c">no-reply@example.com</text>
  <text x="293" y="442" text-anchor="middle" font-size="8" fill="#5f6368">DKIM, SPF, DMARC, out of sandbox</text>

  <line x1="293" y1="350" x2="293" y2="392" stroke="#00707f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="392" width="150" height="60" rx="7" fill="#e0f7fa" stroke="#00707f" stroke-width="1.2"/>
  <text x="115" y="414" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00505c">thumbnailer (Lambda)</text>
  <text x="115" y="429" text-anchor="middle" font-size="8.5" fill="#00505c">S3 event notification</text>
  <text x="115" y="442" text-anchor="middle" font-size="8" fill="#5f6368">resizes uploaded covers</text>

  <polyline points="40,206 28,206 28,422 36,422" fill="none" stroke="#00707f" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- ECR -->
  <rect x="40" y="472" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1"/>
  <text x="170" y="491" text-anchor="middle" font-size="8" fill="#3c4043">ECR: bookshelf/catalog-api, orders-api, notifier</text>

  <!-- CloudWatch -->
  <rect x="40" y="750" width="820" height="100" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1"/>
  <text x="450" y="772" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3c4043">CloudWatch, CloudTrail and AWS Config</text>
  <text x="450" y="788" text-anchor="middle" font-size="9" fill="#5f6368">metrics, logs and alarms from CloudFront, API Gateway, the ALB, EKS, Lambda, the databases and SES;</text>
  <text x="450" y="802" text-anchor="middle" font-size="9" fill="#5f6368">API calls recorded by CloudTrail; budgets and cost alerts watch the whole account</text>
  <text x="450" y="824" text-anchor="middle" font-size="9" fill="#5f6368">IAM roles (Pod Identity, Lambda execution roles) replace long-lived keys everywhere</text>
  <text x="450" y="840" text-anchor="middle" font-size="9" fill="#5f6368">schematic: some data flows and endpoints are omitted for legibility</text>

  <line x1="370" y1="120" x2="370" y2="750" stroke="#5f6368" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
</svg>
