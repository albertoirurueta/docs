<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Android platform software stack</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Android platform software stack</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">from an installed app down to the Linux kernel drivers that talk to the hardware</text>

  <rect x="120" y="56" width="520" height="50" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="77.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Apps</text>
  <text x="380.0" y="92.8" font-size="9.5" fill="#333333" text-anchor="middle">system apps (Phone, Camera, Settings) and third-party apps -- e.g. TrailMate -- all run as equal peers</text>
  <line x1="380" y1="106" x2="380" y2="118" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="120" y="118" width="520" height="50" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="139.2" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Java/Kotlin API Framework</text>
  <text x="380.0" y="154.8" font-size="9.5" fill="#333333" text-anchor="middle">Activity/Fragment/View/Compose, Content Providers, Resource, Notification and Package Managers</text>
  <line x1="380" y1="168" x2="380" y2="180" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="120" y="180" width="250" height="62" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="245.0" y="201.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Android Runtime (ART)</text>
  <text x="245.0" y="216.8" font-size="9.5" fill="#333333" text-anchor="middle">runs each app's own process;</text>
  <text x="245.0" y="230.8" font-size="9.5" fill="#333333" text-anchor="middle">ahead-of-time + JIT compilation, GC</text>

  <rect x="390" y="180" width="250" height="62" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="515.0" y="201.2" font-size="12" font-weight="bold" fill="#1f6b6b" text-anchor="middle">Native C/C++ Libraries</text>
  <text x="515.0" y="216.8" font-size="9.5" fill="#333333" text-anchor="middle">libc, WebKit, SQLite, OpenGL ES,</text>
  <text x="515.0" y="230.8" font-size="9.5" fill="#333333" text-anchor="middle">Skia, Media framework, SSL</text>
  <line x1="245" y1="242" x2="245" y2="254" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="515" y1="242" x2="515" y2="254" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="245" y1="254" x2="515" y2="254" stroke="#444444" stroke-width="1.4"/>
  <line x1="380" y1="254" x2="380" y2="266" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="120" y="266" width="520" height="50" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="287.2" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">Hardware Abstraction Layer (HAL)</text>
  <text x="380.0" y="302.8" font-size="9.5" fill="#333333" text-anchor="middle">standard interfaces (camera, audio, sensors, Bluetooth, GPU) that hide vendor driver differences</text>
  <line x1="380" y1="316" x2="380" y2="328" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="120" y="328" width="520" height="50" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380.0" y="349.2" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Linux Kernel</text>
  <text x="380.0" y="364.8" font-size="9.5" fill="#333333" text-anchor="middle">process/memory management, security (SELinux), power management, device drivers, Binder IPC</text>
  <line x1="380" y1="378" x2="380" y2="390" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="120" y="390" width="520" height="46" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="418.0" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Hardware (SoC, sensors, radios, display, storage)</text>

  <rect x="660" y="180" width="90" height="120" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="705.0" y="205.5" font-size="9.5" font-weight="bold" fill="#5b3a8c" text-anchor="middle">Binder IPC</text>
  <text x="705.0" y="220.5" font-size="9" fill="#333333" text-anchor="middle">every</text>
  <text x="705.0" y="233.5" font-size="9" fill="#333333" text-anchor="middle">app-to-</text>
  <text x="705.0" y="246.5" font-size="9" fill="#333333" text-anchor="middle">system-</text>
  <text x="705.0" y="259.5" font-size="9" fill="#333333" text-anchor="middle">service call</text>
  <text x="705.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">crosses this</text>
  <text x="705.0" y="285.5" font-size="9" fill="#333333" text-anchor="middle">kernel driver</text>
  <line x1="640" y1="200" x2="660" y2="200" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <rect x="10" y="118" width="95" height="70" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="57.5" y="141.2" font-size="9" fill="#333333" text-anchor="middle">each app runs</text>
  <text x="57.5" y="154.2" font-size="9" fill="#333333" text-anchor="middle">in its own ART</text>
  <text x="57.5" y="167.2" font-size="9" fill="#333333" text-anchor="middle">process, sandboxed</text>
  <line x1="105" y1="153" x2="120" y2="153" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="380.0" y="452" font-size="9" fill="#888888" text-anchor="middle">Every layer talks only to the one directly below it; apps never call HAL or kernel APIs directly.</text>
</svg>
