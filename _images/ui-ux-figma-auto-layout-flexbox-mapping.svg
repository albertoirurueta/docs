<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Auto layout properties and their CSS Flexbox counterparts</text>
  <rect x="20" y="46" width="720" height="32" rx="6" fill="#4F46E5"/>
  <g font-size="13" font-weight="bold" fill="#FFFFFF"><text x="36" y="67">Auto layout (UI3)</text><text x="296" y="67">Approximate CSS</text><text x="560" y="67">Note</text></g>
  <g font-size="12" fill="#374151">
    <rect x="20" y="78" width="720" height="30" fill="#EEF2FF"/><text x="36" y="98">Direction: horizontal / vertical</text><text x="296" y="98">flex-direction: row / column</text><text x="560" y="98">Grid flow is CSS Grid</text>
    <text x="36" y="128">Gap (number)</text><text x="296" y="128">gap</text><text x="560" y="128">Can be negative in Figma</text>
    <rect x="20" y="138" width="720" height="30" fill="#EEF2FF"/><text x="36" y="158">Auto gap: Between / Around / Evenly</text><text x="296" y="158">justify-content: space-between / -around / -evenly</text><text x="560" y="158">Flow only, not grid</text>
    <text x="36" y="188">Padding</text><text x="296" y="188">padding</text><text x="560" y="188">Per axis or per side</text>
    <rect x="20" y="198" width="720" height="30" fill="#EEF2FF"/><text x="36" y="218">Alignment box (main / cross axis)</text><text x="296" y="218">justify-content, align-items</text><text x="560" y="218">Baseline option exists</text>
    <text x="36" y="248">Hug contents</text><text x="296" y="248">width / height: auto (fit-content)</text><text x="560" y="248">Auto layout frames only</text>
    <rect x="20" y="258" width="720" height="30" fill="#EEF2FF"/><text x="36" y="278">Fill container</text><text x="296" y="278">flex-grow: 1 (main axis)</text><text x="560" y="278">Cross axis: align-self: stretch</text>
    <text x="36" y="308">Fixed width / height</text><text x="296" y="308">width / height: a length</text><text x="560" y="308">Also set by typing a value</text>
    <rect x="20" y="318" width="720" height="30" fill="#EEF2FF"/><text x="36" y="338">Min / max width and height</text><text x="296" y="338">min-width, max-height, ...</text><text x="560" y="338">May be number variables</text>
    <text x="36" y="368">Wrap</text><text x="296" y="368">flex-wrap: wrap</text><text x="560" y="368">Horizontal and vertical</text>
    <rect x="20" y="378" width="720" height="30" fill="#EEF2FF"/><text x="36" y="398">Ignore auto layout</text><text x="296" y="398">position: absolute</text><text x="560" y="398">Constraints apply to it</text>
  </g>
</svg>
