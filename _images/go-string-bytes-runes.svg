<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One string, two views: s := "Café 日本"</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">s is 12 bytes of UTF-8 (indexing and len count these); ranging over s decodes them into 7 runes</text>
  <g font-size="12" font-weight="bold" fill="#555555">
    <text x="20" y="108">runes</text><text x="20" y="122" font-weight="normal">(code points)</text>
    <text x="20" y="196">bytes</text><text x="20" y="210" font-weight="normal">(s[i], type byte)</text>
    <text x="20" y="246">index i</text>
    <text x="20" y="286">range i</text>
  </g>
  <g font-family="Courier New, monospace">
    <rect x="120" y="70" width="60" height="64" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="150" y="102" font-size="24" fill="#222222" text-anchor="middle">C</text>
    <text x="150" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+0043</text>
    <rect x="180" y="70" width="60" height="64" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="210" y="102" font-size="24" fill="#222222" text-anchor="middle">a</text>
    <text x="210" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+0061</text>
    <rect x="240" y="70" width="60" height="64" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="270" y="102" font-size="24" fill="#222222" text-anchor="middle">f</text>
    <text x="270" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+0066</text>
    <rect x="300" y="70" width="120" height="64" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="360" y="102" font-size="24" fill="#222222" text-anchor="middle">é</text>
    <text x="360" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+00E9</text>
    <rect x="420" y="70" width="60" height="64" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="450" y="102" font-size="24" fill="#222222" text-anchor="middle"> </text>
    <text x="450" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+0020</text>
    <rect x="480" y="70" width="180" height="64" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
    <text x="570" y="102" font-size="24" fill="#222222" text-anchor="middle">日</text>
    <text x="570" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+65E5</text>
    <rect x="660" y="70" width="180" height="64" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
    <text x="750" y="102" font-size="24" fill="#222222" text-anchor="middle">本</text>
    <text x="750" y="124" font-size="12" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">U+672C</text>
  </g>
  <g>
    <line x1="120" y1="134" x2="120" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="180" y1="134" x2="180" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="180" y1="134" x2="180" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="240" y1="134" x2="240" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="240" y1="134" x2="240" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="300" y1="134" x2="300" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="300" y1="134" x2="300" y2="170" stroke="#2e7d32" stroke-dasharray="3,3"/>
    <line x1="420" y1="134" x2="420" y2="170" stroke="#2e7d32" stroke-dasharray="3,3"/>
    <line x1="420" y1="134" x2="420" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="480" y1="134" x2="480" y2="170" stroke="#1c4b73" stroke-dasharray="3,3"/>
    <line x1="480" y1="134" x2="480" y2="170" stroke="#b26a00" stroke-dasharray="3,3"/>
    <line x1="660" y1="134" x2="660" y2="170" stroke="#b26a00" stroke-dasharray="3,3"/>
    <line x1="660" y1="134" x2="660" y2="170" stroke="#b26a00" stroke-dasharray="3,3"/>
    <line x1="840" y1="134" x2="840" y2="170" stroke="#b26a00" stroke-dasharray="3,3"/>
  </g>
  <g font-family="Courier New, monospace">
    <rect x="120" y="170" width="60" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="150" y="198" font-size="15" fill="#222222" text-anchor="middle">0x43</text>
    <rect x="180" y="170" width="60" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="210" y="198" font-size="15" fill="#222222" text-anchor="middle">0x61</text>
    <rect x="240" y="170" width="60" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="270" y="198" font-size="15" fill="#222222" text-anchor="middle">0x66</text>
    <rect x="300" y="170" width="60" height="44" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="330" y="198" font-size="15" fill="#222222" text-anchor="middle">0xc3</text>
    <rect x="360" y="170" width="60" height="44" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="390" y="198" font-size="15" fill="#222222" text-anchor="middle">0xa9</text>
    <rect x="420" y="170" width="60" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="450" y="198" font-size="15" fill="#222222" text-anchor="middle">0x20</text>
    <rect x="480" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="510" y="198" font-size="15" fill="#222222" text-anchor="middle">0xe6</text>
    <rect x="540" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="570" y="198" font-size="15" fill="#222222" text-anchor="middle">0x97</text>
    <rect x="600" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="630" y="198" font-size="15" fill="#222222" text-anchor="middle">0xa5</text>
    <rect x="660" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="690" y="198" font-size="15" fill="#222222" text-anchor="middle">0xe6</text>
    <rect x="720" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="750" y="198" font-size="15" fill="#222222" text-anchor="middle">0x9c</text>
    <rect x="780" y="170" width="60" height="44" fill="#fff4e0" stroke="#b26a00"/>
    <text x="810" y="198" font-size="15" fill="#222222" text-anchor="middle">0xac</text>
  </g>
  <g font-size="13" fill="#444444" font-family="Courier New, monospace">
    <text x="150" y="246" text-anchor="middle">0</text>
    <text x="210" y="246" text-anchor="middle">1</text>
    <text x="270" y="246" text-anchor="middle">2</text>
    <text x="330" y="246" text-anchor="middle">3</text>
    <text x="390" y="246" text-anchor="middle">4</text>
    <text x="450" y="246" text-anchor="middle">5</text>
    <text x="510" y="246" text-anchor="middle">6</text>
    <text x="570" y="246" text-anchor="middle">7</text>
    <text x="630" y="246" text-anchor="middle">8</text>
    <text x="690" y="246" text-anchor="middle">9</text>
    <text x="750" y="246" text-anchor="middle">10</text>
    <text x="810" y="246" text-anchor="middle">11</text>
  </g>
  <g font-size="13" fill="#1c4b73" font-family="Courier New, monospace">
    <text x="150" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">0</text>
    <text x="210" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">1</text>
    <text x="270" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">2</text>
    <text x="330" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">3</text>
    <text x="450" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">5</text>
    <text x="510" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">6</text>
    <text x="690" y="286" text-anchor="middle" font-weight="bold" fill="#1c4b73">9</text>
  </g>
  <g font-size="12" fill="#444444">
    <rect x="120" y="312" width="16" height="16" fill="#e8f0f8" stroke="#1c4b73"/><text x="144" y="325">1 byte (ASCII)</text>
    <rect x="290" y="312" width="16" height="16" fill="#e9f5e9" stroke="#2e7d32"/><text x="314" y="325">2 bytes</text>
    <rect x="460" y="312" width="16" height="16" fill="#fff4e0" stroke="#b26a00"/><text x="484" y="325">3 bytes</text>
  </g>
  <g font-size="13" fill="#222222" font-family="Courier New, monospace">
    <text x="120" y="356">len(s) == 12    utf8.RuneCountInString(s) == 7    s[3] == 0xc3 (half of é)</text>
    <text x="120" y="378">s[:4] cuts é in half     []rune(s)[3] == &apos;é&apos;     range i never lands on 4, 7, 8, 10, 11</text>
  </g>
</svg>
