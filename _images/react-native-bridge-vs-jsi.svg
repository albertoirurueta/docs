<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Legacy bridge vs. JSI: the same native call, two paths</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Serialized and asynchronous (removed 0.82-0.84) versus direct and synchronous (JSI, every app since 0.82)</text>

  <defs>
    <marker id="bj-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Legacy bridge path -->
  <text x="30" y="72" font-size="14" font-weight="bold" fill="#a33">Legacy bridge (removed in 0.84)</text>

  <rect x="30" y="90" width="130" height="60" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="95" y="115" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">JS thread</text>
  <text x="95" y="131" font-size="9.5" fill="#333333" text-anchor="middle">calls native module</text>

  <line x1="160" y1="120" x2="230" y2="120" stroke="#a33" stroke-width="1.4" marker-end="url(#bj-arrow)"/>
  <text x="195" y="110" font-size="9" fill="#a33" text-anchor="middle">serialize</text>
  <text x="195" y="140" font-size="9" fill="#a33" text-anchor="middle">to JSON</text>

  <rect x="235" y="90" width="130" height="60" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="300" y="112" font-size="10.5" font-weight="bold" fill="#a33" text-anchor="middle">Message queue</text>
  <text x="300" y="128" font-size="9.5" fill="#333333" text-anchor="middle">async, batched</text>
  <text x="300" y="142" font-size="9.5" fill="#333333" text-anchor="middle">JSON messages</text>

  <line x1="365" y1="120" x2="435" y2="120" stroke="#a33" stroke-width="1.4" marker-end="url(#bj-arrow)"/>
  <text x="400" y="110" font-size="9" fill="#a33" text-anchor="middle">deserialize</text>

  <rect x="440" y="90" width="130" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="505" y="112" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native module</text>
  <text x="505" y="128" font-size="9.5" fill="#333333" text-anchor="middle">runs on the native</text>
  <text x="505" y="142" font-size="9.5" fill="#333333" text-anchor="middle">thread</text>

  <line x1="505" y1="150" x2="505" y2="175" stroke="#a33" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="505" y1="175" x2="95" y2="175" stroke="#a33" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#bj-arrow)"/>
  <text x="300" y="190" font-size="9" fill="#a33" text-anchor="middle">response makes the same serialize/queue/deserialize round trip back, asynchronously</text>

  <!-- divider -->
  <line x1="20" y1="220" x2="740" y2="220" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- JSI path -->
  <text x="30" y="252" font-size="14" font-weight="bold" fill="#2d6a34">JSI (every app since React Native 0.82)</text>

  <rect x="30" y="270" width="150" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="105" y="296" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">JS thread</text>
  <text x="105" y="312" font-size="9.5" fill="#333333" text-anchor="middle">holds a direct C++</text>
  <text x="105" y="326" font-size="9.5" fill="#333333" text-anchor="middle">host object reference</text>

  <line x1="180" y1="295" x2="290" y2="295" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#bj-arrow)"/>
  <line x1="290" y1="320" x2="180" y2="320" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#bj-arrow)"/>
  <text x="235" y="285" font-size="9.5" fill="#2d6a34" text-anchor="middle">synchronous call</text>
  <text x="235" y="338" font-size="9.5" fill="#2d6a34" text-anchor="middle">return value, same call</text>

  <rect x="295" y="270" width="150" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="370" y="296" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Fabric / Turbo Module</text>
  <text x="370" y="312" font-size="9.5" fill="#333333" text-anchor="middle">C++ host object,</text>
  <text x="370" y="326" font-size="9.5" fill="#333333" text-anchor="middle">no JSON in between</text>

  <text x="380" y="395" font-size="10.5" fill="#666666" text-anchor="middle">Same native call, no serialization step and no async round trip -- JSI removes both.</text>
</svg>
