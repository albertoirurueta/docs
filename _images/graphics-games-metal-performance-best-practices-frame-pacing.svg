<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-performance-best-practices-frame-pacing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Frames in flight: CPU, GPU and display overlap</text>
<text x="95" y="70" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">CPU</text>
<text x="95" y="140" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">GPU</text>
<text x="95" y="210" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Display</text>
<rect x="150" y="50" width="130" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="215.0" y="71.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">encode frame 1</text>
<rect x="190" y="120" width="130" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="255.0" y="141.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">render frame 1</text>
<rect x="300" y="50" width="130" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="365.0" y="71.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">encode frame 2</text>
<rect x="340" y="120" width="130" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="405.0" y="141.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">render frame 2</text>
<rect x="450" y="50" width="130" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="515.0" y="71.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">encode frame 3</text>
<rect x="490" y="120" width="130" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="555.0" y="141.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">render frame 3</text>
<rect x="300" y="192" width="100" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="350.0" y="213.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">show frame 1</text>
<rect x="450" y="192" width="100" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="500.0" y="213.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">show frame 2</text>
<rect x="600" y="192" width="100" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="213.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">show frame 3</text>
<line x1="180" y1="236" x2="180" y2="252" stroke="#4B5563" stroke-width="1.2"/>
<line x1="180" y1="240" x2="180" y2="64" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="330" y1="236" x2="330" y2="252" stroke="#4B5563" stroke-width="1.2"/>
<line x1="330" y1="240" x2="330" y2="64" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="480" y1="236" x2="480" y2="252" stroke="#4B5563" stroke-width="1.2"/>
<line x1="480" y1="240" x2="480" y2="64" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="630" y1="236" x2="630" y2="252" stroke="#4B5563" stroke-width="1.2"/>
<line x1="630" y1="240" x2="630" y2="64" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380" y="270" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vsync ticks (every 16.7 ms at 60 Hz, 8.3 ms at 120 Hz)</text>
<text x="380" y="298" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A semaphore with 2 or 3 tokens stops the CPU from running further ahead than the drawable pool.</text>
<text x="380" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each completed handler signals the semaphore; the draw callback waits on it before touching reused buffers.</text>
</svg>
