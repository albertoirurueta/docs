<svg viewBox="0 0 720 508" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="508" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Couchbase keyspace and the relational analogy</text>

  <text x="190" y="58" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Couchbase</text>
  <text x="530" y="58" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Relational (SQL)</text>

  <!-- Tier 1 -->
  <rect x="60" y="74" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="98" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">cluster</text>
  <text x="74" y="116" font-size="10.5" fill="#666666">nodes that share one configuration</text>
  <rect x="400" y="74" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="98" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">catalog</text>
  <text x="414" y="116" font-size="10.5" fill="#666666">a running server instance</text>

  <!-- Tier 2 -->
  <rect x="60" y="154" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="178" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">bucket</text>
  <text x="74" y="196" font-size="10.5" fill="#666666">RAM quota, replicas, storage engine</text>
  <rect x="400" y="154" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="178" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">database</text>
  <text x="414" y="196" font-size="10.5" fill="#666666">CREATE DATABASE</text>

  <!-- Tier 3 -->
  <rect x="60" y="234" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="258" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">scope</text>
  <text x="74" y="276" font-size="10.5" fill="#666666">_default; _system (7.6); &#8776; a schema</text>
  <rect x="400" y="234" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="258" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">schema</text>
  <text x="414" y="276" font-size="10.5" fill="#666666">CREATE SCHEMA</text>

  <!-- Tier 4 -->
  <rect x="60" y="314" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="338" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">collection</text>
  <text x="74" y="356" font-size="10.5" fill="#666666">&#8776; a table; fields not fixed</text>
  <rect x="400" y="314" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="338" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">table</text>
  <text x="414" y="356" font-size="10.5" fill="#666666">CREATE TABLE, fixed column list</text>

  <!-- Tier 5 -->
  <rect x="60" y="394" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="418" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">document</text>
  <text x="74" y="436" font-size="10.5" fill="#666666">JSON, keyed by id, up to 20 MiB</text>
  <rect x="400" y="394" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="418" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">row</text>
  <text x="414" y="436" font-size="10.5" fill="#666666">one tuple, fixed arity</text>

  <!-- vertical connectors, Couchbase side -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="190" y1="128" x2="190" y2="146"/>
    <polygon points="184,146 196,146 190,154" stroke="none"/>
    <line x1="190" y1="208" x2="190" y2="226"/>
    <polygon points="184,226 196,226 190,234" stroke="none"/>
    <line x1="190" y1="288" x2="190" y2="306"/>
    <polygon points="184,306 196,306 190,314" stroke="none"/>
    <line x1="190" y1="368" x2="190" y2="386"/>
    <polygon points="184,386 196,386 190,394" stroke="none"/>
  </g>

  <!-- vertical connectors, relational side -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="530" y1="128" x2="530" y2="146"/>
    <polygon points="524,146 536,146 530,154" stroke="none"/>
    <line x1="530" y1="208" x2="530" y2="226"/>
    <polygon points="524,226 536,226 530,234" stroke="none"/>
    <line x1="530" y1="288" x2="530" y2="306"/>
    <polygon points="524,306 536,306 530,314" stroke="none"/>
    <line x1="530" y1="368" x2="530" y2="386"/>
    <polygon points="524,386 536,386 530,394" stroke="none"/>
  </g>

  <!-- horizontal "maps to" links -->
  <g stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="320" y1="101" x2="400" y2="101"/>
    <line x1="320" y1="181" x2="400" y2="181"/>
    <line x1="320" y1="261" x2="400" y2="261"/>
    <line x1="320" y1="341" x2="400" y2="341"/>
    <line x1="320" y1="421" x2="400" y2="421"/>
  </g>
  <g font-size="10" fill="#666666" text-anchor="middle">
    <text x="360" y="96">maps to</text>
    <text x="360" y="176">maps to</text>
    <text x="360" y="256">maps to</text>
    <text x="360" y="336">maps to</text>
    <text x="360" y="416">maps to</text>
  </g>

  <text x="360" y="470" font-size="11" fill="#444444" text-anchor="middle">The tiers line up one-to-one &#8212; but a Couchbase collection never forces its documents to share one column list,</text>
  <text x="360" y="488" font-size="11" fill="#444444" text-anchor="middle">and scopes and collections are created dynamically at runtime, not fixed by a schema migration.</text>
</svg>
