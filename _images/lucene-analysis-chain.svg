<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Lucene analysis pipeline: text &#8594; terms with positions &amp; offsets</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">Offsets always point back into the ORIGINAL input; removing a token leaves a position gap</text>

  <!-- Stage 1: input -->
  <rect x="40" y="58" width="680" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="78" font-size="12" font-weight="bold" fill="#222222">Input text</text>
  <text x="56" y="98" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">&lt;b&gt;The 2 QUICK&lt;/b&gt; Brown-Foxes jumped!</text>
  <text x="704" y="78" font-size="10.5" fill="#999999" text-anchor="end">char index 0 .. 37</text>

  <path d="M380,110 L380,126" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,124 386,124 380,132" fill="#999999"/>

  <!-- Stage 2: char filters -->
  <rect x="40" y="134" width="680" height="58" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="154" font-size="12" font-weight="bold" fill="#2f5424">CharFilter chain</text>
  <text x="56" y="172" font-size="11" fill="#666666" font-family="'Courier New', monospace">htmlStrip</text>
  <text x="56" y="187" font-size="10.5" fill="#999999">rewrites characters, keeps an offset-correction map</text>
  <text x="410" y="164" font-size="11" fill="#666666">result</text>
  <text x="410" y="183" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">The 2 QUICK Brown-Foxes jumped!</text>

  <path d="M380,192 L380,208" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,206 386,206 380,214" fill="#999999"/>

  <!-- Stage 3: tokenizer -->
  <rect x="40" y="216" width="680" height="58" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="236" font-size="12" font-weight="bold" fill="#2f5424">Tokenizer</text>
  <text x="56" y="254" font-size="11" fill="#666666" font-family="'Courier New', monospace">standard</text>
  <text x="56" y="269" font-size="10.5" fill="#999999">splits on word boundaries; sets offset + position</text>
  <text x="410" y="246" font-size="11" fill="#666666">tokens</text>
  <text x="410" y="265" font-family="'Courier New', monospace" font-size="12" fill="#222222">[The] [2] [QUICK] [Brown] [Foxes] [jumped]</text>

  <path d="M380,274 L380,290" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,288 386,288 380,296" fill="#999999"/>

  <!-- Stage 4: token filters -->
  <rect x="40" y="298" width="680" height="86" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="318" font-size="12" font-weight="bold" fill="#2f5424">TokenFilter chain</text>
  <text x="56" y="336" font-size="11" fill="#666666" font-family="'Courier New', monospace">lowercase</text>
  <text x="56" y="354" font-size="11" fill="#666666" font-family="'Courier New', monospace">stop</text>
  <text x="56" y="374" font-size="10.5" fill="#999999">rewrite / drop tokens, in order</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="270" y="336" fill="#222222">&#8594; [the] [2] [quick] [brown] [foxes] [jumped]</text>
    <text x="270" y="354" fill="#222222">&#8594; [2] [quick] [brown] [foxes] [jumped]</text>
  </g>
  <text x="540" y="372" font-size="10.5" fill="#999999">"the" dropped &#8594; next token keeps its position</text>

  <path d="M380,384 L380,400" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,398 386,398 380,406" fill="#999999"/>

  <!-- Stage 5: indexed terms -->
  <rect x="40" y="408" width="680" height="76" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="56" y="428" font-size="12" font-weight="bold" fill="#222222">Indexed terms (term &#183; position &#183; offset into original)</text>
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#1c4b73">
    <text x="56" y="448">2      pos 2   [7,8]</text>
    <text x="250" y="448">quick   pos 3   [9,14]</text>
    <text x="470" y="448">brown   pos 4   [19,24]</text>
    <text x="56" y="466">foxes  pos 5   [25,30]</text>
    <text x="250" y="466">jumped  pos 6   [31,37]</text>
  </g>
  <text x="56" y="480" font-size="10" fill="#999999">position jumps 1 &#8594; 2 across the dropped stop word; a KeywordField would skip this entire chain</text>
</svg>
