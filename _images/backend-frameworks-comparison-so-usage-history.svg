<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 527" width="860" height="527" role="img" aria-labelledby="backend-so-usage-history-t backend-so-usage-history-d">
<title id="backend-so-usage-history-t">Stack Overflow survey: usage per year, 2019 to 2025</title>
<desc id="backend-so-usage-history-d">Share of respondents to the web frameworks question who used the framework. &quot;Spring&quot; (2019-2021) and &quot;Spring Boot&quot; (2023-2025) are shown as one series; no Spring answer in 2022.</desc>
