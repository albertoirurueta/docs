  <g stroke="#4F46E5" stroke-width="1.5">
    <line x1="238" y1="159" x2="238" y2="190"/><line x1="302" y1="159" x2="302" y2="190"/><line x1="330" y1="127" x2="330" y2="190"/><line x1="358" y1="159" x2="358" y2="190"/>
    <line x1="423" y1="159" x2="423" y2="190"/><line x1="479" y1="159" x2="479" y2="190"/><line x1="498" y1="127" x2="498" y2="190"/><line x1="529" y1="159" x2="529" y2="190"/>
    <line x1="590" y1="159" x2="590" y2="190"/><line x1="612" y1="127" x2="612" y2="190"/><line x1="640" y1="159" x2="640" y2="190"/><line x1="653" y1="127" x2="653" y2="190"/>
    <line x1="667" y1="95" x2="667" y2="190"/><line x1="688" y1="159" x2="688" y2="190"/>
  </g>
