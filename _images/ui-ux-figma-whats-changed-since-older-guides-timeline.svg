  <line x1="700" y1="70" x2="700" y2="250" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="700" y="268" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Checked</text>
  <text x="700" y="282" font-size="11" fill="#92400E" text-anchor="middle">2026-10-30</text>
