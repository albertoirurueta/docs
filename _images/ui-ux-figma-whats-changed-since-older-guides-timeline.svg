  </g>
  <g font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">
    <text x="67" y="251">S1 2022</text><text x="375" y="251">G 2024</text><text x="532" y="251">J 2025</text><text x="588" y="275">S3 2026</text>
  </g>
  <!-- legend -->
  <g fill="#4F46E5"><circle cx="48" cy="311" r="8"/><circle cx="48" cy="333" r="8"/><circle cx="48" cy="355" r="8"/><circle cx="48" cy="377" r="8"/><circle cx="48" cy="399" r="8"/><circle cx="48" cy="421" r="8"/><circle cx="48" cy="443" r="8"/>
  <circle cx="400" cy="311" r="8"/><circle cx="400" cy="333" r="8"/><circle cx="400" cy="355" r="8"/><circle cx="400" cy="377" r="8"/><circle cx="400" cy="399" r="8"/><circle cx="400" cy="421" r="8"/><circle cx="400" cy="443" r="8"/></g>
  <g fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">
