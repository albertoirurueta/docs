<svg viewBox="0 0 760 490" width="760" height="490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="490" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Figma from 2022 to 2026: when older guides stop matching</text>
  <text x="380" y="48" font-size="12" fill="#4B5563" text-anchor="middle">Numbered markers are product changes, amber tags are the four book publication dates</text>
  <!-- axis -->
  <line x1="50" y1="190" x2="722" y2="190" stroke="#4B5563" stroke-width="2"/>
  <g stroke="#E5E7EB" stroke-width="1"><line x1="184" y1="70" x2="184" y2="250"/><line x1="319" y1="70" x2="319" y2="250"/><line x1="453" y1="70" x2="453" y2="250"/><line x1="587" y1="70" x2="587" y2="250"/></g>
  <g stroke="#4B5563" stroke-width="2"><line x1="50" y1="184" x2="50" y2="196"/><line x1="184" y1="184" x2="184" y2="196"/><line x1="319" y1="184" x2="319" y2="196"/><line x1="453" y1="184" x2="453" y2="196"/><line x1="587" y1="184" x2="587" y2="196"/><line x1="722" y1="184" x2="722" y2="196"/></g>
  <g font-size="13" font-weight="bold" fill="#374151" text-anchor="middle"><text x="50" y="212">2022</text><text x="184" y="212">2023</text><text x="319" y="212">2024</text><text x="453" y="212">2025</text><text x="587" y="212">2026</text></g>
