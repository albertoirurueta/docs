    <text x="400" y="315">8</text><text x="400" y="337">9</text><text x="400" y="359">10</text><text x="400" y="381">11</text><text x="400" y="403">12</text><text x="400" y="425">13</text><text x="400" y="447">14</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="64" y="315">2023-05-24: scroll matched by layer name</text>
    <text x="64" y="337">2023-11-16: Mouse enter and Mouse leave</text>
    <text x="64" y="359">2024-01-31: Dev Mode is a paid seat feature</text>
    <text x="64" y="381">2024-04-16: variables generally available</text>
    <text x="64" y="403">2024-10-10: UI3 beta opened to everyone</text>
    <text x="64" y="425">2025-03-11: Full, Dev, Collab and View seats</text>
    <text x="64" y="447">2025-04-30: old interface retired, UI3 only</text>
    <text x="416" y="315">2025-07-24: Figma Make generally available</text>
    <text x="416" y="337">2026-01-07: left navigation bar redesigned</text>
    <text x="416" y="359">2026-03-05: slots in open beta</text>
    <text x="416" y="381">2026-05-22: grid flow generally available</text>
    <text x="416" y="403">2026-06-24: Figma Motion open beta</text>
    <text x="416" y="425">2026-08-03: projects renamed folders</text>
    <text x="416" y="447">2026-09-25 to 10-06: wrap, Motion export, agent</text>
  </g>
  <text x="380" y="478" font-size="11" fill="#6B7280" text-anchor="middle">Schematic. Dates follow Figma release notes and help articles checked on 2026-10-30.</text>
</svg>
