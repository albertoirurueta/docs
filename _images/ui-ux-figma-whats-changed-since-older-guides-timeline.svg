  <g fill="#4F46E5">
    <circle cx="238" cy="150" r="9"/><circle cx="302" cy="150" r="9"/><circle cx="330" cy="118" r="9"/><circle cx="358" cy="150" r="9"/>
    <circle cx="423" cy="150" r="9"/><circle cx="479" cy="150" r="9"/><circle cx="498" cy="118" r="9"/><circle cx="529" cy="150" r="9"/>
    <circle cx="590" cy="150" r="9"/><circle cx="612" cy="118" r="9"/><circle cx="640" cy="150" r="9"/><circle cx="653" cy="118" r="9"/>
    <circle cx="667" cy="86" r="9"/><circle cx="688" cy="150" r="9"/>
  </g>
  <g fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="238" y="154">1</text><text x="302" y="154">2</text><text x="330" y="122">3</text><text x="358" y="154">4</text><text x="423" y="154">5</text><text x="479" y="154">6</text><text x="498" y="122">7</text>
