  <g stroke="#B45309" stroke-width="1" stroke-dasharray="2 2"><line x1="67" y1="190" x2="67" y2="236"/><line x1="375" y1="190" x2="375" y2="236"/><line x1="532" y1="190" x2="532" y2="236"/><line x1="588" y1="190" x2="588" y2="260"/></g>
