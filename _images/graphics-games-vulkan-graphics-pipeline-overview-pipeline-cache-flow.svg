<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-gpo-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Pipeline cache: from disk to driver and back</text>
<rect x="15" y="70" width="132" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="81.0" y="102.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Start up</text>
<text x="81.0" y="117.8" text-anchor="middle" font-size="11" fill="#3730A3">read cache file</text>
<text x="81.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3">if it exists</text>
<circle cx="27" cy="66" r="11" fill="#4F46E5"/>
<text x="27" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="147" y1="114" x2="163" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-cache)"/>
<rect x="163" y="70" width="132" height="88" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="229.0" y="95.3" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Validate</text>
<text x="229.0" y="110.3" text-anchor="middle" font-size="11" fill="#92400E">header version,</text>
<text x="229.0" y="125.3" text-anchor="middle" font-size="11" fill="#92400E">vendorID, deviceID,</text>
<text x="229.0" y="140.3" text-anchor="middle" font-size="11" fill="#92400E">pipelineCacheUUID</text>
<circle cx="175" cy="66" r="11" fill="#B45309"/>
<text x="175" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="295" y1="114" x2="311" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-cache)"/>
<rect x="311" y="70" width="132" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="377.0" y="95.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Create cache</text>
<text x="377.0" y="110.3" text-anchor="middle" font-size="11" fill="#3730A3">vkCreate</text>
<text x="377.0" y="125.3" text-anchor="middle" font-size="11" fill="#3730A3">PipelineCache</text>
<text x="377.0" y="140.3" text-anchor="middle" font-size="11" fill="#3730A3">with pInitialData</text>
<circle cx="323" cy="66" r="11" fill="#4F46E5"/>
<text x="323" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="443" y1="114" x2="459" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-cache)"/>
<rect x="459" y="70" width="132" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="525.0" y="95.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Create pipelines</text>
<text x="525.0" y="110.3" text-anchor="middle" font-size="11" fill="#3730A3">vkCreateGraphics</text>
<text x="525.0" y="125.3" text-anchor="middle" font-size="11" fill="#3730A3">Pipelines with</text>
<text x="525.0" y="140.3" text-anchor="middle" font-size="11" fill="#3730A3">the cache handle</text>
<circle cx="471" cy="66" r="11" fill="#4F46E5"/>
<text x="471" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="591" y1="114" x2="607" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-cache)"/>
<rect x="607" y="70" width="132" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="673.0" y="95.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Shut down</text>
<text x="673.0" y="110.3" text-anchor="middle" font-size="11" fill="#3730A3">vkGetPipeline</text>
<text x="673.0" y="125.3" text-anchor="middle" font-size="11" fill="#3730A3">CacheData, then</text>
<text x="673.0" y="140.3" text-anchor="middle" font-size="11" fill="#3730A3">write the file</text>
<circle cx="619" cy="66" r="11" fill="#4F46E5"/>
<text x="619" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<rect x="20" y="210" width="330" height="120" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="185.0" y="243.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Threading</text>
<text x="185.0" y="258.9" text-anchor="middle" font-size="11" fill="#374151">Threads may each own a cache, then combine them</text>
<text x="185.0" y="273.9" text-anchor="middle" font-size="11" fill="#374151">with vkMergePipelineCaches before saving.</text>
<text x="185.0" y="288.9" text-anchor="middle" font-size="11" fill="#374151">The EXTERNALLY_SYNCHRONIZED flag removes the</text>
<text x="185.0" y="303.9" text-anchor="middle" font-size="11" fill="#374151">driver lock if you guarantee single-thread use.</text>
<rect x="380" y="210" width="360" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="243.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Robustness</text>
<text x="560.0" y="258.9" text-anchor="middle" font-size="11" fill="#92400E">A mismatched header means the blob is for another</text>
<text x="560.0" y="273.9" text-anchor="middle" font-size="11" fill="#92400E">GPU or driver: discard it and start empty.</text>
<text x="560.0" y="288.9" text-anchor="middle" font-size="11" fill="#92400E">The driver can also keep its own on-disk cache,</text>
<text x="560.0" y="303.9" text-anchor="middle" font-size="11" fill="#92400E">so a missing file costs time but not correctness.</text>
</svg>
