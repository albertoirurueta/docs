<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-labelledby="t d">
<title id="t">Structure of a VSAM key-sequenced data set</title>
<desc id="d">An index set record points to sequence set records, each of which points to the control intervals of one control area; each control interval holds records in key order, free space and control information.</desc>
