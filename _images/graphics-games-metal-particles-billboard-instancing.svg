<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-particles-billboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One quad per particle, facing the camera</text>
<rect x="90" y="112" width="150" height="150" rx="2" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<polygon points="90,262 240,262 90,112" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-width="1"/>
<polygon points="240,262 90,112 240,112" fill="#B45309" fill-opacity="0.15" stroke="#B45309" stroke-width="1"/>
<circle cx="90" cy="262" r="5" fill="#1F2937"/>
<text x="74" y="278" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">0</text>
<circle cx="240" cy="262" r="5" fill="#1F2937"/>
<text x="256" y="278" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">1</text>
<circle cx="90" cy="112" r="5" fill="#1F2937"/>
<text x="74" y="104" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">2</text>
<circle cx="240" cy="112" r="5" fill="#1F2937"/>
<text x="256" y="104" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">3</text>
<text x="165.0" y="304" text-anchor="middle" font-size="12" fill="#374151">vertex_id 0 to 3, corner = (+-1, +-1)</text>
<text x="165.0" y="320" text-anchor="middle" font-size="11" fill="#374151">triangles (0, 1, 2) and (1, 2, 3)</text>
<text x="165.0" y="74" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Each particle becomes a quad in the camera plane</text>
<rect x="330" y="70" width="410" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="535" y="92" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">particle_vertex</text>
<text x="345" y="114" text-anchor="start" font-size="11" fill="#374151">Particle p = particles[instance_id];</text>
<text x="345" y="132" text-anchor="start" font-size="11" fill="#374151">world = p.position + (right * corner.x + up * corner.y) * size;</text>
<text x="345" y="150" text-anchor="start" font-size="11" fill="#374151">position = viewProjection * float4(world, 1.0);</text>
<text x="345" y="170" text-anchor="start" font-size="11" fill="#374151">alpha = fade-in * fade-out from age / lifetime</text>
<text x="535" y="222" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">drawPrimitives(.triangleStrip, 4 vertices x 20,000 instances)</text>
<rect x="340" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="362" y="262" text-anchor="middle" font-size="11" fill="#374151">#0</text>
<rect x="389" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="411" y="262" text-anchor="middle" font-size="11" fill="#374151">#1</text>
<rect x="438" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="460" y="262" text-anchor="middle" font-size="11" fill="#374151">#2</text>
<rect x="487" y="236" width="44" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="509" y="262" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">#3</text>
<rect x="536" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="558" y="262" text-anchor="middle" font-size="11" fill="#374151">#4</text>
<rect x="585" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="607" y="262" text-anchor="middle" font-size="11" fill="#374151">#5</text>
<rect x="634" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="656" y="262" text-anchor="middle" font-size="11" fill="#374151">#6</text>
<rect x="683" y="236" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="705" y="262" text-anchor="middle" font-size="11" fill="#374151">...</text>
<text x="535" y="300" text-anchor="middle" font-size="11" fill="#374151">instance_id picks the particle</text>
<rect x="30" y="330" width="710" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="385" y="350" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">No vertex buffer and no index buffer: the quad corners come from vertex_id,</text>
<text x="385" y="368" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">and a particle costs 4 vertex invocations and one 32-byte read.</text>
</svg>
