<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Colour palette versus colour theme</text>
  <rect x="20" y="48" width="200" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="120" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Palette: a set of colours</text>
  <g><rect x="40" y="90" width="70" height="50" rx="6" fill="#4F46E5"/><rect x="130" y="90" width="70" height="50" rx="6" fill="#B45309"/><rect x="40" y="152" width="70" height="50" rx="6" fill="#1F2937"/><rect x="130" y="152" width="70" height="50" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="120" y="230">You pick each colour</text><text x="120" y="246">by hand, per element</text><text x="120" y="270">Edited in editor or Brand</text></g>
  <path d="M222,183 L262,183" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="242" y="172" font-size="11" fill="#6B7280" text-anchor="middle">roles</text>
  <rect x="270" y="48" width="260" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="400" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Theme: how colours are applied</text>
  <rect x="290" y="90" width="100" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><rect x="302" y="102" width="76" height="12" rx="3" fill="#4F46E5"/><rect x="302" y="122" width="50" height="8" rx="3" fill="#1F2937"/><rect x="302" y="146" width="30" height="30" rx="4" fill="#B45309"/>
  <path d="M396,140 L416,140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="424" y="90" width="90" height="100" rx="6" fill="#1F2937" stroke="#4F46E5"/><rect x="434" y="102" width="70" height="12" rx="3" fill="#EEF2FF"/><rect x="434" y="122" width="44" height="8" rx="3" fill="#FFFFFF"/><rect x="434" y="146" width="30" height="30" rx="4" fill="#B45309"/>
  <text x="340" y="206" font-size="11" fill="#374151" text-anchor="middle">before</text><text x="469" y="206" font-size="11" fill="#374151" text-anchor="middle">after Shuffle</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="400" y="234">One background, up to 20</text><text x="400" y="250">element colours per combination</text><text x="400" y="274">Made from Brand Template</text><text x="400" y="290">suggestions or existing designs</text></g>
  <rect x="548" y="48" width="192" height="270" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="644" y="72" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">What a theme updates</text>
  <g font-size="12" fill="#374151"><text x="564" y="100">Backgrounds, with gradients</text><text x="564" y="120">SVG graphics</text><text x="564" y="140">Text</text></g>
  <text x="644" y="176" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">What it leaves alone</text>
  <g font-size="12" fill="#374151"><text x="564" y="204">PNG and JPG images</text><text x="564" y="224">Charts</text><text x="564" y="244">Locked elements</text><text x="564" y="264">Gradients become solid</text></g>
  <text x="380" y="346" font-size="12" fill="#374151" text-anchor="middle">Not available in Docs, whiteboards, emails or sheets: use the colour picker there.</text>
  <text x="380" y="366" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
