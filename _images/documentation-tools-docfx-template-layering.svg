<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How DocFX layers the entries of the template array</title>
<desc id="d">Three template folders are searched from the last entry to the first. The custom folder supplies public main.css, the modern template supplies layout _master.tmpl and the default template supplies conceptual.html.primary.js. The three files are merged into one set that is applied to the pages.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f9fafb"/></marker>
</defs>
<rect width="760" height="360" rx="12" fill="#1f2937"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#f9fafb">Later entries of the template array win, file by file</text>
<text x="40" y="62" font-size="13" fill="#f9fafb" font-family="Courier New, monospace">"template": ["default", "modern", "my-template"]</text>
<rect x="40" y="80" width="260" height="60" rx="8" fill="#166534"/>
<text x="170" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">my-template</text>
<text x="170" y="124" text-anchor="middle" font-size="12" fill="#f9fafb">searched first (last entry)</text>
<rect x="40" y="170" width="260" height="60" rx="8" fill="#1e40af"/>
<text x="170" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">modern</text>
<text x="170" y="214" text-anchor="middle" font-size="12" fill="#f9fafb">searched second</text>
<rect x="40" y="260" width="260" height="60" rx="8" fill="#374151"/>
<text x="170" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">default</text>
<text x="170" y="304" text-anchor="middle" font-size="12" fill="#f9fafb">searched last (first entry)</text>
<line x1="170" y1="260" x2="170" y2="232" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<line x1="170" y1="170" x2="170" y2="142" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="180" y="252" font-size="11" fill="#fbbf24">fallback</text>
<text x="180" y="162" font-size="11" fill="#fbbf24">fallback</text>
<rect x="400" y="80" width="320" height="60" rx="8" fill="#166534"/>
<text x="560" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">public/main.css</text>
<text x="560" y="124" text-anchor="middle" font-size="12" fill="#f9fafb">your CSS replaces the empty one</text>
<rect x="400" y="170" width="320" height="60" rx="8" fill="#1e40af"/>
<text x="560" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">layout/_master.tmpl</text>
<text x="560" y="214" text-anchor="middle" font-size="12" fill="#f9fafb">page shell taken from modern</text>
<rect x="400" y="260" width="320" height="60" rx="8" fill="#374151"/>
<text x="560" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">conceptual.html.primary.js</text>
<text x="560" y="304" text-anchor="middle" font-size="12" fill="#f9fafb">preprocessor taken from default</text>
<line x1="300" y1="110" x2="398" y2="110" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="300" y1="200" x2="398" y2="200" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="300" y1="290" x2="398" y2="290" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
</svg>
