<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A production topology for the Bookshelf API</text>
  <text x="400" y="44" font-size="12" fill="#666666" text-anchor="middle">TLS ends at the proxy; identical stateless containers; state lives in PostgreSQL, Redis and RabbitMQ</text>

  <!-- Clients -->
  <rect x="20" y="180" width="100" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="70" y="208" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="70" y="226" font-size="11" fill="#444444" text-anchor="middle">browsers, apps,</text>
  <text x="70" y="240" font-size="11" fill="#444444" text-anchor="middle">other services</text>

  <!-- TLS proxy -->
  <rect x="165" y="150" width="150" height="130" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="240" y="176" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">TLS proxy</text>
  <text x="240" y="194" font-size="11" fill="#444444" text-anchor="middle">NGINX, ingress or</text>
  <text x="240" y="208" font-size="11" fill="#444444" text-anchor="middle">cloud load balancer</text>
  <text x="240" y="226" font-size="11" fill="#444444" text-anchor="middle">certificates, HSTS</text>
  <text x="240" y="242" font-size="11" fill="#444444" text-anchor="middle">X-Forwarded-* headers</text>
  <text x="240" y="264" font-size="10" fill="#666666" text-anchor="middle">only component on port 443</text>

  <!-- Containers -->
  <rect x="370" y="62" width="190" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="465" y="82" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container 1</text>
  <rect x="388" y="92" width="154" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="465" y="110" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">node dist/main.js</text>
  <text x="465" y="125" font-size="10" fill="#666666" text-anchor="middle">1 process, non-root</text>

  <rect x="370" y="172" width="190" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="465" y="192" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container 2</text>
  <rect x="388" y="202" width="154" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="465" y="220" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">node dist/main.js</text>
  <text x="465" y="235" font-size="10" fill="#666666" text-anchor="middle">/health/ready = 200</text>

  <rect x="370" y="282" width="190" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="465" y="302" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container N</text>
  <rect x="388" y="312" width="154" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="465" y="330" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">node dist/main.js</text>
  <text x="465" y="345" font-size="10" fill="#666666" text-anchor="middle">added or removed by scaling</text>

  <!-- Backing services -->
  <rect x="650" y="62" width="130" height="86" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="715" y="88" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">PostgreSQL</text>
  <text x="715" y="106" font-size="10" fill="#666666" text-anchor="middle">system of record</text>
  <text x="715" y="120" font-size="10" fill="#666666" text-anchor="middle">managed, or a volume</text>
  <text x="715" y="134" font-size="10" fill="#666666" text-anchor="middle">+ backups</text>

  <rect x="650" y="172" width="130" height="86" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="715" y="198" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Redis</text>
  <text x="715" y="216" font-size="10" fill="#666666" text-anchor="middle">shared cache, rate-limit</text>
  <text x="715" y="230" font-size="10" fill="#666666" text-anchor="middle">counters, BullMQ queues</text>
  <text x="715" y="244" font-size="10" fill="#666666" text-anchor="middle">(AOF if jobs matter)</text>

  <rect x="650" y="282" width="130" height="86" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="715" y="308" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">RabbitMQ</text>
  <text x="715" y="326" font-size="10" fill="#666666" text-anchor="middle">events between services</text>
  <text x="715" y="340" font-size="10" fill="#666666" text-anchor="middle">durable queues,</text>
  <text x="715" y="354" font-size="10" fill="#666666" text-anchor="middle">definitions backed up</text>

  <!-- Arrows: clients -> proxy -->
  <line x1="120" y1="215" x2="159" y2="215" stroke="#444444" stroke-width="1.6"/>
  <polygon points="165,215 157,210 157,220" fill="#444444"/>
  <text x="142" y="206" font-size="10" fill="#666666" text-anchor="middle">HTTPS</text>

  <!-- proxy -> containers -->
  <line x1="315" y1="190" x2="364" y2="108" stroke="#444444" stroke-width="1.4"/>
  <polygon points="370,102 360,104 366,112" fill="#444444"/>
  <line x1="315" y1="215" x2="364" y2="215" stroke="#444444" stroke-width="1.4"/>
  <polygon points="370,215 362,210 362,220" fill="#444444"/>
  <line x1="315" y1="240" x2="364" y2="322" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="370,328 360,326 366,318" fill="#444444"/>
  <text x="240" y="302" font-size="10" fill="#666666" text-anchor="middle">dashed: plain HTTP to</text>
  <text x="240" y="315" font-size="10" fill="#666666" text-anchor="middle">ready instances only</text>

  <!-- containers -> bus -> services -->
  <line x1="560" y1="105" x2="600" y2="105" stroke="#2f5424" stroke-width="1.4"/>
  <line x1="560" y1="215" x2="600" y2="215" stroke="#2f5424" stroke-width="1.4"/>
  <line x1="560" y1="325" x2="600" y2="325" stroke="#2f5424" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="600" y1="105" x2="600" y2="325" stroke="#2f5424" stroke-width="1.4"/>
  <line x1="600" y1="105" x2="644" y2="105" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="650,105 642,100 642,110" fill="#2f5424"/>
  <line x1="600" y1="215" x2="644" y2="215" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="650,215 642,210 642,220" fill="#2f5424"/>
  <line x1="600" y1="325" x2="644" y2="325" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="650,325 642,320 642,330" fill="#2f5424"/>
  <text x="605" y="86" font-size="10" fill="#666666">SQL</text>
  <text x="605" y="196" font-size="10" fill="#666666">RESP</text>
  <text x="605" y="306" font-size="10" fill="#666666">AMQP</text>

  <!-- Configuration / secrets -->
  <rect x="165" y="392" width="615" height="44" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="472" y="411" font-size="12" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Configuration and secrets, injected at run time</text>
  <text x="472" y="427" font-size="10" fill="#666666" text-anchor="middle">environment variables, Kubernetes Secrets or a cloud secret store; never baked into the image</text>
  <line x1="465" y1="378" x2="465" y2="392" stroke="#8a1f1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="465,370 460,378 470,378" fill="#8a1f1f"/>
</svg>
