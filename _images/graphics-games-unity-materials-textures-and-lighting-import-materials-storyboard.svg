<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: import bookshelf.glb and build the Lit materials</text>
<rect x="20.0" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36.0" cy="62" r="11" fill="#4F46E5"/>
<text x="36.0" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="95.2" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Package</text>
<rect x="28.0" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="87.2" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Package Manager</text>
<rect x="28.0" y="114" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="87.2" y="129.5" text-anchor="middle" font-size="10" fill="#374151">Unity Registry</text>
<rect x="28.0" y="144" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="87.2" y="159.5" text-anchor="middle" font-size="10" fill="#3730A3">glTFast</text>
<rect x="28.0" y="174" width="118.4" height="24" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="87.2" y="189.5" text-anchor="middle" font-size="10" fill="#1F2937">Install</text>
<text x="87.2" y="222" text-anchor="middle" font-size="11" fill="#374151">glb needs an importer</text>
<text x="87.2" y="236" text-anchor="middle" font-size="11" fill="#374151">package</text>
<rect x="166.4" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182.4" cy="62" r="11" fill="#4F46E5"/>
<text x="182.4" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="241.6" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Import</text>
<rect x="174.4" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="233.60000000000002" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Assets/Models</text>
<rect x="174.4" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="233.60000000000002" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">bookshelf.glb</text>
<rect x="174.4" y="144" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="233.60000000000002" y="159.5" text-anchor="middle" font-size="10" fill="#3730A3">+ textures folder</text>
<rect x="174.4" y="174" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="233.60000000000002" y="189.5" text-anchor="middle" font-size="10" fill="#374151">Inspector: settings</text>
<text x="233.6" y="222" text-anchor="middle" font-size="11" fill="#374151">Copy the model and</text>
<text x="233.6" y="236" text-anchor="middle" font-size="11" fill="#374151">its textures together</text>
<rect x="312.8" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328.8" cy="62" r="11" fill="#4F46E5"/>
<text x="328.8" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="388.0" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Textures</text>
<rect x="320.8" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="380.0" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Select cover.png</text>
<rect x="320.8" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380.0" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">sRGB: on</text>
<rect x="320.8" y="144" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380.0" y="159.5" text-anchor="middle" font-size="10" fill="#3730A3">Mipmaps: on</text>
<rect x="320.8" y="174" width="118.4" height="24" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="380.0" y="189.5" text-anchor="middle" font-size="10" fill="#1F2937">Apply</text>
<text x="380.0" y="222" text-anchor="middle" font-size="11" fill="#374151">Check import settings</text>
<text x="380.0" y="236" text-anchor="middle" font-size="11" fill="#374151">for each map</text>
<rect x="459.2" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="475.2" cy="62" r="11" fill="#4F46E5"/>
<text x="475.2" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="534.4" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Material</text>
<rect x="467.2" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="526.4" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Assets &gt; Create</text>
<rect x="467.2" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="526.4" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">&gt; Material</text>
<rect x="467.2" y="144" width="118.4" height="24" rx="5" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="526.4" y="159.5" text-anchor="middle" font-size="10" fill="#92400E">Shader: URP Lit</text>
<rect x="467.2" y="174" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="526.4" y="189.5" text-anchor="middle" font-size="10" fill="#3730A3">Base Map: cover</text>
<text x="526.4" y="222" text-anchor="middle" font-size="11" fill="#374151">New Lit material</text>
<text x="526.4" y="236" text-anchor="middle" font-size="11" fill="#374151">with the cover map</text>
<rect x="605.6" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="621.6" cy="62" r="11" fill="#B45309"/>
<text x="621.6" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="680.8" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Assign</text>
<rect x="613.6" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="672.8000000000001" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Drag onto Book</text>
<rect x="613.6" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="672.8000000000001" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">Smoothness 0.3</text>
<rect x="613.6" y="144" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="672.8000000000001" y="159.5" text-anchor="middle" font-size="10" fill="#3730A3">Metallic 0</text>
<rect x="613.6" y="174" width="118.4" height="24" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="672.8000000000001" y="189.5" text-anchor="middle" font-size="10" fill="#1F2937">Scene view: lit</text>
<text x="672.8" y="222" text-anchor="middle" font-size="11" fill="#374151">Tune until the book</text>
<text x="672.8" y="236" text-anchor="middle" font-size="11" fill="#374151">reads as paper</text>
<rect x="20" y="258" width="720" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="280.9" text-anchor="middle" font-size="11" fill="#374151">The glTFast importer creates materials for the imported model by itself; the manual steps above show the same result built from the</text>
<text x="380.0" y="294.9" text-anchor="middle" font-size="11" fill="#374151">textures, which is how you author your own variants (for example one cover per BookData asset).</text>
