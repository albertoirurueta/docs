<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-math-for-3d-coordinate-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The coordinate-space chain of a book vertex</text>
<rect x="30" y="80" width="100" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="111.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Model</text>
<text x="80.0" y="125.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book axes</text>
<line x1="130" y1="115" x2="150" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-math-for-3d-coordinate-chain)"/>
<text x="140.0" y="175" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">model matrix</text>
<line x1="140.0" y1="120" x2="140.0" y2="165" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="150" y="80" width="100" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="111.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">World</text>
<text x="200.0" y="125.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">shelf and room</text>
<line x1="250" y1="115" x2="270" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-math-for-3d-coordinate-chain)"/>
<text x="260.0" y="193" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">view matrix</text>
<line x1="260.0" y1="120" x2="260.0" y2="183" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="270" y="80" width="100" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="111.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">View</text>
<text x="320.0" y="125.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">camera at origin</text>
<line x1="370" y1="115" x2="390" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-math-for-3d-coordinate-chain)"/>
<text x="380.0" y="175" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">projection</text>
<line x1="380.0" y1="120" x2="380.0" y2="165" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="390" y="80" width="100" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="440.0" y="111.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Clip</text>
<text x="440.0" y="125.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">x y z w</text>
<line x1="490" y1="115" x2="510" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-math-for-3d-coordinate-chain)"/>
<text x="500.0" y="193" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">divide by w</text>
<line x1="500.0" y1="120" x2="500.0" y2="183" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="510" y="80" width="100" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="111.8" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">NDC</text>
<text x="560.0" y="125.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">xy -1..1, z 0..1</text>
<line x1="610" y1="115" x2="630" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-math-for-3d-coordinate-chain)"/>
<text x="620.0" y="175" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">viewport</text>
<line x1="620.0" y1="120" x2="620.0" y2="165" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="630" y="80" width="100" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="680.0" y="111.8" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">Framebuffer</text>
<text x="680.0" y="125.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">pixels, top left</text>
<text x="380" y="250" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Matrices act on column vectors from the right: clip = projection * view * model * position.</text>
<text x="380" y="275" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The GPU does the last two steps; the vertex function returns clip space.</text>
</svg>
