<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Order-safe cutover timeline of the Pocket Coffee store</title>
  <desc id="d">A timeline in three lanes. The top lane is the old single server of Pocket Coffee: it serves and takes orders until the freeze, then goes into maintenance mode with its crontab removed and its pending Action Scheduler actions drained, and it stays read-only as the rollback for seven days. The middle lane is the new EKS stack: from several days before the cutover an AWS DMS task copies the database and replays its changes while the worker Deployment pocketcoffee-worker is scaled to zero and the CronJob pocketcoffee-cron is suspended, so that the copied pending actions do nothing; after the freeze the DMS lag reaches zero and the task is stopped, the checks run (HPOS status, order counts, Subscriptions live URL, webhook list), DNS is switched, and only then the cron is resumed and the worker is scaled to one. The bottom lane is the payment gateway: webhook deliveries that reach the old server during the freeze receive a 503 and are retried by the gateway until the new site answers after the DNS switch, so that no payment confirmation is lost and no order is processed on both sides.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Only one side runs the queue and takes orders at any moment</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Cutover of pocketcoffee.example from one server to EKS: the order of events matters more than the clock times</text>

  <!-- time axis -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <line x1="150" y1="92" x2="930" y2="92" stroke="#6f8aa3" stroke-width="2" marker-end="url(#b)"/>
    <text x="180" y="84">T-7 d</text>
    <text x="330" y="84">T-48 h</text>
    <text x="470" y="84">T-0 freeze</text>
    <text x="580" y="84">T+10 min</text>
    <text x="690" y="84">T+25 min</text>
    <text x="790" y="84">T+30 min</text>
    <text x="900" y="84">T+7 d</text>
  </g>

  <!-- lane labels -->
  <g font-size="13" font-weight="bold" fill="#f4b860">
    <text x="40" y="150">Old server</text>
    <text x="40" y="300">EKS stack</text>
    <text x="40" y="450">Gateway</text>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <text x="40" y="168">single VPS</text>
    <text x="40" y="318">pocketcoffee-*</text>
    <text x="40" y="468">webhooks</text>
  </g>

  <!-- old server lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="116" width="310" height="64" rx="9" fill="#4d7c5a"/>
    <text x="305" y="140" font-weight="bold">Serving and taking orders</text>
    <text x="305" y="158">cron and web runners work normally</text>
    <text x="305" y="174">DNS TTL lowered to 60 s at T-48 h</text>
    <rect x="470" y="116" width="215" height="64" rx="9" fill="#7a5c3a"/>
    <text x="577" y="140" font-weight="bold">Frozen</text>
    <text x="577" y="158">maintenance mode, crontab removed</text>
    <text x="577" y="174">in-progress actions drained to 0</text>
    <rect x="695" y="116" width="235" height="64" rx="9" fill="#3d5266"/>
    <text x="812" y="140" font-weight="bold">Read-only rollback copy</text>
    <text x="812" y="158">nothing scheduled, nothing running</text>
    <text x="812" y="174">kept 7 days, then retired</text>
  </g>

  <!-- EKS lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="266" width="310" height="64" rx="9" fill="#3f6e9a"/>
    <text x="305" y="290" font-weight="bold">DMS full load, then CDC</text>
    <text x="305" y="308">worker scaled to 0, cron suspended</text>
    <text x="305" y="324">copied pending actions stay inert</text>
    <rect x="470" y="266" width="215" height="64" rx="9" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
    <text x="577" y="290" font-weight="bold">Lag 0, stop DMS, check</text>
    <text x="577" y="308">HPOS, counts, Subscriptions URL</text>
    <text x="577" y="324">smoke test with curl --resolve</text>
    <rect x="695" y="266" width="235" height="64" rx="9" fill="#4d7c5a"/>
    <text x="812" y="290" font-weight="bold">Live: DNS, then the queue</text>
    <text x="812" y="308">cron resumed, worker to 1</text>
    <text x="812" y="324">watch orders for one hour</text>
  </g>

  <!-- gateway lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="416" width="310" height="64" rx="9" fill="#3d5266"/>
    <text x="305" y="440" font-weight="bold">Webhooks reach the old server</text>
    <text x="305" y="458">same URL, same domain</text>
    <text x="305" y="474">review the dashboards beforehand</text>
    <rect x="470" y="416" width="215" height="64" rx="9" fill="#7a5c3a"/>
    <text x="577" y="440" font-weight="bold">503 from the old server</text>
    <text x="577" y="458">the gateway keeps the event</text>
    <text x="577" y="474">and retries later</text>
    <rect x="695" y="416" width="235" height="64" rx="9" fill="#4d7c5a"/>
    <text x="812" y="440" font-weight="bold">Retries land on the new site</text>
    <text x="812" y="458">orders paid during the freeze</text>
    <text x="812" y="474">are completed; reconcile in the dashboard</text>
  </g>

  <!-- arrows -->
  <path d="M577 180 L577 262" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M577 330 L577 412" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M685 298 L695 298" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="590" y="228" font-size="11.5" fill="#f2f5f8">final delta</text>
  <text x="590" y="378" font-size="11.5" fill="#f2f5f8">retry after the switch</text>
  <text x="150" y="518" font-size="12" fill="#9fd3c7">The old server stops before the new one starts: the two queues never run at the same time.</text>
</svg>
