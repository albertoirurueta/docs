<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="jv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Report virtualizer: a swap file keeps filled pages off the heap</text>

  <!-- Filler -->
  <rect x="20" y="60" width="170" height="150" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="105" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#b36b00">Fill</text>
  <text x="105" y="112" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperFillManager</text>
  <text x="105" y="136" text-anchor="middle" font-size="11" fill="#b36b00">REPORT_VIRTUALIZER</text>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#b36b00">parameter</text>
  <text x="105" y="182" text-anchor="middle" font-size="11" fill="#b36b00">adds one page at a time</text>

  <!-- Heap -->
  <rect x="250" y="60" width="270" height="150" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="385" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa6">JVM heap: maxSize pages</text>
  <rect x="268" y="104" width="58" height="46" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="297" y="132" text-anchor="middle" font-size="12" fill="#333">page n</text>
  <rect x="338" y="104" width="58" height="46" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="367" y="132" text-anchor="middle" font-size="12" fill="#333">n-1</text>
  <rect x="408" y="104" width="58" height="46" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="437" y="132" text-anchor="middle" font-size="12" fill="#333">n-2</text>
  <text x="385" y="176" text-anchor="middle" font-size="11" fill="#1f5fa6">most recently used pages stay</text>
  <text x="385" y="194" text-anchor="middle" font-size="11" fill="#1f5fa6">as ordinary Java objects</text>

  <!-- Swap file -->
  <rect x="590" y="60" width="290" height="150" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="735" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2b7a2b">Swap file on disk</text>
  <rect x="608" y="104" width="46" height="46" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="631" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="662" y="104" width="46" height="46" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="685" y="132" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="716" y="104" width="46" height="46" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="739" y="132" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="770" y="104" width="46" height="46" rx="4" fill="#ffffff" stroke="#2b7a2b" stroke-dasharray="4 3"/>
  <text x="793" y="132" text-anchor="middle" font-size="12" fill="#333">...</text>
  <rect x="824" y="104" width="40" height="46" rx="4" fill="#ffffff" stroke="#2b7a2b" stroke-dasharray="4 3"/>
  <text x="844" y="132" text-anchor="middle" font-size="12" fill="#333">free</text>
  <text x="735" y="176" text-anchor="middle" font-size="11" fill="#2b7a2b">one file, blocks of blockSize bytes,</text>
  <text x="735" y="194" text-anchor="middle" font-size="11" fill="#2b7a2b">grows by minGrowCount blocks</text>

  <!-- Arrows -->
  <line x1="190" y1="120" x2="248" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#jv-arrow)"/>
  <text x="219" y="110" text-anchor="middle" font-size="11" fill="#555">new page</text>
  <line x1="520" y1="105" x2="588" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#jv-arrow)"/>
  <text x="554" y="96" text-anchor="middle" font-size="11" fill="#555">evict</text>
  <line x1="588" y1="170" x2="522" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#jv-arrow)"/>
  <text x="555" y="187" text-anchor="middle" font-size="11" fill="#555">reload</text>

  <!-- Export -->
  <rect x="250" y="250" width="270" height="70" rx="6" fill="#f3e5f9" stroke="#7a2b8f" stroke-width="1.6"/>
  <text x="385" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2b8f">Export</text>
  <text x="385" y="298" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRPdfExporter reads page by page</text>
  <line x1="385" y1="212" x2="385" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#jv-arrow)" stroke-dasharray="5 3"/>
  <text x="397" y="236" font-size="11" fill="#555">touch / requestData</text>

  <!-- Cleanup -->
  <rect x="590" y="250" width="290" height="70" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="735" y="276" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">virtualizer.cleanup()</text>
  <text x="735" y="298" text-anchor="middle" font-size="11" fill="#555">in a finally block, deletes the file</text>
  <line x1="735" y1="212" x2="735" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#jv-arrow)" stroke-dasharray="5 3"/>

  <!-- Comparison -->
  <text x="20" y="352" font-size="13" font-weight="700" fill="#1a1a1a">The three implementations</text>
  <rect x="20" y="364" width="280" height="86" rx="6" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="160" y="386" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#1f5fa6">JRFileVirtualizer</text>
  <text x="160" y="410" text-anchor="middle" font-size="11" fill="#333">one temporary file per page,</text>
  <text x="160" y="426" text-anchor="middle" font-size="11" fill="#333">in a directory you choose</text>
  <rect x="310" y="364" width="280" height="86" rx="6" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="450" y="386" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2b7a2b">JRSwapFileVirtualizer</text>
  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#333">one shared swap file, any number</text>
  <text x="450" y="426" text-anchor="middle" font-size="11" fill="#333">of concurrent fills</text>
  <rect x="600" y="364" width="280" height="86" rx="6" fill="#ffffff" stroke="#b36b00"/>
  <text x="740" y="386" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#b36b00">JRGzipVirtualizer</text>
  <text x="740" y="410" text-anchor="middle" font-size="11" fill="#333">no disk: pages stay in memory,</text>
  <text x="740" y="426" text-anchor="middle" font-size="11" fill="#333">GZIP-compressed</text>
</svg>
