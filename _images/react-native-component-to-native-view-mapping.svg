<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">PlaceCard's Core Components mapped to Native Components</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Same JSX, two different platform view hierarchies underneath</text>

  <defs>
    <marker id="ccm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Core Components column -->
  <rect x="30" y="80" width="180" height="290" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="120" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Core Components</text>
  <text x="120" y="140" font-size="12" fill="#333333" text-anchor="middle">View</text>
  <text x="120" y="180" font-size="12" fill="#333333" text-anchor="middle">Text</text>
  <text x="120" y="220" font-size="12" fill="#333333" text-anchor="middle">Image</text>
  <text x="120" y="260" font-size="12" fill="#333333" text-anchor="middle">Pressable</text>
  <text x="120" y="300" font-size="10" fill="#666666" text-anchor="middle">(PlaceCard's own</text>
  <text x="120" y="314" font-size="10" fill="#666666" text-anchor="middle">JSX tree)</text>

  <!-- iOS column -->
  <rect x="290" y="60" width="210" height="150" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="395" y="82" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">iOS Native Components</text>
  <text x="395" y="112" font-size="11" fill="#333333" text-anchor="middle">View -&gt; UIView</text>
  <text x="395" y="134" font-size="11" fill="#333333" text-anchor="middle">Text -&gt; native text label</text>
  <text x="395" y="156" font-size="11" fill="#333333" text-anchor="middle">Image -&gt; UIImageView</text>
  <text x="395" y="178" font-size="11" fill="#333333" text-anchor="middle">Pressable -&gt; touch-handling UIView</text>

  <!-- Android column -->
  <rect x="290" y="230" width="210" height="150" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="395" y="252" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Android Native Components</text>
  <text x="395" y="282" font-size="11" fill="#333333" text-anchor="middle">View -&gt; android.view.View</text>
  <text x="395" y="304" font-size="11" fill="#333333" text-anchor="middle">Text -&gt; TextView</text>
  <text x="395" y="326" font-size="11" fill="#333333" text-anchor="middle">Image -&gt; ImageView</text>
  <text x="395" y="348" font-size="11" fill="#333333" text-anchor="middle">Pressable -&gt; touch-feedback View</text>

  <line x1="210" y1="180" x2="285" y2="130" stroke="#333333" stroke-width="1.4" marker-end="url(#ccm-arrow)"/>
  <line x1="210" y1="230" x2="285" y2="300" stroke="#333333" stroke-width="1.4" marker-end="url(#ccm-arrow)"/>

  <!-- Devices -->
  <rect x="560" y="60" width="170" height="150" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="645" y="82" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">iOS device screen</text>
  <text x="645" y="140" font-size="11" fill="#333333" text-anchor="middle">Fabric mounts these</text>
  <text x="645" y="158" font-size="11" fill="#333333" text-anchor="middle">into the real UIKit</text>
  <text x="645" y="176" font-size="11" fill="#333333" text-anchor="middle">view hierarchy</text>

  <rect x="560" y="230" width="170" height="150" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="645" y="252" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Android device screen</text>
  <text x="645" y="310" font-size="11" fill="#333333" text-anchor="middle">Fabric mounts these</text>
  <text x="645" y="328" font-size="11" fill="#333333" text-anchor="middle">into the real Android</text>
  <text x="645" y="346" font-size="11" fill="#333333" text-anchor="middle">View hierarchy</text>

  <line x1="500" y1="135" x2="555" y2="135" stroke="#333333" stroke-width="1.4" marker-end="url(#ccm-arrow)"/>
  <line x1="500" y1="305" x2="555" y2="305" stroke="#333333" stroke-width="1.4" marker-end="url(#ccm-arrow)"/>

  <text x="380" y="404" font-size="10.5" fill="#666666" text-anchor="middle">One JSX tree, two real native view hierarchies -- no HTML, no WebView, on either platform.</text>
</svg>
