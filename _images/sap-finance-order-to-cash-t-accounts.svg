<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Order-to-cash as T-accounts: goods issue, customer invoice and incoming payment</title>
  <desc id="d">Three postings of company code EX01, all in euro. Step 1, goods issue: cost of goods sold is debited and inventory is credited with 6,000.00. Step 2, customer invoice: the customer account (a reconciliation account) is debited with 11,900.00, revenue is credited with 10,000.00 and output tax with 1,900.00. Step 3, incoming payment: the bank account is debited and the customer account is credited with 11,900.00, so the customer items add up to zero and are cleared. Amounts and the 19 percent tax rate are made up.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="10" y="16" width="340" height="58" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="180" y="40" text-anchor="middle" font-size="15" font-weight="bold">1 Goods issue</text>
  <text x="180" y="60" text-anchor="middle" font-size="13">inventory value leaves</text>
  <rect x="370" y="16" width="340" height="58" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="40" text-anchor="middle" font-size="15" font-weight="bold">2 Customer invoice</text>
  <text x="540" y="60" text-anchor="middle" font-size="13">billing posts to Finance</text>
  <rect x="730" y="16" width="340" height="58" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="900" y="40" text-anchor="middle" font-size="15" font-weight="bold">3 Incoming payment</text>
  <text x="900" y="60" text-anchor="middle" font-size="13">bank statement or manual</text>
  <rect x="20" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="95" y="114" text-anchor="middle" font-size="13" font-weight="bold">Cost of goods sold</text>
  <line x1="20" y1="122" x2="170" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="95" y1="122" x2="95" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="57.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="132.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="57.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">6,000.00</text>
  <rect x="190" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="265" y="114" text-anchor="middle" font-size="13" font-weight="bold">Inventory</text>
  <line x1="190" y1="122" x2="340" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="265" y1="122" x2="265" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="227.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="302.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="302.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">6,000.00</text>
  <rect x="380" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="455" y="114" text-anchor="middle" font-size="13" font-weight="bold">Customer</text>
  <line x1="380" y1="122" x2="530" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="455" y1="122" x2="455" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="417.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="492.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="417.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">11,900.00</text>
  <rect x="550" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="625" y="114" text-anchor="middle" font-size="13" font-weight="bold">Revenue</text>
  <line x1="550" y1="122" x2="700" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="625" y1="122" x2="625" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="587.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="662.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="662.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">10,000.00</text>
  <rect x="380" y="226" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="455" y="244" text-anchor="middle" font-size="13" font-weight="bold">Output tax</text>
  <line x1="380" y1="252" x2="530" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <line x1="455" y1="252" x2="455" y2="336" stroke="currentColor" stroke-width="1.5"/>
  <text x="417.5" y="267" text-anchor="middle" font-size="10">Debit</text>
  <text x="492.5" y="267" text-anchor="middle" font-size="10">Credit</text>
  <text x="492.5" y="298" text-anchor="middle" font-size="13" font-weight="bold">1,900.00</text>
  <rect x="740" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="815" y="114" text-anchor="middle" font-size="13" font-weight="bold">Bank</text>
  <line x1="740" y1="122" x2="890" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="815" y1="122" x2="815" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="777.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="852.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="777.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">11,900.00</text>
  <rect x="910" y="96" width="150" height="110" rx="8" fill="#1e1b4b" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="985" y="114" text-anchor="middle" font-size="13" font-weight="bold">Customer</text>
  <line x1="910" y1="122" x2="1060" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="985" y1="122" x2="985" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="947.5" y="137" text-anchor="middle" font-size="10">Debit</text>
  <text x="1022.5" y="137" text-anchor="middle" font-size="10">Credit</text>
  <text x="1022.5" y="168" text-anchor="middle" font-size="13" font-weight="bold">11,900.00</text>
  <text x="550" y="250" text-anchor="start" font-size="11">Customer: reconciliation</text>
  <text x="550" y="266" text-anchor="start" font-size="11">account of the customer.</text>
  <text x="20" y="240" text-anchor="start" font-size="11">Needs a goods issue posted</text>
  <text x="20" y="256" text-anchor="start" font-size="11">for the outbound delivery.</text>
  <text x="740" y="240" text-anchor="start" font-size="11">Clears the invoice item: the two</text>
  <text x="740" y="256" text-anchor="start" font-size="11">customer items add up to zero.</text>
  <rect x="10" y="350" width="1060" height="96" rx="10" fill="#b76fe0" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="374" text-anchor="middle" font-size="14" font-weight="bold">Customer account over time</text>
  <text x="540" y="393" text-anchor="middle" font-size="12">after step 2: open item, debit 11,900.00</text>
  <text x="540" y="412" text-anchor="middle" font-size="12">after step 3: both items cleared, balance 0.00</text>
  <text x="540" y="431" text-anchor="middle" font-size="12">gross margin: 10,000.00 revenue - 6,000.00 cost of goods sold = 4,000.00</text>
  <text x="540" y="478" text-anchor="middle" font-size="12">All amounts and the 19 percent tax rate are made up. Each line is written to ledgers 0L and 2L of company code EX01.</text>
</svg>
