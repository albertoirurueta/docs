<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The same spinning cube in a 2013 book and in 2026</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="20" y="48" width="350" height="330" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="195" y="72" font-size="14" fill="#92400E" text-anchor="middle" font-weight="bold">Book era: r49 to r69, global script</text>
<text x="32" y="100" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">&lt;script src="three.min.js"&gt;&lt;/script&gt;</text>
<text x="32" y="121" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">var renderer = Detector.webgl</text>
<text x="32" y="142" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  ? new THREE.WebGLRenderer()</text>
<text x="32" y="163" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  : new THREE.CanvasRenderer();</text>
<text x="32" y="184" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">var g = new THREE.CubeGeometry(1,1,1);</text>
<text x="32" y="205" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">var tex = THREE.ImageUtils</text>
<text x="32" y="226" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  .loadTexture('cover.png');</text>
<text x="32" y="247" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">var m = new THREE.MeshFaceMaterial([...]);</text>
<text x="32" y="268" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">var p = new THREE.Projector();</text>
<text x="32" y="289" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">renderer.shadowMapEnabled = true;</text>
<text x="32" y="310" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">requestAnimationFrame(animate);</text>
<text x="195" y="352" font-size="11" fill="#92400E" text-anchor="middle">None of these names exist in r187</text>
<rect x="390" y="48" width="350" height="330" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="565" y="72" font-size="14" fill="#3730A3" text-anchor="middle" font-weight="bold">2026: r187, ES modules</text>
<text x="402" y="100" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">import * as THREE from 'three';</text>
<text x="402" y="121" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">const renderer =</text>
<text x="402" y="142" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  new THREE.WebGLRenderer();</text>
<text x="402" y="163" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">const g = new THREE.BoxGeometry();</text>
<text x="402" y="184" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">const tex = new THREE.TextureLoader()</text>
<text x="402" y="205" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  .load('cover.png');</text>
<text x="402" y="226" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">tex.colorSpace = THREE.SRGBColorSpace;</text>
<text x="402" y="247" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">const m = [matA, matB, matC];</text>
<text x="402" y="268" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">const ray = new THREE.Raycaster();</text>
<text x="402" y="289" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">renderer.shadowMap.enabled = true;</text>
<text x="402" y="310" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">renderer.setAnimationLoop(animate);</text>
<text x="565" y="352" font-size="11" fill="#3730A3" text-anchor="middle">Colour management and physical light units</text>
<text x="565" y="368" font-size="11" fill="#3730A3" text-anchor="middle">are on by default, so values also differ</text>
<line x1="372" y1="213" x2="388" y2="213" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="410" font-size="11" fill="#374151" text-anchor="middle">Conceptual comparison, not a complete program</text>
</svg>
