<svg viewBox="0 0 820 510" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="510" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Site-to-site and point-to-site VPN topology</text>

  <!-- On-premises box -->
  <rect x="16" y="52" width="190" height="200" rx="8" fill="#fbe8cf" stroke="#c77c00" stroke-width="1.3"/>
  <text x="111" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a00">On-premises network</text>
  <rect x="34" y="86" width="154" height="60" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="111" y="108" text-anchor="middle" font-size="10.5" fill="#5f6368">VPN device</text>
  <text x="111" y="122" text-anchor="middle" font-size="9.5" fill="#5f6368">(IPsec/IKE, BGP)</text>
  <text x="111" y="136" text-anchor="middle" font-size="9" fill="#7a4a00">Public IP: 203.0.113.10</text>
  <rect x="34" y="156" width="154" height="80" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="111" y="176" text-anchor="middle" font-size="10.5" fill="#5f6368">On-prem subnet</text>
  <text x="111" y="192" text-anchor="middle" font-size="9.5" fill="#5f6368">10.10.0.0/16</text>
  <text x="111" y="210" text-anchor="middle" font-size="9" fill="#5f6368">admin workstations,</text>
  <text x="111" y="222" text-anchor="middle" font-size="9" fill="#5f6368">branch servers</text>

  <!-- Local network gateway -->
  <rect x="234" y="96" width="164" height="70" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.3"/>
  <text x="316" y="118" text-anchor="middle" font-size="10.5" font-weight="700" fill="#173d73">Local network gateway</text>
  <text x="316" y="134" text-anchor="middle" font-size="9" fill="#3c4043">lgw-onprem-bookshelf</text>
  <text x="316" y="148" text-anchor="middle" font-size="9" fill="#3c4043">represents 203.0.113.10</text>

  <line x1="206" y1="116" x2="234" y2="116" stroke="#2c5aa0" stroke-width="2"/>

  <!-- Connection resource -->
  <rect x="234" y="182" width="164" height="70" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.3"/>
  <text x="316" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#173d73">Connection (S2S)</text>
  <text x="316" y="220" text-anchor="middle" font-size="9" fill="#3c4043">cn-bookshelf-onprem</text>
  <text x="316" y="234" text-anchor="middle" font-size="9" fill="#3c4043">IPsec/IKEv2, shared key, BGP</text>

  <line x1="316" y1="166" x2="316" y2="182" stroke="#2c5aa0" stroke-width="2"/>

  <!-- P2S client -->
  <rect x="16" y="272" width="190" height="84" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.3"/>
  <text x="111" y="292" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a2170">Admin laptop (P2S)</text>
  <text x="111" y="308" text-anchor="middle" font-size="9" fill="#3c4043">Azure VPN Client, OpenVPN + Entra ID</text>
  <text x="111" y="322" text-anchor="middle" font-size="9" fill="#3c4043">client pool 172.16.201.0/24</text>
  <text x="111" y="336" text-anchor="middle" font-size="9" fill="#3c4043">DNS server 10.0.0.68 (from profile)</text>

  <!-- Hub VNet -->
  <rect x="420" y="52" width="384" height="210" rx="10" fill="#eef7ee" stroke="#188038" stroke-width="1.5"/>
  <text x="436" y="72" font-size="12" font-weight="700" fill="#0d4c22">vnet-hub-bookshelf (10.0.0.0/23, hub)</text>

  <!-- GatewaySubnet -->
  <rect x="436" y="84" width="184" height="136" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="446" y="102" font-size="11" font-weight="700" fill="#0d4c22">GatewaySubnet</text>
  <text x="446" y="116" font-size="9" fill="#5f6368">10.0.1.64/27, no NSG, nothing else</text>
  <rect x="448" y="126" width="160" height="80" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1.2"/>
  <text x="528" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#0d4c22">vgw-bookshelf</text>
  <text x="528" y="162" text-anchor="middle" font-size="9" fill="#3c4043">VPN Gateway (route-based)</text>
  <text x="528" y="176" text-anchor="middle" font-size="9" fill="#3c4043">VpnGw2AZ, active-active</text>
  <text x="528" y="190" text-anchor="middle" font-size="9" fill="#3c4043">BGP ASN 65515</text>

  <!-- DNS resolver inbound subnet -->
  <rect x="632" y="84" width="156" height="136" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
  <text x="642" y="102" font-size="11" font-weight="700" fill="#174ea6">snet-dns-inbound</text>
  <text x="642" y="116" font-size="9" fill="#5f6368">10.0.0.64/28</text>
  <rect x="642" y="126" width="136" height="80" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
  <text x="710" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174ea6">dnspr-bookshelf</text>
  <text x="710" y="162" text-anchor="middle" font-size="9" fill="#3c4043">inbound endpoint</text>
  <text x="710" y="176" text-anchor="middle" font-size="9" fill="#3c4043">10.0.0.68</text>
  <text x="710" y="190" text-anchor="middle" font-size="8.5" fill="#3c4043">resolves privatelink.*</text>

  <text x="788" y="238" text-anchor="end" font-size="8.5" fill="#3c4043">hub DNS servers = 10.0.0.68 (handed to P2S clients);</text>
  <text x="788" y="251" text-anchor="end" font-size="8.5" fill="#3c4043">privatelink.* zones linked to hub and spoke</text>

  <!-- S2S tunnel into the gateway -->
  <line x1="398" y1="217" x2="448" y2="196" stroke="#2c5aa0" stroke-width="2"/>
  <text x="316" y="266" text-anchor="middle" font-size="9" fill="#173d73">IPsec tunnel to vgw-bookshelf</text>

  <!-- P2S tunnel into the gateway -->
  <polyline points="206,314 414,314 414,236 528,236 528,206" fill="none" stroke="#7b3fb5" stroke-width="2"/>
  <text x="300" y="306" text-anchor="middle" font-size="9" fill="#4a2170">TLS tunnel (OpenVPN)</text>

  <!-- Peering -->
  <line x1="600" y1="262" x2="600" y2="300" stroke="#8430ce" stroke-width="2.2"/>
  <line x1="612" y1="262" x2="612" y2="300" stroke="#8430ce" stroke-width="2.2"/>
  <text x="622" y="279" font-size="9" font-weight="700" fill="#5a1a99">VNet peering</text>
  <text x="622" y="292" font-size="8.5" fill="#5a1a99">gateway transit / use remote gateways</text>

  <!-- Spoke VNet -->
  <rect x="420" y="300" width="384" height="150" rx="10" fill="#eef7ee" stroke="#188038" stroke-width="1.5"/>
  <text x="436" y="320" font-size="12" font-weight="700" fill="#0d4c22">vnet-bookshelf (10.1.0.0/16, spoke)</text>
  <text x="436" y="336" font-size="9" fill="#5f6368">snet-data (10.1.1.0/24) -- private endpoints, nsg-data</text>

  <rect x="436" y="346" width="164" height="88" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="518" y="366" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d4c22">pg-bookshelf</text>
  <text x="518" y="382" text-anchor="middle" font-size="9" fill="#3c4043">PostgreSQL flexible server</text>
  <text x="518" y="396" text-anchor="middle" font-size="9" fill="#3c4043">private endpoint</text>
  <text x="518" y="412" text-anchor="middle" font-size="8.5" fill="#5f6368">privatelink.postgres</text>
  <text x="518" y="424" text-anchor="middle" font-size="8.5" fill="#5f6368">.database.azure.com</text>

  <rect x="622" y="346" width="164" height="88" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="704" y="366" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d4c22">kv-bookshelf</text>
  <text x="704" y="382" text-anchor="middle" font-size="9" fill="#3c4043">Key Vault</text>
  <text x="704" y="396" text-anchor="middle" font-size="9" fill="#3c4043">private endpoint</text>
  <text x="704" y="412" text-anchor="middle" font-size="8.5" fill="#5f6368">privatelink.vaultcore</text>
  <text x="704" y="424" text-anchor="middle" font-size="8.5" fill="#5f6368">.azure.net</text>

  <text x="410" y="478" text-anchor="middle" font-size="9.5" fill="#3c4043">S2S and P2S traffic terminates on vgw-bookshelf in the hub and reaches vnet-bookshelf over the peering;</text>
  <text x="410" y="492" text-anchor="middle" font-size="9.5" fill="#3c4043">VPN clients resolve pg-bookshelf/kv-bookshelf to their private IPs through the resolver's inbound endpoint.</text>
</svg>
