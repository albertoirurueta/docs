<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A decorated page: layout plus content</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">layout:decorate starts from the layout and fills its layout:fragment slots with the content page</text>

  <!-- layout -->
  <rect x="30" y="70" width="250" height="340" fill="#e8eefc" stroke="#2a4a9a" stroke-width="1.6"/>
  <text x="155" y="92" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle">lay/main.html (layout)</text>
  <rect x="44" y="104" width="222" height="56" fill="#ffffff" stroke="#2a4a9a"/>
  <text x="155" y="124" font-size="11" fill="#1d3a7a" text-anchor="middle">head</text>
  <text x="155" y="142" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">title, site.css, site.js</text>
  <rect x="44" y="170" width="222" height="40" fill="#ffffff" stroke="#2a4a9a"/>
  <text x="155" y="195" font-size="11" fill="#1d3a7a" text-anchor="middle">header and navigation</text>
  <rect x="44" y="220" width="222" height="52" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="155" y="240" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="content"</text>
  <text x="155" y="258" font-size="11" fill="#5c4600" text-anchor="middle">default text</text>
  <rect x="44" y="282" width="222" height="52" fill="#ffffff" stroke="#2a4a9a"/>
  <text x="155" y="302" font-size="11" fill="#1d3a7a" text-anchor="middle">footer</text>
  <text x="155" y="322" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="footer-extra"</text>
  <rect x="44" y="344" width="222" height="52" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="155" y="364" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="page-scripts"</text>
  <text x="155" y="382" font-size="11" fill="#5c4600" text-anchor="middle">empty by default</text>

  <!-- content -->
  <rect x="325" y="70" width="250" height="340" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="450" y="92" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">lay/detail.html (content)</text>
  <text x="450" y="110" font-size="10" font-family="Menlo, Consolas, monospace" fill="#14501f" text-anchor="middle">layout:decorate="~{lay/main(...)}"</text>
  <rect x="339" y="120" width="222" height="56" fill="#ffffff" stroke="#1e6b34"/>
  <text x="450" y="140" font-size="11" fill="#14501f" text-anchor="middle">head</text>
  <text x="450" y="158" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">title, detail.css</text>
  <rect x="339" y="220" width="222" height="52" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="450" y="240" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="content"</text>
  <text x="450" y="258" font-size="11" fill="#5c4600" text-anchor="middle">book details</text>
  <rect x="339" y="282" width="222" height="52" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="450" y="302" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="footer-extra"</text>
  <text x="450" y="320" font-size="11" fill="#5c4600" text-anchor="middle">Seen by reader</text>
  <rect x="339" y="344" width="222" height="52" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="450" y="364" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5c4600" text-anchor="middle">layout:fragment="page-scripts"</text>
  <text x="450" y="382" font-size="11" fill="#5c4600" text-anchor="middle">detail.js</text>

  <!-- result -->
  <rect x="620" y="70" width="250" height="340" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="745" y="92" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Rendered page</text>
  <rect x="634" y="104" width="222" height="96" fill="#ffffff" stroke="#444444"/>
  <text x="745" y="124" font-size="11" fill="#222222" text-anchor="middle">head, merged</text>
  <text x="745" y="142" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">title: content title and pattern</text>
  <text x="745" y="160" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">site.css, site.js (layout)</text>
  <text x="745" y="178" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">detail.css (content, appended)</text>
  <rect x="634" y="210" width="222" height="40" fill="#ffffff" stroke="#444444"/>
  <text x="745" y="235" font-size="11" fill="#222222" text-anchor="middle">header and navigation (layout)</text>
  <rect x="634" y="260" width="222" height="40" fill="#ffffff" stroke="#444444"/>
  <text x="745" y="285" font-size="11" fill="#222222" text-anchor="middle">book details (content)</text>
  <rect x="634" y="310" width="222" height="40" fill="#ffffff" stroke="#444444"/>
  <text x="745" y="335" font-size="11" fill="#222222" text-anchor="middle">footer plus Seen by reader</text>
  <rect x="634" y="360" width="222" height="36" fill="#ffffff" stroke="#444444"/>
  <text x="745" y="383" font-size="11" fill="#222222" text-anchor="middle">detail.js script at the end of body</text>

  <!-- arrows -->
  <line x1="280" y1="246" x2="322" y2="246" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="575" y1="246" x2="617" y2="246" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="301" y="236" font-size="10" fill="#444444" text-anchor="middle">same name</text>
  <text x="596" y="236" font-size="10" fill="#444444" text-anchor="middle">merge</text>
  <text x="450" y="436" font-size="11" fill="#666666" text-anchor="middle">Content outside a layout:fragment in the body is never executed, and th:if around a fragment is ignored.</text>
</svg>
