<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>some P names one specific, statically-known concrete type chosen by the implementation, with static dispatch and no boxing. any P erases the concrete type into a runtime existential box, with dynamic witness-table dispatch and potential heap allocation.</title>
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">`some P` vs. `any P`</text>
  <text x="410" y="46" font-size="11" fill="#666666" text-anchor="middle">both hide the concrete type from the caller's source -- they differ in what the compiler still knows</text>

  <!-- some P column -->
  <rect x="60" y="70" width="330" height="270" rx="10" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="225" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f3b5c">some Shape</text>
  <text x="225" y="116" font-size="10.5" text-anchor="middle" fill="#3d6fa5">opaque type</text>

  <rect x="150" y="132" width="150" height="46" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="225" y="160" font-size="12.5" text-anchor="middle" fill="#1f3b5c">Square</text>
  <text x="225" y="192" font-size="10.5" text-anchor="middle" fill="#3d6fa5">one fixed concrete type,</text>
  <text x="225" y="206" font-size="10.5" text-anchor="middle" fill="#3d6fa5">known to the compiler</text>

  <text x="225" y="234" font-size="11" text-anchor="middle" fill="#1f3b5c">static dispatch</text>
  <text x="225" y="252" font-size="11" text-anchor="middle" fill="#1f3b5c">no boxing / heap allocation</text>
  <text x="225" y="270" font-size="11" text-anchor="middle" fill="#1f3b5c">type identity preserved</text>
  <text x="225" y="288" font-size="11" text-anchor="middle" fill="#1f3b5c">Self requirements work</text>
  <text x="225" y="306" font-size="11" text-anchor="middle" fill="#1f3b5c">associated types work</text>
  <text x="225" y="324" font-size="10.5" text-anchor="middle" fill="#8a8a8a">caller cannot name the type</text>

  <!-- any P column -->
  <rect x="430" y="70" width="330" height="270" rx="10" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="595" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="#3c2a5c">any Shape</text>
  <text x="595" y="116" font-size="10.5" text-anchor="middle" fill="#6b4fa5">boxed protocol (existential) type</text>

  <rect x="500" y="132" width="190" height="46" rx="6" fill="#ffffff" stroke="#6b4fa5" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="595" y="152" font-size="11" text-anchor="middle" fill="#3c2a5c">box: Square or Circle</text>
  <text x="595" y="168" font-size="10.5" text-anchor="middle" fill="#8a8a8a">decided per value, at runtime</text>

  <text x="595" y="192" font-size="10.5" text-anchor="middle" fill="#6b4fa5">runtime existential box</text>

  <text x="595" y="234" font-size="11" text-anchor="middle" fill="#3c2a5c">dynamic witness-table dispatch</text>
  <text x="595" y="252" font-size="11" text-anchor="middle" fill="#3c2a5c">may heap-allocate</text>
  <text x="595" y="270" font-size="11" text-anchor="middle" fill="#3c2a5c">type identity erased</text>
  <text x="595" y="288" font-size="11" text-anchor="middle" fill="#3c2a5c">Self requirements unusable</text>
  <text x="595" y="306" font-size="11" text-anchor="middle" fill="#3c2a5c">associated types need binding</text>
  <text x="595" y="324" font-size="10.5" text-anchor="middle" fill="#8a8a8a">can mix concrete types in one collection</text>

  <text x="410" y="364" font-size="10.5" fill="#666666" text-anchor="middle">prefer `some` (or a generic parameter) unless the caller genuinely needs to mix different conforming types</text>
</svg>
