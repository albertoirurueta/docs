<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Struct layout and padding: struct Bad orders char, int, char, double and occupies 24 bytes with three padding gaps; reordering the same four members widest-first as struct Good occupies 16 bytes with only two trailing padding bytes.</title>
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
  <text x="390.0" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Member order decides how much padding you pay for</text>
  <text x="390.0" y="45" font-size="11" fill="#666666" text-anchor="middle">The same four members: 24 bytes declared carelessly, 16 bytes declared widest-first.</text>
  <text x="24" y="80" font-size="9" fill="#888888">byte offset</text>
  <text x="106" y="80" font-size="8" fill="#888888" text-anchor="middle">0</text>
  <line x1="92" y1="86" x2="92" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="132" y="80" font-size="8" fill="#888888" text-anchor="middle">1</text>
  <line x1="119" y1="86" x2="119" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="160" y="80" font-size="8" fill="#888888" text-anchor="middle">2</text>
  <line x1="146" y1="86" x2="146" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="186" y="80" font-size="8" fill="#888888" text-anchor="middle">3</text>
  <line x1="173" y1="86" x2="173" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="214" y="80" font-size="8" fill="#888888" text-anchor="middle">4</text>
  <line x1="200" y1="86" x2="200" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="240" y="80" font-size="8" fill="#888888" text-anchor="middle">5</text>
  <line x1="227" y1="86" x2="227" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="268" y="80" font-size="8" fill="#888888" text-anchor="middle">6</text>
  <line x1="254" y1="86" x2="254" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="294" y="80" font-size="8" fill="#888888" text-anchor="middle">7</text>
  <line x1="281" y1="86" x2="281" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="322" y="80" font-size="8" fill="#888888" text-anchor="middle">8</text>
  <line x1="308" y1="86" x2="308" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="348" y="80" font-size="8" fill="#888888" text-anchor="middle">9</text>
  <line x1="335" y1="86" x2="335" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="376" y="80" font-size="8" fill="#888888" text-anchor="middle">10</text>
  <line x1="362" y1="86" x2="362" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="402" y="80" font-size="8" fill="#888888" text-anchor="middle">11</text>
  <line x1="389" y1="86" x2="389" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="430" y="80" font-size="8" fill="#888888" text-anchor="middle">12</text>
  <line x1="416" y1="86" x2="416" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="456" y="80" font-size="8" fill="#888888" text-anchor="middle">13</text>
  <line x1="443" y1="86" x2="443" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="484" y="80" font-size="8" fill="#888888" text-anchor="middle">14</text>
  <line x1="470" y1="86" x2="470" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="80" font-size="8" fill="#888888" text-anchor="middle">15</text>
  <line x1="497" y1="86" x2="497" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="538" y="80" font-size="8" fill="#888888" text-anchor="middle">16</text>
  <line x1="524" y1="86" x2="524" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="564" y="80" font-size="8" fill="#888888" text-anchor="middle">17</text>
  <line x1="551" y1="86" x2="551" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="592" y="80" font-size="8" fill="#888888" text-anchor="middle">18</text>
  <line x1="578" y1="86" x2="578" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="618" y="80" font-size="8" fill="#888888" text-anchor="middle">19</text>
  <line x1="605" y1="86" x2="605" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="646" y="80" font-size="8" fill="#888888" text-anchor="middle">20</text>
  <line x1="632" y1="86" x2="632" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="672" y="80" font-size="8" fill="#888888" text-anchor="middle">21</text>
  <line x1="659" y1="86" x2="659" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="80" font-size="8" fill="#888888" text-anchor="middle">22</text>
  <line x1="686" y1="86" x2="686" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="726" y="80" font-size="8" fill="#888888" text-anchor="middle">23</text>
  <line x1="713" y1="86" x2="713" y2="90" stroke="#cccccc" stroke-width="1"/>
  <text x="24" y="116" font-size="12" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">struct Bad</text>
  <text x="24" y="132" font-size="9" fill="#666666">char a; int b; char c; double d;</text>
  <rect x="92" y="96" width="27" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.3" rx="3"/>
  <text x="106" y="118" font-size="9" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">a</text>
  <rect x="119" y="96" width="81" height="34" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" stroke-dasharray="3 2" rx="3"/>
  <text x="160" y="118" font-size="10" fill="#6a1f1f" text-anchor="middle" font-family="'Courier New', monospace">padding</text>
  <rect x="200" y="96" width="108" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="3"/>
  <text x="254" y="118" font-size="10" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">b (int)</text>
  <rect x="308" y="96" width="27" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.3" rx="3"/>
  <text x="322" y="118" font-size="9" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">c</text>
  <rect x="335" y="96" width="189" height="34" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" stroke-dasharray="3 2" rx="3"/>
  <text x="430" y="118" font-size="10" fill="#6a1f1f" text-anchor="middle" font-family="'Courier New', monospace">padding</text>
  <rect x="524" y="96" width="216" height="34" fill="#f3ecf3" stroke="#7a4a8a" stroke-width="1.3" rx="3"/>
  <text x="632" y="118" font-size="10" fill="#4a2352" text-anchor="middle" font-family="'Courier New', monospace">d (double)</text>
  <text x="748" y="118" font-size="11" font-weight="bold" fill="#6a1f1f">24 bytes</text>
  <text x="748" y="132" font-size="9" fill="#6a1f1f">10 wasted</text>
  <text x="24" y="206" font-size="12" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">struct Good</text>
  <text x="24" y="222" font-size="9" fill="#666666">double d; int b; char a; char c;</text>
  <rect x="92" y="186" width="216" height="34" fill="#f3ecf3" stroke="#7a4a8a" stroke-width="1.3" rx="3"/>
  <text x="200" y="208" font-size="10" fill="#4a2352" text-anchor="middle" font-family="'Courier New', monospace">d (double)</text>
  <rect x="308" y="186" width="108" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="3"/>
  <text x="362" y="208" font-size="10" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">b (int)</text>
  <rect x="416" y="186" width="27" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.3" rx="3"/>
  <text x="430" y="208" font-size="9" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">a</text>
  <rect x="443" y="186" width="27" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.3" rx="3"/>
  <text x="456" y="208" font-size="9" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">c</text>
  <rect x="470" y="186" width="54" height="34" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" stroke-dasharray="3 2" rx="3"/>
  <text x="497" y="208" font-size="10" fill="#6a1f1f" text-anchor="middle" font-family="'Courier New', monospace">pad</text>
  <text x="532" y="208" font-size="11" font-weight="bold" fill="#2f5424">16 bytes</text>
  <text x="532" y="222" font-size="9" fill="#2f5424">2 padding</text>
  <text x="24" y="272" font-size="10" font-weight="bold" fill="#444444">Legend</text>
  <rect x="92" y="258" width="20" height="14" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2" rx="2"/>
  <text x="118" y="270" font-size="9" fill="#444444">char (align 1)</text>
  <rect x="217.60000000000002" y="258" width="20" height="14" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.2" rx="2"/>
  <text x="243.60000000000002" y="270" font-size="9" fill="#444444">int (align 4)</text>
  <rect x="337.8" y="258" width="20" height="14" fill="#f3ecf3" stroke="#7a4a8a" stroke-width="1.2" rx="2"/>
  <text x="363.8" y="270" font-size="9" fill="#444444">double (align 8)</text>
  <rect x="474.20000000000005" y="258" width="20" height="14" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.2" stroke-dasharray="3 2" rx="2"/>
  <text x="500.20000000000005" y="270" font-size="9" fill="#444444">padding inserted by the compiler</text>
  <rect x="24" y="296" width="352" height="112" fill="#fbfbfb" stroke="#bbbbbb" stroke-width="1.2" rx="5"/>
  <text x="200" y="316" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Why the gaps exist</text>
  <text x="40" y="336" font-size="9.5" fill="#444444">Each member sits at an offset that is a multiple of</text>
  <text x="40" y="353" font-size="9.5" fill="#444444">its own alignment, so int b cannot start at offset 1.</text>
  <text x="40" y="370" font-size="9.5" fill="#444444">The struct's own size is rounded up to a multiple of</text>
  <text x="40" y="387" font-size="9.5" fill="#444444">its widest alignment, so an array of them stays aligned.</text>
  <rect x="396" y="296" width="358" height="112" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="5"/>
  <text x="575" y="316" font-size="11" font-weight="bold" fill="#5c4a14" text-anchor="middle">What to do about it</text>
  <text x="412" y="336" font-size="9.5" fill="#444444">Declare widest members first when a struct is</text>
  <text x="412" y="353" font-size="9.5" fill="#444444">allocated in bulk. Never memcmp two structs or</text>
  <text x="412" y="370" font-size="9.5" fill="#444444">write one to a socket: padding bytes are</text>
  <text x="412" y="387" font-size="9.5" fill="#444444">indeterminate. Pin a layout with static_assert.</text>
</svg>
