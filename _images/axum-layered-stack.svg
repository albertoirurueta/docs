<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The tokio → hyper → tower → axum stack</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">each layer only depends on the ones below it; your code lives at the top</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <!-- application -->
  <rect x="60" y="66" width="600" height="56" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="80" y="89" font-size="14" font-weight="bold" fill="#6a3d9a">Your application (Bookshelf)</text>
  <text x="80" y="109" font-size="12" fill="#222222">handlers, AppState, AppError, domain crate shelf-core, sqlx repositories</text>
  <!-- axum -->
  <rect x="60" y="134" width="600" height="66" rx="6" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="80" y="157" font-size="14" font-weight="bold" fill="#b7410e">axum 0.8 (+ axum-core, axum-extra, axum-macros)</text>
  <text x="80" y="176" font-size="12" fill="#222222">Router and path matching (matchit), Handler trait, extractors (FromRequestParts / FromRequest),</text>
  <text x="80" y="192" font-size="12" fill="#222222">IntoResponse, State and FromRef, middleware::from_fn, axum::serve</text>
  <!-- tower -->
  <rect x="60" y="212" width="600" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="235" font-size="14" font-weight="bold" fill="#2e7d32">tower 0.5 + tower-http 0.7</text>
  <text x="80" y="254" font-size="12" fill="#222222">the Service trait (poll_ready + call) and Layer; ServiceBuilder; timeouts, rate limits;</text>
  <text x="80" y="270" font-size="12" fill="#222222">HTTP middleware: TraceLayer, CorsLayer, CompressionLayer, ServeDir, CsrfLayer …</text>
  <!-- hyper -->
  <rect x="60" y="290" width="600" height="66" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="80" y="313" font-size="14" font-weight="bold" fill="#1c4b73">hyper 1 + hyper-util</text>
  <text x="80" y="332" font-size="12" fill="#222222">HTTP/1.1 and HTTP/2 connection state machines, header parsing, keep-alive,</text>
  <text x="80" y="348" font-size="12" fill="#222222">the http crate's Request / Response types and http-body bodies</text>
  <!-- tokio -->
  <rect x="60" y="368" width="600" height="66" rx="6" fill="#eeeeee" stroke="#444444" stroke-width="1.5"/>
  <text x="80" y="391" font-size="14" font-weight="bold" fill="#333333">tokio 1</text>
  <text x="80" y="410" font-size="12" fill="#222222">multi-thread scheduler, TcpListener and sockets (epoll / kqueue / IOCP), timers,</text>
  <text x="80" y="426" font-size="12" fill="#222222">tokio::spawn, spawn_blocking, sync primitives (Mutex, broadcast, mpsc)</text>
  <!-- side notes -->
  <g font-size="12" fill="#222222">
    <text x="700" y="90" font-weight="bold">What each layer gives you</text>
    <line x1="690" y1="100" x2="690" y2="430" stroke="#bbbbbb"/>
    <text x="700" y="167">ergonomics: typed</text>
    <text x="700" y="183">extraction and responses</text>
    <text x="700" y="245">composition: reusable</text>
    <text x="700" y="261">middleware for any Service</text>
    <text x="700" y="323">protocol: correct, fast</text>
    <text x="700" y="339">HTTP/1 and HTTP/2</text>
    <text x="700" y="401">execution: async I/O and</text>
    <text x="700" y="417">work-stealing scheduler</text>
  </g>
  <line x1="40" y1="430" x2="40" y2="80" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="30" y="260" font-size="12" fill="#444444" text-anchor="middle" transform="rotate(-90 30 260)">request flows up, response flows down</text>
  <text x="470" y="458" font-size="11" fill="#666666" text-anchor="middle">Because every layer above hyper is a tower Service, the same middleware also runs under tonic (gRPC) and lambda_http (AWS Lambda).</text>
</svg>
