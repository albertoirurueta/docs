<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">OAuth 1.0a signature base string construction</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">method + URL + sorted, percent-encoded parameters, then HMAC-SHA1 with the two secrets</text>

  <!-- Step 1: method -->
  <rect x="40" y="66" width="150" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="115" y="86" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. HTTP method</text>
  <text x="115" y="102" font-size="11" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">GET</text>

  <!-- Step 2: URL -->
  <rect x="210" y="66" width="240" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="330" y="86" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">2. base URL, percent-encoded</text>
  <text x="330" y="102" font-size="9.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">http%3A%2F%2Fphotos.example.net%2Fphotos</text>

  <!-- Step 3: params -->
  <rect x="470" y="66" width="250" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="595" y="86" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">3. sorted params, percent-encoded</text>
  <text x="595" y="102" font-size="9.5" fill="#333333" text-anchor="middle">file, oauth_*, size -- see box below</text>

  <!-- param list box -->
  <rect x="40" y="132" width="680" height="150" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="380" y="150" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Normalised parameters (sorted by key, "&amp;"-joined, then percent-encoded as a whole)</text>
  <text x="55" y="168" font-size="10" fill="#333333" font-family="'Courier New', monospace">file=vacation.jpg</text>
  <text x="55" y="182" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_consumer_key=dpf43f3p2l4k3l03</text>
  <text x="55" y="196" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_nonce=kllo9940pd9333jh</text>
  <text x="55" y="210" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_signature_method=HMAC-SHA1</text>
  <text x="55" y="224" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_timestamp=1191242096</text>
  <text x="55" y="238" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_token=nnch734d00sl2jdk</text>
  <text x="55" y="252" font-size="10" fill="#333333" font-family="'Courier New', monospace">oauth_version=1.0</text>
  <text x="55" y="266" font-size="10" fill="#333333" font-family="'Courier New', monospace">size=original</text>

  <!-- arrow down to base string -->
  <line x1="380" y1="282" x2="380" y2="310" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- base string result -->
  <rect x="30" y="316" width="700" height="76" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="332" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Signature base string (method &amp; URL &amp; parameters, "&amp;"-joined)</text>
  <text x="45" y="350" font-size="8.3" fill="#333333" font-family="'Courier New', monospace">GET&amp;http%3A%2F%2Fphotos.example.net%2Fphotos&amp;file%3Dvacation.jpg%26oauth_consumer_key%3Ddpf43f3p2l4k3l03</text>
  <text x="45" y="363" font-size="8.3" fill="#333333" font-family="'Courier New', monospace">%26oauth_nonce%3Dkllo9940pd9333jh%26oauth_signature_method%3DHMAC-SHA1%26oauth_timestamp%3D1191242096</text>
  <text x="45" y="376" font-size="8.3" fill="#333333" font-family="'Courier New', monospace">%26oauth_token%3Dnnch734d00sl2jdk%26oauth_version%3D1.0%26size%3Doriginal</text>

  <!-- arrow down to HMAC -->
  <line x1="380" y1="392" x2="380" y2="418" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- HMAC key -->
  <rect x="30" y="424" width="700" height="80" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="380" y="440" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">HMAC-SHA1(base string, key = consumer_secret &amp; token_secret, both percent-encoded)</text>
  <text x="380" y="458" font-size="9.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">key = kd94hf93k423kf44&amp;pfkkdhi9sl3r4s00</text>
  <text x="380" y="476" font-size="9.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">oauth_signature = tR3+Ty81lMeYAr/Fid0kMTYa/WM=</text>
  <text x="380" y="493" font-size="9.5" fill="#666666" text-anchor="middle">(base64-encoded; itself percent-encoded again when placed in the Authorization header)</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
