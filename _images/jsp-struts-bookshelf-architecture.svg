<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c2b2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b4c8c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6b3a"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The two Bookshelf applications on Tomcat 11</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">Same domain, same service and repository, two ways to reach the JSP view: a hand-written servlet (Part I) or the Struts filter (Part II)</text>

  <!-- Tomcat container frame -->
  <rect x="150" y="62" width="740" height="440" fill="#fafafa" stroke="#999999" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="165" y="80" font-size="12" font-weight="bold" fill="#555555">Apache Tomcat 11 (Servlet 6.1, Pages 4.0, EL 6.0), one WAR per variant</text>

  <!-- Browser -->
  <rect x="20" y="230" width="110" height="100" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="75" y="268" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="75" y="288" font-size="11" fill="#444444" text-anchor="middle">GET and POST</text>
  <text x="75" y="304" font-size="11" fill="#444444" text-anchor="middle">forms, links</text>

  <!-- Part I lane -->
  <text x="170" y="106" font-size="13" font-weight="bold" fill="#5a1a1a">Part I: bookshelf-jsp (Model 2 with a servlet)</text>
  <rect x="170" y="116" width="150" height="76" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.6"/>
  <text x="245" y="142" font-size="13" font-weight="bold" fill="#5a1a1a" text-anchor="middle">Front servlet</text>
  <text x="245" y="160" font-size="11" fill="#8c2b2b" text-anchor="middle">/books, /books/*</text>
  <text x="245" y="176" font-size="11" fill="#8c2b2b" text-anchor="middle">command per path</text>

  <!-- Part II lane -->
  <text x="170" y="434" font-size="13" font-weight="bold" fill="#1a4a2a">Part II: bookshelf-struts (Struts 7 filter)</text>
  <rect x="170" y="336" width="150" height="76" fill="#e6f4ea" stroke="#2b6b3a" stroke-width="1.6"/>
  <text x="245" y="360" font-size="13" font-weight="bold" fill="#1a4a2a" text-anchor="middle">Struts filter</text>
  <text x="245" y="378" font-size="11" fill="#2b6b3a" text-anchor="middle">mapper, proxy,</text>
  <text x="245" y="394" font-size="11" fill="#2b6b3a" text-anchor="middle">interceptors, action</text>

  <!-- Shared service and repository -->
  <rect x="400" y="226" width="150" height="108" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="475" y="252" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Service</text>
  <text x="475" y="270" font-size="11" fill="#2b4c8c" text-anchor="middle">BookService</text>
  <line x1="410" y1="282" x2="540" y2="282" stroke="#2b4c8c" stroke-width="1"/>
  <text x="475" y="302" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Repository</text>
  <text x="475" y="320" font-size="11" fill="#2b4c8c" text-anchor="middle">BookRepository</text>

  <!-- Data -->
  <rect x="640" y="236" width="120" height="88" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="700" y="274" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Data store</text>
  <text x="700" y="294" font-size="11" fill="#444444" text-anchor="middle">books, authors,</text>
  <text x="700" y="310" font-size="11" fill="#444444" text-anchor="middle">reviews</text>

  <!-- JSP view -->
  <rect x="640" y="116" width="230" height="76" fill="#fff4d6" stroke="#8c6b1a" stroke-width="1.6"/>
  <text x="755" y="142" font-size="13" font-weight="bold" fill="#5a4210" text-anchor="middle">JSP view (WEB-INF/jsp)</text>
  <text x="755" y="160" font-size="11" fill="#8c6b1a" text-anchor="middle">EL and JSTL render the model:</text>
  <text x="755" y="176" font-size="11" fill="#8c6b1a" text-anchor="middle">request attributes set by the servlet</text>

  <rect x="640" y="356" width="230" height="76" fill="#fff4d6" stroke="#8c6b1a" stroke-width="1.6"/>
  <text x="755" y="382" font-size="13" font-weight="bold" fill="#5a4210" text-anchor="middle">JSP view (under WEB-INF)</text>
  <text x="755" y="400" font-size="11" fill="#8c6b1a" text-anchor="middle">Struts tags and EL read the</text>
  <text x="755" y="416" font-size="11" fill="#8c6b1a" text-anchor="middle">action properties on the ValueStack</text>

  <!-- arrows: browser to controllers -->
  <path d="M 130 260 L 150 260 L 150 154 L 168 154" fill="none" stroke="#8c2b2b" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <path d="M 130 300 L 150 300 L 150 374 L 168 374" fill="none" stroke="#2b6b3a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- controllers to service -->
  <path d="M 320 154 L 360 154 L 360 262 L 398 262" fill="none" stroke="#8c2b2b" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <path d="M 320 374 L 360 374 L 360 298 L 398 298" fill="none" stroke="#2b6b3a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- service to data -->
  <line x1="550" y1="280" x2="638" y2="280" stroke="#2b4c8c" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- controllers to views -->
  <line x1="320" y1="130" x2="638" y2="130" stroke="#8c2b2b" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="480" y="124" font-size="11" fill="#8c2b2b" text-anchor="middle">forward to the JSP</text>
  <line x1="320" y1="398" x2="638" y2="398" stroke="#2b6b3a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="480" y="392" font-size="11" fill="#2b6b3a" text-anchor="middle">result: dispatcher</text>

  <!-- response -->
  <path d="M 870 154 L 885 154 L 885 520 L 75 520 L 75 332" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M 870 394 L 880 394 L 880 514 L 80 514 L 80 332" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="450" y="540" font-size="11" fill="#444444" text-anchor="middle">HTML response (dashed): the JSP view writes it, the container sends it back to the browser</text>
</svg>
