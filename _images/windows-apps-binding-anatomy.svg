<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a WPF binding in Bookshelf Desktop</text>
  <text x="400" y="48" font-size="13" fill="#666666" text-anchor="middle">TextBox.Text bound to SelectedBook.Title: the target is a dependency property, the source is any CLR property</text>

  <rect x="20" y="70" width="220" height="230" rx="12" fill="#eef7ee" stroke="#2a6a2a" stroke-width="2"/>
  <text x="130" y="94" font-size="14" font-weight="bold" fill="#2a6a2a" text-anchor="middle">Binding target</text>
  <text x="36" y="120" font-size="12" fill="#333333">A DependencyObject</text>
  <text x="36" y="138" font-size="12" fill="#333333">(for example a TextBox)</text>
  <text x="36" y="168" font-size="12" fill="#333333">Target property:</text>
  <text x="36" y="186" font-size="12" font-weight="bold" fill="#333333">TextBox.TextProperty</text>
  <text x="36" y="204" font-size="12" fill="#333333">(must be a dependency property)</text>
  <text x="36" y="234" font-size="12" fill="#333333">Holds a BindingExpression that</text>
  <text x="36" y="252" font-size="12" fill="#333333">is the live link to the source.</text>
  <text x="36" y="282" font-size="12" fill="#333333">Raises Target/SourceUpdated.</text>

  <rect x="290" y="70" width="220" height="230" rx="12" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="400" y="94" font-size="14" font-weight="bold" fill="#7a5a10" text-anchor="middle">Binding (the engine)</text>
  <text x="306" y="118" font-size="12" fill="#333333">Mode, UpdateSourceTrigger, Delay</text>
  <text x="306" y="138" font-size="12" fill="#333333">Converter, ConverterParameter</text>
  <text x="306" y="158" font-size="12" fill="#333333">StringFormat, ConverterCulture</text>
  <text x="306" y="178" font-size="12" fill="#333333">FallbackValue, TargetNullValue</text>
  <text x="306" y="198" font-size="12" fill="#333333">IsAsync, ValidationRules</text>
  <text x="306" y="228" font-size="12" font-weight="bold" fill="#333333">Source (pick at most one):</text>
  <text x="306" y="246" font-size="12" fill="#333333">Source, RelativeSource,</text>
  <text x="306" y="264" font-size="12" fill="#333333">ElementName, else DataContext</text>
  <text x="306" y="284" font-size="12" fill="#333333">then Path walks to the value</text>

  <rect x="560" y="70" width="220" height="230" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="670" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Binding source</text>
  <text x="576" y="120" font-size="12" fill="#333333">Any object: BookViewModel,</text>
  <text x="576" y="138" font-size="12" fill="#333333">a DependencyObject, XML ...</text>
  <text x="576" y="168" font-size="12" fill="#333333">Source property (the Path):</text>
  <text x="576" y="186" font-size="12" font-weight="bold" fill="#333333">SelectedBook.Title</text>
  <text x="576" y="216" font-size="12" fill="#333333">Change notification through:</text>
  <text x="576" y="234" font-size="12" fill="#333333">INotifyPropertyChanged,</text>
  <text x="576" y="252" font-size="12" fill="#333333">INotifyCollectionChanged, or a</text>
  <text x="576" y="270" font-size="12" fill="#333333">dependency property.</text>

  <line x1="242" y1="140" x2="288" y2="140" stroke="#1c4b73" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="512" y1="140" x2="558" y2="140" stroke="#1c4b73" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <rect x="20" y="318" width="760" height="64" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1"/>
  <text x="36" y="340" font-size="12" fill="#333333">Direction by Mode:  OneTime = source to target once at load   |   OneWay = source to target on every change</text>
  <text x="36" y="358" font-size="12" fill="#333333">TwoWay = both ways (target to source on the UpdateSourceTrigger)   |   OneWayToSource = target to source only</text>
  <text x="36" y="376" font-size="12" fill="#333333">Markup:  Text="{Binding SelectedBook.Title, Mode=TwoWay, UpdateSourceTrigger=PropertyChanged}"</text>
</svg>
