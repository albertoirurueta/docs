<svg viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Evaluating a RAG system: where each metric applies</text>
  <text x="390" y="48" font-size="12" fill="#666666" text-anchor="middle">Offline metrics on a golden set, plus online signals collected once the system is live</text>

  <!-- Pipeline spine -->
  <rect x="40" y="70" width="150" height="40" rx="6" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="115" y="95" font-size="12.5" fill="#1c4b73" text-anchor="middle">Query</text>

  <line x1="190" y1="90" x2="240" y2="90" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="70" width="150" height="40" rx="6" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="315" y="95" font-size="12.5" fill="#1c4b73" text-anchor="middle">Retrieval (ANN)</text>

  <line x1="390" y1="90" x2="440" y2="90" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="70" width="150" height="40" rx="6" fill="#fdf1e6" stroke="#a35a1a" stroke-width="1.5"/>
  <text x="515" y="95" font-size="12.5" fill="#a35a1a" text-anchor="middle">Generation (LLM)</text>

  <line x1="590" y1="90" x2="640" y2="90" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="70" width="110" height="40" rx="6" fill="#eef7ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="695" y="95" font-size="12.5" fill="#2f5424" text-anchor="middle">Answer</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Connector down to retrieval metrics box -->
  <line x1="315" y1="110" x2="315" y2="140" stroke="#1c4b73" stroke-width="1.5"/>
  <!-- Connector down to generation metrics box -->
  <line x1="515" y1="110" x2="515" y2="140" stroke="#a35a1a" stroke-width="1.5"/>

  <!-- Retrieval metrics box -->
  <rect x="30" y="140" width="380" height="230" rx="6" fill="#fbfbfb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="220" y="164" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Retrieval metrics (does the right chunk come back?)</text>

  <text x="50" y="188" font-size="12" fill="#222222">precision@k</text>
  <text x="230" y="188" font-size="11" fill="#666666">relevant hits among the top k</text>

  <text x="50" y="210" font-size="12" fill="#222222">recall@k</text>
  <text x="230" y="210" font-size="11" fill="#666666">relevant items found among all relevant</text>

  <text x="50" y="232" font-size="12" fill="#222222">MRR</text>
  <text x="230" y="232" font-size="11" fill="#666666">how high the first relevant hit ranks</text>

  <text x="50" y="254" font-size="12" fill="#222222">nDCG@k</text>
  <text x="230" y="254" font-size="11" fill="#666666">graded relevance, discounted by rank</text>

  <text x="50" y="276" font-size="12" fill="#222222">hit rate@k</text>
  <text x="230" y="276" font-size="11" fill="#666666">fraction of queries with &gt;= 1 hit</text>

  <line x1="50" y1="292" x2="390" y2="292" stroke="#dddddd" stroke-width="1"/>

  <text x="50" y="314" font-size="12" fill="#222222">ANN recall@k</text>
  <text x="230" y="314" font-size="11" fill="#666666">HNSW/IVF vs. a flat index (ground truth)</text>

  <text x="50" y="336" font-size="12" fill="#222222">context precision/recall</text>
  <text x="230" y="336" font-size="11" fill="#666666">RAGAS: are retrieved chunks used and complete?</text>

  <text x="50" y="358" font-size="11" fill="#888888">measured with a golden question set, offline</text>

  <!-- Generation metrics box -->
  <rect x="430" y="140" width="320" height="230" rx="6" fill="#fdf8f2" stroke="#a35a1a" stroke-width="1.5"/>
  <text x="590" y="164" font-size="13.5" font-weight="bold" fill="#a35a1a" text-anchor="middle">Generation metrics (is the answer right?)</text>

  <text x="450" y="188" font-size="12" fill="#222222">faithfulness</text>
  <text x="450" y="204" font-size="11" fill="#666666">claims are supported by retrieved context</text>

  <text x="450" y="226" font-size="12" fill="#222222">answer relevancy</text>
  <text x="450" y="242" font-size="11" fill="#666666">the answer actually addresses the question</text>

  <text x="450" y="264" font-size="12" fill="#222222">correctness (spot-check)</text>
  <text x="450" y="280" font-size="11" fill="#666666">matches a reference answer, human or judge-scored</text>

  <line x1="450" y1="296" x2="730" y2="296" stroke="#dddddd" stroke-width="1"/>

  <text x="450" y="318" font-size="12" fill="#222222">LLM-as-a-judge</text>
  <text x="450" y="334" font-size="11" fill="#666666">scores faithfulness/relevancy; watch for bias</text>

  <text x="450" y="356" font-size="11" fill="#888888">RAGAS, Spring AI RelevancyEvaluator/FactCheckingEvaluator</text>

  <!-- Online signals box -->
  <rect x="30" y="400" width="720" height="130" rx="6" fill="#eef7ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="390" y="424" font-size="13.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Online signals (collected once the system is live, not from the golden set)</text>

  <text x="55" y="454" font-size="12" fill="#222222">click-through rate</text>
  <text x="55" y="470" font-size="11" fill="#666666">users open a cited source</text>

  <text x="290" y="454" font-size="12" fill="#222222">thumbs up / down</text>
  <text x="290" y="470" font-size="11" fill="#666666">explicit user feedback per answer</text>

  <text x="525" y="454" font-size="12" fill="#222222">follow-up rate</text>
  <text x="525" y="470" font-size="11" fill="#666666">a rephrase or retry implies a bad answer</text>

  <text x="55" y="498" font-size="11" fill="#888888">Cheap, continuous, noisy -- a complement to offline metrics, not a replacement.</text>

  <text x="390" y="546" font-size="11" fill="#888888" text-anchor="middle">Regression-test chunking, embedding-model and index changes by re-running the same offline metrics on the same golden set.</text>
</svg>
