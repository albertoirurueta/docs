<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What to keep from the books and what to replace</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="20" y="48" width="350" height="290" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="32" y="72" font-size="14" fill="#065F46" text-anchor="start" font-weight="bold">Keep: the explanations</text>
<rect x="390" y="48" width="350" height="290" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="402" y="72" font-size="14" fill="#92400E" text-anchor="start" font-weight="bold">Replace: the typed details</text>
<text x="36" y="96" font-size="12" fill="#1F2937" text-anchor="start">+  The render pipeline from vertices to pixels</text>
<text x="36" y="128" font-size="12" fill="#1F2937" text-anchor="start">+  Coordinate spaces and the MVP chain</text>
<text x="36" y="160" font-size="12" fill="#1F2937" text-anchor="start">+  Textures, samplers and mipmaps</text>
<text x="36" y="192" font-size="12" fill="#1F2937" text-anchor="start">+  Lighting models and physically based shading</text>
<text x="36" y="224" font-size="12" fill="#1F2937" text-anchor="start">+  Render passes, depth and shadow maps</text>
<text x="36" y="256" font-size="12" fill="#1F2937" text-anchor="start">+  Compute, threadgroups and particles</text>
<text x="36" y="288" font-size="12" fill="#1F2937" text-anchor="start">+  The ideas behind tessellation and deferred shading</text>
<text x="406" y="96" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Command buffer per frame: reusable buffer and allocator</text>
<text x="406" y="128" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Per-call binding: argument tables</text>
<text x="406" y="160" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Argument encoders: gpuResourceID and address writes</text>
<text x="406" y="192" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Raymarching only: hardware ray tracing</text>
<text x="406" y="224" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Tessellation for amplification: mesh shaders</text>
<text x="406" y="256" font-size="12" fill="#1F2937" text-anchor="start">&gt;  MPSCNN networks: MPSGraph and the Metal 4 ML encoder</text>
<text x="406" y="288" font-size="12" fill="#1F2937" text-anchor="start">&gt;  Old capture UI: Performance HUD and CLI tools</text>
<text x="380" y="366" font-size="11" fill="#374151" text-anchor="middle">Read the books for the ideas and this sub-section for the code that builds on the 26 and 27 SDKs</text>
</svg>
