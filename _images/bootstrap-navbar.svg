<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>

  <text x="280" y="24" font-size="14" fill="#666666" text-anchor="middle">Expanded navbar (viewport &gt;= navbar-expand breakpoint)</text>

  <!-- expanded navbar bar -->
  <rect x="20" y="38" width="520" height="60" fill="#f8f9fa" stroke="#8a8f96" stroke-width="1.5"/>

  <!-- brand -->
  <rect x="36" y="52" width="90" height="32" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="81" y="73" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Brand</text>

  <!-- nav links -->
  <text x="230" y="73" font-size="13" fill="#2a6636" font-weight="bold" text-anchor="middle">Home</text>
  <line x1="200" y1="82" x2="260" y2="82" stroke="#2a6636" stroke-width="2"/>
  <text x="330" y="73" font-size="13" fill="#333333" text-anchor="middle">Features</text>
  <text x="410" y="73" font-size="13" fill="#333333" text-anchor="middle">Pricing</text>

  <!-- search/button on right -->
  <rect x="460" y="54" width="60" height="28" rx="4" fill="#f6d9a4" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="490" y="72" font-size="11" fill="#6b4207" text-anchor="middle">Search</text>

  <text x="280" y="140" font-size="14" fill="#666666" text-anchor="middle">Collapsed navbar (viewport &lt; navbar-expand breakpoint)</text>

  <!-- collapsed navbar bar -->
  <rect x="150" y="156" width="260" height="56" fill="#f8f9fa" stroke="#8a8f96" stroke-width="1.5"/>

  <!-- brand -->
  <rect x="164" y="170" width="80" height="28" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="204" y="189" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Brand</text>

  <!-- toggler button -->
  <rect x="330" y="170" width="44" height="28" rx="4" fill="#ffffff" stroke="#8a8f96" stroke-width="1.5"/>
  <line x1="338" y1="179" x2="366" y2="179" stroke="#495057" stroke-width="2.5"/>
  <line x1="338" y1="184" x2="366" y2="184" stroke="#495057" stroke-width="2.5"/>
  <line x1="338" y1="189" x2="366" y2="189" stroke="#495057" stroke-width="2.5"/>
  <text x="352" y="222" font-size="11" fill="#666666" text-anchor="middle">.navbar-toggler</text>

  <!-- collapsed menu below (open state) -->
  <rect x="150" y="230" width="260" height="56" fill="#f1f3f5" stroke="#8a8f96" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="252" font-size="12" fill="#2a6636" font-weight="bold" text-anchor="middle">Home</text>
  <text x="280" y="268" font-size="12" fill="#333333" text-anchor="middle">Features</text>
  <text x="280" y="284" font-size="11" fill="#666666" text-anchor="middle">.navbar-collapse (shown)</text>
</svg>
