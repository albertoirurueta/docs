<path d="M675.0,180 a8,8 0 0 1 8,-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" transform="translate(0,0)"/>
<circle cx="655.0" cy="190" r="8" fill="none" stroke="#1E1B4B" stroke-width="1.2" opacity="0.6"/>
<path d="M647.0,190 a8,8 0 0 1 8,-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" transform="translate(0,0)"/>
<circle cx="633.0" cy="188" r="8" fill="none" stroke="#1E1B4B" stroke-width="1.2" opacity="0.6"/>
<path d="M625.0,188 a8,8 0 0 1 8,-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" transform="translate(0,0)"/>
<circle cx="693.0" cy="158" r="8" fill="none" stroke="#1E1B4B" stroke-width="1.2" opacity="0.6"/>
<path d="M685.0,158 a8,8 0 0 1 8,-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" transform="translate(0,0)"/>
<text x="663.0" y="255" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">+ normal map</text>
<text x="663.0" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bumps catch the light</text>
<text x="380" y="336" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">The fragment shader sums the terms: ambient + diffuse * attenuation + specular * attenuation.</text>
</svg>
