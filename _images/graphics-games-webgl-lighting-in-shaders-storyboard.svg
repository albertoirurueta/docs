<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-lighting-in-shaders-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><radialGradient id="lsg0" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#A5B4FC"/><stop offset="1" stop-color="#A5B4FC"/></radialGradient><radialGradient id="lsg1" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#312E81"/></radialGradient><radialGradient id="lsg2" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.25" stop-color="#C7D2FE"/><stop offset="1" stop-color="#312E81"/></radialGradient><radialGradient id="lsg3" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.25" stop-color="#C7D2FE"/><stop offset="1" stop-color="#312E81"/></radialGradient></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: building up the lit book, one term at a time</text>
<rect x="20" y="50" width="170" height="260" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="34" cy="66" r="11" fill="#4F46E5"/>
<text x="34" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="105.0" cy="170" r="52" fill="url(#lsg0)" stroke="#4F46E5" stroke-width="1"/>
<text x="105.0" y="255" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Ambient only</text>
<text x="105.0" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">flat, no depth</text>
<rect x="206" y="50" width="170" height="260" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="220" cy="66" r="11" fill="#4F46E5"/>
<text x="220" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="291.0" cy="170" r="52" fill="url(#lsg1)" stroke="#4F46E5" stroke-width="1"/>
<text x="291.0" y="255" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">+ diffuse</text>
<text x="291.0" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">N.L shapes the form</text>
<rect x="392" y="50" width="170" height="260" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="406" cy="66" r="11" fill="#4F46E5"/>
<text x="406" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="477.0" cy="170" r="52" fill="url(#lsg2)" stroke="#4F46E5" stroke-width="1"/>
<text x="477.0" y="255" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">+ Blinn-Phong highlight</text>
<text x="477.0" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shininess 32</text>
<rect x="578" y="50" width="170" height="260" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="592" cy="66" r="11" fill="#4F46E5"/>
<text x="592" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="663.0" cy="170" r="52" fill="url(#lsg3)" stroke="#4F46E5" stroke-width="1"/>
<circle cx="641.0" cy="160" r="8" fill="none" stroke="#1E1B4B" stroke-width="1.2" opacity="0.6"/>
<path d="M633.0,160 a8,8 0 0 1 8,-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" transform="translate(0,0)"/>
