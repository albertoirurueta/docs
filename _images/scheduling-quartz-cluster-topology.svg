<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A Quartz JDBC cluster: identical nodes, one shared database, no node-to-node traffic</text>
  <defs>
    <marker id="qt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="qt-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- ============ the nodes ============ -->
  <text x="170" y="62" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Replicas of one Deployment (or three hosts)</text>

  <rect x="20" y="76" width="300" height="104" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="98" font-size="13" font-weight="bold" fill="#222222">Pod bookshelf-7c9d-abcde</text>
  <text x="34" y="118" font-size="11" fill="#333333">scheduler name   BookshelfCluster</text>
  <text x="34" y="134" font-size="11" fill="#333333">instanceId       bookshelf-7c9d-abcde (pod name)</text>
  <text x="34" y="150" font-size="11" fill="#333333">isClustered      true, same properties as the others</text>
  <text x="34" y="166" font-size="10.5" fill="#666666">threadCount may differ per node</text>

  <rect x="20" y="194" width="300" height="104" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="216" font-size="13" font-weight="bold" fill="#222222">Pod bookshelf-7c9d-fghij</text>
  <text x="34" y="236" font-size="11" fill="#333333">scheduler name   BookshelfCluster</text>
  <text x="34" y="252" font-size="11" fill="#333333">instanceId       bookshelf-7c9d-fghij</text>
  <text x="34" y="268" font-size="11" fill="#333333">isClustered      true</text>
  <text x="34" y="284" font-size="10.5" fill="#666666">fires whatever it acquires first</text>

  <rect x="20" y="312" width="300" height="104" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="334" font-size="13" font-weight="bold" fill="#222222">Pod bookshelf-7c9d-klmno</text>
  <text x="34" y="354" font-size="11" fill="#333333">scheduler name   BookshelfCluster</text>
  <text x="34" y="370" font-size="11" fill="#333333">instanceId       bookshelf-7c9d-klmno</text>
  <text x="34" y="386" font-size="11" fill="#333333">isClustered      true</text>
  <text x="34" y="402" font-size="10.5" fill="#666666">dies with kill -9: its rows stay behind</text>

  <!-- no node to node traffic -->
  <path d="M338,96 L338,398" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
  <text x="440" y="276" font-size="10.5" fill="#b3261e" text-anchor="middle">dashed line: no node talks</text>
  <text x="440" y="290" font-size="10.5" fill="#b3261e" text-anchor="middle">to another node</text>

  <!-- ============ arrows to the database ============ -->
  <path d="M320,128 L560,160" stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#qt-arrow)"/>
  <path d="M320,246 L560,246" stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#qt-arrow)"/>
  <path d="M320,364 L560,332" stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#qt-arrow)"/>
  <text x="440" y="196" font-size="10.5" fill="#1c4b73" text-anchor="middle">JDBC only: row locks,</text>
  <text x="440" y="210" font-size="10.5" fill="#1c4b73" text-anchor="middle">UPDATE of trigger state,</text>
  <text x="440" y="224" font-size="10.5" fill="#1c4b73" text-anchor="middle">check-in every 7500 ms</text>

  <!-- ============ the database ============ -->
  <text x="780" y="62" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">One relational database, one set of QRTZ_ tables</text>
  <rect x="560" y="76" width="420" height="340" rx="8" fill="#e8f1fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="574" y="98" font-size="13" font-weight="bold" fill="#222222">The only coordinator</text>

  <rect x="574" y="108" width="392" height="80" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="586" y="126" font-size="12" font-weight="bold" fill="#222222">QRTZ_LOCKS</text>
  <text x="586" y="144" font-size="11" fill="#333333">two rows per scheduler name: TRIGGER_ACCESS and STATE_ACCESS</text>
  <text x="586" y="160" font-size="11" fill="#333333">taken with SELECT ... FOR UPDATE, held until the transaction ends</text>
  <text x="586" y="176" font-size="10.5" fill="#666666">TRIGGER_ACCESS guards fire and store; STATE_ACCESS guards recovery</text>

  <rect x="574" y="198" width="392" height="68" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="586" y="216" font-size="12" font-weight="bold" fill="#222222">QRTZ_SCHEDULER_STATE</text>
  <text x="586" y="234" font-size="11" fill="#333333">one row per live node: instance name, last check-in, interval</text>
  <text x="586" y="250" font-size="10.5" fill="#666666">a node whose row is late is declared failed by the first survivor that looks</text>

  <rect x="574" y="276" width="392" height="68" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="586" y="294" font-size="12" font-weight="bold" fill="#222222">QRTZ_TRIGGERS and QRTZ_FIRED_TRIGGERS</text>
  <text x="586" y="312" font-size="11" fill="#333333">WAITING to ACQUIRED is the race; the fired row names the owning node</text>
  <text x="586" y="328" font-size="10.5" fill="#666666">REQUESTS_RECOVERY decides whether a dead node's job is re-run</text>

  <rect x="574" y="354" width="392" height="50" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="586" y="372" font-size="12" font-weight="bold" fill="#222222">QRTZ_JOB_DETAILS, cron, simple and the other tables</text>
  <text x="586" y="390" font-size="11" fill="#333333">every row carries SCHED_NAME = BookshelfCluster</text>

  <!-- ============ the forbidden instance ============ -->
  <rect x="560" y="440" width="420" height="62" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="574" y="462" font-size="12.5" font-weight="bold" fill="#b3261e">Never: a non-clustered scheduler on these tables</text>
  <text x="574" y="480" font-size="11" fill="#333333">its start-up recovery frees every ACQUIRED and BLOCKED trigger and deletes</text>
  <text x="574" y="494" font-size="11" fill="#333333">all QRTZ_FIRED_TRIGGERS rows, including those of the running cluster nodes</text>
  <path d="M770,440 L770,420" stroke="#b3261e" stroke-width="1.6" fill="none" marker-end="url(#qt-arrow-red)"/>

  <!-- ============ the clock ============ -->
  <rect x="20" y="440" width="300" height="62" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="34" y="462" font-size="12.5" font-weight="bold" fill="#222222">Time service on every host</text>
  <text x="34" y="480" font-size="11" fill="#333333">check-ins and fire times use each JVM clock;</text>
  <text x="34" y="494" font-size="11" fill="#333333">keep the clocks within one second of each other</text>
  <path d="M170,440 L170,420" stroke="#2e7d32" stroke-width="1.6" fill="none" marker-end="url(#qt-arrow)"/>

  <!-- ============ rules strip ============ -->
  <rect x="20" y="526" width="960" height="96" rx="8" fill="#f6f6f6" stroke="#999999"/>
  <text x="34" y="548" font-size="12.5" font-weight="bold" fill="#222222">What a node needs, and what the cluster does not give you</text>
  <text x="34" y="568" font-size="11" fill="#333333">Same scheduler name and an instance id that is unique per node (AUTO, a pod name, or a system property); identical job store properties on every node.</text>
  <text x="34" y="584" font-size="11" fill="#333333">The first node to acquire a trigger fires it: there is no load balancing, so one node may run most of the work. Only jobs with requestRecovery are re-run after a crash.</text>
  <text x="34" y="600" font-size="11" fill="#333333">Every acquire, fire and complete passes through the shared locks, so the cluster scales out long jobs well and short jobs badly (about three nodes).</text>
  <text x="34" y="616" font-size="10.5" fill="#666666">Measured on Quartz 2.5.2 and PostgreSQL 17: no scheduled time ran twice; a node killed with kill -9 had its job re-run by a survivor about ten seconds later.</text>
</svg>
