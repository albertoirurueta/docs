<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Expand &#8594; Migrate &#8594; Contract</text>

  <!-- Phase 1: Expand -->
  <rect x="20" y="52" width="220" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <rect x="20" y="52" width="220" height="8" fill="#2f5424"/>
  <text x="130" y="82" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">1. Expand</text>
  <text x="36" y="106" font-size="11.5" fill="#222222">Add the new column /</text>
  <text x="36" y="124" font-size="11.5" fill="#222222">collection field.</text>
  <text x="36" y="150" font-size="11.5" fill="#222222">Application still writes</text>
  <text x="36" y="168" font-size="11.5" fill="#222222">only the old one.</text>
  <text x="130" y="192" font-size="10.5" fill="#666666" text-anchor="middle">old shape only</text>

  <!-- arrow 1 -->
  <g stroke="#999999" stroke-width="1.6" fill="none">
    <path d="M240,127 H268"/>
  </g>
  <polygon points="268,121 268,133 280,127" fill="#999999"/>

  <!-- Phase 2: Migrate -->
  <rect x="280" y="52" width="220" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <rect x="280" y="52" width="220" height="8" fill="#1c4b73"/>
  <text x="390" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">2. Migrate</text>
  <text x="296" y="106" font-size="11.5" fill="#222222">Backfill existing rows /</text>
  <text x="296" y="124" font-size="11.5" fill="#222222">documents.</text>
  <text x="296" y="150" font-size="11.5" fill="#222222">Deploy application code</text>
  <text x="296" y="168" font-size="11.5" fill="#222222">that writes both.</text>
  <text x="390" y="192" font-size="10.5" fill="#666666" text-anchor="middle">old + new shape</text>

  <!-- arrow 2 -->
  <g stroke="#999999" stroke-width="1.6" fill="none">
    <path d="M500,127 H528"/>
  </g>
  <polygon points="528,121 528,133 540,127" fill="#999999"/>

  <!-- Phase 3: Contract -->
  <rect x="540" y="52" width="200" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <rect x="540" y="52" width="200" height="8" fill="#8a3d10"/>
  <text x="640" y="82" font-size="14" font-weight="bold" fill="#8a3d10" text-anchor="middle">3. Contract</text>
  <text x="556" y="106" font-size="11.5" fill="#222222">Stop writing the old</text>
  <text x="556" y="124" font-size="11.5" fill="#222222">shape.</text>
  <text x="556" y="150" font-size="11.5" fill="#222222">Drop it once nothing</text>
  <text x="556" y="168" font-size="11.5" fill="#222222">reads it.</text>
  <text x="640" y="192" font-size="10.5" fill="#666666" text-anchor="middle">new shape only</text>

  <!-- timeline -->
  <line x1="20" y1="230" x2="740" y2="230" stroke="#999999" stroke-width="1.2"/>
  <circle cx="20" cy="230" r="4" fill="#2f5424"/>
  <circle cx="280" cy="230" r="4" fill="#1c4b73"/>
  <circle cx="540" cy="230" r="4" fill="#8a3d10"/>
  <circle cx="740" cy="230" r="4" fill="#999999"/>
  <text x="20" y="250" font-size="10.5" fill="#666666" text-anchor="start">deploy code tolerating both shapes</text>
  <text x="740" y="250" font-size="10.5" fill="#666666" text-anchor="end">rollout complete</text>

  <!-- footer note -->
  <rect x="20" y="270" width="720" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="36" y="292" font-size="12" fill="#222222">Application code that tolerates both the old and new shape runs throughout Migrate and</text>
  <text x="36" y="310" font-size="12" fill="#222222">into Contract, so a schema change never requires stopping the application to apply it.</text>
</svg>
