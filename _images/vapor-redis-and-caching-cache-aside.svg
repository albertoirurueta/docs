<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Cache-aside in a Vapor handler</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">req.cache is one protocol; app.caches.use(...) decides whether it is memory, the database or Redis</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="80" width="170" height="80" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="105" y="106" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Route handler</text>
  <text x="105" y="128" font-size="11" fill="#222222" text-anchor="middle">GET /books/:id</text>
  <text x="105" y="144" font-size="11" fill="#222222" text-anchor="middle">key "book:v1:id"</text>

  <rect x="260" y="80" width="190" height="80" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="355" y="106" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">req.cache.get(key)</text>
  <text x="355" y="128" font-size="11" fill="#222222" text-anchor="middle">hit: decoded value or nil</text>
  <text x="355" y="144" font-size="11" fill="#222222" text-anchor="middle">miss: nil</text>

  <rect x="520" y="80" width="200" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="620" y="106" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Source of truth</text>
  <text x="620" y="128" font-size="11" fill="#222222" text-anchor="middle">Fluent query or req.client</text>
  <text x="620" y="144" font-size="11" fill="#222222" text-anchor="middle">only on a miss</text>

  <rect x="780" y="80" width="140" height="80" rx="8" fill="#fbe9e7" stroke="#bf360c" stroke-width="1.5"/>
  <text x="850" y="106" font-size="14" font-weight="bold" fill="#bf360c" text-anchor="middle">Write path</text>
  <text x="850" y="128" font-size="11" fill="#222222" text-anchor="middle">update row, then</text>
  <text x="850" y="144" font-size="11" fill="#222222" text-anchor="middle">cache.delete(key)</text>

  <line x1="190" y1="120" x2="258" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="120" x2="518" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="484" y="112" font-size="11" fill="#444444" text-anchor="middle">miss</text>
  <path d="M620 160 L620 200 L355 200 L355 162" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="488" y="194" font-size="11" fill="#444444" text-anchor="middle">cache.set(key, to: value, expiresIn: ttl)</text>

  <text x="470" y="236" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Drivers behind the same three calls</text>

  <rect x="20" y="252" width="280" height="130" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="1.5"/>
  <text x="160" y="276" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">.memory</text>
  <text x="160" y="298" font-size="11" fill="#222222" text-anchor="middle">per process, lost on restart</text>
  <text x="160" y="314" font-size="11" fill="#222222" text-anchor="middle">TTL honoured on read</text>
  <text x="160" y="330" font-size="11" fill="#222222" text-anchor="middle">set replaces the value</text>
  <text x="160" y="352" font-size="11" fill="#222222" text-anchor="middle">tests, single instance</text>

  <rect x="330" y="252" width="280" height="130" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="1.5"/>
  <text x="470" y="276" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">.fluent</text>
  <text x="470" y="298" font-size="11" fill="#222222" text-anchor="middle">table _fluent_cache (key, JSON)</text>
  <text x="470" y="314" font-size="11" fill="#222222" text-anchor="middle">expiresIn is ignored: no expiry</text>
  <text x="470" y="330" font-size="11" fill="#222222" text-anchor="middle">set on an existing key fails</text>
  <text x="470" y="352" font-size="11" fill="#222222" text-anchor="middle">shared, but needs your own cleanup</text>

  <rect x="640" y="252" width="280" height="130" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="1.5"/>
  <text x="780" y="276" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">.redis</text>
  <text x="780" y="298" font-size="11" fill="#222222" text-anchor="middle">GET / SET / SETEX / DEL, JSON values</text>
  <text x="780" y="314" font-size="11" fill="#222222" text-anchor="middle">TTL enforced by Redis</text>
  <text x="780" y="330" font-size="11" fill="#222222" text-anchor="middle">shared by every instance</text>
  <text x="780" y="352" font-size="11" fill="#222222" text-anchor="middle">production, several instances</text>
</svg>
