<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-b01-lay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Data layouts: interleaved vertex, push constants and uniform block</text>
<text x="20" y="58" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Vertex: 32 bytes, binding stride 32</text>
<rect x="20" y="70" width="240" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="92.0" text-anchor="middle" font-size="11" fill="#3730A3">position</text>
<text x="140.0" y="107.0" text-anchor="middle" font-size="11" fill="#3730A3">float3, offset 0</text>
<rect x="260" y="70" width="240" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="92.0" text-anchor="middle" font-size="11" fill="#065F46">normal</text>
<text x="380.0" y="107.0" text-anchor="middle" font-size="11" fill="#065F46">float3, offset 12</text>
<rect x="500" y="70" width="160" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="580.0" y="92.0" text-anchor="middle" font-size="11" fill="#92400E">uv</text>
<text x="580.0" y="107.0" text-anchor="middle" font-size="11" fill="#92400E">float2, offset 24</text>
<text x="20" y="138" text-anchor="start" font-size="10" fill="#374151">0</text>
<text x="260" y="138" text-anchor="middle" font-size="10" fill="#374151">12</text>
<text x="500" y="138" text-anchor="middle" font-size="10" fill="#374151">24</text>
<text x="660" y="138" text-anchor="end" font-size="10" fill="#374151">32 = next vertex</text>
<text x="20" y="176" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Push constants: 80 bytes used, 128 guaranteed by the limit</text>
<rect x="20" y="188" width="300" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="210.0" text-anchor="middle" font-size="11" fill="#3730A3">model (float4x4, column-major)</text>
<text x="170.0" y="225.0" text-anchor="middle" font-size="11" fill="#3730A3">offset 0, 64 bytes</text>
<rect x="320" y="188" width="120" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="210.0" text-anchor="middle" font-size="10" fill="#92400E">textureId</text>
<text x="380.0" y="224.0" text-anchor="middle" font-size="10" fill="#92400E">offset 64, 4 bytes</text>
<rect x="440" y="188" width="100" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="490.0" y="210.0" text-anchor="middle" font-size="11" fill="#374151">padding</text>
<text x="490.0" y="225.0" text-anchor="middle" font-size="11" fill="#374151">12 bytes</text>
<rect x="540" y="188" width="120" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="600.0" y="210.0" text-anchor="middle" font-size="11" fill="#374151">free</text>
<text x="600.0" y="225.0" text-anchor="middle" font-size="11" fill="#374151">80 to 128</text>
<text x="20" y="256" text-anchor="start" font-size="10" fill="#374151">0</text>
<text x="320" y="256" text-anchor="middle" font-size="10" fill="#374151">64</text>
<text x="440" y="256" text-anchor="middle" font-size="10" fill="#374151">68</text>
<text x="540" y="256" text-anchor="middle" font-size="10" fill="#374151">80</text>
<text x="660" y="256" text-anchor="end" font-size="10" fill="#374151">128 limit</text>
<text x="20" y="292" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Frame UBO (set 0, binding 0): std140, 16-byte aligned members</text>
<rect x="20" y="304" width="180" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="110.0" y="326.0" text-anchor="middle" font-size="11" fill="#3730A3">viewProj</text>
<text x="110.0" y="341.0" text-anchor="middle" font-size="11" fill="#3730A3">float4x4, 64 bytes</text>
<rect x="200" y="304" width="130" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="265.0" y="326.0" text-anchor="middle" font-size="11" fill="#92400E">lampPos</text>
<text x="265.0" y="341.0" text-anchor="middle" font-size="11" fill="#92400E">float3 + pad</text>
<rect x="330" y="304" width="130" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="395.0" y="326.0" text-anchor="middle" font-size="11" fill="#92400E">lampColor</text>
<text x="395.0" y="341.0" text-anchor="middle" font-size="11" fill="#92400E">float3 + power</text>
<rect x="460" y="304" width="100" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="510.0" y="326.0" text-anchor="middle" font-size="10" fill="#92400E">cameraPos</text>
<text x="510.0" y="340.0" text-anchor="middle" font-size="10" fill="#92400E">float3 + pad</text>
<rect x="560" y="304" width="100" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="610.0" y="326.0" text-anchor="middle" font-size="10" fill="#92400E">ambient</text>
<text x="610.0" y="340.0" text-anchor="middle" font-size="10" fill="#92400E">float3 + shine</text>
<text x="20" y="374" text-anchor="start" font-size="11" fill="#374151">Each block of the UBO starts at a multiple of 16 bytes, so a float3 is followed by a float that uses the padding</text>
</svg>
