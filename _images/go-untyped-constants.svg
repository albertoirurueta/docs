<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="380" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Untyped constants: exact at compile time, typed at the point of use</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the compiler evaluates constant expressions with arbitrary precision; a type is applied only when the value meets a context</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="30" y="110" width="190" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="125" y="136" font-weight="bold">const Huge = 1 &lt;&lt; 100</text>
    <text x="125" y="156">untyped integer constant</text>
    <text x="125" y="172" font-size="11" fill="#555555">exact: 2^100, a 31-digit number</text>
    <rect x="290" y="110" width="190" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="385" y="136" font-weight="bold">Huge &gt;&gt; 99</text>
    <text x="385" y="156">still untyped, still exact</text>
    <text x="385" y="172" font-size="11" fill="#555555">value 2</text>
    <rect x="550" y="110" width="170" height="70" fill="#fff6e0" stroke="#b07800" stroke-width="1.5"/>
    <text x="635" y="136" font-weight="bold">context supplies a type</text>
    <text x="635" y="156">assignment, argument,</text>
    <text x="635" y="172">conversion, operand</text>
  </g>
  <line x1="220" y1="145" x2="286" y2="145" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="145" x2="546" y2="145" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="253" y="138" font-size="11" fill="#444444" text-anchor="middle">expr</text>
  <line x1="635" y1="180" x2="180" y2="262" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="635" y1="180" x2="470" y2="262" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="635" y1="180" x2="760" y2="262" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="40" y="264" width="280" height="80" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="180" y="290" font-weight="bold">var n int = Huge &gt;&gt; 99</text>
    <text x="180" y="310">value 2 is representable in int</text>
    <text x="180" y="328" font-size="11" fill="#555555">compiles; n == 2</text>
    <rect x="340" y="264" width="260" height="80" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="470" y="290" font-weight="bold">var n int = Huge</text>
    <text x="470" y="310">not representable in int</text>
    <text x="470" y="328" font-size="11" fill="#555555">compile error: (overflows)</text>
    <rect x="620" y="264" width="280" height="80" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="760" y="290" font-weight="bold">x := Huge &gt;&gt; 99</text>
    <text x="760" y="310">no other type: default type int</text>
    <text x="760" y="328" font-size="11" fill="#555555">1.5 gives float64, 'a' rune, 2i complex128</text>
  </g>
</svg>
