<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Who administers what (checked 2026-10-30)</text>
  <rect x="200" y="48" width="360" height="74" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <circle cx="222" cy="68" r="11" fill="#B45309"/><text x="222" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="380" y="72" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Organization admin</text>
  <text x="380" y="92" font-size="12" fill="#374151" text-anchor="middle">Domains, SAML SSO, SCIM, seats, AI settings,</text>
  <text x="380" y="108" font-size="12" fill="#374151" text-anchor="middle">activity logs, sharing controls (Organization and Enterprise)</text>
  <line x1="380" y1="122" x2="380" y2="150" stroke="#4B5563" stroke-width="2"/>
  <line x1="130" y1="150" x2="630" y2="150" stroke="#4B5563" stroke-width="2"/>
  <line x1="130" y1="150" x2="130" y2="172" stroke="#4B5563" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="172" stroke="#4B5563" stroke-width="2"/>
  <line x1="630" y1="150" x2="630" y2="172" stroke="#4B5563" stroke-width="2"/>
  <rect x="25" y="172" width="210" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="45" cy="190" r="11" fill="#4F46E5"/><text x="45" y="194" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="140" y="196" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Workspace admin</text>
  <text x="130" y="220" font-size="12" fill="#374151" text-anchor="middle">Limited actions inside the</text>
  <text x="130" y="236" font-size="12" fill="#374151" text-anchor="middle">workspaces they manage</text>
  <text x="130" y="256" font-size="11" fill="#4B5563" text-anchor="middle">Enterprise only</text>
  <rect x="275" y="172" width="210" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="295" cy="190" r="11" fill="#4F46E5"/><text x="295" y="194" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="390" y="196" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Team admin</text>
  <text x="380" y="220" font-size="12" fill="#374151" text-anchor="middle">Members, permissions and</text>
  <text x="380" y="236" font-size="12" fill="#374151" text-anchor="middle">default libraries of one team</text>
  <text x="380" y="256" font-size="11" fill="#4B5563" text-anchor="middle">Organization and Enterprise</text>
  <rect x="525" y="172" width="210" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="545" cy="190" r="11" fill="#4F46E5"/><text x="545" y="194" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="640" y="196" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Billing group admin</text>
  <text x="630" y="220" font-size="12" fill="#374151" text-anchor="middle">Assigns people to a budget</text>
  <text x="630" y="236" font-size="12" fill="#374151" text-anchor="middle">group, handles upgrade requests</text>
  <text x="630" y="256" font-size="11" fill="#4B5563" text-anchor="middle">Enterprise only</text>
  <rect x="25" y="290" width="710" height="64" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="380" y="314" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Starter and Professional have plan admins instead: all share one level of access</text>
  <text x="380" y="334" font-size="12" fill="#374151" text-anchor="middle">Guests cannot be organization admins; only members with a verified-domain email can.</text>
</svg>
