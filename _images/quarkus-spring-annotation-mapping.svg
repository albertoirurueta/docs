<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Spring annotations to Quarkus/Jakarta/MicroProfile counterparts</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">translated at build time by the compatibility extensions -- not a real Spring ApplicationContext underneath</text>

  <!-- column headers -->
  <text x="190" y="72" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">Spring annotation</text>
  <text x="590" y="72" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Quarkus / Jakarta / MicroProfile</text>

  <!-- rows -->
  <!-- row template: left box, right box, arrow -->
  <g font-size="11" fill="#333333">
    <!-- row 1 -->
    <rect x="30" y="84" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="102" text-anchor="middle">@Autowired</text>
    <rect x="430" y="84" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="102" text-anchor="middle">@Inject (jakarta.inject, ArC/CDI)</text>
    <line x1="350" y1="98" x2="430" y2="98" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 2 -->
    <rect x="30" y="122" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="140" text-anchor="middle">@Component / @Service</text>
    <rect x="430" y="122" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="140" text-anchor="middle">@ApplicationScoped (CDI scope)</text>
    <line x1="350" y1="136" x2="430" y2="136" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 3 -->
    <rect x="30" y="160" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="178" text-anchor="middle">@RestController + @GetMapping</text>
    <rect x="430" y="160" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="178" text-anchor="middle">@Path + @GET (Quarkus REST)</text>
    <line x1="350" y1="174" x2="430" y2="174" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 4 -->
    <rect x="30" y="198" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="216" text-anchor="middle">org.springframework..@Transactional</text>
    <rect x="430" y="198" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="216" text-anchor="middle">jakarta.transaction.Transactional</text>
    <line x1="350" y1="212" x2="430" y2="212" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 5 -->
    <rect x="30" y="236" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="254" text-anchor="middle">@Scheduled(cron/fixedRate)</text>
    <rect x="430" y="236" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="254" text-anchor="middle">io.quarkus.scheduler.Scheduled</text>
    <line x1="350" y1="250" x2="430" y2="250" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 6 -->
    <rect x="30" y="274" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="292" text-anchor="middle">@Cacheable / @CacheEvict</text>
    <rect x="430" y="274" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="292" text-anchor="middle">io.quarkus.cache.CacheResult/Invalidate</text>
    <line x1="350" y1="288" x2="430" y2="288" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 7 -->
    <rect x="30" y="312" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="330" text-anchor="middle">@Value("${...}")</text>
    <rect x="430" y="312" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="330" text-anchor="middle">@ConfigProperty / @ConfigMapping</text>
    <line x1="350" y1="326" x2="430" y2="326" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>

    <!-- row 8 -->
    <rect x="30" y="350" width="320" height="28" fill="#fbecec" stroke="#a33" stroke-width="1"/>
    <text x="190" y="368" text-anchor="middle">@PreAuthorize("hasRole('ADMIN')")</text>
    <rect x="430" y="350" width="320" height="28" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
    <text x="590" y="368" text-anchor="middle">@RolesAllowed("ADMIN") (Jakarta Security)</text>
    <line x1="350" y1="364" x2="430" y2="364" stroke="#666666" stroke-width="1.2" marker-end="url(#arrowM)"/>
  </g>

  <text x="390" y="404" font-size="10.5" fill="#666666" text-anchor="middle">A SpEL expression referencing method arguments/beans, or any idiom not listed here, has no general Quarkus-native mapping</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
