<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A three-stage build: only the artifact moves forward</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">A three-stage build: only the artifact moves forward</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">deps -&gt; build -&gt; runtime; the runtime image contains the JRE and the application, nothing else</text>
  <rect x="20" y="70" width="210" height="250" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="125.0" y="88.0" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Stage "deps"</text>
  <rect x="35" y="115" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="125.0" y="134.8" font-size="9.5" fill="#333333" text-anchor="middle">FROM eclipse-temurin:25-jdk</text>
  <rect x="35" y="157" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="125.0" y="176.8" font-size="9.5" fill="#333333" text-anchor="middle">COPY mvnw pom.xml .mvn/</text>
  <rect x="35" y="199" width="180" height="48" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="125.0" y="219.0" font-size="9.5" fill="#333333" text-anchor="middle">RUN --mount=type=cache</text>
  <text x="125.0" y="232.5" font-size="9.5" fill="#333333" text-anchor="middle">mvnw dependency:go-offline</text>
  <rect x="35" y="255" width="180" height="48" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="125.0" y="275.0" font-size="9.5" fill="#333333" text-anchor="middle">cache mount /root/.m2</text>
  <text x="125.0" y="288.5" font-size="9.5" fill="#333333" text-anchor="middle">(outside every layer)</text>
  <rect x="275" y="70" width="210" height="250" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="88.0" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">Stage "build"  (FROM deps)</text>
  <rect x="290" y="115" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="134.8" font-size="9.5" fill="#333333" text-anchor="middle">COPY src/ src/</text>
  <rect x="290" y="157" width="180" height="48" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="177.0" font-size="9.5" fill="#333333" text-anchor="middle">RUN mvnw package</text>
  <text x="380.0" y="190.5" font-size="9.5" fill="#333333" text-anchor="middle">(JDK + sources + target/)</text>
  <rect x="290" y="213" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="232.8" font-size="9.5" fill="#333333" text-anchor="middle">/tmp/app.jar</text>
  <rect x="290" y="255" width="180" height="48" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="380.0" y="275.0" font-size="9.5" fill="#333333" text-anchor="middle">discarded after the build</text>
  <text x="380.0" y="288.5" font-size="9.5" fill="#333333" text-anchor="middle">(never shipped)</text>
  <rect x="530" y="70" width="210" height="250" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="635.0" y="88.0" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Stage "runtime"  (final)</text>
  <rect x="545" y="115" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="635.0" y="134.8" font-size="9.5" fill="#333333" text-anchor="middle">FROM eclipse-temurin:25-jre</text>
  <rect x="545" y="157" width="180" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="635.0" y="176.8" font-size="9.5" fill="#333333" text-anchor="middle">USER 10001</text>
  <rect x="545" y="199" width="180" height="48" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="635.0" y="219.0" font-size="9.5" fill="#333333" text-anchor="middle">COPY --from=build</text>
  <text x="635.0" y="232.5" font-size="9.5" fill="#333333" text-anchor="middle">/tmp/app.jar /app/app.jar</text>
  <rect x="545" y="255" width="180" height="48" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="635.0" y="281.8" font-size="9.5" fill="#333333" text-anchor="middle">ENTRYPOINT ["java", ...]</text>
  <line x1="230" y1="180" x2="275" y2="180" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="252.5" y="175.0" font-size="9.5" fill="#555555" text-anchor="middle">FROM deps</text>
  <line x1="470" y1="230" x2="545" y2="222" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="507" y="250" font-size="9.5" fill="#555555" text-anchor="middle">COPY --from</text>
  <text x="380" y="350" font-size="10" fill="#555555" text-anchor="middle">docker build --target build .  stops early (dev/test image);  docker build .  produces only the runtime stage</text>
  <text x="380" y="370" font-size="10" fill="#555555" text-anchor="middle">a test stage (FROM deps AS test, RUN mvnw test) can gate the build without adding anything to the runtime image</text>
</svg>
