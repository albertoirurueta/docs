<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 522" width="860" height="522" role="img" aria-labelledby="npm-downloads-t npm-downloads-d">
<title id="npm-downloads-t">npm downloads per year</title>
<desc id="npm-downloads-d">Yearly npm downloads of @shopify/cli and @shopify/hydrogen and of the @woocommerce/components, @woocommerce/data and @woocommerce/settings packages, 2020 to 2026 year to date (up to 2026-10-26). Shopify CLI grew from about 0.3 million downloads in 2022 to 15.7 million in 2026 to date. Counts include CI and mirror traffic. PrestaShop and Magento ship through Composer, so they have no npm series.</desc>
