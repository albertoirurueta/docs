<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>C compilation pipeline: hello.c is preprocessed into a translation unit, compiled to assembly, assembled into hello.o, then linked with the C library into the hello executable, which the loader runs.</title>
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From source code to a running program</text>
  <text x="390" y="45" font-size="11" fill="#666666" text-anchor="middle">One command runs four separate tools; each stage can be stopped at and inspected.</text>

  <!-- headers / macros input -->
  <rect x="150" y="62" width="150" height="40" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="4"/>
  <text x="225" y="79" font-size="10" font-weight="bold" fill="#5c4a14" text-anchor="middle" font-family="'Courier New', monospace">#include &lt;stdio.h&gt;</text>
  <text x="225" y="93" font-size="9" fill="#666666" text-anchor="middle">headers, macros, #if</text>
  <line x1="225" y1="102" x2="225" y2="122" stroke="#a08a4a" stroke-width="1.3"/>
  <polygon points="220,122 230,122 225,131" fill="#a08a4a"/>

  <!-- hello.c -->
  <rect x="20" y="130" width="110" height="52" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="4"/>
  <text x="75" y="152" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">hello.c</text>
  <text x="75" y="168" font-size="9" fill="#666666" text-anchor="middle">source file</text>
  <text x="75" y="200" font-size="9" fill="#888888" text-anchor="middle">what you write</text>

  <line x1="132" y1="156" x2="164" y2="156" stroke="#444444" stroke-width="1.4"/>
  <polygon points="164,151 164,161 173,156" fill="#444444"/>
  <text x="150" y="148" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">-E</text>

  <!-- hello.i -->
  <rect x="175" y="130" width="110" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.3" rx="4"/>
  <text x="230" y="152" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">hello.i</text>
  <text x="230" y="168" font-size="9" fill="#666666" text-anchor="middle">preprocessed</text>
  <text x="230" y="200" font-size="9" fill="#888888" text-anchor="middle">one translation unit</text>

  <line x1="287" y1="156" x2="319" y2="156" stroke="#444444" stroke-width="1.4"/>
  <polygon points="319,151 319,161 328,156" fill="#444444"/>
  <text x="305" y="148" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">-S</text>

  <!-- hello.s -->
  <rect x="330" y="130" width="110" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.3" rx="4"/>
  <text x="385" y="152" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">hello.s</text>
  <text x="385" y="168" font-size="9" fill="#666666" text-anchor="middle">assembly</text>
  <text x="385" y="200" font-size="9" fill="#888888" text-anchor="middle">target-specific</text>

  <line x1="442" y1="156" x2="474" y2="156" stroke="#444444" stroke-width="1.4"/>
  <polygon points="474,151 474,161 483,156" fill="#444444"/>
  <text x="460" y="148" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">-c</text>

  <!-- hello.o -->
  <rect x="485" y="130" width="110" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="4"/>
  <text x="540" y="152" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">hello.o</text>
  <text x="540" y="168" font-size="9" fill="#666666" text-anchor="middle">object code</text>
  <text x="540" y="200" font-size="9" fill="#888888" text-anchor="middle">unresolved symbols</text>

  <line x1="597" y1="156" x2="629" y2="156" stroke="#444444" stroke-width="1.4"/>
  <polygon points="629,151 629,161 638,156" fill="#444444"/>
  <text x="615" y="148" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">ld</text>

  <!-- hello executable -->
  <rect x="640" y="130" width="118" height="52" fill="#f3ecf3" stroke="#7a4a8a" stroke-width="1.4" rx="4"/>
  <text x="699" y="152" font-size="12" font-weight="bold" fill="#4a2352" text-anchor="middle" font-family="'Courier New', monospace">hello</text>
  <text x="699" y="168" font-size="9" fill="#666666" text-anchor="middle">executable</text>
  <text x="699" y="200" font-size="9" fill="#888888" text-anchor="middle">./hello runs it</text>

  <!-- libc input to the linker -->
  <rect x="520" y="246" width="180" height="44" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" rx="4"/>
  <text x="610" y="264" font-size="10" font-weight="bold" fill="#6a1f1f" text-anchor="middle" font-family="'Courier New', monospace">libc, crt1.o, -lm ...</text>
  <text x="610" y="279" font-size="9" fill="#666666" text-anchor="middle">where undefined symbols get resolved</text>
  <line x1="610" y1="246" x2="610" y2="176" stroke="#a04a4a" stroke-width="1.3"/>
  <polygon points="605,176 615,176 610,167" fill="#a04a4a"/>

  <!-- stage band labels -->
  <text x="150" y="228" font-size="9" font-style="italic" fill="#5a8a4a" text-anchor="middle">preprocessor</text>
  <text x="305" y="228" font-size="9" font-style="italic" fill="#5a8a4a" text-anchor="middle">compiler</text>
  <text x="460" y="228" font-size="9" font-style="italic" fill="#5a8a4a" text-anchor="middle">assembler</text>
  <text x="615" y="228" font-size="9" font-style="italic" fill="#5a8a4a" text-anchor="middle">linker</text>

  <text x="240" y="322" font-size="10" fill="#444444" text-anchor="middle">Compile-time errors come from stages 1-3; "undefined reference" comes from stage 4.</text>
  <text x="240" y="338" font-size="10" fill="#444444" text-anchor="middle">At run time the loader maps the executable and the C runtime calls main().</text>
</svg>
