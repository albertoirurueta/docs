<svg viewBox="0 0 780 520" width="780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>

  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">App Configuration feeding Container Apps, App Service, and AKS</text>

  <!-- App Configuration store -->
  <rect x="270" y="46" width="240" height="80" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#173d73">appcs-bookshelf</text>
  <text x="390" y="88" text-anchor="middle" font-size="10.5" fill="#3c4043">Key-values · labels · feature flags</text>
  <text x="390" y="102" text-anchor="middle" font-size="10.5" fill="#3c4043">Key Vault references · snapshots</text>
  <text x="390" y="116" text-anchor="middle" font-size="10.5" fill="#3c4043">kv-bookshelf (secret values)</text>

  <!-- Connector down to a horizontal bus -->
  <line x1="390" y1="126" x2="390" y2="150" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="660" y2="150" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="120" y2="168" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="150" x2="390" y2="168" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="150" x2="660" y2="168" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Column 1: Container Apps -->
  <rect x="20" y="170" width="200" height="150" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.3"/>
  <text x="120" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d4c22">Container Apps</text>
  <text x="120" y="210" text-anchor="middle" font-size="10" fill="#3c4043">catalog-api / orders-api</text>
  <rect x="34" y="220" width="172" height="34" rx="5" fill="#f1f8f0" stroke="#188038" stroke-width="1"/>
  <text x="120" y="234" text-anchor="middle" font-size="9.5" fill="#0d4c22">env: sourced from App</text>
  <text x="120" y="246" text-anchor="middle" font-size="9.5" fill="#0d4c22">Configuration key-values</text>
  <rect x="34" y="260" width="172" height="34" rx="5" fill="#f1f8f0" stroke="#188038" stroke-width="1"/>
  <text x="120" y="274" text-anchor="middle" font-size="9.5" fill="#0d4c22">secretref: -&gt; Container</text>
  <text x="120" y="286" text-anchor="middle" font-size="9.5" fill="#0d4c22">Apps secret (from Key Vault)</text>
  <text x="120" y="308" text-anchor="middle" font-size="9" fill="#7a1a17">New revision on env-var change</text>

  <!-- Column 2: App Service -->
  <rect x="290" y="170" width="200" height="150" rx="8" fill="#ffffff" stroke="#8430ce" stroke-width="1.3"/>
  <text x="390" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a1a7a">App Service</text>
  <text x="390" y="210" text-anchor="middle" font-size="10" fill="#3c4043">bookshelf-admin-web</text>
  <rect x="304" y="220" width="172" height="34" rx="5" fill="#f6f0fc" stroke="#8430ce" stroke-width="1"/>
  <text x="390" y="234" text-anchor="middle" font-size="9.5" fill="#4a1a7a">App settings sourced from</text>
  <text x="390" y="246" text-anchor="middle" font-size="9.5" fill="#4a1a7a">App Configuration + Key Vault refs</text>
  <rect x="304" y="260" width="172" height="34" rx="5" fill="#f6f0fc" stroke="#8430ce" stroke-width="1"/>
  <text x="390" y="274" text-anchor="middle" font-size="9.5" fill="#4a1a7a">Slot settings: sticky to a</text>
  <text x="390" y="286" text-anchor="middle" font-size="9.5" fill="#4a1a7a">slot, excluded from swap</text>
  <text x="390" y="308" text-anchor="middle" font-size="9" fill="#7a1a17">Restart to pick up changes</text>

  <!-- Column 3: AKS -->
  <rect x="560" y="170" width="200" height="150" rx="8" fill="#ffffff" stroke="#c5221f" stroke-width="1.3"/>
  <text x="660" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1a17">AKS: aks-bookshelf</text>
  <text x="660" y="210" text-anchor="middle" font-size="10" fill="#3c4043">bookshelf namespace</text>
  <rect x="574" y="220" width="172" height="34" rx="5" fill="#fdeeee" stroke="#c5221f" stroke-width="1"/>
  <text x="660" y="234" text-anchor="middle" font-size="9.5" fill="#7a1a17">AzureAppConfigurationProvider</text>
  <text x="660" y="246" text-anchor="middle" font-size="9.5" fill="#7a1a17">CRD (Kubernetes provider)</text>
  <rect x="574" y="260" width="172" height="34" rx="5" fill="#fdeeee" stroke="#c5221f" stroke-width="1"/>
  <text x="660" y="274" text-anchor="middle" font-size="9.5" fill="#7a1a17">generates ConfigMap +</text>
  <text x="660" y="286" text-anchor="middle" font-size="9.5" fill="#7a1a17">Secret, watches for refresh</text>
  <text x="660" y="308" text-anchor="middle" font-size="9" fill="#7a1a17">Rollout/reload on ConfigMap change</text>

  <!-- Sentinel key refresh note -->
  <rect x="20" y="344" width="740" height="70" rx="8" fill="#fff6e5" stroke="#b06000" stroke-width="1.3"/>
  <text x="390" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a4a00">Dynamic refresh, all three targets</text>
  <text x="390" y="384" text-anchor="middle" font-size="10" fill="#7a4a00">Sentinel key changes -&gt; provider/starter detects it on its poll interval (or an Event Grid push) -&gt;</text>
  <text x="390" y="399" text-anchor="middle" font-size="10" fill="#7a4a00">Spring @RefreshScope / ASP.NET IOptionsSnapshot / Kubernetes provider reconcile -- no redeploy needed</text>

  <!-- Legend -->
  <rect x="20" y="430" width="14" height="14" fill="#f1f8f0" stroke="#188038" stroke-width="1"/>
  <text x="40" y="442" font-size="10.5" fill="#3c4043">Container Apps: env vars / secretref</text>
  <rect x="290" y="430" width="14" height="14" fill="#f6f0fc" stroke="#8430ce" stroke-width="1"/>
  <text x="310" y="442" font-size="10.5" fill="#3c4043">App Service: app + slot settings</text>
  <rect x="560" y="430" width="14" height="14" fill="#fdeeee" stroke="#c5221f" stroke-width="1"/>
  <text x="580" y="442" font-size="10.5" fill="#3c4043">AKS: ConfigMap / Secret via CRD</text>

  <text x="390" y="480" text-anchor="middle" font-size="10" fill="#5f6368">Secret-shaped values never live in App Configuration directly -- they are Key Vault references,</text>
  <text x="390" y="496" text-anchor="middle" font-size="10" fill="#5f6368">resolved by each consumer using the same managed-identity pattern as kv-bookshelf elsewhere in Bookshelf.</text>
</svg>
