<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Config source precedence, highest ordinal wins</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">MicroProfile Config merges every source into one flat namespace by ordinal -- a higher rung overrides a lower one for the same key</text>

  <!-- rung: System properties (400) -->
  <rect x="130" y="75" width="500" height="70" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="380" y="101" font-size="13.5" font-weight="bold" fill="#a33" text-anchor="middle">System properties (-Dkey=value)</text>
  <text x="380" y="118" font-size="10.5" fill="#333333" text-anchor="middle">set on the java command line -- always wins over everything below</text>
  <text x="660" y="115" font-size="20" font-weight="bold" fill="#a33" text-anchor="middle">400</text>

  <line x1="380" y1="145" x2="380" y2="163" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- rung: Environment variables (300) -->
  <rect x="130" y="163" width="500" height="70" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="380" y="189" font-size="13.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Environment variables</text>
  <text x="380" y="206" font-size="10.5" fill="#333333" text-anchor="middle">e.g. QUARKUS_DATASOURCE_JDBC_URL -- uppercase, dots/dashes to underscores</text>
  <text x="660" y="203" font-size="20" font-weight="bold" fill="#8a5a1c" text-anchor="middle">300</text>

  <line x1="380" y1="233" x2="380" y2="251" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- rung: .env (dev mode only) -->
  <rect x="130" y="251" width="500" height="60" rx="6" fill="#f3eef8" stroke="#6a3d9a" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="380" y="274" font-size="13.5" font-weight="bold" fill="#6a3d9a" text-anchor="middle">.env file (dev mode only)</text>
  <text x="380" y="291" font-size="10.5" fill="#333333" text-anchor="middle">project-root .env -- read like environment variables, never packaged or used in prod</text>
  <text x="656" y="284" font-size="11.5" font-weight="bold" fill="#6a3d9a" text-anchor="middle">(dev only)</text>

  <line x1="380" y1="311" x2="380" y2="329" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- rung: application.properties/yaml (250) -->
  <rect x="130" y="329" width="500" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="355" font-size="13.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">application.properties / application.yaml</text>
  <text x="380" y="372" font-size="10.5" fill="#333333" text-anchor="middle">packaged on the classpath -- the file most projects edit day to day</text>
  <text x="660" y="369" font-size="20" font-weight="bold" fill="#2d6a34" text-anchor="middle">250</text>

  <line x1="380" y1="399" x2="380" y2="417" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- rung: microprofile-config.properties (100) -->
  <rect x="130" y="417" width="500" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="443" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">META-INF/microprofile-config.properties</text>
  <text x="380" y="460" font-size="10.5" fill="#333333" text-anchor="middle">the plain MicroProfile Config file, portable to any MicroProfile runtime</text>
  <text x="660" y="457" font-size="20" font-weight="bold" fill="#1c4b73" text-anchor="middle">100</text>

  <!-- caption / custom ConfigSource note -->
  <rect x="60" y="500" width="640" height="42" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="517" font-size="10.5" fill="#666666" text-anchor="middle">A custom ConfigSource declares its own ordinal via getOrdinal() and slots into this same ladder --</text>
  <text x="380" y="531" font-size="10.5" fill="#666666" text-anchor="middle">above 250 to override application.properties, or below 100 to act only as a last-resort fallback.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
