<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The choice of k changes the predicted class</title>
<desc id="d">A query point surrounded by blue and rose training points. The three nearest neighbours are two rose and one blue, so k=3 predicts rose. The seven nearest are five blue and two rose, so k=7 predicts blue.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">k-nearest neighbours: the vote depends on k</text>
<circle cx="300" cy="215" r="146" fill="none" stroke="#6D28D9" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="300" cy="215" r="74" fill="#EDE9FE" fill-opacity="0.6" stroke="#6D28D9" stroke-width="2"/>
<g stroke="#1D4ED8" stroke-width="2" fill="#DBEAFE">
<circle cx="338" cy="262" r="9"/>
<circle cx="205" cy="150" r="9"/><circle cx="395" cy="170" r="9"/><circle cx="240" cy="305" r="9"/><circle cx="410" cy="255" r="9"/>
<circle cx="100" cy="330" r="9"/><circle cx="470" cy="330" r="9"/><circle cx="130" cy="95" r="9"/>
</g>
<g stroke="#BE123C" stroke-width="2" fill="#FFE4E6">
<circle cx="265" cy="180" r="9"/><circle cx="268" cy="250" r="9"/>
<circle cx="430" cy="110" r="9"/><circle cx="470" cy="215" r="9"/><circle cx="85" cy="215" r="9"/><circle cx="360" cy="360" r="9"/>
</g>
<path d="M300,203 L300,227 M288,215 L312,215" stroke="#B45309" stroke-width="4"/>
<circle cx="300" cy="215" r="14" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="318" y="208" font-size="14" font-weight="bold" fill="#B45309">query</text>
<text x="300" y="62" font-size="12" text-anchor="middle" fill="#6D28D9">k=7 boundary</text>
<text x="300" y="130" font-size="12" text-anchor="middle" fill="#6D28D9">k=3</text>
<rect x="500" y="64" width="196" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="514" y="90" font-size="16" font-weight="bold" fill="#0F172A">k = 3</text>
<text x="514" y="112" font-size="14" fill="#475569">2 rose, 1 blue</text>
<text x="514" y="134" font-size="14" font-weight="bold" fill="#BE123C">prediction: rose</text>
<text x="514" y="160" font-size="12" fill="#475569">solid purple circle</text>
<text x="514" y="180" font-size="12" fill="#475569">holds the 3 nearest</text>
<rect x="500" y="212" width="196" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="514" y="238" font-size="16" font-weight="bold" fill="#0F172A">k = 7</text>
<text x="514" y="260" font-size="14" fill="#475569">5 blue, 2 rose</text>
<text x="514" y="282" font-size="14" font-weight="bold" fill="#1D4ED8">prediction: blue</text>
<text x="514" y="308" font-size="12" fill="#475569">dashed purple circle</text>
<text x="514" y="328" font-size="12" fill="#475569">holds the 7 nearest</text>
</svg>
