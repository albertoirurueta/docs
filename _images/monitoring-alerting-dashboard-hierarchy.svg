<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Dashboard hierarchy for the Bookshelf service: an overview dashboard for managers and on-call, a service health dashboard with RED and USE rows for operators, and detail dashboards for logs, traces and instances for developers, joined by drill-down links, with alerts linking into the service dashboard</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">From overview to detail: one dashboard per audience</text>
<text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">each level answers one question and links to the next</text>
<rect x="250" y="64" width="300" height="86" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="400" y="88" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Level 1: Overview</text>
<text x="400" y="106" font-size="10.5" fill="#0d3c75" text-anchor="middle">Is everything healthy? One stat or status per service</text>
<text x="400" y="122" font-size="10.5" fill="#0d3c75" text-anchor="middle">SLO status, error budget left, open alerts</text>
<text x="400" y="138" font-size="10" fill="#37474f" text-anchor="middle">audience: managers, on-call, wall display</text>
<rect x="150" y="200" width="500" height="120" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="400" y="224" font-size="13" font-weight="bold" fill="#2e1a63" text-anchor="middle">Level 2: Service health (Bookshelf service health)</text>
<text x="400" y="242" font-size="10.5" fill="#2e1a63" text-anchor="middle">What is wrong, and where? Same rows for every service</text>
<rect x="170" y="254" width="140" height="34" rx="5" fill="#ffffff" stroke="#5e35b1"/>
<text x="240" y="275" font-size="10.5" fill="#2e1a63" text-anchor="middle">RED: rate, errors, duration</text>
<rect x="330" y="254" width="140" height="34" rx="5" fill="#ffffff" stroke="#5e35b1"/>
<text x="400" y="275" font-size="10.5" fill="#2e1a63" text-anchor="middle">USE: JVM, DB pool, CPU</text>
<rect x="490" y="254" width="140" height="34" rx="5" fill="#ffffff" stroke="#5e35b1"/>
<text x="560" y="275" font-size="10.5" fill="#2e1a63" text-anchor="middle">Dependencies, deploys</text>
<text x="400" y="308" font-size="10" fill="#37474f" text-anchor="middle">audience: operators, service owners</text>
<rect x="30" y="380" width="220" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="140" y="404" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Level 3: Logs</text>
<text x="140" y="422" font-size="10.5" fill="#1b5e20" text-anchor="middle">Which requests failed?</text>
<text x="140" y="452" font-size="10" fill="#37474f" text-anchor="middle">audience: developers</text>
<rect x="290" y="380" width="220" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="400" y="404" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Level 3: Traces</text>
<text x="400" y="422" font-size="10.5" fill="#1b5e20" text-anchor="middle">Where did the time go?</text>
<text x="400" y="452" font-size="10" fill="#37474f" text-anchor="middle">audience: developers</text>
<rect x="550" y="380" width="220" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="660" y="404" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Level 3: Instance or database</text>
<text x="660" y="422" font-size="10.5" fill="#1b5e20" text-anchor="middle">Which node or query?</text>
<text x="660" y="452" font-size="10" fill="#37474f" text-anchor="middle">audience: operators, DBAs</text>
<line x1="400" y1="150" x2="400" y2="198" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="412" y="178" font-size="10" fill="#37474f">drill down (dashboard link, variables kept)</text>
<line x1="300" y1="320" x2="160" y2="378" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="400" y1="320" x2="400" y2="378" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="500" y1="320" x2="640" y2="378" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="640" y="84" width="140" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="710" y="105" font-size="11.5" font-weight="bold" fill="#8a4500" text-anchor="middle">Alert</text>
<text x="710" y="121" font-size="10" fill="#8a4500" text-anchor="middle">dashboard and panel links</text>
<path d="M710,134 L710,160 L652,230" fill="none" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="716" y="190" font-size="10" fill="#8a4500">lands on level 2</text>
</svg>
