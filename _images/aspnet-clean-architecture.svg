<svg viewBox="0 0 620 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="520" fill="#ffffff"/>

  <text x="310" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Clean Architecture &#8212; dependencies point inward</text>

  <!-- rings -->
  <circle cx="310" cy="270" r="210" fill="#f0f4f8" stroke="#9db8d0" stroke-width="1.5"/>
  <circle cx="310" cy="270" r="160" fill="#e2edd9" stroke="#7aa15f" stroke-width="1.5"/>
  <circle cx="310" cy="270" r="105" fill="#dbe8f6" stroke="#2f6fa8" stroke-width="1.5"/>
  <circle cx="310" cy="270" r="55" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>

  <text x="310" y="266" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">Domain</text>
  <text x="310" y="283" font-size="9.5" fill="#8a3d10" text-anchor="middle">entities, invariants</text>

  <text x="310" y="185" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Application</text>
  <text x="310" y="201" font-size="9.5" fill="#1c4b73" text-anchor="middle">use cases, ports (interfaces), DTOs</text>

  <text x="310" y="135" font-size="12.5" font-weight="bold" fill="#3d6b28" text-anchor="middle">Infrastructure &amp; Presentation</text>
  <text x="310" y="151" font-size="9.5" fill="#3d6b28" text-anchor="middle">EF Core, HTTP clients, controllers/endpoints</text>

  <text x="310" y="82" font-size="12" font-weight="bold" fill="#5a5a5a" text-anchor="middle">Frameworks &amp; drivers</text>
  <text x="310" y="98" font-size="9.5" fill="#5a5a5a" text-anchor="middle">ASP.NET Core host, database, message broker</text>

  <!-- inward arrow -->
  <defs>
    <marker id="ca-in" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c25a1d"/>
    </marker>
  </defs>
  <line x1="565" y1="420" x2="360" y2="300" stroke="#c25a1d" stroke-width="2.5" marker-end="url(#ca-in)"/>
  <text x="470" y="455" font-size="11" fill="#c25a1d" text-anchor="middle">source-code dependencies</text>
  <text x="470" y="470" font-size="11" fill="#c25a1d" text-anchor="middle">only ever point inward</text>

  <text x="310" y="505" font-size="12" fill="#444444" text-anchor="middle">The domain has no dependencies; infrastructure implements the ports the application defines, wired at the composition root.</text>
</svg>
