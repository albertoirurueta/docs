<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Architecture of an app inside the editor</text>
  <rect x="20" y="50" width="470" height="320" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="36" y="72" font-size="13" font-weight="bold" fill="#1F2937">Editor (host page)</text>
  <rect x="36" y="86" width="200" height="268" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="46" y="106" font-size="13" font-weight="bold" fill="#1F2937">App iframe (side panel)</text>
  <rect x="48" y="118" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="58" y="138" font-size="12" fill="#374151">React UI built with</text><text x="58" y="153" font-size="12" fill="#374151">the App UI Kit</text>
  <rect x="48" y="172" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="58" y="192" font-size="12" fill="#374151">Intent: prepareDesignEditor</text><text x="58" y="207" font-size="12" fill="#374151">registers render()</text>
  <rect x="48" y="226" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="58" y="246" font-size="12" fill="#374151">SDK packages: design,</text><text x="58" y="261" font-size="12" fill="#374151">asset, user, platform</text>
  <rect x="48" y="280" width="176" height="62" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <text x="58" y="300" font-size="12" fill="#92400E">Permissions in</text><text x="58" y="315" font-size="12" fill="#92400E">canva-app.json decide what</text><text x="58" y="330" font-size="12" fill="#92400E">the SDK calls may do</text>
  <rect x="290" y="86" width="186" height="268" rx="8" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="300" y="106" font-size="13" font-weight="bold" fill="#1F2937">Canvas and design</text>
  <rect x="312" y="124" width="142" height="142" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="324" y="136" width="70" height="8" rx="2" fill="#4F46E5"/>
  <rect x="336" y="160" width="34" height="76" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="376" y="170" width="34" height="66" fill="#FEF3C7" stroke="#B45309"/>
  <line x1="324" y1="236" x2="442" y2="236" stroke="#6B7280" stroke-width="2"/>
  <text x="300" y="292" font-size="12" fill="#374151">Elements the app adds,</text><text x="300" y="307" font-size="12" fill="#374151">applied when sync() or an</text><text x="300" y="322" font-size="12" fill="#374151">add call completes</text>
  <path d="M237,200 L289,200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="263" y="192" font-size="11" fill="#374151" text-anchor="middle">SDK</text>
  <rect x="540" y="86" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="550" y="106" font-size="13" font-weight="bold" fill="#1F2937">Your backend (optional)</text>
  <text x="550" y="128" font-size="12" fill="#374151">Express server that</text><text x="550" y="143" font-size="12" fill="#374151">verifies the JWT, holds</text><text x="550" y="158" font-size="12" fill="#374151">secrets, calls other APIs</text><text x="550" y="180" font-size="12" fill="#6B7280">CORS must allow the app</text>
  <rect x="540" y="236" width="200" height="118" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="550" y="256" font-size="13" font-weight="bold" fill="#1F2937">Developer Portal</text>
  <text x="550" y="278" font-size="12" fill="#374151">App ID, listing details,</text><text x="550" y="293" font-size="12" fill="#374151">auth providers, JS bundle</text><text x="550" y="308" font-size="12" fill="#374151">upload and review status</text>
  <path d="M225,160 C400,60 470,60 539,120" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <text x="400" y="62" font-size="11" fill="#374151" text-anchor="middle">fetch with a token</text>
  <path d="M640,198 L640,234" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="652" y="220" font-size="11" fill="#374151">app ID</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor and app, not a screenshot of any product.</text>
</svg>
