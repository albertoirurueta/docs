<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Docker Engine stack</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Docker Engine stack</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">from a docker CLI command down to the Linux kernel primitives that isolate the process</text>
  <rect x="120" y="56" width="520" height="50" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="77.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">docker CLI  /  Compose  /  Testcontainers  /  SDKs</text>
  <text x="380.0" y="92.8" font-size="9.5" fill="#333333" text-anchor="middle">clients: build REST requests</text>
  <line x1="380" y1="106" x2="380" y2="118" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="118" width="520" height="50" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="139.2" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Engine API (REST)</text>
  <text x="380.0" y="154.8" font-size="9.5" fill="#333333" text-anchor="middle">unix:///var/run/docker.sock   |   tcp://host:2376 (TLS)   |   ssh://user@host</text>
  <line x1="380" y1="168" x2="380" y2="180" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="180" width="520" height="50" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="201.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">dockerd</text>
  <text x="380.0" y="216.8" font-size="9.5" fill="#333333" text-anchor="middle">API server, images, networks, volumes, BuildKit builder, logging drivers</text>
  <line x1="380" y1="230" x2="380" y2="242" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="242" width="520" height="50" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="380.0" y="263.2" font-size="12" font-weight="bold" fill="#1f6b6b" text-anchor="middle">containerd</text>
  <text x="380.0" y="278.8" font-size="9.5" fill="#333333" text-anchor="middle">image store and snapshotters, content store, container and task lifecycle</text>
  <line x1="380" y1="292" x2="380" y2="304" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="304" width="520" height="50" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="380.0" y="325.2" font-size="12" font-weight="bold" fill="#1f6b6b" text-anchor="middle">containerd-shim-runc-v2</text>
  <text x="380.0" y="340.8" font-size="9.5" fill="#333333" text-anchor="middle">one per container: keeps stdio and exit status, lets containerd restart</text>
  <line x1="380" y1="354" x2="380" y2="366" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="366" width="520" height="50" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="387.2" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">runc (OCI runtime)</text>
  <text x="380.0" y="402.8" font-size="9.5" fill="#333333" text-anchor="middle">reads the OCI bundle (config.json + rootfs), creates namespaces/cgroups, execs PID 1</text>
  <line x1="380" y1="416" x2="380" y2="428" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="120" y="428" width="520" height="50" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380.0" y="449.2" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Linux kernel</text>
  <text x="380.0" y="464.8" font-size="9.5" fill="#333333" text-anchor="middle">namespaces   cgroups v2   capabilities   seccomp   AppArmor/SELinux   overlayfs</text>
  <rect x="660" y="180" width="90" height="110" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="705.0" y="211.5" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">BuildKit</text>
  <text x="705.0" y="226.5" font-size="9" fill="#333333" text-anchor="middle">builds</text>
  <text x="705.0" y="239.5" font-size="9" fill="#333333" text-anchor="middle">images;</text>
  <text x="705.0" y="252.5" font-size="9" fill="#333333" text-anchor="middle">runs in</text>
  <text x="705.0" y="265.5" font-size="9" fill="#333333" text-anchor="middle">dockerd</text>
  <line x1="640" y1="205" x2="660" y2="205" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="10" y="100" width="95" height="80" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="57.5" y="129.2" font-size="9.5" fill="#333333" text-anchor="middle">socket access</text>
  <text x="57.5" y="142.8" font-size="9.5" fill="#333333" text-anchor="middle">=</text>
  <text x="57.5" y="156.2" font-size="9.5" fill="#333333" text-anchor="middle">root on the host</text>
  <line x1="105" y1="143" x2="120" y2="143" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
</svg>
