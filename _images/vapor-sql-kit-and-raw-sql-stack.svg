<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where SQLKit sits next to Fluent</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">req.db is one object; casting it to SQLDatabase or to a driver protocol selects how much of the database you can reach</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="70" width="270" height="110" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="155" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Fluent (portable)</text>
  <text x="155" y="116" font-size="11" fill="#222222" text-anchor="middle">Book.query(on: req.db)</text>
  <text x="155" y="134" font-size="11" fill="#222222" text-anchor="middle">models, relations, migrations</text>
  <text x="155" y="152" font-size="11" fill="#222222" text-anchor="middle">works on SQL, MongoDB alike</text>
  <text x="155" y="170" font-size="11" fill="#222222" text-anchor="middle">escape hatch: .custom, .sql(raw:)</text>

  <rect x="335" y="70" width="270" height="110" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="470" y="94" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">SQLKit (any SQL driver)</text>
  <text x="470" y="116" font-size="11" fill="#222222" text-anchor="middle">req.db as? any SQLDatabase</text>
  <text x="470" y="134" font-size="11" fill="#222222" text-anchor="middle">raw("...\(bind: x)"), select(), insert(into:)</text>
  <text x="470" y="152" font-size="11" fill="#222222" text-anchor="middle">update(), delete(from:), rows decoded</text>
  <text x="470" y="170" font-size="11" fill="#222222" text-anchor="middle">into Codable structs or Fluent models</text>

  <rect x="650" y="70" width="270" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="785" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Driver API (one database)</text>
  <text x="785" y="116" font-size="11" fill="#222222" text-anchor="middle">req.db as? any PostgresDatabase</text>
  <text x="785" y="134" font-size="11" fill="#222222" text-anchor="middle">simpleQuery, withConnection</text>
  <text x="785" y="152" font-size="11" fill="#222222" text-anchor="middle">postgres-nio: LISTEN/NOTIFY, COPY</text>
  <text x="785" y="170" font-size="11" fill="#222222" text-anchor="middle">SQLite and MySQL have their own</text>

  <line x1="155" y1="180" x2="155" y2="230" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="180" x2="470" y2="230" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="785" y1="180" x2="785" y2="230" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="20" y="230" width="900" height="70" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="470" y="254" font-size="14" font-weight="bold" fill="#7b1fa2" text-anchor="middle">SQLExpression tree, serialized by the driver's SQLDialect into text plus bound values</text>
  <text x="470" y="276" font-size="11" fill="#222222" text-anchor="middle">PostgreSQL: SELECT "title" FROM "books" WHERE "price_cents" &lt; $1</text>
  <text x="470" y="292" font-size="11" fill="#222222" text-anchor="middle">SQLite: ... WHERE "price_cents" &lt; ?1      MySQL: SELECT `title` FROM `books` WHERE `price_cents` &lt; ?</text>

  <line x1="470" y1="300" x2="470" y2="340" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="260" y="340" width="420" height="70" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="470" y="364" font-size="14" font-weight="bold" fill="#455a64" text-anchor="middle">Connection pool and database</text>
  <text x="470" y="384" font-size="11" fill="#222222" text-anchor="middle">values travel as protocol parameters, never inside the SQL text</text>
  <text x="470" y="400" font-size="11" fill="#222222" text-anchor="middle">only unsafeRaw, SQLRaw and .custom(String) put your text in the statement</text>
</svg>
