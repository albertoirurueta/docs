<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Rules that decide whether an ability is offered to MCP clients</title>
<desc id="d">A flow of two questions: an explicit mcp.public value wins; when it is absent the ability follows meta.public, which defaults to false. Exposed abilities are then checked on every call for the read capability, the input schema, the ability permission callback and the mcp.type that selects tool, resource or prompt.</desc>
<rect width="1040" height="480" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Is an ability offered to MCP clients? The rules of MCP Adapter 0.7.1</text>
<rect x="30" y="70" width="280" height="80" rx="10" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="170.0" y="94" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Ability registered</text>
<text x="170.0" y="116" font-size="12" fill="#f2f5f8" text-anchor="middle">wp_register_ability( name, args )</text>
<text x="170.0" y="133" font-size="12" fill="#f2f5f8" text-anchor="middle">meta may hold mcp and public</text>
<line x1="310" y1="110" x2="380" y2="110" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="380,110 371.7,113.5 371.7,106.5" fill="#7fb3e6"/>
<rect x="380" y="60" width="300" height="100" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="530.0" y="84" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Is meta.mcp.public set?</text>
<text x="530.0" y="106" font-size="12" fill="#f2f5f8" text-anchor="middle">true: exposed</text>
<text x="530.0" y="123" font-size="12" fill="#f2f5f8" text-anchor="middle">false: hidden</text>
<text x="530.0" y="140" font-size="12" fill="#f2f5f8" text-anchor="middle">(an invalid meta.mcp fails closed: hidden)</text>
<line x1="530" y1="160" x2="530" y2="215" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="530,215 526.5,206.7 533.5,206.7" fill="#7fb3e6"/>
<text x="540" y="195" font-size="12" fill="#7fb3e6">not set</text>
<rect x="380" y="215" width="300" height="90" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="530.0" y="239" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Is meta.public true?</text>
<text x="530.0" y="261" font-size="12" fill="#f2f5f8" text-anchor="middle">true: exposed</text>
<text x="530.0" y="278" font-size="12" fill="#f2f5f8" text-anchor="middle">not true or absent: hidden</text>
<text x="530.0" y="295" font-size="12" fill="#f2f5f8" text-anchor="middle">(meta.public defaults to false)</text>
<line x1="680" y1="110" x2="760" y2="110" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="760,110 751.7,113.5 751.7,106.5" fill="#7fb3e6"/>
<text x="700" y="100" font-size="12" fill="#7fb3e6">set</text>
<rect x="760" y="60" width="250" height="100" rx="10" fill="#2f6b6b" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="885.0" y="84" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Result: exposed or hidden</text>
<text x="885.0" y="106" font-size="12" fill="#f2f5f8" text-anchor="middle">Exposed: listed by discover-abilities,</text>
<text x="885.0" y="123" font-size="12" fill="#f2f5f8" text-anchor="middle">callable by execute-ability.</text>
<text x="885.0" y="140" font-size="12" fill="#f2f5f8" text-anchor="middle">Hidden: reports not found.</text>
<line x1="680" y1="260" x2="760" y2="150" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="760,150 758.0,158.8 752.3,154.6" fill="#7fb3e6"/>
<rect x="30" y="330" width="980" height="130" rx="10" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="520.0" y="354" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Then, for every call, the ability checks the caller</text>
<text x="520.0" y="376" font-size="12" fill="#f2f5f8" text-anchor="middle">1. Default server: the user needs the read capability (filter mcp_adapter_default_transport_permission_user_capability).</text>
<text x="520.0" y="393" font-size="12" fill="#f2f5f8" text-anchor="middle">2. Input is validated against input_schema; invalid input is an error result (isError true), not an HTTP error.</text>
<text x="520.0" y="410" font-size="12" fill="#f2f5f8" text-anchor="middle">3. permission_callback decides: a customer account calling woocommerce/orders-query got Permission denied.</text>
<text x="520.0" y="427" font-size="12" fill="#f2f5f8" text-anchor="middle">4. mcp.type chooses the kind: tool (default), resource (needs mcp.uri) or prompt (callback returns messages).</text>
</svg>
