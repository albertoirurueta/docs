<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 560" width="1010" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">WooCommerce Settings tabs in version 11.2.1</title>
  <desc id="d">Eleven tabs of WooCommerce Settings with their sections or main options: General, Products, Tax, Shipping, Payments, Accounts and Privacy, Emails, Integration, Site visibility, Point of Sale and Advanced.</desc>
  <rect x="15" y="20" width="232" height="158" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="131.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">General</text>
  <text x="131.0" y="68" text-anchor="middle" font-size="12">store address, country</text>
  <text x="131.0" y="88" text-anchor="middle" font-size="12">selling and shipping countries</text>
  <text x="131.0" y="108" text-anchor="middle" font-size="12">currency and separators</text>
  <text x="131.0" y="128" text-anchor="middle" font-size="12">taxes and coupons switches</text>
  <rect x="264" y="20" width="232" height="158" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="380.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Products</text>
  <text x="380.0" y="68" text-anchor="middle" font-size="12">shop page, add to cart</text>
  <text x="380.0" y="88" text-anchor="middle" font-size="12">weight and dimension units</text>
  <text x="380.0" y="108" text-anchor="middle" font-size="12">reviews and ratings</text>
  <text x="380.0" y="128" text-anchor="middle" font-size="12">sections: Inventory,</text>
  <text x="380.0" y="148" text-anchor="middle" font-size="12">Downloadable, Advanced</text>
  <rect x="513" y="20" width="232" height="158" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="629.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Tax (after enabling)</text>
  <text x="629.0" y="68" text-anchor="middle" font-size="12">prices include tax</text>
  <text x="629.0" y="88" text-anchor="middle" font-size="12">tax based on, display</text>
  <text x="629.0" y="108" text-anchor="middle" font-size="12">sections: Standard, Reduced, Zero</text>
  <text x="629.0" y="128" text-anchor="middle" font-size="12">rounding and suffix</text>
  <rect x="762" y="20" width="232" height="158" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="878.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Shipping</text>
  <text x="878.0" y="68" text-anchor="middle" font-size="12">zones and methods</text>
  <text x="878.0" y="88" text-anchor="middle" font-size="12">sections: Options, Classes,</text>
  <text x="878.0" y="108" text-anchor="middle" font-size="12">Pickup locations</text>
  <text x="878.0" y="128" text-anchor="middle" font-size="12">shipping destination</text>
  <rect x="15" y="195" width="232" height="158" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="131.0" y="219" text-anchor="middle" font-size="14" font-weight="bold">Payments</text>
  <text x="131.0" y="243" text-anchor="middle" font-size="12">gateway list, order</text>
  <text x="131.0" y="263" text-anchor="middle" font-size="12">bank transfer, cheque, cash</text>
  <text x="131.0" y="283" text-anchor="middle" font-size="12">WooPayments and suggestions</text>
  <text x="131.0" y="303" text-anchor="middle" font-size="12">per-gateway settings</text>
  <rect x="264" y="195" width="232" height="158" rx="10" fill="#1abc9c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="380.0" y="219" text-anchor="middle" font-size="14" font-weight="bold">Accounts and Privacy</text>
  <text x="380.0" y="243" text-anchor="middle" font-size="12">guest checkout, sign-up</text>
  <text x="380.0" y="263" text-anchor="middle" font-size="12">privacy policy text</text>
  <text x="380.0" y="283" text-anchor="middle" font-size="12">erasure requests</text>
  <text x="380.0" y="303" text-anchor="middle" font-size="12">retention of old orders</text>
  <rect x="513" y="195" width="232" height="158" rx="10" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="629.0" y="219" text-anchor="middle" font-size="14" font-weight="bold">Emails</text>
  <text x="629.0" y="243" text-anchor="middle" font-size="12">sender name and address</text>
  <text x="629.0" y="263" text-anchor="middle" font-size="12">header image, colours, font</text>
  <text x="629.0" y="283" text-anchor="middle" font-size="12">one screen per email</text>
  <text x="629.0" y="303" text-anchor="middle" font-size="12">17 email classes registered</text>
  <rect x="762" y="195" width="232" height="158" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="878.0" y="219" text-anchor="middle" font-size="14" font-weight="bold">Integration</text>
  <text x="878.0" y="243" text-anchor="middle" font-size="12">MaxMind Geolocation</text>
  <text x="878.0" y="263" text-anchor="middle" font-size="12">extensions add their own</text>
  <rect x="15" y="370" width="232" height="158" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="131.0" y="394" text-anchor="middle" font-size="14" font-weight="bold">Site visibility</text>
  <text x="131.0" y="418" text-anchor="middle" font-size="12">coming soon: off or on</text>
  <text x="131.0" y="438" text-anchor="middle" font-size="12">store pages only or whole site</text>
  <rect x="264" y="370" width="232" height="158" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="380.0" y="394" text-anchor="middle" font-size="14" font-weight="bold">Point of Sale</text>
  <text x="380.0" y="418" text-anchor="middle" font-size="12">store name, address, phone</text>
  <text x="380.0" y="438" text-anchor="middle" font-size="12">email, refund and returns policy</text>
  <rect x="513" y="370" width="232" height="158" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="629.0" y="394" text-anchor="middle" font-size="14" font-weight="bold">Advanced</text>
  <text x="629.0" y="418" text-anchor="middle" font-size="12">sections: Page setup, REST API,</text>
  <text x="629.0" y="438" text-anchor="middle" font-size="12">Webhooks, WooCommerce.com,</text>
  <text x="629.0" y="458" text-anchor="middle" font-size="12">Blueprint, Features</text>
  <text x="629.0" y="478" text-anchor="middle" font-size="12">legacy pages and tools in Status</text>
  <text x="505" y="545" text-anchor="middle" font-size="12">Tab ids and labels come from WC_Admin_Settings::get_settings_pages(); the Tax tab appears only when woocommerce_calc_taxes is yes.</text>
</svg>
