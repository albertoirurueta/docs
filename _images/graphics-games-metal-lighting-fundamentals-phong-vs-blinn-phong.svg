<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-lighting-fundamentals-phong-vs-blinn-phong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Phong and Blinn-Phong: same idea, different angle</text>
<rect x="30" y="50" width="335" height="300" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="197" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Phong: angle between R and V</text>
<line x1="60" y1="290" x2="335" y2="290" stroke="#4B5563" stroke-width="1.5"/>
<line x1="197" y1="290" x2="197.0" y2="140.0" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="197.0" y="134.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">N</text>
<line x1="197" y1="290" x2="82.1" y2="193.6" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="74.1" y="187.6" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">L</text>
<line x1="197" y1="290" x2="272.0" y2="160.1" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="280.0" y="154.1" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">V</text>
<line x1="197" y1="290" x2="311.9" y2="193.6" stroke="#B45309" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="321.9" y="187.6" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">R</text>
<text x="197" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cos of the angle between R and V, raised to s</text>
<text x="197" y="334" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">R must be computed with reflect(); negative at grazing angles</text>
<rect x="395" y="50" width="335" height="300" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="562" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Blinn-Phong: angle between N and H</text>
<line x1="425" y1="290" x2="700" y2="290" stroke="#4B5563" stroke-width="1.5"/>
<line x1="562" y1="290" x2="562.0" y2="140.0" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="562.0" y="134.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">N</text>
<line x1="562" y1="290" x2="447.1" y2="193.6" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="439.1" y="187.6" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">L</text>
<line x1="562" y1="290" x2="637.0" y2="160.1" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="645.0" y="154.1" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">V</text>
<line x1="562" y1="290" x2="540.3" y2="166.9" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-phong-vs-blinn-phong)"/>
<text x="532.3" y="160.9" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">H</text>
<text x="562" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cos of the angle between N and H, raised to s</text>
<text x="562" y="334" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one add and a normalise; stays positive longer</text>
</svg>
