<svg viewBox="0 0 760 250" width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-offscreencanvas-and-workers-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Moving the Bookshelf renderer into a worker</text>
<rect x="14" y="50" width="138" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="83.0" y="114.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Page canvas</text>
<circle cx="28" cy="64" r="11" fill="#4F46E5"/><text x="28" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="83" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">no context yet</text>
<text x="83" y="203" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">on the main thread</text>
<line x1="152" y1="110" x2="162" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-offscreencanvas-and-workers-storyboard)"/>
<rect x="162" y="50" width="138" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="231.0" y="114.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Transfer</text>
<circle cx="176" cy="64" r="11" fill="#4F46E5"/><text x="176" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="231" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">transferControl-</text>
<text x="231" y="203" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">ToOffscreen()</text>
<line x1="300" y1="110" x2="310" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-offscreencanvas-and-workers-storyboard)"/>
<rect x="310" y="50" width="138" height="120" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="379.0" y="114.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Worker init</text>
<circle cx="324" cy="64" r="11" fill="#4F46E5"/><text x="324" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="379" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">getContext webgl2</text>
<text x="379" y="203" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">build the scene</text>
<line x1="448" y1="110" x2="458" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-offscreencanvas-and-workers-storyboard)"/>
<rect x="458" y="50" width="138" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="527.0" y="114.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Proxy input</text>
<circle cx="472" cy="64" r="11" fill="#4F46E5"/><text x="472" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="527" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pointer and resize</text>
<text x="527" y="203" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">messages</text>
<line x1="596" y1="110" x2="606" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-offscreencanvas-and-workers-storyboard)"/>
<rect x="606" y="50" width="138" height="120" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="675.0" y="114.5" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Loop</text>
<circle cx="620" cy="64" r="11" fill="#4F46E5"/><text x="620" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="675" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">rAF in the worker</text>
<text x="675" y="203" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">HUD by message</text>
<text x="380" y="222" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Steps 1 and 2 run on the main thread, steps 3 to 5 in the worker; the canvas must stay context-free until step 2.</text>
</svg>
