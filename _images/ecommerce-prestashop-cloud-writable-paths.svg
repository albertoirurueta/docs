<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where each writable path of PrestaShop 9.2.0 lives on a cluster</title>
  <desc id="d">Three columns. The shared EFS volume pocketcoffee-shared, an access point with user and group 33, holds the paths that every pod must see and that change at run time: img with its product, category, manufacturer, supplier, store and tmp folders and the shop logos, upload for customer file customizations, download for virtual products and attachments, the back office import folder of the CSV import wizard, the combined and cached theme assets, and config/themes with the parsed theme settings. Per-pod emptyDir volumes hold var/cache seeded from the image, var/logs, tmp and the back office export folder, so a pod can be replaced without losing anything. The read-only container image holds modules, themes, override, translations, mails, classes, src and vendor, built once per release; app/config/parameters.php is mounted from a Secret. Below, the media path: the browser asks CloudFront for media.pocketcoffee.example, CloudFront asks the nginx container of any pod, and nginx reads the files from the shared volume. PrestaShop 9.2.0 has no S3 storage option, so there is no bucket in this picture.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Three homes for the paths PrestaShop writes to</text>

  <!-- column panels -->
  <rect x="30" y="52" width="290" height="354" rx="10" fill="#2f4a44"/>
  <rect x="335" y="52" width="290" height="354" rx="10" fill="#7a5c3a"/>
  <rect x="640" y="52" width="290" height="354" rx="10" fill="#3f6e9a"/>

  <!-- column 1: shared EFS -->
  <g fill="#f2f5f8" font-size="12.5">
    <text x="44" y="78" font-size="14" font-weight="bold" fill="#9fd3c7">Shared: EFS, ReadWriteMany</text>
    <text x="44" y="96" font-size="12" fill="#9fd3c7">PVC pocketcoffee-shared, uid and gid 33</text>
    <rect x="44" y="104" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="121" font-weight="bold">img/</text>
    <text x="54" y="137" font-size="11.5">p c m su st cms l os s co e tmp, logos</text>
    <rect x="44" y="151" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="168" font-weight="bold">upload/</text>
    <text x="54" y="184" font-size="11.5">files customers attach to a product</text>
    <rect x="44" y="198" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="215" font-weight="bold">download/</text>
    <text x="54" y="231" font-size="11.5">virtual products and attachments</text>
    <rect x="44" y="245" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="262" font-weight="bold">admin-pocketcoffee/import/</text>
    <text x="54" y="278" font-size="11.5">CSV of the import wizard, several requests</text>
    <rect x="44" y="292" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="309" font-weight="bold">themes/pocketcoffee/assets/cache/</text>
    <text x="54" y="325" font-size="11.5">combined CSS and JS, named by version</text>
    <rect x="44" y="339" width="262" height="42" rx="8" fill="#3d5266"/>
    <text x="54" y="356" font-weight="bold">config/themes/</text>
    <text x="54" y="372" font-size="11.5">parsed theme settings, one JSON per shop</text>
    <text x="44" y="402" font-size="11.5" fill="#f4b860">Seeded once from the image with tar --skip-old-files</text>
  </g>

  <!-- column 2: per pod -->
  <g fill="#f2f5f8" font-size="12.5">
    <text x="349" y="78" font-size="14" font-weight="bold" fill="#f4b860">Per pod: emptyDir</text>
    <text x="349" y="96" font-size="12" fill="#f4b860">gone with the pod, rebuilt at start</text>
    <rect x="349" y="108" width="262" height="46" rx="8" fill="#8a6b45"/>
    <text x="359" y="127" font-weight="bold">var/cache/</text>
    <text x="359" y="144" font-size="11.5">Symfony and Smarty, seeded from image</text>
    <rect x="349" y="162" width="262" height="46" rx="8" fill="#8a6b45"/>
    <text x="359" y="181" font-weight="bold">var/logs/</text>
    <text x="359" y="198" font-size="11.5">exception log; the main log can go to stderr</text>
    <rect x="349" y="216" width="262" height="46" rx="8" fill="#8a6b45"/>
    <text x="359" y="235" font-weight="bold">/tmp</text>
    <text x="359" y="252" font-size="11.5">uploads in flight, PHP scratch files</text>
    <rect x="349" y="270" width="262" height="46" rx="8" fill="#8a6b45"/>
    <text x="359" y="289" font-weight="bold">admin-pocketcoffee/export/</text>
    <text x="359" y="306" font-size="11.5">SQL Manager CSV, served at once</text>
    <text x="349" y="348" font-size="12" fill="#f2f5f8">Not on EFS: a per-pod cache gains nothing</text>
    <text x="349" y="365" font-size="12" fill="#f2f5f8">from sharing and pays a network read</text>
  </g>

  <!-- column 3: image -->
  <g fill="#f2f5f8" font-size="12.5">
    <text x="654" y="78" font-size="14" font-weight="bold" fill="#c9e3f7">Read-only: the image</text>
    <text x="654" y="96" font-size="12" fill="#c9e3f7">built once per release, tag is the git SHA</text>
    <rect x="654" y="108" width="262" height="46" rx="8" fill="#4f82ad"/>
    <text x="664" y="127" font-weight="bold">modules/ themes/ override/</text>
    <text x="664" y="144" font-size="11.5">code; installed at build, not from the BO</text>
    <rect x="654" y="162" width="262" height="46" rx="8" fill="#4f82ad"/>
    <text x="664" y="181" font-weight="bold">translations/ mails/</text>
    <text x="664" y="198" font-size="11.5">language files; a new language is a release</text>
    <rect x="654" y="216" width="262" height="46" rx="8" fill="#4f82ad"/>
    <text x="664" y="235" font-weight="bold">classes/ src/ vendor/ admin-pocketcoffee/</text>
    <text x="664" y="252" font-size="11.5">core, dependencies, renamed admin folder</text>
    <rect x="654" y="270" width="262" height="46" rx="8" fill="#4f82ad"/>
    <text x="664" y="289" font-weight="bold">app/config/parameters.php</text>
    <text x="664" y="306" font-size="11.5">file mounted from a Secret, never edited</text>
    <text x="654" y="348" font-size="12">The Information page of the back office</text>
    <text x="654" y="365" font-size="12">reports these folders as not writable.</text>
    <text x="654" y="382" font-size="12">That is expected here.</text>
  </g>

  <!-- media path strip -->
  <rect x="30" y="424" width="900" height="152" rx="10" fill="#33485c"/>
  <text x="44" y="448" font-size="14" font-weight="bold" fill="#f2f5f8">The media path: no bucket, because the core has no S3 option</text>
  <g stroke="#f4b860" stroke-width="2" fill="none">
    <line x1="228" y1="500" x2="262" y2="500" marker-end="url(#a)"/>
    <line x1="470" y1="500" x2="504" y2="500" marker-end="url(#a)"/>
    <line x1="728" y1="500" x2="762" y2="500" marker-end="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#f2f5f8">
    <rect x="44" y="470" width="184" height="60" rx="8" fill="#3d5266"/>
    <text x="56" y="494" font-weight="bold">Browser</text>
    <text x="56" y="512" font-size="11.5">GET /img/p/1/2/3/123.jpg</text>
    <rect x="262" y="470" width="208" height="60" rx="8" fill="#6a5a8a"/>
    <text x="274" y="494" font-weight="bold">CloudFront</text>
    <text x="274" y="512" font-size="11.5">media.pocketcoffee.example</text>
    <rect x="504" y="470" width="224" height="60" rx="8" fill="#4f82ad"/>
    <text x="516" y="494" font-weight="bold">nginx of any pod</text>
    <text x="516" y="512" font-size="11.5">static paths only, PHP denied</text>
    <rect x="762" y="470" width="154" height="60" rx="8" fill="#4d7c5a"/>
    <text x="774" y="494" font-weight="bold">EFS volume</text>
    <text x="774" y="512" font-size="11.5">same files for all pods</text>
    <text x="44" y="556" font-size="12" fill="#f4b860">The URL host comes from PS_MEDIA_SERVER_1; a miss at CloudFront costs one read from EFS, a hit costs none.</text>
  </g>
</svg>
