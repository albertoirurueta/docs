<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Request flow of a Hydrogen 2026-10 storefront</title>
  <desc id="d">Every request first gets a request context and a Storefront API client. Hydrogen's handleShopifyRoutes answers the routes that Shopify owns, such as the cart API, checkout, cart permalinks and the Storefront API proxy. Anything else goes to the framework router. If the router returns a 404, handleShopifyRedirects checks the admin path and the store's URL redirects. The final response gets the request context headers.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="170" height="60" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="105" y="46" text-anchor="middle" font-weight="bold">Incoming request</text>
  <text x="105" y="64" text-anchor="middle" font-size="11" opacity="0.8">buyer IP header from host</text>

  <rect x="240" y="20" width="250" height="60" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="44" text-anchor="middle" font-weight="bold">Request context + client</text>
  <text x="365" y="62" text-anchor="middle" font-size="10">createShopifyRequestContext + createStorefrontClient</text>

  <rect x="540" y="20" width="300" height="60" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="44" text-anchor="middle" font-weight="bold">handleShopifyRoutes</text>
  <text x="690" y="62" text-anchor="middle" font-size="11">returns null when nothing matches</text>

  <rect x="540" y="130" width="300" height="130" rx="10" fill="#e67e22" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="690" y="152" text-anchor="middle" font-weight="bold">Answered by Hydrogen</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5">
    <text x="556" y="174">/api/cart  (cart handlers)</text>
    <text x="556" y="192">/account/login|authorize|refresh|logout</text>
    <text x="556" y="210">/api/{version}/graphql.json  (proxy)</text>
    <text x="556" y="228">/checkout, /cart/{id}:{qty}, /cart.js</text>
    <text x="556" y="246">/.well-known/*, /api/mcp</text>
  </g>

  <rect x="240" y="130" width="250" height="60" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="154" text-anchor="middle" font-weight="bold">Framework router</text>
  <text x="365" y="172" text-anchor="middle" font-size="11">Next.js, React Router, Nuxt, Astro...</text>

  <rect x="240" y="240" width="250" height="60" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="264" text-anchor="middle" font-weight="bold">handleShopifyRedirects</text>
  <text x="365" y="282" text-anchor="middle" font-size="11">only after a 404</text>

  <rect x="20" y="240" width="170" height="60" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="105" y="264" text-anchor="middle" font-weight="bold">Framework 404</text>
  <text x="105" y="282" text-anchor="middle" font-size="11">when no redirect exists</text>

  <rect x="240" y="350" width="600" height="80" rx="10" fill="#3498db" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="376" text-anchor="middle" font-weight="bold">Final response</text>
  <text x="540" y="396" text-anchor="middle" font-size="12">commit session cookies, then requestContext.applyResponseHeaders(response.headers)</text>
  <text x="540" y="414" text-anchor="middle" font-size="11" opacity="0.8">responses from the two Shopify handlers already carry these headers</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M190 50 L238 50"/>
    <path d="M490 50 L538 50"/>
    <path d="M690 80 L690 128"/>
    <path d="M540 60 L500 60 L500 160 L492 160" stroke-dasharray="5 4"/>
    <path d="M365 190 L365 238"/>
    <path d="M240 270 L192 270"/>
    <path d="M365 300 L365 348"/>
    <path d="M690 262 L690 320 L560 320 L560 348"/>
    <path d="M105 300 L105 390 L238 390"/>
  </g>
  <text x="516" y="104" font-size="11">no match</text>
  <text x="698" y="108" font-size="11">match</text>
  <text x="373" y="218" font-size="11">404</text>
  <text x="196" y="262" font-size="11">none</text>
  <text x="373" y="326" font-size="11">redirect</text>
</svg>
