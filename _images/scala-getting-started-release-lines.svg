<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Scala 3 release lines, 2023 to 2027</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">LTS and Scala Next lines with the minimum JDK each one needs (checked 2026-10-15)</text>
<rect x="190.0" y="66" width="148.0" height="26" fill="#e8f0f8" stroke="#cccccc" stroke-width="0.8"/>
<text x="264.0" y="84" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2023</text>
<line x1="190.0" y1="92" x2="190.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<rect x="338.0" y="66" width="148.0" height="26" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
<text x="412.0" y="84" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2024</text>
<line x1="338.0" y1="92" x2="338.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<rect x="486.0" y="66" width="148.0" height="26" fill="#e8f0f8" stroke="#cccccc" stroke-width="0.8"/>
<text x="560.0" y="84" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2025</text>
<line x1="486.0" y1="92" x2="486.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<rect x="634.0" y="66" width="148.0" height="26" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
<text x="708.0" y="84" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2026</text>
<line x1="634.0" y1="92" x2="634.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<rect x="782.0" y="66" width="148.0" height="26" fill="#e8f0f8" stroke="#cccccc" stroke-width="0.8"/>
<text x="856.0" y="84" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2027</text>
<line x1="782.0" y1="92" x2="782.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<line x1="930.0" y1="92" x2="930.0" y2="372" stroke="#dddddd" stroke-width="0.8"/>
<line x1="634.0" y1="100" x2="634.0" y2="372" stroke="#a35a00" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="880.7" y1="100" x2="880.7" y2="372" stroke="#777777" stroke-width="1" stroke-dasharray="3 4"/>
<text x="20" y="132" font-size="13" font-weight="bold" fill="#222222">Scala 3.3 LTS</text>
<rect x="239.3" y="110" width="641.3" height="32" rx="4" fill="#2e7d32" fill-opacity="0.18" stroke="#2e7d32" stroke-width="1.4"/>
<text x="247.3" y="131" font-size="12" font-weight="bold" fill="#2e7d32">JDK 8+ bytecode</text>
<text x="239.3" y="160" font-size="11" fill="#555555" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">3.3.0 (May 2023) to 3.3.8 (Jun 2026), maintained about a year after 3.9.0</text>
<text x="20" y="202" font-size="13" font-weight="bold" fill="#222222">Scala Next 3.4 to 3.8</text>
<rect x="350.3" y="180" width="296.0" height="32" rx="4" fill="#1c4b73" fill-opacity="0.18" stroke="#1c4b73" stroke-width="1.4"/>
<text x="358.3" y="201" font-size="12" font-weight="bold" fill="#1c4b73">JDK 8+ up to 3.7, JDK 17+ from 3.8</text>
<text x="350.3" y="230" font-size="11" fill="#555555" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">3.4 Feb 2024, 3.5 Aug 2024, 3.6.2 Dec 2024, 3.7 May 2025, 3.8 Jan 2026</text>
<text x="20" y="272" font-size="13" font-weight="bold" fill="#222222">Scala 3.9 LTS</text>
<rect x="732.7" y="250" width="197.3" height="32" rx="4" fill="#2e7d32" fill-opacity="0.18" stroke="#2e7d32" stroke-width="1.4"/>
<text x="740.7" y="271" font-size="12" font-weight="bold" fill="#2e7d32">JDK 17+</text>
<text x="724.7" y="300" font-size="11" fill="#555555" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4">3.9.0 on 3 Sep 2026, current LTS</text>
<text x="20" y="342" font-size="13" font-weight="bold" fill="#222222">Scala Next 3.10</text>
<rect x="745.0" y="320" width="185.0" height="32" rx="4" fill="#1c4b73" fill-opacity="0.18" stroke="#1c4b73" stroke-width="1.4"/>
<text x="753.0" y="341" font-size="12" font-weight="bold" fill="#1c4b73">JDK 17+</text>
<text x="737.0" y="370" font-size="11" fill="#555555" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4">3.10.0 on 12 Oct 2026, current Next</text>
<text x="628.0" y="392" font-size="12" font-weight="bold" fill="#a35a00" text-anchor="end">Jan 2026: Scala 3.8 raises the JDK floor to 17</text>
<text x="876.7" y="410" font-size="11" fill="#555555" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4">Sep 2027: one year after 3.9.0</text>
<text x="20" y="428" font-size="11" fill="#666666">Bars start at the first usable release of each line (3.6.0 and 3.6.1 must not be used). Scala 2.13 and 2.12 continue separately.</text>
</svg>
