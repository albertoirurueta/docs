<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What the callee receives for an array dummy argument</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">the same 12 elements in memory (array element order); highlighted cells are the actual argument</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker>
  </defs>

  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1c4b73">1. Contiguous actual argument: v(4:7)</text>
  <g>
    <rect x="60" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="78.0" y="114" font-size="12" fill="#222222" text-anchor="middle">1</text>
    <rect x="96" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="114.0" y="114" font-size="12" fill="#222222" text-anchor="middle">2</text>
    <rect x="132" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="150.0" y="114" font-size="12" fill="#222222" text-anchor="middle">3</text>
    <rect x="168" y="94" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="186.0" y="114" font-size="12" fill="#222222" text-anchor="middle">4</text>
    <rect x="204" y="94" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="222.0" y="114" font-size="12" fill="#222222" text-anchor="middle">5</text>
    <rect x="240" y="94" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="258.0" y="114" font-size="12" fill="#222222" text-anchor="middle">6</text>
    <rect x="276" y="94" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="294.0" y="114" font-size="12" fill="#222222" text-anchor="middle">7</text>
    <rect x="312" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="330.0" y="114" font-size="12" fill="#222222" text-anchor="middle">8</text>
    <rect x="348" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="366.0" y="114" font-size="12" fill="#222222" text-anchor="middle">9</text>
