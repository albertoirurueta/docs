    <text x="258.0" y="410" font-size="12" fill="#222222" text-anchor="middle">6</text>
    <rect x="276" y="390" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="294.0" y="410" font-size="12" fill="#222222" text-anchor="middle">7</text>
    <rect x="312" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="330.0" y="410" font-size="12" fill="#222222" text-anchor="middle">8</text>
    <rect x="348" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="366.0" y="410" font-size="12" fill="#222222" text-anchor="middle">9</text>
    <rect x="384" y="390" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="402.0" y="410" font-size="12" fill="#222222" text-anchor="middle">10</text>
    <rect x="420" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="438.0" y="410" font-size="12" fill="#222222" text-anchor="middle">11</text>
    <rect x="456" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="474.0" y="410" font-size="12" fill="#222222" text-anchor="middle">12</text>
  </g>
  <g>
    <rect x="168" y="470" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="186.0" y="490" font-size="12" fill="#222222" text-anchor="middle">1</text>
    <rect x="204" y="470" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="222.0" y="490" font-size="12" fill="#222222" text-anchor="middle">2</text>
    <rect x="240" y="470" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="258.0" y="490" font-size="12" fill="#222222" text-anchor="middle">3</text>
    <rect x="276" y="470" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="294.0" y="490" font-size="12" fill="#222222" text-anchor="middle">4</text>
  </g>
  <text x="160" y="490" font-size="12" fill="#222222" text-anchor="end">temporary</text>
  <path d="M78.0 420 L180.0 468" stroke="#b26a00" stroke-width="1.3" fill="none" marker-end="url(#d)"/>
  <path d="M186.0 420 L216.0 468" stroke="#b26a00" stroke-width="1.3" fill="none" marker-end="url(#d)"/>
  <path d="M294.0 420 L252.0 468" stroke="#b26a00" stroke-width="1.3" fill="none" marker-end="url(#d)"/>
  <path d="M402.0 420 L288.0 468" stroke="#b26a00" stroke-width="1.3" fill="none" marker-end="url(#d)"/>
  <text x="560" y="446" font-size="12" fill="#b26a00">copy-in before the call (packs the elements)</text>
  <text x="560" y="464" font-size="12" fill="#b26a00">copy-out after the call, if the dummy may be changed</text>
  <text x="560" y="486" font-size="12" fill="#444444">gfortran: -fcheck=array-temps and -Warray-temporaries report it.</text>
  <text x="560" y="504" font-size="12" fill="#444444">A temporary is created on every call.</text>
