    <rect x="240" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="258.0" y="262" font-size="12" fill="#222222" text-anchor="middle">6</text>
    <rect x="276" y="242" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="294.0" y="262" font-size="12" fill="#222222" text-anchor="middle">7</text>
    <rect x="312" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="330.0" y="262" font-size="12" fill="#222222" text-anchor="middle">8</text>
    <rect x="348" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="366.0" y="262" font-size="12" fill="#222222" text-anchor="middle">9</text>
    <rect x="384" y="242" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="402.0" y="262" font-size="12" fill="#222222" text-anchor="middle">10</text>
    <rect x="420" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="438.0" y="262" font-size="12" fill="#222222" text-anchor="middle">11</text>
    <rect x="456" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="474.0" y="262" font-size="12" fill="#222222" text-anchor="middle">12</text>
  </g>
  <path d="M78 276 L78 298" stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="60" y="300" width="432" height="42" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="276" y="318" font-size="12" fill="#222222" text-anchor="middle">descriptor: base address, extent 4, stride 3 elements</text>
  <text x="276" y="334" font-size="12" fill="#222222" text-anchor="middle">x(2) is found by arithmetic on the stride; no copy</text>
  <text x="520" y="318" font-size="12" fill="#444444">size(x) = 4, lbound(x) = 1, is_contiguous(x) is false.</text>
  <text x="60" y="380" font-size="13" font-weight="bold" fill="#b26a00">3. The same section to x(n), x(*) or a contiguous x(:): copy-in / copy-out</text>
  <g>
    <rect x="60" y="390" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="78.0" y="410" font-size="12" fill="#222222" text-anchor="middle">1</text>
    <rect x="96" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="114.0" y="410" font-size="12" fill="#222222" text-anchor="middle">2</text>
    <rect x="132" y="390" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="150.0" y="410" font-size="12" fill="#222222" text-anchor="middle">3</text>
    <rect x="168" y="390" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
