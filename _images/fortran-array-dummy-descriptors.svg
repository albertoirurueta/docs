    <text x="438.0" y="114" font-size="12" fill="#222222" text-anchor="middle">11</text>
    <rect x="456" y="94" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="474.0" y="114" font-size="12" fill="#222222" text-anchor="middle">12</text>
  </g>
  <path d="M186 128 L186 150" stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="60" y="152" width="432" height="42" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="276" y="170" font-size="12" fill="#222222" text-anchor="middle">address of the first element only</text>
  <text x="276" y="186" font-size="12" fill="#222222" text-anchor="middle">x(n), x(*) and contiguous x(:) need nothing else; no copy</text>
  <text x="520" y="170" font-size="12" fill="#444444">Assumed-shape x(:) also gets extent 4 and stride 1.</text>
  <text x="60" y="232" font-size="13" font-weight="bold" fill="#1c4b73">2. Strided section v(1:12:3) to an assumed-shape dummy x(:)</text>
  <g>
    <rect x="60" y="242" width="36" height="30" fill="#fff4e0" stroke="#b26a00"/>
    <text x="78.0" y="262" font-size="12" fill="#222222" text-anchor="middle">1</text>
    <rect x="96" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
    <text x="114.0" y="262" font-size="12" fill="#222222" text-anchor="middle">2</text>
    <rect x="132" y="242" width="36" height="30" fill="#f4f4f4" stroke="#777777"/>
