<svg viewBox="0 0 900 560" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AcroForm anatomy: one field, one or more widgets, one appearance per state</text>

  <!-- AcroForm dictionary -->
  <rect x="30" y="48" width="840" height="78" rx="8" fill="#fff2dc" stroke="#b36b00" stroke-width="1.6"/>
  <text x="46" y="70" font-size="13" font-weight="700" fill="#7a4800">Catalog /AcroForm (the form as a whole)</text>
  <text x="46" y="92" font-size="11" font-family="Courier New, monospace" fill="#333">/Fields [ field field ... ]   /DA (default appearance)   /DR (default resources, fonts)   /CO [ calculation order ]</text>
  <text x="46" y="110" font-size="11" font-family="Courier New, monospace" fill="#333">/SigFlags 3   /NeedAppearances (deprecated in PDF 2.0)   /XFA (deprecated in PDF 2.0)</text>

  <path d="M240 126 V150" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#af-arrow)"/>
  <text x="252" y="143" font-size="11" fill="#555">/Fields entry</text>

  <!-- Field -->
  <rect x="30" y="152" width="420" height="190" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="46" y="174" font-size="13" font-weight="700" fill="#1f5fa6">Field: the logical value (what the form data holds)</text>
  <text x="46" y="196" font-size="11" font-family="Courier New, monospace" fill="#333">/FT /Btn          type: /Tx /Btn /Ch /Sig</text>
  <text x="46" y="214" font-size="11" font-family="Courier New, monospace" fill="#333">/T (plan)         partial name, the full name joins parents</text>
  <text x="46" y="232" font-size="11" font-family="Courier New, monospace" fill="#333">/Ff 32768         flags: Radio, Required, Multiline ...</text>
  <text x="46" y="250" font-size="11" font-family="Courier New, monospace" fill="#333">/V /monthly       the value, one per field</text>
  <text x="46" y="268" font-size="11" font-family="Courier New, monospace" fill="#333">/TU (Plan)        tooltip, read by assistive technology</text>
  <text x="46" y="286" font-size="11" font-family="Courier New, monospace" fill="#333">/AA ...           format, keystroke, validate, calculate</text>
  <text x="46" y="304" font-size="11" font-family="Courier New, monospace" fill="#333">/Kids [ w1 w2 ]   the widgets that show this field</text>
  <text x="46" y="328" font-size="11" fill="#1f5fa6">Fields with children are non-terminal; a terminal field has widgets.</text>

  <!-- Widgets -->
  <rect x="500" y="152" width="370" height="86" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="514" y="172" font-size="13" font-weight="700" fill="#2b7a2b">Widget 1: annotation on page 1</text>
  <text x="514" y="192" font-size="11" font-family="Courier New, monospace" fill="#333">/Subtype /Widget  /Rect [250 438 266 454]</text>
  <text x="514" y="210" font-size="11" font-family="Courier New, monospace" fill="#333">/P (page)  /Parent (field)  /F (annotation flags)</text>
  <text x="514" y="228" font-size="11" font-family="Courier New, monospace" fill="#333">/AS /monthly  /MK (border, caption, optional)</text>

  <rect x="500" y="256" width="370" height="86" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="514" y="276" font-size="13" font-weight="700" fill="#2b7a2b">Widget 2: same page or another page</text>
  <text x="514" y="296" font-size="11" font-family="Courier New, monospace" fill="#333">/Subtype /Widget  /Rect [330 438 346 454]</text>
  <text x="514" y="314" font-size="11" font-family="Courier New, monospace" fill="#333">/P (page)  /Parent (field)  /F (annotation flags)</text>
  <text x="514" y="332" font-size="11" font-family="Courier New, monospace" fill="#333">/AS /Off  /MK (border, caption, optional)</text>

  <path d="M450 195 H498" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#af-arrow)"/>
  <path d="M450 299 H498" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#af-arrow)"/>
  <text x="474" y="187" text-anchor="middle" font-size="10" fill="#555">/Kids</text>

  <!-- Appearances -->
  <path d="M685 342 V358 H548 V372" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#af-arrow)"/>
  <path d="M685 358 H777 V372" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#af-arrow)"/>
  <text x="696" y="354" font-size="11" fill="#555">/AP of each widget</text>

  <rect x="440" y="374" width="215" height="132" rx="8" fill="#f3e8ff" stroke="#6b3fa0" stroke-width="1.6"/>
  <text x="452" y="394" font-size="13" font-weight="700" fill="#6b3fa0">Widget 1 /AP /N</text>
  <text x="452" y="414" font-size="11" font-family="Courier New, monospace" fill="#333">&lt;&lt; /Off  stream</text>
  <text x="452" y="430" font-size="11" font-family="Courier New, monospace" fill="#333">   /monthly  stream &gt;&gt;</text>
  <text x="452" y="452" font-size="11" fill="#6b3fa0">/AS picks the state shown</text>
  <text x="452" y="468" font-size="11" fill="#6b3fa0">/D (down) and /R (rollover)</text>
  <text x="452" y="484" font-size="11" fill="#6b3fa0">are optional extras</text>

  <rect x="685" y="374" width="185" height="132" rx="8" fill="#f3e8ff" stroke="#6b3fa0" stroke-width="1.6"/>
  <text x="697" y="394" font-size="13" font-weight="700" fill="#6b3fa0">Widget 2 /AP /N</text>
  <text x="697" y="414" font-size="11" font-family="Courier New, monospace" fill="#333">&lt;&lt; /Off  stream</text>
  <text x="697" y="430" font-size="11" font-family="Courier New, monospace" fill="#333">   /yearly   stream &gt;&gt;</text>
  <text x="697" y="452" font-size="11" fill="#6b3fa0">Text, choice and push</text>
  <text x="697" y="468" font-size="11" fill="#6b3fa0">fields: /N is a single</text>
  <text x="697" y="484" font-size="11" fill="#6b3fa0">stream, no states</text>

  <!-- Legend / notes -->
  <rect x="30" y="374" width="390" height="132" rx="8" fill="#f5f5f5" stroke="#777" stroke-width="1.2"/>
  <text x="44" y="394" font-size="13" font-weight="700" fill="#333">How to read it</text>
  <text x="44" y="414" font-size="11" fill="#333">Name and value live on the field, once.</text>
  <text x="44" y="432" font-size="11" fill="#333">Position, page and look live on each widget.</text>
  <text x="44" y="450" font-size="11" fill="#333">A radio group is one field with a widget per choice;</text>
  <text x="44" y="468" font-size="11" fill="#333">a field repeated on two pages is one field, two widgets.</text>
  <text x="44" y="490" font-size="11" fill="#333">Viewers draw the /AP stream; they do not render /V.</text>
  <text x="450" y="534" text-anchor="middle" font-size="11" fill="#555">Keys shown are the ones used by the Bookshelf onboarding form; PDF 32000-2 section 12.7 lists them all.</text>
</svg>
