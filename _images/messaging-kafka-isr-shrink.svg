<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The ISR shrinking below min.insync.replicas</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">partition "orders-2", replication factor 3, min.insync.replicas = 2</text>

  <!-- Before panel -->
  <rect x="20" y="66" width="300" height="300" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="170" y="88" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Before: healthy ISR (size 3)</text>

  <rect x="45" y="104" width="250" height="52" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="170" y="126" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Broker 1 -- Leader</text>
  <text x="170" y="142" font-size="9.5" fill="#333333" text-anchor="middle">in ISR</text>

  <rect x="45" y="168" width="250" height="52" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="170" y="190" font-size="11.5" fill="#2d6a34" text-anchor="middle">Broker 2 -- Follower</text>
  <text x="170" y="206" font-size="9.5" fill="#333333" text-anchor="middle">in ISR</text>

  <rect x="45" y="232" width="250" height="52" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="170" y="254" font-size="11.5" fill="#2d6a34" text-anchor="middle">Broker 3 -- Follower</text>
  <text x="170" y="270" font-size="9.5" fill="#333333" text-anchor="middle">in ISR</text>

  <rect x="45" y="300" width="250" height="46" fill="#e4f3e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="170" y="320" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">acks=all write: ISR size 3 &gt;= 2</text>
  <text x="170" y="335" font-size="10" fill="#2d6a34" text-anchor="middle">accepted</text>

  <!-- Arrow between panels -->
  <line x1="330" y1="216" x2="370" y2="216" stroke="#555555" stroke-width="1.6" marker-end="url(#arrowMid)"/>
  <text x="350" y="204" font-size="9.5" fill="#555555" text-anchor="middle">2 followers</text>
  <text x="350" y="234" font-size="9.5" fill="#555555" text-anchor="middle">fall behind</text>

  <!-- After panel -->
  <rect x="380" y="66" width="300" height="300" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="530" y="88" font-size="12.5" font-weight="bold" fill="#a33333" text-anchor="middle">After: shrunk ISR (size 1)</text>

  <rect x="405" y="104" width="250" height="52" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="530" y="126" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Broker 1 -- Leader</text>
  <text x="530" y="142" font-size="9.5" fill="#2d6a34" text-anchor="middle">still in ISR</text>

  <rect x="405" y="168" width="250" height="52" fill="#f5f5f5" stroke="#999999" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="530" y="190" font-size="11.5" fill="#888888" text-anchor="middle">Broker 2 -- Follower</text>
  <text x="530" y="206" font-size="9.5" fill="#a33333" text-anchor="middle">dropped from ISR (behind)</text>

  <rect x="405" y="232" width="250" height="52" fill="#f5f5f5" stroke="#999999" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="530" y="254" font-size="11.5" fill="#888888" text-anchor="middle">Broker 3 -- Follower</text>
  <text x="530" y="270" font-size="9.5" fill="#a33333" text-anchor="middle">dropped from ISR (down)</text>

  <rect x="405" y="300" width="250" height="46" fill="#f8dede" stroke="#a33333" stroke-width="1.2"/>
  <text x="530" y="320" font-size="10.5" font-weight="bold" fill="#a33333" text-anchor="middle">acks=all write: ISR size 1 &lt; 2</text>
  <text x="530" y="335" font-size="10" fill="#a33333" text-anchor="middle">rejected -- NotEnoughReplicasException</text>

  <defs>
    <marker id="arrowMid" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="30" y="376" font-size="10.5" fill="#666666">Losing 2 of 3 replicas from the ISR does not lose data by itself -- the broker refuses the write outright,</text>
  <text x="30" y="392" font-size="10.5" fill="#666666">rather than accept it with only 1 durable copy, until enough followers catch back up to satisfy min.insync.replicas.</text>
</svg>
