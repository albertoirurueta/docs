<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-tex-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">GPU memory of one 2048 x 2048 texture with a full mip chain</text>
<text x="20" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">RGBA8, uncompressed</text>
<text x="20" y="94" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">PNG or JPEG after decoding</text>
<rect x="230" y="62" width="405.27" height="36" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="645.27" y="85" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">21.3 MiB</text>
<text x="20" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">BC7 or ASTC 4x4</text>
<text x="20" y="160" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">8 bits per pixel, UASTC</text>
<rect x="230" y="128" width="101.27" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="341.27" y="151" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">5.3 MiB</text>
<text x="20" y="208" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">BC1 or ETC2 RGB</text>
<text x="20" y="226" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">4 bits per pixel, ETC1S</text>
<rect x="230" y="194" width="50.73" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.73" y="217" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">2.7 MiB</text>
<text x="20" y="274" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">ASTC 8x8</text>
<text x="20" y="292" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">2 bits per pixel</text>
<rect x="230" y="260" width="25.270000000000003" height="36" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="265.27" y="283" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">1.3 MiB</text>
<line x1="230" y1="50" x2="230" y2="330" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">size on disk is irrelevant here: every format must fit in VRAM, and mip levels add one third</text>
<text x="380" y="368" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">KTX2 keeps the compressed block data on the GPU; PNG is expanded to RGBA8 first</text>
</svg>
