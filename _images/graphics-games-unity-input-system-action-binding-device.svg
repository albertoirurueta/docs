<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-in-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From a device to your code: control, binding, action, callback</text>
<rect x="20" y="60" width="150" height="120" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="92.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Devices</text>
<text x="95.0" y="108.0" text-anchor="middle" font-size="12" fill="#374151">Keyboard</text>
<text x="95.0" y="124.0" text-anchor="middle" font-size="12" fill="#374151">Gamepad</text>
<text x="95.0" y="140.0" text-anchor="middle" font-size="12" fill="#374151">Touchscreen</text>
<text x="95.0" y="156.0" text-anchor="middle" font-size="12" fill="#374151">Mouse</text>
<rect x="200" y="60" width="150" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="101.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730A3">Controls (paths)</text>
<text x="275.0" y="116.0" text-anchor="middle" font-size="11" fill="#3730A3">&lt;Keyboard&gt;/w</text>
<text x="275.0" y="131.0" text-anchor="middle" font-size="11" fill="#3730A3">&lt;Gamepad&gt;/leftStick</text>
<text x="275.0" y="146.0" text-anchor="middle" font-size="11" fill="#3730A3">&lt;Pointer&gt;/press</text>
<rect x="380" y="60" width="160" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="460.0" y="100.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Bindings</text>
<text x="460.0" y="116.0" text-anchor="middle" font-size="12" fill="#92400E">Binding: path +</text>
<text x="460.0" y="132.0" text-anchor="middle" font-size="12" fill="#92400E">interactions +</text>
<text x="460.0" y="148.0" text-anchor="middle" font-size="12" fill="#92400E">processors</text>
<rect x="570" y="60" width="170" height="120" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="655.0" y="101.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Action map: Player</text>
<text x="655.0" y="116.0" text-anchor="middle" font-size="11" fill="#1F2937">Move  (Value, Vector2)</text>
<text x="655.0" y="131.0" text-anchor="middle" font-size="11" fill="#1F2937">Grab  (Button)</text>
<text x="655.0" y="146.0" text-anchor="middle" font-size="11" fill="#1F2937">Pause (Button)</text>
<line x1="170" y1="120" x2="200" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-chain)"/>
<line x1="350" y1="120" x2="380" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-chain)"/>
<line x1="540" y1="120" x2="570" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-chain)"/>
<rect x="380" y="230" width="360" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="560.0" y="253.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Your code reads or subscribes</text>
<text x="560.0" y="268.5" text-anchor="middle" font-size="11" fill="#374151">ReadValue&lt;Vector2&gt;(), IsPressed(),</text>
<text x="560.0" y="283.5" text-anchor="middle" font-size="11" fill="#374151">WasPressedThisFrame()  or  started / performed / canceled</text>
<line x1="655" y1="180" x2="655" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-chain)"/>
<rect x="20" y="230" width="330" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="185.0" y="253.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Control schemes</text>
<text x="185.0" y="268.5" text-anchor="middle" font-size="11" fill="#374151">Control scheme: Keyboard&amp;Mouse, Gamepad, Touch</text>
<text x="185.0" y="283.5" text-anchor="middle" font-size="11" fill="#374151">decides which bindings are active for a player</text>
<line x1="350" y1="265" x2="380" y2="265" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="325" width="720" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="354.5" text-anchor="middle" font-size="11" fill="#3730A3">Project-wide actions: InputSystem.actions.FindAction("Move") returns the asset assigned in Project Settings &gt; Input System Package.</text>
<text x="380" y="393" text-anchor="middle" font-size="10" fill="#374151">An action is a name your game understands; the binding says which physical control triggers it.</text>
</svg>
