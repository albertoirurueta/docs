<text x="20" y="412" font-size="12" fill="#444444">Scala 2.13 libraries are consumed by every Scala 3 version. The 2.13 compiler reads Scala 3 libraries only</text>
<text x="20" y="430" font-size="12" fill="#444444">through its TASTy reader, and in these runs only the 3.3 LTS library was readable.</text>
<text x="20" y="448" font-size="12" fill="#444444">A TASTy error means the consumer is older than the producer: the compiler stops and asks for a newer Scala version.</text>
