<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How a web pixel receives events and where consent gates them</title>
  <desc>Customer events flow from the storefront, checkout and account pages into Shopify's pixel manager, which compares the pixel's declared privacy purposes with the visitor's consent, and only then runs the callbacks inside a strict web worker sandbox that may call a collector endpoint with fetch. Two lanes below show consent-required regions, where events are held and replayed, and opt-out regions, where events flow until the visitor opts out.</desc>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">Web pixel event path and consent gate</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">The pixel never reads the page: it receives published events inside a sandbox, after consent allows it</text>

  <g font-size="12.5" fill="#1f2933" text-anchor="middle">
    <rect x="20" y="70" width="170" height="130" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="105" y="94" font-weight="bold">Surfaces</text>
    <text x="105" y="116" font-size="11.5">storefront</text>
    <text x="105" y="133" font-size="11.5">checkout, thank you</text>
    <text x="105" y="150" font-size="11.5">customer accounts</text>
    <text x="105" y="167" font-size="11.5">order status</text>
    <text x="105" y="187" font-size="11" font-family="Courier New, monospace">page_viewed ...</text>

    <rect x="230" y="70" width="170" height="130" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="315" y="94" font-weight="bold">Event bus</text>
    <text x="315" y="116" font-size="11.5">standard events</text>
    <text x="315" y="133" font-size="11.5">custom events</text>
    <text x="315" y="150" font-size="11.5">DOM events</text>
    <text x="315" y="170" font-size="11" font-family="Courier New, monospace">Shopify.analytics.publish</text>

    <rect x="440" y="70" width="210" height="130" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
    <text x="545" y="94" font-weight="bold">Pixel manager: consent gate</text>
    <text x="545" y="116" font-size="11.5">pixel declares in the toml:</text>
    <text x="545" y="133" font-size="11" font-family="Courier New, monospace">[customer_privacy]</text>
    <text x="545" y="148" font-size="11" font-family="Courier New, monospace">analytics marketing</text>
    <text x="545" y="163" font-size="11" font-family="Courier New, monospace">preferences sale_of_data</text>
    <text x="545" y="185" font-size="11.5">loads only if every one is allowed</text>

    <rect x="690" y="70" width="250" height="130" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="815" y="94" font-weight="bold">Strict sandbox (web worker)</text>
    <text x="815" y="116" font-size="11" font-family="Courier New, monospace">register(({analytics, init,</text>
    <text x="815" y="131" font-size="11" font-family="Courier New, monospace">settings, browser}) =&gt; ...)</text>
    <text x="815" y="152" font-size="11.5">no DOM, no window, no document</text>
    <text x="815" y="169" font-size="11.5">fetch with keepalive, CORS needed</text>
    <text x="815" y="186" font-size="11.5">console, timers, self</text>
  </g>
  <g stroke="#7b8794" stroke-width="2" fill="#7b8794">
    <line x1="192" y1="135" x2="220" y2="135"/><polygon points="230,135 218,129 218,141" stroke="none"/>
    <line x1="402" y1="135" x2="430" y2="135"/><polygon points="440,135 428,129 428,141" stroke="none"/>
    <line x1="652" y1="135" x2="680" y2="135"/><polygon points="690,135 678,129 678,141" stroke="none"/>
  </g>
  <line x1="815" y1="202" x2="815" y2="236" stroke="#7b8794" stroke-width="2"/>
  <polygon points="815,246 809,234 821,234" fill="#7b8794"/>
  <rect x="690" y="248" width="250" height="40" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="815" y="272" font-size="12.5" fill="#1f2933" text-anchor="middle">Collector endpoint (your server)</text>

  <!-- Lanes -->
  <text x="20" y="318" font-size="13" font-weight="bold" fill="#7b8794">Two consent behaviours, chosen by the merchant's privacy settings per region</text>

  <rect x="20" y="330" width="920" height="92" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="34" y="352" font-size="12.5" font-weight="bold" fill="#1f2933">Consent required (for example EU, UK)</text>
  <line x1="60" y1="395" x2="900" y2="395" stroke="#7b8794" stroke-width="2"/>
  <g font-size="11.5" fill="#1f2933" text-anchor="middle">
    <circle cx="130" cy="395" r="5" fill="#b4690e"/><text x="130" y="382">page_viewed</text><text x="130" y="415">held</text>
    <circle cx="260" cy="395" r="5" fill="#b4690e"/><text x="260" y="382">product_viewed</text><text x="260" y="415">held</text>
    <rect x="360" y="380" width="240" height="30" rx="6" fill="#fdf0d9" stroke="#b4690e"/>
    <text x="480" y="400" font-weight="bold">visitor accepts: consent collected</text>
    <circle cx="660" cy="395" r="5" fill="#1f8a5b"/><text x="660" y="382">callbacks run</text><text x="660" y="415">earlier events replayed</text>
    <circle cx="820" cy="395" r="5" fill="#1f8a5b"/><text x="820" y="382">next events</text><text x="820" y="415">delivered live</text>
  </g>

  <rect x="20" y="434" width="920" height="92" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="34" y="456" font-size="12.5" font-weight="bold" fill="#1f2933">Tracking on by default, visitor can opt out (for example US data sale rules)</text>
  <line x1="60" y1="499" x2="900" y2="499" stroke="#7b8794" stroke-width="2"/>
  <g font-size="11.5" fill="#1f2933" text-anchor="middle">
    <circle cx="130" cy="499" r="5" fill="#1f8a5b"/><text x="130" y="486">page_viewed</text><text x="130" y="519">delivered</text>
    <circle cx="260" cy="499" r="5" fill="#1f8a5b"/><text x="260" y="486">product_viewed</text><text x="260" y="519">delivered</text>
    <rect x="395" y="484" width="170" height="30" rx="6" fill="#fdf0d9" stroke="#b4690e"/>
    <text x="480" y="504" font-weight="bold">visitor opts out</text>
    <circle cx="660" cy="499" r="5" fill="#b4690e"/><text x="660" y="486">checkout_started</text><text x="660" y="519">not delivered</text>
    <circle cx="820" cy="499" r="5" fill="#b4690e"/><text x="820" y="486">all later events</text><text x="820" y="519">not delivered</text>
  </g>
</svg>
