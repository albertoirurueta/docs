<svg viewBox="0 0 900 460" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf serverless pieces: notifier (SQS) and thumbnailer (S3)</text>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a58"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- Lane 1 notifier -->
  <rect x="20" y="46" width="860" height="190" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="36" y="68" font-size="13" font-weight="700" fill="#3c4a58">Notifier path (poll-based, at least once)</text>

  <rect x="36" y="100" width="120" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="96" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">orders-api</text>
  <text x="96" y="142" text-anchor="middle" font-size="10.5" fill="#3c4a58">SendMessage</text>

  <rect x="206" y="100" width="130" height="56" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="271" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">notifier-queue</text>
  <text x="271" y="142" text-anchor="middle" font-size="10.5" fill="#3c4a58">SQS standard</text>

  <rect x="386" y="100" width="130" height="56" rx="6" fill="#f0f0f0" stroke="#5c6b7a"/>
  <text x="451" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Event source</text>
  <text x="451" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">mapping</text>

  <rect x="566" y="100" width="130" height="56" rx="6" fill="#e9f7ee" stroke="#2d7a46"/>
  <text x="631" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">notifier</text>
  <text x="631" y="142" text-anchor="middle" font-size="10.5" fill="#3c4a58">Java 25, arm64</text>

  <rect x="746" y="100" width="120" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="806" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">SES v2</text>
  <text x="806" y="142" text-anchor="middle" font-size="10.5" fill="#3c4a58">SendEmail</text>

  <line x1="156" y1="128" x2="204" y2="128" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="336" y1="128" x2="384" y2="128" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="516" y1="128" x2="564" y2="128" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="696" y1="128" x2="744" y2="128" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#3c4a58">batch</text>
  <text x="540" y="120" text-anchor="middle" font-size="10" fill="#3c4a58">invoke</text>

  <rect x="206" y="186" width="130" height="38" rx="6" fill="#fdecea" stroke="#b3261e"/>
  <text x="271" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">notifier-dlq</text>
  <line x1="271" y1="156" x2="271" y2="184" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ahr)"/>
  <text x="281" y="174" font-size="10" fill="#b3261e">after maxReceiveCount</text>
  <text x="520" y="206" font-size="10.5" fill="#3c4a58">returns batchItemFailures; only those messages reappear</text>
  <path d="M631,156 L631,196 L520,196" fill="none" stroke="#3c4a58" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ah)"/>

  <!-- Lane 2 thumbnailer -->
  <rect x="20" y="256" width="860" height="190" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="36" y="278" font-size="13" font-weight="700" fill="#3c4a58">Thumbnailer path (asynchronous, retried by Lambda)</text>

  <rect x="36" y="310" width="120" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="96" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Upload</text>
  <text x="96" y="352" text-anchor="middle" font-size="10.5" fill="#3c4a58">presigned PUT</text>

  <rect x="206" y="310" width="150" height="56" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="281" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">bookshelf-uploads</text>
  <text x="281" y="352" text-anchor="middle" font-size="10.5" fill="#3c4a58">prefix originals/</text>

  <rect x="406" y="310" width="130" height="56" rx="6" fill="#f0f0f0" stroke="#5c6b7a"/>
  <text x="471" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">S3 event</text>
  <text x="471" y="352" text-anchor="middle" font-size="10.5" fill="#3c4a58">ObjectCreated</text>

  <rect x="586" y="310" width="130" height="56" rx="6" fill="#e9f7ee" stroke="#2d7a46"/>
  <text x="651" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">thumbnailer</text>
  <text x="651" y="352" text-anchor="middle" font-size="10.5" fill="#3c4a58">Java 25, arm64</text>

  <rect x="746" y="310" width="120" height="56" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="806" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">thumbnails/</text>
  <text x="806" y="352" text-anchor="middle" font-size="10.5" fill="#3c4a58">same bucket, other prefix</text>

  <line x1="156" y1="338" x2="204" y2="338" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="356" y1="338" x2="404" y2="338" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="536" y1="338" x2="584" y2="338" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="716" y1="338" x2="744" y2="338" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="586" y="396" width="130" height="38" rx="6" fill="#fdecea" stroke="#b3261e"/>
  <text x="651" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">failure queue</text>
  <line x1="651" y1="366" x2="651" y2="394" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ahr)"/>
  <text x="661" y="384" font-size="10" fill="#b3261e">OnFailure destination</text>
  <text x="380" y="420" font-size="10.5" fill="#3c4a58">Prefixes differ so the function never triggers itself</text>
</svg>
