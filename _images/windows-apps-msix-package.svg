<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Inside the Bookshelf Desktop MSIX package</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">A .msix file is a signed ZIP-based container: payload files plus footprint files. Colours match the labels.</text>

  <rect x="20" y="62" width="720" height="440" rx="10" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="40" y="88" font-size="14" font-weight="bold" fill="#1c4b73">BookshelfDesktop_1.4.0.0_x64.msix</text>

  <!-- Footprint files -->
  <rect x="40" y="104" width="330" height="378" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="205" y="128" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Footprint files (package metadata)</text>

  <rect x="56" y="142" width="298" height="74" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="70" y="163" font-size="13" font-weight="bold" fill="#222222">AppxManifest.xml</text>
  <text x="70" y="182" font-size="12" fill="#444444">Identity (Name, Publisher, Version), dependencies,</text>
  <text x="70" y="198" font-size="12" fill="#444444">capabilities, visual elements, extensions.</text>
  <text x="70" y="211" font-size="11" fill="#666666">Built from Package.appxmanifest in the project.</text>

  <rect x="56" y="226" width="298" height="62" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="70" y="247" font-size="13" font-weight="bold" fill="#222222">AppxBlockMap.xml</text>
  <text x="70" y="266" font-size="12" fill="#444444">Hash of every 64 KB block of every file.</text>
  <text x="70" y="280" font-size="12" fill="#444444">Drives differential updates and integrity checks.</text>

  <rect x="56" y="298" width="298" height="62" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.5"/>
  <text x="70" y="319" font-size="13" font-weight="bold" fill="#9a6200">AppxSignature.p7x</text>
  <text x="70" y="338" font-size="12" fill="#444444">The signature. Its certificate Subject must equal</text>
  <text x="70" y="352" font-size="12" fill="#444444">the manifest Identity Publisher. Required to install.</text>

  <rect x="56" y="370" width="298" height="46" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="70" y="391" font-size="13" font-weight="bold" fill="#222222">[Content_Types].xml</text>
  <text x="70" y="406" font-size="12" fill="#444444">Media types of the parts in the ZIP container.</text>

  <rect x="56" y="426" width="298" height="42" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="70" y="445" font-size="12" fill="#444444">Optional: content-group map, code-integrity</text>
  <text x="70" y="460" font-size="12" fill="#444444">catalog (only when the feature is used).</text>

  <!-- Payload files -->
  <rect x="390" y="104" width="334" height="270" rx="8" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="557" y="128" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Payload files (the app)</text>
  <text x="408" y="154" font-size="12" fill="#222222">Bookshelf.Desktop.exe</text>
  <text x="408" y="174" font-size="12" fill="#222222">Bookshelf.Desktop.dll, Bookshelf.Core.dll</text>
  <text x="408" y="194" font-size="12" fill="#222222">Microsoft.EntityFrameworkCore*.dll, SQLite native</text>
  <text x="408" y="214" font-size="12" fill="#222222">Assets\ Square44x44Logo.png, Square150x150Logo.png,</text>
  <text x="408" y="230" font-size="12" fill="#222222">    StoreLogo.png, SplashScreen.png</text>
  <text x="408" y="250" font-size="12" fill="#222222">en-us\ and es\ resource folders (.resw / satellites)</text>
  <text x="408" y="270" font-size="12" fill="#222222">appsettings.json, other content files</text>
  <text x="408" y="296" font-size="12" fill="#444444">Installed read-only under C:\Program Files\WindowsApps.</text>
  <text x="408" y="312" font-size="12" fill="#444444">A self-contained build also carries the .NET runtime;</text>
  <text x="408" y="328" font-size="12" fill="#444444">a framework-dependent one declares a dependency instead.</text>
  <text x="408" y="354" font-size="12" fill="#444444">Each file is hashed in AppxBlockMap.xml.</text>

  <!-- What Windows does -->
  <rect x="390" y="386" width="334" height="96" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="407" y="408" font-size="13" font-weight="bold" fill="#222222">What Windows does with it</text>
  <text x="407" y="428" font-size="12" fill="#444444">1. Verify signature and publisher match.</text>
  <text x="407" y="445" font-size="12" fill="#444444">2. Stage files, register the package identity.</text>
  <text x="407" y="462" font-size="12" fill="#444444">3. On uninstall, remove everything it registered.</text>
</svg>
