<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Closed versus open workload model during a 10 second server stall</title>
<desc id="d">Four small charts over a 60 second run with a server stall between 20 and 30 seconds. Top row, closed model with 4 threads: the request rate falls from 20 per second to almost zero during the stall while concurrency stays at 4. Bottom row, open model at 20 arrivals per second: the request rate stays at 20 per second while concurrency climbs to about 200 requests in flight, then drains when the server recovers.</desc>
<text x="30" y="38" font-size="15" font-weight="bold">Closed model: Thread Group, 4 threads, no think time</text>
<rect x="180" y="80" width="50" height="150" fill="#ef4444" opacity=".15"/>
<text x="205" y="92" text-anchor="middle" font-size="10" fill="#ef4444">stall</text>
<line x1="80" y1="80" x2="80" y2="230" stroke="currentColor"/><line x1="80" y1="230" x2="380" y2="230" stroke="currentColor"/>
<text x="80" y="244" text-anchor="middle" font-size="10">0</text>
<text x="180" y="244" text-anchor="middle" font-size="10">20</text>
<text x="230" y="244" text-anchor="middle" font-size="10">30</text>
<text x="380" y="244" text-anchor="middle" font-size="10">60</text>
<text x="230" y="260" text-anchor="middle" font-size="11">Time (s)</text>
<text x="230" y="68" text-anchor="middle" font-size="12" font-weight="bold">Requests sent per second</text>
<text transform="translate(42,155.0) rotate(-90)" text-anchor="middle" font-size="11">req/s</text>
<text x="74" y="234" text-anchor="end" font-size="10">0</text>
<text x="74" y="174" text-anchor="end" font-size="10">10</text>
<text x="74" y="114" text-anchor="end" font-size="10">20</text>
<polyline points="80.0,110.0 180.0,110.0 182.5,227.6 227.5,227.6 230.0,110.0 380.0,110.0" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/>
<text x="380" y="276" text-anchor="end" font-size="11" opacity=".85">rate collapses: only 4 slow samples recorded</text>
<rect x="560" y="80" width="50" height="150" fill="#ef4444" opacity=".15"/>
<text x="585" y="92" text-anchor="middle" font-size="10" fill="#ef4444">stall</text>
<line x1="460" y1="80" x2="460" y2="230" stroke="currentColor"/><line x1="460" y1="230" x2="760" y2="230" stroke="currentColor"/>
<text x="460" y="244" text-anchor="middle" font-size="10">0</text>
<text x="560" y="244" text-anchor="middle" font-size="10">20</text>
<text x="610" y="244" text-anchor="middle" font-size="10">30</text>
<text x="760" y="244" text-anchor="middle" font-size="10">60</text>
<text x="610" y="260" text-anchor="middle" font-size="11">Time (s)</text>
<text x="610" y="68" text-anchor="middle" font-size="12" font-weight="bold">Concurrent requests (in flight)</text>
<text transform="translate(422,155.0) rotate(-90)" text-anchor="middle" font-size="11">requests</text>
<text x="454" y="234" text-anchor="end" font-size="10">0</text>
<text x="454" y="166" text-anchor="end" font-size="10">100</text>
<text x="454" y="98" text-anchor="end" font-size="10">200</text>
<polyline points="460.0,227.3 760.0,227.3" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
<text x="760" y="276" text-anchor="end" font-size="11" opacity=".85">fixed at 4: the load generator waits</text>
<text x="30" y="328" font-size="15" font-weight="bold">Open model: Open Model Thread Group, rate(20/sec)</text>
<rect x="180" y="370" width="50" height="150" fill="#ef4444" opacity=".15"/>
<text x="205" y="382" text-anchor="middle" font-size="10" fill="#ef4444">stall</text>
<line x1="80" y1="370" x2="80" y2="520" stroke="currentColor"/><line x1="80" y1="520" x2="380" y2="520" stroke="currentColor"/>
<text x="80" y="534" text-anchor="middle" font-size="10">0</text>
<text x="180" y="534" text-anchor="middle" font-size="10">20</text>
<text x="230" y="534" text-anchor="middle" font-size="10">30</text>
<text x="380" y="534" text-anchor="middle" font-size="10">60</text>
<text x="230" y="550" text-anchor="middle" font-size="11">Time (s)</text>
<text x="230" y="358" text-anchor="middle" font-size="12" font-weight="bold">Requests sent per second</text>
<text transform="translate(42,445.0) rotate(-90)" text-anchor="middle" font-size="11">req/s</text>
<text x="74" y="524" text-anchor="end" font-size="10">0</text>
<text x="74" y="464" text-anchor="end" font-size="10">10</text>
<text x="74" y="404" text-anchor="end" font-size="10">20</text>
<polyline points="80.0,400.0 380.0,400.0" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/>
<text x="380" y="566" text-anchor="end" font-size="11" opacity=".85">arrivals keep coming: 200 delayed samples</text>
<rect x="560" y="370" width="50" height="150" fill="#ef4444" opacity=".15"/>
<text x="585" y="382" text-anchor="middle" font-size="10" fill="#ef4444">stall</text>
<line x1="460" y1="370" x2="460" y2="520" stroke="currentColor"/><line x1="460" y1="520" x2="760" y2="520" stroke="currentColor"/>
<text x="460" y="534" text-anchor="middle" font-size="10">0</text>
<text x="560" y="534" text-anchor="middle" font-size="10">20</text>
<text x="610" y="534" text-anchor="middle" font-size="10">30</text>
<text x="760" y="534" text-anchor="middle" font-size="10">60</text>
<text x="610" y="550" text-anchor="middle" font-size="11">Time (s)</text>
<text x="610" y="358" text-anchor="middle" font-size="12" font-weight="bold">Concurrent requests (in flight)</text>
<text transform="translate(422,445.0) rotate(-90)" text-anchor="middle" font-size="11">requests</text>
<text x="454" y="524" text-anchor="end" font-size="10">0</text>
<text x="454" y="456" text-anchor="end" font-size="10">100</text>
<text x="454" y="388" text-anchor="end" font-size="10">200</text>
<polyline points="460.0,517.3 560.0,517.3 610.0,383.6 620.0,517.3 760.0,517.3" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
<text x="760" y="566" text-anchor="end" font-size="11" opacity=".85">backlog grows to about 200, then drains</text>
<text x="30" y="590" font-size="11" opacity=".85">Assumes a 0.2 s response time outside the stall and a 10 s stall from t = 20 s to t = 30 s. Illustrative numbers, not measurements.</text>
</svg>
