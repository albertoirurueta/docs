<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Double Diamond applied to Bookshelf</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <!-- diamond 1 -->
  <polygon points="40,150 190,70 340,150 190,230" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <line x1="190" y1="70" x2="190" y2="230" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- diamond 2 -->
  <polygon points="400,150 550,70 700,150 550,230" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <line x1="550" y1="70" x2="550" y2="230" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="340" y1="150" x2="400" y2="150" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="115" y="154" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Discover</text>
  <text x="265" y="154" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Define</text>
  <text x="475" y="154" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Develop</text>
  <text x="625" y="154" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Deliver</text>
  <text x="115" y="60" font-size="12" fill="#374151" text-anchor="middle">diverge: explore the problem</text>
  <text x="265" y="60" font-size="12" fill="#374151" text-anchor="middle">converge: frame it</text>
  <text x="475" y="60" font-size="12" fill="#374151" text-anchor="middle">diverge: explore solutions</text>
  <text x="625" y="60" font-size="12" fill="#374151" text-anchor="middle">converge: test and refine</text>
  <text x="190" y="256" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Problem space</text>
  <text x="550" y="256" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Solution space</text>
  <!-- outputs -->
  <rect x="40" y="276" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="115" y="296" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Bookshelf: Discover</text>
  <text x="115" y="316" font-size="11" fill="#374151" text-anchor="middle">interviews with book clubs,</text>
  <text x="115" y="332" font-size="11" fill="#374151" text-anchor="middle">stickies on a FigJam board</text>
  <rect x="200" y="276" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="275" y="296" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Define</text>
  <text x="275" y="316" font-size="11" fill="#374151" text-anchor="middle">persona Lena, one problem</text>
  <text x="275" y="332" font-size="11" fill="#374151" text-anchor="middle">statement, the golden path</text>
  <rect x="410" y="276" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="485" y="296" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Develop</text>
  <text x="485" y="316" font-size="11" fill="#374151" text-anchor="middle">sketches, wireframes,</text>
  <text x="485" y="332" font-size="11" fill="#374151" text-anchor="middle">clickable prototypes</text>
  <rect x="570" y="276" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="645" y="296" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Deliver</text>
  <text x="645" y="316" font-size="11" fill="#374151" text-anchor="middle">usability test, fixes,</text>
  <text x="645" y="332" font-size="11" fill="#374151" text-anchor="middle">handoff to developers</text>
  <circle cx="52" cy="82" r="11" fill="#4F46E5"/><text x="52" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="328" cy="82" r="11" fill="#4F46E5"/><text x="328" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="412" cy="82" r="11" fill="#B45309"/><text x="412" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="688" cy="82" r="11" fill="#B45309"/><text x="688" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
