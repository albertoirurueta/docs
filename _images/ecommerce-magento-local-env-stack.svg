<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">The four-container Docker Compose stack used for Mage-OS</title>
  <desc id="d">A web container with PHP 8.5 and Apache serves port 8093 of the host and mounts the named volume code. It talks to MariaDB 12.3 with the named volume db, OpenSearch 3 with the named volume search and Valkey 9. Each service has a memory cap and a health check, and the web container starts after all three are healthy.</desc>
  <rect x="15" y="150" width="150" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="90" y="180" text-anchor="middle" font-weight="bold">Your browser</text>
  <text x="90" y="200" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">localhost:8093</text>
  <path d="M165 185 L232 185" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="198" y="172" text-anchor="middle" font-size="11">HTTP</text>
  <rect x="235" y="70" width="270" height="230" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="370" y="96" text-anchor="middle" font-size="16" font-weight="bold">web</text>
  <text x="370" y="120" text-anchor="middle" font-size="12.5">php:8.5-apache + extensions</text>
  <text x="370" y="140" text-anchor="middle" font-size="12.5">Composer 2, igbinary</text>
  <text x="370" y="160" text-anchor="middle" font-size="12.5">mod_rewrite, headers, expires</text>
  <text x="370" y="180" text-anchor="middle" font-size="12.5">AllowOverride All on pub/</text>
  <text x="370" y="200" text-anchor="middle" font-size="12.5">memory cap 1536 MB</text>
  <text x="370" y="220" text-anchor="middle" font-size="12.5">measured: about 310 MiB</text>
  <rect x="250" y="252" width="240" height="36" rx="8" fill="#2ecc71" fill-opacity="0.28" stroke="currentColor" stroke-opacity="1" stroke-width="1"/>
  <text x="370" y="275" text-anchor="middle" font-size="12.5" font-family="Menlo, Consolas, monospace">volume code: /var/www/html</text>
  <rect x="640" y="24" width="355" height="92" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="817" y="50" text-anchor="middle" font-size="14" font-weight="bold">db: MariaDB 12.3</text>
  <text x="817" y="74" text-anchor="middle" font-size="12.5">volume db, cap 512 MB</text>
  <text x="817" y="94" text-anchor="middle" font-size="12.5">measured about 182 MiB</text>
  <rect x="640" y="134" width="355" height="92" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="817" y="160" text-anchor="middle" font-size="14" font-weight="bold">search: OpenSearch 3</text>
  <text x="817" y="184" text-anchor="middle" font-size="12.5">volume search, cap 1 GB, heap 512 MB</text>
  <text x="817" y="204" text-anchor="middle" font-size="12.5">measured about 914 MiB</text>
  <rect x="640" y="244" width="355" height="92" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="817" y="270" text-anchor="middle" font-size="14" font-weight="bold">cache: Valkey 9</text>
  <text x="817" y="294" text-anchor="middle" font-size="12.5">db 0 cache, db 1 page cache,</text>
  <text x="817" y="314" text-anchor="middle" font-size="12.5">db 2 sessions; cap 128 MB</text>
  <path d="M505 130 L638 70" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M505 185 L638 180" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M505 245 L638 290" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="588" y="104" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">3306</text>
  <text x="588" y="168" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">9200</text>
  <text x="588" y="268" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">6379</text>
  <rect x="15" y="350" width="980" height="66" rx="10" fill="#7f8c8d" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="376" text-anchor="middle" font-size="13" font-weight="bold">web waits for three healthy services (depends_on with condition: service_healthy)</text>
  <text x="505" y="398" text-anchor="middle" font-size="12.5">health checks: healthcheck.sh for MariaDB, GET /_cluster/health for OpenSearch, valkey-cli ping for Valkey</text>
</svg>
