<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Publication date against change date</text>
  <text x="380" y="48" font-size="12" fill="#4B5563" text-anchor="middle">Amber: the book was published before the change. Green: after it, which does not prove the book covers it.</text>
  <!-- column headers -->
  <g font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">
    <text x="215" y="76">Variables</text><text x="215" y="90" font-weight="normal">2024-04-16</text>
    <text x="299" y="76">Seat model</text><text x="299" y="90" font-weight="normal">2025-03-11</text>
    <text x="383" y="76">UI3 only</text><text x="383" y="90" font-weight="normal">2025-04-30</text>
    <text x="467" y="76">Make GA</text><text x="467" y="90" font-weight="normal">2025-07-24</text>
    <text x="551" y="76">Grid flow</text><text x="551" y="90" font-weight="normal">2026-05-22</text>
    <text x="635" y="76">Motion</text><text x="635" y="90" font-weight="normal">2026-06-24</text>
    <text x="719" y="76">Folders</text><text x="719" y="90" font-weight="normal">2026-08-03</text>
  </g>
  <!-- row labels -->
  <g font-size="13" font-weight="bold" fill="#1F2937">
    <text x="20" y="130">S1, February 2022</text><text x="20" y="190">G, June 2024</text><text x="20" y="250">J, August 2025</text><text x="20" y="310">S3, January 2026</text>
  </g>
  <g font-size="11" fill="#4B5563">
    <text x="20" y="146">Staiano, 1st edition</text><text x="20" y="206">Green and Brandon</text><text x="20" y="266">Design Beyond Limits</text><text x="20" y="326">Staiano, 3rd edition</text>
  </g>
  <!-- row S1: all before -->
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="1.5">
    <rect x="175" y="108" width="80" height="48" rx="8"/><rect x="259" y="108" width="80" height="48" rx="8"/><rect x="343" y="108" width="80" height="48" rx="8"/><rect x="427" y="108" width="80" height="48" rx="8"/><rect x="511" y="108" width="80" height="48" rx="8"/><rect x="595" y="108" width="80" height="48" rx="8"/><rect x="679" y="108" width="80" height="48" rx="8"/>
  </g>
  <!-- row G: variables after (published Jun 2024), rest before -->
  <rect x="175" y="168" width="80" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="1.5">
    <rect x="259" y="168" width="80" height="48" rx="8"/><rect x="343" y="168" width="80" height="48" rx="8"/><rect x="427" y="168" width="80" height="48" rx="8"/><rect x="511" y="168" width="80" height="48" rx="8"/><rect x="595" y="168" width="80" height="48" rx="8"/><rect x="679" y="168" width="80" height="48" rx="8"/>
  </g>
  <!-- row J: Aug 2025: variables, seats, UI3, Make GA after; grid, motion, folders before -->
  <g fill="#D1FAE5" stroke="#047857" stroke-width="1.5">
    <rect x="175" y="228" width="80" height="48" rx="8"/><rect x="259" y="228" width="80" height="48" rx="8"/><rect x="343" y="228" width="80" height="48" rx="8"/><rect x="427" y="228" width="80" height="48" rx="8"/>
  </g>
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="1.5">
    <rect x="511" y="228" width="80" height="48" rx="8"/><rect x="595" y="228" width="80" height="48" rx="8"/><rect x="679" y="228" width="80" height="48" rx="8"/>
  </g>
  <!-- row S3: Jan 2026 -->
  <g fill="#D1FAE5" stroke="#047857" stroke-width="1.5">
    <rect x="175" y="288" width="80" height="48" rx="8"/><rect x="259" y="288" width="80" height="48" rx="8"/><rect x="343" y="288" width="80" height="48" rx="8"/><rect x="427" y="288" width="80" height="48" rx="8"/>
  </g>
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="1.5">
    <rect x="511" y="288" width="80" height="48" rx="8"/><rect x="595" y="288" width="80" height="48" rx="8"/><rect x="679" y="288" width="80" height="48" rx="8"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <g fill="#92400E"><text x="215" y="137">before</text><text x="299" y="137">before</text><text x="383" y="137">before</text><text x="467" y="137">before</text><text x="551" y="137">before</text><text x="635" y="137">before</text><text x="719" y="137">before</text></g>
    <g fill="#047857"><text x="215" y="197">after</text></g>
    <g fill="#92400E"><text x="299" y="197">before</text><text x="383" y="197">before</text><text x="467" y="197">before</text><text x="551" y="197">before</text><text x="635" y="197">before</text><text x="719" y="197">before</text></g>
    <g fill="#047857"><text x="215" y="257">after</text><text x="299" y="257">after</text><text x="383" y="257">after</text><text x="467" y="257">after</text></g>
    <g fill="#92400E"><text x="551" y="257">before</text><text x="635" y="257">before</text><text x="719" y="257">before</text></g>
    <g fill="#047857"><text x="215" y="317">after</text><text x="299" y="317">after</text><text x="383" y="317">after</text><text x="467" y="317">after</text></g>
    <g fill="#92400E"><text x="551" y="317">before</text><text x="635" y="317">before</text><text x="719" y="317">before</text></g>
  </g>
  <text x="380" y="366" font-size="11" fill="#6B7280" text-anchor="middle">Schematic. Book months follow the publisher pages, change dates follow Figma release notes.</text>
</svg>
