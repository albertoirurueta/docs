<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Four kinds of apps and integrations</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Who built it decides who supports it</text>
<rect x="20" y="56" width="171" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><rect x="20" y="56" width="171" height="34" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="105" y="78" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Created by Canva</text><text x="32" y="116" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Support: Canva</text><text x="32" y="140" font-size="11" fill="#374151" text-anchor="start">Examples: apps the Help</text><text x="32" y="155" font-size="11" fill="#374151" text-anchor="start">Center lists as Canva-made</text><rect x="32" y="176" width="147" height="20" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="105" y="190" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Created by: Canva</text><text x="32" y="224" font-size="11" fill="#374151" text-anchor="start">Check App details</text><text x="32" y="239" font-size="11" fill="#374151" text-anchor="start">before trusting it</text><rect x="203" y="56" width="171" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><rect x="203" y="56" width="171" height="34" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="288" y="78" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Third-party app</text><text x="215" y="116" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Support: its developer</text><text x="215" y="140" font-size="11" fill="#374151" text-anchor="start">Examples: image, audio,</text><text x="215" y="155" font-size="11" fill="#374151" text-anchor="start">chart or file-storage apps</text><rect x="215" y="176" width="147" height="20" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="288" y="190" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Created by: other name</text><text x="215" y="224" font-size="11" fill="#374151" text-anchor="start">Read permissions first</text><text x="215" y="239" font-size="11" fill="#374151" text-anchor="start">and privacy details</text><rect x="386" y="56" width="171" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><rect x="386" y="56" width="171" height="34" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="471" y="78" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Private team app</text><text x="398" y="116" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Support: your team</text><text x="398" y="140" font-size="11" fill="#374151" text-anchor="start">Built by a team member,</text><text x="398" y="155" font-size="11" fill="#374151" text-anchor="start">released by owner or admin</text><rect x="398" y="176" width="147" height="20" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="471" y="190" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Private apps tab</text><text x="398" y="224" font-size="11" fill="#374151" text-anchor="start">Never in the public</text><text x="398" y="239" font-size="11" fill="#374151" text-anchor="start">directory</text><rect x="569" y="56" width="171" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><rect x="569" y="56" width="171" height="34" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="654" y="78" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Integration in another tool</text><text x="581" y="116" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Support: that tool + Canva</text><text x="581" y="140" font-size="11" fill="#374151" text-anchor="start">Slack, Microsoft Teams,</text><text x="581" y="155" font-size="11" fill="#374151" text-anchor="start">CI HUB, Salesforce</text><rect x="581" y="176" width="147" height="20" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="654" y="190" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Lives in the other tool</text><text x="581" y="224" font-size="11" fill="#374151" text-anchor="start">Each person connects</text><text x="581" y="239" font-size="11" fill="#374151" text-anchor="start">their own account</text><rect x="20" y="300" width="723" height="50" rx="8" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="380" y="322" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">In an app listing, open More and read "Created by" to know who to ask for help.</text><text x="380" y="340" font-size="11" fill="#374151" text-anchor="middle">Features, permissions and availability change over time and by account, team and language.</text><text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of generic screens, not a screenshot of any product.</text>
</svg>
