<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Design zones of a print page: bleed, trim, danger zone, margin</text>
  <!-- bleed -->
  <rect x="40" y="50" width="380" height="320" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <!-- trim -->
  <rect x="64" y="74" width="332" height="272" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- danger band (between trim and 20 inside) -->
  <rect x="64" y="74" width="332" height="272" fill="none" stroke="#DC2626" stroke-width="14" opacity="0.18"/>
  <!-- margin -->
  <rect x="94" y="104" width="272" height="212" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- content -->
  <rect x="112" y="122" width="150" height="14" rx="3" fill="#4F46E5"/>
  <rect x="112" y="146" width="110" height="9" rx="2" fill="#9CA3AF"/>
  <rect x="112" y="164" width="130" height="9" rx="2" fill="#9CA3AF"/>
  <rect x="280" y="200" width="64" height="96" rx="3" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="112" y="268" width="84" height="26" rx="13" fill="#B45309"/>
  <text x="154" y="285" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Join today</text>
  <!-- crop marks -->
  <g stroke="#1F2937" stroke-width="1.2">
    <path d="M64,66 L64,50"/><path d="M396,66 L396,50"/><path d="M64,354 L64,370"/><path d="M396,354 L396,370"/>
    <path d="M32,74 L48,74"/><path d="M32,346 L48,346"/><path d="M428,74 L444,74"/><path d="M428,346 L444,346"/>
  </g>
  <!-- legend -->
  <g stroke="#4B5563" stroke-width="1.2" fill="none">
    <path d="M440,70 L460,70"/><path d="M440,130 L460,130"/><path d="M440,200 L460,200"/><path d="M440,270 L460,270"/><path d="M440,340 L460,340"/>
  </g>
  <g fill="#B45309"><circle cx="478" cy="70" r="11"/></g>
  <g fill="#1F2937"><circle cx="478" cy="130" r="11"/></g>
  <g fill="#DC2626"><circle cx="478" cy="200" r="11"/></g>
  <g fill="#4F46E5"><circle cx="478" cy="270" r="11"/><circle cx="478" cy="340" r="11"/></g>
  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="478" y="74">1</text><text x="478" y="134">2</text><text x="478" y="204">3</text><text x="478" y="274">4</text><text x="478" y="344">5</text></g>
  <g font-size="13" fill="#1F2937">
    <text x="498" y="66" font-weight="bold">Bleed</text><text x="498" y="82" font-size="12" fill="#374151">Extend backgrounds here; always cut off.</text>
    <text x="498" y="126" font-weight="bold">Trim line</text><text x="498" y="142" font-size="12" fill="#374151">Where the sheet is cut after printing.</text>
    <text x="498" y="196" font-weight="bold">Danger zone (red)</text><text x="498" y="212" font-size="12" fill="#374151">Close enough to the trim to be cut,</text><text x="498" y="228" font-size="12" fill="#374151">even inside the margin.</text>
    <text x="498" y="266" font-weight="bold">Margin</text><text x="498" y="282" font-size="12" fill="#374151">Layout guide for balanced design.</text>
    <text x="498" y="336" font-weight="bold">Safe zone</text><text x="498" y="352" font-size="12" fill="#374151">Inside the margin: text and logos.</text>
  </g>
  <text x="380" y="392" font-size="12" fill="#92400E" text-anchor="middle">Crop marks sit outside the trim line in a downloaded PDF Print with crop marks and bleed.</text>
  <text x="380" y="408" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
