<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Route matching: first-match-wins, in registration order</text>

  <rect x="290" y="45" width="200" height="45" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="390" y="73" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">GET /products/edit/42</text>

  <path d="M390,90 L390,110" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>

  <!-- ordered route table -->
  <rect x="90" y="115" width="600" height="55" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="110" y="136" font-size="12" font-weight="bold" fill="#8a3d10">1. attribute routes</text>
  <text x="110" y="153" font-size="10.5" fill="#8a3d10">[Route("products/edit/{id:int}")] -- MapMvcAttributeRoutes(), tried first</text>
  <text x="670" y="146" font-size="16" fill="#2f5424" text-anchor="middle">&#10003;</text>

  <rect x="90" y="180" width="600" height="50" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.6"/>
  <text x="110" y="200" font-size="12" fill="#555555">2. "Default" -- \{controller}/\{action}/\{id} -- not reached, attribute route matched first</text>
  <text x="110" y="216" font-size="10" fill="#777777">defaults: controller=Home, action=Index, id=UrlParameter.Optional</text>

  <rect x="90" y="240" width="600" height="40" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.6"/>
  <text x="110" y="264" font-size="12" fill="#555555">3. "CatchAll" -- \{*path} -- last resort, also not reached</text>

  <path d="M390,170 L390,195" stroke="#bbbbbb" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <path d="M390,230 L390,245" stroke="#bbbbbb" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>

  <path d="M390,280 L390,300" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>

  <rect x="220" y="305" width="340" height="80" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="390" y="330" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">RouteData</text>
  <text x="390" y="350" font-size="11" fill="#2f5424" text-anchor="middle">controller = "Products", action = "Edit"</text>
  <text x="390" y="366" font-size="11" fill="#2f5424" text-anchor="middle">id = 42 (matched by the :int inline constraint)</text>

  <text x="390" y="405" font-size="11.5" fill="#444444" text-anchor="middle">Constraints (regex or IRouteConstraint) filter a match; they do not reorder routes -- order in the table always decides.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
</svg>
