<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 276" width="1080" height="276" role="img" aria-labelledby="sap-abap-guide-data-types-strings-and-templates-03-templates-and-functions-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-data-types-strings-and-templates-03-templates-and-functions-title">Terminal after npm run run:summary: nine new lines of output that start with the claim line Claim C-1001 for Ada Lovelace: 125.5 EUR and end with Replaced: CLAIM-1001; callout 6 marks the nine lines</title>
<g><rect x="0" y="0" width="1080" height="276" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="244" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:summary</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Claim C-1001 for Ada Lovelace: 125.5 EUR</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">3 items, 30 EUR pending</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Two decimals: 125.50</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">No decimals: 126</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">21 characters before, 12 after: ADA LOVELACE</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Number part: 1001</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Before the dash: C</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Position of the dash: 1</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Replaced: CLAIM-1001</text>
<rect x="5" y="67" width="1042" height="191" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="67" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="72" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">6</text></g></g>
