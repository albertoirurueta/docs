<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Pyramid two-phase configuration</title>
  <defs>
    <marker id="ptp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From configuration calls to a working registry</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">phase one only records actions; phase two resolves conflicts, orders the actions and runs them</text>

  <!-- phase one -->
  <rect x="20" y="62" width="330" height="120" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="185" y="84" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Phase one: collect</text>
  <text x="185" y="104" font-size="11" fill="currentColor" text-anchor="middle">config.add_route(...)   config.add_view(...)</text>
  <text x="185" y="120" font-size="11" fill="currentColor" text-anchor="middle">config.include(...)   config.scan(...)</text>
  <text x="185" y="136" font-size="11" fill="currentColor" text-anchor="middle">config.my_directive(...) via add_directive</text>
  <text x="185" y="158" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">each call appends actions: discriminator, order,</text>
  <text x="185" y="172" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">include path, callable, introspectables</text>

  <rect x="390" y="62" width="310" height="120" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="545" y="84" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Pending action list</text>
  <text x="545" y="106" font-size="11" fill="currentColor" text-anchor="middle">("view", None, "hello", ...)  from the app</text>
  <text x="545" y="122" font-size="11" fill="currentColor" text-anchor="middle">("view", None, "hello", ...)  from an include</text>
  <text x="545" y="138" font-size="11" fill="currentColor" text-anchor="middle">("route", "shelf")  order PHASE2_CONFIG</text>
  <text x="545" y="160" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">nothing has touched the registry yet</text>

  <line x1="350" y1="122" x2="388" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>

  <!-- commit -->
  <line x1="545" y1="184" x2="545" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>
  <text x="560" y="203" font-size="12" font-weight="bold" fill="currentColor">commit()</text>
  <text x="640" y="203" font-size="10" fill="currentColor" opacity="0.8">or make_wsgi_app()</text>

  <rect x="20" y="214" width="680" height="150" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="236" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Phase two: resolve, order, execute</text>

  <rect x="40" y="250" width="190" height="96" rx="5" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="270" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">1. Conflict resolution</text>
  <text x="135" y="288" font-size="10.5" fill="currentColor" text-anchor="middle">same discriminator?</text>
  <text x="135" y="303" font-size="10.5" fill="currentColor" text-anchor="middle">includer overrides included;</text>
  <text x="135" y="318" font-size="10.5" fill="currentColor" text-anchor="middle">otherwise ConfigurationConflictError</text>
  <text x="135" y="333" font-size="10.5" fill="currentColor" text-anchor="middle">with file and line of both calls</text>

  <rect x="265" y="250" width="190" height="96" rx="5" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="270" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">2. Order by phase</text>
  <text x="360" y="288" font-size="10.5" fill="currentColor" text-anchor="middle">PHASE0 (-30) your early hooks</text>
  <text x="360" y="303" font-size="10.5" fill="currentColor" text-anchor="middle">PHASE1 (-20) renderers, predicates</text>
  <text x="360" y="318" font-size="10.5" fill="currentColor" text-anchor="middle">PHASE2 (-10) add_route</text>
  <text x="360" y="333" font-size="10.5" fill="currentColor" text-anchor="middle">PHASE3 (0) everything else</text>

  <rect x="490" y="250" width="190" height="96" rx="5" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="585" y="270" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">3. Execute callables</text>
  <text x="585" y="288" font-size="10.5" fill="currentColor" text-anchor="middle">same phase: call order kept</text>
  <text x="585" y="303" font-size="10.5" fill="currentColor" text-anchor="middle">(first-added route is tried first)</text>
  <text x="585" y="318" font-size="10.5" fill="currentColor" text-anchor="middle">actions may add later-phase</text>
  <text x="585" y="333" font-size="10.5" fill="currentColor" text-anchor="middle">actions while running</text>

  <line x1="230" y1="298" x2="263" y2="298" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>
  <line x1="455" y1="298" x2="488" y2="298" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>

  <!-- result -->
  <line x1="360" y1="366" x2="360" y2="388" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>
  <rect x="20" y="390" width="330" height="62" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="414" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Registry + introspector</text>
  <text x="185" y="432" font-size="11" fill="currentColor" text-anchor="middle">routes, views, renderers, policies, settings</text>
  <text x="185" y="444" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">request.registry.introspector keeps the call sites</text>

  <line x1="350" y1="421" x2="388" y2="421" stroke="currentColor" stroke-width="1.5" marker-end="url(#ptp-arrow)"/>
  <rect x="390" y="390" width="310" height="62" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="545" y="414" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Router (the WSGI app)</text>
  <text x="545" y="432" font-size="11" fill="currentColor" text-anchor="middle">ApplicationCreated is notified with</text>
  <text x="545" y="444" font-size="11" fill="currentColor" text-anchor="middle">the router as event.app</text>
</svg>
