<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" width="1080" height="381" role="img" aria-labelledby="sap-abap-guide-abap-sql-on-a-local-database-07-result-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-abap-sql-on-a-local-database-07-result-title">Terminal showing the end of the output of npm run run:sql: Found C000000003 A 80, No row for C999999999, the sy-subrc lines of INSERT, UPDATE, UPDATE without a match, MODIFY twice and DELETE, and After the changes with the rows C000000001 A 120, C000000002 A 40, C000000003 A 80, C000000004 S 10, C000000005 S 64 and C000000006 S 42</title>
<g><rect x="0" y="0" width="1080" height="381" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="349" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:sql</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Found C000000003 A 80, subrc 0</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">No row for C999999999, sy-subrc = 4</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">INSERT, sy-subrc = 0</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">UPDATE, sy-subrc = 0</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">UPDATE without a match, sy-subrc = 4</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">MODIFY twice, sy-subrc = 0</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">DELETE, sy-subrc = 0</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">After the changes</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000001 A 120</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000002 A 40</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000003 A 80</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000004 S 10</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000005 S 64</text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79" xml:space="preserve">  C000000006 S 42</text></g>
