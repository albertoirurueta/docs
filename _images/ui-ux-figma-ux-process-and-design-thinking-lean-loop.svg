<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A lean loop for one Bookshelf hypothesis</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="30" y="60" width="150" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="105" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Hypothesis</text>
  <text x="105" y="112" font-size="11" fill="#374151" text-anchor="middle">Readers add a book</text>
  <text x="105" y="128" font-size="11" fill="#374151" text-anchor="middle">faster with one tap</text>
  <rect x="230" y="60" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="305" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Smallest design</text>
  <text x="305" y="112" font-size="11" fill="#374151" text-anchor="middle">one frame, one button,</text>
  <text x="305" y="128" font-size="11" fill="#374151" text-anchor="middle">a prototype link</text>
  <rect x="430" y="60" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="505" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Put it in front of users</text>
  <text x="505" y="112" font-size="11" fill="#374151" text-anchor="middle">five short sessions</text>
  <text x="505" y="128" font-size="11" fill="#374151" text-anchor="middle">this week</text>
  <rect x="580" y="190" width="150" height="90" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="655" y="220" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Learn</text>
  <text x="655" y="242" font-size="11" fill="#374151" text-anchor="middle">keep, change or drop;</text>
  <text x="655" y="258" font-size="11" fill="#374151" text-anchor="middle">record in the file</text>
  <rect x="330" y="190" width="150" height="90" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="405" y="220" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Next sprint</text>
  <text x="405" y="242" font-size="11" fill="#374151" text-anchor="middle">developers get only</text>
  <text x="405" y="258" font-size="11" fill="#374151" text-anchor="middle">what survived</text>
  <line x1="180" y1="105" x2="228" y2="105" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="380" y1="105" x2="428" y2="105" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M580,105 L655,105 L655,188" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="580" y1="235" x2="482" y2="235" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M330,235 L105,235 L105,152" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="215" y="226" font-size="11" fill="#4B5563" text-anchor="middle">new hypothesis</text>
  <circle cx="42" cy="72" r="11" fill="#4F46E5"/><text x="42" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="242" cy="72" r="11" fill="#4F46E5"/><text x="242" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="442" cy="72" r="11" fill="#4F46E5"/><text x="442" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="592" cy="202" r="11" fill="#B45309"/><text x="592" y="206" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="342" cy="202" r="11" fill="#047857"/><text x="342" y="206" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="380" y="318" font-size="12" fill="#374151" text-anchor="middle">Small batches and early evidence replace big specifications</text>
</svg>
