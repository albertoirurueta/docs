<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>From a listening socket to handle_stream</title>
  <defs>
    <marker id="taf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">How a TCP connection reaches your coroutine</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one thread, one IOLoop: accepting never waits for a handler to finish</text>

  <rect x="20" y="70" width="140" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="90" y="95" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">bind_sockets()</text>
  <text x="90" y="113" font-size="11" fill="currentColor" text-anchor="middle">listening sockets</text>
  <text x="90" y="127" font-size="11" fill="currentColor" text-anchor="middle">(IPv4 and IPv6)</text>

  <rect x="200" y="70" width="150" height="70" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="275" y="95" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">add_sockets()</text>
  <text x="275" y="113" font-size="11" fill="currentColor" text-anchor="middle">registers an accept</text>
  <text x="275" y="127" font-size="11" fill="currentColor" text-anchor="middle">handler on the IOLoop</text>

  <rect x="390" y="70" width="150" height="70" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="465" y="95" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">accept + wrap</text>
  <text x="465" y="113" font-size="11" fill="currentColor" text-anchor="middle">IOStream, or SSLIOStream</text>
  <text x="465" y="127" font-size="11" fill="currentColor" text-anchor="middle">when ssl_options is set</text>

  <rect x="580" y="70" width="125" height="70" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="642" y="95" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">handle_stream</text>
  <text x="642" y="113" font-size="11" fill="currentColor" text-anchor="middle">your coroutine,</text>
  <text x="642" y="127" font-size="11" fill="currentColor" text-anchor="middle">one task per client</text>

  <line x1="160" y1="105" x2="198" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#taf-arrow)"/>
  <line x1="350" y1="105" x2="388" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#taf-arrow)"/>
  <line x1="540" y1="105" x2="578" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#taf-arrow)"/>

  <!-- subclass specialisation -->
  <rect x="20" y="185" width="330" height="120" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="185" y="208" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">TCPServer subclass</text>
  <text x="185" y="228" font-size="11" fill="currentColor" text-anchor="middle">handle_stream: await stream.read_until(...)</text>
  <text x="185" y="246" font-size="11" fill="currentColor" text-anchor="middle">then await stream.write(...), until StreamClosedError</text>
  <text x="185" y="270" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">Bookshelf Live: a line protocol for shelf scanners</text>
  <text x="185" y="288" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">(see the example in this page)</text>

  <rect x="390" y="185" width="315" height="120" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="547" y="208" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">HTTPServer (also a TCPServer)</text>
  <text x="547" y="228" font-size="11" fill="currentColor" text-anchor="middle">handle_stream builds an HTTP/1 connection,</text>
  <text x="547" y="246" font-size="11" fill="currentColor" text-anchor="middle">parses headers and bodies, calls the Application</text>
  <text x="547" y="270" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">options: xheaders, max_header_size,</text>
  <text x="547" y="288" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">idle_connection_timeout, ssl_options ...</text>

  <line x1="642" y1="142" x2="642" y2="170" stroke="currentColor" stroke-width="1.5"/>
  <line x1="642" y1="170" x2="547" y2="170" stroke="currentColor" stroke-width="1.5"/>
  <line x1="547" y1="170" x2="547" y2="183" stroke="currentColor" stroke-width="1.5" marker-end="url(#taf-arrow)"/>
  <line x1="642" y1="170" x2="642" y2="170" stroke="currentColor" stroke-width="1.5"/>
  <line x1="580" y1="170" x2="185" y2="170" stroke="currentColor" stroke-width="1.5"/>
  <line x1="185" y1="170" x2="185" y2="183" stroke="currentColor" stroke-width="1.5" marker-end="url(#taf-arrow)"/>
</svg>
