<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Setting up the JMeter gRPC Request plugin: the project folder with bookshelf-grpc.jmx, protos and data files, the JMeter installation with the plugin jar in lib/ext, and the Bookshelf gRPC LoanService reached over HTTP/2" font-family="sans-serif" font-size="13" fill="currentColor">
<defs>
<marker id="gpA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
<marker id="gpB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="gpC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
</defs>
<text x="24" y="30" font-size="16" font-weight="bold">JMeter gRPC Request plugin: the files involved and where they live</text>
<text x="24" y="50" font-size="12" opacity="0.75">Three places matter: the project folder that holds the plan and the .proto contract, the JMeter installation that holds the plugin jar,</text>
<text x="24" y="66" font-size="12" opacity="0.75">and the gRPC server under test. In a distributed run the first two must exist, identically, on every load generator.</text>

<!-- Panel 1: project folder -->
<rect x="24" y="88" width="296" height="352" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.7"/>
<text x="40" y="114" font-size="14" font-weight="bold">1. Project folder</text>
<text x="40" y="132" font-size="12" opacity="0.8">versioned with the test, e.g. in Git</text>
<text x="40" y="162" font-family="monospace" font-size="12">bookshelf-perf/</text>
<rect x="52" y="172" width="252" height="28" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6"/>
<text x="62" y="191" font-family="monospace" font-size="12">bookshelf-grpc.jmx</text>
<text x="62" y="224" font-family="monospace" font-size="12">protos/</text>
<rect x="72" y="232" width="232" height="28" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
<text x="82" y="251" font-family="monospace" font-size="12">bookshelf/v1/bookshelf.proto</text>
<text x="62" y="284" font-family="monospace" font-size="12">descriptors/</text>
<rect x="72" y="292" width="232" height="28" rx="4" fill="#8e8e93" fill-opacity="0.15" stroke="#8e8e93" stroke-dasharray="4 3"/>
<text x="82" y="311" font-family="monospace" font-size="12">bookshelf.bin (optional)</text>
<text x="62" y="344" font-family="monospace" font-size="12">data/</text>
<text x="82" y="364" font-family="monospace" font-size="12">users.csv  books.csv</text>
<text x="62" y="390" font-family="monospace" font-size="12">results/</text>
<text x="82" y="410" font-family="monospace" font-size="12">grpc.jtl  grpc-report/</text>
<text x="40" y="430" font-size="11" opacity="0.75">relative paths resolve against the .jmx folder</text>

<!-- Panel 2: JMeter installation -->
<rect x="344" y="88" width="296" height="352" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.8"/>
<text x="360" y="114" font-size="14" font-weight="bold">2. JMeter installation</text>
<text x="360" y="132" font-size="12" opacity="0.8">Apache JMeter 5.6.3 on Java 17 or later</text>
<text x="360" y="162" font-family="monospace" font-size="12">apache-jmeter-5.6.3/</text>
<text x="380" y="186" font-family="monospace" font-size="12">bin/jmeter</text>
<text x="380" y="206" font-family="monospace" font-size="12">bin/PluginsManagerCMD.sh</text>
<text x="380" y="226" font-family="monospace" font-size="12">bin/user.properties</text>
<text x="380" y="250" font-family="monospace" font-size="12">lib/cmdrunner-2.0.jar</text>
<text x="380" y="274" font-family="monospace" font-size="12">lib/ext/</text>
<text x="400" y="296" font-family="monospace" font-size="12">jmeter-plugins-manager.jar</text>
<rect x="392" y="306" width="232" height="44" rx="4" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b"/>
<text x="400" y="325" font-family="monospace" font-size="12">jmeter-grpc-request.2.0.2.jar</text>
<text x="400" y="342" font-size="11" opacity="0.8">fat jar, about 32 MB: gRPC, Netty, protoc</text>
<text x="360" y="378" font-size="12">adds: Add, Sampler, GRPC Request</text>
<text x="360" y="398" font-size="11" opacity="0.75">restart JMeter after adding or removing</text>
<text x="360" y="414" font-size="11" opacity="0.75">a jar; never mix two plugin versions</text>

<!-- Panel 3: system under test -->
<rect x="664" y="88" width="272" height="352" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.8"/>
<text x="680" y="114" font-size="14" font-weight="bold">3. System under test</text>
<text x="680" y="132" font-size="12" opacity="0.8">Bookshelf API (Docker Compose)</text>
<rect x="680" y="156" width="240" height="64" rx="6" fill="#8e8e93" fill-opacity="0.12" stroke="#8e8e93"/>
<text x="692" y="178" font-size="12" font-weight="bold">HTTP :8080</text>
<text x="692" y="198" font-family="monospace" font-size="12">POST /api/auth/login</text>
<text x="692" y="214" font-size="11" opacity="0.75">returns the JWT used as metadata</text>
<rect x="680" y="240" width="240" height="96" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/>
<text x="692" y="262" font-size="12" font-weight="bold">gRPC :9090 (HTTP/2)</text>
<text x="692" y="282" font-family="monospace" font-size="12">bookshelf.v1.LoanService</text>
<text x="704" y="302" font-family="monospace" font-size="12">CreateLoan (unary)</text>
<text x="704" y="320" font-family="monospace" font-size="12">GetLoan (unary)</text>
<text x="680" y="364" font-size="11" opacity="0.8">the same bookshelf.proto is the</text>
<text x="680" y="380" font-size="11" opacity="0.8">contract the server was built from</text>

<!-- Arrows -->
<path d="M 304 186 C 330 186, 330 238, 304 244" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#gpC)"/>
<text x="246" y="216" font-size="10" fill="#10b981" text-anchor="end">Proto Root Directory</text>
<path d="M 392 328 C 352 328, 352 186, 310 186" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#gpB)"/>
<text x="334" y="268" font-size="10" fill="#f59e0b" transform="rotate(-90 334 268)" text-anchor="middle">sampler class</text>
<path d="M 624 316 C 650 316, 652 288, 678 288" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#gpA)"/>
<path d="M 624 296 C 650 296, 652 190, 678 190" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#gpA)"/>

<!-- Bottom: field mapping -->
<rect x="24" y="460" width="912" height="160" rx="10" fill="#8e8e93" fill-opacity="0.08" stroke="#8e8e93" stroke-opacity="0.6"/>
<text x="40" y="486" font-size="14" font-weight="bold">How the GRPC Request fields point at these files</text>
<text x="40" y="512" font-family="monospace" font-size="12">Server Name or IP / Port Number</text>
<text x="330" y="512" font-size="12">${__P(host,localhost)} / ${__P(grpc_port,9090)}: panel 3, gRPC port</text>
<text x="40" y="536" font-family="monospace" font-size="12">Proto Root Directory</text>
<text x="330" y="536" font-size="12">protos (every .proto below it is compiled), or an absolute path to descriptors/bookshelf.bin</text>
<text x="40" y="560" font-family="monospace" font-size="12">Library Directory (Optional)</text>
<text x="330" y="560" font-size="12">extra import roots such as googleapis; not needed for bookshelf.proto</text>
<text x="40" y="584" font-family="monospace" font-size="12">Full Method</text>
<text x="330" y="584" font-size="12">bookshelf.v1.LoanService/CreateLoan (package.Service/Method)</text>
<text x="40" y="608" font-family="monospace" font-size="12">Metadata</text>
<text x="330" y="608" font-size="12">{"authorization":"Bearer ${token}"}, token from the HTTP login in panel 3</text>
</svg>
