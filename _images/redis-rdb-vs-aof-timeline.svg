<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Data-loss window by persistence profile</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">How much of the most recent writes each profile can lose if the process crashes at an arbitrary point</text>

  <!-- shared timeline axis for each row: x=200 (older) ... x=700 (crash point, "now") -->
  <!-- Row 1: RDB only -->
  <text x="50" y="104" font-size="12.5" font-weight="bold" fill="#333333">RDB only</text>
  <text x="50" y="120" font-size="10.5" fill="#666666">save points every 5 min</text>
  <line x1="200" y1="112" x2="700" y2="112" stroke="#cccccc" stroke-width="2"/>
  <circle cx="240" cy="112" r="4" fill="#1c4b73"/>
  <text x="240" y="98" font-size="10" fill="#1c4b73" text-anchor="middle">last BGSAVE</text>
  <rect x="240" y="106" width="460" height="12" fill="#c0392b" opacity="0.75"/>
  <circle cx="700" cy="112" r="5" fill="#333333"/>
  <text x="700" y="98" font-size="10" fill="#333333" text-anchor="middle">crash</text>
  <text x="470" y="140" font-size="10.5" fill="#c0392b" text-anchor="middle">up to ~5 minutes of writes lost</text>

  <!-- Row 2: AOF everysec -->
  <text x="50" y="194" font-size="12.5" font-weight="bold" fill="#333333">AOF, appendfsync everysec</text>
  <line x1="200" y1="202" x2="700" y2="202" stroke="#cccccc" stroke-width="2"/>
  <circle cx="670" cy="202" r="4" fill="#1c4b73"/>
  <text x="670" y="188" font-size="10" fill="#1c4b73" text-anchor="middle">last fsync</text>
  <rect x="670" y="196" width="30" height="12" fill="#7a3b12" opacity="0.8"/>
  <circle cx="700" cy="202" r="5" fill="#333333"/>
  <text x="700" y="188" font-size="10" fill="#333333" text-anchor="middle">crash</text>
  <text x="470" y="230" font-size="10.5" fill="#7a3b12" text-anchor="middle">up to ~1 second of writes lost</text>

  <!-- Row 3: AOF always -->
  <text x="50" y="284" font-size="12.5" font-weight="bold" fill="#333333">AOF, appendfsync always</text>
  <line x1="200" y1="292" x2="700" y2="292" stroke="#cccccc" stroke-width="2"/>
  <circle cx="699" cy="292" r="3" fill="#2f5424"/>
  <circle cx="700" cy="292" r="5" fill="#333333"/>
  <text x="700" y="278" font-size="10" fill="#333333" text-anchor="middle">crash</text>
  <text x="470" y="320" font-size="10.5" fill="#2f5424" text-anchor="middle">effectively no writes lost (fsync per write, at a latency cost)</text>

  <!-- Row 4: RDB + AOF everysec -->
  <text x="50" y="374" font-size="12.5" font-weight="bold" fill="#333333">RDB + AOF everysec</text>
  <text x="50" y="390" font-size="10.5" fill="#666666">snapshot for backups, AOF for recovery</text>
  <line x1="200" y1="382" x2="700" y2="382" stroke="#cccccc" stroke-width="2"/>
  <circle cx="670" cy="382" r="4" fill="#1c4b73"/>
  <text x="670" y="368" font-size="10" fill="#1c4b73" text-anchor="middle">last fsync</text>
  <rect x="670" y="376" width="30" height="12" fill="#7a3b12" opacity="0.8"/>
  <circle cx="700" cy="382" r="5" fill="#333333"/>
  <text x="700" y="368" font-size="10" fill="#333333" text-anchor="middle">crash</text>
  <text x="470" y="410" font-size="10.5" fill="#7a3b12" text-anchor="middle">recovers from AOF (~1s window); RDB kept for off-box backup/DR</text>

  <text x="380" y="450" font-size="11" fill="#444444" text-anchor="middle">Bar length is illustrative, not measured -- actual loss depends on write rate and when the crash occurs.</text>
  <text x="380" y="466" font-size="11" fill="#444444" text-anchor="middle">WAIT/WAITAOF add a per-request confirmation on top of any profile; they don't change these windows by themselves.</text>
</svg>
