  <g font-size="12" fill="#374151" text-anchor="middle"><text x="103" y="194">Problem: reviews</text><text x="103" y="210">are hard to find</text><text x="293" y="194">Options: two</text><text x="293" y="210">shelf layouts</text><text x="483" y="194">Decision: poll</text><text x="483" y="210">live interaction</text><text x="665" y="194">Next steps and</text><text x="665" y="210">owners</text></g>
