<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 515" width="860" height="515" role="img" aria-labelledby="reference-totals-t reference-totals-d">
<title id="reference-totals-t">Monthly list-price total of four reference architectures</title>
<desc id="reference-totals-d">Monthly cost in US dollars of four example architectures (static site, simple dynamic site, microservices and an AI service) priced at list prices with the same sizing on AWS, Azure and Google Cloud (data as of 2026-10-26). Totals are computed arithmetically from the list prices, exclude taxes, support, discounts and free tiers, and are not a quote.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}</style>
<rect width="860" height="515" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Monthly list-price total of four reference architectures</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">AWS</text><rect class="m1" x="228" y="-4" width="8" height="8"/><text x="250" y="4">Azure</text><path class="m2" d="M382 -5L387 4L377 4Z"/><text x="400" y="4">Google Cloud</text></g></g><line class="grid" x1="70" y1="388" x2="836" y2="388"/><text class="muted" x="62" y="392" text-anchor="end">0</text><line class="grid" x1="70" y1="288" x2="836" y2="288"/><text class="muted" x="62" y="292" text-anchor="end">500</text><line class="grid" x1="70" y1="188" x2="836" y2="188"/><text class="muted" x="62" y="192" text-anchor="end">1000</text><line class="grid" x1="70" y1="88" x2="836" y2="88"/><text class="muted" x="62" y="92" text-anchor="end">1500</text><path class="axis" d="M70 88V388H836"/><g><title>AWS: 48.20 USD per month</title><rect class="f0" x="106.75" y="378.36" width="38" height="9.64"/><text class="muted" x="125.75" y="374.36" text-anchor="middle" font-size="10">$48</text></g><g><title>Azure: 46.59 USD per month</title><rect class="f1" x="146.75" y="378.68" width="38" height="9.32"/><text class="muted" x="165.75" y="374.68" text-anchor="middle" font-size="10">$47</text></g><g><title>Google Cloud: 63.05 USD per month</title><rect class="f2" x="186.75" y="375.39" width="38" height="12.61"/><text class="muted" x="205.75" y="371.39" text-anchor="middle" font-size="10">$63</text></g><text x="165.75" y="406" text-anchor="middle"><tspan x="165.75" dy="0">Static site</tspan></text><g><title>AWS: 147.08 USD per month</title><rect class="f0" x="298.25" y="358.58" width="38" height="29.42"/><text class="muted" x="317.25" y="354.58" text-anchor="middle" font-size="10">$147</text></g><g><title>Azure: 144.95 USD per month</title><rect class="f1" x="338.25" y="359.01" width="38" height="28.99"/><text class="muted" x="357.25" y="355.01" text-anchor="middle" font-size="10">$145</text></g><g><title>Google Cloud: 186.14 USD per month</title><rect class="f2" x="378.25" y="350.77" width="38" height="37.23"/><text class="muted" x="397.25" y="346.77" text-anchor="middle" font-size="10">$186</text></g><text x="357.25" y="406" text-anchor="middle"><tspan x="357.25" dy="0">Simple dynamic site</tspan></text><g><title>AWS: 447.30 USD per month</title><rect class="f0" x="489.75" y="298.54" width="38" height="89.46"/><text class="muted" x="508.75" y="294.54" text-anchor="middle" font-size="10">$447</text></g><g><title>Azure: 435.54 USD per month</title><rect class="f1" x="529.75" y="300.89" width="38" height="87.11"/><text class="muted" x="548.75" y="296.89" text-anchor="middle" font-size="10">$436</text></g><g><title>Google Cloud: 507.43 USD per month</title><rect class="f2" x="569.75" y="286.51" width="38" height="101.49"/><text class="muted" x="588.75" y="282.51" text-anchor="middle" font-size="10">$507</text></g><text x="548.75" y="406" text-anchor="middle"><tspan x="548.75" dy="0">Microservices</tspan></text><g><title>AWS: 995.48 USD per month</title><rect class="f0" x="681.25" y="188.9" width="38" height="199.1"/><text class="muted" x="700.25" y="184.9" text-anchor="middle" font-size="10">$995</text></g><g><title>Azure: 991.06 USD per month</title><rect class="f1" x="721.25" y="189.79" width="38" height="198.21"/><text class="muted" x="740.25" y="185.79" text-anchor="middle" font-size="10">$991</text></g><g><title>Google Cloud: 1002.00 USD per month</title><rect class="f2" x="761.25" y="187.6" width="38" height="200.4"/><text class="muted" x="780.25" y="183.6" text-anchor="middle" font-size="10">$1,002</text></g><text x="740.25" y="406" text-anchor="middle"><tspan x="740.25" dy="0">AI service</tspan></text><text class="axis-label" x="453" y="448" text-anchor="middle">Reference architecture</text><text class="axis-label" transform="translate(16 238) rotate(-90)" text-anchor="middle">Monthly cost at list price (USD)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="464" text-anchor="start"><tspan x="24" dy="0">Sources: anthropic-pricing, aws-price-bedrock, aws-price-datatransfer, aws-price-ec2, aws-price-eks, aws-price-lambda, aws-price-rds,</tspan><tspan x="24" dy="15">aws-price-s3, azure-retail-prices-api, gcp-pricing-compute, gcp-pricing-gke, gcp-pricing-network, gcp-pricing-run, gcp-pricing-sql,</tspan><tspan x="24" dy="15">gcp-pricing-storage, gcp-pricing-vertex. Data as of 2026-10-26. Computed from list prices, excluding discounts, free tiers, support and taxes.</tspan></text>
</svg>
