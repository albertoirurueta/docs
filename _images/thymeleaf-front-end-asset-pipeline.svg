<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From front-end sources to a cacheable link in a Thymeleaf page</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">build time on the left, request time on the right</text>

  <!-- build time lane -->
  <rect x="20" y="62" width="400" height="318" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="34" y="82" font-size="12" font-weight="bold" fill="#666666">Build time (Maven or Gradle)</text>

  <rect x="40" y="100" width="150" height="66" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="115" y="124" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Sources</text>
  <text x="115" y="143" font-size="11" fill="#444444" text-anchor="middle">templates/**/*.html</text>
  <text x="115" y="157" font-size="11" fill="#444444" text-anchor="middle">src/main/frontend/app.css</text>

  <rect x="250" y="100" width="150" height="66" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="325" y="124" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Tailwind CLI or Vite</text>
  <text x="325" y="143" font-size="11" fill="#2b4c8c" text-anchor="middle">scan, generate, minify</text>
  <text x="325" y="157" font-size="11" fill="#2b4c8c" text-anchor="middle">run by a node plugin</text>

  <rect x="250" y="220" width="150" height="66" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="325" y="244" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">static/dist/app.css</text>
  <text x="325" y="263" font-size="11" fill="#8a6a00" text-anchor="middle">generated, not committed</text>
  <text x="325" y="277" font-size="11" fill="#8a6a00" text-anchor="middle">copied into the jar</text>

  <rect x="40" y="220" width="150" height="66" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="115" y="244" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">WebJar dependency</text>
  <text x="115" y="263" font-size="11" fill="#444444" text-anchor="middle">org.webjars.npm:htmx.org</text>
  <text x="115" y="277" font-size="11" fill="#444444" text-anchor="middle">+ webjars-locator-lite</text>

  <!-- request time lane -->
  <rect x="440" y="62" width="400" height="318" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="454" y="82" font-size="12" font-weight="bold" fill="#666666">Request time (Spring MVC)</text>

  <rect x="460" y="100" width="360" height="66" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="640" y="124" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">Thymeleaf renders @{/dist/app.css}</text>
  <text x="640" y="143" font-size="11" fill="#1e6b34" text-anchor="middle">ResourceUrlEncodingFilter asks the resource chain</text>
  <text x="640" y="157" font-size="11" fill="#1e6b34" text-anchor="middle">for the public URL of the file</text>

  <rect x="460" y="190" width="360" height="52" fill="#ffffff" stroke="#1e6b34" stroke-width="1"/>
  <text x="640" y="212" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">&lt;link rel="stylesheet" href="/dist/app-3f9c...c1.css"&gt;</text>
  <text x="640" y="230" font-size="11" fill="#666666" text-anchor="middle">content hash in the file name, WebJar version in the path</text>

  <rect x="460" y="270" width="360" height="86" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="640" y="294" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">Browser requests the hashed URL</text>
  <text x="640" y="314" font-size="11" fill="#8a6a00" text-anchor="middle">the resource handler strips the hash and serves the file</text>
  <text x="640" y="330" font-size="11" fill="#8a6a00" text-anchor="middle">Cache-Control: max-age=31536000, public</text>
  <text x="640" y="346" font-size="11" fill="#8a6a00" text-anchor="middle">a changed file gets a new hash, so a new URL</text>

  <!-- arrows -->
  <g stroke="#444444" stroke-width="1.6" fill="#444444">
    <line x1="190" y1="133" x2="246" y2="133"/>
    <polygon points="250,133 242,128 242,138" stroke="none"/>
    <line x1="325" y1="166" x2="325" y2="216"/>
    <polygon points="325,220 320,212 330,212" stroke="none"/>
    <line x1="400" y1="253" x2="426" y2="253"/>
    <line x1="426" y1="253" x2="426" y2="133"/>
    <line x1="426" y1="133" x2="456" y2="133"/>
    <polygon points="460,133 452,128 452,138" stroke="none"/>
    <line x1="115" y1="286" x2="115" y2="312"/>
    <line x1="115" y1="312" x2="426" y2="312"/>
    <line x1="426" y1="312" x2="426" y2="253"/>
    <line x1="640" y1="166" x2="640" y2="186"/>
    <polygon points="640,190 635,182 645,182" stroke="none"/>
    <line x1="640" y1="242" x2="640" y2="266"/>
    <polygon points="640,270 635,262 645,262" stroke="none"/>
  </g>
</svg>
