<svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>The Java collections framework: core interfaces and their common implementations</title>
  <rect x="0" y="0" width="1080" height="500" fill="#ffffff"/>

  <text x="540" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Collections Framework: core interfaces and common implementations</text>
  <text x="540" y="43" font-size="10.5" fill="#666666" text-anchor="middle">Solid arrow = sub-interface (extends).  Dashed arrow = a class implements the interface.  Map is drawn separately: it does not extend Collection.</text>

  <!-- ================= interface Iterable / Collection ================= -->
  <rect x="250" y="58" width="132" height="36" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="316" y="81" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Iterable</text>

  <rect x="250" y="126" width="132" height="36" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="316" y="149" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Collection</text>

  <!-- Collection extends Iterable -->
  <line x1="316" y1="126" x2="316" y2="96" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="310,96 322,96 316,84" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>

  <!-- branch bus from Collection to List / Set / Queue -->
  <line x1="316" y1="162" x2="316" y2="180" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="310,178 322,178 316,166" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>
  <line x1="82" y1="180" x2="650" y2="180" stroke="#4a6a8a" stroke-width="1.3"/>
  <line x1="82" y1="180" x2="82" y2="200" stroke="#4a6a8a" stroke-width="1.3"/>
  <line x1="316" y1="180" x2="316" y2="200" stroke="#4a6a8a" stroke-width="1.3"/>
  <line x1="650" y1="180" x2="650" y2="200" stroke="#4a6a8a" stroke-width="1.3"/>

  <!-- ================= List branch ================= -->
  <rect x="16" y="200" width="132" height="36" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="82" y="223" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">List</text>

  <rect x="20" y="272" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="82" y="290" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">ArrayList</text>
  <rect x="20" y="308" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="82" y="326" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">LinkedList</text>

  <line x1="82" y1="272" x2="82" y2="238" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="72" y1="308" x2="82" y2="240" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="76,240 88,240 82,230" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>

  <!-- ================= Set branch ================= -->
  <rect x="250" y="200" width="132" height="36" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="316" y="223" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Set</text>

  <rect x="282" y="272" width="132" height="34" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="348" y="294" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">SortedSet</text>
  <rect x="282" y="342" width="132" height="34" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="348" y="364" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">NavigableSet</text>

  <line x1="348" y1="272" x2="332" y2="238" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="326,238 338,238 332,226" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>
  <line x1="348" y1="342" x2="348" y2="308" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="342,308 354,308 348,296" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>

  <rect x="150" y="290" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="212" y="308" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">HashSet</text>
  <rect x="146" y="326" width="132" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="212" y="344" font-size="10" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">LinkedHashSet</text>
  <rect x="286" y="420" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="348" y="438" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">TreeSet</text>

  <line x1="212" y1="290" x2="262" y2="238" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="256,240 268,240 264,229" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>
  <line x1="212" y1="326" x2="258" y2="240" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="348" y1="420" x2="348" y2="378" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="342,380 354,380 348,370" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>

  <!-- ================= Queue / Deque branch ================= -->
  <rect x="584" y="200" width="132" height="36" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="650" y="223" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Queue</text>

  <rect x="584" y="290" width="132" height="34" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="650" y="312" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Deque</text>

  <line x1="650" y1="290" x2="650" y2="238" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="644,238 656,238 650,226" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>

  <rect x="460" y="272" width="128" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="524" y="290" font-size="10" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">PriorityQueue</text>
  <rect x="588" y="360" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="650" y="378" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">ArrayDeque</text>
  <rect x="588" y="396" width="124" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="650" y="414" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">LinkedList</text>

  <line x1="524" y1="272" x2="600" y2="238" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="594,240 606,240 602,229" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>
  <line x1="650" y1="360" x2="650" y2="326" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="644,328 656,328 650,318" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>
  <line x1="636" y1="396" x2="640" y2="328" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="650" y="440" font-size="8.5" fill="#888888" text-anchor="middle" font-style="italic">LinkedList also implements List</text>

  <!-- ================= divider ================= -->
  <line x1="770" y1="56" x2="770" y2="470" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- ================= Map hierarchy ================= -->
  <rect x="834" y="118" width="132" height="36" rx="4" fill="#f4eef6" stroke="#6a4a8a" stroke-width="1.3"/>
  <text x="900" y="141" font-size="12" font-weight="bold" fill="#3a1f52" text-anchor="middle" font-family="'Courier New', monospace">Map</text>

  <rect x="802" y="196" width="132" height="34" rx="4" fill="#f4eef6" stroke="#6a4a8a" stroke-width="1.3"/>
  <text x="868" y="218" font-size="11" font-weight="bold" fill="#3a1f52" text-anchor="middle" font-family="'Courier New', monospace">SortedMap</text>
  <rect x="802" y="272" width="132" height="34" rx="4" fill="#f4eef6" stroke="#6a4a8a" stroke-width="1.3"/>
  <text x="868" y="294" font-size="11" font-weight="bold" fill="#3a1f52" text-anchor="middle" font-family="'Courier New', monospace">NavigableMap</text>

  <line x1="868" y1="196" x2="896" y2="156" stroke="#6a4a8a" stroke-width="1.3"/>
  <polygon points="890,158 902,158 898,146" fill="#ffffff" stroke="#6a4a8a" stroke-width="1.3"/>
  <line x1="868" y1="272" x2="868" y2="232" stroke="#6a4a8a" stroke-width="1.3"/>
  <polygon points="862,232 874,232 868,220" fill="#ffffff" stroke="#6a4a8a" stroke-width="1.3"/>

  <rect x="946" y="190" width="128" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="1010" y="208" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">HashMap</text>
  <rect x="946" y="226" width="128" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="1010" y="244" font-size="9.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">LinkedHashMap</text>
  <rect x="890" y="342" width="120" height="28" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="950" y="360" font-size="10.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">TreeMap</text>

  <line x1="946" y1="204" x2="958" y2="156" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="952,158 964,158 960,147" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>
  <line x1="946" y1="234" x2="962" y2="158" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="924" y1="342" x2="912" y2="306" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="906,308 918,308 912,297" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>

  <text x="924" y="460" font-size="9.5" fill="#6a4a8a" text-anchor="middle" font-style="italic">Map hierarchy &#8212; keys to values, not a Collection</text>

  <!-- ================= legend ================= -->
  <line x1="40" y1="476" x2="72" y2="476" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="66,481 78,481 72,470" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="86" y="480" font-size="9.5" fill="#444444" text-anchor="start">sub-interface (extends)</text>
  <line x1="240" y1="476" x2="272" y2="476" stroke="#5a8a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="266,481 278,481 272,470" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.2"/>
  <text x="286" y="480" font-size="9.5" fill="#444444" text-anchor="start">class implements interface</text>
</svg>
