<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>What a deployed GWT application contains: the module directory in a WAR and in a Spring Boot jar, with the caching rule of every file group</title>
  <desc>Two packagings of the Bookshelf side by side. The WAR holds index.html (served by a host page servlet, no-store), bookshelf.nocache.js and the theme files (no-cache, revalidate on every use), the content-hashed cache.js, gwt.rpc and code-split files (cache for a year, immutable) and WEB-INF with web.xml, classes and gwt-servlet-jakarta (never sent to a browser). The Spring Boot jar holds the same module directory inside a separate assets jar under META-INF/resources, because the RPC servlet reads its serialization policy files through the servlet context. A strip at the bottom shows the four requests a browser makes: host page, selection script, one permutation, RPC call to the same origin as the script.</desc>
  <rect x="0" y="0" width="960" height="640" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">What is deployed: one module directory, two packagings, three caching rules</text>
  <rect x="24" y="48" width="444" height="430" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="246.0" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">WAR: bookshelf-server-1.0-SNAPSHOT.war</text>
  <text x="246.0" y="86" text-anchor="middle" font-size="11" fill="#334155">Jetty or Tomcat serves the root; the client module is overlaid</text>
  <rect x="36" y="98" width="420" height="42" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="46" y="115" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#4c1d95">index.html</text>
  <text x="46" y="131" font-size="11" fill="#4c1d95">HostPageServlet: user, locale, CSRF token</text>
  <rect x="364" y="106" width="84" height="22" rx="11" fill="#6d28d9"/>
  <text x="406.0" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">no-store</text>
  <rect x="36" y="148" width="420" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="165" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#78350f">bookshelf/bookshelf.nocache.js</text>
  <text x="46" y="181" font-size="11" fill="#78350f">selection script, same name on every build</text>
  <rect x="364" y="156" width="84" height="22" rx="11" fill="#b45309"/>
  <text x="406.0" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">no-cache</text>
  <rect x="36" y="198" width="420" height="42" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="46" y="215" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#14532d">bookshelf/&lt;hash&gt;.cache.js</text>
  <text x="46" y="231" font-size="11" fill="#14532d">one per permutation (6 in the Bookshelf)</text>
  <rect x="364" y="206" width="84" height="22" rx="11" fill="#15803d"/>
  <text x="406.0" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">immutable</text>
  <rect x="36" y="248" width="420" height="42" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="46" y="265" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#14532d">bookshelf/&lt;hash&gt;.gwt.rpc</text>
  <text x="46" y="281" font-size="11" fill="#14532d">RPC policy, one per service interface</text>
  <rect x="364" y="256" width="84" height="22" rx="11" fill="#15803d"/>
  <text x="406.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">immutable</text>
  <rect x="36" y="298" width="420" height="42" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="46" y="315" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#14532d">bookshelf/deferredjs/&lt;hash&gt;/N.cache.js</text>
  <text x="46" y="331" font-size="11" fill="#14532d">code-split fragments</text>
  <rect x="364" y="306" width="84" height="22" rx="11" fill="#15803d"/>
  <text x="406.0" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">immutable</text>
  <rect x="36" y="348" width="420" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="365" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#78350f">gwt/clean/*, compilation-mappings.txt</text>
  <text x="46" y="381" font-size="11" fill="#78350f">fixed names, change with a GWT upgrade</text>
  <rect x="364" y="356" width="84" height="22" rx="11" fill="#b45309"/>
  <text x="406.0" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">no-cache</text>
  <rect x="36" y="398" width="420" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="46" y="415" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">WEB-INF/{web.xml, classes, lib}</text>
  <text x="46" y="431" font-size="11" fill="#7f1d1d">servlets, filters, gwt-servlet-jakarta</text>
  <rect x="364" y="406" width="84" height="22" rx="11" fill="#b91c1c"/>
  <text x="406.0" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">not served</text>
  <rect x="492" y="48" width="444" height="430" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="714.0" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Spring Boot: bookshelf-boot-1.0-SNAPSHOT.jar</text>
  <text x="714.0" y="86" text-anchor="middle" font-size="11" fill="#334155">java -jar starts embedded Tomcat; no servlet container to install</text>
  <rect x="504" y="98" width="420" height="42" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="514" y="115" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#312e81">BOOT-INF/classes/</text>
  <text x="514" y="131" font-size="11" fill="#312e81">BookshelfApplication, application.properties</text>
  <rect x="832" y="106" width="84" height="22" rx="11" fill="#4338ca"/>
  <text x="874.0" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">server code</text>
  <rect x="504" y="148" width="420" height="42" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="514" y="165" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#312e81">lib/bookshelf-server-...-classes.jar</text>
  <text x="514" y="181" font-size="11" fill="#312e81">servlets and filters registered as beans</text>
  <rect x="832" y="156" width="84" height="22" rx="11" fill="#4338ca"/>
  <text x="874.0" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">server code</text>
  <rect x="504" y="198" width="420" height="42" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="514" y="215" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#312e81">lib/gwt-servlet-jakarta-2.13.1.jar</text>
  <text x="514" y="231" font-size="11" fill="#312e81">RemoteServiceServlet (jakarta package)</text>
  <rect x="832" y="206" width="84" height="22" rx="11" fill="#4338ca"/>
  <text x="874.0" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">server code</text>
  <rect x="504" y="248" width="420" height="130" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="514" y="265" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">lib/bookshelf-assets-...jar</text>
  <text x="514" y="281" font-size="11" fill="#1e3a8a">META-INF/resources/bookshelf/ holds the module directory of the WAR;</text>
  <text x="514" y="295" font-size="11" fill="#1e3a8a">the servlet context can open its .gwt.rpc files</text>
  <rect x="514" y="306" width="196" height="24" rx="12" fill="#15803d"/>
  <text x="600.0" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">*.cache.js, *.gwt.rpc, deferredjs</text>
  <rect x="718" y="306" width="196" height="24" rx="12" fill="#b45309"/>
  <text x="816.0" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">nocache.js, theme, mappings</text>
  <text x="514" y="354" font-size="11" fill="#1e3a8a">Same rules as in the WAR, set by one CacheControlFilter on /*</text>
  <text x="514" y="368" font-size="11" fill="#1e3a8a">(or by the CDN or reverse proxy in front of the application)</text>
  <rect x="504" y="386" width="420" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="514" y="404" font-size="11" font-weight="bold" fill="#7f1d1d">Not the same: the module under BOOT-INF/classes/META-INF/resources</text>
  <text x="514" y="420" font-size="11" fill="#7f1d1d">is served over HTTP, but the policy files are not found (observed)</text>
  <text x="24" y="504" font-size="12" font-weight="bold" fill="#64748b">BROWSER, CDN AND ORIGIN</text>
  <rect x="24" y="516" width="192" height="96" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="120.0" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">1. GET /</text>
  <text x="120.0" y="562" text-anchor="middle" font-size="11" fill="#831843">host page from the origin,</text>
  <text x="120.0" y="578" text-anchor="middle" font-size="11" fill="#831843">never cached</text>
  <rect x="264" y="516" width="192" height="96" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="360.0" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">2. GET bookshelf.nocache.js</text>
  <text x="360.0" y="562" text-anchor="middle" font-size="11" fill="#831843">revalidate: 304 if unchanged</text>
  <text x="360.0" y="578" text-anchor="middle" font-size="11" fill="#831843">a few KB</text>
  <rect x="504" y="516" width="192" height="96" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="600.0" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">3. GET &lt;hash&gt;.cache.js</text>
  <text x="600.0" y="562" text-anchor="middle" font-size="11" fill="#831843">from cache for a year,</text>
  <text x="600.0" y="578" text-anchor="middle" font-size="11" fill="#831843">one permutation only</text>
  <rect x="744" y="516" width="192" height="96" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="840.0" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">4. POST bookshelf/catalog</text>
  <text x="840.0" y="562" text-anchor="middle" font-size="11" fill="#831843">X-GWT-* request headers,</text>
  <text x="840.0" y="578" text-anchor="middle" font-size="11" fill="#831843">same origin as the script</text>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M216 564 L262 564"/>
    <path d="M456 564 L502 564"/>
    <path d="M696 564 L742 564"/>
  </g>
</svg>
