<svg viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Three data models for the same Bookshelf order</text>

  <!-- Spanner -->
  <rect x="16" y="44" width="280" height="380" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="156" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">Spanner: relational</text>
  <text x="156" y="86" text-anchor="middle" font-size="11" fill="#3c4a58">tables, typed columns, SQL, joins</text>
  <rect x="32" y="102" width="248" height="22" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="40" y="118" font-size="11" font-weight="700" fill="#123a72">Orders</text>
  <rect x="32" y="124" width="248" height="22" fill="#ffffff" stroke="#1a73e8"/>
  <text x="40" y="140" font-size="10.5" fill="#3c4a58">CustomerId | OrderId | Status | Total</text>
  <rect x="32" y="146" width="248" height="22" fill="#ffffff" stroke="#1a73e8"/>
  <text x="40" y="162" font-size="10.5" fill="#3c4a58">c-001 | o-1001 | PAID | 42.00</text>
  <rect x="32" y="190" width="248" height="22" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="40" y="206" font-size="11" font-weight="700" fill="#123a72">OrderLines (interleaved)</text>
  <rect x="32" y="212" width="248" height="22" fill="#ffffff" stroke="#1a73e8"/>
  <text x="40" y="228" font-size="10.5" fill="#3c4a58">c-001 | o-1001 | 1 | isbn | qty</text>
  <text x="156" y="270" text-anchor="middle" font-size="11" fill="#3c4a58">Strong consistency across rows and tables</text>
  <text x="156" y="288" text-anchor="middle" font-size="11" fill="#3c4a58">Read-write transactions at any scale</text>
  <text x="156" y="306" text-anchor="middle" font-size="11" fill="#3c4a58">Scale by processing units</text>
  <text x="156" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Pick for: global, relational, high write volume</text>

  <!-- Firestore -->
  <rect x="306" y="44" width="288" height="380" rx="10" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.6"/>
  <text x="450" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#14572f">Firestore: documents</text>
  <text x="450" y="86" text-anchor="middle" font-size="11" fill="#3c4a58">collections of JSON-like documents</text>
  <rect x="322" y="102" width="256" height="24" fill="#d6efdf" stroke="#1e7e45"/>
  <text x="330" y="119" font-size="11" font-weight="700" fill="#14572f">orders / o-1001</text>
  <rect x="322" y="126" width="256" height="60" fill="#ffffff" stroke="#1e7e45"/>
  <text x="330" y="142" font-size="10.5" fill="#3c4a58">customerId: "c-001", status: "PAID"</text>
  <text x="330" y="158" font-size="10.5" fill="#3c4a58">total: 42.0, lines: [ {...}, {...} ]</text>
  <text x="330" y="174" font-size="10.5" fill="#3c4a58">createdAt: timestamp</text>
  <rect x="338" y="196" width="240" height="24" fill="#d6efdf" stroke="#1e7e45"/>
  <text x="346" y="213" font-size="11" font-weight="700" fill="#14572f">orders / o-1001 / events / e-1</text>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#3c4a58">Automatic single-field indexes</text>
  <text x="450" y="288" text-anchor="middle" font-size="11" fill="#3c4a58">Realtime listeners, offline mobile and web SDKs</text>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#3c4a58">Security rules for direct client access</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#14572f">Pick for: app back ends, mobile and web clients</text>

  <!-- Bigtable -->
  <rect x="604" y="44" width="280" height="380" rx="10" fill="#fff8e6" stroke="#b06a00" stroke-width="1.6"/>
  <text x="744" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4800">Bigtable: wide column</text>
  <text x="744" y="86" text-anchor="middle" font-size="11" fill="#3c4a58">sorted row keys, column families</text>
  <rect x="620" y="102" width="248" height="22" fill="#fbe9c0" stroke="#b06a00"/>
  <text x="628" y="118" font-size="10.5" font-weight="700" fill="#7a4800">row key | cf:price @t3 | cf:price @t2</text>
  <rect x="620" y="124" width="248" height="22" fill="#ffffff" stroke="#b06a00"/>
  <text x="628" y="140" font-size="10.5" fill="#3c4a58">isbn#9780134685991 | 31.00 | 29.00</text>
  <rect x="620" y="146" width="248" height="22" fill="#ffffff" stroke="#b06a00"/>
  <text x="628" y="162" font-size="10.5" fill="#3c4a58">isbn#9781492078005 | 55.00 | 52.00</text>
  <text x="744" y="200" text-anchor="middle" font-size="11" fill="#3c4a58">Rows sorted by key; scans by key range</text>
  <text x="744" y="270" text-anchor="middle" font-size="11" fill="#3c4a58">Single-row atomicity, no joins</text>
  <text x="744" y="288" text-anchor="middle" font-size="11" fill="#3c4a58">Very high throughput at low latency</text>
  <text x="744" y="306" text-anchor="middle" font-size="11" fill="#3c4a58">Scale by nodes per cluster</text>
  <text x="744" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4800">Pick for: time series, IoT, analytics feeds</text>
</svg>
