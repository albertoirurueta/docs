<title id="cves-core-traditional-t">CVEs per year, core of the traditional CMSs</title>
<desc id="cves-core-traditional-d">CVEs published per year in the NVD for the core of WordPress, Drupal, Joomla, TYPO3 and Craft CMS (CPE-matched), 2015 to 2026 year to date. WordPress plugin and theme CVEs are filed under other vendors, so they are not in the WordPress core series. CVE counts measure disclosure, not real risk, and NVD CPE tagging can lag.</desc>
