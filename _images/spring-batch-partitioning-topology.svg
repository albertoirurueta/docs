<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Partitioning topology</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">one manager step fans out to N worker step executions, each over a disjoint slice</text>

  <!-- manager -->
  <rect x="40" y="80" width="200" height="86" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="54" y="102" font-size="13" font-weight="bold" fill="#1c4b73">Manager step</text>
  <text x="54" y="122" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">Partitioner</text>
  <text x="54" y="138" font-size="10.5" fill="#666666">builds N ExecutionContexts</text>
  <text x="54" y="156" font-size="10.5" fill="#666666">(minId/maxId, file name, ...)</text>

  <rect x="40" y="196" width="200" height="76" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="54" y="218" font-size="12.5" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">StepExecutionSplitter</text>
  <text x="54" y="236" font-size="10.5" fill="#666666">one StepExecution per partition,</text>
  <text x="54" y="252" font-size="10.5" fill="#666666">persisted in the JobRepository</text>
  <text x="54" y="268" font-size="10.5" fill="#666666">gridSize = how many</text>

  <rect x="40" y="302" width="200" height="66" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="54" y="324" font-size="12.5" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">PartitionHandler</text>
  <text x="54" y="342" font-size="10.5" fill="#666666">TaskExecutorPartitionHandler (local)</text>
  <text x="54" y="358" font-size="10.5" fill="#666666">MessageChannel... (remote)</text>

  <!-- arrows to workers -->
  <line x1="240" y1="335" x2="340" y2="120" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="240" y1="335" x2="340" y2="230" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="240" y1="335" x2="340" y2="340" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="240" y1="335" x2="340" y2="420" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- workers -->
  <rect x="350" y="88" width="370" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="364" y="110" font-size="12.5" font-weight="bold" fill="#2f5424">Worker step execution 1</text>
  <text x="364" y="128" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">reader(minId=1, maxId=250k) &#8594; processor &#8594; writer</text>
  <text x="364" y="145" font-size="10.5" fill="#666666">bound with #{stepExecutionContext['minId']}</text>

  <rect x="350" y="198" width="370" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="364" y="220" font-size="12.5" font-weight="bold" fill="#2f5424">Worker step execution 2</text>
  <text x="364" y="238" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">reader(minId=250k, maxId=500k) &#8594; processor &#8594; writer</text>
  <text x="364" y="255" font-size="10.5" fill="#666666">own transaction, own chunk loop, own counters</text>

  <rect x="350" y="308" width="370" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="364" y="330" font-size="12.5" font-weight="bold" fill="#2f5424">Worker step execution 3</text>
  <text x="364" y="348" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">reader(minId=500k, maxId=750k) &#8594; processor &#8594; writer</text>
  <text x="364" y="365" font-size="10.5" fill="#666666">restartable independently of the others</text>

  <text x="364" y="424" font-size="12" fill="#666666" font-style="italic">... worker N (a thread locally, or a remote JVM)</text>

  <text x="380" y="456" font-size="10.5" fill="#666666" text-anchor="middle">the manager step completes only when every worker step execution has completed</text>
</svg>
