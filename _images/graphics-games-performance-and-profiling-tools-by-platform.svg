<text x="230" y="312" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Frame Debugger</text>
<text x="520" y="312" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Profiler, Profile Analyzer</text>
<rect x="14" y="332" width="732" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="356" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Unreal Engine</text>
