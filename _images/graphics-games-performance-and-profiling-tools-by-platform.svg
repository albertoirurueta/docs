<text x="520" y="58" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">Timing and system view</text>
<rect x="14" y="68" width="732" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="92" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Windows (D3D12)</text>
<text x="230" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">PIX, RenderDoc</text>
<text x="520" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">PIX timing captures</text>
<rect x="14" y="112" width="732" height="38" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="136" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Vulkan or GL (Win, Linux)</text>
<text x="230" y="136" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">RenderDoc</text>
<text x="520" y="136" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">vendor profilers (Nsight, RGP)</text>
<rect x="14" y="156" width="732" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="180" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Apple (Metal)</text>
<text x="230" y="180" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Xcode Metal debugger</text>
<text x="520" y="180" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Instruments, GPU counters</text>
<rect x="14" y="200" width="732" height="38" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="224" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Android</text>
<text x="230" y="224" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Android GPU Inspector</text>
<text x="520" y="224" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">AGI system profiler, Perfetto</text>
<rect x="14" y="244" width="732" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="24" y="268" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Browser (WebGL, WebGPU)</text>
<text x="230" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">browser DevTools</text>
<text x="520" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Performance panel, GPU timestamps</text>
<rect x="14" y="288" width="732" height="38" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
