<text x="520" y="356" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Unreal Insights, stat commands</text>
<text x="380" y="388" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">RenderDoc captures Vulkan, Direct3D 11 and 12, OpenGL and OpenGL ES, but not Metal.</text>
