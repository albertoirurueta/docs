<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Recommendation pipeline: offline similarity, online reads</text>

  <!-- zone backgrounds -->
  <rect x="14" y="60" width="450" height="250" rx="10" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="26" y="80" font-size="12" font-weight="bold" fill="#2c5a8c">Offline job (scheduled, ShedLock)</text>
  <rect x="474" y="60" width="232" height="250" rx="10" fill="#edf7ee" stroke="#3c8d4a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="486" y="80" font-size="12" font-weight="bold" fill="#2a6b35">Online (request path)</text>

  <!-- arrows -->
  <g stroke="#888888" stroke-width="1.6" fill="#888888">
    <line x1="119" y1="180" x2="136" y2="180"/>
    <polygon points="141,180 133,175 133,185"/>
    <line x1="241" y1="180" x2="258" y2="180"/>
    <polygon points="263,180 255,175 255,185"/>
    <line x1="363" y1="180" x2="380" y2="180"/>
    <polygon points="385,180 377,175 377,185"/>
  </g>
  <g stroke="#888888" stroke-width="1.6" fill="#888888">
    <line x1="463" y1="180" x2="476" y2="180"/>
    <polygon points="481,180 473,175 473,185"/>
  </g>

  <!-- stage 1 -->
  <rect x="21" y="125" width="98" height="110" rx="8" fill="#ffffff" stroke="#4a7ab5" stroke-width="2"/>
  <text x="70" y="160" font-size="13" font-weight="bold" fill="#2c5a8c" text-anchor="middle">Purchases</text>
  <text x="70" y="180" font-size="11" fill="#444444" text-anchor="middle">Customer</text>
  <text x="70" y="196" font-size="11" fill="#444444" text-anchor="middle">PURCHASED</text>
  <text x="70" y="212" font-size="11" fill="#444444" text-anchor="middle">Product</text>

  <!-- stage 2 -->
  <rect x="141" y="125" width="100" height="110" rx="8" fill="#ffffff" stroke="#4a7ab5" stroke-width="2"/>
  <text x="191" y="160" font-size="13" font-weight="bold" fill="#2c5a8c" text-anchor="middle">Similarity</text>
  <text x="191" y="180" font-size="11" fill="#444444" text-anchor="middle">GDS project,</text>
  <text x="191" y="196" font-size="11" fill="#444444" text-anchor="middle">Node Similarity</text>
  <text x="191" y="212" font-size="11" fill="#444444" text-anchor="middle">(write mode)</text>

  <!-- stage 3 -->
  <rect x="263" y="125" width="100" height="110" rx="8" fill="#fff2cc" stroke="#b8860b" stroke-width="2"/>
  <text x="313" y="160" font-size="13" font-weight="bold" fill="#6b5200" text-anchor="middle">SIMILAR</text>
  <text x="313" y="180" font-size="11" fill="#444444" text-anchor="middle">persisted edges</text>
  <text x="313" y="196" font-size="11" fill="#444444" text-anchor="middle">with a score</text>
  <text x="313" y="212" font-size="11" fill="#444444" text-anchor="middle">property</text>

  <!-- stage 4 -->
  <rect x="385" y="125" width="78" height="110" rx="8" fill="#ffffff" stroke="#3c8d4a" stroke-width="2"/>
  <text x="424" y="160" font-size="13" font-weight="bold" fill="#2a6b35" text-anchor="middle">Cached</text>
  <text x="424" y="180" font-size="11" fill="#444444" text-anchor="middle">OLTP</text>
  <text x="424" y="196" font-size="11" fill="#444444" text-anchor="middle">query</text>
  <text x="424" y="212" font-size="11" fill="#444444" text-anchor="middle">Cacheable</text>

  <!-- stage 5 -->
  <rect x="481" y="125" width="216" height="110" rx="8" fill="#ffffff" stroke="#3c8d4a" stroke-width="2"/>
  <text x="589" y="160" font-size="13" font-weight="bold" fill="#2a6b35" text-anchor="middle">REST API</text>
  <text x="589" y="180" font-size="11" fill="#444444" text-anchor="middle">GET /customers/id/recommendations</text>
  <text x="589" y="196" font-size="11" fill="#444444" text-anchor="middle">page and size parameters</text>
  <text x="589" y="212" font-size="11" fill="#444444" text-anchor="middle">ranked by summed score</text>

  <!-- eviction loop -->
  <path d="M 313 240 L 313 280 L 424 280 L 424 240" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="424,240 419,250 429,250" fill="#c0392b"/>
  <text x="368" y="298" font-size="11" fill="#c0392b" text-anchor="middle">evict cache when the job finishes</text>

  <!-- footer notes -->
  <text x="360" y="345" font-size="12.5" fill="#333333" text-anchor="middle">The heavy work (projection, scoring) never runs on the request thread.</text>
  <text x="360" y="365" font-size="12.5" fill="#333333" text-anchor="middle">Requests read a few SIMILAR edges and the products of those peers.</text>

  <!-- legend -->
  <rect x="26" y="396" width="14" height="14" rx="3" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="46" y="408" font-size="11.5" fill="#444444">Offline analytics</text>
  <rect x="176" y="396" width="14" height="14" rx="3" fill="#fff2cc" stroke="#b8860b" stroke-width="1.5"/>
  <text x="196" y="408" font-size="11.5" fill="#444444">Persisted result</text>
  <rect x="326" y="396" width="14" height="14" rx="3" fill="#edf7ee" stroke="#3c8d4a" stroke-width="1.5"/>
  <text x="346" y="408" font-size="11.5" fill="#444444">Online serving</text>
</svg>
