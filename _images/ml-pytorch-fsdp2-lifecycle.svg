<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">FSDP2 life cycle of one layer</title>
<desc id="d">Two rows. In the forward pass a wrapped layer all-gathers its sharded parameters, computes, and frees the full parameters again. In the backward pass it all-gathers again, computes gradients, reduce-scatters the gradients so each rank keeps one shard, and frees the full parameters.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One fully_shard group (for example a transformer block)</text>
<text x="20" y="66" font-size="14" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">Forward</text>
<rect x="20" y="76" width="150" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="95" y="106" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">sharded (1/N)</text>
<rect x="200" y="76" width="150" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275" y="106" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all-gather params</text>
<rect x="380" y="76" width="150" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="455" y="106" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">compute (full)</text>
<rect x="560" y="76" width="140" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="630" y="106" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reshard (free)</text>
<line x1="170" y1="101" x2="198" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="350" y1="101" x2="378" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="530" y1="101" x2="558" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="168" font-size="14" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">Backward</text>
<rect x="20" y="178" width="150" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="95" y="208" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all-gather params</text>
<rect x="200" y="178" width="150" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="275" y="208" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">compute grads</text>
<rect x="380" y="178" width="150" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="455" y="208" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reduce-scatter grads</text>
<rect x="560" y="178" width="140" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="630" y="208" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reshard; keep 1/N</text>
<line x1="170" y1="203" x2="198" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="350" y1="203" x2="378" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="530" y1="203" x2="558" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="264" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Grey: only the local shard is resident. Teal and amber: collectives. Blue: computation on full parameters.</text>
<text x="360" y="284" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">With reshard_after_forward=False the forward reshard and the second all-gather are skipped, trading memory for speed.</text>
</svg>
