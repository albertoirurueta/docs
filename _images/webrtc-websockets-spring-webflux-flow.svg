<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How one Chatterbox frame travels through the Spring WebFlux server: the inbound Flux from session.receive() is processed one frame at a time by concatMap, the service publishes the result to the room bus (an in-process sink or Redis pub/sub), the room multicast sink delivers it to every subscribed connection, and a bounded per-connection sink feeds session.send() back to the browser</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One frame through the reactive pipeline</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">inbound on the top lane, fan-out on the bottom lane; both lanes run on a few Netty event-loop threads</text>

  <!-- arrows -->
  <path d="M140 190 L160 190 L160 100 L175 100" fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="315" y1="100" x2="345" y2="100" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="485" y1="100" x2="515" y2="100" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="595" y1="135" x2="595" y2="160" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="200" x2="705" y2="200" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="595" y1="240" x2="595" y2="275" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="310" x2="485" y2="310" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="345" y1="310" x2="315" y2="310" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M175 310 L160 310 L160 215 L145 215" fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- browser -->
  <rect x="20" y="160" width="120" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="198" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser</text>
  <text x="80" y="216" font-size="10" fill="#0d3c75" text-anchor="middle">WebSocket,</text>
  <text x="80" y="230" font-size="10" fill="#0d3c75" text-anchor="middle">chatterbox.v1</text>

  <!-- inbound lane -->
  <rect x="175" y="70" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="245" y="96" font-size="12" font-weight="bold" fill="#8a3d00" text-anchor="middle">session.receive()</text>
  <text x="245" y="113" font-size="10" fill="#8a3d00" text-anchor="middle">Flux of WebSocketMessage</text>
  <rect x="345" y="70" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="415" y="96" font-size="12" font-weight="bold" fill="#8a3d00" text-anchor="middle">concatMap(onFrame)</text>
  <text x="415" y="113" font-size="10" fill="#8a3d00" text-anchor="middle">one frame at a time</text>
  <rect x="515" y="70" width="160" height="65" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="595" y="94" font-size="12" font-weight="bold" fill="#4a148c" text-anchor="middle">ChatService</text>
  <text x="595" y="111" font-size="10" fill="#4a148c" text-anchor="middle">validate, ack cache,</text>
  <text x="595" y="124" font-size="10" fill="#4a148c" text-anchor="middle">assign seq</text>

  <!-- bus -->
  <rect x="515" y="160" width="160" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="595" y="186" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">RoomBus</text>
  <text x="595" y="204" font-size="10" fill="#1b5e20" text-anchor="middle">local: Sinks.many().multicast()</text>
  <text x="595" y="219" font-size="10" fill="#1b5e20" text-anchor="middle">redis: INCR + pub/sub channel</text>
  <rect x="705" y="170" width="80" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="745" y="197" font-size="12" font-weight="bold" fill="#8e0000" text-anchor="middle">Redis</text>
  <text x="745" y="213" font-size="10" fill="#8e0000" text-anchor="middle">other nodes</text>

  <!-- outbound lane -->
  <rect x="515" y="275" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="595" y="299" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">Room sink</text>
  <text x="595" y="316" font-size="10" fill="#1b5e20" text-anchor="middle">multicast directBestEffort,</text>
  <text x="595" y="330" font-size="10" fill="#1b5e20" text-anchor="middle">one subscriber per connection</text>
  <rect x="345" y="280" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="415" y="306" font-size="12" font-weight="bold" fill="#8a3d00" text-anchor="middle">Session out sink</text>
  <text x="415" y="323" font-size="10" fill="#8a3d00" text-anchor="middle">unicast, queue of 256</text>
  <rect x="175" y="280" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="245" y="306" font-size="12" font-weight="bold" fill="#8a3d00" text-anchor="middle">session.send(Flux)</text>
  <text x="245" y="323" font-size="10" fill="#8a3d00" text-anchor="middle">writes text and ping frames</text>

  <text x="400" y="378" font-size="10.5" fill="#555555" text-anchor="middle">a full per-connection queue closes that connection (slow consumer) instead of growing without bound</text>
</svg>
