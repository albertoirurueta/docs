<svg viewBox="0 0 780 460" width="780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Who manages each layer of the stack</text>

  <!-- Column headers -->
  <text x="185" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">On-premises</text>
  <text x="325" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">IaaS</text>
  <text x="465" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">PaaS</text>
  <text x="605" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">SaaS</text>
  <text x="720" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Serverless / CaaS</text>

  <!-- Column stacks: 7 layers each, from bottom (facilities) to top (data) -->
  <!-- layer height 32, starting y=64, 8 layers -->
  <!-- layer order top to bottom: Data, Applications, Runtime, Middleware, O/S, Virtualization, Servers, Storage/Networking, Facilities -->

  <!-- helper grid: x positions per column, width 110 -->
  <!-- On-premises: all customer -->
  <g>
    <rect x="130" y="64" width="110" height="256" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="185" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a1a17">All layers</text>
    <text x="185" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a1a17">customer-managed</text>
  </g>

  <!-- IaaS -->
  <g>
    <rect x="270" y="64" width="110" height="64" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="325" y="90" text-anchor="middle" font-size="10.5" fill="#7a1a17">Data</text>
    <text x="325" y="105" text-anchor="middle" font-size="10.5" fill="#7a1a17">Applications</text>
    <rect x="270" y="128" width="110" height="64" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="325" y="154" text-anchor="middle" font-size="10.5" fill="#7a1a17">Runtime</text>
    <text x="325" y="169" text-anchor="middle" font-size="10.5" fill="#7a1a17">Middleware, O/S</text>
    <rect x="270" y="192" width="110" height="128" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
    <text x="325" y="240" text-anchor="middle" font-size="10.5" fill="#0d4c22">Virtualization</text>
    <text x="325" y="255" text-anchor="middle" font-size="10.5" fill="#0d4c22">Servers, storage</text>
    <text x="325" y="270" text-anchor="middle" font-size="10.5" fill="#0d4c22">Networking, facilities</text>
  </g>

  <!-- PaaS -->
  <g>
    <rect x="410" y="64" width="110" height="64" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="465" y="90" text-anchor="middle" font-size="10.5" fill="#7a1a17">Data</text>
    <text x="465" y="105" text-anchor="middle" font-size="10.5" fill="#7a1a17">Applications</text>
    <rect x="410" y="128" width="110" height="192" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
    <text x="465" y="176" text-anchor="middle" font-size="10.5" fill="#0d4c22">Runtime, middleware</text>
    <text x="465" y="191" text-anchor="middle" font-size="10.5" fill="#0d4c22">O/S, virtualization</text>
    <text x="465" y="206" text-anchor="middle" font-size="10.5" fill="#0d4c22">Servers, storage</text>
    <text x="465" y="221" text-anchor="middle" font-size="10.5" fill="#0d4c22">Networking, facilities</text>
  </g>

  <!-- SaaS -->
  <g>
    <rect x="550" y="64" width="110" height="32" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="605" y="85" text-anchor="middle" font-size="10.5" fill="#7a1a17">Data &amp; config</text>
    <rect x="550" y="96" width="110" height="224" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
    <text x="605" y="150" text-anchor="middle" font-size="10.5" fill="#0d4c22">Applications</text>
    <text x="605" y="165" text-anchor="middle" font-size="10.5" fill="#0d4c22">Runtime, middleware</text>
    <text x="605" y="180" text-anchor="middle" font-size="10.5" fill="#0d4c22">O/S, virtualization</text>
    <text x="605" y="195" text-anchor="middle" font-size="10.5" fill="#0d4c22">Servers, storage</text>
    <text x="605" y="210" text-anchor="middle" font-size="10.5" fill="#0d4c22">Networking, facilities</text>
  </g>

  <!-- Serverless / CaaS -->
  <g>
    <rect x="665" y="64" width="110" height="64" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
    <text x="720" y="90" text-anchor="middle" font-size="10.5" fill="#7a1a17">Data</text>
    <text x="720" y="105" text-anchor="middle" font-size="10.5" fill="#7a1a17">Function / container code</text>
    <rect x="665" y="128" width="110" height="192" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
    <text x="720" y="176" text-anchor="middle" font-size="10.5" fill="#0d4c22">Runtime, orchestration</text>
    <text x="720" y="191" text-anchor="middle" font-size="10.5" fill="#0d4c22">Host O/S, servers</text>
    <text x="720" y="206" text-anchor="middle" font-size="10.5" fill="#0d4c22">Storage, networking</text>
    <text x="720" y="221" text-anchor="middle" font-size="10.5" fill="#0d4c22">Facilities</text>
  </g>

  <!-- Legend -->
  <rect x="130" y="336" width="16" height="16" fill="#fde2e1" stroke="#c5221f" stroke-width="1"/>
  <text x="152" y="349" font-size="12" fill="#3c4043">Customer-managed layer</text>
  <rect x="330" y="336" width="16" height="16" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
  <text x="352" y="349" font-size="12" fill="#3c4043">Microsoft-managed layer</text>

  <text x="390" y="384" text-anchor="middle" font-size="11" fill="#5f6368">Moving right shrinks the slice the customer operates -- from the full stack on-premises</text>
  <text x="390" y="400" text-anchor="middle" font-size="11" fill="#5f6368">to only code and data with serverless and Containers as a Service (CaaS).</text>
</svg>
