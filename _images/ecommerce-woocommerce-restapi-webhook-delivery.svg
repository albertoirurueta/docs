<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Life of one webhook delivery in WooCommerce 11.2.1</title>
  <desc id="d">A WordPress hook such as woocommerce_new_order fires and calls WC_Webhook process, which checks that the webhook is active, its topic and resource are valid and the argument was not already processed. The delivery is queued in memory and, at shutdown, scheduled as an Action Scheduler action woocommerce_deliver_webhook_async in the group woocommerce-webhooks. When the action runs, WC_Webhook deliver builds the payload, adds the X-WC-Webhook headers including a base64 HMAC-SHA256 signature of the JSON body, and sends it with wp_safe_remote_request to the delivery URL. The receiver verifies the signature on the raw body and answers with a 2xx, 301 or 302 status. A success resets the failure counter; any other answer or an error adds one to it and, once the counter is above five, the webhook becomes disabled. Every delivery is written to the WooCommerce log with the source webhooks-delivery.</desc>
  <rect x="0" y="0" width="980" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4a09c"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">One order.created delivery, from the hook to the receiver</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="52" width="210" height="96" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="74" font-weight="bold" font-size="14">1 Event</text>
    <text x="32" y="94">woocommerce_new_order</text>
    <text x="32" y="112">fires (REST, checkout, CLI)</text>
    <text x="32" y="130">topic order.created hooks it</text>

    <rect x="270" y="52" width="230" height="96" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="282" y="74" font-weight="bold" font-size="14">2 WC_Webhook::process()</text>
    <text x="282" y="94">status is active, topic valid,</text>
    <text x="282" y="112">resource matches, argument not</text>
    <text x="282" y="130">already processed in this request</text>

    <rect x="540" y="52" width="210" height="96" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="552" y="74" font-weight="bold" font-size="14">3 Queue at shutdown</text>
    <text x="552" y="94">one action per webhook and</text>
    <text x="552" y="112">argument, unique for 10 minutes</text>
    <text x="552" y="130">(or deliver now: filter)</text>

    <rect x="790" y="52" width="170" height="96" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="802" y="74" font-weight="bold" font-size="14">4 Action Scheduler</text>
    <text x="802" y="94">woocommerce_deliver_</text>
    <text x="802" y="110">webhook_async</text>
    <text x="802" y="130" font-size="11">group woocommerce-webhooks</text>

    <rect x="790" y="200" width="170" height="130" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="802" y="222" font-weight="bold" font-size="14">5 deliver()</text>
    <text x="802" y="242">JSON payload:</text>
    <text x="802" y="258">REST item or</text>
    <text x="802" y="274">{action, arg}</text>
    <text x="802" y="294">X-WC-Webhook-*</text>
    <text x="802" y="310">headers + signature</text>

    <rect x="540" y="200" width="210" height="130" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="552" y="222" font-weight="bold" font-size="14">6 Your receiver</text>
    <text x="552" y="242">HMAC-SHA256 of the raw body,</text>
    <text x="552" y="258">base64, compared with</text>
    <text x="552" y="274" font-size="11" font-family="Menlo, Consolas, monospace">X-WC-Webhook-Signature</text>
    <text x="552" y="296">answer 2xx, 301 or 302 fast,</text>
    <text x="552" y="312">work later</text>

    <rect x="270" y="200" width="230" height="130" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="282" y="222" font-weight="bold" font-size="14">7 Log and counters</text>
    <text x="282" y="242">WooCommerce &gt; Status &gt; Logs,</text>
    <text x="282" y="258" font-size="11" font-family="Menlo, Consolas, monospace">source webhooks-delivery</text>
    <text x="282" y="280">2xx, 301, 302: failure_count = 0</text>
    <text x="282" y="298">other or error: failure_count + 1</text>
    <text x="282" y="314">body redacted unless WP_DEBUG</text>

    <rect x="20" y="200" width="210" height="130" rx="8" fill="#8a4a4a" stroke="#f2f5f8"/>
    <text x="32" y="222" font-weight="bold" font-size="14">8 Too many failures</text>
    <text x="32" y="242">counter above 5 (filter</text>
    <text x="32" y="258" font-size="11" font-family="Menlo, Consolas, monospace">woocommerce_max_webhook_</text>
    <text x="32" y="272" font-size="11" font-family="Menlo, Consolas, monospace">delivery_failures</text>
    <text x="32" y="294">status becomes disabled and</text>
    <text x="32" y="310">no hook is attached any more</text>

    <rect x="20" y="370" width="940" height="170" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="32" y="394" font-weight="bold" font-size="14">What was observed on the local store</text>
    <text x="32" y="416">order.created and a custom action topic reached a receiver on the Docker network; every signature verified.</text>
    <text x="32" y="436">A webhook with a wrong secret was disabled on the 7th failed delivery (failure_count 6, then the next failure disables).</text>
    <text x="32" y="456">wp_safe_remote_request refuses private addresses and ports other than 80, 443 and 8080 unless a plugin allows the host.</text>
    <text x="32" y="476">Deliveries ran when the Action Scheduler queue ran (wp action-scheduler run), not inside the request that fired the hook.</text>
    <text x="32" y="496">The ping sent when a webhook is saved is form-encoded, has no X-WC-Webhook-* headers and does not count as a failure.</text>
    <text x="32" y="516">The signature is computed over the exact bytes of the body: parse JSON only after verifying.</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M230 100 H 268"/>
    <path d="M500 100 H 538"/>
    <path d="M750 100 H 788"/>
    <path d="M875 148 V 198"/>
    <path d="M790 265 H 752"/>
    <path d="M540 265 H 502"/>
  </g>
  <g fill="none" stroke="#f4a09c" stroke-width="1.6" marker-end="url(#r)">
    <path d="M270 265 H 232"/>
  </g>
</svg>
