<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-animation-system-mixer-action-clip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip, action, mixer: who owns what</text>
<rect x="20" y="60" width="150" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="96.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">AnimationClip</text>
<text x="95.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">name, duration</text>
<text x="95.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">tracks[ ]</text>
<text x="95.0" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(data, reusable)</text>
<rect x="215" y="60" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.0" y="81.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">AnimationAction</text>
<text x="290.0" y="96.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">pull-out</text>
<rect x="215" y="120" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.0" y="141.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">AnimationAction</text>
<text x="290.0" y="156.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">idle</text>
<rect x="410" y="60" width="150" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="485.0" y="104.2" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">AnimationMixer</text>
<text x="485.0" y="119.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">time, timeScale</text>
<text x="485.0" y="134.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">update( delta )</text>
<rect x="605" y="60" width="135" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="672.5" y="96.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Object3D root</text>
<text x="672.5" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">position</text>
<text x="672.5" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">quaternion</text>
<text x="672.5" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">morph influences</text>
<line x1="170" y1="85" x2="215" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-animation-system-mixer-action-clip)"/>
<line x1="170" y1="145" x2="215" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-animation-system-mixer-action-clip)"/>
<line x1="365" y1="85" x2="410" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-animation-system-mixer-action-clip)"/>
<line x1="365" y1="145" x2="410" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-animation-system-mixer-action-clip)"/>
<line x1="560" y1="115" x2="605" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-animation-system-mixer-action-clip)"/>
<text x="192" y="200" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">mixer.clipAction( clip )</text>
<text x="388" y="200" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">update( delta ) each frame</text>
<text x="582" y="200" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">PropertyBinding writes</text>
<rect x="20" y="230" width="340" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="264.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A clip is only data: named keyframe tracks.</text>
<text x="190.0" y="278.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">An action is one playback of a clip with its own</text>
<text x="190.0" y="292.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">weight, time scale and loop mode.</text>
<rect x="400" y="230" width="340" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="264.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The mixer sums all running actions by weight</text>
<text x="570.0" y="278.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and writes the blended result into the root</text>
<text x="570.0" y="292.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and its descendants once per update call.</text>
<text x="380" y="345" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">One mixer per animated object; many actions per mixer.</text>
</svg>
