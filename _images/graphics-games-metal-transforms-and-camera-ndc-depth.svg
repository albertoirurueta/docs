<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-transforms-and-camera-ndc-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal and OpenGL clip volumes</text>
<text x="200" y="60" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal (and Direct3D)</text>
<polygon points="80,110 240,110 310,80 150,80" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<polygon points="80,110 240,110 240,250 80,250" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<polygon points="240,110 310,80 310,220 240,250" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="200" y="275" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">z from 0 to 1</text>
<text x="560" y="60" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenGL default</text>
<polygon points="440,110 600,110 670,80 510,80" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<polygon points="440,110 600,110 600,250 440,250" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<polygon points="600,110 670,80 670,220 600,250" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560" y="275" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">z from -1 to 1</text>
<text x="100" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">near plane maps to 0, far plane to 1</text>
<text x="460" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">near plane maps to -1, far plane to 1</text>
<text x="380" y="322" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x and y are -1..1 in both; Metal's framebuffer origin is top-left, OpenGL's bottom-left</text>
</svg>
