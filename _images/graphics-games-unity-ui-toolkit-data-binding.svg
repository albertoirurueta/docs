<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-uitk-bind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Runtime data binding between a game object and a Label</text>
<rect x="20" y="60" width="210" height="190" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="125" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Data source</text>
<text x="125" y="104" text-anchor="middle" font-size="11" fill="#92400E">plain C# object or asset</text>
<rect x="35" y="116" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="125" y="135" text-anchor="middle" font-size="11" fill="#92400E" font-family="Courier, monospace">[CreateProperty] Score</text>
<rect x="35" y="154" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="125" y="173" text-anchor="middle" font-size="11" fill="#92400E" font-family="Courier, monospace">[CreateProperty] Time</text>
<text x="125" y="208" text-anchor="middle" font-size="10" fill="#92400E">implements</text>
<text x="125" y="223" text-anchor="middle" font-size="10" fill="#92400E">INotifyBindablePropertyChanged</text>
<text x="125" y="238" text-anchor="middle" font-size="10" fill="#92400E">(Notify on change)</text>
<rect x="290" y="95" width="180" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">DataBinding</text>
<text x="380" y="140" text-anchor="middle" font-size="11" fill="#3730A3">dataSourcePath: Score</text>
<text x="380" y="158" text-anchor="middle" font-size="11" fill="#3730A3">bindingMode: ToTarget</text>
<text x="380" y="176" text-anchor="middle" font-size="11" fill="#3730A3">updateTrigger: OnSourceChanged</text>
<text x="380" y="198" text-anchor="middle" font-size="10" fill="#3730A3">optional type converter</text>
<rect x="530" y="95" width="210" height="120" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="635" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">Label #score</text>
<text x="635" y="142" text-anchor="middle" font-size="11" fill="#374151">property: text</text>
<text x="635" y="160" text-anchor="middle" font-size="11" fill="#374151">dataSource inherited from</text>
<text x="635" y="175" text-anchor="middle" font-size="11" fill="#374151">the root element</text>
<line x1="230" y1="150" x2="290" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-bind)"/>
<line x1="470" y1="150" x2="530" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-bind)"/>
<text x="260" y="142" text-anchor="middle" font-size="10" fill="#374151">read</text>
<text x="500" y="142" text-anchor="middle" font-size="10" fill="#374151">write</text>
<rect x="20" y="275" width="720" height="90" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Binding modes</text>
<text x="40" y="318" font-size="11" fill="#374151">TwoWay (default): source and UI stay in sync in both directions.</text>
<text x="40" y="335" font-size="11" fill="#374151">ToTarget: source updates the UI only; right for read-only HUD text.</text>
<text x="40" y="352" font-size="11" fill="#374151">ToSource: UI updates the source only.  ToTargetOnce: one copy, until the binding is marked dirty.</text>
</svg>
