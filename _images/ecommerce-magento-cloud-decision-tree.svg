<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Choosing where to run Magento: Adobe-operated, Kubernetes, ECS on Fargate or EC2 Auto Scaling groups</title>
  <desc id="d">A decision tree. The first question asks whether Adobe should operate the platform under an Adobe Commerce licence. If yes, a second question asks whether the shop needs in-process PHP modules: if it does, Adobe Commerce on cloud infrastructure is the Adobe-operated platform as a service; if it does not and can live with out-of-process extensions and a headless storefront, Adobe Commerce as a Cloud Service is the software as a service. If the team operates the shop itself with Magento Open Source, Mage-OS or Adobe Commerce on-premises, the next question asks whether a platform team already runs Kubernetes. If yes, use EKS, GKE or AKS with the same image and chart, where OpenSearch and RabbitMQ are managed only on AWS and are otherwise self-managed or bought from a marketplace. If no, a team that runs virtual machines uses EC2 Auto Scaling groups with one worker instance for cron and consumers, and a team that wants no servers uses ECS on Fargate on AWS. Cloud Run and Azure Container Apps are not recommended for Magento because of Varnish purging and long-running consumers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#f4b860">Where to run Pocket Coffee on Magento</text>

  <rect x="290" y="52" width="380" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="480" y="78" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Should Adobe operate the platform</text>
  <text x="480" y="98" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">under an Adobe Commerce licence?</text>

  <path d="M290 83 H150 V140" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="220" y="76" font-size="12" fill="#f4b860" text-anchor="middle">yes</text>
  <rect x="30" y="142" width="240" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="150" y="168" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Does the shop need in-process</text>
  <text x="150" y="188" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">PHP modules and Luma themes?</text>

  <path d="M90 204 V250" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="76" y="232" font-size="12" fill="#f4b860" text-anchor="end">yes</text>
  <rect x="20" y="252" width="190" height="104" rx="10" fill="#4d7c5a"/>
  <text x="115" y="278" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Adobe Commerce on</text>
  <text x="115" y="296" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">cloud infrastructure</text>
  <text x="115" y="320" font-size="12" fill="#f2f5f8" text-anchor="middle">PaaS: Adobe runs the</text>
  <text x="115" y="338" font-size="12" fill="#f2f5f8" text-anchor="middle">services, you ship code</text>

  <path d="M210 204 V250" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="224" y="232" font-size="12" fill="#9fd3c7">no</text>
  <rect x="220" y="252" width="190" height="104" rx="10" fill="#4d7c5a"/>
  <text x="315" y="278" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Adobe Commerce as a</text>
  <text x="315" y="296" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Cloud Service (ACCS)</text>
  <text x="315" y="320" font-size="12" fill="#f2f5f8" text-anchor="middle">SaaS: out-of-process</text>
  <text x="315" y="338" font-size="12" fill="#f2f5f8" text-anchor="middle">extensions, headless</text>

  <path d="M670 83 H800 V140" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="740" y="76" font-size="12" fill="#9fd3c7" text-anchor="middle">no: we operate it</text>
  <rect x="640" y="142" width="290" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="785" y="168" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Does a platform team already</text>
  <text x="785" y="188" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">run Kubernetes?</text>

  <path d="M640 173 H600 V250" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="166" font-size="12" fill="#f4b860" text-anchor="middle">yes</text>
  <rect x="440" y="252" width="320" height="132" rx="10" fill="#3f6e9a"/>
  <text x="600" y="278" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Kubernetes: same image and chart</text>
  <text x="600" y="302" font-size="12" fill="#f2f5f8" text-anchor="middle">EKS: RDS, ElastiCache Valkey,</text>
  <text x="600" y="320" font-size="12" fill="#f2f5f8" text-anchor="middle">OpenSearch Service, Amazon MQ</text>
  <text x="600" y="342" font-size="12" fill="#f2f5f8" text-anchor="middle">GKE or AKS: managed database and cache,</text>
  <text x="600" y="360" font-size="12" fill="#f2f5f8" text-anchor="middle">self-managed or marketplace search and RabbitMQ</text>

  <path d="M830 204 V250" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="846" y="232" font-size="12" fill="#9fd3c7">no</text>
  <rect x="780" y="252" width="160" height="46" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="860" y="280" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Who runs servers?</text>

  <path d="M800 298 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M900 298 V340 H900 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="670" y="412" width="190" height="112" rx="10" fill="#7a5c3a"/>
  <text x="765" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">EC2 Auto Scaling groups</text>
  <text x="765" y="460" font-size="12" fill="#f2f5f8" text-anchor="middle">web group, Varnish group,</text>
  <text x="765" y="478" font-size="12" fill="#f2f5f8" text-anchor="middle">one worker instance for</text>
  <text x="765" y="496" font-size="12" fill="#f2f5f8" text-anchor="middle">cron and consumers</text>
  <rect x="870" y="412" width="80" height="112" rx="10" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="910" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ECS on</text>
  <text x="910" y="456" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Fargate</text>
  <text x="910" y="480" font-size="11" fill="#f2f5f8" text-anchor="middle">no servers,</text>
  <text x="910" y="496" font-size="11" fill="#f2f5f8" text-anchor="middle">AWS only</text>

  <rect x="30" y="412" width="610" height="112" rx="10" fill="#33485c" stroke="#c9b3e6" stroke-width="2"/>
  <text x="48" y="438" font-size="13" font-weight="bold" fill="#c9b3e6">Not recommended for Magento</text>
  <text x="48" y="462" font-size="12" fill="#f2f5f8">Cloud Run and Azure Container Apps: no stable pod addresses for purging every Varnish replica,</text>
  <text x="48" y="480" font-size="12" fill="#f2f5f8">consumers are long-running processes that do not fit request-driven scaling, and every one still needs</text>
  <text x="48" y="498" font-size="12" fill="#f2f5f8">the shared media file system. Use GKE or AKS on those clouds.</text>
</svg>
