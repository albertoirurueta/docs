<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-getting-started-object-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The five objects of every three.js program</text>
<rect x="20" y="60" width="160" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="86.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Scene</text>
<text x="100.0" y="101.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">container of the world</text>
<rect x="300" y="50" width="200" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400.0" y="80.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Mesh (Object3D)</text>
<rect x="300" y="125" width="95" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="347.5" y="146.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Geometry</text>
<text x="347.5" y="161.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">BoxGeometry</text>
<rect x="405" y="125" width="95" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="452.5" y="146.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Material</text>
<text x="452.5" y="161.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MeshStandard</text>
<line x1="350" y1="102" x2="350" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<line x1="450" y1="102" x2="450" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<line x1="300" y1="76" x2="180" y2="86" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<text x="240" y="70" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">add(mesh)</text>
<rect x="20" y="160" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="100.0" y="186.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">PerspectiveCamera</text>
<text x="100.0" y="201.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">fov, aspect, near, far</text>
<rect x="560" y="60" width="180" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="86.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">WebGLRenderer</text>
<text x="650.0" y="101.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">owns the canvas</text>
<rect x="560" y="160" width="180" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="181.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">canvas (DOM)</text>
<text x="650.0" y="196.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">domElement</text>
<line x1="650" y1="120" x2="650" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<rect x="250" y="260" width="260" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="286.6" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">renderer.render(scene, camera)</text>
<text x="380.0" y="302.6" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">one call draws a frame</text>
<line x1="100" y1="120" x2="300" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<line x1="100" y1="220" x2="250" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<line x1="510" y1="290" x2="650" y2="212" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-object-model)"/>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Geometry holds vertex data, Material holds shading state, Mesh pairs them and gets a transform.</text>
<text x="380" y="368" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The camera is also an Object3D and only matters when it is passed to render.</text>
<text x="380" y="392" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Everything above runs on the main thread; the GPU work happens inside render.</text>
</svg>
