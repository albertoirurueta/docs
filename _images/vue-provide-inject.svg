<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="#ffffff"/>

  <defs>
    <marker id="pi-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="pi-orange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="185" y="30" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Prop drilling</text>
  <text x="540" y="30" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">provide / inject</text>
  <line x1="360" y1="42" x2="360" y2="462" stroke="#cccccc" stroke-width="1"/>

  <!-- LEFT: drilling -->
  <rect x="70" y="48" width="230" height="46" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="185" y="70" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">App</text>
  <text x="185" y="86" font-size="10.5" fill="#1c4b73" text-anchor="middle">owns user</text>

  <rect x="70" y="140" width="230" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="185" y="162" font-size="12.5" fill="#222222" text-anchor="middle">Layout</text>
  <text x="185" y="178" font-size="10.5" fill="#666666" text-anchor="middle">props: user  (just forwards)</text>

  <rect x="70" y="232" width="230" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="185" y="254" font-size="12.5" fill="#222222" text-anchor="middle">Sidebar</text>
  <text x="185" y="270" font-size="10.5" fill="#666666" text-anchor="middle">props: user  (just forwards)</text>

  <rect x="70" y="324" width="230" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="185" y="346" font-size="12.5" fill="#222222" text-anchor="middle">UserMenu</text>
  <text x="185" y="362" font-size="10.5" fill="#666666" text-anchor="middle">props: user  (just forwards)</text>

  <rect x="70" y="416" width="230" height="46" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="185" y="438" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Avatar</text>
  <text x="185" y="454" font-size="10.5" fill="#1c4b73" text-anchor="middle">needs user</text>

  <line x1="185" y1="94" x2="185" y2="138" stroke="#2f6fa8" stroke-width="2" marker-end="url(#pi-blue)"/>
  <line x1="185" y1="186" x2="185" y2="230" stroke="#2f6fa8" stroke-width="2" marker-end="url(#pi-blue)"/>
  <line x1="185" y1="278" x2="185" y2="322" stroke="#2f6fa8" stroke-width="2" marker-end="url(#pi-blue)"/>
  <line x1="185" y1="370" x2="185" y2="414" stroke="#2f6fa8" stroke-width="2" marker-end="url(#pi-blue)"/>
  <text x="199" y="120" font-size="10" fill="#2f6fa8">:user</text>
  <text x="199" y="212" font-size="10" fill="#2f6fa8">:user</text>
  <text x="199" y="304" font-size="10" fill="#2f6fa8">:user</text>
  <text x="199" y="396" font-size="10" fill="#2f6fa8">:user</text>

  <!-- RIGHT: provide / inject -->
  <rect x="425" y="48" width="230" height="46" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="540" y="70" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">App</text>
  <text x="540" y="86" font-size="10.5" fill="#1c4b73" text-anchor="middle">provide('user', user)</text>

  <rect x="425" y="140" width="230" height="46" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.2"/>
  <text x="540" y="167" font-size="12.5" fill="#888888" text-anchor="middle">Layout   (untouched)</text>

  <rect x="425" y="232" width="230" height="46" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.2"/>
  <text x="540" y="259" font-size="12.5" fill="#888888" text-anchor="middle">Sidebar   (untouched)</text>

  <rect x="425" y="324" width="230" height="46" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.2"/>
  <text x="540" y="351" font-size="12.5" fill="#888888" text-anchor="middle">UserMenu   (untouched)</text>

  <rect x="425" y="416" width="230" height="46" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="540" y="438" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Avatar</text>
  <text x="540" y="454" font-size="10.5" fill="#1c4b73" text-anchor="middle">inject('user')</text>

  <line x1="540" y1="94" x2="540" y2="138" stroke="#cccccc" stroke-width="1.2"/>
  <line x1="540" y1="186" x2="540" y2="230" stroke="#cccccc" stroke-width="1.2"/>
  <line x1="540" y1="278" x2="540" y2="322" stroke="#cccccc" stroke-width="1.2"/>
  <line x1="540" y1="370" x2="540" y2="414" stroke="#cccccc" stroke-width="1.2"/>

  <path d="M655 71 C 693 71, 693 439, 655 439" fill="none" stroke="#c25a1d" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#pi-orange)"/>
  <text x="681" y="255" font-size="10.5" font-weight="bold" fill="#c25a1d" text-anchor="middle" transform="rotate(90 681 255)">provided value, injected directly</text>

  <text x="360" y="476" font-size="11.5" fill="#444444" text-anchor="middle">Same component tree; provide/inject skips every intermediate component.</text>
</svg>
