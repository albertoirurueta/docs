<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: a safe Bookshelf redesign on a branch</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 named version -->
  <rect x="28" y="96" width="108" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/><text x="82" y="113" font-size="11" fill="#3730A3" text-anchor="middle">Bookshelf v1 home</text>
  <rect x="28" y="132" width="108" height="26" rx="5" fill="#F9FAFB" stroke="#E5E7EB"/><text x="82" y="149" font-size="11" fill="#6B7280" text-anchor="middle">Autosave 10:30</text>
  <rect x="28" y="168" width="108" height="26" rx="5" fill="#F9FAFB" stroke="#E5E7EB"/><text x="82" y="185" font-size="11" fill="#6B7280" text-anchor="middle">Autosave 10:00</text>
  <!-- 2 create branch -->
  <rect x="180" y="96" width="108" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="234" y="115" font-size="11" fill="#374151" text-anchor="middle">Bookshelf v</text>
  <rect x="180" y="134" width="108" height="26" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="234" y="151" font-size="11" fill="#3730A3" text-anchor="middle">Create branch...</text>
  <rect x="180" y="172" width="108" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/><text x="234" y="189" font-size="11" fill="#6B7280" text-anchor="middle">name: new-cards</text>
  <!-- 3 edit on branch -->
  <rect x="332" y="86" width="108" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="386" y="101" font-size="10" fill="#92400E" text-anchor="middle">Bookshelf / new-cards</text>
  <rect x="332" y="120" width="50" height="70" rx="4" fill="#E5E7EB"/><rect x="390" y="120" width="50" height="70" rx="4" fill="#E5E7EB"/><rect x="332" y="198" width="108" height="26" rx="6" fill="#4F46E5"/><text x="386" y="215" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- 4 review -->
  <rect x="484" y="90" width="108" height="60" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="490" y="98" width="46" height="44" fill="#E5E7EB"/><rect x="540" y="98" width="46" height="44" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="484" y="162" width="108" height="24" rx="12" fill="#D1FAE5" stroke="#047857"/><text x="538" y="178" font-size="11" fill="#047857" text-anchor="middle">Approved</text>
  <!-- 5 merged -->
  <rect x="636" y="96" width="96" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/><text x="684" y="113" font-size="10" fill="#3730A3" text-anchor="middle">Merged: new-cards</text>
  <rect x="636" y="132" width="96" height="26" rx="5" fill="#F9FAFB" stroke="#E5E7EB"/><text x="684" y="149" font-size="10" fill="#6B7280" text-anchor="middle">Checkpoint</text>
  <rect x="636" y="168" width="96" height="26" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="684" y="185" font-size="10" fill="#6B7280" text-anchor="middle">Branch archived</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Save a named</text><text x="82" y="338">version of main</text><text x="234" y="322">Create a branch</text><text x="234" y="338">from the file menu</text><text x="386" y="322">Redesign the cards</text><text x="386" y="338">on the branch only</text><text x="538" y="322">Request a review,</text><text x="538" y="338">reviewer approves</text><text x="684" y="322">Merge into main,</text><text x="684" y="338">branch archived</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked against the Figma Learn branching articles on 2026-10-30.</text>
</svg>
