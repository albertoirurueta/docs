<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Box model as the Webflow Style panel shows it: margin, border, padding and content, with the Size section controls">
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="260" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">Box model of one element</text>
<rect x="20" y="46" width="480" height="400" rx="6" fill="#FDEBD3" stroke="#B26A00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="36" y="70" font-size="15" font-weight="700" fill="#7A4800">margin (Spacing section)</text>
<rect x="60" y="90" width="400" height="320" fill="#FAD7A0" stroke="#0B4F6C" stroke-width="3"/>
<text x="76" y="114" font-size="15" font-weight="700" fill="#0B4F6C">border (Borders section)</text>
<rect x="95" y="130" width="330" height="250" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2" stroke-dasharray="6 4"/>
<text x="111" y="154" font-size="15" font-weight="700" fill="#1B5E20">padding (Spacing section)</text>
<rect x="140" y="170" width="240" height="160" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="260" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">content</text>
<text x="260" y="262" text-anchor="middle" font-size="13" fill="#0B4F6C">width x height</text>
<text x="260" y="282" text-anchor="middle" font-size="13" fill="#0B4F6C">(Size section)</text>
<text x="260" y="366" text-anchor="middle" font-size="13" fill="#1B5E20">padding-top / right / bottom / left</text>
<text x="260" y="432" text-anchor="middle" font-size="13" fill="#7A4800">margin-top / right / bottom / left</text>
<text x="560" y="70" font-size="18" font-weight="700" fill="#0B4F6C">Webflow default: box-sizing border-box</text>
<rect x="560" y="90" width="320" height="38" rx="6" fill="#E6F4F2" stroke="#0B4F6C"/>
<text x="574" y="114" font-size="14" fill="#0B4F6C">width: 300px includes padding and border</text>
<rect x="560" y="138" width="320" height="38" rx="6" fill="#E6F4F2" stroke="#0B4F6C"/>
<text x="574" y="162" font-size="14" fill="#0B4F6C">margin is always outside the width</text>
<text x="560" y="214" font-size="18" font-weight="700" fill="#0B4F6C">With content-box (Size section)</text>
<rect x="560" y="234" width="320" height="38" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="574" y="258" font-size="14" fill="#333333">width: 300px is the content only</text>
<rect x="560" y="282" width="320" height="38" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="574" y="306" font-size="14" fill="#333333">padding + border are added to 300px</text>
<text x="560" y="358" font-size="18" font-weight="700" fill="#0B4F6C">Example: Fernbrook card</text>
<text x="560" y="384" font-size="14" fill="#333333">width 300 px, padding 24 px, border 1 px</text>
<text x="560" y="406" font-size="14" fill="#333333">border-box: painted width 300 px</text>
<text x="560" y="428" font-size="14" fill="#333333">content-box: painted width 350 px</text>
</svg>
