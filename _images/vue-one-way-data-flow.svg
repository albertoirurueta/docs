<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <defs>
    <marker id="vodf-down" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="vodf-up" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One-way data flow</text>

  <!-- Parent -->
  <rect x="258" y="46" width="204" height="70" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="360" y="76" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;PostList&gt;</text>
  <text x="360" y="97" font-size="12" fill="#1c4b73" text-anchor="middle">owns posts, fontSize</text>

  <!-- Child A -->
  <rect x="66" y="234" width="224" height="80" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="178" y="264" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;BlogPost&gt;</text>
  <text x="178" y="285" font-size="12" fill="#1c4b73" text-anchor="middle">reads its props</text>
  <text x="178" y="302" font-size="12" fill="#1c4b73" text-anchor="middle">emits to change parent</text>

  <!-- Child B -->
  <rect x="430" y="234" width="224" height="80" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="542" y="264" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;BlogPost&gt;</text>
  <text x="542" y="285" font-size="12" fill="#1c4b73" text-anchor="middle">separate instance</text>
  <text x="542" y="302" font-size="12" fill="#1c4b73" text-anchor="middle">own props and state</text>

  <!-- props down (blue solid) -->
  <line x1="296" y1="118" x2="176" y2="230" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vodf-down)"/>
  <line x1="424" y1="118" x2="544" y2="230" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vodf-down)"/>
  <text x="196" y="172" font-size="13" font-weight="bold" fill="#2f6fa8" text-anchor="middle" transform="rotate(-43 196 172)">props down</text>
  <text x="524" y="172" font-size="13" font-weight="bold" fill="#2f6fa8" text-anchor="middle" transform="rotate(43 524 172)">props down</text>

  <!-- emit up (orange dashed) -->
  <line x1="232" y1="230" x2="324" y2="120" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#vodf-up)"/>
  <line x1="488" y1="230" x2="396" y2="120" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#vodf-up)"/>
  <text x="300" y="196" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle" transform="rotate(-49 300 196)">emit up</text>
  <text x="420" y="196" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle" transform="rotate(49 420 196)">emit up</text>

  <text x="360" y="344" font-size="12.5" fill="#444444" text-anchor="middle">Props are read-only in the child; it changes parent state only by emitting an event the parent listens for.</text>
  <text x="360" y="364" font-size="12.5" fill="#444444" text-anchor="middle">Every &lt;BlogPost&gt; use is an independent instance with its own props and local state.</text>
</svg>
