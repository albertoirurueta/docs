<svg width="940" height="520" viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Headless architecture: editors publish in the CMS, the Content Delivery API caches reads, a server-side Next.js app renders pages and a webhook triggers revalidation; browsers never hold tokens">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="940" height="520" fill="#FFFFFF"/>
<text x="470" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">Headless reader: where tokens live and how content flows</text>
<rect x="20" y="60" width="200" height="110" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="120" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Editors</text>
<text x="120" y="114" text-anchor="middle" font-size="13" fill="#0B4F6C">write Journal items</text>
<text x="120" y="134" text-anchor="middle" font-size="13" fill="#0B4F6C">in the CMS, then publish</text>
<rect x="290" y="60" width="200" height="110" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="390" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Data API</text>
<text x="390" y="114" text-anchor="middle" font-size="13" fill="#0B4F6C">api host, never cached</text>
<text x="390" y="134" text-anchor="middle" font-size="13" fill="#0B4F6C">staged and live items</text>
<rect x="290" y="210" width="200" height="110" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="390" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Content Delivery API</text>
<text x="390" y="264" text-anchor="middle" font-size="13" fill="#0B4F6C">api-cdn host, live items only</text>
<text x="390" y="284" text-anchor="middle" font-size="13" fill="#0B4F6C">cached 120 or 300 seconds</text>
<rect x="560" y="140" width="200" height="140" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="660" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">Next.js server</text>
<text x="660" y="194" text-anchor="middle" font-size="13" fill="#1B5E20">holds the read-only token</text>
<text x="660" y="214" text-anchor="middle" font-size="13" fill="#1B5E20">ISR page cache, tags</text>
<text x="660" y="234" text-anchor="middle" font-size="13" fill="#1B5E20">webhook route, draft mode</text>
<text x="660" y="254" text-anchor="middle" font-size="13" fill="#1B5E20">sanitizes rich text</text>
<rect x="770" y="380" width="150" height="100" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="845" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4800">Browser</text>
<text x="845" y="434" text-anchor="middle" font-size="13" fill="#7A4800">receives HTML only</text>
<text x="845" y="454" text-anchor="middle" font-size="13" fill="#7A4800">no token, no CORS call</text>
<rect x="560" y="380" width="200" height="100" rx="8" fill="#F4F4F4" stroke="#555555" stroke-width="2"/>
<text x="660" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Image CDN</text>
<text x="660" y="434" text-anchor="middle" font-size="13" fill="#333333">asset URLs from fieldData,</text>
<text x="660" y="454" text-anchor="middle" font-size="13" fill="#333333">public and unauthenticated</text>
<rect x="20" y="380" width="480" height="100" rx="8" fill="#F4F4F4" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="260" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Hybrid option</text>
<text x="260" y="434" text-anchor="middle" font-size="13" fill="#333333">the marketing site stays on Webflow hosting;</text>
<text x="260" y="454" text-anchor="middle" font-size="13" fill="#333333">the headless app serves one path or sub-domain</text>
<line x1="220" y1="115" x2="288" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="254" y="106" text-anchor="middle" font-size="11" fill="#333333">publish</text>
<line x1="490" y1="130" x2="558" y2="170" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="540" y="132" text-anchor="middle" font-size="11" fill="#333333">drafts</text>
<line x1="490" y1="265" x2="558" y2="245" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="525" y="268" text-anchor="middle" font-size="11" fill="#333333">live reads</text>
<path d="M 220 150 C 400 175, 420 200, 400 208" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="760" y1="250" x2="830" y2="378" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="822" y="310" text-anchor="middle" font-size="11" fill="#333333">HTML</text>
<line x1="660" y1="280" x2="660" y2="378" stroke="#333333" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<path d="M 290 90 C 250 40, 700 40, 660 138" fill="none" stroke="#B26A00" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="56" text-anchor="middle" font-size="12" fill="#7A4800">webhook: collection_item_published, then revalidate by tag</text>
</svg>
