<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Rate limiter cycles: permits over time (limitForPeriod = 3)</text>
  <defs>
    <marker id="rc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- cycle bands -->
  <rect x="70" y="50" width="240" height="190" fill="#f4f4f4"/>
  <rect x="310" y="50" width="240" height="190" fill="#e9eef3"/>
  <rect x="550" y="50" width="240" height="190" fill="#f4f4f4"/>
  <text x="190" y="66" font-size="11.5" fill="#444444" text-anchor="middle">cycle 0</text>
  <text x="430" y="66" font-size="11.5" fill="#444444" text-anchor="middle">cycle 1</text>
  <text x="670" y="66" font-size="11.5" fill="#444444" text-anchor="middle">cycle 2</text>
  <line x1="310" y1="50" x2="310" y2="240" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="550" y1="50" x2="550" y2="240" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- y axis -->
  <line x1="70" y1="50" x2="70" y2="240" stroke="#666666" stroke-width="1.2"/>
  <line x1="70" y1="240" x2="800" y2="240" stroke="#666666" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <text x="62" y="97" font-size="11" fill="#444444" text-anchor="end">3</text>
  <text x="62" y="137" font-size="11" fill="#444444" text-anchor="end">2</text>
  <text x="62" y="177" font-size="11" fill="#444444" text-anchor="end">1</text>
  <text x="62" y="217" font-size="11" fill="#444444" text-anchor="end">0</text>
  <text x="62" y="237" font-size="11" fill="#b03030" text-anchor="end">-1</text>
  <line x1="66" y1="93" x2="790" y2="93" stroke="#cccccc" stroke-width="0.8"/>
  <line x1="66" y1="213" x2="790" y2="213" stroke="#cccccc" stroke-width="0.8"/>
  <text x="20" y="150" font-size="11" fill="#444444" transform="rotate(-90 20 150)" text-anchor="middle">available permits</text>
  <text x="800" y="258" font-size="11" fill="#444444" text-anchor="end">time</text>

  <!-- permit staircase: y = 213 - 40*permits -->
  <polyline fill="none" stroke="#1c4b73" stroke-width="2.4"
    points="70,93 100,93 100,133 150,133 150,173 200,173 200,213 250,213 250,233 310,233 310,133 380,133 380,173 550,173 550,93 610,93 610,133 790,133"/>

  <!-- requests -->
  <circle cx="100" cy="93" r="5" fill="#1c4b73"/>
  <circle cx="150" cy="133" r="5" fill="#1c4b73"/>
  <circle cx="200" cy="173" r="5" fill="#1c4b73"/>
  <circle cx="250" cy="213" r="5" fill="#ffffff" stroke="#b03030" stroke-width="2"/>
  <circle cx="380" cy="133" r="5" fill="#1c4b73"/>
  <circle cx="610" cy="93" r="5" fill="#1c4b73"/>

  <!-- wait bracket for the reserved call -->
  <line x1="250" y1="250" x2="310" y2="250" stroke="#b03030" stroke-width="1.6" marker-end="url(#rc-arrow)"/>
  <text x="280" y="268" font-size="10.5" fill="#b03030" text-anchor="middle">caller parked</text>
  <text x="280" y="281" font-size="10.5" fill="#b03030" text-anchor="middle">(nanosToWait)</text>

  <!-- annotations -->
  <text x="120" y="82" font-size="10.5" fill="#444444">requests 1 to 3 take a permit each</text>
  <text x="332" y="196" font-size="10.5" fill="#444444">cycle 1 starts at min(-1 + 3, 3) = 2:</text>
  <text x="332" y="209" font-size="10.5" fill="#444444">the borrowed permit is paid back</text>
  <text x="562" y="82" font-size="10.5" fill="#444444">idle: refill is capped at limitForPeriod</text>
  <text x="86" y="232" font-size="10.5" fill="#b03030">request 4 (open dot) borrows</text>

  <!-- explanation boxes -->
  <rect x="70" y="300" width="230" height="104" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="185" y="322" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">limitRefreshPeriod</text>
  <text x="185" y="342" font-size="11" fill="#222222" text-anchor="middle">length of a cycle. Cycles are</text>
  <text x="185" y="358" font-size="11" fill="#222222" text-anchor="middle">counted from the creation of</text>
  <text x="185" y="374" font-size="11" fill="#222222" text-anchor="middle">the limiter, not from the call.</text>
  <text x="185" y="394" font-size="10.5" fill="#666666" text-anchor="middle">default 500 ns (effectively no limit)</text>

  <rect x="335" y="300" width="230" height="104" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="450" y="322" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">limitForPeriod</text>
  <text x="450" y="342" font-size="11" fill="#222222" text-anchor="middle">permits added each cycle and</text>
  <text x="450" y="358" font-size="11" fill="#222222" text-anchor="middle">the ceiling of the counter.</text>
  <text x="450" y="374" font-size="11" fill="#222222" text-anchor="middle">Reservations push it below 0.</text>
  <text x="450" y="394" font-size="10.5" fill="#666666" text-anchor="middle">default 50</text>

  <rect x="600" y="300" width="230" height="104" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="715" y="322" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">timeoutDuration</text>
  <text x="715" y="342" font-size="11" fill="#222222" text-anchor="middle">longest a caller is parked.</text>
  <text x="715" y="358" font-size="11" fill="#222222" text-anchor="middle">If the wait would be longer,</text>
  <text x="715" y="374" font-size="11" fill="#222222" text-anchor="middle">RequestNotPermitted is thrown.</text>
  <text x="715" y="394" font-size="10.5" fill="#666666" text-anchor="middle">default 5 s</text>
</svg>
