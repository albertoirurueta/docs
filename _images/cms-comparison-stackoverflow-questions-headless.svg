<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="stackoverflow-questions-headless-t stackoverflow-questions-headless-d">
<title id="stackoverflow-questions-headless-t">Stack Overflow questions per year (headless)</title>
<desc id="stackoverflow-questions-headless-d">Questions asked each year on Stack Overflow with the tag of Contentful, Strapi, Sanity, Payload, 2018 to 2025. The number of questions asked on the whole site has fallen since 2023, so a falling line says little about the popularity of a CMS. The partial year 2026 is omitted.</desc>
