<svg viewBox="0 0 900 780" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ds-tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Data sources and query executers: two ways to hand rows to the fill engine</text>
  <rect x="300" y="44" width="300" height="66" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="450" y="64" text-anchor="middle" font-size="11" fill="#1f5fa6">&lt;&lt;interface&gt;&gt;</text>
  <text x="450" y="82" text-anchor="middle" font-size="13" font-family="Courier New, monospace" font-weight="700" fill="#333">JRDataSource</text>
  <text x="450" y="100" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">next(), getFieldValue(JRField)</text>
  <rect x="300" y="150" width="300" height="56" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#1f5fa6">&lt;&lt;interface&gt;&gt;</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#333">JRRewindableDataSource  moveFirst()</text>
  <line x1="450" y1="150" x2="450" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <rect x="30" y="138" width="230" height="106" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="145" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4800">read once, no moveFirst()</text>
  <text x="145" y="180" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRResultSetDataSource</text>
  <text x="145" y="200" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRCsvDataSource</text>
  <text x="145" y="220" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRHibernate*DataSource</text>
  <text x="145" y="238" text-anchor="middle" font-size="10" fill="#7a4800">(core, core, jasperreports-hibernate)</text>
  <line x1="145" y1="138" x2="298" y2="96" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <rect x="30" y="290" width="260" height="236" rx="6" fill="#e3f4e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="160" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#2b7a2b">jasperreports (core)</text>
  <text x="160" y="336" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRBeanCollectionDataSource</text>
  <text x="160" y="362" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRBeanArrayDataSource</text>
  <text x="160" y="388" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRMapCollectionDataSource</text>
  <text x="160" y="414" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRXmlDataSource</text>
  <text x="160" y="440" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JREmptyDataSource</text>
  <text x="160" y="490" text-anchor="middle" font-size="11" fill="#2b7a2b">bean, map and XML rows;</text>
  <text x="160" y="506" text-anchor="middle" font-size="11" fill="#2b7a2b">a JDBC ResultSet is not rewindable</text>
  <rect x="320" y="290" width="260" height="236" rx="6" fill="#e3f4e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="450" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#2b7a2b">extension modules</text>
  <text x="450" y="334" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JsonDataSource</text>
  <text x="450" y="349" text-anchor="middle" font-size="10" fill="#2b7a2b">jasperreports-json</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JsonQLDataSource</text>
  <text x="450" y="387" text-anchor="middle" font-size="10" fill="#2b7a2b">jasperreports-json</text>
  <text x="450" y="410" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">ExcelDataSource</text>
  <text x="450" y="425" text-anchor="middle" font-size="10" fill="#2b7a2b">jasperreports-excel-poi</text>
  <text x="450" y="448" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">FastExcelDataSource</text>
  <text x="450" y="463" text-anchor="middle" font-size="10" fill="#2b7a2b">jasperreports-fastexcel</text>
  <text x="450" y="486" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRJpaDataSource</text>
  <text x="450" y="501" text-anchor="middle" font-size="10" fill="#2b7a2b">jasperreports-ejbql</text>
  <rect x="610" y="290" width="260" height="236" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="740" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">your code</text>
  <text x="740" y="350" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">SaleStreamDataSource</text>
  <text x="740" y="368" text-anchor="middle" font-size="11" fill="#7a4800">implements</text>
  <text x="740" y="384" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRRewindableDataSource</text>
  <text x="740" y="418" text-anchor="middle" font-size="11" fill="#7a4800">wraps a Supplier of Iterator,</text>
  <text x="740" y="434" text-anchor="middle" font-size="11" fill="#7a4800">so moveFirst() just asks for</text>
  <text x="740" y="450" text-anchor="middle" font-size="11" fill="#7a4800">a new iterator</text>
  <line x1="160" y1="290" x2="390" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <line x1="450" y1="290" x2="450" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <line x1="740" y1="290" x2="510" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <line x1="30" y1="556" x2="870" y2="556" stroke="#bbb" stroke-dasharray="3 5"/>
  <text x="30" y="578" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Query executers: language="..." in the template picks a factory, the factory builds an executer, the executer builds the data source</text>
  <rect x="30" y="598" width="260" height="64" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="160" y="618" text-anchor="middle" font-size="11" fill="#1f5fa6">&lt;&lt;interface&gt;&gt;</text>
  <text x="160" y="636" text-anchor="middle" font-size="13" font-family="Courier New, monospace" font-weight="700" fill="#333">QueryExecuterFactory</text>
  <text x="160" y="653" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">createQueryExecuter(...)</text>
  <rect x="330" y="598" width="260" height="64" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="460" y="618" text-anchor="middle" font-size="11" fill="#1f5fa6">&lt;&lt;interface&gt;&gt;</text>
  <text x="460" y="636" text-anchor="middle" font-size="13" font-family="Courier New, monospace" font-weight="700" fill="#333">JRQueryExecuter</text>
  <text x="460" y="653" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">createDatasource(), close()</text>
  <rect x="660" y="598" width="210" height="64" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="765" y="624" text-anchor="middle" font-size="13" font-family="Courier New, monospace" font-weight="700" fill="#333">JRDataSource</text>
  <text x="765" y="644" text-anchor="middle" font-size="11" fill="#1f5fa6">the rows for the dataset</text>
  <line x1="290" y1="630" x2="328" y2="630" stroke="#555" stroke-width="1.5" marker-end="url(#ds-arrow)"/>
  <text x="309" y="622" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333"></text>
  <line x1="590" y1="630" x2="658" y2="630" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ds-arrow)"/>
  <text x="624" y="622" text-anchor="middle" font-size="10" fill="#333">returns</text>
  <rect x="30" y="692" width="260" height="50" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="160" y="712" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">SalesQueryExecuterFactory</text>
  <text x="160" y="729" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">extends AbstractQueryExecuterFactory</text>
  <rect x="330" y="692" width="260" height="50" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="460" y="712" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">SalesQueryExecuter</text>
  <text x="460" y="729" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">extends JRAbstractQueryExecuter</text>
  <line x1="160" y1="692" x2="160" y2="664" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <line x1="460" y1="692" x2="460" y2="664" stroke="#555" stroke-width="1.5" marker-end="url(#ds-tri)"/>
  <text x="765" y="708" text-anchor="middle" font-size="10" fill="#7a4800">registered in jasperreports.properties:</text>
  <text x="765" y="724" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#7a4800">...executer.factory.bookshelf</text>
</svg>
