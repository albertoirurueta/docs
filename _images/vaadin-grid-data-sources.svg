<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <defs>
    <marker id="vgds-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="vgds-orange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Grid data sources: in-memory vs. lazy loading</text>

  <!-- ===================== LEFT: in-memory ===================== -->
  <rect x="24" y="44" width="344" height="340" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="196" y="64" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">In-memory &#8212; setItems(Collection)</text>

  <!-- client window -->
  <rect x="48" y="78" width="296" height="50" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="196" y="99" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Browser &#8212; Grid scroll window</text>
  <text x="196" y="115" font-size="9.5" fill="#666666" text-anchor="middle">~20 rows visible</text>

  <!-- grid -->
  <rect x="48" y="144" width="296" height="48" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="196" y="164" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Grid + GridListDataView</text>
  <text x="196" y="181" font-size="9.5" fill="#1c4b73" text-anchor="middle">holds &amp; pages the full list</text>

  <!-- server -->
  <rect x="48" y="208" width="296" height="156" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="196" y="227" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Server / VaadinSession</text>
  <text x="196" y="242" font-size="9" fill="#666666" text-anchor="middle">loaded once via setItems(...)</text>

  <rect x="72" y="250" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="260" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="270" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="280" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="290" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="300" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="310" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="320" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="330" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <rect x="72" y="340" width="248" height="7" rx="1.5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="0.6"/>
  <text x="196" y="358" font-size="9.5" fill="#666666" text-anchor="middle">the whole item list sits in server memory</text>

  <!-- arrows -->
  <line x1="196" y1="143" x2="196" y2="129" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vgds-blue)"/>
  <line x1="196" y1="207" x2="196" y2="193" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vgds-blue)"/>

  <text x="196" y="378" font-size="10.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">sorting &amp; filtering happen in server memory</text>

  <!-- ===================== RIGHT: lazy ===================== -->
  <rect x="392" y="44" width="344" height="340" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="564" y="64" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Lazy &#8212; DataProvider / callbacks</text>

  <!-- client window -->
  <rect x="416" y="78" width="296" height="50" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="564" y="99" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Browser &#8212; Grid scroll window</text>
  <text x="564" y="115" font-size="9.5" fill="#666666" text-anchor="middle">~20 rows visible</text>

  <!-- grid -->
  <rect x="416" y="144" width="296" height="66" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="564" y="165" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Grid + GridLazyDataView</text>
  <text x="564" y="182" font-size="9.5" fill="#1c4b73" text-anchor="middle">keeps only the visible window</text>
  <text x="564" y="198" font-size="9" fill="#666666" text-anchor="middle">a few rows on the server</text>

  <!-- backend -->
  <rect x="416" y="270" width="296" height="94" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="564" y="290" font-size="11.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">Backend / database</text>
  <text x="564" y="306" font-size="9.5" fill="#8a3d13" text-anchor="middle">runs paging + ORDER BY + WHERE</text>
  <rect x="486" y="316" width="156" height="7" rx="1.5" fill="#f0d9c6" stroke="#c25a1d" stroke-width="0.6"/>
  <rect x="486" y="326" width="156" height="7" rx="1.5" fill="#f0d9c6" stroke="#c25a1d" stroke-width="0.6"/>
  <rect x="486" y="336" width="156" height="7" rx="1.5" fill="#f0d9c6" stroke="#c25a1d" stroke-width="0.6"/>
  <text x="564" y="357" font-size="9" fill="#8a3d13" text-anchor="middle">only the visible window is materialised</text>

  <!-- arrows -->
  <line x1="564" y1="143" x2="564" y2="129" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vgds-blue)"/>

  <line x1="486" y1="213" x2="486" y2="267" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vgds-blue)"/>
  <line x1="642" y1="267" x2="642" y2="213" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#vgds-orange)"/>
  <text x="480" y="228" font-size="8" fill="#2f6fa8" text-anchor="end">fetch</text>
  <text x="648" y="228" font-size="8" fill="#8a3d13" text-anchor="start">count</text>
  <text x="564" y="235" font-size="9" fill="#2f6fa8" text-anchor="middle">fetch(offset, limit, sortOrders)</text>
  <text x="564" y="251" font-size="9" fill="#8a3d13" text-anchor="middle">count(filter)</text>

  <text x="564" y="378" font-size="10.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">sorting &amp; filtering pushed to the backend query</text>

  <!-- caption -->
  <text x="380" y="406" font-size="10.5" fill="#444444" text-anchor="middle">In-memory holds the entire list server-side; lazy loading holds only the visible window and delegates sorting and filtering to the backend query.</text>
</svg>
