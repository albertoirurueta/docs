<rect x="14" y="214" width="732" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="235.0" text-anchor="middle" font-size="11" fill="#374151">Packages named com.example resolve to the scoped registry; every other name still comes from the Unity registry.</text>
<text x="380.0" y="250.0" text-anchor="middle" font-size="11" fill="#374151">Packages/manifest.json and packages-lock.json change: commit both so teammates and CI resolve the same versions.</text>
