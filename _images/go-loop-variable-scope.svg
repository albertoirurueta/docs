<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">for i := 0; i &lt; 3; i++ { fs = append(fs, func() { print(i) }) }</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the same loop under two language versions: what the three closures capture after the loop has finished</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <line x1="470" y1="64" x2="470" y2="400" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="82">go.mod says go 1.21 or older</text>
    <text x="705" y="82">go.mod says go 1.22 or newer</text>
  </g>
  <!-- old -->
  <g font-size="13" fill="#222222">
    <rect x="30" y="120" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="142">closure f1</text>
    <rect x="30" y="190" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="212">closure f2</text>
    <rect x="30" y="260" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="282">closure f3</text>
    <rect x="330" y="180" width="110" height="54" fill="#fdecea" stroke="#b3261e"/><text x="348" y="204" font-weight="bold">one i</text><text x="348" y="222">value 3</text>
  </g>
  <line x1="160" y1="137" x2="326" y2="198" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="160" y1="207" x2="326" y2="207" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="160" y1="277" x2="326" y2="216" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="235" y="330" font-size="12" fill="#444444" text-anchor="middle">one variable lives for the whole loop;</text>
  <text x="235" y="346" font-size="12" fill="#444444" text-anchor="middle">the post statement i++ changes it in place</text>
  <text x="235" y="372" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">calling f1, f2, f3 prints 3 3 3</text>
  <!-- new -->
  <g font-size="13" fill="#222222">
    <rect x="500" y="110" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="512" y="132">closure f1</text>
    <rect x="500" y="190" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="512" y="212">closure f2</text>
    <rect x="500" y="270" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="512" y="292">closure f3</text>
    <rect x="776" y="100" width="150" height="54" fill="#e9f5e9" stroke="#2e7d32"/><text x="788" y="124" font-weight="bold">i, 1st iteration</text><text x="788" y="142">value 0</text>
    <rect x="776" y="180" width="150" height="54" fill="#e9f5e9" stroke="#2e7d32"/><text x="788" y="204" font-weight="bold">i, 2nd iteration</text><text x="788" y="222">value 1</text>
    <rect x="776" y="260" width="150" height="54" fill="#e9f5e9" stroke="#2e7d32"/><text x="788" y="284" font-weight="bold">i, 3rd iteration</text><text x="788" y="302">value 2</text>
  </g>
  <line x1="630" y1="127" x2="772" y2="127" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="630" y1="207" x2="772" y2="207" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="630" y1="287" x2="772" y2="287" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="705" y="338" font-size="12" fill="#444444" text-anchor="middle">each iteration declares a fresh i; before the post statement runs the</text>
  <text x="705" y="354" font-size="12" fill="#444444" text-anchor="middle">next iteration's i is created and initialised from the previous value</text>
  <text x="705" y="380" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">calling f1, f2, f3 prints 0 1 2</text>
</svg>
