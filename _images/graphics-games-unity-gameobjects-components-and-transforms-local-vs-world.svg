<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-go-local-world" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="460" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Local and world space (top view, Y axis points at you)</text>
<line x1="60" y1="420" x2="440" y2="420" stroke="#B91C1C" stroke-width="2" marker-end="url(#ah-go-local-world)"/>
<text x="450" y="424" text-anchor="start" font-size="11" fill="#B91C1C">world X</text>
<line x1="60" y1="420" x2="60" y2="80" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-go-local-world)"/>
<text x="66" y="74" text-anchor="start" font-size="11" fill="#2563EB">world Z</text>
<line x1="60" y1="420" x2="228" y2="364" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 4"/>

<polygon points="189.1,364.2 247.3,397.8 266.9,363.8 208.7,330.2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="228" y="368" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Shelf</text>
<line x1="228" y1="364" x2="295.8963916567" y2="403.2" stroke="#B91C1C" stroke-width="2" marker-end="url(#ah-go-local-world)"/>
<text x="299.8963916567" y="417.2" text-anchor="start" font-size="11" fill="#B91C1C">local X</text>
<line x1="228" y1="364" x2="267.2" y2="296.10360834330004" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-go-local-world)"/>
<text x="273.2" y="294.10360834330004" text-anchor="start" font-size="11" fill="#2563EB">local Z</text>
<line x1="228" y1="364" x2="332.4974226119285" y2="295.00515477614283" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="323.4974226119285" y="286.00515477614283" width="18" height="18" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="348.4974226119285" y="299.00515477614283" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">Book (child)</text>
<rect x="430" y="60" width="310" height="330" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="585" y="84" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Same point, two descriptions</text>
<text x="445" y="112" text-anchor="start" font-size="12" fill="#1F2937">Shelf  (no parent)</text>
<text x="445" y="131" text-anchor="start" font-size="12" fill="#1F2937">position  (3, 0, 1)</text>
<text x="445" y="150" text-anchor="start" font-size="12" fill="#1F2937">rotation  (0, 30, 0)</text>
<text x="445" y="169" text-anchor="start" font-size="12" fill="#1F2937">scale  1</text>
<text x="445" y="205" text-anchor="start" font-size="12" fill="#92400E">Book  (child of Shelf)</text>
<text x="445" y="224" text-anchor="start" font-size="12" fill="#92400E">localPosition  (1, 0, 2)</text>
<text x="445" y="243" text-anchor="start" font-size="12" fill="#92400E">position  (4.87, 0, 2.23)</text>
<text x="445" y="262" text-anchor="start" font-size="12" fill="#92400E">localRotation  identity</text>
<text x="445" y="281" text-anchor="start" font-size="12" fill="#92400E">rotation  (0, 30, 0)</text>
<text x="445" y="320" text-anchor="start" font-size="11" fill="#374151">position = parent.TransformPoint(localPosition)</text>
<text x="445" y="337" text-anchor="start" font-size="11" fill="#374151">Inspector shows the local values.</text>
</svg>
