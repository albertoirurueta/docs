<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Telemetry signal flow: app -&gt; collector -&gt; backends</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">logs, metrics, and traces converge on one OTLP collector before fanning out</text>

  <!-- app box -->
  <rect x="30" y="80" width="150" height="260" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="105" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Quarkus app</text>
  <text x="105" y="140" font-size="10.5" fill="#333333" text-anchor="middle">Logs</text>
  <text x="46" y="156" font-size="9" fill="#555555">JSON console/file/</text>
  <text x="46" y="168" font-size="9" fill="#555555">syslog handler,</text>
  <text x="46" y="180" font-size="9" fill="#555555">trace/span-id MDC</text>

  <text x="105" y="212" font-size="10.5" fill="#333333" text-anchor="middle">Metrics</text>
  <text x="46" y="228" font-size="9" fill="#555555">Micrometer meters</text>
  <text x="46" y="240" font-size="9" fill="#555555">(HTTP/JVM/</text>
  <text x="46" y="252" font-size="9" fill="#555555">datasource binders,</text>
  <text x="46" y="264" font-size="9" fill="#555555">@Counted/@Timed)</text>

  <text x="105" y="296" font-size="10.5" fill="#333333" text-anchor="middle">Traces</text>
  <text x="46" y="312" font-size="9" fill="#555555">OpenTelemetry spans</text>
  <text x="46" y="324" font-size="9" fill="#555555">(HTTP/JDBC/Kafka/</text>
  <text x="46" y="336" font-size="9" fill="#555555">gRPC, @WithSpan)</text>

  <!-- arrows to collector -->
  <line x1="180" y1="150" x2="290" y2="180" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="180" y1="230" x2="290" y2="210" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="180" y1="310" x2="290" y2="240" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="220" y="165" font-size="8.5" fill="#666666">JSON lines</text>
  <text x="220" y="255" font-size="8.5" fill="#666666">OTLP push /</text>
  <text x="220" y="266" font-size="8.5" fill="#666666">Prometheus scrape</text>

  <!-- collector box -->
  <rect x="295" y="150" width="170" height="120" rx="6" fill="#fdf3e3" stroke="#8a5a13" stroke-width="1.4"/>
  <text x="380" y="176" font-size="13" font-weight="bold" fill="#8a5a13" text-anchor="middle">OTLP collector</text>
  <text x="380" y="196" font-size="9.5" fill="#555555" text-anchor="middle">(or direct scrape for</text>
  <text x="380" y="209" font-size="9.5" fill="#555555" text-anchor="middle">the Prometheus registry)</text>
  <text x="380" y="234" font-size="9" fill="#555555" text-anchor="middle">receives, batches, and</text>
  <text x="380" y="247" font-size="9" fill="#555555" text-anchor="middle">routes each signal kind</text>
  <text x="380" y="260" font-size="9" fill="#555555" text-anchor="middle">to its own backend</text>

  <!-- arrows to backends -->
  <line x1="465" y1="175" x2="580" y2="115" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="465" y1="210" x2="580" y2="210" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="465" y1="245" x2="580" y2="305" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- backend boxes -->
  <rect x="585" y="80" width="145" height="65" rx="6" fill="#f2eefb" stroke="#4a2d82" stroke-width="1.3"/>
  <text x="657" y="106" font-size="12" font-weight="bold" fill="#4a2d82" text-anchor="middle">Loki</text>
  <text x="657" y="124" font-size="9" fill="#555555" text-anchor="middle">log storage</text>

  <rect x="585" y="178" width="145" height="65" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="657" y="204" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Mimir / Prometheus</text>
  <text x="657" y="222" font-size="9" fill="#555555" text-anchor="middle">metrics storage</text>

  <rect x="585" y="276" width="145" height="65" rx="6" fill="#fbeeee" stroke="#8a2d2d" stroke-width="1.3"/>
  <text x="657" y="302" font-size="12" font-weight="bold" fill="#8a2d2d" text-anchor="middle">Tempo</text>
  <text x="657" y="320" font-size="9" fill="#555555" text-anchor="middle">trace storage</text>

  <!-- grafana -->
  <rect x="295" y="330" width="435" height="60" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="512" y="355" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Grafana</text>
  <text x="512" y="372" font-size="9.5" fill="#555555" text-anchor="middle">unified dashboards correlating logs, metrics, and traces by trace/span id</text>
  <line x1="657" y1="145" x2="512" y2="330" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="657" y1="243" x2="600" y2="330" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="657" y1="341" x2="657" y2="330" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>
</svg>
