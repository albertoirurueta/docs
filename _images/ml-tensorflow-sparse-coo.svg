<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
<title id="t">SparseTensor COO layout</title>
<desc id="d">A three by four matrix has non-zero values 10 at row 0 column 0, 20 at row 1 column 2 and 30 at row 2 column 3. A SparseTensor stores them as indices, values and dense_shape.</desc>
<rect x="1" y="1" width="718" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">SparseTensor: only the non-zero entries</text>
<g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
<rect x="40" y="60" width="48" height="40" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="64" y="86">10</text>
<rect x="88" y="60" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="112" y="86">0</text>
<rect x="136" y="60" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="160" y="86">0</text>
<rect x="184" y="60" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="208" y="86">0</text>
<rect x="40" y="100" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="64" y="126">0</text>
<rect x="88" y="100" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="112" y="126">0</text>
<rect x="136" y="100" width="48" height="40" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="160" y="126">20</text>
<rect x="184" y="100" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="208" y="126">0</text>
<rect x="40" y="140" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="64" y="166">0</text>
<rect x="88" y="140" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="112" y="166">0</text>
<rect x="136" y="140" width="48" height="40" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="160" y="166">0</text>
<rect x="184" y="140" width="48" height="40" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="208" y="166">30</text>
<text x="136" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">dense view, 3 x 4</text>
<text x="270" y="82" text-anchor="start">indices</text>
<text x="270" y="108" text-anchor="start" fill="#475569">[[0, 0], [1, 2], [2, 3]]</text>
<text x="270" y="140" text-anchor="start">values</text>
<text x="270" y="164" text-anchor="start" fill="#475569">[10.0, 20.0, 30.0]</text>
<text x="270" y="196" text-anchor="start">dense_shape</text>
<text x="270" y="220" text-anchor="start" fill="#475569">[3, 4]</text>
</g>
</svg>
