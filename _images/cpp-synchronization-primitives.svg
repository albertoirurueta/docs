<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>

  <g font-size="12">
    <rect x="10" y="10" width="210" height="60" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" font-weight="bold" fill="#1c4b73">mutex / lock_guard</text>
    <text x="115" y="52" text-anchor="middle" font-size="10" fill="#1c4b73">mutual exclusion: one thread</text>
    <text x="115" y="64" text-anchor="middle" font-size="10" fill="#1c4b73">in the critical section at a time</text>

    <rect x="240" y="10" width="210" height="60" rx="6" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
    <text x="345" y="32" text-anchor="middle" font-weight="bold" fill="#2a6636">shared_mutex</text>
    <text x="345" y="52" text-anchor="middle" font-size="10" fill="#2a6636">many readers OR one writer,</text>
    <text x="345" y="64" text-anchor="middle" font-size="10" fill="#2a6636">never both at once</text>

    <rect x="470" y="10" width="210" height="60" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
    <text x="575" y="32" text-anchor="middle" font-weight="bold" fill="#6b4207">condition_variable</text>
    <text x="575" y="52" text-anchor="middle" font-size="10" fill="#6b4207">block until notified AND a</text>
    <text x="575" y="64" text-anchor="middle" font-size="10" fill="#6b4207">predicate becomes true</text>

    <rect x="10" y="90" width="210" height="60" rx="6" fill="#fddede" stroke="#a83a3a" stroke-width="2"/>
    <text x="115" y="112" text-anchor="middle" font-weight="bold" fill="#7a2323">latch</text>
    <text x="115" y="132" text-anchor="middle" font-size="10" fill="#7a2323">one-shot countdown to zero,</text>
    <text x="115" y="144" text-anchor="middle" font-size="10" fill="#7a2323">then permanently open</text>

    <rect x="240" y="90" width="210" height="60" rx="6" fill="#e6d7f5" stroke="#6c3fa8" stroke-width="2"/>
    <text x="345" y="112" text-anchor="middle" font-weight="bold" fill="#4a2a73">barrier</text>
    <text x="345" y="132" text-anchor="middle" font-size="10" fill="#4a2a73">rendezvous point, reusable</text>
    <text x="345" y="144" text-anchor="middle" font-size="10" fill="#4a2a73">for repeated phased work</text>

    <rect x="470" y="90" width="210" height="60" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
    <text x="575" y="112" text-anchor="middle" font-weight="bold" fill="#444">counting_semaphore</text>
    <text x="575" y="132" text-anchor="middle" font-size="10" fill="#444">caps how many threads may</text>
    <text x="575" y="144" text-anchor="middle" font-size="10" fill="#444">hold a limited resource at once</text>
  </g>

  <text x="350" y="220" text-anchor="middle" font-size="13" fill="#333">Pick the primitive that matches the actual coordination need --</text>
  <text x="350" y="240" text-anchor="middle" font-size="13" fill="#333">a mutex protecting shared state is not the same problem as</text>
  <text x="350" y="260" text-anchor="middle" font-size="13" fill="#333">"wait for N workers to finish" or "let at most N threads in".</text>
</svg>
