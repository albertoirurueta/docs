<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Take the launch deck offline and sync it back</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1 online menu -->
  <rect x="26" y="90" width="112" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="34" y="105" font-size="11" fill="#374151">Launch deck</text>
  <rect x="40" y="124" width="98" height="76" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="48" y="132" width="82" height="14" rx="3" fill="#E5E7EB"/><rect x="48" y="152" width="82" height="14" rx="3" fill="#4F46E5"/><text x="89" y="163" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Make available</text>
  <rect x="48" y="172" width="82" height="14" rx="3" fill="#E5E7EB"/>
  <text x="82" y="228" font-size="11" fill="#6B7280" text-anchor="middle">Online, signed in</text>
  <!-- panel 2 progress -->
  <rect x="182" y="100" width="104" height="14" rx="7" fill="#E5E7EB"/><rect x="182" y="100" width="76" height="14" rx="7" fill="#4F46E5"/>
  <text x="234" y="140" font-size="11" fill="#374151" text-anchor="middle">Design is being prepared</text>
  <rect x="190" y="164" width="88" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="234" y="188" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Ready for offline</text>
  <!-- panel 3 offline edit -->
  <rect x="334" y="88" width="104" height="20" rx="10" fill="#FEF3C7" stroke="#B45309"/><text x="386" y="102" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Offline</text>
  <rect x="338" y="120" width="96" height="86" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="346" y="130" width="60" height="10" rx="2" fill="#4F46E5"/><rect x="346" y="148" width="80" height="6" rx="2" fill="#9CA3AF"/><rect x="346" y="160" width="70" height="6" rx="2" fill="#9CA3AF"/>
  <text x="386" y="232" font-size="11" fill="#374151" text-anchor="middle">Changes saved to device</text>
  <!-- panel 4 syncing -->
  <rect x="486" y="88" width="104" height="20" rx="10" fill="#EEF2FF" stroke="#4F46E5"/><text x="538" y="102" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Back online</text>
  <path d="M520,150 a18,18 0 1 1 18,18" fill="none" stroke="#4F46E5" stroke-width="3" marker-end="url(#ah)"/>
  <text x="538" y="202" font-size="11" fill="#374151" text-anchor="middle">Syncing changes</text>
  <text x="538" y="232" font-size="11" fill="#6B7280" text-anchor="middle">Keep Canva open</text>
  <!-- panel 5 result -->
  <circle cx="684" cy="140" r="26" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <path d="M672,140 L681,150 L698,128" fill="none" stroke="#92400E" stroke-width="4"/>
  <text x="684" y="196" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">All changes synced</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Make the deck</text><text x="82" y="338">available offline</text><text x="234" y="322">Wait for the</text><text x="234" y="338">confirmation</text><text x="386" y="322">Edit existing</text><text x="386" y="338">pages offline</text><text x="538" y="322">Reconnect and</text><text x="538" y="338">stay online</text><text x="684" y="322">Result</text><text x="684" y="338">edits are in the cloud</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
