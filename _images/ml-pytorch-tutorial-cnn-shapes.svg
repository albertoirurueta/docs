<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="t d">
<title id="t">Tensor shapes through the CIFAR-10 CNN</title>
<desc id="d">A 3 by 32 by 32 image passes through a 5 by 5 convolution to 6 by 28 by 28, max pooling to 6 by 14 by 14, a second convolution to 16 by 10 by 10, pooling to 16 by 5 by 5, flattening to 400 values, and fully connected layers of 120, 84 and 10 outputs.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="238" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Shapes through the tutorial network (one image)</text>
<rect x="14" y="70" width="64" height="70" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="46.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">input</text>
<text x="46.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">3x32x32</text>
<line x1="78" y1="105" x2="88" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="89" y="70" width="64" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="121.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">conv 5x5</text>
<text x="121.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">6x28x28</text>
<line x1="153" y1="105" x2="163" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="164" y="70" width="64" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="196.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pool 2x2</text>
<text x="196.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">6x14x14</text>
<line x1="228" y1="105" x2="238" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="239" y="70" width="64" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="271.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">conv 5x5</text>
<text x="271.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">16x10x10</text>
<line x1="303" y1="105" x2="313" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="314" y="70" width="64" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="346.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pool 2x2</text>
<text x="346.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">16x5x5</text>
<line x1="378" y1="105" x2="388" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="389" y="70" width="64" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="421.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">flatten</text>
<text x="421.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">400</text>
<line x1="453" y1="105" x2="463" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="464" y="70" width="64" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="496.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fc 120</text>
<text x="496.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">120</text>
<line x1="528" y1="105" x2="538" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="539" y="70" width="64" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="571.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fc 84</text>
<text x="571.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">84</text>
<line x1="603" y1="105" x2="613" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="614" y="70" width="64" height="70" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="646.0" y="96" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fc 10</text>
<text x="646.0" y="120" font-size="10" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">10</text>
<text x="20" y="176" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Each conv layer is followed by ReLU. A 5x5 convolution without padding shrinks each side by 4; 2x2 pooling halves it.</text>
<text x="20" y="198" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">The 400 = 16 x 5 x 5 inputs of the first linear layer must match the conv output; the last layer outputs 10 logits.</text>
<text x="20" y="220" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Redrawn from the architecture in the PyTorch CIFAR-10 tutorial.</text>
</svg>
