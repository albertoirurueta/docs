<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Express layer stack</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">Express is a thin layer of modules between your code and node:http</text>

  <rect x="60" y="62" width="400" height="66" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="260" y="86" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Your code</text>
  <text x="260" y="104" font-size="11" fill="#444444" text-anchor="middle">route handlers, middleware, error handlers, services</text>
  <text x="260" y="120" font-size="10" fill="#666666" text-anchor="middle">the Bookshelf API lives here</text>

  <rect x="60" y="144" width="400" height="66" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="260" y="168" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Express application and router</text>
  <text x="260" y="186" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">express(), app.use(), app.get(), Router()</text>
  <text x="260" y="202" font-size="10" fill="#666666" text-anchor="middle">the router and path-to-regexp match layers in order</text>

  <rect x="60" y="226" width="400" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="260" y="250" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Building-block modules</text>
  <text x="260" y="268" font-size="11" fill="#444444" text-anchor="middle">body-parser, serve-static, send, finalhandler,</text>
  <text x="260" y="283" font-size="11" fill="#444444" text-anchor="middle">proxy-addr, qs, cookie, parseurl, content-type</text>
  <text x="260" y="302" font-size="10" fill="#666666" text-anchor="middle">small packages from expressjs, pillarjs and jshttp</text>

  <rect x="60" y="328" width="400" height="66" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="260" y="352" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">node:http</text>
  <text x="260" y="370" font-size="11" fill="#444444" text-anchor="middle">IncomingMessage and ServerResponse, request parsing</text>
  <text x="260" y="386" font-size="10" fill="#666666" text-anchor="middle">the app function is the request listener</text>

  <rect x="60" y="410" width="400" height="44" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="260" y="429" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Node.js runtime and libuv</text>
  <text x="260" y="445" font-size="11" fill="#444444" text-anchor="middle">sockets, event loop, asynchronous I/O</text>

  <rect x="520" y="226" width="160" height="168" fill="#f4f4f4" stroke="#444444" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="600" y="252" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Beside the stack</text>
  <text x="600" y="274" font-size="11" fill="#444444" text-anchor="middle">https.createServer(app)</text>
  <text x="600" y="296" font-size="11" fill="#444444" text-anchor="middle">http2 servers</text>
  <text x="600" y="318" font-size="11" fill="#444444" text-anchor="middle">Socket.IO on the</text>
  <text x="600" y="334" font-size="11" fill="#444444" text-anchor="middle">same http.Server</text>
  <text x="600" y="356" font-size="11" fill="#444444" text-anchor="middle">supertest(app)</text>
  <text x="600" y="384" font-size="10" fill="#666666" text-anchor="middle">all reuse the app function</text>

  <line x1="520" y1="270" x2="466" y2="270" stroke="#444444" stroke-width="1.4"/>
  <polygon points="462,270 470,265 470,275" fill="#444444"/>

  <text x="520" y="90" font-size="11" fill="#222222" font-weight="bold">An HTTP request</text>
  <text x="520" y="106" font-size="11" fill="#444444">travels bottom to top,</text>
  <text x="520" y="122" font-size="11" fill="#444444">the response travels</text>
  <text x="520" y="138" font-size="11" fill="#444444">back down.</text>
</svg>
