<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two ways to schedule with MongoDB in the picture: where Quartz keeps its state</text>
  <defs>
    <marker id="mo-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="mo-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a32a2a"/>
    </marker>
  </defs>

  <!-- ===== left panel: option 1 ===== -->
  <rect x="12" y="46" width="470" height="540" rx="10" fill="#f4f8f4" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="247" y="72" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Option 1 (recommended): Quartz on SQL, data in MongoDB</text>
  <text x="247" y="90" font-size="11" fill="#444444" text-anchor="middle">tested on Quartz 2.5.2, Spring Boot 4.1.1, PostgreSQL 17.11, MongoDB 8.3.11</text>

  <rect x="150" y="108" width="194" height="92" rx="7" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="247" y="130" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-service</text>
  <text x="247" y="148" font-size="10.5" fill="#444444" text-anchor="middle">LoanService: lend, give back</text>
  <text x="247" y="163" font-size="10.5" fill="#444444" text-anchor="middle">ReminderScheduler: Quartz API</text>
  <text x="247" y="178" font-size="10.5" fill="#444444" text-anchor="middle">MemberReminderJob (idempotent)</text>
  <text x="247" y="192" font-size="10.5" fill="#444444" text-anchor="middle">ReminderReconciliationJob</text>

  <line x1="196" y1="200" x2="120" y2="262" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mo-arrow)"/>
  <text x="104" y="236" font-size="10.5" fill="#1c4b73" text-anchor="middle">Spring Data</text>
  <text x="104" y="249" font-size="10.5" fill="#1c4b73" text-anchor="middle">MongoDB</text>
  <line x1="298" y1="200" x2="374" y2="262" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mo-arrow)"/>
  <text x="388" y="236" font-size="10.5" fill="#1c4b73" text-anchor="middle">@QuartzDataSource</text>
  <text x="388" y="249" font-size="10.5" fill="#1c4b73" text-anchor="middle">LocalDataSourceJobStore</text>

  <rect x="26" y="266" width="196" height="132" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="124" y="288" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">MongoDB (source of truth)</text>
  <text x="124" y="308" font-size="10.5" fill="#444444" text-anchor="middle">collection loans</text>
  <text x="124" y="323" font-size="10.5" fill="#444444" text-anchor="middle">collection members</text>
  <text x="124" y="342" font-size="10.5" fill="#444444" text-anchor="middle">a loan: memberId, isbn,</text>
  <text x="124" y="357" font-size="10.5" fill="#444444" text-anchor="middle">dueAt, returned,</text>
  <text x="124" y="372" font-size="10.5" fill="#444444" text-anchor="middle">reminderSentAt</text>
  <text x="124" y="389" font-size="10.5" fill="#444444" text-anchor="middle">replica set: its own transactions</text>

  <rect x="272" y="266" width="196" height="132" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="370" y="288" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PostgreSQL (Quartz only)</text>
  <text x="370" y="308" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_JOB_DETAILS</text>
  <text x="370" y="323" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_TRIGGERS and per-type tables</text>
  <text x="370" y="338" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_FIRED_TRIGGERS</text>
  <text x="370" y="353" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_LOCKS (row locks)</text>
  <text x="370" y="368" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_SCHEDULER_STATE</text>
  <text x="370" y="389" font-size="10.5" fill="#444444" text-anchor="middle">schema owned by Flyway</text>

  <line x1="222" y1="332" x2="272" y2="332" stroke="#a32a2a" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line x1="236" y1="320" x2="258" y2="344" stroke="#a32a2a" stroke-width="2"/>
  <line x1="258" y1="320" x2="236" y2="344" stroke="#a32a2a" stroke-width="2"/>
  <text x="247" y="418" font-size="11" font-weight="bold" fill="#a32a2a" text-anchor="middle">no transaction spans the two databases</text>

  <rect x="26" y="432" width="442" height="140" rx="7" fill="#ffffff" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="247" y="452" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">What keeps them consistent</text>
  <text x="40" y="472" font-size="10.5" fill="#444444">1. Write MongoDB first, Quartz second: the loan is never lost.</text>
  <text x="40" y="490" font-size="10.5" fill="#444444">2. The reminder job checks the loan and marks it sent, so a second</text>
  <text x="54" y="504" font-size="10.5" fill="#444444">run for the same loan does nothing (idempotent).</text>
  <text x="40" y="522" font-size="10.5" fill="#444444">3. A reconciliation job compares both sides every few minutes:</text>
  <text x="54" y="536" font-size="10.5" fill="#444444">missing reminders are created, orphaned ones deleted.</text>
  <text x="40" y="554" font-size="10.5" fill="#444444">4. Scheduling twice is harmless: same keys, replace = true.</text>

  <!-- ===== right panel: option 2 ===== -->
  <rect x="498" y="46" width="470" height="540" rx="10" fill="#fbf3f3" stroke="#a32a2a" stroke-width="1.6"/>
  <text x="733" y="72" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Option 2: community quartz-mongodb job store</text>
  <text x="733" y="90" font-size="11" fill="#444444" text-anchor="middle">archived upstream, last release 2.2.0-rc2 (2021), built for Quartz 2.3.2</text>

  <rect x="636" y="108" width="194" height="92" rx="7" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="733" y="130" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-service</text>
  <text x="733" y="148" font-size="10.5" fill="#444444" text-anchor="middle">job-store-type left as memory</text>
  <text x="733" y="163" font-size="10.5" fill="#444444" text-anchor="middle">org.quartz.jobStore.class set in</text>
  <text x="733" y="178" font-size="10.5" fill="#444444" text-anchor="middle">spring.quartz.properties</text>

  <line x1="733" y1="200" x2="733" y2="232" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mo-arrow)"/>
  <rect x="598" y="234" width="270" height="86" rx="7" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="733" y="256" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">QuartzScheduler + MongoDBJobStore</text>
  <text x="733" y="274" font-size="10.5" fill="#444444" text-anchor="middle">acquireNextTriggers, triggersFired,</text>
  <text x="733" y="289" font-size="10.5" fill="#444444" text-anchor="middle">check-in thread, lock documents</text>
  <text x="733" y="306" font-size="10.5" fill="#444444" text-anchor="middle">(no JDBC, no DataSource bean)</text>

  <line x1="733" y1="320" x2="733" y2="352" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mo-arrow)"/>
  <rect x="598" y="354" width="270" height="108" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="733" y="376" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">MongoDB</text>
  <text x="733" y="396" font-size="10.5" fill="#444444" text-anchor="middle">qrtz_jobs, qrtz_triggers, qrtz_calendars</text>
  <text x="733" y="411" font-size="10.5" fill="#444444" text-anchor="middle">qrtz_locks (unique key, time stamp)</text>
  <text x="733" y="426" font-size="10.5" fill="#444444" text-anchor="middle">qrtz_schedulers (check-ins)</text>
  <text x="733" y="441" font-size="10.5" fill="#444444" text-anchor="middle">two more collections for paused</text>
  <text x="733" y="454" font-size="10.5" fill="#444444" text-anchor="middle">groups, created on first pause</text>

  <rect x="512" y="480" width="442" height="92" rx="7" fill="#ffffff" stroke="#a32a2a" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="733" y="500" font-size="11.5" font-weight="bold" fill="#a32a2a" text-anchor="middle">Measured on Quartz 2.5.2: nothing ever fires</text>
  <text x="526" y="518" font-size="10.5" fill="#444444">The scheduler thread dies with NoSuchMethodError on</text>
  <text x="526" y="532" font-size="10.5" fill="#444444">JobDetail.isConcurrentExectionDisallowed(), a misspelled method</text>
  <text x="526" y="546" font-size="10.5" fill="#444444">that 2.5 removed. No exception reaches the application and the</text>
  <text x="526" y="560" font-size="10.5" fill="#444444">scheduler still reports started. It works on Quartz 2.4.1 and 2.3.2.</text>
</svg>
