<svg viewBox="0 0 740 404" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="404" fill="#ffffff"/>

  <text x="370" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The migration ladder: plain JS &#8594; strict TypeScript</text>

  <!-- staircase silhouette: five ascending treads -->
  <polygon points="20,360 20,306 80,306 80,244 140,244 140,182 200,182 200,120 260,120 260,58 320,58 320,360"
           fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>

  <!-- direction of travel: leaves first, up to strict -->
  <path d="M16,358 L312,60" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <polyline points="306.3,72.7 312,60 299.3,65.7" fill="none" stroke="#1c4b73" stroke-width="1.6"/>

  <!-- dotted leaders from each step to its annotation -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="2 3">
    <line x1="78"  y1="327" x2="336" y2="327"/>
    <line x1="138" y1="265" x2="336" y2="265"/>
    <line x1="198" y1="203" x2="336" y2="203"/>
    <line x1="258" y1="141" x2="336" y2="141"/>
    <line x1="318" y1="79"  x2="336" y2="79"/>
  </g>

  <!-- numbered step plates -->
  <g fill="#ffffff" stroke="#999999" stroke-width="1.4">
    <rect x="20"  y="306" width="58" height="42" rx="4"/>
    <rect x="80"  y="244" width="58" height="42" rx="4"/>
    <rect x="140" y="182" width="58" height="42" rx="4"/>
    <rect x="200" y="120" width="58" height="42" rx="4"/>
    <rect x="260" y="58"  width="58" height="42" rx="4" fill="#eef3ea"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="49"  y="334">1</text>
    <text x="109" y="272">2</text>
    <text x="169" y="210">3</text>
    <text x="229" y="148">4</text>
    <text x="289" y="86">5</text>
  </g>

  <!-- annotations: flag name (monospace) + one-line description -->
  <g font-family="'Courier New', monospace" font-size="12.5" font-weight="bold">
    <text x="340" y="324" fill="#8a3d10">allowJs</text>
    <text x="340" y="262" fill="#1c4b73">checkJs + @ts-check + JSDoc</text>
    <text x="340" y="200" fill="#1c4b73">rename .js &#8594; .ts</text>
    <text x="340" y="138" fill="#7a2f6a">noImplicitAny</text>
    <text x="340" y="76"  fill="#2f5424">full strict</text>
  </g>
  <g font-size="12" fill="#444444">
    <text x="340" y="342">compile JS alongside TS</text>
    <text x="340" y="280">type-check JS in place</text>
    <text x="340" y="218">module by module, leaves first</text>
    <text x="340" y="156">no silent any</text>
    <text x="340" y="94">all strict-family flags on</text>
  </g>

  <text x="370" y="382" font-size="11.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">allowJs &#8594; checkJs / JSDoc &#8594; rename .ts &#8594; noImplicitAny &#8594; strict</text>
  <text x="370" y="398" font-size="10.5" fill="#666666" text-anchor="middle">The migration is not done until noImplicitAny is on; strict is the finish line.</text>
</svg>
