<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-rt-sbt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Shader binding table: four regions inside one buffer</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="#374151">Buffer created with VK_BUFFER_USAGE_SHADER_BINDING_TABLE_BIT_KHR and a device address</text>
<rect x="30" y="80" width="150" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="102.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Raygen</text>
<rect x="30" y="116" width="150" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="174.8" text-anchor="middle" font-size="11" fill="#3730A3">1 record</text>
<rect x="190" y="80" width="150" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="265.0" y="102.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Miss</text>
<rect x="190" y="116" width="150" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="265.0" y="167.3" text-anchor="middle" font-size="11" fill="#92400E">record 0: sky</text>
<text x="265.0" y="182.3" text-anchor="middle" font-size="11" fill="#92400E">record 1: shadow</text>
<rect x="350" y="80" width="230" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="102.5" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Hit groups</text>
<rect x="350" y="116" width="230" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="152.3" text-anchor="middle" font-size="11" fill="#065F46">record 0: book</text>
<text x="465.0" y="167.3" text-anchor="middle" font-size="11" fill="#065F46">record 1: book shadow</text>
<text x="465.0" y="182.3" text-anchor="middle" font-size="11" fill="#065F46">record 2: shelf</text>
<text x="465.0" y="197.3" text-anchor="middle" font-size="11" fill="#065F46">record 3: shelf shadow</text>
<rect x="590" y="80" width="140" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="102.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Callable</text>
<rect x="590" y="116" width="140" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="174.8" text-anchor="middle" font-size="11" fill="#374151">optional</text>
<rect x="30" y="260" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">One record = shader group handle</text>
<text x="195.0" y="298.9" text-anchor="middle" font-size="11" fill="#374151">(shaderGroupHandleSize bytes)</text>
<text x="195.0" y="313.9" text-anchor="middle" font-size="11" fill="#374151">+ optional inline data</text>
<rect x="400" y="260" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">Region start: multiple of shaderGroupBaseAlignment</text>
<text x="565.0" y="298.9" text-anchor="middle" font-size="11" fill="#374151">Record stride: multiple of shaderGroupHandleAlignment</text>
<text x="565.0" y="313.9" text-anchor="middle" font-size="11" fill="#374151">and not above maxShaderGroupStride</text>
<text x="380" y="362" text-anchor="middle" font-size="12" fill="#374151">vkCmdTraceRaysKHR receives four VkStridedDeviceAddressRegionKHR values (deviceAddress, stride, size)</text>
<text x="380" y="382" text-anchor="middle" font-size="11" fill="#374151">The raygen region has size equal to stride because exactly one raygen shader runs.</text>
<text x="380" y="402" text-anchor="middle" font-size="11" fill="#374151">Handles come from vkGetRayTracingShaderGroupHandlesKHR; the application copies them into the buffer.</text>
</svg>
