<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-hpp-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Migrating a C setup to Vulkan-Hpp RAII in four steps</text>
<rect x="20" y="60" width="170" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="140.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Typed C++ structs</text>
<text x="105.0" y="155.0" text-anchor="middle" font-size="11" fill="#3730A3">VkInstanceCreateInfo</text>
<text x="105.0" y="170.0" text-anchor="middle" font-size="11" fill="#3730A3">vk::InstanceCreateInfo</text>
<text x="105.0" y="185.0" text-anchor="middle" font-size="11" fill="#3730A3">sType set for you</text>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/><text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="105" y="285" text-anchor="middle" font-size="11" fill="#374151">C structs</text>
<line x1="190" y1="160" x2="200" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-hpp-story)"/>
<rect x="200" y="60" width="170" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="140.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Designated initializers</text>
<text x="285.0" y="155.0" text-anchor="middle" font-size="11" fill="#3730A3">.pApplicationInfo = &amp;app</text>
<text x="285.0" y="170.0" text-anchor="middle" font-size="11" fill="#3730A3">needs C++20 and the</text>
<text x="285.0" y="185.0" text-anchor="middle" font-size="11" fill="#3730A3">NO_CONSTRUCTORS macro</text>
<circle cx="216" cy="76" r="11" fill="#4F46E5"/><text x="216" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="285" y="285" text-anchor="middle" font-size="11" fill="#374151">less typing</text>
<line x1="370" y1="160" x2="380" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-hpp-story)"/>
<rect x="380" y="60" width="170" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="140.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">RAII owners</text>
<text x="465.0" y="155.0" text-anchor="middle" font-size="11" fill="#3730A3">vk::raii::Instance</text>
<text x="465.0" y="170.0" text-anchor="middle" font-size="11" fill="#3730A3">destroyed by the</text>
<text x="465.0" y="185.0" text-anchor="middle" font-size="11" fill="#3730A3">destructor</text>
<circle cx="396" cy="76" r="11" fill="#4F46E5"/><text x="396" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="465" y="285" text-anchor="middle" font-size="11" fill="#374151">no vkDestroy</text>
<line x1="550" y1="160" x2="560" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-hpp-story)"/>
<rect x="560" y="60" width="170" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="140.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Errors as exceptions</text>
<text x="645.0" y="155.0" text-anchor="middle" font-size="11" fill="#3730A3">failed calls throw</text>
<text x="645.0" y="170.0" text-anchor="middle" font-size="11" fill="#3730A3">vk::SystemError</text>
<text x="645.0" y="185.0" text-anchor="middle" font-size="11" fill="#3730A3">or return vk::Result</text>
<circle cx="576" cy="76" r="11" fill="#4F46E5"/><text x="576" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="645" y="285" text-anchor="middle" font-size="11" fill="#374151">try and catch</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Each step compiles on its own, so a C code base can move one file at a time.</text>
</svg>
