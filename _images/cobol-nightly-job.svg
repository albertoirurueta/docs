<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">The Circulation nightly job</title>
  <desc id="d">Job CIRCNITE runs four steps in order: SORTSTEP (SORT) sorts the loan transactions into a temporary data set, UPDATE (BOOKUPD) applies them to the book master and creates a new generation of a generation data group, REPORT (LOANRPT) prints the circulation report and EXPORT (JSONSUM) writes the daily summary as JSON. Each step runs only if the previous step ended with a return code of 4 or less. A final ALERT step runs after an abend or a return code above 4.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e5aa8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a67c00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933">

    <!-- job frame -->
    <rect x="10" y="10" width="940" height="430" rx="12" fill="#eef2f7" stroke="#37474f" stroke-width="2.5"/>
    <text x="26" y="36" font-weight="bold" font-size="15">JOB CIRCNITE (z/OS; not run here)</text>
    <text x="934" y="36" text-anchor="end" font-size="12" fill="#52606d">JOBLIB DD: USERID.CIRC.LOADLIB (the load modules of the four programs)</text>

    <!-- step 1 -->
    <rect x="24" y="52" width="196" height="214" rx="8" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.8"/>
    <rect x="24" y="52" width="196" height="44" rx="8" fill="#cfe0f5" stroke="#1e5aa8" stroke-width="1.8"/>
    <text x="122" y="72" text-anchor="middle" font-weight="bold">1. SORTSTEP</text>
    <text x="122" y="89" text-anchor="middle" font-size="12">EXEC PGM=SORT</text>
    <text x="34" y="116" font-size="12" font-weight="bold">SORTIN (input)</text>
    <text x="34" y="131" font-size="11.5">USERID.CIRC.LOANTRAN</text>
    <text x="34" y="150" font-size="12" font-weight="bold">SORTOUT (output)</text>
    <text x="34" y="165" font-size="11.5">&amp;&amp;LOANSRT, temporary</text>
    <text x="34" y="184" font-size="12" font-weight="bold">SYSIN (DD *)</text>
    <text x="34" y="199" font-size="11">SORT FIELDS=(8,6,ZD,A,...)</text>
    <text x="34" y="218" font-size="12" font-weight="bold">SYSOUT</text>
    <text x="34" y="233" font-size="11.5">SYSOUT=*, DFSORT messages</text>

    <!-- step 2 -->
    <rect x="260" y="52" width="196" height="214" rx="8" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.8"/>
    <rect x="260" y="52" width="196" height="44" rx="8" fill="#cfe0f5" stroke="#1e5aa8" stroke-width="1.8"/>
    <text x="358" y="72" text-anchor="middle" font-weight="bold">2. UPDATE</text>
    <text x="358" y="89" text-anchor="middle" font-size="12">EXEC PGM=BOOKUPD</text>
    <text x="270" y="116" font-size="12" font-weight="bold">BOOKMAST (input)</text>
    <text x="270" y="131" font-size="11.5">USERID.CIRC.BOOKGDG(0)</text>
    <text x="270" y="150" font-size="12" font-weight="bold">LOANSRT (input)</text>
    <text x="270" y="165" font-size="11.5">&amp;&amp;LOANSRT, passed on</text>
    <text x="270" y="184" font-size="12" font-weight="bold">BOOKNEW (output)</text>
    <text x="270" y="199" font-size="11.5">USERID.CIRC.BOOKGDG(+1)</text>
    <text x="270" y="218" font-size="12" font-weight="bold">BOOKREJ, SYSOUT</text>
    <text x="270" y="233" font-size="11.5">SYSOUT=*, rejects and log</text>

    <!-- step 3 -->
    <rect x="496" y="52" width="196" height="214" rx="8" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.8"/>
    <rect x="496" y="52" width="196" height="44" rx="8" fill="#cfe0f5" stroke="#1e5aa8" stroke-width="1.8"/>
    <text x="594" y="72" text-anchor="middle" font-weight="bold">3. REPORT</text>
    <text x="594" y="89" text-anchor="middle" font-size="12">EXEC PGM=LOANRPT</text>
    <text x="506" y="116" font-size="12" font-weight="bold">BOOKMAST (input)</text>
    <text x="506" y="131" font-size="11.5">USERID.CIRC.BOOKGDG(+1)</text>
    <text x="506" y="150" font-size="12" font-weight="bold">LOANSRT (input)</text>
    <text x="506" y="165" font-size="11.5">&amp;&amp;LOANSRT, then deleted</text>
    <text x="506" y="184" font-size="12" font-weight="bold">CIRCRPT (output)</text>
    <text x="506" y="199" font-size="11.5">SYSOUT=*, the printed report</text>
    <text x="506" y="218" font-size="12" font-weight="bold">SYSOUT</text>
    <text x="506" y="233" font-size="11.5">SYSOUT=*, program messages</text>

    <!-- step 4 -->
    <rect x="732" y="52" width="196" height="214" rx="8" fill="#ffffff" stroke="#1e5aa8" stroke-width="1.8"/>
    <rect x="732" y="52" width="196" height="44" rx="8" fill="#cfe0f5" stroke="#1e5aa8" stroke-width="1.8"/>
    <text x="830" y="72" text-anchor="middle" font-weight="bold">4. EXPORT</text>
    <text x="830" y="89" text-anchor="middle" font-size="12">EXEC PGM=JSONSUM</text>
    <text x="742" y="116" font-size="12" font-weight="bold">BOOKMAST (input)</text>
    <text x="742" y="131" font-size="11.5">USERID.CIRC.BOOKGDG(+1)</text>
    <text x="742" y="150" font-size="12" font-weight="bold">MEMBMAST (input)</text>
    <text x="742" y="165" font-size="11.5">USERID.CIRC.MEMBMAST</text>
    <text x="742" y="184" font-size="12" font-weight="bold">LOANTRAN (input)</text>
    <text x="742" y="199" font-size="11.5">USERID.CIRC.LOANTRAN</text>
    <text x="742" y="218" font-size="12" font-weight="bold">SUMMARY (output)</text>
    <text x="742" y="233" font-size="11.5">USERID.CIRC.SUMJSON(+1)</text>

    <!-- gates between steps -->
    <line x1="220" y1="160" x2="260" y2="160" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="240" y="150" text-anchor="middle" font-size="11">RC&lt;=4</text>
    <line x1="456" y1="160" x2="496" y2="160" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="476" y="150" text-anchor="middle" font-size="11">RC&lt;=4</text>
    <line x1="692" y1="160" x2="732" y2="160" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="712" y="150" text-anchor="middle" font-size="11">RC&lt;=4</text>

    <!-- temporary data set flow (blue) -->
    <path d="M122,266 V352 H570 V270" fill="none" stroke="#1e5aa8" stroke-width="2" marker-end="url(#arb)"/>
    <path d="M330,352 V270" fill="none" stroke="#1e5aa8" stroke-width="2" marker-end="url(#arb)"/>
    <!-- GDG flow (amber) -->
    <path d="M400,266 V316 H830 V270" fill="none" stroke="#a67c00" stroke-width="2" marker-end="url(#ara)"/>
    <path d="M630,316 V270" fill="none" stroke="#a67c00" stroke-width="2" marker-end="url(#ara)"/>

    <!-- legend -->
    <line x1="30" y1="384" x2="62" y2="384" stroke="#1e5aa8" stroke-width="2"/>
    <text x="72" y="388" font-size="12.5">&amp;&amp;LOANSRT is a temporary data set: SORTSTEP writes it with DISP=(NEW,PASS), UPDATE reads it and passes it on, REPORT deletes it.</text>
    <line x1="30" y1="410" x2="62" y2="410" stroke="#a67c00" stroke-width="2"/>
    <text x="72" y="414" font-size="12.5">USERID.CIRC.BOOKGDG is a generation data group: UPDATE reads (0) and catalogs (+1); REPORT and EXPORT read the same (+1).</text>

    <!-- return code flow -->
    <text x="24" y="470" font-weight="bold" font-size="15">Return-code flow</text>
    <rect x="24" y="482" width="200" height="56" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="124" y="505" text-anchor="middle" font-weight="bold" font-size="13">RC 0</text>
    <text x="124" y="523" text-anchor="middle" font-size="12">every record accepted</text>
    <rect x="240" y="482" width="200" height="56" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="340" y="505" text-anchor="middle" font-weight="bold" font-size="13">RC 4</text>
    <text x="340" y="523" text-anchor="middle" font-size="12">rejects written, run goes on</text>
    <line x1="440" y1="510" x2="490" y2="510" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="490" y="482" width="438" height="56" rx="6" fill="#e3ecf8" stroke="#1e5aa8" stroke-width="1.5"/>
    <text x="709" y="505" text-anchor="middle" font-weight="bold" font-size="13">THEN clause: the next step runs</text>
    <text x="709" y="523" text-anchor="middle" font-size="12">IF (stepname.RC &lt;= 4) THEN ... ENDIF</text>

    <rect x="24" y="560" width="200" height="56" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="124" y="583" text-anchor="middle" font-weight="bold" font-size="13">RC 8</text>
    <text x="124" y="601" text-anchor="middle" font-size="12">strict run with rejects</text>
    <rect x="240" y="560" width="200" height="56" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="340" y="583" text-anchor="middle" font-weight="bold" font-size="13">RC 12</text>
    <text x="340" y="601" text-anchor="middle" font-size="12">a file would not open</text>
    <rect x="456" y="560" width="160" height="56" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
    <text x="536" y="583" text-anchor="middle" font-weight="bold" font-size="13">abend</text>
    <text x="536" y="601" text-anchor="middle" font-size="12">step ends abnormally</text>
    <line x1="616" y1="588" x2="662" y2="588" stroke="#37474f" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="662" y="560" width="266" height="56" rx="6" fill="#fff8e1" stroke="#a67c00" stroke-width="1.5"/>
    <text x="795" y="581" text-anchor="middle" font-weight="bold" font-size="13">ALERT step (IEBGENER)</text>
    <text x="795" y="598" text-anchor="middle" font-size="12">IF (ABEND | RC &gt; 4) THEN ...</text>
    <text x="795" y="611" text-anchor="middle" font-size="11" fill="#52606d">later steps skipped</text>
  </g>
</svg>
