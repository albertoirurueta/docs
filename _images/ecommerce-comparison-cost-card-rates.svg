<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 388" width="860" height="388" role="img" aria-labelledby="cost-card-rates-t cost-card-rates-d">
<title id="cost-card-rates-t">Card payment rate per transaction</title>
<desc id="cost-card-rates-d">Percentage part of the online card rate (a fixed fee of 0.30 per transaction is added): Shopify Payments 2.1% on Basic down to 1.3% on Plus, WooPayments 2.9% for US cards and 1.5% for European cards (with 0.25 fixed). PrestaShop and Magento have no built-in processor; the rate depends on the gateway chosen (n/a).</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}.l4{stroke:var(--s4);stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linejoin:round}.m4{fill:var(--s4);stroke:var(--s4)}.f4{fill:var(--s4)}.a4{fill:var(--s4);fill-opacity:.12;stroke:var(--s4);stroke-width:2;stroke-dasharray:4 4;}.l5{stroke:var(--s5);stroke-width:2;fill:none;stroke-dasharray:10 3;stroke-linejoin:round}.m5{fill:var(--s5);stroke:var(--s5)}.f5{fill:var(--s5)}.a5{fill:var(--s5);fill-opacity:.12;stroke:var(--s5);stroke-width:2;stroke-dasharray:10 3;}.l6{stroke:var(--s6);stroke-width:2;fill:none;stroke-dasharray:1 3;stroke-linejoin:round}.m6{fill:var(--s6);stroke:var(--s6)}.f6{fill:var(--s6)}.a6{fill:var(--s6);fill-opacity:.12;stroke:var(--s6);stroke-width:2;stroke-dasharray:1 3;}.l7{stroke:var(--s7);stroke-width:2;fill:none;stroke-dasharray:6 2 1 2;stroke-linejoin:round}.m7{fill:var(--s7);stroke:var(--s7)}.f7{fill:var(--s7)}.a7{fill:var(--s7);fill-opacity:.12;stroke:var(--s7);stroke-width:2;stroke-dasharray:6 2 1 2;}</style>
<rect width="860" height="388" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Card payment rate per transaction</text>
<g transform="translate(0 44)"><g class="legend"><rect class="f0" x="74" y="-6" width="16" height="12"/><text x="100" y="4">Shopify</text><rect class="f1" x="224" y="-6" width="16" height="12"/><text x="250" y="4">PrestaShop</text><rect class="f2" x="374" y="-6" width="16" height="12"/><text x="400" y="4">Magento</text><rect class="f3" x="524" y="-6" width="16" height="12"/><text x="550" y="4">WooCommerce</text></g></g><line class="grid" x1="218" y1="78" x2="218" y2="286"/><text class="muted" x="218" y="304" text-anchor="middle">0</text><line class="grid" x1="408.67" y1="78" x2="408.67" y2="286"/><text class="muted" x="408.67" y="304" text-anchor="middle">1</text><line class="grid" x1="599.33" y1="78" x2="599.33" y2="286"/><text class="muted" x="599.33" y="304" text-anchor="middle">2</text><line class="grid" x1="790" y1="78" x2="790" y2="286"/><text class="muted" x="790" y="304" text-anchor="middle">3</text><path class="axis" d="M218 78V286H790"/><text x="210" y="95" text-anchor="end">Shopify Basic</text><g><title>Shopify Basic: 2.1%</title><rect class="f0" x="218" y="82" width="400.4" height="18"/><text class="muted" x="623.4" y="95">2.1%</text></g><text x="210" y="121" text-anchor="end">Shopify Grow</text><g><title>Shopify Grow: 1.8%</title><rect class="f0" x="218" y="108" width="343.2" height="18"/><text class="muted" x="566.2" y="121">1.8%</text></g><text x="210" y="147" text-anchor="end">Shopify Advanced</text><g><title>Shopify Advanced: 1.6%</title><rect class="f0" x="218" y="134" width="305.07" height="18"/><text class="muted" x="528.07" y="147">1.6%</text></g><text x="210" y="173" text-anchor="end">Shopify Plus</text><g><title>Shopify Plus: 1.3%</title><rect class="f0" x="218" y="160" width="247.87" height="18"/><text class="muted" x="470.87" y="173">1.3%</text></g><text x="210" y="199" text-anchor="end">PrestaShop</text><g><title>PrestaShop: n/a</title><text class="na" x="224" y="199">n/a (depends on gateway)</text></g><text x="210" y="225" text-anchor="end">Magento</text><g><title>Magento: n/a</title><text class="na" x="224" y="225">n/a (depends on gateway)</text></g><text x="210" y="251" text-anchor="end">WooPayments (US cards)</text><g><title>WooPayments (US cards): 2.9%</title><rect class="f3" x="218" y="238" width="552.93" height="18"/><text class="muted" x="775.93" y="251">2.9%</text></g><text x="210" y="277" text-anchor="end">WooPayments (Europe cards)</text><g><title>WooPayments (Europe cards): 1.5%</title><rect class="f3" x="218" y="264" width="286" height="18"/><text class="muted" x="509" y="277">1.5%</text></g><text class="axis-label" x="504" y="326" text-anchor="middle">Card rate (% of transaction, plus a fixed fee)</text><text class="axis-label" transform="translate(16 182) rotate(-90)" text-anchor="middle">Platform and plan</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="352" text-anchor="start"><tspan x="24" dy="0">Source: Shopify pricing page (EUR), WooPayments fees page; retrieved 2026-10-27. Third-party gateways add their own fees; Shopify also charges</tspan><tspan x="24" dy="15">0.2% to 2% on third-party gateways. Raw data: scripts/ecommerce-comparison-charts/data/cost.csv. See the Bibliography for the sources.</tspan></text>
</svg>
