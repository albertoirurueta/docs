<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask context stack</title>
  <defs>
    <marker id="fcs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The context stack of one worker</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">two ContextVars per thread, greenlet or task; the proxies read the top item</text>

  <!-- worker frame -->
  <rect x="20" y="60" width="440" height="340" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="80" font-size="12" font-weight="bold" fill="currentColor">one worker (its own contextvars.Context)</text>

  <!-- app ctx var -->
  <text x="40" y="106" font-size="12" fill="currentColor" font-family="'Courier New', monospace">ContextVar "flask.app_ctx"</text>
  <rect x="40" y="116" width="400" height="48" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/>
  <text x="240" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">AppContext (top)</text>
  <text x="240" y="154" font-size="11" fill="currentColor" text-anchor="middle">app, g, url_adapter</text>
  <rect x="60" y="164" width="360" height="34" rx="4" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1"/>
  <text x="240" y="186" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">AppContext pushed earlier (shell, script, outer with-block) is hidden</text>

  <!-- request ctx var -->
  <text x="40" y="236" font-size="12" fill="currentColor" font-family="'Courier New', monospace">ContextVar "flask.request_ctx"</text>
  <rect x="40" y="246" width="400" height="62" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/>
  <text x="240" y="268" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">RequestContext (top)</text>
  <text x="240" y="286" font-size="11" fill="currentColor" text-anchor="middle">request, session, url_adapter, matched rule</text>
  <text x="240" y="300" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">pushed after the AppContext, popped before it</text>

  <text x="40" y="340" font-size="12" fill="currentColor">push order: AppContext, then RequestContext</text>
  <text x="40" y="358" font-size="12" fill="currentColor">pop order: teardown_request, RequestContext, teardown_appcontext, AppContext</text>
  <text x="40" y="382" font-size="11" fill="currentColor" opacity="0.8">Flask 3.2 (unreleased) merges the two contexts into one AppContext.</text>

  <!-- proxies -->
  <text x="610" y="106" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">LocalProxy objects</text>
  <rect x="540" y="120" width="140" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="610" y="142" font-size="13" fill="currentColor" text-anchor="middle" font-family="'Courier New', monospace">current_app</text>
  <rect x="540" y="164" width="140" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="610" y="186" font-size="13" fill="currentColor" text-anchor="middle" font-family="'Courier New', monospace">g</text>
  <rect x="540" y="252" width="140" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="610" y="274" font-size="13" fill="currentColor" text-anchor="middle" font-family="'Courier New', monospace">request</text>
  <rect x="540" y="296" width="140" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="610" y="318" font-size="13" fill="currentColor" text-anchor="middle" font-family="'Courier New', monospace">session</text>

  <line x1="540" y1="137" x2="442" y2="137" stroke="currentColor" stroke-width="1.4" marker-end="url(#fcs-arrow)"/>
  <line x1="540" y1="181" x2="442" y2="150" stroke="currentColor" stroke-width="1.4" marker-end="url(#fcs-arrow)"/>
  <line x1="540" y1="269" x2="442" y2="269" stroke="currentColor" stroke-width="1.4" marker-end="url(#fcs-arrow)"/>
  <line x1="540" y1="313" x2="442" y2="285" stroke="currentColor" stroke-width="1.4" marker-end="url(#fcs-arrow)"/>

  <text x="610" y="360" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">each attribute access reads</text>
  <text x="610" y="374" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">the top context of the</text>
  <text x="610" y="388" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">worker that runs the code</text>
</svg>
