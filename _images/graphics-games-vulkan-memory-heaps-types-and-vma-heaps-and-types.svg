<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-mem-ht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Memory heaps and memory types on two kinds of GPU</text>
<rect x="20" y="50" width="350" height="370" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="195" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Discrete GPU (example layout)</text>
<rect x="40" y="95" width="150" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="115.0" y="123.7" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Heap 0</text>
<text x="115.0" y="138.7" text-anchor="middle" font-size="11" fill="#065F46">VRAM, 8 GiB</text>
<text x="115.0" y="153.7" text-anchor="middle" font-size="11" fill="#065F46">DEVICE_LOCAL</text>
<rect x="210" y="95" width="140" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="123.7" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Heap 1</text>
<text x="280.0" y="138.7" text-anchor="middle" font-size="11" fill="#3730A3">system RAM</text>
<text x="280.0" y="153.7" text-anchor="middle" font-size="11" fill="#3730A3">no flags</text>
<rect x="40" y="195" width="150" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="115.0" y="218.7" text-anchor="middle" font-size="11" fill="#92400E">Heap 2: 256 MiB</text>
<text x="195" y="262" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Memory types point into heaps</text>
<rect x="40" y="275" width="250" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="165.0" y="292.3" text-anchor="middle" font-size="10" fill="#065F46">0: DEVICE_LOCAL</text>
<rect x="300" y="275" width="50" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="325.0" y="292.7" text-anchor="middle" font-size="11" fill="#374151">heap 0</text>
<rect x="40" y="309" width="250" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="165.0" y="326.3" text-anchor="middle" font-size="10" fill="#3730A3">1: VISIBLE, COHERENT</text>
<rect x="300" y="309" width="50" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="325.0" y="326.7" text-anchor="middle" font-size="11" fill="#374151">heap 1</text>
<rect x="40" y="343" width="250" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="165.0" y="360.3" text-anchor="middle" font-size="10" fill="#3730A3">2: VISIBLE, COHERENT, CACHED</text>
<rect x="300" y="343" width="50" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="325.0" y="360.7" text-anchor="middle" font-size="11" fill="#374151">heap 1</text>
<rect x="40" y="377" width="250" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="165.0" y="394.3" text-anchor="middle" font-size="10" fill="#92400E">3: LOCAL, VISIBLE, COHERENT</text>
<rect x="300" y="377" width="50" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="325.0" y="394.7" text-anchor="middle" font-size="11" fill="#374151">heap 2</text>
<rect x="390" y="50" width="350" height="370" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="565" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Integrated GPU or phone (UMA)</text>
<rect x="410" y="95" width="310" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="131.2" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Heap 0</text>
<text x="565.0" y="146.2" text-anchor="middle" font-size="11" fill="#065F46">shared system memory</text>
<rect x="410" y="205" width="310" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="224.7" text-anchor="middle" font-size="11" fill="#065F46">0: DEVICE_LOCAL</text>
<rect x="410" y="245" width="310" height="32" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="264.7" text-anchor="middle" font-size="11" fill="#92400E">1: LOCAL, VISIBLE, COHERENT</text>
<rect x="410" y="285" width="310" height="32" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="304.7" text-anchor="middle" font-size="11" fill="#92400E">2: LOCAL, VISIBLE, CACHED</text>
<text x="565" y="350" text-anchor="middle" font-size="12" fill="#374151">One heap, no copy needed for uploads</text>
<text x="565" y="372" text-anchor="middle" font-size="12" fill="#374151">but the memory is shared with the CPU</text>
<text x="565" y="394" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Always query: the table differs per device.</text>
</svg>
