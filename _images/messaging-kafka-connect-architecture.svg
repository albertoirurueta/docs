<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kafka Connect architecture: workers, connectors, tasks, and converters</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">distributed mode: two workers in one Connect cluster, coordinating through internal Kafka topics</text>

  <!-- REST API box -->
  <rect x="255" y="58" width="190" height="40" rx="3" fill="#f3eefa" stroke="#6a3fa0" stroke-width="1.4"/>
  <text x="350" y="74" font-size="10.5" font-weight="bold" fill="#6a3fa0" text-anchor="middle">Connect REST API</text>
  <text x="350" y="88" font-size="9" fill="#4a2a70" text-anchor="middle">POST /connectors, GET .../status</text>

  <!-- Column 1: External source system -->
  <rect x="10" y="150" width="100" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="60" y="176" font-size="10.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">External</text>
  <text x="60" y="191" font-size="10.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">source</text>
  <text x="60" y="206" font-size="10.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">system</text>
  <text x="60" y="221" font-size="8.5" fill="#333333" text-anchor="middle">e.g. a database</text>

  <!-- Column 2: Worker 1 -->
  <rect x="125" y="130" width="165" height="120" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="207" y="148" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Worker 1</text>
  <rect x="137" y="156" width="141" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="207" y="171" font-size="9" fill="#1c4b73" text-anchor="middle">Source connector task</text>
  <text x="207" y="184" font-size="8.5" fill="#555555" text-anchor="middle">(+ SMTs)</text>
  <rect x="137" y="198" width="141" height="30" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="207" y="217" font-size="9" fill="#1c4b73" text-anchor="middle">Converter</text>

  <!-- arrow source -> worker1 -->
  <line x1="110" y1="190" x2="125" y2="190" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Column 3: Kafka topic -->
  <rect x="315" y="165" width="100" height="60" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="365" y="190" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Kafka</text>
  <text x="365" y="205" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">topic</text>

  <!-- arrow worker1 -> topic -->
  <line x1="290" y1="190" x2="315" y2="190" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Column 4: Worker 2 -->
  <rect x="440" y="130" width="165" height="120" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="522" y="148" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Worker 2</text>
  <rect x="452" y="156" width="141" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="522" y="171" font-size="9" fill="#1c4b73" text-anchor="middle">Sink connector task</text>
  <text x="522" y="184" font-size="8.5" fill="#555555" text-anchor="middle">(+ SMTs)</text>
  <rect x="452" y="198" width="141" height="30" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="522" y="217" font-size="9" fill="#1c4b73" text-anchor="middle">Converter</text>

  <!-- arrow topic -> worker2 -->
  <line x1="415" y1="190" x2="440" y2="190" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Column 5: External sink system -->
  <rect x="620" y="150" width="70" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="655" y="176" font-size="9.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">External</text>
  <text x="655" y="190" font-size="9.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">sink</text>
  <text x="655" y="204" font-size="9.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">system</text>
  <text x="655" y="219" font-size="8" fill="#333333" text-anchor="middle">e.g. search</text>

  <!-- arrow worker2 -> sink -->
  <line x1="605" y1="190" x2="620" y2="190" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Connect REST arrows into workers -->
  <line x1="300" y1="98" x2="220" y2="130" stroke="#6a3fa0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowpurple)"/>
  <line x1="400" y1="98" x2="510" y2="130" stroke="#6a3fa0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowpurple)"/>

  <!-- Internal topics box -->
  <rect x="230" y="300" width="240" height="70" rx="3" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="350" y="322" font-size="10.5" font-weight="bold" fill="#a33333" text-anchor="middle">Internal Kafka topics</text>
  <text x="350" y="338" font-size="9" fill="#333333" text-anchor="middle">connect-offsets, connect-configs,</text>
  <text x="350" y="351" font-size="9" fill="#333333" text-anchor="middle">connect-status</text>

  <!-- dashed lines from workers to internal topics -->
  <line x1="207" y1="250" x2="290" y2="300" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowgray)"/>
  <line x1="522" y1="250" x2="440" y2="300" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowgray)"/>
  <text x="350" y="390" font-size="9" fill="#666666" text-anchor="middle">distributed-mode coordination: config, offset, and status state, shared by every worker</text>

  <text x="350" y="435" font-size="10" fill="#666666" text-anchor="middle">Only distributed mode stores this state in Kafka itself; standalone mode keeps it in local files</text>
  <text x="350" y="450" font-size="10" fill="#666666" text-anchor="middle">on a single worker, with no fault tolerance if that worker goes down.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666"/>
    </marker>
    <marker id="arrowpurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a3fa0"/>
    </marker>
  </defs>
</svg>
