<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">RabbitMQ queue types compared</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">Chosen per queue with x-queue-type at declaration time; immutable afterward</text>

  <!-- column headers -->
  <rect x="20" y="58" width="140" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="160" y="58" width="140" height="34" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <rect x="300" y="58" width="140" height="34" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1"/>
  <rect x="440" y="58" width="140" height="34" fill="#fff4e5" stroke="#b8730f" stroke-width="1"/>
  <rect x="580" y="58" width="100" height="34" fill="#f3eefb" stroke="#7a4fa8" stroke-width="1"/>

  <text x="90" y="80" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Classic</text>
  <text x="230" y="80" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Quorum</text>
  <text x="370" y="80" font-size="11.5" font-weight="bold" fill="#22326a" text-anchor="middle">Stream</text>
  <text x="510" y="80" font-size="11.5" font-weight="bold" fill="#8a5a0d" text-anchor="middle">JMS (commercial)</text>
  <text x="630" y="74" font-size="10" font-weight="bold" fill="#4a2f6a" text-anchor="middle">--</text>

  <!-- rows -->
  <!-- Row: Replication -->
  <rect x="20" y="92" width="140" height="52" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="122" font-size="10.5" font-weight="bold" fill="#444444">Replication</text>

  <rect x="160" y="92" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="114" font-size="9.5" fill="#333333" text-anchor="middle">None</text>
  <text x="230" y="128" font-size="9.5" fill="#333333" text-anchor="middle">single node</text>

  <rect x="300" y="92" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="114" font-size="9.5" fill="#333333" text-anchor="middle">Raft group</text>
  <text x="370" y="128" font-size="9.5" fill="#333333" text-anchor="middle">leader + followers</text>

  <rect x="440" y="92" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="114" font-size="9.5" fill="#333333" text-anchor="middle">Replicated log</text>
  <text x="510" y="128" font-size="9.5" fill="#333333" text-anchor="middle">across members</text>

  <rect x="580" y="92" width="100" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="114" font-size="9.5" fill="#333333" text-anchor="middle">Raft-backed</text>
  <text x="630" y="128" font-size="9.5" fill="#333333" text-anchor="middle">like quorum</text>

  <!-- Row: Durability -->
  <rect x="20" y="144" width="140" height="52" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="174" font-size="10.5" font-weight="bold" fill="#444444">Durability</text>

  <rect x="160" y="144" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="166" font-size="9.5" fill="#333333" text-anchor="middle">Optional</text>
  <text x="230" y="180" font-size="9.5" fill="#333333" text-anchor="middle">queue and/or message</text>

  <rect x="300" y="144" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="166" font-size="9.5" fill="#333333" text-anchor="middle">Always durable</text>
  <text x="370" y="180" font-size="9.5" fill="#333333" text-anchor="middle">no transient option</text>

  <rect x="440" y="144" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="166" font-size="9.5" fill="#333333" text-anchor="middle">Always durable</text>
  <text x="510" y="180" font-size="9.5" fill="#333333" text-anchor="middle">bounded by retention</text>

  <rect x="580" y="144" width="100" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="166" font-size="9.5" fill="#333333" text-anchor="middle">Always durable</text>

  <!-- Row: Read semantics -->
  <rect x="20" y="196" width="140" height="52" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="226" font-size="10.5" font-weight="bold" fill="#444444">Read on consume</text>

  <rect x="160" y="196" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="218" font-size="9.5" fill="#333333" text-anchor="middle">Destructive</text>
  <text x="230" y="232" font-size="9.5" fill="#333333" text-anchor="middle">removed once acked</text>

  <rect x="300" y="196" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="218" font-size="9.5" fill="#333333" text-anchor="middle">Destructive</text>
  <text x="370" y="232" font-size="9.5" fill="#333333" text-anchor="middle">removed once acked</text>

  <rect x="440" y="196" width="140" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="218" font-size="9.5" fill="#333333" text-anchor="middle">Non-destructive</text>
  <text x="510" y="232" font-size="9.5" fill="#333333" text-anchor="middle">offset-based re-reads</text>

  <rect x="580" y="196" width="100" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="218" font-size="9.5" fill="#333333" text-anchor="middle">Destructive</text>

  <!-- Row: Notable feature -->
  <rect x="20" y="248" width="140" height="60" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="278" font-size="10.5" font-weight="bold" fill="#444444">Notable trait</text>

  <rect x="160" y="248" width="140" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="272" font-size="9.5" fill="#333333" text-anchor="middle">Lowest latency</text>
  <text x="230" y="286" font-size="9.5" fill="#333333" text-anchor="middle">simplest option</text>

  <rect x="300" y="248" width="140" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="266" font-size="9.5" fill="#333333" text-anchor="middle">Delivery limit 20</text>
  <text x="370" y="280" font-size="9.5" fill="#333333" text-anchor="middle">poison-message and</text>
  <text x="370" y="292" font-size="9.5" fill="#333333" text-anchor="middle">dead-letter handling</text>

  <rect x="440" y="248" width="140" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="266" font-size="9.5" fill="#333333" text-anchor="middle">Super streams and</text>
  <text x="510" y="280" font-size="9.5" fill="#333333" text-anchor="middle">single active consumer</text>
  <text x="510" y="292" font-size="9.5" fill="#333333" text-anchor="middle">for ordered scale-out</text>

  <rect x="580" y="248" width="100" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="272" font-size="9.5" fill="#333333" text-anchor="middle">JMS selectors;</text>
  <text x="630" y="286" font-size="9.5" fill="#333333" text-anchor="middle">browsers; delayed</text>
  <text x="630" y="298" font-size="9.5" fill="#333333" text-anchor="middle">delivery</text>

  <!-- Row: When to prefer -->
  <rect x="20" y="308" width="140" height="62" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="338" font-size="10.5" font-weight="bold" fill="#444444">Good fit</text>

  <rect x="160" y="308" width="140" height="62" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="330" font-size="9.5" fill="#333333" text-anchor="middle">Short-lived or</text>
  <text x="230" y="344" font-size="9.5" fill="#333333" text-anchor="middle">non-critical queues</text>

  <rect x="300" y="308" width="140" height="62" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="330" font-size="9.5" fill="#333333" text-anchor="middle">Default choice for</text>
  <text x="370" y="344" font-size="9.5" fill="#333333" text-anchor="middle">durable/available</text>
  <text x="370" y="358" font-size="9.5" fill="#333333" text-anchor="middle">work queues</text>

  <rect x="440" y="308" width="140" height="62" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="330" font-size="9.5" fill="#333333" text-anchor="middle">Event log; large</text>
  <text x="510" y="344" font-size="9.5" fill="#333333" text-anchor="middle">fanout; long</text>
  <text x="510" y="358" font-size="9.5" fill="#333333" text-anchor="middle">retention/replay</text>

  <rect x="580" y="308" width="100" height="62" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="330" font-size="9.5" fill="#333333" text-anchor="middle">Existing JMS</text>
  <text x="630" y="344" font-size="9.5" fill="#333333" text-anchor="middle">applications on</text>
  <text x="630" y="358" font-size="9.5" fill="#333333" text-anchor="middle">Tanzu RabbitMQ</text>

  <rect x="20" y="380" width="660" height="1" fill="#dddddd"/>
  <text x="350" y="404" font-size="9.5" fill="#888888" text-anchor="middle">Classic mirrored queues (ha-mode policies) were removed in RabbitMQ 4.0 -- quorum queues are their replacement</text>
</svg>
