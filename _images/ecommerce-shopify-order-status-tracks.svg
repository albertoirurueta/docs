<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify order status tracks</title>
  <desc id="d">An order has an order status and three independent tracks: payment status, fulfillment status and return status, each shown as the sequence of values it can take.</desc>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g fill="#f2f5f8" font-size="13">
    <text x="30" y="34" font-size="15" font-weight="bold">Order status</text>
    <rect x="170" y="14" width="110" height="30" rx="15" fill="#3f6e9a" stroke="#f2f5f8"/><text x="225" y="34" text-anchor="middle">Open</text>
    <rect x="300" y="14" width="110" height="30" rx="15" fill="#3f6e9a" stroke="#f2f5f8"/><text x="355" y="34" text-anchor="middle">Archived</text>
    <rect x="430" y="14" width="110" height="30" rx="15" fill="#8a5a8f" stroke="#f2f5f8"/><text x="485" y="34" text-anchor="middle">Canceled</text>
    <text x="560" y="34" font-size="12">Canceled orders are also archived</text>

    <text x="30" y="98" font-size="15" font-weight="bold">Payment</text>
    <rect x="30" y="112" width="100" height="34" rx="17" fill="#b0743a" stroke="#f2f5f8"/><text x="80" y="134" text-anchor="middle">Pending</text>
    <rect x="160" y="112" width="100" height="34" rx="17" fill="#b0743a" stroke="#f2f5f8"/><text x="210" y="134" text-anchor="middle">Authorized</text>
    <rect x="290" y="112" width="100" height="34" rx="17" fill="#4f7f5b" stroke="#f2f5f8"/><text x="340" y="134" text-anchor="middle">Paid</text>
    <rect x="420" y="112" width="140" height="34" rx="17" fill="#8a5a8f" stroke="#f2f5f8"/><text x="490" y="134" text-anchor="middle">Partially refunded</text>
    <rect x="590" y="112" width="100" height="34" rx="17" fill="#8a5a8f" stroke="#f2f5f8"/><text x="640" y="134" text-anchor="middle">Refunded</text>
    <text x="30" y="172" font-size="12">Also: Partially paid, Due, Expiring, Expired and Voided. Authorized appears only when payments are captured manually.</text>

    <text x="30" y="214" font-size="15" font-weight="bold">Fulfillment</text>
    <rect x="30" y="228" width="100" height="34" rx="17" fill="#b0743a" stroke="#f2f5f8"/><text x="80" y="250" text-anchor="middle">Unfulfilled</text>
    <rect x="160" y="228" width="100" height="34" rx="17" fill="#b0743a" stroke="#f2f5f8"/><text x="210" y="250" text-anchor="middle">In progress</text>
    <rect x="290" y="228" width="130" height="34" rx="17" fill="#b0743a" stroke="#f2f5f8"/><text x="355" y="250" text-anchor="middle">Partially fulfilled</text>
    <rect x="450" y="228" width="100" height="34" rx="17" fill="#4f7f5b" stroke="#f2f5f8"/><text x="500" y="250" text-anchor="middle">Fulfilled</text>
    <text x="30" y="288" font-size="12">Also: On hold, Scheduled (prepaid subscriptions) and Fulfillment not required (no items left to ship).</text>

    <text x="30" y="330" font-size="15" font-weight="bold">Return</text>
    <rect x="30" y="344" width="130" height="34" rx="17" fill="#3f6e9a" stroke="#f2f5f8"/><text x="95" y="366" text-anchor="middle">Return requested</text>
    <rect x="190" y="344" width="130" height="34" rx="17" fill="#3f6e9a" stroke="#f2f5f8"/><text x="255" y="366" text-anchor="middle">In progress</text>
    <rect x="350" y="344" width="140" height="34" rx="17" fill="#3f6e9a" stroke="#f2f5f8"/><text x="420" y="366" text-anchor="middle">Inspection complete</text>
    <rect x="520" y="344" width="100" height="34" rx="17" fill="#4f7f5b" stroke="#f2f5f8"/><text x="570" y="366" text-anchor="middle">Returned</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)">
    <line x1="132" y1="129" x2="156" y2="129"/><line x1="262" y1="129" x2="286" y2="129"/><line x1="392" y1="129" x2="416" y2="129"/><line x1="562" y1="129" x2="586" y2="129"/>
    <line x1="132" y1="245" x2="156" y2="245"/><line x1="262" y1="245" x2="286" y2="245"/><line x1="422" y1="245" x2="446" y2="245"/>
    <line x1="162" y1="361" x2="186" y2="361"/><line x1="322" y1="361" x2="346" y2="361"/><line x1="492" y1="361" x2="516" y2="361"/>
  </g>
</svg>
