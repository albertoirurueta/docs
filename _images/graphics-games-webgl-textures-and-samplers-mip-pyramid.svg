<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-textures-and-samplers-mip-pyramid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A 256 x 256 mip chain: 9 levels, about one third more memory</text>
<rect x="30" y="108.0" width="192.0" height="192.0" rx="1" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
<text x="126.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L0</text>
<text x="126.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">256</text>
<rect x="236.0" y="204.0" width="96.0" height="96.0" rx="1" fill="#E5E7EB" stroke="#4F46E5" stroke-width="1.2" />
<text x="284.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L1</text>
<text x="284.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">128</text>
<rect x="346.0" y="252.0" width="48.0" height="48.0" rx="1" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
<text x="370.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L2</text>
<text x="370.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">64</text>
<rect x="408.0" y="276.0" width="24.0" height="24.0" rx="1" fill="#E5E7EB" stroke="#4F46E5" stroke-width="1.2" />
<text x="420.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L3</text>
<text x="420.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">32</text>
<rect x="446.0" y="288.0" width="12.0" height="12.0" rx="1" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
<text x="452.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L4</text>
<text x="452.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">16</text>
<rect x="472.0" y="294.0" width="6.0" height="6.0" rx="1" fill="#E5E7EB" stroke="#4F46E5" stroke-width="1.2" />
<text x="475.0" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L5</text>
<text x="475.0" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">8</text>
<rect x="492.0" y="297.0" width="3.0" height="3.0" rx="1" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
<text x="493.5" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L6</text>
<text x="493.5" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">4</text>
<rect x="509.0" y="297" width="3" height="3" rx="1" fill="#E5E7EB" stroke="#4F46E5" stroke-width="1.2" />
<text x="510.5" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L7</text>
<text x="510.5" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">2</text>
<rect x="526.0" y="297" width="3" height="3" rx="1" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
<text x="527.5" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">L8</text>
<text x="527.5" y="330" font-size="10" font-weight="normal" fill="#4B5563" text-anchor="middle">1</text>
<text x="380" y="60" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Each level halves width and height (never below 1), so level count = floor(log2(max(w, h))) + 1.</text>
<text x="380" y="80" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Total texels = 256^2 x (1 + 1/4 + 1/16 + ...) = about 4/3 of level 0.</text>
<text x="560" y="150" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">texStorage2D(TEXTURE_2D, 9, ...)</text>
<text x="560" y="170" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">generateMipmap() fills L1..L8</text>
<text x="560" y="190" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">from L0 (box filter)</text>
</svg>
