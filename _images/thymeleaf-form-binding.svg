<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The form binding round-trip</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">a form-data object travels to the browser as HTML and comes back as request parameters</text>

  <!-- step 1: controller GET -->
  <rect x="30" y="80" width="230" height="110" fill="#e8eefc" stroke="#2a4a9a" stroke-width="1.6"/>
  <text x="145" y="102" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle">1  GET handler</text>
  <text x="145" y="126" font-size="11" fill="#2a4a9a" text-anchor="middle">puts the form object in the model</text>
  <text x="145" y="144" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">model "book" = BookForm</text>
  <text x="145" y="168" font-size="11" fill="#2a4a9a" text-anchor="middle">reference data: genres, authors</text>

  <!-- step 2: template -->
  <rect x="335" y="80" width="230" height="110" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="450" y="102" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">2  Template renders</text>
  <text x="450" y="126" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">th:object="${book}"</text>
  <text x="450" y="144" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">th:field="*{title}"</text>
  <text x="450" y="168" font-size="11" fill="#1e6b34" text-anchor="middle">id, name, value, checked, _csrf</text>

  <!-- step 3: browser -->
  <rect x="640" y="80" width="230" height="110" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="755" y="102" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">3  Browser</text>
  <text x="755" y="126" font-size="11" fill="#5c4600" text-anchor="middle">the user edits the fields</text>
  <text x="755" y="144" font-size="11" fill="#5c4600" text-anchor="middle">and submits the form</text>
  <text x="755" y="168" font-size="11" fill="#8a6a00" text-anchor="middle">unchecked boxes send nothing</text>

  <!-- step 4: POST request -->
  <rect x="640" y="250" width="230" height="110" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="755" y="272" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">4  POST request</text>
  <text x="755" y="296" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">title=Dune&amp;tags=award</text>
  <text x="755" y="314" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">_tags=on&amp;_csrf=...</text>
  <text x="755" y="338" font-size="11" fill="#8a6a00" text-anchor="middle">strings only, plus _field markers</text>

  <!-- step 5: binder -->
  <rect x="335" y="250" width="230" height="110" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="450" y="272" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">5  Binder</text>
  <text x="450" y="296" font-size="11" fill="#444444" text-anchor="middle">CSRF check, then conversion service</text>
  <text x="450" y="314" font-size="11" fill="#444444" text-anchor="middle">and field markers fill the object</text>
  <text x="450" y="338" font-size="11" fill="#444444" text-anchor="middle">failures go to BindingResult</text>

  <!-- step 6: controller POST -->
  <rect x="30" y="250" width="230" height="110" fill="#e8eefc" stroke="#2a4a9a" stroke-width="1.6"/>
  <text x="145" y="272" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle">6  POST handler</text>
  <text x="145" y="296" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">@Valid BookForm, BindingResult</text>
  <text x="145" y="318" font-size="11" fill="#2a4a9a" text-anchor="middle">errors: render the same view</text>
  <text x="145" y="336" font-size="11" fill="#2a4a9a" text-anchor="middle">ok: save, redirect: (PRG)</text>

  <!-- arrows -->
  <line x1="260" y1="135" x2="333" y2="135" stroke="#444444" stroke-width="1.6" marker-end="url(#fb-arrow)"/>
  <line x1="565" y1="135" x2="638" y2="135" stroke="#444444" stroke-width="1.6" marker-end="url(#fb-arrow)"/>
  <line x1="755" y1="190" x2="755" y2="248" stroke="#444444" stroke-width="1.6" marker-end="url(#fb-arrow)"/>
  <line x1="640" y1="305" x2="567" y2="305" stroke="#444444" stroke-width="1.6" marker-end="url(#fb-arrow)"/>
  <line x1="335" y1="305" x2="262" y2="305" stroke="#444444" stroke-width="1.6" marker-end="url(#fb-arrow)"/>
  <path d="M 145 248 L 145 215 L 450 215 L 450 192" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#fb-arrow)"/>
  <text x="300" y="232" font-size="11" fill="#444444" text-anchor="middle">errors: same form again, with the rejected values</text>

  <text x="450" y="395" font-size="12" fill="#444444" text-anchor="middle">th:action adds the CSRF hidden field through RequestDataValueProcessor while the template is rendered (step 2)</text>
  <text x="450" y="414" font-size="12" fill="#444444" text-anchor="middle">and the same object name ("book") must be used by th:object and by the model attribute</text>
</svg>
