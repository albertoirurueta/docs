<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Bookshop worked example: the Docker Compose stack</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#455a64">compose project dbz-bookshop, one network, service names used as host names</text>

  <!-- compose boundary -->
  <rect x="20" y="70" width="860" height="440" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="6 4"/>

  <!-- Oracle -->
  <rect x="45" y="100" width="230" height="150" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="160" y="124" text-anchor="middle" font-weight="bold" fill="#263238">oracle</text>
  <text x="160" y="144" text-anchor="middle" font-size="12" fill="#455a64">gvenzl/oracle-free:23.26.3</text>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#263238">CDB FREE, PDB FREEPDB1</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#263238">schema BOOKSHOP (6 tables)</text>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#263238">ARCHIVELOG, supplemental log</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#263238">user C##DBZUSER (LogMiner)</text>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#455a64">port 1521</text>

  <!-- traffic script -->
  <rect x="45" y="300" width="230" height="60" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="160" y="324" text-anchor="middle" fill="#263238">legacy-traffic.sql</text>
  <text x="160" y="344" text-anchor="middle" font-size="12" fill="#455a64">plays the legacy Struts app</text>
  <line x1="160" y1="300" x2="160" y2="252" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="282" font-size="12" fill="#455a64">SQL*Plus</text>

  <!-- Connect -->
  <rect x="335" y="100" width="230" height="230" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="450" y="124" text-anchor="middle" font-weight="bold" fill="#263238">connect</text>
  <text x="450" y="144" text-anchor="middle" font-size="12" fill="#455a64">debezium/connect:3.7.1.Final</text>
  <rect x="352" y="160" width="196" height="62" rx="5" fill="#ffffff" stroke="#1565c0"/>
  <text x="450" y="182" text-anchor="middle" font-size="13" fill="#263238">bookshop-oracle-source</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#455a64">OracleConnector, LogMiner</text>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#455a64">topic.prefix=legacy</text>
  <rect x="352" y="238" width="196" height="62" rx="5" fill="#ffffff" stroke="#1565c0"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" fill="#263238">bookshop-pg-mirror-sink</text>
  <text x="450" y="278" text-anchor="middle" font-size="12" fill="#455a64">JdbcSinkConnector, upsert</text>
  <text x="450" y="293" text-anchor="middle" font-size="12" fill="#455a64">3 topics to legacy_* tables</text>
  <text x="450" y="320" text-anchor="middle" font-size="12" fill="#455a64">REST port 8083</text>
  <line x1="277" y1="190" x2="350" y2="190" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="313" y="182" text-anchor="middle" font-size="12" fill="#455a64">redo</text>

  <!-- Kafka -->
  <rect x="335" y="380" width="230" height="110" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="450" y="404" text-anchor="middle" font-weight="bold" fill="#263238">kafka</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#455a64">debezium/kafka:3.7.1.Final</text>
  <text x="450" y="442" text-anchor="middle" font-size="12" fill="#263238">Kafka 4, KRaft, one node</text>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#263238">legacy.BOOKSHOP.* topics</text>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#455a64">port 9092 (kafka:9092 inside)</text>
  <path d="M400,222 L400,378" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="392" y="350" text-anchor="end" font-size="12" fill="#455a64">produce</text>
  <path d="M500,378 L500,302" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="508" y="350" font-size="12" fill="#455a64">consume</text>

  <!-- PostgreSQL -->
  <rect x="625" y="100" width="230" height="170" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="740" y="124" text-anchor="middle" font-weight="bold" fill="#263238">postgres</text>
  <text x="740" y="144" text-anchor="middle" font-size="12" fill="#455a64">postgres:18, database bookshop</text>
  <text x="740" y="168" text-anchor="middle" font-size="12" fill="#263238">mirror: legacy_book,</text>
  <text x="740" y="186" text-anchor="middle" font-size="12" fill="#263238">legacy_author,</text>
  <text x="740" y="204" text-anchor="middle" font-size="12" fill="#263238">legacy_supplier_catalogue</text>
  <text x="740" y="226" text-anchor="middle" font-size="12" fill="#263238">new model: book, customer,</text>
  <text x="740" y="244" text-anchor="middle" font-size="12" fill="#263238">purchase_order, order_line ...</text>
  <text x="740" y="262" text-anchor="middle" font-size="12" fill="#455a64">port 5432</text>
  <line x1="550" y1="269" x2="623" y2="200" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="585" y="222" text-anchor="middle" font-size="12" fill="#455a64">JDBC</text>

  <!-- Spring Boot app (outside compose) -->
  <rect x="625" y="530" width="230" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="5 3"/>
  <text x="740" y="553" text-anchor="middle" fill="#263238">bookshop (Spring Boot 4.1)</text>
  <text x="740" y="572" text-anchor="middle" font-size="12" fill="#455a64">group bookshop-legacy-sync, on the host</text>
  <path d="M567,450 L700,528" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="640" y="478" font-size="12" fill="#455a64">ORDERS, CUSTOMER, BOOK ...</text>
  <path d="M790,528 L790,272" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="798" y="400" font-size="12" fill="#455a64">new model</text>

  <!-- legend -->
  <text x="40" y="545" font-size="12" fill="#455a64">Dashed outer box: containers started by compose.yaml.</text>
  <text x="40" y="563" font-size="12" fill="#455a64">Dashed app box: runs outside Docker against the published ports.</text>
</svg>
