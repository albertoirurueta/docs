<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Pyramid renderer flow</title>
  <defs><marker id="prr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From the view's return value to the response</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the rendered_view view deriver wraps every view that has a renderer= argument</text>
  <rect x="200" y="64" width="320" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="84" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">View callable returns a value</text>
  <text x="360.0" y="101" font-size="10.5" fill="currentColor" text-anchor="middle">a dict, a list, a model object, a string, or a Response</text>
  <line x1="360" y1="110" x2="360" y2="138" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <polygon points="360,140 520,180 360,220 200,180" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="176" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Is it a Response</text>
  <text x="360" y="193" font-size="10.5" fill="currentColor" text-anchor="middle">(or adaptable to IResponse)?</text>
  <line x1="520" y1="180" x2="590" y2="180" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <text x="555" y="172" font-size="11" fill="currentColor" text-anchor="middle" font-style="italic">yes</text>
  <rect x="590" y="150" width="124" height="60" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="650.0" y="170" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Renderer skipped</text>
  <text x="650.0" y="187" font-size="10.5" fill="currentColor" text-anchor="middle">returned unchanged</text>
  <line x1="360" y1="220" x2="360" y2="252" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <text x="372" y="240" font-size="11" fill="currentColor" text-anchor="start" font-style="italic">no</text>
  <rect x="160" y="254" width="400" height="50" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="274" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Choose the renderer</text>
  <text x="360.0" y="291" font-size="10.5" fill="currentColor" text-anchor="middle">view's renderer=, else the default renderer; override_renderer wins</text>
  <line x1="360" y1="304" x2="360" y2="332" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="160" y="334" width="400" height="50" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="354" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">BeforeRender event, then renderer(value, system)</text>
  <text x="360.0" y="371" font-size="10.5" fill="currentColor" text-anchor="middle">system: request, context, view, renderer_name, renderer_info</text>
  <line x1="360" y1="384" x2="360" y2="412" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="160" y="414" width="400" height="50" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="434" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Write the result into request.response</text>
  <text x="360.0" y="451" font-size="10.5" fill="currentColor" text-anchor="middle">body from the renderer; the view's status, headers and cookies survive</text>
  <line x1="360" y1="464" x2="360" y2="492" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="160" y="494" width="400" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="514" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response</text>
  <text x="360.0" y="531" font-size="10.5" fill="currentColor" text-anchor="middle">continues through response callbacks and the NewResponse event</text>
  <polyline points="650,210 650,517 560,517" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
</svg>
