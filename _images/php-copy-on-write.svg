<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Copy-on-write for PHP arrays</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">assignment shares one array and increments its reference count; the first write separates a private copy</text>

  <!-- step headers -->
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="150" y="80">1. $a = ['Solaris', 'Kindred'];</text>
    <text x="450" y="80">2. $b = $a;</text>
    <text x="750" y="80">3. $b[] = 'Dawn';</text>
  </g>
  <line x1="300" y1="64" x2="300" y2="400" stroke="#dddddd" stroke-width="1"/>
  <line x1="600" y1="64" x2="600" y2="400" stroke="#dddddd" stroke-width="1"/>

  <!-- step 1 -->
  <rect x="40" y="110" width="70" height="36" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="75" y="133" font-size="14" fill="#222222" text-anchor="middle">$a</text>
  <line x1="110" y1="128" x2="152" y2="128" stroke="#444444" stroke-width="1.4"/>
  <polygon points="160,128 152,123 152,133" fill="#444444"/>
  <rect x="160" y="100" width="120" height="110" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="220" y="122" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">array (packed)</text>
  <text x="220" y="142" font-size="12" fill="#222222" text-anchor="middle">refcount = 1</text>
  <line x1="170" y1="152" x2="270" y2="152" stroke="#bbbbbb" stroke-width="1"/>
  <text x="220" y="172" font-size="12" fill="#444444" text-anchor="middle">0: 'Solaris'</text>
  <text x="220" y="192" font-size="12" fill="#444444" text-anchor="middle">1: 'Kindred'</text>
  <text x="150" y="250" font-size="11" fill="#666666" text-anchor="middle">one variable, one array</text>

  <!-- step 2 -->
  <rect x="340" y="110" width="70" height="36" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="375" y="133" font-size="14" fill="#222222" text-anchor="middle">$a</text>
  <rect x="340" y="170" width="70" height="36" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="375" y="193" font-size="14" fill="#222222" text-anchor="middle">$b</text>
  <line x1="410" y1="128" x2="452" y2="140" stroke="#444444" stroke-width="1.4"/>
  <polygon points="460,142 451,135 449,145" fill="#444444"/>
  <line x1="410" y1="188" x2="452" y2="170" stroke="#444444" stroke-width="1.4"/>
  <polygon points="460,167 449,165 452,175" fill="#444444"/>
  <rect x="460" y="100" width="120" height="110" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="520" y="122" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">array (shared)</text>
  <text x="520" y="142" font-size="12" font-weight="bold" fill="#a05a00" text-anchor="middle">refcount = 2</text>
  <line x1="470" y1="152" x2="570" y2="152" stroke="#bbbbbb" stroke-width="1"/>
  <text x="520" y="172" font-size="12" fill="#444444" text-anchor="middle">0: 'Solaris'</text>
  <text x="520" y="192" font-size="12" fill="#444444" text-anchor="middle">1: 'Kindred'</text>
  <text x="450" y="250" font-size="11" fill="#666666" text-anchor="middle">no copy yet: assignment and passing</text>
  <text x="450" y="266" font-size="11" fill="#666666" text-anchor="middle">to functions are O(1)</text>

  <!-- step 3 -->
  <rect x="630" y="110" width="60" height="36" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="660" y="133" font-size="14" fill="#222222" text-anchor="middle">$a</text>
  <line x1="690" y1="128" x2="732" y2="128" stroke="#444444" stroke-width="1.4"/>
  <polygon points="740,128 732,123 732,133" fill="#444444"/>
  <rect x="740" y="100" width="140" height="90" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="810" y="120" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">original array</text>
  <text x="810" y="138" font-size="12" fill="#222222" text-anchor="middle">refcount = 1</text>
  <text x="810" y="158" font-size="12" fill="#444444" text-anchor="middle">0: 'Solaris'</text>
  <text x="810" y="176" font-size="12" fill="#444444" text-anchor="middle">1: 'Kindred'</text>

  <rect x="630" y="240" width="60" height="36" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="660" y="263" font-size="14" fill="#222222" text-anchor="middle">$b</text>
  <line x1="690" y1="258" x2="732" y2="258" stroke="#444444" stroke-width="1.4"/>
  <polygon points="740,258 732,253 732,263" fill="#444444"/>
  <rect x="740" y="215" width="140" height="110" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="810" y="235" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">separated copy</text>
  <text x="810" y="253" font-size="12" fill="#222222" text-anchor="middle">refcount = 1</text>
  <text x="810" y="273" font-size="12" fill="#444444" text-anchor="middle">0: 'Solaris'</text>
  <text x="810" y="291" font-size="12" fill="#444444" text-anchor="middle">1: 'Kindred'</text>
  <text x="810" y="311" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">2: 'Dawn'</text>
  <text x="750" y="356" font-size="11" fill="#666666" text-anchor="middle">the first write to a shared array copies it,</text>
  <text x="750" y="372" font-size="11" fill="#666666" text-anchor="middle">then writes go to the private copy</text>
  <text x="750" y="388" font-size="11" fill="#666666" text-anchor="middle">(the strings themselves stay shared)</text>
</svg>
