<svg viewBox="0 0 900 400" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Three IAM roles around one ECS task</text>

  <rect x="320" y="120" width="260" height="170" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="450" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">Fargate task catalog-api</text>
  <rect x="340" y="162" width="220" height="48" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="450" y="183" text-anchor="middle" font-size="12" fill="#123a72">Your application code</text>
  <text x="450" y="199" text-anchor="middle" font-size="10" fill="#3c4a58">AWS SDK default credential chain</text>
  <rect x="340" y="222" width="220" height="48" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="4,3"/>
  <text x="450" y="243" text-anchor="middle" font-size="12" fill="#123a72">ECS agent / Fargate platform</text>
  <text x="450" y="259" text-anchor="middle" font-size="10" fill="#3c4a58">acts before and around your code</text>

  <!-- execution role -->
  <rect x="20" y="60" width="240" height="100" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.8"/>
  <text x="140" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Task execution role</text>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#7a4800">used by ECS, at task start</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#7a4800">ECR pull, CloudWatch Logs write,</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#7a4800">resolve secrets and parameters</text>
  <line x1="260" y1="130" x2="320" y2="240" stroke="#c77700" stroke-width="2"/>
  <polygon points="320,240 310,232 316,229" fill="#c77700"/>

  <!-- task role -->
  <rect x="640" y="60" width="240" height="100" rx="10" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="1.8"/>
  <text x="760" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Task role</text>
  <text x="760" y="104" text-anchor="middle" font-size="11" fill="#14532d">used by your code, at run time</text>
  <text x="760" y="122" text-anchor="middle" font-size="11" fill="#14532d">S3, DynamoDB, SQS, ... plus the</text>
  <text x="760" y="138" text-anchor="middle" font-size="11" fill="#14532d">SSM messages channel for ECS Exec</text>
  <line x1="640" y1="130" x2="560" y2="180" stroke="#1e7b3a" stroke-width="2"/>
  <polygon points="560,180 570,178 566,170" fill="#1e7b3a"/>

  <!-- infra role -->
  <rect x="320" y="320" width="260" height="64" rx="10" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.8"/>
  <text x="450" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Infrastructure role</text>
  <text x="450" y="364" text-anchor="middle" font-size="11" fill="#4a1d75">Express Mode only: ECS builds ALB, SGs, scaling for you</text>
  <line x1="450" y1="320" x2="450" y2="296" stroke="#7b3fb5" stroke-width="2" stroke-dasharray="5,3"/>

  <text x="20" y="200" font-size="11" fill="#3c4a58">Both task roles trust</text>
  <text x="20" y="216" font-size="11" fill="#3c4a58">ecs-tasks.amazonaws.com;</text>
  <text x="20" y="232" font-size="11" fill="#3c4a58">the infrastructure role trusts</text>
  <text x="20" y="248" font-size="11" fill="#3c4a58">ecs.amazonaws.com.</text>
</svg>
