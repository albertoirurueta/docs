<text x="432.4" y="244" text-anchor="end" font-weight="bold">knee ≈ 192 users</text>
<text x="432.4" y="258" text-anchor="end">N* = Xmax × (R + Z) = 60 × 3.2</text>
<text x="446.4" y="78" fill-opacity="0.8">saturated region</text>
<text x="276.0" y="96.9" fill="#3d7fd1">capacity Xmax ≈ 60 req/s</text>
