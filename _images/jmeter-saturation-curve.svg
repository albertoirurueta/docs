<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Saturation curve: throughput and response time versus concurrent users</title>
<desc id="d">Closed-model Bookshelf stress test with think time 3 s and light-load response time 0.2 s. Throughput rises linearly with users at N/(R+Z) until it flattens at a capacity of about 60 requests per second; the knee is near 190 users. Past the knee the average response time grows linearly, following R = N/X - Z.</desc>
<g fill="currentColor" stroke="none">
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold">Throughput and response time vs concurrent users (closed model)</text>
<text x="360" y="42" text-anchor="middle" font-size="11" fill-opacity="0.75">Bookshelf stress test: Z = 3 s think time, R = 0.2 s at light load, capacity about 60 req/s</text>
</g>
<rect x="438.4" y="60" width="201.6" height="300" fill="#e0782f" fill-opacity="0.08"/>
