<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c2b2b"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Model 1 and Model 2 for the same Bookshelf request</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">GET /books?filter=dune: who receives the request, who talks to the repository, who writes the HTML</text>

  <!-- panel divider -->
  <line x1="450" y1="64" x2="450" y2="480" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- ===== Model 1 (left) ===== -->
  <text x="225" y="78" font-size="14" font-weight="bold" fill="#5a1a1a" text-anchor="middle">Model 1: page-centric</text>
  <text x="225" y="94" font-size="11" fill="#666666" text-anchor="middle">the page is the controller, the logic and the view</text>

  <rect x="30" y="130" width="110" height="90" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="85" y="160" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="85" y="180" font-size="11" fill="#444444" text-anchor="middle">GET books.jsp</text>
  <text x="85" y="196" font-size="11" fill="#444444" text-anchor="middle">?filter=dune</text>

  <rect x="190" y="110" width="220" height="150" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.6"/>
  <text x="300" y="134" font-size="13" font-weight="bold" fill="#5a1a1a" text-anchor="middle">books.jsp</text>
  <text x="300" y="156" font-size="11" fill="#8c2b2b" text-anchor="middle">reads param.filter</text>
  <text x="300" y="174" font-size="11" fill="#8c2b2b" text-anchor="middle">calls the repository bean</text>
  <text x="300" y="192" font-size="11" fill="#8c2b2b" text-anchor="middle">decides what to show</text>
  <text x="300" y="210" font-size="11" fill="#8c2b2b" text-anchor="middle">loops and writes the HTML</text>
  <text x="300" y="240" font-size="11" font-style="italic" fill="#5a1a1a" text-anchor="middle">controller + model access + view</text>

  <rect x="190" y="330" width="220" height="64" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="300" y="356" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">BookRepository</text>
  <text x="300" y="376" font-size="11" fill="#2b4c8c" text-anchor="middle">search(filter)</text>

  <line x1="140" y1="175" x2="188" y2="175" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="300" y1="262" x2="300" y2="328" stroke="#8c2b2b" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="310" y="300" font-size="11" fill="#8c2b2b">direct call from the page</text>
  <path d="M 190 235 L 160 235 L 160 200 L 142 200" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="160" y="254" font-size="11" fill="#444444" text-anchor="middle">HTML</text>

  <text x="225" y="430" font-size="11" fill="#5a1a1a" text-anchor="middle">Quick to write, but every page repeats the same logic and</text>
  <text x="225" y="446" font-size="11" fill="#5a1a1a" text-anchor="middle">there is no single place for security, errors or navigation.</text>
  <text x="225" y="466" font-size="11" fill="#666666" text-anchor="middle">Example URL: /model1/books.jsp</text>

  <!-- ===== Model 2 (right) ===== -->
  <text x="675" y="78" font-size="14" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Model 2: servlet-centric (MVC)</text>
  <text x="675" y="94" font-size="11" fill="#666666" text-anchor="middle">a front controller picks the model work and the view</text>

  <rect x="470" y="130" width="100" height="90" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="520" y="160" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="520" y="180" font-size="11" fill="#444444" text-anchor="middle">GET /books</text>
  <text x="520" y="196" font-size="11" fill="#444444" text-anchor="middle">?filter=dune</text>

  <rect x="600" y="110" width="130" height="150" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="665" y="134" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Controller</text>
  <text x="665" y="154" font-size="10" fill="#2b4c8c" text-anchor="middle">servlet or Struts filter</text>
  <text x="665" y="178" font-size="11" fill="#2b4c8c" text-anchor="middle">reads the request</text>
  <text x="665" y="196" font-size="11" fill="#2b4c8c" text-anchor="middle">calls the model</text>
  <text x="665" y="214" font-size="11" fill="#2b4c8c" text-anchor="middle">sets request attribute</text>
  <text x="665" y="232" font-size="11" fill="#2b4c8c" text-anchor="middle">forwards to a view</text>

  <rect x="760" y="110" width="120" height="70" fill="#e8f4e8" stroke="#2b6c2b" stroke-width="1.6"/>
  <text x="820" y="136" font-size="13" font-weight="bold" fill="#1a4a1a" text-anchor="middle">View</text>
  <text x="820" y="154" font-size="11" fill="#2b6c2b" text-anchor="middle">/WEB-INF/views/</text>
  <text x="820" y="168" font-size="11" fill="#2b6c2b" text-anchor="middle">books.jsp</text>

  <rect x="600" y="330" width="130" height="64" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="665" y="356" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">BookRepository</text>
  <text x="665" y="376" font-size="11" fill="#2b4c8c" text-anchor="middle">the model</text>

  <line x1="570" y1="175" x2="598" y2="175" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="665" y1="262" x2="665" y2="328" stroke="#2b4c8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="675" y="300" font-size="11" fill="#2b4c8c">search(filter)</text>
  <line x1="730" y1="140" x2="758" y2="140" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="744" y="104" font-size="10" fill="#444444" text-anchor="middle">forward</text>
  <path d="M 820 182 L 820 290 L 520 290 L 520 222" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="790" y="284" font-size="11" fill="#444444" text-anchor="middle">HTML</text>

  <text x="675" y="430" font-size="11" fill="#1a2f5a" text-anchor="middle">One entry point, logic outside the view, the view only renders.</text>
  <text x="675" y="446" font-size="11" fill="#1a2f5a" text-anchor="middle">Struts 1 and Struts 2 are Model 2 frameworks.</text>
  <text x="675" y="466" font-size="11" fill="#666666" text-anchor="middle">Example URL: /model2/books</text>
</svg>
