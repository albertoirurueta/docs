<svg viewBox="0 0 980 526" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="980" height="526" fill="#ffffff"/>
<text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Publish modes for a Windows desktop app: size, prerequisites and stack support</text>
<text x="490" y="47" font-size="13" fill="#666666" text-anchor="middle">Green: supported. Grey: not supported. Amber: supported with conditions. The words say the same as the colour.</text>
<rect x="20" y="64" width="220" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="130.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Deployment mode</text>
<rect x="250" y="64" width="160" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="330.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Size on disk</text>
<rect x="420" y="64" width="210" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="525.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Prerequisite on the target PC</text>
<rect x="640" y="64" width="100" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="690.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">WPF</text>
<rect x="750" y="64" width="100" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="800.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">WinForms</text>
<rect x="860" y="64" width="100" height="40" rx="6" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
<text x="910.0" y="89" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">WinUI 3</text>
<rect x="20" y="114" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="142" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Framework-dependent (FDD)</text>
<rect x="250" y="114" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="142" font-size="12" fill="#222222" text-anchor="middle">Smallest</text>
<rect x="420" y="114" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="134" font-size="12" fill="#222222" text-anchor="middle">Matching .NET Desktop</text>
<text x="525.0" y="150" font-size="12" fill="#222222" text-anchor="middle">Runtime installed</text>
<rect x="640" y="114" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="690.0" y="142" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="750" y="114" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="800.0" y="142" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="860" y="114" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="910.0" y="142" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="20" y="170" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="198" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Self-contained (SCD)</text>
<rect x="250" y="170" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="198" font-size="12" fill="#222222" text-anchor="middle">Large</text>
<rect x="420" y="170" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="190" font-size="12" fill="#222222" text-anchor="middle">Nothing (runtime ships in</text>
<text x="525.0" y="206" font-size="12" fill="#222222" text-anchor="middle">the folder)</text>
<rect x="640" y="170" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="690.0" y="198" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="750" y="170" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="800.0" y="198" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="860" y="170" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="910.0" y="198" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="20" y="226" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="254" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Single-file (SCD or FDD)</text>
<rect x="250" y="226" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="254" font-size="12" fill="#222222" text-anchor="middle">Large (one EXE)</text>
<rect x="420" y="226" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="246" font-size="12" fill="#222222" text-anchor="middle">Same as the mode</text>
<text x="525.0" y="262" font-size="12" fill="#222222" text-anchor="middle">underneath</text>
<rect x="640" y="226" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="690.0" y="254" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="750" y="226" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="800.0" y="254" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="860" y="226" width="100" height="46" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.2"/>
<text x="910.0" y="246" font-size="12" fill="#9a6200" text-anchor="middle">Unpackaged +</text>
<text x="910.0" y="262" font-size="12" fill="#9a6200" text-anchor="middle">SCD only</text>
<rect x="20" y="282" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="310" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">ReadyToRun (R2R)</text>
<rect x="250" y="282" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="310" font-size="12" fill="#222222" text-anchor="middle">Assemblies 2-3x bigger</text>
<rect x="420" y="282" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="302" font-size="12" fill="#222222" text-anchor="middle">Needs a RID; same as the</text>
<text x="525.0" y="318" font-size="12" fill="#222222" text-anchor="middle">mode</text>
<rect x="640" y="282" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="690.0" y="310" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="750" y="282" width="100" height="46" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
<text x="800.0" y="310" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
<rect x="860" y="282" width="100" height="46" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.2"/>
<text x="910.0" y="310" font-size="13" fill="#9a6200" text-anchor="middle">Test it</text>
<rect x="20" y="338" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="366" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Trimmed (PublishTrimmed)</text>
<rect x="250" y="338" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="366" font-size="12" fill="#222222" text-anchor="middle">Smaller than plain SCD</text>
<rect x="420" y="338" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="358" font-size="12" fill="#222222" text-anchor="middle">SCD only; none on the</text>
<text x="525.0" y="374" font-size="12" fill="#222222" text-anchor="middle">target</text>
<rect x="640" y="338" width="100" height="46" rx="6" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/>
<text x="690.0" y="366" font-size="13" fill="#555555" text-anchor="middle">No</text>
<rect x="750" y="338" width="100" height="46" rx="6" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/>
<text x="800.0" y="366" font-size="13" fill="#555555" text-anchor="middle">No</text>
<rect x="860" y="338" width="100" height="46" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.2"/>
<text x="910.0" y="366" font-size="13" fill="#9a6200" text-anchor="middle">Test first</text>
<rect x="20" y="394" width="220" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="130.0" y="422" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Native AOT (PublishAot)</text>
<rect x="250" y="394" width="160" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="330.0" y="422" font-size="12" fill="#222222" text-anchor="middle">Native binary + runtime</text>
<rect x="420" y="394" width="210" height="46" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="525.0" y="414" font-size="12" fill="#222222" text-anchor="middle">SCD only; C++ tools to</text>
<text x="525.0" y="430" font-size="12" fill="#222222" text-anchor="middle">build</text>
<rect x="640" y="394" width="100" height="46" rx="6" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/>
<text x="690.0" y="422" font-size="13" fill="#555555" text-anchor="middle">No</text>
<rect x="750" y="394" width="100" height="46" rx="6" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/>
<text x="800.0" y="422" font-size="13" fill="#555555" text-anchor="middle">No</text>
<rect x="860" y="394" width="100" height="46" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.2"/>
<text x="910.0" y="414" font-size="12" fill="#9a6200" text-anchor="middle">Since</text>
<text x="910.0" y="430" font-size="12" fill="#9a6200" text-anchor="middle">WinAppSDK 1.6</text>
<text x="20" y="472" font-size="12" fill="#666666">Trimming and Native AOT are disabled in the SDK for WPF and Windows Forms. Single-file for WinUI 3 needs an unpackaged, self-contained app.</text>
<text x="20" y="490" font-size="12" fill="#666666">Every mode except framework-dependent portable DLLs is tied to a runtime identifier: win-x64, win-x86 or win-arm64.</text>
</svg>