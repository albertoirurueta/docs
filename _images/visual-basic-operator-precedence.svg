<svg viewBox="0 0 960 708" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Visual Basic operator precedence</title>
  <desc id="d">A ladder of fourteen precedence ranks, from Await at the top, evaluated first, down to Xor at the bottom, evaluated last. Arithmetic and concatenation operators come first, then the comparison operators, then the logical and bitwise operators Not, And, Or and Xor.</desc>
  <rect x="0" y="0" width="960" height="708" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Visual Basic operator precedence, highest rank first</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">operators of the same rank are evaluated from left to right; parentheses override every rank</text>
  <text x="24" y="78" font-size="12" font-weight="bold" fill="#444444">rank</text>
  <text x="86" y="78" font-size="12" font-weight="bold" fill="#444444">operators</text>
  <text x="466" y="78" font-size="12" font-weight="bold" fill="#444444">what to remember (checked on .NET 10)</text>
  <rect x="20" y="92" width="920" height="34" fill="#f1f1f1" stroke="#555555" stroke-width="1.2"/>
  <text x="48" y="114" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">1</text>
  <text x="86" y="114" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">Await</text>
  <text x="466" y="114" font-size="12" fill="#333333">Await binds tighter than every other operator</text>
  <rect x="20" y="130" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="152" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <text x="86" y="152" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">^</text>
  <text x="466" y="152" font-size="12" fill="#333333">left-associative: 2 ^ 3 ^ 2 = 64; the result is always Double</text>
  <rect x="20" y="168" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="190" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <text x="86" y="190" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">unary +  -</text>
  <text x="466" y="190" font-size="12" fill="#333333">-2 ^ 2 = -4, because ^ is higher; 2 ^ -1 = 0.5</text>
  <rect x="20" y="206" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="228" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <text x="86" y="228" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">*  /</text>
  <text x="466" y="228" font-size="12" fill="#333333">/ is floating-point division; equal rank, left to right</text>
  <rect x="20" y="244" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="266" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <text x="86" y="266" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">\</text>
  <text x="466" y="266" font-size="12" fill="#333333">integer division, toward zero: 7 \ 2 * 3 = 1</text>
  <rect x="20" y="282" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="304" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">6</text>
  <text x="86" y="304" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">Mod</text>
  <text x="466" y="304" font-size="12" fill="#333333">sign of the dividend: 17 Mod 5 * 2 = 7</text>
  <rect x="20" y="320" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="342" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">7</text>
  <text x="86" y="342" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">binary +  -</text>
  <text x="466" y="342" font-size="12" fill="#333333">+ also concatenates two Strings</text>
  <rect x="20" y="358" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="380" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">8</text>
  <text x="86" y="380" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">&amp;</text>
  <text x="466" y="380" font-size="12" fill="#333333">string concatenation: "a" &amp; 1 + 2 = a3</text>
  <rect x="20" y="396" width="920" height="34" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="48" y="418" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">9</text>
  <text x="86" y="418" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">&lt;&lt;  &gt;&gt;</text>
  <text x="466" y="418" font-size="12" fill="#333333">bit shifts rank below &amp; and +: 1 &lt;&lt; 2 + 1 = 8</text>
  <rect x="20" y="434" width="920" height="34" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="48" y="456" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">10</text>
  <text x="86" y="456" font-size="11" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">=  &lt;&gt;  &lt;  &lt;=  &gt;  &gt;=  Is  IsNot  Like  TypeOf ... Is</text>
  <text x="466" y="456" font-size="12" fill="#333333">one rank, left to right: 5 &gt; 3 = True is (5 &gt; 3) = True</text>
  <rect x="20" y="472" width="920" height="34" fill="#fff8e1" stroke="#b28704" stroke-width="1.2"/>
  <text x="48" y="494" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">11</text>
  <text x="86" y="494" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">Not</text>
  <text x="466" y="494" font-size="12" fill="#333333">Not 1 = 2 is Not (1 = 2), so it is True</text>
  <rect x="20" y="510" width="920" height="34" fill="#fff8e1" stroke="#b28704" stroke-width="1.2"/>
  <text x="48" y="532" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">12</text>
  <text x="86" y="532" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">And  AndAlso</text>
  <text x="466" y="532" font-size="12" fill="#333333">AndAlso skips its right operand when the left is False</text>
  <rect x="20" y="548" width="920" height="34" fill="#fff8e1" stroke="#b28704" stroke-width="1.2"/>
  <text x="48" y="570" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">13</text>
  <text x="86" y="570" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">Or  OrElse</text>
  <text x="466" y="570" font-size="12" fill="#333333">OrElse skips its right operand when the left is True</text>
  <rect x="20" y="586" width="920" height="34" fill="#fff8e1" stroke="#b28704" stroke-width="1.2"/>
  <text x="48" y="608" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">14</text>
  <text x="86" y="608" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="bold" fill="#222222">Xor</text>
  <text x="466" y="608" font-size="12" fill="#333333">lowest: True Xor True Or True = False</text>
  <text x="24" y="642" font-size="12" font-weight="bold" fill="#444444">rank 1 is evaluated first, rank 14 last</text>
  <rect x="24" y="654" width="16" height="16" fill="#f1f1f1" stroke="#555555" stroke-width="1.2"/>
  <text x="48" y="666" font-size="12" fill="#333333">Await</text>
  <rect x="113" y="654" width="16" height="16" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="137" y="666" font-size="12" fill="#333333">arithmetic, concatenation, shifts</text>
  <rect x="398" y="654" width="16" height="16" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="422" y="666" font-size="12" fill="#333333">comparison</text>
  <rect x="522" y="654" width="16" height="16" fill="#fff8e1" stroke="#b28704" stroke-width="1.2"/>
  <text x="546" y="666" font-size="12" fill="#333333">logical and bitwise</text>
</svg>
