<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How the Thymeleaf engine renders a template</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">template name and Context in, markup or text out</text>

  <!-- inputs -->
  <rect x="20" y="80" width="130" height="64" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="85" y="106" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Template name</text>
  <text x="85" y="126" font-size="11" fill="#444444" text-anchor="middle">books/list</text>

  <rect x="20" y="250" width="130" height="64" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="85" y="276" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Context</text>
  <text x="85" y="296" font-size="11" fill="#444444" text-anchor="middle">model, locale, request</text>

  <!-- resolver -->
  <rect x="190" y="80" width="130" height="64" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="255" y="106" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Template resolvers</text>
  <text x="255" y="126" font-size="11" fill="#2b4c8c" text-anchor="middle">prefix, suffix, mode</text>

  <!-- cache -->
  <rect x="360" y="80" width="130" height="64" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="425" y="106" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">Template cache</text>
  <text x="425" y="126" font-size="11" fill="#8a6a00" text-anchor="middle">parsed events, hit or miss</text>

  <!-- parser -->
  <rect x="360" y="190" width="130" height="64" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="425" y="216" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Parser</text>
  <text x="425" y="236" font-size="11" fill="#2b4c8c" text-anchor="middle">markup or text to events</text>

  <!-- processors -->
  <rect x="530" y="140" width="150" height="110" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="605" y="166" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">Processors</text>
  <text x="605" y="186" font-size="11" fill="#1e6b34" text-anchor="middle">of every dialect</text>
  <text x="605" y="206" font-size="11" fill="#1e6b34" text-anchor="middle">th:text, th:each, ...</text>
  <text x="605" y="226" font-size="11" fill="#1e6b34" text-anchor="middle">OGNL or SpEL</text>

  <!-- expression cache -->
  <rect x="530" y="290" width="150" height="50" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="605" y="312" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">Expression cache</text>
  <text x="605" y="329" font-size="11" fill="#8a6a00" text-anchor="middle">parsed expressions</text>

  <!-- output -->
  <rect x="720" y="165" width="120" height="64" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="780" y="191" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Writer</text>
  <text x="780" y="211" font-size="11" fill="#444444" text-anchor="middle">HTML, XML, text</text>

  <!-- arrows -->
  <g stroke="#444444" stroke-width="1.6" fill="#444444">
    <line x1="150" y1="112" x2="184" y2="112"/><polygon points="190,112 182,107 182,117"/>
    <line x1="320" y1="112" x2="354" y2="112"/><polygon points="360,112 352,107 352,117"/>
    <line x1="425" y1="144" x2="425" y2="184"/><polygon points="425,190 420,182 430,182"/>
    <line x1="490" y1="222" x2="524" y2="205"/><polygon points="530,202 521,200 526,209"/>
    <line x1="490" y1="112" x2="605" y2="112" /><line x1="605" y1="112" x2="605" y2="134"/><polygon points="605,140 600,132 610,132"/>
    <line x1="150" y1="282" x2="605" y2="282" stroke-dasharray="5 4"/><line x1="605" y1="282" x2="605" y2="256" stroke-dasharray="5 4"/><polygon points="605,250 600,258 610,258"/>
    <line x1="680" y1="197" x2="714" y2="197"/><polygon points="720,197 712,192 712,202"/>
    <line x1="605" y1="290" x2="605" y2="286" />
  </g>
  <text x="400" y="274" font-size="11" fill="#444444" text-anchor="middle">variables</text>
  <text x="498" y="104" font-size="10" fill="#666666">hit</text>
  <text x="432" y="168" font-size="10" fill="#666666">miss</text>
</svg>
