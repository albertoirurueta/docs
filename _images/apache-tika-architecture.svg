<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Apache Tika: from an unknown file to text, metadata and a media type</text>
<text x="450" y="46" text-anchor="middle" font-size="12" fill="#444444">Blue: you supply, green: Tika does the work, amber: what comes out, grey: where it goes</text>
<rect x="20" y="90" width="140" height="110" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="90.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Input</text>
<text x="90.0" y="134" text-anchor="middle" font-size="11.5" fill="#333333">TikaInputStream</text>
<text x="90.0" y="150" text-anchor="middle" font-size="11.5" fill="#333333">Path, byte[], URL</text>
<text x="90.0" y="166" text-anchor="middle" font-size="11.5" fill="#333333">name and type hints</text>
<text x="90.0" y="182" text-anchor="middle" font-size="11.5" fill="#333333">(Metadata in)</text>
<rect x="200" y="90" width="150" height="110" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="275.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Detector</text>
<text x="275.0" y="134" text-anchor="middle" font-size="11.5" fill="#333333">DefaultDetector</text>
<text x="275.0" y="150" text-anchor="middle" font-size="11.5" fill="#333333">magic bytes, names,</text>
<text x="275.0" y="166" text-anchor="middle" font-size="11.5" fill="#333333">container peeking</text>
<text x="275.0" y="182" text-anchor="middle" font-size="11.5" fill="#333333">-&gt; MediaType</text>
<rect x="390" y="90" width="150" height="110" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="465.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Parser</text>
<text x="465.0" y="134" text-anchor="middle" font-size="11.5" fill="#333333">AutoDetectParser</text>
<text x="465.0" y="150" text-anchor="middle" font-size="11.5" fill="#333333">picks the parser for</text>
<text x="465.0" y="166" text-anchor="middle" font-size="11.5" fill="#333333">the media type, e.g.</text>
<text x="465.0" y="182" text-anchor="middle" font-size="11.5" fill="#333333">PDF, OOXML, HTML</text>
<rect x="580" y="60" width="150" height="70" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="655.0" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Content handler</text>
<text x="655.0" y="104" text-anchor="middle" font-size="11.5" fill="#333333">XHTML events -&gt; text,</text>
<text x="655.0" y="120" text-anchor="middle" font-size="11.5" fill="#333333">Markdown, XML, HTML</text>
<rect x="580" y="150" width="150" height="70" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="655.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Metadata</text>
<text x="655.0" y="194" text-anchor="middle" font-size="11.5" fill="#333333">title, creator, dates,</text>
<text x="655.0" y="210" text-anchor="middle" font-size="11.5" fill="#333333">tk: keys, Content-Type</text>
<rect x="770" y="90" width="110" height="110" rx="8" fill="#e8e8e8" stroke="#666666" stroke-width="1.6"/>
<text x="825.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Consumers</text>
<text x="825.0" y="134" text-anchor="middle" font-size="11.5" fill="#333333">search index</text>
<text x="825.0" y="150" text-anchor="middle" font-size="11.5" fill="#333333">RAG chunks</text>
<text x="825.0" y="166" text-anchor="middle" font-size="11.5" fill="#333333">database</text>
<text x="825.0" y="182" text-anchor="middle" font-size="11.5" fill="#333333">UI preview</text>
<line x1="160" y1="145" x2="198" y2="145" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="350" y1="145" x2="388" y2="145" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="540" y1="120" x2="578" y2="100" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="540" y1="170" x2="578" y2="185" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="730" y1="100" x2="768" y2="125" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="730" y1="185" x2="768" y2="170" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="250" width="860" height="150" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.2"/>
<text x="450" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Where the parser runs</text>
<rect x="40" y="288" width="250" height="98" rx="8" fill="#ffffff" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="165.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Embedded (your JVM)</text>
<text x="165.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">Tika facade or AutoDetectParser</text>
<text x="165.0" y="348" text-anchor="middle" font-size="11.5" fill="#333333">fastest, but a crash, a loop or an</text>
<text x="165.0" y="364" text-anchor="middle" font-size="11.5" fill="#333333">OutOfMemoryError is yours to handle</text>
<rect x="325" y="288" width="250" height="98" rx="8" fill="#ffffff" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="450.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Forked JVM</text>
<text x="450.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">PipesForkParser: separate process,</text>
<text x="450.0" y="348" text-anchor="middle" font-size="11.5" fill="#333333">timeouts, restart after a crash,</text>
<text x="450.0" y="364" text-anchor="middle" font-size="11.5" fill="#333333">thread-safe, local files only</text>
<rect x="610" y="288" width="250" height="98" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/>
<text x="735.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Service or pipeline</text>
<text x="735.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">tika-server, tika-grpc, Tika Pipes:</text>
<text x="735.0" y="348" text-anchor="middle" font-size="11.5" fill="#333333">REST or gRPC, fetchers and emitters,</text>
<text x="735.0" y="364" text-anchor="middle" font-size="11.5" fill="#333333">any language, isolated upgrades</text>
<text x="450" y="418" text-anchor="middle" font-size="11" fill="#444444">The same detect, parse, handler and metadata steps happen in all three; only the process boundary changes.</text>
</svg>
