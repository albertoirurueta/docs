<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Spring Data access layers</text>

  <defs>
    <marker id="sd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Box 1: Application code -->
  <rect x="20" y="110" width="180" height="70" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="110" y="140" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Application</text>
  <text x="110" y="157" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">code</text>

  <line x1="200" y1="145" x2="234" y2="145" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#sd-arrow)"/>

  <!-- Box 2: Repository interface -->
  <rect x="236" y="96" width="200" height="98" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="336" y="126" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Repository interface</text>
  <text x="336" y="146" font-size="10.5" fill="#666666" text-anchor="middle">derived query methods</text>
  <text x="336" y="161" font-size="10.5" fill="#666666" text-anchor="middle">(findByLastName)</text>
  <text x="336" y="178" font-size="10.5" fill="#666666" text-anchor="middle">@Query</text>

  <line x1="436" y1="145" x2="470" y2="145" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#sd-arrow)"/>

  <!-- Box 3: Low-level Template/Client -->
  <rect x="472" y="86" width="230" height="118" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="587" y="112" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Low-level</text>
  <text x="587" y="130" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Template / Client</text>
  <text x="587" y="150" font-size="10" fill="#666666" text-anchor="middle">JdbcClient, MongoTemplate,</text>
  <text x="587" y="164" font-size="10" fill="#666666" text-anchor="middle">CouchbaseTemplate, Neo4jClient</text>

  <text x="587" y="228" font-size="10.5" fill="#666666" text-anchor="middle">used for queries a</text>
  <text x="587" y="242" font-size="10.5" fill="#666666" text-anchor="middle">repository can't express</text>
  <line x1="587" y1="204" x2="587" y2="214" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="702" y1="145" x2="736" y2="145" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#sd-arrow)"/>

  <!-- Box 4: Native driver -->
  <rect x="738" y="110" width="142" height="70" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="809" y="140" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Native</text>
  <text x="809" y="157" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">driver</text>

  <text x="450" y="272" font-size="11" fill="#444444" text-anchor="middle">Most application code only ever calls the repository; the template/client is an escape hatch for the rest.</text>
</svg>
