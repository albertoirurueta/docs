<svg viewBox="0 0 900 540" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Site-to-Site VPN and Client VPN into the Bookshelf VPC</text>

  <!-- On-premises -->
  <rect x="16" y="52" width="210" height="200" rx="8" fill="#fbe8cf" stroke="#c77c00" stroke-width="1.3"/>
  <text x="121" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a00">Office / data centre</text>
  <rect x="32" y="86" width="178" height="68" rx="5" fill="#ffffff" stroke="#c77c00"/>
  <text x="121" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a00">Customer gateway device</text>
  <text x="121" y="122" text-anchor="middle" font-size="9.5" fill="#3c4043">IPsec/IKEv2, BGP ASN 65010</text>
  <text x="121" y="138" text-anchor="middle" font-size="9.5" fill="#3c4043">public IP 203.0.113.10</text>
  <rect x="32" y="166" width="178" height="68" rx="5" fill="#ffffff" stroke="#c77c00"/>
  <text x="121" y="186" text-anchor="middle" font-size="11" fill="#3c4043">On-premises LAN</text>
  <text x="121" y="202" text-anchor="middle" font-size="9.5" fill="#3c4043">192.168.10.0/24</text>
  <text x="121" y="218" text-anchor="middle" font-size="9.5" fill="#3c4043">build agents, back office</text>

  <!-- Admin laptop -->
  <rect x="16" y="300" width="210" height="110" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.3"/>
  <text x="121" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#4a2170">Admin laptop (anywhere)</text>
  <text x="121" y="342" text-anchor="middle" font-size="9.5" fill="#3c4043">AWS-provided client or OpenVPN client</text>
  <text x="121" y="358" text-anchor="middle" font-size="9.5" fill="#3c4043">imports the exported .ovpn profile</text>
  <text x="121" y="374" text-anchor="middle" font-size="9.5" fill="#3c4043">gets an address from the client CIDR</text>
  <text x="121" y="390" text-anchor="middle" font-size="9.5" fill="#3c4043">172.20.0.0/22 (split tunnel)</text>

  <!-- Internet label -->
  <rect x="262" y="214" width="76" height="26" rx="13" fill="#eef1f4" stroke="#8a949e"/>
  <text x="300" y="231" text-anchor="middle" font-size="10" fill="#3c4043">Internet</text>

  <!-- Region / VPC -->
  <rect x="360" y="46" width="526" height="474" rx="10" fill="#f6f8fa" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="374" y="66" font-size="11.5" font-weight="700" fill="#3c4043">AWS Region (us-east-1 as a placeholder)</text>

  <!-- VPC -->
  <rect x="376" y="130" width="496" height="372" rx="10" fill="#eef7ee" stroke="#188038" stroke-width="1.5"/>
  <text x="390" y="150" font-size="12" font-weight="700" fill="#0d4c22">VPC bookshelf-vpc 10.0.0.0/16</text>

  <!-- VGW at VPC edge -->
  <rect x="392" y="166" width="150" height="62" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1.3"/>
  <text x="467" y="187" text-anchor="middle" font-size="11" font-weight="700" fill="#0d4c22">Virtual private gateway</text>
  <text x="467" y="203" text-anchor="middle" font-size="9.5" fill="#3c4043">attached to this VPC only</text>
  <text x="467" y="217" text-anchor="middle" font-size="9.5" fill="#3c4043">route propagation on</text>

  <!-- Client VPN endpoint -->
  <rect x="392" y="262" width="150" height="86" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.3"/>
  <text x="467" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">cvpn-bookshelf</text>
  <text x="467" y="299" text-anchor="middle" font-size="9.5" fill="#3c4043">Client VPN endpoint</text>
  <text x="467" y="313" text-anchor="middle" font-size="9.5" fill="#3c4043">mutual TLS / SAML / AD</text>
  <text x="467" y="327" text-anchor="middle" font-size="9.5" fill="#3c4043">authorization rules per group</text>
  <text x="467" y="341" text-anchor="middle" font-size="9.5" fill="#3c4043">connection log to CloudWatch</text>

  <!-- Private subnets -->
  <rect x="574" y="166" width="282" height="150" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="588" y="186" font-size="11" font-weight="700" fill="#0d4c22">Private subnet, AZ a (10.0.10.0/24)</text>
  <rect x="588" y="198" width="124" height="46" rx="5" fill="#fff4e0" stroke="#c77c00"/>
  <text x="650" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Client VPN ENI</text>
  <text x="650" y="232" text-anchor="middle" font-size="9" fill="#3c4043">SNAT to its own IP</text>
  <rect x="722" y="198" width="120" height="46" rx="5" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="782" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">Aurora PostgreSQL</text>
  <text x="782" y="232" text-anchor="middle" font-size="9" fill="#3c4043">bookshelf-catalog</text>
  <rect x="588" y="256" width="254" height="44" rx="5" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="715" y="275" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">OpenSearch domain (VPC access)</text>
  <text x="715" y="290" text-anchor="middle" font-size="9" fill="#3c4043">security group allows the Client VPN group</text>

  <rect x="574" y="332" width="282" height="76" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="588" y="352" font-size="11" font-weight="700" fill="#0d4c22">Private subnet, AZ b (10.0.11.0/24)</text>
  <rect x="588" y="362" width="124" height="34" rx="5" fill="#fff4e0" stroke="#c77c00"/>
  <text x="650" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Client VPN ENI</text>
  <text x="782" y="383" text-anchor="middle" font-size="9.5" fill="#3c4043">replica / standby targets</text>

  <!-- Transit gateway alternative -->
  <rect x="392" y="424" width="464" height="64" rx="8" fill="#ffffff" stroke="#8430ce" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="408" y="445" font-size="11" font-weight="700" fill="#5a1a99">Alternative: Transit Gateway instead of the virtual private gateway</text>
  <text x="408" y="462" font-size="9.5" fill="#3c4043">VPN attachments, VPC attachments and (since 2026) a direct Client VPN attachment share one routing hub;</text>
  <text x="408" y="476" font-size="9.5" fill="#3c4043">needed for several VPCs, large-bandwidth 5 Gbps tunnels and the VPN Concentrator.</text>

  <!-- Customer gateway object -->
  <rect x="262" y="96" width="76" height="40" rx="5" fill="#eef3fb" stroke="#2c5aa0"/>
  <text x="300" y="113" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d73">Customer</text>
  <text x="300" y="127" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d73">gateway (cgw)</text>

  <!-- S2S tunnels -->
  <line x1="226" y1="108" x2="262" y2="116" stroke="#2c5aa0" stroke-width="2"/>
  <line x1="338" y1="116" x2="392" y2="190" stroke="#2c5aa0" stroke-width="2.4"/>
  <line x1="338" y1="122" x2="392" y2="204" stroke="#2c5aa0" stroke-width="2.4"/>
  <text x="300" y="82" text-anchor="middle" font-size="9" fill="#173d73">Site-to-Site VPN connection:</text>
  <text x="300" y="92" text-anchor="middle" font-size="9" fill="#173d73">two IPsec tunnels</text>

  <!-- Client VPN path -->
  <polyline points="226,355 300,355 300,310 392,310" fill="none" stroke="#7b3fb5" stroke-width="2.4"/>
  <text x="300" y="372" text-anchor="middle" font-size="9" fill="#4a2170">TLS (OpenVPN) on 443</text>

  <!-- endpoint to ENIs -->
  <line x1="542" y1="305" x2="588" y2="221" stroke="#7b3fb5" stroke-width="1.6"/>
  <line x1="542" y1="325" x2="588" y2="379" stroke="#7b3fb5" stroke-width="1.6"/>
  <line x1="712" y1="221" x2="722" y2="221" stroke="#188038" stroke-width="1.6"/>

  <!-- VGW to subnets -->
  <line x1="542" y1="197" x2="574" y2="197" stroke="#2c5aa0" stroke-width="2"/>

  <!-- Legend -->
  <line x1="32" y1="450" x2="62" y2="450" stroke="#2c5aa0" stroke-width="2.4"/>
  <text x="70" y="454" font-size="9.5" fill="#3c4043">Site-to-Site VPN (network to network)</text>
  <line x1="32" y1="470" x2="62" y2="470" stroke="#7b3fb5" stroke-width="2.4"/>
  <text x="70" y="474" font-size="9.5" fill="#3c4043">Client VPN (person to network)</text>
  <text x="32" y="500" font-size="9.5" fill="#3c4043">Keep the three CIDRs non-overlapping.</text>
  <text x="32" y="514" font-size="9.5" fill="#3c4043">Addresses shown are documentation placeholders.</text>
</svg>
