<svg viewBox="0 0 760 520" width="760" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="520" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What the Librarian perceives (top view, not to scale)</text>
<circle cx="250" cy="295" r="215" fill="#D1FAE5" fill-opacity="0.5" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M250,295 L325.0,165.1 A150,150 0 0 1 325.0,424.9 Z" fill="#EEF2FF" fill-opacity="0.9" stroke="#4F46E5" stroke-width="2"/>
<path d="M340.0,139.1 A180,180 0 0 1 340.0,450.9" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="250" cy="295" r="14" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
<path d="M260,295 l12,0" stroke="#FFFFFF" stroke-width="3"/>
<text x="250" y="327" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Librarian</text>
<circle cx="360" cy="275" r="9" fill="#6B7280" stroke="#FFFFFF" stroke-width="2"/>
<text x="360" y="261" text-anchor="middle" font-size="11" fill="#1F2937">Player (neutral)</text>
<text x="360" y="247" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">seen</text>
<circle cx="130" cy="185" r="8" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
<text x="130" y="171" text-anchor="middle" font-size="11" fill="#92400E">Book dropped: noise</text>
<circle cx="130" cy="185" r="22" fill="none" stroke="#B45309" stroke-width="1.2"/>
<circle cx="130" cy="185" r="36" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="445" cy="460" r="8" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="2"/>
<text x="445" y="485" text-anchor="middle" font-size="11" fill="#374151">Outside all ranges</text>
<line x1="295" y1="255" x2="280" y2="135" stroke="#4B5563" stroke-width="1"/>
<text x="283" y="119" text-anchor="start" font-size="11" fill="#3730A3">Peripheral half angle</text>
<text x="283" y="133" text-anchor="start" font-size="11" fill="#3730A3">(from forward)</text>
<path d="M310,295 A60,60 0 0 0 280,243" fill="none" stroke="#3730A3" stroke-width="1.2"/>
<rect x="500" y="60" width="245" height="435" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="622" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">UAISenseConfig_Sight</text>
<text x="622" y="102" text-anchor="middle" font-size="11" fill="#374151">Sight Radius: start to see</text>
<text x="622" y="117" text-anchor="middle" font-size="11" fill="#374151">Lose Sight Radius: dashed arc,</text>
<text x="622" y="132" text-anchor="middle" font-size="11" fill="#374151">keep seeing a known target</text>
<text x="622" y="147" text-anchor="middle" font-size="11" fill="#374151">Peripheral Vision Half Angle</text>
<text x="622" y="162" text-anchor="middle" font-size="11" fill="#374151">Auto Success Range: stays seen</text>
<text x="622" y="177" text-anchor="middle" font-size="11" fill="#374151">inside it after last sighting</text>
<text x="622" y="192" text-anchor="middle" font-size="11" fill="#374151">Max Age: how long it is kept</text>
<text x="622" y="228" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">UAISenseConfig_Hearing</text>
<text x="622" y="248" text-anchor="middle" font-size="11" fill="#374151">Hearing Range: green circle</text>
<text x="622" y="263" text-anchor="middle" font-size="11" fill="#374151">LoS Hearing Range: optional</text>
<text x="622" y="278" text-anchor="middle" font-size="11" fill="#374151">second range with line of sight</text>
<text x="622" y="293" text-anchor="middle" font-size="11" fill="#374151">Noise: ReportNoiseEvent with</text>
<text x="622" y="308" text-anchor="middle" font-size="11" fill="#374151">location, loudness and a tag</text>
<text x="622" y="340" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Affiliation filters</text>
<text x="622" y="360" text-anchor="middle" font-size="11" fill="#374151">Enemies, Neutrals, Friendlies</text>
<text x="622" y="375" text-anchor="middle" font-size="11" fill="#374151">No team agent means neutral,</text>
<text x="622" y="390" text-anchor="middle" font-size="11" fill="#374151">so enable Neutrals to see the</text>
<text x="622" y="405" text-anchor="middle" font-size="11" fill="#374151">player and plain actors.</text>
<text x="622" y="440" text-anchor="middle" font-size="11" fill="#374151">Dominant sense wins when two</text>
<text x="622" y="455" text-anchor="middle" font-size="11" fill="#374151">senses report one actor.</text>
</svg>
