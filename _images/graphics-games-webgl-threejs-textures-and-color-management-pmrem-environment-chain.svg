<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-tex-pmrem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From an equirectangular HDR file to a prefiltered environment</text>
<rect x="20" y="60" width="170" height="85" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.8"/>
<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="0.55" stop-color="#FDE68A"/><stop offset="1" stop-color="#78350F"/></linearGradient></defs>
<rect x="30" y="70" width="150" height="48" rx="4" fill="url(#skyg)" stroke="#4B5563" stroke-width="1"/>
<text x="105" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">studio.hdr, 2:1 panorama</text>
<text x="105" y="168" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">HDRLoader or EXRLoader</text>
<text x="105" y="184" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mapping = Equirectangular</text>
<text x="105" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">ReflectionMapping</text>
<line x1="192" y1="102" x2="248" y2="102" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah-webgl-tjs-tex-pmrem)"/>
<rect x="250" y="60" width="170" height="85" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
<text x="335" y="90" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">PMREMGenerator</text>
<text x="335" y="108" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fromEquirectangular()</text>
<text x="335" y="126" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">on the GPU, once</text>
<text x="335" y="168" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">dispose() the generator</text>
<text x="335" y="183" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">and the source texture</text>
<line x1="422" y1="102" x2="478" y2="102" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah-webgl-tjs-tex-pmrem)"/>
<rect x="474" y="64.0" width="84" height="84" rx="3" fill="url(#skyg)" fill-opacity="1" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="562" y="75.0" width="62" height="62" rx="3" fill="url(#skyg)" fill-opacity="0.8" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="626" y="83.0" width="46" height="46" rx="3" fill="url(#skyg)" fill-opacity="0.65" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="674" y="89.0" width="34" height="34" rx="3" fill="url(#skyg)" fill-opacity="0.5" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="710" y="94.0" width="24" height="24" rx="3" fill="url(#skyg)" fill-opacity="0.4" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="736" y="98.0" width="16" height="16" rx="3" fill="url(#skyg)" fill-opacity="0.3" stroke="#4F46E5" stroke-width="1.2"/>
<text x="620" y="54" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="610" y="168" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">PMREM render target</text>
<text x="610" y="184" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one blurred level per roughness step</text>
<rect x="10" y="230" width="740" height="120" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="252" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">How a material uses it</text>
<rect x="15" y="266" width="220" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="125" y="282" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">scene.environment = envMap</text>
<text x="125" y="297" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">all PBR materials in the scene</text>
<rect x="270" y="266" width="220" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380" y="282" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">material.envMap = envMap</text>
<text x="380" y="297" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">overrides the scene value</text>
<rect x="525" y="266" width="220" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="635" y="282" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">scene.background = envMap</text>
<text x="635" y="297" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sky only, no lighting effect</text>
<text x="380" y="326" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">roughness 0.0 reads the sharp level; roughness 1.0 reads the blurriest level; values between interpolate</text>
<text x="380" y="342" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scene.environmentIntensity and scene.environmentRotation scale and turn it without regenerating anything</text>
<text x="380" y="372" font-size="10" font-weight="normal" fill="#6B7280" text-anchor="middle">schematic drawing; the panorama is a stand-in, not a real photograph</text>
</svg>
