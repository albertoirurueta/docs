<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Google Cloud storage options compared: block, file and object</text>
  <rect x="20" y="50" width="280" height="300" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="160" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#123a72">Block storage</text>
  <text x="160" y="98" text-anchor="middle" font-size="12" fill="#123a72">Hyperdisk, Persistent Disk, Local SSD</text>
  <text x="34" y="124" font-size="10" font-weight="700" fill="#1a5fb4">ATTACHED TO</text>
  <text x="34" y="140" font-size="12" fill="#123a72">One VM (some types can be shared)</text>
  <text x="34" y="168" font-size="10" font-weight="700" fill="#1a5fb4">ACCESS MODEL</text>
  <text x="34" y="184" font-size="12" fill="#123a72">Raw disk: you format and mount</text>
  <text x="34" y="212" font-size="10" font-weight="700" fill="#1a5fb4">SCOPE</text>
  <text x="34" y="228" font-size="12" fill="#123a72">Zonal, or regional for HA types</text>
  <text x="34" y="256" font-size="10" font-weight="700" fill="#1a5fb4">TYPICAL USE</text>
  <text x="34" y="272" font-size="12" fill="#123a72">Boot disks, databases, low latency</text>
  <text x="34" y="300" font-size="10" font-weight="700" fill="#1a5fb4">PROTECTION</text>
  <text x="34" y="316" font-size="12" fill="#123a72">Snapshots, snapshot schedules</text>
  <rect x="310" y="50" width="280" height="300" rx="10" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.8"/>
  <text x="450" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">File storage</text>
  <text x="450" y="98" text-anchor="middle" font-size="12" fill="#14532d">Filestore, NetApp Volumes, Managed Lustre</text>
  <text x="324" y="124" font-size="10" font-weight="700" fill="#1e7e34">ATTACHED TO</text>
  <text x="324" y="140" font-size="12" fill="#14532d">Many VMs and pods at once</text>
  <text x="324" y="168" font-size="10" font-weight="700" fill="#1e7e34">ACCESS MODEL</text>
  <text x="324" y="184" font-size="12" fill="#14532d">NFS (and SMB or Lustre per service)</text>
  <text x="324" y="212" font-size="10" font-weight="700" fill="#1e7e34">SCOPE</text>
  <text x="324" y="228" font-size="12" fill="#14532d">Filestore: Zonal or Regional tier</text>
  <text x="324" y="256" font-size="10" font-weight="700" fill="#1e7e34">TYPICAL USE</text>
  <text x="324" y="272" font-size="12" fill="#14532d">Shared directories, ReadWriteMany</text>
  <text x="324" y="300" font-size="10" font-weight="700" fill="#1e7e34">PROTECTION</text>
  <text x="324" y="316" font-size="12" fill="#14532d">Backups, snapshots, Backup and DR</text>
  <rect x="600" y="50" width="280" height="300" rx="10" fill="#fef7e0" stroke="#b06000" stroke-width="1.8"/>
  <text x="740" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#6b3a00">Object storage</text>
  <text x="740" y="98" text-anchor="middle" font-size="12" fill="#6b3a00">Cloud Storage</text>
  <text x="614" y="124" font-size="10" font-weight="700" fill="#b06000">ATTACHED TO</text>
  <text x="614" y="140" font-size="12" fill="#6b3a00">Nothing: reached over an API</text>
  <text x="614" y="168" font-size="10" font-weight="700" fill="#b06000">ACCESS MODEL</text>
  <text x="614" y="184" font-size="12" fill="#6b3a00">HTTPS on whole objects (FUSE optional)</text>
  <text x="614" y="212" font-size="10" font-weight="700" fill="#b06000">SCOPE</text>
  <text x="614" y="228" font-size="12" fill="#6b3a00">Region, dual-region, multi-region</text>
  <text x="614" y="256" font-size="10" font-weight="700" fill="#b06000">TYPICAL USE</text>
  <text x="614" y="272" font-size="12" fill="#6b3a00">Uploads, static sites, backups</text>
  <text x="614" y="300" font-size="10" font-weight="700" fill="#b06000">PROTECTION</text>
  <text x="614" y="316" font-size="12" fill="#6b3a00">Versioning, soft delete, retention</text>
  <rect x="20" y="368" width="860" height="44" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2"/>
  <text x="450" y="395" text-anchor="middle" font-size="13" fill="#1a1a1a">Backup and DR Service protects Compute Engine VMs, disks, Filestore, Cloud SQL and AlloyDB in backup vaults</text>
</svg>
