<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-geo-strategies" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four ways to put many books on screen</text>
<rect x="20" y="50" width="170" height="300" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">N Mesh objects</text>
<rect x="50" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="88" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="126" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="105" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">N draw calls</text>
<text x="105" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">any geometry, any</text>
<text x="105" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">material, own transform</text>
<text x="105" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">easy picking, culling</text>
<text x="105" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">per object</text>
<text x="105" y="290" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">best for</text>
<text x="105" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">few objects (&lt; 100)</text>
<rect x="203" y="50" width="170" height="300" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="288" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">mergeGeometries</text>
<rect x="233" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="271" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="309" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="288" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1 draw call</text>
<text x="288" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">transforms baked in</text>
<text x="288" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">static; no per-book</text>
<text x="288" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">motion or visibility</text>
<text x="288" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">groups keep materials</text>
<text x="288" y="290" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">best for</text>
<text x="288" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">static scenery</text>
<rect x="386" y="50" width="170" height="300" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="471" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">InstancedMesh</text>
<rect x="416" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<rect x="454" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<rect x="492" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="471" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1 draw call</text>
<text x="471" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one geometry+material</text>
<text x="471" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">instanceMatrix, color</text>
<text x="471" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">instanceId picking</text>
<text x="471" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">count fixed at creation</text>
<text x="471" y="290" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">best for</text>
<text x="471" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">many identical books</text>
<rect x="569" y="50" width="170" height="300" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="654" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">BatchedMesh</text>
<rect x="599" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<rect x="637" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<rect x="675" y="92" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="654" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1 draw call</text>
<text x="654" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">several geometries,</text>
<text x="654" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one material</text>
<text x="654" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">matrix, color, visible</text>
<text x="654" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">per instance</text>
<text x="654" y="290" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">best for</text>
<text x="654" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">many different shapes</text>
<text x="380" y="380" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fewer draw calls cost less CPU time; the GPU still draws every triangle of every book.</text>
</svg>
