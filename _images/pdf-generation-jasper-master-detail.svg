<svg viewBox="0 0 960 560" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="md-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="md-arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7a2f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Master/detail: each master row runs a detail data source and returns a value</text>

  <rect x="30" y="50" width="290" height="300" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="175" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Master report (statement)</text>
  <text x="175" y="92" text-anchor="middle" font-size="11" fill="#333">JRBeanCollectionDataSource(invoices)</text>
  <rect x="48" y="112" width="254" height="86" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="60" y="132" font-size="12" font-weight="700" fill="#1a1a1a">INV-1001 - Ada Reader</text>
  <text x="60" y="152" font-size="11" fill="#333">$F{number} = "INV-1001"</text>
  <text x="60" y="170" font-size="11" fill="#333">$F{lines} = 3 InvoiceLine objects</text>
  <text x="60" y="188" font-size="11" fill="#333">detail band, row 1</text>
  <rect x="48" y="214" width="254" height="86" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="60" y="234" font-size="12" font-weight="700" fill="#1a1a1a">INV-1002 - Grace Page</text>
  <text x="60" y="254" font-size="11" fill="#333">$F{number} = "INV-1002"</text>
  <text x="60" y="272" font-size="11" fill="#333">$F{lines} = 2 InvoiceLine objects</text>
  <text x="60" y="290" font-size="11" fill="#333">detail band, row 2</text>
  <text x="175" y="326" text-anchor="middle" font-size="11" fill="#555">repeats the band once per invoice</text>

  <line x1="302" y1="155" x2="610" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#md-arrow)"/>
  <text x="456" y="124" text-anchor="middle" font-size="11" fill="#1a1a1a">parameters + dataSourceExpression</text>
  <line x1="302" y1="257" x2="610" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#md-arrow)"/>
  <text x="456" y="244" text-anchor="middle" font-size="11" fill="#1a1a1a">parameters + dataSourceExpression</text>

  <rect x="610" y="50" width="320" height="100" rx="8" fill="#fff3d6" stroke="#b36b00" stroke-width="1.5"/>
  <text x="770" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#b36b00">Detail run 1</text>
  <text x="770" y="92" text-anchor="middle" font-size="11" fill="#333">invoice-lines subreport, or the Lines subDataset</text>
  <text x="770" y="110" text-anchor="middle" font-size="11" fill="#333">3 rows, $V{invoiceTotal} = 70.90</text>
  <text x="770" y="128" text-anchor="middle" font-size="11" fill="#333">table, list or subreport detail band</text>
  <rect x="610" y="222" width="320" height="100" rx="8" fill="#fff3d6" stroke="#b36b00" stroke-width="1.5"/>
  <text x="770" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#b36b00">Detail run 2</text>
  <text x="770" y="264" text-anchor="middle" font-size="11" fill="#333">same template, new data source</text>
  <text x="770" y="282" text-anchor="middle" font-size="11" fill="#333">2 rows, $V{invoiceTotal} = 42.75</text>
  <text x="770" y="300" text-anchor="middle" font-size="11" fill="#333">its own variables start from zero</text>

  <path d="M930,100 H948 V400 H330" fill="none" stroke="#2f7a2f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#md-arrow-ret)"/>
  <path d="M930,272 H948" fill="none" stroke="#2f7a2f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="640" y="392" text-anchor="middle" font-size="11" fill="#2f7a2f">returnValue (Sum): 70.90, then 42.75</text>

  <rect x="30" y="372" width="300" height="70" rx="8" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1.5"/>
  <text x="180" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7a2f">Master variable statementTotal</text>
  <text x="180" y="416" text-anchor="middle" font-size="11" fill="#333">calculation Sum, summary band shows 113.65</text>
  <text x="180" y="432" text-anchor="middle" font-size="11" fill="#333">usable after the detail runs have finished</text>

  <rect x="30" y="470" width="900" height="70" rx="8" fill="none" stroke="#999" stroke-dasharray="6 3"/>
  <text x="480" y="492" text-anchor="middle" font-size="11" fill="#333">Subreport element: detail is a separate compiled report; values come back through returnValue.</text>
  <text x="480" y="510" text-anchor="middle" font-size="11" fill="#333">Table and list components: detail is a subDataset of the same template; datasetRun carries parameters,</text>
  <text x="480" y="528" text-anchor="middle" font-size="11" fill="#333">the data source and returnValue, and the layout is the component's own cells or contents.</text>
</svg>
