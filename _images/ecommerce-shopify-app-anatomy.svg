<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Anatomy of a Shopify app built with Shopify CLI</title>
  <desc id="d">The merchant's browser loads the app inside the Shopify admin, the developer-hosted app server authenticates the request and calls the Admin GraphQL API, Shopify delivers signed webhooks, and shopify app deploy publishes the configuration and the extensions from the project on disk as an app version that Shopify hosts and runs.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="200" height="130" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="46" text-anchor="middle" font-weight="bold">Shopify admin (browser)</text>
  <text x="120" y="70" text-anchor="middle">App Home iframe</text>
  <text x="120" y="90" text-anchor="middle">App Bridge</text>
  <text x="120" y="110" text-anchor="middle">Polaris web components</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" opacity="0.8">shown to the merchant</text>

  <rect x="310" y="20" width="200" height="130" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="410" y="46" text-anchor="middle" font-weight="bold">Your app server</text>
  <text x="410" y="70" text-anchor="middle">React Router routes</text>
  <text x="410" y="90" text-anchor="middle">shopify.server.ts</text>
  <text x="410" y="110" text-anchor="middle">session storage (Prisma)</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" opacity="0.8">hosted by you</text>

  <rect x="600" y="20" width="200" height="130" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="46" text-anchor="middle" font-weight="bold">Shopify platform</text>
  <text x="700" y="70" text-anchor="middle">managed installation</text>
  <text x="700" y="90" text-anchor="middle">Admin GraphQL API</text>
  <text x="700" y="110" text-anchor="middle">webhook delivery</text>
  <text x="700" y="134" text-anchor="middle" font-size="11" opacity="0.8">hosted by Shopify</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M220 62 L308 62"/>
    <path d="M510 62 L598 62"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)">
    <path d="M598 108 L512 108"/>
  </g>
  <text x="264" y="52" text-anchor="middle" font-size="11">ID token</text>
  <text x="554" y="46" text-anchor="middle" font-size="11">token exchange</text>
  <text x="554" y="60" text-anchor="middle" font-size="11">GraphQL</text>
  <text x="554" y="124" text-anchor="middle" font-size="11">signed webhooks</text>

  <rect x="20" y="230" width="490" height="190" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="265" y="256" text-anchor="middle" font-weight="bold">Project on disk (one Git repository)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="40" y="284">shopify.app.toml</text>
    <text x="40" y="304">shopify.web.toml</text>
    <text x="40" y="324">package.json</text>
    <text x="40" y="344">app/   prisma/   vite.config.ts</text>
    <text x="40" y="364">extensions/&lt;handle&gt;/shopify.extension.toml</text>
    <text x="40" y="384">.env   .shopify/   (generated, not committed)</text>
  </g>
  <g font-size="11" opacity="0.85">
    <text x="250" y="284">app configuration</text>
    <text x="250" y="304">how the CLI starts the web process</text>
    <text x="250" y="324">scripts and workspaces</text>
  </g>

  <rect x="600" y="230" width="200" height="190" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="256" text-anchor="middle" font-weight="bold">Extensions</text>
  <text x="700" y="284" text-anchor="middle">Shopify Functions (Wasm)</text>
  <text x="700" y="304" text-anchor="middle">checkout and admin UI</text>
  <text x="700" y="324" text-anchor="middle">theme app extension</text>
  <text x="700" y="344" text-anchor="middle">web pixel, Flow, POS</text>
  <text x="700" y="384" text-anchor="middle" font-size="11" opacity="0.8">built by the CLI,</text>
  <text x="700" y="400" text-anchor="middle" font-size="11" opacity="0.8">run on Shopify</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M510 325 L598 325"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M700 230 L700 152"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)">
    <path d="M410 230 L410 152"/>
  </g>
  <text x="554" y="312" text-anchor="middle" font-size="11">app deploy</text>
  <text x="554" y="342" text-anchor="middle" font-size="11">app version</text>
  <text x="712" y="196" font-size="11">released app version,</text>
  <text x="712" y="210" font-size="11">run by Shopify</text>
  <text x="422" y="190" font-size="11">you deploy the web app</text>
  <text x="422" y="204" font-size="11">to your own host</text>
</svg>
