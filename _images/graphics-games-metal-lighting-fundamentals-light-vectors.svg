<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-lighting-fundamentals-light-vectors" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The five vectors of a lit point: N, L, V, H and R</text>
<polygon points="60,320 440,320 440,350 60,350" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="250" y="372" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Surface (the shelf board), seen from the side</text>
<line x1="250" y1="320" x2="250.0" y2="130.0" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-light-vectors)"/>
<text x="250.0" y="122.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">N</text>
<line x1="250" y1="320" x2="94.4" y2="211.0" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-light-vectors)"/>
<text x="84.4" y="207.0" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">L</text>
<line x1="250" y1="320" x2="315.0" y2="141.5" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-light-vectors)"/>
<text x="327.0" y="137.5" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">V</text>
<line x1="250" y1="320" x2="204.9" y2="176.9" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-metal-lighting-fundamentals-light-vectors)"/>
<text x="196.9" y="170.9" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">H</text>
<line x1="250" y1="320" x2="405.6" y2="211.0" stroke="#B45309" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-lighting-fundamentals-light-vectors)"/>
<text x="417.6" y="213.0" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">R</text>
<circle cx="250" cy="320" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="66.4" cy="197.0" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="66.4" y="177.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">light</text>
<circle cx="319.0" cy="113.5" r="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="319.0" y="93.5" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">camera</text>
<rect x="480" y="56" width="260" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="610.0" y="84.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">N  unit surface normal</text>
<text x="610.0" y="99.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">L  unit vector from P to the light</text>
<rect x="480" y="130" width="260" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="610.0" y="158.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">V  unit vector from P to camera</text>
<text x="610.0" y="173.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">H  normalise(L + V), the half vector</text>
<rect x="480" y="204" width="260" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="610.0" y="232.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">R  reflect(-L, N), mirror direction</text>
<text x="610.0" y="247.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(dashed: only Phong needs it)</text>
<rect x="480" y="278" width="260" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="610.0" y="306.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Diffuse uses dot(N, L)</text>
<text x="610.0" y="321.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Phong specular uses dot(R, V)</text>
<text x="610.0" y="336.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Blinn-Phong uses dot(N, H)</text>
<text x="380" y="394" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">All vectors are unit length and point away from P, in the same space (world or view).</text>
</svg>
