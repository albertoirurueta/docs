<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Canva MCP tool families and their per-user limits</text>
  <rect x="30" y="50" width="220" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="140" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Find and read</text>
  <text x="42" y="102" font-size="11" fill="#374151" text-anchor="start">search-designs  100/min</text>
  <text x="42" y="128" font-size="11" fill="#374151" text-anchor="start">get-design, get-design-pages 100</text>
  <text x="42" y="154" font-size="11" fill="#374151" text-anchor="start">get-design-content  100/min</text>
  <text x="42" y="180" font-size="11" fill="#374151" text-anchor="start">resolve-shortlink  no limit</text>
  <rect x="270" y="50" width="220" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Create</text>
  <text x="282" y="102" font-size="11" fill="#374151" text-anchor="start">generate-design  20/min</text>
  <text x="282" y="128" font-size="11" fill="#374151" text-anchor="start">from-candidate  20/min</text>
  <text x="282" y="154" font-size="11" fill="#374151" text-anchor="start">copy-design  20/min</text>
  <text x="282" y="180" font-size="11" fill="#374151" text-anchor="start">import-design-from-url  20/min</text>
  <rect x="510" y="50" width="220" height="150" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="620" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Edit transaction</text>
  <text x="522" y="102" font-size="11" fill="#374151" text-anchor="start">start-editing-transaction 20</text>
  <text x="522" y="128" font-size="11" fill="#374151" text-anchor="start">perform-editing-operations 50</text>
  <text x="522" y="154" font-size="11" fill="#374151" text-anchor="start">commit-editing-transaction 20</text>
  <text x="522" y="180" font-size="11" fill="#374151" text-anchor="start">cancel-editing-transaction 20</text>
  <rect x="30" y="220" width="220" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="140" y="244" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Brand and autofill</text>
  <text x="42" y="272" font-size="11" fill="#374151" text-anchor="start">search-brand-templates  100/min</text>
  <text x="42" y="298" font-size="11" fill="#374151" text-anchor="start">create-from-brand-template  20/min</text>
  <text x="42" y="324" font-size="11" fill="#374151" text-anchor="start">autofill-design  60/min</text>
  <text x="42" y="350" font-size="11" fill="#374151" text-anchor="start">list-brand-kits  100/min</text>
  <rect x="270" y="220" width="220" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="244" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Images</text>
  <text x="282" y="272" font-size="11" fill="#374151" text-anchor="start">generate-image  10/min</text>
  <text x="282" y="298" font-size="11" fill="#374151" text-anchor="start">remove-background  default</text>
  <text x="282" y="324" font-size="11" fill="#374151" text-anchor="start">separate-image-layers  default</text>
  <text x="282" y="350" font-size="11" fill="#374151" text-anchor="start">upload-asset-from-url  30/min</text>
  <rect x="510" y="220" width="220" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="620" y="244" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Share and output</text>
  <text x="522" y="272" font-size="11" fill="#374151" text-anchor="start">export-design  20/min</text>
  <text x="522" y="298" font-size="11" fill="#374151" text-anchor="start">resize-design  20/min</text>
  <text x="522" y="324" font-size="11" fill="#374151" text-anchor="start">comment-on-design  100/min</text>
  <text x="522" y="350" font-size="11" fill="#374151" text-anchor="start">create-folder  20/min</text>
  <text x="380" y="386" font-size="11" fill="#374151" text-anchor="middle">Tools without a limit of their own share a server-wide cap of 300 requests per minute per user. Resize, autofill and brand tools need Pro or above.</text>
  <text x="380" y="412" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
