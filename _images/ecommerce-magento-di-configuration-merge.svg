<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 864 440" width="860" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How Magento merges di.xml files</title>
  <desc id="d">Three scopes are loaded in order. The primary scope is app/etc/di.xml, which wires the Framework itself. The global scope is the etc/di.xml of every enabled module in load order: later modules override earlier ones and arrays merge item by item. The area scope is etc/frontend/di.xml, etc/adminhtml/di.xml and the other area files, merged on top when the request area is loaded: an argument named there replaces the whole argument. Below, for each class the arguments are resolved from parent classes, then the virtual type chain, then the type's own configuration, with arrays merged recursively and sorted by sortOrder. When generated/metadata/global.php exists, the compiled metadata replaces reading the XML.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="240" height="150" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140" y="46" text-anchor="middle" font-weight="bold">1  Primary</text>
  <text x="140" y="68" text-anchor="middle" font-size="12">app/etc/di.xml</text>
  <text x="140" y="84" text-anchor="middle" font-size="12">app/etc/*/di.xml</text>
  <text x="140" y="108" text-anchor="middle" font-size="11">Read first, before modules are known:</text>
  <text x="140" y="124" text-anchor="middle" font-size="11">preferences for the Framework</text>
  <text x="140" y="140" text-anchor="middle" font-size="11">(cache, filesystem, logger, routers)</text>

  <line x1="260" y1="95" x2="300" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="300" y="20" width="260" height="150" rx="12" fill="#1abc9c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="430" y="46" text-anchor="middle" font-weight="bold">2  Global</text>
  <text x="430" y="68" text-anchor="middle" font-size="12">etc/di.xml of each enabled module,</text>
  <text x="430" y="84" text-anchor="middle" font-size="12">in config.php load order</text>
  <text x="430" y="108" text-anchor="middle" font-size="11">Same preference or argument: last module wins.</text>
  <text x="430" y="124" text-anchor="middle" font-size="11">Arrays: items merge by name, a</text>
  <text x="430" y="140" text-anchor="middle" font-size="11">repeated name is replaced.</text>

  <line x1="560" y1="95" x2="600" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="600" y="20" width="250" height="150" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="725" y="46" text-anchor="middle" font-weight="bold">3  Area</text>
  <text x="725" y="68" text-anchor="middle" font-size="12">etc/frontend/di.xml, etc/adminhtml/di.xml,</text>
  <text x="725" y="84" text-anchor="middle" font-size="12">etc/graphql/di.xml, ...</text>
  <text x="725" y="108" text-anchor="middle" font-size="11">Merged on top when the area is loaded.</text>
  <text x="725" y="124" text-anchor="middle" font-size="11">An argument named here replaces the</text>
  <text x="725" y="140" text-anchor="middle" font-size="11">whole global argument, arrays included.</text>

  <line x1="430" y1="170" x2="430" y2="206" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="20" y="208" width="830" height="130" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="234" text-anchor="middle" font-weight="bold">Arguments of one class, resolved when the object is built</text>
  <text x="40" y="262" font-size="12">1  arguments configured on parent classes</text>
  <text x="40" y="282" font-size="12">2  arguments of the virtual type's parent type, if the name is a virtual type</text>
  <text x="40" y="302" font-size="12">3  the type's own arguments (arrays merged recursively, items sorted by sortOrder)</text>
  <text x="40" y="322" font-size="12">4  constructor defaults for what is still unconfigured; a missing scalar is an error</text>
  <text x="560" y="262" font-size="12" font-weight="bold">Then, for each constructor parameter:</text>
  <text x="560" y="282" font-size="12">configured value, else preference of the type hint,</text>
  <text x="560" y="302" font-size="12">else the class itself, shared or new as configured</text>

  <rect x="20" y="356" width="830" height="64" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="435" y="382" text-anchor="middle" font-weight="bold">Compiled mode</text>
  <text x="435" y="402" text-anchor="middle" font-size="12">If generated/metadata/global.php exists (after setup:di:compile) the Framework reads the precomputed arrays and ignores the XML</text>
</svg>
