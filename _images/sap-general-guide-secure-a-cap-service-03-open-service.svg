<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 213" width="1080" height="213" role="img" aria-labelledby="sap-general-guide-secure-a-cap-service-03-open-service-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-secure-a-cap-service-03-open-service-title">Terminal with two curl calls to the service before any rule exists: the first, a read without credentials, answers HTTP 200 with the claim Train ticket; the second, a PATCH that sets the amount to 50 without credentials, also answers HTTP 200; callout 7 marks the read and callout 8 the write</title>
<g><rect x="0" y="0" width="1080" height="213" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="181" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ BASE=http://localhost:4004/odata/v4/claims/Claims</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ CLAIM=&quot;$BASE(11111111-1111-1111-1111-111111111111)&quot;</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' &quot;$BASE?\$top=1&amp;\$select=title&quot;</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims&quot;,&quot;value&quot;:[{&quot;title&quot;:&quot;Train ticket&quot;,&quot;ID&quot;:&quot;11111111-1111-1111-1111-111111111111&quot;}]}</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w 'HTTP %{http_code}\n' -X PATCH -H 'Content-Type: application/json' -d '{&quot;amount&quot;:50}' &quot;$CLAIM&quot;</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<rect x="5" y="88" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="88" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="93" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g>
<rect x="5" y="151" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="151" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="156" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">8</text></g></g>
</svg>
