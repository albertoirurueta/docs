<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
<title id="t">datetime64 units and the time span each one can represent</title>
<desc id="d">Horizontal bars on a logarithmic scale showing the span around 1970-01-01 of each datetime64 unit, from years to nanoseconds. Years and months are variable length, weeks and days are calendar units, hours to nanoseconds are clock units.</desc>
<rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">How far each datetime64 unit reaches</text>
<text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Bar length is the logarithm of the span either side of 1970-01-01 (one 64-bit integer counts the units).</text>
<text x="24" y="97" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">Y</text>
<text x="64" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">year</text>
<rect x="170" y="81" width="455.1" height="22" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="617.1" y="97" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±9.2e18 years</text>
<text x="24" y="127" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">M</text>
<text x="64" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">month</text>
<rect x="170" y="111" width="429.1" height="22" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="591.1" y="127" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±7.6e17 years</text>
<text x="24" y="157" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">W</text>
<text x="64" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">week</text>
<rect x="170" y="141" width="413.5" height="22" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="575.5" y="157" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±1.7e17 years</text>
<text x="24" y="187" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">D</text>
<text x="64" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">day</text>
<rect x="170" y="171" width="393.6" height="22" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="555.6" y="187" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±2.5e16 years</text>
<text x="24" y="217" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">h</text>
<text x="64" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">hour</text>
<rect x="170" y="201" width="360.0" height="22" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="538.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±1.0e15 years</text>
<text x="24" y="247" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">m</text>
<text x="64" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">minute</text>
<rect x="170" y="231" width="317.5" height="22" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="495.5" y="247" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±1.7e13 years</text>
<text x="24" y="277" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">s</text>
<text x="64" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">second</text>
<rect x="170" y="261" width="275.1" height="22" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="453.1" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±2.9e11 years</text>
<text x="24" y="307" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">ms</text>
<text x="64" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">millisecond</text>
<rect x="170" y="291" width="203.1" height="22" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="381.1" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±2.9e8 years</text>
<text x="24" y="337" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">us</text>
<text x="64" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">microsecond</text>
<rect x="170" y="321" width="131.1" height="22" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="309.1" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±2.9e5 years</text>
<text x="24" y="367" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#0F172A">ns</text>
<text x="64" y="367" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">nanosecond</text>
<rect x="170" y="351" width="59.2" height="22" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="237.2" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">±292 years (1678-2262)</text>
<rect x="24" y="392" width="16" height="16" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="48" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">variable length (cannot convert to days exactly)</text>
<rect x="24" y="416" width="16" height="16" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="48" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">calendar units (1 W = 7 D exactly)</text>
<rect x="372" y="392" width="16" height="16" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="396" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">clock units (1 D = 24 h exactly)</text>
<rect x="372" y="416" width="16" height="16" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="396" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">narrow range, easy to overflow</text>
</svg>
