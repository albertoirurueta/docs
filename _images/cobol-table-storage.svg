<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Two-level COBOL table BRANCH-LOANS in storage: three 29-byte branch entries, each holding an 8-byte name and seven 3-byte day counts, with subscript positions and index displacements</title>
<rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
<text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">BRANCH-LOANS in storage: 3 entries of 29 bytes (87 bytes)</text>
<text x="430" y="44" font-size="12" fill="#555555" text-anchor="middle">a subscript is an occurrence number that the compiler turns into an offset;</text>
<text x="430" y="59" font-size="12" fill="#555555" text-anchor="middle">on z/OS an index holds that offset itself, GnuCOBOL keeps the occurrence number</text>
<text x="40" y="80" font-size="12" font-weight="bold" fill="#222222">Level 05: BRANCH-ENTRY (BR-IX)</text>
<rect x="40.0" y="84" width="260.0" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="170.0" y="106" font-size="13" fill="#222222" text-anchor="middle">BRANCH-ENTRY (1)</text>
<text x="46.0" y="136" font-size="11" fill="#222222" font-family="Courier New, monospace">offset 0</text>
<text x="46.0" y="150" font-size="11" fill="#555555" font-family="Courier New, monospace">BR-IX = 0</text>
<rect x="300.0" y="84" width="260.0" height="34" fill="#d8efd8" stroke="#2b6b2b" stroke-width="2"/>
<text x="430.0" y="106" font-size="13" fill="#222222" text-anchor="middle">BRANCH-ENTRY (2)</text>
<text x="306.0" y="136" font-size="11" fill="#222222" font-family="Courier New, monospace">offset 29</text>
<text x="306.0" y="150" font-size="11" fill="#555555" font-family="Courier New, monospace">BR-IX = 29</text>
<rect x="560.0" y="84" width="260.0" height="34" fill="#e6dcf3" stroke="#563a82" stroke-width="2"/>
<text x="690.0" y="106" font-size="13" fill="#222222" text-anchor="middle">BRANCH-ENTRY (3)</text>
<text x="566.0" y="136" font-size="11" fill="#222222" font-family="Courier New, monospace">offset 58</text>
<text x="566.0" y="150" font-size="11" fill="#555555" font-family="Courier New, monospace">BR-IX = 58</text>
<text x="826.0" y="136" font-size="11" fill="#222222" font-family="Courier New, monospace" text-anchor="end">end 87</text>
<polyline points="300.0,118 300.0,158 40,210" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4"/>
<polyline points="560.0,118 560.0,158 820,210" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="430" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">Level 10, inside BRANCH-ENTRY (2) (bytes 29 to 57)</text>
<rect x="40.0" y="210" width="215.2" height="40" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<text x="147.6" y="228" font-size="13" fill="#222222" text-anchor="middle">BRANCH-NAME (2)</text>
<text x="147.6" y="244" font-size="11" fill="#555555" text-anchor="middle">PIC X(8), 8 bytes</text>
<rect x="255.2" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="295.5" y="228" font-size="12" fill="#222222" text-anchor="middle">(1)</text>
<text x="295.5" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="263.2" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+8</text>
<rect x="335.9" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="376.2" y="228" font-size="12" fill="#222222" text-anchor="middle">(2)</text>
<text x="376.2" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="343.9" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+11</text>
<rect x="416.6" y="210" width="80.7" height="40" fill="#ffd6d6" stroke="#a02020" stroke-width="3"/>
<text x="456.9" y="228" font-size="12" fill="#222222" text-anchor="middle">(3)</text>
<text x="456.9" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="424.6" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+14</text>
<rect x="497.2" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="537.6" y="228" font-size="12" fill="#222222" text-anchor="middle">(4)</text>
<text x="537.6" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="505.3" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+17</text>
<rect x="577.9" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="618.3" y="228" font-size="12" fill="#222222" text-anchor="middle">(5)</text>
<text x="618.3" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="586.0" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+20</text>
<rect x="658.6" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="699.0" y="228" font-size="12" fill="#222222" text-anchor="middle">(6)</text>
<text x="699.0" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="666.7" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+23</text>
<rect x="739.3" y="210" width="80.7" height="40" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="779.7" y="228" font-size="12" fill="#222222" text-anchor="middle">(7)</text>
<text x="779.7" y="244" font-size="11" fill="#555555" text-anchor="middle">3 B</text>
<text x="747.4" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+26</text>
<text x="40" y="268" font-size="11" fill="#222222" font-family="Courier New, monospace">+0</text>
<text x="40" y="290" font-size="11" fill="#555555">offsets above are relative to the start of BRANCH-ENTRY (2); DAY-COUNT is PIC 9(3) OCCURS 7 TIMES INDEXED BY DAY-IX</text>
<line x1="456.9" y1="250" x2="456.9" y2="320" stroke="#a02020" stroke-width="2"/>
<rect x="40" y="322" width="780" height="92" fill="#f6f6f6" stroke="#444444" stroke-width="1.5"/>
<text x="54" y="344" font-size="13" font-weight="bold" fill="#a02020">DAY-COUNT (2, 3), highlighted</text>
<text x="54" y="364" font-size="13" fill="#222222" font-family="Courier New, monospace">subscripts: (2 - 1) * 29 + 8 + (3 - 1) * 3 = 43 bytes from the start of BRANCH-LOANS</text>
<text x="54" y="384" font-size="13" fill="#222222" font-family="Courier New, monospace">z/OS indexes: BR-IX = 29 (SET BR-IX TO 2), DAY-IX = 6 (SET DAY-IX TO 3), same address</text>
<text x="54" y="404" font-size="12" fill="#555555">BRANCH-LOANS (44:3) holds the same three digits, because reference modification counts bytes from 1.</text>
</svg>
