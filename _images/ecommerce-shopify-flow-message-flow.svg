<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Messages between an app and Shopify Flow</title>
  <desc id="d">Three rows. The trigger path: the app sends flowTriggerReceive with a handle and a payload under 50,000 bytes, Flow starts every enabled workflow that begins with the trigger, a condition is evaluated and an action step is reached. The action path: Flow posts the payload to the runtime URL with an HMAC header, the app verifies the signature, the handle and the action run id, does the work and replies within 10 seconds with 200, 202, 429 or another status code. The lifecycle path: a merchant enables a workflow, Flow posts to the lifecycle URL and waits 5 seconds for a 2xx reply, the app stores has_enabled_flow per shop and keeps the newest timestamp, and the app then sends triggers only to shops that use them.</desc>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="14" fill="#f2f5f8" font-weight="bold">
    <text x="20" y="30">1. Trigger: the app starts a workflow</text>
    <text x="20" y="140">2. Action: Flow calls the app</text>
    <text x="20" y="250">3. Lifecycle: Flow tells the app who uses the trigger</text>
  </g>

  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="20" y="40" width="130" height="62" rx="8"/>
    <rect x="166" y="40" width="130" height="62" rx="8"/>
  </g>
  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="312" y="40" width="130" height="62" rx="8"/>
    <rect x="458" y="40" width="130" height="62" rx="8"/>
    <rect x="604" y="40" width="130" height="62" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="64" font-weight="bold">App event</text><text x="85" y="82" font-size="12">roast batch done</text>
    <text x="231" y="64" font-weight="bold">flowTriggerReceive</text><text x="231" y="82" font-size="12">handle + payload</text><text x="231" y="96" font-size="11">under 50,000 bytes</text>
    <text x="377" y="64" font-weight="bold">Workflows start</text><text x="377" y="82" font-size="12">every enabled one</text>
    <text x="523" y="64" font-weight="bold">Condition</text><text x="523" y="82" font-size="12">built by the merchant</text>
    <text x="669" y="64" font-weight="bold">Action step</text><text x="669" y="82" font-size="12">yours or Shopify's</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 71 H162"/><path d="M296 71 H308"/><path d="M442 71 H454"/><path d="M588 71 H600"/>
  </g>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="20" y="150" width="130" height="62" rx="8"/>
  </g>
  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="166" y="150" width="130" height="62" rx="8"/>
    <rect x="312" y="150" width="130" height="62" rx="8"/>
    <rect x="458" y="150" width="130" height="62" rx="8"/>
  </g>
  <g fill="#8a6a3a" stroke="#f2f5f8">
    <rect x="604" y="150" width="130" height="62" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="174" font-weight="bold">POST runtime_url</text><text x="85" y="192" font-size="12">JSON + HMAC header</text>
    <text x="231" y="174" font-weight="bold">Verify HMAC</text><text x="231" y="192" font-size="12">over the raw body</text>
    <text x="377" y="174" font-weight="bold">Check handle</text><text x="377" y="192" font-size="12">and action_run_id</text>
    <text x="523" y="174" font-weight="bold">Do the work</text><text x="523" y="192" font-size="12">tolerate old fields</text>
    <text x="669" y="174" font-weight="bold">Reply in 10 s</text><text x="669" y="192" font-size="12">200 / 202 / 429 / 4xx</text><text x="669" y="206" font-size="11">5xx retried up to 36 h</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 181 H162"/><path d="M296 181 H308"/><path d="M442 181 H454"/><path d="M588 181 H600"/>
  </g>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="20" y="260" width="130" height="62" rx="8"/>
    <rect x="166" y="260" width="130" height="62" rx="8"/>
  </g>
  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="312" y="260" width="130" height="62" rx="8"/>
    <rect x="458" y="260" width="130" height="62" rx="8"/>
    <rect x="604" y="260" width="130" height="62" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="284" font-weight="bold">Merchant turns</text><text x="85" y="302" font-weight="bold">a workflow on</text>
    <text x="231" y="284" font-weight="bold">POST url</text><text x="231" y="302" font-size="12">has_enabled_flow</text>
    <text x="377" y="284" font-weight="bold">Reply 2xx</text><text x="377" y="302" font-size="12">within 5 seconds</text>
    <text x="523" y="284" font-weight="bold">Store per shop</text><text x="523" y="302" font-size="12">newest timestamp wins</text>
    <text x="669" y="284" font-weight="bold">Send triggers</text><text x="669" y="302" font-size="12">only to active shops</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 291 H162"/><path d="M296 291 H308"/><path d="M442 291 H454"/><path d="M588 291 H600"/>
  </g>

  <g font-size="12" fill="#f2f5f8">
    <rect x="20" y="346" width="14" height="14" rx="3" fill="#4f7f5b" stroke="#f2f5f8"/><text x="42" y="358">App code</text>
    <rect x="120" y="346" width="14" height="14" rx="3" fill="#3f6e9a" stroke="#f2f5f8"/><text x="142" y="358">Shopify Flow or the merchant</text>
    <rect x="330" y="346" width="14" height="14" rx="3" fill="#8a6a3a" stroke="#f2f5f8"/><text x="352" y="358">Reply that decides retry or failure</text>
    <text x="20" y="384">A lifecycle callback that is not answered with a 2xx in time stops the merchant from enabling the workflow.</text>
  </g>
</svg>
