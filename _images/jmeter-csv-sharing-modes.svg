<text x="24" y="28" font-size="16" font-weight="bold">CSV Data Set Config: rows handed to threads by sharing mode</text>
<text x="24" y="48" font-size="12" opacity="0.75">Each panel: users.csv rows (left, top to bottom = file order) and the thread that reads each row on its first iteration (right).</text>
<text x="24" y="64" font-size="12" opacity="0.75">Thread groups: A (threads A-1, A-2), B (B-1, B-2), C (C-1). Arrow colour = thread group. With a shared pointer, the thread-to-row order depends on timing.</text>
