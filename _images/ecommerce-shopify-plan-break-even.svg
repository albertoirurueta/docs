<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t2">Monthly cost relative to the Grow plan</title>
<desc id="d2">Lines showing how much more or less Basic and Advanced cost per month than Grow as monthly revenue rises from 0 to 150,000 euros. Basic becomes more expensive than Grow above 15,000 euros; Advanced becomes cheaper above 110,000 euros.</desc>
<line x1="70" y1="330" x2="720" y2="330" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="334" text-anchor="end" font-size="11" fill="currentColor">-300</text>
<line x1="70" y1="281.6666666666667" x2="720" y2="281.6666666666667" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="285.6666666666667" text-anchor="end" font-size="11" fill="currentColor">-200</text>
<line x1="70" y1="233.33333333333334" x2="720" y2="233.33333333333334" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="237.33333333333334" text-anchor="end" font-size="11" fill="currentColor">-100</text>
<line x1="70" y1="185" x2="720" y2="185" stroke="currentColor" stroke-opacity="0.6" stroke-dasharray="5 4"/>
<text x="62" y="189" text-anchor="end" font-size="11" fill="currentColor">0</text>
<line x1="70" y1="136.66666666666669" x2="720" y2="136.66666666666669" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="140.66666666666669" text-anchor="end" font-size="11" fill="currentColor">100</text>
<line x1="70" y1="88.33333333333331" x2="720" y2="88.33333333333331" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="92.33333333333331" text-anchor="end" font-size="11" fill="currentColor">200</text>
<line x1="70" y1="40" x2="720" y2="40" stroke="currentColor" stroke-opacity="0.15" />
<text x="62" y="44" text-anchor="end" font-size="11" fill="currentColor">300</text>
<line x1="70" y1="330" x2="70" y2="335" stroke="currentColor"/>
<text x="70" y="350" text-anchor="middle" font-size="11" fill="currentColor">0k</text>
<line x1="178.33333333333331" y1="330" x2="178.33333333333331" y2="335" stroke="currentColor"/>
<text x="178.33333333333331" y="350" text-anchor="middle" font-size="11" fill="currentColor">25k</text>
<line x1="286.66666666666663" y1="330" x2="286.66666666666663" y2="335" stroke="currentColor"/>
