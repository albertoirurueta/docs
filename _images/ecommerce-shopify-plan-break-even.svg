<line x1="395" y1="330" x2="395" y2="335" stroke="currentColor"/>
<text x="395" y="350" text-anchor="middle" font-size="11" fill="currentColor">75k</text>
<line x1="503.3333333333333" y1="330" x2="503.3333333333333" y2="335" stroke="currentColor"/>
<text x="503.3333333333333" y="350" text-anchor="middle" font-size="11" fill="currentColor">100k</text>
<line x1="611.6666666666667" y1="330" x2="611.6666666666667" y2="335" stroke="currentColor"/>
<text x="611.6666666666667" y="350" text-anchor="middle" font-size="11" fill="currentColor">125k</text>
<line x1="720" y1="330" x2="720" y2="335" stroke="currentColor"/>
<text x="720" y="350" text-anchor="middle" font-size="11" fill="currentColor">150k</text>
