<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Pocket Coffee scopes: global, websites, stores and store views</title>
  <desc id="d">The Pocket Coffee installation has one global scope, two websites (pocketcoffee_eu in euro and pocketcoffee_us in dollars), one store (store group) under each website and three store views: pc_es and pc_en under the European store, pc_us under the American one. Each level decides different things: the website prices, currency, shipping and payment, the store the root category, the store view the language and translated content.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="300" y="15" width="300" height="62" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="41" text-anchor="middle" font-weight="bold">Global (the installation)</text>
  <text x="450.0" y="59" text-anchor="middle">catalog/price/scope, indexers, attribute definitions</text>
  <rect x="40" y="115" width="340" height="66" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="210.0" y="143" text-anchor="middle" font-weight="bold">Website pocketcoffee_eu</text>
  <text x="210.0" y="161" text-anchor="middle">currency EUR, flat rate 4.90, card payment</text>
  <rect x="520" y="115" width="340" height="66" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="690.0" y="143" text-anchor="middle" font-weight="bold">Website pocketcoffee_us</text>
  <text x="690.0" y="161" text-anchor="middle">currency USD, USD prices for the same SKUs</text>
  <rect x="40" y="215" width="340" height="60" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="210.0" y="240" text-anchor="middle" font-weight="bold">Store (group) pocketcoffee_shop</text>
  <text x="210.0" y="258" text-anchor="middle">root category: Default Category (id 2)</text>
  <rect x="520" y="215" width="340" height="60" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="690.0" y="240" text-anchor="middle" font-weight="bold">Store (group) pocketcoffee_us_shop</text>
  <text x="690.0" y="258" text-anchor="middle">root category: Default Category (id 2)</text>
  <rect x="40" y="315" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="120.0" y="336" text-anchor="middle" font-weight="bold">Store view pc_es</text>
  <text x="120.0" y="354" text-anchor="middle">es_ES, default view</text>
  <text x="120.0" y="372" text-anchor="middle">name: Cafe en grano</text>
  <rect x="220" y="315" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="336" text-anchor="middle" font-weight="bold">Store view pc_en</text>
  <text x="300.0" y="354" text-anchor="middle">en_GB</text>
  <text x="300.0" y="372" text-anchor="middle">name: Single-origin beans</text>
  <rect x="520" y="315" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="600.0" y="336" text-anchor="middle" font-weight="bold">Store view pc_us</text>
  <text x="600.0" y="354" text-anchor="middle">en_US</text>
  <text x="600.0" y="372" text-anchor="middle">name: Single-origin beans</text>
  <line x1="450" y1="77" x2="210" y2="113" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="77" x2="690" y2="113" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="181" x2="210" y2="213" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="181" x2="690" y2="213" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="275" x2="120" y2="313" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="275" x2="300" y2="313" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="275" x2="600" y2="313" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="300" width="190" height="100" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="795" y="322" text-anchor="middle" font-weight="bold">Lookup of a value</text>
  <text x="795" y="342" text-anchor="middle" font-size="12">store view</text>
  <text x="795" y="358" text-anchor="middle" font-size="12">then website</text>
  <text x="795" y="374" text-anchor="middle" font-size="12">then default scope</text>
  <text x="450" y="425" text-anchor="middle" font-size="12">Website: prices, currency, shipping and payment methods, tax, stock assignment, base URL, customer sharing.</text>
  <text x="450" y="445" text-anchor="middle" font-size="12">Store: root category (the catalog tree). Store view: language, locale, translated attribute values, URL keys, CMS blocks.</text>
  <text x="450" y="465" text-anchor="middle" font-size="12" opacity="0.85">The Admin and the documentation call the middle level a store; the code and the database call it a store group (store_group).</text>
</svg>
