<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Four generations of Vapor</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">release dates are GitHub tag dates; Vapor 5 is a beta (5.0.0-beta.4 on 2026-10-13)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <line x1="20" y1="86" x2="920" y2="86" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="115" cy="86" r="6" fill="#8a6a00"/>
  <circle cx="335" cy="86" r="6" fill="#1f5f99"/>
  <circle cx="555" cy="86" r="6" fill="#2e7d32"/>
  <circle cx="805" cy="86" r="6" fill="#6a3d9a" stroke="#6a3d9a"/>
  <text x="115" y="72" font-size="12" font-weight="bold" fill="#8a6a00" text-anchor="middle">2017-05</text>
  <text x="335" y="72" font-size="12" font-weight="bold" fill="#1f5f99" text-anchor="middle">2018-05</text>
  <text x="555" y="72" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">2020-04</text>
  <text x="805" y="72" font-size="12" font-weight="bold" fill="#6a3d9a" text-anchor="middle">2026-06 (alpha.1)</text>

  <rect x="20" y="106" width="190" height="230" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="115" y="130" font-size="15" font-weight="bold" fill="#8a6a00" text-anchor="middle">Vapor 2</text>
  <text x="115" y="150" font-size="11" fill="#222222" text-anchor="middle">Swift 3 and 4, Xcode 8 and 9</text>
  <text x="115" y="176" font-size="11" fill="#222222" text-anchor="middle">Droplet</text>
  <text x="115" y="194" font-size="11" fill="#222222" text-anchor="middle">Config/*.json files</text>
  <text x="115" y="212" font-size="11" fill="#222222" text-anchor="middle">Providers</text>
  <text x="115" y="230" font-size="11" fill="#222222" text-anchor="middle">Node and JSONConvertible</text>
  <text x="115" y="248" font-size="11" fill="#222222" text-anchor="middle">Fluent 2, Leaf 2</text>
  <text x="115" y="278" font-size="11" fill="#666666" text-anchor="middle">Patel book</text>
  <text x="115" y="318" font-size="11" fill="#666666" text-anchor="middle">unmaintained</text>

  <rect x="240" y="106" width="190" height="230" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="335" y="130" font-size="15" font-weight="bold" fill="#1f5f99" text-anchor="middle">Vapor 3</text>
  <text x="335" y="150" font-size="11" fill="#222222" text-anchor="middle">Swift 4.x, Xcode 9 and 10</text>
  <text x="335" y="176" font-size="11" fill="#222222" text-anchor="middle">Services, Config, Container</text>
  <text x="335" y="194" font-size="11" fill="#222222" text-anchor="middle">Vapor's own Future type</text>
  <text x="335" y="212" font-size="11" fill="#222222" text-anchor="middle">Codable Content</text>
  <text x="335" y="230" font-size="11" fill="#222222" text-anchor="middle">Fluent 3, Leaf 3, auth package</text>
  <text x="335" y="248" font-size="11" fill="#222222" text-anchor="middle">Run target and main.swift</text>
  <text x="335" y="278" font-size="11" fill="#666666" text-anchor="middle">Yeung, Condon ch. 14 to 36</text>
  <text x="335" y="318" font-size="11" fill="#666666" text-anchor="middle">unmaintained</text>

  <rect x="460" y="106" width="190" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="555" y="130" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">Vapor 4</text>
  <text x="555" y="150" font-size="11" fill="#222222" text-anchor="middle">4.0 to 4.122.2 (Swift 6.0+)</text>
  <text x="555" y="176" font-size="11" fill="#222222" text-anchor="middle">Application and Request services</text>
  <text x="555" y="194" font-size="11" fill="#222222" text-anchor="middle">EventLoopFuture, then async/await</text>
  <text x="555" y="212" font-size="11" fill="#222222" text-anchor="middle">4.50 async APIs (2021-10)</text>
  <text x="555" y="230" font-size="11" fill="#222222" text-anchor="middle">4.89 execute (2023-12)</text>
  <text x="555" y="248" font-size="11" fill="#222222" text-anchor="middle">4.110 VaporTesting (2024-12)</text>
  <text x="555" y="266" font-size="11" fill="#222222" text-anchor="middle">4.113 Application.make (2025-02)</text>
  <text x="555" y="284" font-size="11" fill="#222222" text-anchor="middle">Sendable, Swift 6 mode</text>
  <text x="555" y="318" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">current, this section</text>

  <rect x="680" y="106" width="240" height="230" rx="8" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="800" y="130" font-size="15" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Vapor 5 (beta.4)</text>
  <text x="800" y="150" font-size="11" fill="#222222" text-anchor="middle">tools 6.4, Apple platforms 26.2</text>
  <text x="800" y="176" font-size="11" fill="#222222" text-anchor="middle">swift-http-server, HTTP/2, mTLS</text>
  <text x="800" y="194" font-size="11" fill="#222222" text-anchor="middle">swift-configuration, ServiceLifecycle</text>
  <text x="800" y="212" font-size="11" fill="#222222" text-anchor="middle">no EventLoopFuture, no NIO types</text>
  <text x="800" y="230" font-size="11" fill="#222222" text-anchor="middle">streaming bodies, macro routing</text>
  <text x="800" y="248" font-size="11" fill="#222222" text-anchor="middle">removed: OTP, DotEnv, file operations</text>
  <text x="800" y="266" font-size="11" fill="#222222" text-anchor="middle">SwiftPM traits for WebSockets,</text>
  <text x="800" y="282" font-size="11" fill="#222222" text-anchor="middle">client, multipart and macros</text>
  <text x="800" y="318" font-size="11" fill="#6a3d9a" text-anchor="middle">Fluent, Leaf, JWT, Queues still on Vapor 4</text>

  <line x1="210" y1="221" x2="238" y2="221" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="221" x2="458" y2="221" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="221" x2="678" y2="221" stroke="#444444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <text x="470" y="372" font-size="12" fill="#222222" text-anchor="middle">Each arrow is a rewrite: Vapor 3 to 4 removed Services, Config and Providers; Vapor 4 to 5 removes futures, NIO types and the global storage.</text>
  <text x="470" y="394" font-size="12" fill="#666666" text-anchor="middle">The books map to the first two columns; this section documents the third; the fourth is a preview.</text>
</svg>
