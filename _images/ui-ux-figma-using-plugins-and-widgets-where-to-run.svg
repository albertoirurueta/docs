<svg viewBox="0 0 740 360" width="740" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="360" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where plugins and widgets start in each editor</text>

  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="20" y="50" width="220" height="130" rx="10"/>
    <rect x="260" y="50" width="220" height="130" rx="10"/>
    <rect x="500" y="50" width="220" height="130" rx="10"/>
    <rect x="20" y="200" width="220" height="130" rx="10"/>
    <rect x="260" y="200" width="220" height="130" rx="10"/>
    <rect x="500" y="200" width="220" height="130" rx="10"/>
  </g>
  <g fill="#4F46E5">
    <circle cx="36" cy="66" r="11"/><circle cx="276" cy="66" r="11"/><circle cx="516" cy="66" r="11"/>
    <circle cx="36" cy="216" r="11"/><circle cx="276" cy="216" r="11"/><circle cx="516" cy="216" r="11"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="36" y="70">1</text><text x="276" y="70">2</text><text x="516" y="70">3</text>
    <text x="36" y="220">4</text><text x="276" y="220">5</text><text x="516" y="220">6</text>
  </g>

  <g font-size="14" font-weight="bold" fill="#3730A3">
    <text x="54" y="71">Figma Design</text><text x="294" y="71">Dev Mode</text><text x="534" y="71">FigJam</text>
    <text x="54" y="221">Slides</text><text x="294" y="221">Buzz</text><text x="534" y="221">Any editor</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="34" y="98">Tools tab in the left</text><text x="34" y="116">navigation bar, then Run</text>
    <text x="34" y="140">Actions in the toolbar,</text><text x="34" y="158">Plugins and Widgets tab</text>

    <text x="274" y="98">Plugins in the right</text><text x="274" y="116">sidebar; pin favourites</text>
    <text x="274" y="140">Needs a Full or Dev seat</text>

    <text x="514" y="98">Toolbar More menu:</text><text x="514" y="116">Plugins tab, Widgets tab</text>
    <text x="514" y="140">Widgets: Browse more in</text><text x="514" y="158">Community, then Add</text>

    <text x="34" y="248">Actions in the toolbar,</text><text x="34" y="266">then the Plugins tab</text>

    <text x="274" y="248">Plugins tab in the left</text><text x="274" y="266">panel, or open in a modal</text>
    <text x="274" y="290">Right-click an asset, Plugins</text>

    <text x="514" y="248">Quick actions bar</text>
    <text x="514" y="266">Run last plugin and</text>
    <text x="514" y="284">Find more plugins</text>
    <text x="514" y="308">Also from a Community page</text>
  </g>
</svg>
