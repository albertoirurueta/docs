<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tsl-shaders" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One TSL graph, two generated shader languages</text>
<rect x="20" y="56" width="215" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="127.5" y="93.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">TSL in JavaScript</text>
<text x="127.5" y="107.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace"></text>
<text x="127.5" y="121.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">const pulse = sin(</text>
<text x="127.5" y="135.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">  time.mul(2)).mul(0.5)</text>
<text x="127.5" y="149.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">  .add(0.5);</text>
<text x="127.5" y="163.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">material.emissiveNode =</text>
<text x="127.5" y="177.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">  glow.mul(pulse);</text>
<line x1="235" y1="131" x2="280" y2="131" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-shaders)"/>
<text x="257" y="121" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">builds</text>
<rect x="280" y="56" width="200" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="100.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Node graph</text>
<text x="380.0" y="114.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="380.0" y="128.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">time, mul 2, sin,</text>
<text x="380.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mul 0.5, add 0.5,</text>
<text x="380.0" y="156.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mul glow, emissive</text>
<text x="380.0" y="170.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">output</text>
<line x1="480" y1="131" x2="520" y2="131" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-shaders)"/>
<rect x="520" y="56" width="220" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="100.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">NodeBuilder</text>
<text x="630.0" y="114.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle"></text>
<text x="630.0" y="128.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">walks the graph per</text>
<text x="630.0" y="142.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">material and backend,</text>
<text x="630.0" y="156.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">emits one shader per</text>
<text x="630.0" y="170.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">stage and caches it</text>
<line x1="570" y1="206" x2="260" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-shaders)"/>
<text x="400" y="214" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">WGSL</text>
<line x1="650" y1="206" x2="560" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-shaders)"/>
<text x="640" y="228" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">GLSL</text>
<rect x="60" y="250" width="300" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="210.0" y="287.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">WebGPU backend: WGSL</text>
<text x="210.0" y="301.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace"></text>
<text x="210.0" y="315.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">@fragment fn main() </text>
<text x="210.0" y="329.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">  -&gt; @location(0) vec4f {</text>
<text x="210.0" y="343.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">  let pulse = sin(t * 2.0)</text>
<text x="210.0" y="357.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">    * 0.5 + 0.5;</text>
<text x="210.0" y="371.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle" font-family="Menlo, Consolas, monospace">  ... glow * pulse ...</text>
<rect x="400" y="250" width="300" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="550.0" y="287.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">WebGL 2 backend: GLSL ES 3.00</text>
<text x="550.0" y="301.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace"></text>
<text x="550.0" y="315.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">#version 300 es</text>
<text x="550.0" y="329.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">void main() {</text>
<text x="550.0" y="343.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">  float pulse = sin(t * 2.0)</text>
<text x="550.0" y="357.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">    * 0.5 + 0.5;</text>
<text x="550.0" y="371.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">  ... glow * pulse ...</text>
<text x="380" y="424" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Illustrative: generated names and layout differ, the maths is what the graph encodes.</text>
</svg>
