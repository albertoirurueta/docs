<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Windows app platforms and the layers they sit on</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Solid box: required layer. Dashed box: optional layer. Every stack ends up calling Windows through Win32 or COM.</text>

  <text x="20" y="80" font-size="13" font-weight="bold" fill="#222222">UI stacks</text>

  <rect x="20" y="90" width="108" height="86" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="74" y="116" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">WinUI 3</text>
  <text x="74" y="136" font-size="12" fill="#1c4b73" text-anchor="middle">C# or C++</text>
  <text x="74" y="152" font-size="12" fill="#1c4b73" text-anchor="middle">Fluent XAML</text>
  <text x="74" y="168" font-size="12" fill="#1c4b73" text-anchor="middle">Recommended</text>

  <rect x="138" y="90" width="108" height="86" rx="8" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="192" y="116" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">WPF</text>
  <text x="192" y="136" font-size="12" fill="#2d6a34" text-anchor="middle">C# or VB</text>
  <text x="192" y="152" font-size="12" fill="#2d6a34" text-anchor="middle">WPF XAML</text>
  <text x="192" y="168" font-size="12" fill="#2d6a34" text-anchor="middle">Mature</text>

  <rect x="256" y="90" width="108" height="86" rx="8" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="310" y="116" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">WinForms</text>
  <text x="310" y="136" font-size="12" fill="#2d6a34" text-anchor="middle">C# or VB</text>
  <text x="310" y="152" font-size="12" fill="#2d6a34" text-anchor="middle">Designer, no XAML</text>
  <text x="310" y="168" font-size="12" fill="#2d6a34" text-anchor="middle">Mature</text>

  <rect x="374" y="90" width="108" height="86" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="428" y="116" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">.NET MAUI</text>
  <text x="428" y="136" font-size="12" fill="#1c4b73" text-anchor="middle">C# and XAML</text>
  <text x="428" y="152" font-size="12" fill="#1c4b73" text-anchor="middle">Windows uses</text>
  <text x="428" y="168" font-size="12" fill="#1c4b73" text-anchor="middle">WinUI 3 inside</text>

  <rect x="492" y="90" width="108" height="86" rx="8" fill="#eeeeee" stroke="#777777" stroke-width="1.5"/>
  <text x="546" y="116" font-size="14" font-weight="bold" fill="#555555" text-anchor="middle">UWP</text>
  <text x="546" y="136" font-size="12" fill="#555555" text-anchor="middle">Windows 10 and 11</text>
  <text x="546" y="152" font-size="12" fill="#555555" text-anchor="middle">UWP XAML</text>
  <text x="546" y="168" font-size="12" fill="#555555" text-anchor="middle">Maintenance</text>

  <rect x="610" y="90" width="130" height="86" rx="8" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.5"/>
  <text x="675" y="116" font-size="14" font-weight="bold" fill="#9a6200" text-anchor="middle">Other routes</text>
  <text x="675" y="136" font-size="12" fill="#9a6200" text-anchor="middle">Win32 / C++</text>
  <text x="675" y="152" font-size="12" fill="#9a6200" text-anchor="middle">React Native for Windows</text>
  <text x="675" y="168" font-size="12" fill="#9a6200" text-anchor="middle">PWA in Edge</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#222222">Frameworks and SDKs</text>

  <rect x="20" y="216" width="462" height="40" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="251" y="241" font-size="13" fill="#1c4b73" text-anchor="middle">Windows App SDK 2.5.1 (WinUI 3, windowing, lifecycle, notifications, MRT Core)</text>

  <rect x="138" y="262" width="226" height="34" rx="8" fill="#ffffff" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="251" y="284" font-size="12" fill="#1c4b73" text-anchor="middle">Optional for WPF and WinForms apps</text>

  <rect x="20" y="306" width="580" height="44" rx="8" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="310" y="333" font-size="13" fill="#2d6a34" text-anchor="middle">.NET 10 LTS (10.0.13), C# 14: runtime, base class library, MSBuild SDK</text>

  <rect x="492" y="216" width="108" height="40" rx="8" fill="#eeeeee" stroke="#777777" stroke-width="1.5"/>
  <text x="546" y="241" font-size="12" fill="#555555" text-anchor="middle">Windows Runtime</text>

  <rect x="610" y="216" width="130" height="134" rx="8" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.5"/>
  <text x="675" y="262" font-size="12" fill="#9a6200" text-anchor="middle">C++ toolchain</text>
  <text x="675" y="282" font-size="12" fill="#9a6200" text-anchor="middle">JavaScript runtime</text>
  <text x="675" y="302" font-size="12" fill="#9a6200" text-anchor="middle">Browser engine</text>
  <text x="675" y="322" font-size="12" fill="#9a6200" text-anchor="middle">(no .NET needed)</text>

  <text x="20" y="380" font-size="13" font-weight="bold" fill="#222222">Operating system</text>

  <rect x="20" y="390" width="720" height="44" rx="8" fill="#f7f7f7" stroke="#777777" stroke-width="1.5"/>
  <text x="380" y="417" font-size="13" fill="#222222" text-anchor="middle">Win32 and COM APIs, DirectX, DirectComposition, UI Automation, Windows Runtime (WinRT)</text>

  <rect x="20" y="444" width="720" height="40" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
  <text x="380" y="469" font-size="13" fill="#222222" text-anchor="middle">Windows 11 and Windows 10 (Windows 10 support ended on 14 October 2025)</text>

  <text x="380" y="506" font-size="12" fill="#666666" text-anchor="middle">Original drawing; the arrangement summarises the platform descriptions on Microsoft Learn.</text>
</svg>
