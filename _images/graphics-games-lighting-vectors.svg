<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="vc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="vca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="vcw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="vcg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The vectors every lighting equation uses: N, L, V, R and H</text>
<line x1="150.0" y1="260.0" x2="610.0" y2="260.0" stroke="#374151" stroke-width="2.5"/>
<text x="600" y="280" text-anchor="end" font-size="11" fill="#374151">surface</text>
<circle cx="380.0" cy="260.0" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<line x1="380.0" y1="260.0" x2="380.0" y2="100.0" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#vca)"/>
<text x="388" y="92" text-anchor="start" font-size="12" fill="#3730A3">N normal</text>
<line x1="380.0" y1="260.0" x2="270.7" y2="129.8" stroke="#B45309" stroke-width="2.5" marker-end="url(#vcw)"/>
<text x="264.7261063532883" y="123.77244466977373" text-anchor="end" font-size="12" fill="#92400E">L to light</text>
<line x1="380.0" y1="260.0" x2="537.6" y2="196.3" stroke="#047857" stroke-width="2.5" marker-end="url(#vcg)"/>
<text x="543.6212552763538" y="200.31687911929495" text-anchor="start" font-size="12" fill="#047857">V to eye</text>
<line x1="380.0" y1="260.0" x2="476.4" y2="145.1" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#vc)"/>
<text x="482.4181414529809" y="139.09333353215328" text-anchor="start" font-size="12" fill="#374151">R = reflect(-L, N)</text>
<line x1="380.0" y1="260.0" x2="409.0" y2="143.6" stroke="#3730A3" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#vca)"/>
<text x="417.03062747196014" y="145.5645128468804" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">H halfway</text>
<text x="320" y="230" text-anchor="end" font-size="11" fill="#92400E">theta_i</text>
<text x="380" y="310" text-anchor="middle" font-size="12" fill="#1F2937">Lambert: max(N . L, 0).  Phong: max(R . V, 0)^s.  Blinn-Phong: max(N . H, 0)^s with H = normalise(L + V).</text>
<text x="380" y="328" text-anchor="middle" font-size="11" fill="#374151">All vectors are unit length and expressed in the same space (world or view).</text>
</svg>
