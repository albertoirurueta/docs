<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The layers between a game and the GPU</text>
<rect x="40" y="50" width="400" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240" y="73" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Application or engine code</text>
<text x="240" y="90" font-size="11" fill="#374151" text-anchor="middle">your renderer, or Unity, Unreal Engine or Godot</text>
<line x1="240" y1="102" x2="240" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="116" width="400" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240" y="139" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Helper libraries</text>
<text x="240" y="156" font-size="11" fill="#374151" text-anchor="middle">Vulkan-Hpp, volk, vk-bootstrap, VMA, GLFW or SDL3</text>
<line x1="240" y1="168" x2="240" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="182" width="400" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240" y="205" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Vulkan loader and layers</text>
<text x="240" y="222" font-size="11" fill="#374151" text-anchor="middle">validation, API dump and capture layers sit here</text>
<line x1="240" y1="234" x2="240" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="248" width="400" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240" y="271" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Installable client driver (ICD)</text>
<text x="240" y="288" font-size="11" fill="#374151" text-anchor="middle">NVIDIA, AMD, Intel, Arm, Qualcomm or Mesa</text>
<line x1="240" y1="300" x2="240" y2="314" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="314" width="400" height="52" rx="10" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240" y="337" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">GPU</text>
<text x="240" y="354" font-size="11" fill="#374151" text-anchor="middle">queues, memory and fixed-function hardware</text>
<rect x="480" y="50" width="250" height="100" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="605" y="72" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">Built on top of Vulkan</text>
<text x="605" y="92" font-size="11" fill="#374151" text-anchor="middle">ANGLE: OpenGL ES on Vulkan</text>
<text x="605" y="110" font-size="11" fill="#374151" text-anchor="middle">Zink: OpenGL on Vulkan</text>
<text x="605" y="128" font-size="11" fill="#374151" text-anchor="middle">wgpu and Dawn: WebGPU on Vulkan</text>
<line x1="480" y1="100" x2="442" y2="182" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="480" y="230" width="250" height="100" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605" y="252" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold">Vulkan built on top of other APIs</text>
<text x="605" y="272" font-size="11" fill="#374151" text-anchor="middle">MoltenVK: Vulkan on Metal</text>
<text x="605" y="290" font-size="11" fill="#374151" text-anchor="middle">KosmicKrisp: Vulkan 1.4 on Metal 4</text>
<text x="605" y="308" font-size="11" fill="#374151" text-anchor="middle">(macOS 26 or later)</text>
<line x1="442" y1="244" x2="478" y2="262" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
