<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 171" width="1080" height="171" role="img" aria-labelledby="sap-finance-guide-follow-purchase-and-sale-postings-04-goods-receipt-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-follow-purchase-and-sale-postings-04-goods-receipt-title">Terminal with the command that sets BASE to the service address and the curl command that posts the goods receipt from http/goods-receipt.json to the action postGoodsReceipt; the answer is the document header with DocumentNumber 100000001 and DocumentType WE; callout 8 marks the curl command and its answer</title>
<g><rect x="0" y="0" width="1080" height="171" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="139" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ export BASE=http://localhost:4004/odata/v4/ledger-postings</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/goods-receipt.json $BASE/postGoodsReceipt</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Documents/$entity&quot;,&quot;DocumentNumber&quot;:&quot;100000001&quot;,&quot;DocumentType&quot;:&quot;WE&quot;,&quot;CompanyCode&quot;:&quot;EX01&quot;,</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Ledger&quot;:&quot;0L&quot;,&quot;PostingDate&quot;:&quot;2026-03-03&quot;,&quot;Description&quot;:&quot;Goods receipt PO-1&quot;}</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">undefined</text></g>
<rect x="5" y="88" width="1042" height="65" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="88" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="93" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">8</text></g></g>
</svg>
