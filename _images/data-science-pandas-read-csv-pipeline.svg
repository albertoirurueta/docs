<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Stages of pandas.read_csv</title>
  <desc id="d">A left-to-right pipeline: bytes are decoded with encoding, split into fields using sep, quotechar and comment after skiprows, missing values are detected with na_values, columns get a dtype or converter, date columns are parsed with date_format, and the result is a DataFrame.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">What read_csv does, in order</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#0F172A">
    <rect x="24" y="60" width="196" height="84" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
    <text x="122" y="86" font-size="16" font-weight="bold">1. Open and decode</text>
    <text x="122" y="108" font-size="13" font-family="Menlo, Consolas, monospace">compression, encoding</text>
    <text x="122" y="128" font-size="13" font-family="Menlo, Consolas, monospace">encoding_errors</text>

    <rect x="262" y="60" width="196" height="84" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="360" y="86" font-size="16" font-weight="bold">2. Split into fields</text>
    <text x="360" y="108" font-size="13" font-family="Menlo, Consolas, monospace">skiprows, header, sep</text>
    <text x="360" y="128" font-size="13" font-family="Menlo, Consolas, monospace">quotechar, comment</text>

    <rect x="500" y="60" width="196" height="84" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="598" y="86" font-size="16" font-weight="bold">3. Detect missing</text>
    <text x="598" y="108" font-size="13" font-family="Menlo, Consolas, monospace">na_values</text>
    <text x="598" y="128" font-size="13" font-family="Menlo, Consolas, monospace">keep_default_na</text>

    <rect x="500" y="176" width="196" height="84" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="598" y="202" font-size="16" font-weight="bold">4. Convert types</text>
    <text x="598" y="224" font-size="13" font-family="Menlo, Consolas, monospace">dtype, converters</text>
    <text x="598" y="244" font-size="13" font-family="Menlo, Consolas, monospace">true_values, thousands</text>

    <rect x="262" y="176" width="196" height="84" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="360" y="202" font-size="16" font-weight="bold">5. Parse dates</text>
    <text x="360" y="224" font-size="13" font-family="Menlo, Consolas, monospace">parse_dates</text>
    <text x="360" y="244" font-size="13" font-family="Menlo, Consolas, monospace">date_format, dayfirst</text>

    <rect x="24" y="176" width="196" height="84" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="122" y="202" font-size="16" font-weight="bold">6. Build the frame</text>
    <text x="122" y="224" font-size="13" font-family="Menlo, Consolas, monospace">index_col, usecols</text>
    <text x="122" y="244" font-size="13" font-family="Menlo, Consolas, monospace">nrows, chunksize</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M220 102 H258"/><path d="M458 102 H496"/><path d="M598 144 V172"/><path d="M496 218 H462"/><path d="M258 218 H224"/>
  </g>
  <text x="360" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Conceptual order; the C engine fuses several stages, and the pyarrow engine supports only a subset of the options.</text>
</svg>
