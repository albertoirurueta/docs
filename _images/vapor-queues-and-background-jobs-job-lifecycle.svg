<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Life of a queued job in Vapor Queues</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">dispatch stores the job and its id; a worker pops the id, runs dequeue and then clears, retries or gives up</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="76" width="230" height="110" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="135" y="102" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Web process</text>
  <text x="135" y="124" font-size="11" fill="#222222" text-anchor="middle">POST /members, row committed</text>
  <text x="135" y="140" font-size="11" fill="#222222" text-anchor="middle">req.queues(.emails).dispatch(</text>
  <text x="135" y="156" font-size="11" fill="#222222" text-anchor="middle">WelcomeEmailJob.self, payload,</text>
  <text x="135" y="172" font-size="11" fill="#222222" text-anchor="middle">maxRetryCount: 5)  returns 202</text>

  <rect x="355" y="76" width="260" height="110" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="485" y="102" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Driver storage (Redis)</text>
  <text x="485" y="124" font-size="11" fill="#222222" text-anchor="middle">job:&lt;id&gt;  JSON JobData (payload, attempts,</text>
  <text x="485" y="140" font-size="11" fill="#222222" text-anchor="middle">maxRetryCount, delayUntil, jobName)</text>
  <text x="485" y="156" font-size="11" fill="#222222" text-anchor="middle">list bookshelf[emails]  waiting ids</text>
  <text x="485" y="172" font-size="11" fill="#222222" text-anchor="middle">list bookshelf[emails]-processing</text>

  <rect x="720" y="76" width="200" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="820" y="102" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Worker</text>
  <text x="820" y="124" font-size="11" fill="#222222" text-anchor="middle">swift run App queues</text>
  <text x="820" y="140" font-size="11" fill="#222222" text-anchor="middle">--queue emails</text>
  <text x="820" y="156" font-size="11" fill="#222222" text-anchor="middle">or startInProcessJobs;</text>
  <text x="820" y="172" font-size="11" fill="#222222" text-anchor="middle">polls every refreshInterval</text>

  <line x1="250" y1="131" x2="353" y2="131" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="301" y="122" font-size="11" fill="#444444" text-anchor="middle">set + push</text>
  <line x1="718" y1="116" x2="617" y2="116" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="667" y="108" font-size="11" fill="#444444" text-anchor="middle">pop</text>
  <line x1="617" y1="150" x2="718" y2="150" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="667" y="166" font-size="11" fill="#444444" text-anchor="middle">get job data</text>

  <rect x="620" y="226" width="300" height="56" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="1.5"/>
  <text x="770" y="250" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">delayUntil still in the future?</text>
  <text x="770" y="268" font-size="11" fill="#222222" text-anchor="middle">push the id back and stop this pass</text>
  <path d="M820 186 L820 224" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="620" y="312" width="300" height="56" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="1.5"/>
  <text x="770" y="336" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">job.dequeue(context, payload)</text>
  <text x="770" y="354" font-size="11" fill="#222222" text-anchor="middle">your AsyncJob code runs here</text>
  <path d="M820 282 L820 310" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M770 368 L770 388 M160 388 L770 388" fill="none" stroke="#444444" stroke-width="1.5"/>
  <path d="M770 388 L770 408" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M160 388 L160 406" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470 388 L470 406" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="165" y="381" font-size="11" fill="#444444">returns normally</text>
  <text x="475" y="381" font-size="11" fill="#444444">throws, attempts left</text>
  <text x="785" y="402" font-size="11" fill="#444444">throws, none left</text>

  <rect x="20" y="410" width="280" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="160" y="432" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Success</text>
  <text x="160" y="450" font-size="11" fill="#222222" text-anchor="middle">clear(id): job data deleted, id leaves -processing</text>
  <text x="160" y="466" font-size="11" fill="#222222" text-anchor="middle">delegate success(jobId:)</text>

  <rect x="330" y="410" width="280" height="76" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="470" y="432" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Retry</text>
  <text x="470" y="450" font-size="11" fill="#222222" text-anchor="middle">delay = nextRetryIn(attempt:); data rewritten</text>
  <text x="470" y="466" font-size="11" fill="#222222" text-anchor="middle">with delayUntil, id pushed back, error(...) not called</text>

  <rect x="640" y="410" width="280" height="76" rx="8" fill="#fbe9e7" stroke="#bf360c" stroke-width="1.5"/>
  <text x="780" y="432" font-size="14" font-weight="bold" fill="#bf360c" text-anchor="middle">Final failure</text>
  <text x="780" y="450" font-size="11" fill="#222222" text-anchor="middle">job.error(...) and delegate error(jobId:error:),</text>
  <text x="780" y="466" font-size="11" fill="#222222" text-anchor="middle">then cleared: no dead-letter queue</text>
</svg>
