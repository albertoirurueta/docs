<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Cutover timeline of the Pocket Coffee Magento shop</title>
  <desc id="d">A timeline in three lanes with six time columns. The top lane is the old single server: it takes orders until the freeze, then runs in maintenance mode with cron removed and the message queue drained, and after the switch it stays untouched as the rollback target for seven days. The middle lane is the EKS stack: days before the cutover the database rehearsal import, the media pre-copy to S3 and the OpenSearch index are tested; at the freeze it imports the final dump, applies the base URL and search engine settings, runs the full reindex and flushes the cache; after the DNS switch it takes the orders. The bottom lane holds DNS and the payment provider: the DNS TTL is lowered to 60 seconds a day before, the switch happens when the checks pass, and the provider's notifications for payments that were in flight are replayed or reconciled afterwards. A caption states that at any moment exactly one side takes orders.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Freeze, copy, reindex, check, switch: one side takes orders at any moment</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Cutover of www.pocketcoffee.example from one server to EKS, RDS, S3 and OpenSearch; the order of the steps matters more than the clock</text>

  <!-- time axis -->
  <line x1="150" y1="92" x2="935" y2="92" stroke="#6f8aa3" stroke-width="2" marker-end="url(#b)"/>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="225" y="84">T-7 d to T-2 d</text>
    <text x="365" y="84">T-24 h</text>
    <text x="505" y="84">T-0 freeze</text>
    <text x="645" y="84">T+30 to 90 min</text>
    <text x="785" y="84">T+100 min</text>
    <text x="890" y="84">T+7 d</text>
  </g>
  <g stroke="#6f8aa3" stroke-width="1" stroke-dasharray="4 4">
    <line x1="295" y1="98" x2="295" y2="470"/>
    <line x1="435" y1="98" x2="435" y2="470"/>
    <line x1="575" y1="98" x2="575" y2="470"/>
    <line x1="715" y1="98" x2="715" y2="470"/>
    <line x1="835" y1="98" x2="835" y2="470"/>
  </g>

  <!-- lane labels -->
  <g font-size="13" font-weight="bold" fill="#f4b860">
    <text x="40" y="150">Old server</text>
    <text x="40" y="270">EKS stack</text>
    <text x="40" y="400">DNS and payments</text>
  </g>
  <g font-size="11" fill="#f2f5f8">
    <text x="40" y="166">Apache or Nginx, PHP,</text>
    <text x="40" y="180">local MariaDB</text>
    <text x="40" y="286">pocketcoffee-prod,</text>
    <text x="40" y="300">RDS, S3, OpenSearch</text>
    <text x="40" y="416">Route 53, payment</text>
    <text x="40" y="430">provider</text>
  </g>

  <!-- old server lane -->
  <rect x="150" y="116" width="275" height="64" rx="9" fill="#4d7c5a"/>
  <text x="162" y="138" font-size="12" font-weight="bold" fill="#f2f5f8">Selling, taking orders</text>
  <text x="162" y="156" font-size="11.5" fill="#f2f5f8">inventory, crypt key copied to</text>
  <text x="162" y="171" font-size="11.5" fill="#f2f5f8">Secrets Manager, pre-copy of pub/media</text>
  <rect x="440" y="116" width="270" height="64" rx="9" fill="#7a5c3a"/>
  <text x="452" y="138" font-size="12" font-weight="bold" fill="#f2f5f8">Maintenance mode, 503</text>
  <text x="452" y="156" font-size="11.5" fill="#f2f5f8">cron:remove, queue drained, final</text>
  <text x="452" y="171" font-size="11.5" fill="#f2f5f8">mysqldump, final media delta</text>
  <rect x="720" y="116" width="205" height="64" rx="9" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="732" y="138" font-size="12" font-weight="bold" fill="#f2f5f8">Untouched: rollback target</text>
  <text x="732" y="156" font-size="11.5" fill="#f2f5f8">DNS back to it if needed; kept 7 days,</text>
  <text x="732" y="171" font-size="11.5" fill="#f2f5f8">then snapshot and shut down</text>

  <!-- EKS lane -->
  <rect x="150" y="236" width="275" height="64" rx="9" fill="#3f6e9a"/>
  <text x="162" y="258" font-size="12" font-weight="bold" fill="#f2f5f8">Rehearsal on a copy</text>
  <text x="162" y="276" font-size="11.5" fill="#f2f5f8">import, URLs, full reindex timed,</text>
  <text x="162" y="291" font-size="11.5" fill="#f2f5f8">checks through curl --resolve</text>
  <rect x="440" y="236" width="270" height="64" rx="9" fill="#3f6e9a"/>
  <text x="452" y="258" font-size="12" font-weight="bold" fill="#f2f5f8">Import, URLs, search, reindex</text>
  <text x="452" y="276" font-size="11.5" fill="#f2f5f8">pocketcoffee-import Job, SQL for</text>
  <text x="452" y="291" font-size="11.5" fill="#f2f5f8">base URLs, indexer:reindex, flush</text>
  <rect x="720" y="236" width="205" height="64" rx="9" fill="#4d7c5a"/>
  <text x="732" y="258" font-size="12" font-weight="bold" fill="#f2f5f8">Takes the orders</text>
  <text x="732" y="276" font-size="11.5" fill="#f2f5f8">web scaled up, cron and</text>
  <text x="732" y="291" font-size="11.5" fill="#f2f5f8">consumers started last</text>

  <!-- DNS lane -->
  <rect x="150" y="366" width="275" height="64" rx="9" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="162" y="388" font-size="12" font-weight="bold" fill="#f2f5f8">TTL lowered to 60 s</text>
  <text x="162" y="406" font-size="11.5" fill="#f2f5f8">two days before at the latest,</text>
  <text x="162" y="421" font-size="11.5" fill="#f2f5f8">after the old TTL has expired</text>
  <rect x="610" y="366" width="215" height="64" rx="9" fill="#f4b860"/>
  <text x="622" y="388" font-size="12" font-weight="bold" fill="#1b2733">Switch www to the new ALB</text>
  <text x="622" y="406" font-size="11.5" fill="#1b2733">only when the checks pass;</text>
  <text x="622" y="421" font-size="11.5" fill="#1b2733">the old server stays as target</text>
  <rect x="830" y="366" width="95" height="64" rx="9" fill="#7a5c3a"/>
  <text x="840" y="388" font-size="11.5" font-weight="bold" fill="#f2f5f8">Provider</text>
  <text x="840" y="406" font-size="11" fill="#f2f5f8">payments in</text>
  <text x="840" y="421" font-size="11" fill="#f2f5f8">flight checked</text>

  <!-- flow arrows -->
  <line x1="505" y1="182" x2="505" y2="232" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="515" y="212" font-size="11" fill="#f2f5f8">final dump and files</text>
  <line x1="680" y1="302" x2="680" y2="362" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="690" y="336" font-size="11" fill="#f2f5f8">checks pass</text>
  <line x1="780" y1="364" x2="780" y2="304" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
  <text x="790" y="338" font-size="11" fill="#f2f5f8">traffic</text>

  <!-- caption -->
  <rect x="40" y="478" width="880" height="56" rx="9" fill="#3d5266"/>
  <text x="56" y="500" font-size="12.5" font-weight="bold" fill="#f4b860">Rule</text>
  <text x="56" y="520" font-size="12" fill="#f2f5f8">The old server stops taking orders at the freeze and the new stack starts taking them only after the DNS switch; between the two the shop answers 503, not a second copy of the data.</text>
</svg>
