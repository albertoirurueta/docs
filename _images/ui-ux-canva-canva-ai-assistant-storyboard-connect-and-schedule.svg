<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: connect Slack and schedule a weekly task</text>
<rect x="12" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<g transform="translate(12,50)">
<rect x="10" y="210" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/><circle cx="24" cy="223" r="7" fill="#EEF2FF" stroke="#4F46E5"/><text x="24" y="227" font-size="11" fill="#4F46E5" text-anchor="middle" font-weight="bold">+</text><text x="36" y="227" font-size="10" fill="#6B7280" text-anchor="start">Ask Canva AI</text><circle cx="118" cy="223" r="8" fill="#4F46E5"/><rect x="10" y="92" width="120" height="108" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/><text x="18" y="112" font-size="11" fill="#374151" text-anchor="start">Upload</text><text x="18" y="134" font-size="11" fill="#374151" text-anchor="start">Add from Canva</text><text x="18" y="156" font-size="11" fill="#374151" text-anchor="start">Apply brand</text><rect x="12" y="164" width="116" height="22" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="18" y="179" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Connect</text>
<circle cx="18" cy="18" r="11" fill="#4F46E5"/><text x="18" y="22" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g>
<text x="82.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Plus menu,</text><text x="82.0" y="338" font-size="12" fill="#374151" text-anchor="middle">then Connect</text>
<path d="M153,175 L163,175" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="164" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<g transform="translate(164,50)">
<text x="10" y="64" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Available apps</text><rect x="10" y="74" width="120" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="16" y="91" font-size="11" fill="#374151" text-anchor="start">Slack</text><rect x="78" y="80" width="46" height="14" rx="7" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="101" y="91" font-size="9" fill="#FFFFFF" text-anchor="middle">Connect</text><rect x="10" y="106" width="120" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="16" y="123" font-size="11" fill="#374151" text-anchor="start">Google Drive</text><rect x="10" y="138" width="120" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="16" y="155" font-size="11" fill="#374151" text-anchor="start">Notion</text><text x="10" y="190" font-size="10" fill="#6B7280" text-anchor="start">Sign in and authorise</text><text x="10" y="204" font-size="10" fill="#6B7280" text-anchor="start">read-only access</text>
<circle cx="18" cy="18" r="11" fill="#4F46E5"/><text x="18" y="22" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g>
<text x="234.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Choose Slack</text><text x="234.0" y="338" font-size="12" fill="#374151" text-anchor="middle">and authorise</text>
<path d="M305,175 L315,175" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="316" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<g transform="translate(316,50)">
<rect x="10" y="74" width="120" height="30" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="16" y="93" font-size="11" fill="#374151" text-anchor="start">Slack</text><rect x="92" y="82" width="32" height="14" rx="7" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><circle cx="116" cy="89" r="5" fill="#FFFFFF"/><text x="10" y="128" font-size="10" fill="#374151" text-anchor="start">Toggle on: Canva AI</text><text x="10" y="142" font-size="10" fill="#374151" text-anchor="start">may use it as context.</text><text x="10" y="166" font-size="10" fill="#6B7280" text-anchor="start">Toggle off: stays</text><text x="10" y="180" font-size="10" fill="#6B7280" text-anchor="start">connected.</text>
<circle cx="18" cy="18" r="11" fill="#4F46E5"/><text x="18" y="22" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g>
<text x="386.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Toggle it on</text><text x="386.0" y="338" font-size="12" fill="#374151" text-anchor="middle">as context</text>
<path d="M457,175 L467,175" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="468" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<g transform="translate(468,50)">
<rect x="10" y="56" width="120" height="70" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/><text x="16" y="74" font-size="10" fill="#374151" text-anchor="start">Every Friday: draft</text><text x="16" y="88" font-size="10" fill="#374151" text-anchor="start">next week's posts</text><text x="16" y="102" font-size="10" fill="#374151" text-anchor="start">from #launch in Slack</text><rect x="10" y="150" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/><text x="20" y="167" font-size="11" fill="#374151" text-anchor="start">Submit</text><rect x="80" y="154" width="46" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="103" y="167" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Weekly</text><text x="10" y="200" font-size="10" fill="#6B7280" text-anchor="start">Dropdown beside Submit</text>
<circle cx="18" cy="18" r="11" fill="#4F46E5"/><text x="18" y="22" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g>
<text x="538.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Set a schedule</text><text x="538.0" y="338" font-size="12" fill="#374151" text-anchor="middle">beside Submit</text>
<path d="M609,175 L619,175" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="620" y="50" width="128" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<g transform="translate(620,50)">
<text x="10" y="64" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Tasks</text><rect x="10" y="72" width="56" height="16" rx="8" fill="#B45309" stroke="#B45309" stroke-width="1"/><text x="38" y="84" font-size="9" fill="#FFFFFF" text-anchor="middle">Scheduled</text><rect x="70" y="72" width="56" height="16" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="98" y="84" font-size="9" fill="#374151" text-anchor="middle">Completed</text><rect x="10" y="96" width="110" height="34" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="16" y="111" font-size="10" fill="#92400E" text-anchor="start" font-weight="bold">Friday posts</text><text x="16" y="124" font-size="10" fill="#92400E" text-anchor="start">Weekly, 09:00</text><text x="10" y="160" font-size="10" fill="#374151" text-anchor="start">Each run opens a</text><text x="10" y="174" font-size="10" fill="#374151" text-anchor="start">new chat and sends</text><text x="10" y="188" font-size="10" fill="#374151" text-anchor="start">a notification.</text>
<circle cx="18" cy="18" r="11" fill="#B45309"/><text x="18" y="22" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text></g>
<text x="684.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Review in Tasks</text><text x="684.0" y="338" font-size="12" fill="#374151" text-anchor="middle">new chat each run</text>
<text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
