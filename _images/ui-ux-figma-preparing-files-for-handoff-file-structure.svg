<svg viewBox="0 0 740 440" width="740" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="440" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A handoff-ready Bookshelf file</text>
  <!-- pages column -->
  <rect x="20" y="50" width="190" height="300" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="34" y="74" font-size="13" font-weight="bold" fill="#3730A3">Pages</text>
  <g font-size="12" fill="#374151">
    <rect x="30" y="86" width="170" height="30" rx="6" fill="#F3F4F6"/><text x="42" y="106">Cover</text>
    <rect x="30" y="124" width="170" height="30" rx="6" fill="#F3F4F6"/><text x="42" y="144">Components (library)</text>
    <rect x="30" y="162" width="170" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="42" y="182" font-weight="bold" fill="#3730A3">Mobile screens</text>
    <rect x="30" y="200" width="170" height="30" rx="6" fill="#F3F4F6"/><text x="42" y="220">Web catalogue</text>
    <rect x="30" y="238" width="170" height="30" rx="6" fill="#F3F4F6"/><text x="42" y="258">Explorations</text>
    <rect x="30" y="276" width="170" height="30" rx="6" fill="#F3F4F6"/><text x="42" y="296">Archive</text>
  </g>
  <text x="34" y="334" font-size="11" fill="#4B5563">One page per surface or topic</text>
  <!-- canvas -->
  <rect x="235" y="50" width="485" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="249" y="74" font-size="13" font-weight="bold" fill="#3730A3">Page: Mobile screens</text>
  <!-- section 1 -->
  <rect x="250" y="86" width="220" height="116" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="262" y="106" font-size="12" font-weight="bold" fill="#3730A3">Catalogue / browse</text>
  <rect x="368" y="92" width="94" height="20" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="415" y="106" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Ready for dev</text>
  <rect x="262" y="120" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="272" y="130" width="40" height="6" fill="#E5E7EB"/><rect x="272" y="142" width="30" height="6" fill="#E5E7EB"/>
  <rect x="330" y="120" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="340" y="130" width="40" height="6" fill="#E5E7EB"/><rect x="340" y="142" width="30" height="6" fill="#E5E7EB"/>
  <rect x="398" y="120" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="408" y="130" width="40" height="6" fill="#E5E7EB"/><rect x="408" y="142" width="30" height="6" fill="#E5E7EB"/>
  <!-- section 2 -->
  <rect x="490" y="86" width="215" height="116" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="502" y="106" font-size="12" font-weight="bold" fill="#3730A3">Book detail</text>
  <rect x="598" y="92" width="100" height="20" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="648" y="106" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Changed</text>
  <rect x="502" y="120" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="512" y="130" width="40" height="6" fill="#E5E7EB"/>
  <rect x="570" y="120" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="580" y="130" width="40" height="6" fill="#E5E7EB"/>
  <!-- section 3 -->
  <rect x="250" y="216" width="220" height="116" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="262" y="236" font-size="12" font-weight="bold" fill="#3730A3">Review form</text>
  <rect x="368" y="222" width="94" height="20" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="415" y="236" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Completed</text>
  <rect x="262" y="250" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="272" y="260" width="40" height="6" fill="#E5E7EB"/>
  <rect x="330" y="250" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><rect x="340" y="260" width="40" height="6" fill="#E5E7EB"/>
  <!-- not ready -->
  <rect x="490" y="216" width="215" height="116" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="502" y="236" font-size="12" font-weight="bold" fill="#4B5563">Draft: reading list</text>
  <text x="502" y="256" font-size="11" fill="#4B5563">No status yet, not handed off</text>
  <rect x="502" y="268" width="60" height="52" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/>
  <!-- layer name strip -->
  <rect x="20" y="364" width="700" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="34" y="386" font-size="12" font-weight="bold" fill="#92400E">Layer names a developer can read</text>
  <text x="34" y="406" font-size="12" fill="#374151">book-card / title    review-form / submit-button    icons/shelf/add    (not: Frame 128, Rectangle 4, Group 9)</text>
  <!-- markers -->
  <g fill="#4F46E5"><circle cx="205" cy="64" r="11"/><circle cx="480" cy="96" r="11"/><circle cx="480" cy="226" r="11" fill="#B45309"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="205" y="68">1</text><text x="480" y="100">2</text><text x="480" y="230">3</text></g>
  <circle cx="710" cy="378" r="11" fill="#4F46E5"/><text x="710" y="382" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
