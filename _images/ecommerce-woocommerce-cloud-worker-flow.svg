<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Action Scheduler workers on Kubernetes</title>
  <desc id="d">Web pods of the Pocket Coffee store enqueue actions as rows of the wp_actionscheduler_actions table in Amazon RDS but never run them, because the async request runner and the WP-Cron queue runner are switched off. Worker pods of the Deployment pocketcoffee-worker loop over short WP-CLI batches: each batch claims up to ten pending actions, runs them and releases the claim; several workers run side by side as long as the concurrent batches limit is at least the number of replicas. A KEDA operator polls RDS with a MySQL query that counts the pending actions that are due and scales the worker Deployment between one and six replicas through a HorizontalPodAutoscaler. The cron Job pocketcoffee-cron still runs wp cron event run due-now for ordinary WP-Cron events. Actions that throw end as failed, actions whose worker was killed stay in progress until the failure period of 300 seconds and are then marked failed, and a SIGTERM lets the current batch finish before the pod exits.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f2f5f8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4b860"/></marker>
  </defs>
  <rect width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="38" font-size="18" font-weight="bold" fill="#f2f5f8">Who enqueues, who runs, who scales</text>

  <rect x="30" y="64" width="250" height="150" rx="10" fill="#3d5266"/>
  <text x="46" y="90" font-size="14" font-weight="bold" fill="#f4b860">Deployment pocketcoffee-web</text>
  <text x="46" y="114" font-size="12.5" fill="#f2f5f8">checkout, REST, webhooks, admin</text>
  <text x="46" y="136" font-size="12.5" fill="#f2f5f8">as_enqueue_async_action()</text>
  <text x="46" y="158" font-size="12.5" fill="#f2f5f8">async loopback runner: off</text>
  <text x="46" y="180" font-size="12.5" fill="#f2f5f8">WP-Cron queue runner: off</text>
  <text x="46" y="202" font-size="12.5" fill="#9fd3c7">mu-plugin in the image</text>

  <rect x="340" y="64" width="280" height="150" rx="10" fill="#3f6e9a"/>
  <text x="356" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">RDS pocketcoffee-prod</text>
  <text x="356" y="114" font-size="12.5" fill="#f2f5f8">wp_actionscheduler_actions</text>
  <text x="356" y="136" font-size="12.5" fill="#f2f5f8">wp_actionscheduler_claims</text>
  <text x="356" y="158" font-size="12.5" fill="#f2f5f8">wp_actionscheduler_logs</text>
  <text x="356" y="180" font-size="12.5" fill="#f2f5f8">status: pending, in-progress,</text>
  <text x="356" y="198" font-size="12.5" fill="#f2f5f8">complete, failed, canceled</text>

  <rect x="680" y="64" width="250" height="150" rx="10" fill="#33485c"/>
  <text x="696" y="90" font-size="14" font-weight="bold" fill="#f4b860">KEDA operator</text>
  <text x="696" y="114" font-size="12.5" fill="#f2f5f8">ScaledObject, trigger type mysql</text>
  <text x="696" y="136" font-size="12.5" fill="#f2f5f8">polls every 30 s with SELECT COUNT(*)</text>
  <text x="696" y="158" font-size="12.5" fill="#f2f5f8">of pending actions that are due</text>
  <text x="696" y="180" font-size="12.5" fill="#f2f5f8">50 per replica, 1 to 6 replicas</text>
  <text x="696" y="202" font-size="12.5" fill="#9fd3c7">read-only user wc_keda</text>

  <line x1="280" y1="110" x2="338" y2="110" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="284" y="102" font-size="11.5" fill="#f2f5f8">INSERT</text>
  <line x1="680" y1="150" x2="622" y2="150" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="628" y="142" font-size="11.5" fill="#f4b860">COUNT</text>

  <rect x="340" y="290" width="580" height="170" rx="10" fill="#4d7c5a"/>
  <text x="356" y="316" font-size="14" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-worker (1 to 6 pods)</text>
  <rect x="356" y="332" width="170" height="108" rx="8" fill="#2f4a44"/>
  <text x="368" y="354" font-size="12.5" font-weight="bold" fill="#9fd3c7">worker pod</text>
  <text x="368" y="376" font-size="12" fill="#f2f5f8">loop: wp action-scheduler</text>
  <text x="368" y="394" font-size="12" fill="#f2f5f8">run --batch-size=10</text>
  <text x="368" y="412" font-size="12" fill="#f2f5f8">--batches=1</text>
  <text x="368" y="430" font-size="12" fill="#f2f5f8">claim, run, release</text>
  <rect x="540" y="332" width="170" height="108" rx="8" fill="#2f4a44"/>
  <text x="552" y="354" font-size="12.5" font-weight="bold" fill="#9fd3c7">worker pod</text>
  <text x="552" y="376" font-size="12" fill="#f2f5f8">own claim, other actions</text>
  <text x="552" y="394" font-size="12" fill="#f2f5f8">SKIP LOCKED when</text>
  <text x="552" y="412" font-size="12" fill="#f2f5f8">the database supports it</text>
  <rect x="724" y="332" width="182" height="108" rx="8" fill="#2f4a44"/>
  <text x="736" y="354" font-size="12.5" font-weight="bold" fill="#9fd3c7">concurrency limit</text>
  <text x="736" y="376" font-size="11" fill="#f2f5f8">AS_CONCURRENT_BATCHES</text>
  <text x="736" y="394" font-size="12" fill="#f2f5f8">= maxReplicaCount (6),</text>
  <text x="736" y="412" font-size="12" fill="#f2f5f8">else a worker exits with</text>
  <text x="736" y="430" font-size="12" fill="#f2f5f8">too many concurrent batches</text>

  <line x1="440" y1="290" x2="440" y2="216" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="258" font-size="11.5" fill="#f2f5f8">claim, UPDATE status, write log</text>
  <path d="M805 214 L805 290" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="795" y="258" font-size="11.5" fill="#f4b860" text-anchor="end">scales via its HPA</text>

  <rect x="30" y="290" width="270" height="110" rx="10" fill="#3d5266"/>
  <text x="46" y="316" font-size="14" font-weight="bold" fill="#f4b860">CronJob pocketcoffee-cron</text>
  <text x="46" y="340" font-size="12.5" fill="#f2f5f8">wp cron event run --due-now</text>
  <text x="46" y="360" font-size="12.5" fill="#f2f5f8">ordinary WP-Cron events only</text>
  <text x="46" y="380" font-size="12.5" fill="#f2f5f8">concurrencyPolicy: Forbid</text>

  <rect x="30" y="420" width="270" height="110" rx="10" fill="#7a5c3a"/>
  <text x="46" y="446" font-size="14" font-weight="bold" fill="#f2f5f8">Failure paths</text>
  <text x="46" y="468" font-size="12" fill="#f2f5f8">exception: failed, next action runs</text>
  <text x="46" y="486" font-size="12" fill="#f2f5f8">SIGKILL: in-progress, failed after 300 s</text>
  <text x="46" y="504" font-size="12" fill="#f2f5f8">SIGTERM: batch ends, claim released</text>

  <rect x="340" y="480" width="580" height="56" rx="10" fill="#33485c"/>
  <text x="356" y="504" font-size="12.5" fill="#c9b3e6">Monitor: oldest due pending action, failed count, replicas at the maximum.</text>
  <text x="356" y="524" font-size="12.5" fill="#c9b3e6">PodDisruptionBudget maxUnavailable 1; grace period longer than one batch.</text>
</svg>
