<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The four JSP scopes, nested by lifetime</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">Where each attribute lives, how long it lives, and the order in which pageContext.findAttribute and ${name} search them</text>

  <!-- application -->
  <rect x="20" y="62" width="560" height="460" rx="10" fill="#eef3fb" stroke="#2b4c8c" stroke-width="1.8"/>
  <text x="36" y="86" font-size="14" font-weight="bold" fill="#1a2f5a">Application scope (4)</text>
  <text x="36" y="104" font-size="11" fill="#2b4c8c">stored in the ServletContext, the "application" object, applicationScope in EL</text>
  <text x="36" y="120" font-size="11" fill="#2b4c8c">lives until the web application stops; shared by all users and all threads</text>

  <!-- session -->
  <rect x="50" y="136" width="500" height="364" rx="10" fill="#eaf6ec" stroke="#2f7a3c" stroke-width="1.8"/>
  <text x="66" y="160" font-size="14" font-weight="bold" fill="#1f5228">Session scope (3)</text>
  <text x="66" y="178" font-size="11" fill="#2f7a3c">stored in the HttpSession, the "session" object, sessionScope in EL</text>
  <text x="66" y="194" font-size="11" fill="#2f7a3c">lives until timeout or invalidate(); one per client; absent with session="false"</text>

  <!-- request -->
  <rect x="80" y="210" width="440" height="270" rx="10" fill="#fff6e5" stroke="#b36b00" stroke-width="1.8"/>
  <text x="96" y="234" font-size="14" font-weight="bold" fill="#6b4100">Request scope (2)</text>
  <text x="96" y="252" font-size="11" fill="#8a5200">stored in the ServletRequest, the "request" object, requestScope in EL</text>
  <text x="96" y="268" font-size="11" fill="#8a5200">lives until the response is complete; survives forward and include</text>

  <!-- page -->
  <rect x="110" y="284" width="380" height="104" rx="10" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.8"/>
  <text x="126" y="308" font-size="14" font-weight="bold" fill="#5a1a1a">Page scope (1)</text>
  <text x="126" y="326" font-size="11" fill="#8c2b2b">stored in the PageContext, the "pageContext" object, pageScope in EL</text>
  <text x="126" y="342" font-size="11" fill="#8c2b2b">lives for one execution of one page or tag file; not shared with</text>
  <text x="126" y="358" font-size="11" fill="#8c2b2b">jsp:include, jsp:forward or a tag file; shared with an include directive</text>

  <!-- second page inside the same request -->
  <rect x="110" y="400" width="380" height="64" rx="10" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="126" y="424" font-size="13" font-weight="bold" fill="#5a1a1a">Another page scope in the same request</text>
  <text x="126" y="442" font-size="11" fill="#8c2b2b">the target of jsp:include or jsp:forward gets its own PageContext</text>

  <!-- lookup order -->
  <text x="740" y="86" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Lookup order for ${name}</text>
  <text x="740" y="104" font-size="11" fill="#666666" text-anchor="middle">pageContext.findAttribute(name)</text>

  <rect x="640" y="124" width="200" height="50" rx="6" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.4"/>
  <text x="740" y="145" font-size="13" font-weight="bold" fill="#5a1a1a" text-anchor="middle">1. page</text>
  <text x="740" y="162" font-size="11" fill="#8c2b2b" text-anchor="middle">PAGE_SCOPE = 1</text>

  <rect x="640" y="206" width="200" height="50" rx="6" fill="#fff6e5" stroke="#b36b00" stroke-width="1.4"/>
  <text x="740" y="227" font-size="13" font-weight="bold" fill="#6b4100" text-anchor="middle">2. request</text>
  <text x="740" y="244" font-size="11" fill="#8a5200" text-anchor="middle">REQUEST_SCOPE = 2</text>

  <rect x="640" y="288" width="200" height="50" rx="6" fill="#eaf6ec" stroke="#2f7a3c" stroke-width="1.4"/>
  <text x="740" y="309" font-size="13" font-weight="bold" fill="#1f5228" text-anchor="middle">3. session (if valid)</text>
  <text x="740" y="326" font-size="11" fill="#2f7a3c" text-anchor="middle">SESSION_SCOPE = 3</text>

  <rect x="640" y="370" width="200" height="50" rx="6" fill="#eef3fb" stroke="#2b4c8c" stroke-width="1.4"/>
  <text x="740" y="391" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">4. application</text>
  <text x="740" y="408" font-size="11" fill="#2b4c8c" text-anchor="middle">APPLICATION_SCOPE = 4</text>

  <line x1="740" y1="174" x2="740" y2="204" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="256" x2="740" y2="286" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="338" x2="740" y2="368" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="640" y="446" width="200" height="50" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="740" y="467" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">not found anywhere</text>
  <text x="740" y="484" font-size="11" fill="#444444" text-anchor="middle">null, printed as an empty string</text>
  <line x1="740" y1="420" x2="740" y2="444" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
