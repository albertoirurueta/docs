<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="iq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="iqa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="iqw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="iqg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">An indexed quad stores 4 vertices and 6 indices instead of 6 vertices</text>
<rect x="30" y="50" width="330" height="235" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="400" y="50" width="330" height="235" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="195" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Non-indexed: 6 vertices x 32 B = 192 B</text>
<text x="565" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Indexed: 4 x 32 B + 6 x 2 B = 140 B</text>
<polygon points="70,210 180,210 180,100 70,100" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="70.0" y1="210.0" x2="180.0" y2="100.0" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="70.0" cy="210.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="70" y="214" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">0</text>
<circle cx="180.0" cy="210.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="180" y="214" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">1</text>
<circle cx="180.0" cy="100.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="180" y="104" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">2</text>
<circle cx="70.0" cy="100.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="70" y="104" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">3</text>
<text x="260" y="130" text-anchor="start" font-size="12" fill="#374151">v0 v1 v2</text>
<text x="260" y="150" text-anchor="start" font-size="12" fill="#374151">v0 v2 v3</text>
<text x="260" y="176" text-anchor="start" font-size="11" fill="#92400E">v0 and v2 are stored</text>
<text x="260" y="192" text-anchor="start" font-size="11" fill="#92400E">twice (same data)</text>
<polygon points="440,210 550,210 550,100 440,100" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="440.0" y1="210.0" x2="550.0" y2="100.0" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="440.0" cy="210.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="440" y="214" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">0</text>
<circle cx="550.0" cy="210.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="550" y="214" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">1</text>
<circle cx="550.0" cy="100.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="550" y="104" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">2</text>
<circle cx="440.0" cy="100.0" r="10" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="440" y="104" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">3</text>
<text x="600" y="128" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">index buffer (16-bit)</text>
<text x="600" y="150" text-anchor="start" font-size="13" fill="#3730A3" font-weight="bold">0 1 2  0 2 3</text>
<text x="600" y="176" text-anchor="start" font-size="11" fill="#047857">vertex buffer holds</text>
<text x="600" y="192" text-anchor="start" font-size="11" fill="#047857">only v0..v3</text>
<text x="380" y="310" text-anchor="middle" font-size="11" fill="#374151">Real meshes share each vertex between about six triangles, so indexing cuts memory and lets the GPU reuse transformed vertices.</text>
</svg>
