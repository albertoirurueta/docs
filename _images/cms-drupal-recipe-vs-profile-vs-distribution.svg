<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Recipe, install profile and distribution compared</title>
  <desc id="d">Three columns compare a recipe, an install profile and a distribution by when they run, what they own and whether they have an update path.</desc>
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <g font-size="14" fill="#1f2933">
    <rect x="20" y="20" width="270" height="340" rx="10" fill="#eaf4ee" stroke="#2f7d4f" stroke-width="2"/>
    <text x="155" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d5a38">Recipe</text>
    <text x="155" y="76" text-anchor="middle" font-size="13">meridian_events</text>
    <text x="40" y="112" font-weight="bold">When it runs</text>
    <text x="40" y="132">any time, on an installed site</text>
    <text x="40" y="164" font-weight="bold">What it contains</text>
    <text x="40" y="184">recipe.yml, config, content</text>
    <text x="40" y="204">no PHP code, no hooks</text>
    <text x="40" y="236" font-weight="bold">After it is applied</text>
    <text x="40" y="256">ordinary site configuration</text>
    <text x="40" y="276">the recipe is no longer tracked</text>
    <text x="40" y="308" font-weight="bold">Update path</text>
    <text x="40" y="328">none: apply once</text>

    <rect x="315" y="20" width="270" height="340" rx="10" fill="#eef1fb" stroke="#3b53a4" stroke-width="2"/>
    <text x="450" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#27377a">Install profile</text>
    <text x="450" y="76" text-anchor="middle" font-size="13">standard, minimal</text>
    <text x="335" y="112" font-weight="bold">When it runs</text>
    <text x="335" y="132">during site installation only</text>
    <text x="335" y="164" font-weight="bold">What it contains</text>
    <text x="335" y="184">info.yml, config, optional code</text>
    <text x="335" y="204">hooks, install tasks</text>
    <text x="335" y="236" font-weight="bold">After it is installed</text>
    <text x="335" y="256">stays enabled as an extension</text>
    <text x="335" y="276">cannot be changed or removed</text>
    <text x="335" y="308" font-weight="bold">Update path</text>
    <text x="335" y="328">update hooks of the profile</text>

    <rect x="610" y="20" width="270" height="340" rx="10" fill="#fdf3e3" stroke="#b36b00" stroke-width="2"/>
    <text x="745" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a4800">Distribution</text>
    <text x="745" y="76" text-anchor="middle" font-size="13">a packaged starting point</text>
    <text x="630" y="112" font-weight="bold">When it runs</text>
    <text x="630" y="132">at project creation and install</text>
    <text x="630" y="164" font-weight="bold">What it contains</text>
    <text x="630" y="184">composer.json, core, contrib,</text>
    <text x="630" y="204">a profile and/or recipes</text>
    <text x="630" y="236" font-weight="bold">After it is installed</text>
    <text x="630" y="256">the site owns its composer.json</text>
    <text x="630" y="276">updates come from Composer</text>
    <text x="630" y="308" font-weight="bold">Update path</text>
    <text x="630" y="328">Composer and update hooks</text>
  </g>
</svg>
