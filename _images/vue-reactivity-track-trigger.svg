<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <defs>
    <marker id="rtt-b" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="rtt-o" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="380" y="30" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Track on read, trigger on write</text>

  <!-- Render effect box -->
  <rect x="40" y="150" width="200" height="110" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="140" y="176" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Component render effect</text>
  <text x="140" y="200" font-size="11" fill="#1c4b73" text-anchor="middle">runs the render function,</text>
  <text x="140" y="216" font-size="11" fill="#1c4b73" text-anchor="middle">reading reactive state</text>
  <text x="140" y="240" font-size="10.5" fill="#666666" text-anchor="middle">(also: computed, watch)</text>

  <!-- Reactive state box -->
  <rect x="290" y="42" width="210" height="106" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="395" y="65" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Reactive state</text>
  <g font-family="'Courier New', monospace" font-size="11" fill="#222222">
    <text x="304" y="88">count = ref(0)</text>
    <text x="304" y="106">state = reactive({ ... })</text>
  </g>
  <text x="395" y="132" font-size="10" fill="#666666" text-anchor="middle">Proxy traps / ref get value + set value</text>

  <!-- Dep map box -->
  <rect x="545" y="145" width="195" height="120" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="642" y="168" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Dependency map</text>
  <g font-family="'Courier New', monospace" font-size="9.5" fill="#1c4b73">
    <text x="559" y="190">target &#8594; key &#8594; Set&lt;effect&gt;</text>
    <text x="559" y="212">count .value  &#8594; [ render ]</text>
    <text x="559" y="230">state .count  &#8594; [ render ]</text>
  </g>
  <text x="642" y="252" font-size="10" fill="#666666" text-anchor="middle">each key remembers its readers</text>

  <!-- Mutation box -->
  <rect x="290" y="300" width="210" height="88" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="2"/>
  <text x="395" y="323" font-size="12.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">Mutation</text>
  <g font-family="'Courier New', monospace" font-size="11" fill="#222222">
    <text x="316" y="347">count.value++</text>
    <text x="316" y="365">state.count = 5</text>
  </g>

  <!-- 1. read: render effect -> state -->
  <path d="M238,178 C262,150 275,132 292,118" fill="none" stroke="#2f6fa8" stroke-width="2.2" marker-end="url(#rtt-b)"/>
  <text x="250" y="140" font-size="11" font-weight="bold" fill="#2f6fa8">1. read</text>

  <!-- 2. track: state -> dep map -->
  <path d="M500,104 C520,112 532,128 545,150" fill="none" stroke="#2f6fa8" stroke-width="2.2" marker-end="url(#rtt-b)"/>
  <text x="512" y="120" font-size="11" font-weight="bold" fill="#2f6fa8">2. track dep</text>

  <!-- 3. write: mutation -> dep map -->
  <path d="M500,338 C525,330 536,300 546,262" fill="none" stroke="#c25a1d" stroke-width="2.2" marker-end="url(#rtt-o)"/>
  <text x="505" y="322" font-size="11" font-weight="bold" fill="#c25a1d">3. write</text>

  <!-- 4. trigger: dep map -> render effect -->
  <path d="M543,232 C420,270 320,270 242,238" fill="none" stroke="#c25a1d" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#rtt-o)"/>
  <text x="392" y="262" font-size="11" font-weight="bold" fill="#c25a1d" text-anchor="middle">4. trigger &#8594; re-run only the dependent effects</text>

  <text x="380" y="414" font-size="11.5" fill="#444444" text-anchor="middle">Reading records the effect against that key; writing looks the key up and re-runs just those effects.</text>
</svg>
