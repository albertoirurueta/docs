<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="360" fill="#ffffff"/>

  <text x="370" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Structural typing: if the shape matches, the type fits</text>

  <!-- Point type -->
  <rect x="80" y="72" width="200" height="110" fill="none" stroke="#999999" stroke-width="1.4"/>
  <text x="180" y="95" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">type Point</text>
  <line x1="80" y1="104" x2="280" y2="104" stroke="#999999" stroke-width="1"/>
  <g font-family="'Courier New', monospace" font-size="13" fill="#222222">
    <text x="100" y="132">x: number</text>
    <text x="100" y="158">y: number</text>
  </g>

  <!-- Vec2 type -->
  <rect x="460" y="72" width="200" height="110" fill="none" stroke="#999999" stroke-width="1.4"/>
  <text x="560" y="95" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">type Vec2</text>
  <line x1="460" y1="104" x2="660" y2="104" stroke="#999999" stroke-width="1"/>
  <g font-family="'Courier New', monospace" font-size="13" fill="#222222">
    <text x="480" y="132">x: number</text>
    <text x="480" y="158">y: number</text>
  </g>

  <!-- bidirectional assignable arrow -->
  <line x1="302" y1="127" x2="438" y2="127" stroke="#1c4b73" stroke-width="2"/>
  <path d="M288,127 l14,-7 v14 z" fill="#1c4b73"/>
  <path d="M452,127 l-14,-7 v14 z" fill="#1c4b73"/>
  <text x="370" y="118" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">assignable</text>
  <text x="370" y="148" font-size="11.5" fill="#444444" text-anchor="middle">both directions</text>

  <!-- nominal comparison, crossed out -->
  <text x="370" y="224" font-size="12.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Under nominal typing (branded types, Java, C#) the declared names differ, so:</text>

  <g font-family="'Courier New', monospace" font-size="13" fill="#666666">
    <text x="180" y="284" text-anchor="middle">Point</text>
    <text x="560" y="284" text-anchor="middle">Vec2</text>
  </g>
  <line x1="239" y1="278" x2="501" y2="278" stroke="#999999" stroke-width="2"/>
  <path d="M225,278 l14,-7 v14 z" fill="#999999"/>
  <path d="M515,278 l-14,-7 v14 z" fill="#999999"/>
  <g stroke="#8a3d10" stroke-width="2.6">
    <line x1="352" y1="260" x2="388" y2="296"/>
    <line x1="388" y1="260" x2="352" y2="296"/>
  </g>
  <text x="370" y="322" font-size="11.5" fill="#666666" text-anchor="middle">not assignable &#8212; TypeScript does not do this by default; shape is all that matters</text>
</svg>
