<svg viewBox="0 0 760 456" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One Lucene core, three servers on top, your application above</text>
  <text x="380" y="44" font-size="11.5" fill="#666666" text-anchor="middle">Embed the library in your JVM, or talk HTTP to a server that embeds it for you</text>

  <!-- Application layer -->
  <rect x="40" y="58" width="680" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="80" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Your application</text>
  <text x="380" y="96" font-size="10.5" fill="#666666" text-anchor="middle">a JVM service (embed), or any language (HTTP)</text>

  <!-- path labels -->
  <text x="90" y="122" font-size="10" fill="#2f5424" text-anchor="middle">embed</text>
  <text x="425" y="122" font-size="10" fill="#1c4b73" text-anchor="middle">HTTP + JSON</text>

  <!-- embed arrow: application straight down to the Lucene core -->
  <path d="M90,126 L90,294" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="84,292 96,292 90,300" fill="#2f5424"/>
  <text x="76" y="212" font-size="9.5" fill="#2f5424" text-anchor="middle" transform="rotate(-90 76 212)">lucene-core, in-process</text>

  <!-- HTTP arrows: application to each server -->
  <path d="M218,104 L218,164" stroke="#999999" stroke-width="1.4"/>
  <polygon points="212,162 224,162 218,170" fill="#999999"/>
  <path d="M425,104 L425,164" stroke="#999999" stroke-width="1.4"/>
  <polygon points="419,162 431,162 425,170" fill="#999999"/>
  <path d="M632,104 L632,164" stroke="#999999" stroke-width="1.4"/>
  <polygon points="626,162 638,162 632,170" fill="#999999"/>

  <!-- Server boxes -->
  <rect x="130" y="170" width="176" height="104" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="218" y="192" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Apache Solr</text>
  <text x="218" y="212" font-size="9.5" fill="#666666" text-anchor="middle">HTTP + request handlers</text>
  <text x="218" y="228" font-size="9.5" fill="#666666" text-anchor="middle">SolrCloud + ZooKeeper</text>
  <text x="218" y="244" font-size="9.5" fill="#666666" text-anchor="middle">faceting, LTR, streaming</text>
  <text x="218" y="262" font-size="9.5" fill="#2f5424" text-anchor="middle">Apache-2.0</text>

  <rect x="337" y="170" width="176" height="104" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="425" y="192" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Elasticsearch</text>
  <text x="425" y="212" font-size="9.5" fill="#666666" text-anchor="middle">REST + JSON</text>
  <text x="425" y="228" font-size="9.5" fill="#666666" text-anchor="middle">built-in clustering, ILM</text>
  <text x="425" y="244" font-size="9.5" fill="#666666" text-anchor="middle">ingest, security, Kibana</text>
  <text x="425" y="262" font-size="9.5" fill="#666666" text-anchor="middle">SSPL / Elastic / AGPL</text>

  <rect x="544" y="170" width="176" height="104" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="632" y="192" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">OpenSearch</text>
  <text x="632" y="212" font-size="9.5" fill="#666666" text-anchor="middle">REST + JSON</text>
  <text x="632" y="228" font-size="9.5" fill="#666666" text-anchor="middle">built-in clustering, ISM</text>
  <text x="632" y="244" font-size="9.5" fill="#666666" text-anchor="middle">Dashboards, security</text>
  <text x="632" y="262" font-size="9.5" fill="#2f5424" text-anchor="middle">Apache-2.0 (ES 7.10 fork)</text>

  <!-- server -&gt; lucene arrows -->
  <path d="M218,274 L218,294" stroke="#999999" stroke-width="1.4"/>
  <polygon points="212,292 224,292 218,300" fill="#999999"/>
  <path d="M425,274 L425,294" stroke="#999999" stroke-width="1.4"/>
  <polygon points="419,292 431,292 425,300" fill="#999999"/>
  <path d="M632,274 L632,294" stroke="#999999" stroke-width="1.4"/>
  <polygon points="626,292 638,292 632,300" fill="#999999"/>

  <!-- Lucene core -->
  <rect x="40" y="300" width="680" height="110" fill="#ffffff" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="380" y="326" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Apache Lucene core &#8212; lucene-core (Java library)</text>
  <text x="380" y="350" font-size="10.5" fill="#666666" text-anchor="middle">inverted index &#183; analysis chain &#183; BooleanQuery / PhraseQuery / points / KNN vectors</text>
  <text x="380" y="368" font-size="10.5" fill="#666666" text-anchor="middle">BM25Similarity &#183; DocValues (sort &amp; facet) &#183; codecs &#183; segment merge &#183; near-real-time readers</text>
  <text x="380" y="394" font-size="10" fill="#1c4b73" text-anchor="middle">Solr, Elasticsearch and OpenSearch each embed this exact library</text>

  <text x="380" y="432" font-size="10" fill="#999999" text-anchor="middle">Every concept here &#8212; fields, analysis, queries, scoring, merging &#8212; maps one layer up into each server's own vocabulary</text>
</svg>
