<svg viewBox="0 0 940 374" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Bit shifts and rotations of an 8-bit integer: shiftl, shiftr, shifta and ishftc</title>
<rect x="0" y="0" width="940" height="374" fill="#ffffff"/>
<text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Shifts and rotations of one 8-bit value</text>
<text x="470" y="48" font-size="12" fill="#666666" text-anchor="middle">bit 7 (the sign bit) is on the left, bit 0 on the right; orange cells are bits that entered, blue cells are ones that moved or stayed</text>
<text x="178" y="91" font-size="14" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="end">b</text>
