<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where UI project files end up in the site</title>
  <desc id="d">Files in the UI project source folder are copied into the UI bundle, and Antora publishes them under the UI output directory, at the site root when ui.yml lists them as static files, or not at all for templates and the descriptor.</desc>
  <rect width="800" height="380" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">UI project (src/)</text>
  <text x="300" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">UI bundle (ZIP)</text>
  <text x="540" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">Published site</text>
  <rect x="20" y="44" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="68" font-size="12" fill="#f9fafb">css/ img/ js/ and font/ (generated)</text>
  <line x1="270" y1="63" x2="296" y2="63" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="44" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="68" font-size="12" fill="#f9fafb">css/ font/ img/ js/</text>
  <line x1="500" y1="63" x2="536" y2="63" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="44" width="240" height="38" rx="6" fill="#2563eb"/><text x="550" y="68" font-size="12" fill="#ffffff">_/css  _/font  _/img  _/js</text>
  <rect x="20" y="99" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="123" font-size="12" fill="#f9fafb">static/favicon.svg (listed in ui.yml)</text>
  <line x1="270" y1="118" x2="296" y2="118" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="99" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="123" font-size="12" fill="#f9fafb">favicon.svg</text>
  <line x1="500" y1="118" x2="536" y2="118" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="99" width="240" height="38" rx="6" fill="#7c3aed"/><text x="550" y="123" font-size="12" fill="#ffffff">favicon.svg  (site root)</text>
  <rect x="20" y="154" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="178" font-size="12" fill="#f9fafb">static/about/notice.txt (about/* listed)</text>
  <line x1="270" y1="173" x2="296" y2="173" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="154" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="178" font-size="12" fill="#f9fafb">about/notice.txt</text>
  <line x1="500" y1="173" x2="536" y2="173" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="154" width="240" height="38" rx="6" fill="#7c3aed"/><text x="550" y="178" font-size="12" fill="#ffffff">about/notice.txt  (site root)</text>
  <rect x="20" y="209" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="233" font-size="12" fill="#f9fafb">static/robots.txt (not listed)</text>
  <line x1="270" y1="228" x2="296" y2="228" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="209" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="233" font-size="12" fill="#f9fafb">robots.txt</text>
  <line x1="500" y1="228" x2="536" y2="228" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="209" width="240" height="38" rx="6" fill="#b45309"/><text x="550" y="233" font-size="12" fill="#ffffff">_/robots.txt</text>
  <rect x="20" y="264" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="288" font-size="12" fill="#f9fafb">layouts/ partials/ helpers/</text>
  <line x1="270" y1="283" x2="296" y2="283" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="264" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="288" font-size="12" fill="#f9fafb">layouts/ partials/ helpers/</text>
  <line x1="500" y1="283" x2="536" y2="283" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="264" width="240" height="38" rx="6" fill="#4b5563"/><text x="550" y="288" font-size="12" fill="#ffffff">not published</text>
  <rect x="20" y="319" width="250" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="30" y="343" font-size="12" fill="#f9fafb">ui.yml (copied from src/)</text>
  <line x1="270" y1="338" x2="296" y2="338" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="319" width="200" height="38" rx="6" fill="#374151" stroke="#9ca3af"/><text x="310" y="343" font-size="12" fill="#f9fafb">ui.yml</text>
  <line x1="500" y1="338" x2="536" y2="338" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="319" width="240" height="38" rx="6" fill="#4b5563"/><text x="550" y="343" font-size="12" fill="#ffffff">not published</text>
</svg>
