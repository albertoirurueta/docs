<text x="730.0" y="497.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">runtimeElements</text>
<text x="832" y="130" font-size="11.5" fill="#333333">javac --class-path</text>
<text x="832" y="224" font-size="11.5" fill="#333333">java --class-path</text>
<text x="832" y="402" font-size="11.5" fill="#333333">consumers compile</text>
<text x="832" y="416" font-size="11.5" fill="#333333">against this</text>
<text x="832" y="492" font-size="11.5" fill="#333333">consumers run</text>
<text x="832" y="506" font-size="11.5" fill="#333333">against this</text>
<rect x="320" y="300" width="180" height="44" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="410.0" y="318" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">annotationProcessor</text>
<text x="410.0" y="334" font-size="10.5" fill="#555555" text-anchor="middle">declarable and resolvable</text>
<text x="330" y="362" font-size="11.5" fill="#333333">javac --processor-path</text>
<text x="500" y="552" font-size="12" fill="#444444" text-anchor="middle">The test source set repeats the pattern: testImplementation extends implementation, testCompileOnly extends compileOnlyApi, testRuntimeOnly extends runtimeOnly;</text>
<text x="500" y="570" font-size="12" fill="#444444" text-anchor="middle">testCompileClasspath and testRuntimeClasspath resolve them. api and compileOnlyApi exist only with the java-library plugin.</text>
