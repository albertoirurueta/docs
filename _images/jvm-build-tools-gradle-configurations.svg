<text x="386" y="74" font-size="12" fill="#333333">resolvable: resolves to a classpath</text>
<rect x="680" y="62" width="18" height="14" rx="3" fill="#f1eaf8" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="706" y="74" font-size="12" fill="#333333">consumable: offered to other projects</text>
