<text x="120.0" y="495.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">runtimeOnly</text>
<rect x="320" y="110" width="180" height="40" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="410.0" y="135.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">compileOnly</text>
