<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<text x="500" y="26" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">The configurations of a Java library project (Gradle 9.8.1, main source set)</text>
<text x="500" y="46" font-size="12" fill="#666666" text-anchor="middle">An arrow from A to B means that B extends A: whatever is declared on A also reaches B.</text>
<rect x="40" y="62" width="18" height="14" rx="3" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="66" y="74" font-size="12" fill="#333333">declarable: you declare dependencies here</text>
