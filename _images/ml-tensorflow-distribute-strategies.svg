<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Choosing a tf.distribute strategy</title>
<desc id="d">One accelerator needs no strategy, several GPUs in one machine use MirroredStrategy, several machines use MultiWorkerMirroredStrategy, TPUs use TPUStrategy, and very large asynchronous setups use ParameterServerStrategy.</desc>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Which tf.distribute strategy?</text>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">
<rect x="30" y="60" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="130" y="90">1 device: no strategy</text>
<rect x="260" y="60" width="200" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="82">N GPUs, 1 machine</text><text x="360" y="100">MirroredStrategy</text>
<rect x="490" y="60" width="200" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="590" y="82">N machines (sync)</text><text x="590" y="100">MultiWorkerMirrored</text>
<rect x="30" y="150" width="200" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="130" y="172">Cloud TPU</text><text x="130" y="190">TPUStrategy</text>
<rect x="260" y="150" width="200" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="360" y="172">many workers (async)</text><text x="360" y="190">ParameterServer*</text>
<rect x="490" y="150" width="200" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="590" y="172">sharded model, JAX</text><text x="590" y="190">keras.distribution</text>
</g>
<text x="360" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Synchronous strategies all-reduce gradients each step; the global batch is split across replicas.</text>
<text x="360" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">* experimental. Create the model and optimizer inside strategy.scope().</text>
</svg>
