<svg viewBox="0 0 830 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A closure capturing a local variable: because a lambda references the local `count`, the compiler moves it out of the stack frame into a heap-allocated display class; the returned delegate holds a reference to that same display class, so each call increments one shared variable and the variable outlives the method that declared it.</title>
  <rect x="0" y="0" width="830" height="430" fill="#ffffff"/>

  <text x="415" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Closure capture: the local is hoisted onto the heap</text>
  <text x="415" y="45" font-size="11" fill="#666666" text-anchor="middle">a captured variable is shared by reference -- not copied -- and outlives its stack frame</text>

  <!-- source column -->
  <rect x="24" y="70" width="300" height="200" rx="8" fill="#f7f9fc" stroke="#8fa4bd" stroke-width="1.3"/>
  <text x="174" y="92" font-size="13" font-weight="bold" fill="#31465e" text-anchor="middle">What you write</text>
  <text x="40" y="118" font-size="11.5" fill="#20303f" font-family="monospace">Func&lt;int&gt; MakeCounter()</text>
  <text x="40" y="136" font-size="11.5" fill="#20303f" font-family="monospace">{</text>
  <text x="40" y="154" font-size="11.5" fill="#b03030" font-family="monospace">    int count = 0;</text>
  <text x="40" y="172" font-size="11.5" fill="#20303f" font-family="monospace">    return () =&gt; </text>
  <text x="150" y="172" font-size="11.5" fill="#b03030" font-family="monospace">++count</text>
  <text x="216" y="172" font-size="11.5" fill="#20303f" font-family="monospace">;</text>
  <text x="40" y="190" font-size="11.5" fill="#20303f" font-family="monospace">}</text>
  <text x="40" y="222" font-size="10.5" fill="#666666">`count` is referenced by the lambda,</text>
  <text x="40" y="238" font-size="10.5" fill="#666666">so it cannot live in the stack frame --</text>
  <text x="40" y="254" font-size="10.5" fill="#666666">the frame is gone once the method returns.</text>

  <!-- arrow source -> compiled -->
  <path d="M 330 170 L 372 170" stroke="#5a6b7d" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="351" y="161" font-size="10" fill="#5a6b7d" text-anchor="middle">compiles to</text>

  <!-- stack column -->
  <rect x="382" y="70" width="190" height="130" rx="8" fill="#fdf6ec" stroke="#c8a46a" stroke-width="1.3"/>
  <text x="477" y="92" font-size="13" font-weight="bold" fill="#7a5a20" text-anchor="middle">Stack frame</text>
  <text x="477" y="110" font-size="10.5" fill="#8a6a30" text-anchor="middle">MakeCounter()</text>
  <rect x="398" y="122" width="158" height="30" rx="4" fill="#ffffff" stroke="#c8a46a" stroke-width="1.1"/>
  <text x="477" y="141" font-size="11" fill="#20303f" text-anchor="middle" font-family="monospace">display ---------&gt;</text>
  <text x="477" y="172" font-size="10" fill="#8a6a30" text-anchor="middle">the frame holds only a reference;</text>
  <text x="477" y="186" font-size="10" fill="#8a6a30" text-anchor="middle">it disappears when the method returns</text>

  <!-- heap column -->
  <rect x="600" y="70" width="206" height="200" rx="8" fill="#eef6f0" stroke="#6fa383" stroke-width="1.3"/>
  <text x="703" y="92" font-size="13" font-weight="bold" fill="#2f5d43" text-anchor="middle">Heap</text>

  <rect x="616" y="106" width="174" height="76" rx="6" fill="#ffffff" stroke="#6fa383" stroke-width="1.2"/>
  <text x="703" y="124" font-size="11" font-weight="bold" fill="#2f5d43" text-anchor="middle">display class</text>
  <text x="703" y="139" font-size="9.5" fill="#5a7f68" text-anchor="middle">(compiler-generated)</text>
  <rect x="632" y="148" width="142" height="24" rx="4" fill="#fdeaea" stroke="#b03030" stroke-width="1.1"/>
  <text x="703" y="164" font-size="11" fill="#b03030" text-anchor="middle" font-family="monospace">int count</text>

  <rect x="616" y="200" width="174" height="56" rx="6" fill="#ffffff" stroke="#6fa383" stroke-width="1.2"/>
  <text x="703" y="218" font-size="11" font-weight="bold" fill="#2f5d43" text-anchor="middle">returned delegate</text>
  <text x="703" y="235" font-size="9.5" fill="#5a7f68" text-anchor="middle">Target -&gt; display class</text>
  <text x="703" y="249" font-size="9.5" fill="#5a7f68" text-anchor="middle">Method -&gt; the lambda body</text>

  <!-- stack ref to display class -->
  <path d="M 556 137 L 616 137" stroke="#5a6b7d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- delegate ref to display class -->
  <path d="M 640 200 L 640 182" stroke="#5a6b7d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- timeline of calls -->
  <rect x="24" y="292" width="782" height="112" rx="8" fill="#f6f6f9" stroke="#9aa0b5" stroke-width="1.3"/>
  <text x="415" y="314" font-size="13" font-weight="bold" fill="#3d4360" text-anchor="middle">Calling the returned delegate mutates the one shared variable</text>

  <rect x="70" y="330" width="150" height="52" rx="6" fill="#ffffff" stroke="#9aa0b5" stroke-width="1.1"/>
  <text x="145" y="350" font-size="11" fill="#20303f" text-anchor="middle" font-family="monospace">next()</text>
  <text x="145" y="369" font-size="11" fill="#b03030" text-anchor="middle" font-family="monospace">count: 0 -&gt; 1</text>

  <rect x="270" y="330" width="150" height="52" rx="6" fill="#ffffff" stroke="#9aa0b5" stroke-width="1.1"/>
  <text x="345" y="350" font-size="11" fill="#20303f" text-anchor="middle" font-family="monospace">next()</text>
  <text x="345" y="369" font-size="11" fill="#b03030" text-anchor="middle" font-family="monospace">count: 1 -&gt; 2</text>

  <rect x="470" y="330" width="150" height="52" rx="6" fill="#ffffff" stroke="#9aa0b5" stroke-width="1.1"/>
  <text x="545" y="350" font-size="11" fill="#20303f" text-anchor="middle" font-family="monospace">next()</text>
  <text x="545" y="369" font-size="11" fill="#b03030" text-anchor="middle" font-family="monospace">count: 2 -&gt; 3</text>

  <path d="M 220 356 L 264 356" stroke="#5a6b7d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 356 L 464 356" stroke="#5a6b7d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="715" y="350" font-size="10" fill="#3d4360" text-anchor="middle">a second MakeCounter()</text>
  <text x="715" y="365" font-size="10" fill="#3d4360" text-anchor="middle">makes a new display class,</text>
  <text x="715" y="380" font-size="10" fill="#3d4360" text-anchor="middle">so its count starts at 0 again</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
</svg>
