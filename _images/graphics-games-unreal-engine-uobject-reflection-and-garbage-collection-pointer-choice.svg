<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which pointer for which job</text>
<rect x="30" y="48" width="250" height="28" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="155.0" y="67" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Job</text>
<rect x="290" y="48" width="215" height="28" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="397.5" y="67" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Type</text>
<rect x="515" y="48" width="215" height="28" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="622.5" y="67" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Effect on garbage collection</text>
<rect x="30" y="86" width="250" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="155.0" y="111" text-anchor="middle" font-size="12" fill="#1F2937">Local variable or function parameter</text>
<rect x="290" y="86" width="215" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="397.5" y="111" text-anchor="middle" font-size="12" fill="#1F2937">T*</text>
<rect x="515" y="86" width="215" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="622.5" y="111" text-anchor="middle" font-size="12" fill="#1F2937">None. Never kept across frames</text>
<rect x="30" y="133" width="250" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="155.0" y="158" text-anchor="middle" font-size="12" fill="#1F2937">Member that must keep an object alive</text>
<rect x="290" y="133" width="215" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="397.5" y="158" text-anchor="middle" font-size="12" fill="#1F2937">UPROPERTY TObjectPtr&lt;T&gt;</text>
<rect x="515" y="133" width="215" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="622.5" y="158" text-anchor="middle" font-size="12" fill="#1F2937">Strong reference</text>
<rect x="30" y="180" width="250" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="155.0" y="205" text-anchor="middle" font-size="12" fill="#1F2937">Cache that must not keep it alive</text>
<rect x="290" y="180" width="215" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="397.5" y="205" text-anchor="middle" font-size="12" fill="#1F2937">TWeakObjectPtr&lt;T&gt;</text>
<rect x="515" y="180" width="215" height="40" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="622.5" y="205" text-anchor="middle" font-size="12" fill="#1F2937">Nulls itself when collected</text>
<rect x="30" y="227" width="250" height="40" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="155.0" y="252" text-anchor="middle" font-size="12" fill="#1F2937">Asset to load on demand</text>
<rect x="290" y="227" width="215" height="40" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="397.5" y="252" text-anchor="middle" font-size="12" fill="#1F2937">TSoftObjectPtr&lt;T&gt;</text>
<rect x="515" y="227" width="215" height="40" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="622.5" y="252" text-anchor="middle" font-size="12" fill="#1F2937">Path only, load before use</text>
<rect x="30" y="274" width="250" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="155.0" y="299" text-anchor="middle" font-size="12" fill="#1F2937">Class picked in the editor</text>
<rect x="290" y="274" width="215" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="397.5" y="299" text-anchor="middle" font-size="12" fill="#1F2937">TSubclassOf&lt;T&gt;</text>
<rect x="515" y="274" width="215" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="622.5" y="299" text-anchor="middle" font-size="12" fill="#1F2937">Strong reference to the UClass</text>
<rect x="30" y="321" width="250" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="155.0" y="346" text-anchor="middle" font-size="12" fill="#1F2937">Plain C++ type holds a UObject</text>
<rect x="290" y="321" width="215" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="397.5" y="346" text-anchor="middle" font-size="12" fill="#1F2937">TStrongObjectPtr&lt;T&gt;</text>
<rect x="515" y="321" width="215" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="622.5" y="346" text-anchor="middle" font-size="12" fill="#1F2937">Strong, use with care</text>
<rect x="30" y="368" width="250" height="40" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="155.0" y="393" text-anchor="middle" font-size="12" fill="#1F2937">Plain C++ object, not a UObject</text>
<rect x="290" y="368" width="215" height="40" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="397.5" y="393" text-anchor="middle" font-size="12" fill="#1F2937">TSharedPtr / TUniquePtr</text>
<rect x="515" y="368" width="215" height="40" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="622.5" y="393" text-anchor="middle" font-size="12" fill="#1F2937">Not GC: reference counting</text>
<text x="380" y="422" text-anchor="middle" font-size="11" fill="#374151">UHT scans UPROPERTY fields; a pointer without UPROPERTY is never seen by the collector.</text>
</svg>
