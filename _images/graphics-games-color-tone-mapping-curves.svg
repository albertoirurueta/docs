<text x="526" y="146" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ACES filmic fit</text>
<rect x="480" y="180" width="260" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="494" y="204" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Clamp loses everything above 1.0:</text>
<text x="494" y="222" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">bright highlights become flat white.</text>
<text x="494" y="240" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Reinhard keeps all values but is</text>
<text x="494" y="258" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">low-contrast and washes out colour.</text>
<text x="494" y="276" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ACES-style curves add an S-shape:</text>
<text x="494" y="294" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">crushed shadows, rolled-off highlights.</text>
<text x="494" y="312" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Khronos PBR Neutral instead keeps</text>
<text x="494" y="330" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">base colours close to unchanged.</text>
<text x="380" y="428" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Curves drawn from the formulas on the page; the ACES line is the widely used Narkowicz fit</text>
</svg>
