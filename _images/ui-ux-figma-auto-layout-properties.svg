<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of an auto layout frame: a book card</text>
  <rect x="60" y="56" width="220" height="250" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="84" y="80" width="172" height="100" rx="6" fill="#E5E7EB"/><rect x="84" y="196" width="130" height="14" rx="3" fill="#9CA3AF"/><rect x="84" y="226" width="90" height="12" rx="3" fill="#D1D5DB"/><rect x="84" y="258" width="172" height="30" rx="6" fill="#4F46E5"/>
  <g stroke="#B45309" stroke-width="1.5" stroke-dasharray="3 3" fill="#FEF3C7" fill-opacity="0.7"><rect x="60" y="56" width="220" height="24"/><rect x="60" y="56" width="24" height="250"/><rect x="84" y="180" width="172" height="16"/><rect x="84" y="210" width="172" height="16"/><rect x="84" y="238" width="172" height="20"/></g>
  <g fill="#4F46E5"><circle cx="330" cy="68" r="11"/><circle cx="330" cy="188" r="11"/><circle cx="330" cy="248" r="11"/><circle cx="330" cy="130" r="11"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="330" y="72">1</text><text x="330" y="192">2</text><text x="330" y="252">3</text><text x="330" y="134">4</text></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M319,68 L282,68" marker-end="url(#ah)"/><path d="M319,188 L258,188" marker-end="url(#ah)"/><path d="M319,248 L258,248" marker-end="url(#ah)"/><path d="M319,130 L258,130" marker-end="url(#ah)"/></g>
  <g font-size="13" fill="#374151"><text x="360" y="73"><tspan font-weight="bold">1 Padding</tspan>: space between the frame edge and its children</text><text x="360" y="133"><tspan font-weight="bold">4 Child</tspan>: the cover sets Fill container for width</text><text x="360" y="193"><tspan font-weight="bold">2 Gap</tspan>: space between children (amber strips)</text><text x="360" y="253"><tspan font-weight="bold">3 Direction</tspan>: vertical, children stack top to bottom</text></g>
  <text x="360" y="300" font-size="12" fill="#374151">Alignment decides where children sit on the free space of each axis.</text>
  <text x="380" y="328" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, not a screenshot of the Figma interface.</text>
</svg>
