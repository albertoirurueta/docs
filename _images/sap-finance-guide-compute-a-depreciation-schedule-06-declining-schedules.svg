<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="sap-finance-guide-compute-a-depreciation-schedule-06-declining-schedules-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-compute-a-depreciation-schedule-06-declining-schedules-title">Terminal with two curl commands piped to jq: the declining-balance schedule of 15000 over 5 years with factor 2 shows 6000.00 and 3600.00 with the rule declining, then 1800.00 in years 3 to 5 with the rule changeover and a net book value of 0.00 (callout 10); the schedule of the delivery van read from its master record is the same (callout 11)</title>
<g><rect x="0" y="0" width="1080" height="360" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="328" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s &quot;http://localhost:4004/odata/v4/depreciation/calculate(Method='declining-balance',Base=15000,Years=5,Factor=</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">2)&quot; | jq -c '.value[] | {Year,Depreciation,NetBookValue,Rule}'</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:1,&quot;Depreciation&quot;:&quot;6000.00&quot;,&quot;NetBookValue&quot;:&quot;9000.00&quot;,&quot;Rule&quot;:&quot;declining&quot;}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:2,&quot;Depreciation&quot;:&quot;3600.00&quot;,&quot;NetBookValue&quot;:&quot;5400.00&quot;,&quot;Rule&quot;:&quot;declining&quot;}</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:3,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;3600.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:4,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;1800.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:5,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;0.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s &quot;http://localhost:4004/odata/v4/depreciation/Assets('10001')/plan()&quot; | jq -c '.value[] | {Year,Depreciation,</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">NetBookValue,Rule}'</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:1,&quot;Depreciation&quot;:&quot;6000.00&quot;,&quot;NetBookValue&quot;:&quot;9000.00&quot;,&quot;Rule&quot;:&quot;declining&quot;}</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:2,&quot;Depreciation&quot;:&quot;3600.00&quot;,&quot;NetBookValue&quot;:&quot;5400.00&quot;,&quot;Rule&quot;:&quot;declining&quot;}</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:3,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;3600.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:4,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;1800.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:5,&quot;Depreciation&quot;:&quot;1800.00&quot;,&quot;NetBookValue&quot;:&quot;0.00&quot;,&quot;Rule&quot;:&quot;changeover&quot;}</text>
<rect x="5" y="46" width="1042" height="149" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g>
<rect x="5" y="193" width="1042" height="149" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="193" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="198" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">11</text></g></g>
</svg>
