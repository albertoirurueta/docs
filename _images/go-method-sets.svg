<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Method sets of Book and *Book</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the method set of T is contained in the method set of *T; interfaces are satisfied by method sets, not by what a call could do</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>

  <!-- nested sets -->
  <rect x="30" y="68" width="470" height="240" rx="10" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="48" y="92" font-size="14" font-weight="bold" fill="#2e7d32">method set of *Book</text>
  <rect x="50" y="106" width="430" height="108" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="66" y="130" font-size="14" font-weight="bold" fill="#1c4b73">method set of Book</text>
  <g font-family="Courier New, monospace" font-size="13" fill="#222222">
    <text x="66" y="160">func (b Book) Summary()</text>
    <text x="66" y="184">func (b Book) Short()</text>
    <text x="66" y="202" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">value receivers: in both sets</text>
    <text x="50" y="236">func (b *Book) Retitle()</text>
    <text x="50" y="260">func (b *Book) Reset()</text>
    <text x="50" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">pointer receivers: only in the method set of *Book</text>
  </g>

  <!-- interface satisfaction -->
  <g font-size="13" fill="#222222">
    <text x="540" y="92" font-weight="bold" fill="#1c4b73">Which interface can hold which?</text>
    <rect x="540" y="106" width="370" height="34" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="552" y="128">interface{ Summary() string } &#8594; Book, *Book</text>
    <rect x="540" y="146" width="370" height="34" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="552" y="168">interface{ Retitle(string) } &#8594; *Book only</text>
    <rect x="540" y="186" width="370" height="34" fill="#fdecea" stroke="#c62828"/>
    <text x="552" y="208">var r R = Book{} does not compile</text>
    <text x="540" y="244" font-size="12" fill="#444444">"method Retitle has pointer receiver"</text>
  </g>

  <!-- call rewriting -->
  <rect x="30" y="328" width="880" height="72" rx="8" fill="#fafafa" stroke="#bbbbbb"/>
  <g font-size="13" fill="#222222">
    <text x="48" y="352" font-weight="bold" fill="#1c4b73">Direct calls are more permissive than method sets</text>
    <text x="48" y="374" font-family="Courier New, monospace">b.Retitle("x")</text>
    <line x1="170" y1="370" x2="232" y2="370" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
    <text x="244" y="374" font-family="Courier New, monospace">(&amp;b).Retitle("x")</text>
    <text x="420" y="374">when b is addressable (a variable, a field of one, a slice element, *p).</text>
    <text x="48" y="392" font-size="12" fill="#555555">Not addressable: map elements, function results, composite literals -- so Book{}.Retitle() and m[k].Retitle() fail.</text>
  </g>
</svg>
