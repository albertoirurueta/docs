<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>

  <text x="430" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The MVC / Razor Pages filter pipeline</text>

  <!-- outer: exception filters wrap everything -->
  <rect x="30" y="55" width="800" height="255" rx="10" fill="#fbeee0" stroke="#c25a1d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="50" y="78" font-size="12.5" font-weight="bold" fill="#8a3d10">Exception filters (IExceptionFilter) -- wrap everything below</text>

  <!-- authorization filters -->
  <rect x="50" y="95" width="140" height="90" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="120" y="130" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Authorization</text>
  <text x="120" y="146" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">filters</text>
  <text x="120" y="166" font-size="10" fill="#1c4b73" text-anchor="middle">IAuthorization-</text>
  <text x="120" y="178" font-size="10" fill="#1c4b73" text-anchor="middle">Filter</text>

  <!-- resource filters (before) -->
  <rect x="210" y="95" width="140" height="90" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="280" y="130" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">Resource</text>
  <text x="280" y="146" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">filters (before)</text>
  <text x="280" y="166" font-size="10" fill="#2f5424" text-anchor="middle">IResourceFilter /</text>
  <text x="280" y="178" font-size="10" fill="#2f5424" text-anchor="middle">model binding</text>

  <!-- action filters (before) -->
  <rect x="370" y="95" width="140" height="90" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="440" y="130" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Action filters</text>
  <text x="440" y="146" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">(before)</text>
  <text x="440" y="166" font-size="10" fill="#1c4b73" text-anchor="middle">IActionFilter /</text>
  <text x="440" y="178" font-size="10" fill="#1c4b73" text-anchor="middle">IAsyncActionFilter</text>

  <!-- action execution -->
  <rect x="530" y="95" width="140" height="90" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="600" y="130" font-size="12" font-weight="bold" fill="#8a3d10" text-anchor="middle">Action /</text>
  <text x="600" y="146" font-size="12" font-weight="bold" fill="#8a3d10" text-anchor="middle">page handler</text>
  <text x="600" y="166" font-size="10" fill="#8a3d10" text-anchor="middle">controller action or</text>
  <text x="600" y="178" font-size="10" fill="#8a3d10" text-anchor="middle">OnGet/OnPost</text>

  <!-- result filters -->
  <rect x="690" y="95" width="120" height="90" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="750" y="130" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">Result</text>
  <text x="750" y="146" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">filters</text>
  <text x="750" y="166" font-size="10" fill="#2f5424" text-anchor="middle">IResultFilter</text>

  <!-- arrows between stages -->
  <line x1="190" y1="140" x2="210" y2="140" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="350" y1="140" x2="370" y2="140" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="510" y1="140" x2="530" y2="140" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="670" y1="140" x2="690" y2="140" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- second row: after variants + result execution -->
  <text x="50" y="222" font-size="11.5" fill="#444444">After the action runs, "after" filters unwind in reverse order, then the result executes:</text>

  <rect x="210" y="235" width="140" height="60" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2" opacity="0.85"/>
  <text x="280" y="260" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Action filters</text>
  <text x="280" y="276" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">(after)</text>

  <rect x="370" y="235" width="140" height="60" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="440" y="260" font-size="11.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Result execution</text>
  <text x="440" y="276" font-size="10" fill="#8a3d10" text-anchor="middle">write the response</text>

  <rect x="530" y="235" width="140" height="60" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2" opacity="0.85"/>
  <text x="600" y="260" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Resource filters</text>
  <text x="600" y="276" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">(after)</text>

  <line x1="350" y1="265" x2="370" y2="265" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="510" y1="265" x2="530" y2="265" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- outside the outer box: short-circuit / DI note -->
  <rect x="30" y="330" width="800" height="100" rx="8" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="50" y="352" font-size="12" font-weight="bold" fill="#1c4b73">Any filter stage can short-circuit</text>
  <text x="50" y="372" font-size="11" fill="#444444">Setting context.Result (sync) or not calling next() (async) skips every remaining stage and jumps straight</text>
  <text x="50" y="390" font-size="11" fill="#444444">to result execution -- e.g. an authorization filter denying access never reaches the action at all.</text>
  <text x="50" y="412" font-size="11" fill="#444444">IOrderedFilter.Order controls sequence among filters at the same scope; ServiceFilter/TypeFilter resolve a filter via DI.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
