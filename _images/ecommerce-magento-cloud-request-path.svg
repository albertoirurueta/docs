<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The request path of a tiered Magento shop</title>
  <desc id="d">A shopper request goes to CloudFront, which serves static files and media from its cache and forwards everything else to an Application Load Balancer protected by AWS WAF. The load balancer routes storefront requests to the Varnish pods, which serve the full page cache hits and forward misses to the web pods with nginx and php-fpm. Requests for the admin path admin_pocketcoffee bypass Varnish and go from the load balancer directly to the admin Deployment or the web pods. PHP in the pods talks to RDS, OpenSearch, two Valkey groups, Amazon MQ and S3. When Magento changes a product it sends purge requests from the pods to every Varnish replica.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker></defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Request path: storefront through Varnish, admin around it</text>
  <rect x="30" y="80" width="110" height="52" rx="9" fill="#3d5266"/><text x="85" y="111" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper</text>
  <rect x="170" y="80" width="140" height="52" rx="9" fill="#3d5266"/><text x="240" y="102" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">CloudFront</text><text x="240" y="120" font-size="11" fill="#f2f5f8" text-anchor="middle">static, media cache</text>
  <rect x="340" y="80" width="140" height="52" rx="9" fill="#3f6e9a"/><text x="410" y="102" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ALB + WAF</text><text x="410" y="120" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS, path routing</text>
  <rect x="510" y="80" width="150" height="52" rx="9" fill="#7a5c3a"/><text x="585" y="102" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Varnish (2+)</text><text x="585" y="120" font-size="11" fill="#f2f5f8" text-anchor="middle">full page cache</text>
  <rect x="690" y="80" width="240" height="52" rx="9" fill="#3f6e9a"/><text x="810" y="102" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">web pods (2+)</text><text x="810" y="120" font-size="11" fill="#f2f5f8" text-anchor="middle">nginx 8080 + php-fpm 9000</text>
  <line x1="140" y1="106" x2="168" y2="106" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="106" x2="338" y2="106" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="106" x2="508" y2="106" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="106" x2="688" y2="106" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="585" y="70" font-size="11" fill="#9fd3c7" text-anchor="middle">miss or pass</text>
  <path d="M410 132 L410 200 L690 200" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="420" y="168" font-size="11.5" fill="#f4b860">/admin_pocketcoffee (the admin path)</text>
  <text x="420" y="184" font-size="11" fill="#f4b860">routed around Varnish</text>
  <rect x="690" y="176" width="240" height="46" rx="9" fill="#34495e" stroke="#f4b860" stroke-width="1.5"/><text x="810" y="196" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">admin Deployment (optional)</text><text x="810" y="212" font-size="11" fill="#f2f5f8" text-anchor="middle">same image, or the web pods</text>
  <text x="30" y="246" font-size="13" font-weight="bold" fill="#f4b860">What PHP reaches from a web or admin pod</text>
  <path d="M930 106 L946 106 L946 256 L105 256" fill="none" stroke="#f2f5f8" stroke-width="2"/><path d="M810 222 L810 256" fill="none" stroke="#f2f5f8" stroke-width="2"/><line x1="105" y1="256" x2="105" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/><line x1="270" y1="256" x2="270" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/><line x1="435" y1="256" x2="435" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="256" x2="600" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/><line x1="745" y1="256" x2="745" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/><line x1="872" y1="256" x2="872" y2="276" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="278" width="150" height="56" rx="8" fill="#4d7c5a"/><text x="105" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">RDS MySQL 8.4</text><text x="105" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS 3306</text>
  <rect x="195" y="278" width="150" height="56" rx="8" fill="#4d7c5a"/><text x="270" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">OpenSearch 3.x</text><text x="270" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">HTTPS 443</text>
  <rect x="360" y="278" width="150" height="56" rx="8" fill="#4d7c5a"/><text x="435" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Valkey cache</text><text x="435" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS 6379</text>
  <rect x="525" y="278" width="150" height="56" rx="8" fill="#4d7c5a"/><text x="600" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Valkey sessions</text><text x="600" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS 6379</text>
  <rect x="690" y="278" width="110" height="56" rx="8" fill="#4d7c5a"/><text x="745" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">RabbitMQ</text><text x="745" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">AMQPS 5671</text>
  <rect x="815" y="278" width="115" height="56" rx="8" fill="#7a5c3a"/><text x="872" y="302" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">S3 media</text><text x="872" y="320" font-size="11" fill="#f2f5f8" text-anchor="middle">remote storage</text>
  <text x="30" y="372" font-size="12" fill="#9fd3c7">Purge: when a product or category changes, Magento sends HTTP PURGE or ban requests from the pod to every Varnish replica,</text>
  <text x="30" y="390" font-size="12" fill="#9fd3c7">so the Varnish hosts are listed by name in the http_cache_hosts setting; the load balancer is not on that path.</text>
  <text x="30" y="414" font-size="12" fill="#9fd3c7">Cache hits end at Varnish and never reach PHP; the CDN may answer even earlier for static files and media.</text>
</svg>
