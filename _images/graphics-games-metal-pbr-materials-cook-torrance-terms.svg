<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-pbr-materials-cook-torrance-terms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Cook-Torrance: one specular BRDF from three small functions</text>
<rect x="40" y="55" width="200" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="79.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">D(h)  GGX distribution</text>
<text x="140.0" y="94.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">how many microfacets face H</text>
<text x="140.0" y="109.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">roughness widens it</text>
<rect x="280" y="55" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="79.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">F(v, h)  Fresnel-Schlick</text>
<text x="380.0" y="94.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">reflectance rises at grazing</text>
<text x="380.0" y="109.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">angles; F0 sets the base</text>
<rect x="520" y="55" width="200" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="79.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">G(l, v)  Smith geometry</text>
<text x="620.0" y="94.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">microfacets shadowing and</text>
<text x="620.0" y="109.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">masking each other</text>
<line x1="140" y1="125" x2="380" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-cook-torrance-terms)"/>
<line x1="380" y1="125" x2="380" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-cook-torrance-terms)"/>
<line x1="620" y1="125" x2="380" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-cook-torrance-terms)"/>
<rect x="130" y="172" width="500" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="204.6" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">specular = D * F * G / (4 * dot(N,L) * dot(N,V))</text>
<rect x="20" y="250" width="360" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="276.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">diffuse = (1 - F) * (1 - metallic) * baseColor / pi</text>
<text x="200.0" y="291.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">energy left over after the specular reflection</text>
<rect x="400" y="250" width="340" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="276.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">F0 = mix(0.04, baseColor, metallic)</text>
<text x="570.0" y="291.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">dielectrics reflect about 4% at normal incidence</text>
<line x1="380" y1="228" x2="380" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-cook-torrance-terms)"/>
<line x1="190" y1="310" x2="330" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-cook-torrance-terms)"/>
<rect x="130" y="332" width="500" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="361.6" font-size="13" font-weight="normal" fill="#3730A3" text-anchor="middle">radiance = (diffuse + specular) * lightColor * dot(N,L)</text>
</svg>
