<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Bulk Create: data columns map to template fields</title>
  <desc>A data table with Title, Author, Tagline and Genre columns maps onto four placeholder text boxes of a template, followed by four steps</desc>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Bulk Create: data columns map to template fields</text>
  <text x="380" y="372" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
  <rect x="30" y="50" width="330" height="150" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="195" y="70" font-size="12" fill="#374151" text-anchor="middle" font-weight="bold">Data (CSV, Sheet, XLSX)</text>
  <rect x="44" y="84" width="72" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="80" y="99" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Title</text>
  <rect x="120" y="84" width="72" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="156" y="99" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Author</text>
  <rect x="196" y="84" width="72" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="232" y="99" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Tagline</text>
  <rect x="272" y="84" width="72" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="308" y="99" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Genre</text>
  <rect x="44" y="106" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="80" y="121" font-size="10" fill="#374151" text-anchor="middle">Emma</text>
  <rect x="120" y="106" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="156" y="121" font-size="10" fill="#374151" text-anchor="middle">J. Austen</text>
  <rect x="196" y="106" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="232" y="121" font-size="10" fill="#374151" text-anchor="middle">Wit and match</text>
  <rect x="272" y="106" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="308" y="121" font-size="10" fill="#374151" text-anchor="middle">Classic</text>
  <rect x="44" y="128" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="80" y="143" font-size="10" fill="#374151" text-anchor="middle">Dracula</text>
  <rect x="120" y="128" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="156" y="143" font-size="10" fill="#374151" text-anchor="middle">B. Stoker</text>
  <rect x="196" y="128" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="232" y="143" font-size="10" fill="#374151" text-anchor="middle">Letters and dread</text>
  <rect x="272" y="128" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="308" y="143" font-size="10" fill="#374151" text-anchor="middle">Gothic</text>
  <rect x="44" y="150" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="80" y="165" font-size="10" fill="#374151" text-anchor="middle">Ulysses</text>
  <rect x="120" y="150" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="156" y="165" font-size="10" fill="#374151" text-anchor="middle">J. Joyce</text>
  <rect x="196" y="150" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="232" y="165" font-size="10" fill="#374151" text-anchor="middle">One day, long</text>
  <rect x="272" y="150" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="308" y="165" font-size="10" fill="#374151" text-anchor="middle">Modern</text>
  <text x="195" y="190" font-size="11" fill="#6B7280" text-anchor="middle">Each column is a field, each row one design</text>
  <rect x="410" y="50" width="320" height="150" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="570" y="70" font-size="12" fill="#374151" text-anchor="middle" font-weight="bold">Template design with placeholders</text>
  <rect x="430" y="86" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="480" y="102" font-size="10" fill="#374151" text-anchor="middle">Title text box</text>
  <rect x="430" y="116" width="100" height="20" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="480" y="130" font-size="10" fill="#374151" text-anchor="middle">Author text box</text>
  <rect x="430" y="142" width="100" height="20" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="480" y="156" font-size="10" fill="#374151" text-anchor="middle">Tagline text box</text>
  <rect x="550" y="86" width="160" height="46" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="630" y="114" font-size="10" fill="#374151" text-anchor="middle">Genre badge text box</text>
  <text x="570" y="184" font-size="11" fill="#6B7280" text-anchor="middle">One text box or frame per field</text>
  <path d="M194,215 L194,250" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="30" y="252" width="700" height="112" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="60" cy="282" r="11" fill="#4F46E5"/>
  <text x="60" y="286" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="78" y="286" font-size="12" fill="#374151" text-anchor="start" font-weight="bold">Match and fill fields</text>
  <text x="78" y="304" font-size="11" fill="#374151" text-anchor="start">Canva proposes matches</text>
  <circle cx="230" cy="282" r="11" fill="#4F46E5"/>
  <text x="230" y="286" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="248" y="286" font-size="12" fill="#374151" text-anchor="start" font-weight="bold">Review in Match data</text>
  <text x="248" y="304" font-size="11" fill="#374151" text-anchor="start">Fix a wrong match</text>
  <circle cx="400" cy="282" r="11" fill="#4F46E5"/>
  <text x="400" y="286" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="418" y="286" font-size="12" fill="#374151" text-anchor="start" font-weight="bold">Preview</text>
  <text x="418" y="304" font-size="11" fill="#374151" text-anchor="start">Check text and images</text>
  <circle cx="570" cy="282" r="11" fill="#B45309"/>
  <text x="570" y="286" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="588" y="286" font-size="12" fill="#374151" text-anchor="start" font-weight="bold">Create designs</text>
  <text x="588" y="304" font-size="11" fill="#374151" text-anchor="start">One design per row</text>
  <text x="380" y="345" font-size="11" fill="#92400E" text-anchor="middle">Output: 1 design with multiple pages, or individual designs. Up to 300 rows and 150 columns.</text>

</svg>
