<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif">
  <title>A behaviour tree for DocsAssistant's "report a wrong page" task</title>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Behaviour tree: DocsAssistant reports a wrong page</text>

  <!-- edges -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M450 92 L230 150"/>
    <path d="M450 92 L670 150"/>
    <path d="M230 192 L110 250"/>
    <path d="M230 192 L330 250"/>
    <path d="M670 192 L540 250"/>
    <path d="M670 192 L680 250"/>
    <path d="M670 192 L820 250"/>
    <path d="M330 292 L260 350"/>
    <path d="M330 292 L400 350"/>
  </g>

  <!-- root: selector -->
  <rect x="370" y="50" width="160" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">? Selector</text>
  <text x="450" y="86" text-anchor="middle" font-size="12" fill="#1e3a8a">first child that succeeds</text>

  <!-- left: sequence "already reported" -->
  <rect x="140" y="150" width="180" height="42" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="230" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">&#8594; Sequence</text>
  <text x="230" y="186" text-anchor="middle" font-size="12" fill="#14532d">already reported?</text>

  <!-- right: sequence "report it" -->
  <rect x="580" y="150" width="180" height="42" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="670" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">&#8594; Sequence</text>
  <text x="670" y="186" text-anchor="middle" font-size="12" fill="#14532d">report it</text>

  <!-- left children -->
  <rect x="30" y="250" width="160" height="42" rx="21" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="110" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Condition</text>
  <text x="110" y="284" text-anchor="middle" font-size="12" fill="#78350f">open issue exists?</text>

  <rect x="250" y="250" width="160" height="42" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="330" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">&#8594; Sequence</text>
  <text x="330" y="284" text-anchor="middle" font-size="12" fill="#14532d">tell the user</text>

  <rect x="190" y="350" width="140" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="260" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Action</text>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#7f1d1d">fetch issue link</text>

  <rect x="340" y="350" width="140" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="410" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Action</text>
  <text x="410" y="384" text-anchor="middle" font-size="12" fill="#7f1d1d">reply with link</text>

  <!-- right children -->
  <rect x="460" y="250" width="160" height="42" rx="21" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="540" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Condition</text>
  <text x="540" y="284" text-anchor="middle" font-size="12" fill="#78350f">evidence found?</text>

  <rect x="628" y="250" width="108" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="682" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Action</text>
  <text x="682" y="284" text-anchor="middle" font-size="12" fill="#7f1d1d">get approval</text>

  <rect x="745" y="250" width="150" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="820" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Action</text>
  <text x="820" y="284" text-anchor="middle" font-size="12" fill="#7f1d1d">open GitHub issue</text>

  <!-- legend -->
  <g font-size="12" fill="#0f172a">
    <rect x="30" y="410" width="840" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="45" y="430" font-weight="bold">Each tick returns SUCCESS, FAILURE or RUNNING</text>
    <rect x="45" y="440" width="16" height="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="68" y="451">Selector (?): tries children left to right, stops at first SUCCESS</text>
    <rect x="460" y="440" width="16" height="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="483" y="451">Sequence (&#8594;): runs children in order, stops at first FAILURE</text>
    <rect x="45" y="462" width="16" height="12" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="68" y="473">Condition: checks state, never changes it</text>
    <rect x="460" y="462" width="16" height="12" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="483" y="473">Action: does work; may return RUNNING (e.g. awaiting approval)</text>
  </g>
</svg>
