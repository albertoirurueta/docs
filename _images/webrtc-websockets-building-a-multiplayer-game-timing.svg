<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Pixel Arena timing: the client samples input and renders at 60 Hz, the server ticks at 20 Hz, each snapshot carries the last processed input so the client can replay the rest, and remote players are drawn 100 ms behind the newest snapshot</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One snapshot interval in Pixel Arena</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">three clocks: 60 Hz client steps, 20 Hz server ticks, and a render clock that runs 100 ms behind the snapshots</text>
  <rect x="20" y="66" width="760" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="30" y="84" font-size="11" font-weight="bold" fill="#0d3c75">Client: input + prediction</text>
  <rect x="20" y="136" width="760" height="48" rx="6" fill="#f5f5f5" stroke="#78909c" stroke-width="1"/>
  <text x="30" y="154" font-size="11" font-weight="bold" fill="#37474f">Network</text>
  <rect x="20" y="206" width="760" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="30" y="224" font-size="11" font-weight="bold" fill="#1b4d1f">Server: authoritative tick</text>
  <rect x="20" y="296" width="760" height="62" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="30" y="314" font-size="11" font-weight="bold" fill="#7a2e00">Client: render clock</text>
  <line x1="150.0" y1="92" x2="150.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="150.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">10</text>
  <line x1="220.0" y1="92" x2="220.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="220.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">11</text>
  <line x1="290.0" y1="92" x2="290.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="290.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">12</text>
  <line x1="360.0" y1="92" x2="360.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="360.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">13</text>
  <line x1="430.0" y1="92" x2="430.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="430.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">14</text>
  <line x1="500.0" y1="92" x2="500.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="500.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">15</text>
  <line x1="570.0" y1="92" x2="570.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="570.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">16</text>
  <line x1="640.0" y1="92" x2="640.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="640.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">17</text>
  <line x1="710.0" y1="92" x2="710.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="710.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">18</text>
  <line x1="780.0" y1="92" x2="780.0" y2="110" stroke="#1565c0" stroke-width="2"/>
  <text x="780.0" y="122" font-size="8.5" fill="#0d3c75" text-anchor="middle">19</text>
  <rect x="145.0" y="228" width="10" height="20" fill="#2e7d32"/>
  <rect x="355.0" y="228" width="10" height="20" fill="#2e7d32"/>
  <rect x="565.0" y="228" width="10" height="20" fill="#2e7d32"/>
  <rect x="775.0" y="228" width="10" height="20" fill="#2e7d32"/>
  <text x="360.0" y="262" font-size="9" fill="#1b4d1f" text-anchor="middle">tick N+1</text>
  <text x="570.0" y="262" font-size="9" fill="#1b4d1f" text-anchor="middle">tick N+2</text>
  <text x="150.0" y="262" font-size="9" fill="#1b4d1f" text-anchor="middle">tick N</text>
  <line x1="288.6" y1="114" x2="351.6" y2="226" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282.6" y="150" font-size="9.5" fill="#37474f" text-anchor="end">inputs 10..12 (binary, 7 B each)</text>
  <line x1="368.4" y1="226" x2="444.0" y2="118" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="450.0" y="150" font-size="9.5" fill="#37474f">snapshot: lastProcessedInput = 12</text>
  <text x="465.0" y="76" font-size="9.5" fill="#0d3c75">on arrival: drop inputs up to 12, replay 13 and 14 from the server position</text>
  <rect x="150.0" y="318" width="420.0" height="14" rx="3" fill="#ffcc80" stroke="#e65100"/>
  <text x="360.0" y="329" font-size="9.5" fill="#7a2e00" text-anchor="middle">interpolate between snapshot N and N+1</text>
  <text x="170" y="350" font-size="9.5" fill="#7a2e00">hold the newest snapshot, never extrapolate; render time = newest snapshot time minus 100 ms</text>
  <text x="30" y="385" font-size="10" fill="#555555">Own player: drawn at the predicted position. Remote players: drawn at render time. Shots carry the render time so the server can rewind.</text>
</svg>
