<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="sfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="sfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="sfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where lighting is evaluated: per face, per vertex, per fragment</text>
<rect x="15" y="50" width="230" height="235" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="130" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Flat (per face)</text>
<polygon points="130,170 183.7,139.0 130.0,108.0" fill="#374151" stroke="#E5E7EB" stroke-width="0.5"/>
<polygon points="130,170 130.0,108.0 76.3,139.0" fill="#6B7280" stroke="#E5E7EB" stroke-width="0.5"/>
<polygon points="130,170 76.3,139.0 76.3,201.0" fill="#9CA3AF" stroke="#E5E7EB" stroke-width="0.5"/>
<polygon points="130,170 76.3,201.0 130.0,232.0" fill="#D1D5DB" stroke="#E5E7EB" stroke-width="0.5"/>
<polygon points="130,170 130.0,232.0 183.7,201.0" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="0.5"/>
<polygon points="130,170 183.7,201.0 183.7,139.0" fill="#9CA3AF" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="130" y="255" text-anchor="middle" font-size="11" fill="#374151">one normal per triangle</text>
<rect x="265" y="50" width="230" height="235" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="380" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Gouraud (per vertex)</text>
<defs><radialGradient id="sfg1" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#B8BDC6"/><stop offset="1" stop-color="#4B5563"/></radialGradient></defs>
<circle cx="380.0" cy="170.0" r="62" fill="url(#sfg1)" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="380" y="255" text-anchor="middle" font-size="11" fill="#374151">lit at vertices, highlight can be lost</text>
<rect x="515" y="50" width="230" height="235" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="630" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Phong (per fragment)</text>
<defs><radialGradient id="sfg2" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.12" stop-color="#E5E7EB"/><stop offset="1" stop-color="#374151"/></radialGradient></defs>
<circle cx="630.0" cy="170.0" r="62" fill="url(#sfg2)" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="630" y="255" text-anchor="middle" font-size="11" fill="#374151">normal interpolated, lit per pixel</text>
<text x="380" y="312" text-anchor="middle" font-size="11" fill="#374151">Per-fragment lighting costs more fragment work but is the default today; fixed-function GL and Java 3D lit per vertex.</text>
</svg>
