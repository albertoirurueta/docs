<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The styling layers</text>
  <text x="360" y="44" font-size="10.5" fill="#666666" text-anchor="middle">each layer builds on the one below; reach for the lowest one that does the job</text>

  <!-- layer 5 (top) -->
  <rect x="150" y="58" width="420" height="52" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.6"/>
  <text x="360" y="79" font-size="12" font-weight="bold" fill="#8a3d13" text-anchor="middle">Custom theme CSS + ::part()</text>
  <text x="360" y="96" font-size="9.5" fill="#666666" text-anchor="middle">reach a component's shadow DOM: vaadin-button::part(label), [invalid]</text>

  <!-- layer 4 -->
  <rect x="120" y="120" width="480" height="52" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="360" y="141" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Utility classes</text>
  <text x="360" y="158" font-size="9.5" fill="#666666" text-anchor="middle">LumoUtility.Padding.MEDIUM &#183; Tailwind utilities</text>

  <!-- layer 3 -->
  <rect x="90" y="182" width="540" height="52" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="360" y="203" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Theme &amp; component variants</text>
  <text x="360" y="220" font-size="9.5" fill="#666666" text-anchor="middle">addThemeVariants(ButtonVariant.LUMO_PRIMARY), GridVariant &#8230; &#8212; no CSS</text>

  <!-- layer 2 -->
  <rect x="60" y="244" width="600" height="56" rx="6" fill="#eef3ee" stroke="#2f6f4f" stroke-width="1.8"/>
  <text x="360" y="266" font-size="12" font-weight="bold" fill="#2f6f4f" text-anchor="middle">Lumo / Aura design tokens</text>
  <text x="360" y="284" font-size="9.5" fill="#4a6b56" text-anchor="middle">CSS custom properties: --lumo-primary-color, --lumo-font-size-m, --lumo-space-m, dark variant</text>

  <!-- layer 1 (bottom) -->
  <rect x="30" y="310" width="660" height="56" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.8"/>
  <text x="360" y="332" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Base theme</text>
  <text x="360" y="350" font-size="9.5" fill="#666666" text-anchor="middle">minimal structural CSS &#8212; the near-unstyled foundation</text>

  <text x="360" y="392" font-size="11" fill="#444444" text-anchor="middle">Activated with @Theme("name"); Lumo is the default. Custom CSS lives in the theme folder's styles.css.</text>
</svg>
