<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Deform and Colander data structures</title>
  <defs><marker id="pdc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Four shapes of the same data</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">Deform converts between HTML and cstructs, Colander between cstructs and Python values</text>
  <text x="170" y="76" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Validating a POST</text>
  <text x="550" y="76" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Rendering a form</text>
  <rect x="20" y="92" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="170.0" y="114" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Controls</text>
  <text x="170.0" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">request.POST.items(): ordered name and value pairs</text>
  <line x1="170" y1="148" x2="170" y2="174" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="20" y="174" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="170.0" y="196" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">pstruct</text>
  <text x="170.0" y="214" font-size="10.5" fill="currentColor" text-anchor="middle">peppercorn.parse: nested dicts and lists of strings</text>
  <line x1="170" y1="230" x2="170" y2="256" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="20" y="256" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="170.0" y="278" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">cstruct</text>
  <text x="170.0" y="296" font-size="10.5" fill="currentColor" text-anchor="middle">each widget deserializes its part: strings, sets, colander.null</text>
  <line x1="170" y1="312" x2="170" y2="338" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="20" y="338" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="170.0" y="360" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">appstruct</text>
  <text x="170.0" y="378" font-size="10.5" fill="currentColor" text-anchor="middle">schema.deserialize: types, preparers, validators</text>
  <line x1="170" y1="394" x2="170" y2="418" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="20" y="418" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="170.0" y="440" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Invalid becomes ValidationFailure</text>
  <text x="170.0" y="458" font-size="10.5" fill="currentColor" text-anchor="middle">exc.render() redraws the form with the errors</text>
  <text x="182" y="410" font-size="11" font-style="italic" fill="currentColor">a node fails</text>
  <rect x="400" y="92" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="550.0" y="114" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">appstruct</text>
  <text x="550.0" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">what the application holds: dicts, dates, sets</text>
  <line x1="550" y1="148" x2="550" y2="174" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="400" y="174" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="550.0" y="196" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">cstruct</text>
  <text x="550.0" y="214" font-size="10.5" fill="currentColor" text-anchor="middle">schema.serialize: types become strings, missing become null</text>
  <line x1="550" y1="230" x2="550" y2="256" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="400" y="256" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="550.0" y="278" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Widget</text>
  <text x="550.0" y="296" font-size="10.5" fill="currentColor" text-anchor="middle">widget.serialize hands the cstruct to a Chameleon template</text>
  <line x1="550" y1="312" x2="550" y2="338" stroke="currentColor" stroke-width="1.5" marker-end="url(#pdc-arrow)"/>
  <rect x="400" y="338" width="300" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="550.0" y="360" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">HTML</text>
  <text x="550.0" y="378" font-size="10.5" fill="currentColor" text-anchor="middle">form markup, inserted into the page as trusted markup</text>
  <text x="550" y="420" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">form.render(appstruct) runs this chain once for the whole form</text>
</svg>
