<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two Places layout patterns built with Flexbox</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Both are nested View flex containers -- no CSS grid, floats, or a browser layout engine involved</text>

  <!-- Panel A: three-column row -->
  <text x="195" y="68" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Three-column row</text>

  <rect x="30" y="84" width="330" height="180" rx="8" fill="#fbfbfb" stroke="#999999" stroke-width="1.4"/>

  <rect x="45" y="104" width="92" height="140" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="91" y="176" font-size="10.5" fill="#1c4b73" text-anchor="middle">flex: 1</text>

  <rect x="149" y="104" width="92" height="140" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="195" y="176" font-size="10.5" fill="#8a5a1c" text-anchor="middle">flex: 1</text>

  <rect x="253" y="104" width="92" height="140" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="299" y="176" font-size="10.5" fill="#2d6a34" text-anchor="middle">flex: 1</text>

  <text x="195" y="284" font-size="9.5" fill="#555555" text-anchor="middle">flexDirection: 'row'</text>
  <text x="195" y="298" font-size="9.5" fill="#555555" text-anchor="middle">gap: theme.spacing.md</text>
  <text x="195" y="312" font-size="9.5" fill="#555555" text-anchor="middle">each column: { flex: 1 }</text>

  <!-- Panel B: wrapping grid -->
  <text x="585" y="68" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Wrapping grid</text>

  <rect x="420" y="84" width="330" height="180" rx="8" fill="#fbfbfb" stroke="#999999" stroke-width="1.4"/>

  <!-- row 1 -->
  <rect x="435" y="104" width="93" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="538" y="104" width="93" height="70" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <rect x="641" y="104" width="93" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>

  <!-- row 2 -->
  <rect x="435" y="184" width="93" height="60" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <rect x="538" y="184" width="93" height="60" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="641" y="184" width="93" height="60" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>

  <text x="585" y="284" font-size="9.5" fill="#555555" text-anchor="middle">flexDirection: 'row', flexWrap: 'wrap'</text>
  <text x="585" y="298" font-size="9.5" fill="#555555" text-anchor="middle">gap: theme.spacing.sm</text>
  <text x="585" y="312" font-size="9.5" fill="#555555" text-anchor="middle">each card: { width: '31%' }</text>

  <text x="390" y="352" font-size="10.5" fill="#666666" text-anchor="middle">The row uses flex to divide space evenly; the grid uses flexWrap plus a fixed percentage</text>
  <text x="390" y="367" font-size="10.5" fill="#666666" text-anchor="middle">width per item so a row breaks onto the next line once it runs out of room.</text>
</svg>
