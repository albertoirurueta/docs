<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 522" width="860" height="522" role="img" aria-labelledby="cves-ecosystem-t cves-ecosystem-d">
<title id="cves-ecosystem-t">CVEs per year, ecosystem and keyword search</title>
<desc id="cves-ecosystem-d">CVEs published per year in the NVD that mention each platform: keyword search for PrestaShop, Magento and WooCommerce (modules, extensions and plugins) and the open-source libraries of Shopify (vendor CPE). The WooCommerce keyword series grows from 87 in 2022 to 893 in 2026 to date, driven by WordPress CNAs issuing CVEs in bulk. Shopify counts cover only its open-source libraries and CLI, not the SaaS platform.</desc>
