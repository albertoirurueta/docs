<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" role="img" aria-labelledby="advisories-traditional-t advisories-traditional-d">
<title id="advisories-traditional-t">Security advisories per year, traditional CMSs</title>
<desc id="advisories-traditional-d">Security advisories published per year by the Drupal security team (core), the Joomla Security Centre (core), the TYPO3 core advisories and GitHub global advisories for Craft CMS, 2015 to 2026 year to date. Each project counts differently (one advisory can bundle several CVEs), so levels are not comparable between lines.</desc>
