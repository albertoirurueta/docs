<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: create IA_Grab and map it to a key</text>
<rect x="15" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="31" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="31" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="100.0" y="285" text-anchor="middle" font-size="11" fill="#374151">Content Browser: Add, Input,</text>
<text x="100.0" y="299" text-anchor="middle" font-size="11" fill="#374151">Input Action, name it IA_Grab</text>
<line x1="187" y1="155.0" x2="198" y2="155.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="200" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="216" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="216" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="285.0" y="285" text-anchor="middle" font-size="11" fill="#374151">Open IA_Grab: Value Type is</text>
<text x="285.0" y="299" text-anchor="middle" font-size="11" fill="#374151">Digital (bool), no triggers</text>
<line x1="372" y1="155.0" x2="383" y2="155.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="385" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="401" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="401" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="470.0" y="285" text-anchor="middle" font-size="11" fill="#374151">Create IMC_Bookshelf and map</text>
<text x="470.0" y="299" text-anchor="middle" font-size="11" fill="#374151">IA_Grab to the E key</text>
<line x1="557" y1="155.0" x2="568" y2="155.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="570" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="586" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="586" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="655.0" y="285" text-anchor="middle" font-size="11" fill="#374151">Add IMC_Bookshelf to the local</text>
<text x="655.0" y="299" text-anchor="middle" font-size="11" fill="#374151">player and bind IA_Grab</text>
<rect x="29" y="88" width="142" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="37" y="103.0" text-anchor="start" font-size="11" fill="#3730A3">Add</text>
<rect x="39" y="116" width="132" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="47" y="131.0" text-anchor="start" font-size="10" fill="#3730A3">Input Action</text>
<rect x="39" y="142" width="132" height="22" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="47" y="157.0" text-anchor="start" font-size="10" fill="#374151">Input Mapping Context</text>
<rect x="39" y="168" width="132" height="22" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="47" y="183.0" text-anchor="start" font-size="10" fill="#374151">Input Modifier</text>
<text x="100" y="215" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">IA_Grab</text>
<text x="214" y="98" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">IA_Grab</text>
<text x="214" y="124" text-anchor="start" font-size="11" fill="#374151">Value Type</text>
<rect x="214" y="130" width="142" height="22" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="222" y="145.0" text-anchor="start" font-size="11" fill="#374151">Digital (bool)</text>
<text x="214" y="174" text-anchor="start" font-size="11" fill="#374151">Triggers</text>
<rect x="214" y="180" width="142" height="22" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="222" y="195" text-anchor="start" font-size="10" fill="#374151">empty = Down</text>
<text x="214" y="224" text-anchor="start" font-size="10" fill="#374151">Consume Input: on</text>
<text x="399" y="98" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">IMC_Bookshelf</text>
<rect x="399" y="112" width="142" height="22" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="407" y="127.0" text-anchor="start" font-size="11" fill="#374151">Mappings (1)</text>
<rect x="399" y="140" width="142" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="407" y="155.0" text-anchor="start" font-size="11" fill="#3730A3">IA_Grab</text>
<rect x="399" y="168" width="142" height="24" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="407" y="184" text-anchor="start" font-size="11" fill="#374151">Keyboard: E</text>
<text x="470" y="220" text-anchor="middle" font-size="10" fill="#374151">Triggers, Modifiers: none</text>
<rect x="582" y="88" width="146" height="120" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="588" y="104" text-anchor="start" font-size="10" fill="#1F2937">Subsystem-&gt;</text>
<text x="588" y="118" text-anchor="start" font-size="10" fill="#1F2937">AddMappingContext(</text>
<text x="588" y="132" text-anchor="start" font-size="10" fill="#1F2937">  IMC_Bookshelf, 0);</text>
<text x="588" y="146" text-anchor="start" font-size="10" fill="#1F2937"></text>
<text x="588" y="160" text-anchor="start" font-size="10" fill="#1F2937">Input-&gt;BindAction(</text>
<text x="588" y="174" text-anchor="start" font-size="10" fill="#1F2937">  IA_Grab, Triggered,</text>
<text x="588" y="188" text-anchor="start" font-size="10" fill="#1F2937">  this, &amp;Grab);</text>
</svg>
