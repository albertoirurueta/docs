<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="swi-purple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#5b3f96"/>
    </marker>
    <marker id="swi-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2f6fa8"/>
    </marker>
    <marker id="swi-orange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b06a1f"/>
    </marker>
    <marker id="swi-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2f7a4f"/>
    </marker>
  </defs>

  <text x="380" y="27" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How Swift, C, {cpp} and Objective-C see each other inside one target</text>

  <!-- Swift hub -->
  <rect x="300" y="200" width="160" height="70" rx="8" fill="#efe9f8" stroke="#5b3f96" stroke-width="2.5"/>
  <text x="380" y="230" font-size="14" font-weight="bold" fill="#3b2861" text-anchor="middle">Swift sources</text>
  <text x="380" y="248" font-size="10.5" fill="#5b3f96" text-anchor="middle">one build target</text>

  <!-- C corner (top-left) -->
  <rect x="45" y="60" width="220" height="100" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="155" y="83" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">C headers</text>
  <text x="155" y="102" font-size="10.5" fill="#5b7089" text-anchor="middle">Clang importer maps types,</text>
  <text x="155" y="117" font-size="10.5" fill="#5b7089" text-anchor="middle">structs, pointers, functions</text>
  <text x="155" y="135" font-size="10.5" fill="#5b7089" text-anchor="middle">module.modulemap / systemLibrary</text>
  <text x="155" y="150" font-size="10.5" fill="#5b7089" text-anchor="middle">exposes it as a Swift module</text>

  <!-- C++ corner (top-right) -->
  <rect x="495" y="60" width="220" height="100" rx="8" fill="#e3f1e7" stroke="#2f7a4f" stroke-width="2"/>
  <text x="605" y="83" font-size="13" font-weight="bold" fill="#1c4a30" text-anchor="middle">{cpp} headers</text>
  <text x="605" y="102" font-size="10.5" fill="#4f7a5f" text-anchor="middle">-cxx-interoperability-mode=default</text>
  <text x="605" y="117" font-size="10.5" fill="#4f7a5f" text-anchor="middle">classes, references, containers,</text>
  <text x="605" y="132" font-size="10.5" fill="#4f7a5f" text-anchor="middle">template instantiations imported</text>
  <text x="605" y="150" font-size="10.5" fill="#4f7a5f" text-anchor="middle">directly as Swift-usable types</text>

  <!-- Objective-C corner (bottom) -->
  <rect x="270" y="345" width="220" height="105" rx="8" fill="#fbeee0" stroke="#b06a1f" stroke-width="2"/>
  <text x="380" y="368" font-size="13" font-weight="bold" fill="#7a4a10" text-anchor="middle">Objective-C sources</text>
  <text x="380" y="387" font-size="10.5" fill="#8a6a40" text-anchor="middle">Bridging header: ObjC -&gt; Swift</text>
  <text x="380" y="402" font-size="10.5" fill="#8a6a40" text-anchor="middle">Generated -Swift.h: Swift -&gt; ObjC</text>
  <text x="380" y="420" font-size="10.5" fill="#8a6a40" text-anchor="middle">@objc / NS_SWIFT_NAME / nullability</text>
  <text x="380" y="437" font-size="10.5" fill="#8a6a40" text-anchor="middle">async completion-handler bridging</text>

  <!-- arrows: C <-> Swift -->
  <path d="M240 130 L300 210" stroke="#2f6fa8" stroke-width="2.5" fill="none" marker-end="url(#swi-purple)"/>
  <path d="M300 225 L240 145" stroke="#2f6fa8" stroke-width="2.5" fill="none" marker-end="url(#swi-blue)"/>
  <text x="248" y="175" font-size="10" fill="#2f6fa8" text-anchor="middle">imported</text>
  <text x="248" y="188" font-size="10" fill="#2f6fa8" text-anchor="middle">types/funcs</text>

  <!-- arrows: C++ <-> Swift -->
  <path d="M520 130 L460 210" stroke="#2f7a4f" stroke-width="2.5" fill="none" marker-end="url(#swi-purple)"/>
  <path d="M460 225 L520 145" stroke="#2f7a4f" stroke-width="2.5" fill="none" marker-end="url(#swi-green)"/>
  <text x="512" y="175" font-size="10" fill="#2f7a4f" text-anchor="middle">imported</text>
  <text x="512" y="188" font-size="10" fill="#2f7a4f" text-anchor="middle">classes/methods</text>

  <!-- arrows: Swift <-> Objective-C -->
  <path d="M355 270 L370 343" stroke="#b06a1f" stroke-width="2.5" fill="none" marker-end="url(#swi-orange)"/>
  <path d="M405 343 L390 270" stroke="#5b3f96" stroke-width="2.5" fill="none" marker-end="url(#swi-purple)"/>
  <text x="330" y="310" font-size="10" fill="#b06a1f" text-anchor="middle">bridging</text>
  <text x="330" y="323" font-size="10" fill="#b06a1f" text-anchor="middle">header</text>
  <text x="430" y="310" font-size="10" fill="#5b3f96" text-anchor="middle">generated</text>
  <text x="430" y="323" font-size="10" fill="#5b3f96" text-anchor="middle">-Swift.h</text>

  <!-- bottom notes -->
  <text x="380" y="463" font-size="11.5" fill="#5b7089" text-anchor="middle">Each pairing is asymmetric: an importer maps the foreign declarations one way, and an explicit mechanism exposes Swift back.</text>
</svg>
