<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How Testcontainers uses Docker</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">How Testcontainers uses Docker</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">the test JVM is an ordinary Docker API client; Ryuk removes everything if the JVM disappears</text>
  <rect x="20" y="70" width="230" height="270" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="135.0" y="88.0" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Test JVM (mvn verify)</text>
  <rect x="35" y="110" width="200" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="131.0" font-size="9" fill="#333333" text-anchor="middle">@SpringBootTest OrderIT</text>
  <text x="135.0" y="144.0" font-size="9" fill="#333333" text-anchor="middle">uses host + mapped port</text>
  <rect x="35" y="170" width="200" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="191.0" font-size="9" fill="#333333" text-anchor="middle">Testcontainers (docker-java)</text>
  <text x="135.0" y="204.0" font-size="9" fill="#333333" text-anchor="middle">DOCKER_HOST / sockets / tc.host</text>
  <rect x="35" y="230" width="200" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="251.0" font-size="9" fill="#333333" text-anchor="middle">session id labels on every</text>
  <text x="135.0" y="264.0" font-size="9" fill="#333333" text-anchor="middle">container, network, volume</text>
  <rect x="290" y="150" width="170" height="70" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="375.0" y="174.5" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Docker Engine</text>
  <text x="375.0" y="189.5" font-size="9" fill="#333333" text-anchor="middle">/var/run/docker.sock</text>
  <text x="375.0" y="202.5" font-size="9" fill="#333333" text-anchor="middle">(or Desktop VM)</text>
  <rect x="510" y="60" width="230" height="70" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="625.0" y="91.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">postgres container</text>
  <text x="625.0" y="106.0" font-size="9" fill="#333333" text-anchor="middle">5432 -&gt; random host port 55012</text>
  <rect x="510" y="145" width="230" height="70" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="625.0" y="176.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">kafka container</text>
  <text x="625.0" y="191.0" font-size="9" fill="#333333" text-anchor="middle">9092 -&gt; random host port 55013</text>
  <rect x="510" y="230" width="230" height="90" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="625.0" y="258.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">testcontainers/ryuk</text>
  <text x="625.0" y="273.0" font-size="9" fill="#333333" text-anchor="middle">mounts docker.sock; holds a</text>
  <text x="625.0" y="286.0" font-size="9" fill="#333333" text-anchor="middle">connection from the JVM; on disconnect</text>
  <text x="625.0" y="299.0" font-size="9" fill="#333333" text-anchor="middle">removes resources with the session label</text>
  <line x1="235" y1="195" x2="290" y2="185" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="262" y="175" font-size="9.5" fill="#555555" text-anchor="middle">Engine API</text>
  <line x1="460" y1="175" x2="510" y2="95" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="460" y1="185" x2="510" y2="180" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="460" y1="195" x2="510" y2="270" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="235" y1="135" x2="510" y2="95" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="390" y="100" font-size="9.5" fill="#555555" text-anchor="middle">JDBC to host:55012</text>
  <line x1="510" y1="300" x2="235" y2="255" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="380" y="300" font-size="9.5" fill="#555555" text-anchor="middle">keep-alive</text>
</svg>
