<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Joomla upgrade path: 3.10, 4.4, 5.4, 6.x and 7.0 with bridge releases and backward-compatibility plugins</title>
<desc id="d">Five boxes in a row joined by arrows. Joomla 3.10 goes to 4.4, 4.4 to 5.4, 5.4 to 6.x and 6.x to 7.0. Each arrow notes the compatibility plugin that carries old code across the step. 3.10 and 4.4 are end of life, 5.4 is security-only, 6.2 is current and 7.0 is projected for October 2027.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
</defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Supported upgrade path: one bridge release per major (dashed = projection)</text>

<rect x="20" y="70" width="140" height="100" rx="6" fill="#e0e0e0" stroke="#444444"/>
<text x="90" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">3.10</text>
<text x="90" y="128" text-anchor="middle" font-size="13" fill="#1a1a1a">last 3.x</text>
<text x="90" y="148" text-anchor="middle" font-size="13" fill="#1a1a1a">end of life</text>

<rect x="215" y="70" width="140" height="100" rx="6" fill="#e0e0e0" stroke="#444444"/>
<text x="285" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">4.4</text>
<text x="285" y="128" text-anchor="middle" font-size="13" fill="#1a1a1a">bridge to 5.0</text>
<text x="285" y="148" text-anchor="middle" font-size="13" fill="#1a1a1a">end of life (2025-10)</text>

<rect x="410" y="70" width="140" height="100" rx="6" fill="#f6d9a8" stroke="#444444"/>
<text x="480" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">5.4.x</text>
<text x="480" y="128" text-anchor="middle" font-size="13" fill="#1a1a1a">bridge to 6.0</text>
<text x="480" y="148" text-anchor="middle" font-size="13" fill="#1a1a1a">security until 2027-10-12</text>

<rect x="605" y="70" width="140" height="100" rx="6" fill="#bfe3c6" stroke="#444444"/>
<text x="675" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">6.x</text>
<text x="675" y="128" text-anchor="middle" font-size="13" fill="#1a1a1a">6.2 is current</text>
<text x="675" y="148" text-anchor="middle" font-size="13" fill="#1a1a1a">PHP 8.3 or later</text>

<rect x="800" y="70" width="140" height="100" rx="6" fill="#ffffff" stroke="#444444" stroke-dasharray="6 4"/>
<text x="870" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">7.0</text>
<text x="870" y="128" text-anchor="middle" font-size="13" fill="#1a1a1a">projected</text>
<text x="870" y="148" text-anchor="middle" font-size="13" fill="#1a1a1a">October 2027</text>

<line x1="160" y1="120" x2="213" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="355" y1="120" x2="408" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="550" y1="120" x2="603" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="745" y1="120" x2="798" y2="120" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>

<text x="90" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">Step 1</text>
<text x="90" y="233" text-anchor="middle" font-size="12" fill="#333333">see the Joomla 3</text>
<text x="90" y="249" text-anchor="middle" font-size="12" fill="#333333">migration page</text>

<text x="285" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">Step 2</text>
<text x="285" y="233" text-anchor="middle" font-size="12" fill="#333333">update 4.4 to the</text>
<text x="285" y="249" text-anchor="middle" font-size="12" fill="#333333">latest 5.4.x</text>
<text x="285" y="265" text-anchor="middle" font-size="12" fill="#333333">B/C plugin of Joomla 5</text>

<text x="480" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Step 3 (this page)</text>
<text x="480" y="233" text-anchor="middle" font-size="12" fill="#333333">disable the old B/C plugin</text>
<text x="480" y="249" text-anchor="middle" font-size="12" fill="#333333">enable "Backward</text>
<text x="480" y="265" text-anchor="middle" font-size="12" fill="#333333">Compatibility 6"</text>
<text x="480" y="281" text-anchor="middle" font-size="12" fill="#333333">channel: Joomla Next</text>

<text x="675" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">Step 4</text>
<text x="675" y="233" text-anchor="middle" font-size="12" fill="#333333">BC6 off by default on</text>
<text x="675" y="249" text-anchor="middle" font-size="12" fill="#333333">new installs; fix code,</text>
<text x="675" y="265" text-anchor="middle" font-size="12" fill="#333333">then disable BC6</text>

<text x="870" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">Result</text>
<text x="870" y="233" text-anchor="middle" font-size="12" fill="#333333">BC6 is not carried</text>
<text x="870" y="249" text-anchor="middle" font-size="12" fill="#333333">into 7; deprecated</text>
<text x="870" y="265" text-anchor="middle" font-size="12" fill="#333333">code is removed</text>

<rect x="40" y="320" width="880" height="70" rx="6" fill="#f4f4f4" stroke="#999999"/>
<text x="480" y="345" text-anchor="middle" font-size="13" fill="#1a1a1a">Never skip a bridge: a site on 5.1 or 5.2 first moves to the latest 5.4.x, and only then to 6.x.</text>
<text x="480" y="368" text-anchor="middle" font-size="13" fill="#1a1a1a">There is no supported way back: the only downgrade is a restored backup.</text>
</svg>
