<svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="584" fill="#ffffff"/>
<text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">encoding/json v1 and v2: different defaults, one option each</text>
<text x="500" y="46" font-size="12" fill="#666666" text-anchor="middle">in Go 1.27 json.Marshal and json.Unmarshal are v2 called with json.DefaultOptionsV1(), so v1 behaviour is a set of options</text>
<rect x="12" y="62" width="976" height="30" fill="#1c4b73"/>
<text x="24" y="82" font-size="13" font-weight="bold" fill="#ffffff">Behaviour</text>
<text x="214" y="82" font-size="13" font-weight="bold" fill="#ffffff">v1 default (encoding/json)</text>
<text x="424" y="82" font-size="13" font-weight="bold" fill="#ffffff">v2 default (encoding/json/v2)</text>
<text x="634" y="82" font-size="13" font-weight="bold" fill="#ffffff">Option that selects the other behaviour</text>
<rect x="12" y="96" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="117" font-size="12.5" font-weight="bold" fill="#222222">nil slice, nil map</text>
<text x="214" y="117" font-size="12.5" fill="#1c4b73">null</text>
<text x="424" y="117" font-size="12.5" fill="#2e7d32">[] and {}</text>
<text x="634" y="117" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsonv2.FormatNilSliceAsNull, FormatNilMapAsNull</text>
<rect x="12" y="128" width="976" height="32" fill="#ffffff"/>
<text x="24" y="149" font-size="12.5" font-weight="bold" fill="#222222">omitempty</text>
<text x="214" y="149" font-size="12.5" fill="#1c4b73">false, 0, nil, empty</text>
<text x="424" y="149" font-size="12.5" fill="#2e7d32">only null, &quot;&quot;, {}, []</text>
<text x="634" y="149" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.OmitEmptyWithLegacySemantics</text>
<rect x="12" y="160" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="181" font-size="12.5" font-weight="bold" fill="#222222">struct field names</text>
<text x="214" y="181" font-size="12.5" fill="#1c4b73">case-insensitive</text>
<text x="424" y="181" font-size="12.5" fill="#2e7d32">exact match</text>
<text x="634" y="181" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsonv2.MatchCaseInsensitiveNames</text>
<rect x="12" y="192" width="976" height="32" fill="#ffffff"/>
<text x="24" y="213" font-size="12.5" font-weight="bold" fill="#222222">duplicate names</text>
<text x="214" y="213" font-size="12.5" fill="#1c4b73">allowed, last wins</text>
<text x="424" y="213" font-size="12.5" fill="#2e7d32">error</text>
<text x="634" y="213" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsontext.AllowDuplicateNames</text>
<rect x="12" y="224" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="245" font-size="12.5" font-weight="bold" fill="#222222">invalid UTF-8</text>
<text x="214" y="245" font-size="12.5" fill="#1c4b73">replaced by U+FFFD</text>
<text x="424" y="245" font-size="12.5" fill="#2e7d32">error</text>
<text x="634" y="245" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsontext.AllowInvalidUTF8</text>
<rect x="12" y="256" width="976" height="32" fill="#ffffff"/>
<text x="24" y="277" font-size="12.5" font-weight="bold" fill="#222222">time.Duration</text>
<text x="214" y="277" font-size="12.5" fill="#1c4b73">nanoseconds (number)</text>
<text x="424" y="277" font-size="12.5" fill="#2e7d32">error, no default</text>
<text x="634" y="277" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.FormatDurationAsNano</text>
<rect x="12" y="288" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="309" font-size="12.5" font-weight="bold" fill="#222222">[N]byte</text>
<text x="214" y="309" font-size="12.5" fill="#1c4b73">array of numbers</text>
<text x="424" y="309" font-size="12.5" fill="#2e7d32">base64 string</text>
<text x="634" y="309" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.FormatByteArrayAsArray</text>
<rect x="12" y="320" width="976" height="32" fill="#ffffff"/>
<text x="24" y="341" font-size="12.5" font-weight="bold" fill="#222222">map key order</text>
<text x="214" y="341" font-size="12.5" fill="#1c4b73">sorted</text>
<text x="424" y="341" font-size="12.5" fill="#2e7d32">unspecified</text>
<text x="634" y="341" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsonv2.Deterministic</text>
<rect x="12" y="352" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="373" font-size="12.5" font-weight="bold" fill="#222222">&lt;, &gt; and &amp; in strings</text>
<text x="214" y="373" font-size="12.5" fill="#1c4b73">escaped as \u003c ...</text>
<text x="424" y="373" font-size="12.5" fill="#2e7d32">written as is</text>
<text x="634" y="373" font-size="11.5" font-family="Courier New, monospace" fill="#444444">jsontext.EscapeForHTML</text>
<rect x="12" y="384" width="976" height="32" fill="#ffffff"/>
<text x="24" y="405" font-size="12.5" font-weight="bold" fill="#222222">pointer-receiver method</text>
<text x="214" y="405" font-size="12.5" fill="#1c4b73">only if addressable</text>
<text x="424" y="405" font-size="12.5" fill="#2e7d32">always called</text>
<text x="634" y="405" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.CallMethodsWithLegacySemantics</text>
<rect x="12" y="416" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="437" font-size="12.5" font-weight="bold" fill="#222222">null into existing value</text>
<text x="214" y="437" font-size="12.5" fill="#1c4b73">sometimes keeps it</text>
<text x="424" y="437" font-size="12.5" fill="#2e7d32">always zeroes it</text>
<text x="634" y="437" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.MergeWithLegacySemantics</text>
<rect x="12" y="448" width="976" height="32" fill="#ffffff"/>
<text x="24" y="469" font-size="12.5" font-weight="bold" fill="#222222">Go array length</text>
<text x="214" y="469" font-size="12.5" fill="#1c4b73">any JSON length</text>
<text x="424" y="469" font-size="12.5" fill="#2e7d32">exact length</text>
<text x="634" y="469" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.UnmarshalArrayFromAnyLength</text>
<rect x="12" y="480" width="976" height="32" fill="#f4f7fa"/>
<text x="24" y="501" font-size="12.5" font-weight="bold" fill="#222222">string tag option</text>
<text x="214" y="501" font-size="12.5" fill="#1c4b73">bool, string, number</text>
<text x="424" y="501" font-size="12.5" fill="#2e7d32">numbers only</text>
<text x="634" y="501" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.StringifyWithLegacySemantics</text>
<rect x="12" y="512" width="976" height="32" fill="#ffffff"/>
<text x="24" y="533" font-size="12.5" font-weight="bold" fill="#222222">invalid struct types or tags</text>
<text x="214" y="533" font-size="12.5" fill="#1c4b73">silently ignored</text>
<text x="424" y="533" font-size="12.5" fill="#2e7d32">runtime error</text>
<text x="634" y="533" font-size="11.5" font-family="Courier New, monospace" fill="#444444">json.ReportErrorsWithLegacySemantics</text>
<line x1="12" y1="544" x2="988" y2="544" stroke="#1c4b73" stroke-width="1.5"/>
<text x="24" y="568" font-size="12" fill="#555555">Options named json.* live in encoding/json (v1); jsonv2.* in encoding/json/v2; jsontext.* in encoding/json/jsontext. Later options override earlier ones.</text>
</svg>
