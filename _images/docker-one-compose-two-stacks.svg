<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>One compose.yaml, two ways to start it</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One compose.yaml, two ways to start it</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">local runs and integration tests share one definition of the environment</text>
  <rect x="250" y="55" width="260" height="60" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="81.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">compose.yaml (repository root)</text>
  <text x="380.0" y="96.0" font-size="9" fill="#333333" text-anchor="middle">postgres  kafka  wiremock  (+ observability profile)</text>
  <rect x="20" y="150" width="340" height="230" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="190.0" y="167.5" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Local run: ./mvnw spring-boot:run</text>
  <rect x="35" y="190" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="212.5" font-size="9" fill="#333333" text-anchor="middle">spring-boot-docker-compose runs docker compose up</text>
  <rect x="35" y="238" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="260.5" font-size="9" fill="#333333" text-anchor="middle">fixed host ports 5432 / 9092 / 8585 on 127.0.0.1</text>
  <rect x="35" y="286" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="308.5" font-size="9" fill="#333333" text-anchor="middle">ConnectionDetails + application-local.yaml</text>
  <rect x="35" y="334" width="310" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="354.5" font-size="9" fill="#333333" text-anchor="middle">stack keeps running between app restarts</text>
  <rect x="400" y="150" width="340" height="230" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="570.0" y="167.5" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Integration tests: mvn verify (Failsafe)</text>
  <rect x="415" y="190" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="212.5" font-size="9" fill="#333333" text-anchor="middle">AbstractIT: static ComposeContainer, started once</text>
  <rect x="415" y="238" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="260.5" font-size="9" fill="#333333" text-anchor="middle">Wait.forHealthcheck() for every service</text>
  <rect x="415" y="286" width="310" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="308.5" font-size="9" fill="#333333" text-anchor="middle">@DynamicPropertySource from getServicePort(...)</text>
  <rect x="415" y="334" width="310" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="354.5" font-size="9" fill="#333333" text-anchor="middle">skip.in-tests=true; Ryuk removes the stack</text>
  <line x1="330" y1="115" x2="190" y2="150" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="230" y="130" font-size="9.5" fill="#555555" text-anchor="middle">local profile</text>
  <line x1="430" y1="115" x2="570" y2="150" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="540" y="130" font-size="9.5" fill="#555555" text-anchor="middle">*IT classes</text>
  <text x="380" y="415" font-size="10" fill="#8f2a2a" text-anchor="middle">Never both at once: the file publishes fixed host ports, so stop the local stack before mvn verify.</text>
</svg>
