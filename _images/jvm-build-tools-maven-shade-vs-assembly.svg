<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<text x="480.0" y="28" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">Two ways to ship tidepool-cli with its dependencies (Maven 3.10.0, shade 3.6.2, assembly 3.8.0)</text>
<text x="480.0" y="48" font-size="12" fill="#666666" text-anchor="middle">Both run in the package phase and read the same resolved runtime classpath; they differ in what they write</text>
<rect x="24" y="84" width="170" height="38" rx="5" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="109" y="108" font-size="12" fill="#222222" text-anchor="middle">tidepool-cli.jar</text>
<rect x="24" y="146" width="170" height="38" rx="5" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="109" y="170" font-size="12" fill="#222222" text-anchor="middle">tidepool-engine.jar</text>
<rect x="24" y="208" width="170" height="38" rx="5" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="109" y="232" font-size="12" fill="#222222" text-anchor="middle">tidepool-model.jar</text>
<rect x="24" y="270" width="170" height="38" rx="5" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="109" y="294" font-size="12" fill="#222222" text-anchor="middle">commons-csv.jar</text>
<rect x="24" y="332" width="170" height="38" rx="5" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="109" y="356" font-size="12" fill="#222222" text-anchor="middle">picocli.jar</text>
<text x="109" y="76" font-size="12" fill="#555555" text-anchor="middle">Resolved runtime classpath</text>
<rect x="290" y="70" width="200" height="150" rx="5" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="390" y="96" font-size="14" fill="#1c4b73" text-anchor="middle" font-weight="bold">shade:shade</text>
<text x="390" y="124" font-size="11" fill="#1c4b73" text-anchor="middle">merge every entry into ONE jar</text>
<text x="390" y="146" font-size="11" fill="#1c4b73" text-anchor="middle">relocate packages</text>
<text x="390" y="168" font-size="11" fill="#1c4b73" text-anchor="middle">transform resources</text>
<text x="390" y="190" font-size="11" fill="#1c4b73" text-anchor="middle">filter signatures, minimize</text>
<rect x="290" y="260" width="200" height="150" rx="5" fill="#fbeacc" stroke="#b07a1c" stroke-width="1.3"/>
<text x="390" y="286" font-size="14" fill="#6b4a0c" text-anchor="middle" font-weight="bold">assembly:single</text>
<text x="390" y="314" font-size="11" fill="#6b4a0c" text-anchor="middle">copy or unpack by descriptor</text>
<text x="390" y="336" font-size="11" fill="#6b4a0c" text-anchor="middle">fileSets, dependencySets,</text>
<text x="390" y="358" font-size="11" fill="#6b4a0c" text-anchor="middle">moduleSets</text>
<text x="390" y="380" font-size="11" fill="#6b4a0c" text-anchor="middle">scripts, data, permissions</text>
<line x1="194" y1="103" x2="288" y2="130" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="165" x2="288" y2="150" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="227" x2="288" y2="160" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="289" x2="288" y2="310" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="351" x2="288" y2="330" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="103" x2="288" y2="300" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="194" y1="165" x2="288" y2="310" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="600" y="86" width="330" height="118" rx="5" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="765" y="112" font-size="13" fill="#14502e" text-anchor="middle" font-weight="bold">tidepool-cli-1.0.0-SNAPSHOT-all.jar</text>
<text x="765" y="136" font-size="11" fill="#14502e" text-anchor="middle">one runnable file: java -jar ...</text>
<text x="765" y="154" font-size="11" fill="#14502e" text-anchor="middle">Main-Class set by ManifestResourceTransformer</text>
<text x="765" y="172" font-size="11" fill="#14502e" text-anchor="middle">io/tidepool/shaded/picocli/... relocated</text>
<text x="765" y="190" font-size="11" fill="#14502e" text-anchor="middle">dependency-reduced POM (no dependencies)</text>
<rect x="600" y="250" width="330" height="160" rx="5" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="765" y="276" font-size="13" fill="#14502e" text-anchor="middle" font-weight="bold">tidepool-dist-1.0.0-SNAPSHOT-dist.tar.gz</text>
<text x="765" y="302" font-size="11" fill="#14502e" text-anchor="middle">tidepool-1.0.0-SNAPSHOT/</text>
<text x="765" y="322" font-size="11" fill="#14502e" text-anchor="middle">bin/tidepool.sh   (mode 0755, filtered)</text>
<text x="765" y="342" font-size="11" fill="#14502e" text-anchor="middle">lib/*.jar   (jars copied as they are)</text>
<text x="765" y="362" font-size="11" fill="#14502e" text-anchor="middle">data/stations.csv</text>
<text x="765" y="382" font-size="11" fill="#14502e" text-anchor="middle">also: zip, jar with unpack=true, other formats</text>
<line x1="490" y1="145" x2="598" y2="145" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="490" y1="335" x2="598" y2="335" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="544" y="136" font-size="10" fill="#555555" text-anchor="middle">package</text>
<text x="544" y="326" font-size="10" fill="#555555" text-anchor="middle">package</text>
<text x="480.0" y="444" font-size="12" fill="#555555" text-anchor="middle">Shade rewrites classes and resources inside one jar; assembly lays files out in an archive.</text>
</svg>
