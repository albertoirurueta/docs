<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Hybrid search: two ranked lists, fused, then re-ranked</text>
  <text x="390" y="46" font-size="12" fill="#666666" text-anchor="middle">BM25 / full-text and vector similarity searched independently, fused by rank, then narrowed by a cross-encoder</text>

  <!-- Lexical ranked list -->
  <rect x="30" y="70" width="220" height="180" rx="6" fill="#f4ece2" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="140" y="92" font-size="13" font-weight="bold" fill="#7a3b12" text-anchor="middle">Lexical (BM25)</text>
  <text x="140" y="108" font-size="10.5" fill="#9c623a" text-anchor="middle">FTS5 bm25() / ts_rank_cd(tsv, q)</text>
  <text x="50" y="130" font-size="11" fill="#333333">1. chunk 7  "ef_search"</text>
  <text x="50" y="150" font-size="11" fill="#333333">2. chunk 22 "ef_construction"</text>
  <text x="50" y="170" font-size="11" fill="#333333">3. chunk 3  "HNSW"</text>
  <text x="50" y="190" font-size="11" fill="#333333">4. chunk 41 "ANN index"</text>
  <text x="50" y="210" font-size="11" fill="#333333">5. chunk 9  "recall"</text>
  <text x="140" y="236" font-size="10" fill="#8a8a8a" text-anchor="middle">exact-term precision, blind to synonyms</text>

  <!-- Semantic ranked list -->
  <rect x="530" y="70" width="220" height="180" rx="6" fill="#eaf1f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="640" y="92" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Semantic (vector)</text>
  <text x="640" y="108" font-size="10.5" fill="#5a7690" text-anchor="middle">embedding &lt;=&gt; query_embedding</text>
  <text x="550" y="130" font-size="11" fill="#333333">1. chunk 22 0.91 cos</text>
  <text x="550" y="150" font-size="11" fill="#333333">2. chunk 3  0.88 cos</text>
  <text x="550" y="170" font-size="11" fill="#333333">3. chunk 9  0.85 cos</text>
  <text x="550" y="190" font-size="11" fill="#333333">4. chunk 12 0.83 cos</text>
  <text x="550" y="210" font-size="11" fill="#333333">5. chunk 7  0.80 cos</text>
  <text x="640" y="236" font-size="10" fill="#8a8a8a" text-anchor="middle">recall for paraphrases, blurs identifiers</text>

  <!-- Arrows into fusion -->
  <line x1="200" y1="250" x2="330" y2="300" stroke="#8a7a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="250" x2="450" y2="300" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a7a5c"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b4d33"/>
    </marker>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <!-- Fusion box -->
  <rect x="255" y="300" width="270" height="70" rx="6" fill="#f0ede7" stroke="#8a7a5c" stroke-width="1.5"/>
  <text x="390" y="324" font-size="13" font-weight="bold" fill="#5b4d33" text-anchor="middle">Score fusion</text>
  <text x="390" y="342" font-size="10.5" fill="#5b4d33" text-anchor="middle">weighted linear (0.7 / 0.3, normalized) or</text>
  <text x="390" y="358" font-size="10.5" fill="#5b4d33" text-anchor="middle">Reciprocal Rank Fusion, k = 60</text>

  <!-- Fused list, narrowing funnel -->
  <polygon points="270,385 510,385 460,430 320,430" fill="#eef2ea" stroke="#5b4d33" stroke-width="1"/>
  <text x="390" y="404" font-size="10.5" fill="#3f6b31" text-anchor="middle">fused top-20 candidates</text>

  <line x1="390" y1="370" x2="390" y2="385" stroke="#5b4d33" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="390" y1="430" x2="390" y2="450" stroke="#2f5424" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- Re-rank funnel result -->
  <rect x="270" y="450" width="240" height="0" fill="none"/>
  <rect x="130" y="450" width="520" height="26" rx="6" fill="#eef7ec" stroke="#2f5424" stroke-width="1.5"/>
  <text x="390" y="468" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Cross-encoder re-rank -> top-5, diversified with MMR</text>
</svg>
