<svg viewBox="0 0 740 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="400" fill="#ffffff"/>

  <text x="370" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">any, unknown and never in the assignability lattice</text>
  <text x="370" y="48" font-size="12" fill="#666666" text-anchor="middle">Which way values are allowed to flow between each special type and every other type</text>

  <!-- panel dividers -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="260" y1="62" x2="260" y2="360"/>
    <line x1="500" y1="62" x2="500" y2="360"/>
  </g>

  <!-- ============ Panel 1: unknown ============ -->
  <g>
    <rect x="65" y="76" width="150" height="44" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="140" y="104" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#1c4b73" text-anchor="middle">unknown</text>
    <text x="140" y="138" font-size="11" fill="#444444" text-anchor="middle" font-weight="bold">safe top type</text>

    <!-- arrow IN only: node -> unknown -->
    <g stroke="#1c4b73" stroke-width="1.6" fill="#1c4b73">
      <line x1="140" y1="242" x2="140" y2="150"/>
      <polygon points="134,158 146,158 140,146" stroke="none"/>
    </g>
    <text x="150" y="188" font-size="10" fill="#444444">every value is</text>
    <text x="150" y="200" font-size="10" fill="#444444">assignable to it</text>

    <rect x="52" y="246" width="176" height="40" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <text x="140" y="264" font-size="11" fill="#222222" text-anchor="middle">every other type</text>
    <text x="140" y="278" font-family="'Courier New', monospace" font-size="10" fill="#666666" text-anchor="middle">string  number  T[]  {}</text>

    <g font-size="10.5" fill="#444444">
      <text x="52" y="312"><tspan font-weight="bold">=</tspan> holds any value, but is</text>
      <text x="52" y="326">assignable to nothing until</text>
      <text x="52" y="340">you narrow it with a guard.</text>
    </g>
  </g>

  <!-- ============ Panel 2: any ============ -->
  <g>
    <rect x="305" y="76" width="150" height="44" fill="#f4f4f4" stroke="#8a3d10" stroke-width="1.4"/>
    <text x="380" y="104" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#8a3d10" text-anchor="middle">any</text>
    <text x="380" y="138" font-size="11" fill="#444444" text-anchor="middle" font-weight="bold">escape hatch</text>

    <!-- arrows BOTH ways -->
    <g stroke="#8a3d10" stroke-width="1.6" fill="#8a3d10">
      <line x1="366" y1="242" x2="366" y2="150"/>
      <polygon points="360,158 372,158 366,146" stroke="none"/>
      <line x1="394" y1="150" x2="394" y2="242"/>
      <polygon points="388,234 400,234 394,246" stroke="none"/>
    </g>
    <text x="380" y="186" font-size="10" fill="#8a3d10" text-anchor="middle" font-weight="bold">unsafe</text>
    <text x="380" y="199" font-size="10" fill="#444444" text-anchor="middle">disables checking</text>
    <text x="380" y="211" font-size="10" fill="#444444" text-anchor="middle">in both directions</text>

    <rect x="292" y="246" width="176" height="40" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <text x="380" y="264" font-size="11" fill="#222222" text-anchor="middle">every other type</text>
    <text x="380" y="278" font-family="'Courier New', monospace" font-size="10" fill="#666666" text-anchor="middle">string  number  T[]  {}</text>

    <g font-size="10.5" fill="#444444">
      <text x="292" y="312"><tspan font-weight="bold">=</tspan> flows to and from every</text>
      <text x="292" y="326">type unchecked. Keep it at the</text>
      <text x="292" y="340">narrowest possible scope.</text>
    </g>
  </g>

  <!-- ============ Panel 3: never ============ -->
  <g>
    <rect x="545" y="76" width="150" height="44" fill="#f4f4f4" stroke="#7a2f6a" stroke-width="1.4"/>
    <text x="620" y="104" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#7a2f6a" text-anchor="middle">never</text>
    <text x="620" y="138" font-size="11" fill="#444444" text-anchor="middle" font-weight="bold">bottom type / empty set</text>

    <!-- arrow OUT only: never -> node -->
    <g stroke="#7a2f6a" stroke-width="1.6" fill="#7a2f6a">
      <line x1="620" y1="150" x2="620" y2="242"/>
      <polygon points="614,234 626,234 620,246" stroke="none"/>
    </g>
    <text x="630" y="188" font-size="10" fill="#444444">assignable to</text>
    <text x="630" y="200" font-size="10" fill="#444444">every type</text>

    <rect x="532" y="246" width="176" height="40" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <text x="620" y="264" font-size="11" fill="#222222" text-anchor="middle">every other type</text>
    <text x="620" y="278" font-family="'Courier New', monospace" font-size="10" fill="#666666" text-anchor="middle">string  number  T[]  {}</text>

    <g font-size="10.5" fill="#444444">
      <text x="532" y="312"><tspan font-weight="bold">=</tspan> no value has this type, so</text>
      <text x="532" y="326">nothing is assignable to it and</text>
      <text x="532" y="340">any branch making one is dead.</text>
    </g>
  </g>

  <text x="370" y="384" font-family="'Courier New', monospace" font-size="11" fill="#222222" text-anchor="middle">every type &#8594; unknown       never &#8594; every type       any &#8592;&#8594; every type (unsafe)</text>
</svg>
