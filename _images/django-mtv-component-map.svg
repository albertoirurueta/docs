<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Django component map: MTV and the batteries around it</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">a request enters on the left of the top row, is dispatched to a view, and the response travels back out</text>

  <!-- Row 1: request path -->
  <rect x="20" y="62" width="110" height="56" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="75" y="86" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Client</text>
  <text x="75" y="104" font-size="10" fill="#444444" text-anchor="middle">browser, curl, API</text>

  <rect x="170" y="62" width="140" height="56" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="240" y="86" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">WSGI / ASGI server</text>
  <text x="240" y="104" font-size="10" fill="#444444" text-anchor="middle">Gunicorn, Uvicorn, Daphne</text>

  <rect x="350" y="62" width="150" height="56" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="425" y="86" font-size="13" font-weight="bold" fill="#7a4a00" text-anchor="middle">Middleware</text>
  <text x="425" y="104" font-size="10" fill="#444444" text-anchor="middle">MIDDLEWARE, in order</text>

  <rect x="540" y="62" width="160" height="56" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="620" y="86" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">URL dispatcher</text>
  <text x="620" y="104" font-size="10" fill="#444444" text-anchor="middle">ROOT_URLCONF, path()</text>

  <line x1="130" y1="90" x2="164" y2="90" stroke="#444444" stroke-width="1.4"/>
  <polygon points="168,90 160,85 160,95" fill="#444444"/>
  <line x1="310" y1="90" x2="344" y2="90" stroke="#444444" stroke-width="1.4"/>
  <polygon points="348,90 340,85 340,95" fill="#444444"/>
  <line x1="500" y1="90" x2="534" y2="90" stroke="#444444" stroke-width="1.4"/>
  <polygon points="538,90 530,85 530,95" fill="#444444"/>

  <!-- Return path -->
  <line x1="425" y1="134" x2="75" y2="134" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="75" y1="134" x2="75" y2="124" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,3"/>
  <polygon points="75,120 70,128 80,128" fill="#666666"/>
  <line x1="425" y1="134" x2="425" y2="124" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="250" y="150" font-size="10" fill="#666666" text-anchor="middle">HttpResponse goes back out through the middleware in reverse order</text>

  <!-- URL dispatcher -> View -->
  <line x1="620" y1="118" x2="620" y2="176" stroke="#1c4b73" stroke-width="1.4"/>
  <polygon points="620,180 615,172 625,172" fill="#1c4b73"/>

  <!-- View -->
  <rect x="540" y="180" width="160" height="70" fill="#f4f4f4" stroke="#2f5424" stroke-width="2"/>
  <text x="620" y="204" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">V = View</text>
  <text x="620" y="222" font-size="10" fill="#444444" text-anchor="middle">function or class that decides</text>
  <text x="620" y="236" font-size="10" fill="#444444" text-anchor="middle">which data is presented (sync or async)</text>

  <!-- Template -->
  <rect x="350" y="180" width="150" height="70" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="2"/>
  <text x="425" y="204" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">T = Template</text>
  <text x="425" y="222" font-size="10" fill="#444444" text-anchor="middle">how it is presented:</text>
  <text x="425" y="236" font-size="10" fill="#444444" text-anchor="middle">DTL or Jinja2, HTML or text</text>
  <line x1="540" y1="215" x2="506" y2="215" stroke="#8a1f1f" stroke-width="1.4"/>
  <polygon points="502,215 510,210 510,220" fill="#8a1f1f"/>
  <text x="522" y="207" font-size="9" fill="#666666" text-anchor="middle">context</text>

  <!-- Forms -->
  <rect x="350" y="296" width="150" height="56" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="425" y="320" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Forms</text>
  <text x="425" y="338" font-size="10" fill="#444444" text-anchor="middle">validate and render input</text>
  <line x1="580" y1="250" x2="580" y2="266" stroke="#444444" stroke-width="1.2"/>
  <line x1="580" y1="266" x2="462" y2="266" stroke="#444444" stroke-width="1.2"/>
  <line x1="462" y1="266" x2="462" y2="290" stroke="#444444" stroke-width="1.2"/>
  <polygon points="462,294 457,286 467,286" fill="#444444"/>

  <!-- Model -->
  <rect x="540" y="296" width="160" height="70" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="620" y="320" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">M = Model + ORM</text>
  <text x="620" y="338" font-size="10" fill="#444444" text-anchor="middle">fields, managers, QuerySets,</text>
  <text x="620" y="352" font-size="10" fill="#444444" text-anchor="middle">migrations, validation</text>
  <line x1="640" y1="250" x2="640" y2="290" stroke="#1c4b73" stroke-width="1.4"/>
  <polygon points="640,294 635,286 645,286" fill="#1c4b73"/>
  <line x1="500" y1="326" x2="534" y2="326" stroke="#444444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="538,326 530,321 530,331" fill="#444444"/>

  <!-- Database -->
  <rect x="540" y="400" width="160" height="46" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="620" y="421" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Database</text>
  <text x="620" y="436" font-size="10" fill="#444444" text-anchor="middle">PostgreSQL, MySQL, SQLite ...</text>
  <line x1="620" y1="366" x2="620" y2="394" stroke="#444444" stroke-width="1.4"/>
  <polygon points="620,398 615,390 625,390" fill="#444444"/>

  <!-- contrib panel -->
  <rect x="20" y="180" width="310" height="266" fill="#ffffff" stroke="#2f5424" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="175" y="202" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">django.contrib: the batteries</text>
  <text x="175" y="218" font-size="10" fill="#666666" text-anchor="middle">optional apps, enabled through INSTALLED_APPS</text>

  <rect x="36" y="232" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="79" y="251" font-size="11" fill="#222222" text-anchor="middle">admin</text>
  <rect x="130" y="232" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="173" y="251" font-size="11" fill="#222222" text-anchor="middle">auth</text>
  <rect x="224" y="232" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="267" y="251" font-size="11" fill="#222222" text-anchor="middle">sessions</text>

  <rect x="36" y="272" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="79" y="291" font-size="11" fill="#222222" text-anchor="middle">messages</text>
  <rect x="130" y="272" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="173" y="291" font-size="11" fill="#222222" text-anchor="middle">staticfiles</text>
  <rect x="224" y="272" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="267" y="291" font-size="11" fill="#222222" text-anchor="middle">contenttypes</text>

  <rect x="36" y="312" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="79" y="331" font-size="11" fill="#222222" text-anchor="middle">sites</text>
  <rect x="130" y="312" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="173" y="331" font-size="11" fill="#222222" text-anchor="middle">sitemaps</text>
  <rect x="224" y="312" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="267" y="331" font-size="11" fill="#222222" text-anchor="middle">syndication</text>

  <rect x="36" y="352" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="79" y="371" font-size="11" fill="#222222" text-anchor="middle">flatpages</text>
  <rect x="130" y="352" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="173" y="371" font-size="11" fill="#222222" text-anchor="middle">redirects</text>
  <rect x="224" y="352" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="267" y="371" font-size="11" fill="#222222" text-anchor="middle">humanize</text>

  <rect x="36" y="392" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="79" y="411" font-size="11" fill="#222222" text-anchor="middle">gis</text>
  <rect x="130" y="392" width="86" height="30" fill="#f4f4f4" stroke="#2f5424"/>
  <text x="173" y="411" font-size="11" fill="#222222" text-anchor="middle">postgres</text>
  <text x="267" y="411" font-size="10" fill="#666666" text-anchor="middle">+ your own apps</text>

  <text x="175" y="438" font-size="9" fill="#666666" text-anchor="middle">the admin is generated from your models</text>
</svg>
