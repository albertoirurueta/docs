<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-compute-edges" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">1,000 elements with threadgroups of 256</text>
<text x="80" y="60" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">dispatchThreadgroups: 4 groups x 256 = 1,024 threads</text>
<rect x="80" y="70" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="155.0" y="100" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="230.0" y="70" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="305.0" y="100" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="380.0" y="70" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="455.0" y="100" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="530.0" y="70" width="135.9375" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="597.96875" y="100" text-anchor="middle" font-size="11" fill="#1F2937">232</text>
<defs><pattern id="hatch665" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B45309" stroke-width="2"/></pattern></defs>
<rect x="665.9375" y="70" width="14.0625" height="50" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="665.9375" y="70" width="14.0625" height="50" fill="url(#hatch665)" opacity="0.5"/>
<text x="672.96875" y="100" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">24</text>
<text x="80" y="150" text-anchor="start" font-size="11" fill="#92400E">24 threads have gid &gt;= 1000, so the kernel needs  if (gid &gt;= count) return;</text>
<text x="80" y="216" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">dispatchThreads: grid = 1,000, group = 256</text>
<rect x="80" y="226" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="155.0" y="256" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="230.0" y="226" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="305.0" y="256" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="380.0" y="226" width="150.0" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="455.0" y="256" text-anchor="middle" font-size="11" fill="#1F2937">256</text>
<rect x="530.0" y="226" width="135.9375" height="50" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="597.96875" y="256" text-anchor="middle" font-size="11" fill="#1F2937">232</text>
<text x="80" y="306" text-anchor="start" font-size="11" fill="#047857">The last group is just smaller: no wasted threads and no guard (Apple4 and later).</text>
<rect x="30" y="330" width="700" height="84" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="352" text-anchor="middle" font-size="11" fill="#1F2937">Inside the kernel, thread_position_in_grid is always &lt; threads_per_grid with dispatchThreads.</text>
<text x="380" y="370" text-anchor="middle" font-size="11" fill="#374151">threads_per_threadgroup reports the real size of the group (232 in the last one);</text>
<text x="380" y="386" text-anchor="middle" font-size="11" fill="#374151">dispatch_threads_per_threadgroup still reports the size you asked for (256).</text>
<text x="380" y="404" text-anchor="middle" font-size="11" fill="#374151">SIMD-group functions still work in the smaller group: its last SIMD-group just has fewer active lanes.</text>
</svg>
