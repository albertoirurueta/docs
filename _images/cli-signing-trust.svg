<svg viewBox="0 0 1010 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="1010" height="560" fill="#ffffff"/>
<text x="505.0" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Trust chain of a downloaded shelf binary on each OS</text>
<text x="505.0" y="50" font-size="13" fill="#555555" text-anchor="middle">The publisher signs once; the user machine decides at first launch or install time</text>
<defs>
<marker id="a-macOS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
<marker id="a-Windows" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/></marker>
<marker id="a-Linux" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4a12"/></marker>
</defs>
<rect x="10" y="70" width="990" height="135" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
<text x="75" y="142" font-size="17" font-weight="bold" fill="#1c4b73" text-anchor="middle">macOS</text>
<rect x="140" y="85" width="150" height="105" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
<text x="215" y="107" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Build</text>
<text x="215" y="130" font-size="11.5" fill="#222222" text-anchor="middle">shelf (Mach-O)</text>
<text x="215" y="148" font-size="11.5" fill="#222222" text-anchor="middle">arm64 + x86_64</text>
<line x1="290" y1="137" x2="313" y2="137" stroke="#1c4b73" stroke-width="2" marker-end="url(#a-macOS)"/>
<rect x="315" y="85" width="150" height="105" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
<text x="390" y="107" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Sign</text>
<text x="390" y="130" font-size="11.5" fill="#222222" text-anchor="middle">codesign --options</text>
<text x="390" y="148" font-size="11.5" fill="#222222" text-anchor="middle">runtime --timestamp</text>
<text x="390" y="166" font-size="11.5" fill="#222222" text-anchor="middle">Developer ID App.</text>
<line x1="465" y1="137" x2="488" y2="137" stroke="#1c4b73" stroke-width="2" marker-end="url(#a-macOS)"/>
<rect x="490" y="85" width="150" height="105" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
<text x="565" y="107" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Notarize</text>
<text x="565" y="130" font-size="11.5" fill="#222222" text-anchor="middle">notarytool submit</text>
<text x="565" y="148" font-size="11.5" fill="#222222" text-anchor="middle">zip, pkg or dmg</text>
<text x="565" y="166" font-size="11.5" fill="#222222" text-anchor="middle">Apple scans, tickets</text>
<line x1="640" y1="137" x2="663" y2="137" stroke="#1c4b73" stroke-width="2" marker-end="url(#a-macOS)"/>
<rect x="665" y="85" width="150" height="105" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
<text x="740" y="107" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Ship</text>
<text x="740" y="130" font-size="11.5" fill="#222222" text-anchor="middle">pkg / dmg: stapled</text>
<text x="740" y="148" font-size="11.5" fill="#222222" text-anchor="middle">bare binary: cannot</text>
<text x="740" y="166" font-size="11.5" fill="#222222" text-anchor="middle">be stapled</text>
<line x1="815" y1="137" x2="838" y2="137" stroke="#1c4b73" stroke-width="2" marker-end="url(#a-macOS)"/>
<rect x="840" y="85" width="150" height="105" rx="7" fill="#ffffff" stroke="#1c4b73" stroke-width="2.4"/>
<text x="915" y="107" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Client check</text>
<text x="915" y="130" font-size="11.5" fill="#222222" text-anchor="middle">Gatekeeper checks a</text>
<text x="915" y="148" font-size="11.5" fill="#222222" text-anchor="middle">quarantined file:</text>
<text x="915" y="166" font-size="11.5" fill="#222222" text-anchor="middle">signature + ticket</text>
<rect x="10" y="220" width="990" height="135" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
<text x="75" y="292" font-size="17" font-weight="bold" fill="#2d6a34" text-anchor="middle">Windows</text>
<rect x="140" y="235" width="150" height="105" rx="7" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
<text x="215" y="257" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Build</text>
<text x="215" y="280" font-size="11.5" fill="#222222" text-anchor="middle">shelf.exe</text>
<text x="215" y="298" font-size="11.5" fill="#222222" text-anchor="middle">x64 / arm64</text>
<line x1="290" y1="287" x2="313" y2="287" stroke="#2d6a34" stroke-width="2" marker-end="url(#a-Windows)"/>
<rect x="315" y="235" width="150" height="105" rx="7" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
<text x="390" y="257" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Sign</text>
<text x="390" y="280" font-size="11.5" fill="#222222" text-anchor="middle">signtool sign /fd</text>
<text x="390" y="298" font-size="11.5" fill="#222222" text-anchor="middle">SHA256 /tr /td</text>
<text x="390" y="316" font-size="11.5" fill="#222222" text-anchor="middle">OV, EV or cloud cert</text>
<line x1="465" y1="287" x2="488" y2="287" stroke="#2d6a34" stroke-width="2" marker-end="url(#a-Windows)"/>
<rect x="490" y="235" width="150" height="105" rx="7" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
<text x="565" y="257" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Timestamp</text>
<text x="565" y="280" font-size="11.5" fill="#222222" text-anchor="middle">RFC 3161 server</text>
<text x="565" y="298" font-size="11.5" fill="#222222" text-anchor="middle">signature outlives</text>
<text x="565" y="316" font-size="11.5" fill="#222222" text-anchor="middle">the certificate</text>
<line x1="640" y1="287" x2="663" y2="287" stroke="#2d6a34" stroke-width="2" marker-end="url(#a-Windows)"/>
<rect x="665" y="235" width="150" height="105" rx="7" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
<text x="740" y="257" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Ship</text>
<text x="740" y="280" font-size="11.5" fill="#222222" text-anchor="middle">zip, MSI, MSIX,</text>
<text x="740" y="298" font-size="11.5" fill="#222222" text-anchor="middle">winget manifest</text>
<text x="740" y="316" font-size="11.5" fill="#222222" text-anchor="middle">(hash of signed file)</text>
<line x1="815" y1="287" x2="838" y2="287" stroke="#2d6a34" stroke-width="2" marker-end="url(#a-Windows)"/>
<rect x="840" y="235" width="150" height="105" rx="7" fill="#ffffff" stroke="#2d6a34" stroke-width="2.4"/>
<text x="915" y="257" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Client check</text>
<text x="915" y="280" font-size="11.5" fill="#222222" text-anchor="middle">SmartScreen on a</text>
<text x="915" y="298" font-size="11.5" fill="#222222" text-anchor="middle">downloaded file:</text>
<text x="915" y="316" font-size="11.5" fill="#222222" text-anchor="middle">reputation + signer</text>
<rect x="10" y="370" width="990" height="135" rx="10" fill="#fbf3e6" stroke="#7a4a12" stroke-width="1.4"/>
<text x="75" y="442" font-size="17" font-weight="bold" fill="#7a4a12" text-anchor="middle">Linux</text>
<rect x="140" y="385" width="150" height="105" rx="7" fill="#ffffff" stroke="#7a4a12" stroke-width="1.2"/>
<text x="215" y="407" font-size="14" font-weight="bold" fill="#7a4a12" text-anchor="middle">Build</text>
<text x="215" y="430" font-size="11.5" fill="#222222" text-anchor="middle">shelf (ELF)</text>
<text x="215" y="448" font-size="11.5" fill="#222222" text-anchor="middle">glibc or static musl</text>
<line x1="290" y1="437" x2="313" y2="437" stroke="#7a4a12" stroke-width="2" marker-end="url(#a-Linux)"/>
<rect x="315" y="385" width="150" height="105" rx="7" fill="#ffffff" stroke="#7a4a12" stroke-width="1.2"/>
<text x="390" y="407" font-size="14" font-weight="bold" fill="#7a4a12" text-anchor="middle">Checksum</text>
<text x="390" y="430" font-size="11.5" fill="#222222" text-anchor="middle">SHA256SUMS</text>
<text x="390" y="448" font-size="11.5" fill="#222222" text-anchor="middle">one line per</text>
<text x="390" y="466" font-size="11.5" fill="#222222" text-anchor="middle">archive</text>
<line x1="465" y1="437" x2="488" y2="437" stroke="#7a4a12" stroke-width="2" marker-end="url(#a-Linux)"/>
<rect x="490" y="385" width="150" height="105" rx="7" fill="#ffffff" stroke="#7a4a12" stroke-width="1.2"/>
<text x="565" y="407" font-size="14" font-weight="bold" fill="#7a4a12" text-anchor="middle">Sign</text>
<text x="565" y="430" font-size="11.5" fill="#222222" text-anchor="middle">cosign sign-blob</text>
<text x="565" y="448" font-size="11.5" fill="#222222" text-anchor="middle">--bundle, or GPG</text>
<text x="565" y="466" font-size="11.5" fill="#222222" text-anchor="middle">detached signature</text>
<line x1="640" y1="437" x2="663" y2="437" stroke="#7a4a12" stroke-width="2" marker-end="url(#a-Linux)"/>
<rect x="665" y="385" width="150" height="105" rx="7" fill="#ffffff" stroke="#7a4a12" stroke-width="1.2"/>
<text x="740" y="407" font-size="14" font-weight="bold" fill="#7a4a12" text-anchor="middle">Publish</text>
<text x="740" y="430" font-size="11.5" fill="#222222" text-anchor="middle">GitHub release,</text>
<text x="740" y="448" font-size="11.5" fill="#222222" text-anchor="middle">apt / dnf repo</text>
<text x="740" y="466" font-size="11.5" fill="#222222" text-anchor="middle">(signed metadata)</text>
<line x1="815" y1="437" x2="838" y2="437" stroke="#7a4a12" stroke-width="2" marker-end="url(#a-Linux)"/>
<rect x="840" y="385" width="150" height="105" rx="7" fill="#ffffff" stroke="#7a4a12" stroke-width="2.4"/>
<text x="915" y="407" font-size="14" font-weight="bold" fill="#7a4a12" text-anchor="middle">Client check</text>
<text x="915" y="430" font-size="11.5" fill="#222222" text-anchor="middle">no OS-wide gate:</text>
<text x="915" y="448" font-size="11.5" fill="#222222" text-anchor="middle">apt checks Release,</text>
<text x="915" y="466" font-size="11.5" fill="#222222" text-anchor="middle">you run verify-blob</text>
<text x="505.0" y="535" font-size="12" fill="#555555" text-anchor="middle">Heavy outline = the check performed on the user machine. Checksums prove integrity only; signatures prove who published.</text>
</svg>