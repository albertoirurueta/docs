<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Retry pattern shapes: Kafka retry-topic ladder vs. RabbitMQ TTL+DLX loop</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">the visual shape itself is the contrast -- a straight ladder of distinct topics vs. a loop through one reused wait queue</text>

  <!-- LEFT: Kafka ladder -->
  <text x="195" y="66" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kafka: retry-topic ladder</text>

  <rect x="95" y="80" width="200" height="40" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="195" y="105" font-size="11.5" fill="#1c4b73" text-anchor="middle">main topic: orders</text>

  <line x1="195" y1="120" x2="195" y2="144" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowK)"/>
  <text x="255" y="136" font-size="8.5" fill="#777777" text-anchor="start">processing fails</text>

  <rect x="95" y="144" width="200" height="40" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="195" y="163" font-size="11" fill="#222222" text-anchor="middle">orders-retry-1</text>
  <text x="195" y="177" font-size="9" fill="#666666" text-anchor="middle">short delay (e.g. 30s)</text>

  <line x1="195" y1="184" x2="195" y2="208" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowK)"/>

  <rect x="95" y="208" width="200" height="40" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="195" y="227" font-size="11" fill="#222222" text-anchor="middle">orders-retry-2</text>
  <text x="195" y="241" font-size="9" fill="#666666" text-anchor="middle">longer delay (e.g. 5m)</text>

  <line x1="195" y1="248" x2="195" y2="272" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowK)"/>

  <rect x="95" y="272" width="200" height="40" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="195" y="291" font-size="11" fill="#222222" text-anchor="middle">orders-retry-3</text>
  <text x="195" y="305" font-size="9" fill="#666666" text-anchor="middle">longer delay still (e.g. 30m)</text>

  <line x1="195" y1="312" x2="195" y2="336" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowK)"/>
  <text x="255" y="328" font-size="8.5" fill="#777777" text-anchor="start">levels exhausted</text>

  <rect x="95" y="336" width="200" height="40" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="195" y="361" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">orders-dlq</text>

  <text x="30" y="404" font-size="9.5" fill="#666666">Each attempt lives on its own topic, consumed by</text>
  <text x="30" y="418" font-size="9.5" fill="#666666">its own consumer loop -- attempt number is implicit</text>
  <text x="30" y="432" font-size="9.5" fill="#666666">in which topic the record currently sits on.</text>

  <!-- divider -->
  <line x1="390" y1="60" x2="390" y2="440" stroke="#cccccc" stroke-width="1"/>

  <!-- RIGHT: RabbitMQ loop -->
  <text x="585" y="66" font-size="12.5" font-weight="bold" fill="#a33333" text-anchor="middle">RabbitMQ: TTL + DLX loop</text>

  <rect x="485" y="86" width="200" height="40" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="585" y="111" font-size="11.5" fill="#1c4b73" text-anchor="middle">work queue: orders</text>

  <line x1="605" y1="126" x2="655" y2="176" stroke="#a33333" stroke-width="1.4" marker-end="url(#arrowR)"/>
  <text x="668" y="150" font-size="8.5" fill="#777777" text-anchor="start">nack /</text>
  <text x="668" y="162" font-size="8.5" fill="#777777" text-anchor="start">reject</text>

  <rect x="560" y="176" width="150" height="46" fill="#fff6e6" stroke="#a37a1c" stroke-width="1.2"/>
  <text x="635" y="197" font-size="11" fill="#7a5a12" text-anchor="middle">wait queue</text>
  <text x="635" y="211" font-size="9" fill="#7a5a12" text-anchor="middle">per-message TTL</text>

  <line x1="600" y1="222" x2="540" y2="272" stroke="#a33333" stroke-width="1.4" marker-end="url(#arrowR)"/>
  <text x="500" y="248" font-size="8.5" fill="#777777" text-anchor="start">TTL</text>
  <text x="490" y="260" font-size="8.5" fill="#777777" text-anchor="start">expires</text>

  <rect x="460" y="272" width="150" height="46" fill="#f2e9fa" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="535" y="293" font-size="11" fill="#4a2570" text-anchor="middle">retry DLX</text>
  <text x="535" y="307" font-size="9" fill="#4a2570" text-anchor="middle">routes back to work queue</text>

  <path d="M 460 295 C 400 295 400 200 480 106" fill="none" stroke="#a33333" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="410" y="200" font-size="8.5" fill="#777777" text-anchor="middle">back into</text>
  <text x="410" y="212" font-size="8.5" fill="#777777" text-anchor="middle">work queue</text>

  <line x1="585" y1="318" x2="585" y2="356" stroke="#a33333" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="600" y="342" font-size="8.5" fill="#777777" text-anchor="start">delivery-limit</text>
  <text x="600" y="354" font-size="8.5" fill="#777777" text-anchor="start">exceeded</text>

  <rect x="485" y="356" width="200" height="40" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="585" y="381" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">true dead-letter queue</text>

  <text x="420" y="418" font-size="9.5" fill="#666666">The same one or two queues are reused for every</text>
  <text x="420" y="432" font-size="9.5" fill="#666666">retry attempt -- attempt number is tracked explicitly,</text>
  <text x="420" y="446" font-size="9.5" fill="#666666">e.g. from the x-death header's own delivery count.</text>

  <defs>
    <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a33333"/>
    </marker>
  </defs>
</svg>
