<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="540" fill="#ffffff"/>

  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf site at a glance</text>
  <text x="410" y="44" font-size="12" fill="#666666" text-anchor="middle">the running scenario of the Django section, from browser to database</text>

  <!-- Clients -->
  <rect x="20" y="70" width="130" height="170" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="85" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="85" y="118" font-size="11" fill="#444444" text-anchor="middle">Browser (HTML, htmx)</text>
  <text x="85" y="138" font-size="11" fill="#444444" text-anchor="middle">Staff in the admin</text>
  <text x="85" y="158" font-size="11" fill="#444444" text-anchor="middle">API clients, curl</text>
  <text x="85" y="178" font-size="11" fill="#444444" text-anchor="middle">Feed readers</text>
  <text x="85" y="204" font-size="10" fill="#666666" text-anchor="middle">HTTP, SSE,</text>
  <text x="85" y="218" font-size="10" fill="#666666" text-anchor="middle">WebSocket</text>

  <!-- Proxy + servers -->
  <rect x="180" y="70" width="140" height="170" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="250" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Reverse proxy</text>
  <text x="250" y="112" font-size="10" fill="#666666" text-anchor="middle">NGINX: TLS, /media/</text>
  <line x1="195" y1="124" x2="305" y2="124" stroke="#bbbbbb" stroke-width="1"/>
  <text x="250" y="146" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">App servers</text>
  <text x="250" y="166" font-size="11" fill="#444444" text-anchor="middle">Gunicorn (WSGI)</text>
  <text x="250" y="184" font-size="11" fill="#444444" text-anchor="middle">Uvicorn (ASGI)</text>
  <text x="250" y="202" font-size="11" fill="#444444" text-anchor="middle">Daphne (Channels)</text>
  <text x="250" y="224" font-size="10" fill="#666666" text-anchor="middle">WhiteNoise: /static/</text>

  <line x1="150" y1="155" x2="174" y2="155" stroke="#444444" stroke-width="1.4"/>
  <polygon points="180,155 172,150 172,160" fill="#444444"/>

  <!-- Django project -->
  <rect x="350" y="62" width="450" height="300" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="575" y="84" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Bookshelf Django project (config/)</text>

  <rect x="364" y="96" width="422" height="44" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.2"/>
  <text x="575" y="114" font-size="11" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Middleware</text>
  <text x="575" y="130" font-size="10" fill="#444444" text-anchor="middle">security, sessions, locale, CSRF, authentication, messages, CSP</text>

  <rect x="364" y="150" width="422" height="30" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="575" y="169" font-size="11" fill="#222222" text-anchor="middle">URLconf (config/urls.py) and i18n URL patterns</text>

  <rect x="364" y="190" width="100" height="78" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="414" y="208" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">catalog</text>
  <text x="414" y="224" font-size="9" fill="#444444" text-anchor="middle">books, authors</text>
  <text x="414" y="238" font-size="9" fill="#444444" text-anchor="middle">search, pages</text>
  <text x="414" y="252" font-size="9" fill="#444444" text-anchor="middle">sitemap, feed</text>

  <rect x="472" y="190" width="100" height="78" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="522" y="208" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">accounts</text>
  <text x="522" y="224" font-size="9" fill="#444444" text-anchor="middle">custom user</text>
  <text x="522" y="238" font-size="9" fill="#444444" text-anchor="middle">email login</text>
  <text x="522" y="252" font-size="9" fill="#444444" text-anchor="middle">sign-up, reset</text>

  <rect x="580" y="190" width="100" height="78" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="630" y="208" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">reviews</text>
  <text x="630" y="224" font-size="9" fill="#444444" text-anchor="middle">forms, moderation</text>
  <text x="630" y="238" font-size="9" fill="#444444" text-anchor="middle">SSE live feed</text>
  <text x="630" y="252" font-size="9" fill="#444444" text-anchor="middle">WebSocket consumer</text>

  <rect x="688" y="190" width="98" height="78" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="737" y="208" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">api</text>
  <text x="737" y="224" font-size="9" fill="#444444" text-anchor="middle">DRF, versioned</text>
  <text x="737" y="238" font-size="9" fill="#444444" text-anchor="middle">Ninja variant</text>
  <text x="737" y="252" font-size="9" fill="#444444" text-anchor="middle">OpenAPI schema</text>

  <rect x="364" y="278" width="206" height="72" fill="#ffffff" stroke="#7a4a00" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="467" y="296" font-size="11" font-weight="bold" fill="#7a4a00" text-anchor="middle">Models and the ORM</text>
  <text x="467" y="312" font-size="10" fill="#444444" text-anchor="middle">managers, QuerySets, migrations</text>
  <text x="467" y="328" font-size="10" fill="#444444" text-anchor="middle">permissions, signals</text>

  <rect x="580" y="278" width="206" height="72" fill="#ffffff" stroke="#7a4a00" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="683" y="296" font-size="11" font-weight="bold" fill="#7a4a00" text-anchor="middle">Templates and the admin</text>
  <text x="683" y="312" font-size="10" fill="#444444" text-anchor="middle">DTL templates, partials, i18n (en, es)</text>
  <text x="683" y="328" font-size="10" fill="#444444" text-anchor="middle">staff curation in django.contrib.admin</text>

  <line x1="320" y1="155" x2="344" y2="155" stroke="#444444" stroke-width="1.4"/>
  <polygon points="350,155 342,150 342,160" fill="#444444"/>
  <text x="335" y="134" font-size="9" fill="#666666" text-anchor="middle">WSGI</text>
  <text x="335" y="146" font-size="9" fill="#666666" text-anchor="middle">ASGI</text>

  <!-- Data stores and services -->
  <rect x="350" y="410" width="140" height="80" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="420" y="434" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">PostgreSQL</text>
  <text x="420" y="452" font-size="10" fill="#444444" text-anchor="middle">catalogue, users, reviews</text>
  <text x="420" y="468" font-size="10" fill="#666666" text-anchor="middle">full-text search</text>

  <rect x="505" y="410" width="140" height="80" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="575" y="434" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Redis</text>
  <text x="575" y="452" font-size="10" fill="#444444" text-anchor="middle">cache, channel layer</text>
  <text x="575" y="468" font-size="10" fill="#666666" text-anchor="middle">Celery broker (variant)</text>

  <rect x="660" y="410" width="140" height="80" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="730" y="434" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Media storage</text>
  <text x="730" y="452" font-size="10" fill="#444444" text-anchor="middle">cover images</text>
  <text x="730" y="468" font-size="10" fill="#666666" text-anchor="middle">disk or object storage</text>

  <rect x="20" y="300" width="300" height="190" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="170" y="324" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Background work</text>
  <text x="170" y="348" font-size="11" fill="#444444" text-anchor="middle">django.tasks: enqueue moderation emails</text>
  <text x="170" y="368" font-size="11" fill="#444444" text-anchor="middle">task worker (or a Celery worker)</text>
  <line x1="40" y1="384" x2="300" y2="384" stroke="#bbbbbb" stroke-width="1"/>
  <text x="170" y="406" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Email provider</text>
  <text x="170" y="428" font-size="11" fill="#444444" text-anchor="middle">SMTP or an API backend</text>
  <text x="170" y="448" font-size="11" fill="#444444" text-anchor="middle">password resets, moderation notices</text>
  <text x="170" y="474" font-size="10" fill="#666666" text-anchor="middle">shares the code base and settings</text>

  <!-- connectors -->
  <line x1="420" y1="350" x2="420" y2="404" stroke="#444444" stroke-width="1.4"/>
  <polygon points="420,410 415,402 425,402" fill="#444444"/>
  <text x="440" y="384" font-size="9" fill="#666666">ORM</text>

  <line x1="575" y1="362" x2="575" y2="404" stroke="#444444" stroke-width="1.4"/>
  <polygon points="575,410 570,402 580,402" fill="#444444"/>

  <line x1="730" y1="362" x2="730" y2="404" stroke="#444444" stroke-width="1.4"/>
  <polygon points="730,410 725,402 735,402" fill="#444444"/>
  <text x="750" y="384" font-size="9" fill="#666666">STORAGES</text>

  <line x1="350" y1="330" x2="326" y2="330" stroke="#444444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="320,330 328,325 328,335" fill="#444444"/>
  <text x="335" y="322" font-size="9" fill="#666666" text-anchor="middle">enqueue</text>

  <text x="410" y="526" font-size="10" fill="#666666" text-anchor="middle">Original drawing for this site. Arrows show the direction of requests and calls.</text>
</svg>
