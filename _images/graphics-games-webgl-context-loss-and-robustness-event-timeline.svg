<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ctx-event-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Event timeline of a lost and restored context</text>
<rect x="15" y="44" width="190" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="110.0" y="63.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Browser / GPU process</text>
<rect x="235" y="44" width="190" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="330.0" y="63.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Page script</text>
<rect x="455" y="44" width="190" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="550.0" y="63.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Canvas events</text>
<line x1="110" y1="74" x2="110" y2="340" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="330" y1="74" x2="330" y2="340" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="550" y1="74" x2="550" y2="340" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="110" y1="100" x2="550" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="330.0" y="95" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">GPU reset, driver crash or memory pressure</text>
<line x1="550" y1="130" x2="330" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="440.0" y="125" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">webglcontextlost (cancelable)</text>
<text x="330" y="182" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">preventDefault(); cancelAnimationFrame</text>
<line x1="330" y1="206" x2="110" y2="206" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="220.0" y="201" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">gl calls: no-ops, getError gives CONTEXT_LOST_WEBGL once</text>
<text x="110" y="232" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">waits for a restorable drawing buffer</text>
<line x1="110" y1="256" x2="550" y2="256" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="330.0" y="251" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">new drawing buffer, error state reset</text>
<line x1="550" y1="280" x2="330" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="440.0" y="275" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">webglcontextrestored</text>
<text x="330" y="304" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">getExtension again, rebuild resources, restart loop</text>
<line x1="330" y1="326" x2="110" y2="326" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-event-timeline)"/>
<text x="220.0" y="321" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">normal calls work again</text>
</svg>
