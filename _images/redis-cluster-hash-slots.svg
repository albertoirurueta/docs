<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">16384 hash slots distributed across three shards</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">A hash-tagged key is routed to a single slot, which belongs to exactly one shard</text>

  <!-- slot bar: 16384 slots split roughly evenly across 3 shards -->
  <rect x="40" y="70" width="680" height="50" fill="none" stroke="#cccccc" stroke-width="1.2"/>
  <rect x="40" y="70" width="226.7" height="50" fill="#1c4b73"/>
  <rect x="266.7" y="70" width="226.7" height="50" fill="#7a3b12"/>
  <rect x="493.4" y="70" width="226.6" height="50" fill="#2f5424"/>

  <text x="153" y="90" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Shard A</text>
  <text x="153" y="106" font-size="10.5" fill="#dfe9f2" text-anchor="middle">slots 0-5460</text>
  <text x="380" y="90" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Shard B</text>
  <text x="380" y="106" font-size="10.5" fill="#f0ddd0" text-anchor="middle">slots 5461-10922</text>
  <text x="607" y="90" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Shard C</text>
  <text x="607" y="106" font-size="10.5" fill="#dcead6" text-anchor="middle">slots 10923-16383</text>

  <!-- highlight the target shard for the routed key below -->
  <rect x="266.7" y="70" width="226.7" height="50" fill="none" stroke="#c9a227" stroke-width="3"/>

  <!-- slot number ticks -->
  <text x="40" y="135" font-size="10" fill="#666666" text-anchor="start">0</text>
  <text x="266.7" y="135" font-size="10" fill="#666666" text-anchor="middle">5461</text>
  <text x="493.4" y="135" font-size="10" fill="#666666" text-anchor="middle">10923</text>
  <text x="720" y="135" font-size="10" fill="#666666" text-anchor="end">16383</text>

  <text x="380" y="168" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Routing a hash-tagged key</text>

  <!-- flow boxes -->
  <g>
    <rect x="60" y="185" width="120" height="55" rx="4" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
    <text x="120" y="205" font-size="10.5" fill="#666666" text-anchor="middle">Key</text>
    <text x="120" y="222" font-size="11" fill="#222222" text-anchor="middle">{bookshop:cart:42}</text>
    <text x="120" y="235" font-size="11" fill="#222222" text-anchor="middle">:items</text>
  </g>

  <polygon points="185,212 200,212 192,220" fill="#888888"/>

  <g>
    <rect x="205" y="185" width="120" height="55" rx="4" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
    <text x="265" y="205" font-size="10.5" fill="#666666" text-anchor="middle">Hash tag substring</text>
    <text x="265" y="225" font-size="11" fill="#222222" text-anchor="middle">bookshop:cart:42</text>
  </g>

  <polygon points="330,212 345,212 337,220" fill="#888888"/>

  <g>
    <rect x="350" y="185" width="120" height="55" rx="4" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
    <text x="410" y="205" font-size="10.5" fill="#666666" text-anchor="middle">CRC16(tag)</text>
    <text x="410" y="225" font-size="11" fill="#222222" text-anchor="middle">mod 16384</text>
  </g>

  <polygon points="475,212 490,212 482,220" fill="#888888"/>

  <g>
    <rect x="495" y="185" width="120" height="55" rx="4" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
    <text x="555" y="205" font-size="10.5" fill="#666666" text-anchor="middle">Slot</text>
    <text x="555" y="225" font-size="11" fill="#222222" text-anchor="middle">5462 (illustrative)</text>
  </g>

  <polygon points="620,212 635,212 627,220" fill="#888888"/>

  <g>
    <rect x="640" y="185" width="80" height="55" rx="4" fill="#7a3b12"/>
    <text x="680" y="207" font-size="10.5" fill="#f0ddd0" text-anchor="middle">Owning</text>
    <text x="680" y="222" font-size="10.5" fill="#f0ddd0" text-anchor="middle">shard</text>
    <text x="680" y="236" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- connector from the owning-shard box up to the highlighted segment in the bar -->
  <path d="M 680 185 C 680 150, 380 150, 380 120" fill="none" stroke="#c9a227" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="374,122 386,122 380,132" fill="#c9a227"/>

  <text x="380" y="270" font-size="11" fill="#444444" text-anchor="middle">Redis hashes only the substring between the first `{` and `}` in the key when the tag is non-empty --</text>
  <text x="380" y="286" font-size="11" fill="#444444" text-anchor="middle">every key sharing that tag lands on the same slot, and therefore the same shard, enabling multi-key ops on them.</text>
  <text x="380" y="302" font-size="11" fill="#444444" text-anchor="middle">Slot numbers and shard boundaries above are illustrative -- an actual cluster's slot ranges depend on how it was created or resharded.</text>
</svg>
