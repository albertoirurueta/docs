<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Team-level controls and folder-level controls</text>
  <rect x="20" y="50" width="340" height="270" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="190" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Team level (admin, desktop only)</text>
  <g font-size="12" fill="#374151">
    <rect x="40" y="94" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="52" y="115">Color control: brand colours only</text><rect x="288" y="104" width="42" height="16" rx="8" fill="#4F46E5"/><circle cx="321" cy="112" r="6" fill="#FFFFFF"/>
    <rect x="40" y="138" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="52" y="159">Font control: brand fonts only</text><rect x="288" y="148" width="42" height="16" rx="8" fill="#4F46E5"/><circle cx="321" cy="156" r="6" fill="#FFFFFF"/>
    <rect x="40" y="182" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="52" y="203">Design approval: review before publishing</text><rect x="288" y="192" width="42" height="16" rx="8" fill="#4F46E5"/><circle cx="321" cy="200" r="6" fill="#FFFFFF"/>
    <rect x="40" y="226" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="52" y="247">Brand Assist: suggestions while designing</text><rect x="288" y="236" width="42" height="16" rx="8" fill="#9CA3AF"/><circle cx="297" cy="244" r="6" fill="#FFFFFF"/>
  </g>
  <text x="190" y="284" font-size="12" fill="#374151" text-anchor="middle">Applies to every design the team makes,</text><text x="190" y="300" font-size="12" fill="#374151" text-anchor="middle">wherever it is saved.</text>
  <path d="M362,185 L398,185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="176" font-size="11" fill="#6B7280" text-anchor="middle">overridden by</text>
  <rect x="400" y="50" width="340" height="270" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="570" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Folder level (Bookshelf Launch)</text>
  <g font-size="12" fill="#374151">
    <rect x="420" y="94" width="300" height="34" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="432" y="115">Folder holds the Bookshelf Brand Kit</text>
    <rect x="420" y="138" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="432" y="159">Color switch: only that kit's colours</text><rect x="668" y="148" width="42" height="16" rx="8" fill="#4F46E5"/><circle cx="701" cy="156" r="6" fill="#FFFFFF"/>
    <rect x="420" y="182" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="432" y="203">Font switch: only that kit's fonts</text><rect x="668" y="192" width="42" height="16" rx="8" fill="#4F46E5"/><circle cx="701" cy="200" r="6" fill="#FFFFFF"/>
  </g>
  <text x="570" y="248" font-size="12" fill="#374151" text-anchor="middle">Designs inside cannot switch to another kit.</text>
  <text x="570" y="266" font-size="12" fill="#374151" text-anchor="middle">Removing the kit returns to team controls.</text>
  <text x="570" y="284" font-size="12" fill="#374151" text-anchor="middle">First activation can take up to an hour.</text>
  <text x="380" y="352" font-size="12" fill="#374151" text-anchor="middle">Controls are set on a computer; they still apply when a controlled design is edited on a phone.</text>
  <text x="380" y="370" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic settings screen, not a screenshot of any product.</text>
</svg>
