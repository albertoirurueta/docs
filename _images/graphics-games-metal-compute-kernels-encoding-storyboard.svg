<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-compute-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Six steps from source to a finished dispatch</text>
<rect x="14" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="74" r="11" fill="#4F46E5"/><text x="30" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="74" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Compile</text>
<rect x="22" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="70" y="120" text-anchor="middle" font-size="10.5" fill="#374151">MTL4Compiler</text>
<text x="70" y="140" text-anchor="middle" font-size="10.5" fill="#374151">makeLibrary</text>
<text x="70" y="160" text-anchor="middle" font-size="10.5" fill="#374151">makeCompute-</text>
<text x="70" y="180" text-anchor="middle" font-size="10.5" fill="#374151">PipelineState</text>
<text x="70" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">pipeline</text>
<text x="70" y="238" text-anchor="middle" font-size="10" fill="#374151">(once)</text>
<line x1="126" y1="154" x2="136" y2="154" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-compute-story)"/>
<rect x="136" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="152" cy="74" r="11" fill="#4F46E5"/><text x="152" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="196" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Allocate</text>
<rect x="144" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="192" y="120" text-anchor="middle" font-size="10.5" fill="#374151">makeBuffer</text>
<text x="192" y="140" text-anchor="middle" font-size="10.5" fill="#374151">residency set:</text>
<text x="192" y="160" text-anchor="middle" font-size="10.5" fill="#374151">addAllocations</text>
<text x="192" y="180" text-anchor="middle" font-size="10.5" fill="#374151">commit()</text>
<text x="192" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">buffers</text>
<text x="192" y="238" text-anchor="middle" font-size="10" fill="#374151">(once)</text>
<line x1="248" y1="154" x2="258" y2="154" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-compute-story)"/>
<rect x="258" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="274" cy="74" r="11" fill="#4F46E5"/><text x="274" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="318" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Bind</text>
<rect x="266" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="314" y="120" text-anchor="middle" font-size="10.5" fill="#374151">argument table:</text>
<text x="314" y="140" text-anchor="middle" font-size="10.5" fill="#374151">setAddress</text>
<text x="314" y="160" text-anchor="middle" font-size="10.5" fill="#374151">setTexture</text>
<text x="314" y="180" text-anchor="middle" font-size="10.5" fill="#374151">(per slot)</text>
<text x="314" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">table</text>
<text x="314" y="238" text-anchor="middle" font-size="10" fill="#374151">(per dispatch)</text>
<line x1="370" y1="154" x2="380" y2="154" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-compute-story)"/>
<rect x="380" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="396" cy="74" r="11" fill="#B45309"/><text x="396" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="440" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Encode</text>
<rect x="388" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="436" y="120" text-anchor="middle" font-size="10.5" fill="#374151">encoder:</text>
<text x="436" y="140" text-anchor="middle" font-size="10.5" fill="#374151">set pipeline</text>
<text x="436" y="160" text-anchor="middle" font-size="10.5" fill="#374151">set table</text>
<text x="436" y="180" text-anchor="middle" font-size="10.5" fill="#374151">dispatchThreads</text>
<text x="436" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">encoder</text>
<text x="436" y="238" text-anchor="middle" font-size="10" fill="#374151">(per frame)</text>
<line x1="492" y1="154" x2="502" y2="154" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-compute-story)"/>
<rect x="502" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="518" cy="74" r="11" fill="#4F46E5"/><text x="518" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="562" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Order</text>
<rect x="510" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="558" y="120" text-anchor="middle" font-size="10.5" fill="#374151">barrier(after-</text>
<text x="558" y="140" text-anchor="middle" font-size="10.5" fill="#374151">EncoderStages:</text>
<text x="558" y="160" text-anchor="middle" font-size="10.5" fill="#374151">before...)</text>
<text x="558" y="180" text-anchor="middle" font-size="10.5" fill="#374151">before readers</text>
<text x="558" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">hazards</text>
<text x="558" y="238" text-anchor="middle" font-size="10" fill="#374151">(as needed)</text>
<line x1="614" y1="154" x2="624" y2="154" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-compute-story)"/>
<rect x="624" y="56" width="112" height="196" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="640" cy="74" r="11" fill="#4F46E5"/><text x="640" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<text x="684" y="79" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Submit</text>
<rect x="632" y="96" width="96" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="680" y="120" text-anchor="middle" font-size="10.5" fill="#374151">commit([cb])</text>
<text x="680" y="140" text-anchor="middle" font-size="10.5" fill="#374151">signalEvent</text>
<text x="680" y="160" text-anchor="middle" font-size="10.5" fill="#374151">CPU waits for</text>
<text x="680" y="180" text-anchor="middle" font-size="10.5" fill="#374151">the event value</text>
<text x="680" y="222" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">queue</text>
<text x="680" y="238" text-anchor="middle" font-size="10" fill="#374151">(per frame)</text>
<rect x="14" y="270" width="732" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="290" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Steps 1 to 3 usually happen at start-up; steps 4 to 6 repeat every frame (or every task).</text>
<text x="380" y="306" text-anchor="middle" font-size="11" fill="#374151">The ComputeRunner helper in this page performs all six in about 60 lines.</text>
</svg>
