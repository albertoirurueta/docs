<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A Swift string as extended grapheme clusters built from Unicode scalars, each scalar stored as one to four UTF-8 code units, with String.Index positions marked between grapheme clusters.</title>
  <rect x="0" y="0" width="820" height="320" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">"café🐶" as grapheme clusters, scalars, and UTF-8 bytes</text>
  <text x="410" y="47" font-size="11" fill="#666666" text-anchor="middle">"e" + combining acute accent shows one Character built from two scalars</text>

  <!-- Row labels -->
  <text x="16" y="88" font-size="11.5" font-weight="bold" fill="#41566e" text-anchor="start">Grapheme clusters</text>
  <text x="16" y="150" font-size="11.5" font-weight="bold" fill="#5a4a72" text-anchor="start">Unicode scalars</text>
  <text x="16" y="228" font-size="11.5" font-weight="bold" fill="#3a6b51" text-anchor="start">UTF-8 code units</text>

  <!-- Grapheme cluster row: c a f e-with-accent dog -->
  <g>
    <rect x="180" y="66" width="40" height="36" rx="5" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
    <text x="200" y="89" font-size="14" text-anchor="middle" fill="#1f3b5c">c</text>

    <rect x="228" y="66" width="40" height="36" rx="5" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
    <text x="248" y="89" font-size="14" text-anchor="middle" fill="#1f3b5c">a</text>

    <rect x="276" y="66" width="40" height="36" rx="5" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
    <text x="296" y="89" font-size="14" text-anchor="middle" fill="#1f3b5c">f</text>

    <rect x="324" y="66" width="80" height="36" rx="5" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.6"/>
    <text x="364" y="89" font-size="14" text-anchor="middle" fill="#3c2a5c">é  (é)</text>

    <rect x="412" y="66" width="60" height="36" rx="5" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
    <text x="442" y="89" font-size="16" text-anchor="middle" fill="#7a4d13">🐶</text>
  </g>

  <!-- String.Index tick marks between clusters -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 2">
    <line x1="180" y1="60" x2="180" y2="108"/>
    <line x1="228" y1="60" x2="228" y2="108"/>
    <line x1="276" y1="60" x2="276" y2="108"/>
    <line x1="324" y1="60" x2="324" y2="108"/>
    <line x1="412" y1="60" x2="412" y2="108"/>
    <line x1="472" y1="60" x2="472" y2="108"/>
  </g>
  <text x="180" y="55" font-size="9" fill="#8a8a8a" text-anchor="middle">startIndex</text>
  <text x="472" y="55" font-size="9" fill="#8a8a8a" text-anchor="middle">endIndex</text>

  <!-- Scalar row: c a f e combining-acute dog-scalar -->
  <g>
    <rect x="180" y="126" width="40" height="34" rx="4" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.2"/>
    <text x="200" y="148" font-size="11.5" text-anchor="middle" fill="#3c2a5c">U+0063</text>

    <rect x="228" y="126" width="40" height="34" rx="4" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.2"/>
    <text x="248" y="148" font-size="11.5" text-anchor="middle" fill="#3c2a5c">U+0061</text>

    <rect x="276" y="126" width="40" height="34" rx="4" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.2"/>
    <text x="296" y="148" font-size="11.5" text-anchor="middle" fill="#3c2a5c">U+0066</text>

    <rect x="324" y="126" width="40" height="34" rx="4" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.2"/>
    <text x="344" y="148" font-size="11.5" text-anchor="middle" fill="#3c2a5c">U+0065</text>

    <rect x="364" y="126" width="40" height="34" rx="4" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.2"/>
    <text x="384" y="148" font-size="10.5" text-anchor="middle" fill="#3c2a5c">U+0301</text>

    <rect x="412" y="126" width="60" height="34" rx="4" fill="#fdf0e0" stroke="#b5762a" stroke-width="1.2"/>
    <text x="442" y="148" font-size="11.5" text-anchor="middle" fill="#7a4d13">U+1F436</text>
  </g>

  <!-- Connectors from cluster row to scalar row -->
  <g stroke="#b9b2cf" stroke-width="1.2">
    <line x1="200" y1="102" x2="200" y2="126"/>
    <line x1="248" y1="102" x2="248" y2="126"/>
    <line x1="296" y1="102" x2="296" y2="126"/>
    <line x1="344" y1="102" x2="344" y2="126"/>
    <line x1="384" y1="102" x2="384" y2="126"/>
    <line x1="442" y1="102" x2="442" y2="126"/>
  </g>

  <!-- UTF-8 byte row -->
  <g>
    <rect x="180" y="204" width="40" height="30" rx="3" fill="#eefaf2" stroke="#2f7d51" stroke-width="1"/>
    <text x="200" y="224" font-size="10" text-anchor="middle" fill="#1d5236">63</text>

    <rect x="228" y="204" width="40" height="30" rx="3" fill="#eefaf2" stroke="#2f7d51" stroke-width="1"/>
    <text x="248" y="224" font-size="10" text-anchor="middle" fill="#1d5236">61</text>

    <rect x="276" y="204" width="40" height="30" rx="3" fill="#eefaf2" stroke="#2f7d51" stroke-width="1"/>
    <text x="296" y="224" font-size="10" text-anchor="middle" fill="#1d5236">66</text>

    <rect x="324" y="204" width="40" height="30" rx="3" fill="#eefaf2" stroke="#2f7d51" stroke-width="1"/>
    <text x="344" y="224" font-size="10" text-anchor="middle" fill="#1d5236">65</text>

    <rect x="364" y="204" width="48" height="30" rx="3" fill="#eefaf2" stroke="#2f7d51" stroke-width="1"/>
    <text x="388" y="224" font-size="9" text-anchor="middle" fill="#1d5236">CC 81</text>

    <rect x="412" y="204" width="60" height="30" rx="3" fill="#e3f5eb" stroke="#2f7d51" stroke-width="1.2"/>
    <text x="442" y="224" font-size="8.6" text-anchor="middle" fill="#1d5236">F0 9F 90 B6</text>
  </g>

  <g stroke="#bfe3cd" stroke-width="1.1">
    <line x1="200" y1="160" x2="200" y2="204"/>
    <line x1="248" y1="160" x2="248" y2="204"/>
    <line x1="296" y1="160" x2="296" y2="204"/>
    <line x1="344" y1="160" x2="344" y2="204"/>
    <line x1="388" y1="160" x2="388" y2="204"/>
    <line x1="442" y1="160" x2="442" y2="204"/>
  </g>

  <text x="410" y="262" font-size="11" fill="#666666" text-anchor="middle">"café" has 4 Characters (count), 5 Unicode scalars, and 6 UTF-8 bytes -- String.Index walks the top row</text>
  <text x="410" y="280" font-size="11" fill="#666666" text-anchor="middle">"🐶" is 1 Character, 1 scalar (U+1F436), and 4 UTF-8 bytes (and 2 UTF-16 code units, a surrogate pair)</text>
</svg>
