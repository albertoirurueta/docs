<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Publisher to exchange to bindings to queues to consumers</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">A topic exchange evaluates each binding's pattern against the message's routing key</text>

  <!-- Publisher -->
  <rect x="20" y="170" width="110" height="60" rx="4" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1.6"/>
  <text x="75" y="196" font-size="12" font-weight="bold" fill="#22326a" text-anchor="middle">Publisher</text>
  <text x="75" y="212" font-size="9" fill="#3a5fa8" text-anchor="middle">basicPublish</text>

  <!-- routing key label -->
  <text x="200" y="164" font-size="9" fill="#666666" text-anchor="middle">routing key:</text>
  <text x="200" y="176" font-size="9" font-weight="bold" fill="#444444" text-anchor="middle">orders.eu.created</text>

  <!-- arrow publisher -> exchange -->
  <line x1="130" y1="200" x2="262" y2="200" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Exchange -->
  <polygon points="265,160 335,160 355,200 335,240 265,240 245,200" fill="#fff4e5" stroke="#b8730f" stroke-width="1.6"/>
  <text x="300" y="196" font-size="11.5" font-weight="bold" fill="#8a5a0d" text-anchor="middle">orders</text>
  <text x="300" y="210" font-size="9" fill="#8a5a0d" text-anchor="middle">(topic exchange)</text>

  <!-- bindings -->
  <line x1="355" y1="190" x2="470" y2="90" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="420" y="110" font-size="9" fill="#2d6a34" text-anchor="middle">binding: orders.eu.*</text>

  <line x1="355" y1="210" x2="470" y2="330" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="420" y="300" font-size="9" fill="#2d6a34" text-anchor="middle">binding: orders.#</text>

  <line x1="330" y1="240" x2="470" y2="360" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="430" y="380" font-size="9" fill="#999999" text-anchor="middle">binding: orders.us.* (no match)</text>

  <!-- Queue 1 -->
  <rect x="475" y="60" width="130" height="56" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="540" y="83" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Queue: orders.eu</text>
  <text x="540" y="98" font-size="9" fill="#3a7d40" text-anchor="middle">matched orders.eu.*</text>

  <!-- Queue 2 -->
  <rect x="475" y="302" width="130" height="56" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="540" y="325" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Queue: orders.all</text>
  <text x="540" y="340" font-size="9" fill="#3a7d40" text-anchor="middle">matched orders.#</text>

  <!-- Queue 3 (unmatched) -->
  <rect x="475" y="370" width="130" height="40" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="540" y="394" font-size="10.5" fill="#888888" text-anchor="middle">Queue: orders.us</text>

  <!-- Consumers -->
  <line x1="605" y1="88" x2="655" y2="88" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="658" y="62" width="0" height="0"/>
  <circle cx="672" cy="88" r="18" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1.6"/>
  <text x="672" y="92" font-size="9" font-weight="bold" fill="#22326a" text-anchor="middle">C1</text>

  <line x1="605" y1="330" x2="655" y2="330" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="672" cy="330" r="18" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1.6"/>
  <text x="672" y="334" font-size="9" font-weight="bold" fill="#22326a" text-anchor="middle">C2</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2d6a34"/>
    </marker>
  </defs>
</svg>
