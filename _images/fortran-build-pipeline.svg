<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a Fortran program is built</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">compiling a module writes a .mod file; every file with a use statement for it needs that file before it can be compiled</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker>
  </defs>

  <!-- row 1: source, preprocessor, plain Fortran -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="30" y="76" width="170" height="62" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="115" y="102" font-weight="bold">source with directives</text>
    <text x="115" y="122" font-family="Courier New, monospace">solver.F90</text>
    <rect x="300" y="76" width="200" height="62" rx="6" fill="#f4f4f4" stroke="#777777"/>
    <text x="400" y="102" font-weight="bold">preprocessor</text>
    <text x="400" y="122" font-size="12">#ifdef, #include, -D macros</text>
    <rect x="610" y="76" width="170" height="62" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="695" y="102" font-weight="bold">plain Fortran</text>
    <text x="695" y="122" font-family="Courier New, monospace">solver.f90</text>
  </g>
  <line x1="200" y1="107" x2="296" y2="107" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="500" y1="107" x2="606" y2="107" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="248" y="97" font-size="11" fill="#444444" text-anchor="middle">capital F or -cpp</text>
  <text x="552" y="97" font-size="11" fill="#444444" text-anchor="middle">cpp output</text>

  <!-- row 2: compiler and dependent unit -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="440" y="200" width="260" height="86" rx="6" fill="#fff4e0" stroke="#b26a00"/>
    <text x="570" y="226" font-weight="bold">compiler: gfortran, flang, ifx</text>
    <text x="570" y="248" font-size="12">front end: parse and check the source</text>
    <text x="570" y="266" font-size="12">back end: optimize and generate code</text>
    <rect x="30" y="200" width="210" height="62" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="135" y="226" font-weight="bold">dependent unit</text>
    <text x="135" y="246" font-family="Courier New, monospace" font-size="12">use heatflow_solver</text>
  </g>
  <line x1="695" y1="138" x2="620" y2="196" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M115 138 L115 168 L520 168 L520 196" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="318" y="162" font-size="11" fill="#444444" text-anchor="middle">a lowercase .f90 skips the preprocessor</text>
  <line x1="240" y1="231" x2="436" y2="231" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="338" y="223" font-size="11" fill="#444444" text-anchor="middle">compiled after the module</text>

  <!-- launcher note -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="770" y="200" width="160" height="86" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
    <text x="850" y="226" font-weight="bold" font-size="13">parallel programs</text>
    <text x="850" y="246">started by cafrun or</text>
    <text x="850" y="262">mpirun instead of</text>
    <text x="850" y="278">running ./heatflow</text>
  </g>

  <!-- row 3: outputs -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="30" y="330" width="210" height="50" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="135" y="351" font-weight="bold">module file</text>
    <text x="135" y="369" font-family="Courier New, monospace" font-size="12">heatflow_solver.mod</text>
    <rect x="560" y="330" width="170" height="50" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="645" y="351" font-weight="bold">object file</text>
    <text x="645" y="369" font-family="Courier New, monospace" font-size="12">solver.o</text>
  </g>
  <line x1="470" y1="286" x2="240" y2="338" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="286" x2="645" y2="326" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M135 330 L135 266" fill="none" stroke="#b26a00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="145" y="305" font-size="12" fill="#b26a00">read by every use statement</text>

  <!-- row 4: link -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="30" y="430" width="190" height="52" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="125" y="452" font-weight="bold">executable</text>
    <text x="125" y="470" font-family="Courier New, monospace" font-size="12">heatflow</text>
    <rect x="300" y="430" width="210" height="52" rx="6" fill="#f4f4f4" stroke="#777777"/>
    <text x="405" y="452" font-weight="bold">linker</text>
    <text x="405" y="470" font-size="12">all .o files plus libraries</text>
    <rect x="600" y="430" width="230" height="52" rx="6" fill="#f4f4f4" stroke="#777777"/>
    <text x="715" y="450" font-weight="bold">runtime library</text>
    <text x="715" y="468" font-size="12" font-family="Courier New, monospace">libgfortran or libflang_rt</text>
  </g>
  <line x1="645" y1="380" x2="440" y2="426" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="590" y="414" font-size="11" fill="#444444" text-anchor="middle">one per source file</text>
  <line x1="596" y1="456" x2="514" y2="456" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="296" y1="456" x2="224" y2="456" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
