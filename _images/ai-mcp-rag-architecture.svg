<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="Helvetica, Arial, sans-serif">
  <title>A RAG system behind an MCP server</title>
  <desc>The host application and its LLM call the docs-assistant MCP server over Streamable HTTP with a bearer token. The server verifies the token, derives the caller's groups, runs a pre-filtered vector search against pgvector or a Spring AI VectorStore, and returns passages with a result handle. The host LLM writes the answer and cites the pages; the server never calls a model.</desc>
  <rect x="0" y="0" width="920" height="660" fill="#f8fafc"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">A RAG system behind an MCP server</text>

  <!-- host -->
  <rect x="24" y="64" width="230" height="300" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="139" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Host</text>
  <text x="139" y="108" text-anchor="middle" font-size="12" fill="#1e3a8a">Claude Code, LangGraph agent</text>
  <rect x="44" y="124" width="190" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="139" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">LLM</text>
  <text x="139" y="167" text-anchor="middle" font-size="12" fill="#1e3a8a">writes the answer, cites pages</text>
  <rect x="44" y="204" width="190" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="139" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">MCP client</text>
  <text x="139" y="247" text-anchor="middle" font-size="12" fill="#1e3a8a">lists and calls tools</text>
  <rect x="44" y="284" width="190" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="139" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Token from env or store</text>
  <text x="139" y="327" text-anchor="middle" font-size="12" fill="#1e3a8a">sent as a bearer header</text>

  <!-- server -->
  <rect x="340" y="64" width="290" height="440" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="485" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">docs-assistant MCP server</text>
  <text x="485" y="108" text-anchor="middle" font-size="12" fill="#4c1d95">stateless requests, no protocol session</text>
  <rect x="360" y="124" width="250" height="52" rx="8" fill="#ffffff" stroke="#6d28d9"/>
  <text x="485" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">1. Verify token</text>
  <text x="485" y="164" text-anchor="middle" font-size="12" fill="#4c1d95">audience, issuer, expiry, scope</text>
  <rect x="360" y="188" width="250" height="52" rx="8" fill="#ffffff" stroke="#6d28d9"/>
  <text x="485" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">2. Identity to ACL groups</text>
  <text x="485" y="228" text-anchor="middle" font-size="12" fill="#4c1d95">from the token, never an argument</text>
  <rect x="360" y="252" width="250" height="100" rx="8" fill="#ffffff" stroke="#6d28d9"/>
  <text x="485" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">3. Primitives</text>
  <text x="485" y="294" text-anchor="middle" font-size="12" fill="#4c1d95">tool search_docs (outputSchema)</text>
  <text x="485" y="312" text-anchor="middle" font-size="12" fill="#4c1d95">tool read_passages(result_set, ranks)</text>
  <text x="485" y="330" text-anchor="middle" font-size="12" fill="#4c1d95">resource docs://component/page</text>
  <text x="485" y="346" text-anchor="middle" font-size="12" fill="#4c1d95">prompt answer_with_citations</text>
  <rect x="360" y="364" width="250" height="52" rx="8" fill="#ffffff" stroke="#6d28d9"/>
  <text x="485" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">4. Handle store</text>
  <text x="485" y="404" text-anchor="middle" font-size="12" fill="#4c1d95">key subject:handle, short TTL</text>
  <rect x="360" y="428" width="250" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="485" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">No sampling, no model call</text>
  <text x="485" y="472" text-anchor="middle" font-size="12" fill="#7f1d1d">the host LLM generates the answer</text>

  <!-- retrieval -->
  <rect x="716" y="64" width="180" height="300" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="806" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Retrieval</text>
  <rect x="732" y="108" width="148" height="72" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="806" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Python</text>
  <text x="806" y="150" text-anchor="middle" font-size="12" fill="#14532d">psycopg + pgvector</text>
  <text x="806" y="166" text-anchor="middle" font-size="12" fill="#14532d">acl_groups filter, HNSW</text>
  <rect x="732" y="192" width="148" height="72" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="806" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Java</text>
  <text x="806" y="234" text-anchor="middle" font-size="12" fill="#14532d">Spring AI VectorStore</text>
  <text x="806" y="250" text-anchor="middle" font-size="12" fill="#14532d">filter expression on acl</text>
  <rect x="732" y="276" width="148" height="72" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="806" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Embedding model</text>
  <text x="806" y="318" text-anchor="middle" font-size="12" fill="#14532d">nomic-embed-text</text>
  <text x="806" y="334" text-anchor="middle" font-size="12" fill="#14532d">same as at ingestion</text>

  <!-- arrows -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <path d="M234 236 L336 236"/>
    <path d="M630 236 L712 236"/>
  </g>
  <g fill="#0f172a">
    <path d="M336 230 L346 236 L336 242 Z"/>
    <path d="M712 230 L722 236 L712 242 Z"/>
  </g>
  <text x="285" y="222" text-anchor="middle" font-size="11" fill="#0f172a">POST /mcp</text>
  <text x="285" y="262" text-anchor="middle" font-size="11" fill="#0f172a">HTTPS + bearer</text>
  <text x="671" y="222" text-anchor="middle" font-size="11" fill="#0f172a">search</text>
  <text x="671" y="262" text-anchor="middle" font-size="11" fill="#0f172a">ACL first</text>

  <!-- return path -->
  <rect x="24" y="524" width="872" height="112" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="460" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">One question, end to end</text>
  <text x="460" y="574" text-anchor="middle" font-size="12" fill="#78350f">1. The LLM calls search_docs. The server checks the token, maps it to groups and searches only readable documents.</text>
  <text x="460" y="594" text-anchor="middle" font-size="12" fill="#78350f">2. It returns short hits and a result_set handle. The LLM calls read_passages for the ranks it wants.</text>
  <text x="460" y="614" text-anchor="middle" font-size="12" fill="#78350f">3. Passages come back as untrusted data. The LLM answers from them and cites docs://component/page.</text>
</svg>
