<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where to put the settings of a WooCommerce extension</title>
  <desc id="d">A table with five rows. A payment gateway, shipping method or integration extends a WC_Settings_API subclass and stores one option array. A whole tab of options is a WC_Settings_Page subclass added with the woocommerce_get_settings_pages filter. A few options for an existing tab are a section added with two filters or with a SettingsSection registered since WooCommerce 10.9.0. A page with its own layout is registered with wc_admin_connect_page for PHP or wc_admin_register_page for React. An experimental settings UI renders a tab or section with React when the settings-ui feature is on.</desc>
  <rect x="0" y="0" width="960" height="596" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">One question, five answers</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">What the extension configures decides the class or function it uses; WooCommerce 11.2.1</text>
  <rect x="40" y="76" width="880" height="30" rx="6" fill="#34495e"/>
  <text x="50" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">The extension configures</text>
  <text x="320" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">It uses</text>
  <text x="720" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">The merchant finds it at</text>
  <rect x="40" y="118" width="6" height="76" rx="3" fill="#8fb8e8"/>
  <rect x="52" y="118" width="238" height="76" rx="6" fill="#3d5266"/>
  <text x="62" y="150.0" font-size="12.5" text-anchor="start" fill="#f2f5f8">A gateway, shipping</text>
  <text x="62" y="168.5" font-size="12.5" text-anchor="start" fill="#f2f5f8">method or integration</text>
  <rect x="310" y="118" width="380" height="76" rx="6" fill="#3d5266"/>
  <text x="320" y="140.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Settings_API subclass:</text>
  <text x="320" y="159.25" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Payment_Gateway, WC_Shipping_Method,</text>
  <text x="320" y="177.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Integration</text>
  <rect x="710" y="118" width="210" height="76" rx="6" fill="#3d5266"/>
  <text x="720" y="141.0" font-size="12" text-anchor="start" fill="#f2f5f8">Payments, Shipping zones or</text>
  <text x="720" y="159.0" font-size="12" text-anchor="start" fill="#f2f5f8">Integration tab; one option</text>
  <text x="720" y="177.0" font-size="12" text-anchor="start" fill="#f2f5f8">woocommerce_&lt;id&gt;_settings</text>
  <rect x="40" y="204" width="6" height="76" rx="3" fill="#9fd3c7"/>
  <rect x="52" y="204" width="238" height="76" rx="6" fill="#3d5266"/>
  <text x="62" y="236.0" font-size="12.5" text-anchor="start" fill="#f2f5f8">A whole tab of</text>
  <text x="62" y="254.5" font-size="12.5" text-anchor="start" fill="#f2f5f8">related options</text>
  <rect x="310" y="204" width="380" height="76" rx="6" fill="#3d5266"/>
  <text x="320" y="226.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Settings_Page subclass added with</text>
  <text x="320" y="245.25" font-size="12.5" text-anchor="start" fill="#f2f5f8">the woocommerce_get_settings_pages filter</text>
  <text x="320" y="263.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">sections: get_own_sections()</text>
  <rect x="710" y="204" width="210" height="76" rx="6" fill="#3d5266"/>
  <text x="720" y="236.0" font-size="12" text-anchor="start" fill="#f2f5f8">wc-settings&amp;tab=pocket_coffee</text>
  <text x="720" y="254.0" font-size="12" text-anchor="start" fill="#f2f5f8">one option per field id</text>
  <rect x="40" y="290" width="6" height="76" rx="3" fill="#a8d18d"/>
  <rect x="52" y="290" width="238" height="76" rx="6" fill="#3d5266"/>
  <text x="62" y="322.0" font-size="12.5" text-anchor="start" fill="#f2f5f8">A few options for</text>
  <text x="62" y="340.5" font-size="12.5" text-anchor="start" fill="#f2f5f8">an existing tab</text>
  <rect x="310" y="290" width="380" height="76" rx="6" fill="#3d5266"/>
  <text x="320" y="312.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">Filters woocommerce_get_sections_{tab}</text>
  <text x="320" y="331.25" font-size="12.5" text-anchor="start" fill="#f2f5f8">and woocommerce_get_settings_{tab},</text>
  <text x="320" y="349.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">or a SettingsSection (10.9.0 and later)</text>
  <rect x="710" y="290" width="210" height="76" rx="6" fill="#3d5266"/>
  <text x="720" y="322.0" font-size="12" text-anchor="start" fill="#f2f5f8">wc-settings&amp;tab=products</text>
  <text x="720" y="340.0" font-size="12" text-anchor="start" fill="#f2f5f8">&amp;section=pocket_coffee_badge</text>
  <rect x="40" y="376" width="6" height="76" rx="3" fill="#f4b860"/>
  <rect x="52" y="376" width="238" height="76" rx="6" fill="#3d5266"/>
  <text x="62" y="408.0" font-size="12.5" text-anchor="start" fill="#f2f5f8">A page with its own</text>
  <text x="62" y="426.5" font-size="12.5" text-anchor="start" fill="#f2f5f8">layout or tool</text>
  <rect x="310" y="376" width="380" height="76" rx="6" fill="#3d5266"/>
  <text x="320" y="398.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">wc_admin_connect_page() for a PHP page,</text>
  <text x="320" y="417.25" font-size="12.5" text-anchor="start" fill="#f2f5f8">wc_admin_register_page() plus a React</text>
  <text x="320" y="435.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">bundle for a JavaScript page</text>
  <rect x="710" y="376" width="210" height="76" rx="6" fill="#3d5266"/>
  <text x="720" y="399.0" font-size="12" text-anchor="start" fill="#f2f5f8">WooCommerce menu entry;</text>
  <text x="720" y="417.0" font-size="12" text-anchor="start" fill="#f2f5f8">page=wc-admin</text>
  <text x="720" y="435.0" font-size="12" text-anchor="start" fill="#f2f5f8">&amp;path=/pocket-coffee</text>
  <rect x="40" y="462" width="6" height="76" rx="3" fill="#e8908a"/>
  <rect x="52" y="462" width="238" height="76" rx="6" fill="#3d5266"/>
  <text x="62" y="494.0" font-size="12.5" text-anchor="start" fill="#f2f5f8">A React form inside</text>
  <text x="62" y="512.5" font-size="12.5" text-anchor="start" fill="#f2f5f8">a settings tab</text>
  <rect x="310" y="462" width="380" height="76" rx="6" fill="#3d5266"/>
  <text x="320" y="484.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">Experimental settings UI:</text>
  <text x="320" y="503.25" font-size="12.5" text-anchor="start" fill="#f2f5f8">get_settings_ui_page() returns an adapter;</text>
  <text x="320" y="521.75" font-size="12.5" text-anchor="start" fill="#f2f5f8">feature settings-ui, off by default</text>
  <rect x="710" y="462" width="210" height="76" rx="6" fill="#3d5266"/>
  <text x="720" y="494.0" font-size="12" text-anchor="start" fill="#f2f5f8">Same tab URL, rendered by</text>
  <text x="720" y="512.0" font-size="12" text-anchor="start" fill="#f2f5f8">React instead of PHP</text>
  <text x="40" y="574" font-size="12" text-anchor="start" fill="#9fd3c7">Every row except the last stores its values in wp_options; none of them needs a build step except the React page.</text>
</svg>
