<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>The three ways an object crosses a Ractor boundary</title>
  <desc>Three panels. Share: a shareable object is sent by reference, so both Ractors point at the same object. Copy: an unshareable object is deep cloned, so the sender keeps the original and the receiver gets an independent clone. Move: with move true the object changes owner, the receiver gets the object and the sender is left with a Ractor MovedObject placeholder whose methods raise Ractor MovedError.</desc>
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three ways an object crosses a Ractor boundary</text>
  <text x="480" y="47" font-size="12" fill="#666666" text-anchor="middle">Ractor::Port#send, Ractor#send, Ractor.new arguments and return values all follow the same three rules</text>

  <!-- Panel 1: share -->
  <rect x="20" y="66" width="290" height="276" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="165" y="92" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Share by reference</text>
  <text x="165" y="110" font-size="12" fill="#666666" text-anchor="middle">shareable: frozen, Integer, Symbol, Class</text>
  <rect x="36" y="128" width="118" height="30" rx="5" fill="#1c4b73"/>
  <text x="95" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor A</text>
  <rect x="176" y="128" width="118" height="30" rx="5" fill="#2e7d4f"/>
  <text x="235" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor B</text>
  <rect x="85" y="262" width="160" height="40" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.6"/>
  <text x="165" y="287" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#8a4a12" text-anchor="middle">"Dune".freeze</text>
  <path d="M95,158 L125,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M235,158 L205,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M120,252 L125,262 L131,253" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M200,252 L205,262 L211,253" stroke="#777777" stroke-width="1.6" fill="none"/>
  <text x="165" y="215" font-size="12" fill="#444444" text-anchor="middle">one object</text>
  <text x="165" y="326" font-size="12" fill="#444444" text-anchor="middle">fast: nothing is duplicated</text>

  <!-- Panel 2: copy -->
  <rect x="335" y="66" width="290" height="276" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="480" y="92" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Copy (the default)</text>
  <text x="480" y="110" font-size="12" fill="#666666" text-anchor="middle">unshareable: deep clone on send</text>
  <rect x="351" y="128" width="118" height="30" rx="5" fill="#1c4b73"/>
  <text x="410" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor A</text>
  <rect x="491" y="128" width="118" height="30" rx="5" fill="#2e7d4f"/>
  <text x="550" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor B</text>
  <rect x="351" y="262" width="118" height="40" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.6"/>
  <text x="410" y="287" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#8a4a12" text-anchor="middle">+"Dune"</text>
  <rect x="491" y="262" width="118" height="40" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.6"/>
  <text x="550" y="287" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#8a4a12" text-anchor="middle">+"Dune"'</text>
  <path d="M410,158 L410,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M405,251 L410,261 L415,251" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M550,158 L550,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M545,251 L550,261 L555,251" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M470,282 L489,282" stroke="#b5651d" stroke-width="1.6" stroke-dasharray="5 3" fill="none"/>
  <path d="M482,277 L490,282 L482,287" stroke="#b5651d" stroke-width="1.6" fill="none"/>
  <text x="480" y="215" font-size="12" fill="#444444" text-anchor="middle">two objects</text>
  <text x="480" y="326" font-size="12" fill="#444444" text-anchor="middle">can be slow, some objects cannot be cloned</text>

  <!-- Panel 3: move -->
  <rect x="650" y="66" width="290" height="276" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="795" y="92" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Move</text>
  <text x="795" y="110" font-size="12" fill="#666666" text-anchor="middle">send(obj, move: true)</text>
  <rect x="666" y="128" width="118" height="30" rx="5" fill="#1c4b73"/>
  <text x="725" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor A</text>
  <rect x="806" y="128" width="118" height="30" rx="5" fill="#2e7d4f"/>
  <text x="865" y="148" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ractor B</text>
  <rect x="666" y="262" width="118" height="40" rx="5" fill="#f3e5e5" stroke="#a33a3a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="725" y="280" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#7a2323" text-anchor="middle">MovedObject</text>
  <text x="725" y="294" font-size="10" fill="#7a2323" text-anchor="middle">every call raises</text>
  <rect x="806" y="262" width="118" height="40" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.6"/>
  <text x="865" y="287" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#8a4a12" text-anchor="middle">+"Dune"</text>
  <path d="M725,158 L725,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M720,251 L725,261 L730,251" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M865,158 L865,260" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M860,251 L865,261 L870,251" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M785,282 L804,282" stroke="#b5651d" stroke-width="1.6" stroke-dasharray="5 3" fill="none"/>
  <path d="M797,277 L805,282 L797,287" stroke="#b5651d" stroke-width="1.6" fill="none"/>
  <text x="795" y="215" font-size="12" fill="#444444" text-anchor="middle">new owner</text>
  <text x="795" y="326" font-size="12" fill="#444444" text-anchor="middle">no copy; the sender must stop using it</text>
</svg>
