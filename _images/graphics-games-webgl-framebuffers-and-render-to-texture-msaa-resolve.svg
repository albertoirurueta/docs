<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-framebuffers-and-render-to-texture-msaa-resolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Multisampled rendering and the resolve blit</text>
<rect x="20" y="70" width="190" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="115.0" y="107.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Multisampled FBO</text>
<text x="115.0" y="121.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">renderbufferStorageMultisample</text>
<text x="115.0" y="135.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">(RGBA8, 4 samples)</text>
<text x="115.0" y="149.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">+ DEPTH24_STENCIL8</text>
<rect x="285" y="70" width="190" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="106.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Resolve FBO</text>
<text x="380.0" y="121.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">colour: single-sample</text>
<text x="380.0" y="136.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">texture RGBA8</text>
<text x="380.0" y="151.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">(no depth needed)</text>
<rect x="550" y="70" width="190" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="106.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Default framebuffer</text>
<text x="645.0" y="121.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">or a post-process</text>
<text x="645.0" y="136.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">pass sampling the</text>
<text x="645.0" y="151.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">resolved texture</text>
<line x1="210" y1="125" x2="285" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-msaa-resolve)"/>
<line x1="475" y1="125" x2="550" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-msaa-resolve)"/>
<text x="247" y="112" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">blitFramebuffer</text>
<text x="247" y="142" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">READ / DRAW</text>
<text x="512" y="112" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">drawArrays</text>
<text x="512" y="142" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">texture(...)</text>
<text x="115" y="200" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">READ_FRAMEBUFFER</text>
<text x="380" y="200" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">DRAW_FRAMEBUFFER</text>
<text x="380" y="235" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Blit rules: same size, same format; mask COLOR_BUFFER_BIT, filter NEAREST; a multisample source cannot be scaled.</text>
<text x="380" y="255" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">After the blit call invalidateFramebuffer on the multisampled attachments to free tile memory on mobile GPUs.</text>
<text x="380" y="290" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Samples per format: gl.getInternalformatParameter(gl.RENDERBUFFER, gl.RGBA8, gl.SAMPLES)</text>
</svg>
