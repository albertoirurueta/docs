<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The visionOS immersion spectrum in FieldNotes</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">From content beside other apps to a world that replaces the room</text>

  <!-- Space brackets -->
  <rect x="16" y="64" width="290" height="26" rx="6" fill="#e6f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="161" y="82" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shared Space: next to other apps</text>
  <rect x="318" y="64" width="426" height="26" rx="6" fill="#f3efe4" stroke="#8a7a52" stroke-width="1.2"/>
  <text x="531" y="82" font-size="13" font-weight="bold" fill="#6b5a2e" text-anchor="middle">Full Space: an ImmersiveSpace, other apps hidden</text>

  <!-- Panel frames -->
  <g stroke="#b9c6d2" stroke-width="1" fill="#f7f9fb">
    <rect x="16" y="100" width="138" height="170" rx="10"/>
    <rect x="166" y="100" width="140" height="170" rx="10"/>
    <rect x="318" y="100" width="136" height="170" rx="10"/>
    <rect x="463" y="100" width="136" height="170" rx="10"/>
    <rect x="608" y="100" width="136" height="170" rx="10"/>
  </g>

  <!-- 1 Window: a flat glass pane -->
  <rect x="40" y="130" width="90" height="62" rx="8" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <rect x="48" y="140" width="24" height="44" rx="3" fill="#d8e4ef"/>
  <rect x="78" y="140" width="44" height="8" rx="3" fill="#d8e4ef"/>
  <rect x="78" y="154" width="36" height="8" rx="3" fill="#d8e4ef"/>
  <rect x="62" y="198" width="46" height="10" rx="5" fill="#1c4b73"/>
  <text x="85" y="226" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Window</text>
  <text x="85" y="244" font-size="12" fill="#444444" text-anchor="middle">ContentView +</text>
  <text x="85" y="259" font-size="12" fill="#444444" text-anchor="middle">NoteOrnament</text>

  <!-- 2 Volume: a box with terrain -->
  <polygon points="200,150 250,134 282,148 232,164" fill="#eef2f5" stroke="#1c4b73" stroke-width="1.4"/>
  <polygon points="200,150 232,164 232,204 200,190" fill="#e2eaf1" stroke="#1c4b73" stroke-width="1.4"/>
  <polygon points="232,164 282,148 282,188 232,204" fill="#d5e1ec" stroke="#1c4b73" stroke-width="1.4"/>
  <path d="M206,186 Q222,170 238,182 T276,172" fill="none" stroke="#5a8a3c" stroke-width="2"/>
  <circle cx="226" cy="176" r="3.5" fill="#e07b1a"/>
  <circle cx="258" cy="172" r="3.5" fill="#2f6fb0"/>
  <text x="236" y="226" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Volume</text>
  <text x="236" y="244" font-size="12" fill="#444444" text-anchor="middle">FieldSiteVolume</text>
  <text x="236" y="259" font-size="12" fill="#444444" text-anchor="middle">.volumetric</text>

  <!-- 3 Mixed: room visible, map on a table -->
  <rect x="332" y="126" width="108" height="78" rx="4" fill="#fbf8ef" stroke="#8a7a52" stroke-width="1"/>
  <line x1="332" y1="176" x2="440" y2="176" stroke="#c9bb95" stroke-width="1"/>
  <rect x="352" y="170" width="68" height="8" rx="2" fill="#a88a5a"/>
  <path d="M358,170 Q372,160 386,168 T414,164" fill="none" stroke="#5a8a3c" stroke-width="2"/>
  <circle cx="376" cy="163" r="3" fill="#e07b1a"/>
  <circle cx="402" cy="162" r="3" fill="#2f6fb0"/>
  <text x="386" y="226" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Mixed</text>
  <text x="386" y="244" font-size="12" fill="#444444" text-anchor="middle">NotesMapSpace</text>
  <text x="386" y="259" font-size="12" fill="#444444" text-anchor="middle">room stays visible</text>

  <!-- 4 Progressive: portal replacing part of the room -->
  <rect x="477" y="126" width="108" height="78" rx="4" fill="#fbf8ef" stroke="#8a7a52" stroke-width="1"/>
  <ellipse cx="531" cy="165" rx="40" ry="32" fill="#3b4a5c"/>
  <path d="M500,172 Q516,158 532,168 T562,162" fill="none" stroke="#9fd07a" stroke-width="2"/>
  <circle cx="520" cy="163" r="3" fill="#e07b1a"/>
  <circle cx="548" cy="162" r="3" fill="#6fb0f0"/>
  <text x="531" y="226" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Progressive</text>
  <text x="531" y="244" font-size="12" fill="#444444" text-anchor="middle">Digital Crown sets</text>
  <text x="531" y="259" font-size="12" fill="#444444" text-anchor="middle">how much is replaced</text>

  <!-- 5 Full: everything replaced -->
  <rect x="622" y="126" width="108" height="78" rx="4" fill="#2a3644" stroke="#1c2733" stroke-width="1"/>
  <path d="M630,184 Q650,164 672,178 T722,170" fill="none" stroke="#9fd07a" stroke-width="2"/>
  <circle cx="656" cy="174" r="3" fill="#e07b1a"/>
  <circle cx="700" cy="170" r="3" fill="#6fb0f0"/>
  <circle cx="640" cy="140" r="1.5" fill="#ffffff"/>
  <circle cx="700" cy="136" r="1.5" fill="#ffffff"/>
  <circle cx="716" cy="148" r="1.5" fill="#ffffff"/>
  <text x="676" y="226" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Full</text>
  <text x="676" y="244" font-size="12" fill="#444444" text-anchor="middle">no passthrough</text>
  <text x="676" y="259" font-size="12" fill="#444444" text-anchor="middle">(not used by FieldNotes)</text>

  <!-- Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1c4b73"/>
    </marker>
  </defs>
  <line x1="24" y1="296" x2="734" y2="296" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="24" y="316" font-size="13" fill="#1c4b73">less immersive</text>
  <text x="734" y="316" font-size="13" fill="#1c4b73" text-anchor="end">more immersive</text>

  <!-- API row -->
  <text x="161" y="346" font-size="13" fill="#222222" text-anchor="middle">WindowGroup, openWindow</text>
  <text x="161" y="364" font-size="13" fill="#222222" text-anchor="middle">.windowStyle(.volumetric)</text>
  <text x="531" y="346" font-size="13" fill="#222222" text-anchor="middle">ImmersiveSpace(id: "map"), openImmersiveSpace(id:)</text>
  <text x="531" y="364" font-size="13" fill="#222222" text-anchor="middle">.immersionStyle(selection:in: .mixed, .progressive, .full)</text>
  <text x="380" y="398" font-size="12" fill="#666666" text-anchor="middle">Only one immersive space is open at a time across all apps; ARKit data flows only in a Full Space.</text>
</svg>
