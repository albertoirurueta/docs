<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where each Go tool sits</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the same analysis framework feeds go vet (report), go fix (rewrite), go test (gate) and gopls (editor)</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <!-- source -->
  <rect x="30" y="170" width="130" height="80" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="95" y="206" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">.go files</text>
  <text x="95" y="226" font-size="12" fill="#444444" text-anchor="middle">parsed and</text>
  <text x="95" y="242" font-size="12" fill="#444444" text-anchor="middle">type-checked</text>
  <!-- row 1 gofmt -->
  <rect x="260" y="70" width="300" height="56" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="410" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">gofmt / go fmt</text>
  <text x="410" y="114" font-size="12" fill="#444444" text-anchor="middle">layout only: canonical text (-s simplifies)</text>
  <!-- row 2 vet -->
  <rect x="260" y="146" width="300" height="56" fill="#fff4e0" stroke="#b36b00"/>
  <text x="410" y="170" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">go vet</text>
  <text x="410" y="190" font-size="12" fill="#444444" text-anchor="middle">analyzers find suspicious code: report only</text>
  <!-- row 3 fix -->
  <rect x="260" y="222" width="300" height="56" fill="#f3e8f8" stroke="#6a1b9a"/>
  <text x="410" y="246" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">go fix</text>
  <text x="410" y="266" font-size="12" fill="#444444" text-anchor="middle">modernizers propose safe rewrites</text>
  <!-- row 4 test -->
  <rect x="260" y="298" width="300" height="56" fill="#fff4e0" stroke="#b36b00"/>
  <text x="410" y="322" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">go test</text>
  <text x="410" y="342" font-size="12" fill="#444444" text-anchor="middle">runs a high-confidence vet subset first</text>
  <!-- arrows from source -->
  <line x1="160" y1="195" x2="256" y2="104" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="160" y1="205" x2="256" y2="174" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="160" y1="215" x2="256" y2="250" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="160" y1="225" x2="256" y2="326" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- outputs -->
  <rect x="650" y="70" width="260" height="56" fill="#ffffff" stroke="#999999"/>
  <text x="780" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">rewrites files in place</text>
  <text x="780" y="112" font-size="12" fill="#444444" text-anchor="middle">-l lists, -d diffs, -w writes</text>
  <rect x="650" y="146" width="260" height="56" fill="#ffffff" stroke="#999999"/>
  <text x="780" y="170" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">file:line: message</text>
  <text x="780" y="188" font-size="12" fill="#444444" text-anchor="middle">-fix applies the first suggested fix</text>
  <rect x="650" y="222" width="260" height="56" fill="#ffffff" stroke="#999999"/>
  <text x="780" y="246" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">unified diff or edited files</text>
  <text x="780" y="264" font-size="12" fill="#444444" text-anchor="middle">gated by the go directive in go.mod</text>
  <rect x="650" y="298" width="260" height="56" fill="#ffffff" stroke="#999999"/>
  <text x="780" y="322" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">build failed, tests not run</text>
  <text x="780" y="340" font-size="12" fill="#444444" text-anchor="middle">-vet=off or -vet=all changes the set</text>
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)">
    <line x1="560" y1="98" x2="646" y2="98"/>
    <line x1="560" y1="174" x2="646" y2="174"/>
    <line x1="560" y1="250" x2="646" y2="250"/>
    <line x1="560" y1="326" x2="646" y2="326"/>
  </g>
  <text x="470" y="392" font-size="12" fill="#444444" text-anchor="middle">Third-party tools (staticcheck, golangci-lint, deadcode, govulncheck) read the same type-checked packages but are separate programs</text>
</svg>
