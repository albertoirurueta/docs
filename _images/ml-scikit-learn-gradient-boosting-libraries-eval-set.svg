<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Early stopping data inside a pipeline</title>
<desc id="d">Two flows. On the left, a pipeline fit passes only the training split through the preprocessing step, so an eval_set given to the booster would be raw and mismatched. On the right, the preprocessing is fitted on the training split, applied to both splits by hand, and the booster receives the transformed validation set in eval_set.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Where the early-stopping set must go</text>
<text x="180" y="62" font-size="13" font-weight="bold" fill="#BE123C" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Pipeline.fit(X, y, clf__eval_set=...)</text>
<rect x="60" y="76" width="240" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="180" y="101" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">X_train (raw) -> preprocessing</text>
<rect x="60" y="150" width="240" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="180" y="175" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">booster sees encoded X_train</text>
<rect x="60" y="226" width="240" height="40" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="180" y="251" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">eval_set stays raw: mismatch</text>
<path d="M180,116 L180,148" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M180,226 L180,192" stroke="#BE123C" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
<text x="540" y="62" font-size="13" font-weight="bold" fill="#0F766E" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Transform both splits, then fit the booster</text>
<rect x="420" y="76" width="240" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="540" y="101" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">pre.fit(X_train)</text>
<rect x="420" y="150" width="240" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="540" y="175" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">pre.transform(train), (valid)</text>
<rect x="420" y="226" width="240" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="540" y="251" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">clf.fit(Xt, y, eval_set=[(Xv, yv)])</text>
<path d="M540,116 L540,148 M540,190 L540,224" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="360" y="300" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">HistGradientBoosting avoids the problem: early_stopping splits an internal validation set itself</text>
</svg>
