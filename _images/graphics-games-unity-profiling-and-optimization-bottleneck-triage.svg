<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Bottleneck triage: measure before you change anything</text>
<rect x="280" y="46" width="200" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="70.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Frame over budget?</text>
<rect x="60" y="120" width="220" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="138.7" text-anchor="middle" font-size="12" fill="#3730A3">CPU main thread &gt; budget</text>
<text x="170.0" y="153.7" text-anchor="middle" font-size="12" fill="#3730A3">(Profiler: CPU Usage)</text>
<rect x="480" y="120" width="220" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="590.0" y="138.7" text-anchor="middle" font-size="12" fill="#92400E">GPU &gt; budget</text>
<text x="590.0" y="153.7" text-anchor="middle" font-size="12" fill="#92400E">(GPU module, Frame Debugger)</text>
<line x1="330" y1="86" x2="170" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<line x1="430" y1="86" x2="590" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<rect x="20" y="200" width="160" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="100.0" y="228.8" text-anchor="middle" font-size="11" fill="#065F46">GC.Alloc in markers?</text>
<text x="100.0" y="242.8" text-anchor="middle" font-size="11" fill="#065F46">pool, cache, remove LINQ</text>
<rect x="190" y="200" width="160" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="270.0" y="221.8" text-anchor="middle" font-size="11" fill="#065F46">Scripts hot?</text>
<text x="270.0" y="235.8" text-anchor="middle" font-size="11" fill="#065F46">custom ProfilerMarker,</text>
<text x="270.0" y="249.8" text-anchor="middle" font-size="11" fill="#065F46">Jobs + Burst</text>
<rect x="410" y="200" width="160" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="490.0" y="228.8" text-anchor="middle" font-size="11" fill="#065F46">Many draw calls?</text>
<text x="490.0" y="242.8" text-anchor="middle" font-size="11" fill="#065F46">SRP Batcher, GRD, LOD</text>
<rect x="580" y="200" width="160" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660.0" y="221.8" text-anchor="middle" font-size="11" fill="#065F46">Fill rate / shaders?</text>
<text x="660.0" y="235.8" text-anchor="middle" font-size="11" fill="#065F46">resolution, overdraw,</text>
<text x="660.0" y="249.8" text-anchor="middle" font-size="11" fill="#065F46">shadow cost</text>
<line x1="130" y1="164" x2="100" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<line x1="210" y1="164" x2="270" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<line x1="550" y1="164" x2="490" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<line x1="640" y1="164" x2="660" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
<rect x="130" y="295" width="500" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="316.7" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Change one thing, profile again on the target device,</text>
<text x="380.0" y="331.7" text-anchor="middle" font-size="12" fill="#374151">compare captures (Profile Analyzer) and keep the change only if it helps</text>
<line x1="100" y1="264" x2="380" y2="295" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah5)"/>
