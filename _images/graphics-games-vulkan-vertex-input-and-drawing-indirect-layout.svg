<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vid-ind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">GPU-driven drawing with an indirect-count draw</text>
<rect x="20" y="60" width="200" height="90" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Culling compute pass</text>
<text x="120" y="110" text-anchor="middle" font-size="11" fill="#92400E">tests each book bounding box</text>
<text x="120" y="128" text-anchor="middle" font-size="11" fill="#92400E">writes commands and count</text>
<rect x="300" y="50" width="440" height="140" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="520" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Draw command array (VkDrawIndexedIndirectCommand, stride 20)</text>
<rect x="312" y="86" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="377" y="106" text-anchor="middle" font-size="11" fill="#374151">indexCount</text>
<text x="377" y="122" text-anchor="middle" font-size="11" fill="#374151">instanceCount</text>
<rect x="450" y="86" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="515" y="106" text-anchor="middle" font-size="11" fill="#374151">firstIndex</text>
<text x="515" y="122" text-anchor="middle" font-size="11" fill="#374151">vertexOffset</text>
<rect x="588" y="86" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="658" y="115" text-anchor="middle" font-size="11" fill="#374151">firstInstance</text>
<text x="520" y="165" text-anchor="middle" font-size="11" fill="#3730A3">command 0, command 1, command 2, ... up to maxDrawCount</text>
<rect x="300" y="215" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="400" y="237" text-anchor="middle" font-size="12" fill="#065F46">Count buffer: uint32 N</text>
<text x="400" y="254" text-anchor="middle" font-size="11" fill="#065F46">draws min(N, maxDrawCount)</text>
<rect x="560" y="215" width="180" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650" y="237" text-anchor="middle" font-size="12" fill="#374151">vkCmdDrawIndexed</text>
<text x="650" y="254" text-anchor="middle" font-size="12" fill="#374151">IndirectCount</text>
<line x1="220" y1="105" x2="298" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-ind)"/>
<line x1="120" y1="150" x2="120" y2="240" stroke="#4B5563" stroke-width="1.5"/>
<line x1="120" y1="240" x2="298" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-ind)"/>
<line x1="500" y1="240" x2="558" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-ind)"/>
<line x1="650" y1="190" x2="650" y2="213" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-ind)"/>
<text x="380" y="305" text-anchor="middle" font-size="12" fill="#374151">A pipeline barrier (compute write to indirect read) must separate the culling pass from the draw.</text>
</svg>
