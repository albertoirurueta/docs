<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Four ways to split a training job</title>
  <desc id="d">Four panels with three GPUs each: data parallel keeps a full model copy on every GPU and all-reduces gradients; fully sharded data parallel keeps one third of the state per GPU and gathers weights layer by layer; tensor parallel splits each weight matrix across GPUs; pipeline parallel places consecutive layers on different GPUs and streams micro-batches through them.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">Parallelism strategies compared</text>
  
<text x="24" y="60" font-size="14" font-weight="bold" fill="#0F172A">A. Data parallel (DDP)</text>  <text x="24" y="76" font-size="12" fill="#475569">full copy per GPU, batch split, gradients all-reduced</text>  <text x="24" y="98" font-size="12" fill="#475569">GPU 0</text>  <rect x="24" y="104" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="74.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">full model</text>  <rect x="24" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="74.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 0</text>  <text x="136" y="98" font-size="12" fill="#475569">GPU 1</text>  <rect x="136" y="104" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="186.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">full model</text>  <rect x="136" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="186.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 1</text>  <text x="248" y="98" font-size="12" fill="#475569">GPU 2</text>  <rect x="248" y="104" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="298.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">full model</text>  <rect x="248" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="298.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 2</text>  <line x1="24" y1="180" x2="348" y2="180" stroke="#475569" stroke-width="2"/>  <text x="186" y="196" font-size="12" text-anchor="middle" fill="#475569">all-reduce gradients</text>  <text x="384" y="60" font-size="14" font-weight="bold" fill="#0F172A">B. Fully sharded (FSDP2, ZeRO-3)</text>  <text x="384" y="76" font-size="12" fill="#475569">1/N of weights, grads, state; all-gather per layer</text>  <text x="384" y="98" font-size="12" fill="#475569">GPU 0</text>  <rect x="384" y="104" width="100" height="34" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>  <text x="434.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">shard 0/3</text>  <rect x="384" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="434.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 0</text>  <text x="496" y="98" font-size="12" fill="#475569">GPU 1</text>  <rect x="496" y="104" width="100" height="34" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>  <text x="546.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">shard 1/3</text>  <rect x="496" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="546.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 1</text>  <text x="608" y="98" font-size="12" fill="#475569">GPU 2</text>  <rect x="608" y="104" width="100" height="34" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>  <text x="658.0" y="125.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">shard 2/3</text>  <rect x="608" y="142" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="658.0" y="158.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">batch 2</text>  <rect x="384" y="172" width="324" height="24" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>  <text x="546.0" y="188.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">all-gather before use, reduce-scatter after</text>  <text x="24" y="236" font-size="14" font-weight="bold" fill="#0F172A">C. Tensor parallel</text>  <text x="24" y="252" font-size="12" fill="#475569">one weight matrix split across GPUs</text>  <text x="24" y="274" font-size="12" fill="#475569">GPU 0</text>  <rect x="24" y="280" width="100" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>  <text x="74.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">W columns 0</text>  <rect x="24" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="74.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">same batch</text>  <text x="136" y="274" font-size="12" fill="#475569">GPU 1</text>  <rect x="136" y="280" width="100" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>  <text x="186.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">W columns 1</text>  <rect x="136" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="186.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">same batch</text>  <text x="248" y="274" font-size="12" fill="#475569">GPU 2</text>  <rect x="248" y="280" width="100" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>  <text x="298.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">W columns 2</text>  <rect x="248" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="298.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">same batch</text>  <text x="186" y="366" font-size="12" text-anchor="middle" fill="#475569">all-reduce activations inside each layer</text>  <text x="384" y="236" font-size="14" font-weight="bold" fill="#0F172A">D. Pipeline parallel</text>  <text x="384" y="252" font-size="12" fill="#475569">consecutive layers on different GPUs, micro-batches</text>  <text x="384" y="274" font-size="12" fill="#475569">GPU 0</text>  <rect x="384" y="280" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="434.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">layers 1-4</text>  <line x1="484" y1="297" x2="496" y2="297" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>  <rect x="384" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="434.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">micro-batches</text>  <text x="496" y="274" font-size="12" fill="#475569">GPU 1</text>  <rect x="496" y="280" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="546.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">layers 5-8</text>  <line x1="596" y1="297" x2="608" y2="297" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>  <rect x="496" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="546.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">micro-batches</text>  <text x="608" y="274" font-size="12" fill="#475569">GPU 2</text>  <rect x="608" y="280" width="100" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="658.0" y="301.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">layers 9-12</text>  <rect x="608" y="318" width="100" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>  <text x="658.0" y="334.0" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">micro-batches</text>  <text x="546" y="366" font-size="12" text-anchor="middle" fill="#475569">activations sent stage to stage; idle bubbles</text>
  <text x="360" y="400" font-size="12" text-anchor="middle" fill="#475569">Large jobs combine them on a multi-dimensional device mesh, for example FSDP across nodes and tensor parallel inside a node.</text>
</svg>
