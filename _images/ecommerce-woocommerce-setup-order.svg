<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" width="1010" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Nine steps to set up a WooCommerce store</title>
  <desc id="d">Nine numbered steps in three rows: store details and Core Profiler, general settings, products and inventory, tax, shipping zones, payments, accounts and emails, theme and extensions, and security with the launch checks.</desc>
  <rect x="15" y="20" width="300" height="135" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="165.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">1. Store details</text>
  <text x="165.0" y="68" text-anchor="middle" font-size="12.5">Core Profiler or skip it</text>
  <text x="165.0" y="89" text-anchor="middle" font-size="12.5">address, country, currency</text>
  <text x="165.0" y="110" text-anchor="middle" font-size="12.5">woocommerce_default_country</text>
  <path d="M315 87 L345 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="347" y="20" width="300" height="135" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="497.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">2. General settings</text>
  <text x="497.0" y="68" text-anchor="middle" font-size="12.5">selling and shipping countries</text>
  <text x="497.0" y="89" text-anchor="middle" font-size="12.5">currency and number format</text>
  <text x="497.0" y="110" text-anchor="middle" font-size="12.5">coupons on or off</text>
  <path d="M647 87 L677 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="679" y="20" width="300" height="135" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="829.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">3. Products</text>
  <text x="829.0" y="68" text-anchor="middle" font-size="12.5">units, reviews, stock</text>
  <text x="829.0" y="89" text-anchor="middle" font-size="12.5">categories, attributes</text>
  <text x="829.0" y="110" text-anchor="middle" font-size="12.5">simple and variable products</text>
  <rect x="15" y="185" width="300" height="135" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="165.0" y="209" text-anchor="middle" font-size="14" font-weight="bold">4. Tax</text>
  <text x="165.0" y="233" text-anchor="middle" font-size="12.5">prices entered with tax?</text>
  <text x="165.0" y="254" text-anchor="middle" font-size="12.5">tax based on shipping address</text>
  <text x="165.0" y="275" text-anchor="middle" font-size="12.5">rates per class</text>
  <path d="M315 252 L345 252" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="347" y="185" width="300" height="135" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="497.0" y="209" text-anchor="middle" font-size="14" font-weight="bold">5. Shipping</text>
  <text x="497.0" y="233" text-anchor="middle" font-size="12.5">zones, first match wins</text>
  <text x="497.0" y="254" text-anchor="middle" font-size="12.5">flat rate, free shipping</text>
  <text x="497.0" y="275" text-anchor="middle" font-size="12.5">method order sets the default</text>
  <path d="M647 252 L677 252" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="679" y="185" width="300" height="135" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="829.0" y="209" text-anchor="middle" font-size="14" font-weight="bold">6. Payments</text>
  <text x="829.0" y="233" text-anchor="middle" font-size="12.5">bank transfer, cheque, cash</text>
  <text x="829.0" y="254" text-anchor="middle" font-size="12.5">WooPayments and others</text>
  <text x="829.0" y="275" text-anchor="middle" font-size="12.5">one gateway per row</text>
  <rect x="15" y="350" width="300" height="135" rx="10" fill="#1abc9c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="165.0" y="374" text-anchor="middle" font-size="14" font-weight="bold">7. Accounts and emails</text>
  <text x="165.0" y="398" text-anchor="middle" font-size="12.5">guest checkout, privacy text</text>
  <text x="165.0" y="419" text-anchor="middle" font-size="12.5">sender name and address</text>
  <text x="165.0" y="440" text-anchor="middle" font-size="12.5">branding of the templates</text>
  <path d="M315 417 L345 417" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="347" y="350" width="300" height="135" rx="10" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="497.0" y="374" text-anchor="middle" font-size="14" font-weight="bold">8. Theme and extensions</text>
  <text x="497.0" y="398" text-anchor="middle" font-size="12.5">block theme first</text>
  <text x="497.0" y="419" text-anchor="middle" font-size="12.5">few, maintained extensions</text>
  <text x="497.0" y="440" text-anchor="middle" font-size="12.5">check support dates</text>
  <path d="M647 417 L677 417" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="679" y="350" width="300" height="135" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="829.0" y="374" text-anchor="middle" font-size="14" font-weight="bold">9. Secure and launch</text>
  <text x="829.0" y="398" text-anchor="middle" font-size="12.5">backups, updates, 2FA</text>
  <text x="829.0" y="419" text-anchor="middle" font-size="12.5">test orders end to end</text>
  <text x="829.0" y="440" text-anchor="middle" font-size="12.5">Site visibility: live</text>
  <text x="505" y="505" text-anchor="middle" font-size="12.5">Row by row, left to right. Settings are options: wp option get woocommerce_currency shows what the screen stores.</text>
</svg>
