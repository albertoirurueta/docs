<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cell styles: one style per cell versus shared styles</title>
  <desc id="d">Left: every cell creates its own style until the 64,000 style limit of an xlsx workbook is hit. Right: many cells point to a few shared styles, which share fonts and number formats.</desc>
  <style>
    .t { fill: #1f1f1f; }
    .m { fill: #555555; }
    .box { fill: #888888; fill-opacity: 0.12; stroke: #777777; stroke-width: 1.4; }
    .ln { stroke: #777777; stroke-width: 1.5; fill: none; }
    .bad { fill: #c0392b; fill-opacity: 0.14; stroke: #c0392b; stroke-width: 1.8; }
    .badt { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececec; }
      .m { fill: #b5b5b5; }
      .box { stroke: #aaaaaa; }
      .ln { stroke: #aaaaaa; }
      .bad { stroke: #ff7b6e; }
      .badt { fill: #ff8f84; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" class="t">Cells point to styles: share them, never create one per cell</text>

  <rect x="20" y="44" width="420" height="340" rx="8" class="box"/>
  <text x="230" y="68" text-anchor="middle" font-size="14" font-weight="700" class="badt">Wrong: createCellStyle() inside the cell loop</text>
  <rect x="460" y="44" width="420" height="340" rx="8" class="box"/>
  <text x="670" y="68" text-anchor="middle" font-size="14" font-weight="700" class="t">Right: one style per look, cached</text>
  <rect x="40" y="92" width="110" height="30" rx="4" class="box"/>
  <text x="95" y="112" text-anchor="middle" font-size="12" class="t">cell A1</text>
  <rect x="260" y="92" width="160" height="30" rx="4" class="bad"/>
  <text x="340" y="112" text-anchor="middle" font-size="12" class="t">style #1 (same look)</text>
  <line x1="150" y1="107" x2="258" y2="107" class="ln" marker-end="url(#ar)"/>
  <rect x="40" y="138" width="110" height="30" rx="4" class="box"/>
  <text x="95" y="158" text-anchor="middle" font-size="12" class="t">cell A2</text>
  <rect x="260" y="138" width="160" height="30" rx="4" class="bad"/>
  <text x="340" y="158" text-anchor="middle" font-size="12" class="t">style #2 (same look)</text>
  <line x1="150" y1="153" x2="258" y2="153" class="ln" marker-end="url(#ar)"/>
  <rect x="40" y="184" width="110" height="30" rx="4" class="box"/>
  <text x="95" y="204" text-anchor="middle" font-size="12" class="t">cell A3</text>
  <rect x="260" y="184" width="160" height="30" rx="4" class="bad"/>
  <text x="340" y="204" text-anchor="middle" font-size="12" class="t">style #3 (same look)</text>
  <line x1="150" y1="199" x2="258" y2="199" class="ln" marker-end="url(#ar)"/>
  <rect x="40" y="230" width="110" height="30" rx="4" class="box"/>
  <text x="95" y="250" text-anchor="middle" font-size="12" class="t">cell A4</text>
  <rect x="260" y="230" width="160" height="30" rx="4" class="bad"/>
  <text x="340" y="250" text-anchor="middle" font-size="12" class="t">style #4 (same look)</text>
  <line x1="150" y1="245" x2="258" y2="245" class="ln" marker-end="url(#ar)"/>
  <rect x="40" y="276" width="110" height="30" rx="4" class="box"/>
  <text x="95" y="296" text-anchor="middle" font-size="12" class="t">cell A5</text>
  <rect x="260" y="276" width="160" height="30" rx="4" class="bad"/>
  <text x="340" y="296" text-anchor="middle" font-size="12" class="t">style #5 (same look)</text>
  <line x1="150" y1="291" x2="258" y2="291" class="ln" marker-end="url(#ar)"/>
  <text x="95" y="338" text-anchor="middle" font-size="18" class="m">⋮</text>
  <text x="340" y="338" text-anchor="middle" font-size="18" class="m">⋮</text>
  <rect x="40" y="346" width="380" height="30" rx="4" class="bad"/>
  <text x="230" y="366" text-anchor="middle" font-size="12" font-weight="700" class="badt">style 64,001: IllegalStateException</text>
  <rect x="480" y="92" width="110" height="30" rx="4" class="box" stroke="#1f5fa6"/>
  <text x="535" y="112" text-anchor="middle" font-size="12" class="t">A1  header</text>
  <rect x="480" y="136" width="110" height="30" rx="4" class="box" stroke="#2e8540"/>
  <text x="535" y="156" text-anchor="middle" font-size="12" class="t">A2  price</text>
  <rect x="480" y="180" width="110" height="30" rx="4" class="box" stroke="#2e8540"/>
  <text x="535" y="200" text-anchor="middle" font-size="12" class="t">B2  price</text>
  <rect x="480" y="224" width="110" height="30" rx="4" class="box" stroke="#2e8540"/>
  <text x="535" y="244" text-anchor="middle" font-size="12" class="t">A3  price</text>
  <rect x="480" y="268" width="110" height="30" rx="4" class="box" stroke="#b36b00"/>
  <text x="535" y="288" text-anchor="middle" font-size="12" class="t">C2  date</text>
  <rect x="480" y="312" width="110" height="30" rx="4" class="box" stroke="#b36b00"/>
  <text x="535" y="332" text-anchor="middle" font-size="12" class="t">C3  date</text>
  <rect x="690" y="110" width="170" height="44" rx="5" class="box" stroke="#1f5fa6" stroke-width="2.2"/>
  <text x="775" y="129" text-anchor="middle" font-size="12" font-weight="700" class="t">header style</text>
  <text x="775" y="145" text-anchor="middle" font-size="11" class="m">bold white, blue fill</text>
  <rect x="690" y="200" width="170" height="44" rx="5" class="box" stroke="#2e8540" stroke-width="2.2"/>
  <text x="775" y="219" text-anchor="middle" font-size="12" font-weight="700" class="t">price style</text>
  <text x="775" y="235" text-anchor="middle" font-size="11" class="m">#,##0.00 EUR</text>
  <rect x="690" y="290" width="170" height="44" rx="5" class="box" stroke="#b36b00" stroke-width="2.2"/>
  <text x="775" y="309" text-anchor="middle" font-size="12" font-weight="700" class="t">date style</text>
  <text x="775" y="325" text-anchor="middle" font-size="11" class="m">yyyy-mm-dd</text>
  <path d="M590,107 C640,107 640,132 688,132" class="ln" stroke="#1f5fa6" marker-end="url(#ar)"/>
  <path d="M590,151 C640,151 640,222 688,222" class="ln" stroke="#2e8540" marker-end="url(#ar)"/>
  <path d="M590,195 C640,195 640,222 688,222" class="ln" stroke="#2e8540" marker-end="url(#ar)"/>
  <path d="M590,239 C640,239 640,222 688,222" class="ln" stroke="#2e8540" marker-end="url(#ar)"/>
  <path d="M590,283 C640,283 640,312 688,312" class="ln" stroke="#b36b00" marker-end="url(#ar)"/>
  <path d="M590,327 C640,327 640,312 688,312" class="ln" stroke="#b36b00" marker-end="url(#ar)"/>
  <text x="670" y="372" text-anchor="middle" font-size="12" class="m">3 styles for any number of cells</text>
  <text x="450" y="412" text-anchor="middle" font-size="13" class="t">In xl/styles.xml a style is one &lt;xf&gt; in cellXfs; a cell only stores its index, s="n".</text>
  <text x="450" y="434" text-anchor="middle" font-size="12" class="m">Each &lt;xf&gt; references a font, a fill, a border and a number format, which are shared by every style that uses them.</text>
  <text x="450" y="454" text-anchor="middle" font-size="12" class="m">Limits: 64,000 styles in .xlsx, 4,000 in .xls (HSSF stops at 4,030).</text>
</svg>
