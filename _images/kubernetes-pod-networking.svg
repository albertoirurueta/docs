<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Pod-to-Pod traffic across two nodes over the CNI network</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>
  <text x="400" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Pod-to-Pod networking across two nodes</text>
  <text x="400" y="42" font-size="10.5" fill="#666666" text-anchor="middle">every Pod gets a routable IP with no NAT -- the CNI plugin wires each Pod's veth pair to the node bridge</text>

  <!-- Node A box -->
  <rect x="20" y="70" width="350" height="360" rx="6" fill="#f7f9fb" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="195" y="90" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Node A -- 10.0.1.5</text>

  <rect x="40" y="104" width="310" height="40" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="195" y="128" font-size="10.5" fill="#333333" text-anchor="middle">CNI plugin (Flannel / Calico / Cilium)</text>

  <rect x="40" y="156" width="310" height="30" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
  <text x="195" y="176" font-size="10" fill="#333333" text-anchor="middle">Node bridge / eBPF dataplane -- Pod CIDR 10.244.1.0/24</text>

  <rect x="60" y="210" width="130" height="90" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="125" y="232" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod</text>
  <text x="125" y="248" font-size="9" fill="#333333" text-anchor="middle">catalog-api</text>
  <text x="125" y="262" font-size="9" fill="#333333" text-anchor="middle">10.244.1.12</text>
  <text x="125" y="278" font-size="8" fill="#555555" text-anchor="middle">veth0</text>

  <rect x="200" y="210" width="130" height="90" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="265" y="232" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod</text>
  <text x="265" y="248" font-size="9" fill="#333333" text-anchor="middle">reviews-api</text>
  <text x="265" y="262" font-size="9" fill="#333333" text-anchor="middle">10.244.1.20</text>
  <text x="265" y="278" font-size="8" fill="#555555" text-anchor="middle">veth1</text>

  <rect x="40" y="330" width="310" height="46" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.2"/>
  <text x="195" y="349" font-size="10.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">kube-proxy / eBPF service routing</text>
  <text x="195" y="364" font-size="8.5" fill="#333333" text-anchor="middle">ClusterIP virtual IPs resolve to a backend Pod IP</text>

  <text x="195" y="405" font-size="9" fill="#555555" text-anchor="middle">node0 physical interface</text>
  <rect x="130" y="410" width="130" height="18" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="195" y="423" font-size="8.5" fill="#333333" text-anchor="middle">eth0</text>

  <!-- Node B box -->
  <rect x="430" y="70" width="350" height="360" rx="6" fill="#f7f9fb" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="605" y="90" font-size="12.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">Node B -- 10.0.1.6</text>

  <rect x="450" y="104" width="310" height="40" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="605" y="128" font-size="10.5" fill="#333333" text-anchor="middle">CNI plugin (Flannel / Calico / Cilium)</text>

  <rect x="450" y="156" width="310" height="30" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
  <text x="605" y="176" font-size="10" fill="#333333" text-anchor="middle">Node bridge / eBPF dataplane -- Pod CIDR 10.244.2.0/24</text>

  <rect x="540" y="210" width="130" height="90" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="605" y="232" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod</text>
  <text x="605" y="248" font-size="9" fill="#333333" text-anchor="middle">postgres-0</text>
  <text x="605" y="262" font-size="9" fill="#333333" text-anchor="middle">10.244.2.7</text>
  <text x="605" y="278" font-size="8" fill="#555555" text-anchor="middle">veth0</text>

  <rect x="450" y="330" width="310" height="46" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.2"/>
  <text x="605" y="349" font-size="10.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">kube-proxy / eBPF service routing</text>
  <text x="605" y="364" font-size="8.5" fill="#333333" text-anchor="middle">ClusterIP virtual IPs resolve to a backend Pod IP</text>

  <text x="605" y="405" font-size="9" fill="#555555" text-anchor="middle">node0 physical interface</text>
  <rect x="540" y="410" width="130" height="18" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="605" y="423" font-size="8.5" fill="#333333" text-anchor="middle">eth0</text>

  <!-- Cross-node link -->
  <line x1="195" y1="419" x2="605" y2="419" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="400" y="410" font-size="9" fill="#444444" text-anchor="middle">encapsulated or routed node-to-node traffic (VXLAN, BGP or eBPF)</text>

  <!-- reviews-api to postgres cross-node -->
  <path d="M330,255 C420,255 470,255 540,255" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="435" y="245" font-size="8.5" fill="#444444" text-anchor="middle">Pod IP to Pod IP, no NAT</text>
</svg>
