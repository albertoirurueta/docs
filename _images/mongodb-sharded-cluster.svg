<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Sharded cluster components</text>

  <defs>
    <marker id="sc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- app / driver -->
  <rect x="300" y="44" width="160" height="40" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="380" y="69" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">application / driver</text>

  <line x1="380" y1="84" x2="380" y2="112" stroke="#666666" stroke-width="1.6" marker-end="url(#sc-arrow)"/>
  <text x="470" y="103" font-size="10" fill="#666666" text-anchor="middle">connects only to mongos</text>

  <!-- mongos router tier -->
  <rect x="250" y="116" width="260" height="72" rx="6" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="134" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">query router tier</text>
  <rect x="266" y="142" width="100" height="36" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="316" y="164" font-size="11" fill="#222222" text-anchor="middle">mongos</text>
  <rect x="394" y="142" width="100" height="36" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="444" y="164" font-size="11" fill="#222222" text-anchor="middle">mongos</text>

  <!-- config servers -->
  <line x1="510" y1="152" x2="586" y2="152" stroke="#666666" stroke-width="1.6" marker-end="url(#sc-arrow)"/>
  <rect x="588" y="112" width="150" height="120" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="663" y="130" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">config servers</text>
  <text x="663" y="144" font-size="9" fill="#666666" text-anchor="middle">(CSRS replica set)</text>
  <circle cx="663" cy="164" r="9" fill="#eef2f6" stroke="#2f5424" stroke-width="1.4"/>
  <text x="663" y="168" font-size="8" fill="#222222" text-anchor="middle">P</text>
  <circle cx="663" cy="190" r="9" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="663" y="194" font-size="8" fill="#222222" text-anchor="middle">S</text>
  <circle cx="663" cy="216" r="9" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="663" y="220" font-size="8" fill="#222222" text-anchor="middle">S</text>
  <text x="663" y="248" font-size="9" fill="#666666" text-anchor="middle">metadata &amp; chunk map</text>

  <!-- lines to shards -->
  <g stroke="#666666" stroke-width="1.6" fill="none">
    <line x1="330" y1="188" x2="140" y2="286" marker-end="url(#sc-arrow)"/>
    <line x1="380" y1="188" x2="380" y2="286" marker-end="url(#sc-arrow)"/>
    <line x1="430" y1="188" x2="620" y2="286" marker-end="url(#sc-arrow)"/>
  </g>

  <!-- shard template -->
  <!-- Shard A -->
  <rect x="36" y="290" width="208" height="170" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="140" y="310" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard A</text>
  <text x="140" y="325" font-size="9" fill="#666666" text-anchor="middle">replica set</text>
  <circle cx="140" cy="356" r="14" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="140" y="360" font-size="10" fill="#222222" text-anchor="middle">P</text>
  <circle cx="96" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="96" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <circle cx="184" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="184" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3 2">
    <line x1="128" y1="368" x2="104" y2="404"/>
    <line x1="152" y1="368" x2="176" y2="404"/>
    <line x1="110" y1="418" x2="170" y2="418"/>
  </g>

  <!-- Shard B -->
  <rect x="276" y="290" width="208" height="170" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="310" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard B</text>
  <text x="380" y="325" font-size="9" fill="#666666" text-anchor="middle">replica set</text>
  <circle cx="380" cy="356" r="14" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="360" font-size="10" fill="#222222" text-anchor="middle">P</text>
  <circle cx="336" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="336" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <circle cx="424" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="424" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3 2">
    <line x1="368" y1="368" x2="344" y2="404"/>
    <line x1="392" y1="368" x2="416" y2="404"/>
    <line x1="350" y1="418" x2="410" y2="418"/>
  </g>

  <!-- Shard C -->
  <rect x="516" y="290" width="208" height="170" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="620" y="310" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard C</text>
  <text x="620" y="325" font-size="9" fill="#666666" text-anchor="middle">replica set</text>
  <circle cx="620" cy="356" r="14" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="620" y="360" font-size="10" fill="#222222" text-anchor="middle">P</text>
  <circle cx="576" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="576" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <circle cx="664" cy="418" r="14" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <text x="664" y="422" font-size="10" fill="#222222" text-anchor="middle">S</text>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3 2">
    <line x1="608" y1="368" x2="584" y2="404"/>
    <line x1="632" y1="368" x2="656" y2="404"/>
    <line x1="590" y1="418" x2="650" y2="418"/>
  </g>

  <text x="380" y="486" font-size="11" fill="#444444" text-anchor="middle">Each shard holds a subset of every sharded collection's chunks; mongos consults the config servers to route each request.</text>
</svg>
