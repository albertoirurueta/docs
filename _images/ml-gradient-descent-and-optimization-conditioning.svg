<title id="t">Feature scaling and gradient descent</title>
<desc id="d">Gradient descent paths on two quadratic loss surfaces. On the elongated surface from unscaled features the path zigzags across the narrow valley, while on the circular surface from scaled features it heads straight to the minimum.</desc>
