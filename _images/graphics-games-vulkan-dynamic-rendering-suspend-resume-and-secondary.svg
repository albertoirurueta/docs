<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dr-sus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="370" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Splitting one rendering instance across command buffers</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#374151">Same VkRenderingInfo in all three, only the flags differ; submit order is the draw order</text>
<rect x="20" y="70" width="225" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="132.5" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Command buffer A</text>
<text x="132.5" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">SUSPENDING</text>
<text x="132.5" y="147.5" text-anchor="middle" font-size="11" fill="#3730A3">loadOp runs, store skipped</text>
<line x1="245" y1="130" x2="270" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-sus)"/>
<rect x="270" y="70" width="225" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="382.5" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Command buffer B</text>
<text x="382.5" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">RESUMING and SUSPENDING</text>
<text x="382.5" y="147.5" text-anchor="middle" font-size="11" fill="#3730A3">no load, no store</text>
<line x1="495" y1="130" x2="520" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-sus)"/>
<rect x="520" y="70" width="225" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="632.5" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Command buffer C</text>
<text x="632.5" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">RESUMING</text>
<text x="632.5" y="147.5" text-anchor="middle" font-size="11" fill="#3730A3">no load, store and resolve run</text>
<rect x="20" y="215" width="720" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="235.0" text-anchor="middle" font-size="11" fill="#92400E">Only draw commands and state in between; no barriers and no other rendering instance may sit between suspend</text>
<text x="380.0" y="250.0" text-anchor="middle" font-size="11" fill="#92400E">and resume</text>
<rect x="20" y="285" width="350" height="65" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="305.0" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Alternative: secondary buffers</text>
<text x="195.0" y="320.0" text-anchor="middle" font-size="11" fill="#065F46">flag CONTENTS_SECONDARY_COMMAND_BUFFERS_BIT,</text>
<text x="195.0" y="335.0" text-anchor="middle" font-size="11" fill="#065F46">then only vkCmdExecuteCommands is valid</text>
<rect x="390" y="285" width="350" height="65" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="305.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Inheritance</text>
<text x="565.0" y="320.0" text-anchor="middle" font-size="11" fill="#374151">VkCommandBufferInheritanceRenderingInfo</text>
<text x="565.0" y="335.0" text-anchor="middle" font-size="11" fill="#374151">repeats formats and view mask</text>
</svg>
