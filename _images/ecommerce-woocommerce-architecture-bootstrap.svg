<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">WooCommerce boot order inside a WordPress request</title>
  <desc id="d">A timeline of one request. WordPress includes active plugins, so a plugin whose folder sorts before woocommerce runs its main file before WooCommerce exists. The woocommerce.php file loads the autoloader, registers the packages loader, includes the WooCommerce class and builds the container. On plugins_loaded the packages are prepared at priority minus 100, the woocommerce_loaded action fires at priority minus 1, and the packages are initialised at priority 10. On after_setup_theme the environment and template functions are set up. On init priority 0 the WooCommerce init method registers the late features, fires before_woocommerce_init, builds the factories and fires woocommerce_init. On init priority 5 post types and taxonomies are registered. On wp_loaded priority 20 the form handler processes add to cart, login and checkout actions. An extension declares feature compatibility on before_woocommerce_init and uses WooCommerce objects from woocommerce_init onwards.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="700" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">One request, in the order the hooks fire</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Priorities are the ones registered by WooCommerce 11.2.1; the column on the right is where an extension belongs</text>

  <g font-size="12.5" font-weight="bold" fill="#f2f5f8">
    <text x="40" y="92">Moment</text>
    <text x="270" y="92">What WooCommerce does there</text>
    <text x="670" y="92">What your extension does there</text>
  </g>

  <!-- rail -->
  <path d="M232 104 L232 672" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="5 4"/>

  <g font-size="12" fill="#f2f5f8">
    <!-- 1 -->
    <rect x="40" y="104" width="180" height="62" rx="8" fill="#3d5266"/>
    <text x="52" y="126" font-weight="bold">plugin files included</text>
    <text x="52" y="144">alphabetical folder order</text>
    <text x="52" y="160">class WooCommerce: not yet</text>
    <circle cx="232" cy="135" r="6" fill="#f4b860"/>
    <text x="270" y="124">woocommerce.php: Autoloader, Packages::init(),</text>
    <text x="270" y="142">include class-woocommerce.php, new Container(), WC()</text>
    <text x="270" y="160">constructor: constants, tables, includes(), init_hooks()</text>
    <text x="670" y="130">Only define, require and add_action.</text>
    <text x="670" y="148">WooCommerce may not be loaded yet,</text>
    <text x="670" y="164">so do not call WC() here.</text>

    <!-- 2 -->
    <rect x="40" y="184" width="180" height="76" rx="8" fill="#3d5266"/>
    <text x="52" y="206" font-weight="bold">plugins_loaded</text>
    <text x="52" y="224">-100 prepare_packages</text>
    <text x="52" y="240">-1 woocommerce_loaded</text>
    <text x="52" y="256">10 Packages::on_init</text>
    <circle cx="232" cy="222" r="6" fill="#f4b860"/>
    <text x="270" y="206">the base packages (Admin and Blocks) run their init at priority 10;</text>
    <text x="270" y="224">the Jetpack connection config is set at priority 1, and</text>
    <text x="270" y="242">the action woocommerce_loaded fires at priority -1</text>
    <text x="670" y="214">woocommerce_loaded: safe to use</text>
    <text x="670" y="232">WooCommerce classes and functions,</text>
    <text x="670" y="250">still no objects such as WC()->cart.</text>

    <!-- 3 -->
    <rect x="40" y="278" width="180" height="50" rx="8" fill="#3d5266"/>
    <text x="52" y="300" font-weight="bold">after_setup_theme</text>
    <text x="52" y="318">10 setup, 11 template functions</text>
    <circle cx="232" cy="303" r="6" fill="#f4b860"/>
    <text x="270" y="298">theme support and image sizes; the template functions load</text>
    <text x="270" y="316">after the theme, so functions.php can define its own versions</text>
    <text x="670" y="306">Theme support belongs to themes.</text>

    <!-- 4 -->
    <rect x="40" y="346" width="180" height="104" rx="8" fill="#3d5266"/>
    <text x="52" y="368" font-weight="bold">init, priority 0</text>
    <text x="52" y="386">WooCommerce::init()</text>
    <text x="52" y="404">1. register late features</text>
    <text x="52" y="420">2. before_woocommerce_init</text>
    <text x="52" y="436">3. woocommerce_init</text>
    <circle cx="232" cy="398" r="6" fill="#f4b860"/>
    <text x="270" y="366">FeaturesController registers its features, then the action</text>
    <text x="270" y="384">before_woocommerce_init fires (feature declarations);</text>
    <text x="270" y="402">textdomain, product and order factories, countries,</text>
    <text x="270" y="420">deprecated-hook handlers, wc_load_cart() on the front end;</text>
    <text x="270" y="438">then the action woocommerce_init</text>
    <text x="670" y="372" font-weight="bold">before_woocommerce_init</text>
    <text x="670" y="390">declare_compatibility() calls.</text>
    <text x="670" y="414" font-weight="bold">woocommerce_init</text>
    <text x="670" y="432">WC() objects and CRUD are ready.</text>

    <!-- 5 -->
    <rect x="40" y="468" width="180" height="62" rx="8" fill="#3d5266"/>
    <text x="52" y="490" font-weight="bold">init, priority 5 and 10</text>
    <text x="52" y="508">5 post types, taxonomies</text>
    <text x="52" y="524">10 shortcodes, emails, REST</text>
    <circle cx="232" cy="499" r="6" fill="#f4b860"/>
    <text x="270" y="490">product, shop_order and friends, product_cat ...</text>
    <text x="270" y="508">shortcodes, transactional emails, load_rest_api</text>
    <text x="670" y="498">Register your own post types and</text>
    <text x="670" y="516">blocks at the usual WordPress points.</text>

    <!-- 6 -->
    <rect x="40" y="548" width="180" height="50" rx="8" fill="#3d5266"/>
    <text x="52" y="570" font-weight="bold">wp_loaded, priority 20</text>
    <text x="52" y="588">WC_Form_Handler</text>
    <circle cx="232" cy="573" r="6" fill="#f4b860"/>
    <text x="270" y="568">add-to-cart URL, login, registration, cancel order,</text>
    <text x="270" y="586">cart update and the shortcode checkout form actions</text>
    <text x="670" y="578">Last point before the request is routed.</text>

    <!-- 7 -->
    <rect x="40" y="616" width="180" height="50" rx="8" fill="#3d5266"/>
    <text x="52" y="638" font-weight="bold">then, per request</text>
    <text x="52" y="656">template_redirect, REST ...</text>
    <circle cx="232" cy="641" r="6" fill="#f4b860"/>
    <text x="270" y="636">the rest is routed by WordPress: templates, wp-json, wc-ajax,</text>
    <text x="270" y="654">cron; each path fires its own WooCommerce hooks</text>
    <text x="670" y="646">Rendering and request hooks.</text>
  </g>
  <path d="M232 104 L232 672" stroke="#f4b860" stroke-width="0" marker-end="url(#a)"/>
</svg>
