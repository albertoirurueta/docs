<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Turbo Module registry and the JSI call path</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">HapticTap is resolved once, lazily, then called synchronously through a JSI host object -- never serialized</text>

  <defs>
    <marker id="tm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="tm-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- JS thread column -->
  <rect x="24" y="68" width="216" height="330" rx="10" fill="#fafafa" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="132" y="88" font-size="11" font-weight="bold" fill="#666666" text-anchor="middle">JavaScript thread (Hermes)</text>

  <rect x="40" y="100" width="184" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="132" y="124" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">PlaceCard</text>
  <text x="132" y="142" font-size="10" fill="#333333" text-anchor="middle">favourite toggle calls</text>
  <text x="132" y="157" font-size="10" fill="#333333" text-anchor="middle">HapticTap.tap('light')</text>

  <rect x="40" y="200" width="184" height="86" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="132" y="224" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">src/native/HapticTap.ts</text>
  <text x="132" y="242" font-size="10" fill="#333333" text-anchor="middle">TurboModuleRegistry</text>
  <text x="132" y="256" font-size="10" fill="#333333" text-anchor="middle">.getEnforcing&lt;Spec&gt;</text>
  <text x="132" y="270" font-size="10" fill="#333333" text-anchor="middle">('HapticTap')</text>

  <line x1="132" y1="172" x2="132" y2="200" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>

  <text x="132" y="316" font-size="10" fill="#666666" text-anchor="middle">first reference only:</text>
  <text x="132" y="330" font-size="10" fill="#666666" text-anchor="middle">resolve by name, then</text>
  <text x="132" y="344" font-size="10" fill="#666666" text-anchor="middle">the host object is cached</text>

  <!-- Registry -->
  <rect x="286" y="150" width="190" height="130" rx="8" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.8"/>
  <text x="381" y="176" font-size="12.5" font-weight="bold" fill="#a35d00" text-anchor="middle">TurboModuleManager</text>
  <text x="381" y="194" font-size="10" fill="#333333" text-anchor="middle">the registry, in C++</text>
  <text x="381" y="212" font-size="10" fill="#333333" text-anchor="middle">name -&gt; provider, from</text>
  <text x="381" y="226" font-size="10" fill="#333333" text-anchor="middle">HapticTapPackage (Android)</text>
  <text x="381" y="240" font-size="10" fill="#333333" text-anchor="middle">and the RCTModuleProvider</text>
  <text x="381" y="254" font-size="10" fill="#333333" text-anchor="middle">registration (iOS)</text>
  <text x="381" y="270" font-size="10" fill="#666666" text-anchor="middle">nothing loads at startup</text>

  <line x1="224" y1="230" x2="286" y2="220" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>
  <text x="255" y="204" font-size="9.5" fill="#666666" text-anchor="middle">lookup</text>

  <!-- JSI band -->
  <rect x="286" y="310" width="190" height="88" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="381" y="334" font-size="12.5" font-weight="bold" fill="#7a3b8f" text-anchor="middle">JSI host object</text>
  <text x="381" y="352" font-size="10" fill="#333333" text-anchor="middle">a live C++ reference held</text>
  <text x="381" y="366" font-size="10" fill="#333333" text-anchor="middle">by the JS thread: tap() is</text>
  <text x="381" y="380" font-size="10" fill="#333333" text-anchor="middle">a synchronous C++ call</text>

  <line x1="381" y1="280" x2="381" y2="310" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>
  <line x1="224" y1="264" x2="286" y2="340" stroke="#666666" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#tm-arrow-grey)"/>

  <!-- Native column -->
  <rect x="520" y="68" width="236" height="330" rx="10" fill="#fafafa" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="638" y="88" font-size="11" font-weight="bold" fill="#666666" text-anchor="middle">Native side (per platform)</text>

  <rect x="536" y="100" width="204" height="94" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="638" y="124" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Codegen output</text>
  <text x="638" y="142" font-size="10" fill="#333333" text-anchor="middle">NativeHapticTapSpec</text>
  <text x="638" y="156" font-size="10" fill="#333333" text-anchor="middle">(Kotlin abstract class)</text>
  <text x="638" y="172" font-size="10" fill="#333333" text-anchor="middle">NativeHapticTapSpec</text>
  <text x="638" y="186" font-size="10" fill="#333333" text-anchor="middle">(Objective-C++ protocol)</text>

  <rect x="536" y="222" width="204" height="106" rx="8" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="638" y="246" font-size="12.5" font-weight="bold" fill="#a33333" text-anchor="middle">Your implementation</text>
  <text x="638" y="264" font-size="10" fill="#333333" text-anchor="middle">HapticTapModule.kt</text>
  <text x="638" y="278" font-size="10" fill="#333333" text-anchor="middle">(Vibrator / HapticFeedback)</text>
  <text x="638" y="294" font-size="10" fill="#333333" text-anchor="middle">HapticTap.swift + HapticTap.mm</text>
  <text x="638" y="308" font-size="10" fill="#333333" text-anchor="middle">(UIImpactFeedbackGenerator)</text>

  <line x1="638" y1="194" x2="638" y2="222" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>
  <text x="694" y="212" font-size="9.5" fill="#666666" text-anchor="middle">conforms to</text>

  <line x1="476" y1="340" x2="590" y2="340" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>
  <line x1="590" y1="364" x2="476" y2="364" stroke="#666666" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#tm-arrow-grey)"/>
  <text x="533" y="333" font-size="9.5" fill="#666666" text-anchor="middle">tap('light')</text>
  <text x="533" y="380" font-size="9.5" fill="#666666" text-anchor="middle">returns / rejects</text>

  <line x1="638" y1="328" x2="638" y2="352" stroke="#333333" stroke-width="1.4" marker-end="url(#tm-arrow)"/>
  <rect x="536" y="352" width="204" height="34" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="638" y="374" font-size="10.5" fill="#1c4b73" text-anchor="middle">platform haptic engine fires</text>

  <text x="390" y="428" font-size="10.5" fill="#666666" text-anchor="middle">The registry resolves a module by name the first time JavaScript touches it; afterwards every call is a direct C++ invocation.</text>
  <text x="390" y="446" font-size="10.5" fill="#666666" text-anchor="middle">Codegen is what guarantees the TypeScript spec and both native signatures cannot drift apart.</text>
</svg>
