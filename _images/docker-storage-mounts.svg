<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Volumes, bind mounts and tmpfs</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Volumes, bind mounts and tmpfs</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">where the data of each mount type lives relative to the container</text>
  <rect x="20" y="60" width="720" height="300" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380" y="80" font-size="12" fill="#555555" text-anchor="middle" font-weight="bold">Docker host (or the Docker Desktop VM)</text>
  <rect x="250" y="95" width="260" height="90" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="129.5" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container</text>
  <text x="380.0" y="145.0" font-size="9.5" fill="#333333" text-anchor="middle">writable layer (ephemeral)</text>
  <text x="380.0" y="158.5" font-size="9.5" fill="#333333" text-anchor="middle">/var/lib/postgresql   /workspace   /tmp</text>
  <rect x="40" y="250" width="200" height="90" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="140.0" y="278.5" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Volume</text>
  <text x="140.0" y="293.5" font-size="9" fill="#333333" text-anchor="middle">/var/lib/docker/volumes/db-data</text>
  <text x="140.0" y="306.5" font-size="9" fill="#333333" text-anchor="middle">managed by Docker; survives rm</text>
  <text x="140.0" y="319.5" font-size="9" fill="#333333" text-anchor="middle">--mount type=volume</text>
  <rect x="280" y="250" width="200" height="90" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="278.5" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">Bind mount</text>
  <text x="380.0" y="293.5" font-size="9" fill="#333333" text-anchor="middle">any host path, e.g. ~/src/app</text>
  <text x="380.0" y="306.5" font-size="9" fill="#333333" text-anchor="middle">you manage it; host UIDs apply</text>
  <text x="380.0" y="319.5" font-size="9" fill="#333333" text-anchor="middle">--mount type=bind</text>
  <rect x="520" y="250" width="200" height="90" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="620.0" y="278.5" font-size="12" font-weight="bold" fill="#5b3a8c" text-anchor="middle">tmpfs</text>
  <text x="620.0" y="293.5" font-size="9" fill="#333333" text-anchor="middle">host memory only</text>
  <text x="620.0" y="306.5" font-size="9" fill="#333333" text-anchor="middle">gone when the container stops</text>
  <text x="620.0" y="319.5" font-size="9" fill="#333333" text-anchor="middle">--mount type=tmpfs</text>
  <line x1="300" y1="185" x2="140" y2="250" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="190" y="215" font-size="9.5" fill="#555555" text-anchor="middle">/var/lib/postgresql</text>
  <line x1="380" y1="185" x2="380" y2="250" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="415" y="225" font-size="9.5" fill="#555555" text-anchor="middle">/workspace</text>
  <line x1="460" y1="185" x2="620" y2="250" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="560" y="215" font-size="9.5" fill="#555555" text-anchor="middle">/tmp</text>
  <text x="380" y="390" font-size="10" fill="#555555" text-anchor="middle">Named volumes are the default choice for data; bind mounts for source and config in development; tmpfs for secrets and scratch.</text>
</svg>
