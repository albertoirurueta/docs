<svg viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="340" fill="#ffffff"/>
  <text x="460" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The same struct under repr(Rust) and repr(C)</text>
  <text x="460" y="46" font-size="12" fill="#666666" text-anchor="middle">struct Entry { flag: u8, id: u32, code: u16 }  -- one box per byte; grey boxes are padding</text>
  <g font-size="12" fill="#555555">
    <text x="40" y="96" font-weight="bold" fill="#1c4b73">repr(Rust) (default): 8 bytes, align 4</text>
    <text x="40" y="206" font-weight="bold" fill="#a35a00">repr(C): 12 bytes, align 4</text>
  </g>
  <!-- byte index ruler -->
  <g font-size="10" fill="#888888" text-anchor="middle">
    <text x="62" y="72">0</text><text x="118" y="72">1</text><text x="174" y="72">2</text><text x="230" y="72">3</text>
    <text x="286" y="72">4</text><text x="342" y="72">5</text><text x="398" y="72">6</text><text x="454" y="72">7</text>
    <text x="510" y="72">8</text><text x="566" y="72">9</text><text x="622" y="72">10</text><text x="678" y="72">11</text>
  </g>
  <!-- repr(Rust): id 0-3, code 4-5, flag 6, pad 7 -->
  <g stroke="#ffffff" stroke-width="2" font-size="12" text-anchor="middle">
    <rect x="34" y="108" width="224" height="44" fill="#1c4b73"/><text x="146" y="135" fill="#ffffff">id: u32 (offset 0)</text>
    <rect x="258" y="108" width="112" height="44" fill="#2e7d32"/><text x="314" y="135" fill="#ffffff">code: u16 (4)</text>
    <rect x="370" y="108" width="56" height="44" fill="#a35a00"/><text x="398" y="135" fill="#ffffff">flag</text>
    <rect x="426" y="108" width="56" height="44" fill="#dddddd"/><text x="454" y="135" fill="#666666">pad</text>
  </g>
  <!-- repr(C): flag 0, pad 1-3, id 4-7, code 8-9, pad 10-11 -->
  <g stroke="#ffffff" stroke-width="2" font-size="12" text-anchor="middle">
    <rect x="34" y="218" width="56" height="44" fill="#a35a00"/><text x="62" y="245" fill="#ffffff">flag</text>
    <rect x="90" y="218" width="168" height="44" fill="#dddddd"/><text x="174" y="245" fill="#666666">padding (3)</text>
    <rect x="258" y="218" width="224" height="44" fill="#1c4b73"/><text x="370" y="245" fill="#ffffff">id: u32 (offset 4)</text>
    <rect x="482" y="218" width="112" height="44" fill="#2e7d32"/><text x="538" y="245" fill="#ffffff">code: u16 (8)</text>
    <rect x="594" y="218" width="112" height="44" fill="#dddddd"/><text x="650" y="245" fill="#666666">tail pad (2)</text>
  </g>
  <g font-size="12" fill="#333333">
    <text x="730" y="128">fields reordered by</text>
    <text x="730" y="144">the compiler (unspecified)</text>
    <text x="730" y="238">declaration order kept;</text>
    <text x="730" y="254">matches the C ABI</text>
  </g>
  <text x="460" y="310" font-size="12" fill="#666666" text-anchor="middle">size is always a multiple of the alignment; repr(Rust) may change between compiler versions, so only repr(C) is safe for FFI</text>
</svg>
