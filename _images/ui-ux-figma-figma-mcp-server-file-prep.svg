<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Structure the file so the agent can reuse your code</text>
<rect x="20" y="48" width="330" height="230" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<rect x="410" y="48" width="330" height="230" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="185" y="74" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">Hard for the agent</text>
<text x="575" y="74" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">Easier for the agent</text>
<g font-size="12" fill="#374151">
<text x="36" y="104">Layers named Frame1268, Group5</text><text x="36" y="132">Hard-coded colours and spacing</text>
<text x="36" y="160">Absolute positioning, no auto layout</text><text x="36" y="188">Detached copies instead of components</text>
<text x="36" y="216">No Code Connect mapping</text><text x="36" y="244">One huge frame selected at once</text>
<text x="426" y="104">Purpose names: BookCard, CTA_Button</text><text x="426" y="132">Variables for colour, spacing, radius</text>
<text x="426" y="160">Auto layout that resizes correctly</text><text x="426" y="188">Components and instances reused</text>
<text x="426" y="216">Code Connect to the React Button</text><text x="426" y="244">Small selections, get_metadata first</text></g>
<line x1="352" y1="163" x2="408" y2="163" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
</svg>
