<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Kubernetes objects of the Lumen Press Helm release</title>
  <desc id="d">Visitors reach an Application Load Balancer created from the Ingress, protected by a WAF web ACL. The load balancer sends traffic to the Service lumenpress-web and then to the pods of the Deployment lumenpress-web, which are spread over zones, scaled by a HorizontalPodAutoscaler and protected by a PodDisruptionBudget. Each pod runs an nginx container and a php-fpm container that share the pod network and the uploads volume, which is an EFS-backed persistent volume claim. Configuration comes from a ConfigMap and from a Secret that External Secrets Operator builds from Secrets Manager. A CronJob runs wp cron event run every five minutes with concurrency forbidden, a pre-upgrade Job runs wp core update-db before each rollout, and an install Job runs once on a new site. All of them use the same image from ECR and the same environment, and they talk to RDS and ElastiCache.</desc>
  <rect width="760" height="560" rx="12" fill="#2b3a4a"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#f2f5f8">One Helm release, one image, one environment</text>

  <rect x="20" y="46" width="220" height="48" rx="9" fill="#3d5266"/>
  <text x="32" y="67" font-size="12.5" font-weight="bold" fill="#f2f5f8">Visitors and editors</text>
  <text x="32" y="85" font-size="12" fill="#f2f5f8">www.lumenpress.example</text>

  <rect x="270" y="46" width="470" height="48" rx="9" fill="#7a5c3a"/>
  <text x="282" y="67" font-size="12.5" font-weight="bold" fill="#f2f5f8">ALB from the Ingress, TLS from ACM, regional WAF web ACL</text>
  <text x="282" y="85" font-size="12" fill="#f2f5f8">Health check on /healthz, target type ip, sets X-Forwarded-Proto</text>

  <rect x="20" y="112" width="720" height="262" rx="10" fill="none" stroke="#9fd3c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="32" y="132" font-size="12.5" font-weight="bold" fill="#9fd3c7">Namespace lumenpress, Deployment lumenpress-web (HPA 3 to 12, PDB, zone spread)</text>

  <rect x="34" y="144" width="150" height="44" rx="8" fill="#3f6e9a"/>
  <text x="46" y="163" font-size="12.5" font-weight="bold" fill="#f2f5f8">Service</text>
  <text x="46" y="180" font-size="12" fill="#f2f5f8">lumenpress-web :80</text>

  <rect x="204" y="144" width="520" height="216" rx="9" fill="#33485c"/>
  <text x="216" y="164" font-size="12.5" font-weight="bold" fill="#f2f5f8">Pod, repeated per replica (non-root, read-only root file system)</text>
  <rect x="216" y="176" width="236" height="96" rx="8" fill="#4d7c5a"/>
  <text x="228" y="196" font-size="12.5" font-weight="bold" fill="#f2f5f8">nginx (UID 101)</text>
  <text x="228" y="214" font-size="12" fill="#f2f5f8">port 8080, static files, /healthz</text>
  <text x="228" y="232" font-size="12" fill="#f2f5f8">readiness: /readyz.php</text>
  <text x="228" y="250" font-size="12" fill="#f2f5f8">image tag git-sha-nginx</text>
  <rect x="472" y="176" width="240" height="96" rx="8" fill="#3d5266"/>
  <text x="484" y="196" font-size="12.5" font-weight="bold" fill="#f2f5f8">php-fpm (UID 33)</text>
  <text x="484" y="214" font-size="12" fill="#f2f5f8">127.0.0.1:9000, OPcache, WP-CLI</text>
  <text x="484" y="232" font-size="12" fill="#f2f5f8">code baked in, read-only</text>
  <text x="484" y="250" font-size="12" fill="#f2f5f8">image tag git-sha</text>
  <text x="216" y="294" font-size="12" fill="#f4b860">fastcgi over the pod's own loopback address</text>
  <rect x="216" y="306" width="236" height="40" rx="8" fill="#6f8aa3"/>
  <text x="228" y="323" font-size="12" font-weight="bold" fill="#1b2733">emptyDir /tmp (one per container)</text>
  <text x="228" y="338" font-size="12" fill="#1b2733">the only writable paths besides uploads</text>
  <rect x="472" y="306" width="240" height="40" rx="8" fill="#4d7c5a"/>
  <text x="484" y="323" font-size="12" font-weight="bold" fill="#f2f5f8">uploads: PVC on EFS</text>
  <text x="484" y="338" font-size="12" fill="#f2f5f8">ReadWriteMany, access point UID 33</text>

  <rect x="20" y="390" width="350" height="76" rx="9" fill="#34495e"/>
  <text x="32" y="411" font-size="12.5" font-weight="bold" fill="#f2f5f8">Configuration</text>
  <text x="32" y="430" font-size="12" fill="#f2f5f8">ConfigMap: URLs, DB host, user, prefix</text>
  <text x="32" y="448" font-size="12" fill="#f2f5f8">Secret from External Secrets: DB_PASSWORD, keys,</text>
  <text x="32" y="462" font-size="12" fill="#f2f5f8">salts, Valkey endpoint and token</text>

  <rect x="390" y="390" width="350" height="76" rx="9" fill="#3f6e9a"/>
  <text x="402" y="411" font-size="12.5" font-weight="bold" fill="#f2f5f8">Same image and environment for batch work</text>
  <text x="402" y="430" font-size="12" fill="#f2f5f8">CronJob lumenpress-cron, every 5 minutes, Forbid</text>
  <text x="402" y="448" font-size="12" fill="#f2f5f8">Job lumenpress-migrate, helm pre-upgrade hook</text>
  <text x="402" y="462" font-size="12" fill="#f2f5f8">Job lumenpress-install, first install only</text>

  <rect x="20" y="480" width="350" height="56" rx="9" fill="#2f4a44"/>
  <text x="32" y="501" font-size="12.5" font-weight="bold" fill="#f2f5f8">Outside the cluster</text>
  <text x="32" y="520" font-size="12" fill="#f2f5f8">RDS MariaDB, ElastiCache for Valkey, EFS, ECR</text>
  <text x="32" y="534" font-size="12" fill="#f2f5f8">Secrets Manager read by External Secrets</text>

  <text x="390" y="504" font-size="12" fill="#9fd3c7">Pods reach AWS through Pod Identity roles.</text>
  <text x="390" y="522" font-size="12" fill="#9fd3c7">Updates are a new image tag and helm upgrade,</text>
  <text x="390" y="536" font-size="12" fill="#9fd3c7">never a change inside a running pod.</text>
</svg>
