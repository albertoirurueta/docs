<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Spring messaging layers: application to broker</text>
  <text x="380" y="42" font-size="10.5" fill="#666666" text-anchor="middle">Spring Cloud Stream is optional: it sits above the broker-specific projects for binder-portable code</text>

  <!-- Application layer -->
  <rect x="130" y="62" width="500" height="52" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="84" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Application code</text>
  <text x="380" y="102" font-size="10" fill="#333333" text-anchor="middle">@KafkaListener / @RabbitListener / @JmsListener -- @Payload, @Header, Message&lt;T&gt;</text>

  <line x1="380" y1="114" x2="380" y2="136" stroke="#555555" stroke-width="1.4" marker-end="url(#arrowDown)"/>

  <!-- Spring Cloud Stream (optional) layer -->
  <rect x="130" y="138" width="500" height="52" fill="#f5eefa" stroke="#5a2d82" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="380" y="160" font-size="12.5" font-weight="bold" fill="#5a2d82" text-anchor="middle">Spring Cloud Stream (optional)</text>
  <text x="380" y="178" font-size="10" fill="#333333" text-anchor="middle">Supplier / Function / Consumer -- binder-portable, broker-agnostic functional model</text>

  <line x1="380" y1="190" x2="380" y2="212" stroke="#555555" stroke-width="1.4" marker-end="url(#arrowDown)"/>

  <!-- Broker-specific Spring project layer -->
  <rect x="60" y="214" width="290" height="76" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="205" y="236" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Spring for Apache Kafka</text>
  <text x="205" y="254" font-size="10" fill="#333333" text-anchor="middle">KafkaTemplate</text>
  <text x="205" y="270" font-size="10" fill="#333333" text-anchor="middle">ProducerFactory / ConsumerFactory</text>
  <text x="205" y="286" font-size="9" fill="#777777" text-anchor="middle">spring.kafka.*</text>

  <rect x="410" y="214" width="290" height="76" fill="#fdf3e6" stroke="#a3641c" stroke-width="1.4"/>
  <text x="555" y="236" font-size="12" font-weight="bold" fill="#a3641c" text-anchor="middle">Spring AMQP</text>
  <text x="555" y="254" font-size="10" fill="#333333" text-anchor="middle">RabbitTemplate / AmqpTemplate</text>
  <text x="555" y="270" font-size="10" fill="#333333" text-anchor="middle">CachingConnectionFactory</text>
  <text x="555" y="286" font-size="9" fill="#777777" text-anchor="middle">spring.rabbitmq.*</text>

  <line x1="205" y1="290" x2="205" y2="312" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <line x1="555" y1="290" x2="555" y2="312" stroke="#a3641c" stroke-width="1.4" marker-end="url(#arrowOrange)"/>

  <!-- Native client layer -->
  <rect x="60" y="314" width="290" height="46" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="205" y="342" font-size="11" fill="#222222" text-anchor="middle">kafka-clients (Producer / Consumer)</text>

  <rect x="410" y="314" width="290" height="46" fill="#ffffff" stroke="#a3641c" stroke-width="1.2"/>
  <text x="555" y="342" font-size="11" fill="#222222" text-anchor="middle">amqp-client (Channel / Connection)</text>

  <line x1="205" y1="360" x2="205" y2="382" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <line x1="555" y1="360" x2="555" y2="382" stroke="#a3641c" stroke-width="1.4" marker-end="url(#arrowOrange)"/>

  <!-- Broker layer -->
  <rect x="60" y="384" width="290" height="56" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="205" y="410" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Apache Kafka broker</text>
  <text x="205" y="428" font-size="9.5" fill="#555555" text-anchor="middle">topics and partitions</text>

  <rect x="410" y="384" width="290" height="56" fill="#fdf3e6" stroke="#a3641c" stroke-width="1.6"/>
  <text x="555" y="410" font-size="12.5" font-weight="bold" fill="#a3641c" text-anchor="middle">RabbitMQ broker</text>
  <text x="555" y="428" font-size="9.5" fill="#555555" text-anchor="middle">exchanges and queues</text>

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,7 Z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,7 Z" fill="#2d6a34"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,7 Z" fill="#a3641c"/>
    </marker>
  </defs>

  <text x="30" y="462" font-size="10.5" fill="#666666">Application code depends on Spring's broker-specific abstractions directly, or, when broker portability</text>
  <text x="30" y="476" font-size="10.5" fill="#666666">matters more than access to broker-specific features, on Spring Cloud Stream's functional model instead.</text>
</svg>
