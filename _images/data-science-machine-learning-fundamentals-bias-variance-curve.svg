<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Training and validation error against model complexity</title>
  <desc id="d">Schematic chart. As model complexity grows, training error keeps falling while validation error falls and then rises again in a U shape. The left region is underfitting with high bias, the middle is the best trade-off, and the right region is overfitting with high variance.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Error against model complexity (schematic)</text>
  <!-- regions -->
  <rect x="90" y="60" width="170" height="270" fill="#DBEAFE" opacity="0.7"/>
  <rect x="260" y="60" width="180" height="270" fill="#CCFBF1" opacity="0.8"/>
  <rect x="440" y="60" width="240" height="270" fill="#FFE4E6" opacity="0.8"/>
  <!-- axes -->
  <path d="M90 330 L90 56" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M90 330 L690 330" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="385" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Model complexity (degree, depth, 1/regularisation)</text>
  <text transform="translate(40 195) rotate(-90)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Error</text>
  <!-- curves -->
  <path d="M100 120 C170 190 250 250 330 280 S 520 312 670 318" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <path d="M100 100 C160 170 230 225 340 232 S 520 230 670 120" fill="none" stroke="#BE123C" stroke-width="3"/>
  <!-- gap -->
  <path d="M600 168 L600 308" stroke="#475569" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- optimum -->
  <line x1="340" y1="232" x2="340" y2="330" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- legend labels -->
  <text x="130" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8">Training error</text>
  <text x="450" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#BE123C">Validation error</text>
  <text x="612" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">gap</text>
  <!-- region titles -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">
    <text x="175" y="84">Underfitting</text>
    <text x="350" y="84">Best trade-off</text>
    <text x="560" y="84">Overfitting</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="175" y="102">high bias</text>
    <text x="350" y="102">lowest validation error</text>
    <text x="560" y="102">high variance</text>
  </g>
  <!-- callouts -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="140" cy="140" r="11" fill="#0F172A"/><text x="140" y="145">1</text>
    <circle cx="340" cy="200" r="11" fill="#0F172A"/><text x="340" y="205">2</text>
    <circle cx="650" cy="236" r="11" fill="#0F172A"/><text x="650" y="241">3</text>
  </g>
</svg>
