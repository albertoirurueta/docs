<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Migrating a direct-render app to the Design Editor intent</text>
  <rect x="20" y="50" width="300" height="220" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="170" y="74" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Before</text>
  <rect x="40" y="92" width="260" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="170" y="116" font-size="12" fill="#1F2937" text-anchor="middle">src/index.tsx</text>
  <text x="170" y="134" font-size="11" fill="#374151" text-anchor="middle">renders the React tree directly</text>
  <text x="170" y="180" font-size="12" fill="#374151" text-anchor="middle">Works through implicit default behaviour</text>
  <text x="170" y="200" font-size="12" fill="#374151" text-anchor="middle">No intent enrolled in the manifest</text>
  <rect x="440" y="50" width="300" height="220" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="590" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">After</text>
  <rect x="460" y="92" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5"/>
  <text x="590" y="117" font-size="12" fill="#1F2937" text-anchor="middle">src/index.tsx: prepareDesignEditor(...)</text>
  <rect x="460" y="142" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5"/>
  <text x="590" y="167" font-size="12" fill="#1F2937" text-anchor="middle">intents/design_editor/index.tsx: render</text>
  <rect x="460" y="192" width="260" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <text x="590" y="217" font-size="12" fill="#92400E" font-weight="bold" text-anchor="middle">design_editor.enrolled = true</text>
  <text x="590" y="256" font-size="11" fill="#374151" text-anchor="middle">Then: canva apps build, canva apps preview</text>
  <path d="M322,160 L438,160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="150" font-size="11" fill="#374151" text-anchor="middle">migrate</text>
  <text x="380" y="176" font-size="10" fill="#374151" text-anchor="middle">design-editor-intent</text>
  <text x="380" y="300" font-size="12" fill="#374151" text-anchor="middle">Upgrade to Apps SDK v2 first, then migrate.</text>
  <text x="380" y="320" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic project, not a screenshot of any product.</text>
</svg>
