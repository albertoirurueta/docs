<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="ctt ctd" font-family="Arial, Helvetica, sans-serif">
<title id="ctt">ColumnTransformer data flow</title>
<desc id="ctd">A table with columns age, income, city and id is split by column. A numeric pipeline handles age and income, a one-hot encoder handles city, and the remainder column id is dropped or passed through. The results are joined side by side into one output.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">ColumnTransformer: split, transform, join</text>
<rect x="24" y="60" width="150" height="270" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="99" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Input X</text>
<rect x="40" y="100" width="118" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="99" y="125" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">age</text>
<rect x="40" y="150" width="118" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="99" y="175" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">income</text>
<rect x="40" y="200" width="118" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="99" y="225" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">city</text>
<rect x="40" y="250" width="118" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="99" y="275" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">id</text>
<text x="99" y="314" text-anchor="middle" font-size="12" fill="#475569">not listed anywhere</text>
<rect x="250" y="70" width="200" height="90" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="350" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">"num" (a Pipeline)</text>
<text x="350" y="116" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">SimpleImputer</text>
<text x="350" y="138" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">StandardScaler</text>
<rect x="250" y="176" width="200" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="350" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">"cat"</text>
<text x="350" y="224" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">OneHotEncoder</text>
<rect x="250" y="262" width="200" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="350" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">"remainder"</text>
<text x="350" y="306" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">drop or passthrough</text>
<rect x="520" y="70" width="176" height="248" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="608" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Output (side by side)</text>
<rect x="534" y="110" width="148" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="608" y="132" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">num__age</text>
<rect x="534" y="152" width="148" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="608" y="174" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">num__income</text>
<rect x="534" y="194" width="148" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="608" y="216" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">cat__city_Madrid</text>
<rect x="534" y="236" width="148" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="608" y="258" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">cat__city_Paris</text>
<rect x="534" y="278" width="148" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="608" y="298" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">remainder__id</text>
<line x1="160" y1="120" x2="246" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="160" y1="170" x2="246" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="160" y1="220" x2="246" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="160" y1="270" x2="246" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="452" y1="115" x2="516" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="452" y1="211" x2="516" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="452" y1="290" x2="516" y2="292" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<circle cx="205" cy="100" r="11" fill="#0F172A"/><text x="205" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="485" cy="98" r="11" fill="#0F172A"/><text x="485" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
<circle cx="485" cy="318" r="11" fill="#0F172A"/><text x="485" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
</svg>
