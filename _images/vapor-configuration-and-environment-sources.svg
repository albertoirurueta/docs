<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a Vapor setting comes from</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">one choice of environment, then a lookup order for every value, then one typed value for the handlers</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- left: which environment -->
  <text x="40" y="76" font-size="14" font-weight="bold" fill="#1f5f99">1. Which environment? (Environment.detect)</text>
  <rect x="40" y="88" width="360" height="52" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="56" y="110" font-size="13" font-weight="bold" fill="#222222">--env or -e on the command line</text>
  <text x="56" y="128" font-size="11" fill="#222222">swift run App serve --env staging</text>
  <rect x="40" y="158" width="360" height="52" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="56" y="180" font-size="13" font-weight="bold" fill="#222222">VAPOR_ENV process variable</text>
  <text x="56" y="198" font-size="11" fill="#222222">used when no --env flag is given</text>
  <rect x="40" y="228" width="360" height="52" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="56" y="250" font-size="13" font-weight="bold" fill="#222222">default: development</text>
  <text x="56" y="268" font-size="11" fill="#222222">prod and production, dev and development, test and testing</text>
  <line x1="220" y1="140" x2="220" y2="156" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="210" x2="220" y2="226" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="152" font-size="10" fill="#666666">else</text>
  <text x="232" y="222" font-size="10" fill="#666666">else</text>

  <!-- right: which value -->
  <text x="500" y="76" font-size="14" font-weight="bold" fill="#b7410e">2. Which value? (first match wins)</text>
  <rect x="500" y="88" width="400" height="44" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="516" y="107" font-size="13" font-weight="bold" fill="#222222">process environment</text>
  <text x="516" y="123" font-size="11" fill="#222222">export, Docker -e, Kubernetes env and envFrom</text>
  <rect x="500" y="146" width="400" height="44" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="516" y="165" font-size="13" font-weight="bold" fill="#222222">.env.&lt;environment&gt;</text>
  <text x="516" y="181" font-size="11" fill="#222222">for example .env.staging, from the working directory</text>
  <rect x="500" y="204" width="400" height="44" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="516" y="223" font-size="13" font-weight="bold" fill="#222222">.env</text>
  <text x="516" y="239" font-size="11" fill="#222222">shared template values; a file never overwrites the process</text>
  <rect x="500" y="262" width="400" height="44" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="516" y="281" font-size="13" font-weight="bold" fill="#222222">default written in code</text>
  <text x="516" y="297" font-size="11" fill="#222222">only for values that are safe in every environment</text>
  <line x1="700" y1="132" x2="700" y2="144" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="190" x2="700" y2="202" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="248" x2="700" y2="260" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- secrets side note -->
  <rect x="40" y="310" width="360" height="52" rx="8" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="56" y="332" font-size="13" font-weight="bold" fill="#6a3d9a">Secrets: Environment.secret(key:)</text>
  <text x="56" y="350" font-size="11" fill="#222222">DATABASE_URL_FILE names a mounted file whose text is the value</text>
  <line x1="400" y1="330" x2="498" y2="116" stroke="#6a3d9a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <!-- bottom: AppConfig -->
  <line x1="220" y1="362" x2="220" y2="388" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="306" x2="700" y2="388" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="40" y="390" width="860" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="470" y="414" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">3. AppConfig.load(for: app.environment) in configure(_:), then app.config in app.storage</text>
  <text x="470" y="433" font-size="11" fill="#222222" text-anchor="middle">validated once, every problem reported together, secrets redacted; handlers read req.config and never call getenv</text>
</svg>
