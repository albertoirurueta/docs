  <rect x="190.0" y="256" width="33.0" height="22" fill="#2563eb"/>
  <rect x="223.0" y="256" width="17.4" height="22" fill="#d97706"/>
  <rect x="240.4" y="256" width="2.9" height="22" fill="#64748b"/>
