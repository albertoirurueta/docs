<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Helvetica, Arial, sans-serif">
  <title>Memory breakdown: weights, KV cache (32k context) and overhead</title>
  <rect x="0" y="0" width="900" height="550" fill="#f8fafc"/>
  <text x="450.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Memory to serve one 32k-token sequence (GiB)</text>
  <text x="450.0" y="54" text-anchor="middle" font-size="12" fill="#334155">computed from M = P x b + 2 L n_kv d_h T b_kv + 1 GiB overhead (FP16 KV cache)</text>
  <text x="180" y="106" text-anchor="end" font-size="12" fill="#0f172a">8B dense FP16</text>
