<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Amazon ECS building blocks: Bookshelf catalog-api on Fargate</text>

  <!-- internet + ALB -->
  <rect x="20" y="210" width="110" height="50" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="75" y="240" text-anchor="middle" font-size="13" fill="#1a1a1a">Clients</text>
  <line x1="130" y1="235" x2="170" y2="235" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="170,230 180,235 170,240" fill="#3c4a58"/>
  <rect x="180" y="190" width="130" height="90" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="1.8"/>
  <text x="245" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Application</text>
  <text x="245" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Load Balancer</text>
  <text x="245" y="262" text-anchor="middle" font-size="11" fill="#7a4800">alb-bookshelf, HTTPS</text>
  <line x1="310" y1="235" x2="350" y2="235" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="350,230 360,235 350,240" fill="#3c4a58"/>
  <text x="335" y="222" text-anchor="middle" font-size="10" fill="#3c4a58">ip targets</text>

  <!-- cluster -->
  <rect x="360" y="46" width="520" height="440" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="378" y="70" font-size="14" font-weight="700" fill="#3c4a58">Cluster: bookshelf (logical grouping, Region-scoped)</text>

  <!-- service -->
  <rect x="378" y="86" width="484" height="270" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="396" y="108" font-size="13" font-weight="700" fill="#123a72">Service: catalog-api (desired count, deployment config, load balancer, Auto Scaling)</text>

  <!-- task 1 -->
  <rect x="396" y="124" width="215" height="212" rx="8" fill="#dbe7fb" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="503" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Task (AZ a) - own ENI, own IP</text>
  <rect x="412" y="156" width="183" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="503" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Container: app</text>
  <text x="503" y="198" text-anchor="middle" font-size="11" fill="#3c4a58">catalog-api:1.0.0 :8080</text>
  <text x="503" y="214" text-anchor="middle" font-size="10" fill="#3c4a58">essential, health check</text>
  <rect x="412" y="236" width="183" height="40" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="4,3"/>
  <text x="503" y="260" text-anchor="middle" font-size="11" fill="#3c4a58">optional sidecar (agent, proxy)</text>
  <text x="503" y="300" text-anchor="middle" font-size="11" fill="#3c4a58">sized by task-level</text>
  <text x="503" y="316" text-anchor="middle" font-size="11" fill="#3c4a58">CPU + memory (Fargate)</text>

  <!-- task 2 -->
  <rect x="627" y="124" width="215" height="212" rx="8" fill="#dbe7fb" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="734" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Task (AZ b) - own ENI, own IP</text>
  <rect x="643" y="156" width="183" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="734" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Container: app</text>
  <text x="734" y="198" text-anchor="middle" font-size="11" fill="#3c4a58">catalog-api:1.0.0 :8080</text>
  <text x="734" y="214" text-anchor="middle" font-size="10" fill="#3c4a58">essential, health check</text>
  <rect x="643" y="236" width="183" height="40" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="4,3"/>
  <text x="734" y="260" text-anchor="middle" font-size="11" fill="#3c4a58">optional sidecar (agent, proxy)</text>
  <text x="734" y="300" text-anchor="middle" font-size="11" fill="#3c4a58">each task is one run of</text>
  <text x="734" y="316" text-anchor="middle" font-size="11" fill="#3c4a58">the same task definition revision</text>

  <!-- task definition -->
  <rect x="378" y="370" width="230" height="102" rx="10" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="1.8"/>
  <text x="493" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Task definition catalog-api:7</text>
  <text x="493" y="412" text-anchor="middle" font-size="11" fill="#14532d">images, ports, CPU/memory,</text>
  <text x="493" y="428" text-anchor="middle" font-size="11" fill="#14532d">env + secrets, log config,</text>
  <text x="493" y="444" text-anchor="middle" font-size="11" fill="#14532d">network mode awsvpc,</text>
  <text x="493" y="460" text-anchor="middle" font-size="11" fill="#14532d">task role + execution role</text>

  <!-- capacity -->
  <rect x="626" y="370" width="236" height="102" rx="10" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.8"/>
  <text x="744" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Capacity providers</text>
  <text x="744" y="412" text-anchor="middle" font-size="11" fill="#4a1d75">FARGATE, FARGATE_SPOT,</text>
  <text x="744" y="428" text-anchor="middle" font-size="11" fill="#4a1d75">EC2 Auto Scaling groups,</text>
  <text x="744" y="444" text-anchor="middle" font-size="11" fill="#4a1d75">ECS Managed Instances</text>
  <text x="744" y="460" text-anchor="middle" font-size="10" fill="#4a1d75">strategy: base + weight</text>

  <line x1="493" y1="370" x2="493" y2="340" stroke="#1e7b3a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="744" y1="370" x2="744" y2="340" stroke="#7b3fb5" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- left legend -->
  <text x="20" y="330" font-size="12" font-weight="700" fill="#3c4a58">Outside the cluster</text>
  <text x="20" y="350" font-size="11" fill="#3c4a58">ECR: image source</text>
  <text x="20" y="368" font-size="11" fill="#3c4a58">CloudWatch Logs: awslogs</text>
  <text x="20" y="386" font-size="11" fill="#3c4a58">Secrets Manager / SSM</text>
  <text x="20" y="404" font-size="11" fill="#3c4a58">VPC subnets + security groups</text>
</svg>
