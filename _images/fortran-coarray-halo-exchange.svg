<text x="475.0" y="278" font-size="12.5" fill="#a04a00" text-anchor="middle" font-family="Courier New, monospace">if (me &lt; np) u(:, nloc + 1) = u(:, 1)[me + 1]</text>
<text x="475.0" y="296" font-size="11.5" fill="#666666" text-anchor="middle">blue and orange arrows: each image reads its neighbours' edge rows; nothing is sent, the owner does not take part</text>
