<text x="30" y="590" font-size="12" fill="#444444">Hatched gaps: an image that finished its segment early waits for the slowest one. Everything an image does between two barriers is one segment.</text>
<text x="30" y="608" font-size="12" fill="#444444">The coindexed read of segment A on image 2 sees the data written by image 1 in segment B of the previous step only because a sync all lies between them.</text>
