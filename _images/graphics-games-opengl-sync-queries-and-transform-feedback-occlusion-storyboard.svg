<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Bookshelf GL: skipping a hidden book with an occlusion query</text>
<rect x="20" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/><text x="36" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="110" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Occluder</text>
<rect x="40" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<rect x="48" y="100" width="114" height="94" rx="3" fill="#E5E7EB" stroke="#92400E" stroke-width="2"/>
<text x="105" y="226" text-anchor="middle" font-size="10" fill="#374151">Draw the shelf front first</text>
<text x="105" y="242" text-anchor="middle" font-size="10" fill="#374151">depth buffer is filled</text>
<rect x="203" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="219" cy="66" r="11" fill="#4F46E5"/><text x="219" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="293" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Query</text>
<rect x="223" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<rect x="231" y="100" width="114" height="94" rx="3" fill="#E5E7EB" stroke="#92400E" stroke-width="2"/>
<rect x="258" y="125" width="60" height="45" rx="2" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="288" y="226" text-anchor="middle" font-size="10" fill="#374151">Begin query, draw the book box</text>
<text x="288" y="242" text-anchor="middle" font-size="10" fill="#374151">colour and depth writes off</text>
<rect x="386" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="66" r="11" fill="#4F46E5"/><text x="402" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="476" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">End</text>
<rect x="406" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<rect x="414" y="100" width="114" height="94" rx="3" fill="#E5E7EB" stroke="#92400E" stroke-width="2"/>
<rect x="441" y="125" width="60" height="45" rx="2" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="471" y="226" text-anchor="middle" font-size="10" fill="#374151">glEndQuery, keep drawing</text>
<text x="471" y="242" text-anchor="middle" font-size="10" fill="#374151">other work hides the latency</text>
<rect x="569" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="585" cy="66" r="11" fill="#B45309"/><text x="585" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="659" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Result</text>
<rect x="589" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<rect x="597" y="100" width="114" height="94" rx="3" fill="#E5E7EB" stroke="#92400E" stroke-width="2"/>
<rect x="624" y="125" width="60" height="45" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="654" y="152" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">0 samples</text>
<text x="654" y="226" text-anchor="middle" font-size="10" fill="#374151">Next frame: result is 0</text>
<text x="654" y="242" text-anchor="middle" font-size="10" fill="#374151">skip the book's real draw</text>
<text x="380" y="324" text-anchor="middle" font-size="11" fill="#4B5563">The dashed box is the book's bounding box; it is hidden behind the shelf front, so no sample passes.</text>
</svg>
