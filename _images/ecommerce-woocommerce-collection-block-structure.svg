<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Anatomy of the Product Collection block</title>
  <desc id="d">The woocommerce/product-collection block is drawn as an outer dashed container. Inside it, from top to bottom: an optional Product Filters block, the Product Template block that repeats once per product and holds Product Image, Post Title, Product Price and Product Button, the query pagination blocks, and the No Results block that replaces the template when nothing matches. A column on the right lists the block attributes (queryId, query, displayLayout, collection, hideControls, forcePageReload, dimensions, queryContextIncludes) and the block context that the container provides to its inner blocks.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Anatomy of a Product Collection block</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">woocommerce/product-collection in WooCommerce 11.2.1: attributes and context on the container, the product markup in the inner blocks</text>
  <rect x="40" y="80" width="590" height="452" rx="6" fill="#2b3a4a" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="102" font-size="13" font-weight="bold" fill="#f4b860">woocommerce/product-collection</text>
  <rect x="60" y="118" width="550" height="46" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="335.0" y="137.0" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce/product-filters</text>
  <text x="335.0" y="154.0" font-size="12" fill="#f2f5f8" text-anchor="middle">optional; a descendant, or a sibling when the query is inherited from the template</text>
  <rect x="60" y="180" width="550" height="190" rx="6" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5"/>
  <text x="76" y="202" font-size="12.5" font-weight="bold" fill="#f2f5f8">woocommerce/product-template</text>
  <text x="594" y="202" font-size="12" fill="#9fd3c7" text-anchor="end">repeated once per product</text>
  <rect x="76" y="220" width="125" height="74" rx="6" fill="#3d5266"/>
  <text x="138.5" y="245.5" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce/</text>
  <text x="138.5" y="261.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">product-image</text>
  <text x="138.5" y="277.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">sale badge inside</text>
  <rect x="209" y="220" width="125" height="74" rx="6" fill="#3d5266"/>
  <text x="271.5" y="245.5" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">core/</text>
  <text x="271.5" y="261.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">post-title</text>
  <text x="271.5" y="277.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">isLink: true</text>
  <rect x="342" y="220" width="125" height="74" rx="6" fill="#3d5266"/>
  <text x="404.5" y="245.5" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce/</text>
  <text x="404.5" y="261.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">product-price</text>
  <text x="404.5" y="277.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">regular and sale</text>
  <rect x="475" y="220" width="125" height="74" rx="6" fill="#3d5266"/>
  <text x="537.5" y="245.5" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce/</text>
  <text x="537.5" y="261.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">product-button</text>
  <text x="537.5" y="277.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">add to cart</text>
  <text x="76" y="318" font-size="12" fill="#f2f5f8">Each inner block reads the product of the current iteration (postId) from block context;</text>
  <text x="76" y="336" font-size="12" fill="#f2f5f8">attributes such as isDescendentOfQueryLoop tell WooCommerce blocks they sit in a loop.</text>
  <text x="76" y="356" font-size="12" fill="#f2f5f8">Other blocks can be added here: core/group, core/heading, woocommerce/product-sku, ...</text>
  <rect x="60" y="386" width="550" height="46" rx="6" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5"/>
  <text x="335.0" y="405.0" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">core/query-pagination</text>
  <text x="335.0" y="422.0" font-size="12" fill="#f2f5f8" text-anchor="middle">previous, numbers, next; client-side navigation unless forcePageReload is true</text>
  <rect x="60" y="446" width="550" height="70" rx="6" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5"/>
  <text x="335.0" y="468.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce/product-collection-no-results</text>
  <text x="335.0" y="485.5" font-size="12" fill="#f2f5f8" text-anchor="middle">rendered instead of the template when the query has no product, for example</text>
  <text x="335.0" y="502.5" font-size="12" fill="#f2f5f8" text-anchor="middle">after a filter combination that matches nothing</text>
  <rect x="655" y="80" width="265" height="250" rx="6" fill="#3d5266"/>
  <text x="669" y="102" font-size="13" font-weight="bold" fill="#f4b860">Attributes (block.json)</text>
  <text x="669" y="126" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">queryId</text>
  <text x="815" y="126" font-size="11.5" fill="#9fd3c7">number</text>
  <text x="669" y="147" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">query</text>
  <text x="815" y="147" font-size="11.5" fill="#9fd3c7">object</text>
  <text x="669" y="168" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">displayLayout</text>
  <text x="815" y="168" font-size="11.5" fill="#9fd3c7">flex, list, carousel</text>
  <text x="669" y="189" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">collection</text>
  <text x="815" y="189" font-size="11.5" fill="#9fd3c7">string</text>
  <text x="669" y="210" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">hideControls</text>
  <text x="815" y="210" font-size="11.5" fill="#9fd3c7">string[]</text>
  <text x="669" y="231" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">forcePageReload</text>
  <text x="815" y="231" font-size="11.5" fill="#9fd3c7">boolean</text>
  <text x="669" y="252" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">dimensions</text>
  <text x="815" y="252" font-size="11.5" fill="#9fd3c7">object</text>
  <text x="669" y="273" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">queryContextIncludes</text>
  <text x="815" y="273" font-size="11.5" fill="#9fd3c7">string[]</text>
  <text x="669" y="294" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">tagName</text>
  <text x="815" y="294" font-size="11.5" fill="#9fd3c7">string</text>
  <rect x="655" y="346" width="265" height="186" rx="6" fill="#3d5266"/>
  <text x="669" y="368" font-size="13" font-weight="bold" fill="#9fd3c7">Context given to inner blocks</text>
  <text x="669" y="390" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">queryId</text>
  <text x="669" y="408" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">query</text>
  <text x="669" y="426" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">displayLayout</text>
  <text x="669" y="444" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">dimensions</text>
  <text x="669" y="462" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">collection</text>
  <text x="669" y="480" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">forcePageReload</text>
  <text x="669" y="498" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">queryContextIncludes</text>
  <text x="669" y="518" font-size="11" fill="#f2f5f8">Product Filters reads queryId and query.</text>
</svg>
