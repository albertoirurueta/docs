<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: submitting Bookshelf Covers for review</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g fill="#EEF2FF" stroke="#9CA3AF"><rect x="30" y="100" width="104" height="140" rx="4"/><rect x="182" y="100" width="104" height="140" rx="4"/><rect x="334" y="100" width="104" height="140" rx="4"/><rect x="486" y="100" width="104" height="140" rx="4"/></g>
  <rect x="636" y="100" width="96" height="140" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <!-- panel 1: bundle upload -->
  <rect x="42" y="116" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="82" y="131" font-size="11" fill="#374151" text-anchor="middle">bundle.js</text>
  <rect x="42" y="154" width="80" height="26" rx="13" fill="#4F46E5"/><text x="82" y="171" font-size="11" fill="#FFFFFF" text-anchor="middle">Upload</text>
  <text x="82" y="212" font-size="11" fill="#374151" text-anchor="middle">Draft version</text>
  <!-- panel 2: listing -->
  <g fill="#FFFFFF" stroke="#9CA3AF"><rect x="194" y="114" width="80" height="14" rx="3"/><rect x="194" y="136" width="80" height="34" rx="3"/><rect x="194" y="178" width="36" height="28" rx="3"/><rect x="238" y="178" width="36" height="28" rx="3"/></g>
  <text x="234" y="225" font-size="11" fill="#374151" text-anchor="middle">Text, Media, Links</text>
  <!-- panel 3: testing -->
  <g fill="#FFFFFF" stroke="#9CA3AF"><rect x="346" y="114" width="80" height="16" rx="3"/><rect x="346" y="138" width="80" height="16" rx="3"/><rect x="346" y="162" width="80" height="40" rx="3"/></g>
  <text x="386" y="125" font-size="11" fill="#374151" text-anchor="middle">test account</text><text x="386" y="149" font-size="11" fill="#374151" text-anchor="middle">password</text><text x="386" y="220" font-size="11" fill="#374151" text-anchor="middle">Notes for reviewer</text>
  <!-- panel 4: submit -->
  <rect x="498" y="116" width="80" height="16" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="128" font-size="11" fill="#374151" text-anchor="middle">[x] terms</text>
  <rect x="498" y="150" width="80" height="26" rx="13" fill="#4F46E5"/><text x="538" y="167" font-size="11" fill="#FFFFFF" text-anchor="middle">Submit</text>
  <text x="538" y="204" font-size="11" fill="#374151" text-anchor="middle">State: Submitted</text><text x="538" y="220" font-size="11" fill="#374151" text-anchor="middle">edits locked</text>
  <!-- panel 5 -->
  <text x="684" y="140" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Approved</text>
  <rect x="650" y="160" width="68" height="26" rx="13" fill="#B45309"/><text x="684" y="177" font-size="11" fill="#FFFFFF" text-anchor="middle">Release</text>
  <text x="684" y="214" font-size="11" fill="#92400E" text-anchor="middle">Live in editor</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Upload the</text><text x="82" y="338">app bundle</text><text x="234" y="322">Fill in the</text><text x="234" y="338">listing details</text><text x="386" y="322">Add testing</text><text x="386" y="338">instructions</text><text x="538" y="322">Accept terms</text><text x="538" y="338">and submit</text><text x="684" y="322">Approved, then</text><text x="684" y="338">release</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic submission flow, not a screenshot of any product.</text>
</svg>
