<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <title>Company PBX topology for the DocsAssistant phone agent</title>
  <desc>Topology of the company PBX path. A caller on the public telephone network reaches an ITSP SIP trunk provider, which sends SIP over TLS with SRTP media to a session border controller or firewall at the edge of the company network. The edge forwards to Asterisk, which routes extension 7000 through the dialplan to a Stasis application. Asterisk is controlled by a voice service over ARI using REST and an events WebSocket, and streams the call audio to the same voice service over chan_websocket, AudioSocket or RTP External Media. The voice service, written with Pipecat in Python or Spring Boot in Java, calls speech to text, the DocsAssistant core with retrieval, and text to speech, and sends synthesised audio back. Desk phones register to Asterisk and can be transferred to a human extension.</desc>
  <rect x="0" y="0" width="1000" height="440" fill="#f8fafc"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Company PBX path: phone call to DocsAssistant</text>
  <rect x="20" y="60" width="150" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="95" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Caller</text>
  <text x="95" y="115" text-anchor="middle" font-size="12" fill="#0f172a">public telephone</text>
  <text x="95" y="132" text-anchor="middle" font-size="12" fill="#0f172a">network (PSTN)</text>
  <rect x="215" y="60" width="150" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="290" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">SIP trunk</text>
  <text x="290" y="115" text-anchor="middle" font-size="12" fill="#0f172a">ITSP provider</text>
  <text x="290" y="132" text-anchor="middle" font-size="12" fill="#0f172a">DID number</text>
  <rect x="410" y="60" width="150" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="485" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Edge / SBC</text>
  <text x="485" y="115" text-anchor="middle" font-size="12" fill="#0f172a">firewall, allow-list,</text>
  <text x="485" y="132" text-anchor="middle" font-size="12" fill="#0f172a">rate limits</text>
  <rect x="605" y="60" width="180" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="695" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Asterisk (PJSIP)</text>
  <text x="695" y="110" text-anchor="middle" font-size="12" fill="#0f172a">exten 7000 then</text>
  <text x="695" y="127" text-anchor="middle" font-size="12" fill="#0f172a">Stasis(docs-assistant)</text>
  <rect x="820" y="60" width="160" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="900" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Desk phones</text>
  <text x="900" y="115" text-anchor="middle" font-size="12" fill="#0f172a">human extensions</text>
  <text x="900" y="132" text-anchor="middle" font-size="12" fill="#0f172a">(transfer target)</text>
  <line x1="170" y1="105" x2="215" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="365" y1="105" x2="410" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="560" y1="105" x2="605" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="785" y1="105" x2="820" y2="105" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#0f172a">SIP over TLS, SRTP media</text>
  <rect x="520" y="230" width="460" height="170" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="750" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Voice service (Pipecat in Python or Spring Boot in Java)</text>
  <rect x="540" y="272" width="130" height="50" rx="6" fill="#f8fafc" stroke="#15803d"/>
  <text x="605" y="302" text-anchor="middle" font-size="12" fill="#0f172a">ARI client</text>
  <rect x="685" y="272" width="130" height="50" rx="6" fill="#f8fafc" stroke="#15803d"/>
  <text x="750" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Audio endpoint</text>
  <rect x="830" y="272" width="130" height="50" rx="6" fill="#f8fafc" stroke="#15803d"/>
  <text x="895" y="302" text-anchor="middle" font-size="12" fill="#0f172a">STT / TTS / VAD</text>
  <rect x="685" y="340" width="275" height="46" rx="6" fill="#f8fafc" stroke="#15803d"/>
  <text x="822" y="368" text-anchor="middle" font-size="12" fill="#0f172a">DocsAssistant core: ask(...) + retrieval</text>
  <line x1="685" y1="150" x2="605" y2="272" stroke="#1d4ed8" stroke-width="2"/>
  <text x="560" y="215" font-size="11" fill="#0f172a">ARI: REST + events</text>
  <text x="560" y="229" font-size="11" fill="#0f172a">WebSocket (port 8088)</text>
  <line x1="740" y1="150" x2="750" y2="272" stroke="#b45309" stroke-width="3"/>
  <text x="760" y="205" font-size="11" fill="#0f172a">call audio: chan_websocket,</text>
  <text x="760" y="219" font-size="11" fill="#0f172a">AudioSocket or RTP</text>
  <line x1="815" y1="297" x2="830" y2="297" stroke="#0f172a" stroke-width="2"/>
  <line x1="895" y1="322" x2="895" y2="340" stroke="#0f172a" stroke-width="2"/>
  <rect x="20" y="230" width="460" height="170" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Alternatives that skip the PBX audio hop</text>
  <text x="40" y="285" font-size="12" fill="#0f172a">SIP trunk straight to OpenAI Realtime (sip.api.openai.com)</text>
  <text x="40" y="310" font-size="12" fill="#0f172a">SIP trunk to ElevenLabs Agents</text>
  <text x="40" y="335" font-size="12" fill="#0f172a">SIP trunk to LiveKit SIP, then a LiveKit agent worker</text>
  <text x="40" y="360" font-size="12" fill="#0f172a">FreeSWITCH mod_audio_stream or Jambonz instead of Asterisk</text>
  <text x="40" y="385" font-size="12" fill="#0f172a">Codec on the wire: G.711 ulaw/alaw 8 kHz, slin16 inside</text>
</svg>
