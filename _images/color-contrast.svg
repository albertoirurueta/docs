<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="260" fill="#ffffff"/>

  <!-- Failing swatch -->
  <rect x="20" y="20" width="240" height="180" fill="#ffffff" stroke="#8a5a10" stroke-width="2"/>
  <text x="140" y="110" font-size="22" fill="#d8d8d8" text-anchor="middle">Sample Text</text>
  <text x="140" y="150" font-size="13" fill="#8a5a10" text-anchor="middle">Contrast ratio: 1.43:1</text>
  <text x="140" y="185" font-size="15" font-weight="bold" fill="#a4341a" text-anchor="middle">Fails AA</text>

  <!-- Passing swatch -->
  <rect x="300" y="20" width="240" height="180" fill="#f4f4f4" stroke="#2a6636" stroke-width="2"/>
  <text x="420" y="110" font-size="22" fill="#1c1c1c" text-anchor="middle">Sample Text</text>
  <text x="420" y="150" font-size="13" fill="#2a6636" text-anchor="middle">Contrast ratio: 15.49:1</text>
  <text x="420" y="185" font-size="15" font-weight="bold" fill="#2a6636" text-anchor="middle">Passes AA</text>

  <text x="280" y="240" font-size="12" fill="#555555" text-anchor="middle">WCAG AA requires at least 4.5:1 for normal-size text</text>
</svg>
