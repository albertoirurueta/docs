<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title id="t">Headless Joomla architecture for the Tallpine trail map</title>
  <desc id="d">A visitor's browser talks to a static or server-rendered front end and to a CDN. The front end and the build job call the Joomla Web Services API with an API token, either at build time or at request time. Joomla stores content in the database and media in the images folder. A webhook or scheduled rebuild invalidates the front end cache when content changes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <rect x="20" y="30" width="170" height="70" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="105" y="62" text-anchor="middle" font-weight="bold" fill="#5d4037">Visitor browser</text>
  <text x="105" y="82" text-anchor="middle" fill="#37474f">trail map page</text>

  <rect x="260" y="30" width="190" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="355" y="62" text-anchor="middle" font-weight="bold" fill="#1b5e20">CDN / edge cache</text>
  <text x="355" y="82" text-anchor="middle" fill="#37474f">HTML, JSON, images</text>

  <rect x="520" y="30" width="200" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="620" y="62" text-anchor="middle" font-weight="bold" fill="#1b5e20">Astro or Next.js</text>
  <text x="620" y="82" text-anchor="middle" fill="#37474f">static build or server render</text>

  <rect x="780" y="30" width="160" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="860" y="62" text-anchor="middle" font-weight="bold" fill="#311b92">Rebuild trigger</text>
  <text x="860" y="82" text-anchor="middle" fill="#37474f">webhook or schedule</text>

  <rect x="260" y="230" width="460" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="490" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Joomla 6.2 site</text>
  <rect x="280" y="274" width="200" height="66" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="380" y="300" text-anchor="middle" fill="#0d47a1" font-weight="bold">/api/index.php/v1</text>
  <text x="380" y="320" text-anchor="middle" fill="#37474f">X-Joomla-Token, CORS</text>
  <rect x="500" y="274" width="200" height="66" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="300" text-anchor="middle" fill="#0d47a1" font-weight="bold">com_tallpine, com_content</text>
  <text x="600" y="320" text-anchor="middle" fill="#37474f">webservices plugins</text>

  <rect x="260" y="430" width="200" height="60" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="360" y="457" text-anchor="middle" font-weight="bold" fill="#880e4f">Database</text>
  <text x="360" y="477" text-anchor="middle" fill="#37474f">trails, articles, fields</text>
  <rect x="520" y="430" width="200" height="60" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="620" y="457" text-anchor="middle" font-weight="bold" fill="#880e4f">images folder</text>
  <text x="620" y="477" text-anchor="middle" fill="#37474f">media file URLs</text>

  <g stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M190,65 L258,65"/>
    <path d="M450,65 L518,65"/>
    <path d="M620,100 L620,170 L520,170 L520,228"/>
    <path d="M380,360 L380,428"/>
    <path d="M620,360 L620,428"/>
  </g>
  <text x="640" y="150" fill="#37474f">fetch with token (build or request time)</text>
  <text x="730" y="255" fill="#37474f">content change event</text>
  <path d="M722,290 L860,290 L860,104" stroke="#5e35b1" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="150" y="200" fill="#37474f">Token stays server side:</text>
  <text x="150" y="218" fill="#37474f">never ship it to the browser</text>
</svg>
