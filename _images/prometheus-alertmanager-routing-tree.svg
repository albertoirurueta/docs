<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="22" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A sample Alertmanager routing tree</text>
  <text x="380" y="40" font-size="12" fill="#666666" text-anchor="middle">root route -&gt; matchers select a sub-route -&gt; grouped alerts notify one receiver</text>

  <defs>
    <marker id="rt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="rt-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
    <marker id="rt-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a2f2f"/>
    </marker>
  </defs>

  <!-- Incoming alerts -->
  <rect x="230" y="50" width="300" height="32" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="70" font-size="11.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">POST /api/v2/alerts (from Prometheus rule evaluation)</text>

  <line x1="380" y1="82" x2="380" y2="98" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rt-arrow)"/>

  <!-- Root route -->
  <rect x="230" y="98" width="300" height="48" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="118" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">route (root)</text>
  <text x="380" y="135" font-size="10" fill="#444444" text-anchor="middle">receiver: default-email &#183; group_by: [alertname, cluster]</text>

  <!-- branch lines from root down to a horizontal bar -->
  <line x1="380" y1="146" x2="380" y2="162" stroke="#1c4b73" stroke-width="1.6"/>
  <line x1="130" y1="162" x2="630" y2="162" stroke="#1c4b73" stroke-width="1.6"/>
  <line x1="130" y1="162" x2="130" y2="176" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#rt-arrow)"/>
  <line x1="380" y1="162" x2="380" y2="176" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#rt-arrow)"/>
  <line x1="630" y1="162" x2="630" y2="176" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#rt-arrow)"/>

  <!-- Sub-route 1: severity=critical -->
  <rect x="40" y="176" width="180" height="60" rx="6" fill="#ffffff" stroke="#8a2f2f" stroke-width="1.6"/>
  <text x="130" y="195" font-size="11.5" font-weight="bold" fill="#8a2f2f" text-anchor="middle">sub-route</text>
  <text x="130" y="210" font-size="10" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">match: severity=critical</text>
  <text x="130" y="224" font-size="9.5" fill="#666666" text-anchor="middle">group_wait: 30s &#183; repeat: 1h</text>

  <!-- Sub-route 2: team=platform -->
  <rect x="290" y="176" width="180" height="60" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="195" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">sub-route</text>
  <text x="380" y="210" font-size="10" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">match_re: team=platform.*</text>
  <text x="380" y="224" font-size="9.5" fill="#666666" text-anchor="middle">group_wait: 30s &#183; repeat: 4h</text>

  <!-- Default fallthrough -->
  <rect x="540" y="176" width="180" height="60" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="630" y="195" font-size="11.5" font-weight="bold" fill="#666666" text-anchor="middle">no match</text>
  <text x="630" y="210" font-size="10" fill="#444444" text-anchor="middle">falls through to</text>
  <text x="630" y="224" font-size="9.5" fill="#666666" text-anchor="middle">the root's own receiver</text>

  <line x1="130" y1="236" x2="130" y2="252" stroke="#8a2f2f" stroke-width="1.6" marker-end="url(#rt-arrow-red)"/>
  <line x1="380" y1="236" x2="380" y2="252" stroke="#2f5424" stroke-width="1.6" marker-end="url(#rt-arrow-grey)"/>
  <line x1="630" y1="236" x2="630" y2="252" stroke="#999999" stroke-width="1.6" marker-end="url(#rt-arrow-grey)"/>

  <!-- Receivers -->
  <rect x="40" y="252" width="180" height="42" rx="6" fill="#f4f4f4" stroke="#8a2f2f" stroke-width="1.2"/>
  <text x="130" y="278" font-size="12" fill="#333333" text-anchor="middle">receiver: pagerduty-oncall</text>

  <rect x="290" y="252" width="180" height="42" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.2"/>
  <text x="380" y="278" font-size="12" fill="#333333" text-anchor="middle">receiver: slack-platform</text>

  <rect x="540" y="252" width="180" height="42" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="630" y="278" font-size="12" fill="#333333" text-anchor="middle">receiver: default-email</text>

  <!-- Inhibition annotation box -->
  <rect x="40" y="326" width="680" height="110" rx="6" fill="#fbeeee" stroke="#8a2f2f" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="380" y="346" font-size="12.5" font-weight="bold" fill="#8a2f2f" text-anchor="middle">inhibit_rules: a firing critical alert suppresses a related warning</text>

  <rect x="70" y="360" width="260" height="42" rx="5" fill="#ffffff" stroke="#8a2f2f" stroke-width="1.4"/>
  <text x="200" y="378" font-size="11" font-weight="bold" fill="#8a2f2f" text-anchor="middle">source: severity=critical</text>
  <text x="200" y="393" font-size="9.5" fill="#555555" text-anchor="middle" font-family="'Courier New', monospace">alertname=DiskFull, instance=db-1</text>

  <line x1="330" y1="381" x2="428" y2="381" stroke="#8a2f2f" stroke-width="1.8" marker-end="url(#rt-arrow-red)"/>
  <text x="380" y="373" font-size="9.5" fill="#8a2f2f" text-anchor="middle">equal: [instance]</text>

  <rect x="430" y="360" width="260" height="42" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" opacity="0.75"/>
  <text x="560" y="378" font-size="11" fill="#666666" text-anchor="middle">target: severity=warning</text>
  <text x="560" y="393" font-size="9.5" fill="#888888" text-anchor="middle" font-family="'Courier New', monospace">alertname=DiskSpaceLow, instance=db-1</text>

  <text x="380" y="422" font-size="10" fill="#8a2f2f" text-anchor="middle" font-style="italic">while the source alert fires, the matching target alert is muted (not routed, not notified)</text>

</svg>
