<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Rust and C boundary: who allocates, who frees</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">memory must be freed by the same side (and allocator) that allocated it; strings change representation at the boundary</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="20" y="64" width="400" height="336" rx="8" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
  <text x="220" y="88" font-size="15" font-weight="bold" fill="#a35a00" text-anchor="middle">Rust side</text>
  <rect x="520" y="64" width="400" height="336" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="720" y="88" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">C side</text>
  <line x1="470" y1="64" x2="470" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="414" font-size="11" fill="#666666" text-anchor="middle">extern "C" ABI</text>
  <g font-size="12" fill="#222222">
    <!-- row 1: Rust string to C -->
    <rect x="40" y="104" width="160" height="50" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="120" y="124" text-anchor="middle">&amp;str / String</text>
    <text x="120" y="142" text-anchor="middle" font-size="11">UTF-8, length, no NUL</text>
    <rect x="240" y="104" width="160" height="50" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="320" y="124" text-anchor="middle">CString::new(s)?</text>
    <text x="320" y="142" text-anchor="middle" font-size="11">adds NUL; .as_ptr()</text>
    <rect x="540" y="104" width="180" height="50" rx="4" fill="#ffffff" stroke="#1c4b73"/>
    <text x="630" y="124" text-anchor="middle">const char *</text>
    <text x="630" y="142" text-anchor="middle" font-size="11">borrowed for the call only</text>
    <!-- row 2: C string to Rust -->
    <rect x="540" y="176" width="180" height="50" rx="4" fill="#ffffff" stroke="#1c4b73"/>
    <text x="630" y="196" text-anchor="middle">const char * from C</text>
    <text x="630" y="214" text-anchor="middle" font-size="11">C owns it</text>
    <rect x="240" y="176" width="160" height="50" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="320" y="196" text-anchor="middle">CStr::from_ptr(p)</text>
    <text x="320" y="214" text-anchor="middle" font-size="11">unsafe; borrows</text>
    <rect x="40" y="176" width="160" height="50" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="120" y="196" text-anchor="middle">to_str() / to_string_lossy()</text>
    <text x="120" y="214" text-anchor="middle" font-size="11">validate UTF-8, copy if kept</text>
    <!-- row 3: Rust-owned object handed to C -->
    <rect x="40" y="252" width="160" height="56" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="120" y="272" text-anchor="middle">Box::into_raw(Box::new(v))</text>
    <text x="120" y="290" text-anchor="middle" font-size="11">Rust allocates</text>
    <rect x="540" y="252" width="180" height="56" rx="4" fill="#ffffff" stroke="#1c4b73"/>
    <text x="630" y="272" text-anchor="middle">ShelfCatalog * (opaque)</text>
    <text x="630" y="290" text-anchor="middle" font-size="11">C only passes it back</text>
    <rect x="240" y="330" width="160" height="56" rx="4" fill="#ffffff" stroke="#a35a00"/>
    <text x="320" y="350" text-anchor="middle">Box::from_raw(p) / drop</text>
    <text x="320" y="368" text-anchor="middle" font-size="11">Rust frees, exactly once</text>
    <rect x="540" y="330" width="180" height="56" rx="4" fill="#ffffff" stroke="#1c4b73"/>
    <text x="630" y="350" text-anchor="middle">shelf_catalog_free(p)</text>
    <text x="630" y="368" text-anchor="middle" font-size="11">never free() from C</text>
  </g>
  <g stroke="#444444" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="200" y1="129" x2="238" y2="129"/>
    <line x1="400" y1="129" x2="538" y2="129"/>
    <line x1="540" y1="201" x2="402" y2="201"/>
    <line x1="240" y1="201" x2="202" y2="201"/>
    <line x1="200" y1="280" x2="538" y2="280"/>
    <line x1="540" y1="358" x2="402" y2="358"/>
  </g>
  <g font-size="11" fill="#555555">
    <text x="740" y="124">strlen() works</text>
    <text x="740" y="140">C must not keep it</text>
    <text x="740" y="270">panics must not unwind</text>
    <text x="740" y="286">across this line</text>
    <text x="740" y="302">(catch_unwind or C-unwind)</text>
  </g>
</svg>
