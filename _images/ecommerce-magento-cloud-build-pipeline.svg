<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Build pipeline of the Pocket Coffee Magento images</title>
<desc id="d">Nine steps in three rows. Row one: on a reference system that is installed, app:config:dump scopes themes writes config.php; the file is committed to Git together with composer.lock and the code; the CI job check-config.php verifies modules, scopes and themes. Row two, the build stage with no database: composer install with the Composer credentials as a BuildKit secret, setup:di:compile, and setup:static-content:deploy for es_ES, en_GB and en_US with the themes PocketCoffee/roast and Magento/backend. Row three: docker buildx bake builds the php and the nginx targets, verify-image.sh checks both images read-only, and both tags are pushed to the immutable ECR repository, nginx first. The last step is helm upgrade with image.tag set to the git SHA.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker></defs>
<rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">From a committed config.php to two tags in ECR</text>
<text x="30" y="58" font-size="12" font-weight="bold" fill="#f4b860">Needs an installed system</text>
<rect x="30" y="68" width="290" height="72" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="175.0" y="93.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">1  Reference system</text>
<text x="175.0" y="108.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">bin/magento app:config:dump</text>
<text x="175.0" y="123.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">scopes themes</text>
<path d="M320 104 L333 104" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="335" y="68" width="290" height="72" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="480.0" y="93.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">2  Git</text>
<text x="480.0" y="108.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">config.php, composer.lock,</text>
<text x="480.0" y="123.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">app/code, app/design</text>
<path d="M625 104 L638 104" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="640" y="68" width="290" height="72" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="785.0" y="93.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">3  CI guard</text>
<text x="785.0" y="108.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">docker/check-config.php:</text>
<text x="785.0" y="123.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">modules, scopes, themes</text>
<path d="M785.0 140 L785.0 177.0 L290.0 177.0 L290.0 212" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="30" y="204" font-size="12" font-weight="bold" fill="#f4b860">Build stage: no database</text>
<rect x="30" y="214" width="290" height="72" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="175.0" y="239.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">4  composer install --no-dev</text>
<text x="175.0" y="254.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">auth: BuildKit secret</text>
<text x="175.0" y="269.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">composer_auth</text>
<path d="M320 250 L333 250" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="335" y="214" width="290" height="72" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="480.0" y="239.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">5  setup:di:compile</text>
<text x="480.0" y="254.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">needs modules in config.php</text>
<text x="480.0" y="269.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">writes generated/</text>
<path d="M625 250 L638 250" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="640" y="214" width="290" height="72" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="785.0" y="239.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">6  setup:static-content:deploy</text>
<text x="785.0" y="254.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">es_ES en_GB en_US</text>
<text x="785.0" y="269.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">PocketCoffee/roast, backend</text>
<path d="M785.0 286 L785.0 323.0 L290.0 323.0 L290.0 358" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="30" y="350" font-size="12" font-weight="bold" fill="#f4b860">One bake run, then the registry</text>
<rect x="30" y="360" width="290" height="72" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="175.0" y="385.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">7  docker buildx bake</text>
<text x="175.0" y="400.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">targets php and nginx</text>
<text x="175.0" y="415.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">one content version</text>
<path d="M320 396 L333 396" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="335" y="360" width="290" height="72" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="480.0" y="385.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">8  docker/verify-image.sh</text>
<text x="480.0" y="400.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">read-only, uid 33 and 101,</text>
<text x="480.0" y="415.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">same deployed_version</text>
<path d="M625 396 L638 396" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="640" y="360" width="290" height="72" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="785.0" y="385.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">9  docker push to ECR</text>
<text x="785.0" y="400.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">tag &lt;sha&gt;-nginx, then &lt;sha&gt;</text>
<text x="785.0" y="415.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">repository is immutable</text>
<rect x="30" y="480" width="900" height="56" rx="9" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
<text x="480" y="503" font-size="12.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Then the release page takes over</text>
<text x="480" y="522" font-size="11.5" fill="#f2f5f8" text-anchor="middle">helm upgrade --set image.tag=the git SHA: migrate Job with the new image, rolling update, warm-up</text>
<path d="M785 436 L785 470 L480 470 L480 478" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
