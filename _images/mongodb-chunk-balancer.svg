<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Chunk splitting and balancing</text>

  <defs>
    <marker id="cb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ============ TOP: split ============ -->
  <text x="60" y="60" font-size="13" font-weight="bold" fill="#1c4b73">1. A chunk grows past the chunk size and splits</text>

  <rect x="60" y="74" width="300" height="58" rx="4" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="70" y="90" font-size="9" fill="#666666">Shard A</text>
  <rect x="70" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="108" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="146" y="96" width="88" height="28" fill="#1c4b73" stroke="#1c4b73" stroke-width="1"/>
  <text x="190" y="114" font-size="9" fill="#ffffff" text-anchor="middle">oversized</text>
  <rect x="238" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="276" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>

  <line x1="380" y1="103" x2="430" y2="103" stroke="#666666" stroke-width="1.6" marker-end="url(#cb-arrow)"/>
  <text x="405" y="95" font-size="9" fill="#666666" text-anchor="middle">split</text>

  <rect x="440" y="74" width="300" height="58" rx="4" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="450" y="90" font-size="9" fill="#666666">Shard A</text>
  <rect x="450" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="488" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="526" y="96" width="42" height="28" fill="#2f5424" stroke="#2f5424" stroke-width="1"/>
  <rect x="570" y="96" width="42" height="28" fill="#2f5424" stroke="#2f5424" stroke-width="1"/>
  <rect x="616" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <rect x="654" y="96" width="34" height="28" fill="#dbe4ec" stroke="#999999" stroke-width="1"/>
  <text x="591" y="145" font-size="9" fill="#2f5424" text-anchor="middle">two half-size chunks</text>

  <line x1="40" y1="170" x2="720" y2="170" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ============ BOTTOM: balance ============ -->
  <text x="60" y="196" font-size="13" font-weight="bold" fill="#1c4b73">2. The balancer migrates chunks toward an even count</text>

  <!-- BEFORE -->
  <text x="170" y="222" font-size="11" font-weight="bold" fill="#666666" text-anchor="middle">before</text>

  <!-- Shard A overloaded: 8 chunks -->
  <rect x="70" y="232" width="200" height="52" rx="4" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="80" y="246" font-size="9" fill="#666666">Shard A (8)</text>
  <g fill="#1c4b73" stroke="#1c4b73">
    <rect x="80" y="252" width="20" height="24"/><rect x="104" y="252" width="20" height="24"/>
    <rect x="128" y="252" width="20" height="24"/><rect x="152" y="252" width="20" height="24"/>
    <rect x="176" y="252" width="20" height="24"/><rect x="200" y="252" width="20" height="24"/>
    <rect x="224" y="252" width="20" height="24"/><rect x="248" y="252" width="14" height="24"/>
  </g>

  <!-- Shard B: 2 -->
  <rect x="70" y="300" width="200" height="52" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="80" y="314" font-size="9" fill="#666666">Shard B (2)</text>
  <g fill="#dbe4ec" stroke="#999999">
    <rect x="80" y="320" width="20" height="24"/><rect x="104" y="320" width="20" height="24"/>
  </g>

  <!-- Shard C: 2 -->
  <rect x="70" y="368" width="200" height="52" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="80" y="382" font-size="9" fill="#666666">Shard C (2)</text>
  <g fill="#dbe4ec" stroke="#999999">
    <rect x="80" y="388" width="20" height="24"/><rect x="104" y="388" width="20" height="24"/>
  </g>

  <!-- migration arrows -->
  <g stroke="#2f5424" stroke-width="1.8" fill="none">
    <defs>
      <marker id="cb-arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
      </marker>
    </defs>
    <path d="M280,262 C330,280 330,310 386,322" marker-end="url(#cb-arrow2)"/>
    <path d="M280,270 C340,330 340,370 386,388" marker-end="url(#cb-arrow2)"/>
  </g>
  <text x="336" y="252" font-size="10" fill="#2f5424" text-anchor="middle">balancer</text>

  <!-- AFTER -->
  <text x="560" y="222" font-size="11" font-weight="bold" fill="#666666" text-anchor="middle">after</text>

  <rect x="400" y="232" width="320" height="52" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.5"/>
  <text x="410" y="246" font-size="9" fill="#666666">Shard A (4)</text>
  <g fill="#c9dcbb" stroke="#2f5424">
    <rect x="410" y="252" width="22" height="24"/><rect x="436" y="252" width="22" height="24"/>
    <rect x="462" y="252" width="22" height="24"/><rect x="488" y="252" width="22" height="24"/>
  </g>

  <rect x="400" y="300" width="320" height="52" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.5"/>
  <text x="410" y="314" font-size="9" fill="#666666">Shard B (4)</text>
  <g fill="#c9dcbb" stroke="#2f5424">
    <rect x="410" y="320" width="22" height="24"/><rect x="436" y="320" width="22" height="24"/>
    <rect x="462" y="320" width="22" height="24"/><rect x="488" y="320" width="22" height="24"/>
  </g>

  <rect x="400" y="368" width="320" height="52" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.5"/>
  <text x="410" y="382" font-size="9" fill="#666666">Shard C (4)</text>
  <g fill="#c9dcbb" stroke="#2f5424">
    <rect x="410" y="388" width="22" height="24"/><rect x="436" y="388" width="22" height="24"/>
    <rect x="462" y="388" width="22" height="24"/><rect x="488" y="388" width="22" height="24"/>
  </g>

  <text x="380" y="446" font-size="11" fill="#444444" text-anchor="middle">Migrations run one chunk at a time in the background; reads and writes continue against both shards during the move.</text>
</svg>
