<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Rebinding a name vs. mutating an object</text>

  <!-- divider -->
  <line x1="360" y1="42" x2="360" y2="392" stroke="#dddddd" stroke-width="1.2"/>

  <!-- ============ Scenario A: rebinding ============ -->
  <text x="180" y="58" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">A. x = x + 1  (rebinding)</text>
  <text x="180" y="75" font-size="11" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">x = 5</text>
  <text x="180" y="75" font-size="11" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace"></text>

  <!-- name box -->
  <rect x="60" y="88" width="80" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="100" y="110" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">x</text>

  <!-- old int object -->
  <rect x="220" y="88" width="110" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="275" y="110" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">int: 5</text>

  <!-- old arrow (before), dashed, greyed to show it is broken after rebinding -->
  <line x1="140" y1="105" x2="216" y2="105" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="212,100 212,110 220,105" fill="#bbbbbb" stroke="none"/>
  <text x="178" y="97" font-size="9" fill="#999999" text-anchor="middle">before</text>

  <!-- "unreferenced" label under old object -->
  <text x="275" y="136" font-size="10" fill="#a33" text-anchor="middle" font-style="italic">now unreferenced</text>

  <!-- new int object, lower -->
  <rect x="220" y="160" width="110" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="3"/>
  <text x="275" y="182" font-size="13" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">int: 6</text>

  <!-- name box repeated (after), pointing to new object -->
  <rect x="60" y="160" width="80" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="100" y="182" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">x</text>
  <text x="100" y="148" font-size="9" fill="#2f5424" text-anchor="middle">after</text>

  <line x1="140" y1="177" x2="216" y2="177" stroke="#5a8a4a" stroke-width="1.6"/>
  <polygon points="212,171 212,183 222,177" fill="#5a8a4a" stroke="none"/>

  <text x="180" y="230" font-size="11" fill="#444444" text-anchor="middle">'x' now points to a new object;</text>
  <text x="180" y="245" font-size="11" fill="#444444" text-anchor="middle">the old int(5) is discarded.</text>

  <!-- code recap A -->
  <rect x="60" y="262" width="240" height="46" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
  <text x="70" y="280" font-size="11" fill="#333333" font-family="'Courier New', monospace">x = 5</text>
  <text x="70" y="297" font-size="11" fill="#333333" font-family="'Courier New', monospace">x = x + 1  # rebind to int(6)</text>

  <!-- ============ Scenario B: mutation ============ -->
  <text x="540" y="58" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">B. lst.append(1)  (mutation)</text>

  <!-- name box -->
  <rect x="420" y="88" width="80" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="460" y="110" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">lst</text>
  <text x="460" y="148" font-size="9" fill="#666666" text-anchor="middle">before</text>

  <!-- list object (before) -->
  <rect x="580" y="88" width="110" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="635" y="110" font-size="12" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">[1, 2, 3]</text>

  <line x1="500" y1="105" x2="576" y2="105" stroke="#999999" stroke-width="1.6"/>
  <polygon points="572,99 572,111 582,105" fill="#999999" stroke="none"/>

  <!-- same list object, same identity, contents changed -->
  <rect x="420" y="160" width="80" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="3"/>
  <text x="460" y="182" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">lst</text>
  <text x="460" y="148" font-size="9" fill="#2f5424" text-anchor="middle">after</text>

  <rect x="580" y="160" width="110" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="3"/>
  <text x="635" y="182" font-size="12" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">[1, 2, 3, 1]</text>

  <line x1="500" y1="177" x2="576" y2="177" stroke="#5a8a4a" stroke-width="1.6"/>
  <polygon points="572,171 572,183 582,177" fill="#5a8a4a" stroke="none"/>

  <!-- vertical dashed line linking the two object boxes to show it's the SAME object -->
  <line x1="635" y1="122" x2="635" y2="160" stroke="#5a8a4a" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="655" y="145" font-size="9" fill="#2f5424" text-anchor="start" font-style="italic">same object</text>

  <text x="540" y="230" font-size="11" fill="#444444" text-anchor="middle">'lst' still points to the same list;</text>
  <text x="540" y="245" font-size="11" fill="#444444" text-anchor="middle">its contents changed in place.</text>

  <!-- code recap B -->
  <rect x="420" y="262" width="240" height="46" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
  <text x="430" y="280" font-size="11" fill="#333333" font-family="'Courier New', monospace">lst = [1, 2, 3]</text>
  <text x="430" y="297" font-size="11" fill="#333333" font-family="'Courier New', monospace">lst.append(1)  # same object</text>

  <text x="360" y="405" font-size="12" fill="#444444" text-anchor="middle">Immutable objects (int, str, tuple) are replaced on "change"; mutable objects (list, dict, set) are edited in place.</text>
</svg>
