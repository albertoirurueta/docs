<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-go-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A GameObject is a container; components give it behaviour</text>
<rect x="20" y="44" width="330" height="380" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="185" y="68" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">GameObject  "Book_07"</text>
<text x="185" y="86" text-anchor="middle" font-size="11" fill="#374151">Name, Active flag, Tag, Layer, Static flags</text>
<rect x="36" y="100" width="298" height="45" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="48" y="119" text-anchor="start" font-size="12" fill="#065F46" font-weight="bold">Transform</text>
<text x="48" y="136" text-anchor="start" font-size="10" fill="#374151">position, rotation, scale, parent (always present)</text>
<rect x="36" y="153" width="298" height="45" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="48" y="172" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">MeshFilter</text>
<text x="48" y="189" text-anchor="start" font-size="10" fill="#374151">references a Mesh asset</text>
<rect x="36" y="206" width="298" height="45" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="48" y="225" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">MeshRenderer</text>
<text x="48" y="242" text-anchor="start" font-size="10" fill="#374151">references Materials, shadow options</text>
<rect x="36" y="259" width="298" height="45" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="48" y="278" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">BoxCollider</text>
<text x="48" y="295" text-anchor="start" font-size="10" fill="#374151">shape for physics queries</text>
<rect x="36" y="312" width="298" height="45" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="48" y="331" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Rigidbody</text>
<text x="48" y="348" text-anchor="start" font-size="10" fill="#374151">mass, drag, constraints (optional)</text>
<rect x="36" y="365" width="298" height="45" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="48" y="384" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">BookSpinner  (script)</text>
<text x="48" y="401" text-anchor="start" font-size="10" fill="#374151">your MonoBehaviour: speed field, Update()</text>
<text x="560" y="70" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Assets referenced by the components</text>
<rect x="400" y="155" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="565" y="179" text-anchor="middle" font-size="12" fill="#374151">Book.mesh  (from bookshelf.glb)</text>
<rect x="400" y="208" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="565" y="232" text-anchor="middle" font-size="12" fill="#374151">Book_Cover.mat  (URP Lit)</text>
<rect x="400" y="367" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="565" y="391" text-anchor="middle" font-size="12" fill="#374151">BookSpinner.cs  (script asset)</text>
<line x1="334" y1="175" x2="400" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-go-stack)"/>
<line x1="334" y1="228" x2="400" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-go-stack)"/>
<line x1="334" y1="387" x2="400" y2="387" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-go-stack)"/>
<rect x="400" y="304" width="330" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="322" text-anchor="middle" font-size="11" fill="#374151">Components live in the scene;</text>
<text x="565" y="337" text-anchor="middle" font-size="11" fill="#374151">assets live in the Project and can be</text>
<text x="565" y="352" text-anchor="middle" font-size="11" fill="#374151">shared by many GameObjects.</text>
<rect x="400" y="258" width="330" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565" y="273" text-anchor="middle" font-size="11" fill="#92400E">Every GameObject has exactly one Transform.</text>
<text x="565" y="288" text-anchor="middle" font-size="11" fill="#92400E">You cannot remove it.</text>
</svg>
