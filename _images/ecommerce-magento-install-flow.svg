<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 424" width="1010" height="424" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">From an empty server to a running Magento store</title>
  <desc id="d">Five stages: prerequisites, getting the code with Composer, file permissions, the setup:install command and the steps after the install. Each stage lists the commands and the files or services it produces. A bottom band lists the checks that confirm the install worked.</desc>
  <rect x="15" y="24" width="172" height="124" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="101.0" y="48" text-anchor="middle" font-weight="bold">1. Prerequisites</text>
  <text x="101.0" y="72" text-anchor="middle" font-size="12.5">PHP 8.5, Composer 2</text>
  <text x="101.0" y="90" text-anchor="middle" font-size="12.5">MariaDB 12.3, MySQL 8.4</text>
  <text x="101.0" y="108" text-anchor="middle" font-size="12.5">OpenSearch 3, Valkey 9</text>
  <text x="101.0" y="126" text-anchor="middle" font-size="12.5">RabbitMQ 4.3 (optional)</text>
  <rect x="15" y="170" width="172" height="104" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="101.0" y="192" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="101.0" y="212" text-anchor="middle" font-size="12">running services</text>
  <text x="101.0" y="230" text-anchor="middle" font-size="12">empty database</text>
  <text x="101.0" y="248" text-anchor="middle" font-size="12">php.ini verified with</text>
  <text x="101.0" y="266" text-anchor="middle" font-size="12">check-platform-reqs</text>
  <path d="M187 86 L215 86" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="217" y="24" width="172" height="124" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="303.0" y="48" text-anchor="middle" font-weight="bold">2. Get the code</text>
  <text x="303.0" y="72" text-anchor="middle" font-size="12.5">composer create-project</text>
  <text x="303.0" y="90" text-anchor="middle" font-size="12.5">repo.magento.com: keys</text>
  <text x="303.0" y="108" text-anchor="middle" font-size="12.5">repo.mage-os.org: no keys</text>
  <text x="303.0" y="126" text-anchor="middle" font-size="12.5">pin a version if needed</text>
  <rect x="217" y="170" width="172" height="104" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="303.0" y="192" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="303.0" y="212" text-anchor="middle" font-size="12">composer.json, vendor/</text>
  <text x="303.0" y="230" text-anchor="middle" font-size="12">bin/magento, pub/, app/</text>
  <text x="303.0" y="248" text-anchor="middle" font-size="12">auth.json kept outside</text>
  <text x="303.0" y="266" text-anchor="middle" font-size="12">the repository</text>
  <path d="M389 86 L417 86" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="419" y="24" width="172" height="124" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505.0" y="48" text-anchor="middle" font-weight="bold">3. Permissions</text>
  <text x="505.0" y="72" text-anchor="middle" font-size="12.5">one file-system owner</text>
  <text x="505.0" y="90" text-anchor="middle" font-size="12.5">pub/ is the document root</text>
  <text x="505.0" y="108" text-anchor="middle" font-size="12.5">group-writable var/,</text>
  <text x="505.0" y="126" text-anchor="middle" font-size="12.5">generated/, pub/static</text>
  <rect x="419" y="170" width="172" height="104" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="505.0" y="192" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="505.0" y="212" text-anchor="middle" font-size="12">a tree PHP can write to</text>
  <text x="505.0" y="230" text-anchor="middle" font-size="12">while the install runs;</text>
  <text x="505.0" y="248" text-anchor="middle" font-size="12">remove write access to</text>
  <text x="505.0" y="266" text-anchor="middle" font-size="12">app/etc afterwards</text>
  <path d="M591 86 L619 86" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="621" y="24" width="172" height="124" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="707.0" y="48" text-anchor="middle" font-weight="bold">4. setup:install</text>
  <text x="707.0" y="72" text-anchor="middle" font-size="12.5">creates all tables</text>
  <text x="707.0" y="90" text-anchor="middle" font-size="12.5">writes env.php, config.php</text>
  <text x="707.0" y="108" text-anchor="middle" font-size="12.5">creates the admin user</text>
  <text x="707.0" y="126" text-anchor="middle" font-size="12.5">runs every indexer</text>
  <rect x="621" y="170" width="172" height="104" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="707.0" y="192" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="707.0" y="212" text-anchor="middle" font-size="12">one progress step per</text>
  <text x="707.0" y="230" text-anchor="middle" font-size="12">module and task</text>
  <text x="707.0" y="248" text-anchor="middle" font-size="12">random Admin URI</text>
  <text x="707.0" y="266" text-anchor="middle" font-size="12">mode: default</text>
  <path d="M793 86 L821 86" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="823" y="24" width="172" height="124" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="909.0" y="48" text-anchor="middle" font-weight="bold">5. After the install</text>
  <text x="909.0" y="72" text-anchor="middle" font-size="12.5">cron:install</text>
  <text x="909.0" y="90" text-anchor="middle" font-size="12.5">deploy:mode:set</text>
  <text x="909.0" y="108" text-anchor="middle" font-size="12.5">web server and HTTPS</text>
  <text x="909.0" y="126" text-anchor="middle" font-size="12.5">2FA, backups, hardening</text>
  <rect x="823" y="170" width="172" height="104" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="909.0" y="192" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="909.0" y="212" text-anchor="middle" font-size="12">cron_schedule rows</text>
  <text x="909.0" y="230" text-anchor="middle" font-size="12">compiled code, static files</text>
  <text x="909.0" y="248" text-anchor="middle" font-size="12">TLS and caching in front</text>
  <text x="909.0" y="266" text-anchor="middle" font-size="12">a store ready for traffic</text>
  <rect x="15" y="300" width="980" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.14" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="326" text-anchor="middle" font-weight="bold">Checks that confirm each stage</text>
  <text x="40" y="352" font-size="12.5">composer check-platform-reqs</text>
  <text x="40" y="374" font-size="12.5">curl localhost:9200, valkey-cli ping</text>
  <text x="40" y="396" font-size="12.5">bin/magento --version</text>
  <text x="350" y="352" font-size="12.5">bin/magento setup:db:status</text>
  <text x="350" y="374" font-size="12.5">bin/magento module:status</text>
  <text x="350" y="396" font-size="12.5">bin/magento indexer:status</text>
  <text x="665" y="352" font-size="12.5">bin/magento info:adminuri</text>
  <text x="665" y="374" font-size="12.5">curl -I the storefront and Admin URI</text>
  <text x="665" y="396" font-size="12.5">crontab -l, cron_schedule table</text>
</svg>
