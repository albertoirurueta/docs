<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
<title id="t2">clone versus deepcopy</title>
<desc id="d2">clone copies only the constructor parameters of a fitted estimator and returns an unfitted one, while copy.deepcopy also copies the fitted attributes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">clone versus deepcopy</text>
<rect x="24" y="64" width="200" height="200" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="124" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Fitted estimator</text>
<rect x="40" y="108" width="168" height="62" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="124" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Parameters</text>
<text x="124" y="154" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">C=3  max_iter=200</text>
<rect x="40" y="182" width="168" height="62" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="124" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Learned state</text>
<text x="124" y="228" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">coef_  classes_</text>
<rect x="400" y="52" width="296" height="104" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="548" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">clone(est)</text>
<rect x="416" y="88" width="120" height="52" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="476" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Parameters</text>
<text x="620" y="108" text-anchor="middle" font-size="12" fill="#475569">unfitted: no coef_,</text>
<text x="620" y="126" text-anchor="middle" font-size="12" fill="#475569">no classes_</text>
<rect x="400" y="168" width="296" height="104" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="548" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">copy.deepcopy(est)</text>
<rect x="416" y="204" width="120" height="52" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="476" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Parameters</text>
<rect x="544" y="204" width="140" height="52" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="614" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Learned state</text>
<line x1="226" y1="110" x2="396" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="226" y1="220" x2="396" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<circle cx="311" cy="95" r="11" fill="#0F172A"/><text x="311" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="311" cy="243" r="11" fill="#0F172A"/><text x="311" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
</svg>
