<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How the go command fetches and authenticates one module version</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">GOPROXY decides where the bytes come from; go.sum and GOSUMDB decide whether they are trusted</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/></marker>
  </defs>

  <!-- step 1: go build / go get -->
  <rect x="20" y="80" width="170" height="62" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="105" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">go build / go get</text>
  <text x="105" y="122" font-size="11" fill="#222222" text-anchor="middle">needs example.com/isbn@v1.2.0</text>
  <text x="105" y="136" font-size="11" fill="#222222" text-anchor="middle">(chosen by MVS from go.mod)</text>

  <!-- step 2: module cache -->
  <rect x="250" y="80" width="190" height="62" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="345" y="104" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">module cache</text>
  <text x="345" y="122" font-size="11" fill="#222222" text-anchor="middle">GOMODCACHE: .mod, .zip,</text>
  <text x="345" y="136" font-size="11" fill="#222222" text-anchor="middle">extracted read-only source</text>
  <line x1="190" y1="111" x2="248" y2="111" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="219" y="104" font-size="10" fill="#555555" text-anchor="middle">lookup</text>

  <!-- hit -->
  <rect x="500" y="80" width="170" height="62" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="5,3"/>
  <text x="585" y="104" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">hit: compile it</text>
  <text x="585" y="122" font-size="11" fill="#222222" text-anchor="middle">no network access;</text>
  <text x="585" y="136" font-size="11" fill="#222222" text-anchor="middle">go mod verify can re-check</text>
  <line x1="440" y1="111" x2="498" y2="111" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="469" y="104" font-size="10" fill="#2e7d32" text-anchor="middle">hit</text>

  <!-- miss -> GOPROXY -->
  <line x1="345" y1="142" x2="345" y2="188" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="357" y="170" font-size="10" fill="#555555">miss</text>
  <rect x="240" y="190" width="210" height="84" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="345" y="212" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">GOPROXY list</text>
  <text x="345" y="230" font-size="11" fill="#222222" text-anchor="middle">https://proxy.golang.org,direct</text>
  <text x="345" y="246" font-size="11" fill="#222222" text-anchor="middle">GET $base/$module/@v/$ver.mod</text>
  <text x="345" y="260" font-size="11" fill="#222222" text-anchor="middle">GET $base/$module/@v/$ver.zip</text>

  <!-- private -->
  <rect x="20" y="190" width="170" height="84" rx="6" fill="#fff6e5" stroke="#b7791f"/>
  <text x="105" y="212" font-size="13" font-weight="bold" fill="#8a5a00" text-anchor="middle">GOPRIVATE match?</text>
  <text x="105" y="230" font-size="11" fill="#222222" text-anchor="middle">GONOPROXY: skip the proxy,</text>
  <text x="105" y="244" font-size="11" fill="#222222" text-anchor="middle">fetch from the repository</text>
  <text x="105" y="258" font-size="11" fill="#222222" text-anchor="middle">GONOSUMDB: skip the sum DB</text>
  <line x1="240" y1="232" x2="192" y2="232" stroke="#b7791f" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,3"/>

  <!-- hash check -->
  <line x1="450" y1="232" x2="528" y2="232" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="489" y="224" font-size="10" fill="#555555" text-anchor="middle">bytes</text>
  <rect x="530" y="190" width="200" height="84" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="630" y="212" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">hash the download (h1:)</text>
  <text x="630" y="230" font-size="11" fill="#222222" text-anchor="middle">entry in go.sum?</text>
  <text x="630" y="246" font-size="11" fill="#222222" text-anchor="middle">yes: must match exactly</text>
  <text x="630" y="260" font-size="11" fill="#222222" text-anchor="middle">no: ask the checksum database</text>

  <!-- sumdb -->
  <line x1="730" y1="232" x2="778" y2="232" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="780" y="190" width="140" height="84" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="850" y="212" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">GOSUMDB</text>
  <text x="850" y="230" font-size="11" fill="#222222" text-anchor="middle">sum.golang.org</text>
  <text x="850" y="246" font-size="11" fill="#222222" text-anchor="middle">signed transparency</text>
  <text x="850" y="260" font-size="11" fill="#222222" text-anchor="middle">log lookup</text>

  <!-- outcomes -->
  <line x1="630" y1="274" x2="630" y2="326" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="642" y="304" font-size="10" fill="#2e7d32">hashes agree</text>
  <rect x="500" y="328" width="260" height="84" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="630" y="350" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">accepted</text>
  <text x="630" y="368" font-size="11" fill="#222222" text-anchor="middle">line added to go.sum (if missing),</text>
  <text x="630" y="382" font-size="11" fill="#222222" text-anchor="middle">files stored in the module cache,</text>
  <text x="630" y="396" font-size="11" fill="#222222" text-anchor="middle">build continues</text>

  <line x1="530" y1="262" x2="270" y2="328" stroke="#b23b3b" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="372" y="287" font-size="10" fill="#b23b3b" text-anchor="middle" transform="rotate(-17 372 287)">hashes differ</text>
  <rect x="40" y="328" width="300" height="84" rx="6" fill="#fbeaea" stroke="#b23b3b"/>
  <text x="190" y="350" font-size="13" font-weight="bold" fill="#b23b3b" text-anchor="middle">SECURITY ERROR</text>
  <text x="190" y="368" font-size="11" fill="#222222" text-anchor="middle">verifying module: checksum mismatch;</text>
  <text x="190" y="382" font-size="11" fill="#222222" text-anchor="middle">the download is deleted and never</text>
  <text x="190" y="396" font-size="11" fill="#222222" text-anchor="middle">enters the module cache</text>
</svg>
