<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A buffered channel as a counting semaphore</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">make(chan struct{}, 3): a send takes a slot, a receive frees it, so at most three goroutines hold a slot at once</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker>
  </defs>

  <text x="30" y="90" font-size="13" font-weight="bold" fill="#444444">callers (the loop in main)</text>
  <g font-size="13" fill="#222222">
    <rect x="30" y="104" width="130" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="124">book 1  sem &lt;-</text>
    <rect x="30" y="144" width="130" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="164">book 2  sem &lt;-</text>
    <rect x="30" y="184" width="130" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="42" y="204">book 3  sem &lt;-</text>
    <rect x="30" y="244" width="130" height="30" rx="4" fill="#fdf3f1" stroke="#b23a2a"/><text x="42" y="264">book 4  sem &lt;-</text>
  </g>
  <text x="30" y="296" font-size="12" fill="#b23a2a">book 4 blocks here until a slot is free</text>

  <g stroke="#1c4b73" stroke-width="1.6" fill="none">
    <line x1="160" y1="119" x2="330" y2="119" marker-end="url(#a)"/>
    <line x1="160" y1="159" x2="330" y2="159" marker-end="url(#a)"/>
    <line x1="160" y1="199" x2="330" y2="199" marker-end="url(#a)"/>
  </g>
  <line x1="160" y1="259" x2="330" y2="259" stroke="#b23a2a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r)"/>

  <text x="340" y="90" font-size="13" font-weight="bold" fill="#444444">sem: capacity 3</text>
  <rect x="340" y="104" width="190" height="110" rx="4" fill="#f7f9fb" stroke="#9aa9b8"/>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="352" y="112" width="166" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="435" y="130">struct{}{}  (slot 1)</text>
    <rect x="352" y="146" width="166" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="435" y="164">struct{}{}  (slot 2)</text>
    <rect x="352" y="180" width="166" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="435" y="198">struct{}{}  (slot 3)</text>
  </g>
  <text x="340" y="236" font-size="12" fill="#444444">len(sem) == cap(sem): full</text>

  <g stroke="#1c4b73" stroke-width="1.6" fill="none">
    <line x1="530" y1="119" x2="700" y2="119" marker-end="url(#a)"/>
    <line x1="530" y1="159" x2="700" y2="159" marker-end="url(#a)"/>
    <line x1="530" y1="199" x2="700" y2="199" marker-end="url(#a)"/>
  </g>
  <text x="560" y="90" font-size="13" font-weight="bold" fill="#444444">workers run, then release</text>
  <g font-size="13" fill="#222222">
    <rect x="700" y="104" width="210" height="30" rx="4" fill="#eaf5ea" stroke="#3a7d3a"/><text x="712" y="124">goroutine 1  defer &lt;-sem</text>
    <rect x="700" y="144" width="210" height="30" rx="4" fill="#eaf5ea" stroke="#3a7d3a"/><text x="712" y="164">goroutine 2  defer &lt;-sem</text>
    <rect x="700" y="184" width="210" height="30" rx="4" fill="#eaf5ea" stroke="#3a7d3a"/><text x="712" y="204">goroutine 3  defer &lt;-sem</text>
  </g>

  <text x="340" y="330" font-size="12" fill="#444444">Acquire = send, Release = receive. The element type carries no data, so struct{} (size 0) is used.</text>
  <text x="340" y="348" font-size="12" fill="#444444">Always release in a defer so a panic or early return cannot leak a slot.</text>
  <text x="340" y="366" font-size="12" fill="#444444">For weights, context-aware waits and TryAcquire see x/sync/semaphore.</text>
</svg>
