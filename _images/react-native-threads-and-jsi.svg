<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The three threads, connected by JSI</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">JSI gives the JavaScript thread a direct, synchronous C++ reference into Fabric and Turbo Native Modules</text>

  <defs>
    <marker id="tj-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- JS thread -->
  <rect x="30" y="70" width="200" height="100" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="96" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">JavaScript thread</text>
  <text x="130" y="114" font-size="10" fill="#333333" text-anchor="middle">Hermes engine</text>
  <text x="130" y="130" font-size="10" fill="#333333" text-anchor="middle">Places's components,</text>
  <text x="130" y="144" font-size="10" fill="#333333" text-anchor="middle">hooks, event handlers</text>

  <!-- JSI box in the middle -->
  <rect x="290" y="70" width="180" height="280" rx="8" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="380" y="94" font-size="12.5" font-weight="bold" fill="#a35d00" text-anchor="middle">JSI</text>
  <text x="380" y="110" font-size="10" fill="#333333" text-anchor="middle">synchronous C++</text>
  <text x="380" y="124" font-size="10" fill="#333333" text-anchor="middle">host object references</text>
  <text x="380" y="140" font-size="10" fill="#333333" text-anchor="middle">(no serialization,</text>
  <text x="380" y="154" font-size="10" fill="#333333" text-anchor="middle">no message queue)</text>

  <line x1="230" y1="120" x2="290" y2="120" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>
  <line x1="290" y1="140" x2="230" y2="140" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>

  <!-- Fabric -->
  <rect x="530" y="70" width="200" height="90" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="630" y="96" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Fabric (shadow tree)</text>
  <text x="630" y="114" font-size="10" fill="#333333" text-anchor="middle">render / commit / mount</text>
  <text x="630" y="130" font-size="10" fill="#333333" text-anchor="middle">into the native UI thread</text>

  <line x1="470" y1="115" x2="530" y2="115" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>

  <!-- Turbo Native Modules -->
  <rect x="530" y="185" width="200" height="90" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="630" y="211" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">Turbo Native Modules</text>
  <text x="630" y="229" font-size="10" fill="#333333" text-anchor="middle">e.g. HapticTap,</text>
  <text x="630" y="245" font-size="10" fill="#333333" text-anchor="middle">loaded lazily via registry</text>

  <line x1="470" y1="230" x2="530" y2="230" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>

  <!-- Background layout thread -->
  <rect x="30" y="230" width="200" height="100" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="130" y="256" font-size="13" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Background layout thread</text>
  <text x="130" y="274" font-size="10" fill="#333333" text-anchor="middle">Yoga computes Flexbox</text>
  <text x="130" y="290" font-size="10" fill="#333333" text-anchor="middle">position/size for every</text>
  <text x="130" y="306" font-size="10" fill="#333333" text-anchor="middle">shadow node</text>

  <line x1="230" y1="280" x2="290" y2="230" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>
  <line x1="290" y1="245" x2="230" y2="295" stroke="#333333" stroke-width="1.4" marker-end="url(#tj-arrow)"/>

  <!-- Native UI thread -->
  <rect x="530" y="300" width="200" height="90" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="630" y="326" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Native UI thread</text>
  <text x="630" y="344" font-size="10" fill="#333333" text-anchor="middle">real platform views:</text>
  <text x="630" y="360" font-size="10" fill="#333333" text-anchor="middle">UIView / Android View</text>

  <line x1="630" y1="160" x2="630" y2="300" stroke="#666666" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#tj-arrow)"/>

  <text x="380" y="405" font-size="10.5" fill="#666666" text-anchor="middle">No thread ever serializes a call to JSON and posts it across a queue -- JSI is a direct, synchronous reference.</text>
</svg>
