<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A slice is a fat pointer: (data pointer, length)</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">let v: Vec&lt;u16&gt; = vec![10, 20, 30, 40, 50, 60];  let s: &amp;[u16] = &amp;v[1..4];</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker></defs>
  <text x="40" y="86" font-size="12" font-weight="bold" fill="#555555">stack</text>
  <text x="380" y="86" font-size="12" font-weight="bold" fill="#555555">heap buffer (capacity 6)</text>
  <g font-size="13" fill="#222222">
    <text x="40" y="118" font-weight="bold">v</text>
    <rect x="70" y="100" width="80" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="80" y="119">ptr</text>
    <rect x="150" y="100" width="70" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="160" y="119">cap 6</text>
    <rect x="220" y="100" width="70" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="230" y="119">len 6</text>
    <text x="300" y="119" font-size="11" fill="#555555">24 bytes</text>

    <text x="40" y="238" font-weight="bold">s</text>
    <rect x="70" y="220" width="80" height="28" fill="#fdf0e2" stroke="#a35a00"/><text x="80" y="239">ptr</text>
    <rect x="150" y="220" width="70" height="28" fill="#fdf0e2" stroke="#a35a00"/><text x="160" y="239">len 3</text>
    <text x="230" y="239" font-size="11" fill="#555555">16 bytes: no capacity, no ownership</text>
  </g>
  <g font-family="Courier New, monospace" font-size="14" fill="#222222">
    <rect x="380" y="100" width="70" height="36" fill="#e9f5e9" stroke="#2e7d32"/><text x="403" y="123">10</text>
    <rect x="450" y="100" width="70" height="36" fill="#ffe9c7" stroke="#a35a00" stroke-width="2"/><text x="473" y="123">20</text>
    <rect x="520" y="100" width="70" height="36" fill="#ffe9c7" stroke="#a35a00" stroke-width="2"/><text x="543" y="123">30</text>
    <rect x="590" y="100" width="70" height="36" fill="#ffe9c7" stroke="#a35a00" stroke-width="2"/><text x="613" y="123">40</text>
    <rect x="660" y="100" width="70" height="36" fill="#e9f5e9" stroke="#2e7d32"/><text x="683" y="123">50</text>
    <rect x="730" y="100" width="70" height="36" fill="#e9f5e9" stroke="#2e7d32"/><text x="753" y="123">60</text>
  </g>
  <g font-size="11" fill="#777777" text-anchor="middle">
    <text x="415" y="152">[0]</text><text x="485" y="152">[1]</text><text x="555" y="152">[2]</text><text x="625" y="152">[3]</text><text x="695" y="152">[4]</text><text x="765" y="152">[5]</text>
  </g>
  <path d="M110,114 C200,70 330,70 378,104" fill="none" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M110,234 C250,234 420,200 470,140" fill="none" stroke="#a35a00" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="450" y1="176" x2="660" y2="176" stroke="#a35a00" stroke-width="1.4"/>
  <line x1="450" y1="170" x2="450" y2="182" stroke="#a35a00" stroke-width="1.4"/>
  <line x1="660" y1="170" x2="660" y2="182" stroke="#a35a00" stroke-width="1.4"/>
  <text x="555" y="194" font-size="12" fill="#a35a00" text-anchor="middle">s covers v[1..4]: 3 elements</text>
  <text x="450" y="300" font-size="12" fill="#666666" text-anchor="middle">while s is alive, v is borrowed: v.push(..) would be rejected, because it could reallocate the buffer s points into</text>
</svg>
