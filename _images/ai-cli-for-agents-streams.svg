<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 520" width="990" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>How stdout, stderr and the exit code of a CLI are consumed by a human, a script and an AI agent</title>
  <desc>A docsctl process produces three outputs: stdout carries data only, stderr carries messages, progress and errors, and the exit code is the verdict. A human reads stdout and stderr in the same terminal window. A script pipes stdout onward, sends stderr to a log and branches on the exit code. An agent parses stdout as JSON, reads the JSON error envelope on stderr when a command fails and maps exit codes 0, 2, 5, 6 and 7 to its next action.</desc>
  <rect x="0" y="0" width="990" height="520" fill="#f8fafc"/>
  <rect x="330" y="16" width="330" height="44" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="495" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">docsctl (one process, three outputs)</text>
  <line x1="495" y1="60" x2="315" y2="96" stroke="#475569" stroke-width="1.8"/>
  <polygon points="309,90 321,90 315,100" fill="#475569"/>
  <rect x="190" y="100" width="250" height="54" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="315" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">stdout</text>
  <text x="315" y="143" text-anchor="middle" font-size="12" fill="#1e3a8a">data only</text>
  <line x1="495" y1="60" x2="585" y2="96" stroke="#475569" stroke-width="1.8"/>
  <polygon points="579,90 591,90 585,100" fill="#475569"/>
  <rect x="460" y="100" width="250" height="54" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="585" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">stderr</text>
  <text x="585" y="143" text-anchor="middle" font-size="12" fill="#78350f">messages, progress, errors</text>
  <line x1="495" y1="60" x2="855" y2="96" stroke="#475569" stroke-width="1.8"/>
  <polygon points="849,90 861,90 855,100" fill="#475569"/>
  <rect x="730" y="100" width="250" height="54" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="855" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">exit code</text>
  <text x="855" y="143" text-anchor="middle" font-size="12" fill="#14532d">the verdict</text>
  <rect x="20" y="180" width="150" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="95" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Human</text>
  <text x="95" y="240" text-anchor="middle" font-size="12" fill="#4c1d95">at a terminal</text>
  <rect x="190" y="180" width="250" height="90" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="315" y="218" text-anchor="middle" font-size="12" fill="#0f172a">Table or text on the screen,</text>
  <text x="315" y="238" text-anchor="middle" font-size="12" fill="#0f172a">colour only if it is a TTY.</text>
  <rect x="460" y="180" width="250" height="90" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="585" y="218" text-anchor="middle" font-size="12" fill="#0f172a">Progress, warnings and errors</text>
  <text x="585" y="238" text-anchor="middle" font-size="12" fill="#0f172a">appear in the same window.</text>
  <rect x="730" y="180" width="250" height="90" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="855" y="218" text-anchor="middle" font-size="12" fill="#0f172a">Rarely looked at; the shell</text>
  <text x="855" y="238" text-anchor="middle" font-size="12" fill="#0f172a">prompt may show a failure.</text>
  <rect x="20" y="290" width="150" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="95" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">Script</text>
  <text x="95" y="350" text-anchor="middle" font-size="12" fill="#0c4a6e">pipeline or CI job</text>
  <rect x="190" y="290" width="250" height="90" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="315" y="328" text-anchor="middle" font-size="12" fill="#0f172a">Piped on (| jq) or sent to a file;</text>
  <text x="315" y="348" text-anchor="middle" font-size="12" fill="#0f172a">it must contain data only.</text>
  <rect x="460" y="290" width="250" height="90" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="585" y="328" text-anchor="middle" font-size="12" fill="#0f172a">Goes to the CI log or 2&gt; file,</text>
  <text x="585" y="348" text-anchor="middle" font-size="12" fill="#0f172a">never mixed into the data.</text>
  <rect x="730" y="290" width="250" height="90" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="855" y="328" text-anchor="middle" font-size="12" fill="#0f172a">if / case / set -e pick the</text>
  <text x="855" y="348" text-anchor="middle" font-size="12" fill="#0f172a">next step of the job.</text>
  <rect x="20" y="400" width="150" height="90" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="95" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#831843">Agent</text>
  <text x="95" y="460" text-anchor="middle" font-size="12" fill="#831843">LLM using a shell tool</text>
  <rect x="190" y="400" width="250" height="90" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="315" y="438" text-anchor="middle" font-size="12" fill="#0f172a">JSON parsed as the tool result;</text>
  <text x="315" y="458" text-anchor="middle" font-size="12" fill="#0f172a">size-capped, no colour.</text>
  <rect x="460" y="400" width="250" height="90" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="585" y="438" text-anchor="middle" font-size="12" fill="#0f172a">Read on failure: a JSON error</text>
  <text x="585" y="458" text-anchor="middle" font-size="12" fill="#0f172a">envelope with a hint.</text>
  <rect x="730" y="400" width="250" height="90" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="855" y="438" text-anchor="middle" font-size="12" fill="#0f172a">0 go on, 2 fix the call, 5 ask,</text>
  <text x="855" y="458" text-anchor="middle" font-size="12" fill="#0f172a">6 retry later, 7 log in.</text>
  <text x="495" y="508" text-anchor="middle" font-size="12" fill="#334155">Same process, same bytes: only the reader differs, so keep data, messages and the verdict on separate channels.</text>
</svg>
