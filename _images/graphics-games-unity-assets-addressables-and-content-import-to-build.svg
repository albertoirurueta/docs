<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From a source file to a shipped build</text>
<rect x="20" y="70" width="124" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="82.0" y="92" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Assets/ folder</text>
<text x="82.0" y="116" text-anchor="middle" font-size="11" fill="#374151">bookshelf.glb</text>
<text x="82.0" y="132" text-anchor="middle" font-size="11" fill="#374151">book-cover.png</text>
<text x="82.0" y="148" text-anchor="middle" font-size="11" fill="#374151">+ .meta files</text>
<text x="82.0" y="164" text-anchor="middle" font-size="11" fill="#374151">(GUID per asset)</text>
<rect x="169" y="70" width="124" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="231.0" y="92" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Importer</text>
<text x="231.0" y="116" text-anchor="middle" font-size="11" fill="#3730A3">ModelImporter,</text>
<text x="231.0" y="132" text-anchor="middle" font-size="11" fill="#3730A3">TextureImporter,</text>
<text x="231.0" y="148" text-anchor="middle" font-size="11" fill="#3730A3">settings in .meta</text>
<rect x="318" y="70" width="124" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="92" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Library/ cache</text>
<text x="380.0" y="116" text-anchor="middle" font-size="11" fill="#92400E">imported artifacts</text>
<text x="380.0" y="132" text-anchor="middle" font-size="11" fill="#92400E">per platform</text>
<text x="380.0" y="148" text-anchor="middle" font-size="11" fill="#92400E">not in version</text>
<text x="380.0" y="164" text-anchor="middle" font-size="11" fill="#92400E">control</text>
<rect x="467" y="70" width="124" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="529.0" y="92" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Build input</text>
<text x="529.0" y="116" text-anchor="middle" font-size="11" fill="#3730A3">scenes in the list,</text>
<text x="529.0" y="132" text-anchor="middle" font-size="11" fill="#3730A3">Resources/ folders,</text>
<text x="529.0" y="148" text-anchor="middle" font-size="11" fill="#3730A3">everything they</text>
<text x="529.0" y="164" text-anchor="middle" font-size="11" fill="#3730A3">reference</text>
<rect x="616" y="70" width="124" height="130" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="678.0" y="92" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Player or content</text>
<text x="678.0" y="116" text-anchor="middle" font-size="11" fill="#1F2937">Player data files,</text>
<text x="678.0" y="132" text-anchor="middle" font-size="11" fill="#1F2937">AssetBundles or a</text>
<text x="678.0" y="148" text-anchor="middle" font-size="11" fill="#1F2937">content directory,</text>
<text x="678.0" y="164" text-anchor="middle" font-size="11" fill="#1F2937">catalog</text>
<line x1="145" y1="135" x2="168" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-ia)"/>
<line x1="294" y1="135" x2="317" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-ia)"/>
<line x1="443" y1="135" x2="466" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-ia)"/>
<line x1="592" y1="135" x2="615" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-ia)"/>
<text x="380" y="236" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Editor time</text>
<line x1="20" y1="246" x2="740" y2="246" stroke="#E5E7EB" stroke-width="1"/>
<rect x="20" y="262" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="284.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">References by GUID</text>
<text x="190.0" y="299.5" text-anchor="middle" font-size="11" fill="#374151">A prefab stores the GUID of its material, not a path,</text>
<text x="190.0" y="314.5" text-anchor="middle" font-size="11" fill="#374151">so moving a file in the Editor keeps references intact</text>
<rect x="400" y="262" width="340" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="284.5" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Run time</text>
<text x="570.0" y="299.5" text-anchor="middle" font-size="11" fill="#92400E">The Player knows files, not the Assets/ folder:</text>
<text x="570.0" y="314.5" text-anchor="middle" font-size="11" fill="#92400E">anything loaded by name must be in a build input</text>
</svg>
