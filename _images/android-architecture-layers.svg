<svg viewBox="0 0 760 560" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Recommended App Architecture</text>

  <!-- UI layer -->
  <rect x="40" y="50" width="680" height="130" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="60" y="74" font-size="15" font-weight="700" fill="#1a3a6b">UI layer</text>

  <rect x="70" y="90" width="230" height="70" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="185" y="115" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a">TrailListScreen</text>
  <text x="185" y="134" text-anchor="middle" font-size="11.5" fill="#3c4043">Compose UI element</text>

  <rect x="460" y="90" width="230" height="70" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="575" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a">TrailListViewModel</text>
  <text x="575" y="130" text-anchor="middle" font-size="11.5" fill="#3c4043">StateFlow&lt;TrailListUiState&gt;</text>
  <text x="575" y="146" text-anchor="middle" font-size="11.5" fill="#3c4043">state holder</text>

  <!-- Arrow: ViewModel -> Screen (state, solid) -->
  <path d="M 460 108 L 300 108" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <text x="380" y="99" text-anchor="middle" font-size="10.5" fill="#1a73e8">state</text>

  <!-- Arrow: Screen -> ViewModel (events, dashed) -->
  <path d="M 300 148 L 460 148" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEvent)"/>
  <text x="380" y="164" text-anchor="middle" font-size="10.5" fill="#c5221f">UI events</text>

  <!-- Connector UI -> Domain -->
  <path d="M 575 160 L 575 200" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <path d="M 380 200 L 380 160" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEventUp)"/>

  <!-- Domain layer -->
  <rect x="40" y="205" width="680" height="90" rx="10" fill="#fff3e0" stroke="#f29900" stroke-width="2"/>
  <text x="60" y="229" font-size="15" font-weight="700" fill="#7a4a00">Domain layer (optional)</text>

  <rect x="270" y="243" width="220" height="42" rx="8" fill="#ffffff" stroke="#f29900" stroke-width="1.5"/>
  <text x="380" y="269" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a">GetTrailsUseCase</text>

  <!-- Connector Domain -> Data -->
  <path d="M 380 285 L 380 320" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <path d="M 500 320 L 500 285" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEventUp)"/>

  <!-- Data layer -->
  <rect x="40" y="325" width="680" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="60" y="349" font-size="15" font-weight="700" fill="#0d4c22">Data layer</text>

  <rect x="270" y="362" width="220" height="42" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="380" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">TrailRepository (interface)</text>

  <path d="M 380 404 L 380 424" fill="none" stroke="#188038" stroke-width="2"/>

  <rect x="270" y="424" width="220" height="42" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="380" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">OfflineFirstTrailRepository</text>

  <!-- Room -->
  <path d="M 300 466 L 170 500" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <path d="M 175 512 L 305 478" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEventUp)"/>
  <rect x="80" y="470" width="180" height="46" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="170" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">TrailDao (Room)</text>
  <text x="170" y="506" text-anchor="middle" font-size="10.5" fill="#3c4043">local database</text>

  <!-- Retrofit -->
  <path d="M 460 466 L 590 500" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEventUp)"/>
  <path d="M 585 512 L 455 478" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <rect x="500" y="470" width="180" height="46" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="590" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">TrailApi (Retrofit)</text>
  <text x="590" y="506" text-anchor="middle" font-size="10.5" fill="#3c4043">remote REST service</text>

  <!-- Legend -->
  <line x1="60" y1="540" x2="100" y2="540" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#arrowState)"/>
  <text x="108" y="544" font-size="11.5" fill="#3c4043">state / data flows up</text>
  <line x1="330" y1="540" x2="370" y2="540" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEventUp)"/>
  <text x="378" y="544" font-size="11.5" fill="#3c4043">events / requests flow down</text>

  <defs>
    <marker id="arrowState" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowEvent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c5221f"/>
    </marker>
    <marker id="arrowEventUp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c5221f"/>
    </marker>
  </defs>
</svg>
