<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The four parts of Canva Shield, as the official page presents them</text>
  <rect x="30" y="52" width="700" height="280" rx="16" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <g stroke="#4F46E5" stroke-width="1.5">
    <rect x="52" y="76" width="155" height="220" rx="10" fill="#EEF2FF"/>
    <rect x="222" y="76" width="155" height="220" rx="10" fill="#EEF2FF"/>
    <rect x="392" y="76" width="155" height="220" rx="10" fill="#EEF2FF"/>
    <rect x="562" y="76" width="155" height="220" rx="10" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <g fill="#4F46E5"><circle cx="72" cy="96" r="11"/><circle cx="242" cy="96" r="11"/><circle cx="412" cy="96" r="11"/></g><circle cx="582" cy="96" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="72" y="100">1</text><text x="242" y="100">2</text><text x="412" y="100">3</text><text x="582" y="100">4</text></g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="130" y="132">Trust and safety</text><text x="300" y="132">Privacy settings</text><text x="470" y="132">Creators</text><text x="640" y="132">Indemnification</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="130" y="160">Automatic input and</text><text x="130" y="176">output review</text><text x="130" y="198">Blocked terms</text><text x="130" y="220">Reporting options</text><text x="130" y="242">Machine learning</text><text x="130" y="258">safeguards</text>
    <text x="300" y="160">You choose whether</text><text x="300" y="176">your private content</text><text x="300" y="192">may improve AI</text><text x="300" y="208">features</text><text x="300" y="236">Handled under the</text><text x="300" y="252">Privacy Policy and,</text><text x="300" y="268">if applicable, the DPA</text>
    <text x="470" y="160">A published commitment</text><text x="470" y="176">to creators over the</text><text x="470" y="192">coming years,</text><text x="470" y="208">including an AI</text><text x="470" y="224">royalty programme</text>
    <text x="640" y="160">For eligible Canva</text><text x="640" y="176">Enterprise customers</text><text x="640" y="198">Covers IP claims on</text><text x="640" y="214">Magic Studio output</text><text x="640" y="236">No extra cost</text><text x="640" y="258">Contact Sales for</text><text x="640" y="274">eligibility</text>
  </g>
  <text x="380" y="356" font-size="12" fill="#374151" text-anchor="middle">The parts are tools and commitments, not a substitute for reviewing what you publish.</text>
  <text x="380" y="372" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
