<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" role="img" aria-labelledby="web-scatter-popularity-growth-t web-scatter-popularity-growth-d">
<title id="web-scatter-popularity-growth-t">Popularity against growth</title>
<desc id="web-scatter-popularity-growth-d">Computed popularity (x) against computed growth (y) for the web frameworks in the radar groups.</desc>
