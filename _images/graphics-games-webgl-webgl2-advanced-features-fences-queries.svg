<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgl2-advanced-features-fences-queries" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Fences and queries: CPU submits, GPU finishes later</text>
<text x="20" y="80" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">CPU</text>
<text x="20" y="190" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">GPU</text>
<rect x="70" y="60" width="120" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="84.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">submit frame N</text>
<rect x="200" y="60" width="110" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="255.0" y="84.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">fenceSync</text>
<rect x="320" y="60" width="120" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">flush()</text>
<rect x="450" y="60" width="130" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="515.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">poll clientWaitSync</text>
<rect x="590" y="60" width="150" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="665.0" y="84.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">getBufferSubData</text>
<rect x="120" y="170" width="340" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.0" y="194.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">GPU runs frame N (query brackets it)</text>
<rect x="470" y="170" width="90" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="515.0" y="194.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">fence signals</text>
<line x1="130" y1="100" x2="130" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-fences-queries)"/>
<line x1="515" y1="170" x2="515" y2="100" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-webgl-webgl2-advanced-features-fences-queries)"/>
<text x="380" y="130" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">TIMEOUT_EXPIRED: come back next frame</text>
<text x="380" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">getQueryParameter(query, QUERY_RESULT_AVAILABLE) works the same way: ask again on a later frame.</text>
<text x="380" y="270" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Occlusion: ANY_SAMPLES_PASSED(_CONSERVATIVE). Counting: TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN.</text>
<text x="380" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Never call clientWaitSync with a large timeout on the main thread: it blocks the page.</text>
</svg>
