<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One natural template, two outcomes</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">the same file opened by a designer and rendered by the server</text>

  <!-- template file -->
  <rect x="300" y="64" width="260" height="76" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="430" y="86" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">books/list.html</text>
  <text x="430" y="108" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">&lt;li th:each="b : ${books}"</text>
  <text x="430" y="124" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">    th:text="${b.title}"&gt;Dune&lt;/li&gt;</text>

  <!-- left: static -->
  <rect x="30" y="190" width="360" height="140" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="210" y="214" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">Opened as a static file (file://)</text>
  <text x="210" y="236" font-size="11" fill="#8a6a00" text-anchor="middle">the browser ignores the th:* attributes</text>
  <rect x="70" y="250" width="280" height="62" fill="#ffffff" stroke="#8a6a00" stroke-width="1"/>
  <text x="90" y="272" font-size="12" fill="#222222">&#8226; Dune</text>
  <text x="90" y="292" font-size="11" fill="#666666">prototype text stays visible</text>

  <!-- right: rendered -->
  <rect x="470" y="190" width="360" height="140" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="650" y="214" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">Rendered by the server</text>
  <text x="650" y="236" font-size="11" fill="#1e6b34" text-anchor="middle">th:each repeats the item, th:text replaces the body</text>
  <rect x="510" y="250" width="280" height="62" fill="#ffffff" stroke="#1e6b34" stroke-width="1"/>
  <text x="530" y="270" font-size="12" fill="#222222">&#8226; Neuromancer</text>
  <text x="530" y="290" font-size="12" fill="#222222">&#8226; Snow Crash</text>
  <text x="530" y="306" font-size="10" fill="#666666">th:* attributes are removed from the output</text>

  <!-- arrows -->
  <g stroke="#444444" stroke-width="1.6" fill="#444444">
    <line x1="360" y1="140" x2="250" y2="184"/><polygon points="244,186 253,176 256,185"/>
    <line x1="500" y1="140" x2="610" y2="184"/><polygon points="616,186 604,185 607,176"/>
  </g>
  <text x="270" y="158" font-size="11" fill="#444444" text-anchor="end">double-click</text>
  <text x="590" y="158" font-size="11" fill="#444444">TemplateEngine.process</text>
</svg>
