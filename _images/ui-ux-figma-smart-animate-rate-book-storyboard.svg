<svg viewBox="0 0 720 400" width="720" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="400" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the "Rate this book" star animation</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="10" y="50" width="136" height="260" rx="10"/><rect x="154" y="50" width="136" height="260" rx="10"/><rect x="298" y="50" width="136" height="260" rx="10"/><rect x="442" y="50" width="136" height="260" rx="10"/><rect x="586" y="50" width="124" height="260" rx="10"/></g>
<g fill="#4F46E5"><circle cx="28" cy="68" r="11"/><circle cx="172" cy="68" r="11"/><circle cx="316" cy="68" r="11"/><circle cx="460" cy="68" r="11"/><circle cx="604" cy="68" r="11"/></g>
<g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="28" y="72">1</text><text x="172" y="72">2</text><text x="316" y="72">3</text><text x="460" y="72">4</text><text x="604" y="72">5</text></g>
<g fill="#E5E7EB"><rect x="30" y="100" width="96" height="70" rx="6"/><rect x="174" y="100" width="96" height="70" rx="6"/><rect x="318" y="100" width="96" height="70" rx="6"/><rect x="462" y="100" width="96" height="70" rx="6"/><rect x="604" y="100" width="88" height="70" rx="6"/></g>
<g font-size="22" fill="#9CA3AF" text-anchor="middle"><text x="78" y="206">&#9734;&#9734;&#9734;</text><text x="222" y="206" fill="#B45309">&#9733;&#9734;&#9734;</text><text x="366" y="206" fill="#B45309">&#9733;&#9733;&#9734;</text><text x="510" y="206" fill="#B45309">&#9733;&#9733;&#9733;</text><text x="648" y="206" fill="#B45309">&#9733;&#9733;&#9733;</text></g>
<g text-anchor="middle"><rect x="40" y="236" width="76" height="22" rx="11" fill="#EEF2FF" stroke="#4F46E5"/><text x="78" y="251" font-size="11" fill="#3730A3">Rate</text>
<rect x="540" y="236" width="0" height="0"/><rect x="598" y="236" width="100" height="22" rx="11" fill="#D1FAE5" stroke="#047857"/><text x="648" y="251" font-size="11" fill="#047857">Thanks!</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="78" y="282">Frame A: stars</text><text x="78" y="298">outlined</text>
<text x="222" y="282">Star 1 fills and</text><text x="222" y="298">scales up</text>
<text x="366" y="282">Star 2 follows,</text><text x="366" y="298">staggered</text>
<text x="510" y="282">Star 3 fills,</text><text x="510" y="298">rest settles</text>
<text x="648" y="282">Frame B: label</text><text x="648" y="298">fades in</text></g>
<g stroke="#4B5563" stroke-width="1.5"><path d="M147,180 L153,180" marker-end="url(#ah)"/><path d="M291,180 L297,180" marker-end="url(#ah)"/><path d="M435,180 L441,180" marker-end="url(#ah)"/><path d="M579,180 L585,180" marker-end="url(#ah)"/></g>
<text x="360" y="340" font-size="12" fill="#374151" text-anchor="middle">Panels 2 to 4 are intermediate moments Figma computes between frame A and frame B.</text>
<text x="360" y="360" font-size="12" fill="#374151" text-anchor="middle">Only fill, scale and opacity differ between the two frames; layer names are identical.</text>
</svg>
