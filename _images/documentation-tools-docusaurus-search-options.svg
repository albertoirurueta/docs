<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where the search index lives for the three Docusaurus search approaches</title>
  <desc id="d">Three rows show how a built site reaches the reader's search box. Algolia uses a hosted crawler and a hosted index queried from the browser. Typesense uses a scraper and a server you run or rent. A local search plugin writes an index file at build time that the browser downloads.</desc>
  <rect width="760" height="340" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <text x="30" y="32">Approach</text>
    <text x="200" y="32">After the build</text>
    <text x="440" y="32">Index lives in</text>
    <text x="600" y="32">Browser asks</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="48" width="160" height="80" rx="8" fill="#cfe3f7"/>
    <text x="32" y="74" font-weight="bold">Algolia DocSearch</text>
    <text x="32" y="94">theme-search-algolia</text>
    <text x="32" y="112">(in the classic preset)</text>
    <rect x="190" y="48" width="230" height="80" rx="8" fill="#f7e3b5"/>
    <text x="202" y="74">Hosted crawler visits the</text>
    <text x="202" y="92">deployed site and its sitemap,</text>
    <text x="202" y="110">on a schedule</text>
    <rect x="430" y="48" width="150" height="80" rx="8" fill="#cfeacb"/>
    <text x="442" y="84">Algolia index</text>
    <text x="442" y="104">(hosted)</text>
    <rect x="590" y="48" width="150" height="80" rx="8" fill="#e6d3f0"/>
    <text x="602" y="84">Algolia API, with</text>
    <text x="602" y="104">a search-only key</text>

    <rect x="20" y="140" width="160" height="80" rx="8" fill="#cfe3f7"/>
    <text x="32" y="166" font-weight="bold">Typesense</text>
    <text x="32" y="186">theme-search-typesense</text>
    <text x="32" y="204">(community)</text>
    <rect x="190" y="140" width="230" height="80" rx="8" fill="#f7e3b5"/>
    <text x="202" y="166">You run a scraper (Docker)</text>
    <text x="202" y="184">against the deployed site,</text>
    <text x="202" y="202">after every deployment</text>
    <rect x="430" y="140" width="150" height="80" rx="8" fill="#cfeacb"/>
    <text x="442" y="176">Typesense server</text>
    <text x="442" y="196">(self-hosted or cloud)</text>
    <rect x="590" y="140" width="150" height="80" rx="8" fill="#e6d3f0"/>
    <text x="602" y="176">Typesense API, with</text>
    <text x="602" y="196">a search-only key</text>

    <rect x="20" y="232" width="160" height="80" rx="8" fill="#cfe3f7"/>
    <text x="32" y="258" font-weight="bold">Local search</text>
    <text x="32" y="278">docusaurus-search-local</text>
    <text x="32" y="296">(community)</text>
    <rect x="190" y="232" width="230" height="80" rx="8" fill="#f7e3b5"/>
    <text x="202" y="258">The build itself writes the</text>
    <text x="202" y="276">index, no external service</text>
    <text x="202" y="294">and no extra job</text>
    <rect x="430" y="232" width="150" height="80" rx="8" fill="#cfeacb"/>
    <text x="442" y="268">search-index.json</text>
    <text x="442" y="288">(in the build folder)</text>
    <rect x="590" y="232" width="150" height="80" rx="8" fill="#e6d3f0"/>
    <text x="602" y="268">Nothing: it downloads</text>
    <text x="602" y="288">the file and searches</text>
  </g>
</svg>
