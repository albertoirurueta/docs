<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where a WooCommerce page can be answered from a cache</title>
  <desc id="d">A request passes the browser and CDN, then a full page cache such as Varnish or an Nginx FastCGI cache that serves only anonymous shoppers, then the web server and PHP with OPcache, then the WordPress object cache (a persistent Valkey or Redis cache for options and transients, plus a per-request cache for product objects), and finally the database with the InnoDB buffer pool, the options table, the sessions table and the Action Scheduler tables. Cart, checkout, My account, the wc-ajax and REST endpoints and any request that carries a cart, session or login cookie skip the page cache and go straight to PHP.</desc>
  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Five places a WooCommerce response can come from, nearest to the shopper first</text>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="56" width="170" height="300" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="80" font-size="14" font-weight="bold">Browser and CDN</text>
    <text x="32" y="106">Images, CSS and JS</text>
    <text x="32" y="122">with long expiry and</text>
    <text x="32" y="138">versioned file names</text>
    <text x="32" y="168">sessionStorage keeps</text>
    <text x="32" y="184">the legacy cart</text>
    <text x="32" y="200">fragments</text>
    <text x="32" y="260" fill="#f4b860">You set</text>
    <text x="32" y="278" fill="#f4b860">Cache-Control, WebP or</text>
    <text x="32" y="294" fill="#f4b860">AVIF, CDN rules</text>

    <rect x="210" y="56" width="190" height="300" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="222" y="80" font-size="14" font-weight="bold">Full page cache</text>
    <text x="222" y="106">Varnish, Nginx FastCGI</text>
    <text x="222" y="122">cache, or a plugin</text>
    <text x="222" y="152">Anonymous GET only.</text>
    <text x="222" y="168">Bypassed for cart,</text>
    <text x="222" y="184">checkout, My account,</text>
    <text x="222" y="200">wc-ajax, REST and any</text>
    <text x="222" y="216">cart, session or login</text>
    <text x="222" y="232">cookie</text>
    <text x="222" y="262">Hit: PHP is skipped</text>
    <text x="222" y="294" fill="#f4b860">You set</text>
    <text x="222" y="312" fill="#f4b860">exclusions, TTL, purge</text>
    <text x="222" y="328" fill="#f4b860">on product save</text>

    <rect x="420" y="56" width="170" height="300" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="432" y="80" font-size="14" font-weight="bold">Web server, PHP</text>
    <text x="432" y="106">Apache or Nginx with</text>
    <text x="432" y="122">PHP-FPM workers</text>
    <text x="432" y="152">OPcache holds compiled</text>
    <text x="432" y="168">scripts: about 3,700 PHP</text>
    <text x="432" y="184">files in WooCommerce</text>
    <text x="432" y="200">11.2.1 alone</text>
    <text x="432" y="294" fill="#f4b860">You set</text>
    <text x="432" y="312" fill="#f4b860">memory_consumption,</text>
    <text x="432" y="328" fill="#f4b860">max_accelerated_files</text>

    <rect x="610" y="56" width="190" height="300" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="622" y="80" font-size="14" font-weight="bold">Object cache</text>
    <text x="622" y="106">Persistent (Valkey or</text>
    <text x="622" y="122">Redis drop-in): options,</text>
    <text x="622" y="138">transients, order and</text>
    <text x="622" y="154">meta caches</text>
    <text x="622" y="184">Per request only: the</text>
    <text x="622" y="200">product_objects group</text>
    <text x="622" y="216">of product instance</text>
    <text x="622" y="232">caching (non-persistent)</text>
    <text x="622" y="262">Never page content</text>
    <text x="622" y="294" fill="#f4b860">You set</text>
    <text x="622" y="312" fill="#f4b860">object-cache.php,</text>
    <text x="622" y="328" fill="#f4b860">per-site key prefix</text>

    <rect x="820" y="56" width="160" height="300" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="832" y="80" font-size="14" font-weight="bold">Database</text>
    <text x="832" y="106">InnoDB buffer pool</text>
    <text x="832" y="136">wp_options (autoload)</text>
    <text x="832" y="152">woocommerce_sessions</text>
    <text x="832" y="168">wc_orders and lookups</text>
    <text x="832" y="184">Action Scheduler tables</text>
    <text x="832" y="214">Slow query log shows</text>
    <text x="832" y="230">what the caches miss</text>
    <text x="832" y="294" fill="#f4b860">You set</text>
    <text x="832" y="312" fill="#f4b860">buffer pool size,</text>
    <text x="832" y="328" fill="#f4b860">retention, cleanup</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="190" y1="130" x2="208" y2="130" marker-end="url(#a)"/>
    <line x1="400" y1="130" x2="418" y2="130" marker-end="url(#a)"/>
    <line x1="590" y1="130" x2="608" y2="130" marker-end="url(#a)"/>
    <line x1="800" y1="130" x2="818" y2="130" marker-end="url(#a)"/>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="380" width="960" height="156" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="34" y="404" font-size="14" font-weight="bold">What a shopper with a cart does to these layers</text>
    <text x="34" y="426">The first add to cart sets three cookies: wp_woocommerce_session_ (2 days), woocommerce_items_in_cart and woocommerce_cart_hash.</text>
    <text x="34" y="444">An anonymous visit to the home page sets none of them, so one cached copy can serve every anonymous shopper.</text>
    <text x="34" y="462">After the first add to cart the page cache must hand that shopper's requests to PHP, hence the standard cookie exclusions.</text>
    <text x="34" y="480">Measured behind Varnish 7.7 on the local store: a cached page answered in about 1 ms, the same page from PHP in 90 to 210 ms.</text>
    <text x="34" y="498">The Mini-Cart block (default since 10.4) no longer needs the wc-cart-fragments script on every page.</text>
    <text x="34" y="516">Persistent object caching speeds up dynamic pages; it does not replace the page cache for anonymous traffic.</text>
  </g>
</svg>
