<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="tb-t tb-d">
  <title id="tb-t">What dot notation, curly braces and parentheses return from a table</title>
  <desc id="tb-d">A table of three heatflow sensors with the variables SensorID, X, Y and Temp. Dot notation on the Temp variable returns a numeric column vector, curly braces on the first two rows of X and Y return a numeric array, and parentheses on the same rows and variables return a smaller table.</desc>
