<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Write the Bookshelf brand voice and use it in a post</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="170" height="250" rx="10"/><rect x="198" y="50" width="170" height="250" rx="10"/><rect x="384" y="50" width="170" height="250" rx="10"/><rect x="570" y="50" width="178" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M183,175 L197,175" marker-end="url(#ah)"/><path d="M369,175 L383,175" marker-end="url(#ah)"/><path d="M555,175 L569,175" marker-end="url(#ah)"/></g>
  <!-- panel 1 -->
  <text x="26" y="102" font-size="12" font-weight="bold" fill="#1F2937">Brand voice</text>
  <rect x="26" y="114" width="142" height="60" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="36" y="148" font-size="11" fill="#4F46E5">Add your brand voice</text>
  <rect x="26" y="190" width="142" height="12" rx="3" fill="#E5E7EB"/><rect x="26" y="208" width="100" height="12" rx="3" fill="#E5E7EB"/>
  <!-- panel 2 -->
  <rect x="210" y="90" width="146" height="110" rx="4" fill="#FFFFFF" stroke="#4F46E5"/>
  <g font-size="10" fill="#374151"><text x="218" y="108">Warm, curious, concise.</text><text x="218" y="122">Sound like a friendly</text><text x="218" y="136">bookseller. Short</text><text x="218" y="150">sentences. No jargon.</text><text x="218" y="164">Say reading list.</text></g>
  <text x="348" y="194" font-size="10" fill="#6B7280" text-anchor="end">limit 500 characters</text>
  <rect x="258" y="214" width="50" height="24" rx="6" fill="#4F46E5"/><text x="283" y="230" font-size="12" fill="#FFFFFF" text-anchor="middle">Save</text>
  <!-- panel 3 -->
  <rect x="396" y="90" width="146" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="406" y="107" font-size="11" fill="#374151">Brand tab, Brand voice</text>
  <rect x="396" y="124" width="146" height="26" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="406" y="141" font-size="11" fill="#4F46E5">Generate in this voice</text>
  <rect x="396" y="162" width="146" height="40" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="404" y="186" font-size="10" fill="#374151">Write a caption for...</text>
  <rect x="440" y="214" width="58" height="24" rx="6" fill="#4F46E5"/><text x="469" y="230" font-size="12" fill="#FFFFFF" text-anchor="middle">Generate</text>
  <!-- panel 4 -->
  <rect x="582" y="90" width="154" height="150" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="596" y="102" width="100" height="12" rx="3" fill="#4F46E5"/>
  <g font-size="10" fill="#374151"><text x="596" y="136">Our pick this week</text><text x="596" y="150">is a quiet mystery.</text><text x="596" y="164">Add it to your list.</text></g>
  <rect x="596" y="190" width="70" height="22" rx="11" fill="#B45309"/><text x="631" y="205" font-size="10" fill="#FFFFFF" text-anchor="middle">Save to list</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="216" cy="68" r="11"/><circle cx="402" cy="68" r="11"/></g><circle cx="588" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="216" y="72">2</text><text x="402" y="72">3</text><text x="588" y="72">4</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="97" y="322">Open Brand voice</text><text x="97" y="338">in the Brand Kit</text><text x="283" y="322">Describe the</text><text x="283" y="338">personality, then save</text><text x="469" y="322">In the editor, ask</text><text x="469" y="338">for text in the voice</text><text x="659" y="322">On-voice copy lands</text><text x="659" y="338">on the post</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
