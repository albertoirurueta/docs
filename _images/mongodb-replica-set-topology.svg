<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Replica set: steady state and failover</text>

  <line x1="392" y1="52" x2="392" y2="410" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ============ LEFT PANEL: steady state ============ -->
  <text x="196" y="52" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Steady state</text>

  <!-- heartbeat lines (dashed) -->
  <g stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="196" y1="112" x2="96" y2="300"/>
    <line x1="196" y1="112" x2="296" y2="300"/>
    <line x1="120" y1="312" x2="272" y2="312"/>
  </g>
  <text x="196" y="360" font-size="10" fill="#666666" text-anchor="middle">heartbeat every 2s (all pairs)</text>

  <!-- oplog replication arrows (solid accent) -->
  <defs>
    <marker id="rs-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>
  <g stroke="#1c4b73" stroke-width="1.8" fill="none">
    <line x1="170" y1="120" x2="96" y2="272" marker-end="url(#rs-arrow)"/>
    <line x1="222" y1="120" x2="296" y2="272" marker-end="url(#rs-arrow)"/>
  </g>
  <text x="118" y="205" font-size="10" fill="#1c4b73" text-anchor="middle" transform="rotate(-64 118 205)">oplog</text>
  <text x="274" y="205" font-size="10" fill="#1c4b73" text-anchor="middle" transform="rotate(64 274 205)">oplog</text>

  <!-- primary -->
  <rect x="136" y="86" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="196" y="106" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PRIMARY</text>
  <text x="196" y="122" font-size="9.5" fill="#666666" text-anchor="middle">takes all writes</text>

  <!-- secondary A -->
  <rect x="36" y="288" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="96" y="308" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">SECONDARY</text>
  <text x="96" y="324" font-size="9.5" fill="#666666" text-anchor="middle">tails the oplog</text>

  <!-- secondary B -->
  <rect x="236" y="288" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="296" y="308" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">SECONDARY</text>
  <text x="296" y="324" font-size="9.5" fill="#666666" text-anchor="middle">tails the oplog</text>

  <!-- ============ RIGHT PANEL: after failover ============ -->
  <text x="576" y="52" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">After failover</text>

  <g stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="500" y1="312" x2="652" y2="312"/>
  </g>

  <!-- election arrow -->
  <g stroke="#2f5424" stroke-width="1.8" fill="none">
    <defs>
      <marker id="rs-arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
      </marker>
    </defs>
    <line x1="476" y1="272" x2="552" y2="132" marker-end="url(#rs-arrow2)"/>
  </g>
  <text x="470" y="205" font-size="10" fill="#2f5424" text-anchor="middle" transform="rotate(-61 470 205)">elected by majority</text>

  <!-- old primary, down -->
  <rect x="516" y="86" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="576" y="106" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">former PRIMARY</text>
  <text x="576" y="122" font-size="9.5" fill="#666666" text-anchor="middle">unreachable</text>
  <g stroke="#666666" stroke-width="2.2">
    <line x1="556" y1="92" x2="596" y2="126"/>
    <line x1="596" y1="92" x2="556" y2="126"/>
  </g>

  <!-- promoted secondary -->
  <rect x="416" y="288" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="2"/>
  <text x="476" y="308" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">NEW PRIMARY</text>
  <text x="476" y="324" font-size="9.5" fill="#666666" text-anchor="middle">promoted secondary</text>

  <!-- remaining secondary -->
  <rect x="616" y="288" width="120" height="46" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="676" y="308" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">SECONDARY</text>
  <text x="676" y="324" font-size="9.5" fill="#666666" text-anchor="middle">replicates from new primary</text>

  <text x="380" y="404" font-size="11" fill="#444444" text-anchor="middle">A majority of voting members must agree before a secondary becomes primary; writes pause only during the election.</text>
</svg>
