<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A scaled WebSocket cluster: clients connect through a load balancer to three WebSocket nodes; a message from Ada on node 1 is published to a backplane (Redis pub/sub, Streams or Kafka) that every node subscribes to, and each node delivers it to its own local connections; durable state such as seq and history lives in a shared store</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One room, three nodes, one backplane</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">each node holds only its own sockets; the backplane carries room broadcasts between nodes, a shared store keeps the state</text>

  <rect x="20" y="80" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="102" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Ada</text>
  <text x="80" y="119" font-size="10" fill="#0d3c75" text-anchor="middle">room general</text>
  <rect x="20" y="170" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="192" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Bob</text>
  <text x="80" y="209" font-size="10" fill="#0d3c75" text-anchor="middle">room general</text>
  <rect x="20" y="260" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="282" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Carol</text>
  <text x="80" y="299" font-size="10" fill="#0d3c75" text-anchor="middle">room general</text>

  <rect x="190" y="130" width="110" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="245" y="160" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">Load balancer</text>
  <text x="245" y="178" font-size="10" fill="#4a148c" text-anchor="middle">least connections</text>
  <text x="245" y="193" font-size="10" fill="#4a148c" text-anchor="middle">idle timeout &gt; 2 x ping</text>
  <text x="245" y="208" font-size="10" fill="#4a148c" text-anchor="middle">/readyz</text>

  <rect x="350" y="80" width="150" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="425" y="102" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Node 1</text>
  <text x="425" y="119" font-size="10" fill="#1b5e20" text-anchor="middle">sockets: Ada</text>
  <rect x="350" y="170" width="150" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="425" y="192" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Node 2</text>
  <text x="425" y="209" font-size="10" fill="#1b5e20" text-anchor="middle">sockets: Bob</text>
  <rect x="350" y="260" width="150" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="425" y="282" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Node 3 (draining)</text>
  <text x="425" y="299" font-size="10" fill="#1b5e20" text-anchor="middle">sockets: Carol</text>

  <rect x="560" y="80" width="220" height="140" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="670" y="104" font-size="13" font-weight="bold" fill="#6d4c00" text-anchor="middle">Backplane</text>
  <text x="670" y="126" font-size="10.5" fill="#6d4c00" text-anchor="middle">Redis pub/sub: fire and forget</text>
  <text x="670" y="144" font-size="10.5" fill="#6d4c00" text-anchor="middle">Redis Streams: replay by id</text>
  <text x="670" y="162" font-size="10.5" fill="#6d4c00" text-anchor="middle">Kafka or NATS JetStream: durable</text>
  <text x="670" y="186" font-size="10" font-style="italic" fill="#6d4c00" text-anchor="middle">every node subscribes</text>
  <text x="670" y="204" font-size="10" font-style="italic" fill="#6d4c00" text-anchor="middle">and delivers to its own sockets</text>

  <rect x="560" y="260" width="220" height="50" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="670" y="282" font-size="13" font-weight="bold" fill="#8e1b1b" text-anchor="middle">Shared store</text>
  <text x="670" y="299" font-size="10" fill="#8e1b1b" text-anchor="middle">INCR seq, history, tickets, presence</text>

  <line x1="140" y1="105" x2="188" y2="150" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="140" y1="195" x2="188" y2="178" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="140" y1="285" x2="188" y2="205" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="150" x2="348" y2="108" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="178" x2="348" y2="190" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="205" x2="348" y2="283" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="105" x2="558" y2="120" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="558" y1="170" x2="502" y2="190" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="558" y1="190" x2="502" y2="276" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="502" y1="290" x2="558" y2="290" stroke="#37474f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="528" y="98" font-size="10" fill="#37474f" text-anchor="middle">1 publish</text>
  <text x="530" y="152" font-size="10" fill="#37474f" text-anchor="middle">2 fan out</text>
  <text x="530" y="282" font-size="10" fill="#37474f" text-anchor="middle">3 seq</text>

  <rect x="190" y="340" width="590" height="70" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
  <text x="485" y="362" font-size="12" font-weight="bold" fill="#263238" text-anchor="middle">Rolling deploy of node 3</text>
  <text x="485" y="381" font-size="10.5" fill="#263238" text-anchor="middle">/readyz answers 503, upgrades are refused, then 4503 closes are spread over a window</text>
  <text x="485" y="397" font-size="10.5" fill="#263238" text-anchor="middle">and each client reconnects after a random delay: a few connections per second, not all at once</text>
  <text x="400" y="430" font-size="11" fill="#555555" text-anchor="middle">Without the backplane, Ada's message would reach only the sockets of node 1</text>
</svg>
