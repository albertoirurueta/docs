<text x="390" y="488" font-size="11" fill="#1c4b73" text-anchor="middle">dim[1].sm = 64 B (8 elements)</text>
<text x="48" y="524" font-size="12" fill="#444444">The elements of the section are not contiguous: CFI_is_contiguous returns 0, so a C function must step with sm, never with sizeof(double).</text>
<text x="48" y="544" font-size="12" fill="#444444">CFI_address(dv, subscripts) computes base_addr + sum of (subscripts[d] - lower_bound[d]) * sm[d] for you.</text>
