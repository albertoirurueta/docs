<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Gateway API role model from GatewayClass down to route resources and policies split by persona</title>
  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Gateway API role model</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">infrastructure provider to cluster operator to application developer to service owner</text>

  <!-- GatewayClass row -->
  <rect x="30" y="60" width="720" height="56" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="60" y="82" font-size="11.5" font-weight="bold" fill="#1c4b73">GatewayClass/envoy-gateway</text>
  <text x="60" y="98" font-size="9" fill="#333333">cluster-scoped template a controller watches -- set once by the infrastructure provider</text>
  <text x="700" y="90" font-size="9" fill="#1c4b73" text-anchor="end" font-weight="bold">Standard</text>

  <!-- Gateway row -->
  <rect x="30" y="132" width="720" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="60" y="154" font-size="11.5" font-weight="bold" fill="#2d6a34">Gateway/bookshelf-gateway</text>
  <text x="60" y="170" font-size="9" fill="#333333">listeners (host, port, protocol, TLS), provisioned and run by the cluster operator</text>
  <text x="60" y="186" font-size="9" fill="#333333">references the GatewayClass above; one load balancer per Gateway</text>
  <text x="700" y="162" font-size="9" fill="#2d6a34" text-anchor="end" font-weight="bold">Standard</text>

  <!-- Route resources row -->
  <rect x="30" y="218" width="720" height="150" rx="8" fill="#f7f9fb" stroke="#7a4fa3" stroke-width="1.6"/>
  <text x="60" y="238" font-size="12.5" font-weight="bold" fill="#7a4fa3">Route resources -- attached by application developers, one namespace each</text>

  <rect x="50" y="250" width="150" height="46" rx="4" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.1"/>
  <text x="125" y="270" font-size="10" font-weight="bold" fill="#7a4fa3" text-anchor="middle">HTTPRoute</text>
  <text x="125" y="284" font-size="8" fill="#555555" text-anchor="middle">host, path, header match</text>

  <rect x="212" y="250" width="150" height="46" rx="4" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.1"/>
  <text x="287" y="270" font-size="10" font-weight="bold" fill="#7a4fa3" text-anchor="middle">GRPCRoute</text>
  <text x="287" y="284" font-size="8" fill="#555555" text-anchor="middle">gRPC service and method</text>

  <rect x="374" y="250" width="150" height="46" rx="4" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.1"/>
  <text x="449" y="270" font-size="10" font-weight="bold" fill="#7a4fa3" text-anchor="middle">TLSRoute</text>
  <text x="449" y="284" font-size="8" fill="#555555" text-anchor="middle">SNI passthrough</text>

  <rect x="536" y="250" width="90" height="46" rx="4" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.1"/>
  <text x="581" y="270" font-size="10" font-weight="bold" fill="#7a4fa3" text-anchor="middle">TCPRoute</text>
  <text x="581" y="284" font-size="8" fill="#555555" text-anchor="middle">raw TCP</text>

  <rect x="636" y="250" width="94" height="46" rx="4" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.1"/>
  <text x="683" y="270" font-size="10" font-weight="bold" fill="#7a4fa3" text-anchor="middle">UDPRoute</text>
  <text x="683" y="284" font-size="8" fill="#555555" text-anchor="middle">raw UDP</text>

  <text x="60" y="316" font-size="9" fill="#333333">every kind above carries parentRefs pointing back at the Gateway and backendRefs pointing at Services</text>
  <text x="60" y="332" font-size="9" fill="#333333">each backendRefs weight splits traffic across Services without changing replica counts</text>
  <text x="700" y="270" font-size="9" fill="#7a4fa3" text-anchor="end" font-weight="bold">Standard</text>
  <text x="60" y="352" font-size="8.5" fill="#777777" font-style="italic">ListenerSet (Standard since v1.6) lets several namespaces share one Gateway's listeners</text>

  <!-- Policy row -->
  <rect x="30" y="384" width="345" height="70" rx="6" fill="#fdf3e7" stroke="#a15c1e" stroke-width="1.4"/>
  <text x="52" y="406" font-size="11" font-weight="bold" fill="#a15c1e">ReferenceGrant</text>
  <text x="52" y="422" font-size="8.5" fill="#333333">opt-in from a target namespace that</text>
  <text x="52" y="436" font-size="8.5" fill="#333333">allows a cross-namespace backendRef</text>
  <text x="355" y="416" font-size="9" fill="#a15c1e" text-anchor="end" font-weight="bold">Standard</text>

  <rect x="405" y="384" width="345" height="70" rx="6" fill="#fdf3e7" stroke="#a15c1e" stroke-width="1.4"/>
  <text x="427" y="406" font-size="11" font-weight="bold" fill="#a15c1e">BackendTLSPolicy</text>
  <text x="427" y="422" font-size="8.5" fill="#333333">set by the service owner on the backend</text>
  <text x="427" y="436" font-size="8.5" fill="#333333">Service, for gateway-to-backend TLS</text>
  <text x="730" y="416" font-size="9" fill="#a15c1e" text-anchor="end" font-weight="bold">Standard</text>

  <!-- arrows -->
  <line x1="390" y1="116" x2="390" y2="132" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="202" x2="390" y2="218" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="368" x2="200" y2="384" stroke="#7a4fa3" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="580" y1="368" x2="580" y2="384" stroke="#7a4fa3" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="390" y="480" font-size="9" fill="#777777" text-anchor="middle">all nine kinds above ship in the Standard channel of Gateway API 1.6 -- see the versioning reference below</text>
</svg>
