<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <text x="360" y="30" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The six &lt;Transition&gt; classes</text>
  <text x="360" y="50" font-size="12" fill="#444444" text-anchor="middle">Added around the DOM insert (enter) and the DOM remove (leave)</text>

  <!-- ENTER row -->
  <text x="58" y="105" font-size="13" font-weight="bold" fill="#1c4b73">enter</text>
  <rect x="150" y="86" width="470" height="34" rx="4" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="385" y="107" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">v-enter-active</text>

  <line x1="150" y1="72" x2="150" y2="150" stroke="#999999" stroke-width="1.2"/>
  <text x="150" y="66" font-size="12" font-weight="bold" fill="#2f6fa8" text-anchor="middle">v-enter-from</text>
  <text x="150" y="140" font-size="10" fill="#666666" text-anchor="middle">removed 1 frame after insert</text>
  <text x="150" y="166" font-size="11" fill="#444444" text-anchor="middle">element inserted</text>

  <line x1="620" y1="72" x2="620" y2="150" stroke="#999999" stroke-width="1.2"/>
  <text x="620" y="66" font-size="12" font-weight="bold" fill="#2f6fa8" text-anchor="middle">v-enter-to</text>
  <text x="620" y="140" font-size="10" fill="#666666" text-anchor="middle">added 1 frame after insert</text>
  <text x="620" y="166" font-size="11" fill="#444444" text-anchor="middle">transition ends</text>

  <!-- LEAVE row -->
  <text x="58" y="263" font-size="13" font-weight="bold" fill="#c25a1d">leave</text>
  <rect x="150" y="244" width="470" height="34" rx="4" fill="#fdefe6" stroke="#c25a1d" stroke-width="2"/>
  <text x="385" y="265" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle">v-leave-active</text>

  <line x1="150" y1="230" x2="150" y2="308" stroke="#999999" stroke-width="1.2"/>
  <text x="150" y="224" font-size="12" font-weight="bold" fill="#c25a1d" text-anchor="middle">v-leave-from</text>
  <text x="150" y="298" font-size="10" fill="#666666" text-anchor="middle">added the instant leave starts</text>
  <text x="150" y="324" font-size="11" fill="#444444" text-anchor="middle">leave triggered</text>

  <line x1="620" y1="230" x2="620" y2="308" stroke="#999999" stroke-width="1.2"/>
  <text x="620" y="224" font-size="12" font-weight="bold" fill="#c25a1d" text-anchor="middle">v-leave-to</text>
  <text x="620" y="298" font-size="10" fill="#666666" text-anchor="middle">added 1 frame after leave starts</text>
  <text x="620" y="324" font-size="11" fill="#444444" text-anchor="middle">element removed</text>

  <text x="360" y="356" font-size="12" fill="#444444" text-anchor="middle">*-active declares the transition; *-from and *-to are the start and end states.</text>
  <text x="360" y="373" font-size="12" fill="#444444" text-anchor="middle">A custom name replaces the v- prefix: name="fade" gives fade-enter-from.</text>
</svg>
