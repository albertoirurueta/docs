<svg viewBox="0 0 720 300" width="720" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Iterating on a branch while main stays stable</text>
<text x="20" y="100" font-size="13" font-weight="bold" fill="#3730A3">main</text>
<line x1="70" y1="95" x2="690" y2="95" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah)"/>
<rect x="90" y="75" width="120" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150" y="99" font-size="12" fill="#3730A3" text-anchor="middle">Tested version</text>
<rect x="520" y="75" width="130" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="585" y="99" font-size="12" fill="#047857" text-anchor="middle">Merged fixes</text>
<text x="20" y="215" font-size="13" font-weight="bold" fill="#92400E">branch</text>
<line x1="150" y1="115" x2="230" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="230" y="165" width="110" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="285" y="189" font-size="12" fill="#92400E" text-anchor="middle">Fix findings</text>
<rect x="370" y="165" width="110" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="425" y="189" font-size="12" fill="#92400E" text-anchor="middle">Retest</text>
<rect x="510" y="165" width="110" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565" y="189" font-size="12" fill="#92400E" text-anchor="middle">Review</text>
<line x1="340" y1="185" x2="370" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="480" y1="185" x2="510" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="590" y1="165" x2="590" y2="117" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="150" cy="60" r="11" fill="#4F46E5"/><text x="150" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="285" cy="225" r="11" fill="#B45309"/><text x="285" y="229" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="425" cy="225" r="11" fill="#4F46E5"/><text x="425" y="229" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="565" cy="225" r="11" fill="#4F46E5"/><text x="565" y="229" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="585" cy="60" r="11" fill="#047857"/><text x="585" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="360" y="275" font-size="12" fill="#374151" text-anchor="middle">Name a version on main before branching so you can return to what was tested</text>
</svg>
