<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Is an older instruction still safe to follow?</text>
  <!-- row 1 -->
  <rect x="30" y="62" width="160" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="110" y="84" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Step from an</text><text x="110" y="100" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">older guide</text>
  <rect x="230" y="62" width="180" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="320" y="84" font-size="12" fill="#3730A3" text-anchor="middle">Does it name an old</text><text x="320" y="100" font-size="12" fill="#3730A3" text-anchor="middle">control or term?</text>
  <rect x="470" y="62" width="260" height="50" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="600" y="84" font-size="12" fill="#374151" text-anchor="middle">Translate it with the term map,</text><text x="600" y="100" font-size="12" fill="#374151" text-anchor="middle">then continue below</text>
  <!-- row 2 -->
  <rect x="230" y="172" width="180" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="320" y="194" font-size="12" fill="#3730A3" text-anchor="middle">Is the feature newer</text><text x="320" y="210" font-size="12" fill="#3730A3" text-anchor="middle">than the book?</text>
  <rect x="470" y="172" width="260" height="50" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="600" y="194" font-size="12" fill="#374151" text-anchor="middle">The book cannot help: use the</text><text x="600" y="210" font-size="12" fill="#374151" text-anchor="middle">current page and help article</text>
  <!-- row 3 -->
  <rect x="230" y="282" width="180" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="320" y="304" font-size="12" fill="#3730A3" text-anchor="middle">Does it match the screen</text><text x="320" y="320" font-size="12" fill="#3730A3" text-anchor="middle">and the help article?</text>
  <rect x="470" y="282" width="260" height="50" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="600" y="312" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Follow it</text>
  <rect x="30" y="282" width="160" height="50" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="110" y="304" font-size="12" fill="#B91C1C" text-anchor="middle">Trust the screen and</text><text x="110" y="320" font-size="12" fill="#B91C1C" text-anchor="middle">the help article</text>
  <!-- arrows -->
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <path d="M190,87 L226,87" marker-end="url(#ah)"/>
    <path d="M410,87 L466,87" marker-end="url(#ah)"/>
    <path d="M320,112 L320,168" marker-end="url(#ah)"/>
    <path d="M600,112 L600,140 L320,140"/>
    <path d="M410,197 L466,197" marker-end="url(#ah)"/>
    <path d="M320,222 L320,278" marker-end="url(#ah)"/>
    <path d="M410,307 L466,307" marker-end="url(#ah)"/>
    <path d="M230,307 L194,307" marker-end="url(#ah)"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#3730A3">
    <text x="428" y="80">Yes</text><text x="328" y="156">No</text><text x="428" y="190">Yes</text><text x="328" y="256">No</text><text x="428" y="300">Yes</text><text x="206" y="300">No</text>
  </g>
  <text x="380" y="378" font-size="11" fill="#6B7280" text-anchor="middle">Schematic decision aid written for this page, checked on 2026-10-30.</text>
</svg>
