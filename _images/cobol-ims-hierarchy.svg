<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
<title id="t">Segment hierarchy of the Circulation IMS database</title>
<desc id="d">On the left, the segment types of the database: a MEMBER root segment with two child segment types, LOAN and FINE. On the right, one database record in hierarchic sequence: a MEMBER occurrence followed by its LOAN occurrences and then its FINE occurrence, numbered 1 to 5 in the order a sequence of GN calls returns them, and the next MEMBER root begins a new record.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect width="900" height="470" fill="#fafafa"/>
<text x="450" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212121">The Circulation database: segment types and one database record</text>
<text x="200" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">Segment types (defined in the DBD)</text>
<text x="660" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">One database record in hierarchic sequence</text>
<rect x="100" y="80" width="200" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="200.0" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">MEMBER (root)</text>
<text x="200.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">key MEMBID, 60 bytes</text>
<rect x="30" y="230" width="170" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="115.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">LOAN (child)</text>
<text x="115.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">key BOOKID</text>
<rect x="230" y="230" width="170" height="62" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
<text x="315.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">FINE (child)</text>
<text x="315.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">key FINEDATE</text>
<line x1="170" y1="142" x2="115" y2="228" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="230" y1="142" x2="285" y2="228" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="200" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#212121">Level 1: MEMBER. Level 2: LOAN and FINE.</text>
<text x="200" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#212121">Each child type is a twin chain under its parent.</text>
<text x="200" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#212121">A PSB can make a program sensitive to only some segments.</text>
<circle cx="440" cy="104" r="13" fill="#eceff1" stroke="#455a64" stroke-width="1.4"/>
<text x="440" y="109" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">1</text>
<rect x="470" y="80" width="330" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="635.0" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">MEMBER 000100</text>
<text x="635.0" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">ADA LOVELACE</text>
<circle cx="440" cy="166" r="13" fill="#eceff1" stroke="#455a64" stroke-width="1.4"/>
<text x="440" y="171" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">2</text>
<rect x="510" y="142" width="290" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="655.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">LOAN 000001</text>
<text x="655.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">under member 000100</text>
<circle cx="440" cy="228" r="13" fill="#eceff1" stroke="#455a64" stroke-width="1.4"/>
<text x="440" y="233" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">3</text>
<rect x="510" y="204" width="290" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="655.0" y="224" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">LOAN 000003</text>
<text x="655.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">under member 000100</text>
<circle cx="440" cy="290" r="13" fill="#eceff1" stroke="#455a64" stroke-width="1.4"/>
<text x="440" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">4</text>
<rect x="510" y="266" width="290" height="48" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
<text x="655.0" y="286" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">FINE 20261001</text>
<text x="655.0" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">under member 000100</text>
<circle cx="440" cy="352" r="13" fill="#eceff1" stroke="#455a64" stroke-width="1.4"/>
<text x="440" y="357" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">5</text>
<rect x="470" y="328" width="330" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="635.0" y="348" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">MEMBER 000101</text>
<text x="635.0" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#212121">GRACE HOPPER, next record</text>
<line x1="440" y1="104" x2="440" y2="360" stroke="#37474f" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="450" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#212121">Hierarchic sequence: top to bottom, left to right. Each unqualified GN returns the next numbered segment.</text>
<text x="450" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#212121">GNP stops (GE) at the end of the children of the established parent; GN would continue with segment 5.</text>
</svg>
