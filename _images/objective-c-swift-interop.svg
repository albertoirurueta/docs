<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <defs>
    <marker id="si-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2f6fa8"/>
    </marker>
    <marker id="si-orange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b06a1f"/>
    </marker>
  </defs>

  <text x="380" y="27" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How Objective-C and Swift see each other inside one target</text>

  <!-- target boundary -->
  <rect x="22" y="45" width="716" height="330" rx="10" fill="#fafbfc" stroke="#b9c4cf" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="66" font-size="12" font-weight="bold" fill="#7a8896">One build target (app or framework)</text>

  <!-- Objective-C side -->
  <rect x="45" y="82" width="250" height="130" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="170" y="105" font-size="14" font-weight="bold" fill="#14395c" text-anchor="middle">Objective-C sources</text>
  <text x="170" y="126" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14395c" text-anchor="middle">Person.h / Person.m</text>
  <text x="170" y="143" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14395c" text-anchor="middle">Downloader.h / .m</text>
  <text x="170" y="165" font-size="10.5" fill="#5b7089" text-anchor="middle">Audit these headers:</text>
  <text x="170" y="180" font-size="10.5" fill="#5b7089" text-anchor="middle">NS_ASSUME_NONNULL_BEGIN / END,</text>
  <text x="170" y="195" font-size="10.5" fill="#5b7089" text-anchor="middle">NSArray&lt;T *&gt; *, NS_SWIFT_NAME</text>

  <!-- Swift side -->
  <rect x="465" y="82" width="250" height="130" rx="8" fill="#fbeee0" stroke="#b06a1f" stroke-width="2"/>
  <text x="590" y="105" font-size="14" font-weight="bold" fill="#7a4a10" text-anchor="middle">Swift sources</text>
  <text x="590" y="126" font-size="11" font-family="Menlo, Consolas, monospace" fill="#7a4a10" text-anchor="middle">AnalyticsTracker.swift</text>
  <text x="590" y="143" font-size="11" font-family="Menlo, Consolas, monospace" fill="#7a4a10" text-anchor="middle">Settings.swift</text>
  <text x="590" y="165" font-size="10.5" fill="#8a6a40" text-anchor="middle">To be visible to Objective-C:</text>
  <text x="590" y="180" font-size="10.5" fill="#8a6a40" text-anchor="middle">subclass NSObject, and mark</text>
  <text x="590" y="195" font-size="10.5" fill="#8a6a40" text-anchor="middle">@objc / @objcMembers</text>

  <!-- bridging header (ObjC -> Swift) -->
  <rect x="200" y="238" width="360" height="56" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="2"/>
  <text x="380" y="258" font-size="12.5" font-weight="bold" fill="#14395c" text-anchor="middle">MyApp-Bridging-Header.h</text>
  <text x="380" y="275" font-size="10.5" fill="#5b7089" text-anchor="middle">YOU write it: #import each Objective-C header Swift should see.</text>
  <text x="380" y="289" font-size="10.5" fill="#5b7089" text-anchor="middle">No `import` needed in Swift files &#8212; everything here is visible to all of them.</text>

  <!-- generated header (Swift -> ObjC) -->
  <rect x="200" y="306" width="360" height="56" rx="6" fill="#ffffff" stroke="#b06a1f" stroke-width="2"/>
  <text x="380" y="326" font-size="12.5" font-weight="bold" fill="#7a4a10" text-anchor="middle">MyApp-Swift.h (generated)</text>
  <text x="380" y="343" font-size="10.5" fill="#8a6a40" text-anchor="middle">THE COMPILER writes it, every build. Never edit it.</text>
  <text x="380" y="357" font-size="10.5" fill="#8a6a40" text-anchor="middle">#import it from your .m files &#8212; not from a .h (circular dependency).</text>

  <!-- arrows: ObjC -> bridging -> Swift -->
  <path d="M170 215 L170 253 L195 253" stroke="#2f6fa8" stroke-width="2.5" fill="none" marker-end="url(#si-blue)"/>
  <path d="M563 253 L590 253 L590 215" stroke="#2f6fa8" stroke-width="2.5" fill="none" marker-end="url(#si-blue)"/>
  <text x="170" y="232" font-size="10" fill="#2f6fa8" text-anchor="middle">imported by</text>
  <text x="596" y="232" font-size="10" fill="#2f6fa8" text-anchor="start">visible to</text>

  <!-- arrows: Swift -> generated -> ObjC -->
  <path d="M590 215 L620 215 L620 334 L563 334" stroke="#b06a1f" stroke-width="2.5" fill="none" marker-end="url(#si-orange)"/>
  <path d="M197 334 L140 334 L140 215" stroke="#b06a1f" stroke-width="2.5" fill="none" marker-end="url(#si-orange)"/>
  <text x="648" y="278" font-size="10" fill="#b06a1f" text-anchor="middle">@objc decls</text>
  <text x="648" y="291" font-size="10" fill="#b06a1f" text-anchor="middle">emitted into</text>
  <text x="112" y="278" font-size="10" fill="#b06a1f" text-anchor="middle">imported</text>
  <text x="112" y="291" font-size="10" fill="#b06a1f" text-anchor="middle">by .m files</text>

  <!-- bottom notes -->
  <text x="380" y="398" font-size="11.5" fill="#5b7089" text-anchor="middle">A FRAMEWORK target has no bridging header: public Objective-C headers go in the umbrella header instead,</text>
  <text x="380" y="414" font-size="11.5" fill="#5b7089" text-anchor="middle">and Swift sees them through the module. The generated header is then &lt;MyFramework/MyFramework-Swift.h&gt;.</text>
  <text x="380" y="437" font-size="11.5" fill="#5b7089" text-anchor="middle">Swift structs, enums with associated values, tuples and generics cannot cross into Objective-C at all &#8212; wrap them</text>
  <text x="380" y="453" font-size="11.5" fill="#5b7089" text-anchor="middle">in a thin @objc NSObject subclass. And Swift methods are statically dispatched unless marked @objc dynamic.</text>
</svg>
