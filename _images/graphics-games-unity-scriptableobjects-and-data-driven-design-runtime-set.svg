<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A runtime set tracks live objects without a manager</text>
<rect x="30" y="60" width="190" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="86.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Book (clone 1)</text>
<text x="125.0" y="101.3" text-anchor="middle" font-size="11" fill="#3730A3">OnEnable: set.Add(this)</text>
<rect x="30" y="130" width="190" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Book (clone 2)</text>
<text x="125.0" y="171.3" text-anchor="middle" font-size="11" fill="#3730A3">OnEnable: set.Add(this)</text>
<rect x="30" y="200" width="190" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="125.0" y="226.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Book (clone 3)</text>
<text x="125.0" y="241.3" text-anchor="middle" font-size="11" fill="#374151">OnDisable: set.Remove(this)</text>
<rect x="300" y="90" width="180" height="130" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="390.0" y="135.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">BookRuntimeSet</text>
<text x="390.0" y="151.2" text-anchor="middle" font-size="12" fill="#1F2937">ScriptableObject asset</text>
<text x="390.0" y="167.2" text-anchor="middle" font-size="12" fill="#1F2937">List&lt;Book&gt; items</text>
<text x="390.0" y="183.2" text-anchor="middle" font-size="12" fill="#1F2937">Add / Remove / Count</text>
<line x1="220" y1="90" x2="300" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="220" y1="160" x2="300" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="220" y1="230" x2="300" y2="190" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="560" y="60" width="170" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="86.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">ShelfCounter</text>
<text x="645.0" y="101.3" text-anchor="middle" font-size="11" fill="#3730A3">reads set.Count</text>
<rect x="560" y="140" width="170" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="166.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">SpawnerLimiter</text>
<text x="645.0" y="181.3" text-anchor="middle" font-size="11" fill="#3730A3">stops at 12 books</text>
<rect x="560" y="220" width="170" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="241.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Debug overlay</text>
<text x="645.0" y="256.4" text-anchor="middle" font-size="11" fill="#3730A3">lists set.Items</text>
<line x1="480" y1="155" x2="560" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="480" y1="155" x2="560" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="480" y1="155" x2="560" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="290" width="700" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="316.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Lifetime rule</text>
<text x="380.0" y="331.9" text-anchor="middle" font-size="11" fill="#92400E">The list lives in the asset, so clear it when Play Mode starts (a RuntimeInitializeOnLoadMethod).</text>
<text x="380.0" y="346.9" text-anchor="middle" font-size="11" fill="#92400E">Otherwise stale entries remain between sessions when domain reload is disabled.</text>
</svg>
