<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two duplicate identities merged into one</text>

  <text x="170" y="62" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Before: candidates sharing keys</text>
  <text x="560" y="62" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">After: apoc.refactor.mergeNodes</text>

  <!-- before: shared key nodes in the middle -->
  <g stroke="#888888" stroke-width="1.4" fill="none">
    <line x1="92" y1="170" x2="170" y2="110"/>
    <line x1="92" y1="170" x2="170" y2="160"/>
    <line x1="92" y1="170" x2="170" y2="210"/>
    <line x1="92" y1="170" x2="170" y2="290" stroke-dasharray="4 3"/>
    <line x1="248" y1="110" x2="170" y2="110" stroke-width="0"/>
    <line x1="248" y1="170" x2="170" y2="110"/>
    <line x1="248" y1="170" x2="170" y2="160"/>
    <line x1="248" y1="170" x2="170" y2="210"/>
    <line x1="248" y1="170" x2="170" y2="330" stroke-dasharray="4 3"/>
    <line x1="92" y1="170" x2="92" y2="236"/>
    <line x1="248" y1="170" x2="248" y2="236"/>
  </g>

  <!-- shared key nodes -->
  <g fill="#e8f1fb" stroke="#2c6fb0" stroke-width="1.8">
    <rect x="130" y="96" width="80" height="28" rx="14"/>
    <rect x="130" y="146" width="80" height="28" rx="14"/>
    <rect x="130" y="196" width="80" height="28" rx="14"/>
  </g>
  <g fill="#1f4f80" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="170" y="115">Email</text>
    <text x="170" y="165">Phone</text>
    <text x="170" y="215">Document</text>
  </g>

  <!-- address nodes (different spellings) -->
  <g fill="#f4f4f4" stroke="#999999" stroke-width="1.6">
    <rect x="130" y="276" width="80" height="28" rx="14"/>
    <rect x="130" y="316" width="80" height="28" rx="14"/>
  </g>
  <g fill="#555555" font-size="12" text-anchor="middle">
    <text x="170" y="295">Address 1</text>
    <text x="170" y="335">Address 2</text>
  </g>

  <!-- identities before -->
  <circle cx="92" cy="170" r="30" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="92" y="175" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">id-1</text>
  <circle cx="248" cy="170" r="30" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="248" y="175" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">id-2</text>

  <!-- source nodes -->
  <rect x="52" y="236" width="80" height="26" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="1.6"/>
  <text x="92" y="253" font-size="11.5" fill="#6b5200" text-anchor="middle">CRM</text>
  <rect x="208" y="236" width="80" height="26" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="1.6"/>
  <text x="248" y="253" font-size="11.5" fill="#6b5200" text-anchor="middle">ONBOARDING</text>

  <!-- merge arrow -->
  <line x1="318" y1="200" x2="400" y2="200" stroke="#2e8b57" stroke-width="3"/>
  <polygon points="412,200 398,192 398,208" fill="#2e8b57"/>
  <text x="360" y="186" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">one transaction</text>

  <!-- after -->
  <g stroke="#888888" stroke-width="1.4" fill="none">
    <line x1="560" y1="170" x2="560" y2="110"/>
    <line x1="560" y1="170" x2="640" y2="140"/>
    <line x1="560" y1="170" x2="640" y2="200"/>
    <line x1="560" y1="170" x2="500" y2="236"/>
    <line x1="560" y1="170" x2="620" y2="236"/>
    <line x1="560" y1="170" x2="500" y2="300" stroke-dasharray="4 3"/>
    <line x1="560" y1="170" x2="620" y2="300" stroke-dasharray="4 3"/>
  </g>
  <rect x="520" y="82" width="80" height="28" rx="14" fill="#e8f1fb" stroke="#2c6fb0" stroke-width="1.8"/>
  <text x="560" y="101" font-size="12" font-weight="bold" fill="#1f4f80" text-anchor="middle">Email</text>
  <rect x="600" y="126" width="80" height="28" rx="14" fill="#e8f1fb" stroke="#2c6fb0" stroke-width="1.8"/>
  <text x="640" y="145" font-size="12" font-weight="bold" fill="#1f4f80" text-anchor="middle">Phone</text>
  <rect x="600" y="186" width="80" height="28" rx="14" fill="#e8f1fb" stroke="#2c6fb0" stroke-width="1.8"/>
  <text x="640" y="205" font-size="12" font-weight="bold" fill="#1f4f80" text-anchor="middle">Document</text>
  <rect x="460" y="236" width="80" height="26" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="1.6"/>
  <text x="500" y="253" font-size="11.5" fill="#6b5200" text-anchor="middle">CRM</text>
  <rect x="580" y="236" width="80" height="26" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="1.6"/>
  <text x="620" y="253" font-size="11.5" fill="#6b5200" text-anchor="middle">ONBOARDING</text>
  <rect x="460" y="300" width="80" height="28" rx="14" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="500" y="319" font-size="12" fill="#555555" text-anchor="middle">Address 1</text>
  <rect x="580" y="300" width="80" height="28" rx="14" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="620" y="319" font-size="12" fill="#555555" text-anchor="middle">Address 2</text>

  <circle cx="560" cy="170" r="34" fill="#dff3e6" stroke="#2e8b57" stroke-width="3"/>
  <text x="560" y="168" font-size="13" font-weight="bold" fill="#1d5a38" text-anchor="middle">id-1</text>
  <text x="560" y="183" font-size="9.5" fill="#1d5a38" text-anchor="middle">mergedFrom id-2</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="396" r="8" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="400" font-size="11.5" fill="#444444">Candidate identity</text>
    <rect x="176" y="388" width="22" height="16" rx="8" fill="#e8f1fb" stroke="#2c6fb0" stroke-width="1.6"/>
    <text x="206" y="400" font-size="11.5" fill="#444444">Shared key (email, phone, document)</text>
    <rect x="426" y="388" width="22" height="16" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="1.6"/>
    <text x="456" y="400" font-size="11.5" fill="#444444">SOURCE system (kept)</text>
    <circle cx="610" cy="396" r="8" fill="#dff3e6" stroke="#2e8b57" stroke-width="2.4"/>
    <text x="626" y="400" font-size="11.5" fill="#444444">Survivor</text>
  </g>

  <text x="360" y="424" font-size="11.5" fill="#444444" text-anchor="middle">Shared keys flag the pair, the merge keeps both SOURCE edges and both addresses, and the namesake id-4 sharing only an address stays apart.</text>
</svg>
