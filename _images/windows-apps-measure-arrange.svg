<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6a2a"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">WPF layout: two passes over the element tree</text>
  <text x="400" y="48" font-size="13" fill="#666666" text-anchor="middle">Measure asks every element how much room it wants. Arrange then gives every element its final slot.</text>

  <!-- Pass 1 -->
  <rect x="20" y="64" width="370" height="340" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="205" y="88" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Pass 1: Measure (top-down request, bottom-up answer)</text>

  <rect x="110" y="104" width="190" height="44" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="205" y="123" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Window / root Grid</text>
  <text x="205" y="140" font-size="11" fill="#333333" text-anchor="middle">Measure(availableSize = window client area)</text>

  <rect x="40" y="206" width="150" height="44" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="115" y="225" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">DataGrid</text>
  <text x="115" y="242" font-size="11" fill="#333333" text-anchor="middle">Measure(width left, height *)</text>

  <rect x="220" y="206" width="150" height="44" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="295" y="225" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Details StackPanel</text>
  <text x="295" y="242" font-size="11" fill="#333333" text-anchor="middle">Measure(300 x height)</text>

  <line x1="160" y1="150" x2="125" y2="204" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrDown)"/>
  <line x1="250" y1="150" x2="285" y2="204" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrDown)"/>

  <rect x="40" y="290" width="150" height="32" rx="6" fill="#ffffff" stroke="#2a6a2a" stroke-dasharray="4 3"/>
  <text x="115" y="310" font-size="11" fill="#222222" text-anchor="middle">DesiredSize returned</text>
  <rect x="220" y="290" width="150" height="32" rx="6" fill="#ffffff" stroke="#2a6a2a" stroke-dasharray="4 3"/>
  <text x="295" y="310" font-size="11" fill="#222222" text-anchor="middle">DesiredSize returned</text>
  <line x1="115" y1="252" x2="115" y2="288" stroke="#2a6a2a" stroke-width="2" marker-end="url(#arrUp)"/>
  <line x1="295" y1="252" x2="295" y2="288" stroke="#2a6a2a" stroke-width="2" marker-end="url(#arrUp)"/>

  <text x="205" y="350" font-size="12" fill="#333333" text-anchor="middle">Each element calls Measure on its children inside MeasureOverride</text>
  <text x="205" y="368" font-size="12" fill="#333333" text-anchor="middle">and returns the size it would like. Infinity means unconstrained.</text>
  <text x="205" y="388" font-size="12" fill="#333333" text-anchor="middle">DesiredSize is a request, never a guarantee.</text>

  <!-- Pass 2 -->
  <rect x="410" y="64" width="370" height="340" rx="12" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="595" y="88" font-size="15" font-weight="bold" fill="#7a5a10" text-anchor="middle">Pass 2: Arrange (top-down, final slots)</text>

  <rect x="500" y="104" width="190" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="595" y="123" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Window / root Grid</text>
  <text x="595" y="140" font-size="11" fill="#333333" text-anchor="middle">Arrange(finalRect), then ArrangeOverride</text>

  <rect x="430" y="206" width="150" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="505" y="225" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">DataGrid</text>
  <text x="505" y="242" font-size="11" fill="#333333" text-anchor="middle">Arrange(Rect 0,0,480,360)</text>

  <rect x="610" y="206" width="150" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="685" y="225" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Details StackPanel</text>
  <text x="685" y="242" font-size="11" fill="#333333" text-anchor="middle">Arrange(Rect 485,0,300,360)</text>

  <line x1="550" y1="150" x2="515" y2="204" stroke="#a07820" stroke-width="2" marker-end="url(#arrDown)"/>
  <line x1="640" y1="150" x2="675" y2="204" stroke="#a07820" stroke-width="2" marker-end="url(#arrDown)"/>

  <rect x="430" y="290" width="150" height="32" rx="6" fill="#ffffff" stroke="#a07820" stroke-dasharray="4 3"/>
  <text x="505" y="310" font-size="11" fill="#222222" text-anchor="middle">RenderSize = 480 x 360</text>
  <rect x="610" y="290" width="150" height="32" rx="6" fill="#ffffff" stroke="#a07820" stroke-dasharray="4 3"/>
  <text x="685" y="310" font-size="11" fill="#222222" text-anchor="middle">RenderSize = 300 x 360</text>
  <line x1="505" y1="252" x2="505" y2="288" stroke="#a07820" stroke-width="2" marker-end="url(#arrDown)"/>
  <line x1="685" y1="252" x2="685" y2="288" stroke="#a07820" stroke-width="2" marker-end="url(#arrDown)"/>

  <text x="595" y="350" font-size="12" fill="#333333" text-anchor="middle">The parent decides each child's rectangle and may give it</text>
  <text x="595" y="368" font-size="12" fill="#333333" text-anchor="middle">more or less than DesiredSize. ActualWidth and ActualHeight</text>
  <text x="595" y="386" font-size="12" fill="#333333" text-anchor="middle">are valid only after this pass.</text>
</svg>
