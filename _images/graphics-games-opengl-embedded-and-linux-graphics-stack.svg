<svg viewBox="0 0 760 480" width="760" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-embedded-and-linux-graphics-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="480" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Linux graphics stack under an OpenGL or OpenGL ES program</text>
<rect x="20" y="50" width="720" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="74.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Application: OpenGL 4.x or OpenGL ES 3.x calls + EGL (or GLX) for the context</text>
<line x1="380" y1="90" x2="380" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="20" y="106" width="720" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="130.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Dispatch: libGL / libGLESv2 / libEGL (typically libglvnd), picks the vendor implementation</text>
<line x1="380" y1="146" x2="380" y2="162" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="20" y="162" width="720" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="186.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Mesa: EGL platforms GBM, Wayland, X11, surfaceless + Gallium state tracker</text>
<line x1="380" y1="202" x2="380" y2="218" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="20" y="218" width="230" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="240.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">radeonsi / iris / v3d</text>
<text x="135.0" y="256.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">hardware GL drivers</text>
<rect x="265" y="218" width="230" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="240.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">llvmpipe</text>
<text x="380.0" y="256.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU rasteriser (LLVM)</text>
<rect x="510" y="218" width="230" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="240.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Zink</text>
<text x="625.0" y="256.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GL on Vulkan</text>
<line x1="625" y1="270" x2="625" y2="286" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="510" y="286" width="230" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="312.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vulkan driver (radv, anv, v3dv ...)</text>
<line x1="135" y1="270" x2="135" y2="346" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<line x1="380" y1="270" x2="380" y2="346" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<line x1="625" y1="330" x2="625" y2="346" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="20" y="346" width="720" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="370.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">libdrm + GBM: buffer allocation, KMS modesetting calls</text>
<line x1="380" y1="386" x2="380" y2="402" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-embedded-and-linux-graphics-stack)"/>
<rect x="20" y="402" width="720" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="426.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Kernel: DRM / KMS drivers (amdgpu, i915, vc4 + v3d, ...) -&gt; GPU and display</text>
<text x="380" y="466" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Amber boxes are translation or software paths: same GL program, no hardware GL driver required.</text>
</svg>
