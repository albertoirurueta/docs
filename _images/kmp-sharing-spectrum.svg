<svg viewBox="0 0 760 470" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#5f6368"/></marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">The Kotlin Multiplatform Sharing Spectrum</text>

  <!-- Column headings -->
  <text x="130" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a3a6b">A. Logic only</text>
  <text x="130" y="78" text-anchor="middle" font-size="11.5" fill="#3c4043">native UI on every platform</text>
  <text x="380" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a3a6b">B. Logic + some shared UI</text>
  <text x="380" y="78" text-anchor="middle" font-size="11.5" fill="#3c4043">CMP screens inside native shells</text>
  <text x="630" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a3a6b">C. Logic + all UI</text>
  <text x="630" y="78" text-anchor="middle" font-size="11.5" fill="#3c4043">Compose Multiplatform everywhere</text>

  <!-- Column A -->
  <rect x="30" y="92" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Jetpack Compose</text>
  <text x="130" y="134" text-anchor="middle" font-size="11.5" fill="#3c4043">Android UI (native)</text>
  <rect x="30" y="156" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="130" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">SwiftUI</text>
  <text x="130" y="198" text-anchor="middle" font-size="11.5" fill="#3c4043">iOS UI (native)</text>

  <!-- Column B -->
  <rect x="280" y="92" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="380" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Native navigation shell</text>
  <text x="380" y="134" text-anchor="middle" font-size="11.5" fill="#3c4043">Activity / SwiftUI app</text>
  <rect x="280" y="156" width="200" height="56" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="380" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Shared CMP screens</text>
  <text x="380" y="198" text-anchor="middle" font-size="11.5" fill="#3c4043">embedded where it pays off</text>

  <!-- Column C -->
  <rect x="530" y="92" width="200" height="120" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="630" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">sharedUI (CMP)</text>
  <text x="630" y="164" text-anchor="middle" font-size="11.5" fill="#3c4043">Android, iOS, desktop, web</text>

  <!-- Shared logic bar -->
  <rect x="30" y="232" width="700" height="62" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="380" y="257" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a6b">sharedLogic (Kotlin, commonMain)</text>
  <text x="380" y="277" text-anchor="middle" font-size="12" fill="#3c4043">domain, repositories, Ktor client, SQLDelight / Room, ViewModels, Koin</text>

  <!-- Platform bar -->
  <rect x="30" y="314" width="700" height="46" rx="10" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="380" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Platform APIs via expect/actual and interfaces: location, notifications, permissions, files</text>

  <!-- Arrows up -->
  <path d="M 130 232 L 130 216" stroke="#5f6368" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 380 232 L 380 216" stroke="#5f6368" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 630 232 L 630 216" stroke="#5f6368" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- Axis -->
  <path d="M 40 405 L 720 405" stroke="#5f6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="40" y="428" font-size="12" fill="#3c4043">Less shared code, maximum native fidelity</text>
  <text x="720" y="428" text-anchor="end" font-size="12" fill="#3c4043">More shared code, one UI toolkit</text>
  <text x="380" y="454" text-anchor="middle" font-size="11.5" fill="#3c4043">Green = native UI, orange = Compose Multiplatform UI, blue = shared Kotlin logic. The three paths are not exclusive: one app can move along the axis.</text>
</svg>
