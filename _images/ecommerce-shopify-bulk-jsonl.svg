<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Bulk query JSONL result and the tree rebuilt from __parentId</title>
  <desc id="d">Five lines of a bulk query result for the Pocket Coffee catalog. Product lines have no parent reference, variant lines carry a __parentId that points at their product. The last variant line appears after another product, so a reader must rebuild the tree with a map from id to object. On the right the same five objects are shown as two products with two and one variants.</desc>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>

  <text x="48" y="36" font-size="17" font-weight="bold" fill="#f2f5f8">bulk-operation-result.jsonl : one JSON object per line</text>
  <text x="660" y="36" font-size="17" font-weight="bold" fill="#f2f5f8">Rebuilt in memory</text>

  <!-- parent references, drawn first -->
  <g fill="none" stroke-width="1.8">
    <path d="M46 145 C 14 145, 14 95, 46 95" stroke="#f2f5f8" marker-end="url(#a)"/>
    <path d="M46 245 C 14 245, 14 195, 46 195" stroke="#f2f5f8" marker-end="url(#a)"/>
    <path d="M46 301 C 2 301, 2 95, 46 95" stroke="#f4b860" stroke-dasharray="6 4" marker-end="url(#b)"/>
  </g>

  <!-- JSONL lines -->
  <rect x="50" y="78" width="560" height="34" rx="6" fill="#3d5266"/>
  <rect x="50" y="122" width="560" height="46" rx="6" fill="#33485c"/>
  <rect x="50" y="178" width="560" height="34" rx="6" fill="#3d5266"/>
  <rect x="50" y="222" width="560" height="46" rx="6" fill="#33485c"/>
  <rect x="50" y="278" width="560" height="46" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#f2f5f8">
    <text x="62" y="100">1 {"id":"gid://.../Product/1","title":"Single-origin beans"}</text>
    <text x="62" y="141">2 {"id":"gid://.../ProductVariant/11","sku":"PC-ETH-WHL-250",</text>
    <text x="80" y="157" fill="#f4b860">"__parentId":"gid://.../Product/1"}</text>
    <text x="62" y="200">3 {"id":"gid://.../Product/2","title":"Starter kit"}</text>
    <text x="62" y="241">4 {"id":"gid://.../ProductVariant/12","sku":"PC-KIT",</text>
    <text x="80" y="257" fill="#f4b860">"__parentId":"gid://.../Product/2"}</text>
    <text x="62" y="297">5 {"id":"gid://.../ProductVariant/13","sku":"PC-ETH-ESP-250",</text>
    <text x="80" y="313" fill="#f4b860">"__parentId":"gid://.../Product/1"}</text>
  </g>

  <g font-size="13">
    <text x="50" y="354" fill="#f4b860">Line 5 is not next to its parent (line 1): with groupObjects left at false, children of</text>
    <text x="50" y="372" fill="#f4b860">different parents can interleave. A parent always comes before its children.</text>
    <text x="50" y="404" fill="#f2f5f8">Read the file as a stream, keep a map from id to object, attach each child to map[__parentId].</text>
    <text x="50" y="424" fill="#f2f5f8">Ids are shortened here; real ones read gid://shopify/Product/1234567890.</text>
  </g>

  <!-- tree -->
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6">
    <path d="M690 112 V 142 H 706"/>
    <path d="M690 142 V 184 H 706"/>
    <path d="M690 256 V 286 H 706"/>
  </g>
  <rect x="660" y="78" width="270" height="34" rx="6" fill="#3d5266"/>
  <rect x="706" y="122" width="224" height="40" rx="6" fill="#33485c"/>
  <rect x="706" y="164" width="224" height="40" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="660" y="222" width="270" height="34" rx="6" fill="#3d5266"/>
  <rect x="706" y="266" width="224" height="40" rx="6" fill="#33485c"/>
  <g font-size="13" fill="#f2f5f8">
    <text x="674" y="100" font-weight="bold">Product: Single-origin beans</text>
    <text x="718" y="147" font-family="Menlo, Consolas, monospace" font-size="12.5">PC-ETH-WHL-250</text>
    <text x="718" y="189" font-family="Menlo, Consolas, monospace" font-size="12.5">PC-ETH-ESP-250</text>
    <text x="674" y="244" font-weight="bold">Product: Starter kit</text>
    <text x="718" y="291" font-family="Menlo, Consolas, monospace" font-size="12.5">PC-KIT</text>
  </g>
</svg>
