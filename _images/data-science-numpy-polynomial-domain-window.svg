<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Polynomial.fit maps the data domain onto a window</title>
  <desc id="d">A horizontal axis of years from 1900 to 2000 is mapped linearly onto the window from minus one to one. The polynomial is fitted in the window coordinates and convert() maps it back to the original years.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Fit in the window, report in the domain</text>
  <rect x="60" y="70" width="600" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">domain: the data's own x range</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="60" y="140">1900</text><text x="360" y="140">1950</text><text x="660" y="140">2000</text>
  </g>
  <rect x="60" y="200" width="600" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="60" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">window: where the basis is well conditioned</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="60" y="270">-1</text><text x="360" y="270">0</text><text x="660" y="270">1</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="60" y1="150" x2="60" y2="192" marker-end="url(#ar)"/>
    <line x1="360" y1="150" x2="360" y2="192" marker-end="url(#ar)"/>
    <line x1="660" y1="150" x2="660" y2="192" marker-end="url(#ar)"/>
  </g>
  <circle cx="390" cy="171" r="11" fill="#0F172A"/><text x="390" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="590" cy="95" r="11" fill="#0F172A"/><text x="590" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="590" cy="223" r="11" fill="#0F172A"/><text x="590" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
</svg>
