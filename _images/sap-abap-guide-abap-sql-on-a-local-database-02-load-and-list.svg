<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-abap-guide-abap-sql-on-a-local-database-02-load-and-list-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-abap-sql-on-a-local-database-02-load-and-list-title">Terminal after npm run run:sql: the program prints Inserted five rows with sy-subrc 0 and then All claims with the five rows C000000001 A 120, C000000002 S 35, C000000003 A 80, C000000004 R 10 and C000000005 S 64; callout 4 marks the command and callout 5 marks the output</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:sql</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Inserted five rows, sy-subrc = 0</text>
