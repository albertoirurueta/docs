<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What happens when a PrestaShop module is upgraded</title>
  <desc id="d">The version in the main file is compared with the version stored in the ps_module table. If they differ, the files in the upgrade folder whose version is greater than the stored one and not greater than the file version are run in version order. Every script that returns true moves on to the next one; after the last one the stored version is updated and the actionModuleUpgradeAfter hook fires for other modules. If a script returns false, the module is disabled, a message says that no update was applied, and in PrestaShop 9.2.0 the stored version is still set to the file version, so the failed step is not retried until the stored version is corrected by hand.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="40" y="40" width="250" height="84" rx="8" fill="#33485c" stroke="#f2f5f8" stroke-width="1.5"/>
  <text x="165" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Compare versions</text>
  <text x="165" y="90" font-size="12.5" fill="#f2f5f8" text-anchor="middle">main file: 1.2.0</text>
  <text x="165" y="108" font-size="12.5" fill="#f2f5f8" text-anchor="middle">ps_module.version: 1.0.0</text>

  <!-- step 2 -->
  <rect x="355" y="40" width="250" height="84" rx="8" fill="#33485c" stroke="#f2f5f8" stroke-width="1.5"/>
  <text x="480" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Pick the scripts</text>
  <text x="480" y="90" font-size="12.5" fill="#f2f5f8" text-anchor="middle">upgrade-x.y.z.php with</text>
  <text x="480" y="108" font-size="12.5" fill="#f2f5f8" text-anchor="middle">1.0.0 &lt; x.y.z &lt;= 1.2.0, sorted</text>

  <!-- step 3 -->
  <rect x="670" y="40" width="250" height="84" rx="8" fill="#33485c" stroke="#f2f5f8" stroke-width="1.5"/>
  <text x="795" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Run each script</text>
  <text x="795" y="90" font-size="12.5" fill="#f2f5f8" text-anchor="middle">upgrade_module_1_1_0($module)</text>
  <text x="795" y="108" font-size="12.5" fill="#f2f5f8" text-anchor="middle">then upgrade_module_1_2_0($module)</text>

  <g fill="none" stroke="#f2f5f8" stroke-width="1.8">
    <path d="M292 82 L353 82" marker-end="url(#a)"/>
    <path d="M607 82 L668 82" marker-end="url(#a)"/>
  </g>

  <!-- success branch -->
  <path d="M780 126 L780 170 L560 170 L560 196" fill="none" stroke="#f2f5f8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="575" y="162" font-size="12.5" fill="#f2f5f8">every script returned true</text>
  <rect x="350" y="198" width="420" height="132" rx="8" fill="#3d5266"/>
  <text x="560" y="226" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Success</text>
  <text x="560" y="250" font-size="12.5" fill="#f2f5f8" text-anchor="middle">ps_module.version becomes 1.2.0</text>
  <text x="560" y="270" font-size="12.5" fill="#f2f5f8" text-anchor="middle">the hook actionModuleUpgradeAfter</text>
  <text x="560" y="290" font-size="12.5" fill="#f2f5f8" text-anchor="middle">(module_name, old_version, new_version) goes to the</text>
  <text x="560" y="308" font-size="12.5" fill="#f2f5f8" text-anchor="middle">OTHER modules, not to the one being upgraded</text>

  <!-- failure branch -->
  <path d="M860 126 L860 196" fill="none" stroke="#f4b860" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="868" y="150" font-size="12.5" fill="#f4b860">a script</text>
  <text x="868" y="168" font-size="12.5" fill="#f4b860">returns false</text>
  <rect x="790" y="198" width="130" height="132" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="855" y="226" font-size="14" font-weight="bold" fill="#f4b860" text-anchor="middle">Failure</text>
  <text x="855" y="250" font-size="12.5" fill="#f4b860" text-anchor="middle">module disabled</text>
  <text x="855" y="270" font-size="12.5" fill="#f4b860" text-anchor="middle">remaining scripts</text>
  <text x="855" y="288" font-size="12.5" fill="#f4b860" text-anchor="middle">skipped</text>
  <text x="855" y="308" font-size="12.5" fill="#f4b860" text-anchor="middle">version still moves</text>

  <!-- parity lane -->
  <rect x="40" y="198" width="280" height="132" rx="8" fill="#3d5266"/>
  <text x="180" y="226" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Fresh install of 1.2.0</text>
  <text x="180" y="250" font-size="12.5" fill="#f2f5f8" text-anchor="middle">install() runs, no upgrade script</text>
  <text x="180" y="270" font-size="12.5" fill="#f2f5f8" text-anchor="middle">must reach the same state:</text>
  <text x="180" y="290" font-size="12.5" fill="#f2f5f8" text-anchor="middle">same table, same hooks,</text>
  <text x="180" y="308" font-size="12.5" fill="#f2f5f8" text-anchor="middle">same configuration keys</text>

  <rect x="40" y="360" width="880" height="1" fill="#f2f5f8" opacity="0.5"/>
  <text x="40" y="390" font-size="14" font-weight="bold" fill="#f2f5f8">Script rules</text>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="40" y="414">File name has exactly one dash: upgrade-1.2.0.php. A name such as upgrade-1.2.0-rc1.php is not picked up.</text>
    <text x="40" y="434">Function name: upgrade_module_ plus the version with dots replaced by underscores (upgrade_module_1_2_0).</text>
    <text x="40" y="454">Scripts run in one PHP request and define global functions: never reuse a helper function name from another module.</text>
    <text x="40" y="474">Scripts must be idempotent (IF NOT EXISTS, column check, registerHook): a failed run is replayed after the fix.</text>
    <text x="40" y="494">install() is not run on upgrade, so every new hook, table or key needs a script and an install() line.</text>
  </g>
</svg>
