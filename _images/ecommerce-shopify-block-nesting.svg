<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How Pocket Coffee blocks nest inside sections</title>
  <desc>A containment diagram of the product.coffee.json template: the coffee-feature section holds a roast date badge and a group, the group holds two origin cards, the first card holds a tasting note, and the brew-guide section holds dynamic brew steps plus a static brew timer.</desc>
  <text x="480" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">templates/product.coffee.json: sections, blocks and nested blocks</text>
  <text x="480" y="46" font-size="12" fill="#7b8794" text-anchor="middle">Solid borders are dynamic blocks (reorderable, in block_order); the dashed orange border is a static block (fixed in Liquid)</text>

  <!-- Section coffee-feature -->
  <rect x="20" y="64" width="560" height="500" rx="10" fill="#e3effd" stroke="#2f6db5" stroke-width="2"/>
  <text x="36" y="88" font-size="14" font-weight="bold" fill="#1f2933">Section: coffee-feature</text>
  <text x="36" y="106" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">blocks: @theme, @app, origin-card, roast-date-badge</text>
  <text x="36" y="122" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">{% content_for 'blocks' %} + static featured-badge</text>

  <rect x="40" y="140" width="520" height="44" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="56" y="160" font-size="13" font-weight="bold" fill="#1f2933">Theme block: roast-date-badge</text>
  <text x="56" y="176" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">product = {{ closest.product }}</text>

  <rect x="40" y="198" width="520" height="352" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="56" y="218" font-size="13" font-weight="bold" fill="#1f2933">Theme block: group (horizontal)</text>
  <text x="56" y="234" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">blocks: @theme   {% content_for 'blocks' %}</text>

  <rect x="56" y="248" width="236" height="288" rx="8" fill="#c9ecdb" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="70" y="268" font-size="13" font-weight="bold" fill="#1f2933">origin-card: Ethiopia</text>
  <text x="70" y="284" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">tag: article</text>
  <rect x="70" y="298" width="208" height="64" rx="6" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.2"/>
  <text x="82" y="318" font-size="12" font-weight="bold" fill="#1f2933">_tasting-note</text>
  <text x="82" y="336" font-size="11.5" fill="#1f2933">Jasmine and bergamot</text>
  <text x="82" y="352" font-size="11.5" fill="#1f2933">intensity 4</text>
  <rect x="70" y="376" width="208" height="44" rx="6" fill="none" stroke="#1f8a5b" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/>
  <text x="174" y="402" font-size="11.5" fill="#1f2933" text-anchor="middle">free slot: text or @app block</text>
  <text x="70" y="448" font-size="11.5" fill="#1f2933">Nested: section &gt; group &gt; card &gt; note</text>
  <text x="70" y="466" font-size="11.5" fill="#1f2933">is level 3 of the 8 allowed.</text>

  <rect x="308" y="248" width="236" height="288" rx="8" fill="#c9ecdb" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="322" y="268" font-size="13" font-weight="bold" fill="#1f2933">origin-card: Colombia</text>
  <text x="322" y="284" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">blocks: {}   block_order: []</text>
  <text x="322" y="312" font-size="11.5" fill="#1f2933">No children yet: the merchant</text>
  <text x="322" y="328" font-size="11.5" fill="#1f2933">adds them from the block picker,</text>
  <text x="322" y="344" font-size="11.5" fill="#1f2933">which lists only blocks the card</text>
  <text x="322" y="360" font-size="11.5" fill="#1f2933">targets: _tasting-note, text and</text>
  <text x="322" y="376" font-size="11.5" fill="#1f2933">any installed app block.</text>

  <!-- Section brew-guide -->
  <rect x="610" y="64" width="330" height="290" rx="10" fill="#e3effd" stroke="#2f6db5" stroke-width="2"/>
  <text x="626" y="88" font-size="14" font-weight="bold" fill="#1f2933">Section: brew-guide</text>
  <text x="626" y="106" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">blocks: _brew-step, _brew-timer</text>
  <rect x="626" y="122" width="298" height="52" rx="6" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="640" y="144" font-size="12.5" font-weight="bold" fill="#1f2933">_brew-step: Grind</text>
  <text x="640" y="162" font-size="11.5" fill="#1f2933">dynamic, in block_order</text>
  <rect x="626" y="184" width="298" height="52" rx="6" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="640" y="206" font-size="12.5" font-weight="bold" fill="#1f2933">_brew-step: Pour</text>
  <text x="640" y="224" font-size="11.5" fill="#1f2933">dynamic, can be dragged above Grind</text>
  <rect x="626" y="250" width="298" height="84" rx="6" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="640" y="272" font-size="12.5" font-weight="bold" fill="#1f2933">_brew-timer (static, id brew-timer)</text>
  <text x="640" y="290" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">content_for 'block', type, id,</text>
  <text x="640" y="306" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">minutes: section.settings.minutes</text>
  <text x="640" y="324" font-size="11.5" fill="#1f2933">hidden or edited, never moved or deleted</text>

  <!-- Section roast-notes -->
  <rect x="610" y="372" width="330" height="192" rx="10" fill="#e3effd" stroke="#2f6db5" stroke-width="2"/>
  <text x="626" y="396" font-size="14" font-weight="bold" fill="#1f2933">Section: roast-notes</text>
  <text x="626" y="414" font-size="11.5" fill="#1f2933" font-family="Courier New, monospace">local blocks: note, @app (max_blocks 6)</text>
  <rect x="626" y="430" width="298" height="44" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.2"/>
  <text x="640" y="450" font-size="12.5" font-weight="bold" fill="#1f2933">note: Brazil Cerrado</text>
  <text x="640" y="466" font-size="11.5" fill="#1f2933">section block, one level only</text>
  <text x="626" y="500" font-size="11.5" fill="#1f2933">Cannot hold theme blocks or nested blocks;</text>
  <text x="626" y="518" font-size="11.5" fill="#1f2933">app blocks are the only external content</text>
  <text x="626" y="536" font-size="11.5" fill="#1f2933">it can accept next to its own blocks.</text>
</svg>
