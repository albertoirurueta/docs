<svg viewBox="0 0 760 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Merging Compose files and profiles</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="410" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Merging Compose files and profiles</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">docker compose (without -f) reads compose.yaml + compose.override.yaml; --profile adds gated services</text>
  <rect x="20" y="70" width="220" height="200" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="130.0" y="146.5" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">compose.yaml (base)</text>
  <text x="130.0" y="161.5" font-size="9" fill="#333333" text-anchor="middle">api: image orders:1.4.0</text>
  <text x="130.0" y="174.5" font-size="9" fill="#333333" text-anchor="middle">  LOGGING_LEVEL_ROOT=INFO</text>
  <text x="130.0" y="187.5" font-size="9" fill="#333333" text-anchor="middle">db: postgres:18.1</text>
  <text x="130.0" y="200.5" font-size="9" fill="#333333" text-anchor="middle">grafana: profiles [observability]</text>
  <rect x="270" y="70" width="220" height="200" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="146.5" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">compose.override.yaml</text>
  <text x="380.0" y="161.5" font-size="9" fill="#333333" text-anchor="middle">api: build: .</text>
  <text x="380.0" y="174.5" font-size="9" fill="#333333" text-anchor="middle">  ports 127.0.0.1:5005:5005</text>
  <text x="380.0" y="187.5" font-size="9" fill="#333333" text-anchor="middle">  LOGGING_LEVEL_ROOT=DEBUG</text>
  <text x="380.0" y="200.5" font-size="9" fill="#333333" text-anchor="middle">  JAVA_TOOL_OPTIONS=jdwp...</text>
  <rect x="520" y="70" width="220" height="200" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="630.0" y="140.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">effective model</text>
  <text x="630.0" y="155.0" font-size="9" fill="#333333" text-anchor="middle">api: built locally</text>
  <text x="630.0" y="168.0" font-size="9" fill="#333333" text-anchor="middle">  ports: 5005 (lists appended)</text>
  <text x="630.0" y="181.0" font-size="9" fill="#333333" text-anchor="middle">  LOGGING_LEVEL_ROOT=DEBUG</text>
  <text x="630.0" y="194.0" font-size="9" fill="#333333" text-anchor="middle">db: postgres:18.1</text>
  <text x="630.0" y="207.0" font-size="9" fill="#333333" text-anchor="middle">grafana: only with --profile</text>
  <line x1="240" y1="170" x2="270" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="490" y1="170" x2="520" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="505.0" y="165.0" font-size="9.5" fill="#555555" text-anchor="middle">merge</text>
  <rect x="20" y="300" width="720" height="70" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="324.0" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Merge rules</text>
  <text x="380.0" y="339.5" font-size="9.5" fill="#333333" text-anchor="middle">single values (image, command) are replaced   |   ports, expose, dns lists are concatenated</text>
  <text x="380.0" y="353.0" font-size="9.5" fill="#333333" text-anchor="middle">environment, labels, volumes merge by key or mount path   |   inspect the result with docker compose config</text>
</svg>
