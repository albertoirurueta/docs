<svg viewBox="0 0 720 300" width="720" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">"Smart animate matching layers" combined with another transition</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF"><rect x="20" y="50" width="200" height="190" rx="10"/><rect x="260" y="50" width="200" height="190" rx="10"/><rect x="500" y="50" width="200" height="190" rx="10"/></g>
<g stroke="#4B5563" stroke-width="1.5"><path d="M222,145 L258,145" marker-end="url(#ah)"/><path d="M462,145 L498,145" marker-end="url(#ah)"/></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="120" y="76" font-weight="bold">Screen: Shelf</text><text x="360" y="76" font-weight="bold">Transition: Push</text><text x="600" y="76" font-weight="bold">Screen: Book detail</text>
<rect x="40" y="95" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="120" y="120">Cover (name: Cover)</text>
<rect x="40" y="150" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="120" y="175">Shelf list</text>
<text x="360" y="110" fill="#047857">Matching layer (Cover):</text><text x="360" y="126" fill="#047857">animates only its changes</text>
<text x="360" y="166" fill="#92400E">Non-matching layers:</text><text x="360" y="182" fill="#92400E">use the chosen Push</text>
<rect x="520" y="95" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="600" y="135">Cover (larger)</text>
<rect x="520" y="175" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="600" y="200">Description</text>
</g>
<text x="360" y="272" font-size="12" fill="#4B5563" text-anchor="middle">Fixed layers that match get no transition; fixed layers that do not match dissolve.</text>
</svg>
