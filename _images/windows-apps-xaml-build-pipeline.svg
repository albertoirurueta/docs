<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What the WPF build does with Bookshelf.App</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Markup compilation turns XAML into generated C# plus binary BAML, then the C# compiler finishes the job</text>

  <!-- Column titles -->
  <text x="110" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Source files</text>
  <text x="380" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">obj/Debug/net10.0-windows</text>
  <text x="650" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">bin/Debug/net10.0-windows</text>

  <!-- Source files -->
  <rect x="20" y="96" width="180" height="40" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="110" y="121" font-size="13" fill="#1c4b73" text-anchor="middle">App.xaml</text>
  <rect x="20" y="146" width="180" height="40" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="110" y="171" font-size="13" fill="#1c4b73" text-anchor="middle">MainWindow.xaml</text>
  <rect x="20" y="196" width="180" height="40" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="110" y="221" font-size="13" fill="#8a5a1c" text-anchor="middle">MainWindow.xaml.cs</text>
  <rect x="20" y="246" width="180" height="40" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="110" y="271" font-size="13" fill="#8a5a1c" text-anchor="middle">ViewModels, Services *.cs</text>
  <rect x="20" y="296" width="180" height="40" rx="8" fill="#fbfbfb" stroke="#999999" stroke-width="1.3"/>
  <text x="110" y="321" font-size="13" fill="#444444" text-anchor="middle">app.manifest, bookshelf.ico</text>

  <!-- Generated -->
  <rect x="280" y="96" width="200" height="40" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="380" y="121" font-size="13" fill="#8a5a1c" text-anchor="middle">App.g.cs (Main, InitializeComponent)</text>
  <rect x="280" y="146" width="200" height="40" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="380" y="171" font-size="13" fill="#8a5a1c" text-anchor="middle">MainWindow.g.cs (fields, wiring)</text>
  <rect x="280" y="196" width="200" height="40" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380" y="221" font-size="13" fill="#1c4b73" text-anchor="middle">MainWindow.baml (binary)</text>
  <rect x="280" y="246" width="200" height="40" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380" y="271" font-size="13" fill="#1c4b73" text-anchor="middle">Bookshelf.App.g.resources</text>

  <!-- Output -->
  <rect x="560" y="146" width="180" height="60" rx="8" fill="#e9f4ec" stroke="#2c6b3f" stroke-width="1.3"/>
  <text x="650" y="172" font-size="13" fill="#2c6b3f" text-anchor="middle">Bookshelf.App.dll</text>
  <text x="650" y="192" font-size="12" fill="#2c6b3f" text-anchor="middle">IL + embedded BAML resource</text>
  <rect x="560" y="226" width="180" height="40" rx="8" fill="#e9f4ec" stroke="#2c6b3f" stroke-width="1.3"/>
  <text x="650" y="251" font-size="13" fill="#2c6b3f" text-anchor="middle">Bookshelf.App.exe (apphost)</text>
  <rect x="560" y="286" width="180" height="40" rx="8" fill="#e9f4ec" stroke="#2c6b3f" stroke-width="1.3"/>
  <text x="650" y="311" font-size="13" fill="#2c6b3f" text-anchor="middle">runtimeconfig + deps JSON</text>

  <!-- Arrows source -> generated -->
  <line x1="200" y1="116" x2="278" y2="116" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="200" y1="166" x2="278" y2="166" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="200" y1="176" x2="278" y2="216" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="380" y1="236" x2="380" y2="244" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>

  <!-- Arrows generated -> output -->
  <line x1="480" y1="116" x2="558" y2="160" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="480" y1="166" x2="558" y2="170" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="480" y1="266" x2="558" y2="190" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="200" y1="216" x2="558" y2="180" stroke="#8a5a1c" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <line x1="200" y1="266" x2="558" y2="186" stroke="#8a5a1c" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <line x1="200" y1="316" x2="558" y2="196" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>

  <!-- Legend -->
  <text x="20" y="366" font-size="12" fill="#444444">Solid blue: MarkupCompilePass1 (XAML to g.cs and BAML). Dashed: handwritten files compiled by Csc, and Win32 resources (manifest, icon).</text>
  <text x="20" y="384" font-size="12" fill="#666666">At run time InitializeComponent() loads the embedded BAML through a pack URI and builds the object tree.</text>
</svg>
