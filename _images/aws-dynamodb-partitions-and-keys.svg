<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">How the Bookshelf Orders table is spread over partitions, and how a GSI re-keys it</text>

  <rect x="20" y="50" width="170" height="150" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="105" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Request</text>
  <text x="105" y="98" text-anchor="middle" font-size="11" fill="#123a72">Query</text>
  <text x="105" y="114" text-anchor="middle" font-size="11" fill="#123a72">customerId = c-42</text>
  <text x="105" y="130" text-anchor="middle" font-size="11" fill="#123a72">orderId begins_with 2026-</text>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#123a72">partition key: equality</text>
  <text x="105" y="176" text-anchor="middle" font-size="11" fill="#123a72">sort key: range allowed</text>

  <rect x="225" y="70" width="110" height="110" rx="10" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.8"/>
  <text x="280" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6b4410">hash(</text>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#6b4410">partition key</text>
  <text x="280" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#6b4410">)</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#6b4410">picks the partition</text>
  <line x1="190" y1="125" x2="223" y2="125" stroke="#555555" stroke-width="1.6"/>
  <polygon points="223,120 233,125 223,130" fill="#555555"/>

  <rect x="370" y="50" width="250" height="100" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="495" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Partition A (SSD, replicated in 3 AZs)</text>
  <text x="495" y="94" text-anchor="middle" font-size="11" fill="#1b5e20">c-17 | 2026-03-02#o-901</text>
  <text x="495" y="110" text-anchor="middle" font-size="11" fill="#1b5e20">c-42 | 2026-01-14#o-310</text>
  <text x="495" y="126" text-anchor="middle" font-size="11" fill="#1b5e20">c-42 | 2026-05-30#o-777</text>
  <text x="495" y="142" text-anchor="middle" font-size="10" font-style="italic" fill="#1b5e20">items of one key sorted by sort key</text>
  <line x1="335" y1="110" x2="368" y2="95" stroke="#555555" stroke-width="1.6"/>
  <polygon points="360,88 370,94 358,101" fill="#555555"/>

  <rect x="370" y="165" width="250" height="75" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="495" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Partition B</text>
  <text x="495" y="209" text-anchor="middle" font-size="11" fill="#1b5e20">c-08 | 2026-02-11#o-455</text>
  <text x="495" y="225" text-anchor="middle" font-size="11" fill="#1b5e20">c-93 | 2026-06-21#o-812</text>
  <line x1="335" y1="145" x2="368" y2="195" stroke="#555555" stroke-width="1.6" stroke-dasharray="5,3"/>

  <rect x="660" y="50" width="220" height="190" rx="10" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.8"/>
  <text x="770" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Limits that shape the design</text>
  <text x="770" y="100" text-anchor="middle" font-size="11" fill="#4a1d75">item size: up to 400 KB</text>
  <text x="770" y="120" text-anchor="middle" font-size="11" fill="#4a1d75">one partition: about 3,000 reads</text>
  <text x="770" y="136" text-anchor="middle" font-size="11" fill="#4a1d75">and 1,000 writes per second</text>
  <text x="770" y="160" text-anchor="middle" font-size="11" fill="#4a1d75">one Query call: 1 MB page</text>
  <text x="770" y="180" text-anchor="middle" font-size="11" fill="#4a1d75">LSI: same partition key, 10 GB</text>
  <text x="770" y="196" text-anchor="middle" font-size="11" fill="#4a1d75">per partition key value</text>
  <text x="770" y="220" text-anchor="middle" font-size="11" fill="#4a1d75">choose a high-cardinality key</text>

  <rect x="20" y="275" width="860" height="140" rx="10" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="450" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Global secondary index status-createdAt-index: same items, a different key, its own partitions (eventually consistent)</text>
  <rect x="40" y="315" width="250" height="80" rx="8" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="165" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Base table</text>
  <text x="165" y="358" text-anchor="middle" font-size="11" fill="#123a72">partition key customerId</text>
  <text x="165" y="374" text-anchor="middle" font-size="11" fill="#123a72">sort key orderId</text>
  <line x1="290" y1="355" x2="378" y2="355" stroke="#555555" stroke-width="1.6"/>
  <polygon points="378,350 388,355 378,360" fill="#555555"/>
  <text x="334" y="346" text-anchor="middle" font-size="10" fill="#555555">async copy</text>
  <rect x="390" y="315" width="250" height="80" rx="8" fill="#fdf3e1" stroke="#b7791f"/>
  <text x="515" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#6b4410">GSI</text>
  <text x="515" y="358" text-anchor="middle" font-size="11" fill="#6b4410">partition key status (PENDING, PAID, ...)</text>
  <text x="515" y="374" text-anchor="middle" font-size="11" fill="#6b4410">sort key createdAt, projection chosen by you</text>
  <text x="760" y="352" text-anchor="middle" font-size="11" fill="#555555">query by status</text>
  <text x="760" y="368" text-anchor="middle" font-size="11" fill="#555555">without a scan</text>
</svg>
