<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>C integer promotion and conversion ladder: bool, char and short are promoted to int; the usual arithmetic conversions then climb from int through unsigned int, long, unsigned long, long long to unsigned long long, with floating-point operands converting to float, double or long double instead.</title>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Integer promotions, then the usual arithmetic conversions</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">Every operand climbs to at least int; a binary operator then converts both operands to the higher rank.</text>

  <!-- step 1: small types -->
  <rect x="24" y="70" width="200" height="118" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="5"/>
  <text x="124" y="89" font-size="11" font-weight="bold" fill="#5c4a14" text-anchor="middle">1. integer promotions</text>
  <text x="124" y="108" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">bool</text>
  <text x="124" y="126" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">char, signed char</text>
  <text x="124" y="144" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">unsigned char</text>
  <text x="124" y="162" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">short, unsigned short</text>
  <text x="124" y="179" font-size="9" fill="#666666" text-anchor="middle">bit-fields and enums join here too</text>

  <line x1="228" y1="129" x2="282" y2="129" stroke="#444444" stroke-width="1.5"/>
  <polygon points="282,123 282,135 292,129" fill="#444444"/>
  <text x="257" y="120" font-size="9" fill="#444444" text-anchor="middle">promote</text>

  <!-- the int rung -->
  <rect x="296" y="104" width="150" height="50" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.6" rx="4"/>
  <text x="371" y="127" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">int</text>
  <text x="371" y="144" font-size="9" fill="#666666" text-anchor="middle">the floor for arithmetic</text>

  <!-- ladder -->
  <text x="600" y="88" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle">2. usual arithmetic conversions</text>
  <text x="600" y="103" font-size="9" fill="#666666" text-anchor="middle">higher rank wins; unsigned wins at equal rank</text>

  <rect x="500" y="112" width="200" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="600" y="134" font-size="11" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">unsigned int</text>

  <rect x="500" y="156" width="200" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="600" y="178" font-size="11" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">long</text>

  <rect x="500" y="200" width="200" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="600" y="222" font-size="11" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">unsigned long</text>

  <rect x="500" y="244" width="200" height="34" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="600" y="266" font-size="11" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">long long</text>

  <rect x="500" y="288" width="200" height="34" fill="#dfe8f4" stroke="#4a6a8a" stroke-width="1.6" rx="4"/>
  <text x="600" y="310" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">unsigned long long</text>

  <!-- climbing arrow -->
  <line x1="478" y1="300" x2="478" y2="136" stroke="#4a6a8a" stroke-width="1.6"/>
  <polygon points="472,136 484,136 478,126" fill="#4a6a8a"/>
  <text x="462" y="220" font-size="9" fill="#4a6a8a" text-anchor="middle" transform="rotate(-90 462 220)">increasing rank</text>
  <line x1="446" y1="129" x2="496" y2="129" stroke="#4a6a8a" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- floating point branch -->
  <rect x="24" y="228" width="410" height="94" fill="#f3ecf3" stroke="#7a4a8a" stroke-width="1.3" rx="5"/>
  <text x="229" y="248" font-size="11" font-weight="bold" fill="#4a2352" text-anchor="middle">If either operand is floating-point</text>
  <text x="229" y="270" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">float &#8594; double &#8594; long double</text>
  <text x="229" y="290" font-size="9" fill="#666666" text-anchor="middle">the integer operand converts to the floating type, not the other way round</text>
  <text x="229" y="308" font-size="9" fill="#666666" text-anchor="middle">_BitInt(N) never promotes: it converts only to a wider _BitInt or by explicit cast</text>

  <!-- warning box -->
  <rect x="24" y="342" width="710" height="66" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" rx="5"/>
  <text x="379" y="362" font-size="11" font-weight="bold" fill="#6a1f1f" text-anchor="middle">The trap this ladder creates</text>
  <text x="379" y="381" font-size="10" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">-1 &lt; 1u  is false</text>
  <text x="379" y="398" font-size="10" fill="#444444" text-anchor="middle">int and unsigned int share a rank, so -1 converts to a huge unsigned value. Compile with -Wsign-compare.</text>
</svg>
