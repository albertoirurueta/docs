<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Where translations and currency formats come from</title>
  <desc id="d">The text of the store has three layers. Language packs from translate.wordpress.org live in wp-content/languages/plugins and are loaded by WordPress. A custom file in wp-content/languages/woocommerce is layered on top by WooCommerce. A plugin or theme loads its own text domain from its languages folder. Multilingual plugins translate content such as products. Currency formats are separate: store settings decide the currency, symbol position, separators and decimals, and a multi-currency extension converts prices.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="30" y="25" width="400" height="150" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="230.0" y="68.0" text-anchor="middle" font-weight="bold">Interface text (gettext)</text>
  <text x="230.0" y="86.0" text-anchor="middle"></text>
  <text x="230.0" y="104.0" text-anchor="middle">WP_LANG_DIR/woocommerce/woocommerce-es_ES.mo</text>
  <text x="230.0" y="122.0" text-anchor="middle">WP_LANG_DIR/plugins/woocommerce-es_ES.mo</text>
  <text x="230.0" y="140.0" text-anchor="middle">plugins/pocket-coffee-taxes/languages/*.mo</text>
  <rect x="470" y="25" width="400" height="150" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="670.0" y="68.0" text-anchor="middle" font-weight="bold">Content (database)</text>
  <text x="670.0" y="86.0" text-anchor="middle"></text>
  <text x="670.0" y="104.0" text-anchor="middle">products, categories, attributes,</text>
  <text x="670.0" y="122.0" text-anchor="middle">pages, emails texts, shipping labels</text>
  <text x="670.0" y="140.0" text-anchor="middle">WPML, Polylang for WooCommerce, TranslatePress</text>
  <rect x="30" y="215" width="400" height="150" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="230.0" y="258.0" text-anchor="middle" font-weight="bold">Currency and number formats</text>
  <text x="230.0" y="276.0" text-anchor="middle"></text>
  <text x="230.0" y="294.0" text-anchor="middle">Settings &gt; General: currency, position,</text>
  <text x="230.0" y="312.0" text-anchor="middle">thousand and decimal separators, decimals</text>
  <text x="230.0" y="330.0" text-anchor="middle">wc_price(), wc_get_price_decimals()</text>
  <rect x="470" y="215" width="400" height="150" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="670.0" y="258.0" text-anchor="middle" font-weight="bold">More than one currency</text>
  <text x="670.0" y="276.0" text-anchor="middle"></text>
  <text x="670.0" y="294.0" text-anchor="middle">display only: filter on wc_price</text>
  <text x="670.0" y="312.0" text-anchor="middle">charge: WooPayments Multi-Currency, WPML,</text>
  <text x="670.0" y="330.0" text-anchor="middle">or another multi-currency extension</text>
  <rect x="150" y="410" width="600" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="440.0" text-anchor="middle" font-weight="bold">Pocket Coffee</text>
  <text x="450.0" y="458.0" text-anchor="middle">Spanish default in EUR, English in EUR, USD shown as an approximate price</text>
  <line x1="230" y1="175" x2="230" y2="215" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="175" x2="670" y2="215" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="290" x2="470" y2="290" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="365" x2="450" y2="410" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
