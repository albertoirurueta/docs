<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One BSON document: scalars, an embedded document, an array of documents</text>

  <!-- document card -->
  <rect x="40" y="52" width="392" height="330" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <g font-family="'Courier New', monospace" font-size="12.5" fill="#222222">
    <text x="54" y="76">{</text>
    <text x="54" y="99">  _id: ObjectId("64f0a1c3e13b1f00a8d9e4b2"),</text>
    <text x="54" y="122">  name: "Ada Lovelace",</text>
    <text x="54" y="145">  contact: {</text>
    <text x="54" y="168">    email: "ada@example.com",</text>
    <text x="54" y="191">    address: { city: "London",</text>
    <text x="54" y="214">               zip:  "N1 9GU" }</text>
    <text x="54" y="237">  },</text>
    <text x="54" y="260">  items: [</text>
    <text x="54" y="283">    { sku: "A-1", qty: 2 },</text>
    <text x="54" y="306">    { sku: "B-7", qty: 1 }</text>
    <text x="54" y="329">  ]</text>
    <text x="54" y="352">}</text>
  </g>

  <!-- highlight underlays -->
  <rect x="52" y="86" width="380" height="17" fill="none" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="122" y="178" width="150" height="17" fill="none" stroke="#2f5424" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="68" y="270" width="176" height="17" fill="none" stroke="#2f5424" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- callout: _id / ObjectId -->
  <g stroke="#1c4b73" stroke-width="1.4" fill="#1c4b73">
    <line x1="432" y1="95" x2="470" y2="80"/>
    <polygon points="470,80 462,80 468,88" stroke="none"/>
  </g>
  <text x="476" y="72" font-size="12" font-weight="bold" fill="#1c4b73">_id : ObjectId</text>
  <text x="476" y="88" font-size="10.5" fill="#666666">12-byte value, unique per collection</text>
  <text x="476" y="102" font-size="10.5" fill="#666666">4-byte timestamp + 5-byte random + 3-byte counter</text>
  <text x="476" y="116" font-size="10.5" fill="#666666">roughly monotonic (sorts near insertion order)</text>

  <!-- callout: dot notation into embedded document -->
  <g stroke="#2f5424" stroke-width="1.4" fill="#2f5424">
    <line x1="432" y1="187" x2="470" y2="187"/>
    <polygon points="470,187 462,183 462,191" stroke="none"/>
  </g>
  <text x="476" y="183" font-size="12" font-weight="bold" fill="#2f5424">contact.address.city</text>
  <text x="476" y="199" font-size="10.5" fill="#666666">dot notation reaches into an embedded document</text>

  <!-- callout: dot notation with array index -->
  <g stroke="#2f5424" stroke-width="1.4" fill="#2f5424">
    <line x1="432" y1="279" x2="470" y2="279"/>
    <polygon points="470,279 462,275 462,283" stroke="none"/>
  </g>
  <text x="476" y="275" font-size="12" font-weight="bold" fill="#2f5424">items.0.sku</text>
  <text x="476" y="291" font-size="10.5" fill="#666666">numeric path segment indexes into an array</text>
  <text x="476" y="305" font-size="10.5" fill="#666666">items.sku (no index) matches any element</text>

  <text x="380" y="410" font-size="11.5" fill="#444444" text-anchor="middle">Field order is preserved; nesting is limited to 100 levels and the whole document to 16 MB.</text>
</svg>
