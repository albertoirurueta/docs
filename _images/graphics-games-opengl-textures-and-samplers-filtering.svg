<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-textures-and-samplers-filtering" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Filtering: what the sampler returns between texel centres</text>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#FEF3C7"/></linearGradient></defs>
<rect x="20" y="50" width="224" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="132.0" y="70" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_NEAREST</text>
<rect x="258" y="50" width="224" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="370.0" y="70" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_LINEAR (bilinear)</text>
<rect x="496" y="50" width="224" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="608.0" y="70" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_LINEAR_MIPMAP_LINEAR (trilinear)</text>
<rect x="40" y="100" width="46" height="56" rx="0" fill="#4F46E5" stroke="#4B5563" stroke-width="1"/>
<rect x="86" y="100" width="46" height="56" rx="0" fill="#4F46E5" stroke="#4B5563" stroke-width="1"/>
<rect x="132" y="100" width="46" height="56" rx="0" fill="#FEF3C7" stroke="#4B5563" stroke-width="1"/>
<rect x="178" y="100" width="46" height="56" rx="0" fill="#FEF3C7" stroke="#4B5563" stroke-width="1"/>
<text x="132.0" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">closest texel wins</text>
<text x="132.0" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blocky when magnified</text>
<rect x="278" y="100" width="184" height="56" fill="url(#g1)" stroke="#4B5563" stroke-width="1"/>
<circle cx="301" cy="128" r="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="439" cy="128" r="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="370.0" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">weighted mix of 4 texels</text>
<text x="370.0" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">smooth, slightly soft</text>
<rect x="518" y="96" width="86" height="64" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="561" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">level k</text>
<rect x="616" y="108" width="52" height="40" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="642" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">k+1</text>
<text x="611" y="172" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text>
<text x="608.0" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend two bilinear results</text>
<text x="608.0" y="206" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no popping between levels</text>
<rect x="20" y="238" width="228" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="134.0" y="257" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_TEXTURE_MIN_FILTER</text>
<rect x="250" y="238" width="128" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="314.0" y="257" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Uses mipmaps</text>
<rect x="380" y="238" width="158" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="459.0" y="257" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Samples per lookup</text>
<rect x="540" y="238" width="200" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="257" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Look</text>
<rect x="20" y="270" width="228" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="134.0" y="288" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">GL_NEAREST / GL_LINEAR</text>
<rect x="250" y="270" width="128" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="314.0" y="288" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">no</text>
<rect x="380" y="270" width="158" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="459.0" y="288" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">1 / 4</text>
<rect x="540" y="270" width="200" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="640.0" y="288" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">aliasing when minified</text>
<rect x="20" y="297" width="228" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="134.0" y="315" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">GL_NEAREST_MIPMAP_NEAREST</text>
<rect x="250" y="297" width="128" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="314.0" y="315" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">yes</text>
<rect x="380" y="297" width="158" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="459.0" y="315" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">1</text>
<rect x="540" y="297" width="200" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="640.0" y="315" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">pops between levels</text>
<rect x="20" y="324" width="228" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="134.0" y="342" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">GL_LINEAR_MIPMAP_NEAREST</text>
<rect x="250" y="324" width="128" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="314.0" y="342" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">yes</text>
<rect x="380" y="324" width="158" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="459.0" y="342" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">4</text>
<rect x="540" y="324" width="200" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="640.0" y="342" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">pops between levels</text>
<rect x="20" y="351" width="228" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="134.0" y="369" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">GL_NEAREST_MIPMAP_LINEAR (default)</text>
<rect x="250" y="351" width="128" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="314.0" y="369" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">yes</text>
<rect x="380" y="351" width="158" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="459.0" y="369" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">2</text>
<rect x="540" y="351" width="200" height="27" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="640.0" y="369" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">blends, blocky</text>
<rect x="20" y="378" width="228" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="134.0" y="396" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">GL_LINEAR_MIPMAP_LINEAR</text>
<rect x="250" y="378" width="128" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="314.0" y="396" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">yes</text>
<rect x="380" y="378" width="158" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="459.0" y="396" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">8</text>
<rect x="540" y="378" width="200" height="27" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="640.0" y="396" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">smooth, the usual choice</text>
<text x="380" y="423" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GL_TEXTURE_MAG_FILTER accepts only GL_NEAREST or GL_LINEAR: magnification never uses mipmaps.</text>
</svg>
