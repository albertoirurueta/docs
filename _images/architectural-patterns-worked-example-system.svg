<svg viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="640" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Place Order Saga assembled end to end</text>

  <defs>
    <marker id="we-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
    <marker id="we-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="we-arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7a3b8f"/>
    </marker>
    <marker id="we-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Order Service: outer boundary -->
  <rect x="30" y="46" width="300" height="210" rx="8" fill="#f7fafc" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="180" y="64" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order Service (core domain)</text>

  <!-- Order aggregate + PlaceOrderService -->
  <rect x="46" y="74" width="268" height="66" rx="7" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="180" y="94" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">PlaceOrderController -&gt; PlaceOrderService</text>
  <text x="180" y="112" font-size="10.5" fill="#333333" text-anchor="middle">Order.place / approve / reject</text>
  <text x="180" y="128" font-size="9.5" fill="#666666" text-anchor="middle">OrderRepository.save(order), one local transaction</text>

  <!-- Outbox -->
  <rect x="46" y="150" width="268" height="46" rx="7" fill="#fdf3e3" stroke="#a8781f" stroke-width="1.8"/>
  <text x="180" y="169" font-size="11.5" font-weight="bold" fill="#a8781f" text-anchor="middle">outbox table</text>
  <text x="180" y="185" font-size="9.5" fill="#333333" text-anchor="middle">written in the same transaction as the Order row</text>

  <!-- PlaceOrderSaga -->
  <rect x="46" y="206" width="268" height="42" rx="7" fill="#f3edf7" stroke="#7a3b8f" stroke-width="1.8"/>
  <text x="180" y="224" font-size="11.5" font-weight="bold" fill="#7a3b8f" text-anchor="middle">PlaceOrderSaga (SagaState)</text>
  <text x="180" y="240" font-size="9.5" fill="#333333" text-anchor="middle">orchestrates the four steps below</text>

  <line x1="180" y1="140" x2="180" y2="150" stroke="#555555" stroke-width="1.6"/>
  <line x1="180" y1="196" x2="180" y2="206" stroke="#555555" stroke-width="1.6"/>

  <!-- Broker -->
  <rect x="360" y="150" width="160" height="46" rx="7" fill="#fdf3e3" stroke="#a8781f" stroke-width="1.8"/>
  <text x="440" y="169" font-size="11" font-weight="bold" fill="#a8781f" text-anchor="middle">order-events</text>
  <text x="440" y="185" font-size="9.5" fill="#333333" text-anchor="middle">relayed by OutboxPollingRelay</text>

  <line x1="314" y1="173" x2="356" y2="173" stroke="#a8781f" stroke-width="2" marker-end="url(#we-arrow-grey)"/>

  <!-- Inventory / Payment / Shipping participants -->
  <rect x="330" y="46" width="130" height="80" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="395" y="66" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Inventory</text>
  <text x="395" y="84" font-size="9.5" fill="#333333" text-anchor="middle">InventoryService</text>
  <text x="395" y="99" font-size="9.5" fill="#333333" text-anchor="middle">reserve / release</text>
  <text x="395" y="114" font-size="9" fill="#666666" text-anchor="middle">compensatable step</text>

  <rect x="475" y="46" width="130" height="80" rx="7" fill="#fbecea" stroke="#a8412e" stroke-width="1.8"/>
  <text x="540" y="66" font-size="12" font-weight="bold" fill="#a8412e" text-anchor="middle">Payment</text>
  <text x="540" y="84" font-size="9.5" fill="#333333" text-anchor="middle">authorize</text>
  <text x="540" y="99" font-size="9" fill="#a8412e" text-anchor="middle">pivot step, no compensation</text>
  <text x="540" y="114" font-size="9" fill="#666666" text-anchor="middle">com.example.payment</text>

  <rect x="620" y="46" width="130" height="80" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="685" y="66" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Shipping</text>
  <text x="685" y="84" font-size="9.5" fill="#333333" text-anchor="middle">schedule</text>
  <text x="685" y="99" font-size="9" fill="#2d6a34" text-anchor="middle">retriable step</text>
  <text x="685" y="114" font-size="9" fill="#666666" text-anchor="middle">com.example.shipping</text>

  <!-- Saga command/reply arrows -->
  <path d="M 250 206 C 300 190, 350 150, 390 130" fill="none" stroke="#7a3b8f" stroke-width="1.8" marker-end="url(#we-arrow-purple)"/>
  <path d="M 260 220 C 330 210, 460 170, 530 130" fill="none" stroke="#7a3b8f" stroke-width="1.8" marker-end="url(#we-arrow-purple)"/>
  <path d="M 270 232 C 400 240, 600 200, 675 130" fill="none" stroke="#7a3b8f" stroke-width="1.8" marker-end="url(#we-arrow-purple)"/>
  <text x="470" y="35" font-size="9.5" fill="#7a3b8f" text-anchor="middle">PlaceOrderSaga sends a command, each participant replies -- commands/replies omitted for space</text>

  <!-- CQRS view -->
  <rect x="360" y="230" width="390" height="20" fill="none"/>
  <line x1="440" y1="196" x2="440" y2="270" stroke="#a8781f" stroke-width="2" marker-end="url(#we-arrow-grey)"/>

  <rect x="330" y="270" width="230" height="70" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="445" y="292" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">OrderHistoryProjector</text>
  <text x="445" y="310" font-size="9.5" fill="#333333" text-anchor="middle">dedup on eventId, idempotent upsert</text>
  <text x="445" y="326" font-size="9.5" fill="#2d6a34" text-anchor="middle">com.example.order.query</text>

  <line x1="445" y1="340" x2="445" y2="360" stroke="#2d6a34" stroke-width="2" marker-end="url(#we-arrow-green)"/>

  <rect x="330" y="360" width="230" height="56" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="445" y="382" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">OrderHistoryView</text>
  <text x="445" y="400" font-size="9.5" fill="#333333" text-anchor="middle">served by OrderHistoryQueryService</text>

  <!-- Compensation path callout -->
  <path d="M 395 126 C 340 160, 300 190, 265 214" fill="none" stroke="#a8412e" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#we-arrow-blue)"/>
  <text x="330" y="150" font-size="9" fill="#a8412e" text-anchor="middle" transform="rotate(28 330 150)">ReleaseInventoryCommand (compensation)</text>

  <!-- Legend -->
  <rect x="30" y="450" width="18" height="18" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="56" y="463" font-size="10.5" fill="#333333">Order aggregate + application service -- the one aggregate one transaction boundary</text>

  <rect x="30" y="476" width="18" height="18" rx="3" fill="#fdf3e3" stroke="#a8781f" stroke-width="1.6"/>
  <text x="56" y="489" font-size="10.5" fill="#333333">Transactional outbox + broker -- the reliable hand-off out of the local transaction</text>

  <rect x="30" y="502" width="18" height="18" rx="3" fill="#f3edf7" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="56" y="515" font-size="10.5" fill="#333333">PlaceOrderSaga orchestrator -- sequences the four steps, persists SagaState</text>

  <rect x="30" y="528" width="18" height="18" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="56" y="541" font-size="10.5" fill="#333333">Inventory / Shipping participants, and the CQRS read side (OrderHistoryProjector -&gt; OrderHistoryView)</text>

  <rect x="30" y="554" width="18" height="18" rx="3" fill="#fbecea" stroke="#a8412e" stroke-width="1.6"/>
  <text x="56" y="567" font-size="10.5" fill="#333333">Payment -- the pivot step -- and the dashed compensation path a payment failure triggers</text>

  <text x="390" y="600" font-size="10.5" fill="#444444" text-anchor="middle">Every arrow into or out of the Order Service crosses through the outbox or the saga -- never a direct call</text>
  <text x="390" y="616" font-size="10.5" fill="#444444" text-anchor="middle">into another bounded context's database, and never a distributed transaction spanning more than one of them.</text>
</svg>
