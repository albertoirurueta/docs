<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask-Migrate lifecycle</title>
  <defs>
    <marker id="fml-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From a model change to a migrated database</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">Alembic compares, you review, every environment replays the same files</text>

  <rect x="10" y="90" width="130" height="80" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="75" y="118" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Models</text>
  <text x="75" y="138" font-size="10.5" fill="currentColor" text-anchor="middle">db.Model classes</text>
  <text x="75" y="154" font-size="10.5" fill="currentColor" text-anchor="middle">db.metadata</text>

  <line x1="140" y1="130" x2="200" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#fml-arrow)"/>
  <text x="170" y="118" font-size="10.5" fill="currentColor" text-anchor="middle">flask db</text>
  <text x="170" y="150" font-size="10.5" fill="currentColor" text-anchor="middle">migrate</text>

  <rect x="200" y="90" width="150" height="80" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="275" y="118" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Draft revision</text>
  <text x="275" y="138" font-size="10.5" fill="currentColor" text-anchor="middle">versions/0002_add_isbn.py</text>
  <text x="275" y="154" font-size="10.5" fill="currentColor" text-anchor="middle">upgrade() and downgrade()</text>

  <line x1="350" y1="130" x2="420" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#fml-arrow)"/>
  <text x="385" y="118" font-size="10.5" fill="currentColor" text-anchor="middle">review, edit</text>
  <text x="385" y="150" font-size="10.5" fill="currentColor" text-anchor="middle">and commit</text>

  <rect x="420" y="90" width="120" height="80" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="480" y="118" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Repository</text>
  <text x="480" y="138" font-size="10.5" fill="currentColor" text-anchor="middle">history of revisions</text>
  <text x="480" y="154" font-size="10.5" fill="currentColor" text-anchor="middle">next to the code</text>

  <line x1="540" y1="130" x2="590" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#fml-arrow)"/>
  <text x="565" y="118" font-size="10.5" fill="currentColor" text-anchor="middle">flask db</text>
  <text x="565" y="150" font-size="10.5" fill="currentColor" text-anchor="middle">upgrade</text>

  <ellipse cx="650" cy="106" rx="58" ry="14" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <path d="M592,106 L592,150 A58,14 0 0 0 708,150 L708,106" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="650" y="132" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Database</text>
  <text x="650" y="150" font-size="10.5" fill="currentColor" text-anchor="middle">alembic_version</text>

  <path d="M85,170 L85,230 L650,230 L650,166" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fml-arrow)"/>
  <text x="367" y="222" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">flask db check: do the models still match the database?</text>
  <text x="367" y="252" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">exits with status 1 when a model change has no revision (run it in CI)</text>
  <text x="367" y="276" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">downgrade and stamp move the same pointer without comparing anything</text>
</svg>
