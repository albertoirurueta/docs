<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cmpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three ways to describe the same tidepool build</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Model, files and the shape of the work for "compile, test, package"</text>

<text x="48" y="154" font-size="12" font-weight="bold" fill="#555555">MODEL</text>
<text x="48" y="264" font-size="12" font-weight="bold" fill="#555555">FILES</text>
<text x="48" y="430" font-size="12" font-weight="bold" fill="#555555">SHAPE</text>

<!-- column headers -->
<rect x="130" y="64" width="240" height="34" fill="#fff4e0" stroke="#a65e00"/>
<text x="250" y="86" font-size="14" font-weight="bold" fill="#7a4500" text-anchor="middle">Ant 1.10 with Ivy 2.6</text>
<rect x="390" y="64" width="240" height="34" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="510" y="86" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Maven 3.10</text>
<rect x="650" y="64" width="240" height="34" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="770" y="86" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">Gradle 9.8</text>

<!-- model -->
<rect x="130" y="108" width="240" height="84" fill="#fffaf0" stroke="#a65e00"/>
<text x="250" y="132" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">Imperative targets</text>
<text x="250" y="152" font-size="11" fill="#444444" text-anchor="middle">You write the steps and their order;</text>
<text x="250" y="168" font-size="11" fill="#444444" text-anchor="middle">nothing is assumed (no layout,</text>
<text x="250" y="184" font-size="11" fill="#444444" text-anchor="middle">no standard goals)</text>
<rect x="390" y="108" width="240" height="84" fill="#f5f9fd" stroke="#1c4b73"/>
<text x="510" y="132" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Declarative lifecycle</text>
<text x="510" y="152" font-size="11" fill="#444444" text-anchor="middle">You describe the project; fixed phases</text>
<text x="510" y="168" font-size="11" fill="#444444" text-anchor="middle">run plugin goals bound to them by</text>
<text x="510" y="184" font-size="11" fill="#444444" text-anchor="middle">convention</text>
<rect x="650" y="108" width="240" height="84" fill="#f4faf4" stroke="#2e7d32"/>
<text x="770" y="132" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Programmable task graph</text>
<text x="770" y="152" font-size="11" fill="#444444" text-anchor="middle">Plugins register tasks and wire them;</text>
<text x="770" y="168" font-size="11" fill="#444444" text-anchor="middle">Gradle builds the graph, then runs</text>
<text x="770" y="184" font-size="11" fill="#444444" text-anchor="middle">only what is out of date</text>

<!-- files -->
<rect x="130" y="212" width="240" height="96" fill="#fffaf0" stroke="#a65e00"/>
<text x="250" y="236" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">build.xml</text>
<text x="250" y="256" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">ivy.xml</text>
<text x="250" y="276" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">lib/ivy-2.6.0.jar (-lib)</text>
<text x="250" y="296" font-size="11" fill="#666666" text-anchor="middle">XML; no wrapper, no settings file</text>
<rect x="390" y="212" width="240" height="96" fill="#f5f9fd" stroke="#1c4b73"/>
<text x="510" y="236" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">pom.xml (parent)</text>
<text x="510" y="256" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">tidepool-*/pom.xml</text>
<text x="510" y="276" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">.mvn/ (optional)</text>
<text x="510" y="296" font-size="11" fill="#666666" text-anchor="middle">XML; one POM per module</text>
<rect x="650" y="212" width="240" height="96" fill="#f4faf4" stroke="#2e7d32"/>
<text x="770" y="236" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">settings.gradle.kts</text>
<text x="770" y="256" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">build.gradle.kts</text>
<text x="770" y="276" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">gradlew + gradle/wrapper/</text>
<text x="770" y="296" font-size="11" fill="#666666" text-anchor="middle">Kotlin or Groovy code</text>

<!-- shape: ant -->
<rect x="130" y="328" width="240" height="196" fill="#fffaf0" stroke="#a65e00"/>
<g font-size="11" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#222222">
<rect x="165" y="344" width="170" height="26" fill="#ffffff" stroke="#a65e00"/><text x="250" y="361">package</text>
<rect x="165" y="392" width="76" height="26" fill="#ffffff" stroke="#a65e00"/><text x="203" y="409">cli</text>
<rect x="259" y="392" width="76" height="26" fill="#ffffff" stroke="#a65e00"/><text x="297" y="409">test</text>
<rect x="212" y="440" width="76" height="26" fill="#ffffff" stroke="#a65e00"/><text x="250" y="457">engine</text>
<rect x="165" y="488" width="76" height="26" fill="#ffffff" stroke="#a65e00"/><text x="203" y="505">model</text>
<rect x="259" y="488" width="76" height="26" fill="#ffffff" stroke="#a65e00"/><text x="297" y="505">resolve</text>
</g>
<g stroke="#444444" stroke-width="1.4" fill="none" marker-end="url(#cmpArrow)">
<line x1="215" y1="392" x2="235" y2="371"/>
<line x1="285" y1="392" x2="265" y2="371"/>
<line x1="235" y1="440" x2="215" y2="419"/>
<line x1="265" y1="440" x2="285" y2="419"/>
<line x1="225" y1="488" x2="237" y2="467"/>
<line x1="275" y1="488" x2="263" y2="467"/>
</g>
<text x="250" y="338" font-size="10" fill="#666666" text-anchor="middle">depends= links; arrows show the run order</text>

<!-- shape: maven -->
<rect x="390" y="328" width="240" height="196" fill="#f5f9fd" stroke="#1c4b73"/>
<g font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">
<rect x="410" y="344" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="360" text-anchor="middle">validate</text>
<rect x="410" y="372" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="388" text-anchor="middle">compile</text>
<rect x="410" y="400" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="416" text-anchor="middle">test</text>
<rect x="410" y="428" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="444" text-anchor="middle">package</text>
<rect x="410" y="456" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="472" text-anchor="middle">verify</text>
<rect x="410" y="484" width="90" height="24" fill="#ffffff" stroke="#1c4b73"/><text x="455" y="500" text-anchor="middle">install</text>
</g>
<g font-size="10" fill="#444444">
<text x="522" y="388">compiler:compile</text>
<text x="522" y="416">surefire:test</text>
<text x="522" y="444">jar:jar</text>
<text x="522" y="472">(failsafe, checks)</text>
<text x="522" y="500">install:install</text>
</g>
<g stroke="#1c4b73" stroke-width="1">
<line x1="500" y1="384" x2="516" y2="384"/><line x1="500" y1="412" x2="516" y2="412"/><line x1="500" y1="440" x2="516" y2="440"/><line x1="500" y1="468" x2="516" y2="468"/><line x1="500" y1="496" x2="516" y2="496"/>
</g>
<text x="510" y="338" font-size="10" fill="#666666" text-anchor="middle">phases in a fixed order, goals bound to them</text>

<!-- shape: gradle -->
<rect x="650" y="328" width="240" height="196" fill="#f4faf4" stroke="#2e7d32"/>
<g font-size="11" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#222222">
<rect x="665" y="350" width="94" height="26" fill="#ffffff" stroke="#2e7d32"/><text x="712" y="367">compileJava</text>
<rect x="665" y="410" width="94" height="26" fill="#ffffff" stroke="#2e7d32"/><text x="712" y="427">classes</text>
<rect x="665" y="470" width="94" height="26" fill="#ffffff" stroke="#2e7d32"/><text x="712" y="487">jar</text>
<rect x="781" y="410" width="94" height="26" fill="#ffffff" stroke="#2e7d32"/><text x="828" y="427">test</text>
<rect x="781" y="470" width="94" height="26" fill="#ffffff" stroke="#2e7d32"/><text x="828" y="487">check</text>
<rect x="723" y="500" width="94" height="18" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="3 2"/><text x="770" y="513" font-size="10">build</text>
</g>
<g stroke="#444444" stroke-width="1.4" fill="none" marker-end="url(#cmpArrow)">
<line x1="712" y1="376" x2="712" y2="408"/>
<line x1="712" y1="436" x2="712" y2="468"/>
<line x1="759" y1="425" x2="779" y2="425"/>
<line x1="828" y1="436" x2="828" y2="468"/>
<line x1="759" y1="483" x2="779" y2="483"/>
</g>
<text x="770" y="338" font-size="10" fill="#666666" text-anchor="middle">tasks with inputs and outputs, wired as a graph</text>
</svg>
