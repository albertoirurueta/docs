<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Classical U-curve and double descent</title>
  <desc id="d">Two panels plotting error against model capacity. Left: training error falls steadily while validation error falls, reaches a minimum at the sweet spot and rises again as variance dominates. Right: the same curves with a second descent of test error after a peak at the interpolation threshold, where the model has just enough capacity to fit the training set exactly.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Error versus model capacity</text>
  <!-- left panel -->
  <text x="190" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Classical view</text>
  <line x1="50" y1="280" x2="340" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="50" y1="280" x2="50" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M55,110 C110,170 170,230 330,262" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <path d="M55,100 C110,160 150,200 195,205 C240,205 290,160 330,95" fill="none" stroke="#BE123C" stroke-width="3"/>
  <line x1="195" y1="205" x2="195" y2="280" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="195" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F766E">sweet spot</text>
  <text x="70" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569"></text>
  <text x="200" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">model capacity</text>
  <text x="60" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">underfit</text>
  <text x="290" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">overfit</text>
  <text x="30" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-90 30 175)">error</text>
  <text x="300" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C">validation</text>
  <text x="330" y="252" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1D4ED8">training</text>
  <!-- right panel -->
  <text x="540" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Double descent</text>
  <line x1="400" y1="280" x2="690" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="280" x2="400" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M405,110 C440,170 480,230 530,272 C580,276 640,278 680,279" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <path d="M405,100 C440,150 470,170 500,190 C520,165 535,110 545,85 C560,120 590,190 620,200 C650,205 670,205 685,200" fill="none" stroke="#BE123C" stroke-width="3"/>
  <line x1="545" y1="85" x2="545" y2="280" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="545" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B45309">interpolation threshold</text>
  <text x="550" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">model capacity</text>
  <text x="380" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-90 380 175)">error</text>
  <text x="680" y="190" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C">test</text>
  <text x="680" y="268" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1D4ED8">training</text>
</svg>
