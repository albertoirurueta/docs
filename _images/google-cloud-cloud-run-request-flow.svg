<svg viewBox="0 0 900 460" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Cloud Run: service, revisions and instances for catalog-api</text>

  <!-- clients -->
  <rect x="20" y="170" width="110" height="80" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="75" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Clients</text>
  <text x="75" y="224" text-anchor="middle" font-size="10.5" fill="#3c4a58">browser, orders-api,</text>
  <text x="75" y="238" text-anchor="middle" font-size="10.5" fill="#3c4a58">Pub/Sub push</text>

  <line x1="130" y1="210" x2="176" y2="210" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="176,205 186,210 176,215" fill="#3c4a58"/>

  <!-- service box -->
  <rect x="190" y="50" width="690" height="390" rx="12" fill="#eef4fd" stroke="#1a5fb4" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="206" y="74" font-size="13.5" font-weight="700" fill="#123a72">Service catalog-api (region us-central1, one stable run.app URL, one IAM policy)</text>

  <!-- front end -->
  <rect x="206" y="150" width="120" height="120" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="266" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Google Front</text>
  <text x="266" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">End + router</text>
  <text x="266" y="216" text-anchor="middle" font-size="10" fill="#123a72">TLS, invoker IAM</text>
  <text x="266" y="230" text-anchor="middle" font-size="10" fill="#123a72">check, ingress</text>
  <text x="266" y="244" text-anchor="middle" font-size="10" fill="#123a72">setting, split</text>

  <!-- revision A -->
  <line x1="326" y1="190" x2="376" y2="130" stroke="#1a73e8" stroke-width="2"/>
  <text x="338" y="148" font-size="11.5" font-weight="700" fill="#14572f">90%</text>
  <rect x="380" y="92" width="270" height="130" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="394" y="112" font-size="12.5" font-weight="700" fill="#14572f">Revision catalog-api-00007-xyz</text>
  <text x="394" y="127" font-size="10" fill="#14572f">immutable: image digest, env, secrets, CPU, memory</text>
  <rect x="394" y="140" width="72" height="62" rx="5" fill="#d6efdd" stroke="#1e7e45"/>
  <text x="430" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14572f">Instance</text>
  <text x="430" y="177" text-anchor="middle" font-size="9.5" fill="#14572f">up to 80</text>
  <text x="430" y="190" text-anchor="middle" font-size="9.5" fill="#14572f">requests</text>
  <rect x="476" y="140" width="72" height="62" rx="5" fill="#d6efdd" stroke="#1e7e45"/>
  <text x="512" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14572f">Instance</text>
  <text x="512" y="177" text-anchor="middle" font-size="9.5" fill="#14572f">up to 80</text>
  <text x="512" y="190" text-anchor="middle" font-size="9.5" fill="#14572f">requests</text>
  <rect x="558" y="140" width="80" height="62" rx="5" fill="#ffffff" stroke="#1e7e45" stroke-dasharray="4,3"/>
  <text x="598" y="168" text-anchor="middle" font-size="10" fill="#14572f">scales out</text>
  <text x="598" y="182" text-anchor="middle" font-size="10" fill="#14572f">to max-instances</text>

  <!-- revision B -->
  <line x1="326" y1="230" x2="376" y2="290" stroke="#1a73e8" stroke-width="2"/>
  <text x="338" y="282" font-size="11.5" font-weight="700" fill="#7a4800">10%</text>
  <rect x="380" y="248" width="270" height="110" rx="8" fill="#fff8e6" stroke="#b06a00" stroke-width="2"/>
  <text x="394" y="268" font-size="12.5" font-weight="700" fill="#7a4800">Revision catalog-api-00008-abc</text>
  <text x="394" y="283" font-size="10" fill="#7a4800">new image, tag canary, deployed with no traffic first</text>
  <rect x="394" y="296" width="72" height="50" rx="5" fill="#fdecc4" stroke="#b06a00"/>
  <text x="430" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a4800">Instance</text>
  <text x="430" y="333" text-anchor="middle" font-size="9.5" fill="#7a4800">warm</text>

  <!-- backends -->
  <rect x="690" y="100" width="170" height="60" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="775" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Cloud SQL</text>
  <text x="775" y="142" text-anchor="middle" font-size="10" fill="#3c4a58">bookshelf-catalog</text>
  <rect x="690" y="180" width="170" height="60" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="775" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Secret Manager</text>
  <text x="775" y="222" text-anchor="middle" font-size="10" fill="#3c4a58">catalog-db-password</text>
  <rect x="690" y="260" width="170" height="60" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="775" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">VPC / Memorystore</text>
  <text x="775" y="302" text-anchor="middle" font-size="10" fill="#3c4a58">Direct VPC egress</text>
  <line x1="650" y1="170" x2="686" y2="130" stroke="#5c6b7a" stroke-width="1.6"/>
  <line x1="650" y1="185" x2="686" y2="210" stroke="#5c6b7a" stroke-width="1.6"/>
  <line x1="650" y1="200" x2="686" y2="285" stroke="#5c6b7a" stroke-width="1.6"/>

  <!-- footer -->
  <text x="206" y="392" font-size="11" fill="#3c4a58">The service identity (a dedicated service account) is shared by every revision; each instance gets credentials from the metadata server.</text>
  <text x="206" y="412" font-size="11" fill="#3c4a58">Traffic percentages, tags and rollbacks change the router only; no instance is rebuilt (see the scaling and traffic page).</text>
</svg>
