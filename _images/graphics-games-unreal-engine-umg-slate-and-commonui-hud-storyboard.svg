<text x="234.0" y="192" text-anchor="middle" font-size="11" fill="#374151">Designer: drag an</text>
<text x="234.0" y="205" text-anchor="middle" font-size="11" fill="#374151">Overlay, then Text</text>
<text x="234.0" y="218" text-anchor="middle" font-size="11" fill="#374151">Blocks from the</text>
<text x="234.0" y="231" text-anchor="middle" font-size="11" fill="#374151">Palette; anchor</text>
<text x="234.0" y="244" text-anchor="middle" font-size="11" fill="#374151">with the Anchors menu</text>
<rect x="312" y="50" width="136" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="328" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="388.0" y="71" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Name</text>
<rect x="324" y="90" width="112" height="80" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="112" text-anchor="middle" font-size="10" fill="#3730A3">ScoreText</text>
<text x="380.0" y="130" text-anchor="middle" font-size="10" fill="#047857">[x] Is Variable</text>
<text x="380.0" y="150" text-anchor="middle" font-size="10" fill="#3730A3">BookTitleText</text>
<text x="380.0" y="192" text-anchor="middle" font-size="11" fill="#374151">Rename to match</text>
<text x="380.0" y="205" text-anchor="middle" font-size="11" fill="#374151">ScoreText and</text>
<text x="380.0" y="218" text-anchor="middle" font-size="11" fill="#374151">BookTitleText;</text>
<text x="380.0" y="231" text-anchor="middle" font-size="11" fill="#374151">tick Is Variable</text>
<text x="380.0" y="244" text-anchor="middle" font-size="11" fill="#374151">in Details</text>
<rect x="458" y="50" width="136" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="474" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="534.0" y="71" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Compile</text>
<rect x="470" y="90" width="112" height="80" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="480" y="104" width="92" height="24" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="526.0" y="120" text-anchor="middle" font-size="10" fill="#92400E">Compile failed</text>
<rect x="480" y="138" width="92" height="24" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="526.0" y="154" text-anchor="middle" font-size="10" fill="#047857">Compile OK</text>
<text x="526.0" y="192" text-anchor="middle" font-size="11" fill="#374151">Compile: a red</text>
<text x="526.0" y="205" text-anchor="middle" font-size="11" fill="#374151">error here means</text>
<text x="526.0" y="218" text-anchor="middle" font-size="11" fill="#374151">a BindWidget name</text>
<text x="526.0" y="231" text-anchor="middle" font-size="11" fill="#374151">or type is wrong</text>
<text x="526.0" y="244" text-anchor="middle" font-size="11" fill="#374151">in the hierarchy</text>
<rect x="604" y="50" width="136" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="620" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="620" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="680.0" y="71" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Show</text>
<rect x="616" y="90" width="112" height="80" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="624" y="98" width="96" height="64" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="656" y="114" text-anchor="middle" font-size="10" fill="#3730A3">Score 3</text>
<rect x="640" y="138" width="70" height="18" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="675" y="151" text-anchor="middle" font-size="10" fill="#3730A3">The Hobbit</text>
<text x="672.0" y="192" text-anchor="middle" font-size="11" fill="#374151">PlayerController</text>
<text x="672.0" y="205" text-anchor="middle" font-size="11" fill="#374151">pushes the widget</text>
<text x="672.0" y="218" text-anchor="middle" font-size="11" fill="#374151">on the Game stack;</text>
<text x="672.0" y="231" text-anchor="middle" font-size="11" fill="#374151">press Play to see</text>
<text x="672.0" y="244" text-anchor="middle" font-size="11" fill="#374151">the HUD</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="#374151">Procedure and exact menu names are listed in the numbered steps below.</text>
<text x="380" y="312" text-anchor="middle" font-size="12" fill="#374151">Panel 4 is highlighted because a mismatch is caught at compile time, not at run time.</text>
