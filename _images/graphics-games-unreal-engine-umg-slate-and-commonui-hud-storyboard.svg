<text x="88.0" y="231" text-anchor="middle" font-size="11" fill="#374151">pick parent</text>
<text x="88.0" y="244" text-anchor="middle" font-size="11" fill="#374151">UBookshelfHUDWidget</text>
<rect x="166" y="50" width="136" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="182" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="242.0" y="71" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Lay out</text>
<rect x="178" y="90" width="112" height="80" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="188" y="100" width="40" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
