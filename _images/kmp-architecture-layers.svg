<svg viewBox="0 0 760 520" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#5f6368"/></marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">TrailMate Everywhere: Layers and What Is Shared</text>

  <!-- UI row -->
  <text x="30" y="58" font-size="12.5" font-weight="700" fill="#1a3a6b">UI (platform specific, or sharedUI with Compose Multiplatform)</text>
  <rect x="30" y="66" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">androidApp</text>
  <text x="110" y="108" text-anchor="middle" font-size="11.5" fill="#3c4043">Jetpack Compose</text>
  <rect x="205" y="66" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="285" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">iosApp</text>
  <text x="285" y="108" text-anchor="middle" font-size="11.5" fill="#3c4043">SwiftUI</text>
  <rect x="380" y="66" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="460" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">desktopApp</text>
  <text x="460" y="108" text-anchor="middle" font-size="11.5" fill="#3c4043">Compose for Desktop</text>
  <rect x="555" y="66" width="175" height="56" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="642" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">sharedUI / webApp</text>
  <text x="642" y="108" text-anchor="middle" font-size="11.5" fill="#3c4043">CMP screens, wasmJs (Beta)</text>

  <!-- arrows down -->
  <line x1="380" y1="124" x2="380" y2="146" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="392" y="140" font-size="11" fill="#3c4043">observe StateFlow, call methods</text>

  <!-- sharedLogic frame -->
  <rect x="30" y="152" width="700" height="296" rx="12" fill="#f4f8fe" stroke="#4285f4" stroke-width="2"/>
  <text x="380" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a6b">sharedLogic (Kotlin, commonMain)</text>

  <rect x="50" y="190" width="660" height="68" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="380" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Presentation</text>
  <text x="380" y="231" text-anchor="middle" font-size="12" fill="#3c4043">TrailListViewModel : ViewModel  -  StateFlow of TrailListUiState (sealed interface)</text>
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#3c4043">viewModelScope, SavedStateHandle, one-shot events</text>

  <line x1="380" y1="260" x2="380" y2="276" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="50" y="278" width="660" height="56" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="380" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Domain</text>
  <text x="380" y="319" text-anchor="middle" font-size="12" fill="#3c4043">Trail, Difficulty, TrailRepository (interface), use cases, TrailError</text>

  <line x1="380" y1="336" x2="380" y2="352" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="50" y="354" width="660" height="82" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="380" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Data</text>
  <text x="380" y="395" text-anchor="middle" font-size="12" fill="#3c4043">OfflineFirstTrailRepository (single source of truth: the database)</text>
  <rect x="80" y="404" width="270" height="26" rx="5" fill="#ffffff" stroke="#4285f4"/>
  <text x="215" y="422" text-anchor="middle" font-size="11.5" fill="#1a1a1a">TrailApiClient (Ktor) + TrailDto</text>
  <rect x="410" y="404" width="270" height="26" rx="5" fill="#ffffff" stroke="#4285f4"/>
  <text x="545" y="422" text-anchor="middle" font-size="11.5" fill="#1a1a1a">TrailMateDatabase (SQLDelight)</text>

  <!-- boundary -->
  <line x1="30" y1="462" x2="730" y2="462" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="482" text-anchor="middle" font-size="12" font-weight="600" fill="#a50e0e">The arrow into sharedLogic is the Swift boundary: Objective-C framework (SKIE) or Swift export (Alpha)</text>
  <text x="380" y="502" text-anchor="middle" font-size="11.5" fill="#3c4043">Only domain models, UiState and ViewModels cross it; DTOs and database rows stay inside.</text>
</svg>
