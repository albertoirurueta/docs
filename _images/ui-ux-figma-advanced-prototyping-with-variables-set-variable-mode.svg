<svg viewBox="0 0 740 300" width="740" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="300" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Set variable mode switches a collection's mode for the page</text>
<rect x="20" y="48" width="200" height="220" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Theme page, Light</text>
<rect x="36" y="86" width="168" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="120" y="110" text-anchor="middle" font-size="12" fill="#3730A3">Mode: Auto</text>
<rect x="36" y="136" width="168" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="120" y="160" text-anchor="middle" font-size="12" fill="#3730A3">Mode: Auto</text>
<rect x="36" y="186" width="168" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="120" y="210" text-anchor="middle" font-size="12" fill="#92400E">Mode: set explicitly</text><text x="120" y="228" text-anchor="middle" font-size="12" fill="#92400E">to Light</text>
<line x1="230" y1="158" x2="290" y2="158" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="232" y="112" width="56" height="34" rx="6" fill="#FFFFFF"/><text x="260" y="126" text-anchor="middle" font-size="11" fill="#374151">On tap:</text><text x="260" y="140" text-anchor="middle" font-size="11" fill="#374151">Dark</text>
<rect x="300" y="48" width="200" height="220" rx="12" fill="#1F2937" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Theme page, Dark</text>
<rect x="316" y="86" width="168" height="40" rx="8" fill="#374151" stroke="#A5B4FC"/><text x="400" y="110" text-anchor="middle" font-size="12" fill="#FFFFFF">Auto: follows Dark</text>
<rect x="316" y="136" width="168" height="40" rx="8" fill="#374151" stroke="#A5B4FC"/><text x="400" y="160" text-anchor="middle" font-size="12" fill="#FFFFFF">Auto: follows Dark</text>
<rect x="316" y="186" width="168" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="400" y="210" text-anchor="middle" font-size="12" fill="#92400E">Explicit Light is kept</text><text x="400" y="228" text-anchor="middle" font-size="12" fill="#92400E">with its children</text>
<g font-size="12" fill="#374151"><text x="520" y="86" font-weight="bold" font-size="13">Setup in the Interaction panel</text><text x="520" y="110">1  Action: Set variable mode</text><text x="520" y="130">2  First list: the collection</text><text x="520" y="150">3  Second list: the mode</text><text x="520" y="180">Only objects set to Auto change;</text><text x="520" y="198">explicit modes win, also for</text><text x="520" y="216">their nested children.</text></g>
</svg>
