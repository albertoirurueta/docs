<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two containers sharing one image</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Two containers sharing one image</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">read-only image layers are shared; each container adds its own thin writable layer (copy-on-write)</text>
  <rect x="60" y="70" width="250" height="60" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="185.0" y="96.2" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">Container "api-1"</text>
  <text x="185.0" y="111.8" font-size="9.5" fill="#333333" text-anchor="middle">writable layer: logs, temp files</text>
  <rect x="450" y="70" width="250" height="60" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="575.0" y="96.2" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">Container "api-2"</text>
  <text x="575.0" y="111.8" font-size="9.5" fill="#333333" text-anchor="middle">writable layer: its own changes</text>
  <rect x="160" y="170" width="440" height="42" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="187.0" font-size="9.5" fill="#333333" text-anchor="middle">COPY app.jar  (application layer)</text>
  <text x="380.0" y="200.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">sha256:9f2c...</text>
  <rect x="160" y="218" width="440" height="42" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="235.0" font-size="9.5" fill="#333333" text-anchor="middle">RUN apt-get install ... (tools)</text>
  <text x="380.0" y="248.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">sha256:41ab...</text>
  <rect x="160" y="266" width="440" height="42" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="283.0" font-size="9.5" fill="#333333" text-anchor="middle">eclipse-temurin:25-jre  (JRE)</text>
  <text x="380.0" y="296.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">sha256:7d10...</text>
  <rect x="160" y="314" width="440" height="42" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="331.0" font-size="9.5" fill="#333333" text-anchor="middle">ubuntu noble  (base OS userland)</text>
  <text x="380.0" y="344.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">sha256:c3e8...</text>
  <text x="380" y="375" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">image  myorg/api:1.4.0  =  config + ordered read-only layers (content-addressed)</text>
  <line x1="185" y1="130" x2="260" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="222.5" y="145.0" font-size="9.5" fill="#555555" text-anchor="middle">reads through</text>
  <line x1="575" y1="130" x2="500" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="537.5" y="145.0" font-size="9.5" fill="#555555" text-anchor="middle">reads through</text>
  <text x="380" y="400" font-size="9.5" fill="#555555" text-anchor="middle">A write to a file from a lower layer copies it up into the writable layer first; deleting the container discards that layer.</text>
</svg>
