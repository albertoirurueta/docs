<circle cx="643.0" cy="66" r="11" fill="#4F46E5"/>
<text x="643.0" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="683.5" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Draw</text>
<rect x="635.0" y="116" width="97" height="70" rx="6" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<text x="683.5" y="140" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">every program</text>
<text x="683.5" y="156" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">sees the same</text>
<text x="683.5" y="172" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">Camera block</text>
<text x="20" y="248" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">The same buffer serves every program that declares a Camera block with binding 0; no per-program uniform calls are needed.</text>
