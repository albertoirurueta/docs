<text x="319.3" y="140" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glCreateBuffers</text>
<text x="319.3" y="156" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glNamedBuffer-</text>
<text x="319.3" y="172" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">Storage</text>
<line x1="375.8" y1="148" x2="384.2" y2="148" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-ub)"/>
