<text x="562.1" y="140" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glNamedBuffer-</text>
<text x="562.1" y="156" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">SubData once</text>
<text x="562.1" y="172" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">per frame</text>
