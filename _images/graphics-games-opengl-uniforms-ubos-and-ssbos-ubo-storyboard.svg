<text x="76.5" y="156" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">binding = 0)</text>
<text x="76.5" y="172" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">uniform Camera</text>
