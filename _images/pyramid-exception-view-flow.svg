<svg viewBox="0 0 720 522" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How Pyramid turns an exception into a response</title>
  <defs><marker id="pev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From exception to response</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the excview tween, with the exception views registered by Pyramid and by your code</text>
<rect x="30" y="70" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="89" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Something raises</text>
  <text x="200.0" y="106" font-size="10.5" fill="currentColor" text-anchor="middle">a view, a predicate, a root factory, a traverser or Pyramid itself</text>
  <line x1="200.0" y1="116" x2="200.0" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <rect x="30" y="132" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="151" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Exception propagates to the excview tween</text>
  <text x="200.0" y="168" font-size="10.5" fill="currentColor" text-anchor="middle">the tween sits between the router and the main handler</text>
  <line x1="200.0" y1="178" x2="200.0" y2="194" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <rect x="30" y="194" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="213" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Look up an exception view</text>
  <text x="200.0" y="230" font-size="10.5" fill="currentColor" text-anchor="middle">most specific class in the exception MRO, then view predicates</text>
  <line x1="200.0" y1="240" x2="200.0" y2="256" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <rect x="30" y="256" width="340" height="46" rx="23" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200.0" y="284" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">An exception view matches?</text>
  <line x1="200.0" y1="302" x2="200.0" y2="328" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <text x="210.0" y="319" font-size="11" font-weight="bold" fill="currentColor" text-anchor="start">yes</text>
  <rect x="30" y="328" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="347" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Exception view runs</text>
  <text x="200.0" y="364" font-size="10.5" fill="currentColor" text-anchor="middle">request.exception and request.exc_info are set; it picks its own status</text>
  <line x1="200.0" y1="374" x2="200.0" y2="390" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <rect x="30" y="390" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="409" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response travels back out through the tweens</text>
  <text x="200.0" y="426" font-size="10.5" fill="currentColor" text-anchor="middle">pyramid_tm sees exc_info and aborts the transaction</text>
  <line x1="200.0" y1="436" x2="200.0" y2="452" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <rect x="30" y="452" width="340" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="200.0" y="471" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">The client receives the error response</text>
  <text x="200.0" y="488" font-size="10.5" fill="currentColor" text-anchor="middle">status, headers and body chosen by the exception view</text>
  <line x1="370" y1="279" x2="410" y2="279" stroke="currentColor" stroke-width="1.5" marker-end="url(#pev-arrow)"/>
  <text x="390.0" y="271" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">no</text>
  <rect x="410" y="250" width="280" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="550.0" y="269" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Exception is re-raised</text>
  <text x="550.0" y="286" font-size="10.5" fill="currentColor" text-anchor="middle">pyramid_tm aborts and the WSGI server answers 500;</text>
  <text x="550.0" y="296" font-size="10.5" fill="currentColor" text-anchor="middle">a debug toolbar may show the traceback instead</text>
  <rect x="410" y="70" width="280" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="420" y="87" font-size="12" font-weight="bold" fill="currentColor">Built in for you</text>
  <text x="420" y="102" font-size="10.5" fill="currentColor">HTTPException: raised or returned,</text>
  <text x="420" y="115" font-size="10.5" fill="currentColor">becomes the response (default view)</text>
  <rect x="410" y="130" width="280" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="420" y="147" font-size="12" font-weight="bold" fill="currentColor">Not Found View</text>
  <text x="420" y="162" font-size="10.5" fill="currentColor">HTTPNotFound: no route, view or</text>
  <text x="420" y="175" font-size="10.5" fill="currentColor">predicate match; also raised by code</text>
  <rect x="410" y="190" width="280" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="420" y="207" font-size="12" font-weight="bold" fill="currentColor">Forbidden View</text>
  <text x="420" y="222" font-size="10.5" fill="currentColor">HTTPForbidden: a permission check</text>
  <text x="420" y="235" font-size="10.5" fill="currentColor">failed or the view raised it</text>
  <rect x="410" y="338" width="280" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="420" y="355" font-size="12" font-weight="bold" fill="currentColor">Your own views</text>
  <text x="420" y="370" font-size="10.5" fill="currentColor">add_exception_view(context=...) for any</text>
  <text x="420" y="383" font-size="10.5" fill="currentColor">exception class, e.g. a domain error</text>
</svg>
