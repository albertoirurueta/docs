<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From source to Hermes bytecode on-device</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Places's TypeScript source, compiled ahead of time, ready to run without on-device parsing</text>

  <defs>
    <marker id="mth-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Source -->
  <rect x="20" y="90" width="150" height="90" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="95" y="118" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">src/ (TypeScript)</text>
  <text x="95" y="138" font-size="10" fill="#333333" text-anchor="middle">Places's</text>
  <text x="95" y="152" font-size="10" fill="#333333" text-anchor="middle">source tree</text>

  <line x1="170" y1="135" x2="200" y2="135" stroke="#333333" stroke-width="1.4" marker-end="url(#mth-arrow)"/>

  <!-- Babel + Metro -->
  <rect x="205" y="90" width="150" height="90" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="280" y="115" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Babel + Metro</text>
  <text x="280" y="135" font-size="10" fill="#333333" text-anchor="middle">@react-native/babel-preset</text>
  <text x="280" y="150" font-size="10" fill="#333333" text-anchor="middle">transforms, then bundles</text>
  <text x="280" y="165" font-size="10" fill="#333333" text-anchor="middle">into one JS bundle</text>

  <line x1="355" y1="135" x2="385" y2="135" stroke="#333333" stroke-width="1.4" marker-end="url(#mth-arrow)"/>

  <!-- Hermes compiler -->
  <rect x="390" y="90" width="170" height="90" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="475" y="115" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Hermes compiler</text>
  <text x="475" y="135" font-size="10" fill="#333333" text-anchor="middle">ahead-of-time compile</text>
  <text x="475" y="150" font-size="10" fill="#333333" text-anchor="middle">to Hermes bytecode</text>
  <text x="475" y="165" font-size="10" fill="#333333" text-anchor="middle">(.hbc), at build time</text>

  <line x1="560" y1="135" x2="590" y2="135" stroke="#333333" stroke-width="1.4" marker-end="url(#mth-arrow)"/>

  <!-- Device -->
  <rect x="595" y="90" width="150" height="90" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="670" y="115" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">Device</text>
  <text x="670" y="135" font-size="10" fill="#333333" text-anchor="middle">Hermes VM loads</text>
  <text x="670" y="150" font-size="10" fill="#333333" text-anchor="middle">and runs bytecode</text>
  <text x="670" y="165" font-size="10" fill="#333333" text-anchor="middle">directly, no parsing</text>

  <text x="380" y="230" font-size="10.5" fill="#666666" text-anchor="middle">Compiling to bytecode ahead of time means the device never parses Places's source JavaScript at startup.</text>
</svg>
