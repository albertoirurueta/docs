<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>

  <text x="390" y="24" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which feedback pattern fits the scenario?</text>

  <!-- Table grid: 2 columns x (1 header + 8 rows) -->
  <!-- Column boundaries: 30-450-750 -->
  <!-- Row boundaries: header 42-74, rows 74,108,142,176,210,244,278,312,346 -->

  <rect x="30" y="42" width="720" height="304" fill="none" stroke="#999999" stroke-width="1.2"/>

  <!-- Header -->
  <rect x="30" y="42" width="720" height="32" fill="#1c4b73"/>
  <text x="240" y="63" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Scenario</text>
  <text x="600" y="63" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Pattern</text>

  <!-- Row background stripes -->
  <rect x="30" y="74" width="720" height="34" fill="#ffffff"/>
  <rect x="30" y="108" width="720" height="34" fill="#f6f6f6"/>
  <rect x="30" y="142" width="720" height="34" fill="#ffffff"/>
  <rect x="30" y="176" width="720" height="34" fill="#f6f6f6"/>
  <rect x="30" y="210" width="720" height="34" fill="#ffffff"/>
  <rect x="30" y="244" width="720" height="34" fill="#f6f6f6"/>
  <rect x="30" y="278" width="720" height="34" fill="#ffffff"/>
  <rect x="30" y="312" width="720" height="34" fill="#f6f6f6"/>

  <!-- Column separator -->
  <line x1="450" y1="42" x2="450" y2="346" stroke="#cccccc" stroke-width="1"/>

  <!-- Row separators -->
  <line x1="30" y1="108" x2="750" y2="108" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="142" x2="750" y2="142" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="176" x2="750" y2="176" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="210" x2="750" y2="210" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="244" x2="750" y2="244" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="278" x2="750" y2="278" stroke="#dddddd" stroke-width="1"/>
  <line x1="30" y1="312" x2="750" y2="312" stroke="#dddddd" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="45" y="95" font-size="10" fill="#333333" text-anchor="start">Needs a yes/no decision before continuing</text>
  <rect x="465" y="80" width="170" height="22" rx="4" fill="#c62828"/>
  <text x="550" y="95" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Alert</text>

  <!-- Row 2 -->
  <text x="45" y="129" font-size="10" fill="#333333" text-anchor="start">Blocks the whole screen, dismissible</text>
  <rect x="465" y="114" width="170" height="22" rx="4" fill="#1c4b73"/>
  <text x="550" y="129" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Modal</text>

  <!-- Row 3 -->
  <text x="45" y="163" font-size="10" fill="#333333" text-anchor="start">Anchored to an edge, draggable, partially visible</text>
  <rect x="465" y="148" width="170" height="22" rx="4" fill="#2f6fed"/>
  <text x="550" y="163" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Bottom sheet</text>

  <!-- Row 4 -->
  <text x="45" y="197" font-size="10" fill="#333333" text-anchor="start">Passive, brief, doesn't block interaction</text>
  <rect x="465" y="182" width="170" height="22" rx="4" fill="#2e7d32"/>
  <text x="550" y="197" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Toast / banner</text>

  <!-- Row 5 -->
  <text x="45" y="231" font-size="10" fill="#333333" text-anchor="start">Unknown duration, lightweight</text>
  <rect x="465" y="216" width="170" height="22" rx="4" fill="#6a1b9a"/>
  <text x="550" y="231" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ActivityIndicator</text>

  <!-- Row 6 -->
  <text x="45" y="265" font-size="10" fill="#333333" text-anchor="start">Known duration or completion fraction</text>
  <rect x="465" y="250" width="170" height="22" rx="4" fill="#00796b"/>
  <text x="550" y="265" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Progress bar (determinate)</text>

  <!-- Row 7 -->
  <text x="45" y="299" font-size="10" fill="#333333" text-anchor="start">Fixed set of named steps</text>
  <rect x="465" y="284" width="170" height="22" rx="4" fill="#00838f"/>
  <text x="550" y="299" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Step progress</text>

  <!-- Row 8 -->
  <text x="45" y="333" font-size="10" fill="#333333" text-anchor="start">iOS-only quick list of actions</text>
  <rect x="465" y="318" width="170" height="22" rx="4" fill="#455a64"/>
  <text x="550" y="333" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ActionSheetIOS</text>

  <text x="390" y="368" font-size="10" fill="#666666" text-anchor="middle">One row per scenario -- see the page text for each pattern's API and the Places example that uses it.</text>
</svg>
