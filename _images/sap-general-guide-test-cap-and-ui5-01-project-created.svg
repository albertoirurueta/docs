<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-general-guide-test-cap-and-ui5-01-project-created-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-test-cap-and-ui5-01-project-created-title">Terminal: cds init claims-tested with the option nodejs prints Successfully initialized CAP project, then cd claims-tested and npm install end in found 0 vulnerabilities, then npm install with the option save-dev adds the package @cap-js/cds-test and ends in found 0 vulnerabilities; callout 1 marks the cds init command and callout 2 marks the command that installs cds-test</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cds init claims-tested --nodejs</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Adding facet: nodejs</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Successfully initialized CAP project</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Continue with: code claims-tested</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cd claims-tested &amp;&amp; npm install</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">found 0 vulnerabilities</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm install --save-dev @cap-js/cds-test</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">found 0 vulnerabilities</text>
