<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Style-prop families and which Core Components accept them</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Every Core Component accepts a style prop shaped by one or more of these families</text>

  <!-- Column headers -->
  <rect x="20" y="64" width="170" height="50" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="105" y="94" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Core Component</text>

  <rect x="200" y="64" width="135" height="50" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="267" y="86" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Layout /</text>
  <text x="267" y="100" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Flexbox props</text>

  <rect x="345" y="64" width="135" height="50" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="412" y="86" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Shadow /</text>
  <text x="412" y="100" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Border props</text>

  <rect x="490" y="64" width="135" height="50" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="557" y="86" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Text style</text>
  <text x="557" y="100" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">props</text>

  <rect x="635" y="64" width="125" height="50" rx="8" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="697" y="86" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Image style</text>
  <text x="697" y="100" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">props</text>

  <!-- Row: View -->
  <rect x="20" y="122" width="170" height="42" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="105" y="147" font-size="12" fill="#222222" text-anchor="middle">View</text>

  <rect x="200" y="122" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfd9e2" stroke-width="1.2"/>
  <text x="267" y="149" font-size="14" fill="#1c4b73" text-anchor="middle">✓</text>
  <rect x="345" y="122" width="135" height="42" rx="6" fill="#ffffff" stroke="#e6d9c2" stroke-width="1.2"/>
  <text x="412" y="149" font-size="14" fill="#8a5a1c" text-anchor="middle">✓</text>
  <rect x="490" y="122" width="135" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="557" y="149" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>
  <rect x="635" y="122" width="125" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="697" y="149" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>

  <!-- Row: Text -->
  <rect x="20" y="170" width="170" height="42" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="105" y="195" font-size="12" fill="#222222" text-anchor="middle">Text</text>

  <rect x="200" y="170" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfd9e2" stroke-width="1.2"/>
  <text x="267" y="197" font-size="14" fill="#1c4b73" text-anchor="middle">✓</text>
  <rect x="345" y="170" width="135" height="42" rx="6" fill="#ffffff" stroke="#e6d9c2" stroke-width="1.2"/>
  <text x="412" y="197" font-size="14" fill="#8a5a1c" text-anchor="middle">✓</text>
  <rect x="490" y="170" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfe4d2" stroke-width="1.2"/>
  <text x="557" y="197" font-size="14" fill="#2d6a34" text-anchor="middle">✓</text>
  <rect x="635" y="170" width="125" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="697" y="197" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>

  <!-- Row: Image -->
  <rect x="20" y="218" width="170" height="42" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="105" y="243" font-size="12" fill="#222222" text-anchor="middle">Image</text>

  <rect x="200" y="218" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfd9e2" stroke-width="1.2"/>
  <text x="267" y="245" font-size="14" fill="#1c4b73" text-anchor="middle">✓</text>
  <rect x="345" y="218" width="135" height="42" rx="6" fill="#ffffff" stroke="#e6d9c2" stroke-width="1.2"/>
  <text x="412" y="245" font-size="14" fill="#8a5a1c" text-anchor="middle">✓</text>
  <rect x="490" y="218" width="135" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="557" y="245" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>
  <rect x="635" y="218" width="125" height="42" rx="6" fill="#ffffff" stroke="#f0c9c9" stroke-width="1.2"/>
  <text x="697" y="245" font-size="14" fill="#a33333" text-anchor="middle">✓</text>

  <!-- Row: Pressable / TouchableOpacity -->
  <rect x="20" y="266" width="170" height="42" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="105" y="287" font-size="11" fill="#222222" text-anchor="middle">Pressable /</text>
  <text x="105" y="301" font-size="11" fill="#222222" text-anchor="middle">TouchableOpacity</text>

  <rect x="200" y="266" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfd9e2" stroke-width="1.2"/>
  <text x="267" y="293" font-size="14" fill="#1c4b73" text-anchor="middle">✓</text>
  <rect x="345" y="266" width="135" height="42" rx="6" fill="#ffffff" stroke="#e6d9c2" stroke-width="1.2"/>
  <text x="412" y="293" font-size="14" fill="#8a5a1c" text-anchor="middle">✓</text>
  <rect x="490" y="266" width="135" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="557" y="293" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>
  <rect x="635" y="266" width="125" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="697" y="293" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>

  <!-- Row: ScrollView -->
  <rect x="20" y="314" width="170" height="42" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="105" y="339" font-size="12" fill="#222222" text-anchor="middle">ScrollView</text>

  <rect x="200" y="314" width="135" height="42" rx="6" fill="#ffffff" stroke="#cfd9e2" stroke-width="1.2"/>
  <text x="267" y="341" font-size="14" fill="#1c4b73" text-anchor="middle">✓</text>
  <rect x="345" y="314" width="135" height="42" rx="6" fill="#ffffff" stroke="#e6d9c2" stroke-width="1.2"/>
  <text x="412" y="341" font-size="14" fill="#8a5a1c" text-anchor="middle">✓</text>
  <rect x="490" y="314" width="135" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="557" y="341" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>
  <rect x="635" y="314" width="125" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.2"/>
  <text x="697" y="341" font-size="13" fill="#aaaaaa" text-anchor="middle">—</text>

  <text x="390" y="380" font-size="10" fill="#666666" text-anchor="middle">Text also renders its own native view, so it accepts Layout/Flexbox and Shadow/Border props in addition to Text style props;</text>
  <text x="390" y="393" font-size="10" fill="#666666" text-anchor="middle">Image adds resizeMode/tintColor from its own family on top of the two it shares with every other Core Component.</text>
</svg>
