<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">OpenTofu layout for the Lumen Press EKS environment</title>
  <desc id="d">One OpenTofu root module with one state per workspace, staging and production, stored in an S3 state bucket with native locking. Inside the VPC, spread over three Availability Zones, are public subnets with the load balancer created by the cluster, private subnets with the EKS Auto Mode cluster and the EFS mount targets, database subnets with the RDS MariaDB instance, and ElastiCache subnets with the Valkey replication group. Outside the VPC are the S3 media bucket behind a CloudFront distribution with a CloudFront web ACL, a regional WAF web ACL for the load balancer, the ECR repository, Secrets Manager secrets, a KMS key, ACM certificates and Route 53 records. Each box names the OpenTofu file that declares it.</desc>
  <rect width="760" height="600" rx="12" fill="#2b3a4a"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#f2f5f8">One root module, one state per workspace</text>

  <!-- State backend -->
  <rect x="20" y="46" width="720" height="50" rx="9" fill="#3d5266"/>
  <text x="32" y="67" font-size="12.5" font-weight="bold" fill="#f4b860">State backend (versions.tf)</text>
  <text x="32" y="86" font-size="12" fill="#f2f5f8">S3 bucket with versioning, encryption and use_lockfile; workspaces staging and production keep separate state files</text>

  <!-- VPC -->
  <rect x="20" y="112" width="470" height="404" rx="10" fill="none" stroke="#9fd3c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="32" y="132" font-size="12.5" font-weight="bold" fill="#9fd3c7">VPC, three Availability Zones (vpc.tf)</text>

  <rect x="34" y="144" width="442" height="56" rx="8" fill="#7a5c3a"/>
  <text x="46" y="164" font-size="12.5" font-weight="bold" fill="#f2f5f8">Public subnets</text>
  <text x="46" y="184" font-size="12" fill="#f2f5f8">ALB created by EKS Auto Mode, NAT gateways</text>

  <rect x="34" y="212" width="442" height="106" rx="8" fill="#3f6e9a"/>
  <text x="46" y="232" font-size="12.5" font-weight="bold" fill="#f2f5f8">Private subnets</text>
  <rect x="46" y="244" width="210" height="62" rx="8" fill="#33485c"/>
  <text x="56" y="264" font-size="12" font-weight="bold" fill="#f2f5f8">EKS Auto Mode cluster</text>
  <text x="56" y="282" font-size="12" fill="#f2f5f8">eks.tf, lumenpress-prod</text>
  <text x="56" y="298" font-size="12" fill="#f2f5f8">Pod Identity roles</text>
  <rect x="266" y="244" width="200" height="62" rx="8" fill="#4d7c5a"/>
  <text x="276" y="264" font-size="12" font-weight="bold" fill="#f2f5f8">EFS mount targets</text>
  <text x="276" y="282" font-size="12" fill="#f2f5f8">efs.tf, access point</text>
  <text x="276" y="298" font-size="12" fill="#f2f5f8">UID and GID 33</text>

  <rect x="34" y="330" width="442" height="80" rx="8" fill="#34495e"/>
  <text x="46" y="350" font-size="12.5" font-weight="bold" fill="#f2f5f8">Database subnets</text>
  <text x="46" y="370" font-size="12" fill="#f2f5f8">RDS MariaDB 11.8, Multi-AZ in production (rds.tf)</text>
  <text x="46" y="390" font-size="12" fill="#f2f5f8">Security group: port 3306 from the cluster only</text>

  <rect x="34" y="422" width="442" height="80" rx="8" fill="#2f4a44"/>
  <text x="46" y="442" font-size="12.5" font-weight="bold" fill="#f2f5f8">ElastiCache subnets</text>
  <text x="46" y="462" font-size="12" fill="#f2f5f8">Valkey replication group with TLS and AUTH (elasticache.tf)</text>
  <text x="46" y="482" font-size="12" fill="#f2f5f8">Security group: port 6379 from the cluster only</text>

  <!-- Outside the VPC -->
  <rect x="510" y="112" width="230" height="86" rx="9" fill="#4d7c5a"/>
  <text x="522" y="133" font-size="12.5" font-weight="bold" fill="#f2f5f8">S3 + CloudFront (media.tf)</text>
  <text x="522" y="153" font-size="12" fill="#f2f5f8">Private bucket, origin access</text>
  <text x="522" y="170" font-size="12" fill="#f2f5f8">control, media.lumenpress.example</text>
  <text x="522" y="187" font-size="12" fill="#f2f5f8">CloudFront web ACL (us-east-1)</text>

  <rect x="510" y="210" width="230" height="62" rx="9" fill="#7a5c3a"/>
  <text x="522" y="231" font-size="12.5" font-weight="bold" fill="#f2f5f8">WAF and ACM (waf.tf, acm.tf)</text>
  <text x="522" y="251" font-size="12" fill="#f2f5f8">Regional ACL for the ALB,</text>
  <text x="522" y="266" font-size="12" fill="#f2f5f8">certificates, Route 53 validation</text>

  <rect x="510" y="284" width="230" height="62" rx="9" fill="#3f6e9a"/>
  <text x="522" y="305" font-size="12.5" font-weight="bold" fill="#f2f5f8">ECR (ecr.tf)</text>
  <text x="522" y="325" font-size="12" fill="#f2f5f8">lumenpress/wordpress, immutable</text>
  <text x="522" y="340" font-size="12" fill="#f2f5f8">tags, GitHub OIDC push role</text>

  <rect x="510" y="358" width="230" height="74" rx="9" fill="#6f8aa3"/>
  <text x="522" y="379" font-size="12.5" font-weight="bold" fill="#1b2733">Secrets Manager (secrets.tf)</text>
  <text x="522" y="399" font-size="12" fill="#1b2733">lumenpress/prod/wordpress</text>
  <text x="522" y="415" font-size="12" fill="#1b2733">lumenpress/prod/valkey</text>

  <rect x="510" y="444" width="230" height="58" rx="9" fill="#c9b3e6"/>
  <text x="522" y="465" font-size="12.5" font-weight="bold" fill="#1b2733">KMS key (kms.tf)</text>
  <text x="522" y="485" font-size="12" fill="#1b2733">RDS, EFS, ElastiCache, secrets</text>


  <text x="20" y="545" font-size="12" fill="#f2f5f8">Outputs (outputs.tf) feed the Helm values: db_endpoint, efs_file_system_id, efs_access_point_id,</text>
  <text x="20" y="563" font-size="12" fill="#f2f5f8">site_certificate_arn, waf_acl_arn, ecr_repository_url. Pods reach AWS APIs through Pod Identity roles, not keys.</text>
  <text x="20" y="585" font-size="12" fill="#9fd3c7">Workspaces: staging (lumenpress-staging) and production (lumenpress-prod) from the same code.</text>
</svg>
