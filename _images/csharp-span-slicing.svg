<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A Span is a reference to the first element plus a length. One span views a stackalloc'd buffer in the stack frame and another views an array on the managed heap; slicing either produces a new span whose reference points further into the very same memory and whose length is shorter, so no elements are copied and a write through the slice is visible through the original span.</title>
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>

  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Span&lt;T&gt;: a reference and a length -- slicing copies neither</text>
  <text x="430" y="45" font-size="11" fill="#666666" text-anchor="middle">the same span type views stack memory and heap memory; a slice is just a different reference and a shorter length</text>

  <!-- stack side -->
  <rect x="24" y="68" width="392" height="164" rx="8" fill="#f7f9fc" stroke="#8fa4bd" stroke-width="1.3"/>
  <text x="220" y="88" font-size="12.5" font-weight="bold" fill="#31465e" text-anchor="middle">Stack frame&#160;&#160;&#160;Span&lt;int&gt; s = stackalloc int[6];</text>

  <rect x="52" y="102" width="56" height="38" rx="3" fill="#eaf3fb" stroke="#3d6fa5" stroke-width="1.3"/>
  <rect x="108" y="102" width="56" height="38" rx="3" fill="#eaf3fb" stroke="#3d6fa5" stroke-width="1.3"/>
  <rect x="164" y="102" width="56" height="38" rx="3" fill="#dcecfa" stroke="#3d6fa5" stroke-width="1.3"/>
  <rect x="220" y="102" width="56" height="38" rx="3" fill="#dcecfa" stroke="#3d6fa5" stroke-width="1.3"/>
  <rect x="276" y="102" width="56" height="38" rx="3" fill="#dcecfa" stroke="#3d6fa5" stroke-width="1.3"/>
  <rect x="332" y="102" width="56" height="38" rx="3" fill="#eaf3fb" stroke="#3d6fa5" stroke-width="1.3"/>
  <text x="80" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">10</text>
  <text x="136" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">20</text>
  <text x="192" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">30</text>
  <text x="248" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">40</text>
  <text x="304" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">50</text>
  <text x="360" y="126" font-size="11.5" fill="#1f3b5c" text-anchor="middle">60</text>
  <text x="80" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[0]</text>
  <text x="136" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[1]</text>
  <text x="192" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[2]</text>
  <text x="248" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[3]</text>
  <text x="304" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[4]</text>
  <text x="360" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[5]</text>

  <!-- full span bracket -->
  <path d="M 52 170 L 52 178 L 388 178 L 388 170" stroke="#3d6fa5" stroke-width="1.6" fill="none"/>
  <text x="220" y="194" font-size="11" fill="#1f3b5c" text-anchor="middle">s&#160;&#160;ref -&gt; [0],&#160;length 6</text>
  <!-- slice bracket -->
  <path d="M 164 206 L 164 214 L 332 214 L 332 206" stroke="#b5432a" stroke-width="1.8" fill="none"/>
  <text x="248" y="228" font-size="11" font-weight="bold" fill="#b5432a" text-anchor="middle">s[2..5]&#160;&#160;ref -&gt; [2],&#160;length 3</text>

  <!-- heap side -->
  <rect x="444" y="68" width="392" height="164" rx="8" fill="#f6fbf7" stroke="#8bbd9d" stroke-width="1.3"/>
  <text x="640" y="88" font-size="12.5" font-weight="bold" fill="#2d5c42" text-anchor="middle">Managed heap&#160;&#160;&#160;int[] a = [1,2,3,4,5,6];</text>

  <rect x="472" y="102" width="56" height="38" rx="3" fill="#eaf6ee" stroke="#4a8a68" stroke-width="1.3"/>
  <rect x="528" y="102" width="56" height="38" rx="3" fill="#d8eee1" stroke="#4a8a68" stroke-width="1.3"/>
  <rect x="584" y="102" width="56" height="38" rx="3" fill="#d8eee1" stroke="#4a8a68" stroke-width="1.3"/>
  <rect x="640" y="102" width="56" height="38" rx="3" fill="#d8eee1" stroke="#4a8a68" stroke-width="1.3"/>
  <rect x="696" y="102" width="56" height="38" rx="3" fill="#eaf6ee" stroke="#4a8a68" stroke-width="1.3"/>
  <rect x="752" y="102" width="56" height="38" rx="3" fill="#eaf6ee" stroke="#4a8a68" stroke-width="1.3"/>
  <text x="500" y="126" font-size="11.5" fill="#245139" text-anchor="middle">1</text>
  <text x="556" y="126" font-size="11.5" fill="#245139" text-anchor="middle">2</text>
  <text x="612" y="126" font-size="11.5" fill="#245139" text-anchor="middle">3</text>
  <text x="668" y="126" font-size="11.5" fill="#245139" text-anchor="middle">4</text>
  <text x="724" y="126" font-size="11.5" fill="#245139" text-anchor="middle">5</text>
  <text x="780" y="126" font-size="11.5" fill="#245139" text-anchor="middle">6</text>
  <text x="500" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[0]</text>
  <text x="556" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[1]</text>
  <text x="612" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[2]</text>
  <text x="668" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[3]</text>
  <text x="724" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[4]</text>
  <text x="780" y="154" font-size="9.5" fill="#8a8f98" text-anchor="middle">[5]</text>

  <path d="M 472 170 L 472 178 L 808 178 L 808 170" stroke="#4a8a68" stroke-width="1.6" fill="none"/>
  <text x="640" y="194" font-size="11" fill="#245139" text-anchor="middle">a.AsSpan()&#160;&#160;ref -&gt; [0],&#160;length 6</text>
  <path d="M 528 206 L 528 214 L 696 214 L 696 206" stroke="#b5432a" stroke-width="1.8" fill="none"/>
  <text x="612" y="228" font-size="11" font-weight="bold" fill="#b5432a" text-anchor="middle">a.AsSpan(1, 3)&#160;&#160;ref -&gt; [1],&#160;length 3</text>

  <!-- the span value itself -->
  <rect x="216" y="260" width="428" height="86" rx="8" fill="#fdf6ec" stroke="#c79a4e" stroke-width="1.3"/>
  <text x="430" y="282" font-size="12.5" font-weight="bold" fill="#7a5518" text-anchor="middle">What a Span&lt;T&gt; value actually is (a ref struct, always on the stack)</text>
  <rect x="256" y="294" width="160" height="36" rx="4" fill="#ffffff" stroke="#c79a4e"/>
  <text x="336" y="317" font-size="11.5" fill="#6b5326" text-anchor="middle">ref T _reference</text>
  <rect x="444" y="294" width="160" height="36" rx="4" fill="#ffffff" stroke="#c79a4e"/>
  <text x="524" y="317" font-size="11.5" fill="#6b5326" text-anchor="middle">int _length</text>

  <path d="M 336 292 L 336 222 L 190 222 L 190 182" stroke="#c79a4e" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber2)"/>
  <path d="M 524 292 L 524 222 L 664 222 L 664 182" stroke="#c79a4e" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber2)"/>

  <text x="430" y="374" font-size="11" fill="#444444" text-anchor="middle">No copy is made: the slice aliases the original memory, so writing through s[2..5] changes s[2], s[3] and s[4].</text>
  <text x="430" y="394" font-size="11" fill="#444444" text-anchor="middle">Because a span may point into a stack frame, it can never outlive it -- hence the ref struct rules</text>
  <text x="430" y="410" font-size="11" fill="#444444" text-anchor="middle">(no fields in classes, no boxing, no capture in lambdas, and no crossing an await).</text>
  <text x="430" y="430" font-size="10.5" fill="#777777" text-anchor="middle">Use Memory&lt;T&gt; where a span cannot go, and convert with .Span at the point of use.</text>

  <defs>
    <marker id="arrowAmber2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c79a4e"/>
    </marker>
  </defs>
</svg>
