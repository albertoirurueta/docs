<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Magento on one server compared with Magento in tiers</title>
  <desc id="d">Two architectures side by side. On the left, one virtual machine runs nginx, PHP-FPM, MariaDB or MySQL, OpenSearch, Valkey, RabbitMQ and optionally Varnish, with app/etc/env.php, pub/media, var and generated on the same disk and the system cron. On the right, the tiered design for Pocket Coffee: CloudFront and an Application Load Balancer with WAF in front of Varnish pods, which forward to at least two identical web pods with nginx and php-fpm in different availability zones. The pods use Amazon RDS for the database, Amazon OpenSearch Service, two ElastiCache for Valkey replication groups for cache and sessions, Amazon MQ for RabbitMQ, S3 for media behind CloudFront and Secrets Manager. A cron job, consumer Deployments and migrate Job use the same image. The var folder, generated code and static files stay inside each pod or the image.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker></defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One server, or tiers: where Pocket Coffee keeps its state</text>
  <line x1="300" y1="52" x2="300" y2="540" stroke="#6f8aa3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="30" y="68" font-size="14" font-weight="bold" fill="#f4b860">Single server</text>
  <rect x="30" y="84" width="240" height="40" rx="9" fill="#3d5266"/>
  <text x="150" y="109" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper and staff</text>
  <line x1="150" y1="124" x2="150" y2="146" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="148" width="240" height="380" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="150" y="171" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">One virtual machine</text>
  <rect x="46" y="182" width="208" height="34" rx="8" fill="#3f6e9a"/><text x="150" y="204" font-size="12" fill="#f2f5f8" text-anchor="middle">nginx + PHP-FPM (+ Varnish)</text>
  <rect x="46" y="224" width="208" height="34" rx="8" fill="#4d7c5a"/><text x="150" y="246" font-size="12" fill="#f2f5f8" text-anchor="middle">MariaDB or MySQL, same disk</text>
  <rect x="46" y="266" width="208" height="34" rx="8" fill="#4d7c5a"/><text x="150" y="288" font-size="12" fill="#f2f5f8" text-anchor="middle">OpenSearch, Valkey, RabbitMQ</text>
  <rect x="46" y="308" width="208" height="50" rx="8" fill="#7a5c3a"/><text x="150" y="330" font-size="12" fill="#f2f5f8" text-anchor="middle">pub/media, pub/static</text><text x="150" y="348" font-size="12" fill="#f2f5f8" text-anchor="middle">generated/, vendor/, app/code</text>
  <rect x="46" y="366" width="208" height="34" rx="8" fill="#2f4a44"/><text x="150" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">var/ (cache, log, report, tmp)</text>
  <rect x="46" y="408" width="208" height="34" rx="8" fill="#34495e"/><text x="150" y="430" font-size="12" fill="#f2f5f8" text-anchor="middle">app/etc/env.php + system cron</text>
  <rect x="46" y="450" width="208" height="34" rx="8" fill="#34495e"/><text x="150" y="472" font-size="12" fill="#f2f5f8" text-anchor="middle">consumers_runner under cron</text>
  <text x="150" y="508" font-size="11.5" fill="#9fd3c7" text-anchor="middle">one disk, one backup, one failure</text>

  <text x="330" y="68" font-size="14" font-weight="bold" fill="#f4b860">Tiered on Kubernetes</text>
  <rect x="330" y="84" width="100" height="40" rx="9" fill="#3d5266"/><text x="380" y="109" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper</text>
  <rect x="446" y="84" width="150" height="40" rx="9" fill="#3d5266"/><text x="521" y="101" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">CloudFront</text><text x="521" y="117" font-size="11" fill="#f2f5f8" text-anchor="middle">CDN, media origin</text>
  <rect x="612" y="84" width="150" height="40" rx="9" fill="#3d5266"/><text x="687" y="101" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ALB + WAF</text><text x="687" y="117" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS, health checks</text>
  <line x1="430" y1="104" x2="444" y2="104" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="596" y1="104" x2="610" y2="104" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="687" y1="124" x2="687" y2="146" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="148" width="600" height="46" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="344" y="168" font-size="12.5" font-weight="bold" fill="#f4b860">Varnish pods (2+)</text>
  <text x="344" y="185" font-size="11" fill="#f2f5f8">full page cache in memory; admin and API routes bypass it</text>
  <line x1="630" y1="194" x2="630" y2="214" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="216" width="600" height="116" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="344" y="236" font-size="12.5" font-weight="bold" fill="#f4b860">Web pods (2+, spread over zones), one container image</text>
  <rect x="344" y="248" width="180" height="70" rx="8" fill="#3f6e9a"/><text x="434" y="272" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">pod, zone a</text><text x="434" y="291" font-size="11" fill="#f2f5f8" text-anchor="middle">nginx + php-fpm</text><text x="434" y="307" font-size="11" fill="#f2f5f8" text-anchor="middle">var/ in emptyDir</text>
  <rect x="540" y="248" width="180" height="70" rx="8" fill="#3f6e9a"/><text x="630" y="272" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">pod, zone b</text><text x="630" y="291" font-size="11" fill="#f2f5f8" text-anchor="middle">nginx + php-fpm</text><text x="630" y="307" font-size="11" fill="#f2f5f8" text-anchor="middle">var/ in emptyDir</text>
  <rect x="736" y="248" width="180" height="70" rx="8" fill="#34495e"/><text x="826" y="272" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">cron, consumers, Jobs</text><text x="826" y="291" font-size="11" fill="#f2f5f8" text-anchor="middle">CronJob, consumer</text><text x="826" y="307" font-size="11" fill="#f2f5f8" text-anchor="middle">Deployments, migrate</text>
  <line x1="630" y1="332" x2="630" y2="354" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="344" y="352" font-size="12.5" font-weight="bold" fill="#f4b860">Managed services, outside the cluster</text>
  <rect x="330" y="362" width="190" height="46" rx="8" fill="#4d7c5a"/><text x="425" y="382" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">RDS (Multi-AZ)</text><text x="425" y="399" font-size="11" fill="#f2f5f8" text-anchor="middle">MySQL 8.4</text>
  <rect x="530" y="362" width="190" height="46" rx="8" fill="#4d7c5a"/><text x="625" y="382" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">OpenSearch Service</text><text x="625" y="399" font-size="11" fill="#f2f5f8" text-anchor="middle">catalog search</text>
  <rect x="730" y="362" width="200" height="46" rx="8" fill="#4d7c5a"/><text x="830" y="382" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Amazon MQ</text><text x="830" y="399" font-size="11" fill="#f2f5f8" text-anchor="middle">RabbitMQ 4.3, queues</text>
  <rect x="330" y="418" width="190" height="46" rx="8" fill="#4d7c5a"/><text x="425" y="438" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ElastiCache Valkey</text><text x="425" y="455" font-size="11" fill="#f2f5f8" text-anchor="middle">cache group, session group</text>
  <rect x="530" y="418" width="190" height="46" rx="8" fill="#7a5c3a"/><text x="625" y="438" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">S3 (or EFS)</text><text x="625" y="455" font-size="11" fill="#f2f5f8" text-anchor="middle">pub/media, behind CloudFront</text>
  <rect x="730" y="418" width="200" height="46" rx="8" fill="#34495e"/><text x="830" y="438" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Secrets Manager</text><text x="830" y="455" font-size="11" fill="#f2f5f8" text-anchor="middle">passwords, crypt/key (reference)</text>
  <text x="630" y="494" font-size="11.5" fill="#9fd3c7" text-anchor="middle">no state in a pod that another pod or a restart cannot rebuild</text>
  <text x="630" y="514" font-size="11.5" fill="#9fd3c7" text-anchor="middle">app/etc/env.php is a read-only ConfigMap, generated/ and pub/static are baked in the image</text>
</svg>
