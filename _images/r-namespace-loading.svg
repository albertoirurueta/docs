<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Loading a namespace versus attaching a package</title>
<desc id="d">Three calls on the left act on the package shelf. loadNamespace("shelf") creates the namespace environment namespace:shelf and its imports environment imports:shelf and runs .onLoad(), but search() does not change. library(shelf) first loads the namespace in the same way (step 1), then attaches a copy of the exports as package:shelf at position 2 of the search path (step 2) and runs .onAttach(). shelf::book only reads the one export from the namespace and attaches nothing. The middle column shows the chain of environments seen by code inside the package: namespace:shelf, whose parent is imports:shelf, whose parent is the base namespace, whose parent is the global environment, the start of the search path on the right: .GlobalEnv, package:shelf, package:stats, other attached packages, Autoloads and package:base.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b34700"/></marker>
</defs>
<rect width="760" height="474" fill="#ffffff" stroke="#9aa3ad"/>
<text x="14" y="26" font-size="17" font-weight="bold" fill="#1f2933">Loading a namespace versus attaching a package</text>

<text x="14" y="58" font-weight="bold" fill="#1f2933">Calls</text>
<text x="292" y="58" font-weight="bold" fill="#1f2933">Loaded: namespace environments</text>
<text x="560" y="58" font-weight="bold" fill="#1f2933">Attached: search()</text>

<rect x="14" y="74" width="190" height="30" fill="#f5f7fa" stroke="#52606d"/>
<text x="26" y="94" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">shelf::book</text>
<rect x="14" y="116" width="190" height="30" fill="#fbe7b5" stroke="#52606d"/>
<text x="26" y="136" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">loadNamespace("shelf")</text>
<rect x="14" y="158" width="190" height="30" fill="#d9efd6" stroke="#52606d"/>
<text x="26" y="178" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">library(shelf)</text>

<line x1="204" y1="89" x2="290" y2="89" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="214" y="83" font-size="12" fill="#3e4c59">reads</text>
<line x1="204" y1="131" x2="290" y2="131" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="214" y="125" font-size="12" fill="#3e4c59">creates</text>
<line x1="204" y1="173" x2="290" y2="173" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="214" y="167" font-size="12" fill="#3e4c59">(1) loads</text>

<rect x="292" y="74" width="220" height="114" fill="#cfe3f7" stroke="#52606d"/>
<text x="304" y="96" font-weight="bold" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">namespace:shelf</text>
<text x="304" y="118" font-size="12" fill="#3e4c59">every object of the package: the</text>
<text x="304" y="135" font-size="12" fill="#3e4c59">exports and the internals such as</text>
<text x="304" y="152" font-size="12" fill="#3e4c59">squish(), .onLoad(), .onAttach(),</text>
<text x="304" y="169" font-size="12" fill="#3e4c59">and the S3 methods table</text>

<line x1="402" y1="188" x2="402" y2="212" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="412" y="205" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">parent.env()</text>
<rect x="292" y="214" width="220" height="52" fill="#f5f7fa" stroke="#52606d"/>
<text x="304" y="235" font-weight="bold" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">imports:shelf</text>
<text x="304" y="254" font-size="12" fill="#3e4c59">from import(); empty for shelf</text>
<line x1="402" y1="266" x2="402" y2="290" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="412" y="283" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">parent.env()</text>
<rect x="292" y="292" width="220" height="52" fill="#f5f7fa" stroke="#52606d"/>
<text x="304" y="313" font-weight="bold" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">namespace:base</text>
<text x="304" y="332" font-size="12" fill="#3e4c59">base namespace; parent .GlobalEnv</text>

<path d="M512 318 H528 V95 H558" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<rect x="560" y="78" width="186" height="34" fill="#cfe3f7" stroke="#52606d"/>
<text x="570" y="99" font-weight="bold" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">.GlobalEnv</text>
<text x="738" y="99" text-anchor="end" font-size="11" fill="#3e4c59">workspace</text>
<rect x="560" y="120" width="186" height="34" fill="#d9efd6" stroke="#52606d"/>
<text x="570" y="141" font-weight="bold" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">package:shelf</text>
<text x="738" y="141" text-anchor="end" font-size="11" fill="#3e4c59">exports only</text>
<rect x="560" y="162" width="186" height="34" fill="#f5f7fa" stroke="#52606d"/>
<text x="570" y="183" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">package:stats</text>
<rect x="560" y="204" width="186" height="34" fill="#f5f7fa" stroke="#52606d"/>
<text x="570" y="225" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">package:graphics ...</text>
<rect x="560" y="246" width="186" height="34" fill="#f5f7fa" stroke="#52606d"/>
<text x="570" y="267" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">Autoloads</text>
<rect x="560" y="288" width="186" height="34" fill="#fbe7b5" stroke="#52606d"/>
<text x="570" y="309" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2933">package:base</text>
<text x="738" y="309" text-anchor="end" font-size="11" fill="#3e4c59">last</text>

<path d="M109 188 V360 H544 V137 H558" stroke="#b34700" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ao)"/>
<text x="130" y="378" font-size="12" fill="#b34700">(2) attaches a copy of the exports, then runs .onAttach()</text>

<text x="14" y="404" font-size="12.5" fill="#1f2933">loadNamespace("shelf") creates namespace:shelf and imports:shelf and runs .onLoad(); search() does not change.</text>
<text x="14" y="422" font-size="12.5" fill="#1f2933">library(shelf) loads (1), then attaches a copy of the exports as package:shelf at position 2 (2) and runs .onAttach().</text>
<text x="14" y="440" font-size="12.5" fill="#1f2933">shelf::book reads one export; the namespace is loaded if needed, nothing is attached and .onAttach() does not run.</text>
<text x="14" y="458" font-size="12.5" fill="#1f2933">Code inside shelf finds names along the middle chain, then in .GlobalEnv and along the search path on the right.</text>
</svg>
