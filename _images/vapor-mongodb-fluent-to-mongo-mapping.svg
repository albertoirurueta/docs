<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What a Fluent model and query become in MongoDB</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">fluent-mongo-driver 1.4.0 translates FluentKit's DatabaseQuery into MongoKitten commands and BSON documents</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="70" width="270" height="250" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="155" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Swift (Fluent API)</text>
  <text x="38" y="120" font-size="11" fill="#222222">static let schema = "books"</text>
  <text x="38" y="140" font-size="11" fill="#222222">@ID(custom: .id) var id: ObjectId?</text>
  <text x="38" y="160" font-size="11" fill="#222222">@Field(key: "title") var title</text>
  <text x="38" y="180" font-size="11" fill="#222222">@Parent(key: "author_id") var author</text>
  <text x="38" y="200" font-size="11" fill="#222222">@Field(key: "tags") var tags: [String]</text>
  <text x="38" y="220" font-size="11" fill="#222222">@Field(key: "reviews") [ReviewSnapshot]</text>
  <text x="38" y="240" font-size="11" fill="#222222">@OptionalField(key: "metadata") Document?</text>
  <text x="38" y="268" font-size="11" fill="#222222">filter(\.$title ~~ "swift")</text>
  <text x="38" y="288" font-size="11" fill="#222222">filter("tags", .equal, "swift")</text>
  <text x="38" y="308" font-size="11" fill="#222222">join(Author.self, on: ...)</text>

  <rect x="335" y="70" width="270" height="250" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="470" y="94" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">FluentMongoDriver</text>
  <text x="470" y="116" font-size="11" fill="#222222" text-anchor="middle">DatabaseQuery → Document filter</text>
  <text x="470" y="136" font-size="11" fill="#222222" text-anchor="middle">FieldKey.id → "_id", dotted paths</text>
  <text x="470" y="156" font-size="11" fill="#222222" text-anchor="middle">contains/prefix/suffix → $regex (unescaped)</text>
  <text x="470" y="176" font-size="11" fill="#222222" text-anchor="middle">== != → $eq $ne, in → $in, order → $gt…</text>
  <text x="470" y="196" font-size="11" fill="#222222" text-anchor="middle">join → aggregate: $lookup (+ $unwind)</text>
  <text x="470" y="216" font-size="11" fill="#222222" text-anchor="middle">update → $set, multi: true</text>
  <text x="470" y="236" font-size="11" fill="#222222" text-anchor="middle">delete → limit 1 or all, nothing else</text>
  <text x="470" y="256" font-size="11" fill="#222222" text-anchor="middle">unique(on:) → createIndexes "unique"</text>
  <text x="470" y="276" font-size="11" fill="#222222" text-anchor="middle">schema fields, enums, foreign keys: ignored</text>
  <text x="470" y="302" font-size="11" fill="#222222" text-anchor="middle">custom sort/limit/filter: only Document or error</text>

  <rect x="650" y="70" width="270" height="250" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="785" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">MongoDB (collection "books")</text>
  <text x="668" y="120" font-size="11" fill="#222222">{ _id: ObjectId("..."),</text>
  <text x="668" y="140" font-size="11" fill="#222222">  title: "Swift in Depth",</text>
  <text x="668" y="160" font-size="11" fill="#222222">  author_id: ObjectId("..."),</text>
  <text x="668" y="180" font-size="11" fill="#222222">  tags: ["swift", "vapor"],</text>
  <text x="668" y="200" font-size="11" fill="#222222">  reviews: [ { rating: 5, ... } ],</text>
  <text x="668" y="220" font-size="11" fill="#222222">  metadata: { publisher: "..." },</text>
  <text x="668" y="240" font-size="11" fill="#222222">  created_at: ISODate("...") }</text>
  <text x="668" y="270" font-size="11" fill="#222222">find { tags: { $eq: "swift" } }</text>
  <text x="668" y="290" font-size="11" fill="#222222">find { "metadata.publisher": ... }</text>
  <text x="668" y="310" font-size="11" fill="#222222">aggregate [ $lookup ... ]</text>

  <line x1="290" y1="195" x2="333" y2="195" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="605" y1="195" x2="648" y2="195" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="311" y="187" font-size="10" fill="#666666" text-anchor="middle">Fluent</text>
  <text x="627" y="187" font-size="10" fill="#666666" text-anchor="middle">MongoKitten</text>

  <rect x="20" y="345" width="900" height="105" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="38" y="368" font-size="12" font-weight="bold" fill="#222222">What does not carry over from the SQL drivers</text>
  <text x="38" y="390" font-size="11" fill="#222222">@Siblings pivots and $lookup-based joins work but are not how documents are meant to be modelled: embed arrays and sub-documents instead.</text>
  <text x="38" y="410" font-size="11" fill="#222222">DatabaseError.isConstraintFailure is always false, so a duplicate key cannot be told apart from other write failures that way.</text>
  <text x="38" y="430" font-size="11" fill="#222222">db.transaction needs a replica set or sharded cluster; sum/average/min/max are computed with a find projection, not $group.</text>
</svg>
