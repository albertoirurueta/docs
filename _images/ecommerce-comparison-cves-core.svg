<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 502" width="860" height="502" role="img" aria-labelledby="cves-core-t cves-core-d">
<title id="cves-core-t">CVEs per year, platform core</title>
<desc id="cves-core-d">CVEs published per year in the NVD for the core of each self-hosted platform: PrestaShop core, Magento Open Source plus Adobe Commerce, and the WooCommerce plugin. Magento had a 2019 batch of 137 and 63 in 2024; PrestaShop peaked at 32 in 2020; WooCommerce core never exceeds 4 a year. Shopify is a SaaS platform: it fixes its platform without CVEs, so it has no core series and is not comparable.</desc>
