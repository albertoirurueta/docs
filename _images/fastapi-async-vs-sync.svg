<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">async def vs def under load</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">5 concurrent requests, each waits about 200ms</text>

  <!-- Panel 1: async def + await -->
  <text x="40" y="72" font-size="13" font-weight="bold" fill="#2f5424">1. async def + await asyncio.sleep(0.2)</text>
  <text x="40" y="88" font-size="10.5" fill="#666666">the event loop thread is free while each handler waits</text>
  <text x="36" y="112" font-size="11" fill="#666666">event loop</text>
  <rect x="120" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="132" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="144" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="156" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="168" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="180" y="98" width="260" height="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="310" y="112" font-size="9.5" fill="#999999" text-anchor="middle">all 5 handlers awaiting -- loop idle</text>
  <rect x="440" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="452" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="464" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="476" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="488" y="98" width="12" height="20" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <text x="560" y="112" font-size="12" font-weight="bold" fill="#222222">finishes in about 0.2s</text>

  <!-- Panel 2: def + threadpool -->
  <text x="40" y="154" font-size="13" font-weight="bold" fill="#1c4b73">2. def + time.sleep(0.2) -- runs in the threadpool</text>
  <text x="40" y="170" font-size="10.5" fill="#666666">each request gets a worker thread (AnyIO limiter, 40 by default); the loop stays free</text>
  <text x="36" y="194" font-size="11" fill="#666666">event loop</text>
  <rect x="120" y="180" width="320" height="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="280" y="194" font-size="9.5" fill="#999999" text-anchor="middle">hands work to threads, serves other requests</text>
  <text x="36" y="216" font-size="11" fill="#666666">threads</text>
  <rect x="120" y="206" width="320" height="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="120" y="218" width="320" height="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="120" y="230" width="320" height="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="120" y="242" width="320" height="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="120" y="254" width="320" height="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="560" y="236" font-size="12" font-weight="bold" fill="#222222">finishes in about 0.2s</text>

  <!-- Panel 3: async def + blocking -->
  <text x="40" y="300" font-size="13" font-weight="bold" fill="#8a1f1f">3. async def + time.sleep(0.2) -- the bug</text>
  <text x="40" y="316" font-size="10.5" fill="#666666">a blocking call on the event loop thread: every other request waits behind it</text>
  <text x="36" y="342" font-size="11" fill="#666666">event loop</text>
  <rect x="120" y="328" width="100" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="220" y="328" width="100" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="320" y="328" width="100" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="420" y="328" width="100" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="520" y="328" width="100" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <text x="170" y="343" font-size="10" fill="#8a1f1f" text-anchor="middle">req 1 blocks</text>
  <text x="270" y="343" font-size="10" fill="#8a1f1f" text-anchor="middle">req 2 blocks</text>
  <text x="370" y="343" font-size="10" fill="#8a1f1f" text-anchor="middle">req 3 blocks</text>
  <text x="470" y="343" font-size="10" fill="#8a1f1f" text-anchor="middle">req 4 blocks</text>
  <text x="570" y="343" font-size="10" fill="#8a1f1f" text-anchor="middle">req 5 blocks</text>
  <text x="640" y="343" font-size="12" font-weight="bold" fill="#222222">about 1s</text>

  <!-- shared time axis -->
  <g stroke="#999999" stroke-width="1" fill="#666666">
    <line x1="120" y1="372" x2="620" y2="372"/>
    <line x1="120" y1="372" x2="120" y2="377"/>
    <line x1="220" y1="372" x2="220" y2="377"/>
    <line x1="320" y1="372" x2="320" y2="377"/>
    <line x1="420" y1="372" x2="420" y2="377"/>
    <line x1="520" y1="372" x2="520" y2="377"/>
    <line x1="620" y1="372" x2="620" y2="377"/>
  </g>
  <g font-size="10" fill="#666666" text-anchor="middle">
    <text x="120" y="390">0</text>
    <text x="220" y="390">200ms</text>
    <text x="320" y="390">400ms</text>
    <text x="420" y="390">600ms</text>
    <text x="520" y="390">800ms</text>
    <text x="620" y="390">1000ms</text>
  </g>
  <text x="360" y="414" font-size="12" fill="#444444" text-anchor="middle">The same five requests: awaiting or a worker thread overlaps the waits; blocking the loop stacks them.</text>

  <!-- legend -->
  <rect x="140" y="434" width="18" height="14" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="164" y="445" font-size="11" fill="#444444">running</text>
  <rect x="260" y="434" width="18" height="14" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="284" y="445" font-size="11" fill="#444444">idle, free for other work</text>
  <text x="480" y="445" font-size="11" fill="#444444">illustrative timings, not a benchmark</text>
</svg>
