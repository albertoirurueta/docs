<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>From verified identity to a filtered retrieval</title>
  <desc>A request carries a bearer token. The API verifies the token's signature, issuer, audience and expiry and reads the subject and group claims. A policy maps the groups to the ACL tags the caller may read. The retriever builds a metadata filter from those tags and ANDs it with any filters from the question, then runs the vector search, which returns only chunks whose acl tag is in the readable set. The model and the prompt never produce or change the ACL part of the filter, and every retrieval is written to the audit log.</desc>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#f8fafc"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">From verified identity to a filtered retrieval</text>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="60" width="160" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="86" font-size="14" font-weight="bold" fill="#1e3a8a">Request</text>
    <text x="100" y="108" fill="#1e3a8a">POST /v1/ask</text>
    <text x="100" y="126" fill="#1e3a8a">Authorization: Bearer</text>
    <text x="100" y="144" fill="#1e3a8a">question, filters</text>
    <text x="100" y="162" fill="#1e3a8a">(no ACL fields)</text>

    <rect x="220" y="60" width="170" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="305" y="86" font-size="14" font-weight="bold" fill="#4c1d95">Verify token</text>
    <text x="305" y="108" fill="#4c1d95">signature, iss, aud, exp</text>
    <text x="305" y="126" fill="#4c1d95">sub = u-1842</text>
    <text x="305" y="144" fill="#4c1d95">groups = [staff,</text>
    <text x="305" y="162" fill="#4c1d95">backend-team]</text>

    <rect x="430" y="60" width="170" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="515" y="86" font-size="14" font-weight="bold" fill="#4c1d95">Policy</text>
    <text x="515" y="108" fill="#4c1d95">groups to ACL tags</text>
    <text x="515" y="126" fill="#4c1d95">staff: public, internal</text>
    <text x="515" y="144" fill="#4c1d95">backend-team: backend</text>
    <text x="515" y="162" fill="#4c1d95">cached, versioned</text>

    <rect x="640" y="60" width="300" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="790" y="86" font-size="14" font-weight="bold" fill="#14532d">Filter built in code</text>
    <text x="790" y="110" font-family="Courier New, monospace" fill="#14532d">acl IN [public, internal, backend]</text>
    <text x="790" y="130" font-family="Courier New, monospace" fill="#14532d">AND component = 'backend'</text>
    <text x="790" y="152" fill="#14532d">first clause: identity only</text>
    <text x="790" y="170" fill="#14532d">second clause: may come from the question</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#b)" fill="none">
    <line x1="180" y1="120" x2="218" y2="120"/>
    <line x1="390" y1="120" x2="428" y2="120"/>
    <line x1="600" y1="120" x2="638" y2="120"/>
    <line x1="790" y1="180" x2="790" y2="228"/>
  </g>

  <rect x="480" y="230" width="460" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <g font-size="12" fill="#78350f">
    <text x="710" y="256" text-anchor="middle" font-size="14" font-weight="bold">Vector store (pre-filtered search)</text>
    <text x="500" y="282">c4217  acl=public    component=backend   returned</text>
    <text x="500" y="302">c4290  acl=backend   component=backend   returned</text>
    <text x="500" y="322">c5102  acl=security  component=backend   never a candidate</text>
    <text x="500" y="342">c6001  acl=internal  component=ai        filtered by component</text>
  </g>

  <rect x="20" y="230" width="420" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <g font-size="12" fill="#7f1d1d">
    <text x="230" y="256" text-anchor="middle" font-size="14" font-weight="bold">Never a source of ACLs</text>
    <text x="40" y="282">the prompt or the question text</text>
    <text x="40" y="302">model output or tool-call arguments</text>
    <text x="40" y="322">client-supplied filter fields named acl</text>
    <text x="40" y="342">retrieved document content</text>
  </g>

  <rect x="20" y="380" width="920" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g font-size="12" fill="#0c4a6e">
    <text x="36" y="404" font-size="14" font-weight="bold">Audit log</text>
    <text x="36" y="426">time, sub, trace id, query hash, filter, returned chunk ids, answer id: enough to answer "who could see what, and when"</text>
  </g>
</svg>
