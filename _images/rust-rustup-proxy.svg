<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The rustup proxy chain</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">cargo, rustc and the other tools on PATH are small rustup proxies that pick a toolchain, then run its real binary</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="20" y="120" width="150" height="60" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="95" y="146" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">$ cargo build</text>
  <text x="95" y="166" font-size="11" fill="#555555" text-anchor="middle">or cargo +nightly build</text>

  <rect x="210" y="110" width="170" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="295" y="136" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">~/.cargo/bin/cargo</text>
  <text x="295" y="156" font-size="11" fill="#444444" text-anchor="middle">rustup proxy (same binary</text>
  <text x="295" y="171" font-size="11" fill="#444444" text-anchor="middle">as rustup, other name)</text>

  <rect x="420" y="70" width="230" height="160" rx="6" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
  <text x="535" y="94" font-size="14" font-weight="bold" fill="#a35a00" text-anchor="middle">Toolchain selection</text>
  <g font-size="11" fill="#333333">
    <text x="435" y="118">1. +toolchain on the command line</text>
    <text x="435" y="138">2. RUSTUP_TOOLCHAIN variable</text>
    <text x="435" y="158">3. directory override (rustup override)</text>
    <text x="435" y="178">4. rust-toolchain.toml in a parent dir</text>
    <text x="435" y="198">5. default toolchain (rustup default)</text>
    <text x="435" y="218" fill="#777777">first match wins</text>
  </g>

  <rect x="690" y="70" width="250" height="160" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="815" y="94" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">~/.rustup/toolchains/</text>
  <text x="815" y="112" font-size="12" fill="#2e7d32" text-anchor="middle">stable-x86_64-unknown-linux-gnu/bin</text>
  <g font-size="12" fill="#333333">
    <rect x="705" y="126" width="100" height="26" fill="#ffffff" stroke="#2e7d32"/>
    <text x="755" y="144" text-anchor="middle">cargo</text>
    <rect x="825" y="126" width="100" height="26" fill="#ffffff" stroke="#2e7d32"/>
    <text x="875" y="144" text-anchor="middle">rustc</text>
    <rect x="705" y="162" width="100" height="26" fill="#ffffff" stroke="#2e7d32"/>
    <text x="755" y="180" text-anchor="middle">clippy-driver</text>
    <rect x="825" y="162" width="100" height="26" fill="#ffffff" stroke="#2e7d32"/>
    <text x="875" y="180" text-anchor="middle">rustfmt</text>
    <text x="815" y="214" text-anchor="middle" font-size="11" fill="#555555">plus rust-std for each installed target</text>
  </g>
  <g stroke="#444444" stroke-width="1.4" marker-end="url(#a)">
    <line x1="170" y1="150" x2="208" y2="150"/>
    <line x1="380" y1="150" x2="418" y2="150"/>
    <line x1="650" y1="150" x2="688" y2="150"/>
  </g>
  <path d="M755,230 C755,290 875,290 875,232" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="815" y="306" font-size="11" fill="#2e7d32" text-anchor="middle">the real cargo calls rustc through the proxy too,</text>
  <text x="815" y="321" font-size="11" fill="#2e7d32" text-anchor="middle">so both come from the same toolchain</text>
  <text x="300" y="300" font-size="12" fill="#555555" text-anchor="middle">rustup show active-toolchain prints the choice and the reason</text>
</svg>
