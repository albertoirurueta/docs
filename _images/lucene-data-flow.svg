<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Lucene data flow: the indexing lane and the search lane</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">both lanes meet at the same Directory of segment files</text>

  <text x="175" y="62" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Indexing lane</text>
  <text x="585" y="62" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Search lane</text>

  <!-- indexing lane -->
  <g font-family="'Courier New', monospace" font-size="11.5">
    <rect x="40" y="70" width="270" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="53" y="90" fill="#222222">Document + Field</text>
    <text x="53" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">TextField / StringField / *Point / DocValues</text>

    <rect x="40" y="146" width="270" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="53" y="166" fill="#222222">Analyzer</text>
    <text x="53" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">held by IndexWriterConfig</text>

    <rect x="40" y="222" width="270" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="53" y="242" fill="#222222">IndexWriter</text>
    <text x="53" y="259" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">buffers docs, flushes to segments</text>

    <rect x="40" y="298" width="270" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="53" y="318" fill="#222222">Directory</text>
    <text x="53" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">immutable segments + segments_N</text>

    <rect x="40" y="374" width="270" height="40" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
    <text x="53" y="399" fill="#2f5424">commit()  &#8594;  segments_N</text>
  </g>

  <path d="M175,116 L175,144" stroke="#999999" stroke-width="1.4"/><polygon points="169,142 181,142 175,150" fill="#999999"/>
  <path d="M175,192 L175,220" stroke="#999999" stroke-width="1.4"/><polygon points="169,218 181,218 175,226" fill="#999999"/>
  <path d="M175,268 L175,296" stroke="#999999" stroke-width="1.4"/><polygon points="169,294 181,294 175,302" fill="#999999"/>
  <path d="M175,344 L175,372" stroke="#999999" stroke-width="1.4"/><polygon points="169,370 181,370 175,378" fill="#999999"/>

  <!-- search lane -->
  <g font-family="'Courier New', monospace" font-size="11.5">
    <rect x="450" y="70" width="270" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="463" y="97" fill="#222222">Directory</text>

    <rect x="450" y="130" width="270" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="463" y="157" fill="#222222">DirectoryReader.open</text>

    <rect x="450" y="190" width="270" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="463" y="217" fill="#222222">IndexSearcher</text>

    <rect x="450" y="250" width="270" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="463" y="277" fill="#222222">Query</text>

    <rect x="450" y="310" width="270" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="463" y="337" fill="#222222">TopDocs &#8594; ScoreDoc[]</text>

    <rect x="450" y="370" width="270" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="463" y="397" fill="#1c4b73">storedFields().document</text>
  </g>

  <path d="M585,114 L585,128" stroke="#999999" stroke-width="1.4"/><polygon points="579,126 591,126 585,134" fill="#999999"/>
  <path d="M585,174 L585,188" stroke="#999999" stroke-width="1.4"/><polygon points="579,186 591,186 585,194" fill="#999999"/>
  <path d="M585,234 L585,248" stroke="#999999" stroke-width="1.4"/><polygon points="579,246 591,246 585,254" fill="#999999"/>
  <path d="M585,294 L585,308" stroke="#999999" stroke-width="1.4"/><polygon points="579,306 591,306 585,314" fill="#999999"/>
  <path d="M585,354 L585,368" stroke="#999999" stroke-width="1.4"/><polygon points="579,366 591,366 585,374" fill="#999999"/>

  <!-- bridge between lanes -->
  <path d="M310,394 L418,394 L418,92 L448,92" fill="none" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="446,88 446,96 454,92" fill="#1c4b73"/>
  <text x="332" y="232" font-size="10.5" fill="#666666">same files</text>
  <text x="332" y="248" font-size="10.5" fill="#666666">on disk:</text>
  <text x="332" y="264" font-size="10.5" fill="#666666">committed</text>
  <text x="332" y="280" font-size="10.5" fill="#666666">segments,</text>
  <text x="332" y="296" font-size="10.5" fill="#666666">re-opened</text>
  <text x="332" y="312" font-size="10.5" fill="#666666">by the reader</text>
</svg>
