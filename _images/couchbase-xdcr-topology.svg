<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">XDCR replication topologies</text>

  <line x1="382" y1="48" x2="382" y2="368" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

  <defs>
    <marker id="xd-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="xd-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <!-- ============ LEFT: unidirectional ============ -->
  <text x="196" y="58" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Unidirectional (active / DR)</text>

  <!-- Cluster A -->
  <rect x="44" y="96" width="112" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="100" y="118" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cluster A</text>
  <text x="100" y="133" font-size="9" fill="#666666" text-anchor="middle">takes all writes</text>
  <circle cx="78" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>
  <circle cx="100" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>
  <circle cx="122" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>

  <!-- Cluster B -->
  <rect x="236" y="96" width="112" height="150" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="292" y="118" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cluster B</text>
  <text x="292" y="133" font-size="9" fill="#666666" text-anchor="middle">read-only standby</text>
  <circle cx="270" cy="200" r="11" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <circle cx="292" cy="200" r="11" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>
  <circle cx="314" cy="200" r="11" fill="#eef2f6" stroke="#999999" stroke-width="1.4"/>

  <line x1="156" y1="200" x2="236" y2="200" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#xd-blue)"/>
  <text x="196" y="190" font-size="9.5" fill="#1c4b73" text-anchor="middle">DCP stream</text>
  <text x="196" y="216" font-size="9" fill="#666666" text-anchor="middle">one way, filtered</text>

  <text x="196" y="288" font-size="10.5" fill="#444444" text-anchor="middle">B is a hot copy for failover</text>
  <text x="196" y="304" font-size="10.5" fill="#444444" text-anchor="middle">or a reporting cluster.</text>

  <!-- ============ RIGHT: bidirectional ============ -->
  <text x="568" y="58" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Bidirectional (active / active)</text>

  <!-- Cluster C -->
  <rect x="416" y="96" width="112" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="472" y="118" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cluster C</text>
  <text x="472" y="133" font-size="9" fill="#666666" text-anchor="middle">takes writes</text>
  <circle cx="450" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>
  <circle cx="472" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>
  <circle cx="494" cy="200" r="11" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.5"/>

  <!-- Cluster D -->
  <rect x="608" y="96" width="112" height="150" rx="8" fill="#f4f4f4" stroke="#2f5424" stroke-width="2"/>
  <text x="664" y="118" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cluster D</text>
  <text x="664" y="133" font-size="9" fill="#666666" text-anchor="middle">takes writes</text>
  <circle cx="642" cy="200" r="11" fill="#eef2f6" stroke="#2f5424" stroke-width="1.5"/>
  <circle cx="664" cy="200" r="11" fill="#eef2f6" stroke="#2f5424" stroke-width="1.5"/>
  <circle cx="686" cy="200" r="11" fill="#eef2f6" stroke="#2f5424" stroke-width="1.5"/>

  <line x1="528" y1="188" x2="608" y2="188" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#xd-blue)"/>
  <line x1="608" y1="212" x2="528" y2="212" stroke="#2f5424" stroke-width="1.8" marker-end="url(#xd-green)"/>
  <text x="568" y="178" font-size="9" fill="#666666" text-anchor="middle">two one-way</text>
  <text x="568" y="232" font-size="9" fill="#666666" text-anchor="middle">replications</text>

  <text x="568" y="288" font-size="10.5" fill="#444444" text-anchor="middle">Both take writes; conflicts resolved</text>
  <text x="568" y="304" font-size="10.5" fill="#444444" text-anchor="middle">by rev-ID (default) or timestamp / LWW.</text>

  <text x="380" y="356" font-size="11" fill="#444444" text-anchor="middle">XDCR mirrors a whole bucket between clusters over DCP; chains and hub-and-spoke are just more one-way replications.</text>
</svg>
