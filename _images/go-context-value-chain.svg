<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="330" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">ctx.Value walks the parent chain</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">each WithValue wraps its parent; a lookup compares keys from the newest link towards Background and returns the first match</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
  </defs>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="30" y="110" width="170" height="70" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="115" y="132" font-weight="bold">valueCtx (newest)</text>
    <text x="115" y="150">key: memberKey</text>
    <text x="115" y="166">val: "ana"</text>

    <rect x="270" y="110" width="170" height="70" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="355" y="132" font-weight="bold">valueCtx</text>
    <text x="355" y="150">key: requestIDKey</text>
    <text x="355" y="166">val: "req-42"</text>

    <rect x="510" y="110" width="170" height="70" fill="#fdf1e3" stroke="#a5651a"/>
    <text x="595" y="132" font-weight="bold">cancelCtx</text>
    <text x="595" y="150">WithTimeout(2s)</text>
    <text x="595" y="166">no values of its own</text>

    <rect x="750" y="110" width="160" height="70" fill="#f1f1f1" stroke="#666666"/>
    <text x="830" y="132" font-weight="bold">backgroundCtx</text>
    <text x="830" y="150">root: no values</text>
    <text x="830" y="166">Value returns nil</text>
  </g>
  <g stroke="#1c4b73" stroke-width="2" fill="none">
    <line x1="200" y1="145" x2="268" y2="145" marker-end="url(#a)"/>
    <line x1="440" y1="145" x2="508" y2="145" marker-end="url(#a)"/>
    <line x1="680" y1="145" x2="748" y2="145" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#1c4b73" text-anchor="middle">
    <text x="234" y="136">parent</text><text x="474" y="136">parent</text><text x="714" y="136">parent</text>
  </g>
  <!-- lookup -->
  <text x="30" y="226" font-size="13" font-weight="bold" fill="#b3261e">ctx.Value(requestIDKey)</text>
  <path d="M115,200 L115,214 L355,214 L355,186" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="235" y="208" font-size="11" fill="#b3261e" text-anchor="middle">1: key differs</text>
  <text x="365" y="204" font-size="11" fill="#b3261e">2: key matches, return "req-42"</text>
  <text x="30" y="270" font-size="13" font-weight="bold" fill="#555555">ctx.Value(otherKey) for a key nobody set</text>
  <text x="30" y="290" font-size="12" fill="#555555">visits all four links, then returns nil: cost grows with the depth of the chain, so keep values few and request scoped</text>
</svg>
