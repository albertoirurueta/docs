<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Web Forms page life cycle (one request)</text>

  <!-- Stage 1: Page request -->
  <rect x="40" y="50" width="740" height="42" rx="6" fill="#e6e6e6" stroke="#888888" stroke-width="1.5"/>
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#333333">1. Page request -- ASP.NET checks whether to parse/compile the page, or serve a cached output</text>

  <!-- Stage 2: Start -->
  <rect x="40" y="104" width="740" height="50" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="60" y="126" font-size="13" font-weight="bold" fill="#1c4b73">2. Start</text>
  <text x="60" y="145" font-size="11.5" fill="#1c4b73">Page properties set: Request, Response, IsPostBack, UICulture</text>

  <!-- Stage 3: Initialization -->
  <rect x="40" y="166" width="740" height="66" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="60" y="188" font-size="13" font-weight="bold" fill="#2f5424">3. Initialization</text>
  <text x="60" y="207" font-size="11.5" fill="#2f5424">PreInit -&gt; theme/master applied -&gt; Init (bottom-up: children before parent) -&gt; InitComplete</text>
  <text x="60" y="224" font-size="10.5" fill="#2f5424">ViewState is NOT yet available to controls during Init</text>

  <!-- Stage 4: Load -->
  <rect x="40" y="240" width="740" height="80" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="60" y="262" font-size="13" font-weight="bold" fill="#8a3d10">4. Load</text>
  <text x="60" y="281" font-size="11.5" fill="#8a3d10">PreLoad -&gt; ViewState/postback data loaded -&gt; Load (top-down: page before children)</text>
  <text x="60" y="298" font-size="11.5" fill="#8a3d10">-&gt; Postback event handling: change events, then the triggering action event (e.g. Button.Click)</text>
  <text x="60" y="313" font-size="10.5" fill="#8a3d10">Postback event handling only runs when IsPostBack is true</text>

  <!-- Stage 5: Rendering -->
  <rect x="40" y="328" width="740" height="66" rx="6" fill="#f3d9e6" stroke="#a83070" stroke-width="1.5"/>
  <text x="60" y="350" font-size="13" font-weight="bold" fill="#7a1f52">5. Rendering</text>
  <text x="60" y="369" font-size="11.5" fill="#7a1f52">LoadComplete -&gt; PreRender (bottom-up) -&gt; PreRenderComplete -&gt; SaveViewState/SaveStateComplete</text>
  <text x="60" y="386" font-size="10.5" fill="#7a1f52">-&gt; Render (writes HTML for the control tree to the response)</text>

  <!-- Stage 6: Unload -->
  <rect x="40" y="402" width="740" height="46" rx="6" fill="#e6e6e6" stroke="#888888" stroke-width="1.5"/>
  <text x="60" y="424" font-size="13" font-weight="bold" fill="#333333">6. Unload</text>
  <text x="60" y="441" font-size="11" fill="#333333">Cleanup (bottom-up); close files/DB connections; page object discarded -- do not modify state here</text>

  <!-- arrows -->
  <g stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="410" y1="92" x2="410" y2="102"/>
    <line x1="410" y1="154" x2="410" y2="164"/>
    <line x1="410" y1="232" x2="410" y2="238"/>
    <line x1="410" y1="320" x2="410" y2="326"/>
    <line x1="410" y1="394" x2="410" y2="400"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="410" y="478" font-size="12.5" fill="#444444" text-anchor="middle">Init runs bottom-up (innermost control first); Load and PreRender run top-down/bottom-up as noted --</text>
  <text x="410" y="496" font-size="12.5" fill="#444444" text-anchor="middle">controls added dynamically after Page_Load need explicit "catch-up" calls to reach the same stage as static controls.</text>
  <text x="410" y="524" font-size="12" fill="#666666" text-anchor="middle">Source: Page Life Cycle Overview, learn.microsoft.com/previous-versions/aspnet</text>
</svg>
