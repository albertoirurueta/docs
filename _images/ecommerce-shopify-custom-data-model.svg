<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Pocket Coffee custom data model</title>
  <desc id="d">Metafields attached to products, customers, orders, discounts and the app installation, two metaobject definitions that product metafields reference (origin, owned by the merchant, and club_tier, owned by the app), and the four surfaces that read the data: Liquid, the Storefront API, Shopify Functions and the Customer Account API.</desc>
  <rect x="0" y="0" width="760" height="470" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g fill="#f2f5f8" font-size="12">
    <!-- resources with metafields -->
    <rect x="20" y="20" width="290" height="190" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="165" y="42" text-anchor="middle" font-size="15" font-weight="bold">Product</text>
    <text x="34" y="66" font-family="Courier New, monospace">custom.roast_date</text>
    <text x="296" y="66" text-anchor="end">date</text>
    <text x="34" y="88" font-family="Courier New, monospace">custom.tasting_notes</text>
    <text x="296" y="88" text-anchor="end">list of text</text>
    <text x="34" y="110" font-family="Courier New, monospace">custom.origin</text>
    <text x="296" y="110" text-anchor="end">metaobject ref</text>
    <text x="34" y="132" font-family="Courier New, monospace">$app:club.eligible</text>
    <text x="296" y="132" text-anchor="end">boolean</text>
    <text x="34" y="154" font-family="Courier New, monospace">$app:club.tier</text>
    <text x="296" y="154" text-anchor="end">metaobject ref</text>
    <text x="34" y="176" font-family="Courier New, monospace">$app.lot_code</text>
    <text x="296" y="176" text-anchor="end">unique text</text>
    <text x="165" y="198" text-anchor="middle" font-size="11">merchant-owned = custom, app-owned = $app</text>

    <rect x="340" y="20" width="190" height="60" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="435" y="40" text-anchor="middle" font-size="15" font-weight="bold">Customer</text>
    <text x="435" y="62" text-anchor="middle" font-family="Courier New, monospace" font-size="11">$app:club.member_since</text>

    <rect x="340" y="95" width="190" height="60" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="435" y="115" text-anchor="middle" font-size="15" font-weight="bold">Order</text>
    <text x="435" y="137" text-anchor="middle" font-family="Courier New, monospace" font-size="11">$app.gift_message</text>
    <text x="435" y="150" text-anchor="middle" font-size="10">copied from the cart</text>

    <rect x="560" y="20" width="180" height="60" rx="10" fill="#b0743a" stroke="#f2f5f8"/>
    <text x="650" y="40" text-anchor="middle" font-size="15" font-weight="bold">Discount</text>
    <text x="650" y="62" text-anchor="middle" font-family="Courier New, monospace" font-size="11">$app:club.config (json)</text>

    <rect x="560" y="95" width="180" height="60" rx="10" fill="#b0743a" stroke="#f2f5f8"/>
    <text x="650" y="115" text-anchor="middle" font-size="15" font-weight="bold">App installation</text>
    <text x="650" y="137" text-anchor="middle" font-family="Courier New, monospace" font-size="11">club.enabled (boolean)</text>
    <text x="650" y="150" text-anchor="middle" font-size="10">hidden from the admin</text>

    <!-- metaobjects -->
    <rect x="20" y="258" width="350" height="100" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="195" y="280" text-anchor="middle" font-size="15" font-weight="bold">Metaobject: origin</text>
    <text x="195" y="298" text-anchor="middle" font-size="11">merchant-owned, created with GraphQL</text>
    <text x="195" y="318" text-anchor="middle">name, country, altitude_m, story, photo</text>
    <text x="195" y="338" text-anchor="middle" font-size="11">publishable, renderable, online store page</text>

    <rect x="390" y="258" width="350" height="100" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="565" y="280" text-anchor="middle" font-size="15" font-weight="bold">Metaobject: $app:club_tier</text>
    <text x="565" y="298" text-anchor="middle" font-size="11">app-owned, declared in shopify.app.toml</text>
    <text x="565" y="318" text-anchor="middle">label, discount_percent, free_shipping_from, perks</text>
    <text x="565" y="338" text-anchor="middle" font-size="11">publishable, translatable</text>

    <!-- readers -->
    <rect x="20" y="398" width="170" height="56" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="105" y="418" text-anchor="middle" font-weight="bold" font-size="13">Liquid</text>
    <text x="105" y="434" text-anchor="middle" font-size="10">always, ignores storefront access</text>
    <text x="105" y="447" text-anchor="middle" font-size="10">hides draft metaobjects</text>

    <rect x="200" y="398" width="170" height="56" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="285" y="418" text-anchor="middle" font-weight="bold" font-size="13">Storefront API</text>
    <text x="285" y="434" text-anchor="middle" font-size="10">access.storefront = public_read</text>
    <text x="285" y="447" text-anchor="middle" font-size="10">needs a token</text>

    <rect x="390" y="398" width="170" height="56" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="475" y="418" text-anchor="middle" font-weight="bold" font-size="13">Shopify Functions</text>
    <text x="475" y="434" text-anchor="middle" font-size="10">input query, cost budget 30</text>
    <text x="475" y="447" text-anchor="middle" font-size="10">metaobjects: $app types only</text>

    <rect x="570" y="398" width="170" height="56" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="655" y="418" text-anchor="middle" font-weight="bold" font-size="13">Customer Account API</text>
    <text x="655" y="434" text-anchor="middle" font-size="10">definition required</text>
    <text x="655" y="447" text-anchor="middle" font-size="10">access.customer_account</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M120 210 L120 258"/>
    <path d="M270 210 C 270 235, 480 235, 480 258"/>
  </g>
  <g fill="#f2f5f8" font-size="10">
    <text x="128" y="238">custom.origin</text>
    <text x="20" y="384" font-size="11">Read by:</text>
    <text x="372" y="228">$app:club.tier</text>
  </g>
</svg>
