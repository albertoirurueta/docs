<text class="footer" x="24" y="488" text-anchor="start"><tspan x="24" dy="0">Sources: aws-bedrock-regions, aws-global-infra, aws-regional-services, azure-asia-blog, azure-foundry-partners,</tspan><tspan x="24" dy="15">azure-foundry-region, azure-products-by-region, azure-regions-list, gcp-locations, gcp-locations-data, gcp-vertex-locations,</tspan><tspan x="24" dy="15">wayback-aws-global-infra, wayback-azure-global-infra, wayback-gcp-locations, wayback-gcp-regions-zones. Data as of</tspan><tspan x="24" dy="15">2026-10-26. Fit = value relative to the best provider: best &gt;= 95, good &gt;= 80, otherwise acceptable. Ease of use is an</tspan><tspan x="24" dy="15">editorial score; no provider is best for everything.</tspan></text>
