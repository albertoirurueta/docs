<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 569" width="748" height="569" role="img" aria-labelledby="recommendation-matrix-t recommendation-matrix-d">
<title id="recommendation-matrix-t">Which provider fits which workload</title>
<desc id="recommendation-matrix-d">Fit of AWS, Azure and Google Cloud for eight kinds of workload, derived from the data of this comparison as of 2026-10-26: list prices of the reference architectures, model availability, regional coverage, ecosystem breadth, ease of use and popularity. Best fit means within 5 percent of the best provider, good fit within 20 percent, otherwise acceptable. Several providers can share the best fit when they are close; the index is the value relative to the best provider (100). Hover a cell for the evidence.</desc>
