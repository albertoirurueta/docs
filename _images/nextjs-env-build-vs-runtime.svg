<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where an environment variable is read: build, server request, browser</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">the same process.env.NAME expression resolves at a different moment depending on where the code runs</text>

  <!-- Sources -->
  <rect x="20" y="62" width="720" height="62" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="380" y="84" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Sources, highest priority first</text>
  <text x="380" y="104" font-size="12" fill="#444444" text-anchor="middle">shell / container process.env, then .env.$(NODE_ENV).local, .env.local (skipped when NODE_ENV is test), .env.$(NODE_ENV), .env</text>
  <text x="380" y="118" font-size="11" fill="#666666" text-anchor="middle">loaded by next dev, next build and next start (and by loadEnvConfig from @next/env)</text>

  <!-- Arrows from sources -->
  <line x1="130" y1="124" x2="130" y2="152" stroke="#444444" stroke-width="1.4"/>
  <polygon points="130,158 125,148 135,148" fill="#444444"/>
  <line x1="380" y1="124" x2="380" y2="152" stroke="#444444" stroke-width="1.4"/>
  <polygon points="380,158 375,148 385,148" fill="#444444"/>
  <line x1="630" y1="124" x2="630" y2="152" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="630,158 625,148 635,148" fill="#444444"/>

  <!-- Column 1: build -->
  <rect x="20" y="160" width="220" height="190" fill="#ffffff" stroke="#7a4a00" stroke-width="1.8"/>
  <rect x="20" y="160" width="220" height="28" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.8"/>
  <text x="130" y="179" font-size="13" font-weight="bold" fill="#7a4a00" text-anchor="middle">next build</text>
  <text x="34" y="210" font-size="12" fill="#222222">NEXT_PUBLIC_* references are</text>
  <text x="34" y="226" font-size="12" fill="#222222">replaced by their literal value</text>
  <text x="34" y="242" font-size="12" fill="#222222">in every client chunk.</text>
  <text x="34" y="268" font-size="12" fill="#222222">Prerendered routes read the</text>
  <text x="34" y="284" font-size="12" fill="#222222">server variables once, so the</text>
  <text x="34" y="300" font-size="12" fill="#222222">value is baked into the HTML.</text>
  <text x="34" y="332" font-size="11" fill="#7a4a00" font-weight="bold">Frozen until the next build</text>

  <!-- Column 2: server runtime -->
  <rect x="270" y="160" width="220" height="190" fill="#ffffff" stroke="#1c4b73" stroke-width="1.8"/>
  <rect x="270" y="160" width="220" height="28" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="380" y="179" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">next start (request time)</text>
  <text x="284" y="210" font-size="12" fill="#222222">Dynamic routes, Route Handlers</text>
  <text x="284" y="226" font-size="12" fill="#222222">and Server Actions read the</text>
  <text x="284" y="242" font-size="12" fill="#222222">live process.env of the server.</text>
  <text x="284" y="268" font-size="12" fill="#222222">A request-time API such as</text>
  <text x="284" y="284" font-size="12" fill="#222222">connection() (or cookies(),</text>
  <text x="284" y="300" font-size="12" fill="#222222">headers()) opts the read in.</text>
  <text x="284" y="332" font-size="11" fill="#1c4b73" font-weight="bold">One image, many environments</text>

  <!-- Column 3: browser -->
  <rect x="520" y="160" width="220" height="190" fill="#ffffff" stroke="#444444" stroke-width="1.8"/>
  <rect x="520" y="160" width="220" height="28" fill="#f4f4f4" stroke="#444444" stroke-width="1.8"/>
  <text x="630" y="179" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="534" y="210" font-size="12" fill="#222222">Has no process.env of its own.</text>
  <text x="534" y="226" font-size="12" fill="#222222">It only sees what the build</text>
  <text x="534" y="242" font-size="12" fill="#222222">inlined, or what the server</text>
  <text x="534" y="258" font-size="12" fill="#222222">sends as props, JSON or HTML.</text>
  <text x="534" y="284" font-size="12" fill="#222222">Anything inlined is public:</text>
  <text x="534" y="300" font-size="12" fill="#222222">readable by every visitor.</text>
  <text x="534" y="332" font-size="11" fill="#444444" font-weight="bold">Never a secret</text>

  <!-- Bottom rule -->
  <rect x="20" y="368" width="720" height="52" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="380" y="390" font-size="12" fill="#222222" text-anchor="middle">Secrets and per-environment settings: no prefix, read on the server after a request-time API.</text>
  <text x="380" y="408" font-size="12" fill="#222222" text-anchor="middle">Genuinely public values (publishable keys, analytics ids, base URLs): NEXT_PUBLIC_ prefix, set when you build.</text>
</svg>
