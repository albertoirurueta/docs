<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="tb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker></defs>
<text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One bucket, two bandwidths: an hourly quota and a per-second burst guard</text>
<rect x="30" y="150" width="130" height="70" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="1.5"/>
<text x="95" y="178" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">tryConsume(n)</text>
<text x="95" y="198" font-size="11" fill="#444444" text-anchor="middle">one request,</text>
<text x="95" y="212" font-size="11" fill="#444444" text-anchor="middle">n tokens</text>
<line x1="160" y1="185" x2="215" y2="185" stroke="#1c4b73" stroke-width="2" marker-end="url(#tb-arrow)"/>
<rect x="215" y="55" width="460" height="270" rx="10" fill="#f7f7f7" stroke="#1c4b73" stroke-width="2"/>
<text x="445" y="78" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Bucket (one configuration, one small fixed-size state)</text>
<rect x="235" y="92" width="420" height="95" rx="6" fill="#ffffff" stroke="#b34700" stroke-width="1.6"/>
<text x="249" y="114" font-size="13" font-weight="bold" fill="#b34700">bandwidth id "hourly"</text>
<text x="249" y="132" font-size="11" fill="#444444">capacity(1000).refillGreedy(1000, ofHours(1))</text>
<rect x="249" y="144" width="300" height="16" fill="#eeeeee" stroke="#999999"/>
<rect x="249" y="144" width="270" height="16" fill="#b34700" opacity="0.75"/>
<text x="249" y="178" font-size="11" fill="#444444">tokens left in this bandwidth: 900 of 1000</text>
<rect x="235" y="205" width="420" height="95" rx="6" fill="#ffffff" stroke="#2a7d3f" stroke-width="1.6"/>
<text x="249" y="227" font-size="13" font-weight="bold" fill="#2a7d3f">bandwidth id "burst"</text>
<text x="249" y="245" font-size="11" fill="#444444">capacity(20).refillGreedy(20, ofSeconds(1))</text>
<rect x="249" y="257" width="300" height="16" fill="#eeeeee" stroke="#999999"/>
<rect x="249" y="257" width="60" height="16" fill="#2a7d3f" opacity="0.75"/>
<text x="249" y="291" font-size="11" fill="#444444">tokens left in this bandwidth: 4 of 20</text>
<line x1="675" y1="185" x2="730" y2="185" stroke="#1c4b73" stroke-width="2" marker-end="url(#tb-arrow)"/>
<rect x="730" y="130" width="150" height="110" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="1.5"/>
<text x="805" y="154" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">available tokens</text>
<text x="805" y="176" font-size="12" fill="#222222" text-anchor="middle">= min(900, 4) = 4</text>
<text x="805" y="198" font-size="11" fill="#444444" text-anchor="middle">tryConsume(5) fails,</text>
<text x="805" y="213" font-size="11" fill="#444444" text-anchor="middle">tryConsume(4) succeeds</text>
<text x="445" y="344" font-size="12" fill="#222222" text-anchor="middle">A request is accepted only if every bandwidth holds n tokens, and then the tokens are taken from all of them.</text>
<text x="445" y="364" font-size="12" fill="#222222" text-anchor="middle">The slowest bandwidth decides: a burst cannot empty the hourly quota faster than 20 requests per second.</text>
<text x="445" y="384" font-size="12" fill="#222222" text-anchor="middle">getNanosToWaitForRefill() is the longest wait among the bandwidths that are short of tokens.</text>
<text x="445" y="406" font-size="11" fill="#666666" text-anchor="middle">Bandwidths are checked in one loop, so the cost per request stays constant for a handful of limits.</text>
</svg>