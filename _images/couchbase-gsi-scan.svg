<svg viewBox="0 0 800 352" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="352" fill="#ffffff"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a Global Secondary Index scan answers a SQL++ query</text>
  <text x="400" y="50" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">SELECT name FROM hotel WHERE city = "Paris"</text>

  <!-- Index service lane -->
  <rect x="14" y="70" width="772" height="116" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="24" y="88" font-size="11" font-weight="bold" fill="#1c4b73">INDEX SERVICE &#8226; scans sorted index keys only</text>

  <!-- Data service lane -->
  <rect x="14" y="208" width="772" height="116" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="24" y="226" font-size="11" font-weight="bold" fill="#2f5424">DATA SERVICE &#8226; holds the full JSON documents</text>

  <!-- Box 1: predicate -->
  <rect x="150" y="100" width="210" height="76" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <rect x="150" y="100" width="210" height="22" fill="#1c4b73"/>
  <text x="255" y="116" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1 &#8226; PREDICATE</text>
  <text x="255" y="140" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">city = "Paris"</text>
  <text x="255" y="158" font-size="10" fill="#666666" text-anchor="middle">from the WHERE clause,</text>
  <text x="255" y="171" font-size="10" fill="#666666" text-anchor="middle">planned by the Query service</text>

  <!-- Box 2: index scan -->
  <rect x="430" y="100" width="250" height="76" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <rect x="430" y="100" width="250" height="22" fill="#1c4b73"/>
  <text x="555" y="116" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2 &#8226; IndexScan</text>
  <text x="555" y="140" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">CREATE INDEX ix_city ON hotel(city)</text>
  <text x="555" y="158" font-size="10" fill="#666666" text-anchor="middle">seek + range-walk the B-tree,</text>
  <text x="555" y="171" font-size="10" fill="#666666" text-anchor="middle">emit each index key + document ID</text>

  <!-- arrow 1 -> 2 -->
  <g stroke="#999999" stroke-width="1.6" fill="#999999">
    <line x1="360" y1="138" x2="424" y2="138"/>
    <polygon points="422,133 422,143 430,138" stroke="none"/>
  </g>

  <!-- Box 3: document fetch -->
  <rect x="430" y="238" width="250" height="76" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <rect x="430" y="238" width="250" height="22" fill="#2f5424"/>
  <text x="555" y="254" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3 &#8226; Fetch</text>
  <text x="555" y="278" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">KV get(documentID)</text>
  <text x="555" y="296" font-size="10" fill="#666666" text-anchor="middle">load the full document to read</text>
  <text x="555" y="309" font-size="10" fill="#666666" text-anchor="middle">fields the index does not carry</text>

  <!-- arrow 2 -> 3 -->
  <g stroke="#999999" stroke-width="1.6" fill="#999999">
    <line x1="555" y1="176" x2="555" y2="232"/>
    <polygon points="550,230 560,230 555,238" stroke="none"/>
  </g>
  <text x="566" y="200" font-size="10" fill="#666666" text-anchor="start">index key + document ID,</text>
  <text x="566" y="214" font-size="10" fill="#666666" text-anchor="start">one KV lookup per matching row</text>

  <!-- Box 4: result -->
  <rect x="150" y="238" width="210" height="76" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <rect x="150" y="238" width="210" height="22" fill="#2f5424"/>
  <text x="255" y="254" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4 &#8226; ROW</text>
  <text x="255" y="278" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">{ "name": "Grand Hotel" }</text>
  <text x="255" y="296" font-size="10" fill="#666666" text-anchor="middle">projected and returned</text>
  <text x="255" y="309" font-size="10" fill="#666666" text-anchor="middle">to the client</text>

  <!-- arrow 3 -> 4 -->
  <g stroke="#999999" stroke-width="1.6" fill="#999999">
    <line x1="430" y1="276" x2="362" y2="276"/>
    <polygon points="364,271 364,281 356,276" stroke="none"/>
  </g>

  <text x="400" y="344" font-size="11" fill="#666666" text-anchor="middle">A covering index carries every projected field, so the query finishes in the Index-service lane &#8212; step 3 is skipped.</text>
</svg>
