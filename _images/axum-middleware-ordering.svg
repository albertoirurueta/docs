<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Same three layers, two ways of adding them</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the outermost layer sees the request first and the response last</text>
  <!-- left: chained .layer() -->
  <text x="235" y="76" font-size="14" font-weight="bold" fill="#b7410e" text-anchor="middle">Router::new()…</text>
  <text x="235" y="94" font-size="13" fill="#222222" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">.layer(A) .layer(B) .layer(C)</text>
  <text x="235" y="112" font-size="12" fill="#666666" text-anchor="middle">each call wraps everything above it: runs bottom to top</text>
  <rect x="45" y="126" width="380" height="290" rx="12" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="235" y="146" font-size="13" font-weight="bold" fill="#b7410e" text-anchor="middle">C (outermost)</text>
  <rect x="85" y="158" width="300" height="222" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="235" y="178" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">B</text>
  <rect x="125" y="190" width="220" height="154" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="235" y="210" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">A (innermost)</text>
  <rect x="165" y="224" width="140" height="84" rx="6" fill="#ffffff" stroke="#444444"/>
  <text x="235" y="262" font-size="13" text-anchor="middle" fill="#222222">routes /</text>
  <text x="235" y="280" font-size="13" text-anchor="middle" fill="#222222">handlers</text>
  <text x="235" y="438" font-size="12" text-anchor="middle" fill="#222222">request: C → B → A → handler; response: A → B → C</text>
  <!-- right: ServiceBuilder -->
  <text x="705" y="76" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Router::new()… .layer(</text>
  <text x="705" y="94" font-size="13" fill="#222222" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ServiceBuilder::new().layer(C).layer(B).layer(A))</text>
  <text x="705" y="112" font-size="12" fill="#666666" text-anchor="middle">reads like the request path: runs top to bottom</text>
  <rect x="515" y="126" width="380" height="290" rx="12" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="705" y="146" font-size="13" font-weight="bold" fill="#b7410e" text-anchor="middle">C (first in the builder)</text>
  <rect x="555" y="158" width="300" height="222" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="705" y="178" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">B</text>
  <rect x="595" y="190" width="220" height="154" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="705" y="210" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">A (last in the builder)</text>
  <rect x="635" y="224" width="140" height="84" rx="6" fill="#ffffff" stroke="#444444"/>
  <text x="705" y="262" font-size="13" text-anchor="middle" fill="#222222">routes /</text>
  <text x="705" y="280" font-size="13" text-anchor="middle" fill="#222222">handlers</text>
  <text x="705" y="438" font-size="12" text-anchor="middle" fill="#222222">identical onion: C → B → A → handler</text>
  <line x1="470" y1="70" x2="470" y2="450" stroke="#bbbbbb" stroke-dasharray="5 4"/>
</svg>
