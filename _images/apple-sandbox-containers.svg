<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where FieldNotes keeps its files</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Four separate containers; the app reaches each one through a different API</text>

  <!-- App bundle -->
  <rect x="20" y="66" width="350" height="208" rx="10" fill="#f2f2f2" stroke="#555555" stroke-width="1.6"/>
  <text x="36" y="90" font-size="15" font-weight="bold" fill="#333333">App bundle (read-only, signed)</text>
  <text x="36" y="108" font-size="13" fill="#666666">Bundle.main.bundleURL</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#222222">
    <text x="36" y="134">FieldNotes.app/</text>
    <text x="52" y="154">├─ FieldNotes (executable)</text>
    <text x="52" y="174">├─ Info.plist</text>
    <text x="52" y="194">├─ Assets.car, Localizable strings</text>
    <text x="52" y="214">├─ PlugIns/FieldNotesWidgets.appex</text>
    <text x="52" y="234">└─ PrivacyInfo.xcprivacy</text>
  </g>
  <text x="36" y="262" font-size="13" fill="#a33333">Replaced on every update: never write here</text>

  <!-- Data container -->
  <rect x="390" y="66" width="350" height="248" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="406" y="90" font-size="15" font-weight="bold" fill="#1c4b73">App data container</text>
  <text x="406" y="108" font-size="13" fill="#666666">URL.homeDirectory (sandboxed)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#222222">
    <text x="406" y="134">Documents/</text>
    <text x="406" y="154">Library/</text>
    <text x="422" y="174">├─ Application Support/</text>
    <text x="422" y="194">├─ Caches/</text>
    <text x="422" y="214">└─ Preferences/ (UserDefaults)</text>
    <text x="406" y="234">tmp/</text>
  </g>
  <rect x="610" y="122" width="12" height="12" fill="#2d6a34"/>
  <rect x="640" y="162" width="12" height="12" fill="#2d6a34"/>
  <rect x="580" y="182" width="12" height="12" fill="#c77700"/>
  <rect x="690" y="202" width="12" height="12" fill="#2d6a34"/>
  <rect x="460" y="222" width="12" height="12" fill="#c77700"/>
  <text x="406" y="262" font-size="13" fill="#333333">Documents: user-visible files (Files app when</text>
  <text x="406" y="280" font-size="13" fill="#333333">file sharing is on). Application Support: the</text>
  <text x="406" y="298" font-size="13" fill="#333333">app's own data. Caches and tmp: re-creatable.</text>

  <!-- App Group container -->
  <rect x="20" y="294" width="350" height="226" rx="10" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.6"/>
  <text x="36" y="318" font-size="15" font-weight="bold" fill="#5b3a8c">App Group container</text>
  <text x="36" y="336" font-size="13" fill="#666666">group.com.example.fieldnotes</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#222222">
    <text x="36" y="362">Library/</text>
    <text x="52" y="382">├─ Application Support/</text>
    <text x="68" y="402">└─ FieldNotes.store (SwiftData)</text>
    <text x="52" y="422">├─ Caches/Thumbnails/</text>
    <text x="52" y="442">└─ Preferences/ (fieldNotesShared)</text>
    <text x="36" y="462">Exports/</text>
  </g>
  <rect x="330" y="390" width="12" height="12" fill="#2d6a34"/>
  <rect x="236" y="410" width="12" height="12" fill="#c77700"/>
  <text x="36" y="490" font-size="13" fill="#333333">Shared by the app, its widgets and extensions;</text>
  <text x="36" y="508" font-size="13" fill="#333333">reached with containerURL(forSecurity...)</text>

  <!-- iCloud container -->
  <rect x="390" y="334" width="350" height="186" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="406" y="358" font-size="15" font-weight="bold" fill="#2d6a34">iCloud container</text>
  <text x="406" y="376" font-size="13" fill="#666666">iCloud.com.example.fieldnotes</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#222222">
    <text x="406" y="402">Documents/ (iCloud Drive)</text>
    <text x="422" y="422">└─ Trip 2026.fieldnotes</text>
  </g>
  <text x="406" y="450" font-size="13" fill="#333333">Synced by iCloud, not by backup. CloudKit</text>
  <text x="406" y="468" font-size="13" fill="#333333">records for SwiftData sync live on the</text>
  <text x="406" y="486" font-size="13" fill="#333333">server, not in this folder (see page 22).</text>
  <text x="406" y="506" font-size="13" fill="#666666">url(forUbiquityContainerIdentifier:)</text>

  <!-- Legend -->
  <rect x="20" y="540" width="720" height="44" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <rect x="40" y="556" width="12" height="12" fill="#2d6a34"/>
  <text x="60" y="567" font-size="13" fill="#333333">included in iCloud and device backups</text>
  <rect x="320" y="556" width="12" height="12" fill="#c77700"/>
  <text x="340" y="567" font-size="13" fill="#333333">never backed up; the system may purge it when space is low</text>
</svg>
