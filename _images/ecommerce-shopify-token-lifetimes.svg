<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="t">Lifetimes of the credentials used by a Shopify app</title>
  <desc id="d">Horizontal bars on a logarithmic time axis: ID token 1 minute, expiring offline access token 1 hour, online access token 24 hours, client credentials token 24 hours, refresh token 90 days, non-expiring offline token with no expiry, delegate token inheriting its parent.</desc>

  <text x="20" y="28" font-size="16" font-weight="700">Credential lifetimes (logarithmic time axis)</text>

  <!-- axis ticks: x = 250 + (log10(s) - 1.477) / 5.523 * 470 -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-width="1">
    <line x1="276" y1="50" x2="276" y2="318"/>
    <line x1="427" y1="50" x2="427" y2="318"/>
    <line x1="545" y1="50" x2="545" y2="318"/>
    <line x1="670" y1="50" x2="670" y2="318"/>
    <line x1="711" y1="50" x2="711" y2="318"/>
  </g>
  <g font-size="12" text-anchor="middle" fill-opacity="0.8">
    <text x="276" y="336">1 min</text>
    <text x="427" y="336">1 h</text>
    <text x="545" y="336">1 day</text>
    <text x="670" y="336">30 days</text>
    <text x="711" y="352">90 days</text>
  </g>

  <g font-size="13" text-anchor="end">
    <text x="240" y="76">ID token (App Bridge)</text>
    <text x="240" y="116">Expiring offline access token</text>
    <text x="240" y="156">Refresh token (expiring offline)</text>
    <text x="240" y="196">Online access token</text>
    <text x="240" y="236">Client credentials token</text>
    <text x="240" y="276">Non-expiring offline token</text>
    <text x="240" y="316">Delegate access token</text>
  </g>

  <g fill="#5b8def" fill-opacity="0.35" stroke="#5b8def" stroke-width="1.5">
    <rect x="250" y="62" width="26" height="20" rx="3"/>
    <rect x="250" y="102" width="177" height="20" rx="3"/>
    <rect x="250" y="142" width="461" height="20" rx="3"/>
    <rect x="250" y="182" width="295" height="20" rx="3"/>
    <rect x="250" y="222" width="295" height="20" rx="3"/>
  </g>
  <g fill="#e0902f" fill-opacity="0.25" stroke="#e0902f" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="250" y="262" width="470" height="20" rx="3"/>
    <rect x="250" y="302" width="177" height="20" rx="3"/>
  </g>

  <g font-size="12">
    <text x="284" y="77">1 minute</text>
    <text x="435" y="117">1 hour (expires_in 3600)</text>
    <text x="258" y="157">90 days, replaced by a new token on every refresh</text>
    <text x="258" y="197">24 h, or until the user logs out of the admin</text>
    <text x="258" y="237">24 h (expires_in 86399)</text>
    <text x="258" y="277">no expiry until uninstall or secret revoked</text>
    <text x="435" y="317">at most the parent token's remaining lifetime</text>
  </g>
</svg>
