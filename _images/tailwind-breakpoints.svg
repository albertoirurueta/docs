<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Tailwind is mobile-first: a prefixed utility applies at its breakpoint and every width above it</text>

  <!-- shaded "applies from here rightward" band, anchored at md -->
  <rect x="250" y="70" width="470" height="120" fill="#e3f0e0" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="485" y="92" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">md:* utilities apply from here rightward &#8594;</text>

  <!-- number line -->
  <line x1="55" y1="150" x2="735" y2="150" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- base tick at 0 -->
  <line x1="70" y1="138" x2="70" y2="162" stroke="#1c4b73" stroke-width="2"/>
  <text x="70" y="128" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">base</text>
  <text x="70" y="180" font-size="11" fill="#444444" text-anchor="middle">0</text>
  <text x="70" y="196" font-size="11" fill="#444444" text-anchor="middle">(all sizes)</text>

  <!-- sm 40rem / 640px -->
  <line x1="180" y1="138" x2="180" y2="162" stroke="#1c4b73" stroke-width="2"/>
  <text x="180" y="128" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">sm</text>
  <text x="180" y="180" font-size="11" fill="#444444" text-anchor="middle">40rem</text>
  <text x="180" y="196" font-size="11" fill="#444444" text-anchor="middle">640px</text>

  <!-- md 48rem / 768px -->
  <line x1="290" y1="138" x2="290" y2="162" stroke="#4a7a3a" stroke-width="3"/>
  <text x="290" y="128" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">md</text>
  <text x="290" y="180" font-size="11" fill="#444444" text-anchor="middle">48rem</text>
  <text x="290" y="196" font-size="11" fill="#444444" text-anchor="middle">768px</text>

  <!-- lg 64rem / 1024px -->
  <line x1="425" y1="138" x2="425" y2="162" stroke="#1c4b73" stroke-width="2"/>
  <text x="425" y="128" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">lg</text>
  <text x="425" y="180" font-size="11" fill="#444444" text-anchor="middle">64rem</text>
  <text x="425" y="196" font-size="11" fill="#444444" text-anchor="middle">1024px</text>

  <!-- xl 80rem / 1280px -->
  <line x1="560" y1="138" x2="560" y2="162" stroke="#1c4b73" stroke-width="2"/>
  <text x="560" y="128" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">xl</text>
  <text x="560" y="180" font-size="11" fill="#444444" text-anchor="middle">80rem</text>
  <text x="560" y="196" font-size="11" fill="#444444" text-anchor="middle">1280px</text>

  <!-- 2xl 96rem / 1536px -->
  <line x1="695" y1="138" x2="695" y2="162" stroke="#1c4b73" stroke-width="2"/>
  <text x="695" y="128" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2xl</text>
  <text x="695" y="180" font-size="11" fill="#444444" text-anchor="middle">96rem</text>
  <text x="695" y="196" font-size="11" fill="#444444" text-anchor="middle">1536px</text>

  <text x="380" y="240" font-size="12" fill="#444444" text-anchor="middle">Each breakpoint maps to @media (width &gt;= value). Unprefixed utilities target the smallest screens;</text>
  <text x="380" y="258" font-size="12" fill="#444444" text-anchor="middle">add sm: / md: / lg: / xl: / 2xl: to layer overrides on at progressively wider viewports.</text>
  <text x="380" y="282" font-size="11.5" fill="#8a3d10" text-anchor="middle">Gotcha: sm: means "&#8805; 640px", not "small screens" &#8212; style mobile with the unprefixed utility.</text>
</svg>
