<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: a Bookshelf launch brainstorm</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: create -->
  <rect x="30" y="100" width="104" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="42" y="116" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="42" y="176" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="82" y="146" font-size="11" fill="#374151" text-anchor="middle">Slide page</text><text x="82" y="206" font-size="11" fill="#374151" text-anchor="middle">Whiteboard</text>
  <!-- panel 2: sticky notes -->
  <rect x="182" y="100" width="104" height="140" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <g fill="#FEF3C7" stroke="#B45309"><rect x="194" y="112" width="38" height="34"/><rect x="238" y="112" width="38" height="34"/><rect x="194" y="154" width="38" height="34"/><rect x="238" y="154" width="38" height="34"/><rect x="216" y="196" width="38" height="34"/></g>
  <!-- panel 3: sort and react -->
  <rect x="334" y="100" width="104" height="140" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="342" y="108" width="88" height="62" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3"/>
  <g fill="#FEF3C7" stroke="#B45309"><rect x="350" y="116" width="32" height="28"/><rect x="390" y="116" width="32" height="28"/></g>
  <rect x="356" y="178" width="60" height="20" rx="10" fill="#4F46E5"/><text x="386" y="192" font-size="11" fill="#FFFFFF" text-anchor="middle">Sort</text>
  <circle cx="370" cy="220" r="8" fill="#FEF3C7" stroke="#B45309"/><circle cx="392" cy="220" r="8" fill="#FEF3C7" stroke="#B45309"/><circle cx="414" cy="220" r="8" fill="#FEF3C7" stroke="#B45309"/>
  <!-- panel 4: timer -->
  <rect x="486" y="100" width="104" height="140" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <circle cx="538" cy="160" r="32" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="538" y="166" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">5:00</text>
  <rect x="506" y="206" width="64" height="20" rx="10" fill="#4F46E5"/><text x="538" y="220" font-size="11" fill="#FFFFFF" text-anchor="middle">Play</text>
  <!-- panel 5: result -->
  <rect x="636" y="100" width="96" height="140" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="684" y="130" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Launch plan</text>
  <g fill="#FFFFFF" stroke="#B45309"><rect x="648" y="142" width="72" height="18" rx="3"/><rect x="648" y="166" width="72" height="18" rx="3"/><rect x="648" y="190" width="72" height="18" rx="3"/></g>
  <text x="684" y="226" font-size="11" fill="#92400E" text-anchor="middle">Share, then export</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Expand a slide</text><text x="82" y="338">to a whiteboard</text><text x="234" y="322">Add one sticky note</text><text x="234" y="338">per idea (S)</text><text x="386" y="322">Cluster, sort and</text><text x="386" y="338">react to the notes</text><text x="538" y="322">Time-box the</text><text x="538" y="338">session</text><text x="684" y="322">Launch plan</text><text x="684" y="338">ready to share</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic whiteboard, not a screenshot of any product.</text>
</svg>
