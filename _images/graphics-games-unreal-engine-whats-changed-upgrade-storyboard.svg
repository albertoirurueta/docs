<svg viewBox="0 0 760 376" width="760" height="376" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="376" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: moving a UE4 project to Unreal Engine 5.8</text>
<rect x="24" y="46" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="44" cy="66" r="11" fill="#4F46E5"/>
<text x="44" y="70.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="64" y="71" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Back up first</text>
<rect x="40" y="90" width="192" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="136.0" y="116" font-size="11.5" fill="#3730A3" text-anchor="middle" font-weight="bold">Commit to source control.</text>
<text x="136.0" y="154" font-size="11" fill="#374151" text-anchor="middle">Keep the old project</text>
<text x="136.0" y="170" font-size="11" fill="#374151" text-anchor="middle">openable in its engine.</text>
<line x1="248" y1="119.0" x2="262" y2="119.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="262" y="46" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="282" cy="66" r="11" fill="#B45309"/>
<text x="282" y="70.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="302" y="71" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Open a Copy</text>
<rect x="278" y="90" width="192" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="374.0" y="116" font-size="11.5" fill="#92400E" text-anchor="middle" font-weight="bold">Open it with UE 5.8.</text>
<text x="374.0" y="154" font-size="11" fill="#374151" text-anchor="middle">Choose Open a Copy, not</text>
<text x="374.0" y="170" font-size="11" fill="#374151" text-anchor="middle">Convert in-place.</text>
<line x1="486" y1="119.0" x2="500" y2="119.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="46" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="520" cy="66" r="11" fill="#4F46E5"/>
<text x="520" y="70.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="540" y="71" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Fix the build</text>
<rect x="516" y="90" width="192" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="612.0" y="116" font-size="11.5" fill="#3730A3" text-anchor="middle" font-weight="bold">Regenerate project files.</text>
<text x="612.0" y="154" font-size="11" fill="#374151" text-anchor="middle">Compile the modules</text>
<text x="612.0" y="170" font-size="11" fill="#374151" text-anchor="middle">and fix the deprecations.</text>
<rect x="24" y="206" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="44" cy="226" r="11" fill="#4F46E5"/>
<text x="44" y="230.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="64" y="231" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Replace old systems</text>
<rect x="40" y="250" width="192" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="136.0" y="276" font-size="11.5" fill="#3730A3" text-anchor="middle" font-weight="bold">Cascade to Niagara.</text>
<text x="136.0" y="314" font-size="11" fill="#374151" text-anchor="middle">World Composition to World</text>
<text x="136.0" y="330" font-size="11" fill="#374151" text-anchor="middle">Partition, legacy to Enhanced Input.</text>
<line x1="248" y1="279.0" x2="262" y2="279.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="262" y="206" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="282" cy="226" r="11" fill="#4F46E5"/>
<text x="282" y="230.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="302" y="231" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Move the lighting</text>
<rect x="278" y="250" width="192" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="374.0" y="276" font-size="11.5" fill="#3730A3" text-anchor="middle" font-weight="bold">Lumen and VSM.</text>
<text x="374.0" y="314" font-size="11" fill="#374151" text-anchor="middle">Set them in Project Settings,</text>
<text x="374.0" y="330" font-size="11" fill="#374151" text-anchor="middle">then check every level.</text>
<line x1="486" y1="279.0" x2="500" y2="279.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="206" width="224" height="146" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="520" cy="226" r="11" fill="#4F46E5"/>
<text x="520" y="230.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="540" y="231" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Package and test</text>
<rect x="516" y="250" width="192" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="612.0" y="276" font-size="11.5" fill="#3730A3" text-anchor="middle" font-weight="bold">Package for each target.</text>
<text x="612.0" y="314" font-size="11" fill="#374151" text-anchor="middle">Test on each device,</text>
<text x="612.0" y="330" font-size="11" fill="#374151" text-anchor="middle">then profile.</text>
</svg>
