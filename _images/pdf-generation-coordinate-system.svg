<svg viewBox="0 0 900 480" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="cs-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">PDF user space: origin bottom-left, y grows upwards, and cm moves the origin</text>

  <!-- Page (A4, scaled 0.45): 595 x 842 -> 268 x 379 -->
  <rect x="70" y="50" width="268" height="379" fill="#f5f9ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="204" y="446" text-anchor="middle" font-size="12" fill="#1f5fa6">A4 page: 595 x 842 points (1 pt = 1/72 inch)</text>

  <!-- Page axes -->
  <line x1="70" y1="429" x2="360" y2="429" stroke="#555" stroke-width="1.5" marker-end="url(#cs-arrow)"/>
  <line x1="70" y1="429" x2="70" y2="38" stroke="#555" stroke-width="1.5" marker-end="url(#cs-arrow)"/>
  <text x="364" y="433" font-size="12" font-weight="700" fill="#333">x</text>
  <text x="62" y="42" text-anchor="end" font-size="12" font-weight="700" fill="#333">y</text>
  <circle cx="70" cy="429" r="3.5" fill="#1a1a1a"/>
  <text x="76" y="424" font-size="11" fill="#333">(0, 0)</text>
  <text x="62" y="428" text-anchor="end" font-size="11" fill="#333">origin</text>

  <!-- Rectangle at (100,600) w 200 h 80 in user space: scaled -->
  <rect x="115" y="94" width="90" height="36" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="160" y="116" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">rectangle</text>
  <text x="120" y="88" font-size="11" fill="#2b7a2b">x=100 y=600 w=200 h=80</text>

  <!-- Translated + rotated frame after cm -->
  <g transform="translate(205 330) rotate(-30)">
    <rect x="0" y="-36" width="90" height="36" fill="#fdecea" stroke="#b3261e" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="120" y2="0" stroke="#b3261e" stroke-width="1.5" marker-end="url(#cs-arrow-red)"/>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#b3261e" stroke-width="1.5" marker-end="url(#cs-arrow-red)"/>
    <text x="124" y="4" font-size="11" font-weight="700" fill="#b3261e">x'</text>
    <text x="-4" y="-84" text-anchor="end" font-size="11" font-weight="700" fill="#b3261e">y'</text>
    <text x="45" y="-14" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">rectangle</text>
  </g>
  <circle cx="205" cy="330" r="3.5" fill="#b3261e"/>
  <text x="212" y="348" font-size="11" fill="#b3261e">new origin after cm</text>

  <!-- Right panel: matrix and state stack -->
  <rect x="400" y="50" width="470" height="160" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="416" y="72" font-size="13" font-weight="700" fill="#1f5fa6">Current transformation matrix (CTM)</text>
  <text x="416" y="116" font-size="12" font-family="Courier New, monospace" fill="#333">[x' y' 1] = [x y 1] x</text>
  <text x="600" y="98" font-size="12" font-family="Courier New, monospace" fill="#333">| a b 0 |</text>
  <text x="600" y="116" font-size="12" font-family="Courier New, monospace" fill="#333">| c d 0 |</text>
  <text x="600" y="134" font-size="12" font-family="Courier New, monospace" fill="#333">| e f 1 |</text>
  <text x="416" y="160" font-size="12" fill="#333">concatMatrix(a, b, c, d, e, f) multiplies the CTM; e and f translate,</text>
  <text x="416" y="178" font-size="12" fill="#333">a b c d rotate, scale or skew (rotation by t: a=cos t, b=sin t,</text>
  <text x="416" y="196" font-size="12" fill="#333">c=-sin t, d=cos t).</text>

  <rect x="400" y="228" width="470" height="201" rx="8" fill="#fff4e0" stroke="#b36b00" stroke-width="1.6"/>
  <text x="416" y="247" font-size="13" font-weight="700" fill="#b36b00">Graphics state stack</text>
  <rect x="420" y="262" width="200" height="30" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="520" y="282" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">state 0: page default</text>
  <rect x="420" y="298" width="200" height="30" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="520" y="318" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">state 1: after q + cm</text>
  <rect x="420" y="334" width="200" height="30" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="520" y="354" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">state 2: after q + clip</text>
  <text x="640" y="282" font-size="12" fill="#333">saveState() = q pushes a copy</text>
  <text x="640" y="318" font-size="12" fill="#333">restoreState() = Q pops it:</text>
  <text x="640" y="336" font-size="12" fill="#333">CTM, colours, line style, clip</text>
  <text x="640" y="354" font-size="12" fill="#333">and ExtGState revert together</text>
  <text x="416" y="392" font-size="12" fill="#333">Every q needs a matching Q in the same content stream; the</text>
  <text x="416" y="410" font-size="12" fill="#333">current point and path are not part of the saved state.</text>
</svg>
