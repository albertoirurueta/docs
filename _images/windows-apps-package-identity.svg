<svg viewBox="0 0 760 530" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="530" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What each packaging model gives a desktop app</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Green: available. Grey: not available. Amber: depends on configuration. The text says the same as the colour.</text>
  <rect x="320" y="62" width="140" height="40" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="390" y="87" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Packaged (MSIX)</text>
  <rect x="460" y="62" width="140" height="40" rx="8" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.5"/>
  <text x="530" y="87" font-size="13" font-weight="bold" fill="#9a6200" text-anchor="middle">External location</text>
  <rect x="600" y="62" width="140" height="40" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.5"/>
  <text x="670" y="87" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">Unpackaged</text>
  <text x="20" y="135" font-size="13" fill="#222222">Package identity at runtime</text>
  <rect x="320" y="112" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="133" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="112" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="133" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="112" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="133" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <text x="20" y="175" font-size="13" fill="#222222">Local app notifications</text>
  <rect x="320" y="152" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="173" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="152" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="173" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="152" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="670" y="173" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <text x="20" y="215" font-size="13" fill="#222222">Push notifications: background delivery</text>
  <rect x="320" y="192" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="213" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="192" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="213" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="192" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="213" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <text x="20" y="255" font-size="13" fill="#222222">Share target, context menu, file types</text>
  <rect x="320" y="232" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="253" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="232" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="253" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="232" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="253" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <text x="20" y="295" font-size="13" fill="#222222">Startup task declared in the manifest</text>
  <rect x="320" y="272" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="293" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="272" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="293" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="272" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="293" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <text x="20" y="335" font-size="13" fill="#222222">Windows AI APIs (identity is one gate)</text>
  <rect x="320" y="312" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="333" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="312" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="333" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="312" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="333" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <text x="20" y="375" font-size="13" fill="#222222">Windows App SDK file and folder pickers</text>
  <rect x="320" y="352" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="373" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="460" y="352" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="530" y="373" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <rect x="600" y="352" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="670" y="373" font-size="13" fill="#2d6a34" text-anchor="middle">Yes</text>
  <text x="20" y="415" font-size="13" fill="#222222">Installer and updates</text>
  <rect x="320" y="392" width="140" height="32" rx="6" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="390" y="413" font-size="13" fill="#2d6a34" text-anchor="middle">MSIX</text>
  <rect x="460" y="392" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="530" y="413" font-size="13" fill="#555555" text-anchor="middle">Your own</text>
  <rect x="600" y="392" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="413" font-size="13" fill="#555555" text-anchor="middle">Your own</text>
  <text x="20" y="455" font-size="13" fill="#222222">Runs in a lightweight app container</text>
  <rect x="320" y="432" width="140" height="32" rx="6" fill="#fdf1dc" stroke="#9a6200" stroke-width="1.2"/>
  <text x="390" y="453" font-size="13" fill="#9a6200" text-anchor="middle">Optional</text>
  <rect x="460" y="432" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="530" y="453" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <rect x="600" y="432" width="140" height="32" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="453" font-size="13" fill="#555555" text-anchor="middle">No</text>
  <line x1="20" y1="476" x2="740" y2="476" stroke="#cccccc" stroke-width="1"/>
  <text x="20" y="498" font-size="12" fill="#666666">Unpackaged push notifications work with limited functionality (no background delivery or COM activation).</text>
  <text x="20" y="516" font-size="12" fill="#666666">An external-location app keeps its own binaries and installer; only a small identity package is registered.</text>
</svg>
