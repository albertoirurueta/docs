<svg viewBox="0 0 900 672" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Server-side rendering in the Pages Router and in the App Router</title>
  <desc id="d">Two columns of six steps. Pages Router: the browser requests a page, getServerSideProps runs and returns props, the page renders to HTML, the response carries the HTML and a __NEXT_DATA__ JSON block, the whole page hydrates, and client navigations fetch a JSON data file. App Router: the browser requests a page, Server Components render and await request-time APIs, the static shell and Suspense fallbacks are flushed first, the remaining chunks stream as HTML plus RSC payload, only Client Components hydrate, and client navigations fetch an RSC payload.</desc>
  <defs>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a5b00"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b36"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="672" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One SSR request, two routers</text>
  <text x="450" y="47" font-size="12" fill="#555555" text-anchor="middle">same idea (HTML built per request), different pipeline</text>
  <rect x="30" y="64" width="400" height="44" fill="#9a5b00"/>
  <text x="230.0" y="84" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Pages Router</text>
  <text x="230.0" y="101" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">pages/legacy/shelf.tsx</text>
  <rect x="30" y="130" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="155" font-size="14" font-weight="bold" fill="#5c3500">1. Browser requests the page</text>
  <text x="44" y="176" font-size="12" fill="#333333">GET with the Cookie header</text>
  <line x1="230.0" y1="190" x2="230.0" y2="208" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-p)"/>
  <rect x="30" y="210" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="235" font-size="14" font-weight="bold" fill="#5c3500">2. getServerSideProps(context) runs</text>
  <text x="44" y="256" font-size="12" fill="#333333">req, res, query, params; returns props, redirect or notFound</text>
  <line x1="230.0" y1="270" x2="230.0" y2="288" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-p)"/>
  <rect x="30" y="290" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="315" font-size="14" font-weight="bold" fill="#5c3500">3. Page renders to HTML</text>
  <text x="44" y="336" font-size="12" fill="#333333">the component receives the props, nothing is sent yet</text>
  <line x1="230.0" y1="350" x2="230.0" y2="368" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-p)"/>
  <rect x="30" y="370" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="395" font-size="14" font-weight="bold" fill="#5c3500">4. One response: HTML + __NEXT_DATA__</text>
  <text x="44" y="416" font-size="12" fill="#333333">status and headers set here, e.g. res.setHeader</text>
  <line x1="230.0" y1="430" x2="230.0" y2="448" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-p)"/>
  <rect x="30" y="450" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="475" font-size="14" font-weight="bold" fill="#5c3500">5. Hydrate the whole page</text>
  <text x="44" y="496" font-size="12" fill="#333333">all page JavaScript is downloaded and run</text>
  <line x1="230.0" y1="510" x2="230.0" y2="528" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-p)"/>
  <rect x="30" y="530" width="400" height="60" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="44" y="555" font-size="14" font-weight="bold" fill="#5c3500">6. Client navigation</text>
  <text x="44" y="576" font-size="12" fill="#333333">GET /_next/data/BUILD_ID/page.json (props only)</text>
  <rect x="470" y="64" width="400" height="44" fill="#1e6b36"/>
  <text x="670.0" y="84" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">App Router</text>
  <text x="670.0" y="101" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">app/ssr/shelf/page.tsx</text>
  <rect x="470" y="130" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="155" font-size="14" font-weight="bold" fill="#14411f">1. Browser requests the page</text>
  <text x="484" y="176" font-size="12" fill="#333333">GET with the Cookie header</text>
  <line x1="670.0" y1="190" x2="670.0" y2="208" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="470" y="210" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="235" font-size="14" font-weight="bold" fill="#14411f">2. Server Components render</text>
  <text x="484" y="256" font-size="12" fill="#333333">await cookies(), headers(), searchParams, data</text>
  <line x1="670.0" y1="270" x2="670.0" y2="288" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="470" y="290" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="315" font-size="14" font-weight="bold" fill="#14411f">3. First flush: the shell</text>
  <text x="484" y="336" font-size="12" fill="#333333">with Suspense, fallbacks go first; status and headers are fixed now</text>
  <line x1="670.0" y1="350" x2="670.0" y2="368" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="470" y="370" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="395" font-size="14" font-weight="bold" fill="#14411f">4. Stream: HTML + RSC payload</text>
  <text x="484" y="416" font-size="12" fill="#333333">dynamic parts arrive as each Suspense boundary resolves</text>
  <line x1="670.0" y1="430" x2="670.0" y2="448" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="470" y="450" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="475" font-size="14" font-weight="bold" fill="#14411f">5. Hydrate Client Components only</text>
  <text x="484" y="496" font-size="12" fill="#333333">Server Components ship no JavaScript</text>
  <line x1="670.0" y1="510" x2="670.0" y2="528" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="470" y="530" width="400" height="60" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="484" y="555" font-size="14" font-weight="bold" fill="#14411f">6. Client navigation</text>
  <text x="484" y="576" font-size="12" fill="#333333">GET with RSC: 1, response is text/x-component</text>
  <text x="450" y="624" font-size="12" fill="#555555" text-anchor="middle">Pages Router: all data before any HTML. App Router: shell first, dynamic parts later.</text>
  <text x="450" y="644" font-size="12" fill="#555555" text-anchor="middle">Both run on a Node.js server per request and answer with HTML that the browser then hydrates.</text>
</svg>
