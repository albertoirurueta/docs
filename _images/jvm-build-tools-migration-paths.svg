<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="mpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
<marker id="mpBridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a4500"/></marker>
</defs>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Migration paths between the three tools</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Solid arrows move the build; dashed arrows keep the old build alive as a bridge while the new one grows</text>

<rect x="40" y="170" width="220" height="100" fill="#fff4e0" stroke="#a65e00" stroke-width="1.5"/>
<text x="150" y="205" font-size="16" font-weight="bold" fill="#7a4500" text-anchor="middle">Ant build</text>
<text x="150" y="226" font-size="12" fill="#555555" text-anchor="middle">build.xml, lib/ or Ivy</text>
<text x="150" y="244" font-size="12" fill="#555555" text-anchor="middle">targets, any directory layout</text>

<rect x="370" y="80" width="220" height="100" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="480" y="115" font-size="16" font-weight="bold" fill="#1c4b73" text-anchor="middle">Maven build</text>
<text x="480" y="136" font-size="12" fill="#555555" text-anchor="middle">pom.xml, lifecycle and phases</text>
<text x="480" y="154" font-size="12" fill="#555555" text-anchor="middle">src/main/java layout</text>

<rect x="700" y="170" width="220" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="810" y="205" font-size="16" font-weight="bold" fill="#1b5e20" text-anchor="middle">Gradle build</text>
<text x="810" y="226" font-size="12" fill="#555555" text-anchor="middle">settings and build scripts</text>
<text x="810" y="244" font-size="12" fill="#555555" text-anchor="middle">task graph, version catalog</text>

<rect x="40" y="330" width="220" height="70" fill="#fff4e0" stroke="#a65e00" stroke-dasharray="5,3"/>
<text x="150" y="358" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">Ant with Ivy</text>
<text x="150" y="378" font-size="12" fill="#555555" text-anchor="middle">ivy.xml and ivysettings.xml</text>

<rect x="370" y="330" width="220" height="70" fill="#fff4e0" stroke="#a65e00"/>
<text x="480" y="358" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">Ant with Resolver Ant Tasks</text>
<text x="480" y="378" font-size="12" fill="#555555" text-anchor="middle">Maven coordinates, no ivy.xml</text>

<line x1="260" y1="200" x2="368" y2="150" stroke="#37474f" stroke-width="2" marker-end="url(#mpArrow)"/>
<text x="266" y="136" font-size="12" font-weight="bold" fill="#37474f">Ant to Maven</text>
<text x="266" y="151" font-size="11" fill="#555555">move to the layout</text>

<line x1="590" y1="150" x2="698" y2="200" stroke="#37474f" stroke-width="2" marker-end="url(#mpArrow)"/>
<text x="660" y="136" font-size="12" font-weight="bold" fill="#37474f">Maven to Gradle</text>
<text x="660" y="151" font-size="11" fill="#555555">gradle init</text>

<line x1="260" y1="238" x2="698" y2="238" stroke="#37474f" stroke-width="2" marker-end="url(#mpArrow)"/>
<text x="480" y="230" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">Ant to Gradle</text>
<text x="480" y="256" font-size="11" fill="#555555" text-anchor="middle">ant.importBuild, then replace target by target</text>

<line x1="150" y1="330" x2="150" y2="272" stroke="#37474f" stroke-width="2" marker-end="url(#mpArrow)"/>
<text x="160" y="306" font-size="11" fill="#555555">same build, Ivy inside</text>

<line x1="260" y1="365" x2="368" y2="365" stroke="#37474f" stroke-width="2" marker-end="url(#mpArrow)"/>
<text x="314" y="356" font-size="11" font-weight="bold" fill="#37474f" text-anchor="middle">Ivy to Resolver</text>


<path d="M370,130 C300,100 180,100 150,168" fill="none" stroke="#7a4500" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mpBridge)"/>
<text x="240" y="92" font-size="11" fill="#7a4500" text-anchor="middle">Maven calls Ant: maven-antrun-plugin</text>

<text x="480" y="420" font-size="11" fill="#555555" text-anchor="middle">Resolver Ant Tasks read the same coordinates and repositories as a Maven build</text>
</svg>
