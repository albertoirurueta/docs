<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Nesting options between SwiftUI, UIKit and Compose Multiplatform on iOS</title>
  <desc>Four panels. A: Compose inside SwiftUI through a UIViewControllerRepresentable wrapping ComposeUIViewController. B: Compose inside UIKit as a child view controller of a UITabBarController. C: UIKit and SwiftUI inside Compose through UIKitView and UIKitViewController, with UIHostingController wrapping SwiftUI. D: a native SwiftUI TabView and NavigationStack shell where every screen is a Compose view controller.</desc>
  <defs>
    <marker id="arrKi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Who hosts whom on iOS</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">Compose always enters native UI as a UIViewController; native UI enters Compose through UIKitView or UIKitViewController</text>

  <!-- Panel A -->
  <rect x="20" y="58" width="350" height="220" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="195" y="78" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">A. Compose inside SwiftUI</text>
  <rect x="35" y="90" width="320" height="176" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="45" y="107" font-size="10.5" font-weight="bold" fill="#1c4b73">SwiftUI: ContentView / TabView / NavigationStack</text>
  <rect x="50" y="118" width="290" height="136" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="60" y="135" font-size="10" fill="#1c4b73">ComposeView: UIViewControllerRepresentable</text>
  <rect x="65" y="145" width="260" height="98" rx="6" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="75" y="162" font-size="10" font-weight="bold" fill="#8a5a14">ComposeUIViewController</text>
  <text x="75" y="178" font-size="9.5" fill="#444444">MainViewController() in iosMain</text>
  <rect x="80" y="188" width="230" height="44" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1"/>
  <text x="195" y="214" font-size="10" fill="#333333" text-anchor="middle">App() / TrailListScreen (Compose)</text>

  <!-- Panel B -->
  <rect x="390" y="58" width="350" height="220" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="565" y="78" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">B. Compose inside UIKit</text>
  <rect x="405" y="90" width="320" height="176" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="415" y="107" font-size="10.5" font-weight="bold" fill="#1c4b73">UITabBarController / UINavigationController</text>
  <rect x="420" y="118" width="135" height="136" rx="6" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="487" y="136" font-size="10" font-weight="bold" fill="#8a5a14" text-anchor="middle">Tab 1</text>
  <text x="487" y="153" font-size="9.5" fill="#444444" text-anchor="middle">ComposeUIViewController</text>
  <rect x="432" y="168" width="111" height="70" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1"/>
  <text x="487" y="207" font-size="10" fill="#333333" text-anchor="middle">Compose UI</text>
  <rect x="575" y="118" width="135" height="136" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="642" y="136" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">Tab 2</text>
  <text x="642" y="153" font-size="9.5" fill="#444444" text-anchor="middle">plain UIViewController</text>
  <text x="642" y="200" font-size="10" fill="#333333" text-anchor="middle">native UIKit screen</text>

  <!-- Panel C -->
  <rect x="20" y="292" width="350" height="230" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="195" y="312" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">C. Native views inside Compose</text>
  <rect x="35" y="324" width="320" height="186" rx="6" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.3"/>
  <text x="45" y="341" font-size="10.5" font-weight="bold" fill="#8a5a14">Compose UI (ComposeUIViewController)</text>
  <rect x="50" y="352" width="140" height="146" rx="6" fill="#ffffff" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="120" y="369" font-size="10" font-weight="bold" fill="#8a5a14" text-anchor="middle">UIKitView</text>
  <text x="120" y="384" font-size="9.5" fill="#444444" text-anchor="middle">factory: UIView</text>
  <rect x="62" y="396" width="116" height="90" rx="5" fill="#eef4fa" stroke="#1c4b73" stroke-width="1"/>
  <text x="120" y="437" font-size="10" fill="#1c4b73" text-anchor="middle">MKMapView</text>
  <text x="120" y="451" font-size="9.5" fill="#1c4b73" text-anchor="middle">UITextField, WKWebView</text>
  <rect x="205" y="352" width="140" height="146" rx="6" fill="#ffffff" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="275" y="369" font-size="10" font-weight="bold" fill="#8a5a14" text-anchor="middle">UIKitViewController</text>
  <text x="275" y="384" font-size="9.5" fill="#444444" text-anchor="middle">factory: UIViewController</text>
  <rect x="217" y="396" width="116" height="90" rx="5" fill="#eef4fa" stroke="#1c4b73" stroke-width="1"/>
  <text x="275" y="426" font-size="10" fill="#1c4b73" text-anchor="middle">UIHostingController</text>
  <text x="275" y="441" font-size="9.5" fill="#1c4b73" text-anchor="middle">rootView: SwiftUI Map,</text>
  <text x="275" y="455" font-size="9.5" fill="#1c4b73" text-anchor="middle">Chart, custom view</text>

  <!-- Panel D -->
  <rect x="390" y="292" width="350" height="230" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="565" y="312" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">D. Native shell, Compose screens</text>
  <rect x="405" y="324" width="320" height="186" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="415" y="341" font-size="10.5" font-weight="bold" fill="#1c4b73">SwiftUI TabView (Liquid Glass tab bar)</text>
  <rect x="420" y="350" width="290" height="150" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="430" y="366" font-size="10" fill="#1c4b73">NavigationStack (per tab, owns the back stack)</text>
  <rect x="435" y="376" width="125" height="112" rx="5" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.1"/>
  <text x="497" y="394" font-size="10" font-weight="bold" fill="#8a5a14" text-anchor="middle">Root screen</text>
  <text x="497" y="410" font-size="9.5" fill="#444444" text-anchor="middle">TrailListScreen</text>
  <text x="497" y="425" font-size="9.5" fill="#444444" text-anchor="middle">in a Compose</text>
  <text x="497" y="439" font-size="9.5" fill="#444444" text-anchor="middle">view controller</text>
  <rect x="580" y="376" width="115" height="112" rx="5" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.1"/>
  <text x="637" y="394" font-size="10" font-weight="bold" fill="#8a5a14" text-anchor="middle">Pushed screen</text>
  <text x="637" y="410" font-size="9.5" fill="#444444" text-anchor="middle">TrailDetailScreen</text>
  <text x="637" y="425" font-size="9.5" fill="#444444" text-anchor="middle">another Compose</text>
  <text x="637" y="439" font-size="9.5" fill="#444444" text-anchor="middle">view controller</text>
  <line x1="560" y1="432" x2="578" y2="432" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKi)"/>
</svg>
