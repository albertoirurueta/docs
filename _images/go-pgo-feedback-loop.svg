<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The profile-guided optimization loop</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">the profile comes from a real run; the compiler uses it to decide what to inline and which interface calls to devirtualize</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
  </defs>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="80" width="170" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="109" y="104" font-weight="bold">1. Build and ship</text>
    <text x="109" y="124" font-size="11">go build -pgo=off</text>
    <text x="109" y="139" font-size="11">(first release) or the</text>
    <text x="109" y="154" font-size="11">current PGO build</text>

    <rect x="226" y="80" width="170" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="311" y="104" font-weight="bold">2. Collect profiles</text>
    <text x="311" y="124" font-size="11">representative production</text>
    <text x="311" y="139" font-size="11">load: net/http/pprof</text>
    <text x="311" y="154" font-size="11">or runtime/pprof, 30 s+</text>

    <rect x="428" y="80" width="170" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="513" y="104" font-weight="bold">3. Merge</text>
    <text x="513" y="124" font-size="11">go tool pprof -proto</text>
    <text x="513" y="139" font-size="11">a.pprof b.pprof</text>
    <text x="513" y="154" font-size="11">&gt; default.pgo</text>

    <rect x="630" y="80" width="170" height="92" fill="#fff4e0" stroke="#b26a00"/>
    <text x="715" y="104" font-weight="bold">4. Commit default.pgo</text>
    <text x="715" y="124" font-size="11">next to the main</text>
    <text x="715" y="139" font-size="11">package's source,</text>
    <text x="715" y="154" font-size="11">reviewed like code</text>

    <rect x="742" y="244" width="194" height="92" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="839" y="268" font-weight="bold">5. Rebuild</text>
    <text x="839" y="288" font-size="11">go build (-pgo=auto is</text>
    <text x="839" y="303" font-size="11">the default); hot calls</text>
    <text x="839" y="318" font-size="11">inlined, devirtualized</text>
  </g>

  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="194" y1="126" x2="224" y2="126"/>
    <line x1="396" y1="126" x2="426" y2="126"/>
    <line x1="598" y1="126" x2="628" y2="126"/>
    <path d="M715,172 L715,208 L839,208 L839,242"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#d)" fill="none">
    <path d="M742,290 L109,290 L109,174"/>
  </g>
  <text x="420" y="282" font-size="12" fill="#666666" text-anchor="middle">deploy the new binary and repeat now and then: profiles from a PGO build still work</text>

  <g font-size="12" fill="#444444">
    <text x="24" y="352">What changes: only optimization decisions (inlining budget for hot call sites, devirtualization of</text>
    <text x="24" y="370">hot interface calls, block layout). Program behavior is the same, and a stale profile is safe, only less useful.</text>
  </g>
</svg>
