<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ila-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Creating the Bookshelf instance, step by step</text>
<rect x="20" y="60" width="136" height="180" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/>
<text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="96.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Ask the loader</text>
<text x="88.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">vkEnumerateInstance</text>
<text x="88.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">Version</text>
<text x="88.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">check &gt;= 1.3</text>
<line x1="156" y1="150" x2="171" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-story)"/>
<rect x="171" y="60" width="136" height="180" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="187" cy="76" r="11" fill="#4F46E5"/>
<text x="187" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="247.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">List layers</text>
<text x="239.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">EnumerateInstance</text>
<text x="239.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">LayerProperties</text>
<text x="239.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">find validation</text>
<line x1="307" y1="150" x2="322" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-story)"/>
<rect x="322" y="60" width="136" height="180" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="338" cy="76" r="11" fill="#4F46E5"/>
<text x="338" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="398.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Extensions</text>
<text x="390.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">EnumerateInstance</text>
<text x="390.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">ExtensionProperties</text>
<text x="390.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">window + utils</text>
<line x1="458" y1="150" x2="473" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-story)"/>
<rect x="473" y="60" width="136" height="180" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="489" cy="76" r="11" fill="#4F46E5"/>
<text x="489" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="549.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Fill the chain</text>
<text x="541.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">ApplicationInfo</text>
<text x="541.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">InstanceCreateInfo</text>
<text x="541.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">debug pNext</text>
<line x1="609" y1="150" x2="624" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-story)"/>
<rect x="624" y="60" width="136" height="180" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="640" cy="76" r="11" fill="#B45309"/>
<text x="640" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="700.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create</text>
<text x="692.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">vkCreateInstance</text>
<text x="692.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">check VkResult</text>
<text x="692.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">load functions</text>
<text x="88.0" y="262" text-anchor="middle" font-size="10" fill="#6B7280">1.3 minimum</text>
<text x="239.0" y="262" text-anchor="middle" font-size="10" fill="#6B7280">else LAYER_NOT_PRESENT</text>
<text x="390.0" y="262" text-anchor="middle" font-size="10" fill="#6B7280">else EXTENSION_NOT_PRESENT</text>
<text x="541.0" y="262" text-anchor="middle" font-size="10" fill="#6B7280">messenger in pNext</text>
<text x="692.0" y="262" text-anchor="middle" font-size="10" fill="#6B7280">then instance functions</text>
<text x="380" y="300" text-anchor="middle" font-size="12" fill="#374151">Every step before vkCreateInstance can run without an instance</text>
</svg>
