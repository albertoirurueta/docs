<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What iso_fortran_env provides</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">entities of the module in J3/23-007r1, 16.10.2, grouped by purpose; every one is a named constant, a derived type or a function</text>
  <rect x="20" y="64" width="286" height="224" rx="8" fill="#e8f0fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="163" y="92" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kinds</text>
  <text x="163" y="126" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">int8 int16 int32 int64</text>
  <text x="163" y="156" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">real16 real32 real64 real128</text>
  <text x="163" y="186" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">logical8 .. logical64 (F2023)</text>
  <text x="163" y="216" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">integer_kinds real_kinds</text>
  <text x="163" y="246" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">logical_kinds character_kinds</text>
  <rect x="327" y="64" width="286" height="224" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="470" y="92" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">Units and storage</text>
  <text x="470" y="126" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">input_unit output_unit error_unit</text>
  <text x="470" y="156" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">character_storage_size</text>
  <text x="470" y="186" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">numeric_storage_size</text>
  <text x="470" y="216" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">file_storage_size</text>
  <rect x="634" y="64" width="286" height="224" rx="8" fill="#fde9d3" stroke="#d9772b" stroke-width="1.5"/>
  <text x="777" y="92" font-size="15" font-weight="bold" fill="#d9772b" text-anchor="middle">I/O status codes</text>
  <text x="777" y="126" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">iostat_end iostat_eor</text>
  <text x="777" y="156" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">iostat_inquire_internal_unit</text>
  <rect x="20" y="312" width="286" height="224" rx="8" fill="#f3e8f7" stroke="#7b3f98" stroke-width="1.5"/>
  <text x="163" y="340" font-size="15" font-weight="bold" fill="#7b3f98" text-anchor="middle">Image status codes</text>
  <text x="163" y="374" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">stat_failed_image stat_stopped_image</text>
  <text x="163" y="404" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">stat_locked stat_unlocked</text>
  <text x="163" y="434" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">stat_locked_other_image</text>
  <text x="163" y="464" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">stat_unlocked_failed_image</text>
  <text x="163" y="494" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">atomic_int_kind atomic_logical_kind</text>
  <rect x="327" y="312" width="286" height="224" rx="8" fill="#fff6d6" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="470" y="340" font-size="15" font-weight="bold" fill="#8a6d00" text-anchor="middle">Derived types and teams</text>
  <text x="470" y="374" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">lock_type event_type</text>
  <text x="470" y="404" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">team_type notify_type (F2023)</text>
  <text x="470" y="434" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">initial_team current_team</text>
  <text x="470" y="464" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">parent_team</text>
  <rect x="634" y="312" width="286" height="224" rx="8" fill="#e6f4f4" stroke="#00695c" stroke-width="1.5"/>
  <text x="777" y="340" font-size="15" font-weight="bold" fill="#00695c" text-anchor="middle">Inquiry functions</text>
  <text x="777" y="374" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">compiler_version()</text>
  <text x="777" y="404" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">compiler_options()</text>
  <text x="777" y="434" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">F2028 draft: procedure_name()</text>
  <text x="777" y="464" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">source_file() source_line() max_rank()</text>
  <text x="470" y="548" font-size="11.5" fill="#666666" text-anchor="middle">Import only what is used: use, intrinsic :: iso_fortran_env, only: int64, real64, error_unit</text>
</svg>
