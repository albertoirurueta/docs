<svg viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="460" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Inside the tokio multi-thread runtime</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">tasks are polled by a fixed set of worker threads; blocking work goes to a separate, growable pool</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <!-- global queue -->
  <rect x="300" y="66" width="340" height="40" rx="5" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
  <text x="470" y="91" font-size="13" text-anchor="middle" fill="#a35a00" font-weight="bold">global (injection) queue: tokio::spawn from outside workers</text>
  <!-- workers -->
  <g font-size="12">
    <rect x="40" y="140" width="250" height="150" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="165" y="162" font-weight="bold" fill="#1c4b73" text-anchor="middle">worker thread 1</text>
    <text x="56" y="186" fill="#222222">local run queue:</text>
    <rect x="56" y="194" width="34" height="24" fill="#ffffff" stroke="#1c4b73"/><rect x="92" y="194" width="34" height="24" fill="#ffffff" stroke="#1c4b73"/><rect x="128" y="194" width="34" height="24" fill="#ffffff" stroke="#1c4b73"/>
    <text x="56" y="240" fill="#222222">LIFO slot: task just woken</text>
    <text x="56" y="262" fill="#222222">polls one task at a time until</text>
    <text x="56" y="278" fill="#222222">it returns Pending or Ready</text>

    <rect x="345" y="140" width="250" height="150" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="470" y="162" font-weight="bold" fill="#1c4b73" text-anchor="middle">worker thread 2</text>
    <text x="361" y="186" fill="#222222">local run queue:</text>
    <rect x="361" y="194" width="34" height="24" fill="#ffffff" stroke="#1c4b73"/>
    <text x="361" y="240" fill="#222222">empty? steal half of another</text>
    <text x="361" y="256" fill="#222222">worker's queue, or take from</text>
    <text x="361" y="272" fill="#222222">the global queue</text>

    <rect x="650" y="140" width="250" height="150" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="775" y="162" font-weight="bold" fill="#1c4b73" text-anchor="middle">worker thread N (one per core)</text>
    <text x="666" y="186" fill="#222222">a task that blocks here (CPU loop,</text>
    <text x="666" y="202" fill="#222222">std::thread::sleep, sync I/O) stalls</text>
    <text x="666" y="218" fill="#222222">every task queued on this worker</text>
    <rect x="666" y="232" width="218" height="40" rx="4" fill="#fbeaea" stroke="#c62828"/>
    <text x="775" y="257" fill="#c62828" text-anchor="middle" font-weight="bold">never block a worker</text>
  </g>
  <path d="M245,206 C300,206 320,206 357,206" fill="none" stroke="#444444" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="300" y="132" font-size="11" fill="#444444" text-anchor="middle">work stealing</text>
  <line x1="470" y1="106" x2="470" y2="138" stroke="#a35a00" stroke-width="1.3" marker-end="url(#a)"/>
  <!-- I/O driver -->
  <rect x="40" y="330" width="420" height="96" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="250" y="352" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">I/O driver and timer wheel (the reactor)</text>
  <text x="56" y="376" font-size="12" fill="#222222">epoll / kqueue / IOCP report ready sockets;</text>
  <text x="56" y="394" font-size="12" fill="#222222">timers expire; the waker of each waiting task is called,</text>
  <text x="56" y="412" font-size="12" fill="#222222">which puts the task back on a run queue</text>
  <path d="M250,330 C250,310 165,310 165,292" fill="none" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="270" y="316" font-size="11" fill="#2e7d32">wake</text>
  <!-- blocking pool -->
  <rect x="500" y="330" width="400" height="96" rx="6" fill="#f6ecf8" stroke="#7b1fa2" stroke-width="1.4"/>
  <text x="700" y="352" font-size="13" font-weight="bold" fill="#7b1fa2" text-anchor="middle">blocking pool (up to 512 threads by default)</text>
  <text x="516" y="376" font-size="12" fill="#222222">spawn_blocking(|| hash_password(..)) runs here;</text>
  <text x="516" y="394" font-size="12" fill="#222222">the awaiting task is woken with the result;</text>
  <text x="516" y="412" font-size="12" fill="#222222">also used for tokio::fs and DNS lookups</text>
  <path d="M775,292 C775,312 760,312 760,328" fill="none" stroke="#7b1fa2" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
