<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
<title id="t">Two-stage transfer learning</title>
<desc id="d">Stage 1 freezes the pre-trained base and trains a new head at a normal learning rate; stage 2 unfreezes the base, recompiles and trains everything at a very low learning rate.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="248" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Two-stage transfer learning</text>
<text x="190" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Stage 1: feature extraction</text>
<rect x="30" y="80" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">base model</text>
<text x="105" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">frozen, training=False</text>
<rect x="215" y="80" width="150" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="290" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">new head</text>
<text x="290" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">trained, lr about 1e-3</text>
<line x1="180" y1="110" x2="213" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="540" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Stage 2: fine-tuning</text>
<rect x="400" y="80" width="150" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="475" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">base model</text>
<text x="475" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">unfrozen, BN still inference</text>
<rect x="570" y="80" width="130" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="635" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">head</text>
<text x="635" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">continues training</text>
<line x1="550" y1="110" x2="568" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="365" y1="110" x2="398" y2="110" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="382" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">compile()</text>
<rect x="400" y="170" width="300" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="550" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Recompile after changing trainable;</text>
<text x="550" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">use a very low learning rate (1e-5)</text>
</svg>
