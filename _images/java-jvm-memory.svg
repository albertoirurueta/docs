<svg viewBox="0 0 760 472" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>JVM runtime memory: per-thread stacks of call frames holding locals and references, a shared heap holding objects, and class metadata in metaspace</title>
  <rect x="0" y="0" width="760" height="472" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">JVM runtime memory</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Each thread owns a stack of frames; an object exists once, on the shared heap; class metadata lives in metaspace.</text>

  <defs>
    <marker id="jm-arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#777777"/>
    </marker>
  </defs>

  <!-- ===================== per-thread stacks ===================== -->
  <text x="200" y="70" font-size="12" font-weight="bold" fill="#4a6a8a" text-anchor="middle">Per-thread stacks (locals + references)</text>

  <!-- Thread-1 stack -->
  <rect x="36" y="82" width="164" height="214" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="118" y="98" font-size="10" fill="#4a6a8a" text-anchor="middle" font-style="italic">Thread-1 stack</text>

  <rect x="48" y="108" width="140" height="86" fill="#ffffff" stroke="#4a6a8a" stroke-width="1" rx="3"/>
  <text x="56" y="123" font-size="8.5" fill="#4a6a8a" font-family="'Courier New', monospace">transfer() frame</text>
  <text x="56" y="140" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">int cents = 2500</text>
  <text x="56" y="157" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">Account from  &#9679;</text>
  <text x="56" y="174" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">Account to    &#9679;</text>

  <rect x="48" y="200" width="140" height="70" fill="#ffffff" stroke="#4a6a8a" stroke-width="1" rx="3"/>
  <text x="56" y="215" font-size="8.5" fill="#4a6a8a" font-family="'Courier New', monospace">main() frame</text>
  <text x="56" y="232" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">String[] args &#9679;</text>
  <text x="56" y="249" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">Account a     &#9679;</text>

  <!-- Thread-2 stack -->
  <rect x="216" y="82" width="164" height="214" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="298" y="98" font-size="10" fill="#4a6a8a" text-anchor="middle" font-style="italic">Thread-2 stack</text>

  <rect x="228" y="108" width="140" height="72" fill="#ffffff" stroke="#4a6a8a" stroke-width="1" rx="3"/>
  <text x="236" y="123" font-size="8.5" fill="#4a6a8a" font-family="'Courier New', monospace">run() frame</text>
  <text x="236" y="140" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">long i = 42</text>
  <text x="236" y="157" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">Account acct  &#9679;</text>

  <!-- ===================== shared heap ===================== -->
  <rect x="430" y="76" width="298" height="250" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.5" rx="6"/>
  <text x="579" y="94" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">Shared heap (objects)</text>

  <rect x="450" y="106" width="256" height="50" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.1" rx="3"/>
  <text x="460" y="124" font-size="8.5" fill="#5a8a4a" font-family="'Courier New', monospace">Account @A</text>
  <text x="460" y="141" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">owner = "Ada"   balanceCents = 12500</text>

  <rect x="450" y="176" width="256" height="50" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.1" rx="3"/>
  <text x="460" y="194" font-size="8.5" fill="#5a8a4a" font-family="'Courier New', monospace">Account @B</text>
  <text x="460" y="211" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">owner = "Bo"    balanceCents = 600</text>

  <rect x="450" y="246" width="256" height="50" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.1" rx="3"/>
  <text x="460" y="264" font-size="8.5" fill="#5a8a4a" font-family="'Courier New', monospace">String[] @C</text>
  <text x="460" y="281" font-size="8.5" fill="#333333" font-family="'Courier New', monospace">[ "alpha", "beta" ]</text>

  <!-- ===================== reference arrows ===================== -->
  <!-- transfer.from -> Account @A -->
  <path d="M175 152 C 300 148, 360 130, 448 130" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#jm-arrow)"/>
  <!-- transfer.to -> Account @B -->
  <path d="M175 169 C 300 200, 362 200, 448 200" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#jm-arrow)"/>
  <!-- main.a -> Account @A -->
  <path d="M175 244 C 330 250, 366 150, 448 140" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#jm-arrow)"/>
  <!-- main.args -> String[] @C -->
  <path d="M175 227 C 300 300, 360 270, 448 270" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#jm-arrow)"/>
  <!-- thread2.acct -> Account @B -->
  <path d="M360 152 C 396 165, 414 194, 448 202" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#jm-arrow)"/>

  <text x="380" y="316" font-size="8.5" fill="#777777" text-anchor="middle" font-style="italic">&#9679; = a reference slot; each arrow means "points to this heap object". Primitives (int, long) sit in the frame itself.</text>

  <!-- ===================== metaspace ===================== -->
  <rect x="36" y="360" width="692" height="92" fill="#f1eef6" stroke="#6a4a8a" stroke-width="1.3" rx="6"/>
  <text x="52" y="382" font-size="12" font-weight="bold" fill="#3a1f52">Metaspace</text>
  <text x="52" y="402" font-size="9" fill="#333333" font-family="'Courier New', monospace">class metadata: Account.class, String.class, ...  (loaded once per class loader)</text>
  <text x="52" y="419" font-size="9" fill="#333333" font-family="'Courier New', monospace">method bytecode  &#183;  static fields (e.g. Account.created)  &#183;  runtime constant pool</text>
  <text x="52" y="436" font-size="9" fill="#333333" font-family="'Courier New', monospace">a heap object holds a header pointer to its class metadata here</text>

  <path d="M470 326 L470 358" fill="none" stroke="#6a4a8a" stroke-width="1.3" marker-end="url(#jm-arrow)"/>
  <text x="478" y="346" font-size="9" fill="#6a4a8a">class metadata &#8594; metaspace</text>
</svg>
