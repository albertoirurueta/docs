<svg viewBox="0 0 700 585" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="585" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Messaging protocol support: Apache Kafka vs. RabbitMQ</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">checked against each project's own protocol documentation, not either vendor's comparison of the other</text>

  <!-- header row -->
  <rect x="20" y="58" width="220" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="240" y="58" width="215" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="455" y="58" width="215" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="30" y="79" font-size="12" font-weight="bold" fill="#222222">Protocol</text>
  <text x="347" y="79" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Apache Kafka</text>
  <text x="562" y="79" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">RabbitMQ</text>

  <!-- row backgrounds (protocol name column) -->
  <!-- Row 1: AMQP 0-9-1 (90-136) -->
  <rect x="20" y="90" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="90" width="215" height="46" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="455" y="90" width="215" height="46" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="30" y="118" font-size="11.5" font-weight="bold" fill="#222222">AMQP 0-9-1</text>
  <text x="347" y="117" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Not supported</text>
  <text x="562" y="112" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native</text>
  <text x="562" y="126" font-size="9.5" fill="#555555" text-anchor="middle">original protocol</text>

  <!-- Row 2: AMQP 1.0 (136-182) -->
  <rect x="20" y="136" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="136" width="215" height="46" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="455" y="136" width="215" height="46" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="30" y="164" font-size="11.5" font-weight="bold" fill="#222222">AMQP 1.0</text>
  <text x="347" y="163" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Not supported</text>
  <text x="562" y="158" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native</text>
  <text x="562" y="172" font-size="9.5" fill="#555555" text-anchor="middle">core since RabbitMQ 4.0</text>

  <!-- Row 3: Kafka protocol (182-228) -->
  <rect x="20" y="182" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="182" width="215" height="46" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <rect x="455" y="182" width="215" height="46" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <text x="30" y="210" font-size="11.5" font-weight="bold" fill="#222222">Kafka protocol</text>
  <text x="347" y="204" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native</text>
  <text x="347" y="218" font-size="9.5" fill="#555555" text-anchor="middle">the only protocol Kafka speaks</text>
  <text x="562" y="209" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Not supported</text>

  <!-- Row 4: MQTT (228-274) -->
  <rect x="20" y="228" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="228" width="215" height="46" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="455" y="228" width="215" height="46" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="30" y="256" font-size="11.5" font-weight="bold" fill="#222222">MQTT</text>
  <text x="347" y="250" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Not supported*</text>
  <text x="347" y="264" font-size="9.5" fill="#555555" text-anchor="middle">*unofficial bridges only</text>
  <text x="562" y="250" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Plugin</text>
  <text x="562" y="264" font-size="9.5" fill="#555555" text-anchor="middle">v3.1 / 3.1.1 / 5.0</text>

  <!-- Row 5: STOMP (274-320) -->
  <rect x="20" y="274" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="274" width="215" height="46" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="455" y="274" width="215" height="46" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="30" y="302" font-size="11.5" font-weight="bold" fill="#222222">STOMP</text>
  <text x="347" y="301" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Not supported</text>
  <text x="562" y="301" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Plugin</text>

  <!-- Row 6: RabbitMQ Stream protocol (320-366) -->
  <rect x="20" y="320" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="320" width="215" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="455" y="320" width="215" height="46" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="30" y="342" font-size="11.5" font-weight="bold" fill="#222222">RabbitMQ Stream</text>
  <text x="30" y="356" font-size="11.5" font-weight="bold" fill="#222222">protocol</text>
  <text x="347" y="347" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">N/A</text>
  <text x="562" y="342" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Native</text>
  <text x="562" y="356" font-size="9.5" fill="#555555" text-anchor="middle">port 5552 (5551 TLS)</text>

  <!-- Row 7: WebSocket transport (366-412) -->
  <rect x="20" y="366" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="366" width="215" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <rect x="455" y="366" width="215" height="46" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="30" y="388" font-size="11.5" font-weight="bold" fill="#222222">WebSocket</text>
  <text x="30" y="402" font-size="11.5" font-weight="bold" fill="#222222">transport</text>
  <text x="347" y="393" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">N/A</text>
  <text x="562" y="388" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Plugin</text>
  <text x="562" y="402" font-size="9.5" fill="#555555" text-anchor="middle">AMQP 1.0 / MQTT / STOMP</text>

  <!-- Row 8: JMS / Jakarta Messaging (412-458) -->
  <rect x="20" y="412" width="220" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="240" y="412" width="215" height="46" fill="#f3eefa" stroke="#6a3fa0" stroke-width="1.2"/>
  <rect x="455" y="412" width="215" height="46" fill="#f3eefa" stroke="#6a3fa0" stroke-width="1.2"/>
  <text x="30" y="434" font-size="11.5" font-weight="bold" fill="#222222">JMS / Jakarta</text>
  <text x="30" y="448" font-size="11.5" font-weight="bold" fill="#222222">Messaging</text>
  <text x="347" y="434" font-size="11" font-weight="bold" fill="#6a3fa0" text-anchor="middle">API layer</text>
  <text x="347" y="448" font-size="9.5" fill="#555555" text-anchor="middle">3rd-party bridge only</text>
  <text x="562" y="434" font-size="11" font-weight="bold" fill="#6a3fa0" text-anchor="middle">API layer</text>
  <text x="562" y="448" font-size="9.5" fill="#555555" text-anchor="middle">JMS over AMQP 0-9-1</text>

  <!-- outer border -->
  <rect x="20" y="58" width="650" height="400" fill="none" stroke="#666666" stroke-width="1.4"/>

  <!-- legend -->
  <text x="20" y="480" font-size="11" font-weight="bold" fill="#222222">Legend</text>

  <rect x="20" y="490" width="16" height="14" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="42" y="501" font-size="10" fill="#333333">Native to the broker</text>

  <rect x="180" y="490" width="16" height="14" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="202" y="501" font-size="10" fill="#333333">Supported via an official plugin</text>

  <rect x="20" y="512" width="16" height="14" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <text x="42" y="523" font-size="10" fill="#333333">Not supported</text>

  <rect x="180" y="512" width="16" height="14" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="202" y="523" font-size="10" fill="#333333">Not applicable</text>

  <rect x="360" y="512" width="16" height="14" fill="#f3eefa" stroke="#6a3fa0" stroke-width="1.2"/>
  <text x="382" y="523" font-size="10" fill="#333333">API layered over the broker's native protocol</text>

  <text x="350" y="550" font-size="9.5" fill="#777777" text-anchor="middle">JMS/Jakarta Messaging is a Java API specification, not a wire protocol -- a provider implements it on top of</text>
  <text x="350" y="563" font-size="9.5" fill="#777777" text-anchor="middle">whichever protocol the broker actually speaks, so "API layer" here means no dedicated wire format of its own.</text>
</svg>
