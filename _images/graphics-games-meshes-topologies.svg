<text x="245" y="219" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">5</text>
<text x="140" y="245" text-anchor="middle" font-size="11" fill="#374151">indices: 0 1 2 | 3 4 5</text>
<rect x="270" y="50" width="220" height="215" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
