<text x="620" y="245" text-anchor="middle" font-size="11" fill="#374151">indices: 0 1 2 3 4</text>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">Lists need 3n indices; strips and fans need n + 2 but share vertices, and strips need restart indices to break.</text>
<text x="380" y="318" text-anchor="middle" font-size="11" fill="#374151">Fans are not available in Metal, WebGPU or Direct3D 10 and later; use lists or strips there.</text>
</svg>
