<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Core Keras layer families</title>
<desc id="d">Five families of Keras layers with their typical input and output shapes: dense, convolution and pooling, normalization and dropout, embedding and recurrent, and attention.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Core layer families and the shapes they map</text>
<rect x="20" y="60" width="330" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="185" y="82" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Dense</text>
<text x="185" y="100" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(batch, ..., in) -> (batch, ..., units)</text>
<rect x="370" y="60" width="330" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="535" y="82" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Conv2D / pooling</text>
<text x="535" y="100" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(b, H, W, C) -> (b, H', W', filters)</text>
<rect x="20" y="136" width="330" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="185" y="158" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">BatchNorm / LayerNorm / Dropout</text>
<text x="185" y="176" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">shape unchanged</text>
<rect x="370" y="136" width="330" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="535" y="158" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Embedding</text>
<text x="535" y="176" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(b, T) ints -> (b, T, dim)</text>
<rect x="20" y="212" width="330" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="185" y="234" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">LSTM / GRU</text>
<text x="185" y="252" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(b, T, F) -> (b, units) or (b, T, units)</text>
<rect x="370" y="212" width="330" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="535" y="234" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">MultiHeadAttention</text>
<text x="535" y="252" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(b, Tq, D), (b, Tv, D) -> (b, Tq, D)</text>
<text x="360" y="306" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Channels-last layout shown; b is the batch size, T a sequence length.</text>
</svg>
