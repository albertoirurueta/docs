<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where an extension hooks into the Analytics Orders report and its CSV export</title>
  <desc id="d">Two lanes. The live report lane: a JavaScript filter adds a Currency dropdown, which puts a currency parameter in the URL; the REST request for the report reaches PHP, where the query_args filter and the join, where and select clause filters change the SQL; the JSON rows return to the browser, where the report_table filter adds a Currency column and the report_currency filter formats money. The export lane: the export request carries the currency in report_args; the extension remembers it while the REST request is handled and again in each background batch of the woocommerce_admin_report_export action; the same SQL clause filters run; the export columns and prepare export item filters add the Currency column to the CSV file.</desc>
  <rect x="0" y="0" width="1000" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Two lanes, one set of SQL filters</text>
  <g fill="#f2f5f8" font-size="12.5">
    <text x="20" y="62" font-size="14" font-weight="bold">Live report (browser request)</text>
    <rect x="20" y="72" width="220" height="150" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="96" font-weight="bold">1. Dropdown (JavaScript)</text>
    <text x="32" y="118">woocommerce_admin_orders_</text>
    <text x="32" y="134">report_filters adds the list</text>
    <text x="32" y="150">woocommerce_admin_</text>
    <text x="32" y="166">persisted_queries keeps</text>
    <text x="32" y="182">the parameter between tabs</text>
    <text x="32" y="208" fill="#f4b860">URL gets ?currency=USD</text>

    <rect x="270" y="72" width="220" height="150" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="282" y="96" font-weight="bold">2. REST request (PHP)</text>
    <text x="282" y="118">GET wc-analytics/reports/</text>
    <text x="282" y="134">orders and orders/stats</text>
    <text x="282" y="156">woocommerce_analytics_</text>
    <text x="282" y="172">orders_query_args and</text>
    <text x="282" y="188">orders_stats_query_args</text>
    <text x="282" y="208" fill="#f4b860">the cache key changes</text>

    <rect x="520" y="72" width="220" height="150" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="532" y="96" font-weight="bold">3. SQL clauses (PHP)</text>
    <text x="532" y="118">woocommerce_analytics_</text>
    <text x="532" y="134">clauses_join_, where_,</text>
    <text x="532" y="150">select_ followed by</text>
    <text x="532" y="166">orders_subquery,</text>
    <text x="532" y="182">orders_stats_total,</text>
    <text x="532" y="198">orders_stats_interval</text>

    <rect x="770" y="72" width="210" height="150" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="782" y="96" font-weight="bold">4. Table (JavaScript)</text>
    <text x="782" y="118">woocommerce_admin_</text>
    <text x="782" y="134">report_table adds a column</text>
    <text x="782" y="156">woocommerce_admin_</text>
    <text x="782" y="172">report_currency formats</text>
    <text x="782" y="188">money in that currency</text>
    <text x="782" y="208" fill="#f4b860">items.data[i].currency</text>

    <text x="20" y="262" font-size="14" font-weight="bold">CSV export (background request)</text>
    <rect x="20" y="272" width="220" height="150" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="296" font-weight="bold">1. Export request</text>
    <text x="32" y="318">POST reports/orders/export</text>
    <text x="32" y="334">report_args: after, before,</text>
    <text x="32" y="350">and the custom currency</text>
    <text x="32" y="380" fill="#f4b860">unknown arguments are not</text>
    <text x="32" y="396" fill="#f4b860">copied into the query</text>

    <rect x="270" y="272" width="220" height="150" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="282" y="296" font-weight="bold">2. Carry the value (PHP)</text>
    <text x="282" y="318">rest_pre_dispatch reads</text>
    <text x="282" y="334">report_args for the row count</text>
    <text x="282" y="356">woocommerce_admin_report_</text>
    <text x="282" y="372">export, priority 1, reads</text>
    <text x="282" y="388">them in every batch</text>

    <rect x="520" y="272" width="220" height="150" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="532" y="296" font-weight="bold">3. Same SQL clauses</text>
    <text x="532" y="318">the filters of lane one run</text>
    <text x="532" y="334">inside the queue runner,</text>
    <text x="532" y="350">where there is no query</text>
    <text x="532" y="366">string at all</text>

    <rect x="770" y="272" width="210" height="150" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="782" y="296" font-weight="bold">4. CSV columns (PHP)</text>
    <text x="782" y="318">woocommerce_report_orders_</text>
    <text x="782" y="334">export_columns names it</text>
    <text x="782" y="356">woocommerce_report_orders_</text>
    <text x="782" y="372">prepare_export_item fills</text>
    <text x="782" y="388">each row</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="240" y1="147" x2="268" y2="147" marker-end="url(#a)"/>
    <line x1="490" y1="147" x2="518" y2="147" marker-end="url(#a)"/>
    <line x1="740" y1="147" x2="768" y2="147" marker-end="url(#a)"/>
    <line x1="240" y1="347" x2="268" y2="347" marker-end="url(#a)"/>
    <line x1="490" y1="347" x2="518" y2="347" marker-end="url(#a)"/>
    <line x1="740" y1="347" x2="768" y2="347" marker-end="url(#a)"/>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <text x="20" y="460">Lane one is what the Orders screen does. Lane two is what the Download button, the email link and the REST export do.</text>
    <text x="20" y="480">An extension that filters only on the query string works on screen and silently exports everything.</text>
    <text x="20" y="500" fill="#f4b860">Tested on WooCommerce 11.2.1: the two currencies returned 2 and 9 orders, and the CSV for USD held only the two USD rows.</text>
  </g>
</svg>
