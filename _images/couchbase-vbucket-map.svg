<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">vBucket map: 1024 partitions across the cluster</text>

  <defs>
    <marker id="vb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- smart client + cluster map -->
  <rect x="200" y="42" width="360" height="60" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="2"/>
  <text x="380" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">smart client &#8212; holds the cluster map</text>
  <text x="380" y="85" font-size="11" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">CRC32(key) mod 1024 &#8594; vBucket &#8594; owning node</text>

  <!-- routing arrows to the three nodes -->
  <g stroke="#666666" stroke-width="1.6" fill="none">
    <line x1="330" y1="102" x2="135" y2="148" marker-end="url(#vb-arrow)"/>
    <line x1="380" y1="102" x2="380" y2="148" marker-end="url(#vb-arrow)"/>
    <line x1="430" y1="102" x2="625" y2="148" marker-end="url(#vb-arrow)"/>
  </g>
  <text x="500" y="128" font-size="10" fill="#666666" text-anchor="middle">operation sent straight to the vBucket's node</text>

  <!-- ===== Node A ===== -->
  <rect x="25" y="150" width="220" height="252" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="135" y="172" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Node A</text>
  <text x="135" y="186" font-size="9" fill="#666666" text-anchor="middle">Data service</text>

  <rect x="39" y="196" width="192" height="92" rx="4" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="49" y="214" font-size="10" font-weight="bold" fill="#222222">active vBuckets</text>
  <text x="49" y="230" font-size="10" fill="#1c4b73" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#1c4b73">
    <rect x="49" y="238" width="12" height="16"/><rect x="66" y="238" width="12" height="16"/><rect x="83" y="238" width="12" height="16"/><rect x="100" y="238" width="12" height="16"/><rect x="117" y="238" width="12" height="16"/><rect x="134" y="238" width="12" height="16"/><rect x="151" y="238" width="12" height="16"/><rect x="168" y="238" width="12" height="16"/><rect x="185" y="238" width="12" height="16"/><rect x="202" y="238" width="12" height="16"/>
  </g>
  <text x="49" y="272" font-size="8.5" fill="#666666">served to clients</text>

  <rect x="39" y="298" width="192" height="92" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.3"/>
  <text x="49" y="316" font-size="10" font-weight="bold" fill="#222222">replica vBuckets</text>
  <text x="49" y="332" font-size="10" fill="#2f5424" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#ffffff" stroke="#2f5424" stroke-width="1.2">
    <rect x="49" y="340" width="12" height="16"/><rect x="66" y="340" width="12" height="16"/><rect x="83" y="340" width="12" height="16"/><rect x="100" y="340" width="12" height="16"/><rect x="117" y="340" width="12" height="16"/><rect x="134" y="340" width="12" height="16"/><rect x="151" y="340" width="12" height="16"/><rect x="168" y="340" width="12" height="16"/><rect x="185" y="340" width="12" height="16"/><rect x="202" y="340" width="12" height="16"/>
  </g>
  <text x="49" y="374" font-size="8.5" fill="#666666">copies of B's &amp; C's actives</text>

  <!-- ===== Node B ===== -->
  <rect x="270" y="150" width="220" height="252" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="172" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Node B</text>
  <text x="380" y="186" font-size="9" fill="#666666" text-anchor="middle">Data service</text>

  <rect x="284" y="196" width="192" height="92" rx="4" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="294" y="214" font-size="10" font-weight="bold" fill="#222222">active vBuckets</text>
  <text x="294" y="230" font-size="10" fill="#1c4b73" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#1c4b73">
    <rect x="294" y="238" width="12" height="16"/><rect x="311" y="238" width="12" height="16"/><rect x="328" y="238" width="12" height="16"/><rect x="345" y="238" width="12" height="16"/><rect x="362" y="238" width="12" height="16"/><rect x="379" y="238" width="12" height="16"/><rect x="396" y="238" width="12" height="16"/><rect x="413" y="238" width="12" height="16"/><rect x="430" y="238" width="12" height="16"/><rect x="447" y="238" width="12" height="16"/>
  </g>
  <text x="294" y="272" font-size="8.5" fill="#666666">owns vBucket 512</text>

  <rect x="284" y="298" width="192" height="92" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.3"/>
  <text x="294" y="316" font-size="10" font-weight="bold" fill="#222222">replica vBuckets</text>
  <text x="294" y="332" font-size="10" fill="#2f5424" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#ffffff" stroke="#2f5424" stroke-width="1.2">
    <rect x="294" y="340" width="12" height="16"/><rect x="311" y="340" width="12" height="16"/><rect x="328" y="340" width="12" height="16"/><rect x="345" y="340" width="12" height="16"/><rect x="362" y="340" width="12" height="16"/><rect x="379" y="340" width="12" height="16"/><rect x="396" y="340" width="12" height="16"/><rect x="413" y="340" width="12" height="16"/><rect x="430" y="340" width="12" height="16"/><rect x="447" y="340" width="12" height="16"/>
  </g>
  <text x="294" y="374" font-size="8.5" fill="#666666">copies of A's &amp; C's actives</text>

  <!-- ===== Node C ===== -->
  <rect x="515" y="150" width="220" height="252" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="625" y="172" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Node C</text>
  <text x="625" y="186" font-size="9" fill="#666666" text-anchor="middle">Data service</text>

  <rect x="529" y="196" width="192" height="92" rx="4" fill="#eef2f6" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="539" y="214" font-size="10" font-weight="bold" fill="#222222">active vBuckets</text>
  <text x="539" y="230" font-size="10" fill="#1c4b73" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#1c4b73">
    <rect x="539" y="238" width="12" height="16"/><rect x="556" y="238" width="12" height="16"/><rect x="573" y="238" width="12" height="16"/><rect x="590" y="238" width="12" height="16"/><rect x="607" y="238" width="12" height="16"/><rect x="624" y="238" width="12" height="16"/><rect x="641" y="238" width="12" height="16"/><rect x="658" y="238" width="12" height="16"/><rect x="675" y="238" width="12" height="16"/><rect x="692" y="238" width="12" height="16"/>
  </g>
  <text x="539" y="272" font-size="8.5" fill="#666666">served to clients</text>

  <rect x="529" y="298" width="192" height="92" rx="4" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.3"/>
  <text x="539" y="316" font-size="10" font-weight="bold" fill="#222222">replica vBuckets</text>
  <text x="539" y="332" font-size="10" fill="#2f5424" font-family="'Courier New', monospace">~341 partitions</text>
  <g fill="#ffffff" stroke="#2f5424" stroke-width="1.2">
    <rect x="539" y="340" width="12" height="16"/><rect x="556" y="340" width="12" height="16"/><rect x="573" y="340" width="12" height="16"/><rect x="590" y="340" width="12" height="16"/><rect x="607" y="340" width="12" height="16"/><rect x="624" y="340" width="12" height="16"/><rect x="641" y="340" width="12" height="16"/><rect x="658" y="340" width="12" height="16"/><rect x="675" y="340" width="12" height="16"/><rect x="692" y="340" width="12" height="16"/>
  </g>
  <text x="539" y="374" font-size="8.5" fill="#666666">holds replica of vBucket 512</text>

  <!-- mapping callout -->
  <rect x="150" y="410" width="460" height="30" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="430" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">key "user:42" &#8594; vB 512 &#8594; active on Node B &#8226; replica on Node C</text>

  <text x="380" y="460" font-size="11" fill="#444444" text-anchor="middle">Each node owns a share of active partitions plus replicas of other nodes' partitions; rebalance is the only thing that moves them.</text>
</svg>
