<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Shopify development environment</title>
  <desc id="d">The Dev Dashboard, Shopify CLI, a local project and an AI coding agent all connect to a dev store: the Dev Dashboard owns apps, versions and tokens, the CLI works on the local project and previews it on the dev store, and the Dev MCP server feeds documentation and validation to the agent.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="210" height="140" rx="10" fill="#7a8aa0" fill-opacity="0.16" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="125" y="46" text-anchor="middle" font-weight="700" font-size="15">Dev Dashboard</text>
  <text x="125" y="64" text-anchor="middle" font-size="11" opacity="0.75">dev.shopify.com/dashboard</text>
  <text x="34" y="90" font-size="12.5">Apps, versions, releases</text>
  <text x="34" y="110" font-size="12.5">Stores: dev, transfer, collab</text>
  <text x="34" y="130" font-size="12.5">Credentials, automation tokens</text>
  <text x="34" y="150" font-size="12.5">Logs, alerts, permissions</text>
  <rect x="280" y="20" width="210" height="140" rx="10" fill="#6aa58a" fill-opacity="0.16" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="385" y="46" text-anchor="middle" font-weight="700" font-size="15">Shopify CLI 5.0.0</text>
  <text x="385" y="64" text-anchor="middle" font-size="11" opacity="0.75">Node 22.12 or later</text>
  <text x="294" y="90" font-size="12.5">shopify app init, dev, deploy</text>
  <text x="294" y="110" font-size="12.5">shopify theme dev, check, push</text>
  <text x="294" y="130" font-size="12.5">shopify store create dev, list</text>
  <text x="294" y="150" font-size="12.5">shopify doc fetch, search</text>
  <rect x="540" y="20" width="210" height="140" rx="10" fill="#c49a5a" fill-opacity="0.18" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="645" y="46" text-anchor="middle" font-weight="700" font-size="15">Dev store</text>
  <text x="645" y="64" text-anchor="middle" font-size="11" opacity="0.75">pocket-coffee-dev.myshopify.com</text>
  <text x="554" y="90" font-size="12.5">Dev preview of the app</text>
  <text x="554" y="110" font-size="12.5">Development theme</text>
  <text x="554" y="130" font-size="12.5">Test payment gateway</text>
  <text x="554" y="150" font-size="12.5">Password protected</text>
  <rect x="20" y="240" width="210" height="140" rx="10" fill="#9a7ab0" fill-opacity="0.16" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="125" y="266" text-anchor="middle" font-weight="700" font-size="15">AI coding agent</text>
  <text x="34" y="294" font-size="12.5">Shopify AI Toolkit plugin</text>
  <text x="34" y="314" font-size="12.5">or @shopify/dev-mcp 1.17.0</text>
  <text x="34" y="334" font-size="12.5">Docs, schemas, validation</text>
  <text x="34" y="354" font-size="12.5">Store tasks through the CLI</text>
  <rect x="280" y="240" width="210" height="140" rx="10" fill="#7a8aa0" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="385" y="266" text-anchor="middle" font-weight="700" font-size="15">Your machine</text>
  <text x="294" y="294" font-size="12.5">pocket-coffee-app/</text>
  <text x="306" y="314" font-size="11.5" opacity="0.85">shopify.app.toml, extensions/</text>
  <text x="294" y="334" font-size="12.5">pocket-coffee-theme/</text>
  <text x="306" y="354" font-size="11.5" opacity="0.85">shopify.theme.toml, sections/</text>
  <rect x="540" y="240" width="210" height="140" rx="10" fill="#c49a5a" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="645" y="266" text-anchor="middle" font-weight="700" font-size="15">Testing in the browser</text>
  <text x="554" y="294" font-size="12.5">Storefront with store password</text>
  <text x="554" y="314" font-size="12.5">Checkout with test cards 1, 2, 3</text>
  <text x="554" y="334" font-size="12.5">Admin: orders, Dev Console</text>
  <text x="554" y="354" font-size="12.5">Test customers ada and grace</text>
  <path d="M232 90 H278" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M492 90 H538" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M385 162 V238" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M278 310 H232" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M645 162 V238" stroke="currentColor" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="255" y="80" text-anchor="middle" font-size="10.5" opacity="0.85">login</text>
  <text x="515" y="80" text-anchor="middle" font-size="10.5" opacity="0.85">preview</text>
  <text x="397" y="205" text-anchor="start" font-size="10.5" opacity="0.85">edit, build, check</text>
  <text x="255" y="300" text-anchor="middle" font-size="10.5" opacity="0.85">docs</text>
  <text x="657" y="205" text-anchor="start" font-size="10.5" opacity="0.85">test orders</text>
</svg>
