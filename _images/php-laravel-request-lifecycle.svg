<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Laravel request lifecycle</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">Laravel 13: the path of one HTTP request, inward through the middleware to the controller and back out</text>

  <!-- entry -->
  <rect x="40" y="62" width="230" height="40" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="155" y="87" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <line x1="270" y1="82" x2="318" y2="82" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="320" y="62" width="260" height="40" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="450" y="80" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Web server and PHP</text>
  <text x="450" y="95" font-size="10" fill="#444444" text-anchor="middle">Nginx + PHP-FPM, FrankenPHP or artisan serve</text>
  <line x1="450" y1="102" x2="450" y2="120" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="200" y="122" width="500" height="54" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="141" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">public/index.php</text>
  <text x="450" y="157" font-size="10" fill="#333333" text-anchor="middle">maintenance check · vendor/autoload.php · require bootstrap/app.php (Application::configure()->create())</text>
  <text x="450" y="170" font-size="10" fill="#333333" text-anchor="middle">$app->handleRequest(Request::capture()): Illuminate\Http\Request extends Symfony HttpFoundation's Request</text>
  <line x1="450" y1="176" x2="450" y2="194" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- bootstrap -->
  <rect x="120" y="196" width="660" height="74" fill="#efe9f7" stroke="#5b3a8a" stroke-width="1.6"/>
  <text x="450" y="215" font-size="13" font-weight="bold" fill="#5b3a8a" text-anchor="middle">HTTP kernel bootstrappers</text>
  <text x="450" y="233" font-size="10" fill="#333333" text-anchor="middle">LoadEnvironmentVariables (.env) → LoadConfiguration (config/* or the cached file) → HandleExceptions → RegisterFacades</text>
  <text x="450" y="249" font-size="10" fill="#333333" text-anchor="middle">→ RegisterProviders: register() on every service provider → BootProviders: boot() on every provider</text>
  <text x="450" y="263" font-size="10" fill="#9b1c1c" text-anchor="middle">with Octane, everything above this line runs once per worker, not once per request</text>
  <line x1="450" y1="270" x2="450" y2="288" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- global middleware -->
  <rect x="80" y="290" width="740" height="62" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="450" y="309" font-size="13" font-weight="bold" fill="#a05a00" text-anchor="middle">Global middleware (every request)</text>
  <text x="450" y="326" font-size="10" fill="#333333" text-anchor="middle">ValidatePathEncoding · InvokeDeferredCallbacks · TrustProxies · HandleCors · PreventRequestsDuringMaintenance</text>
  <text x="450" y="341" font-size="10" fill="#333333" text-anchor="middle">ValidatePostSize · TrimStrings · ConvertEmptyStringsToNull · your appended middleware</text>
  <line x1="450" y1="352" x2="450" y2="370" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- router -->
  <rect x="160" y="372" width="580" height="44" fill="#e9f5ec" stroke="#1d6b34" stroke-width="1.6"/>
  <text x="450" y="391" font-size="13" font-weight="bold" fill="#1d6b34" text-anchor="middle">Router</text>
  <text x="450" y="407" font-size="10" fill="#333333" text-anchor="middle">match method and path (or 404 / 405) · collect the route's middleware</text>
  <line x1="450" y1="416" x2="450" y2="434" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- route middleware -->
  <rect x="120" y="436" width="660" height="62" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="450" y="455" font-size="13" font-weight="bold" fill="#a05a00" text-anchor="middle">Route middleware: the "web" group, then the route's own</text>
  <text x="450" y="472" font-size="10" fill="#333333" text-anchor="middle">EncryptCookies · AddQueuedCookiesToResponse · StartSession · ShareErrorsFromSession · PreventRequestForgery</text>
  <text x="450" y="487" font-size="10" fill="#333333" text-anchor="middle">SubstituteBindings (route model binding) · auth, can:, throttle:, your aliases ("api" group: SubstituteBindings only)</text>
  <line x1="450" y1="498" x2="450" y2="516" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- controller -->
  <rect x="220" y="518" width="460" height="62" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="537" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Controller or route closure</text>
  <text x="450" y="554" font-size="10" fill="#333333" text-anchor="middle">dependencies injected by the container · form request validated and authorized</text>
  <text x="450" y="569" font-size="10" fill="#333333" text-anchor="middle">Eloquent queries · returns a view, JSON, a redirect or any Response</text>

  <!-- return path -->
  <line x1="680" y1="549" x2="790" y2="549" stroke="#1d6b34" stroke-width="1.6"/>
  <line x1="790" y1="549" x2="790" y2="626" stroke="#1d6b34" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="780" y="603" font-size="10" fill="#1d6b34" text-anchor="end">the response travels back out through the same middleware, in reverse</text>

  <rect x="200" y="628" width="660" height="44" fill="#e9f5ec" stroke="#1d6b34" stroke-width="1.6"/>
  <text x="530" y="647" font-size="13" font-weight="bold" fill="#1d6b34" text-anchor="middle">Response sent</text>
  <text x="530" y="663" font-size="10" fill="#333333" text-anchor="middle">route and global middleware run their "after" code · session saved · queued cookies added · $response->send()</text>
  <line x1="530" y1="672" x2="530" y2="690" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="200" y="692" width="660" height="44" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="530" y="711" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">After the response</text>
  <text x="530" y="727" font-size="10" fill="#333333" text-anchor="middle">terminate() of terminable middleware · app()->terminating() callbacks · defer() callbacks</text>

  <text x="450" y="762" font-size="10" fill="#666666" text-anchor="middle">Middleware lists as reported by the HTTP kernel of a new Laravel 13.34 application</text>
</svg>
