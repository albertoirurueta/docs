<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where a Magento storefront request can be answered from a cache</title>
  <desc id="d">A request passes the browser and CDN, then Varnish or the built-in full page cache, then the web server and PHP with OPcache, then the Magento application caches (config, layout, block_html, eav and the others) held in Valkey database 0, and finally the database and OpenSearch. Private content such as the cart and the customer name is not part of the cached page: the browser fetches it with a separate customer/section/load call and keeps it in local storage. Sessions live in a second Valkey database.</desc>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Six places a Magento response can come from, nearest to the shopper first</text>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="56" width="140" height="300" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="80" font-size="14" font-weight="bold">Browser, CDN</text>
    <text x="32" y="106">Static files under</text>
    <text x="32" y="122">pub/static and</text>
    <text x="32" y="138">pub/media, versioned</text>
    <text x="32" y="154">URLs, long expiry</text>
    <text x="32" y="184">localStorage keeps</text>
    <text x="32" y="200">private content</text>
    <text x="32" y="216">(mage-cache-storage)</text>
    <text x="32" y="260" fill="#f4b860">Setting</text>
    <text x="32" y="278" fill="#f4b860">Cache-Control,</text>
    <text x="32" y="294" fill="#f4b860">static sign, CDN</text>

    <rect x="176" y="56" width="150" height="300" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="188" y="80" font-size="14" font-weight="bold">Full page cache</text>
    <text x="188" y="106">Varnish (production)</text>
    <text x="188" y="122">or the built-in cache</text>
    <text x="188" y="138">(development)</text>
    <text x="188" y="168">Whole HTML pages,</text>
    <text x="188" y="184">tagged cat_p_5,</text>
    <text x="188" y="200">cat_c_3, cms_p_2...</text>
    <text x="188" y="230">Hit: PHP is skipped</text>
    <text x="188" y="246">(Varnish) or barely</text>
    <text x="188" y="262">run (built-in)</text>
    <text x="188" y="294" fill="#f4b860">Setting</text>
    <text x="188" y="312" fill="#f4b860">caching_application,</text>
    <text x="188" y="328" fill="#f4b860">TTL, VCL</text>

    <rect x="342" y="56" width="140" height="300" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="354" y="80" font-size="14" font-weight="bold">Web server, PHP</text>
    <text x="354" y="106">nginx or Apache,</text>
    <text x="354" y="122">PHP-FPM workers</text>
    <text x="354" y="152">OPcache: compiled</text>
    <text x="354" y="168">scripts, no</text>
    <text x="354" y="184">timestamp checks</text>
    <text x="354" y="214">realpath cache and</text>
    <text x="354" y="230">APCu: file paths</text>
    <text x="354" y="294" fill="#f4b860">Setting</text>
    <text x="354" y="312" fill="#f4b860">php.ini, pool size</text>

    <rect x="498" y="56" width="170" height="300" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="510" y="80" font-size="14" font-weight="bold">Application caches</text>
    <text x="510" y="106">config, layout,</text>
    <text x="510" y="122">block_html, eav,</text>
    <text x="510" y="138">translate, reflection,</text>
    <text x="510" y="154">db_ddl, collections...</text>
    <text x="510" y="184">Stored in Valkey</text>
    <text x="510" y="200">db 0 (cache) with</text>
    <text x="510" y="216">tags; db 2 holds</text>
    <text x="510" y="232">the sessions</text>
    <text x="510" y="262">Your own type:</text>
    <text x="510" y="278">cache.xml +</text>
    <text x="510" y="294">TagScope</text>
    <text x="510" y="326" fill="#f4b860">cache:enable, clean</text>
    <text x="510" y="342" fill="#f4b860">env.php cache block</text>

    <rect x="684" y="56" width="140" height="300" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="696" y="80" font-size="14" font-weight="bold">Indexes</text>
    <text x="696" y="106">Precomputed tables</text>
    <text x="696" y="122">for price, category</text>
    <text x="696" y="138">products, stock,</text>
    <text x="696" y="154">customer grid, and</text>
    <text x="696" y="170">your own</text>
    <text x="696" y="200">OpenSearch holds</text>
    <text x="696" y="216">the search index</text>
    <text x="696" y="294" fill="#f4b860">Setting</text>
    <text x="696" y="312" fill="#f4b860">indexer:set-mode,</text>
    <text x="696" y="328" fill="#f4b860">cron group index</text>

    <rect x="840" y="56" width="100" height="300" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="852" y="80" font-size="14" font-weight="bold">Database</text>
    <text x="852" y="106">MariaDB or</text>
    <text x="852" y="122">MySQL: EAV</text>
    <text x="852" y="138">and flat tables</text>
    <text x="852" y="168">InnoDB buffer</text>
    <text x="852" y="184">pool</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="160" y1="110" x2="174" y2="110" marker-end="url(#a)"/>
    <line x1="326" y1="110" x2="340" y2="110" marker-end="url(#a)"/>
    <line x1="482" y1="110" x2="496" y2="110" marker-end="url(#a)"/>
    <line x1="668" y1="110" x2="682" y2="110" marker-end="url(#a)"/>
    <line x1="824" y1="110" x2="838" y2="110" marker-end="url(#a)"/>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="380" width="920" height="136" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="34" y="404" font-size="14" font-weight="bold">What each layer stores and what clears it</text>
    <text x="34" y="428">Full page cache: cleaned by tag when a product, category or CMS page is saved (cache:clean full_page, Admin Cache Management,</text>
    <text x="34" y="448">or a PURGE request to Varnish).</text>
    <text x="34" y="468">Application caches: cleaned by cache:clean or cache:flush; cache:flush empties the whole Valkey database, including entries that are not Magento's.</text>
    <text x="34" y="488">Indexes: rebuilt by indexer:reindex or kept current by the changelog tables and the cron group index (Update by Schedule).</text>
    <text x="34" y="508">Private content (cart, customer name, your own sections) is never inside the cached page: customer/section/load returns it per visitor.</text>
  </g>
</svg>
