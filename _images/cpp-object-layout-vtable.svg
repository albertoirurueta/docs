<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="vtarrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- Object memory layout -->
  <text x="120" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Circle object</text>
  <rect x="30" y="35" width="180" height="40" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="120" y="60" text-anchor="middle" font-size="13" fill="#1c4b73">vptr</text>
  <rect x="30" y="75" width="180" height="40" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-size="13" fill="#2a6636">radius_ (double)</text>

  <!-- Vtable -->
  <text x="450" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Circle's vtable</text>
  <rect x="360" y="35" width="180" height="34" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="450" y="57" text-anchor="middle" font-size="12" fill="#6b4207">Circle::area()</text>
  <rect x="360" y="69" width="180" height="34" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="450" y="91" text-anchor="middle" font-size="12" fill="#6b4207">Circle::~Circle()</text>

  <line x1="210" y1="55" x2="356" y2="52" stroke="#3a3a3a" stroke-width="2" marker-end="url(#vtarrow)"/>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#555">points to</text>

  <!-- Second object sharing the vtable -->
  <text x="120" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Another Circle object</text>
  <rect x="30" y="160" width="180" height="40" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="120" y="185" text-anchor="middle" font-size="13" fill="#1c4b73">vptr</text>
  <rect x="30" y="200" width="180" height="40" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="120" y="225" text-anchor="middle" font-size="13" fill="#2a6636">radius_ (double)</text>

  <line x1="210" y1="180" x2="356" y2="60" stroke="#3a3a3a" stroke-width="2" marker-end="url(#vtarrow)"/>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#333">Every Circle instance shares one vtable; only vptr (a single pointer) is per-object overhead.</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#333">A virtual call reads vptr, then indexes into the vtable -- one extra indirection versus a non-virtual call.</text>
</svg>
