<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Awaiting cover lookups one after another, in parallel, and in parallel with a timeout</title>
  <defs>
    <marker id="tcc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="24" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Three cover lookups, 200 ms each</text>
  <text x="360" y="42" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one event loop in every row; the horizontal axis is time</text>

  <!-- Row 1 -->
  <text x="20" y="76" font-size="13" font-weight="bold" fill="currentColor">1. await one by one</text>
  <text x="20" y="93" font-size="11" fill="currentColor" opacity="0.85">total is the sum: about 600 ms</text>
  <rect x="230" y="62" width="80" height="30" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="82" font-size="11" fill="currentColor" text-anchor="middle">lookup 1</text>
  <rect x="310" y="62" width="80" height="30" rx="4" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
  <text x="350" y="82" font-size="11" fill="currentColor" text-anchor="middle">lookup 2</text>
  <rect x="390" y="62" width="80" height="30" rx="4" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/>
  <text x="430" y="82" font-size="11" fill="currentColor" text-anchor="middle">lookup 3</text>
  <line x1="215" y1="106" x2="700" y2="106" stroke="currentColor" stroke-width="1" marker-end="url(#tcc-arrow)" opacity="0.6"/>

  <!-- Row 2 -->
  <text x="20" y="156" font-size="13" font-weight="bold" fill="currentColor">2. gather or gen.multi</text>
  <text x="20" y="173" font-size="11" fill="currentColor" opacity="0.85">total is the slowest: about 200 ms</text>
  <rect x="230" y="128" width="80" height="22" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="143" font-size="11" fill="currentColor" text-anchor="middle">lookup 1</text>
  <rect x="230" y="153" width="80" height="22" rx="4" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="168" font-size="11" fill="currentColor" text-anchor="middle">lookup 2</text>
  <rect x="230" y="178" width="80" height="22" rx="4" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="193" font-size="11" fill="currentColor" text-anchor="middle">lookup 3</text>
  <line x1="215" y1="212" x2="700" y2="212" stroke="currentColor" stroke-width="1" marker-end="url(#tcc-arrow)" opacity="0.6"/>

  <!-- Row 3 -->
  <text x="20" y="262" font-size="13" font-weight="bold" fill="currentColor">3. with_timeout(300 ms)</text>
  <text x="20" y="279" font-size="11" fill="currentColor" opacity="0.85">the caller gives up; the slow</text>
  <text x="20" y="293" font-size="11" fill="currentColor" opacity="0.85">lookup keeps running</text>
  <rect x="230" y="234" width="80" height="22" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="249" font-size="11" fill="currentColor" text-anchor="middle">lookup 1</text>
  <rect x="230" y="259" width="80" height="22" rx="4" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
  <text x="270" y="274" font-size="11" fill="currentColor" text-anchor="middle">lookup 2</text>
  <rect x="230" y="284" width="320" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="390" y="299" font-size="11" fill="currentColor" text-anchor="middle">slow lookup 3 (1 s), not cancelled</text>
  <line x1="390" y1="226" x2="390" y2="318" stroke="currentColor" stroke-width="1.5"/>
  <text x="396" y="238" font-size="11" fill="currentColor">TimeoutError raised</text>
  <line x1="215" y1="324" x2="700" y2="324" stroke="currentColor" stroke-width="1" marker-end="url(#tcc-arrow)" opacity="0.6"/>

  <text x="360" y="372" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.85">Parallel awaits overlap waiting, not computing: a handler that burns CPU still blocks the loop.</text>
</svg>
