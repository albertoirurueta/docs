<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What a custom product type touches from the editor to the storefront</title>
  <desc id="d">Three columns. In the editor, the product_type_selector filter adds the type to the drop-down, a script adds the show_if class to the price and stock fields, and an action prints the origins field. On save, WooCommerce builds the class from the posted type, calls woocommerce_admin_process_product_object, saves through the product data store and writes the product_type term. On the storefront, wc_get_product reads the term and builds the class, the woocommerce_tasting_flight_add_to_cart action prints the form, and the Store API and the REST API treat the type like any other.</desc>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">Registering the tasting_flight type</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Hooks and classes in the order they run; each box is code of the pocket-coffee-products plugin or of WooCommerce itself</text>
  <rect x="40" y="76" width="260" height="5" rx="2" fill="#f4b860"/>
  <text x="40" y="102" font-size="14.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Product editor</text>
  <rect x="350" y="76" width="260" height="5" rx="2" fill="#9fd3c7"/>
  <text x="350" y="102" font-size="14.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Save</text>
  <rect x="660" y="76" width="260" height="5" rx="2" fill="#a8d18d"/>
  <text x="660" y="102" font-size="14.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Read and sell</text>
  <rect x="40" y="116" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="52" y="140" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">product_type_selector</text>
  <text x="52" y="158" font-size="11.5" text-anchor="start" fill="#f2f5f8">adds tasting_flight to the</text>
  <text x="52" y="176" font-size="11.5" text-anchor="start" fill="#f2f5f8">Product data drop-down</text>
  <path d="M170 198 L170 212" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="212" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="52" y="236" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">admin.js adds show_if_</text>
  <text x="52" y="254" font-size="11.5" text-anchor="start" fill="#f2f5f8">tasting_flight to the price and</text>
  <text x="52" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">stock groups, then fires change</text>
  <path d="M170 294 L170 308" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="308" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="52" y="332" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">woocommerce_product_options_</text>
  <text x="52" y="350" font-size="11.5" text-anchor="start" fill="#f2f5f8">general_product_data prints</text>
  <text x="52" y="368" font-size="11.5" text-anchor="start" fill="#f2f5f8">the origins multi-select</text>
  <path d="M170 390 L170 404" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="404" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="52" y="428" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">woocommerce_product_data_tabs</text>
  <text x="52" y="446" font-size="11.5" text-anchor="start" fill="#f2f5f8">adds show_if_tasting_flight</text>
  <text x="52" y="464" font-size="11.5" text-anchor="start" fill="#f2f5f8">to the Inventory tab</text>
  <rect x="350" y="116" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="362" y="140" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">POST product-type=tasting_flight</text>
  <text x="362" y="158" font-size="11.5" text-anchor="start" fill="#f2f5f8">WC_Meta_Box_Product_Data::save()</text>
  <text x="362" y="176" font-size="11.5" text-anchor="start" fill="#f2f5f8">builds the class from the type</text>
  <path d="M480 198 L480 212" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="350" y="212" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="362" y="236" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">woocommerce_admin_process_</text>
  <text x="362" y="254" font-size="11.5" text-anchor="start" fill="#f2f5f8">product_object( $product )</text>
  <text x="362" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">set_origins( ... )</text>
  <path d="M480 294 L480 308" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="350" y="308" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="362" y="332" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">$product-&gt;save()</text>
  <text x="362" y="350" font-size="11.5" text-anchor="start" fill="#f2f5f8">WC_Product_Data_Store_CPT</text>
  <text x="362" y="368" font-size="11.5" text-anchor="start" fill="#f2f5f8">writes post, meta, lookup rows</text>
  <path d="M480 390 L480 404" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="350" y="404" width="260" height="100" rx="6" fill="#3d5266"/>
  <text x="362" y="428" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">product_type term created and</text>
  <text x="362" y="446" font-size="11.5" text-anchor="start" fill="#f2f5f8">attached; then the type hook</text>
  <text x="362" y="464" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_process_product_meta_</text>
  <text x="362" y="482" font-size="11.5" text-anchor="start" fill="#f2f5f8">tasting_flight( $post_id )</text>
  <rect x="660" y="116" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="672" y="140" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wc_get_product( $id )</text>
  <text x="672" y="158" font-size="11.5" text-anchor="start" fill="#f2f5f8">term -&gt; WC_Product_Tasting_flight</text>
  <text x="672" y="176" font-size="11.5" text-anchor="start" fill="#f2f5f8">= class WC_Product_Tasting_Flight</text>
  <path d="M790 198 L790 212" stroke="#a8d18d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="660" y="212" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="672" y="236" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">woocommerce_tasting_flight_</text>
  <text x="672" y="254" font-size="11.5" text-anchor="start" fill="#f2f5f8">add_to_cart action prints the</text>
  <text x="672" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">simple add-to-cart form</text>
  <path d="M790 294 L790 308" stroke="#a8d18d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="660" y="308" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="672" y="332" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Store API add-item: purchasable</text>
  <text x="672" y="350" font-size="11.5" text-anchor="start" fill="#f2f5f8">REST /wc/v3/products?type=</text>
  <text x="672" y="368" font-size="11.5" text-anchor="start" fill="#f2f5f8">tasting_flight: type kept</text>
  <path d="M790 390 L790 404" stroke="#a8d18d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="660" y="404" width="260" height="82" rx="6" fill="#3d5266"/>
  <text x="672" y="428" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wc_get_products( type =&gt;</text>
  <text x="672" y="446" font-size="11.5" text-anchor="start" fill="#f2f5f8">'tasting_flight' ) finds it</text>
  <text x="672" y="464" font-size="11.5" text-anchor="start" fill="#f2f5f8">like any other type</text>
</svg>
