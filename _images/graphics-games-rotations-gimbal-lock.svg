<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="gl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="gla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="glw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="glg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Gimbal lock: pitch of 90 degrees merges two rotation axes</text>
<rect x="20" y="50" width="340" height="255" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="190" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Pitch 0: three independent axes</text>
<ellipse cx="190" cy="172" rx="120" ry="95" fill="none" stroke="#4F46E5" stroke-width="3"/>
<ellipse cx="190" cy="172" rx="92" ry="42" fill="none" stroke="#B45309" stroke-width="3"/>
<ellipse cx="190" cy="172" rx="62" ry="70" fill="none" stroke="#047857" stroke-width="3"/>
<circle cx="190.0" cy="172.0" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<rect x="400" y="50" width="340" height="255" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="570" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Pitch 90: yaw and roll axes coincide</text>
<ellipse cx="570" cy="172" rx="120" ry="95" fill="none" stroke="#4F46E5" stroke-width="3"/>
<ellipse cx="570" cy="172" rx="86" ry="86" fill="none" stroke="#B45309" stroke-width="3"/>
<ellipse cx="570" cy="172" rx="60" ry="60" fill="none" stroke="#047857" stroke-width="3" stroke-dasharray="6 3"/>
<circle cx="570.0" cy="172.0" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="190" y="296" text-anchor="middle" font-size="11" fill="#374151">outer = yaw, middle = pitch, inner = roll</text>
<text x="570" y="296" text-anchor="middle" font-size="11" fill="#374151">rolling and yawing now spin about the same line</text>
<text x="380" y="334" text-anchor="middle" font-size="11" fill="#374151">One degree of freedom is lost: the orientation cannot move along the missing axis. Quaternions have no such singularity.</text>
</svg>
