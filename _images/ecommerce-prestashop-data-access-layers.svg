<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Four ways a PrestaShop module reads and writes data, with the Pocket Coffee tables</title>
  <desc id="d">Four horizontal bands from the lowest to the highest level. Db and DbQuery send SQL to any table and need manual escaping. An ObjectModel class maps one entity to a base table and a language table and validates fields. A Doctrine entity declared with annotations in src/Entity maps one table and is used through the entity manager. Extra Properties add typed columns to the extra tables of an existing core entity such as product_extra, product_extra_lang. Each band names the Pocket Coffee class and the tables it touches, and a column on the right says when to choose it.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Pocket Coffee module pcfe47: one SQL layer and three mappers</text>

  <g font-size="13" font-weight="bold" fill="#f2f5f8">
    <text x="50" y="68">Layer</text>
    <text x="270" y="68">Pocket Coffee example</text>
    <text x="560" y="68">Tables</text>
    <text x="760" y="68">Choose it for</text>
  </g>

  <!-- Extra properties -->
  <rect x="40" y="80" width="880" height="96" rx="8" fill="#3d5266"/>
  <text x="50" y="106" font-size="15" font-weight="bold" fill="#f4b860">Extra Properties (9.2)</text>
  <text x="50" y="126" font-size="12" fill="#f2f5f8">registerExtraProperty()</text>
  <text x="50" y="144" font-size="12" fill="#f2f5f8">experimental</text>
  <text x="270" y="106" font-size="12.5" fill="#f2f5f8">product roast_date, roast_level,</text>
  <text x="270" y="126" font-size="12.5" fill="#f2f5f8">tasting_note: shown in the product form,</text>
  <text x="270" y="144" font-size="12.5" fill="#f2f5f8">grid, front office and Admin API</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#f2f5f8">
    <text x="560" y="106">ps_product_extra</text>
    <text x="560" y="126">ps_product_extra_lang</text>
    <text x="560" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12">one column per property</text>
  </g>
  <text x="760" y="106" font-size="12.5" fill="#f2f5f8">A few typed fields on a</text>
  <text x="760" y="126" font-size="12.5" fill="#f2f5f8">core entity, with no</text>
  <text x="760" y="146" font-size="12.5" fill="#f2f5f8">code of your own</text>

  <!-- Doctrine -->
  <rect x="40" y="186" width="880" height="96" rx="8" fill="#3d5266"/>
  <text x="50" y="212" font-size="15" font-weight="bold" fill="#f2f5f8">Doctrine entity</text>
  <text x="50" y="232" font-size="12" fill="#f2f5f8">src/Entity, annotations</text>
  <text x="50" y="250" font-size="12" fill="#f2f5f8">entity manager</text>
  <text x="270" y="212" font-size="12.5" fill="#f2f5f8">Pcfe47RoastNote: a free-text note</text>
  <text x="270" y="232" font-size="12.5" fill="#f2f5f8">per batch, read in a Symfony controller</text>
  <text x="270" y="250" font-size="12.5" fill="#f2f5f8">and in a front controller</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#f2f5f8">
    <text x="560" y="212">ps_pcfe47_roast_note</text>
  </g>
  <text x="560" y="236" font-size="12" fill="#f2f5f8">table named from the class,</text>
  <text x="560" y="254" font-size="12" fill="#f2f5f8">created by your install()</text>
  <text x="760" y="212" font-size="12.5" fill="#f2f5f8">Your own domain tables,</text>
  <text x="760" y="232" font-size="12.5" fill="#f2f5f8">Symfony code, queries with</text>
  <text x="760" y="250" font-size="12.5" fill="#f2f5f8">DQL and repositories</text>

  <!-- ObjectModel -->
  <rect x="40" y="292" width="880" height="96" rx="8" fill="#3d5266"/>
  <text x="50" y="318" font-size="15" font-weight="bold" fill="#f2f5f8">ObjectModel</text>
  <text x="50" y="338" font-size="12" fill="#f2f5f8">$definition, active record</text>
  <text x="50" y="356" font-size="12" fill="#f2f5f8">validation, lang tables, hooks</text>
  <text x="270" y="318" font-size="12.5" fill="#f2f5f8">Pcfe47RoastBatch: sku, origin, kg,</text>
  <text x="270" y="338" font-size="12.5" fill="#f2f5f8">roasted_at and a translated</text>
  <text x="270" y="356" font-size="12.5" fill="#f2f5f8">tasting note</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#f2f5f8">
    <text x="560" y="318">ps_pcfe47_roast_batch</text>
    <text x="560" y="338">ps_pcfe47_roast_batch_lang</text>
  </g>
  <text x="760" y="318" font-size="12.5" fill="#f2f5f8">Entities with validation,</text>
  <text x="760" y="338" font-size="12.5" fill="#f2f5f8">language tables and</text>
  <text x="760" y="356" font-size="12.5" fill="#f2f5f8">lifecycle hooks</text>

  <!-- Db -->
  <rect x="40" y="398" width="880" height="96" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="424" font-size="15" font-weight="bold" fill="#f4b860">Db and DbQuery</text>
  <text x="50" y="444" font-size="12" fill="#f4b860">raw SQL, you escape</text>
  <text x="50" y="462" font-size="12" fill="#f4b860">pSQL, bqSQL, (int)</text>
  <text x="270" y="424" font-size="12.5" fill="#f4b860">RoastBatchQuery: active batches by</text>
  <text x="270" y="444" font-size="12.5" fill="#f4b860">language, totals per origin, last</text>
  <text x="270" y="462" font-size="12.5" fill="#f4b860">roast date of a SKU</text>
  <text x="560" y="424" font-size="12.5" fill="#f4b860">any table, joins and</text>
  <text x="560" y="444" font-size="12.5" fill="#f4b860">GROUP BY included</text>
  <text x="760" y="424" font-size="12.5" fill="#f4b860">Reports, bulk work, DDL</text>
  <text x="760" y="444" font-size="12.5" fill="#f4b860">in install() and upgrades,</text>
  <text x="760" y="462" font-size="12.5" fill="#f4b860">what mappers lack</text>

  <path d="M24 486 L24 90" fill="none" stroke="#f2f5f8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="40" y="522" font-size="12.5" fill="#f2f5f8">Arrow: from lowest level (SQL) to highest level (no code of your own). All four share the MySQL connection and the table prefix ps_.</text>
  <text x="40" y="542" font-size="12.5" fill="#f2f5f8">Never create foreign keys to core tables and never alter them: add tables of your own or use Extra Properties.</text>
</svg>
