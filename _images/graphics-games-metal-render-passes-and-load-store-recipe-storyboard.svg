<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-passes-and-load-store-recipe-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Setting up the passes of the Bookshelf frame</text>
<rect x="20" y="60" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="34" cy="74" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="34" y="78.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="45" y="92" width="50" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70.0" y="120.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">depth</text>
<rect x="115" y="92" width="50" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="140.0" y="120.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">MSAA</text>
<rect x="80" y="160" width="50" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="180.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">depth</text>
<text x="105.0" y="193.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">MSAA</text>
<text x="105" y="250" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Create targets</text>
<text x="105" y="266" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">shadow map, MSAA colour,</text>
<text x="105" y="279" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">MSAA depth (memoryless)</text>
<rect x="204" y="60" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="218" cy="74" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="218" y="78.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="229" y="100" width="120" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="289.0" y="134.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">depth only</text>
<text x="289.0" y="148.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">books from</text>
<text x="289.0" y="162.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">the light</text>
<text x="289" y="250" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Encode shadow pass</text>
<text x="289" y="266" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">clear depth, draw books,</text>
<text x="289" y="279" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">store the depth</text>
<rect x="388" y="60" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="402" cy="74" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="402" y="78.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="413" y="100" width="120" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="473.0" y="134.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">shelf + books</text>
<text x="473.0" y="148.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">lit, shadowed</text>
<text x="473.0" y="162.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">4x MSAA</text>
<text x="473" y="250" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Encode main pass</text>
<text x="473" y="266" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">clear, draw shelf, resolve</text>
<text x="473" y="279" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">into the drawable texture</text>
<rect x="572" y="60" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="586" cy="74" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="586" y="78.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="597" y="100" width="120" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="657.0" y="134.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">drawable</text>
<text x="657.0" y="148.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">texture</text>
<text x="657.0" y="162.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">on screen</text>
<text x="657" y="250" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">End and present</text>
<text x="657" y="266" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">endEncoding, then present</text>
<text x="657" y="279" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">the drawable</text>
<text x="380" y="312" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Steps 2 and 3 are separate encoders because the main pass samples what the shadow pass wrote.</text>
</svg>
