<line x1="154" y1="165" x2="163" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-frame)"/>
<rect x="163" y="50" width="140" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
