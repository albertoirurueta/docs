<text x="382" y="120" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">draw</text>
<text x="382" y="162" text-anchor="middle" font-size="10" fill="#374151">beginRendering</text>
<text x="382" y="179" text-anchor="middle" font-size="10" fill="#374151">bind, draw</text>
<text x="382" y="196" text-anchor="middle" font-size="10" fill="#374151">endRendering</text>
<rect x="318" y="230" width="128" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="251.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Record</text>
<text x="382.0" y="266.4" text-anchor="middle" font-size="11" fill="#374151">draw books</text>
<line x1="452" y1="165" x2="461" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-frame)"/>
<rect x="461" y="50" width="140" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="475" cy="62" r="11" fill="#B45309"/>
<text x="475" y="66" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<rect x="486" y="86" width="90" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="531.0" y="115.2" text-anchor="middle" font-size="12" fill="#92400E"></text>
<text x="531" y="120" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">B2</text>
<text x="531" y="162" text-anchor="middle" font-size="10" fill="#374151">src: COLOR_ATT_OUT</text>
<text x="531" y="179" text-anchor="middle" font-size="10" fill="#374151">srcAccess: WRITE</text>
<text x="531" y="196" text-anchor="middle" font-size="10" fill="#374151">dst: none, no access</text>
<rect x="467" y="230" width="128" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="531.0" y="251.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Barrier 2</text>
<text x="531.0" y="266.4" text-anchor="middle" font-size="11" fill="#374151">to PRESENT_SRC</text>
<line x1="601" y1="165" x2="610" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-frame)"/>
<rect x="610" y="50" width="140" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="624" cy="62" r="11" fill="#4F46E5"/>
<text x="624" y="66" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<rect x="635" y="86" width="90" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="680.0" y="115.2" text-anchor="middle" font-size="12" fill="#065F46"></text>
<text x="680" y="120" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">P</text>
<text x="680" y="162" text-anchor="middle" font-size="10" fill="#374151">signal per-image</text>
<text x="680" y="179" text-anchor="middle" font-size="10" fill="#374151">semaphore, then</text>
<text x="680" y="196" text-anchor="middle" font-size="10" fill="#374151">vkQueuePresentKHR</text>
<rect x="616" y="230" width="128" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="680.0" y="251.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Submit</text>
<text x="680.0" y="266.4" text-anchor="middle" font-size="11" fill="#374151">then present</text>
<text x="380" y="320" text-anchor="middle" font-size="11" fill="#374151">Both barriers use COLOR_ATTACHMENT_OUTPUT, matching the stage the acquire semaphore waits at.</text>
<text x="380" y="340" text-anchor="middle" font-size="11" fill="#374151">With a combined graphics and present queue no ownership transfer is needed.</text>
