<text x="233" y="196" text-anchor="middle" font-size="10" fill="#374151">dstAccess: WRITE</text>
<rect x="169" y="230" width="128" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="233.0" y="251.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Barrier 1</text>
<text x="233.0" y="266.4" text-anchor="middle" font-size="11" fill="#374151">to ATTACHMENT</text>
<line x1="303" y1="165" x2="312" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-frame)"/>
<rect x="312" y="50" width="140" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="62" r="11" fill="#4F46E5"/>
<text x="326" y="66" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<rect x="337" y="86" width="90" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
