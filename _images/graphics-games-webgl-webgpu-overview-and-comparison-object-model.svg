<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgpu-object-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">WebGL 2 and WebGPU objects, side by side</text>
<text x="90" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Concept</text>
<text x="282" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">WebGL 2</text>
<text x="575" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">WebGPU</text>
<rect x="20" y="70" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="103.5" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">Entry point</text>
<rect x="170" y="70" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="95.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">canvas.getContext(</text>
<text x="282.5" y="110.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">'webgl2') : one context</text>
<rect x="410" y="70" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="88.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">navigator.gpu, then</text>
<text x="575.0" y="103.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">requestAdapter()</text>
<text x="575.0" y="118.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">requestDevice()</text>
<rect x="20" y="134" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="167.6" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">Resources</text>
<rect x="170" y="134" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="159.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">createBuffer / createTexture</text>
<text x="282.5" y="174.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">bound to global targets</text>
<rect x="410" y="134" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="159.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">device.createBuffer({ usage })</text>
<text x="575.0" y="174.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">device.createTexture({ usage })</text>
<rect x="20" y="198" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="231.6" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">Shaders</text>
<rect x="170" y="198" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="223.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GLSL ES 3.00 strings</text>
<text x="282.5" y="238.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">compile + link at run time</text>
<rect x="410" y="198" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="223.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">WGSL in a GPUShaderModule</text>
<text x="575.0" y="238.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">errors via getCompilationInfo()</text>
<rect x="20" y="262" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="295.6" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">State</text>
<rect x="170" y="262" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="287.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.enable / blendFunc /</text>
<text x="282.5" y="302.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">depthFunc: mutable global state</text>
<rect x="410" y="262" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="287.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">GPURenderPipeline: blend, depth,</text>
<text x="575.0" y="302.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">cull, formats baked in, immutable</text>
<rect x="20" y="326" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="359.6" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">Binding</text>
<rect x="170" y="326" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="351.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.uniform*, activeTexture,</text>
<text x="282.5" y="366.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">bindBufferBase per draw</text>
<rect x="410" y="326" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="351.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">GPUBindGroup of buffer, sampler,</text>
<text x="575.0" y="366.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">texture; setBindGroup(0, g)</text>
<rect x="20" y="390" width="140" height="58" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="423.6" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">Submission</text>
<rect x="170" y="390" width="225" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="282.5" y="415.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">each gl.* call runs in order</text>
<text x="282.5" y="430.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.drawElements(...)</text>
<rect x="410" y="390" width="330" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575.0" y="415.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">encoder records commands;</text>
<text x="575.0" y="430.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">queue.submit([encoder.finish()])</text>
<text x="380" y="468" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">WebGL mutates one global state machine; WebGPU records immutable objects into command buffers.</text>
</svg>
