<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ctx-recovery-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Recovering the Bookshelf scene after a context loss</text>
<rect x="20" y="50" width="134" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/><text x="36" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="95.0" y="71" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Running</text>
<rect x="42" y="90" width="90" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="50" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<rect x="76" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<rect x="102" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<line x1="46" y1="146" x2="128" y2="146" stroke="#92400E" stroke-width="3"/>
<text x="87.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Renders every frame;</text>
<text x="87.0" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">all handles valid</text>
<line x1="154" y1="125" x2="166" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-recovery-storyboard)"/>
<rect x="166" y="50" width="134" height="150" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="182" cy="66" r="11" fill="#B45309"/><text x="182" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="241.0" y="71" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Lost</text>
<rect x="188" y="90" width="90" height="60" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="233" y="125" font-size="26" font-weight="bold" fill="#92400E" text-anchor="middle">X</text>
<text x="233.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Event: preventDefault,</text>
<text x="233.0" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">stop the loop</text>
<line x1="300" y1="125" x2="312" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-recovery-storyboard)"/>
<rect x="312" y="50" width="134" height="150" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="328" cy="66" r="11" fill="#B45309"/><text x="328" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="387.0" y="71" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Waiting</text>
<rect x="334" y="90" width="90" height="60" rx="4" fill="#E5E7EB" stroke="#B45309" stroke-width="1.2"/>
<text x="379" y="125" font-size="22" font-weight="bold" fill="#92400E" text-anchor="middle">...</text>
<text x="379.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">gl calls do nothing;</text>
<text x="379.0" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">poll isContextLost</text>
<line x1="446" y1="125" x2="458" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-recovery-storyboard)"/>
<rect x="458" y="50" width="134" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#4F46E5"/><text x="474" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="533.0" y="71" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Restored</text>
<rect x="480" y="90" width="90" height="60" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="525" y="118" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">blank canvas</text>
<text x="525" y="132" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">no resources</text>
<text x="525.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Event fires; old</text>
<text x="525.0" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">handles are invalid</text>
<line x1="592" y1="125" x2="604" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ctx-recovery-storyboard)"/>
<rect x="604" y="50" width="134" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="620" cy="66" r="11" fill="#4F46E5"/><text x="620" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="679.0" y="71" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Rebuilt</text>
<rect x="626" y="90" width="90" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="634" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<rect x="660" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<rect x="686" y="100" width="16" height="42" fill="#4F46E5" opacity="0.8"/>
<line x1="630" y1="146" x2="712" y2="146" stroke="#92400E" stroke-width="3"/>
<text x="671.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Recreate programs,</text>
<text x="671.0" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">buffers; restart loop</text>
<rect x="20" y="222" width="720" height="86" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="254.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Your JavaScript variables still exist, but every WebGL object and extension object stored in them is now invalid.</text>
<text x="380.0" y="268.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Keep a recipe (data and parameters) per resource so the restored handler can rebuild them in dependency order.</text>
<text x="380.0" y="282.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Game state (score, positions, camera) lives in JavaScript and is untouched, so play resumes where it stopped.</text>
</svg>
