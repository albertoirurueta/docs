<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A hydration mismatch and the client re-render it causes</title>
  <desc id="d">On the left, the server renders a paragraph with the date in the server locale. In the middle, the browser renders the same component with its own locale during hydration and compares. If the text matches, React attaches event handlers and keeps the DOM. If it differs, React discards the server DOM below the nearest Suspense boundary, or the whole root when there is none, and renders the tree again on the client. Typed input, focus and scroll inside the discarded part are lost.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b00020"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b36"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>
  <text x="460" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Hydration mismatch: what React compares and what it throws away</text>
  <text x="460" y="47" font-size="12" fill="#555555" text-anchor="middle">Example: a Client Component formats a date with toLocaleDateString(), the server and the browser use different locales.</text>
  <text x="20" y="80" font-size="14" font-weight="bold" fill="#222222">1. Server HTML (already in the DOM)</text>
  <rect x="20" y="92" width="260" height="128" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.5"/>
  <text x="30" y="111" font-size="12" fill="#222222">&lt;main&gt;</text>
  <text x="30" y="128" font-size="12" fill="#222222">&#160;&#160;&lt;h1&gt;Dune&lt;/h1&gt;</text>
  <text x="30" y="145" font-size="12" fill="#222222">&#160;&#160;&lt;p&gt;Added on 2026/6/15&lt;/p&gt;</text>
  <text x="30" y="162" font-size="12" fill="#222222">&#160;&#160;&lt;input&gt;  (user typed here)</text>
  <text x="30" y="179" font-size="12" fill="#222222">&lt;/main&gt;</text>
  <text x="30" y="196" font-size="12" fill="#222222">server: LANG=ja_JP, TZ=UTC</text>
  <text x="330" y="80" font-size="14" font-weight="bold" fill="#222222">2. Client first render</text>
  <rect x="330" y="92" width="260" height="128" fill="#f1ebf8" stroke="#5b3a8c" stroke-width="1.5"/>
  <text x="340" y="111" font-size="12" fill="#222222">&lt;main&gt;</text>
  <text x="340" y="128" font-size="12" fill="#222222">&#160;&#160;&lt;h1&gt;Dune&lt;/h1&gt;</text>
  <text x="340" y="145" font-size="12" fill="#222222">&#160;&#160;&lt;p&gt;Added on 6/15/2026&lt;/p&gt;</text>
  <text x="340" y="162" font-size="12" fill="#222222">&#160;&#160;&lt;input&gt;</text>
  <text x="340" y="179" font-size="12" fill="#222222">&lt;/main&gt;</text>
  <text x="340" y="196" font-size="12" fill="#222222">browser: en-US, America/New_York</text>
  <line x1="280" y1="156" x2="326" y2="156" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="338" y="131" width="244" height="20" fill="none" stroke="#b00020" stroke-width="1.6"/>
  <rect x="28" y="131" width="244" height="20" fill="none" stroke="#b00020" stroke-width="1.6"/>
  <text x="640" y="80" font-size="14" font-weight="bold" fill="#222222">3. Compare</text>
  <rect x="640" y="92" width="260" height="128" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="652" y="112" font-size="12" fill="#222222">text node, server vs client:</text>
  <text x="652" y="134" font-size="12" fill="#b00020">- "Added on 2026/6/15"  (Server)</text>
  <text x="652" y="152" font-size="12" fill="#1e6b36">+ "Added on 6/15/2026"  (Client)</text>
  <text x="652" y="178" font-size="12" fill="#222222">dev: overlay with + Client / - Server</text>
  <text x="652" y="196" font-size="12" fill="#222222">prod: Minified React error #418</text>
  <line x1="590" y1="156" x2="636" y2="156" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="220" x2="770" y2="246" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="560" y="248" width="340" height="40" fill="#fbe9e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="570" y="266" font-size="12" font-weight="bold" fill="#222222">Mismatch: the server DOM cannot be trusted</text>
  <text x="570" y="282" font-size="12" fill="#222222">React reports a recoverable error and falls back</text>
  <rect x="20" y="248" width="300" height="40" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="30" y="266" font-size="12" font-weight="bold" fill="#222222">Match: attach event handlers, keep the DOM</text>
  <text x="30" y="282" font-size="12" fill="#222222">typed text, focus and scroll are preserved</text>
  <path d="M 640 156 L 620 156 L 620 232 L 170 232 L 170 246" fill="none" stroke="#1e6b36" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="400" y="250" font-size="11" fill="#1e6b36" text-anchor="middle">identical output</text>
  <line x1="730" y1="288" x2="730" y2="318" stroke="#b00020" stroke-width="1.6" marker-end="url(#arrr)"/>
  <text x="20" y="338" font-size="14" font-weight="bold" fill="#222222">4. How much is regenerated depends on the nearest Suspense (or error) boundary</text>
  <text x="20" y="364" font-size="13" font-weight="bold" fill="#222222">A. No boundary around the mismatch</text>
  <rect x="20" y="374" width="420" height="150" fill="#fbe9e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="30" y="394" font-size="12" font-weight="bold" fill="#222222">whole root is client-rendered again</text>
  <rect x="40" y="404" width="180" height="40" fill="#ffffff" stroke="#b00020" stroke-width="1.2"/><text x="50" y="428" font-size="12" fill="#222222">search box (text lost)</text>
  <rect x="230" y="404" width="190" height="40" fill="#ffffff" stroke="#b00020" stroke-width="1.2"/><text x="240" y="428" font-size="12" fill="#222222">date paragraph (the bug)</text>
  <text x="30" y="470" font-size="12" fill="#222222">Measured in the scratch app (prod build): both inputs lost</text>
  <text x="30" y="488" font-size="12" fill="#222222">their typed text, both DOM nodes were replaced.</text>
  <text x="30" y="510" font-size="12" fill="#222222">Cost: the server HTML is thrown away, the work is done twice.</text>
  <text x="480" y="364" font-size="13" font-weight="bold" fill="#222222">B. Mismatch inside a Suspense boundary</text>
  <rect x="480" y="374" width="420" height="150" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="490" y="394" font-size="12" font-weight="bold" fill="#222222">only the boundary is client-rendered again</text>
  <rect x="500" y="404" width="180" height="40" fill="#ffffff" stroke="#1e6b36" stroke-width="1.2"/><text x="510" y="428" font-size="12" fill="#222222">search box (kept)</text>
  <rect x="690" y="404" width="190" height="40" fill="#fbe9e9" stroke="#b00020" stroke-width="1.5" stroke-dasharray="5 3"/><text x="700" y="422" font-size="12" fill="#222222">Suspense boundary:</text><text x="700" y="438" font-size="12" fill="#222222">date paragraph</text>
  <text x="490" y="470" font-size="12" fill="#222222">Measured: the input outside kept its text and its DOM node,</text>
  <text x="490" y="488" font-size="12" fill="#222222">the input inside the boundary was replaced.</text>
  <text x="490" y="510" font-size="12" fill="#222222">Smaller blast radius, same bug: still fix the cause.</text>
  <text x="460" y="560" font-size="12" fill="#555555" text-anchor="middle">suppressHydrationWarning silences the report for one element (one level deep) and keeps the server text; it does not repair anything.</text>
  <text x="460" y="580" font-size="12" fill="#555555" text-anchor="middle">Attribute mismatches are different: React reports them in development, never patches them, and does not regenerate the tree.</text>
</svg>
