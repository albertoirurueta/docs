<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which HTTPServer.Configuration property acts where</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">one listening socket, then one handler pipeline per accepted connection (Vapor 4.122.2)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- listener -->
  <rect x="20" y="64" width="200" height="110" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="120" y="86" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Listening socket</text>
  <text x="120" y="106" font-size="11" fill="#222222" text-anchor="middle">address (hostname, port or</text>
  <text x="120" y="120" font-size="11" fill="#222222" text-anchor="middle">Unix socket), backlog,</text>
  <text x="120" y="134" font-size="11" fill="#222222" text-anchor="middle">reuseAddress,</text>
  <text x="120" y="148" font-size="11" fill="#222222" text-anchor="middle">connectionsPerServerTick</text>
  <text x="120" y="164" font-size="10" fill="#b7410e" text-anchor="middle">read once, at start</text>

  <!-- accepted -->
  <rect x="270" y="64" width="190" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="365" y="86" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Accepted connection</text>
  <text x="365" y="108" font-size="11" fill="#222222" text-anchor="middle">tcpNoDelay (TCP_NODELAY)</text>
  <text x="365" y="124" font-size="11" fill="#222222" text-anchor="middle">fresh copy of the</text>
  <text x="365" y="138" font-size="11" fill="#222222" text-anchor="middle">configuration per connection</text>
  <text x="365" y="164" font-size="10" fill="#b7410e" text-anchor="middle">tcpNoDelay: read once, at start</text>

  <!-- tls -->
  <rect x="510" y="64" width="200" height="110" rx="8" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="610" y="86" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">TLS (optional)</text>
  <text x="610" y="108" font-size="11" fill="#222222" text-anchor="middle">tlsConfiguration, then ALPN:</text>
  <text x="610" y="124" font-size="11" fill="#222222" text-anchor="middle">h2 if supportVersions has .two,</text>
  <text x="610" y="138" font-size="11" fill="#222222" text-anchor="middle">http/1.1 if it has .one</text>
  <text x="610" y="164" font-size="10" fill="#666666" text-anchor="middle">without TLS: HTTP/1.1 only</text>

  <!-- idle -->
  <rect x="760" y="64" width="160" height="110" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="840" y="86" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Idle timeout</text>
  <text x="840" y="108" font-size="11" fill="#222222" text-anchor="middle">idleTimeout (4.122.0)</text>
  <text x="840" y="124" font-size="11" fill="#222222" text-anchor="middle">closes a connection with</text>
  <text x="840" y="138" font-size="11" fill="#222222" text-anchor="middle">no traffic for that long;</text>
  <text x="840" y="154" font-size="11" fill="#222222" text-anchor="middle">nil = never</text>

  <line x1="220" y1="119" x2="268" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="119" x2="508" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="119" x2="758" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>

  <!-- split -->
  <line x1="840" y1="174" x2="840" y2="196" stroke="#444444" stroke-width="2"/>
  <line x1="840" y1="196" x2="470" y2="196" stroke="#444444" stroke-width="2"/>
  <line x1="470" y1="196" x2="470" y2="214" stroke="#444444" stroke-width="2"/>
  <line x1="470" y1="196" x2="230" y2="196" stroke="#444444" stroke-width="2"/>
  <line x1="230" y1="196" x2="230" y2="214" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="196" x2="470" y2="214" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>

  <!-- http1 lane -->
  <rect x="20" y="216" width="420" height="168" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="230" y="238" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">HTTP/1.1 pipeline</text>
  <text x="40" y="262" font-size="11" fill="#222222">1. HTTP request decoder / response encoder</text>
  <text x="40" y="280" font-size="11" fill="#222222">2. supportPipelining: pipeline handler (HTTP/1.1 only)</text>
  <text x="40" y="298" font-size="11" fill="#222222">3. responseCompression: gzip or deflate compressor</text>
  <text x="40" y="316" font-size="11" fill="#222222">4. requestDecompression: limit on size or ratio</text>
  <text x="40" y="334" font-size="11" fill="#222222">5. serverName and Date headers on every response</text>
  <text x="40" y="352" font-size="11" fill="#222222">6. upgrade handler (WebSocket), then Vapor handler</text>
  <text x="40" y="372" font-size="10" fill="#666666">errors close the connection (close-on-error handler)</text>

  <!-- http2 lane -->
  <rect x="480" y="216" width="440" height="168" rx="8" fill="#ffffff" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="700" y="238" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">HTTP/2 pipeline (one per stream)</text>
  <text x="500" y="262" font-size="11" fill="#222222">1. HTTP/2 frames converted to HTTP/1-style messages</text>
  <text x="500" y="280" font-size="11" fill="#222222">2. supportPipelining: not used (streams multiplex)</text>
  <text x="500" y="298" font-size="11" fill="#222222">3. responseCompression: same compressor</text>
  <text x="500" y="316" font-size="11" fill="#222222">4. requestDecompression: same limit</text>
  <text x="500" y="334" font-size="11" fill="#222222">5. serverName and Date headers on every response</text>
  <text x="500" y="352" font-size="11" fill="#222222">6. Vapor handler (no upgrade handler)</text>
  <text x="500" y="372" font-size="10" fill="#666666">requires TLS: plaintext h2c is not supported</text>

  <!-- responder -->
  <line x1="230" y1="384" x2="230" y2="410" stroke="#444444" stroke-width="2"/>
  <line x1="700" y1="384" x2="700" y2="410" stroke="#444444" stroke-width="2"/>
  <line x1="230" y1="410" x2="700" y2="410" stroke="#444444" stroke-width="2"/>
  <line x1="465" y1="410" x2="465" y2="426" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="270" y="428" width="390" height="32" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="465" y="449" font-size="13" font-weight="bold" fill="#b7410e" text-anchor="middle">responder: middleware, router, handler</text>
</svg>
