<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-rt-two" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Two ways to trace a ray</text>
<rect x="30" y="50" width="320" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="74.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Ray tracing pipeline (VK_KHR_ray_tracing_pipeline)</text>
<rect x="410" y="50" width="320" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="74.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Ray query (VK_KHR_ray_query)</text>
<rect x="30" y="110" width="320" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="133.2" text-anchor="middle" font-size="12" fill="#3730A3">vkCmdTraceRaysKHR starts a grid</text>
<rect x="30" y="160" width="320" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="183.2" text-anchor="middle" font-size="12" fill="#3730A3">raygen shader calls traceRayEXT</text>
<line x1="190" y1="148" x2="190" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="30" y="210" width="320" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="233.2" text-anchor="middle" font-size="12" fill="#3730A3">hardware traversal finds hits</text>
<line x1="190" y1="198" x2="190" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="30" y="260" width="320" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="283.2" text-anchor="middle" font-size="12" fill="#3730A3">hit shaders run, found via the SBT</text>
<line x1="190" y1="248" x2="190" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="30" y="310" width="320" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="333.2" text-anchor="middle" font-size="12" fill="#3730A3">miss shader runs if nothing is hit</text>
<line x1="190" y1="298" x2="190" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="410" y="110" width="320" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="133.2" text-anchor="middle" font-size="12" fill="#92400E">Ordinary draw or dispatch</text>
<rect x="410" y="160" width="320" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="183.2" text-anchor="middle" font-size="12" fill="#92400E">shader declares a rayQueryEXT object</text>
<line x1="570" y1="148" x2="570" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="410" y="210" width="320" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="233.2" text-anchor="middle" font-size="12" fill="#92400E">rayQueryProceedEXT loops over candidates</text>
<line x1="570" y1="198" x2="570" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="410" y="260" width="320" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="283.2" text-anchor="middle" font-size="12" fill="#92400E">your code decides: commit or ignore</text>
<line x1="570" y1="248" x2="570" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="410" y="310" width="320" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="333.2" text-anchor="middle" font-size="12" fill="#92400E">no SBT, no recursion, no hit shaders</text>
<line x1="570" y1="298" x2="570" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-two)"/>
<rect x="30" y="370" width="700" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="391.2" text-anchor="middle" font-size="12" fill="#065F46">Both read the same TLAS built with VK_KHR_acceleration_structure; an application can use both.</text>
</svg>
