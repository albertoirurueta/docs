<text x="673.6" y="120" text-anchor="middle" font-size="11" fill="#374151">click Launch</text>
<text x="673.6" y="140" text-anchor="middle" font-size="11" fill="#374151">Project Browser</text>
<text x="673.6" y="212" text-anchor="middle" font-size="11" fill="#374151">Next: create the</text>
<text x="673.6" y="226" text-anchor="middle" font-size="11" fill="#374151">Bookshelf project</text>
