<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-rendering-pipeline-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The WebGL 2 rendering pipeline for one draw call</text>
<rect x="20" y="60" width="150" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95" y="81.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex fetch</text>
<text x="95" y="96.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">attributes + VAO</text>
<text x="95" y="111.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">element buffer</text>
<text x="95" y="126.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.drawArrays / Elements</text>
<circle cx="22" cy="62" r="11" fill="#4F46E5"/>
<text x="22" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="210" y="60" width="150" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="285" y="81.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex shader</text>
<text x="285" y="96.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">runs once per vertex</text>
<text x="285" y="111.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">writes gl_Position</text>
<text x="285" y="126.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">writes varyings</text>
<circle cx="212" cy="62" r="11" fill="#B45309"/>
<text x="212" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="400" y="60" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475" y="81.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Assembly + clipping</text>
<text x="475" y="96.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">points, lines, triangles</text>
<text x="475" y="111.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">clip to -w .. w</text>
<text x="475" y="126.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">cull front or back</text>
<circle cx="402" cy="62" r="11" fill="#4F46E5"/>
<text x="402" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="590" y="60" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665" y="81.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Viewport</text>
<text x="665" y="96.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">divide by w</text>
<text x="665" y="111.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">viewport transform</text>
<text x="665" y="126.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">NDC to window</text>
<circle cx="592" cy="62" r="11" fill="#4F46E5"/>
<text x="592" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="20" y="220" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95" y="241.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Rasterisation</text>
<text x="95" y="256.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">triangle to fragments</text>
<text x="95" y="271.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">pixel centres tested</text>
<text x="95" y="286.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">varyings interpolated</text>
<circle cx="22" cy="222" r="11" fill="#4F46E5"/>
<text x="22" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="210" y="220" width="150" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="285" y="241.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Fragment shader</text>
<text x="285" y="256.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">runs once per fragment</text>
<text x="285" y="271.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">writes colour</text>
<text x="285" y="286.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">may discard</text>
<circle cx="212" cy="222" r="11" fill="#B45309"/>
<text x="212" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="400" y="220" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475" y="241.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Per-fragment ops</text>
<text x="475" y="256.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">scissor, stencil,</text>
<text x="475" y="271.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">depth, blend,</text>
<text x="475" y="286.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">dither, write masks</text>
<circle cx="402" cy="222" r="11" fill="#4F46E5"/>
<text x="402" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<rect x="590" y="220" width="150" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665" y="241.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Framebuffer</text>
<text x="665" y="256.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">canvas drawing buffer</text>
<text x="665" y="271.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">or a framebuffer</text>
<text x="665" y="286.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">object (FBO)</text>
<circle cx="592" cy="222" r="11" fill="#4F46E5"/>
<text x="592" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
<line x1="170" y1="100" x2="210" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<line x1="360" y1="100" x2="400" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<line x1="550" y1="100" x2="590" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<path d="M665,140 V180 H95 V220" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<line x1="170" y1="260" x2="210" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<line x1="360" y1="260" x2="400" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<line x1="550" y1="260" x2="590" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-stages)"/>
<text x="285" y="156" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">WebGL 2: outputs can be captured</text>
<text x="285" y="169" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">by transform feedback</text>
<rect x="20" y="350" width="16" height="16" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="44" y="363" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">programmable stage (your GLSL)</text>
<rect x="260" y="350" width="16" height="16" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="284" y="363" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">fixed-function stage (state set with gl.enable and friends)</text>
<rect x="20" y="376" width="16" height="16" rx="3" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="44" y="389" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">memory you create and fill</text>
</svg>
