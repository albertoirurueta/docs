<title id="pypi-downloads-t">PyPI downloads per week</title>
<desc id="pypi-downloads-d">Weekly PyPI downloads of mkdocs, mkdocs-material and zensical over the 180 days before 2026-10-26, excluding mirrors, from the pypistats.org API. Only complete Monday-to-Sunday weeks are shown.</desc>
