<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-nav1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A NavMesh is a surface of convex polygons, and an agent follows a corridor of them</text>
<rect x="30" y="50" width="470" height="340" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="265" y="70" text-anchor="middle" font-size="11" fill="#374151">Top view of the Bookshelf room (floor plan)</text>
<polygon points="50,85 200,85 190,150 50,150" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="200,85 330,85 320,150 190,150" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="330,85 480,85 480,150 320,150" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="50,150 190,150 190,320 50,320" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="320,150 480,150 480,320 320,320" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="50,320 190,320 200,370 50,370" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="190,320 320,320 330,370 200,370" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="320,320 480,320 480,370 330,370" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<polygon points="190,150 320,150 320,320 190,320" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255" y="225" text-anchor="middle" font-size="12" fill="#374151">Shelf</text>
<text x="255" y="240" text-anchor="middle" font-size="12" fill="#374151">(carved</text>
<text x="255" y="255" text-anchor="middle" font-size="12" fill="#374151">obstacle)</text>
<polyline points="80,120 185,155 185,325 205,368 330,368 400,340" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#ah-nav1)"/>
<circle cx="80" cy="120" r="9" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="80" y="106" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">agent</text>
<circle cx="400" cy="340" r="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="400" y="328" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">goal</text>
<circle cx="185" cy="155" r="4" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<circle cx="185" cy="325" r="4" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<circle cx="205" cy="368" r="4" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<rect x="520" y="50" width="215" height="340" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="627" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">How the agent gets there</text>
<circle cx="540" cy="100" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="540" y="104.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="558" y="98" text-anchor="start" font-size="11" fill="#374151">Map start and goal to the</text>
<text x="558" y="112" text-anchor="start" font-size="11" fill="#374151">nearest polygons</text>
<circle cx="540" cy="156" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="540" y="160.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="558" y="154" text-anchor="start" font-size="11" fill="#374151">A* finds the polygon</text>
<text x="558" y="168" text-anchor="start" font-size="11" fill="#374151">sequence (the corridor)</text>
<circle cx="540" cy="212" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="540" y="216.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="558" y="210" text-anchor="start" font-size="11" fill="#374151">Steer to the next visible</text>
<text x="558" y="224" text-anchor="start" font-size="11" fill="#374151">corner of the corridor</text>
<circle cx="540" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="540" y="272.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="558" y="266" text-anchor="start" font-size="11" fill="#374151">Avoidance (RVO) adjusts</text>
<text x="558" y="280" text-anchor="start" font-size="11" fill="#374151">velocity near other agents</text>
<circle cx="540" cy="324" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="540" y="328.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="558" y="322" text-anchor="start" font-size="11" fill="#374151">The agent moves; it stays</text>
<text x="558" y="336" text-anchor="start" font-size="11" fill="#374151">on the NavMesh surface</text>
</svg>
