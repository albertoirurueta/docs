<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Content sources aggregated into one Antora site</title>
  <desc id="d">Two Git repositories with branches, a tag and a worktree are filtered by the content sources and become component versions of one site.</desc>
  <rect width="760" height="400" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">Git repositories</text>
  <text x="300" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">Content source filters</text>
  <text x="560" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">One site</text>

  <rect x="20" y="42" width="230" height="170" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="64" font-size="13" font-weight="bold" fill="#f9fafb">pocket-units (start_path: docs)</text>
  <rect x="32" y="76" width="95" height="24" rx="4" fill="#2563eb"/><text x="42" y="93" font-size="12" fill="#ffffff">main (HEAD)</text>
  <rect x="32" y="108" width="95" height="24" rx="4" fill="#2563eb"/><text x="42" y="125" font-size="12" fill="#ffffff">release_1.1</text>
  <rect x="32" y="140" width="95" height="24" rx="4" fill="#2563eb"/><text x="42" y="157" font-size="12" fill="#ffffff">release_2.0</text>
  <rect x="140" y="76" width="95" height="24" rx="4" fill="#7c3aed"/><text x="152" y="93" font-size="12" fill="#ffffff">tag v1.0.0</text>
  <rect x="140" y="108" width="95" height="24" rx="4" fill="#b45309"/><text x="150" y="125" font-size="12" fill="#ffffff">worktree</text>
  <text x="32" y="190" font-size="12" fill="#d1d5db">release_1.0 also exists, not selected</text>

  <rect x="20" y="236" width="230" height="140" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="258" font-size="13" font-weight="bold" fill="#f9fafb">pocket-units-py</text>
  <rect x="32" y="272" width="95" height="24" rx="4" fill="#2563eb"/><text x="42" y="289" font-size="12" fill="#ffffff">main (HEAD)</text>
  <text x="32" y="322" font-size="12" fill="#d1d5db">py/docs/antora.yml</text>
  <text x="32" y="342" font-size="12" fill="#d1d5db">cli/docs/antora.yml</text>
  <text x="32" y="362" font-size="12" fill="#d1d5db">(start_paths)</text>

  <rect x="290" y="62" width="190" height="110" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="302" y="86" font-size="12" fill="#ffffff">branches: release_2.0, main</text>
  <text x="302" y="108" font-size="12" fill="#ffffff">tags: v1.0.*</text>
  <text x="302" y="130" font-size="12" fill="#ffffff">worktrees: *</text>
  <text x="302" y="152" font-size="12" fill="#ffffff">edit_url: refname and path</text>
  <rect x="290" y="250" width="190" height="90" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="302" y="274" font-size="12" fill="#ffffff">branches: HEAD</text>
  <text x="302" y="296" font-size="12" fill="#ffffff">start_paths: py/docs, cli/docs</text>

  <rect x="540" y="62" width="200" height="300" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="552" y="86" font-size="13" font-weight="bold" fill="#f9fafb">Component versions</text>
  <text x="552" y="112" font-size="12" fill="#f9fafb">pocket-units 1.0 (from tag)</text>
  <text x="552" y="136" font-size="12" fill="#f9fafb">pocket-units 2.0</text>
  <text x="552" y="160" font-size="12" fill="#f9fafb">pocket-units (versionless)</text>
  <text x="552" y="196" font-size="12" fill="#f9fafb">pocket-units-py 1.0</text>
  <text x="552" y="220" font-size="12" fill="#f9fafb">pocket-units-cli 1.0</text>
  <text x="552" y="262" font-size="12" fill="#d1d5db">Each version has its own pages,</text>
  <text x="552" y="282" font-size="12" fill="#d1d5db">navigation and URL; the version</text>
  <text x="552" y="302" font-size="12" fill="#d1d5db">comes from antora.yml.</text>

  <path d="M250 117 H288" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <path d="M250 295 H288" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <path d="M480 117 H538" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <path d="M480 295 H538" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
</svg>
