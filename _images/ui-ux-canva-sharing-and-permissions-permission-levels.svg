<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Access level and permission level for the Book of the week post</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <rect x="30" y="50" width="200" height="56" rx="10" fill="#EEF2FF"/>
    <rect x="280" y="50" width="200" height="56" rx="10" fill="#EEF2FF"/>
    <rect x="530" y="50" width="200" height="56" rx="10" fill="#EEF2FF"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="130" y="74">Only you can access</text><text x="380" y="74">Only your team</text><text x="630" y="74">Anyone with the link</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="130" y="94">default for a new design</text><text x="380" y="94">team workspaces only</text><text x="630" y="94">guests need no account</text>
  </g>
  <text x="380" y="132" font-size="12" fill="#4B5563" text-anchor="middle">Each shared audience then gets one permission level</text>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M380,138 L380,152" marker-end="url(#ah)"/></g>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <g stroke="#9CA3AF" fill="#F9FAFB">
    <rect x="30" y="158" width="200" height="190" rx="8"/><rect x="280" y="158" width="200" height="190" rx="8"/><rect x="530" y="158" width="200" height="190" rx="8" stroke="#B45309" stroke-width="2" fill="#FEF3C7"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle"><text x="130" y="182" fill="#4F46E5">Can view</text><text x="380" y="182" fill="#4F46E5">Can comment</text><text x="630" y="182" fill="#92400E">Can edit</text></g>
  <g font-size="12" fill="#374151">
    <text x="46" y="210">View, present and play</text><text x="46" y="230">Read comments</text><text x="46" y="250">Live updates are shown</text><text x="46" y="270">No changes to the design</text>
    <text x="296" y="210">Everything in Can view</text><text x="296" y="230">Add and reply to comments</text><text x="296" y="250">Sign-in needed to comment</text><text x="296" y="270">No changes to the design</text>
    <text x="546" y="210">Everything in Can comment</text><text x="546" y="230">Add, edit, delete elements</text><text x="546" y="250">Add, edit, delete pages</text><text x="546" y="270">Guests appear as animals</text>
    <text x="546" y="290">Guests cannot upload,</text><text x="546" y="306">download, copy or print</text>
  </g>
  <text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Permissions can be changed at any time after sharing</text>
  <text x="380" y="388" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
