<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="xp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Inside books-inventory.xlsx: a zip archive of XML parts tied together by relationships</text>

  <rect x="20" y="42" width="410" height="410" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="1.4"/>
  <text x="225" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Zip entries (unzip -l books-inventory.xlsx)</text>

  <rect x="36" y="78" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="98" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">[Content_Types].xml</text>
  <rect x="36" y="114" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="134" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">_rels/.rels</text>
  <rect x="36" y="150" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="170" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">docProps/core.xml, docProps/app.xml</text>
  <rect x="36" y="186" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="206" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/workbook.xml</text>
  <rect x="36" y="222" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="242" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/_rels/workbook.xml.rels</text>
  <rect x="36" y="258" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="278" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/worksheets/sheet1.xml</text>
  <rect x="36" y="294" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="314" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/styles.xml, xl/sharedStrings.xml</text>
  <rect x="36" y="330" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="350" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/drawings/drawing1.xml, xl/charts/chart1.xml</text>
  <rect x="36" y="366" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="386" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/tables/table1.xml, xl/theme/theme1.xml</text>
  <rect x="36" y="402" width="378" height="30" rx="4" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="48" y="422" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">xl/media/image1.png (binary part)</text>

  <text x="670" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#333">How a reader walks the package</text>
  <rect x="520" y="78" width="300" height="46" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="670" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1d75">1. [Content_Types].xml</text>
  <text x="670" y="114" text-anchor="middle" font-size="11" fill="#333">maps every part to a MIME type</text>
  <rect x="520" y="150" width="300" height="46" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="670" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1d75">2. _rels/.rels (package relationships)</text>
  <text x="670" y="186" text-anchor="middle" font-size="11" fill="#333">officeDocument, core and extended properties</text>
  <rect x="520" y="222" width="300" height="46" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="670" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">3. xl/workbook.xml (main part)</text>
  <text x="670" y="258" text-anchor="middle" font-size="11" fill="#333">sheet names with r:id values</text>
  <rect x="520" y="294" width="300" height="46" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="670" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1d75">4. xl/_rels/workbook.xml.rels</text>
  <text x="670" y="330" text-anchor="middle" font-size="11" fill="#333">r:id resolved to a target part name</text>
  <rect x="520" y="366" width="300" height="46" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="670" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">5. xl/worksheets/sheet1.xml</text>
  <text x="670" y="402" text-anchor="middle" font-size="11" fill="#333">rows and cells, styles by index</text>
  <line x1="670" y1="124" x2="670" y2="148" stroke="#555" stroke-width="1.6" marker-end="url(#xp-arrow)"/>
  <line x1="670" y1="196" x2="670" y2="220" stroke="#555" stroke-width="1.6" marker-end="url(#xp-arrow)"/>
  <line x1="670" y1="268" x2="670" y2="292" stroke="#555" stroke-width="1.6" marker-end="url(#xp-arrow)"/>
  <line x1="670" y1="340" x2="670" y2="364" stroke="#555" stroke-width="1.6" marker-end="url(#xp-arrow)"/>
  <text x="670" y="440" text-anchor="middle" font-size="11" fill="#333">Purple: OPC plumbing. Blue: SpreadsheetML parts. Orange: binary.</text>
</svg>
