<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>Latency timeline of one spoken turn</title>
  <desc>Timeline of one spoken turn in a cascaded voice agent. The user stops speaking at time zero. The first segment is network transit and audio buffering, the second is end-of-turn detection, the third is the time to the first token of the language model including retrieval, the fourth is the time to the first audio byte of the speech synthesiser, and the fifth is network transit back. Their sum is the response time the user perceives. Below, the streaming alternative shows the language model, sentence chunker and synthesiser overlapping so the first audio plays while later sentences are still being generated.</desc>
  <rect x="0" y="0" width="1000" height="400" fill="#f8fafc"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">One spoken turn: where the time goes</text>
  <line x1="60" y1="70" x2="60" y2="215" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="60" y="62" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="bold">user stops speaking (t = 0)</text>
  <line x1="940" y1="70" x2="940" y2="215" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="940" y="62" text-anchor="middle" font-size="11" fill="#15803d" font-weight="bold">first audible word</text>
  <rect x="60" y="85" width="110" height="44" fill="#e2e8f0" stroke="#334155"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">T_net (up)</text>
  <text x="115" y="120" text-anchor="middle" font-size="10" fill="#334155">transit, buffer</text>
  <rect x="170" y="85" width="170" height="44" fill="#fef3c7" stroke="#b45309"/>
  <text x="255" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">T_eot</text>
  <text x="255" y="120" text-anchor="middle" font-size="10" fill="#334155">silence wait, turn model</text>
  <rect x="340" y="85" width="270" height="44" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="475" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">T_TTFT (LLM + retrieval)</text>
  <text x="475" y="120" text-anchor="middle" font-size="10" fill="#334155">search tool, first token</text>
  <rect x="610" y="85" width="220" height="44" fill="#dcfce7" stroke="#15803d"/>
  <text x="720" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">T_TTFB (TTS)</text>
  <text x="720" y="120" text-anchor="middle" font-size="10" fill="#334155">first sentence to first byte</text>
  <rect x="830" y="85" width="110" height="44" fill="#e2e8f0" stroke="#334155"/>
  <text x="885" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">T_net (down)</text>
  <text x="885" y="120" text-anchor="middle" font-size="10" fill="#334155">transit, jitter buffer</text>
  <text x="500" y="160" text-anchor="middle" font-size="12" fill="#0f172a">T_resp = T_net + T_eot + T_TTFT + T_TTFB (sequential stages add up)</text>
  <text x="500" y="182" text-anchor="middle" font-size="11" fill="#334155">STT runs while the user speaks, so it adds only its final-result delay, which is folded into T_eot.</text>

  <text x="60" y="235" font-size="13" font-weight="bold" fill="#0f172a">Streaming overlap after the first token</text>
  <rect x="340" y="250" width="420" height="26" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="550" y="268" text-anchor="middle" font-size="11" fill="#0f172a">LLM streams tokens (sentence 1, sentence 2, sentence 3)</text>
  <rect x="470" y="284" width="110" height="26" fill="#fef3c7" stroke="#b45309"/>
  <text x="525" y="302" text-anchor="middle" font-size="11" fill="#0f172a">chunk s1</text>
  <rect x="580" y="284" width="110" height="26" fill="#fef3c7" stroke="#b45309"/>
  <text x="635" y="302" text-anchor="middle" font-size="11" fill="#0f172a">chunk s2</text>
  <rect x="520" y="318" width="150" height="26" fill="#dcfce7" stroke="#15803d"/>
  <text x="595" y="336" text-anchor="middle" font-size="11" fill="#0f172a">TTS s1</text>
  <rect x="670" y="318" width="150" height="26" fill="#dcfce7" stroke="#15803d"/>
  <text x="745" y="336" text-anchor="middle" font-size="11" fill="#0f172a">TTS s2</text>
  <rect x="640" y="352" width="300" height="26" fill="#e2e8f0" stroke="#334155"/>
  <text x="790" y="370" text-anchor="middle" font-size="11" fill="#0f172a">playback s1, then s2 while s3 is synthesised</text>
  <text x="60" y="268" font-size="11" fill="#334155">LLM</text>
  <text x="60" y="302" font-size="11" fill="#334155">sentence chunker</text>
  <text x="60" y="336" font-size="11" fill="#334155">speech synthesiser</text>
  <text x="60" y="370" font-size="11" fill="#334155">audio out</text>
</svg>
