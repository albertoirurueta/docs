<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dsb-msaa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">4x multisampling and the resolve step</text>
<rect x="30" y="70" width="200" height="200" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<line x1="130" y1="70" x2="130" y2="270" stroke="#9CA3AF"/>
<line x1="30" y1="170" x2="230" y2="170" stroke="#9CA3AF"/>
<polygon points="30,270 230,70 230,270" fill="#4F46E5" fill-opacity="0.35" stroke="#4F46E5" stroke-width="2"/>
<circle cx="80" cy="120" r="5" fill="#B45309"/><circle cx="180" cy="120" r="5" fill="#047857"/>
<circle cx="80" cy="220" r="5" fill="#047857"/><circle cx="180" cy="220" r="5" fill="#047857"/>
<text x="130" y="296" text-anchor="middle" font-size="12" fill="#374151">Samples of one edge pixel (3 of 4 covered)</text>
<text x="130" y="314" text-anchor="middle" font-size="11" fill="#6B7280">green = covered, orange = not covered</text>
<rect x="300" y="110" width="170" height="110" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="385" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Multisampled image</text>
<text x="385" y="164" text-anchor="middle" font-size="11" fill="#374151">samples = 4, 4 values per pixel</text>
<text x="385" y="182" text-anchor="middle" font-size="11" fill="#374151">usage: color attachment,</text>
<text x="385" y="198" text-anchor="middle" font-size="11" fill="#374151">transient (tilers)</text>
<rect x="560" y="110" width="170" height="110" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Resolve target</text>
<text x="645" y="164" text-anchor="middle" font-size="11" fill="#374151">samples = 1</text>
<text x="645" y="182" text-anchor="middle" font-size="11" fill="#374151">average of 4 samples</text>
<text x="645" y="198" text-anchor="middle" font-size="11" fill="#374151">(swapchain image)</text>
<line x1="232" y1="165" x2="298" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-msaa)"/>
<line x1="470" y1="165" x2="558" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-msaa)"/>
<text x="514" y="152" text-anchor="middle" font-size="11" fill="#374151">resolveMode</text>
<text x="514" y="190" text-anchor="middle" font-size="11" fill="#374151">AVERAGE</text>
<text x="515" y="270" text-anchor="middle" font-size="12" fill="#374151">Done at the end of the rendering pass by RenderingAttachmentInfo,</text>
<text x="515" y="290" text-anchor="middle" font-size="12" fill="#374151">with storeOp DONT_CARE for the multisampled image</text>
</svg>
