<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Layered Spring Boot image vs. a fat jar in one layer</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Layered Spring Boot image vs. a fat jar in one layer</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">after a one-line code change, only the application layer is rebuilt, pushed and pulled</text>
  <rect x="20" y="65" width="340" height="300" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="83.0" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Fat jar copied as one layer</text>
  <rect x="40" y="110" width="300" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="131.0" font-size="9.5" fill="#333333" text-anchor="middle">eclipse-temurin:25-jre base layers</text>
  <text x="190.0" y="144.5" font-size="9.5" fill="#333333" text-anchor="middle">(shared, cached)</text>
  <rect x="40" y="170" width="300" height="170" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="190.0" y="230.5" font-size="11" font-weight="bold" fill="#8f2a2a" text-anchor="middle">COPY app.jar  (~80 MB)</text>
  <text x="190.0" y="246.0" font-size="9.5" fill="#333333" text-anchor="middle">dependencies + loader + your classes</text>
  <text x="190.0" y="259.5" font-size="9.5" fill="#333333" text-anchor="middle">in a single layer:</text>
  <text x="190.0" y="273.0" font-size="9.5" fill="#333333" text-anchor="middle">any code change invalidates</text>
  <text x="190.0" y="286.5" font-size="9.5" fill="#333333" text-anchor="middle">and re-ships all of it</text>
  <rect x="400" y="65" width="340" height="300" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="83.0" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Layered image (jarmode=tools extract --layers)</text>
  <rect x="420" y="110" width="300" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="131.0" font-size="9.5" fill="#333333" text-anchor="middle">eclipse-temurin:25-jre base layers</text>
  <text x="570.0" y="144.5" font-size="9.5" fill="#333333" text-anchor="middle">(shared, cached)</text>
  <rect x="420" y="170" width="300" height="40" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="570.0" y="185.8" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">dependencies</text>
  <text x="570.0" y="200.8" font-size="9" fill="#333333" text-anchor="middle">~78 MB, changes on dependency upgrades</text>
  <rect x="420" y="213" width="300" height="40" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="570.0" y="228.8" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">spring-boot-loader</text>
  <text x="570.0" y="243.8" font-size="9" fill="#333333" text-anchor="middle">~0.5 MB, changes on Boot upgrades</text>
  <rect x="420" y="256" width="300" height="40" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="570.0" y="271.8" font-size="10.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">snapshot-dependencies</text>
  <text x="570.0" y="286.8" font-size="9" fill="#333333" text-anchor="middle">SNAPSHOT jars, changes often</text>
  <rect x="420" y="299" width="300" height="40" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="570.0" y="314.8" font-size="10.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">application</text>
  <text x="570.0" y="329.8" font-size="9" fill="#333333" text-anchor="middle">~0.3 MB, changes on every commit</text>
  <text x="380" y="395" font-size="10" fill="#555555" text-anchor="middle">Order the COPY instructions from least to most frequently changed so the cache and registry reuse the big layers.</text>
</svg>
