<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="t d">
<title id="t">Where Collector, Atlas and Assembler act in an Antora run</title>
<desc id="d">A row of generator events. Collector acts at contentAggregated, Assembler at navigationBuilt, and Atlas imports a manifest and exports site-manifest.json.</desc>
<rect width="820" height="250" rx="12" fill="#263238"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
<rect x="20" y="90" width="130" height="44" rx="8" fill="#37474f" stroke="#90a4ae"/><text x="85" y="116">beforeProcess</text>
<rect x="175" y="90" width="150" height="44" rx="8" fill="#37474f" stroke="#ffcc80" stroke-width="3"/><text x="250" y="116">contentAggregated</text>
<rect x="350" y="90" width="130" height="44" rx="8" fill="#37474f" stroke="#90a4ae"/><text x="415" y="116">contentClassified</text>
<rect x="505" y="90" width="140" height="44" rx="8" fill="#37474f" stroke="#80cbc4" stroke-width="3"/><text x="575" y="116">navigationBuilt</text>
<rect x="670" y="90" width="130" height="44" rx="8" fill="#37474f" stroke="#90a4ae"/><text x="735" y="116">sitePublished</text>
<text x="250" y="30" font-size="15" font-weight="bold" fill="#ffcc80">Collector</text>
<text x="250" y="52" font-size="12" fill="#cfd8dc">run commands, scan files</text>
<text x="250" y="68" font-size="12" fill="#cfd8dc">into the aggregate</text>
<text x="575" y="30" font-size="15" font-weight="bold" fill="#80cbc4">Assembler</text>
<text x="575" y="52" font-size="12" fill="#cfd8dc">merge pages by navigation,</text>
<text x="575" y="68" font-size="12" fill="#cfd8dc">convert to PDF</text>
<rect x="250" y="180" width="320" height="46" rx="8" fill="#37474f" stroke="#ce93d8" stroke-width="3"/>
<text x="410" y="200" font-size="14" font-weight="bold" fill="#e1bee7">Atlas (alpha)</text>
<text x="410" y="217" font-size="12" fill="#cfd8dc">imports a manifest, exports site-manifest.json</text>
</g>
<g stroke="#eceff1" stroke-width="2" fill="none"><path d="M150 112H173"/><path d="M325 112H348"/><path d="M480 112H503"/><path d="M645 112H668"/></g>
<g fill="#eceff1"><path d="M173 107l8 5-8 5z"/><path d="M348 107l8 5-8 5z"/><path d="M503 107l8 5-8 5z"/><path d="M668 107l8 5-8 5z"/></g>
</svg>
