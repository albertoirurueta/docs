<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Motion Matching: from trajectory and pose history to a chosen pose</text>
<rect x="20" y="55" width="190" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Character Trajectory</text>
<text x="115.0" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">past and future samples</text>
<text x="115.0" y="103.8" text-anchor="middle" font-size="11" fill="#3730A3">(velocity, position, heading)</text>
<rect x="20" y="140" width="190" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="160.8" text-anchor="middle" font-size="11" fill="#3730A3">Pose History node</text>
<text x="115.0" y="174.8" text-anchor="middle" font-size="11" fill="#3730A3">collected bones, for example</text>
<text x="115.0" y="188.8" text-anchor="middle" font-size="11" fill="#3730A3">foot_l and foot_r</text>
<rect x="255" y="85" width="150" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="330.0" y="112.8" text-anchor="middle" font-size="11" fill="#374151">Query vector</text>
<text x="330.0" y="126.8" text-anchor="middle" font-size="11" fill="#374151">one value per channel,</text>
<text x="330.0" y="140.8" text-anchor="middle" font-size="11" fill="#374151">each scaled by its</text>
<text x="330.0" y="154.8" text-anchor="middle" font-size="11" fill="#374151">weight</text>
<rect x="450" y="60" width="150" height="140" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="525.0" y="103.8" text-anchor="middle" font-size="11" fill="#92400E">Pose Search Database</text>
<text x="525.0" y="118.8" text-anchor="middle" font-size="11" fill="#92400E">indexed poses of the</text>
<text x="525.0" y="133.8" text-anchor="middle" font-size="11" fill="#92400E">animation assets</text>
<text x="525.0" y="148.8" text-anchor="middle" font-size="11" fill="#92400E">chosen by the Schema</text>
<text x="525.0" y="163.8" text-anchor="middle" font-size="11" fill="#92400E">and Search Mode</text>
<rect x="640" y="85" width="100" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="690.0" y="118.8" text-anchor="middle" font-size="11" fill="#047857">Best pose</text>
<text x="690.0" y="133.8" text-anchor="middle" font-size="11" fill="#047857">lowest total</text>
<text x="690.0" y="148.8" text-anchor="middle" font-size="11" fill="#047857">cost</text>
<line x1="210" y1="86" x2="255" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="210" y1="171" x2="255" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="405" y1="130" x2="450" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="600" y1="130" x2="640" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M690,175 L690,225 L330,225 L330,260" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="180" y="260" width="300" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="330.0" y="278.9" text-anchor="middle" font-size="11" fill="#374151">Motion Matching node blends to the</text>
<text x="330.0" y="292.9" text-anchor="middle" font-size="11" fill="#374151">new pose (Blend Time, inertial blend option)</text>
<line x1="480" y1="282" x2="540" y2="282" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="540" y="260" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="286.2" text-anchor="middle" font-size="12" fill="#3730A3">Output Pose</text>
<rect x="20" y="325" width="220" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="130" y="341" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Channels</text>
<text x="130" y="356" text-anchor="middle" font-size="10" fill="#374151">Trajectory, Pose, Velocity,</text>
<text x="130" y="368" text-anchor="middle" font-size="10" fill="#374151">Position, Heading, Phase,</text>
<text x="130" y="380" text-anchor="middle" font-size="10" fill="#374151">Group, Padding, Sampling Time</text>
<rect x="260" y="325" width="220" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="370" y="341" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Search Modes</text>
<text x="370" y="356" text-anchor="middle" font-size="10" fill="#374151">Brute Force: every pose</text>
<text x="370" y="368" text-anchor="middle" font-size="10" fill="#374151">PCAKDTree: PCA plus KD tree</text>
<text x="370" y="380" text-anchor="middle" font-size="10" fill="#374151">VPTree: experimental</text>
<rect x="500" y="325" width="220" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="610" y="341" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Costs and biases</text>
<text x="610" y="356" text-anchor="middle" font-size="10" fill="#374151">Continuing Pose Cost Bias</text>
<text x="610" y="368" text-anchor="middle" font-size="10" fill="#374151">Looping Cost Bias</text>
<text x="610" y="380" text-anchor="middle" font-size="10" fill="#374151">per-notify cost overrides</text>
</svg>
