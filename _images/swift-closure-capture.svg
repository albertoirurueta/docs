<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A closure created inside makeIncrementer keeps a live reference to runningTotal on the heap even after makeIncrementer's own stack frame has returned and is gone.</title>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Capturing a variable after its enclosing scope has returned</text>
  <text x="410" y="44" font-size="11" fill="#666666" text-anchor="middle">makeIncrementer(incrementAmount: 10) has already returned -- its stack frame is gone</text>

  <!-- Stack frame, ghosted / crossed out -->
  <g opacity="0.45">
    <rect x="40" y="80" width="230" height="120" rx="8" fill="#fdf3f3" stroke="#b5523d" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="155" y="102" font-size="12.5" font-weight="bold" fill="#7a2e22" text-anchor="middle">makeIncrementer's stack frame</text>
    <text x="155" y="124" font-size="11" fill="#7a2e22" text-anchor="middle">(deallocated when the</text>
    <text x="155" y="140" font-size="11" fill="#7a2e22" text-anchor="middle">function returned)</text>
    <line x1="55" y1="86" x2="255" y2="194" stroke="#b5523d" stroke-width="1.6"/>
    <line x1="255" y1="86" x2="55" y2="194" stroke="#b5523d" stroke-width="1.6"/>
  </g>

  <!-- Heap box holding runningTotal, still alive -->
  <rect x="330" y="90" width="180" height="90" rx="8" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="420" y="115" font-size="12.5" font-weight="bold" fill="#1d5236" text-anchor="middle">runningTotal</text>
  <text x="420" y="135" font-size="11" fill="#1d5236" text-anchor="middle">(and captured `amount`)</text>
  <text x="420" y="155" font-size="11" fill="#1d5236" text-anchor="middle">kept alive on the heap</text>
  <text x="420" y="172" font-size="10" fill="#3a7a58" text-anchor="middle">value: 20 after two calls</text>

  <!-- Closure box: incrementByTen -->
  <rect x="560" y="70" width="220" height="70" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="670" y="95" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">incrementByTen</text>
  <text x="670" y="114" font-size="11" fill="#1f3b5c" text-anchor="middle">the incrementer() closure value</text>

  <!-- Closure box: incrementBySeven, its own independent capture -->
  <rect x="560" y="230" width="220" height="70" rx="8" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.6"/>
  <text x="670" y="255" font-size="12.5" font-weight="bold" fill="#3c2a5c" text-anchor="middle">incrementBySeven</text>
  <text x="670" y="274" font-size="11" fill="#3c2a5c" text-anchor="middle">a separate closure, separate capture</text>

  <rect x="330" y="230" width="180" height="70" rx="8" fill="#f6f3fb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="420" y="255" font-size="11.5" fill="#3c2a5c" text-anchor="middle">its own runningTotal</text>
  <text x="420" y="272" font-size="10" fill="#5c4a78" text-anchor="middle">value: 7 after one call</text>

  <!-- Arrows: closure holds a reference to its own captured storage -->
  <g stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow2)">
    <line x1="560" y1="105" x2="510" y2="120"/>
    <line x1="560" y1="265" x2="510" y2="265"/>
  </g>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="410" y="335" font-size="11" fill="#666666" text-anchor="middle">Each call to makeIncrementer creates a new, independent captured runningTotal -- the closure is what keeps it alive</text>
</svg>
