<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Short-lived JWT access token plus rotating refresh token</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the access token is checked with a key and no database; the refresh token is checked against a stored hash</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b71c1c"/></marker>
  </defs>

  <!-- lanes -->
  <rect x="30" y="60" width="200" height="40" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="130" y="85" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Client (app or browser)</text>
  <rect x="370" y="60" width="200" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="470" y="85" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Vapor API</text>
  <rect x="710" y="60" width="200" height="40" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="810" y="85" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Database</text>
  <line x1="130" y1="100" x2="130" y2="585" stroke="#bbbbbb" stroke-dasharray="4 4"/>
  <line x1="470" y1="100" x2="470" y2="585" stroke="#bbbbbb" stroke-dasharray="4 4"/>
  <line x1="810" y1="100" x2="810" y2="585" stroke="#bbbbbb" stroke-dasharray="4 4"/>

  <!-- 1 login -->
  <text x="40" y="128" font-size="13" font-weight="bold" fill="#222222">1  Login</text>
  <line x1="130" y1="142" x2="468" y2="142" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="136" font-size="11" fill="#222222" text-anchor="middle">POST /auth/login  email + password</text>
  <rect x="490" y="148" width="200" height="40" rx="6" fill="#f3e9f7" stroke="#6a3d9a"/>
  <text x="590" y="164" font-size="11" fill="#222222" text-anchor="middle">Bcrypt.verify, then sign</text>
  <text x="590" y="180" font-size="11" fill="#222222" text-anchor="middle">access JWT (exp 15 min, kid)</text>
  <line x1="470" y1="214" x2="808" y2="214" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640" y="208" font-size="11" fill="#222222" text-anchor="middle">store SHA-256 hash of refresh token</text>
  <line x1="468" y1="240" x2="132" y2="240" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="234" font-size="11" fill="#222222" text-anchor="middle">access_token + refresh_token (plain, once)</text>

  <!-- 2 api call -->
  <text x="40" y="276" font-size="13" font-weight="bold" fill="#222222">2  API call</text>
  <line x1="130" y1="290" x2="468" y2="290" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="284" font-size="11" fill="#222222" text-anchor="middle">GET /me  Authorization: Bearer access</text>
  <rect x="490" y="298" width="250" height="46" rx="6" fill="#f3e9f7" stroke="#6a3d9a"/>
  <text x="615" y="316" font-size="11" fill="#222222" text-anchor="middle">signature, then exp, nbf, aud, iss</text>
  <text x="615" y="332" font-size="11" fill="#222222" text-anchor="middle">in verify(using:). No database read.</text>
  <line x1="468" y1="360" x2="132" y2="360" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="354" font-size="11" fill="#222222" text-anchor="middle">200, or 401 if anything failed</text>

  <!-- 3 refresh -->
  <text x="40" y="388" font-size="13" font-weight="bold" fill="#222222">3  Access token expired: refresh</text>
  <line x1="130" y1="414" x2="468" y2="414" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="408" font-size="11" fill="#222222" text-anchor="middle">POST /auth/refresh  refresh_token</text>
  <line x1="470" y1="436" x2="808" y2="436" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640" y="430" font-size="11" fill="#222222" text-anchor="middle">find by hash, mark revoked, insert new (one transaction)</text>
  <line x1="468" y1="462" x2="132" y2="462" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="456" font-size="11" fill="#222222" text-anchor="middle">new access_token + new refresh_token</text>

  <!-- 4 reuse -->
  <text x="40" y="490" font-size="13" font-weight="bold" fill="#b71c1c">4  The old refresh token is replayed (theft)</text>
  <line x1="130" y1="516" x2="468" y2="516" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="300" y="510" font-size="11" fill="#b71c1c" text-anchor="middle">POST /auth/refresh  old refresh_token</text>
  <line x1="470" y1="538" x2="808" y2="538" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="640" y="532" font-size="11" fill="#b71c1c" text-anchor="middle">already revoked: revoke every token of the user</text>
  <line x1="468" y1="564" x2="132" y2="564" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="300" y="558" font-size="11" fill="#b71c1c" text-anchor="middle">401, the user must log in again</text>
</svg>
