<svg viewBox="0 0 900 442" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="442" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Cloud Load Balancing family compared</text>
  <rect x="10" y="42" width="880" height="26" rx="4" fill="#123a72"/>
  <text x="20" y="60" font-size="12" font-weight="700" fill="#ffffff">Load balancer</text>
  <text x="255" y="60" font-size="12" font-weight="700" fill="#ffffff">Protocol and mode</text>
  <text x="440" y="60" font-size="12" font-weight="700" fill="#ffffff">Scope</text>
  <text x="620" y="60" font-size="12" font-weight="700" fill="#ffffff">Faces</text>
  <text x="690" y="60" font-size="12" font-weight="700" fill="#ffffff">Typical Bookshelf use</text>
  <rect x="10" y="72" width="880" height="40" rx="4" fill="#e8f0fe" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="96" font-size="11.5" font-weight="700" fill="#1a1a1a">Global external Application</text>
  <text x="255" y="96" font-size="11.5" fill="#1a1a1a">HTTP/HTTPS, L7 proxy</text>
  <text x="440" y="96" font-size="11.5" fill="#1a1a1a">Global (Premium tier)</text>
  <text x="620" y="96" font-size="11.5" fill="#1a1a1a">Internet</text>
  <text x="690" y="96" font-size="11.5" fill="#1a1a1a">Bookshelf front end and API</text>
  <rect x="10" y="116" width="880" height="40" rx="4" fill="#e8f0fe" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="140" font-size="11.5" font-weight="700" fill="#1a1a1a">Regional external Application</text>
  <text x="255" y="140" font-size="11.5" fill="#1a1a1a">HTTP/HTTPS, L7 proxy</text>
  <text x="440" y="140" font-size="11.5" fill="#1a1a1a">One region (either tier)</text>
  <text x="620" y="140" font-size="11.5" fill="#1a1a1a">Internet</text>
  <text x="690" y="140" font-size="11.5" fill="#1a1a1a">Data residency, Standard tier</text>
  <rect x="10" y="160" width="880" height="40" rx="4" fill="#f1f3f4" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="184" font-size="11.5" font-weight="700" fill="#1a1a1a">Classic Application</text>
  <text x="255" y="184" font-size="11.5" fill="#1a1a1a">HTTP/HTTPS, L7 proxy</text>
  <text x="440" y="184" font-size="11.5" fill="#1a1a1a">Global or regional</text>
  <text x="620" y="184" font-size="11.5" fill="#1a1a1a">Internet</text>
  <text x="690" y="184" font-size="11.5" fill="#1a1a1a">Legacy; migrate to global</text>
  <rect x="10" y="204" width="880" height="40" rx="4" fill="#e6f4ea" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="228" font-size="11.5" font-weight="700" fill="#1a1a1a">Regional internal Application</text>
  <text x="255" y="228" font-size="11.5" fill="#1a1a1a">HTTP/HTTPS, L7 proxy</text>
  <text x="440" y="228" font-size="11.5" fill="#1a1a1a">One region, in the VPC</text>
  <text x="620" y="228" font-size="11.5" fill="#1a1a1a">Internal</text>
  <text x="690" y="228" font-size="11.5" fill="#1a1a1a">orders-api to catalog-api</text>
  <rect x="10" y="248" width="880" height="40" rx="4" fill="#e6f4ea" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="272" font-size="11.5" font-weight="700" fill="#1a1a1a">Cross-region internal Application</text>
  <text x="255" y="272" font-size="11.5" fill="#1a1a1a">HTTP/HTTPS, L7 proxy</text>
  <text x="440" y="272" font-size="11.5" fill="#1a1a1a">Several regions, in the VPC</text>
  <text x="620" y="272" font-size="11.5" fill="#1a1a1a">Internal</text>
  <text x="690" y="272" font-size="11.5" fill="#1a1a1a">Multi-region internal services</text>
  <rect x="10" y="292" width="880" height="40" rx="4" fill="#fef7e0" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="316" font-size="11.5" font-weight="700" fill="#1a1a1a">External proxy Network</text>
  <text x="255" y="316" font-size="11.5" fill="#1a1a1a">TCP or SSL, L4 proxy</text>
  <text x="440" y="316" font-size="11.5" fill="#1a1a1a">Global or regional</text>
  <text x="620" y="316" font-size="11.5" fill="#1a1a1a">Internet</text>
  <text x="690" y="316" font-size="11.5" fill="#1a1a1a">Non-HTTP TCP, TLS offload</text>
  <rect x="10" y="336" width="880" height="40" rx="4" fill="#fef7e0" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="360" font-size="11.5" font-weight="700" fill="#1a1a1a">External passthrough Network</text>
  <text x="255" y="360" font-size="11.5" fill="#1a1a1a">TCP/UDP, L4 passthrough</text>
  <text x="440" y="360" font-size="11.5" fill="#1a1a1a">Regional; global in Preview</text>
  <text x="620" y="360" font-size="11.5" fill="#1a1a1a">Internet</text>
  <text x="690" y="360" font-size="11.5" fill="#1a1a1a">UDP, client IP preserved</text>
  <rect x="10" y="380" width="880" height="40" rx="4" fill="#fce8e6" stroke="#c4c7c5" stroke-width="1"/>
  <text x="20" y="404" font-size="11.5" font-weight="700" fill="#1a1a1a">Internal Network</text>
  <text x="255" y="404" font-size="11.5" fill="#1a1a1a">TCP/UDP, L4 (both modes)</text>
  <text x="440" y="404" font-size="11.5" fill="#1a1a1a">Regional or cross-region</text>
  <text x="620" y="404" font-size="11.5" fill="#1a1a1a">Internal</text>
  <text x="690" y="404" font-size="11.5" fill="#1a1a1a">Internal TCP and UDP services</text>
</svg>
