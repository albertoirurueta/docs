<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A clustered Jakarta Faces deployment and where the view state lives</title>
  <desc id="d">A browser talks to a reverse proxy that ends TLS, forwards the original scheme, forwards WebSocket upgrades, checks a readiness URL on each node and routes by a sticky session cookie. Behind it two application server nodes each run the same Faces application. The nodes replicate serialised HTTP sessions to each other when the application is marked distributable. A secret store gives both nodes the same client state keys, and a message bus carries events so that each node can push to its own WebSocket connections. Below, three cards show where the view state lives: with server state saving it is in the session on a node and needs sticky sessions or session replication, with client state saving it travels in the browser and any node can read it if all nodes share the same keys, although view scoped beans still live in the session, and with a stateless view nothing is stored.</desc>
  <defs>
    <marker id="ar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a4f8b"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4530a"/></marker>
    <marker id="ar-gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A clustered Faces deployment</text>
  <text x="500" y="48" font-size="12" fill="#666666" text-anchor="middle">Every node runs the same WAR. What must be shared between the nodes depends on where the view state lives.</text>

  <!-- Browser -->
  <rect x="20" y="150" width="140" height="150" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="90" y="172" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="90" y="194" font-size="10" fill="#444444" text-anchor="middle">cookie JSESSIONID</text>
  <text x="90" y="210" font-size="10" fill="#444444" text-anchor="middle">hidden field</text>
  <text x="90" y="224" font-size="10" fill="#444444" text-anchor="middle">jakarta.faces.ViewState</text>
  <text x="90" y="246" font-size="10" fill="#444444" text-anchor="middle">faces.js Ajax requests</text>
  <text x="90" y="262" font-size="10" fill="#444444" text-anchor="middle">WebSocket for</text>
  <text x="90" y="276" font-size="10" fill="#444444" text-anchor="middle">f:websocket</text>

  <!-- Proxy -->
  <rect x="215" y="110" width="190" height="230" rx="6" fill="#fff4e5" stroke="#b4530a" stroke-width="1.4"/>
  <text x="310" y="132" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Reverse proxy</text>
  <text x="310" y="147" font-size="10" fill="#555555" text-anchor="middle">load balancer</text>
  <text x="228" y="174" font-size="10" fill="#333333">- ends TLS</text>
  <text x="228" y="192" font-size="10" fill="#333333">- sends X-Forwarded-Proto</text>
  <text x="228" y="210" font-size="10" fill="#333333">- routes by sticky cookie</text>
  <text x="228" y="228" font-size="10" fill="#333333">- passes WebSocket upgrades</text>
  <text x="228" y="246" font-size="10" fill="#333333">- keeps idle sockets open</text>
  <text x="228" y="264" font-size="10" fill="#333333">- probes /health/ready</text>
  <text x="228" y="282" font-size="10" fill="#333333">- never caches Faces pages</text>
  <text x="228" y="300" font-size="10" fill="#333333">- may cache /jakarta.faces.</text>
  <text x="240" y="314" font-size="10" fill="#333333">resource/ files</text>

  <line x1="162" y1="225" x2="213" y2="225" stroke="#1a4f8b" stroke-width="1.6" marker-end="url(#ar-b)"/>
  <text x="188" y="217" font-size="10" fill="#1a4f8b" text-anchor="middle">HTTPS</text>

  <!-- Node A -->
  <rect x="470" y="80" width="250" height="150" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="595" y="102" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Node A</text>
  <rect x="484" y="112" width="222" height="24" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="595" y="128" font-size="10" fill="#333333" text-anchor="middle">FacesServlet + Weld + Faces application</text>
  <rect x="484" y="142" width="222" height="36" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="595" y="157" font-size="10" fill="#333333" text-anchor="middle">HTTP session: server-state views,</text>
  <text x="595" y="171" font-size="10" fill="#333333" text-anchor="middle">@SessionScoped and @ViewScoped beans</text>
  <rect x="484" y="184" width="222" height="32" rx="3" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="595" y="198" font-size="10" fill="#555555" text-anchor="middle">PushContext: sockets of this node only</text>
  <text x="595" y="210" font-size="10" fill="#555555" text-anchor="middle">(in the memory of this JVM)</text>

  <!-- Node B -->
  <rect x="470" y="290" width="250" height="150" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="595" y="312" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Node B</text>
  <rect x="484" y="322" width="222" height="24" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="595" y="338" font-size="10" fill="#333333" text-anchor="middle">FacesServlet + Weld + Faces application</text>
  <rect x="484" y="352" width="222" height="36" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="595" y="367" font-size="10" fill="#333333" text-anchor="middle">HTTP session: server-state views,</text>
  <text x="595" y="381" font-size="10" fill="#333333" text-anchor="middle">@SessionScoped and @ViewScoped beans</text>
  <rect x="484" y="394" width="222" height="32" rx="3" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="595" y="408" font-size="10" fill="#555555" text-anchor="middle">PushContext: sockets of this node only</text>
  <text x="595" y="420" font-size="10" fill="#555555" text-anchor="middle">(in the memory of this JVM)</text>

  <!-- proxy to nodes -->
  <line x1="407" y1="190" x2="468" y2="150" stroke="#1a4f8b" stroke-width="2.4" marker-end="url(#ar-b)"/>
  <text x="438" y="156" font-size="10" fill="#1a4f8b" text-anchor="middle" font-weight="bold">sticky</text>
  <line x1="407" y1="262" x2="468" y2="352" stroke="#1a4f8b" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar-b)"/>
  <text x="464" y="376" font-size="10" fill="#1a4f8b" text-anchor="end">other</text>
  <text x="464" y="388" font-size="10" fill="#1a4f8b" text-anchor="end">sessions</text>

  <!-- replication -->
  <line x1="595" y1="232" x2="595" y2="288" stroke="#2e7d32" stroke-width="1.8" marker-start="url(#ar-gs)" marker-end="url(#ar-g)"/>
  <text x="603" y="256" font-size="10" fill="#2e7d32">session replication</text>
  <text x="603" y="270" font-size="10" fill="#2e7d32">(distributable, Serializable)</text>

  <!-- Secret store -->
  <rect x="790" y="70" width="190" height="86" rx="6" fill="#fbf8f2" stroke="#b4530a" stroke-width="1.4"/>
  <text x="885" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Secret store</text>
  <text x="885" y="110" font-size="10" fill="#444444" text-anchor="middle">environment variables</text>
  <text x="885" y="124" font-size="10" fill="#444444" text-anchor="middle">same client state keys</text>
  <text x="885" y="138" font-size="10" fill="#444444" text-anchor="middle">on every node</text>
  <line x1="788" y1="113" x2="722" y2="113" stroke="#b4530a" stroke-width="1.4" marker-end="url(#ar-o)"/>
  <path d="M885,158 L885,230 L760,230 L760,365 L722,365" fill="none" stroke="#b4530a" stroke-width="1.4" marker-end="url(#ar-o)"/>

  <!-- Message bus -->
  <rect x="790" y="270" width="190" height="86" rx="6" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1.4"/>
  <text x="885" y="292" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Message bus</text>
  <text x="885" y="310" font-size="10" fill="#444444" text-anchor="middle">broadcasts an event to all</text>
  <text x="885" y="324" font-size="10" fill="#444444" text-anchor="middle">nodes; each calls send on</text>
  <text x="885" y="338" font-size="10" fill="#444444" text-anchor="middle">its own PushContext</text>
  <path d="M788,330 L750,330 L750,215 L722,215" fill="none" stroke="#6a3fa0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-k)"/>
  <path d="M750,330 L750,405 L722,405" fill="none" stroke="#6a3fa0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-k)"/>

  <!-- ===== where view state lives ===== -->
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Where the view state lives, and what the cluster must then provide</text>

  <rect x="20" y="488" width="310" height="132" rx="6" fill="#f7f9fc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="175" y="508" font-size="12" font-weight="bold" fill="#1a4f8b" text-anchor="middle">Server state saving (default)</text>
  <text x="34" y="530" font-size="10" fill="#333333">State: in the HTTP session of one node.</text>
  <text x="34" y="548" font-size="10" fill="#333333">Browser holds only a short token.</text>
  <text x="34" y="570" font-size="10" fill="#333333" font-weight="bold">Needs one of:</text>
  <text x="34" y="586" font-size="10" fill="#333333">- sticky sessions (the postback returns to A)</text>
  <text x="34" y="602" font-size="10" fill="#333333">- session replication (every node has it)</text>
  <text x="34" y="614" font-size="10" fill="#555555">and Serializable components and beans</text>

  <rect x="345" y="488" width="310" height="132" rx="6" fill="#fbf8f2" stroke="#b4530a" stroke-width="1.4"/>
  <text x="500" y="508" font-size="12" font-weight="bold" fill="#b4530a" text-anchor="middle">Client state saving</text>
  <text x="359" y="530" font-size="10" fill="#333333">State: in the browser, encrypted and signed.</text>
  <text x="359" y="548" font-size="10" fill="#333333">Any node can restore any page.</text>
  <text x="359" y="570" font-size="10" fill="#333333" font-weight="bold">Needs:</text>
  <text x="359" y="586" font-size="10" fill="#333333">- the same keys on every node and restart</text>
  <text x="359" y="602" font-size="10" fill="#333333">- Serializable components, larger responses</text>
  <text x="359" y="614" font-size="10" fill="#555555">- but @ViewScoped beans stay in the session</text>

  <rect x="670" y="488" width="310" height="132" rx="6" fill="#f2f7f2" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="825" y="508" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">Stateless view</text>
  <text x="684" y="530" font-size="10" fill="#333333">State: nowhere, the tree is rebuilt.</text>
  <text x="684" y="548" font-size="10" fill="#333333">The field holds the word stateless.</text>
  <text x="684" y="570" font-size="10" fill="#333333" font-weight="bold">Needs:</text>
  <text x="684" y="586" font-size="10" fill="#333333">- request scoped beans only</text>
  <text x="684" y="602" font-size="10" fill="#333333">- nothing shared between the nodes</text>
  <text x="684" y="614" font-size="10" fill="#555555">for the view; sessions only if used</text>

  <rect x="20" y="632" width="960" height="36" rx="4" fill="#fdecea" stroke="#a12622"/>
  <text x="500" y="648" font-size="11" fill="#a12622" text-anchor="middle" font-weight="bold">ViewExpiredException on the node that cannot restore the view:</text>
  <text x="500" y="662" font-size="11" fill="#a12622" text-anchor="middle">no sticky routing and no replicated session (server state), or keys that differ between nodes (client state)</text>
</svg>
