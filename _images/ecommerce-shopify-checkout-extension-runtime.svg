<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How a checkout UI extension runs</title>
<desc id="d">The buyer browser contains the Shopify-hosted checkout page and, next to it, a sandboxed Web Worker that runs the extension bundle. The bundle reads checkout data from the shopify global and sends a UI tree to the host, which renders Polaris web components. Shopify hosts the bundle on its CDN. With network_access the worker can call the app backend with a session token, and with api_access it can query the Storefront API.</desc>
<rect x="0" y="0" width="900" height="520" rx="14" fill="#2b3a4a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker></defs>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#f2f5f8">Runtime of a checkout UI extension</text>
<rect x="20" y="44" width="560" height="330" rx="10" fill="none" stroke="#f2f5f8" stroke-opacity="0.7" stroke-dasharray="3 5"/>
<text x="32" y="64" font-size="12" font-weight="bold" fill="#f2f5f8">Buyer browser</text>
<rect x="40" y="80" width="215" height="150" rx="8" fill="#4a5a6b" stroke="#f2f5f8"/>
<text x="52" y="100" font-size="13" font-weight="bold" fill="#f2f5f8">Checkout page (host)</text>
<text x="52" y="120" font-size="12" fill="#f2f5f8">Shopify-owned page</text>
<text x="52" y="136" font-size="12" fill="#f2f5f8">Renders core checkout</text>
<text x="52" y="152" font-size="12" fill="#f2f5f8">Mounts Polaris web</text>
<text x="52" y="168" font-size="12" fill="#f2f5f8">components for the UI tree</text>
<text x="52" y="184" font-size="12" fill="#f2f5f8">Extensions cannot read it</text>
<rect x="335" y="80" width="235" height="150" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
<text x="347" y="100" font-size="13" font-weight="bold" fill="#f2f5f8">Web Worker sandbox</text>
<text x="347" y="120" font-size="12" fill="#f2f5f8">One worker per extension</text>
<text x="347" y="136" font-size="12" fill="#f2f5f8">Bundle: Preact, plain JS</text>
<text x="347" y="152" font-size="12" fill="#f2f5f8">No window, no DOM</text>
<text x="347" y="168" font-size="12" fill="#f2f5f8">Global object: shopify</text>
<text x="347" y="184" font-size="12" fill="#f2f5f8">Reads signals: .value</text>
<path d="M335 120 L257 120" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="296" y="112" font-size="11" fill="#f2f5f8" text-anchor="middle">UI tree</text>
<path d="M257 165 L335 165" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="296" y="181" font-size="11" fill="#f2f5f8" text-anchor="middle">events</text>
<rect x="40" y="250" width="530" height="112" rx="8" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="52" y="270" font-size="13" font-weight="bold" fill="#f2f5f8">Extension bundle contents</text>
<text x="52" y="290" font-size="12" fill="#f2f5f8">shopify.extension.toml: targets, capabilities, settings, metafields</text>
<text x="52" y="306" font-size="12" fill="#f2f5f8">src/*.tsx: one default export per target; locales/*.json</text>
<text x="52" y="322" font-size="12" fill="#f2f5f8">shopify app deploy builds the bundle, which may not exceed 64 KB</text>
<text x="52" y="338" font-size="12" fill="#f2f5f8">(128 KB for full-page customer account extensions)</text>
<rect x="650" y="80" width="230" height="110" rx="8" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="662" y="100" font-size="13" font-weight="bold" fill="#f2f5f8">Shopify platform</text>
<text x="662" y="120" font-size="12" fill="#f2f5f8">Checkout host and editor</text>
<text x="662" y="136" font-size="12" fill="#f2f5f8">Storefront API (api_access)</text>
<text x="662" y="152" font-size="12" fill="#f2f5f8">Cart attributes, metafields</text>
<text x="662" y="168" font-size="12" fill="#f2f5f8">Bundle served from the CDN</text>
<rect x="650" y="235" width="230" height="127" rx="8" fill="#a9772e" stroke="#f2f5f8"/>
<text x="662" y="255" font-size="13" font-weight="bold" fill="#f2f5f8">Your app backend</text>
<text x="662" y="275" font-size="12" fill="#f2f5f8">Only with network_access</text>
<text x="662" y="291" font-size="12" fill="#f2f5f8">Verifies the session token</text>
<text x="662" y="307" font-size="12" fill="#f2f5f8">(HS256, 5 minute lifetime)</text>
<text x="662" y="323" font-size="12" fill="#f2f5f8">CORS: allow origin *</text>
<path d="M572 130 L650 130" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="611" y="122" font-size="11" fill="#f2f5f8" text-anchor="middle">shopify.*</text>
<path d="M572 300 L650 300" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="611" y="292" font-size="11" fill="#f2f5f8" text-anchor="middle">fetch</text>
<text x="20" y="402" font-size="13" font-weight="bold" fill="#f2f5f8">What the sandbox implies</text>
<text x="30" y="424" font-size="12" fill="#f2f5f8">Extensions run isolated from the checkout page and from each other, with no access to payment fields, HTML or other assets.</text>
<text x="30" y="444" font-size="12" fill="#f2f5f8">State changes go through shopify.apply* methods, which return a promise and are rate limited when they are excessive.</text>
<text x="30" y="464" font-size="12" fill="#f2f5f8">Merchants can add up to three extensions to the same block target location.</text>
<text x="30" y="484" font-size="12" fill="#f2f5f8">Anything the extension needs from your own servers must pass through network_access and a CORS-enabled endpoint.</text>
</svg>
