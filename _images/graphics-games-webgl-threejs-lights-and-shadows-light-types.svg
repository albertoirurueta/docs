<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-lights-and-shadows-light-types" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The light classes at a glance</text>
<rect x="20" y="60" width="112" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="76.0" y="104.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no direction</text>
<text x="76.0" y="119.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no shadows</text>
<text x="76.0" y="134.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">flat fill</text>
<text x="76" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">AmbientLight</text>
<rect x="140" y="60" width="112" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="196.0" y="104.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sky + ground</text>
<text x="196.0" y="119.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no shadows</text>
<text x="196.0" y="134.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">soft fill</text>
<text x="196" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">HemisphereLight</text>
<rect x="260" y="60" width="112" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="316.0" y="104.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">parallel rays</text>
<text x="316.0" y="119.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">ortho shadow cam</text>
<text x="316.0" y="134.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">sun</text>
<text x="316" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">DirectionalLight</text>
<rect x="380" y="60" width="112" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="436.0" y="104.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">all directions</text>
<text x="436.0" y="119.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">6 faces cube map</text>
<text x="436.0" y="134.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bulb</text>
<text x="436" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">PointLight</text>
<rect x="500" y="60" width="112" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="556.0" y="104.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">cone angle</text>
<text x="556.0" y="119.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">penumbra</text>
<text x="556.0" y="134.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">persp. shadow cam</text>
<text x="556" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">SpotLight</text>
<rect x="620" y="60" width="112" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="676.0" y="104.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">rectangle</text>
<text x="676.0" y="119.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">no shadows</text>
<text x="676.0" y="134.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">needs uniforms lib</text>
<text x="676" y="52" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">RectAreaLight</text>
<text x="380" y="200" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Shadow-capable: Directional, Point, Spot (castShadow = true)</text>
<rect x="20" y="220" width="350" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="242" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Intensity units (physical, default)</text>
<text x="195" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">PointLight, SpotLight: candela (cd)</text>
<text x="195" y="288" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">DirectionalLight: lux (lx)</text>
<text x="195" y="308" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Ambient, Hemisphere: lux-like irradiance</text>
<text x="195" y="328" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">RectAreaLight: nits (cd/m2)</text>
<text x="195" y="348" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">power property: lumens for point and spot</text>
<text x="195" y="368" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">decay = 2 : inverse-square falloff</text>
<rect x="390" y="220" width="350" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="242" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Cost per shadow-casting light</text>
<text x="565" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Directional: 1 shadow render</text>
<text x="565" y="288" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Spot: 1 shadow render</text>
<text x="565" y="308" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Point: 6 shadow renders (cube)</text>
<text x="565" y="328" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Each extra light adds shader work</text>
<text x="565" y="348" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">per fragment, shadowed or not</text>
<text x="565" y="368" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Prefer 1 directional + fill lights</text>
<text x="380" y="415" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Values follow the three.js manual and API docs for r187.</text>
</svg>
