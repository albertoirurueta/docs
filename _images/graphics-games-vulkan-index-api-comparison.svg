<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="370" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Vulkan next to OpenGL, Metal and WebGPU</text>
<rect x="24" y="48" width="736" height="28" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="207.0" y="67" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">OpenGL</text>
<rect x="286" y="48" width="158" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="365.0" y="67" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Vulkan</text>
<text x="523.0" y="67" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Metal</text>
<text x="681.0" y="67" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">WebGPU</text>
<rect x="24" y="82" width="736" height="50" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="112" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Pipeline state</text>
<text x="207.0" y="105" font-size="11" fill="#374151" text-anchor="middle">global state machine,</text>
<text x="207.0" y="119" font-size="11" fill="#374151" text-anchor="middle">changed call by call</text>
<rect x="288" y="84" width="154" height="46" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="365.0" y="105" font-size="11" fill="#374151" text-anchor="middle">immutable pipeline</text>
<text x="365.0" y="119" font-size="11" fill="#374151" text-anchor="middle">objects, some dynamic</text>
<text x="523.0" y="105" font-size="11" fill="#374151" text-anchor="middle">pipeline state</text>
<text x="523.0" y="119" font-size="11" fill="#374151" text-anchor="middle">objects</text>
<text x="681.0" y="105" font-size="11" fill="#374151" text-anchor="middle">pipeline objects</text>
<text x="681.0" y="119" font-size="11" fill="#374151" text-anchor="middle">(render and compute)</text>
<rect x="24" y="138" width="736" height="50" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="168" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Synchronisation</text>
<text x="207.0" y="161" font-size="11" fill="#374151" text-anchor="middle">implicit, done by</text>
<text x="207.0" y="175" font-size="11" fill="#374151" text-anchor="middle">the driver</text>
<rect x="288" y="140" width="154" height="46" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="365.0" y="161" font-size="11" fill="#374151" text-anchor="middle">explicit barriers,</text>
<text x="365.0" y="175" font-size="11" fill="#374151" text-anchor="middle">semaphores and fences</text>
<text x="523.0" y="161" font-size="11" fill="#374151" text-anchor="middle">explicit barriers in</text>
<text x="523.0" y="175" font-size="11" fill="#374151" text-anchor="middle">Metal 4, hazards in 3</text>
<text x="681.0" y="161" font-size="11" fill="#374151" text-anchor="middle">implicit, done by</text>
<text x="681.0" y="175" font-size="11" fill="#374151" text-anchor="middle">the browser</text>
<rect x="24" y="194" width="736" height="50" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="224" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Memory</text>
<text x="207.0" y="217" font-size="11" fill="#374151" text-anchor="middle">driver-managed</text>
<text x="207.0" y="231" font-size="11" fill="#374151" text-anchor="middle">buffers and textures</text>
<rect x="288" y="196" width="154" height="46" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="365.0" y="217" font-size="11" fill="#374151" text-anchor="middle">you allocate and bind</text>
<text x="365.0" y="231" font-size="11" fill="#374151" text-anchor="middle">(VMA helps)</text>
<text x="523.0" y="217" font-size="11" fill="#374151" text-anchor="middle">you pick storage</text>
<text x="523.0" y="231" font-size="11" fill="#374151" text-anchor="middle">modes and heaps</text>
<text x="681.0" y="217" font-size="11" fill="#374151" text-anchor="middle">browser-managed</text>
<text x="681.0" y="231" font-size="11" fill="#374151" text-anchor="middle">with usage flags</text>
<rect x="24" y="250" width="736" height="50" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="280" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Shaders</text>
<text x="207.0" y="279" font-size="11" fill="#374151" text-anchor="middle">GLSL</text>
<rect x="288" y="252" width="154" height="46" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="365.0" y="273" font-size="11" fill="#374151" text-anchor="middle">SPIR-V, built from</text>
<text x="365.0" y="287" font-size="11" fill="#374151" text-anchor="middle">GLSL, HLSL or Slang</text>
<text x="523.0" y="279" font-size="11" fill="#374151" text-anchor="middle">MSL</text>
<text x="681.0" y="279" font-size="11" fill="#374151" text-anchor="middle">WGSL</text>
<rect x="24" y="306" width="736" height="50" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="336" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Platforms</text>
<text x="207.0" y="329" font-size="11" fill="#374151" text-anchor="middle">desktop and ES on</text>
<text x="207.0" y="343" font-size="11" fill="#374151" text-anchor="middle">phones, not Apple</text>
<rect x="288" y="308" width="154" height="46" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="365.0" y="329" font-size="11" fill="#374151" text-anchor="middle">Windows, Linux,</text>
<text x="365.0" y="343" font-size="11" fill="#374151" text-anchor="middle">Android, Apple via layers</text>
<text x="523.0" y="329" font-size="11" fill="#374151" text-anchor="middle">Apple platforms</text>
<text x="523.0" y="343" font-size="11" fill="#374151" text-anchor="middle">only</text>
<text x="681.0" y="329" font-size="11" fill="#374151" text-anchor="middle">browsers, over Vulkan,</text>
<text x="681.0" y="343" font-size="11" fill="#374151" text-anchor="middle">Metal or Direct3D 12</text>
</svg>
