<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vdu-cost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which mode catches what, and what it costs</text>
<rect x="30" y="50" width="700" height="28" rx="6" fill="#4F46E5"/>
<text x="40" y="69" font-size="12" font-weight="bold" fill="#FFFFFF">Mode</text>
<text x="210" y="69" font-size="12" font-weight="bold" fill="#FFFFFF">Finds</text>
<text x="510" y="69" font-size="12" font-weight="bold" fill="#FFFFFF">Typical cost</text>
<rect x="30" y="78" width="700" height="44" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="40" y="105" text-anchor="start" font-size="12" fill="#374151">Core</text>
<text x="210" y="105" text-anchor="start" font-size="12" fill="#374151">invalid usage, wrong layouts, lifetimes</text>
<text x="510" y="105" text-anchor="start" font-size="12" fill="#374151">moderate CPU</text>
<rect x="30" y="122" width="700" height="44" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="149" text-anchor="start" font-size="12" fill="#374151">Synchronization</text>
<text x="210" y="149" text-anchor="start" font-size="12" fill="#374151">missing or too-weak barriers</text>
<text x="510" y="149" text-anchor="start" font-size="12" fill="#374151">extra CPU, memory</text>
<rect x="30" y="166" width="700" height="44" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="40" y="193" text-anchor="start" font-size="12" fill="#374151">GPU-AV</text>
<text x="210" y="193" text-anchor="start" font-size="12" fill="#374151">out-of-bounds, bad descriptors</text>
<text x="510" y="193" text-anchor="start" font-size="12" fill="#374151">heavy, slows frames</text>
<rect x="30" y="210" width="700" height="44" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="237" text-anchor="start" font-size="12" fill="#374151">Debug Printf</text>
<text x="210" y="237" text-anchor="start" font-size="12" fill="#374151">values inside a shader</text>
<text x="510" y="237" text-anchor="start" font-size="12" fill="#374151">small, per command buffer</text>
<rect x="30" y="254" width="700" height="44" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="40" y="281" text-anchor="start" font-size="12" fill="#374151">Best practices</text>
<text x="210" y="281" text-anchor="start" font-size="12" fill="#374151">slow but legal patterns</text>
<text x="510" y="281" text-anchor="start" font-size="12" fill="#374151">low to moderate</text>
<text x="380" y="330" text-anchor="middle" font-size="12" fill="#374151">GPU-AV and the core checks should not run together: use separate passes</text>
</svg>
