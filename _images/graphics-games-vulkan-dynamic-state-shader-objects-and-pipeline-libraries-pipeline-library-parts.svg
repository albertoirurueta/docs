<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ds-lib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Four library parts linked into one pipeline</text>
<rect x="20" y="60" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="97.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Vertex input interface</text>
<text x="105.0" y="112.5" text-anchor="middle" font-size="11" fill="#3730A3">vertex input and input</text>
<text x="105.0" y="127.5" text-anchor="middle" font-size="11" fill="#3730A3">assembly state</text>
<line x1="105" y1="160" x2="380" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-lib)"/>
<rect x="202" y="60" width="170" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="287.0" y="90.0" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Pre-rasterization shaders</text>
<text x="287.0" y="105.0" text-anchor="middle" font-size="11" fill="#92400E">vertex or mesh stages,</text>
<text x="287.0" y="120.0" text-anchor="middle" font-size="11" fill="#92400E">viewport, rasterization,</text>
<text x="287.0" y="135.0" text-anchor="middle" font-size="11" fill="#92400E">layout</text>
<line x1="287" y1="160" x2="380" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-lib)"/>
<rect x="384" y="60" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="469.0" y="97.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Fragment shader</text>
<text x="469.0" y="112.5" text-anchor="middle" font-size="11" fill="#3730A3">fragment stage, depth and</text>
<text x="469.0" y="127.5" text-anchor="middle" font-size="11" fill="#3730A3">stencil, layout</text>
<line x1="469" y1="160" x2="380" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-lib)"/>
<rect x="566" y="60" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="651.0" y="97.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Fragment output interface</text>
<text x="651.0" y="112.5" text-anchor="middle" font-size="11" fill="#3730A3">blend, multisample,</text>
<text x="651.0" y="127.5" text-anchor="middle" font-size="11" fill="#3730A3">attachment formats</text>
<line x1="651" y1="160" x2="380" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-lib)"/>
<rect x="230" y="215" width="300" height="55" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="229.5" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Link step</text>
<text x="380.0" y="245.5" text-anchor="middle" font-size="12" fill="#065F46">VkPipelineLibraryCreateInfoKHR lists the</text>
<text x="380.0" y="261.5" text-anchor="middle" font-size="12" fill="#065F46">libraries</text>
<line x1="380" y1="270" x2="380" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-lib)"/>
<rect x="230" y="300" width="300" height="45" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="317.5" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">VkPipeline</text>
<text x="380.0" y="333.5" text-anchor="middle" font-size="12" fill="#374151">executable pipeline, ready to bind</text>
<rect x="20" y="300" width="190" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="115.0" y="322.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Flags</text>
<text x="115.0" y="337.5" text-anchor="middle" font-size="11" fill="#374151">Libraries have LIBRARY_BIT</text>
<text x="115.0" y="352.5" text-anchor="middle" font-size="11" fill="#374151">set; fast link without it,</text>
<text x="115.0" y="367.5" text-anchor="middle" font-size="11" fill="#374151">optimized with the link-time</text>
<text x="115.0" y="382.5" text-anchor="middle" font-size="11" fill="#374151">bit</text>
<rect x="550" y="300" width="190" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="330.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Reuse</text>
<text x="645.0" y="345.0" text-anchor="middle" font-size="11" fill="#374151">Fragment output and vertex</text>
<text x="645.0" y="360.0" text-anchor="middle" font-size="11" fill="#374151">input libraries are reusable</text>
<text x="645.0" y="375.0" text-anchor="middle" font-size="11" fill="#374151">across many materials</text>
</svg>
