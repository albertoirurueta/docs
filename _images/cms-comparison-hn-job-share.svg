<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" role="img" aria-labelledby="hn-job-share-t hn-job-share-d">
<title id="hn-job-share-t">Hacker News job mentions per year</title>
<desc id="hn-job-share-d">Share of the postings in the monthly &quot;Who is hiring?&quot; threads on Hacker News that mention each CMS, per year 2018 to 2025, for the CMSs with at least one mention (WordPress, Webflow, Drupal, Contentful, Squarespace, Strapi, Craft CMS, Wix). It is a demand proxy biased to startups; the highest yearly share is 0.5% of postings. Colours are assigned by position in this figure.</desc>
