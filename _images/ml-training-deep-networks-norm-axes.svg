<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img">
<title>Batch normalization versus layer normalization axes</title>
<desc>Two grids of samples by features. Batch normalization computes statistics down each feature column across the batch. Layer normalization computes statistics along each sample row across features.</desc>
