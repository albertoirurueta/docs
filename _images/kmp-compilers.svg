<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How Kotlin Multiplatform compiles common code per target</title>
  <desc>commonMain and platform source sets go through the K2 frontend into IR, then through four backends: JVM bytecode to JAR or AAR, Native LLVM to framework, XCFramework or executables, JS IR to .js, and Wasm to .wasm.</desc>
  <defs>
    <marker id="arrKc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">From commonMain to per-target artifacts</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">one frontend, one IR, four backends; common code is compiled once for every declared target</text>

  <!-- Sources -->
  <rect x="20" y="70" width="170" height="380" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="105" y="92" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Source sets</text>
  <rect x="35" y="110" width="140" height="50" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="105" y="131" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">commonMain</text>
  <text x="105" y="148" font-size="9.5" fill="#444444" text-anchor="middle">shared Kotlin, expect</text>
  <rect x="35" y="180" width="140" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="105" y="205" font-size="10.5" fill="#333333" text-anchor="middle">androidMain / jvmMain</text>
  <rect x="35" y="235" width="140" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="105" y="260" font-size="10.5" fill="#333333" text-anchor="middle">iosMain / nativeMain</text>
  <rect x="35" y="290" width="140" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="105" y="315" font-size="10.5" fill="#333333" text-anchor="middle">jsMain</text>
  <rect x="35" y="345" width="140" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="105" y="370" font-size="10.5" fill="#333333" text-anchor="middle">wasmJsMain</text>
  <text x="105" y="425" font-size="9.5" fill="#666666" text-anchor="middle">actual declarations live in</text>
  <text x="105" y="438" font-size="9.5" fill="#666666" text-anchor="middle">platform source sets</text>

  <!-- Frontend -->
  <rect x="220" y="170" width="130" height="110" rx="8" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.4"/>
  <text x="285" y="195" font-size="12" font-weight="bold" fill="#8a5a14" text-anchor="middle">K2 frontend</text>
  <text x="285" y="215" font-size="9.5" fill="#444444" text-anchor="middle">parse, resolve,</text>
  <text x="285" y="228" font-size="9.5" fill="#444444" text-anchor="middle">type-check, FIR</text>
  <text x="285" y="248" font-size="9.5" fill="#444444" text-anchor="middle">then Kotlin IR</text>
  <text x="285" y="262" font-size="9.5" fill="#444444" text-anchor="middle">(per compilation)</text>

  <line x1="175" y1="135" x2="218" y2="215" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="175" y1="200" x2="218" y2="222" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="175" y1="255" x2="218" y2="235" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="175" y1="310" x2="218" y2="245" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="175" y1="365" x2="218" y2="258" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>

  <!-- Backends -->
  <text x="445" y="72" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Backends</text>
  <rect x="380" y="85" width="130" height="62" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="445" y="108" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kotlin/JVM</text>
  <text x="445" y="125" font-size="9.5" fill="#444444" text-anchor="middle">JVM bytecode</text>
  <text x="445" y="138" font-size="9.5" fill="#444444" text-anchor="middle">(Android: then D8/R8)</text>
  <rect x="380" y="165" width="130" height="62" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="445" y="188" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kotlin/Native</text>
  <text x="445" y="205" font-size="9.5" fill="#444444" text-anchor="middle">.klib, then LLVM</text>
  <text x="445" y="218" font-size="9.5" fill="#444444" text-anchor="middle">machine code</text>
  <rect x="380" y="245" width="130" height="62" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="445" y="268" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kotlin/JS</text>
  <text x="445" y="285" font-size="9.5" fill="#444444" text-anchor="middle">JS IR backend</text>
  <text x="445" y="298" font-size="9.5" fill="#444444" text-anchor="middle">ES2015+ modules</text>
  <rect x="380" y="325" width="130" height="62" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="445" y="348" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kotlin/Wasm</text>
  <text x="445" y="365" font-size="9.5" fill="#444444" text-anchor="middle">Wasm IR backend</text>
  <text x="445" y="378" font-size="9.5" fill="#444444" text-anchor="middle">WasmGC (Beta)</text>

  <line x1="350" y1="205" x2="378" y2="118" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="350" y1="220" x2="378" y2="196" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="350" y1="235" x2="378" y2="276" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="350" y1="250" x2="378" y2="356" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>

  <!-- Artifacts -->
  <text x="625" y="72" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Artifacts</text>
  <rect x="545" y="85" width="195" height="62" rx="6" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.3"/>
  <text x="642" y="108" font-size="11.5" font-weight="bold" fill="#2e6b2e" text-anchor="middle">.jar / .aar</text>
  <text x="642" y="125" font-size="9.5" fill="#444444" text-anchor="middle">Android app, desktop, server;</text>
  <text x="642" y="138" font-size="9.5" fill="#444444" text-anchor="middle">APK/AAB after DEX</text>
  <rect x="545" y="165" width="195" height="62" rx="6" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.3"/>
  <text x="642" y="188" font-size="11.5" font-weight="bold" fill="#2e6b2e" text-anchor="middle">.framework / XCFramework</text>
  <text x="642" y="205" font-size="9.5" fill="#444444" text-anchor="middle">+ .kexe executables, .a/.so libs</text>
  <text x="642" y="218" font-size="9.5" fill="#444444" text-anchor="middle">Apple binaries need macOS</text>
  <rect x="545" y="245" width="195" height="62" rx="6" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.3"/>
  <text x="642" y="268" font-size="11.5" font-weight="bold" fill="#2e6b2e" text-anchor="middle">.js (+ .d.ts, npm package)</text>
  <text x="642" y="285" font-size="9.5" fill="#444444" text-anchor="middle">browser bundle or Node.js</text>
  <rect x="545" y="325" width="195" height="62" rx="6" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.3"/>
  <text x="642" y="348" font-size="11.5" font-weight="bold" fill="#2e6b2e" text-anchor="middle">.wasm + .mjs loader</text>
  <text x="642" y="365" font-size="9.5" fill="#444444" text-anchor="middle">browser with WasmGC support</text>

  <line x1="510" y1="116" x2="543" y2="116" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="510" y1="196" x2="543" y2="196" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="510" y1="276" x2="543" y2="276" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>
  <line x1="510" y1="356" x2="543" y2="356" stroke="#444444" stroke-width="1.3" marker-end="url(#arrKc)"/>

  <text x="380" y="480" font-size="10.5" fill="#666666" text-anchor="middle">Libraries between modules travel as .klib (Native, JS, Wasm) or as JARs (JVM/Android); the compiler runs once per target.</text>
</svg>
