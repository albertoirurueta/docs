<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Kubernetes objects of the pocketcoffee release</title>
  <desc id="d">Requests arrive at the load balancer with the WAF web ACL, pass through the Gateway and the HTTPRoute to the Service pocketcoffee-web and to the pods of the Deployment pocketcoffee-web. Each pod has a warmup init container and two containers, nginx and php-fpm, which share an emptyDir for var/cache and var/logs and a shared EFS volume mounted for img, upload and download. The environment comes from a ConfigMap and from a Kubernetes Secret that External Secrets Operator builds from Secrets Manager. php-fpm connects to RDS for MySQL, to Valkey for sessions and to Memcached for the SQL cache. A horizontal pod autoscaler and a pod disruption budget control the Deployment. The CronJob pocketcoffee-cron, the Job pocketcoffee-install for the first install and the pre-upgrade Job pocketcoffee-migrate use the same image and the same configuration.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2f5f8"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One release: the objects of the chart pocketcoffee-prestashop</text>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="30" y="56" width="130" height="64" rx="8" fill="#3d5266"/><text x="95" y="82" font-weight="bold">Visitors</text><text x="95" y="102">HTTPS</text>
    <rect x="190" y="56" width="150" height="64" rx="8" fill="#7a5c3a"/><text x="265" y="80" font-weight="bold">ALB + WAF</text><text x="265" y="100">Gateway, HTTPRoute</text>
    <rect x="370" y="56" width="130" height="64" rx="8" fill="#3f6e9a"/><text x="435" y="80" font-weight="bold">Service</text><text x="435" y="100">pocketcoffee-web</text>

    <rect x="30" y="140" width="640" height="250" rx="12" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
    <text x="46" y="162" font-size="14" font-weight="bold" fill="#9fd3c7" text-anchor="start">Deployment pocketcoffee-web: at least 2 pods, spread over zones (HPA, PDB)</text>
    <rect x="50" y="176" width="600" height="198" rx="10" fill="#3d5266"/>
    <text x="350" y="196" font-weight="bold" fill="#f4b860">Pod</text>
    <rect x="66" y="208" width="130" height="56" rx="6" fill="#2f4a44"/><text x="131" y="232" font-weight="bold">init: warmup</text><text x="131" y="250">cache:warmup</text>
    <rect x="212" y="208" width="200" height="56" rx="6" fill="#4d7c5a"/><text x="312" y="232" font-weight="bold">nginx :8080</text><text x="312" y="250">/healthz, /readyz, static files</text>
    <rect x="428" y="208" width="206" height="56" rx="6" fill="#4d7c5a"/><text x="531" y="232" font-weight="bold">php-fpm :9000</text><text x="531" y="250">parameters.php from env</text>
    <rect x="66" y="282" width="250" height="40" rx="6" fill="#33485c"/><text x="191" y="306">emptyDir: var/cache, var/logs, /tmp</text>
    <rect x="334" y="282" width="300" height="40" rx="6" fill="#33485c"/><text x="484" y="306">PVC pocketcoffee-shared: img, upload, download</text>
    <text x="350" y="350">ConfigMap env + nginx and FPM files  |  Secret from ExternalSecret</text>

    <rect x="700" y="56" width="230" height="64" rx="8" fill="#7a5c3a"/><text x="815" y="80" font-weight="bold">Secrets Manager</text><text x="815" y="100">ExternalSecret, hourly refresh</text>
    <rect x="700" y="140" width="230" height="60" rx="8" fill="#3f6e9a"/><text x="815" y="164" font-weight="bold">EFS access point</text><text x="815" y="184">/shared, UID and GID 33</text>
    <rect x="700" y="216" width="230" height="52" rx="8" fill="#3d5266"/><text x="815" y="238" font-weight="bold">RDS for MySQL 8.4</text><text x="815" y="256">ps_app, ps_migrate</text>
    <rect x="700" y="280" width="230" height="52" rx="8" fill="#3d5266"/><text x="815" y="302" font-weight="bold">Valkey</text><text x="815" y="320">PHP sessions</text>
    <rect x="700" y="344" width="230" height="52" rx="8" fill="#3d5266"/><text x="815" y="366" font-weight="bold">Memcached</text><text x="815" y="384">SQL cache</text>

    <rect x="30" y="414" width="290" height="70" rx="8" fill="#4d7c5a"/><text x="175" y="440" font-weight="bold">CronJob pocketcoffee-cron</text><text x="175" y="460">every 5 minutes, Forbid overlap</text>
    <rect x="335" y="414" width="290" height="70" rx="8" fill="#4d7c5a"/><text x="480" y="440" font-weight="bold">Job pocketcoffee-install</text><text x="480" y="460">first install only, web at 0 replicas</text>
    <rect x="640" y="414" width="290" height="70" rx="8" fill="#4d7c5a"/><text x="785" y="440" font-weight="bold">Job pocketcoffee-migrate</text><text x="785" y="460">pre-upgrade hook, module upgrades</text>
    <text x="480" y="520" font-size="13" fill="#f4b860" font-weight="bold">Same image, same environment: only the command and the database user differ</text>
    <text x="480" y="544" font-size="12">Jobs run as ps_migrate; web pods and the cron run as ps_app</text>
  </g>
  <line x1="160" y1="88" x2="188" y2="88" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="88" x2="368" y2="88" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="435" y1="120" x2="435" y2="174" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="634" y1="236" x2="698" y2="242" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="634" y1="250" x2="698" y2="306" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="634" y1="262" x2="698" y2="366" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="634" y1="302" x2="698" y2="170" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
</svg>
