<svg viewBox="0 0 760 392" width="760" height="392" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="392" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three XAML dialects at a glance</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Same angle brackets, different type systems, binding engines and state mechanisms</text>
  <rect x="20" y="62" width="720" height="316" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <rect x="155" y="72" width="185" height="30" rx="6" fill="#1c4b73"/>
  <rect x="350" y="72" width="185" height="30" rx="6" fill="#1c4b73"/>
  <rect x="545" y="72" width="185" height="30" rx="6" fill="#1c4b73"/>
  <text x="247.5" y="92" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">WPF</text>
  <text x="442.5" y="92" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">WinUI 3</text>
  <text x="637.5" y="92" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">.NET MAUI</text>
  <g font-size="12" fill="#222222">
    <text x="32" y="130" font-weight="bold" fill="#1c4b73">Types live in</text>
    <text x="247.5" y="130" text-anchor="middle">System.Windows</text>
    <text x="442.5" y="130" text-anchor="middle">Microsoft.UI.Xaml</text>
    <text x="637.5" y="130" text-anchor="middle">Microsoft.Maui.Controls</text>
    <line x1="32" y1="144" x2="728" y2="144" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="168" font-weight="bold" fill="#1c4b73">Default xmlns</text>
    <text x="247.5" y="168" text-anchor="middle">winfx/2006/xaml/presentation</text>
    <text x="442.5" y="168" text-anchor="middle">winfx/2006/xaml/presentation</text>
    <text x="637.5" y="168" text-anchor="middle">dotnet/2021/maui</text>
    <line x1="32" y1="182" x2="728" y2="182" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="206" font-weight="bold" fill="#1c4b73">Root element</text>
    <text x="247.5" y="206" text-anchor="middle">Window or UserControl</text>
    <text x="442.5" y="206" text-anchor="middle">Window, Page or UserControl</text>
    <text x="637.5" y="206" text-anchor="middle">ContentPage or Shell</text>
    <line x1="32" y1="220" x2="728" y2="220" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="244" font-weight="bold" fill="#1c4b73">Binding source</text>
    <text x="247.5" y="244" text-anchor="middle">DataContext (inherited)</text>
    <text x="442.5" y="244" text-anchor="middle">owning class, or DataContext</text>
    <text x="637.5" y="244" text-anchor="middle">BindingContext (inherited)</text>
    <line x1="32" y1="258" x2="728" y2="258" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="282" font-weight="bold" fill="#1c4b73">Compiled bindings</text>
    <text x="247.5" y="282" text-anchor="middle">none (reflection)</text>
    <text x="442.5" y="282" text-anchor="middle">x:Bind, default OneTime</text>
    <text x="637.5" y="282" text-anchor="middle">x:DataType + Binding</text>
    <line x1="32" y1="296" x2="728" y2="296" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="320" font-weight="bold" fill="#1c4b73">State changes</text>
    <text x="247.5" y="320" text-anchor="middle">Triggers and VSM</text>
    <text x="442.5" y="320" text-anchor="middle">VisualStateManager only</text>
    <text x="637.5" y="320" text-anchor="middle">Triggers and VSM</text>
    <line x1="32" y1="334" x2="728" y2="334" stroke="#d5dde8" stroke-width="1"/>
    <text x="32" y="358" font-weight="bold" fill="#1c4b73">Theme-aware values</text>
    <text x="247.5" y="358" text-anchor="middle">DynamicResource, ThemeMode</text>
    <text x="442.5" y="358" text-anchor="middle">ThemeResource</text>
    <text x="637.5" y="358" text-anchor="middle">AppThemeBinding</text>
  </g>
</svg>
