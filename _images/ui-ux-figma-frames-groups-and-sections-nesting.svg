<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What can contain what</text>
  <rect x="30" y="50" width="130" height="44" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/><text x="95" y="77" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">File</text>
  <rect x="200" y="50" width="130" height="44" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/><text x="265" y="77" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Page</text>
  <rect x="370" y="50" width="150" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="445" y="77" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Section (top level)</text>
  <rect x="570" y="50" width="160" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="650" y="77" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Top-level frame</text>
  <path d="M160 72 L198 72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M330 72 L368 72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M520 72 L568 72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="570" y="130" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="650" y="157" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Nested frame</text>
  <rect x="570" y="210" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="2" stroke-dasharray="5 4"/><text x="650" y="237" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Group</text>
  <rect x="570" y="280" width="160" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/><text x="650" y="305" font-size="13" fill="#374151" text-anchor="middle">Shape, text, vector</text>
  <path d="M650 94 L650 128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M650 174 L650 208" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M650 254 L650 278" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="606" cy="112" r="11" fill="#4F46E5"/><text x="606" y="116" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="445" cy="120" r="11" fill="#B45309"/><text x="445" y="124" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="350" cy="260" r="11" fill="#B91C1C"/><text x="350" y="264" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="40" y="150" font-size="12" fill="#374151">1  Frames nest in frames and groups; groups nest in groups</text>
  <text x="40" y="172" font-size="12" fill="#374151">   and frames; a nested frame is parent and child at once</text>
  <text x="40" y="196" font-size="12" fill="#374151">2  Sections hold any layer type, including other sections</text>
  <text x="40" y="226" font-size="12" fill="#B91C1C">3  Not allowed: a section inside a frame or group,</text>
  <text x="40" y="244" font-size="12" fill="#B91C1C">   or a top-level frame inside another frame</text>
  <text x="40" y="300" font-size="11" fill="#6B7280">Schematic of the nesting rules in the Figma Learn articles, checked 2026-10-30.</text>
</svg>
