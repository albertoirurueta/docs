<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <title>LLMOps maturity levels</title>
  <desc>Three maturity levels for operating an LLM application, shown as ascending steps. Level 0, ad hoc: prompts live in code or notebooks, quality is judged by eye, there is no tracing and cost is discovered on the invoice. Level 1, managed: prompts and models are versioned, a golden evaluation set runs in continuous integration, traces and basic metrics are collected, and a gateway enforces keys and budgets. Level 2, optimised: online sampled evaluation and user feedback feed the golden set, releases use shadow, canary and A/B patterns, drift is monitored with alerts, cost is attributed per tenant and feature, and every metric has an owner and a runbook.</desc>
  <rect x="0" y="0" width="1000" height="440" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">LLMOps maturity: from ad hoc to optimised</text>

  <rect x="20" y="250" width="300" height="150" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="170" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Level 0 - Ad hoc</text>
  <text x="36" y="302" font-size="12" fill="#1e293b">Prompts live in code or notebooks</text>
  <text x="36" y="324" font-size="12" fill="#1e293b">Quality judged by eye</text>
  <text x="36" y="346" font-size="12" fill="#1e293b">No traces, only application logs</text>
  <text x="36" y="368" font-size="12" fill="#1e293b">Cost discovered on the invoice</text>
  <text x="36" y="390" font-size="12" fill="#1e293b">Releases are deployments</text>

  <rect x="350" y="170" width="300" height="230" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="500" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Level 1 - Managed</text>
  <text x="366" y="222" font-size="12" fill="#1e293b">Prompts and models versioned</text>
  <text x="366" y="244" font-size="12" fill="#1e293b">Golden set runs in CI as a gate</text>
  <text x="366" y="266" font-size="12" fill="#1e293b">Traces and golden-signal metrics</text>
  <text x="366" y="288" font-size="12" fill="#1e293b">Gateway: keys, routing, budgets</text>
  <text x="366" y="310" font-size="12" fill="#1e293b">Model versions pinned</text>
  <text x="366" y="332" font-size="12" fill="#1e293b">Rollback is a configuration change</text>
  <text x="366" y="354" font-size="12" fill="#1e293b">Documented runbooks for outages</text>

  <rect x="680" y="90" width="300" height="310" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="830" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Level 2 - Optimised</text>
  <text x="696" y="142" font-size="12" fill="#1e293b">Sampled online evaluation</text>
  <text x="696" y="164" font-size="12" fill="#1e293b">Feedback flows into the golden set</text>
  <text x="696" y="186" font-size="12" fill="#1e293b">Shadow, canary and A/B releases</text>
  <text x="696" y="208" font-size="12" fill="#1e293b">Drift monitoring and judge-score alerts</text>
  <text x="696" y="230" font-size="12" fill="#1e293b">Cost attributed per tenant and feature</text>
  <text x="696" y="252" font-size="12" fill="#1e293b">Every metric has an owner</text>
  <text x="696" y="274" font-size="12" fill="#1e293b">Audit trail and incident reviews</text>
  <text x="696" y="296" font-size="12" fill="#1e293b">Self-assessment repeated each quarter</text>

  <path d="M322 325 L348 325" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M652 285 L678 285" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <text x="500" y="428" text-anchor="middle" font-size="11" fill="#475569">Levels paraphrase the maturity model in Aryan, LLMOps, Chapter 2; the practices attached to each level follow this sub-section.</text>
</svg>
