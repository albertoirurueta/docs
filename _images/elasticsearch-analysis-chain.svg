<svg viewBox="0 0 760 476" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="476" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The analysis chain: text &#8594; indexed terms</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">The same chain runs at index time and, by default, at query time</text>

  <!-- Stage 1: input -->
  <rect x="40" y="58" width="680" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="78" font-size="12" font-weight="bold" fill="#222222">Input text</text>
  <text x="56" y="98" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">&lt;p&gt;The 2 QUICK Brown-Foxes jumped!&lt;/p&gt;</text>

  <path d="M380,110 L380,126" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,124 386,124 380,132" fill="#999999"/>

  <!-- Stage 2: char filters -->
  <rect x="40" y="134" width="680" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="154" font-size="12" font-weight="bold" fill="#2f5424">Character filters</text>
  <text x="56" y="172" font-size="11" fill="#666666" font-family="'Courier New', monospace">html_strip</text>
  <text x="56" y="186" font-size="10.5" fill="#999999">rewrite the raw string, character by character</text>
  <text x="410" y="166" font-size="11" fill="#666666">result</text>
  <text x="410" y="184" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">The 2 QUICK Brown-Foxes jumped!</text>

  <path d="M380,190 L380,206" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,204 386,204 380,212" fill="#999999"/>

  <!-- Stage 3: tokenizer -->
  <rect x="40" y="214" width="680" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="234" font-size="12" font-weight="bold" fill="#2f5424">Tokenizer</text>
  <text x="56" y="252" font-size="11" fill="#666666" font-family="'Courier New', monospace">standard</text>
  <text x="56" y="266" font-size="10.5" fill="#999999">split the stream into tokens (exactly one)</text>
  <text x="410" y="246" font-size="11" fill="#666666">tokens</text>
  <text x="410" y="264" font-family="'Courier New', monospace" font-size="12" fill="#222222">[The] [2] [QUICK] [Brown] [Foxes] [jumped]</text>

  <path d="M380,270 L380,286" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,284 386,284 380,292" fill="#999999"/>

  <!-- Stage 4: token filters -->
  <rect x="40" y="294" width="680" height="104" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="314" font-size="12" font-weight="bold" fill="#2f5424">Token filters</text>
  <text x="56" y="332" font-size="11" fill="#666666" font-family="'Courier New', monospace">lowercase</text>
  <text x="56" y="350" font-size="11" fill="#666666" font-family="'Courier New', monospace">stop</text>
  <text x="56" y="368" font-size="11" fill="#666666" font-family="'Courier New', monospace">stemmer</text>
  <text x="56" y="388" font-size="10.5" fill="#999999">add, remove or rewrite tokens, in order</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="300" y="332" fill="#222222">&#8594; [the] [2] [quick] [brown] [foxes] [jumped]</text>
    <text x="300" y="350" fill="#222222">&#8594; [2] [quick] [brown] [foxes] [jumped]</text>
    <text x="556" y="350" fill="#999999" font-size="10.5">"the" is a stop word</text>
    <text x="300" y="368" fill="#222222">&#8594; [2] [quick] [brown] [fox] [jump]</text>
  </g>

  <path d="M380,398 L380,414" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,412 386,412 380,420" fill="#999999"/>

  <!-- Stage 5: indexed terms -->
  <rect x="40" y="422" width="680" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="56" y="440" font-size="12" font-weight="bold" fill="#222222">Indexed terms</text>
  <text x="56" y="458" font-family="'Courier New', monospace" font-size="12.5" fill="#1c4b73">2&#160;&#160;&#160;quick&#160;&#160;&#160;brown&#160;&#160;&#160;fox&#160;&#160;&#160;jump</text>
  <text x="704" y="440" font-size="10.5" fill="#666666" text-anchor="end">stored in the inverted index; a keyword field would skip this whole chain</text>
</svg>
