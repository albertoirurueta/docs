<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">When scikit-learn stops being enough</title>
<desc id="d">A ladder of five steps from a linear model to a framework such as PyTorch or Keras, with the signal that justifies climbing each step.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">From scikit-learn to deep learning: signals for moving up</text>
<rect x="30" y="60" width="660" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="42" y="79" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">linear model / HistGradientBoosting</text>
<text x="42" y="96" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">tabular data, strong baseline, start here</text>
<rect x="50" y="114" width="620" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="62" y="133" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">MLPClassifier / MLPRegressor</text>
<text x="62" y="150" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">smooth non-linear fit on scaled, small tabular data</text>
<rect x="70" y="168" width="580" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="82" y="187" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">skorch or Keras wrapper in a Pipeline</text>
<text x="82" y="204" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">custom architecture, but keep the scikit-learn API</text>
<rect x="90" y="222" width="540" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="102" y="241" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">PyTorch or Keras training loop</text>
<text x="102" y="258" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">GPU, images, text, audio, sequences, custom losses</text>
<rect x="110" y="276" width="500" height="44" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="122" y="295" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">pre-trained model, fine-tuning</text>
<text x="122" y="312" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">little labelled data, a foundation model exists</text>
</svg>
