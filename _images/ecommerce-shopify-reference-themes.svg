<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="currentColor">
  <title id="t">The three Shopify reference themes and what each is used for</title>
  <desc id="d">Skeleton is the only approved Theme Store starting point, Dawn is the section-based reference, Horizon is the theme-block reference. Dawn and Horizon themes are not eligible for the Theme Store.</desc>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="10" y="10" width="236" height="300" rx="10" fill="currentColor" fill-opacity="0.06"/>
    <rect x="262" y="10" width="236" height="300" rx="10" fill="currentColor" fill-opacity="0.06"/>
    <rect x="514" y="10" width="236" height="300" rx="10" fill="currentColor" fill-opacity="0.06"/>
    <line x1="22" y1="52" x2="234" y2="52" stroke-opacity="0.4"/>
    <line x1="274" y1="52" x2="486" y2="52" stroke-opacity="0.4"/>
    <line x1="526" y1="52" x2="738" y2="52" stroke-opacity="0.4"/>
  </g>
  <g font-weight="700" font-size="17">
    <text x="22" y="40">Skeleton</text>
    <text x="274" y="40">Dawn</text>
    <text x="526" y="40">Horizon</text>
  </g>
  <g>
    <text x="22" y="76">Minimal starter, 39 files</text>
    <text x="22" y="98">JSON templates, few sections</text>
    <text x="22" y="120">2 theme blocks (group, text)</text>
    <text x="22" y="142">No JavaScript, one CSS file</text>
    <text x="22" y="164">Theme Check: 0 offenses</text>
    <text x="22" y="198" font-weight="700">Start here for:</text>
    <text x="22" y="220">a new theme of your own</text>
    <text x="22" y="242">a custom store theme</text>
    <text x="22" y="264">a Theme Store submission</text>
    <text x="22" y="292" font-style="italic">tag v1.0.0, main = rc-v2.0.0</text>

    <text x="274" y="76">Full theme, 155 files</text>
    <text x="274" y="98">48 sections, JSON templates</text>
    <text x="274" y="120">Section blocks, no /blocks folder</text>
    <text x="274" y="142">36 JS files, 65 CSS files</text>
    <text x="274" y="164">Theme Check: 9 warnings</text>
    <text x="274" y="198" font-weight="700">Read or fork for:</text>
    <text x="274" y="220">how sections are built</text>
    <text x="274" y="242">a store that must stay close</text>
    <text x="274" y="264">to a Shopify-maintained theme</text>
    <text x="274" y="292" font-style="italic">version 16.0.0</text>

    <text x="526" y="76">Full theme, 357 files</text>
    <text x="526" y="98">42 sections, JSON templates</text>
    <text x="526" y="120">95 theme block files (51 private)</text>
    <text x="526" y="142">81 JS files, ES modules</text>
    <text x="526" y="164">Theme Check: 6 warnings</text>
    <text x="526" y="198" font-weight="700">Read or fork for:</text>
    <text x="526" y="220">how theme blocks nest</text>
    <text x="526" y="242">a store that wants the newest</text>
    <text x="526" y="264">first-party theme features</text>
    <text x="526" y="292" font-style="italic">version 4.3.0</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="10" y="334" width="236" height="52" rx="8" fill="currentColor" fill-opacity="0.14"/>
    <rect x="262" y="334" width="488" height="52" rx="8" stroke-dasharray="6 4"/>
  </g>
  <text x="22" y="356" font-weight="700">Theme Store: approved codebase</text>
  <text x="22" y="375">the only one</text>
  <text x="274" y="356" font-weight="700">Theme Store: not eligible</text>
  <text x="274" y="375">new submissions built on or derived from Dawn or Horizon are rejected</text>
</svg>
