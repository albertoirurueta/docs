<svg viewBox="0 0 720 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="390" fill="#ffffff"/>

  <defs>
    <marker id="vps-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="vps-orange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">A Pinia store: one source of shared state</text>

  <!-- store box -->
  <rect x="260" y="60" width="200" height="240" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="2"/>
  <rect x="260" y="60" width="200" height="30" rx="6" fill="#2f6fa8"/>
  <rect x="260" y="76" width="200" height="14" fill="#2f6fa8"/>
  <text x="360" y="80" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="'Courier New', monospace">useCartStore</text>

  <line x1="260" y1="146" x2="460" y2="146" stroke="#cfe0f2" stroke-width="1.2"/>
  <line x1="260" y1="204" x2="460" y2="204" stroke="#cfe0f2" stroke-width="1.2"/>

  <text x="272" y="110" font-size="12" font-weight="bold" fill="#1c4b73">state</text>
  <text x="272" y="130" font-size="12" fill="#222222" font-family="'Courier New', monospace">items: []</text>

  <text x="272" y="166" font-size="12" font-weight="bold" fill="#1c4b73">getters</text>
  <text x="272" y="186" font-size="12" fill="#222222" font-family="'Courier New', monospace">total</text>

  <text x="272" y="224" font-size="12" font-weight="bold" fill="#1c4b73">actions</text>
  <text x="272" y="244" font-size="12" fill="#222222" font-family="'Courier New', monospace">addItem()</text>
  <text x="272" y="264" font-size="12" fill="#222222" font-family="'Courier New', monospace">clear()</text>

  <!-- left component: reader -->
  <rect x="44" y="150" width="164" height="76" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="126" y="182" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">&lt;CartBadge&gt;</text>
  <text x="126" y="202" font-size="11" fill="#1c4b73" text-anchor="middle">shows total</text>

  <line x1="258" y1="180" x2="212" y2="184" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vps-blue)"/>
  <text x="234" y="166" font-size="11" font-weight="bold" fill="#2f6fa8" text-anchor="middle">reads state</text>

  <!-- right component: writer -->
  <rect x="512" y="150" width="164" height="76" rx="6" fill="#fdf1e8" stroke="#c25a1d" stroke-width="2"/>
  <text x="594" y="182" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle" font-family="'Courier New', monospace">&lt;AddToCart&gt;</text>
  <text x="594" y="202" font-size="11" fill="#7a4a2a" text-anchor="middle">on click</text>

  <line x1="510" y1="196" x2="462" y2="238" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#vps-orange)"/>
  <text x="500" y="164" font-size="11" font-weight="bold" fill="#c25a1d" text-anchor="middle">calls action</text>

  <text x="360" y="352" font-size="12.5" fill="#444444" text-anchor="middle">Components read state reactively; they change it only by calling actions.</text>
</svg>
