<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A Go WebAssembly module and its host</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">The module only has linear memory and the imports the host supplies; GOOS decides which imports the Go runtime expects</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b34700"/></marker>
  </defs>

  <!-- left host: JavaScript -->
  <rect x="24" y="70" width="270" height="400" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="40" y="94" font-size="14" font-weight="bold" fill="#1c4b73">JavaScript host (GOOS=js)</text>
  <text x="40" y="112" font-size="12" fill="#333333">browser or Node.js</text>
  <g font-size="12" fill="#222222">
    <rect x="40" y="128" width="238" height="56" rx="5" fill="#ffffff" stroke="#1c4b73"/>
    <text x="52" y="148" font-weight="bold">wasm_exec.js (from GOROOT/lib/wasm)</text>
    <text x="52" y="166">class Go: importObject, run(instance)</text>
    <text x="52" y="179" font-size="11" fill="#555555">same Go version as the compiler</text>
    <rect x="40" y="198" width="238" height="64" rx="5" fill="#ffffff" stroke="#1c4b73"/>
    <text x="52" y="218" font-weight="bold">your page or script</text>
    <text x="52" y="236">instantiateStreaming(fetch(...))</text>
    <text x="52" y="252">shelfParseISBN("978-...")</text>
    <rect x="40" y="276" width="238" height="64" rx="5" fill="#ffffff" stroke="#1c4b73"/>
    <text x="52" y="296" font-weight="bold">JavaScript world</text>
    <text x="52" y="314">document, window, fetch, console</text>
    <text x="52" y="330">reached with syscall/js</text>
    <text x="40" y="364" font-size="12" font-weight="bold" fill="#1c4b73">imports it provides to Go</text>
    <text x="40" y="382" font-size="11" fill="#333333">gojs.runtime.wasmWrite, nanotime1, ...</text>
    <text x="40" y="398" font-size="11" fill="#333333">gojs.syscall/js.valueGet, valueCall, ...</text>
    <text x="40" y="420" font-size="12" font-weight="bold" fill="#1c4b73">exports it calls</text>
    <text x="40" y="438" font-size="11" fill="#333333">run, resume, getsp, mem</text>
    <text x="40" y="458" font-size="11" fill="#555555">Go functions are reached through js.FuncOf</text>
  </g>

  <!-- centre: module -->
  <rect x="340" y="70" width="260" height="400" rx="8" fill="#fff3d6" stroke="#b34700" stroke-width="1.5"/>
  <text x="470" y="94" font-size="14" font-weight="bold" fill="#b34700" text-anchor="middle">main.wasm (GOARCH=wasm)</text>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="360" y="108" width="220" height="62" rx="5" fill="#ffffff" stroke="#b34700"/>
    <text x="470" y="130" font-weight="bold">your packages</text>
    <text x="470" y="148">catalog.ParseISBN, handlers, ...</text>
    <text x="470" y="162" font-size="11" fill="#555555">//go:wasmexport, //go:wasmimport</text>
    <rect x="360" y="182" width="220" height="62" rx="5" fill="#ffffff" stroke="#b34700"/>
    <text x="470" y="204" font-weight="bold">Go runtime inside the module</text>
    <text x="470" y="222">scheduler, garbage collector, timers</text>
    <text x="470" y="236" font-size="11" fill="#555555">one thread: goroutines are interleaved</text>
    <rect x="360" y="256" width="220" height="86" rx="5" fill="#ffffff" stroke="#b34700"/>
    <text x="470" y="278" font-weight="bold">linear memory</text>
    <text x="470" y="296">one growable byte array</text>
    <text x="470" y="312" font-size="11" fill="#555555">pointers cross the boundary as i32 offsets</text>
    <text x="470" y="328" font-size="11" fill="#555555">a Go int is 64 bits, a pointer is 32</text>
    <rect x="360" y="354" width="220" height="48" rx="5" fill="#ffffff" stroke="#b34700"/>
    <text x="470" y="374" font-weight="bold">entry point</text>
    <text x="470" y="392" font-size="11" fill="#555555">command: _start    reactor: _initialize</text>
  </g>
  <text x="470" y="424" font-size="11" fill="#555555" text-anchor="middle">sandboxed: no files, clock, network or</text>
  <text x="470" y="440" font-size="11" fill="#555555" text-anchor="middle">threads unless the host grants them</text>

  <!-- right host: WASI -->
  <rect x="646" y="70" width="270" height="400" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="662" y="94" font-size="14" font-weight="bold" fill="#2e7d32">WASI host (GOOS=wasip1)</text>
  <text x="662" y="112" font-size="12" fill="#333333">wasmtime, wazero, Wasmer, Node.js</text>
  <g font-size="12" fill="#222222">
    <rect x="662" y="128" width="238" height="56" rx="5" fill="#ffffff" stroke="#2e7d32"/>
    <text x="674" y="148" font-weight="bold">WASI preview 1 implementation</text>
    <text x="674" y="166">wasi_snapshot_preview1.*</text>
    <text x="674" y="179" font-size="11" fill="#555555">fd_write, clock_time_get, random_get</text>
    <rect x="662" y="198" width="238" height="64" rx="5" fill="#ffffff" stroke="#2e7d32"/>
    <text x="674" y="218" font-weight="bold">capabilities you configure</text>
    <text x="674" y="236">args, environment variables</text>
    <text x="674" y="252">preopened directories, stdio</text>
    <rect x="662" y="276" width="238" height="64" rx="5" fill="#ffffff" stroke="#2e7d32"/>
    <text x="674" y="296" font-weight="bold">your own host functions</text>
    <text x="674" y="314">for example shelf_host.log</text>
    <text x="674" y="330">declared with //go:wasmimport</text>
    <text x="662" y="364" font-size="12" font-weight="bold" fill="#2e7d32">imports it provides to Go</text>
    <text x="662" y="382" font-size="11" fill="#333333">about fifteen wasi_snapshot_preview1 functions</text>
    <text x="662" y="398" font-size="11" fill="#333333">plus any module name you register</text>
    <text x="662" y="420" font-size="12" font-weight="bold" fill="#2e7d32">exports it calls</text>
    <text x="662" y="438" font-size="11" fill="#333333">_start, or _initialize then your exports</text>
    <text x="662" y="458" font-size="11" fill="#555555">no JavaScript, so no syscall/js</text>
  </g>

  <!-- arrows -->
  <line x1="294" y1="156" x2="338" y2="156" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="338" y1="230" x2="296" y2="230" stroke="#b34700" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="648" y1="156" x2="602" y2="156" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="602" y1="230" x2="644" y2="230" stroke="#b34700" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="316" y="148" font-size="10" fill="#1c4b73" text-anchor="middle">imports</text>
  <text x="316" y="246" font-size="10" fill="#b34700" text-anchor="middle">calls</text>
  <text x="624" y="148" font-size="10" fill="#1c4b73" text-anchor="middle">imports</text>
  <text x="624" y="246" font-size="10" fill="#b34700" text-anchor="middle">calls</text>

  <!-- footer -->
  <text x="470" y="498" font-size="12" fill="#333333" text-anchor="middle">Both ports use the same compiler and the same instruction set; only the imports and the entry point differ.</text>
  <text x="470" y="516" font-size="12" fill="#333333" text-anchor="middle">Imports are the module's only way out; exports are the only way in.</text>
</svg>
