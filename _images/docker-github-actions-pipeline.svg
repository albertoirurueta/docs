<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Build, test, push, deploy in GitHub Actions</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Build, test, push, deploy in GitHub Actions</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">the image workflow on a push to main or a version tag</text>
  <rect x="12" y="65" width="136" height="80" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="80.0" y="100.8" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">checkout</text>
  <text x="80.0" y="115.8" font-size="9" fill="#333333" text-anchor="middle">actions/checkout@v7</text>
  <line x1="148" y1="105" x2="160" y2="105" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="160" y="65" width="136" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="228.0" y="94.2" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">QEMU + Buildx</text>
  <text x="228.0" y="109.2" font-size="9" fill="#333333" text-anchor="middle">setup-qemu-action@v4</text>
  <text x="228.0" y="122.2" font-size="9" fill="#333333" text-anchor="middle">setup-buildx-action@v4</text>
  <line x1="296" y1="105" x2="308" y2="105" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="308" y="65" width="136" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="376.0" y="94.2" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">login</text>
  <text x="376.0" y="109.2" font-size="9" fill="#333333" text-anchor="middle">login-action@v4</text>
  <text x="376.0" y="122.2" font-size="9" fill="#333333" text-anchor="middle">GHCR / Docker Hub</text>
  <line x1="444" y1="105" x2="456" y2="105" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="456" y="65" width="136" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="524.0" y="100.8" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">tags + labels</text>
  <text x="524.0" y="115.8" font-size="9" fill="#333333" text-anchor="middle">metadata-action@v6</text>
  <line x1="592" y1="105" x2="604" y2="105" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="604" y="65" width="136" height="80" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="672.0" y="94.2" font-size="10.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">build + load</text>
  <text x="672.0" y="109.2" font-size="9" fill="#333333" text-anchor="middle">build-push-action@v7</text>
  <text x="672.0" y="122.2" font-size="9" fill="#333333" text-anchor="middle">load: true</text>
  <line x1="672" y1="145" x2="672" y2="165" stroke="#444444" stroke-width="1.2"/>
  <line x1="672" y1="165" x2="154" y2="165" stroke="#444444" stroke-width="1.2"/>
  <line x1="154" y1="165" x2="154" y2="185" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="86" y="185" width="136" height="90" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="154.0" y="219.2" font-size="10.5" font-weight="bold" fill="#8f2a2a" text-anchor="middle">smoke test</text>
  <text x="154.0" y="234.2" font-size="9" fill="#333333" text-anchor="middle">docker run + curl</text>
  <text x="154.0" y="247.2" font-size="9" fill="#333333" text-anchor="middle">readiness endpoint</text>
  <line x1="222" y1="230" x2="234" y2="230" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="234" y="185" width="136" height="90" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="302.0" y="212.8" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">push</text>
  <text x="302.0" y="227.8" font-size="9" fill="#333333" text-anchor="middle">multi-platform</text>
  <text x="302.0" y="240.8" font-size="9" fill="#333333" text-anchor="middle">gha cache, SBOM,</text>
  <text x="302.0" y="253.8" font-size="9" fill="#333333" text-anchor="middle">provenance</text>
  <line x1="370" y1="230" x2="382" y2="230" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="382" y="185" width="136" height="90" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="450.0" y="219.2" font-size="10.5" font-weight="bold" fill="#5b3a8c" text-anchor="middle">scan</text>
  <text x="450.0" y="234.2" font-size="9" fill="#333333" text-anchor="middle">scout-action@v1</text>
  <text x="450.0" y="247.2" font-size="9" fill="#333333" text-anchor="middle">critical/high gate</text>
  <line x1="518" y1="230" x2="530" y2="230" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="530" y="185" width="136" height="90" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="598.0" y="219.2" font-size="10.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">deploy</text>
  <text x="598.0" y="234.2" font-size="9" fill="#333333" text-anchor="middle">by digest</text>
  <text x="598.0" y="247.2" font-size="9" fill="#333333" text-anchor="middle">(deploy.yml)</text>
  <text x="380" y="310" font-size="10" fill="#555555" text-anchor="middle">pull requests stop after the smoke test (push: false); tags from metadata-action: main, sha-..., 1.4.0, 1.4, latest</text>
  <text x="380" y="332" font-size="10" fill="#555555" text-anchor="middle">cache-to: type=gha,mode=max keeps the dependency stage warm between runs</text>
  <rect x="120" y="360" width="520" height="70" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="384.2" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">House deploy.yml alternative</text>
  <text x="380.0" y="399.2" font-size="9" fill="#333333" text-anchor="middle">mvn spring-boot:build-image -Dspring-boot.build-image.publish=true</text>
  <text x="380.0" y="412.2" font-size="9" fill="#333333" text-anchor="middle">with OIDC credentials for the cloud registry</text>
</svg>
