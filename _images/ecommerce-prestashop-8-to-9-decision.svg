<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Choosing between PrestaShop 8 and 9 depending on the shop you have</title>
  <desc id="d">A new shop starts on 9.2. A shop on 9.0 or 9.1 updates to 9.2. A shop on 8.2 checks whether its modules and theme have 9.x versions: if yes it updates a copy or migrates, if not it stays on 8.2 only while porting them. A shop on 1.7 or older migrates its data to a new 9.2 shop.</desc>

  <rect x="20" y="170" width="190" height="100" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>
  <text x="115" y="212" text-anchor="middle" font-weight="bold">Which shop</text>
  <text x="115" y="234" text-anchor="middle" font-weight="bold">do you have?</text>

  <rect x="270" y="20" width="190" height="64" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="48" text-anchor="middle" font-weight="bold">No shop yet</text>
  <text x="365" y="68" text-anchor="middle" font-size="12" opacity="0.85">new project</text>
  <rect x="520" y="20" width="360" height="64" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="48" text-anchor="middle">Install 9.2.0 on PHP 8.4 or 8.5</text>
  <text x="700" y="68" text-anchor="middle" font-size="12" opacity="0.85">pin the exact version, never an open tag</text>

  <rect x="270" y="118" width="190" height="64" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="146" text-anchor="middle" font-weight="bold">PrestaShop 9.0 or 9.1</text>
  <text x="365" y="166" text-anchor="middle" font-size="12" opacity="0.85">9.0.x and 9.1.x are ended</text>
  <rect x="520" y="118" width="360" height="64" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="146" text-anchor="middle">Update to 9.2.x</text>
  <text x="700" y="166" text-anchor="middle" font-size="12" opacity="0.85">backup, Update Assistant 7.6.6 or later, test modules</text>

  <rect x="270" y="216" width="190" height="64" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="244" text-anchor="middle" font-weight="bold">PrestaShop 8.x</text>
  <text x="365" y="264" text-anchor="middle" font-size="12" opacity="0.85">8.2.x is in extended support</text>
  <rect x="520" y="204" width="360" height="88" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="230" text-anchor="middle">Modules and theme available for 9.x?</text>
  <text x="700" y="252" text-anchor="middle" font-size="12">yes: rehearse the update on a copy, or migrate to a fresh 9.2</text>
  <text x="700" y="272" text-anchor="middle" font-size="12">no: stay on 8.2.x only while you port or replace them</text>

  <rect x="270" y="320" width="190" height="64" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="348" text-anchor="middle" font-weight="bold">1.7 or older</text>
  <text x="365" y="368" text-anchor="middle" font-size="12" opacity="0.85">end of life, no patches</text>
  <rect x="520" y="320" width="360" height="64" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="700" y="348" text-anchor="middle">Migrate the data to a new 9.2 shop</text>
  <text x="700" y="368" text-anchor="middle" font-size="12" opacity="0.85">export, adapt, import; rebuild theme and modules</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M210 220 L240 220 L240 52 L268 52" marker-end="url(#ar)"/>
    <path d="M210 220 L240 220 L240 150 L268 150" marker-end="url(#ar)"/>
    <path d="M210 220 L240 220 L240 248 L268 248" marker-end="url(#ar)"/>
    <path d="M210 220 L240 220 L240 352 L268 352" marker-end="url(#ar)"/>
    <path d="M460 52 L518 52" marker-end="url(#ar)"/>
    <path d="M460 150 L518 150" marker-end="url(#ar)"/>
    <path d="M460 248 L518 248" marker-end="url(#ar)"/>
    <path d="M460 352 L518 352" marker-end="url(#ar)"/>
  </g>
  <text x="450" y="420" text-anchor="middle" font-size="12" opacity="0.85">Whatever the branch, take a backup first and rehearse the change on a copy of the shop</text>
</svg>
