<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Vapor stack, from sockets to handler</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">each layer builds on the ones below it; a request travels up the stack and the response travels back down</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- handler -->
  <rect x="60" y="66" width="640" height="56" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="80" y="89" font-size="14" font-weight="bold" fill="#6a3d9a">Route handler (your Bookshelf code)</text>
  <text x="80" y="109" font-size="12" fill="#222222">async throws closure or controller method; returns a ResponseEncodable (Content, String, Response)</text>

  <!-- middleware -->
  <rect x="60" y="134" width="640" height="66" rx="6" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="80" y="157" font-size="14" font-weight="bold" fill="#b7410e">Middleware chain (Middleware / AsyncMiddleware)</text>
  <text x="80" y="176" font-size="12" fill="#222222">RouteLoggingMiddleware, ErrorMiddleware, then app.middleware in order, then route-group middleware;</text>
  <text x="80" y="192" font-size="12" fill="#222222">each one wraps the next Responder: code before and after next.respond(to:)</text>

  <!-- router -->
  <rect x="60" y="212" width="640" height="66" rx="6" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="80" y="235" font-size="14" font-weight="bold" fill="#8a6a00">Router (DefaultResponder + RoutingKit TrieRouter)</text>
  <text x="80" y="254" font-size="12" fill="#222222">looks up method + path, fills req.parameters, selects the route (or the 404 responder);</text>
  <text x="80" y="270" font-size="12" fill="#222222">the matched route's responder is already wrapped in its middleware chain</text>

  <!-- vapor http server -->
  <rect x="60" y="290" width="640" height="78" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="313" font-size="14" font-weight="bold" fill="#2e7d32">Vapor HTTP server (HTTPServer, Application, Request / Response)</text>
  <text x="80" y="332" font-size="12" fill="#222222">pipeline handlers: TLS, HTTP/1.1 or HTTP/2 codec, compression, HTTPServerRequestDecoder</text>
  <text x="80" y="348" font-size="12" fill="#222222">(builds a Vapor Request), HTTPServerHandler (calls the Responder), HTTPServerResponseEncoder</text>
  <text x="80" y="362" font-size="12" fill="#222222">services: Application.Services, logger, Environment, lifecycle, commands</text>

  <!-- swiftnio -->
  <rect x="60" y="380" width="640" height="78" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="80" y="403" font-size="14" font-weight="bold" fill="#1c4b73">SwiftNIO (NIOCore, NIOPosix, NIOHTTP1, NIOHTTP2, NIOSSL)</text>
  <text x="80" y="422" font-size="12" fill="#222222">MultiThreadedEventLoopGroup, EventLoop (one thread each), ServerBootstrap, Channel,</text>
  <text x="80" y="438" font-size="12" fill="#222222">ChannelPipeline of ChannelHandlers, ByteBuffer, EventLoopFuture / EventLoopPromise, NIOThreadPool</text>

  <!-- os -->
  <rect x="60" y="470" width="640" height="66" rx="6" fill="#eeeeee" stroke="#444444" stroke-width="1.5"/>
  <text x="80" y="493" font-size="14" font-weight="bold" fill="#333333">Operating system sockets</text>
  <text x="80" y="512" font-size="12" fill="#222222">non-blocking TCP sockets multiplexed with kqueue (macOS) or epoll (Linux);</text>
  <text x="80" y="528" font-size="12" fill="#222222">the kernel wakes an event loop when a connection or bytes are ready</text>

  <!-- side notes -->
  <g font-size="12" fill="#222222">
    <rect x="730" y="66" width="190" height="134" rx="6" fill="#ffffff" stroke="#777777" stroke-dasharray="4 3"/>
    <text x="825" y="88" text-anchor="middle" font-weight="bold" fill="#444444">Your code runs here</text>
    <text x="825" y="110" text-anchor="middle">Swift concurrency:</text>
    <text x="825" y="126" text-anchor="middle">async/await, Sendable,</text>
    <text x="825" y="142" text-anchor="middle">actors; futures only as</text>
    <text x="825" y="158" text-anchor="middle">a legacy bridge</text>
    <text x="825" y="182" text-anchor="middle" fill="#b7410e">never block the thread</text>
    <rect x="730" y="290" width="190" height="168" rx="6" fill="#ffffff" stroke="#777777" stroke-dasharray="4 3"/>
    <text x="825" y="312" text-anchor="middle" font-weight="bold" fill="#444444">Event-loop territory</text>
    <text x="825" y="334" text-anchor="middle">a few threads (one per core)</text>
    <text x="825" y="350" text-anchor="middle">serve all connections;</text>
    <text x="825" y="366" text-anchor="middle">a blocked loop stalls every</text>
    <text x="825" y="382" text-anchor="middle">connection assigned to it,</text>
    <text x="825" y="398" text-anchor="middle">so blocking work goes to</text>
    <text x="825" y="414" text-anchor="middle">threadPool or an actor</text>
  </g>
  <g stroke="#444444" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="380" y1="468" x2="380" y2="460"/>
    <line x1="380" y1="378" x2="380" y2="370"/>
    <line x1="380" y1="288" x2="380" y2="280"/>
    <line x1="380" y1="210" x2="380" y2="202"/>
    <line x1="380" y1="132" x2="380" y2="124"/>
  </g>
</svg>
