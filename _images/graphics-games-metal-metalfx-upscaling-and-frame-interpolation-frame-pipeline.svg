<text x="380.0" y="130.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scaler encode</text>
<line x1="444" y1="120" x2="464" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalfx-upscaling-and-frame-interpolation-frame-pipeline)"/>
<rect x="464" y="80" width="128" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="528.0" y="116.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Post</text>
<text x="528.0" y="130.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bloom, tone map</text>
<line x1="592" y1="120" x2="612" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalfx-upscaling-and-frame-interpolation-frame-pipeline)"/>
