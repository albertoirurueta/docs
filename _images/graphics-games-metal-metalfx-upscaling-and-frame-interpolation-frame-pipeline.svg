<text x="380" y="288" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Linear HDR colour goes in, before tone mapping and before the UI.</text>
<text x="380" y="305" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Texture sampling uses a negative mip bias so textures stay sharp at the higher output resolution.</text>
