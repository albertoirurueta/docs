<text x="676.0" y="130.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">output res</text>
<rect x="20" y="200" width="468" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="254" y="225" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">render resolution</text>
<rect x="492" y="200" width="248" height="40" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
