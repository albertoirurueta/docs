<text x="84.0" y="116.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Scene pass</text>
<text x="84.0" y="130.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">jittered</text>
<line x1="148" y1="120" x2="168" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalfx-upscaling-and-frame-interpolation-frame-pipeline)"/>
<rect x="168" y="80" width="128" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.0" y="116.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Motion</text>
<text x="232.0" y="130.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vectors + depth</text>
<line x1="296" y1="120" x2="316" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalfx-upscaling-and-frame-interpolation-frame-pipeline)"/>
