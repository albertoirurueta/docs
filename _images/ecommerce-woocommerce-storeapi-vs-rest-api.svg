<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Store API compared with the REST API</title>
  <desc id="d">A comparison in six rows. The Store API at wc/store/v1 serves the shopper and storefront, needs no keys and uses a cart session or Cart-Token, exposes only the current cart and customer, writes the cart and checkout, returns render-agnostic data with per-plugin extensions, and has optional rate limiting. The REST API at wc/v3 serves back-office integrations, authenticates with keys, OAuth 1.0a or application passwords, exposes all store data allowed to the key's user, can write any resource, and has no built-in throttling.</desc>
  <rect x="0" y="0" width="980" height="500" rx="14" fill="#2b3a4a"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Two APIs, two audiences</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="46" width="130" height="40" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <rect x="160" y="46" width="390" height="40" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="355" y="62" text-anchor="middle" font-weight="bold" font-size="14">Store API</text>
    <text x="355" y="78" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">/wp-json/wc/store/v1</text>
    <rect x="570" y="46" width="390" height="40" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="765" y="62" text-anchor="middle" font-weight="bold" font-size="14">REST API</text>
    <text x="765" y="78" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">/wp-json/wc/v3</text>
    <rect x="20" y="98" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="132" font-weight="bold" font-size="13">Audience</text>
    <rect x="160" y="98" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="120">The shopper and their storefront: Cart, Checkout and Mini-</text>
    <text x="172" y="136">Cart blocks, headless front ends, apps</text>
    <rect x="570" y="98" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="120">Back-office integrations: ERP, accounting, fulfilment,</text>
    <text x="582" y="136">marketplaces, scripts, WP-CLI</text>
    <rect x="20" y="162" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="196" font-weight="bold" font-size="13">Authentication</text>
    <rect x="160" y="162" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="184">None. Cookie session, or Cart-Token. Nonce header for</text>
    <text x="172" y="200">writes</text>
    <rect x="570" y="162" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="184">Consumer key and secret (HTTPS Basic), OAuth 1.0a over</text>
    <text x="582" y="200">HTTP, or an application password</text>
    <rect x="20" y="226" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="260" font-weight="bold" font-size="13">Data scope</text>
    <rect x="160" y="226" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="248">The current cart and customer only; public catalogue data;</text>
    <text x="172" y="264">no other customers or orders</text>
    <rect x="570" y="226" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="248">Everything the key's user may do: all orders, customers,</text>
    <text x="582" y="264">products, settings</text>
    <rect x="20" y="290" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="324" font-weight="bold" font-size="13">Writes</text>
    <rect x="160" y="290" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="312">Cart, customer address, coupons, shipping rate, checkout</text>
    <text x="172" y="328">(places an order)</text>
    <rect x="570" y="290" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="312">Create, update and delete any resource, batch endpoints,</text>
    <text x="582" y="328">webhooks</text>
    <rect x="20" y="354" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="388" font-weight="bold" font-size="13">Shapes</text>
    <rect x="160" y="354" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="376">Prices in minor units as strings, render-agnostic,</text>
    <text x="172" y="392">extensions per plugin</text>
    <rect x="570" y="354" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="376">Decimal strings, metadata arrays, the versioned namespace</text>
    <text x="582" y="392">wc/v3</text>
    <rect x="20" y="418" width="130" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="34" y="452" font-weight="bold" font-size="13">Throttling</text>
    <rect x="160" y="418" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="172" y="440">Optional rate limit, off by default; checkout limit via a</text>
    <text x="172" y="456">feature setting</text>
    <rect x="570" y="418" width="390" height="56" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="582" y="440">None built in; the host, a proxy or a WAF protects it</text>
  </g>
</svg>
