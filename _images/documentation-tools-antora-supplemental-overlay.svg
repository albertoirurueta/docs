<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Supplemental UI overlaid on a UI bundle</title>
  <desc id="d">Files of the UI bundle and the supplemental files are merged by path. A file with the same path is replaced, a new path is added, and files listed in ui.yml static_files are published at the site root.</desc>
  <rect width="760" height="340" rx="14" fill="#1f2937"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#f9fafb">Supplemental files are overlaid on the bundle by path</text>

  <rect x="20" y="52" width="210" height="250" rx="10" fill="#374151" stroke="#9ca3af"/>
  <text x="125" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb">UI bundle</text>
  <rect x="36" y="90" width="178" height="30" rx="5" fill="#4b5563"/>
  <text x="48" y="110" font-size="13" fill="#f9fafb">layouts/default.hbs</text>
  <rect x="36" y="130" width="178" height="30" rx="5" fill="#4b5563"/>
  <text x="48" y="150" font-size="13" fill="#f9fafb">partials/head-meta.hbs</text>
  <rect x="36" y="170" width="178" height="30" rx="5" fill="#4b5563"/>
  <text x="48" y="190" font-size="13" fill="#f9fafb">partials/footer-content.hbs</text>
  <rect x="36" y="210" width="178" height="30" rx="5" fill="#4b5563"/>
  <text x="48" y="230" font-size="13" fill="#f9fafb">css/site.css</text>
  <rect x="36" y="250" width="178" height="30" rx="5" fill="#4b5563" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="48" y="270" font-size="13" fill="#f9fafb">ui.yml (if present)</text>

  <rect x="275" y="52" width="210" height="250" rx="10" fill="#14532d" stroke="#86efac"/>
  <text x="380" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#f0fdf4">Supplemental UI</text>
  <rect x="291" y="130" width="178" height="30" rx="5" fill="#166534"/>
  <text x="303" y="150" font-size="13" fill="#f0fdf4">partials/head-meta.hbs</text>
  <rect x="291" y="170" width="178" height="30" rx="5" fill="#166534"/>
  <text x="303" y="190" font-size="13" fill="#f0fdf4">partials/footer-content.hbs</text>
  <rect x="291" y="210" width="178" height="30" rx="5" fill="#166534"/>
  <text x="303" y="230" font-size="13" fill="#f0fdf4">robots.txt</text>
  <rect x="291" y="250" width="178" height="30" rx="5" fill="#166534"/>
  <text x="303" y="270" font-size="13" fill="#f0fdf4">ui.yml (replaces)</text>

  <rect x="530" y="52" width="210" height="250" rx="10" fill="#1e3a8a" stroke="#93c5fd"/>
  <text x="635" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#eff6ff">Result</text>
  <rect x="546" y="90" width="178" height="30" rx="5" fill="#1d4ed8"/>
  <text x="558" y="110" font-size="13" fill="#eff6ff">layouts/default.hbs</text>
  <rect x="546" y="130" width="178" height="30" rx="5" fill="#15803d"/>
  <text x="558" y="150" font-size="13" fill="#f0fdf4">head-meta.hbs (replaced)</text>
  <rect x="546" y="170" width="178" height="30" rx="5" fill="#15803d"/>
  <text x="558" y="190" font-size="13" fill="#f0fdf4">footer-content.hbs (replaced)</text>
  <rect x="546" y="210" width="178" height="30" rx="5" fill="#1d4ed8"/>
  <text x="558" y="230" font-size="13" fill="#eff6ff">_/css/site.css</text>
  <rect x="546" y="250" width="178" height="30" rx="5" fill="#15803d"/>
  <text x="558" y="270" font-size="13" fill="#f0fdf4">/robots.txt (site root)</text>

  <path d="M232 185 L273 185" stroke="#f9fafb" stroke-width="2" fill="none"/>
  <path d="M487 185 L528 185" stroke="#f9fafb" stroke-width="2" fill="none"/>
  <path d="M520 180 L528 185 L520 190 Z" fill="#f9fafb"/>
  <text x="380" y="322" text-anchor="middle" font-size="12" fill="#d1d5db">Same path: the supplemental file wins. New path: added. Listed in static_files: published at the site root.</text>
</svg>
