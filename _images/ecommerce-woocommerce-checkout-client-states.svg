<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Client-side checkout status and the events that fire between statuses</title>
  <desc id="d">A horizontal chain of five checkout statuses: idle, before_processing, processing, after_processing and complete. Under the arrows are the events and requests of each transition: the shopper presses Place Order, onCheckoutValidation observers run, payment setup runs while the payment status moves from idle to processing to ready, the POST to the Store API checkout endpoint is sent, and after the response onCheckoutSuccess or onCheckoutFail observers run before the redirect. A return path leads from before_processing and after_processing back to idle when validation or the order fails. A second row shows the payment status values idle, processing and ready that were observed during a real order.</desc>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Checkout status on the client</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Values read from wc/store/checkout (getCheckoutStatus) and wc/store/payment (getState().status) while an order was placed</text>
  <rect x="40" y="92" width="144" height="54" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="112.0" y="123.5" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">idle</text>
  <rect x="224" y="92" width="144" height="54" rx="6" fill="#3d5266"/>
  <text x="296.0" y="123.5" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">before_processing</text>
  <rect x="408" y="92" width="144" height="54" rx="6" fill="#3d5266"/>
  <text x="480.0" y="123.5" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">processing</text>
  <rect x="592" y="92" width="144" height="54" rx="6" fill="#3d5266"/>
  <text x="664.0" y="123.5" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">after_processing</text>
  <rect x="776" y="92" width="144" height="54" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="848.0" y="123.5" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">complete</text>
  <path d="M184 119 L224 119" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M368 119 L408 119" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M552 119 L592 119" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M736 119 L776 119" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="116" y="164" width="176" height="56" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.2"/>
  <text x="204" y="186" font-size="11.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Place order</text>
  <text x="204" y="205" font-size="11" fill="#f2f5f8" text-anchor="middle">button clicked</text>
  <rect x="300" y="164" width="176" height="56" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.2"/>
  <text x="388" y="186" font-size="11.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">onCheckoutValidation</text>
  <text x="388" y="205" font-size="11" fill="#f2f5f8" text-anchor="middle">all observers run</text>
  <rect x="484" y="164" width="176" height="56" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.2"/>
  <text x="572" y="186" font-size="11.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">POST /checkout</text>
  <text x="572" y="205" font-size="11" fill="#f2f5f8" text-anchor="middle">Store API, when payment is ready</text>
  <rect x="668" y="164" width="176" height="56" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.2"/>
  <text x="756" y="186" font-size="11.5" font-weight="bold" fill="#9fd3c7" text-anchor="middle">onCheckoutSuccess or</text>
  <text x="756" y="205" font-size="11" fill="#f2f5f8" text-anchor="middle">onCheckoutFail observers</text>
  <path d="M296 92 L296 76 L112 76 L112 92" stroke="#9fd3c7" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="204" y="70" font-size="11" fill="#9fd3c7" text-anchor="middle">validation error: back to idle</text>
  <path d="M664 146 L664 240 L100 240 L100 146" stroke="#9fd3c7" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="388" y="258" font-size="11" fill="#9fd3c7" text-anchor="middle">response with an error or a failure: back to idle, the shopper can retry</text>
  <text x="40" y="300" font-size="13" font-weight="bold" fill="#f4b860">Payment status observed during the same order</text>
  <rect x="40" y="314" width="144" height="44" rx="6" fill="#33485c"/>
  <text x="112.0" y="340.5" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">idle</text>
  <rect x="224" y="314" width="144" height="44" rx="6" fill="#33485c"/>
  <text x="296.0" y="340.5" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">processing</text>
  <rect x="408" y="314" width="144" height="44" rx="6" fill="#33485c"/>
  <text x="480.0" y="340.5" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ready</text>
  <path d="M184 336 L222 336" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M368 336 L406 336" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="560" y="330" font-size="12" fill="#f2f5f8">onPaymentSetup observers run while the status is processing;</text>
  <text x="560" y="348" font-size="12" fill="#f2f5f8">they can return paymentMethodData or an error.</text>
  <rect x="40" y="384" width="880" height="140" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="408" font-size="12.5" font-weight="bold" fill="#f4b860">Recorded sequence (subscribe on wp.data, one real order):</text>
  <text x="56" y="430" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">checkout=before_processing payment=idle</text>
  <text x="56" y="448" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">checkout=processing payment=idle</text>
  <text x="56" y="466" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">checkout=processing payment=processing</text>
  <text x="56" y="484" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">checkout=processing payment=ready</text>
  <text x="56" y="502" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#f2f5f8">POST /checkout   -&gt;  checkout=after_processing  -&gt;  checkout=complete  -&gt;  redirect</text>
</svg>
