<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: package the Bookshelf for Windows</text>
<rect x="14" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="30" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="81.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Project Settings &gt;</text>
<text x="81.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">Maps and Modes:</text>
<text x="81.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">Game Default Map</text>
<text x="81.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">= L_Library</text>
<text x="81.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Default map</text>
<line x1="149" y1="140" x2="159" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="176" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="176" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Packaging section:</text>
<text x="227.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">Build Configuration,</text>
<text x="227.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">Use Pak File,</text>
<text x="227.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">Use Io Store</text>
<text x="227.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Check settings</text>
<line x1="295" y1="140" x2="305" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="306" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="322" cy="76" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="322" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="373.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Platforms &gt;</text>
<text x="373.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">Windows &gt; Content</text>
<text x="373.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">Management &gt;</text>
<text x="373.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">Package Project</text>
<text x="373.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Package</text>
<line x1="441" y1="140" x2="451" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="452" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="468" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="468" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="519.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Choose or create</text>
<text x="519.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">the staging</text>
<text x="519.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">directory and</text>
<text x="519.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">select the folder</text>
<text x="519.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Pick a folder</text>
<line x1="587" y1="140" x2="597" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="598" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="614" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="614" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="665.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Open the folder,</text>
<text x="665.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">start Bookshelf.exe;</text>
<text x="665.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">the map loads in</text>
<text x="665.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">a window</text>
<text x="665.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Run it</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#374151">Without a Game Default Map the packaged game shows a black screen; the project templates set it.</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="#374151">The log of the run is under Show Output Log, and errors are listed under Packaging Results.</text>
</svg>
