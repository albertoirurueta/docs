<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three delivery semantics, side by side</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">P = producer -- B = broker -- C = consumer -- each panel marks where its failure happens and what it costs</text>

  <!-- Panel 1: At-most-once -->
  <rect x="26" y="66" width="224" height="360" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="138" y="90" font-size="13" font-weight="bold" fill="#a33333" text-anchor="middle">At-most-once</text>
  <text x="138" y="106" font-size="9.5" fill="#333333" text-anchor="middle">producer: fire-and-forget</text>
  <text x="138" y="119" font-size="9.5" fill="#333333" text-anchor="middle">consumer: acks before processing</text>

  <circle cx="138" cy="150" r="14" fill="#ffffff" stroke="#a33333" stroke-width="1.3"/>
  <text x="138" y="154" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">P</text>
  <line x1="138" y1="164" x2="138" y2="196" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="182" font-size="8.5" fill="#555555">send</text>

  <circle cx="138" cy="210" r="14" fill="#ffffff" stroke="#a33333" stroke-width="1.3"/>
  <text x="138" y="214" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">B</text>
  <line x1="138" y1="224" x2="138" y2="256" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="242" font-size="8.5" fill="#555555">deliver</text>

  <circle cx="138" cy="270" r="14" fill="#ffffff" stroke="#a33333" stroke-width="1.3"/>
  <text x="138" y="274" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">C</text>

  <text x="138" y="296" font-size="9" fill="#333333" text-anchor="middle">ack sent immediately,</text>
  <text x="138" y="309" font-size="9" fill="#333333" text-anchor="middle">then crash mid-processing</text>

  <line x1="128" y1="328" x2="148" y2="348" stroke="#a33333" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="148" y1="328" x2="128" y2="348" stroke="#a33333" stroke-width="2.6" stroke-linecap="round"/>

  <text x="138" y="368" font-size="9.5" font-weight="bold" fill="#a33333" text-anchor="middle">message lost</text>
  <text x="138" y="382" font-size="8.5" fill="#666666" text-anchor="middle">already acked, so it is</text>
  <text x="138" y="394" font-size="8.5" fill="#666666" text-anchor="middle">never retried or redelivered</text>

  <!-- Panel 2: At-least-once -->
  <rect x="268" y="66" width="224" height="360" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="380" y="90" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">At-least-once</text>
  <text x="380" y="106" font-size="9.5" fill="#333333" text-anchor="middle">producer: retries on ambiguous failure</text>
  <text x="380" y="119" font-size="9.5" fill="#333333" text-anchor="middle">consumer: acks after processing</text>

  <circle cx="380" cy="150" r="14" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="380" y="154" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">P</text>
  <line x1="380" y1="164" x2="380" y2="196" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="392" y="182" font-size="8.5" fill="#555555">send, retry</text>

  <circle cx="380" cy="210" r="14" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="380" y="214" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">B</text>
  <line x1="380" y1="224" x2="380" y2="256" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="392" y="242" font-size="8.5" fill="#555555">deliver</text>

  <circle cx="380" cy="270" r="14" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="380" y="274" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">C</text>

  <text x="380" y="296" font-size="9" fill="#333333" text-anchor="middle">processing finishes,</text>
  <text x="380" y="309" font-size="9" fill="#333333" text-anchor="middle">then crash before the ack</text>

  <rect x="364" y="326" width="18" height="14" rx="2" fill="none" stroke="#8a5a1c" stroke-width="1.6"/>
  <rect x="372" y="334" width="18" height="14" rx="2" fill="none" stroke="#8a5a1c" stroke-width="1.6"/>

  <text x="380" y="368" font-size="9.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">redelivered</text>
  <text x="380" y="382" font-size="8.5" fill="#666666" text-anchor="middle">side effect re-applied</text>
  <text x="380" y="394" font-size="8.5" fill="#666666" text-anchor="middle">unless the consumer is idempotent</text>

  <!-- Panel 3: Effectively-once -->
  <rect x="510" y="66" width="224" height="360" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="622" y="90" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Effectively-once</text>
  <text x="622" y="106" font-size="9.5" fill="#333333" text-anchor="middle">idempotent producer / transactions</text>
  <text x="622" y="119" font-size="9.5" fill="#333333" text-anchor="middle">+ idempotent consumer</text>

  <circle cx="622" cy="150" r="14" fill="#ffffff" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="622" y="154" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">P</text>
  <line x1="622" y1="164" x2="622" y2="196" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="634" y="182" font-size="8.5" fill="#555555">dedup id</text>

  <circle cx="622" cy="210" r="14" fill="#ffffff" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="622" y="214" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">B</text>
  <line x1="622" y1="224" x2="622" y2="256" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="634" y="242" font-size="8.5" fill="#555555">(re)deliver</text>

  <circle cx="622" cy="270" r="14" fill="#ffffff" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="622" y="274" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">C</text>

  <text x="622" y="296" font-size="9" fill="#333333" text-anchor="middle">checks dedup store, or the</text>
  <text x="622" y="309" font-size="9" fill="#333333" text-anchor="middle">operation is itself idempotent</text>

  <polyline points="611,332 619,341 634,323" fill="none" stroke="#2d6a34" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="622" y="368" font-size="9.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">duplicate suppressed</text>
  <text x="622" y="382" font-size="8.5" fill="#666666" text-anchor="middle">net effect applied once --</text>
  <text x="622" y="394" font-size="8.5" fill="#666666" text-anchor="middle">true end-to-end exactly-once</text>
  <text x="622" y="406" font-size="8.5" fill="#666666" text-anchor="middle">is not generally achievable</text>

  <!-- footnote -->
  <rect x="26" y="440" width="708" height="46" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="459" font-size="9.5" fill="#666666" text-anchor="middle">All three panels assume the broker itself never loses an already-committed/confirmed message -- that</text>
  <text x="380" y="473" font-size="9.5" fill="#666666" text-anchor="middle">durability-against-broker-failure guarantee is the separate replication-vs-fsync axis covered above</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
</svg>
