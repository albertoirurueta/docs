<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-animation-system-skinning-morph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to deform a mesh</text>
<rect x="30" y="50" width="340" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="72.5" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Skinning: SkinnedMesh + Skeleton</text>
<rect x="390" y="50" width="340" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="72.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Morph targets: morphTargetInfluences</text>
<rect x="80" y="120" width="30" height="120" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<polygon points="95,240 110,240 150,300 70,300" fill="none"/>
<circle cx="95" cy="240" r="7" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<line x1="95" y1="240" x2="190" y2="285" stroke="#4F46E5" stroke-width="3"/>
<line x1="95" y1="240" x2="95" y2="130" stroke="#4F46E5" stroke-width="3"/>
<circle cx="190" cy="285" r="7" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="95" cy="130" r="7" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="215" y="150" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">vertex = sum of</text>
<text x="215" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">weight_i * boneMatrix_i</text>
<text x="215" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">4 bone indices and</text>
<text x="215" y="206" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">4 weights per vertex</text>
<text x="215" y="230" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">(skinIndex, skinWeight)</text>
<text x="200" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tracks target bone nodes: Armature.bones.quaternion</text>
<rect x="420" y="120" width="70" height="70" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<polygon points="520,190 550,120 590,190" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<rect x="620" y="110" width="80" height="80" rx="30" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="455" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">base</text>
<text x="555" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">target A</text>
<text x="660" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">target B</text>
<rect x="420" y="240" width="280" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="261.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position = base + sum( influence_i * ( target_i - base ) )</text>
<text x="560.0" y="275.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">influences usually in the range 0 to 1</text>
<text x="560" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tracks target the influences: Mesh.morphTargetInfluences[2]</text>
</svg>
