<svg viewBox="0 0 740 340" width="740" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="340" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Anatomy of a Conditional action on the Remove button</text>
<rect x="20" y="48" width="400" height="272" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="36" y="64" width="368" height="26" rx="6" fill="#E5E7EB"/><text x="48" y="82" font-size="12" font-weight="bold" fill="#374151">Interaction: On tap</text>
<rect x="36" y="100" width="368" height="26" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="48" y="118" font-size="12" fill="#3730A3">Action: Conditional</text>
<rect x="36" y="136" width="368" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="48" y="156" font-size="12" fill="#374151">If   cartCount &gt; 0</text>
<rect x="52" y="174" width="352" height="46" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="64" y="192" font-size="12" fill="#374151">Set variable: cartCount = cartCount - 1</text><text x="64" y="210" font-size="12" fill="#374151">Set variable: badgeText = cartCount + " books"</text>
<rect x="36" y="230" width="368" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="48" y="250" font-size="12" fill="#374151">Else</text>
<rect x="52" y="268" width="352" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="64" y="291" font-size="12" fill="#374151">(left blank: nothing happens at zero)</text>
<g>
<circle cx="20" cy="113" r="11" fill="#4F46E5"/><text x="20" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="20" cy="151" r="11" fill="#B45309"/><text x="20" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<circle cx="52" cy="197" r="11" fill="#4F46E5"/><text x="52" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<circle cx="20" cy="245" r="11" fill="#4F46E5"/><text x="20" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
</g>
<g font-size="12" fill="#374151">
<text x="450" y="84" font-size="14" font-weight="bold" fill="#3730A3">Reading the figure</text>
<text x="450" y="112">1  Pick Conditional in the Action list.</text>
<text x="450" y="140">2  The If field takes a boolean</text><text x="450" y="157">    expression; red outline = invalid.</text>
<text x="450" y="185">3  Actions under If run when it is true.</text>
<text x="450" y="213">4  Else actions run when it is false;</text><text x="450" y="230">    Else may stay empty.</text>
<text x="450" y="268">Guard: the count never goes below zero.</text>
</g>
</svg>
