<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Pyramid production topology: client, reverse proxy, WSGI server with workers, database, production.ini and environment</title>
  <defs>
    <marker id="ppt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where a request travels in production</text>

  <!-- client -->
  <rect x="20" y="150" width="100" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="70" y="181" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Client</text>
  <text x="70" y="199" font-size="11" fill="currentColor" text-anchor="middle">browser or API</text>

  <!-- reverse proxy -->
  <rect x="180" y="100" width="150" height="150" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="255" y="124" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Reverse proxy</text>
  <text x="255" y="141" font-size="11" fill="currentColor" text-anchor="middle">nginx or Apache httpd</text>
  <text x="255" y="166" font-size="11" fill="currentColor" text-anchor="middle">TLS termination</text>
  <text x="255" y="182" font-size="11" fill="currentColor" text-anchor="middle">buffers slow clients</text>
  <text x="255" y="198" font-size="11" fill="currentColor" text-anchor="middle">sets Host, X-Forwarded-*</text>
  <text x="255" y="214" font-size="11" fill="currentColor" text-anchor="middle">size and time limits</text>
  <text x="255" y="236" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">location /static/</text>

  <!-- static files -->
  <rect x="180" y="310" width="150" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="255" y="332" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Static files on disk</text>
  <text x="255" y="349" font-size="11" fill="currentColor" text-anchor="middle">served without Python</text>
  <line x1="255" y1="250" x2="255" y2="308" stroke="currentColor" stroke-width="1.5" marker-end="url(#ppt-arrow)"/>

  <!-- wsgi server -->
  <rect x="400" y="70" width="170" height="230" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="485" y="92" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">WSGI server</text>
  <text x="485" y="108" font-size="11" fill="currentColor" text-anchor="middle">Gunicorn, Waitress or uWSGI</text>
  <rect x="416" y="122" width="138" height="48" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="485" y="141" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker 1</text>
  <text x="485" y="157" font-size="10" fill="currentColor" text-anchor="middle">Pyramid app, own pool</text>
  <rect x="416" y="178" width="138" height="48" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="485" y="197" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker 2</text>
  <text x="485" y="213" font-size="10" fill="currentColor" text-anchor="middle">Pyramid app, own pool</text>
  <rect x="416" y="234" width="138" height="48" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="485" y="253" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker N</text>
  <text x="485" y="269" font-size="10" fill="currentColor" text-anchor="middle">Pyramid app, own pool</text>

  <!-- database -->
  <rect x="620" y="140" width="85" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="662" y="171" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Database</text>
  <text x="662" y="189" font-size="11" fill="currentColor" text-anchor="middle">PostgreSQL</text>

  <!-- config -->
  <rect x="400" y="340" width="170" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="485" y="362" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">production.ini</text>
  <text x="485" y="380" font-size="11" fill="currentColor" text-anchor="middle">structure, no secrets</text>
  <text x="485" y="397" font-size="11" fill="currentColor" text-anchor="middle">+ environment variables</text>
  <line x1="485" y1="340" x2="485" y2="302" stroke="currentColor" stroke-width="1.5" marker-end="url(#ppt-arrow)"/>

  <!-- arrows -->
  <line x1="120" y1="185" x2="178" y2="185" stroke="currentColor" stroke-width="1.5" marker-end="url(#ppt-arrow)"/>
  <text x="149" y="176" font-size="10" fill="currentColor" text-anchor="middle">HTTPS</text>
  <line x1="330" y1="185" x2="398" y2="185" stroke="currentColor" stroke-width="1.5" marker-end="url(#ppt-arrow)"/>
  <text x="364" y="176" font-size="10" fill="currentColor" text-anchor="middle">HTTP</text>
  <line x1="570" y1="175" x2="618" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#ppt-arrow)"/>

  <text x="360" y="428" font-size="11" fill="currentColor" text-anchor="middle">Only the proxy is reachable from outside; the WSGI server listens on loopback, a socket or a private network.</text>
</svg>
