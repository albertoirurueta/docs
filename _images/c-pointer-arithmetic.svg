<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Pointer arithmetic over an array of five ints: p points at element 0, p + 2 points at element 2 because arithmetic moves in units of sizeof(int), and values + 5 is the one-past-the-end pointer that may be compared but never dereferenced.</title>
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <text x="390.0" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Pointer arithmetic moves in elements, not bytes</text>
  <text x="390.0" y="45" font-size="11" fill="#666666" text-anchor="middle">int values[5]; int *p = values;  &#8212;  p + 2 advances by 2 * sizeof(int), so p[2] is *(p + 2).</text>
  <rect x="90" y="120" width="68" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="124" y="152" font-size="14" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">10</text>
  <text x="124" y="110" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">values[0]</text>
  <text x="124" y="188" font-size="9" fill="#888888" text-anchor="middle">offset 0</text>
  <rect x="158" y="120" width="68" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="192" y="152" font-size="14" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">20</text>
  <text x="192" y="110" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">values[1]</text>
  <text x="192" y="188" font-size="9" fill="#888888" text-anchor="middle">offset 4</text>
  <rect x="226" y="120" width="68" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="260" y="152" font-size="14" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">30</text>
  <text x="260" y="110" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">values[2]</text>
  <text x="260" y="188" font-size="9" fill="#888888" text-anchor="middle">offset 8</text>
  <rect x="294" y="120" width="68" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="328" y="152" font-size="14" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">40</text>
  <text x="328" y="110" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">values[3]</text>
  <text x="328" y="188" font-size="9" fill="#888888" text-anchor="middle">offset 12</text>
  <rect x="362" y="120" width="68" height="52" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="396" y="152" font-size="14" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">50</text>
  <text x="396" y="110" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">values[4]</text>
  <text x="396" y="188" font-size="9" fill="#888888" text-anchor="middle">offset 16</text>
  <rect x="430" y="120" width="68" height="52" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="464" y="146" font-size="10" fill="#6a1f1f" text-anchor="middle">one past</text>
  <text x="464" y="160" font-size="10" fill="#6a1f1f" text-anchor="middle">the end</text>
  <text x="464" y="110" font-size="10" fill="#a04a4a" text-anchor="middle" font-family="'Courier New', monospace">values + 5</text>
  <line x1="124" y1="208" x2="124" y2="178" stroke="#2f5424" stroke-width="1.6"/>
  <polygon points="119,178 129,178 124,170" fill="#2f5424"/>
  <rect x="72" y="208" width="104" height="26" fill="#ffffff" stroke="#2f5424" stroke-width="1.3" rx="4"/>
  <text x="124" y="225" font-size="11" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">p</text>
  <line x1="260" y1="264" x2="260" y2="178" stroke="#1f3a52" stroke-width="1.6"/>
  <polygon points="255,178 265,178 260,170" fill="#1f3a52"/>
  <rect x="208" y="264" width="104" height="26" fill="#ffffff" stroke="#1f3a52" stroke-width="1.3" rx="4"/>
  <text x="260" y="281" font-size="11" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">p + 2</text>
  <line x1="464" y1="320" x2="464" y2="178" stroke="#6a1f1f" stroke-width="1.6"/>
  <polygon points="459,178 469,178 464,170" fill="#6a1f1f"/>
  <rect x="412" y="320" width="104" height="26" fill="#ffffff" stroke="#6a1f1f" stroke-width="1.3" rx="4"/>
  <text x="464" y="337" font-size="11" fill="#6a1f1f" text-anchor="middle" font-family="'Courier New', monospace">end</text>
  <line x1="260" y1="312" x2="464" y2="312" stroke="#7a4a8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="362" y="306" font-size="10" fill="#4a2352" text-anchor="middle" font-family="'Courier New', monospace">end - (p + 2) == 3  (ptrdiff_t)</text>
  <rect x="24" y="330" width="732" height="56" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="5"/>
  <text x="390" y="349" font-size="11" font-weight="bold" fill="#5c4a14" text-anchor="middle">The two rules that keep this defined</text>
  <text x="390" y="367" font-size="9.5" fill="#444444" text-anchor="middle">Pointers may only be compared or subtracted within one array (or one past its end); computing values + 5 is legal,</text>
  <text x="390" y="380" font-size="9.5" fill="#444444" text-anchor="middle">dereferencing it is undefined behavior. That is exactly why the idiomatic loop tests it != values + 5 instead of reading it.</text>
</svg>
