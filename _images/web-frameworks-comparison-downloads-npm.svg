<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-labelledby="web-downloads-npm-t web-downloads-npm-d">
<title id="web-downloads-npm-t">npm downloads, 12 months to 2026-06</title>
