<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How wp wc commands reach WooCommerce</title>
  <desc id="d">A shell command such as wp wc product list with the user flag starts WP-CLI, which loads WordPress and the plugins. WC_CLI_Runner reads the wc/v2 routes registered in the same process and registers one WP-CLI command per route that has a schema, skipping batch routes and the settings, system_status and reports routes. When a command runs, WC_CLI_REST_Command builds a WP_REST_Request and dispatches it in the process with rest_do_request as the user given by the user flag. The wc/v2 controller, extra fields added with register_rest_field, the CRUD objects, the data stores and the database do the work, and the result is printed as a table, JSON, CSV, YAML, ids or a count. A second group of commands is written by hand and does not use REST: hpos, cot, blueprint, palt, tool, update, tracker and com. A note says that no HTTP request, API key or OAuth signature is involved and that a 401 means the user flag is missing.</desc>
  <rect x="0" y="0" width="980" height="540" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">wp wc: the REST controllers, called in-process</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="52" width="270" height="110" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="74" font-weight="bold" font-size="14">1 Shell</text>
    <text x="32" y="96" font-family="Menlo, Consolas, monospace" font-size="11">wp wc product list \</text>
    <text x="32" y="112" font-family="Menlo, Consolas, monospace" font-size="11">  --sku=PC-KIT --user=admin</text>
    <text x="32" y="136">WP-CLI loads WordPress and the</text>
    <text x="32" y="152">active plugins (after_wp_load)</text>

    <rect x="355" y="52" width="270" height="110" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="367" y="74" font-weight="bold" font-size="14">2 WC_CLI_Runner</text>
    <text x="367" y="96">reads the wc/v2 routes of the</text>
    <text x="367" y="112">REST server in the process, one</text>
    <text x="367" y="128">command per route with a schema</text>
    <text x="367" y="148" font-size="11">skips batch, settings, system_status, reports</text>

    <rect x="690" y="52" width="270" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="702" y="74" font-weight="bold" font-size="14">3 WC_CLI_REST_Command</text>
    <text x="702" y="96">list, get, create, update, delete</text>
    <text x="702" y="112">builds a WP_REST_Request and</text>
    <text x="702" y="128" font-family="Menlo, Consolas, monospace" font-size="11">rest_do_request()</text>
    <text x="702" y="148">as the --user account</text>

    <rect x="690" y="215" width="270" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="702" y="237" font-weight="bold" font-size="14">4 wc/v2 controller</text>
    <text x="702" y="259">schema, permissions, extra fields</text>
    <text x="702" y="275">from register_rest_field,</text>
    <text x="702" y="291">hooks such as</text>
    <text x="702" y="307" font-size="11" font-family="Menlo, Consolas, monospace">woocommerce_rest_insert_product_object</text>

    <rect x="355" y="215" width="270" height="110" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="367" y="237" font-weight="bold" font-size="14">5 CRUD objects and data stores</text>
    <text x="367" y="259">WC_Product, WC_Order, ...</text>
    <text x="367" y="275">orders use the HPOS tables when</text>
    <text x="367" y="291">HPOS is authoritative, then the</text>
    <text x="367" y="307">database</text>

    <rect x="20" y="215" width="270" height="110" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="237" font-weight="bold" font-size="14">6 Output</text>
    <text x="32" y="259">--format table, json, csv, yaml,</text>
    <text x="32" y="275">ids, count, headers, body, envelope</text>
    <text x="32" y="291">--fields and --field pick columns,</text>
    <text x="32" y="307">--porcelain prints only the id</text>

    <rect x="20" y="350" width="470" height="170" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="32" y="374" font-weight="bold" font-size="14">Commands that are not REST-derived</text>
    <text x="32" y="396" font-family="Menlo, Consolas, monospace" font-size="11">wp wc hpos</text>
    <text x="200" y="396">HPOS status, sync, diff, cleanup</text>
    <text x="32" y="416" font-family="Menlo, Consolas, monospace" font-size="11">wp wc blueprint</text>
    <text x="200" y="416">export and import store settings</text>
    <text x="32" y="436" font-family="Menlo, Consolas, monospace" font-size="11">wp wc palt</text>
    <text x="200" y="436">product attributes lookup table</text>
    <text x="32" y="456" font-family="Menlo, Consolas, monospace" font-size="11">wp wc tool, update</text>
    <text x="200" y="456">maintenance tools, database updates</text>
    <text x="32" y="476" font-family="Menlo, Consolas, monospace" font-size="11">wp wc tracker, com, cot</text>
    <text x="200" y="476">usage snapshot, Woo.com, old HPOS alias</text>
    <text x="32" y="504" font-size="11">written in PHP for WP-CLI; they do not need a REST route</text>

    <rect x="510" y="350" width="450" height="170" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="522" y="374" font-weight="bold" font-size="14">What this means in practice</text>
    <text x="522" y="396">no HTTP request, no key, no OAuth signature</text>
    <text x="522" y="416">the --user flag is the only identity: without it</text>
    <text x="522" y="432">the command stops with the 401 hint</text>
    <text x="522" y="452">fields and flags follow wc/v2, not wc/v3</text>
    <text x="522" y="472">(in_stock, not stock_status)</text>
    <text x="522" y="492">pass JSON for lists and objects:</text>
    <text x="522" y="508" font-family="Menlo, Consolas, monospace" font-size="11">--categories='[{"id":25}]'</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M290 107 H 353"/>
    <path d="M625 107 H 688"/>
    <path d="M825 162 V 213"/>
    <path d="M690 270 H 627"/>
    <path d="M355 270 H 292"/>
  </g>
</svg>
