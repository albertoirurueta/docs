<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A custom API docs converter running before DocFX</title>
<desc id="d">Python source files are read by a converter script, which writes API Page YAML files and a toc.yml into an api folder. DocFX build takes those files as content and renders HTML pages in the site folder. The docfx metadata command plays the same role for .NET.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f9fafb"/></marker>
</defs>
<rect width="760" height="330" rx="12" fill="#1f2937"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#f9fafb">The converter runs before docfx build</text>
<rect x="20" y="80" width="170" height="90" rx="8" fill="#374151"/>
<text x="105" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb">Source code</text>
<text x="105" y="130" text-anchor="middle" font-size="12" fill="#f9fafb" font-family="Courier New, monospace">converter.py</text>
<text x="105" y="150" text-anchor="middle" font-size="12" fill="#f9fafb">docstrings</text>
<rect x="215" y="80" width="170" height="90" rx="8" fill="#1e40af"/>
<text x="300" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb">API docs converter</text>
<text x="300" y="130" text-anchor="middle" font-size="12" fill="#f9fafb" font-family="Courier New, monospace">py2apipage.py</text>
<text x="300" y="150" text-anchor="middle" font-size="12" fill="#f9fafb">your own tool</text>
<rect x="410" y="80" width="170" height="90" rx="8" fill="#166534"/>
<text x="495" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb">api folder</text>
<text x="495" y="130" text-anchor="middle" font-size="12" fill="#f9fafb" font-family="Courier New, monospace">toc.yml</text>
<text x="495" y="150" text-anchor="middle" font-size="12" fill="#f9fafb" font-family="Courier New, monospace">*.yml (ApiPage)</text>
<rect x="605" y="80" width="140" height="90" rx="8" fill="#374151"/>
<text x="675" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb">docfx build</text>
<text x="675" y="130" text-anchor="middle" font-size="12" fill="#f9fafb">modern template</text>
<text x="675" y="150" text-anchor="middle" font-size="12" fill="#f9fafb" font-family="Courier New, monospace">_site/api/*.html</text>
<line x1="190" y1="125" x2="213" y2="125" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="385" y1="125" x2="408" y2="125" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="580" y1="125" x2="603" y2="125" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<rect x="215" y="220" width="365" height="70" rx="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
<text x="397" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#fbbf24">For .NET this role is played by docfx metadata</text>
<text x="397" y="270" text-anchor="middle" font-size="12" fill="#f9fafb">same contract: write YAML and a toc.yml, then build</text>
<line x1="397" y1="220" x2="397" y2="172" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
