<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="22" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One /select request: handler, search components, query parser</text>
  <text x="380" y="40" font-size="12" fill="#666666" text-anchor="middle">path -&gt; request handler -&gt; ordered search-component chain -&gt; query parser -&gt; Lucene -&gt; response writer</text>

  <defs>
    <marker id="rp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="rp-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Client request -->
  <rect x="150" y="52" width="460" height="32" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="72" font-size="11.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">GET /solr/books/select?q=title:darkness&amp;defType=edismax&amp;wt=json</text>

  <line x1="380" y1="84" x2="380" y2="100" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rp-arrow)"/>

  <!-- Request handler -->
  <rect x="140" y="100" width="480" height="46" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="120" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Request Handler &#8212; SearchHandler registered at /select</text>
  <text x="380" y="137" font-size="10.5" fill="#444444" text-anchor="middle">matches the path, merges defaults / appends / invariants from solrconfig.xml</text>

  <line x1="380" y1="146" x2="380" y2="164" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rp-arrow)"/>

  <!-- Search components row -->
  <text x="380" y="176" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Search Components &#8212; run in order, each contributing to the response</text>

  <!-- 1 query (highlighted) -->
  <rect x="60" y="184" width="120" height="54" rx="5" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="120" y="205" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. query</text>
  <text x="120" y="222" font-size="9.5" fill="#444444" text-anchor="middle">runs the query parser</text>

  <!-- 2 facet -->
  <rect x="190" y="184" width="120" height="54" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="250" y="205" font-size="12" fill="#333333" text-anchor="middle">2. facet</text>
  <text x="250" y="222" font-size="9.5" fill="#666666" text-anchor="middle">facet counts</text>

  <!-- 3 highlight -->
  <rect x="320" y="184" width="120" height="54" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="205" font-size="12" fill="#333333" text-anchor="middle">3. highlight</text>
  <text x="380" y="222" font-size="9.5" fill="#666666" text-anchor="middle">snippet highlighting</text>

  <!-- 4 stats -->
  <rect x="450" y="184" width="120" height="54" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="510" y="205" font-size="12" fill="#333333" text-anchor="middle">4. stats</text>
  <text x="510" y="222" font-size="9.5" fill="#666666" text-anchor="middle">field statistics</text>

  <!-- 5 debug -->
  <rect x="580" y="184" width="120" height="54" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="640" y="205" font-size="12" fill="#333333" text-anchor="middle">5. debug</text>
  <text x="640" y="222" font-size="9.5" fill="#666666" text-anchor="middle">explain / timing</text>

  <!-- chain arrows -->
  <line x1="180" y1="211" x2="188" y2="211" stroke="#999999" stroke-width="1.4" marker-end="url(#rp-arrow-grey)"/>
  <line x1="310" y1="211" x2="318" y2="211" stroke="#999999" stroke-width="1.4" marker-end="url(#rp-arrow-grey)"/>
  <line x1="440" y1="211" x2="448" y2="211" stroke="#999999" stroke-width="1.4" marker-end="url(#rp-arrow-grey)"/>
  <line x1="570" y1="211" x2="578" y2="211" stroke="#999999" stroke-width="1.4" marker-end="url(#rp-arrow-grey)"/>

  <line x1="120" y1="238" x2="120" y2="252" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="120" y1="252" x2="330" y2="252" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="330" y1="252" x2="330" y2="262" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rp-arrow)"/>

  <!-- Query parser -->
  <rect x="180" y="262" width="400" height="46" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="282" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Query Parser &#8212; lucene &#183; dismax &#183; edismax</text>
  <text x="380" y="299" font-size="10.5" fill="#444444" text-anchor="middle">chosen by defType or a per-clause {!type=...} local param; parses q into a Lucene Query</text>

  <line x1="380" y1="308" x2="380" y2="326" stroke="#2f5424" stroke-width="1.8" marker-end="url(#rp-arrow)"/>

  <!-- Lucene index -->
  <rect x="230" y="326" width="300" height="38" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="380" y="350" font-size="12" fill="#333333" text-anchor="middle">Lucene index &#8212; segments, inverted index, postings lists</text>

  <line x1="380" y1="364" x2="380" y2="380" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rp-arrow)"/>

  <!-- Response writer -->
  <rect x="150" y="380" width="460" height="34" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="401" font-size="12" fill="#333333" text-anchor="middle">Response Writer &#8212; wt=json (default) &#183; xml &#183; csv &#8594; back to the client</text>

</svg>
