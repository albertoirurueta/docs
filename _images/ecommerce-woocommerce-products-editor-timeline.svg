<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Product editor and variation gallery changes from 10.8 to 11.2</title>
  <desc id="d">A timeline of five WooCommerce releases. 10.9.0 on 2026-06-23 deprecated the product block editor and its extension APIs and added native variation galleries. 11.0.0 on 2026-08-04 removed the block editor, its package, routes, assets and extension APIs and left a shim that logs a warning; product object caching became the default for new stores. 11.1.0 on 2026-09-03 retired the legacy feature flags for the product editor. 11.2.0 on 2026-10-07 fixed variation gallery storage and rendering.</desc>
  <rect x="0" y="0" width="960" height="566" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">The classic editor stays; the block editor is gone</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Releases from the WooCommerce changelog, with the product-related changes of each</text>
  <rect x="60" y="270" width="840" height="6" rx="3" fill="#6f8aa3"/>
  <rect x="113" y="266" width="14" height="14" rx="7" fill="#f4b860"/>
  <text x="120" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#f2f5f8">10.8.0</text>
  <text x="120" y="318" font-size="11" text-anchor="middle" fill="#9fd3c7">2026-05-26</text>
  <rect x="303" y="266" width="14" height="14" rx="7" fill="#f4b860"/>
  <text x="310" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#f2f5f8">10.9.0</text>
  <text x="310" y="318" font-size="11" text-anchor="middle" fill="#9fd3c7">2026-06-23</text>
  <rect x="493" y="266" width="14" height="14" rx="7" fill="#f4b860"/>
  <text x="500" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#f2f5f8">11.0.0</text>
  <text x="500" y="318" font-size="11" text-anchor="middle" fill="#9fd3c7">2026-08-04</text>
  <rect x="683" y="266" width="14" height="14" rx="7" fill="#f4b860"/>
  <text x="690" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#f2f5f8">11.1.0</text>
  <text x="690" y="318" font-size="11" text-anchor="middle" fill="#9fd3c7">2026-09-03</text>
  <rect x="853" y="266" width="14" height="14" rx="7" fill="#f4b860"/>
  <text x="860" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#f2f5f8">11.2.1</text>
  <text x="860" y="318" font-size="11" text-anchor="middle" fill="#9fd3c7">2026-10-09</text>
  <rect x="185.0" y="86" width="250" height="128" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.6"/>
  <text x="195.0" y="110" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Product editor v2 deprecated,</text>
  <text x="195.0" y="128" font-size="11.5" text-anchor="start" fill="#f2f5f8">removal notices added</text>
  <text x="195.0" y="146" font-size="11.5" text-anchor="start" fill="#f2f5f8">Native variation gallery:</text>
  <text x="195.0" y="164" font-size="11.5" text-anchor="start" fill="#f2f5f8">gallery_image_ids in REST</text>
  <text x="195.0" y="182" font-size="11.5" text-anchor="start" fill="#f2f5f8">Variations tab redesign behind</text>
  <text x="195.0" y="200" font-size="11.5" text-anchor="start" fill="#f2f5f8">a flag (off by default)</text>
  <path d="M310 214 L310 262" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="585.0" y="86" width="210" height="74" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.6"/>
  <text x="595.0" y="110" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Legacy feature flags of</text>
  <text x="595.0" y="128" font-size="11.5" text-anchor="start" fill="#f2f5f8">the product editor and</text>
  <text x="595.0" y="146" font-size="11.5" text-anchor="start" fill="#f2f5f8">pattern toolkit retired</text>
  <path d="M690 160 L690 262" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="20.0" y="344" width="200" height="74" rx="6" fill="#34495e" stroke="#6f8aa3" stroke-width="1.6"/>
  <text x="30.0" y="368" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Before 10.9.0</text>
  <text x="30.0" y="386" font-size="11.5" text-anchor="start" fill="#f2f5f8">The block product editor</text>
  <text x="30.0" y="404" font-size="11.5" text-anchor="start" fill="#f2f5f8">ran next to the classic one</text>
  <path d="M120 344 L120 328" stroke="#6f8aa3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="385.0" y="344" width="230" height="110" rx="6" fill="#34495e" stroke="#e8908a" stroke-width="1.6"/>
  <text x="395.0" y="368" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">11.0.0: block editor removed</text>
  <text x="395.0" y="386" font-size="11.5" text-anchor="start" fill="#f2f5f8">Package, routes, assets, extension</text>
  <text x="395.0" y="404" font-size="11.5" text-anchor="start" fill="#f2f5f8">APIs gone; BlockRegistry shim logs</text>
  <text x="395.0" y="422" font-size="11.5" text-anchor="start" fill="#f2f5f8">a warning. Object cache default on</text>
  <text x="395.0" y="440" font-size="11.5" text-anchor="start" fill="#f2f5f8">for new stores</text>
  <path d="M500 344 L500 328" stroke="#e8908a" stroke-width="2" fill="none" marker-end="url(#c)"/>
  <rect x="750" y="344" width="190" height="74" rx="6" fill="#34495e" stroke="#9fd3c7" stroke-width="1.6"/>
  <text x="760" y="368" font-size="11.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">11.2.0 fixes</text>
  <text x="760" y="386" font-size="11.5" text-anchor="start" fill="#f2f5f8">Parent image not stored</text>
  <text x="760" y="404" font-size="11.5" text-anchor="start" fill="#f2f5f8">as the variation image</text>
  <path d="M850 344 L850 328" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="40" y="468" width="880" height="82" rx="6" fill="#34495e"/>
  <text x="52" y="492" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">What to do with an extension written for the block editor</text>
  <text x="52" y="514" font-size="12" text-anchor="start" fill="#f2f5f8">Move its fields to the classic hooks or to a React admin page that talks to the REST API.</text>
  <text x="52" y="534" font-size="12" text-anchor="start" fill="#f2f5f8">Code that still registers editor blocks keeps loading: the shim returns false and logs once per request.</text>
</svg>
