<svg viewBox="0 0 760 352" width="760" height="352" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="352" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Classic geometry front end versus GL_EXT_mesh_shader</text>
<text x="190" y="58" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Classic pipeline</text>
<rect x="80" y="70" width="220" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="92.0" text-anchor="middle" font-size="12" fill="#374151">Vertex fetch (fixed)</text>
<line x1="190" y1="106" x2="190" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="118" width="220" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="140.0" text-anchor="middle" font-size="12" fill="#3730A3">Vertex shader</text>
<line x1="190" y1="154" x2="190" y2="166" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="166" width="220" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="188.0" text-anchor="middle" font-size="12" fill="#3730A3">Tessellation (optional)</text>
<line x1="190" y1="202" x2="190" y2="214" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="214" width="220" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="236.0" text-anchor="middle" font-size="12" fill="#3730A3">Geometry shader (optional)</text>
<line x1="190" y1="250" x2="190" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="262" width="220" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="284.0" text-anchor="middle" font-size="12" fill="#374151">Primitive assembly</text>
<text x="570" y="58" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Mesh pipeline</text>
<rect x="460" y="70" width="220" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="92.0" text-anchor="middle" font-size="12" fill="#92400E">Task shader (optional)</text>
<rect x="460" y="118" width="220" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="140.0" text-anchor="middle" font-size="12" fill="#92400E">Mesh shader</text>
<rect x="460" y="166" width="220" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="188.0" text-anchor="middle" font-size="12" fill="#374151">Primitive assembly</text>
<line x1="570" y1="106" x2="570" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="570" y1="154" x2="570" y2="164" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="570" y="228" text-anchor="middle" font-size="11" fill="#374151">No fixed-function vertex fetch:</text>
<text x="570" y="243" text-anchor="middle" font-size="11" fill="#374151">your code reads buffers and writes the</text>
<text x="570" y="258" text-anchor="middle" font-size="11" fill="#374151">vertices and triangles itself</text>
<line x1="40" y1="314" x2="720" y2="314" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 4"/>
<text x="380" y="338" text-anchor="middle" font-size="11" fill="#4B5563">Both continue with rasterisation, the fragment shader, depth, stencil and blending. A program uses one front end or the other, never both.</text>
</svg>
