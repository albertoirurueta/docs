  <polygon points="472,614.0 482,619.0 472,624.0" fill="#64748b"/>
  <text x="496" y="616.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">same type as the input,</text>
  <text x="496" y="633.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">fewer elements</text>
  <rect x="798" y="606.0" width="148" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="872" y="623.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">same type as x</text>
  <rect x="30" y="656" width="22" height="18" rx="9" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="60" y="670" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155">known in advance</text>
  <rect x="202" y="656" width="22" height="18" rx="9" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="232" y="670" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155">depends on the data or on f</text>
  <rect x="451" y="656" width="22" height="18" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="481" y="670" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155">chosen by an argument</text>
  <text x="30" y="698" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155">sapply and mapply guess; vapply and Map do not. Only vapply checks every result against a template.</text>
</svg>
