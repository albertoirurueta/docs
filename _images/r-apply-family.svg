  <text x="496" y="583.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">all the partial results</text>
  <rect x="798" y="556.0" width="148" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="872" y="573.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">depends on f</text>
  <rect x="16" y="596" width="928" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="624.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">Filter</text>
