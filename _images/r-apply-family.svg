  <polygon points="472,264.0 482,269.0 472,274.0" fill="#64748b"/>
  <text x="496" y="266.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">mapply: vector, matrix or list</text>
  <text x="496" y="283.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">Map: always a list</text>
