<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="af-title af-desc">
  <title id="af-title">The apply family and the functionals: input type and output type</title>
  <desc id="af-desc">A table with one row per function. Each row gives what you pass in and what comes back. lapply takes a vector or list and always returns a list. sapply takes the same and returns a vector, matrix, array or list depending on the data. vapply returns a vector, matrix or array fixed by its FUN.VALUE template. mapply takes two or more vectors and returns a vector, matrix or list, and Map always returns a list. apply takes a matrix or array and a margin and returns a vector, matrix, array or list. tapply takes a vector and grouping factors and returns an array, or a list array. outer takes two vectors and returns a matrix or array. rapply takes a nested list and returns a list of the same shape or a flat vector. eapply takes an environment and returns a list. Reduce takes a vector or list and a binary function and returns one value or all partial results. Filter returns the same type with fewer elements.</desc>
  <rect x="0" y="0" width="960" height="720" rx="12" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">What goes in, what comes out</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">One row per function. The coloured tag says how much of the result type you know before the call.</text>
  <rect x="16" y="68" width="928" height="26" rx="6" fill="#e2e8f0"/>
  <text x="30" y="86" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">function</text>
  <text x="190" y="86" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">input</text>
  <text x="496" y="86" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">output</text>
  <text x="798" y="86" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">result type</text>
  <rect x="16" y="96" width="928" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="124.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">lapply</text>
  <text x="190" y="124.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector or list</text>
  <line x1="436" y1="119.0" x2="472" y2="119.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,114.0 482,119.0 472,124.0" fill="#64748b"/>
  <text x="496" y="124.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">list, one element per element of X</text>
  <rect x="798" y="106.0" width="148" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="872" y="123.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">always a list</text>
  <rect x="16" y="146" width="928" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="174.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">sapply</text>
  <text x="190" y="174.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector or list</text>
  <line x1="436" y1="169.0" x2="472" y2="169.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,164.0 482,169.0 472,174.0" fill="#64748b"/>
  <text x="496" y="166.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector, matrix, array or list</text>
  <text x="496" y="183.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">(what lapply gave, simplified if possible)</text>
  <rect x="798" y="156.0" width="148" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="872" y="173.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">depends on the data</text>
  <rect x="16" y="196" width="928" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="224.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">vapply</text>
  <text x="190" y="216.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector or list</text>
  <text x="190" y="233.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">plus a template, FUN.VALUE</text>
  <line x1="436" y1="219.0" x2="472" y2="219.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,214.0 482,219.0 472,224.0" fill="#64748b"/>
  <text x="496" y="216.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector, matrix or array</text>
  <text x="496" y="233.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">of the type and length of FUN.VALUE</text>
  <rect x="798" y="206.0" width="148" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="872" y="223.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">fixed by FUN.VALUE</text>
  <rect x="16" y="246" width="928" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="274.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">mapply / Map</text>
  <text x="190" y="274.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">two or more vectors or lists</text>
