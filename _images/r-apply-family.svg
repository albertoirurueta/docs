  <text x="190" y="316.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">matrix or array</text>
  <text x="190" y="333.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">plus MARGIN</text>
  <line x1="436" y1="319.0" x2="472" y2="319.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,314.0 482,319.0 472,324.0" fill="#64748b"/>
  <text x="496" y="316.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector, matrix, array or list</text>
  <text x="496" y="333.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">(one answer per slice)</text>
  <rect x="798" y="306.0" width="148" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="872" y="323.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">depends on the data</text>
  <rect x="16" y="346" width="928" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="374.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">tapply</text>
  <text x="190" y="366.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector</text>
  <text x="190" y="383.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">plus grouping factors (INDEX)</text>
