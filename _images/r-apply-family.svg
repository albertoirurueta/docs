  <text x="190" y="416.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">two vectors or arrays</text>
  <text x="190" y="433.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">plus a vectorised FUN</text>
  <line x1="436" y1="419.0" x2="472" y2="419.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,414.0 482,419.0 472,424.0" fill="#64748b"/>
  <text x="496" y="416.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">matrix or array</text>
  <text x="496" y="433.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">dim(X) followed by dim(Y)</text>
  <rect x="798" y="406.0" width="148" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="872" y="423.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">shape fixed by X, Y</text>
  <rect x="16" y="446" width="928" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="474.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">rapply</text>
  <text x="190" y="474.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">nested list</text>
  <line x1="436" y1="469.0" x2="472" y2="469.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,464.0 482,469.0 472,474.0" fill="#64748b"/>
  <text x="496" y="466.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">list of the same shape,</text>
  <text x="496" y="483.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">or one flat vector</text>
  <rect x="798" y="456.0" width="148" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="872" y="473.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">chosen by how =</text>
  <rect x="16" y="496" width="928" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="524.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">eapply</text>
  <text x="190" y="524.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">environment</text>
  <line x1="436" y1="519.0" x2="472" y2="519.0" stroke="#64748b" stroke-width="2"/>
  <polygon points="472,514.0 482,519.0 472,524.0" fill="#64748b"/>
  <text x="496" y="516.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">list named by the objects</text>
  <text x="496" y="533.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">(order not guaranteed)</text>
  <rect x="798" y="506.0" width="148" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="872" y="523.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">always a list</text>
  <rect x="16" y="546" width="928" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="574.0" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">Reduce</text>
  <text x="190" y="566.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">vector or list</text>
  <text x="190" y="583.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">plus a binary function</text>
