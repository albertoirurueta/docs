  <text x="496" y="366.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0f172a">array with one dimension per factor</text>
  <text x="496" y="383.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569">(a list array if FUN returns more than one value)</text>
  <rect x="798" y="356.0" width="148" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="872" y="373.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">depends on FUN</text>
  <rect x="16" y="396" width="928" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
