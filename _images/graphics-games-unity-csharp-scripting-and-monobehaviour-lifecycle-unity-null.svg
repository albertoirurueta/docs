<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Why a destroyed object is "null" but not null</text>
<rect x="40" y="60" width="200" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="100.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Managed side (C#)</text>
<text x="140.0" y="116.2" text-anchor="middle" font-size="12" fill="#3730A3">Bookshelf wrapper object</text>
<text x="140.0" y="132.2" text-anchor="middle" font-size="12" fill="#3730A3">still held by a field</text>
<text x="140.0" y="148.2" text-anchor="middle" font-size="12" fill="#3730A3">not yet garbage collected</text>
<rect x="520" y="60" width="200" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="100.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Native side (C++)</text>
<text x="620.0" y="116.2" text-anchor="middle" font-size="12" fill="#92400E">the real component</text>
<text x="620.0" y="132.2" text-anchor="middle" font-size="12" fill="#92400E">Destroy(book) frees it</text>
<text x="620.0" y="148.2" text-anchor="middle" font-size="12" fill="#92400E">at the end of the frame</text>
<line x1="240" y1="120" x2="520" y2="120" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="380" y1="100" x2="380" y2="140" stroke="#B45309" stroke-width="3"/>
<text x="380" y="92" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">link broken</text>
<rect x="40" y="210" width="680" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="232.6" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Checks on the stale reference</text>
<rect x="40" y="256" width="200" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="140.0" y="273.9" text-anchor="middle" font-size="11" fill="#374151">book == null</text>
<rect x="250" y="256" width="110" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="305.0" y="273.9" text-anchor="middle" font-size="11" fill="#1F2937">true</text>
<rect x="370" y="256" width="350" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="545.0" y="273.9" text-anchor="middle" font-size="11" fill="#374151">Unity overloads == to ask the native side</text>
<rect x="40" y="288" width="200" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="140.0" y="305.9" text-anchor="middle" font-size="11" fill="#374151">book != null</text>
<rect x="250" y="288" width="110" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="305.0" y="305.9" text-anchor="middle" font-size="11" fill="#1F2937">false</text>
<rect x="370" y="288" width="350" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="545.0" y="305.9" text-anchor="middle" font-size="11" fill="#374151">same overloaded operator</text>
<rect x="40" y="320" width="200" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="140.0" y="337.9" text-anchor="middle" font-size="11" fill="#374151">book is null</text>
<rect x="250" y="320" width="110" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="305.0" y="337.9" text-anchor="middle" font-size="11" fill="#92400E">false</text>
<rect x="370" y="320" width="350" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="545.0" y="337.9" text-anchor="middle" font-size="11" fill="#374151">C# pattern bypasses the overload</text>
<rect x="40" y="352" width="200" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="140.0" y="369.9" text-anchor="middle" font-size="11" fill="#374151">book ?? other</text>
<rect x="250" y="352" width="110" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="305.0" y="369.9" text-anchor="middle" font-size="11" fill="#92400E">keeps book</text>
<rect x="370" y="352" width="350" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="545.0" y="369.9" text-anchor="middle" font-size="11" fill="#374151">?? cannot be overloaded</text>
<rect x="40" y="384" width="200" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="140.0" y="401.9" text-anchor="middle" font-size="11" fill="#374151">book?.Open()</text>
<rect x="250" y="384" width="110" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="305.0" y="401.9" text-anchor="middle" font-size="11" fill="#92400E">calls Open</text>
<rect x="370" y="384" width="350" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="545.0" y="401.9" text-anchor="middle" font-size="11" fill="#374151">?. cannot be overloaded: MissingReferenceException</text>
</svg>
