<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Anatomy of a WooCommerce payment gateway</title>
  <desc id="d">A gateway class extends WC_Payment_Gateway, which extends WC_Settings_API. The class name is added with the woocommerce_payment_gateways filter, WC_Payment_Gateways instantiates it, and is_available plus the woocommerce_available_payment_gateways filter decide which gateways the shopper sees. The classic checkout, the Checkout block, saved payment tokens and refunds all use the same gateway object.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="260" height="90" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140.0" y="62.0" text-anchor="middle" font-weight="bold">WC_Settings_API</text>
  <text x="140.0" y="80.0" text-anchor="middle">init_form_fields, init_settings</text>
  <text x="140.0" y="98.0" text-anchor="middle">get_option, process_admin_options</text>
  <text x="140.0" y="116.0" text-anchor="middle">options woocommerce_ID_settings</text>
  <rect x="320" y="40" width="260" height="90" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="62.0" text-anchor="middle" font-weight="bold">WC_Payment_Gateway</text>
  <text x="450.0" y="80.0" text-anchor="middle">id, has_fields, supports, title</text>
  <text x="450.0" y="98.0" text-anchor="middle">payment_fields, validate_fields</text>
  <text x="450.0" y="116.0" text-anchor="middle">process_payment, process_refund</text>
  <rect x="630" y="40" width="260" height="90" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="760.0" y="71.0" text-anchor="middle" font-weight="bold">WC_Gateway_PocketCoffee_Pay</text>
  <text x="760.0" y="89.0" text-anchor="middle">your class, in your plugin</text>
  <text x="760.0" y="107.0" text-anchor="middle">settings, webhook, tokens</text>
  <line x1="270" y1="85" x2="318" y2="85" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="85" x2="628" y2="85" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="294" y="76" text-anchor="middle" font-size="11">extends</text>
  <text x="604" y="76" text-anchor="middle" font-size="11">extends</text>
  <rect x="10" y="175" width="260" height="80" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140.0" y="201.0" text-anchor="middle" font-weight="bold">woocommerce_payment_gateways</text>
  <text x="140.0" y="219.0" text-anchor="middle">filter: add the class name</text>
  <text x="140.0" y="237.0" text-anchor="middle">plugins_loaded is a safe moment</text>
  <rect x="320" y="175" width="260" height="80" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="201.0" text-anchor="middle" font-weight="bold">WC_Payment_Gateways</text>
  <text x="450.0" y="219.0" text-anchor="middle">creates the objects, applies</text>
  <text x="450.0" y="237.0" text-anchor="middle">the saved order of gateways</text>
  <rect x="630" y="175" width="260" height="80" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="760.0" y="201.0" text-anchor="middle" font-weight="bold">is_available()</text>
  <text x="760.0" y="219.0" text-anchor="middle">enabled, max_amount, your rules</text>
  <text x="760.0" y="237.0" text-anchor="middle">filter on the available list</text>
  <path d="M760,130 L760,150 L140,150 L140,173" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="215" x2="318" y2="215" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="215" x2="628" y2="215" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="290" width="880" height="150" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="22" y="310" font-weight="bold">Who uses the gateway object</text>
  <rect x="25" y="312" width="260" height="115" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="346.5" text-anchor="middle" font-weight="bold">Classic checkout</text>
  <text x="155.0" y="364.5" text-anchor="middle">payment_fields renders the form</text>
  <text x="155.0" y="382.5" text-anchor="middle">validate_fields, process_payment</text>
  <text x="155.0" y="400.5" text-anchor="middle">return_url and the thank-you page</text>
  <rect x="320" y="312" width="260" height="115" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="346.5" text-anchor="middle" font-weight="bold">Checkout block</text>
  <text x="450.0" y="364.5" text-anchor="middle">AbstractPaymentMethodType (PHP)</text>
  <text x="450.0" y="382.5" text-anchor="middle">registerPaymentMethod (JS)</text>
  <text x="450.0" y="400.5" text-anchor="middle">Store API: payment_data</text>
  <rect x="615" y="312" width="260" height="115" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="346.5" text-anchor="middle" font-weight="bold">Tokens and refunds</text>
  <text x="745.0" y="364.5" text-anchor="middle">WC_Payment_Tokens, token classes</text>
  <text x="745.0" y="382.5" text-anchor="middle">supports tokenization, refunds</text>
  <text x="745.0" y="400.5" text-anchor="middle">wc_refund_payment</text>
  <line x1="760" y1="255" x2="760" y2="288" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
