<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Places's feature-based source layout</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Shared infrastructure at the top level, one self-contained folder per product feature</text>

  <defs>
    <marker id="ps-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="310" y="62" width="160" height="42" rx="9" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="390" y="88" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">src/</text>

  <!-- Bus to the six top-level folders -->
  <line x1="390" y1="104" x2="390" y2="124" stroke="#333333" stroke-width="1.3"/>
  <line x1="90" y1="124" x2="690" y2="124" stroke="#333333" stroke-width="1.3"/>
  <line x1="90" y1="124" x2="90" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="210" y1="124" x2="210" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="330" y1="124" x2="330" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="450" y1="124" x2="450" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="570" y1="124" x2="570" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="690" y1="124" x2="690" y2="142" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>

  <rect x="35" y="144" width="110" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="90" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">app/</text>
  <text x="90" y="182" font-size="8.5" fill="#333333" text-anchor="middle">App.tsx</text>
  <text x="90" y="194" font-size="8.5" fill="#333333" text-anchor="middle">providers</text>

  <rect x="155" y="144" width="110" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="210" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">navigation/</text>
  <text x="210" y="182" font-size="8.5" fill="#333333" text-anchor="middle">RootNavigator</text>
  <text x="210" y="194" font-size="8.5" fill="#333333" text-anchor="middle">.tsx</text>

  <rect x="275" y="144" width="110" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="330" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">theme/</text>
  <text x="330" y="182" font-size="8.5" fill="#333333" text-anchor="middle">colors, spacing,</text>
  <text x="330" y="194" font-size="8.5" fill="#333333" text-anchor="middle">typography</text>

  <rect x="395" y="144" width="110" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="450" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">lib/</text>
  <text x="450" y="182" font-size="8.5" fill="#333333" text-anchor="middle">apiClient.ts</text>
  <text x="450" y="194" font-size="8.5" fill="#333333" text-anchor="middle">netinfo.ts</text>

  <rect x="515" y="144" width="110" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="570" y="166" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">native/</text>
  <text x="570" y="182" font-size="8.5" fill="#333333" text-anchor="middle">HapticTap.ts</text>
  <text x="570" y="194" font-size="8.5" fill="#333333" text-anchor="middle">(Turbo spec)</text>

  <rect x="635" y="144" width="110" height="58" rx="8" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.8"/>
  <text x="690" y="166" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">features/</text>
  <text x="690" y="182" font-size="8.5" fill="#333333" text-anchor="middle">one folder per</text>
  <text x="690" y="194" font-size="8.5" fill="#333333" text-anchor="middle">product feature</text>

  <!-- Bus from features/ to the three features -->
  <line x1="690" y1="202" x2="690" y2="226" stroke="#333333" stroke-width="1.3"/>
  <line x1="160" y1="226" x2="690" y2="226" stroke="#333333" stroke-width="1.3"/>
  <line x1="160" y1="226" x2="160" y2="246" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="390" y1="226" x2="390" y2="246" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="620" y1="226" x2="620" y2="246" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>

  <rect x="70" y="248" width="180" height="52" rx="8" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="160" y="270" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">places/</text>
  <text x="160" y="288" font-size="8.5" fill="#333333" text-anchor="middle">the app's core feature</text>

  <rect x="300" y="248" width="180" height="52" rx="8" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="390" y="268" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">auth/</text>
  <text x="390" y="284" font-size="8.5" fill="#333333" text-anchor="middle">authSession.ts, secureTokenStore.ts,</text>
  <text x="390" y="295" font-size="8.5" fill="#333333" text-anchor="middle">SignInScreen.tsx</text>

  <rect x="530" y="248" width="180" height="52" rx="8" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="620" y="270" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">settings/</text>
  <text x="620" y="288" font-size="8.5" fill="#333333" text-anchor="middle">SettingsScreen.tsx</text>

  <!-- Bus from places/ to its seven folders -->
  <line x1="160" y1="300" x2="160" y2="330" stroke="#333333" stroke-width="1.3"/>
  <line x1="78" y1="330" x2="702" y2="330" stroke="#333333" stroke-width="1.3"/>
  <line x1="78" y1="330" x2="78" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="182" y1="330" x2="182" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="286" y1="330" x2="286" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="390" y1="330" x2="390" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="494" y1="330" x2="494" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="598" y1="330" x2="598" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <line x1="702" y1="330" x2="702" y2="348" stroke="#333333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>

  <rect x="30" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="78" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">types.ts</text>
  <text x="78" y="387" font-size="8" fill="#333333" text-anchor="middle">Place, PlaceId,</text>
  <text x="78" y="398" font-size="8" fill="#333333" text-anchor="middle">PlaceCategory,</text>
  <text x="78" y="409" font-size="8" fill="#333333" text-anchor="middle">NewPlaceInput</text>

  <rect x="134" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="182" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">api/</text>
  <text x="182" y="387" font-size="8" fill="#333333" text-anchor="middle">placesApi.ts</text>
  <text x="182" y="398" font-size="8" fill="#333333" text-anchor="middle">(REST calls via</text>
  <text x="182" y="409" font-size="8" fill="#333333" text-anchor="middle">lib/apiClient)</text>

  <rect x="238" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="286" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">hooks/</text>
  <text x="286" y="387" font-size="8" fill="#333333" text-anchor="middle">usePlaces.ts</text>
  <text x="286" y="398" font-size="8" fill="#333333" text-anchor="middle">useAddPlace.ts</text>
  <text x="286" y="409" font-size="8" fill="#333333" text-anchor="middle">useToggle...ts</text>

  <rect x="342" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">components/</text>
  <text x="390" y="387" font-size="8" fill="#333333" text-anchor="middle">PlaceCard.tsx</text>
  <text x="390" y="398" font-size="8" fill="#333333" text-anchor="middle">(feature-local,</text>
  <text x="390" y="409" font-size="8" fill="#333333" text-anchor="middle">not shared)</text>

  <rect x="446" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="494" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">screens/</text>
  <text x="494" y="387" font-size="8" fill="#333333" text-anchor="middle">PlacesList,</text>
  <text x="494" y="398" font-size="8" fill="#333333" text-anchor="middle">PlaceDetails,</text>
  <text x="494" y="409" font-size="8" fill="#333333" text-anchor="middle">AddPlace, Favourites</text>

  <rect x="550" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="598" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">store/</text>
  <text x="598" y="387" font-size="8" fill="#333333" text-anchor="middle">useFavourites</text>
  <text x="598" y="398" font-size="8" fill="#333333" text-anchor="middle">Store.ts</text>
  <text x="598" y="409" font-size="8" fill="#333333" text-anchor="middle">(Zustand)</text>

  <rect x="654" y="350" width="96" height="72" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="702" y="370" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">storage/</text>
  <text x="702" y="387" font-size="8" fill="#333333" text-anchor="middle">placesRepository</text>
  <text x="702" y="398" font-size="8" fill="#333333" text-anchor="middle">.ts</text>
  <text x="702" y="409" font-size="8" fill="#333333" text-anchor="middle">(expo-sqlite)</text>

  <text x="390" y="452" font-size="10.5" fill="#666666" text-anchor="middle">auth/ and settings/ have the same internal shape, kept flat because they are small; a folder grows the same</text>
  <text x="390" y="468" font-size="10.5" fill="#666666" text-anchor="middle">subfolders as places/ only once it needs them. Imports cross feature boundaries through each feature's public surface.</text>
</svg>
