<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Narrowing one parameter, step by step</text>
  <text x="360" y="50" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">function describe(x: string | number | null)</text>

  <text x="372" y="72" font-size="11" fill="#666666">type of x at this point</text>

  <!-- boxes -->
  <g>
    <rect x="48" y="80" width="296" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="60" y="100" font-size="13" fill="#222222" font-family="'Courier New', monospace">describe(x)</text>
    <text x="60" y="117" font-size="11" fill="#666666">parameter as declared</text>

    <rect x="48" y="160" width="296" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="60" y="180" font-size="13" fill="#222222" font-family="'Courier New', monospace">if (x === null) return;</text>
    <text x="60" y="197" font-size="11" fill="#666666">null removed by the early return</text>

    <rect x="48" y="240" width="296" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="60" y="260" font-size="13" fill="#222222" font-family="'Courier New', monospace">if (typeof x === "string") {</text>
    <text x="60" y="277" font-size="11" fill="#666666">typeof guard selects the string case</text>

    <rect x="48" y="320" width="296" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="60" y="340" font-size="13" fill="#222222" font-family="'Courier New', monospace">} else {</text>
    <text x="60" y="357" font-size="11" fill="#666666">else: only number can remain</text>
  </g>

  <!-- vertical connectors -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="196" y1="126" x2="196" y2="156"/>
    <polygon points="190,156 202,156 196,164" stroke="none"/>
    <line x1="196" y1="206" x2="196" y2="236"/>
    <polygon points="190,236 202,236 196,244" stroke="none"/>
    <line x1="196" y1="286" x2="196" y2="316"/>
    <polygon points="190,316 202,316 196,324" stroke="none"/>
  </g>

  <!-- horizontal arrows to the narrowed type -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="344" y1="103" x2="362" y2="103"/>
    <polygon points="360,99 360,107 368,103" stroke="none"/>
    <line x1="344" y1="183" x2="362" y2="183"/>
    <polygon points="360,179 360,187 368,183" stroke="none"/>
    <line x1="344" y1="263" x2="362" y2="263"/>
    <polygon points="360,259 360,267 368,263" stroke="none"/>
    <line x1="344" y1="343" x2="362" y2="343"/>
    <polygon points="360,339 360,347 368,343" stroke="none"/>
  </g>

  <!-- narrowed types -->
  <g font-family="'Courier New', monospace" font-size="14" font-weight="bold">
    <text x="376" y="108" fill="#1c4b73">string | number | null</text>
    <text x="376" y="188" fill="#1c4b73">string | number</text>
    <text x="376" y="268" fill="#2f5424">string</text>
    <text x="376" y="348" fill="#2f5424">number</text>
  </g>

  <text x="360" y="398" font-size="12" fill="#444444" text-anchor="middle">Control-flow analysis computes each branch's type &#8594; no casts, no annotations.</text>
</svg>
