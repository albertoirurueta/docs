<circle cx="36" cy="68" r="11" fill="#4F46E5"/>
<text x="36" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="105.0" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Window is black</text>
