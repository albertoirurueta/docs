<text x="105" y="160" font-size="11" font-weight="normal" fill="#9CA3AF" text-anchor="middle">(nothing drawn)</text>
<rect x="220" y="90" width="130" height="130" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="285" y="112" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">GL_INVALID_OPERATION</text>
