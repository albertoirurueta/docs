<circle cx="216" cy="68" r="11" fill="#4F46E5"/>
<text x="216" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="285.0" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Debug callback</text>
<text x="285.0" y="283" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shows a message</text>
<rect x="380" y="52" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="396" cy="68" r="11" fill="#B45309"/>
<text x="396" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="465.0" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Capture shows the</text>
<text x="465.0" y="283" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">draw with 0 pixels</text>
<rect x="560" y="52" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="576" cy="68" r="11" fill="#4F46E5"/>
<text x="576" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="645.0" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fix state, shelf</text>
<text x="645.0" y="283" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">appears</text>
