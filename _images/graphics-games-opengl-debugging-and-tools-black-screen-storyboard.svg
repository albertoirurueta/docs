<rect x="20" y="290" width="720" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="312" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Order of attack: read GL_DEBUG messages first, then the capture, then state toggles.</text>
<text x="380" y="328" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Only change one thing at a time, and re-check the callback after every change.</text>
