<text x="285" y="142" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">no VAO bound</text>
<text x="285" y="157" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">(core profile)</text>
<rect x="400" y="90" width="130" height="130" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="465" y="112" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">draw 14: 2304 idx</text>
<text x="465" y="127" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">Rasteriser out:</text>
<text x="465" y="142" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">0 fragments</text>
<text x="465" y="157" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">state: CULL BACK</text>
