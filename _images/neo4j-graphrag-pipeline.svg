<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">GraphRAG retrieval pipeline</text>

  <!-- Stage boxes -->
  <!-- 1. Query -->
  <rect x="20" y="150" width="120" height="90" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="80" y="188" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Query</text>
  <text x="80" y="206" font-size="10" fill="#666666" text-anchor="middle">user question,</text>
  <text x="80" y="220" font-size="10" fill="#666666" text-anchor="middle">embedded to a</text>
  <text x="80" y="234" font-size="10" fill="#666666" text-anchor="middle">query vector</text>

  <!-- 2. Vector retrieval -->
  <rect x="160" y="150" width="120" height="90" fill="#eaf1f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="220" y="182" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Vector</text>
  <text x="220" y="197" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">retrieval</text>
  <text x="220" y="215" font-size="9.5" fill="#666666" text-anchor="middle">SEARCH ... VECTOR</text>
  <text x="220" y="228" font-size="9.5" fill="#666666" text-anchor="middle">INDEX (ANN, top-k)</text>

  <!-- 3. Graph expansion -->
  <rect x="300" y="150" width="120" height="90" fill="#eef4ea" stroke="#2f5424" stroke-width="1.4"/>
  <text x="360" y="182" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Graph</text>
  <text x="360" y="197" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">expansion</text>
  <text x="360" y="215" font-size="9.5" fill="#666666" text-anchor="middle">traverse related</text>
  <text x="360" y="228" font-size="9.5" fill="#666666" text-anchor="middle">nodes/edges</text>

  <!-- 4. LLM context -->
  <rect x="440" y="150" width="120" height="90" fill="#f7f0e6" stroke="#8a5a1e" stroke-width="1.4"/>
  <text x="500" y="182" font-size="13" font-weight="bold" fill="#8a5a1e" text-anchor="middle">LLM</text>
  <text x="500" y="197" font-size="13" font-weight="bold" fill="#8a5a1e" text-anchor="middle">context</text>
  <text x="500" y="215" font-size="9.5" fill="#666666" text-anchor="middle">chunks + related</text>
  <text x="500" y="228" font-size="9.5" fill="#666666" text-anchor="middle">graph facts, prompted</text>

  <!-- 5. Answer -->
  <rect x="580" y="150" width="120" height="90" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="640" y="188" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Answer</text>
  <text x="640" y="206" font-size="10" fill="#666666" text-anchor="middle">grounded,</text>
  <text x="640" y="220" font-size="10" fill="#666666" text-anchor="middle">context-aware</text>
  <text x="640" y="234" font-size="10" fill="#666666" text-anchor="middle">response</text>

  <!-- Arrows between stages -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="140" y1="195" x2="156" y2="195"/>
    <polygon points="156,190 156,200 164,195" stroke="none"/>

    <line x1="280" y1="195" x2="296" y2="195"/>
    <polygon points="296,190 296,200 304,195" stroke="none"/>

    <line x1="420" y1="195" x2="436" y2="195"/>
    <polygon points="436,190 436,200 444,195" stroke="none"/>

    <line x1="560" y1="195" x2="576" y2="195"/>
    <polygon points="576,190 576,200 584,195" stroke="none"/>
  </g>

  <text x="360" y="285" font-size="11" fill="#444444" text-anchor="middle">A vector SEARCH finds the closest chunks; the graph expansion adds the related entities and</text>
  <text x="360" y="302" font-size="11" fill="#444444" text-anchor="middle">context a nearest-neighbor list alone would miss, before either is handed to the LLM.</text>

  <text x="360" y="340" font-size="10.5" fill="#666666" text-anchor="middle">neo4j-graphrag-python / LangChain4j / Spring AI implement this pipeline over the same driver and</text>
  <text x="360" y="356" font-size="10.5" fill="#666666" text-anchor="middle">object mapping used elsewhere in this reference.</text>
</svg>
