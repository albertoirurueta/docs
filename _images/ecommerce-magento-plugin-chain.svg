<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Order in which Magento runs three plugins around one public method</title>
  <desc id="d">A caller invokes quote on the generated Interceptor of the ShippingQuote class. The interceptor first runs the before plugin A, then the first half of the around plugin B, then calls the original quote method, then the after plugin C inside the callable of B, then the second half of B, and returns the result to the caller. An early exit branch shows that when B does not call proceed, the original method and the after plugin C are skipped. The numbers match the call order printed by the Pocket Coffee quote command.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">One call, three plugins (sortOrder 10, 20 and 30)</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Pocket Coffee ShippingQuote::quote(), as printed by the pocketcoffee:intercept:quote command</text>

  <g font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">
    <rect x="40" y="76" width="130" height="40" rx="6" fill="#3d5266"/>
    <text x="105" y="101">Caller</text>
    <rect x="215" y="76" width="170" height="40" rx="6" fill="#3d5266"/>
    <text x="300" y="101">Interceptor</text>
    <rect x="430" y="76" width="150" height="40" rx="6" fill="#3d5266"/>
    <text x="505" y="101">Plugins A, B, C</text>
    <rect x="625" y="76" width="170" height="40" rx="6" fill="#3d5266"/>
    <text x="710" y="101">ShippingQuote</text>
  </g>
  <g stroke="#6f8aa3" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M105 116 L105 430"/>
    <path d="M300 116 L300 430"/>
    <path d="M505 116 L505 430"/>
    <path d="M710 116 L710 430"/>
  </g>

  <g font-size="12.5" fill="#f2f5f8">
    <path d="M105 142 L296 142" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="115" y="136">quote("de", 55, 2, true)</text>

    <path d="M300 172 L501 172" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="310" y="166">1  A: beforeQuote</text>
    <path d="M501 192 L304 192" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
    <text x="318" y="186">new arguments ("DE", ...)</text>

    <path d="M300 236 L501 236" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="310" y="230">2  B: aroundQuote, first half</text>

    <path d="M505 272 L706 272" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="515" y="266">3  $proceed(...) runs the original</text>

    <path d="M706 322 L509 322" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
    <text x="530" y="316">result of quote(): 9.90</text>

    <text x="515" y="346">4  C: afterQuote (inside the callable of B)</text>
    <text x="515" y="366">   club member and subtotal 40 or more: 0.00</text>

    <path d="M505 392 L304 392" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
    <text x="320" y="386">5  B: second half</text>

    <path d="M296 416 L109 416" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
    <text x="118" y="410">return 0.00</text>
  </g>

  <rect x="40" y="450" width="880" height="86" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="56" y="474" font-weight="bold" fill="#f4b860">Early exit</text>
    <text x="56" y="494">If B throws or returns without calling $proceed (parcel over 5 kg), steps 3 to 5 never happen: the original method and plugin C are skipped.</text>
    <text x="56" y="514">The command then prints only "A beforeQuote", "B aroundQuote (before proceed)" and "B aroundQuote refuses and does not call proceed".</text>
  </g>
</svg>
