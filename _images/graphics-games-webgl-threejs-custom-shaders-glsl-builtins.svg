<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tcs-builtins" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What ShaderMaterial adds and what RawShaderMaterial leaves to you</text>
<rect x="30" y="50" width="340" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="74.9" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">ShaderMaterial</text>
<rect x="390" y="50" width="340" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="74.9" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">RawShaderMaterial</text>
<rect x="30" y="105" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mat4 modelMatrix, modelViewMatrix, projectionMatrix</text>
<rect x="30" y="143" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="162.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mat4 viewMatrix; mat3 normalMatrix; vec3 cameraPosition</text>
<rect x="30" y="181" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="200.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attribute vec3 position, normal</text>
<rect x="30" y="219" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="238.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attribute vec2 uv</text>
<rect x="30" y="257" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="276.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">precision line, optional fog and clipping code</text>
<rect x="390" y="105" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">nothing is prepended</text>
<rect x="390" y="143" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="162.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you declare precision</text>
<rect x="390" y="181" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="200.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you declare every uniform you use</text>
<rect x="390" y="219" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="238.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you declare every attribute you use</text>
<rect x="390" y="257" width="340" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="276.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you write #version 300 es yourself</text>
<rect x="30" y="310" width="700" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="331.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Both: the renderer fills the matrices every draw; your uniforms come from material.uniforms[name].value</text>
<text x="380" y="372" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Both classes only work with WebGLRenderer. WebGPURenderer uses TSL node materials instead.</text>
</svg>
