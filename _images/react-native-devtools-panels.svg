<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">React Native DevTools: panels and what they inspect</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">One Chrome-DevTools-based window, connected directly to the running app's Hermes engine</text>

  <defs>
    <marker id="dp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Central app node -->
  <rect x="300" y="200" width="160" height="60" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1.6"/>
  <text x="380" y="225" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Places app</text>
  <text x="380" y="242" font-size="10" fill="#555555" text-anchor="middle">running on Hermes</text>

  <!-- Console (top-left) -->
  <rect x="20" y="66" width="200" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="120" y="88" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Console</text>
  <text x="120" y="105" font-size="10" fill="#333333" text-anchor="middle">inspects: log/warn/error</text>
  <text x="120" y="120" font-size="10" fill="#333333" text-anchor="middle">output + a live REPL</text>
  <text x="120" y="135" font-size="10" fill="#333333" text-anchor="middle">against the running app</text>
  <line x1="220" y1="120" x2="300" y2="215" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <!-- Sources / Breakpoints (top-middle) -->
  <rect x="290" y="66" width="180" height="80" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="380" y="88" font-size="12.5" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Sources / Breakpoints</text>
  <text x="380" y="105" font-size="10" fill="#333333" text-anchor="middle">inspects: real TS/JSX source</text>
  <text x="380" y="120" font-size="10" fill="#333333" text-anchor="middle">via source maps, with line</text>
  <text x="380" y="135" font-size="10" fill="#333333" text-anchor="middle">and conditional breakpoints</text>
  <line x1="380" y1="146" x2="380" y2="200" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <!-- Network (top-right) -->
  <rect x="540" y="66" width="200" height="80" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="640" y="88" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Network</text>
  <text x="640" y="105" font-size="10" fill="#333333" text-anchor="middle">inspects: every fetch/XHR</text>
  <text x="640" y="120" font-size="10" fill="#333333" text-anchor="middle">from apiClient -- headers,</text>
  <text x="640" y="135" font-size="10" fill="#333333" text-anchor="middle">status, timing, body</text>
  <line x1="640" y1="146" x2="460" y2="215" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <!-- Memory (bottom-left) -->
  <rect x="20" y="320" width="200" height="80" rx="8" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="120" y="342" font-size="12.5" font-weight="bold" fill="#a33333" text-anchor="middle">Memory</text>
  <text x="120" y="359" font-size="10" fill="#333333" text-anchor="middle">inspects: JS heap snapshots</text>
  <text x="120" y="374" font-size="10" fill="#333333" text-anchor="middle">and allocation timelines,</text>
  <text x="120" y="389" font-size="10" fill="#333333" text-anchor="middle">e.g. a retained Place[] array</text>
  <line x1="220" y1="345" x2="300" y2="245" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <!-- React Components (bottom-middle) -->
  <rect x="290" y="320" width="180" height="80" rx="8" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.6"/>
  <text x="380" y="342" font-size="12.5" font-weight="bold" fill="#a35d00" text-anchor="middle">React Components</text>
  <text x="380" y="359" font-size="10" fill="#333333" text-anchor="middle">inspects: the live element</text>
  <text x="380" y="374" font-size="10" fill="#333333" text-anchor="middle">tree, e.g. a PlaceCard's</text>
  <text x="380" y="389" font-size="10" fill="#333333" text-anchor="middle">current props and state</text>
  <line x1="380" y1="320" x2="380" y2="260" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <!-- Profiler (bottom-right) -->
  <rect x="540" y="320" width="200" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="640" y="342" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">React Profiler</text>
  <text x="640" y="359" font-size="10" fill="#333333" text-anchor="middle">inspects: which components</text>
  <text x="640" y="374" font-size="10" fill="#333333" text-anchor="middle">re-rendered in a pass, and</text>
  <text x="640" y="389" font-size="10" fill="#333333" text-anchor="middle">why (prop or context change)</text>
  <line x1="640" y1="320" x2="460" y2="245" stroke="#333333" stroke-width="1.3" marker-end="url(#dp-arrow)"/>

  <text x="380" y="440" font-size="10.5" fill="#666666" text-anchor="middle">Since React Native 0.85, multiple DevTools windows can connect to the same Metro instance at once.</text>
</svg>
