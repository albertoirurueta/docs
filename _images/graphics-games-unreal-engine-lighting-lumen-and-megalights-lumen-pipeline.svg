<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How Lumen builds indirect light</text>
<rect x="25" y="60" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3">Scene</text>
<text x="100.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">meshes, distance</text>
<text x="100.0" y="114.2" text-anchor="middle" font-size="12" fill="#3730A3">fields, cards</text>
<rect x="215" y="60" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3">Surface Cache</text>
<text x="290.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">lit surfaces of the</text>
<text x="290.0" y="114.2" text-anchor="middle" font-size="12" fill="#3730A3">scene, updated live</text>
<rect x="405" y="60" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="480.0" y="84.2" text-anchor="middle" font-size="12" fill="#92400E">Tracing</text>
<text x="480.0" y="99.2" text-anchor="middle" font-size="12" fill="#92400E">software or hardware</text>
<text x="480.0" y="114.2" text-anchor="middle" font-size="12" fill="#92400E">ray tracing</text>
<rect x="595" y="60" width="140" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3">Final gather</text>
<text x="665.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">screen probes,</text>
<text x="665.0" y="114.2" text-anchor="middle" font-size="12" fill="#3730A3">radiance cache</text>
<line x1="175" y1="95" x2="215" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d3)"/>
<line x1="365" y1="95" x2="405" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d3)"/>
<line x1="555" y1="95" x2="595" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d3)"/>
<rect x="595" y="170" width="140" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="191.7" text-anchor="middle" font-size="12" fill="#374151">Denoise, temporal</text>
<text x="665.0" y="206.7" text-anchor="middle" font-size="12" fill="#374151">accumulation</text>
<line x1="665" y1="130" x2="665" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d3)"/>
<rect x="595" y="260" width="140" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="665.0" y="281.7" text-anchor="middle" font-size="12" fill="#065F46">Lit scene color</text>
<text x="665.0" y="296.7" text-anchor="middle" font-size="12" fill="#065F46">GI and reflections</text>
<line x1="665" y1="220" x2="665" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d3)"/>
<rect x="25" y="165" width="530" height="145" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="290" y="188" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Software Ray Tracing versus Hardware Ray Tracing</text>
<text x="290" y="212" text-anchor="middle" font-size="11" fill="#374151">Software: Detail Tracing uses per-mesh distance fields (highest quality),</text>
<text x="290" y="229" text-anchor="middle" font-size="11" fill="#374151">Global Tracing uses the global distance field (fastest).</text>
<text x="290" y="246" text-anchor="middle" font-size="11" fill="#374151">Hardware: used when available, Lumen falls back to software otherwise.</text>
<text x="290" y="263" text-anchor="middle" font-size="11" fill="#374151">Ray Lighting Mode: Surface Cache (default) or Hit Lighting for Reflections (hardware only).</text>
<text x="290" y="280" text-anchor="middle" font-size="11" fill="#374151">Lumen Lite: a medium-quality GI path using irradiance fields with probe occlusion.</text>
<text x="380" y="340" text-anchor="middle" font-size="11" fill="#374151">Settings live in Project Settings and in the Post Process Volume; both are listed on this page.</text>
</svg>
