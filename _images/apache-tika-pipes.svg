<svg viewBox="0 0 960 590" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="960" height="590" fill="#ffffff"/>
<text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Tika Pipes: four plugin roles around a pool of forked parse JVMs</text>
<text x="480" y="46" text-anchor="middle" font-size="12" fill="#444444">Amber: the four pluggable roles (PF4J plugins), green: Tika Pipes core, grey: your systems. Numbers follow one document.</text>
<rect x="20" y="66" width="320" height="504" rx="10" fill="#f4f6f9" stroke="#8a96a8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="180" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4658">Parent JVM (the driver)</text>
<rect x="40" y="100" width="280" height="76" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="180" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">1  Pipes iterator</text>
<text x="180" y="141" text-anchor="middle" font-size="11.5" fill="#333333">file-system, s3, gcs, az-blob, jdbc, csv, json,</text>
<text x="180" y="156" text-anchor="middle" font-size="11.5" fill="#333333">solr, kafka: one FetchEmitTuple per document</text>
<text x="180" y="170" text-anchor="middle" font-size="11" fill="#555555">(id, fetcherId + fetchKey, emitterId + emitKey)</text>
<rect x="40" y="200" width="280" height="56" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="180" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Tuple queue</text>
<text x="180" y="242" text-anchor="middle" font-size="11.5" fill="#333333">queueSize 10000, offer() blocks when full</text>
<rect x="40" y="280" width="280" height="56" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="180" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">PipesClient x numClients</text>
<text x="180" y="322" text-anchor="middle" font-size="11.5" fill="#333333">one socket per fork, heartbeat, watchdog</text>
<rect x="40" y="370" width="280" height="76" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="180" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Emit threads (numEmitters)</text>
<text x="180" y="411" text-anchor="middle" font-size="11.5" fill="#333333">batch passed-back extracts, flush on</text>
<text x="180" y="426" text-anchor="middle" font-size="11.5" fill="#333333">emitWithinMillis or emitMaxEstimatedBytes</text>
<rect x="40" y="478" width="280" height="80" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="180" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">4  Reporter</text>
<text x="180" y="518" text-anchor="middle" font-size="11.5" fill="#333333">file-system, file-system-jsonl, jdbc,</text>
<text x="180" y="533" text-anchor="middle" font-size="11.5" fill="#333333">opensearch, es: one status per tuple,</text>
<text x="180" y="548" text-anchor="middle" font-size="11.5" fill="#333333">written here, so it survives a dead fork</text>
<path d="M180,176 L180,198" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M180,256 L180,278" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M40,318 L30,318 L30,518 L38,518" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="396" y="122" width="300" height="290" rx="10" fill="#eef6ee" stroke="#2b7a2b" stroke-width="1.2"/>
<rect x="388" y="114" width="300" height="290" rx="10" fill="#eef6ee" stroke="#2b7a2b" stroke-width="1.2"/>
<rect x="380" y="106" width="300" height="290" rx="10" fill="#e3f1e3" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="530" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Forked JVM (PipesServer), one per client</text>
<text x="530" y="145" text-anchor="middle" font-size="11" fill="#444444">own -Xmx, restarted after OOM, TIMEOUT or crash</text>
<text x="530" y="160" text-anchor="middle" font-size="11" fill="#444444">and every maxFilesProcessedPerProcess documents</text>
<rect x="400" y="174" width="260" height="62" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="530" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">2  Fetcher</text>
<text x="530" y="213" text-anchor="middle" font-size="11.5" fill="#333333">file-system, s3, gcs, az-blob, http,</text>
<text x="530" y="228" text-anchor="middle" font-size="11.5" fill="#333333">google-drive, microsoft-graph: key to bytes</text>
<rect x="400" y="260" width="260" height="88" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="530" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Parse</text>
<text x="530" y="299" text-anchor="middle" font-size="11.5" fill="#333333">AutoDetectParser + content handler</text>
<text x="530" y="314" text-anchor="middle" font-size="11.5" fill="#333333">parseMode: RMETA, CONCATENATE,</text>
<text x="530" y="329" text-anchor="middle" font-size="11.5" fill="#333333">CONTENT_ONLY, NO_PARSE, UNPACK</text>
<text x="530" y="343" text-anchor="middle" font-size="11" fill="#555555">bounded by timeout-limits</text>
<path d="M530,236 L530,258" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="530" y="370" text-anchor="middle" font-size="11" fill="#444444">emitStrategy decides who writes the extract:</text>
<text x="530" y="385" text-anchor="middle" font-size="11" fill="#444444">EMIT_ALL, PASSBACK_ALL or DYNAMIC (by size)</text>
<path d="M320,300 L378,300" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="350" y="292" text-anchor="middle" font-size="10.5" fill="#444444">tuple</text>
<path d="M380,374 L322,398" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 3"/>
<text x="352" y="366" text-anchor="middle" font-size="10.5" fill="#444444">passback</text>
<path d="M322,430 L378,462" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="346" y="472" text-anchor="middle" font-size="10.5" fill="#444444">batched</text>
<rect x="380" y="430" width="300" height="80" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="530" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">3  Emitter</text>
<text x="530" y="471" text-anchor="middle" font-size="11.5" fill="#333333">file-system, s3, gcs, az-blob, opensearch,</text>
<text x="530" y="486" text-anchor="middle" font-size="11.5" fill="#333333">es, solr, jdbc, kafka</text>
<text x="530" y="502" text-anchor="middle" font-size="11" fill="#555555">the emitKey picks the target</text>
<path d="M600,396 L600,428" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="612" y="424" text-anchor="start" font-size="10.5" fill="#444444">direct (large)</text>
<rect x="740" y="439" width="200" height="62" rx="8" fill="#e6e6e6" stroke="#777777" stroke-width="1.6"/>
<text x="840" y="463" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Your destination</text>
<text x="840" y="483" text-anchor="middle" font-size="11.5" fill="#333333">folder, bucket, index, table, topic</text>
<path d="M680,470 L738,470" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="740" y="140" width="200" height="140" rx="8" fill="#ffffff" stroke="#8a96a8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="840" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4658">Same machinery behind</text>
<text x="840" y="184" text-anchor="middle" font-size="11.5" fill="#333333">tika-app -i / -o</text>
<text x="840" y="202" text-anchor="middle" font-size="11.5" fill="#333333">AsyncProcessor and PipesParser</text>
<text x="840" y="220" text-anchor="middle" font-size="11.5" fill="#333333">tika-server /tika, /rmeta, /pipes</text>
<text x="840" y="238" text-anchor="middle" font-size="11.5" fill="#333333">tika-grpc</text>
<text x="840" y="256" text-anchor="middle" font-size="11.5" fill="#333333">PipesForkParser (no iterator,</text>
<text x="840" y="272" text-anchor="middle" font-size="11.5" fill="#333333">internal fetcher, PASSBACK_ALL)</text>
</svg>
