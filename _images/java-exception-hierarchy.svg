<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The Java Throwable hierarchy: checked vs. unchecked exceptions</title>
  <desc id="desc">Throwable has two subclasses, Error and Exception. Error and its subclasses
    OutOfMemoryError and StackOverflowError are unchecked. Exception splits into RuntimeException
    (with NullPointerException and IllegalArgumentException), which is unchecked, and the checked
    exceptions such as IOException and SQLException. A dashed line runs between Exception and
    RuntimeException to mark the checked/unchecked boundary.</desc>

  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>

  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Throwable hierarchy: checked vs. unchecked</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Checked = the compiler enforces "catch or specify". Unchecked = RuntimeException and Error and their subclasses.</text>

  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#666666" stroke-width="1"/>
    </marker>
  </defs>

  <!-- inheritance edges: child -> parent, hollow triangle at the parent end -->
  <line x1="170" y1="150" x2="352" y2="104" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="570" y1="150" x2="428" y2="104" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="95"  y1="248" x2="150" y2="196" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="272" y1="248" x2="202" y2="196" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="504" y1="248" x2="556" y2="196" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="660" y1="244" x2="606" y2="196" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="660" y1="302" x2="614" y2="196" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="455" y1="356" x2="492" y2="294" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="455" y1="414" x2="500" y2="294" stroke="#666666" stroke-width="1.3" marker-end="url(#tri)"/>

  <!-- checked / unchecked boundary: stepped dashed line passing between Exception and RuntimeException -->
  <polyline points="452,200 452,226 606,226 606,488" fill="none" stroke="#b0392e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="528" y="242" font-size="8.5" fill="#b0392e" text-anchor="middle">checked above &#183; unchecked below / left</text>
  <text x="300" y="332" font-size="10" font-style="italic" fill="#b07d2c" text-anchor="middle">unchecked &#8212; no catch-or-specify</text>
  <text x="762" y="214" font-size="10" font-style="italic" fill="#4a6a8a" text-anchor="end">checked &#8212; catch or specify</text>

  <!-- Throwable -->
  <rect x="310" y="58" width="160" height="46" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="390" y="80" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">Throwable</text>
  <text x="390" y="96" font-size="8.5" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">getMessage() &#183; getCause()</text>

  <!-- Error -->
  <rect x="95" y="150" width="150" height="44" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.3"/>
  <text x="170" y="170" font-size="12" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">Error</text>
  <text x="170" y="185" font-size="8" fill="#7a5a20" text-anchor="middle">unchecked</text>

  <!-- Exception -->
  <rect x="480" y="150" width="180" height="44" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="570" y="170" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Exception</text>
  <text x="570" y="185" font-size="8" fill="#3a5570" text-anchor="middle">checked (except the RuntimeException branch)</text>

  <!-- Error leaves -->
  <rect x="20" y="248" width="150" height="40" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.2"/>
  <text x="95" y="272" font-size="10.5" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">OutOfMemoryError</text>

  <rect x="190" y="248" width="165" height="40" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.2"/>
  <text x="272" y="272" font-size="10.5" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">StackOverflowError</text>

  <!-- RuntimeException -->
  <rect x="420" y="248" width="168" height="46" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.4"/>
  <text x="504" y="269" font-size="11" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">RuntimeException</text>
  <text x="504" y="284" font-size="8" fill="#7a5a20" text-anchor="middle">unchecked</text>

  <!-- checked leaves -->
  <rect x="636" y="244" width="128" height="38" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="700" y="267" font-size="10.5" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">IOException</text>

  <rect x="636" y="300" width="128" height="38" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="700" y="323" font-size="10.5" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">SQLException</text>

  <!-- RuntimeException leaves -->
  <rect x="360" y="356" width="190" height="38" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.2"/>
  <text x="455" y="379" font-size="10" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">NullPointerException</text>

  <rect x="350" y="414" width="210" height="38" rx="4" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.2"/>
  <text x="455" y="437" font-size="10" font-weight="bold" fill="#5a3d10" text-anchor="middle" font-family="'Courier New', monospace">IllegalArgumentException</text>

  <!-- legend -->
  <rect x="20" y="462" width="14" height="14" rx="2" fill="#f8efe0" stroke="#b07d2c" stroke-width="1.2"/>
  <text x="40" y="473" font-size="9.5" fill="#444444">unchecked (RuntimeException, Error)</text>
  <rect x="250" y="462" width="14" height="14" rx="2" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="270" y="473" font-size="9.5" fill="#444444">checked (Exception, not RuntimeException)</text>
</svg>
