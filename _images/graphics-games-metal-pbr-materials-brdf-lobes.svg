<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-pbr-materials-brdf-lobes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">BRDF lobes: how roughness spreads the reflected light</text>
<rect x="20" y="50" width="235" height="300" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="137" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Roughness 0.1</text>
<path d="M82,268 A55,55 0 0 1 192,268 Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<ellipse cx="189.3" cy="215.7" rx="6" ry="70" transform="rotate(45 189.3 215.7)" fill="#FEF3C7" fill-opacity="0.85" stroke="#B45309" stroke-width="1.5"/>
<line x1="27" y1="158" x2="133" y2="264" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-pbr-materials-brdf-lobes)"/>
<text x="37" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">light</text>
<line x1="40" y1="268" x2="235" y2="268" stroke="#4B5563" stroke-width="2"/>
<text x="137" y="306" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">polished: narrow, bright lobe</text>
<text x="137" y="322" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">amber: specular lobe, blue: diffuse</text>
<text x="137" y="338" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">the specular lobe keeps the same total energy</text>
<rect x="265" y="50" width="235" height="300" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="382" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Roughness 0.5</text>
<path d="M327,268 A55,55 0 0 1 437,268 Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<ellipse cx="421.6" cy="228.4" rx="16" ry="52" transform="rotate(45 421.6 228.4)" fill="#FEF3C7" fill-opacity="0.85" stroke="#B45309" stroke-width="1.5"/>
<line x1="272" y1="158" x2="378" y2="264" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-pbr-materials-brdf-lobes)"/>
<text x="282" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">light</text>
<line x1="285" y1="268" x2="480" y2="268" stroke="#4B5563" stroke-width="2"/>
<text x="382" y="306" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">satin: a wider lobe</text>
<text x="382" y="322" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">amber: specular lobe, blue: diffuse</text>
<text x="382" y="338" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">as it widens it gets dimmer</text>
<rect x="510" y="50" width="235" height="300" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="627" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Roughness 0.9</text>
<path d="M572,268 A55,55 0 0 1 682,268 Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<ellipse cx="656.7" cy="238.3" rx="34" ry="38" transform="rotate(45 656.7 238.3)" fill="#FEF3C7" fill-opacity="0.85" stroke="#B45309" stroke-width="1.5"/>
<line x1="517" y1="158" x2="623" y2="264" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-pbr-materials-brdf-lobes)"/>
<text x="527" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">light</text>
<line x1="530" y1="268" x2="725" y2="268" stroke="#4B5563" stroke-width="2"/>
<text x="627" y="306" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">matte: almost a hemisphere</text>
<text x="627" y="322" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">amber: specular lobe, blue: diffuse</text>
<text x="627" y="338" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">its peak is low and broad</text>
</svg>
