<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Three ways to reach the same Bookshelf view</text>
  <text x="470" y="48" font-size="12" fill="#666666" text-anchor="middle">the servlet container matches the request path against the url-pattern entries, FacesServlet derives the view id</text>

  <text x="30" y="82" font-size="12" font-weight="bold" fill="#444444">Request path (after the context path)</text>
  <text x="400" y="82" font-size="12" font-weight="bold" fill="#444444">Servlet container</text>
  <text x="640" y="82" font-size="12" font-weight="bold" fill="#444444">View id and file</text>

  <rect x="395" y="94" width="150" height="224" rx="4" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="470" y="190" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">FacesServlet</text>
  <text x="470" y="208" font-size="10" fill="#555555" text-anchor="middle">jakarta.faces.webapp</text>
  <text x="470" y="222" font-size="10" fill="#555555" text-anchor="middle">runs the lifecycle</text>

  <rect x="30" y="102" width="290" height="44" rx="3" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="42" y="120" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/books/list.xhtml</text>
  <text x="42" y="137" font-size="10" fill="#555555">extension mapping, url-pattern *.xhtml</text>
  <rect x="30" y="182" width="290" height="44" rx="3" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="42" y="200" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/faces/books/list.xhtml</text>
  <text x="42" y="217" font-size="10" fill="#555555">prefix mapping, url-pattern /faces/*</text>
  <rect x="30" y="262" width="290" height="44" rx="3" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="42" y="280" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/books/list</text>
  <text x="42" y="297" font-size="10" fill="#555555">extensionless, exact url-pattern or automatic mapping</text>

  <path d="M 320 124 H 393" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 204 H 393" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 284 H 393" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <path d="M 545 124 H 620" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 545 204 H 620" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 545 284 H 620" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="622" y="102" width="290" height="44" rx="3" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="634" y="120" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/books/list.xhtml</text>
  <text x="634" y="137" font-size="10" fill="#555555">the extension is already there</text>
  <rect x="622" y="182" width="290" height="44" rx="3" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="634" y="200" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/books/list.xhtml</text>
  <text x="634" y="217" font-size="10" fill="#555555">the /faces prefix is removed, .xhtml is appended</text>
  <rect x="622" y="262" width="290" height="44" rx="3" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="634" y="280" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">/books/list.xhtml</text>
  <text x="634" y="297" font-size="10" fill="#555555">the Facelets suffix is appended</text>

  <rect x="30" y="338" width="882" height="62" rx="3" fill="#fdecea" stroke="#9c2a1f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="44" y="360" font-size="12" font-weight="bold" fill="#9c2a1f">Not a Faces request</text>
  <text x="44" y="378" font-size="11" fill="#333333">With only the prefix mapping declared, /books/list.xhtml does not match any url-pattern of FacesServlet. In the scratch run the</text>
  <text x="44" y="392" font-size="11" fill="#333333">container served the unprocessed XHTML source for it, so prefix mapping needs a security constraint or a different layout.</text>
</svg>
