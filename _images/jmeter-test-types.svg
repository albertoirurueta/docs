<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Load shapes of the five test types over time</title>
<desc id="d">Five small charts of virtual users against time: smoke is a flat line at one user, load ramps up then holds then ramps down, stress climbs in steps beyond the expected peak, spike jumps suddenly and falls back, soak holds a steady level for a long time.</desc>
<text x="45" y="34" font-size="14" font-weight="bold">Smoke</text><text x="45" y="50" font-size="11" opacity=".75">1 user, a few minutes</text>
<line x1="45" y1="60" x2="45" y2="180" stroke="currentColor"/><line x1="45" y1="180" x2="235" y2="180" stroke="currentColor"/>
<text x="140.0" y="196" text-anchor="middle" font-size="11">Time</text>
<text transform="translate(31,120.0) rotate(-90)" text-anchor="middle" font-size="11">Virtual users</text>
<polyline points="45,171 74,171 206,171 235,180" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/>
<text x="45" y="214" font-size="11" opacity=".85">1 user checks script and environment</text>
<text x="290" y="34" font-size="14" font-weight="bold">Load</text><text x="290" y="50" font-size="11" opacity=".75">expected peak, ramp then hold</text>
<line x1="290" y1="60" x2="290" y2="180" stroke="currentColor"/><line x1="290" y1="180" x2="480" y2="180" stroke="currentColor"/>
<text x="385.0" y="196" text-anchor="middle" font-size="11">Time</text>
<text transform="translate(276,120.0) rotate(-90)" text-anchor="middle" font-size="11">Virtual users</text>
<polyline points="290,180 338,112 432,112 480,180" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
<text x="290" y="214" font-size="11" opacity=".85">ramp-up, hold, ramp-down</text>
<text x="535" y="34" font-size="14" font-weight="bold">Stress</text><text x="535" y="50" font-size="11" opacity=".75">steps beyond the peak</text>
<line x1="535" y1="60" x2="535" y2="180" stroke="currentColor"/><line x1="535" y1="180" x2="725" y2="180" stroke="currentColor"/>
<text x="630.0" y="196" text-anchor="middle" font-size="11">Time</text>
<text transform="translate(521,120.0) rotate(-90)" text-anchor="middle" font-size="11">Virtual users</text>
<polyline points="535,180 554,157 592,157 592,134 630,134 630,112 668,112 668,83 706,83 706,66 725,66 725,180" fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round"/>
<text x="535" y="214" font-size="11" opacity=".85">step up until something breaks</text>
<text x="45" y="244" font-size="14" font-weight="bold">Spike</text><text x="45" y="260" font-size="11" opacity=".75">sudden burst</text>
<line x1="45" y1="270" x2="45" y2="390" stroke="currentColor"/><line x1="45" y1="390" x2="235" y2="390" stroke="currentColor"/>
<text x="140.0" y="406" text-anchor="middle" font-size="11">Time</text>
<text transform="translate(31,330.0) rotate(-90)" text-anchor="middle" font-size="11">Virtual users</text>
<polyline points="45,367 121,367 125,282 150,282 153,367 235,367" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
<text x="45" y="424" font-size="11" opacity=".85">sharp surge, then recovery</text>
<text x="290" y="244" font-size="14" font-weight="bold">Soak</text><text x="290" y="260" font-size="11" opacity=".75">hours at steady load</text>
<line x1="290" y1="270" x2="290" y2="390" stroke="currentColor"/><line x1="290" y1="390" x2="480" y2="390" stroke="currentColor"/>
<text x="385.0" y="406" text-anchor="middle" font-size="11">Time</text>
<text transform="translate(276,330.0) rotate(-90)" text-anchor="middle" font-size="11">Virtual users</text>
<polyline points="290,390 309,333 470,333 480,390" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
<text x="290" y="424" font-size="11" opacity=".85">constant load for hours</text>
<text x="535" y="290" font-size="13" font-weight="bold">How to read the charts</text>
<text x="535" y="312" font-size="12">Horizontal axis: elapsed time of the run.</text>
<text x="535" y="330" font-size="12">Vertical axis: concurrent virtual users</text>
<text x="535" y="348" font-size="12">(or request rate in an open model).</text>
<text x="535" y="366" font-size="12">Heights are relative within each chart;</text>
<text x="535" y="384" font-size="12">durations differ widely between types.</text>
</svg>