<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Who connects to the Magento database, as which user, through what, and with which certificate</title>
  <desc id="d">Diagram of the database tier of Pocket Coffee. On the left, two groups of workloads in the namespace pocketcoffee. The web and admin pods run as the database user mg_app and reach the database through the optional RDS Proxy pocketcoffee-prod-proxy, whose certificate comes from AWS Certificate Manager and is verified against the system trust store. The cron, queue consumer and reindex workloads and the release Jobs run as mg_migrate and connect directly to the instance endpoint of pocketcoffee-prod, because they use temporary tables and named locks that pin proxy sessions and need privileges that mg_app does not have. They verify the instance certificate against the RDS CA bundle baked into the image. On the right, the RDS Multi-AZ instance: a writer in availability zone a and a synchronous standby in zone b that cannot be read. A dashed line shows that the Aurora cluster variant has a reader endpoint, which only Adobe Commerce with the module Magento_ResourceConnections can use through slave_connection in env.php. Every connection is TLS, and require_secure_transport is on.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" text-anchor="start" fill="#f2f5f8">Database tier: users, paths and certificates</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Namespace pocketcoffee on the left, Amazon RDS in the private subnets on the right; all connections use TLS</text>

  <rect x="30" y="76" width="250" height="150" rx="10" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="44" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">Web and admin pods</text>
  <text x="44" y="120" font-size="12" text-anchor="start" fill="#f2f5f8">pocketcoffee-web, pocketcoffee-admin</text>
  <text x="44" y="140" font-size="12" text-anchor="start" fill="#f2f5f8">user mg_app: SELECT, INSERT, UPDATE,</text>
  <text x="44" y="156" font-size="12" text-anchor="start" fill="#f2f5f8">DELETE, CREATE TEMPORARY TABLES</text>
  <text x="44" y="180" font-size="12" text-anchor="start" fill="#9fd3c7">pm.max_children x pods = connections</text>
  <text x="44" y="200" font-size="11.5" text-anchor="start" fill="#f2f5f8">one connection per PHP process</text>

  <rect x="30" y="298" width="250" height="176" rx="10" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
  <text x="44" y="320" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">Background pods and Jobs</text>
  <text x="44" y="342" font-size="12" text-anchor="start" fill="#f2f5f8">cron, consumers, reindex Job,</text>
  <text x="44" y="358" font-size="12" text-anchor="start" fill="#f2f5f8">install and migrate Jobs</text>
  <text x="44" y="380" font-size="12" text-anchor="start" fill="#f2f5f8">user mg_migrate: ALL on the schema,</text>
  <text x="44" y="396" font-size="12" text-anchor="start" fill="#f2f5f8">nothing global, no GRANT OPTION</text>
  <text x="44" y="420" font-size="12" text-anchor="start" fill="#c9b3e6">indexers TRUNCATE and create tables;</text>
  <text x="44" y="436" font-size="12" text-anchor="start" fill="#c9b3e6">temporary tables and GET_LOCK pin a proxy</text>
  <text x="44" y="452" font-size="12" text-anchor="start" fill="#c9b3e6">session, so they connect directly</text>

  <rect x="350" y="96" width="210" height="110" rx="10" fill="#34495e" stroke="#f4b860" stroke-width="2"/>
  <text x="455" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#f4b860">RDS Proxy (optional)</text>
  <text x="455" y="142" font-size="12" text-anchor="middle" fill="#f2f5f8">pocketcoffee-prod-proxy</text>
  <text x="455" y="162" font-size="11.5" text-anchor="middle" fill="#f2f5f8">pools and multiplexes the web</text>
  <text x="455" y="178" font-size="11.5" text-anchor="middle" fill="#f2f5f8">pods; certificate from ACM</text>
  <text x="455" y="194" font-size="11.5" text-anchor="middle" fill="#9fd3c7">system trust store, no bundle</text>

  <line x1="280" y1="150" x2="350" y2="150" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="620" y="76" width="310" height="280" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="636" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">RDS instance pocketcoffee-prod, Multi-AZ</text>
  <rect x="636" y="116" width="278" height="84" rx="8" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="650" y="138" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Writer, zone a</text>
  <text x="650" y="158" font-size="12" text-anchor="start" fill="#f2f5f8">MySQL 8.4, database pocketcoffee</text>
  <text x="650" y="176" font-size="12" text-anchor="start" fill="#f2f5f8">parameter group pocketcoffee-magento-mysql84</text>
  <text x="650" y="192" font-size="11.5" text-anchor="start" fill="#f2f5f8">certificate rds-ca-rsa2048-g1</text>
  <rect x="636" y="236" width="278" height="64" rx="8" fill="#2f4a44" stroke="#9fd3c7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="650" y="258" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Standby, zone b</text>
  <text x="650" y="278" font-size="12" text-anchor="start" fill="#f2f5f8">synchronous copy, cannot be read;</text>
  <text x="650" y="294" font-size="12" text-anchor="start" fill="#f2f5f8">promoted on failover, DNS name unchanged</text>
  <line x1="775" y1="200" x2="775" y2="236" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="636" y="330" font-size="11.5" text-anchor="start" fill="#f2f5f8">Aurora variant: cluster pocketcoffee-prod-aurora with a</text>
  <text x="636" y="346" font-size="11.5" text-anchor="start" fill="#f2f5f8">writer and a reader endpoint</text>

  <line x1="560" y1="150" x2="620" y2="150" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M280 386 L600 386 L600 196 L620 196" fill="none" stroke="#c9b3e6" stroke-width="2" marker-end="url(#a)"/>
  <text x="340" y="378" font-size="12" text-anchor="start" fill="#c9b3e6">direct to the instance endpoint,</text>
  <text x="340" y="404" font-size="12" text-anchor="start" fill="#c9b3e6">verified with /etc/ssl/rds/global-bundle.pem</text>

  <rect x="350" y="430" width="580" height="68" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="364" y="450" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f4b860">env.php</text>
  <text x="364" y="470" font-size="12" text-anchor="start" fill="#f2f5f8">MAGENTO_DB_HOST is the proxy endpoint for the web pods and the instance</text>
  <text x="364" y="486" font-size="12" text-anchor="start" fill="#f2f5f8">endpoint for the others; one env.php template serves both.</text>
</svg>
