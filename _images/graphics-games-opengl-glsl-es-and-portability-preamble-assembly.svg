<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-glsl-es-and-portability-preamble-assembl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One portable shader body, two preambles</text>
<rect x="260" y="50" width="240" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="76" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">bookshelf.frag (portable body)</text>
<text x="380" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">in vec2 vUv;  out vec4 fragColor;</text>
<text x="380" y="111" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fragColor = texture(uAlbedo, vUv);</text>
<rect x="30" y="160" width="300" height="92" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="180" y="182" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Preamble for desktop GL 4.1 core</text>
<text x="180" y="202" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">#version 410 core</text>
<text x="180" y="217" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(precision lines are not needed)</text>
<rect x="430" y="160" width="300" height="92" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="580" y="182" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Preamble for OpenGL ES 3.0 / WebGL 2</text>
<text x="580" y="202" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">#version 300 es</text>
<text x="580" y="217" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">precision highp float;  precision highp int;</text>
<line x1="330" y1="120" x2="180" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-glsl-es-and-portability-preamble-assembl)"/>
<line x1="430" y1="120" x2="580" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-glsl-es-and-portability-preamble-assembl)"/>
<text x="210" y="142" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">desktop build</text>
<text x="550" y="142" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">ES / Android / WebGL 2 build</text>
<rect x="30" y="300" width="300" height="80" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="180" y="324" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">glShaderSource(shader, 2, {preamble, body}, nullptr)</text>
<text x="180" y="339" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">two strings, one compile</text>
<rect x="430" y="300" width="300" height="80" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580" y="324" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">glShaderSource(shader, 2, {preamble, body}, nullptr)</text>
<text x="580" y="339" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">same body, different first string</text>
<line x1="180" y1="252" x2="180" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-glsl-es-and-portability-preamble-assembl)"/>
<line x1="580" y1="252" x2="580" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-glsl-es-and-portability-preamble-assembl)"/>
<text x="380" y="408" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The #version line must come first, so the preamble is always the first string.</text>
</svg>
