<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Navigation on desktop and on the phone app</text>
  <rect x="20" y="46" width="430" height="300" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="235" y="68" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Desktop and Android tablet: side menu</text>
  <rect x="34" y="80" width="130" height="252" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <g font-size="12" fill="#1F2937">
    <rect x="42" y="88" width="114" height="24" rx="4" fill="#4F46E5"/><text x="52" y="105" fill="#FFFFFF">Home (fixed)</text>
    <rect x="42" y="118" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="52" y="135">Create</text>
    <rect x="42" y="148" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="52" y="165">Projects</text>
    <rect x="42" y="178" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="52" y="195">Brand</text>
    <rect x="42" y="208" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="52" y="225">Print Shop</text>
    <rect x="42" y="238" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="52" y="255">Canva AI</text>
    <rect x="42" y="268" width="114" height="24" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="52" y="285" fill="#92400E">More</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="180" y="105">Pin or unpin tabs</text><text x="180" y="123">Drag to reorder</text>
    <text x="180" y="147">Unpinned items move to More</text>
    <text x="180" y="171">Starred sections below the menu</text>
    <text x="180" y="195">Saved per device</text>
    <text x="180" y="219">Personal, not shared with teammates</text>
  </g>
  <rect x="180" y="238" width="258" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="190" y="258" font-size="12" fill="#374151">Profile menu: Accounts, Your account,</text>
  <text x="190" y="276" font-size="12" fill="#374151">Settings, Theme, Log out</text>
  <text x="190" y="298" font-size="11" fill="#6B7280">If a tool is missing, look under More</text>
  <rect x="480" y="46" width="260" height="300" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="610" y="68" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Phone app: five bottom tabs</text>
  <rect x="520" y="80" width="180" height="212" rx="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="530" y="96" width="160" height="22" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="111" font-size="10" fill="#6B7280">Account and team switchers</text>
  <rect x="530" y="126" width="160" height="22" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="141" font-size="10" fill="#6B7280">Your account, Settings, Theme</text>
  <rect x="530" y="156" width="160" height="22" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="171" font-size="10" fill="#6B7280">Brand Kit, Apps, Trash</text>
  <line x1="520" y1="256" x2="700" y2="256" stroke="#9CA3AF"/>
  <g font-size="9" fill="#374151" text-anchor="middle">
    <rect x="522" y="260" width="34" height="28" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="539" y="278">AI</text>
    <rect x="558" y="260" width="34" height="28" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="575" y="278">Create</text>
    <rect x="594" y="260" width="34" height="28" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="611" y="278">Templ.</text>
    <rect x="630" y="260" width="34" height="28" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="647" y="278">Designs</text>
    <rect x="666" y="260" width="32" height="28" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="682" y="278" fill="#92400E">More</text>
  </g>
  <text x="610" y="316" font-size="11" fill="#374151" text-anchor="middle">Canva AI, Create, Templates,</text>
  <text x="610" y="332" font-size="11" fill="#374151" text-anchor="middle">Your Designs, More</text>
  <text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Create replaces the old Home tab and Your Designs replaces Projects on the phone.</text>
  <text x="380" y="390" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
