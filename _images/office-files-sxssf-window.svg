<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SXSSF: a sliding window of rows in memory, older rows in a temporary file</title>
  <desc id="d">Rows are created one after another. The last 100 rows (the window) stay in memory. When a new row pushes an older one out of the window, that row is written to a temporary file on disk and can no longer be read or changed. Styles, merged regions, hyperlinks and comments stay in memory. Calling write streams the temporary file into the xlsx ZIP.</desc>
  <style>
    .t { fill: #1f1f1f; }
    .m { fill: #555555; }
    .box { fill: #888888; fill-opacity: 0.12; stroke: #777777; stroke-width: 1.4; }
    .gone { fill: #888888; fill-opacity: 0.08; stroke: #888888; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .win { fill: #2f6fdb; fill-opacity: 0.18; stroke: #2f6fdb; stroke-width: 1.8; }
    .disk { fill: #d98a00; fill-opacity: 0.16; stroke: #d98a00; stroke-width: 1.8; }
    .ln { stroke: #777777; stroke-width: 1.5; fill: none; }
    .brace { stroke: #2f6fdb; stroke-width: 2; fill: none; }
    .wint { fill: #1d4fa8; }
    .diskt { fill: #8a5600; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececec; }
      .m { fill: #b5b5b5; }
      .box { stroke: #aaaaaa; }
      .gone { stroke: #aaaaaa; }
      .win { fill: #6ea0ff; stroke: #6ea0ff; }
      .disk { fill: #ffb84d; stroke: #ffb84d; }
      .ln { stroke: #aaaaaa; }
      .brace { stroke: #6ea0ff; }
      .wint { fill: #9dbfff; }
      .diskt { fill: #ffcf85; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" class="t">SXSSF keeps a window of rows in memory and flushes older rows to disk</text>

  <!-- flushed rows -->
  <rect x="330" y="62" width="200" height="26" rx="4" class="gone"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" class="m">row 0</text>
  <rect x="330" y="92" width="200" height="26" rx="4" class="gone"/>
  <text x="430" y="110" text-anchor="middle" font-size="13" class="m">row 1</text>
  <rect x="330" y="122" width="200" height="26" rx="4" class="gone"/>
  <text x="430" y="140" text-anchor="middle" font-size="13" class="m">...</text>
  <rect x="330" y="152" width="200" height="26" rx="4" class="gone"/>
  <text x="430" y="170" text-anchor="middle" font-size="13" class="m">row n - 101</text>

  <text x="315" y="104" text-anchor="end" font-size="13" font-weight="700" class="m">Flushed rows</text>
  <text x="315" y="122" text-anchor="end" font-size="12" class="m">already on disk,</text>
  <text x="315" y="138" text-anchor="end" font-size="12" class="m">getRow gives null,</text>
  <text x="315" y="154" text-anchor="end" font-size="12" class="m">createRow fails</text>

  <!-- window rows -->
  <rect x="330" y="198" width="200" height="26" rx="4" class="win"/>
  <text x="430" y="216" text-anchor="middle" font-size="13" class="wint">row n - 100</text>
  <rect x="330" y="228" width="200" height="26" rx="4" class="win"/>
  <text x="430" y="246" text-anchor="middle" font-size="13" class="wint">...</text>
  <rect x="330" y="258" width="200" height="26" rx="4" class="win"/>
  <text x="430" y="276" text-anchor="middle" font-size="13" class="wint">row n - 1</text>
  <rect x="330" y="288" width="200" height="26" rx="4" class="win"/>
  <text x="430" y="306" text-anchor="middle" font-size="13" class="wint">row n (newest)</text>

  <path d="M318,198 L312,198 L312,314 L318,314" class="brace"/>
  <text x="302" y="240" text-anchor="end" font-size="13" font-weight="700" class="wint">Window</text>
  <text x="302" y="258" text-anchor="end" font-size="12" class="m">100 rows by default,</text>
  <text x="302" y="274" text-anchor="end" font-size="12" class="m">kept on the heap,</text>
  <text x="302" y="290" text-anchor="end" font-size="12" class="m">still editable</text>

  <!-- new row arrow -->
  <line x1="430" y1="346" x2="430" y2="322" class="ln" marker-end="url(#ar)"/>
  <text x="430" y="364" text-anchor="middle" font-size="13" class="t">createRow(n + 1) pushes the window down</text>

  <!-- flush arrow -->
  <line x1="530" y1="211" x2="618" y2="160" class="ln" marker-end="url(#ar)"/>
  <text x="590" y="212" font-size="12" class="m">oldest row leaves the window:</text>
  <text x="590" y="228" font-size="12" class="m">flushed automatically (or by flushRows)</text>

  <!-- temp file -->
  <rect x="620" y="62" width="250" height="110" rx="8" class="disk"/>
  <text x="745" y="88" text-anchor="middle" font-size="14" font-weight="700" class="diskt">Temporary file on disk</text>
  <text x="745" y="110" text-anchor="middle" font-size="12" class="t">one per sheet, poi-sxssf-sheet....xml</text>
  <text x="745" y="128" text-anchor="middle" font-size="12" class="t">optionally gzip-compressed</text>
  <text x="745" y="146" text-anchor="middle" font-size="12" class="t">in java.io.tmpdir or your strategy</text>
  <text x="745" y="164" text-anchor="middle" font-size="12" class="m">deleted by close()</text>

  <!-- always in memory -->
  <rect x="620" y="262" width="250" height="132" rx="8" class="box"/>
  <text x="745" y="288" text-anchor="middle" font-size="14" font-weight="700" class="t">Always in memory</text>
  <text x="745" y="310" text-anchor="middle" font-size="12" class="t">styles, fonts and data formats</text>
  <text x="745" y="328" text-anchor="middle" font-size="12" class="t">merged regions, hyperlinks, comments</text>
  <text x="745" y="346" text-anchor="middle" font-size="12" class="t">tracked column widths</text>
  <text x="745" y="364" text-anchor="middle" font-size="12" class="t">shared strings table, if enabled</text>
  <text x="745" y="382" text-anchor="middle" font-size="12" class="m">they grow with the data you add</text>

  <!-- write step -->
  <line x1="745" y1="394" x2="745" y2="434" class="ln" marker-end="url(#ar)"/>
  <line x1="430" y1="384" x2="430" y2="434" class="ln" marker-end="url(#ar)"/>
  <rect x="40" y="436" width="830" height="62" rx="8" class="box"/>
  <text x="455" y="460" text-anchor="middle" font-size="14" font-weight="700" class="t">workbook.write(out)</text>
  <text x="455" y="480" text-anchor="middle" font-size="12" class="t">flushes the remaining window rows, then copies the temporary files and the in-memory parts into the .xlsx ZIP stream</text>
</svg>
