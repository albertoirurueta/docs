<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Which Magento API credential to use</title>
  <desc id="d">A decision chart. On Adobe Commerce as a Cloud Service every caller uses Adobe IMS: server-to-server for jobs, user authentication for people. On Open Source, Adobe Commerce on-prem or Cloud, a shopper app uses a customer token, an admin script uses an admin token with two-factor authentication, and a long-running server integration uses an integration with OAuth 1.0a signed requests.</desc>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Pick the credential from the caller and the edition</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="360" y="50" width="240" height="56" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="480" y="74" text-anchor="middle" font-weight="bold">Which edition answers the call?</text>
    <text x="480" y="92" text-anchor="middle">Open Source, Adobe Commerce, or SaaS</text>

    <rect x="40" y="150" width="305" height="70" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="52" y="174" font-weight="bold">Adobe Commerce as a Cloud Service</text>
    <text x="52" y="194">Admin and integration tokens are not</text>
    <text x="52" y="210">supported; everything goes through Adobe IMS</text>

    <rect x="400" y="150" width="520" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="412" y="174" font-weight="bold">Open Source, Adobe Commerce on-prem or on Cloud (PaaS)</text>
    <text x="412" y="194">Who is calling?</text>

    <rect x="40" y="270" width="150" height="100" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="50" y="292" font-weight="bold">Job or script</text>
    <text x="50" y="312">IMS OAuth</text>
    <text x="50" y="328">server-to-server,</text>
    <text x="50" y="344">client credentials,</text>
    <text x="50" y="360">scope commerce.accs</text>

    <rect x="205" y="270" width="140" height="100" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="215" y="292" font-weight="bold">A named admin</text>
    <text x="215" y="312">IMS user sign-in,</text>
    <text x="215" y="328">authorization code,</text>
    <text x="215" y="344">refresh token,</text>
    <text x="215" y="360">Admin Console role</text>

    <rect x="400" y="270" width="150" height="100" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="410" y="292" font-weight="bold">A shopper</text>
    <text x="410" y="312">Customer token</text>
    <text x="410" y="328">POST /V1/integration/</text>
    <text x="410" y="344">customer/token, or</text>
    <text x="410" y="360">GraphQL mutation</text>

    <rect x="565" y="270" width="165" height="100" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="575" y="292" font-weight="bold">An admin user</text>
    <text x="575" y="312">Admin token; with 2FA</text>
    <text x="575" y="328">use /V1/tfa/provider/</text>
    <text x="575" y="344">...authenticate</text>
    <text x="575" y="360">short lived, per person</text>

    <rect x="745" y="270" width="175" height="100" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="755" y="292" font-weight="bold">A server integration</text>
    <text x="755" y="312">Integration: consumer key</text>
    <text x="755" y="328">and token, OAuth 1.0a</text>
    <text x="755" y="344">HMAC-SHA256 signature,</text>
    <text x="755" y="360">ACL resources chosen</text>

    <rect x="40" y="410" width="880" height="64" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="52" y="434" font-weight="bold">Anonymous and self resources</text>
    <text x="52" y="454">A route declared anonymous needs no credential; self needs a customer token and is forced to that customer id. Everything else needs an ACL resource.</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M420 106 V 128 H 192 V 148"/>
    <path d="M540 106 V 128 H 660 V 148"/>
    <path d="M192 220 V 240 H 115 V 268"/>
    <path d="M192 240 H 275 V 268"/>
    <path d="M660 220 V 240 H 475 V 268"/>
    <path d="M660 240 H 647 V 268"/>
    <path d="M660 240 H 832 V 268"/>
  </g>
</svg>
