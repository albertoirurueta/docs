<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Monolithic hell: the downward spiral, as bookshop.jar grows</text>

  <defs>
    <marker id="hell-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b3541e"/>
    </marker>
    <marker id="hell-arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a1c1c"/>
    </marker>
  </defs>

  <!-- top: feature growth -->
  <rect x="280" y="70" width="220" height="72" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.8"/>
  <text x="390" y="94" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">1. Growth</text>
  <text x="390" y="111" font-size="9.5" fill="#666666" text-anchor="middle">Catalogue search, more payment</text>
  <text x="390" y="124" font-size="9.5" fill="#666666" text-anchor="middle">methods, more shipping carriers</text>

  <!-- right: complexity -->
  <rect x="560" y="220" width="200" height="80" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.8"/>
  <text x="660" y="244" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">2. Complexity</text>
  <text x="660" y="261" font-size="9.5" fill="#666666" text-anchor="middle">bookshop.jar sprawls; Catalogue's</text>
  <text x="660" y="274" font-size="9.5" fill="#666666" text-anchor="middle">memory needs fight Payments'</text>
  <text x="660" y="287" font-size="9.5" fill="#666666" text-anchor="middle">latency needs in one process</text>

  <!-- bottom: slower delivery -->
  <rect x="280" y="378" width="220" height="80" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.8"/>
  <text x="390" y="402" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">3. Slower delivery</text>
  <text x="390" y="419" font-size="9.5" fill="#666666" text-anchor="middle">slow edit-build-run-test loop,</text>
  <text x="390" y="432" font-size="9.5" fill="#666666" text-anchor="middle">manually-tested monthly release</text>
  <text x="390" y="445" font-size="9.5" fill="#666666" text-anchor="middle">train, no fault isolation</text>

  <!-- left: pressure and defects -->
  <rect x="20" y="220" width="200" height="80" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.8"/>
  <text x="120" y="244" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">4. More pressure</text>
  <text x="120" y="261" font-size="9.5" fill="#666666" text-anchor="middle">rushed changes ship with less</text>
  <text x="120" y="274" font-size="9.5" fill="#666666" text-anchor="middle">confidence, more defects, an</text>
  <text x="120" y="287" font-size="9.5" fill="#666666" text-anchor="middle">obsolete stack nobody upgrades</text>

  <!-- clockwise connecting arrows -->
  <path d="M500,110 Q590,140 640,222" fill="none" stroke="#b3541e" stroke-width="2" marker-end="url(#hell-arrow)"/>
  <path d="M660,300 Q650,360 500,408" fill="none" stroke="#b3541e" stroke-width="2" marker-end="url(#hell-arrow)"/>
  <path d="M280,428 Q160,400 130,302" fill="none" stroke="#b3541e" stroke-width="2" marker-end="url(#hell-arrow)"/>
  <path d="M120,220 Q160,140 278,108" fill="none" stroke="#8a1c1c" stroke-width="2.4" marker-end="url(#hell-arrow-red)"/>

  <!-- center: the loop repeats, worse each time -->
  <circle cx="390" cy="260" r="46" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="390" y="255" font-size="10" font-weight="bold" fill="#8a1c1c" text-anchor="middle">repeats --</text>
  <text x="390" y="270" font-size="10" font-weight="bold" fill="#8a1c1c" text-anchor="middle">worse each</text>
  <text x="390" y="285" font-size="10" font-weight="bold" fill="#8a1c1c" text-anchor="middle">time</text>

  <text x="390" y="495" font-size="10.5" fill="#444444" text-anchor="middle">More pressure leads straight back into more growth-driven complexity, so each turn of the</text>
  <text x="390" y="510" font-size="10.5" fill="#444444" text-anchor="middle">cycle starts from a worse position than the last -- this is what "monolithic hell" names.</text>
</svg>
