<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 436" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Antora module directory tree mapped to output URLs</title>
<desc id="d">A component version with a ROOT module and a guides module. Pages, images and attachments are published under the component version URL, named module resources add the module name as a path segment, and partials and examples are never published.</desc>
