<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<text x="480" y="28" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">The three phases of every Gradle build (Gradle 9.8.1)</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Phases always run in this order. Output printed by the build script body appears in the phase that ran it, not where the task runs.</text>
<rect x="24" y="70" width="280" height="360" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
<text x="164.0" y="98" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">1. Initialization</text>
<text x="38" y="124" font-size="12" fill="#555555" text-anchor="start" font-weight="bold">Reads</text>
<text x="38" y="142" font-size="11.5" fill="#222222" text-anchor="start">init scripts (~/.gradle/init.d, -I)</text>
<text x="38" y="158" font-size="11.5" fill="#222222" text-anchor="start">settings.gradle(.kts)</text>
<text x="38" y="174" font-size="11.5" fill="#222222" text-anchor="start">include(...) and includeBuild(...)</text>
<text x="38" y="204" font-size="12" fill="#555555" text-anchor="start" font-weight="bold">Runs</text>
<text x="38" y="222" font-size="11.5" fill="#222222" text-anchor="start">beforeSettings</text>
<text x="38" y="238" font-size="11.5" fill="#222222" text-anchor="start">pluginManagement and plugins in settings</text>
<text x="38" y="254" font-size="11.5" fill="#222222" text-anchor="start">the settings script body</text>
<text x="38" y="270" font-size="11.5" fill="#222222" text-anchor="start">settingsEvaluated, projectsLoaded</text>
<text x="38" y="300" font-size="12" fill="#555555" text-anchor="start" font-weight="bold">Produces</text>
<text x="38" y="318" font-size="11.5" fill="#222222" text-anchor="start">the Settings object</text>
<text x="38" y="334" font-size="11.5" fill="#222222" text-anchor="start">a Project object per project</text>
<text x="38" y="350" font-size="11.5" fill="#222222" text-anchor="start">the set of included builds</text>
<rect x="340" y="70" width="280" height="360" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="480.0" y="98" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">2. Configuration</text>
<text x="354" y="124" font-size="12" fill="#2f6db5" text-anchor="start" font-weight="bold">Reads</text>
<text x="354" y="142" font-size="11.5" fill="#222222" text-anchor="start">build.gradle(.kts) of every project</text>
<text x="354" y="158" font-size="11.5" fill="#222222" text-anchor="start">(only needed ones with configure on demand)</text>
<text x="354" y="174" font-size="11.5" fill="#222222" text-anchor="start">applied plugins</text>
<text x="354" y="204" font-size="12" fill="#2f6db5" text-anchor="start" font-weight="bold">Runs</text>
<text x="354" y="222" font-size="11.5" fill="#222222" text-anchor="start">lifecycle.beforeProject / afterProject</text>
<text x="354" y="238" font-size="11.5" fill="#222222" text-anchor="start">plugins and the build script body</text>
<text x="354" y="254" font-size="11.5" fill="#222222" text-anchor="start">tasks.register(...) blocks, only for</text>
<text x="354" y="270" font-size="11.5" fill="#222222" text-anchor="start">tasks that the build needs</text>
<text x="354" y="286" font-size="11.5" fill="#222222" text-anchor="start">projectsEvaluated</text>
<text x="354" y="316" font-size="12" fill="#2f6db5" text-anchor="start" font-weight="bold">Produces</text>
<text x="354" y="334" font-size="11.5" fill="#222222" text-anchor="start">the task graph (a DAG)</text>
<text x="354" y="350" font-size="11.5" fill="#222222" text-anchor="start">taskGraph.whenReady fires</text>
<text x="354" y="366" font-size="11.5" fill="#222222" text-anchor="start">a configuration cache entry, if enabled</text>
<rect x="656" y="70" width="280" height="360" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="796.0" y="98" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">3. Execution</text>
<text x="670" y="124" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold">Reads</text>
<text x="670" y="142" font-size="11.5" fill="#222222" text-anchor="start">the task graph</text>
<text x="670" y="158" font-size="11.5" fill="#222222" text-anchor="start">task inputs and outputs (snapshots)</text>
<text x="670" y="174" font-size="11.5" fill="#222222" text-anchor="start">the selected tasks only</text>
<text x="670" y="204" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold">Runs</text>
<text x="670" y="222" font-size="11.5" fill="#222222" text-anchor="start">onlyIf and up-to-date checks</text>
<text x="670" y="238" font-size="11.5" fill="#222222" text-anchor="start">doFirst, the task action, doLast</text>
<text x="670" y="254" font-size="11.5" fill="#222222" text-anchor="start">dependency resolution (deferred)</text>
<text x="670" y="270" font-size="11.5" fill="#222222" text-anchor="start">build service close(), flow actions</text>
<text x="670" y="300" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold">Produces</text>
<text x="670" y="318" font-size="11.5" fill="#222222" text-anchor="start">task outputs and reports</text>
<text x="670" y="334" font-size="11.5" fill="#222222" text-anchor="start">BUILD SUCCESSFUL or BUILD FAILED</text>
<line x1="304" y1="250" x2="338" y2="250" stroke="#777777" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="620" y1="250" x2="654" y2="250" stroke="#777777" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="24" y="456" width="576" height="38" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="312" y="472" font-size="12" fill="#6b4e00" text-anchor="middle" font-weight="bold">Configuration cache hit: phases 1 and 2 are skipped and the stored task graph is loaded</text>
<text x="312" y="487" font-size="11.5" fill="#6b4e00" text-anchor="middle">(settings and build script bodies, and the hooks they registered, do not run)</text>
<path d="M600,475 L796,475 L796,432" fill="none" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="480" y="540" font-size="12" fill="#444444" text-anchor="middle">Task actions (doFirst, doLast, @TaskAction) are the only code that belongs in phase 3.</text>
<text x="480" y="558" font-size="12" fill="#444444" text-anchor="middle">A println placed directly in a task configuration block runs in phase 2, before any task executes.</text>
</svg>
