<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="470" fill="#ffffff"/>
<defs>
<marker id="mp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
</defs>
<text x="480" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a rejected request to a Grafana panel: the Bucket4j metrics pipeline</text>
<text x="480" y="46" font-size="12" fill="#444444" text-anchor="middle">Every box runs per application instance except Prometheus and Grafana, so each replica reports its own counts.</text>

<rect x="12" y="62" width="936" height="248" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
<text x="28" y="86" font-size="13" font-weight="bold" fill="#444444">Application instance (client JVM)</text>

<rect x="28" y="100" width="200" height="120" rx="8" fill="#fdf3ea" stroke="#b34700" stroke-width="2"/>
<text x="128" y="124" font-size="14" font-weight="bold" fill="#b34700" text-anchor="middle">BucketListener</text>
<text x="128" y="144" font-size="11" fill="#444444" text-anchor="middle">onConsumed(tokens)</text>
<text x="128" y="160" font-size="11" fill="#444444" text-anchor="middle">onRejected(tokens)</text>
<text x="128" y="176" font-size="11" fill="#444444" text-anchor="middle">onParked / onDelayed (nanos)</text>
<text x="128" y="192" font-size="11" fill="#444444" text-anchor="middle">onInterrupted</text>
<text x="128" y="209" font-size="10" fill="#b34700" text-anchor="middle">ProxyManager default or withListener</text>

<line x1="228" y1="160" x2="288" y2="160" stroke="#1c4b73" stroke-width="2" marker-end="url(#mp-arrow)"/>

<rect x="288" y="100" width="210" height="120" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="2"/>
<text x="393" y="124" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Micrometer MeterRegistry</text>
<text x="393" y="144" font-size="11" fill="#444444" text-anchor="middle">Counter  tokens by plan, outcome</text>
<text x="393" y="160" font-size="11" fill="#444444" text-anchor="middle">Timer  time spent parked</text>
<text x="393" y="176" font-size="11" fill="#444444" text-anchor="middle">Gauge  tokens left in a quota</text>
<text x="393" y="192" font-size="11" fill="#444444" text-anchor="middle">common tag application</text>
<text x="393" y="209" font-size="10" fill="#1c4b73" text-anchor="middle">tags: plan, outcome (never the key)</text>

<line x1="498" y1="160" x2="558" y2="160" stroke="#1c4b73" stroke-width="2" marker-end="url(#mp-arrow)"/>

<rect x="558" y="100" width="180" height="120" rx="8" fill="#eef7f0" stroke="#2a7d3f" stroke-width="2"/>
<text x="648" y="124" font-size="14" font-weight="bold" fill="#2a7d3f" text-anchor="middle">/actuator/prometheus</text>
<text x="648" y="144" font-size="11" fill="#444444" text-anchor="middle">dots become underscores</text>
<text x="648" y="160" font-size="11" fill="#444444" text-anchor="middle">counters end in _total</text>
<text x="648" y="176" font-size="11" fill="#444444" text-anchor="middle">timers end in _seconds</text>
<text x="648" y="192" font-size="11" fill="#444444" text-anchor="middle">text format, one line per series</text>

<rect x="28" y="236" width="470" height="60" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="263" y="258" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">Also feeding the registry, without your code</text>
<text x="263" y="277" font-size="11" fill="#444444" text-anchor="middle">starter: bucket4j_summary_consumed / _rejected   |   http.server.requests status 429</text>
<line x1="393" y1="236" x2="393" y2="220" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mp-arrow)"/>

<line x1="738" y1="160" x2="788" y2="160" stroke="#1c4b73" stroke-width="2" marker-end="url(#mp-arrow)"/>
<text x="763" y="150" font-size="10" fill="#444444" text-anchor="middle">scrape</text>

<rect x="788" y="100" width="148" height="120" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="2"/>
<text x="862" y="124" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Prometheus</text>
<text x="862" y="144" font-size="11" fill="#444444" text-anchor="middle">stores the series</text>
<text x="862" y="160" font-size="11" fill="#444444" text-anchor="middle">sums replicas</text>
<text x="862" y="176" font-size="11" fill="#444444" text-anchor="middle">evaluates rules</text>
<text x="862" y="192" font-size="11" fill="#444444" text-anchor="middle">rate(), histogram_quantile()</text>

<line x1="862" y1="220" x2="862" y2="330" stroke="#1c4b73" stroke-width="2" marker-end="url(#mp-arrow)"/>

<rect x="612" y="332" width="324" height="124" rx="8" fill="#fdf3ea" stroke="#b34700" stroke-width="2"/>
<text x="774" y="356" font-size="14" font-weight="bold" fill="#b34700" text-anchor="middle">Grafana</text>
<text x="774" y="376" font-size="11" fill="#444444" text-anchor="middle">rejections per plan, rejection ratio</text>
<text x="774" y="392" font-size="11" fill="#444444" text-anchor="middle">tokens per second by outcome, tokens remaining</text>
<text x="774" y="408" font-size="11" fill="#444444" text-anchor="middle">decision latency p99, backend errors</text>
<text x="774" y="428" font-size="11" fill="#b34700" text-anchor="middle">alert rules (Prometheus or Grafana): rejection ratio,</text>
<text x="774" y="444" font-size="11" fill="#b34700" text-anchor="middle">backend errors, slow decisions, low quota</text>

<rect x="28" y="332" width="548" height="124" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
<text x="302" y="356" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">What the listener cannot see</text>
<text x="44" y="380" font-size="11" fill="#444444">The listener always runs on the client: each replica counts only its own calls.</text>
<text x="44" y="398" font-size="11" fill="#444444">Cluster totals come from sum() in Prometheus, not from Bucket4j.</text>
<text x="44" y="416" font-size="11" fill="#444444">It fires on consumption, so a quota nobody touches reports nothing: use a Gauge.</text>
<text x="44" y="434" font-size="11" fill="#444444">A backend failure throws before any event: count it where the call is made.</text>
</svg>
