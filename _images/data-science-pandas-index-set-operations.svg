<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
<title>Set operations on Index objects</title>
<desc>Index A holds 1, 2, 3, 4 and index B holds 3, 4, 5. The union is 1 to 5, the intersection is 3 and 4, the difference A minus B is 1 and 2 and the symmetric difference is 1, 2 and 5.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">Index set operations</text>
<text x="40" y="82" font-size="14" font-weight="bold" fill="#0F172A">A</text>
<rect x="200" y="60" width="50" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="225.0" y="81.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<rect x="260" y="60" width="50" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="285.0" y="81.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<rect x="320" y="60" width="50" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="345.0" y="81.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<rect x="380" y="60" width="50" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="405.0" y="81.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">4</text>
<text x="40" y="127" font-size="14" font-weight="bold" fill="#0F172A">B</text>
<rect x="200" y="105" width="50" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="225.0" y="126.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<rect x="260" y="105" width="50" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="285.0" y="126.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">4</text>
<rect x="320" y="105" width="50" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="345.0" y="126.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">5</text>
<line x1="120" y1="150" x2="680" y2="150" stroke="#94A3B8" stroke-width="1.5"/>
<text x="40" y="192" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">A.union(B)</text>
<rect x="380" y="170" width="50" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="405.0" y="191.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<rect x="440" y="170" width="50" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="465.0" y="191.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<rect x="500" y="170" width="50" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="525.0" y="191.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<rect x="560" y="170" width="50" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="585.0" y="191.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">4</text>
<rect x="620" y="170" width="50" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="645.0" y="191.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">5</text>
<text x="40" y="242" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">A.intersection(B)</text>
<rect x="380" y="220" width="50" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="405.0" y="241.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<rect x="440" y="220" width="50" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="465.0" y="241.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">4</text>
<text x="40" y="292" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">A.difference(B)</text>
<rect x="380" y="270" width="50" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="405.0" y="291.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<rect x="440" y="270" width="50" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="465.0" y="291.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<text x="40" y="342" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">A.symmetric_difference(B)</text>
<rect x="380" y="320" width="50" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="405.0" y="341.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<rect x="440" y="320" width="50" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="465.0" y="341.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<rect x="500" y="320" width="50" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="525.0" y="341.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">5</text>
<text x="40" y="380" font-size="12" fill="#475569">Results are sorted when the values can be sorted.</text>
<text x="40" y="398" font-size="12" fill="#475569">Pass sort=False to union or symmetric_difference to keep the order of appearance.</text>
