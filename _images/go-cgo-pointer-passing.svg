<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
<text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What may cross the cgo boundary</text>
<text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the garbage collector moves nothing but must know every Go pointer; C knows nothing about the collector</text>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
</defs>
<rect x="30" y="70" width="330" height="270" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="195" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Go heap (garbage collected)</text>
<rect x="580" y="70" width="330" height="270" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="745" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">C memory (malloc, C.CString, C.CBytes)</text>
<line x1="470" y1="64" x2="470" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="7 5"/>
<text x="470" y="362" font-size="12" fill="#555555" text-anchor="middle">cgo call boundary</text>
<rect x="55" y="120" width="130" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.5"/>
<text x="120" y="147" font-size="12" fill="#222222" text-anchor="middle">pinned [N]byte</text>
<rect x="55" y="190" width="130" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.5"/>
<text x="120" y="217" font-size="12" fill="#222222" text-anchor="middle">struct { p *T }</text>
<rect x="215" y="190" width="115" height="44" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="272" y="210" font-size="12" fill="#222222" text-anchor="middle">T (unpinned)</text>
<text x="272" y="226" font-size="10" fill="#666666" text-anchor="middle">may be moved or freed</text>
<line x1="185" y1="212" x2="213" y2="212" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="55" y="262" width="130" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.5"/>
<text x="120" y="289" font-size="12" fill="#222222" text-anchor="middle">cgo.Handle (uintptr)</text>
<rect x="610" y="120" width="130" height="44" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="675" y="147" font-size="12" fill="#222222" text-anchor="middle">C function arg</text>
<rect x="610" y="262" width="130" height="44" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="675" y="289" font-size="12" fill="#222222" text-anchor="middle">C struct field</text>
<rect x="770" y="190" width="115" height="44" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="827" y="217" font-size="12" fill="#222222" text-anchor="middle">C struct</text>
<line x1="185" y1="142" x2="608" y2="142" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrg)"/>
<text x="396" y="136" font-size="11" fill="#2e7d32" text-anchor="middle">allowed during the call</text>
<line x1="185" y1="284" x2="608" y2="284" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrg)"/>
<text x="396" y="278" font-size="11" fill="#2e7d32" text-anchor="middle">allowed, even if C keeps it</text>
<line x1="185" y1="214" x2="768" y2="214" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrr)"/>
<text x="470" y="232" font-size="11" fill="#b3261e" text-anchor="middle">runtime panic: Go pointer to unpinned Go pointer</text>
<rect x="30" y="378" width="880" height="48" rx="6" fill="#f7f7f7" stroke="#bbbbbb"/>
<text x="470" y="398" font-size="12" fill="#222222" text-anchor="middle">Fixes: pin with runtime.Pinner for as long as C may use the memory, let C own the memory,</text>
<text x="470" y="416" font-size="12" fill="#222222" text-anchor="middle">or give C a runtime/cgo.Handle instead of a pointer. Never store a Go pointer in C memory unpinned.</text>
</svg>
