<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf API at a glance</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">the running scenario of this section, from client to database</text>

  <!-- Clients -->
  <rect x="20" y="70" width="140" height="150" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="90" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="90" y="118" font-size="11" fill="#444444" text-anchor="middle">Browser / SPA</text>
  <text x="90" y="138" font-size="11" fill="#444444" text-anchor="middle">curl, HTTPie</text>
  <text x="90" y="158" font-size="11" fill="#444444" text-anchor="middle">Mobile app</text>
  <text x="90" y="178" font-size="11" fill="#444444" text-anchor="middle">Other services</text>
  <text x="90" y="204" font-size="10" fill="#666666" text-anchor="middle">HTTP, SSE, WebSocket</text>

  <!-- Proxy + server -->
  <rect x="200" y="70" width="140" height="150" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="270" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Reverse proxy</text>
  <text x="270" y="112" font-size="10" fill="#666666" text-anchor="middle">TLS, routing</text>
  <line x1="215" y1="124" x2="325" y2="124" stroke="#bbbbbb" stroke-width="1"/>
  <text x="270" y="146" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">ASGI server</text>
  <text x="270" y="164" font-size="11" fill="#444444" text-anchor="middle">Uvicorn workers</text>
  <text x="270" y="182" font-size="10" fill="#666666" text-anchor="middle">fastapi run</text>

  <line x1="160" y1="145" x2="194" y2="145" stroke="#444444" stroke-width="1.4"/>
  <polygon points="200,145 192,140 192,150" fill="#444444"/>

  <!-- FastAPI app -->
  <rect x="380" y="62" width="360" height="238" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="560" y="84" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Bookshelf FastAPI application</text>

  <rect x="394" y="96" width="332" height="44" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.2"/>
  <text x="560" y="114" font-size="11" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Middleware</text>
  <text x="560" y="130" font-size="10" fill="#444444" text-anchor="middle">CORS, proxy headers, GZip</text>

  <rect x="394" y="150" width="332" height="62" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="560" y="168" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">Routers (path operations)</text>
  <text x="560" y="184" font-size="10" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">books  authors  reviews  auth</text>
  <text x="560" y="200" font-size="10" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">covers  /reviews/stream  /ws/books</text>

  <rect x="394" y="222" width="332" height="66" fill="#ffffff" stroke="#7a4a00" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="560" y="240" font-size="11" font-weight="bold" fill="#7a4a00" text-anchor="middle">Dependencies and models</text>
  <text x="560" y="256" font-size="10" fill="#444444" text-anchor="middle">get_session, get_settings, get_current_user</text>
  <text x="560" y="272" font-size="10" fill="#444444" text-anchor="middle">Pydantic / SQLModel models, OAuth2 + JWT, scopes</text>

  <line x1="340" y1="145" x2="374" y2="145" stroke="#444444" stroke-width="1.4"/>
  <polygon points="380,145 372,140 372,150" fill="#444444"/>
  <text x="360" y="136" font-size="10" fill="#666666" text-anchor="middle">ASGI</text>

  <!-- Data stores -->
  <rect x="380" y="340" width="150" height="76" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="455" y="364" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">PostgreSQL</text>
  <text x="455" y="382" font-size="10" fill="#444444" text-anchor="middle">books, authors, reviews, users</text>
  <text x="455" y="398" font-size="10" fill="#666666" text-anchor="middle">SQLite in tests</text>

  <rect x="570" y="340" width="170" height="76" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="655" y="364" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Cover storage</text>
  <text x="655" y="382" font-size="10" fill="#444444" text-anchor="middle">uploaded images on disk</text>
  <text x="655" y="398" font-size="10" fill="#666666" text-anchor="middle">or object storage</text>

  <line x1="455" y1="300" x2="455" y2="334" stroke="#444444" stroke-width="1.4"/>
  <polygon points="455,340 450,332 460,332" fill="#444444"/>
  <text x="463" y="322" font-size="10" fill="#666666">SQLModel session</text>

  <line x1="655" y1="300" x2="655" y2="334" stroke="#444444" stroke-width="1.4"/>
  <polygon points="655,340 650,332 660,332" fill="#444444"/>
  <text x="663" y="322" font-size="10" fill="#666666">UploadFile</text>

  <!-- Front-end + docs -->
  <rect x="20" y="260" width="320" height="156" fill="#f4f4f4" stroke="#444444" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="180" y="284" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Also served by the same app</text>
  <text x="180" y="310" font-size="11" fill="#444444" text-anchor="middle">/docs and /redoc (generated from OpenAPI)</text>
  <text x="180" y="330" font-size="11" fill="#444444" text-anchor="middle">/openapi.json (the machine-readable contract)</text>
  <text x="180" y="350" font-size="11" fill="#444444" text-anchor="middle">Jinja pages and static files</text>
  <text x="180" y="370" font-size="11" fill="#444444" text-anchor="middle">the SPA front end</text>
  <text x="180" y="396" font-size="10" fill="#666666" text-anchor="middle">a WebSocket chat per book, an SSE feed of new reviews</text>

  <line x1="340" y1="330" x2="374" y2="270" stroke="#444444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="380,262 370,268 378,274" fill="#444444"/>
</svg>
