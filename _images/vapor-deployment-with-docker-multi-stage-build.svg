<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Vapor template Dockerfile: two stages, one /staging folder</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the toolchain stays in the build stage; only the executable and its resources cross over (Swift 6.3, Ubuntu noble)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7410e"/></marker>
  </defs>

  <!-- build stage -->
  <rect x="20" y="62" width="540" height="394" rx="10" fill="#f4f8fc" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="40" y="86" font-size="14" font-weight="bold" fill="#1f5f99">Stage 1: build</text>
  <text x="40" y="103" font-size="11" fill="#222222">FROM swift:6.3-noble AS build  (about 5.3 GB on disk, thrown away)</text>

  <rect x="40" y="116" width="500" height="40" rx="6" fill="#e3f0fb" stroke="#1f5f99"/>
  <text x="54" y="133" font-size="12" font-weight="bold" fill="#222222">1  OS updates and libjemalloc-dev</text>
  <text x="54" y="148" font-size="11" fill="#222222">apt-get dist-upgrade, apt-get install libjemalloc-dev</text>

  <rect x="40" y="164" width="500" height="54" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="54" y="181" font-size="12" font-weight="bold" fill="#222222">2  Resolve dependencies (cached layer)</text>
  <text x="54" y="196" font-size="11" fill="#222222">COPY ./Package.* ./  then  swift package resolve --force-resolved-versions</text>
  <text x="54" y="210" font-size="10" fill="#2e7d32">reused until Package.swift or Package.resolved changes</text>

  <rect x="40" y="226" width="500" height="40" rx="6" fill="#e3f0fb" stroke="#1f5f99"/>
  <text x="54" y="243" font-size="12" font-weight="bold" fill="#222222">3  Copy the whole repository</text>
  <text x="54" y="258" font-size="11" fill="#222222">COPY . .  (the .dockerignore skips .build/ and .swiftpm/)</text>

  <rect x="40" y="274" width="500" height="68" rx="6" fill="#fdf1e7" stroke="#b7410e"/>
  <text x="54" y="291" font-size="12" font-weight="bold" fill="#222222">4  Compile the release product</text>
  <text x="54" y="306" font-size="11" fill="#222222">RUN --mount=type=cache,target=/build/.build swift build -c release</text>
  <text x="54" y="320" font-size="11" fill="#222222">--product Bookshelf --static-swift-stdlib -Xlinker -ljemalloc</text>
  <text x="54" y="335" font-size="10" fill="#b7410e">the cache mount keeps .build between builds, so edits recompile incrementally</text>

  <rect x="40" y="350" width="500" height="92" rx="6" fill="#f3e9f7" stroke="#6a3d9a"/>
  <text x="54" y="367" font-size="12" font-weight="bold" fill="#222222">5  Stage the result in /staging</text>
  <text x="54" y="383" font-size="11" fill="#222222">the Bookshelf executable (copied out of the cache mount)</text>
  <text x="54" y="397" font-size="11" fill="#222222">SwiftPM *.resources bundles</text>
  <text x="54" y="411" font-size="11" fill="#222222">swift-backtrace-static  (from /usr/libexec/swift/linux)</text>
  <text x="54" y="425" font-size="11" fill="#222222">Public/ and Resources/ when they exist, chmod -R a-w</text>

  <!-- run stage -->
  <rect x="640" y="62" width="280" height="394" rx="10" fill="#f4faf5" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="86" font-size="14" font-weight="bold" fill="#2e7d32">Stage 2: run</text>
  <text x="660" y="103" font-size="11" fill="#222222">FROM ubuntu:noble  (the image you ship)</text>

  <rect x="656" y="116" width="248" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="668" y="133" font-size="12" font-weight="bold" fill="#222222">A  Runtime packages only</text>
  <text x="668" y="148" font-size="11" fill="#222222">libjemalloc2, ca-certificates,</text>
  <text x="668" y="161" font-size="11" fill="#222222">tzdata</text>

  <rect x="656" y="176" width="248" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="668" y="193" font-size="12" font-weight="bold" fill="#222222">B  Unprivileged user</text>
  <text x="668" y="208" font-size="11" fill="#222222">useradd vapor, home and</text>
  <text x="668" y="221" font-size="11" fill="#222222">WORKDIR /app</text>

  <rect x="656" y="236" width="248" height="52" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="2"/>
  <text x="668" y="253" font-size="12" font-weight="bold" fill="#222222">C  COPY --from=build</text>
  <text x="668" y="268" font-size="11" fill="#222222">--chown=vapor:vapor</text>
  <text x="668" y="281" font-size="11" fill="#222222">/staging  to  /app</text>

  <rect x="656" y="296" width="248" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="668" y="313" font-size="12" font-weight="bold" fill="#222222">D  Process settings</text>
  <text x="668" y="328" font-size="11" fill="#222222">ENV SWIFT_BACKTRACE=enable=yes,...</text>
  <text x="668" y="342" font-size="11" fill="#222222">USER vapor:vapor, EXPOSE 8080</text>
  <text x="668" y="354" font-size="10" fill="#2e7d32">nothing after this runs as root</text>

  <rect x="656" y="368" width="248" height="76" rx="6" fill="#fdf1e7" stroke="#b7410e"/>
  <text x="668" y="385" font-size="12" font-weight="bold" fill="#222222">E  Start command</text>
  <text x="668" y="400" font-size="11" fill="#222222">ENTRYPOINT ["./Bookshelf"]</text>
  <text x="668" y="414" font-size="11" fill="#222222">CMD ["serve", "--env", "production",</text>
  <text x="668" y="428" font-size="11" fill="#222222">"--hostname", "0.0.0.0", "--port", "8080"]</text>

  <!-- transfer arrow -->
  <path d="M540 396 L626 396 L626 262 L654 262" fill="none" stroke="#b7410e" stroke-width="2" marker-end="url(#b)"/>
  <text x="566" y="338" font-size="11" fill="#b7410e" font-weight="bold">only</text>
  <text x="566" y="352" font-size="11" fill="#b7410e" font-weight="bold">/staging</text>
  <text x="566" y="366" font-size="11" fill="#b7410e" font-weight="bold">crosses</text>

  <!-- not shipped -->
  <rect x="20" y="472" width="540" height="72" rx="8" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="36" y="492" font-size="12" font-weight="bold" fill="#666666">Left behind in stage 1</text>
  <text x="36" y="510" font-size="11" fill="#444444">the Swift toolchain and compilers, libjemalloc-dev, the sources and Package.resolved checkouts,</text>
  <text x="36" y="526" font-size="11" fill="#444444">the .build directory (a cache mount, never part of an image layer) and the apt lists</text>

  <rect x="640" y="472" width="280" height="72" rx="8" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="656" y="492" font-size="12" font-weight="bold" fill="#666666">Measured for this page (arm64)</text>
  <text x="656" y="510" font-size="11" fill="#444444">final image 433 MB on disk,</text>
  <text x="656" y="526" font-size="11" fill="#444444">of which the executable is 203 MB</text>
</svg>
