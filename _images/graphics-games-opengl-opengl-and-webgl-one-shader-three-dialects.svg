<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-and-webgl-one-shader-three-dialects" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Bookshelf fragment shader in three dialects</text>
<rect x="20" y="48" width="236" height="250" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="138" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Desktop GL 4.60</text>
<text x="32" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">#version 460 core</text>
<text x="32" y="118" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">in vec2 vUv;</text>
<text x="32" y="138" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">uniform sampler2D uCover;</text>
<text x="32" y="158" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">out vec4 fragColor;</text>
<text x="32" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">void main() {</text>
<text x="32" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  fragColor =</text>
<text x="32" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    texture(uCover, vUv);</text>
<text x="32" y="238" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<rect x="262" y="48" width="236" height="250" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="380" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">GL ES 3.00 / WebGL 2</text>
<text x="274" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">#version 300 es</text>
<text x="274" y="118" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">precision mediump float;</text>
<text x="274" y="138" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">in vec2 vUv;</text>
<text x="274" y="158" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">uniform sampler2D uCover;</text>
<text x="274" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">out vec4 fragColor;</text>
<text x="274" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">void main() {</text>
<text x="274" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  fragColor = texture(</text>
<text x="274" y="238" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    uCover, vUv); }</text>
<rect x="504" y="48" width="236" height="250" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="622" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">GLSL ES 1.00 / WebGL 1</text>
<text x="516" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">precision mediump float;</text>
<text x="516" y="118" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">varying vec2 vUv;</text>
<text x="516" y="138" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">uniform sampler2D uCover;</text>
<text x="516" y="158" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">void main() {</text>
<text x="516" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  gl_FragColor =</text>
<text x="516" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    texture2D(uCover, vUv);</text>
<text x="516" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<text x="516" y="238" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace"></text>
<text x="380" y="330" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Same intent, different spellings: version line, precision, in/out versus varying, texture versus texture2D.</text>
</svg>
