<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ms-mlet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A mesh split into meshlets</text>
<rect x="20" y="60" width="230" height="230" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="135" y="80" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Book mesh (triangles)</text>
<rect x="35" y="95" width="95" height="85" rx="4" fill="#D1FAE5" stroke="#4B5563"/>
<line x1="35" y1="95" x2="67" y2="180" stroke="#9CA3AF"/>
<line x1="67" y1="95" x2="99" y2="180" stroke="#9CA3AF"/>
<line x1="99" y1="95" x2="131" y2="180" stroke="#9CA3AF"/>
<text x="82" y="140" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">meshlet 0</text>
<rect x="140" y="95" width="95" height="85" rx="4" fill="#EEF2FF" stroke="#4B5563"/>
<line x1="140" y1="95" x2="172" y2="180" stroke="#9CA3AF"/>
<line x1="172" y1="95" x2="204" y2="180" stroke="#9CA3AF"/>
<line x1="204" y1="95" x2="236" y2="180" stroke="#9CA3AF"/>
<text x="187" y="140" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">meshlet 1</text>
<rect x="35" y="190" width="95" height="85" rx="4" fill="#FEF3C7" stroke="#4B5563"/>
<line x1="35" y1="190" x2="67" y2="275" stroke="#9CA3AF"/>
<line x1="67" y1="190" x2="99" y2="275" stroke="#9CA3AF"/>
<line x1="99" y1="190" x2="131" y2="275" stroke="#9CA3AF"/>
<text x="82" y="235" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">meshlet 2</text>
<rect x="140" y="190" width="95" height="85" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<line x1="140" y1="190" x2="172" y2="275" stroke="#9CA3AF"/>
<line x1="172" y1="190" x2="204" y2="275" stroke="#9CA3AF"/>
<line x1="204" y1="190" x2="236" y2="275" stroke="#9CA3AF"/>
<text x="187" y="235" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">meshlet 3</text>
<line x1="252" y1="175" x2="300" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ms-mlet)"/>
<rect x="300" y="60" width="440" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="520" y="80" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Per-meshlet record (read by object or mesh function)</text>
<rect x="320" y="95" width="400" height="28" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="520" y="114" text-anchor="middle" font-size="11" fill="#374151">vertexOffset, vertexCount (up to 64)</text>
<rect x="320" y="131" width="400" height="28" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="520" y="150" text-anchor="middle" font-size="11" fill="#374151">triangleOffset, triangleCount (up to 126)</text>
<rect x="320" y="167" width="400" height="28" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="520" y="186" text-anchor="middle" font-size="11" fill="#374151">bounding sphere: center, radius</text>
<rect x="320" y="203" width="400" height="28" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="520" y="222" text-anchor="middle" font-size="11" fill="#374151">normal cone: axis, cutoff</text>
<rect x="320" y="239" width="400" height="28" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="520" y="258" text-anchor="middle" font-size="11" fill="#374151">lodLevel, materialIndex</text>
<text x="380" y="320" text-anchor="middle" font-size="11" fill="#4B5563">The limits shown (64 vertices, 126 triangles) are a common choice, not a Metal requirement.</text>
</svg>
