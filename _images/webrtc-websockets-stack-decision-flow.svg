<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Decision flow for choosing a WebSocket server stack: start from the stack you already run, ask whether third-party clients need a plain WebSocket, then whether the library should supply rooms, acknowledgements and fallbacks, then pick by runtime</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Choosing a WebSocket server stack</text>

  <rect x="250" y="44" width="300" height="38" rx="19" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="400" y="68" font-size="12" font-weight="bold" fill="#4a148c" text-anchor="middle">Start with the language you already run</text>

  <line x1="400" y1="82" x2="400" y2="104" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="190" y="104" width="420" height="52" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="400" y="126" font-size="12" font-weight="bold" fill="#0d3c75" text-anchor="middle">Must third-party or non-browser clients</text>
  <text x="400" y="144" font-size="12" font-weight="bold" fill="#0d3c75" text-anchor="middle">connect with a plain WebSocket?</text>

  <text x="140" y="124" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">yes</text>
  <path d="M190,130 L90,130 L90,206" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="408" y="186" font-size="11" font-weight="bold" fill="#c62828">no</text>
  <line x1="400" y1="156" x2="400" y2="206" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="206" width="240" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="140" y="228" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Raw WebSocket server</text>
  <text x="140" y="248" font-size="11" fill="#1b5e20" text-anchor="middle">Node.js: ws</text>
  <text x="140" y="264" font-size="11" fill="#1b5e20" text-anchor="middle">Python: websockets, Starlette, Tornado</text>
  <text x="140" y="280" font-size="11" fill="#1b5e20" text-anchor="middle">Java: Quarkus, Spring WebFlux</text>
  <text x="140" y="296" font-size="11" fill="#1b5e20" text-anchor="middle">Rust: Axum, Go, .NET: ASP.NET Core</text>
  <text x="140" y="316" font-size="10" font-style="italic" fill="#1b5e20" text-anchor="middle">You write rooms, acks, resume</text>
  <text x="140" y="332" font-size="10" font-style="italic" fill="#1b5e20" text-anchor="middle">(Chatterbox v1 as specified)</text>

  <rect x="290" y="206" width="440" height="52" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="510" y="228" font-size="12" font-weight="bold" fill="#0d3c75" text-anchor="middle">Should the library supply rooms, acknowledgements,</text>
  <text x="510" y="246" font-size="12" font-weight="bold" fill="#0d3c75" text-anchor="middle">reconnection and transport fallback?</text>

  <text x="275" y="224" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">no</text>
  <line x1="290" y1="232" x2="262" y2="232" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="282" font-size="11" font-weight="bold" fill="#2e7d32">yes: pick by runtime</text>
  <line x1="510" y1="258" x2="510" y2="296" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>


  <rect x="290" y="300" width="210" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="395" y="320" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">Socket.IO</text>
  <text x="395" y="337" font-size="10.5" fill="#6d4c00" text-anchor="middle">Node.js server, python-socketio,</text>
  <text x="395" y="351" font-size="10.5" fill="#6d4c00" text-anchor="middle">clients in many languages</text>

  <rect x="520" y="300" width="210" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="625" y="320" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">SignalR</text>
  <text x="625" y="337" font-size="10.5" fill="#6d4c00" text-anchor="middle">.NET hubs, JS, .NET and Java</text>
  <text x="625" y="351" font-size="10.5" fill="#6d4c00" text-anchor="middle">clients, Azure SignalR scaling</text>

  <rect x="290" y="374" width="210" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="395" y="394" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">Django Channels</text>
  <text x="395" y="411" font-size="10.5" fill="#6d4c00" text-anchor="middle">Django projects: consumers,</text>
  <text x="395" y="425" font-size="10.5" fill="#6d4c00" text-anchor="middle">groups and a Redis channel layer</text>

  <rect x="520" y="374" width="210" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="625" y="394" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">Atmosphere</text>
  <text x="625" y="411" font-size="10.5" fill="#6d4c00" text-anchor="middle">Java servlet containers with</text>
  <text x="625" y="425" font-size="10.5" fill="#6d4c00" text-anchor="middle">broadcasters and 3 transports</text>

  <rect x="290" y="448" width="210" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="395" y="468" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">Laravel Reverb and Swoole</text>
  <text x="395" y="485" font-size="10.5" fill="#6d4c00" text-anchor="middle">PHP: Pusher protocol with Echo,</text>
  <text x="395" y="499" font-size="10.5" fill="#6d4c00" text-anchor="middle">or a coroutine WebSocket server</text>

  <rect x="520" y="448" width="210" height="62" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="625" y="468" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">uWebSockets.js</text>
  <text x="625" y="485" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Node.js raw server for the highest</text>
  <text x="625" y="499" font-size="10.5" fill="#7f1d1d" text-anchor="middle">connection density; no fallbacks</text>

  <text x="400" y="540" font-size="10.5" fill="#555555" text-anchor="middle">Whatever you pick, every stack in this section can implement the same Chatterbox v1 protocol.</text>
</svg>
