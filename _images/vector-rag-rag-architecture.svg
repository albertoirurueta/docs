<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">RAG: ingestion (offline) and query (online) paths</text>
  <text x="390" y="46" font-size="12" fill="#666666" text-anchor="middle">Both paths write to, or read from, the same DocsAssistant vector database</text>

  <!-- Ingestion path -->
  <rect x="30" y="70" width="720" height="150" rx="6" fill="#eef6ee" stroke="#2f6d34" stroke-width="1.5"/>
  <text x="50" y="94" font-size="13" font-weight="bold" fill="#2f6d34">Ingestion (offline)</text>

  <rect x="50" y="110" width="120" height="60" rx="5" fill="#ffffff" stroke="#2f6d34"/>
  <text x="110" y="135" font-size="11" fill="#2f6d34" text-anchor="middle">Source docs</text>
  <text x="110" y="150" font-size="10" fill="#5a8a5f" text-anchor="middle">AsciiDoc / PDF /</text>
  <text x="110" y="163" font-size="10" fill="#5a8a5f" text-anchor="middle">HTML / Markdown</text>

  <rect x="210" y="110" width="120" height="60" rx="5" fill="#ffffff" stroke="#2f6d34"/>
  <text x="270" y="135" font-size="11" fill="#2f6d34" text-anchor="middle">Chunking</text>
  <text x="270" y="150" font-size="10" fill="#5a8a5f" text-anchor="middle">split into chunks,</text>
  <text x="270" y="163" font-size="10" fill="#5a8a5f" text-anchor="middle">attach metadata</text>

  <rect x="370" y="110" width="120" height="60" rx="5" fill="#ffffff" stroke="#2f6d34"/>
  <text x="430" y="135" font-size="11" fill="#2f6d34" text-anchor="middle">Embedding</text>
  <text x="430" y="150" font-size="10" fill="#5a8a5f" text-anchor="middle">ollama.embed</text>
  <text x="430" y="163" font-size="10" fill="#5a8a5f" text-anchor="middle">nomic-embed-text</text>

  <rect x="530" y="110" width="180" height="60" rx="5" fill="#dcefe0" stroke="#2f6d34" stroke-width="1.5"/>
  <text x="620" y="135" font-size="11" font-weight="bold" fill="#1c4b26" text-anchor="middle">pgvector store</text>
  <text x="620" y="150" font-size="10" fill="#2f6d34" text-anchor="middle">chunks + chunk_embeddings</text>
  <text x="620" y="163" font-size="10" fill="#2f6d34" text-anchor="middle">docsassistant database</text>

  <line x1="170" y1="140" x2="210" y2="140" stroke="#2f6d34" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="330" y1="140" x2="370" y2="140" stroke="#2f6d34" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="490" y1="140" x2="530" y2="140" stroke="#2f6d34" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Query path -->
  <rect x="30" y="250" width="720" height="240" rx="6" fill="#eaf1f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="50" y="274" font-size="13" font-weight="bold" fill="#1c4b73">Query (online)</text>

  <rect x="50" y="290" width="110" height="55" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="105" y="313" font-size="11" fill="#1c4b73" text-anchor="middle">User</text>
  <text x="105" y="327" font-size="10" fill="#5a7690" text-anchor="middle">question</text>

  <rect x="200" y="290" width="130" height="55" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="265" y="313" font-size="11" fill="#1c4b73" text-anchor="middle">Embed query</text>
  <text x="265" y="327" font-size="10" fill="#5a7690" text-anchor="middle">ollama.embed</text>

  <rect x="370" y="290" width="150" height="55" rx="5" fill="#dcefe0" stroke="#2f6d34" stroke-width="1.5"/>
  <text x="445" y="313" font-size="11" font-weight="bold" fill="#1c4b26" text-anchor="middle">pgvector store</text>
  <text x="445" y="327" font-size="10" fill="#2f6d34" text-anchor="middle">HNSW similarity search</text>

  <rect x="560" y="290" width="150" height="55" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="635" y="313" font-size="11" fill="#1c4b73" text-anchor="middle">Top-k chunks</text>
  <text x="635" y="327" font-size="10" fill="#5a7690" text-anchor="middle">retrieved context</text>

  <line x1="160" y1="317" x2="200" y2="317" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="330" y1="317" x2="370" y2="317" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="520" y1="317" x2="560" y2="317" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <rect x="200" y="390" width="220" height="60" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="310" y="413" font-size="11" fill="#1c4b73" text-anchor="middle">Prompt augmentation</text>
  <text x="310" y="428" font-size="10" fill="#5a7690" text-anchor="middle">context + question</text>
  <text x="310" y="441" font-size="10" fill="#5a7690" text-anchor="middle">system instructions</text>

  <rect x="460" y="390" width="200" height="60" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="560" y="413" font-size="11" fill="#1c4b73" text-anchor="middle">LLM generation</text>
  <text x="560" y="428" font-size="10" fill="#5a7690" text-anchor="middle">ollama.chat</text>
  <text x="560" y="441" font-size="10" fill="#5a7690" text-anchor="middle">llama3.1:8b</text>

  <line x1="635" y1="345" x2="500" y2="390" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="420" y1="420" x2="460" y2="420" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <text x="560" y="475" font-size="10.5" fill="#5a7690" text-anchor="middle">grounded answer with citations, back to the user</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6d34"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c4b73"/>
    </marker>
  </defs>
</svg>
