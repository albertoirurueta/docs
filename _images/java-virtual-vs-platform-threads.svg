<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Virtual threads mounting onto carrier platform threads</title>
  <desc>A wide row of many small virtual-thread boxes above a strip of four carrier (platform) thread boxes, each bound to an OS thread. Arrows show virtual threads mounting onto carriers; a callout notes that a blocked virtual thread unmounts and frees its carrier.</desc>

  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Virtual threads mount onto a small pool of carrier threads</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">Thousands of cheap virtual threads share a few platform (carrier) threads bound to OS threads.</text>

  <defs>
    <marker id="vh" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a8a4a"/>
    </marker>
    <marker id="vg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- ===================== virtual threads row ===================== -->
  <text x="380" y="70" font-size="10" fill="#5a8a4a" text-anchor="middle" font-style="italic">many virtual threads &#8212; scheduled by the JVM, hundreds of bytes each</text>

  <!-- 12 boxes, pitch 56, start x=32, width 46, height 24, y=78 -->
  <g font-family="'Courier New', monospace" font-size="8" text-anchor="middle">
    <rect x="32"  y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="55"  y="93" fill="#2f5424">vt</text>
    <rect x="88"  y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="111" y="93" fill="#2f5424">vt</text>
    <rect x="144" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="167" y="93" fill="#2f5424">vt</text>
    <rect x="200" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="223" y="93" fill="#2f5424">vt</text>
    <rect x="256" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="279" y="93" fill="#2f5424">vt</text>
    <rect x="312" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="335" y="93" fill="#2f5424">vt</text>
    <rect x="368" y="78" width="46" height="24" rx="3" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" stroke-dasharray="4,2"/><text x="391" y="93" fill="#7a2f2f">blk</text>
    <rect x="424" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="447" y="93" fill="#2f5424">vt</text>
    <rect x="480" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="503" y="93" fill="#2f5424">vt</text>
    <rect x="536" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="559" y="93" fill="#2f5424">vt</text>
    <rect x="592" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="615" y="93" fill="#2f5424">vt</text>
    <rect x="648" y="78" width="46" height="24" rx="3" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/><text x="671" y="93" fill="#2f5424">vt</text>
  </g>

  <!-- ===================== mount arrows ===================== -->
  <g stroke="#5a8a4a" stroke-width="1.4">
    <line x1="55"  y1="102" x2="112" y2="196" marker-end="url(#vh)"/>
    <line x1="223" y1="102" x2="292" y2="196" marker-end="url(#vh)"/>
    <line x1="503" y1="102" x2="470" y2="196" marker-end="url(#vh)"/>
    <line x1="671" y1="102" x2="650" y2="196" marker-end="url(#vh)"/>
  </g>
  <text x="150" y="150" font-size="8.5" fill="#5a8a4a" text-anchor="middle" transform="rotate(58 150 150)">mounts</text>

  <!-- blocked -> unmounted callout -->
  <path d="M 391 78 C 391 55, 470 50, 520 66" fill="none" stroke="#a05a5a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#vg)"/>
  <rect x="516" y="54" width="232" height="56" rx="4" fill="#fbfbf6" stroke="#c9b96a" stroke-width="1.3"/>
  <text x="632" y="72" font-size="9.5" fill="#7a2f2f" text-anchor="middle" font-weight="bold">blocked &#8594; unmounted</text>
  <text x="632" y="87" font-size="9" fill="#555555" text-anchor="middle">the virtual thread parks off-carrier;</text>
  <text x="632" y="100" font-size="9" fill="#555555" text-anchor="middle">the carrier is freed for other work</text>

  <!-- ===================== carrier threads strip ===================== -->
  <text x="380" y="185" font-size="10" fill="#4a6a8a" text-anchor="middle" font-style="italic">3&#8211;4 carrier (platform) threads &#8212; one per OS thread, = available parallelism</text>

  <g font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">
    <rect x="40"  y="196" width="150" height="40" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/><text x="115" y="221" fill="#1f3a52">carrier C0</text>
    <rect x="220" y="196" width="150" height="40" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/><text x="295" y="221" fill="#1f3a52">carrier C1</text>
    <rect x="400" y="196" width="150" height="40" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/><text x="475" y="221" fill="#1f3a52">carrier C2</text>
    <rect x="580" y="196" width="150" height="40" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/><text x="655" y="221" fill="#1f3a52">carrier C3</text>
  </g>

  <!-- carrier -> OS bindings -->
  <g stroke="#999999" stroke-width="1.2">
    <line x1="115" y1="236" x2="115" y2="286"/>
    <line x1="295" y1="236" x2="295" y2="286"/>
    <line x1="475" y1="236" x2="475" y2="286"/>
    <line x1="655" y1="236" x2="655" y2="286"/>
  </g>
  <text x="380" y="278" font-size="9" fill="#999999" text-anchor="middle" font-style="italic">bound to</text>

  <!-- ===================== OS threads ===================== -->
  <g font-family="'Courier New', monospace" font-size="9" text-anchor="middle">
    <rect x="40"  y="286" width="150" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/><text x="115" y="307" fill="#444444">OS thread</text>
    <rect x="220" y="286" width="150" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/><text x="295" y="307" fill="#444444">OS thread</text>
    <rect x="400" y="286" width="150" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/><text x="475" y="307" fill="#444444">OS thread</text>
    <rect x="580" y="286" width="150" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/><text x="655" y="307" fill="#444444">OS thread</text>
  </g>
  <text x="380" y="340" font-size="10" fill="#666666" text-anchor="middle">kernel scheduler</text>

  <!-- ===================== legend ===================== -->
  <g font-size="9" fill="#555555">
    <rect x="150" y="366" width="16" height="12" rx="2" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.2"/>
    <text x="172" y="376" text-anchor="start">runnable virtual thread mounted on a carrier</text>
    <rect x="150" y="386" width="16" height="12" rx="2" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" stroke-dasharray="4,2"/>
    <text x="172" y="396" text-anchor="start">blocked virtual thread &#8212; unmounted, holds no carrier</text>
    <rect x="150" y="406" width="16" height="12" rx="2" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
    <text x="172" y="416" text-anchor="start">carrier (platform) thread, one per OS thread</text>
  </g>
</svg>
