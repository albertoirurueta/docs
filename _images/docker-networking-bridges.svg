<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two user-defined bridge networks on one host</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Two user-defined bridge networks on one host</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">embedded DNS resolves container names per network; only the published port is reachable from outside</text>
  <rect x="20" y="60" width="720" height="340" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380" y="80" font-size="12" fill="#555555" text-anchor="middle" font-weight="bold">Docker host</text>
  <rect x="40" y="95" width="300" height="210" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="190" y="113" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">network "frontend"  (br-1a2b, 172.18.0.0/16)</text>
  <rect x="420" y="95" width="300" height="210" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="570" y="113" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">network "backend"  (br-3c4d, 172.19.0.0/16)</text>
  <rect x="60" y="140" width="120" height="60" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="120.0" y="165.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">web</text>
  <text x="120.0" y="181.2" font-size="9.5" fill="#333333" text-anchor="middle">172.18.0.2:80</text>
  <rect x="250" y="190" width="240" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="370.0" y="214.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">orders</text>
  <text x="370.0" y="229.5" font-size="9.5" fill="#333333" text-anchor="middle">frontend: 172.18.0.3</text>
  <text x="370.0" y="243.0" font-size="9.5" fill="#333333" text-anchor="middle">backend: 172.19.0.2</text>
  <rect x="580" y="140" width="120" height="60" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="640.0" y="165.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">orders-db</text>
  <text x="640.0" y="181.2" font-size="9.5" fill="#333333" text-anchor="middle">172.19.0.3:5432</text>
  <rect x="250" y="320" width="240" height="50" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="370.0" y="340.5" font-size="10.5" font-weight="bold" fill="#5b3a8c" text-anchor="middle">embedded DNS 127.0.0.11</text>
  <text x="370.0" y="356.0" font-size="9.5" fill="#333333" text-anchor="middle">orders-db -&gt; 172.19.0.3 (backend only)</text>
  <rect x="40" y="320" width="180" height="50" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="130.0" y="340.5" font-size="10.5" font-weight="bold" fill="#8f2a2a" text-anchor="middle">eth0 :8080</text>
  <text x="130.0" y="356.0" font-size="9.5" fill="#333333" text-anchor="middle">-p 8080:80 -&gt; web:80</text>
  <line x1="180" y1="170" x2="250" y2="215" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="215.0" y="187.5" font-size="9.5" fill="#555555" text-anchor="middle">http</text>
  <line x1="490" y1="215" x2="580" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="535.0" y="187.5" font-size="9.5" fill="#555555" text-anchor="middle">jdbc</text>
  <line x1="130" y1="320" x2="120" y2="200" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="150" y="270" font-size="9.5" fill="#555555" text-anchor="middle">DNAT</text>
  <line x1="370" y1="320" x2="370" y2="260" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="410" y="300" font-size="9.5" fill="#555555" text-anchor="middle">name lookup</text>
  <text x="380" y="425" font-size="10" fill="#555555" text-anchor="middle">web cannot reach orders-db: they share no network. orders joins both networks and bridges the tiers.</text>
</svg>
