<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Forest accuracy against the number of trees</title>
<desc id="d">Out-of-bag accuracy rises from 0.570 with 1 tree to 0.960 with 25 trees and 0.970 with 100 trees, then stays near 0.965 with 400 trees. Test accuracy goes from 0.889 to 0.953 and stays there.</desc>
