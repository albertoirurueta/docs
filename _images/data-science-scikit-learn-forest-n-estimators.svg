<line x1="100" y1="120.8" x2="670" y2="120.8" stroke="#CBD5E1" stroke-width="1"/>
<text x="92" y="124.8" font-size="12" fill="#475569" text-anchor="end">0.9</text>
<line x1="100" y1="76.0" x2="670" y2="76.0" stroke="#CBD5E1" stroke-width="1"/>
