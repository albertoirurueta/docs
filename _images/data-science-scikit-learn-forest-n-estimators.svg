<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">More trees help, then the curve flattens</text>
<text x="24" y="58" font-size="12" fill="#475569">Breast cancer data; logarithmic horizontal axis, vertical axis starts at 0.5</text>
