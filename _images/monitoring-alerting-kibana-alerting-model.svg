<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Kibana Classic Alerting model: a rule (conditions, check interval, actions) is run by Task Manager, queries Elasticsearch, creates alerts with a status, and each alert schedules actions by action group and frequency unless snoozed, muted or throttled; connectors deliver them to a webhook, e-mail or chat; Universal Alerting and Watcher are separate systems</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kibana Classic Alerting: from rule to notification</text>
<text x="480" y="44" font-size="10.5" fill="#555555" text-anchor="middle">Rules, connectors and alert documents are stored objects; Task Manager runs the checks, connectors deliver the actions</text>

<rect x="20" y="70" width="250" height="250" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
<text x="145" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Rule (saved object, per space)</text>
<rect x="36" y="104" width="218" height="52" rx="6" fill="#ffffff" stroke="#1976d2"/>
<text x="145" y="124" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Conditions</text>
<text x="145" y="142" font-size="10" fill="#222222" text-anchor="middle">5xx ratio above 0.05 for 5 minutes</text>
<rect x="36" y="164" width="218" height="52" rx="6" fill="#ffffff" stroke="#1976d2"/>
<text x="145" y="184" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Schedule</text>
<text x="145" y="202" font-size="10" fill="#222222" text-anchor="middle">check interval 1 minute, approximate</text>
<rect x="36" y="224" width="218" height="82" rx="6" fill="#ffffff" stroke="#1976d2"/>
<text x="145" y="244" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Actions (one or more)</text>
<text x="145" y="262" font-size="10" fill="#222222" text-anchor="middle">connector + action group</text>
<text x="145" y="278" font-size="10" fill="#222222" text-anchor="middle">frequency: summary, per alert</text>
<text x="145" y="294" font-size="10" fill="#222222" text-anchor="middle">message with Mustache variables</text>

<rect x="320" y="70" width="170" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="405" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Task Manager</text>
<text x="405" y="112" font-size="10" fill="#222222" text-anchor="middle">claims the rule task when due</text>
<text x="405" y="128" font-size="10" fill="#222222" text-anchor="middle">runs it with the rule's API key</text>
<text x="405" y="150" font-size="10" fill="#555555" text-anchor="middle">run result: succeeded,</text>
<text x="405" y="165" font-size="10" fill="#555555" text-anchor="middle">warning or failed</text>

<rect x="320" y="210" width="170" height="110" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
<text x="405" y="232" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Elasticsearch</text>
<text x="405" y="252" font-size="10" fill="#222222" text-anchor="middle">logs-*  metrics-*  traces-*</text>
<text x="405" y="268" font-size="10" fill="#222222" text-anchor="middle">query, aggregation or ES|QL</text>
<text x="405" y="290" font-size="10" fill="#555555" text-anchor="middle">alert documents are written</text>
<text x="405" y="305" font-size="10" fill="#555555" text-anchor="middle">to .alerts-* indices</text>

<rect x="540" y="70" width="190" height="250" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="635" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Alerts (one per group)</text>
<rect x="556" y="104" width="158" height="34" rx="6" fill="#ffffff" stroke="#8e24aa"/><text x="635" y="126" font-size="10.5" fill="#222222" text-anchor="middle">Active (action group fires)</text>
<rect x="556" y="146" width="158" height="34" rx="6" fill="#ffffff" stroke="#8e24aa"/><text x="635" y="168" font-size="10.5" fill="#222222" text-anchor="middle">Flapping (noise reduction)</text>
<rect x="556" y="188" width="158" height="34" rx="6" fill="#ffffff" stroke="#8e24aa"/><text x="635" y="210" font-size="10.5" fill="#222222" text-anchor="middle">Recovered (recovery action)</text>
<rect x="556" y="230" width="158" height="34" rx="6" fill="#ffffff" stroke="#8e24aa"/><text x="635" y="252" font-size="10.5" fill="#222222" text-anchor="middle">Untracked (closed by hand)</text>
<text x="635" y="288" font-size="10" fill="#555555" text-anchor="middle">snooze, mute, throttle and</text>
<text x="635" y="303" font-size="10" fill="#555555" text-anchor="middle">maintenance windows stop actions</text>

<rect x="780" y="70" width="160" height="250" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="860" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Connectors</text>
<rect x="796" y="106" width="128" height="34" rx="6" fill="#ffffff" stroke="#616161"/><text x="860" y="128" font-size="10.5" fill="#222222" text-anchor="middle">Webhook (lab)</text>
<rect x="796" y="150" width="128" height="34" rx="6" fill="#ffffff" stroke="#616161"/><text x="860" y="172" font-size="10.5" fill="#222222" text-anchor="middle">E-mail, Slack, Teams</text>
<rect x="796" y="194" width="128" height="34" rx="6" fill="#ffffff" stroke="#616161"/><text x="860" y="216" font-size="10.5" fill="#222222" text-anchor="middle">PagerDuty, Opsgenie</text>
<rect x="796" y="238" width="128" height="34" rx="6" fill="#ffffff" stroke="#616161"/><text x="860" y="260" font-size="10.5" fill="#222222" text-anchor="middle">Cases, Jira, Index</text>
<text x="860" y="298" font-size="10" fill="#555555" text-anchor="middle">credentials live in the</text>
<text x="860" y="312" font-size="10" fill="#555555" text-anchor="middle">connector, not the rule</text>

<line x1="270" y1="125" x2="318" y2="125" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="405" y1="182" x2="405" y2="208" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="492" y1="265" x2="538" y2="230" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="732" y1="195" x2="778" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="294" y="116" font-size="9.5" fill="#555555" text-anchor="middle">due</text>
<text x="518" y="236" font-size="9.5" fill="#555555" text-anchor="middle">results</text>
<text x="755" y="186" font-size="9.5" fill="#555555" text-anchor="middle">actions</text>

<rect x="20" y="350" width="920" height="150" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="480" y="372" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Two other alerting systems live next to Classic Alerting</text>
<rect x="40" y="386" width="280" height="98" rx="8" fill="#ffffff" stroke="#8e24aa"/>
<text x="180" y="406" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Universal Alerting</text>
<text x="180" y="424" font-size="10" fill="#222222" text-anchor="middle">ES|QL rules, rule events, action policies</text>
<text x="180" y="440" font-size="10" fill="#222222" text-anchor="middle">Serverless: generally available</text>
<text x="180" y="456" font-size="10" fill="#222222" text-anchor="middle">Elastic Stack: planned</text>
<text x="180" y="473" font-size="10" fill="#555555" text-anchor="middle">runs next to Classic rules</text>
<rect x="340" y="386" width="280" height="98" rx="8" fill="#ffffff" stroke="#f9a825"/>
<text x="480" y="406" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Watcher</text>
<text x="480" y="424" font-size="10" fill="#222222" text-anchor="middle">JSON watch: input, condition, actions</text>
<text x="480" y="440" font-size="10" fill="#222222" text-anchor="middle">Elastic Stack only, not on Serverless</text>
<text x="480" y="456" font-size="10" fill="#222222" text-anchor="middle">scripts and chained inputs</text>
<text x="480" y="473" font-size="10" fill="#555555" text-anchor="middle">not part of the Rules page</text>
<rect x="640" y="386" width="280" height="98" rx="8" fill="#ffffff" stroke="#9e9e9e"/>
<text x="780" y="406" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Security detection rules</text>
<text x="780" y="424" font-size="10" fill="#222222" text-anchor="middle">separate from all three systems</text>
<text x="780" y="440" font-size="10" fill="#222222" text-anchor="middle">managed in the Security app</text>
<text x="780" y="456" font-size="10" fill="#222222" text-anchor="middle">alerts shown in the Security app</text>
</svg>
