<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ah-r1" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#1c4b73"/>
    </marker>
    <marker id="ah-r2" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#7a4a12"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">bookshop:orders: one stream, two independent consumer groups</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">each group tracks its own last-delivered cursor and pending entries list (PEL)</text>

  <!-- stream row -->
  <text x="30" y="88" font-size="12" fill="#666666">stream</text>
  <g>
    <rect x="70" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="170" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="270" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="370" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="470" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="570" y="66" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="10.5" fill="#333333" text-anchor="middle">
    <text x="115" y="89">1041-0</text>
    <text x="215" y="89">1042-0</text>
    <text x="315" y="89">1043-0</text>
    <text x="415" y="89">1044-0</text>
    <text x="515" y="89">1045-0</text>
    <text x="615" y="89">1046-0</text>
  </g>
  <text x="690" y="89" font-size="12" fill="#999999">*</text>

  <!-- cursors -->
  <line x1="315" y1="112" x2="315" y2="150" stroke="#1c4b73" stroke-width="2" marker-end="url(#ah-r1)"/>
  <text x="315" y="128" font-size="10" fill="#1c4b73" text-anchor="middle">fulfilment</text>

  <line x1="515" y1="112" x2="515" y2="150" stroke="#7a4a12" stroke-width="2" marker-end="url(#ah-r2)"/>
  <text x="515" y="128" font-size="10" fill="#7a4a12" text-anchor="middle">analytics</text>

  <!-- fulfilment group panel -->
  <rect x="40" y="150" width="330" height="290" rx="6" fill="#eef3f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="205" y="174" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">group: fulfilment</text>

  <rect x="60" y="190" width="130" height="34" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="125" y="211" font-size="11" fill="#1c4b73" text-anchor="middle">worker-1</text>

  <rect x="220" y="190" width="130" height="34" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="285" y="211" font-size="11" fill="#1c4b73" text-anchor="middle">worker-2</text>

  <text x="60" y="248" font-size="11" fill="#444444">pending entries list (PEL):</text>
  <rect x="60" y="258" width="290" height="66" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="70" y="276" font-size="10" fill="#333333">1043-0  owner: worker-1  idle: 2100ms  deliveries: 1</text>
  <text x="70" y="292" font-size="10" fill="#333333">1044-0  owner: worker-2  idle: 41500ms deliveries: 2</text>
  <text x="70" y="308" font-size="10" fill="#7a2020">1042-0  NACKed (FAIL)   idle: 0ms     deliveries: 1</text>

  <text x="60" y="344" font-size="11" fill="#444444">last-delivered ID: 1045-0</text>
  <text x="60" y="364" font-size="10.5" fill="#666666">XREADGROUP GROUP fulfilment worker-1</text>
  <text x="60" y="380" font-size="10.5" fill="#666666">COUNT 10 BLOCK 5000 STREAMS bookshop:orders &gt;</text>
  <text x="60" y="404" font-size="10.5" fill="#666666">worker-2 idle too long on 1044-0 --</text>
  <text x="60" y="420" font-size="10.5" fill="#666666">reclaimed via XAUTOCLAIM.</text>

  <!-- analytics group panel -->
  <rect x="390" y="150" width="330" height="290" rx="6" fill="#f8f1e7" stroke="#7a4a12" stroke-width="1.4"/>
  <text x="555" y="174" font-size="13.5" font-weight="bold" fill="#7a4a12" text-anchor="middle">group: analytics</text>

  <rect x="410" y="190" width="130" height="34" rx="4" fill="#ffffff" stroke="#7a4a12" stroke-width="1.2"/>
  <text x="475" y="211" font-size="11" fill="#7a4a12" text-anchor="middle">worker-a</text>

  <text x="410" y="248" font-size="11" fill="#444444">pending entries list (PEL):</text>
  <rect x="410" y="258" width="290" height="46" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="420" y="276" font-size="10" fill="#333333">1045-0  owner: worker-a  idle: 400ms  deliveries: 1</text>
  <text x="420" y="292" font-size="10" fill="#333333">(no other pending entries)</text>

  <text x="410" y="324" font-size="11" fill="#444444">last-delivered ID: 1045-0</text>
  <text x="410" y="344" font-size="10.5" fill="#666666">A slower reader over the same stream:</text>
  <text x="410" y="360" font-size="10.5" fill="#666666">independent cursor and PEL, unaffected</text>
  <text x="410" y="376" font-size="10.5" fill="#666666">by fulfilment's acknowledgments or claims.</text>

  <text x="380" y="460" font-size="11" fill="#444444" text-anchor="middle">Every group replays the same log independently; only a group's own consumers and PEL are shared within it.</text>
</svg>
