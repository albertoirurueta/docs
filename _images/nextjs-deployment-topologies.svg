<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Next.js deployment topologies</title>
  <desc id="d">Five ways to run a Next.js application. A: one Node.js server (next start or the standalone server.js) behind a reverse proxy with a local disk cache. B: several identical containers behind a load balancer, sharing one cache store through cache handlers, with the same deployment id and Server Functions encryption key. C: a static export, plain HTML, CSS and JS in the out folder served by any static host or CDN, without server features. D: a platform adapter, where next build calls the adapter configured with adapterPath, which turns the build output into the platform's functions, CDN rules and cache. E: multi-zones, a router that sends each URL path prefix to a separate Next.js application with its own asset prefix.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #fafafa; stroke: #c8c8c8; stroke-width: 1.2; }
    .ttl { fill: #222222; font-size: 15px; font-weight: bold; }
    .sub { fill: #555555; font-size: 12px; }
    .txt { fill: #333333; font-size: 12px; }
    .lbl { fill: #222222; font-size: 13px; font-weight: bold; }
    .note { fill: #555555; font-size: 11.5px; }
    .box { fill: #ffffff; stroke: #444444; stroke-width: 1.6; }
    .net { fill: #eef3fb; stroke: #1d4f91; stroke-width: 1.6; }
    .srv { fill: #e9f5ec; stroke: #1e6b36; stroke-width: 1.6; }
    .store { fill: #fdf3e3; stroke: #9a5b00; stroke-width: 1.6; }
    .zone { fill: #f3eefa; stroke: #5b3a8e; stroke-width: 1.6; }
    .edge { stroke: #444444; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
    .dash { stroke: #9a5b00; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#ah); }
    .ah { fill: #444444; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="800"/>
  <text class="ttl" x="500" y="30" text-anchor="middle" style="font-size:18px">Where a Next.js application can run</text>
  <text class="sub" x="500" y="50" text-anchor="middle">five topologies, from one process to one domain split across several applications</text>

  <!-- A: one Node.js server -->
  <rect class="panel" x="20" y="68" width="480" height="300" rx="8"/>
  <text class="ttl" x="36" y="94">A. One Node.js server</text>
  <text class="sub" x="36" y="112">next start, or node .next/standalone/server.js</text>
  <rect class="box" x="36" y="140" width="100" height="52" rx="6"/>
  <text class="lbl" x="86" y="162" text-anchor="middle">Browser</text>
  <text class="txt" x="86" y="179" text-anchor="middle">HTTPS</text>
  <rect class="net" x="190" y="140" width="120" height="52" rx="6"/>
  <text class="lbl" x="250" y="160" text-anchor="middle">Reverse proxy</text>
  <text class="txt" x="250" y="177" text-anchor="middle">NGINX, buffering off</text>
  <rect class="srv" x="364" y="140" width="120" height="52" rx="6"/>
  <text class="lbl" x="424" y="160" text-anchor="middle">Next.js server</text>
  <text class="txt" x="424" y="177" text-anchor="middle">Node.js, port 3000</text>
  <line class="edge" x1="136" y1="166" x2="188" y2="166"/>
  <line class="edge" x1="310" y1="166" x2="362" y2="166"/>
  <rect class="store" x="364" y="236" width="120" height="48" rx="6"/>
  <text class="lbl" x="424" y="257" text-anchor="middle">Local cache</text>
  <text class="txt" x="424" y="273" text-anchor="middle">memory + .next/ disk</text>
  <line class="edge" x1="424" y1="192" x2="424" y2="234"/>
  <text class="note" x="36" y="322">Every feature works: ISR, PPR, Server Actions, Proxy, after().</text>
  <text class="note" x="36" y="340">Add TLS, size limits and rate limiting at the proxy.</text>

  <!-- B: many containers -->
  <rect class="panel" x="510" y="68" width="480" height="300" rx="8"/>
  <text class="ttl" x="526" y="94">B. Several identical containers</text>
  <text class="sub" x="526" y="112">same image, same deploymentId, same encryption key</text>
  <rect class="net" x="526" y="170" width="96" height="60" rx="6"/>
  <text class="lbl" x="574" y="196" text-anchor="middle">Load</text>
  <text class="lbl" x="574" y="212" text-anchor="middle">balancer</text>
  <rect class="srv" x="676" y="128" width="116" height="40" rx="6"/>
  <text class="txt" x="734" y="153" text-anchor="middle">Instance 1</text>
  <rect class="srv" x="676" y="180" width="116" height="40" rx="6"/>
  <text class="txt" x="734" y="205" text-anchor="middle">Instance 2</text>
  <rect class="srv" x="676" y="232" width="116" height="40" rx="6"/>
  <text class="txt" x="734" y="257" text-anchor="middle">Instance 3</text>
  <line class="edge" x1="622" y1="190" x2="674" y2="150"/>
  <line class="edge" x1="622" y1="200" x2="674" y2="200"/>
  <line class="edge" x1="622" y1="210" x2="674" y2="252"/>
  <rect class="store" x="852" y="168" width="124" height="64" rx="6"/>
  <text class="lbl" x="914" y="192" text-anchor="middle">Shared cache</text>
  <text class="txt" x="914" y="209" text-anchor="middle">cacheHandler(s)</text>
  <text class="txt" x="914" y="223" text-anchor="middle">Redis, S3, ...</text>
  <line class="dash" x1="792" y1="150" x2="850" y2="186"/>
  <line class="dash" x1="792" y1="200" x2="850" y2="200"/>
  <line class="dash" x1="792" y1="252" x2="850" y2="214"/>
  <text class="note" x="526" y="316">Without a shared store each instance keeps its own ISR cache</text>
  <text class="note" x="526" y="334">and a revalidation reaches only the instance that got it.</text>
  <text class="note" x="526" y="352">Roll out by deployment: skew triggers a full page reload.</text>

  <!-- C: static export -->
  <rect class="panel" x="20" y="380" width="480" height="196" rx="8"/>
  <text class="ttl" x="36" y="406">C. Static export</text>
  <text class="sub" x="36" y="424">output: 'export' writes HTML, CSS and JS into out/</text>
  <rect class="box" x="36" y="448" width="100" height="48" rx="6"/>
  <text class="lbl" x="86" y="477" text-anchor="middle">Browser</text>
  <rect class="net" x="190" y="448" width="120" height="48" rx="6"/>
  <text class="lbl" x="250" y="468" text-anchor="middle">CDN or host</text>
  <text class="txt" x="250" y="485" text-anchor="middle">S3, NGINX, Pages</text>
  <rect class="store" x="364" y="448" width="120" height="48" rx="6"/>
  <text class="lbl" x="424" y="468" text-anchor="middle">out/</text>
  <text class="txt" x="424" y="485" text-anchor="middle">*.html, _next/</text>
  <line class="edge" x1="136" y1="472" x2="188" y2="472"/>
  <line class="edge" x1="310" y1="472" x2="362" y2="472"/>
  <text class="note" x="36" y="528">No server code at runtime: no Proxy, Server Actions, ISR, cookies(),</text>
  <text class="note" x="36" y="546">rewrites or default image loader.</text>

  <!-- D: platform adapter -->
  <rect class="panel" x="510" y="380" width="480" height="196" rx="8"/>
  <text class="ttl" x="526" y="406">D. A platform adapter</text>
  <text class="sub" x="526" y="424">next build runs the module named by adapterPath</text>
  <rect class="srv" x="526" y="448" width="100" height="48" rx="6"/>
  <text class="lbl" x="576" y="468" text-anchor="middle">next build</text>
  <text class="txt" x="576" y="485" text-anchor="middle">build output</text>
  <rect class="zone" x="676" y="440" width="130" height="64" rx="6"/>
  <text class="lbl" x="741" y="462" text-anchor="middle">Adapter</text>
  <text class="txt" x="741" y="479" text-anchor="middle">modifyConfig</text>
  <text class="txt" x="741" y="494" text-anchor="middle">onBuildComplete</text>
  <rect class="net" x="856" y="432" width="120" height="30" rx="6"/>
  <text class="txt" x="916" y="452" text-anchor="middle">Functions</text>
  <rect class="net" x="856" y="468" width="120" height="30" rx="6"/>
  <text class="txt" x="916" y="488" text-anchor="middle">CDN and routing</text>
  <rect class="store" x="856" y="504" width="120" height="30" rx="6"/>
  <text class="txt" x="916" y="524" text-anchor="middle">Cache store</text>
  <line class="edge" x1="626" y1="472" x2="674" y2="472"/>
  <line class="edge" x1="806" y1="462" x2="854" y2="447"/>
  <line class="edge" x1="806" y1="472" x2="854" y2="483"/>
  <line class="edge" x1="806" y1="482" x2="854" y2="519"/>
  <text class="note" x="526" y="560">The platform decides how the pieces run; no private hooks.</text>

  <!-- E: multi-zones -->
  <rect class="panel" x="20" y="588" width="970" height="196" rx="8"/>
  <text class="ttl" x="36" y="614">E. Multi-zones</text>
  <text class="sub" x="36" y="632">one domain, several Next.js applications, each owning a set of paths and its own assetPrefix</text>
  <rect class="box" x="36" y="660" width="100" height="52" rx="6"/>
  <text class="lbl" x="86" y="683" text-anchor="middle">Browser</text>
  <text class="txt" x="86" y="700" text-anchor="middle">acme.example</text>
  <rect class="net" x="196" y="652" width="150" height="68" rx="6"/>
  <text class="lbl" x="271" y="676" text-anchor="middle">Router</text>
  <text class="txt" x="271" y="693" text-anchor="middle">proxy, CDN or the</text>
  <text class="txt" x="271" y="707" text-anchor="middle">rewrites of one zone</text>
  <line class="edge" x1="136" y1="686" x2="194" y2="686"/>
  <rect class="zone" x="430" y="644" width="170" height="40" rx="6"/>
  <text class="lbl" x="515" y="662" text-anchor="middle">Zone: /*</text>
  <text class="txt" x="515" y="676" text-anchor="middle">the main site</text>
  <rect class="zone" x="430" y="692" width="170" height="40" rx="6"/>
  <text class="lbl" x="515" y="710" text-anchor="middle">Zone: /blog/*</text>
  <text class="txt" x="515" y="724" text-anchor="middle">assetPrefix /blog-static</text>
  <rect class="zone" x="430" y="740" width="170" height="36" rx="6"/>
  <text class="lbl" x="515" y="763" text-anchor="middle">Zone: /dashboard/*</text>
  <line class="edge" x1="346" y1="672" x2="428" y2="664"/>
  <line class="edge" x1="346" y1="686" x2="428" y2="712"/>
  <line class="edge" x1="346" y1="700" x2="428" y2="758"/>
  <text class="note" x="640" y="672">Same zone: soft navigation with next/link.</text>
  <text class="note" x="640" y="692">Across zones: a plain anchor and a hard navigation.</text>
  <text class="note" x="640" y="712">Each zone is built, versioned and deployed on its own.</text>
  <text class="note" x="640" y="732">Server Actions need allowedOrigins for the public domain.</text>
</svg>
