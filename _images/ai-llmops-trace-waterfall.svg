<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>DocsAssistant request trace waterfall</title>
  <desc>Illustrative trace waterfall of one DocsAssistant question. A root invoke_agent span covers the whole request. Beneath it a retrieval span contains an embeddings span and then a rerank span; a first chat model call decides to use a tool; an execute_tool span contains a child MCP tools/call span that crosses a process boundary and carries the trace context in the request _meta field; a second chat model call writes the final answer. Bar positions show relative order and nesting only; they are not measurements.</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#f8fafc"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">DocsAssistant request trace (illustrative waterfall)</text>
  <text x="20" y="62" font-size="12" font-weight="bold" fill="#334155">Span (gen_ai.operation.name or protocol method)</text>
  <text x="300" y="62" font-size="12" font-weight="bold" fill="#334155">Relative time, start of request to end of request</text>
  <line x1="300" y1="70" x2="300" y2="388" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="465" y1="70" x2="465" y2="388" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="630" y1="70" x2="630" y2="388" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="795" y1="70" x2="795" y2="388" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="960" y1="70" x2="960" y2="388" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="93" font-size="12" fill="#0f172a">invoke_agent docsassistant.ask</text>
  <rect x="300" y="76" width="660" height="24" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="38" y="133" font-size="12" fill="#0f172a">retrieve docs</text>
  <rect x="320" y="116" width="185" height="24" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="56" y="173" font-size="12" fill="#0f172a">embeddings</text>
  <rect x="326" y="156" width="53" height="24" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="56" y="213" font-size="12" fill="#0f172a">rerank</text>
  <rect x="419" y="196" width="79" height="24" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="38" y="253" font-size="12" fill="#0f172a">chat (decide)</text>
  <rect x="511" y="236" width="92" height="24" rx="4" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
  <text x="38" y="293" font-size="12" fill="#0f172a">execute_tool search_docs</text>
  <rect x="604" y="276" width="112" height="24" rx="4" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5"/>
  <text x="56" y="333" font-size="12" fill="#0f172a">MCP tools/call</text>
  <rect x="617" y="316" width="86" height="24" rx="4" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="38" y="373" font-size="12" fill="#0f172a">chat (answer)</text>
  <rect x="716" y="356" width="205" height="24" rx="4" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
  <text x="20" y="412" font-size="12" fill="#1e293b">Indentation shows parent and child spans. Embeddings and rerank are children of the retrieval span; the MCP call is a child of the tool span.</text>
  <text x="20" y="432" font-size="12" fill="#1e293b">The MCP server continues the same trace because the client copies traceparent into the request _meta field.</text>
  <text x="500" y="458" text-anchor="middle" font-size="11" fill="#475569">Bar positions show order and nesting only, not measured durations. Span names follow the OpenTelemetry GenAI conventions snapshot gen-ai-dev/1.42.0-dev.</text>
</svg>
