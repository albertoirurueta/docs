<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A 2-D projection of an embedding space</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Semantically related terms land close together; unrelated clusters stay far apart</text>

  <!-- axes box -->
  <rect x="50" y="70" width="660" height="350" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>

  <!-- cluster: databases / vector search (blue) -->
  <g>
    <ellipse cx="180" cy="160" rx="95" ry="60" fill="#1c4b73" fill-opacity="0.08" stroke="#1c4b73" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="150" cy="150" r="4" fill="#1c4b73"/>
    <text x="158" y="153" font-size="11" fill="#1c4b73">HNSW</text>
    <circle cx="200" cy="135" r="4" fill="#1c4b73"/>
    <text x="208" y="138" font-size="11" fill="#1c4b73">pgvector</text>
    <circle cx="215" cy="180" r="4" fill="#1c4b73"/>
    <text x="223" y="183" font-size="11" fill="#1c4b73">nearest neighbour</text>
    <circle cx="140" cy="190" r="4" fill="#1c4b73"/>
    <text x="148" y="193" font-size="11" fill="#1c4b73">cosine similarity</text>
    <text x="180" y="112" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">vector search</text>
  </g>

  <!-- cluster: fruit (green) -->
  <g>
    <ellipse cx="560" cy="150" rx="90" ry="55" fill="#2f5424" fill-opacity="0.08" stroke="#2f5424" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="535" cy="140" r="4" fill="#2f5424"/>
    <text x="543" y="143" font-size="11" fill="#2f5424">banana</text>
    <circle cx="580" cy="130" r="4" fill="#2f5424"/>
    <text x="588" y="133" font-size="11" fill="#2f5424">orange</text>
    <circle cx="565" cy="170" r="4" fill="#2f5424"/>
    <text x="573" y="173" font-size="11" fill="#2f5424">grape</text>
    <text x="560" y="105" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">fruit</text>
  </g>

  <!-- cluster: technology company (orange), overlapping fruit slightly to show ambiguity -->
  <g>
    <ellipse cx="470" cy="280" rx="100" ry="60" fill="#7a3b12" fill-opacity="0.08" stroke="#7a3b12" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="440" cy="270" r="4" fill="#7a3b12"/>
    <text x="448" y="273" font-size="11" fill="#7a3b12">iPhone</text>
    <circle cx="490" cy="260" r="4" fill="#7a3b12"/>
    <text x="498" y="263" font-size="11" fill="#7a3b12">macOS</text>
    <circle cx="475" cy="300" r="4" fill="#7a3b12"/>
    <text x="483" y="303" font-size="11" fill="#7a3b12">App Store</text>
    <text x="470" y="235" font-size="12" font-weight="bold" fill="#7a3b12" text-anchor="middle">Apple (company)</text>
  </g>

  <!-- ambiguous term "apple" sitting between fruit and company clusters -->
  <circle cx="510" cy="205" r="5" fill="#8a2a2a"/>
  <text x="519" y="208" font-size="11.5" font-weight="bold" fill="#8a2a2a">apple</text>
  <line x1="510" y1="205" x2="560" y2="180" stroke="#8a2a2a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="205" x2="470" y2="250" stroke="#8a2a2a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- cluster: databases-general (purple), far from vector search to show topical separation -->
  <g>
    <ellipse cx="180" cy="340" rx="95" ry="55" fill="#5b3a7a" fill-opacity="0.08" stroke="#5b3a7a" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="150" cy="330" r="4" fill="#5b3a7a"/>
    <text x="158" y="333" font-size="11" fill="#5b3a7a">SQL</text>
    <circle cx="200" cy="320" r="4" fill="#5b3a7a"/>
    <text x="208" y="323" font-size="11" fill="#5b3a7a">transaction</text>
    <circle cx="190" cy="360" r="4" fill="#5b3a7a"/>
    <text x="198" y="363" font-size="11" fill="#5b3a7a">B-tree index</text>
    <text x="180" y="295" font-size="12" font-weight="bold" fill="#5b3a7a" text-anchor="middle">relational databases</text>
  </g>

  <text x="60" y="410" font-size="11" fill="#888888">Dashed ellipses mark topical clusters; a term with two senses (e.g. "apple") sits between two of them.</text>
</svg>
