<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-perf-draws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four ways to draw 90 books: draw calls versus flexibility</text>
<rect x="20" y="60" width="170" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="89.0" font-size="13" font-weight="normal" fill="#92400E" text-anchor="middle">90 Meshes</text>
<rect x="20" y="120" width="170" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="160.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">90 draw calls</text>
<text x="105.0" y="174.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">90 objects to cull</text>
<text x="105.0" y="188.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">simple, most flexible</text>
<rect x="205" y="60" width="170" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="290.0" y="89.0" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Merged geometry</text>
<rect x="205" y="120" width="170" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="290.0" y="160.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1 draw call</text>
<text x="290.0" y="174.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one object: no per-book</text>
<text x="290.0" y="188.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">move, hide or pick</text>
<rect x="390" y="60" width="170" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475.0" y="89.0" font-size="13" font-weight="normal" fill="#3730A3" text-anchor="middle">InstancedMesh</text>
<rect x="390" y="120" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475.0" y="160.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">1 draw call</text>
<text x="475.0" y="174.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">one geometry, per-instance</text>
<text x="475.0" y="188.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">matrix (and colour)</text>
<rect x="575" y="60" width="170" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660.0" y="89.0" font-size="13" font-weight="normal" fill="#065F46" text-anchor="middle">BatchedMesh</text>
<rect x="575" y="120" width="170" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660.0" y="160.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">1 draw call</text>
<text x="660.0" y="174.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">several geometries, one</text>
<text x="660.0" y="188.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">material, per-instance data</text>
<text x="380" y="250" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Draw calls (relative cost per frame)</text>
<text x="150" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">90 Meshes</text>
<rect x="160" y="266" width="360" height="18" rx="3" fill="#B45309"/>
<text x="150" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">Merged geometry</text>
<rect x="160" y="294" width="40" height="18" rx="3" fill="#4F46E5"/>
<text x="150" y="336" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">InstancedMesh</text>
<rect x="160" y="322" width="40" height="18" rx="3" fill="#4F46E5"/>
<text x="150" y="364" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">BatchedMesh</text>
<rect x="160" y="350" width="40" height="18" rx="3" fill="#4F46E5"/>
<text x="380" y="398" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Use LOD and frustum culling on top: they cut vertices and pixels, not only calls.</text>
<text x="380" y="416" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Bar widths are schematic, not measurements.</text>
</svg>
