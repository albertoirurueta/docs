<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 537" width="860" height="537" role="img" aria-labelledby="stackoverflow-apis-t stackoverflow-apis-d">
<title id="stackoverflow-apis-t">Stack Overflow questions per year, graphics APIs</title>
<desc id="stackoverflow-apis-d">Questions asked each year on Stack Overflow with the tags opengl, opengl-es, webgl, three.js, metal and vulkan, 2010 to 2025. The opengl tag peaked in 2014 and has fallen since; webgl and three.js stay roughly flat between 2019 and 2022 and vulkan grows until 2022; all tags decline from 2023 together with the whole site. Metal has no values before 2014 (n/a), when the tag did not exist yet.</desc>
