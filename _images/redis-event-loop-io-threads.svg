<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ah-r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="ah-r2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a5a00"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Redis I/O threads feeding a single command executor</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">io-threads parses/writes sockets in parallel; every command still executes one at a time on the main thread</text>

  <!-- client column -->
  <rect x="30" y="90" width="120" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="90" y="111" font-size="12" fill="#333333" text-anchor="middle">client A</text>
  <rect x="30" y="150" width="120" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="90" y="171" font-size="12" fill="#333333" text-anchor="middle">client B</text>
  <rect x="30" y="210" width="120" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="90" y="231" font-size="12" fill="#333333" text-anchor="middle">client C</text>
  <rect x="30" y="270" width="120" height="34" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="90" y="291" font-size="12" fill="#333333" text-anchor="middle">client D</text>

  <!-- io threads column -->
  <rect x="230" y="80" width="150" height="44" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="305" y="106" font-size="12" fill="#1c4b73" text-anchor="middle">I/O thread 1</text>
  <rect x="230" y="150" width="150" height="44" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="305" y="176" font-size="12" fill="#1c4b73" text-anchor="middle">I/O thread 2</text>
  <rect x="230" y="220" width="150" height="44" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="305" y="246" font-size="12" fill="#1c4b73" text-anchor="middle">I/O thread 3</text>
  <text x="305" y="290" font-size="11" fill="#666666" text-anchor="middle">count set by</text>
  <text x="305" y="304" font-size="11" fill="#666666" text-anchor="middle">io-threads</text>

  <!-- arrows client -> io threads -->
  <g stroke="#999999" stroke-width="1.2" marker-end="url(#ah-r)">
    <line x1="150" y1="107" x2="228" y2="102"/>
    <line x1="150" y1="167" x2="228" y2="172"/>
    <line x1="150" y1="227" x2="228" y2="242"/>
    <line x1="150" y1="287" x2="228" y2="252"/>
  </g>

  <!-- single command executor -->
  <rect x="470" y="150" width="190" height="70" rx="6" fill="#fff7e6" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="565" y="180" font-size="13" font-weight="bold" fill="#8a5a00" text-anchor="middle">command executor</text>
  <text x="565" y="198" font-size="11" fill="#8a5a00" text-anchor="middle">single thread, commands run</text>
  <text x="565" y="212" font-size="11" fill="#8a5a00" text-anchor="middle">one at a time (atomicity)</text>

  <!-- arrows io threads -> executor -->
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ah-r2)">
    <line x1="380" y1="102" x2="468" y2="165"/>
    <line x1="380" y1="172" x2="468" y2="180"/>
    <line x1="380" y1="242" x2="468" y2="200"/>
  </g>

  <!-- side threads box -->
  <rect x="470" y="270" width="230" height="110" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="585" y="292" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">also off the main thread</text>
  <text x="490" y="312" font-size="11" fill="#555555">- UNLINK / lazy free</text>
  <text x="490" y="330" font-size="11" fill="#555555">- RDB/AOF fork (background save)</text>
  <text x="490" y="348" font-size="11" fill="#555555">- slow DNS / other side I/O</text>
  <text x="490" y="366" font-size="11" fill="#555555">- Query Engine worker threads</text>

  <g stroke="#999999" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="565" y1="220" x2="585" y2="270"/>
  </g>

  <text x="380" y="420" font-size="11" fill="#444444" text-anchor="middle">I/O threads only parse requests and write replies; they never run command logic, so a command that</text>
  <text x="380" y="436" font-size="11" fill="#444444" text-anchor="middle">touches shared data structures still executes atomically on the single command-executing thread.</text>

  <!-- legend -->
  <g>
    <rect x="85" y="452" width="16" height="12" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="107" y="462" font-size="10.5" fill="#666666">I/O thread (parse / write only)</text>
    <rect x="335" y="452" width="16" height="12" fill="#fff7e6" stroke="#8a5a00" stroke-width="1.2"/>
    <text x="357" y="462" font-size="10.5" fill="#666666">single command executor</text>
    <rect x="535" y="452" width="16" height="12" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="557" y="462" font-size="10.5" fill="#666666">other background threads</text>
  </g>
</svg>
