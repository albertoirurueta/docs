<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a decorated call to a Grafana panel and an alert</text>
  <defs>
    <marker id="mp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="mp-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- stage titles -->
  <text x="75" y="62" font-size="10.5" fill="#666666" text-anchor="middle">in your JVM</text>
  <text x="213" y="62" font-size="10.5" fill="#666666" text-anchor="middle">resilience4j-micrometer</text>
  <text x="351" y="62" font-size="10.5" fill="#666666" text-anchor="middle">Micrometer</text>
  <text x="489" y="62" font-size="10.5" fill="#666666" text-anchor="middle">Actuator</text>
  <text x="627" y="62" font-size="10.5" fill="#666666" text-anchor="middle">pull, every 15 s or so</text>
  <text x="787" y="62" font-size="10.5" fill="#666666" text-anchor="middle">dashboards and pages</text>

  <!-- 1 instances -->
  <rect x="11" y="72" width="128" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="75" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Resilience4j</text>
  <text x="75" y="106" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">instances</text>
  <text x="75" y="130" font-size="10" fill="#444444" text-anchor="middle">CircuitBreaker</text>
  <text x="75" y="144" font-size="10" fill="#444444" text-anchor="middle">Retry, RateLimiter</text>
  <text x="75" y="158" font-size="10" fill="#444444" text-anchor="middle">Bulkhead</text>
  <text x="75" y="172" font-size="10" fill="#444444" text-anchor="middle">ThreadPoolBulkhead</text>
  <text x="75" y="186" font-size="10" fill="#444444" text-anchor="middle">TimeLimiter, Timer</text>
  <text x="75" y="208" font-size="9.5" fill="#1c4b73" text-anchor="middle">pricing, isbn, ...</text>
  <line x1="139" y1="147" x2="159" y2="147" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>

  <!-- 2 publishers -->
  <rect x="150" y="72" width="128" height="150" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="214" y="92" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Tagged...Metrics</text>
  <text x="214" y="106" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Publisher</text>
  <text x="214" y="130" font-size="10" fill="#444444" text-anchor="middle">one per module,</text>
  <text x="214" y="144" font-size="10" fill="#444444" text-anchor="middle">auto-configured</text>
  <text x="214" y="158" font-size="10" fill="#444444" text-anchor="middle">binds each instance</text>
  <text x="214" y="172" font-size="10" fill="#444444" text-anchor="middle">when it is created</text>
  <text x="214" y="196" font-size="9.5" fill="#1c4b73" text-anchor="middle">tags: name, kind,</text>
  <text x="214" y="209" font-size="9.5" fill="#1c4b73" text-anchor="middle">state</text>
  <line x1="278" y1="147" x2="298" y2="147" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>

  <!-- 3 registry -->
  <rect x="289" y="72" width="128" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="353" y="92" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">MeterRegistry</text>
  <text x="353" y="106" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">(Prometheus)</text>
  <text x="353" y="130" font-size="10" fill="#444444" text-anchor="middle">dots become</text>
  <text x="353" y="144" font-size="10" fill="#444444" text-anchor="middle">underscores,</text>
  <text x="353" y="158" font-size="10" fill="#444444" text-anchor="middle">timers get _seconds,</text>
  <text x="353" y="172" font-size="10" fill="#444444" text-anchor="middle">counters get _total</text>
  <text x="353" y="196" font-size="9.5" fill="#1c4b73" text-anchor="middle">resilience4j_*</text>
  <line x1="417" y1="147" x2="437" y2="147" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>

  <!-- 4 actuator -->
  <rect x="428" y="72" width="128" height="150" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="492" y="92" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">/actuator/</text>
  <text x="492" y="106" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">prometheus</text>
  <text x="492" y="130" font-size="10" fill="#444444" text-anchor="middle">text exposition</text>
  <text x="492" y="144" font-size="10" fill="#444444" text-anchor="middle">format</text>
  <text x="492" y="170" font-size="10" fill="#444444" text-anchor="middle">secure it: scrape</text>
  <text x="492" y="184" font-size="10" fill="#444444" text-anchor="middle">with its own user</text>
  <line x1="556" y1="147" x2="576" y2="147" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>

  <!-- 5 prometheus -->
  <rect x="567" y="72" width="128" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="631" y="92" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Prometheus</text>
  <text x="631" y="120" font-size="10" fill="#444444" text-anchor="middle">stores the series</text>
  <text x="631" y="134" font-size="10" fill="#444444" text-anchor="middle">evaluates PromQL</text>
  <text x="631" y="148" font-size="10" fill="#444444" text-anchor="middle">alerting rules</text>
  <text x="631" y="172" font-size="9.5" fill="#1c4b73" text-anchor="middle">adds job and</text>
  <text x="631" y="185" font-size="9.5" fill="#1c4b73" text-anchor="middle">instance labels</text>
  <line x1="695" y1="110" x2="715" y2="110" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>
  <line x1="695" y1="185" x2="715" y2="185" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#mp-arrow)"/>

  <!-- 6 grafana + alertmanager -->
  <rect x="706" y="72" width="183" height="70" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="797" y="92" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Grafana dashboard</text>
  <text x="797" y="110" font-size="10" fill="#444444" text-anchor="middle">grafana_dashboard.json:</text>
  <text x="797" y="124" font-size="10" fill="#444444" text-anchor="middle">breaker, retry, bulkhead panels</text>
  <rect x="706" y="152" width="183" height="70" rx="8" fill="#fbe3e3" stroke="#b03030" stroke-width="1.6"/>
  <text x="797" y="172" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Alertmanager</text>
  <text x="797" y="190" font-size="10" fill="#444444" text-anchor="middle">breaker open, retry ratio,</text>
  <text x="797" y="204" font-size="10" fill="#444444" text-anchor="middle">bulkhead saturation</text>

  <!-- lower row: events and health -->
  <text x="450" y="262" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">The same instances also publish events and health, which do not go through Micrometer</text>
  <line x1="75" y1="222" x2="75" y2="290" stroke="#666666" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="75" y1="290" x2="159" y2="290" stroke="#666666" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#mp-arrow-grey)"/>

  <rect x="160" y="272" width="170" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="245" y="292" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">EventPublisher</text>
  <text x="245" y="308" font-size="10" fill="#444444" text-anchor="middle">onEvent, onStateTransition</text>
  <text x="245" y="322" font-size="10" fill="#444444" text-anchor="middle">log lines and ring buffers</text>
  <line x1="330" y1="304" x2="360" y2="304" stroke="#666666" stroke-width="1.4" marker-end="url(#mp-arrow-grey)"/>
  <rect x="361" y="272" width="170" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="446" y="292" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">/actuator/*events</text>
  <text x="446" y="308" font-size="10" fill="#444444" text-anchor="middle">last 100 events per</text>
  <text x="446" y="322" font-size="10" fill="#444444" text-anchor="middle">instance, as JSON</text>

  <line x1="75" y1="290" x2="75" y2="378" stroke="#666666" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="75" y1="378" x2="159" y2="378" stroke="#666666" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#mp-arrow-grey)"/>
  <rect x="160" y="348" width="170" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="245" y="368" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">HealthIndicator</text>
  <text x="245" y="384" font-size="10" fill="#444444" text-anchor="middle">circuitBreakers,</text>
  <text x="245" y="398" font-size="10" fill="#444444" text-anchor="middle">rateLimiters</text>
  <line x1="330" y1="380" x2="360" y2="380" stroke="#666666" stroke-width="1.4" marker-end="url(#mp-arrow-grey)"/>
  <rect x="361" y="348" width="170" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="446" y="368" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">/actuator/health</text>
  <text x="446" y="384" font-size="10" fill="#444444" text-anchor="middle">custom group, never</text>
  <text x="446" y="398" font-size="10" fill="#444444" text-anchor="middle">the liveness group</text>

  <rect x="570" y="272" width="319" height="64" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="730" y="292" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Tracing context</text>
  <text x="730" y="308" font-size="10" fill="#444444" text-anchor="middle">a ContextPropagator copies trace id and MDC</text>
  <text x="730" y="322" font-size="10" fill="#444444" text-anchor="middle">onto ThreadPoolBulkhead threads</text>
  <rect x="570" y="348" width="319" height="64" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="730" y="368" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Write operation</text>
  <text x="730" y="384" font-size="10" fill="#444444" text-anchor="middle">POST /actuator/circuitbreakers/{name}</text>
  <text x="730" y="398" font-size="10" fill="#444444" text-anchor="middle">CLOSE, FORCE_OPEN or DISABLE: lock it down</text>
</svg>
