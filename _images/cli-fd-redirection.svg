<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">File descriptors after: shelf list 2&gt;&gt;shelf.log | sort &gt; books.txt</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Each process has its own table; entries point at shared open file descriptions in the kernel</text>

  <defs>
    <marker id="fd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="fd-arrow-pipe" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Process tables -->
  <rect x="20" y="70" width="190" height="200" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="115" y="95" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">shelf list</text>
  <text x="115" y="112" font-size="12" fill="#333333" text-anchor="middle">descriptor table</text>
  <rect x="38" y="125" width="154" height="30" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="48" y="145" font-size="13" fill="#222222">0  stdin</text>
  <rect x="38" y="165" width="154" height="30" rx="5" fill="#ffffff" stroke="#2d6a34" stroke-width="2"/>
  <text x="48" y="185" font-size="13" fill="#222222">1  stdout</text>
  <rect x="38" y="205" width="154" height="30" rx="5" fill="#ffffff" stroke="#a33333" stroke-width="2"/>
  <text x="48" y="225" font-size="13" fill="#222222">2  stderr</text>

  <rect x="550" y="70" width="190" height="200" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="645" y="95" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">sort</text>
  <text x="645" y="112" font-size="12" fill="#333333" text-anchor="middle">descriptor table</text>
  <rect x="568" y="125" width="154" height="30" rx="5" fill="#ffffff" stroke="#2d6a34" stroke-width="2"/>
  <text x="578" y="145" font-size="13" fill="#222222">0  stdin</text>
  <rect x="568" y="165" width="154" height="30" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="578" y="185" font-size="13" fill="#222222">1  stdout</text>
  <rect x="568" y="205" width="154" height="30" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="578" y="225" font-size="13" fill="#222222">2  stderr</text>

  <!-- Pipe in the middle -->
  <rect x="300" y="150" width="160" height="60" rx="30" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="380" y="176" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">pipe</text>
  <text x="380" y="194" font-size="12" fill="#333333" text-anchor="middle">kernel buffer (pipe(2))</text>

  <!-- shelf stdout -> pipe write end -->
  <line x1="192" y1="180" x2="296" y2="180" stroke="#2d6a34" stroke-width="2" marker-end="url(#fd-arrow-pipe)"/>
  <text x="244" y="172" font-size="11" fill="#2d6a34" text-anchor="middle">write end</text>
  <!-- pipe read end -> sort stdin -->
  <line x1="464" y1="180" x2="564" y2="140" stroke="#2d6a34" stroke-width="2" marker-end="url(#fd-arrow-pipe)"/>
  <text x="520" y="148" font-size="11" fill="#2d6a34" text-anchor="middle">read end</text>

  <!-- Targets row -->
  <rect x="38" y="330" width="154" height="44" rx="6" fill="#fbecec" stroke="#a33333"/>
  <text x="115" y="350" font-size="13" fill="#a33333" text-anchor="middle">shelf.log</text>
  <text x="115" y="366" font-size="11" fill="#a33333" text-anchor="middle">O_APPEND file</text>
  <line x1="115" y1="235" x2="115" y2="326" stroke="#a33333" stroke-width="2" marker-end="url(#fd-arrow)"/>

  <rect x="568" y="330" width="154" height="44" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="645" y="350" font-size="13" fill="#222222" text-anchor="middle">books.txt</text>
  <text x="645" y="366" font-size="11" fill="#666666" text-anchor="middle">O_TRUNC file</text>
  <line x1="645" y1="195" x2="645" y2="326" stroke="#1c4b73" stroke-width="2" marker-end="url(#fd-arrow)"/>

  <rect x="300" y="330" width="160" height="44" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
  <text x="380" y="350" font-size="13" fill="#222222" text-anchor="middle">terminal (/dev/tty...)</text>
  <text x="380" y="366" font-size="11" fill="#666666" text-anchor="middle">inherited fd 0 and fd 2</text>
  <line x1="192" y1="140" x2="250" y2="140" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="250" y1="140" x2="250" y2="300" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="250" y1="300" x2="340" y2="300" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="340" y1="300" x2="340" y2="326" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#fd-arrow)"/>
  <line x1="568" y1="220" x2="520" y2="220" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="220" x2="520" y2="300" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="300" x2="420" y2="300" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="420" y1="300" x2="420" y2="326" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#fd-arrow)"/>

  <text x="380" y="410" font-size="12" fill="#333333" text-anchor="middle">The shell calls pipe(), fork(), then dup2() in each child before exec: fd 1 of shelf and fd 0 of sort become the two pipe ends.</text>
  <text x="380" y="428" font-size="12" fill="#666666" text-anchor="middle">Every original pipe descriptor is closed in both children and in the parent, or the reader never sees end-of-file.</text>
</svg>
