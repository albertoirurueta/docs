<g fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"><rect x="40" y="210" width="88" height="22" rx="11"/><rect x="190" y="210" width="88" height="22" rx="11"/><rect x="340" y="210" width="88" height="22" rx="11"/><rect x="490" y="210" width="88" height="22" rx="11"/><rect x="640" y="210" width="80" height="22" rx="11"/></g>
