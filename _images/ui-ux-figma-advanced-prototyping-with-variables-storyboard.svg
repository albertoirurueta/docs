<g font-size="11" fill="#3730A3" text-anchor="middle"><text x="84" y="138">The Hobbit</text><text x="234" y="138">The Hobbit</text><text x="384" y="138">The Hobbit</text><text x="534" y="138">The Hobbit</text><text x="680" y="138">The Hobbit</text></g>
