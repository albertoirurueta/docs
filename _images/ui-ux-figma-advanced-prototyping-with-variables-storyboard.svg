<g font-size="11" fill="#4B5563" text-anchor="middle"><text x="84" y="284">Empty message</text><text x="84" y="298">visible</text><text x="234" y="284">Empty message</text><text x="234" y="298">hidden</text><text x="384" y="284">Counter grows</text><text x="534" y="284">Counter shrinks</text><text x="680" y="284">Guard + empty</text><text x="680" y="298">message back</text></g>
<g stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"><line x1="154" y1="183" x2="162" y2="183"/><line x1="304" y1="183" x2="312" y2="183"/><line x1="454" y1="183" x2="462" y2="183"/><line x1="604" y1="183" x2="612" y2="183"/></g>
<g font-size="12" fill="#374151">
<text x="14" y="345">1 Start: cartCount = 0, isEmpty = true.   2 Tap Add: count + 1, isEmpty = false.   3 Tap Add again: count = 2.</text>
<text x="14" y="365">4 Tap Remove: the If cartCount &gt; 0 passes, count - 1.   5 Remove again: count reaches 0, isEmpty = true;</text>
<text x="14" y="385">a further Remove fails the If and the Else branch is empty, so nothing changes.</text>
</g>
