<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="560" fill="#ffffff"/>

  <text x="320" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Illustrative attention heat-map</text>
  <text x="320" y="48" font-size="12" fill="#666666" text-anchor="middle">Invented weights for one head, shown only to explain the idea -- not real model output</text>

  <!-- grid geometry: 6 query rows x 6 key columns, causal mask (upper triangle blank) -->
  <!-- origin of grid -->
  <!-- cell size 56, grid starts at x=170,y=100 -->

  <!-- column labels (keys) -->
  <g font-size="12" fill="#333333" text-anchor="middle">
    <text x="198" y="90">The</text>
    <text x="254" y="90">bank</text>
    <text x="310" y="90">approved</text>
    <text x="366" y="90">my</text>
    <text x="422" y="90">loan</text>
    <text x="478" y="90">.</text>
  </g>
  <text x="340" y="70" font-size="12" fill="#555555" text-anchor="middle">key tokens</text>

  <!-- row labels (queries) -->
  <g font-size="12" fill="#333333" text-anchor="end">
    <text x="160" y="134">The</text>
    <text x="160" y="190">bank</text>
    <text x="160" y="246">approved</text>
    <text x="160" y="302">my</text>
    <text x="160" y="358">loan</text>
    <text x="160" y="414">.</text>
  </g>
  <text x="70" y="270" font-size="12" fill="#555555" text-anchor="middle" transform="rotate(-90 70 270)">query tokens</text>

  <!-- cells: rows top to bottom = query 0..5, cols left to right = key 0..5 -->
  <!-- color scale from light (#eaf2fb) to dark (#0b3d66); masked (future) cells are flat gray #eeeeee -->

  <!-- row 0: "The" attends only to "The" -->
  <rect x="170" y="106" width="56" height="56" fill="#0b3d66"/>
  <rect x="226" y="106" width="56" height="56" fill="#eeeeee"/>
  <rect x="282" y="106" width="56" height="56" fill="#eeeeee"/>
  <rect x="338" y="106" width="56" height="56" fill="#eeeeee"/>
  <rect x="394" y="106" width="56" height="56" fill="#eeeeee"/>
  <rect x="450" y="106" width="56" height="56" fill="#eeeeee"/>

  <!-- row 1: "bank" -->
  <rect x="170" y="162" width="56" height="56" fill="#bdd7ee"/>
  <rect x="226" y="162" width="56" height="56" fill="#2e6da4"/>
  <rect x="282" y="162" width="56" height="56" fill="#eeeeee"/>
  <rect x="338" y="162" width="56" height="56" fill="#eeeeee"/>
  <rect x="394" y="162" width="56" height="56" fill="#eeeeee"/>
  <rect x="450" y="162" width="56" height="56" fill="#eeeeee"/>

  <!-- row 2: "approved" -->
  <rect x="170" y="218" width="56" height="56" fill="#dceaf7"/>
  <rect x="226" y="218" width="56" height="56" fill="#5a95c7"/>
  <rect x="282" y="218" width="56" height="56" fill="#1c4b73"/>
  <rect x="338" y="218" width="56" height="56" fill="#eeeeee"/>
  <rect x="394" y="218" width="56" height="56" fill="#eeeeee"/>
  <rect x="450" y="218" width="56" height="56" fill="#eeeeee"/>

  <!-- row 3: "my" -->
  <rect x="170" y="274" width="56" height="56" fill="#eaf2fb"/>
  <rect x="226" y="274" width="56" height="56" fill="#cfe3f5"/>
  <rect x="282" y="274" width="56" height="56" fill="#8fb9dc"/>
  <rect x="338" y="274" width="56" height="56" fill="#0b3d66"/>
  <rect x="394" y="274" width="56" height="56" fill="#eeeeee"/>
  <rect x="450" y="274" width="56" height="56" fill="#eeeeee"/>

  <!-- row 4: "loan" -->
  <rect x="170" y="330" width="56" height="56" fill="#eaf2fb"/>
  <rect x="226" y="330" width="56" height="56" fill="#5a95c7"/>
  <rect x="282" y="330" width="56" height="56" fill="#3a78ad"/>
  <rect x="338" y="330" width="56" height="56" fill="#8fb9dc"/>
  <rect x="394" y="330" width="56" height="56" fill="#123f68"/>
  <rect x="450" y="330" width="56" height="56" fill="#eeeeee"/>

  <!-- row 5: "." -->
  <rect x="170" y="386" width="56" height="56" fill="#eaf2fb"/>
  <rect x="226" y="386" width="56" height="56" fill="#cfe3f5"/>
  <rect x="282" y="386" width="56" height="56" fill="#5a95c7"/>
  <rect x="338" y="386" width="56" height="56" fill="#5a95c7"/>
  <rect x="394" y="386" width="56" height="56" fill="#3a78ad"/>
  <rect x="450" y="386" width="56" height="56" fill="#0b3d66"/>

  <!-- grid lines -->
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="170" y1="106" x2="506" y2="106"/>
    <line x1="170" y1="162" x2="506" y2="162"/>
    <line x1="170" y1="218" x2="506" y2="218"/>
    <line x1="170" y1="274" x2="506" y2="274"/>
    <line x1="170" y1="330" x2="506" y2="330"/>
    <line x1="170" y1="386" x2="506" y2="386"/>
    <line x1="170" y1="442" x2="506" y2="442"/>
    <line x1="170" y1="106" x2="170" y2="442"/>
    <line x1="226" y1="106" x2="226" y2="442"/>
    <line x1="282" y1="106" x2="282" y2="442"/>
    <line x1="338" y1="106" x2="338" y2="442"/>
    <line x1="394" y1="106" x2="394" y2="442"/>
    <line x1="450" y1="106" x2="450" y2="442"/>
    <line x1="506" y1="106" x2="506" y2="442"/>
  </g>
  <rect x="170" y="106" width="336" height="336" fill="none" stroke="#999999" stroke-width="1.5"/>

  <!-- legend -->
  <text x="170" y="480" font-size="12" fill="#555555">Attention weight:</text>
  <rect x="290" y="468" width="18" height="14" fill="#eaf2fb" stroke="#999999" stroke-width="0.5"/>
  <text x="313" y="479" font-size="11" fill="#555555">low</text>
  <rect x="350" y="468" width="18" height="14" fill="#5a95c7" stroke="#999999" stroke-width="0.5"/>
  <text x="373" y="479" font-size="11" fill="#555555">medium</text>
  <rect x="435" y="468" width="18" height="14" fill="#0b3d66" stroke="#999999" stroke-width="0.5"/>
  <text x="458" y="479" font-size="11" fill="#555555">high</text>
  <rect x="500" y="468" width="18" height="14" fill="#eeeeee" stroke="#999999" stroke-width="0.5"/>
  <text x="523" y="479" font-size="11" fill="#555555">masked (future)</text>

  <text x="320" y="512" font-size="11" fill="#888888" text-anchor="middle">Causal masking blanks out future key tokens, so each query row only attends to itself and earlier tokens.</text>
  <text x="320" y="530" font-size="11" fill="#888888" text-anchor="middle">Numbers are illustrative only; a real head's weights come from softmax(QK^T / sqrt(d_k)) over actual model activations.</text>
</svg>
