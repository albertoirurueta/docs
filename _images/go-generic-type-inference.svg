<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Type inference for Map(pages, strconv.Itoa)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the compiler unifies each argument type with its parameter type to solve T and R, then checks the constraints</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <!-- declaration -->
  <rect x="40" y="66" width="860" height="40" fill="#f4f4f4" stroke="#bbbbbb"/>
  <text x="56" y="91" font-size="14" font-family="Courier New, monospace" fill="#222222">func Map[T, R any](s []T, f func(T) R) []R</text>
  <!-- arguments -->
  <text x="40" y="140" font-size="12" font-weight="bold" fill="#555555">arguments at the call site</text>
  <rect x="40" y="150" width="270" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="52" y="169" font-size="13" font-family="Courier New, monospace" fill="#222222">pages</text>
  <text x="52" y="186" font-size="12" fill="#444444">type []int</text>
  <rect x="40" y="214" width="270" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="52" y="233" font-size="13" font-family="Courier New, monospace" fill="#222222">strconv.Itoa</text>
  <text x="52" y="250" font-size="12" fill="#444444">type func(int) string</text>
  <!-- unify -->
  <text x="370" y="140" font-size="12" font-weight="bold" fill="#555555">unify with the parameter types</text>
  <rect x="370" y="150" width="270" height="44" fill="#fff8e1" stroke="#b28704"/>
  <text x="382" y="169" font-size="13" font-family="Courier New, monospace" fill="#222222">[]int  ~  []T</text>
  <text x="382" y="186" font-size="12" fill="#444444">so T = int</text>
  <rect x="370" y="214" width="270" height="44" fill="#fff8e1" stroke="#b28704"/>
  <text x="382" y="233" font-size="13" font-family="Courier New, monospace" fill="#222222">func(int) string  ~  func(T) R</text>
  <text x="382" y="250" font-size="12" fill="#444444">T = int agrees, so R = string</text>
  <line x1="310" y1="172" x2="366" y2="172" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="310" y1="236" x2="366" y2="236" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- result -->
  <text x="700" y="140" font-size="12" font-weight="bold" fill="#555555">result</text>
  <rect x="700" y="150" width="200" height="108" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="712" y="172" font-size="13" font-family="Courier New, monospace" fill="#222222">Map[int, string]</text>
  <text x="712" y="194" font-size="12" fill="#444444">any satisfied by int, string</text>
  <text x="712" y="212" font-size="12" fill="#444444">returns []string</text>
  <text x="712" y="240" font-size="12" fill="#2e7d32">instantiated, then called</text>
  <line x1="640" y1="204" x2="696" y2="204" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- failure cases -->
  <line x1="40" y1="286" x2="900" y2="286" stroke="#dddddd"/>
  <text x="40" y="310" font-size="13" font-weight="bold" fill="#c62828">When inference fails the compiler stops and asks for explicit type arguments</text>
  <g font-size="12" fill="#222222">
    <rect x="40" y="322" width="410" height="76" fill="#fdecea" stroke="#c62828"/>
    <text x="52" y="342" font-family="Courier New, monospace">Zero()  with  func Zero[T any]() T</text>
    <text x="52" y="362">nothing mentions T: cannot infer T</text>
    <text x="52" y="380">write Zero[string]()</text>
    <rect x="490" y="322" width="410" height="76" fill="#fdecea" stroke="#c62828"/>
    <text x="502" y="342" font-family="Courier New, monospace">MaxOf(1, "two")  with  T cmp.Ordered</text>
    <text x="502" y="362">untyped int and untyped string cannot share one T:</text>
    <text x="502" y="380">mismatched types, cannot infer T</text>
  </g>
</svg>
