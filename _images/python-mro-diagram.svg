<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Diamond inheritance and the resulting MRO</text>
  <text x="360" y="50" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">class B(A): ...   class C(A): ...   class D(B, C): ...</text>

  <!-- nodes: A top, B left, C right, D bottom -->
  <g>
    <!-- A -->
    <circle cx="220" cy="100" r="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="220" y="106" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">A</text>

    <!-- B -->
    <circle cx="130" cy="210" r="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="130" y="216" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">B</text>

    <!-- C -->
    <circle cx="310" cy="210" r="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="310" y="216" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">C</text>

    <!-- D -->
    <circle cx="220" cy="320" r="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="220" y="326" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">D</text>
  </g>

  <!-- edges: B->A, C->A, D->B, D->C, drawn as lines with arrowheads pointing to the parent -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <!-- B -> A -->
    <line x1="146" y1="185" x2="203" y2="126"/>
    <polygon points="197,116 210,120 202,131" stroke="none"/>

    <!-- C -> A -->
    <line x1="294" y1="185" x2="237" y2="126"/>
    <polygon points="230,131 222,120 235,116" stroke="none"/>

    <!-- D -> B -->
    <line x1="204" y1="291" x2="146" y2="239"/>
    <polygon points="140,232 153,234 148,246" stroke="none"/>

    <!-- D -> C -->
    <line x1="236" y1="291" x2="294" y2="239"/>
    <polygon points="292,246 287,234 300,232" stroke="none"/>
  </g>

  <!-- object base, above A -->
  <circle cx="220" cy="30" r="0" fill="none"/>

  <!-- MRO list panel -->
  <g>
    <rect x="440" y="80" width="240" height="200" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="452" y="102" font-size="13" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">D.__mro__</text>

    <text x="452" y="128" font-size="13" fill="#1c4b73" font-family="'Courier New', monospace">1. D</text>
    <text x="452" y="152" font-size="13" fill="#1c4b73" font-family="'Courier New', monospace">2. B</text>
    <text x="452" y="176" font-size="13" fill="#1c4b73" font-family="'Courier New', monospace">3. C</text>
    <text x="452" y="200" font-size="13" fill="#1c4b73" font-family="'Courier New', monospace">4. A</text>
    <text x="452" y="224" font-size="13" fill="#1c4b73" font-family="'Courier New', monospace">5. object</text>

    <text x="452" y="256" font-size="11" fill="#666666">C3 linearization: each class</text>
    <text x="452" y="272" font-size="11" fill="#666666">appears before its own bases.</text>
  </g>

  <!-- arrow from D node to MRO panel -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="254" y1="320" x2="422" y2="180"/>
    <polygon points="415,177 428,177 419,188" stroke="none"/>
  </g>

  <text x="360" y="398" font-size="12" fill="#444444" text-anchor="middle">super() in D follows this order: D &#8594; B &#8594; C &#8594; A &#8594; object.</text>
</svg>
