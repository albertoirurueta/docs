<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <defs>
    <marker id="cvo-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <text x="380" y="30" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One component, two API styles</text>

  <!-- Left panel: Composition API -->
  <rect x="20" y="52" width="240" height="300" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="140" y="74" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Composition API &#8212; &lt;script setup&gt;</text>
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#222222">
    <text x="32" y="102">&lt;script setup&gt;</text>
    <text x="32" y="120">import { ref } from 'vue'</text>
    <text x="32" y="150">const count = ref(0)</text>
    <text x="32" y="168">function inc() {</text>
    <text x="32" y="186">  count.value++</text>
    <text x="32" y="204">}</text>
    <text x="32" y="222">&lt;/script&gt;</text>
  </g>
  <text x="140" y="300" font-size="10.5" fill="#1c4b73" text-anchor="middle">state and logic are plain</text>
  <text x="140" y="316" font-size="10.5" fill="#1c4b73" text-anchor="middle">top-level bindings</text>

  <!-- Right panel: Options API -->
  <rect x="500" y="52" width="240" height="300" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="2"/>
  <text x="620" y="74" font-size="12.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">Options API</text>
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#222222">
    <text x="512" y="102">&lt;script&gt;</text>
    <text x="512" y="120">export default {</text>
    <text x="512" y="138">  data() {</text>
    <text x="512" y="156">    return { count: 0 }</text>
    <text x="512" y="174">  },</text>
    <text x="512" y="192">  methods: {</text>
    <text x="512" y="210">    inc() { this.count++ }</text>
    <text x="512" y="228">  }</text>
    <text x="512" y="246">}</text>
    <text x="512" y="264">&lt;/script&gt;</text>
  </g>
  <text x="620" y="308" font-size="10.5" fill="#8a3d13" text-anchor="middle">grouped under data</text>
  <text x="620" y="324" font-size="10.5" fill="#8a3d13" text-anchor="middle">and methods on an object</text>

  <!-- Middle panel: shared template -->
  <rect x="292" y="132" width="176" height="150" rx="6" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="380" y="154" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">shared &lt;template&gt;</text>
  <g font-family="'Courier New', monospace" font-size="10.5" fill="#222222">
    <text x="304" y="180">&lt;template&gt;</text>
    <text x="304" y="198">  &lt;button</text>
    <text x="304" y="216">   @click="inc"&gt;</text>
    <text x="304" y="234">   count is</text>
    <text x="304" y="252">   {{ count }}</text>
    <text x="304" y="270">  &lt;/button&gt;</text>
  </g>

  <!-- arrows into the shared template -->
  <line x1="260" y1="207" x2="289" y2="207" stroke="#666666" stroke-width="2" marker-end="url(#cvo-arrow)"/>
  <line x1="500" y1="207" x2="471" y2="207" stroke="#666666" stroke-width="2" marker-end="url(#cvo-arrow)"/>

  <!-- caption -->
  <text x="380" y="380" font-size="12" fill="#444444" text-anchor="middle">Both render the same button. &lt;script setup&gt; exposes count and inc to the template</text>
  <text x="380" y="398" font-size="12" fill="#444444" text-anchor="middle">directly; the Options API reaches them through this on the component instance.</text>
</svg>
