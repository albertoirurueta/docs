<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The native-image build pipeline</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">from application classes, through closed-world reachability analysis, to a self-contained native executable</text>

  <!-- Box 1: Application classes -->
  <rect x="32" y="80" width="155" height="220" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="109" y="104" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Application classes</text>
  <text x="109" y="120" font-size="9" fill="#555555" text-anchor="middle">input to the builder</text>
  <text x="48" y="152" font-size="9" fill="#333333">- your application code</text>
  <text x="48" y="166" font-size="9" fill="#333333">- Quarkus runtime module</text>
  <text x="48" y="180" font-size="9" fill="#333333">- third-party dependencies</text>
  <text x="48" y="194" font-size="9" fill="#333333">- build-time resolved config</text>
  <text x="48" y="208" font-size="9" fill="#333333">- recorded static/runtime</text>
  <text x="48" y="222" font-size="9" fill="#333333">  init bytecode</text>
  <text x="48" y="236" font-size="9" fill="#333333">- reflection/proxy/resource</text>
  <text x="48" y="250" font-size="9" fill="#333333">  registration metadata</text>
  <text x="48" y="272" font-size="8.5" fill="#1c4b73" font-style="italic">input: full classpath as</text>
  <text x="48" y="284" font-size="8.5" fill="#1c4b73" font-style="italic">produced by augmentation</text>

  <!-- Box 2: Closed-world analysis -->
  <rect x="212" y="80" width="155" height="220" rx="6" fill="#f5eefa" stroke="#6a3d9a" stroke-width="1.4"/>
  <text x="289" y="104" font-size="12" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Closed-World Analysis</text>
  <text x="289" y="120" font-size="9" fill="#555555" text-anchor="middle">GraalVM or Mandrel builder</text>
  <text x="228" y="152" font-size="9" fill="#333333">- static reachability analysis</text>
  <text x="228" y="166" font-size="9" fill="#333333">- computes the full class,</text>
  <text x="228" y="180" font-size="9" fill="#333333">  method and field graph</text>
  <text x="228" y="194" font-size="9" fill="#333333">- unreached code is dropped</text>
  <text x="228" y="208" font-size="9" fill="#333333">- needs reflection, proxy and</text>
  <text x="228" y="222" font-size="9" fill="#333333">  resource config up front</text>
  <text x="228" y="236" font-size="9" fill="#333333">- GraalVM CE/EE, or Mandrel</text>
  <text x="228" y="250" font-size="9" fill="#333333">  (Red Hat's OpenJDK-based</text>
  <text x="228" y="264" font-size="9" fill="#333333">  downstream builder)</text>
  <text x="228" y="284" font-size="8.5" fill="#6a3d9a" font-style="italic">output: reachable graph</text>

  <!-- Box 3: Ahead-of-time compilation -->
  <rect x="392" y="80" width="155" height="220" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="469" y="104" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">AOT Compilation</text>
  <text x="469" y="120" font-size="9" fill="#555555" text-anchor="middle">still inside the builder</text>
  <text x="408" y="152" font-size="9" fill="#333333">- compiles only the reachable</text>
  <text x="408" y="166" font-size="9" fill="#333333">  graph to native machine code</text>
  <text x="408" y="180" font-size="9" fill="#333333">- no bytecode interpreter and</text>
  <text x="408" y="194" font-size="9" fill="#333333">  no JIT warm-up at run time</text>
  <text x="408" y="208" font-size="9" fill="#333333">- static init is replayed once,</text>
  <text x="408" y="222" font-size="9" fill="#333333">  here, not at process start</text>
  <text x="408" y="236" font-size="9" fill="#333333">- image heap objects are built</text>
  <text x="408" y="250" font-size="9" fill="#333333">  and pre-initialized</text>
  <text x="408" y="284" font-size="8.5" fill="#2d6a34" font-style="italic">output: a native binary</text>

  <!-- Box 4: Native executable -->
  <rect x="572" y="80" width="155" height="220" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="649" y="104" font-size="12" font-weight="bold" fill="#a33" text-anchor="middle">Native Executable</text>
  <text x="649" y="120" font-size="9" fill="#555555" text-anchor="middle">with image heap</text>
  <text x="588" y="152" font-size="9" fill="#333333">- self-contained native binary,</text>
  <text x="588" y="166" font-size="9" fill="#333333">  no JVM required to run it</text>
  <text x="588" y="180" font-size="9" fill="#333333">- image heap: pre-initialized</text>
  <text x="588" y="194" font-size="9" fill="#333333">  objects baked into the file</text>
  <text x="588" y="208" font-size="9" fill="#333333">- runtime init still runs on</text>
  <text x="588" y="222" font-size="9" fill="#333333">  every process start</text>
  <text x="588" y="236" font-size="9" fill="#333333">- fast startup, low RSS,</text>
  <text x="588" y="250" font-size="9" fill="#333333">  slower peak throughput</text>
  <text x="588" y="272" font-size="8.5" fill="#a33" font-style="italic">ready to serve traffic</text>
  <text x="588" y="284" font-size="8.5" fill="#a33" font-style="italic">in milliseconds, not seconds</text>

  <!-- arrows between stages -->
  <line x1="187" y1="190" x2="212" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="367" y1="190" x2="392" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="547" y1="190" x2="572" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- legend / caption -->
  <text x="380" y="340" font-size="10.5" fill="#666666" text-anchor="middle">The native-image builder performs closed-world reachability analysis once, at build time, then compiles only</text>
  <text x="380" y="354" font-size="10.5" fill="#666666" text-anchor="middle">what is reachable, ahead of time -- there is no JIT warm-up and no runtime class loading in the result.</text>

  <rect x="32" y="375" width="696" height="30" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="393" font-size="9.5" fill="#666666" text-anchor="middle">GraalVM (upstream) and Mandrel (Red Hat's Quarkus-focused downstream) are interchangeable builder distributions here</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
