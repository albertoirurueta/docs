<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How an OpenAPI file becomes API pages in a Docusaurus site</title>
  <desc id="d">The gen-api-docs command reads the OpenAPI file and writes MDX pages, JSON files and a sidebar file into the output directory. The normal Docusaurus build then renders those pages with the ApiItem component of the OpenAPI theme.</desc>
  <rect width="760" height="330" rx="12" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="13" font-weight="bold" fill="#ffffff">Step 1: generate (docusaurus gen-api-docs)</text>
  <text x="30" y="212" font-size="13" font-weight="bold" fill="#ffffff">Step 2: build (docusaurus build or start)</text>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="50" width="200" height="70" rx="8" fill="#cfe3f7"/>
    <text x="32" y="74" font-weight="bold">openapi/pocket-units.yaml</text>
    <text x="32" y="94">specPath: file, URL or folder</text>

    <rect x="270" y="50" width="200" height="70" rx="8" fill="#fbe5c8"/>
    <text x="282" y="74" font-weight="bold">plugin config entry</text>
    <text x="282" y="94">id, outputDir, sidebarOptions</text>

    <rect x="520" y="50" width="220" height="140" rx="8" fill="#d9ead3"/>
    <text x="532" y="74" font-weight="bold">docs/api (outputDir)</text>
    <text x="532" y="98">*.info.mdx  overview page</text>
    <text x="532" y="118">*.api.mdx  one per operation</text>
    <text x="532" y="138">*.tag.mdx  one per tag</text>
    <text x="532" y="158">*.json  externalized props</text>
    <text x="532" y="178">sidebar.ts  sidebar slice</text>

    <rect x="20" y="230" width="220" height="70" rx="8" fill="#d9ead3"/>
    <text x="32" y="254" font-weight="bold">generated MDX and sidebar</text>
    <text x="32" y="274">plain docs for the docs plugin</text>

    <rect x="290" y="230" width="210" height="70" rx="8" fill="#fbe5c8"/>
    <text x="302" y="254" font-weight="bold">docItemComponent</text>
    <text x="302" y="274">@theme/ApiItem renders them</text>

    <rect x="550" y="230" width="190" height="70" rx="8" fill="#cfe3f7"/>
    <text x="562" y="254" font-weight="bold">static site</text>
    <text x="562" y="274">endpoint, schema, try-it panel</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M220 85 H270"/>
    <path d="M470 85 H520"/>
    <path d="M240 265 H290"/>
    <path d="M500 265 H550"/>
  </g>
  <g fill="#ffffff"><path d="M270 85 l-8 -5 v10z"/><path d="M520 85 l-8 -5 v10z"/><path d="M290 265 l-8 -5 v10z"/><path d="M550 265 l-8 -5 v10z"/></g>
</svg>
