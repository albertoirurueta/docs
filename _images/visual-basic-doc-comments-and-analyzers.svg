<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Where documentation comments, analyzers and code style rules enter a Visual Basic build</title>
  <desc id="d">Source files with triple-apostrophe documentation comments, the project file and the editorconfig files flow into the Roslyn Visual Basic compiler together with the analyzers from the SDK. The compiler writes the assembly and, when GenerateDocumentationFile is on, an XML documentation file. Diagnostics with BC, CA and IDE ids go to the build output, where severity is decided by editorconfig, globalconfig, NoWarn and WarningsAsErrors, and by Disable Warning directives in the source. The XML file feeds IntelliSense, NuGet packages and DocFX.</desc>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Documentation comments, analyzers and code style in one build</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">The same compiler run produces the XML file and every BC, CA and IDE diagnostic; configuration decides what each diagnostic costs</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  </defs>

  <text x="24" y="78" font-size="13" font-weight="bold" fill="#1c4b73">1. Inputs</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="90" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="129" y="114" font-weight="bold">.vb sources</text>
    <text x="129" y="132" font-size="11">''' summary, param, returns,</text>
    <text x="129" y="147" font-size="11">exception, see cref, inheritdoc;</text>
    <text x="129" y="162" font-size="11">#Disable Warning in code</text>

    <rect x="252" y="90" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="357" y="114" font-weight="bold">.vbproj</text>
    <text x="357" y="132" font-size="11">GenerateDocumentationFile,</text>
    <text x="357" y="147" font-size="11">AnalysisLevel, AnalysisMode,</text>
    <text x="357" y="162" font-size="11">EnforceCodeStyleInBuild, NoWarn</text>

    <rect x="480" y="90" width="226" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="593" y="114" font-weight="bold">.editorconfig, .globalconfig</text>
    <text x="593" y="132" font-size="11">dotnet_diagnostic.ID.severity,</text>
    <text x="593" y="147" font-size="11">naming rules, style options,</text>
    <text x="593" y="162" font-size="11">per folder and per glob</text>

    <rect x="724" y="90" width="212" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="830" y="114" font-weight="bold">Analyzers from the SDK</text>
    <text x="830" y="132" font-size="11">CAxxxx quality rules,</text>
    <text x="830" y="147" font-size="11">IDExxxx style rules,</text>
    <text x="830" y="162" font-size="11">no package to install</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="129" y1="172" x2="129" y2="204"/>
    <line x1="357" y1="172" x2="357" y2="204"/>
    <line x1="593" y1="172" x2="593" y2="204"/>
    <line x1="830" y1="172" x2="830" y2="204"/>
  </g>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="206" width="912" height="84" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="480" y="228" font-weight="bold">2. Roslyn Visual Basic compiler (vbc) run by dotnet build</text>
    <text x="480" y="248" font-size="11">parses the doc comments as XML and checks param, typeparam, cref and placement (BC423xx); runs the analyzers</text>
    <text x="480" y="264" font-size="11">on the syntax and the semantic model; applies the severity from the configuration files, then the directives and options</text>
    <text x="480" y="280" font-size="11">IDE rules run during the build only when EnforceCodeStyleInBuild is true</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="240" y1="290" x2="240" y2="324"/>
    <line x1="720" y1="290" x2="720" y2="324"/>
  </g>

  <text x="24" y="320" font-size="13" font-weight="bold" fill="#1c4b73">3. Outputs</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="326" width="430" height="62" fill="#f4f4f4" stroke="#888888"/>
    <text x="239" y="350" font-weight="bold">Assembly.dll, Assembly.xml</text>
    <text x="239" y="368" font-size="11">member ids such as M:Ns.Type.Method(System.Int32), tags copied as written</text>

    <rect x="506" y="326" width="430" height="62" fill="#f4f4f4" stroke="#888888"/>
    <text x="721" y="350" font-weight="bold">Build output and the Error List</text>
    <text x="721" y="368" font-size="11">BC, CA and IDE ids, each as error, warning, suggestion or none</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="239" y1="388" x2="239" y2="420"/>
  </g>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="422" width="430" height="62" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="239" y="446" font-weight="bold">Consumers of the XML file</text>
    <text x="239" y="464" font-size="11">IntelliSense, lib/tfm/ in a NuGet package, DocFX (reads the assembly)</text>

    <rect x="506" y="422" width="430" height="62" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="721" y="446" font-weight="bold">dotnet format and Visual Studio Code Cleanup</text>
    <text x="721" y="464" font-size="11">apply the fixes for the style rules named in the same .editorconfig</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="721" y1="388" x2="721" y2="420"/>
  </g>
</svg>
