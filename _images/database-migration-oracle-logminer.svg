<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">How the Debezium Oracle connector reads changes with LogMiner</text>

  <!-- Oracle database boundary -->
  <rect x="20" y="50" width="520" height="400" rx="10" fill="#fff8f8" stroke="#c62828" stroke-dasharray="6,4"/>
  <text x="35" y="72" font-size="13" font-weight="bold" fill="#c62828">Oracle CDB FREE (ARCHIVELOG, supplemental logging)</text>

  <!-- legacy app -->
  <rect x="40" y="90" width="200" height="50" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="140" y="112" text-anchor="middle" fill="#263238">Legacy Bookshop app</text>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#455a64">INSERT / UPDATE / DELETE</text>

  <!-- PDB tables -->
  <rect x="40" y="170" width="200" height="60" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="140" y="194" text-anchor="middle" fill="#263238">PDB FREEPDB1</text>
  <text x="140" y="214" text-anchor="middle" font-size="12" fill="#455a64">BOOKSHOP.BOOK, ORDERS, ...</text>
  <line x1="140" y1="140" x2="140" y2="168" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- redo logs -->
  <rect x="40" y="265" width="200" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="140" y="289" text-anchor="middle" fill="#263238">Online redo logs</text>
  <text x="140" y="309" text-anchor="middle" font-size="12" fill="#455a64">written by LGWR, circular</text>
  <line x1="140" y1="230" x2="140" y2="263" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="252" font-size="12" fill="#455a64">commit = redo</text>

  <!-- archive logs -->
  <rect x="40" y="365" width="200" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="140" y="389" text-anchor="middle" fill="#263238">Archive logs</text>
  <text x="140" y="409" text-anchor="middle" font-size="12" fill="#455a64">LOCAL + VALID destination</text>
  <line x1="140" y1="325" x2="140" y2="363" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="349" font-size="12" fill="#455a64">ARCn on log switch</text>

  <!-- LogMiner session -->
  <rect x="300" y="215" width="220" height="110" rx="6" fill="#fffde7" stroke="#f9a825"/>
  <text x="410" y="240" text-anchor="middle" font-weight="bold" fill="#263238">LogMiner session</text>
  <text x="410" y="262" text-anchor="middle" font-size="12" fill="#455a64">DBMS_LOGMNR.START_LOGMNR</text>
  <text x="410" y="280" text-anchor="middle" font-size="12" fill="#455a64">SCN window: lower to upper</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#455a64">dictionary: online catalog</text>
  <text x="410" y="316" text-anchor="middle" font-size="12" fill="#455a64">view V$LOGMNR_CONTENTS</text>
  <line x1="240" y1="295" x2="298" y2="280" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="395" x2="298" y2="310" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- flush table -->
  <rect x="300" y="100" width="220" height="50" rx="6" fill="#eceff1" stroke="#607d8b"/>
  <text x="410" y="122" text-anchor="middle" fill="#263238">LOG_MINING_FLUSH table</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#455a64">forces LGWR to flush redo</text>

  <!-- Debezium connector -->
  <rect x="590" y="90" width="290" height="250" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="735" y="114" text-anchor="middle" font-weight="bold" fill="#263238">Debezium Oracle connector</text>
  <text x="735" y="132" text-anchor="middle" font-size="12" fill="#455a64">bookshop-oracle-source, adapter logminer</text>

  <rect x="610" y="150" width="250" height="45" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="735" y="169" text-anchor="middle" font-size="13" fill="#263238">1. Mining query as C##DBZUSER</text>
  <text x="735" y="186" text-anchor="middle" font-size="12" fill="#455a64">filter mode none / in / regex</text>

  <rect x="610" y="205" width="250" height="55" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="735" y="225" text-anchor="middle" font-size="13" fill="#263238">2. Transaction buffer</text>
  <text x="735" y="243" text-anchor="middle" font-size="12" fill="#455a64">memory (heap), Infinispan or Ehcache</text>

  <rect x="610" y="270" width="250" height="55" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="735" y="290" text-anchor="middle" font-size="13" fill="#263238">3. On COMMIT: emit events</text>
  <text x="735" y="308" text-anchor="middle" font-size="12" fill="#455a64">on ROLLBACK: discard</text>

  <line x1="735" y1="195" x2="735" y2="203" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="735" y1="260" x2="735" y2="268" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="520" y1="260" x2="608" y2="175" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="205" font-size="12" fill="#455a64">rows</text>
  <line x1="608" y1="140" x2="522" y2="125" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Kafka -->
  <rect x="590" y="380" width="290" height="190" rx="10" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="735" y="404" text-anchor="middle" font-weight="bold" fill="#263238">Kafka (topic.prefix = legacy)</text>
  <text x="735" y="430" text-anchor="middle" font-size="12" fill="#263238">legacy.BOOKSHOP.BOOK, .ORDERS, ...</text>
  <text x="735" y="452" text-anchor="middle" font-size="12" fill="#263238">legacy.schema-history (DDL, internal)</text>
  <text x="735" y="474" text-anchor="middle" font-size="12" fill="#263238">legacy (schema change topic)</text>
  <text x="735" y="496" text-anchor="middle" font-size="12" fill="#263238">__debezium-heartbeat.legacy</text>
  <text x="735" y="518" text-anchor="middle" font-size="12" fill="#263238">legacy.signals / legacy.notifications</text>
  <text x="735" y="546" text-anchor="middle" font-size="12" fill="#455a64">Connect offsets: scn, commit_scn</text>
  <line x1="735" y1="340" x2="735" y2="378" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- legend / note -->
  <rect x="20" y="470" width="540" height="100" rx="8" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="35" y="494" font-size="13" font-weight="bold" fill="#263238">What must stay true</text>
  <text x="35" y="516" font-size="12" fill="#37474f">The SCN in the connector offset must still be in an online or archive log.</text>
  <text x="35" y="536" font-size="12" fill="#37474f">Long open transactions pin the mining window and grow the buffer.</text>
  <text x="35" y="556" font-size="12" fill="#37474f">DDL on captured tables needs the hybrid strategy or a pause in DML.</text>
</svg>
