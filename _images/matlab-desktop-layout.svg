<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="mdl-title mdl-desc">
  <title id="mdl-title">Schematic of the MATLAB desktop since R2025a</title>
  <desc id="mdl-desc">An original schematic, not a screenshot. A toolstrip with a search box runs along the top. A left sidebar holds the Files panel and a right sidebar holds the Workspace panel. The centre holds the Editor, with figures as tabs next to it. The Command Window with the prompt sits at the bottom. Further panels such as the Debugger, Project, Test Browser, Code Issues and Source Control open from the sidebars.</desc>
  <rect x="0" y="0" width="960" height="520" rx="12" fill="#f8fafc"/>
  <rect x="20" y="16" width="920" height="488" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="20" y="16" width="920" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="48" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Toolstrip: Home, Plots, Apps, Editor tabs</text>
  <rect x="716" y="28" width="206" height="28" rx="14" fill="#ffffff" stroke="#64748b"/>
  <text x="732" y="47" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#475569">Search (Ctrl+Shift+Space)</text>

  <rect x="20" y="68" width="44" height="436" fill="#cbd5e1" stroke="#94a3b8"/>
  <text transform="translate(48 280) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Left sidebar</text>
  <rect x="896" y="68" width="44" height="436" fill="#cbd5e1" stroke="#94a3b8"/>
  <text transform="translate(924 280) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Right sidebar</text>

  <rect x="72" y="76" width="170" height="270" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="84" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">Files panel</text>
  <text x="84" y="126" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a">heatflow/</text>
  <text x="96" y="146" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a">+heatflow/</text>
  <text x="96" y="166" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a">data/</text>
  <text x="96" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a">run_demo.m</text>

  <rect x="250" y="76" width="450" height="270" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <rect x="250" y="76" width="450" height="30" rx="6" fill="#fde68a" stroke="#a16207"/>
  <text x="262" y="97" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#713f12">run_demo.m</text>
  <rect x="352" y="80" width="118" height="22" rx="4" fill="#fffbeb" stroke="#a16207"/>
  <text x="362" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#713f12">Figure 1 (tab)</text>
  <text x="266" y="140" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#713f12">Editor and figures</text>
  <text x="266" y="166" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#854d0e">Documents and figures share the centre area</text>
  <text x="266" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#854d0e">as tabs, which you can split and rearrange</text>

  <rect x="708" y="76" width="180" height="270" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="720" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4c1d95">Workspace panel</text>
  <text x="720" y="126" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#4c1d95">alpha  1x1</text>
  <text x="720" y="146" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#4c1d95">T      64x64</text>
  <text x="720" y="166" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#4c1d95">x      1x1</text>

  <rect x="72" y="354" width="816" height="142" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="86" y="380" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Command Window</text>
  <text x="86" y="410" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">&gt;&gt; x = 7*6</text>
  <text x="86" y="432" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">x =</text>
  <text x="86" y="454" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">    42</text>
  <text x="86" y="480" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">&gt;&gt; _</text>
  <text x="560" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Other panels open from the sidebars:</text>
  <text x="560" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Debugger, Project, Test Browser,</text>
  <text x="560" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Code Issues, Source Control</text>
</svg>
