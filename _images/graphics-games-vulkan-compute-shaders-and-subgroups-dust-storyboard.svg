<text x="380" y="250" text-anchor="middle" font-size="12" fill="#1F2937">steps 3 to 5 repeat every frame; delta time goes in a push constant</text>
<text x="380" y="272" text-anchor="middle" font-size="11" fill="#374151">the buffer needs STORAGE_BUFFER and VERTEX_BUFFER usage</text>
