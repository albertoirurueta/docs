<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Inside loan-letter.docx: one main document part and the parts it points to</text>

  <rect x="20" y="42" width="410" height="410" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="1.4"/>
  <text x="225" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Zip entries (unzip -l loan-letter.docx)</text>

  <rect x="36" y="78" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="98" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">[Content_Types].xml</text>
  <rect x="36" y="114" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="134" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">_rels/.rels</text>
  <rect x="36" y="150" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="170" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">docProps/core.xml, docProps/app.xml</text>
  <rect x="36" y="186" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="206" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/document.xml</text>
  <rect x="36" y="222" width="378" height="30" rx="4" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="48" y="242" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/_rels/document.xml.rels</text>
  <rect x="36" y="258" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="278" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/styles.xml, word/numbering.xml</text>
  <rect x="36" y="294" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="314" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/header1.xml, word/footer1.xml</text>
  <rect x="36" y="330" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="350" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/settings.xml, word/fontTable.xml</text>
  <rect x="36" y="366" width="378" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="48" y="386" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/comments.xml, word/footnotes.xml</text>
  <rect x="36" y="402" width="378" height="30" rx="4" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="48" y="422" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">word/media/image1.png (binary part)</text>

  <text x="670" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Relationships from the main part</text>
  <rect x="560" y="78" width="220" height="50" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="670" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">word/document.xml</text>
  <text x="670" y="116" text-anchor="middle" font-size="11" fill="#333">paragraphs, runs, tables (body)</text>

  <rect x="470" y="190" width="150" height="40" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="545" y="215" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">styles.xml</text>
  <rect x="640" y="190" width="150" height="40" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="715" y="215" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">header1.xml</text>
  <rect x="810" y="190" width="80" height="40" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="850" y="215" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">footer1</text>
  <rect x="540" y="290" width="160" height="40" rx="6" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="620" y="315" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">media/image1.png</text>
  <rect x="730" y="290" width="150" height="40" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="805" y="315" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#2d2d2d">numbering.xml</text>

  <line x1="640" y1="128" x2="560" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="690" y1="128" x2="715" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="740" y1="128" x2="840" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="660" y1="128" x2="630" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="730" y1="128" x2="790" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <text x="670" y="380" text-anchor="middle" font-size="11" fill="#333">Each arrow is a relationship in word/_rels/document.xml.rels:</text>
  <text x="670" y="396" text-anchor="middle" font-size="11" fill="#333">Id (rId1, rId2 ...), Type URI and Target path.</text>
  <text x="670" y="430" text-anchor="middle" font-size="11" fill="#333">Purple: OPC plumbing. Blue: WordprocessingML parts. Orange: binary.</text>
</svg>
