<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The FastAPI layer stack</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">each layer only talks to the one directly above and below it</text>

  <!-- Layer 1: your code -->
  <rect x="60" y="62" width="400" height="62" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="260" y="86" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Your code</text>
  <text x="260" y="104" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">path operations, dependencies, models</text>
  <text x="260" y="118" font-size="10" fill="#666666" text-anchor="middle">the Bookshelf API lives here</text>

  <!-- Layer 2: FastAPI -->
  <rect x="60" y="140" width="400" height="76" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="260" y="164" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">FastAPI</text>
  <text x="260" y="182" font-size="11" fill="#444444" text-anchor="middle">parameter declaration from type hints, dependency injection,</text>
  <text x="260" y="196" font-size="11" fill="#444444" text-anchor="middle">OpenAPI generation, interactive docs, security helpers</text>
  <text x="260" y="210" font-size="10" fill="#666666" text-anchor="middle">a subclass of Starlette's application class</text>

  <!-- Layer 3: Starlette -->
  <rect x="60" y="232" width="400" height="76" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="260" y="256" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Starlette</text>
  <text x="260" y="274" font-size="11" fill="#444444" text-anchor="middle">routing, middleware, Request and Response, WebSockets,</text>
  <text x="260" y="288" font-size="11" fill="#444444" text-anchor="middle">background tasks, static files, test client</text>
  <text x="260" y="302" font-size="10" fill="#666666" text-anchor="middle">the ASGI toolkit</text>

  <!-- Layer 4: ASGI server -->
  <rect x="60" y="324" width="400" height="56" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="260" y="348" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">ASGI server</text>
  <text x="260" y="366" font-size="11" fill="#444444" text-anchor="middle">Uvicorn, Hypercorn, Daphne, Granian -- sockets and HTTP parsing</text>

  <!-- ASGI contract arrow -->
  <line x1="260" y1="324" x2="260" y2="308" stroke="#444444" stroke-width="1.4"/>
  <polygon points="260,308 255,316 265,316" fill="#444444"/>
  <text x="272" y="319" font-size="10" fill="#666666">ASGI (scope, receive, send)</text>

  <!-- Pydantic beside -->
  <rect x="520" y="140" width="160" height="108" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="600" y="166" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Pydantic v2</text>
  <text x="600" y="186" font-size="11" fill="#444444" text-anchor="middle">validation</text>
  <text x="600" y="202" font-size="11" fill="#444444" text-anchor="middle">serialization</text>
  <text x="600" y="218" font-size="11" fill="#444444" text-anchor="middle">JSON Schema</text>
  <text x="600" y="236" font-size="10" fill="#666666" text-anchor="middle">Rust core (pydantic-core)</text>

  <line x1="520" y1="178" x2="466" y2="178" stroke="#7a4a00" stroke-width="1.4"/>
  <polygon points="462,178 470,173 470,183" fill="#7a4a00"/>
  <text x="493" y="168" font-size="10" fill="#666666" text-anchor="middle">used by</text>

  <!-- request / response legend -->
  <text x="520" y="290" font-size="11" fill="#222222" font-weight="bold">A request travels</text>
  <text x="520" y="306" font-size="11" fill="#444444">bottom to top,</text>
  <text x="520" y="322" font-size="11" fill="#444444">the response</text>
  <text x="520" y="338" font-size="11" fill="#444444">travels back down.</text>
</svg>
