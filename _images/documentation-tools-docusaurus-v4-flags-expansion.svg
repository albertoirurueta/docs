<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What future v4 true switches on in Docusaurus 3.10</title>
  <desc id="d">The shorthand future v4 true expands into five v4 flags. Each flag changes one default: the legacy postBuild head attribute is removed, built-in CSS is wrapped in cascade layers, storage keys are namespaced, all Docusaurus Faster flags default to true, and the three MDX v1 compatibility options default to false.</desc>
  <rect width="760" height="420" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff" font-weight="bold"><text x="20" y="30">Shorthand</text><text x="215" y="30">Flag it expands to</text><text x="505" y="30">Default that changes</text></g>
  <rect x="20" y="130" width="150" height="150" rx="10" fill="#ffffff"/>
  <g font-size="14" fill="#1b2733" font-weight="bold"><text x="32" y="192">future: {</text><text x="44" y="212">v4: true</text><text x="32" y="232">}</text></g>
  <path d="M170 205 L205 78" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="205" y="48" width="255" height="60" rx="8" fill="#f7e3b5"/>
  <text x="215" y="82" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1b2733" font-weight="bold">removeLegacyPostBuildHeadAttribute</text>
  <path d="M460 78 L488 78" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <polygon points="488,73 498,78 488,83" fill="#ffffff"/>
  <rect x="500" y="48" width="245" height="60" rx="8" fill="#f7e3b5"/>
  <text x="510" y="74" font-size="12" fill="#1b2733">Plugin postBuild head attribute</text>
  <text x="510" y="91" font-size="12" fill="#1b2733">removed; ssgWorkerThreads allowed</text>
  <path d="M170 205 L205 150" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="205" y="120" width="255" height="60" rx="8" fill="#cfe3f7"/>
  <text x="215" y="154" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1b2733" font-weight="bold">useCssCascadeLayers</text>
  <path d="M460 150 L488 150" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <polygon points="488,145 498,150 488,155" fill="#ffffff"/>
  <rect x="500" y="120" width="245" height="60" rx="8" fill="#cfe3f7"/>
  <text x="510" y="146" font-size="12" fill="#1b2733">Built-in CSS wrapped in</text>
  <text x="510" y="163" font-size="12" fill="#1b2733">docusaurus.* cascade layers</text>
  <path d="M170 205 L205 222" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="205" y="192" width="255" height="60" rx="8" fill="#e6d3f0"/>
  <text x="215" y="226" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1b2733" font-weight="bold">siteStorageNamespacing</text>
  <path d="M460 222 L488 222" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <polygon points="488,217 498,222 488,227" fill="#ffffff"/>
  <rect x="500" y="192" width="245" height="60" rx="8" fill="#e6d3f0"/>
  <text x="510" y="218" font-size="12" fill="#1b2733">storage.namespace defaults</text>
  <text x="510" y="235" font-size="12" fill="#1b2733">to true (keys get a suffix)</text>
  <path d="M170 205 L205 294" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="205" y="264" width="255" height="60" rx="8" fill="#cfeacb"/>
  <text x="215" y="298" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1b2733" font-weight="bold">fasterByDefault</text>
  <path d="M460 294 L488 294" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <polygon points="488,289 498,294 488,299" fill="#ffffff"/>
  <rect x="500" y="264" width="245" height="60" rx="8" fill="#cfeacb"/>
  <text x="510" y="290" font-size="12" fill="#1b2733">All nine future.faster flags</text>
  <text x="510" y="307" font-size="12" fill="#1b2733">default to true</text>
  <path d="M170 205 L205 366" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="205" y="336" width="255" height="60" rx="8" fill="#f4c7c3"/>
  <text x="215" y="370" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1b2733" font-weight="bold">mdx1CompatDisabledByDefault</text>
  <path d="M460 366 L488 366" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <polygon points="488,361 498,366 488,371" fill="#ffffff"/>
  <rect x="500" y="336" width="245" height="60" rx="8" fill="#f4c7c3"/>
  <text x="510" y="362" font-size="12" fill="#1b2733">markdown.mdx1Compat comments,</text>
  <text x="510" y="379" font-size="12" fill="#1b2733">admonitions, headingIds: false</text>
</svg>
