<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One authoritative server, many approximate clients</text>
<rect x="190" y="50" width="380" height="190" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="380" y="72" text-anchor="middle" font-size="14" fill="#047857" font-weight="bold">Server (dedicated or listen)</text>
<text x="380" y="96" text-anchor="middle" font-size="12" fill="#374151">AGameModeBase: exists only here</text>
<text x="380" y="114" text-anchor="middle" font-size="12" fill="#374151">AGameStateBase, one APlayerState per player</text>
<text x="380" y="132" text-anchor="middle" font-size="12" fill="#374151">APlayerController for every connection</text>
<text x="380" y="150" text-anchor="middle" font-size="12" fill="#374151">ABookActor, AShelfActor: Role = Authority</text>
<text x="380" y="168" text-anchor="middle" font-size="12" fill="#374151">Simulation, scoring, spawning and rules</text>
<text x="380" y="220" text-anchor="middle" font-size="11" fill="#047857">Clients see these actors as Simulated or Autonomous Proxy</text>
<rect x="20" y="300" width="240" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="140" y="322" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Client 1 (owner of Pawn 1)</text>
<text x="140" y="346" text-anchor="middle" font-size="12" fill="#374151">Own pawn: Role AutonomousProxy</text>
<text x="140" y="364" text-anchor="middle" font-size="12" fill="#374151">Other pawn: SimulatedProxy</text>
<text x="140" y="382" text-anchor="middle" font-size="12" fill="#374151">Books: SimulatedProxy</text>
<text x="140" y="400" text-anchor="middle" font-size="12" fill="#374151">Own APlayerController only</text>
<text x="140" y="418" text-anchor="middle" font-size="12" fill="#374151">No GameMode</text>
<rect x="500" y="300" width="240" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="620" y="322" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Client 2 (owner of Pawn 2)</text>
<text x="620" y="346" text-anchor="middle" font-size="12" fill="#374151">Own pawn: Role AutonomousProxy</text>
<text x="620" y="364" text-anchor="middle" font-size="12" fill="#374151">Other pawn: SimulatedProxy</text>
<text x="620" y="382" text-anchor="middle" font-size="12" fill="#374151">Books: SimulatedProxy</text>
<text x="620" y="400" text-anchor="middle" font-size="12" fill="#374151">Own APlayerController only</text>
<text x="620" y="418" text-anchor="middle" font-size="12" fill="#374151">No GameMode</text>
<line x1="290" y1="242" x2="215" y2="298" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="470" y1="242" x2="545" y2="298" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="75" y1="298" x2="210" y2="242" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<line x1="685" y1="298" x2="550" y2="242" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<rect x="266" y="264" width="68" height="18" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="300" y="276" text-anchor="middle" font-size="11" fill="#4B5563">state</text>
<rect x="426" y="264" width="68" height="18" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="460" y="276" text-anchor="middle" font-size="11" fill="#4B5563">state</text>
<rect x="76" y="250" width="68" height="18" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="110" y="262" text-anchor="middle" font-size="11" fill="#92400E">Server RPC</text>
<rect x="616" y="250" width="68" height="18" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="650" y="262" text-anchor="middle" font-size="11" fill="#92400E">Server RPC</text>
<text x="380" y="456" text-anchor="middle" font-size="12" fill="#374151">Solid arrows: the server sends state. Dashed arrows: owning clients ask the server to act.</text>
</svg>
