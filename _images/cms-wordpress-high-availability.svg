<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Reference high-availability topology for WordPress</title>
  <desc id="d">Visitors and editors reach a CDN or edge cache, which serves cached anonymous pages and static files and forwards the rest to a load balancer. The load balancer terminates TLS, sets X-Forwarded-Proto and health-checks three identical, stateless web nodes running PHP-FPM with the same code, keys and salts and with DISABLE_WP_CRON set. Exactly one scheduler runs wp cron event run --due-now. All web nodes share the uploads store (object storage or NFS), a Redis persistent object cache, and a MySQL or MariaDB primary that replicates to one or more read replicas; a database drop-in such as LudicrousDB sends reads to replicas and writes to the primary.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8eef4"/>
    </marker>
  </defs>
  <rect width="760" height="600" rx="12" fill="#2b3a4a"/>

  <g font-size="12" fill="#1b2733">
    <!-- Clients -->
    <rect x="150" y="20" width="200" height="46" rx="8" fill="#cfe3f7"/>
    <text x="162" y="40" font-weight="bold">Visitors</text>
    <text x="162" y="57">anonymous, mostly cacheable</text>
    <rect x="410" y="20" width="200" height="46" rx="8" fill="#cfe3f7"/>
    <text x="422" y="40" font-weight="bold">Editors, REST clients</text>
    <text x="422" y="57">logged in, never cached</text>

    <!-- Edge -->
    <rect x="20" y="96" width="720" height="58" rx="8" fill="#fbe5c8"/>
    <text x="32" y="118" font-weight="bold">CDN / edge full-page cache</text>
    <text x="32" y="138">Serves cached HTML for anonymous visitors and static files (uploads, CSS, JS); bypasses on login cookies</text>

    <!-- Load balancer -->
    <rect x="20" y="184" width="720" height="58" rx="8" fill="#fbe5c8"/>
    <text x="32" y="206" font-weight="bold">Load balancer (nginx, HAProxy or a cloud load balancer), at least two instances</text>
    <text x="32" y="226">Terminates TLS, sets X-Forwarded-Proto and X-Forwarded-For, health-checks and removes failed nodes</text>

    <!-- Web nodes -->
    <rect x="20" y="276" width="225" height="108" rx="8" fill="#d9ead3"/>
    <text x="32" y="298" font-weight="bold">web1</text>
    <text x="32" y="318">nginx or Apache + PHP-FPM</text>
    <text x="32" y="336">same code, keys and salts</text>
    <text x="32" y="354">DISABLE_WP_CRON = true</text>
    <text x="32" y="372">no local state</text>
    <rect x="267" y="276" width="225" height="108" rx="8" fill="#d9ead3"/>
    <text x="279" y="298" font-weight="bold">web2</text>
    <text x="279" y="318">nginx or Apache + PHP-FPM</text>
    <text x="279" y="336">same code, keys and salts</text>
    <text x="279" y="354">DISABLE_WP_CRON = true</text>
    <text x="279" y="372">no local state</text>
    <rect x="515" y="276" width="225" height="108" rx="8" fill="#d9ead3"/>
    <text x="527" y="298" font-weight="bold">web3 ... webN</text>
    <text x="527" y="318">added or removed by load,</text>
    <text x="527" y="336">built from the same image</text>
    <text x="527" y="354">or release artefact</text>
    <text x="527" y="372">no local state</text>

    <!-- Scheduler -->
    <rect x="20" y="404" width="225" height="46" rx="8" fill="#e6dcf2"/>
    <text x="32" y="424" font-weight="bold">One scheduler only</text>
    <text x="32" y="441">wp cron event run --due-now</text>

    <!-- Shared services -->
    <rect x="267" y="404" width="225" height="46" rx="8" fill="#e6dcf2"/>
    <text x="279" y="424" font-weight="bold">Shared uploads</text>
    <text x="279" y="441">object storage + offload, or NFS</text>
    <rect x="515" y="404" width="225" height="46" rx="8" fill="#e6dcf2"/>
    <text x="527" y="424" font-weight="bold">Redis object cache</text>
    <text x="527" y="441">object-cache.php drop-in</text>

    <rect x="20" y="490" width="335" height="90" rx="8" fill="#f4cccc"/>
    <text x="32" y="512" font-weight="bold">Database primary (MySQL or MariaDB)</text>
    <text x="32" y="532">every write, and reads right after a write</text>
    <text x="32" y="550">with a standby for failover</text>
    <text x="32" y="568">backed up and restore-tested</text>
    <rect x="405" y="490" width="335" height="90" rx="8" fill="#f4cccc"/>
    <text x="417" y="512" font-weight="bold">Read replicas (one or more)</text>
    <text x="417" y="532">most SELECT queries, routed by a</text>
    <text x="417" y="550">db.php drop-in (LudicrousDB, HyperDB)</text>
    <text x="417" y="568">replication lag must stay small</text>
  </g>

  <g stroke="#e8eef4" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="250" y1="66" x2="250" y2="94"/>
    <line x1="510" y1="66" x2="510" y2="94"/>
    <line x1="380" y1="154" x2="380" y2="182"/>
    <line x1="132" y1="242" x2="132" y2="274"/>
    <line x1="380" y1="242" x2="380" y2="274"/>
    <line x1="627" y1="242" x2="627" y2="274"/>
    <line x1="132" y1="384" x2="132" y2="402"/>
    <line x1="380" y1="384" x2="380" y2="402"/>
    <line x1="627" y1="384" x2="627" y2="402"/>
    <line x1="187" y1="478" x2="187" y2="488"/>
    <line x1="573" y1="478" x2="573" y2="488"/>
    <line x1="355" y1="535" x2="403" y2="535"/>
  </g>
  <text x="358" y="527" font-size="10" fill="#e8eef4">replicates</text>
  <text x="380" y="472" font-size="11" fill="#e8eef4" text-anchor="middle">Every web node and the scheduler: writes go to the primary, reads to the replicas</text>
</svg>
