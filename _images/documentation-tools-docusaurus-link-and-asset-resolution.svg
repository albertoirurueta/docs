<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How Docusaurus treats a path written in a Markdown link or image</title>
  <desc id="d">Four kinds of path on the left and the result of each on the right: a file path to a document becomes a page URL, a relative asset path becomes a hashed file, an absolute path is looked up in the static folders, and a pathname protocol path is left untouched.</desc>
  <rect width="760" height="330" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <text x="30" y="34">Path written in Markdown</text>
    <text x="300" y="34">What the build does</text>
    <text x="545" y="34">Result in the page</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="50" width="240" height="56" rx="8" fill="#cfe3f7"/>
    <text x="32" y="74">[Other](./other.md)</text>
    <text x="32" y="93">file path to a document</text>
    <rect x="280" y="50" width="220" height="56" rx="8" fill="#f7e3b5"/>
    <text x="292" y="74">finds the doc in the same</text>
    <text x="292" y="93">plugin, takes its URL</text>
    <rect x="520" y="50" width="220" height="56" rx="8" fill="#d5ecd4"/>
    <text x="532" y="74">href="/guides/other"</text>
    <text x="532" y="93">(extension dropped)</text>

    <rect x="20" y="120" width="240" height="56" rx="8" fill="#cfe3f7"/>
    <text x="32" y="144">![Logo](./logo.svg)</text>
    <text x="32" y="163">relative asset path</text>
    <rect x="280" y="120" width="220" height="56" rx="8" fill="#f7e3b5"/>
    <text x="292" y="144">converted to a require()</text>
    <text x="292" y="163">call, file is bundled</text>
    <rect x="520" y="120" width="220" height="56" rx="8" fill="#d5ecd4"/>
    <text x="532" y="144">small file: data URI</text>
    <text x="532" y="163">larger: /assets/ + hash</text>

    <rect x="20" y="190" width="240" height="56" rx="8" fill="#cfe3f7"/>
    <text x="32" y="214">[CSV](/files/units.csv)</text>
    <text x="32" y="233">absolute path, static folder</text>
    <rect x="280" y="190" width="220" height="56" rx="8" fill="#f7e3b5"/>
    <text x="292" y="214">looked up in static/ and</text>
    <text x="292" y="233">bundled like an asset</text>
    <rect x="520" y="190" width="220" height="56" rx="8" fill="#d5ecd4"/>
    <text x="532" y="214">href="/assets/files/</text>
    <text x="532" y="233">units-HASH.csv"</text>

    <rect x="20" y="260" width="240" height="56" rx="8" fill="#cfe3f7"/>
    <text x="32" y="284">[CSV](pathname:///files/units.csv)</text>
    <text x="32" y="303">pathname protocol</text>
    <rect x="280" y="260" width="220" height="56" rx="8" fill="#f7e3b5"/>
    <text x="292" y="284">no processing, no check</text>
    <text x="292" y="303">that the file exists</text>
    <rect x="520" y="260" width="220" height="56" rx="8" fill="#d5ecd4"/>
    <text x="532" y="284">href="/files/units.csv"</text>
    <text x="532" y="303">(copied from static/)</text>
  </g>
</svg>
