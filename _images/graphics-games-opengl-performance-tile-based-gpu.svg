<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-performance-tile-based-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Immediate-mode versus tile-based mobile GPUs</text>
<rect x="20" y="50" width="350" height="300" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Immediate-mode (desktop)</text>
<rect x="40" y="92" width="310" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195" y="121" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vertices -&gt; triangles -&gt; fragments</text>
<rect x="40" y="160" width="310" height="48" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="189" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Fragment shading writes straight to memory</text>
<rect x="40" y="228" width="310" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195" y="248" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Colour and depth traffic goes through</text>
<text x="195" y="263" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">the memory bus on every overdraw</text>
<line x1="195" y1="140" x2="195" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-tile-based-gpu)"/>
<line x1="195" y1="208" x2="195" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-tile-based-gpu)"/>
<rect x="40" y="296" width="310" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="321" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Wide high-bandwidth memory hides the cost</text>
<rect x="390" y="50" width="350" height="300" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Tile-based (most phones and tablets)</text>
<rect x="410" y="92" width="310" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565" y="117" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Pass 1: vertex work, triangles sorted into tiles</text>
<rect x="410" y="150" width="70" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="445" y="185" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">tile 1</text>
<rect x="490" y="150" width="70" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="525" y="185" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">tile 2</text>
<rect x="570" y="150" width="70" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="605" y="185" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">tile 3</text>
<rect x="650" y="150" width="70" height="60" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="685" y="185" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">tile 4</text>
<text x="565" y="226" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Pass 2: each tile is shaded in fast on-chip memory</text>
<rect x="410" y="240" width="310" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565" y="265" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Colour and depth stay on chip while the tile is shaded</text>
<line x1="565" y1="132" x2="565" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-tile-based-gpu)"/>
<line x1="565" y1="280" x2="565" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-tile-based-gpu)"/>
<rect x="410" y="300" width="310" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="325" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Resolve: tile written to memory once, at pass end</text>
<rect x="20" y="364" width="720" height="44" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="383" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Tilers reward: clear or invalidate attachments at the start and end of a pass, few pass switches,</text>
<text x="380" y="399" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">no mid-frame readbacks, and cheap blending. They punish: overdraw of heavy fragments and render-target ping-pong.</text>
</svg>
