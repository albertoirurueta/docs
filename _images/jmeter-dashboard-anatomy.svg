<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Anatomy of the JMeter HTML dashboard report</title>
<desc id="d">Schematic of the report folder produced by jmeter -e -o or jmeter -g -o. A left navigation menu links the Dashboard page (index.html) and three chart pages plus the custom graphs page. The Dashboard page holds, from top to bottom: the Test and Report information table (source file, start and end time, filters), the APDEX table next to the Requests Summary pie chart, the Statistics table, and the Errors table next to the Top 5 Errors by sampler table. The Over Time page holds Response Times Over Time, Response Time Percentiles Over Time, Active Threads Over Time, Bytes Throughput Over Time, Latencies Over Time and Connect Time Over Time. The Throughput page holds Hits Per Second, Codes Per Second, Transactions Per Second, Total Transactions Per Second, Response Time Vs Request and Latency Vs Request. The Response Times page holds Response Time Percentiles, Response Time Overview, Time Vs Threads and Response Time Distribution. The Customs Graphs page holds one graph per CustomGraphConsumer definition. The folder also contains statistics.json.</desc>

<text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold">HTML dashboard report: pages and panels (JMeter 5.6.3)</text>

<!-- report folder frame -->
<rect x="8" y="36" width="804" height="656" rx="8" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="6 4"/>
<text x="18" y="54" font-size="11" font-style="italic" fill-opacity=".8">output folder given with -o (must be empty or absent; -f empties it)</text>

<!-- sidebar -->
<rect x="18" y="66" width="140" height="372" rx="6" fill="#7f8c9a" fill-opacity=".14" stroke="#7f8c9a"/>
<text x="88" y="86" text-anchor="middle" font-weight="bold">Side menu</text>
<text x="30" y="112">Dashboard</text>
<text x="30" y="128" font-size="10" fill-opacity=".75">index.html</text>
<text x="30" y="156">Charts</text>
<text x="42" y="176">Over Time</text>
<text x="42" y="192">Throughput</text>
<text x="42" y="208">Response Times</text>
<text x="30" y="236">Customs Graphs</text>
<text x="42" y="256">Over Time</text>
<line x1="30" y1="282" x2="146" y2="282" stroke="currentColor" stroke-opacity=".3"/>
<text x="30" y="302" font-size="10.5">Also in the folder:</text>
<text x="30" y="320" font-size="10.5">statistics.json</text>
<text x="30" y="336" font-size="10" fill-opacity=".75">(Statistics table as</text>
<text x="30" y="350" font-size="10" fill-opacity=".75">JSON, since 5.1)</text>
<text x="30" y="372" font-size="10.5">content/, sbadmin2-1.0.7/</text>
<text x="30" y="388" font-size="10" fill-opacity=".75">(page scripts, styles)</text>
<text x="30" y="414" font-size="10.5">Each chart: tick or untick</text>
<text x="30" y="428" font-size="10.5">a series to show or hide it</text>

<!-- dashboard page -->
<rect x="170" y="66" width="632" height="372" rx="6" fill="#4f86c6" fill-opacity=".08" stroke="#4f86c6"/>
<text x="182" y="86" font-weight="bold">Dashboard page (index.html)</text>

<rect x="182" y="96" width="608" height="40" rx="4" fill="#4f86c6" fill-opacity=".16" stroke="#4f86c6"/>
<text x="194" y="113" font-weight="bold" font-size="11.5">Test and Report information</text>
<text x="194" y="128" font-size="10.5">Source file, Start Time, End Time, Filter for computing (sample_filter), Filter for display (series_filter)</text>

<rect x="182" y="146" width="360" height="92" rx="4" fill="#5aa469" fill-opacity=".16" stroke="#5aa469"/>
<text x="194" y="164" font-weight="bold" font-size="11.5">APDEX</text>
<text x="194" y="182" font-size="10.5">Apdex | T (Toleration threshold) | F (Frustration</text>
<text x="194" y="196" font-size="10.5">threshold) | Label, one row per label plus Total</text>
<text x="194" y="214" font-size="10.5">from apdex_satisfied_threshold, apdex_tolerated_</text>
<text x="194" y="228" font-size="10.5">threshold and apdex_per_transaction</text>

<rect x="552" y="146" width="238" height="92" rx="4" fill="#5aa469" fill-opacity=".16" stroke="#5aa469"/>
<text x="564" y="164" font-weight="bold" font-size="11.5">Requests Summary</text>
<text x="564" y="182" font-size="10.5">pie: PASS % vs FAIL %</text>
<text x="564" y="196" font-size="10.5">(transaction samples</text>
<text x="564" y="210" font-size="10.5">not counted)</text>
<circle cx="745" cy="196" r="28" fill="#5aa469" fill-opacity=".55" stroke="currentColor" stroke-opacity=".5"/>
<path d="M745 196 L745 168 A28 28 0 0 1 757.2 170.8 Z" fill="#d9534f" fill-opacity=".8" stroke="currentColor" stroke-opacity=".5"/>

<rect x="182" y="248" width="608" height="88" rx="4" fill="#e08a3c" fill-opacity=".14" stroke="#e08a3c"/>
<text x="194" y="266" font-weight="bold" font-size="11.5">Statistics</text>
<text x="194" y="284" font-size="10.5">Executions: Label | #Samples | FAIL | Error %</text>
<text x="194" y="300" font-size="10.5">Response Times (ms): Average | Min | Max | Median | 90th pct | 95th pct | 99th pct (aggregate_rpt_pct1..3)</text>
<text x="194" y="316" font-size="10.5">Throughput: Transactions/s | Network (KB/sec): Received | Sent</text>
<text x="194" y="330" font-size="10" fill-opacity=".75">one row per label, transaction rows included; the Total row counts real samples only</text>

<rect x="182" y="346" width="296" height="82" rx="4" fill="#d9534f" fill-opacity=".12" stroke="#d9534f"/>
<text x="194" y="364" font-weight="bold" font-size="11.5">Errors</text>
<text x="194" y="382" font-size="10.5">Type of error | Number of errors |</text>
<text x="194" y="396" font-size="10.5">% in errors | % in all samples</text>
<text x="194" y="414" font-size="10" fill-opacity=".75">type = code/message or assertion message</text>

<rect x="488" y="346" width="302" height="82" rx="4" fill="#d9534f" fill-opacity=".12" stroke="#d9534f"/>
<text x="500" y="364" font-weight="bold" font-size="11.5">Top 5 Errors by sampler</text>
<text x="500" y="382" font-size="10.5">Sample | #Samples | #Errors | Error | #Errors</text>
<text x="500" y="396" font-size="10.5">(five Error / #Errors pairs per row)</text>
<text x="500" y="414" font-size="10" fill-opacity=".75">transactions excluded by default</text>

<!-- chart pages -->
<rect x="18" y="452" width="254" height="230" rx="6" fill="#a06cc0" fill-opacity=".10" stroke="#a06cc0"/>
<text x="30" y="472" font-weight="bold">Charts &gt; Over Time</text>
<text x="30" y="486" font-size="10" fill-opacity=".75">content/pages/OverTime.html</text>
<text x="30" y="510" font-size="11">Response Times Over Time</text>
<text x="30" y="530" font-size="11">Response Time Percentiles Over</text>
<text x="40" y="544" font-size="11">Time (successful responses)</text>
<text x="30" y="564" font-size="11">Active Threads Over Time</text>
<text x="30" y="584" font-size="11">Bytes Throughput Over Time</text>
<text x="30" y="604" font-size="11">Latencies Over Time</text>
<text x="30" y="624" font-size="11">Connect Time Over Time</text>
<text x="30" y="652" font-size="10" fill-opacity=".75">x axis: elapsed time, one point per</text>
<text x="30" y="666" font-size="10" fill-opacity=".75">overall_granularity (default 60 000 ms)</text>

<rect x="282" y="452" width="254" height="230" rx="6" fill="#a06cc0" fill-opacity=".10" stroke="#a06cc0"/>
<text x="294" y="472" font-weight="bold">Charts &gt; Throughput</text>
<text x="294" y="486" font-size="10" fill-opacity=".75">content/pages/Throughput.html</text>
<text x="294" y="510" font-size="11">Hits Per Second</text>
<text x="294" y="530" font-size="11">Codes Per Second</text>
<text x="294" y="550" font-size="11">Transactions Per Second</text>
<text x="294" y="570" font-size="11">Total Transactions Per Second</text>
<text x="294" y="590" font-size="11">Response Time Vs Request</text>
<text x="294" y="610" font-size="11">Latency Vs Request</text>
<text x="294" y="652" font-size="10" fill-opacity=".75">rates per second; the two "Vs Request"</text>
<text x="294" y="666" font-size="10" fill-opacity=".75">charts put requests/s on the x axis</text>

<rect x="546" y="452" width="256" height="154" rx="6" fill="#a06cc0" fill-opacity=".10" stroke="#a06cc0"/>
<text x="558" y="472" font-weight="bold">Charts &gt; Response Times</text>
<text x="558" y="486" font-size="10" fill-opacity=".75">content/pages/ResponseTimes.html</text>
<text x="558" y="510" font-size="11">Response Time Percentiles</text>
<text x="558" y="530" font-size="11">Response Time Overview</text>
<text x="558" y="550" font-size="11">Time Vs Threads</text>
<text x="558" y="570" font-size="11">Response Time Distribution</text>
<text x="558" y="594" font-size="10" fill-opacity=".75">whole-run distributions, no time axis</text>

<rect x="546" y="616" width="256" height="66" rx="6" fill="#7f8c9a" fill-opacity=".14" stroke="#7f8c9a"/>
<text x="558" y="636" font-weight="bold">Customs Graphs &gt; Over Time</text>
<text x="558" y="650" font-size="10" fill-opacity=".75">content/pages/CustomsGraphs.html</text>
<text x="558" y="670" font-size="11">one chart per custom_* graph</text>
</svg>
