<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask production topology: client, nginx, Gunicorn workers, Flask, database and Celery</title>
  <defs>
    <marker id="fpt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where a request travels in production</text>

  <!-- client -->
  <rect x="20" y="150" width="100" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="70" y="181" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Client</text>
  <text x="70" y="199" font-size="11" fill="currentColor" text-anchor="middle">browser or API</text>

  <!-- reverse proxy -->
  <rect x="190" y="110" width="150" height="150" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="265" y="134" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Reverse proxy</text>
  <text x="265" y="151" font-size="11" fill="currentColor" text-anchor="middle">nginx or Apache httpd</text>
  <text x="265" y="176" font-size="11" fill="currentColor" text-anchor="middle">TLS termination</text>
  <text x="265" y="192" font-size="11" fill="currentColor" text-anchor="middle">buffers slow clients</text>
  <text x="265" y="208" font-size="11" fill="currentColor" text-anchor="middle">sets X-Forwarded-*</text>
  <text x="265" y="224" font-size="11" fill="currentColor" text-anchor="middle">size and time limits</text>
  <text x="265" y="246" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">location /static/</text>

  <!-- static files -->
  <rect x="190" y="320" width="150" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="265" y="342" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Built static files</text>
  <text x="265" y="359" font-size="11" fill="currentColor" text-anchor="middle">served without Python</text>
  <line x1="265" y1="260" x2="265" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#fpt-arrow)"/>

  <!-- gunicorn -->
  <rect x="420" y="80" width="150" height="210" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="495" y="102" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">WSGI server</text>
  <text x="495" y="118" font-size="11" fill="currentColor" text-anchor="middle">Gunicorn master</text>
  <rect x="436" y="132" width="118" height="42" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="495" y="150" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker 1</text>
  <text x="495" y="165" font-size="10" fill="currentColor" text-anchor="middle">Flask app + ProxyFix</text>
  <rect x="436" y="182" width="118" height="42" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="495" y="200" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker 2</text>
  <text x="495" y="215" font-size="10" fill="currentColor" text-anchor="middle">Flask app + ProxyFix</text>
  <rect x="436" y="232" width="118" height="42" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.2"/>
  <text x="495" y="250" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">worker N</text>
  <text x="495" y="265" font-size="10" fill="currentColor" text-anchor="middle">Flask app + ProxyFix</text>

  <!-- data tier -->
  <rect x="610" y="80" width="95" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="657" y="101" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">PostgreSQL</text>
  <text x="657" y="118" font-size="11" fill="currentColor" text-anchor="middle">pool per worker</text>
  <rect x="610" y="170" width="95" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="657" y="191" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Redis</text>
  <text x="657" y="208" font-size="11" fill="currentColor" text-anchor="middle">cache, broker</text>

  <!-- celery -->
  <rect x="420" y="320" width="150" height="50" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="495" y="342" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Celery workers</text>
  <text x="495" y="359" font-size="11" fill="currentColor" text-anchor="middle">separate processes</text>

  <!-- arrows -->
  <line x1="120" y1="185" x2="188" y2="185" stroke="currentColor" stroke-width="1.5" marker-end="url(#fpt-arrow)"/>
  <text x="154" y="176" font-size="10" fill="currentColor" text-anchor="middle">HTTPS 443</text>
  <line x1="340" y1="185" x2="418" y2="185" stroke="currentColor" stroke-width="1.5" marker-end="url(#fpt-arrow)"/>
  <text x="379" y="170" font-size="10" fill="currentColor" text-anchor="middle">HTTP over a</text>
  <text x="379" y="182" font-size="10" fill="currentColor" text-anchor="middle">Unix socket</text>
  <line x1="554" y1="153" x2="608" y2="110" stroke="currentColor" stroke-width="1.2" marker-end="url(#fpt-arrow)"/>
  <line x1="554" y1="203" x2="608" y2="196" stroke="currentColor" stroke-width="1.2" marker-end="url(#fpt-arrow)"/>
  <line x1="640" y1="222" x2="570" y2="322" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fpt-arrow)"/>
  <text x="640" y="272" font-size="10" fill="currentColor" text-anchor="middle">tasks</text>
  <line x1="570" y1="345" x2="700" y2="345" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="700" y1="345" x2="700" y2="132" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fpt-arrow)"/>
  <text x="640" y="362" font-size="10" fill="currentColor" text-anchor="middle">results to the database</text>

  <!-- supervision -->
  <rect x="20" y="395" width="680" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="360" y="415" font-size="11" fill="currentColor" text-anchor="middle">systemd or Supervisor starts, restarts and stops the proxy, Gunicorn and Celery; every process runs as an unprivileged user</text>
</svg>
