<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a wireframe kit: a few neutral components</text>
  <rect x="30" y="50" width="700" height="250" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <!-- components -->
  <rect x="50" y="76" width="140" height="28" rx="4" fill="#E5E7EB"/><text x="120" y="95" font-size="11" fill="#374151" text-anchor="middle">Top bar</text>
  <rect x="50" y="122" width="140" height="26" rx="4" fill="#FFFFFF" stroke="#6B7280"/><text x="120" y="139" font-size="11" fill="#6B7280" text-anchor="middle">Input</text>
  <rect x="50" y="166" width="64" height="26" rx="4" fill="#6B7280"/><text x="82" y="183" font-size="11" fill="#FFFFFF" text-anchor="middle">Button</text><rect x="126" y="166" width="64" height="26" rx="4" fill="#FFFFFF" stroke="#6B7280"/><text x="158" y="183" font-size="11" fill="#374151" text-anchor="middle">Ghost</text>
  <rect x="50" y="210" width="140" height="70" rx="6" fill="#FFFFFF" stroke="#6B7280"/><rect x="58" y="218" width="40" height="54" fill="#E5E7EB"/><rect x="106" y="220" width="70" height="8" rx="3" fill="#9CA3AF"/><rect x="106" y="236" width="50" height="6" rx="3" fill="#D1D5DB"/>
  <text x="120" y="298" font-size="0"> </text>
  <!-- variant matrix -->
  <text x="300" y="86" font-size="13" font-weight="bold" fill="#3730A3">Variants</text>
  <g font-size="11" fill="#374151"><text x="300" y="108">Size: S, M, L</text><text x="300" y="126">State: default, focus, disabled</text><text x="300" y="144">Content: text, image, empty</text></g>
  <text x="300" y="178" font-size="13" font-weight="bold" fill="#3730A3">Properties</text>
  <g font-size="11" fill="#374151"><text x="300" y="200">Label (text)</text><text x="300" y="218">Show icon (boolean)</text><text x="300" y="236">Cover (instance swap)</text></g>
  <!-- tokens -->
  <text x="530" y="86" font-size="13" font-weight="bold" fill="#3730A3">Neutral variables</text>
  <g font-size="11" fill="#374151"><text x="530" y="108">grey/100, grey/400, grey/700</text><text x="530" y="126">space/8, space/16</text><text x="530" y="144">radius/4</text></g>
  <rect x="530" y="166" width="170" height="44" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="615" y="186" font-size="11" fill="#92400E" text-anchor="middle">Swap values later:</text><text x="615" y="202" font-size="11" fill="#92400E" text-anchor="middle">grey becomes brand colour</text>
  <g fill="#4F46E5"><circle cx="50" cy="62" r="11"/><circle cx="300" cy="62" r="11"/><circle cx="530" cy="62" r="11"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="50" y="66">1</text><text x="300" y="66">2</text><text x="530" y="66">3</text></g>
  <text x="380" y="334" font-size="12" fill="#374151" text-anchor="middle">Grey and a single type size keep attention on layout and flow.</text>
  <text x="380" y="356" font-size="12" fill="#3730A3" text-anchor="middle">Your own kit, built from components, beats a pasted-in library you do not understand.</text>
</svg>
