<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Swarm routing mesh on a three-node swarm</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Swarm routing mesh on a three-node swarm</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">service "api" with 2 replicas publishes port 8080 on every node</text>
  <rect x="300" y="60" width="160" height="46" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="78.8" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">client / load balancer</text>
  <text x="380.0" y="93.8" font-size="9" fill="#333333" text-anchor="middle">any node :8080</text>
  <rect x="30" y="150" width="210" height="200" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="135.0" y="167.0" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">manager-1</text>
  <rect x="45" y="190" width="180" height="40" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="135.0" y="212.5" font-size="9" fill="#333333" text-anchor="middle">ingress :8080 (IPVS)</text>
  <rect x="45" y="250" width="180" height="40" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="135.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">task api.1</text>
  <line x1="380" y1="106" x2="135" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="275" y="150" width="210" height="200" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="167.0" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">worker-1</text>
  <rect x="290" y="190" width="180" height="40" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="212.5" font-size="9" fill="#333333" text-anchor="middle">ingress :8080 (IPVS)</text>
  <rect x="290" y="250" width="180" height="40" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">task api.2</text>
  <line x1="380" y1="106" x2="380" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="520" y="150" width="210" height="200" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="625.0" y="167.0" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">worker-2</text>
  <rect x="535" y="190" width="180" height="40" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="625.0" y="212.5" font-size="9" fill="#333333" text-anchor="middle">ingress :8080 (IPVS)</text>
  <rect x="535" y="250" width="180" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="625.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">(no api task)</text>
  <line x1="380" y1="106" x2="625" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="30" y="370" width="700" height="34" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="380.0" y="389.8" font-size="9.5" fill="#333333" text-anchor="middle">ingress overlay network: connections to any node are balanced across healthy tasks</text>
  <line x1="565" y1="230" x2="380" y2="265" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="470" y="335" font-size="9.5" fill="#555555" text-anchor="middle">forwarded over ingress</text>
</svg>
