<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Migration history with a fork and a merge</title>
  <defs>
    <marker id="fmb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Two heads, then one</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">each arrow goes from a parent revision to a revision that names it as its down_revision</text>

  <rect x="10" y="120" width="92" height="52" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="56" y="142" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0001</text>
  <text x="56" y="159" font-size="10" fill="currentColor" text-anchor="middle">create tables</text>
  <line x1="102" y1="146" x2="124" y2="146" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>

  <rect x="124" y="120" width="92" height="52" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="142" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0002</text>
  <text x="170" y="159" font-size="10" fill="currentColor" text-anchor="middle">add isbn</text>
  <line x1="216" y1="146" x2="238" y2="146" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>

  <rect x="238" y="120" width="92" height="52" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="284" y="142" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0003</text>
  <text x="284" y="159" font-size="10" fill="currentColor" text-anchor="middle">branch point</text>

  <line x1="330" y1="136" x2="372" y2="92" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>
  <line x1="330" y1="156" x2="372" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>

  <rect x="372" y="64" width="130" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="437" y="86" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0004a (head)</text>
  <text x="437" y="104" font-size="10" fill="currentColor" text-anchor="middle">add reviews table</text>

  <rect x="372" y="172" width="130" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="437" y="194" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0004b (head)</text>
  <text x="437" y="212" font-size="10" fill="currentColor" text-anchor="middle">add shelves table</text>

  <line x1="502" y1="96" x2="556" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>
  <line x1="502" y1="200" x2="556" y2="164" stroke="currentColor" stroke-width="1.5" marker-end="url(#fmb-arrow)"/>

  <rect x="556" y="118" width="150" height="60" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="2"/>
  <text x="631" y="141" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0005 (head)</text>
  <text x="631" y="158" font-size="10" fill="currentColor" text-anchor="middle">flask db merge:</text>
  <text x="631" y="172" font-size="10" fill="currentColor" text-anchor="middle">two parents</text>

  <text x="360" y="262" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">dashed boxes: the two heads that make flask db upgrade refuse to choose; solid: single history again</text>
</svg>
