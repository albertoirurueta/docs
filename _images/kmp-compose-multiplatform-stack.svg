<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img">
  <title>The Compose Multiplatform stack</title>
  <desc>From top to bottom: TrailMate sharedUI code in commonMain, the Compose compiler plugin and runtime, the foundation, ui, animation and material3 libraries, then two rendering paths. On Android the androidx.compose artifacts draw through the Android View system and platform Canvas. On iOS, desktop and web the org.jetbrains.compose artifacts draw through Skiko and Skia onto a UIView with Metal, a Swing or AWT window, or a browser canvas.</desc>
  <defs>
    <marker id="arrCs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Compose Multiplatform: one UI layer, two rendering paths</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">the same @Composable code runs on the Compose runtime everywhere; only the bottom layers differ</text>

  <!-- Layer 1: app code -->
  <rect x="40" y="58" width="680" height="62" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#1c4b73">Your code: sharedUI / commonMain</text>
  <text x="60" y="98" font-size="10.5" fill="#333333">App(), TrailListScreen, TrailDetailScreen, SettingsScreen, TrailMateTheme</text>
  <text x="60" y="112" font-size="10" fill="#666666">@Composable functions, state, modifiers, Material 3 components</text>

  <!-- Layer 2: compiler + runtime -->
  <rect x="40" y="136" width="680" height="62" rx="8" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.4"/>
  <text x="60" y="158" font-size="12" font-weight="bold" fill="#8a5a14">Compose compiler plugin and runtime</text>
  <rect x="380" y="146" width="150" height="42" rx="6" fill="#ffffff" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="455" y="164" font-size="10.5" font-weight="bold" fill="#8a5a14" text-anchor="middle">org.jetbrains.kotlin</text>
  <text x="455" y="178" font-size="10.5" fill="#333333" text-anchor="middle">.plugin.compose</text>
  <rect x="545" y="146" width="160" height="42" rx="6" fill="#ffffff" stroke="#8a5a14" stroke-width="1.2"/>
  <text x="625" y="164" font-size="10.5" font-weight="bold" fill="#8a5a14" text-anchor="middle">runtime</text>
  <text x="625" y="178" font-size="10" fill="#333333" text-anchor="middle">snapshot state, recomposition</text>
  <text x="60" y="180" font-size="10" fill="#666666">ships with Kotlin, same version</text>

  <!-- Layer 3: libraries -->
  <rect x="40" y="214" width="680" height="76" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="60" y="236" font-size="12" font-weight="bold" fill="#333333">UI libraries (multiplatform builds of Google's libraries)</text>
  <rect x="60" y="246" width="140" height="34" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="130" y="267" font-size="10.5" fill="#333333" text-anchor="middle">ui, ui-graphics</text>
  <rect x="215" y="246" width="140" height="34" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="285" y="267" font-size="10.5" fill="#333333" text-anchor="middle">foundation</text>
  <rect x="370" y="246" width="140" height="34" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="440" y="267" font-size="10.5" fill="#333333" text-anchor="middle">animation</text>
  <rect x="525" y="246" width="180" height="34" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="615" y="267" font-size="10.5" fill="#333333" text-anchor="middle">material3 (own version)</text>

  <!-- Split -->
  <line x1="150" y1="290" x2="150" y2="322" stroke="#444444" stroke-width="1.3" marker-end="url(#arrCs)"/>
  <line x1="470" y1="290" x2="470" y2="322" stroke="#444444" stroke-width="1.3" marker-end="url(#arrCs)"/>

  <!-- Android path -->
  <rect x="40" y="324" width="220" height="150" rx="8" fill="#eef7ee" stroke="#2c6b2f" stroke-width="1.4"/>
  <text x="150" y="346" font-size="12" font-weight="bold" fill="#2c6b2f" text-anchor="middle">Android path</text>
  <text x="150" y="362" font-size="10" fill="#666666" text-anchor="middle">Stable</text>
  <rect x="56" y="372" width="188" height="30" rx="6" fill="#ffffff" stroke="#2c6b2f" stroke-width="1.2"/>
  <text x="150" y="391" font-size="10.5" fill="#333333" text-anchor="middle">androidx.compose.* artifacts</text>
  <rect x="56" y="410" width="188" height="26" rx="6" fill="#ffffff" stroke="#2c6b2f" stroke-width="1.2"/>
  <text x="150" y="427" font-size="10.5" fill="#333333" text-anchor="middle">AndroidComposeView (a View)</text>
  <rect x="56" y="442" width="188" height="24" rx="6" fill="#ffffff" stroke="#2c6b2f" stroke-width="1.2"/>
  <text x="150" y="458" font-size="10.5" fill="#333333" text-anchor="middle">Android framework Canvas</text>

  <!-- Skia path -->
  <rect x="290" y="324" width="430" height="150" rx="8" fill="#f3eefa" stroke="#5b3a8a" stroke-width="1.4"/>
  <text x="505" y="346" font-size="12" font-weight="bold" fill="#5b3a8a" text-anchor="middle">Skiko path: iOS, desktop, web</text>
  <rect x="306" y="372" width="398" height="30" rx="6" fill="#ffffff" stroke="#5b3a8a" stroke-width="1.2"/>
  <text x="505" y="391" font-size="10.5" fill="#333333" text-anchor="middle">org.jetbrains.compose.* artifacts, drawing with Skiko (Kotlin bindings for Skia)</text>
  <rect x="306" y="410" width="124" height="56" rx="6" fill="#ffffff" stroke="#5b3a8a" stroke-width="1.2"/>
  <text x="368" y="428" font-size="10.5" font-weight="bold" fill="#5b3a8a" text-anchor="middle">iOS 14+</text>
  <text x="368" y="442" font-size="9.5" fill="#333333" text-anchor="middle">UIViewController,</text>
  <text x="368" y="455" font-size="9.5" fill="#333333" text-anchor="middle">Metal layer</text>
  <rect x="442" y="410" width="124" height="56" rx="6" fill="#ffffff" stroke="#5b3a8a" stroke-width="1.2"/>
  <text x="504" y="428" font-size="10.5" font-weight="bold" fill="#5b3a8a" text-anchor="middle">Desktop</text>
  <text x="504" y="442" font-size="9.5" fill="#333333" text-anchor="middle">JVM 17+, Swing/AWT</text>
  <text x="504" y="455" font-size="9.5" fill="#333333" text-anchor="middle">window, JBR</text>
  <rect x="578" y="410" width="126" height="56" rx="6" fill="#ffffff" stroke="#5b3a8a" stroke-width="1.2"/>
  <text x="641" y="428" font-size="10.5" font-weight="bold" fill="#5b3a8a" text-anchor="middle">Web (Beta)</text>
  <text x="641" y="442" font-size="9.5" fill="#333333" text-anchor="middle">Wasm, WasmGC</text>
  <text x="641" y="455" font-size="9.5" fill="#333333" text-anchor="middle">browser canvas</text>

  <!-- Footer -->
  <text x="380" y="498" font-size="10.5" fill="#444444" text-anchor="middle">Android reuses the platform's own UI toolkit; every other target brings its own renderer inside the app.</text>
  <text x="380" y="514" font-size="10" fill="#666666" text-anchor="middle">Entry points: setContent, ComposeUIViewController, application { Window }, ComposeViewport</text>
</svg>
