<svg viewBox="0 0 740 360" width="740" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Storyboard: animate the Bookshelf detail screen</title>
<rect width="740" height="360" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<text x="370.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: animate the Bookshelf detail screen</text>
<rect x="20" y="50" width="130" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="64" r="11" fill="#4F46E5"/><text x="34" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="85" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Connect</text>
<rect x="30" y="108" width="50" height="70" rx="5" fill="#EEF2FF" stroke="#4F46E5"/><rect x="40" y="118" width="30" height="6" fill="#C7D2FE"/><rect x="95" y="108" width="50" height="70" rx="5" fill="#FEF3C7" stroke="#B45309"/><path d="M80 143 L93 143" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="85" y="290" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Open Prototype tab,</text>
<text x="85" y="305" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">drag a connection</text>
<text x="85" y="320" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">from the book card to</text>
<text x="85" y="335" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">the detail frame</text>
<path d="M151 160 L161 160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="162" y="50" width="130" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="176" cy="64" r="11" fill="#4F46E5"/><text x="176" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Pick type</text>
<rect x="177" y="108" width="100" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/><text x="227" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730A3">Move in</text>
<rect x="177" y="142" width="100" height="26" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/><text x="227" y="159" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Direction: right</text>
<path d="M192 195 L262 195" stroke="#B45309" stroke-width="2" marker-end="url(#ah)"/><text x="227" y="290" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Action: Navigate to.</text>
<text x="227" y="305" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Animation: Move in,</text>
<text x="227" y="320" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">from the right</text>
<path d="M293 160 L303 160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="304" y="50" width="130" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="318" cy="64" r="11" fill="#4F46E5"/><text x="318" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="369" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Easing</text>
<path d="M324 190 L324 120 L414 120" fill="none" stroke="#E5E7EB"/><path d="M324 190 C354 120 374 120 414 120" fill="none" stroke="#4F46E5" stroke-width="2"/><text x="369" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">300 ms</text>
<text x="369" y="290" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Duration 300 ms,</text>
<text x="369" y="305" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">easing Ease out</text>
<path d="M435 160 L445 160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="446" y="50" width="130" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="460" cy="64" r="11" fill="#4F46E5"/><text x="460" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="511" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Spring</text>
<path d="M461 175 C481 90 496 175 511 115 S541 128 561 130" fill="none" stroke="#B45309" stroke-width="2"/><path d="M461 130 L561 130" stroke="#E5E7EB" stroke-dasharray="4 3"/><text x="511" y="215" text-anchor="middle" font-size="11" font-weight="normal" fill="#92400E">Bouncy vs Ease out</text>
<text x="511" y="290" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Compare with Bouncy</text>
<text x="511" y="305" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">spring; keep the</text>
<text x="511" y="320" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">calmer one</text>
<path d="M577 160 L587 160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="588" y="50" width="130" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="602" cy="64" r="11" fill="#4F46E5"/><text x="602" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="653" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Test</text>
<polygon points="638,110 638,170 688,140" fill="#047857"/><text x="653" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Move in plays</text>
<text x="653" y="290" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">Press Play</text>
<text x="653" y="305" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">(Option+Command+Return</text>
<text x="653" y="320" text-anchor="middle" font-size="11" font-weight="normal" fill="#374151">or Ctrl+Alt+Enter)</text>
</svg>
