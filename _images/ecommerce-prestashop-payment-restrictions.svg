<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">The four restrictions a payment module must pass before its options reach the payment step</title>
  <desc id="d">Modules registered on the paymentOptions hook pass four filters in turn: country (ps_module_country), currency (ps_module_currency), customer group (ps_module_group) and the id_reference of the selected carrier (ps_module_carrier). The survivors return their PaymentOption objects, which PaymentOptionsFinder numbers and renders as forms.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="10" y="40" width="140" height="130" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="80" y="66" text-anchor="middle" font-weight="bold">Modules on</text>
  <text x="80" y="84" text-anchor="middle" font-weight="bold">paymentOptions</text>
  <text x="80" y="110" text-anchor="middle">ps_wirepayment</text>
  <text x="80" y="128" text-anchor="middle">ps_checkpayment</text>
  <text x="80" y="146" text-anchor="middle">pcffpayment ...</text>

  <rect x="180" y="40" width="130" height="130" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="245" y="66" text-anchor="middle" font-weight="bold">1. Country</text>
  <text x="245" y="90" text-anchor="middle">ps_module_country</text>
  <text x="245" y="112" text-anchor="middle">country of the</text>
  <text x="245" y="130" text-anchor="middle">cart address</text>

  <rect x="330" y="40" width="130" height="130" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="66" text-anchor="middle" font-weight="bold">2. Currency</text>
  <text x="395" y="90" text-anchor="middle">ps_module_currency</text>
  <text x="395" y="112" text-anchor="middle">currency of</text>
  <text x="395" y="130" text-anchor="middle">the cart (or -1, -2)</text>

  <rect x="480" y="40" width="130" height="130" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="545" y="66" text-anchor="middle" font-weight="bold">3. Group</text>
  <text x="545" y="90" text-anchor="middle">ps_module_group</text>
  <text x="545" y="112" text-anchor="middle">groups of the</text>
  <text x="545" y="130" text-anchor="middle">customer</text>

  <rect x="630" y="40" width="130" height="130" rx="12" fill="#f1c40f" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="695" y="66" text-anchor="middle" font-weight="bold">4. Carrier</text>
  <text x="695" y="90" text-anchor="middle">ps_module_carrier</text>
  <text x="695" y="112" text-anchor="middle">id_reference of the</text>
  <text x="695" y="130" text-anchor="middle">selected carrier</text>

  <rect x="780" y="40" width="110" height="130" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="835" y="66" text-anchor="middle" font-weight="bold">Options</text>
  <text x="835" y="90" text-anchor="middle">PaymentOption[]</text>
  <text x="835" y="112" text-anchor="middle">numbered and</text>
  <text x="835" y="130" text-anchor="middle">rendered</text>

  <line x1="150" y1="105" x2="178" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="105" x2="328" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="105" x2="478" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="105" x2="628" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="105" x2="778" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="10" y="215" width="880" height="95" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="450" y="241" text-anchor="middle" font-weight="bold">PaymentModule::install() fills the four tables once, for what exists at that moment</text>
  <text x="450" y="263" text-anchor="middle">a country, group, currency or carrier created later has no row: the module disappears for it until it is ticked in Payment, Preferences</text>
  <text x="450" y="285" text-anchor="middle" font-size="11" opacity="0.8">Seen on PrestaShop 9.2.0: Spain, the Coffee Club group and a new carrier each hid every payment method until their rows were added</text>
</svg>
