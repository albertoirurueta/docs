  <text x="52" y="448" font-size="12" text-anchor="start" fill="#f2f5f8">Origin is a global attribute (taxonomy pa_origin) used for the variations; Grind and Size are product-level attributes.</text>
  <text x="52" y="468" font-size="12" text-anchor="start" fill="#f2f5f8">Roast level (pa_roast, medium) is a global attribute that describes the product without creating variations.</text>
  <text x="52" y="488" font-size="12" text-anchor="start" fill="#f2f5f8">Every variation: stock 20, weight 0.25 kg or 1 kg. Default selection: Ethiopia, whole bean, 250 g.</text>
