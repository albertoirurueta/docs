<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The 18 variations of Pocket Coffee single-origin beans</title>
  <desc id="d">Three panels, one per origin: Ethiopia Yirgacheffe, Colombia Huila and Brazil Cerrado. Each panel is a grid of three grinds (whole bean, espresso, filter) by two sizes (250 g and 1 kg). Colombia and Brazil cost 8.90 euro for 250 g and 29.90 euro for 1 kg; Ethiopia costs 1.00 euro more per 250 g, so 9.90 and 33.90. Every variation has an SKU of the form PC-origin-grind-size, 20 units in stock and its own weight.</desc>
  <rect x="0" y="0" width="960" height="524" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">3 origins x 3 grinds x 2 sizes = 18 variations</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">SKU pattern PC-&lt;ORIGIN&gt;-&lt;GRIND&gt;-&lt;SIZE&gt;; prices in EUR; Ethiopia carries a surcharge of 1.00 per 250 g</text>
