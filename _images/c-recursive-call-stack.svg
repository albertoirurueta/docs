<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Call stack for factorial(4): each call pushes its own frame holding its own copy of n; the base case factorial(1) returns 1 and the results 1, 2, 6 and 24 unwind back up the stack.</title>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One stack frame per recursive call</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">factorial(4): each frame keeps its own n; results unwind back up as each call returns.</text>

  <!-- stack container -->
  <rect x="150" y="64" width="300" height="304" fill="#fbfbfb" stroke="#bbbbbb" stroke-width="1.2" rx="5"/>
  <text x="300" y="82" font-size="10" font-style="italic" fill="#888888" text-anchor="middle">the call stack (grows downward)</text>

  <!-- frame: factorial(4) -->
  <rect x="168" y="92" width="264" height="46" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="4"/>
  <text x="188" y="112" font-size="12" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">factorial(n = 4)</text>
  <text x="188" y="129" font-size="9" fill="#666666">waiting for 4 * factorial(3)</text>

  <!-- frame: factorial(3) -->
  <rect x="168" y="146" width="264" height="46" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="4"/>
  <text x="188" y="166" font-size="12" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">factorial(n = 3)</text>
  <text x="188" y="183" font-size="9" fill="#666666">waiting for 3 * factorial(2)</text>

  <!-- frame: factorial(2) -->
  <rect x="168" y="200" width="264" height="46" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="4"/>
  <text x="188" y="220" font-size="12" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">factorial(n = 2)</text>
  <text x="188" y="237" font-size="9" fill="#666666">waiting for 2 * factorial(1)</text>

  <!-- frame: factorial(1) - base case -->
  <rect x="168" y="254" width="264" height="46" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.6" rx="4"/>
  <text x="188" y="274" font-size="12" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">factorial(n = 1)</text>
  <text x="188" y="291" font-size="9" fill="#2f5424">base case: returns 1 without recursing</text>

  <text x="300" y="326" font-size="10" fill="#888888" text-anchor="middle">unused stack space</text>
  <line x1="168" y1="336" x2="432" y2="336" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="356" font-size="9" fill="#a04a4a" text-anchor="middle">deep enough recursion runs into here: stack exhaustion (undefined behavior)</text>

  <!-- descending call arrows -->
  <line x1="140" y1="104" x2="140" y2="270" stroke="#4a6a8a" stroke-width="1.5"/>
  <polygon points="134,270 146,270 140,280" fill="#4a6a8a"/>
  <text x="126" y="190" font-size="10" fill="#4a6a8a" text-anchor="middle" transform="rotate(-90 126 190)">calls descend</text>

  <!-- returning values on the right -->
  <line x1="460" y1="272" x2="460" y2="108" stroke="#5a8a4a" stroke-width="1.5"/>
  <polygon points="454,108 466,108 460,98" fill="#5a8a4a"/>
  <text x="476" y="190" font-size="10" fill="#5a8a4a" text-anchor="middle" transform="rotate(-90 476 190)">results unwind</text>

  <text x="560" y="118" font-size="11" fill="#222222" font-family="'Courier New', monospace">returns 24</text>
  <text x="560" y="172" font-size="11" fill="#222222" font-family="'Courier New', monospace">returns 6</text>
  <text x="560" y="226" font-size="11" fill="#222222" font-family="'Courier New', monospace">returns 2</text>
  <text x="560" y="280" font-size="11" fill="#222222" font-family="'Courier New', monospace">returns 1</text>

  <line x1="440" y1="115" x2="548" y2="115" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="169" x2="548" y2="169" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="223" x2="548" y2="223" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="277" x2="548" y2="277" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="500" y="300" width="234" height="68" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="4"/>
  <text x="617" y="320" font-size="10" font-weight="bold" fill="#5c4a14" text-anchor="middle">Cost of recursion</text>
  <text x="617" y="337" font-size="9" fill="#444444" text-anchor="middle">One frame per call: n's copy, the return</text>
  <text x="617" y="351" font-size="9" fill="#444444" text-anchor="middle">address and saved registers. Depth is</text>
  <text x="617" y="365" font-size="9" fill="#444444" text-anchor="middle">bounded by the stack, and C guarantees none.</text>
</svg>
