<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf in production</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">one release on every node; web, workers, scheduler and Reverb share Redis and the database</text>

  <!-- clients -->
  <rect x="20" y="70" width="130" height="50" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="85" y="92" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browsers</text>
  <text x="85" y="109" font-size="10" fill="#444444" text-anchor="middle">HTTPS and wss://</text>

  <!-- load balancer -->
  <rect x="200" y="70" width="180" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="290" y="92" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Load balancer</text>
  <text x="290" y="109" font-size="10" fill="#444444" text-anchor="middle">TLS, /up health check</text>
  <line x1="150" y1="95" x2="198" y2="95" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- web nodes -->
  <rect x="20" y="160" width="400" height="190" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="220" y="180" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Web nodes (2 or more), trustProxies set</text>
  <rect x="40" y="195" width="170" height="135" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="125" y="215" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Nginx + PHP-FPM</text>
  <text x="125" y="235" font-size="10" fill="#444444" text-anchor="middle">root current/public</text>
  <text x="125" y="250" font-size="10" fill="#444444" text-anchor="middle">$realpath_root</text>
  <text x="125" y="265" font-size="10" fill="#444444" text-anchor="middle">OPcache, no timestamp checks</text>
  <text x="125" y="280" font-size="10" fill="#444444" text-anchor="middle">php artisan optimize</text>
  <text x="125" y="295" font-size="10" fill="#444444" text-anchor="middle">APP_DEBUG=false</text>
  <text x="125" y="315" font-size="10" fill="#666666" text-anchor="middle">reload FPM on deploy</text>
  <rect x="230" y="195" width="170" height="135" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="315" y="215" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">or FrankenPHP</text>
  <text x="315" y="235" font-size="10" fill="#444444" text-anchor="middle">Caddy with PHP embedded</text>
  <text x="315" y="250" font-size="10" fill="#444444" text-anchor="middle">automatic HTTPS</text>
  <text x="315" y="265" font-size="10" fill="#444444" text-anchor="middle">worker mode via Octane</text>
  <text x="315" y="280" font-size="10" fill="#444444" text-anchor="middle">one process, no FastCGI</text>
  <text x="315" y="315" font-size="10" fill="#666666" text-anchor="middle">octane:reload on deploy</text>
  <line x1="290" y1="120" x2="220" y2="158" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- reverb -->
  <rect x="460" y="160" width="190" height="80" fill="#fff6e8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="555" y="182" font-size="13" font-weight="bold" fill="#b36b00" text-anchor="middle">Reverb</text>
  <text x="555" y="200" font-size="10" fill="#444444" text-anchor="middle">reverb:start under systemd</text>
  <text x="555" y="215" font-size="10" fill="#444444" text-anchor="middle">wss:// proxied by Nginx</text>
  <text x="555" y="230" font-size="10" fill="#444444" text-anchor="middle">REVERB_SCALING_ENABLED</text>
  <line x1="380" y1="100" x2="535" y2="158" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- workers -->
  <rect x="460" y="260" width="190" height="90" fill="#fff6e8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="555" y="282" font-size="13" font-weight="bold" fill="#b36b00" text-anchor="middle">Queue workers</text>
  <text x="555" y="300" font-size="10" fill="#444444" text-anchor="middle">Horizon or queue:work</text>
  <text x="555" y="315" font-size="10" fill="#444444" text-anchor="middle">Supervisor or systemd</text>
  <text x="555" y="330" font-size="10" fill="#666666" text-anchor="middle">horizon:terminate on deploy</text>

  <!-- scheduler -->
  <rect x="680" y="160" width="200" height="80" fill="#fff6e8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="780" y="182" font-size="13" font-weight="bold" fill="#b36b00" text-anchor="middle">Scheduler</text>
  <text x="780" y="200" font-size="10" fill="#444444" text-anchor="middle">cron: schedule:run every minute</text>
  <text x="780" y="215" font-size="10" fill="#444444" text-anchor="middle">onOneServer() tasks</text>
  <text x="780" y="230" font-size="10" fill="#666666" text-anchor="middle">schedule:interrupt on deploy</text>

  <!-- storage -->
  <rect x="680" y="260" width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="780" y="282" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Object storage (S3)</text>
  <text x="780" y="300" font-size="10" fill="#444444" text-anchor="middle">covers, exports</text>
  <text x="780" y="315" font-size="10" fill="#444444" text-anchor="middle">temporary URLs</text>
  <text x="780" y="330" font-size="10" fill="#666666" text-anchor="middle">never the web node's disk</text>

  <!-- shared data -->
  <rect x="140" y="400" width="260" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="270" y="425" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Redis</text>
  <text x="270" y="445" font-size="10" fill="#444444" text-anchor="middle">cache, sessions, locks, rate limits</text>
  <text x="270" y="460" font-size="10" fill="#444444" text-anchor="middle">queues, Reverb pub/sub</text>
  <text x="270" y="475" font-size="10" fill="#666666" text-anchor="middle">shared by every node</text>
  <rect x="500" y="400" width="260" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="630" y="425" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">PostgreSQL or MySQL</text>
  <text x="630" y="445" font-size="10" fill="#444444" text-anchor="middle">migrate --force once per deploy</text>
  <text x="630" y="460" font-size="10" fill="#444444" text-anchor="middle">backward-compatible schema changes</text>
  <text x="630" y="475" font-size="10" fill="#666666" text-anchor="middle">backups, failover</text>

  <line x1="220" y1="350" x2="260" y2="398" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="300" y1="350" x2="560" y2="398" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="555" y1="350" x2="330" y2="398" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="555" y1="350" x2="610" y2="398" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="225" x2="365" y2="398" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="682" y1="238" x2="642" y2="398" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="650" y1="305" x2="678" y2="305" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <text x="450" y="525" font-size="11" fill="#444444" text-anchor="middle">Deploy: build release, migrate, optimize, switch the current symlink atomically, then reload FPM or Octane and restart workers, the scheduler and Reverb</text>
  <text x="450" y="543" font-size="10" fill="#666666" text-anchor="middle">solid arrows: requests and data; dashed: shared stores used by background processes</text>
</svg>
