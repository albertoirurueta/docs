<text x="630" y="226" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">normal (needs EXT_color_buffer_float)</text>
<line x1="460" y1="270" x2="520" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-mrt)"/>
