<line x1="255" y1="270" x2="300" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-mrt)"/>
<text x="380" y="335" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Every draw buffer must have a matching attachment; integer outputs need an integer format and clearBufferuiv.</text>
