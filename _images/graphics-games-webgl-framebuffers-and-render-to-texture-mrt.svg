<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-framebuffers-and-render-to-texture-mrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Multiple render targets for the Bookshelf G-buffer</text>
<rect x="20" y="60" width="235" height="230" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="137.5" y="150.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Fragment shader</text>
<text x="137.5" y="164.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle"></text>
<text x="137.5" y="178.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">layout(location=0) out vec4 oAlbedo;</text>
<text x="137.5" y="192.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">layout(location=1) out vec4 oNormal;</text>
<text x="137.5" y="206.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">layout(location=2) out uint oBookId;</text>
<rect x="300" y="60" width="160" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="134.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">drawBuffers</text>
<text x="380.0" y="149.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">([COLOR_ATTACHMENT0,</text>
<text x="380.0" y="164.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">COLOR_ATTACHMENT1,</text>
<text x="380.0" y="179.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">COLOR_ATTACHMENT2])</text>
<text x="380.0" y="194.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle"></text>
<text x="380.0" y="209.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">maps output n to</text>
<text x="380.0" y="224.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">attachment point</text>
