<text x="630" y="146" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">albedo (sRGB data)</text>
<line x1="460" y1="190" x2="520" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-mrt)"/>
<rect x="520" y="170" width="220" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
