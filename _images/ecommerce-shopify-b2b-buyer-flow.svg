<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="t">From B2B login to B2B order</title>
  <desc id="d">Six steps: the buyer logs in with a customer account, the storefront reads the buyer's company locations from the Customer Account API, the buyer selects a location, storefront queries are contextualized with the buyer, the cart is created with the company location in its buyer identity, and checkout applies the location's payment terms and deposit and produces an order or a draft order for review.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="700">A B2B buyer's path through a headless storefront</text>

  <g fill="#5b8def" fill-opacity="0.16" stroke="#5b8def" stroke-width="1.8">
    <rect x="20" y="60" width="210" height="96" rx="8"/>
    <rect x="275" y="60" width="210" height="96" rx="8"/>
    <rect x="530" y="60" width="210" height="96" rx="8"/>
  </g>
  <g fill="#3aa57a" fill-opacity="0.16" stroke="#3aa57a" stroke-width="1.8">
    <rect x="20" y="200" width="210" height="96" rx="8"/>
    <rect x="275" y="200" width="210" height="96" rx="8"/>
  </g>
  <rect x="530" y="200" width="210" height="96" rx="8" fill="#e0902f" fill-opacity="0.16" stroke="#e0902f" stroke-width="1.8"/>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="125" y="84">1. Log in</text>
    <text x="380" y="84">2. List locations</text>
    <text x="635" y="84">3. Select a location</text>
    <text x="125" y="224">4. Contextualize queries</text>
    <text x="380" y="224">5. Create the cart</text>
    <text x="635" y="224">6. Check out</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill-opacity="0.9">
    <text x="125" y="106">Customer accounts only;</text>
    <text x="125" y="124">access token for the contact</text>
    <text x="380" y="106">Customer Account API:</text>
    <text x="380" y="124">customer.companyContacts</text>
    <text x="380" y="142">and their locations</text>
    <text x="635" y="106">Location picker; keep the</text>
    <text x="635" y="124">companyLocationId; do not</text>
    <text x="635" y="142">cache buyer-specific data</text>
    <text x="125" y="246">@inContext(buyer: ...) gives</text>
    <text x="125" y="264">B2B prices, quantity rules</text>
    <text x="125" y="282">and price breaks</text>
    <text x="380" y="246">cartCreate with buyerIdentity:</text>
    <text x="380" y="264">customerAccessToken and</text>
    <text x="380" y="282">companyLocationId</text>
    <text x="635" y="246">Payment terms and deposit of</text>
    <text x="635" y="264">the location; order, or draft</text>
    <text x="635" y="282">order for merchant review</text>
  </g>

  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M230,108 L275,108"/>
    <path d="M485,108 L530,108"/>
    <path d="M635,156 L635,178 L125,178 L125,200"/>
    <path d="M230,248 L275,248"/>
    <path d="M485,248 L530,248"/>
  </g>
</svg>
