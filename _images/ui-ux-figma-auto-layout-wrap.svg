<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Wrap in a horizontal flow</text>
  <g stroke="#4F46E5" stroke-width="2" fill="#EEF2FF">
    <rect x="30" y="56" width="330" height="130" rx="10"/><rect x="400" y="56" width="330" height="190" rx="10"/>
  </g>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="44" y="72" width="60" height="96" rx="4"/><rect x="114" y="72" width="60" height="96" rx="4"/><rect x="184" y="72" width="60" height="96" rx="4"/><rect x="254" y="72" width="60" height="96" rx="4"/><rect x="324" y="72" width="60" height="96" rx="4" stroke="#B91C1C" fill="#FEE2E2"/>
    <rect x="414" y="72" width="60" height="80" rx="4"/><rect x="484" y="72" width="60" height="80" rx="4"/><rect x="554" y="72" width="60" height="80" rx="4"/><rect x="624" y="72" width="60" height="80" rx="4"/>
    <rect x="414" y="162" width="60" height="70" rx="4"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle"><text x="195" y="216">Wrap off: the fifth card overflows</text><text x="565" y="276">Wrap on: it moves to a new row</text></g>
  <g font-size="12" fill="#374151"><text x="30" y="250">The row keeps one frame width.</text><text x="30" y="268">Wrap is for horizontal and vertical</text><text x="30" y="286">flows, not for grid flow.</text><text x="400" y="296">A vertical flow wraps into a new column instead.</text></g>
</svg>
