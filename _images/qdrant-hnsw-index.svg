<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ah-q" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Qdrant's HNSW index: one graph per collection (or named vector)</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">m bounds edges per node at build time; ef_construct sizes the candidate list while wiring each point in</text>

  <!-- layer bands -->
  <rect x="150" y="66" width="580" height="56" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <rect x="150" y="158" width="580" height="66" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <rect x="150" y="260" width="580" height="66" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <rect x="150" y="362" width="580" height="46" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>

  <text x="42" y="97" font-size="12" fill="#666666">Layer 3</text>
  <text x="42" y="113" font-size="10" fill="#999999">sparse</text>
  <text x="42" y="194" font-size="12" fill="#666666">Layer 2</text>
  <text x="42" y="296" font-size="12" fill="#666666">Layer 1</text>
  <text x="42" y="389" font-size="12" fill="#666666">Layer 0</text>
  <text x="42" y="403" font-size="10" fill="#999999">every point</text>

  <!-- graph edges: Layer 3 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="260" y1="96" x2="470" y2="96"/>
    <line x1="470" y1="96" x2="640" y2="96"/>
  </g>
  <!-- graph edges: Layer 2 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="200" y1="192" x2="310" y2="192"/>
    <line x1="310" y1="192" x2="415" y2="192"/>
    <line x1="415" y1="192" x2="500" y2="192"/>
    <line x1="500" y1="192" x2="600" y2="192"/>
    <line x1="600" y1="192" x2="690" y2="192"/>
    <line x1="310" y1="192" x2="500" y2="192"/>
  </g>
  <!-- graph edges: Layer 1 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="180" y1="294" x2="245" y2="294"/>
    <line x1="245" y1="294" x2="315" y2="294"/>
    <line x1="315" y1="294" x2="385" y2="294"/>
    <line x1="385" y1="294" x2="450" y2="294"/>
    <line x1="450" y1="294" x2="520" y2="294"/>
    <line x1="520" y1="294" x2="590" y2="294"/>
    <line x1="590" y1="294" x2="660" y2="294"/>
    <line x1="245" y1="294" x2="385" y2="294"/>
    <line x1="450" y1="294" x2="590" y2="294"/>
  </g>
  <!-- graph edges: Layer 0 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="170" y1="387" x2="220" y2="387"/>
    <line x1="220" y1="387" x2="270" y2="387"/>
    <line x1="270" y1="387" x2="320" y2="387"/>
    <line x1="320" y1="387" x2="370" y2="387"/>
    <line x1="370" y1="387" x2="420" y2="387"/>
    <line x1="420" y1="387" x2="470" y2="387"/>
    <line x1="470" y1="387" x2="520" y2="387"/>
    <line x1="520" y1="387" x2="570" y2="387"/>
    <line x1="570" y1="387" x2="620" y2="387"/>
    <line x1="620" y1="387" x2="670" y2="387"/>
    <line x1="670" y1="387" x2="710" y2="387"/>
    <line x1="220" y1="387" x2="320" y2="387"/>
    <line x1="420" y1="387" x2="520" y2="387"/>
    <line x1="570" y1="387" x2="670" y2="387"/>
  </g>

  <!-- inter-layer alignment (same point present on several layers) -->
  <g stroke="#dddddd" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="96" x2="200" y2="192"/>
    <line x1="470" y1="96" x2="415" y2="192"/>
    <line x1="640" y1="96" x2="600" y2="192"/>
    <line x1="415" y1="192" x2="385" y2="294"/>
    <line x1="600" y1="192" x2="590" y2="294"/>
    <line x1="385" y1="294" x2="420" y2="387"/>
    <line x1="590" y1="294" x2="620" y2="387"/>
  </g>

  <!-- ordinary nodes -->
  <g fill="#f4f4f4" stroke="#999999" stroke-width="1.2">
    <circle cx="640" cy="96" r="10"/>
    <circle cx="200" cy="192" r="10"/>
    <circle cx="310" cy="192" r="10"/>
    <circle cx="500" cy="192" r="10"/>
    <circle cx="690" cy="192" r="10"/>
    <circle cx="180" cy="294" r="10"/>
    <circle cx="245" cy="294" r="10"/>
    <circle cx="450" cy="294" r="10"/>
    <circle cx="520" cy="294" r="10"/>
    <circle cx="660" cy="294" r="10"/>
    <circle cx="170" cy="387" r="10"/>
    <circle cx="270" cy="387" r="10"/>
    <circle cx="320" cy="387" r="10"/>
    <circle cx="470" cy="387" r="10"/>
    <circle cx="520" cy="387" r="10"/>
    <circle cx="570" cy="387" r="10"/>
    <circle cx="710" cy="387" r="10"/>
  </g>

  <!-- greedy search path -->
  <g stroke="#1c4b73" stroke-width="2.4" marker-end="url(#ah-q)">
    <line x1="272" y1="96" x2="458" y2="96"/>
    <line x1="470" y1="108" x2="430" y2="183"/>
    <line x1="427" y1="192" x2="488" y2="192"/>
    <line x1="500" y1="204" x2="450" y2="284"/>
    <line x1="462" y1="294" x2="576" y2="294"/>
    <line x1="590" y1="306" x2="620" y2="376"/>
    <line x1="632" y1="387" x2="698" y2="387"/>
  </g>

  <!-- path nodes drawn on top -->
  <g fill="#ffffff" stroke="#1c4b73" stroke-width="2">
    <circle cx="260" cy="96" r="10"/>
    <circle cx="470" cy="96" r="10"/>
    <circle cx="415" cy="192" r="10"/>
    <circle cx="500" cy="192" r="10"/>
    <circle cx="450" cy="294" r="10"/>
    <circle cx="590" cy="294" r="10"/>
    <circle cx="620" cy="387" r="10"/>
  </g>

  <text x="260" y="78" font-size="10.5" fill="#1c4b73" text-anchor="middle">entry point</text>

  <!-- result node -->
  <circle cx="710" cy="387" r="10" fill="#ffffff" stroke="#2f5424" stroke-width="2"/>
  <circle cx="710" cy="387" r="15" fill="none" stroke="#2f5424" stroke-width="1.4"/>

  <!-- query vector -->
  <path d="M710,357 L721,368 L710,379 L699,368 Z" fill="#2f5424"/>
  <line x1="710" y1="374" x2="710" y2="370" stroke="#2f5424" stroke-width="1"/>
  <line x1="710" y1="372" x2="710" y2="377" stroke="#2f5424" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text x="710" y="346" font-size="10.5" fill="#2f5424" text-anchor="middle">query point q</text>

  <!-- legend -->
  <g>
    <line x1="150" y1="432" x2="182" y2="432" stroke="#1c4b73" stroke-width="2.4"/>
    <text x="188" y="436" font-size="10.5" fill="#666666">greedy search path (candidate list size ef)</text>
    <circle cx="452" cy="432" r="7" fill="none" stroke="#2f5424" stroke-width="1.4"/>
    <text x="465" y="436" font-size="10.5" fill="#666666">nearest neighbor returned</text>
    <line x1="640" y1="432" x2="672" y2="432" stroke="#cccccc" stroke-width="1.2"/>
    <text x="678" y="436" font-size="10.5" fill="#666666">graph edge</text>
  </g>

  <text x="380" y="456" font-size="11" fill="#444444" text-anchor="middle">Search enters at the top layer, walks to the closest visible point, drops one layer from there, and repeats.</text>
  <text x="380" y="472" font-size="11" fill="#444444" text-anchor="middle">m bounds edges kept per node; ef_construct sizes the build-time candidate list; ef sizes it again at query time.</text>
</svg>
