<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Generate the Bookshelf prototype, five steps</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="16" y="50" width="136" height="190" rx="10"/><rect x="164" y="50" width="136" height="190" rx="10"/><rect x="312" y="50" width="136" height="190" rx="10"/><rect x="460" y="50" width="136" height="190" rx="10"/><rect x="608" y="50" width="136" height="190" rx="10"/>
  </g>
  <!-- panel 1: chat with attachment and prompt -->
  <rect x="28" y="88" width="112" height="44" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="36" y="96" width="40" height="28" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
  <rect x="84" y="100" width="48" height="6" rx="3" fill="#E5E7EB"/><rect x="84" y="112" width="36" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="28" y="144" width="112" height="56" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="36" y="154" width="96" height="6" rx="3" fill="#E5E7EB"/><rect x="36" y="166" width="80" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="96" y="182" width="36" height="12" rx="6" fill="#4F46E5"/>
