  <rect x="628" y="96" width="96" height="16" rx="8" fill="#D1FAE5" stroke="#047857"/>
  <rect x="636" y="101" width="60" height="6" rx="3" fill="#047857"/>
  <rect x="628" y="124" width="96" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="628" y="162" width="96" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <g fill="#4F46E5"><circle cx="30" cy="64" r="11"/><circle cx="178" cy="64" r="11"/><circle cx="326" cy="64" r="11"/><circle cx="474" cy="64" r="11"/><circle cx="622" cy="64" r="11"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="68">1</text><text x="178" y="68">2</text><text x="326" y="68">3</text><text x="474" y="68">4</text><text x="622" y="68">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="84" y="262">Attach frame,</text><text x="84" y="278">send prompt</text>
    <text x="232" y="262">Review plan,</text><text x="232" y="278">click Build</text>
    <text x="380" y="262">Check the</text><text x="380" y="278">Browser preview</text>
    <text x="528" y="262">Edit, annotate,</text><text x="528" y="278">click Apply</text>
    <text x="676" y="262">Publish or</text><text x="676" y="278">embed</text>
  </g>
  <g stroke="#4B5563" stroke-width="2"><line x1="154" y1="145" x2="162" y2="145" marker-end="url(#ah)"/><line x1="302" y1="145" x2="310" y2="145" marker-end="url(#ah)"/><line x1="450" y1="145" x2="458" y2="145" marker-end="url(#ah)"/><line x1="598" y1="145" x2="606" y2="145" marker-end="url(#ah)"/></g>
  <rect x="16" y="292" width="728" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="311" font-size="12" fill="#3730A3" text-anchor="middle">Generated code is a prototype: review it before anything reaches the real Bookshelf codebase.</text>
