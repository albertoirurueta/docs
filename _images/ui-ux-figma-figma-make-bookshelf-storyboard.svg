  <rect x="176" y="88" width="112" height="112" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="186" y="98" width="60" height="7" rx="3" fill="#B45309"/>
  <rect x="186" y="114" width="92" height="6" rx="3" fill="#FFFFFF"/><rect x="186" y="128" width="84" height="6" rx="3" fill="#FFFFFF"/><rect x="186" y="142" width="90" height="6" rx="3" fill="#FFFFFF"/><rect x="186" y="156" width="70" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="236" y="176" width="42" height="16" rx="8" fill="#B45309"/>
  <!-- panel 3: generated preview -->
  <rect x="324" y="88" width="112" height="112" rx="6" fill="#FFFFFF" stroke="#4B5563"/>
  <rect x="324" y="88" width="112" height="14" rx="6" fill="#E5E7EB"/>
  <rect x="332" y="110" width="44" height="40" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="384" y="110" width="44" height="40" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
