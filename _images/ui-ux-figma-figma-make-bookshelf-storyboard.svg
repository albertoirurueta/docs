  <rect x="472" y="88" width="112" height="112" rx="6" fill="#FFFFFF" stroke="#4B5563"/>
  <rect x="480" y="98" width="52" height="40" rx="4" fill="#EEF2FF" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="480" y="146" width="96" height="46" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="488" y="156" width="70" height="6" rx="3" fill="#B45309"/><rect x="488" y="170" width="50" height="6" rx="3" fill="#B45309"/>
  <rect x="540" y="104" width="36" height="14" rx="7" fill="#4F46E5"/>
