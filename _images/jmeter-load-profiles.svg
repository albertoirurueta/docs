<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Load profiles of the custom thread groups and the Throughput Shaping Timer</title>
<desc id="d">Three charts. Top: a Concurrency Thread Group with a target concurrency of 200, a 20 minute ramp-up in 10 steps and a 5 minute hold; the concurrency climbs by 20 threads every 2 minutes, reaches 200 at minute 18 and holds until minute 25. Middle: an Ultimate Thread Group with a baseline row of 50 threads held for 19 minutes and two spike rows of 150 extra threads that start at 300 and 780 seconds, ramp up in 10 seconds, hold 60 seconds and shut down in 10 seconds, so the active threads jump from 50 to 200 twice. Bottom: a Throughput Shaping Timer schedule in requests per second: a line from 1 to 20 over 2 minutes, 20 held for 10 minutes, steps of 25, 30, 35 and 40 of 2 minutes each, and a line down from 40 to 5 in the last minute.</desc>
