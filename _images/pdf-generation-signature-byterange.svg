<svg viewBox="0 0 900 640" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="700" >/ByteRange and /Contents: what a PDF signature covers</text>
  <text x="450" y="46" text-anchor="middle" font-size="12" fill="#555" >Example numbers from a two-signature invoice of 37154 bytes (bar widths are proportional)</text>
  <text x="40" y="90" text-anchor="start" font-size="13" fill="#1f5fa6" font-weight="700" >Signature 1: certification signature on revision 1 (DocMDP P=2)</text>
  <rect x="40.0" y="100" width="27.3" height="40" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <rect x="67.3" y="100" width="361.6" height="40" rx="2" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <rect x="428.9" y="100" width="35.4" height="40" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <rect x="464.3" y="100" width="395.7" height="40" rx="2" fill="#eeeeee" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="42.0" y="158" text-anchor="start" font-size="11" fill="#1f5fa6" >range 1</text>
  <text x="248.1" y="127" text-anchor="middle" font-size="12" fill="#7a4800" >gap: /Contents &lt;CMS container as hex, zero padded&gt;</text>
  <text x="442.9" y="158" text-anchor="start" font-size="11" fill="#1f5fa6" >range 2</text>
  <text x="662.15" y="125" text-anchor="middle" font-size="11" fill="#666" >incremental update appended later</text>
  <text x="662.15" y="139" text-anchor="middle" font-size="11" fill="#666" >(not covered by signature 1)</text>
  <text x="40" y="176" text-anchor="start" font-size="12" fill="#1a1a1a" font-family="Courier New, monospace">/ByteRange [0 1235 17621 1606]   covers revision 1 only: ends at byte 19227, the file has 37154</text>
  <text x="40" y="240" text-anchor="start" font-size="13" fill="#1f5fa6" font-weight="700" >Signature 2: approval signature on revision 2</text>
  <rect x="40.0" y="250" width="427.1" height="40" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <rect x="467.1" y="250" width="361.6" height="40" rx="2" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <rect x="828.8" y="250" width="31.2" height="40" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="230.0" y="308" text-anchor="start" font-size="11" fill="#1f5fa6" >range 1: includes revision 1 with signature 1 and its /Contents</text>
  <text x="647.1" y="275" text-anchor="middle" font-size="12" fill="#7a4800" >gap: /Contents of signature 2</text>
  <text x="808.8" y="308" text-anchor="start" font-size="11" fill="#1f5fa6" >range 2</text>
  <text x="40" y="326" text-anchor="start" font-size="12" fill="#1a1a1a" font-family="Courier New, monospace">/ByteRange [0 19354 35740 1414]  covers everything except its own gap, to the end of the file</text>
  <line x1="40" y1="355" x2="860" y2="355" stroke="#999" stroke-width="1.4"/>
  <line x1="40.0" y1="350" x2="40.0" y2="360" stroke="#999" stroke-width="1.4"/>
  <line x1="67.3" y1="350" x2="67.3" y2="360" stroke="#999" stroke-width="1.4"/>
  <line x1="428.9" y1="350" x2="428.9" y2="360" stroke="#999" stroke-width="1.4"/>
  <line x1="467.1" y1="350" x2="467.1" y2="360" stroke="#999" stroke-width="1.4"/>
  <line x1="828.8" y1="350" x2="828.8" y2="360" stroke="#999" stroke-width="1.4"/>
  <line x1="860.0" y1="350" x2="860.0" y2="360" stroke="#999" stroke-width="1.4"/>
  <text x="40.0" y="376" text-anchor="middle" font-size="11" fill="#555" >0</text>
  <text x="428.9" y="376" text-anchor="middle" font-size="11" fill="#555" >17621</text>
  <text x="828.8" y="376" text-anchor="middle" font-size="11" fill="#555" >35740</text>
  <text x="860.0" y="376" text-anchor="middle" font-size="11" fill="#555" >37154</text>
  <text x="67.3" y="392" text-anchor="middle" font-size="11" fill="#555" >1235</text>
  <text x="467.1" y="392" text-anchor="middle" font-size="11" fill="#555" >19354</text>
  <text x="450" y="412" text-anchor="middle" font-size="11" fill="#555" >byte offsets in the file</text>
  <text x="450" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="700" >How the gap is filled: hash first, sign the hash, write the result into the reserved gap</text>
  <rect x="30" y="454" width="195" height="100" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="127" y="476" text-anchor="middle" font-size="13" fill="#1f5fa6" font-weight="700" >1. Reserve</text>
  <text x="127" y="496" text-anchor="middle" font-size="11.5" fill="#333" >write a zero-filled</text>
  <text x="127" y="512" text-anchor="middle" font-size="11.5" fill="#333" >/Contents of fixed size and</text>
  <text x="127" y="528" text-anchor="middle" font-size="11.5" fill="#333" >a /ByteRange placeholder</text>
  <rect x="245" y="454" width="195" height="100" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.4"/>
  <text x="342" y="476" text-anchor="middle" font-size="13" fill="#2b7a2b" font-weight="700" >2. Hash</text>
  <text x="342" y="496" text-anchor="middle" font-size="11.5" fill="#333" >SHA-256 over range 1</text>
  <text x="342" y="512" text-anchor="middle" font-size="11.5" fill="#333" >followed by range 2 (the</text>
  <text x="342" y="528" text-anchor="middle" font-size="11.5" fill="#333" >gap is skipped)</text>
  <rect x="460" y="454" width="195" height="100" rx="6" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="557" y="476" text-anchor="middle" font-size="13" fill="#7a4800" font-weight="700" >3. Sign</text>
  <text x="557" y="496" text-anchor="middle" font-size="11.5" fill="#333" >CMS signed attributes hold</text>
  <text x="557" y="512" text-anchor="middle" font-size="11.5" fill="#333" >the digest, the private key</text>
  <text x="557" y="528" text-anchor="middle" font-size="11.5" fill="#333" >signs them</text>
  <rect x="675" y="454" width="195" height="100" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="772" y="476" text-anchor="middle" font-size="13" fill="#7b3fb5" font-weight="700" >4. Embed</text>
  <text x="772" y="496" text-anchor="middle" font-size="11.5" fill="#333" >hex of the CMS container</text>
  <text x="772" y="512" text-anchor="middle" font-size="11.5" fill="#333" >overwrites the zeros,</text>
  <text x="772" y="528" text-anchor="middle" font-size="11.5" fill="#333" >nothing else moves</text>
  <line x1="225" y1="504" x2="244" y2="504" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="440" y1="504" x2="459" y2="504" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="655" y1="504" x2="674" y2="504" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="450" y="590" text-anchor="middle" font-size="12" fill="#555" >The /ByteRange array itself sits inside range 1, which is why it is written with trailing spaces and patched after the digest is known.</text>
  <text x="450" y="608" text-anchor="middle" font-size="12" fill="#555" >Changing any covered byte changes the digest, so the validator sees a different value than the one inside the signed attributes.</text>
</svg>
