<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img" aria-labelledby="woocommerce-release-gantt-t woocommerce-release-gantt-d">
<title id="woocommerce-release-gantt-t">WooCommerce releases since 2024</title>
<desc id="woocommerce-release-gantt-d">Release timeline of every WooCommerce minor release line from 8.5 (January 2024) to 11.2 (October 2026): about one every five weeks, each line current until the next one ships. Security fixes are backported to the last 21 major versions only when the CVSS score is 9 or higher, so a store on an older line may get no patch for a lower-severity issue.</desc>
