<svg viewBox="0 0 980 560" width="980" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Azure gateways and load balancers -- comparison matrix</text>
  <text x="490" y="47" text-anchor="middle" font-size="11.5" fill="#5f6368">Five services, five dimensions -- pick the row(s) that match the traffic in front of you</text>

  <!-- Column headers -->
  <!-- Row label column: x 8-158, then 5 data columns of width ~163 each -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="8" y="64" width="150" height="46" rx="6" fill="#3d4a5c"/>
    <text x="83" y="92" text-anchor="middle"> </text>

    <rect x="162" y="64" width="160" height="46" rx="6" fill="#1a5fb4"/>
    <text x="242" y="83" text-anchor="middle">Load</text>
    <text x="242" y="97" text-anchor="middle">Balancer</text>

    <rect x="326" y="64" width="160" height="46" rx="6" fill="#8a3fc9"/>
    <text x="406" y="83" text-anchor="middle">Application</text>
    <text x="406" y="97" text-anchor="middle">Gateway v2</text>

    <rect x="490" y="64" width="160" height="46" rx="6" fill="#c9457a"/>
    <text x="570" y="83" text-anchor="middle">Front</text>
    <text x="570" y="97" text-anchor="middle">Door</text>

    <rect x="654" y="64" width="160" height="46" rx="6" fill="#c99a4a"/>
    <text x="734" y="83" text-anchor="middle">Traffic</text>
    <text x="734" y="97" text-anchor="middle">Manager</text>

    <rect x="818" y="64" width="154" height="46" rx="6" fill="#2f9e6e"/>
    <text x="895" y="80" text-anchor="middle" font-size="9.6">App. Gateway</text>
    <text x="895" y="93" text-anchor="middle" font-size="9.6">for Containers</text>
  </g>

  <!-- Row bands -->
  <g>
    <!-- OSI layer -->
    <rect x="8" y="118" width="964" height="70" fill="#f7f8fa"/>
    <!-- Global/regional -->
    <rect x="8" y="196" width="964" height="70" fill="#ffffff"/>
    <!-- Protocols -->
    <rect x="8" y="274" width="964" height="90" fill="#f7f8fa"/>
    <!-- WAF -->
    <rect x="8" y="372" width="964" height="60" fill="#ffffff"/>
    <!-- Typical use -->
    <rect x="8" y="440" width="964" height="104" fill="#f7f8fa"/>
  </g>

  <!-- Row labels -->
  <g font-size="10.5" font-weight="700" fill="#1a1a1a">
    <text x="16" y="158">OSI layer</text>
    <text x="16" y="236">Global / regional</text>
    <text x="16" y="314">Protocols</text>
    <text x="16" y="406">WAF</text>
    <text x="16" y="488">Typical use</text>
  </g>

  <!-- Cell text, 9pt -->
  <g font-size="9.2" fill="#1a1a1a">
    <!-- Load Balancer column x-center 242, left edge text x=172 -->
    <text x="172" y="142">L4 (TCP/UDP),</text>
    <text x="172" y="154">transport only</text>
    <text x="172" y="166">(no HTTP inspection)</text>

    <text x="172" y="220">Regional</text>
    <text x="172" y="232">(public or internal</text>
    <text x="172" y="244">front end)</text>

    <text x="172" y="298">Any TCP/UDP:</text>
    <text x="172" y="310">HTTP(S), SQL,</text>
    <text x="172" y="322">RDP/SSH, game</text>
    <text x="172" y="334">protocols, custom</text>
    <text x="172" y="346">TCP services</text>

    <text x="172" y="396">None</text>
    <text x="172" y="408">(not L7-aware)</text>

    <text x="172" y="462">VM Scale Set /</text>
    <text x="172" y="474">AKS node-level LB;</text>
    <text x="172" y="486">non-HTTP services;</text>
    <text x="172" y="498">outbound SNAT for</text>
    <text x="172" y="510">a VNet</text>

    <!-- Application Gateway v2 column left edge x=336 -->
    <text x="336" y="142">L7 (HTTP/HTTPS),</text>
    <text x="336" y="154">application-aware</text>
    <text x="336" y="166">reverse proxy</text>

    <text x="336" y="220">Regional</text>
    <text x="336" y="232">(zone-redundant</text>
    <text x="336" y="244">within the region)</text>

    <text x="336" y="298">HTTP, HTTPS,</text>
    <text x="336" y="310">HTTP/2, WebSocket</text>
    <text x="336" y="322">(all L7 -- no raw</text>
    <text x="336" y="334">TCP/UDP)</text>

    <text x="336" y="396">Yes -- WAF policy</text>
    <text x="336" y="408">(OWASP CRS + custom)</text>

    <text x="336" y="462">Path-based routing,</text>
    <text x="336" y="474">TLS termination,</text>
    <text x="336" y="486">multi-site hosting,</text>
    <text x="336" y="498">regional edge for</text>
    <text x="336" y="510">web apps/APIs</text>

    <!-- Front Door column left edge x=500 -->
    <text x="500" y="142">L7 (HTTP/HTTPS),</text>
    <text x="500" y="154">global anycast</text>
    <text x="500" y="166">edge (CDN-style)</text>

    <text x="500" y="220">Global</text>
    <text x="500" y="232">(edge PoPs across</text>
    <text x="500" y="244">Microsoft's network)</text>

    <text x="500" y="298">HTTP, HTTPS,</text>
    <text x="500" y="310">HTTP/2, WebSocket</text>
    <text x="500" y="322">(no raw TCP/UDP;</text>
    <text x="500" y="334">no non-web protocol)</text>

    <text x="500" y="396">Yes -- managed rule</text>
    <text x="500" y="408">sets on Premium only</text>

    <text x="500" y="462">Global web front door,</text>
    <text x="500" y="474">caching/CDN, multi-</text>
    <text x="500" y="486">region failover for</text>
    <text x="500" y="498">HTTP(S) apps and</text>
    <text x="500" y="510">static content</text>

    <!-- Traffic Manager column left edge x=664 -->
    <text x="664" y="142">DNS (L7 of DNS</text>
    <text x="664" y="154">itself); redirects</text>
    <text x="664" y="166">the client, not proxy</text>

    <text x="664" y="220">Global</text>
    <text x="664" y="232">(DNS-based, no data</text>
    <text x="664" y="244">plane in the path)</text>

    <text x="664" y="298">Protocol-agnostic --</text>
    <text x="664" y="310">resolves a hostname;</text>
    <text x="664" y="322">the client then talks</text>
    <text x="664" y="334">directly to the endpoint</text>

    <text x="664" y="396">None</text>
    <text x="664" y="408">(no data-path presence)</text>

    <text x="664" y="462">Cross-cloud / cross-</text>
    <text x="664" y="474">region failover and</text>
    <text x="664" y="486">geo-routing for non-</text>
    <text x="664" y="498">HTTP or hybrid</text>
    <text x="664" y="510">on-prem/Azure setups</text>

    <!-- AGC column left edge x=828 -->
    <text x="828" y="142">L7 (HTTP/HTTPS),</text>
    <text x="828" y="154">Kubernetes Gateway</text>
    <text x="828" y="166">API-native</text>

    <text x="828" y="220">Regional</text>
    <text x="828" y="232">(fronts one AKS</text>
    <text x="828" y="244">cluster's Gateway API)</text>

    <text x="828" y="298">HTTP, HTTPS,</text>
    <text x="828" y="310">gRPC, HTTP/2 --</text>
    <text x="828" y="322">via Gateway API</text>
    <text x="828" y="334">HTTPRoute/GRPCRoute</text>

    <text x="828" y="396">Yes -- WAF policy</text>
    <text x="828" y="408">(same engine as v2)</text>

    <text x="828" y="462">Native ingress for AKS</text>
    <text x="828" y="474">microservices needing</text>
    <text x="828" y="486">Gateway API traffic</text>
    <text x="828" y="498">splitting/mirroring</text>
    <text x="828" y="510">without a sidecar mesh</text>
  </g>

  <!-- outer border -->
  <rect x="8" y="64" width="964" height="480" fill="none" stroke="#c7cad1" stroke-width="1"/>
  <line x1="162" y1="64" x2="162" y2="544" stroke="#c7cad1" stroke-width="1"/>
  <line x1="326" y1="64" x2="326" y2="544" stroke="#c7cad1" stroke-width="1"/>
  <line x1="490" y1="64" x2="490" y2="544" stroke="#c7cad1" stroke-width="1"/>
  <line x1="654" y1="64" x2="654" y2="544" stroke="#c7cad1" stroke-width="1"/>
  <line x1="818" y1="64" x2="818" y2="544" stroke="#c7cad1" stroke-width="1"/>
  <line x1="8" y1="196" x2="972" y2="196" stroke="#c7cad1" stroke-width="1"/>
  <line x1="8" y1="274" x2="972" y2="274" stroke="#c7cad1" stroke-width="1"/>
  <line x1="8" y1="372" x2="972" y2="372" stroke="#c7cad1" stroke-width="1"/>
  <line x1="8" y1="440" x2="972" y2="440" stroke="#c7cad1" stroke-width="1"/>

  <text x="490" y="556" text-anchor="middle" font-size="9.3" fill="#5f6368">Layered topologies (below) combine several rows: e.g. Front Door in front of Application Gateway/AGC, or Front Door in front of API Management.</text>
</svg>
