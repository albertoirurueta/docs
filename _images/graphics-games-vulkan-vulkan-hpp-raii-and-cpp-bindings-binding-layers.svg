<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-hpp-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three ways to call Vulkan from C++ share one set of headers</text>
<rect x="20" y="60" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="90.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">C headers</text>
<text x="380.0" y="106.0" text-anchor="middle" font-size="12" fill="#374151">vulkan_core.h: plain C structs, enums and function pointers (generated from vk.xml)</text>
<rect x="20" y="160" width="350" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="189.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">vulkan.hpp: enhanced layer</text>
<text x="195.0" y="205.0" text-anchor="middle" font-size="12" fill="#3730A3">namespace vk</text>
<text x="195.0" y="221.0" text-anchor="middle" font-size="12" fill="#3730A3">enums as enum class, structs with defaults</text>
<text x="195.0" y="237.0" text-anchor="middle" font-size="12" fill="#3730A3">ArrayProxy, StructureChain, exceptions</text>
<rect x="390" y="160" width="350" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="189.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">vulkan_raii.hpp</text>
<text x="565.0" y="205.0" text-anchor="middle" font-size="12" fill="#065F46">namespace vk::raii</text>
<text x="565.0" y="221.0" text-anchor="middle" font-size="12" fill="#065F46">move-only owners with their own dispatcher</text>
<text x="565.0" y="237.0" text-anchor="middle" font-size="12" fill="#065F46">destructors call vkDestroy*</text>
<rect x="20" y="290" width="350" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="314.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Dispatch</text>
<text x="195.0" y="330.0" text-anchor="middle" font-size="12" fill="#92400E">VK_NO_PROTOTYPES or</text>
<text x="195.0" y="346.0" text-anchor="middle" font-size="12" fill="#92400E">VULKAN_HPP_DISPATCH_LOADER_DYNAMIC</text>
<text x="195.0" y="362.0" text-anchor="middle" font-size="12" fill="#92400E">loader calls resolved at run time</text>
<rect x="390" y="290" width="350" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="322.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">C++ named module</text>
<text x="565.0" y="338.0" text-anchor="middle" font-size="12" fill="#3730A3">import vulkan; (experimental)</text>
<text x="565.0" y="354.0" text-anchor="middle" font-size="12" fill="#3730A3">needs C++20 modules and import std</text>
<line x1="195" y1="130" x2="195" y2="158" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-hpp-layers)"/>
<line x1="565" y1="130" x2="565" y2="158" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-hpp-layers)"/>
<line x1="195" y1="262" x2="195" y2="288" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-hpp-layers)"/>
<line x1="565" y1="262" x2="565" y2="288" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-hpp-layers)"/>
</svg>
