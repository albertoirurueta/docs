<text x="44" y="600" font-size="12" fill="#f2f5f8">2024-06-13: CVE-2024-34102, CosmicSting (APSB24-40, XXE, CVSS 9.8); in the CISA catalog from 2024-07-17.</text>
<text x="44" y="618" font-size="12" fill="#f2f5f8">Isolated patches ship on Patch Tuesday (second Tuesday); Mage-OS security releases: 3.5.0 (2026-09-08), 3.6.0 (2026-10-14).</text>
