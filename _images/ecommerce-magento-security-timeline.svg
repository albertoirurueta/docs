<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Magento and Adobe Commerce security timeline, September 2025 to October 2026</title>
<desc id="d">A horizontal time axis from September 2025 to October 2026. Numbered blue markers above the axis are Adobe security bulletins (APSB). Lettered red markers below the axis are exploitation events: attacks on SessionReaper, the CISA Known Exploited Vulnerabilities catalog entries, and the zero-day fixed by APSB26-146. A legend under the axis gives date, bulletin, highest CVSS score and fixed versions for every marker, and a strip at the bottom lists the earlier landmarks of 2022 and 2024.</desc>
