<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-es-on-android-gl-thread-vs-ui-thread" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two threads: Android UI thread and the GLSurfaceView GL thread</text>
<rect x="20" y="50" width="720" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="34" y="72" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">UI (main) thread: Views, lifecycle, input</text>
<rect x="20" y="240" width="720" height="150" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="34" y="262" font-size="13" font-weight="bold" fill="#065F46" text-anchor="start">GL thread: owns the EGL context, the only thread that may call GLES</text>
<rect x="40" y="92" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="116.35" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Activity.onCreate</text>
<text x="145.0" y="131.35" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GLSurfaceView(this)</text>
<text x="145.0" y="146.35" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setEGLContextClientVersion(3)</text>
<text x="145.0" y="161.35" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setRenderer(renderer)</text>
<rect x="275" y="92" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="123.85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">onTouchEvent / sensors</text>
<text x="380.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glView.queueEvent {</text>
<text x="380.0" y="153.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">renderer.rotateBook(dx) }</text>
<rect x="510" y="92" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="615.0" y="123.85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">onPause / onResume</text>
<text x="615.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glView.onPause()</text>
<text x="615.0" y="153.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glView.onResume()</text>
<rect x="40" y="290" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="145.0" y="321.85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">onSurfaceCreated</text>
<text x="145.0" y="336.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">compile shaders, upload</text>
<text x="145.0" y="351.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">buffers and textures</text>
<rect x="275" y="290" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="321.85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">onSurfaceChanged</text>
<text x="380.0" y="336.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glViewport, projection</text>
<text x="380.0" y="351.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">matrix for the new size</text>
<rect x="510" y="290" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="615.0" y="321.85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">onDrawFrame (each frame)</text>
<text x="615.0" y="336.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">apply queued events,</text>
<text x="615.0" y="351.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glClear, glDraw*, swap</text>
<line x1="145" y1="178" x2="145" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-gl-thread-vs-ui-thread)"/>
<text x="155" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">surface ready: thread starts</text>
<line x1="380" y1="178" x2="580" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-gl-thread-vs-ui-thread)"/>
<text x="390" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Runnable runs on the GL thread</text>
<line x1="615" y1="178" x2="615" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-gl-thread-vs-ui-thread)"/>
<text x="625" y="205" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">pause: loop stops,</text>
<text x="625" y="219" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">context may be lost</text>
<line x1="250" y1="333" x2="273" y2="333" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-gl-thread-vs-ui-thread)"/>
<line x1="485" y1="333" x2="508" y2="333" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-gl-thread-vs-ui-thread)"/>
<text x="380" y="420" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Cross the boundary with queueEvent, runOnUiThread or a Handler; never call GLES from the UI thread.</text>
</svg>
