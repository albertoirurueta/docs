<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Versioned folders mapped to versions and URLs</title>
<desc id="d">The docs folder is the current version served under next, and each versioned_docs folder is a frozen version; the newest one is the latest version served at the site root.</desc>
<rect width="800" height="400" rx="12" fill="#1f2937"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="32" font-size="14" font-weight="bold" fill="#e5e7eb">Folder on disk</text>
<text x="330" y="32" font-size="14" font-weight="bold" fill="#e5e7eb">Version</text>
<text x="560" y="32" font-size="14" font-weight="bold" fill="#e5e7eb">URL</text>
<rect x="16" y="48" width="270" height="86" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="32" y="74" font-size="13" font-weight="bold" fill="#fbbf24">docs/</text>
<text x="32" y="98" font-size="13" fill="#f9fafb">sidebars.ts</text>
<text x="32" y="120" font-size="12" fill="#d1d5db">working copy, edited every day</text>
<rect x="320" y="60" width="190" height="62" rx="8" fill="#2563eb"/>
<text x="334" y="86" font-size="13" font-weight="bold" fill="#ffffff">current (3.0 next)</text>
<text x="334" y="106" font-size="12" fill="#e0e7ff">unreleased banner</text>
<rect x="550" y="60" width="234" height="62" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="566" y="96" font-size="14" fill="#f9fafb">/next/convert</text>
<line x1="286" y1="91" x2="316" y2="91" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="91" x2="546" y2="91" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="16" y="158" width="270" height="100" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="32" y="184" font-size="13" font-weight="bold" fill="#fbbf24">versioned_docs/version-2.0/</text>
<text x="32" y="208" font-size="13" fill="#f9fafb">versioned_sidebars/version-2.0-sidebars.json</text>
<text x="32" y="232" font-size="12" fill="#d1d5db">first entry of versions.json</text>
<rect x="320" y="170" width="190" height="62" rx="8" fill="#065f46"/>
<text x="334" y="196" font-size="13" font-weight="bold" fill="#ffffff">2.0 (latest)</text>
<text x="334" y="216" font-size="12" fill="#d1fae5">no banner</text>
<rect x="550" y="170" width="234" height="62" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="566" y="206" font-size="14" fill="#f9fafb">/convert</text>
<line x1="286" y1="201" x2="316" y2="201" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="201" x2="546" y2="201" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="16" y="282" width="270" height="100" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="32" y="308" font-size="13" font-weight="bold" fill="#fbbf24">versioned_docs/version-1.0/</text>
<text x="32" y="332" font-size="13" fill="#f9fafb">versioned_sidebars/version-1.0-sidebars.json</text>
<text x="32" y="356" font-size="12" fill="#d1d5db">older entry of versions.json</text>
<rect x="320" y="294" width="190" height="62" rx="8" fill="#92400e"/>
<text x="334" y="320" font-size="13" font-weight="bold" fill="#ffffff">1.0</text>
<text x="334" y="340" font-size="12" fill="#fef3c7">unmaintained banner</text>
<rect x="550" y="294" width="234" height="62" rx="8" fill="#374151" stroke="#9ca3af"/>
<text x="566" y="330" font-size="14" fill="#f9fafb">/1.0/convert</text>
<line x1="286" y1="325" x2="316" y2="325" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="325" x2="546" y2="325" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
</svg>
