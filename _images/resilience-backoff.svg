<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Fixed, exponential and jittered backoff</text>
  <text x="305" y="52" font-size="12" fill="#444444" text-anchor="middle">Wait before each retry (ms), initial 500 ms, multiplier 2, cap 8000 ms, jitter factor 0.5</text>
  <line x1="70" y1="320.0" x2="540" y2="320.0" stroke="#dddddd" stroke-width="1"/><text x="62" y="324.0" font-size="10.5" fill="#666666" text-anchor="end">0</text><line x1="70" y1="264.4" x2="540" y2="264.4" stroke="#dddddd" stroke-width="1"/><text x="62" y="268.4" font-size="10.5" fill="#666666" text-anchor="end">2000</text><line x1="70" y1="208.9" x2="540" y2="208.9" stroke="#dddddd" stroke-width="1"/><text x="62" y="212.9" font-size="10.5" fill="#666666" text-anchor="end">4000</text><line x1="70" y1="153.3" x2="540" y2="153.3" stroke="#dddddd" stroke-width="1"/><text x="62" y="157.3" font-size="10.5" fill="#666666" text-anchor="end">6000</text><line x1="70" y1="97.8" x2="540" y2="97.8" stroke="#dddddd" stroke-width="1"/><text x="62" y="101.8" font-size="10.5" fill="#666666" text-anchor="end">8000</text>
  <line x1="70" y1="320" x2="540" y2="320" stroke="#444444" stroke-width="1.4"/>
  <line x1="70" y1="70.0" x2="70" y2="320" stroke="#444444" stroke-width="1.4"/>
  <text x="100" y="338" font-size="11" fill="#444444" text-anchor="middle">1</text><text x="184" y="338" font-size="11" fill="#444444" text-anchor="middle">2</text><text x="268" y="338" font-size="11" fill="#444444" text-anchor="middle">3</text><text x="352" y="338" font-size="11" fill="#444444" text-anchor="middle">4</text><text x="436" y="338" font-size="11" fill="#444444" text-anchor="middle">5</text><text x="520" y="338" font-size="11" fill="#444444" text-anchor="middle">6</text>
  <text x="305" y="362" font-size="11.5" fill="#444444" text-anchor="middle">retry number (the wait that follows failed attempt n)</text>
  <polygon points="100,299.2 184,278.3 268,236.7 352,153.3 436,97.8 520,97.8 520,97.8 436,208.9 352,264.4 268,292.2 184,306.1 100,313.1" fill="#c26a00" fill-opacity="0.22" stroke="#c26a00" stroke-width="1" stroke-dasharray="4 3"/>
  <polyline points="100,306.1 184,292.2 268,264.4 352,208.9 436,97.8 520,97.8" fill="none" stroke="#1c4b73" stroke-width="2.4"/>
  <circle cx="100" cy="306.1" r="3.6" fill="#1c4b73"/><circle cx="184" cy="292.2" r="3.6" fill="#1c4b73"/><circle cx="268" cy="264.4" r="3.6" fill="#1c4b73"/><circle cx="352" cy="208.9" r="3.6" fill="#1c4b73"/><circle cx="436" cy="97.8" r="3.6" fill="#1c4b73"/><circle cx="520" cy="97.8" r="3.6" fill="#1c4b73"/>
  <line x1="100" y1="306.1" x2="520" y2="306.1" stroke="#666666" stroke-width="2.2" stroke-dasharray="7 4"/>
  <rect x="82" y="76" width="200" height="62" rx="4" fill="#ffffff" stroke="#cccccc"/>
  <line x1="92" y1="92" x2="122" y2="92" stroke="#666666" stroke-width="2.2" stroke-dasharray="7 4"/><text x="130" y="96" font-size="11" fill="#444444">fixed (waitDuration 500 ms)</text>
  <line x1="92" y1="108" x2="122" y2="108" stroke="#1c4b73" stroke-width="2.4"/><text x="130" y="112" font-size="11" fill="#444444">exponential, capped</text>
  <rect x="92" y="118" width="30" height="12" fill="#c26a00" fill-opacity="0.3" stroke="#c26a00" stroke-dasharray="4 3"/><text x="130" y="128" font-size="11" fill="#444444">exponential + jitter 0.5 (range)</text>
  <text x="352" y="196.9" font-size="11" fill="#1c4b73" text-anchor="end" font-weight="bold">exponential</text>
  <text x="352" y="145.3" font-size="11" fill="#9a5200" text-anchor="end">jitter range</text>
  <text x="530" y="89.8" font-size="10.5" fill="#444444" text-anchor="end">cap 8000 ms: jitter collapses to 8000</text>

  <rect x="590" y="74" width="290" height="268" rx="8" fill="#f4f4f4" stroke="#999999"/>
  <text x="735" y="98" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Retry storm, 1000 clients</text>
  <text x="735" y="116" font-size="10.5" fill="#666666" text-anchor="middle">all fail at t = 0; first retry; clients in the</text>
  <text x="735" y="130" font-size="10.5" fill="#666666" text-anchor="middle">busiest 50 ms bucket (measured)</text>
  <line x1="620" y1="320" x2="860" y2="320" stroke="#444444" stroke-width="1.4"/>
  <rect x="650" y="160" width="70" height="160" fill="#1c4b73"/>
  <text x="685" y="154" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">1000</text>
  <text x="685" y="336" font-size="11" fill="#444444" text-anchor="middle">no jitter</text>
  <rect x="760" y="300.3" width="70" height="19.7" fill="#c26a00"/>
  <text x="795" y="294.3" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">123</text>
  <text x="795" y="336" font-size="11" fill="#444444" text-anchor="middle">factor 0.5</text>

  <text x="450" y="396" font-size="11" fill="#666666" text-anchor="middle">Values from IntervalFunction in Resilience4j 2.4.0 (ofExponentialBackoff, ofExponentialRandomBackoff); jitter bounds observed over 200,000 samples per attempt.</text>
</svg>
