<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A debug sidecar sharing namespaces</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">A debug sidecar sharing namespaces</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">docker run --pid=container:orders --network=container:orders nicolaka/netshoot:v0.16</text>
  <rect x="40" y="70" width="300" height="210" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="190.0" y="88.0" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Target container "orders"</text>
  <rect x="60" y="120" width="260" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="142.8" font-size="9.5" fill="#333333" text-anchor="middle">PID 1: java -jar /app/app.jar</text>
  <rect x="60" y="170" width="260" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="192.8" font-size="9.5" fill="#333333" text-anchor="middle">distroless image: no shell, no tools</text>
  <rect x="60" y="220" width="260" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="190.0" y="242.8" font-size="9.5" fill="#333333" text-anchor="middle">own mount namespace (its files)</text>
  <rect x="420" y="70" width="300" height="210" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="570.0" y="88.0" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Sidecar "netshoot"</text>
  <rect x="440" y="120" width="260" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="142.8" font-size="9.5" fill="#333333" text-anchor="middle">ps, strace, ss, curl, dig, tcpdump</text>
  <rect x="440" y="170" width="260" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="570.0" y="192.8" font-size="9.5" fill="#333333" text-anchor="middle">own mount namespace (its tools)</text>
  <rect x="250" y="315" width="260" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="339.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">Shared namespaces</text>
  <text x="380.0" y="354.5" font-size="9.5" fill="#333333" text-anchor="middle">PID: sees java as a sibling process</text>
  <text x="380.0" y="368.0" font-size="9.5" fill="#333333" text-anchor="middle">NET: same IP, localhost and ports</text>
  <line x1="190" y1="280" x2="300" y2="315" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="570" y1="280" x2="460" y2="315" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380" y="410" font-size="10" fill="#555555" text-anchor="middle">Nothing is installed into the target image; the sidecar is removed with --rm when you exit.</text>
</svg>
