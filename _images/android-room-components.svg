<svg viewBox="0 0 760 620" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Room and Paging in TrailMate</text>

  <!-- TrailMateDatabase container -->
  <rect x="40" y="50" width="680" height="230" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="60" y="74" font-size="15" font-weight="700" fill="#1a3a6b">TrailMateDatabase (RoomDatabase)</text>

  <!-- TrailEntity -->
  <rect x="70" y="90" width="190" height="80" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="165" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">TrailEntity</text>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#3c4043">@Entity, indices,</text>
  <text x="165" y="145" text-anchor="middle" font-size="11" fill="#3c4043">type converters</text>
  <text x="165" y="160" text-anchor="middle" font-size="11" fill="#3c4043">(region, difficulty)</text>

  <!-- PhotoEntity -->
  <rect x="285" y="90" width="190" height="80" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">PhotoEntity</text>
  <text x="380" y="130" text-anchor="middle" font-size="11" fill="#3c4043">@Entity, foreign key</text>
  <text x="380" y="145" text-anchor="middle" font-size="11" fill="#3c4043">on trailId, index on</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#3c4043">trailId</text>

  <!-- RemoteKeyEntity -->
  <rect x="500" y="90" width="200" height="80" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="600" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">RemoteKeyEntity</text>
  <text x="600" y="130" text-anchor="middle" font-size="11" fill="#3c4043">@Entity, one row per</text>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#3c4043">trailId, nextKey for</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#3c4043">RemoteMediator</text>

  <!-- TrailDao -->
  <rect x="70" y="190" width="290" height="70" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="215" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">TrailDao</text>
  <text x="215" y="230" text-anchor="middle" font-size="11" fill="#3c4043">Flow&lt;List&lt;TrailWithPhotos&gt;&gt;, @Upsert,</text>
  <text x="215" y="245" text-anchor="middle" font-size="11" fill="#3c4043">@Transaction, pagingSource()</text>

  <!-- RemoteKeyDao -->
  <rect x="390" y="190" width="310" height="70" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="545" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">RemoteKeyDao</text>
  <text x="545" y="230" text-anchor="middle" font-size="11" fill="#3c4043">reads/writes the remote keys that the</text>
  <text x="545" y="245" text-anchor="middle" font-size="11" fill="#3c4043">RemoteMediator uses to page the network</text>

  <!-- Arrows entities -> daos -->
  <path d="M165 170 L215 190" stroke="#4285f4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 170 L280 190" stroke="#4285f4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 170 L545 190" stroke="#4285f4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Hilt-provided singleton note -->
  <text x="60" y="270" font-size="11" fill="#5f6368">Provided as an application-scoped singleton by Hilt's DatabaseModule</text>

  <!-- OfflineFirstTrailRepository -->
  <rect x="40" y="310" width="680" height="80" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="60" y="334" font-size="15" font-weight="700" fill="#0d652d">OfflineFirstTrailRepository</text>
  <text x="60" y="356" font-size="12" fill="#1a1a1a">Builds a Pager(config, remoteMediator = TrailRemoteMediator) { trailDao.pagingSource() }</text>
  <text x="60" y="374" font-size="12" fill="#1a1a1a">Room is the single source of truth; the RemoteMediator fetches pages from TrailApi and upserts into Room.</text>

  <!-- Arrow repo -> database -->
  <path d="M380 310 L380 280" stroke="#34a853" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Flow<PagingData<Trail>> -->
  <rect x="270" y="420" width="220" height="60" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="380" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Flow&lt;PagingData&lt;Trail&gt;&gt;</text>
  <text x="380" y="462" text-anchor="middle" font-size="11" fill="#3c4043">.cachedIn(viewModelScope)</text>

  <path d="M380 390 L380 420" stroke="#34a853" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Compose consumer -->
  <rect x="70" y="510" width="280" height="70" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="210" y="534" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d0b">TrailListScreen</text>
  <text x="210" y="552" text-anchor="middle" font-size="11" fill="#3c4043">collectAsLazyPagingItems()</text>
  <text x="210" y="567" text-anchor="middle" font-size="11" fill="#3c4043">LazyColumn + LoadState footer</text>

  <!-- Views consumer -->
  <rect x="410" y="510" width="280" height="70" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="550" y="534" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d0b">TrailListFragment</text>
  <text x="550" y="552" text-anchor="middle" font-size="11" fill="#3c4043">TrailPagingAdapter</text>
  <text x="550" y="567" text-anchor="middle" font-size="11" fill="#3c4043">: PagingDataAdapter&lt;Trail, TrailViewHolder&gt;</text>

  <path d="M320 480 L210 510" stroke="#ea4335" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M440 480 L550 510" stroke="#ea4335" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34a853"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea4335"/>
    </marker>
  </defs>
</svg>
