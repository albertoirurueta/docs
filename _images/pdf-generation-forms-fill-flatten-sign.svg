<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ffs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Two safe orders for form, flatten and signature</text>

  <!-- Lane A -->
  <text x="30" y="58" font-size="13" font-weight="700" fill="#1a1a1a">A. Back office fills, flattens, then the signature goes last</text>

  <rect x="30" y="72" width="150" height="86" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="105" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">1. Template</text>
  <text x="105" y="116" text-anchor="middle" font-size="11" fill="#333">blank AcroForm with an</text>
  <text x="105" y="131" text-anchor="middle" font-size="11" fill="#333">empty signature field</text>
  <text x="105" y="148" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">builders or layout</text>

  <rect x="225" y="72" width="150" height="86" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="300" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">2. Fill</text>
  <text x="300" y="116" text-anchor="middle" font-size="11" fill="#333">values from the database</text>
  <text x="300" y="131" text-anchor="middle" font-size="11" fill="#333">or from XFDF</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">setValue / mergeToPdf</text>

  <rect x="420" y="72" width="150" height="86" rx="8" fill="#fff1d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="495" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">3. Flatten</text>
  <text x="495" y="116" text-anchor="middle" font-size="11" fill="#333">every field except the</text>
  <text x="495" y="131" text-anchor="middle" font-size="11" fill="#333">signature field</text>
  <text x="495" y="148" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">partialFormFlattening</text>

  <rect x="615" y="72" width="130" height="86" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="680" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">4. Sign</text>
  <text x="680" y="116" text-anchor="middle" font-size="11" fill="#333">PAdES into the</text>
  <text x="680" y="131" text-anchor="middle" font-size="11" fill="#333">existing field</text>
  <text x="680" y="148" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">PdfPadesSigner</text>

  <rect x="790" y="72" width="80" height="86" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.6"/>
  <text x="830" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Archive</text>
  <text x="830" y="126" text-anchor="middle" font-size="11" fill="#333">read only,</text>
  <text x="830" y="141" text-anchor="middle" font-size="11" fill="#333">signed</text>

  <line x1="180" y1="115" x2="223" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="375" y1="115" x2="418" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="570" y1="115" x2="613" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="745" y1="115" x2="788" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>

  <text x="30" y="186" font-size="11" fill="#333">Flattening rewrites the file, so it must happen before the signature. A signed file that is flattened afterwards</text>
  <text x="30" y="202" font-size="11" fill="#333">loses its signature fields in a non-append rewrite, as the test of this page shows.</text>

  <!-- Lane B -->
  <text x="30" y="246" font-size="13" font-weight="700" fill="#1a1a1a">B. Issuer certifies the form, the customer fills and signs in append mode</text>

  <rect x="30" y="260" width="150" height="86" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="105" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">1. Template</text>
  <text x="105" y="304" text-anchor="middle" font-size="11" fill="#333">blank AcroForm with</text>
  <text x="105" y="319" text-anchor="middle" font-size="11" fill="#333">a customer signature</text>

  <rect x="225" y="260" width="150" height="86" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="300" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">2. Certify</text>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#333">DocMDP P=2: form filling</text>
  <text x="300" y="319" text-anchor="middle" font-size="11" fill="#333">and signing stay allowed</text>
  <text x="300" y="336" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">PdfSigner</text>

  <rect x="420" y="260" width="150" height="86" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="495" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">3. Fill</text>
  <text x="495" y="304" text-anchor="middle" font-size="11" fill="#333">new revision, earlier</text>
  <text x="495" y="319" text-anchor="middle" font-size="11" fill="#333">bytes unchanged</text>
  <text x="495" y="336" text-anchor="middle" font-size="10" font-family="Courier New, monospace" fill="#333">useAppendMode()</text>

  <rect x="615" y="260" width="130" height="86" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="680" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">4. Sign</text>
  <text x="680" y="304" text-anchor="middle" font-size="11" fill="#333">customer signature</text>
  <text x="680" y="319" text-anchor="middle" font-size="11" fill="#333">in its own field</text>

  <rect x="790" y="260" width="80" height="86" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.6"/>
  <text x="830" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Archive</text>
  <text x="830" y="314" text-anchor="middle" font-size="11" fill="#333">two</text>
  <text x="830" y="329" text-anchor="middle" font-size="11" fill="#333">signatures</text>

  <line x1="180" y1="303" x2="223" y2="303" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="375" y1="303" x2="418" y2="303" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="570" y1="303" x2="613" y2="303" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>
  <line x1="745" y1="303" x2="788" y2="303" stroke="#555" stroke-width="1.6" marker-end="url(#ffs-arrow)"/>

  <text x="30" y="376" font-size="11" fill="#333">The certification signature covers only the first revision, so it no longer covers the whole file after step 3. That is</text>
  <text x="30" y="392" font-size="11" fill="#333">expected: the reader checks that every later change was a permitted form fill or signature.</text>
  <text x="30" y="414" font-size="11" fill="#555">Both orders were run with iText 9.8.0 for this page, and the signatures read back as intact.</text>
</svg>
