<svg viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="640" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A reference architecture for an LLM application</text>
  <text x="390" y="48" font-size="12" fill="#666666" text-anchor="middle">Illustrative pipeline shape -- not every application needs every block</text>

  <!-- User query -->
  <rect x="270" y="62" width="240" height="42" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="390" y="88" font-size="13" fill="#222222" text-anchor="middle">User query</text>

  <polygon points="390,104 383,118 397,118" fill="#555555"/>

  <!-- Context enhancement -->
  <rect x="60" y="118" width="660" height="56" rx="8" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="90" y="140" font-size="14" font-weight="bold" fill="#1c4b73">1. Context enhancement (RAG)</text>
  <text x="90" y="160" font-size="11.5" fill="#333333">Retrieve and assemble the passages the query actually needs</text>

  <polygon points="390,174 383,188 397,188" fill="#555555"/>

  <!-- Guardrails (input) -->
  <rect x="60" y="188" width="660" height="56" rx="8" fill="#fbeee7" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="90" y="210" font-size="14" font-weight="bold" fill="#7a3b12">2. Guardrails (input)</text>
  <text x="90" y="230" font-size="11.5" fill="#333333">Screen the enhanced request before it ever reaches a model</text>

  <polygon points="390,244 383,258 397,258" fill="#555555"/>

  <!-- Router / gateway -->
  <rect x="60" y="258" width="660" height="56" rx="8" fill="#eef7ee" stroke="#2c5e2c" stroke-width="1.5"/>
  <text x="90" y="280" font-size="14" font-weight="bold" fill="#2c5e2c">3. Router / gateway</text>
  <text x="90" y="300" font-size="11.5" fill="#333333">Pick which model (or model cascade) handles this request</text>

  <polygon points="390,314 383,328 397,328" fill="#555555"/>

  <!-- Caching -->
  <rect x="60" y="328" width="660" height="56" rx="8" fill="#f4eefb" stroke="#5a2d82" stroke-width="1.5"/>
  <text x="90" y="350" font-size="14" font-weight="bold" fill="#5a2d82">4. Caching</text>
  <text x="90" y="370" font-size="11.5" fill="#333333">Reuse a prior response or prefix instead of paying for it again</text>

  <polygon points="390,384 383,398 397,398" fill="#555555"/>

  <!-- Model / agent patterns -->
  <rect x="60" y="398" width="660" height="56" rx="8" fill="#fef6e3" stroke="#8a6300" stroke-width="1.5"/>
  <text x="90" y="420" font-size="14" font-weight="bold" fill="#8a6300">5. Model call and agent patterns</text>
  <text x="90" y="440" font-size="11.5" fill="#333333">One model call, or a tool-using agent loop, produces a draft response</text>

  <polygon points="390,454 383,468 397,468" fill="#555555"/>

  <!-- Guardrails (output) -->
  <rect x="60" y="468" width="660" height="56" rx="8" fill="#fbeee7" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="90" y="490" font-size="14" font-weight="bold" fill="#7a3b12">6. Guardrails (output)</text>
  <text x="90" y="510" font-size="11.5" fill="#333333">Validate the draft response before it reaches the user</text>

  <polygon points="390,524 383,538 397,538" fill="#555555"/>

  <!-- Monitoring -->
  <rect x="60" y="538" width="660" height="46" rx="8" fill="#eaeaea" stroke="#444444" stroke-width="1.5"/>
  <text x="90" y="558" font-size="14" font-weight="bold" fill="#222222">7. Monitoring</text>
  <text x="90" y="575" font-size="11.5" fill="#333333">Log every step's inputs, outputs, latency and cost as the response returns</text>

  <!-- Feedback loop arrow, curving back to context enhancement -->
  <path d="M 730 561 C 770 561 770 146 726 146" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="726,146 738,141 738,151" fill="#555555"/>
  <text x="742" y="360" font-size="11" fill="#555555" text-anchor="middle" transform="rotate(90 742 360)">8. Feedback loop -- signals feed back into retrieval, routing and evaluation</text>
</svg>
