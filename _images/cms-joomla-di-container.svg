<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title id="t">Joomla root container and per-extension child containers</title>
  <desc id="d">The root container built by Factory::getContainer holds the core services. Each booted extension gets a child container filled by its services/provider.php. A get() call looks in the child first and then in the parent.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- root container -->
  <rect x="20" y="16" width="920" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#0d47a1">Root container (Factory::getContainer(), library joomla/di)</text>
  <text x="40" y="62" fill="#37474f">Filled once per request by the core service providers; shared services are created on first get()</text>

  <g fill="#ffffff" stroke="#1565c0" stroke-width="1.5">
    <rect x="40" y="78" width="200" height="54" rx="6"/>
    <rect x="256" y="78" width="200" height="54" rx="6"/>
    <rect x="472" y="78" width="200" height="54" rx="6"/>
    <rect x="688" y="78" width="232" height="54" rx="6"/>
    <rect x="40" y="144" width="200" height="54" rx="6"/>
    <rect x="256" y="144" width="200" height="54" rx="6"/>
    <rect x="472" y="144" width="200" height="54" rx="6"/>
    <rect x="688" y="144" width="232" height="54" rx="6"/>
  </g>
  <g fill="#212121" text-anchor="middle">
    <text x="140" y="100" font-weight="bold">DatabaseInterface</text><text x="140" y="118" font-size="11">alias: db, DatabaseDriver</text>
    <text x="356" y="100" font-weight="bold">SiteApplication</text><text x="356" y="118" font-size="11">or Administrator, Api, Console</text>
    <text x="572" y="100" font-weight="bold">DispatcherInterface</text><text x="572" y="118" font-size="11">Joomla\Event, shared</text>
    <text x="804" y="100" font-weight="bold">UserFactoryInterface</text><text x="804" y="118" font-size="11">alias: user.factory</text>
    <text x="140" y="166" font-weight="bold">LanguageFactoryInterface</text><text x="140" y="184" font-size="11">languages and Text</text>
    <text x="356" y="166" font-weight="bold">MailerFactoryInterface</text><text x="356" y="184" font-size="11">PHPMailer wrapper</text>
    <text x="572" y="166" font-weight="bold">FormFactoryInterface</text><text x="572" y="184" font-size="11">forms and fields</text>
    <text x="804" y="166" font-weight="bold">JConfig (alias: config)</text><text x="804" y="184" font-size="11">Registry, protected key</text>
  </g>

  <!-- child containers -->
  <text x="480" y="252" text-anchor="middle" font-size="14" fill="#37474f">Booted on demand: bootComponent(), bootModule(), bootPlugin() call createChild() and load services/provider.php</text>

  <!-- arrows child -> parent -->
  <g stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrb)">
    <path d="M170 330 L170 222" stroke-dasharray="6,4"/>
    <path d="M480 330 L480 222" stroke-dasharray="6,4"/>
    <path d="M790 330 L790 222" stroke-dasharray="6,4"/>
  </g>
  <text x="178" y="282" fill="#1565c0" font-size="12">get() miss: ask parent</text>
  <text x="488" y="282" fill="#1565c0" font-size="12">get() miss: ask parent</text>
  <text x="798" y="282" fill="#1565c0" font-size="12">get() miss: ask parent</text>

  <g>
    <rect x="30" y="332" width="280" height="206" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="170" y="358" text-anchor="middle" font-weight="bold" fill="#1b5e20" font-size="14">Child: com_tallpine</text>
    <text x="170" y="376" text-anchor="middle" font-size="11" fill="#37474f">administrator/components/com_tallpine/services/provider.php</text>
    <g fill="#ffffff" stroke="#2e7d32" stroke-width="1.2">
      <rect x="46" y="388" width="248" height="24" rx="4"/>
      <rect x="46" y="418" width="248" height="24" rx="4"/>
      <rect x="46" y="448" width="248" height="24" rx="4"/>
      <rect x="46" y="478" width="248" height="24" rx="4"/>
    </g>
    <g fill="#212121" font-size="12" text-anchor="middle">
      <text x="170" y="405">MVCFactoryInterface</text>
      <text x="170" y="435">ComponentDispatcherFactoryInterface</text>
      <text x="170" y="465">RouterFactoryInterface</text>
      <text x="170" y="495">CategoryFactoryInterface</text>
    </g>
    <text x="170" y="525" text-anchor="middle" font-size="12" fill="#37474f">ComponentInterface = TallpineComponent</text>
  </g>

  <g>
    <rect x="340" y="332" width="280" height="206" rx="10" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
    <text x="480" y="358" text-anchor="middle" font-weight="bold" fill="#bf360c" font-size="14">Child: mod_tallpine_nexthikes</text>
    <text x="480" y="376" text-anchor="middle" font-size="11" fill="#37474f">modules/mod_tallpine_nexthikes/services/provider.php</text>
    <g fill="#ffffff" stroke="#ef6c00" stroke-width="1.2">
      <rect x="356" y="388" width="248" height="24" rx="4"/>
      <rect x="356" y="418" width="248" height="24" rx="4"/>
    </g>
    <g fill="#212121" font-size="12" text-anchor="middle">
      <text x="480" y="405">ModuleDispatcherFactoryInterface</text>
      <text x="480" y="435">HelperFactoryInterface</text>
    </g>
    <text x="480" y="525" text-anchor="middle" font-size="12" fill="#37474f">ModuleInterface = core Module class</text>
  </g>

  <g>
    <rect x="650" y="332" width="280" height="206" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <text x="790" y="358" text-anchor="middle" font-weight="bold" fill="#4a148c" font-size="14">Child: plg_content_tallpine_conditions</text>
    <text x="790" y="376" text-anchor="middle" font-size="11" fill="#37474f">plugins/content/tallpine_conditions/services/provider.php</text>
    <g fill="#ffffff" stroke="#6a1b9a" stroke-width="1.2">
      <rect x="666" y="388" width="248" height="52" rx="4"/>
    </g>
    <g fill="#212121" font-size="12" text-anchor="middle">
      <text x="790" y="408">PluginInterface = lazy(TallpineConditions)</text>
      <text x="790" y="426">setApplication, setDatabase from parent</text>
    </g>
    <text x="790" y="470" text-anchor="middle" font-size="12" fill="#37474f">Plugin keeps its own state;</text>
    <text x="790" y="488" text-anchor="middle" font-size="12" fill="#37474f">nothing leaks into the root container</text>
  </g>

  <text x="480" y="553" text-anchor="middle" font-size="11" fill="#546e7a">A child set() never changes the parent; a sibling child never sees another child's keys.</text>
</svg>
