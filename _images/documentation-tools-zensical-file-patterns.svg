<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Effect of exclude_docs, draft_docs and not_in_nav</title>
<desc id="d">A matrix showing whether a page matched by each setting is built, served, listed in the automatic navigation, and present in search and sitemap.</desc>
<rect width="760" height="300" rx="12" fill="#1f2937"/>
<text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#f9fafb">Is a page matched by the setting present?</text>
<rect x="170" y="55" width="139" height="40" rx="6" fill="#374151"/>
<text x="239.5" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb">zensical build</text>
<rect x="315" y="55" width="139" height="40" rx="6" fill="#374151"/>
<text x="384.5" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb">zensical serve</text>
<rect x="460" y="55" width="139" height="40" rx="6" fill="#374151"/>
<text x="529.5" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb">Automatic nav</text>
<rect x="605" y="55" width="139" height="40" rx="6" fill="#374151"/>
<text x="674.5" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9fafb">Search and sitemap</text>
<rect x="16" y="108" width="148" height="54" rx="6" fill="#4b5563"/>
<text x="90" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">exclude_docs</text>
<rect x="170" y="108" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="239.5" y="140" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="315" y="108" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="384.5" y="140" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="460" y="108" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="529.5" y="140" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="605" y="108" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="674.5" y="140" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="16" y="170" width="148" height="54" rx="6" fill="#4b5563"/>
<text x="90" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">draft_docs</text>
<rect x="170" y="170" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="239.5" y="202" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="315" y="170" width="139" height="54" rx="6" fill="#166534"/>
<text x="384.5" y="194" text-anchor="middle" font-size="13" fill="#f9fafb">yes, with</text>
<text x="384.5" y="211" text-anchor="middle" font-size="13" fill="#f9fafb">draft notice</text>
<rect x="460" y="170" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="529.5" y="202" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="605" y="170" width="139" height="54" rx="6" fill="#92400e"/>
<text x="674.5" y="194" text-anchor="middle" font-size="13" fill="#f9fafb">build: no</text>
<text x="674.5" y="211" text-anchor="middle" font-size="13" fill="#f9fafb">serve: yes</text>
<rect x="16" y="232" width="148" height="54" rx="6" fill="#4b5563"/>
<text x="90" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">not_in_nav</text>
<rect x="170" y="232" width="139" height="54" rx="6" fill="#166534"/>
<text x="239.5" y="264" text-anchor="middle" font-size="13" fill="#f9fafb">yes</text>
<rect x="315" y="232" width="139" height="54" rx="6" fill="#166534"/>
<text x="384.5" y="264" text-anchor="middle" font-size="13" fill="#f9fafb">yes</text>
<rect x="460" y="232" width="139" height="54" rx="6" fill="#7f1d1d"/>
<text x="529.5" y="264" text-anchor="middle" font-size="13" fill="#f9fafb">no</text>
<rect x="605" y="232" width="139" height="54" rx="6" fill="#166534"/>
<text x="674.5" y="264" text-anchor="middle" font-size="13" fill="#f9fafb">yes</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="#d1d5db">exclude_docs wins when a file also matches the other two settings</text>
</svg>