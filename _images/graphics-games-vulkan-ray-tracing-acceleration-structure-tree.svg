<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-rt-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Two levels: one TLAS of instances, several BLAS of geometry</text>
<rect x="250" y="50" width="260" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="74.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">TLAS (top level)</text>
<text x="380.0" y="90.2" text-anchor="middle" font-size="12" fill="#3730A3">one VkAccelerationStructureKHR</text>
<rect x="30" y="150" width="145" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="102.5" y="171.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Instance 0</text>
<text x="102.5" y="186.8" text-anchor="middle" font-size="11" fill="#92400E">shelf board</text>
<text x="102.5" y="201.8" text-anchor="middle" font-size="11" fill="#92400E">mask 0xFF, offset 0</text>
<line x1="380" y1="106" x2="102" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<rect x="215" y="150" width="145" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="287.5" y="171.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Instance 1</text>
<text x="287.5" y="186.8" text-anchor="middle" font-size="11" fill="#92400E">book A</text>
<text x="287.5" y="201.8" text-anchor="middle" font-size="11" fill="#92400E">mask 0xFF, offset 1</text>
<line x1="380" y1="106" x2="287" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<rect x="400" y="150" width="145" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="472.5" y="171.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Instance 2</text>
<text x="472.5" y="186.8" text-anchor="middle" font-size="11" fill="#92400E">book B</text>
<text x="472.5" y="201.8" text-anchor="middle" font-size="11" fill="#92400E">mask 0xFF, offset 1</text>
<line x1="380" y1="106" x2="472" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<rect x="585" y="150" width="145" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="657.5" y="171.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Instance 3</text>
<text x="657.5" y="186.8" text-anchor="middle" font-size="11" fill="#92400E">book C</text>
<text x="657.5" y="201.8" text-anchor="middle" font-size="11" fill="#92400E">mask 0x01, offset 1</text>
<line x1="380" y1="106" x2="657" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<rect x="100" y="300" width="230" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="215.0" y="329.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">BLAS: shelf</text>
<text x="215.0" y="345.2" text-anchor="middle" font-size="12" fill="#065F46">1 triangle geometry, 6 boards</text>
<rect x="430" y="300" width="230" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="545.0" y="329.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">BLAS: book</text>
<text x="545.0" y="345.2" text-anchor="middle" font-size="12" fill="#065F46">1 triangle geometry, 3 materials</text>
<line x1="102" y1="216" x2="215" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<line x1="287" y1="216" x2="490" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<line x1="472" y1="216" x2="545" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<line x1="657" y1="216" x2="600" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-tree)"/>
<text x="380" y="396" text-anchor="middle" font-size="11" fill="#374151">Instances 1, 2 and 3 share one BLAS and differ only in transform, mask and shader offset.</text>
<text x="380" y="414" text-anchor="middle" font-size="11" fill="#374151">Rays are traced against the TLAS; traversal descends into the BLAS that an instance references.</text>
