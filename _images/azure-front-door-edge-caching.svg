<svg viewBox="0 0 780 480" width="780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Front Door edge caching: cache hit vs. cache miss</text>

  <!-- Client -->
  <rect x="24" y="70" width="120" height="60" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="84" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#173d73">Client</text>
  <text x="84" y="112" text-anchor="middle" font-size="9.5" fill="#3c4043">browser / app</text>

  <!-- Edge POP -->
  <rect x="230" y="46" width="320" height="220" rx="10" fill="#f5f0fb" stroke="#6a3fa0" stroke-width="1.5"/>
  <text x="390" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a2378">Edge Point-of-Presence (POP)</text>
  <text x="390" y="84" text-anchor="middle" font-size="9.5" fill="#3c4043">nearest to the client, anycast routed</text>

  <rect x="252" y="98" width="276" height="60" rx="6" fill="#ffffff" stroke="#6a3fa0" stroke-width="1"/>
  <text x="390" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#4a2378">Cache store</text>
  <text x="390" y="137" text-anchor="middle" font-size="9.5" fill="#5f6368">keyed by request URL + cache-key query-string mode</text>
  <text x="390" y="151" text-anchor="middle" font-size="9.5" fill="#5f6368">TTL from Cache-Control / s-maxage / Expires (default 1-3 days)</text>

  <rect x="252" y="168" width="276" height="80" rx="6" fill="#fbe8cf" stroke="#c77c00" stroke-width="1"/>
  <text x="390" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a00">Route + rule set + WAF security policy</text>
  <text x="390" y="205" text-anchor="middle" font-size="9.5" fill="#5f6368">Route match, cache lookup, rules-engine overrides</text>
  <text x="390" y="220" text-anchor="middle" font-size="9.5" fill="#5f6368">(cache override, redirect, header rewrite), WAF evaluation</text>
  <text x="390" y="235" text-anchor="middle" font-size="9.5" fill="#5f6368">happen here before any origin round trip.</text>

  <!-- Origin -->
  <rect x="630" y="70" width="126" height="80" rx="8" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
  <text x="693" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#0d4c22">Origin</text>
  <text x="693" y="110" text-anchor="middle" font-size="9" fill="#3c4043">stbookshelf $web</text>
  <text x="693" y="123" text-anchor="middle" font-size="9" fill="#3c4043">(static site)</text>
  <text x="693" y="138" text-anchor="middle" font-size="9" fill="#3c4043">or catalog-api</text>

  <!-- Cache HIT path -->
  <path d="M144 90 L230 90" fill="none" stroke="#188038" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="187" y="82" text-anchor="middle" font-size="9.5" fill="#0d4c22">1. GET /catalog.json</text>

  <path d="M230 210 C170 250 170 300 144 320" fill="none" stroke="#188038" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="150" y="270" font-size="10" font-weight="700" fill="#0d4c22">2. Cache HIT</text>
  <text x="105" y="286" font-size="9" fill="#0d4c22">X-Cache: TCP_HIT</text>
  <text x="90" y="300" font-size="9" fill="#0d4c22">response served from the</text>
  <text x="90" y="312" font-size="9" fill="#0d4c22">edge POP -- no origin call</text>

  <rect x="24" y="330" width="180" height="46" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1"/>
  <text x="114" y="358" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d4c22">Client (cache hit)</text>

  <!-- Cache MISS path -->
  <path d="M528 190 L630 130" fill="none" stroke="#b3261e" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="600" y="150" text-anchor="middle" font-size="9.5" fill="#7a1a17">3. Cache MISS --</text>
  <text x="600" y="163" text-anchor="middle" font-size="9.5" fill="#7a1a17">forward to origin</text>

  <path d="M630 160 C560 220 460 260 390 260" fill="none" stroke="#b3261e" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="500" y="252" text-anchor="middle" font-size="9.5" fill="#7a1a17">4. Origin response</text>
  <text x="500" y="265" text-anchor="middle" font-size="9.5" fill="#7a1a17">stored per its cache headers</text>

  <path d="M340 266 C260 300 200 330 144 350" fill="none" stroke="#b3261e" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="255" y="336" text-anchor="middle" font-size="9.5" fill="#7a1a17">5. Response returned to client</text>
  <text x="255" y="349" text-anchor="middle" font-size="9.5" fill="#7a1a17">X-Cache: TCP_MISS (then TCP_HIT on reuse)</text>

  <rect x="24" y="390" width="600" height="66" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1"/>
  <text x="36" y="410" font-size="10.5" fill="#3c4043">Cache HIT: the edge POP answers directly from its cache store -- fastest path, zero origin load.</text>
  <text x="36" y="425" font-size="10.5" fill="#3c4043">Cache MISS: the POP forwards the request to the origin (subject to origin-group health probes and</text>
  <text x="36" y="440" font-size="10.5" fill="#3c4043">load balancing), caches a cacheable response per its TTL, then returns it to the client.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#188038"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b3261e"/>
    </marker>
  </defs>
</svg>
