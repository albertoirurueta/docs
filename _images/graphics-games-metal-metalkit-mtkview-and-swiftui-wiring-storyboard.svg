<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metalkit-mtkview-and-swiftui-wiring-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Wiring an MTKView into SwiftUI in five steps</text>
<rect x="20" y="50" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="143.0" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">App scene</text>
<text x="30" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">WindowGroup {</text>
<text x="30" y="115" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">  TriangleView()</text>
<text x="30" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">}</text>
<text x="30" y="149" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<text x="30" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">One view per window</text>
<rect x="265" y="50" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="281" cy="66" r="11" fill="#4F46E5"/>
<text x="281" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="388.0" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Representable</text>
<text x="275" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">struct TriangleView:</text>
<text x="275" y="115" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">  PlatformRepresentable</text>
<text x="275" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">makeCoordinator()</text>
<text x="275" y="149" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">makeUIView / makeNSView</text>
<rect x="510" y="50" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="526" cy="66" r="11" fill="#4F46E5"/>
<text x="526" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="633.0" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Coordinator</text>
<text x="520" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">final class Coordinator {</text>
<text x="520" y="115" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">  var renderer: ...</text>
<text x="520" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">}</text>
<text x="520" y="149" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Holds the renderer so</text>
<text x="520" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">the weak delegate lives</text>
<rect x="20" y="225" width="355" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="197.5" y="303.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="36" cy="241" r="11" fill="#4F46E5"/>
<text x="36" y="245" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="205.5" y="247" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">makeView configures the MTKView</text>
<text x="30" y="273" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">view.device = MTLCreateSystemDefaultDevice()</text>
<text x="30" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">view.colorPixelFormat = .bgra8Unorm</text>
<text x="30" y="307" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">view.depthStencilPixelFormat = .depth32Float</text>
<text x="30" y="324" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">renderer = makeRenderer(for: view)</text>
<text x="30" y="341" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">view.delegate = renderer</text>
<rect x="390" y="225" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="303.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="406" cy="241" r="11" fill="#4F46E5"/>
<text x="406" y="245" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="573.0" y="247" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">The view drives the loop</text>
<text x="400" y="273" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">isPaused = false, 60 times a second</text>
<text x="400" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">draw(in:) runs on the main thread</text>
<text x="400" y="307" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">renderer encodes and presents</text>
<text x="400" y="324" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">drawableSizeWillChange on resize</text>
</svg>
