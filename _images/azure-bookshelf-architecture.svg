<svg viewBox="0 0 900 850" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="850" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf: end-state architecture on AKS</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#5f6368">rg-bookshelf, region eastus2 (placeholder) -- schematic, not to scale. The earlier Container Apps stage
    (cae-bookshelf) is covered on the Container Apps pages.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Internet -->
  <ellipse cx="110" cy="92" rx="72" ry="27" fill="#e8eaed" stroke="#5f6368" stroke-width="1"/>
  <text x="110" y="88" text-anchor="middle" font-size="10.5" fill="#3c4043">Internet</text>
  <text x="110" y="101" text-anchor="middle" font-size="9" fill="#5f6368">users / browsers</text>

  <line x1="182" y1="92" x2="246" y2="92" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Front Door -->
  <rect x="250" y="64" width="240" height="56" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="370" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#173d73">afd-bookshelf</text>
  <text x="370" y="99" text-anchor="middle" font-size="9" fill="#3c4043">Azure Front Door -- WAF, TLS, edge caching</text>

  <!-- FD -> static site & FD -> APIM -->
  <line x1="300" y1="120" x2="170" y2="168" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="440" y1="120" x2="620" y2="168" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Static site / Blob -->
  <rect x="40" y="170" width="260" height="72" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="170" y="192" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d4c22">stbookshelf</text>
  <text x="170" y="208" text-anchor="middle" font-size="9" fill="#0d4c22">$web static website (SPA front end)</text>
  <text x="170" y="222" text-anchor="middle" font-size="9" fill="#0d4c22">+ Blob containers (cover images, invoices)</text>
  <text x="170" y="236" text-anchor="middle" font-size="8.5" fill="#5f6368">served straight from Front Door's origin cache</text>

  <!-- APIM -->
  <rect x="520" y="170" width="260" height="72" rx="7" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="650" y="192" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a4a00">apim-bookshelf</text>
  <text x="650" y="208" text-anchor="middle" font-size="9" fill="#7a4a00">API Management gateway</text>
  <text x="650" y="222" text-anchor="middle" font-size="9" fill="#7a4a00">JWT validation, rate limiting, versioning</text>
  <text x="650" y="236" text-anchor="middle" font-size="8.5" fill="#5f6368">fronts catalog-api and orders-api</text>

  <line x1="650" y1="242" x2="650" y2="300" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- VNet outer box -->
  <rect x="380" y="270" width="460" height="430" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="396" y="292" font-size="13" font-weight="700" fill="#173d73">vnet-bookshelf</text>
  <text x="396" y="307" font-size="9.5" fill="#3c4043">10.1.0.0/16 -- private endpoints, NSG-restricted subnets</text>

  <!-- AKS subnet -->
  <rect x="400" y="318" width="420" height="176" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="414" y="336" font-size="11" font-weight="700" fill="#0d4c22">snet-apps -- aks-bookshelf (AKS, Azure CNI Overlay)</text>

  <rect x="414" y="346" width="130" height="132" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="479" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">catalog-api</text>
  <text x="479" y="380" text-anchor="middle" font-size="8.5" fill="#3c4043">Deployment</text>
  <text x="479" y="393" text-anchor="middle" font-size="8.5" fill="#3c4043">+ HPA/KEDA</text>
  <text x="479" y="412" text-anchor="middle" font-size="8" fill="#5f6368">workload identity</text>
  <text x="479" y="424" text-anchor="middle" font-size="8" fill="#5f6368">reads pg-bookshelf</text>
  <text x="479" y="436" text-anchor="middle" font-size="8" fill="#5f6368">(catalog db)</text>

  <rect x="554" y="346" width="130" height="132" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="619" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">orders-api</text>
  <text x="619" y="380" text-anchor="middle" font-size="8.5" fill="#3c4043">Deployment</text>
  <text x="619" y="393" text-anchor="middle" font-size="8.5" fill="#3c4043">+ HPA/KEDA</text>
  <text x="619" y="412" text-anchor="middle" font-size="8" fill="#5f6368">reads/writes</text>
  <text x="619" y="424" text-anchor="middle" font-size="8" fill="#5f6368">docdb-bookshelf (orders),</text>
  <text x="619" y="436" text-anchor="middle" font-size="8" fill="#5f6368">redis-bookshelf cache</text>

  <rect x="694" y="346" width="110" height="132" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="749" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">notifier</text>
  <text x="749" y="380" text-anchor="middle" font-size="8.5" fill="#3c4043">CronJob</text>
  <text x="749" y="396" text-anchor="middle" font-size="8" fill="#5f6368">polls new orders,</text>
  <text x="749" y="408" text-anchor="middle" font-size="8" fill="#5f6368">sends confirmation</text>
  <text x="749" y="420" text-anchor="middle" font-size="8" fill="#5f6368">email via</text>
  <text x="749" y="432" text-anchor="middle" font-size="8" fill="#5f6368">acs-bookshelf</text>

  <text x="614" y="504" text-anchor="middle" font-size="8.5" fill="#5f6368">all three read secrets from kv-bookshelf and settings from appcs-bookshelf via workload identity</text>

  <!-- private endpoints subnet -->
  <rect x="400" y="512" width="420" height="168" rx="8" fill="#f4e8fd" stroke="#8430ce" stroke-width="1.2"/>
  <text x="414" y="530" font-size="11" font-weight="700" fill="#5a1a99">snet-data -- private endpoints (NSG denies internet inbound)</text>

  <rect x="410" y="542" width="76" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="448" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">PE</text>
  <text x="448" y="576" text-anchor="middle" font-size="8" fill="#3c4043">pg-bookshelf</text>
  <text x="448" y="588" text-anchor="middle" font-size="7.5" fill="#5f6368">PostgreSQL</text>
  <text x="448" y="599" text-anchor="middle" font-size="7.5" fill="#5f6368">flexible server</text>
  <text x="448" y="613" text-anchor="middle" font-size="7.5" fill="#5f6368">db: catalog</text>

  <rect x="494" y="542" width="76" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="532" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">PE</text>
  <text x="532" y="576" text-anchor="middle" font-size="8" fill="#3c4043">docdb-bookshelf</text>
  <text x="532" y="588" text-anchor="middle" font-size="7.5" fill="#5f6368">Azure DocumentDB</text>
  <text x="532" y="602" text-anchor="middle" font-size="7.5" fill="#5f6368">/ Cosmos cluster</text>
  <text x="532" y="616" text-anchor="middle" font-size="7.5" fill="#5f6368">db: orders</text>

  <rect x="578" y="542" width="76" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="616" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">PE</text>
  <text x="616" y="576" text-anchor="middle" font-size="8" fill="#3c4043">redis-bookshelf</text>
  <text x="616" y="590" text-anchor="middle" font-size="7.5" fill="#5f6368">Azure Managed</text>
  <text x="616" y="602" text-anchor="middle" font-size="7.5" fill="#5f6368">Redis</text>

  <rect x="662" y="542" width="76" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="700" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">PE</text>
  <text x="700" y="576" text-anchor="middle" font-size="8" fill="#3c4043">kv-bookshelf</text>
  <text x="700" y="590" text-anchor="middle" font-size="7.5" fill="#5f6368">Key Vault</text>
  <text x="700" y="602" text-anchor="middle" font-size="7.5" fill="#5f6368">secrets &amp; certs</text>

  <rect x="746" y="542" width="66" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="779" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#5a1a99">PE</text>
  <text x="779" y="576" text-anchor="middle" font-size="8" fill="#3c4043">appcs-bookshelf</text>
  <text x="779" y="590" text-anchor="middle" font-size="7.5" fill="#5f6368">App</text>
  <text x="779" y="602" text-anchor="middle" font-size="7.5" fill="#5f6368">Configuration</text>

  <!-- link between AKS boxes and PE boxes -->
  <line x1="479" y1="478" x2="448" y2="542" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="619" y1="478" x2="532" y2="542" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="619" y1="478" x2="616" y2="542" stroke="#188038" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- VPN gateway (admin path) -->
  <rect x="40" y="512" width="260" height="90" rx="8" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="170" y="534" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a00">vgw-bookshelf</text>
  <text x="170" y="550" text-anchor="middle" font-size="9" fill="#7a4a00">VPN Gateway (S2S / P2S)</text>
  <text x="170" y="564" text-anchor="middle" font-size="8.5" fill="#5f6368">admin/operator access into snet-data,</text>
  <text x="170" y="577" text-anchor="middle" font-size="8.5" fill="#5f6368">e.g. `psql` against pg-bookshelf</text>
  <text x="170" y="591" text-anchor="middle" font-size="8" fill="#5f6368">attached via GatewaySubnet in vnet-bookshelf</text>

  <line x1="300" y1="557" x2="400" y2="557" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Admin / on-prem -->
  <ellipse cx="170" cy="660" rx="120" ry="30" fill="#f1f3f4" stroke="#5f6368" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="170" y="656" text-anchor="middle" font-size="10" fill="#3c4043">Admin laptop / on-premises</text>
  <text x="170" y="670" text-anchor="middle" font-size="8.5" fill="#5f6368">S2S or P2S VPN client</text>

  <line x1="170" y1="630" x2="170" y2="602" stroke="#c77c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ACS -->
  <rect x="470" y="726" width="220" height="60" rx="8" fill="#e0f7fa" stroke="#00707f" stroke-width="1.2"/>
  <text x="580" y="748" text-anchor="middle" font-size="11" font-weight="700" fill="#00505c">acs-bookshelf</text>
  <text x="580" y="763" text-anchor="middle" font-size="9" fill="#00505c">Communication Services -- Email</text>
  <text x="580" y="777" text-anchor="middle" font-size="8.5" fill="#5f6368">order-confirmation messages sent by notifier</text>

  <line x1="749" y1="478" x2="749" y2="700" stroke="#00707f" stroke-width="1.4" stroke-dasharray="3,2"/>
  <line x1="749" y1="700" x2="600" y2="726" stroke="#00707f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Azure Monitor -->
  <rect x="40" y="800" width="820" height="42" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1"/>
  <text x="450" y="818" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3c4043">Azure Monitor, Log Analytics and Managed Grafana</text>
  <text x="450" y="833" text-anchor="middle" font-size="9" fill="#5f6368">metrics, logs and traces collected from Front Door, APIM, AKS, the databases, the VPN Gateway and Communication Services</text>

  <line x1="370" y1="120" x2="370" y2="800" stroke="#5f6368" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
</svg>
