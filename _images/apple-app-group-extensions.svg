<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">FieldNotes's processes and the shared App Group container</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Separate sandboxes, no direct calls: everything shared goes through group.com.example.fieldnotes</text>

  <defs>
    <marker id="ag-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Process boxes -->
  <rect x="20" y="72" width="170" height="130" rx="10" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="105" y="96" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">FieldNotes app</text>
  <text x="105" y="118" font-size="12" fill="#333333" text-anchor="middle">NoteStore (in memory)</text>
  <text x="105" y="136" font-size="12" fill="#333333" text-anchor="middle">OpenNoteIntent</text>
  <text x="105" y="154" font-size="12" fill="#333333" text-anchor="middle">CreateNoteIntent</text>
  <text x="105" y="172" font-size="12" fill="#333333" text-anchor="middle">IntentRouter</text>
  <text x="105" y="192" font-size="11" fill="#666666" text-anchor="middle">own sandbox</text>

  <rect x="206" y="72" width="170" height="130" rx="10" fill="#eef7ec" stroke="#3f7a3a" stroke-width="1.6"/>
  <text x="291" y="96" font-size="14" font-weight="bold" fill="#3f7a3a" text-anchor="middle">FieldNotesWidgets</text>
  <text x="291" y="118" font-size="12" fill="#333333" text-anchor="middle">PinnedNotesProvider</text>
  <text x="291" y="136" font-size="12" fill="#333333" text-anchor="middle">TogglePinIntent</text>
  <text x="291" y="154" font-size="12" fill="#333333" text-anchor="middle">QuickCaptureControl</text>
  <text x="291" y="172" font-size="12" fill="#333333" text-anchor="middle">PinnedNotesPushHandler</text>
  <text x="291" y="192" font-size="11" fill="#666666" text-anchor="middle">own sandbox, launched on demand</text>

  <rect x="392" y="72" width="170" height="130" rx="10" fill="#fdf1e6" stroke="#a15c1c" stroke-width="1.6"/>
  <text x="477" y="96" font-size="14" font-weight="bold" fill="#a15c1c" text-anchor="middle">Share extension</text>
  <text x="477" y="118" font-size="12" fill="#333333" text-anchor="middle">FieldNotesShareExtension</text>
  <text x="477" y="136" font-size="12" fill="#333333" text-anchor="middle">ShareViewController</text>
  <text x="477" y="154" font-size="12" fill="#333333" text-anchor="middle">ShareNoteForm</text>
  <text x="477" y="192" font-size="11" fill="#666666" text-anchor="middle">runs inside the share sheet</text>

  <rect x="578" y="72" width="162" height="130" rx="10" fill="#f5f2fa" stroke="#6b4a86" stroke-width="1.6"/>
  <text x="659" y="96" font-size="14" font-weight="bold" fill="#6b4a86" text-anchor="middle">Notification service</text>
  <text x="659" y="118" font-size="12" fill="#333333" text-anchor="middle">FieldNotes-</text>
  <text x="659" y="136" font-size="12" fill="#333333" text-anchor="middle">NotificationService</text>
  <text x="659" y="192" font-size="11" fill="#666666" text-anchor="middle">runs per push</text>

  <!-- "no direct calls" markers between boxes -->
  <text x="198" y="140" font-size="16" fill="#b03030" text-anchor="middle" font-weight="bold">×</text>
  <text x="384" y="140" font-size="16" fill="#b03030" text-anchor="middle" font-weight="bold">×</text>
  <text x="570" y="140" font-size="16" fill="#b03030" text-anchor="middle" font-weight="bold">×</text>

  <!-- Arrows to container -->
  <line x1="105" y1="204" x2="180" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#ag-arrow)"/>
  <line x1="291" y1="204" x2="316" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#ag-arrow)"/>
  <line x1="477" y1="204" x2="452" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#ag-arrow)"/>
  <line x1="659" y1="204" x2="590" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#ag-arrow)"/>
  <text x="120" y="258" font-size="11" fill="#555555">SharedNoteAccess</text>
  <text x="600" y="258" font-size="11" fill="#555555">fieldNotesShared</text>

  <!-- App Group container -->
  <rect x="120" y="294" width="520" height="104" rx="12" fill="#fbf8ef" stroke="#8a7a52" stroke-width="1.8"/>
  <text x="380" y="318" font-size="14" font-weight="bold" fill="#5c4f2c" text-anchor="middle">App Group container: group.com.example.fieldnotes</text>
  <rect x="140" y="330" width="240" height="54" rx="8" fill="#ffffff" stroke="#b9a877" stroke-width="1.2"/>
  <text x="260" y="352" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">SwiftData store</text>
  <text x="260" y="372" font-size="11" fill="#555555" text-anchor="middle">ModelContainer.fieldNotes() / NotePersisting</text>
  <rect x="396" y="330" width="224" height="54" rx="8" fill="#ffffff" stroke="#b9a877" stroke-width="1.2"/>
  <text x="508" y="352" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">UserDefaults.fieldNotesShared</text>
  <text x="508" y="372" font-size="11" fill="#555555" text-anchor="middle">push token, small settings</text>

  <text x="380" y="424" font-size="12" fill="#666666" text-anchor="middle">The app nudges the extensions only through the system: WidgetCenter and ControlCenter reloads.</text>
</svg>
