<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-resource-loading-and-streaming-heap-placement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Placement heap: resources alias the same memory over time</text>
<rect x="40" y="70" width="680" height="50" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="380" y="60" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MTLHeap (type .placement), one allocation</text>
<rect x="50" y="76" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="98.8" text-anchor="middle" font-size="11" fill="#3730A3">Texture A  offset 0</text>
<rect x="360" y="76" width="150" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="435.0" y="98.8" text-anchor="middle" font-size="11" fill="#92400E">Buffer B</text>
<rect x="520" y="76" width="190" height="38" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="615.0" y="98.8" text-anchor="middle" font-size="11" fill="#374151">free</text>
<text x="380" y="150" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Later in the frame (A is no longer needed):</text>
<rect x="40" y="160" width="680" height="50" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="50" y="166" width="200" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="150.0" y="188.8" text-anchor="middle" font-size="11" fill="#065F46">Texture C  offset 0</text>
<rect x="260" y="166" width="90" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="305.0" y="188.8" text-anchor="middle" font-size="11" fill="#065F46">Tex D</text>
<rect x="360" y="166" width="150" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="435.0" y="188.8" text-anchor="middle" font-size="11" fill="#92400E">Buffer B</text>
<rect x="520" y="166" width="190" height="38" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="615.0" y="188.8" text-anchor="middle" font-size="11" fill="#374151">free</text>
<line x1="200" y1="122" x2="200" y2="158" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-resource-loading-and-streaming-heap-placement)"/>
<rect x="40" y="236" width="680" height="56" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="260.9" text-anchor="middle" font-size="11" fill="#374151">C and D alias the bytes of A. Order the passes with fences or Metal 4 barriers,</text>
<text x="380.0" y="274.9" text-anchor="middle" font-size="11" fill="#374151">and call makeAliasable() on A before reusing its range.</text>
</svg>
