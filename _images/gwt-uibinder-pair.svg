<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" font-family="Helvetica, Arial, sans-serif">
  <title>A UiBinder owner class and its ui.xml template, and the BinderImpl class that the generator writes for the pair</title>
  <desc>The Java owner class BookCard declares a UiBinder interface and annotated fields. The template BookCard.ui.xml declares widgets with ui:field, resources with ui:with and ui:style, and plain HTML. At compile time the UiBinderGenerator reads both and writes BookCard_BinderImpl, which builds one HTML string with placeholder ids, creates the widgets, fills the owner fields and attaches the event handlers. In the browser createAndBindUi runs that generated code and returns the root widget.</desc>
  <rect x="0" y="0" width="960" height="612" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">One UiBinder pair: owner class + template, and what the generator writes</text>

  <rect x="20" y="56" width="360" height="190" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="34" y="78" font-size="14" font-weight="bold" fill="#1e3a8a">BookCard.java  (owner class, you write it)</text>
  <text x="34" y="102" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">Binder extends UiBinder&lt;Widget, BookCard&gt;</text>
  <text x="34" y="120" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiField(provided = true) Book book;</text>
  <circle cx="362" cy="116" r="8" fill="#1e293b"/><text x="362" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="34" y="138" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiField Style style;  // ui:style</text>
  <circle cx="362" cy="134" r="8" fill="#1e293b"/><text x="362" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="34" y="156" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiField RatingStars rating;</text>
  <circle cx="362" cy="152" r="8" fill="#1e293b"/><text x="362" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="34" y="174" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiField Button borrow;</text>
  <circle cx="362" cy="170" r="8" fill="#1e293b"/><text x="362" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="34" y="192" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiFactory ShelfBadge makeBadge()</text>
  <circle cx="362" cy="188" r="8" fill="#1e293b"/><text x="362" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="34" y="210" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">@UiHandler("borrow") void onClick(...)</text>
  <circle cx="362" cy="206" r="8" fill="#1e293b"/><text x="362" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="34" y="228" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1e3a8a" xml:space="preserve">initWidget(BINDER.createAndBindUi(this))</text>
  <rect x="20" y="276" width="360" height="190" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="298" font-size="14" font-weight="bold" fill="#78350f">BookCard.ui.xml  (template, you write it)</text>
  <text x="34" y="322" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">&lt;ui:with field="msg" type="BookMessages"/&gt;</text>
  <circle cx="362" cy="318" r="8" fill="#1e293b"/><text x="362" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="34" y="340" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">&lt;ui:with field="book" type="Book"/&gt;</text>
  <circle cx="362" cy="336" r="8" fill="#1e293b"/><text x="362" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="34" y="358" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">&lt;ui:style type="BookCard.Style"&gt;</text>
  <circle cx="362" cy="354" r="8" fill="#1e293b"/><text x="362" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="34" y="376" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">&lt;g:HTMLPanel styleName="{style.card}"&gt;</text>
  <text x="34" y="394" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">  &lt;b:RatingStars ui:field="rating" max="5"/&gt;</text>
  <circle cx="362" cy="390" r="8" fill="#1e293b"/><text x="362" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="34" y="412" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">  &lt;b:ShelfBadge ui:field="badge"/&gt;</text>
  <circle cx="362" cy="408" r="8" fill="#1e293b"/><text x="362" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="34" y="430" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">  &lt;g:Button ui:field="borrow"/&gt;</text>
  <circle cx="362" cy="426" r="8" fill="#1e293b"/><text x="362" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="34" y="448" font-size="11" font-family="Menlo, Consolas, monospace" fill="#78350f" xml:space="preserve">  &lt;span ui:field="copiesSpan"/&gt;</text>
  <circle cx="362" cy="444" r="8" fill="#1e293b"/><text x="362" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <rect x="600" y="56" width="340" height="190" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="614" y="78" font-size="14" font-weight="bold" fill="#14532d">BookCard_BinderImpl  (generated Java)</text>
  <text x="614" y="102" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">msg = GWT.create(BookMessages.class)</text>
  <circle cx="922" cy="98" r="8" fill="#1e293b"/><text x="922" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="614" y="120" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">book = owner.book  // provided</text>
  <circle cx="922" cy="116" r="8" fill="#1e293b"/><text x="922" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="614" y="138" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">style.ensureInjected(); owner.style = style</text>
  <circle cx="922" cy="134" r="8" fill="#1e293b"/><text x="922" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="614" y="156" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">new HTMLPanel(html1(ids).asString())</text>
  <text x="614" y="174" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">owner.rating = new RatingStars(5)</text>
  <circle cx="922" cy="170" r="8" fill="#1e293b"/><text x="922" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="614" y="192" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">badge = owner.makeBadge()</text>
  <circle cx="922" cy="188" r="8" fill="#1e293b"/><text x="922" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="614" y="210" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">borrow.addClickHandler(...onClick)</text>
  <circle cx="922" cy="206" r="8" fill="#1e293b"/><text x="922" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="614" y="228" font-size="11" font-family="Menlo, Consolas, monospace" fill="#14532d" xml:space="preserve">owner.copiesSpan = lookup(id)</text>
  <circle cx="922" cy="224" r="8" fill="#1e293b"/><text x="922" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <rect x="418" y="146" width="144" height="190" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="490" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">UiBinderGenerator</text>
  <text x="490" y="192" text-anchor="middle" font-size="12" fill="#312e81">runs at compile time</text>
  <text x="490" y="210" text-anchor="middle" font-size="12" fill="#312e81">when the compiler sees</text>
  <text x="490" y="228" text-anchor="middle" font-size="12" fill="#312e81">GWT.create(Binder.class)</text>
  <text x="490" y="254" text-anchor="middle" font-size="12" fill="#312e81">checks every field,</text>
  <text x="490" y="272" text-anchor="middle" font-size="12" fill="#312e81">handler, style and</text>
  <text x="490" y="290" text-anchor="middle" font-size="12" fill="#312e81">attribute against</text>
  <text x="490" y="308" text-anchor="middle" font-size="12" fill="#312e81">the Java types</text>

  <rect x="600" y="276" width="340" height="190" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="614" y="298" font-size="14" font-weight="bold" fill="#831843">Browser, run time</text>
  <text x="614" y="322" font-size="12" fill="#831843">createAndBindUi(this) executes the generated code:</text>
  <text x="614" y="346" font-size="12" fill="#831843">1. one innerHTML-style string builds the static markup</text>
  <text x="614" y="364" font-size="12" fill="#831843">2. placeholder spans are replaced by the widgets</text>
  <text x="614" y="382" font-size="12" fill="#831843">3. the owner fields are filled, handlers attached</text>
  <text x="614" y="400" font-size="12" fill="#831843">4. the root widget is returned to initWidget</text>
  <text x="614" y="428" font-size="12" fill="#831843">No XML is parsed and no reflection is used</text>
  <text x="614" y="446" font-size="12" fill="#831843">in the browser: everything was resolved above.</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M380 150 L418 200"/>
    <path d="M380 370 L418 290"/>
    <path d="M562 200 L600 150"/>
    <path d="M770 246 L770 276"/>
  </g>
  <text x="386" y="132" font-size="11" fill="#475569">Java types</text>
  <text x="386" y="398" font-size="11" fill="#475569">parsed XML</text>
  <text x="566" y="190" font-size="11" fill="#475569">writes</text>
  <text x="780" y="266" font-size="11" fill="#475569">compiled to JavaScript</text>

  <text x="20" y="500" font-size="13" font-weight="bold" fill="#0f172a">What each number ties together</text>
  <circle cx="28" cy="520" r="8" fill="#1e293b"/><text x="28" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="524" font-size="12" fill="#0f172a"><tspan font-weight="bold">ui:field in the template</tspan><tspan fill="#334155"> : @UiField on the owner: same name, assignable type, not private</tspan></text>
  <circle cx="28" cy="538" r="8" fill="#1e293b"/><text x="28" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="542" font-size="12" fill="#0f172a"><tspan font-weight="bold">ui:with and @UiField(provided = true)</tspan><tspan fill="#334155"> : a resource object the template can read ({msg.save}, {book.getTitle})</tspan></text>
  <circle cx="28" cy="556" r="8" fill="#1e293b"/><text x="28" y="560" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="560" font-size="12" fill="#0f172a"><tspan font-weight="bold">ui:style</tspan><tspan fill="#334155"> : a CssResource interface plus the generated, obfuscated class names</tspan></text>
  <circle cx="28" cy="574" r="8" fill="#1e293b"/><text x="28" y="578" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="44" y="578" font-size="12" fill="#0f172a"><tspan font-weight="bold">@UiHandler("borrow")</tspan><tspan fill="#334155"> : an addClickHandler call on the widget with that ui:field</tspan></text>
  <circle cx="28" cy="592" r="8" fill="#1e293b"/><text x="28" y="596" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="44" y="596" font-size="12" fill="#0f172a"><tspan font-weight="bold">@UiFactory and @UiConstructor</tspan><tspan fill="#334155"> : how a widget without a zero-argument constructor is built</tspan></text>
</svg>
