<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a layout, partials and the UI model produce a page</title>
  <desc id="d">The UI model and the converted page contents feed a layout, which pulls in partials such as head, header, body and footer, and the result is one HTML page.</desc>
  <rect width="760" height="420" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">Inputs from Antora</text>
  <text x="280" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">UI bundle templates</text>
  <text x="600" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">Output</text>

  <rect x="20" y="42" width="200" height="150" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="64" font-size="13" font-weight="bold" fill="#f9fafb">UI model</text>
  <text x="32" y="86" font-size="12" fill="#d1d5db">site, page, env</text>
  <text x="32" y="106" font-size="12" fill="#d1d5db">uiRootPath, siteRootPath</text>
  <text x="32" y="126" font-size="12" fill="#d1d5db">antoraVersion</text>
  <text x="32" y="146" font-size="12" fill="#d1d5db">contentCatalog (helpers only)</text>
  <text x="32" y="172" font-size="12" fill="#d1d5db">page.attributes from page-* keys</text>

  <rect x="20" y="212" width="200" height="70" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="234" font-size="13" font-weight="bold" fill="#f9fafb">page.contents</text>
  <text x="32" y="256" font-size="12" fill="#d1d5db">HTML from the AsciiDoc page</text>

  <rect x="20" y="302" width="200" height="70" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="324" font-size="13" font-weight="bold" fill="#f9fafb">page.layout</text>
  <text x="32" y="346" font-size="12" fill="#d1d5db">page-layout or default_layout</text>

  <rect x="270" y="42" width="190" height="60" rx="8" fill="#2563eb"/>
  <text x="282" y="68" font-size="13" font-weight="bold" fill="#ffffff">layouts/default.hbs</text>
  <text x="282" y="88" font-size="12" fill="#e0e7ff">chosen by page.layout</text>

  <rect x="270" y="116" width="190" height="34" rx="6" fill="#7c3aed"/>
  <text x="282" y="138" font-size="12" fill="#ffffff">partials/head.hbs</text>
  <rect x="270" y="158" width="190" height="34" rx="6" fill="#7c3aed"/>
  <text x="282" y="180" font-size="12" fill="#ffffff">partials/header.hbs</text>
  <rect x="270" y="200" width="190" height="34" rx="6" fill="#7c3aed"/>
  <text x="282" y="222" font-size="12" fill="#ffffff">partials/body.hbs (nav, main)</text>
  <rect x="270" y="242" width="190" height="34" rx="6" fill="#7c3aed"/>
  <text x="282" y="264" font-size="12" fill="#ffffff">partials/footer.hbs</text>

  <rect x="270" y="304" width="190" height="60" rx="8" fill="#b45309"/>
  <text x="282" y="330" font-size="13" font-weight="bold" fill="#ffffff">layouts/404.hbs</text>
  <text x="282" y="350" font-size="12" fill="#fff7ed">used when site.url is set</text>

  <rect x="560" y="120" width="180" height="110" rx="8" fill="#047857"/>
  <text x="574" y="148" font-size="13" font-weight="bold" fill="#ffffff">Published page</text>
  <text x="574" y="170" font-size="12" fill="#d1fae5">demo/convert.html</text>
  <text x="574" y="190" font-size="12" fill="#d1fae5">one standalone HTML file</text>
  <text x="574" y="210" font-size="12" fill="#d1fae5">per page, layout applied</text>

  <path d="M220,100 L268,72" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M220,247 L268,80" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M220,337 L268,84" stroke="#e5e7eb" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M462,72 L520,72 L520,160 L558,160" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M365,102 L365,114" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M462,334 L520,334 L520,200 L558,200" stroke="#e5e7eb" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
