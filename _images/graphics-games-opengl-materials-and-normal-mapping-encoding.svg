<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah2-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How a normal map stores directions as colours</text>
<rect x="30" y="60" width="158" height="96" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="44" y="74" width="130" height="38" rx="6" fill="#8080FF" stroke="#4B5563" stroke-width="1"/>
<text x="109" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texel (0.5, 0.5, 1.0)</text>
<text x="109" y="148" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal (0, 0, 1)</text>
<text x="109" y="176" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">flat: no change</text>
<rect x="208" y="60" width="158" height="96" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="222" y="74" width="130" height="38" rx="6" fill="#FF8080" stroke="#4B5563" stroke-width="1"/>
<text x="287" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texel (1.0, 0.5, 0.5)</text>
<text x="287" y="148" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal (1, 0, 0)</text>
<text x="287" y="176" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">leans toward +T (right)</text>
<rect x="386" y="60" width="158" height="96" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="400" y="74" width="130" height="38" rx="6" fill="#80FF80" stroke="#4B5563" stroke-width="1"/>
<text x="465" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texel (0.5, 1.0, 0.5)</text>
<text x="465" y="148" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal (0, 1, 0)</text>
<text x="465" y="176" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">leans toward +B (up, OpenGL)</text>
<rect x="564" y="60" width="158" height="96" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="578" y="74" width="130" height="38" rx="6" fill="#8040C0" stroke="#4B5563" stroke-width="1"/>
<text x="643" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texel (0.5, 0.25, 0.9)</text>
<text x="643" y="148" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal (0, -0.5, 0.8)</text>
<text x="643" y="176" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">leans toward -B (down)</text>
<rect x="30" y="200" width="700" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="226" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">decode: n = normalize(texture(normalMap, uv).rgb * 2.0 - 1.0)</text>
<text x="380" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The map must be sampled from a linear (not sRGB) texture; a flat region is (0.5, 0.5, 1.0), which is why normal maps look blue.</text>
<text x="380" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">OpenGL and glTF use green as +Y (up); some DirectX tools bake green inverted, so flip the channel when bumps look dented.</text>
</svg>
