<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
  <title id="t">Three layers of parallelism in scikit-learn</title>
  <desc id="d">Three stacked layers: joblib workers controlled by n_jobs, OpenMP threads in scikit-learn's compiled code controlled by OMP_NUM_THREADS or threadpoolctl, and BLAS threads in NumPy and SciPy controlled by OPENBLAS_NUM_THREADS, MKL_NUM_THREADS or BLIS_NUM_THREADS. An example shows eight joblib workers each starting eight OpenMP threads, giving 64 threads on eight cores.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="468" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
    <text x="24" y="34" font-size="20" font-weight="bold">Where scikit-learn runs work in parallel</text>

    <g stroke-width="2">
      <rect x="30" y="56" width="390" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
      <rect x="30" y="156" width="390" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
      <rect x="30" y="256" width="390" height="70" rx="6" fill="#FEF3C7" stroke="#B45309"/>
    </g>
    <g font-size="16" font-weight="bold">
      <text x="46" y="84">1. joblib: processes or threads</text>
      <text x="46" y="184">2. OpenMP: threads in compiled code</text>
      <text x="46" y="284">3. BLAS and LAPACK: threads in NumPy/SciPy</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="46" y="106">GridSearchCV, cross_val_score, RandomForest, ...</text>
      <text x="46" y="206">HistGradientBoosting, KMeans, nearest neighbors, ...</text>
      <text x="46" y="306">OpenBLAS, MKL, BLIS, Accelerate: dot products, SVD</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
      <line x1="225" y1="126" x2="225" y2="152"/>
      <line x1="225" y1="226" x2="225" y2="252"/>
    </g>

    <!-- controls -->
    <g stroke="#6D28D9" stroke-width="2" fill="#EDE9FE">
      <rect x="450" y="56" width="240" height="70" rx="6"/>
      <rect x="450" y="156" width="240" height="70" rx="6"/>
      <rect x="450" y="256" width="240" height="70" rx="6"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold">
      <text x="466" y="86">n_jobs=</text>
      <text x="466" y="186">OMP_NUM_THREADS</text>
      <text x="466" y="276">OPENBLAS_NUM_THREADS</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="466" y="106">joblib.parallel_config(...)</text>
      <text x="466" y="206">threadpool_limits(limits=...)</text>
      <text x="466" y="296">MKL_ / BLIS_NUM_THREADS</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
      <line x1="446" y1="91" x2="424" y2="91"/>
      <line x1="446" y1="191" x2="424" y2="191"/>
      <line x1="446" y1="291" x2="424" y2="291"/>
    </g>

    <!-- oversubscription -->
    <rect x="30" y="354" width="660" height="92" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
    <text x="46" y="380" font-size="16" font-weight="bold">Oversubscription on an 8-core machine</text>
    <g fill="#BE123C" stroke="none">
      <rect x="46" y="392" width="22" height="22" rx="3"/><rect x="74" y="392" width="22" height="22" rx="3"/>
      <rect x="102" y="392" width="22" height="22" rx="3"/><rect x="130" y="392" width="22" height="22" rx="3"/>
      <rect x="158" y="392" width="22" height="22" rx="3"/><rect x="186" y="392" width="22" height="22" rx="3"/>
      <rect x="214" y="392" width="22" height="22" rx="3"/><rect x="242" y="392" width="22" height="22" rx="3"/>
    </g>
    <text x="278" y="409" font-size="14">8 workers, each starting 8 threads = 64 threads on 8 cores</text>
    <text x="46" y="436" font-size="12" fill="#475569">joblib's loky backend limits each worker to cpu_count // n_jobs threads unless you set the variables yourself.</text>
  </g>
</svg>
