<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-lighting-in-shaders-nlvh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The vectors of one lighting sample (all unit length)</text>
<line x1="120" y1="280" x2="640" y2="280" stroke="#4B5563" stroke-width="3"/>
<circle cx="380" cy="280" r="5" fill="#1F2937"/>
<text x="380" y="302" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">surface point P</text>
<line x1="380" y1="280" x2="380.0" y2="90.0" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-webgl-lighting-in-shaders-nlvh)"/>
<text x="380.0" y="82.0" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">N</text>
<line x1="380" y1="280" x2="271.0204770933012" y2="124.36111158509158" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-webgl-lighting-in-shaders-nlvh)"/>
<text x="261.0204770933012" y="118.36111158509158" font-size="13" font-weight="bold" fill="#92400E" text-anchor="end">L</text>
<line x1="380" y1="280" x2="552.1984795369635" y2="199.7025302692671" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-webgl-lighting-in-shaders-nlvh)"/>
<text x="562.1984795369635" y="193.7025302692671" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">V</text>
<line x1="380" y1="280" x2="421.4110472164033" y2="125.45186779374907" stroke="#3730A3" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#ah-webgl-lighting-in-shaders-nlvh)"/>
<text x="429.4110472164033" y="119.45186779374907" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">H</text>
<line x1="380" y1="280" x2="448.8291723621255" y2="181.701754685321" stroke="#4B5563" stroke-width="2.5" stroke-dasharray="2 3" marker-end="url(#ah-webgl-lighting-in-shaders-nlvh)"/>
<text x="462.8291723621255" y="195.701754685321" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="start">R</text>
<text x="20" y="70" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">N  surface normal</text>
<text x="20" y="88" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">L  to the light</text>
<text x="20" y="106" font-size="12" font-weight="bold" fill="#047857" text-anchor="start">V  to the eye (camera)</text>
<text x="20" y="124" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">H  half vector = normalize(L + V)</text>
<text x="20" y="142" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">R  reflect(-L, N)</text>
<text x="640" y="70" font-size="12" font-weight="normal" fill="#374151" text-anchor="end">diffuse  = max(N.L, 0)</text>
<text x="640" y="88" font-size="12" font-weight="normal" fill="#374151" text-anchor="end">Phong    = max(R.V, 0)^s</text>
<text x="640" y="106" font-size="12" font-weight="normal" fill="#374151" text-anchor="end">Blinn    = max(N.H, 0)^s</text>
<text x="380" y="336" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">All vectors point away from P and are computed in the same space (world or view).</text>
</svg>
