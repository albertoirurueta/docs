<circle cx="36.0" cy="62" r="11" fill="#4F46E5"/>
<text x="36.0" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="95.2" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Unity Hub</text>
<rect x="28.0" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="87.2" y="99.5" text-anchor="middle" font-size="10" fill="#374151">New project</text>
<rect x="28.0" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="87.2" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">Universal 3D</text>
<rect x="28.0" y="144" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="87.2" y="159.5" text-anchor="middle" font-size="10" fill="#374151">Project name: Bookshelf</text>
<rect x="28.0" y="174" width="118.4" height="24" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
