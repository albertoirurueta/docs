<text x="380.0" y="189.5" text-anchor="middle" font-size="10" fill="#3730A3">URP asset</text>
<text x="380.0" y="222" text-anchor="middle" font-size="11" fill="#374151">Which asset runs</text>
<text x="380.0" y="236" text-anchor="middle" font-size="11" fill="#374151">when nothing overrides</text>
<rect x="459.2" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="475.2" cy="62" r="11" fill="#4F46E5"/>
<text x="475.2" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="534.4" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Quality</text>
<rect x="467.2" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="526.4" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Level: Low</text>
<rect x="467.2" y="114" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="526.4" y="129.5" text-anchor="middle" font-size="10" fill="#374151">Level: Medium</text>
<rect x="467.2" y="144" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="526.4" y="159.5" text-anchor="middle" font-size="10" fill="#374151">Level: High</text>
<rect x="467.2" y="174" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="526.4" y="189.5" text-anchor="middle" font-size="10" fill="#3730A3">Render Pipeline Asset</text>
<text x="526.4" y="222" text-anchor="middle" font-size="11" fill="#374151">Each level can use</text>
<text x="526.4" y="236" text-anchor="middle" font-size="11" fill="#374151">its own URP asset</text>
<rect x="605.6" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="621.6" cy="62" r="11" fill="#B45309"/>
<text x="621.6" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="680.8" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Renderer</text>
<rect x="613.6" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="672.8000000000001" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Rendering</text>
<rect x="613.6" y="114" width="118.4" height="24" rx="5" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="672.8000000000001" y="129.5" text-anchor="middle" font-size="10" fill="#92400E">Rendering Path</text>
<rect x="613.6" y="144" width="118.4" height="24" rx="5" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="672.8000000000001" y="159.5" text-anchor="middle" font-size="10" fill="#92400E">Forward+</text>
<rect x="613.6" y="174" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="672.8000000000001" y="189.5" text-anchor="middle" font-size="10" fill="#374151">Renderer Features</text>
<text x="672.8" y="222" text-anchor="middle" font-size="11" fill="#374151">Pick the path; add</text>
<text x="672.8" y="236" text-anchor="middle" font-size="11" fill="#374151">features here</text>
<rect x="20" y="258" width="720" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="280.9" text-anchor="middle" font-size="11" fill="#374151">Create a URP asset yourself with Assets &gt; Create &gt; Rendering &gt; URP Asset (with Universal Renderer),</text>
<text x="380.0" y="294.9" text-anchor="middle" font-size="11" fill="#374151">then assign it under Graphics and, optionally, per level under Quality.</text>
