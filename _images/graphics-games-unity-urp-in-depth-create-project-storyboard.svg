<rect x="320.8" y="144" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="380.0" y="159.5" text-anchor="middle" font-size="10" fill="#374151">Pipeline asset:</text>
