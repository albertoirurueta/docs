<text x="87.2" y="236" text-anchor="middle" font-size="11" fill="#374151">and configures URP</text>
<rect x="166.4" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182.4" cy="62" r="11" fill="#4F46E5"/>
<text x="182.4" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="241.6" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Project window</text>
<rect x="174.4" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="233.60000000000002" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Assets</text>
<rect x="174.4" y="114" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="233.60000000000002" y="129.5" text-anchor="middle" font-size="10" fill="#3730A3">Settings</text>
<rect x="174.4" y="144" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="233.60000000000002" y="159.5" text-anchor="middle" font-size="10" fill="#3730A3">  URP asset</text>
<rect x="174.4" y="174" width="118.4" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="233.60000000000002" y="189.5" text-anchor="middle" font-size="10" fill="#3730A3">  Universal Renderer</text>
<text x="233.6" y="222" text-anchor="middle" font-size="11" fill="#374151">Template ships URP</text>
<text x="233.6" y="236" text-anchor="middle" font-size="11" fill="#374151">assets here</text>
<rect x="312.8" y="46" width="134.4" height="160" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328.8" cy="62" r="11" fill="#4F46E5"/>
<text x="328.8" y="66.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="388.0" y="67" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Project Settings</text>
<rect x="320.8" y="84" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="380.0" y="99.5" text-anchor="middle" font-size="10" fill="#374151">Graphics</text>
<rect x="320.8" y="114" width="118.4" height="24" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
