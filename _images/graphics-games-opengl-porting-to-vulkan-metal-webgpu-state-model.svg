<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-graphics-games-opengl-porting-to-vulkan-" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Global state machine versus objects and recorded commands</text>
<text x="190" y="56" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenGL: one context, implicit state</text>
<text x="570" y="56" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Vulkan, Metal, WebGPU: explicit objects</text>
<rect x="20" y="70" width="340" height="290" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="400" y="70" width="340" height="290" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="40" y="90" width="300" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="109.5" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Current context</text>
<text x="190.0" y="124.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">bound program, VAO, FBO, textures,</text>
<text x="190.0" y="139.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">blend, depth, cull, viewport</text>
<rect x="40" y="180" width="300" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="205.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">glDraw*(...)</text>
<rect x="40" y="250" width="300" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="277.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Driver validates and compiles lazily</text>
<text x="190.0" y="292.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(hidden shader variants, stalls)</text>
<line x1="190" y1="150" x2="190" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<line x1="190" y1="220" x2="190" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<text x="190" y="336" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cheap to write, hard to predict: cost hides in the driver.</text>
<rect x="420" y="90" width="140" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="490.0" y="109.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Pipeline object</text>
<text x="490.0" y="124.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shaders + fixed state</text>
<text x="490.0" y="139.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">built ahead of time</text>
<rect x="580" y="90" width="140" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="109.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Bind group / set</text>
<text x="650.0" y="124.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">buffers, textures,</text>
<text x="650.0" y="139.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">samplers</text>
<rect x="420" y="180" width="300" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="204.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Command buffer or encoder: set pipeline, set groups, draw</text>
<rect x="420" y="250" width="300" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="274.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Queue submit (one call, many commands)</text>
<line x1="490" y1="150" x2="520" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<line x1="650" y1="150" x2="620" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<line x1="570" y1="220" x2="570" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<text x="570" y="336" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Validation moves to creation time; recording is cheap and parallel.</text>
</svg>
