<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Training memory per parameter</title>
  <desc id="d">Three horizontal stacked bars show bytes per parameter for weights, gradients, a master copy and Adam moment estimates: 16 bytes in FP32, 16 bytes with FP16 mixed precision and an FP32 master copy, and 8 bytes when everything including the optimiser state is BF16. Activations are extra and are not drawn.</desc>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">Bytes per parameter during training</text>
  <text x="360" y="56" font-size="12" text-anchor="middle" fill="#475569">w = weights, g = gradients, m+v = Adam first and second moments (activations not included)</text>
  
<text x="24" y="102" font-size="13" font-weight="bold" fill="#0F172A">A. FP32 + Adam</text>
  <rect x="190" y="80" width="120" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="250.0" y="102" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">w 4</text>
  <rect x="310" y="80" width="120" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="370.0" y="102" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">g 4</text>
  <rect x="430" y="80" width="240" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="550.0" y="102" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">m+v 8</text>
  <text x="678" y="102" font-size="13" font-weight="bold" fill="#0F172A">16 B</text>  <text x="24" y="162" font-size="13" font-weight="bold" fill="#0F172A">B. FP16 mixed</text>
  <rect x="190" y="140" width="60" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="220.0" y="162" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">w2</text>
  <rect x="250" y="140" width="60" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="280.0" y="162" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">g2</text>
  <rect x="310" y="140" width="120" height="34" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="370.0" y="162" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">master 4</text>
  <rect x="430" y="140" width="240" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="550.0" y="162" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">m+v 8</text>
  <text x="678" y="162" font-size="13" font-weight="bold" fill="#0F172A">16 B</text>  <text x="24" y="222" font-size="13" font-weight="bold" fill="#0F172A">C. all BF16</text>
  <rect x="190" y="200" width="60" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="220.0" y="222" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">w2</text>
  <rect x="250" y="200" width="60" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="280.0" y="222" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">g2</text>
  <rect x="310" y="200" width="120" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="370.0" y="222" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">m+v 4</text>
  <text x="438" y="222" font-size="13" font-weight="bold" fill="#0F172A">8 B</text>
  <line x1="190" y1="260" x2="670" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="190" y="280" font-size="12" fill="#475569">0 B</text>
  <text x="430" y="280" font-size="12" text-anchor="middle" fill="#475569">8 B</text>
  <text x="670" y="280" font-size="12" text-anchor="end" fill="#475569">16 B</text>
  <text x="360" y="310" font-size="12" text-anchor="middle" fill="#475569">Mixed precision saves activation memory and time; it does not shrink the state unless the master copy and moments shrink too.</text>
</svg>
