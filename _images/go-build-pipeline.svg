<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From Go source to a single binary: go build</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">each package is compiled once, in dependency order, and cached; the linker then joins every package archive and the runtime</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
  </defs>

  <text x="24" y="80" font-size="13" font-weight="bold" fill="#1c4b73">1. Compile (go tool compile), once per package</text>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="94" width="130" height="78" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="89" y="118" font-weight="bold">Source</text>
    <text x="89" y="136" font-size="11">.go files, build tags</text>
    <text x="89" y="151" font-size="11">go.mod, embed files</text>

    <rect x="176" y="94" width="130" height="78" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="241" y="118" font-weight="bold">Parse</text>
    <text x="241" y="136" font-size="11">tokens, semicolon</text>
    <text x="241" y="151" font-size="11">insertion, syntax tree</text>

    <rect x="328" y="94" width="130" height="78" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="393" y="118" font-weight="bold">Type-check</text>
    <text x="393" y="136" font-size="11">types, constants,</text>
    <text x="393" y="151" font-size="11">unused imports and vars</text>

    <rect x="480" y="94" width="130" height="78" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="545" y="118" font-weight="bold">Optimize</text>
    <text x="545" y="136" font-size="11">inlining, escape</text>
    <text x="545" y="151" font-size="11">analysis, devirtualize</text>

    <rect x="632" y="94" width="130" height="78" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="697" y="118" font-weight="bold">SSA and codegen</text>
    <text x="697" y="136" font-size="11">SSA passes, register</text>
    <text x="697" y="151" font-size="11">allocation, assembler</text>

    <rect x="784" y="94" width="152" height="78" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="860" y="118" font-weight="bold">Package archive</text>
    <text x="860" y="136" font-size="11">object code + export</text>
    <text x="860" y="151" font-size="11">data, stored in cache</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="154" y1="133" x2="174" y2="133"/>
    <line x1="306" y1="133" x2="326" y2="133"/>
    <line x1="458" y1="133" x2="478" y2="133"/>
    <line x1="610" y1="133" x2="630" y2="133"/>
    <line x1="762" y1="133" x2="782" y2="133"/>
  </g>

  <!-- tools lane -->
  <g stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#d)">
    <line x1="89" y1="212" x2="89" y2="174"/>
    <line x1="393" y1="212" x2="393" y2="174"/>
    <line x1="860" y1="212" x2="860" y2="174"/>
  </g>
  <g font-size="12" fill="#333333" text-anchor="middle">
    <rect x="24" y="214" width="190" height="64" fill="#fff8e1" stroke="#b28704"/>
    <text x="119" y="234" font-weight="bold">gofmt / go fmt</text>
    <text x="119" y="251" font-size="11">rewrites the source layout;</text>
    <text x="119" y="265" font-size="11">meaning never changes</text>

    <rect x="290" y="214" width="260" height="64" fill="#fff8e1" stroke="#b28704"/>
    <text x="420" y="234" font-weight="bold">go vet</text>
    <text x="420" y="251" font-size="11">type-checks, then runs analyzers (printf,</text>
    <text x="420" y="265" font-size="11">copylocks, ...); generates no code</text>

    <rect x="700" y="214" width="236" height="64" fill="#fff8e1" stroke="#b28704"/>
    <text x="818" y="234" font-weight="bold">Build cache (GOCACHE)</text>
    <text x="818" y="251" font-size="11">keyed by a hash of the inputs; shared</text>
    <text x="818" y="265" font-size="11">by build, run, test and vet</text>
  </g>

  <text x="24" y="328" font-size="13" font-weight="bold" fill="#1c4b73">2. Link, once per executable</text>

  <path d="M818,280 L818,300 L225,300 L225,336" fill="none" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="520" y="294" font-size="11" fill="#2e7d32" text-anchor="middle">archives are read back from the cache</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="338" width="210" height="84" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="129" y="362" font-weight="bold">Package archives</text>
    <text x="129" y="380" font-size="11">your packages, imported modules,</text>
    <text x="129" y="395" font-size="11">the standard library</text>
    <text x="129" y="410" font-size="11">as compiled earlier</text>

    <rect x="276" y="338" width="190" height="84" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="371" y="362" font-weight="bold">The runtime</text>
    <text x="371" y="380" font-size="11">scheduler, garbage collector,</text>
    <text x="371" y="395" font-size="11">allocator: compiled in, not a</text>
    <text x="371" y="410" font-size="11">separate virtual machine</text>

    <rect x="508" y="338" width="210" height="84" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="613" y="362" font-weight="bold">Linker</text>
    <text x="613" y="380" font-size="11">resolves symbols, drops unreachable</text>
    <text x="613" y="395" font-size="11">functions, lays out sections,</text>
    <text x="613" y="410" font-size="11">adds build info and debug data</text>

    <rect x="760" y="338" width="176" height="84" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="848" y="362" font-weight="bold">Executable</text>
    <text x="848" y="380" font-size="11">one self-contained file,</text>
    <text x="848" y="395" font-size="11">no interpreter or VM needed</text>
    <text x="848" y="410" font-size="11">to run it</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="234" y1="380" x2="274" y2="380"/>
    <line x1="466" y1="380" x2="506" y2="380"/>
    <line x1="718" y1="380" x2="758" y2="380"/>
  </g>

  <text x="480" y="452" font-size="12" fill="#444444" text-anchor="middle">go build keeps the executable; go run builds it in a temporary directory, runs it and deletes it; go install copies it to GOBIN</text>
  <text x="480" y="470" font-size="12" fill="#444444" text-anchor="middle">cgo adds a C compiler step per package that imports "C"; cross-compiling only changes GOOS and GOARCH, not the pipeline</text>
  <text x="480" y="490" font-size="11" fill="#666666" text-anchor="middle">only packages whose inputs changed are recompiled; everything else is read back from the cache</text>
</svg>
