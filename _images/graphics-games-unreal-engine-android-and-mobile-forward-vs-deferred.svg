<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Mobile renderer: forward and multi-pass deferred</text>
<rect x="18" y="48" width="354" height="372" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Mobile Forward</text>
<rect x="388" y="48" width="354" height="372" rx="12" fill="#F9FAFB" stroke="#B45309" stroke-width="2"/>
<text x="565" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Mobile Deferred (default in 5.8)</text>
<rect x="40" y="92" width="310" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="110.7" text-anchor="middle" font-size="12" fill="#3730A3">Per mesh: material and lights shaded</text>
<text x="195.0" y="125.7" text-anchor="middle" font-size="12" fill="#3730A3">in a single pass</text>
<line x1="195" y1="136" x2="195" y2="156" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="40" y="156" width="310" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="178.2" text-anchor="middle" font-size="12" fill="#3730A3">Lit colour written to the frame</text>
<text x="195" y="218" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Strengths</text>
<text x="195" y="236" text-anchor="middle" font-size="12" fill="#374151">Cheap for few lights and static lighting</text>
<text x="195" y="252" text-anchor="middle" font-size="12" fill="#374151">MSAA available</text>
<text x="195" y="268" text-anchor="middle" font-size="12" fill="#374151">Preferred for baked lighting and many</text>
<text x="195" y="284" text-anchor="middle" font-size="12" fill="#374151">reflection captures</text>
<text x="195" y="318" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Limits</text>
<text x="195" y="336" text-anchor="middle" font-size="12" fill="#374151">Few dynamic lights per object</text>
<text x="195" y="352" text-anchor="middle" font-size="12" fill="#374151">Lit decals and light functions are limited</text>
<rect x="410" y="92" width="310" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="110.7" text-anchor="middle" font-size="12" fill="#92400E">Pass 1: GBuffer written to</text>
<text x="565.0" y="125.7" text-anchor="middle" font-size="12" fill="#92400E">on-chip tile memory</text>
<line x1="565" y1="136" x2="565" y2="156" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="410" y="156" width="310" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="174.7" text-anchor="middle" font-size="12" fill="#92400E">Pass 2: lighting reads GBuffer</text>
<text x="565.0" y="189.7" text-anchor="middle" font-size="12" fill="#92400E">as input attachments</text>
<text x="565" y="226" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Adds</text>
<text x="565" y="244" text-anchor="middle" font-size="12" fill="#374151">Light functions and IES profiles</text>
<text x="565" y="260" text-anchor="middle" font-size="12" fill="#374151">Lit decals</text>
<text x="565" y="276" text-anchor="middle" font-size="12" fill="#374151">More efficient local lights</text>
<text x="565" y="306" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Limits</text>
<text x="565" y="324" text-anchor="middle" font-size="12" fill="#374151">No MSAA</text>
<text x="565" y="340" text-anchor="middle" font-size="12" fill="#374151">Translucency always shaded forward</text>
<text x="565" y="356" text-anchor="middle" font-size="12" fill="#374151">DefaultLit and Unlit only with precomputed light</text>
<text x="565" y="400" text-anchor="middle" font-size="11" fill="#374151">Project Settings, Engine - Rendering, Mobile Shading</text>
</svg>
