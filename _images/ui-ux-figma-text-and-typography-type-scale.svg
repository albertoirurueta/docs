<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Bookshelf type scale (ratio 1.25, base 16)</text>
  <line x1="20" y1="44" x2="740" y2="44" stroke="#E5E7EB"/>
  <text x="50" y="86" font-size="39" font-weight="bold" fill="#3730A3">Display</text>
  <text x="560" y="86" font-size="12" fill="#374151">39 px / line height 120% / Bold</text>
  <text x="50" y="128" font-size="31" font-weight="bold" fill="#3730A3">Page title</text>
  <text x="560" y="128" font-size="12" fill="#374151">31 px / 125% / Bold</text>
  <text x="50" y="164" font-size="25" font-weight="bold" fill="#3730A3">Section heading</text>
  <text x="560" y="164" font-size="12" fill="#374151">25 px / 130% / Bold</text>
  <text x="50" y="196" font-size="20" font-weight="bold" fill="#3730A3">Book card title</text>
  <text x="560" y="196" font-size="12" fill="#374151">20 px / 140% / Semibold</text>
  <text x="50" y="224" font-size="16" fill="#1F2937">Body text for descriptions and reviews</text>
  <text x="560" y="224" font-size="12" fill="#374151">16 px / 150% / Regular</text>
  <text x="50" y="250" font-size="13" fill="#1F2937">Caption: author name and page count</text>
  <text x="560" y="250" font-size="12" fill="#374151">13 px / 150% / Regular</text>
  <line x1="20" y1="268" x2="740" y2="268" stroke="#E5E7EB"/>
  <circle cx="30" cy="296" r="11" fill="#4F46E5"/><text x="30" y="300" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="50" y="300" font-size="12" fill="#374151">Each step is the previous size multiplied by 1.25 and rounded.</text>
  <circle cx="30" cy="324" r="11" fill="#B45309"/><text x="30" y="328" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="50" y="328" font-size="12" fill="#374151">Larger sizes get tighter line height; body text keeps the most open spacing.</text>
  <text x="380" y="350" font-size="11" fill="#4B5563" text-anchor="middle">Illustrative values for the Bookshelf scenario, not a Figma default.</text>
</svg>
