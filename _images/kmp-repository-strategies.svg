<svg viewBox="0 0 760 440" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#5f6368"/></marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Repository Strategies for Shared Kotlin Code</text>

  <!-- Divider -->
  <line x1="380" y1="48" x2="380" y2="420" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Left: monorepo -->
  <text x="190" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3a6b">A. Monorepo (source dependency)</text>
  <rect x="20" y="78" width="340" height="270" rx="10" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5"/>
  <text x="34" y="98" font-size="12" font-weight="600" fill="#3c4043">trailmate/ (one Git repository, one PR, one CI)</text>
  <rect x="115" y="112" width="150" height="52" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="190" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">sharedLogic</text>
  <text x="190" y="152" text-anchor="middle" font-size="11.5" fill="#3c4043">Kotlin, commonMain</text>
  <rect x="36" y="232" width="140" height="52" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="106" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">androidApp</text>
  <text x="106" y="272" text-anchor="middle" font-size="11.5" fill="#3c4043">project(":sharedLogic")</text>
  <rect x="204" y="232" width="140" height="52" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="274" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">iosApp</text>
  <text x="274" y="272" text-anchor="middle" font-size="11.5" fill="#3c4043">embedAndSign build phase</text>
  <line x1="160" y1="164" x2="116" y2="228" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="164" x2="264" y2="228" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="318" text-anchor="middle" font-size="11.5" fill="#3c4043">Atomic cross-platform changes, instant feedback</text>
  <text x="190" y="336" text-anchor="middle" font-size="11.5" fill="#3c4043">iOS engineers need a JDK and Gradle locally</text>
  <text x="190" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Best: one team, one product</text>
  <text x="190" y="390" text-anchor="middle" font-size="11.5" fill="#3c4043">Lock-step releases of both apps</text>

  <!-- Right: multi-repo -->
  <text x="570" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3a6b">B. Separate repositories (binary dependency)</text>
  <rect x="400" y="78" width="170" height="108" rx="10" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5"/>
  <text x="412" y="98" font-size="12" font-weight="600" fill="#3c4043">trailmate-shared</text>
  <rect x="412" y="108" width="146" height="52" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="485" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">sharedLogic</text>
  <text x="485" y="148" text-anchor="middle" font-size="11.5" fill="#3c4043">versioned, tagged</text>
  <rect x="590" y="88" width="150" height="88" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="665" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">CI on macOS</text>
  <text x="665" y="132" text-anchor="middle" font-size="11.5" fill="#3c4043">build, test, publish</text>
  <text x="665" y="150" text-anchor="middle" font-size="11.5" fill="#3c4043">tag 1.4.0 triggers it</text>
  <line x1="570" y1="132" x2="586" y2="132" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="226" width="150" height="48" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="475" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Maven repository</text>
  <text x="475" y="263" text-anchor="middle" font-size="11" fill="#3c4043">AAR + module metadata</text>
  <rect x="590" y="226" width="150" height="48" rx="8" fill="#fff4e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="665" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">XCFramework release</text>
  <text x="665" y="263" text-anchor="middle" font-size="11" fill="#3c4043">zip + Package.swift</text>
  <line x1="640" y1="176" x2="560" y2="222" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="665" y1="176" x2="665" y2="222" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="312" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="475" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">trailmate-android</text>
  <rect x="590" y="312" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="665" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">trailmate-ios</text>
  <line x1="475" y1="274" x2="475" y2="308" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="665" y1="274" x2="665" y2="308" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="570" y="376" text-anchor="middle" font-size="11.5" fill="#3c4043">iOS app needs no Kotlin toolchain; version bumps by PR</text>
  <text x="570" y="394" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Best: separate teams, gradual adoption</text>
  <text x="570" y="412" text-anchor="middle" font-size="11.5" fill="#3c4043">Slower feedback loop across repositories</text>
</svg>
