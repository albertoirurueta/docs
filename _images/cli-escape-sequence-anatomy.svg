<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a control sequence</text>
  <text x="400" y="48" font-size="13" fill="#666666" text-anchor="middle">ESC [ 1 ; 31 m: bold, red foreground (SGR, Select Graphic Rendition)</text>

  <!-- byte boxes -->
  <rect x="40" y="70" width="90" height="56" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="85" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">ESC</text>
  <rect x="140" y="70" width="60" height="56" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="170" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">[</text>
  <rect x="220" y="70" width="50" height="56" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="245" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">1</text>
  <rect x="280" y="70" width="50" height="56" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="305" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">;</text>
  <rect x="340" y="70" width="50" height="56" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="365" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">3</text>
  <rect x="400" y="70" width="50" height="56" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="425" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">1</text>
  <rect x="480" y="70" width="60" height="56" rx="6" fill="#d9efd9" stroke="#2a6a2a" stroke-width="2"/>
  <text x="510" y="106" font-size="22" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">m</text>

  <!-- hex values -->
  <g font-size="12" font-family="Menlo, Consolas, monospace" fill="#555555" text-anchor="middle">
    <text x="85" y="144">0x1B</text>
    <text x="170" y="144">0x5B</text>
    <text x="245" y="144">0x31</text>
    <text x="305" y="144">0x3B</text>
    <text x="365" y="144">0x33</text>
    <text x="425" y="144">0x31</text>
    <text x="510" y="144">0x6D</text>
  </g>

  
  <!-- brackets and labels -->
  <path d="M40,164 L40,172 L200,172 L200,164" fill="none" stroke="#a07820" stroke-width="2"/>
  <text x="120" y="192" font-size="13" font-weight="bold" fill="#7a5a10" text-anchor="middle">CSI</text>
  <text x="120" y="209" font-size="12" fill="#333333" text-anchor="middle">Control Sequence Introducer (C1 0x9B)</text>

  <path d="M220,164 L220,172 L450,172 L450,164" fill="none" stroke="#1c4b73" stroke-width="2"/>
  <text x="335" y="192" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Parameter bytes 0x30-0x3F</text>
  <text x="335" y="209" font-size="12" fill="#333333" text-anchor="middle">digits and ; : the numbers 1 and 31</text>

  <path d="M480,164 L480,172 L540,172 L540,164" fill="none" stroke="#2a6a2a" stroke-width="2"/>
  <text x="510" y="192" font-size="13" font-weight="bold" fill="#2a6a2a" text-anchor="middle">Final byte</text>
  <text x="510" y="209" font-size="12" fill="#333333" text-anchor="middle">0x40-0x7E, picks SGR</text>

  <!-- meaning -->
  <rect x="580" y="70" width="190" height="56" rx="6" fill="#f7f9fc" stroke="#1c4b73"/>
  <text x="675" y="93" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Effect</text>
  <text x="675" y="112" font-size="12" fill="#333333" text-anchor="middle">1 = bold, 31 = red text</text>

  <!-- second strip: string sequence -->
  <line x1="40" y1="236" x2="760" y2="236" stroke="#cccccc"/>
  <text x="40" y="262" font-size="14" font-weight="bold" fill="#222222">String sequences end with ST, not with a final byte</text>

  <rect x="40" y="276" width="70" height="44" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="75" y="305" font-size="18" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">ESC</text>
  <rect x="118" y="276" width="44" height="44" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="140" y="305" font-size="18" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">]</text>
  <rect x="170" y="276" width="300" height="44" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="320" y="305" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">8;;https://example.org/shelf/1</text>
  <rect x="478" y="276" width="70" height="44" rx="6" fill="#d9efd9" stroke="#2a6a2a" stroke-width="2"/>
  <text x="513" y="305" font-size="18" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">ESC</text>
  <rect x="556" y="276" width="44" height="44" rx="6" fill="#d9efd9" stroke="#2a6a2a" stroke-width="2"/>
  <text x="578" y="305" font-size="18" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">\</text>

  <g font-size="12" fill="#333333" text-anchor="middle">
    <text x="75" y="342">OSC opens</text>
    <text x="140" y="342">(ESC ])</text>
    <text x="320" y="342">command number, params, payload (OSC 8 hyperlink)</text>
    <text x="578" y="342">ST (ESC \) ends it</text>
  </g>

  <text x="400" y="364" font-size="12" fill="#333333" text-anchor="middle">BEL (0x07) is also accepted by many terminals as the end of an OSC string.</text>
  <text x="400" y="388" font-size="12" fill="#666666" text-anchor="middle">Every byte of a sequence is an ordinary byte on the wire; only the terminal gives ESC its meaning.</text>
</svg>
