<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How PrestaShop finds a theme file</title>
  <desc id="d">For a page template PrestaShop tries four names from the most specific (locale and entity id) to the default, and for each name it looks in the child theme first and then in the parent theme. For an asset such as theme.css or theme.js it uses the child file when it exists and the parent file otherwise. For a module template it looks in the child theme modules folder, then the parent theme modules folder, then the module itself.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Child theme first, parent theme second, module or core last</text>

  <!-- column 1: page templates -->
  <text x="170" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#f2f5f8">Page template</text>
  <text x="170" y="82" text-anchor="middle" font-size="12" fill="#f2f5f8">product 2, locale en-US</text>
  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="30" y="98" width="280" height="44" rx="8"/>
    <rect x="30" y="152" width="280" height="44" rx="8"/>
    <rect x="30" y="206" width="280" height="44" rx="8"/>
    <rect x="30" y="260" width="280" height="44" rx="8"/>
  </g>
  <g fill="#f2f5f8" font-size="12" font-family="Menlo, Consolas, monospace">
    <text x="44" y="125">1  en-US/catalog/product-2.tpl</text>
    <text x="44" y="179">2  catalog/product-2.tpl</text>
    <text x="44" y="233">3  en-US/catalog/product.tpl</text>
    <text x="44" y="287">4  catalog/product.tpl</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.4" marker-end="url(#a)">
    <path d="M170 142 V 150"/>
    <path d="M170 196 V 204"/>
    <path d="M170 250 V 258"/>
  </g>
  <rect x="30" y="326" width="280" height="96" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="44" y="348" font-size="12" font-weight="bold" fill="#f2f5f8">Each name is searched in order:</text>
  <text x="44" y="368" font-size="12" fill="#f2f5f8">themes/pcfgcoffee/templates/...</text>
  <text x="44" y="386" font-size="12" fill="#f2f5f8">themes/hummingbird/templates/...</text>
  <text x="44" y="408" font-size="11" fill="#f2f5f8">first file found wins</text>
  <path d="M170 304 V 324" fill="none" stroke="#f2f5f8" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- column 2: assets -->
  <text x="480" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#f2f5f8">Assets of the theme</text>
  <text x="480" y="82" text-anchor="middle" font-size="12" fill="#f2f5f8">use_parent_assets: true</text>
  <rect x="350" y="98" width="260" height="96" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="364" y="120" font-size="12" font-weight="bold" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">assets/css/theme.css</text>
  <text x="364" y="140" font-size="12" fill="#f2f5f8">child file missing: parent file used</text>
  <text x="364" y="158" font-size="12" fill="#f2f5f8">hummingbird/assets/css/theme.css</text>
  <text x="364" y="178" font-size="11" fill="#f2f5f8">353,410 bytes in 2.1.2</text>
  <rect x="350" y="208" width="260" height="96" rx="8" fill="#a15a4a" stroke="#f2f5f8"/>
  <text x="364" y="230" font-size="12" font-weight="bold" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">assets/js/theme.js</text>
  <text x="364" y="250" font-size="12" fill="#f2f5f8">an empty child file wins and</text>
  <text x="364" y="268" font-size="12" fill="#f2f5f8">the parent JavaScript is not loaded</text>
  <text x="364" y="288" font-size="11" fill="#f2f5f8">delete the file to inherit</text>
  <rect x="350" y="318" width="260" height="104" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="364" y="340" font-size="12" font-weight="bold" fill="#f2f5f8">Extra assets (theme.yml)</text>
  <text x="364" y="360" font-size="12" fill="#f2f5f8">registered per page or for all:</text>
  <text x="364" y="378" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">roast-badge.css  priority 200</text>
  <text x="364" y="396" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">pocket-coffee.css priority 210</text>
  <text x="364" y="414" font-size="11" fill="#f2f5f8">loaded after theme.css (priority 50)</text>

  <!-- column 3: module templates -->
  <text x="790" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#f2f5f8">Module template</text>
  <text x="790" y="82" text-anchor="middle" font-size="12" fill="#f2f5f8">for example ps_featuredproducts</text>
  <g fill="#7a5c99" stroke="#f2f5f8">
    <rect x="650" y="98" width="280" height="56" rx="8"/>
    <rect x="650" y="170" width="280" height="56" rx="8"/>
    <rect x="650" y="242" width="280" height="56" rx="8"/>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <text x="664" y="120" font-weight="bold">1  child theme</text>
    <text x="664" y="140" font-family="Menlo, Consolas, monospace" font-size="11">themes/pcfgcoffee/modules/&lt;module&gt;/...</text>
    <text x="664" y="192" font-weight="bold">2  parent theme</text>
    <text x="664" y="212" font-family="Menlo, Consolas, monospace" font-size="11">themes/hummingbird/modules/&lt;module&gt;/...</text>
    <text x="664" y="264" font-weight="bold">3  the module itself</text>
    <text x="664" y="284" font-family="Menlo, Consolas, monospace" font-size="11">modules/&lt;module&gt;/views/templates/...</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.4" marker-end="url(#a)">
    <path d="M790 154 V 168"/>
    <path d="M790 226 V 240"/>
  </g>
  <rect x="650" y="326" width="280" height="96" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="664" y="348" font-size="12" font-weight="bold" fill="#f2f5f8">Partials inside a module template</text>
  <text x="664" y="368" font-size="12" fill="#f2f5f8">module:name/path is resolved this way,</text>
  <text x="664" y="386" font-size="12" fill="#f2f5f8">a relative include stays in the module</text>
  <text x="664" y="408" font-size="11" fill="#f2f5f8">override every file or use module:</text>

  <!-- bottom note -->
  <rect x="30" y="450" width="900" height="120" rx="8" fill="#34495e" stroke="#f2f5f8" stroke-dasharray="6 4"/>
  <text x="44" y="474" font-size="13" font-weight="bold" fill="#f2f5f8">Inside a template file</text>
  <text x="44" y="496" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">{extends file='parent:catalog/listing/category.tpl'}   starts from the parent copy of the same path</text>
  <text x="44" y="516" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">{extends file='catalog/listing/category.tpl'}          written in the child copy of that file: extends itself</text>
  <text x="44" y="540" font-size="12" fill="#f2f5f8">The second form exhausted the memory limit of the test shop and the web server process crashed</text>
  <text x="44" y="558" font-size="12" fill="#f2f5f8">(HTTP connection closed without a response); use the parent: prefix for the same path.</text>
</svg>
