<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Feature extraction versus fine-tuning</title>
<desc id="d">Two ways to reuse a pre-trained network. In feature extraction the backbone is frozen and only a new head is trained. In fine-tuning the head is trained first, then some or all backbone layers are unfrozen and trained with a much smaller learning rate.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Reusing a pre-trained network</text>
<text x="20" y="62" font-size="14" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A. Feature extraction</text>
<rect x="20" y="72" width="120" height="44" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="80.0" y="99.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">early layers (frozen)</text>
<rect x="150" y="72" width="120" height="44" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="210.0" y="99.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">mid layers (frozen)</text>
<rect x="280" y="72" width="120" height="44" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="340.0" y="99.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">late layers (frozen)</text>
<rect x="420" y="72" width="110" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="475.0" y="99.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">new head (trained)</text>
<rect x="550" y="72" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="625.0" y="99.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">loss on target data</text>
<line x1="140" y1="94" x2="148" y2="94" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="270" y1="94" x2="278" y2="94" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="400" y1="94" x2="418" y2="94" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="530" y1="94" x2="548" y2="94" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="152" font-size="14" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">B. Fine-tuning (after the head has converged)</text>
<rect x="20" y="162" width="120" height="44" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="80.0" y="189.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">early layers (frozen)</text>
<rect x="150" y="162" width="120" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="210.0" y="189.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">mid layers (small LR)</text>
<rect x="280" y="162" width="120" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="340.0" y="189.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">late layers (small LR)</text>
<rect x="420" y="162" width="110" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="475.0" y="189.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">head (larger LR)</text>
<rect x="550" y="162" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="625.0" y="189.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">loss on target data</text>
<line x1="140" y1="184" x2="148" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="270" y1="184" x2="278" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="400" y1="184" x2="418" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="530" y1="184" x2="548" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="246" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Early layers learn general features (edges, textures, word pieces); later layers are more task specific.</text>
<text x="360" y="268" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Grey: frozen. Teal: trained with a small learning rate. Amber: new, randomly initialised layers.</text>
</svg>
