<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  laim needs a title&quot;,&quot;code&quot;:&quot;400&quot;,&quot;target&quot;:&quot;in/title&quot;,&quot;@Common.numericSeverity&quot;:4},{&quot;message&quot;:&quot;A claim needs at least</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">   one item&quot;,&quot;code&quot;:&quot;400&quot;,&quot;target&quot;:&quot;in/items&quot;,&quot;@Common.numericSeverity&quot;:4}],&quot;@Common.numericSeverity&quot;:4}}</text>
