<svg viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a1c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Django request/response cycle</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">solid arrows: the request going in; dashed arrows: the response coming back out through the same layers</text>

  <!-- Client -->
  <rect x="70" y="62" width="320" height="38" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="230" y="86" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Client: browser, curl, mobile app</text>

  <!-- Server -->
  <rect x="70" y="124" width="320" height="46" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="230" y="144" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">WSGI or ASGI server</text>
  <text x="230" y="161" font-size="10.5" fill="#444444" text-anchor="middle">Gunicorn / runserver (WSGI), Uvicorn / Daphne / Granian (ASGI)</text>

  <!-- Handler -->
  <rect x="70" y="194" width="320" height="58" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="230" y="214" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">WSGIHandler / ASGIHandler</text>
  <text x="230" y="231" font-size="10.5" fill="#444444" text-anchor="middle">request_started signal, then build the HttpRequest</text>
  <text x="230" y="245" font-size="10.5" fill="#444444" text-anchor="middle">get_response(request) enters the middleware chain</text>

  <!-- Middleware container -->
  <rect x="50" y="278" width="360" height="330" fill="#fbf6ee" stroke="#7a4a00" stroke-width="1.8" stroke-dasharray="2,0"/>
  <text x="230" y="297" font-size="13" font-weight="bold" fill="#7a4a00" text-anchor="middle">Middleware chain (MIDDLEWARE)</text>
  <text x="230" y="312" font-size="10.5" fill="#444444" text-anchor="middle">request: __call__ runs top-down; response: bottom-up (an onion)</text>

  <!-- URL resolution -->
  <rect x="80" y="326" width="300" height="48" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="230" y="346" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">URL resolution</text>
  <text x="230" y="363" font-size="10.5" fill="#444444" text-anchor="middle">path_info matched against urlpatterns, first match wins</text>

  <!-- process_view -->
  <rect x="80" y="392" width="300" height="40" fill="#ffffff" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="230" y="410" font-size="13" font-weight="bold" fill="#7a4a00" text-anchor="middle">process_view() hooks</text>
  <text x="230" y="425" font-size="10.5" fill="#444444" text-anchor="middle">top-down; None continues, a response short-circuits</text>

  <!-- View -->
  <rect x="80" y="450" width="300" height="50" fill="#ffffff" stroke="#1d5e2a" stroke-width="1.8"/>
  <text x="230" y="470" font-size="13" font-weight="bold" fill="#1d5e2a" text-anchor="middle">View (function or class, sync or async)</text>
  <text x="230" y="487" font-size="10.5" fill="#444444" text-anchor="middle">ORM, forms, business logic; returns an HttpResponse</text>

  <!-- Template response -->
  <rect x="80" y="518" width="300" height="60" fill="#ffffff" stroke="#1d5e2a" stroke-width="1.6"/>
  <text x="230" y="537" font-size="13" font-weight="bold" fill="#1d5e2a" text-anchor="middle">Deferred rendering</text>
  <text x="230" y="553" font-size="10.5" fill="#444444" text-anchor="middle">TemplateResponse: process_template_response() hooks,</text>
  <text x="230" y="567" font-size="10.5" fill="#444444" text-anchor="middle">bottom-up, then render() produces the bytes</text>

  <!-- Bottom: handler returns -->
  <rect x="70" y="632" width="320" height="52" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="230" y="652" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Handler sends the response</text>
  <text x="230" y="669" font-size="10.5" fill="#444444" text-anchor="middle">status line, headers, Set-Cookie, body; the server calls</text>
  <text x="230" y="680" font-size="10.5" fill="#444444" text-anchor="middle">response.close(), which fires request_finished</text>

  <!-- request path arrows (solid) -->
  <line x1="230" y1="100" x2="230" y2="121" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="170" x2="230" y2="191" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="252" x2="230" y2="275" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="374" x2="230" y2="389" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="432" x2="230" y2="447" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="500" x2="230" y2="515" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- response path (dashed): from rendering out through the middleware, to the handler, up the left side -->
  <line x1="230" y1="608" x2="230" y2="629" stroke="#666666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-grey)"/>
  <polyline points="70,658 30,658 30,81 66,81" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-grey)"/>
  <text x="22" y="372" font-size="11" fill="#666666" text-anchor="middle" transform="rotate(-90 22 372)">HttpResponse travels back to the client</text>

  <!-- Exceptions lane -->
  <rect x="446" y="278" width="254" height="330" fill="#fdf3f3" stroke="#8a1c1c" stroke-width="1.8"/>
  <text x="573" y="297" font-size="13" font-weight="bold" fill="#8a1c1c" text-anchor="middle">Exceptions become responses</text>
  <text x="573" y="312" font-size="10.5" fill="#444444" text-anchor="middle">converted between every pair of layers</text>

  <rect x="460" y="326" width="226" height="52" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.2"/>
  <text x="573" y="344" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Resolver404 / Http404</text>
  <text x="573" y="360" font-size="10.5" fill="#444444" text-anchor="middle">handler404 (page_not_found)</text>
  <text x="573" y="373" font-size="10.5" fill="#444444" text-anchor="middle">with DEBUG=True: technical 404 page</text>

  <rect x="460" y="388" width="226" height="38" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.2"/>
  <text x="573" y="405" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">PermissionDenied</text>
  <text x="573" y="419" font-size="10.5" fill="#444444" text-anchor="middle">handler403 (permission_denied)</text>

  <rect x="460" y="436" width="226" height="52" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.2"/>
  <text x="573" y="453" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">BadRequest, SuspiciousOperation</text>
  <text x="573" y="469" font-size="10.5" fill="#444444" text-anchor="middle">handler400 (bad_request)</text>
  <text x="573" y="481" font-size="10.5" fill="#444444" text-anchor="middle">SuspiciousOperation is also logged</text>

  <rect x="460" y="498" width="226" height="94" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.2"/>
  <text x="573" y="515" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Anything else</text>
  <text x="573" y="531" font-size="10.5" fill="#444444" text-anchor="middle">view errors first reach every</text>
  <text x="573" y="544" font-size="10.5" fill="#444444" text-anchor="middle">process_exception() hook (bottom-up);</text>
  <text x="573" y="557" font-size="10.5" fill="#444444" text-anchor="middle">if none returns a response:</text>
  <text x="573" y="570" font-size="10.5" fill="#444444" text-anchor="middle">got_request_exception signal, logging,</text>
  <text x="573" y="583" font-size="10.5" fill="#444444" text-anchor="middle">handler500 (server_error) / debug page</text>

  <!-- arrow from view to exception lane, and back into the chain -->
  <line x1="380" y1="475" x2="443" y2="475" stroke="#8a1c1c" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="412" y="469" font-size="10.5" fill="#8a1c1c" text-anchor="middle">raise</text>
  <line x1="380" y1="350" x2="443" y2="350" stroke="#8a1c1c" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="412" y="344" font-size="10.5" fill="#8a1c1c" text-anchor="middle">no match</text>

  <!-- footnote -->
  <text x="573" y="634" font-size="10.5" fill="#444444" text-anchor="middle">The error response then flows back out</text>
  <text x="573" y="648" font-size="10.5" fill="#444444" text-anchor="middle">through the remaining middleware</text>
  <text x="573" y="662" font-size="10.5" fill="#444444" text-anchor="middle">like any other response.</text>
  <line x1="573" y1="608" x2="573" y2="620" stroke="#8a1c1c" stroke-width="1.4" stroke-dasharray="4,3"/>
</svg>
