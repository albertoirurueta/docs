<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where alt text travels and where it is lost</text>
  <rect x="24" y="48" width="712" height="30" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="44" y="68" font-size="13" font-weight="bold" fill="#1F2937">Destination</text>
  <text x="400" y="68" font-size="13" font-weight="bold" fill="#1F2937">Alt text kept</text>
  <g font-size="13" fill="#1F2937">
    <text x="44" y="104">PDF</text><text x="44" y="136">PPTX</text><text x="44" y="168">HTML</text><text x="44" y="200">Canva design share link</text><text x="44" y="232">Presenter mode</text><text x="44" y="264">PNG and other image formats</text><text x="44" y="296">MP4 and other video formats</text><text x="44" y="328">Content Planner posts</text>
  </g>
  <g stroke="#E5E7EB"><line x1="24" y1="112" x2="736" y2="112"/><line x1="24" y1="144" x2="736" y2="144"/><line x1="24" y1="176" x2="736" y2="176"/><line x1="24" y1="208" x2="736" y2="208"/><line x1="24" y1="240" x2="736" y2="240"/><line x1="24" y1="272" x2="736" y2="272"/><line x1="24" y1="304" x2="736" y2="304"/><line x1="24" y1="336" x2="736" y2="336"/></g>
  <g fill="#4F46E5"><rect x="400" y="90" width="90" height="20" rx="10"/><rect x="400" y="122" width="90" height="20" rx="10"/><rect x="400" y="154" width="90" height="20" rx="10"/><rect x="400" y="186" width="90" height="20" rx="10"/><rect x="400" y="218" width="90" height="20" rx="10"/></g>
  <g fill="#B45309"><rect x="400" y="250" width="90" height="20" rx="10"/><rect x="400" y="282" width="90" height="20" rx="10"/><rect x="400" y="314" width="90" height="20" rx="10"/></g>
  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="445" y="104">Kept</text><text x="445" y="136">Kept</text><text x="445" y="168">Kept</text><text x="445" y="200">Kept</text><text x="445" y="232">Kept</text><text x="445" y="264">Lost</text><text x="445" y="296">Lost</text><text x="445" y="328">Lost</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="510" y="104">tagged when exported with tags on</text><text x="510" y="264">no field to carry it</text><text x="510" y="296">no field to carry it</text><text x="510" y="328">add the description to the caption</text>
  </g>
  <text x="380" y="362" font-size="12" fill="#374151" text-anchor="middle">Alt text is stored per image copy, so each copy of a picture can carry its own description.</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic summary of the Help Center statements, not a screenshot of any product.</text>
</svg>
