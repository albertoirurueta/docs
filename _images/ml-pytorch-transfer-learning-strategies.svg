<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Transfer learning strategies in PyTorch</title>
<desc id="d">Three strategies for a pre-trained ResNet: a fixed feature extractor with every backbone parameter frozen and only the new fc layer in the optimizer, fine-tuning everything with one learning rate, and discriminative fine-tuning with a frozen stem, a small learning rate for the backbone stages and a larger learning rate for the new head.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Which parameters get gradients, and at what learning rate</text>
<text x="20" y="62" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">A. Fixed feature extractor</text>
<rect x="20" y="70" width="140" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="90" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">stem (frozen)</text>
<rect x="170" y="70" width="240" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="290" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">layer1 .. layer4 (frozen)</text>
<rect x="420" y="70" width="140" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="490" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">new fc: lr 1e-3</text>
<text x="575" y="95" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">backbone in eval()</text>
<text x="20" y="142" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">B. Fine-tune everything</text>
<rect x="20" y="150" width="140" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="90" y="175" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">stem: lr 1e-3</text>
<rect x="170" y="150" width="240" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="290" y="175" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">layer1 .. layer4: lr 1e-3</text>
<rect x="420" y="150" width="140" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="490" y="175" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">new fc: lr 1e-3</text>
<text x="575" y="175" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">one optimizer group</text>
<text x="20" y="222" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">C. Discriminative fine-tuning (parameter groups)</text>
<rect x="20" y="230" width="140" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="90" y="255" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">stem (frozen)</text>
<rect x="170" y="230" width="240" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="290" y="255" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">layer1 .. layer4: lr 1e-4</text>
<rect x="420" y="230" width="140" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="490" y="255" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">new fc: lr 1e-3</text>
<text x="575" y="255" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">two optimizer groups</text>
<line x1="160" y1="90" x2="168" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="410" y1="90" x2="418" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="160" y1="170" x2="168" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="410" y1="170" x2="418" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="160" y1="250" x2="168" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="410" y1="250" x2="418" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="302" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Grey: requires_grad is False. Teal: pre-trained and trained. Amber: new, randomly initialised.</text>
<text x="360" y="320" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Learning rates are illustrative starting points, not tuned values.</text>
</svg>
