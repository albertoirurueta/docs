<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From documented C# code to a rendered API page</title>
  <desc id="d">Three panels from left to right. The C# source with XML comments goes through docfx metadata to ManagedReference YAML, then docfx build renders an HTML API page. The member marked exclude is dropped in the first step.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#1b2433"/>

  <text x="140" y="34" fill="#e6edf7" font-size="16" font-weight="bold" text-anchor="middle">1. Source code</text>
  <text x="480" y="34" fill="#e6edf7" font-size="16" font-weight="bold" text-anchor="middle">2. ManagedReference YAML</text>
  <text x="820" y="34" fill="#e6edf7" font-size="16" font-weight="bold" text-anchor="middle">3. HTML page</text>

  <!-- panel 1 -->
  <rect x="20" y="48" width="290" height="372" rx="10" fill="#273449" stroke="#5b7aa8" stroke-width="1.5"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11.5">
    <text x="32" y="74" fill="#8fa3bf">/// &lt;summary&gt;Converts &lt;paramref</text>
    <text x="32" y="90" fill="#8fa3bf">///   name="value"/&gt; to another unit.</text>
    <text x="32" y="106" fill="#8fa3bf">/// &lt;/summary&gt;</text>
    <text x="32" y="122" fill="#8fa3bf">/// &lt;param name="value"&gt;The</text>
    <text x="32" y="138" fill="#8fa3bf">///   magnitude to convert.&lt;/param&gt;</text>
    <text x="32" y="154" fill="#8fa3bf">/// &lt;returns&gt;The converted</text>
    <text x="32" y="170" fill="#8fa3bf">///   magnitude.&lt;/returns&gt;</text>
    <text x="32" y="186" fill="#8fa3bf">/// &lt;exception cref="Argument</text>
    <text x="32" y="202" fill="#8fa3bf">///   OutOfRangeException"&gt;...</text>
    <text x="32" y="222" fill="#e6edf7">public static double Convert(</text>
    <text x="32" y="238" fill="#e6edf7">    double value,</text>
    <text x="32" y="254" fill="#e6edf7">    LengthUnit from,</text>
    <text x="32" y="270" fill="#e6edf7">    LengthUnit to) =&gt; ...;</text>
    <text x="32" y="306" fill="#8fa3bf">/// &lt;summary&gt;Internal helper.</text>
    <text x="32" y="322" fill="#8fa3bf">/// &lt;/summary&gt;</text>
    <text x="32" y="338" fill="#f5b942">/// &lt;exclude /&gt;</text>
    <text x="32" y="354" fill="#e6edf7">public static void Reset() { }</text>
  </g>
  <rect x="26" y="292" width="278" height="72" rx="6" fill="none" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="165" y="390" fill="#f5b942" font-size="12" text-anchor="middle">dropped by the exclude tag</text>
  <text x="165" y="408" fill="#8fa3bf" font-size="12" text-anchor="middle">Converter.cs, PocketUnits.csproj</text>

  <!-- arrow 1 -->
  <line x1="312" y1="210" x2="338" y2="210" stroke="#f5b942" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="325" y="196" fill="#f5b942" font-size="11" text-anchor="middle">docfx</text>
  <text x="325" y="241" fill="#f5b942" font-size="11" text-anchor="middle">metadata</text>

  <!-- panel 2 -->
  <rect x="340" y="48" width="280" height="372" rx="10" fill="#273449" stroke="#5b7aa8" stroke-width="1.5"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#e6edf7">
    <text x="352" y="74" fill="#8fa3bf">### YamlMime:ManagedReference</text>
    <text x="352" y="92">- uid: PocketUnits.Converter.</text>
    <text x="352" y="108">    Convert(System.Double,...)</text>
    <text x="352" y="124">  type: Method</text>
    <text x="352" y="140">  summary: Converts &lt;code</text>
    <text x="352" y="156">    class="paramref"&gt;value...</text>
    <text x="352" y="172">  syntax:</text>
    <text x="352" y="188">    content: public static</text>
    <text x="352" y="204">      double Convert(...)</text>
    <text x="352" y="220">    parameters:</text>
    <text x="352" y="236">    - id: value</text>
    <text x="352" y="252">      description: The magnitude...</text>
    <text x="352" y="268">    return:</text>
    <text x="352" y="284">      description: The converted...</text>
    <text x="352" y="300">  exceptions:</text>
    <text x="352" y="316">  - type: System.Argument</text>
    <text x="352" y="332">      OutOfRangeException</text>
  </g>
  <text x="480" y="372" fill="#6cc08b" font-size="12" text-anchor="middle">one file per namespace, type and enum</text>
  <text x="480" y="390" fill="#6cc08b" font-size="12" text-anchor="middle">plus toc.yml, no entry for Reset</text>
  <text x="480" y="408" fill="#8fa3bf" font-size="12" text-anchor="middle">api/*.yml (the dest folder)</text>

  <!-- arrow 2 -->
  <line x1="622" y1="210" x2="648" y2="210" stroke="#f5b942" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="635" y="196" fill="#f5b942" font-size="11" text-anchor="middle">docfx</text>
  <text x="635" y="241" fill="#f5b942" font-size="11" text-anchor="middle">build</text>

  <!-- panel 3 -->
  <rect x="650" y="48" width="290" height="372" rx="10" fill="#273449" stroke="#5b7aa8" stroke-width="1.5"/>
  <rect x="662" y="60" width="266" height="26" rx="4" fill="#33465f"/>
  <text x="672" y="78" fill="#e6edf7" font-size="12">Pocket Units  |  Home  |  API</text>
  <text x="662" y="112" fill="#e6edf7" font-size="15" font-weight="bold">Class Converter</text>
  <text x="662" y="132" fill="#8fa3bf" font-size="11.5">Namespace PocketUnits  -  PocketUnits.dll</text>
  <text x="662" y="160" fill="#e6edf7" font-size="13" font-weight="bold">Convert(double, LengthUnit, LengthUnit)</text>
  <text x="662" y="180" fill="#8fa3bf" font-size="11.5">Converts value to another unit.</text>
  <rect x="662" y="190" width="266" height="22" rx="4" fill="#1b2433"/>
  <text x="670" y="205" fill="#e6edf7" font-size="11" font-family="Consolas, Menlo, monospace">public static double Convert(...)</text>
  <text x="662" y="236" fill="#6cc08b" font-size="12" font-weight="bold">Parameters</text>
  <text x="662" y="254" fill="#e6edf7" font-size="11.5">value  double - The magnitude...</text>
  <text x="662" y="270" fill="#e6edf7" font-size="11.5">from, to  LengthUnit - ...</text>
  <text x="662" y="294" fill="#6cc08b" font-size="12" font-weight="bold">Returns</text>
  <text x="662" y="312" fill="#e6edf7" font-size="11.5">double - The converted magnitude.</text>
  <text x="662" y="336" fill="#6cc08b" font-size="12" font-weight="bold">Exceptions</text>
  <text x="662" y="354" fill="#e6edf7" font-size="11.5">ArgumentOutOfRangeException</text>
  <text x="795" y="390" fill="#8fa3bf" font-size="12" text-anchor="middle">_site/api/PocketUnits.Converter.html</text>
  <text x="795" y="408" fill="#6cc08b" font-size="12" text-anchor="middle">types link to LengthUnit and learn.microsoft.com</text>

  <text x="480" y="446" fill="#8fa3bf" font-size="12" text-anchor="middle">Comment text is Markdown: it is carried through step 2 unrendered and converted to HTML in step 3.</text>
</svg>
