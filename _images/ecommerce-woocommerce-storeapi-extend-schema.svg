<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 506" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">ExtendSchema: read path through endpoint data and write path through an update callback</title>
  <desc id="d">Left, the read path. A plugin registers endpoint data for one of four extensible schemas: product, cart item, cart or checkout. The product callback receives the product, the cart item callback receives the cart item, the cart and checkout callbacks receive no arguments. Each schema adds the returned array under the extensions key of the response, inside the plugin namespace. Right, the write path. A client posts a namespace and data to cart/extensions. The route finds the update callback registered for the namespace and answers 400 if there is none. The callback runs with the data, then the cart is recalculated and the whole cart is returned with fresh extension data.</desc>
  <rect x="0" y="0" width="980" height="506" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Extending the Store API: reading and writing your own data</text>
  <text x="20" y="62" font-size="14" font-weight="bold" fill="#c9d3dc">Read: register_endpoint_data</text>
  <text x="510" y="62" font-size="14" font-weight="bold" fill="#c9d3dc">Write: register_update_callback</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="76" width="450" height="62" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="100" font-family="Menlo, Consolas, monospace" font-weight="bold" font-size="12">ProductSchema::IDENTIFIER</text>
    <text x="34" y="118" font-size="12">callback: data_callback( $product )</text>
    <text x="34" y="133" font-size="11" fill="#dfe6ec">appears in: GET /products and /products/{id}</text>
    <rect x="20" y="150" width="450" height="62" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="174" font-family="Menlo, Consolas, monospace" font-weight="bold" font-size="12">CartItemSchema::IDENTIFIER</text>
    <text x="34" y="192" font-size="12">callback: data_callback( $cart_item )</text>
    <text x="34" y="207" font-size="11" fill="#dfe6ec">appears in: each item of the cart</text>
    <rect x="20" y="224" width="450" height="62" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="248" font-family="Menlo, Consolas, monospace" font-weight="bold" font-size="12">CartSchema::IDENTIFIER</text>
    <text x="34" y="266" font-size="12">callback: no arguments</text>
    <text x="34" y="281" font-size="11" fill="#dfe6ec">appears in: GET /cart and every cart response</text>
    <rect x="20" y="298" width="450" height="62" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="322" font-family="Menlo, Consolas, monospace" font-weight="bold" font-size="12">CheckoutSchema::IDENTIFIER</text>
    <text x="34" y="340" font-size="12">callback: no arguments</text>
    <text x="34" y="355" font-size="11" fill="#dfe6ec">appears in: GET, PUT and POST /checkout</text>
    <rect x="20" y="378" width="450" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="402" font-weight="bold" font-size="13">Response, under the extensions key</text>
    <text x="34" y="426" font-family="Menlo, Consolas, monospace" font-size="11">"extensions": { "pocket-coffee": {</text>
    <text x="34" y="442" font-family="Menlo, Consolas, monospace" font-size="11">    "roast_date": "2026-10-20" } }</text>
    <text x="34" y="466" font-size="11">One object per plugin namespace; the schema_callback describes the shape.</text>
    <rect x="510" y="76" width="450" height="84" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="524" y="102" font-weight="bold" font-size="14">1  Client</text>
    <text x="524" y="126" font-size="12">extensionCartUpdate( { namespace, data } ) in a block,</text>
    <text x="524" y="144" font-size="12">or POST /cart/extensions with Cart-Token or Nonce</text>
    <rect x="510" y="182" width="450" height="84" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="524" y="208" font-weight="bold" font-size="14">2  Route CartExtensions</text>
    <text x="524" y="232" font-size="12">Looks up the callback registered for the namespace;</text>
    <text x="524" y="250" font-size="12">none registered: 400 woocommerce_rest_cart_extensions_error</text>
    <rect x="510" y="288" width="450" height="84" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="524" y="314" font-weight="bold" font-size="14">3  Your update callback</text>
    <text x="524" y="338" font-size="12">callback( $data ): change the session or the cart.</text>
    <text x="524" y="356" font-size="12">Throw RouteException to answer a chosen 4xx status</text>
    <rect x="510" y="394" width="450" height="84" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="524" y="420" font-weight="bold" font-size="14">4  Cart recalculated</text>
    <text x="524" y="444" font-size="12">calculate_totals(), then the whole cart is returned</text>
    <text x="524" y="462" font-size="12">with fresh extensions data for every namespace</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M735 160 V 180"/>
    <path d="M735 266 V 286"/>
    <path d="M735 372 V 392"/>
  </g>
</svg>
