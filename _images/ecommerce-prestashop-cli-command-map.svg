<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The 28 prestashop console commands of PrestaShop 9.2.0 grouped by purpose</title>
  <desc id="d">Six groups of commands. Modules and themes: prestashop:module with its eight actions, module:list, theme:enable, theme:export. Configuration and switches: config, feature-flag, debug. Admin API: api-client, api:generate-tracking-table, generate:apidoc. People and web server: employee:create-admin, employee:change-password, htaccess:generate. Upkeep of data: search:index, thumbnails:regenerate, taxes:update-eu-tax-rule-groups, schema:update-without-foreign, mail:generate. Developer tools: three linters, list:commands-and-queries, three translation commands and three update commands for core maintainers. Below, the Symfony commands that run beside them: cache, debug, lint, doctrine, messenger and secrets.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">php bin/console prestashop:* : 28 commands in six groups (PrestaShop 9.2.0)</text>

  <g>
    <rect x="30" y="52" width="290" height="190" rx="10" fill="#3d5266"/>
    <rect x="335" y="52" width="290" height="190" rx="10" fill="#33485c"/>
    <rect x="640" y="52" width="290" height="190" rx="10" fill="#3d5266"/>
    <rect x="30" y="256" width="290" height="190" rx="10" fill="#33485c"/>
    <rect x="335" y="256" width="290" height="190" rx="10" fill="#3d5266"/>
    <rect x="640" y="256" width="290" height="190" rx="10" fill="#33485c"/>
  </g>

  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="78" font-weight="bold">Modules and themes (4)</text>
    <text x="42" y="102" font-size="12.5">module install | uninstall | enable</text>
    <text x="42" y="119" font-size="12.5">  disable | reset | upgrade | configure | delete</text>
    <text x="42" y="144" font-size="12.5">module:list  --all --active --disabled</text>
    <text x="42" y="161" font-size="12.5">  --not-installed --simple</text>
    <text x="42" y="186" font-size="12.5">theme:enable  theme:export</text>
    <text x="42" y="222" font-size="12.5" fill="#f4b860">runs the module install and upgrade code</text>

    <text x="347" y="78" font-weight="bold">Configuration and switches (3)</text>
    <text x="347" y="102" font-size="12.5">config get | set | remove KEY</text>
    <text x="347" y="119" font-size="12.5">  --value --lang --shopId --shopGroupId</text>
    <text x="347" y="144" font-size="12.5">feature-flag list | enable | disable</text>
    <text x="347" y="169" font-size="12.5">debug [on|off]</text>
    <text x="347" y="222" font-size="12.5" fill="#f4b860">writes ps_configuration or config files</text>

    <text x="652" y="78" font-weight="bold">Admin API (3)</text>
    <text x="652" y="102" font-size="12.5">api-client create | delete CLIENT-ID</text>
    <text x="652" y="119" font-size="12.5">  --scopes --all-scopes --timeout --secret</text>
    <text x="652" y="144" font-size="12.5">api:generate-tracking-table</text>
    <text x="652" y="161" font-size="12.5">  --skip-github --output</text>
    <text x="652" y="186" font-size="12.5">generate:apidoc</text>
    <text x="652" y="222" font-size="12.5" fill="#f4b860">the secret is printed once</text>

    <text x="42" y="282" font-weight="bold">People and web server (3)</text>
    <text x="42" y="306" font-size="12.5">employee:create-admin EMAIL</text>
    <text x="42" y="323" font-size="12.5">  --first-name --last-name --password</text>
    <text x="42" y="348" font-size="12.5">employee:change-password EMAIL</text>
    <text x="42" y="373" font-size="12.5">htaccess:generate [--force]</text>
    <text x="42" y="426" font-size="12.5" fill="#f4b860">always a SuperAdmin; never overwrites</text>
    <text x="42" y="441" font-size="12.5" fill="#f4b860">.htaccess without --force</text>

    <text x="347" y="282" font-weight="bold">Upkeep of data (5)</text>
    <text x="347" y="306" font-size="12.5">search:index [--full -p -s -g]</text>
    <text x="347" y="331" font-size="12.5">thumbnails:regenerate IMAGE [TYPE] [-d]</text>
    <text x="347" y="356" font-size="12.5">mail:generate THEME LOCALE [OUT]</text>
    <text x="347" y="381" font-size="12.5">taxes:update-eu-tax-rule-groups</text>
    <text x="347" y="406" font-size="12.5">schema:update-without-foreign</text>
    <text x="347" y="423" font-size="12.5">  --dump-sql | --force</text>
    <text x="347" y="441" font-size="12.5" fill="#f4b860">output folders must already exist</text>

    <text x="652" y="282" font-weight="bold">Developer tools (10)</text>
    <text x="652" y="306" font-size="12.5">linter:legacy-link | naming-convention</text>
    <text x="652" y="323" font-size="12.5">linter:security-attribute list | find-missing</text>
    <text x="652" y="348" font-size="12.5">list:commands-and-queries</text>
    <text x="652" y="365" font-size="12.5">  -d DOMAIN -f FORMAT --hasApiEndpoint</text>
    <text x="652" y="390" font-size="12.5">translation:export-module | check-fixtures</text>
    <text x="652" y="407" font-size="12.5">  | find-duplicates</text>
    <text x="652" y="424" font-size="12.5">update:hooks-documentation | two *-hooks-listing</text>
    <text x="652" y="441" font-size="12.5" fill="#f4b860">update:* need a source checkout</text>
  </g>

  <rect x="30" y="462" width="900" height="80" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <g fill="#f2f5f8">
    <text x="42" y="486" font-size="14" font-weight="bold">Symfony and bundle commands in the same console (111 in the admin kernel)</text>
    <text x="42" y="508" font-size="12.5">cache:clear | cache:warmup | cache:pool:*   debug:router | container | autowiring | config | event-dispatcher | messenger | api-resource</text>
    <text x="42" y="526" font-size="12.5">lint:twig | yaml | xliff | container   doctrine:*   messenger:consume | stats   secrets:*   about   and the commands of every enabled module</text>
  </g>
</svg>
