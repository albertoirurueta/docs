<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A ring of timer queries: read results two frames late</text>
<text x="75" y="70" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">CPU</text>
<text x="75" y="150" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">GPU</text>
<rect x="150" y="50" width="160" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="230.0" y="72.0" text-anchor="middle" font-size="12" fill="#3730A3">CPU records frame 0</text>
<rect x="210" y="130" width="160" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="290.0" y="152.0" text-anchor="middle" font-size="12" fill="#92400E">GPU runs frame 0</text>
<line x1="230" y1="86" x2="250" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="330" y="50" width="160" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="410.0" y="72.0" text-anchor="middle" font-size="12" fill="#3730A3">CPU records frame 1</text>
<rect x="390" y="130" width="160" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="470.0" y="152.0" text-anchor="middle" font-size="12" fill="#92400E">GPU runs frame 1</text>
<line x1="410" y1="86" x2="430" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="510" y="50" width="160" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="590.0" y="72.0" text-anchor="middle" font-size="12" fill="#3730A3">CPU records frame 2</text>
<rect x="570" y="130" width="160" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="650.0" y="152.0" text-anchor="middle" font-size="12" fill="#92400E">GPU runs frame 2</text>
<line x1="590" y1="86" x2="610" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="106" text-anchor="middle" font-size="11" fill="#374151"></text>
<text x="410" y="106" text-anchor="middle" font-size="11" fill="#374151"></text>
<text x="590" y="106" text-anchor="middle" font-size="11" fill="#374151"></text>
<rect x="150" y="200" width="200" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="250.0" y="216.5" text-anchor="middle" font-size="11" fill="#374151">glBeginQuery(GL_TIME_ELAPSED,</text>
<text x="250.0" y="231.5" text-anchor="middle" font-size="11" fill="#374151">query[frame % 3])</text>
<rect x="410" y="200" width="200" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="510.0" y="216.5" text-anchor="middle" font-size="11" fill="#374151">glEndQuery(GL_TIME_ELAPSED)</text>
<text x="510.0" y="231.5" text-anchor="middle" font-size="11" fill="#374151">after the last draw</text>
<rect x="150" y="270" width="460" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="291.5" text-anchor="middle" font-size="11" fill="#065F46">Frame 2 reads query[(2 + 1) % 3], issued in frame 0:</text>
<text x="380.0" y="306.5" text-anchor="middle" font-size="11" fill="#065F46">glGetQueryObjectui64v checks QUERY_RESULT_AVAILABLE first, so the CPU never waits</text>
<text x="380" y="350" text-anchor="middle" font-size="11" fill="#4B5563">Three queries in flight cover the latency of a CPU that runs one to two frames ahead of the GPU.</text>
</svg>
