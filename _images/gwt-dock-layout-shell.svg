<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>The Bookshelf application shell drawn with GWT layout panels</title>
  <desc>A RootLayoutPanel fills the browser window and holds a DockLayoutPanel measured in em. Its north region (3 em) is the header, its south region (2 em) is the status bar, its west region (12 em) is a StackLayoutPanel with the Catalogue and Admin sections, and its center, which is always added last, is a SplitLayoutPanel. The split panel has a 220 pixel scrollable result list on the west, an 8 pixel draggable splitter and a TabLayoutPanel with the Details and Reviews tabs in the center. A column of numbered notes explains each panel, and an arrow shows how onResize flows from the root panel down to the scroll panels.</desc>
  <rect x="0" y="0" width="960" height="520" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">The Bookshelf shell: one DockLayoutPanel under the RootLayoutPanel</text>

  <!-- 1: RootLayoutPanel frame -->
  <rect x="24" y="48" width="620" height="448" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="36" y="68" font-size="12" font-weight="bold" fill="#334155">RootLayoutPanel.get()  (the browser window)</text>

  <!-- 2: dock regions -->
  <rect x="36" y="78" width="596" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="334" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">north  3 em</text>
  <text x="334" y="114" text-anchor="middle" font-size="12" fill="#1e3a8a">header Label "Bookshelf"</text>

  <rect x="36" y="440" width="596" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="334" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">south  2 em</text>
  <text x="334" y="476" text-anchor="middle" font-size="12" fill="#1e3a8a">status Label</text>

  <!-- 3: west stack -->
  <rect x="36" y="130" width="140" height="304" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="106" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">west  12 em</text>
  <text x="106" y="166" text-anchor="middle" font-size="12" fill="#78350f">StackLayoutPanel</text>
  <rect x="46" y="178" width="120" height="30" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="106" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">Catalogue (header)</text>
  <rect x="46" y="208" width="120" height="146" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="106" y="284" text-anchor="middle" font-size="12" fill="#78350f">shelves, search</text>
  <text x="106" y="300" text-anchor="middle" font-size="12" fill="#78350f">(visible stack)</text>
  <rect x="46" y="404" width="120" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="106" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">Admin (header)</text>

  <!-- 4: center split layout panel -->
  <rect x="182" y="130" width="450" height="304" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="407" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">center  (added last, takes the rest)</text>
  <text x="407" y="166" text-anchor="middle" font-size="12" fill="#312e81">SplitLayoutPanel</text>
  <rect x="192" y="176" width="130" height="248" rx="4" fill="#ede9fe" stroke="#4338ca" stroke-width="1.5"/>
  <text x="257" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">west  220 px</text>
  <text x="257" y="284" text-anchor="middle" font-size="12" fill="#312e81">ScrollPanel</text>
  <text x="257" y="300" text-anchor="middle" font-size="12" fill="#312e81">result list</text>
  <rect x="322" y="176" width="8" height="248" fill="#6366f1"/>
  <text x="326" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">splitter 8 px</text>

  <!-- 5: tab layout panel -->
  <rect x="330" y="176" width="292" height="248" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="338" y="184" width="86" height="28" rx="4" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <text x="381" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Details</text>
  <rect x="428" y="184" width="86" height="28" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="471" y="203" text-anchor="middle" font-size="12" fill="#14532d">Reviews</text>
    <rect x="338" y="216" width="276" height="200" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="476" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">TabLayoutPanel(2.5, EM)</text>
  <text x="476" y="312" text-anchor="middle" font-size="12" fill="#14532d">ScrollPanel with the</text>
  <text x="476" y="328" text-anchor="middle" font-size="12" fill="#14532d">selected tab's content</text>

  <!-- notes column -->
  <circle cx="676" cy="70" r="11" fill="#475569"/>
  <text x="676" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="696" y="68" font-size="13" font-weight="bold" fill="#0f172a">RootLayoutPanel</text>
  <text x="696" y="84" font-size="12" fill="#334155">fills the window, calls onResize()</text>
  <text x="696" y="98" font-size="12" fill="#334155">on every window resize</text>

  <circle cx="676" cy="136" r="11" fill="#1d4ed8"/>
  <text x="676" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="696" y="134" font-size="13" font-weight="bold" fill="#0f172a">DockLayoutPanel(Unit.EM)</text>
  <text x="696" y="150" font-size="12" fill="#334155">one unit for every child, explicit</text>
  <text x="696" y="164" font-size="12" fill="#334155">sizes, center must be added last</text>

  <circle cx="676" cy="204" r="11" fill="#b45309"/>
  <text x="676" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="696" y="202" font-size="13" font-weight="bold" fill="#0f172a">StackLayoutPanel</text>
  <text x="696" y="218" font-size="12" fill="#334155">one section open at a time, fixed</text>
  <text x="696" y="232" font-size="12" fill="#334155">2 em header per section</text>

  <circle cx="676" cy="272" r="11" fill="#4338ca"/>
  <text x="676" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="696" y="270" font-size="13" font-weight="bold" fill="#0f172a">SplitLayoutPanel</text>
  <text x="696" y="286" font-size="12" fill="#334155">pixel units only, draggable splitter,</text>
  <text x="696" y="300" font-size="12" fill="#334155">extends DockLayoutPanel</text>

  <circle cx="676" cy="340" r="11" fill="#15803d"/>
  <text x="676" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>
  <text x="696" y="338" font-size="13" font-weight="bold" fill="#0f172a">TabLayoutPanel</text>
  <text x="696" y="354" font-size="12" fill="#334155">explicit tab-bar height, one</text>
  <text x="696" y="368" font-size="12" fill="#334155">content widget shown at a time</text>

  <!-- resize flow -->
  <line x1="660" y1="404" x2="660" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="676" y="412" font-size="13" font-weight="bold" fill="#0f172a">onResize() flow</text>
  <text x="676" y="430" font-size="12" fill="#334155">Root, Dock, Split, Tab, ScrollPanel:</text>
  <text x="676" y="446" font-size="12" fill="#334155">every parent implements</text>
  <text x="676" y="462" font-size="12" fill="#334155">ProvidesResize and forwards to</text>
  <text x="676" y="478" font-size="12" fill="#334155">children that RequiresResize</text>
</svg>
