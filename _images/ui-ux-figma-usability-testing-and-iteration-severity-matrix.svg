<svg viewBox="0 0 720 380" width="720" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Findings severity matrix: impact against frequency</text>
<line x1="90" y1="330" x2="90" y2="56" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="90" y1="330" x2="470" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="280" y="362" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Frequency (participants affected)</text>
<text x="30" y="195" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle" transform="rotate(-90 30 195)">Impact on the task</text>
<rect x="100" y="60" width="180" height="125" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="280" y="60" width="180" height="125" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="100" y="185" width="180" height="135" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<rect x="280" y="185" width="180" height="135" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190" y="82" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Serious but rare</text>
<text x="370" y="82" font-size="12" font-weight="bold" fill="#B91C1C" text-anchor="middle">Critical: fix first</text>
<text x="190" y="207" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Minor: backlog</text>
<text x="370" y="207" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Frequent annoyance</text>
<circle cx="350" cy="120" r="11" fill="#B45309"/><text x="350" y="124" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="170" cy="130" r="11" fill="#4F46E5"/><text x="170" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="390" cy="260" r="11" fill="#4F46E5"/><text x="390" y="264" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="180" cy="270" r="11" fill="#4F46E5"/><text x="180" y="274" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="490" y="90" font-size="13" font-weight="bold" fill="#3730A3">Example findings</text>
<text x="490" y="116" font-size="12" fill="#374151">1 Review button not found</text>
<text x="490" y="132" font-size="12" fill="#374151">  (4 of 5 failed task 3)</text>
<text x="490" y="160" font-size="12" fill="#374151">2 Star rating unreadable</text>
<text x="490" y="176" font-size="12" fill="#374151">  (1 of 5, blocks review)</text>
<text x="490" y="204" font-size="12" fill="#374151">3 Shelf count not updated</text>
<text x="490" y="220" font-size="12" fill="#374151">  (3 of 5, recovered)</text>
<text x="490" y="248" font-size="12" fill="#374151">4 Cover crops oddly</text>
<text x="490" y="264" font-size="12" fill="#374151">  (1 of 5, cosmetic)</text>
</svg>
