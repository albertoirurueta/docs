<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Arial, Helvetica, sans-serif">
<title>Packed and aligned structured dtype layouts</title>
<desc>Byte layout of one record of the dtype flag u1, x f8, n i2. The packed layout uses 11 bytes with x at offset 1; the aligned layout uses 24 bytes with padding so x starts at offset 8 and n at offset 16.</desc>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="30" y="34" font-size="20" font-weight="bold" fill="#0F172A">One record of [("flag","u1"), ("x","f8"), ("n","i2")]</text>
<text x="30" y="76" font-size="16" font-weight="bold" fill="#0F172A">align=False (packed)</text>
<rect x="30" y="90" width="24" height="40" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="54" y="90" width="192" height="40" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="150.0" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">x</text>
<rect x="246" y="90" width="48" height="40" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="270.0" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">n</text>
<text x="30" y="150" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">0</text>
<text x="54" y="150" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">1</text>
<text x="246" y="150" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">9</text>
<text x="304" y="132" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">itemsize 11</text>
<text x="30" y="170" font-size="12" fill="#475569">Fields follow each other with no gaps: x starts at byte 1, so it is not 8-byte aligned.</text>
<text x="30" y="186" font-size="16" font-weight="bold" fill="#0F172A">align=True (C-struct style)</text>
<rect x="30" y="200" width="24" height="40" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="54" y="200" width="168" height="40" rx="3" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="138.0" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">pad</text>
<rect x="222" y="200" width="192" height="40" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="318.0" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">x</text>
<rect x="414" y="200" width="48" height="40" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="438.0" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">n</text>
<rect x="462" y="200" width="144" height="40" rx="3" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="534.0" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">pad</text>
<text x="30" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">0</text>
<text x="222" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">8</text>
<text x="414" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">16</text>
<text x="616" y="242" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">itemsize 24</text>
<text x="30" y="280" font-size="12" fill="#475569">Padding (rose) puts each field on its natural boundary and rounds itemsize up to a multiple of 8.</text>
</svg>