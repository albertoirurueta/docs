<svg viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="430" fill="#fbfbf9"/>

  <text x="490" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Event-storming board -- the running domain, design level (happy path)</text>
  <text x="490" y="44" font-size="10.5" fill="#666666" text-anchor="middle">blue = command, yellow = aggregate, orange = domain event -- read left to right along the timeline</text>

  <defs>
    <marker id="es-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- timeline arrow -->
  <line x1="45" y1="405" x2="955" y2="405" stroke="#999999" stroke-width="1.4" marker-end="url(#es-arrow)"/>
  <text x="955" y="420" font-size="9" fill="#777777" text-anchor="end">time</text>

  <!-- Column 1: Order / PlaceOrder -->
  <g>
    <rect x="30" y="65" width="150" height="46" rx="6" fill="#cfe3f7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="105" y="86" font-size="10.5" fill="#123a5c" text-anchor="middle" font-weight="bold">PlaceOrderCommand</text>
    <text x="105" y="100" font-size="8.5" fill="#123a5c" text-anchor="middle">actor: customer</text>

    <rect x="30" y="180" width="150" height="46" rx="6" fill="#fdf1b8" stroke="#8a6d1a" stroke-width="1.6"/>
    <text x="105" y="207" font-size="12" fill="#5c4a10" text-anchor="middle" font-weight="bold">Order</text>

    <rect x="30" y="295" width="150" height="46" rx="6" fill="#f8cfa0" stroke="#a66a1e" stroke-width="1.6"/>
    <text x="105" y="322" font-size="10.5" fill="#7a4a10" text-anchor="middle" font-weight="bold">OrderPlaced</text>

    <line x1="105" y1="111" x2="105" y2="180" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="105" y1="226" x2="105" y2="295" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
  </g>

  <!-- Column 2: Inventory / ReserveInventory -->
  <g>
    <rect x="215" y="65" width="150" height="46" rx="6" fill="#cfe3f7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="290" y="86" font-size="10" fill="#123a5c" text-anchor="middle" font-weight="bold">ReserveInventoryCommand</text>
    <text x="290" y="100" font-size="8.5" fill="#123a5c" text-anchor="middle">policy: on OrderPlaced</text>

    <rect x="215" y="180" width="150" height="46" rx="6" fill="#fdf1b8" stroke="#8a6d1a" stroke-width="1.6"/>
    <text x="290" y="207" font-size="12" fill="#5c4a10" text-anchor="middle" font-weight="bold">Inventory</text>

    <rect x="215" y="295" width="150" height="46" rx="6" fill="#f8cfa0" stroke="#a66a1e" stroke-width="1.6"/>
    <text x="290" y="322" font-size="10" fill="#7a4a10" text-anchor="middle" font-weight="bold">InventoryReserved</text>

    <line x1="290" y1="111" x2="290" y2="180" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="290" y1="226" x2="290" y2="295" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="180" y1="318" x2="215" y2="88" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#es-arrow)"/>
  </g>

  <!-- Column 3: Payment / AuthorizePayment -->
  <g>
    <rect x="400" y="65" width="150" height="46" rx="6" fill="#cfe3f7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="475" y="86" font-size="10" fill="#123a5c" text-anchor="middle" font-weight="bold">AuthorizePaymentCommand</text>
    <text x="475" y="100" font-size="8.5" fill="#123a5c" text-anchor="middle">policy: on InventoryReserved</text>

    <rect x="400" y="180" width="150" height="46" rx="6" fill="#fdf1b8" stroke="#8a6d1a" stroke-width="1.6"/>
    <text x="475" y="207" font-size="12" fill="#5c4a10" text-anchor="middle" font-weight="bold">Payment</text>

    <rect x="400" y="295" width="150" height="46" rx="6" fill="#f8cfa0" stroke="#a66a1e" stroke-width="1.6"/>
    <text x="475" y="322" font-size="10" fill="#7a4a10" text-anchor="middle" font-weight="bold">PaymentAuthorized</text>

    <line x1="475" y1="111" x2="475" y2="180" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="475" y1="226" x2="475" y2="295" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="365" y1="318" x2="400" y2="88" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#es-arrow)"/>
  </g>

  <!-- Column 4: Shipping / ScheduleShipping -->
  <g>
    <rect x="585" y="65" width="150" height="46" rx="6" fill="#cfe3f7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="660" y="86" font-size="10" fill="#123a5c" text-anchor="middle" font-weight="bold">ScheduleShippingCommand</text>
    <text x="660" y="100" font-size="8.5" fill="#123a5c" text-anchor="middle">policy: on PaymentAuthorized</text>

    <rect x="585" y="180" width="150" height="46" rx="6" fill="#fdf1b8" stroke="#8a6d1a" stroke-width="1.6"/>
    <text x="660" y="207" font-size="12" fill="#5c4a10" text-anchor="middle" font-weight="bold">Shipping</text>

    <rect x="585" y="295" width="150" height="46" rx="6" fill="#f8cfa0" stroke="#a66a1e" stroke-width="1.6"/>
    <text x="660" y="322" font-size="10" fill="#7a4a10" text-anchor="middle" font-weight="bold">ShipmentScheduled</text>

    <line x1="660" y1="111" x2="660" y2="180" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="660" y1="226" x2="660" y2="295" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="550" y1="318" x2="585" y2="88" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#es-arrow)"/>
  </g>

  <!-- Column 5: Order / ApproveOrder -->
  <g>
    <rect x="770" y="65" width="150" height="46" rx="6" fill="#cfe3f7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="845" y="86" font-size="10" fill="#123a5c" text-anchor="middle" font-weight="bold">ApproveOrderCommand</text>
    <text x="845" y="100" font-size="8.5" fill="#123a5c" text-anchor="middle">policy: on ShipmentScheduled</text>

    <rect x="770" y="180" width="150" height="46" rx="6" fill="#fdf1b8" stroke="#8a6d1a" stroke-width="1.6"/>
    <text x="845" y="207" font-size="12" fill="#5c4a10" text-anchor="middle" font-weight="bold">Order</text>

    <rect x="770" y="295" width="150" height="46" rx="6" fill="#f8cfa0" stroke="#a66a1e" stroke-width="1.6"/>
    <text x="845" y="322" font-size="10" fill="#7a4a10" text-anchor="middle" font-weight="bold">OrderApproved</text>

    <line x1="845" y1="111" x2="845" y2="180" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="845" y1="226" x2="845" y2="295" stroke="#777777" stroke-width="1.2" marker-end="url(#es-arrow)"/>
    <line x1="735" y1="318" x2="770" y2="88" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#es-arrow)"/>
  </g>

  <!-- legend -->
  <rect x="30" y="365" width="16" height="14" rx="2" fill="#cfe3f7" stroke="#1c4b73"/>
  <text x="52" y="376" font-size="9.5" fill="#333333">command</text>
  <rect x="130" y="365" width="16" height="14" rx="2" fill="#fdf1b8" stroke="#8a6d1a"/>
  <text x="152" y="376" font-size="9.5" fill="#333333">aggregate</text>
  <rect x="235" y="365" width="16" height="14" rx="2" fill="#f8cfa0" stroke="#a66a1e"/>
  <text x="257" y="376" font-size="9.5" fill="#333333">domain event</text>
  <line x1="345" y1="372" x2="375" y2="372" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#es-arrow)"/>
  <text x="382" y="376" font-size="9.5" fill="#333333">policy: event triggers next command</text>
</svg>
