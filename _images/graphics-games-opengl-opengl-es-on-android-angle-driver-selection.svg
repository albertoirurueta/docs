<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-es-on-android-angle-driver-selection" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Which GLES driver your app gets on Android</text>
<rect x="20" y="56" width="236" height="206" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="138" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Android 14 and earlier</text>
<text x="32" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">The vendor GLES driver</text>
<text x="32" y="125" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">serves OpenGL ES.</text>
<text x="32" y="142" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<text x="32" y="159" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Behavior and bugs differ</text>
<text x="32" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">per GPU vendor.</text>
<rect x="262" y="56" width="236" height="206" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Android 15 and up</text>
<text x="274" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">ANGLE is included as an</text>
<text x="274" y="125" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">optional layer: GLES on</text>
<text x="274" y="142" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">top of Vulkan.</text>
<text x="274" y="159" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<text x="274" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Test with adb settings:</text>
<text x="274" y="193" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">angle_gl_driver_selection_pkgs</text>
<text x="274" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">angle_gl_driver_selection_values</text>
<rect x="504" y="56" width="236" height="206" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="622" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Android 17 and up</text>
<text x="516" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Manifest meta-data requests</text>
<text x="516" y="125" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">ANGLE as the GLES driver:</text>
<text x="516" y="142" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">com.android.graphics.driver</text>
<text x="516" y="159" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">  .prefer_angle = true</text>
<text x="516" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="start"></text>
<text x="516" y="193" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">A hint, not a guarantee;</text>
<text x="516" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">the vendor driver is the fallback.</text>
<line x1="256" y1="159" x2="262" y2="159" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-angle-driver-selection)"/>
<line x1="498" y1="159" x2="504" y2="159" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-es-on-android-angle-driver-selection)"/>
<rect x="20" y="284" width="720" height="48" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="305" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Direction: ANGLE shipped as the GL system driver on more new devices; for new projects Android recommends Vulkan.</text>
<text x="380" y="322" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Checked in November 2026 against the Android Developers Vulkan overview.</text>
</svg>
