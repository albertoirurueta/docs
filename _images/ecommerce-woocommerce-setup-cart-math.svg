<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">How the Pocket Coffee cart total is built in WooCommerce</title>
  <desc id="d">A cart with two kilos of Colombia Huila espresso beans at 29.90 and one starter kit at 24.00, all prices including 21 percent VAT. The Coffee Club coupon takes 10 percent off the beans. Free shipping and flat rate are both offered; the one listed first is selected, which changes the total from 77.82 to 83.75.</desc>
  <rect x="15" y="20" width="300" height="230" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="165.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Cart lines (prices include VAT)</text>
  <text x="165.0" y="68" text-anchor="middle" font-size="12.5">2 x Single-origin beans 1 kg</text>
  <text x="165.0" y="94" text-anchor="middle" font-size="12.5">Colombia Huila, espresso: 59.80</text>
  <text x="165.0" y="120" text-anchor="middle" font-size="12.5">1 x Starter kit: 24.00</text>
  <text x="165.0" y="146" text-anchor="middle" font-size="12.5">lines total: 83.80</text>
  <text x="165.0" y="172" text-anchor="middle" font-size="12.5">net of VAT: 69.25 + 14.55 tax</text>
  <path d="M315 135 L345 135" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="347" y="20" width="300" height="230" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="497.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Coffee Club coupon, 10% on Beans</text>
  <text x="497.0" y="68" text-anchor="middle" font-size="12.5">10% off category Beans only</text>
  <text x="497.0" y="94" text-anchor="middle" font-size="12.5">discount incl. VAT: 5.98</text>
  <text x="497.0" y="120" text-anchor="middle" font-size="12.5">(4.94 net + 1.04 tax)</text>
  <text x="497.0" y="146" text-anchor="middle" font-size="12.5">the kit is not discounted</text>
  <text x="497.0" y="172" text-anchor="middle" font-size="12.5">price after discount: 77.82</text>
  <path d="M647 135 L677 135" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="679" y="20" width="316" height="230" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="837.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Shipping to Spain</text>
  <text x="837.0" y="68" text-anchor="middle" font-size="12.5">free shipping: 0.00 (from 40)</text>
  <text x="837.0" y="94" text-anchor="middle" font-size="12.5">flat rate: 4.90 + 21% = 5.93</text>
  <text x="837.0" y="120" text-anchor="middle" font-size="12.5">the method listed first in</text>
  <text x="837.0" y="146" text-anchor="middle" font-size="12.5">the zone is preselected</text>
  <text x="837.0" y="172" text-anchor="middle" font-size="12.5">the other stays a choice</text>
  <rect x="15" y="275" width="485" height="205" rx="10" fill="#e74c3c" fill-opacity="0.14" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="257" y="303" text-anchor="middle" font-weight="bold">Flat rate listed first (default zone order)</text>
  <text x="40" y="335" font-size="14">77.82 (goods after coupon)</text>
  <text x="40" y="365" font-size="14">+ 5.93 shipping (4.90 net + 21% VAT)</text>
  <text x="40" y="395" font-size="14">= 83.75 total</text>
  <text x="40" y="425" font-size="14">total tax shown: 14.54</text>
  <rect x="515" y="275" width="480" height="205" rx="10" fill="#2ecc71" fill-opacity="0.14" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="755" y="303" text-anchor="middle" font-weight="bold">Free shipping moved first</text>
  <text x="540" y="335" font-size="14">77.82 (goods after coupon)</text>
  <text x="540" y="365" font-size="14">+ 0.00 shipping</text>
  <text x="540" y="395" font-size="14">= 77.82 total</text>
  <text x="540" y="425" font-size="14">total tax shown: 13.51</text>
</svg>
