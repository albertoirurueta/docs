<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <title id="t">Layers of an embedded app in App Home</title>
  <desc id="d">The Shopify admin frame holds App Bridge web components such as the title bar and the app navigation. Inside it the app iframe renders Polaris web components and talks to the shopify global from the App Bridge script. The app backend receives requests that carry an ID token, and the Admin GraphQL API is reachable from the iframe through the shopify:admin URL scheme.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="740" height="330" rx="14" fill="#7f8c8d" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
  <text x="28" y="36" font-weight="bold" font-size="16">Shopify admin (host page)</text>

  <rect x="28" y="52" width="704" height="64" rx="10" fill="#3498db" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="44" y="78" font-weight="bold">App Bridge web components</text>
  <text x="44" y="100" font-size="13">title bar (s-page slots), app navigation (s-app-nav), save bar (data-save-bar), app window</text>
  <text x="716" y="78" text-anchor="end" font-size="12" opacity="0.8">rendered by the admin, outside the iframe</text>

  <rect x="28" y="132" width="704" height="196" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="156" font-weight="bold">App iframe (your app, hosted by you)</text>

  <rect x="44" y="170" width="330" height="146" rx="10" fill="#27ae60" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="60" y="194" font-weight="bold">Polaris web components</text>
  <text x="60" y="216" font-size="13">s-page, s-section, s-stack, s-grid</text>
  <text x="60" y="236" font-size="13">s-button, s-text-field, s-table, s-modal</text>
  <text x="60" y="262" font-size="13">loaded from polaris-2.js (or polaris-1.js)</text>
  <text x="60" y="282" font-size="13">shadow DOM, styled by the CDN bundle</text>
  <text x="60" y="302" font-size="12" opacity="0.8">React, Preact or plain HTML</text>

  <rect x="392" y="170" width="324" height="146" rx="10" fill="#e67e22" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="408" y="194" font-weight="bold">App Bridge script and shopify global</text>
  <text x="408" y="216" font-size="13">shopify.toast, shopify.modal, shopify.loading</text>
  <text x="408" y="236" font-size="13">shopify.resourcePicker, shopify.intents</text>
  <text x="408" y="256" font-size="13">shopify.idToken(), shopify.scopes, shopify.config</text>
  <text x="408" y="282" font-size="13">fetch interceptor adds the ID token</text>
  <text x="408" y="302" font-size="12" opacity="0.8">app-bridge.js, never versioned in the URL</text>

  <rect x="28" y="372" width="330" height="70" rx="10" fill="#9b59b6" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="44" y="398" font-weight="bold">Your backend</text>
  <text x="44" y="420" font-size="13">verifies the ID token, then exchanges it</text>
  <text x="44" y="436" font-size="13">for an access token (token exchange)</text>

  <rect x="402" y="372" width="330" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="418" y="398" font-weight="bold">Admin GraphQL API</text>
  <text x="418" y="420" font-size="13">from the iframe: fetch shopify:admin/api/graphql.json</text>
  <text x="418" y="436" font-size="13">from the backend: access token</text>

  <path d="M210,316 L210,370" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="218" y="352" font-size="12">fetch with ID token</text>
  <path d="M554,316 L554,370" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="562" y="352" font-size="12">direct API access</text>
  <path d="M374,243 L390,243" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
