<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A slice header over its backing array: s = append(s, 4, 5)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the header is three words (pointer, length, capacity); when append needs more room than the capacity it allocates a new, larger array</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <line x1="470" y1="64" x2="470" y2="420" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="82">Before: s := make([]int, 3, 4)</text>
    <text x="705" y="82">After: s = append(s, 4, 5)  (needs 5 &gt; cap 4)</text>
  </g>
  <text x="40" y="112" font-size="12" font-weight="bold" fill="#555555">slice header (s)</text>
  <text x="200" y="112" font-size="12" font-weight="bold" fill="#555555">backing array</text>
  <g font-size="13" fill="#222222">
    <rect x="40" y="124" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="50" y="143">ptr</text>
    <rect x="40" y="152" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="50" y="171">len 3</text>
    <rect x="40" y="180" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="50" y="199">cap 4</text>
    <g font-family="Courier New, monospace" font-size="14">
      <rect x="200" y="124" width="50" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="225.0" y="146.0" text-anchor="middle" fill="#222222">1</text>
      <rect x="250" y="124" width="50" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="275.0" y="146.0" text-anchor="middle" fill="#222222">2</text>
      <rect x="300" y="124" width="50" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="325.0" y="146.0" text-anchor="middle" fill="#222222">3</text>
      <rect x="350" y="124" width="50" height="34" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4,3"/>
    </g>
  </g>
  <line x1="130" y1="138" x2="196" y2="138" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <g stroke="#555555" fill="none"><path d="M200,170 v6 h150 v-6"/><path d="M200,196 v6 h200 v-6"/></g>
  <g font-size="12" fill="#444444" text-anchor="middle">
    <text x="275" y="192">len = 3 (elements s[0], s[1], s[2])</text>
    <text x="300" y="218">cap = 4 (spare room for one more element)</text>
    <text x="235" y="262">append can write in place while len stays within cap;</text>
    <text x="235" y="278">every slice sharing this array sees those writes</text>
  </g>
  <text x="510" y="112" font-size="12" font-weight="bold" fill="#555555">slice header (s)</text>
  <text x="640" y="112" font-size="12" font-weight="bold" fill="#555555">new backing array (allocated by append)</text>
  <g font-size="13" fill="#222222">
    <rect x="510" y="124" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="520" y="143">ptr</text>
    <rect x="510" y="152" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="520" y="171">len 5</text>
    <rect x="510" y="180" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="520" y="199">cap 8</text>
    <g font-family="Courier New, monospace" font-size="14">
      <rect x="640" y="124" width="34" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="657.0" y="146.0" text-anchor="middle" fill="#222222">1</text>
      <rect x="674" y="124" width="34" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="691.0" y="146.0" text-anchor="middle" fill="#222222">2</text>
      <rect x="708" y="124" width="34" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="725.0" y="146.0" text-anchor="middle" fill="#222222">3</text>
      <rect x="742" y="124" width="34" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="759.0" y="146.0" text-anchor="middle" fill="#222222">4</text>
      <rect x="776" y="124" width="34" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="793.0" y="146.0" text-anchor="middle" fill="#222222">5</text>
      <rect x="810" y="124" width="34" height="34" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4,3"/>
      <rect x="844" y="124" width="34" height="34" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4,3"/>
      <rect x="878" y="124" width="34" height="34" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4,3"/>
    </g>
  </g>
  <line x1="600" y1="138" x2="636" y2="138" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <g stroke="#555555" fill="none"><path d="M640,170 v6 h170 v-6"/><path d="M640,196 v6 h272 v-6"/></g>
  <g font-size="12" fill="#444444" text-anchor="middle">
    <text x="725" y="192">len = 5</text>
    <text x="776" y="218">cap = 8 (the runtime picks the new capacity)</text>
  </g>
  <text x="510" y="262" font-size="12" font-weight="bold" fill="#555555">old backing array (cap 4)</text>
  <g font-family="Courier New, monospace" font-size="14" fill="#999999">
    <rect x="510" y="274" width="50" height="34" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="535.0" y="296.0" text-anchor="middle" fill="#999999">1</text>
    <rect x="560" y="274" width="50" height="34" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="585.0" y="296.0" text-anchor="middle" fill="#999999">2</text>
    <rect x="610" y="274" width="50" height="34" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="635.0" y="296.0" text-anchor="middle" fill="#999999">3</text>
    <rect x="660" y="274" width="50" height="34" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/>
  </g>
  <g font-size="12" fill="#444444">
    <text x="510" y="332">append copied 1, 2, 3 into the new array and added 4 and 5.</text>
    <text x="510" y="348">The old array is no longer reachable through s; another slice that</text>
    <text x="510" y="364">still points at it keeps it alive, and no longer sees later writes via s.</text>
    <text x="510" y="392" fill="#c62828">Always keep the result: s = append(s, ...), never discard it.</text>
  </g>
</svg>