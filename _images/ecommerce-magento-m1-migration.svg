<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Magento 1 to Magento 2 migration with the Data Migration Tool</title>
  <desc id="d">The tool reads a Magento 1 database and writes a fresh Magento 2 database. It runs three modes in order: settings, data and delta. Each step inside a mode runs an integrity check, a data transfer and a volume check, guided by XML map files. After the delta mode has caught up, the cutover puts Magento 1 in maintenance mode, starts Magento 2 cron, flushes caches, reindexes and changes DNS.</desc>
  <rect x="15" y="24" width="210" height="96" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="120" y="52" text-anchor="middle" font-weight="bold">Magento 1 database</text>
  <text x="120" y="74" text-anchor="middle" font-size="12">source: use a copy to test</text>
  <text x="120" y="90" text-anchor="middle" font-size="12">Open Source 1.6 to 1.9</text>
  <text x="120" y="106" text-anchor="middle" font-size="12">Commerce 1.11 to 1.14</text>
  <rect x="785" y="24" width="210" height="96" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="890" y="52" text-anchor="middle" font-weight="bold">Magento 2 database</text>
  <text x="890" y="74" text-anchor="middle" font-size="12">destination: a clean install</text>
  <text x="890" y="90" text-anchor="middle" font-size="12">no new products or</text>
  <text x="890" y="106" text-anchor="middle" font-size="12">categories before the run</text>
  <rect x="290" y="24" width="440" height="96" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="510" y="50" text-anchor="middle" font-weight="bold">Data Migration Tool (bin/magento migrate:*)</text>
  <text x="510" y="72" text-anchor="middle" font-size="12">composer package magento/data-migration-tool</text>
  <text x="510" y="88" text-anchor="middle" font-size="12">version matches the Magento 2 codebase</text>
  <text x="510" y="104" text-anchor="middle" font-size="12">config.xml: both databases, crypt_key from local.xml</text>
  <path d="M225 72 L288 72" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M730 72 L783 72" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="15" y="156" width="215" height="148" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="122.5" y="182" text-anchor="middle" font-size="15" font-weight="bold">1. Settings</text>
  <text x="122.5" y="206" text-anchor="middle" font-size="12">migrate:settings</text>
  <text x="122.5" y="224" text-anchor="middle" font-size="12">stores, websites and</text>
  <text x="122.5" y="242" text-anchor="middle" font-size="12">system configuration</text>
  <text x="122.5" y="260" text-anchor="middle" font-size="12">about 10 min in</text>
  <text x="122.5" y="278" text-anchor="middle" font-size="12">Adobe&#x27;s benchmark</text>
  <path d="M230 230 L268 230" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="270" y="156" width="215" height="148" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="377.5" y="182" text-anchor="middle" font-size="15" font-weight="bold">2. Data</text>
  <text x="377.5" y="206" text-anchor="middle" font-size="12">migrate:data</text>
  <text x="377.5" y="224" text-anchor="middle" font-size="12">bulk copy of the tables</text>
  <text x="377.5" y="242" text-anchor="middle" font-size="12">adds m2_cl_* tables and</text>
  <text x="377.5" y="260" text-anchor="middle" font-size="12">triggers to Magento 1</text>
  <text x="377.5" y="278" text-anchor="middle" font-size="12">about 9 h for 177,000 products</text>
  <path d="M485 230 L523 230" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="525" y="156" width="215" height="148" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="632.5" y="182" text-anchor="middle" font-size="15" font-weight="bold">3. Delta</text>
  <text x="632.5" y="206" text-anchor="middle" font-size="12">migrate:delta</text>
  <text x="632.5" y="224" text-anchor="middle" font-size="12">changes since the data run:</text>
  <text x="632.5" y="242" text-anchor="middle" font-size="12">orders, customers, catalog</text>
  <text x="632.5" y="260" text-anchor="middle" font-size="12">restarts every 5 seconds</text>
  <text x="632.5" y="278" text-anchor="middle" font-size="12">stop with Ctrl-C</text>
  <path d="M740 230 L778 230" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="780" y="156" width="215" height="148" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="887.5" y="182" text-anchor="middle" font-size="15" font-weight="bold">4. Cutover</text>
  <text x="887.5" y="206" text-anchor="middle" font-size="12">Magento 1 to maintenance</text>
  <text x="887.5" y="224" text-anchor="middle" font-size="12">start Magento 2 cron</text>
  <text x="887.5" y="242" text-anchor="middle" font-size="12">cache:flush, indexer:reindex</text>
  <text x="887.5" y="260" text-anchor="middle" font-size="12">change DNS and load</text>
  <text x="887.5" y="278" text-anchor="middle" font-size="12">balancer to Magento 2</text>
  <text x="505" y="142" text-anchor="middle" font-size="12" opacity="0.85">three tool modes in this order, then the cutover by hand</text>
  <rect x="15" y="328" width="980" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="352" text-anchor="middle" font-size="13" font-weight="bold">Inside every step of a mode, three stages always run in this order</text>
  <text x="40" y="380" font-size="12.5">1. Integrity check: field names and types match</text>
  <text x="360" y="380" font-size="12.5">2. Data transfer: table by table</text>
  <text x="680" y="380" font-size="12.5">3. Volume check: record counts match</text>
  <rect x="15" y="416" width="980" height="68" rx="10" fill="#e74c3c" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="440" text-anchor="middle" font-size="13" font-weight="bold">Rules during the run</text>
  <text x="505" y="462" text-anchor="middle" font-size="12.5">no Admin changes in Magento 1 except orders, no code changes, no changes in Magento 2, stop Magento 1 cron</text>
</svg>
