<svg viewBox="0 0 760 336" width="760" height="336" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-cameras-and-projection-resize-aspect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="336" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Resizing the window: keep the vertical field of view, recompute the aspect</text>
<rect x="30" y="60" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="90.0" y="105.0" width="36.0" height="60.0" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="232" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">640 x 480</text>
<text x="130.0" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">aspect 1.33</text>
<rect x="280" y="60" width="260" height="150" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="358.0" y="105.0" width="46.8" height="60.0" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="410.0" y="232" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">960 x 540</text>
<text x="410.0" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">aspect 1.78, more width</text>
<rect x="590" y="60" width="120" height="200" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="626.0" y="120.0" width="21.599999999999998" height="80.0" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="282" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">420 x 600</text>
<text x="650.0" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">aspect 0.70, less width</text>
<text x="380" y="318" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Without updating the projection the book stretches: always rebuild P in the framebuffer-size callback.</text>
</svg>
