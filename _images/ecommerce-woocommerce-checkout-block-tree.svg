  <text x="514" y="662" font-size="11.5" fill="#f2f5f8">Inner block areas are the blocks a merchant can add your block to</text>
  <text x="514" y="680" font-size="11.5" fill="#f2f5f8">(registerCheckoutBlock reads the parent list of block.json).</text>
  <text x="514" y="698" font-size="11.5" fill="#f2f5f8">The Mini-Cart block has its own registry for scripts and data:</text>
  <text x="514" y="716" font-size="11.5" fill="#f2f5f8">woocommerce_blocks_mini-cart_block_registration.</text>
