<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Block tree of the Checkout and Cart blocks with the places extensions attach to</title>
  <desc id="d">Two columns of block names. The left column is the Checkout block: the checkout-fields block with express payment, contact information, shipping method, pickup options, shipping address, billing address, shipping methods, payment, additional information, order note, terms and actions, and the checkout-totals block with the order summary and its cart items, coupon form, subtotal, fee, discount, shipping and taxes. The right column is the Cart block: the filled-cart block with cart items (line items and cross-sells) and cart totals (order summary, express payment, proceed to checkout, accepted payment methods), and the empty-cart block. Blocks that accept extension inner blocks are marked, and the Slot and Fill locations are labelled on the blocks that render them.</desc>
  <rect x="0" y="0" width="960" height="760" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Where an extension can attach</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Block names as saved by WooCommerce 11.2.1. Amber: inner block areas. Teal: Slot and Fill locations.</text>
