<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="mpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="mpw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="mpg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A mip chain: each level halves the size down to 1 x 1</text>
<rect x="50" y="46.0" width="128" height="128" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="114.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">level 0</text>
<text x="114.0" y="114.0" text-anchor="middle" font-size="11" fill="#374151">256</text>
<rect x="188" y="62.0" width="96" height="96" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="236.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">1</text>
<text x="236.0" y="114.0" text-anchor="middle" font-size="11" fill="#374151">128</text>
<rect x="294" y="74.0" width="72" height="72" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="330.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">2</text>
<text x="330.0" y="114.0" text-anchor="middle" font-size="11" fill="#374151">64</text>
<rect x="376" y="84.0" width="52" height="52" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="402.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">3</text>
<text x="402.0" y="114.0" text-anchor="middle" font-size="11" fill="#374151">32</text>
<rect x="438" y="91.0" width="38" height="38" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="457.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">4</text>
<rect x="486" y="96.0" width="28" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="500.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">5</text>
<rect x="524" y="100.0" width="20" height="20" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="534.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">6</text>
<rect x="554" y="103.0" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="561.0" y="196" text-anchor="middle" font-size="11" fill="#3730A3">7+</text>
<text x="380" y="250" text-anchor="middle" font-size="12" fill="#1F2937">Level n has size max(1, floor(size / 2^n)); a full chain has floor(log2(max(w,h))) + 1 levels (9 for 256 x 256).</text>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="#1F2937">Total memory = 1 + 1/4 + 1/16 + ... = 4/3 of the base level (33 % extra).</text>
<text x="380" y="294" text-anchor="middle" font-size="12" fill="#374151">The sampler picks the level from the screen-space derivatives of the UV: far surfaces read small levels.</text>
<text x="380" y="316" text-anchor="middle" font-size="12" fill="#374151">This removes shimmering and keeps neighbouring texel reads local in the cache.</text>
</svg>
