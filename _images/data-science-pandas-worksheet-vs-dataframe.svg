<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">A spreadsheet sheet compared with a pandas DataFrame</title>
  <desc id="d">A small table with an index column on the left, three labelled columns, a row of data types under the headers and one empty cell shown as NaN. Numbered markers point to the DataFrame as a whole, a column as a Series, the index as the row headings, the dtype shared by a whole column and the NaN that replaces an empty cell.</desc>
