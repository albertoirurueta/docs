<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where Mermaid diagrams and math are rendered in a Docusaurus site</title>
  <desc id="d">A Markdown file with a mermaid code block and dollar math goes through the build. Math is converted to HTML by remark-math and rehype-katex at build time. The mermaid block is kept as a component and rendered to SVG in the browser by Mermaid, using the light or dark theme.</desc>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#2b3544"/>
  <rect x="20" y="115" width="170" height="100" rx="10" fill="#5b6b82" stroke="#cfd8e6" stroke-width="2"/>
  <text x="105" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Document</text>
  <text x="105" y="172" text-anchor="middle" font-size="12" fill="#ffffff">.md or .mdx file with</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#ffffff">mermaid fence and math</text>

  <rect x="290" y="30" width="200" height="90" rx="10" fill="#2f7d5b" stroke="#bfe8d5" stroke-width="2"/>
  <text x="390" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Build time</text>
  <text x="390" y="84" text-anchor="middle" font-size="12" fill="#ffffff">remark-math parses math</text>
  <text x="390" y="102" text-anchor="middle" font-size="12" fill="#ffffff">rehype-katex writes HTML</text>

  <rect x="290" y="210" width="200" height="90" rx="10" fill="#8a5a1f" stroke="#f1d3a6" stroke-width="2"/>
  <text x="390" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Build time</text>
  <text x="390" y="264" text-anchor="middle" font-size="12" fill="#ffffff">mermaid fence becomes</text>
  <text x="390" y="282" text-anchor="middle" font-size="12" fill="#ffffff">a Mermaid component</text>

  <rect x="560" y="30" width="180" height="90" rx="10" fill="#2f7d5b" stroke="#bfe8d5" stroke-width="2"/>
  <text x="650" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Static HTML</text>
  <text x="650" y="84" text-anchor="middle" font-size="12" fill="#ffffff">formulas styled by the</text>
  <text x="650" y="102" text-anchor="middle" font-size="12" fill="#ffffff">KaTeX stylesheet</text>

  <rect x="560" y="210" width="180" height="90" rx="10" fill="#8a5a1f" stroke="#f1d3a6" stroke-width="2"/>
  <text x="650" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Browser</text>
  <text x="650" y="264" text-anchor="middle" font-size="12" fill="#ffffff">Mermaid renders SVG,</text>
  <text x="650" y="282" text-anchor="middle" font-size="12" fill="#ffffff">theme follows color mode</text>

  <g stroke="#e6edf7" stroke-width="2.5" fill="none">
    <path d="M190 150 L240 150 L240 75 L286 75"/>
    <path d="M190 180 L240 180 L240 255 L286 255"/>
    <path d="M490 75 L556 75"/>
    <path d="M490 255 L556 255"/>
  </g>
  <g fill="#e6edf7">
    <polygon points="290,75 280,69 280,81"/>
    <polygon points="290,255 280,249 280,261"/>
    <polygon points="560,75 550,69 550,81"/>
    <polygon points="560,255 550,249 550,261"/>
  </g>
</svg>
