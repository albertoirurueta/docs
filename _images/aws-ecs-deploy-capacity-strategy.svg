<svg viewBox="0 0 900 400" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Capacity provider strategy: base, weight and the Spot share</text>

  <text x="40" y="62" font-size="13" font-weight="700" fill="#333">Service desired count = 10, strategy: FARGATE base=2 weight=1, FARGATE_SPOT weight=3</text>

  <text x="40" y="100" font-size="12" fill="#333">Step 1: base tasks all go to FARGATE</text>
  <rect x="40" y="110" width="80" height="34" rx="4" fill="#1a73e8"/><text x="80" y="132" text-anchor="middle" font-size="11" fill="#fff">task 1</text>
  <rect x="126" y="110" width="80" height="34" rx="4" fill="#1a73e8"/><text x="166" y="132" text-anchor="middle" font-size="11" fill="#fff">task 2</text>

  <text x="40" y="186" font-size="12" fill="#333">Step 2: remaining 8 tasks split by weight 1 : 3 (2 on FARGATE, 6 on FARGATE_SPOT)</text>
  <rect x="40" y="196" width="80" height="34" rx="4" fill="#1a73e8"/><text x="80" y="218" text-anchor="middle" font-size="11" fill="#fff">task 3</text>
  <rect x="126" y="196" width="80" height="34" rx="4" fill="#1a73e8"/><text x="166" y="218" text-anchor="middle" font-size="11" fill="#fff">task 4</text>
  <rect x="212" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="252" y="218" text-anchor="middle" font-size="11" fill="#fff">task 5</text>
  <rect x="298" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="338" y="218" text-anchor="middle" font-size="11" fill="#fff">task 6</text>
  <rect x="384" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="424" y="218" text-anchor="middle" font-size="11" fill="#fff">task 7</text>
  <rect x="470" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="510" y="218" text-anchor="middle" font-size="11" fill="#fff">task 8</text>
  <rect x="556" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="596" y="218" text-anchor="middle" font-size="11" fill="#fff">task 9</text>
  <rect x="642" y="196" width="80" height="34" rx="4" fill="#e08a00"/><text x="682" y="218" text-anchor="middle" font-size="11" fill="#fff">task 10</text>

  <rect x="40" y="262" width="16" height="16" fill="#1a73e8"/><text x="64" y="275" font-size="12" fill="#333">FARGATE (on demand, not interrupted)</text>
  <rect x="330" y="262" width="16" height="16" fill="#e08a00"/><text x="354" y="275" font-size="12" fill="#333">FARGATE_SPOT (discounted, may be interrupted)</text>

  <rect x="40" y="300" width="820" height="70" rx="8" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="56" y="322" font-size="12" fill="#333">On a Spot interruption ECS sends SIGTERM to the container and waits up to its stopTimeout (a two-minute warning),</text>
  <text x="56" y="340" font-size="12" fill="#333">then the service scheduler starts a replacement by the same strategy. The two base tasks keep the service up</text>
  <text x="56" y="358" font-size="12" fill="#333">while Spot capacity is reclaimed. Scale-in also follows the strategy, keeping the base and the weights.</text>
</svg>
