<svg viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Export section of the right sidebar (schematic)</text>
<rect x="30" y="50" width="300" height="290" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="46" y="76" font-size="13" font-weight="bold" fill="#1F2937">Export</text>
<text x="300" y="78" font-size="18" font-weight="bold" fill="#4B5563" text-anchor="middle">+</text>
<rect x="46" y="92" width="268" height="34" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="56" y="114" font-size="12" fill="#374151">2x</text>
<rect x="100" y="98" width="70" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="135" y="113" font-size="12" fill="#3730A3" text-anchor="middle">@2x</text>
<rect x="182" y="98" width="60" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="212" y="113" font-size="12" fill="#3730A3" text-anchor="middle">PNG</text>
<rect x="46" y="134" width="268" height="34" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="56" y="156" font-size="12" fill="#374151">1x</text>
<rect x="100" y="140" width="70" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="135" y="155" font-size="12" fill="#3730A3" text-anchor="middle">(none)</text>
<rect x="182" y="140" width="60" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="212" y="155" font-size="12" fill="#3730A3" text-anchor="middle">SVG</text>
<text x="46" y="196" font-size="12" fill="#374151">SVG settings</text>
<rect x="46" y="206" width="14" height="14" rx="3" fill="#4F46E5"/><text x="68" y="218" font-size="12" fill="#374151">Include "id" attribute</text>
<rect x="46" y="228" width="14" height="14" rx="3" fill="#4F46E5"/><text x="68" y="240" font-size="12" fill="#374151">Outline text</text>
<rect x="46" y="250" width="14" height="14" rx="3" fill="#4F46E5"/><text x="68" y="262" font-size="12" fill="#374151">Simplify stroke</text>
<rect x="46" y="284" width="120" height="34" rx="6" fill="#4F46E5"/><text x="106" y="306" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Export logo</text>
<rect x="178" y="284" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="218" y="306" font-size="13" fill="#3730A3" text-anchor="middle">Preview</text>
<circle cx="344" cy="76" r="11" fill="#4F46E5"/><text x="344" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="344" cy="109" r="11" fill="#4F46E5"/><text x="344" y="113" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="344" cy="230" r="11" fill="#B45309"/><text x="344" y="234" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="344" cy="301" r="11" fill="#4F46E5"/><text x="344" y="305" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<g font-size="13" fill="#374151">
<text x="370" y="80"><tspan font-weight="bold">1 Plus:</tspan> add a configuration</text>
<text x="370" y="113"><tspan font-weight="bold">2 Row:</tspan> scale, suffix, format</text>
<text x="370" y="234"><tspan font-weight="bold">3 Format options:</tspan> only for SVG</text>
<text x="370" y="305"><tspan font-weight="bold">4 Export:</tspan> download all rows</text>
</g>
<text x="370" y="150" font-size="12" fill="#4B5563">One selection can carry several rows,</text>
<text x="370" y="168" font-size="12" fill="#4B5563">each producing its own file.</text>
</svg>
