<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgl2-advanced-features-array-textures" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Array and 3D textures: layers selected in the shader</text>
<rect x="50" y="110" width="110" height="110" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="64" y="100" width="110" height="110" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.5"/>
<rect x="78" y="90" width="110" height="110" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.5"/>
<rect x="92" y="80" width="110" height="110" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="110" y="215" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">TEXTURE_2D_ARRAY</text>
<text x="110" y="232" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">4 covers, same size</text>
<text x="110" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">texStorage3D(levels, RGBA8, 256, 256, 4)</text>
<rect x="330" y="110" width="110" height="110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" opacity="0.9"/>
<rect x="344" y="100" width="110" height="110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" opacity="0.9"/>
<rect x="358" y="90" width="110" height="110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" opacity="0.9"/>
<rect x="372" y="80" width="110" height="110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" opacity="0.9"/>
<text x="400" y="215" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">TEXTURE_3D</text>
<text x="400" y="232" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">a volume, filtered between slices</text>
<text x="400" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">texImage3D / texSubImage3D (depth = slices)</text>
<rect x="560" y="70" width="180" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650.0" y="96.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GLSL ES 3.00</text>
<text x="650.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">sampler2DArray</text>
<text x="650.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">texture(uCovers,</text>
<text x="650.0" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vec3(uv, layer))</text>
<rect x="560" y="180" width="180" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650.0" y="211.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">sampler3D</text>
<text x="650.0" y="226.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">texture(uVolume, uvw)</text>
<text x="380" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A WebGL 2 array texture holds many same-size images in one binding; layer index is a float in the shader.</text>
<text x="380" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Layers are not blended between each other; 3D textures are. Limit: MAX_ARRAY_TEXTURE_LAYERS (at least 256).</text>
</svg>
