<svg viewBox="0 0 740 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="480" fill="#ffffff"/>

  <text x="370" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Dynamic dispatch over a Shape hierarchy</text>
  <text x="370" y="46" font-size="11" fill="#666666" text-anchor="middle">A Shape reference bound to a Circle: the call s.area() runs Circle's implementation.</text>

  <!-- ===================== java.lang.Object ===================== -->
  <rect x="285" y="62" width="170" height="50" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" rx="4"/>
  <text x="370" y="82" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">java.lang.Object</text>
  <text x="370" y="99" font-size="9" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">toString() · equals() · hashCode()</text>

  <!-- ===================== interface Shape ===================== -->
  <rect x="70" y="160" width="185" height="66" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3" rx="4"/>
  <text x="162" y="178" font-size="9" fill="#4a6a8a" text-anchor="middle" font-style="italic">&#171;interface&#187;</text>
  <text x="162" y="195" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">Shape</text>
  <text x="162" y="213" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">double area();  // abstract</text>

  <!-- ===================== abstract class AbstractShape ===================== -->
  <rect x="300" y="160" width="215" height="66" fill="#f1eef6" stroke="#6a4a8a" stroke-width="1.3" rx="4"/>
  <text x="407" y="178" font-size="9" fill="#6a4a8a" text-anchor="middle" font-style="italic">&#171;abstract class&#187;</text>
  <text x="407" y="195" font-size="12" font-weight="bold" fill="#3a1f52" text-anchor="middle" font-family="'Courier New', monospace">AbstractShape</text>
  <text x="407" y="213" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">abstract area(); · printArea()</text>

  <!-- ===================== concrete Circle ===================== -->
  <rect x="200" y="280" width="185" height="64" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="4"/>
  <text x="292" y="299" font-size="9" fill="#5a8a4a" text-anchor="middle" font-style="italic">&#171;final class&#187;</text>
  <text x="292" y="316" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">Circle</text>
  <text x="292" y="334" font-size="8.5" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">area() { return Math.PI*r*r; }</text>

  <!-- ===================== concrete Rectangle ===================== -->
  <rect x="435" y="280" width="205" height="64" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="4"/>
  <text x="537" y="299" font-size="9" fill="#5a8a4a" text-anchor="middle" font-style="italic">&#171;final class&#187;</text>
  <text x="537" y="316" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">Rectangle</text>
  <text x="537" y="334" font-size="8.5" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">area() { return w * h; }</text>

  <!-- ===================== inheritance edges ===================== -->
  <!-- AbstractShape to Object (extends) -->
  <line x1="407" y1="160" x2="393" y2="118" stroke="#666666" stroke-width="1.3"/>
  <polygon points="386,118 400,118 393,104" fill="#ffffff" stroke="#666666" stroke-width="1.3"/>
  <text x="420" y="142" font-size="8.5" fill="#666666" text-anchor="start">extends</text>

  <!-- Shape ..|> Object (implicit root of the API) -->
  <line x1="180" y1="160" x2="300" y2="112" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,3"/>
  <polygon points="292,108 305,113 296,121" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="205" y="132" font-size="8.5" fill="#999999" text-anchor="start" font-style="italic">Object API implicit</text>

  <!-- AbstractShape ..|> Shape  (implements) -->
  <line x1="300" y1="193" x2="262" y2="193" stroke="#4a6a8a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="262,187 262,199 250,193" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="281" y="187" font-size="8.5" fill="#4a6a8a" text-anchor="middle">implements</text>

  <!-- Circle to AbstractShape (extends) -->
  <line x1="300" y1="280" x2="378" y2="228" stroke="#5a8a4a" stroke-width="1.4"/>
  <polygon points="371,224 384,224 380,236" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="316" y="256" font-size="8.5" fill="#5a8a4a" text-anchor="middle">extends</text>

  <!-- Rectangle to AbstractShape (extends) -->
  <line x1="537" y1="280" x2="452" y2="228" stroke="#5a8a4a" stroke-width="1.4"/>
  <polygon points="446,224 459,224 455,236" fill="#ffffff" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="520" y="256" font-size="8.5" fill="#5a8a4a" text-anchor="middle">extends</text>

  <!-- ===================== call site ===================== -->
  <rect x="150" y="392" width="330" height="72" fill="#fbfbf6" stroke="#c9b96a" stroke-width="1.3" rx="4"/>
  <text x="315" y="409" font-size="9" fill="#8a7a2a" text-anchor="middle" font-style="italic">call site &#8212; static type Shape, runtime type Circle</text>
  <text x="164" y="430" font-size="10.5" fill="#333333" text-anchor="start" font-family="'Courier New', monospace">Shape s = new Circle(2.0);</text>
  <text x="164" y="450" font-size="10.5" fill="#333333" text-anchor="start" font-family="'Courier New', monospace">double a = s.area();</text>

  <!-- dispatch arrow: s.area() resolves to Circle.area() -->
  <path d="M 315 392 C 315 372, 300 360, 292 344" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="286,350 298,346 293,334" fill="#2e7d32" stroke="none"/>
  <text x="500" y="418" font-size="10" fill="#2e7d32" text-anchor="start" font-weight="bold">virtual call</text>
  <text x="500" y="433" font-size="9" fill="#2e7d32" text-anchor="start">dispatches to</text>
  <text x="500" y="446" font-size="9" fill="#2e7d32" text-anchor="start" font-family="'Courier New', monospace">Circle.area()</text>
</svg>
