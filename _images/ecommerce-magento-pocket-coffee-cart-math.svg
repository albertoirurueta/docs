<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">How the Pocket Coffee cart total is built for a Coffee Club member</title>
  <desc id="d">A Coffee Club member in Spain buys two 250 g bags of Ethiopia beans at 9.90 euros each and one starter kit at 24.00 euros. Prices include VAT. Beans carry 10 percent VAT and the kit 21 percent. The Coffee Club rule takes 10 percent off the beans, 1.98 euros. The grand total is 41.82 euros, which includes 5.79 euros of VAT. Shipping then offers free shipping and the 4.90 euro flat rate.</desc>
  <rect x="15" y="24" width="232" height="150" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="131.0" y="50" text-anchor="middle" font-size="14.5" font-weight="bold">1. Lines</text>
  <text x="131.0" y="78" text-anchor="middle" font-size="12.5">2 x Single-origin beans, 250 g</text>
  <text x="131.0" y="102" text-anchor="middle" font-size="12.5">Ethiopia: 2 x 9.90 = 19.80</text>
  <text x="131.0" y="126" text-anchor="middle" font-size="12.5">1 x Starter kit: 24.00</text>
  <text x="131.0" y="150" text-anchor="middle" font-size="12.5">subtotal incl. VAT 43.80</text>
  <path d="M247 99 L265 99" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="267" y="24" width="232" height="150" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="383.0" y="50" text-anchor="middle" font-size="14.5" font-weight="bold">2. VAT inside the prices</text>
  <text x="383.0" y="78" text-anchor="middle" font-size="12.5">beans: tax class Food, 10%</text>
  <text x="383.0" y="102" text-anchor="middle" font-size="12.5">net 18.00, VAT 1.80</text>
  <text x="383.0" y="126" text-anchor="middle" font-size="12.5">kit: Taxable Goods, 21%</text>
  <text x="383.0" y="150" text-anchor="middle" font-size="12.5">net 19.83, VAT 4.17</text>
  <path d="M499 99 L517 99" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="519" y="24" width="232" height="150" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="635.0" y="50" text-anchor="middle" font-size="14.5" font-weight="bold">3. Coffee Club rule</text>
  <text x="635.0" y="78" text-anchor="middle" font-size="12.5">group Coffee Club and</text>
  <text x="635.0" y="102" text-anchor="middle" font-size="12.5">category Beans: 10% off</text>
  <text x="635.0" y="126" text-anchor="middle" font-size="12.5">beans only: -1.98</text>
  <text x="635.0" y="150" text-anchor="middle" font-size="12.5">kit is not discounted</text>
  <path d="M751 99 L769 99" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="771" y="24" width="232" height="150" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="887.0" y="50" text-anchor="middle" font-size="14.5" font-weight="bold">4. Totals</text>
  <text x="887.0" y="78" text-anchor="middle" font-size="12.5">subtotal excl. VAT 37.83</text>
  <text x="887.0" y="102" text-anchor="middle" font-size="12.5">VAT after discount 5.79</text>
  <text x="887.0" y="126" text-anchor="middle" font-size="12.5">(beans 1.62 + kit 4.17)</text>
  <text x="887.0" y="150" text-anchor="middle" font-size="12.5">grand total 41.82</text>
  <rect x="15" y="202" width="980" height="150" rx="10" fill="#9b59b6" fill-opacity="0.12" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="228" text-anchor="middle" font-size="14.5" font-weight="bold">5. Shipping offered at different cart values (Spain 28001 unless stated)</text>
  <text x="40" y="260" font-size="12.5">Guest, subtotal incl. VAT 33.90</text>
  <text x="380" y="260" font-size="12.5">below the threshold 40: flat rate 4.90 only</text>
  <text x="40" y="284" font-size="12.5">Guest, subtotal incl. VAT 43.80</text>
  <text x="380" y="284" font-size="12.5">free shipping 0.00 and flat rate 4.90</text>
  <text x="40" y="308" font-size="12.5">Member, 41.82 after the discount</text>
  <text x="380" y="308" font-size="12.5">threshold 40 or 38: free and flat rate; threshold 42: flat rate only</text>
  <text x="40" y="332" font-size="12.5">6 kg parcel to Germany</text>
  <text x="380" y="332" font-size="12.5">table rate 9.90; no weight limit is enforced</text>
  <rect x="15" y="376" width="980" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="402" text-anchor="middle" font-size="13.5" font-weight="bold">Zone rules behind these numbers (Stores &gt; Configuration &gt; Sales &gt; Delivery Methods)</text>
  <text x="40" y="430" font-size="12.5">flat rate: per order 4.90, allowed country ES</text>
  <text x="40" y="452" font-size="12.5">free shipping: subtotal threshold 40, country ES</text>
  <text x="520" y="430" font-size="12.5">table rates: rows per country, 9.90, countries DE FR IT PT NL BE</text>
  <text x="520" y="452" font-size="12.5">threshold compared with the subtotal incl. VAT after discount</text>
</svg>
