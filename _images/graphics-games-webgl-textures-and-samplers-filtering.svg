<text x="605.0" y="253.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend by fraction of LOD</text>
<text x="605" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">picks the level from the</text>
<text x="605" y="311" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">screen footprint (minification)</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Default MIN_FILTER is NEAREST_MIPMAP_LINEAR: without mipmaps the texture is incomplete and samples black.</text>
