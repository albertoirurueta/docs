<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="460" fill="#ffffff"/>
<defs>
<marker id="sv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
<marker id="sv-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b3261e"/></marker>
</defs>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The same ISBN-provider quota of 100 calls per day, three replicas of bookshelf-service</text>
<line x1="480" y1="48" x2="480" y2="440" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6,5"/>

<text x="240" y="62" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="middle">Per-instance buckets (local Bucket)</text>
<g>
<rect x="30" y="85" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="95" y="105" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 1</text>
<rect x="45" y="116" width="100" height="52" rx="6" fill="#ffffff" stroke="#b34700" stroke-width="1.5"/>
<text x="95" y="136" font-size="11" fill="#444444" text-anchor="middle">own bucket</text>
<text x="95" y="154" font-size="12" font-weight="bold" fill="#b34700" text-anchor="middle">100 per day</text>
<rect x="30" y="205" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="95" y="225" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 2</text>
<rect x="45" y="236" width="100" height="52" rx="6" fill="#ffffff" stroke="#b34700" stroke-width="1.5"/>
<text x="95" y="256" font-size="11" fill="#444444" text-anchor="middle">own bucket</text>
<text x="95" y="274" font-size="12" font-weight="bold" fill="#b34700" text-anchor="middle">100 per day</text>
<rect x="30" y="325" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="95" y="345" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 3</text>
<rect x="45" y="356" width="100" height="52" rx="6" fill="#ffffff" stroke="#b34700" stroke-width="1.5"/>
<text x="95" y="376" font-size="11" fill="#444444" text-anchor="middle">own bucket</text>
<text x="95" y="394" font-size="12" font-weight="bold" fill="#b34700" text-anchor="middle">100 per day</text>
</g>
<line x1="160" y1="132" x2="320" y2="230" stroke="#b3261e" stroke-width="2" marker-end="url(#sv-arrow-red)"/>
<line x1="160" y1="252" x2="320" y2="252" stroke="#b3261e" stroke-width="2" marker-end="url(#sv-arrow-red)"/>
<line x1="160" y1="372" x2="320" y2="274" stroke="#b3261e" stroke-width="2" marker-end="url(#sv-arrow-red)"/>
<rect x="320" y="190" width="130" height="125" rx="8" fill="#fbeaea" stroke="#b3261e" stroke-width="2"/>
<text x="385" y="215" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">ISBN provider</text>
<text x="385" y="238" font-size="11" fill="#444444" text-anchor="middle">quota: 100 / day</text>
<text x="385" y="262" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">300 calls arrive</text>
<text x="385" y="282" font-size="11" fill="#444444" text-anchor="middle">3 x 100, quota</text>
<text x="385" y="298" font-size="11" fill="#444444" text-anchor="middle">exceeded 3 times</text>
<text x="240" y="440" font-size="12" fill="#444444" text-anchor="middle">the limit multiplies with the number of replicas</text>

<text x="720" y="62" font-size="14" font-weight="bold" fill="#2a7d3f" text-anchor="middle">One shared bucket (ProxyManager)</text>
<g>
<rect x="510" y="85" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="575" y="105" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 1</text>
<text x="575" y="132" font-size="11" fill="#444444" text-anchor="middle">BucketProxy</text>
<text x="575" y="150" font-size="11" fill="#444444" text-anchor="middle">key "quota:isbn"</text>
<rect x="510" y="205" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="575" y="225" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 2</text>
<text x="575" y="252" font-size="11" fill="#444444" text-anchor="middle">BucketProxy</text>
<text x="575" y="270" font-size="11" fill="#444444" text-anchor="middle">key "quota:isbn"</text>
<rect x="510" y="325" width="130" height="95" rx="8" fill="#f7f7f7" stroke="#1c4b73" stroke-width="1.5"/>
<text x="575" y="345" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">replica 3</text>
<text x="575" y="372" font-size="11" fill="#444444" text-anchor="middle">BucketProxy</text>
<text x="575" y="390" font-size="11" fill="#444444" text-anchor="middle">key "quota:isbn"</text>
</g>
<line x1="640" y1="132" x2="715" y2="215" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<line x1="640" y1="252" x2="715" y2="252" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<line x1="640" y1="372" x2="715" y2="289" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="715" y="170" width="215" height="165" rx="10" fill="#eaf5ec" stroke="#2a7d3f" stroke-width="2"/>
<text x="822" y="195" font-size="13" font-weight="bold" fill="#2a7d3f" text-anchor="middle">Shared store</text>
<text x="822" y="212" font-size="11" fill="#444444" text-anchor="middle">Redis, PostgreSQL, a data grid...</text>
<rect x="737" y="225" width="170" height="52" rx="6" fill="#ffffff" stroke="#b34700" stroke-width="1.5"/>
<text x="822" y="246" font-size="11" fill="#444444" text-anchor="middle">bucket "quota:isbn"</text>
<text x="822" y="264" font-size="12" font-weight="bold" fill="#b34700" text-anchor="middle">100 per day, one state</text>
<text x="822" y="300" font-size="12" font-weight="bold" fill="#2a7d3f" text-anchor="middle">100 calls admitted in total</text>
<text x="822" y="318" font-size="11" fill="#444444" text-anchor="middle">atomic read-modify-write per call</text>
<text x="720" y="440" font-size="12" fill="#444444" text-anchor="middle">the limit holds however many replicas run</text>
</svg>
