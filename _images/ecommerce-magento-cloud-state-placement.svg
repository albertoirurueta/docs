<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Where each kind of Magento state goes in the tiered design</title>
<desc id="d">Four columns. Baked into the image: code, app/etc/config.php, generated code and static files. Managed services: the database, the OpenSearch index, two Valkey groups for cache and sessions, RabbitMQ messages, media on S3 or EFS and locks in the database. Per pod and disposable: var in an emptyDir, logs on standard output, the maintenance flag file. Configuration and one-shot work: env.php as a read-only ConfigMap reading environment variables, secrets from Secrets Manager, crypt/key as a reference, setup:upgrade as a pre-upgrade Job, one cron CronJob and consumers as Deployments.</desc>
<rect x="0" y="0" width="960" height="460" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Where the state goes: image, services, pod, configuration</text>
<rect x="30" y="56" width="218" height="36" rx="9" fill="#3f6e9a"/><text x="139" y="79" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Baked into the image</text>
<rect x="30" y="102" width="218" height="44" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="139" y="121" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Code: vendor/, app/code, modules,</text>
<text x="139" y="136" font-size="11.5" fill="#f2f5f8" text-anchor="middle">themes</text>
<rect x="30" y="154" width="218" height="44" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="139" y="173" font-size="11.5" fill="#f2f5f8" text-anchor="middle">app/etc/config.php</text>
<text x="139" y="188" font-size="11.5" fill="#f2f5f8" text-anchor="middle">(app:config:dump)</text>
<rect x="30" y="206" width="218" height="44" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="139" y="232" font-size="11.5" fill="#f2f5f8" text-anchor="middle">generated/ (setup:di:compile)</text>
<rect x="30" y="258" width="218" height="44" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="139" y="284" font-size="11.5" fill="#f2f5f8" text-anchor="middle">pub/static (static-content:deploy)</text>
<rect x="30" y="310" width="218" height="44" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="139" y="329" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Composer auth is a build secret</text>
<text x="139" y="344" font-size="11.5" fill="#f2f5f8" text-anchor="middle">only</text>
<rect x="262" y="56" width="218" height="36" rx="9" fill="#4d7c5a"/><text x="371" y="79" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Managed services</text>
<rect x="262" y="102" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="121" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Catalog, orders, customers,</text>
<text x="371" y="136" font-size="11.5" fill="#f2f5f8" text-anchor="middle">config: RDS</text>
<rect x="262" y="154" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="180" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Search index: OpenSearch</text>
<rect x="262" y="206" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="225" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Cache and sessions: two Valkey</text>
<text x="371" y="240" font-size="11.5" fill="#f2f5f8" text-anchor="middle">groups</text>
<rect x="262" y="258" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="284" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Queue messages: RabbitMQ</text>
<rect x="262" y="310" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="336" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Media: S3 (remote storage) or EFS</text>
<rect x="262" y="362" width="218" height="44" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="371" y="388" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Locks: database (GET_LOCK)</text>
<rect x="494" y="56" width="218" height="36" rx="9" fill="#2f4a44"/><text x="603" y="79" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Per pod, disposable</text>
<rect x="494" y="102" width="218" height="44" rx="8" fill="#33485c" stroke="#2f4a44" stroke-width="1.5"/>
<text x="603" y="121" font-size="11.5" fill="#f2f5f8" text-anchor="middle">var/ in an emptyDir (tmp, log,</text>
<text x="603" y="136" font-size="11.5" fill="#f2f5f8" text-anchor="middle">report)</text>
<rect x="494" y="154" width="218" height="44" rx="8" fill="#33485c" stroke="#2f4a44" stroke-width="1.5"/>
<text x="603" y="180" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Nothing a restart may not lose</text>
<rect x="494" y="206" width="218" height="44" rx="8" fill="#33485c" stroke="#2f4a44" stroke-width="1.5"/>
<text x="603" y="232" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Logs go to stdout and stderr</text>
<rect x="494" y="258" width="218" height="44" rx="8" fill="#33485c" stroke="#2f4a44" stroke-width="1.5"/>
<text x="603" y="277" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Maintenance flag file: per pod</text>
<text x="603" y="292" font-size="11.5" fill="#f2f5f8" text-anchor="middle">(verify)</text>
<rect x="726" y="56" width="218" height="36" rx="9" fill="#7a5c3a"/><text x="835" y="79" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Configuration and one-shot work</text>
<rect x="726" y="102" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="121" font-size="11.5" fill="#f2f5f8" text-anchor="middle">app/etc/env.php: read-only</text>
<text x="835" y="136" font-size="11.5" fill="#f2f5f8" text-anchor="middle">ConfigMap with getenv()</text>
<rect x="726" y="154" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="173" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Secrets: Secrets Manager via</text>
<text x="835" y="188" font-size="11.5" fill="#f2f5f8" text-anchor="middle">ExternalSecret</text>
<rect x="726" y="206" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="225" font-size="11.5" fill="#f2f5f8" text-anchor="middle">crypt/key: a reference, same on</text>
<text x="835" y="240" font-size="11.5" fill="#f2f5f8" text-anchor="middle">every pod</text>
<rect x="726" y="258" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="284" font-size="11.5" fill="#f2f5f8" text-anchor="middle">setup:upgrade: a pre-upgrade Job</text>
<rect x="726" y="310" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="336" font-size="11.5" fill="#f2f5f8" text-anchor="middle">cron:run: one CronJob</text>
<rect x="726" y="362" width="218" height="44" rx="8" fill="#33485c" stroke="#7a5c3a" stroke-width="1.5"/>
<text x="835" y="388" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Consumers: Deployments, not cron</text>
<text x="30" y="440" font-size="11.5" fill="#9fd3c7">Rule: a pod that is killed at any moment must lose nothing; everything it needs comes from the image, the services or its configuration.</text>
</svg>