<svg viewBox="0 0 940 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="430" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two ways to receive an upload in Vapor</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">chosen per route with the body parameter; memory use is the difference</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- lane A -->
  <rect x="20" y="62" width="900" height="150" rx="10" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="36" y="84" font-size="14" font-weight="bold" fill="#1f5f99">A. body: .collect(maxSize: "6mb") - the whole body is in memory before the handler runs</text>

  <rect x="36" y="104" width="130" height="64" rx="8" fill="#ffffff" stroke="#1f5f99"/>
  <text x="101" y="130" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Client</text>
  <text x="101" y="148" font-size="11" fill="#222222" text-anchor="middle">multipart/form-data</text>

  <rect x="206" y="104" width="170" height="64" rx="8" fill="#ffffff" stroke="#1f5f99"/>
  <text x="291" y="126" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Server buffers it</text>
  <text x="291" y="144" font-size="11" fill="#222222" text-anchor="middle">larger than maxSize:</text>
  <text x="291" y="159" font-size="11" fill="#b7410e" text-anchor="middle">413 Payload Too Large</text>

  <rect x="416" y="104" width="170" height="64" rx="8" fill="#ffffff" stroke="#1f5f99"/>
  <text x="501" y="126" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">req.content.decode</text>
  <text x="501" y="144" font-size="11" fill="#222222" text-anchor="middle">Content struct with</text>
  <text x="501" y="159" font-size="11" fill="#222222" text-anchor="middle">File { filename, data }</text>

  <rect x="626" y="104" width="130" height="64" rx="8" fill="#ffffff" stroke="#1f5f99"/>
  <text x="691" y="126" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Validate</text>
  <text x="691" y="144" font-size="11" fill="#222222" text-anchor="middle">size, signature,</text>
  <text x="691" y="159" font-size="11" fill="#222222" text-anchor="middle">owner</text>

  <rect x="796" y="104" width="110" height="64" rx="8" fill="#ffffff" stroke="#1f5f99"/>
  <text x="851" y="130" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Store</text>
  <text x="851" y="148" font-size="11" fill="#222222" text-anchor="middle">disk or S3</text>

  <line x1="166" y1="136" x2="204" y2="136" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="376" y1="136" x2="414" y2="136" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="586" y1="136" x2="624" y2="136" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="756" y1="136" x2="794" y2="136" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="470" y="196" font-size="11" fill="#222222" text-anchor="middle">simple and fine for avatars and covers; peak memory is the body size times the number of concurrent uploads</text>

  <!-- lane B -->
  <rect x="20" y="222" width="900" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="36" y="244" font-size="14" font-weight="bold" fill="#2e7d32">B. body: .stream - the handler starts at the headers and reads chunk by chunk</text>

  <rect x="36" y="264" width="130" height="64" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="101" y="290" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Client</text>
  <text x="101" y="308" font-size="11" fill="#222222" text-anchor="middle">raw or multipart</text>

  <rect x="206" y="264" width="170" height="64" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="291" y="286" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">for try await chunk</text>
  <text x="291" y="304" font-size="11" fill="#222222" text-anchor="middle">in req.body</text>
  <text x="291" y="319" font-size="11" fill="#222222" text-anchor="middle">(back-pressure)</text>

  <rect x="416" y="264" width="170" height="64" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="501" y="286" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Inspect each chunk</text>
  <text x="501" y="304" font-size="11" fill="#222222" text-anchor="middle">running size, first bytes,</text>
  <text x="501" y="319" font-size="11" fill="#222222" text-anchor="middle">SHA-256</text>

  <rect x="626" y="264" width="130" height="64" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="691" y="286" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Write the chunk</text>
  <text x="691" y="304" font-size="11" fill="#222222" text-anchor="middle">.part file or</text>
  <text x="691" y="319" font-size="11" fill="#222222" text-anchor="middle">S3 part</text>

  <rect x="796" y="264" width="110" height="64" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="851" y="286" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Finish</text>
  <text x="851" y="304" font-size="11" fill="#222222" text-anchor="middle">rename, then</text>
  <text x="851" y="319" font-size="11" fill="#222222" text-anchor="middle">record in DB</text>

  <line x1="166" y1="296" x2="204" y2="296" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="376" y1="296" x2="414" y2="296" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="586" y1="296" x2="624" y2="296" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="756" y1="296" x2="794" y2="296" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- loop and error -->
  <path d="M691,264 L691,252 L291,252 L291,262" fill="none" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="500" y="262" font-size="10" fill="#444444" text-anchor="middle">next chunk</text>
  <path d="M501,328 L501,366 L851,366" fill="none" stroke="#b7410e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="676" y="360" font-size="11" fill="#b7410e" text-anchor="middle">limit exceeded or wrong type: abort, delete the partial file, 413 or 415</text>
  <text x="470" y="392" font-size="11" fill="#222222" text-anchor="middle">no server-side limit applies to .stream: the handler must enforce its own, and reject a large Content-Length early</text>
</svg>
