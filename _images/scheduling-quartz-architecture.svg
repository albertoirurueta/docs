<svg viewBox="0 0 950 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="950" height="560" fill="#ffffff"/>
  <text x="475" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Quartz components: the scheduler thread fires, the thread pool runs, the job store remembers</text>
  <defs>
    <marker id="qa-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="qa-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#777777"/>
    </marker>
  </defs>

  <!-- application side -->
  <text x="99" y="76" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Your application</text>
  <rect x="14" y="90" width="170" height="86" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="99" y="112" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">SchedulerFactory</text>
  <text x="99" y="130" font-size="10.5" fill="#444444" text-anchor="middle">StdSchedulerFactory</text>
  <text x="99" y="144" font-size="10.5" fill="#444444" text-anchor="middle">(reads properties)</text>
  <text x="99" y="160" font-size="10.5" fill="#444444" text-anchor="middle">DirectSchedulerFactory (code)</text>
  <rect x="14" y="204" width="170" height="86" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="99" y="226" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JobDetail + Trigger</text>
  <text x="99" y="244" font-size="10.5" fill="#444444" text-anchor="middle">built with JobBuilder and</text>
  <text x="99" y="258" font-size="10.5" fill="#444444" text-anchor="middle">TriggerBuilder, then</text>
  <text x="99" y="274" font-size="10.5" fill="#444444" text-anchor="middle">scheduleJob(job, trigger)</text>
  <rect x="14" y="342" width="170" height="86" rx="7" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="99" y="364" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Your Job class</text>
  <text x="99" y="382" font-size="10.5" fill="#444444" text-anchor="middle">implements Job</text>
  <text x="99" y="396" font-size="10.5" fill="#444444" text-anchor="middle">execute(JobExecutionContext)</text>
  <text x="99" y="412" font-size="10.5" fill="#444444" text-anchor="middle">named by the JobDetail</text>
  <line x1="184" y1="133" x2="224" y2="133" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#qa-arrow)"/>
  <line x1="184" y1="247" x2="224" y2="247" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#qa-arrow)"/>
  <line x1="184" y1="385" x2="256" y2="385" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#qa-arrow-grey)"/>

  <!-- scheduler container -->
  <rect x="226" y="58" width="434" height="430" rx="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="443" y="78" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Scheduler (a StdScheduler handle delegating to QuartzScheduler)</text>

  <rect x="244" y="94" width="398" height="76" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="443" y="114" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="443" y="133" font-size="10.5" fill="#444444" text-anchor="middle">loop: wait for a free worker, acquire the next triggers,</text>
  <text x="443" y="148" font-size="10.5" fill="#444444" text-anchor="middle">sleep until the first fire time, mark them fired, hand each one over.</text>
  <text x="443" y="163" font-size="10.5" fill="#444444" text-anchor="middle">It never runs job code.</text>

  <rect x="244" y="198" width="194" height="86" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="341" y="218" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JobFactory</text>
  <text x="341" y="236" font-size="10.5" fill="#444444" text-anchor="middle">newJob(bundle, scheduler)</text>
  <text x="341" y="251" font-size="10.5" fill="#444444" text-anchor="middle">builds a new Job instance for</text>
  <text x="341" y="266" font-size="10.5" fill="#444444" text-anchor="middle">every firing; default is</text>
  <text x="341" y="279" font-size="10.5" fill="#444444" text-anchor="middle">PropertySettingJobFactory</text>

  <rect x="454" y="198" width="188" height="86" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="548" y="218" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ListenerManager</text>
  <text x="548" y="236" font-size="10.5" fill="#444444" text-anchor="middle">JobListener, TriggerListener,</text>
  <text x="548" y="251" font-size="10.5" fill="#444444" text-anchor="middle">SchedulerListener, and</text>
  <text x="548" y="266" font-size="10.5" fill="#444444" text-anchor="middle">SchedulerPlugin instances</text>
  <text x="548" y="279" font-size="10.5" fill="#444444" text-anchor="middle">(started with the scheduler)</text>

  <rect x="244" y="322" width="398" height="152" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="443" y="342" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JobRunShell (one per firing, runs on a worker thread)</text>
  <rect x="256" y="356" width="150" height="104" rx="5" fill="#ffffff" stroke="#a8641a" stroke-width="1.3"/>
  <text x="331" y="380" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Job instance</text>
  <text x="331" y="398" font-size="10.5" fill="#444444" text-anchor="middle">new object per</text>
  <text x="331" y="412" font-size="10.5" fill="#444444" text-anchor="middle">execution; its fields</text>
  <text x="331" y="426" font-size="10.5" fill="#444444" text-anchor="middle">are never shared</text>
  <text x="331" y="440" font-size="10.5" fill="#444444" text-anchor="middle">between firings</text>
  <text x="420" y="374" font-size="10.5" fill="#444444">1 TriggerListener.triggerFired (may veto)</text>
  <text x="420" y="390" font-size="10.5" fill="#444444">2 JobListener.jobToBeExecuted</text>
  <text x="420" y="406" font-size="10.5" fill="#444444">3 Job.execute(context)</text>
  <text x="420" y="422" font-size="10.5" fill="#444444">4 jobWasExecuted, executionComplete,</text>
  <text x="432" y="436" font-size="10.5" fill="#444444">triggerComplete</text>
  <text x="420" y="452" font-size="10.5" fill="#444444">5 JobStore.triggeredJobComplete</text>

  <line x1="341" y1="284" x2="341" y2="320" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#qa-arrow)"/>
  <text x="350" y="306" font-size="10" fill="#1c4b73">creates the Job</text>
  <line x1="548" y1="284" x2="548" y2="320" stroke="#777777" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#qa-arrow-grey)"/>
  <text x="557" y="306" font-size="10" fill="#555555">callbacks</text>

  <!-- right column -->
  <text x="845" y="76" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Pluggable parts</text>
  <rect x="760" y="94" width="180" height="190" rx="7" fill="#e6f3ea" stroke="#2b7a4b" stroke-width="1.4"/>
  <text x="850" y="116" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JobStore</text>
  <text x="850" y="136" font-size="10.5" fill="#444444" text-anchor="middle">where JobDetails, Triggers</text>
  <text x="850" y="150" font-size="10.5" fill="#444444" text-anchor="middle">and Calendars live</text>
  <text x="850" y="172" font-size="10.5" font-weight="bold" fill="#2b7a4b" text-anchor="middle">RAMJobStore</text>
  <text x="850" y="186" font-size="10" fill="#444444" text-anchor="middle">memory, lost on restart</text>
  <text x="850" y="206" font-size="10.5" font-weight="bold" fill="#2b7a4b" text-anchor="middle">JobStoreTX, JobStoreCMT</text>
  <text x="850" y="220" font-size="10" fill="#444444" text-anchor="middle">JDBC, QRTZ_ tables, can cluster</text>
  <text x="850" y="240" font-size="10.5" font-weight="bold" fill="#2b7a4b" text-anchor="middle">LocalDataSourceJobStore</text>
  <text x="850" y="254" font-size="10" fill="#444444" text-anchor="middle">the Spring variant of CMT</text>
  <text x="850" y="272" font-size="10" fill="#444444" text-anchor="middle">or a community store</text>

  <rect x="760" y="322" width="180" height="152" rx="7" fill="#e6f3ea" stroke="#2b7a4b" stroke-width="1.4"/>
  <text x="850" y="344" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ThreadPool</text>
  <text x="850" y="366" font-size="10.5" fill="#444444" text-anchor="middle">runInThread(Runnable)</text>
  <text x="850" y="382" font-size="10.5" fill="#444444" text-anchor="middle">blockForAvailableThreads()</text>
  <text x="850" y="404" font-size="10.5" font-weight="bold" fill="#2b7a4b" text-anchor="middle">SimpleThreadPool</text>
  <text x="850" y="418" font-size="10" fill="#444444" text-anchor="middle">threadCount set in config,</text>
  <text x="850" y="432" font-size="10" fill="#444444" text-anchor="middle">(10 in the bundled defaults)</text>
  <text x="850" y="446" font-size="10" fill="#444444" text-anchor="middle">workers: name_Worker-1, -2, ...</text>
  <text x="850" y="464" font-size="10" fill="#444444" text-anchor="middle">or Spring's own pool adapter</text>

  <!-- arrows to the right column -->
  <line x1="642" y1="132" x2="758" y2="132" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#qa-arrow)"/>
  <text x="684" y="112" font-size="10" fill="#1c4b73" text-anchor="middle">acquire,</text>
  <text x="684" y="124" font-size="10" fill="#1c4b73" text-anchor="middle">fire</text>
  <path d="M700,132 L700,346 L758,346" fill="none" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#qa-arrow)"/>
  <circle cx="700" cy="132" r="3" fill="#1c4b73"/>
  <text x="708" y="300" font-size="10" fill="#1c4b73">runInThread</text>
  <text x="708" y="313" font-size="10" fill="#1c4b73">(shell)</text>
  <line x1="758" y1="420" x2="644" y2="420" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#qa-arrow-grey)"/>
  <text x="702" y="412" font-size="10" fill="#555555" text-anchor="middle">a worker</text>
  <text x="702" y="436" font-size="10" fill="#555555" text-anchor="middle">runs the shell</text>

  <!-- footer -->
  <text x="475" y="520" font-size="11.5" fill="#444444" text-anchor="middle">Solid arrows are calls the scheduler makes or that you make on it; dashed arrows show instantiation, callbacks and execution.</text>
  <text x="475" y="538" font-size="11.5" fill="#444444" text-anchor="middle">The JobStore and the ThreadPool are replaced by setting a class name in the configuration; the JobFactory by one scheduler call or property.</text>
</svg>
