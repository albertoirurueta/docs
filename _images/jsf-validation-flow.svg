<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What UIInput.validate() does for one input during Process Validations</title>
  <desc id="d">The submitted string is converted, then the required check runs, then the validators run in order: the validator attribute method, the nested validator tags, and the default validators. A conversion or required failure skips the validators. A valid input stores its local value and may queue a value change event. An invalid input queues a message, is marked invalid and the lifecycle jumps to Render Response. The postValidate event is published after the children of a component have been validated.</desc>
  <defs>
    <marker id="v-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="v-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a12622"/></marker>
    <marker id="v-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b34"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Validation of one input in the Process Validations phase</text>
  <text x="500" y="48" font-size="12" fill="#666666" text-anchor="middle">UIInput.validate(), left to right; the red arrows are the failure exits</text>

  <rect x="20" y="76" width="200" height="118" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="120" y="102" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Submitted value</text>
  <text x="120" y="124" font-size="11" fill="#444444" text-anchor="middle">a String from the request</text>
  <text x="120" y="141" font-size="11" fill="#444444" text-anchor="middle">null: nothing was submitted,</text>
  <text x="120" y="158" font-size="11" fill="#444444" text-anchor="middle">validation is skipped</text>
  <text x="120" y="180" font-size="11" fill="#444444" text-anchor="middle">"": an empty value</text>

  <line x1="220" y1="135" x2="248" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#v-k)"/>

  <rect x="250" y="76" width="200" height="118" rx="6" fill="#fdf1e0" stroke="#b4530a" stroke-width="1.6"/>
  <text x="350" y="102" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">1. Convert</text>
  <text x="350" y="124" font-size="11" fill="#444444" text-anchor="middle">the converter of the component,</text>
  <text x="350" y="141" font-size="11" fill="#444444" text-anchor="middle">or one registered for the type</text>
  <text x="350" y="158" font-size="11" fill="#444444" text-anchor="middle">of the value expression</text>
  <text x="350" y="180" font-size="11" fill="#a12622" text-anchor="middle">fails: converterMessage</text>

  <line x1="450" y1="135" x2="478" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#v-k)"/>

  <rect x="480" y="76" width="200" height="118" rx="6" fill="#fdf1e0" stroke="#b4530a" stroke-width="1.6"/>
  <text x="580" y="102" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">2. Required</text>
  <text x="580" y="124" font-size="11" fill="#444444" text-anchor="middle">required="true" and</text>
  <text x="580" y="141" font-size="11" fill="#444444" text-anchor="middle">f:validateRequired:</text>
  <text x="580" y="158" font-size="11" fill="#444444" text-anchor="middle">an empty value fails</text>
  <text x="580" y="180" font-size="11" fill="#a12622" text-anchor="middle">fails: requiredMessage</text>

  <line x1="680" y1="135" x2="708" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#v-k)"/>

  <rect x="710" y="76" width="270" height="170" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="845" y="102" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">3. Validators, in this order</text>
  <text x="845" y="126" font-size="11" fill="#444444" text-anchor="middle">a. the validator attribute (method)</text>
  <text x="845" y="145" font-size="11" fill="#444444" text-anchor="middle">b. nested f:validate* / f:validator tags</text>
  <text x="845" y="164" font-size="11" fill="#444444" text-anchor="middle">c. default validators</text>
  <text x="845" y="181" font-size="11" fill="#444444" text-anchor="middle">(Bean Validation, isDefault=true)</text>
  <text x="845" y="206" font-size="11" fill="#444444" text-anchor="middle">every validator runs even if an</text>
  <text x="845" y="222" font-size="11" fill="#444444" text-anchor="middle">earlier one threw ValidatorException;</text>
  <text x="845" y="238" font-size="11" fill="#a12622" text-anchor="middle">validatorMessage replaces all messages</text>

  <path d="M350 194 L350 302" stroke="#a12622" stroke-width="2" fill="none" marker-end="url(#v-r)"/>
  <path d="M580 194 L580 302" stroke="#a12622" stroke-width="2" fill="none" marker-end="url(#v-r)"/>
  <path d="M740 246 L740 274 L700 274 L700 302" stroke="#a12622" stroke-width="2" fill="none" marker-end="url(#v-r)"/>
  <path d="M900 246 L900 302" stroke="#1e6b34" stroke-width="2" fill="none" marker-end="url(#v-g)"/>
  <text x="908" y="276" font-size="11" fill="#1e6b34">all checks passed</text>

  <rect x="20" y="302" width="210" height="96" rx="6" fill="#f3f3f3" stroke="#666666" stroke-width="1.4"/>
  <text x="125" y="328" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">postValidate event</text>
  <text x="125" y="348" font-size="11" fill="#444444" text-anchor="middle">published on a parent after</text>
  <text x="125" y="364" font-size="11" fill="#444444" text-anchor="middle">its children were validated,</text>
  <text x="125" y="380" font-size="11" fill="#444444" text-anchor="middle">for example on the form</text>

  <rect x="250" y="302" width="470" height="96" rx="6" fill="#fbe9e8" stroke="#a12622" stroke-width="1.6"/>
  <text x="485" y="328" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Invalid</text>
  <text x="485" y="350" font-size="11" fill="#444444" text-anchor="middle">queue the FacesMessage, mark the component invalid, call renderResponse():</text>
  <text x="485" y="367" font-size="11" fill="#444444" text-anchor="middle">Update Model Values and Invoke Application are skipped, and the page is</text>
  <text x="485" y="384" font-size="11" fill="#444444" text-anchor="middle">rendered again with the submitted values and the messages</text>

  <rect x="740" y="302" width="240" height="96" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="860" y="328" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Valid</text>
  <text x="860" y="350" font-size="11" fill="#444444" text-anchor="middle">store the local value, clear the</text>
  <text x="860" y="367" font-size="11" fill="#444444" text-anchor="middle">submitted value, queue a</text>
  <text x="860" y="384" font-size="11" fill="#444444" text-anchor="middle">ValueChangeEvent if it changed</text>

  <text x="500" y="424" font-size="11" fill="#666666" text-anchor="middle">The order of a. and b. was observed on Mojarra 4.1.17 and MyFaces 4.1.4</text>
</svg>
