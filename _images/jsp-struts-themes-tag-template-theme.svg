<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a Struts UI tag to HTML: tag, theme, template</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">Example: &lt;s:textfield name="title"/&gt; on a page that ends up using the css_xhtml theme (Struts 7.4.0)</text>

  <!-- 1 tag -->
  <rect x="20" y="70" width="190" height="96" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="115" y="92" font-size="12" font-weight="bold" fill="#133a75" text-anchor="middle">1. The tag</text>
  <text x="115" y="112" font-size="11" fill="#133a75" text-anchor="middle">s:textfield (a UIBean)</text>
  <text x="115" y="130" font-size="11" fill="#133a75" text-anchor="middle">maps to template name</text>
  <text x="115" y="148" font-size="11" font-weight="bold" fill="#133a75" text-anchor="middle">text</text>

  <!-- 2 theme selection -->
  <rect x="250" y="70" width="270" height="250" fill="#fef7e0" stroke="#a66b00" stroke-width="1.4"/>
  <text x="385" y="92" font-size="12" font-weight="bold" fill="#6b4500" text-anchor="middle">2. Pick the theme (first match wins)</text>
  <text x="264" y="118" font-size="11" fill="#6b4500">a. theme attribute on the tag</text>
  <text x="264" y="140" font-size="11" fill="#6b4500">b. theme attribute on the s:form</text>
  <text x="264" y="162" font-size="11" fill="#6b4500">c. page attribute "theme"</text>
  <text x="264" y="184" font-size="11" fill="#6b4500">d. request attribute "theme"</text>
  <text x="264" y="206" font-size="11" fill="#6b4500">e. session attribute "theme"</text>
  <text x="264" y="228" font-size="11" fill="#6b4500">f. application attribute "theme"</text>
  <text x="264" y="250" font-size="11" fill="#6b4500">g. constant struts.ui.theme</text>
  <text x="264" y="266" font-size="10" fill="#8a6a2a">   (default xhtml)</text>
  <text x="385" y="296" font-size="11" font-weight="bold" fill="#6b4500" text-anchor="middle">result here: css_xhtml</text>

  <!-- 3 chain -->
  <rect x="560" y="70" width="320" height="250" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="720" y="92" font-size="12" font-weight="bold" fill="#14501f" text-anchor="middle">3. Walk the theme chain (theme.properties)</text>
  <rect x="580" y="108" width="280" height="30" fill="#ffffff" stroke="#1e6b34"/>
  <text x="590" y="127" font-size="11" fill="#14501f">/template/css_xhtml/text.ftl</text>
  <text x="850" y="127" font-size="10" fill="#a00000" text-anchor="end">absent</text>
  <text x="720" y="156" font-size="10" fill="#1e6b34" text-anchor="middle">css_xhtml: parent = xhtml</text>
  <rect x="580" y="164" width="280" height="30" fill="#ffffff" stroke="#1e6b34"/>
  <text x="590" y="183" font-size="11" fill="#14501f">/template/xhtml/text.ftl</text>
  <text x="850" y="183" font-size="10" fill="#1e6b34" text-anchor="end" font-weight="bold">found, rendered</text>
  <text x="720" y="212" font-size="10" fill="#1e6b34" text-anchor="middle">xhtml: parent = simple (used for the partials)</text>
  <rect x="580" y="220" width="280" height="30" fill="#ffffff" stroke="#1e6b34"/>
  <text x="590" y="239" font-size="11" fill="#14501f">/template/simple/text.ftl</text>
  <text x="850" y="239" font-size="10" fill="#1e6b34" text-anchor="end">included by xhtml/text.ftl</text>
  <text x="720" y="274" font-size="10" fill="#14501f" text-anchor="middle">each path is looked up in the web application first,</text>
  <text x="720" y="290" font-size="10" fill="#14501f" text-anchor="middle">then on the classpath (struts2-core jar)</text>

  <!-- 4 composition -->
  <rect x="20" y="360" width="860" height="170" fill="#f3e8fd" stroke="#6b2fa0" stroke-width="1.4"/>
  <text x="450" y="382" font-size="12" font-weight="bold" fill="#43176b" text-anchor="middle">4. Inside xhtml/text.ftl the template wraps the bare control (the "wrapping" technique)</text>
  <rect x="40" y="402" width="230" height="50" fill="#ffffff" stroke="#6b2fa0"/>
  <text x="155" y="424" font-size="11" fill="#43176b" text-anchor="middle">controlheader.ftl</text>
  <text x="155" y="440" font-size="10" fill="#6b2fa0" text-anchor="middle">include of ${expandTheme}/ : child theme first</text>
  <rect x="335" y="402" width="230" height="50" fill="#ffffff" stroke="#6b2fa0"/>
  <text x="450" y="424" font-size="11" fill="#43176b" text-anchor="middle">simple/text.ftl</text>
  <text x="450" y="440" font-size="10" fill="#6b2fa0" text-anchor="middle">the bare input element</text>
  <rect x="630" y="402" width="230" height="50" fill="#ffffff" stroke="#6b2fa0"/>
  <text x="745" y="424" font-size="11" fill="#43176b" text-anchor="middle">controlfooter.ftl</text>
  <text x="745" y="440" font-size="10" fill="#6b2fa0" text-anchor="middle">include of ${expandTheme}/ : child theme first</text>
  <line x1="270" y1="427" x2="333" y2="427" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="565" y1="427" x2="628" y2="427" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="450" y="482" font-size="11" fill="#43176b" text-anchor="middle">css_xhtml supplies its own header and footer (div elements with class wwgrp, wwlbl and wwctrl),</text>
  <text x="450" y="500" font-size="11" fill="#43176b" text-anchor="middle">xhtml supplies table rows (tdLabel, tdInput), simple supplies neither: no label, no field error.</text>
  <text x="450" y="518" font-size="10" fill="#6b2fa0" text-anchor="middle">Overriding one file (for example css.ftl) in a theme that has a parent changes every template that includes it.</text>

  <!-- arrows -->
  <line x1="210" y1="118" x2="248" y2="118" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="118" x2="558" y2="118" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="720" y1="320" x2="720" y2="358" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
</svg>
