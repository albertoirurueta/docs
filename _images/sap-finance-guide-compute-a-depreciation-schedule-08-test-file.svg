<g><rect x="356" y="73" width="716" height="505" rx="2" fill="#1f1f1f" stroke="#3c3c3c" stroke-width="1"/><text x="368" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">1</text><text x="392" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">// The three worked examples of the SAP help pages for the methods.</text><text x="368" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">2</text><text x="392" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('SAP example: APC 1,000 over 10 years is 100 a year', () =&gt; {</text><text x="368" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">3</text><text x="392" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(evenAmount(100000, 10), 10000)</text><text x="368" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">4</text><text x="392" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">5</text><text x="392" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('SAP example: net book value 500 over 5 remaining years is 100', () =&gt; {</text><text x="368" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">6</text><text x="392" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(evenAmount(50000, 5), 10000)</text><text x="368" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">7</text><text x="392" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">8</text><text x="392" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('SAP example: net book value 700, life 10, factor 3 is 210', () =&gt; {</text><text x="368" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">9</text><text x="392" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(decliningAmount(70000, 10, 3), 21000)</text><text x="368" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">10</text><text x="392" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">11</text><text x="392" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('straight-line schedule of the van', () =&gt; {</text><text x="368" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">12</text><text x="392" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const rows = schedule({ method: 'straight-line', base: 15000, years: 5 })</text><text x="368" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">13</text><text x="392" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.deepEqual(amounts(rows), Array(5).fill('3000.00'))</text><text x="368" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">14</text><text x="392" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(rows[4].NetBookValue, '0.00')</text><text x="368" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">15</text><text x="392" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">16</text><text x="392" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('declining balance with changeover for the van', () =&gt; {</text><text x="368" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">17</text><text x="392" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const rows = schedule(</text><text x="368" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">18</text><text x="392" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    { method: 'declining-balance', base: 15000, years: 5, factor: 2 })</text><text x="368" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">19</text><text x="392" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.deepEqual(amounts(rows),</text><text x="368" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">20</text><text x="392" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    ['6000.00', '3600.00', '1800.00', '1800.00', '1800.00'])</text><text x="368" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">21</text><text x="392" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.deepEqual(nbvs(rows),</text><text x="368" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">22</text><text x="392" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    ['9000.00', '5400.00', '3600.00', '1800.00', '0.00'])</text><text x="368" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">23</text><text x="392" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.deepEqual(rows.map((r) =&gt; r.Rule),</text><text x="368" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">24</text><text x="392" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    ['declining', 'declining', 'changeover', 'changeover', 'changeover'])</text><text x="368" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">25</text><text x="392" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text></g>
