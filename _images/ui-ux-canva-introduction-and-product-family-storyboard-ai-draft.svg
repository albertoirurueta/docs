<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: draft, refine and check usage with Canva AI</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 prompt box -->
  <rect x="26" y="96" width="112" height="70" rx="8" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="34" y="114" font-size="9" fill="#374151">Describe what you want:</text>
  <text x="34" y="128" font-size="9" fill="#374151">Book of the week post</text>
  <text x="34" y="141" font-size="9" fill="#374151">for the Bookshelf app</text>
  <rect x="104" y="146" width="26" height="14" rx="7" fill="#4F46E5"/>
  <rect x="26" y="180" width="112" height="22" rx="11" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="38" y="195" font-size="9" fill="#6B7280">+ add brand kit</text>
  <!-- 2 brand -->
  <rect x="178" y="96" width="112" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="188" y="111" font-size="9" fill="#374151">Brand kit: Bookshelf</text>
  <g><rect x="178" y="130" width="24" height="24" rx="3" fill="#4F46E5"/><rect x="208" y="130" width="24" height="24" rx="3" fill="#B45309"/><rect x="238" y="130" width="24" height="24" rx="3" fill="#1F2937"/><rect x="266" y="130" width="24" height="24" rx="3" fill="#EEF2FF" stroke="#9CA3AF"/></g>
  <rect x="178" y="168" width="112" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="188" y="183" font-size="9" fill="#374151">Brand template: post</text>
  <!-- 3 result layered -->
  <rect x="332" y="96" width="108" height="108" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="342" y="106" width="64" height="10" rx="2" fill="#1F2937" stroke="#4F46E5" stroke-dasharray="3 2"/>
  <rect x="342" y="126" width="26" height="56" rx="2" fill="#B45309" stroke="#4F46E5" stroke-dasharray="3 2"/>
  <rect x="372" y="134" width="24" height="48" rx="2" fill="#4F46E5" stroke="#1F2937" stroke-dasharray="3 2"/>
  <rect x="352" y="188" width="56" height="10" rx="5" fill="#92400E"/>
  <text x="386" y="226" font-size="10" fill="#374151" text-anchor="middle">every object stays</text>
  <text x="386" y="240" font-size="10" fill="#374151" text-anchor="middle">separate and editable</text>
  <!-- 4 refine -->
  <rect x="482" y="96" width="112" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="538" y="109" font-size="9" fill="#374151" text-anchor="middle">Make the headline</text>
  <text x="538" y="120" font-size="9" fill="#374151" text-anchor="middle">shorter</text>
  <rect x="482" y="140" width="112" height="82" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="494" y="150" width="40" height="10" rx="2" fill="#B45309"/>
  <rect x="494" y="170" width="26" height="44" rx="2" fill="#B45309"/><rect x="524" y="176" width="24" height="38" rx="2" fill="#4F46E5"/>
  <text x="538" y="240" font-size="10" fill="#374151" text-anchor="middle">only the headline changes</text>
  <!-- 5 usage -->
  <text x="684" y="108" font-size="11" fill="#374151" text-anchor="middle">Your AI usage</text>
  <rect x="640" y="120" width="88" height="14" rx="7" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="640" y="120" width="30" height="14" rx="7" fill="#B45309"/>
  <text x="684" y="156" font-size="10" fill="#374151" text-anchor="middle">Standard, Premium</text>
  <text x="684" y="170" font-size="10" fill="#374151" text-anchor="middle">and Ultra uses</text>
  <rect x="640" y="190" width="88" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <text x="684" y="205" font-size="9" fill="#92400E" text-anchor="middle">Ultra: most per use</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Prompt in the</text><text x="82" y="338">Canva AI tab</text><text x="234" y="322">Pick the brand</text><text x="234" y="338">kit and template</text><text x="386" y="322">Layered draft</text><text x="386" y="338">appears</text><text x="538" y="322">Refine by chat</text><text x="538" y="338">in the editor</text><text x="684" y="322">Check usage</text><text x="684" y="338">before more</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
