<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 294" width="820" height="294" role="img" aria-labelledby="downloads-t downloads-d">
<title id="downloads-t">Package downloads in the last 7 days</title>
<desc id="downloads-d">Downloads in the last 7 days on 2026-10-26: npm for Docusaurus and Antora, PyPI for Zensical, Material for MkDocs and MkDocs. DocFX is distributed on NuGet, which only publishes a cumulative total, so it is n/a. Ecosystems are counted differently and must not be compared across.</desc>
