<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Monotonic key: ranged vs. hashed distribution</text>

  <line x1="380" y1="48" x2="380" y2="392" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

  <defs>
    <marker id="sk-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ============ LEFT: RANGED ============ -->
  <text x="190" y="66" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Ranged key on createdAt</text>
  <text x="190" y="82" font-size="10" fill="#666666" text-anchor="middle">new inserts always fall in the top range</text>

  <rect x="120" y="96" width="140" height="26" rx="4" fill="#eef2f6" stroke="#999999" stroke-width="1.2"/>
  <text x="190" y="114" font-size="10" fill="#222222" text-anchor="middle">stream of new inserts</text>

  <g stroke="#666666" stroke-width="1.5" fill="none">
    <line x1="190" y1="122" x2="300" y2="300" marker-end="url(#sk-arrow)"/>
  </g>
  <line x1="120" y1="150" x2="120" y2="330" stroke="#999999" stroke-width="1.4"/>
  <text x="112" y="150" font-size="9" fill="#666666" text-anchor="end">high</text>
  <text x="112" y="330" font-size="9" fill="#666666" text-anchor="end">low</text>

  <!-- shard bins left -->
  <!-- Shard 1 low fill -->
  <rect x="150" y="150" width="90" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  <rect x="150" y="188" width="90" height="14" fill="#dbe4ec"/>
  <text x="195" y="220" font-size="10" fill="#666666" text-anchor="middle">Shard 1 (idle)</text>

  <!-- Shard 2 low fill -->
  <rect x="150" y="230" width="90" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  <rect x="150" y="268" width="90" height="14" fill="#dbe4ec"/>
  <text x="195" y="300" font-size="10" fill="#666666" text-anchor="middle">Shard 2 (idle)</text>

  <!-- Shard 3 hotspot -->
  <rect x="270" y="300" width="90" height="60" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="315" y="378" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard 3 — hotspot</text>
  <text x="315" y="392" font-size="9" fill="#666666" text-anchor="middle">absorbs every write</text>

  <!-- ============ RIGHT: HASHED ============ -->
  <text x="570" y="66" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Hashed key on createdAt</text>
  <text x="570" y="82" font-size="10" fill="#666666" text-anchor="middle">hash of each value scatters inserts</text>

  <rect x="500" y="96" width="140" height="26" rx="4" fill="#e2edd9" stroke="#999999" stroke-width="1.2"/>
  <text x="570" y="114" font-size="10" fill="#222222" text-anchor="middle">stream of new inserts</text>

  <g stroke="#666666" stroke-width="1.5" fill="none">
    <line x1="560" y1="122" x2="470" y2="286" marker-end="url(#sk-arrow)"/>
    <line x1="570" y1="122" x2="570" y2="286" marker-end="url(#sk-arrow)"/>
    <line x1="580" y1="122" x2="670" y2="286" marker-end="url(#sk-arrow)"/>
  </g>

  <!-- shard bins right, roughly equal -->
  <rect x="428" y="290" width="84" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  <rect x="428" y="322" width="84" height="38" fill="#c9dcbb"/>
  <text x="470" y="378" font-size="10" fill="#2f5424" text-anchor="middle">Shard 1</text>

  <rect x="528" y="290" width="84" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  <rect x="528" y="318" width="84" height="42" fill="#c9dcbb"/>
  <text x="570" y="378" font-size="10" fill="#2f5424" text-anchor="middle">Shard 2</text>

  <rect x="628" y="290" width="84" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  <rect x="628" y="324" width="84" height="36" fill="#c9dcbb"/>
  <text x="670" y="378" font-size="10" fill="#2f5424" text-anchor="middle">Shard 3</text>

  <text x="570" y="392" font-size="9" fill="#666666" text-anchor="middle">even write load across shards</text>
</svg>
