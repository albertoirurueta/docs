<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>The message catalog workflow of a Flask application</title>
  <defs>
    <marker id="icw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From marked strings to a translated page</text>

  <!-- row 1: developer side -->
  <text x="30" y="58" font-size="13" font-weight="bold" fill="currentColor">Build time (pybabel)</text>

  <rect x="30" y="70" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="105" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Source code</text>
  <text x="105" y="112" font-size="11" fill="currentColor" text-anchor="middle">_() and {% trans %}</text>

  <rect x="285" y="70" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">messages.pot</text>
  <text x="360" y="112" font-size="11" fill="currentColor" text-anchor="middle">template, no translations</text>

  <rect x="540" y="70" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="615" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">es/messages.po</text>
  <text x="615" y="112" font-size="11" fill="currentColor" text-anchor="middle">one per language</text>

  <line x1="180" y1="99" x2="283" y2="99" stroke="currentColor" stroke-width="1.5" marker-end="url(#icw-arrow)"/>
  <text x="232" y="90" font-size="11" fill="currentColor" text-anchor="middle">extract</text>
  <line x1="435" y1="99" x2="538" y2="99" stroke="currentColor" stroke-width="1.5" marker-end="url(#icw-arrow)"/>
  <text x="487" y="90" font-size="11" fill="currentColor" text-anchor="middle">init / update</text>

  <!-- translator loop -->
  <path d="M615,128 L615,168" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#icw-arrow)"/>
  <text x="627" y="152" font-size="11" fill="currentColor">translator edits</text>

  <rect x="540" y="170" width="150" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="615" y="194" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">es/messages.mo</text>
  <text x="615" y="212" font-size="11" fill="currentColor" text-anchor="middle">binary catalog</text>


  <text x="30" y="258" font-size="13" font-weight="bold" fill="currentColor">Run time (Flask-Babel)</text>

  <rect x="30" y="270" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="105" y="294" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Request</text>
  <text x="105" y="312" font-size="11" fill="currentColor" text-anchor="middle">Accept-Language, URL, user</text>

  <rect x="285" y="270" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="294" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">locale_selector</text>
  <text x="360" y="312" font-size="11" fill="currentColor" text-anchor="middle">picks "es"</text>

  <rect x="540" y="270" width="150" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="615" y="294" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">gettext lookup</text>
  <text x="615" y="312" font-size="11" fill="currentColor" text-anchor="middle">loads es .mo, caches it</text>

  <line x1="180" y1="299" x2="283" y2="299" stroke="currentColor" stroke-width="1.5" marker-end="url(#icw-arrow)"/>
  <line x1="435" y1="299" x2="538" y2="299" stroke="currentColor" stroke-width="1.5" marker-end="url(#icw-arrow)"/>
  <path d="M615,228 L615,268" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#icw-arrow)"/>
  <text x="627" y="252" font-size="11" fill="currentColor">compile, then deploy</text>
</svg>
