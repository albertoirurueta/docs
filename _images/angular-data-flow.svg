<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <defs>
    <marker id="adf-arrow-down" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="adf-arrow-up" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Angular component data flow</text>

  <!-- Parent -->
  <rect x="240" y="52" width="240" height="76" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="360" y="84" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;app-parent&gt;</text>
  <text x="360" y="106" font-size="12" fill="#1c4b73" text-anchor="middle">owns the state (signals)</text>

  <!-- Child -->
  <rect x="240" y="252" width="240" height="76" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="360" y="284" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;app-child&gt;</text>
  <text x="360" y="306" font-size="12" fill="#1c4b73" text-anchor="middle">reads input(), emits output()</text>

  <!-- input() down arrow -->
  <line x1="315" y1="128" x2="315" y2="248" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#adf-arrow-down)"/>
  <text x="300" y="192" font-size="13" font-weight="bold" fill="#2f6fa8" text-anchor="middle" transform="rotate(-90 300 192)">input() flows down</text>

  <!-- output() up arrow -->
  <line x1="405" y1="248" x2="405" y2="128" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#adf-arrow-up)"/>
  <text x="420" y="192" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle" transform="rotate(-90 420 192)">output() events flow up</text>

  <!-- binding hints -->
  <text x="150" y="180" font-size="11.5" fill="#666666" text-anchor="middle">[value]="count()"</text>
  <text x="575" y="180" font-size="11.5" fill="#666666" text-anchor="middle">(changed)="count.set($event)"</text>

  <!-- caption -->
  <text x="360" y="350" font-size="12.5" fill="#444444" text-anchor="middle">The parent binds a value in; the child calls emit() to notify the parent.</text>
  <text x="360" y="368" font-size="12.5" fill="#444444" text-anchor="middle">model() combines both directions into a two-way binding.</text>
</svg>
