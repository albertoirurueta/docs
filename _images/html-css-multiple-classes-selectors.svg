  <text x="395.0" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
  <rect x="476" y="168" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="545.0" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">matches</text>
  <rect x="626" y="168" width="138" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="695.0" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
  <rect x="776" y="168" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="845.0" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">matches</text>
  <rect x="20" y="212" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="30" y="237" font-size="12" font-weight="bold" fill="#334155">#4</text>
  <text x="64" y="237" font-size="13" font-family="Menlo, Consolas, monospace" fill="#0f172a">&#160;&#160;&lt;p class="b"&gt;</text>
  <rect x="326" y="212" width="138" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="395.0" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
  <rect x="476" y="212" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="545.0" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">matches</text>
  <rect x="626" y="212" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
