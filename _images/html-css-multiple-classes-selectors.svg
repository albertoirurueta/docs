<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="Helvetica, Arial, sans-serif">
  <title>Four ways to combine two class selectors on the same markup</title>
  <desc>A table of six HTML elements and four selectors: .a.b matches element 1 only, .a .b matches elements 3, 4 and 6, .a &gt; .b matches elements 4 and 6, and .a, .b matches elements 1, 3, 4, 5 and 6.</desc>
  <rect x="0" y="0" width="940" height="420" fill="#f8fafc"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#0f172a">Same markup, four selectors</text>
  <text x="20" y="52" font-size="13" fill="#334155">Highlighted cells show which elements each selector matches</text>
  <text x="395.0" y="62" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#0f172a">.a.b</text>
  <text x="395.0" y="78" text-anchor="middle" font-size="12" fill="#334155">same element</text>
  <text x="545.0" y="62" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#0f172a">.a .b</text>
  <text x="545.0" y="78" text-anchor="middle" font-size="12" fill="#334155">descendant</text>
  <text x="695.0" y="62" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#0f172a">.a &gt; .b</text>
  <text x="695.0" y="78" text-anchor="middle" font-size="12" fill="#334155">child</text>
  <text x="845.0" y="62" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#0f172a">.a, .b</text>
  <text x="845.0" y="78" text-anchor="middle" font-size="12" fill="#334155">selector list</text>
  <rect x="20" y="80" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="30" y="105" font-size="12" font-weight="bold" fill="#334155">#1</text>
  <text x="64" y="105" font-size="13" font-family="Menlo, Consolas, monospace" fill="#0f172a">&lt;div class="a b"&gt;</text>
  <rect x="326" y="80" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="395.0" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">matches</text>
  <rect x="476" y="80" width="138" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="545.0" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
  <rect x="626" y="80" width="138" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="695.0" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
  <rect x="776" y="80" width="138" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="845.0" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">matches</text>
  <rect x="20" y="124" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="30" y="149" font-size="12" font-weight="bold" fill="#334155">#2</text>
  <text x="64" y="149" font-size="13" font-family="Menlo, Consolas, monospace" fill="#0f172a">&#160;&#160;&lt;div class="x"&gt;</text>
  <rect x="326" y="124" width="138" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="395.0" y="149" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">no match</text>
