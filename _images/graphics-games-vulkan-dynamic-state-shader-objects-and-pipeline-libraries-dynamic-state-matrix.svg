<svg viewBox="0 0 760 600" width="760" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ds-mat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="600" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where each piece of pipeline state can change</text>
<rect x="20" y="45" width="150" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="61.0" text-anchor="middle" font-size="12" fill="#374151">Group</text>
<rect x="180" y="45" width="330" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="345.0" y="61.0" text-anchor="middle" font-size="12" fill="#374151">Examples</text>
<rect x="520" y="45" width="220" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="61.0" text-anchor="middle" font-size="12" fill="#374151">Availability</text>
<rect x="20" y="80" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="110.5" text-anchor="middle" font-size="11" fill="#374151">Original dynamic state</text>
<rect x="180" y="80" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="103.0" text-anchor="middle" font-size="11" fill="#374151">viewport, scissor, line width, depth bias, blend</text>
<text x="345.0" y="118.0" text-anchor="middle" font-size="11" fill="#374151">constants, stencil masks</text>
<rect x="520" y="80" width="220" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="110.5" text-anchor="middle" font-size="11" fill="#374151">core 1.0</text>
<rect x="20" y="140" width="150" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="95.0" y="163.0" text-anchor="middle" font-size="11" fill="#065F46">Extended dynamic state</text>
<text x="95.0" y="178.0" text-anchor="middle" font-size="11" fill="#065F46">1</text>
<rect x="180" y="140" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="155.5" text-anchor="middle" font-size="11" fill="#374151">cull mode, front face, topology, depth test and</text>
<text x="345.0" y="170.5" text-anchor="middle" font-size="11" fill="#374151">compare op, stencil op, viewport and scissor with</text>
<text x="345.0" y="185.5" text-anchor="middle" font-size="11" fill="#374151">count, vertex stride</text>
<rect x="520" y="140" width="220" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="170.5" text-anchor="middle" font-size="11" fill="#065F46">core 1.3</text>
<rect x="20" y="200" width="150" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="95.0" y="223.0" text-anchor="middle" font-size="11" fill="#065F46">Extended dynamic state</text>
<text x="95.0" y="238.0" text-anchor="middle" font-size="11" fill="#065F46">2</text>
<rect x="180" y="200" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="223.0" text-anchor="middle" font-size="11" fill="#374151">rasterizer discard, depth bias enable, primitive</text>
<text x="345.0" y="238.0" text-anchor="middle" font-size="11" fill="#374151">restart enable</text>
<rect x="520" y="200" width="220" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="230.5" text-anchor="middle" font-size="11" fill="#065F46">core 1.3</text>
<rect x="20" y="260" width="150" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="290.5" text-anchor="middle" font-size="11" fill="#92400E">EDS2 optional bits</text>
<rect x="180" y="260" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="290.5" text-anchor="middle" font-size="11" fill="#374151">logic op, patch control points</text>
<rect x="520" y="260" width="220" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="290.5" text-anchor="middle" font-size="11" fill="#92400E">EXT, per-feature</text>
<rect x="20" y="320" width="150" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="350.5" text-anchor="middle" font-size="11" fill="#92400E">Vertex input state</text>
<rect x="180" y="320" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="350.5" text-anchor="middle" font-size="11" fill="#374151">whole vertex binding and attribute layout</text>
<rect x="520" y="320" width="220" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="350.5" text-anchor="middle" font-size="11" fill="#92400E">VK_EXT_vertex_input_dynamic_state</text>
<rect x="20" y="380" width="150" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="403.0" text-anchor="middle" font-size="11" fill="#92400E">Extended dynamic state</text>
<text x="95.0" y="418.0" text-anchor="middle" font-size="11" fill="#92400E">3</text>
<rect x="180" y="380" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="395.5" text-anchor="middle" font-size="11" fill="#374151">polygon mode, rasterization samples, sample mask,</text>
<text x="345.0" y="410.5" text-anchor="middle" font-size="11" fill="#374151">blend enable, blend equation, colour write mask,</text>
<text x="345.0" y="425.5" text-anchor="middle" font-size="11" fill="#374151">depth clamp, alpha to coverage</text>
<rect x="520" y="380" width="220" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="403.0" text-anchor="middle" font-size="11" fill="#92400E">VK_EXT_extended_dynamic_state3,</text>
<text x="630.0" y="418.0" text-anchor="middle" font-size="11" fill="#92400E">one feature bit per state</text>
<rect x="20" y="440" width="150" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="95.0" y="470.5" text-anchor="middle" font-size="11" fill="#065F46">Local read remapping</text>
<rect x="180" y="440" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="463.0" text-anchor="middle" font-size="11" fill="#374151">colour attachment locations, input attachment</text>
<text x="345.0" y="478.0" text-anchor="middle" font-size="11" fill="#374151">indices</text>
<rect x="520" y="440" width="220" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="470.5" text-anchor="middle" font-size="11" fill="#065F46">core 1.4</text>
<rect x="20" y="500" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="530.5" text-anchor="middle" font-size="11" fill="#3730A3">Shader objects</text>
<rect x="180" y="500" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="523.0" text-anchor="middle" font-size="11" fill="#374151">all of the above are expected to be set before a</text>
<text x="345.0" y="538.0" text-anchor="middle" font-size="11" fill="#374151">draw</text>
<rect x="520" y="500" width="220" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="530.5" text-anchor="middle" font-size="11" fill="#3730A3">VK_EXT_shader_object</text>
<text x="380" y="574" text-anchor="middle" font-size="12" fill="#374151">Anything not listed stays baked into the pipeline object</text>
</svg>
