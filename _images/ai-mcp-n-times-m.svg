<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>The N times M integration problem and how MCP turns it into N plus M</title>
  <desc>Left: without a standard, four hosts each need a custom integration with each of four tools, sixteen integrations in total. Right: with the Model Context Protocol every host implements one MCP client and every tool exposes one MCP server, so four plus four equals eight implementations connected through a single protocol.</desc>
  <rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
  <text x="230" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Without a standard: N x M</text>
  <text x="230" y="54" text-anchor="middle" font-size="13" fill="#334155">4 hosts x 4 tools = 16 custom integrations</text>
  <line x1="150" y1="122" x2="310" y2="122" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="122" x2="310" y2="202" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
