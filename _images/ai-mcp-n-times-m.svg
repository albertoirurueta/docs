  <line x1="150" y1="362" x2="310" y2="362" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <rect x="20" y="100" width="130" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="85" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Claude Code</text>
  <rect x="20" y="180" width="130" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="85" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">VS Code + Copilot</text>
  <rect x="20" y="260" width="130" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
