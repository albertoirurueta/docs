  <text x="555" y="296" text-anchor="middle" font-size="11" fill="#1e3a8a">MCP client</text>
  <rect x="490" y="340" width="130" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
