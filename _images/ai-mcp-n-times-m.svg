  <text x="230" y="446" text-anchor="middle" font-size="13" fill="#7f1d1d">every pair needs its own glue code, auth and schema mapping</text>
  <line x1="470.0" y1="76" x2="470.0" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="700" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">With MCP: N + M</text>
  <text x="700" y="54" text-anchor="middle" font-size="13" fill="#334155">4 MCP clients + 4 MCP servers = 8 implementations</text>
