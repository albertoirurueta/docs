  <rect x="310" y="100" width="130" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="375" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Docs search</text>
  <rect x="310" y="180" width="130" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="375" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Postgres</text>
  <rect x="310" y="260" width="130" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="375" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">GitHub</text>
