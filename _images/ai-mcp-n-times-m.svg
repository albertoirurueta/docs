  <line x1="150" y1="202" x2="310" y2="362" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="282" x2="310" y2="122" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="282" x2="310" y2="202" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="282" x2="310" y2="282" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="282" x2="310" y2="362" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="362" x2="310" y2="122" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
  <line x1="150" y1="362" x2="310" y2="202" stroke="#b91c1c" stroke-width="1.4" opacity="0.55"/>
