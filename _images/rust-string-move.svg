<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Moving a String: let s2 = s1;</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the three-word header on the stack is copied bit for bit; the heap buffer is not copied, and s1 can no longer be used</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <line x1="470" y1="64" x2="470" y2="380" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="82">Before: let s1 = String::from("Dune");</text>
    <text x="705" y="82">After: let s2 = s1;</text>
  </g>
  <!-- before -->
  <text x="40" y="112" font-size="12" font-weight="bold" fill="#555555">stack</text>
  <text x="280" y="112" font-size="12" font-weight="bold" fill="#555555">heap</text>
  <g font-size="13" fill="#222222">
    <text x="40" y="140" font-weight="bold">s1</text>
    <rect x="70" y="124" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="80" y="143">ptr</text>
    <rect x="70" y="152" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="80" y="171">len 4</text>
    <rect x="70" y="180" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="80" y="199">cap 4</text>
        <g font-family="Courier New, monospace">
      <rect x="280" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="294" y="146">D</text>
      <rect x="320" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="334" y="146">u</text>
      <rect x="360" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="374" y="146">n</text>
      <rect x="400" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="414" y="146">e</text>
    </g>
  </g>
  <line x1="160" y1="138" x2="276" y2="138" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="235" y="236" font-size="12" fill="#444444" text-anchor="middle">s1 owns the buffer; when s1 goes out of scope,</text>
  <text x="235" y="252" font-size="12" fill="#444444" text-anchor="middle">drop frees it exactly once</text>

  <!-- after -->
  <text x="510" y="112" font-size="12" font-weight="bold" fill="#555555">stack</text>
  <text x="750" y="112" font-size="12" font-weight="bold" fill="#555555">heap</text>
  <g font-size="13" fill="#999999">
    <text x="510" y="140" font-weight="bold">s1</text>
    <rect x="540" y="124" width="90" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="550" y="143">ptr</text>
    <rect x="540" y="152" width="90" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="550" y="171">len 4</text>
    <rect x="540" y="180" width="90" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-dasharray="4,3"/><text x="550" y="199">cap 4</text>
        <text x="540" y="226" font-size="12" fill="#c62828">moved-from: unusable</text>
  </g>
  <g font-size="13" fill="#222222">
    <text x="510" y="268" font-weight="bold">s2</text>
    <rect x="540" y="250" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="550" y="269">ptr</text>
    <rect x="540" y="278" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="550" y="297">len 4</text>
    <rect x="540" y="306" width="90" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="550" y="325">cap 4</text>
        <g font-family="Courier New, monospace">
      <rect x="750" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="764" y="146">D</text>
      <rect x="790" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="804" y="146">u</text>
      <rect x="830" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="844" y="146">n</text>
      <rect x="870" y="124" width="40" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="884" y="146">e</text>
    </g>
  </g>
  <path d="M630,264 C700,264 730,220 768,162" fill="none" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="790" y="300" font-size="12" fill="#444444" text-anchor="middle">same buffer, one owner (s2): no double free,</text>
  <text x="790" y="316" font-size="12" fill="#444444" text-anchor="middle">no deep copy; s1.clone() would allocate a second buffer</text>
  <text x="470" y="372" font-size="12" fill="#666666" text-anchor="middle">Copy types such as i32 or (u8, bool) are duplicated instead, and the source stays usable</text>
</svg>
