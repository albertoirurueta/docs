<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where an upload comes from and where it ends up</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="20" y="60" width="200" height="80" rx="10"/><rect x="20" y="160" width="200" height="80" rx="10"/><rect x="20" y="260" width="200" height="80" rx="10"/>
  </g>
  <g font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold"><text x="120" y="84">Your device</text><text x="120" y="184">Cloud storage</text><text x="120" y="284">Other apps</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="120" y="104">files, folders, drag and drop</text><text x="120" y="122">Uploads tab or homepage</text><text x="120" y="204">Google Drive, Dropbox, OneDrive</text><text x="120" y="222">Add new, then Import</text><text x="120" y="304">Facebook, Instagram, Box,</text><text x="120" y="322">HubSpot, SharePoint, DAM apps</text></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M222,100 L262,180" marker-end="url(#ah)"/><path d="M222,200 L262,200" marker-end="url(#ah)"/><path d="M222,300 L262,220" marker-end="url(#ah)"/></g>
  <rect x="264" y="130" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="364" y="158" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Your account</text>
  <text x="364" y="178" font-size="12" fill="#374151" text-anchor="middle">Uploads tab in the editor</text>
  <text x="364" y="196" font-size="12" fill="#374151" text-anchor="middle">Uploads folder in Projects</text>
  <rect x="284" y="210" width="160" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <text x="364" y="227" font-size="12" fill="#92400E" text-anchor="middle">Counts toward the</text>
  <text x="364" y="242" font-size="12" fill="#92400E" text-anchor="middle">storage limit of the plan</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M466,180 L506,120" marker-end="url(#ah)"/><path d="M466,220 L506,280" marker-end="url(#ah)"/></g>
  <rect x="508" y="60" width="232" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="624" y="84" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Kept as an original</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="624" y="106">images, video, audio, fonts</text><text x="624" y="124">Affinity files, ZIP, INDD, HTML</text><text x="624" y="142">download, move, tag, share</text><text x="624" y="160">via a folder</text></g>
  <rect x="508" y="220" width="232" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="624" y="244" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Converted to a design</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="624" y="266">PDF, PowerPoint, Word,</text><text x="624" y="284">spreadsheets, CSV</text><text x="624" y="302">original file is not kept;</text><text x="624" y="320">export the design instead</text></g>
  <text x="380" y="366" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
