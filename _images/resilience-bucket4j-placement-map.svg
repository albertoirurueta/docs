<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="540" fill="#ffffff"/>
<defs>
<marker id="pm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#444444"/></marker>
<marker id="pm-arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b34700"/></marker>
<marker id="pm-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
</defs>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where each library sits in the Bookshelf: Bucket4j for quotas, Resilience4j for outbound calls</text>

<!-- clients -->
<rect x="20" y="200" width="120" height="100" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="1.5"/>
<text x="80" y="232" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">API clients</text>
<text x="80" y="254" font-size="11" fill="#444444" text-anchor="middle">partners, apps</text>
<text x="80" y="272" font-size="11" fill="#444444" text-anchor="middle">X-API-Key header</text>
<line x1="140" y1="250" x2="166" y2="250" stroke="#444444" stroke-width="2" marker-end="url(#pm-arrow)"/>

<!-- gateway -->
<rect x="170" y="160" width="135" height="180" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="1.5"/>
<text x="237" y="184" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Spring Cloud</text>
<text x="237" y="200" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Gateway</text>
<rect x="182" y="215" width="111" height="110" rx="6" fill="#fff1e6" stroke="#b34700" stroke-width="1.5"/>
<text x="237" y="236" font-size="11" font-weight="bold" fill="#b34700" text-anchor="middle">Bucket4j filter</text>
<text x="237" y="256" font-size="11" fill="#444444" text-anchor="middle">per client,</text>
<text x="237" y="272" font-size="11" fill="#444444" text-anchor="middle">coarse limit</text>
<text x="237" y="288" font-size="11" fill="#444444" text-anchor="middle">at the edge</text>
<text x="237" y="310" font-size="10" fill="#666666" text-anchor="middle">rateLimit(...)</text>

<!-- service -->
<rect x="325" y="55" width="400" height="365" rx="10" fill="#fafafa" stroke="#666666" stroke-width="1.5" stroke-dasharray="7,4"/>
<text x="525" y="76" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-service (several replicas)</text>
<text x="340" y="96" font-size="11" font-weight="bold" fill="#666666">inbound</text>

<rect x="342" y="105" width="95" height="85" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="389" y="135" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Spring</text>
<text x="389" y="151" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Security</text>
<text x="389" y="172" font-size="10" fill="#666666" text-anchor="middle">who is asking</text>
<line x1="437" y1="147" x2="451" y2="147" stroke="#444444" stroke-width="2" marker-end="url(#pm-arrow)"/>

<rect x="455" y="105" width="150" height="85" rx="6" fill="#fff1e6" stroke="#b34700" stroke-width="2"/>
<text x="530" y="124" font-size="11" font-weight="bold" fill="#b34700" text-anchor="middle">Bucket4j limiter</text>
<text x="530" y="142" font-size="11" fill="#444444" text-anchor="middle">bucket per API key</text>
<text x="530" y="158" font-size="11" fill="#444444" text-anchor="middle">free: 100/h + 10/s</text>
<text x="530" y="176" font-size="10" fill="#666666" text-anchor="middle">429 + Retry-After</text>
<line x1="605" y1="147" x2="619" y2="147" stroke="#444444" stroke-width="2" marker-end="url(#pm-arrow)"/>

<rect x="623" y="105" width="90" height="85" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="668" y="135" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Controllers</text>
<text x="668" y="155" font-size="10" fill="#666666" text-anchor="middle">search costs</text>
<text x="668" y="169" font-size="10" fill="#666666" text-anchor="middle">5 tokens</text>

<text x="340" y="222" font-size="11" font-weight="bold" fill="#666666">outbound</text>
<line x1="668" y1="190" x2="668" y2="226" stroke="#444444" stroke-width="2" marker-end="url(#pm-arrow)"/>

<rect x="342" y="232" width="150" height="70" rx="6" fill="#fff1e6" stroke="#b34700" stroke-width="2"/>
<text x="417" y="252" font-size="11" font-weight="bold" fill="#b34700" text-anchor="middle">Bucket4j shared quota</text>
<text x="417" y="270" font-size="11" fill="#444444" text-anchor="middle">key quota:isbn</text>
<text x="417" y="288" font-size="10" fill="#666666" text-anchor="middle">one per service, not per replica</text>

<rect x="523" y="230" width="190" height="175" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="2"/>
<text x="618" y="250" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Resilience4j around</text>
<text x="618" y="266" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">each outbound call</text>
<text x="535" y="290" font-size="11" fill="#444444">CircuitBreaker</text>
<text x="535" y="308" font-size="11" fill="#444444">Retry, honours Retry-After</text>
<text x="535" y="326" font-size="11" fill="#444444">TimeLimiter</text>
<text x="535" y="344" font-size="11" fill="#444444">Bulkhead</text>
<text x="535" y="362" font-size="11" fill="#444444">RateLimiter, per instance</text>
<text x="535" y="384" font-size="10" fill="#666666">fallbacks: cached data, 503</text>
<line x1="523" y1="267" x2="496" y2="267" stroke="#b34700" stroke-width="2" marker-end="url(#pm-arrow-orange)"/>

<rect x="342" y="325" width="150" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="2"/>
<text x="417" y="344" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">CircuitBreaker +</text>
<text x="417" y="360" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">TimeLimiter</text>
<text x="417" y="377" font-size="10" fill="#444444" text-anchor="middle">around every ProxyManager</text>
<text x="417" y="392" font-size="10" fill="#444444" text-anchor="middle">call: fail open or closed</text>

<!-- dashed links from Bucket4j components through the guard to Redis -->
<path d="M 505 190 L 505 215 L 507 215 L 507 365 L 496 365" fill="none" stroke="#b34700" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#pm-arrow-orange)"/>
<line x1="417" y1="302" x2="417" y2="321" stroke="#b34700" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#pm-arrow-orange)"/>
<line x1="417" y1="405" x2="417" y2="446" stroke="#b34700" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#pm-arrow-orange)"/>

<rect x="325" y="450" width="400" height="70" rx="8" fill="#fff1e6" stroke="#b34700" stroke-width="1.5"/>
<text x="525" y="474" font-size="13" font-weight="bold" fill="#b34700" text-anchor="middle">Redis: bucket state shared by every replica</text>
<text x="525" y="494" font-size="11" fill="#444444" text-anchor="middle">Bucket4jLettuce ProxyManager, compare-and-swap; PostgreSQL works the same way</text>
<text x="525" y="510" font-size="10" fill="#666666" text-anchor="middle">a dependency on the request path: a down store needs a deliberate policy</text>

<line x1="305" y1="230" x2="338" y2="160" stroke="#444444" stroke-width="2" marker-end="url(#pm-arrow)"/>
<!-- downstreams -->
<line x1="713" y1="290" x2="756" y2="290" stroke="#1c4b73" stroke-width="2" marker-end="url(#pm-arrow-blue)"/>
<line x1="713" y1="370" x2="756" y2="370" stroke="#1c4b73" stroke-width="2" marker-end="url(#pm-arrow-blue)"/>
<rect x="760" y="255" width="180" height="70" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="1.5"/>
<text x="850" y="280" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ISBN provider</text>
<text x="850" y="298" font-size="11" fill="#444444" text-anchor="middle">third party, daily quota</text>
<text x="850" y="314" font-size="10" fill="#666666" text-anchor="middle">answers 429 + Retry-After</text>
<rect x="760" y="340" width="180" height="60" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="1.5"/>
<text x="850" y="365" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">pricing-service</text>
<text x="850" y="383" font-size="11" fill="#444444" text-anchor="middle">internal, can be slow</text>

<!-- legend -->
<rect x="760" y="70" width="180" height="120" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
<text x="850" y="92" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Legend</text>
<rect x="772" y="104" width="16" height="16" rx="3" fill="#fff1e6" stroke="#b34700" stroke-width="1.5"/>
<text x="796" y="116" font-size="11" fill="#444444">Bucket4j: quotas</text>
<rect x="772" y="130" width="16" height="16" rx="3" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="796" y="142" font-size="11" fill="#444444">Resilience4j: outbound</text>
<line x1="772" y1="168" x2="790" y2="168" stroke="#b34700" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="796" y="172" font-size="11" fill="#444444">call to the shared store</text>
</svg>
