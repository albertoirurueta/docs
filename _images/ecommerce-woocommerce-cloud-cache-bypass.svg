<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What CloudFront caches and what it passes through for a WooCommerce store</title>
  <desc id="d">A request path from left to right. Visitors and payment providers send requests to CloudFront, where a viewer-request function and the path behaviours decide between two outcomes. The upper lane shows what may be cached: static files under wp-content and wp-includes for up to a year, and anonymous GET pages with no store cookie and no cart query string for sixty seconds. The lower lane shows what is passed to the origin and never cached: POST requests, the cart, checkout and my-account pages in both languages, wc-api payment callbacks, the wp-json REST and Store API routes, wp-admin and wp-login, any request carrying a wp_woocommerce_session, woocommerce_items_in_cart, woocommerce_cart_hash or logged-in cookie, and the add-to-cart and wc-ajax query strings. Both lanes continue to a WAF and an Application Load Balancer, then to any pocketcoffee-web pod, which uses the shared database and Valkey. The bottom strip lists the origin response headers that back the edge rules up and how the client address is recovered from X-Forwarded-For.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <text x="30" y="38" font-size="18" font-weight="bold" fill="#f2f5f8">Cache or bypass: the decision is made at the edge</text>

  <!-- clients -->
  <rect x="30" y="80" width="150" height="70" rx="9" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="105" y="108" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shoppers</text>
  <text x="105" y="128" font-size="12" fill="#f2f5f8" text-anchor="middle">browsers and apps</text>
  <rect x="30" y="300" width="150" height="70" rx="9" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
  <text x="105" y="328" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Payment provider</text>
  <text x="105" y="348" font-size="12" fill="#f2f5f8" text-anchor="middle">webhook callbacks</text>

  <!-- CloudFront -->
  <rect x="235" y="70" width="190" height="320" rx="10" fill="#33485c" stroke="#f4b860" stroke-width="2"/>
  <text x="330" y="96" font-size="14" font-weight="bold" fill="#f4b860" text-anchor="middle">CloudFront</text>
  <text x="330" y="118" font-size="12" fill="#f2f5f8" text-anchor="middle">www.pocketcoffee.example</text>
  <rect x="250" y="132" width="160" height="62" rx="8" fill="#3d5266"/>
  <text x="330" y="154" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Viewer-request function</text>
  <text x="330" y="172" font-size="12" fill="#f2f5f8" text-anchor="middle">sets x-pc-edge to</text>
  <text x="330" y="187" font-size="12" fill="#f2f5f8" text-anchor="middle">anon or pass-id</text>
  <rect x="250" y="208" width="160" height="62" rx="8" fill="#3d5266"/>
  <text x="330" y="230" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Path behaviours</text>
  <text x="330" y="248" font-size="12" fill="#f2f5f8" text-anchor="middle">first matching pattern</text>
  <text x="330" y="263" font-size="12" fill="#f2f5f8" text-anchor="middle">wins</text>
  <rect x="250" y="284" width="160" height="90" rx="8" fill="#2f4a44"/>
  <text x="330" y="304" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Cache key</text>
  <text x="330" y="322" font-size="12" fill="#f2f5f8" text-anchor="middle">x-pc-edge + query string</text>
  <text x="330" y="338" font-size="12" fill="#f2f5f8" text-anchor="middle">never cookies</text>
  <text x="330" y="358" font-size="12" fill="#f2f5f8" text-anchor="middle">pass-id is unique: no hit</text>

  <!-- lanes -->
  <rect x="470" y="70" width="270" height="150" rx="10" fill="#4d7c5a"/>
  <text x="485" y="94" font-size="14" font-weight="bold" fill="#f2f5f8">May be cached</text>
  <text x="485" y="118" font-size="12" fill="#f2f5f8">/wp-content/* and /wp-includes/*</text>
  <text x="485" y="135" font-size="12" fill="#f2f5f8">  long life, ?ver= in the key</text>
  <text x="485" y="157" font-size="12" fill="#f2f5f8">Anonymous GET pages, 60 s</text>
  <text x="485" y="174" font-size="12" fill="#f2f5f8">  home, categories, products</text>
  <text x="485" y="196" font-size="12" fill="#f2f5f8">  no store cookie, no cart query</text>

  <rect x="470" y="240" width="270" height="200" rx="10" fill="#7a5c3a"/>
  <text x="485" y="264" font-size="14" font-weight="bold" fill="#f2f5f8">Passed through, never cached</text>
  <text x="485" y="288" font-size="12" fill="#f2f5f8">POST, PUT, PATCH, DELETE</text>
  <text x="485" y="305" font-size="12" fill="#f2f5f8">/cart /checkout /my-account (and /es/ slugs)</text>
  <text x="485" y="322" font-size="12" fill="#f2f5f8">/wc-api/* and /wp-json/* (Store API, REST)</text>
  <text x="485" y="339" font-size="12" fill="#f2f5f8">/wp-admin/* /wp-login.php /wp-cron.php</text>
  <text x="485" y="361" font-size="12" fill="#f4b860">Cookies: wp_woocommerce_session_*</text>
  <text x="485" y="378" font-size="12" fill="#f4b860">woocommerce_items_in_cart</text>
  <text x="485" y="395" font-size="12" fill="#f4b860">woocommerce_cart_hash, wordpress_logged_in_*</text>
  <text x="485" y="417" font-size="12" fill="#f2f5f8">Query: add-to-cart, wc-ajax, wc-api</text>

  <!-- origin -->
  <rect x="790" y="70" width="140" height="370" rx="10" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
  <text x="860" y="96" font-size="14" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Origin</text>
  <rect x="802" y="112" width="116" height="52" rx="8" fill="#3d5266"/>
  <text x="860" y="134" font-size="12" fill="#f2f5f8" text-anchor="middle">AWS WAF</text>
  <text x="860" y="151" font-size="12" fill="#f2f5f8" text-anchor="middle">allow-list, rate</text>
  <rect x="802" y="176" width="116" height="52" rx="8" fill="#3d5266"/>
  <text x="860" y="198" font-size="12" fill="#f2f5f8" text-anchor="middle">ALB</text>
  <text x="860" y="215" font-size="12" fill="#f2f5f8" text-anchor="middle">60 s idle</text>
  <rect x="802" y="240" width="116" height="62" rx="8" fill="#3f6e9a"/>
  <text x="860" y="262" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">pocketcoffee-web</text>
  <text x="860" y="279" font-size="12" fill="#f2f5f8" text-anchor="middle">any pod:</text>
  <text x="860" y="294" font-size="12" fill="#f2f5f8" text-anchor="middle">no local state</text>
  <rect x="802" y="316" width="116" height="52" rx="8" fill="#2f4a44"/>
  <text x="860" y="338" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS: sessions,</text>
  <text x="860" y="355" font-size="12" fill="#f2f5f8" text-anchor="middle">orders</text>
  <rect x="802" y="378" width="116" height="52" rx="8" fill="#2f4a44"/>
  <text x="860" y="400" font-size="12" fill="#f2f5f8" text-anchor="middle">Valkey: object</text>
  <text x="860" y="417" font-size="12" fill="#f2f5f8" text-anchor="middle">cache</text>

  <!-- arrows -->
  <line x1="180" y1="115" x2="233" y2="115" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="335" x2="233" y2="335" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="425" y1="145" x2="468" y2="145" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="425" y1="340" x2="468" y2="340" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <line x1="740" y1="145" x2="788" y2="145" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="340" x2="788" y2="340" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="446" y="136" font-size="11" fill="#f2f5f8" text-anchor="middle">anon</text>
  <text x="446" y="331" font-size="11" fill="#f4b860" text-anchor="middle">pass</text>
  <text x="764" y="136" font-size="11" fill="#f2f5f8" text-anchor="middle">miss</text>

  <!-- bottom strip -->
  <rect x="30" y="462" width="900" height="112" rx="10" fill="#3d5266"/>
  <text x="46" y="486" font-size="13" font-weight="bold" fill="#f4b860">Three layers, so that one mistake does not leak a cart</text>
  <text x="46" y="508" font-size="12" fill="#f2f5f8">1. The function and the path behaviours decide at the edge.  2. WooCommerce sends Cache-Control private and no-cache on cart, checkout and</text>
  <text x="46" y="525" font-size="12" fill="#f2f5f8">my-account (minimum TTL 0 lets CloudFront obey it).  3. The cache key holds no cookie, and an anonymous page must not set one.</text>
  <text x="46" y="552" font-size="12" fill="#9fd3c7">Client address: X-Forwarded-For arrives as client, CloudFront edge. nginx trusts the VPC and the CloudFront ranges, and the</text>
  <text x="46" y="567" font-size="12" fill="#9fd3c7">right-most untrusted entry becomes the client. WooCommerce reads the headers that nginx rewrites.</text>
</svg>
