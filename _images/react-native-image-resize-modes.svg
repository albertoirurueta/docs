<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="260" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Image resizeMode reference</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">A wide Places photo (photoUri) inside a fixed 100x100 frame, under each resizeMode value</text>

  <defs>
    <clipPath id="clip-cover">
      <rect x="52" y="65" width="100" height="100"/>
    </clipPath>
    <clipPath id="clip-repeat">
      <rect x="484" y="65" width="100" height="100"/>
    </clipPath>
  </defs>

  <!-- cover -->
  <g>
    <rect x="52" y="65" width="100" height="100" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <g clip-path="url(#clip-cover)">
      <rect x="22" y="65" width="160" height="55" fill="#bcdcf0"/>
      <rect x="22" y="120" width="160" height="45" fill="#a9d8a9"/>
    </g>
    <rect x="52" y="65" width="100" height="100" rx="6" fill="none" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="102" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">cover</text>
    <text x="102" y="198" font-size="9.5" fill="#666666" text-anchor="middle">fills frame,</text>
    <text x="102" y="210" font-size="9.5" fill="#666666" text-anchor="middle">crops overflow</text>
  </g>

  <!-- contain -->
  <g>
    <rect x="196" y="65" width="100" height="100" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <rect x="196" y="87" width="100" height="31" fill="#bcdcf0"/>
    <rect x="196" y="118" width="100" height="25" fill="#a9d8a9"/>
    <text x="246" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">contain</text>
    <text x="246" y="198" font-size="9.5" fill="#666666" text-anchor="middle">fits inside,</text>
    <text x="246" y="210" font-size="9.5" fill="#666666" text-anchor="middle">letterboxed</text>
  </g>

  <!-- stretch -->
  <g>
    <rect x="340" y="65" width="100" height="100" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <rect x="340" y="65" width="100" height="45" fill="#bcdcf0"/>
    <rect x="340" y="110" width="100" height="55" fill="#a9d8a9"/>
    <text x="390" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">stretch</text>
    <text x="390" y="198" font-size="9.5" fill="#666666" text-anchor="middle">fills frame,</text>
    <text x="390" y="210" font-size="9.5" fill="#666666" text-anchor="middle">distorts aspect ratio</text>
  </g>

  <!-- repeat -->
  <g>
    <rect x="484" y="65" width="100" height="100" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <g clip-path="url(#clip-repeat)">
      <g>
        <rect x="484" y="65" width="34" height="19" fill="#bcdcf0"/>
        <rect x="484" y="84" width="34" height="15" fill="#a9d8a9"/>
        <rect x="518" y="65" width="34" height="19" fill="#bcdcf0"/>
        <rect x="518" y="84" width="34" height="15" fill="#a9d8a9"/>
        <rect x="552" y="65" width="34" height="19" fill="#bcdcf0"/>
        <rect x="552" y="84" width="34" height="15" fill="#a9d8a9"/>
        <rect x="484" y="99" width="34" height="19" fill="#bcdcf0"/>
        <rect x="484" y="118" width="34" height="15" fill="#a9d8a9"/>
        <rect x="518" y="99" width="34" height="19" fill="#bcdcf0"/>
        <rect x="518" y="118" width="34" height="15" fill="#a9d8a9"/>
        <rect x="552" y="99" width="34" height="19" fill="#bcdcf0"/>
        <rect x="552" y="118" width="34" height="15" fill="#a9d8a9"/>
        <rect x="484" y="133" width="34" height="19" fill="#bcdcf0"/>
        <rect x="484" y="152" width="34" height="13" fill="#a9d8a9"/>
        <rect x="518" y="133" width="34" height="19" fill="#bcdcf0"/>
        <rect x="518" y="152" width="34" height="13" fill="#a9d8a9"/>
        <rect x="552" y="133" width="34" height="19" fill="#bcdcf0"/>
        <rect x="552" y="152" width="34" height="13" fill="#a9d8a9"/>
      </g>
    </g>
    <rect x="484" y="65" width="100" height="100" rx="6" fill="none" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="534" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">repeat</text>
    <text x="534" y="198" font-size="9.5" fill="#666666" text-anchor="middle">tiles at natural</text>
    <text x="534" y="210" font-size="9.5" fill="#666666" text-anchor="middle">size to fill frame</text>
  </g>

  <!-- center -->
  <g>
    <rect x="628" y="65" width="100" height="100" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <rect x="643" y="85" width="70" height="22" fill="#bcdcf0"/>
    <rect x="643" y="107" width="70" height="18" fill="#a9d8a9"/>
    <text x="678" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">center</text>
    <text x="678" y="198" font-size="9.5" fill="#666666" text-anchor="middle">natural size,</text>
    <text x="678" y="210" font-size="9.5" fill="#666666" text-anchor="middle">centered, unscaled</text>
  </g>

  <text x="390" y="240" font-size="10.5" fill="#666666" text-anchor="middle">Frame: a fixed 100x100 box (e.g. a PlaceCard thumbnail). Photo: a wide 16:9 source image.</text>
</svg>
