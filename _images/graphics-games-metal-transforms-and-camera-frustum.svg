<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-transforms-and-camera-frustum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The view frustum, seen from the side</text>
<circle cx="90" cy="210" r="6" fill="#1F2937"/>
<text x="90" y="236" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">eye</text>
<text x="90" y="252" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(camera origin)</text>
<polygon points="160,190 160,230 160,230 160,190" fill="none" stroke="none" stroke-width="1.5"/>
<polygon points="190,193 190,227 640,100 640,320" fill="none" stroke="none" stroke-width="1.5"/>
<polygon points="90,210 640,95 640,325" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<line x1="190" y1="189.0909090909091" x2="190" y2="230.9090909090909" stroke="#B45309" stroke-width="3"/>
<line x1="640" y1="95" x2="640" y2="325" stroke="#047857" stroke-width="3"/>
<line x1="90" y1="210" x2="720" y2="210" stroke="#4B5563" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah-metal-transforms-and-camera-frustum)"/>
<text x="190" y="150" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">near plane</text>
<text x="190" y="166" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">z = n</text>
<text x="640" y="82" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">far plane  z = f</text>
<text x="420" y="200" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">view direction (-z or +z by convention)</text>
<text x="250" y="260" font-size="11" font-weight="normal" fill="#4F46E5" text-anchor="middle">vertical field of view</text>
<path d="M 150,200 A 60,60 0 0 0 150,220" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
<text x="430" y="345" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Points inside the truncated pyramid survive clipping.</text>
<text x="430" y="365" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Perspective divide maps them to the NDC box: x, y in [-1, 1] and z in [0, 1] in Metal.</text>
<text x="430" y="385" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">aspect ratio = width / height widens the frustum horizontally</text>
</svg>
