<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One draw call: a global state machine versus explicit objects</text>
<text x="120" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenGL (implicit)</text>
<rect x="30" y="70" width="180" height="200" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="120" y="92" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">current context</text>
<text x="120" y="114" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glUseProgram</text>
<text x="120" y="133" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glBindVertexArray</text>
<text x="120" y="152" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glBindTexture</text>
<text x="120" y="171" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glEnable(GL_DEPTH_TEST)</text>
<text x="120" y="190" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glBlendFunc</text>
<text x="120" y="209" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glViewport</text>
<rect x="30" y="300" width="180" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="120.0" y="317.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Driver (hidden work)</text>
<text x="120.0" y="332.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">validates state,</text>
<text x="120.0" y="347.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">builds shader variants</text>
<line x1="120" y1="270" x2="120" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#eo)"/>
<text x="130" y="288" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">glDrawElements</text>
<text x="120" y="380" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Every call changes global state;</text>
<text x="120" y="395" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">the cost appears at draw time.</text>
<text x="535" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Vulkan, Metal and WebGPU (explicit)</text>
<rect x="325" y="70" width="132" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="391.0" y="89.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Vulkan</text>
<rect x="467" y="70" width="132" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="533.0" y="89.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Metal</text>
<rect x="609" y="70" width="132" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="675.0" y="89.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">WebGPU</text>
<rect x="325" y="112" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="391" y="138" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">VkPipeline</text>
<rect x="467" y="112" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="533" y="138" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLRenderPipelineState</text>
<rect x="609" y="112" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="675" y="138" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">GPURenderPipeline</text>
<text x="318" y="138" font-size="11" font-weight="bold" fill="#374151" text-anchor="end">Pipeline object</text>
<rect x="325" y="168" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="391" y="194" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">VkDescriptorSet</text>
<rect x="467" y="168" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="533" y="194" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">argument buffer</text>
<rect x="609" y="168" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="675" y="194" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">GPUBindGroup</text>
<text x="318" y="194" font-size="11" font-weight="bold" fill="#374151" text-anchor="end">Resource binding</text>
<rect x="325" y="224" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="391" y="250" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">VkCommandBuffer</text>
<rect x="467" y="224" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="533" y="250" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLRenderCommandEncoder</text>
<rect x="609" y="224" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="675" y="250" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">GPURenderPassEncoder</text>
<text x="318" y="250" font-size="11" font-weight="bold" fill="#374151" text-anchor="end">Recording</text>
<rect x="325" y="280" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="391" y="306" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">vkQueueSubmit</text>
<rect x="467" y="280" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="533" y="306" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLCommandBuffer commit</text>
<rect x="609" y="280" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="675" y="306" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">GPUQueue submit</text>
<text x="318" y="306" font-size="11" font-weight="bold" fill="#374151" text-anchor="end">Submission</text>
<text x="535" y="358" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Pipeline, layout and targets are created once, up front;</text>
<text x="535" y="373" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">a frame only records and submits.</text>
