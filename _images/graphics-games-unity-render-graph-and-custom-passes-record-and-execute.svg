<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Two stages for every pass: record what you need, then execute commands</text>
<rect x="20" y="50" width="232" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="136.0" y="69.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">1 Record (every frame, CPU)</text>
<rect x="20" y="88" width="232" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="136.0" y="128.8" text-anchor="middle" font-size="11" fill="#374151">RecordRenderGraph(renderGraph,</text>
<text x="136.0" y="142.8" text-anchor="middle" font-size="11" fill="#374151">frameData) runs for each pass.</text>
<text x="136.0" y="156.8" text-anchor="middle" font-size="11" fill="#374151">You declare inputs and outputs and</text>
<text x="136.0" y="170.8" text-anchor="middle" font-size="11" fill="#374151">fill a PassData object.</text>
<text x="136.0" y="184.8" text-anchor="middle" font-size="11" fill="#374151">You do not add GPU commands here.</text>
<line x1="252" y1="150" x2="266" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="266" y="50" width="232" height="30" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="69.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2 Compile</text>
<rect x="266" y="88" width="232" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="128.8" text-anchor="middle" font-size="11" fill="#374151">The render graph removes unused</text>
<text x="382.0" y="142.8" text-anchor="middle" font-size="11" fill="#374151">passes, orders the work, merges</text>
<text x="382.0" y="156.8" text-anchor="middle" font-size="11" fill="#374151">passes that can share a native pass,</text>
<text x="382.0" y="170.8" text-anchor="middle" font-size="11" fill="#374151">and assigns memory to resources.</text>
<text x="382.0" y="184.8" text-anchor="middle" font-size="11" fill="#374151">You only see the result in the viewer.</text>
<line x1="498" y1="150" x2="512" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="512" y="50" width="232" height="30" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="628.0" y="69.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">3 Execute</text>
<rect x="512" y="88" width="232" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="628.0" y="128.8" text-anchor="middle" font-size="11" fill="#374151">The function you gave to</text>
<text x="628.0" y="142.8" text-anchor="middle" font-size="11" fill="#374151">SetRenderFunc runs with the PassData</text>
<text x="628.0" y="156.8" text-anchor="middle" font-size="11" fill="#374151">and a RasterGraphContext.</text>
<text x="628.0" y="170.8" text-anchor="middle" font-size="11" fill="#374151">It records commands on context.cmd:</text>
<text x="628.0" y="184.8" text-anchor="middle" font-size="11" fill="#374151">Blitter.BlitTexture, DrawRendererList.</text>
<rect x="20" y="236" width="350" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="260.9" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">PassData lives between stages</text>
<text x="195.0" y="274.9" text-anchor="middle" font-size="11" fill="#3730A3">Plain C# fields and TextureHandle values.</text>
<text x="195.0" y="288.9" text-anchor="middle" font-size="11" fill="#3730A3">Use a class with only what the pass needs.</text>
<rect x="390" y="236" width="350" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="260.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">The render function must be static</text>
<text x="565.0" y="274.9" text-anchor="middle" font-size="11" fill="#92400E">It must not capture fields or locals (no</text>
<text x="565.0" y="288.9" text-anchor="middle" font-size="11" fill="#92400E">allocations); read everything from PassData.</text>
<rect x="20" y="320" width="720" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="344.9" text-anchor="middle" font-size="11" fill="#374151">Because the commands run later, a handle is not a texture yet during recording: never read pixels or call GetNativeTexturePtr in RecordRenderGraph.</text>
</svg>
