<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Java compilation pipeline: Hello.java is compiled by javac to Hello.class bytecode, which the JVM loads, verifies, then interprets and JIT-compiles to native execution; the same .class runs on any JVM.</title>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From source code to native execution</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">javac compiles once to bytecode; every JVM turns that same bytecode into native code.</text>

  <!-- ===================== Hello.java ===================== -->
  <rect x="24" y="84" width="116" height="52" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="4"/>
  <text x="82" y="108" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">Hello.java</text>
  <text x="82" y="124" font-size="9" fill="#666666" text-anchor="middle">source code</text>

  <!-- javac arrow -->
  <line x1="140" y1="110" x2="190" y2="110" stroke="#444444" stroke-width="1.4"/>
  <polygon points="190,105 190,115 199,110" fill="#444444"/>
  <text x="165" y="101" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">javac</text>

  <!-- ===================== Hello.class ===================== -->
  <rect x="196" y="84" width="128" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.3" rx="4"/>
  <text x="260" y="106" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">Hello.class</text>
  <text x="260" y="122" font-size="9" fill="#666666" text-anchor="middle">bytecode (portable)</text>

  <!-- java arrow -->
  <line x1="324" y1="110" x2="382" y2="110" stroke="#444444" stroke-width="1.4"/>
  <polygon points="382,105 382,115 391,110" fill="#444444"/>
  <text x="353" y="101" font-size="9" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">java</text>

  <!-- ===================== JVM box ===================== -->
  <rect x="388" y="64" width="348" height="210" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="6"/>
  <text x="562" y="82" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle">JVM</text>
  <text x="562" y="94" font-size="9" fill="#4a6a8a" text-anchor="middle" font-style="italic">the java launcher</text>

  <rect x="412" y="100" width="300" height="30" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.1" rx="3"/>
  <text x="562" y="120" font-size="11" fill="#1f3a52" text-anchor="middle">class loader</text>

  <line x1="562" y1="130" x2="562" y2="141" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="556,141 568,141 562,149" fill="#4a6a8a"/>

  <rect x="412" y="150" width="300" height="30" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.1" rx="3"/>
  <text x="562" y="170" font-size="11" fill="#1f3a52" text-anchor="middle">bytecode verifier</text>

  <line x1="562" y1="180" x2="562" y2="191" stroke="#4a6a8a" stroke-width="1.3"/>
  <polygon points="556,191 568,191 562,199" fill="#4a6a8a"/>

  <rect x="412" y="200" width="300" height="46" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.1" rx="3"/>
  <text x="562" y="219" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle">interpreter&#160;&#160;+&#160;&#160;JIT compiler</text>
  <text x="562" y="234" font-size="8.5" fill="#666666" text-anchor="middle">hot methods compiled to native code</text>

  <!-- JVM -> native -->
  <line x1="562" y1="274" x2="562" y2="309" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="556,309 568,309 562,317" fill="#2e7d32"/>

  <!-- ===================== native execution ===================== -->
  <rect x="482" y="318" width="160" height="46" fill="#eef3ec" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="562" y="338" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">native execution</text>
  <text x="562" y="353" font-size="8.5" fill="#666666" text-anchor="middle">instructions run on the CPU</text>

  <!-- ===================== side note ===================== -->
  <rect x="70" y="300" width="270" height="60" fill="#fbfbf6" stroke="#c9b96a" stroke-width="1.3" stroke-dasharray="4,3" rx="4"/>
  <text x="205" y="322" font-size="10" fill="#8a7a2a" text-anchor="middle">The same <tspan font-family="'Courier New', monospace">Hello.class</tspan> runs unchanged</text>
  <text x="205" y="338" font-size="10" fill="#8a7a2a" text-anchor="middle">on any JVM, on any OS or CPU &#8212;</text>
  <text x="205" y="354" font-size="10" fill="#8a7a2a" text-anchor="middle" font-style="italic">&#8220;write once, run anywhere&#8221;.</text>

  <line x1="260" y1="300" x2="260" y2="137" stroke="#c9b96a" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
