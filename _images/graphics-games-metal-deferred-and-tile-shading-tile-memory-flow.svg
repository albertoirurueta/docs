<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-deferred-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Classic deferred versus single-pass tile deferred</text>
<rect x="20" y="50" width="350" height="370" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<rect x="390" y="50" width="350" height="370" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Two render passes (desktop style)</text>
<text x="565" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">One render pass (Apple GPU tile memory)</text>
<rect x="40" y="96" width="310" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="124.0" text-anchor="middle" font-size="12" fill="#374151">Pass 1: fill G-buffer in tile memory</text>
<line x1="195" y1="144" x2="195" y2="176" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-deferred-flow)"/>
<text x="205" y="165" text-anchor="start" font-size="11" fill="#92400E">store: write 3 textures</text>
<rect x="40" y="178" width="310" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="195.0" text-anchor="middle" font-size="12" fill="#92400E">System memory</text>
<text x="195.0" y="210.0" text-anchor="middle" font-size="12" fill="#92400E">albedo + normal + depth textures</text>
<text x="195.0" y="225.0" text-anchor="middle" font-size="12" fill="#92400E">(16 B per pixel, full-screen)</text>
<line x1="195" y1="234" x2="195" y2="266" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-deferred-flow)"/>
<text x="205" y="255" text-anchor="start" font-size="11" fill="#92400E">load: read them back</text>
<rect x="40" y="268" width="310" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="296.0" text-anchor="middle" font-size="12" fill="#374151">Pass 2: lighting reads the textures</text>
<line x1="195" y1="316" x2="195" y2="348" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-deferred-flow)"/>
<rect x="40" y="350" width="310" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="378.0" text-anchor="middle" font-size="12" fill="#374151">Lit colour stored once</text>
<rect x="410" y="96" width="310" height="212" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565" y="118" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Tile memory (on chip, one tile at a time)</text>
<rect x="430" y="132" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="150.5" text-anchor="middle" font-size="12" fill="#374151">Sub-pass 1: geometry draws fill</text>
<text x="565.0" y="165.5" text-anchor="middle" font-size="12" fill="#374151">albedo, normal, depth</text>
<line x1="565" y1="176" x2="565" y2="206" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-deferred-flow)"/>
<text x="575" y="196" text-anchor="start" font-size="11" fill="#3730A3">same pixel, no memory trip</text>
<rect x="430" y="208" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="226.5" text-anchor="middle" font-size="12" fill="#374151">Sub-pass 2: full-screen draw reads</text>
<text x="565.0" y="241.5" text-anchor="middle" font-size="12" fill="#374151">[[color(n)]] inputs and lights</text>
<text x="565" y="278" text-anchor="middle" font-size="11" fill="#3730A3">G-buffer values are discarded here (.dontCare)</text>
<line x1="565" y1="308" x2="565" y2="348" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-deferred-flow)"/>
<rect x="410" y="350" width="310" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="378.0" text-anchor="middle" font-size="12" fill="#374151">Lit colour stored once</text>
<text x="195" y="412" text-anchor="middle" font-size="11" fill="#92400E">Extra traffic: 16 B written and 16 B read per pixel</text>
<text x="565" y="412" text-anchor="middle" font-size="11" fill="#047857">Extra traffic: none for the G-buffer</text>
</svg>
