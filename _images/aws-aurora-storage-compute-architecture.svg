<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Aurora cluster: compute instances on top of one shared cluster volume</text>

  <!-- endpoints -->
  <rect x="40" y="44" width="820" height="50" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="60" y="66" font-size="12" font-weight="700" fill="#4a1d75">Cluster endpoints (DNS names)</text>
  <text x="60" y="84" font-size="11" fill="#4a1d75">writer: bookshelf-catalog.cluster-...  |  reader: bookshelf-catalog.cluster-ro-...  |  custom: your subset of instances</text>

  <!-- compute row -->
  <text x="40" y="118" font-size="12" font-weight="700" fill="#3c4a58">Compute (DB instances: provisioned or db.serverless)</text>

  <rect x="40" y="128" width="256" height="130" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="168" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone A</text>
  <rect x="64" y="162" width="208" height="76" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="168" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Writer instance</text>
  <text x="168" y="202" text-anchor="middle" font-size="10.5" fill="#3c4a58">reads and writes, DDL</text>
  <text x="168" y="218" text-anchor="middle" font-size="10.5" fill="#3c4a58">buffer cache, no local data</text>

  <rect x="322" y="128" width="256" height="130" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="450" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone B</text>
  <rect x="346" y="162" width="208" height="76" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Reader instance (tier 1)</text>
  <text x="450" y="202" text-anchor="middle" font-size="10.5" fill="#3c4a58">read-only, failover target</text>
  <text x="450" y="218" text-anchor="middle" font-size="10.5" fill="#3c4a58">lag typically tens of ms</text>

  <rect x="604" y="128" width="256" height="130" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="732" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone C</text>
  <rect x="628" y="162" width="208" height="76" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="732" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Reader instance (tier 2-15)</text>
  <text x="732" y="202" text-anchor="middle" font-size="10.5" fill="#3c4a58">optional, scales independently,</text>
  <text x="732" y="218" text-anchor="middle" font-size="10.5" fill="#3c4a58">up to 15 readers in total</text>

  <!-- arrows to storage -->
  <line x1="168" y1="258" x2="168" y2="310" stroke="#c77700" stroke-width="2"/>
  <polygon points="168,314 162,304 174,304" fill="#c77700"/>
  <text x="178" y="292" font-size="10.5" fill="#7a4800">redo log records only</text>
  <line x1="450" y1="258" x2="450" y2="310" stroke="#1e7b3a" stroke-width="2"/>
  <polygon points="450,314 444,304 456,304" fill="#1e7b3a"/>
  <text x="460" y="292" font-size="10.5" fill="#14532d">page reads</text>
  <line x1="732" y1="258" x2="732" y2="310" stroke="#1e7b3a" stroke-width="2"/>
  <polygon points="732,314 726,304 738,304" fill="#1e7b3a"/>
  <text x="742" y="292" font-size="10.5" fill="#14532d">page reads</text>

  <!-- storage -->
  <rect x="40" y="318" width="820" height="120" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="60" y="340" font-size="12.5" font-weight="700" fill="#7a4800">Cluster volume: distributed, log-structured storage, grows and shrinks automatically (up to 256 TiB on recent versions)</text>
  <g>
    <rect x="64" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="112" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 1 (AZ A)</text>
    <rect x="168" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="216" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 2 (AZ A)</text>
    <rect x="346" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="394" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 3 (AZ B)</text>
    <rect x="450" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="498" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 4 (AZ B)</text>
    <rect x="628" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="676" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 5 (AZ C)</text>
    <rect x="732" y="354" width="96" height="30" rx="4" fill="#ffffff" stroke="#c77700"/>
    <text x="780" y="373" text-anchor="middle" font-size="10.5" fill="#7a4800">copy 6 (AZ C)</text>
  </g>
  <text x="60" y="408" font-size="11" fill="#7a4800">Six copies of every segment across three AZs. Writes need 4 of 6 acknowledgements, reads need 3 of 6; storage self-heals in the background.</text>
  <text x="60" y="426" font-size="11" fill="#7a4800">Continuous backup to S3, snapshots, clones and backtrack all work on this volume, not on the instances.</text>

  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#3c4a58">Compute and storage scale separately: a Serverless v2 instance changes ACUs without touching the volume.</text>
</svg>
