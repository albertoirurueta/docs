<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>

  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Rendering strategies on a timeline</text>

  <!-- time axis -->
  <line x1="150" y1="360" x2="740" y2="360" stroke="#333333" stroke-width="1.5"/>
  <text x="445" y="384" font-size="12" fill="#555555" text-anchor="middle">time &#8594;  (request &#8594; interactive)</text>

  <!-- legend -->
  <rect x="150" y="40" width="14" height="14" fill="#cfe0f5" stroke="#2f6fa8"/>
  <text x="170" y="52" font-size="12" fill="#333333">server work (HTML)</text>
  <rect x="320" y="40" width="14" height="14" fill="#f6d9a4" stroke="#c9861f"/>
  <text x="340" y="52" font-size="12" fill="#333333">download JS bundle</text>
  <rect x="470" y="40" width="14" height="14" fill="#d3ead6" stroke="#3f8f4f"/>
  <text x="490" y="52" font-size="12" fill="#333333">client render / hydrate</text>
  <text x="640" y="52" font-size="12" fill="#333333">&#9733; = interactive</text>

  <!-- rows -->
  <!-- CSR -->
  <text x="20" y="96" font-size="13" font-weight="bold" fill="#222222">CSR</text>
  <text x="20" y="112" font-size="10" fill="#777777">SPA</text>
  <rect x="150" y="84" width="30" height="22" fill="#cfe0f5" stroke="#2f6fa8"/>
  <rect x="180" y="84" width="180" height="22" fill="#f6d9a4" stroke="#c9861f"/>
  <rect x="360" y="84" width="150" height="22" fill="#d3ead6" stroke="#3f8f4f"/>
  <text x="516" y="100" font-size="14" fill="#c0392b">&#9733;</text>
  <text x="536" y="100" font-size="10.5" fill="#777777">near-empty HTML first; slowest to content</text>

  <!-- SSR -->
  <text x="20" y="160" font-size="13" font-weight="bold" fill="#222222">SSR</text>
  <text x="20" y="176" font-size="10" fill="#777777">per request</text>
  <rect x="150" y="148" width="140" height="22" fill="#cfe0f5" stroke="#2f6fa8"/>
  <rect x="290" y="148" width="150" height="22" fill="#f6d9a4" stroke="#c9861f"/>
  <rect x="440" y="148" width="110" height="22" fill="#d3ead6" stroke="#3f8f4f"/>
  <text x="556" y="164" font-size="14" fill="#c0392b">&#9733;</text>
  <text x="576" y="164" font-size="10.5" fill="#777777">full HTML early; hydrate to interactive</text>

  <!-- SSG -->
  <text x="20" y="224" font-size="13" font-weight="bold" fill="#222222">SSG</text>
  <text x="20" y="240" font-size="10" fill="#777777">at build</text>
  <rect x="150" y="212" width="18" height="22" fill="#cfe0f5" stroke="#2f6fa8"/>
  <text x="172" y="228" font-size="10.5" fill="#777777">(HTML already built)</text>
  <rect x="290" y="212" width="150" height="22" fill="#f6d9a4" stroke="#c9861f"/>
  <rect x="440" y="212" width="110" height="22" fill="#d3ead6" stroke="#3f8f4f"/>
  <text x="556" y="228" font-size="14" fill="#c0392b">&#9733;</text>
  <text x="576" y="228" font-size="10.5" fill="#777777">fastest TTFB from a CDN</text>

  <!-- ISR -->
  <text x="20" y="288" font-size="13" font-weight="bold" fill="#222222">ISR</text>
  <text x="20" y="304" font-size="10" fill="#777777">build + revalidate</text>
  <rect x="150" y="276" width="18" height="22" fill="#cfe0f5" stroke="#2f6fa8"/>
  <text x="172" y="292" font-size="10.5" fill="#777777">cached HTML now; rebuilt in background after N s</text>
  <rect x="290" y="276" width="150" height="22" fill="#f6d9a4" stroke="#c9861f"/>
  <rect x="440" y="276" width="110" height="22" fill="#d3ead6" stroke="#3f8f4f"/>
  <text x="556" y="292" font-size="14" fill="#c0392b">&#9733;</text>
  <text x="576" y="292" font-size="10.5" fill="#777777">static speed, periodically fresh</text>

  <text x="150" y="336" font-size="11" fill="#555555">CSR optimizes hosting simplicity; SSR/SSG/ISR optimize TTFB and SEO by sending real HTML first.</text>
</svg>
