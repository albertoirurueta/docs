<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-mat-groups" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A BoxGeometry has six groups, each drawn with one material</text>
<text x="380" y="54" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">geometry.index (36 indices) split into groups by addGroup(start, count, materialIndex)</text>
<rect x="26" y="66" width="108" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="80" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 0: +X</text>
<text x="80" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 0, count 6</text>
<text x="80" y="118" font-size="11" font-weight="normal" fill="#B45309" text-anchor="middle">materialIndex 0</text>
<rect x="144" y="66" width="108" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="198" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 1: -X</text>
<text x="198" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 6, count 6</text>
<text x="198" y="118" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">materialIndex 1</text>
<rect x="262" y="66" width="108" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="316" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 2: +Y</text>
<text x="316" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 12, count 6</text>
<text x="316" y="118" font-size="11" font-weight="normal" fill="#B45309" text-anchor="middle">materialIndex 0</text>
<rect x="380" y="66" width="108" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="434" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 3: -Y</text>
<text x="434" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 18, count 6</text>
<text x="434" y="118" font-size="11" font-weight="normal" fill="#B45309" text-anchor="middle">materialIndex 0</text>
<rect x="498" y="66" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="552" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 4: +Z</text>
<text x="552" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 24, count 6</text>
<text x="552" y="118" font-size="11" font-weight="normal" fill="#4F46E5" text-anchor="middle">materialIndex 2</text>
<rect x="616" y="66" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="670" y="86" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">group 5: -Z</text>
<text x="670" y="103" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 30, count 6</text>
<text x="670" y="118" font-size="11" font-weight="normal" fill="#4F46E5" text-anchor="middle">materialIndex 2</text>
<rect x="40" y="240" width="180" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">materials[0]</text>
<text x="130" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pages (MeshStandardMaterial)</text>
<text x="130" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">pale paper texture</text>
<rect x="290" y="240" width="180" height="70" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">materials[1]</text>
<text x="380" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Spine (MeshStandardMaterial)</text>
<text x="380" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">title and ornaments</text>
<rect x="540" y="240" width="180" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">materials[2]</text>
<text x="630" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cover (MeshStandardMaterial)</text>
<text x="630" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cover art texture</text>
<path d="M 80 128 C 80 170 126 190 126 238" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<path d="M 198 128 C 198 170 384 190 384 238" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<path d="M 316 128 C 316 170 126 190 126 238" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<path d="M 434 128 C 434 170 134 190 134 238" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<path d="M 552 128 C 552 170 626 190 626 238" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<path d="M 670 128 C 670 170 634 190 634 238" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-groups)"/>
<text x="380" y="336" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Each group becomes its own draw call: six groups cost six draw calls, even when three of them share a material</text>
</svg>
