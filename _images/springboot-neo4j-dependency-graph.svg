<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">An auth outage and its blast radius</text>

  <!-- DEPENDS_ON edges point from the dependent to the dependency -->
  <g stroke="#888888" stroke-width="1.4" fill="none">
    <line x1="114.5" y1="191.4" x2="263.6" y2="139.2" marker-end="url(#arrow)"/>
    <line x1="116.0" y1="201.0" x2="586.0" y2="218.7" marker-end="url(#arrow)"/>
    <line x1="315.1" y1="136.8" x2="587.2" y2="211.1" marker-end="url(#arrow)"/>
    <line x1="315.7" y1="266.1" x2="586.4" y2="225.1" marker-end="url(#arrow)"/>
    <line x1="314.2" y1="340.5" x2="588.4" y2="232.5" marker-end="url(#arrow)"/>
    <line x1="290.0" y1="156.0" x2="290.0" y2="242.0" marker-end="url(#arrow)"/>
    <line x1="314.2" y1="120.6" x2="443.9" y2="70.1" marker-end="url(#arrow)"/>
  </g>

  <circle cx="90" cy="200" r="26" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="90" y="204" font-size="12" font-weight="bold" fill="#7e5109" text-anchor="middle">gateway</text>
  <circle cx="290" cy="130" r="26" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="290" y="134" font-size="12" font-weight="bold" fill="#7e5109" text-anchor="middle">orders</text>
  <circle cx="290" cy="270" r="26" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="290" y="274" font-size="12" font-weight="bold" fill="#7e5109" text-anchor="middle">billing</text>
  <circle cx="290" cy="350" r="26" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="290" y="354" font-size="10.5" font-weight="bold" fill="#7e5109" text-anchor="middle">notifications</text>
  <circle cx="470" cy="60" r="26" fill="#f4f4f4" stroke="#999999" stroke-width="2"/>
  <text x="470" y="64" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">inventory</text>
  <circle cx="620" cy="220" r="32" fill="#fbe3e3" stroke="#c0392b" stroke-width="3"/>
  <text x="620" y="224" font-size="12" font-weight="bold" fill="#7a1f1f" text-anchor="middle">auth</text>
  <text x="620" y="272" font-size="11.5" fill="#c0392b" text-anchor="middle">failing</text>
  <text x="470" y="104" font-size="11" fill="#666666" text-anchor="middle">not impacted</text>
  <text x="195" y="214" font-size="11" fill="#666666" text-anchor="middle">DEPENDS_ON</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="396" r="8" fill="#fbe3e3" stroke="#c0392b" stroke-width="3"/>
    <text x="50" y="400" font-size="11.5" fill="#444444">Failing component</text>

    <circle cx="214" cy="396" r="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
    <text x="230" y="400" font-size="11.5" fill="#444444">Impacted (transitive dependent)</text>

    <circle cx="470" cy="396" r="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
    <text x="486" y="400" font-size="11.5" fill="#444444">Unaffected (a dependency of an impacted one)</text>
  </g>

  <text x="360" y="424" font-size="11.5" fill="#444444" text-anchor="middle">Arrows point from a dependent to what it needs, so the blast radius follows them backwards from the failing node.</text>
</svg>
