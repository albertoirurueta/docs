<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Section blocks, theme blocks and app blocks compared</title>
  <desc>Three cards compare where each kind of Shopify theme block is defined, how it is rendered, whether it can nest and what limits apply.</desc>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">Three kinds of blocks in an Online Store 2.0 theme</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">Sections hold blocks; a section picks section blocks or theme blocks, and app blocks work with both</text>

  <!-- Section blocks -->
  <rect x="20" y="64" width="290" height="372" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <rect x="20" y="64" width="290" height="40" rx="8" fill="#2f6db5"/>
  <text x="165" y="90" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Section blocks</text>
  <g font-size="12.5" fill="#1f2933">
    <text x="34" y="132" font-weight="bold">Defined in</text>
    <text x="34" y="150" font-family="Courier New, monospace" font-size="11.5">sections/roast-notes.liquid</text>
    <text x="34" y="168" font-family="Courier New, monospace" font-size="11.5">schema: "blocks": [ { type, name } ]</text>
    <text x="34" y="196" font-weight="bold">Scope</text>
    <text x="34" y="214">That one section only</text>
    <text x="34" y="242" font-weight="bold">Nesting</text>
    <text x="34" y="260">None: a single level</text>
    <text x="34" y="288" font-weight="bold">Rendered with</text>
    <text x="34" y="306" font-family="Courier New, monospace" font-size="11.5">for block in section.blocks</text>
    <text x="34" y="334" font-weight="bold">Limits</text>
    <text x="34" y="352">limit per type, max_blocks, 50 per section</text>
    <text x="34" y="380" font-weight="bold">Constraint</text>
    <text x="34" y="398">Cannot be mixed with @theme in one section</text>
    <text x="34" y="420">Picker entry comes from the schema itself</text>
  </g>

  <!-- Theme blocks -->
  <rect x="335" y="64" width="290" height="372" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <rect x="335" y="64" width="290" height="40" rx="8" fill="#1f8a5b"/>
  <text x="480" y="90" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Theme blocks</text>
  <g font-size="12.5" fill="#1f2933">
    <text x="349" y="132" font-weight="bold">Defined in</text>
    <text x="349" y="150" font-family="Courier New, monospace" font-size="11.5">blocks/origin-card.liquid</text>
    <text x="349" y="168" font-family="Courier New, monospace" font-size="11.5">own schema, presets, tag, class</text>
    <text x="349" y="196" font-weight="bold">Scope</text>
    <text x="349" y="214">Any section or block that targets it</text>
    <text x="349" y="242" font-weight="bold">Nesting</text>
    <text x="349" y="260">Up to 8 levels below the section</text>
    <text x="349" y="288" font-weight="bold">Rendered with</text>
    <text x="349" y="306" font-family="Courier New, monospace" font-size="11.5">content_for 'blocks'</text>
    <text x="349" y="324" font-family="Courier New, monospace" font-size="11.5">content_for 'block', type, id</text>
    <text x="349" y="352" font-weight="bold">Limits</text>
    <text x="349" y="370">300 theme blocks per theme</text>
    <text x="349" y="398" font-weight="bold">Constraint</text>
    <text x="349" y="416">Needs a preset to appear in the picker</text>
  </g>

  <!-- App blocks -->
  <rect x="650" y="64" width="290" height="372" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
  <rect x="650" y="64" width="290" height="40" rx="8" fill="#b4690e"/>
  <text x="795" y="90" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">App blocks</text>
  <g font-size="12.5" fill="#1f2933">
    <text x="664" y="132" font-weight="bold">Defined in</text>
    <text x="664" y="150" font-family="Courier New, monospace" font-size="11.5">extensions/x/blocks/reviews.liquid</text>
    <text x="664" y="168">shipped by a theme app extension</text>
    <text x="664" y="196" font-weight="bold">Scope</text>
    <text x="664" y="214">Where the theme accepts @app</text>
    <text x="664" y="242" font-weight="bold">Opt-in</text>
    <text x="664" y="260" font-family="Courier New, monospace" font-size="11.5">"blocks": [ { "type": "@app" } ]</text>
    <text x="664" y="288" font-weight="bold">Rendered with</text>
    <text x="664" y="306" font-family="Courier New, monospace" font-size="11.5">content_for 'blocks'</text>
    <text x="664" y="324" font-family="Courier New, monospace" font-size="11.5">render block (section blocks)</text>
    <text x="664" y="352" font-weight="bold">Limits</text>
    <text x="664" y="370">30 app blocks per extension, no limit key</text>
    <text x="664" y="398" font-weight="bold">Top level</text>
    <text x="664" y="416">Wrapped by apps.liquid or _blocks.liquid</text>
  </g>

  <!-- footer strip -->
  <rect x="20" y="452" width="920" height="52" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g font-size="12.5" fill="#7b8794" text-anchor="middle">
    <text x="480" y="474">Page flow: JSON template or section group, then section, then blocks, then nested blocks</text>
    <text x="480" y="493">Static theme blocks (content_for 'block') sit in the same tree but are fixed in place</text>
  </g>
</svg>
