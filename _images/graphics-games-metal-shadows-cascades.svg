<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-shadows-cascades" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Cascaded shadow maps: split the view frustum</text>
<polygon points="176,370 204,370 340,80 40,80" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<polygon points="176.0,370 204.0,370 236.82758620689654,300 143.17241379310346,300" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<text x="190" y="339" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">cascade 0</text>
<polygon points="143.17241379310346,300 236.82758620689654,300 276.6896551724138,215 103.3103448275862,215" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<text x="190" y="262" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">cascade 1</text>
<polygon points="103.3103448275862,215 276.6896551724138,215 311.8620689655172,140 68.13793103448276,140" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<text x="190" y="182" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">cascade 2</text>
<polygon points="68.13793103448276,140 311.8620689655172,140 340.0,80 40.0,80" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="190" y="114" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">cascade 3</text>
<circle cx="190" cy="385" r="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="190" y="408" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">camera</text>
<line x1="14" y1="180" x2="70" y2="212" stroke="#B45309" stroke-width="3" marker-end="url(#ah-metal-shadows-cascades)"/>
<text x="14" y="168" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">sun direction</text>
<text x="252" y="303" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">near plane</text>
<text x="346" y="83" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">far plane</text>
<rect x="420" y="50" width="320" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="77.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Each cascade gets its own</text>
<text x="580.0" y="92.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">orthographic light matrix and</text>
<text x="580.0" y="107.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">its own slice of one texture array</text>
<rect x="420" y="136" width="320" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="580.0" y="163.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Split distances (practical scheme)</text>
<text x="580.0" y="178.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">split(i) = lerp(near * (far/near)^(i/N),</text>
<text x="580.0" y="193.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">near + (far - near) * i/N, lambda)</text>
<text x="580.0" y="208.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">lambda 0 = logarithmic, 1 = uniform</text>
<rect x="420" y="238" width="320" height="76" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580.0" y="265.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Near cascades are small, so one</text>
<text x="580.0" y="280.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">texel covers little world space:</text>
<text x="580.0" y="295.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">sharp shadows close to the camera</text>
<rect x="420" y="324" width="320" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="580.0" y="351.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Fragment shader picks the cascade</text>
<text x="580.0" y="366.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">from view depth and blends over</text>
<text x="580.0" y="381.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">a small band to hide the seam</text>
</svg>
