<text x="470.0" y="177.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Shelf</text>
<rect x="620" y="160" width="80" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="660.0" y="177.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Lamp</text>
<rect x="410" y="220" width="70" height="28" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="445.0" y="237.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Board</text>
<rect x="490" y="220" width="70" height="28" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="525.0" y="237.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Book</text>
<line x1="565" y1="128" x2="470" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
<line x1="565" y1="128" x2="660" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
<line x1="470" y1="188" x2="445" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
<line x1="470" y1="188" x2="525" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
<rect x="430" y="285" width="270" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="309.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Engine owns the graph</text>
<text x="565.0" y="324.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">and traverses it to draw</text>
<line x1="525" y1="248" x2="525" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
<text x="535" y="270" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">traverse</text>
</svg>
