<text x="205" y="184" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">walk the data</text>
<text x="205" y="284" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">resubmit</text>
<rect x="525" y="100" width="80" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="117.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Scene</text>
