<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-apis-vs-engines-retained-vs-immediate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Immediate mode versus retained mode</text>
<rect x="30" y="50" width="330" height="320" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="400" y="50" width="330" height="320" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Immediate mode (OpenGL 1.x, D3D)</text>
<text x="565" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Retained mode (scene graph)</text>
<rect x="60" y="100" width="270" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="124.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Application owns the scene</text>
<text x="195.0" y="139.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(arrays, structs, game objects)</text>
<rect x="60" y="200" width="270" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="224.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Every frame: issue commands</text>
<text x="195.0" y="239.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">begin, vertex, end, draw</text>
<rect x="60" y="300" width="270" height="48" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="328.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU draws, nothing remembered</text>
<line x1="195" y1="156" x2="195" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-retained-vs-immediate)"/>
