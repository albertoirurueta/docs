<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a native app should render its login</text>
  <text x="450" y="44" font-size="11" fill="#666666" text-anchor="middle">what the app, the user, and the authorization server can see, per RFC 8252 / BCP 212</text>

  <!-- Column 1: Embedded WebView (forbidden) -->
  <rect x="30" y="65" width="270" height="30" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="165" y="85" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Embedded WebView -- FORBIDDEN</text>

  <rect x="30" y="105" width="270" height="380" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="165" y="128" font-size="10.5" fill="#8a2020" text-anchor="middle">RFC 8252 &#167;8.12: native apps</text>
  <text x="165" y="141" font-size="10.5" fill="#8a2020" text-anchor="middle">MUST NOT use this</text>

  <!-- app box inside webview column containing the "browser" -->
  <rect x="45" y="155" width="240" height="150" fill="#ffffff" stroke="#a33" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="165" y="171" font-size="10" fill="#8a2020" text-anchor="middle">Hosting app process</text>
  <rect x="60" y="180" width="210" height="110" fill="#f6d9d9" stroke="#a33" stroke-width="1"/>
  <text x="165" y="198" font-size="9.5" fill="#7a1a1a" text-anchor="middle">WebView control</text>
  <text x="165" y="212" font-size="9.5" fill="#7a1a1a" text-anchor="middle">(no address bar,</text>
  <text x="165" y="225" font-size="9.5" fill="#7a1a1a" text-anchor="middle">no TLS indicator)</text>
  <text x="165" y="245" font-size="9" fill="#7a1a1a" text-anchor="middle" font-family="'Courier New', monospace">username: ____</text>
  <text x="165" y="260" font-size="9" fill="#7a1a1a" text-anchor="middle" font-family="'Courier New', monospace">password: ****</text>
  <text x="165" y="278" font-size="8.5" fill="#a33" text-anchor="middle">app can inject JS / read DOM</text>

  <text x="45" y="322" font-size="9.5" font-weight="bold" fill="#7a1a1a">App can see:</text>
  <text x="45" y="336" font-size="9" fill="#7a1a1a">- the password, keystroke by keystroke</text>
  <text x="45" y="349" font-size="9" fill="#7a1a1a">- full DOM of the login page</text>

  <text x="45" y="368" font-size="9.5" font-weight="bold" fill="#7a1a1a">User can see:</text>
  <text x="45" y="382" font-size="9" fill="#7a1a1a">- no address bar, no TLS indicator</text>
  <text x="45" y="395" font-size="9" fill="#7a1a1a">- cannot verify the real domain</text>

  <text x="45" y="414" font-size="9.5" font-weight="bold" fill="#7a1a1a">Authorization server sees:</text>
  <text x="45" y="428" font-size="9" fill="#7a1a1a">- a fresh, app-scoped cookie jar</text>
  <text x="45" y="441" font-size="9" fill="#7a1a1a">- no SSO: existing browser session</text>
  <text x="45" y="454" font-size="9" fill="#7a1a1a">  is not visible or reachable</text>

  <text x="45" y="476" font-size="9.5" font-weight="bold" fill="#a33">Result:</text>
  <text x="45" y="490" font-size="9" fill="#a33">app can read the password; no shared</text>
  <text x="45" y="470" font-size="1" fill="#a33"> </text>
  <text x="45" y="503" font-size="9" fill="#a33">cookie jar; no visible URL or TLS check</text>

  <!-- Column 2: In-app browser tab (recommended) -->
  <rect x="315" y="65" width="270" height="30" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="450" y="85" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">In-app browser tab -- RECOMMENDED</text>

  <rect x="315" y="105" width="270" height="380" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="450" y="128" font-size="10.5" fill="#1f4d24" text-anchor="middle">ASWebAuthenticationSession /</text>
  <text x="450" y="141" font-size="10.5" fill="#1f4d24" text-anchor="middle">SFSafariViewController (iOS), Custom Tabs (Android)</text>

  <rect x="330" y="155" width="240" height="150" fill="#ffffff" stroke="#2d6a34" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="171" font-size="10" fill="#1f4d24" text-anchor="middle">Hosting app (visually docked)</text>
  <rect x="345" y="180" width="210" height="110" fill="#d9f0da" stroke="#2d6a34" stroke-width="1"/>
  <text x="450" y="196" font-size="9" fill="#1f4d24" text-anchor="middle" font-family="'Courier New', monospace">https://as.example.com &#128274;</text>
  <text x="450" y="212" font-size="9.5" fill="#1f4d24" text-anchor="middle">system browser engine,</text>
  <text x="450" y="225" font-size="9.5" fill="#1f4d24" text-anchor="middle">separate sandboxed process</text>
  <text x="450" y="245" font-size="9" fill="#1f4d24" text-anchor="middle" font-family="'Courier New', monospace">username: ____</text>
  <text x="450" y="260" font-size="9" fill="#1f4d24" text-anchor="middle" font-family="'Courier New', monospace">password: ****</text>
  <text x="450" y="278" font-size="8.5" fill="#2d6a34" text-anchor="middle">app cannot read this content</text>

  <text x="330" y="322" font-size="9.5" font-weight="bold" fill="#1f4d24">App can see:</text>
  <text x="330" y="336" font-size="9" fill="#1f4d24">- nothing inside the session</text>
  <text x="330" y="349" font-size="9" fill="#1f4d24">- only the final redirect URI</text>

  <text x="330" y="368" font-size="9.5" font-weight="bold" fill="#1f4d24">User can see:</text>
  <text x="330" y="382" font-size="9" fill="#1f4d24">- real address bar + TLS indicator</text>
  <text x="330" y="395" font-size="9" fill="#1f4d24">- can verify the actual domain</text>

  <text x="330" y="414" font-size="9.5" font-weight="bold" fill="#1f4d24">Authorization server sees:</text>
  <text x="330" y="428" font-size="9" fill="#1f4d24">- the system browser's cookie jar</text>
  <text x="330" y="441" font-size="9" fill="#1f4d24">- existing session -&gt; SSO works,</text>
  <text x="330" y="454" font-size="9" fill="#1f4d24">  can skip re-login/consent</text>

  <text x="330" y="476" font-size="9.5" font-weight="bold" fill="#2d6a34">Result:</text>
  <text x="330" y="490" font-size="9" fill="#2d6a34">near-native UX with full browser</text>
  <text x="330" y="503" font-size="9" fill="#2d6a34">security properties intact</text>

  <!-- Column 3: External browser (most compliant, most disruptive) -->
  <rect x="600" y="65" width="270" height="30" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="735" y="85" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">External browser -- COMPLIANT</text>

  <rect x="600" y="105" width="270" height="380" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="735" y="128" font-size="10.5" fill="#123753" text-anchor="middle">Default browser app (Safari,</text>
  <text x="735" y="141" font-size="10.5" fill="#123753" text-anchor="middle">Chrome, ...), separate app switch</text>

  <rect x="615" y="155" width="240" height="150" fill="#ffffff" stroke="#1c4b73" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="735" y="171" font-size="10" fill="#123753" text-anchor="middle">Fully separate app / process</text>
  <rect x="630" y="180" width="210" height="110" fill="#dbe9f5" stroke="#1c4b73" stroke-width="1"/>
  <text x="735" y="196" font-size="9" fill="#123753" text-anchor="middle" font-family="'Courier New', monospace">https://as.example.com &#128274;</text>
  <text x="735" y="212" font-size="9.5" fill="#123753" text-anchor="middle">the user's actual, everyday</text>
  <text x="735" y="225" font-size="9.5" fill="#123753" text-anchor="middle">browser instance</text>
  <text x="735" y="245" font-size="9" fill="#123753" text-anchor="middle" font-family="'Courier New', monospace">username: ____</text>
  <text x="735" y="260" font-size="9" fill="#123753" text-anchor="middle" font-family="'Courier New', monospace">password: ****</text>
  <text x="735" y="278" font-size="8.5" fill="#1c4b73" text-anchor="middle">app cannot read this content</text>

  <text x="615" y="322" font-size="9.5" font-weight="bold" fill="#123753">App can see:</text>
  <text x="615" y="336" font-size="9" fill="#123753">- nothing; app is backgrounded</text>
  <text x="615" y="349" font-size="9" fill="#123753">- only the final redirect URI</text>

  <text x="615" y="368" font-size="9.5" font-weight="bold" fill="#123753">User can see:</text>
  <text x="615" y="382" font-size="9" fill="#123753">- real address bar + TLS indicator</text>
  <text x="615" y="395" font-size="9" fill="#123753">- their normal, trusted browser UI</text>

  <text x="615" y="414" font-size="9.5" font-weight="bold" fill="#123753">Authorization server sees:</text>
  <text x="615" y="428" font-size="9" fill="#123753">- the system browser's cookie jar</text>
  <text x="615" y="441" font-size="9" fill="#123753">- existing session -&gt; SSO works,</text>
  <text x="615" y="454" font-size="9" fill="#123753">  same as the in-app browser tab</text>

  <text x="615" y="476" font-size="9.5" font-weight="bold" fill="#1c4b73">Result:</text>
  <text x="615" y="490" font-size="9" fill="#1c4b73">maximally compliant; visible app</text>
  <text x="615" y="503" font-size="9" fill="#1c4b73">switch is the UX cost</text>
</svg>
