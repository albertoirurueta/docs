<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Next.js request flow</title>
  <desc id="d">A request travels from the browser through a CDN and the proxy to the Next.js server, where React renders Server Components into an RSC payload and HTML. The response travels back to the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4f91"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The request flow of a Next.js App Router application</text>
  <text x="400" y="47" font-size="12" fill="#555555" text-anchor="middle">solid arrows: the request going in; dashed blue arrows: the response coming back</text>

  <!-- Row of five stages -->
  <rect x="17" y="72" width="125" height="58" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="79.5" y="97" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle">Browser</text>
  <text x="79.5" y="116" font-size="12" fill="#333333" text-anchor="middle">GET /dashboard</text>

  <rect x="177" y="72" width="125" height="58" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="239.5" y="97" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">CDN</text>
  <text x="239.5" y="116" font-size="12" fill="#333333" text-anchor="middle">edge cache</text>

  <rect x="337" y="72" width="125" height="58" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="399.5" y="97" font-size="14" font-weight="bold" fill="#5c3500" text-anchor="middle">Proxy</text>
  <text x="399.5" y="116" font-size="12" fill="#333333" text-anchor="middle">proxy.ts</text>

  <rect x="497" y="72" width="125" height="58" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="559.5" y="97" font-size="14" font-weight="bold" fill="#14411f" text-anchor="middle">Next.js server</text>
  <text x="559.5" y="116" font-size="12" fill="#333333" text-anchor="middle">Node.js process</text>

  <rect x="657" y="72" width="125" height="58" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="719.5" y="97" font-size="14" font-weight="bold" fill="#14411f" text-anchor="middle">RSC render</text>
  <text x="719.5" y="116" font-size="12" fill="#333333" text-anchor="middle">React on the server</text>

  <!-- request arrows -->
  <line x1="142" y1="101" x2="175" y2="101" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="302" y1="101" x2="335" y2="101" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="462" y1="101" x2="495" y2="101" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="622" y1="101" x2="655" y2="101" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- notes under each stage -->
  <g font-size="12" fill="#333333" text-anchor="middle">
    <text x="79.5" y="152">Cookies, headers</text>
    <text x="79.5" y="168">and the URL</text>
    <text x="79.5" y="184">RSC header on</text>
    <text x="79.5" y="200">client navigations</text>

    <text x="239.5" y="152">Serves a cached</text>
    <text x="239.5" y="168">static shell or</text>
    <text x="239.5" y="184">forwards to the</text>
    <text x="239.5" y="200">origin on a miss</text>

    <text x="399.5" y="152">Runs before the</text>
    <text x="399.5" y="168">route: redirect,</text>
    <text x="399.5" y="184">rewrite, headers</text>
    <text x="399.5" y="200">(Node.js runtime)</text>

    <text x="559.5" y="152">Matches the route,</text>
    <text x="559.5" y="168">checks its caches,</text>
    <text x="559.5" y="184">starts the render</text>
    <text x="559.5" y="200">and streams it</text>

    <text x="719.5" y="152">Server Components</text>
    <text x="719.5" y="168">run; Suspense holes</text>
    <text x="719.5" y="184">resolve as data</text>
    <text x="719.5" y="200">arrives</text>
  </g>

  <!-- From RSC render down to the two outputs -->
  <line x1="719.5" y1="214" x2="719.5" y2="262" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="470" y="264" width="312" height="62" fill="#ffffff" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="626" y="287" font-size="14" font-weight="bold" fill="#14411f" text-anchor="middle">RSC payload</text>
  <text x="626" y="306" font-size="12" fill="#333333" text-anchor="middle">serialised UI tree plus references to</text>
  <text x="626" y="320" font-size="12" fill="#333333" text-anchor="middle">Client Components (text/x-component)</text>

  <line x1="626" y1="326" x2="626" y2="352" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="470" y="354" width="312" height="62" fill="#ffffff" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="626" y="377" font-size="14" font-weight="bold" fill="#14411f" text-anchor="middle">HTML (SSR or prerender)</text>
  <text x="626" y="396" font-size="12" fill="#333333" text-anchor="middle">built from the payload and the Client</text>
  <text x="626" y="410" font-size="12" fill="#333333" text-anchor="middle">Components, streamed in order</text>

  <!-- Response lanes back to the browser -->
  <path d="M 470 295 L 430 295 L 430 504" fill="none" stroke="#1d4f91" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M 470 385 L 450 385 L 450 504" fill="none" stroke="#1d4f91" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>

  <text x="420" y="470" font-size="12" fill="#1d3557" text-anchor="end">client navigation: only the</text>
  <text x="420" y="486" font-size="12" fill="#1d3557" text-anchor="end">RSC payload is sent</text>
  <text x="462" y="470" font-size="12" fill="#1d3557">first visit or prerender:</text>
  <text x="462" y="486" font-size="12" fill="#1d3557">HTML (CDN can cache it)</text>

  <!-- Browser outcome -->
  <rect x="17" y="506" width="765" height="40" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="400" y="522" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">In the browser</text>
  <text x="400" y="538" font-size="12" fill="#333333" text-anchor="middle">HTML paints first, then React hydrates the Client Components; later navigations apply RSC payloads without a full reload</text>
</svg>
