<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sgh-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="sgh-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="sgh-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="sgh-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A scene graph: transforms flow down, bounds flow up</text>
<rect x="65" y="55" width="170" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="150" y="70" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Scene root</text>
<text x="150" y="86" text-anchor="middle" font-size="12" fill="#374151">Group</text>
<rect x="65" y="120" width="170" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="150" y="135" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Bookshelf</text>
<text x="150" y="151" text-anchor="middle" font-size="12" fill="#374151">Group, no transform</text>
<rect x="15" y="205" width="130" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80" y="225" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Shelf</text>
<text x="80" y="241" text-anchor="middle" font-size="12" fill="#374151">mesh 0, 6 boards</text>
<rect x="165" y="205" width="150" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240" y="223" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Book_Leaning</text>
<text x="240" y="239" text-anchor="middle" font-size="12" fill="#374151">T(0.40, 0.04, 0)</text>
<text x="240" y="255" text-anchor="middle" font-size="12" fill="#374151">Rz 15 degrees</text>
<rect x="165" y="305" width="150" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="240" y="320" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Book mesh</text>
<text x="240" y="336" text-anchor="middle" font-size="12" fill="#374151">shared by 9 nodes</text>
<line x1="150" y1="95" x2="150" y2="120" stroke="#4B5563" stroke-width="1.5"/>
<line x1="150" y1="160" x2="80" y2="205" stroke="#4B5563" stroke-width="1.5"/>
<line x1="150" y1="160" x2="240" y2="205" stroke="#4B5563" stroke-width="1.5"/>
<line x1="240" y1="267" x2="240" y2="305" stroke="#4B5563" stroke-width="1.5"/>
<text x="150" y="326" text-anchor="middle" font-size="11" fill="#4B5563">Left: the graph of bookshelf.glb reduced to three levels</text>
<rect x="350" y="55" width="395" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="372" cy="75" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="372" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="392" y="80" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Update pass, top down</text>
<text x="372" y="101" text-anchor="start" font-size="12" fill="#374151">world = parent world x local</text>
<text x="372" y="117" text-anchor="start" font-size="12" fill="#374151">local = T x R x S</text>
<line x1="722" y1="67" x2="722" y2="113" stroke="#4F46E5" stroke-width="2" marker-end="url(#sgh-ai)"/>
<rect x="350" y="140" width="395" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="372" cy="160" r="11" fill="#B45309" stroke="#B45309" stroke-width="0"/>
<text x="372" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="392" y="165" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Bounds pass, bottom up</text>
<text x="372" y="186" text-anchor="start" font-size="12" fill="#374151">node bounds = union of the child bounds</text>
<text x="372" y="202" text-anchor="start" font-size="12" fill="#374151">Shelf box: (-0.6, 0, -0.15) to (0.6, 1, 0.15)</text>
<line x1="722" y1="198" x2="722" y2="152" stroke="#B45309" stroke-width="2" marker-end="url(#sgh-aa)"/>
<rect x="350" y="225" width="395" height="70" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<circle cx="372" cy="245" r="11" fill="#047857" stroke="#047857" stroke-width="0"/>
<text x="372" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="392" y="250" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Cull and draw, top down</text>
<text x="372" y="271" text-anchor="start" font-size="12" fill="#374151">skip the whole subtree when its bounds</text>
<text x="372" y="287" text-anchor="start" font-size="12" fill="#374151">lie outside the view frustum</text>
<line x1="722" y1="237" x2="722" y2="283" stroke="#047857" stroke-width="2" marker-end="url(#sgh-ag)"/>
<rect x="350" y="275" width="395" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="547.5" y="295" text-anchor="middle" font-size="12" fill="#374151">Transforms are inherited by descendants;</text>
<text x="547.5" y="311" text-anchor="middle" font-size="12" fill="#374151">render state (material) stays on the leaf</text>
</svg>
