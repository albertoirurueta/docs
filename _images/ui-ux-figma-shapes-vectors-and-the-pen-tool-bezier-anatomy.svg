<svg viewBox="0 0 720 380" width="720" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a bezier curve segment</text>
  <path d="M80 280 C160 90 330 90 400 190 S560 290 640 120" fill="none" stroke="#4F46E5" stroke-width="3"/>
  <g stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"><line x1="80" y1="280" x2="160" y2="90"/><line x1="330" y1="90" x2="400" y2="190"/><line x1="400" y1="190" x2="470" y2="290"/><line x1="560" y1="290" x2="640" y2="120"/></g>
  <g fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"><rect x="74" y="274" width="12" height="12"/><rect x="394" y="184" width="12" height="12"/><rect x="634" y="114" width="12" height="12"/></g>
  <g fill="#B45309"><circle cx="160" cy="90" r="6"/><circle cx="330" cy="90" r="6"/><circle cx="470" cy="290" r="6"/><circle cx="560" cy="290" r="6"/></g>
  <circle cx="80" cy="316" r="11" fill="#4F46E5"/><text x="80" y="320" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="160" cy="62" r="11" fill="#B45309"/><text x="160" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="400" cy="226" r="11" fill="#4F46E5"/><text x="400" y="230" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="365" cy="130" r="11" fill="#4F46E5"/><text x="365" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="470" cy="322" r="11" fill="#B45309"/><text x="470" y="326" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="30" y="352" font-size="12" fill="#374151">1 Anchor point (end of a segment)   2 Handle: its angle sets the direction of the curve   3 Smooth anchor point</text>
  <text x="30" y="370" font-size="12" fill="#374151">4 Segment (the curve between two anchors)   5 Handle: its length sets how far the curve travels before bending</text>
</svg>
