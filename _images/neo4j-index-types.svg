<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Neo4j index types at a glance</text>

  <!-- header row -->
  <rect x="40" y="48" width="180" height="34" fill="#1c4b73"/>
  <text x="130" y="70" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Index type</text>
  <rect x="220" y="48" width="460" height="34" fill="#1c4b73"/>
  <text x="450" y="70" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">What it accelerates</text>

  <!-- rows -->
  <!-- row 1: range -->
  <rect x="40" y="82" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="107" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">RANGE</text>
  <text x="52" y="124" font-size="10.5" fill="#666666">default index kind</text>
  <rect x="220" y="82" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="107" font-size="12" fill="#333333">Equality, range (&lt;, &gt;, BETWEEN) and</text>
  <text x="232" y="123" font-size="12" fill="#333333">STARTS WITH lookups on scalar properties.</text>

  <!-- row 2: text -->
  <rect x="40" y="138" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="163" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">TEXT</text>
  <text x="52" y="180" font-size="10.5" fill="#666666">string-only</text>
  <rect x="220" y="138" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="163" font-size="12" fill="#333333">CONTAINS and ENDS WITH string predicates,</text>
  <text x="232" y="179" font-size="12" fill="#333333">without scanning every node/relationship.</text>

  <!-- row 3: point -->
  <rect x="40" y="194" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="219" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">POINT</text>
  <text x="52" y="236" font-size="10.5" fill="#666666">spatial</text>
  <rect x="220" y="194" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="219" font-size="12" fill="#333333">Distance and bounding-box queries over</text>
  <text x="232" y="235" font-size="12" fill="#333333">Cartesian/WGS-84 point() values.</text>

  <!-- row 4: composite -->
  <rect x="40" y="250" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="272" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">COMPOSITE</text>
  <text x="52" y="292" font-size="10.5" fill="#666666">multi-property</text>
  <rect x="220" y="250" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="275" font-size="12" fill="#333333">Predicates on several properties of the same</text>
  <text x="232" y="291" font-size="12" fill="#333333">label/type used together, in one backing index.</text>

  <!-- row 5: full-text -->
  <rect x="40" y="306" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="328" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">FULLTEXT</text>
  <text x="52" y="348" font-size="10.5" fill="#666666">Lucene-backed</text>
  <rect x="220" y="306" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="331" font-size="12" fill="#333333">Relevance-scored word/phrase search across</text>
  <text x="232" y="347" font-size="12" fill="#333333">one or more string properties, via db.index.fulltext.*.</text>

  <!-- row 6: vector -->
  <rect x="40" y="362" width="180" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="52" y="384" font-size="14" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">VECTOR</text>
  <text x="52" y="404" font-size="10.5" fill="#666666">embeddings</text>
  <rect x="220" y="362" width="460" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1"/>
  <text x="232" y="387" font-size="12" fill="#333333">Approximate nearest-neighbour similarity search</text>
  <text x="232" y="403" font-size="12" fill="#333333">over float[] embeddings, via db.index.vector.queryNodes.</text>

  <text x="360" y="428" font-size="11.5" fill="#444444" text-anchor="middle">All six are created with CREATE INDEX / CREATE VECTOR INDEX / CREATE FULLTEXT INDEX and listed by SHOW INDEXES.</text>
</svg>
