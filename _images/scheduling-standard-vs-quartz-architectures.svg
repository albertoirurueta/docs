<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two architectures: a timer plus a lock table, or a scheduler plus a job store</text>
  <defs>
    <marker id="sq-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="sq-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ===== left: standard scheduling with ShedLock ===== -->
  <rect x="14" y="48" width="474" height="496" rx="10" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="251" y="74" font-size="14.5" font-weight="bold" fill="#222222" text-anchor="middle">@Scheduled + ShedLock</text>
  <text x="251" y="92" font-size="11" fill="#555555" text-anchor="middle">schedules are code, locks are rows</text>

  <rect x="30" y="108" width="210" height="236" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="135" y="130" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node A (one JVM)</text>
  <rect x="44" y="142" width="182" height="52" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="135" y="161" font-size="11.5" fill="#222222" text-anchor="middle">@Scheduled methods</text>
  <text x="135" y="177" font-size="10.5" fill="#555555" text-anchor="middle">the schedule exists only in memory</text>
  <rect x="44" y="204" width="182" height="46" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="135" y="223" font-size="11.5" fill="#222222" text-anchor="middle">TaskScheduler</text>
  <text x="135" y="239" font-size="10.5" fill="#555555" text-anchor="middle">1 thread, or virtual threads</text>
  <rect x="44" y="260" width="182" height="46" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="135" y="279" font-size="11.5" fill="#222222" text-anchor="middle">ShedLock aspect</text>
  <text x="135" y="295" font-size="10.5" fill="#555555" text-anchor="middle">@SchedulerLock around the method</text>
  <text x="135" y="328" font-size="10.5" fill="#666666" text-anchor="middle">every node runs its own timer</text>

  <rect x="262" y="108" width="210" height="236" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="367" y="130" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node B (one JVM)</text>
  <rect x="276" y="142" width="182" height="52" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="367" y="161" font-size="11.5" fill="#222222" text-anchor="middle">@Scheduled methods</text>
  <text x="367" y="177" font-size="10.5" fill="#555555" text-anchor="middle">same code, same ticks</text>
  <rect x="276" y="204" width="182" height="46" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="367" y="223" font-size="11.5" fill="#222222" text-anchor="middle">TaskScheduler</text>
  <text x="367" y="239" font-size="10.5" fill="#555555" text-anchor="middle">own pool, own clock</text>
  <rect x="276" y="260" width="182" height="46" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="367" y="279" font-size="11.5" fill="#222222" text-anchor="middle">ShedLock aspect</text>
  <text x="367" y="295" font-size="10.5" fill="#555555" text-anchor="middle">loses the race: skips the tick</text>
  <text x="367" y="328" font-size="10.5" fill="#666666" text-anchor="middle">no node knows about the other</text>

  <line x1="135" y1="344" x2="190" y2="396" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sq-arrow)"/>
  <line x1="367" y1="344" x2="312" y2="396" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sq-arrow)"/>
  <text x="251" y="366" font-size="10.5" fill="#1c4b73" text-anchor="middle">insert or update one row</text>
  <text x="251" y="380" font-size="10.5" fill="#1c4b73" text-anchor="middle">per tick</text>

  <rect x="110" y="398" width="282" height="100" rx="8" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="251" y="420" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Lock store (one table)</text>
  <text x="251" y="440" font-size="11" fill="#333333" text-anchor="middle">shedlock: name, lock_until,</text>
  <text x="251" y="455" font-size="11" fill="#333333" text-anchor="middle">locked_at, locked_by</text>
  <text x="251" y="475" font-size="10.5" fill="#555555" text-anchor="middle">JDBC, MongoDB, Redis and more</text>
  <text x="251" y="490" font-size="10.5" fill="#555555" text-anchor="middle">holds no schedule and no job data</text>
  <text x="251" y="524" font-size="11" fill="#b3261e" text-anchor="middle">a missed tick is simply gone</text>

  <!-- ===== right: Quartz ===== -->
  <rect x="512" y="48" width="474" height="496" rx="10" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="749" y="74" font-size="14.5" font-weight="bold" fill="#222222" text-anchor="middle">Quartz JDBC cluster</text>
  <text x="749" y="92" font-size="11" fill="#555555" text-anchor="middle">schedules are data, the database coordinates</text>

  <rect x="528" y="108" width="210" height="236" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="633" y="130" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node A (one JVM)</text>
  <rect x="542" y="142" width="182" height="52" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="633" y="161" font-size="11.5" fill="#222222" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="633" y="177" font-size="10.5" fill="#555555" text-anchor="middle">acquires due triggers</text>
  <rect x="542" y="204" width="182" height="46" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="633" y="223" font-size="11.5" fill="#222222" text-anchor="middle">Worker thread pool</text>
  <text x="633" y="239" font-size="10.5" fill="#555555" text-anchor="middle">10 threads by default</text>
  <rect x="542" y="260" width="182" height="46" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="633" y="279" font-size="11.5" fill="#222222" text-anchor="middle">Job instances</text>
  <text x="633" y="295" font-size="10.5" fill="#555555" text-anchor="middle">one new object per firing</text>
  <text x="633" y="328" font-size="10.5" fill="#666666" text-anchor="middle">instance id, check-in heartbeat</text>

  <rect x="760" y="108" width="210" height="236" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="865" y="130" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node B (one JVM)</text>
  <rect x="774" y="142" width="182" height="52" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="865" y="161" font-size="11.5" fill="#222222" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="865" y="177" font-size="10.5" fill="#555555" text-anchor="middle">same scheduler name</text>
  <rect x="774" y="204" width="182" height="46" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="865" y="223" font-size="11.5" fill="#222222" text-anchor="middle">Worker thread pool</text>
  <text x="865" y="239" font-size="10.5" fill="#555555" text-anchor="middle">shares the load, not the plan</text>
  <rect x="774" y="260" width="182" height="46" rx="5" fill="#ffffff" stroke="#2e7d32"/>
  <text x="865" y="279" font-size="11.5" fill="#222222" text-anchor="middle">Job instances</text>
  <text x="865" y="295" font-size="10.5" fill="#555555" text-anchor="middle">recovers a dead node's jobs</text>
  <text x="865" y="328" font-size="10.5" fill="#666666" text-anchor="middle">no node-to-node traffic</text>

  <line x1="633" y1="344" x2="688" y2="396" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sq-arrow)"/>
  <line x1="865" y1="344" x2="810" y2="396" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sq-arrow)"/>
  <text x="749" y="366" font-size="10.5" fill="#1c4b73" text-anchor="middle">row locks, acquire,</text>
  <text x="749" y="380" font-size="10.5" fill="#1c4b73" text-anchor="middle">fire, complete</text>

  <rect x="582" y="398" width="334" height="100" rx="8" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="749" y="420" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Job store (eleven QRTZ_ tables)</text>
  <text x="749" y="440" font-size="11" fill="#333333" text-anchor="middle">JOB_DETAILS, TRIGGERS, CRON_TRIGGERS, CALENDARS,</text>
  <text x="749" y="455" font-size="11" fill="#333333" text-anchor="middle">FIRED_TRIGGERS, LOCKS, SCHEDULER_STATE</text>
  <text x="749" y="475" font-size="10.5" fill="#555555" text-anchor="middle">official support: JDBC databases</text>
  <text x="749" y="490" font-size="10.5" fill="#555555" text-anchor="middle">holds the schedule, the job data and the history of firing</text>
  <text x="749" y="524" font-size="11" fill="#2e7d32" text-anchor="middle">a missed fire time meets the misfire policy</text>
</svg>
