  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M389,72 L352,72" marker-end="url(#ah)"/><path d="M389,140 L352,140" marker-end="url(#ah)"/><path d="M389,208 L106,208" marker-end="url(#ah)" stroke-dasharray="4 3"/><path d="M389,276 L352,276" marker-end="url(#ah)"/><path d="M389,344 L106,344" marker-end="url(#ah)" stroke-dasharray="4 3"/></g>
  <g font-size="12" fill="#374151">
    <text x="422" y="69">Hover a tab to peek at its content;</text><text x="422" y="85">click it to pin the panel open</text>
    <text x="422" y="137">Click the active tab again, or the</text><text x="422" y="153">close button, to close the panel</text>
    <text x="422" y="205">Each tab can be hidden with its own</text><text x="422" y="221">close icon on hover</text>
    <text x="422" y="273">Hidden tabs return from Apps; hidden</text><text x="422" y="289">folders from Projects, then Folders</text>
    <text x="422" y="341">Canva AI: prompt-driven design,</text><text x="422" y="357">also on the homepage side menu</text>
  </g>
  <text x="380" y="388" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
