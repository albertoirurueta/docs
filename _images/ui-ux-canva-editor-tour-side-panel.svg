  <rect x="30" y="46" width="84" height="320" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <rect x="40" y="56" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="72" y="75">Design</text>
    <rect x="40" y="90" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="72" y="109">Elements</text>
    <rect x="40" y="124" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="72" y="143">Text</text>
    <rect x="40" y="158" width="64" height="30" rx="5" fill="#4F46E5"/><text x="72" y="177" fill="#FFFFFF" font-weight="bold">Brand</text>
    <rect x="40" y="192" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="72" y="211">Uploads</text>
