<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The agent, tool and browser loop: the model chooses a tool call, a tool layer (MCP server, command line interface with skills, or a provider computer-use executor) turns it into browser actions, and the browser state comes back as an accessibility snapshot, a screenshot, or DOM and DevTools data for the next decision</title>
  <desc>Three boxes from left to right: the agent (model plus host), the tool layer and the browser with the application. Solid arrows on top carry the tool call, such as click ref e14, to the browser. Dashed arrows underneath carry the observation back: an accessibility snapshot with refs, a screenshot with pixel coordinates, or DOM and DevTools data. A curved arrow from the observation back to the model shows that the loop repeats until the task is done or a limit is reached. Three boxes at the bottom list what each observation costs and how repeatable it is.</desc>
  <defs>
    <marker id="alarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
  </defs>
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">One agent loop: observe, decide, act, observe again</text>

  <rect x="20" y="52" width="190" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="76" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">Agent</text>
  <text x="115" y="98" font-size="11" fill="#222" text-anchor="middle">Model plus host</text>
  <text x="115" y="116" font-size="10" fill="#444" text-anchor="middle">Claude Code, VS Code, Cursor,</text>
  <text x="115" y="130" font-size="10" fill="#444" text-anchor="middle">Copilot, your own loop</text>
  <text x="115" y="154" font-size="10" fill="#444" text-anchor="middle">keeps the goal, the history</text>
  <text x="115" y="168" font-size="10" fill="#444" text-anchor="middle">and the permissions;</text>
  <text x="115" y="182" font-size="10" fill="#444" text-anchor="middle">asks a human when required</text>

  <rect x="305" y="52" width="190" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="76" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Tool layer</text>
  <text x="400" y="98" font-size="11" fill="#222" text-anchor="middle">Executes one call at a time</text>
  <text x="400" y="118" font-size="10" fill="#444" text-anchor="middle">MCP server (stdio or HTTP)</text>
  <text x="400" y="134" font-size="10" fill="#444" text-anchor="middle">CLI command plus skill files</text>
  <text x="400" y="150" font-size="10" fill="#444" text-anchor="middle">provider computer-use executor</text>
  <text x="400" y="166" font-size="10" fill="#444" text-anchor="middle">built-in host browser tools</text>
  <text x="400" y="186" font-size="10" fill="#444" text-anchor="middle">holds the browser connection</text>

  <rect x="590" y="52" width="190" height="150" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="685" y="76" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">Browser</text>
  <text x="685" y="98" font-size="11" fill="#222" text-anchor="middle">Application under test</text>
  <text x="685" y="118" font-size="10" fill="#444" text-anchor="middle">DOM, accessibility tree,</text>
  <text x="685" y="134" font-size="10" fill="#444" text-anchor="middle">network, console, pixels</text>
  <text x="685" y="158" font-size="10" fill="#444" text-anchor="middle">driven through CDP, BiDi,</text>
  <text x="685" y="172" font-size="10" fill="#444" text-anchor="middle">Playwright's protocol</text>
  <text x="685" y="186" font-size="10" fill="#444" text-anchor="middle">or an extension</text>

  <line x1="210" y1="100" x2="305" y2="100" stroke="#37474f" stroke-width="1.8" marker-end="url(#alarr)"/>
  <text x="257" y="92" font-size="10" fill="#222" text-anchor="middle">tool call</text>
  <line x1="495" y1="100" x2="590" y2="100" stroke="#37474f" stroke-width="1.8" marker-end="url(#alarr)"/>
  <text x="542" y="92" font-size="10" fill="#222" text-anchor="middle">browser action</text>
  <line x1="590" y1="160" x2="495" y2="160" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#alarr)"/>
  <text x="542" y="152" font-size="10" fill="#222" text-anchor="middle">page state</text>
  <line x1="305" y1="160" x2="210" y2="160" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#alarr)"/>
  <text x="257" y="152" font-size="10" fill="#222" text-anchor="middle">observation</text>

  <path d="M115,202 C115,236 115,236 160,236 L400,236" fill="none" stroke="#37474f" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="400" y="232" font-size="10" fill="#222" text-anchor="middle">repeat until the goal is met, a step limit is reached or a human stops it</text>

  <text x="400" y="272" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Three ways the observation can describe the page</text>

  <rect x="20" y="284" width="240" height="160" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="140" y="306" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">Accessibility snapshot</text>
  <text x="140" y="326" font-size="10" fill="#222" text-anchor="middle">text tree of roles, names, states</text>
  <text x="140" y="342" font-size="10" fill="#222" text-anchor="middle">and refs such as e14</text>
  <text x="140" y="366" font-size="10" fill="#444" text-anchor="middle">Action: click(ref)</text>
  <text x="140" y="382" font-size="10" fill="#444" text-anchor="middle">Cheap, stable, locator can be derived</text>
  <text x="140" y="398" font-size="10" fill="#444" text-anchor="middle">Misses canvas and unlabeled widgets</text>
  <text x="140" y="420" font-size="10" fill="#444" text-anchor="middle">Playwright MCP and CLI,</text>
  <text x="140" y="434" font-size="10" fill="#444" text-anchor="middle">agent-browser, Claude browser tool</text>

  <rect x="280" y="284" width="240" height="160" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="400" y="306" font-size="12" font-weight="bold" fill="#006064" text-anchor="middle">Screenshot and coordinates</text>
  <text x="400" y="326" font-size="10" fill="#222" text-anchor="middle">image of the viewport or desktop</text>
  <text x="400" y="342" font-size="10" fill="#222" text-anchor="middle">read by a vision-capable model</text>
  <text x="400" y="366" font-size="10" fill="#444" text-anchor="middle">Action: click(x, y), type, key</text>
  <text x="400" y="382" font-size="10" fill="#444" text-anchor="middle">Works on any pixels</text>
  <text x="400" y="398" font-size="10" fill="#444" text-anchor="middle">More tokens, fragile to layout shifts</text>
  <text x="400" y="420" font-size="10" fill="#444" text-anchor="middle">Computer-use APIs, Playwright MCP</text>
  <text x="400" y="434" font-size="10" fill="#444" text-anchor="middle">with the vision capability</text>

  <rect x="540" y="284" width="240" height="160" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="660" y="306" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="middle">DOM and DevTools data</text>
  <text x="660" y="326" font-size="10" fill="#222" text-anchor="middle">console, network, traces,</text>
  <text x="660" y="342" font-size="10" fill="#222" text-anchor="middle">script results, page-registered tools</text>
  <text x="660" y="366" font-size="10" fill="#444" text-anchor="middle">Action: evaluate, call a tool</text>
  <text x="660" y="382" font-size="10" fill="#444" text-anchor="middle">Answers why, not only what</text>
  <text x="660" y="398" font-size="10" fill="#444" text-anchor="middle">Needs a tool for each question</text>
  <text x="660" y="420" font-size="10" fill="#444" text-anchor="middle">Chrome DevTools MCP,</text>
  <text x="660" y="434" font-size="10" fill="#444" text-anchor="middle">evaluate tools, WebMCP</text>
</svg>
