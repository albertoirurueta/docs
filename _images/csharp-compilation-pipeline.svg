<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>The C# compilation pipeline: C# source is compiled by Roslyn into an assembly containing IL and metadata, which the CLR then turns into native code by JIT compilation, by loading ReadyToRun images, or ahead of time with Native AOT.</title>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From C# source to native code</text>
  <text x="410" y="47" font-size="11" fill="#666666" text-anchor="middle">compile once to IL, then choose how it becomes machine code</text>

  <!-- stage 1: source -->
  <rect x="24" y="84" width="150" height="66" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="99" y="110" font-size="13" font-weight="bold" fill="#1f3b5c" text-anchor="middle">C# source</text>
  <text x="99" y="129" font-size="11" fill="#41566e" text-anchor="middle">Program.cs</text>
  <text x="99" y="143" font-size="11" fill="#41566e" text-anchor="middle">*.csproj</text>

  <!-- stage 2: roslyn -->
  <rect x="222" y="84" width="160" height="66" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.5"/>
  <text x="302" y="110" font-size="13" font-weight="bold" fill="#3c2a5c" text-anchor="middle">Roslyn compiler</text>
  <text x="302" y="129" font-size="11" fill="#5a4a72" text-anchor="middle">csc, driven by MSBuild</text>
  <text x="302" y="143" font-size="11" fill="#5a4a72" text-anchor="middle">analyzers, source generators</text>

  <!-- stage 3: assembly -->
  <rect x="430" y="76" width="176" height="82" rx="6" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.5"/>
  <text x="518" y="100" font-size="13" font-weight="bold" fill="#1d5236" text-anchor="middle">Assembly (.dll / .exe)</text>
  <text x="518" y="120" font-size="11" fill="#3a6b51" text-anchor="middle">IL (intermediate language)</text>
  <text x="518" y="136" font-size="11" fill="#3a6b51" text-anchor="middle">+ metadata + resources</text>
  <text x="518" y="151" font-size="10.5" fill="#6a8a79" text-anchor="middle" font-style="italic">portable: one build, every OS</text>

  <!-- arrows across the top row -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <line x1="176" y1="117" x2="218" y2="117" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="384" y1="117" x2="426" y2="117" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- runtime band -->
  <rect x="24" y="196" width="772" height="140" rx="8" fill="#fbfaf5" stroke="#c9c2ab" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="42" y="216" font-size="12" font-weight="bold" fill="#6b6244">At run time / at publish time</text>

  <line x1="518" y1="160" x2="518" y2="192" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- three paths -->
  <rect x="48" y="232" width="216" height="86" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.5"/>
  <text x="156" y="254" font-size="12.5" font-weight="bold" fill="#7a4d13" text-anchor="middle">JIT (default)</text>
  <text x="156" y="273" font-size="10.5" fill="#6d563a" text-anchor="middle">CLR compiles each method to</text>
  <text x="156" y="288" font-size="10.5" fill="#6d563a" text-anchor="middle">native code on first call;</text>
  <text x="156" y="303" font-size="10.5" fill="#6d563a" text-anchor="middle">tiered compilation re-optimises</text>

  <rect x="290" y="232" width="216" height="86" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.5"/>
  <text x="398" y="254" font-size="12.5" font-weight="bold" fill="#7a4d13" text-anchor="middle">ReadyToRun</text>
  <text x="398" y="273" font-size="10.5" fill="#6d563a" text-anchor="middle">native code precompiled into</text>
  <text x="398" y="288" font-size="10.5" fill="#6d563a" text-anchor="middle">the assembly at publish;</text>
  <text x="398" y="303" font-size="10.5" fill="#6d563a" text-anchor="middle">faster startup, JIT still available</text>

  <rect x="532" y="232" width="216" height="86" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.5"/>
  <text x="640" y="254" font-size="12.5" font-weight="bold" fill="#7a4d13" text-anchor="middle">Native AOT</text>
  <text x="640" y="273" font-size="10.5" fill="#6d563a" text-anchor="middle">whole app compiled ahead of</text>
  <text x="640" y="288" font-size="10.5" fill="#6d563a" text-anchor="middle">time to a standalone binary;</text>
  <text x="640" y="303" font-size="10.5" fill="#6d563a" text-anchor="middle">no JIT, no reflection-heavy code</text>

  <line x1="470" y1="196" x2="200" y2="228" stroke="#8a7e60" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="518" y1="196" x2="398" y2="228" stroke="#8a7e60" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="566" y1="196" x2="620" y2="228" stroke="#8a7e60" stroke-width="1.3" marker-end="url(#ar)"/>

  <text x="410" y="362" font-size="11.5" fill="#444444" text-anchor="middle">All three paths end in native machine code for the target CPU and OS.</text>
  <text x="410" y="380" font-size="10.5" fill="#777777" text-anchor="middle" font-style="italic">The IL and metadata in the assembly are what reflection, analyzers and debuggers read.</text>
</svg>
