<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <defs>
    <marker id="flexArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Panel A: flex-direction: row -->
  <text x="160" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">flex-direction: row (default)</text>

  <!-- main axis arrow (horizontal, above container) -->
  <line x1="42" y1="75" x2="278" y2="75" stroke="#333333" stroke-width="1.5" marker-start="url(#flexArrow)" marker-end="url(#flexArrow)"/>
  <text x="160" y="68" font-size="13" fill="#333333" text-anchor="middle">main axis (justify-content)</text>

  <!-- cross axis arrow (vertical, left of container) -->
  <line x1="25" y1="92" x2="25" y2="228" stroke="#333333" stroke-width="1.5" marker-start="url(#flexArrow)" marker-end="url(#flexArrow)"/>
  <text x="16" y="160" font-size="13" fill="#333333" text-anchor="middle" transform="rotate(-90 16 160)">cross axis (align-items)</text>

  <!-- flex container -->
  <rect x="40" y="90" width="240" height="140" fill="#f7f7f7" stroke="#888888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="105" font-size="11" fill="#666666" text-anchor="middle">display: flex;</text>

  <!-- flex items -->
  <rect x="60" y="120" width="60" height="90" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="90" y="170" font-size="15" fill="#1c4b73" text-anchor="middle">1</text>

  <rect x="130" y="120" width="60" height="90" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="160" y="170" font-size="15" fill="#1c4b73" text-anchor="middle">2</text>

  <rect x="200" y="120" width="60" height="60" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="230" y="155" font-size="15" fill="#1c4b73" text-anchor="middle">3</text>

  <text x="160" y="250" font-size="10.5" fill="#666666" text-anchor="middle">item 3 is shorter --</text>
  <text x="160" y="263" font-size="10.5" fill="#666666" text-anchor="middle">align-items: stretch would fill it</text>

  <!-- divider -->
  <line x1="320" y1="20" x2="320" y2="320" stroke="#dddddd" stroke-width="1"/>

  <!-- Panel B: flex-direction: column -->
  <text x="510" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">flex-direction: column</text>

  <!-- main axis arrow (vertical, left of container) -->
  <line x1="385" y1="92" x2="385" y2="308" stroke="#333333" stroke-width="1.5" marker-start="url(#flexArrow)" marker-end="url(#flexArrow)"/>
  <text x="376" y="200" font-size="13" fill="#333333" text-anchor="middle" transform="rotate(-90 376 200)">main axis (justify-content)</text>

  <!-- cross axis arrow (horizontal, above container) -->
  <line x1="402" y1="75" x2="618" y2="75" stroke="#333333" stroke-width="1.5" marker-start="url(#flexArrow)" marker-end="url(#flexArrow)"/>
  <text x="510" y="68" font-size="13" fill="#333333" text-anchor="middle">cross axis (align-items)</text>

  <!-- flex container -->
  <rect x="400" y="90" width="140" height="220" fill="#f7f7f7" stroke="#888888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="105" font-size="11" fill="#666666" text-anchor="middle">flex-direction: column;</text>

  <!-- flex items -->
  <rect x="420" y="115" width="100" height="50" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="470" y="145" font-size="15" fill="#1c4b73" text-anchor="middle">1</text>

  <rect x="420" y="180" width="100" height="50" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="470" y="210" font-size="15" fill="#1c4b73" text-anchor="middle">2</text>

  <rect x="420" y="245" width="70" height="50" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="455" y="275" font-size="15" fill="#1c4b73" text-anchor="middle">3</text>

  <text x="470" y="332" font-size="11" fill="#666666" text-anchor="middle">rotating flex-direction swaps which axis is "main"</text>
</svg>
