<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">AI, machine learning and deep learning</title>
  <desc id="d">Three nested rounded rectangles: artificial intelligence contains machine learning, which contains deep learning, which contains large language models. Rule-based systems and search sit inside AI but outside machine learning; classic algorithms such as linear models and trees sit inside machine learning but outside deep learning.</desc>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">AI contains ML, which contains deep learning</text>
  <rect x="20" y="46" width="680" height="298" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="36" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Artificial intelligence</text>
  <text x="36" y="90" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">rules, search, planning, logic</text>
  <rect x="200" y="104" width="480" height="226" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="216" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Machine learning</text>
  <text x="216" y="148" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">linear models, trees, SVM, k-NN</text>
  <rect x="400" y="162" width="264" height="152" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="416" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Deep learning</text>
  <text x="416" y="206" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">neural networks, many layers</text>
  <rect x="420" y="224" width="224" height="72" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="436" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Foundation models</text>
  <text x="436" y="270" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">LLMs, diffusion models</text>
</svg>
