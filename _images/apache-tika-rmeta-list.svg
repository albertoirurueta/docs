<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>RecursiveParserWrapper: a tree of embedded documents becomes a flat list of metadata objects</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">One container, many documents: tree in, list of metadata out</text>
<text x="450" y="46" text-anchor="middle" font-size="12" fill="#444444">publisher-email.eml parsed with RecursiveParserWrapper and RecursiveParserWrapperHandler</text>
<text x="20" y="80" font-size="13" font-weight="700" fill="#1a1a1a">What is inside the file (a tree)</text>
<text x="560" y="80" font-size="13" font-weight="700" fill="#1a1a1a">What getMetadataList() returns (a flat list)</text>
<rect x="20" y="95" width="250" height="46" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="30" y="114" font-size="13" font-weight="700" fill="#1a1a1a">publisher-email.eml</text>
<text x="30" y="131" font-size="11.5" fill="#333333">message/rfc822   container, no id</text>
<path d="M270,118.0 C415.0,118.0 415.0,118.0 558,118.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="46" y="153" width="250" height="46" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="56" y="172" font-size="13" font-weight="700" fill="#1a1a1a">samples.zip</text>
<text x="56" y="189" font-size="11.5" fill="#333333">application/zip   /1</text>
<path d="M296,176.0 C428.0,176.0 428.0,408.0 558,408.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="72" y="211" width="250" height="46" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="82" y="230" font-size="13" font-weight="700" fill="#1a1a1a">chapter-one.docx</text>
<text x="82" y="247" font-size="11.5" fill="#333333">wordprocessingml.document   /1/2</text>
<path d="M322,234.0 C441.0,234.0 441.0,234.0 558,234.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="98" y="269" width="250" height="46" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="108" y="288" font-size="13" font-weight="700" fill="#1a1a1a">figure1.png</text>
<text x="108" y="305" font-size="11.5" fill="#333333">image/png   /1/2/3</text>
<path d="M348,292.0 C454.0,292.0 454.0,176.0 558,176.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="72" y="327" width="250" height="46" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="82" y="346" font-size="13" font-weight="700" fill="#1a1a1a">catalogue.pdf</text>
<text x="82" y="363" font-size="11.5" fill="#333333">application/pdf   /1/4</text>
<path d="M322,350.0 C441.0,350.0 441.0,292.0 558,292.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="72" y="385" width="250" height="46" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="82" y="404" font-size="13" font-weight="700" fill="#1a1a1a">notes/cover-note.txt</text>
<text x="82" y="421" font-size="11.5" fill="#333333">text/plain   /1/5</text>
<path d="M322,408.0 C441.0,408.0 441.0,350.0 558,350.0" fill="none" stroke="#777777" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M34,141 L34,176.0 L46,176.0" fill="none" stroke="#999999" stroke-width="1.2"/>
<path d="M60,199 L60,234.0 L72,234.0" fill="none" stroke="#999999" stroke-width="1.2"/>
<path d="M86,257 L86,292.0 L98,292.0" fill="none" stroke="#999999" stroke-width="1.2"/>
<path d="M60,199 L60,350.0 L72,350.0" fill="none" stroke="#999999" stroke-width="1.2"/>
<path d="M60,199 L60,408.0 L72,408.0" fill="none" stroke="#999999" stroke-width="1.2"/>
<rect x="560" y="95" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="114" font-size="13" font-weight="700" fill="#1a1a1a">[0] publisher-email.eml</text>
<text x="570" y="131" font-size="11.5" fill="#333333">no tk:embedded-id-path (the container)</text>
<rect x="560" y="153" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="172" font-size="13" font-weight="700" fill="#1a1a1a">[1] figure1.png</text>
<text x="570" y="189" font-size="11.5" fill="#333333">tk:embedded-id-path = /1/2/3</text>
<rect x="560" y="211" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="230" font-size="13" font-weight="700" fill="#1a1a1a">[2] chapter-one.docx</text>
<text x="570" y="247" font-size="11.5" fill="#333333">tk:embedded-id-path = /1/2</text>
<rect x="560" y="269" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="288" font-size="13" font-weight="700" fill="#1a1a1a">[3] catalogue.pdf</text>
<text x="570" y="305" font-size="11.5" fill="#333333">tk:embedded-id-path = /1/4</text>
<rect x="560" y="327" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="346" font-size="13" font-weight="700" fill="#1a1a1a">[4] notes/cover-note.txt</text>
<text x="570" y="363" font-size="11.5" fill="#333333">tk:embedded-id-path = /1/5</text>
<rect x="560" y="385" width="320" height="46" rx="8" fill="#fdf0d0" stroke="#b07a10" stroke-width="1.6"/>
<text x="570" y="404" font-size="13" font-weight="700" fill="#1a1a1a">[5] samples.zip</text>
<text x="570" y="421" font-size="11.5" fill="#333333">tk:embedded-id-path = /1</text>
<text x="450" y="455" text-anchor="middle" font-size="11.5" fill="#444444">The container is always first. The others follow in the order their parse finished: children before parents, siblings in archive order.</text>
</svg>
