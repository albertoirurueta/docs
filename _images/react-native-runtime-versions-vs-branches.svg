<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Runtime versions vs. update branches</text>
  <text x="390" y="46" font-size="11" fill="#666666" text-anchor="middle">Which installed Places binary can receive which over-the-air update</text>

  <defs>
    <marker id="rvb-arrow-ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
    <marker id="rvb-arrow-no" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a33"/>
    </marker>
  </defs>

  <!-- Channel / branch band -->
  <rect x="30" y="66" width="710" height="62" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="385" y="90" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">channel: production -- baked into every build by eas.json, resolved at launch by expo-updates</text>
  <text x="385" y="110" font-size="10.5" fill="#333333" text-anchor="middle">points at branch: production -- repointing the branch rolls users back, with no new store release</text>

  <!-- Row 1: matching runtime version -->
  <rect x="30" y="150" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="160" y="178" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Places 1.4.0 (build 42)</text>
  <text x="160" y="198" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion: 1.4.0</text>
  <text x="160" y="214" font-size="10" fill="#333333" text-anchor="middle">installed from the store weeks ago</text>

  <line x1="294" y1="190" x2="466" y2="190" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#rvb-arrow-ok)"/>
  <text x="380" y="178" font-size="10" fill="#2d6a34" text-anchor="middle">1.4.0 = 1.4.0</text>
  <text x="380" y="208" font-size="9.5" fill="#555555" text-anchor="middle">downloaded, applied next launch</text>

  <rect x="470" y="150" width="270" height="80" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="605" y="178" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Update abc1234 on branch production</text>
  <text x="605" y="198" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion: 1.4.0</text>
  <text x="605" y="214" font-size="10" fill="#333333" text-anchor="middle">JavaScript and assets only</text>

  <!-- Row 2: the newer binary, newer update -->
  <rect x="30" y="250" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="160" y="278" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Places 1.5.0 (build 51)</text>
  <text x="160" y="298" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion: 1.5.0</text>
  <text x="160" y="314" font-size="10" fill="#333333" text-anchor="middle">shipped after a native dependency bump</text>

  <line x1="294" y1="290" x2="466" y2="290" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#rvb-arrow-ok)"/>
  <text x="380" y="278" font-size="10" fill="#2d6a34" text-anchor="middle">1.5.0 = 1.5.0</text>
  <text x="380" y="308" font-size="9.5" fill="#555555" text-anchor="middle">same branch, different runtime</text>

  <rect x="470" y="250" width="270" height="80" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="605" y="278" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Update def5678 on branch production</text>
  <text x="605" y="298" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion: 1.5.0</text>
  <text x="605" y="314" font-size="10" fill="#333333" text-anchor="middle">JavaScript and assets only</text>

  <!-- Row 3: native change, no OTA possible -->
  <rect x="30" y="350" width="260" height="90" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="1.6"/>
  <text x="160" y="378" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">Either installed binary</text>
  <text x="160" y="398" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion 1.4.0 or 1.5.0</text>
  <text x="160" y="414" font-size="10" fill="#333333" text-anchor="middle">neither contains the new native code,</text>
  <text x="160" y="430" font-size="10" fill="#333333" text-anchor="middle">so neither is allowed to load this update</text>

  <line x1="294" y1="395" x2="466" y2="395" stroke="#a33" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#rvb-arrow-no)"/>
  <text x="380" y="383" font-size="10" fill="#a33" text-anchor="middle">1.6.0 does not match</text>
  <text x="380" y="413" font-size="9.5" fill="#555555" text-anchor="middle">update ignored by both</text>

  <rect x="470" y="350" width="270" height="90" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="605" y="378" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">Update adding a Turbo Module</text>
  <text x="605" y="398" font-size="10" fill="#333333" text-anchor="middle">runtimeVersion: 1.6.0</text>
  <text x="605" y="414" font-size="10" fill="#333333" text-anchor="middle">native code changed, so the JS bundle</text>
  <text x="605" y="430" font-size="10" fill="#333333" text-anchor="middle">needs a new build and a store release</text>

  <!-- Legend -->
  <line x1="40" y1="463" x2="80" y2="463" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#rvb-arrow-ok)"/>
  <text x="92" y="467" font-size="10" fill="#555555">Solid: the binary's runtimeVersion equals the update's -- delivered over the air, no store review.</text>
  <line x1="40" y1="483" x2="80" y2="483" stroke="#a33" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#rvb-arrow-no)"/>
  <text x="92" y="487" font-size="10" fill="#555555">Dashed: the runtime versions differ -- the binary never sees the update; only a new build can ship it.</text>
</svg>
