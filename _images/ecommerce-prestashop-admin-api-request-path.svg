<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Path of a PrestaShop Admin API request</title>
  <desc id="d">Top row: an API client posts its client id, client secret, the client_credentials grant and the wanted scopes to /admin-api/access_token. The authorization server in PrestaShop checks the api client row (enabled, secret), keeps only the scopes the client owns and returns a JWT signed with the shop private key. Bottom row: the client calls a resource with the bearer token. The Admin API kernel checks that the API is enabled, that HTTPS and TLS 1.2 are used, verifies the JWT, compares the scopes required by the operation with the scopes in the token, runs the API Platform provider or processor, which dispatches a CQRS query or command to a handler that reads or writes the database. Resources come from the ps_apiresources module and from the src/ApiPlatform/Resources folder of every enabled module.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">1. Get a token (once per lifetime, default 3600 s)</text>

  <g>
    <rect x="30" y="52" width="190" height="130" rx="10" fill="#3d5266"/>
    <rect x="290" y="52" width="270" height="130" rx="10" fill="#33485c"/>
    <rect x="630" y="52" width="300" height="130" rx="10" fill="#3d5266"/>
  </g>
  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="76" font-weight="bold">API client</text>
    <text x="42" y="98" font-size="12.5">Pocket Coffee ERP,</text>
    <text x="42" y="115" font-size="12.5">catalogue sync script</text>
    <text x="42" y="138" font-size="12.5">client_id, client_secret</text>
    <text x="42" y="155" font-size="12.5">grant_type, scope</text>

    <text x="302" y="76" font-weight="bold">POST /admin-api/access_token</text>
    <text x="302" y="98" font-size="12.5">row in ps_api_client found?</text>
    <text x="302" y="115" font-size="12.5">enabled, secret matches?</text>
    <text x="302" y="132" font-size="12.5">requested scopes owned by</text>
    <text x="302" y="149" font-size="12.5">the client? else invalid_scope</text>
    <text x="302" y="166" font-size="12.5">HTTPS and TLS 1.2+ (prod)</text>

    <text x="642" y="76" font-weight="bold">Response</text>
    <text x="642" y="98" font-size="12.5">token_type Bearer, expires_in</text>
    <text x="642" y="115" font-size="12.5">access_token = JWT (RS256)</text>
    <text x="642" y="132" font-size="12.5">claims: aud, exp, scopes</text>
    <text x="642" y="149" font-size="12.5">signed with api_private_key</text>
    <text x="642" y="166" font-size="12.5">of app/config/parameters.php</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="220" y1="117" x2="288" y2="117" marker-end="url(#a)"/>
    <line x1="560" y1="117" x2="628" y2="117" marker-end="url(#a)"/>
  </g>

  <text x="40" y="224" font-size="18" font-weight="bold" fill="#f2f5f8">2. Call a resource with Authorization: Bearer token</text>

  <g>
    <rect x="30" y="242" width="120" height="150" rx="10" fill="#3d5266"/>
    <rect x="165" y="242" width="150" height="150" rx="10" fill="#33485c"/>
    <rect x="330" y="242" width="160" height="150" rx="10" fill="#3d5266"/>
    <rect x="505" y="242" width="150" height="150" rx="10" fill="#33485c"/>
    <rect x="670" y="242" width="150" height="150" rx="10" fill="#3d5266"/>
    <rect x="835" y="242" width="100" height="150" rx="10" fill="#33485c"/>
  </g>
  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="266" font-weight="bold">Client</text>
    <text x="42" y="288" font-size="12.5">GET, POST,</text>
    <text x="42" y="305" font-size="12.5">PUT, PATCH,</text>
    <text x="42" y="322" font-size="12.5">DELETE</text>
    <text x="42" y="345" font-size="12.5">JSON in,</text>
    <text x="42" y="362" font-size="12.5">JSON out</text>

    <text x="177" y="266" font-weight="bold">Kernel guards</text>
    <text x="177" y="288" font-size="12.5">API switched on</text>
    <text x="177" y="305" font-size="12.5">multistore flag</text>
    <text x="177" y="322" font-size="12.5">HTTPS, TLS 1.2+</text>
    <text x="177" y="339" font-size="12.5">401 / 404 / 426</text>

    <text x="342" y="266" font-weight="bold">Token check</text>
    <text x="342" y="288" font-size="12.5">JWT signature and</text>
    <text x="342" y="305" font-size="12.5">expiry (internal), or</text>
    <text x="342" y="322" font-size="12.5">AuthorisationServer-</text>
    <text x="342" y="339" font-size="12.5">Interface (external)</text>
    <text x="342" y="356" font-size="12.5">401 if no server fits</text>

    <text x="517" y="266" font-weight="bold">Scope check</text>
    <text x="517" y="288" font-size="12.5">scopes of the operation</text>
    <text x="517" y="305" font-size="12.5">must be in the token</text>
    <text x="517" y="322" font-size="12.5">product_read, ...</text>
    <text x="517" y="339" font-size="12.5">403 Invalid scope.</text>

    <text x="682" y="266" font-weight="bold">API Platform</text>
    <text x="682" y="288" font-size="12.5">operation attribute</text>
    <text x="682" y="305" font-size="12.5">CQRS operation,</text>
    <text x="682" y="322" font-size="12.5">PaginatedList</text>
    <text x="682" y="339" font-size="12.5">Provider, Processor</text>

    <text x="847" y="266" font-weight="bold">CQRS</text>
    <text x="847" y="288" font-size="12.5">query or</text>
    <text x="847" y="305" font-size="12.5">command</text>
    <text x="847" y="322" font-size="12.5">handler,</text>
    <text x="847" y="339" font-size="12.5">then the</text>
    <text x="847" y="356" font-size="12.5">database</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="150" y1="317" x2="163" y2="317" marker-end="url(#a)"/>
    <line x1="315" y1="317" x2="328" y2="317" marker-end="url(#a)"/>
    <line x1="490" y1="317" x2="503" y2="317" marker-end="url(#a)"/>
    <line x1="655" y1="317" x2="668" y2="317" marker-end="url(#a)"/>
    <line x1="820" y1="317" x2="833" y2="317" marker-end="url(#a)"/>
  </g>

  <text x="40" y="436" font-size="18" font-weight="bold" fill="#f4b860">Where the resources come from</text>
  <g>
    <rect x="30" y="452" width="440" height="84" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
    <rect x="490" y="452" width="440" height="84" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  </g>
  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="476" font-weight="bold">Core resources: module ps_apiresources 0.9.0</text>
    <text x="42" y="498" font-size="12.5">products, customers, groups, carriers, taxes, hooks, modules ...</text>
    <text x="42" y="516" font-size="12.5">301 routes in 9.2.0 (277 API Platform operations)</text>

    <text x="502" y="476" font-weight="bold">Module resources: src/ApiPlatform/Resources</text>
    <text x="502" y="498" font-size="12.5">loaded only while the module is installed and enabled</text>
    <text x="502" y="516" font-size="12.5">scopes declared on the attribute appear in the client form</text>
  </g>
  <g stroke="#f4b860" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="400" y1="452" x2="400" y2="412"/>
    <line x1="750" y1="452" x2="750" y2="412"/>
    <line x1="400" y1="412" x2="750" y2="412"/>
    <line x1="750" y1="412" x2="750" y2="396" marker-end="url(#b)" stroke-dasharray="none"/>
  </g>
</svg>
