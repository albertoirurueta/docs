<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Decoupled template logic</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">markup and logic live in two resources and are merged while the template is parsed</text>

  <!-- markup file -->
  <rect x="30" y="70" width="270" height="130" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="165" y="92" font-size="13" font-weight="bold" fill="#14501f" text-anchor="middle">home.html (designer)</text>
  <text x="46" y="116" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;table id="booksTable"&gt;</text>
  <text x="58" y="134" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;tr&gt;</text>
  <text x="70" y="152" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;td class="title"&gt;Dune&lt;/td&gt;</text>
  <text x="58" y="170" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;/tr&gt;</text>
  <text x="165" y="190" font-size="11" fill="#1e6b34" text-anchor="middle">no th:* attributes at all</text>

  <!-- logic file -->
  <rect x="30" y="230" width="270" height="130" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="165" y="252" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">home.th.xml (developer)</text>
  <text x="46" y="276" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;attr sel="#booksTable"</text>
  <text x="82" y="292" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:remove="all-but-first"&gt;</text>
  <text x="58" y="310" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">&lt;attr sel="td.title"</text>
  <text x="94" y="326" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:text="${b.title}"/&gt;</text>
  <text x="165" y="348" font-size="11" fill="#8a6a00" text-anchor="middle">same folder, same base name</text>

  <!-- resolver -->
  <rect x="350" y="250" width="240" height="90" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="470" y="272" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">IDecoupledTemplateLogicResolver</text>
  <text x="470" y="294" font-size="11" fill="#444444" text-anchor="middle">prefix + base name + suffix</text>
  <text x="470" y="312" font-size="11" fill="#444444" text-anchor="middle">default suffix: .th.xml</text>
  <text x="470" y="330" font-size="11" fill="#444444" text-anchor="middle">(useDecoupledLogic must be true)</text>

  <!-- parser -->
  <rect x="370" y="110" width="200" height="90" fill="#e8eefc" stroke="#2a4a9a" stroke-width="1.6"/>
  <text x="470" y="136" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle">Parser (AttoParser)</text>
  <text x="470" y="158" font-size="11" fill="#2a4a9a" text-anchor="middle">reads the template and injects</text>
  <text x="470" y="174" font-size="11" fill="#2a4a9a" text-anchor="middle">attributes on selected nodes</text>
  <text x="470" y="190" font-size="11" fill="#2a4a9a" text-anchor="middle">while it parses</text>

  <!-- result -->
  <rect x="640" y="110" width="230" height="90" fill="#e8eefc" stroke="#2a4a9a" stroke-width="1.6"/>
  <text x="755" y="136" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle">Parsed template</text>
  <text x="755" y="158" font-size="11" fill="#2a4a9a" text-anchor="middle">looks as if th:* were written</text>
  <text x="755" y="174" font-size="11" fill="#2a4a9a" text-anchor="middle">in the markup</text>
  <text x="755" y="190" font-size="11" fill="#2a4a9a" text-anchor="middle">cached with the injected attributes</text>

  <rect x="640" y="250" width="230" height="90" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="755" y="276" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Processing</text>
  <text x="755" y="298" font-size="11" fill="#444444" text-anchor="middle">th:remove, th:each and th:text run</text>
  <text x="755" y="314" font-size="11" fill="#444444" text-anchor="middle">against the model; cached templates</text>
  <text x="755" y="330" font-size="11" fill="#444444" text-anchor="middle">pay no extra cost</text>

  <g stroke="#444444" stroke-width="1.6" fill="#444444">
    <line x1="300" y1="135" x2="364" y2="148"/><polygon points="370,149 360,153 361,143"/>
    <line x1="300" y1="295" x2="344" y2="295"/><polygon points="350,295 341,290 341,300"/>
    <line x1="470" y1="250" x2="470" y2="206"/><polygon points="470,200 465,209 475,209"/>
    <line x1="570" y1="155" x2="634" y2="155"/><polygon points="640,155 631,150 631,160"/>
    <line x1="755" y1="200" x2="755" y2="244"/><polygon points="755,250 750,241 760,241"/>
  </g>
  <text x="332" y="128" font-size="10" fill="#444444" text-anchor="middle">1. markup</text>
  <text x="480" y="228" font-size="10" fill="#444444">2. logic resource</text>
</svg>
