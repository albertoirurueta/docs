<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-passes-and-load-store-tile-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Load and store actions move data between tile memory and memory</text>
<rect x="30" y="60" width="160" height="290" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="110" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Texture in memory</text>
<rect x="570" y="60" width="160" height="290" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="650" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Texture in memory</text>
<rect x="300" y="60" width="160" height="290" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="82" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Tile memory (on chip)</text>
<text x="380" y="100" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">the pass runs here</text>
<text x="250" y="130" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">load</text>
<text x="250" y="215" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">clear</text>
<text x="250" y="300" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">dontCare</text>
<line x1="190" y1="138" x2="300" y2="138" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-render-passes-and-load-store-tile-memory)"/>
<text x="250" y="154" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">copy in</text>
<line x1="380" y1="222" x2="380" y2="222" stroke="#4B5563" stroke-width="1"/>
<rect x="310" y="190" width="140" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="210.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">fill with clear value</text>
<text x="250" y="238" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">no read</text>
<rect x="310" y="276" width="140" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="296.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">contents undefined</text>
<text x="250" y="322" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">no read, no write</text>
<text x="510" y="130" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">store</text>
<text x="510" y="213" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">resolve</text>
<text x="510" y="288" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">dontCare</text>
<line x1="460" y1="138" x2="570" y2="138" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-render-passes-and-load-store-tile-memory)"/>
<text x="510" y="154" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">copy out</text>
<line x1="460" y1="222" x2="570" y2="222" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-render-passes-and-load-store-tile-memory)"/>
<text x="510" y="238" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">averaged samples</text>
<line x1="460" y1="300" x2="490" y2="300" stroke="#4B5563" stroke-width="2"/>
<line x1="490" y1="292" x2="490" y2="308" stroke="#B45309" stroke-width="2"/>
<text x="530" y="322" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">discarded</text>
<text x="380" y="380" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Every arrow that crosses the boundary costs memory bandwidth; skipping an arrow is free.</text>
</svg>
