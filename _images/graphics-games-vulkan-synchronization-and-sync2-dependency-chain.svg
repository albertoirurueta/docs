<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-syn-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What a barrier connects</text>
<rect x="20" y="60" width="200" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120.0" y="93.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Commands before</text>
<text x="120.0" y="108.8" text-anchor="middle" font-size="11" fill="#92400E">(submission order)</text>
<text x="120.0" y="123.8" text-anchor="middle" font-size="11" fill="#92400E"></text>
<text x="120.0" y="138.8" text-anchor="middle" font-size="11" fill="#92400E">srcStageMask</text>
<text x="120.0" y="153.8" text-anchor="middle" font-size="11" fill="#92400E">COMPUTE_SHADER</text>
<text x="120.0" y="168.8" text-anchor="middle" font-size="11" fill="#92400E">srcAccessMask</text>
<text x="120.0" y="183.8" text-anchor="middle" font-size="11" fill="#92400E">SHADER_STORAGE_WRITE</text>
<rect x="280" y="60" width="200" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="101.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">The barrier</text>
<text x="380.0" y="116.3" text-anchor="middle" font-size="11" fill="#3730A3"></text>
<text x="380.0" y="131.3" text-anchor="middle" font-size="11" fill="#3730A3">1 execution dependency</text>
<text x="380.0" y="146.3" text-anchor="middle" font-size="11" fill="#3730A3">2 availability (flush)</text>
<text x="380.0" y="161.3" text-anchor="middle" font-size="11" fill="#3730A3">3 visibility (invalidate)</text>
<text x="380.0" y="176.3" text-anchor="middle" font-size="11" fill="#3730A3">4 layout transition</text>
<rect x="540" y="60" width="200" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="93.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Commands after</text>
<text x="640.0" y="108.8" text-anchor="middle" font-size="11" fill="#065F46">(submission order)</text>
<text x="640.0" y="123.8" text-anchor="middle" font-size="11" fill="#065F46"></text>
<text x="640.0" y="138.8" text-anchor="middle" font-size="11" fill="#065F46">dstStageMask</text>
<text x="640.0" y="153.8" text-anchor="middle" font-size="11" fill="#065F46">FRAGMENT_SHADER</text>
<text x="640.0" y="168.8" text-anchor="middle" font-size="11" fill="#065F46">dstAccessMask</text>
<text x="640.0" y="183.8" text-anchor="middle" font-size="11" fill="#065F46">SHADER_SAMPLED_READ</text>
<line x1="220" y1="135" x2="278" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-chain)"/>
<line x1="480" y1="135" x2="538" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-chain)"/>
<text x="380" y="244" text-anchor="middle" font-size="12" fill="#1F2937">Only the stages in the first scope must finish, and only the stages in the second scope must wait.</text>
<text x="380" y="266" text-anchor="middle" font-size="12" fill="#1F2937">Writes become visible to the second scope only if source access and destination access both name them.</text>
<rect x="20" y="290" width="220" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="323.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Execution dependency</text>
<text x="130.0" y="338.9" text-anchor="middle" font-size="11" fill="#374151">finish A before start B</text>
<text x="130.0" y="353.9" text-anchor="middle" font-size="11" fill="#374151">not enough alone for data</text>
<rect x="270" y="290" width="220" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="323.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Memory dependency</text>
<text x="380.0" y="338.9" text-anchor="middle" font-size="11" fill="#374151">make the write available,</text>
<text x="380.0" y="353.9" text-anchor="middle" font-size="11" fill="#374151">then visible to the reader</text>
<rect x="520" y="290" width="220" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="323.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">No barrier, wrong mask</text>
<text x="630.0" y="338.9" text-anchor="middle" font-size="11" fill="#92400E">race, stale data,</text>
<text x="630.0" y="353.9" text-anchor="middle" font-size="11" fill="#92400E">or validation error</text>
</svg>
