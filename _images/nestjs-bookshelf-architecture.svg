<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf architecture</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">one Nest monorepo, two applications, shared libraries</text>

  <!-- clients -->
  <rect x="20" y="70" width="140" height="150" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="90" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="90" y="120" font-size="11" fill="#444444" text-anchor="middle">Browser / mobile</text>
  <text x="90" y="140" font-size="11" fill="#444444" text-anchor="middle">REST + GraphQL</text>
  <text x="90" y="160" font-size="11" fill="#444444" text-anchor="middle">SSE review feed</text>
  <text x="90" y="180" font-size="11" fill="#444444" text-anchor="middle">WebSocket chat</text>
  <text x="90" y="205" font-size="10" fill="#666666" text-anchor="middle">Next.js front end</text>

  <!-- api app -->
  <rect x="230" y="70" width="270" height="200" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="365" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">apps/bookshelf-api</text>
  <text x="365" y="116" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">guards, pipes, interceptors, filters</text>
  <text x="365" y="140" font-size="11" fill="#444444" text-anchor="middle">books / authors / reviews modules</text>
  <text x="365" y="160" font-size="11" fill="#444444" text-anchor="middle">users, authentication, authorization</text>
  <text x="365" y="180" font-size="11" fill="#444444" text-anchor="middle">uploads, SSE, GraphQL, WebSocket gateway</text>
  <text x="365" y="200" font-size="11" fill="#444444" text-anchor="middle">health checks, OpenAPI, versioned routes</text>
  <text x="365" y="250" font-size="10" fill="#666666" text-anchor="middle">Express 5 or Fastify 5 adapter</text>

  <!-- notifications -->
  <rect x="580" y="70" width="160" height="90" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.8"/>
  <text x="660" y="94" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">apps/notifications</text>
  <text x="660" y="118" font-size="11" fill="#444444" text-anchor="middle">microservice</text>
  <text x="660" y="136" font-size="11" fill="#444444" text-anchor="middle">@MessagePattern / @EventPattern</text>

  <!-- worker -->
  <rect x="580" y="180" width="160" height="90" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.8"/>
  <text x="660" y="204" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">BullMQ worker</text>
  <text x="660" y="228" font-size="11" fill="#444444" text-anchor="middle">review-moderation</text>
  <text x="660" y="246" font-size="11" fill="#444444" text-anchor="middle">emails</text>

  <!-- arrows clients -> api -->
  <line x1="160" y1="145" x2="222" y2="145" stroke="#444444" stroke-width="1.4"/>
  <polygon points="230,145 221,140 221,150" fill="#444444"/>
  <!-- api -> notifications -->
  <line x1="500" y1="115" x2="572" y2="115" stroke="#444444" stroke-width="1.4"/>
  <polygon points="580,115 571,110 571,120" fill="#444444"/>
  <text x="540" y="108" font-size="10" fill="#666666" text-anchor="middle">RabbitMQ</text>
  <!-- api -> worker -->
  <line x1="500" y1="225" x2="572" y2="225" stroke="#444444" stroke-width="1.4"/>
  <polygon points="580,225 571,220 571,230" fill="#444444"/>
  <text x="540" y="218" font-size="10" fill="#666666" text-anchor="middle">queue</text>

  <!-- data stores -->
  <line x1="365" y1="270" x2="365" y2="318" stroke="#444444" stroke-width="1.4"/>
  <polygon points="365,326 360,317 370,317" fill="#444444"/>
  <rect x="150" y="328" width="170" height="64" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="235" y="352" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">PostgreSQL</text>
  <text x="235" y="372" font-size="11" fill="#444444" text-anchor="middle">TypeORM (or Prisma, Drizzle)</text>
  <rect x="340" y="328" width="170" height="64" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="425" y="352" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">MongoDB</text>
  <text x="425" y="372" font-size="11" fill="#444444" text-anchor="middle">activity feed (Mongoose)</text>
  <rect x="530" y="328" width="170" height="64" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="615" y="352" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Redis</text>
  <text x="615" y="372" font-size="11" fill="#444444" text-anchor="middle">cache and BullMQ</text>

  <!-- libs -->
  <rect x="20" y="410" width="720" height="36" fill="#ffffff" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="433" font-size="12" fill="#444444" text-anchor="middle">libs/common (DTOs, decorators, filters)  and  libs/database (entities, repositories)</text>
</svg>
