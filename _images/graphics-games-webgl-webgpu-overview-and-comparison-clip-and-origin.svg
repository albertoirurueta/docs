<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgpu-clip-and-origin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip space, depth range and texture origin</text>
<text x="190" y="62" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">WebGL (OpenGL convention)</text>
<rect x="100" y="80" width="180" height="180" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="100" y1="170" x2="280" y2="170" stroke="#9CA3AF" stroke-width="1"/><line x1="190" y1="80" x2="190" y2="260" stroke="#9CA3AF" stroke-width="1"/>
<text x="110" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">-1</text>
<text x="270" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">+1</text>
<text x="200" y="94" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">y +1</text>
<text x="200" y="254" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">y -1</text>
<text x="190" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">NDC x, y from -1 to +1 in both APIs</text>
<text x="190" y="300" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">z from -1 to +1 (near to far)</text>
<text x="190" y="318" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">texture and framebuffer origin bottom-left</text>
<text x="570" y="62" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">WebGPU (Direct3D/Metal convention)</text>
<rect x="480" y="80" width="180" height="180" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="480" y1="170" x2="660" y2="170" stroke="#9CA3AF" stroke-width="1"/><line x1="570" y1="80" x2="570" y2="260" stroke="#9CA3AF" stroke-width="1"/>
<text x="490" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">-1</text>
<text x="650" y="166" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">+1</text>
<text x="580" y="94" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">y +1</text>
<text x="580" y="254" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">y -1</text>
<text x="570" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">NDC x, y from -1 to +1 in both APIs</text>
<text x="570" y="300" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">z from 0 to +1 (near to far)</text>
<text x="570" y="318" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">texture and framebuffer origin top-left</text>
<circle cx="100" cy="260" r="5" fill="#B45309"/><circle cx="480" cy="80" r="5" fill="#B45309"/>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Porting: use a [0,1] depth projection (e.g. glMatrix perspectiveZO), flip V or Y, and re-check cull winding.</text>
<text x="380" y="368" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The orange dot marks the origin of texture coordinates and framebuffer pixels.</text>
</svg>
