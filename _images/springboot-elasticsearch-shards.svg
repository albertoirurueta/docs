<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <text x="450" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Elasticsearch: one index of 3 primary shards + 1 replica each, across a 3-node cluster</text>

  <!-- Cluster boundary -->
  <rect x="20" y="52" width="860" height="248" rx="10" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="34" y="72" font-size="12" fill="#666666">cluster</text>

  <!-- Node 1 -->
  <rect x="48" y="92" width="248" height="188" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="172" y="116" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node 1</text>

  <rect x="72" y="132" width="200" height="56" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="172" y="165" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">P0 &#183; primary</text>

  <rect x="72" y="204" width="200" height="56" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="172" y="237" font-size="13" fill="#1c4b73" text-anchor="middle">R2 &#183; replica</text>

  <!-- Node 2 -->
  <rect x="326" y="92" width="248" height="188" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="116" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node 2</text>

  <rect x="350" y="132" width="200" height="56" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="165" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">P1 &#183; primary</text>

  <rect x="350" y="204" width="200" height="56" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="450" y="237" font-size="13" fill="#1c4b73" text-anchor="middle">R0 &#183; replica</text>

  <!-- Node 3 -->
  <rect x="604" y="92" width="248" height="188" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="728" y="116" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Node 3</text>

  <rect x="628" y="132" width="200" height="56" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="728" y="165" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">P2 &#183; primary</text>

  <rect x="628" y="204" width="200" height="56" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="728" y="237" font-size="13" fill="#1c4b73" text-anchor="middle">R1 &#183; replica</text>

  <!-- Legend -->
  <rect x="300" y="316" width="22" height="16" rx="3" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="330" y="329" font-size="11" fill="#444444">primary shard (Pn)</text>

  <rect x="470" y="316" width="22" height="16" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="500" y="329" font-size="11" fill="#444444">replica of Pn (Rn) &#8212; never on the same node as its primary</text>

  <text x="450" y="358" font-size="11" fill="#444444" text-anchor="middle">Primary shard count is fixed at index creation; replica count can change at any time.</text>
</svg>
