<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Recording in parallel, submitting once</text>
<text x="190" y="60" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenGL: one context, one thread</text>
<text x="570" y="60" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Vulkan, Metal, WebGPU</text>
<rect x="60" y="80" width="260" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="98.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Render thread (owns the context)</text>
<text x="190.0" y="113.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">all calls</text>
<rect x="60" y="160" width="260" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="178.5" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Driver</text>
<text x="190.0" y="193.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">serialises into the driver</text>
<line x1="190" y1="124" x2="190" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#mr)"/>
<rect x="60" y="240" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="261.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Other threads can only prepare data</text>
<text x="190.0" y="276.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(decode textures, build CPU meshes)</text>
<rect x="400" y="80" width="170" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="485.0" y="103.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">worker 1: record</text>
<line x1="570" y1="99" x2="610" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#mr)"/>
<rect x="400" y="130" width="170" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="485.0" y="153.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">worker 2: record</text>
<line x1="570" y1="149" x2="610" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#mr)"/>
<rect x="400" y="180" width="170" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="485.0" y="203.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">worker 3: record</text>
<line x1="570" y1="199" x2="610" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#mr)"/>
<rect x="610" y="215" width="120" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="670.0" y="237.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">one thread</text>
<text x="670.0" y="252.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">submits to</text>
<text x="670.0" y="267.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">the queue</text>
<rect x="400" y="240" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="485.0" y="264.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">command buffers (distinct pools)</text>
<line x1="570" y1="260" x2="610" y2="255" stroke="#4B5563" stroke-width="1.5" marker-end="url(#mr)"/>
<text x="570" y="316" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Command pools or encoders are not shared between threads;</text>
<text x="570" y="331" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">only submission needs the queue.</text>
</svg>
