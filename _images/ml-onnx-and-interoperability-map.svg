<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">ONNX interoperability map</title>
  <desc id="d">Models trained in PyTorch, Keras and scikit-learn are exported by torch.onnx.export, model.export and skl2onnx to one ONNX file, which ONNX Runtime and other runtimes execute. Separate paths lead from PyTorch to ExecuTorch and from Keras to LiteRT for mobile and edge devices.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">One exchange format, several runtimes</text>

  <text x="90" y="62" font-size="12" text-anchor="middle" fill="#475569">Trained in</text>
  <text x="360" y="62" font-size="12" text-anchor="middle" fill="#475569">Exchange format</text>
  <text x="630" y="62" font-size="12" text-anchor="middle" fill="#475569">Executed by</text>

  <rect x="20" y="74" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90" y="101" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">PyTorch</text>
  <rect x="20" y="136" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90" y="163" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Keras 3 / TF</text>
  <rect x="20" y="198" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">scikit-learn</text>

  <rect x="270" y="112" width="180" height="96" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="360" y="146" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">model.onnx</text>
  <text x="360" y="168" font-size="12" text-anchor="middle" fill="#475569">graph + weights</text>
  <text x="360" y="186" font-size="12" text-anchor="middle" fill="#475569">IR version + opset</text>

  <rect x="560" y="74" width="140" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="101" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">ONNX Runtime</text>
  <rect x="560" y="136" width="140" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">TensorRT, OpenVINO</text>
  <rect x="560" y="198" width="140" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Browser, mobile</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M160,96 L270,140"/>
    <path d="M160,158 L270,160"/>
    <path d="M160,220 L270,180"/>
    <path d="M450,140 L560,100"/>
    <path d="M450,160 L560,158"/>
    <path d="M450,180 L560,218"/>
  </g>
  <text x="212" y="108" font-size="11" font-family="Menlo, Consolas, monospace" fill="#0F172A" transform="rotate(22 212 108)">torch.onnx.export</text>
  <text x="196" y="152" font-size="11" font-family="Menlo, Consolas, monospace" fill="#0F172A">model.export</text>
  <text x="214" y="214" font-size="11" font-family="Menlo, Consolas, monospace" fill="#0F172A" transform="rotate(-22 214 214)">skl2onnx</text>

  <text x="360" y="276" font-size="12" text-anchor="middle" fill="#475569">Separate on-device paths that do not go through ONNX</text>
  <rect x="20" y="292" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90" y="319" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">PyTorch</text>
  <rect x="270" y="292" width="180" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="319" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">.pte (ExecuTorch)</text>
  <rect x="560" y="292" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="630" y="319" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">Phone, MCU, edge</text>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M160,314 L270,314"/>
    <path d="M450,314 L560,314"/>
  </g>
  <text x="360" y="368" font-size="12" text-anchor="middle" fill="#475569">Keras 3 reaches LiteRT (.tflite) the same way through model.export(format="litert")</text>
</svg>
