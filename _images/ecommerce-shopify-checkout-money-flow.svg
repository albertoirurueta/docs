<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How a Shopify checkout builds the amount a buyer pays</title>
  <desc id="d">Five stages from left to right: the cart and delivery address, delivery options from profiles, carrier services and Functions, taxes from the chosen tax service, payment methods from Shopify Payments, gateways and Functions, and the order with its capture setting.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="10" y="20" width="150" height="150" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="85" y="46" text-anchor="middle" font-weight="bold">1. Cart</text>
  <text x="85" y="70" text-anchor="middle">variants, quantities</text>
  <text x="85" y="88" text-anchor="middle">weights, SKUs</text>
  <text x="85" y="106" text-anchor="middle">delivery address</text>
  <text x="85" y="124" text-anchor="middle">customer, market</text>
  <text x="85" y="150" text-anchor="middle" font-size="11" opacity="0.8">Pocket Coffee: 32.70 EUR</text>

  <rect x="180" y="20" width="150" height="150" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="255" y="46" text-anchor="middle" font-weight="bold">2. Delivery</text>
  <text x="255" y="70" text-anchor="middle">profile or market rates</text>
  <text x="255" y="88" text-anchor="middle">carrier-calculated rates</text>
  <text x="255" y="106" text-anchor="middle">local delivery, pickup</text>
  <text x="255" y="124" text-anchor="middle">backup rates</text>
  <text x="255" y="150" text-anchor="middle" font-size="11" opacity="0.8">Standard 4.90 EUR</text>

  <rect x="350" y="20" width="150" height="150" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="425" y="46" text-anchor="middle" font-weight="bold">3. Taxes</text>
  <text x="425" y="70" text-anchor="middle">Shopify Tax, Basic Tax,</text>
  <text x="425" y="88" text-anchor="middle">Manual Tax or a tax app</text>
  <text x="425" y="106" text-anchor="middle">overrides, exemptions</text>
  <text x="425" y="124" text-anchor="middle">included or added</text>
  <text x="425" y="150" text-anchor="middle" font-size="11" opacity="0.8">VAT on goods and shipping</text>

  <rect x="520" y="20" width="150" height="150" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="595" y="46" text-anchor="middle" font-weight="bold">4. Payment</text>
  <text x="595" y="70" text-anchor="middle">Shopify Payments</text>
  <text x="595" y="88" text-anchor="middle">third-party gateways</text>
  <text x="595" y="106" text-anchor="middle">wallets, manual methods</text>
  <text x="595" y="124" text-anchor="middle">authorize or sale</text>
  <text x="595" y="150" text-anchor="middle" font-size="11" opacity="0.8">card, Shop Pay, COD</text>

  <rect x="690" y="20" width="160" height="150" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="770" y="46" text-anchor="middle" font-weight="bold">5. Order</text>
  <text x="770" y="70" text-anchor="middle">transactions on the order</text>
  <text x="770" y="88" text-anchor="middle">capture at checkout,</text>
  <text x="770" y="106" text-anchor="middle">at fulfillment or manual</text>
  <text x="770" y="124" text-anchor="middle">payouts, disputes</text>
  <text x="770" y="150" text-anchor="middle" font-size="11" opacity="0.8">order, tax lines, shipping line</text>

  <line x1="160" y1="95" x2="178" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="95" x2="348" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="95" x2="518" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="95" x2="688" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>


  <rect x="180" y="232" width="150" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="255" y="254" text-anchor="middle" font-weight="bold" font-size="12">Admin and APIs</text>
  <text x="255" y="274" text-anchor="middle" font-size="12">delivery profiles</text>
  <text x="255" y="291" text-anchor="middle" font-size="12">market shipping options</text>
  <text x="255" y="308" text-anchor="middle" font-size="12">carrier services</text>
  <text x="255" y="328" text-anchor="middle" font-size="11" opacity="0.8">Delivery Customization</text>
  <text x="255" y="343" text-anchor="middle" font-size="10" opacity="0.8">Function: hide, rename, move</text>

  <rect x="350" y="232" width="150" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="425" y="254" text-anchor="middle" font-weight="bold" font-size="12">Admin and APIs</text>
  <text x="425" y="274" text-anchor="middle" font-size="12">tax service per region</text>
  <text x="425" y="291" text-anchor="middle" font-size="12">tax overrides by collection</text>
  <text x="425" y="308" text-anchor="middle" font-size="12">customer tax exemptions</text>
  <text x="425" y="328" text-anchor="middle" font-size="11" opacity="0.8">variant taxable flag,</text>
  <text x="425" y="343" text-anchor="middle" font-size="11" opacity="0.8">product category, HS code</text>

  <rect x="520" y="232" width="150" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="595" y="254" text-anchor="middle" font-weight="bold" font-size="12">Admin and APIs</text>
  <text x="595" y="274" text-anchor="middle" font-size="12">payment providers page</text>
  <text x="595" y="291" text-anchor="middle" font-size="12">payments extensions</text>
  <text x="595" y="308" text-anchor="middle" font-size="12">manual payment methods</text>
  <text x="595" y="328" text-anchor="middle" font-size="11" opacity="0.8">Payment Customization</text>
  <text x="595" y="343" text-anchor="middle" font-size="10" opacity="0.8">Function: hide, rename, move</text>

  <rect x="690" y="232" width="160" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="770" y="254" text-anchor="middle" font-weight="bold" font-size="12">Admin and APIs</text>
  <text x="770" y="274" text-anchor="middle" font-size="12">capture setting</text>
  <text x="770" y="291" text-anchor="middle" font-size="12">order processing options</text>
  <text x="770" y="308" text-anchor="middle" font-size="12">orderCapture mutation</text>
  <text x="770" y="328" text-anchor="middle" font-size="11" opacity="0.8">checkout and accounts</text>
  <text x="770" y="343" text-anchor="middle" font-size="11" opacity="0.8">configuration, branding</text>

  <line x1="255" y1="170" x2="255" y2="230" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="425" y1="170" x2="425" y2="230" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="595" y1="170" x2="595" y2="230" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="770" y1="170" x2="770" y2="230" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <text x="85" y="250" text-anchor="middle" font-weight="bold" font-size="13">Where merchants</text>
  <text x="85" y="268" text-anchor="middle" font-weight="bold" font-size="13">and apps change</text>
  <text x="85" y="286" text-anchor="middle" font-weight="bold" font-size="13">the result</text>
  <text x="85" y="312" text-anchor="middle" font-size="12" opacity="0.85">Storefront Cart API</text>
  <text x="85" y="330" text-anchor="middle" font-size="12" opacity="0.85">and Liquid cart read</text>
  <text x="85" y="348" text-anchor="middle" font-size="12" opacity="0.85">it, they do not set it</text>
</svg>
