<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Compose application model</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Compose application model</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">one compose.yaml = one project; services attach to networks and use volumes, configs and secrets</text>
  <rect x="20" y="60" width="720" height="320" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380" y="80" font-size="12" fill="#555555" text-anchor="middle" font-weight="bold">project "orders"  (name: or directory name)</text>
  <rect x="50" y="100" width="180" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="140.0" y="129.5" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">service api</text>
  <text x="140.0" y="144.5" font-size="9" fill="#333333" text-anchor="middle">build: .   ports 8080</text>
  <text x="140.0" y="157.5" font-size="9" fill="#333333" text-anchor="middle">depends_on db (healthy)</text>
  <rect x="290" y="100" width="180" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="129.5" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">service db</text>
  <text x="380.0" y="144.5" font-size="9" fill="#333333" text-anchor="middle">image: postgres:18.1</text>
  <text x="380.0" y="157.5" font-size="9" fill="#333333" text-anchor="middle">healthcheck pg_isready</text>
  <rect x="530" y="100" width="180" height="80" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="620.0" y="129.5" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">service adminer</text>
  <text x="620.0" y="144.5" font-size="9" fill="#333333" text-anchor="middle">profiles: [tools]</text>
  <text x="620.0" y="157.5" font-size="9" fill="#333333" text-anchor="middle">started on demand</text>
  <rect x="50" y="240" width="660" height="40" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="263.0" font-size="10" fill="#333333" text-anchor="middle">network orders_default  --  DNS: api, db, adminer</text>
  <rect x="50" y="310" width="150" height="50" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="125.0" y="331.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">volume</text>
  <text x="125.0" y="346.0" font-size="9" fill="#333333" text-anchor="middle">orders_db-data</text>
  <rect x="240" y="310" width="150" height="50" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="315.0" y="331.0" font-size="11" font-weight="bold" fill="#1f6b6b" text-anchor="middle">config</text>
  <text x="315.0" y="346.0" font-size="9" fill="#333333" text-anchor="middle">app_config (file)</text>
  <rect x="430" y="310" width="150" height="50" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="505.0" y="331.0" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">secret</text>
  <text x="505.0" y="346.0" font-size="9" fill="#333333" text-anchor="middle">/run/secrets/db_password</text>
  <line x1="140" y1="180" x2="140" y2="240" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="380" y1="180" x2="380" y2="240" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="620" y1="180" x2="620" y2="240" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="600" y="310" width="120" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="660.0" y="324.8" font-size="8.5" fill="#333333" text-anchor="middle">db mounts the volume;</text>
  <text x="660.0" y="337.2" font-size="8.5" fill="#333333" text-anchor="middle">api mounts config</text>
  <text x="660.0" y="349.8" font-size="8.5" fill="#333333" text-anchor="middle">and secret</text>
  <text x="380" y="410" font-size="10" fill="#555555" text-anchor="middle">docker compose up creates network, volumes and containers named &lt;project&gt;-&lt;service&gt;-&lt;n&gt;; down removes all but volumes</text>
</svg>
