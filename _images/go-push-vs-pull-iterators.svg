<svg viewBox="0 0 940 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="430" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Push iterators and pull iterators</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">range-over-func lets the iterator drive and calls the loop body as yield; iter.Pull lets the caller drive with next and stop</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2e"/></marker>
  </defs>
  <line x1="470" y1="64" x2="470" y2="410" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="82">Push: for v := range seq { body }</text>
    <text x="720" y="82">Pull: next, stop := iter.Pull(seq)</text>
  </g>

  <!-- push panel -->
  <g font-size="13" fill="#222222">
    <rect x="40" y="110" width="160" height="270" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="120" y="132" font-weight="bold" text-anchor="middle">seq (the iterator)</text>
    <text x="120" y="156" text-anchor="middle" font-size="12">owns the loop and the state</text>
    <rect x="300" y="110" width="160" height="270" rx="4" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="380" y="132" font-weight="bold" text-anchor="middle">loop body</text>
    <text x="380" y="156" text-anchor="middle" font-size="12">body becomes yield</text>
  </g>
  <g stroke-width="1.6" fill="none">
    <line x1="200" y1="190" x2="298" y2="190" stroke="#1c4b73" marker-end="url(#a)"/>
    <line x1="298" y1="230" x2="202" y2="230" stroke="#b23a2e" marker-end="url(#r)"/>
    <line x1="200" y1="280" x2="298" y2="280" stroke="#1c4b73" marker-end="url(#a)"/>
    <line x1="298" y1="320" x2="202" y2="320" stroke="#b23a2e" marker-end="url(#r)"/>
  </g>
  <g font-size="11" fill="#444444" text-anchor="middle">
    <text x="250" y="182">yield(v1)</text>
    <text x="250" y="246">true: go on</text>
    <text x="250" y="272">yield(v2)</text>
    <text x="250" y="336">false: break</text>
  </g>
  <text x="250" y="360" font-size="11" fill="#444444" text-anchor="middle">iterator must return</text>
  <text x="250" y="400" font-size="12" fill="#444444" text-anchor="middle">one call stack, no goroutine</text>

  <!-- pull panel -->
  <g font-size="13" fill="#222222">
    <rect x="510" y="110" width="160" height="270" rx="4" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="590" y="132" font-weight="bold" text-anchor="middle">caller</text>
    <text x="590" y="156" text-anchor="middle" font-size="12">decides when to advance</text>
    <rect x="770" y="110" width="160" height="270" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="850" y="132" font-weight="bold" text-anchor="middle">seq in a coroutine</text>
    <text x="850" y="156" text-anchor="middle" font-size="12">suspended inside yield</text>
  </g>
  <g stroke-width="1.6" fill="none">
    <line x1="670" y1="190" x2="768" y2="190" stroke="#1c4b73" marker-end="url(#a)"/>
    <line x1="768" y1="230" x2="672" y2="230" stroke="#b23a2e" marker-end="url(#r)"/>
    <line x1="670" y1="280" x2="768" y2="280" stroke="#1c4b73" marker-end="url(#a)"/>
    <line x1="768" y1="320" x2="672" y2="320" stroke="#b23a2e" marker-end="url(#r)"/>
  </g>
  <g font-size="11" fill="#444444" text-anchor="middle">
    <text x="720" y="182">next()</text>
    <text x="720" y="246">v1, true</text>
    <text x="720" y="272">stop()</text>
    <text x="720" y="336">yield returns false</text>
  </g>
  <text x="720" y="360" font-size="11" fill="#444444" text-anchor="middle">then next: zero, false</text>
  <text x="720" y="400" font-size="12" fill="#444444" text-anchor="middle">two interleaved sequences, always call stop</text>
</svg>
