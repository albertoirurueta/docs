<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Core architecture of a self-hosted WordPress site</title>
  <desc id="d">Clients (visitors, the block editor running as a React application in the browser, REST clients and WP-CLI) reach PHP entry points; WP-CLI loads wp-settings.php without a web server. Every entry point loads wp-load.php, wp-config.php and wp-settings.php, which boot the wp-includes APIs and the hook registry; wp-admin screens run on top of the same bootstrap. Extensions in wp-content (drop-ins, must-use plugins, plugins and themes) attach to hooks. Data lives in MySQL or MariaDB, optionally fronted by a persistent object cache, and uploads live on the file system.</desc>
  <rect width="760" height="540" rx="12" fill="#2b3a4a"/>

  <g font-size="12" fill="#1b2733">
    <rect x="20" y="20" width="170" height="54" rx="8" fill="#cfe3f7"/>
    <text x="32" y="42" font-weight="bold">Visitor's browser</text>
    <text x="32" y="62">HTML pages, feeds</text>
    <rect x="205" y="20" width="170" height="54" rx="8" fill="#cfe3f7"/>
    <text x="217" y="42" font-weight="bold">Block editor</text>
    <text x="217" y="62">React app, @wordpress/data</text>
    <rect x="390" y="20" width="170" height="54" rx="8" fill="#cfe3f7"/>
    <text x="402" y="42" font-weight="bold">REST clients</text>
    <text x="402" y="62">headless front ends, apps</text>
    <rect x="575" y="20" width="165" height="54" rx="8" fill="#cfe3f7"/>
    <text x="587" y="42" font-weight="bold">WP-CLI</text>
    <text x="587" y="62">shell, no web server</text>

    <rect x="20" y="110" width="720" height="74" rx="8" fill="#fbe5c8"/>
    <text x="32" y="132" font-weight="bold">PHP entry points in the WordPress root (ABSPATH)</text>
    <text x="32" y="152">index.php (front end and /wp-json/), wp-admin/*.php, admin-ajax.php, wp-login.php, wp-cron.php,</text>
    <text x="32" y="172">xmlrpc.php, wp-comments-post.php; WP-CLI loads wp-config.php and wp-settings.php itself</text>

    <rect x="20" y="220" width="235" height="96" rx="8" fill="#d9ead3"/>
    <text x="32" y="242" font-weight="bold">Bootstrap</text>
    <text x="32" y="262">wp-load.php</text>
    <text x="32" y="280">wp-config.php (site settings)</text>
    <text x="32" y="298">wp-settings.php (loads the rest)</text>
    <rect x="270" y="220" width="290" height="96" rx="8" fill="#d9ead3"/>
    <text x="282" y="242" font-weight="bold">wp-includes/ (core APIs)</text>
    <text x="282" y="262">WP, WP_Query, WP_Rewrite, $wpdb, REST server,</text>
    <text x="282" y="280">options, users, blocks, template loader</text>
    <text x="282" y="298">Plugin API: the $wp_filter hook registry</text>
    <rect x="575" y="220" width="165" height="96" rx="8" fill="#e6dcf2"/>
    <text x="587" y="242" font-weight="bold">wp-admin/</text>
    <text x="587" y="262">admin screens, list</text>
    <text x="587" y="280">tables, upgrader; runs</text>
    <text x="587" y="298">on the same bootstrap</text>

    <rect x="20" y="352" width="720" height="100" rx="10" fill="#3d5266"/>
    <rect x="30" y="364" width="165" height="54" rx="8" fill="#f7d6d6"/>
    <text x="42" y="386" font-weight="bold">Drop-ins</text>
    <text x="42" y="406">db.php, object-cache.php</text>
    <rect x="207" y="364" width="165" height="54" rx="8" fill="#f7d6d6"/>
    <text x="219" y="386" font-weight="bold">mu-plugins/</text>
    <text x="219" y="406">always on, load first</text>
    <rect x="384" y="364" width="165" height="54" rx="8" fill="#f7d6d6"/>
    <text x="396" y="386" font-weight="bold">plugins/</text>
    <text x="396" y="406">lumen-catalog</text>
    <rect x="561" y="364" width="169" height="54" rx="8" fill="#f7d6d6"/>
    <text x="573" y="386" font-weight="bold">themes/</text>
    <text x="573" y="406">lumen, lumen-child</text>
  </g>
  <text x="32" y="440" font-size="12" font-weight="bold" fill="#ffffff">wp-content/: everything site-specific, untouched by core updates</text>

  <g font-size="12" fill="#1b2733">
    <rect x="20" y="472" width="300" height="50" rx="8" fill="#cfe3f7"/>
    <text x="32" y="493" font-weight="bold">MySQL or MariaDB</text>
    <text x="32" y="512">wp_posts, wp_postmeta, wp_options, ...</text>
    <rect x="335" y="472" width="200" height="50" rx="8" fill="#cfe3f7"/>
    <text x="347" y="493" font-weight="bold">Object cache (optional)</text>
    <text x="347" y="512">Redis, Memcached, APCu</text>
    <rect x="550" y="472" width="190" height="50" rx="8" fill="#cfe3f7"/>
    <text x="562" y="493" font-weight="bold">wp-content/uploads/</text>
    <text x="562" y="512">media files on disk</text>
  </g>

  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M105 74 V102"/>
    <path d="M290 74 V102"/>
    <path d="M475 74 V102"/>
    <path d="M657 74 V102"/>
    <path d="M137 184 V212"/>
    <path d="M255 268 H270"/>
    <path d="M560 268 H575"/>
    <path d="M415 316 V336 M112 336 H645 M112 336 V356 M289 336 V356 M466 336 V356 M645 336 V356"/>
  </g>
  <g fill="#ffffff">
    <path d="M99 102 L105 110 L111 102 Z"/>
    <path d="M284 102 L290 110 L296 102 Z"/>
    <path d="M469 102 L475 110 L481 102 Z"/>
    <path d="M651 102 L657 110 L663 102 Z"/>
    <path d="M131 212 L137 220 L143 212 Z"/>
  </g>
  <text x="425" y="331" font-size="11" fill="#ffffff">callbacks attach with add_action() / add_filter()</text>
</svg>
