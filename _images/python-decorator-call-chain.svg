<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="520" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How @decorator Wraps a Call</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">@decorator above "def func(...):" rebinds the name 'func' to the value decorator(func)</text>

  <!-- original function box -->
  <rect x="40" y="58" width="200" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="80" font-size="13" fill="#222222" font-family="'Courier New', monospace">def func(...):</text>
  <text x="52" y="98" font-size="11" fill="#666666" font-family="'Courier New', monospace">    ...</text>
  <text x="52" y="118" font-size="11" fill="#666666">the original, undecorated function</text>

  <!-- arrow into wrapper -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="240" y1="94" x2="288" y2="94"/>
    <polygon points="284,88 284,100 294,94" stroke="none"/>
  </g>
  <text x="264" y="80" font-size="11" fill="#444444" text-anchor="middle">@decorator</text>

  <!-- wrapper box (highlighted, new object) -->
  <rect x="300" y="42" width="250" height="104" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="312" y="63" font-size="13" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">def wrapper(*args, **kwargs):</text>
  <text x="312" y="80" font-size="11" fill="#777777" font-family="'Courier New', monospace">    &lt;before&gt;</text>
  <text x="312" y="97" font-size="11" fill="#222222" font-family="'Courier New', monospace">    result = func(*args, **kwargs)</text>
  <text x="312" y="114" font-size="11" fill="#777777" font-family="'Courier New', monospace">    &lt;after&gt;</text>
  <text x="312" y="131" font-size="11" fill="#777777" font-family="'Courier New', monospace">    return result</text>

  <!-- arrow into rebind note -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="550" y1="94" x2="588" y2="94"/>
    <polygon points="584,88 584,100 594,94" stroke="none"/>
  </g>

  <!-- rebind note box -->
  <rect x="598" y="66" width="102" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="649" y="90" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">func =</text>
  <text x="649" y="106" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">wrapper</text>

  <text x="360" y="158" font-size="11" fill="#444444" text-anchor="middle">functools.wraps(func) copies __name__, __doc__ and friends from func onto wrapper.</text>

  <line x1="20" y1="178" x2="700" y2="178" stroke="#dddddd" stroke-width="1"/>

  <text x="360" y="202" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Call-Time Sequence</text>
  <text x="360" y="219" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">func("hi")   # the name 'func' now points at wrapper</text>

  <!-- lifeline headers -->
  <rect x="40" y="236" width="150" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="115" y="258" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">caller</text>

  <rect x="285" y="236" width="150" height="34" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="360" y="258" font-size="13" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">wrapper()</text>

  <rect x="530" y="236" width="150" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="605" y="258" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">func()</text>

  <!-- lifelines -->
  <line x1="115" y1="270" x2="115" y2="470" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="360" y1="270" x2="360" y2="470" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="605" y1="270" x2="605" y2="470" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 1: caller -> wrapper -->
  <g stroke="#2f5424" stroke-width="1.6" fill="#2f5424">
    <line x1="115" y1="300" x2="352" y2="300"/>
    <polygon points="346,295 346,305 358,300" stroke="none"/>
  </g>
  <text x="237" y="292" font-size="11" fill="#2f5424" text-anchor="middle">&#9312; func("hi")  -- really calls wrapper</text>

  <!-- 2: wrapper -> func -->
  <g stroke="#1c4b73" stroke-width="1.6" fill="#1c4b73">
    <line x1="360" y1="345" x2="597" y2="345"/>
    <polygon points="591,340 591,350 603,345" stroke="none"/>
  </g>
  <text x="482" y="337" font-size="11" fill="#1c4b73" text-anchor="middle">&#9313; func(*args, **kwargs)  -- the original</text>

  <!-- 3: func -> wrapper (return) -->
  <g stroke="#8a5a1f" stroke-width="1.6" fill="#8a5a1f" stroke-dasharray="5,3">
    <line x1="605" y1="390" x2="368" y2="390"/>
  </g>
  <polygon points="374,385 374,395 362,390" fill="#8a5a1f" stroke="none"/>
  <text x="482" y="382" font-size="11" fill="#8a5a1f" text-anchor="middle">&#9314; return value</text>

  <!-- 4: wrapper -> caller (return) -->
  <g stroke="#8a5a1f" stroke-width="1.6" fill="#8a5a1f" stroke-dasharray="5,3">
    <line x1="360" y1="435" x2="123" y2="435"/>
  </g>
  <polygon points="129,430 129,440 117,435" fill="#8a5a1f" stroke="none"/>
  <text x="237" y="427" font-size="11" fill="#8a5a1f" text-anchor="middle">&#9315; return value (possibly post-processed)</text>

  <text x="360" y="460" font-size="10" fill="#999999" text-anchor="middle" font-style="italic">wrapper runs code before AND after the call to the real func</text>

  <text x="360" y="500" font-size="12" fill="#444444" text-anchor="middle">The decorator inserts wrapper between every caller and the real function -- transparently, at every call site.</text>
</svg>
