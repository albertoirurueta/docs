<svg viewBox="0 0 820 560" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AKS cluster: control plane, node pools and surrounding services</text>

  <!-- Managed control plane (Microsoft-managed, outside the customer VNet) -->
  <rect x="40" y="50" width="740" height="80" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="60" y="72" font-size="12.5" font-weight="700" fill="#1a237e">Managed control plane (Microsoft-managed, billed by tier)</text>
  <text x="60" y="92" font-size="11" fill="#283593">kube-apiserver</text>
  <rect x="150" y="80" width="90" height="22" rx="3" fill="#ffffff" stroke="#3949ab" stroke-width="1"/>
  <text x="195" y="95" text-anchor="middle" font-size="10" fill="#283593">etcd</text>
  <rect x="260" y="80" width="110" height="22" rx="3" fill="#ffffff" stroke="#3949ab" stroke-width="1"/>
  <text x="315" y="95" text-anchor="middle" font-size="10" fill="#283593">scheduler</text>
  <rect x="390" y="80" width="150" height="22" rx="3" fill="#ffffff" stroke="#3949ab" stroke-width="1"/>
  <text x="465" y="95" text-anchor="middle" font-size="10" fill="#283593">controller-manager</text>
  <rect x="560" y="80" width="180" height="22" rx="3" fill="#ffffff" stroke="#3949ab" stroke-width="1"/>
  <text x="650" y="95" text-anchor="middle" font-size="10" fill="#283593">cloud-controller-manager</text>
  <text x="60" y="118" font-size="10" fill="#3c4043">Free / Standard / Premium tier — SLA, API server VNet integration, private cluster option</text>

  <!-- VNet boundary (customer-managed) -->
  <rect x="40" y="150" width="500" height="330" rx="8" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="56" y="172" font-size="12.5" font-weight="700" fill="#33691e">Virtual network (rg-bookshelf)</text>

  <!-- System node pool -->
  <rect x="60" y="188" width="220" height="110" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="70" y="206" font-size="11.5" font-weight="700" fill="#e65100">System node pool</text>
  <text x="70" y="222" font-size="9.5" fill="#6d4c41">mode=System, min 3 nodes</text>
  <rect x="70" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#ef6c00"/>
  <text x="100" y="250" text-anchor="middle" font-size="9" fill="#e65100">node</text>
  <rect x="140" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#ef6c00"/>
  <text x="170" y="250" text-anchor="middle" font-size="9" fill="#e65100">node</text>
  <rect x="210" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#ef6c00"/>
  <text x="240" y="250" text-anchor="middle" font-size="9" fill="#e65100">node</text>
  <text x="70" y="285" font-size="9" fill="#6d4c41">CoreDNS, metrics-server,</text>
  <text x="70" y="296" font-size="9" fill="#6d4c41">konnectivity-agent</text>

  <!-- User node pool -->
  <rect x="300" y="188" width="220" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="206" font-size="11.5" font-weight="700" fill="#0d47a1">User node pool(s)</text>
  <text x="310" y="222" font-size="9.5" fill="#37474f">mode=User, autoscaler / NAP</text>
  <rect x="310" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="340" y="250" text-anchor="middle" font-size="9" fill="#0d47a1">pod</text>
  <rect x="380" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="410" y="250" text-anchor="middle" font-size="9" fill="#0d47a1">pod</text>
  <rect x="450" y="230" width="60" height="34" rx="4" fill="#ffffff" stroke="#1565c0" stroke-dasharray="3,2"/>
  <text x="480" y="250" text-anchor="middle" font-size="9" fill="#0d47a1">spot</text>
  <text x="310" y="285" font-size="9" fill="#37474f">Azure Linux 3 / Ubuntu,</text>
  <text x="310" y="296" font-size="9" fill="#37474f">scale by VM size + spot</text>

  <!-- Networking layer -->
  <rect x="60" y="312" width="460" height="50" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="76" y="332" font-size="11" font-weight="700" fill="#311b92">Azure CNI Overlay + Cilium data plane</text>
  <text x="76" y="348" font-size="9.5" fill="#4527a0">Pod CIDR overlaid on the VNet address space; eBPF network policy and load balancing</text>

  <!-- Private endpoint / API server VNet integration -->
  <rect x="60" y="376" width="460" height="46" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="76" y="396" font-size="11" font-weight="700" fill="#880e4f">API server VNet integration / private cluster (optional)</text>
  <text x="76" y="412" font-size="9.5" fill="#6a1b4d">API server projected into a delegated subnet — no public endpoint</text>

  <!-- Load balancer -->
  <rect x="60" y="434" width="220" height="36" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="170" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#263238">Standard Load Balancer</text>

  <!-- Managed identity -->
  <rect x="300" y="434" width="220" height="36" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="410" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#263238">Kubelet managed identity</text>

  <!-- External services outside the VNet box, to the right -->
  <!-- ACR -->
  <rect x="580" y="188" width="200" height="70" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="600" y="210" font-size="11.5" font-weight="700" fill="#004d40">acrbookshelf (ACR)</text>
  <text x="600" y="228" font-size="9.5" fill="#00695c">AcrPull via managed</text>
  <text x="600" y="240" font-size="9.5" fill="#00695c">identity (--attach-acr)</text>

  <!-- Key Vault -->
  <rect x="580" y="272" width="200" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="600" y="294" font-size="11.5" font-weight="700" fill="#8d6e00">kv-bookshelf (Key Vault)</text>
  <text x="600" y="312" font-size="9.5" fill="#8d6e00">CSI secrets store driver</text>
  <text x="600" y="324" font-size="9.5" fill="#8d6e00">mounts secrets as volumes</text>

  <!-- Azure Monitor -->
  <rect x="580" y="356" width="200" height="86" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="600" y="378" font-size="11.5" font-weight="700" fill="#311b92">Azure Monitor</text>
  <text x="600" y="396" font-size="9.5" fill="#4527a0">Container Insights (logs)</text>
  <text x="600" y="410" font-size="9.5" fill="#4527a0">Managed Prometheus</text>
  <text x="600" y="424" font-size="9.5" fill="#4527a0">Managed Grafana (dashboards)</text>

  <!-- connecting lines -->
  <line x1="410" y1="130" x2="410" y2="150" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="280" y1="243" x2="300" y2="243" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="520" y1="223" x2="580" y2="223" stroke="#00695c" stroke-width="1.5"/>
  <line x1="520" y1="307" x2="580" y2="307" stroke="#f9a825" stroke-width="1.5"/>
  <line x1="520" y1="399" x2="580" y2="399" stroke="#4527a0" stroke-width="1.5"/>

  <text x="410" y="500" text-anchor="middle" font-size="10.5" fill="#5f6368">Control plane is Microsoft-managed and billed by tier; node pools, VNet, Load Balancer and</text>
  <text x="410" y="516" text-anchor="middle" font-size="10.5" fill="#5f6368">their VM/egress costs are billed to the subscription like any other compute resource.</text>
</svg>
