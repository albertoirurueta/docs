<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">R data structures: atomic vectors, NULL, lists and the attributes that build matrices, factors, dates and data frames</title>
  <desc id="ds-desc">Top panel: the six atomic vector types logical, integer, double, complex, character and raw, each with a sample value and its mode, and an arrow showing the implicit coercion order raw, logical, integer, double, complex, character, list. Middle panel: NULL, which has type NULL and length 0 and is not atomic since R 4.4.0, and the list, a recursive vector whose elements can be any object. Bottom panel: attributes added to a base vector give a matrix (integer vector plus dim), a factor (integer vector plus levels and class), a Date (double vector plus class) and a data frame (a list of equal-length columns plus names, row.names and class data.frame).</desc>
  <defs>
    <marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ds-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" rx="12" fill="#f8fafc"/>
  <text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">The vector family and the attributes on top of it</text>

  <!-- Panel 1: atomic vectors -->
  <rect x="20" y="48" width="920" height="164" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="74" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Atomic vectors: every element has the same type (a single value is a vector of length 1)</text>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1e3a8a">
    <rect x="36" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="101" y="112" text-anchor="middle" font-size="15" font-weight="bold">raw</text>
    <text x="101" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">as.raw(1)</text>
    <text x="101" y="154" text-anchor="middle" font-size="12" fill="#334155">mode raw</text>
  

    <rect x="184" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="249" y="112" text-anchor="middle" font-size="15" font-weight="bold">logical</text>
    <text x="249" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">TRUE</text>
    <text x="249" y="154" text-anchor="middle" font-size="12" fill="#334155">mode logical</text>

    <rect x="332" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="397" y="112" text-anchor="middle" font-size="15" font-weight="bold">integer</text>
    <text x="397" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">1L</text>
    <text x="397" y="154" text-anchor="middle" font-size="12" fill="#334155">mode numeric</text>

    <rect x="480" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="545" y="112" text-anchor="middle" font-size="15" font-weight="bold">double</text>
    <text x="545" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">1.5</text>
    <text x="545" y="154" text-anchor="middle" font-size="12" fill="#334155">mode numeric</text>

    <rect x="628" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="693" y="112" text-anchor="middle" font-size="15" font-weight="bold">complex</text>
    <text x="693" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">1+2i</text>
    <text x="693" y="154" text-anchor="middle" font-size="12" fill="#334155">mode complex</text>

    <rect x="776" y="88" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="841" y="112" text-anchor="middle" font-size="15" font-weight="bold">character</text>
    <text x="841" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"a"</text>
    <text x="841" y="154" text-anchor="middle" font-size="12" fill="#334155">mode character</text>
  </g>

  <line x1="40" y1="196" x2="906" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#ds-arrow)"/>
  <text x="473" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">implicit coercion: c() and unlist() return the highest type present (raw &lt; logical &lt; integer &lt; double &lt; complex &lt; character &lt; list)</text>

  <!-- Panel 2: NULL and list -->
  <rect x="20" y="234" width="920" height="116" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="260" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">The other two building blocks</text>

  <rect x="36" y="272" width="270" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="52" y="294" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0f172a">NULL</text>
  <text x="52" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">typeof "NULL", length 0, one object only</text>
  <text x="52" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is.atomic(NULL) is FALSE since R 4.4.0</text>

  <rect x="326" y="272" width="580" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="342" y="294" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#78350f">list: a recursive vector (typeof "list")</text>
  <text x="342" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Any R object can be an element, even another list or a function: no shared type.</text>
  <text x="342" y="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">list(1L, "a", list(TRUE, NULL))</text>

  <!-- Panel 3: attributes -->
  <rect x="20" y="366" width="920" height="258" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="392" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Attributes turn a base vector into a richer object (typeof does not change, class does)</text>

  <!-- sources -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="36" y="408" width="210" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="141" y="431" fill="#1e3a8a">integer vector</text>
    <rect x="262" y="408" width="210" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="367" y="431" fill="#1e3a8a">integer vector</text>
    <rect x="488" y="408" width="210" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="593" y="431" fill="#1e3a8a">double vector</text>
    <rect x="714" y="408" width="210" height="36" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="819" y="431" fill="#78350f">list of equal-length columns</text>
  </g>

  <!-- arrows -->
  <g stroke="#15803d" stroke-width="2.5" fill="none">
    <line x1="141" y1="446" x2="141" y2="504" marker-end="url(#ds-arrow-green)"/>
    <line x1="367" y1="446" x2="367" y2="504" marker-end="url(#ds-arrow-green)"/>
    <line x1="593" y1="446" x2="593" y2="504" marker-end="url(#ds-arrow-green)"/>
    <line x1="760" y1="446" x2="760" y2="504" marker-end="url(#ds-arrow-green)"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#14532d">
    <text x="151" y="470">+ dim</text>
    <text x="151" y="488">dim(x) &lt;- c(2, 3)</text>
    <text x="377" y="470">+ levels, class</text>
    <text x="377" y="488">factor(x)</text>
    <text x="603" y="470">+ class</text>
    <text x="603" y="488">class "Date"</text>
    <text x="770" y="470">+ names, row.names</text>
    <text x="770" y="488">class "data.frame"</text>
  </g>

  <!-- results -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#14532d">
    <rect x="36" y="508" width="210" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="52" y="532" font-size="15" font-weight="bold">matrix / array</text>
    <text x="52" y="554" font-size="12" fill="#334155">class "matrix" "array"</text>
    <text x="52" y="572" font-size="12" fill="#334155">typeof stays "integer"</text>
    <text x="52" y="590" font-size="12" fill="#334155">rows and columns, one type</text>

    <rect x="262" y="508" width="210" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="278" y="532" font-size="15" font-weight="bold">factor</text>
    <text x="278" y="554" font-size="12" fill="#334155">class "factor"</text>
    <text x="278" y="572" font-size="12" fill="#334155">typeof stays "integer"</text>
    <text x="278" y="590" font-size="12" fill="#334155">codes 1, 2, ... plus labels</text>

    <rect x="488" y="508" width="210" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="504" y="532" font-size="15" font-weight="bold">Date</text>
    <text x="504" y="554" font-size="12" fill="#334155">class "Date"</text>
    <text x="504" y="572" font-size="12" fill="#334155">typeof stays "double"</text>
    <text x="504" y="590" font-size="12" fill="#334155">days since 1970-01-01</text>

    <rect x="714" y="508" width="210" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="730" y="532" font-size="15" font-weight="bold">data frame</text>
    <text x="730" y="554" font-size="12" fill="#334155">class "data.frame"</text>
    <text x="730" y="572" font-size="12" fill="#334155">typeof stays "list"</text>
    <text x="730" y="590" font-size="12" fill="#334155">one column per list element</text>
  </g>
</svg>
