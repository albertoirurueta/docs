<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-hello-triangle-data-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From a C++ array to the vertex shader</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="91.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">float vertices[9]</text>
<text x="95.0" y="106.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(CPU memory)</text>
<rect x="215" y="60" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">VBO</text>
<text x="290.0" y="99.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GL_ARRAY_BUFFER</text>
<text x="290.0" y="114.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(GPU memory)</text>
<rect x="410" y="60" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="485.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">VAO</text>
<text x="485.0" y="99.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">attribute 0: 3 floats</text>
<text x="485.0" y="114.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">stride 12, offset 0</text>
<rect x="605" y="60" width="135" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="672.5" y="84.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Vertex shader</text>
<text x="672.5" y="99.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">layout(location = 0)</text>
<text x="672.5" y="114.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">in vec3 aPos</text>
<line x1="170" y1="95" x2="215" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-hello-triangle-data-flow)"/>
<line x1="365" y1="95" x2="410" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-hello-triangle-data-flow)"/>
<line x1="560" y1="95" x2="605" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-hello-triangle-data-flow)"/>
<text x="192" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glBufferData</text>
<text x="387" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glVertexAttrib-</text>
<text x="387" y="163" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Pointer</text>
<text x="582" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glDrawArrays</text>
<text x="380" y="200" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex data (three positions, x y z each)</text>
<rect x="110" y="215" width="540" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="241.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">-0.5 -0.5 0.0   |   0.5 -0.5 0.0   |   0.0 0.5 0.0</text>
<text x="380" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The VAO remembers which buffer feeds which attribute; the buffer itself only holds bytes.</text>
<text x="380" y="303" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glDrawArrays(GL_TRIANGLES, 0, 3) then runs the vertex shader three times.</text>
</svg>
