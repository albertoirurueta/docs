<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="com-title com-desc">
  <title id="com-title">Names, values and copy-on-modify in R</title>
  <desc id="com-desc">Left panel: after y gets the value of x, the names x and y both point at one vector c(1, 2, 3) whose reference count is 2. Right panel: after y[1] is changed to 99, x still points at c(1, 2, 3) with reference count 1 and y points at a new copy c(99, 2, 3) with reference count 1.</desc>
  <defs>
    <marker id="com-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="com-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" rx="12" fill="#f8fafc"/>

  <!-- Panel 1: shared -->
  <rect x="20" y="20" width="440" height="360" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="56" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">1. After <tspan font-family="ui-monospace, Menlo, Consolas, monospace">y &lt;- x</tspan></text>
  <text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">two names, one vector, nothing copied</text>

  <rect x="50" y="120" width="80" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="149" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#1e3a8a">x</text>
  <rect x="50" y="250" width="80" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="279" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#1e3a8a">y</text>

  <rect x="260" y="165" width="170" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="210" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#78350f">c(1, 2, 3)</text>
  <rect x="290" y="252" width="110" height="30" rx="15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="345" y="273" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">references: 2</text>

  <line x1="132" y1="144" x2="256" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#com-arrow)"/>
  <line x1="132" y1="272" x2="256" y2="218" stroke="#334155" stroke-width="2.5" marker-end="url(#com-arrow)"/>

  <text x="40" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">A name is a label bound to a value. The assignment</text>
  <text x="40" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">adds a second label; it does not duplicate the data.</text>

  <!-- Step arrow between the panels -->
  <line x1="466" y1="200" x2="494" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#com-arrow)"/>

  <!-- Panel 2: copied -->
  <rect x="500" y="20" width="440" height="360" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="56" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">2. After <tspan font-family="ui-monospace, Menlo, Consolas, monospace">y[1] &lt;- 99</tspan></text>
  <text x="520" y="80" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">y gets its own copy; x is untouched</text>

  <rect x="530" y="105" width="80" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#1e3a8a">x</text>
  <rect x="530" y="265" width="80" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="294" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#1e3a8a">y</text>

  <rect x="740" y="95" width="170" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="825" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#78350f">c(1, 2, 3)</text>
  <rect x="770" y="166" width="110" height="28" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="825" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">references: 1</text>

  <rect x="740" y="255" width="170" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="294" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#14532d">c(99, 2, 3)</text>
  <rect x="770" y="326" width="110" height="28" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="825" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">references: 1</text>

  <line x1="612" y1="127" x2="736" y2="127" stroke="#334155" stroke-width="2.5" marker-end="url(#com-arrow)"/>
  <line x1="612" y1="287" x2="736" y2="287" stroke="#334155" stroke-width="2.5" marker-end="url(#com-arrow)"/>
  <line x1="825" y1="198" x2="825" y2="250" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#com-arrow-green)"/>
  <text x="838" y="228" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#166534">copied here</text>

  <text x="520" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">The copy is made when y is</text>
  <text x="520" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">modified, not when it is</text>
  <text x="520" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">created.</text>

  <text x="480" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#475569">References: how many bindings point at the object (counted since R 4.0.0). A change copies only when the count is above 1.</text>
</svg>
