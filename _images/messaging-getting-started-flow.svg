<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One "order placed" event: producer to broker to two consumers</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">same event, drawn once per broker model -- solid arrows show the path the event actually travels</text>

  <!-- Kafka section label -->
  <text x="30" y="70" font-size="14" font-weight="bold" fill="#333333">Apache Kafka</text>

  <!-- Producer -->
  <rect x="30" y="90" width="140" height="70" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="100" y="118" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Producer</text>
  <text x="100" y="134" font-size="10.5" fill="#333333" text-anchor="middle">(order service)</text>

  <!-- Topic/partition -->
  <rect x="300" y="75" width="210" height="100" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="405" y="102" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Topic: orders</text>
  <text x="405" y="120" font-size="10.5" fill="#333333" text-anchor="middle">Partition 0</text>
  <text x="405" y="136" font-size="10.5" fill="#333333" text-anchor="middle">(append-only log,</text>
  <text x="405" y="150" font-size="10.5" fill="#333333" text-anchor="middle">retained after read)</text>

  <!-- Consumer group 1 -->
  <rect x="600" y="60" width="150" height="60" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="675" y="84" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer group:</text>
  <text x="675" y="100" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">billing</text>

  <!-- Consumer group 2 -->
  <rect x="600" y="150" width="150" height="60" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="675" y="174" font-size="11.5" font-weight="bold" fill="#a33" text-anchor="middle">Consumer group:</text>
  <text x="675" y="190" font-size="11.5" font-weight="bold" fill="#a33" text-anchor="middle">shipping</text>

  <!-- arrows kafka -->
  <line x1="170" y1="125" x2="300" y2="120" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="235" y="105" font-size="9.5" fill="#333333" text-anchor="middle">send(topic=orders,</text>
  <text x="235" y="117" font-size="9.5" fill="#333333" text-anchor="middle">key=orderId, event)</text>

  <line x1="510" y1="110" x2="600" y2="95" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="510" y1="150" x2="600" y2="175" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="555" y="205" font-size="9.5" fill="#666666" text-anchor="middle">each group reads the</text>
  <text x="555" y="217" font-size="9.5" fill="#666666" text-anchor="middle">full log at its own offset</text>

  <text x="30" y="240" font-size="10.5" fill="#666666">Kafka has no per-message "queue" -- every subscribed consumer group sees every event;</text>
  <text x="30" y="254" font-size="10.5" fill="#666666">a group's members split the partitions among themselves, they do not compete for one record.</text>

  <!-- divider -->
  <line x1="20" y1="280" x2="740" y2="280" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- RabbitMQ section label -->
  <text x="30" y="312" font-size="14" font-weight="bold" fill="#333333">RabbitMQ</text>

  <!-- Publisher -->
  <rect x="30" y="330" width="140" height="70" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="100" y="358" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Publisher</text>
  <text x="100" y="374" font-size="10.5" fill="#333333" text-anchor="middle">(order service)</text>

  <!-- Exchange -->
  <rect x="260" y="330" width="160" height="70" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="340" y="358" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Exchange: orders</text>
  <text x="340" y="374" font-size="10.5" fill="#333333" text-anchor="middle">(type = topic)</text>

  <!-- Queue+consumer1 -->
  <rect x="500" y="290" width="220" height="60" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="610" y="313" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Queue: billing-queue</text>
  <text x="610" y="329" font-size="10.5" fill="#333333" text-anchor="middle">Consumer: billing-service</text>

  <!-- Queue+consumer2 -->
  <rect x="500" y="390" width="220" height="60" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="610" y="413" font-size="11.5" font-weight="bold" fill="#a33" text-anchor="middle">Queue: shipping-queue</text>
  <text x="610" y="429" font-size="10.5" fill="#333333" text-anchor="middle">Consumer: shipping-service</text>

  <!-- arrows rabbitmq -->
  <line x1="170" y1="365" x2="260" y2="365" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="215" y="352" font-size="9.5" fill="#333333" text-anchor="middle">basicPublish</text>

  <line x1="420" y1="350" x2="500" y2="320" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="420" y1="380" x2="500" y2="415" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="460" y="300" font-size="9.5" fill="#666666" text-anchor="middle">routed by</text>
  <text x="460" y="460" font-size="9.5" fill="#666666" text-anchor="middle">binding key</text>

  <text x="30" y="480" font-size="10.5" fill="#666666">The exchange copies the event into every bound queue; consumers attached to the same</text>
  <text x="30" y="494" font-size="10.5" fill="#666666">queue compete for each message -- the opposite sharing model from a Kafka consumer group.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
