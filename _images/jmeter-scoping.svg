<line x1="89" y1="302.0" x2="99" y2="302.0" stroke="currentColor" opacity="0.5"/>
<line x1="89" y1="290.0" x2="89" y2="302.0" stroke="currentColor" opacity="0.5"/>
<circle cx="108" cy="302.0" r="6" fill="#ef4444" fill-opacity="0.6" stroke="#ef4444"/>
