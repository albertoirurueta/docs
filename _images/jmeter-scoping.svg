<line x1="89" y1="218.0" x2="99" y2="218.0" stroke="currentColor" opacity="0.5"/>
<line x1="89" y1="206.0" x2="89" y2="218.0" stroke="currentColor" opacity="0.5"/>
<circle cx="108" cy="218.0" r="6" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b"/>
<text x="120" y="222.0">Constant Timer 500 ms</text>
<line x1="24" y1="232.0" x2="480" y2="232.0" stroke="currentColor" opacity="0.08"/>
<line x1="89" y1="246.0" x2="99" y2="246.0" stroke="currentColor" opacity="0.5"/>
<line x1="89" y1="234.0" x2="89" y2="246.0" stroke="currentColor" opacity="0.5"/>
<circle cx="108" cy="246.0" r="6" fill="#ef4444" fill-opacity="0.6" stroke="#ef4444"/>
