<text x="94" y="166.0">HTTP Request Defaults</text>
<line x1="24" y1="176.0" x2="480" y2="176.0" stroke="currentColor" opacity="0.08"/>
<line x1="63" y1="190.0" x2="73" y2="190.0" stroke="currentColor" opacity="0.5"/>
<line x1="63" y1="178.0" x2="63" y2="190.0" stroke="currentColor" opacity="0.5"/>
<circle cx="82" cy="190.0" r="6" fill="#a855f7" fill-opacity="0.6" stroke="#a855f7"/>
