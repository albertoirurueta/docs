<rect x="570" y="172" width="20" height="136" rx="6" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.5"/>
<text x="660" y="52" font-size="10" text-anchor="middle">JSON Assertion</text>
<rect x="650" y="228" width="20" height="52" rx="6" fill="#06b6d4" fill-opacity="0.35" stroke="#06b6d4" stroke-width="1.5"/>
<text x="740" y="52" font-size="10" text-anchor="middle">Random Timer</text>
