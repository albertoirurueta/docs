<line x1="37" y1="106.0" x2="47" y2="106.0" stroke="currentColor" opacity="0.5"/>
<line x1="37" y1="94.0" x2="37" y2="106.0" stroke="currentColor" opacity="0.5"/>
<circle cx="56" cy="106.0" r="6" fill="#3b82f6" fill-opacity="0.6" stroke="#3b82f6"/>
<text x="68" y="110.0">Thread Group: Bookshelf users</text>
<line x1="24" y1="120.0" x2="480" y2="120.0" stroke="currentColor" opacity="0.08"/>
<line x1="63" y1="134.0" x2="73" y2="134.0" stroke="currentColor" opacity="0.5"/>
<line x1="63" y1="122.0" x2="63" y2="134.0" stroke="currentColor" opacity="0.5"/>
<circle cx="82" cy="134.0" r="6" fill="#10b981" fill-opacity="0.6" stroke="#10b981"/>
