<line x1="24" y1="344.0" x2="480" y2="344.0" stroke="currentColor" opacity="0.08"/>
<line x1="89" y1="358.0" x2="99" y2="358.0" stroke="currentColor" opacity="0.5"/>
<line x1="89" y1="346.0" x2="89" y2="358.0" stroke="currentColor" opacity="0.5"/>
<circle cx="108" cy="358.0" r="6" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b"/>
<text x="120" y="362.0">Uniform Random Timer</text>
<line x1="24" y1="372.0" x2="480" y2="372.0" stroke="currentColor" opacity="0.08"/>
<line x1="63" y1="386.0" x2="73" y2="386.0" stroke="currentColor" opacity="0.5"/>
<line x1="63" y1="374.0" x2="63" y2="386.0" stroke="currentColor" opacity="0.5"/>
<circle cx="82" cy="386.0" r="6" fill="#64748b" fill-opacity="0.6" stroke="#64748b"/>
<text x="94" y="390.0">Summary Report (listener)</text>
<line x1="24" y1="400.0" x2="480" y2="400.0" stroke="currentColor" opacity="0.08"/>
<circle cx="500" cy="246.0" r="4" fill="#10b981"/>
<circle cx="500" cy="302.0" r="4" fill="#10b981"/>
<circle cx="500" cy="330.0" r="4" fill="#10b981"/>
<circle cx="580" cy="246.0" r="4" fill="#f59e0b"/>
<circle cx="580" cy="302.0" r="4" fill="#f59e0b"/>
<circle cx="660" cy="246.0" r="4" fill="#06b6d4"/>
<circle cx="740" cy="330.0" r="4" fill="#f59e0b"/>
<text x="24" y="422" font-size="12">Filled dot = this sampler runs the element (header added, delay applied, assertion evaluated). Bars cover the subtree the element is scoped to.</text>
<text x="24" y="442" font-size="12">The Constant Timer is scoped to Browse only, the Random Timer to POST /api/loans only.</text>
<text x="24" y="462" font-size="12">GET /api/books waits 500 ms and is asserted; GET /api/books/{id} waits 500 ms only; POST /api/loans waits for the random delay.</text>
</svg>