<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-label="Test plan tree with the scope of a header manager, timers and an assertion highlighted" font-family="sans-serif" font-size="13" fill="currentColor">
<text x="24" y="26" font-size="15" font-weight="bold">Scope of hierarchical elements in a test plan</text>
<text x="24" y="44" font-size="12" opacity="0.75">Tree (left, vertical axis = tree order, top to bottom) and the samplers each element reaches (right, horizontal axis = element)</text>
<text x="500" y="52" font-size="10" text-anchor="middle">Header Manager</text>
<rect x="490" y="116" width="20" height="276" rx="6" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-width="1.5"/>
