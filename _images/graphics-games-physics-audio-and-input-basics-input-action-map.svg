<text x="680" y="160" text-anchor="middle" font-size="12" fill="#374151">basket.x</text>
<text x="680" y="176" text-anchor="middle" font-size="12" fill="#374151">reads value</text>
<text x="680" y="192" text-anchor="middle" font-size="12" fill="#374151">each fixed step</text>
