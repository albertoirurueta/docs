<svg viewBox="0 0 760 335" width="760" height="335" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pin-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="pin-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="pin-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="pin-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="335" fill="#FFFFFF"/>
