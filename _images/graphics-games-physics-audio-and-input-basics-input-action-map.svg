<line x1="575" y1="257" x2="615" y2="257" stroke="#047857" stroke-width="2" marker-end="url(#pin-ag)"/>
<rect x="195" y="290" width="560" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="475" y="312" text-anchor="middle" font-size="11" fill="#374151">Map "Gameplay" is enabled during play; "Menu" replaces it while paused</text>
<text x="380" y="322" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Game code names actions, never keys: rebinding and new devices need no code change</text>
