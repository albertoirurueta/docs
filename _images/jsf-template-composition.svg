<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fbf"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
  <text x="490" y="28" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">A template and a template client composing one page</text>
  <text x="490" y="48" font-size="12" fill="#666666" text-anchor="middle">the client names the template and fills its slots; a slot the client leaves alone keeps the template's default content</text>
  <text x="30" y="76" font-size="13" font-weight="bold" fill="#222222">Template client: catalogue.xhtml</text>
  <text x="365" y="76" font-size="13" font-weight="bold" fill="#222222">Template: /WEB-INF/templates/layout.xhtml</text>
  <text x="725" y="76" font-size="13" font-weight="bold" fill="#222222">Composed view</text>
  <rect x="30" y="86" width="290" height="320" rx="6" fill="#eef3fb" stroke="#1f5fbf" stroke-width="1.5"/>
  <rect x="365" y="86" width="290" height="320" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <rect x="725" y="86" width="225" height="320" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="44" y="108" font-size="12" font-weight="bold" fill="#1f5fbf">&lt;ui:composition template="..."&gt;</text>
  <text x="379" y="108" font-size="12" font-weight="bold" fill="#444444">&lt;html&gt; ... &lt;/html&gt;</text>

  <rect x="46" y="118" width="258" height="46" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="56" y="137" font-size="12" font-weight="bold" fill="#222222">&lt;ui:define name="title"&gt;</text>
  <text x="56" y="154" font-size="11" fill="#555555">Catalogue</text>
  <rect x="381" y="118" width="258" height="46" rx="4" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.5"/>
  <text x="391" y="137" font-size="12" font-weight="bold" fill="#222222">&lt;ui:insert name="title"&gt;</text>
  <text x="391" y="154" font-size="11" fill="#555555">default: Bookshelf</text>
  <rect x="741" y="118" width="193" height="46" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="751" y="137" font-size="12" font-weight="bold" fill="#222222">title</text>
  <text x="751" y="154" font-size="11" fill="#1f5fbf">from the client</text>
  <path d="M 304 141 H 379" stroke="#1f5fbf" stroke-width="2" fill="none" marker-end="url(#ar-b)"/>
  <path d="M 639 141 H 739" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar-g)"/>
  <rect x="46" y="188" width="258" height="46" rx="4" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="207" font-size="12" fill="#777777">no ui:define for "nav"</text>
  <rect x="381" y="188" width="258" height="46" rx="4" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <text x="391" y="207" font-size="12" font-weight="bold" fill="#222222">&lt;ui:insert name="nav"&gt;</text>
  <text x="391" y="224" font-size="11" fill="#555555">default: a Home link</text>
  <rect x="741" y="188" width="193" height="46" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="751" y="207" font-size="12" font-weight="bold" fill="#222222">nav</text>
  <text x="751" y="224" font-size="11" fill="#666666">template default</text>
  <path d="M 639 211 H 739" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar-g)"/>
  <rect x="46" y="258" width="258" height="46" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="56" y="277" font-size="12" font-weight="bold" fill="#222222">&lt;ui:define name="content"&gt;</text>
  <text x="56" y="294" font-size="11" fill="#555555">the book list markup</text>
  <rect x="381" y="258" width="258" height="46" rx="4" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.5"/>
  <text x="391" y="277" font-size="12" font-weight="bold" fill="#222222">&lt;ui:insert name="content"&gt;</text>
  <text x="391" y="294" font-size="11" fill="#555555">no default: empty</text>
  <rect x="741" y="258" width="193" height="46" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="751" y="277" font-size="12" font-weight="bold" fill="#222222">content</text>
  <text x="751" y="294" font-size="11" fill="#1f5fbf">from the client</text>
  <path d="M 304 281 H 379" stroke="#1f5fbf" stroke-width="2" fill="none" marker-end="url(#ar-b)"/>
  <path d="M 639 281 H 739" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar-g)"/>
  <rect x="46" y="348" width="258" height="46" rx="4" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="367" font-size="12" fill="#777777">no ui:define for "footer"</text>
  <rect x="381" y="348" width="258" height="46" rx="4" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <text x="391" y="367" font-size="12" font-weight="bold" fill="#222222">&lt;ui:insert name="footer"&gt;</text>
  <text x="391" y="384" font-size="11" fill="#555555">default: (c) Bookshelf</text>
  <rect x="741" y="348" width="193" height="46" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="751" y="367" font-size="12" font-weight="bold" fill="#222222">footer</text>
  <text x="751" y="384" font-size="11" fill="#666666">template default</text>
  <path d="M 639 371 H 739" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar-g)"/>
  <line x1="30" y1="436" x2="64" y2="436" stroke="#1f5fbf" stroke-width="2"/>
  <text x="72" y="440" font-size="12" fill="#333333">the client's ui:define replaces the slot</text>
  <rect x="330" y="429" width="22" height="14" rx="2" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.2"/>
  <text x="360" y="440" font-size="12" fill="#333333">slot filled by the client</text>
  <rect x="520" y="429" width="22" height="14" rx="2" fill="#f4f4f4" stroke="#444444" stroke-width="1.2"/>
  <text x="550" y="440" font-size="12" fill="#333333">slot keeps its default content</text>
  <text x="30" y="460" font-size="11" fill="#666666">Markup outside ui:composition in the client is discarded; a template under WEB-INF cannot be requested directly.</text>
</svg>
