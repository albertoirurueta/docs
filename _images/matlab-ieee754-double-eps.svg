<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="fp-t fp-d">
  <title id="fp-t">IEEE 754 double layout and the spacing given by eps</title>
  <desc id="fp-d">Top: the 64 bits of a double split into 1 sign bit, 11 exponent bits and 52 fraction bits. Bottom: a number line with the intervals 1 to 2, 2 to 4, 4 to 8 and 8 to 16, where the gap between neighbouring doubles doubles at each power of two, from 2 to the minus 52 up to 2 to the minus 49.</desc>
  <rect x="0" y="0" width="760" height="440" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">A double has 64 bits; the gap to the next double is eps(x)</text>
  <rect x="30.0" y="70" width="10.9" height="46" fill="#fce7f3" stroke="#64748b"/>
  <rect x="40.9" y="70" width="120.3" height="46" fill="#fef9c3" stroke="#64748b"/>
  <rect x="161.2" y="70" width="568.8" height="46" fill="#dbeafe" stroke="#64748b"/>
  <text x="30" y="50" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">bit 63</text>
  <text x="101.1" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">bits 62 to 52</text>
  <text x="445.6" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">bits 51 to 0</text>
  <text x="101.1" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">exponent e (11 bits)</text>
  <text x="445.6" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">fraction f (52 bits)</text>
  <text x="35.5" y="135" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9d174d">sign s (1 bit)</text>
  <text x="380.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold">x = (-1)^s * (1 + f) * 2^(e - 1023)   (normalised numbers, widths drawn to scale)</text>
  <text x="380.0" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">single: 1 + 8 + 23 bits, exponent bias 127</text>
  <text x="30.0" y="235" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold">Gap between neighbouring doubles (tick marks are schematic, not to scale)</text>
  <rect x="30" y="270" width="175" height="60" fill="#dbeafe" stroke="#64748b"/>
  <line x1="40.9" y1="286" x2="40.9" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="51.9" y1="286" x2="51.9" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="62.8" y1="286" x2="62.8" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="73.8" y1="286" x2="73.8" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="84.7" y1="286" x2="84.7" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="95.6" y1="286" x2="95.6" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="106.6" y1="286" x2="106.6" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="117.5" y1="286" x2="117.5" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="128.4" y1="286" x2="128.4" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="139.4" y1="286" x2="139.4" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="150.3" y1="286" x2="150.3" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="161.2" y1="286" x2="161.2" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="172.2" y1="286" x2="172.2" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="183.1" y1="286" x2="183.1" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="194.1" y1="286" x2="194.1" y2="314" stroke="#334155" stroke-width="1"/>
  <text x="30.0" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">1</text>
  <text x="117.5" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">[1, 2)</text>
  <text x="117.5" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">eps = 2^-52</text>
  <text x="117.5" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">2.2204e-16</text>
  <rect x="205" y="270" width="175" height="60" fill="#dcfce7" stroke="#64748b"/>
  <line x1="226.9" y1="286" x2="226.9" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="248.8" y1="286" x2="248.8" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="270.6" y1="286" x2="270.6" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="292.5" y1="286" x2="292.5" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="314.4" y1="286" x2="314.4" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="336.2" y1="286" x2="336.2" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="358.1" y1="286" x2="358.1" y2="314" stroke="#334155" stroke-width="1"/>
  <text x="205.0" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">2</text>
  <text x="292.5" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">[2, 4)</text>
  <text x="292.5" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">eps = 2^-51</text>
  <text x="292.5" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">4.4409e-16</text>
  <rect x="380" y="270" width="175" height="60" fill="#fef9c3" stroke="#64748b"/>
  <line x1="423.8" y1="286" x2="423.8" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="467.5" y1="286" x2="467.5" y2="314" stroke="#334155" stroke-width="1"/>
  <line x1="511.2" y1="286" x2="511.2" y2="314" stroke="#334155" stroke-width="1"/>
  <text x="380.0" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">4</text>
  <text x="467.5" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">[4, 8)</text>
  <text x="467.5" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">eps = 2^-50</text>
  <text x="467.5" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">8.8818e-16</text>
  <rect x="555" y="270" width="175" height="60" fill="#fce7f3" stroke="#64748b"/>
  <line x1="642.5" y1="286" x2="642.5" y2="314" stroke="#334155" stroke-width="1"/>
  <text x="555.0" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">8</text>
  <text x="642.5" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">[8, 16)</text>
  <text x="642.5" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">eps = 2^-49</text>
  <text x="642.5" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">1.7764e-15</text>
  <text x="730.0" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">16</text>
  <text x="380.0" y="425" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">eps(5) is 8.8818e-16 because 5 lies in [4, 8); eps(1e10) is 1.9073e-06</text>
</svg>
