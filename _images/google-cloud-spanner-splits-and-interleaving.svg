<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Spanner: key ranges become splits, interleaving keeps children next to their parent</text>

  <!-- left: interleaved layout -->
  <rect x="20" y="44" width="430" height="400" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.6"/>
  <text x="38" y="68" font-size="13.5" font-weight="700" fill="#3c4a58">Interleaved tables: physical order of rows</text>
  <text x="38" y="86" font-size="11" fill="#3c4a58">Customers(CustomerId) with Orders(CustomerId, OrderId) INTERLEAVE IN PARENT</text>

  <rect x="38" y="100" width="394" height="30" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="50" y="120" font-size="12" font-weight="700" fill="#123a72">Customers  c-001</text>
  <rect x="62" y="134" width="370" height="26" rx="4" fill="#eaf6ee" stroke="#1e7e45"/>
  <text x="74" y="152" font-size="11.5" fill="#14572f">Orders  c-001 / o-1001</text>
  <rect x="62" y="164" width="370" height="26" rx="4" fill="#eaf6ee" stroke="#1e7e45"/>
  <text x="74" y="182" font-size="11.5" fill="#14572f">Orders  c-001 / o-1002</text>

  <rect x="38" y="204" width="394" height="30" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="50" y="224" font-size="12" font-weight="700" fill="#123a72">Customers  c-002</text>
  <rect x="62" y="238" width="370" height="26" rx="4" fill="#eaf6ee" stroke="#1e7e45"/>
  <text x="74" y="256" font-size="11.5" fill="#14572f">Orders  c-002 / o-1003</text>

  <rect x="38" y="278" width="394" height="30" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="50" y="298" font-size="12" font-weight="700" fill="#123a72">Customers  c-003</text>
  <rect x="62" y="312" width="370" height="26" rx="4" fill="#eaf6ee" stroke="#1e7e45"/>
  <text x="74" y="330" font-size="11.5" fill="#14572f">Orders  c-003 / o-1004</text>
  <rect x="62" y="342" width="370" height="26" rx="4" fill="#eaf6ee" stroke="#1e7e45"/>
  <text x="74" y="360" font-size="11.5" fill="#14572f">Orders  c-003 / o-1005</text>

  <text x="38" y="394" font-size="11" fill="#3c4a58">A customer and all of its orders sit in the same key range,</text>
  <text x="38" y="410" font-size="11" fill="#3c4a58">so a read of one customer with its orders touches one split.</text>
  <text x="38" y="430" font-size="11" fill="#7a4800">Without interleaving, Orders is a separate key space and the join crosses splits.</text>

  <!-- right: splits and servers -->
  <rect x="470" y="44" width="410" height="400" rx="10" fill="#fff8e6" stroke="#b06a00" stroke-width="1.6"/>
  <text x="488" y="68" font-size="13.5" font-weight="700" fill="#7a4800">Splits placed on compute (processing units)</text>

  <rect x="488" y="86" width="374" height="64" rx="6" fill="#ffffff" stroke="#b06a00"/>
  <text x="502" y="106" font-size="12" font-weight="700" fill="#7a4800">Split A: keys c-001 to c-1xx</text>
  <text x="502" y="124" font-size="11" fill="#3c4a58">Leader replica in zone a, replicas in zones b and c</text>
  <text x="502" y="140" font-size="11" fill="#3c4a58">Served by the compute behind the instance</text>

  <rect x="488" y="160" width="374" height="64" rx="6" fill="#ffffff" stroke="#b06a00"/>
  <text x="502" y="180" font-size="12" font-weight="700" fill="#7a4800">Split B: keys c-2xx to c-5xx</text>
  <text x="502" y="198" font-size="11" fill="#3c4a58">Leader replica in zone b</text>
  <text x="502" y="214" font-size="11" fill="#3c4a58">Splits move and divide automatically under load</text>

  <rect x="488" y="234" width="374" height="64" rx="6" fill="#ffffff" stroke="#b02a2a" stroke-width="1.6"/>
  <text x="502" y="254" font-size="12" font-weight="700" fill="#8a1c1c">Split C: the newest keys (hotspot)</text>
  <text x="502" y="272" font-size="11" fill="#3c4a58">A monotonically increasing key (timestamp, counter)</text>
  <text x="502" y="288" font-size="11" fill="#3c4a58">sends every insert to the last split</text>

  <rect x="488" y="316" width="374" height="112" rx="6" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="502" y="338" font-size="12" font-weight="700" fill="#123a72">Fixing the hotspot</text>
  <text x="502" y="358" font-size="11" fill="#3c4a58">Use a UUID v4 or a hash prefix as the key,</text>
  <text x="502" y="374" font-size="11" fill="#3c4a58">or a sequence with bit-reversed values,</text>
  <text x="502" y="390" font-size="11" fill="#3c4a58">or put the customer first and the timestamp second,</text>
  <text x="502" y="406" font-size="11" fill="#3c4a58">so writes spread over many splits.</text>
</svg>
