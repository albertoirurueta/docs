<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From constraints to areas: the shelf tui screen on an 80 x 24 terminal</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Layout::vertical splits the frame; the body is split again with Layout::horizontal</text>

  <defs>
    <marker id="rl-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Left: constraint code -->
  <rect x="20" y="70" width="270" height="350" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="155" y="94" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Constraints</text>
  <text x="34" y="124" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">let [header, body, footer] =</text>
  <text x="34" y="142" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">  Layout::vertical([</text>
  <text x="34" y="160" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1c4b73">    Length(3),</text>
  <text x="34" y="178" font-size="12" font-family="Menlo, Consolas, monospace" fill="#2d6a34">    Fill(1),</text>
  <text x="34" y="196" font-size="12" font-family="Menlo, Consolas, monospace" fill="#a33333">    Length(1),</text>
  <text x="34" y="214" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">  ]).areas(frame.area());</text>
  <text x="34" y="250" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">let [list, details] =</text>
  <text x="34" y="268" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">  Layout::horizontal([</text>
  <text x="34" y="286" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8a5a00">    Percentage(40),</text>
  <text x="34" y="304" font-size="12" font-family="Menlo, Consolas, monospace" fill="#2d6a34">    Fill(1),</text>
  <text x="34" y="322" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">  ]).areas(body);</text>
  <text x="34" y="356" font-size="12" fill="#333333">Fixed sizes are satisfied first;</text>
  <text x="34" y="374" font-size="12" fill="#333333">Fill shares what is left in</text>
  <text x="34" y="392" font-size="12" fill="#333333">proportion to its weight.</text>

  <line x1="294" y1="245" x2="338" y2="245" stroke="#1c4b73" stroke-width="2" marker-end="url(#rl-arrow)"/>

  <!-- Right: resulting rectangles -->
  <rect x="345" y="70" width="395" height="350" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="542" y="88" font-size="11" fill="#666666" text-anchor="middle">frame.area() = Rect { x: 0, y: 0, width: 80, height: 24 }</text>

  <rect x="355" y="98" width="375" height="64" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="542" y="124" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">header (Tabs)</text>
  <text x="542" y="144" font-size="12" fill="#333333" text-anchor="middle">Rect { 0, 0, 80, 3 }</text>

  <rect x="355" y="170" width="150" height="190" rx="3" fill="#fdf3e0" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="430" y="248" font-size="14" font-weight="bold" fill="#8a5a00" text-anchor="middle">list (List)</text>
  <text x="430" y="268" font-size="12" fill="#333333" text-anchor="middle">Rect { 0, 3, 32, 20 }</text>

  <rect x="513" y="170" width="217" height="190" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="621" y="248" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">details (Paragraph)</text>
  <text x="621" y="268" font-size="12" fill="#333333" text-anchor="middle">Rect { 32, 3, 48, 20 }</text>

  <rect x="355" y="368" width="375" height="44" rx="3" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="542" y="388" font-size="14" font-weight="bold" fill="#a33333" text-anchor="middle">footer (Paragraph)</text>
  <text x="542" y="404" font-size="12" fill="#333333" text-anchor="middle">Rect { 0, 23, 80, 1 }</text>

  <text x="380" y="445" font-size="12" fill="#666666" text-anchor="middle">Rows and columns are cells, not pixels; the sizes shown are in terminal cells.</text>
</svg>
