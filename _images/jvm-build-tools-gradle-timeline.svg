<text x="70.0" y="362" font-size="12" font-weight="bold" fill="#333333">Milestones</text>
<text x="70.0" y="384" font-size="12" font-weight="bold" fill="#222222">1.0  ·  2012-06</text>
<text x="70.0" y="397" font-size="11" fill="#555555">own dependency resolution engine, daemon, Tooling API</text>
<text x="70.0" y="414" font-size="12" font-weight="bold" fill="#222222">3.0  ·  2016-08</text>
<text x="70.0" y="427" font-size="11" fill="#555555">daemon on by default; first Kotlin DSL preview</text>
<text x="70.0" y="444" font-size="12" font-weight="bold" fill="#222222">4.0  ·  2017-06</text>
<text x="70.0" y="457" font-size="11" fill="#555555">build cache production-ready</text>
<text x="70.0" y="474" font-size="12" font-weight="bold" fill="#222222">5.0  ·  2018-11</text>
<text x="70.0" y="487" font-size="11" fill="#555555">Kotlin DSL 1.0, version alignment and BOMs; Java 8 to run</text>
<text x="70.0" y="504" font-size="12" font-weight="bold" fill="#222222">6.0  ·  2019-11</text>
<text x="70.0" y="517" font-size="11" fill="#555555">Gradle Module Metadata published by default</text>
<text x="70.0" y="534" font-size="12" font-weight="bold" fill="#222222">6.2  ·  2020-02</text>
<text x="70.0" y="547" font-size="11" fill="#555555">dependency verification, shared read-only cache</text>
<text x="505" y="384" font-size="12" font-weight="bold" fill="#222222">6.7  ·  2020-10</text>
<text x="505" y="397" font-size="11" fill="#555555">Java toolchains</text>
<text x="505" y="414" font-size="12" font-weight="bold" fill="#222222">7.0  ·  2021-04</text>
<text x="505" y="427" font-size="11" fill="#555555">file-system watching on; compile and the maven plugin removed</text>
<text x="505" y="444" font-size="12" font-weight="bold" fill="#222222">7.4  ·  2022-02</text>
<text x="505" y="457" font-size="11" fill="#555555">version catalogs and build services stable</text>
<text x="505" y="474" font-size="12" font-weight="bold" fill="#222222">8.1  ·  2023-04</text>
<text x="505" y="487" font-size="11" fill="#555555">configuration cache stable</text>
<text x="505" y="504" font-size="12" font-weight="bold" fill="#222222">9.0.0  ·  2025-07</text>
<text x="505" y="517" font-size="11" fill="#555555">JVM 17 to run, Kotlin 2, Groovy 4, SemVer</text>
