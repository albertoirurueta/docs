<svg viewBox="0 0 800 590" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="590" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Vert.x event loop and worker thread pool underneath Quarkus</text>
  <text x="400" y="45" font-size="11" fill="#666666" text-anchor="middle">solid arrows: request flow -- dashed arrows: dispatch to a different thread pool</text>

  <!-- incoming request -->
  <rect x="330" y="62" width="140" height="46" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="400" y="88" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Incoming HTTP</text>
  <text x="400" y="101" font-size="10" fill="#333333" text-anchor="middle">request</text>

  <!-- Event loop box -->
  <rect x="280" y="140" width="240" height="70" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="400" y="164" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Event Loop(s)</text>
  <text x="400" y="180" font-size="10" fill="#333333" text-anchor="middle">small fixed pool --</text>
  <text x="400" y="194" font-size="10" fill="#333333" text-anchor="middle">N = CPU cores</text>

  <line x1="400" y1="108" x2="400" y2="140" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- branch labels -->
  <text x="400" y="228" font-size="10" fill="#666666" text-anchor="middle">is this handler/method non-blocking?</text>

  <!-- Non-blocking branch: stays on event loop -->
  <line x1="330" y1="210" x2="150" y2="270" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="205" y="238" font-size="9.5" fill="#2d6a34" text-anchor="middle">yes: stays on</text>
  <text x="205" y="250" font-size="9.5" fill="#2d6a34" text-anchor="middle">the event loop</text>

  <rect x="30" y="270" width="240" height="90" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="150" y="293" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Non-blocking work</text>
  <text x="150" y="310" font-size="10" fill="#333333" text-anchor="middle">Quarkus REST / reactive routes</text>
  <text x="150" y="324" font-size="10" fill="#333333" text-anchor="middle">returning Uni / Multi;</text>
  <text x="150" y="338" font-size="10" fill="#333333" text-anchor="middle">a non-blocking @Route method</text>
  <text x="150" y="352" font-size="9.5" fill="#666666" text-anchor="middle">completes without leaving the loop</text>

  <!-- Blocking branch: dispatched to worker pool -->
  <line x1="470" y1="210" x2="650" y2="270" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="595" y="238" font-size="9.5" fill="#a33" text-anchor="middle">no: dispatched to</text>
  <text x="595" y="250" font-size="9.5" fill="#a33" text-anchor="middle">the worker pool</text>

  <rect x="530" y="270" width="240" height="90" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="650" y="293" font-size="11.5" font-weight="bold" fill="#a33" text-anchor="middle">Worker Thread Pool</text>
  <text x="650" y="310" font-size="10" fill="#333333" text-anchor="middle">plain-blocking Quarkus REST</text>
  <text x="650" y="324" font-size="10" fill="#333333" text-anchor="middle">resource method, or any</text>
  <text x="650" y="338" font-size="10" fill="#333333" text-anchor="middle">route/consumer marked @Blocking</text>
  <text x="650" y="352" font-size="9.5" fill="#666666" text-anchor="middle">sized for blocking I/O, not CPU count</text>

  <!-- Event bus shared box -->
  <rect x="290" y="400" width="220" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="400" y="425" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Vert.x EventBus</text>
  <text x="400" y="442" font-size="10" fill="#333333" text-anchor="middle">shared, in-JVM by default;</text>
  <text x="400" y="456" font-size="10" fill="#333333" text-anchor="middle">@ConsumeEvent consumers run on</text>
  <text x="400" y="470" font-size="10" fill="#333333" text-anchor="middle">the event loop, or on a worker if @Blocking</text>

  <line x1="150" y1="360" x2="330" y2="410" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <line x1="650" y1="360" x2="470" y2="410" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="175" y="395" font-size="9" fill="#666666" text-anchor="middle">publish / consume</text>
  <text x="630" y="395" font-size="9" fill="#666666" text-anchor="middle">publish / consume</text>

  <!-- bottom note -->
  <rect x="20" y="510" width="760" height="60" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="530" font-size="10.5" fill="#666666" text-anchor="middle">The event loop is a small, fixed-size pool -- never block it. Blocking work (JDBC, a synchronous</text>
  <text x="400" y="546" font-size="10.5" fill="#666666" text-anchor="middle">library call) must run on the worker thread pool instead, whether reached via a plain-blocking</text>
  <text x="400" y="562" font-size="10.5" fill="#666666" text-anchor="middle">resource method, @Blocking, or a @Blocking @ConsumeEvent consumer.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
