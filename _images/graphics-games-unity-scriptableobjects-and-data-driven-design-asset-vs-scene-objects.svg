<text x="195.0" y="356.9" text-anchor="middle" font-size="11" fill="#374151">Edit the title and you must visit every</text>
<text x="195.0" y="371.9" text-anchor="middle" font-size="11" fill="#374151">instance or prefab. Memory grows with</text>
<text x="195.0" y="386.9" text-anchor="middle" font-size="11" fill="#374151">the number of books. Easy to drift apart.</text>
<rect x="400" y="326" width="330" height="84" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="356.9" text-anchor="middle" font-size="11" fill="#374151">Edit the asset once and all references</text>
<text x="565.0" y="371.9" text-anchor="middle" font-size="11" fill="#374151">see it. One copy in memory. The asset can</text>
<text x="565.0" y="386.9" text-anchor="middle" font-size="11" fill="#374151">be reviewed, versioned and shared by designers.</text>
