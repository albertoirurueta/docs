<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 152" width="1080" height="152" role="img" aria-labelledby="monitoring-alerting-grafana-guide-g17-13-receiver-firing-title" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="monitoring-alerting-grafana-guide-g17-13-receiver-firing-title">Terminal showing the receiver filtered on the path /guide: a first line with the status firing and the title [FIRING] Guide high 5xx ratio, marked by callout 32, and a later line with the status resolved</title>
<g><rect x="0" y="0" width="1080" height="152" fill="#111217" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><text x="16" y="24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Terminal</text><g><rect x="16" y="64" width="1048" height="62" rx="6" fill="#111217" stroke="rgba(204,204,220,0.2)" stroke-width="1"/><text x="26" y="58" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">curl -s localhost:8081/ | jq -c '.[] | select(.path==&quot;/guide&quot;) | [.time, (.body|fromjson|.status, .title)]'</text><text x="28" y="86" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#CCCCDC">[&quot;10:16:00&quot;,&quot;firing&quot;,&quot;[FIRING] Guide high 5xx ratio&quot;]</text><text x="28" y="106" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#CCCCDC">[&quot;10:18:00&quot;,&quot;resolved&quot;,&quot;[RESOLVED] Guide high 5xx ratio&quot;]</text></g>
<rect x="19" y="69" width="446" height="26" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="465" cy="69" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="465" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">32</text></g></g>
</svg>
