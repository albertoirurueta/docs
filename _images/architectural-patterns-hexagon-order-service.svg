<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Order microservice: hexagon filled in with concrete classes</text>

  <defs>
    <marker id="hex2-arrow-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="hex2-arrow-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <!-- hexagon: Order domain + PlaceOrderService at the center -->
  <polygon points="390,105 498.25,167.5 498.25,292.5 390,355 281.75,292.5 281.75,167.5"
           fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="390" y="205" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Order</text>
  <text x="390" y="221" font-size="9.5" fill="#666666" text-anchor="middle">domain: Order, OrderLine, OrderStatus</text>
  <text x="390" y="242" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">PlaceOrderService</text>
  <text x="390" y="258" font-size="9.5" fill="#666666" text-anchor="middle">application: @Transactional use case</text>

  <!-- port labels -->
  <text x="281.75" y="230" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle"
        transform="rotate(-90 281.75 230)">Inbound Port</text>
  <text x="498.25" y="230" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle"
        transform="rotate(90 498.25 230)">Outbound Port</text>

  <!-- inbound adapters (left) -->
  <rect x="30" y="88" width="200" height="54" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="108" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">OrderController</text>
  <text x="130" y="124" font-size="9" fill="#666666" text-anchor="middle">REST inbound adapter</text>
  <text x="130" y="136" font-size="8.5" fill="#888888" text-anchor="middle">com.example.order.api</text>
  <line x1="230" y1="118" x2="278" y2="185" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#hex2-arrow-in)"/>

  <rect x="30" y="292" width="200" height="54" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="312" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PlaceOrderSagaCommandHandler</text>
  <text x="130" y="328" font-size="9" fill="#666666" text-anchor="middle">saga command inbound adapter</text>
  <text x="130" y="340" font-size="8.5" fill="#888888" text-anchor="middle">com.example.order.api</text>
  <line x1="230" y1="314" x2="278" y2="275" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#hex2-arrow-in)"/>

  <!-- outbound adapters (right) -->
  <rect x="550" y="88" width="200" height="54" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="650" y="108" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">OrderJpaRepositoryAdapter</text>
  <text x="650" y="124" font-size="9" fill="#666666" text-anchor="middle">implements OrderRepository</text>
  <text x="650" y="136" font-size="8.5" fill="#888888" text-anchor="middle">com.example.order.infrastructure</text>
  <line x1="502" y1="185" x2="548" y2="120" stroke="#2f5424" stroke-width="1.8" marker-end="url(#hex2-arrow-out)"/>

  <rect x="550" y="292" width="200" height="54" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="650" y="312" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">OutboxDomainEventPublisher</text>
  <text x="650" y="328" font-size="9" fill="#666666" text-anchor="middle">implements DomainEventPublisher</text>
  <text x="650" y="340" font-size="8.5" fill="#888888" text-anchor="middle">com.example.order.infrastructure</text>
  <line x1="502" y1="275" x2="548" y2="315" stroke="#2f5424" stroke-width="1.8" marker-end="url(#hex2-arrow-out)"/>

  <text x="390" y="404" font-size="10.5" fill="#444444" text-anchor="middle">Adapters implement the ports PlaceOrderService depends on; the domain and application layers never import</text>
  <text x="390" y="418" font-size="10.5" fill="#444444" text-anchor="middle">Spring Data, Spring Web, or a broker client type directly.</text>
</svg>
