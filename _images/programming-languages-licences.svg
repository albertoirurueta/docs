<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 294" width="800" height="294" role="img" aria-labelledby="licences-t licences-d">
<title id="licences-t">Licence of the reference implementation</title>
<desc id="licences-d">Number of the 35 compared languages per licence recorded in the licence column of languages.csv (GitHub repository metadata and project pages, retrieved 2026-10-26). 16 languages have an open-source licence recorded and 19 have none recorded (n/a). No closed-source licence appears in the data, so the chart does not claim that any language is closed source: languages without a single reference implementation (C, C++, COBOL, Assembly, SQL) or whose repository reports no standard licence are unclassified.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="294" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">Licence of the reference implementation</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Languages</text></g></g><line class="grid" x1="225" y1="78" x2="225" y2="234"/><text class="muted" x="225" y="252" text-anchor="middle">0</text><line class="grid" x1="354.75" y1="78" x2="354.75" y2="234"/><text class="muted" x="354.75" y="252" text-anchor="middle">5</text><line class="grid" x1="484.5" y1="78" x2="484.5" y2="234"/><text class="muted" x="484.5" y="252" text-anchor="middle">10</text><line class="grid" x1="614.25" y1="78" x2="614.25" y2="234"/><text class="muted" x="614.25" y="252" text-anchor="middle">15</text><line class="grid" x1="744" y1="78" x2="744" y2="234"/><text class="muted" x="744" y="252" text-anchor="middle">20</text><path class="axis" d="M225 78V234H744"/><text x="217" y="95" text-anchor="end">Apache-2.0</text><rect class="f0" x="225" y="82" width="155.7" height="18"/><text class="muted" x="385.7" y="95">6</text><text x="217" y="121" text-anchor="end">MIT</text><rect class="f0" x="225" y="108" width="103.8" height="18"/><text class="muted" x="333.8" y="121">4</text><text x="217" y="147" text-anchor="end">BSD-3-Clause</text><rect class="f0" x="225" y="134" width="77.85" height="18"/><text class="muted" x="307.85" y="147">3</text><text x="217" y="173" text-anchor="end">GPL-2.0</text><rect class="f0" x="225" y="160" width="51.9" height="18"/><text class="muted" x="281.9" y="173">2</text><text x="217" y="199" text-anchor="end">Ruby License / BSD-2-Clause</text><rect class="f0" x="225" y="186" width="25.95" height="18"/><text class="muted" x="255.95" y="199">1</text><text x="217" y="225" text-anchor="end">n/a (no licence recorded)</text><rect class="f0" x="225" y="212" width="493.05" height="18"/><text class="muted" x="723.05" y="225">19</text><text class="axis-label" x="484.5" y="274" text-anchor="middle">Languages (count)</text><text class="axis-label" transform="translate(16 156) rotate(-90)" text-anchor="middle">Licence</text>
