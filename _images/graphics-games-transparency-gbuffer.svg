<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="gb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A common G-buffer layout for the Bookshelf</text>
<text x="24" y="70" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">RT0  RGBA8 sRGB</text>
<rect x="24" y="78" width="114" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="81" y="99" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">albedo R</text>
<rect x="142" y="78" width="114" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="199" y="99" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">albedo G</text>
<rect x="260" y="78" width="114" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="317" y="99" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">albedo B</text>
<rect x="378" y="78" width="114" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="435" y="99" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">ambient occlusion</text>
<text x="24" y="144" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">RT1  RGB10A2 or RGBA8</text>
<rect x="24" y="152" width="114" height="34" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="81" y="173" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">normal x (octahedral)</text>
<rect x="142" y="152" width="114" height="34" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="199" y="173" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">normal y (octahedral)</text>
<rect x="260" y="152" width="114" height="34" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="317" y="173" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">roughness</text>
<rect x="378" y="152" width="114" height="34" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="435" y="173" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">metallic</text>
<text x="24" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">RT2  RGBA16F</text>
<rect x="24" y="226" width="114" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="81" y="247" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">emissive R</text>
<rect x="142" y="226" width="114" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="199" y="247" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">emissive G</text>
<rect x="260" y="226" width="114" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="317" y="247" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">emissive B</text>
<rect x="378" y="226" width="114" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="435" y="247" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">unused / flags</text>
<text x="24" y="284" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Depth/stencil  D32F or D24S8</text>
<rect x="24" y="292" width="474" height="34" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="261" y="313" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">view-space position is rebuilt from depth and the inverse projection</text>
<rect x="540" y="76" width="200" height="110" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="640" y="100" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Lighting pass</text>
<text x="640" y="122" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">full-screen triangle</text>
<text x="640" y="140" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">reads all targets + depth</text>
<text x="640" y="158" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">loops over lights</text>
<text x="640" y="174" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">writes HDR colour</text>
<line x1="500" y1="130" x2="538" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#gb)"/>
<rect x="540" y="206" width="200" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640" y="230" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Transparent objects</text>
<text x="640" y="248" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">drawn afterwards, forward</text>
<line x1="640" y1="188" x2="640" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#gb)"/>
<text x="380" y="368" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Geometry pass: every opaque object writes its material once. Lighting cost no longer depends on scene complexity,</text>
<text x="380" y="386" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">but memory bandwidth grows with the number of targets and hardware MSAA becomes costly.</text>
<text x="380" y="414" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Exact packing varies by engine; this is one illustrative layout.</text>
</svg>
