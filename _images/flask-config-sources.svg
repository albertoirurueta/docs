<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="currentColor">
  <defs><marker id="cfg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" text-anchor="middle">Where Flask configuration comes from, and who reads it</text>
  <text x="360" y="44" font-size="12" opacity="0.7" text-anchor="middle">sources are applied top to bottom; a later source overrides an earlier one</text>
  <text x="40" y="76" font-size="12" font-weight="bold" opacity="0.8">SOURCES</text>
  <text x="300" y="76" font-size="12" font-weight="bold" opacity="0.8">app.config</text>
  <text x="545" y="76" font-size="12" font-weight="bold" opacity="0.8">READERS</text>
  <rect x="30" y="90" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="107" font-size="12.5" font-weight="bold">1. Flask defaults</text>
  <text x="42" y="122" font-size="11" opacity="0.75" font-family="'Courier New', monospace">Flask.default_config</text>
  <line x1="230" y1="110" x2="290" y2="155.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="30" y="140" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="157" font-size="12.5" font-weight="bold">2. config.py classes</text>
  <text x="42" y="172" font-size="11" opacity="0.75" font-family="'Courier New', monospace">from_object()</text>
  <line x1="230" y1="160" x2="290" y2="169.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="30" y="190" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="207" font-size="12.5" font-weight="bold">3. instance folder files</text>
  <text x="42" y="222" font-size="11" opacity="0.75" font-family="'Courier New', monospace">from_pyfile() / from_file()</text>
  <line x1="230" y1="210" x2="290" y2="183.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="30" y="240" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="257" font-size="12.5" font-weight="bold">4. settings file via env var</text>
  <text x="42" y="272" font-size="11" opacity="0.75" font-family="'Courier New', monospace">from_envvar()</text>
  <line x1="230" y1="260" x2="290" y2="197.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="30" y="290" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="307" font-size="12.5" font-weight="bold">5. BOOKSHELF_* env vars</text>
  <text x="42" y="322" font-size="11" opacity="0.75" font-family="'Courier New', monospace">from_prefixed_env()</text>
  <line x1="230" y1="310" x2="290" y2="211.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="30" y="340" width="200" height="40" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="42" y="357" font-size="12.5" font-weight="bold">6. test overrides</text>
  <text x="42" y="372" font-size="11" opacity="0.75" font-family="'Courier New', monospace">from_mapping() / test_config</text>
  <line x1="230" y1="360" x2="290" y2="225.0" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="292" y="120" width="140" height="170" rx="8" fill="#3b82c4" fill-opacity="0.16" stroke="#3b82c4" stroke-width="2"/>
  <text x="362" y="146" font-size="13" font-weight="bold" text-anchor="middle">Config</text>
  <text x="362" y="163" font-size="11" opacity="0.8" text-anchor="middle">a dict subclass</text>
  <text x="362" y="190" font-size="10.5" text-anchor="middle" font-family="'Courier New', monospace">"SECRET_KEY": ...</text>
  <text x="362" y="206" font-size="10.5" text-anchor="middle" font-family="'Courier New', monospace">"PAGE_SIZE": 20</text>
  <text x="362" y="222" font-size="10.5" text-anchor="middle" font-family="'Courier New', monospace">"DATABASE_URI": ...</text>
  <text x="362" y="238" font-size="10.5" text-anchor="middle" font-family="'Courier New', monospace">"MYAPI": {...}</text>
  <text x="362" y="272" font-size="10.5" opacity="0.75" text-anchor="middle">UPPERCASE keys only</text>
  <line x1="432" y1="205" x2="500" y2="134" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="502" y="110" width="190" height="50" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="514" y="130" font-size="12.5" font-weight="bold">Flask itself</text>
  <text x="514" y="148" font-size="10.5" opacity="0.75">sessions, routing, limits, cookies</text>
  <line x1="432" y1="205" x2="500" y2="200" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="502" y="176" width="190" height="50" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="514" y="196" font-size="12.5" font-weight="bold">Extensions</text>
  <text x="514" y="214" font-size="10.5" opacity="0.75">init_app(app) reads keys</text>
  <line x1="432" y1="205" x2="500" y2="266" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#cfg-arrow)"/>
  <rect x="502" y="242" width="190" height="50" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
  <text x="514" y="262" font-size="12.5" font-weight="bold">Your code</text>
  <text x="514" y="280" font-size="10.5" opacity="0.75">current_app.config[...]</text>
  <text x="360" y="412" font-size="11.5" opacity="0.75" text-anchor="middle">load everything in create_app() before extensions call init_app(); read it through current_app, never at import time</text>
</svg>
