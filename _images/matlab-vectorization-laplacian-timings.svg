  <text x="808.0" y="222.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a">0.00516</text>
  <text x="760.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">n = 400</text>
  <rect x="90" y="430" width="14" height="14" fill="#d97706"/>
  <text x="110" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">loop</text>
  <rect x="320" y="430" width="14" height="14" fill="#2563eb"/>
  <text x="340" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">indexing</text>
  <rect x="550" y="430" width="14" height="14" fill="#0d9488"/>
  <text x="570" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">implicit expansion (matrix form)</text>
  <text x="450.0" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Bar height is the logarithm of the time; one tick is a factor of ten.</text>
