<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="vp-t vp-d">
  <title id="vp-t">Relative cost of three Laplacian versions</title>
  <desc id="vp-d">Grouped bars on a logarithmic time axis for grid sizes 50, 100, 200 and 400. In every group the loop version is far taller than the implicit expansion version, which is taller than the indexing version. The values are timings captured in GNU Octave 11.3.0 and are an illustration, not MATLAB measurements.</desc>
  <rect x="0" y="0" width="900" height="480" rx="12" fill="#f8fafc"/>
  <text x="450.0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Median time of one Laplacian evaluation, n-by-n grid (log scale)</text>
  <text x="450.0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Illustration drawn from timings captured in GNU Octave 11.3.0 (emulated amd64); not MATLAB timings</text>
  <line x1="90" y1="390.0" x2="860" y2="390.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="394.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">0.00001 s</text>
  <line x1="90" y1="330.0" x2="860" y2="330.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="334.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">0.0001 s</text>
  <line x1="90" y1="270.0" x2="860" y2="270.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="274.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">0.001 s</text>
  <line x1="90" y1="210.0" x2="860" y2="210.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="214.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">0.01 s</text>
  <line x1="90" y1="150.0" x2="860" y2="150.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="154.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">0.1 s</text>
  <line x1="90" y1="90.0" x2="860" y2="90.0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="94.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">1 s</text>
  <rect x="120" y="210.2" width="44" height="179.8" fill="#d97706"/>
  <text x="142.0" y="205.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a">0.00991</text>
  <rect x="168" y="361.4" width="44" height="28.6" fill="#2563eb"/>
  <text x="190.0" y="356.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a">0.00003</text>
  <rect x="216" y="339.3" width="44" height="50.7" fill="#0d9488"/>
