<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs>
<marker id="sv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
</defs>
<text x="480" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where the starter's servlet filter runs: default order versus after Spring Security</text>
<text x="480" y="46" font-size="12" fill="#444444" text-anchor="middle">Servlet filters run in ascending order value: the lower the number, the earlier the filter runs.</text>
<rect x="12" y="58" width="936" height="222" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
<text x="28" y="82" font-size="14" font-weight="bold" fill="#b3261e">A. Default: filter-order = HIGHEST_PRECEDENCE + 10, which runs before Spring Security</text>
<rect x="28" y="100" width="100" height="64" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="2"/>
<text x="78.0" y="124" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">request</text>
<text x="78.0" y="143" font-size="11" fill="#444444" text-anchor="middle">HTTP Basic</text>
<text x="78.0" y="159" font-size="11" fill="#444444" text-anchor="middle">or a token</text>
<line x1="128" y1="132" x2="168" y2="132" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="168" y="100" width="210" height="64" rx="8" fill="#fdf3ea" stroke="#b34700" stroke-width="2"/>
<text x="273.0" y="124" font-size="13" font-weight="bold" fill="#b34700" text-anchor="middle">Bucket4j starter filter</text>
<text x="273.0" y="143" font-size="11" fill="#444444" text-anchor="middle">order -2147483638</text>
<text x="273.0" y="159" font-size="11" fill="#444444" text-anchor="middle">HIGHEST_PRECEDENCE + 10</text>
<line x1="378" y1="132" x2="418" y2="132" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="418" y="100" width="210" height="64" rx="8" fill="#eef7f0" stroke="#2a7d3f" stroke-width="2"/>
<text x="523.0" y="124" font-size="13" font-weight="bold" fill="#2a7d3f" text-anchor="middle">Spring Security chain</text>
<text x="523.0" y="143" font-size="11" fill="#444444" text-anchor="middle">order -100</text>
<text x="523.0" y="159" font-size="11" fill="#444444" text-anchor="middle">spring.security.filter.order</text>
<line x1="628" y1="132" x2="668" y2="132" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="668" y="100" width="270" height="64" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="2"/>
<text x="803.0" y="124" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">DispatcherServlet and controller</text>
<text x="803.0" y="143" font-size="11" fill="#444444" text-anchor="middle">handler method, @RateLimiting aspect</text>
<text x="273" y="188" font-size="11" fill="#b3261e" text-anchor="middle">SecurityContext is still empty here</text>
<text x="273" y="204" font-size="11" fill="#b3261e" text-anchor="middle">a principal-based cache-key falls</text>
<text x="273" y="220" font-size="11" fill="#b3261e" text-anchor="middle">back to the client IP</text>
<text x="523" y="188" font-size="11" fill="#444444" text-anchor="middle">authentication happens only now,</text>
<text x="523" y="204" font-size="11" fill="#444444" text-anchor="middle">after the bucket key was chosen</text>
<text x="803" y="188" font-size="11" fill="#444444" text-anchor="middle">reached only if a token was available</text>
<text x="28" y="262" font-size="12" fill="#b3261e" font-weight="bold">Observed in the scratch app:</text>
<text x="205" y="262" font-size="12" fill="#444444">two users sharing the IP key: after ana spent the 2 requests of the minute, the first request of ben got 429.</text>
<rect x="12" y="296" width="936" height="212" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
<text x="28" y="320" font-size="14" font-weight="bold" fill="#2a7d3f">B. filter-order: 0 (any value greater than -100), which runs after Spring Security</text>
<rect x="28" y="338" width="100" height="64" rx="8" fill="#f7f7f7" stroke="#666666" stroke-width="2"/>
<text x="78.0" y="362" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">request</text>
<text x="78.0" y="381" font-size="11" fill="#444444" text-anchor="middle">HTTP Basic</text>
<text x="78.0" y="397" font-size="11" fill="#444444" text-anchor="middle">or a token</text>
<line x1="128" y1="370" x2="168" y2="370" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="168" y="338" width="210" height="64" rx="8" fill="#eef7f0" stroke="#2a7d3f" stroke-width="2"/>
<text x="273.0" y="362" font-size="13" font-weight="bold" fill="#2a7d3f" text-anchor="middle">Spring Security chain</text>
<text x="273.0" y="381" font-size="11" fill="#444444" text-anchor="middle">order -100</text>
<text x="273.0" y="397" font-size="11" fill="#444444" text-anchor="middle">spring.security.filter.order</text>
<line x1="378" y1="370" x2="418" y2="370" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="418" y="338" width="210" height="64" rx="8" fill="#fdf3ea" stroke="#b34700" stroke-width="2"/>
<text x="523.0" y="362" font-size="13" font-weight="bold" fill="#b34700" text-anchor="middle">Bucket4j starter filter</text>
<text x="523.0" y="381" font-size="11" fill="#444444" text-anchor="middle">order 0</text>
<text x="523.0" y="397" font-size="11" fill="#444444" text-anchor="middle">filter-order: 0</text>
<line x1="628" y1="370" x2="668" y2="370" stroke="#1c4b73" stroke-width="2" marker-end="url(#sv-arrow)"/>
<rect x="668" y="338" width="270" height="64" rx="8" fill="#e9eef3" stroke="#1c4b73" stroke-width="2"/>
<text x="803.0" y="362" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">DispatcherServlet and controller</text>
<text x="803.0" y="381" font-size="11" fill="#444444" text-anchor="middle">handler method, @RateLimiting aspect</text>
<text x="273" y="426" font-size="11" fill="#2a7d3f" text-anchor="middle">authenticates, or answers 401</text>
<text x="273" y="442" font-size="11" fill="#2a7d3f" text-anchor="middle">before any token is consumed</text>
<text x="523" y="426" font-size="11" fill="#2a7d3f" text-anchor="middle">the principal is known: cache-key</text>
<text x="523" y="442" font-size="11" fill="#2a7d3f" text-anchor="middle">can use @principals.username()</text>
<text x="803" y="426" font-size="11" fill="#444444" text-anchor="middle">reached only if a token was available</text>
<text x="28" y="490" font-size="12" fill="#2a7d3f" font-weight="bold">Observed in the scratch app:</text>
<text x="205" y="490" font-size="12" fill="#444444">ana and ben each had their own bucket; an unauthenticated request got 401 from Spring Security.</text>
</svg>
