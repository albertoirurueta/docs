<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-u2d-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How the 2D Renderer lights a scene</text>
<rect x="20" y="50" width="220" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="74" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">1  Shadow textures</text>
<rect x="270" y="50" width="220" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="74" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">2  Light textures</text>
<rect x="520" y="50" width="220" height="120" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="74" text-anchor="middle" font-size="14" fill="#047857" font-weight="bold">3  Lit pass</text>
<text x="130.0" y="98" text-anchor="middle" font-size="11" fill="#374151">Shadow Caster 2D shapes</text>
<text x="130.0" y="113" text-anchor="middle" font-size="11" fill="#374151">are drawn into one or</text>
<text x="130.0" y="128" text-anchor="middle" font-size="11" fill="#374151">more shadow textures</text>
<text x="380.0" y="98" text-anchor="middle" font-size="11" fill="#374151">Each Light 2D is drawn</text>
<text x="380.0" y="113" text-anchor="middle" font-size="11" fill="#374151">into a light texture,</text>
<text x="380.0" y="128" text-anchor="middle" font-size="11" fill="#374151">one per blend style</text>
<text x="630.0" y="98" text-anchor="middle" font-size="11" fill="#374151">Sprite-Lit-Default samples</text>
<text x="630.0" y="113" text-anchor="middle" font-size="11" fill="#374151">the light textures when</text>
<text x="630.0" y="128" text-anchor="middle" font-size="11" fill="#374151">the sprite is drawn</text>
<line x1="240" y1="110" x2="270" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-u2d-light)"/>
<line x1="490" y1="110" x2="520" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-u2d-light)"/>
<text x="380" y="200" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">The four Light 2D types</text>
<rect x="30" y="212" width="164" height="92" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="112" y="234" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Spot</text>
<text x="112" y="252" text-anchor="middle" font-size="11" fill="#374151">point or cone</text>
<polygon points="112,274 86,296 138,296" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="208" y="212" width="164" height="92" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290" y="234" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Sprite</text>
<text x="290" y="252" text-anchor="middle" font-size="11" fill="#374151">shape of a sprite</text>
<rect x="268" y="272" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="386" y="212" width="164" height="92" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="468" y="234" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Freeform</text>
<text x="468" y="252" text-anchor="middle" font-size="11" fill="#374151">editable polygon</text>
<polygon points="444,294 452,272 474,278 492,270 490,294" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="564" y="212" width="164" height="92" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="646" y="234" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Global</text>
<text x="646" y="252" text-anchor="middle" font-size="11" fill="#374151">lights everything</text>
<circle cx="646" cy="284" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<line x1="622" y1="284" x2="629" y2="284" stroke="#B45309" stroke-width="1.2"/>
<line x1="663" y1="284" x2="670" y2="284" stroke="#B45309" stroke-width="1.2"/>
<rect x="30" y="322" width="700" height="66" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="344" text-anchor="middle" font-size="11" fill="#92400E">Cost grows with the number of distinct blend styles and with distinct sets of Target Sorting Layers.</text>
<text x="380" y="359" text-anchor="middle" font-size="11" fill="#92400E">Use one or two blend styles, keep lights on shared sorting layers, and use the Light Batching Debugger window to check.</text>
</svg>
