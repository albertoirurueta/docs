<svg viewBox="0 0 760 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="680" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where FieldTripLiveActivity appears</text>
  <text x="380" y="48" font-size="12.5" fill="#666666" text-anchor="middle">One ActivityConfiguration, many presentations: iPhone (rows 1 and 2) and paired devices (row 3)</text>

  <!-- ===================== Row 1 ===================== -->
  <!-- Cell 1: Lock Screen -->
  <rect x="20" y="66" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="136" y="88" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Lock Screen</text>
  <rect x="36" y="100" width="200" height="96" rx="14" fill="#e8f3ea" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="50" y="122" font-size="13" font-weight="bold" fill="#1d3f22">Coastal survey</text>
  <text x="222" y="122" font-size="12" fill="#1d3f22" text-anchor="end">0:42:10</text>
  <text x="50" y="142" font-size="12" fill="#333333">7 notes captured</text>
  <text x="50" y="160" font-size="12" fill="#333333">Last: Heron Point</text>
  <rect x="150" y="168" width="72" height="20" rx="10" fill="#2d6a34"/>
  <text x="186" y="182" font-size="12" fill="#ffffff" text-anchor="middle">End trip</text>
  <text x="136" y="220" font-size="12" fill="#1c4b73" text-anchor="middle">content closure</text>
  <text x="136" y="238" font-size="12" fill="#666666" text-anchor="middle">also a banner without a Dynamic Island</text>

  <!-- Cell 2: Compact -->
  <rect x="264" y="66" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="380" y="88" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Dynamic Island: compact</text>
  <rect x="290" y="128" width="180" height="36" rx="18" fill="#111111"/>
  <circle cx="312" cy="146" r="9" fill="#4caf50"/>
  <circle cx="380" cy="146" r="5" fill="#333333"/>
  <text x="456" y="151" font-size="13" fill="#ffffff" text-anchor="end">7 notes</text>
  <text x="312" y="186" font-size="12" fill="#1c4b73" text-anchor="middle">leading</text>
  <text x="440" y="186" font-size="12" fill="#1c4b73" text-anchor="middle">trailing</text>
  <text x="380" y="220" font-size="12" fill="#1c4b73" text-anchor="middle">compactLeading + compactTrailing</text>
  <text x="380" y="238" font-size="12" fill="#666666" text-anchor="middle">only one activity is running</text>

  <!-- Cell 3: Minimal -->
  <rect x="508" y="66" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="624" y="88" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Dynamic Island: minimal</text>
  <rect x="540" y="128" width="120" height="36" rx="18" fill="#111111"/>
  <circle cx="600" cy="146" r="5" fill="#333333"/>
  <circle cx="645" cy="146" r="11" fill="#4caf50"/>
  <text x="645" y="150" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">7</text>
  <circle cx="690" cy="146" r="18" fill="#111111"/>
  <circle cx="690" cy="146" r="10" fill="#8a5a1c"/>
  <text x="628" y="186" font-size="12" fill="#1c4b73" text-anchor="middle">attached</text>
  <text x="702" y="186" font-size="12" fill="#666666" text-anchor="middle">other app</text>
  <text x="624" y="220" font-size="12" fill="#1c4b73" text-anchor="middle">minimal</text>
  <text x="624" y="238" font-size="12" fill="#666666" text-anchor="middle">several activities; also in StandBy</text>

  <!-- ===================== Row 2 ===================== -->
  <!-- Cell 4: Expanded -->
  <rect x="20" y="264" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="136" y="286" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Dynamic Island: expanded</text>
  <rect x="34" y="296" width="204" height="110" rx="26" fill="#111111"/>
  <circle cx="136" cy="310" r="5" fill="#333333"/>
  <text x="54" y="334" font-size="12" fill="#a5d6a7">leading</text>
  <text x="54" y="350" font-size="13" fill="#ffffff">7 notes</text>
  <text x="136" y="334" font-size="12" fill="#a5d6a7" text-anchor="middle">center</text>
  <text x="136" y="350" font-size="12" fill="#ffffff" text-anchor="middle">Coastal</text>
  <text x="220" y="334" font-size="12" fill="#a5d6a7" text-anchor="end">trailing</text>
  <text x="220" y="350" font-size="13" fill="#ffffff" text-anchor="end">0:42</text>
  <text x="60" y="380" font-size="12" fill="#a5d6a7">bottom</text>
  <rect x="112" y="368" width="96" height="22" rx="11" fill="#2d6a34"/>
  <text x="160" y="383" font-size="12" fill="#ffffff" text-anchor="middle">End trip</text>
  <text x="136" y="424" font-size="12" fill="#1c4b73" text-anchor="middle">DynamicIslandExpandedRegion</text>
  <text x="136" y="440" font-size="12" fill="#666666" text-anchor="middle">touch and hold, or an alerting update</text>

  <!-- Cell 5: Landscape, limited width (27) -->
  <rect x="264" y="264" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="380" y="286" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Landscape (new in iOS 27)</text>
  <rect x="284" y="300" width="192" height="100" rx="18" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
  <rect x="292" y="324" width="34" height="52" rx="17" fill="#111111"/>
  <circle cx="309" cy="336" r="7" fill="#4caf50"/>
  <circle cx="309" cy="352" r="3.5" fill="#333333"/>
  <rect x="302" y="360" width="14" height="10" rx="2" fill="#ffffff"/>
  <line x1="332" y1="350" x2="370" y2="350" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="376" y="340" font-size="12" fill="#333333">no room to</text>
  <text x="376" y="355" font-size="12" fill="#333333">grow in width:</text>
  <text x="376" y="370" font-size="12" fill="#333333">icon, not text</text>
  <text x="380" y="424" font-size="12" fill="#1c4b73" text-anchor="middle">isDynamicIslandLimitedInWidth</text>
  <text x="380" y="440" font-size="12" fill="#666666" text-anchor="middle">compact and minimal views only</text>

  <!-- Cell 6: StandBy -->
  <rect x="508" y="264" width="232" height="186" rx="10" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.2"/>
  <text x="624" y="286" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">StandBy</text>
  <rect x="528" y="300" width="192" height="100" rx="18" fill="#111111"/>
  <rect x="538" y="310" width="172" height="80" rx="10" fill="#2d6a34"/>
  <text x="552" y="338" font-size="15" font-weight="bold" fill="#ffffff">Coastal survey</text>
  <text x="552" y="362" font-size="14" fill="#e8f3ea">7 notes, 0:42:10</text>
  <text x="624" y="424" font-size="12" fill="#1c4b73" text-anchor="middle">Lock Screen view at about 2x</text>
  <text x="624" y="440" font-size="12" fill="#666666" text-anchor="middle">edge-to-edge activityBackgroundTint</text>

  <!-- ===================== Row 3: paired devices ===================== -->
  <text x="380" y="478" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Paired devices: forwarded from iPhone, no separate app needed</text>

  <!-- Cell 7: Apple Watch -->
  <rect x="20" y="490" width="232" height="176" rx="10" fill="#fdf8ef" stroke="#d9c7a3" stroke-width="1.2"/>
  <text x="136" y="512" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Apple Watch Smart Stack</text>
  <rect x="86" y="522" width="100" height="100" rx="24" fill="#111111"/>
  <rect x="94" y="548" width="84" height="48" rx="10" fill="#2d6a34"/>
  <text x="136" y="568" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Coastal</text>
  <text x="136" y="586" font-size="12" fill="#e8f3ea" text-anchor="middle">7 notes</text>
  <text x="136" y="642" font-size="12" fill="#1c4b73" text-anchor="middle">activityFamily == .small</text>
  <text x="136" y="658" font-size="12" fill="#666666" text-anchor="middle">supplementalActivityFamilies</text>

  <!-- Cell 8: CarPlay -->
  <rect x="264" y="490" width="232" height="176" rx="10" fill="#fdf8ef" stroke="#d9c7a3" stroke-width="1.2"/>
  <text x="380" y="512" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">CarPlay Dashboard</text>
  <rect x="280" y="522" width="200" height="100" rx="8" fill="#1e1e1e"/>
  <rect x="290" y="532" width="96" height="80" rx="8" fill="#2d6a34"/>
  <text x="338" y="562" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Coastal</text>
  <text x="338" y="580" font-size="12" fill="#e8f3ea" text-anchor="middle">7 notes</text>
  <rect x="394" y="532" width="76" height="80" rx="8" fill="#3a3a3a"/>
  <text x="432" y="576" font-size="12" fill="#bbbbbb" text-anchor="middle">Maps</text>
  <text x="380" y="642" font-size="12" fill="#1c4b73" text-anchor="middle">default: compact leading + trailing</text>
  <text x="380" y="658" font-size="12" fill="#666666" text-anchor="middle">with .small: the small content view</text>

  <!-- Cell 9: Mac menu bar -->
  <rect x="508" y="490" width="232" height="176" rx="10" fill="#fdf8ef" stroke="#d9c7a3" stroke-width="1.2"/>
  <text x="624" y="512" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Mac menu bar</text>
  <rect x="524" y="522" width="200" height="22" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/>
  <circle cx="626" cy="533" r="6" fill="#4caf50"/>
  <text x="638" y="538" font-size="12" fill="#222222">7 notes</text>
  <text x="704" y="538" font-size="12" fill="#555555" text-anchor="middle">9:41</text>
  <rect x="566" y="550" width="150" height="70" rx="10" fill="#e8f3ea" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="578" y="572" font-size="12" font-weight="bold" fill="#1d3f22">Coastal survey</text>
  <text x="578" y="590" font-size="12" fill="#333333">7 notes captured</text>
  <text x="578" y="608" font-size="12" fill="#333333">Last: Heron Point</text>
  <text x="624" y="642" font-size="12" fill="#1c4b73" text-anchor="middle">compact views in the menu bar</text>
  <text x="624" y="658" font-size="12" fill="#666666" text-anchor="middle">click: the Lock Screen view</text>
</svg>
