<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-animation-system-crossfade-weights" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Cross-fading two actions over 0.5 s</text>
<line x1="90" y1="70" x2="90" y2="260" stroke="#4B5563" stroke-width="1.5"/>
<line x1="90" y1="260" x2="700" y2="260" stroke="#4B5563" stroke-width="1.5"/>
<text x="60" y="74" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1.0</text>
<text x="60" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">0.0</text>
<text x="60" y="165" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">weight</text>
<text x="700" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">time</text>
<polyline points="90,70 250,70 450,260 680,260" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
<polyline points="90,260 250,260 450,70 680,70" fill="none" stroke="#B45309" stroke-width="2.5"/>
<line x1="250" y1="58" x2="250" y2="266" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="450" y1="58" x2="450" y2="266" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,4"/>
<text x="250" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">crossFadeTo called</text>
<text x="450" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fade ends</text>
<text x="350" y="62" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">duration = 0.5</text>
<text x="150" y="64" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">idle weight 1</text>
<text x="580" y="64" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">pull-out weight 1</text>
<text x="380" y="305" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">idle.crossFadeTo( pull, 0.5, false ); pull.play();</text>
<text x="380" y="325" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Both weights always sum to 1 during the fade; the mixer blends the poses.</text>
</svg>
