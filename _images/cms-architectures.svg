<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Traditional, headless and hybrid CMS architectures</title>
  <desc id="d">Three CMS architectures side by side. A traditional CMS keeps the editing interface, the content repository and the templates in one application that returns HTML pages. A headless CMS keeps the editing interface and the repository and exposes content through an API to separate front ends such as a web app, a mobile app and other channels. A hybrid CMS renders its own HTML pages and also exposes the same content through an API.</desc>
  <rect width="900" height="470" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>

  <!-- Column titles -->
  <text x="150" y="32" font-size="15" font-weight="bold" fill="#f9fafb" text-anchor="middle">Traditional (coupled)</text>
  <text x="450" y="32" font-size="15" font-weight="bold" fill="#f9fafb" text-anchor="middle">Headless (decoupled)</text>
  <text x="750" y="32" font-size="15" font-weight="bold" fill="#f9fafb" text-anchor="middle">Hybrid</text>

  <!-- Editors row -->
  <rect x="80" y="48" width="140" height="34" rx="17" fill="#374151" stroke="#9ca3af"/>
  <text x="150" y="70" font-size="12" fill="#e5e7eb" text-anchor="middle">Editors and authors</text>
  <rect x="380" y="48" width="140" height="34" rx="17" fill="#374151" stroke="#9ca3af"/>
  <text x="450" y="70" font-size="12" fill="#e5e7eb" text-anchor="middle">Editors and authors</text>
  <rect x="680" y="48" width="140" height="34" rx="17" fill="#374151" stroke="#9ca3af"/>
  <text x="750" y="70" font-size="12" fill="#e5e7eb" text-anchor="middle">Editors and authors</text>

  <path d="M150,82 V104" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,82 V104" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M750,82 V104" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Traditional: one application -->
  <rect x="30" y="106" width="240" height="246" rx="10" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="42" y="124" font-size="11" fill="#a7f3d0">one application, one deployment</text>
  <rect x="50" y="134" width="200" height="44" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="150" y="153" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Editing interface</text>
  <text x="150" y="170" font-size="11" fill="#d1fae5" text-anchor="middle">workflow, roles, media</text>
  <rect x="50" y="200" width="200" height="44" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="150" y="219" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Content repository</text>
  <text x="150" y="236" font-size="11" fill="#d1fae5" text-anchor="middle">database and files</text>
  <rect x="50" y="266" width="200" height="44" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="150" y="285" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Templates (theme)</text>
  <text x="150" y="302" font-size="11" fill="#d1fae5" text-anchor="middle">presentation layer</text>
  <path d="M150,178 V198" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M150,244 V264" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="162" y="328" font-size="11" fill="#a7f3d0">plugins extend</text>
  <text x="162" y="342" font-size="11" fill="#a7f3d0">every layer</text>
  <path d="M150,310 V384" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="158" y="372" font-size="11" fill="#d1d5db">HTML</text>
  <rect x="70" y="386" width="160" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="150" y="411" font-size="12" fill="#f9fafb" text-anchor="middle">Browser</text>

  <!-- Headless -->
  <rect x="330" y="106" width="240" height="180" rx="10" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="124" font-size="11" fill="#bfdbfe">the CMS: no presentation layer</text>
  <rect x="350" y="134" width="200" height="44" rx="8" fill="#1e40af" stroke="#60a5fa"/>
  <text x="450" y="153" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Editing interface</text>
  <text x="450" y="170" font-size="11" fill="#dbeafe" text-anchor="middle">workflow, roles, media</text>
  <rect x="350" y="200" width="200" height="44" rx="8" fill="#1e40af" stroke="#60a5fa"/>
  <text x="450" y="219" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Content repository</text>
  <text x="450" y="236" font-size="11" fill="#dbeafe" text-anchor="middle">database and files</text>
  <path d="M450,178 V198" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="370" y="254" width="160" height="26" rx="6" fill="#1e3a8a" stroke="#93c5fd"/>
  <text x="450" y="272" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">API (REST, GraphQL)</text>
  <path d="M450,244 V252" stroke="#e5e7eb" stroke-width="2" fill="none"/>
  <path d="M450,280 L380,382" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,280 V382" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,280 L520,382" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="498" y="330" font-size="11" fill="#d1d5db">JSON</text>
  <rect x="330" y="386" width="78" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="369" y="404" font-size="11" fill="#f9fafb" text-anchor="middle">Web app</text>
  <text x="369" y="418" font-size="10" fill="#d1d5db" text-anchor="middle">(own server)</text>
  <rect x="412" y="386" width="76" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="450" y="411" font-size="11" fill="#f9fafb" text-anchor="middle">Mobile app</text>
  <rect x="492" y="386" width="78" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="531" y="404" font-size="11" fill="#f9fafb" text-anchor="middle">Other</text>
  <text x="531" y="418" font-size="10" fill="#d1d5db" text-anchor="middle">channels</text>

  <!-- Hybrid -->
  <rect x="630" y="106" width="240" height="246" rx="10" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="642" y="124" font-size="11" fill="#ddd6fe">one application, two outputs</text>
  <rect x="650" y="134" width="200" height="44" rx="8" fill="#5b21b6" stroke="#a78bfa"/>
  <text x="750" y="153" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Editing interface</text>
  <text x="750" y="170" font-size="11" fill="#ede9fe" text-anchor="middle">workflow, roles, media</text>
  <rect x="650" y="200" width="200" height="44" rx="8" fill="#5b21b6" stroke="#a78bfa"/>
  <text x="750" y="219" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Content repository</text>
  <text x="750" y="236" font-size="11" fill="#ede9fe" text-anchor="middle">database and files</text>
  <path d="M750,178 V198" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="650" y="266" width="96" height="44" rx="8" fill="#5b21b6" stroke="#a78bfa"/>
  <text x="698" y="285" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Templates</text>
  <text x="698" y="302" font-size="10" fill="#ede9fe" text-anchor="middle">theme</text>
  <rect x="754" y="266" width="96" height="44" rx="8" fill="#4c1d95" stroke="#c4b5fd"/>
  <text x="802" y="285" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">API</text>
  <text x="802" y="302" font-size="10" fill="#ede9fe" text-anchor="middle">REST, GraphQL</text>
  <path d="M720,244 L705,264" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M780,244 L795,264" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="750" y="328" font-size="11" fill="#ddd6fe" text-anchor="middle">plugins extend</text>
  <text x="750" y="342" font-size="11" fill="#ddd6fe" text-anchor="middle">every layer</text>
  <path d="M698,310 V384" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M802,310 V384" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="706" y="372" font-size="11" fill="#d1d5db">HTML</text>
  <text x="810" y="372" font-size="11" fill="#d1d5db">JSON</text>
  <rect x="646" y="386" width="104" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="698" y="411" font-size="12" fill="#f9fafb" text-anchor="middle">Browser</text>
  <rect x="754" y="386" width="104" height="40" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="806" y="404" font-size="11" fill="#f9fafb" text-anchor="middle">Apps, widgets,</text>
  <text x="806" y="418" font-size="11" fill="#f9fafb" text-anchor="middle">other sites</text>

  <text x="450" y="456" font-size="11" fill="#9ca3af" text-anchor="middle">WordPress can run in all three ways: themes give the traditional model, the REST API the headless and hybrid ones.</text>
</svg>
