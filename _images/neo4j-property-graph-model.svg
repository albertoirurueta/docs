<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A property graph: two nodes and one directed, typed relationship</text>
  <text x="360" y="46" font-size="11.5" fill="#666666" text-anchor="middle">Storage direction is fixed at create time -- Cypher can still match the pattern in either written direction</text>

  <!-- Person node -->
  <circle cx="140" cy="150" r="56" fill="#dce8f5" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="140" y="144" font-size="16" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">:Person</text>
  <rect x="110" y="154" width="60" height="18" rx="9" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="140" y="167" font-size="10" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">:Actor</text>
  <text x="140" y="222" font-size="10" fill="#666666" text-anchor="middle">a node may carry several labels</text>

  <!-- Movie node -->
  <circle cx="580" cy="150" r="56" fill="#e0f0d8" stroke="#2f5424" stroke-width="1.6"/>
  <text x="580" y="156" font-size="16" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">:Movie</text>

  <!-- Relationship arrow -->
  <g stroke="#444444" stroke-width="1.8" fill="#444444">
    <line x1="197" y1="150" x2="518" y2="150"/>
    <polygon points="518,142 534,150 518,158"/>
  </g>
  <text x="365" y="128" font-size="14" font-weight="bold" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">:ACTED_IN</text>
  <text x="365" y="172" font-size="10" fill="#666666" text-anchor="middle">relationships are always directed and typed</text>

  <!-- Person properties box -->
  <rect x="30" y="248" width="210" height="112" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="42" y="266" font-size="11.5" font-weight="bold" fill="#222222">Node properties</text>
  <text x="42" y="283" font-size="11" fill="#333333" font-family="'Courier New', monospace">name: STRING</text>
  <text x="42" y="299" font-size="11" fill="#333333" font-family="'Courier New', monospace">born: DATE</text>
  <text x="42" y="315" font-size="11" fill="#333333" font-family="'Courier New', monospace">languages: LIST&lt;STRING&gt;</text>
  <text x="42" y="331" font-size="11" fill="#333333" font-family="'Courier New', monospace">homeBase: POINT</text>
  <line x1="140" y1="206" x2="140" y2="244" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Relationship properties box -->
  <rect x="260" y="248" width="200" height="112" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="272" y="266" font-size="11.5" font-weight="bold" fill="#222222">Relationship properties</text>
  <text x="272" y="283" font-size="11" fill="#333333" font-family="'Courier New', monospace">roles: LIST&lt;STRING&gt;</text>
  <text x="272" y="299" font-size="11" fill="#333333" font-family="'Courier New', monospace">since: DATE</text>
  <text x="272" y="315" font-size="11" fill="#333333" font-family="'Courier New', monospace">screenTime: DURATION</text>
  <line x1="360" y1="158" x2="360" y2="244" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Movie properties box -->
  <rect x="480" y="248" width="210" height="112" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="492" y="266" font-size="11.5" font-weight="bold" fill="#222222">Node properties</text>
  <text x="492" y="283" font-size="11" fill="#333333" font-family="'Courier New', monospace">title: STRING</text>
  <text x="492" y="299" font-size="11" fill="#333333" font-family="'Courier New', monospace">released: DATE</text>
  <text x="492" y="315" font-size="11" fill="#333333" font-family="'Courier New', monospace">runtime: DURATION</text>
  <text x="492" y="331" font-size="11" fill="#333333" font-family="'Courier New', monospace">tags: LIST&lt;STRING&gt;</text>
  <line x1="580" y1="206" x2="580" y2="244" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="360" y="392" font-size="11.5" fill="#444444" text-anchor="middle">(p:Person:Actor \{name: "Ada"\})-[:ACTED_IN \{roles: ["Lead"]\}]-&gt;(m:Movie \{title: "Loom"\})</text>
  <text x="360" y="412" font-size="10.5" fill="#666666" text-anchor="middle">Properties are typed key/value pairs; the schema is optional, not absent.</text>
</svg>
