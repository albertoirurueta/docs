<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>State survival across the three state-loss events</title>
  <desc>A grid figure with three columns labeled 'Configuration change', 'Process death (task kept)' and 'User dismissal (task removed)', and six rows labeled 'ViewModel in-memory field', 'SavedStateHandle / onSaveInstanceState / rememberSaveable', 'Automatic View state / saveable scroll state (needs android:id or a built-in Saver)', 'Plain remember (no rememberSaveable)', 'Navigation back stack', and 'Room / DataStore (persistent storage)'. Each cell is marked with a green checkmark for 'survives' or a red cross for 'lost'. The ViewModel row shows checkmark, cross, cross. The SavedStateHandle/onSaveInstanceState/rememberSaveable row shows checkmark, checkmark, cross. The automatic View state / saveable scroll state row shows checkmark, checkmark, cross. The plain remember row shows cross, cross, cross. The navigation back stack row shows checkmark, checkmark, cross. The Room/DataStore row shows checkmark, checkmark, checkmark -- the only row with three checkmarks, visually called out with a highlighted background band and the caption 'the only mechanism unaffected by all three events'. A small legend below the grid restates the checkmark and cross meanings for readers relying on shape/color-independent cues.</desc>

  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Layout constants -->
  <!-- Row label column: x=8..218 (width 210); columns start at x=224, each 186 wide, gap 6 -->

  <!-- Header row -->
  <text x="112" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">State kind</text>
  <text x="317" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Configuration</text>
  <text x="317" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">change</text>
  <text x="510" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Process death</text>
  <text x="510" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">(task kept)</text>
  <text x="703" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">User dismissal</text>
  <text x="703" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">(task removed)</text>

  <line x1="8" y1="50" x2="792" y2="50" stroke="#333333" stroke-width="1.5"/>

  <!-- Row geometry -->
  <!-- 6 rows, each 62 tall, starting at y=56 -->

  <!-- Row backgrounds (alternating) -->
  <rect x="8" y="56" width="784" height="62" fill="#f7f7f7"/>
  <rect x="8" y="118" width="784" height="62" fill="#ffffff"/>
  <rect x="8" y="180" width="784" height="62" fill="#f7f7f7"/>
  <rect x="8" y="242" width="784" height="62" fill="#ffffff"/>
  <rect x="8" y="304" width="784" height="62" fill="#f7f7f7"/>
  <!-- Highlighted final row -->
  <rect x="8" y="366" width="784" height="66" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>

  <!-- Row labels -->
  <text x="14" y="82" font-size="12.5" fill="#1a1a1a" font-weight="600">ViewModel</text>
  <text x="14" y="98" font-size="12.5" fill="#1a1a1a" font-weight="600">in-memory field</text>

  <text x="14" y="140" font-size="12.5" fill="#1a1a1a" font-weight="600">SavedStateHandle /</text>
  <text x="14" y="156" font-size="12.5" fill="#1a1a1a" font-weight="600">onSaveInstanceState /</text>
  <text x="14" y="172" font-size="12.5" fill="#1a1a1a" font-weight="600">rememberSaveable</text>

  <text x="14" y="202" font-size="12.5" fill="#1a1a1a" font-weight="600">Automatic View state /</text>
  <text x="14" y="218" font-size="12.5" fill="#1a1a1a" font-weight="600">saveable scroll state</text>
  <text x="14" y="234" font-size="11" fill="#444444">(needs android:id or a built-in Saver)</text>

  <text x="14" y="270" font-size="12.5" fill="#1a1a1a" font-weight="600">Plain remember</text>
  <text x="14" y="286" font-size="11" fill="#444444">(no rememberSaveable)</text>

  <text x="14" y="332" font-size="12.5" fill="#1a1a1a" font-weight="600">Navigation back stack</text>

  <text x="14" y="392" font-size="12.5" fill="#1a1a1a" font-weight="700">Room / DataStore</text>
  <text x="14" y="408" font-size="12.5" fill="#1a1a1a" font-weight="700">(persistent storage)</text>
  <text x="14" y="424" font-size="11" fill="#2e7d32" font-weight="600">the only mechanism unaffected by all three events</text>

  <!-- Divider lines between row label column and grid, and between columns -->
  <line x1="222" y1="50" x2="222" y2="432" stroke="#cccccc" stroke-width="1"/>
  <line x1="415" y1="50" x2="415" y2="432" stroke="#cccccc" stroke-width="1"/>
  <line x1="608" y1="50" x2="608" y2="432" stroke="#cccccc" stroke-width="1"/>

  <!-- Horizontal row separators -->
  <line x1="8" y1="118" x2="792" y2="118" stroke="#dddddd" stroke-width="1"/>
  <line x1="8" y1="180" x2="792" y2="180" stroke="#dddddd" stroke-width="1"/>
  <line x1="8" y1="242" x2="792" y2="242" stroke="#dddddd" stroke-width="1"/>
  <line x1="8" y1="304" x2="792" y2="304" stroke="#dddddd" stroke-width="1"/>
  <line x1="8" y1="366" x2="792" y2="366" stroke="#dddddd" stroke-width="1"/>

  <!-- Reusable marks via a template approach: draw checkmarks and crosses directly at each cell center -->
  <!-- Column centers: 317, 510, 703 -->
  <!-- Row centers: 87, 149, 211, 273, 335, 399 -->

  <!-- Helper groups -->
  <g id="marks">
    <!-- Row 1: ViewModel: check, cross, cross -->
    <g transform="translate(317,87)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(510,87)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(703,87)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Row 2: SavedStateHandle/onSaveInstanceState/rememberSaveable: check, check, cross -->
    <g transform="translate(317,149)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(510,149)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(703,149)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Row 3: Automatic View state / saveable scroll state: check, check, cross -->
    <g transform="translate(317,211)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(510,211)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(703,211)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Row 4: Plain remember: cross, cross, cross -->
    <g transform="translate(317,273)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(510,273)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(703,273)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Row 5: Navigation back stack: check, check, cross -->
    <g transform="translate(317,335)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(510,335)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(703,335)">
      <circle r="16" fill="#c62828"/>
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Row 6: Room / DataStore: check, check, check -->
    <g transform="translate(317,399)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(510,399)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(703,399)">
      <circle r="16" fill="#2e7d32"/>
      <path d="M -7,0 L -2,6 L 8,-7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Legend -->
  <line x1="8" y1="446" x2="792" y2="446" stroke="#cccccc" stroke-width="1"/>
  <g transform="translate(24,462)">
    <circle r="9" fill="#2e7d32"/>
    <path d="M -4,0 L -1,3.5 L 4.5,-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="42" y="467" font-size="13" fill="#1a1a1a">Survives this event</text>

  <g transform="translate(220,462)">
    <circle r="9" fill="#c62828"/>
    <path d="M -3.5,-3.5 L 3.5,3.5 M 3.5,-3.5 L -3.5,3.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <text x="238" y="467" font-size="13" fill="#1a1a1a">Lost on this event</text>
</svg>
