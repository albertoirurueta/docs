<svg viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A stream pipeline: lazy intermediate operations feeding one eager terminal operation</title>
  <rect x="0" y="0" width="860" height="260" fill="#ffffff"/>

  <text x="430" y="26" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">A stream pipeline: lazy intermediate ops, one eager terminal op</text>

  <!-- ============ source ============ -->
  <rect x="24" y="92" width="120" height="60" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="84" y="118" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">source</text>
  <text x="84" y="136" font-size="9.5" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">list.stream()</text>
  <text x="84" y="176" font-size="10" fill="#a23b3b" text-anchor="middle" font-style="italic">consumed once</text>

  <!-- ============ intermediate ops ============ -->
  <rect x="196" y="92" width="112" height="60" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="252" y="127" font-size="12" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">filter</text>

  <rect x="340" y="92" width="112" height="60" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="396" y="127" font-size="12" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">map</text>

  <rect x="484" y="92" width="112" height="60" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="540" y="127" font-size="12" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">sorted</text>

  <text x="396" y="196" font-size="10.5" fill="#4a6a8a" text-anchor="middle" font-style="italic">lazy &#8212; nothing runs yet</text>
  <path d="M 196 182 L 596 182" fill="none" stroke="#4a6a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 196 182 L 196 176 M 596 182 L 596 176" stroke="#4a6a8a" stroke-width="1"/>

  <!-- ============ terminal op ============ -->
  <rect x="640" y="86" width="196" height="72" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="738" y="116" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">collect / reduce</text>
  <text x="738" y="136" font-size="9.5" fill="#4a7a3a" text-anchor="middle" font-style="italic">eager &#8212; pulls elements through</text>

  <!-- ============ arrows ============ -->
  <line x1="144" y1="122" x2="190" y2="122" stroke="#555555" stroke-width="1.6"/>
  <polygon points="190,117 190,127 200,122" fill="#555555"/>
  <line x1="308" y1="122" x2="334" y2="122" stroke="#555555" stroke-width="1.6"/>
  <polygon points="334,117 334,127 344,122" fill="#555555"/>
  <line x1="452" y1="122" x2="478" y2="122" stroke="#555555" stroke-width="1.6"/>
  <polygon points="478,117 478,127 488,122" fill="#555555"/>
  <line x1="596" y1="122" x2="634" y2="122" stroke="#555555" stroke-width="1.6"/>
  <polygon points="634,117 634,127 644,122" fill="#555555"/>
</svg>
