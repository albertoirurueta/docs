<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: crates and modules</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">arrows point from a module to what it depends on; nothing in shelf-core knows about HTTP or SQL</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <!-- bookshelf-web crate -->
  <rect x="20" y="60" width="640" height="360" rx="8" fill="#fbfbfb" stroke="#b7410e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="82" font-size="14" font-weight="bold" fill="#b7410e">crate bookshelf-web (binary + lib)</text>
  <g font-size="12">
    <rect x="40" y="96" width="140" height="44" rx="5" fill="#fdf0e2" stroke="#b7410e"/>
    <text x="110" y="115" text-anchor="middle" font-weight="bold" fill="#222222">main.rs</text>
    <text x="110" y="131" text-anchor="middle" fill="#444444">config, tracing, serve</text>

    <rect x="260" y="96" width="140" height="44" rx="5" fill="#fdf0e2" stroke="#b7410e"/>
    <text x="330" y="115" text-anchor="middle" font-weight="bold" fill="#222222">app.rs</text>
    <text x="330" y="131" text-anchor="middle" fill="#444444">build Router + layers</text>

    <rect x="40" y="186" width="140" height="44" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="110" y="205" text-anchor="middle" font-weight="bold" fill="#222222">routes/</text>
    <text x="110" y="221" text-anchor="middle" fill="#444444">JSON API handlers</text>

    <rect x="200" y="186" width="140" height="44" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="270" y="205" text-anchor="middle" font-weight="bold" fill="#222222">web/</text>
    <text x="270" y="221" text-anchor="middle" fill="#444444">askama + htmx pages</text>

    <rect x="360" y="186" width="140" height="44" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="430" y="205" text-anchor="middle" font-weight="bold" fill="#222222">auth/</text>
    <text x="430" y="221" text-anchor="middle" fill="#444444">extractors, guards</text>

    <rect x="520" y="96" width="120" height="44" rx="5" fill="#f3e9f7" stroke="#6a3d9a"/>
    <text x="580" y="115" text-anchor="middle" font-weight="bold" fill="#222222">state.rs</text>
    <text x="580" y="131" text-anchor="middle" fill="#444444">AppState, FromRef</text>

    <rect x="520" y="186" width="120" height="44" rx="5" fill="#f3e9f7" stroke="#6a3d9a"/>
    <text x="580" y="205" text-anchor="middle" font-weight="bold" fill="#222222">error.rs</text>
    <text x="580" y="221" text-anchor="middle" fill="#444444">AppError</text>

    <rect x="120" y="276" width="220" height="44" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="230" y="295" text-anchor="middle" font-weight="bold" fill="#222222">services (use cases)</text>
    <text x="230" y="311" text-anchor="middle" fill="#444444">lend_book, add_review …</text>

    <rect x="120" y="356" width="220" height="44" rx="5" fill="#eeeeee" stroke="#444444"/>
    <text x="230" y="375" text-anchor="middle" font-weight="bold" fill="#222222">db/ (adapters)</text>
    <text x="230" y="391" text-anchor="middle" fill="#444444">PgBookRepo: sqlx queries</text>

    <rect x="380" y="276" width="200" height="44" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
    <text x="480" y="295" text-anchor="middle" font-weight="bold" fill="#222222">trait BookRepo (port)</text>
    <text x="480" y="311" text-anchor="middle" fill="#444444">Arc&lt;dyn BookRepo&gt; in state</text>
  </g>
  <!-- shelf-core crate -->
  <rect x="700" y="160" width="220" height="160" rx="8" fill="#fff4e5" stroke="#a35a00" stroke-width="1.5"/>
  <text x="810" y="184" font-size="14" font-weight="bold" fill="#a35a00" text-anchor="middle">crate shelf-core</text>
  <text x="716" y="210" font-size="12" fill="#222222">Isbn (validated newtype)</text>
  <text x="716" y="230" font-size="12" fill="#222222">Book, Author, Loan, LoanState</text>
  <text x="716" y="250" font-size="12" fill="#222222">trait Catalog, CatalogError</text>
  <text x="716" y="270" font-size="12" fill="#222222">no axum, no sqlx, no tokio</text>
  <text x="716" y="300" font-size="11" fill="#666666">also used by the shelf CLI</text>
  <!-- arrows -->
  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="180" y1="118" x2="258" y2="118"/>
    <line x1="400" y1="118" x2="518" y2="118"/>
    <line x1="300" y1="140" x2="130" y2="184"/>
    <line x1="320" y1="140" x2="275" y2="184"/>
    <line x1="350" y1="140" x2="420" y2="184"/>
    <line x1="110" y1="230" x2="190" y2="274"/>
    <line x1="270" y1="230" x2="250" y2="274"/>
    <line x1="500" y1="208" x2="518" y2="208"/>
    <line x1="340" y1="298" x2="378" y2="298"/>
    <line x1="270" y1="356" x2="420" y2="322"/>
    <line x1="580" y1="298" x2="698" y2="270"/>
    <line x1="640" y1="208" x2="698" y2="220"/>
  </g>
  <text x="372" y="350" font-size="11" fill="#444444">implements</text>
</svg>
