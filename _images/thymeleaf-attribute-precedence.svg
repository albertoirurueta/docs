<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Standard Dialect attribute precedence</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">on one tag, lower numbers run first; the order in the markup is irrelevant</text>
  <text x="40" y="76" font-size="11" font-weight="bold" fill="#444444">Order</text>
  <text x="100" y="76" font-size="11" font-weight="bold" fill="#444444">Feature</text>
  <text x="340" y="76" font-size="11" font-weight="bold" fill="#444444">Attributes</text>
  <text x="740" y="76" font-size="11" font-weight="bold" fill="#444444">PRECEDENCE</text>
  <rect x="30" y="86" width="800" height="40" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <circle cx="52" cy="106" r="13" fill="#1a4f8b"/>
  <text x="52" y="111" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="100" y="111" font-size="13" font-weight="bold" fill="#222222">Fragment inclusion</text>
  <text x="340" y="111" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:insert, th:replace</text>
  <text x="740" y="111" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1a4f8b">100</text>
  <rect x="30" y="132" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <circle cx="52" cy="152" r="13" fill="#1e6b34"/>
  <text x="52" y="157" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="100" y="157" font-size="13" font-weight="bold" fill="#222222">Fragment iteration</text>
  <text x="340" y="157" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:each</text>
  <text x="740" y="157" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1e6b34">200</text>
  <rect x="30" y="178" width="800" height="40" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <circle cx="52" cy="198" r="13" fill="#8a6a00"/>
  <text x="52" y="203" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="100" y="203" font-size="13" font-weight="bold" fill="#222222">Conditional evaluation</text>
  <text x="340" y="203" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:switch, th:case, th:if, th:unless</text>
  <text x="740" y="203" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8a6a00">250 - 400</text>
  <rect x="30" y="224" width="800" height="40" fill="#f3e5f5" stroke="#6a2c7a" stroke-width="1.4"/>
  <circle cx="52" cy="244" r="13" fill="#6a2c7a"/>
  <text x="52" y="249" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="100" y="249" font-size="13" font-weight="bold" fill="#222222">Local variable definition</text>
  <text x="340" y="249" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:object, th:with</text>
  <text x="740" y="249" font-size="12" font-family="Menlo, Consolas, monospace" fill="#6a2c7a">500 - 600</text>
  <rect x="30" y="270" width="800" height="40" fill="#fde8e0" stroke="#a3401a" stroke-width="1.4"/>
  <circle cx="52" cy="290" r="13" fill="#a3401a"/>
  <text x="52" y="295" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="100" y="295" font-size="13" font-weight="bold" fill="#222222">General attribute modification</text>
  <text x="340" y="295" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:attr, th:attrprepend, th:attrappend</text>
  <text x="740" y="295" font-size="12" font-family="Menlo, Consolas, monospace" fill="#a3401a">700 - 900</text>
  <rect x="30" y="316" width="800" height="40" fill="#e0f2f1" stroke="#00695c" stroke-width="1.4"/>
  <circle cx="52" cy="336" r="13" fill="#00695c"/>
  <text x="52" y="341" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="100" y="341" font-size="13" font-weight="bold" fill="#222222">Specific attribute modification</text>
  <text x="340" y="341" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:value, th:href, th:src, th:classappend ...</text>
  <text x="740" y="341" font-size="12" font-family="Menlo, Consolas, monospace" fill="#00695c">1000 - 1100</text>
  <rect x="30" y="362" width="800" height="40" fill="#eceff1" stroke="#37474f" stroke-width="1.4"/>
  <circle cx="52" cy="382" r="13" fill="#37474f"/>
  <text x="52" y="387" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="100" y="387" font-size="13" font-weight="bold" fill="#222222">Text (tag body modification)</text>
  <text x="340" y="387" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:text, th:utext</text>
  <text x="740" y="387" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474f">1300 - 1400</text>
  <rect x="30" y="408" width="800" height="40" fill="#e8eaf6" stroke="#283593" stroke-width="1.4"/>
  <circle cx="52" cy="428" r="13" fill="#283593"/>
  <text x="52" y="433" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="100" y="433" font-size="13" font-weight="bold" fill="#222222">Fragment specification</text>
  <text x="340" y="433" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:fragment (th:assert at 1550)</text>
  <text x="740" y="433" font-size="12" font-family="Menlo, Consolas, monospace" fill="#283593">1500</text>
  <rect x="30" y="454" width="800" height="40" fill="#fce4ec" stroke="#ad1457" stroke-width="1.4"/>
  <circle cx="52" cy="474" r="13" fill="#ad1457"/>
  <text x="52" y="479" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <text x="100" y="479" font-size="13" font-weight="bold" fill="#222222">Fragment removal</text>
  <text x="340" y="479" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">th:remove</text>
  <text x="740" y="479" font-size="12" font-family="Menlo, Consolas, monospace" fill="#ad1457">1600</text>
  <line x1="14" y1="90" x2="14" y2="490" stroke="#444444" stroke-width="1.6"/>
  <polygon points="14,498 8,486 20,486" fill="#444444"/>
</svg>
