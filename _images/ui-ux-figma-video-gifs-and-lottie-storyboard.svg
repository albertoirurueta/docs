<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs><rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Video controls storyboard: a book trailer on the Bookshelf detail screen</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="20" y="50" width="150" height="190" rx="10"/><rect x="196" y="50" width="150" height="190" rx="10"/><rect x="372" y="50" width="150" height="190" rx="10"/><rect x="548" y="50" width="172" height="190" rx="10"/></g>
<g fill="#E5E7EB"><rect x="35" y="70" width="120" height="70" rx="6"/><rect x="211" y="70" width="120" height="70" rx="6"/><rect x="387" y="70" width="120" height="70" rx="6"/><rect x="563" y="70" width="142" height="70" rx="6"/></g>
<g fill="#4F46E5"><circle cx="31" cy="62" r="11"/><circle cx="207" cy="62" r="11"/><circle cx="383" cy="62" r="11"/><circle cx="559" cy="62" r="11"/></g>
<g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="31" y="66">1</text><text x="207" y="66">2</text><text x="383" y="66">3</text><text x="559" y="66">4</text></g>
<path d="M85 90 L85 120 L110 105 z" fill="#4F46E5"/><path d="M261 90 L261 120 L286 105 z" fill="#4F46E5"/>
<g fill="#4B5563"><rect x="387" y="128" width="120" height="4" rx="2"/></g><rect x="387" y="128" width="120" height="4" rx="2" fill="#4F46E5"/>
<rect x="35" y="155" width="120" height="26" rx="13" fill="#EEF2FF" stroke="#4F46E5"/><text x="95" y="172" font-size="12" fill="#3730A3" text-anchor="middle">Play trailer</text>
<rect x="211" y="155" width="120" height="26" rx="13" fill="#FEF3C7" stroke="#B45309"/><text x="271" y="172" font-size="12" fill="#92400E" text-anchor="middle">Pause / mute</text>
<rect x="563" y="155" width="142" height="26" rx="13" fill="#D1FAE5" stroke="#047857"/><text x="634" y="172" font-size="12" fill="#047857" text-anchor="middle">Add to shelf</text>
<g font-size="12" fill="#374151" text-anchor="middle"><text x="95" y="205">Video fill on a</text><text x="95" y="221">rectangle</text><text x="271" y="205">On click, Play, Pause</text><text x="271" y="221">or Toggle play/pause</text><text x="447" y="205">Optional: Mute, Jump</text><text x="447" y="221">to time, skip seconds</text><text x="634" y="205">When video ends</text><text x="634" y="221">Navigate to next frame</text></g>
<g stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"><path d="M172 145 H194"/><path d="M348 145 H370"/><path d="M524 145 H546"/></g>
<text x="370" y="275" font-size="13" fill="#374151" text-anchor="middle">Prototype tab: set Autoplay, Loop and Sound on the video, then connect buttons to it.</text>
<text x="370" y="298" font-size="13" fill="#374151" text-anchor="middle">Turn Reset video state off to keep playback progress between frames.</text>
</svg>
