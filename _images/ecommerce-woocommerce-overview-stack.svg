<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
<title id="t">Where WooCommerce sits in a WordPress site</title>
<desc id="d">Layers from top to bottom. Shoppers, the admin and API clients call a web server running PHP. WordPress core provides routing, hooks, users, options, the REST API, blocks and plugin loading. The WooCommerce plugin adds products, carts, checkout, orders, the Store API, REST API v3, Action Scheduler and HPOS. Extensions, themes and WooPayments hook into WooCommerce. All data lives in one database, in WordPress tables and WooCommerce tables.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold">A WooCommerce store is a WordPress site with one more plugin</text>
<rect x="20" y="50" width="820" height="56" rx="8" fill="#7f8c8d" fill-opacity="0.14" stroke="#7f8c8d" stroke-width="1.5"></rect>
<text x="430" y="74" text-anchor="middle" font-size="14" font-weight="bold">Clients</text>
<text x="430" y="94" text-anchor="middle" font-size="12">shopper browser, wp-admin, headless storefront, mobile app, WP-CLI, webhooks and API consumers</text>
<rect x="20" y="126" width="820" height="66" rx="8" fill="#9b59b6" fill-opacity="0.14" stroke="#9b59b6" stroke-width="1.5"></rect>
<text x="430" y="150" text-anchor="middle" font-size="14" font-weight="bold">Extensions, themes and payments</text>
<text x="430" y="170" text-anchor="middle" font-size="12">block themes and Storefront, Woo Marketplace extensions, plugins from WordPress.org, WooPayments, your own plugin</text>
<text x="430" y="186" text-anchor="middle" font-size="12" opacity="0.85">(hooks, filters, blocks, Store API extensions)</text>
<rect x="20" y="212" width="820" height="120" rx="8" fill="#2ecc71" fill-opacity="0.14" stroke="#2ecc71" stroke-width="2"></rect>
<text x="430" y="236" text-anchor="middle" font-size="14" font-weight="bold">WooCommerce plugin (11.2.1)</text>
<rect x="50" y="252" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="170" y="270" text-anchor="middle" font-size="12">Product and order CRUD objects</text>
<rect x="312" y="252" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="432" y="270" text-anchor="middle" font-size="12">HPOS order tables</text>
<rect x="574" y="252" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="694" y="270" text-anchor="middle" font-size="12">Cart and Checkout blocks</text>
<rect x="50" y="286" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="170" y="304" text-anchor="middle" font-size="12">Store API and REST API v3</text>
<rect x="312" y="286" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="432" y="304" text-anchor="middle" font-size="12">Action Scheduler</text>
<rect x="574" y="286" width="240" height="26" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1"></rect>
<text x="694" y="304" text-anchor="middle" font-size="12">Emails, taxes, shipping, gateways</text>
<rect x="20" y="352" width="820" height="66" rx="8" fill="#3498db" fill-opacity="0.14" stroke="#3498db" stroke-width="1.5"></rect>
<text x="430" y="376" text-anchor="middle" font-size="14" font-weight="bold">WordPress core (7.1.3)</text>
<text x="430" y="396" text-anchor="middle" font-size="12">plugin loader, hooks, users and roles, options, REST API, block editor, Site Editor, Abilities API, WP-Cron</text>
<rect x="20" y="438" width="820" height="60" rx="8" fill="#e67e22" fill-opacity="0.14" stroke="#e67e22" stroke-width="1.5"></rect>
<text x="430" y="462" text-anchor="middle" font-size="14" font-weight="bold">PHP 7.4+ (8.3+ recommended), web server, MySQL or MariaDB</text>
<text x="430" y="482" text-anchor="middle" font-size="12">wp_posts and wp_postmeta, wp_options, users, plus wp_wc_orders and the other WooCommerce tables</text>
</svg>
