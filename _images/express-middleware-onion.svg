<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Express middleware pipeline</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">layers nest like an onion: application, router, route; four ways to leave a layer</text>

  <!-- request arrow -->
  <text x="22" y="190" font-size="10" fill="#444444" text-anchor="middle">request</text>
  <line x1="6" y1="200" x2="52" y2="200" stroke="#444444" stroke-width="1.6"/>
  <polygon points="58,200 50,195 50,205" fill="#444444"/>

  <!-- application layer -->
  <rect x="60" y="70" width="620" height="250" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="70" y="88" font-size="12" font-weight="bold" fill="#2f5424">Application stack: app.use() and app.METHOD() in registration order</text>

  <!-- logger -->
  <rect x="72" y="170" width="68" height="60" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
  <text x="106" y="196" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">logger</text>
  <text x="106" y="212" font-size="10" fill="#666666" text-anchor="middle">app.use</text>

  <!-- json -->
  <rect x="158" y="170" width="68" height="60" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
  <text x="192" y="196" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">json()</text>
  <text x="192" y="212" font-size="10" fill="#666666" text-anchor="middle">app.use</text>

  <!-- router layer -->
  <rect x="244" y="100" width="344" height="204" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="254" y="294" font-size="12" font-weight="bold" fill="#1c4b73">Router mounted at /books</text>

  <!-- auth -->
  <rect x="256" y="170" width="64" height="60" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="288" y="196" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">auth</text>
  <text x="288" y="212" font-size="10" fill="#666666" text-anchor="middle">router.use</text>

  <!-- route layer -->
  <rect x="338" y="122" width="240" height="150" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="348" y="262" font-size="12" font-weight="bold" fill="#7a4a00">Route GET /:id</text>

  <rect x="348" y="170" width="94" height="60" fill="#ffffff" stroke="#7a4a00" stroke-width="1.4"/>
  <text x="395" y="196" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">loadBook</text>
  <text x="395" y="212" font-size="10" fill="#666666" text-anchor="middle">handler 1</text>

  <rect x="468" y="170" width="100" height="60" fill="#ffffff" stroke="#7a4a00" stroke-width="1.4"/>
  <text x="518" y="196" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">res.json()</text>
  <text x="518" y="212" font-size="10" fill="#666666" text-anchor="middle">handler 2</text>

  <!-- 404 chip -->
  <rect x="604" y="170" width="68" height="60" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
  <text x="638" y="194" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">404</text>
  <text x="638" y="208" font-size="10" fill="#666666" text-anchor="middle">last</text>
  <text x="638" y="221" font-size="10" fill="#666666" text-anchor="middle">app.use</text>

  <!-- next() arrows -->
  <line x1="140" y1="200" x2="152" y2="200" stroke="#222222" stroke-width="1.6"/>
  <polygon points="158,200 150,195 150,205" fill="#222222"/>
  <line x1="226" y1="200" x2="250" y2="200" stroke="#222222" stroke-width="1.6"/>
  <polygon points="256,200 248,195 248,205" fill="#222222"/>
  <line x1="320" y1="200" x2="342" y2="200" stroke="#222222" stroke-width="1.6"/>
  <polygon points="348,200 340,195 340,205" fill="#222222"/>
  <line x1="442" y1="200" x2="462" y2="200" stroke="#222222" stroke-width="1.6"/>
  <polygon points="468,200 460,195 460,205" fill="#222222"/>
  <line x1="568" y1="200" x2="598" y2="200" stroke="#222222" stroke-width="1.6"/>
  <polygon points="604,200 596,195 596,205" fill="#222222"/>

  <!-- next('route') -->
  <polyline points="395,170 395,142 636,142 636,164" fill="none" stroke="#7a4a00" stroke-width="1.6" stroke-dasharray="6,3"/>
  <polygon points="636,170 631,162 641,162" fill="#7a4a00"/>
  <text x="400" y="136" font-size="11" font-weight="bold" fill="#7a4a00">next('route')</text>

  <!-- next('router') -->
  <polyline points="288,170 288,112 654,112 654,164" fill="none" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6,3"/>
  <polygon points="654,170 649,162 659,162" fill="#1c4b73"/>
  <text x="300" y="107" font-size="11" font-weight="bold" fill="#1c4b73">next('router')</text>

  <!-- next(err) -->
  <g stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="6,3" fill="none">
    <line x1="106" y1="230" x2="106" y2="342"/>
    <line x1="192" y1="230" x2="192" y2="342"/>
    <line x1="288" y1="230" x2="288" y2="342"/>
    <line x1="395" y1="230" x2="395" y2="342"/>
    <line x1="518" y1="230" x2="518" y2="342"/>
  </g>
  <g fill="#8a1f1f">
    <polygon points="106,350 101,342 111,342"/>
    <polygon points="192,350 187,342 197,342"/>
    <polygon points="288,350 283,342 293,342"/>
    <polygon points="395,350 390,342 400,342"/>
    <polygon points="518,350 513,342 523,342"/>
  </g>
  <text x="560" y="340" font-size="11" font-weight="bold" fill="#8a1f1f">next(err) or a rejected promise</text>

  <!-- error handlers -->
  <rect x="60" y="352" width="620" height="48" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="370" y="373" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Error-handling middleware</text>
  <text x="370" y="390" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">(err, req, res, next), registered after the routes</text>

  <line x1="370" y1="400" x2="370" y2="416" stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="6,3"/>
  <polygon points="370,424 365,416 375,416" fill="#8a1f1f"/>
  <rect x="60" y="424" width="620" height="32" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
  <text x="370" y="444" font-size="11" fill="#444444" text-anchor="middle">finalhandler: default 404 and 500 responses when no layer ends the request</text>

  <!-- legend -->
  <line x1="60" y1="478" x2="84" y2="478" stroke="#222222" stroke-width="1.6"/>
  <text x="90" y="482" font-size="11" fill="#444444">next(): next layer</text>
  <line x1="220" y1="478" x2="244" y2="478" stroke="#7a4a00" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="250" y="482" font-size="11" fill="#444444">skip rest of route</text>
  <line x1="380" y1="478" x2="404" y2="478" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="410" y="482" font-size="11" fill="#444444">leave router</text>
  <line x1="520" y1="478" x2="544" y2="478" stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="550" y="482" font-size="11" fill="#444444">skip to errors</text>
</svg>
