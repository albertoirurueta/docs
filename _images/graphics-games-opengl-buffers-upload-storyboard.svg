<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-buffers-upload-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Buffer lifecycle in five steps</text>
<rect x="30" y="50" width="220" height="160" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="46" cy="66" r="11" fill="#4F46E5"/>
<text x="46" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="140" y="80" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Create</text>
<rect x="90" y="105" width="100" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="126.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">name only</text>
<text x="140.0" y="140.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no storage</text>
<text x="140" y="198" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glCreateBuffers</text>
<rect x="270" y="50" width="220" height="160" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="286" cy="66" r="11" fill="#4F46E5"/>
<text x="286" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="380" y="80" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Allocate</text>
<rect x="310" y="105" width="140" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="127.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">64 KiB</text>
<text x="380.0" y="140.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">flags: DYNAMIC_STORAGE_BIT</text>
<text x="380" y="198" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glNamedBufferStorage</text>
<rect x="510" y="50" width="220" height="160" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="620.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="526" cy="66" r="11" fill="#4F46E5"/>
<text x="526" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="620" y="80" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Update</text>
<rect x="550" y="105" width="140" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="127.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">bytes 0..48 replaced</text>
<text x="620.0" y="140.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">from CPU memory</text>
<text x="620" y="198" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glNamedBufferSubData</text>
<rect x="30" y="235" width="220" height="160" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="319.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="46" cy="251" r="11" fill="#4F46E5"/>
<text x="46" y="255" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="140" y="265" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Bind to a VAO</text>
<rect x="50" y="290" width="80" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="90.0" y="313.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">buffer</text>
<rect x="150" y="290" width="80" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="313.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">VAO</text>
<line x1="130" y1="310" x2="150" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-buffers-upload-storyboard)"/>
<text x="140" y="383" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glVertexArrayVertexBuffer</text>
<rect x="270" y="235" width="220" height="160" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="319.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="286" cy="251" r="11" fill="#B45309"/>
<text x="286" y="255" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="380" y="265" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Draw, then delete</text>
<rect x="310" y="290" width="140" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="312.0" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">frees GPU memory</text>
<text x="380.0" y="325.0" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">when no longer used</text>
<text x="380" y="383" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glDrawElements, glDeleteBuffers</text>
</svg>
