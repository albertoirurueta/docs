<svg viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Places's Navigation Tree</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">A native-stack root nesting a bottom-tab navigator, with three sibling stack-only screens</text>

  <defs>
    <marker id="nt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Root stack navigator -->
  <rect x="220" y="66" width="340" height="54" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="390" y="88" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">RootNavigator</text>
  <text x="390" y="104" font-size="10" fill="#1c4b73" text-anchor="middle">createNativeStackNavigator&lt;RootStackParamList&gt;</text>

  <!-- connector down to a horizontal bus -->
  <line x1="390" y1="120" x2="390" y2="140" stroke="#333333" stroke-width="1.3"/>
  <line x1="140" y1="140" x2="640" y2="140" stroke="#333333" stroke-width="1.3"/>
  <line x1="140" y1="140" x2="140" y2="154" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>
  <line x1="390" y1="140" x2="390" y2="154" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>
  <line x1="512" y1="140" x2="512" y2="154" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>
  <line x1="634" y1="140" x2="634" y2="154" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>

  <!-- Tabs screen (nested bottom-tab navigator) -->
  <rect x="40" y="156" width="200" height="52" rx="9" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="140" y="176" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Tabs</text>
  <text x="140" y="192" font-size="9" fill="#2d6a34" text-anchor="middle">createBottomTabNavigator&lt;TabParamList&gt;</text>

  <!-- PlaceDetails -->
  <rect x="326" y="156" width="128" height="52" rx="9" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="390" y="176" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">PlaceDetails</text>
  <text x="390" y="192" font-size="9" fill="#8a5a1c" text-anchor="middle">{ placeId: PlaceId }</text>

  <!-- AddPlace -->
  <rect x="466" y="156" width="92" height="52" rx="9" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="512" y="176" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">AddPlace</text>
  <text x="512" y="192" font-size="9" fill="#8a5a1c" text-anchor="middle">undefined</text>

  <!-- SignIn -->
  <rect x="580" y="156" width="108" height="52" rx="9" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="634" y="176" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">SignIn</text>
  <text x="634" y="192" font-size="9" fill="#8a5a1c" text-anchor="middle">undefined</text>

  <text x="512" y="228" font-size="9.5" fill="#666666" text-anchor="middle">Sibling stack screens, pushed on top of the tabs (modal or default presentation)</text>

  <!-- connector from Tabs down to its three tab screens -->
  <line x1="140" y1="208" x2="140" y2="230" stroke="#333333" stroke-width="1.3"/>
  <line x1="40" y1="230" x2="240" y2="230" stroke="#333333" stroke-width="1.3"/>
  <line x1="40" y1="230" x2="40" y2="244" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>
  <line x1="140" y1="230" x2="140" y2="244" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>
  <line x1="240" y1="230" x2="240" y2="244" stroke="#333333" stroke-width="1.3" marker-end="url(#nt-arrow)"/>

  <!-- PlacesList tab screen -->
  <rect x="0" y="246" width="120" height="48" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="60" y="266" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">PlacesList</text>
  <text x="60" y="281" font-size="9" fill="#1c4b73" text-anchor="middle">undefined</text>

  <!-- Favourites tab screen -->
  <rect x="80" y="246" width="120" height="48" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="140" y="266" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Favourites</text>
  <text x="140" y="281" font-size="9" fill="#1c4b73" text-anchor="middle">undefined</text>

  <!-- Settings tab screen -->
  <rect x="180" y="246" width="120" height="48" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="240" y="266" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Settings</text>
  <text x="240" y="281" font-size="9" fill="#1c4b73" text-anchor="middle">undefined</text>

  <!-- annotation: tab bar note -->
  <rect x="40" y="322" width="260" height="66" rx="8" fill="#ffffff" stroke="#2d6a34" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="170" y="342" font-size="10" font-weight="bold" fill="#2d6a34" text-anchor="middle">Bottom tab bar</text>
  <text x="170" y="358" font-size="9.5" fill="#333333" text-anchor="middle">Always visible while any tab screen is</text>
  <text x="170" y="372" font-size="9.5" fill="#333333" text-anchor="middle">focused; hidden once a stack screen is pushed.</text>

  <!-- annotation: PlaceDetails deep link note -->
  <rect x="326" y="322" width="260" height="80" rx="8" fill="#ffffff" stroke="#8a5a1c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="456" y="342" font-size="10" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Reached three ways</text>
  <text x="456" y="358" font-size="9.5" fill="#333333" text-anchor="middle">navigate('PlaceDetails', &#123; placeId &#125;) from</text>
  <text x="456" y="372" font-size="9.5" fill="#333333" text-anchor="middle">PlacesListScreen, a deep link, or a push from</text>
  <text x="456" y="386" font-size="9.5" fill="#333333" text-anchor="middle">any other stack screen -- goBack() returns to Tabs.</text>

  <!-- Platform convention callouts -->
  <rect x="40" y="420" width="330" height="118" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="205" y="440" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">iOS conventions</text>
  <text x="205" y="458" font-size="9.5" fill="#333333" text-anchor="middle">Tab bar pinned to the bottom; stack header shows a</text>
  <text x="205" y="472" font-size="9.5" fill="#333333" text-anchor="middle">chevron-plus-title back button; AddPlace/SignIn</text>
  <text x="205" y="486" font-size="9.5" fill="#333333" text-anchor="middle">commonly present as a card modal with a swipe-down</text>
  <text x="205" y="500" font-size="9.5" fill="#333333" text-anchor="middle">gesture and an explicit Cancel/Done header button.</text>
  <text x="205" y="518" font-size="9.5" fill="#333333" text-anchor="middle">Edge-swipe from the left screen edge also goes back.</text>

  <rect x="410" y="420" width="330" height="118" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="575" y="440" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">Android conventions</text>
  <text x="575" y="458" font-size="9.5" fill="#333333" text-anchor="middle">Tab bar (or a top bar) still sits at the bottom for a</text>
  <text x="575" y="472" font-size="9.5" fill="#333333" text-anchor="middle">Material-styled app; stack header shows a bare arrow</text>
  <text x="575" y="486" font-size="9.5" fill="#333333" text-anchor="middle">back button, no title text; AddPlace/SignIn usually</text>
  <text x="575" y="500" font-size="9.5" fill="#333333" text-anchor="middle">push as a full-screen dialog; the system Back button</text>
  <text x="575" y="518" font-size="9.5" fill="#333333" text-anchor="middle">and gesture both pop the stack via BackHandler.</text>

  <text x="390" y="552" font-size="10.5" fill="#666666" text-anchor="middle">Tabs is one screen inside RootNavigator's stack; PlaceDetails/AddPlace/SignIn are its siblings, not its children.</text>
</svg>
