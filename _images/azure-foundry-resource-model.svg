<svg viewBox="0 0 820 520" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Foundry resource model: one resource, several endpoints, two ways to authenticate</text>

  <!-- Resource group -->
  <rect x="20" y="46" width="520" height="300" rx="10" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="34" y="66" font-size="12" font-weight="700" fill="#455a64">Resource group rg-bookshelf</text>

  <!-- Foundry resource -->
  <rect x="40" y="78" width="480" height="254" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="56" y="100" font-size="13.5" font-weight="700" fill="#0d47a1">Foundry resource foundry-bookshelf</text>
  <text x="56" y="118" font-size="11" fill="#1565c0">kind AIServices, SKU S0, custom subdomain foundry-bookshelf</text>

  <!-- Tools box -->
  <rect x="56" y="132" width="220" height="186" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="166" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Foundry Tools</text>
  <text x="70" y="172" font-size="11" fill="#263238">Speech</text>
  <text x="70" y="190" font-size="11" fill="#263238">Translator</text>
  <text x="70" y="208" font-size="11" fill="#263238">Language</text>
  <text x="70" y="226" font-size="11" fill="#263238">Vision and Face</text>
  <text x="70" y="244" font-size="11" fill="#263238">Document Intelligence</text>
  <text x="70" y="262" font-size="11" fill="#263238">Content Understanding</text>
  <text x="70" y="280" font-size="11" fill="#263238">Content Safety</text>
  <text x="70" y="304" font-size="10" fill="#607d8b">(AI Search is a separate resource)</text>

  <!-- Models + projects -->
  <rect x="290" y="132" width="216" height="80" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-width="1"/>
  <text x="398" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#4a148c">Foundry Models</text>
  <text x="304" y="172" font-size="11" fill="#263238">Azure OpenAI deployments</text>
  <text x="304" y="190" font-size="11" fill="#263238">model catalog deployments</text>
  <text x="304" y="206" font-size="10" fill="#607d8b">(not a Foundry Tool)</text>

  <rect x="290" y="222" width="216" height="96" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="398" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">Project proj-bookshelf</text>
  <text x="304" y="262" font-size="11" fill="#263238">agents, threads, evaluations</text>
  <text x="304" y="280" font-size="11" fill="#263238">connections (AI Search, Blob)</text>
  <text x="304" y="298" font-size="11" fill="#263238">project managed identity</text>

  <!-- Endpoints column -->
  <text x="680" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Endpoints</text>
  <rect x="550" y="78" width="262" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="96" font-size="10.5" font-weight="700" fill="#5d4037">Tool endpoint</text>
  <text x="560" y="114" font-size="10" fill="#5d4037">foundry-bookshelf.cognitiveservices.azure.com</text>

  <rect x="550" y="132" width="262" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="150" font-size="10.5" font-weight="700" fill="#5d4037">Project endpoint (/api/projects/name)</text>
  <text x="560" y="168" font-size="10" fill="#5d4037">foundry-bookshelf.services.ai.azure.com</text>

  <rect x="550" y="186" width="262" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="204" font-size="10.5" font-weight="700" fill="#5d4037">Azure OpenAI endpoint</text>
  <text x="560" y="222" font-size="10" fill="#5d4037">foundry-bookshelf.openai.azure.com</text>

  <rect x="550" y="240" width="262" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="258" font-size="10.5" font-weight="700" fill="#5d4037">Regional Speech hosts</text>
  <text x="560" y="276" font-size="10" fill="#5d4037">eastus2.stt / tts.speech.microsoft.com</text>

  <rect x="550" y="294" width="262" height="52" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="312" font-size="10.5" font-weight="700" fill="#5d4037">Global Translator host</text>
  <text x="560" y="328" font-size="10" fill="#5d4037">api.cognitive.microsofttranslator.com</text>
  <text x="560" y="341" font-size="9.5" fill="#5d4037">+ Ocp-Apim-Subscription-Region header</text>

  <!-- connectors -->
  <line x1="520" y1="101" x2="550" y2="101" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="506" y1="270" x2="545" y2="270" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="545" y1="155" x2="545" y2="270" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="545" y1="155" x2="550" y2="155" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="506" y1="172" x2="530" y2="172" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="530" y1="172" x2="530" y2="209" stroke="#f9a825" stroke-width="1.4"/>
  <line x1="530" y1="209" x2="550" y2="209" stroke="#f9a825" stroke-width="1.4"/>

  <!-- Auth band -->
  <rect x="20" y="364" width="380" height="140" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="36" y="386" font-size="13" font-weight="700" fill="#b71c1c">Keys (quickstarts, legacy clients)</text>
  <text x="36" y="408" font-size="11" fill="#263238">KEY1 / KEY2 in Ocp-Apim-Subscription-Key</text>
  <text x="36" y="426" font-size="11" fill="#263238">rotate one key at a time</text>
  <text x="36" y="444" font-size="11" fill="#263238">STS issueToken: 10-minute token (Speech, Translator)</text>
  <text x="36" y="462" font-size="11" fill="#263238">store in Key Vault, never in code</text>
  <text x="36" y="486" font-size="11" font-weight="700" fill="#b71c1c">disableLocalAuth = true turns keys off</text>

  <rect x="420" y="364" width="380" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="436" y="386" font-size="13" font-weight="700" fill="#1b5e20">Microsoft Entra ID (recommended)</text>
  <text x="436" y="408" font-size="11" fill="#263238">Bearer token, scope cognitiveservices.azure.com</text>
  <text x="436" y="426" font-size="11" fill="#263238">managed identity or DefaultAzureCredential</text>
  <text x="436" y="444" font-size="11" fill="#263238">role Cognitive Services User or Foundry roles</text>
  <text x="436" y="462" font-size="11" fill="#263238">needs the custom subdomain</text>
  <text x="436" y="486" font-size="11" font-weight="700" fill="#1b5e20">Owner / Contributor have no data actions</text>
</svg>
