<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-ersions-profiles-and-extensions-profiles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Core, compatibility and forward-compatible contexts</text>
<rect x="40" y="50" width="680" height="290" rx="14" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="199.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="380" y="76" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Compatibility profile (GL 3.2 and later): everything ever added</text>
<rect x="70" y="90" width="620" height="230" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="209.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle"></text>
<text x="380" y="116" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Core profile: no immediate mode, no matrix stack, no fixed-function lighting</text>
<rect x="100" y="130" width="560" height="170" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="219.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle"></text>
<text x="380" y="156" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Forward-compatible core context: also drops features marked deprecated</text>
<rect x="130" y="170" width="500" height="110" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="205.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">What macOS gives you: 3.2 or 4.1 core with forward-compatible set</text>
<text x="380.0" y="221.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle"></text>
<text x="380.0" y="237.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">What Windows and Linux drivers give you: core 4.6 and</text>
<text x="380.0" y="253.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">a compatibility profile that exposes both</text>
</svg>
