<svg viewBox="0 0 920 650" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Node.js event loop phases</title>
  <desc id="d">The six phases of one event loop iteration in order: timers, pending callbacks, idle and prepare, poll, check and close callbacks, then back to timers. After every callback the process.nextTick queue and then the microtask queue are drained. The operating system reports socket readiness to the poll phase, and the libuv thread pool runs file system, dns.lookup, crypto and zlib work and reports completion to the poll phase.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="650" rx="10" fill="#fafafa" stroke="#c8c8c8"/>

  <text x="460" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">One iteration of the Node.js event loop</text>
  <text x="460" y="50" font-size="12" fill="#555555" text-anchor="middle">all of the JavaScript below runs on the main thread, one callback at a time</text>

  <!-- ===== Phase stack (left) ===== -->
  <!-- timers -->
  <rect x="50" y="76" width="310" height="54" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="205" y="98" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">timers</text>
  <text x="205" y="116" font-size="11.5" fill="#333333" text-anchor="middle">setTimeout and setInterval callbacks that are due</text>
  <line x1="205" y1="130" x2="205" y2="150" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- pending -->
  <rect x="50" y="152" width="310" height="54" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="205" y="174" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">pending callbacks</text>
  <text x="205" y="192" font-size="11.5" fill="#333333" text-anchor="middle">I/O callbacks deferred from the previous iteration</text>
  <line x1="205" y1="206" x2="205" y2="226" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- idle, prepare -->
  <rect x="50" y="228" width="310" height="54" rx="6" fill="#f0f0f0" stroke="#777777" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="205" y="250" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">idle, prepare</text>
  <text x="205" y="268" font-size="11.5" fill="#444444" text-anchor="middle">libuv internals, no hook for your code</text>
  <line x1="205" y1="282" x2="205" y2="302" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- poll -->
  <rect x="50" y="304" width="310" height="78" rx="6" fill="#dcebf8" stroke="#1c4b73" stroke-width="3"/>
  <text x="205" y="328" font-size="15" font-weight="bold" fill="#12324d" text-anchor="middle">poll</text>
  <text x="205" y="346" font-size="11.5" fill="#333333" text-anchor="middle">runs I/O callbacks (sockets, finished pool tasks)</text>
  <text x="205" y="362" font-size="11.5" fill="#333333" text-anchor="middle">blocks here when idle, until the next timer</text>
  <text x="205" y="376" font-size="11.5" fill="#333333" text-anchor="middle">or until a setImmediate is waiting</text>
  <line x1="205" y1="382" x2="205" y2="402" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- check -->
  <rect x="50" y="404" width="310" height="54" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="205" y="426" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">check</text>
  <text x="205" y="444" font-size="11.5" fill="#333333" text-anchor="middle">setImmediate callbacks</text>
  <line x1="205" y1="458" x2="205" y2="478" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- close -->
  <rect x="50" y="480" width="310" height="54" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="205" y="502" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">close callbacks</text>
  <text x="205" y="520" font-size="11.5" fill="#333333" text-anchor="middle">for example 'close' after socket.destroy()</text>

  <!-- return arrow -->
  <path d="M50,507 L30,507 L30,103 L48,103" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="19" y="305" font-size="11.5" fill="#333333" text-anchor="middle" transform="rotate(-90 19 305)">next iteration, while anything is still active</text>

  <!-- ===== Right column ===== -->
  <!-- between callbacks -->
  <rect x="500" y="76" width="390" height="152" rx="6" fill="#fff3dc" stroke="#7a4a00" stroke-width="1.8"/>
  <text x="695" y="98" font-size="14" font-weight="bold" fill="#5c3700" text-anchor="middle">After every single callback, in every phase</text>
  <rect x="520" y="110" width="350" height="40" rx="4" fill="#ffffff" stroke="#7a4a00"/>
  <text x="695" y="127" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">first: the process.nextTick queue</text>
  <text x="695" y="143" font-size="11" fill="#555555" text-anchor="middle">Legacy API, drained completely</text>
  <rect x="520" y="156" width="350" height="44" rx="4" fill="#ffffff" stroke="#7a4a00"/>
  <text x="695" y="173" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">then: the microtask queue</text>
  <text x="695" y="190" font-size="11" fill="#555555" text-anchor="middle">promise reactions, await, queueMicrotask</text>
  <text x="695" y="217" font-size="11" fill="#5c3700" text-anchor="middle">repeated until both are empty, then the next callback runs</text>

  <!-- operating system -->
  <rect x="500" y="284" width="390" height="70" rx="6" fill="#f1eaf8" stroke="#5a2f7a" stroke-width="1.8"/>
  <text x="695" y="306" font-size="14" font-weight="bold" fill="#3d1f55" text-anchor="middle">Operating system kernel</text>
  <text x="695" y="324" font-size="11.5" fill="#333333" text-anchor="middle">non-blocking sockets and pipes, watched with</text>
  <text x="695" y="340" font-size="11.5" fill="#333333" text-anchor="middle">epoll (Linux), kqueue (macOS), IOCP (Windows)</text>
  <line x1="500" y1="319" x2="362" y2="319" stroke="#5a2f7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="431" y="311" font-size="11" fill="#3d1f55" text-anchor="middle">readiness events</text>

  <!-- thread pool -->
  <rect x="500" y="392" width="390" height="148" rx="6" fill="#e8f3e4" stroke="#2f5424" stroke-width="1.8"/>
  <text x="695" y="414" font-size="14" font-weight="bold" fill="#1f3a17" text-anchor="middle">libuv thread pool (not your JavaScript)</text>
  <rect x="525" y="426" width="68" height="26" rx="4" fill="#ffffff" stroke="#2f5424"/>
  <rect x="603" y="426" width="68" height="26" rx="4" fill="#ffffff" stroke="#2f5424"/>
  <rect x="681" y="426" width="68" height="26" rx="4" fill="#ffffff" stroke="#2f5424"/>
  <rect x="759" y="426" width="68" height="26" rx="4" fill="#ffffff" stroke="#2f5424"/>
  <text x="559" y="443" font-size="11" fill="#222222" text-anchor="middle">thread 1</text>
  <text x="637" y="443" font-size="11" fill="#222222" text-anchor="middle">thread 2</text>
  <text x="715" y="443" font-size="11" fill="#222222" text-anchor="middle">thread 3</text>
  <text x="793" y="443" font-size="11" fill="#222222" text-anchor="middle">thread 4</text>
  <text x="850" y="443" font-size="14" fill="#222222" text-anchor="middle">...</text>
  <text x="695" y="472" font-size="11.5" fill="#333333" text-anchor="middle">default size 4, set with UV_THREADPOOL_SIZE (maximum 1024)</text>
  <text x="695" y="492" font-size="11.5" fill="#333333" text-anchor="middle">fs, dns.lookup, crypto (pbkdf2, scrypt, randomBytes),</text>
  <text x="695" y="508" font-size="11.5" fill="#333333" text-anchor="middle">zlib: blocking system calls and CPU-heavy native work</text>
  <text x="695" y="528" font-size="11" fill="#555555" text-anchor="middle">queued from the main thread, FIFO, one task per thread at a time</text>
  <path d="M500,466 L430,466 L430,370 L362,370" fill="none" stroke="#2f5424" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="426" y="484" font-size="10.5" fill="#1f3a17">task finished</text>

  <!-- ===== Footer notes ===== -->
  <rect x="30" y="556" width="860" height="80" rx="6" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="46" y="577" font-size="12" fill="#222222"><tspan font-weight="bold">Start-up:</tspan> the main script runs to the end, then the nextTick and microtask queues are drained, then the loop starts.</text>
  <text x="46" y="597" font-size="12" fill="#222222"><tspan font-weight="bold">Timers:</tspan> since libuv 1.45 (Node.js 20) due timers run once before the first iteration and afterwards at the end of each</text>
  <text x="46" y="613" font-size="12" fill="#222222">iteration, right after close callbacks. They are drawn first because the cycle is the same.</text>
  <text x="46" y="629" font-size="12" fill="#222222"><tspan font-weight="bold">Exit:</tspan> with no active timers, handles or requests left, the loop ends and the process exits.</text>
</svg>
