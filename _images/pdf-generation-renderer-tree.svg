<svg viewBox="0 0 900 540" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Each element creates its own renderer; the renderer tree does the layout and the drawing</text>

  <rect x="30" y="50" width="250" height="330" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="46" y="72" font-size="13" font-weight="700" fill="#1f5fa6">Element tree (data, properties)</text>
  <rect x="620" y="50" width="250" height="330" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="636" y="72" font-size="13" font-weight="700" fill="#2b7a2b">Renderer tree (layout, drawing)</text>

  <rect x="50" y="92" width="200" height="46" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="150.0" y="120" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">Table</text>
  <rect x="640" y="92" width="210" height="46" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="745.0" y="120" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">TableRenderer</text>
  <line x1="250" y1="115" x2="640" y2="115" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#rt-arrow)"/>
  <line x1="59" y1="138" x2="59" y2="164" stroke="#1f5fa6" stroke-width="1.2"/>
  <line x1="649" y1="138" x2="649" y2="164" stroke="#2b7a2b" stroke-width="1.2"/>
  <rect x="68" y="164" width="182" height="46" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="159.0" y="192" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">Cell</text>
  <rect x="658" y="164" width="192" height="46" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="754.0" y="192" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">CellRenderer</text>
  <line x1="250" y1="187" x2="658" y2="187" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#rt-arrow)"/>
  <line x1="77" y1="210" x2="77" y2="236" stroke="#1f5fa6" stroke-width="1.2"/>
  <line x1="667" y1="210" x2="667" y2="236" stroke="#2b7a2b" stroke-width="1.2"/>
  <rect x="86" y="236" width="164" height="46" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="168.0" y="264" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">Paragraph</text>
  <rect x="676" y="236" width="174" height="46" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="763.0" y="264" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">ParagraphRenderer</text>
  <line x1="250" y1="259" x2="676" y2="259" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#rt-arrow)"/>
  <line x1="95" y1="282" x2="95" y2="308" stroke="#1f5fa6" stroke-width="1.2"/>
  <line x1="685" y1="282" x2="685" y2="308" stroke="#2b7a2b" stroke-width="1.2"/>
  <rect x="104" y="308" width="146" height="46" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="177.0" y="336" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">Text</text>
  <rect x="694" y="308" width="156" height="46" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="772.0" y="336" text-anchor="middle" font-size="13" font-family="Courier New, monospace" fill="#333">TextRenderer</text>
  <line x1="250" y1="331" x2="694" y2="331" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#rt-arrow)"/>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#333">createRendererSubTree()</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#555">setNextRenderer() overrides it</text>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#555">one renderer per element,</text>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#555">children added with addChild()</text>

  <rect x="30" y="410" width="840" height="110" rx="8" fill="#fff1dc" stroke="#b36b00" stroke-width="1.6"/>
  <text x="46" y="432" font-size="13" font-weight="700" fill="#7a4800">Driven by the DocumentRenderer (or ColumnDocumentRenderer)</text>
  <text x="50" y="458" font-size="12" fill="#333">1. layout(LayoutContext): each renderer asks its children, then returns a LayoutResult</text>
  <text x="50" y="478" font-size="12" fill="#333">2. FULL: it fitted. PARTIAL: split into a part that fitted and an overflow renderer. NOTHING: nothing fitted.</text>
  <text x="50" y="498" font-size="12" fill="#333">3. draw(DrawContext): backgrounds, borders and content are written to the PdfCanvas of the page</text>
  <line x1="745" y1="380" x2="745" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#rt-arrow)"/>
</svg>
