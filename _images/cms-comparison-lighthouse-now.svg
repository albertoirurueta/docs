<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="lighthouse-now-t lighthouse-now-d">
<title id="lighthouse-now-t">Median Lighthouse performance score now</title>
<desc id="lighthouse-now-d">Median Lighthouse performance score (0 to 100) of the origins detected for each CMS in 2026-09, mobile and desktop (HTTP Archive Tech Report). Lab scores come from a throttled test profile and are lower than real-user experience on fast devices. Payload has no series (n/a).</desc>
