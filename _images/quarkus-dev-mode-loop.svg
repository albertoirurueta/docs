<svg viewBox="0 0 800 590" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="590" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The quarkus dev inner loop, with Dev UI and Dev Services attached</text>
  <text x="400" y="45" font-size="11" fill="#666666" text-anchor="middle">solid arrows: the live-reload cycle -- dashed box: work that happens inside the same running JVM, with no restart</text>

  <!-- in-JVM dashed boundary -->
  <rect x="280" y="58" width="510" height="264" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="785" y="72" font-size="9.5" fill="#666666" text-anchor="end">in-JVM: fast path, no full restart</text>

  <!-- loop row: 5 stage boxes -->
  <rect x="20" y="70" width="140" height="55" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="90" y="93" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. Edit source</text>
  <text x="90" y="107" font-size="10" fill="#333333" text-anchor="middle">(.java, .properties)</text>

  <rect x="175" y="70" width="110" height="55" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="230" y="102" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">2. Save</text>

  <rect x="300" y="70" width="150" height="55" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="375" y="93" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">3. Next request:</text>
  <text x="375" y="107" font-size="10" fill="#333333" text-anchor="middle">has anything watched</text>
  <text x="375" y="119" font-size="10" fill="#333333" text-anchor="middle">changed since last time?</text>

  <rect x="465" y="70" width="170" height="55" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="550" y="93" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">4. Fast in-JVM</text>
  <text x="550" y="107" font-size="10" fill="#333333" text-anchor="middle">recompile + re-augment</text>
  <text x="550" y="119" font-size="10" fill="#333333" text-anchor="middle">(HOT REPLACE)</text>

  <rect x="650" y="70" width="130" height="55" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="715" y="93" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">5. Serve the</text>
  <text x="715" y="107" font-size="10" fill="#333333" text-anchor="middle">request</text>

  <!-- arrows across the row -->
  <line x1="160" y1="97" x2="175" y2="97" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="285" y1="97" x2="300" y2="97" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="450" y1="97" x2="465" y2="97" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="635" y1="97" x2="650" y2="97" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- looping return arrow from stage 5 back to stage 1 -->
  <path d="M 715,70 C 715,20 90,20 90,68" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="400" y="18" font-size="9.5" fill="#666666" text-anchor="middle">loop repeats for as long as quarkus dev keeps running</text>

  <!-- central JVM box -->
  <rect x="350" y="225" width="220" height="90" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="460" y="255" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">quarkus dev (JVM)</text>
  <text x="460" y="272" font-size="10" fill="#333333" text-anchor="middle">hosts the live-reload loop;</text>
  <text x="460" y="286" font-size="10" fill="#333333" text-anchor="middle">most edits hot-replace in place --</text>
  <text x="460" y="300" font-size="10" fill="#333333" text-anchor="middle">only pom.xml / new extensions restart it</text>

  <!-- connector between loop row and central box -->
  <line x1="460" y1="225" x2="460" y2="125" stroke="#333333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(arrow-up)"/>
  <text x="600" y="145" font-size="9.5" fill="#333333" text-anchor="middle">step 4 happens here,</text>
  <text x="600" y="158" font-size="9.5" fill="#333333" text-anchor="middle">step 5 is then served from here</text>

  <!-- Dev UI satellite -->
  <rect x="40" y="420" width="220" height="90" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="150" y="443" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Dev UI (/q/dev)</text>
  <text x="150" y="459" font-size="10" fill="#333333" text-anchor="middle">extension cards, config editor,</text>
  <text x="150" y="473" font-size="10" fill="#333333" text-anchor="middle">bean / endpoint browser --</text>
  <text x="150" y="487" font-size="10" fill="#333333" text-anchor="middle">invoke an endpoint directly</text>
  <text x="150" y="501" font-size="10" fill="#333333" text-anchor="middle">from the browser</text>

  <line x1="220" y1="420" x2="400" y2="315" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="270" y="380" font-size="9.5" fill="#333333" text-anchor="middle">reads and</text>
  <text x="270" y="392" font-size="9.5" fill="#333333" text-anchor="middle">exercises live state</text>

  <!-- Dev Services satellites -->
  <rect x="430" y="420" width="150" height="90" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="505" y="443" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">Dev Services:</text>
  <text x="505" y="459" font-size="10.5" fill="#333333" text-anchor="middle">Postgres container</text>
  <text x="505" y="473" font-size="10" fill="#666666" text-anchor="middle">(Testcontainers)</text>
  <text x="505" y="490" font-size="9.5" fill="#666666" text-anchor="middle">auto-started, ephemeral</text>

  <rect x="610" y="420" width="150" height="90" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="685" y="443" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">Dev Services:</text>
  <text x="685" y="459" font-size="10.5" fill="#333333" text-anchor="middle">Kafka container</text>
  <text x="685" y="473" font-size="10" fill="#666666" text-anchor="middle">(Testcontainers)</text>
  <text x="685" y="490" font-size="9.5" fill="#666666" text-anchor="middle">auto-started, ephemeral</text>

  <line x1="490" y1="420" x2="450" y2="315" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="620" y1="420" x2="500" y2="315" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="580" y="365" font-size="9.5" fill="#333333" text-anchor="middle">injects connection URLs</text>

  <!-- bottom note -->
  <rect x="20" y="530" width="760" height="45" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="548" font-size="10.5" fill="#666666" text-anchor="middle">Dev Services containers are started the first time a request needs them and torn down when quarkus dev</text>
  <text x="400" y="563" font-size="10.5" fill="#666666" text-anchor="middle">stops -- unless a shared-container label lets a later run reuse the same one</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-up" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
