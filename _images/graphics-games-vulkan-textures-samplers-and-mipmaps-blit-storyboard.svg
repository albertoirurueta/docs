<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tex-blit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Generating mipmaps with vkCmdBlitImage2, one level at a time</text>
<rect x="20" y="60" width="134" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="74" r="11" fill="#4F46E5"/><text x="34" y="78" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="87" y="100" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Upload</text>
<rect x="52.0" y="115" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="59.0" y="143" width="56" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="66.0" y="171" width="42" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="73.0" y="199" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="87" y="238" text-anchor="middle" font-size="11" fill="#374151">level 0 holds the pixels;</text>
<text x="87" y="252" text-anchor="middle" font-size="11" fill="#374151">all levels in</text>
<text x="87" y="266" text-anchor="middle" font-size="11" fill="#374151">TRANSFER_DST_OPTIMAL</text>
<line x1="155" y1="175" x2="165" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tex-blit)"/>
<rect x="166" y="60" width="134" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="180" cy="74" r="11" fill="#4F46E5"/><text x="180" y="78" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="233" y="100" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Prepare source</text>
<rect x="198.0" y="115" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="205.0" y="143" width="56" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="212.0" y="171" width="42" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="219.0" y="199" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="233" y="238" text-anchor="middle" font-size="11" fill="#374151">barrier level i-1:</text>
<text x="233" y="252" text-anchor="middle" font-size="11" fill="#374151">TRANSFER_DST -></text>
<text x="233" y="266" text-anchor="middle" font-size="11" fill="#374151">TRANSFER_SRC</text>
<line x1="301" y1="175" x2="311" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tex-blit)"/>
<rect x="312" y="60" width="134" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="74" r="11" fill="#B45309"/><text x="326" y="78" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="379" y="100" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Blit</text>
<rect x="344.0" y="115" width="70" height="20" rx="3" fill="#D1FAE5" stroke="#4F46E5" stroke-width="1"/>
<rect x="351.0" y="143" width="56" height="20" rx="3" fill="#D1FAE5" stroke="#4F46E5" stroke-width="1"/>
<rect x="358.0" y="171" width="42" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="365.0" y="199" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="379" y="238" text-anchor="middle" font-size="11" fill="#374151">vkCmdBlitImage2</text>
<text x="379" y="252" text-anchor="middle" font-size="11" fill="#374151">level i-1 -> level i,</text>
<text x="379" y="266" text-anchor="middle" font-size="11" fill="#374151">linear, half size</text>
<line x1="447" y1="175" x2="457" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tex-blit)"/>
<rect x="458" y="60" width="134" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="472" cy="74" r="11" fill="#4F46E5"/><text x="472" y="78" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="525" y="100" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Hand over</text>
<rect x="490.0" y="115" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="497.0" y="143" width="56" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="504.0" y="171" width="42" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="511.0" y="199" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="525" y="238" text-anchor="middle" font-size="11" fill="#374151">barrier level i-1:</text>
<text x="525" y="252" text-anchor="middle" font-size="11" fill="#374151">TRANSFER_SRC -></text>
<text x="525" y="266" text-anchor="middle" font-size="11" fill="#374151">SHADER_READ_ONLY</text>
<line x1="593" y1="175" x2="603" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tex-blit)"/>
<rect x="604" y="60" width="134" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="618" cy="74" r="11" fill="#4F46E5"/><text x="618" y="78" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="671" y="100" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Finish</text>
<rect x="636.0" y="115" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="643.0" y="143" width="56" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="650.0" y="171" width="42" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="657.0" y="199" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="671" y="238" text-anchor="middle" font-size="11" fill="#374151">last level i = n-1:</text>
<text x="671" y="252" text-anchor="middle" font-size="11" fill="#374151">TRANSFER_DST -></text>
<text x="671" y="266" text-anchor="middle" font-size="11" fill="#374151">SHADER_READ_ONLY</text>
<text x="380" y="320" text-anchor="middle" font-size="12" fill="#374151">Steps 2 to 4 repeat for every level from 1 to n-1; the loop halves width and height each time (never below 1).</text>
<text x="380" y="340" text-anchor="middle" font-size="12" fill="#374151">The image needs TRANSFER_SRC and TRANSFER_DST usage, and the format must support linear filtering for blits.</text>
<text x="380" y="360" text-anchor="middle" font-size="12" fill="#374151">A compute shader or a pre-baked KTX2 file with all levels avoids the blit loop entirely.</text>
</svg>
