<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kafka listener security protocols</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">a broker listener is mapped to exactly one of these four via listener.security.protocol.map</text>

  <!-- header row -->
  <rect x="20" y="58" width="160" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="180" y="58" width="180" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="360" y="58" width="320" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="30" y="80" font-size="12" font-weight="bold" fill="#222222">Security protocol</text>
  <text x="270" y="80" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Transport encryption</text>
  <text x="520" y="80" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Authentication</text>

  <!-- Row 1: PLAINTEXT (92-172) -->
  <rect x="20" y="92" width="160" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="180" y="92" width="180" height="80" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="360" y="92" width="320" height="80" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <text x="30" y="124" font-size="12.5" font-weight="bold" fill="#222222">PLAINTEXT</text>
  <text x="30" y="140" font-size="9.5" fill="#555555">the unsecured default</text>
  <text x="270" y="128" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">None</text>
  <text x="270" y="144" font-size="9.5" fill="#555555" text-anchor="middle">data travels in the clear</text>
  <text x="520" y="128" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">None</text>
  <text x="520" y="144" font-size="9.5" fill="#555555" text-anchor="middle">any client may connect as anyone</text>

  <!-- Row 2: SSL (172-252) -->
  <rect x="20" y="172" width="160" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="180" y="172" width="180" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <rect x="360" y="172" width="320" height="80" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="30" y="204" font-size="12.5" font-weight="bold" fill="#222222">SSL</text>
  <text x="30" y="220" font-size="9.5" fill="#555555">TLS-only listener</text>
  <text x="270" y="208" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">TLS</text>
  <text x="270" y="224" font-size="9.5" fill="#555555" text-anchor="middle">broker certificate, always</text>
  <text x="520" y="204" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">None, or mTLS</text>
  <text x="520" y="220" font-size="9.5" fill="#555555" text-anchor="middle">ssl.client.auth=required makes the client</text>
  <text x="520" y="233" font-size="9.5" fill="#555555" text-anchor="middle">certificate's DN the authenticated principal</text>

  <!-- Row 3: SASL_PLAINTEXT (252-332) -->
  <rect x="20" y="252" width="160" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="180" y="252" width="180" height="80" fill="#fbecec" stroke="#a33333" stroke-width="1.2"/>
  <rect x="360" y="252" width="320" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="30" y="284" font-size="12.5" font-weight="bold" fill="#222222">SASL_PLAINTEXT</text>
  <text x="30" y="300" font-size="9.5" fill="#555555">authenticated, unencrypted</text>
  <text x="270" y="296" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">None</text>
  <text x="520" y="288" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">SASL</text>
  <text x="520" y="304" font-size="9.5" fill="#555555" text-anchor="middle">PLAIN / SCRAM-SHA-256 / SCRAM-SHA-512 /</text>
  <text x="520" y="317" font-size="9.5" fill="#555555" text-anchor="middle">GSSAPI (Kerberos) / OAUTHBEARER</text>

  <!-- Row 4: SASL_SSL (332-412) -->
  <rect x="20" y="332" width="160" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1.4"/>
  <rect x="180" y="332" width="180" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <rect x="360" y="332" width="320" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="30" y="364" font-size="12.5" font-weight="bold" fill="#222222">SASL_SSL</text>
  <text x="30" y="380" font-size="9.5" fill="#555555">common production default</text>
  <text x="270" y="376" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">TLS</text>
  <text x="270" y="392" font-size="9.5" fill="#555555" text-anchor="middle">broker certificate, always</text>
  <text x="520" y="368" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">SASL</text>
  <text x="520" y="384" font-size="9.5" fill="#555555" text-anchor="middle">PLAIN / SCRAM-SHA-256 / SCRAM-SHA-512 /</text>
  <text x="520" y="397" font-size="9.5" fill="#555555" text-anchor="middle">GSSAPI (Kerberos) / OAUTHBEARER</text>
</svg>
