<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Generational garbage collection in .NET: new small objects are allocated by bumping a pointer in generation 0; a generation 0 collection traces from the roots, discards unreachable objects and promotes the survivors into generation 1; a generation 1 collection promotes its survivors into generation 2; objects of 85,000 bytes or more bypass the young generations and are allocated directly on the large object heap, which is collected only together with generation 2.</title>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The generational heap: allocation, collection and promotion</text>
  <text x="430" y="45" font-size="11" fill="#666666" text-anchor="middle">most objects die in gen 0 -- survivors are promoted, and each generation is collected less often than the one below it</text>

  <!-- roots -->
  <rect x="24" y="74" width="140" height="120" rx="8" fill="#fdf6ec" stroke="#c79a4e" stroke-width="1.3"/>
  <text x="94" y="96" font-size="12.5" font-weight="bold" fill="#7a5518" text-anchor="middle">GC roots</text>
  <text x="94" y="118" font-size="10.5" fill="#6b5326" text-anchor="middle">statics</text>
  <text x="94" y="134" font-size="10.5" fill="#6b5326" text-anchor="middle">thread stacks</text>
  <text x="94" y="150" font-size="10.5" fill="#6b5326" text-anchor="middle">registers</text>
  <text x="94" y="166" font-size="10.5" fill="#6b5326" text-anchor="middle">GC handles</text>
  <text x="94" y="184" font-size="10" fill="#8a7550" text-anchor="middle" font-style="italic">tracing starts here</text>

  <!-- arrow roots -> gen0 -->
  <path d="M 168 134 L 214 134" stroke="#c79a4e" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- small object heap band -->
  <rect x="216" y="64" width="620" height="196" rx="10" fill="#f7f9fc" stroke="#8fa4bd" stroke-width="1.3"/>
  <text x="526" y="84" font-size="12.5" font-weight="bold" fill="#31465e" text-anchor="middle">Small object heap</text>

  <!-- gen 0 -->
  <rect x="238" y="96" width="176" height="146" rx="6" fill="#eaf3fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="326" y="118" font-size="13" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Generation 0</text>
  <text x="326" y="135" font-size="10" fill="#41566e" text-anchor="middle">new small objects</text>
  <rect x="256" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#3d6fa5"/>
  <rect x="292" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#3d6fa5"/>
  <rect x="328" y="146" width="30" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="3 2"/>
  <rect x="364" y="146" width="30" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="3 2"/>
  <text x="326" y="192" font-size="10" fill="#41566e" text-anchor="middle">allocation = bump a pointer</text>
  <text x="326" y="208" font-size="10" fill="#2f6b46" text-anchor="middle">collected very often, very cheaply</text>
  <text x="326" y="228" font-size="9.5" fill="#8a8f98" text-anchor="middle">solid = reachable&#160;&#160;dashed = garbage</text>

  <!-- arrow gen0 -> gen1 -->
  <path d="M 418 169 L 456 169" stroke="#3d6fa5" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="437" y="160" font-size="9.5" fill="#31465e" text-anchor="middle">promote</text>

  <!-- gen 1 -->
  <rect x="458" y="96" width="156" height="146" rx="6" fill="#eef6f1" stroke="#4a8a68" stroke-width="1.5"/>
  <text x="536" y="118" font-size="13" font-weight="bold" fill="#245139" text-anchor="middle">Generation 1</text>
  <text x="536" y="135" font-size="10" fill="#3a6952" text-anchor="middle">gen-0 survivors</text>
  <rect x="482" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#4a8a68"/>
  <rect x="518" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#4a8a68"/>
  <rect x="554" y="146" width="30" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="3 2"/>
  <text x="536" y="192" font-size="10" fill="#3a6952" text-anchor="middle">a buffer between</text>
  <text x="536" y="206" font-size="10" fill="#3a6952" text-anchor="middle">short- and long-lived</text>

  <!-- arrow gen1 -> gen2 -->
  <path d="M 618 169 L 656 169" stroke="#4a8a68" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="637" y="160" font-size="9.5" fill="#245139" text-anchor="middle">promote</text>

  <!-- gen 2 -->
  <rect x="658" y="96" width="156" height="146" rx="6" fill="#f7eef3" stroke="#9c5a7d" stroke-width="1.5"/>
  <text x="736" y="118" font-size="13" font-weight="bold" fill="#6d3553" text-anchor="middle">Generation 2</text>
  <text x="736" y="135" font-size="10" fill="#7c4a63" text-anchor="middle">long-lived objects</text>
  <rect x="682" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#9c5a7d"/>
  <rect x="718" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#9c5a7d"/>
  <rect x="754" y="146" width="30" height="26" rx="3" fill="#ffffff" stroke="#9c5a7d"/>
  <text x="736" y="192" font-size="10" fill="#7c4a63" text-anchor="middle">a gen-2 collection is</text>
  <text x="736" y="206" font-size="10" fill="#7c4a63" text-anchor="middle">a full collection</text>

  <!-- large object heap -->
  <rect x="216" y="292" width="620" height="112" rx="10" fill="#fbf6f3" stroke="#b98368" stroke-width="1.3"/>
  <text x="526" y="314" font-size="12.5" font-weight="bold" fill="#74452c" text-anchor="middle">Large object heap (LOH) -- objects of 85,000 bytes or more</text>
  <rect x="262" y="330" width="150" height="34" rx="4" fill="#ffffff" stroke="#b98368"/>
  <text x="337" y="352" font-size="10.5" fill="#74452c" text-anchor="middle">byte[100_000]</text>
  <rect x="436" y="330" width="150" height="34" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="3 2"/>
  <text x="511" y="352" font-size="10.5" fill="#6c757d" text-anchor="middle">discarded buffer</text>
  <rect x="610" y="330" width="180" height="34" rx="4" fill="#ffffff" stroke="#b98368"/>
  <text x="700" y="352" font-size="10.5" fill="#74452c" text-anchor="middle">double[20_000]</text>
  <text x="526" y="386" font-size="10" fill="#7c5540" text-anchor="middle">collected only with gen 2, and not compacted by default -- prefer ArrayPool&lt;T&gt; for repeated large buffers</text>

  <!-- allocation arrow into LOH -->
  <path d="M 94 200 L 94 348 L 254 348" stroke="#b98368" stroke-width="2" fill="none" marker-end="url(#arrowBrown)"/>
  <text x="150" y="340" font-size="9.5" fill="#74452c" text-anchor="middle">large allocations bypass gen 0</text>

  <!-- collection frequency scale -->
  <text x="238" y="432" font-size="10.5" font-weight="bold" fill="#444444">Collection frequency:</text>
  <text x="366" y="432" font-size="10.5" fill="#2f6b46">gen 0 -- frequent, sub-millisecond</text>
  <text x="366" y="448" font-size="10.5" fill="#7c4a63">gen 2 -- rare, and the expensive one (mostly concurrent in the background)</text>
  <text x="238" y="448" font-size="10" fill="#777777">collecting a generation</text>
  <text x="238" y="462" font-size="10" fill="#777777">always collects the younger ones</text>

  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c79a4e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6fa5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8a68"/>
    </marker>
    <marker id="arrowBrown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b98368"/>
    </marker>
  </defs>
</svg>
