<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where Magento background work runs on Kubernetes</title>
  <desc id="d">Namespace pocketcoffee on the left, managed services on the right. The web pods publish messages and run no cron and no consumers. One CronJob, pocketcoffee-cron, runs bin/magento cron:run for every cron group except consumers once a minute with concurrencyPolicy Forbid and keeps its schedule and locks in the RDS database. Three consumer Deployments read their queues from Amazon MQ over AMQP, and a KEDA ScaledObject for each one reads the queue depth from the Amazon MQ management API on port 443 and scales the Deployment. A Job, pocketcoffee-reindex, runs indexer:reindex on demand and writes the search indexes to OpenSearch.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f2f5f8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4b860"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9b3e6"/></marker>
  </defs>
  <rect width="960" height="580" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Background work: one scheduler, consumers as Deployments, reindex as a Job</text>
  <rect x="20" y="52" width="620" height="512" rx="10" fill="none" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="34" y="74" font-size="12" font-weight="bold" fill="#9fd3c7">Namespace pocketcoffee on the EKS cluster pocketcoffee-prod</text>

  <rect x="36" y="88" width="588" height="52" rx="9" fill="#33485c"/>
  <text x="48" y="110" font-size="13" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-web</text>
  <text x="48" y="129" font-size="12" fill="#f2f5f8">serves requests and publishes messages; <tspan fill="#f4b860">no cron and no consumers</tspan></text>

  <rect x="36" y="154" width="588" height="86" rx="9" fill="#3f6e9a"/>
  <text x="48" y="176" font-size="13" font-weight="bold" fill="#f2f5f8">CronJob pocketcoffee-cron</text>
  <text x="48" y="196" font-size="12" fill="#f2f5f8">every minute, concurrencyPolicy Forbid; one cron:run per group in the foreground</text>
  <text x="48" y="214" font-size="12" fill="#f2f5f8">groups default and index, never consumers</text>
  <text x="48" y="232" font-size="12" fill="#f4b860">cron_consumers_runner is switched off in env.php</text>

  <rect x="36" y="254" width="588" height="44" rx="9" fill="#4d7c5a"/>
  <text x="48" y="273" font-size="13" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-consumer-async-operations-all</text>
  <text x="48" y="290" font-size="12" fill="#f2f5f8">queue:consumers:start async.operations.all --max-messages=1000, 1 to 4 replicas</text>
  <rect x="36" y="304" width="588" height="44" rx="9" fill="#4d7c5a"/>
  <text x="48" y="323" font-size="13" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-consumer-product-action-attribute-update</text>
  <text x="48" y="340" font-size="12" fill="#f2f5f8">1 to 2 replicas</text>
  <rect x="36" y="354" width="588" height="44" rx="9" fill="#4d7c5a"/>
  <text x="48" y="373" font-size="13" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-consumer-media-storage-catalog-image-resize</text>
  <text x="48" y="390" font-size="12" fill="#f2f5f8">0 to 6 replicas</text>

  <rect x="36" y="426" width="588" height="62" rx="9" fill="#34495e" stroke="#c9b3e6" stroke-width="2"/>
  <text x="48" y="448" font-size="13" font-weight="bold" fill="#c9b3e6">KEDA operator: one ScaledObject per consumer Deployment</text>
  <text x="48" y="468" font-size="12" fill="#f2f5f8">trigger rabbitmq, protocol http, mode QueueLength; TriggerAuthentication holds the user and password</text>
  <path d="M330 426 L330 402" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="340" y="418" font-size="11" fill="#f4b860">scales</text>

  <rect x="36" y="504" width="588" height="46" rx="9" fill="#7a5c3a"/>
  <text x="48" y="524" font-size="13" font-weight="bold" fill="#f2f5f8">Job pocketcoffee-reindex</text>
  <text x="48" y="542" font-size="12" fill="#f2f5f8">indexer:reindex, started by hand after a release or an import</text>

  <rect x="690" y="154" width="250" height="110" rx="9" fill="#3d5266"/>
  <text x="702" y="176" font-size="13" font-weight="bold" fill="#f2f5f8">Amazon RDS pocketcoffee-prod</text>
  <text x="702" y="198" font-size="12" fill="#f2f5f8">cron_schedule and the lock names</text>
  <text x="702" y="216" font-size="12" fill="#f2f5f8">mview_state and the _cl changelogs</text>
  <text x="702" y="234" font-size="12" fill="#f2f5f8">indexer_state, queue_poison_pill</text>
  <text x="702" y="254" font-size="12" fill="#f4b860">one scheduler writes the schedule</text>

  <rect x="690" y="284" width="250" height="180" rx="9" fill="#3d5266"/>
  <text x="702" y="306" font-size="13" font-weight="bold" fill="#f2f5f8">Amazon MQ pocketcoffee-prod-mq</text>
  <text x="702" y="328" font-size="12" fill="#f2f5f8">RabbitMQ 4.3, one queue per consumer</text>
  <text x="702" y="350" font-size="12" fill="#9fd3c7">AMQP over TLS, port 5671:</text>
  <text x="702" y="366" font-size="12" fill="#9fd3c7">consumers read and acknowledge</text>
  <text x="702" y="408" font-size="12" fill="#c9b3e6">management API, port 443:</text>
  <text x="702" y="424" font-size="12" fill="#c9b3e6">queue depth for KEDA</text>

  <rect x="690" y="504" width="250" height="46" rx="9" fill="#3d5266"/>
  <text x="702" y="524" font-size="13" font-weight="bold" fill="#f2f5f8">Amazon OpenSearch Service</text>
  <text x="702" y="542" font-size="12" fill="#f2f5f8">search indexes, prefix pocketcoffee</text>

  <path d="M624 197 L688 197" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="634" y="190" font-size="11" fill="#f2f5f8">cron:run</text>
  <path d="M624 326 L688 357" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#a)"/>
  <path d="M624 457 L650 457 L650 416 L688 416" fill="none" stroke="#c9b3e6" stroke-width="2" marker-end="url(#c)"/>
  <text x="634" y="444" font-size="11" fill="#c9b3e6">HTTPS</text>
  <path d="M624 527 L688 527" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
</svg>
