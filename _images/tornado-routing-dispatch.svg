<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How Tornado routes a request</title>
  <defs>
    <marker id="trd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">How Tornado routes one request</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">rules are tried in order, the first match wins, and a nested router repeats the same walk</text>

  <!-- request -->
  <rect x="30" y="64" width="660" height="40" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="89" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">HTTPServer(app) parses the request: method, Host header, path (raw, still percent-encoded)</text>
  <line x1="360" y1="104" x2="360" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>

  <!-- default router -->
  <rect x="30" y="124" width="660" height="116" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="44" y="144" font-size="13" font-weight="bold" fill="currentColor">Application.default_router (host rules)</text>

  <rect x="44" y="154" width="196" height="72" rx="5" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="142" y="176" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">rule 1: HostMatches</text>
  <text x="142" y="193" font-size="11" fill="currentColor" text-anchor="middle">admin host pattern</text>
  <text x="142" y="210" font-size="11" fill="currentColor" text-anchor="middle">from add_handlers</text>

  <rect x="262" y="154" width="196" height="72" rx="5" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="176" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">rule 2: HostMatches</text>
  <text x="360" y="193" font-size="11" fill="currentColor" text-anchor="middle">another add_handlers</text>
  <text x="360" y="210" font-size="11" fill="currentColor" text-anchor="middle">host pattern</text>

  <rect x="480" y="154" width="196" height="72" rx="5" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="578" y="176" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">last rule: AnyMatches</text>
  <text x="578" y="193" font-size="11" fill="currentColor" text-anchor="middle">the handlers list passed</text>
  <text x="578" y="210" font-size="11" fill="currentColor" text-anchor="middle">to Application(...)</text>

  <line x1="142" y1="226" x2="142" y2="262" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>
  <line x1="360" y1="226" x2="360" y2="262" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>
  <line x1="578" y1="226" x2="578" y2="262" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>

  <!-- path rules -->
  <rect x="44" y="264" width="632" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="284" font-size="13" font-weight="bold" fill="currentColor">Path rules of the chosen router, top to bottom</text>
  <text x="58" y="306" font-size="12" fill="currentColor">/books/([0-9]+)  matches the path, anchored with a trailing $, never the query string</text>
  <text x="58" y="326" font-size="12" fill="currentColor">/shelves/(?P&lt;shelf&gt;[a-z-]+)  named groups arrive as keyword arguments</text>
  <text x="58" y="346" font-size="12" fill="currentColor">a rule target can be a handler class, a nested rule list, a Router or an Application</text>

  <line x1="200" y1="360" x2="200" y2="386" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>
  <line x1="520" y1="360" x2="520" y2="386" stroke="currentColor" stroke-width="1.5" marker-end="url(#trd-arrow)"/>
  <text x="210" y="378" font-size="11" fill="currentColor">first match</text>
  <text x="530" y="378" font-size="11" fill="currentColor">no rule matched</text>

  <rect x="44" y="388" width="312" height="66" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="200" y="412" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">RequestHandler instance</text>
  <text x="200" y="430" font-size="11" fill="currentColor" text-anchor="middle">initialize(**kwargs), then get/post/... (path args)</text>
  <text x="200" y="444" font-size="11" fill="currentColor" text-anchor="middle">a missing verb method answers 405</text>

  <rect x="384" y="388" width="292" height="66" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="530" y="412" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">default_handler_class</text>
  <text x="530" y="430" font-size="11" fill="currentColor" text-anchor="middle">or, when not set, the built-in</text>
  <text x="530" y="444" font-size="11" fill="currentColor" text-anchor="middle">ErrorHandler with status 404</text>
</svg>
