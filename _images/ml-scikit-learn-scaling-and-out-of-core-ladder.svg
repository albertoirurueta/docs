<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Scaling ladder for large data</title>
<desc id="d">Four steps ordered by effort: first shrink the data in memory with smaller dtypes, sparse formats and subsampling; then use a scalable model such as HistGradientBoosting or a linear model; then learn out of core with partial_fit on mini-batches; and finally move to a distributed engine when one machine is not enough.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Climb only as far as the data forces you</text>
<rect x="30" y="60" width="300" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="46" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">1  Shrink the data</text>
<text x="46" y="104" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">float32, CSR, category, subsample</text>
<rect x="30" y="130" width="300" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="46" y="154" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">2  Pick a model that scales</text>
<text x="46" y="174" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">HistGradientBoosting, linear, SGD</text>
<rect x="30" y="200" width="300" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="46" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">3  Learn out of core</text>
<text x="46" y="244" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">stream batches into partial_fit</text>
<rect x="30" y="270" width="300" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="46" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">4  Leave one machine</text>
<text x="46" y="314" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">Dask, Spark, a GPU library</text>
<text x="370" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Data fits after a dtype or format change.</text>
<text x="370" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Data fits; training or search is too slow.</text>
<text x="370" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Data does not fit; the model has partial_fit.</text>
<text x="370" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Model needs all rows, or one pass is too long.</text>
<line x1="345" y1="88" x2="345" y2="298" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="352" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">more effort and more constraints on the model</text>
</svg>
