<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="pbtFlowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
<text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a source tree to an installed distribution</text>
<text x="490" y="48" font-size="12" fill="#666666" text-anchor="middle">The birdtally library, built by a frontend calling a backend, uploaded to an index and installed into an environment</text>

<!-- source tree -->
<rect x="20" y="70" width="170" height="300" fill="#f5f5f5" stroke="#555555"/>
<text x="105" y="92" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Source tree</text>
<text x="105" y="108" font-size="11" fill="#666666" text-anchor="middle">(a Git checkout)</text>
<text x="34" y="134" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally/</text>
<text x="44" y="152" font-size="11" fill="#333333" font-family="Courier New, monospace">pyproject.toml</text>
<text x="44" y="170" font-size="11" fill="#333333" font-family="Courier New, monospace">README.md</text>
<text x="44" y="188" font-size="11" fill="#333333" font-family="Courier New, monospace">LICENSE</text>
<text x="44" y="206" font-size="11" fill="#333333" font-family="Courier New, monospace">CHANGELOG.md</text>
<text x="44" y="224" font-size="11" fill="#333333" font-family="Courier New, monospace">src/birdtally/</text>
<text x="54" y="242" font-size="11" fill="#333333" font-family="Courier New, monospace">__init__.py</text>
<text x="54" y="260" font-size="11" fill="#333333" font-family="Courier New, monospace">tally.py cli.py</text>
<text x="54" y="278" font-size="11" fill="#333333" font-family="Courier New, monospace">py.typed</text>
<text x="44" y="296" font-size="11" fill="#333333" font-family="Courier New, monospace">tests/</text>
<text x="44" y="314" font-size="11" fill="#333333" font-family="Courier New, monospace">.git/ (not shipped)</text>
<text x="105" y="352" font-size="11" fill="#555555" text-anchor="middle">[build-system] names</text>
<text x="105" y="366" font-size="11" fill="#555555" text-anchor="middle">the backend (PEP 518)</text>

<!-- build step -->
<rect x="220" y="150" width="130" height="120" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="285" y="174" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Build</text>
<text x="285" y="194" font-size="11" fill="#333333" text-anchor="middle">frontend:</text>
<text x="285" y="210" font-size="11" fill="#333333" text-anchor="middle">pip, build, Poetry</text>
<text x="285" y="230" font-size="11" fill="#333333" text-anchor="middle">backend:</text>
<text x="285" y="246" font-size="11" fill="#333333" text-anchor="middle">hatchling, poetry-core</text>
<text x="285" y="262" font-size="10" fill="#666666" text-anchor="middle">PEP 517 hooks</text>
<line x1="190" y1="210" x2="218" y2="210" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>

<!-- sdist -->
<rect x="380" y="70" width="200" height="150" fill="#fff4e0" stroke="#a65e00"/>
<text x="480" y="92" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">sdist</text>
<text x="480" y="108" font-size="10" fill="#7a4500" text-anchor="middle" font-family="Courier New, monospace">birdtally-0.1.0.tar.gz</text>
<text x="392" y="130" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally-0.1.0/</text>
<text x="402" y="148" font-size="11" fill="#333333" font-family="Courier New, monospace">PKG-INFO</text>
<text x="402" y="166" font-size="11" fill="#333333" font-family="Courier New, monospace">pyproject.toml</text>
<text x="402" y="184" font-size="11" fill="#333333" font-family="Courier New, monospace">src/ tests/ README.md</text>
<text x="480" y="210" font-size="10" fill="#666666" text-anchor="middle">source + metadata; must be built again</text>

<!-- wheel -->
<rect x="380" y="240" width="200" height="190" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="480" y="262" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">wheel</text>
<text x="480" y="278" font-size="9" fill="#1b5e20" text-anchor="middle" font-family="Courier New, monospace">birdtally-0.1.0-py3-none-any.whl</text>
<text x="392" y="300" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally/*.py</text>
<text x="392" y="318" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally-0.1.0.dist-info/</text>
<text x="402" y="336" font-size="11" fill="#333333" font-family="Courier New, monospace">METADATA WHEEL</text>
<text x="402" y="354" font-size="11" fill="#333333" font-family="Courier New, monospace">entry_points.txt</text>
<text x="402" y="372" font-size="11" fill="#333333" font-family="Courier New, monospace">licenses/LICENSE</text>
<text x="402" y="390" font-size="11" fill="#333333" font-family="Courier New, monospace">RECORD</text>
<text x="480" y="418" font-size="10" fill="#666666" text-anchor="middle">ready to unpack; no build step</text>
<line x1="350" y1="190" x2="378" y2="150" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>
<line x1="350" y1="230" x2="378" y2="300" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>

<!-- index -->
<rect x="610" y="150" width="140" height="130" fill="#f3e5f5" stroke="#6a1b9a"/>
<text x="680" y="174" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">Index</text>
<text x="680" y="194" font-size="11" fill="#333333" text-anchor="middle">PyPI, TestPyPI,</text>
<text x="680" y="210" font-size="11" fill="#333333" text-anchor="middle">a private server</text>
<text x="680" y="232" font-size="10" fill="#666666" text-anchor="middle">simple API: PEP 503</text>
<text x="680" y="246" font-size="10" fill="#666666" text-anchor="middle">HTML, PEP 691 JSON,</text>
<text x="680" y="260" font-size="10" fill="#666666" text-anchor="middle">PEP 658 .metadata</text>
<line x1="580" y1="150" x2="608" y2="190" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>
<line x1="580" y1="320" x2="608" y2="250" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>
<text x="594" y="140" font-size="10" fill="#555555" text-anchor="middle">upload</text>

<!-- installed -->
<rect x="780" y="70" width="180" height="360" fill="#fffde7" stroke="#8d6e00"/>
<text x="870" y="92" font-size="13" font-weight="bold" fill="#5d4600" text-anchor="middle">Environment</text>
<text x="870" y="108" font-size="10" fill="#666666" text-anchor="middle">(a venv's site-packages)</text>
<text x="790" y="132" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally/</text>
<text x="790" y="150" font-size="11" fill="#333333" font-family="Courier New, monospace">birdtally-0.1.0</text>
<text x="800" y="166" font-size="11" fill="#333333" font-family="Courier New, monospace">.dist-info/</text>
<text x="800" y="184" font-size="11" fill="#333333" font-family="Courier New, monospace">METADATA</text>
<text x="800" y="202" font-size="11" fill="#333333" font-family="Courier New, monospace">RECORD</text>
<text x="800" y="220" font-size="11" fill="#333333" font-family="Courier New, monospace">INSTALLER</text>
<text x="800" y="238" font-size="11" fill="#333333" font-family="Courier New, monospace">REQUESTED</text>
<text x="800" y="256" font-size="11" fill="#333333" font-family="Courier New, monospace">direct_url.json</text>
<text x="800" y="274" font-size="11" fill="#333333" font-family="Courier New, monospace">entry_points.txt</text>
<text x="800" y="292" font-size="11" fill="#333333" font-family="Courier New, monospace">licenses/ sboms/</text>
<text x="790" y="318" font-size="11" fill="#333333" font-family="Courier New, monospace">bin/birdtally</text>
<text x="870" y="350" font-size="10" fill="#666666" text-anchor="middle">installer: pip or Poetry</text>
<text x="870" y="364" font-size="10" fill="#666666" text-anchor="middle">unpacks the wheel and</text>
<text x="870" y="378" font-size="10" fill="#666666" text-anchor="middle">writes RECORD, INSTALLER</text>
<text x="870" y="392" font-size="10" fill="#666666" text-anchor="middle">and the console script</text>
<line x1="750" y1="215" x2="778" y2="215" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtFlowArrow)"/>
<text x="764" y="205" font-size="10" fill="#555555" text-anchor="middle">install</text>

<!-- footer notes -->
<text x="490" y="470" font-size="11" fill="#444444" text-anchor="middle">An installer that only finds an sdist builds a wheel from it first (in an isolated build environment), then installs that wheel.</text>
<text x="490" y="490" font-size="11" fill="#444444" text-anchor="middle">Editable installs (PEP 660) skip the copy: the backend builds a small wheel that points back at the source tree.</text>
</svg>
