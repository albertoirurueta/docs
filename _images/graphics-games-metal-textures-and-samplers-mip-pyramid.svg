<text x="104.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">256x256</text>
<rect x="184.0" y="124.0" width="64.0" height="64.0" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="216.0" y="160.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="216.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">1</text>
<text x="216.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">128x128</text>
<rect x="264.0" y="156.0" width="32.0" height="32.0" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="280.0" y="176.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="280.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">2</text>
<text x="280.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">64x64</text>
<rect x="312.0" y="172.0" width="16.0" height="16.0" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="320.0" y="184.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="320.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">3</text>
<text x="320.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">32x32</text>
<rect x="344.0" y="180.0" width="8.0" height="8.0" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="348.0" y="188.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
