<text x="348.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">16x16</text>
<rect x="368.0" y="182" width="6" height="6" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="371.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="371.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">5</text>
<text x="371.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">8</text>
<rect x="390.0" y="182" width="6" height="6" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="393.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="393.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">6</text>
<text x="393.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">4</text>
<rect x="412.0" y="182" width="6" height="6" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="415.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="415.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">7</text>
<text x="415.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">2</text>
<rect x="434.0" y="182" width="6" height="6" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="437.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="437.0" y="208" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">8</text>
<text x="437.0" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">1</text>
<text x="380" y="250" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">level 0 is the source image; each level is the average of 2 x 2 texels of the previous one</text>
<text x="380" y="272" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">A full chain for 256 x 256 has 9 levels: levels = floor(log2(max(width, height))) + 1</text>
<text x="380" y="294" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Memory cost of the whole chain: 1 + 1/4 + 1/16 + ... = about 4/3 of level 0 (33 percent more)</text>
<text x="380" y="330" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">The GPU picks the level whose texel size is closest to one screen pixel</text>
</svg>
