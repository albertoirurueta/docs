<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Layers of the Bookshelf: engine, C++ base class, Blueprint subclass</text>
<rect x="40" y="56" width="400" height="84" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="240.0" y="87.2" text-anchor="middle" font-size="12" fill="#065F46">BP_Book (Blueprint subclass)</text>
<text x="240.0" y="102.2" text-anchor="middle" font-size="12" fill="#065F46">Designer data: mesh, CoverColor, BookTitle,</text>
<text x="240.0" y="117.2" text-anchor="middle" font-size="12" fill="#065F46">event-graph overrides, quick iteration</text>
<rect x="40" y="186" width="400" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240.0" y="217.7" text-anchor="middle" font-size="12" fill="#3730A3">ABookActor (C++ base class)</text>
<text x="240.0" y="232.7" text-anchor="middle" font-size="12" fill="#3730A3">UPROPERTY and UFUNCTION declarations,</text>
<text x="240.0" y="247.7" text-anchor="middle" font-size="12" fill="#3730A3">BlueprintNativeEvent defaults, performance-</text>
<text x="240.0" y="262.7" text-anchor="middle" font-size="12" fill="#3730A3">critical logic, replication, safe API</text>
<rect x="40" y="332" width="400" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240.0" y="356.2" text-anchor="middle" font-size="12" fill="#374151">AActor, UObject (engine)</text>
<text x="240.0" y="371.2" text-anchor="middle" font-size="12" fill="#374151">Reflection data generated by UnrealHeaderTool,</text>
<text x="240.0" y="386.2" text-anchor="middle" font-size="12" fill="#374151">garbage collection, Blueprint VM</text>
<line x1="90" y1="186" x2="90" y2="142" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="90" y1="332" x2="90" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="100" y="168" text-anchor="start" font-size="11" fill="#374151">inherits</text>
<text x="100" y="314" text-anchor="start" font-size="11" fill="#374151">inherits</text>
<line x1="250" y1="142" x2="250" y2="184" stroke="#047857" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="260" y="160" text-anchor="start" font-size="11" fill="#065F46" font-weight="bold">calls</text>
<line x1="390" y1="184" x2="390" y2="142" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="380" y="160" text-anchor="end" font-size="11" fill="#92400E" font-weight="bold">calls out</text>
<rect x="470" y="56" width="275" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="607" y="78" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Blueprint calls into C++</text>
<text x="607" y="100" text-anchor="middle" font-size="11" fill="#374151">BlueprintCallable and BlueprintPure</text>
<text x="607" y="115" text-anchor="middle" font-size="11" fill="#374151">functions appear as nodes.</text>
<text x="607" y="130" text-anchor="middle" font-size="11" fill="#374151">BlueprintReadWrite properties appear</text>
<text x="607" y="145" text-anchor="middle" font-size="11" fill="#374151">as Get and Set nodes.</text>
<rect x="470" y="226" width="275" height="176" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="607" y="248" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">C++ calls out to Blueprint</text>
<text x="607" y="270" text-anchor="middle" font-size="11" fill="#374151">BlueprintImplementableEvent: the</text>
<text x="607" y="285" text-anchor="middle" font-size="11" fill="#374151">Blueprint supplies the body.</text>
<text x="607" y="300" text-anchor="middle" font-size="11" fill="#374151">BlueprintNativeEvent: C++ supplies a</text>
<text x="607" y="315" text-anchor="middle" font-size="11" fill="#374151">default, the Blueprint may override it.</text>
<text x="607" y="330" text-anchor="middle" font-size="11" fill="#374151">Multicast delegates: Blueprint binds</text>
<text x="607" y="345" text-anchor="middle" font-size="11" fill="#374151">to them with BlueprintAssignable.</text>
</svg>
