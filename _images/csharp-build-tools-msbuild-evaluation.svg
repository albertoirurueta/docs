<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtEvalArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">MSBuild: six evaluation passes, then execution</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">Evaluation builds the in-memory project and runs nothing; execution runs targets and tasks</text>
<rect x="20" y="70" width="560" height="500" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="300" y="94" font-size="14" fill="#1d4a80" text-anchor="middle" font-weight="bold">Evaluation (once per project and set of global properties)</text>
<rect x="40" y="112" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="147" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">1</text>
<text x="90" y="136" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Environment variables</text>
<text x="90" y="155" font-size="11.5" fill="#444444" text-anchor="start">become properties: $(PATH), $(GITHUB_ACTIONS)</text>
<rect x="40" y="178" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="213" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">2</text>
<text x="90" y="202" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Imports and properties</text>
<text x="90" y="221" font-size="11.5" fill="#444444" text-anchor="start">in document order, imports expanded in place; only properties outside targets</text>
<rect x="40" y="244" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="279" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">3</text>
<text x="90" y="268" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Item definitions</text>
<text x="90" y="287" font-size="11.5" fill="#444444" text-anchor="start">ItemDefinitionGroup: default metadata</text>
<rect x="40" y="310" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="345" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">4</text>
<text x="90" y="334" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Items</text>
<text x="90" y="353" font-size="11.5" fill="#444444" text-anchor="start">items outside targets; they see the final property values</text>
<rect x="40" y="376" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="411" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">5</text>
<text x="90" y="400" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">UsingTask</text>
<text x="90" y="419" font-size="11.5" fill="#444444" text-anchor="start">tasks declared (assembly, factory, parameters)</text>
<rect x="40" y="442" width="520" height="56" rx="6" fill="#ffffff" stroke="#2f6db5"/>
<text x="62" y="477" font-size="22" fill="#2f6db5" text-anchor="middle" font-weight="bold">6</text>
<text x="90" y="466" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Targets</text>
<text x="90" y="485" font-size="11.5" fill="#444444" text-anchor="start">target objects created; nothing runs</text>
<rect x="620" y="70" width="360" height="500" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="800" y="94" font-size="14" fill="#1f5a2a" text-anchor="middle" font-weight="bold">Execution</text>
<text x="640" y="130" font-size="12.5" fill="#333333" text-anchor="start">InitialTargets, then the requested targets</text>
<text x="640" y="152" font-size="12.5" fill="#333333" text-anchor="start">(-t:, or DefaultTargets, or the first target)</text>
<text x="640" y="174" font-size="12.5" fill="#333333" text-anchor="start"></text>
<text x="640" y="196" font-size="12.5" fill="#333333" text-anchor="start">for each target: DependsOnTargets,</text>
<text x="640" y="218" font-size="12.5" fill="#333333" text-anchor="start">BeforeTargets, Inputs/Outputs check,</text>
<text x="640" y="240" font-size="12.5" fill="#333333" text-anchor="start">then the target itself, then AfterTargets</text>
<text x="640" y="262" font-size="12.5" fill="#333333" text-anchor="start"></text>
<text x="640" y="284" font-size="12.5" fill="#333333" text-anchor="start">properties and items inside targets are</text>
<text x="640" y="306" font-size="12.5" fill="#333333" text-anchor="start">evaluated as the target runs, in order</text>
<text x="640" y="328" font-size="12.5" fill="#333333" text-anchor="start"></text>
<text x="640" y="350" font-size="12.5" fill="#333333" text-anchor="start">tasks run: Csc, Copy, Exec, MSBuild, ...</text>
<text x="640" y="372" font-size="12.5" fill="#333333" text-anchor="start">and may create new properties and items</text>
<text x="640" y="394" font-size="12.5" fill="#333333" text-anchor="start"></text>
<text x="640" y="416" font-size="12.5" fill="#333333" text-anchor="start">project references build through the</text>
<text x="640" y="438" font-size="12.5" fill="#333333" text-anchor="start">MSBuild task (or the graph with -graph)</text>
<line x1="580" y1="320" x2="618" y2="320" stroke="#444444" stroke-width="2.5" marker-end="url(#cbtEvalArrow)"/>
<text x="800" y="540" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">-getProperty without -t: shows evaluated values</text>
</svg>
