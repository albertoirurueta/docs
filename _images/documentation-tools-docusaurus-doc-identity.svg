<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a Docusaurus doc file becomes an ID, a URL and a sidebar entry</title>
  <desc id="d">Three source files on the left are mapped to doc IDs and URLs in the middle, and to sidebar labels on the right.</desc>
  <rect width="760" height="330" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff">
    <text x="30" y="34" font-weight="bold">File under docs/</text>
    <text x="270" y="34" font-weight="bold">Doc ID and URL</text>
    <text x="530" y="34" font-weight="bold">Sidebar entry</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="50" width="220" height="70" rx="8" fill="#cfe3f7"/>
    <text x="32" y="74">guides/01-quickstart.md</text>
    <text x="32" y="94">sidebar_position: 1</text>
    <text x="32" y="110">sidebar_label: Quick start</text>

    <rect x="20" y="140" width="220" height="70" rx="8" fill="#cfe3f7"/>
    <text x="32" y="164">guides/02-length-units.md</text>
    <text x="32" y="184">id: length</text>
    <text x="32" y="200">slug: /units/length</text>

    <rect x="20" y="230" width="220" height="70" rx="8" fill="#cfe3f7"/>
    <text x="32" y="254">index.md</text>
    <text x="32" y="274">id: welcome</text>
    <text x="32" y="290">slug: /</text>

    <rect x="260" y="50" width="230" height="70" rx="8" fill="#f7e3b5"/>
    <text x="272" y="74">ID: guides/quickstart</text>
    <text x="272" y="94">URL: /guides/quickstart</text>
    <text x="272" y="110">(number prefix removed)</text>

    <rect x="260" y="140" width="230" height="70" rx="8" fill="#f7e3b5"/>
    <text x="272" y="164">ID: guides/length</text>
    <text x="272" y="184">URL: /units/length</text>
    <text x="272" y="200">(slug wins over the path)</text>

    <rect x="260" y="230" width="230" height="70" rx="8" fill="#f7e3b5"/>
    <text x="272" y="254">ID: welcome</text>
    <text x="272" y="274">URL: /</text>
    <text x="272" y="290">(docs-only mode)</text>

    <rect x="510" y="50" width="230" height="70" rx="8" fill="#cfeacb"/>
    <text x="522" y="80">Quick start, position 1</text>
    <text x="522" y="100">in category Guides</text>

    <rect x="510" y="140" width="230" height="70" rx="8" fill="#cfeacb"/>
    <text x="522" y="170">label from the title</text>
    <text x="522" y="190">(falls back to the ID)</text>

    <rect x="510" y="230" width="230" height="70" rx="8" fill="#cfeacb"/>
    <text x="522" y="260">label from the title,</text>
    <text x="522" y="280">Pocket Units</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M240 85 H260 M490 85 H510 M240 175 H260 M490 175 H510 M240 265 H260 M490 265 H510"/>
  </g>
</svg>
