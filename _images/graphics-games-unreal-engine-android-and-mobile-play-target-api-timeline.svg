<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Google Play target API deadlines against engine releases</text>
<line x1="40" y1="150" x2="720" y2="150" stroke="#4B5563" stroke-width="2"/>
<circle cx="110" cy="150" r="7" fill="#4F46E5" stroke="none" stroke-width="1"/>
<line x1="110" y1="143" x2="110" y2="118" stroke="#4F46E5" stroke-width="1.2"/>
<text x="110" y="106" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2025-08-31</text>
<text x="110" y="176" text-anchor="middle" font-size="11" fill="#374151">New apps and updates</text>
<text x="110" y="190" text-anchor="middle" font-size="11" fill="#374151">must target API 35</text>
<text x="110" y="204" text-anchor="middle" font-size="11" fill="#374151">UE 5.7 or newer to publish</text>
<circle cx="250" cy="150" r="7" fill="#4F46E5" stroke="none" stroke-width="1"/>
<line x1="250" y1="157" x2="250" y2="182" stroke="#4F46E5" stroke-width="1.2"/>
<text x="250" y="198" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2026-06-17</text>
<text x="250" y="216" text-anchor="middle" font-size="11" fill="#374151">UE 5.8 released</text>
<text x="250" y="230" text-anchor="middle" font-size="11" fill="#374151">multi-pass deferred</text>
<text x="250" y="244" text-anchor="middle" font-size="11" fill="#374151">mobile by default</text>
<circle cx="440" cy="150" r="7" fill="#B45309" stroke="none" stroke-width="1"/>
<line x1="440" y1="143" x2="440" y2="118" stroke="#B45309" stroke-width="1.2"/>
<text x="440" y="106" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2026-08-31</text>
<text x="440" y="176" text-anchor="middle" font-size="11" fill="#374151">New apps and updates</text>
<text x="440" y="190" text-anchor="middle" font-size="11" fill="#374151">must target API 36</text>
<text x="440" y="204" text-anchor="middle" font-size="11" fill="#374151">TV and XR: 34</text>
<circle cx="580" cy="150" r="7" fill="#B45309" stroke="none" stroke-width="1"/>
<line x1="580" y1="157" x2="580" y2="182" stroke="#B45309" stroke-width="1.2"/>
<text x="580" y="198" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2026-11-01</text>
<text x="580" y="216" text-anchor="middle" font-size="11" fill="#374151">Extension ends</text>
<text x="580" y="230" text-anchor="middle" font-size="11" fill="#374151">(if requested</text>
<text x="580" y="244" text-anchor="middle" font-size="11" fill="#374151">in Play Console)</text>
<circle cx="680" cy="150" r="7" fill="#047857" stroke="none" stroke-width="1"/>
<line x1="680" y1="143" x2="680" y2="118" stroke="#047857" stroke-width="1.2"/>
<text x="680" y="106" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">2026-11-05</text>
<text x="680" y="176" text-anchor="middle" font-size="11" fill="#374151">Checked</text>
<text x="680" y="190" text-anchor="middle" font-size="11" fill="#374151">for this page</text>
<rect x="40" y="252" width="680" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="273.2" text-anchor="middle" font-size="12" fill="#92400E">A project on UE 5.8 must raise its own target to API 36; the editor default is not guaranteed to do it</text>
</svg>
