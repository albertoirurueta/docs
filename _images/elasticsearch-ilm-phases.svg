<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One index through the ILM phases</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">A phase begins once the index is older than its min_age; phases you do not define are skipped</text>

  <!-- HOT -->
  <g>
    <rect x="20" y="66" width="124" height="242" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="20" y="66" width="124" height="22" fill="#2f5424"/>
    <text x="82" y="81" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HOT</text>
    <text x="82" y="104" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">data_hot</text>
    <text x="82" y="121" font-size="9.5" fill="#999999" text-anchor="middle">written + queried</text>
    <line x1="30" y1="130" x2="134" y2="130" stroke="#cccccc" stroke-width="1"/>
    <g font-family="'Courier New', monospace" font-size="9" fill="#222222">
      <text x="27" y="149">rollover</text>
      <text x="27" y="165">set_priority</text>
    </g>
    <text x="82" y="296" font-size="9.5" fill="#666666" text-anchor="middle">trigger: rollover</text>
  </g>

  <!-- WARM -->
  <g>
    <rect x="169" y="66" width="124" height="242" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="169" y="66" width="124" height="22" fill="#1c4b73"/>
    <text x="231" y="81" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">WARM</text>
    <text x="231" y="104" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">data_warm</text>
    <text x="231" y="121" font-size="9.5" fill="#999999" text-anchor="middle">queried, no writes</text>
    <line x1="179" y1="130" x2="283" y2="130" stroke="#cccccc" stroke-width="1"/>
    <g font-family="'Courier New', monospace" font-size="9" fill="#222222">
      <text x="176" y="149">set_priority</text>
      <text x="176" y="165">readonly</text>
      <text x="176" y="181">allocate</text>
      <text x="176" y="197">shrink</text>
      <text x="176" y="213">forcemerge</text>
    </g>
    <text x="231" y="296" font-size="9.5" fill="#666666" text-anchor="middle">min_age: 7d</text>
  </g>

  <!-- COLD -->
  <g>
    <rect x="318" y="66" width="124" height="242" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="318" y="66" width="124" height="22" fill="#1c4b73"/>
    <text x="380" y="81" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">COLD</text>
    <text x="380" y="104" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">data_cold</text>
    <text x="380" y="121" font-size="9.5" fill="#999999" text-anchor="middle">rarely queried</text>
    <line x1="328" y1="130" x2="432" y2="130" stroke="#cccccc" stroke-width="1"/>
    <g font-family="'Courier New', monospace" font-size="9" fill="#222222">
      <text x="325" y="149">set_priority</text>
      <text x="325" y="165">readonly</text>
      <text x="325" y="181">allocate</text>
      <text x="325" y="197">searchable_</text>
      <text x="325" y="209">snapshot</text>
    </g>
    <text x="380" y="296" font-size="9.5" fill="#666666" text-anchor="middle">min_age: 30d</text>
  </g>

  <!-- FROZEN -->
  <g>
    <rect x="467" y="66" width="124" height="242" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="467" y="66" width="124" height="22" fill="#1c4b73"/>
    <text x="529" y="81" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FROZEN</text>
    <text x="529" y="104" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">data_frozen</text>
    <text x="529" y="121" font-size="9.5" fill="#999999" text-anchor="middle">occasional access</text>
    <line x1="477" y1="130" x2="581" y2="130" stroke="#cccccc" stroke-width="1"/>
    <g font-family="'Courier New', monospace" font-size="9" fill="#222222">
      <text x="474" y="149">searchable_</text>
      <text x="474" y="161">snapshot</text>
    </g>
    <text x="474" y="185" font-size="9" fill="#999999">shared-cache mount;</text>
    <text x="474" y="197" font-size="9" fill="#999999">little local disk</text>
    <text x="529" y="296" font-size="9.5" fill="#666666" text-anchor="middle">min_age: 90d</text>
  </g>

  <!-- DELETE -->
  <g>
    <rect x="616" y="66" width="124" height="242" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="616" y="66" width="124" height="22" fill="#999999"/>
    <text x="678" y="81" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DELETE</text>
    <text x="678" y="104" font-size="10" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">&#8212;</text>
    <text x="678" y="121" font-size="9.5" fill="#999999" text-anchor="middle">end of retention</text>
    <line x1="626" y1="130" x2="730" y2="130" stroke="#cccccc" stroke-width="1"/>
    <g font-family="'Courier New', monospace" font-size="9" fill="#222222">
      <text x="623" y="149">wait_for_</text>
      <text x="623" y="161">snapshot</text>
      <text x="623" y="181">delete</text>
    </g>
    <text x="678" y="296" font-size="9.5" fill="#666666" text-anchor="middle">min_age: 365d</text>
  </g>

  <!-- arrows between phases -->
  <g fill="#666666">
    <polygon points="148,181 160,181 160,177 168,185 160,193 160,189 148,189"/>
    <polygon points="297,181 309,181 309,177 317,185 309,193 309,189 297,189"/>
    <polygon points="446,181 458,181 458,177 466,185 458,193 458,189 446,189"/>
    <polygon points="595,181 607,181 607,177 615,185 607,193 607,189 595,189"/>
  </g>

  <!-- time axis -->
  <line x1="20" y1="326" x2="726" y2="326" stroke="#999999" stroke-width="1.4"/>
  <polygon points="726,320 740,326 726,332" fill="#999999"/>
  <text x="20" y="348" font-size="10.5" fill="#444444">index age since rollover &#8212; a single policy moves the index rightward; a hot-only policy stops after phase one</text>
</svg>
