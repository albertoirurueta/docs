<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="740" height="330" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Plugin or widget: who sees it and who can use it</text>

  <rect x="20" y="48" width="340" height="262" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="190" y="74" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Plugin</text>
  <rect x="40" y="90" width="300" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="52" y="102" width="70" height="86" rx="4" fill="#E5E7EB"/>
  <rect x="132" y="102" width="196" height="12" rx="3" fill="#E5E7EB"/>
  <rect x="132" y="122" width="150" height="12" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="150" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="255" y="170" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Bookshelf audit</text>
  <text x="190" y="214" font-size="12" fill="#374151" text-anchor="middle">Runs for one person, started by hand</text>
  <text x="190" y="234" font-size="12" fill="#374151" text-anchor="middle">Only that person sees the plugin window</text>
  <text x="190" y="254" font-size="12" fill="#374151" text-anchor="middle">One plugin at a time, not in the background</text>
  <text x="190" y="274" font-size="12" fill="#374151" text-anchor="middle">Needs edit access to the file</text>
  <text x="190" y="296" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Changes land in the file as normal edits</text>

  <rect x="380" y="48" width="340" height="262" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="550" y="74" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Widget</text>
  <rect x="400" y="90" width="300" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="440" y="104" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="550" y="130" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Reading progress</text>
  <rect x="460" y="142" width="180" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="460" y="142" width="108" height="10" rx="5" fill="#B45309"/>
  <text x="550" y="170" font-size="12" fill="#374151" text-anchor="middle">3 of 5 books read</text>
  <text x="550" y="214" font-size="12" fill="#374151" text-anchor="middle">An object that lives on the canvas or board</text>
  <text x="550" y="234" font-size="12" fill="#374151" text-anchor="middle">Everyone in the file sees the same widget</text>
  <text x="550" y="254" font-size="12" fill="#374151" text-anchor="middle">Interacting with it needs edit access</text>
  <text x="550" y="274" font-size="12" fill="#374151" text-anchor="middle">Can be moved like any other object</text>
  <text x="550" y="296" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Good for shared, collaborative state</text>

  <line x1="364" y1="180" x2="376" y2="180" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
</svg>
