<svg viewBox="0 0 760 480" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">GLSurfaceView vs. TextureView / GLTextureView</text>

  <!-- Column headers -->
  <rect x="30" y="46" width="330" height="34" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a3a6b">GLSurfaceView</text>
  <rect x="400" y="46" width="330" height="34" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d4c22">TextureView / GLTextureView</text>

  <!-- GLSurfaceView column -->
  <rect x="30" y="94" width="330" height="60" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Own opaque Surface</text>
  <text x="195" y="134" text-anchor="middle" font-size="11" fill="#3c4043">composited by SurfaceFlinger,</text>
  <text x="195" y="149" text-anchor="middle" font-size="11" fill="#3c4043">outside the View hierarchy's own layer</text>

  <rect x="30" y="166" width="330" height="60" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="195" y="188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">No alpha, rotation, scale or</text>
  <text x="195" y="204" text-anchor="middle" font-size="11" fill="#3c4043">translation animation --</text>
  <text x="195" y="219" text-anchor="middle" font-size="11" fill="#3c4043">opaque; sits behind its window by default</text>

  <rect x="30" y="238" width="330" height="50" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Lowest overhead</text>
  <text x="195" y="275" text-anchor="middle" font-size="11" fill="#3c4043">no extra copy/composition step</text>

  <rect x="30" y="300" width="330" height="60" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="322" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Dedicated GL thread</text>
  <text x="195" y="339" text-anchor="middle" font-size="11" fill="#3c4043">Renderer callbacks run off the</text>
  <text x="195" y="354" text-anchor="middle" font-size="11" fill="#3c4043">main thread; view calls are one-way</text>

  <rect x="30" y="372" width="330" height="50" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="195" y="392" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Best fit: full-screen or fixed-region</text>
  <text x="195" y="409" text-anchor="middle" font-size="11" fill="#3c4043">GL content (games, camera preview)</text>

  <!-- TextureView column -->
  <rect x="400" y="94" width="330" height="60" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Regular part of the View hierarchy</text>
  <text x="565" y="134" text-anchor="middle" font-size="11" fill="#3c4043">renders into a SurfaceTexture drawn</text>
  <text x="565" y="149" text-anchor="middle" font-size="11" fill="#3c4043">as a texture in the normal draw pass</text>

  <rect x="400" y="166" width="330" height="60" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Full View transform support --</text>
  <text x="565" y="204" text-anchor="middle" font-size="11" fill="#3c4043">alpha, rotation, scale, translation,</text>
  <text x="565" y="219" text-anchor="middle" font-size="11" fill="#3c4043">ViewPropertyAnimator all apply</text>

  <rect x="400" y="238" width="330" height="50" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="565" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Higher overhead</text>
  <text x="565" y="275" text-anchor="middle" font-size="11" fill="#3c4043">an extra texture copy per frame</text>

  <rect x="400" y="300" width="330" height="60" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="320" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Plain TextureView: no render thread</text>
  <text x="565" y="337" text-anchor="middle" font-size="11" fill="#3c4043">GLTextureView adds back a</text>
  <text x="565" y="352" text-anchor="middle" font-size="11" fill="#3c4043">GLSurfaceView-style GL thread/API</text>

  <rect x="400" y="372" width="330" height="50" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="565" y="392" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Best fit: GL content embedded among</text>
  <text x="565" y="409" text-anchor="middle" font-size="11" fill="#3c4043">other views, animated or transparent</text>

  <text x="380" y="450" text-anchor="middle" font-size="11.5" fill="#5f6368">Same GLSurfaceView.Renderer contract in both -- only the host View and its compositing behavior differ</text>
</svg>
