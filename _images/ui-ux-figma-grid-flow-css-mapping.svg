<text x="190" y="68" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Figma grid flow</text><text x="550" y="68" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CSS Grid</text>
<g stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"><line x1="362" y1="106" x2="378" y2="106"/><line x1="362" y1="140" x2="378" y2="140"/><line x1="362" y1="174" x2="378" y2="174"/><line x1="362" y1="208" x2="378" y2="208"/><line x1="362" y1="242" x2="378" y2="242"/><line x1="362" y1="276" x2="378" y2="276"/></g>
