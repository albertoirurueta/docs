<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the Bookshelf application built with Jakarta Faces</title>
  <desc id="d">The browser sends initial GET requests, postbacks, Ajax partial requests from faces.js and opens a WebSocket channel. Inside a Jakarta EE runtime or a servlet container with CDI, Jakarta Security checks the request, the FacesServlet runs the six-phase lifecycle, Facelets views build the component tree, EL binds components to CDI backing beans, the beans call transactional services that use Jakarta Persistence and the database, and a PushContext sends new-review notifications to the browser. PrimeFaces and OmniFaces add components and utilities. The same WAR runs on Jakarta EE servers, Tomcat with Weld, Spring Boot with JoinFaces and Quarkus.</desc>
  <defs>
    <marker id="ar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a4f8b"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4530a"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3d9a"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b34"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf application on Jakarta Faces 4.1</text>
  <text x="550" y="48" font-size="12" fill="#666666" text-anchor="middle">One Maven WAR: Facelets views, CDI backing beans, services and persistence, plus Ajax and WebSocket push</text>

  <!-- Browser -->
  <rect x="24" y="80" width="176" height="470" rx="8" fill="#f3f3f3" stroke="#555555" stroke-width="1.6"/>
  <text x="112" y="106" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="38" y="138" font-size="11.5" fill="#333333">GET /books.xhtml</text>
  <text x="38" y="153" font-size="10.5" fill="#666666">initial request, view params</text>
  <text x="38" y="180" font-size="11.5" fill="#333333">POST postback</text>
  <text x="38" y="195" font-size="10.5" fill="#666666">h:form + view state</text>
  <text x="38" y="222" font-size="11.5" fill="#333333">Ajax partial request</text>
  <text x="38" y="237" font-size="10.5" fill="#666666">faces.js, f:ajax, p:ajax</text>
  <text x="38" y="290" font-size="11.5" fill="#333333">HTML page or</text>
  <text x="38" y="305" font-size="11.5" fill="#333333">partial-response XML</text>
  <text x="38" y="320" font-size="10.5" fill="#666666">rendered in phase 6</text>
  <text x="38" y="392" font-size="11.5" fill="#333333">WebSocket channel</text>
  <text x="38" y="407" font-size="10.5" fill="#666666">f:websocket "reviews"</text>
  <text x="38" y="470" font-size="11.5" fill="#333333">Static resources</text>
  <text x="38" y="485" font-size="10.5" fill="#666666">CSS, JS, cover images</text>
  <text x="38" y="500" font-size="10.5" fill="#666666">via ResourceHandler</text>

  <!-- Container -->
  <rect x="236" y="70" width="844" height="490" rx="10" fill="#fbfbfb" stroke="#888888" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="252" y="90" font-size="12" font-weight="bold" fill="#555555">Jakarta EE runtime, or a servlet container with CDI (Weld)</text>

  <!-- Row A -->
  <rect x="256" y="104" width="180" height="70" rx="6" fill="#fde8e7" stroke="#a12622" stroke-width="1.6"/>
  <text x="346" y="128" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Jakarta Security</text>
  <text x="346" y="146" font-size="11" fill="#444444" text-anchor="middle">form login, roles</text>
  <text x="346" y="161" font-size="11" fill="#444444" text-anchor="middle">READER, LIBRARIAN</text>
  <rect x="466" y="104" width="150" height="70" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="541" y="132" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">FacesServlet</text>
  <text x="541" y="152" font-size="11" fill="#444444" text-anchor="middle">mapped to *.xhtml</text>
  <rect x="646" y="104" width="414" height="70" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="853" y="122" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Request processing lifecycle</text>
  <rect x="656" y="132" width="62" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="687" y="146" font-size="9.5" fill="#222222" text-anchor="middle">1 Restore</text>
  <text x="687" y="158" font-size="8.5" fill="#222222" text-anchor="middle">View</text>
  <rect x="724" y="132" width="62" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="755" y="146" font-size="9.5" fill="#222222" text-anchor="middle">2 Apply</text>
  <text x="755" y="158" font-size="8.5" fill="#222222" text-anchor="middle">Request Values</text>
  <rect x="792" y="132" width="62" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="823" y="146" font-size="9.5" fill="#222222" text-anchor="middle">3 Process</text>
  <text x="823" y="158" font-size="8.5" fill="#222222" text-anchor="middle">Validations</text>
  <rect x="860" y="132" width="62" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="891" y="146" font-size="9.5" fill="#222222" text-anchor="middle">4 Update</text>
  <text x="891" y="158" font-size="8.5" fill="#222222" text-anchor="middle">Model Values</text>
  <rect x="928" y="132" width="62" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="959" y="146" font-size="9.5" fill="#222222" text-anchor="middle">5 Invoke</text>
  <text x="959" y="158" font-size="8.5" fill="#222222" text-anchor="middle">Application</text>
  <rect x="996" y="132" width="56" height="32" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="1024" y="146" font-size="9.5" fill="#222222" text-anchor="middle">6 Render</text>
  <text x="1024" y="158" font-size="8.5" fill="#222222" text-anchor="middle">Response</text>

  <!-- Row B -->
  <rect x="256" y="214" width="250" height="126" rx="6" fill="#fff4e0" stroke="#b4530a" stroke-width="1.6"/>
  <text x="381" y="238" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Facelets views (XHTML)</text>
  <text x="270" y="260" font-size="11" fill="#444444">templates: ui:composition, ui:define</text>
  <text x="270" y="278" font-size="11" fill="#444444">composite component: star rating</text>
  <text x="270" y="296" font-size="11" fill="#444444">resource library contracts</text>
  <text x="270" y="314" font-size="11" fill="#444444">message bundles: English, Spanish</text>
  <text x="270" y="332" font-size="11" fill="#444444">faces flow: borrow-request wizard</text>
  <rect x="536" y="214" width="230" height="126" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="651" y="238" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Component tree</text>
  <text x="550" y="260" font-size="11" fill="#444444">UIViewRoot with h:, f: and p:</text>
  <text x="550" y="278" font-size="11" fill="#444444">components and renderers</text>
  <text x="550" y="296" font-size="11" fill="#444444">converters, validators,</text>
  <text x="550" y="314" font-size="11" fill="#444444">Bean Validation, messages</text>
  <text x="550" y="332" font-size="11" fill="#444444">view state saved per view</text>
  <rect x="796" y="214" width="264" height="126" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="928" y="238" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">CDI backing beans</text>
  <text x="810" y="260" font-size="11" fill="#444444">@Named + @RequestScoped, @ViewScoped,</text>
  <text x="810" y="278" font-size="11" fill="#444444">@FlowScoped, @SessionScoped</text>
  <text x="810" y="296" font-size="11" fill="#444444">CatalogueBean, review form,</text>
  <text x="810" y="314" font-size="11" fill="#444444">borrow flow, locale switcher</text>
  <text x="810" y="332" font-size="11" fill="#444444">actions return navigation outcomes</text>

  <!-- Row C -->
  <rect x="256" y="380" width="250" height="70" rx="6" fill="#f1e8fb" stroke="#6a3d9a" stroke-width="1.6"/>
  <text x="381" y="404" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">WebSocket push</text>
  <text x="381" y="422" font-size="11" fill="#444444" text-anchor="middle">@Push PushContext on channel</text>
  <text x="381" y="438" font-size="11" fill="#444444" text-anchor="middle">"reviews": a new review arrived</text>
  <rect x="536" y="380" width="230" height="70" rx="6" fill="#eef1f4" stroke="#44546a" stroke-width="1.6"/>
  <text x="651" y="404" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Jakarta Persistence</text>
  <text x="651" y="422" font-size="11" fill="#444444" text-anchor="middle">entities Book, Author, Review</text>
  <text x="651" y="438" font-size="11" fill="#444444" text-anchor="middle">paged queries for the lazy table</text>
  <rect x="796" y="380" width="264" height="70" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="928" y="404" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Services</text>
  <text x="928" y="422" font-size="11" fill="#444444" text-anchor="middle">BookService, review and loan services</text>
  <text x="928" y="438" font-size="11" fill="#444444" text-anchor="middle">@Transactional, CDI events</text>

  <!-- Row D -->
  <rect x="256" y="486" width="250" height="60" rx="6" fill="#fff4e0" stroke="#b4530a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="381" y="510" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Component libraries</text>
  <text x="381" y="528" font-size="11" fill="#444444" text-anchor="middle">PrimeFaces 16, Extensions, OmniFaces 5</text>
  <path d="M556,496 L556,536 A95,10 0 0 0 746,536 L746,496" fill="#eef1f4" stroke="#44546a" stroke-width="1.6"/>
  <ellipse cx="651" cy="496" rx="95" ry="10" fill="#eef1f4" stroke="#44546a" stroke-width="1.6"/>
  <text x="651" y="528" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Database</text>

  <!-- Arrows -->
  <line x1="200" y1="145" x2="254" y2="145" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <line x1="200" y1="188" x2="226" y2="188" stroke="#333333" stroke-width="2"/>
  <line x1="226" y1="188" x2="226" y2="150" stroke="#333333" stroke-width="2"/>
  <line x1="200" y1="230" x2="226" y2="230" stroke="#333333" stroke-width="2"/>
  <line x1="226" y1="230" x2="226" y2="188" stroke="#333333" stroke-width="2"/>
  <line x1="436" y1="139" x2="464" y2="139" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <line x1="616" y1="139" x2="644" y2="139" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <line x1="687" y1="174" x2="687" y2="212" stroke="#1a4f8b" stroke-width="2" marker-end="url(#ar-b)"/>
  <text x="694" y="198" font-size="10" fill="#1a4f8b">builds / restores</text>
  <line x1="506" y1="277" x2="534" y2="277" stroke="#b4530a" stroke-width="2" marker-end="url(#ar-o)"/>
  <line x1="766" y1="262" x2="794" y2="262" stroke="#1e6b34" stroke-width="2" marker-end="url(#ar-g)"/>
  <line x1="796" y1="300" x2="768" y2="300" stroke="#1e6b34" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="781" y="290" font-size="10" font-weight="bold" fill="#1e6b34" text-anchor="middle">EL</text>
  <line x1="928" y1="340" x2="928" y2="378" stroke="#1e6b34" stroke-width="2" marker-end="url(#ar-g)"/>
  <line x1="796" y1="415" x2="768" y2="415" stroke="#44546a" stroke-width="2" marker-end="url(#ar-k)"/>
  <line x1="651" y1="450" x2="651" y2="484" stroke="#44546a" stroke-width="2" marker-end="url(#ar-k)"/>
  <polyline points="1010,450 1010,466 381,466 381,452" fill="none" stroke="#6a3d9a" stroke-width="2" marker-end="url(#ar-p)"/>
  <text x="790" y="478" font-size="10" fill="#6a3d9a">CDI event: review added</text>
  <line x1="256" y1="400" x2="202" y2="400" stroke="#6a3d9a" stroke-width="2" marker-end="url(#ar-p)"/>
  <line x1="256" y1="300" x2="202" y2="300" stroke="#1a4f8b" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Runtimes strip -->
  <rect x="24" y="584" width="1056" height="76" rx="8" fill="#f7f7f7" stroke="#888888" stroke-width="1.2"/>
  <text x="44" y="608" font-size="12.5" font-weight="bold" fill="#222222">The same application runs on</text>
  <rect x="44" y="620" width="300" height="28" rx="5" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="194" y="639" font-size="11" fill="#222222" text-anchor="middle">WildFly, GlassFish, Payara, Open Liberty, TomEE</text>
  <rect x="356" y="620" width="200" height="28" rx="5" fill="#ffffff" stroke="#1e6b34"/>
  <text x="456" y="639" font-size="11" fill="#222222" text-anchor="middle">Tomcat 11 + Weld 6</text>
  <rect x="568" y="620" width="250" height="28" rx="5" fill="#ffffff" stroke="#b4530a"/>
  <text x="693" y="639" font-size="11" fill="#222222" text-anchor="middle">Spring Boot 4.1 + JoinFaces 6.1</text>
  <rect x="830" y="620" width="230" height="28" rx="5" fill="#ffffff" stroke="#6a3d9a"/>
  <text x="945" y="639" font-size="11" fill="#222222" text-anchor="middle">Quarkus + myfaces-quarkus</text>
</svg>
