<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img"
     aria-label="Two window mockups compare TrailMate's list-detail layout at a compact and an expanded window size class. On the left, a narrow phone-shaped window (compact width, less than 600dp) shows a single pane: a trail list with a title bar reading TrailMate and three trail rows, one of them selected. A curved arrow labeled tap a trail points from the selected row toward the right, and a caption below reads Compact: TrailListScreen only, TrailDetailScreen pushed on top of the back stack, single-pane NavDisplay or NavHost. On the right, a wide tablet-or-desktop-shaped window (expanded width, 840dp or more) is divided into two side-by-side panes separated by a vertical divider, matching ListDetailPaneScaffold's list and detail roles. The left, narrower pane repeats the same trail list with the same row selected and highlighted. The right, wider pane shows a trail detail view with a placeholder photo rectangle, a trail name heading, a difficulty and length line, and a favorite button. A caption below reads Expanded: ListDetailPaneScaffold shows TrailListScreen and TrailDetailScreen side by side, no back-stack push needed. A small legend at the bottom explains that the blue-highlighted row is the current selection and stays highlighted in both layouts, and that the same TrailListScreen and TrailDetailScreen composables are reused unchanged in both window sizes, only their arrangement on screen changes.">
  <rect width="760" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="16" font-weight="700" fill="#1a1a1a">TrailMate: compact vs. expanded window size class</text>

  <!-- ===================== Compact window (left) ===================== -->
  <g>
    <text x="150" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600"
          fill="#333333">Compact width (&lt; 600dp) -- phone</text>

    <!-- phone frame -->
    <rect x="60" y="60" width="180" height="260" rx="14" fill="#f5f5f7" stroke="#8a8a8a" stroke-width="2"/>

    <!-- app bar -->
    <rect x="68" y="68" width="164" height="28" rx="4" fill="#3f6b46"/>
    <text x="150" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="600" fill="#ffffff">TrailMate</text>

    <!-- trail rows -->
    <g font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">
      <rect x="68" y="104" width="164" height="34" fill="#dbe7dd" stroke="#3f6b46" stroke-width="1.5"/>
      <text x="76" y="118" font-weight="600">Rocky Ridge</text>
      <text x="76" y="131" fill="#555555" font-size="10">Moderate -- 8.2 km</text>

      <rect x="68" y="140" width="164" height="34" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      <text x="76" y="154">Blue Lake Loop</text>
      <text x="76" y="167" fill="#555555" font-size="10">Easy -- 4.5 km</text>

      <rect x="68" y="176" width="164" height="34" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      <text x="76" y="190">Summit Trail</text>
      <text x="76" y="203" fill="#555555" font-size="10">Hard -- 14.0 km</text>
    </g>

    <!-- arrow to detail (off-screen, pushed) -->
    <path d="M 232 121 C 260 121, 260 250, 300 300" fill="none" stroke="#8a4b1f" stroke-width="2"
          marker-end="url(#arrowHead)"/>
    <text x="330" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#8a4b1f" font-weight="600">tap a trail --&gt;</text>
    <text x="330" y="269" font-family="system-ui, sans-serif" font-size="11" fill="#8a4b1f">pushes TrailDetail</text>

    <text x="150" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#333333">
      <tspan x="150" dy="0">Single pane: TrailListScreen only.</tspan>
      <tspan x="150" dy="14">Selecting a trail pushes TrailDetailScreen</tspan>
      <tspan x="150" dy="14">onto the back stack (single-pane NavDisplay/NavHost).</tspan>
    </text>
  </g>

  <!-- ===================== Expanded window (right) ===================== -->
  <g>
    <text x="565" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600"
          fill="#333333">Expanded width (&#8805; 840dp) -- tablet / foldable / desktop</text>

    <!-- outer frame -->
    <rect x="380" y="60" width="370" height="260" rx="10" fill="#f5f5f7" stroke="#8a8a8a" stroke-width="2"/>

    <!-- app bar -->
    <rect x="388" y="68" width="354" height="28" rx="4" fill="#3f6b46"/>
    <text x="565" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="600" fill="#ffffff">TrailMate</text>

    <!-- list pane -->
    <g font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">
      <rect x="388" y="104" width="140" height="208" fill="#fbfbfb" stroke="#d0d0d0" stroke-width="1"/>

      <rect x="392" y="108" width="132" height="34" fill="#dbe7dd" stroke="#3f6b46" stroke-width="1.5"/>
      <text x="398" y="122" font-weight="600">Rocky Ridge</text>
      <text x="398" y="135" fill="#555555" font-size="10">Moderate -- 8.2 km</text>

      <rect x="392" y="144" width="132" height="34" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      <text x="398" y="158">Blue Lake Loop</text>
      <text x="398" y="171" fill="#555555" font-size="10">Easy -- 4.5 km</text>

      <rect x="392" y="180" width="132" height="34" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      <text x="398" y="194">Summit Trail</text>
      <text x="398" y="207" fill="#555555" font-size="10">Hard -- 14.0 km</text>
    </g>

    <!-- divider between panes -->
    <line x1="534" y1="104" x2="534" y2="312" stroke="#8a8a8a" stroke-width="2"/>

    <!-- detail pane -->
    <g font-family="system-ui, sans-serif" fill="#1a1a1a">
      <rect x="540" y="104" width="202" height="208" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      <rect x="552" y="114" width="178" height="70" rx="4" fill="#c7d9cb" stroke="#3f6b46" stroke-width="1"/>
      <text x="641" y="153" text-anchor="middle" font-size="10" fill="#3f6b46">(trail photo)</text>

      <text x="552" y="202" font-size="14" font-weight="700">Rocky Ridge</text>
      <text x="552" y="220" font-size="11" fill="#555555">Moderate -- 8.2 km</text>

      <rect x="552" y="232" width="110" height="22" rx="11" fill="#3f6b46"/>
      <text x="607" y="247" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">&#9733; Favorite</text>
    </g>

    <text x="565" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#333333">
      <tspan x="565" dy="0">Two panes: ListDetailPaneScaffold shows</tspan>
      <tspan x="565" dy="14">TrailListScreen and TrailDetailScreen side by side --</tspan>
      <tspan x="565" dy="14">selecting a trail updates the detail pane, no push needed.</tspan>
    </text>
  </g>

  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a4b1f"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="10" y="360" width="14" height="10" fill="#dbe7dd" stroke="#3f6b46"/>
  <text x="28" y="369" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Selected trail (same selection, same composables, both window sizes)</text>
</svg>
