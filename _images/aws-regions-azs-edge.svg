<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AWS footprint: Region, Availability Zones, data centers and edge locations</text>

  <!-- Region -->
  <rect x="20" y="44" width="600" height="410" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="40" y="68" font-size="14" font-weight="700" fill="#3c4a58">Region (for example us-east-1) - isolated from other Regions</text>

  <!-- AZ 1 -->
  <rect x="40" y="86" width="170" height="270" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="125" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone A</text>
  <rect x="58" y="122" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="125" y="146" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <rect x="58" y="172" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="125" y="196" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <text x="125" y="244" text-anchor="middle" font-size="10" fill="#3c4a58">independent power,</text>
  <text x="125" y="258" text-anchor="middle" font-size="10" fill="#3c4a58">cooling and networking</text>
  <text x="125" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#123a72">Subnet A</text>

  <!-- AZ 2 -->
  <rect x="225" y="86" width="170" height="270" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="310" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone B</text>
  <rect x="243" y="122" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="310" y="146" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <rect x="243" y="172" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="310" y="196" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <text x="310" y="244" text-anchor="middle" font-size="10" fill="#3c4a58">independent power,</text>
  <text x="310" y="258" text-anchor="middle" font-size="10" fill="#3c4a58">cooling and networking</text>
  <text x="310" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#123a72">Subnet B</text>

  <!-- AZ 3 -->
  <rect x="410" y="86" width="170" height="270" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="495" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone C</text>
  <rect x="428" y="122" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="495" y="146" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <rect x="428" y="172" width="134" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="495" y="196" text-anchor="middle" font-size="11" fill="#123a72">Data center</text>
  <text x="495" y="244" text-anchor="middle" font-size="10" fill="#3c4a58">independent power,</text>
  <text x="495" y="258" text-anchor="middle" font-size="10" fill="#3c4a58">cooling and networking</text>
  <text x="495" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#123a72">Subnet C</text>

  <!-- inter-AZ link -->
  <rect x="40" y="372" width="540" height="34" rx="6" fill="#fff4dc" stroke="#b7791f"/>
  <text x="310" y="394" text-anchor="middle" font-size="12" fill="#6b4a0f">High-bandwidth, low-latency private links between AZs (synchronous replication)</text>
  <text x="310" y="434" text-anchor="middle" font-size="11.5" fill="#3c4a58">A VPC spans all AZs of one Region; each subnet lives in exactly one AZ</text>

  <!-- Edge -->
  <rect x="660" y="44" width="220" height="410" rx="12" fill="#eef7ee" stroke="#2f7d32" stroke-width="2"/>
  <text x="770" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5a21">Edge and extended</text>
  <rect x="680" y="86" width="180" height="62" rx="6" fill="#ffffff" stroke="#2f7d32"/>
  <text x="770" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5a21">Edge locations</text>
  <text x="770" y="124" text-anchor="middle" font-size="10" fill="#3c4a58">CloudFront, Route 53,</text>
  <text x="770" y="137" text-anchor="middle" font-size="10" fill="#3c4a58">Global Accelerator</text>
  <rect x="680" y="160" width="180" height="62" rx="6" fill="#ffffff" stroke="#2f7d32"/>
  <text x="770" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5a21">Local Zones</text>
  <text x="770" y="198" text-anchor="middle" font-size="10" fill="#3c4a58">Extension of a parent Region</text>
  <text x="770" y="211" text-anchor="middle" font-size="10" fill="#3c4a58">near a large city</text>
  <rect x="680" y="234" width="180" height="62" rx="6" fill="#ffffff" stroke="#2f7d32"/>
  <text x="770" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5a21">Wavelength Zones</text>
  <text x="770" y="272" text-anchor="middle" font-size="10" fill="#3c4a58">Inside 5G carrier networks</text>
  <text x="770" y="285" text-anchor="middle" font-size="10" fill="#3c4a58">for ultra-low latency</text>
  <rect x="680" y="308" width="180" height="62" rx="6" fill="#ffffff" stroke="#2f7d32"/>
  <text x="770" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5a21">Outposts</text>
  <text x="770" y="346" text-anchor="middle" font-size="10" fill="#3c4a58">AWS-managed hardware</text>
  <text x="770" y="359" text-anchor="middle" font-size="10" fill="#3c4a58">in your own facility</text>
  <text x="770" y="406" text-anchor="middle" font-size="10.5" fill="#3c4a58">Managed through the</text>
  <text x="770" y="420" text-anchor="middle" font-size="10.5" fill="#3c4a58">control plane of a parent Region</text>

  <line x1="620" y1="250" x2="660" y2="250" stroke="#5c6b7a" stroke-width="2"/>
  <line x1="620" y1="250" x2="628" y2="244" stroke="#5c6b7a" stroke-width="2"/>
  <line x1="620" y1="250" x2="628" y2="256" stroke="#5c6b7a" stroke-width="2"/>
</svg>
