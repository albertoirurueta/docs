<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The three Spring Boot OAuth roles in one deployment</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">client, authorization server and resource server can be three processes, or the same one</text>

  <!-- Browser -->
  <rect x="300" y="66" width="160" height="56" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="90" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Browser</text>
  <text x="380" y="106" font-size="10.5" fill="#333333" text-anchor="middle">resource owner's user agent</text>

  <!-- Client -->
  <rect x="30" y="200" width="190" height="90" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="125" y="224" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Client</text>
  <text x="125" y="240" font-size="10" fill="#333333" text-anchor="middle">Spring Boot service</text>
  <text x="125" y="254" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">spring-boot-starter-</text>
  <text x="125" y="266" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">oauth2-client</text>
  <text x="125" y="280" font-size="9.5" fill="#666666" text-anchor="middle">OAuth2AuthorizedClientManager</text>

  <!-- Authorization Server -->
  <rect x="285" y="200" width="190" height="90" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="224" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Authorization Server</text>
  <text x="380" y="240" font-size="10" fill="#333333" text-anchor="middle">Spring Boot service</text>
  <text x="380" y="254" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">spring-boot-starter-oauth2-</text>
  <text x="380" y="266" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">authorization-server</text>
  <text x="380" y="280" font-size="9.5" fill="#666666" text-anchor="middle">RegisteredClientRepository</text>

  <!-- Resource Server -->
  <rect x="540" y="200" width="190" height="90" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="635" y="224" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Resource Server</text>
  <text x="635" y="240" font-size="10" fill="#333333" text-anchor="middle">Spring Boot service</text>
  <text x="635" y="254" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">spring-boot-starter-oauth2-</text>
  <text x="635" y="266" font-size="9.5" font-family="'Courier New', monospace" fill="#333333" text-anchor="middle">resource-server</text>
  <text x="635" y="280" font-size="9.5" fill="#666666" text-anchor="middle">JwtDecoder / OpaqueTokenIntrospector</text>

  <!-- Browser to Client: click login -->
  <line x1="345" y1="122" x2="160" y2="200" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="215" y="150" font-size="9.5" fill="#333333" text-anchor="middle">1. GET /login</text>
  <text x="215" y="163" font-size="9.5" fill="#333333" text-anchor="middle">(browser session)</text>

  <!-- Client to AS: redirect to /oauth2/authorize -->
  <line x1="220" y1="235" x2="285" y2="235" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="252" y="222" font-size="9" fill="#333333" text-anchor="middle">2. 302</text>
  <text x="252" y="330" font-size="9" fill="#333333" text-anchor="middle">/oauth2/authorize</text>

  <!-- Browser to AS: authenticate + consent -->
  <line x1="380" y1="122" x2="380" y2="200" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="418" y="150" font-size="9.5" fill="#333333" text-anchor="middle">3. authenticate,</text>
  <text x="418" y="163" font-size="9.5" fill="#333333" text-anchor="middle">consent</text>

  <!-- AS back to Client: authorization code -->
  <line x1="285" y1="255" x2="220" y2="255" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="252" y="270" font-size="9" fill="#333333" text-anchor="middle">4. code</text>

  <!-- Client to AS: token exchange -->
  <line x1="220" y1="275" x2="285" y2="275" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="252" y="345" font-size="9" fill="#333333" text-anchor="middle">5. POST /oauth2/token</text>
  <text x="252" y="358" font-size="9" fill="#666666" text-anchor="middle">(code, code_verifier)</text>

  <!-- Client to RS: bearer token -->
  <line x1="220" y1="215" x2="540" y2="215" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="380" y="205" font-size="9.5" fill="#333333" text-anchor="middle">7. GET /api/orders, Authorization: Bearer &lt;access_token&gt;</text>

  <!-- RS to AS: jwks / introspect -->
  <line x1="540" y1="270" x2="475" y2="270" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="507" y="315" font-size="9" fill="#333333" text-anchor="middle">8. GET /oauth2/jwks</text>
  <text x="507" y="328" font-size="9" fill="#666666" text-anchor="middle">(cached) or</text>
  <text x="507" y="341" font-size="9" fill="#666666" text-anchor="middle">POST /oauth2/introspect</text>

  <!-- access/refresh/id tokens label (step 6, arrow already drawn as code exchange loop) -->
  <text x="252" y="292" font-size="9" fill="#333333" text-anchor="middle">6. access_token + refresh_token + id_token</text>

  <!-- RS response -->
  <line x1="540" y1="230" x2="220" y2="230" stroke="#2d6a34" stroke-width="1.1" marker-end="url(#arrowgreen)" stroke-dasharray="2,3"/>
  <text x="380" y="242" font-size="9" fill="#2d6a34" text-anchor="middle">9. 200 resource</text>

  <!-- legend box -->
  <rect x="20" y="400" width="720" height="100" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="420" font-size="10.5" fill="#666666" text-anchor="middle">Any two (or all three) boxes may be the same Spring Boot process: a service that issues its own tokens is</text>
  <text x="380" y="435" font-size="10.5" fill="#666666" text-anchor="middle">typically also the resource server that accepts them back (authorization server + resource server in one</text>
  <text x="380" y="450" font-size="10.5" fill="#666666" text-anchor="middle">process), and a backend-for-frontend is both the client that holds the token and the service the browser</text>
  <text x="380" y="465" font-size="10.5" fill="#666666" text-anchor="middle">talks to (client + resource server in one process). Each role keeps its own starter and Spring types</text>
  <text x="380" y="480" font-size="10.5" fill="#666666" text-anchor="middle">regardless of how the processes are drawn -- see the protocol-concept mapping table above.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2d6a34"/>
    </marker>
  </defs>
</svg>
