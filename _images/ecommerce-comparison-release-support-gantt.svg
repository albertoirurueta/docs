<text class="footer" x="24" y="608" text-anchor="start"><tspan x="24" dy="0">Source: Adobe Commerce lifecycle policy, PrestaShop release lifecycle (devdocs), Shopify API versioning, GitHub releases; retrieved 2026-10-27. PrestaShop end</tspan><tspan x="24" dy="15">dates are inferred from policy, not announced. Raw data: scripts/ecommerce-comparison-charts/data/support-windows.csv. See the Bibliography for the sources.</tspan></text>
