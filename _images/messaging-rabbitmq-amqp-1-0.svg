<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Two sessions to the same queue</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">AMQP 0-9-1 and AMQP 1.0 clients both reach RabbitMQ on the same port -- 5672 by default</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a5fa8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8730f"/>
    </marker>
  </defs>

  <!-- Shared queue in the middle -->
  <rect x="305" y="165" width="90" height="50" rx="4" fill="#f7f7f7" stroke="#444444" stroke-width="1.4"/>
  <text x="350" y="186" font-size="10" font-weight="bold" fill="#222222" text-anchor="middle">orders</text>
  <text x="350" y="200" font-size="8" fill="#666666" text-anchor="middle">(one queue)</text>

  <!-- Left column: AMQP 0-9-1 -->
  <rect x="20" y="60" width="255" height="290" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1"/>
  <text x="147" y="80" font-size="12" font-weight="bold" fill="#22326a" text-anchor="middle">AMQP 0-9-1</text>

  <rect x="40" y="100" width="90" height="22" rx="3" fill="#ffffff" stroke="#3a5fa8"/>
  <text x="85" y="114" font-size="8.5" text-anchor="middle" fill="#22326a">Connection</text>
  <rect x="40" y="132" width="90" height="22" rx="3" fill="#ffffff" stroke="#3a5fa8"/>
  <text x="85" y="146" font-size="8.5" text-anchor="middle" fill="#22326a">Channel</text>
  <line x1="85" y1="122" x2="85" y2="130" stroke="#3a5fa8" stroke-width="1.3" marker-end="url(#arrowBlue)"/>

  <text x="150" y="112" font-size="7.6" fill="#333333">basicPublish(exchange, routingKey, ...)</text>
  <text x="150" y="126" font-size="7.6" fill="#333333">basicConsume(queue, autoAck, ...)</text>
  <text x="150" y="140" font-size="7.6" fill="#333333">basicQos(prefetchCount) -- one static cap</text>
  <text x="150" y="154" font-size="7.6" fill="#333333">basicAck / basicNack / basicReject</text>

  <line x1="130" y1="143" x2="303" y2="180" stroke="#3a5fa8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <text x="220" y="168" font-size="7.5" fill="#22326a" text-anchor="middle">default exchange -&gt; "orders"</text>

  <rect x="40" y="240" width="90" height="30" rx="3" fill="#ffffff" stroke="#3a5fa8"/>
  <text x="85" y="257" font-size="8" text-anchor="middle" fill="#22326a">DeliverCallback</text>
  <text x="85" y="267" font-size="7" text-anchor="middle" fill="#666666">(consumer)</text>
  <line x1="305" y1="205" x2="132" y2="252" stroke="#3a5fa8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <text x="220" y="225" font-size="7.5" fill="#22326a" text-anchor="middle">push delivery, up to prefetch count</text>

  <text x="147" y="300" font-size="7.8" fill="#333333" text-anchor="middle">one connection -&gt; many lightweight</text>
  <text x="147" y="312" font-size="7.8" fill="#333333" text-anchor="middle">multiplexed channels; ack/nack/reject</text>
  <text x="147" y="324" font-size="7.8" fill="#333333" text-anchor="middle">settle a delivery; prefetch is one</text>
  <text x="147" y="336" font-size="7.8" fill="#333333" text-anchor="middle">static cap negotiated up front</text>

  <!-- Right column: AMQP 1.0 -->
  <rect x="425" y="60" width="255" height="290" fill="#fff4e5" stroke="#b8730f" stroke-width="1"/>
  <text x="552" y="80" font-size="12" font-weight="bold" fill="#8a5a0d" text-anchor="middle">AMQP 1.0</text>

  <rect x="440" y="100" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8730f"/>
  <text x="485" y="114" font-size="8.5" text-anchor="middle" fill="#8a5a0d">Connection</text>
  <rect x="440" y="132" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8730f"/>
  <text x="485" y="146" font-size="8.5" text-anchor="middle" fill="#8a5a0d">Session</text>
  <line x1="485" y1="122" x2="485" y2="130" stroke="#b8730f" stroke-width="1.3" marker-end="url(#arrowOrange)"/>

  <text x="540" y="112" font-size="7.6" fill="#333333">address: /queues/orders</text>
  <text x="540" y="126" font-size="7.6" fill="#333333">sending or receiving link, per direction</text>
  <text x="540" y="140" font-size="7.6" fill="#333333">credit -- dynamic, adjustable per link</text>
  <text x="540" y="154" font-size="7.6" fill="#333333">accepted / rejected / released / modified</text>

  <line x1="530" y1="143" x2="397" y2="180" stroke="#b8730f" stroke-width="1.4" marker-end="url(#arrowOrange)"/>
  <text x="475" y="168" font-size="7.5" fill="#8a5a0d" text-anchor="middle">sending link</text>

  <rect x="440" y="240" width="90" height="30" rx="3" fill="#ffffff" stroke="#b8730f"/>
  <text x="485" y="257" font-size="8" text-anchor="middle" fill="#8a5a0d">messageHandler</text>
  <text x="485" y="267" font-size="7" text-anchor="middle" fill="#666666">(receiving link)</text>
  <line x1="395" y1="205" x2="438" y2="252" stroke="#b8730f" stroke-width="1.4" marker-end="url(#arrowOrange)"/>
  <text x="475" y="225" font-size="7.5" fill="#8a5a0d" text-anchor="middle">delivery within granted credit</text>

  <text x="552" y="300" font-size="7.8" fill="#333333" text-anchor="middle">one connection -&gt; sessions -&gt; links;</text>
  <text x="552" y="312" font-size="7.8" fill="#333333" text-anchor="middle">context.accept()/requeue() settle a</text>
  <text x="552" y="324" font-size="7.8" fill="#333333" text-anchor="middle">delivery; credit is granted and</text>
  <text x="552" y="336" font-size="7.8" fill="#333333" text-anchor="middle">re-adjusted per link while running</text>

  <text x="350" y="232" font-size="8" fill="#444444" text-anchor="middle">RabbitMQ converts</text>
  <text x="350" y="243" font-size="8" fill="#444444" text-anchor="middle">between wire formats</text>
  <text x="350" y="254" font-size="8" fill="#444444" text-anchor="middle">when the two sides differ</text>
</svg>
