<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="cm-t cm-d">
  <title id="cm-t">Column-major storage of a 3 by 4 matrix</title>
  <desc id="cm-d">A 3 by 4 matrix whose cells show the linear index 1 to 12 counted down each column in turn, and below it the same twelve values as one strip of memory, grouped by column.</desc>
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">A = reshape(1:12, 3, 4): element A(i,j) has linear index i + 3*(j-1)</text>
  <text x="155" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 1</text>
  <text x="225" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 2</text>
  <text x="295" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 3</text>
  <text x="365" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 4</text>
  <text x="112" y="99" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 1</text>
  <rect x="120" y="70" width="70" height="50" fill="#dbeafe" stroke="#64748b"/>
  <text x="155.0" y="100.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">1</text>
  <rect x="190" y="70" width="70" height="50" fill="#dcfce7" stroke="#64748b"/>
  <text x="225.0" y="100.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">4</text>
  <rect x="260" y="70" width="70" height="50" fill="#fef9c3" stroke="#64748b"/>
  <text x="295.0" y="100.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">7</text>
  <rect x="330" y="70" width="70" height="50" fill="#fce7f3" stroke="#64748b"/>
  <text x="365.0" y="100.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">10</text>
  <text x="112" y="149" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 2</text>
  <rect x="120" y="120" width="70" height="50" fill="#dbeafe" stroke="#64748b"/>
  <text x="155.0" y="150.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">2</text>
  <rect x="190" y="120" width="70" height="50" fill="#dcfce7" stroke="#64748b"/>
  <text x="225.0" y="150.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">5</text>
  <rect x="260" y="120" width="70" height="50" fill="#fef9c3" stroke="#64748b"/>
  <text x="295.0" y="150.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">8</text>
  <rect x="330" y="120" width="70" height="50" fill="#fce7f3" stroke="#64748b"/>
  <text x="365.0" y="150.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">11</text>
  <text x="112" y="199" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 3</text>
  <rect x="120" y="170" width="70" height="50" fill="#dbeafe" stroke="#64748b"/>
  <text x="155.0" y="200.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">3</text>
  <rect x="190" y="170" width="70" height="50" fill="#dcfce7" stroke="#64748b"/>
  <text x="225.0" y="200.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">6</text>
  <rect x="260" y="170" width="70" height="50" fill="#fef9c3" stroke="#64748b"/>
  <text x="295.0" y="200.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">9</text>
  <rect x="330" y="170" width="70" height="50" fill="#fce7f3" stroke="#64748b"/>
  <text x="365.0" y="200.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">12</text>
  <text x="410" y="110" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">counts down column 1, then column 2, ...</text>
  <text x="40" y="285" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Memory order (one strip, first element on the left)</text>
  <rect x="40" y="300" width="55" height="46" fill="#dbeafe" stroke="#64748b"/>
  <text x="67.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">1</text>
  <rect x="95" y="300" width="55" height="46" fill="#dbeafe" stroke="#64748b"/>
  <text x="122.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">2</text>
  <rect x="150" y="300" width="55" height="46" fill="#dbeafe" stroke="#64748b"/>
  <text x="177.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">3</text>
  <rect x="205" y="300" width="55" height="46" fill="#dcfce7" stroke="#64748b"/>
  <text x="232.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">4</text>
  <rect x="260" y="300" width="55" height="46" fill="#dcfce7" stroke="#64748b"/>
  <text x="287.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">5</text>
  <rect x="315" y="300" width="55" height="46" fill="#dcfce7" stroke="#64748b"/>
  <text x="342.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">6</text>
  <rect x="370" y="300" width="55" height="46" fill="#fef9c3" stroke="#64748b"/>
  <text x="397.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">7</text>
  <rect x="425" y="300" width="55" height="46" fill="#fef9c3" stroke="#64748b"/>
  <text x="452.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">8</text>
  <rect x="480" y="300" width="55" height="46" fill="#fef9c3" stroke="#64748b"/>
  <text x="507.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">9</text>
  <rect x="535" y="300" width="55" height="46" fill="#fce7f3" stroke="#64748b"/>
  <text x="562.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">10</text>
  <rect x="590" y="300" width="55" height="46" fill="#fce7f3" stroke="#64748b"/>
  <text x="617.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">11</text>
  <rect x="645" y="300" width="55" height="46" fill="#fce7f3" stroke="#64748b"/>
  <text x="672.5" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">12</text>
  <text x="122" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">column 1</text>
  <text x="287" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">column 2</text>
  <text x="452" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">column 3</text>
  <text x="617" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">column 4</text>
</svg>
