<svg viewBox="0 0 900 415" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="415" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">First request on a new execution environment: three approaches</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#5c6b7a">Illustrative proportions for a Java function; real durations depend on code, memory and runtime</text>

  <!-- legend -->
  <rect x="190" y="62" width="14" height="14" fill="#d9a441"/><text x="210" y="74" font-size="12" fill="#1a1a1a">Create environment, download code</text>
  <rect x="440" y="62" width="14" height="14" fill="#c8553d"/><text x="460" y="74" font-size="12" fill="#1a1a1a">Start runtime and run init code</text>
  <rect x="680" y="62" width="14" height="14" fill="#2f7d5b"/><text x="700" y="74" font-size="12" fill="#1a1a1a">Handler runs</text>
  <rect x="190" y="82" width="14" height="14" fill="#4a7fb5"/><text x="210" y="94" font-size="12" fill="#1a1a1a">Restore snapshot (SnapStart)</text>
  <rect x="440" y="82" width="14" height="14" fill="#e9eef3" stroke="#5c6b7a" stroke-dasharray="4,3"/><text x="460" y="94" font-size="12" fill="#1a1a1a">Work done earlier, not on the request path</text>

  <!-- Row 1 -->
  <text x="20" y="150" font-size="14" font-weight="700" fill="#1a1a1a">On-demand cold start</text>
  <text x="20" y="168" font-size="12" fill="#5c6b7a">Default behaviour</text>
  <rect x="190" y="130" width="90" height="46" fill="#d9a441"/>
  <rect x="280" y="130" width="340" height="46" fill="#c8553d"/>
  <rect x="620" y="130" width="90" height="46" fill="#2f7d5b"/>
  <text x="235" y="158" text-anchor="middle" font-size="12" fill="#ffffff">Create</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#ffffff">JVM start + framework init</text>
  <text x="665" y="158" text-anchor="middle" font-size="12" fill="#ffffff">Handler</text>
  <text x="190" y="196" font-size="12" fill="#3c4a58">Longest latency; paid on every scale-out event (INIT is billed).</text>

  <!-- Row 2 -->
  <text x="20" y="262" font-size="14" font-weight="700" fill="#1a1a1a">SnapStart</text>
  <text x="20" y="280" font-size="12" fill="#5c6b7a">Init at publish time</text>
  <rect x="190" y="242" width="340" height="46" fill="#e9eef3" stroke="#5c6b7a" stroke-dasharray="4,3"/>
  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#3c4a58">Init once, snapshot taken at version publish</text>
  <rect x="530" y="242" width="90" height="46" fill="#4a7fb5"/>
  <text x="575" y="270" text-anchor="middle" font-size="12" fill="#ffffff">Restore</text>
  <rect x="620" y="242" width="90" height="46" fill="#2f7d5b"/>
  <text x="665" y="270" text-anchor="middle" font-size="12" fill="#ffffff">Handler</text>
  <text x="190" y="308" font-size="12" fill="#3c4a58">Much shorter than a cold start; published versions only; no provisioned concurrency or EFS.</text>

  <!-- Row 3 -->
  <text x="20" y="354" font-size="14" font-weight="700" fill="#1a1a1a">Provisioned concurrency</text>
  <text x="20" y="372" font-size="12" fill="#5c6b7a">Environments pre-warmed</text>
  <rect x="190" y="334" width="430" height="46" fill="#e9eef3" stroke="#5c6b7a" stroke-dasharray="4,3"/>
  <text x="405" y="362" text-anchor="middle" font-size="12" fill="#3c4a58">Environments created and initialized before traffic arrives</text>
  <rect x="620" y="334" width="90" height="46" fill="#2f7d5b"/>
  <text x="665" y="362" text-anchor="middle" font-size="12" fill="#ffffff">Handler</text>
  <text x="190" y="400" font-size="12" fill="#3c4a58">Only the handler is on the path; you pay while it is configured.</text>
</svg>
