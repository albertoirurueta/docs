<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How rustc turns a crate into machine code</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">each stage is an intermediate representation; the annotations below show where the main checks run</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="90" width="100" height="56" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
    <text x="70" y="114" font-weight="bold" fill="#222222">Source</text>
    <text x="70" y="132" font-size="11" fill="#444444">.rs files</text>

    <rect x="150" y="90" width="100" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="200" y="114" font-weight="bold" fill="#1c4b73">Tokens</text>
    <text x="200" y="132" font-size="11" fill="#444444">lexer</text>

    <rect x="280" y="90" width="100" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="330" y="114" font-weight="bold" fill="#1c4b73">AST</text>
    <text x="330" y="132" font-size="11" fill="#444444">parser</text>

    <rect x="410" y="90" width="100" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="460" y="114" font-weight="bold" fill="#1c4b73">HIR</text>
    <text x="460" y="132" font-size="11" fill="#444444">desugared tree</text>

    <rect x="540" y="90" width="100" height="56" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="590" y="114" font-weight="bold" fill="#1c4b73">THIR / MIR</text>
    <text x="590" y="132" font-size="11" fill="#444444">control-flow graph</text>

    <rect x="670" y="90" width="100" height="56" rx="6" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
    <text x="720" y="114" font-weight="bold" fill="#a35a00">LLVM IR</text>
    <text x="720" y="132" font-size="11" fill="#444444">codegen backend</text>

    <rect x="800" y="90" width="140" height="56" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="870" y="114" font-weight="bold" fill="#2e7d32">Machine code</text>
    <text x="870" y="132" font-size="11" fill="#444444">objects, then linker</text>
  </g>
  <g stroke="#444444" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="120" y1="118" x2="148" y2="118"/>
    <line x1="250" y1="118" x2="278" y2="118"/>
    <line x1="380" y1="118" x2="408" y2="118"/>
    <line x1="510" y1="118" x2="538" y2="118"/>
    <line x1="640" y1="118" x2="668" y2="118"/>
    <line x1="770" y1="118" x2="798" y2="118"/>
  </g>
  <g font-size="12" fill="#333333">
    <line x1="330" y1="146" x2="330" y2="200" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="250" y="200" width="160" height="58" rx="5" fill="#f6ecf8" stroke="#7b1fa2"/>
    <text x="330" y="220" text-anchor="middle" font-weight="bold" fill="#7b1fa2">Macro expansion</text>
    <text x="330" y="238" text-anchor="middle">and name resolution</text>
    <text x="330" y="252" text-anchor="middle" font-size="11">(on the AST)</text>

    <line x1="460" y1="146" x2="460" y2="280" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="380" y="280" width="160" height="58" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="460" y="300" text-anchor="middle" font-weight="bold" fill="#1c4b73">Type checking</text>
    <text x="460" y="318" text-anchor="middle">trait solving, inference</text>
    <text x="460" y="332" text-anchor="middle" font-size="11">(on the HIR)</text>

    <line x1="590" y1="146" x2="590" y2="200" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="510" y="200" width="170" height="58" rx="5" fill="#fbeaea" stroke="#c62828"/>
    <text x="595" y="220" text-anchor="middle" font-weight="bold" fill="#c62828">Borrow checking</text>
    <text x="595" y="238" text-anchor="middle">moves, lifetimes, MIR opts</text>
    <text x="595" y="252" text-anchor="middle" font-size="11">(on the MIR)</text>

    <line x1="720" y1="146" x2="720" y2="280" stroke="#a35a00" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="640" y="280" width="170" height="58" rx="5" fill="#fdf0e2" stroke="#a35a00"/>
    <text x="725" y="300" text-anchor="middle" font-weight="bold" fill="#a35a00">Monomorphization</text>
    <text x="725" y="318" text-anchor="middle">one copy per generic use,</text>
    <text x="725" y="332" text-anchor="middle">then LLVM optimizes</text>
  </g>
  <text x="480" y="378" font-size="12" fill="#666666" text-anchor="middle">cargo check stops after the MIR checks (no code generation), which is why it is much faster than cargo build</text>
</svg>
