<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What crosses the boundary of a command-line program</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">everything a Go program learns from its caller comes in on the left; everything it tells the caller goes out on the right</text>
  <defs>
    <marker id="in" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="out" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d6a3e"/></marker>
    <marker id="child" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5651a"/></marker>
  </defs>

  <!-- inputs -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="30" y="80" width="230" height="52" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="145" y="102" font-weight="bold">arguments</text>
    <text x="145" y="120">os.Args, flag, FlagSet</text>

    <rect x="30" y="148" width="230" height="52" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="145" y="170" font-weight="bold">environment</text>
    <text x="145" y="188">os.LookupEnv, os.Environ</text>

    <rect x="30" y="216" width="230" height="52" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="145" y="238" font-weight="bold">standard input</text>
    <text x="145" y="256">os.Stdin, bufio.Scanner</text>

    <rect x="30" y="284" width="230" height="52" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="145" y="306" font-weight="bold">signals</text>
    <text x="145" y="324">SIGINT, SIGTERM, SIGPIPE</text>
  </g>

  <!-- the program -->
  <rect x="350" y="80" width="240" height="256" fill="#f4f4f4" stroke="#444444" stroke-width="2"/>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <text x="470" y="108" font-size="15" font-weight="bold">shelf process</text>
    <text x="470" y="134">main: only wiring</text>
    <text x="470" y="152">run(ctx, args, app) int</text>
    <text x="470" y="182" fill="#666666">parse, validate, work,</text>
    <text x="470" y="198" fill="#666666">map the error to a status</text>
    <text x="470" y="236">NotifyContext cancels ctx</text>
    <text x="470" y="254">deferred calls run in run,</text>
    <text x="470" y="272">before os.Exit in main</text>
    <text x="470" y="304" fill="#666666">files: os.ReadFile, os.CreateTemp,</text>
    <text x="470" y="320" fill="#666666">os.Rename</text>
  </g>

  <!-- outputs -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="680" y="80" width="230" height="52" fill="#e6f2ea" stroke="#2d6a3e"/>
    <text x="795" y="102" font-weight="bold">standard output</text>
    <text x="795" y="120">results, data, JSON</text>

    <rect x="680" y="148" width="230" height="52" fill="#e6f2ea" stroke="#2d6a3e"/>
    <text x="795" y="170" font-weight="bold">standard error</text>
    <text x="795" y="188">errors, usage, progress</text>

    <rect x="680" y="216" width="230" height="52" fill="#e6f2ea" stroke="#2d6a3e"/>
    <text x="795" y="238" font-weight="bold">exit status</text>
    <text x="795" y="256">0 ok, 1 failure, 2 usage, 130 Ctrl-C</text>

    <rect x="680" y="284" width="230" height="52" fill="#e6f2ea" stroke="#2d6a3e"/>
    <text x="795" y="306" font-weight="bold">files</text>
    <text x="795" y="324">catalogue, exports</text>
  </g>

  <g stroke="#1c4b73" stroke-width="2" fill="none">
    <line x1="260" y1="106" x2="348" y2="106" marker-end="url(#in)"/>
    <line x1="260" y1="174" x2="348" y2="174" marker-end="url(#in)"/>
    <line x1="260" y1="242" x2="348" y2="242" marker-end="url(#in)"/>
    <line x1="260" y1="310" x2="348" y2="310" marker-end="url(#in)"/>
  </g>
  <g stroke="#2d6a3e" stroke-width="2" fill="none">
    <line x1="592" y1="106" x2="678" y2="106" marker-end="url(#out)"/>
    <line x1="592" y1="174" x2="678" y2="174" marker-end="url(#out)"/>
    <line x1="592" y1="242" x2="678" y2="242" marker-end="url(#out)"/>
    <line x1="592" y1="310" x2="678" y2="310" marker-end="url(#out)"/>
  </g>

  <!-- children -->
  <g stroke="#a5651a" stroke-width="2" fill="none">
    <line x1="470" y1="338" x2="470" y2="372" marker-end="url(#child)"/>
  </g>
  <rect x="230" y="374" width="480" height="34" fill="#fdf1e3" stroke="#a5651a"/>
  <text x="470" y="395" font-size="12" fill="#222222" text-anchor="middle">child processes: os/exec gives each its own args, env, streams and status</text>
</svg>
