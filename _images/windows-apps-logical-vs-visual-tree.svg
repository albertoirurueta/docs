<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Logical tree and visual tree of the Bookshelf Desktop main window</text>
  <text x="400" y="48" font-size="13" fill="#666666" text-anchor="middle">Same window, two views: what you declared in XAML (left) and what WPF renders after templates are applied (right)</text>

  <rect x="20" y="64" width="360" height="318" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="36" y="88" font-size="14" font-weight="bold" fill="#1c4b73">Logical tree (LogicalTreeHelper)</text>
  <text x="36" y="106" font-size="12" fill="#333333">Content you wrote or generated: resources, inheritance</text>
  <g font-size="13" fill="#222222">
    <rect x="36" y="124" width="14" height="14" rx="3" fill="#1c4b73"/><text x="58" y="136">Window</text>
    <rect x="52" y="152" width="14" height="14" rx="3" fill="#1c4b73"/><text x="74" y="164">Grid</text>
    <rect x="68" y="180" width="14" height="14" rx="3" fill="#1c4b73"/><text x="90" y="192">TextBox (SearchBox)</text>
    <rect x="68" y="208" width="14" height="14" rx="3" fill="#1c4b73"/><text x="90" y="220">ListBox (BooksList)</text>
    <rect x="84" y="236" width="14" height="14" rx="3" fill="#2a6a2a"/><text x="106" y="248">ListBoxItem (generated, one per book)</text>
    <rect x="68" y="264" width="14" height="14" rx="3" fill="#1c4b73"/><text x="90" y="276">Button (AddButton)</text>
    <rect x="84" y="292" width="14" height="14" rx="3" fill="#a07820"/><text x="106" y="304">"Add book" (string content)</text>
  </g>
  <text x="36" y="334" font-size="12" fill="#333333">No template parts here: Border, ScrollViewer and</text>
  <text x="36" y="350" font-size="12" fill="#333333">ContentPresenter are not part of this tree.</text>

  <rect x="400" y="64" width="380" height="318" rx="12" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="416" y="88" font-size="14" font-weight="bold" fill="#7a5a10">Visual tree (VisualTreeHelper)</text>
  <text x="416" y="106" font-size="12" fill="#333333">Everything drawn: rendering, hit testing, event routing</text>
  <g font-size="13" fill="#222222">
    <rect x="416" y="124" width="14" height="14" rx="3" fill="#7a5a10"/><text x="438" y="136">Window</text>
    <rect x="428" y="148" width="14" height="14" rx="3" fill="#7a5a10"/><text x="450" y="160">Border</text>
    <rect x="440" y="172" width="14" height="14" rx="3" fill="#7a5a10"/><text x="462" y="184">AdornerDecorator</text>
    <rect x="452" y="196" width="14" height="14" rx="3" fill="#7a5a10"/><text x="474" y="208">ContentPresenter</text>
    <rect x="464" y="220" width="14" height="14" rx="3" fill="#7a5a10"/><text x="486" y="232">Grid</text>
    <rect x="476" y="244" width="14" height="14" rx="3" fill="#7a5a10"/><text x="498" y="256">TextBox: Border, ScrollViewer ...</text>
    <rect x="476" y="268" width="14" height="14" rx="3" fill="#7a5a10"/><text x="498" y="280">ListBox: Border, ScrollViewer,</text>
  </g>
  <text x="498" y="296" font-size="13" fill="#222222">ItemsPresenter, VirtualizingStackPanel ...</text>
  <g font-size="13" fill="#222222">
    <rect x="476" y="308" width="14" height="14" rx="3" fill="#7a5a10"/><text x="498" y="320">Button: Border, ContentPresenter, TextBlock</text>
  </g>
  <text x="416" y="346" font-size="12" fill="#333333">Template parts differ per theme (Aero2, Fluent) and per</text>
  <text x="416" y="362" font-size="12" fill="#333333">control template: treat their exact shape as unstable.</text>
</svg>
