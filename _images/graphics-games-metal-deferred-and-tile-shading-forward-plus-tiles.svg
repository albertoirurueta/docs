<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-deferred-fplus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Forward-plus: one light list per tile</text>
<rect x="30" y="56" width="416" height="300" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<line x1="82" y1="56" x2="82" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="134" y1="56" x2="134" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="186" y1="56" x2="186" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="238" y1="56" x2="238" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="290" y1="56" x2="290" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="342" y1="56" x2="342" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="394" y1="56" x2="394" y2="356" stroke="#D1D5DB" stroke-width="1"/>
<line x1="30" y1="106" x2="446" y2="106" stroke="#D1D5DB" stroke-width="1"/>
<line x1="30" y1="156" x2="446" y2="156" stroke="#D1D5DB" stroke-width="1"/>
<line x1="30" y1="206" x2="446" y2="206" stroke="#D1D5DB" stroke-width="1"/>
<line x1="30" y1="256" x2="446" y2="256" stroke="#D1D5DB" stroke-width="1"/>
<line x1="30" y1="306" x2="446" y2="306" stroke="#D1D5DB" stroke-width="1"/>
<rect x="290" y="156" width="52" height="50" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<circle cx="110" cy="120" r="52" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="110" cy="120" r="4" fill="#4F46E5"/>
<text x="118" y="114" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L0</text>
<circle cx="190" cy="200" r="44" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="190" cy="200" r="4" fill="#4F46E5"/>
<text x="198" y="194" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L1</text>
<circle cx="318" cy="172" r="50" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="318" cy="172" r="4" fill="#4F46E5"/>
<text x="326" y="166" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L2</text>
<circle cx="360" cy="150" r="40" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="360" cy="150" r="4" fill="#4F46E5"/>
<text x="368" y="144" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L3</text>
<circle cx="270" cy="262" r="38" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="270" cy="262" r="4" fill="#4F46E5"/>
<text x="278" y="256" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L4</text>
<circle cx="150" cy="276" r="34" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="150" cy="276" r="4" fill="#4F46E5"/>
<text x="158" y="270" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">L5</text>
<text x="238.0" y="378" text-anchor="middle" font-size="11" fill="#374151">Screen split into 16 x 16 pixel tiles (8 x 6 shown)</text>
<rect x="470" y="56" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<text x="605" y="80" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Tile (5, 2) light list</text>
<text x="485" y="104" text-anchor="start" font-size="11" fill="#374151">minDepth, maxDepth from the tile kernel</text>
<text x="485" y="124" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">count = 2</text>
<text x="485" y="144" text-anchor="start" font-size="12" fill="#1F2937">indices = [ 2, 3, ... ]</text>
<text x="485" y="166" text-anchor="start" font-size="11" fill="#374151">L2 and L3 touch the tile; L0, L1, L4, L5</text>
<text x="485" y="182" text-anchor="start" font-size="11" fill="#374151">do not, so the fragments of this tile</text>
<text x="485" y="198" text-anchor="start" font-size="11" fill="#374151">never loop over them.</text>
<rect x="470" y="232" width="270" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="488" cy="254" r="11" fill="#4F46E5"/><text x="488" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="506" y="251" text-anchor="start" font-size="11" fill="#1F2937">Depth pre-pass writes linear depth</text>
<text x="506" y="266" text-anchor="start" font-size="11" fill="#1F2937">to a memoryless colour attachment</text>
<line x1="605" y1="276" x2="605" y2="284" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-deferred-fplus)"/>
<rect x="470" y="284" width="270" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="488" cy="306" r="11" fill="#4F46E5"/><text x="488" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="506" y="303" text-anchor="start" font-size="11" fill="#1F2937">Tile kernel: min/max depth with</text>
<text x="506" y="318" text-anchor="start" font-size="11" fill="#1F2937">simd_min and simd_max, then cull lights</text>
<line x1="605" y1="328" x2="605" y2="336" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-deferred-fplus)"/>
<rect x="470" y="336" width="270" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="488" cy="358" r="11" fill="#4F46E5"/><text x="488" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="506" y="355" text-anchor="start" font-size="11" fill="#1F2937">Forward draws read the list from</text>
<text x="506" y="370" text-anchor="start" font-size="11" fill="#1F2937">threadgroup memory and shade</text>
<rect x="30" y="380" width="430" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="245" y="402" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">All three steps run inside one render pass.</text>
<text x="245" y="420" text-anchor="middle" font-size="11" fill="#374151">The light list never leaves the tile: it lives in threadgroup memory,</text>
<text x="245" y="436" text-anchor="middle" font-size="11" fill="#374151">which the tile kernel writes and the fragment shaders read.</text>
</svg>
