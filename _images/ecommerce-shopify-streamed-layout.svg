<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Streamed HTML response and the order of the theme layout</title>
  <desc>The layout is sent in two chunks. Everything above the content_for_header output reaches the browser while the sections are still rendering, so stylesheets, font preloads and the import map belong there. A timeline shows the browser fetching those files during the section rendering time.</desc>
  <text x="480" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">Put first-paint resources above content_for_header</text>
  <text x="480" y="46" font-size="12" fill="#7b8794" text-anchor="middle">Streaming applies to JSON templates when content_for_header is a plain output tag inside head</text>

  <!-- layout skeleton -->
  <text x="20" y="76" font-size="13" font-weight="bold" fill="#7b8794">layout/theme.liquid</text>
  <rect x="20" y="86" width="400" height="150" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="34" y="108" font-size="12.5" font-weight="bold" fill="#1f2933">Chunk 1: sent as soon as it is rendered</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#1f2933">
    <text x="34" y="132">&lt;script type="importmap"&gt;</text>
    <text x="34" y="150">{% render 'css-variables' %}</text>
    <text x="34" y="168">critical.css | stylesheet_tag: preload</text>
    <text x="34" y="186">{% render 'seo-head' %}</text>
    <text x="34" y="204">font preloads, preconnect (few)</text>
  </g>
  <rect x="20" y="244" width="400" height="34" rx="6" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="34" y="266" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{{ content_for_header }}  (plain tag, in head)</text>
  <rect x="20" y="286" width="400" height="126" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="34" y="308" font-size="12.5" font-weight="bold" fill="#1f2933">Chunk 2: after the sections have rendered</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#1f2933">
    <text x="34" y="332">sections 'header-group'</text>
    <text x="34" y="350">main: content_for_layout</text>
    <text x="34" y="368">sections 'footer-group'</text>
    <text x="34" y="386">script type="module" (deferred)</text>
  </g>

  <!-- timeline -->
  <text x="470" y="76" font-size="13" font-weight="bold" fill="#7b8794">Timeline</text>
  <text x="470" y="112" font-size="12.5" fill="#7b8794">Shopify</text>
  <rect x="540" y="96" width="90" height="26" rx="4" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <text x="585" y="113" font-size="11.5" fill="#1f2933" text-anchor="middle">render head</text>
  <rect x="630" y="96" width="230" height="26" rx="4" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <text x="745" y="113" font-size="11.5" fill="#1f2933" text-anchor="middle">render sections (Liquid)</text>

  <text x="470" y="162" font-size="12.5" fill="#7b8794">Browser</text>
  <rect x="630" y="146" width="90" height="26" rx="4" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <text x="675" y="163" font-size="11.5" fill="#1f2933" text-anchor="middle">parse head</text>
  <rect x="720" y="146" width="140" height="26" rx="4" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <text x="790" y="163" font-size="11.5" fill="#1f2933" text-anchor="middle">fetch CSS, fonts</text>
  <rect x="860" y="146" width="80" height="26" rx="4" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <text x="900" y="163" font-size="11.5" fill="#1f2933" text-anchor="middle">paint</text>

  <line x1="630" y1="86" x2="630" y2="184" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="634" y="200" font-size="11.5" fill="#7b8794">first byte of chunk 1</text>
  <line x1="860" y1="86" x2="860" y2="184" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="866" y="200" font-size="11.5" fill="#7b8794">chunk 2 arrives</text>

  <text x="470" y="262" font-size="13" font-weight="bold" fill="#7b8794">Rules that keep streaming on</text>
  <g font-size="12.5" fill="#7b8794">
    <text x="470" y="286">The page renders from a JSON template</text>
    <text x="470" y="306">content_for_header has no filter, is not inside another</text>
    <text x="470" y="324">tag or snippet and is not assigned to a variable first</text>
    <text x="470" y="344">content_for_header sits inside head, before the closing tag</text>
    <text x="470" y="372">Preview themes, the preview bar and the theme editor</text>
    <text x="470" y="390">are not streamed: measure on the live theme</text>
  </g>
</svg>
