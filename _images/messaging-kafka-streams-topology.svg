<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="480" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kafka Streams topology: source, processor, state store, and sink</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">one task's slice of the processor graph -- from an input topic partition to an output topic partition</text>

  <!-- Input topic -->
  <rect x="15" y="70" width="140" height="46" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="85" y="90" font-size="10.5" font-weight="bold" fill="#444444" text-anchor="middle">Input topic</text>
  <text x="85" y="104" font-size="9.5" fill="#666666" text-anchor="middle">"text-lines"</text>

  <!-- Source processor -->
  <rect x="15" y="150" width="140" height="70" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="85" y="176" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Source</text>
  <text x="85" y="192" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">processor</text>
  <text x="85" y="208" font-size="9.5" fill="#333333" text-anchor="middle">reads partition(s)</text>

  <!-- arrow input topic -> source -->
  <line x1="85" y1="116" x2="85" y2="150" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stream processor -->
  <rect x="280" y="150" width="160" height="70" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="360" y="176" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Stream processor</text>
  <text x="360" y="192" font-size="9.5" fill="#333333" text-anchor="middle">stateful transform</text>
  <text x="360" y="205" font-size="9.5" fill="#333333" text-anchor="middle">(e.g. groupBy + count)</text>

  <!-- arrow source -> stream processor -->
  <line x1="155" y1="185" x2="280" y2="185" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Sink processor -->
  <rect x="545" y="150" width="140" height="70" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="615" y="176" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Sink</text>
  <text x="615" y="192" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">processor</text>
  <text x="615" y="208" font-size="9.5" fill="#333333" text-anchor="middle">writes output topic</text>

  <!-- arrow stream processor -> sink -->
  <line x1="440" y1="185" x2="545" y2="185" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Output topic -->
  <rect x="545" y="70" width="140" height="46" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="615" y="90" font-size="10.5" font-weight="bold" fill="#444444" text-anchor="middle">Output topic</text>
  <text x="615" y="104" font-size="9.5" fill="#666666" text-anchor="middle">"word-counts"</text>

  <!-- arrow sink -> output topic -->
  <line x1="615" y1="150" x2="615" y2="116" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- State store -->
  <rect x="280" y="280" width="160" height="70" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="360" y="306" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">State store</text>
  <text x="360" y="322" font-size="9.5" fill="#333333" text-anchor="middle">RocksDB / in-memory</text>
  <text x="360" y="335" font-size="9.5" fill="#333333" text-anchor="middle">one per task</text>

  <!-- double arrow stream processor <-> state store -->
  <line x1="350" y1="220" x2="350" y2="280" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="370" y1="280" x2="370" y2="220" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="240" y="253" font-size="9" fill="#666666" text-anchor="middle">read /</text>
  <text x="240" y="264" font-size="9" fill="#666666" text-anchor="middle">write</text>

  <!-- Changelog topic -->
  <rect x="280" y="395" width="160" height="46" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="360" y="415" font-size="10.5" font-weight="bold" fill="#444444" text-anchor="middle">Changelog topic</text>
  <text x="360" y="429" font-size="9.5" fill="#666666" text-anchor="middle">"...-count-changelog"</text>

  <!-- arrow state store -> changelog -->
  <line x1="360" y1="350" x2="360" y2="395" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="440" y="376" font-size="9" fill="#666666">backs up to</text>

  <text x="350" y="465" font-size="10" fill="#666666" text-anchor="middle">A task rebuilds its state store by replaying the changelog topic after migrating to a new instance.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
