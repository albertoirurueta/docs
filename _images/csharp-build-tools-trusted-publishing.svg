<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtTpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Trusted Publishing: exchanging an OIDC token for a one-hour API key</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">nuget.org with GitHub Actions and NuGet/login@v1 (not run here)</text>
<rect x="40" y="66" width="180" height="44" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="130" y="93" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">GitHub Actions job</text>
<line x1="130" y1="110" x2="130" y2="470" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="290" y="66" width="180" height="44" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="380" y="93" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">GitHub OIDC provider</text>
<line x1="380" y1="110" x2="380" y2="470" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="540" y="66" width="180" height="44" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="630" y="93" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">nuget.org token service</text>
<line x1="630" y1="110" x2="630" y2="470" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="790" y="66" width="180" height="44" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="880" y="93" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">nuget.org push endpoint</text>
<line x1="880" y1="110" x2="880" y2="470" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="130" y1="130" x2="376" y2="130" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="255.0" y="124" font-size="11" fill="#333333" text-anchor="middle">1. request ID token (permissions: id-token: write)</text>
<line x1="380" y1="170" x2="134" y2="170" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="255.0" y="164" font-size="11" fill="#333333" text-anchor="middle">2. signed JWT: repository, owner, workflow, environment</text>
<line x1="130" y1="230" x2="626" y2="230" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="380.0" y="224" font-size="11" fill="#333333" text-anchor="middle">3. POST /api/v2/token  (user + ID token)</text>
<rect x="510" y="254" width="240" height="26" rx="6" fill="#ffffff" stroke="#2e7d3b"/>
<text x="630" y="272" font-size="11" fill="#333333" text-anchor="middle">4. match a Trusted Publishing policy</text>
<line x1="630" y1="310" x2="134" y2="310" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="380.0" y="304" font-size="11" fill="#333333" text-anchor="middle">5. temporary API key, valid 1 hour, one per token</text>
<line x1="130" y1="370" x2="876" y2="370" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="505.0" y="364" font-size="11" fill="#333333" text-anchor="middle">6. dotnet nuget push --api-key &lt;temporary key&gt;</text>
<line x1="880" y1="410" x2="134" y2="410" stroke="#444444" stroke-width="1.8" marker-end="url(#cbtTpArrow)"/>
<text x="505.0" y="404" font-size="11" fill="#333333" text-anchor="middle">7. 201/202 accepted, then validation and indexing</text>
<text x="40" y="500" font-size="12" fill="#444444" text-anchor="start">No long-lived secret is stored in the repository; the policy on nuget.org decides which repository and workflow may publish.</text>
</svg>
