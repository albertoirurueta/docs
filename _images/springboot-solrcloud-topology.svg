<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">SolrCloud: a ZooKeeper ensemble over a collection of 2 shards across 3 Solr nodes</text>

  <defs>
    <marker id="sc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- ZooKeeper ensemble -->
  <rect x="250" y="48" width="400" height="84" rx="8" fill="#f0ece0" stroke="#8a6d1d" stroke-width="1.6"/>
  <text x="450" y="68" font-size="12" font-weight="bold" fill="#8a6d1d" text-anchor="middle">ZooKeeper ensemble &#8212; cluster state, config sets, leader election</text>
  <rect x="272" y="80" width="112" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="328" y="105" font-size="12" fill="#8a6d1d" text-anchor="middle">zk 1</text>
  <rect x="394" y="80" width="112" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="450" y="105" font-size="12" fill="#8a6d1d" text-anchor="middle">zk 2</text>
  <rect x="516" y="80" width="112" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="572" y="105" font-size="12" fill="#8a6d1d" text-anchor="middle">zk 3</text>

  <line x1="450" y1="132" x2="450" y2="164" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#sc-arrow)"/>

  <!-- Solr nodes -->
  <rect x="40" y="170" width="260" height="196" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="170" y="193" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 1</text>
  <rect x="64" y="208" width="212" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="170" y="232" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard 1 &#183; leader core</text>
  <text x="170" y="250" font-size="10.5" fill="#666666" text-anchor="middle">receives writes for shard 1</text>
  <rect x="64" y="284" width="212" height="60" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="170" y="308" font-size="12" fill="#1c4b73" text-anchor="middle">Shard 2 &#183; replica core</text>
  <text x="170" y="326" font-size="10.5" fill="#666666" text-anchor="middle">follows shard 2 leader</text>

  <rect x="320" y="170" width="260" height="196" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="193" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 2</text>
  <rect x="344" y="238" width="212" height="60" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="450" y="262" font-size="12" fill="#1c4b73" text-anchor="middle">Shard 1 &#183; replica core</text>
  <text x="450" y="280" font-size="10.5" fill="#666666" text-anchor="middle">follows shard 1 leader</text>

  <rect x="600" y="170" width="260" height="196" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="730" y="193" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 3</text>
  <rect x="624" y="238" width="212" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="730" y="262" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard 2 &#183; leader core</text>
  <text x="730" y="280" font-size="10.5" fill="#666666" text-anchor="middle">receives writes for shard 2</text>

  <!-- replication links -->
  <line x1="276" y1="238" x2="344" y2="262" stroke="#999999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#sc-arrow)"/>
  <line x1="624" y1="262" x2="276" y2="308" stroke="#999999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#sc-arrow)"/>

  <!-- Legend -->
  <rect x="250" y="386" width="20" height="14" rx="3" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="278" y="398" font-size="11" fill="#444444">leader core (takes writes)</text>
  <rect x="470" y="386" width="20" height="14" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="498" y="398" font-size="11" fill="#444444">replica core &#8212; dashed grey line = leader-to-replica replication</text>

  <text x="450" y="420" font-size="11" fill="#444444" text-anchor="middle">Each shard's leader and replica sit on different nodes; the collection is queried as a whole and Solr routes to the shards.</text>
</svg>
