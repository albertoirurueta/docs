<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">XWPF: one paragraph split into five runs, each with its own formatting and text</title>
  <desc id="d">A paragraph of loan-letter.docx reads "Your loan of Dune is due on 2026-11-02." It is stored as one XWPFParagraph holding five XWPFRun objects. The first run is plain text, the second is bold and italic, the third is plain text, the fourth is bold and coloured, and the fifth is the plain full stop. Each run owns its formatting properties and one or more text elements. Paragraph properties such as alignment, spacing and style belong to the paragraph, not to the runs.</desc>
  <style>
    .t { fill: #1f1f1f; }
    .m { fill: #555555; }
    .box { fill: #888888; fill-opacity: 0.12; stroke: #777777; stroke-width: 1.4; }
    .par { fill: #2f6fdb; fill-opacity: 0.10; stroke: #2f6fdb; stroke-width: 1.8; }
    .run { fill: #d98a00; fill-opacity: 0.16; stroke: #d98a00; stroke-width: 1.8; }
    .ln { stroke: #777777; stroke-width: 1.5; fill: none; }
    .wint { fill: #1d4fa8; }
    .runt { fill: #8a5600; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececec; }
      .m { fill: #b5b5b5; }
      .box { stroke: #aaaaaa; }
      .par { fill: #6ea0ff; stroke: #6ea0ff; }
      .run { fill: #ffb84d; stroke: #ffb84d; }
      .ln { stroke: #aaaaaa; }
      .wint { fill: #9dbfff; }
      .runt { fill: #ffcf85; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" class="t">One paragraph, five runs</text>

  <!-- paragraph -->
  <rect x="40" y="46" width="820" height="92" rx="8" class="par"/>
  <text x="56" y="70" font-size="14" font-weight="bold" class="wint">XWPFParagraph</text>
  <text x="170" y="70" font-size="12" class="m">w:p, with pPr: style, alignment, spacing, indentation</text>
  <text x="56" y="112" font-size="20" class="t">Your loan of <tspan font-weight="bold" font-style="italic">Dune</tspan> is due on <tspan font-weight="bold" fill="#c0392b">2026-11-02</tspan>.</text>

  <!-- connectors -->
  <path d="M130 138 L130 190" class="ln" marker-end="url(#ar)"/>
  <path d="M340 138 L340 190" class="ln" marker-end="url(#ar)"/>
  <path d="M520 138 L520 190" class="ln" marker-end="url(#ar)"/>
  <path d="M740 138 L740 190" class="ln" marker-end="url(#ar)"/>

  <!-- runs -->
  <rect x="40" y="192" width="190" height="118" rx="8" class="run"/>
  <text x="54" y="214" font-size="14" font-weight="bold" class="runt">XWPFRun 1</text>
  <text x="54" y="236" font-size="12" class="m">formatting: none</text>
  <text x="54" y="258" font-size="12" class="m">text:</text>
  <text x="54" y="278" font-size="13" class="t code">"Your loan of "</text>
  <text x="54" y="298" font-size="11" class="m">trailing space is kept</text>

  <rect x="245" y="192" width="190" height="118" rx="8" class="run"/>
  <text x="259" y="214" font-size="14" font-weight="bold" class="runt">XWPFRun 2</text>
  <text x="259" y="236" font-size="12" class="m">formatting: bold, italic</text>
  <text x="259" y="258" font-size="12" class="m">text:</text>
  <text x="259" y="278" font-size="13" class="t code">"Dune"</text>

  <rect x="450" y="192" width="190" height="118" rx="8" class="run"/>
  <text x="464" y="214" font-size="14" font-weight="bold" class="runt">XWPFRun 3</text>
  <text x="464" y="236" font-size="12" class="m">formatting: none</text>
  <text x="464" y="258" font-size="12" class="m">text:</text>
  <text x="464" y="278" font-size="13" class="t code">" is due on "</text>

  <rect x="655" y="192" width="205" height="118" rx="8" class="run"/>
  <text x="669" y="214" font-size="14" font-weight="bold" class="runt">XWPFRun 4</text>
  <text x="669" y="236" font-size="12" class="m">formatting: bold, colour C0392B</text>
  <text x="669" y="258" font-size="12" class="m">text:</text>
  <text x="669" y="278" font-size="13" class="t code">"2026-11-02"</text>
  <text x="669" y="298" font-size="11" class="m">XWPFRun 5 is plain: "."</text>

  <!-- xml -->
  <rect x="40" y="338" width="820" height="96" rx="8" class="box"/>
  <text x="56" y="360" font-size="13" font-weight="bold" class="t">What the file contains (word/document.xml, simplified)</text>
  <text x="56" y="382" class="t code">&lt;w:p&gt;&lt;w:pPr&gt;&lt;w:jc w:val="left"/&gt;&lt;/w:pPr&gt;</text>
  <text x="56" y="400" class="t code">  &lt;w:r&gt;&lt;w:t xml:space="preserve"&gt;Your loan of &lt;/w:t&gt;&lt;/w:r&gt;  &lt;w:r&gt;&lt;w:rPr&gt;&lt;w:b/&gt;&lt;w:i/&gt;&lt;/w:rPr&gt;&lt;w:t&gt;Dune&lt;/w:t&gt;&lt;/w:r&gt; ...</text>
  <text x="56" y="418" class="t code">&lt;/w:p&gt;</text>

  <text x="450" y="458" text-anchor="middle" font-size="12" class="m">Word chooses the run boundaries (editing history, spell check, language); the text you type as one word can be several runs.</text>
</svg>
