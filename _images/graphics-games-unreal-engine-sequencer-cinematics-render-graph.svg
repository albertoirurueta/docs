<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Movie Render Graph: two render layers from one sequence</text>
<rect x="20" y="48" width="720" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="66" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Global nodes (apply to the whole job)</text>
<rect x="32" y="76" width="130" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="97.0" y="92.8" text-anchor="middle" font-size="11" fill="#92400E">Sampling Method</text>
<rect x="172" y="76" width="130" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="237.0" y="92.8" text-anchor="middle" font-size="11" fill="#92400E">Camera Settings</text>
<rect x="312" y="76" width="130" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="377.0" y="92.8" text-anchor="middle" font-size="11" fill="#92400E">Warm Up</text>
<rect x="452" y="76" width="130" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="517.0" y="92.8" text-anchor="middle" font-size="11" fill="#92400E">Debug Settings</text>
<rect x="592" y="76" width="130" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="657.0" y="92.8" text-anchor="middle" font-size="11" fill="#92400E">Game Overrides</text>
<text x="20" y="144" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Chain 1: beauty</text>
<rect x="20" y="150" width="128" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84.0" y="172.8" text-anchor="middle" font-size="11" fill="#3730A3">Render Layer</text>
<text x="84.0" y="186.8" text-anchor="middle" font-size="11" fill="#3730A3">"beauty"</text>
<line x1="148" y1="176" x2="170" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="170" y="150" width="128" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="234.0" y="165.8" text-anchor="middle" font-size="11" fill="#3730A3">Deferred Renderer</text>
<text x="234.0" y="179.8" text-anchor="middle" font-size="11" fill="#3730A3">spatial samples,</text>
<text x="234.0" y="193.8" text-anchor="middle" font-size="11" fill="#3730A3">anti-aliasing</text>
<line x1="298" y1="176" x2="320" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="320" y="150" width="128" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="384.0" y="165.8" text-anchor="middle" font-size="11" fill="#3730A3">Output File Type</text>
<text x="384.0" y="179.8" text-anchor="middle" font-size="11" fill="#3730A3">EXR, tokens in</text>
<text x="384.0" y="193.8" text-anchor="middle" font-size="11" fill="#3730A3">the file name</text>
<line x1="448" y1="176" x2="470" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="470" y="150" width="128" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="534.0" y="172.8" text-anchor="middle" font-size="11" fill="#3730A3">Output</text>
<text x="534.0" y="186.8" text-anchor="middle" font-size="11" fill="#3730A3">to disk</text>
<text x="20" y="244" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Chain 2: book matte</text>
<rect x="20" y="250" width="128" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="84.0" y="272.9" text-anchor="middle" font-size="11" fill="#047857">Render Layer</text>
<text x="84.0" y="286.9" text-anchor="middle" font-size="11" fill="#047857">"matte"</text>
<line x1="148" y1="276" x2="170" y2="276" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="170" y="250" width="128" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="234.0" y="265.9" text-anchor="middle" font-size="11" fill="#047857">Modifier</text>
<text x="234.0" y="279.9" text-anchor="middle" font-size="11" fill="#047857">Collection: books</text>
<text x="234.0" y="293.9" text-anchor="middle" font-size="11" fill="#047857">Holdout on</text>
<line x1="298" y1="276" x2="320" y2="276" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="320" y="250" width="128" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="384.0" y="272.9" text-anchor="middle" font-size="11" fill="#047857">Deferred Renderer</text>
<text x="384.0" y="286.9" text-anchor="middle" font-size="11" fill="#047857">per-layer options</text>
<line x1="448" y1="276" x2="470" y2="276" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="470" y="250" width="128" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="534.0" y="272.9" text-anchor="middle" font-size="11" fill="#047857">Output File Type</text>
<text x="534.0" y="286.9" text-anchor="middle" font-size="11" fill="#047857">PNG or EXR</text>
<rect x="20" y="330" width="720" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="350" text-anchor="middle" font-size="11" fill="#374151">A Render Layer node marks a chain for rendering; a chain without one passes its logic out of the graph.</text>
<text x="380" y="366" text-anchor="middle" font-size="11" fill="#374151">Choose the Path Traced Renderer or the Deferred Renderer per layer by connecting the matching node.</text>
</svg>
