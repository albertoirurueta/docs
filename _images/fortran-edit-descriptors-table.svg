<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The same values written with different edit descriptors</title>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One value, many fields: what each edit descriptor writes</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">output of gfortran 16.2 and LLVM Flang 23 (identical for every cell shown); square brackets mark the edges of the field</text>
  <rect x="30" y="70" width="880" height="30" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="42" y="90" font-size="13" font-weight="bold" fill="#1c4b73">real(real64) value</text>
  <text x="200" y="90" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">f8.3</text>
  <text x="360" y="90" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">es12.4</text>
  <text x="540" y="90" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">en12.3</text>
  <text x="720" y="90" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">g12.4</text>
  <rect x="30" y="100" width="880" height="34" fill="#ffffff" stroke="#c8d0d8"/>
  <text x="42" y="122" font-size="14" font-family="Courier New, monospace" fill="#222222">36.25</text>
  <text x="200" y="122" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  36.250]</text>
  <text x="360" y="122" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  3.6250E+01]</text>
  <text x="540" y="122" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  36.250E+00]</text>
  <text x="720" y="122" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[   36.25    ]</text>
  <rect x="30" y="134" width="880" height="34" fill="#f6f8fa" stroke="#c8d0d8"/>
  <text x="42" y="156" font-size="14" font-family="Courier New, monospace" fill="#222222">0.000123456</text>
  <text x="200" y="156" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[   0.000]</text>
  <text x="360" y="156" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  1.2346E-04]</text>
  <text x="540" y="156" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[ 123.456E-06]</text>
  <text x="720" y="156" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  0.1235E-03]</text>
  <rect x="30" y="168" width="880" height="34" fill="#ffffff" stroke="#c8d0d8"/>
  <text x="42" y="190" font-size="14" font-family="Courier New, monospace" fill="#222222">4721.3</text>
  <text x="200" y="190" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[4721.300]</text>
  <text x="360" y="190" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  4.7213E+03]</text>
  <text x="540" y="190" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[   4.721E+03]</text>
  <text x="720" y="190" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[   4721.    ]</text>
  <rect x="30" y="202" width="880" height="34" fill="#f6f8fa" stroke="#c8d0d8"/>
  <text x="42" y="224" font-size="14" font-family="Courier New, monospace" fill="#222222">6.02214076e23</text>
  <text x="200" y="224" font-size="14" font-family="Courier New, monospace" fill="#a33333" xml:space="preserve">[********]</text>
  <text x="360" y="224" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  6.0221E+23]</text>
  <text x="540" y="224" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[ 602.214E+21]</text>
  <text x="720" y="224" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  0.6022E+24]</text>
  <text x="42" y="258" font-size="12.5" fill="#444444">f8.3 fills the field with asterisks when the value does not fit (red); es always has one digit before the point, en an exponent that is a multiple of three;</text>
  <text x="42" y="276" font-size="12.5" fill="#444444">g12.4 chooses f or e by magnitude and leaves four blanks where the exponent would be. The w, d and e fields are 13.3.2 (R1307); the layouts are 13.7.2.</text>
  <rect x="30" y="302" width="880" height="30" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="42" y="322" font-size="13" font-weight="bold" fill="#1c4b73">integer value</text>
  <text x="200" y="322" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">i8</text>
  <text x="320" y="322" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">i0</text>
  <text x="400" y="322" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">i8.5</text>
  <text x="520" y="322" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">g0</text>
  <text x="640" y="322" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1c4b73">z0</text>
  <rect x="30" y="332" width="880" height="34" fill="#ffffff" stroke="#c8d0d8"/>
  <text x="42" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222">41</text>
  <text x="200" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[      41]</text>
  <text x="320" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[41]</text>
  <text x="400" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[   00041]</text>
  <text x="520" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[41]</text>
  <text x="640" y="354" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[29]</text>
  <rect x="30" y="366" width="880" height="34" fill="#f6f8fa" stroke="#c8d0d8"/>
  <text x="42" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222">-7</text>
  <text x="200" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[      -7]</text>
  <text x="320" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[-7]</text>
  <text x="400" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[  -00007]</text>
  <text x="520" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[-7]</text>
  <text x="640" y="388" font-size="14" font-family="Courier New, monospace" fill="#222222" xml:space="preserve">[FFFFFFF9]</text>
  <text x="42" y="422" font-size="12.5" fill="#444444">i0 and g0 pick the narrowest field, i8.5 forces at least five digits, z0 shows the two's complement bit pattern without leading zero bits.</text>
  <text x="42" y="440" font-size="12.5" fill="#444444">g0 on a real is processor dependent (gfortran writes 17 digits, Flang the shortest digits that read back the same), so it is not part of this table.</text>
</svg>
