<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtPipeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What each phase of dotnet build writes</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">samples/Ledgerline.Report, Debug, net10.0 -- files observed after a clean build with SDK 10.0.402</text>
<rect x="20" y="80" width="225" height="330" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="132" y="104" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Source tree</text>
<text x="132" y="122" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">input</text>
<text x="34" y="150" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report.csproj</text>
<text x="34" y="178" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Program.cs</text>
<text x="34" y="206" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">journal.ledger.csv</text>
<text x="34" y="234" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">../Directory.Build.props</text>
<text x="34" y="262" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">../Directory.Packages.props</text>
<text x="34" y="290" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">../nuget.config</text>
<text x="34" y="318" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">../global.json</text>
<rect x="265" y="80" width="225" height="330" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="377" y="104" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1. Restore (NuGet)</text>
<text x="377" y="122" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">writes obj/</text>
<text x="279" y="150" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">project.assets.json</text>
<text x="279" y="178" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">project.nuget.cache</text>
<text x="279" y="206" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.csproj.nuget.dgspec.json</text>
<text x="279" y="234" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.csproj.nuget.g.props</text>
<text x="279" y="262" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.csproj.nuget.g.targets</text>
<text x="279" y="290" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">packages.lock.json is</text>
<text x="279" y="318" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  written next to the csproj</text>
<rect x="510" y="80" width="225" height="330" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="622" y="104" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">2. Build (MSBuild + Roslyn)</text>
<text x="622" y="122" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">writes obj/Debug/net10.0/</text>
<text x="524" y="150" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.AssemblyInfo.cs</text>
<text x="524" y="178" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.GlobalUsings.g.cs</text>
<text x="524" y="206" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.GeneratedMSBuildEditor-</text>
<text x="524" y="234" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  Config.editorconfig</text>
<text x="524" y="262" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.dll  *.pdb</text>
<text x="524" y="290" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">ref/*.dll  refint/*.dll</text>
<text x="524" y="318" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">apphost</text>
<text x="524" y="346" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.cache, FileListAbsolute.txt</text>
<rect x="755" y="80" width="225" height="330" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="867" y="104" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">3. Copy to output</text>
<text x="867" y="122" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">writes bin/Debug/net10.0/</text>
<text x="769" y="150" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report.dll  .pdb</text>
<text x="769" y="178" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report (apphost)</text>
<text x="769" y="206" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.deps.json</text>
<text x="769" y="234" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.runtimeconfig.json</text>
<text x="769" y="262" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.dll (from package)</text>
<text x="769" y="290" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">journal.ledger.csv</text>
<line x1="245" y1="245" x2="263" y2="245" stroke="#444444" stroke-width="2" marker-end="url(#cbtPipeArrow)"/>
<line x1="490" y1="245" x2="508" y2="245" stroke="#444444" stroke-width="2" marker-end="url(#cbtPipeArrow)"/>
<line x1="735" y1="245" x2="753" y2="245" stroke="#444444" stroke-width="2" marker-end="url(#cbtPipeArrow)"/>
<rect x="20" y="430" width="960" height="110" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
<text x="36" y="452" font-size="12" fill="#333333" text-anchor="start">Before any target runs, MSBuild evaluates the project (environment, imports and properties, item definitions,</text>
<text x="36" y="470" font-size="12" fill="#333333" text-anchor="start">items, UsingTask, targets). Restore runs as a separate evaluation-and-build first, because packages can add imports</text>
<text x="36" y="488" font-size="12" fill="#333333" text-anchor="start">(nuget.g.props / nuget.g.targets) that change the next evaluation. dotnet build = dotnet msbuild -restore.</text>
<text x="36" y="514" font-size="12" fill="#555555" text-anchor="start">Outputs read at run time: .deps.json (which assemblies to load) and .runtimeconfig.json (which shared runtime to use).</text>
</svg>
