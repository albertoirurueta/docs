<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
<title id="t">Callbacks run on a tree of fit tasks</title>
<desc id="d">A schematic tree of fit tasks: a grid search fit contains candidate and fold tasks, each containing a pipeline fit with a scaler fit and a logistic regression fit made of iterations. A progress bar callback registered on the grid search is propagated to every level, while a scoring monitor registered on the logistic regression logs a score at the end of each iteration.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Callbacks observe a tree of fit tasks (schematic)</text>
<rect x="215" y="52" width="170" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="300" y="76" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">GridSearchCV.fit</text>
<rect x="215" y="124" width="170" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="300" y="148" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">candidate x fold</text>
<rect x="215" y="196" width="170" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="300" y="220" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Pipeline.fit</text>
<rect x="95" y="268" width="150" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="170" y="292" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">StandardScaler.fit</text>
<rect x="355" y="268" width="190" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="450" y="292" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">LogisticRegression.fit</text>
<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2">
<rect x="340" y="330" width="46" height="30" rx="6"/><rect x="396" y="330" width="46" height="30" rx="6"/><rect x="452" y="330" width="46" height="30" rx="6"/><rect x="508" y="330" width="46" height="30" rx="6"/></g>
<g font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace"><text x="363" y="350">it 1</text><text x="419" y="350">it 2</text><text x="475" y="350">it 3</text><text x="531" y="350">...</text></g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M300,90 L300,122"/><path d="M300,162 L300,194"/><path d="M270,234 L190,266"/><path d="M330,234 L430,266"/><path d="M420,306 L380,328"/><path d="M480,306 L500,328"/></g>
<rect x="580" y="52" width="124" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="642" y="74" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">ProgressBar</text>
<text x="642" y="92" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">auto-propagated:</text>
<text x="642" y="108" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">set on the top level</text>
<path d="M580,87 L387,71" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
<rect x="580" y="196" width="124" height="70" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="642" y="218" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">ScoringMonitor</text>
<text x="642" y="236" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">regular: logs a score</text>
<text x="642" y="252" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">per task of its estimator</text>
<path d="M580,250 L546,282" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
<text x="20" y="64" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">dashed arrows: where a callback is registered</text>
</svg>
