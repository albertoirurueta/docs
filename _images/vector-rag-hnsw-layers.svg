<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">HNSW: layered graph and greedy descent</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Search starts at the entry point in the sparse top layer and descends toward the query</text>

  <!-- layer bands -->
  <rect x="40" y="70" width="680" height="100" fill="#f7f9fc" stroke="#dde3ee" stroke-width="1"/>
  <rect x="40" y="185" width="680" height="120" fill="#f5f8f4" stroke="#dfe9dc" stroke-width="1"/>
  <rect x="40" y="320" width="680" height="120" fill="#fdf6f0" stroke="#eee0cf" stroke-width="1"/>

  <text x="52" y="90" font-size="12" font-weight="bold" fill="#3a5a8c">Layer 2 (top, sparse)</text>
  <text x="52" y="205" font-size="12" font-weight="bold" fill="#3e6b34">Layer 1 (middle)</text>
  <text x="52" y="340" font-size="12" font-weight="bold" fill="#a05a1c">Layer 0 (bottom -- every point)</text>

  <!-- Layer 2 nodes -->
  <circle cx="150" cy="130" r="10" fill="#3a5a8c"/>
  <circle cx="360" cy="120" r="10" fill="#3a5a8c"/>
  <circle cx="600" cy="140" r="10" fill="#3a5a8c"/>
  <line x1="150" y1="130" x2="360" y2="120" stroke="#3a5a8c" stroke-width="1.5"/>
  <line x1="360" y1="120" x2="600" y2="140" stroke="#3a5a8c" stroke-width="1.5"/>
  <text x="150" y="155" font-size="10" fill="#666666" text-anchor="middle">entry point</text>

  <!-- Layer 1 nodes -->
  <circle cx="150" cy="245" r="9" fill="#3e6b34"/>
  <circle cx="250" cy="260" r="9" fill="#3e6b34"/>
  <circle cx="360" cy="235" r="9" fill="#3e6b34"/>
  <circle cx="470" cy="255" r="9" fill="#3e6b34"/>
  <circle cx="600" cy="245" r="9" fill="#3e6b34"/>
  <line x1="150" y1="245" x2="250" y2="260" stroke="#3e6b34" stroke-width="1.3"/>
  <line x1="250" y1="260" x2="360" y2="235" stroke="#3e6b34" stroke-width="1.3"/>
  <line x1="360" y1="235" x2="470" y2="255" stroke="#3e6b34" stroke-width="1.3"/>
  <line x1="470" y1="255" x2="600" y2="245" stroke="#3e6b34" stroke-width="1.3"/>

  <!-- drop-down links between layers (same node id continues down) -->
  <line x1="150" y1="140" x2="150" y2="236" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="130" x2="360" y2="226" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="150" x2="600" y2="236" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Layer 0 nodes: many more points, denser connectivity -->
  <g fill="#a05a1c">
    <circle cx="90" cy="370" r="7"/>
    <circle cx="150" cy="380" r="7"/>
    <circle cx="205" cy="360" r="7"/>
    <circle cx="250" cy="390" r="7"/>
    <circle cx="300" cy="365" r="7"/>
    <circle cx="360" cy="375" r="7"/>
    <circle cx="415" cy="355" r="7"/>
    <circle cx="470" cy="385" r="7"/>
    <circle cx="530" cy="365" r="7"/>
    <circle cx="600" cy="375" r="7"/>
    <circle cx="660" cy="360" r="7"/>
    <circle cx="690" cy="390" r="7"/>
  </g>
  <g stroke="#c9a26a" stroke-width="1">
    <line x1="90" y1="370" x2="150" y2="380"/>
    <line x1="150" y1="380" x2="205" y2="360"/>
    <line x1="205" y1="360" x2="250" y2="390"/>
    <line x1="250" y1="390" x2="300" y2="365"/>
    <line x1="300" y1="365" x2="360" y2="375"/>
    <line x1="360" y1="375" x2="415" y2="355"/>
    <line x1="415" y1="355" x2="470" y2="385"/>
    <line x1="470" y1="385" x2="530" y2="365"/>
    <line x1="530" y1="365" x2="600" y2="375"/>
    <line x1="600" y1="375" x2="660" y2="360"/>
    <line x1="660" y1="360" x2="690" y2="390"/>
  </g>

  <!-- drop-down links continuing from layer 1 -->
  <line x1="150" y1="254" x2="150" y2="373" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="244" x2="360" y2="368" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="254" x2="600" y2="368" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- query point and greedy path -->
  <circle cx="530" cy="365" r="7" fill="#c0392b" stroke="#c0392b"/>
  <circle cx="470" cy="255" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="600" cy="140" r="10" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 150 130 L 600 140 L 600 245 L 470 255 L 530 365"
        fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- query marker -->
  <circle cx="655" cy="410" r="9" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="655" y="414" font-size="11" fill="#c0392b" text-anchor="middle">q</text>
  <line x1="530" y1="365" x2="646" y2="404" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,3"/>

  <text x="380" y="440" font-size="11" fill="#555555" text-anchor="middle">Dashed red path: greedy walk from the entry point down through the layers to the query's nearest neighbor</text>
</svg>
