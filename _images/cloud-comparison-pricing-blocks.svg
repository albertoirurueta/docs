<text class="footer" x="24" y="506" text-anchor="start"><tspan x="24" dy="0">Sources: anthropic-pricing, aws-price-bedrock, aws-price-datatransfer, aws-price-ec2, aws-price-eks, aws-price-lambda, aws-price-rds, aws-price-s3, azure-retail-prices-api,</tspan><tspan x="24" dy="15">gcp-pricing-compute, gcp-pricing-gke, gcp-pricing-network, gcp-pricing-run, gcp-pricing-sql, gcp-pricing-storage, gcp-pricing-vertex. Data as of 2026-10-26. Prices in USD, US East region,</tspan><tspan x="24" dy="15">Linux and shared tenancy where relevant; instances differ in vCPU and memory, see the pricing data. Index = price / cheapest price x 100.</tspan></text>
