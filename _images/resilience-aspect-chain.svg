<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Spring proxy runs the aspects from the lowest order value inwards</text>
  <defs>
    <marker id="ac-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="ac-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- caller -->
  <rect x="14" y="110" width="76" height="130" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="52" y="168" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Caller</text>
  <text x="52" y="184" font-size="10.5" fill="#444444" text-anchor="middle">another</text>
  <text x="52" y="198" font-size="10.5" fill="#444444" text-anchor="middle">bean</text>
  <line x1="90" y1="160" x2="106" y2="160" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#ac-arrow)"/>

  <!-- proxy -->
  <rect x="108" y="56" width="682" height="228" rx="10" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="449" y="76" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf bean proxy (CGLIB subclass, one advisor chain per method)</text>
  <rect x="118" y="92" width="82" height="140" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="159" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Retry</text>
  <text x="159" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@Retry</text>
  <text x="159" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="159" y="192" font-size="10" fill="#444444" text-anchor="middle">− 5</text>
  <text x="159" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483642</text>
  <line x1="200" y1="130" x2="214" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="214" y="92" width="82" height="140" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="255" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Circuit</text>
  <text x="255" y="132" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Breaker</text>
  <text x="255" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@CircuitBreaker</text>
  <text x="255" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="255" y="192" font-size="10" fill="#444444" text-anchor="middle">− 4</text>
  <text x="255" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483643</text>
  <line x1="296" y1="130" x2="310" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="310" y="92" width="82" height="140" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="351" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Rate</text>
  <text x="351" y="132" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Limiter</text>
  <text x="351" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@RateLimiter</text>
  <text x="351" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="351" y="192" font-size="10" fill="#444444" text-anchor="middle">− 3</text>
  <text x="351" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483644</text>
  <line x1="392" y1="130" x2="406" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="406" y="92" width="82" height="140" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="447" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Time</text>
  <text x="447" y="132" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Limiter</text>
  <text x="447" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@TimeLimiter</text>
  <text x="447" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="447" y="192" font-size="10" fill="#444444" text-anchor="middle">− 2</text>
  <text x="447" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483645</text>
  <line x1="488" y1="130" x2="502" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="502" y="92" width="82" height="140" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="543" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Bulkhead</text>
  <text x="543" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@Bulkhead</text>
  <text x="543" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="543" y="192" font-size="10" fill="#444444" text-anchor="middle">− 1</text>
  <text x="543" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483646</text>
  <line x1="584" y1="130" x2="598" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="598" y="92" width="82" height="140" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="639" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Timer</text>
  <text x="639" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@Timer</text>
  <text x="639" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="639" y="192" font-size="10" fill="#444444" text-anchor="middle">+ 0</text>
  <text x="639" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483647</text>
  <line x1="680" y1="130" x2="694" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <rect x="694" y="92" width="82" height="140" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="735" y="118" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Transaction</text>
  <text x="735" y="132" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">advisor</text>
  <text x="735" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">@Transactional</text>
  <text x="735" y="178" font-size="10" fill="#444444" text-anchor="middle">LOWEST</text>
  <text x="735" y="192" font-size="10" fill="#444444" text-anchor="middle">+ 0</text>
  <text x="735" y="214" font-size="9" fill="#666666" text-anchor="middle">2147483647</text>
  <line x1="790" y1="160" x2="806" y2="160" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#ac-arrow)"/>

  <!-- target -->
  <rect x="808" y="110" width="80" height="130" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="848" y="160" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Target</text>
  <text x="848" y="176" font-size="10.5" fill="#444444" text-anchor="middle">the real</text>
  <text x="848" y="190" font-size="10.5" fill="#444444" text-anchor="middle">method</text>

  <!-- direction strip -->
  <line x1="130" y1="262" x2="760" y2="262" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ac-arrow)"/>
  <text x="445" y="256" font-size="10.5" fill="#1c4b73" text-anchor="middle">the call travels inwards: the lowest value is entered first, so it is the outer layer</text>
  <line x1="760" y1="276" x2="130" y2="276" stroke="#b03030" stroke-width="1.6" marker-end="url(#ac-arrow-red)"/>
  <text x="445" y="296" font-size="10.5" fill="#b03030" text-anchor="middle">the result or exception travels outwards through every layer, which sees it in turn</text>

  <!-- notes -->
  <rect x="14" y="320" width="282" height="128" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="155" y="342" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Order is a number, not source order</text>
  <text x="155" y="362" font-size="10.5" fill="#444444" text-anchor="middle">The order of the annotations in the</text>
  <text x="155" y="377" font-size="10.5" fill="#444444" text-anchor="middle">source file changes nothing. Change it</text>
  <text x="155" y="392" font-size="10.5" fill="#444444" text-anchor="middle">with resilience4j.*.xxxAspectOrder;</text>
  <text x="155" y="407" font-size="10.5" fill="#444444" text-anchor="middle">the values are absolute, set all or none.</text>
  <text x="155" y="430" font-size="10.5" fill="#666666" text-anchor="middle">Lower value = higher precedence = outer.</text>

  <rect x="309" y="320" width="282" height="128" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="450" y="342" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">A fallback is not a layer</text>
  <text x="450" y="362" font-size="10.5" fill="#444444" text-anchor="middle">fallbackMethod runs inside the aspect</text>
  <text x="450" y="377" font-size="10.5" fill="#444444" text-anchor="middle">that declares it. On an inner annotation</text>
  <text x="450" y="392" font-size="10.5" fill="#444444" text-anchor="middle">it turns the failure into a success, so</text>
  <text x="450" y="407" font-size="10.5" fill="#444444" text-anchor="middle">every layer outside it sees no error.</text>
  <text x="450" y="430" font-size="10.5" fill="#666666" text-anchor="middle">Declare it on the outermost annotation.</text>

  <rect x="604" y="320" width="282" height="128" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="745" y="342" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Other advisors share the line</text>
  <text x="745" y="362" font-size="10.5" fill="#444444" text-anchor="middle">@Transactional and @Timer default to</text>
  <text x="745" y="377" font-size="10.5" fill="#444444" text-anchor="middle">LOWEST_PRECEDENCE: inside the five</text>
  <text x="745" y="392" font-size="10.5" fill="#444444" text-anchor="middle">pattern aspects, so each retry attempt</text>
  <text x="745" y="407" font-size="10.5" fill="#444444" text-anchor="middle">gets its own transaction. Equal values</text>
  <text x="745" y="422" font-size="10.5" fill="#444444" text-anchor="middle">have no defined order between them.</text>
  <text x="745" y="440" font-size="10" fill="#666666" text-anchor="middle">dashed boxes: not Resilience4j patterns</text>
</svg>
