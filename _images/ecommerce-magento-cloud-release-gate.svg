<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Release gate of a Pocket Coffee Magento release</title>
<desc id="d">A flow chart of the release steps. The image is built and tagged with the git SHA, an RDS snapshot is taken, and the pre-upgrade Job pocketcoffee-migrate runs as the database user mg_migrate. The Job asks setup:db:status for its exit code. Exit code 0 means the database is up to date, so only app:config:import runs. Exit code 2 means an upgrade is needed, so setup:upgrade with the option keep-generated runs. Exit code 1 means Magento is not installed or the database is wrong, and the release stops. Then one question decides how the pods are replaced: if the old code can run on the new schema because the change only adds things, the pods are replaced by a rolling update without maintenance mode; if not, the release is a breaking release with maintenance mode on, cron suspended and consumers paused, followed by the rolling update. After the rollout on every path the cache is cleaned, which purges Varnish, the warm-up Job requests the key URLs, a smoke test runs, maintenance mode is switched off and cron and consumers resume. The ways back are helm rollback, which returns the code only, and restoring the snapshot into a new RDS instance, which returns the database and loses the orders placed after the snapshot.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker>
</defs>
<rect x="0" y="0" width="960" height="720" rx="14" fill="#2b3a4a"/>
<text x="30" y="38" font-size="18" font-weight="bold" fill="#f4b860">Release gate: the exit code of setup:db:status and one question decide the path</text>
<rect x="30" y="60" width="200" height="60" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
<text x="130.0" y="80" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Build</text>
<text x="130.0" y="98" font-size="12" fill="#f2f5f8" text-anchor="middle">image tagged with the git SHA</text>
<text x="130.0" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">di:compile, static content, config.php</text>
<polyline points="231,90 269,90" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<rect x="270" y="60" width="200" height="60" rx="8" fill="#4d7c5a" stroke="#9fd3c7" stroke-width="2"/>
<text x="370.0" y="80" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Snapshot</text>
<text x="370.0" y="98" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS pocketcoffee-prod</text>
<text x="370.0" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">pocketcoffee-pre-&lt;git-sha&gt;</text>
<polyline points="471,90 509,90" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<rect x="510" y="60" width="260" height="60" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
<text x="640.0" y="80" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Job pocketcoffee-migrate</text>
<text x="640.0" y="98" font-size="12" fill="#f2f5f8" text-anchor="middle">pre-upgrade hook, new image</text>
<text x="640.0" y="114" font-size="12" fill="#f2f5f8" text-anchor="middle">user mg_migrate</text>
<polyline points="640,121 640,154" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<polygon points="640,155 760,205 640,255 520,205" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
<text x="640" y="203" font-size="12" fill="#f2f5f8" text-anchor="middle">setup:db:status</text>
<text x="640" y="217" font-size="12" fill="#f2f5f8" text-anchor="middle">exit code?</text>
<polyline points="520,205 471,205" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<text x="496" y="196" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="middle">0</text>
<rect x="270" y="170" width="200" height="70" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
<text x="370.0" y="190" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Up to date</text>
<text x="370.0" y="208" font-size="12" fill="#f2f5f8" text-anchor="middle">no schema or data change:</text>
<text x="370.0" y="224" font-size="12" fill="#f2f5f8" text-anchor="middle">app:config:import only</text>
<polyline points="640,256 640,289" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<text x="654" y="276" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="start">2</text>
<rect x="510" y="290" width="260" height="70" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
<text x="640.0" y="310" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">setup:upgrade --keep-generated</text>
<text x="640.0" y="328" font-size="12" fill="#f2f5f8" text-anchor="middle">schema, patches, config import,</text>
<text x="640.0" y="344" font-size="12" fill="#f2f5f8" text-anchor="middle">generated code kept</text>
<polyline points="760,205 799,205" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<text x="780" y="196" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="middle">1</text>
<rect x="800" y="170" width="130" height="70" rx="8" fill="#7a5c3a" stroke="#f4b860" stroke-width="2"/>
<text x="865.0" y="190" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Stop</text>
<text x="865.0" y="208" font-size="12" fill="#f2f5f8" text-anchor="middle">not installed:</text>
<text x="865.0" y="224" font-size="12" fill="#f2f5f8" text-anchor="middle">wrong database</text>
<text x="865.0" y="240" font-size="12" fill="#f2f5f8" text-anchor="middle">or empty schema</text>
<polyline points="640,361 640,390" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<polygon points="640,390 770,438 640,486 510,438" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2"/>
<text x="640" y="436" font-size="12" fill="#f2f5f8" text-anchor="middle">old code runs on</text>
<text x="640" y="450" font-size="12" fill="#f2f5f8" text-anchor="middle">the new schema?</text>
<polyline points="510,438 471,438" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<text x="490" y="428" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="middle">yes</text>
<rect x="270" y="400" width="200" height="70" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
<text x="370.0" y="420" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Rolling update</text>
<text x="370.0" y="438" font-size="12" fill="#f2f5f8" text-anchor="middle">no maintenance mode,</text>
<text x="370.0" y="454" font-size="12" fill="#f2f5f8" text-anchor="middle">pods replaced a few at a time</text>
<polyline points="370,241 370,399" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<polyline points="640,487 640,520" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<text x="654" y="508" font-size="12" font-weight="bold" fill="#9fd3c7" text-anchor="start">no</text>
<rect x="510" y="521" width="260" height="64" rx="8" fill="#7a5c3a" stroke="#f4b860" stroke-width="2"/>
<text x="640.0" y="541" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Breaking release</text>
<text x="640.0" y="559" font-size="12" fill="#f2f5f8" text-anchor="middle">maintenance on, cron suspended,</text>
<text x="640.0" y="575" font-size="12" fill="#f2f5f8" text-anchor="middle">consumers paused, then rolling update</text>
<polyline points="510,553 370,553 370,471" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<polyline points="270,435 150,435 150,619" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="620" width="430" height="84" rx="8" fill="#2f4a44" stroke="#9fd3c7" stroke-width="2"/>
<text x="245.0" y="640" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">After the rollout, on every path</text>
<text x="245.0" y="658" font-size="12" fill="#f2f5f8" text-anchor="middle">cache:clean (purges Varnish), Job pocketcoffee-warmup,</text>
<text x="245.0" y="674" font-size="12" fill="#f2f5f8" text-anchor="middle">smoke test, maintenance off, cron and consumers resumed</text>
<rect x="480" y="620" width="450" height="84" rx="8" fill="#3d5266" stroke="#c9b3e6" stroke-width="2"/>
<text x="705.0" y="640" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">Ways back</text>
<text x="705.0" y="658" font-size="12" fill="#f2f5f8" text-anchor="middle">helm rollback returns the code only, hooks do not run again;</text>
<text x="705.0" y="674" font-size="12" fill="#f2f5f8" text-anchor="middle">a snapshot restore returns the database in a new instance</text>
<text x="705.0" y="690" font-size="12" fill="#f2f5f8" text-anchor="middle">and loses the orders placed after the snapshot</text>
</svg>
