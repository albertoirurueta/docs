<text x="380" y="216" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">input state</text>
<line x1="460" y1="280" x2="300" y2="280" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-webgl-offscreencanvas-and-workers-thread-split)"/>
<text x="380" y="272" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">score, stats</text>
<text x="380" y="345" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The worker draws straight into the page canvas; no pixels are copied through postMessage.</text>
</svg>
