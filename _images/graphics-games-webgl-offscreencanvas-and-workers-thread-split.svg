<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-offscreencanvas-and-workers-thread-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Who owns what: main thread and render worker</text>
<rect x="20" y="50" width="300" height="270" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="170.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="170" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Main thread</text>
<rect x="40" y="90" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="116.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">DOM, CSS, layout, events</text>
<rect x="40" y="146" width="260" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="164.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">&lt;canvas&gt; element (visible)</text>
<text x="170.0" y="179.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">transferControlToOffscreen()</text>
<rect x="40" y="202" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="220.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Pointer, wheel, key, resize listeners</text>
<text x="170.0" y="235.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">copy plain fields, postMessage</text>
<rect x="40" y="258" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="276.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">HUD: score overlay (HTML)</text>
<text x="170.0" y="291.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">updated from worker messages</text>
<rect x="440" y="50" width="300" height="270" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="590.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="590" y="72" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Worker thread</text>
