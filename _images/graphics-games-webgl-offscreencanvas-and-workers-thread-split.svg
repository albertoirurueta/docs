<text x="590.0" y="108.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">OffscreenCanvas + WebGL2 context</text>
<text x="590.0" y="123.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(all gl.* calls live here)</text>
<rect x="460" y="146" width="260" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="590.0" y="164.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">requestAnimationFrame loop</text>
<text x="590.0" y="179.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(synced to the canvas display)</text>
<rect x="460" y="202" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="590.0" y="220.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Scene state, camera, picking</text>
<text x="590.0" y="235.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">reads the proxied input state</text>
<rect x="460" y="258" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="590.0" y="276.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fetch + createImageBitmap</text>
<text x="590.0" y="291.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">texture upload without the main thread</text>
<line x1="300" y1="168" x2="460" y2="112" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-offscreencanvas-and-workers-thread-split)"/>
<text x="380" y="128" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">canvas (transferred)</text>
