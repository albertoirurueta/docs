<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 936" width="1130" height="936" font-family="Helvetica, Arial, sans-serif">
  <title>The GWT widget class hierarchy: UIObject, Widget, FocusWidget, value boxes, labels, Composite and Panel</title>
  <desc>UIObject is the root of the user-interface classes in com.google.gwt.user.client.ui. MenuItem and TreeItem extend UIObject directly and are not widgets. Widget extends UIObject and adds the DOM event hooks and the attach and detach lifecycle. FocusWidget is the base of the buttons, check boxes, value boxes, list boxes, file uploads, anchors and the rich text area. LabelBase leads to Label, HTML, InlineLabel and the value labels. Image, Hyperlink, Hidden, MenuBar, Tree and Frame extend Widget directly. Composite is the base of SuggestBox, DateBox, ValueListBox and TabBar and of every custom widget built from other widgets. Panel leads to SimplePanel and FormPanel.</desc>
  <rect x="0" y="0" width="1130" height="936" fill="#f8fafc"/>
  <text x="565" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">The widget class hierarchy of gwt-user 2.13.1 (package com.google.gwt.user.client.ui)</text>
  <text x="20" y="52" font-size="12" fill="#334155">Each line joins a class to its direct subclasses; boxes with several names list sibling classes.</text>
