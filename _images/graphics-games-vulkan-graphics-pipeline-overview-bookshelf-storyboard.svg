<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-gpo-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Building the Bookshelf book pipeline in five steps</text>
<rect x="15" y="55" width="132" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="81.0" y="111.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Shader modules</text>
<text x="81.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3">book.slang to</text>
<text x="81.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">book.spv, two</text>
<text x="81.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">entry points</text>
<circle cx="27" cy="55" r="11" fill="#4F46E5"/>
<text x="27" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="147" y1="130" x2="163" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-sb)"/>
<rect x="163" y="55" width="132" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="229.0" y="111.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Pipeline layout</text>
<text x="229.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3">set 0 camera UBO</text>
<text x="229.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">set 1 textures</text>
<text x="229.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">push model matrix</text>
<circle cx="175" cy="55" r="11" fill="#4F46E5"/>
<text x="175" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="295" y1="130" x2="311" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-sb)"/>
<rect x="311" y="55" width="132" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="377.0" y="111.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Fixed state</text>
<text x="377.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3">triangle list</text>
<text x="377.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">back-face cull</text>
<text x="377.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">depth test on</text>
<circle cx="323" cy="55" r="11" fill="#4F46E5"/>
<text x="323" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="443" y1="130" x2="459" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-sb)"/>
<rect x="459" y="55" width="132" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="525.0" y="111.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Create</text>
<text x="525.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3">dynamic rendering</text>
<text x="525.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">formats, pNext</text>
<text x="525.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">creation feedback</text>
<circle cx="471" cy="55" r="11" fill="#B45309"/>
<text x="471" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="591" y1="130" x2="607" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-sb)"/>
<rect x="607" y="55" width="132" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="673.0" y="111.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Record</text>
<text x="673.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3">bind pipeline</text>
<text x="673.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">bind sets, draw</text>
<text x="673.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">book box</text>
<circle cx="619" cy="55" r="11" fill="#4F46E5"/>
<text x="619" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="81" y="225" text-anchor="middle" font-size="10" fill="#6B7280">load SPIR-V bytes</text>
<text x="229" y="225" text-anchor="middle" font-size="10" fill="#6B7280">vkCreatePipelineLayout</text>
<text x="377" y="225" text-anchor="middle" font-size="10" fill="#6B7280">Vulkan-Hpp info structs</text>
<text x="525" y="225" text-anchor="middle" font-size="10" fill="#6B7280">vkCreateGraphicsPipelines</text>
<text x="673" y="225" text-anchor="middle" font-size="10" fill="#6B7280">vkCmdBindPipeline</text>
<rect x="15" y="250" width="730" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="276.4" text-anchor="middle" font-size="11" fill="#374151">Steps 1 to 4 run once at load time and may be threaded.</text>
<text x="380.0" y="291.4" text-anchor="middle" font-size="11" fill="#374151">Step 5 runs every frame inside the render loop.</text>
</svg>
