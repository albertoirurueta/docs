<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">{&quot;error&quot;:{&quot;message&quot;:&quot;Posting period 2026/002 is closed for company code EX01&quot;,&quot;code&quot;:&quot;400&quot;,&quot;target&quot;:&quot;in/PostingDate&quot;,&quot;</text>
