<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sm-lv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Shadow mapping: compare the light distance with the stored one</text>
<polygon points="400,320 658,320 400,200" fill="#E5E7EB" opacity="0.8"/>
<line x1="40" y1="320" x2="730" y2="320" stroke="#374151" stroke-width="2"/>
<rect x="330" y="200" width="70" height="120" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="365" y="265" font-size="11" fill="#92400E" text-anchor="middle">book box</text>
<text x="365" y="280" font-size="11" fill="#92400E" text-anchor="middle">(occluder)</text>
<circle cx="120" cy="70" r="16" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="120" y="48" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">lamp (light)</text>
<line x1="120" y1="70" x2="240" y2="320" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="120" y1="70" x2="330" y2="200" stroke="#B45309" stroke-width="1.5"/>
<line x1="120" y1="70" x2="658" y2="320" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="120" y1="70" x2="700" y2="320" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="120" y1="70" x2="520" y2="320" stroke="#B45309" stroke-width="1.2" stroke-dasharray="2 3"/>
<line x1="165" y1="52" x2="190" y2="105" stroke="#4F46E5" stroke-width="5"/>
<text x="210" y="62" font-size="11" fill="#3730A3">shadow map: nearest</text>
<text x="210" y="76" font-size="11" fill="#3730A3">depth seen by the light</text>
<circle cx="240" cy="320" r="6" fill="#047857"/>
<text x="240" y="345" font-size="11" fill="#047857" text-anchor="middle">A: lit</text>
<text x="240" y="360" font-size="10" fill="#374151" text-anchor="middle">distance = stored depth</text>
<circle cx="520" cy="320" r="6" fill="#B45309"/>
<text x="520" y="345" font-size="11" fill="#92400E" text-anchor="middle">B: in shadow</text>
<text x="520" y="360" font-size="10" fill="#374151" text-anchor="middle">distance greater than stored depth</text>
<circle cx="700" cy="320" r="6" fill="#047857"/>
<text x="700" y="345" font-size="11" fill="#047857" text-anchor="middle">C: lit</text>
<circle cx="680" cy="100" r="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="680" y="80" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">camera</text>
<line x1="668" y1="110" x2="526" y2="314" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-sm-lv)"/>
<text x="610" y="190" font-size="10" fill="#3730A3">eye ray to B</text>
<text x="380" y="396" font-size="12" fill="#374151" text-anchor="middle">Pass 1 stores the nearest depth per texel from the light. Pass 2 transforms each visible point into light space and compares.</text>
</svg>
