<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of the bottom toolbar</text>
  <rect x="80" y="60" width="600" height="56" rx="28" fill="#1F2937"/>
  <rect x="100" y="76" width="64" height="24" rx="12" fill="#4F46E5"/><text x="132" y="92" font-size="11" fill="#FFFFFF" text-anchor="middle">Design</text>
  <circle cx="200" cy="88" r="9" fill="#9CA3AF"/><circle cx="240" cy="88" r="9" fill="#9CA3AF"/><circle cx="280" cy="88" r="9" fill="#9CA3AF"/><circle cx="320" cy="88" r="9" fill="#9CA3AF"/><circle cx="360" cy="88" r="9" fill="#9CA3AF"/><circle cx="400" cy="88" r="9" fill="#9CA3AF"/>
  <rect x="440" y="78" width="110" height="20" rx="10" fill="#374151"/><text x="495" y="92" font-size="11" fill="#FFFFFF" text-anchor="middle">Actions  Cmd+K</text>
  <rect x="580" y="78" width="80" height="20" rx="10" fill="#374151"/><text x="620" y="92" font-size="11" fill="#FFFFFF" text-anchor="middle">Zoom 100%</text>
<circle cx="132" cy="140" r="11" fill="#4F46E5"/><text x="132" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="300" cy="140" r="11" fill="#B45309"/><text x="300" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="495" cy="140" r="11" fill="#4F46E5"/><text x="495" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="620" cy="140" r="11" fill="#4F46E5"/><text x="620" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <path d="M132 129 L132 118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)" transform="rotate(180 132 123.5)"/>
  <text x="40" y="190" font-size="12" fill="#374151">1  Mode switcher: Design and the other modes your file type offers (Draw, Motion, Dev Mode)</text>
  <text x="40" y="212" font-size="12" fill="#374151">2  Tools: move, frame (F), shape (R), pen, text (T), comment; pan with H or hold Space</text>
  <text x="40" y="234" font-size="12" fill="#374151">3  Actions menu: Ctrl+K on Windows, Cmd+K on macOS; searches commands, assets, plugins, AI tools</text>
  <text x="40" y="256" font-size="12" fill="#374151">4  Zoom and view options: Shift+1 fit, Shift+2 selection; also in the right sidebar</text>
  <text x="40" y="282" font-size="11" fill="#6B7280">Schematic: the exact icons and their order change between releases; view-only users see Ask to edit instead.</text>
</svg>
