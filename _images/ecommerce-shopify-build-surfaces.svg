<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <title id="t">The four Shopify build surfaces around the hosted platform</title>
  <desc id="d">Themes, apps, extensions and headless storefronts all talk to one hosted Shopify platform that holds products, orders, customers, checkout and payments.</desc>
  <rect x="270" y="150" width="220" height="140" rx="14" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>
  <text x="380" y="182" text-anchor="middle" font-weight="bold" font-size="16">Shopify platform</text>
  <text x="380" y="208" text-anchor="middle">products, orders, customers</text>
  <text x="380" y="228" text-anchor="middle">inventory, discounts, markets</text>
  <text x="380" y="248" text-anchor="middle">checkout and payments</text>
  <text x="380" y="272" text-anchor="middle" font-size="12" opacity="0.8">hosted SaaS, no servers to run</text>

  <rect x="20" y="20" width="300" height="100" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="48" text-anchor="middle" font-weight="bold">1. Themes</text>
  <text x="170" y="70" text-anchor="middle">Liquid, JSON templates, sections, blocks</text>
  <text x="170" y="90" text-anchor="middle">Online Store, edited by merchants</text>
  <text x="170" y="108" text-anchor="middle" font-size="12" opacity="0.8">Shopify CLI theme commands</text>

  <rect x="440" y="20" width="300" height="100" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="590" y="48" text-anchor="middle" font-weight="bold">2. Apps</text>
  <text x="590" y="70" text-anchor="middle">Admin GraphQL API, webhooks, billing</text>
  <text x="590" y="90" text-anchor="middle">embedded UI with App Bridge and Polaris</text>
  <text x="590" y="108" text-anchor="middle" font-size="12" opacity="0.8">public (App Store) or custom</text>

  <rect x="20" y="320" width="300" height="100" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="348" text-anchor="middle" font-weight="bold">3. Extensions</text>
  <text x="170" y="370" text-anchor="middle">checkout and admin UI, theme app blocks</text>
  <text x="170" y="390" text-anchor="middle">Shopify Functions (Wasm), web pixels, Flow, POS</text>
  <text x="170" y="408" text-anchor="middle" font-size="12" opacity="0.8">shipped inside an app, run on Shopify</text>

  <rect x="440" y="320" width="300" height="100" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="590" y="348" text-anchor="middle" font-weight="bold">4. Headless</text>
  <text x="590" y="370" text-anchor="middle">Storefront API, Customer Account API</text>
  <text x="590" y="390" text-anchor="middle">Hydrogen toolkit, Oxygen hosting, own front end</text>
  <text x="590" y="408" text-anchor="middle" font-size="12" opacity="0.8">checkout still hosted by Shopify</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M170 120 L170 220 L270 220"/>
    <path d="M590 120 L590 220 L490 220"/>
    <path d="M170 320 L170 230 L270 230" />
    <path d="M590 320 L590 230 L490 230"/>
  </g>
</svg>
