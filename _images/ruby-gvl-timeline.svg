<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Three Ruby threads taking turns on the GVL</title>
  <desc>A timeline with four rows. The top row shows which thread owns the global VM lock: A, B, A, B, C, A, B in turns, with C holding it only briefly. Thread A and thread B are CPU-bound and alternate on each time slice while the other waits for the lock. Thread C starts a blocking I/O call, which releases the lock for the whole wait, so A and B keep running during it. When the I/O finishes C waits for the lock until the current time slice ends, runs briefly and blocks on I/O again.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470.0" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Three threads taking turns on the GVL</text>
  <text x="470.0" y="50" font-size="12" fill="#666666" text-anchor="middle">A and B compute, C keeps waiting for I/O: only one thread runs Ruby code at any instant</text>
  <line x1="200" y1="82" x2="894" y2="82" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="898" y="86" font-size="12" fill="#444444">time</text>
  <line x1="200" y1="78" x2="200" y2="86" stroke="#444444"/>
  <line x1="276" y1="78" x2="276" y2="86" stroke="#444444"/>
  <line x1="352" y1="78" x2="352" y2="86" stroke="#444444"/>
  <line x1="428" y1="78" x2="428" y2="86" stroke="#444444"/>
  <line x1="504" y1="78" x2="504" y2="86" stroke="#444444"/>
  <line x1="580" y1="78" x2="580" y2="86" stroke="#444444"/>
  <line x1="656" y1="78" x2="656" y2="86" stroke="#444444"/>
  <line x1="732" y1="78" x2="732" y2="86" stroke="#444444"/>
  <line x1="808" y1="78" x2="808" y2="86" stroke="#444444"/>
  <line x1="884" y1="78" x2="884" y2="86" stroke="#444444"/>
  <text x="200" y="72" font-size="11" fill="#666666" text-anchor="start">a CPU-bound thread gives up the GVL when its time slice ends or when it blocks</text>
  <text x="186" y="133" font-size="14" font-weight="bold" fill="#222222" text-anchor="end">GVL owner</text>
  <rect x="200" y="110" width="684" height="36" fill="#fafafa" stroke="#cccccc"/>
  <text x="186" y="193" font-size="14" font-weight="bold" fill="#222222" text-anchor="end">Thread A (CPU)</text>
  <rect x="200" y="170" width="684" height="36" fill="#fafafa" stroke="#cccccc"/>
  <text x="186" y="253" font-size="14" font-weight="bold" fill="#222222" text-anchor="end">Thread B (CPU)</text>
  <rect x="200" y="230" width="684" height="36" fill="#fafafa" stroke="#cccccc"/>
  <text x="186" y="313" font-size="14" font-weight="bold" fill="#222222" text-anchor="end">Thread C (I/O)</text>
  <rect x="200" y="290" width="684" height="36" fill="#fafafa" stroke="#cccccc"/>
  <rect x="276" y="178" width="106.39999999999999" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="458.4" y="178" width="76.00000000000003" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="610.4000000000001" y="178" width="106.39999999999996" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="792.8" y="178" width="76.00000000000007" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="200" y="238" width="76" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="352" y="238" width="106.39999999999999" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="534.4000000000001" y="238" width="76.0" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="686.4000000000001" y="238" width="106.39999999999996" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="868.8000000000001" y="238" width="15.199999999999946" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="382.4" y="294" width="273.6" height="28" fill="#eef7ee" stroke="#276a2c" stroke-dasharray="1 4" stroke-width="2"/>
  <text x="519.2" y="314" font-size="12" fill="#276a2c" text-anchor="middle">blocked in I/O, GVL released</text>
  <rect x="716.8" y="294" width="167.20000000000002" height="28" fill="#eef7ee" stroke="#276a2c" stroke-dasharray="1 4" stroke-width="2"/>
  <text x="800.4" y="314" font-size="12" fill="#276a2c" text-anchor="middle">blocked in I/O, GVL released</text>
  <rect x="200" y="298" width="152" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="656.0" y="298" width="30.400000000000002" height="20" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <rect x="200" y="170" width="76" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
