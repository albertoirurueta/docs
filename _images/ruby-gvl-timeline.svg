  <rect x="792.8" y="110" width="76.00000000000007" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="830.8000000000001" y="133" font-size="14" font-weight="bold" fill="#9a4f0f" text-anchor="middle">B</text>
  <rect x="868.8000000000001" y="110" width="15.199999999999946" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="876.4" y="133" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">A</text>
  <line x1="656.0" y1="362" x2="656.0" y2="330" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="664.0" y="378" font-size="12" fill="#222222" text-anchor="start">I/O done: C is ready, waits for the GVL</text>
  <line x1="367.20000000000005" y1="362" x2="367.20000000000005" y2="330" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="375.20000000000005" y="378" font-size="12" fill="#222222" text-anchor="start">C blocks in a read: GVL released</text>
  <rect x="200" y="400" width="30" height="16" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="238" y="413" font-size="12" fill="#222222">running Ruby code (holds the GVL)</text>
  <rect x="480" y="400" width="30" height="16" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <text x="518" y="413" font-size="12" fill="#222222">ready, waiting for the GVL</text>
  <rect x="720" y="400" width="30" height="16" fill="#eef7ee" stroke="#276a2c" stroke-dasharray="1 4" stroke-width="2"/>
  <text x="758" y="413" font-size="12" fill="#222222">blocked, not using the GVL</text>
  <text x="200" y="444" font-size="12" fill="#444444">Native extensions such as zlib can also release the GVL around long C calls, so those threads run truly in parallel.</text>
</svg>
