  <rect x="382.4" y="170" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="420.4" y="193" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">run</text>
  <rect x="534.4000000000001" y="170" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="572.4000000000001" y="193" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">run</text>
  <rect x="716.8" y="170" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="754.8" y="193" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">run</text>
  <rect x="868.8000000000001" y="170" width="15.199999999999946" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <rect x="276" y="230" width="76" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="314.0" y="253" font-size="13" font-weight="bold" fill="#9a4f0f" text-anchor="middle">run</text>
  <rect x="458.4" y="230" width="76.00000000000003" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="496.40000000000003" y="253" font-size="13" font-weight="bold" fill="#9a4f0f" text-anchor="middle">run</text>
  <rect x="610.4000000000001" y="230" width="76.0" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="648.4000000000001" y="253" font-size="13" font-weight="bold" fill="#9a4f0f" text-anchor="middle">run</text>
  <rect x="792.8" y="230" width="76.00000000000007" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="830.8000000000001" y="253" font-size="13" font-weight="bold" fill="#9a4f0f" text-anchor="middle">run</text>
  <rect x="352" y="290" width="30.39999999999999" height="36" fill="#cfe8d0" stroke="#276a2c" stroke-width="1.5"/>
  <rect x="686.4000000000001" y="290" width="30.39999999999996" height="36" fill="#cfe8d0" stroke="#276a2c" stroke-width="1.5"/>
  <rect x="200" y="110" width="76" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="238.0" y="133" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">A</text>
  <rect x="276" y="110" width="76" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="314.0" y="133" font-size="14" font-weight="bold" fill="#9a4f0f" text-anchor="middle">B</text>
  <rect x="352" y="110" width="30.39999999999999" height="36" fill="#cfe8d0" stroke="#276a2c" stroke-width="1.5"/>
  <text x="367.20000000000005" y="133" font-size="14" font-weight="bold" fill="#276a2c" text-anchor="middle">C</text>
  <rect x="382.4" y="110" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="420.4" y="133" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">A</text>
  <rect x="458.4" y="110" width="76.00000000000003" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="496.40000000000003" y="133" font-size="14" font-weight="bold" fill="#9a4f0f" text-anchor="middle">B</text>
  <rect x="534.4000000000001" y="110" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="572.4000000000001" y="133" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">A</text>
  <rect x="610.4000000000001" y="110" width="76.0" height="36" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.5"/>
  <text x="648.4000000000001" y="133" font-size="14" font-weight="bold" fill="#9a4f0f" text-anchor="middle">B</text>
  <rect x="686.4000000000001" y="110" width="30.39999999999996" height="36" fill="#cfe8d0" stroke="#276a2c" stroke-width="1.5"/>
  <text x="701.5999999999999" y="133" font-size="14" font-weight="bold" fill="#276a2c" text-anchor="middle">C</text>
  <rect x="716.8" y="110" width="76.0" height="36" fill="#cfe0f1" stroke="#1c4b73" stroke-width="1.5"/>
