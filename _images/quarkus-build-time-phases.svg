<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Quarkus' three-phase execution model</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">augmentation runs once, at build time -- static init runs once per process family -- runtime init runs on every start</text>

  <!-- Augmentation -->
  <rect x="30" y="80" width="210" height="220" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="135" y="106" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Augmentation</text>
  <text x="135" y="122" font-size="10" fill="#555555" text-anchor="middle">build time -- once per build</text>
  <text x="46" y="146" font-size="10" fill="#333333">- extensions run build steps</text>
  <text x="46" y="162" font-size="10" fill="#333333">- build items flow between them</text>
  <text x="46" y="178" font-size="10" fill="#333333">- classpath scanned once, here</text>
  <text x="46" y="194" font-size="10" fill="#333333">- CDI beans, config, routes</text>
  <text x="46" y="208" font-size="10" fill="#333333">  resolved ahead of time</text>
  <text x="46" y="224" font-size="10" fill="#333333">- @Recorder classes record</text>
  <text x="46" y="238" font-size="10" fill="#333333">  bytecode-generation instructions</text>
  <text x="46" y="254" font-size="10" fill="#333333">- deployment-module code runs</text>
  <text x="46" y="268" font-size="10" fill="#333333">  and is then discarded</text>
  <text x="46" y="288" font-size="9.5" fill="#1c4b73" font-style="italic">output: optimized recorded</text>
  <text x="46" y="300" font-size="9.5" fill="#1c4b73" font-style="italic">bytecode (the runtime module)</text>

  <!-- Static Init -->
  <rect x="275" y="80" width="210" height="220" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="106" font-size="13.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Static Init</text>
  <text x="380" y="122" font-size="10" fill="#555555" text-anchor="middle">native-image build (native) or</text>
  <text x="380" y="135" font-size="10" fill="#555555" text-anchor="middle">JVM class-init (JAR) -- once</text>
  <text x="291" y="158" font-size="10" fill="#333333">- recorded bytecode from</text>
  <text x="291" y="172" font-size="10" fill="#333333">  augmentation is replayed</text>
  <text x="291" y="188" font-size="10" fill="#333333">- no reflection scanning or</text>
  <text x="291" y="202" font-size="10" fill="#333333">  annotation processing needed</text>
  <text x="291" y="218" font-size="10" fill="#333333">- state that native-image can</text>
  <text x="291" y="232" font-size="10" fill="#333333">  bake into the image heap is</text>
  <text x="291" y="246" font-size="10" fill="#333333">  initialized here</text>
  <text x="291" y="262" font-size="10" fill="#333333">- for a native executable this</text>
  <text x="291" y="276" font-size="10" fill="#333333">  happens inside the builder,</text>
  <text x="291" y="290" font-size="10" fill="#333333">  not at process start</text>

  <!-- Runtime Init -->
  <rect x="520" y="80" width="210" height="220" rx="6" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="625" y="106" font-size="13.5" font-weight="bold" fill="#a33" text-anchor="middle">Runtime Init</text>
  <text x="625" y="122" font-size="10" fill="#555555" text-anchor="middle">every process start</text>
  <text x="536" y="146" font-size="10" fill="#333333">- recorded bytecode that needs</text>
  <text x="536" y="160" font-size="10" fill="#333333">  a real environment replays here</text>
  <text x="536" y="176" font-size="10" fill="#333333">- reads actual config values,</text>
  <text x="536" y="190" font-size="10" fill="#333333">  env vars, profile</text>
  <text x="536" y="206" font-size="10" fill="#333333">- opens sockets, connection</text>
  <text x="536" y="220" font-size="10" fill="#333333">  pools, file handles</text>
  <text x="536" y="236" font-size="10" fill="#333333">- this is the only phase a JAR</text>
  <text x="536" y="250" font-size="10" fill="#333333">  or native executable actually</text>
  <text x="536" y="264" font-size="10" fill="#333333">  pays on every restart</text>
  <text x="536" y="284" font-size="9.5" fill="#a33" font-style="italic">output: an application that</text>
  <text x="536" y="296" font-size="9.5" fill="#a33" font-style="italic">is ready to serve traffic</text>

  <!-- arrows between phases -->
  <line x1="240" y1="190" x2="275" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="485" y1="190" x2="520" y2="190" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- legend / caption -->
  <text x="380" y="340" font-size="10.5" fill="#666666" text-anchor="middle">Augmentation happens once, offline, at build time; only Static Init and Runtime Init cost anything at</text>
  <text x="380" y="354" font-size="10.5" fill="#666666" text-anchor="middle">process start -- and for a native executable, Static Init has already moved into the build too.</text>

  <rect x="30" y="375" width="700" height="30" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="393" font-size="9.5" fill="#666666" text-anchor="middle">deployment-module code (build steps, recorders) never ships; only the runtime module reaches production</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
