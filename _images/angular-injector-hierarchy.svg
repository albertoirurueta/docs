<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <defs>
    <marker id="aih-up" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
    <marker id="aih-plain" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
  </defs>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Injector hierarchy &#8212; a request walks up until a provider is found</text>

  <!-- ===== Environment injectors (left) ===== -->
  <text x="185" y="70" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Environment injectors</text>

  <rect x="70" y="84" width="230" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="185" y="112" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Root EnvironmentInjector</text>
  <text x="185" y="132" font-size="11" fill="#1c4b73" text-anchor="middle">bootstrapApplication + providedIn: 'root'</text>

  <rect x="90" y="200" width="210" height="70" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="195" y="228" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Lazy-route EnvironmentInjector</text>
  <text x="195" y="248" font-size="11" fill="#1c4b73" text-anchor="middle">route providers: [...]</text>

  <!-- lazy route -> root -->
  <line x1="180" y1="200" x2="170" y2="158" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#aih-plain)"/>

  <!-- ===== Element injectors (right) ===== -->
  <text x="575" y="70" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Element injectors</text>

  <rect x="460" y="84" width="230" height="60" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="575" y="110" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;app-root&gt;</text>
  <text x="575" y="128" font-size="11" fill="#1c4b73" text-anchor="middle">outermost element injector</text>

  <rect x="480" y="188" width="210" height="66" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="585" y="213" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;app-cart&gt;</text>
  <text x="585" y="231" font-size="11" fill="#1c4b73" text-anchor="middle">providers: [CartService]</text>
  <text x="585" y="247" font-size="10.5" fill="#2a6636" text-anchor="middle">provider found here &#10003;</text>

  <rect x="500" y="300" width="190" height="60" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="595" y="326" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;app-cart-line&gt;</text>
  <text x="595" y="344" font-size="11" fill="#1c4b73" text-anchor="middle">inject(CartService)</text>

  <!-- walk up: cart-line -> cart -> app-root -->
  <line x1="560" y1="300" x2="560" y2="256" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aih-up)"/>
  <line x1="545" y1="188" x2="545" y2="146" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aih-up)"/>

  <!-- app-root element injector -> environment injector -->
  <line x1="458" y1="120" x2="304" y2="120" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aih-up)"/>
  <text x="381" y="112" font-size="10" fill="#c25a1d" text-anchor="middle">then the environment branch</text>

  <text x="595" y="386" font-size="12" font-weight="bold" fill="#c25a1d" text-anchor="middle">request starts here</text>

  <!-- caption -->
  <text x="380" y="430" font-size="12.5" fill="#444444" text-anchor="middle">Resolution order: the element's own injector &#8594; each ancestor element injector &#8594;</text>
  <text x="380" y="450" font-size="12.5" fill="#444444" text-anchor="middle">the lazy-route environment injector (if any) &#8594; the root environment injector. First match wins.</text>
</svg>
