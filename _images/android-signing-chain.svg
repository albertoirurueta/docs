<svg viewBox="0 0 760 300" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <!-- Developer -->
  <rect x="20" y="110" width="140" height="80" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Developer</text>
  <text x="90" y="160" text-anchor="middle" font-size="12" fill="#333333">holds the</text>
  <text x="90" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1a56db">upload key</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="150" x2="215" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="187" y="138" text-anchor="middle" font-size="10.5" fill="#444444">signs AAB,</text>
  <text x="187" y="200" text-anchor="middle" font-size="10.5" fill="#444444">uploads to</text>
  <text x="187" y="212" text-anchor="middle" font-size="10.5" fill="#444444">Play Console</text>

  <!-- Google Play -->
  <rect x="220" y="100" width="150" height="100" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="295" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Google Play</text>
  <text x="295" y="148" text-anchor="middle" font-size="12" fill="#333333">verifies upload key,</text>
  <text x="295" y="164" text-anchor="middle" font-size="12" fill="#333333">strips it, re-signs</text>
  <text x="295" y="180" text-anchor="middle" font-size="12" fill="#333333">with the</text>
  <text x="295" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e7e34">app signing key</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="150" x2="425" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="397" y="138" text-anchor="middle" font-size="10.5" fill="#444444">generates</text>
  <text x="397" y="200" text-anchor="middle" font-size="10.5" fill="#444444">device-specific</text>
  <text x="397" y="212" text-anchor="middle" font-size="10.5" fill="#444444">signed APKs</text>

  <!-- App signing key store -->
  <rect x="430" y="110" width="150" height="80" rx="8" fill="#fdf3e0" stroke="#b5720a" stroke-width="1.5"/>
  <text x="505" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Play App Signing</text>
  <text x="505" y="160" text-anchor="middle" font-size="12" fill="#333333">stores the</text>
  <text x="505" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#b5720a">app signing key</text>

  <!-- Arrow 3 -->
  <line x1="580" y1="150" x2="635" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="607" y="138" text-anchor="middle" font-size="10.5" fill="#444444">installs</text>
  <text x="607" y="200" text-anchor="middle" font-size="10.5" fill="#444444">signature</text>
  <text x="607" y="212" text-anchor="middle" font-size="10.5" fill="#444444">verified</text>

  <!-- Device -->
  <rect x="640" y="110" width="100" height="80" rx="8" fill="#f3e8fd" stroke="#6a1bb5" stroke-width="1.5"/>
  <text x="690" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">User's</text>
  <text x="690" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">device</text>
  <text x="690" y="178" text-anchor="middle" font-size="11.5" fill="#333333">installs app</text>

  <!-- Footer note -->
  <text x="380" y="255" text-anchor="middle" font-size="12" fill="#555555">The upload key never leaves the developer's control; only Google ever holds the app signing key.</text>
  <text x="380" y="273" text-anchor="middle" font-size="12" fill="#555555">If the upload key is lost or compromised, Google can reset it without changing the app's identity on device.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
