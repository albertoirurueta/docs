<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 546" width="1000" height="546" font-family="Helvetica, Arial, sans-serif">
  <title>Channel matrix for a chat assistant</title>
  <desc>Comparison of twelve channels for exposing the DocsAssistant core: HTTP server-sent events, WebSocket, web chat widget, WebRTC data channel, XMPP, Microsoft Teams, WhatsApp Business, Apple Messages for Business, Slack, Telegram, Google Chat and RCS Business Messaging. For each channel the matrix shows how streaming is delivered, what rich user interface is available, how users are identified, what registration or approval is needed and the best fit. Pricing is deliberately left to each platform page.</desc>
  <rect x="0" y="0" width="1000" height="546" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Channel matrix: one DocsAssistant core, twelve adapters</text>
  <rect x="10" y="64" width="980" height="34" fill="#1e3a8a"/>
  <text x="20" y="86" font-size="13" font-weight="bold" fill="#ffffff">Channel</text>
  <text x="190" y="86" font-size="13" font-weight="bold" fill="#ffffff">Streaming</text>
  <text x="350" y="86" font-size="13" font-weight="bold" fill="#ffffff">Rich UI</text>
  <text x="500" y="86" font-size="13" font-weight="bold" fill="#ffffff">Identity</text>
  <text x="650" y="86" font-size="13" font-weight="bold" fill="#ffffff">Approval needed</text>
  <text x="810" y="86" font-size="13" font-weight="bold" fill="#ffffff">Best fit</text>
  <rect x="10" y="98" width="980" height="34" fill="#dbeafe"/>
  <text x="20" y="120" font-size="12" font-weight="bold" fill="#0f172a">SSE / HTTP API</text>
  <text x="190" y="120" font-size="12" fill="#0f172a">native token stream</text>
  <text x="350" y="120" font-size="12" fill="#0f172a">custom (you build it)</text>
  <text x="500" y="120" font-size="12" fill="#0f172a">your OAuth2 / OIDC</text>
  <text x="650" y="120" font-size="12" fill="#0f172a">none</text>
  <text x="810" y="120" font-size="12" fill="#0f172a">web and mobile apps you own</text>
  <rect x="10" y="132" width="980" height="34" fill="#eff6ff"/>
  <text x="20" y="154" font-size="12" font-weight="bold" fill="#0f172a">WebSocket</text>
  <text x="190" y="154" font-size="12" fill="#0f172a">native, bidirectional</text>
  <text x="350" y="154" font-size="12" fill="#0f172a">custom</text>
  <text x="500" y="154" font-size="12" fill="#0f172a">token on connect</text>
  <text x="650" y="154" font-size="12" fill="#0f172a">none</text>
  <text x="810" y="154" font-size="12" fill="#0f172a">interactive and multi-user chat</text>
  <rect x="10" y="166" width="980" height="34" fill="#dbeafe"/>
  <text x="20" y="188" font-size="12" font-weight="bold" fill="#0f172a">Web chat widget</text>
  <text x="190" y="188" font-size="12" fill="#0f172a">SSE token stream</text>
  <text x="350" y="188" font-size="12" fill="#0f172a">citations, buttons</text>
  <text x="500" y="188" font-size="12" fill="#0f172a">your session</text>
  <text x="650" y="188" font-size="12" fill="#0f172a">none</text>
  <text x="810" y="188" font-size="12" fill="#0f172a">embedded site assistant</text>
  <rect x="10" y="200" width="980" height="34" fill="#eff6ff"/>
  <text x="20" y="222" font-size="12" font-weight="bold" fill="#0f172a">WebRTC data channel</text>
  <text x="190" y="222" font-size="12" fill="#0f172a">native, ordered or not</text>
  <text x="350" y="222" font-size="12" fill="#0f172a">custom</text>
  <text x="500" y="222" font-size="12" fill="#0f172a">your signalling</text>
  <text x="650" y="222" font-size="12" fill="#0f172a">TURN server</text>
  <text x="810" y="222" font-size="12" fill="#0f172a">next to voice or video</text>
  <rect x="10" y="234" width="980" height="34" fill="#dbeafe"/>
  <text x="20" y="256" font-size="12" font-weight="bold" fill="#0f172a">XMPP</text>
  <text x="190" y="256" font-size="12" fill="#0f172a">edits (XEP-0308)</text>
  <text x="350" y="256" font-size="12" fill="#0f172a">limited</text>
  <text x="500" y="256" font-size="12" fill="#0f172a">JID + SASL</text>
  <text x="650" y="256" font-size="12" fill="#0f172a">XMPP server</text>
  <text x="810" y="256" font-size="12" fill="#0f172a">federated, self-hosted chat</text>
  <rect x="10" y="268" width="980" height="34" fill="#f5f3ff"/>
  <text x="20" y="290" font-size="12" font-weight="bold" fill="#0f172a">Microsoft Teams</text>
  <text x="190" y="290" font-size="12" fill="#0f172a">streaming in 1:1</text>
  <text x="350" y="290" font-size="12" fill="#0f172a">Adaptive Cards</text>
  <text x="500" y="290" font-size="12" fill="#0f172a">Entra ID SSO</text>
  <text x="650" y="290" font-size="12" fill="#0f172a">Azure Bot + manifest</text>
  <text x="810" y="290" font-size="12" fill="#0f172a">employees in Microsoft 365</text>
  <rect x="10" y="302" width="980" height="34" fill="#ede9fe"/>
  <text x="20" y="324" font-size="12" font-weight="bold" fill="#0f172a">WhatsApp Business</text>
  <text x="190" y="324" font-size="12" fill="#0f172a">whole messages</text>
  <text x="350" y="324" font-size="12" fill="#0f172a">buttons, lists</text>
  <text x="500" y="324" font-size="12" fill="#0f172a">phone number</text>
  <text x="650" y="324" font-size="12" fill="#0f172a">Meta app + WABA</text>
  <text x="810" y="324" font-size="12" fill="#0f172a">customers; 24 h window</text>
  <rect x="10" y="336" width="980" height="34" fill="#f5f3ff"/>
  <text x="20" y="358" font-size="12" font-weight="bold" fill="#0f172a">Apple Messages</text>
  <text x="190" y="358" font-size="12" fill="#0f172a">whole messages</text>
  <text x="350" y="358" font-size="12" fill="#0f172a">list picker, Pay</text>
  <text x="500" y="358" font-size="12" fill="#0f172a">Apple ID, opaque</text>
  <text x="650" y="358" font-size="12" fill="#0f172a">MSP + Business Register</text>
  <text x="810" y="358" font-size="12" fill="#0f172a">iPhone customers</text>
  <rect x="10" y="370" width="980" height="34" fill="#ede9fe"/>
  <text x="20" y="392" font-size="12" font-weight="bold" fill="#0f172a">Slack</text>
  <text x="190" y="392" font-size="12" fill="#0f172a">stream + status</text>
  <text x="350" y="392" font-size="12" fill="#0f172a">Block Kit</text>
  <text x="500" y="392" font-size="12" fill="#0f172a">workspace user</text>
  <text x="650" y="392" font-size="12" fill="#0f172a">app install</text>
  <text x="810" y="392" font-size="12" fill="#0f172a">team and ops assistants</text>
  <rect x="10" y="404" width="980" height="34" fill="#f5f3ff"/>
  <text x="20" y="426" font-size="12" font-weight="bold" fill="#0f172a">Telegram</text>
  <text x="190" y="426" font-size="12" fill="#0f172a">draft streaming</text>
  <text x="350" y="426" font-size="12" fill="#0f172a">keyboards</text>
  <text x="500" y="426" font-size="12" fill="#0f172a">chat id</text>
  <text x="650" y="426" font-size="12" fill="#0f172a">BotFather token</text>
  <text x="810" y="426" font-size="12" fill="#0f172a">communities, prototypes</text>
  <rect x="10" y="438" width="980" height="34" fill="#ede9fe"/>
  <text x="20" y="460" font-size="12" font-weight="bold" fill="#0f172a">Google Chat</text>
  <text x="190" y="460" font-size="12" fill="#0f172a">edits / cards</text>
  <text x="350" y="460" font-size="12" fill="#0f172a">cards</text>
  <text x="500" y="460" font-size="12" fill="#0f172a">Workspace user</text>
  <text x="650" y="460" font-size="12" fill="#0f172a">add-on deployment</text>
  <text x="810" y="460" font-size="12" fill="#0f172a">Workspace organisations</text>
  <rect x="10" y="472" width="980" height="34" fill="#f5f3ff"/>
  <text x="20" y="494" font-size="12" font-weight="bold" fill="#0f172a">RCS (RBM)</text>
  <text x="190" y="494" font-size="12" fill="#0f172a">whole messages</text>
  <text x="350" y="494" font-size="12" fill="#0f172a">rich cards, chips</text>
  <text x="500" y="494" font-size="12" fill="#0f172a">phone number</text>
  <text x="650" y="494" font-size="12" fill="#0f172a">partner + carrier launch</text>
  <text x="810" y="494" font-size="12" fill="#0f172a">Android customers</text>
  <text x="20" y="528" font-size="11" fill="#334155">Blue rows: your own surfaces. Purple rows: business channels. Pricing and policy limits are linked from each channel page, not shown here.</text>
</svg>
