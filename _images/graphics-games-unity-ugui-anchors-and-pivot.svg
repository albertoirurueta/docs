<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-ugui-anchor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">RectTransform anchors, pivot and offsets</text>
<text x="190" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Anchors together: fixed size</text>
<rect x="30" y="70" width="320" height="210" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="40" y="88" font-size="10" fill="#374151">parent rectangle</text>
<rect x="130" y="130" width="120" height="60" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<polygon points="190,152 198,160 190,168 182,160" fill="#B45309"/>
<circle cx="190" cy="160" r="3" fill="#4F46E5"/>
<text x="190" y="214" text-anchor="middle" font-size="11" fill="#3730A3">Pos X, Pos Y, Width, Height</text>
<text x="190" y="230" text-anchor="middle" font-size="10" fill="#374151">anchor min = max = (0.5, 0.5)</text>
<text x="190" y="246" text-anchor="middle" font-size="10" fill="#374151">pivot at the child centre, offset from the anchor</text>
<text x="190" y="264" text-anchor="middle" font-size="10" fill="#374151">child keeps its size when the parent resizes</text>
<text x="570" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Anchors apart: stretch</text>
<rect x="400" y="70" width="330" height="210" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="410" y="88" font-size="10" fill="#374151">parent rectangle</text>
<rect x="430" y="110" width="270" height="130" rx="2" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="430,110 423,100 437,100" fill="#B45309"/>
<polygon points="700,240 693,250 707,250" fill="#B45309"/>
<text x="565" y="104" text-anchor="middle" font-size="10" fill="#92400E">anchor min (0.1, 0.2) to anchor max (0.9, 0.8)</text>
<rect x="445" y="125" width="240" height="100" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<line x1="430" y1="175" x2="445" y2="175" stroke="#4B5563" stroke-width="1.2" marker-end="url(#ah-unity-ugui-anchor)"/>
<line x1="700" y1="175" x2="685" y2="175" stroke="#4B5563" stroke-width="1.2" marker-end="url(#ah-unity-ugui-anchor)"/>
<text x="565" y="172" text-anchor="middle" font-size="11" fill="#1F2937">Left, Right, Top, Bottom</text>
<text x="565" y="188" text-anchor="middle" font-size="10" fill="#374151">padding inside the anchor rectangle</text>
<text x="565" y="264" text-anchor="middle" font-size="10" fill="#374151">child grows and shrinks with the parent</text>
<rect x="30" y="300" width="700" height="105" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730A3">Reading the Inspector</text>
<text x="50" y="344" font-size="11" fill="#3730A3">Anchor positions are fractions of the parent: 0 is left or bottom, 0.5 the middle, 1 right or top.</text>
<text x="50" y="361" font-size="11" fill="#3730A3">Pivot is the point that rotation, scaling and Pos X, Pos Y refer to; (0.5, 0.5) is the centre.</text>
<text x="50" y="378" font-size="11" fill="#3730A3">Resizing a RectTransform with the Rect Tool changes width and height, not the local scale.</text>
<text x="50" y="395" font-size="11" fill="#3730A3">Anchor presets (the square button at the top left of the component) set common layouts in one click.</text>
</svg>
