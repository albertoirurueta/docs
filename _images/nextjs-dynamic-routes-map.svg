<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From folders to URLs to params in the Bookshelf App Router</title>
  <desc id="d">A three-column table maps each file under app/[locale] to the URL it serves and to the params object the page receives. Route group folders in parentheses disappear from the URL, square brackets capture one segment, [...path] captures one or more segments as an array, [[...slug]] also matches the bare route with undefined, and a folder starting with an underscore is private and has no URL.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Folder, URL and params: how the Bookshelf routes map</text>
  <text x="450.0" y="47" font-size="12" fill="#555555" text-anchor="middle">[locale] is the root parameter; (shop) and (marketing) are route groups; _components is a private folder</text>
  <rect x="14" y="66" width="360" height="30" fill="#1d3557"/>
  <rect x="374" y="66" width="200" height="30" fill="#1d3557"/>
  <rect x="574" y="66" width="312" height="30" fill="#1d3557"/>
  <text x="26" y="86" font-size="13" font-weight="bold" fill="#ffffff">Folder (file in app/)</text>
  <text x="386" y="86" font-size="13" font-weight="bold" fill="#ffffff">URL</text>
  <text x="586" y="86" font-size="13" font-weight="bold" fill="#ffffff">params</text>

  <rect x="14" y="96" width="872" height="44" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="26" y="123" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/(shop)/page.tsx</text>
  <text x="386" y="123" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">/en</text>
  <text x="586" y="123" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">{ locale: &#x27;en&#x27; }</text>
  <rect x="14" y="146" width="872" height="44" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="26" y="173" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/(shop)/books/[id]/page.tsx</text>
  <text x="386" y="173" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">/en/books/3</text>
  <text x="586" y="173" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">{ locale: &#x27;en&#x27;, id: &#x27;3&#x27; }</text>
  <rect x="14" y="196" width="872" height="44" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="26" y="223" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/(shop)/shelf/[...path]/page.tsx</text>
  <text x="386" y="223" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">/en/shelf/fiction/sci-fi</text>
  <text x="586" y="223" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">{ locale: &#x27;en&#x27;, path: [&#x27;fiction&#x27;,&#x27;sci-fi&#x27;] }</text>
  <rect x="14" y="246" width="872" height="44" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="26" y="273" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/(marketing)/docs/[[...slug]]/page.tsx</text>
  <text x="386" y="273" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">/en/docs  and  /en/docs/a/b</text>
  <text x="586" y="273" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">{ slug: undefined }  and  { slug: [&#x27;a&#x27;,&#x27;b&#x27;] }</text>
  <rect x="14" y="296" width="872" height="44" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.2"/>
  <text x="26" y="323" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/(marketing)/about/page.tsx</text>
  <text x="386" y="323" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">/en/about</text>
  <text x="586" y="323" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">{ locale: &#x27;en&#x27; }</text>
  <rect x="14" y="346" width="872" height="44" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.2"/>
  <text x="26" y="373" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1d3557">app/[locale]/_components/book-card.tsx</text>
  <text x="386" y="373" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#14411f">(no URL)</text>
  <text x="586" y="373" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#333333">not routable: private folder</text>
  <rect x="14" y="404" width="872" height="62" fill="#f4f4f4" stroke="#444444" stroke-width="1.2"/>
  <text x="26" y="424" font-size="12" font-weight="bold" fill="#222222">Reading the table</text>
  <text x="26" y="442" font-size="12" fill="#333333">(shop) and (marketing) vanish from the URL; they only group files and let each group have its own layout.</text>
  <text x="26" y="458" font-size="12" fill="#333333">[id] is one segment (string); [...path] is one or more (string[]); [[...slug]] is zero or more (string[] | undefined).</text>
</svg>
