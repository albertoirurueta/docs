<svg viewBox="0 0 760 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="490" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where each declaration lives: Person.h and Person.m</text>

  <!-- .h panel -->
  <rect x="25" y="50" width="345" height="390" rx="8" fill="#f3f7fb" stroke="#2f6fa8" stroke-width="2"/>
  <rect x="25" y="50" width="345" height="30" rx="8" fill="#2f6fa8"/>
  <text x="197" y="71" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Person.h &#8212; the public interface</text>

  <text x="42" y="103" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1c4b73">#import &lt;Foundation/Foundation.h&gt;</text>
  <text x="42" y="121" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1c4b73">@class Customer;</text>
  <text x="42" y="150" font-size="12" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#14395c">@interface Person : NSObject</text>

  <rect x="42" y="163" width="310" height="58" rx="5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.2"/>
  <text x="52" y="182" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">@property (nonatomic, copy) NSString *name;</text>
  <text x="52" y="199" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">@property (nonatomic, assign) NSInteger age;</text>
  <text x="52" y="215" font-size="10.5" fill="#5b7089">public properties &#8212; each synthesises an ivar + accessors</text>

  <rect x="42" y="233" width="310" height="58" rx="5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.2"/>
  <text x="52" y="252" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">- (instancetype)initWithName:(NSString *)n</text>
  <text x="52" y="268" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">&#160;&#160;&#160;&#160;&#160;&#160;age:(NSInteger)a NS_DESIGNATED_INITIALIZER;</text>
  <text x="52" y="285" font-size="10.5" fill="#5b7089">designated initializer, visible to subclasses</text>

  <rect x="42" y="303" width="310" height="45" rx="5" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.2"/>
  <text x="52" y="322" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#14395c">+ (instancetype)personWithName:(NSString *)n;</text>
  <text x="52" y="339" font-size="10.5" fill="#5b7089">class (factory) method</text>

  <text x="42" y="372" font-size="12" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#14395c">@end</text>

  <text x="197" y="405" font-size="11" fill="#5b7089" text-anchor="middle">Clients #import this file. Anything here is public API:</text>
  <text x="197" y="422" font-size="11" fill="#5b7089" text-anchor="middle">changing it is a breaking change.</text>

  <!-- .m panel -->
  <rect x="390" y="50" width="345" height="390" rx="8" fill="#f7f4ec" stroke="#b08a34" stroke-width="2"/>
  <rect x="390" y="50" width="345" height="30" rx="8" fill="#b08a34"/>
  <text x="562" y="71" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Person.m &#8212; the implementation</text>

  <text x="407" y="103" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7a5c12">#import "Person.h"</text>
  <text x="407" y="120" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7a5c12">#import "Customer.h"</text>

  <rect x="407" y="133" width="310" height="76" rx="5" fill="#f6e9cf" stroke="#b08a34" stroke-width="1.2"/>
  <text x="417" y="152" font-size="11.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#6b4f0d">@interface Person ()</text>
  <text x="417" y="169" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d">@property (nonatomic, strong) NSDate *lastSeen;</text>
  <text x="417" y="185" font-size="11.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#6b4f0d">@end</text>
  <text x="417" y="202" font-size="10.5" fill="#8a7340">class extension &#8212; the private interface</text>

  <rect x="407" y="221" width="310" height="72" rx="5" fill="#f6e9cf" stroke="#b08a34" stroke-width="1.2"/>
  <text x="417" y="240" font-size="11.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#6b4f0d">@implementation Person {</text>
  <text x="417" y="257" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d">&#160;&#160;&#160;&#160;NSMutableArray *_history;</text>
  <text x="417" y="273" font-size="11.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#6b4f0d">}</text>
  <text x="417" y="289" font-size="10.5" fill="#8a7340">truly private ivars &#8212; absent from the header</text>

  <rect x="407" y="305" width="310" height="76" rx="5" fill="#f6e9cf" stroke="#b08a34" stroke-width="1.2"/>
  <text x="417" y="324" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d">- (instancetype)initWithName:... { ... }</text>
  <text x="417" y="341" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d">- (NSString *)greeting { ... }</text>
  <text x="417" y="357" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#6b4f0d">- (void)recomputeCache { ... }</text>
  <text x="417" y="374" font-size="10.5" fill="#8a7340">method bodies; undeclared ones are effectively private</text>

  <text x="407" y="404" font-size="12" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#6b4f0d">@end</text>
  <text x="562" y="424" font-size="11" fill="#8a7340" text-anchor="middle">Nothing here is visible to clients &#8212; change it freely.</text>

  <text x="380" y="466" font-size="11.5" fill="#5b7089" text-anchor="middle">Encapsulation in Objective-C is header hygiene: there are no access modifiers on methods, so what is public is</text>
  <text x="380" y="481" font-size="11.5" fill="#5b7089" text-anchor="middle">exactly what the .h declares. Keep the header minimal and put everything else in the class extension.</text>
</svg>
