<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How Tornado turns an exception into an error response</title>
  <defs>
    <marker id="tef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From an exception to an error response</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">everything funnels through RequestHandler.send_error and write_error</text>

  <!-- sources -->
  <rect x="30" y="64" width="200" height="54" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="130" y="86" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Exception in your code</text>
  <text x="130" y="104" font-size="11" fill="currentColor" text-anchor="middle">prepare, get, post, on_finish...</text>

  <rect x="260" y="64" width="200" height="54" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="86" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">No route matches</text>
  <text x="360" y="104" font-size="11" fill="currentColor" text-anchor="middle">default_handler_class or ErrorHandler</text>

  <rect x="490" y="64" width="200" height="54" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="590" y="86" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Your own call</text>
  <text x="590" y="104" font-size="11" fill="currentColor" text-anchor="middle">self.send_error(status)</text>

  <!-- handle exception -->
  <rect x="30" y="150" width="200" height="56" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="130" y="173" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">_handle_request_exception</text>
  <text x="130" y="191" font-size="11" fill="currentColor" text-anchor="middle">called by Tornado, not by you</text>

  <!-- finish branch -->
  <rect x="30" y="240" width="200" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="130" y="263" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">web.Finish?</text>
  <text x="130" y="281" font-size="11" fill="currentColor" text-anchor="middle">yes: finish(), no log or write_error</text>

  <!-- log_exception -->
  <rect x="30" y="330" width="200" height="66" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="130" y="352" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">log_exception</text>
  <text x="130" y="369" font-size="11" fill="currentColor" text-anchor="middle">HTTPError: warning, no stack</text>
  <text x="130" y="383" font-size="11" fill="currentColor" text-anchor="middle">other: error with stack trace</text>

  <!-- send_error -->
  <rect x="260" y="330" width="200" height="66" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="360" y="352" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">send_error(status, exc_info)</text>
  <text x="360" y="369" font-size="11" fill="currentColor" text-anchor="middle">clear(): drops headers and body,</text>
  <text x="360" y="383" font-size="11" fill="currentColor" text-anchor="middle">set_status(status, reason)</text>

  <!-- write_error -->
  <rect x="490" y="330" width="200" height="66" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="590" y="352" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">write_error(status, **kwargs)</text>
  <text x="590" y="369" font-size="11" fill="currentColor" text-anchor="middle">your HTML or JSON body;</text>
  <text x="590" y="383" font-size="11" fill="currentColor" text-anchor="middle">serve_traceback adds a traceback</text>

  <!-- response -->
  <rect x="490" y="440" width="200" height="50" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="590" y="462" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response + access log</text>
  <text x="590" y="478" font-size="11" fill="currentColor" text-anchor="middle">log_function, level by status</text>

  <!-- flushed note -->
  <rect x="260" y="440" width="200" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="461" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Headers already flushed?</text>
  <text x="360" y="477" font-size="11" fill="currentColor" text-anchor="middle">only logged; the response is cut off</text>

  <!-- arrows -->
  <line x1="130" y1="118" x2="130" y2="148" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="130" y1="206" x2="130" y2="238" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="130" y1="296" x2="130" y2="328" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <text x="140" y="316" font-size="11" fill="currentColor">no</text>
  <line x1="230" y1="363" x2="258" y2="363" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="460" y1="363" x2="488" y2="363" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="590" y1="396" x2="590" y2="438" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="360" y1="118" x2="360" y2="178" stroke="currentColor" stroke-width="1.5"/>
  <line x1="360" y1="178" x2="232" y2="178" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <text x="368" y="160" font-size="11" fill="currentColor">its prepare raises HTTPError(404)</text>
  <line x1="590" y1="118" x2="590" y2="310" stroke="currentColor" stroke-width="1.5"/>
  <line x1="590" y1="310" x2="400" y2="310" stroke="currentColor" stroke-width="1.5"/>
  <line x1="400" y1="310" x2="400" y2="328" stroke="currentColor" stroke-width="1.5" marker-end="url(#tef-arrow)"/>
  <line x1="360" y1="396" x2="360" y2="438" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tef-arrow)"/>
</svg>
