<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>

  <defs>
    <marker id="dep-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
  </defs>

  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Single node vs. a sticky-session cluster</text>

  <!-- ===== single node ===== -->
  <text x="180" y="52" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Single node</text>

  <ellipse cx="180" cy="80" rx="30" ry="14" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="180" y="84" font-size="10" fill="#444444" text-anchor="middle">users</text>

  <line x1="180" y1="94" x2="180" y2="128" stroke="#2f6fa8" stroke-width="1.6" marker-end="url(#dep-arrow)"/>

  <rect x="90" y="130" width="180" height="120" rx="8" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.8"/>
  <text x="180" y="154" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Spring Boot node</text>
  <rect x="112" y="168" width="136" height="64" rx="5" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.3"/>
  <text x="180" y="190" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">VaadinSession</text>
  <text x="180" y="206" font-size="9" fill="#666666" text-anchor="middle">UI + component tree</text>
  <text x="180" y="220" font-size="9" fill="#666666" text-anchor="middle">held in memory</text>

  <text x="180" y="272" font-size="10" fill="#444444" text-anchor="middle">simplest; the session is lost if the node restarts</text>

  <!-- divider -->
  <line x1="390" y1="60" x2="390" y2="330" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== cluster ===== -->
  <text x="580" y="52" font-size="13" font-weight="bold" fill="#8a3d13" text-anchor="middle">Sticky-session cluster</text>

  <ellipse cx="580" cy="80" rx="30" ry="14" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="580" y="84" font-size="10" fill="#444444" text-anchor="middle">users</text>

  <line x1="580" y1="94" x2="580" y2="112" stroke="#c25a1d" stroke-width="1.6" marker-end="url(#dep-arrow)"/>

  <rect x="470" y="114" width="220" height="40" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.8"/>
  <text x="580" y="132" font-size="11" font-weight="bold" fill="#8a3d13" text-anchor="middle">reverse proxy / load balancer</text>
  <text x="580" y="147" font-size="9" fill="#8a3d13" text-anchor="middle">session affinity + WebSocket pass-through</text>

  <line x1="510" y1="154" x2="500" y2="188" stroke="#c25a1d" stroke-width="1.4" marker-end="url(#dep-arrow)"/>
  <line x1="580" y1="154" x2="580" y2="188" stroke="#c25a1d" stroke-width="1.4" marker-end="url(#dep-arrow)"/>
  <line x1="650" y1="154" x2="660" y2="188" stroke="#c25a1d" stroke-width="1.4" marker-end="url(#dep-arrow)"/>
  <text x="612" y="172" font-size="8.5" fill="#8a3d13" text-anchor="middle">each user pinned to one node</text>

  <rect x="454" y="190" width="86" height="86" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="497" y="210" font-size="9.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">node A</text>
  <rect x="464" y="218" width="66" height="46" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.1"/>
  <text x="497" y="238" font-size="8" fill="#666666" text-anchor="middle">VaadinSession</text>
  <text x="497" y="250" font-size="8" fill="#666666" text-anchor="middle">(in memory)</text>

  <rect x="547" y="190" width="86" height="86" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="590" y="210" font-size="9.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">node B</text>
  <rect x="557" y="218" width="66" height="46" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.1"/>
  <text x="590" y="238" font-size="8" fill="#666666" text-anchor="middle">VaadinSession</text>

  <rect x="640" y="190" width="86" height="86" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="683" y="210" font-size="9.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">node C</text>
  <rect x="650" y="218" width="66" height="46" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.1"/>
  <text x="683" y="238" font-size="8" fill="#666666" text-anchor="middle">VaadinSession</text>

  <line x1="540" y1="290" x2="640" y2="290" stroke="#2f6f4f" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="590" y="305" font-size="9" fill="#2f6f4f" text-anchor="middle">session replication (Hazelcast / Infinispan) for failover</text>

  <text x="390" y="356" font-size="11" fill="#444444" text-anchor="middle">Because the UI state lives in the session on one node, a load balancer must keep each user on that node.</text>
  <text x="390" y="374" font-size="11" fill="#444444" text-anchor="middle">Replication lets another node take over if one fails; affinity still keeps normal traffic on one node.</text>
</svg>
