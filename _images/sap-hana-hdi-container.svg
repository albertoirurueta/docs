<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">How SAP HANA Deployment Infrastructure turns design-time files in a project into run-time objects inside an HDI container</title>
  <desc id="d">Design-time files such as a table, a view, a procedure and a calculation view sit in the db folder of the project. The deployer hands each file to the build plug-in for its file type. The plug-ins create the matching objects in the run-time container, which is one database schema named C, next to two helper schemas named C#DI and C#OO.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" text-anchor="start" font-size="13" font-weight="bold">Design time: files in the project</text>
  <text x="560" y="28" text-anchor="start" font-size="13" font-weight="bold">Run time: one HDI container in the database</text>
  <rect x="20" y="44" width="230" height="66" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="72" text-anchor="middle" font-size="14" font-weight="bold">.hdbtable</text>
  <text x="135" y="91" text-anchor="middle" font-size="12">column table</text>
  <rect x="20" y="126" width="230" height="66" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="154" text-anchor="middle" font-size="14" font-weight="bold">.hdbview</text>
  <text x="135" y="173" text-anchor="middle" font-size="12">SQL view</text>
  <rect x="20" y="208" width="230" height="66" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="236" text-anchor="middle" font-size="14" font-weight="bold">.hdbprocedure</text>
  <text x="135" y="255" text-anchor="middle" font-size="12">SQLScript procedure</text>
  <rect x="20" y="290" width="230" height="66" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="318" text-anchor="middle" font-size="14" font-weight="bold">.hdbcalculationview</text>
  <text x="135" y="337" text-anchor="middle" font-size="12">graphical view</text>
  <rect x="300" y="120" width="190" height="150" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="170" text-anchor="middle" font-size="15" font-weight="bold">Deployer</text>
  <text x="395" y="190" text-anchor="middle" font-size="13">reads the files and</text>
  <text x="395" y="210" text-anchor="middle" font-size="13">calls one build plug-in</text>
  <text x="395" y="230" text-anchor="middle" font-size="13">per file type</text>
  <line x1="250" y1="77" x2="300" y2="195" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="159" x2="300" y2="195" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="241" x2="300" y2="195" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="323" x2="300" y2="195" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="44" width="460" height="150" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="790" y="104" text-anchor="middle" font-size="15" font-weight="bold">Schema C</text>
  <text x="790" y="124" text-anchor="middle" font-size="13">the deployed tables, views, procedures</text>
  <text x="790" y="144" text-anchor="middle" font-size="13">and calculation views, owned by C#OO</text>
  <rect x="560" y="214" width="220" height="90" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="670" y="244.5" text-anchor="middle" font-size="14" font-weight="bold">Schema C#DI</text>
  <text x="670" y="263.5" text-anchor="middle" font-size="12">container management</text>
  <text x="670" y="282.5" text-anchor="middle" font-size="12">API and internal data</text>
  <rect x="800" y="214" width="220" height="90" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="244.5" text-anchor="middle" font-size="14" font-weight="bold">Schema C#OO</text>
  <text x="910" y="263.5" text-anchor="middle" font-size="12">the object owner;</text>
  <text x="910" y="282.5" text-anchor="middle" font-size="12">its own schema stays empty</text>
  <line x1="490" y1="195" x2="560" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="392" text-anchor="middle" font-size="13">C stands for the container name. The files stay in the project; the container holds the deployed objects.</text>
</svg>
