<svg viewBox="0 0 760 480" width="760" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="480" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Classic geometry pipeline versus the mesh pipeline</text>
<text x="190" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Classic pipeline</text>
<text x="570" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Mesh pipeline</text>
<rect x="40" y="72" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="95.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Input assembler (indices, vertex fetch)</text>
<line x1="190" y1="110" x2="190" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="128" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="151.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Vertex shader</text>
<line x1="190" y1="166" x2="190" y2="184" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="184" width="300" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="207.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Tessellation control (optional)</text>
<line x1="190" y1="222" x2="190" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="240" width="300" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="263.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Tessellation evaluation (optional)</text>
<line x1="190" y1="278" x2="190" y2="296" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="296" width="300" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="319.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Geometry shader (optional)</text>
<line x1="190" y1="334" x2="190" y2="352" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="352" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="375.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Rasteriser</text>
<line x1="190" y1="390" x2="190" y2="408" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="40" y="408" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="431.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Fragment shader</text>
<rect x="420" y="72" width="300" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="94.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Task / amplification / object shader</text>
<text x="570.0" y="109.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">optional: groups of meshlets, culling, LOD</text>
<line x1="570" y1="124" x2="570" y2="142" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="420" y="142" width="300" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="164.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Mesh shader</text>
<text x="570.0" y="179.5" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">a workgroup writes vertices and primitives</text>
<line x1="570" y1="194" x2="570" y2="212" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="420" y="212" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="235.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Rasteriser</text>
<line x1="570" y1="250" x2="570" y2="268" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="420" y="268" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="291.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Fragment shader</text>
<rect x="420" y="350" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="376.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">No fixed vertex fetch: the shader reads</text>
<text x="570.0" y="391.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">buffers itself, so the layout is yours</text>
<text x="380" y="462" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Yellow stages are optional; indigo stages are programmable; grey stages are fixed function.</text>
</svg>
