<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 294" width="820" height="294" role="img" aria-labelledby="questions-t questions-d">
<title id="questions-t">Stack Overflow questions per tag</title>
<desc id="questions-d">Number of questions on Stack Overflow with each tool&apos;s tag on 2026-10-26 (Stack Exchange API). Zensical has no tag, shown as n/a rather than zero.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="820" height="294" fill="var(--bg)"/>
<text class="title" x="410" y="24" text-anchor="middle">Stack Overflow questions per tag</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Questions (count)</text></g></g><line class="grid" x1="169" y1="78" x2="169" y2="234"/><text class="muted" x="169" y="252" text-anchor="middle">0</text><line class="grid" x1="367.33" y1="78" x2="367.33" y2="234"/><text class="muted" x="367.33" y="252" text-anchor="middle">200</text><line class="grid" x1="565.67" y1="78" x2="565.67" y2="234"/><text class="muted" x="565.67" y="252" text-anchor="middle">400</text><line class="grid" x1="764" y1="78" x2="764" y2="234"/><text class="muted" x="764" y="252" text-anchor="middle">600</text><path class="axis" d="M169 78V234H764"/><text x="161" y="95" text-anchor="end">Docusaurus</text><rect class="f0" x="169" y="82" width="510.71" height="18"/><text class="muted" x="684.71" y="95">515</text><text x="161" y="121" text-anchor="end">MkDocs</text><rect class="f0" x="169" y="108" width="301.47" height="18"/><text class="muted" x="475.47" y="121">304</text><text x="161" y="147" text-anchor="end">DocFX</text><rect class="f0" x="169" y="134" width="127.93" height="18"/><text class="muted" x="301.93" y="147">129</text><text x="161" y="173" text-anchor="end">Material for MkDocs</text><rect class="f0" x="169" y="160" width="41.65" height="18"/><text class="muted" x="215.65" y="173">42</text><text x="161" y="199" text-anchor="end">Antora</text><rect class="f0" x="169" y="186" width="30.74" height="18"/><text class="muted" x="204.74" y="199">31</text><text x="161" y="225" text-anchor="end">Zensical</text><text class="na" x="175" y="225">n/a</text><text class="axis-label" x="466.5" y="274" text-anchor="middle">Questions (count)</text><text class="axis-label" transform="translate(16 156) rotate(-90)" text-anchor="middle">Tool</text>
</svg>
