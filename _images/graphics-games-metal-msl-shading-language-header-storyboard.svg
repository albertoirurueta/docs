<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-header-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Adding the shared header to an Xcode project in four steps</text>
<rect x="20" y="50" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="205" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Create the header</text>
<text x="34" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">File, New, File, Header File: ShaderTypes.h</text>
<text x="34" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Target Membership: tick every app target</text>
<text x="34" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">(iOS, macOS, visionOS); keep it out of</text>
<text x="34" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Copy Bundle Resources</text>
<rect x="390" y="50" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="406" cy="66" r="11" fill="#4F46E5"/>
<text x="406" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="575" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Create the bridging header</text>
<text x="404" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">File, New, File, Header File:</text>
<text x="404" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Bookshelf-Bridging-Header.h</text>
<text x="404" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Contents: #import "ShaderTypes.h"</text>
<text x="404" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Build Settings: Objective-C Bridging Header</text>
<rect x="20" y="230" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="308.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="36" cy="246" r="11" fill="#4F46E5"/>
<text x="36" y="250" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="205" y="252" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Include it in the shaders</text>
<text x="34" y="278" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">#include &lt;metal_stdlib&gt;</text>
<text x="34" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">#include "ShaderTypes.h"</text>
<text x="34" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">using namespace metal;</text>
<text x="34" y="332" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Use BufferIndex enums inside [[buffer(...)]]</text>
<rect x="390" y="230" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="308.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="406" cy="246" r="11" fill="#4F46E5"/>
<text x="406" y="250" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="575" y="252" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Use it from Swift</text>
<text x="404" y="278" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">let u = BookUniforms(...)</text>
<text x="404" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">encoder / table: BookBufferIndex.uniforms</text>
<text x="404" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">.rawValue</text>
<text x="404" y="332" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Build: SHARED_ASSERT guards the sizes</text>
</svg>
