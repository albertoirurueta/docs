<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="okArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="badArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
</defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Who may depend on whom: Scala 2.13 and Scala 3 modules</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">An arrow points from the module that depends to the module it depends on; results marked "run here" were produced with Scala CLI 1.17.1 on JDK 26</text>

<text x="150" y="82" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Dependent module</text>
<text x="810" y="82" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Dependency</text>

<rect x="40" y="96" width="220" height="56" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="150" y="120" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Scala 3.x module</text>
<text x="150" y="139" font-size="11" fill="#555555" text-anchor="middle">3.3 LTS up to 3.10</text>

<rect x="700" y="96" width="220" height="56" fill="#fff4e0" stroke="#a65e00"/>
<text x="810" y="120" font-size="14" font-weight="bold" fill="#7a4500" text-anchor="middle">Scala 2.13 library</text>
<text x="810" y="139" font-size="11" fill="#555555" text-anchor="middle">Pickle signatures</text>
<line x1="260" y1="124" x2="698" y2="124" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#okArrow)"/>
<text x="480" y="116" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">works with every Scala 3 version (Scala 3 unpickler)</text>
<text x="480" y="144" font-size="11" fill="#555555" text-anchor="middle">run here with a 2.13.18 jar; sbt: CrossVersion.for3Use2_13</text>

<rect x="40" y="196" width="220" height="56" fill="#fff4e0" stroke="#a65e00"/>
<text x="150" y="220" font-size="14" font-weight="bold" fill="#7a4500" text-anchor="middle">Scala 2.13 module</text>
<text x="150" y="239" font-size="11" fill="#555555" text-anchor="middle">2.13.6 or later, -Ytasty-reader</text>

<rect x="700" y="196" width="220" height="56" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="810" y="220" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Scala 3.0 to 3.7 library</text>
<text x="810" y="239" font-size="11" fill="#555555" text-anchor="middle">TASTy 28.0 to 28.7</text>
<line x1="260" y1="224" x2="698" y2="224" stroke="#2e7d32" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#okArrow)"/>
<text x="480" y="216" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">works for features Scala 2 can express (TASTy reader)</text>
<text x="480" y="244" font-size="11" fill="#555555" text-anchor="middle">run here with 3.3.8 and 3.7.4 jars; sbt: CrossVersion.for2_13Use3</text>

<rect x="40" y="296" width="220" height="56" fill="#fff4e0" stroke="#a65e00"/>
<text x="150" y="320" font-size="14" font-weight="bold" fill="#7a4500" text-anchor="middle">Scala 2.13 module</text>
<text x="150" y="339" font-size="11" fill="#555555" text-anchor="middle">any 2.13 release, 2.13.18 at most</text>

<rect x="700" y="296" width="220" height="56" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="810" y="320" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Scala 3.8 or later library</text>
<text x="810" y="339" font-size="11" fill="#555555" text-anchor="middle">TASTy 28.8 or newer</text>
<line x1="260" y1="324" x2="698" y2="324" stroke="#b3261e" stroke-width="2.2" marker-end="url(#badArrow)"/>
<text x="480" y="316" font-size="12" font-weight="bold" fill="#8c1d18" text-anchor="middle">not possible: the Scala 2.13 reader cannot read it</text>
<text x="480" y="344" font-size="11" fill="#555555" text-anchor="middle">errors or compiler crash; run here with 3.8.4</text>

<rect x="40" y="396" width="880" height="56" fill="#f6f6f6" stroke="#cccccc"/>
<text x="60" y="418" font-size="12" fill="#444444">The sandwich: a 2.13 module may depend on a Scala 3.0 to 3.7 module that itself depends on a 2.13 library (run here with 3.7.4).</text>
<text x="60" y="436" font-size="12" fill="#444444">Scala 2 macros are the exception to the green arrow: a Scala 3 module can link them but the Scala 3 compiler cannot expand them.</text>
</svg>
