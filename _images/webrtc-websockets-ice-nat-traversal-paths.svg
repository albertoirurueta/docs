<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>NAT traversal paths: two Huddle browsers behind NAT routers learn their public addresses from a STUN server, try a direct or hole-punched path first, and fall back to a TURN relay when the NATs block it</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Three ways a Huddle call finds a path</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">ICE tries every pair of candidates and keeps the cheapest one that works</text>

  <!-- private networks -->
  <rect x="20" y="130" width="190" height="260" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="115" y="150" font-size="10.5" fill="#555555" text-anchor="middle">Alice's home network</text>
  <rect x="590" y="130" width="190" height="260" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="685" y="150" font-size="10.5" fill="#555555" text-anchor="middle">Bob's office network</text>

  <!-- peers -->
  <rect x="40" y="170" width="150" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="194" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Alice's browser</text>
  <text x="115" y="211" font-size="10" fill="#0d3c75" text-anchor="middle">host 192.168.1.20:51000</text>
  <text x="115" y="224" font-size="10" fill="#0d3c75" text-anchor="middle">private address</text>
  <rect x="610" y="170" width="150" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="685" y="194" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Bob's browser</text>
  <text x="685" y="211" font-size="10" fill="#0d3c75" text-anchor="middle">host 10.0.5.7:52000</text>
  <text x="685" y="224" font-size="10" fill="#0d3c75" text-anchor="middle">private address</text>

  <!-- NATs -->
  <rect x="40" y="310" width="150" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="115" y="334" font-size="12" font-weight="bold" fill="#263238" text-anchor="middle">NAT router</text>
  <text x="115" y="351" font-size="10" fill="#263238" text-anchor="middle">public 198.51.100.4:61001</text>
  <rect x="610" y="310" width="150" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="685" y="334" font-size="12" font-weight="bold" fill="#263238" text-anchor="middle">NAT router</text>
  <text x="685" y="351" font-size="10" fill="#263238" text-anchor="middle">public 203.0.113.9:62002</text>
  <line x1="115" y1="232" x2="115" y2="310" stroke="#37474f" stroke-width="1.5"/>
  <line x1="685" y1="232" x2="685" y2="310" stroke="#37474f" stroke-width="1.5"/>

  <!-- STUN server -->
  <rect x="300" y="64" width="200" height="56" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="400" y="88" font-size="13" font-weight="bold" fill="#38006b" text-anchor="middle">STUN server</text>
  <text x="400" y="105" font-size="10" fill="#38006b" text-anchor="middle">"your public address is ..."</text>
  <line x1="190" y1="190" x2="300" y2="100" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="610" y1="190" x2="500" y2="100" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="212" y="130" font-size="10" fill="#38006b">2. Binding</text>
  <text x="212" y="143" font-size="10" fill="#38006b">request</text>
  <text x="535" y="130" font-size="10" fill="#38006b">2. Binding</text>
  <text x="535" y="143" font-size="10" fill="#38006b">request</text>

  <!-- direct path -->
  <line x1="190" y1="340" x2="610" y2="340" stroke="#2e7d32" stroke-width="3" marker-start="url(#arrg)" marker-end="url(#arrg)"/>
  <rect x="268" y="262" width="264" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="282" font-size="12" font-weight="bold" fill="#1b4d1f" text-anchor="middle">A. Direct or hole-punched</text>
  <text x="400" y="298" font-size="10" fill="#1b4d1f" text-anchor="middle">host or server-reflexive pair, UDP</text>
  <text x="400" y="310" font-size="10" fill="#1b4d1f" text-anchor="middle">no server touches the media</text>
  <line x1="400" y1="314" x2="400" y2="336" stroke="#2e7d32" stroke-width="1.2"/>

  <!-- TURN relay -->
  <rect x="300" y="420" width="200" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="400" y="444" font-size="13" font-weight="bold" fill="#8a3200" text-anchor="middle">TURN relay (coturn)</text>
  <text x="400" y="461" font-size="10" fill="#8a3200" text-anchor="middle">relayed candidate, all media passes here</text>
  <line x1="115" y1="366" x2="115" y2="448" stroke="#e65100" stroke-width="2.5"/>
  <line x1="115" y1="448" x2="300" y2="448" stroke="#e65100" stroke-width="2.5" marker-end="url(#arro)"/>
  <line x1="685" y1="366" x2="685" y2="448" stroke="#e65100" stroke-width="2.5"/>
  <line x1="685" y1="448" x2="500" y2="448" stroke="#e65100" stroke-width="2.5" marker-end="url(#arro)"/>
  <text x="125" y="410" font-size="11" font-weight="bold" fill="#8a3200">B. Relayed</text>
  <text x="125" y="424" font-size="10" fill="#8a3200">allocation, then data</text>
  <text x="695" y="410" font-size="11" font-weight="bold" fill="#8a3200">B. Relayed</text>
  <text x="695" y="424" font-size="10" fill="#8a3200">allocation, then data</text>

  <text x="400" y="190" font-size="10.5" fill="#555555" text-anchor="middle">1. Signalling server exchanges candidates (WebSocket)</text>
  <text x="400" y="206" font-size="10.5" fill="#555555" text-anchor="middle">3. Connectivity checks run on every pair, best nominated</text>
  <text x="400" y="222" font-size="10.5" fill="#555555" text-anchor="middle">Symmetric NAT on either side usually forces B</text>
</svg>
