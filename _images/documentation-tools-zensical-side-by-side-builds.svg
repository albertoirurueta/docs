<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">One mkdocs.yml built by MkDocs and by Zensical</title>
  <desc id="d">The same docs folder and mkdocs.yml feed two builders. MkDocs builds the production site and keeps deploying it. Zensical builds a preview site that is compared with the production one.</desc>
  <rect width="760" height="330" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
  <rect x="20" y="105" width="190" height="120" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="34" y="132" font-size="14" font-weight="bold" fill="#f9fafb">Project root</text>
  <text x="34" y="158" font-size="13" fill="#e5e7eb">mkdocs.yml</text>
  <text x="34" y="178" font-size="13" fill="#e5e7eb">docs/ (Markdown)</text>
  <text x="34" y="198" font-size="13" fill="#e5e7eb">pyproject.toml</text>
  <text x="34" y="216" font-size="11" fill="#d1d5db">unchanged during evaluation</text>

  <rect x="300" y="30" width="170" height="70" rx="8" fill="#2563eb"/>
  <text x="385" y="60" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">mkdocs build</text>
  <text x="385" y="82" font-size="12" fill="#ffffff" text-anchor="middle">hooks, gen-files run</text>
  <rect x="300" y="215" width="170" height="70" rx="8" fill="#7c3aed"/>
  <text x="385" y="245" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">zensical build</text>
  <text x="385" y="267" font-size="12" fill="#ffffff" text-anchor="middle">hooks, gen-files ignored</text>

  <rect x="560" y="30" width="180" height="70" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="650" y="60" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Production site</text>
  <text x="650" y="82" font-size="12" fill="#ffffff" text-anchor="middle">still deployed as before</text>
  <rect x="560" y="215" width="180" height="70" rx="8" fill="#b45309"/>
  <text x="650" y="245" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Preview site</text>
  <text x="650" y="267" font-size="12" fill="#ffffff" text-anchor="middle">reviewed, not published</text>

  <line x1="210" y1="145" x2="298" y2="75" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="210" y1="185" x2="298" y2="250" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="65" x2="558" y2="65" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="250" x2="558" y2="250" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
  <path d="M650 215 L650 102" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" fill="none"/>
  <text x="662" y="165" font-size="12" fill="#fde68a">compare pages,</text>
  <text x="662" y="181" font-size="12" fill="#fde68a">nav, search</text>
</svg>
