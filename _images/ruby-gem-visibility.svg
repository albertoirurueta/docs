<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Which gems a require can see with plain ruby and under Bundler</title>
  <desc>The gem home of a Ruby 4.0 installation holds default gems, bundled gems and other installed gems. A plain ruby process can require all of them and picks the newest version. A process under Bundler sees only the gems of Gemfile.lock plus the default gems that the Gemfile does not replace; a bundled gem such as logger is visible only when the Gemfile lists it, and an installed gem that is not in the lockfile is invisible.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What a require can see</text>
  <text x="480" y="47" font-size="12" fill="#666666" text-anchor="middle">The same machine and the same gem home, seen through plain ruby and through Bundler</text>

  <text x="170" y="86" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">On disk (Ruby 4.0 install)</text>

  <rect x="30" y="100" width="280" height="118" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="170" y="124" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Default gems</text>
  <text x="170" y="144" font-size="12" fill="#444444" text-anchor="middle">shipped with Ruby, cannot be uninstalled</text>
  <text x="170" y="170" font-size="12" font-family="Courier New, monospace" fill="#1c4b73" text-anchor="middle">json  psych  bundler  uri</text>
  <text x="170" y="190" font-size="12" font-family="Courier New, monospace" fill="#1c4b73" text-anchor="middle">securerandom  time  tempfile</text>

  <rect x="30" y="236" width="280" height="118" rx="6" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="170" y="260" font-size="13" font-weight="bold" fill="#8a4a12" text-anchor="middle">Bundled gems</text>
  <text x="170" y="280" font-size="12" fill="#444444" text-anchor="middle">installed with Ruby, can be uninstalled</text>
  <text x="170" y="306" font-size="12" font-family="Courier New, monospace" fill="#8a4a12" text-anchor="middle">logger  benchmark  ostruct</text>
  <text x="170" y="326" font-size="12" font-family="Courier New, monospace" fill="#8a4a12" text-anchor="middle">csv  rake  minitest  irb</text>

  <rect x="30" y="372" width="280" height="118" rx="6" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="170" y="396" font-size="13" font-weight="bold" fill="#1f5a37" text-anchor="middle">Other installed gems</text>
  <text x="170" y="416" font-size="12" fill="#444444" text-anchor="middle">gem install or bundle install, any version</text>
  <text x="170" y="442" font-size="12" font-family="Courier New, monospace" fill="#1f5a37" text-anchor="middle">rubocop 1.92.0</text>
  <text x="170" y="462" font-size="12" font-family="Courier New, monospace" fill="#1f5a37" text-anchor="middle">rbs 3.10.0  rbs 4.2.0</text>

  <text x="640" y="86" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">What require finds</text>

  <rect x="400" y="100" width="520" height="190" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.4"/>
  <text x="660" y="124" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Plain ruby script.rb</text>
  <text x="660" y="143" font-size="12" fill="#444444" text-anchor="middle">RubyGems searches every installed gem and activates the newest version</text>
  <rect x="420" y="158" width="150" height="34" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="495" y="180" font-size="12" fill="#1c4b73" text-anchor="middle">default gems: yes</text>
  <rect x="585" y="158" width="150" height="34" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="660" y="180" font-size="12" fill="#8a4a12" text-anchor="middle">bundled gems: yes</text>
  <rect x="750" y="158" width="150" height="34" rx="5" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="825" y="180" font-size="12" fill="#1f5a37" text-anchor="middle">other gems: yes</text>
  <text x="660" y="224" font-size="12" fill="#444444" text-anchor="middle">gem "rbs", "= 3.10.0" before require picks an older version</text>
  <text x="660" y="244" font-size="12" fill="#444444" text-anchor="middle">a second, different version in the same process raises Gem::LoadError</text>
  <text x="660" y="272" font-size="12" font-style="italic" fill="#666666" text-anchor="middle">fast to write, but depends on whatever happens to be installed</text>

  <rect x="400" y="310" width="520" height="190" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.4"/>
  <text x="660" y="334" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">bundle exec ruby script.rb (or require "bundler/setup")</text>
  <text x="660" y="353" font-size="12" fill="#444444" text-anchor="middle">Bundler rebuilds the load path from Gemfile.lock</text>
  <rect x="420" y="368" width="150" height="34" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="495" y="390" font-size="12" fill="#1c4b73" text-anchor="middle">default gems: yes</text>
  <rect x="585" y="368" width="150" height="34" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="660" y="390" font-size="12" fill="#8a4a12" text-anchor="middle">bundled: if in Gemfile</text>
  <rect x="750" y="368" width="150" height="34" rx="5" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="825" y="390" font-size="12" fill="#1f5a37" text-anchor="middle">other: if in Gemfile</text>
  <text x="660" y="434" font-size="12" fill="#444444" text-anchor="middle">only the locked version of each listed gem is visible</text>
  <text x="660" y="454" font-size="12" fill="#444444" text-anchor="middle">require "logger" without a Gemfile entry: LoadError (Ruby 4.0)</text>
  <text x="660" y="482" font-size="12" font-style="italic" fill="#666666" text-anchor="middle">reproducible: the lockfile, not the machine, decides</text>

  <path d="M318,295 L392,295" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M385,289 L393,295 L385,301" stroke="#777777" stroke-width="1.6" fill="none"/>
  <text x="480" y="548" font-size="12" fill="#666666" text-anchor="middle">Solid frames: always visible. Dashed frames: visible only for gems that Gemfile.lock lists.</text>
  <text x="480" y="568" font-size="12" fill="#666666" text-anchor="middle">Default gems stay visible under Bundler unless the Gemfile pins another version of them.</text>
</svg>
