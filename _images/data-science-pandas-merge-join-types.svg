<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="t d">
<title id="t">Join types of pandas merge</title>
<desc id="d">Six two-circle diagrams showing which rows each merge how value keeps: inner, left, right, outer, left_anti and right_anti. The left circle is the left DataFrame and the right circle is the right DataFrame.</desc>
<defs><clipPath id="cl"><circle cx="82" cy="85" r="48"/></clipPath><clipPath id="cr"><circle cx="138" cy="85" r="48"/></clipPath></defs>
<rect x="1" y="1" width="718" height="498" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">How merge keeps rows</text>
<g transform="translate(20,50)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="82" cy="85" r="48" clip-path="url(#cr)" fill="#FEF3C7" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold"></text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold"></text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="inner"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">only matching keys</text></g>
<g transform="translate(252,50)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="82" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold">L</text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold">R</text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="left"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">all left rows</text></g>
<g transform="translate(484,50)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold">L</text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold">R</text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="right"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">all right rows</text></g>
<g transform="translate(20,270)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="82" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="138" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold">L</text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold">R</text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="outer"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">all rows from both</text></g>
<g transform="translate(252,270)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="82" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="138" cy="85" r="48" fill="#FFFFFF" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold">L</text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold">R</text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="left_anti"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">left rows without a match</text></g>
<g transform="translate(484,270)">
<rect x="0" y="0" width="220" height="200" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="#FEF3C7" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="#FFFFFF" stroke="none"/>
<circle cx="82" cy="85" r="48" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="138" cy="85" r="48" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D4ED8" font-weight="bold">L</text>
<text x="138" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F766E" font-weight="bold">R</text>
<text x="110" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">how="right_anti"</text>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">right rows without a match</text></g>
</svg>