<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-rendering-pipeline-fragment-ops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What happens to a fragment after the fragment shader</text>
<rect x="20" y="60" width="150" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95" y="89" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Fragment shader</text>
<text x="95" y="104" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">colour, optional depth</text>
<text x="95" y="119" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">discard ends it here</text>
<circle cx="22" cy="62" r="11" fill="#B45309"/>
<text x="22" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="210" y="60" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285" y="89" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Scissor test</text>
<text x="285" y="104" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.enable(SCISSOR_TEST)</text>
<text x="285" y="119" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.scissor(x, y, w, h)</text>
<circle cx="212" cy="62" r="11" fill="#4F46E5"/>
<text x="212" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="400" y="60" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475" y="89" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Stencil test</text>
<text x="475" y="104" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.stencilFunc / stencilOp</text>
<text x="475" y="119" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">needs stencil: true</text>
<circle cx="402" cy="62" r="11" fill="#4F46E5"/>
<text x="402" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="590" y="60" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665" y="89" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Depth test</text>
<text x="665" y="104" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.depthFunc(LESS)</text>
<text x="665" y="119" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.depthMask(true)</text>
<circle cx="592" cy="62" r="11" fill="#4F46E5"/>
<text x="592" y="66.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="20" y="220" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95" y="249" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Blending</text>
<text x="95" y="264" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.blendFunc / blendEquation</text>
<text x="95" y="279" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.blendColor</text>
<circle cx="22" cy="222" r="11" fill="#4F46E5"/>
<text x="22" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="210" y="220" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285" y="249" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Dithering</text>
<text x="285" y="264" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.enable(DITHER)</text>
<text x="285" y="279" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">on by default</text>
<circle cx="212" cy="222" r="11" fill="#4F46E5"/>
<text x="212" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="400" y="220" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475" y="249" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Write masks</text>
<text x="475" y="264" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.colorMask(r, g, b, a)</text>
<text x="475" y="279" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl.depthMask, stencilMask</text>
<circle cx="402" cy="222" r="11" fill="#4F46E5"/>
<text x="402" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<rect x="590" y="220" width="150" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665" y="249" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Framebuffer</text>
<text x="665" y="264" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">canvas buffer or FBO</text>
<text x="665" y="279" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">one value per sample</text>
<circle cx="592" cy="222" r="11" fill="#4F46E5"/>
<text x="592" y="226.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
<line x1="170" y1="100" x2="210" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<line x1="360" y1="100" x2="400" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<line x1="550" y1="100" x2="590" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<path d="M665,140 V180 H95 V220" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<line x1="170" y1="260" x2="210" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<line x1="360" y1="260" x2="400" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<line x1="550" y1="260" x2="590" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-fragment-ops)"/>
<text x="380" y="350" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Failing the scissor, stencil or depth test stops the fragment; nothing is written.</text>
<text x="380" y="372" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The GPU may run the depth test before the fragment shader when the result is the same, which saves work.</text>
<text x="380" y="394" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">WebGL has no logic ops and no per-target enable for blending without an extension.</text>
</svg>
