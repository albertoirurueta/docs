<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-shader-compilation-and-pipeline-caching-compile-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Pipeline compile cost: cold start versus warm archive</text>
<text x="20" y="70" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Cold start</text>
<rect x="20" y="80" width="100" height="36" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="70.0" y="101.8" text-anchor="middle" font-size="11" fill="#374151">load library</text>
<rect x="125" y="80" width="300" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="275.0" y="101.8" text-anchor="middle" font-size="11" fill="#92400E">compile 40 pipelines on first use</text>
<rect x="430" y="80" width="120" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="490.0" y="101.8" text-anchor="middle" font-size="11" fill="#3730A3">first frame</text>
<text x="560" y="104" text-anchor="start" font-size="11" fill="#92400E">hitch of hundreds of ms</text>
<text x="20" y="170" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Warm start with an archive</text>
<rect x="20" y="180" width="100" height="36" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="70.0" y="201.8" text-anchor="middle" font-size="11" fill="#374151">load library</text>
<rect x="125" y="180" width="110" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="180.0" y="201.8" text-anchor="middle" font-size="11" fill="#065F46">open archive</text>
<rect x="240" y="180" width="120" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="300.0" y="201.8" text-anchor="middle" font-size="11" fill="#065F46">lookup pipelines</text>
<rect x="365" y="180" width="120" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="201.8" text-anchor="middle" font-size="11" fill="#3730A3">first frame</text>
<text x="495" y="204" text-anchor="start" font-size="11" fill="#065F46">smooth first frame</text>
<rect x="20" y="250" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="271.9" text-anchor="middle" font-size="11" fill="#374151">An archive stores compiled pipelines for a device family and OS build; when a lookup misses,</text>
<text x="380.0" y="285.9" text-anchor="middle" font-size="11" fill="#374151">the compiler falls back to compiling, so the archive is an accelerator and never a requirement.</text>
</svg>
