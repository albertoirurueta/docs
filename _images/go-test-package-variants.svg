<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where test files live: one directory, up to three packages</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">go test compiles them into a single test binary; files ending in _test.go are never part of a normal build</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <!-- package catalog -->
  <rect x="40" y="70" width="400" height="300" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="240" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">package catalog</text>
  <g font-size="13" fill="#222222" font-family="Courier New, monospace">
    <rect x="60" y="110" width="360" height="40" fill="#ffffff" stroke="#1c4b73"/><text x="72" y="135">catalog.go  lend.go  load.go</text>
    <rect x="60" y="164" width="360" height="40" fill="#ffffff" stroke="#1c4b73"/><text x="72" y="189">isbn_test.go  lend_test.go</text>
    <rect x="60" y="218" width="360" height="40" fill="#fff7e0" stroke="#b7791f"/><text x="72" y="243">export_test.go</text>
  </g>
  <g font-size="12" fill="#444444">
    <text x="60" y="280">production code: exported and unexported names</text>
    <text x="60" y="296">white-box tests: same package, see unexported names</text>
    <text x="60" y="312">bridge: re-exports unexported names to the external</text>
    <text x="60" y="328">tests; compiled only while testing</text>
  </g>
  <!-- package catalog_test -->
  <rect x="520" y="70" width="380" height="180" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="710" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">package catalog_test</text>
  <g font-size="13" fill="#222222" font-family="Courier New, monospace">
    <rect x="540" y="110" width="340" height="40" fill="#ffffff" stroke="#2e7d32"/><text x="552" y="135">load_test.go  example_test.go</text>
  </g>
  <g font-size="12" fill="#444444">
    <text x="540" y="172">black-box tests: import the package like any client</text>
    <text x="540" y="188">and see exported names only (plus the bridge)</text>
    <text x="540" y="204">may import packages that themselves import catalog</text>
    <text x="540" y="220">Example functions usually live here</text>
  </g>
  <!-- arrow -->
  <line x1="520" y1="130" x2="444" y2="130" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="482" y="122" font-size="12" fill="#1c4b73" text-anchor="middle">imports</text>
  <rect x="520" y="270" width="380" height="100" rx="6" fill="#f4f4f4" stroke="#999999" stroke-dasharray="5,3"/>
  <text x="710" y="294" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">testdata/</text>
  <text x="710" y="314" font-size="12" fill="#444444" text-anchor="middle">fixtures and golden files; the go tool ignores the</text>
  <text x="710" y="330" font-size="12" fill="#444444" text-anchor="middle">directory when matching packages (./...), and tests</text>
  <text x="710" y="346" font-size="12" fill="#444444" text-anchor="middle">run with the package directory as working directory</text>
</svg>
