<title id="sap-general-guide-consume-an-sap-api-from-cap-08-result-title">Browser with the address localhost:4004/odata/v4/partner-dashboard/Partners with a filter on category 2 and a select of ID and name: the JSON response lists three partners, Example Trading Co. with ID 1000001, Northwind Retail GmbH with ID 1000002 and Warehouse Supplies Ltd. with ID 1000006</title>
