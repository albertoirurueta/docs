<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Product quantization: 768-dim vector to 16 codes</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Split into m = 16 subspaces of 48 dims, each encoded against its own trained k-means codebook</text>

  <!-- original vector -->
  <text x="40" y="80" font-size="12.5" font-weight="bold" fill="#333333">Original vector (768 floats, 3072 bytes)</text>
  <rect x="40" y="90" width="680" height="26" fill="#eef3f8" stroke="#1c4b73" stroke-width="1"/>
  <!-- subdivide into 16 subspace cells -->
  <g stroke="#9cb9d1" stroke-width="1">
    <line x1="82.5" y1="90" x2="82.5" y2="116"/>
    <line x1="125" y1="90" x2="125" y2="116"/>
    <line x1="167.5" y1="90" x2="167.5" y2="116"/>
    <line x1="210" y1="90" x2="210" y2="116"/>
    <line x1="252.5" y1="90" x2="252.5" y2="116"/>
    <line x1="295" y1="90" x2="295" y2="116"/>
    <line x1="337.5" y1="90" x2="337.5" y2="116"/>
    <line x1="380" y1="90" x2="380" y2="116"/>
    <line x1="422.5" y1="90" x2="422.5" y2="116"/>
    <line x1="465" y1="90" x2="465" y2="116"/>
    <line x1="507.5" y1="90" x2="507.5" y2="116"/>
    <line x1="550" y1="90" x2="550" y2="116"/>
    <line x1="592.5" y1="90" x2="592.5" y2="116"/>
    <line x1="635" y1="90" x2="635" y2="116"/>
    <line x1="677.5" y1="90" x2="677.5" y2="116"/>
  </g>
  <text x="61" y="107" font-size="9" fill="#1c4b73" text-anchor="middle">s1</text>
  <text x="720" y="107" font-size="9" fill="#1c4b73" text-anchor="middle">...</text>
  <text x="40" y="132" font-size="10.5" fill="#666666">each of the m = 16 subspaces holds d / m = 48 contiguous dimensions</text>

  <!-- arrow down -->
  <line x1="380" y1="140" x2="380" y2="160" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888888"/>
    </marker>
  </defs>

  <!-- three representative subspaces expanded with codebooks -->
  <!-- subspace 1 -->
  <g>
    <rect x="40" y="170" width="200" height="120" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="140" y="188" font-size="11.5" font-weight="bold" fill="#333333" text-anchor="middle">Subspace 1 (dims 1-48)</text>
    <circle cx="80" cy="220" r="3" fill="#1c4b73"/>
    <circle cx="95" cy="235" r="3" fill="#1c4b73"/>
    <circle cx="70" cy="245" r="3" fill="#1c4b73"/>
    <circle cx="110" cy="215" r="3" fill="#1c4b73"/>
    <circle cx="150" cy="230" r="3" fill="#1c4b73"/>
    <circle cx="170" cy="210" r="3" fill="#1c4b73"/>
    <circle cx="165" cy="255" r="3" fill="#1c4b73"/>
    <!-- codebook centroids -->
    <circle cx="90" cy="230" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="160" cy="225" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="140" y="278" font-size="9.5" fill="#666666" text-anchor="middle">k-means codebook: k = 256 centroids</text>
  </g>

  <!-- subspace 2 -->
  <g>
    <rect x="280" y="170" width="200" height="120" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="380" y="188" font-size="11.5" font-weight="bold" fill="#333333" text-anchor="middle">Subspace 8 (dims 337-384)</text>
    <circle cx="320" cy="215" r="3" fill="#1c4b73"/>
    <circle cx="340" cy="250" r="3" fill="#1c4b73"/>
    <circle cx="360" cy="230" r="3" fill="#1c4b73"/>
    <circle cx="400" cy="220" r="3" fill="#1c4b73"/>
    <circle cx="420" cy="245" r="3" fill="#1c4b73"/>
    <circle cx="405" cy="260" r="3" fill="#1c4b73"/>
    <circle cx="335" cy="220" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="410" cy="240" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="380" y="278" font-size="9.5" fill="#666666" text-anchor="middle">its own, independently trained codebook</text>
  </g>

  <!-- subspace 16 -->
  <g>
    <rect x="520" y="170" width="200" height="120" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="620" y="188" font-size="11.5" font-weight="bold" fill="#333333" text-anchor="middle">Subspace 16 (dims 721-768)</text>
    <circle cx="560" cy="230" r="3" fill="#1c4b73"/>
    <circle cx="580" cy="210" r="3" fill="#1c4b73"/>
    <circle cx="600" cy="250" r="3" fill="#1c4b73"/>
    <circle cx="640" cy="215" r="3" fill="#1c4b73"/>
    <circle cx="660" cy="240" r="3" fill="#1c4b73"/>
    <circle cx="675" cy="260" r="3" fill="#1c4b73"/>
    <circle cx="590" cy="225" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="655" cy="235" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="620" y="278" font-size="9.5" fill="#666666" text-anchor="middle">1 byte code = nearest centroid ID</text>
  </g>

  <text x="380" y="315" font-size="10.5" fill="#888888" text-anchor="middle">... (subspaces 2-7, 9-15 omitted for space)</text>

  <!-- arrow down to final code -->
  <line x1="380" y1="322" x2="380" y2="342" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final compressed code -->
  <text x="40" y="365" font-size="12.5" font-weight="bold" fill="#333333">Compressed code (16 bytes, one centroid ID per subspace)</text>
  <rect x="40" y="375" width="680" height="30" fill="#f4ede2" stroke="#7a3b12" stroke-width="1"/>
  <g stroke="#d9c3a3" stroke-width="1">
    <line x1="82.5" y1="375" x2="82.5" y2="405"/>
    <line x1="125" y1="375" x2="125" y2="405"/>
    <line x1="167.5" y1="375" x2="167.5" y2="405"/>
    <line x1="210" y1="375" x2="210" y2="405"/>
    <line x1="252.5" y1="375" x2="252.5" y2="405"/>
    <line x1="295" y1="375" x2="295" y2="405"/>
    <line x1="337.5" y1="375" x2="337.5" y2="405"/>
    <line x1="380" y1="375" x2="380" y2="405"/>
    <line x1="422.5" y1="375" x2="422.5" y2="405"/>
    <line x1="465" y1="375" x2="465" y2="405"/>
    <line x1="507.5" y1="375" x2="507.5" y2="405"/>
    <line x1="550" y1="375" x2="550" y2="405"/>
    <line x1="592.5" y1="375" x2="592.5" y2="405"/>
    <line x1="635" y1="375" x2="635" y2="405"/>
    <line x1="677.5" y1="375" x2="677.5" y2="405"/>
  </g>
  <text x="61" y="394" font-size="10" fill="#7a3b12" text-anchor="middle">42</text>
  <text x="103" y="394" font-size="10" fill="#7a3b12" text-anchor="middle">17</text>
  <text x="146" y="394" font-size="10" fill="#7a3b12" text-anchor="middle">201</text>
  <text x="700" y="394" font-size="10" fill="#7a3b12" text-anchor="middle">88</text>

  <text x="380" y="430" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">3072 bytes -&gt; 16 bytes (192x compression)</text>
  <text x="380" y="448" font-size="10.5" fill="#666666" text-anchor="middle">Query stays full-precision; asymmetric distance computation sums one precomputed lookup-table value per subspace</text>
</svg>
