<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Availability is the product of the participants' availability</text>

  <defs>
    <marker id="ap-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Row 1: two-service multiplication -->
  <text x="40" y="66" font-size="12.5" font-weight="bold" fill="#333333">Two services</text>

  <rect x="40" y="78" width="150" height="66" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="115" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order</text>
  <text x="115" y="124" font-size="12" fill="#333333" text-anchor="middle">99.5% available</text>

  <text x="215" y="118" font-size="20" font-weight="bold" fill="#444444" text-anchor="middle">x</text>

  <rect x="240" y="78" width="150" height="66" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="315" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Payment</text>
  <text x="315" y="124" font-size="12" fill="#333333" text-anchor="middle">99.5% available</text>

  <line x1="400" y1="111" x2="440" y2="111" stroke="#444444" stroke-width="2" marker-end="url(#ap-arrow)"/>

  <rect x="450" y="78" width="290" height="66" rx="8" fill="#fdf1e8" stroke="#a85c1c" stroke-width="2.2"/>
  <text x="595" y="100" font-size="12.5" font-weight="bold" fill="#a85c1c" text-anchor="middle">Combined operation (both required)</text>
  <text x="595" y="120" font-size="13" font-weight="bold" fill="#a85c1c" text-anchor="middle">0.995 x 0.995 ~ 99.0%</text>
  <text x="595" y="136" font-size="10.5" fill="#7a4413" text-anchor="middle">~44h/yr each -&gt; ~88h/yr combined downtime</text>

  <!-- Row 2: four-service multiplication (Place Order Saga) -->
  <text x="40" y="196" font-size="12.5" font-weight="bold" fill="#333333">Four services (Place Order Saga)</text>

  <rect x="40" y="208" width="150" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="115" y="234" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Order</text>
  <text x="115" y="252" font-size="11" fill="#333333" text-anchor="middle">99.5%</text>

  <rect x="210" y="208" width="150" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="285" y="234" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Inventory</text>
  <text x="285" y="252" font-size="11" fill="#333333" text-anchor="middle">99.5%</text>

  <rect x="380" y="208" width="150" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="455" y="234" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Payment</text>
  <text x="455" y="252" font-size="11" fill="#333333" text-anchor="middle">99.5%</text>

  <rect x="550" y="208" width="150" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="625" y="234" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Shipping</text>
  <text x="625" y="252" font-size="11" fill="#333333" text-anchor="middle">99.5%</text>

  <text x="115" y="285" font-size="16" fill="#444444" text-anchor="middle">x</text>
  <text x="285" y="285" font-size="16" fill="#444444" text-anchor="middle">x</text>
  <text x="455" y="285" font-size="16" fill="#444444" text-anchor="middle">x</text>
  <text x="625" y="285" font-size="16" fill="#444444" text-anchor="middle">=</text>

  <rect x="190" y="320" width="400" height="70" rx="8" fill="#fdf1e8" stroke="#a85c1c" stroke-width="2.2"/>
  <text x="390" y="344" font-size="12.5" font-weight="bold" fill="#a85c1c" text-anchor="middle">All four required for the saga to complete</text>
  <text x="390" y="365" font-size="13.5" font-weight="bold" fill="#a85c1c" text-anchor="middle">0.995^4 ~ 98.0%</text>
  <text x="390" y="382" font-size="10.5" fill="#7a4413" text-anchor="middle">roughly 4x the downtime of any single 99.5% participant</text>

  <text x="390" y="420" font-size="11" fill="#444444" text-anchor="middle">Independent failure probabilities multiply, not average -- every extra participant</text>
  <text x="390" y="436" font-size="11" fill="#444444" text-anchor="middle">a distributed transaction depends on drives combined availability further down, not up.</text>
</svg>
