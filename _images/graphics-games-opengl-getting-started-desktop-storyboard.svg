<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-getting-started-desktop-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From empty folder to a running window</text>
<rect x="14" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="72.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="28" cy="64" r="11" fill="#4F46E5"/><text x="28" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Configure</text>
<rect x="26" y="116" width="92" height="70" fill="#F9FAFB" stroke="#4B5563"/>
<text x="72" y="156" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">terminal</text>
<text x="72" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">cmake -S . -B build</text>
<text x="72" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">fetches GLFW, GLM</text>
<rect x="138" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="196.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="152" cy="64" r="11" fill="#4F46E5"/><text x="152" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="196" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Window</text>
<rect x="150" y="116" width="92" height="70" fill="#111827" stroke="#4B5563"/>
<text x="196" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glfwCreateWindow</text>
<text x="196" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">black rectangle</text>
<rect x="262" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="276" cy="64" r="11" fill="#4F46E5"/><text x="276" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="320" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Load GL</text>
<rect x="274" y="116" width="92" height="70" fill="#111827" stroke="#4B5563"/>
<text x="320" y="156" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle">4.1 core</text>
<text x="320" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">gladLoadGL</text>
<text x="320" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">prints GL 4.1 core</text>
<rect x="386" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="444.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="400" cy="64" r="11" fill="#4F46E5"/><text x="400" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="444" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Clear</text>
<rect x="398" y="116" width="92" height="70" fill="#D6B98C" stroke="#4B5563"/>
<text x="444" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glClearColor</text>
<text x="444" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">warm wall colour</text>
<rect x="510" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="568.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="524" cy="64" r="11" fill="#4F46E5"/><text x="524" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="568" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Swap</text>
<rect x="522" y="116" width="92" height="70" fill="#D6B98C" stroke="#4B5563"/>
<text x="568" y="156" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">frame 1,2,3</text>
<text x="568" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glfwSwapBuffers</text>
<text x="568" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">vsync, steady 60 Hz</text>
<rect x="634" y="50" width="116" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="692.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<circle cx="648" cy="64" r="11" fill="#4F46E5"/><text x="648" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="692" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Resize</text>
<rect x="646" y="116" width="92" height="50" fill="#D6B98C" stroke="#4B5563"/>
<rect x="646" y="170" width="92" height="40" fill="#D6B98C" stroke="#B45309" stroke-dasharray="4 3"/>
<text x="692" y="230" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">framebuffer callback</text>
<text x="692" y="250" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">viewport follows</text>
<text x="380" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each panel adds one call to main.cpp; the colour is the future wall behind the shelf.</text>
</svg>
