<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">PrestaShop multistore model</title>
  <desc id="d">One installation holds shop groups. Each shop group holds shops and carries the share_customer, share_order and share_stock flags. Each shop has one or more shop URLs, a theme, default language and default currency. Configuration values resolve from the shop row, then the shop group row, then the global row.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Multistore: groups, shops, URLs and where a setting is stored</text>

  <!-- group 1 -->
  <rect x="30" y="52" width="580" height="236" rx="10" fill="#34495e" stroke="#f2f5f8" stroke-dasharray="6 4"/>
  <text x="46" y="76" font-size="15" font-weight="bold" fill="#f2f5f8">Shop group 1: Default</text>
  <text x="46" y="94" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">share_customer=0  share_order=0  share_stock=0</text>
  <rect x="46" y="108" width="548" height="164" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="62" y="132" font-size="15" font-weight="bold" fill="#f2f5f8">Shop 1: PrestaShop</text>
  <text x="62" y="154" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">shop_url: localhost:8091/   (main)</text>
  <text x="62" y="174" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">theme_name: hummingbird</text>
  <text x="62" y="194" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">PS_LANG_DEFAULT: 1 (en)   PS_CURRENCY_DEFAULT: 1 (EUR)</text>
  <text x="62" y="222" font-size="12" fill="#f2f5f8">Own catalog rows in product_shop, category_shop, lang_shop, ...</text>
  <text x="62" y="242" font-size="12" fill="#f2f5f8">Own customers, orders and stock unless the group shares them</text>

  <!-- group 2 -->
  <rect x="30" y="308" width="580" height="236" rx="10" fill="#34495e" stroke="#f2f5f8" stroke-dasharray="6 4"/>
  <text x="46" y="332" font-size="15" font-weight="bold" fill="#f2f5f8">Shop group 2: Pocket Coffee EU</text>
  <text x="46" y="350" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">share_customer=0  share_order=0  share_stock=0</text>
  <rect x="46" y="364" width="548" height="164" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="62" y="388" font-size="15" font-weight="bold" fill="#f2f5f8">Shop 2: Pocket Coffee Spain</text>
  <text x="62" y="410" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">shop_url: 127.0.0.1:8091/   (main)</text>
  <text x="62" y="430" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">theme_name: pcfgcoffee (child of hummingbird)</text>
  <text x="62" y="450" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">PS_LANG_DEFAULT: 2 (es)   PS_CURRENCY_DEFAULT: 2 (USD)</text>
  <text x="62" y="478" font-size="12" fill="#f2f5f8">Data copied from shop 1 when the shop was created</text>
  <text x="62" y="498" font-size="12" fill="#f2f5f8">Customers of shop 1 are unknown here (share_customer=0)</text>

  <!-- configuration lookup -->
  <text x="780" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#f2f5f8">ps_configuration lookup</text>
  <text x="780" y="94" text-anchor="middle" font-size="12" fill="#f2f5f8">Configuration::get() in shop context 2</text>
  <rect x="650" y="112" width="260" height="84" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="664" y="134" font-size="13" font-weight="bold" fill="#f2f5f8">1. Shop row</text>
  <text x="664" y="154" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id_shop=2 id_shop_group=2</text>
  <text x="664" y="176" font-size="12" fill="#f2f5f8">first match wins, else...</text>
  <rect x="650" y="232" width="260" height="84" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="664" y="254" font-size="13" font-weight="bold" fill="#f2f5f8">2. Shop group row</text>
  <text x="664" y="274" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id_shop=NULL id_shop_group=2</text>
  <text x="664" y="296" font-size="12" fill="#f2f5f8">first match wins, else...</text>
  <rect x="650" y="352" width="260" height="84" rx="8" fill="#7a5c99" stroke="#f2f5f8"/>
  <text x="664" y="374" font-size="13" font-weight="bold" fill="#f2f5f8">3. Global row</text>
  <text x="664" y="394" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id_shop=NULL id_shop_group=NULL</text>
  <text x="664" y="416" font-size="12" fill="#f2f5f8">written by updateGlobalValue()</text>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M780 196 V 230"/>
    <path d="M780 316 V 350"/>
    <path d="M594 446 C 620 446, 630 154, 648 154" stroke-dasharray="6 4"/>
  </g>
  <text x="780" y="466" text-anchor="middle" font-size="12" fill="#f2f5f8">Constants: Shop::CONTEXT_SHOP=1</text>
  <text x="780" y="484" text-anchor="middle" font-size="12" fill="#f2f5f8">CONTEXT_GROUP=2, CONTEXT_ALL=4</text>
  <text x="780" y="512" text-anchor="middle" font-size="12" fill="#f2f5f8">Passing a null shop id to updateValue()</text>
  <text x="780" y="530" text-anchor="middle" font-size="12" fill="#f2f5f8">writes to the context shop, not to the group</text>
</svg>
