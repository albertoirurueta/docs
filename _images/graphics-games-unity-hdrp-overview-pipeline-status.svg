<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-hd-stat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where HDRP sits among the Unity 6 render pipelines in November 2026</text>
<rect x="20" y="50" width="220" height="190" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="130" y="76" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Built-in Render Pipeline</text>
<text x="130" y="106" text-anchor="middle" font-size="12" fill="#374151">Deprecated in Unity 6.5</text>
<text x="130" y="130" text-anchor="middle" font-size="12" fill="#374151">available through 6.7 LTS</text>
<text x="130" y="154" text-anchor="middle" font-size="12" fill="#374151">supported at least until</text>
<text x="130" y="178" text-anchor="middle" font-size="12" fill="#374151">the end of 2028</text>
<text x="130" y="202" text-anchor="middle" font-size="12" fill="#374151">not advised for new titles</text>
<rect x="270" y="50" width="220" height="190" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="76" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Universal Render Pipeline</text>
<text x="380" y="106" text-anchor="middle" font-size="12" fill="#3730A3">Main investment</text>
<text x="380" y="130" text-anchor="middle" font-size="12" fill="#3730A3">all Unity platforms</text>
<text x="380" y="154" text-anchor="middle" font-size="12" fill="#3730A3">Render Graph, Forward+,</text>
<text x="380" y="178" text-anchor="middle" font-size="12" fill="#3730A3">GPU Resident Drawer, STP</text>
<text x="380" y="202" text-anchor="middle" font-size="12" fill="#3730A3">Shader Graph, VFX Graph</text>
<rect x="520" y="50" width="220" height="190" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="630" y="76" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">High Definition Render Pipeline</text>
<text x="630" y="106" text-anchor="middle" font-size="12" fill="#92400E">Maintenance mode</text>
<text x="630" y="130" text-anchor="middle" font-size="12" fill="#92400E">no new features planned</text>
<text x="630" y="154" text-anchor="middle" font-size="12" fill="#92400E">fixes: stability, regressions,</text>
<text x="630" y="178" text-anchor="middle" font-size="12" fill="#92400E">critical issues</text>
<text x="630" y="202" text-anchor="middle" font-size="12" fill="#92400E">high-end PC and consoles</text>
<text x="380" y="268" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Release timeline</text>
