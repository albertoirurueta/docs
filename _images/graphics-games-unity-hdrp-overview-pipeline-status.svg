<text x="210" y="316" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">6.3 LTS</text>
<text x="210" y="332" text-anchor="middle" font-size="11" fill="#374151">Dec 2025</text>
<circle cx="370" cy="292" r="6" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="370" y="316" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">6.5</text>
<text x="370" y="332" text-anchor="middle" font-size="11" fill="#374151">Built-in deprecated</text>
<circle cx="530" cy="292" r="6" fill="#4F46E5" stroke="none" stroke-width="1"/>
