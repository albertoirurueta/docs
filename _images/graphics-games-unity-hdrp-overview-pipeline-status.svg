<text x="660" y="332" text-anchor="middle" font-size="11" fill="#374151">planned end of 2026</text>
<text x="380" y="372" text-anchor="middle" font-size="12" fill="#374151">HDRP 17.3 ships with Unity 6.3 LTS; a project is either HDRP or URP, never both.</text>
