<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Remote server versus desktop server</text>
<rect x="20" y="48" width="350" height="262" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<rect x="390" y="48" width="350" height="262" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="195" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Remote (recommended)</text>
<text x="565" y="76" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Desktop</text>
<g font-size="12" fill="#374151">
<text x="36" y="104">Endpoint: https://mcp.figma.com/mcp</text>
<text x="36" y="128">No desktop app needed</text>
<text x="36" y="152">Sign in with OAuth in the browser</text>
<text x="36" y="176">Broadest feature set</text>
<text x="36" y="200">Write to canvas (beta), code to canvas,</text>
<text x="36" y="218">upload and download assets, search libraries</text>
<text x="36" y="242">Writing outside drafts needs a Full seat</text>
<text x="36" y="266">Starter plan: View or Collab limits apply</text>
<text x="406" y="104">Endpoint: http://127.0.0.1:3845/mcp</text>
<text x="406" y="128">Runs in the Figma desktop app</text>
<text x="406" y="152">Enabled in Dev Mode (Shift D)</text>
<text x="406" y="176">Reads the current selection</text>
<text x="406" y="200">No write to canvas, no UI-to-Figma</text>
<text x="406" y="224">Needs a Dev or Full seat on a paid plan</text>
<text x="406" y="248">Only option for Figma for Government</text>
<text x="406" y="272">Aimed at specific organisation needs</text></g>
</svg>
