<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" width="760" height="574" role="img" aria-labelledby="radar-all-t radar-all-d">
<title id="radar-all-t">Scores on ten axes, four tools</title>
<desc id="radar-all-d">Scores from 0 to 10 on ten axes for Docusaurus, Antora, Zensical, DocFX. Eight axes are editorial scores and two (ecosystem and maintenance health) are computed from the metrics snapshot of 2026-10-26; the rubric is in the data notes.</desc>
<style>
