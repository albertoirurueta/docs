<svg viewBox="0 0 820 470" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a58"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">EKS Pod Identity: credential flow for a Bookshelf pod</text>
  <text x="410" y="45" text-anchor="middle" font-size="11.5" fill="#5f6368">catalog-api reads S3 with temporary credentials -- no access key, no OIDC provider</text>

  <!-- Node -->
  <rect x="20" y="64" width="470" height="300" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text x="36" y="86" font-size="12.5" font-weight="700" fill="#3c4a58">Linux EC2 node (managed node group or Auto Mode)</text>

  <!-- Pod -->
  <rect x="38" y="104" width="200" height="236" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="138" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b3d91">Pod: catalog-api</text>
  <rect x="54" y="138" width="168" height="44" rx="5" fill="#ffffff" stroke="#1a73e8"/>
  <text x="138" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#0b3d91">ServiceAccount</text>
  <text x="138" y="171" text-anchor="middle" font-size="9.5" fill="#0b3d91">bookshelf/catalog-api (no annotation)</text>
  <rect x="54" y="192" width="168" height="54" rx="5" fill="#ffffff" stroke="#1a73e8"/>
  <text x="138" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b3d91">Projected token volume</text>
  <text x="138" y="223" text-anchor="middle" font-size="9" fill="#0b3d91">audience: pods.eks.amazonaws.com</text>
  <text x="138" y="237" text-anchor="middle" font-size="9" fill="#0b3d91">injected by EKS at pod creation</text>
  <rect x="54" y="256" width="168" height="72" rx="5" fill="#ffffff" stroke="#1a73e8"/>
  <text x="138" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b3d91">Java SDK 2.x, default chain</text>
  <text x="138" y="287" text-anchor="middle" font-size="8.5" fill="#0b3d91">AWS_CONTAINER_CREDENTIALS_FULL_URI</text>
  <text x="138" y="299" text-anchor="middle" font-size="8.5" fill="#0b3d91">AWS_CONTAINER_AUTHORIZATION_</text>
  <text x="138" y="311" text-anchor="middle" font-size="8.5" fill="#0b3d91">TOKEN_FILE (container provider)</text>

  <!-- Agent -->
  <rect x="290" y="104" width="180" height="150" rx="8" fill="#fef7e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="380" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4a00">Pod Identity Agent</text>
  <text x="380" y="144" text-anchor="middle" font-size="9.5" fill="#7a4a00">DaemonSet, hostNetwork</text>
  <text x="380" y="158" text-anchor="middle" font-size="9.5" fill="#7a4a00">listens on 169.254.170.23</text>
  <text x="380" y="180" text-anchor="middle" font-size="9.5" fill="#7a4a00">checks the token, calls</text>
  <text x="380" y="193" text-anchor="middle" font-size="9.5" fill="#7a4a00">AssumeRoleForPodIdentity,</text>
  <text x="380" y="206" text-anchor="middle" font-size="9.5" fill="#7a4a00">hands credentials back</text>
  <text x="380" y="230" text-anchor="middle" font-size="9" fill="#7a4a00">not needed on Auto Mode</text>

  <!-- AWS side -->
  <rect x="540" y="64" width="262" height="300" rx="10" fill="#f3f8f4" stroke="#188038" stroke-width="1.8"/>
  <text x="671" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d4c22">AWS account</text>
  <rect x="560" y="104" width="222" height="70" rx="6" fill="#d6eadf" stroke="#188038"/>
  <text x="671" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d4c22">EKS Auth API</text>
  <text x="671" y="142" text-anchor="middle" font-size="9.5" fill="#0d4c22">looks up the association:</text>
  <text x="671" y="156" text-anchor="middle" font-size="9.5" fill="#0d4c22">cluster + namespace + service account</text>
  <rect x="560" y="188" width="222" height="76" rx="6" fill="#d6eadf" stroke="#188038"/>
  <text x="671" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d4c22">IAM role bookshelf-catalog-api</text>
  <text x="671" y="226" text-anchor="middle" font-size="9.5" fill="#0d4c22">trust: pods.eks.amazonaws.com</text>
  <text x="671" y="240" text-anchor="middle" font-size="9.5" fill="#0d4c22">sts:AssumeRole + sts:TagSession</text>
  <text x="671" y="254" text-anchor="middle" font-size="9.5" fill="#0d4c22">returns temporary credentials</text>
  <rect x="560" y="280" width="222" height="68" rx="6" fill="#fde2e1" stroke="#c5221f"/>
  <text x="671" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a1a17">Target services</text>
  <text x="671" y="318" text-anchor="middle" font-size="9.5" fill="#7a1a17">S3, DynamoDB, Secrets Manager, SQS</text>
  <text x="671" y="332" text-anchor="middle" font-size="9.5" fill="#7a1a17">authorised by the role policy</text>

  <!-- Arrows -->
  <line x1="222" y1="219" x2="288" y2="190" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="470" y1="150" x2="558" y2="140" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="671" y1="174" x2="671" y2="186" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="290" y1="238" x2="224" y2="290" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M138 340 L138 392 L671 392 L671 350" fill="none" stroke="#c5221f" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Step badges -->
  <circle cx="262" cy="196" r="10" fill="#1a73e8"/><text x="262" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <circle cx="514" cy="136" r="10" fill="#1a73e8"/><text x="514" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <circle cx="685" cy="180" r="10" fill="#1a73e8"/><text x="685" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <circle cx="264" cy="270" r="10" fill="#1a73e8"/><text x="264" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <circle cx="400" cy="392" r="10" fill="#c5221f"/><text x="400" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>

  <!-- Legend -->
  <text x="20" y="420" font-size="10.5" fill="#1a1a1a">1 SDK sends its request to the agent with the projected token   2 agent calls AssumeRoleForPodIdentity with that token</text>
  <text x="20" y="436" font-size="10.5" fill="#1a1a1a">3 EKS Auth resolves the association and assumes the role   4 agent returns short-lived credentials to the SDK</text>
  <text x="20" y="452" font-size="10.5" fill="#1a1a1a">5 SDK signs the S3 / DynamoDB / SQS call with the credentials and refreshes them before expiry</text>
</svg>
