<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>The life of a method under YJIT</title>
  <desc>A flow diagram. Every method starts in the YARV interpreter, which counts calls. When the count reaches the call threshold (30 by default) YJIT lazily compiles the first basic block of the method into machine code, specialised for the types seen so far. The machine code runs; a type guard that fails causes a side exit back to the interpreter, and a block version for the new types may then be compiled. Redefining a basic method, enabling a TracePoint or similar events invalidate compiled code, which returns to the interpreter. Compilation stops once the memory limit (128 MiB by default) is reached.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">The life of a method under YJIT</text>
  <text x="470" y="50" font-size="12" fill="#666666" text-anchor="middle">compilation is lazy and driven by what the running program actually does</text>

  <rect x="30" y="100" width="190" height="80" rx="6" fill="#f3f3f3" stroke="#888888"/>
  <text x="125" y="130" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">YARV interpreter</text>
  <text x="125" y="150" font-size="12" fill="#444444" text-anchor="middle">runs the instruction</text>
  <text x="125" y="166" font-size="12" fill="#444444" text-anchor="middle">sequence, counts calls</text>

  <rect x="285" y="100" width="190" height="80" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="380" y="130" font-size="14" font-weight="bold" fill="#1f3f6e" text-anchor="middle">Hot enough?</text>
  <text x="380" y="150" font-size="12" fill="#444444" text-anchor="middle">calls reach the threshold</text>
  <text x="380" y="166" font-size="12" fill="#444444" text-anchor="middle">(default 30 calls)</text>

  <rect x="540" y="100" width="190" height="80" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="635" y="130" font-size="14" font-weight="bold" fill="#1f3f6e" text-anchor="middle">Compile a block</text>
  <text x="635" y="150" font-size="12" fill="#444444" text-anchor="middle">machine code for the types</text>
  <text x="635" y="166" font-size="12" fill="#444444" text-anchor="middle">seen so far (lazy BBV)</text>

  <rect x="740" y="250" width="170" height="80" rx="6" fill="#e6f4ea" stroke="#3c8d5a"/>
  <text x="825" y="280" font-size="14" font-weight="bold" fill="#1d5a36" text-anchor="middle">Machine code runs</text>
  <text x="825" y="300" font-size="12" fill="#444444" text-anchor="middle">type guards check the</text>
  <text x="825" y="316" font-size="12" fill="#444444" text-anchor="middle">assumptions</text>

  <rect x="480" y="250" width="200" height="80" rx="6" fill="#fdf1e3" stroke="#c07a2c"/>
  <text x="580" y="280" font-size="14" font-weight="bold" fill="#7a4a10" text-anchor="middle">Side exit</text>
  <text x="580" y="300" font-size="12" fill="#444444" text-anchor="middle">a guard failed: back to the</text>
  <text x="580" y="316" font-size="12" fill="#444444" text-anchor="middle">interpreter, maybe a new version</text>

  <rect x="190" y="250" width="240" height="80" rx="6" fill="#fbeaea" stroke="#b85450"/>
  <text x="310" y="280" font-size="14" font-weight="bold" fill="#7a2a27" text-anchor="middle">Invalidation</text>
  <text x="310" y="300" font-size="12" fill="#444444" text-anchor="middle">redefined basic operator,</text>
  <text x="310" y="316" font-size="12" fill="#444444" text-anchor="middle">TracePoint, new constant</text>

  <line x1="220" y1="140" x2="283" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="475" y1="140" x2="538" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="506" y="132" font-size="11" fill="#444444" text-anchor="middle">yes</text>
  <path d="M635,180 L635,215 L825,215 L825,248" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="738" y1="290" x2="682" y2="290" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="710" y="282" font-size="11" fill="#444444" text-anchor="middle">miss</text>
  <path d="M580,330 L580,372 L125,372 L125,182" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="352" y="366" font-size="11" fill="#444444" text-anchor="middle">execution continues in the interpreter</text>
  <path d="M310,250 L310,215 L125,215 L125,182" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="217" y="209" font-size="11" fill="#444444" text-anchor="middle">code discarded</text>
  <text x="380" y="198" font-size="11" fill="#444444" text-anchor="middle">no: keep interpreting</text>

  <text x="470" y="410" font-size="12" fill="#666666" text-anchor="middle">compilation stops when the memory limit is reached (128 MiB by default); a cold method is never compiled</text>
</svg>
