<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What the server decides each network update</text>
<rect x="40" y="52" width="430" height="46" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255.0" y="71" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">All replicated actors</text>
<text x="255.0" y="88" text-anchor="middle" font-size="12" fill="#374151">bReplicates = true</text>
<line x1="255.0" y1="98" x2="230.0" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="110" width="400" height="46" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240.0" y="129" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Dormancy</text>
<text x="240.0" y="146" text-anchor="middle" font-size="12" fill="#3730A3">DORM_DormantAll actors are skipped</text>
<line x1="240.0" y1="156" x2="215.0" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="168" width="370" height="46" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="225.0" y="187" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Relevancy</text>
<text x="225.0" y="204" text-anchor="middle" font-size="12" fill="#3730A3">IsNetRelevantFor per connection</text>
<line x1="225.0" y1="214" x2="200.0" y2="226" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="226" width="340" height="46" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="210.0" y="245" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Priority and frequency</text>
<text x="210.0" y="262" text-anchor="middle" font-size="12" fill="#3730A3">NetPriority, NetUpdateFrequency</text>
<line x1="210.0" y1="272" x2="185.0" y2="284" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="284" width="310" height="46" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="303" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Bandwidth budget</text>
<text x="195.0" y="320" text-anchor="middle" font-size="12" fill="#92400E">highest priority actors first</text>
<line x1="195.0" y1="330" x2="170.0" y2="342" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="342" width="280" height="46" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="180.0" y="361" text-anchor="middle" font-size="13" fill="#047857" font-weight="bold">Serialise changes</text>
<text x="180.0" y="378" text-anchor="middle" font-size="12" fill="#047857">properties with conditions, RPCs</text>
<text x="490" y="70" text-anchor="start" font-size="11" fill="#374151">Skipped actors cost no CPU. Wake them with</text>
<text x="490" y="84" text-anchor="start" font-size="11" fill="#374151">SetNetDormancy(DORM_Awake) or</text>
<text x="490" y="98" text-anchor="start" font-size="11" fill="#374151">FlushNetDormancy before a property change.</text>
<text x="490" y="128" text-anchor="start" font-size="11" fill="#374151">Owner, bAlwaysRelevant, bOnlyRelevantToOwner,</text>
<text x="490" y="142" text-anchor="start" font-size="11" fill="#374151">attachment, hidden state and</text>
<text x="490" y="156" text-anchor="start" font-size="11" fill="#374151">NetCullDistanceSquared are checked.</text>
<text x="490" y="186" text-anchor="start" font-size="11" fill="#374151">Pawns and PlayerControllers default to priority</text>
<text x="490" y="200" text-anchor="start" font-size="11" fill="#374151">3.0, a plain Actor to 1.0; waiting raises it.</text>
<text x="490" y="244" text-anchor="start" font-size="11" fill="#374151">When the connection saturates, low priority</text>
<text x="490" y="258" text-anchor="start" font-size="11" fill="#374151">actors wait for a later update.</text>
<text x="380" y="426" text-anchor="middle" font-size="11" fill="#374151">Iris replaces dormancy checks, relevancy and priority with filtering and prioritisation inside its own pipeline.</text>
</svg>
