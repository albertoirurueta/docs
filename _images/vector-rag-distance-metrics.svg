<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Distance and similarity metrics, shown geometrically</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Same two points q (query) and d (document); the metric decides which one is "closer"</text>

  <!-- Panel 1: Euclidean / L2 -->
  <g>
    <rect x="20" y="70" width="220" height="210" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="130" y="92" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">L2 (Euclidean)</text>
    <line x1="60" y1="230" x2="60" y2="110" stroke="#eeeeee" stroke-width="1"/>
    <line x1="60" y1="230" x2="210" y2="230" stroke="#eeeeee" stroke-width="1"/>
    <circle cx="90" cy="200" r="4" fill="#1c4b73"/>
    <text x="90" y="216" font-size="11" fill="#1c4b73" text-anchor="middle">q</text>
    <circle cx="180" cy="130" r="4" fill="#7a3b12"/>
    <text x="188" y="126" font-size="11" fill="#7a3b12">d</text>
    <line x1="90" y1="200" x2="180" y2="130" stroke="#c0392b" stroke-width="2"/>
    <text x="150" y="158" font-size="10.5" fill="#c0392b">straight-line distance</text>
    <text x="130" y="256" font-size="11" fill="#444444" text-anchor="middle">smaller = more similar</text>
    <text x="130" y="270" font-size="10.5" fill="#888888" text-anchor="middle">magnitude matters</text>
  </g>

  <!-- Panel 2: Cosine -->
  <g>
    <rect x="270" y="70" width="220" height="210" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="380" y="92" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Cosine</text>
    <line x1="310" y1="230" x2="310" y2="110" stroke="#eeeeee" stroke-width="1"/>
    <line x1="310" y1="230" x2="460" y2="230" stroke="#eeeeee" stroke-width="1"/>
    <line x1="310" y1="230" x2="400" y2="140" stroke="#1c4b73" stroke-width="2"/>
    <circle cx="400" cy="140" r="4" fill="#1c4b73"/>
    <text x="408" y="136" font-size="11" fill="#1c4b73">q</text>
    <line x1="310" y1="230" x2="440" y2="160" stroke="#7a3b12" stroke-width="2"/>
    <circle cx="440" cy="160" r="4" fill="#7a3b12"/>
    <text x="448" y="156" font-size="11" fill="#7a3b12">d</text>
    <path d="M 340 208 A 40 40 0 0 1 355 190" fill="none" stroke="#2f5424" stroke-width="1.5"/>
    <text x="368" y="212" font-size="10.5" fill="#2f5424">angle θ</text>
    <text x="380" y="256" font-size="11" fill="#444444" text-anchor="middle">larger cos(θ) = more similar</text>
    <text x="380" y="270" font-size="10.5" fill="#888888" text-anchor="middle">ignores vector length</text>
  </g>

  <!-- Panel 3: Inner product -->
  <g>
    <rect x="520" y="70" width="220" height="210" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="630" y="92" font-size="13" font-weight="bold" fill="#7a3b12" text-anchor="middle">Inner product</text>
    <line x1="560" y1="230" x2="560" y2="110" stroke="#eeeeee" stroke-width="1"/>
    <line x1="560" y1="230" x2="710" y2="230" stroke="#eeeeee" stroke-width="1"/>
    <line x1="560" y1="230" x2="650" y2="140" stroke="#1c4b73" stroke-width="2"/>
    <circle cx="650" cy="140" r="4" fill="#1c4b73"/>
    <text x="658" y="136" font-size="11" fill="#1c4b73">q</text>
    <line x1="560" y1="230" x2="700" y2="200" stroke="#7a3b12" stroke-width="3"/>
    <circle cx="700" cy="200" r="4" fill="#7a3b12"/>
    <text x="675" y="216" font-size="11" fill="#7a3b12">d (longer vector)</text>
    <text x="630" y="256" font-size="11" fill="#444444" text-anchor="middle">larger = more similar</text>
    <text x="630" y="270" font-size="10.5" fill="#888888" text-anchor="middle">rewards magnitude, needs normalized vectors</text>
  </g>

  <!-- Bottom: L1, Hamming, Jaccard as compact strips -->
  <g>
    <rect x="20" y="300" width="230" height="130" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="135" y="322" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">L1 (Manhattan)</text>
    <path d="M 50 400 L 50 360 L 220 360" fill="none" stroke="#c0392b" stroke-width="2"/>
    <circle cx="50" cy="400" r="4" fill="#1c4b73"/>
    <circle cx="220" cy="360" r="4" fill="#7a3b12"/>
    <text x="135" y="416" font-size="10.5" fill="#444444" text-anchor="middle">sum of axis-aligned steps; robust to outliers</text>
  </g>

  <g>
    <rect x="265" y="300" width="230" height="130" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="380" y="322" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Hamming</text>
    <text x="290" y="362" font-size="13" font-family="monospace" fill="#1c4b73">q 1 0 1 1 0 1</text>
    <text x="290" y="384" font-size="13" font-family="monospace" fill="#7a3b12">d 1 1 1 0 0 1</text>
    <text x="380" y="416" font-size="10.5" fill="#444444" text-anchor="middle">count of differing bits; binary/hashed codes</text>
  </g>

  <g>
    <rect x="510" y="300" width="230" height="130" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="625" y="322" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Jaccard</text>
    <circle cx="595" cy="380" r="34" fill="#1c4b7333" stroke="#1c4b73" stroke-width="1.5"/>
    <circle cx="640" cy="380" r="34" fill="#7a3b1233" stroke="#7a3b12" stroke-width="1.5"/>
    <text x="617" y="384" font-size="10" fill="#333333" text-anchor="middle">∩</text>
    <text x="625" y="416" font-size="10.5" fill="#444444" text-anchor="middle">|A ∩ B| / |A ∪ B|; sets, sparse/binary features</text>
  </g>

  <text x="380" y="460" font-size="11" fill="#444444" text-anchor="middle">On unit-normalized vectors, cosine similarity and inner product produce the same ranking --</text>
  <text x="380" y="476" font-size="11" fill="#444444" text-anchor="middle">most engines expose both because inner product avoids the extra normalization step at query time.</text>
  <text x="380" y="498" font-size="10.5" fill="#888888" text-anchor="middle">Geometry is illustrative only; it is not drawn from a real embedding space.</text>
</svg>
