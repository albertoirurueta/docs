<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How the signing pieces fit together</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">FieldNotes, team ABCDE12345: what the developer account issues or registers, and where it ends up</text>

  <defs>
    <marker id="sp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Team -->
  <rect x="566" y="66" width="174" height="84" rx="10" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="653" y="92" font-size="15" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Team ABCDE12345</text>
  <text x="653" y="114" font-size="13" fill="#333333" text-anchor="middle">Developer Program</text>
  <text x="653" y="134" font-size="13" fill="#333333" text-anchor="middle">individual or organization</text>

  <!-- Explanation next to the team -->
  <text x="20" y="92" font-size="13" fill="#444444">Everything in the dashed area is registered to one team in</text>
  <text x="20" y="112" font-size="13" fill="#444444">Certificates, Identifiers &amp; Profiles, by Xcode (automatic signing)</text>
  <text x="20" y="132" font-size="13" fill="#444444">or by hand (manual signing). The team issues the certificate.</text>

  <!-- Team to certificate -->
  <line x1="653" y1="150" x2="653" y2="194" stroke="#333333" stroke-width="1.5" marker-end="url(#sp-arrow)"/>

  <!-- Dashed team boundary -->
  <rect x="12" y="170" width="736" height="142" rx="12" fill="none" stroke="#8a5a1c" stroke-width="1.2" stroke-dasharray="6,5"/>

  <!-- App ID -->
  <rect x="20" y="198" width="172" height="104" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="106" y="222" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">App ID</text>
  <text x="106" y="243" font-size="13" fill="#333333" text-anchor="middle">ABCDE12345.</text>
  <text x="106" y="261" font-size="13" fill="#333333" text-anchor="middle">com.example.fieldnotes</text>
  <text x="106" y="279" font-size="13" fill="#333333" text-anchor="middle">one explicit ID per</text>
  <text x="106" y="297" font-size="13" fill="#333333" text-anchor="middle">target (.widgets, ...)</text>

  <!-- Entitlements -->
  <rect x="202" y="198" width="172" height="104" rx="10" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="288" y="222" font-size="15" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Entitlements</text>
  <text x="288" y="243" font-size="13" fill="#333333" text-anchor="middle">capabilities enabled</text>
  <text x="288" y="261" font-size="13" fill="#333333" text-anchor="middle">on the App ID: App Groups,</text>
  <text x="288" y="279" font-size="13" fill="#333333" text-anchor="middle">iCloud, Push, Associated</text>
  <text x="288" y="297" font-size="13" fill="#333333" text-anchor="middle">Domains, Sign in with Apple</text>

  <!-- Devices -->
  <rect x="384" y="198" width="172" height="104" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="470" y="222" font-size="15" font-weight="bold" fill="#2d6a34" text-anchor="middle">Devices</text>
  <text x="470" y="243" font-size="13" fill="#333333" text-anchor="middle">registered UDIDs,</text>
  <text x="470" y="261" font-size="13" fill="#333333" text-anchor="middle">100 per family per year</text>
  <text x="470" y="279" font-size="13" fill="#333333" text-anchor="middle">development and ad hoc;</text>
  <text x="470" y="297" font-size="13" fill="#333333" text-anchor="middle">App Store profiles: none</text>

  <!-- Certificate -->
  <rect x="566" y="198" width="174" height="104" rx="10" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="653" y="222" font-size="15" font-weight="bold" fill="#a33333" text-anchor="middle">Certificate</text>
  <text x="653" y="243" font-size="13" fill="#333333" text-anchor="middle">Apple Development or</text>
  <text x="653" y="261" font-size="13" fill="#333333" text-anchor="middle">Apple Distribution</text>
  <text x="653" y="279" font-size="13" fill="#333333" text-anchor="middle">private key in Keychain,</text>
  <text x="653" y="297" font-size="13" fill="#333333" text-anchor="middle">or cloud-managed</text>

  <!-- Converge into the profile -->
  <line x1="106" y1="302" x2="106" y2="334" stroke="#333333" stroke-width="1.5"/>
  <line x1="288" y1="302" x2="288" y2="334" stroke="#333333" stroke-width="1.5"/>
  <line x1="470" y1="302" x2="470" y2="334" stroke="#333333" stroke-width="1.5"/>
  <line x1="653" y1="302" x2="653" y2="334" stroke="#333333" stroke-width="1.5"/>
  <line x1="106" y1="334" x2="653" y2="334" stroke="#333333" stroke-width="1.5"/>
  <line x1="380" y1="334" x2="380" y2="360" stroke="#333333" stroke-width="1.5" marker-end="url(#sp-arrow)"/>

  <!-- Provisioning profile -->
  <rect x="120" y="364" width="520" height="106" rx="10" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.8"/>
  <text x="380" y="390" font-size="15" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Provisioning profile (signed by Apple)</text>
  <text x="380" y="412" font-size="13" fill="#333333" text-anchor="middle">who: certificates  +  what: App ID  +  where: devices</text>
  <text x="380" y="432" font-size="13" fill="#333333" text-anchor="middle">when: expiration date  +  how: entitlement allowlist</text>
  <text x="380" y="454" font-size="13" fill="#333333" text-anchor="middle">Development, Ad Hoc, App Store Connect, Developer ID or In-House</text>

  <line x1="380" y1="470" x2="380" y2="500" stroke="#333333" stroke-width="1.5" marker-end="url(#sp-arrow)"/>

  <!-- Signed build -->
  <rect x="120" y="504" width="520" height="86" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="380" y="530" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Signed build: FieldNotes.app</text>
  <text x="380" y="552" font-size="13" fill="#333333" text-anchor="middle">codesign seals the code and the entitlements it claims (a subset of the</text>
  <text x="380" y="572" font-size="13" fill="#333333" text-anchor="middle">allowlist); the profile is embedded as embedded.mobileprovision</text>

  <text x="380" y="614" font-size="13" fill="#666666" text-anchor="middle">Most signing errors are two of these pieces disagreeing. The App Store re-signs the build on distribution.</text>
  <text x="380" y="632" font-size="13" fill="#666666" text-anchor="middle">Supersedes the React Native figure react-native-ios-signing-pieces.svg.</text>
</svg>
