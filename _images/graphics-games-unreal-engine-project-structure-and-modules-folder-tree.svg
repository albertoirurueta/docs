<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Layout of the Bookshelf project folder</text>
<rect x="40" y="44" width="78" height="20" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="48" y="59" text-anchor="start" font-size="12" fill="#1F2937">Bookshelf/</text>
<text x="410" y="59" text-anchor="start" font-size="11" fill="#374151">project root</text>
<rect x="66" y="66" width="127" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="74" y="81" text-anchor="start" font-size="12" fill="#1F2937">Bookshelf.uproject</text>
<text x="410" y="81" text-anchor="start" font-size="11" fill="#374151">JSON descriptor: engine, modules, plugins</text>
<rect x="66" y="88" width="59" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="74" y="103" text-anchor="start" font-size="12" fill="#1F2937">Config/</text>
<text x="410" y="103" text-anchor="start" font-size="11" fill="#374151">DefaultEngine.ini, DefaultGame.ini, DefaultInput.ini</text>
<rect x="66" y="110" width="65" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="74" y="125" text-anchor="start" font-size="12" fill="#1F2937">Content/</text>
<text x="410" y="125" text-anchor="start" font-size="11" fill="#374151">assets: .uasset and .umap (large, use Git LFS)</text>
<rect x="66" y="132" width="59" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="74" y="147" text-anchor="start" font-size="12" fill="#1F2937">Source/</text>
<text x="410" y="147" text-anchor="start" font-size="11" fill="#374151">all project C++ and build scripts</text>
<rect x="92" y="154" width="133" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="100" y="169" text-anchor="start" font-size="12" fill="#1F2937">Bookshelf.Target.cs</text>
<text x="410" y="169" text-anchor="start" font-size="11" fill="#374151">Game target</text>
<rect x="92" y="176" width="171" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="100" y="191" text-anchor="start" font-size="12" fill="#1F2937">BookshelfEditor.Target.cs</text>
<text x="410" y="191" text-anchor="start" font-size="11" fill="#374151">Editor target</text>
<rect x="92" y="198" width="78" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="100" y="213" text-anchor="start" font-size="12" fill="#1F2937">Bookshelf/</text>
<text x="410" y="213" text-anchor="start" font-size="11" fill="#374151">the primary game module</text>
<rect x="118" y="220" width="127" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="126" y="235" text-anchor="start" font-size="12" fill="#1F2937">Bookshelf.Build.cs</text>
<text x="410" y="235" text-anchor="start" font-size="11" fill="#374151">ModuleRules: dependencies</text>
<rect x="118" y="242" width="140" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="126" y="257" text-anchor="start" font-size="12" fill="#1F2937">Public/ and Private/</text>
<text x="410" y="257" text-anchor="start" font-size="11" fill="#374151">headers and sources</text>
<rect x="66" y="264" width="65" height="20" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="74" y="279" text-anchor="start" font-size="12" fill="#1F2937">Plugins/</text>
<text x="410" y="279" text-anchor="start" font-size="11" fill="#374151">project plugins, each with a .uplugin</text>
<rect x="66" y="286" width="71" height="20" rx="5" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="74" y="301" text-anchor="start" font-size="12" fill="#1F2937">Binaries/</text>
<text x="410" y="301" text-anchor="start" font-size="11" fill="#374151">compiled DLLs and executables</text>
<rect x="66" y="308" width="96" height="20" rx="5" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="74" y="323" text-anchor="start" font-size="12" fill="#1F2937">Intermediate/</text>
<text x="410" y="323" text-anchor="start" font-size="11" fill="#374151">generated code, project files, shaders</text>
<rect x="66" y="330" width="53" height="20" rx="5" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="74" y="345" text-anchor="start" font-size="12" fill="#1F2937">Saved/</text>
<text x="410" y="345" text-anchor="start" font-size="11" fill="#374151">logs, autosaves, local ini, crash data</text>
<rect x="66" y="352" width="121" height="20" rx="5" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="74" y="367" text-anchor="start" font-size="12" fill="#1F2937">DerivedDataCache/</text>
<text x="410" y="367" text-anchor="start" font-size="11" fill="#374151">derived data, can be rebuilt</text>
<rect x="40" y="390" width="18" height="14" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="66" y="402" text-anchor="start" font-size="11" fill="#374151">put under source control</text>
<rect x="260" y="390" width="18" height="14" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="286" y="402" text-anchor="start" font-size="11" fill="#374151">generated, ignore in Git</text>
</svg>
