<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Timeline of client-side prediction and server reconciliation in Pixel Arena: the client applies inputs 43 to 51 at once and keeps them pending, the server processes inputs 43 to 45 in its tick and answers with a snapshot carrying lastProcessedInput 45, and the client restarts from that position and replays inputs 46 to 51</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Prediction and reconciliation, step by step</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">time runs left to right; 50 ms one way; the client sends one input per 60 Hz frame, the server ticks at 20 Hz</text>

  <rect x="20" y="70" width="760" height="86" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="34" y="92" font-size="13" font-weight="bold" fill="#0d3c75">Client</text>
  <rect x="20" y="300" width="760" height="86" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="34" y="322" font-size="13" font-weight="bold" fill="#7a2e00">Server</text>

  <g font-size="10" fill="#0d3c75" text-anchor="middle">
    <circle cx="110" cy="120" r="9" fill="#1565c0"/><text x="110" y="124" fill="#ffffff" font-size="9" font-weight="bold">43</text>
    <circle cx="150" cy="120" r="9" fill="#1565c0"/><text x="150" y="124" fill="#ffffff" font-size="9" font-weight="bold">44</text>
    <circle cx="190" cy="120" r="9" fill="#1565c0"/><text x="190" y="124" fill="#ffffff" font-size="9" font-weight="bold">45</text>
    <circle cx="230" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="230" y="124" font-size="9" font-weight="bold">46</text>
    <circle cx="270" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="270" y="124" font-size="9" font-weight="bold">47</text>
    <circle cx="310" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="310" y="124" font-size="9" font-weight="bold">48</text>
    <circle cx="350" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="350" y="124" font-size="9" font-weight="bold">49</text>
    <circle cx="390" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="390" y="124" font-size="9" font-weight="bold">50</text>
    <circle cx="430" cy="120" r="9" fill="#90caf9" stroke="#1565c0"/><text x="430" y="124" font-size="9" font-weight="bold">51</text>
  </g>
  <text x="452" y="124" font-size="10" fill="#0d3c75">each input is applied to the local</text>
  <text x="452" y="138" font-size="10" fill="#0d3c75">avatar the moment it is sent</text>

  <line x1="110" y1="130" x2="230" y2="292" stroke="#37474f" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="150" y1="130" x2="270" y2="292" stroke="#37474f" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="190" y1="130" x2="310" y2="292" stroke="#37474f" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="134" y="214" font-size="10" fill="#37474f" transform="rotate(53 134 214)">inputs 43 44 45</text>

  <line x1="320" y1="308" x2="320" y2="372" stroke="#e65100" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="328" y="338" font-size="11" font-weight="bold" fill="#7a2e00">tick: apply 43, 44, 45</text>
  <text x="328" y="354" font-size="10" fill="#7a2e00">position P45, lastProcessedInput = 45</text>
  <circle cx="320" cy="372" r="5" fill="#e65100"/>

  <line x1="320" y1="366" x2="440" y2="164" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="376" y="298" font-size="11" font-weight="bold" fill="#1b4d1f" transform="rotate(-59 376 298)">snapshot { x, y, ack: 45 }</text>

  <rect x="470" y="170" width="300" height="112" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="482" y="190" font-size="12" font-weight="bold" fill="#1b4d1f">When the snapshot arrives</text>
  <text x="482" y="208" font-size="10.5" fill="#1b4d1f">1. drop pending inputs with seq 45 or lower</text>
  <text x="482" y="224" font-size="10.5" fill="#1b4d1f">2. set the position to the server's P45</text>
  <text x="482" y="240" font-size="10.5" fill="#1b4d1f">3. replay 46 47 48 49 50 51 on top of it</text>
  <text x="482" y="256" font-size="10.5" fill="#1b4d1f">4. draw the result: identical to the prediction</text>
  <text x="482" y="272" font-size="10.5" fill="#1b4d1f">unless the server disagreed (a knockback)</text>

  <text x="400" y="418" font-size="10.5" fill="#555555" text-anchor="middle">light blue circles are inputs that the server has not yet acknowledged: they are the ones that must be replayed</text>
</svg>
