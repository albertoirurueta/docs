<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rendering timelines of the Next.js strategies</title>
  <desc id="d">Six horizontal timelines compare CSR, SSR, SSG, ISR, streaming SSR and Partial Prerendering. Each shows server work, the arrival of HTML, JavaScript download, hydration and the moment the page becomes interactive. CSR shows content last, SSR waits for the server before any HTML, SSG and ISR deliver HTML at once from a CDN, streaming sends a shell first and later chunks, and PPR sends a static shell from a CDN while the dynamic parts stream in.</desc>
  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>
  <text x="460.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What happens after the browser asks for a page, per rendering strategy</text>
  <text x="460.0" y="47" font-size="12" fill="#555555" text-anchor="middle">Illustrative, not to scale. Time flows to the right; the page is interactive at the star.</text>
  <rect x="20" y="64" width="16" height="12" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="42" y="75" font-size="12" fill="#333333">server work</text>
  <rect x="141" y="64" width="16" height="12" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="163" y="75" font-size="12" fill="#333333">CDN / shell</text>
  <rect x="262" y="64" width="16" height="12" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="284" y="75" font-size="12" fill="#333333">JS download</text>
  <rect x="383" y="64" width="16" height="12" fill="#f1ebf8" stroke="#5b3a8c" stroke-width="1.4"/>
  <text x="405" y="75" font-size="12" fill="#333333">client work</text>
  <rect x="504" y="64" width="16" height="12" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="526" y="75" font-size="12" fill="#333333">hydration</text>
  <polygon points="617,64 623,76 611,76" fill="#1d4f91"/>
  <text x="629" y="75" font-size="12" fill="#333333">first content</text>
  <text x="734" y="76" font-size="15" fill="#b00020">&#9733;</text>
  <text x="752" y="75" font-size="12" fill="#333333">interactive</text>
  <line x1="20" y1="92" x2="900" y2="92" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="118" font-size="15" font-weight="bold" fill="#222222">CSR</text>
  <text x="20" y="136" font-size="11" fill="#555555">client-side rendering</text>
  <rect x="200.0" y="104" width="36.0" height="19" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="218.0" y="118" font-size="11" fill="#222222" text-anchor="middle">shell</text>
  <rect x="236.0" y="104" width="270.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="371.0" y="118" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="506.0" y="104" width="234.0" height="19" fill="#f1ebf8" stroke="#5b3a8c" stroke-width="1.4"/>
  <text x="623.0" y="118" font-size="11" fill="#222222" text-anchor="middle">run JS, fetch data</text>
  <polygon points="236.0,148 242.0,157 230.0,157" fill="#1d4f91"/>
  <text x="246.0" y="156" font-size="11" fill="#1d3557">blank / loading</text>
  <polygon points="740.0,148 746.0,157 734.0,157" fill="#1d4f91"/>
  <text x="750.0" y="156" font-size="11" fill="#1d3557">content</text>
  <text x="743.0" y="120" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="20" y1="170" x2="900" y2="170" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="196" font-size="15" font-weight="bold" fill="#222222">SSR</text>
  <text x="20" y="214" font-size="11" fill="#555555">server-side rendering</text>
  <rect x="200.0" y="182" width="270.0" height="19" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="335.0" y="196" font-size="11" fill="#222222" text-anchor="middle">render per request</text>
  <rect x="470.0" y="182" width="198.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="569.0" y="196" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="668.0" y="182" width="126.0" height="19" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="731.0" y="196" font-size="11" fill="#222222" text-anchor="middle">hydrate</text>
  <polygon points="470.0,226 476.0,235 464.0,235" fill="#1d4f91"/>
  <text x="480.0" y="234" font-size="11" fill="#1d3557">content</text>
  <text x="797.0" y="198" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="20" y1="248" x2="900" y2="248" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="274" font-size="15" font-weight="bold" fill="#222222">SSG</text>
  <text x="20" y="292" font-size="11" fill="#555555">static generation (HTML built earlier)</text>
  <rect x="200.0" y="260" width="27.0" height="19" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="213.5" y="274" font-size="11" fill="#222222" text-anchor="middle">CDN</text>
  <rect x="227.0" y="260" width="198.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="326.0" y="274" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="425.0" y="260" width="126.0" height="19" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="488.0" y="274" font-size="11" fill="#222222" text-anchor="middle">hydrate</text>
  <polygon points="227.0,304 233.0,313 221.0,313" fill="#1d4f91"/>
  <text x="237.0" y="312" font-size="11" fill="#1d3557">content</text>
  <text x="554.0" y="276" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="20" y1="326" x2="900" y2="326" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="352" font-size="15" font-weight="bold" fill="#222222">ISR</text>
  <text x="20" y="370" font-size="11" fill="#555555">SSG + regeneration</text>
  <rect x="200.0" y="338" width="27.0" height="19" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="213.5" y="352" font-size="11" fill="#222222" text-anchor="middle">CDN</text>
  <rect x="227.0" y="338" width="198.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="326.0" y="352" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="425.0" y="338" width="126.0" height="19" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="488.0" y="352" font-size="11" fill="#222222" text-anchor="middle">hydrate</text>
  <rect x="614.0" y="338" width="270.0" height="19" fill="#ffffff" stroke="#9a5b00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="749.0" y="352" font-size="11" fill="#5c3500" text-anchor="middle">regenerate in background</text>
  <polygon points="227.0,382 233.0,391 221.0,391" fill="#1d4f91"/>
  <text x="237.0" y="390" font-size="11" fill="#1d3557">content</text>
  <text x="554.0" y="354" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="20" y1="404" x2="900" y2="404" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="430" font-size="15" font-weight="bold" fill="#222222">Streaming</text>
  <text x="20" y="448" font-size="11" fill="#555555">SSR with Suspense</text>
  <rect x="200.0" y="416" width="54.0" height="19" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="227.0" y="430" font-size="11" fill="#222222" text-anchor="middle">shell</text>
  <rect x="254.0" y="416" width="216.0" height="19" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="362.0" y="430" font-size="11" fill="#222222" text-anchor="middle">data behind Suspense</text>
  <rect x="254.0" y="438" width="198.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="353.0" y="452" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="452.0" y="438" width="126.0" height="19" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="515.0" y="452" font-size="11" fill="#222222" text-anchor="middle">hydrate</text>
  <polygon points="254.0,460 260.0,469 248.0,469" fill="#1d4f91"/>
  <text x="264.0" y="468" font-size="11" fill="#1d3557">shell</text>
  <polygon points="470.0,460 476.0,469 464.0,469" fill="#1d4f91"/>
  <text x="480.0" y="468" font-size="11" fill="#1d3557">content</text>
  <text x="581.0" y="454" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="20" y1="482" x2="900" y2="482" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="508" font-size="15" font-weight="bold" fill="#222222">PPR</text>
  <text x="20" y="526" font-size="11" fill="#555555">static shell + streamed holes</text>
  <rect x="200.0" y="494" width="27.0" height="19" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="213.5" y="508" font-size="11" fill="#222222" text-anchor="middle">CDN</text>
  <rect x="227.0" y="494" width="198.0" height="19" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="326.0" y="508" font-size="11" fill="#222222" text-anchor="middle">JS download</text>
  <rect x="227.0" y="516" width="225.0" height="19" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="339.5" y="530" font-size="11" fill="#222222" text-anchor="middle">dynamic holes stream in</text>
  <rect x="425.0" y="494" width="135.0" height="19" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="492.5" y="508" font-size="11" fill="#222222" text-anchor="middle">hydrate</text>
  <polygon points="227.0,538 233.0,547 221.0,547" fill="#1d4f91"/>
  <text x="237.0" y="546" font-size="11" fill="#1d3557">shell</text>
  <polygon points="452.0,538 458.0,547 446.0,547" fill="#1d4f91"/>
  <text x="462.0" y="546" font-size="11" fill="#1d3557">content</text>
  <text x="563.0" y="510" font-size="17" fill="#b00020">&#9733;</text>
  <line x1="200" y1="566" x2="890" y2="566" stroke="#444444" stroke-width="1.6"/>
  <polygon points="900,566 890,562 890,570" fill="#444444"/>
  <text x="890" y="584" font-size="12" fill="#333333" text-anchor="end">time after the request</text>
  <text x="20" y="584" font-size="12" fill="#333333">SSG, ISR and the PPR shell did their rendering at build time or earlier.</text>
</svg>
