<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-shadows-light-space-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The shadow test: compare light-space depths</text>
<rect x="20" y="50" width="500" height="320" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<circle cx="200" cy="85" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<text x="200" y="63" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">light (looking down)</text>
<polygon points="300,160 360,160 360,200 300,200" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="330" y="184" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book</text>
<line x1="60" y1="310" x2="500" y2="310" stroke="#4B5563" stroke-width="3"/>
<text x="110" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shelf board</text>
<rect x="390" y="306" width="110" height="8" fill="#9CA3AF"/>
<text x="445" y="348" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">in shadow</text>
<line x1="200" y1="85" x2="255" y2="310" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-shadows-light-space-depth)"/>
<line x1="200" y1="85" x2="337" y2="168" stroke="#B45309" stroke-width="1.5"/>
<line x1="337" y1="168" x2="440" y2="310" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="255" cy="310" r="5" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="255" y="296" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">A</text>
<circle cx="440" cy="310" r="5" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="440" y="296" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">B</text>
<text x="222" y="210" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">zA</text>
<text x="268" y="130" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">zmap(B)</text>
<rect x="540" y="50" width="200" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="84.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Pass 1 (light view)</text>
<text x="640.0" y="99.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">stores the depth of the</text>
<text x="640.0" y="114.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">nearest surface per texel</text>
<rect x="540" y="150" width="200" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="181.7" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Pass 2 (camera view)</text>
<text x="640.0" y="196.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">move P into light space,</text>
<text x="640.0" y="211.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">read zmap at its uv, compare</text>
<text x="640.0" y="226.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">with the fragment depth zP</text>
<rect x="540" y="260" width="200" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="296.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">A: zA is about zmap(A)</text>
<text x="640.0" y="311.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">so A is lit</text>
<text x="640.0" y="326.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">B: zB &gt; zmap(B) + bias</text>
<text x="640.0" y="341.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">the book is nearer: shadow</text>
</svg>
