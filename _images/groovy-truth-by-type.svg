<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">The Groovy Truth by type</title>
  <desc id="d">A two-column table of values that Groovy coerces to false and the similar-looking values that are true.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #1f2933; }
    .h { font-weight: bold; font-size: 15px; fill: #ffffff; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 13px; }
  </style>
  <rect x="10" y="10" width="340" height="32" rx="6" fill="#b3261e"/>
  <text class="h" x="24" y="31">Coerced to false</text>
  <rect x="370" y="10" width="340" height="32" rx="6" fill="#1f7a3d"/>
  <text class="h" x="384" y="31">Coerced to true (look-alikes)</text>
  <g>
    <rect x="10" y="52" width="340" height="298" rx="6" fill="#fdf1f0" stroke="#b3261e"/>
    <rect x="370" y="52" width="340" height="298" rx="6" fill="#eef8f1" stroke="#1f7a3d"/>
    <text class="m" x="24" y="80">null</text>
    <text class="m" x="384" y="80">new Object()</text>
    <text class="m" x="24" y="112">false</text>
    <text class="m" x="384" y="112">'false'  (non-empty text)</text>
    <text class="m" x="24" y="144">0, 0.0, 0G, (char) 0</text>
    <text class="m" x="384" y="144">-1, 0.1, '0'</text>
    <text class="m" x="24" y="176">'' (empty String or GString)</text>
    <text class="m" x="384" y="176">' ' (blank but not empty)</text>
    <text class="m" x="24" y="208">[] / [:] / new int[0]</text>
    <text class="m" x="384" y="208">[0] / [a: null] / new int[]{0}</text>
    <text class="m" x="24" y="240">Matcher with no match</text>
    <text class="m" x="384" y="240">Matcher with a match</text>
    <text class="m" x="24" y="272">exhausted Iterator / Enumeration</text>
    <text class="m" x="384" y="272">Iterator with another element</text>
    <text class="m" x="24" y="304">Optional.empty()</text>
    <text class="m" x="384" y="304">Optional.of(0)</text>
    <text x="24" y="338">asBoolean() on your own class overrides this</text>
    <text x="384" y="338">Only the contents differ, not the type</text>
  </g>
</svg>
