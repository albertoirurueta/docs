<svg viewBox="0 0 620 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="520" fill="#ffffff"/>
  <text x="310" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where should a sensitive token live?</text>
  <text x="310" y="44" font-size="11" fill="#666666" text-anchor="middle">A ladder from least appropriate (bottom) to most appropriate (top) for storing an access/refresh token</text>

  <defs>
    <marker id="ladder-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- vertical "better" arrow on the left -->
  <line x1="40" y1="470" x2="40" y2="75" stroke="#333333" stroke-width="1.4" marker-end="url(#ladder-arrow)"/>
  <text x="24" y="272" font-size="10.5" font-weight="bold" fill="#333333" text-anchor="middle" transform="rotate(-90,24,272)">more appropriate</text>

  <!-- Rung 5 (top, best): expo-secure-store / react-native-keychain -->
  <rect x="70" y="80" width="500" height="66" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="90" y="106" font-size="13" font-weight="bold" fill="#1c4b73">expo-secure-store / react-native-keychain</text>
  <text x="90" y="126" font-size="10.5" fill="#1c4b73">Backed by iOS Keychain Services / Android Keystore -- encrypted at rest by the OS</text>

  <!-- Rung 4: MMKV with an encryption key -->
  <rect x="70" y="158" width="500" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="90" y="182" font-size="13" font-weight="bold" fill="#2d6a34">MMKV with an encryption key</text>
  <text x="90" y="200" font-size="10.5" fill="#2d6a34">Encrypted on disk, but the key's own storage/handling still matters</text>

  <!-- Rung 3: Zustand/Redux persist (MMKV, unencrypted by default) -->
  <rect x="70" y="230" width="500" height="60" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="90" y="254" font-size="13" font-weight="bold" fill="#8a5a1c">Zustand / Redux persist (MMKV, unencrypted by default)</text>
  <text x="90" y="272" font-size="10.5" fill="#8a5a1c">A persisted global slice is easy to leak a token into by accident</text>

  <!-- Rung 2: AsyncStorage (unencrypted) -->
  <rect x="70" y="302" width="500" height="60" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="90" y="326" font-size="13" font-weight="bold" fill="#8a5a1c">AsyncStorage (unencrypted)</text>
  <text x="90" y="344" font-size="10.5" fill="#8a5a1c">Plain files/SQLite -- readable via device backup or on a rooted device</text>

  <!-- Rung 1 (bottom, worst): Hardcoded in JS bundle -->
  <rect x="70" y="374" width="500" height="66" rx="8" fill="#faeaea" stroke="#a33333" stroke-width="1.4"/>
  <text x="90" y="400" font-size="13" font-weight="bold" fill="#a33333">Hardcoded in the JS bundle</text>
  <text x="90" y="420" font-size="10.5" fill="#a33333">Ships inside the app binary -- extractable from the .ipa/.apk by anyone</text>

  <text x="310" y="470" font-size="10.5" fill="#555555" text-anchor="middle">Places's secureTokenStore.ts uses only the top rung -- every rung below it is a token leak path this section</text>
  <text x="310" y="486" font-size="10.5" fill="#555555" text-anchor="middle">explicitly avoids, whether or not a real value ever ends up there in practice.</text>
</svg>
