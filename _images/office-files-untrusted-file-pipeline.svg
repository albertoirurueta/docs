<svg viewBox="0 0 1000 470" width="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="up-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Untrusted Office file pipeline: every stage can reject, nothing runs the document</text>
<rect x="20" y="52" width="170" height="252" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.6"/>
<text x="105.0" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">1. Upload</text>
<text x="105.0" y="96" text-anchor="middle" font-size="11" fill="#444">untrusted bytes</text>
<text x="32" y="126" font-size="12" fill="#2d2d2d">Temp file, not web root</text>
<text x="32" y="160" font-size="12" fill="#2d2d2d">Hard size limit</text>
<text x="32" y="194" font-size="12" fill="#2d2d2d">Proxy and multipart caps</text>
<text x="32" y="228" font-size="12" fill="#2d2d2d">Server-chosen file name</text>
<text x="32" y="262" font-size="12" fill="#2d2d2d">Ignore the MIME header</text>
<line x1="192" y1="178" x2="218" y2="178" stroke="#555" stroke-width="2" marker-end="url(#up-arrow)"/>
<line x1="105.0" y1="304" x2="105.0" y2="352" stroke="#b02a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#up-arrow)"/>
<rect x="220" y="52" width="170" height="252" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
<text x="305.0" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">2. Validate</text>
<text x="305.0" y="96" text-anchor="middle" font-size="11" fill="#444">no POI parsing yet</text>
<text x="232" y="126" font-size="12" fill="#2d2d2d">Extension allow-list</text>
<text x="232" y="160" font-size="12" fill="#2d2d2d">FileMagic vs extension</text>
<text x="232" y="194" font-size="12" fill="#2d2d2d">Zip entries and names</text>
<text x="232" y="228" font-size="12" fill="#2d2d2d">No vbaProject.bin</text>
<text x="232" y="262" font-size="12" fill="#2d2d2d">No macroEnabled type</text>
<line x1="392" y1="178" x2="418" y2="178" stroke="#555" stroke-width="2" marker-end="url(#up-arrow)"/>
<line x1="305.0" y1="304" x2="305.0" y2="352" stroke="#b02a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#up-arrow)"/>
<rect x="420" y="52" width="170" height="252" rx="8" fill="#fde8e8" stroke="#b02a2a" stroke-width="1.6"/>
<text x="505.0" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">3. Sandboxed parse</text>
<text x="505.0" y="96" text-anchor="middle" font-size="11" fill="#444">limits + timeout</text>
<text x="432" y="126" font-size="12" fill="#2d2d2d">ZipSecureFile limits</text>
<text x="432" y="160" font-size="12" fill="#2d2d2d">IOUtils record caps</text>
<text x="432" y="194" font-size="12" fill="#2d2d2d">Read-only open</text>
<text x="432" y="228" font-size="12" fill="#2d2d2d">Timeout, child JVM</text>
<text x="432" y="262" font-size="12" fill="#2d2d2d">Catch Throwable</text>
<line x1="592" y1="178" x2="618" y2="178" stroke="#555" stroke-width="2" marker-end="url(#up-arrow)"/>
<line x1="505.0" y1="304" x2="505.0" y2="352" stroke="#b02a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#up-arrow)"/>
<rect x="620" y="52" width="170" height="252" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.6"/>
<text x="705.0" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">4. Map</text>
<text x="705.0" y="96" text-anchor="middle" font-size="11" fill="#444">validate the content</text>
<text x="632" y="126" font-size="12" fill="#2d2d2d">Header and types</text>
<text x="632" y="160" font-size="12" fill="#2d2d2d">Per-row validation</text>
<text x="632" y="194" font-size="12" fill="#2d2d2d">Length and range caps</text>
<text x="632" y="228" font-size="12" fill="#2d2d2d">Cached formula values</text>
<text x="632" y="262" font-size="12" fill="#2d2d2d">Never evaluate cells</text>
<line x1="792" y1="178" x2="818" y2="178" stroke="#555" stroke-width="2" marker-end="url(#up-arrow)"/>
<line x1="705.0" y1="304" x2="705.0" y2="352" stroke="#b02a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#up-arrow)"/>
<rect x="820" y="52" width="170" height="252" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
<text x="905.0" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">5. Persist</text>
<text x="905.0" y="96" text-anchor="middle" font-size="11" fill="#444">only clean data</text>
<text x="832" y="126" font-size="12" fill="#2d2d2d">Parameterized SQL</text>
<text x="832" y="160" font-size="12" fill="#2d2d2d">Own domain objects</text>
<text x="832" y="194" font-size="12" fill="#2d2d2d">Audit log entry</text>
<text x="832" y="228" font-size="12" fill="#2d2d2d">Delete the temp file</text>
<text x="832" y="262" font-size="12" fill="#2d2d2d">Report row errors</text>
<line x1="905.0" y1="304" x2="905.0" y2="352" stroke="#b02a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#up-arrow)"/>
<rect x="20" y="354" width="960" height="62" rx="8" fill="#fde8e8" stroke="#b02a2a" stroke-width="1.6"/>
<text x="500.0" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Reject: delete the temp file, log the real cause, answer 400 or 422 with a generic message</text>
<text x="500.0" y="400" text-anchor="middle" font-size="12" fill="#444">Never echo exception text, parser output or the client file name back to the caller</text>
<text x="500.0" y="445" text-anchor="middle" font-size="12" fill="#444">Stages 1-2 are cheap and run in the request thread. Stage 3 is the only one that builds a Workbook or a document, so it is the one to isolate.</text>
</svg>