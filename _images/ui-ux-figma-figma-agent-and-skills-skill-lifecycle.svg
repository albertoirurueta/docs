<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Life of a skill: write, add, invoke, share</text>
<g fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5">
<rect x="15" y="60" width="160" height="170" rx="10"/><rect x="200" y="60" width="160" height="170" rx="10"/><rect x="385" y="60" width="160" height="170" rx="10"/><rect x="570" y="60" width="160" height="170" rx="10"/></g>
<g fill="#4F46E5"><circle cx="30" cy="75" r="11"/><circle cx="215" cy="75" r="11"/><circle cx="400" cy="75" r="11"/><circle cx="585" cy="75" r="11"/></g>
<g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="30" y="79">1</text><text x="215" y="79">2</text><text x="400" y="79">3</text><text x="585" y="79">4</text></g>
<g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="95" y="108">Write</text><text x="280" y="108">Add</text><text x="465" y="108">Invoke</text><text x="650" y="108">Share</text></g>
<g stroke="#E5E7EB" stroke-width="1"><line x1="30" y1="118" x2="160" y2="118"/><line x1="215" y1="118" x2="345" y2="118"/><line x1="400" y1="118" x2="530" y2="118"/><line x1="585" y1="118" x2="715" y2="118"/></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="95" y="140">One Markdown file</text><text x="95" y="158">name, description,</text><text x="95" y="176">instructions</text><text x="95" y="200">or ask the agent</text><text x="95" y="216">to draft it</text>
<text x="280" y="140">Prompt box:</text><text x="280" y="158">Skills, Add skill</text><text x="280" y="182">Upload a file or</text><text x="280" y="200">start from scratch</text>
<text x="465" y="140">Type / and the</text><text x="465" y="158">skill name</text><text x="465" y="182">Invoke by hand so</text><text x="465" y="200">the agent uses it</text><text x="465" y="216">at that step</text>
<text x="650" y="140">Manage skills:</text><text x="650" y="158">publish to a team,</text><text x="650" y="176">an organization or</text><text x="650" y="194">the Community</text><text x="650" y="218">Export as Markdown</text></g>
<g stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"><line x1="175" y1="145" x2="198" y2="145"/><line x1="360" y1="145" x2="383" y2="145"/><line x1="545" y1="145" x2="568" y2="145"/></g>
<text x="380" y="262" font-size="12" fill="#374151" text-anchor="middle">Bookshelf example: a "book-card-review" skill that checks every new book card against team rules.</text>
</svg>
