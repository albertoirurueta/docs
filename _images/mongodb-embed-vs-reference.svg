<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One author, many posts &#8212; two ways to model it</text>

  <line x1="380" y1="44" x2="380" y2="346" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: embedded -->
  <text x="200" y="62" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Embedded &#8212; one document</text>

  <rect x="40" y="76" width="312" height="212" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="96" font-size="11" fill="#666666">authors</text>
  <g font-family="'Courier New', monospace" font-size="12" fill="#222222">
    <text x="56" y="118">{ _id: 1,</text>
    <text x="56" y="138">&#160;&#160;name: "Ada",</text>
    <text x="56" y="158">&#160;&#160;posts: [</text>
    <text x="56" y="178">&#160;&#160;&#160;&#160;{ title: "Engines", body: ... },</text>
    <text x="56" y="198">&#160;&#160;&#160;&#160;{ title: "Notes",&#160;&#160;&#160;body: ... },</text>
    <text x="56" y="218">&#160;&#160;&#160;&#160;{ title: "Looms",&#160;&#160;&#160;body: ... }</text>
    <text x="56" y="238">&#160;&#160;]</text>
    <text x="56" y="258">}</text>
  </g>
  <text x="56" y="280" font-size="10.5" fill="#666666">One read returns the author and every post.</text>

  <!-- RIGHT: referenced -->
  <text x="560" y="62" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Referenced &#8212; separate documents</text>

  <rect x="452" y="76" width="268" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="468" y="94" font-size="11" fill="#666666">authors</text>
  <text x="468" y="113" font-family="'Courier New', monospace" font-size="12" fill="#222222">{ _id: 1, name: "Ada" }</text>

  <rect x="452" y="140" width="268" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="468" y="157" font-size="11" fill="#666666">posts</text>
  <text x="468" y="175" font-family="'Courier New', monospace" font-size="12" fill="#222222">{ _id: 11, authorId: 1, ... }</text>

  <rect x="452" y="200" width="268" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="468" y="217" font-size="11" fill="#666666">posts</text>
  <text x="468" y="235" font-family="'Courier New', monospace" font-size="12" fill="#222222">{ _id: 12, authorId: 1, ... }</text>

  <rect x="452" y="260" width="268" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="468" y="277" font-size="11" fill="#666666">posts</text>
  <text x="468" y="295" font-family="'Courier New', monospace" font-size="12" fill="#222222">{ _id: 13, authorId: 1, ... }</text>

  <!-- connectors: authorId -> _id -->
  <g stroke="#999999" stroke-width="1.4" fill="none">
    <path d="M452,162 H436 V99 H450"/>
    <path d="M452,222 H436 V99"/>
    <path d="M452,282 H436 V99"/>
  </g>
  <polygon points="450,95 450,103 458,99" fill="#999999"/>
  <text x="404" y="322" font-size="10.5" fill="#666666" text-anchor="middle">authorId &#8594; _id</text>

  <!-- decision strip -->
  <rect x="40" y="360" width="680" height="92" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="56" y="384" font-size="12.5" font-weight="bold" fill="#222222">Choosing between them</text>
  <text x="56" y="408" font-size="12" fill="#222222">Queried on its own?&#160;&#160;&#8226;&#160;&#160;Unbounded array?&#160;&#160;&#8226;&#160;&#160;Written independently?</text>
  <text x="56" y="434" font-size="12.5" font-weight="bold" fill="#1c4b73">Any &#8220;yes&#8221; &#8594; reference.</text>
  <text x="270" y="434" font-size="12.5" font-weight="bold" fill="#2f5424">Otherwise &#8594; embed.</text>
</svg>
