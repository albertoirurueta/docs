<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Choosing a synchronization primitive</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">start with the question on the left; the first box that fits is usually the simplest correct answer</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="13" fill="#222222">
    <!-- questions -->
    <rect x="30" y="70" width="330" height="54" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="195" y="93" text-anchor="middle">Do goroutines hand data or ownership</text>
    <text x="195" y="111" text-anchor="middle">to each other (a pipeline, a result)?</text>
    <rect x="30" y="150" width="330" height="54" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="195" y="173" text-anchor="middle">Do you only wait for N goroutines</text>
    <text x="195" y="191" text-anchor="middle">to finish, or run an init step once?</text>
    <rect x="30" y="230" width="330" height="54" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="195" y="253" text-anchor="middle">Is it one counter, flag or pointer</text>
    <text x="195" y="271" text-anchor="middle">that is read and written by many?</text>
    <rect x="30" y="310" width="330" height="54" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="195" y="333" text-anchor="middle">Is it shared state with an invariant</text>
    <text x="195" y="351" text-anchor="middle">(a map, a struct, several fields)?</text>
    <rect x="30" y="390" width="330" height="54" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="195" y="413" text-anchor="middle">Must a goroutine sleep until a</text>
    <text x="195" y="431" text-anchor="middle">condition on that state becomes true?</text>
    <!-- answers -->
    <rect x="560" y="70" width="350" height="54" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="735" y="93" text-anchor="middle" font-weight="bold">channel (and select)</text>
    <text x="735" y="111" text-anchor="middle" font-size="12">see Channels and Select</text>
    <rect x="560" y="150" width="350" height="54" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="735" y="173" text-anchor="middle" font-weight="bold">sync.WaitGroup (Go) / sync.Once, OnceFunc,</text>
    <text x="735" y="191" text-anchor="middle" font-weight="bold">OnceValue(s)</text>
    <rect x="560" y="230" width="350" height="54" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="735" y="253" text-anchor="middle" font-weight="bold">sync/atomic typed value</text>
    <text x="735" y="271" text-anchor="middle" font-size="12">atomic.Int64, Bool, Pointer[T]</text>
    <rect x="560" y="310" width="350" height="54" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="735" y="333" text-anchor="middle" font-weight="bold">sync.Mutex (RWMutex if reads dominate)</text>
    <text x="735" y="351" text-anchor="middle" font-size="12">keep it private, defer Unlock, never copy</text>
    <rect x="560" y="390" width="350" height="54" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="735" y="413" text-anchor="middle" font-weight="bold">sync.Cond on that Mutex</text>
    <text x="735" y="431" text-anchor="middle" font-size="12">or a channel that is closed when ready</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)">
    <line x1="360" y1="97" x2="556" y2="97"/>
    <line x1="360" y1="177" x2="556" y2="177"/>
    <line x1="360" y1="257" x2="556" y2="257"/>
    <line x1="360" y1="337" x2="556" y2="337"/>
    <line x1="360" y1="417" x2="556" y2="417"/>
  </g>
  <g font-size="12" fill="#1c4b73" text-anchor="middle">
    <text x="458" y="91">yes</text><text x="458" y="171">yes</text><text x="458" y="251">yes</text><text x="458" y="331">yes</text><text x="458" y="411">yes</text>
  </g>
</svg>
