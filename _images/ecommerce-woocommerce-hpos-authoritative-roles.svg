<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Authoritative and backup tables in the three common set-ups</title>
  <desc id="d">Three columns. Legacy storage: order code writes to wp_posts and wp_postmeta, the HPOS tables are unused. Transition with compatibility mode on: order code writes to the authoritative store and every write is copied immediately to the backup store; the roles can be either way round. HPOS with compatibility mode off: order code writes only to the four HPOS tables; wp_posts holds placeholder rows and nothing else, and a manual wp wc hpos sync or backfill is the only way to refresh the posts copy.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">Which store is the truth: authoritative and backup roles</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Setting "Order data storage" chooses the authoritative store; "compatibility mode" decides whether the other one is kept up to date</text>
  <rect x="40" y="76" width="280" height="420" rx="10" fill="#34495e"/>
  <text x="54" y="100" font-size="14" font-weight="bold" text-anchor="start" fill="#f2f5f8">1. Legacy storage</text>
  <text x="54" y="119" font-size="11.5" text-anchor="start" fill="#f2f5f8">Default before 8.2, option set to "no"</text>
  <rect x="60" y="136" width="240" height="56" rx="8" fill="#3d5266"/>
  <text x="74" y="158" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Order code</text>
  <text x="74" y="180" font-size="11" text-anchor="start" fill="#f2f5f8">wc_get_order(), save(), wc_get_orders()</text>
  <path d="M180,192 L180,226" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="228" width="240" height="92" rx="8" fill="#4d7c5a"/>
  <text x="74" y="250" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Authoritative: posts</text>
  <text x="74" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_posts + wp_postmeta</text>
  <text x="74" y="291" font-size="11.5" text-anchor="start" fill="#f2f5f8">shop_order rows</text>
  <rect x="60" y="358" width="240" height="70" rx="8" fill="#4a4a4a"/>
  <text x="74" y="380" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">HPOS tables</text>
  <text x="74" y="402" font-size="11.5" text-anchor="start" fill="#f2f5f8">unused or stale</text>
  <text x="54" y="452" font-size="11.5" text-anchor="start" fill="#f2f5f8">A store that never enabled HPOS.</text>
  <text x="54" y="470" font-size="11.5" text-anchor="start" fill="#f2f5f8">Plugins may still read postmeta.</text>
  <rect x="340" y="76" width="280" height="420" rx="10" fill="#34495e"/>
  <text x="354" y="100" font-size="14" font-weight="bold" text-anchor="start" fill="#f2f5f8">2. Transition</text>
  <text x="354" y="119" font-size="11.5" text-anchor="start" fill="#f2f5f8">Compatibility mode ON</text>
  <rect x="360" y="136" width="240" height="56" rx="8" fill="#3d5266"/>
  <text x="374" y="158" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Order code</text>
  <text x="374" y="180" font-size="11" text-anchor="start" fill="#f2f5f8">wc_get_order(), save(), wc_get_orders()</text>
  <path d="M480,192 L480,226" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="360" y="228" width="240" height="92" rx="8" fill="#4d7c5a"/>
  <text x="374" y="250" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Authoritative: either one</text>
  <text x="374" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">posts or the HPOS tables,</text>
  <text x="374" y="291" font-size="11.5" text-anchor="start" fill="#f2f5f8">chosen in the settings</text>
  <path d="M480,320 L480,356" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
  <text x="490" y="344" font-size="11" text-anchor="start" fill="#9fd3c7">copied on write</text>
  <rect x="360" y="358" width="240" height="70" rx="8" fill="#3f6e9a"/>
  <text x="374" y="380" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Backup: the other one</text>
  <text x="374" y="402" font-size="11.5" text-anchor="start" fill="#f2f5f8">kept in step on every write</text>
  <text x="354" y="452" font-size="11.5" text-anchor="start" fill="#f2f5f8">Roles can only be switched when no</text>
  <text x="354" y="470" font-size="11.5" text-anchor="start" fill="#f2f5f8">order is waiting for synchronisation.</text>
  <rect x="640" y="76" width="280" height="420" rx="10" fill="#34495e"/>
  <text x="654" y="100" font-size="14" font-weight="bold" text-anchor="start" fill="#f2f5f8">3. HPOS only</text>
  <text x="654" y="119" font-size="11.5" text-anchor="start" fill="#f2f5f8">Default of new stores since 8.2</text>
  <rect x="660" y="136" width="240" height="56" rx="8" fill="#3d5266"/>
  <text x="674" y="158" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Order code</text>
  <text x="674" y="180" font-size="11" text-anchor="start" fill="#f2f5f8">wc_get_order(), save(), wc_get_orders()</text>
  <path d="M780,192 L780,226" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="660" y="228" width="240" height="92" rx="8" fill="#4d7c5a"/>
  <text x="674" y="250" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Authoritative: HPOS</text>
  <text x="674" y="272" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_orders + 3 sibling tables</text>
  <path d="M780,320 L780,356" fill="none" stroke="#9fd3c7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="790" y="344" font-size="11" text-anchor="start" fill="#9fd3c7">no copy</text>
  <rect x="660" y="358" width="240" height="70" rx="8" fill="#7a3b3b"/>
  <text x="674" y="380" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wp_posts</text>
  <text x="674" y="402" font-size="11.5" text-anchor="start" fill="#f2f5f8">placeholders only</text>
  <text x="674" y="421" font-size="11.5" text-anchor="start" fill="#f2f5f8">(plus stale old copies)</text>
  <text x="654" y="452" font-size="11.5" text-anchor="start" fill="#f2f5f8">Fastest; a copy in posts exists</text>
  <text x="654" y="470" font-size="11.5" text-anchor="start" fill="#f2f5f8">only after sync or backfill.</text>
</svg>
