<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a PHP web request is served</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">left: classic PHP-FPM, a fresh application per request; right: worker mode, the application booted once per worker</text>

  <!-- left panel -->
  <rect x="15" y="60" width="430" height="465" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Nginx + PHP-FPM (shared-nothing)</text>

  <rect x="35" y="98" width="120" height="44" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="95" y="125" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>

  <rect x="200" y="98" width="225" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="312" y="117" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Nginx</text>
  <text x="312" y="134" font-size="10" fill="#444444" text-anchor="middle">TLS, static files, try_files → index.php</text>
  <line x1="155" y1="120" x2="198" y2="120" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="177" y="113" font-size="9" fill="#666666" text-anchor="middle">HTTP</text>

  <line x1="312" y1="142" x2="312" y2="172" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="322" y="161" font-size="9" fill="#666666">FastCGI: TCP :9000 or socket</text>

  <rect x="35" y="174" width="390" height="230" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="230" y="194" font-size="13" font-weight="bold" fill="#a05a00" text-anchor="middle">PHP-FPM master and pool "www"</text>
  <text x="230" y="210" font-size="10" fill="#444444" text-anchor="middle">pm = dynamic | static | ondemand · pm.max_children · pm.max_requests</text>

  <g font-size="10" fill="#333333">
    <rect x="50" y="222" width="110" height="168" fill="#ffffff" stroke="#a05a00" stroke-width="1.2"/>
    <text x="105" y="240" font-size="11" font-weight="bold" fill="#a05a00" text-anchor="middle">worker 1</text>
    <text x="105" y="262" text-anchor="middle">1. start request</text>
    <text x="105" y="280" text-anchor="middle">2. run index.php:</text>
    <text x="105" y="294" text-anchor="middle">boot the app,</text>
    <text x="105" y="308" text-anchor="middle">route, controller,</text>
    <text x="105" y="322" text-anchor="middle">query, render</text>
    <text x="105" y="344" text-anchor="middle">3. send response</text>
    <text x="105" y="366" text-anchor="middle" fill="#9b1c1c">4. free everything</text>
    <text x="105" y="380" text-anchor="middle" fill="#9b1c1c">(next request: from 1)</text>

    <rect x="175" y="222" width="110" height="168" fill="#ffffff" stroke="#a05a00" stroke-width="1.2"/>
    <text x="230" y="240" font-size="11" font-weight="bold" fill="#a05a00" text-anchor="middle">worker 2</text>
    <text x="230" y="270" text-anchor="middle">one request</text>
    <text x="230" y="284" text-anchor="middle">at a time per</text>
    <text x="230" y="298" text-anchor="middle">process</text>

    <rect x="300" y="222" width="110" height="168" fill="#ffffff" stroke="#a05a00" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="355" y="240" font-size="11" font-weight="bold" fill="#a05a00" text-anchor="middle">worker n</text>
    <text x="355" y="270" text-anchor="middle">spawned when</text>
    <text x="355" y="284" text-anchor="middle">busy, up to</text>
    <text x="355" y="298" text-anchor="middle">max_children</text>
  </g>

  <rect x="35" y="420" width="190" height="90" fill="#efe9f7" stroke="#5b3a8a" stroke-width="1.6"/>
  <text x="130" y="440" font-size="12" font-weight="bold" fill="#5b3a8a" text-anchor="middle">OPcache</text>
  <text x="130" y="458" font-size="10" fill="#333333" text-anchor="middle">shared memory of the master:</text>
  <text x="130" y="472" font-size="10" fill="#333333" text-anchor="middle">compiled opcodes reused by</text>
  <text x="130" y="486" font-size="10" fill="#333333" text-anchor="middle">every worker; the app state</text>
  <text x="130" y="500" font-size="10" fill="#333333" text-anchor="middle">is still rebuilt each request</text>
  <line x1="130" y1="420" x2="130" y2="392" stroke="#5b3a8a" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="245" y="420" width="180" height="90" fill="#e9f5ec" stroke="#1d6b34" stroke-width="1.6"/>
  <text x="335" y="440" font-size="12" font-weight="bold" fill="#1d6b34" text-anchor="middle">Database, Redis</text>
  <text x="335" y="458" font-size="10" fill="#333333" text-anchor="middle">connected per request</text>
  <text x="335" y="472" font-size="10" fill="#333333" text-anchor="middle">(or per worker with</text>
  <text x="335" y="486" font-size="10" fill="#333333" text-anchor="middle">persistent connections)</text>
  <line x1="335" y1="420" x2="335" y2="392" stroke="#1d6b34" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- right panel -->
  <rect x="455" y="60" width="430" height="465" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="670" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Worker mode (FrankenPHP, Octane)</text>

  <rect x="475" y="98" width="120" height="44" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="535" y="125" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>

  <rect x="640" y="98" width="225" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="752" y="117" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">FrankenPHP (Caddy)</text>
  <text x="752" y="134" font-size="10" fill="#444444" text-anchor="middle">TLS, HTTP/2 and 3, PHP embedded</text>
  <line x1="595" y1="120" x2="638" y2="120" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="617" y="113" font-size="9" fill="#666666" text-anchor="middle">HTTP</text>
  <line x1="752" y1="142" x2="752" y2="172" stroke="#444444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="762" y="161" font-size="9" fill="#666666">in-process, no FastCGI</text>

  <rect x="475" y="174" width="390" height="230" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="670" y="194" font-size="13" font-weight="bold" fill="#a05a00" text-anchor="middle">Worker threads</text>
  <text x="670" y="210" font-size="10" fill="#444444" text-anchor="middle">each boots the application once, then loops</text>

  <g font-size="10" fill="#333333">
    <rect x="490" y="222" width="175" height="168" fill="#ffffff" stroke="#a05a00" stroke-width="1.2"/>
    <text x="577" y="240" font-size="11" font-weight="bold" fill="#a05a00" text-anchor="middle">worker 1</text>
    <text x="577" y="262" text-anchor="middle">boot the app once:</text>
    <text x="577" y="276" text-anchor="middle">config, container, routes</text>
    <text x="577" y="300" text-anchor="middle">loop:</text>
    <text x="577" y="314" text-anchor="middle">frankenphp_handle_request()</text>
    <text x="577" y="328" text-anchor="middle">→ route, controller, render</text>
    <text x="577" y="342" text-anchor="middle">→ send response</text>
    <text x="577" y="356" text-anchor="middle">→ reset request state</text>
    <text x="577" y="378" text-anchor="middle" fill="#9b1c1c">restart after max requests</text>

    <rect x="680" y="222" width="170" height="168" fill="#fbeaea" stroke="#9b1c1c" stroke-width="1.2"/>
    <text x="765" y="240" font-size="11" font-weight="bold" fill="#9b1c1c" text-anchor="middle">pitfalls</text>
    <text x="765" y="262" text-anchor="middle">statics and singletons</text>
    <text x="765" y="276" text-anchor="middle">survive between requests</text>
    <text x="765" y="298" text-anchor="middle">data of one user can</text>
    <text x="765" y="312" text-anchor="middle">leak into the next</text>
    <text x="765" y="334" text-anchor="middle">memory leaks accumulate</text>
    <text x="765" y="356" text-anchor="middle">a fatal error kills</text>
    <text x="765" y="370" text-anchor="middle">the worker, not one request</text>
  </g>

  <rect x="475" y="420" width="190" height="90" fill="#efe9f7" stroke="#5b3a8a" stroke-width="1.6"/>
  <text x="570" y="440" font-size="12" font-weight="bold" fill="#5b3a8a" text-anchor="middle">OPcache</text>
  <text x="570" y="458" font-size="10" fill="#333333" text-anchor="middle">still used, but bootstrapping</text>
  <text x="570" y="472" font-size="10" fill="#333333" text-anchor="middle">is no longer repeated:</text>
  <text x="570" y="486" font-size="10" fill="#333333" text-anchor="middle">the main speed-up of</text>
  <text x="570" y="500" font-size="10" fill="#333333" text-anchor="middle">worker mode</text>

  <rect x="685" y="420" width="180" height="90" fill="#e9f5ec" stroke="#1d6b34" stroke-width="1.6"/>
  <text x="775" y="440" font-size="12" font-weight="bold" fill="#1d6b34" text-anchor="middle">Database, Redis</text>
  <text x="775" y="458" font-size="10" fill="#333333" text-anchor="middle">connections kept open</text>
  <text x="775" y="472" font-size="10" fill="#333333" text-anchor="middle">by the worker and reused</text>
  <text x="775" y="486" font-size="10" fill="#333333" text-anchor="middle">(must be health-checked)</text>
</svg>
