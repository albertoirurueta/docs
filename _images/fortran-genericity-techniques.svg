<svg viewBox="0 0 1010 508" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Techniques for writing Fortran code that is generic over kind, rank and type, and what each one covers</title>
  <rect x="0" y="0" width="1010" height="508" fill="#ffffff"/>
  <text x="505" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Genericity in Fortran: what varies, and what one source text covers</text>
  <text x="505" y="46" font-size="12" fill="#666666" text-anchor="middle">rows are techniques, columns are what varies between uses; the red rows could not be compiled with gfortran 16.2 or Flang 23</text>
  <text x="28" y="82" font-size="13" font-weight="bold" fill="#222222">Technique</text>
  <text x="278" y="82" font-size="13" font-weight="bold" fill="#222222">Since</text>
  <text x="488" y="82" font-size="13" font-weight="bold" fill="#222222">Varying kind</text>
  <text x="668" y="82" font-size="13" font-weight="bold" fill="#222222">Varying rank</text>
  <text x="858" y="82" font-size="13" font-weight="bold" fill="#222222">Varying type</text>
  <line x1="20" y1="90" x2="1030" y2="90" stroke="#222222"/>
  <rect x="20" y="96" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="121" font-size="12.5" font-family="Courier New, monospace" fill="#222222">generic interface</text>
  <text x="278" y="121" font-size="12" fill="#444444">Fortran 90</text>
  <rect x="480" y="96" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="486" y="121" font-size="11.5" fill="#a56a00">one specific per kind</text>
  <rect x="660" y="96" width="186" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="666" y="121" font-size="11.5" fill="#a56a00">one specific per rank</text>
  <rect x="850" y="96" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="856" y="121" font-size="11.5" fill="#a56a00">one specific per type</text>
  <rect x="20" y="140" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="165" font-size="12.5" font-family="Courier New, monospace" fill="#222222">elemental procedure</text>
  <text x="278" y="165" font-size="12" fill="#444444">Fortran 95</text>
  <rect x="480" y="140" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="486" y="165" font-size="11.5" fill="#a56a00">one specific per kind</text>
  <rect x="660" y="140" width="186" height="38" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="666" y="165" font-size="11.5" fill="#1c4b73">every rank, one body</text>
  <rect x="850" y="140" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="856" y="165" font-size="11.5" fill="#a56a00">one specific per type</text>
  <rect x="20" y="184" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="209" font-size="12.5" font-family="Courier New, monospace" fill="#222222">assumed-rank + select rank</text>
  <text x="278" y="209" font-size="12" fill="#444444">Fortran 2018</text>
  <rect x="480" y="184" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="486" y="209" font-size="11.5" fill="#a56a00">one specific per kind</text>
  <rect x="660" y="184" width="186" height="38" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="666" y="209" font-size="11.5" fill="#1c4b73">every rank, one case per rank</text>
  <rect x="850" y="184" width="176" height="38" fill="#eeeeee" stroke="#666666"/>
  <text x="856" y="209" font-size="11.5" fill="#666666">not applicable</text>
  <rect x="20" y="228" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="253" font-size="12.5" font-family="Courier New, monospace" fill="#222222">class(*) + select type</text>
  <text x="278" y="253" font-size="12" fill="#444444">Fortran 2003</text>
  <rect x="480" y="228" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="486" y="253" font-size="11.5" fill="#a56a00">run time, every listed kind</text>
  <rect x="660" y="228" width="186" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="666" y="253" font-size="11.5" fill="#a56a00">scalar, or assumed-rank</text>
  <rect x="850" y="228" width="176" height="38" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="856" y="253" font-size="11.5" fill="#a56a00">run time, every listed type</text>
  <rect x="20" y="272" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="297" font-size="12.5" font-family="Courier New, monospace" fill="#222222">include file or cpp template</text>
  <text x="278" y="297" font-size="12" fill="#444444">text, any standard</text>
  <rect x="480" y="272" width="176" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="486" y="297" font-size="11.5" fill="#2e7d32">one text, compiled per kind</text>
  <rect x="660" y="272" width="186" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="666" y="297" font-size="11.5" fill="#2e7d32">one text, compiled per rank</text>
  <rect x="850" y="272" width="176" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="856" y="297" font-size="11.5" fill="#2e7d32">one text, compiled per type</text>
  <rect x="20" y="316" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="341" font-size="12.5" font-family="Courier New, monospace" fill="#222222">typeof / classof, rank clause</text>
  <text x="278" y="341" font-size="12" fill="#444444">Fortran 2023; Flang 23 only</text>
  <rect x="480" y="316" width="176" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="486" y="341" font-size="11.5" fill="#2e7d32">follows a named entity</text>
  <rect x="660" y="316" width="186" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="666" y="341" font-size="11.5" fill="#2e7d32">constant expression</text>
  <rect x="850" y="316" width="176" height="38" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="856" y="341" font-size="11.5" fill="#2e7d32">follows a named entity</text>
  <rect x="20" y="360" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="385" font-size="12.5" font-family="Courier New, monospace" fill="#222222">@ subscripts, array bounds</text>
  <text x="278" y="385" font-size="12" fill="#444444">Fortran 2023; no compiler yet</text>
  <rect x="480" y="360" width="176" height="38" fill="#eeeeee" stroke="#666666"/>
  <text x="486" y="385" font-size="11.5" fill="#666666">not applicable</text>
  <rect x="660" y="360" width="186" height="38" fill="#f3d9d9" stroke="#a33333"/>
  <text x="666" y="385" font-size="11.5" fill="#a33333">rank-independent indexing</text>
  <rect x="850" y="360" width="176" height="38" fill="#eeeeee" stroke="#666666"/>
  <text x="856" y="385" font-size="11.5" fill="#666666">not applicable</text>
  <rect x="20" y="404" width="246" height="38" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="28" y="429" font-size="12.5" font-family="Courier New, monospace" fill="#222222">templates</text>
  <text x="278" y="429" font-size="12" fill="#444444">Fortran 2028 draft</text>
  <rect x="480" y="404" width="176" height="38" fill="#f3d9d9" stroke="#a33333"/>
  <text x="486" y="429" font-size="11.5" fill="#a33333">one template, instantiated</text>
  <rect x="660" y="404" width="186" height="38" fill="#f3d9d9" stroke="#a33333"/>
  <text x="666" y="429" font-size="11.5" fill="#a33333">one template, instantiated</text>
  <rect x="850" y="404" width="176" height="38" fill="#f3d9d9" stroke="#a33333"/>
  <text x="856" y="429" font-size="11.5" fill="#a33333">one template, instantiated</text>
  <rect x="20" y="462" width="14" height="14" fill="#fdf0d5" stroke="#a56a00"/><text x="40" y="474" font-size="11.5" fill="#222222">one source or branch per case</text>
  <rect x="237.8" y="462" width="14" height="14" fill="#e8f0f8" stroke="#1c4b73"/><text x="257.8" y="474" font-size="11.5" fill="#222222">one body covers it</text>
  <rect x="387.40000000000003" y="462" width="14" height="14" fill="#e9f5e9" stroke="#2e7d32"/><text x="407.40000000000003" y="474" font-size="11.5" fill="#222222">one text, instantiated mechanically</text>
  <rect x="642.4000000000001" y="462" width="14" height="14" fill="#f3d9d9" stroke="#a33333"/><text x="662.4000000000001" y="474" font-size="11.5" fill="#222222">not compilable today</text>
  <rect x="804.4000000000001" y="462" width="14" height="14" fill="#eeeeee" stroke="#666666"/><text x="824.4000000000001" y="474" font-size="11.5" fill="#222222">not applicable</text>
</svg>
