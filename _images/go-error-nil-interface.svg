<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
<text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">An error is an interface value: a (type, value) pair</text>
<text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">err == nil is true only when both halves are empty</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>

<text x="30" y="86" font-size="14" font-weight="bold" fill="#1c4b73">1. return nil</text>
<text x="30" y="106" font-size="12" fill="#555555">the interface value is the zero value</text>
<rect x="30" y="122" width="150" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="105" y="138" font-size="11" fill="#666666" text-anchor="middle">dynamic type</text>
<text x="105" y="154" font-size="13" fill="#222222" text-anchor="middle">nil</text>
<rect x="180" y="122" width="150" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="255" y="138" font-size="11" fill="#666666" text-anchor="middle">value</text>
<text x="255" y="154" font-size="13" fill="#222222" text-anchor="middle">nil</text>
<text x="360" y="148" font-size="14" fill="#222222">err == nil  is  </text>
<text x="465" y="148" font-size="14" font-weight="bold" fill="#2e7d32">true</text>

<text x="30" y="216" font-size="14" font-weight="bold" fill="#b3261e">2. var le *LoanError; return le</text>
<text x="30" y="236" font-size="12" fill="#555555">a nil pointer converted to error keeps its type</text>
<rect x="30" y="252" width="150" height="40" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="105" y="268" font-size="11" fill="#666666" text-anchor="middle">dynamic type</text>
<text x="105" y="284" font-size="13" fill="#222222" text-anchor="middle">*LoanError</text>
<rect x="180" y="252" width="150" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="255" y="268" font-size="11" fill="#666666" text-anchor="middle">value</text>
<text x="255" y="284" font-size="13" fill="#222222" text-anchor="middle">nil pointer</text>
<text x="360" y="278" font-size="14" fill="#222222">err == nil  is  </text>
<text x="465" y="278" font-size="14" font-weight="bold" fill="#b3261e">false</text>

<rect x="560" y="102" width="350" height="250" fill="#f7f7f7" stroke="#bbbbbb"/>
<text x="735" y="128" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Rules of thumb</text>
<text x="580" y="158" font-size="12" fill="#222222">- the function result type is error,</text>
<text x="590" y="176" font-size="12" fill="#222222">never a concrete pointer type</text>
<text x="580" y="204" font-size="12" fill="#222222">- on success write  return nil</text>
<text x="590" y="222" font-size="12" fill="#222222">literally, not a typed variable</text>
<text x="580" y="250" font-size="12" fill="#222222">- calling Error() on case 2 runs the</text>
<text x="590" y="268" font-size="12" fill="#222222">method with a nil receiver: it panics</text>
<text x="590" y="286" font-size="12" fill="#222222">as soon as the body reads a field</text>
<text x="580" y="314" font-size="12" fill="#222222">- fmt %T on the error shows the</text>
<text x="590" y="332" font-size="12" fill="#222222">type half and exposes the bug</text>
<text x="30" y="340" font-size="12" fill="#555555">Interface comparison compares the type half first, then the value half.</text>
<text x="30" y="358" font-size="12" fill="#555555">Case 2 differs from case 1 in the type half, so the interfaces are not equal.</text>
</svg>
