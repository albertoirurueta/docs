<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="22" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Vector matching: one-to-one vs. many-to-one</text>
  <text x="380" y="40" font-size="12" fill="#666666" text-anchor="middle">left: on()/ignoring() pair series with matching labels &#8212; right: group_left() lets one "one" series match several "many" series</text>

  <defs>
    <marker id="vm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="vm-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
    <marker id="vm-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="380" y1="56" x2="380" y2="404" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LEFT: one-to-one -->
  <text x="190" y="72" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">One-to-one &#8212; on(instance)</text>

  <!-- left series A -->
  <rect x="40" y="90" width="140" height="40" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="110" y="107" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">node_memory_used</text>
  <text x="110" y="122" font-size="9.5" fill="#444444" text-anchor="middle">instance="a:9100"</text>

  <rect x="220" y="90" width="140" height="40" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="290" y="107" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">node_memory_total</text>
  <text x="290" y="122" font-size="9.5" fill="#444444" text-anchor="middle">instance="a:9100"</text>

  <line x1="180" y1="110" x2="212" y2="110" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#vm-arrow)"/>
  <text x="196" y="103" font-size="9" fill="#1c4b73" text-anchor="middle">1:1</text>

  <!-- left series B -->
  <rect x="40" y="148" width="140" height="40" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="110" y="165" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">node_memory_used</text>
  <text x="110" y="180" font-size="9.5" fill="#444444" text-anchor="middle">instance="b:9100"</text>

  <rect x="220" y="148" width="140" height="40" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="290" y="165" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">node_memory_total</text>
  <text x="290" y="180" font-size="9.5" fill="#444444" text-anchor="middle">instance="b:9100"</text>

  <line x1="180" y1="168" x2="212" y2="168" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#vm-arrow)"/>
  <text x="196" y="161" font-size="9" fill="#1c4b73" text-anchor="middle">1:1</text>

  <line x1="200" y1="196" x2="200" y2="214" stroke="#2f5424" stroke-width="1.8" marker-end="url(#vm-arrow-green)"/>

  <rect x="65" y="214" width="270" height="40" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="200" y="232" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">result: two series, one per instance</text>
  <text x="200" y="247" font-size="9.5" fill="#444444" text-anchor="middle">used / total, matched only on instance</text>

  <rect x="45" y="270" width="310" height="44" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="200" y="288" font-size="10.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">node_memory_used_bytes</text>
  <text x="200" y="302" font-size="10.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">/ on(instance) node_memory_total_bytes</text>

  <text x="200" y="336" font-size="9.5" fill="#666666" text-anchor="middle">exactly one match required per side</text>
  <text x="200" y="350" font-size="9.5" fill="#666666" text-anchor="middle">or the query errors (many-to-many)</text>

  <!-- RIGHT: many-to-one -->
  <text x="565" y="72" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Many-to-one &#8212; group_left(job)</text>

  <text x="490" y="90" font-size="10.5" font-weight="bold" fill="#666666" text-anchor="start">many</text>

  <rect x="420" y="96" width="140" height="34" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="490" y="117" font-size="10.5" fill="#1c4b73" text-anchor="middle">up{instance="a:9100"}</text>

  <rect x="420" y="136" width="140" height="34" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="490" y="157" font-size="10.5" fill="#1c4b73" text-anchor="middle">up{instance="b:9100"}</text>

  <rect x="420" y="176" width="140" height="34" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="490" y="197" font-size="10.5" fill="#1c4b73" text-anchor="middle">up{instance="c:9100"}</text>

  <text x="700" y="90" font-size="10.5" font-weight="bold" fill="#666666" text-anchor="end">one</text>
  <rect x="620" y="130" width="120" height="46" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="680" y="149" font-size="10.5" font-weight="bold" fill="#2f5424" text-anchor="middle">node_info</text>
  <text x="680" y="163" font-size="9" fill="#444444" text-anchor="middle">job="node", region</text>

  <line x1="560" y1="113" x2="614" y2="145" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#vm-arrow)"/>
  <line x1="560" y1="153" x2="614" y2="153" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#vm-arrow)"/>
  <line x1="560" y1="193" x2="614" y2="161" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#vm-arrow)"/>

  <line x1="490" y1="210" x2="490" y2="226" stroke="#2f5424" stroke-width="1.6"/>
  <line x1="680" y1="176" x2="680" y2="226" stroke="#2f5424" stroke-width="1.6"/>
  <line x1="490" y1="226" x2="680" y2="226" stroke="#2f5424" stroke-width="1.6" marker-end="url(#vm-arrow-green)"/>

  <rect x="415" y="234" width="270" height="40" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="550" y="252" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">result: 3 series (many side kept)</text>
  <text x="550" y="267" font-size="9.5" fill="#444444" text-anchor="middle">each carries region copied from the one side</text>

  <rect x="410" y="290" width="280" height="44" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="550" y="308" font-size="10.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">up * on(job) group_left(region)</text>
  <text x="550" y="322" font-size="10.5" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">node_info</text>

  <text x="550" y="356" font-size="9.5" fill="#666666" text-anchor="middle">group_left/group_right names the side</text>
  <text x="550" y="370" font-size="9.5" fill="#666666" text-anchor="middle">with multiple matches per label set</text>

</svg>
