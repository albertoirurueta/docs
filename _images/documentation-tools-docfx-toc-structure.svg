<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How DocFX table of contents files relate</title>
<desc id="d">The root toc.yml fills the navbar and points to the guides and api folders with reference entries. The guides toc.yml nests guides/reference/toc.yml, which is embedded in its tree. The api toc.yml is generated by metadata.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f9fafb"/></marker>
</defs>
<rect width="760" height="340" rx="12" fill="#1f2937"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#f9fafb">Three kinds of links between toc.yml files</text>
<rect x="260" y="50" width="240" height="56" rx="8" fill="#1e40af"/>
<text x="380" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">toc.yml</text>
<text x="380" y="94" text-anchor="middle" font-size="12" fill="#f9fafb">root TOC: navbar</text>
<rect x="60" y="170" width="240" height="56" rx="8" fill="#374151"/>
<text x="180" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">guides/toc.yml</text>
<text x="180" y="214" text-anchor="middle" font-size="12" fill="#f9fafb">sidebar tree for the guides</text>
<rect x="460" y="170" width="240" height="56" rx="8" fill="#374151"/>
<text x="580" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">api/toc.yml</text>
<text x="580" y="214" text-anchor="middle" font-size="12" fill="#f9fafb">generated by docfx metadata</text>
<rect x="60" y="270" width="240" height="56" rx="8" fill="#166534"/>
<text x="180" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#f9fafb" font-family="Courier New, monospace">guides/reference/toc.yml</text>
<text x="180" y="314" text-anchor="middle" font-size="12" fill="#f9fafb">reusable fragment</text>
<line x1="330" y1="106" x2="200" y2="168" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="430" y1="106" x2="560" y2="168" stroke="#f9fafb" stroke-width="2" marker-end="url(#a)"/>
<line x1="180" y1="228" x2="180" y2="268" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="250" y="140" text-anchor="middle" font-size="12" fill="#f9fafb">href: guides/</text>
<text x="515" y="140" text-anchor="middle" font-size="12" fill="#f9fafb">href: api/</text>
<text x="200" y="252" text-anchor="start" font-size="12" fill="#fbbf24">href: reference/toc.yml</text>
<rect x="400" y="270" width="320" height="56" rx="8" fill="#4b5563"/>
<text x="560" y="292" text-anchor="middle" font-size="12" fill="#f9fafb">Solid arrow: reference TOC, a link to the first article</text>
<text x="560" y="312" text-anchor="middle" font-size="12" fill="#fbbf24">Dashed arrow: nested TOC, its items are embedded</text>
</svg>
