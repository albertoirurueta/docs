<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Java Thread.State lifecycle: NEW to RUNNABLE, which alternates with BLOCKED, WAITING and TIMED_WAITING, then TERMINATED, with the trigger labelled on every transition</title>
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Thread.State lifecycle</text>
  <text x="390" y="47" font-size="11" fill="#666666" text-anchor="middle">A thread is scheduled only from RUNNABLE; every wait state returns there before it can proceed or finish.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777777"/>
    </marker>
  </defs>

  <!-- ===================== initial pseudo-state ===================== -->
  <circle cx="40" cy="157" r="6" fill="#555555"/>
  <line x1="47" y1="157" x2="78" y2="157" stroke="#777777" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== NEW ===================== -->
  <rect x="80" y="135" width="120" height="44" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.3"/>
  <text x="140" y="162" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle" font-family="'Courier New', monospace">NEW</text>

  <!-- NEW -> RUNNABLE -->
  <line x1="200" y1="157" x2="302" y2="157" stroke="#777777" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="251" y="149" font-size="10.5" fill="#555555" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">start()</text>

  <!-- ===================== RUNNABLE ===================== -->
  <rect x="304" y="131" width="150" height="52" rx="4" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4"/>
  <text x="379" y="162" font-size="13" font-weight="bold" fill="#1f3a52" text-anchor="middle" font-family="'Courier New', monospace">RUNNABLE</text>

  <!-- ===================== BLOCKED ===================== -->
  <rect x="590" y="44" width="176" height="46" rx="4" fill="#fdeeee" stroke="#b05a5a" stroke-width="1.4"/>
  <text x="678" y="72" font-size="13" font-weight="bold" fill="#7a2f2f" text-anchor="middle" font-family="'Courier New', monospace">BLOCKED</text>

  <!-- ===================== WAITING ===================== -->
  <rect x="590" y="140" width="176" height="46" rx="4" fill="#f1eef6" stroke="#6a4a8a" stroke-width="1.4"/>
  <text x="678" y="168" font-size="13" font-weight="bold" fill="#3a1f52" text-anchor="middle" font-family="'Courier New', monospace">WAITING</text>

  <!-- ===================== TIMED_WAITING ===================== -->
  <rect x="590" y="236" width="176" height="46" rx="4" fill="#fff6e6" stroke="#b58a2a" stroke-width="1.4"/>
  <text x="678" y="264" font-size="12.5" font-weight="bold" fill="#7a5a12" text-anchor="middle" font-family="'Courier New', monospace">TIMED_WAITING</text>

  <!-- ===================== TERMINATED ===================== -->
  <rect x="304" y="372" width="150" height="46" rx="4" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.6"/>
  <rect x="308" y="376" width="142" height="38" rx="3" fill="none" stroke="#5a8a4a" stroke-width="0.8"/>
  <text x="379" y="400" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">TERMINATED</text>

  <!-- ===================== RUNNABLE <-> BLOCKED ===================== -->
  <line x1="456" y1="140" x2="588" y2="74" stroke="#777777" stroke-width="1.4"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="486" y="92" font-size="10" fill="#555555" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">lock contention</text>
  <text x="556" y="128" font-size="10" fill="#999999" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">lock acquired</text>

  <!-- ===================== RUNNABLE <-> WAITING ===================== -->
  <line x1="456" y1="160" x2="588" y2="162" stroke="#777777" stroke-width="1.4"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="516" y="151" font-size="10" fill="#555555" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">wait()  /  join()</text>
  <text x="516" y="179" font-size="10" fill="#999999" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">notify()  /  notifyAll()</text>

  <!-- ===================== RUNNABLE <-> TIMED_WAITING ===================== -->
  <line x1="456" y1="176" x2="588" y2="252" stroke="#777777" stroke-width="1.4"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="484" y="238" font-size="10" fill="#555555" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">sleep(n)  /  wait(n)</text>
  <text x="560" y="205" font-size="10" fill="#999999" text-anchor="middle" font-style="italic" font-family="'Courier New', monospace">timeout elapses</text>

  <!-- ===================== RUNNABLE -> TERMINATED ===================== -->
  <line x1="379" y1="183" x2="379" y2="370" stroke="#777777" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="391" y="283" font-size="10.5" fill="#555555" text-anchor="start" font-style="italic" font-family="'Courier New', monospace">run() completes</text>
  <text x="391" y="298" font-size="10.5" fill="#555555" text-anchor="start" font-style="italic" font-family="'Courier New', monospace">(returns or throws)</text>
</svg>
