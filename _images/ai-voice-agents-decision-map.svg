<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Decision map for exposing the DocsAssistant core by voice</title>
  <desc>Decision map with four options for giving the DocsAssistant RAG core a voice. A hosted voice platform such as ElevenLabs Agents fits when you want the fastest start and are happy to point the platform at your core as a custom LLM or tool. A realtime speech-to-speech API such as OpenAI GPT-Live and Realtime, Gemini Live or Azure Voice Live fits when the lowest latency and most natural conversation matter and the RAG core is called through tools. An open-source framework such as Pipecat or LiveKit Agents fits when you want to choose each model, run some of them locally and own the pipeline. A hand-rolled pipeline fits when you need full control or want to learn the mechanics. Delivery then branches into the browser over WebRTC or WebSocket and the telephone network over Twilio or a SIP PBX such as Asterisk.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Four ways to give the DocsAssistant core a voice</text>
  <rect x="330" y="52" width="340" height="46" rx="8" fill="#1e3a8a"/>
  <text x="500" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">How much of the voice stack do you want to own?</text>
  <text x="500" y="90" text-anchor="middle" font-size="11" fill="#dbeafe">little  ......................................  all of it</text>
  <line x1="500" y1="98" x2="500" y2="116" stroke="#334155" stroke-width="2"/>
  <line x1="125" y1="116" x2="875" y2="116" stroke="#334155" stroke-width="2"/>
  <line x1="125" y1="116" x2="125" y2="134" stroke="#334155" stroke-width="2"/>
  <line x1="375" y1="116" x2="375" y2="134" stroke="#334155" stroke-width="2"/>
  <line x1="625" y1="116" x2="625" y2="134" stroke="#334155" stroke-width="2"/>
  <line x1="875" y1="116" x2="875" y2="134" stroke="#334155" stroke-width="2"/>

  <rect x="10" y="134" width="230" height="236" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="125" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Hosted voice platform</text>
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#334155">ElevenLabs Agents</text>
  <text x="22" y="204" font-size="11" font-weight="bold" fill="#0f172a">Choose it when</text>
  <text x="22" y="221" font-size="11" fill="#0f172a">you want a working agent today</text>
  <text x="22" y="236" font-size="11" fill="#0f172a">and a managed phone number</text>
  <text x="22" y="262" font-size="11" font-weight="bold" fill="#0f172a">RAG enters as</text>
  <text x="22" y="279" font-size="11" fill="#0f172a">custom LLM endpoint, server tool</text>
  <text x="22" y="294" font-size="11" fill="#0f172a">or MCP tool</text>
  <text x="22" y="320" font-size="11" font-weight="bold" fill="#0f172a">You give up</text>
  <text x="22" y="337" font-size="11" fill="#0f172a">choice of models and the audio path;</text>
  <text x="22" y="352" font-size="11" fill="#0f172a">data leaves for the vendor</text>

  <rect x="260" y="134" width="230" height="236" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="375" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Realtime speech-to-speech API</text>
  <text x="375" y="176" text-anchor="middle" font-size="11" fill="#334155">OpenAI, Gemini Live, Azure Voice Live</text>
  <text x="272" y="204" font-size="11" font-weight="bold" fill="#0f172a">Choose it when</text>
  <text x="272" y="221" font-size="11" fill="#0f172a">latency and natural barge-in matter</text>
  <text x="272" y="236" font-size="11" fill="#0f172a">most</text>
  <text x="272" y="262" font-size="11" font-weight="bold" fill="#0f172a">RAG enters as</text>
  <text x="272" y="279" font-size="11" fill="#0f172a">tool calls, remote MCP or a</text>
  <text x="272" y="294" font-size="11" fill="#0f172a">delegated backend</text>
  <text x="272" y="320" font-size="11" font-weight="bold" fill="#0f172a">You give up</text>
  <text x="272" y="337" font-size="11" fill="#0f172a">control of the STT and TTS stages;</text>
  <text x="272" y="352" font-size="11" fill="#0f172a">pricing is per audio minute or token</text>

  <rect x="510" y="134" width="230" height="236" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="625" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Open-source framework</text>
  <text x="625" y="176" text-anchor="middle" font-size="11" fill="#334155">Pipecat, LiveKit Agents</text>
  <text x="522" y="204" font-size="11" font-weight="bold" fill="#0f172a">Choose it when</text>
  <text x="522" y="221" font-size="11" fill="#0f172a">you pick each model, mix hosted and</text>
  <text x="522" y="236" font-size="11" fill="#0f172a">local, or must stay on premises</text>
  <text x="522" y="262" font-size="11" font-weight="bold" fill="#0f172a">RAG enters as</text>
  <text x="522" y="279" font-size="11" fill="#0f172a">the LLM step: a LangChain agent</text>
  <text x="522" y="294" font-size="11" fill="#0f172a">or a tool the LLM calls</text>
  <text x="522" y="320" font-size="11" font-weight="bold" fill="#0f172a">You give up</text>
  <text x="522" y="337" font-size="11" fill="#0f172a">operational simplicity: you run and</text>
  <text x="522" y="352" font-size="11" fill="#0f172a">scale the voice workers</text>

  <rect x="760" y="134" width="230" height="236" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="875" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Hand-rolled pipeline</text>
  <text x="875" y="176" text-anchor="middle" font-size="11" fill="#334155">Spring Boot or FastAPI</text>
  <text x="772" y="204" font-size="11" font-weight="bold" fill="#0f172a">Choose it when</text>
  <text x="772" y="221" font-size="11" fill="#0f172a">you need full control, a tiny</text>
  <text x="772" y="236" font-size="11" fill="#0f172a">footprint, or want to learn the parts</text>
  <text x="772" y="262" font-size="11" font-weight="bold" fill="#0f172a">RAG enters as</text>
  <text x="772" y="279" font-size="11" fill="#0f172a">a direct call to the core between</text>
  <text x="772" y="294" font-size="11" fill="#0f172a">STT and TTS</text>
  <text x="772" y="320" font-size="11" font-weight="bold" fill="#0f172a">You give up</text>
  <text x="772" y="337" font-size="11" fill="#0f172a">turn detection, echo handling and</text>
  <text x="772" y="352" font-size="11" fill="#0f172a">transports unless you build them</text>

  <line x1="125" y1="370" x2="125" y2="404" stroke="#334155" stroke-width="2"/>
  <line x1="375" y1="370" x2="375" y2="404" stroke="#334155" stroke-width="2"/>
  <line x1="625" y1="370" x2="625" y2="404" stroke="#334155" stroke-width="2"/>
  <line x1="875" y1="370" x2="875" y2="404" stroke="#334155" stroke-width="2"/>
  <line x1="125" y1="404" x2="875" y2="404" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="404" x2="500" y2="424" stroke="#334155" stroke-width="2"/>
  <rect x="330" y="424" width="340" height="34" rx="8" fill="#1e3a8a"/>
  <text x="500" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Then choose the delivery path</text>
  <line x1="500" y1="458" x2="500" y2="474" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="474" x2="750" y2="474" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="474" x2="250" y2="490" stroke="#334155" stroke-width="2"/>
  <line x1="750" y1="474" x2="750" y2="490" stroke="#334155" stroke-width="2"/>
  <rect x="80" y="490" width="340" height="42" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="250" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Web: WebRTC or WebSocket PCM</text>
  <text x="250" y="523" text-anchor="middle" font-size="11" fill="#0f172a">browser microphone, built-in echo cancellation</text>
  <rect x="580" y="490" width="340" height="42" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="750" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Telephony: Twilio, SIP trunk or Asterisk PBX</text>
  <text x="750" y="523" text-anchor="middle" font-size="11" fill="#0f172a">8 kHz mu-law audio, DTMF, transfer to a human</text>
  <text x="500" y="552" text-anchor="middle" font-size="10" fill="#334155">The DocsAssistant core stays the same behind all four options; only the way audio reaches it changes.</text>
</svg>
