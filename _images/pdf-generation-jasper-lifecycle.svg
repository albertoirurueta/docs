<svg viewBox="0 0 900 460" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="jl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">JasperReports lifecycle: design, compile, fill, export</text>

  <!-- Stage 1: design -->
  <rect x="20" y="50" width="190" height="40" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="115" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa6">1. Design</text>
  <rect x="20" y="100" width="190" height="130" rx="6" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="115" y="124" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">report.jrxml</text>
  <text x="115" y="144" text-anchor="middle" font-size="11" fill="#1f5fa6">v7 XML, edited in</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#1f5fa6">Jaspersoft Studio</text>
  <text x="115" y="186" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperDesign</text>
  <text x="115" y="206" text-anchor="middle" font-size="11" fill="#1f5fa6">mutable model in memory</text>

  <!-- Stage 2: compile -->
  <rect x="240" y="50" width="190" height="40" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="335" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#2b7a2b">2. Compile</text>
  <rect x="240" y="100" width="190" height="130" rx="6" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="335" y="124" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperReport</text>
  <text x="335" y="144" text-anchor="middle" font-size="11" fill="#2b7a2b">immutable, thread-safe</text>
  <text x="335" y="160" text-anchor="middle" font-size="11" fill="#2b7a2b">expressions compiled</text>
  <text x="335" y="186" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">report.jasper</text>
  <text x="335" y="206" text-anchor="middle" font-size="11" fill="#2b7a2b">serialised, same version</text>

  <!-- Stage 3: fill -->
  <rect x="460" y="50" width="190" height="40" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="555" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#b36b00">3. Fill</text>
  <rect x="460" y="100" width="190" height="130" rx="6" fill="#ffffff" stroke="#b36b00"/>
  <text x="555" y="124" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperPrint</text>
  <text x="555" y="144" text-anchor="middle" font-size="11" fill="#b36b00">pages of positioned</text>
  <text x="555" y="160" text-anchor="middle" font-size="11" fill="#b36b00">elements, no layout left</text>
  <text x="555" y="186" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">report.jrprint</text>
  <text x="555" y="206" text-anchor="middle" font-size="11" fill="#b36b00">optional serialised form</text>

  <!-- Stage 4: export -->
  <rect x="680" y="50" width="200" height="40" rx="6" fill="#f3e5f9" stroke="#7a2b8f" stroke-width="1.6"/>
  <text x="780" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2b8f">4. Export</text>
  <rect x="680" y="100" width="200" height="130" rx="6" fill="#ffffff" stroke="#7a2b8f"/>
  <text x="780" y="124" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRPdfExporter</text>
  <text x="780" y="144" text-anchor="middle" font-size="11" fill="#7a2b8f">PDF (jasperreports-pdf)</text>
  <text x="780" y="170" text-anchor="middle" font-size="11" fill="#7a2b8f">HtmlExporter, JRCsvExporter</text>
  <text x="780" y="190" text-anchor="middle" font-size="11" fill="#7a2b8f">JRXlsxExporter, JRDocxExporter</text>
  <text x="780" y="210" text-anchor="middle" font-size="11" fill="#7a2b8f">JRXlsExporter (excel-poi)</text>

  <line x1="210" y1="165" x2="238" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#jl-arrow)"/>
  <line x1="430" y1="165" x2="458" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#jl-arrow)"/>
  <line x1="650" y1="165" x2="678" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#jl-arrow)"/>

  <!-- Managers row -->
  <text x="20" y="262" font-size="13" font-weight="700" fill="#1a1a1a">Entry points</text>
  <rect x="240" y="274" width="190" height="52" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="335" y="296" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperCompileManager</text>
  <text x="335" y="314" text-anchor="middle" font-size="11" fill="#2b7a2b">compileReport(...)</text>
  <rect x="460" y="274" width="190" height="52" rx="5" fill="#ffffff" stroke="#b36b00"/>
  <text x="555" y="296" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperFillManager</text>
  <text x="555" y="314" text-anchor="middle" font-size="11" fill="#b36b00">fillReport(...)</text>
  <rect x="680" y="274" width="200" height="52" rx="5" fill="#ffffff" stroke="#7a2b8f"/>
  <text x="780" y="296" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JasperExportManager</text>
  <text x="780" y="314" text-anchor="middle" font-size="11" fill="#7a2b8f">or an exporter class</text>
  <rect x="20" y="274" width="190" height="52" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="115" y="296" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">JRXmlLoader</text>
  <text x="115" y="314" text-anchor="middle" font-size="11" fill="#1f5fa6">load(...)</text>
  <line x1="335" y1="230" x2="335" y2="272" stroke="#2b7a2b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="555" y1="230" x2="555" y2="272" stroke="#b36b00" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="780" y1="230" x2="780" y2="272" stroke="#7a2b8f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="115" y1="230" x2="115" y2="272" stroke="#1f5fa6" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Inputs at fill time -->
  <rect x="20" y="354" width="860" height="86" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  <text x="36" y="376" font-size="13" font-weight="700" fill="#1a1a1a">Supplied at fill time, once per run</text>
  <text x="36" y="400" font-size="12" font-family="Courier New, monospace" fill="#333">Map&lt;String, Object&gt; parameters</text>
  <text x="36" y="420" font-size="11" fill="#555">a HashMap (Map.of is rejected), values for the P-references of the template</text>
  <text x="470" y="400" font-size="12" font-family="Courier New, monospace" fill="#333">JRDataSource or java.sql.Connection</text>
  <text x="470" y="420" font-size="11" fill="#555">rows for the F-references; JavaBeans, not records</text>
  <line x1="460" y1="372" x2="460" y2="432" stroke="#aaa" stroke-width="1"/>
  <path d="M555,354 L555,330" stroke="#b36b00" stroke-width="1.5" fill="none" marker-end="url(#jl-arrow)"/>
</svg>
