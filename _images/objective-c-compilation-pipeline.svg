<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From .m source to a running Objective-C process</text>

  <!-- stage boxes -->
  <rect x="30" y="60" width="130" height="62" rx="6" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="95" y="85" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Source</text>
  <text x="95" y="103" font-size="11" fill="#1c4b73" text-anchor="middle">hello.m, hello.h</text>
  <text x="95" y="117" font-size="10.5" fill="#5b7089" text-anchor="middle">.m / .mm / .h</text>

  <rect x="190" y="60" width="130" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="255" y="85" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Preprocess</text>
  <text x="255" y="103" font-size="10.5" fill="#1c4b73" text-anchor="middle">#import, macros</text>
  <text x="255" y="117" font-size="10.5" fill="#1c4b73" text-anchor="middle">Clang modules (@import)</text>

  <rect x="350" y="60" width="150" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="425" y="85" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Compile</text>
  <text x="425" y="103" font-size="10.5" fill="#1c4b73" text-anchor="middle">parse, ARC insertion,</text>
  <text x="425" y="117" font-size="10.5" fill="#1c4b73" text-anchor="middle">lower to objc_msgSend</text>

  <rect x="530" y="60" width="120" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="590" y="85" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Assemble</text>
  <text x="590" y="103" font-size="10.5" fill="#1c4b73" text-anchor="middle">hello.o</text>
  <text x="590" y="117" font-size="10.5" fill="#5b7089" text-anchor="middle">object file</text>

  <!-- arrows row 1 -->
  <path d="M160 91 L185 91" stroke="#2f6fa8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M320 91 L345 91" stroke="#2f6fa8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M500 91 L525 91" stroke="#2f6fa8" stroke-width="2" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#2f6fa8"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <!-- down arrow to link -->
  <path d="M590 122 L590 165" stroke="#2f6fa8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- link stage -->
  <rect x="440" y="170" width="210" height="72" rx="6" fill="#f6e9cf" stroke="#b08a34" stroke-width="2"/>
  <text x="545" y="194" font-size="13" font-weight="bold" fill="#7a5c12" text-anchor="middle">Link</text>
  <text x="545" y="212" font-size="10.5" fill="#7a5c12" text-anchor="middle">-framework Foundation</text>
  <text x="545" y="228" font-size="10.5" fill="#7a5c12" text-anchor="middle">libobjc + libSystem</text>

  <!-- runtime library box feeding the linker -->
  <rect x="80" y="170" width="300" height="72" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="230" y="194" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Objective-C runtime library (libobjc)</text>
  <text x="230" y="212" font-size="10.5" fill="#2f5424" text-anchor="middle">objc_msgSend, class/metaclass tables, method caches,</text>
  <text x="230" y="228" font-size="10.5" fill="#2f5424" text-anchor="middle">ARC helpers (objc_retain / objc_release / objc_storeWeak)</text>

  <path d="M380 206 L435 206" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- executable -->
  <path d="M545 242 L545 285" stroke="#b08a34" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="440" y="290" width="210" height="54" rx="6" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="545" y="313" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Executable (hello)</text>
  <text x="545" y="331" font-size="10.5" fill="#5b7089" text-anchor="middle">Mach-O / ELF image</text>

  <!-- running process -->
  <path d="M440 317 L385 317" stroke="#2f6fa8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="80" y="290" width="300" height="54" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="230" y="311" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Running process</text>
  <text x="230" y="330" font-size="10.5" fill="#2f5424" text-anchor="middle">runtime resolves each message by selector, at send time</text>

  <text x="380" y="382" font-size="11.5" fill="#5b7089" text-anchor="middle">The runtime library is not just a build-time dependency: it is loaded and active for the life of the process,</text>
  <text x="380" y="399" font-size="11.5" fill="#5b7089" text-anchor="middle">which is what makes categories, swizzling, KVO and message forwarding possible.</text>
</svg>
