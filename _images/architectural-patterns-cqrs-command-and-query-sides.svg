<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">CQRS: one command side, many independent read models</text>

  <defs>
    <marker id="cq-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
    <marker id="cq-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="cq-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Command side -->
  <rect x="42" y="60" width="230" height="120" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="157" y="84" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Command side</text>
  <text x="157" y="104" font-size="10.5" fill="#333333" text-anchor="middle">Order aggregate</text>
  <text x="157" y="122" font-size="10.5" fill="#333333" text-anchor="middle">PlaceOrderService</text>
  <text x="157" y="144" font-size="9.5" fill="#555555" text-anchor="middle">validates, mutates,</text>
  <text x="157" y="158" font-size="9.5" fill="#555555" text-anchor="middle">owns write-side correctness</text>

  <!-- Event stream -->
  <rect x="322" y="90" width="200" height="60" rx="8" fill="#fdf3e3" stroke="#a8781f" stroke-width="2.2"/>
  <text x="422" y="112" font-size="12.5" font-weight="bold" fill="#a8781f" text-anchor="middle">order-events stream</text>
  <text x="422" y="132" font-size="9.5" fill="#333333" text-anchor="middle">OrderPlaced / OrderApproved /</text>
  <text x="422" y="145" font-size="9.5" fill="#333333" text-anchor="middle">OrderRejected / OrderCancelled</text>

  <line x1="272" y1="120" x2="318" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#cq-arrow-grey)"/>
  <text x="295" y="110" font-size="9" fill="#555555" text-anchor="middle">publish</text>

  <!-- Read model 1: OrderHistoryView -->
  <rect x="582" y="40" width="160" height="90" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2.2"/>
  <text x="662" y="62" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">OrderHistoryProjector</text>
  <text x="662" y="82" font-size="9.5" fill="#333333" text-anchor="middle">idempotent upsert,</text>
  <text x="662" y="96" font-size="9.5" fill="#333333" text-anchor="middle">keyed by event id</text>
  <text x="662" y="116" font-size="9.5" fill="#2d6a34" text-anchor="middle">-&gt; OrderHistoryView table</text>

  <line x1="522" y1="105" x2="578" y2="85" stroke="#2d6a34" stroke-width="2" marker-end="url(#cq-arrow-green)"/>

  <!-- Read model 2: search index (hypothetical) -->
  <rect x="582" y="160" width="160" height="90" rx="8" fill="#fbecea" stroke="#a8412e" stroke-width="2.2" stroke-dasharray="5,4"/>
  <text x="662" y="182" font-size="12" font-weight="bold" fill="#a8412e" text-anchor="middle">Search projector</text>
  <text x="662" y="202" font-size="9.5" fill="#333333" text-anchor="middle">(hypothetical)</text>
  <text x="662" y="220" font-size="9.5" fill="#333333" text-anchor="middle">own storage, own schema</text>
  <text x="662" y="236" font-size="9.5" fill="#a8412e" text-anchor="middle">-&gt; full-text search index</text>

  <line x1="522" y1="140" x2="578" y2="195" stroke="#a8412e" stroke-width="2" marker-end="url(#cq-arrow-blue)"/>

  <!-- Query-only service -->
  <rect x="42" y="230" width="230" height="80" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2.2"/>
  <text x="157" y="254" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Query side</text>
  <text x="157" y="274" font-size="10" fill="#333333" text-anchor="middle">OrderHistoryQueryService</text>
  <text x="157" y="292" font-size="9.5" fill="#555555" text-anchor="middle">reads only -- never writes Order</text>

  <line x1="662" y1="130" x2="662" y2="150" stroke="#999999" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="500" y1="300" x2="662" y2="300" stroke="#999999" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="662" y1="250" x2="662" y2="300" stroke="#999999" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="272" y1="270" x2="496" y2="300" stroke="#999999" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="480" y="292" font-size="9" fill="#777777" text-anchor="middle">serves reads from OrderHistoryView</text>

  <!-- Legend / caption -->
  <rect x="42" y="345" width="18" height="18" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="68" y="358" font-size="10.5" fill="#333333">Command side -- one writer, the aggregate's own consistency boundary</text>

  <rect x="42" y="373" width="18" height="18" rx="3" fill="#fdf3e3" stroke="#a8781f" stroke-width="1.6"/>
  <text x="68" y="386" font-size="10.5" fill="#333333">Event stream -- the only channel a read model may depend on</text>

  <rect x="42" y="401" width="18" height="18" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="68" y="414" font-size="10.5" fill="#333333">Read models -- any number, each with its own storage, schema, and query shape</text>

  <text x="390" y="440" font-size="10.5" fill="#444444" text-anchor="middle">The command side never knows how many read models subscribe, or how they are shaped.</text>
</svg>
