<svg viewBox="0 0 720 300" width="720" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What happens to an override when the main changes</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="20" y="50" width="200" height="200" rx="10"/><rect x="260" y="50" width="200" height="200" rx="10"/><rect x="500" y="50" width="200" height="200" rx="10"/></g>
<g stroke="#4B5563" stroke-width="1.5"><path d="M222,150 L258,150" marker-end="url(#ah)"/><path d="M462,150 L498,150" marker-end="url(#ah)"/></g>
<g fill="#4F46E5"><circle cx="38" cy="68" r="11"/><circle cx="278" cy="68" r="11"/><circle cx="518" cy="68" r="11"/></g>
<g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="38" y="72">1</text><text x="278" y="72">2</text><text x="518" y="72">3</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="120" y="96" font-weight="bold">Instance with override</text>
<rect x="45" y="120" width="150" height="40" rx="8" fill="#B45309"/><text x="120" y="145" fill="#FFFFFF">Remove</text>
<text x="120" y="190">label and fill overridden,</text><text x="120" y="206">radius 8 inherited</text>
<text x="360" y="96" font-weight="bold">Main changes</text>
<rect x="285" y="120" width="150" height="40" rx="20" fill="#4F46E5"/><text x="360" y="145" fill="#FFFFFF">Add to shelf</text>
<text x="360" y="190">radius 8 becomes 20,</text><text x="360" y="206">shape becomes a pill</text>
<text x="600" y="96" font-weight="bold">Instance after update</text>
<rect x="525" y="120" width="150" height="40" rx="20" fill="#B45309"/><text x="600" y="145" fill="#FFFFFF">Remove</text>
<text x="600" y="190">radius 20 arrives,</text><text x="600" y="206">overrides are kept</text>
</g>
<text x="360" y="276" font-size="12" fill="#4B5563" text-anchor="middle">Reset overrides on the instance to bring back the main component's label and fill.</text>
</svg>
