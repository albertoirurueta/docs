<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a JavaScript or Rust Function becomes a Wasm module</title>
  <desc id="d">Two lanes. JavaScript: input query and src files, esbuild bundle, Javy build tool, function.wasm linked to the Javy engine at runtime. Rust: input query and src files, cargo build for the wasm32-unknown-unknown target, wasm-opt, a named wasm file. Both lanes export one function per target, which Shopify calls with the result of the input query and which must stay inside the resource limits.</desc>
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="14" fill="#f2f5f8" font-weight="bold">
    <text x="20" y="30">JavaScript or TypeScript</text>
    <text x="20" y="150">Rust</text>
  </g>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="20" y="42" width="130" height="64" rx="8"/>
    <rect x="170" y="42" width="130" height="64" rx="8"/>
    <rect x="320" y="42" width="130" height="64" rx="8"/>
    <rect x="470" y="42" width="140" height="64" rx="8"/>
  </g>
  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="20" y="162" width="130" height="64" rx="8"/>
    <rect x="170" y="162" width="130" height="64" rx="8"/>
    <rect x="320" y="162" width="130" height="64" rx="8"/>
    <rect x="470" y="162" width="140" height="64" rx="8"/>
  </g>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="66" font-weight="bold">src/*.js + .graphql</text><text x="85" y="84">typegen writes</text><text x="85" y="98">generated/api.ts</text>
    <text x="235" y="66" font-weight="bold">esbuild</text><text x="235" y="84">bundles npm imports</text><text x="235" y="98">into one file</text>
    <text x="385" y="66" font-weight="bold">Javy</text><text x="385" y="84">compiles the bundle,</text><text x="385" y="98">no engine inside</text>
    <text x="540" y="66" font-weight="bold">dist/function.wasm</text><text x="540" y="84">2 to 3 kB measured,</text><text x="540" y="98">engine linked at runtime</text>

    <text x="85" y="186" font-weight="bold">src/*.rs + .graphql</text><text x="85" y="204">typegen macro builds</text><text x="85" y="218">the Rust types</text>
    <text x="235" y="186" font-weight="bold">cargo build</text><text x="235" y="204">wasm32-unknown-</text><text x="235" y="218">unknown --release</text>
    <text x="385" y="186" font-weight="bold">wasm-opt</text><text x="385" y="204">run by the CLI</text><text x="385" y="218">unless disabled</text>
    <text x="540" y="186" font-weight="bold">target/.../name.wasm</text><text x="540" y="204">must stay under</text><text x="540" y="218">256 kB</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 74 H166"/><path d="M300 74 H316"/><path d="M450 74 H466"/>
    <path d="M150 194 H166"/><path d="M300 194 H316"/><path d="M450 194 H466"/>
  </g>

  <path d="M610 74 H636 V150" stroke="#f2f5f8" stroke-width="2" fill="none"/>
  <path d="M610 194 H636 V176" stroke="#f2f5f8" stroke-width="2" fill="none"/>
  <path d="M636 150 V162" stroke="#f2f5f8" stroke-width="2" fill="none"/>
  <path d="M636 162 H660" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="662" y="120" width="80" height="84" rx="8" fill="#8a6a3a" stroke="#f2f5f8"/>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="702" y="146" font-weight="bold">shopify</text><text x="702" y="162" font-weight="bold">app deploy</text>
    <text x="702" y="182">one export</text><text x="702" y="196">per target</text>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <text x="20" y="262">At run time Shopify calls the export of the matching target with the result of the input query, counts the Wasm</text>
    <text x="20" y="280">instructions, and applies the operations that come back. Limits: 256 kB binary, 11 million instructions up to 200</text>
    <text x="20" y="298">cart lines, 128 kB input, 20 kB output, input query of 3,000 bytes with a cost of at most 30.</text>
  </g>
</svg>
