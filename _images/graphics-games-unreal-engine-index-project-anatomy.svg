<svg viewBox="0 0 760 392" width="760" height="392" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="392" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What an Unreal project is made of</text>
<rect x="24" y="44" width="712" height="332" rx="14" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="44" y="66" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Bookshelf project</text>
<text x="716" y="66" font-size="11" fill="#374151" text-anchor="end">Bookshelf.uproject names the engine version and the modules</text>
<rect x="44" y="80" width="300" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="58" y="100" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Source: C++ module Bookshelf</text>
<rect x="60" y="112" width="268" height="124" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="72" y="132" font-size="11" fill="#374151" text-anchor="start">Bookshelf.Build.cs (module rules)</text>
<text x="72" y="152" font-size="11" fill="#374151" text-anchor="start">Bookshelf.Target.cs (build target)</text>
<text x="72" y="172" font-size="11" fill="#374151" text-anchor="start">BookActor.h and BookActor.cpp</text>
<text x="72" y="192" font-size="11" fill="#374151" text-anchor="start">ShelfActor.h, BookshelfGameMode.h</text>
<text x="72" y="212" font-size="11" fill="#374151" text-anchor="start">BP subclasses extend these classes</text>
<rect x="364" y="80" width="352" height="170" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="378" y="100" font-size="13" fill="#047857" text-anchor="start" font-weight="bold">Content folder</text>
<rect x="378" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="430" y="140" font-size="11" fill="#374151" text-anchor="middle">Levels (.umap)</text>
<rect x="490" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="542" y="140" font-size="11" fill="#374151" text-anchor="middle">BP_Book</text>
<rect x="602" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="654" y="140" font-size="11" fill="#374151" text-anchor="middle">Materials</text>
<rect x="378" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="430" y="196" font-size="11" fill="#374151" text-anchor="middle">Input Actions</text>
<rect x="490" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="542" y="196" font-size="11" fill="#374151" text-anchor="middle">Widgets</text>
<rect x="602" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="654" y="196" font-size="11" fill="#374151" text-anchor="middle">bookshelf.glb</text>
<text x="378" y="236" font-size="11" fill="#374151" text-anchor="start">Every asset is a .uasset or .umap package file.</text>
<rect x="44" y="264" width="300" height="96" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="284" font-size="13" fill="#92400E" text-anchor="start" font-weight="bold">Config and Plugins</text>
<text x="58" y="304" font-size="11" fill="#374151" text-anchor="start">DefaultEngine.ini, DefaultGame.ini, DefaultInput.ini.</text>
<text x="58" y="320" font-size="11" fill="#374151" text-anchor="start">Plugins hold modules and content of their own.</text>
<text x="58" y="336" font-size="11" fill="#374151" text-anchor="start">Commit these with Source and Content.</text>
<rect x="364" y="264" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="378" y="284" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Generated folders</text>
<text x="378" y="304" font-size="11" fill="#374151" text-anchor="start">Binaries, Intermediate, Saved, DerivedDataCache.</text>
<text x="378" y="320" font-size="11" fill="#374151" text-anchor="start">They are rebuilt from the rest, so leave them out of Git.</text>
<text x="378" y="336" font-size="11" fill="#374151" text-anchor="start">Packaging cooks Content into a build for one platform.</text>
</svg>
