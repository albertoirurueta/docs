<svg viewBox="0 0 1000 440" width="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">How a request travels through CloudFront's cache layers</text>

  <!-- viewer -->
  <rect x="20" y="150" width="130" height="90" rx="10" fill="#f3f4f6" stroke="#5b6670" stroke-width="1.8"/>
  <text x="85" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Viewer</text>
  <text x="85" y="202" text-anchor="middle" font-size="11" fill="#3c4a58">browser or app</text>
  <text x="85" y="218" text-anchor="middle" font-size="11" fill="#3c4a58">HTTPS request</text>

  <!-- edge -->
  <rect x="215" y="120" width="165" height="150" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="297" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">Edge location</text>
  <text x="297" y="166" text-anchor="middle" font-size="11" fill="#123a72">nearest point of presence</text>
  <rect x="233" y="180" width="129" height="30" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="297" y="200" text-anchor="middle" font-size="11" fill="#123a72">CloudFront Function</text>
  <rect x="233" y="220" width="129" height="38" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="297" y="236" text-anchor="middle" font-size="11" fill="#123a72">cache lookup by</text>
  <text x="297" y="250" text-anchor="middle" font-size="11" fill="#123a72">cache key</text>

  <!-- regional edge cache -->
  <rect x="445" y="120" width="150" height="150" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="520" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4800">Regional edge</text>
  <text x="520" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4800">cache</text>
  <text x="520" y="192" text-anchor="middle" font-size="11" fill="#7a4800">larger, longer-lived</text>
  <text x="520" y="208" text-anchor="middle" font-size="11" fill="#7a4800">second chance before</text>
  <text x="520" y="224" text-anchor="middle" font-size="11" fill="#7a4800">the origin is asked</text>

  <!-- origin shield -->
  <rect x="650" y="120" width="140" height="150" rx="10" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="720" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1d75">Origin Shield</text>
  <text x="720" y="166" text-anchor="middle" font-size="11" fill="#4a1d75">optional</text>
  <text x="720" y="192" text-anchor="middle" font-size="11" fill="#4a1d75">one chosen Region</text>
  <text x="720" y="208" text-anchor="middle" font-size="11" fill="#4a1d75">collapses misses into</text>
  <text x="720" y="224" text-anchor="middle" font-size="11" fill="#4a1d75">a single origin fetch</text>

  <!-- origin -->
  <rect x="845" y="120" width="140" height="150" rx="10" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="2"/>
  <text x="915" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Origin</text>
  <text x="915" y="176" text-anchor="middle" font-size="11" fill="#14532d">S3 bucket (OAC)</text>
  <text x="915" y="196" text-anchor="middle" font-size="11" fill="#14532d">ALB / API Gateway</text>
  <text x="915" y="216" text-anchor="middle" font-size="11" fill="#14532d">VPC origin</text>
  <text x="915" y="236" text-anchor="middle" font-size="11" fill="#14532d">any HTTP server</text>

  <!-- arrows forward (misses) -->
  <g stroke="#3c4a58" stroke-width="2" fill="#3c4a58">
    <line x1="150" y1="195" x2="213" y2="195"/><polygon points="215,195 205,190 205,200"/>
    <line x1="380" y1="195" x2="443" y2="195"/><polygon points="445,195 435,190 435,200"/>
    <line x1="595" y1="195" x2="648" y2="195"/><polygon points="650,195 640,190 640,200"/>
    <line x1="790" y1="195" x2="843" y2="195"/><polygon points="845,195 835,190 835,200"/>
  </g>
  <text x="414" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e">miss</text>
  <text x="621" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e">miss</text>
  <text x="817" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e">miss</text>

  <!-- hit returns -->
  <path d="M 297 120 L 297 80 L 85 80 L 85 148" fill="none" stroke="#1e7b3a" stroke-width="2.2"/>
  <polygon points="85,150 80,140 90,140" fill="#1e7b3a"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1e7b3a">hit: X-Cache "Hit from cloudfront"</text>

  <path d="M 520 120 L 520 96 L 297 96" fill="none" stroke="#1e7b3a" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="520" y="88" text-anchor="middle" font-size="11" fill="#1e7b3a">hit in regional cache, fills the edge</text>

  <!-- fill-back path -->
  <path d="M 915 270 L 915 330 L 297 330 L 297 272" fill="none" stroke="#1a5fb4" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="297,271 292,281 302,281" fill="#1a5fb4"/>
  <text x="606" y="322" text-anchor="middle" font-size="12" fill="#123a72">response is stored at each layer on the way back (subject to TTL and cache key)</text>

  <!-- legend -->
  <rect x="20" y="360" width="960" height="64" rx="8" fill="#f8fafc" stroke="#d0d7de"/>
  <text x="36" y="384" font-size="12" fill="#1a1a1a">Cache key (default for CachingOptimized): host + path + normalized Accept-Encoding. Headers, cookies and query strings join the key only if the</text>
  <text x="36" y="402" font-size="12" fill="#1a1a1a">cache policy says so. The origin request policy decides what is forwarded on a miss without changing the key.</text>
  <text x="36" y="418" font-size="11" fill="#5b6670">Only viewer-facing hits are served by the edge; every layer applies the same TTL rules (min, default, max TTL and Cache-Control).</text>
</svg>
