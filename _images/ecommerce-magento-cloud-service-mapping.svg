<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The tiers of the Magento architecture on AWS, Google Cloud and Azure</title>
<desc id="d">A grid with one row per tier and one column per cloud. Kubernetes: EKS, GKE, AKS. Database: RDS or Aurora MySQL 3, Cloud SQL for MySQL, Azure Database for MySQL Flexible Server. Search: Amazon OpenSearch Service, with no first-party managed OpenSearch on Google Cloud or Azure. Cache and sessions: ElastiCache for Valkey, Memorystore for Valkey, Azure Managed Redis. Queue: Amazon MQ for RabbitMQ, with RabbitMQ in the cluster or a partner service elsewhere. Full page cache: Varnish pods on every cloud. Media: S3 or EFS, Cloud Storage or Filestore, Blob Storage or Azure Files. CDN and WAF, secrets and pod identity have a native service on each cloud.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker></defs>
<rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">The same tiers on three clouds</text>
