<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">DTensor placements on a 4-device mesh</title>
<desc id="d">A logical 8 by 4 tensor on a one-dimensional mesh of four devices under three placements. Shard(0) gives each device two rows, Replicate gives each device the full tensor, and Partial(sum) gives each device a full-size tensor whose elementwise sum across devices is the logical value.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DTensor placements on a 1-D mesh of 4 devices</text>
<text x="120" y="64" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">Shard(0)</text>
<rect x="20" y="78" width="200" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="120" y="96" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 0: rows 0, 1</text>
<text x="120" y="112" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (2, 4)</text>
<rect x="20" y="130" width="200" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="120" y="148" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 1: rows 2, 3</text>
<text x="120" y="164" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (2, 4)</text>
<rect x="20" y="182" width="200" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="120" y="200" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 2: rows 4, 5</text>
<text x="120" y="216" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (2, 4)</text>
<rect x="20" y="234" width="200" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="120" y="252" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 3: rows 6, 7</text>
<text x="120" y="268" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (2, 4)</text>
<text x="355" y="64" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">Replicate()</text>
<rect x="255" y="78" width="200" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="355" y="96" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 0: full copy</text>
<text x="355" y="112" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="255" y="130" width="200" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="355" y="148" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 1: full copy</text>
<text x="355" y="164" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="255" y="182" width="200" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="355" y="200" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 2: full copy</text>
<text x="355" y="216" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="255" y="234" width="200" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="355" y="252" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 3: full copy</text>
<text x="355" y="268" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<text x="590" y="64" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">Partial(sum)</text>
<rect x="490" y="78" width="200" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="96" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 0: full-size addend</text>
<text x="590" y="112" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="490" y="130" width="200" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="148" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 1: full-size addend</text>
<text x="590" y="164" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="490" y="182" width="200" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="200" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 2: full-size addend</text>
<text x="590" y="216" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<rect x="490" y="234" width="200" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="252" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">device 3: full-size addend</text>
<text x="590" y="268" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">local shape (8, 4)</text>
<text x="120" y="306" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all_gather gives Replicate</text><text x="355" y="306" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">no communication needed</text><text x="590" y="306" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all_reduce gives Replicate</text>
