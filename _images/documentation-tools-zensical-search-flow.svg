<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Zensical search flow: build writes search.json, browser worker loads it and answers queries</title>
  <rect x="0" y="0" width="720" height="220" rx="12" fill="#eef2f7"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1e293b">Build time</text>
  <text x="400" y="28" font-size="14" font-weight="bold" fill="#1e293b">Reader's browser</text>
  <rect x="20" y="45" width="150" height="60" rx="8" fill="#bfdbfe" stroke="#1e3a8a"/>
  <text x="95" y="72" font-size="13" text-anchor="middle" fill="#0f172a">Markdown pages</text>
  <text x="95" y="90" font-size="11" text-anchor="middle" fill="#0f172a">titles and headings</text>
  <rect x="215" y="45" width="150" height="60" rx="8" fill="#fde68a" stroke="#92400e"/>
  <text x="290" y="72" font-size="13" text-anchor="middle" fill="#0f172a">zensical build</text>
  <text x="290" y="90" font-size="11" text-anchor="middle" fill="#0f172a">separator, language</text>
  <rect x="215" y="140" width="150" height="55" rx="8" fill="#bbf7d0" stroke="#166534"/>
  <text x="290" y="164" font-size="13" text-anchor="middle" fill="#0f172a">site/search.json</text>
  <text x="290" y="182" font-size="11" text-anchor="middle" fill="#0f172a">one record per heading</text>
  <rect x="400" y="140" width="150" height="55" rx="8" fill="#e9d5ff" stroke="#6b21a8"/>
  <text x="475" y="164" font-size="13" text-anchor="middle" fill="#0f172a">search web worker</text>
  <text x="475" y="182" font-size="11" text-anchor="middle" fill="#0f172a">loads index once</text>
  <rect x="570" y="45" width="130" height="60" rx="8" fill="#fecaca" stroke="#991b1b"/>
  <text x="635" y="72" font-size="13" text-anchor="middle" fill="#0f172a">Search dialog</text>
  <text x="635" y="90" font-size="11" text-anchor="middle" fill="#0f172a">English interface</text>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,75 L213,75"/>
    <path d="M290,105 L290,138"/>
    <path d="M365,167 L398,167"/>
    <path d="M550,160 L600,107"/>
    <path d="M660,107 L560,150" stroke-dasharray="4 3"/>
  </g>
  <text x="620" y="150" font-size="11" fill="#1e293b">query / hits</text>
</svg>
