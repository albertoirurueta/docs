<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Replacing a Shopify script tag</title>
  <desc>A table of four script tag purposes maps each to its replacement: app embed block, app block, web pixel or customer account UI extension. A timeline below marks 2026-08-26, 2026-10-01 and 2027-03-01.</desc>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">What replaces a script tag</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">Decide by what the script does, not by how it was loaded</text>

  <g font-size="13" fill="#1f2933">
    <rect x="20" y="64" width="330" height="48" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
    <text x="185" y="84" text-anchor="middle" font-weight="bold">Loads JavaScript on storefront pages</text>
    <text x="185" y="102" text-anchor="middle" font-size="11.5">chat bubble, badge, popup, widget</text>
    <rect x="610" y="64" width="330" height="48" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="775" y="84" text-anchor="middle" font-weight="bold">App embed block</text>
    <text x="775" y="102" text-anchor="middle" font-size="11.5">target head, compliance_head or body; off until activated</text>

    <rect x="20" y="128" width="330" height="48" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
    <text x="185" y="148" text-anchor="middle" font-weight="bold">Injects content the merchant places</text>
    <text x="185" y="166" text-anchor="middle" font-size="11.5">reviews, ratings, roast date badge</text>
    <rect x="610" y="128" width="330" height="48" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="775" y="148" text-anchor="middle" font-weight="bold">App block</text>
    <text x="775" y="166" text-anchor="middle" font-size="11.5">target content; JSON templates and @app sections only</text>

    <rect x="20" y="192" width="330" height="48" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
    <text x="185" y="212" text-anchor="middle" font-weight="bold">Only collects analytics or conversions</text>
    <text x="185" y="230" text-anchor="middle" font-size="11.5">ad pixels, behavioural data</text>
    <rect x="610" y="192" width="330" height="48" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="775" y="212" text-anchor="middle" font-weight="bold">Web pixel</text>
    <text x="775" y="230" text-anchor="middle" font-size="11.5">webPixelCreate; no theme editor step; consent-aware</text>

    <rect x="20" y="256" width="330" height="48" rx="8" fill="#fdf0d9" stroke="#b4690e" stroke-width="1.5"/>
    <text x="185" y="276" text-anchor="middle" font-weight="bold">Customizes the Order status page</text>
    <text x="185" y="294" text-anchor="middle" font-size="11.5">display_scope order_status or all</text>
    <rect x="610" y="256" width="330" height="48" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="775" y="276" text-anchor="middle" font-weight="bold">Customer account UI extension or web pixel</text>
    <text x="775" y="294" text-anchor="middle" font-size="11.5">UI needs an upgraded store; a pixel cannot render UI</text>
  </g>
  <g stroke="#7b8794" stroke-width="2" fill="#7b8794">
    <line x1="352" y1="88" x2="598" y2="88"/><polygon points="608,88 596,82 596,94" stroke="none"/>
    <line x1="352" y1="152" x2="598" y2="152"/><polygon points="608,152 596,146 596,158" stroke="none"/>
    <line x1="352" y1="216" x2="598" y2="216"/><polygon points="608,216 596,210 596,222" stroke="none"/>
    <line x1="352" y1="280" x2="598" y2="280"/><polygon points="608,280 596,274 596,286" stroke="none"/>
  </g>

  <!-- Timeline -->
  <text x="20" y="338" font-size="13" font-weight="bold" fill="#7b8794">Deprecation dates</text>
  <line x1="60" y1="395" x2="900" y2="395" stroke="#7b8794" stroke-width="3"/>
  <g fill="#7b8794">
    <circle cx="140" cy="395" r="7"/><circle cx="500" cy="395" r="7"/><circle cx="820" cy="395" r="7"/>
  </g>
  <g font-size="12.5" fill="#1f2933" text-anchor="middle">
    <text x="140" y="372" font-weight="bold">2026-08-26</text>
    <text x="140" y="420">Order status page: script tags</text>
    <text x="140" y="437">stop running for non-Plus stores</text>
    <text x="500" y="372" font-weight="bold">2026-10-01</text>
    <text x="500" y="420">scriptTagCreate and scriptTagUpdate</text>
    <text x="500" y="437">fail on every API version; reads and deletes still work</text>
    <text x="820" y="372" font-weight="bold">2027-03-01</text>
    <text x="820" y="420">Shopify stops injecting script tags</text>
    <text x="820" y="437">into storefront pages</text>
  </g>
  <rect x="20" y="456" width="920" height="32" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="480" y="477" font-size="12.5" fill="#7b8794" text-anchor="middle">Delete the old script tag only after the replacement is confirmed active; both at once loads the script twice</text>
</svg>
