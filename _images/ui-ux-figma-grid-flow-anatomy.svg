<svg viewBox="0 0 740 360" width="740" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="740" height="360" fill="#FFFFFF"/>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a grid flow frame (3 columns, 2 rows)</text>
<g transform="translate(-16,0)">
<rect x="60" y="60" width="440" height="250" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<g fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5">
<rect x="80" y="80" width="120" height="100" rx="6"/><rect x="220" y="80" width="120" height="100" rx="6"/><rect x="360" y="80" width="120" height="100" rx="6"/>
<rect x="80" y="200" width="120" height="90" rx="6"/><rect x="220" y="200" width="260" height="90" rx="6" fill="#FEF3C7" stroke="#B45309"/></g>
<g fill="#E5E7EB"><rect x="90" y="90" width="100" height="60" rx="4"/><rect x="230" y="90" width="100" height="60" rx="4"/><rect x="370" y="90" width="100" height="60" rx="4"/><rect x="90" y="210" width="100" height="50" rx="4"/></g>
<text x="350" y="250" font-size="12" fill="#92400E" text-anchor="middle">item spanning 2 columns</text>
<g fill="#4F46E5"><circle cx="140" cy="48" r="11"/><circle cx="210" cy="190" r="11"/><circle cx="42" cy="130" r="11"/><circle cx="500" cy="190" r="0"/></g>
<g fill="#B45309"><circle cx="350" cy="320" r="11"/><circle cx="490" cy="135" r="11"/></g>
<g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="140" y="52">1</text><text x="210" y="194">2</text><text x="42" y="134">3</text><text x="350" y="324">4</text><text x="490" y="139">5</text></g>
</g>
<g font-size="12" fill="#374151"><text x="512" y="64">1  Column track (width: fixed,</text><text x="523" y="80">fr or hug)</text>
<text x="512" y="108">2  Column gap and row gap</text><text x="512" y="136">3  Row track (height: auto</text><text x="523" y="152">by default)</text><text x="512" y="180">4  Cell and spanned item</text><text x="523" y="196">(span fields)</text><text x="512" y="224">5  Padding of the frame</text>
<text x="512" y="264" fill="#6B7280">Schematic, based on Figma Learn</text><text x="512" y="280" fill="#6B7280">checked on 2026-10-30.</text></g>
</svg>
