<svg viewBox="0 0 820 560" width="820" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrTs" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="arrTsRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a02020"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>
  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The terminal stack: emulator, PTY, line discipline, process group</text>
  <text x="410" y="46" font-size="13" fill="#666666" text-anchor="middle">Left: Linux and macOS. Right: the Windows equivalent built on ConPTY.</text>

  <!-- POSIX panel -->
  <rect x="20" y="62" width="540" height="486" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="290" y="84" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">POSIX: Linux, macOS, BSD</text>

  <!-- emulator -->
  <rect x="150" y="98" width="280" height="52" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="290" y="119" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Terminal emulator (user space)</text>
  <text x="290" y="137" font-size="11" fill="#333333" text-anchor="middle">Terminal.app, iTerm2, GNOME Terminal, tmux, ssh</text>

  <!-- kernel region -->
  <rect x="40" y="176" width="500" height="196" rx="8" fill="#ffffff" stroke="#666666" stroke-dasharray="6 4"/>
  <text x="56" y="194" font-size="12" font-weight="bold" fill="#666666">Kernel</text>

  <rect x="150" y="204" width="280" height="36" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="290" y="226" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PTY master (fd from posix_openpt)</text>

  <rect x="110" y="256" width="360" height="52" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="290" y="276" font-size="13" font-weight="bold" fill="#7a5a10" text-anchor="middle">Line discipline (termios settings)</text>
  <text x="290" y="294" font-size="11" fill="#333333" text-anchor="middle">ICANON line editing, ECHO, ISIG, ONLCR, VMIN / VTIME</text>

  <rect x="150" y="324" width="280" height="36" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="290" y="346" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PTY slave (/dev/pts/N or /dev/ttysNNN)</text>

  <!-- vertical arrows between emulator and kernel -->
  <line x1="230" y1="152" x2="230" y2="202" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
  <text x="222" y="166" font-size="11" fill="#1c4b73" text-anchor="end">key bytes</text>
  <line x1="350" y1="202" x2="350" y2="152" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
  <text x="366" y="166" font-size="11" fill="#1c4b73">program output (VT text)</text>
  <line x1="290" y1="242" x2="290" y2="254" stroke="#1c4b73" stroke-width="2"/>
  <line x1="290" y1="310" x2="290" y2="322" stroke="#1c4b73" stroke-width="2"/>

  <!-- session -->
  <rect x="40" y="396" width="500" height="140" rx="8" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="100" y="414" font-size="12" font-weight="bold" fill="#7a5a10">Session (leader called setsid; the slave is its controlling terminal)</text>
  <rect x="60" y="428" width="215" height="92" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="167" y="450" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Foreground process group</text>
  <text x="167" y="468" font-size="11" fill="#333333" text-anchor="middle">shelf tui (reads and writes the tty)</text>
  <text x="167" y="486" font-size="11" fill="#333333" text-anchor="middle">tcgetpgrp(fd) names this group</text>
  <text x="167" y="504" font-size="11" fill="#333333" text-anchor="middle">gets SIGINT, SIGQUIT, SIGTSTP</text>
  <rect x="305" y="428" width="215" height="92" rx="6" fill="#ffffff" stroke="#666666" stroke-dasharray="5 4"/>
  <text x="412" y="450" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Background process groups</text>
  <text x="412" y="468" font-size="11" fill="#333333" text-anchor="middle">shelf list | less &amp;, shelfd</text>
  <text x="412" y="486" font-size="11" fill="#333333" text-anchor="middle">read the tty: SIGTTIN (stopped)</text>
  <text x="412" y="504" font-size="11" fill="#333333" text-anchor="middle">write with TOSTOP set: SIGTTOU</text>

  <line x1="290" y1="362" x2="290" y2="394" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
  <line x1="110" y1="282" x2="75" y2="282" stroke="#a02020" stroke-width="2"/>
  <line x1="75" y1="282" x2="75" y2="426" stroke="#a02020" stroke-width="2" marker-end="url(#arrTsRed)"/>
  <text x="62" y="330" font-size="11" fill="#a02020" transform="rotate(-90 62 330)" text-anchor="middle">ISIG: signal to the group</text>

  <!-- Windows panel -->
  <rect x="580" y="62" width="220" height="486" rx="12" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="690" y="84" font-size="14" font-weight="bold" fill="#7a5a10" text-anchor="middle">Windows (ConPTY)</text>

  <rect x="596" y="102" width="188" height="64" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="690" y="124" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Terminal (the hosting app)</text>
  <text x="690" y="140" font-size="11" fill="#333333" text-anchor="middle">Windows Terminal, VS Code, ...</text>
  <text x="690" y="156" font-size="11" fill="#333333" text-anchor="middle">calls CreatePseudoConsole</text>

  <rect x="596" y="196" width="188" height="64" rx="6" fill="#ffffff" stroke="#666666" stroke-dasharray="5 4"/>
  <text x="690" y="220" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Two anonymous pipes</text>
  <text x="690" y="238" font-size="11" fill="#333333" text-anchor="middle">input: VT text from keys</text>
  <text x="690" y="252" font-size="11" fill="#333333" text-anchor="middle">output: VT text to draw</text>

  <rect x="596" y="290" width="188" height="76" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="690" y="312" font-size="12" font-weight="bold" fill="#7a5a10" text-anchor="middle">conhost.exe / OpenConsole</text>
  <text x="690" y="330" font-size="11" fill="#333333" text-anchor="middle">server-only mode: serves the</text>
  <text x="690" y="344" font-size="11" fill="#333333" text-anchor="middle">Console API, translates it to and</text>
  <text x="690" y="358" font-size="11" fill="#333333" text-anchor="middle">from virtual-terminal sequences</text>

  <rect x="596" y="396" width="188" height="64" rx="6" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="690" y="420" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Console client: shelf.exe</text>
  <text x="690" y="438" font-size="11" fill="#333333" text-anchor="middle">Console API or VT on its handles;</text>
  <text x="690" y="452" font-size="11" fill="#333333" text-anchor="middle">Ctrl+C is a console control event</text>

  <text x="690" y="490" font-size="11" fill="#333333" text-anchor="middle">No sessions or process groups:</text>
  <text x="690" y="506" font-size="11" fill="#333333" text-anchor="middle">a console is shared by every</text>
  <text x="690" y="522" font-size="11" fill="#333333" text-anchor="middle">process attached to it.</text>

  <line x1="690" y1="168" x2="690" y2="194" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
  <line x1="690" y1="262" x2="690" y2="288" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
  <line x1="690" y1="368" x2="690" y2="394" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrTs)"/>
</svg>
