<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Chatterbox architecture: web and mobile clients reach a reverse proxy over WebSocket, which balances two gateway instances; the gateways persist messages in PostgreSQL, fan out through Redis publish and subscribe and enqueue Web Push for offline members, while attachments go straight to object storage through pre-signed URLs</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Chatterbox components</text>
  <text x="430" y="44" font-size="10.5" fill="#555555" text-anchor="middle">solid arrows: request path, dashed arrows: asynchronous or out-of-band paths</text>

  <!-- arrows -->
  <line x1="190" y1="125" x2="240" y2="165" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="225" x2="240" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="165" x2="440" y2="115" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="195" x2="440" y2="225" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="95" x2="680" y2="95" stroke="#37474f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="620" y1="190" x2="680" y2="150" stroke="#37474f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="620" y1="235" x2="680" y2="245" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="260" x2="530" y2="330" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="620" y1="365" x2="680" y2="365" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <polyline points="760,395 760,462 105,462 105,262" fill="none" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="190" y1="245" x2="270" y2="340" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <!-- clients -->
  <rect x="20" y="85" width="170" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="110" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Web client</text>
  <text x="105" y="127" font-size="10" fill="#0d3c75" text-anchor="middle">TypeScript, outbox, lastSeq</text>
  <text x="105" y="141" font-size="10" fill="#0d3c75" text-anchor="middle">per room, service worker</text>
  <text x="105" y="155" font-size="10" fill="#0d3c75" text-anchor="middle">for Web Push</text>
  <rect x="20" y="185" width="170" height="75" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="210" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Second device</text>
  <text x="105" y="227" font-size="10" fill="#0d3c75" text-anchor="middle">same user, own socket,</text>
  <text x="105" y="241" font-size="10" fill="#0d3c75" text-anchor="middle">own lastSeq and session</text>

  <!-- edge -->
  <rect x="240" y="135" width="140" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="310" y="160" font-size="13" font-weight="bold" fill="#8a3200" text-anchor="middle">Reverse proxy</text>
  <text x="310" y="177" font-size="10" fill="#8a3200" text-anchor="middle">TLS, WebSocket upgrade,</text>
  <text x="310" y="191" font-size="10" fill="#8a3200" text-anchor="middle">idle timeout above the</text>
  <text x="310" y="205" font-size="10" fill="#8a3200" text-anchor="middle">heartbeat, sticky cookie</text>

  <!-- gateways -->
  <rect x="440" y="65" width="180" height="85" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="530" y="88" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Gateway 1</text>
  <text x="530" y="105" font-size="10" fill="#1b4d1f" text-anchor="middle">Socket.IO, hello, Origin and</text>
  <text x="530" y="119" font-size="10" fill="#1b4d1f" text-anchor="middle">ticket check, rate limit,</text>
  <text x="530" y="133" font-size="10" fill="#1b4d1f" text-anchor="middle">chat service in-process</text>
  <rect x="440" y="180" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="530" y="203" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Gateway 2</text>
  <text x="530" y="220" font-size="10" fill="#1b4d1f" text-anchor="middle">same code, own sockets,</text>
  <text x="530" y="234" font-size="10" fill="#1b4d1f" text-anchor="middle">subscribed to every room</text>
  <text x="530" y="248" font-size="10" fill="#1b4d1f" text-anchor="middle">that has a local member</text>

  <!-- stores -->
  <rect x="680" y="65" width="160" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="760" y="88" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">Redis</text>
  <text x="760" y="105" font-size="10" fill="#4a148c" text-anchor="middle">publish and subscribe fan-out,</text>
  <text x="760" y="119" font-size="10" fill="#4a148c" text-anchor="middle">presence keys with a TTL,</text>
  <text x="760" y="133" font-size="10" fill="#4a148c" text-anchor="middle">rate-limit buckets, push queue</text>
  <rect x="680" y="190" width="160" height="120" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="760" y="213" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">PostgreSQL</text>
  <text x="760" y="230" font-size="10" fill="#4a148c" text-anchor="middle">conversations (last_seq)</text>
  <text x="760" y="244" font-size="10" fill="#4a148c" text-anchor="middle">memberships (read_seq)</text>
  <text x="760" y="258" font-size="10" fill="#4a148c" text-anchor="middle">messages (room, seq)</text>
  <text x="760" y="272" font-size="10" fill="#4a148c" text-anchor="middle">room_events</text>
  <text x="760" y="286" font-size="10" fill="#4a148c" text-anchor="middle">acks (user, id)</text>

  <!-- push and storage -->
  <rect x="440" y="330" width="180" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="530" y="355" font-size="13" font-weight="bold" fill="#8a3200" text-anchor="middle">Push worker</text>
  <text x="530" y="372" font-size="10" fill="#8a3200" text-anchor="middle">Web Push with VAPID for</text>
  <text x="530" y="386" font-size="10" fill="#8a3200" text-anchor="middle">members who are offline</text>
  <rect x="680" y="335" width="160" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="760" y="360" font-size="12" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser push service</text>
  <text x="760" y="377" font-size="10" fill="#0d3c75" text-anchor="middle">run by the browser vendor</text>
  <rect x="240" y="340" width="150" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="315" y="365" font-size="13" font-weight="bold" fill="#8a3200" text-anchor="middle">Object storage</text>
  <text x="315" y="382" font-size="10" fill="#8a3200" text-anchor="middle">attachments, pre-signed</text>
  <text x="315" y="396" font-size="10" fill="#8a3200" text-anchor="middle">PUT and GET URLs</text>

  <!-- numbered steps -->
  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="215" cy="140" r="10" fill="#37474f"/><text x="215" y="144">1</text>
    <circle cx="650" cy="228" r="10" fill="#37474f"/><text x="650" y="232">2</text>
    <circle cx="650" cy="125" r="10" fill="#37474f"/><text x="650" y="129">3</text>
    <circle cx="410" cy="120" r="10" fill="#37474f"/><text x="410" y="124">4</text>
    <circle cx="530" cy="295" r="10" fill="#37474f"/><text x="530" y="299">5</text>
  </g>
  <text x="430" y="486" font-size="10" fill="#37474f" text-anchor="middle">1 WebSocket frame in, 2 persist in one transaction, 3 publish to Redis, 4 each gateway delivers to its sockets, 5 push for offline members</text>
</svg>
