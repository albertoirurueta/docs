<svg viewBox="0 0 720 576" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Pyramid request and response lifecycle hooks</title>
  <defs><marker id="prr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where request and response hooks run</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">left: what happens; right: the Pyramid hook that touches that step</text>
  <rect x="30" y="70" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="89" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Request factory builds the Request</text>
  <text x="250" y="106" font-size="10.5" fill="currentColor" text-anchor="middle">from the WSGI environ; extensions from add_request_method are applied</text>
  <line x1="470" y1="93.0" x2="500" y2="93.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="97.0" font-size="11.5" fill="currentColor">request_factory</text>
  <line x1="250" y1="116" x2="250" y2="131" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="132" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="151" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Tweens, NewRequest event, route and view lookup</text>
  <text x="250" y="168" font-size="10.5" fill="currentColor" text-anchor="middle">request.matchdict, matched_route, context and view_name are filled in</text>
  <line x1="470" y1="155.0" x2="500" y2="155.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="159.0" font-size="11.5" fill="currentColor">add_request_method / reify</text>
  <line x1="250" y1="178" x2="250" y2="193" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="194" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="213" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">View callable runs</text>
  <text x="250" y="230" font-size="10.5" fill="currentColor" text-anchor="middle">reads GET, POST, params, json_body, cookies; may register callbacks</text>
  <line x1="470" y1="217.0" x2="500" y2="217.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="221.0" font-size="11.5" fill="currentColor">request.add_response_callback</text>
  <line x1="250" y1="240" x2="250" y2="255" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="256" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="275" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response object is created</text>
  <text x="250" y="292" font-size="10.5" fill="currentColor" text-anchor="middle">returned by the view, or by a renderer from request.response</text>
  <line x1="470" y1="279.0" x2="500" y2="279.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="283.0" font-size="11.5" fill="currentColor">response_factory</text>
  <line x1="250" y1="302" x2="250" y2="317" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="318" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="337" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response callbacks run, in the order added</text>
  <text x="250" y="354" font-size="10.5" fill="currentColor" text-anchor="middle">skipped if an unhandled exception left no response</text>
  <line x1="470" y1="341.0" x2="500" y2="341.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="345.0" font-size="11.5" fill="currentColor">request.exception may be set</text>
  <line x1="250" y1="364" x2="250" y2="379" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="380" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="399" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">NewResponse event is sent</text>
  <text x="250" y="416" font-size="10.5" fill="currentColor" text-anchor="middle">subscribers see the final response object</text>
  <line x1="470" y1="403.0" x2="500" y2="403.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="407.0" font-size="11.5" fill="currentColor">pyramid.events.NewResponse</text>
  <line x1="250" y1="426" x2="250" y2="441" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="442" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="461" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Finished callbacks run, always</text>
  <text x="250" y="478" font-size="10.5" fill="currentColor" text-anchor="middle">even after an unhandled exception; mutations are pointless now</text>
  <line x1="470" y1="465.0" x2="500" y2="465.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="469.0" font-size="11.5" fill="currentColor">request.add_finished_callback</text>
  <line x1="250" y1="488" x2="250" y2="503" stroke="currentColor" stroke-width="1.5" marker-end="url(#prr-arrow)"/>
  <rect x="30" y="504" width="440" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="523" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">WSGI server iterates the response body</text>
  <text x="250" y="540" font-size="10.5" fill="currentColor" text-anchor="middle">headers and app_iter go to the client; a FileResponse streams here</text>
  <line x1="470" y1="527.0" x2="500" y2="527.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="506" y="531.0" font-size="11.5" fill="currentColor">wsgi.file_wrapper</text>
</svg>
