<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-bl-evo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How shaders reach resources: from sets to descriptor heaps</text>
<line x1="40" y1="130" x2="720" y2="130" stroke="#4B5563" stroke-width="2"/>
<text x="86" y="100" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">2016</text>
<circle cx="86" cy="130" r="6" fill="#4F46E5"/>
<rect x="20" y="155" width="132" height="92" rx="8" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
<text x="86.0" y="189.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Vulkan 1.0</text>
<text x="86.0" y="204.8" text-anchor="middle" font-size="11" fill="#374151">Descriptor sets,</text>
<text x="86.0" y="219.8" text-anchor="middle" font-size="11" fill="#374151">fixed counts</text>
<text x="232" y="100" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">2018 to 2020</text>
<circle cx="232" cy="130" r="6" fill="#4F46E5"/>
<rect x="166" y="155" width="132" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.0" y="189.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Indexing, BDA</text>
<text x="232.0" y="204.8" text-anchor="middle" font-size="11" fill="#3730A3">Core in 1.2 (2020):</text>
<text x="232.0" y="219.8" text-anchor="middle" font-size="11" fill="#3730A3">arrays, pointers</text>
<text x="378" y="100" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Jan 2022</text>
<circle cx="378" cy="130" r="6" fill="#4F46E5"/>
<rect x="312" y="155" width="132" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="378.0" y="189.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Vulkan 1.3</text>
<text x="378.0" y="204.8" text-anchor="middle" font-size="11" fill="#3730A3">BDA feature</text>
<text x="378.0" y="219.8" text-anchor="middle" font-size="11" fill="#3730A3">required</text>
<text x="524" y="100" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">2022</text>
<circle cx="524" cy="130" r="6" fill="#4F46E5"/>
<rect x="458" y="155" width="132" height="92" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="524.0" y="189.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Descriptor buffer</text>
<text x="524.0" y="204.8" text-anchor="middle" font-size="11" fill="#92400E">extension, EXT</text>
<text x="524.0" y="219.8" text-anchor="middle" font-size="11" fill="#92400E">descriptors as bytes</text>
<text x="670" y="100" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Jan 2026</text>
<circle cx="670" cy="130" r="6" fill="#4F46E5"/>
<rect x="604" y="155" width="132" height="92" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="670.0" y="189.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Descriptor heap</text>
<text x="670.0" y="204.8" text-anchor="middle" font-size="11" fill="#065F46">extension, EXT</text>
<text x="670.0" y="219.8" text-anchor="middle" font-size="11" fill="#065F46">heaps + push data</text>
<rect x="20" y="275" width="720" height="56" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="299.2" text-anchor="middle" font-size="12" fill="#374151">Sets remain valid in 2026 and are the portable baseline;</text>
<text x="380.0" y="315.2" text-anchor="middle" font-size="12" fill="#374151">heaps are an extension whose Khronos plan is a future KHR extension in a Roadmap milestone.</text>
</svg>
