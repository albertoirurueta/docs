<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="cz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="cza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="czw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="czg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Size of one 4 x 4 pixel block by texture format</text>
<text x="30" y="76" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">RGBA8 (raw)</text>
<rect x="180" y="60" width="384" height="22" rx="4" fill="#E5E7EB" stroke="#374151" stroke-width="1.2"/>
<text x="574" y="76" text-anchor="start" font-size="12" fill="#374151">64 B, 32 bpp</text>
<text x="30" y="112" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">BC7 / ASTC 4x4</text>
<rect x="180" y="96" width="96" height="22" rx="4" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.2"/>
<text x="286" y="112" text-anchor="start" font-size="12" fill="#374151">16 B, 8 bpp</text>
<text x="30" y="148" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">BC3 (DXT5)</text>
<rect x="180" y="132" width="96" height="22" rx="4" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.2"/>
<text x="286" y="148" text-anchor="start" font-size="12" fill="#374151">16 B, 8 bpp</text>
<text x="30" y="184" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">ETC2 RGB8</text>
<rect x="180" y="168" width="48" height="22" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="238" y="184" text-anchor="start" font-size="12" fill="#374151">8 B, 4 bpp</text>
<text x="30" y="220" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">BC1 (DXT1)</text>
<rect x="180" y="204" width="48" height="22" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="238" y="220" text-anchor="start" font-size="12" fill="#374151">8 B, 4 bpp</text>
<text x="30" y="256" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">ASTC 6x6</text>
<rect x="180" y="240" width="42.666666666666664" height="22" rx="4" fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"/>
<text x="232.66666666666666" y="256" text-anchor="start" font-size="12" fill="#374151">16 B per 36 px, 3.6 bpp</text>
<text x="30" y="292" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">ASTC 8x8</text>
<rect x="180" y="276" width="24.0" height="22" rx="4" fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"/>
<text x="214.0" y="292" text-anchor="start" font-size="12" fill="#374151">16 B per 64 px, 2 bpp</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Bar length is the bytes needed per 16 pixels. Block formats stay compressed in GPU memory and are decoded by the sampler.</text>
<text x="380" y="348" text-anchor="middle" font-size="11" fill="#374151">Desktop: BC1-BC7. Mobile: ETC2 and ASTC. KTX 2.0 with Basis Universal transcodes one file to whichever the device supports.</text>
</svg>
