<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="t">How a B2B buyer's price and product list are resolved</title>
  <desc id="d">A company location has two catalogs. The first has a publication and a price list with a 20 percent decrease and a fixed price. The second is pricing only with a 30 percent decrease. Visibility comes from the union of publications. The price is the lowest of the prices from the applicable price lists. A quantity rule then checks the quantity.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="700">Two catalogs on one company location (Pocket Coffee, Madrid)</text>

  <rect x="20" y="150" width="150" height="80" rx="8" fill="#5b8def" fill-opacity="0.18" stroke="#5b8def" stroke-width="1.8"/>
  <text x="95" y="182" font-size="13" font-weight="700" text-anchor="middle">CompanyLocation</text>
  <text x="95" y="202" font-size="11.5" text-anchor="middle" fill-opacity="0.85">Cafe Brasa Madrid</text>

  <!-- catalog A -->
  <rect x="230" y="50" width="250" height="130" rx="8" fill="#3aa57a" fill-opacity="0.14" stroke="#3aa57a" stroke-width="1.8"/>
  <text x="355" y="74" font-size="13" font-weight="700" text-anchor="middle">Catalog A: Wholesale beans 1 kg</text>
  <text x="250" y="102" font-size="11.5" fill-opacity="0.9">Publication: Colombia 1 kg, Brazil 1 kg</text>
  <text x="250" y="124" font-size="11.5" fill-opacity="0.9">Price list: 20% decrease</text>
  <text x="250" y="144" font-size="11.5" fill-opacity="0.9">Fixed price: Brazil 1 kg = 22.00</text>
  <text x="250" y="164" font-size="11.5" fill-opacity="0.9">Breaks and quantity rule on Colombia 1 kg</text>

  <!-- catalog B -->
  <rect x="230" y="220" width="250" height="100" rx="8" fill="#3aa57a" fill-opacity="0.14" stroke="#3aa57a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="355" y="244" font-size="13" font-weight="700" text-anchor="middle">Catalog B: Spring promotion</text>
  <text x="250" y="272" font-size="11.5" fill-opacity="0.9">Publication: none (pricing only)</text>
  <text x="250" y="294" font-size="11.5" fill-opacity="0.9">Price list: 30% decrease</text>

  <!-- results -->
  <rect x="540" y="60" width="200" height="100" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="640" y="84" font-size="13" font-weight="700" text-anchor="middle">Visible products</text>
  <text x="640" y="108" font-size="11.5" text-anchor="middle" fill-opacity="0.9">in at least one applicable</text>
  <text x="640" y="126" font-size="11.5" text-anchor="middle" fill-opacity="0.9">publication</text>
  <text x="640" y="146" font-size="11.5" text-anchor="middle" fill-opacity="0.9">Ethiopia 1 kg is hidden</text>

  <rect x="540" y="190" width="200" height="130" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="640" y="214" font-size="13" font-weight="700" text-anchor="middle">Price</text>
  <text x="640" y="238" font-size="11.5" text-anchor="middle" fill-opacity="0.9">lowest of the applicable</text>
  <text x="640" y="256" font-size="11.5" text-anchor="middle" fill-opacity="0.9">price lists</text>
  <text x="640" y="280" font-size="11.5" text-anchor="middle" fill-opacity="0.9">Colombia 1 kg x 12: 20.93</text>
  <text x="640" y="298" font-size="11.5" text-anchor="middle" fill-opacity="0.9">(catalog A gives 21.50)</text>

  <rect x="540" y="350" width="200" height="50" rx="8" fill="#e0902f" fill-opacity="0.16" stroke="#e0902f" stroke-width="1.8"/>
  <text x="640" y="372" font-size="13" font-weight="700" text-anchor="middle">Quantity rule</text>
  <text x="640" y="390" font-size="11.5" text-anchor="middle" fill-opacity="0.9">minimum 4, step 2, maximum 100</text>

  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M170,175 L230,120"/>
    <path d="M170,205 L230,260"/>
    <path d="M480,110 L540,110"/>
    <path d="M480,150 L540,230"/>
    <path d="M480,260 L540,260"/>
    <path d="M640,320 L640,350"/>
  </g>
</svg>
