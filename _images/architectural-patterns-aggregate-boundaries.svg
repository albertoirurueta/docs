<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Aggregate boundaries in the running e-commerce domain</text>

  <defs>
    <marker id="ab-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="ab-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
    <marker id="ab-arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7a3b8f"/>
    </marker>
  </defs>

  <!-- Order aggregate: core, center -->
  <rect x="290" y="185" width="200" height="105" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="390" y="208" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order (root)</text>
  <text x="390" y="226" font-size="10" fill="#333333" text-anchor="middle">OrderLine (value object)</text>
  <text x="390" y="240" font-size="10" fill="#333333" text-anchor="middle">OrderId, OrderStatus</text>
  <text x="390" y="254" font-size="10" fill="#333333" text-anchor="middle">version (optimistic lock)</text>
  <text x="390" y="272" font-size="9" fill="#666666" text-anchor="middle">Order bounded context</text>

  <!-- InventoryItem aggregate: top right -->
  <rect x="550" y="38" width="200" height="92" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="650" y="61" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">InventoryItem (root)</text>
  <text x="650" y="79" font-size="10" fill="#333333" text-anchor="middle">InventoryItemId, ProductId</text>
  <text x="650" y="93" font-size="10" fill="#333333" text-anchor="middle">quantityOnHand, quantityReserved</text>
  <text x="650" y="111" font-size="9" fill="#666666" text-anchor="middle">Inventory bounded context</text>

  <!-- Payment aggregate: right -->
  <rect x="570" y="205" width="200" height="92" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="670" y="228" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Payment (root)</text>
  <text x="670" y="246" font-size="10" fill="#333333" text-anchor="middle">PaymentId, Money</text>
  <text x="670" y="260" font-size="10" fill="#333333" text-anchor="middle">OrderId (reference)</text>
  <text x="670" y="278" font-size="9" fill="#666666" text-anchor="middle">Payment bounded context</text>

  <!-- Shipment aggregate: bottom right -->
  <rect x="550" y="352" width="200" height="92" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="650" y="375" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Shipment (root)</text>
  <text x="650" y="393" font-size="10" fill="#333333" text-anchor="middle">ShipmentId, Address</text>
  <text x="650" y="407" font-size="10" fill="#333333" text-anchor="middle">OrderId (reference)</text>
  <text x="650" y="425" font-size="9" fill="#666666" text-anchor="middle">Shipping bounded context</text>

  <!-- Customer: generic subdomain, not implemented, bottom left -->
  <rect x="40" y="352" width="205" height="92" rx="8" fill="#f5f5f5" stroke="#7a3b8f" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="142" y="375" font-size="13" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Customer (root)</text>
  <text x="142" y="393" font-size="10" fill="#333333" text-anchor="middle">generic subdomain -- not implemented</text>
  <text x="142" y="407" font-size="10" fill="#333333" text-anchor="middle">referenced only by CustomerId</text>
  <text x="142" y="425" font-size="9" fill="#666666" text-anchor="middle">Customer bounded context</text>

  <!-- identity references, dashed, never object references -->
  <line x1="470" y1="195" x2="558" y2="128" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ab-arrow-blue)"/>
  <text x="545" y="160" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(-40 545 160)">ProductId</text>

  <line x1="568" y1="251" x2="492" y2="245" stroke="#2d6a34" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ab-arrow-green)"/>
  <text x="530" y="238" font-size="9.5" fill="#2d6a34" text-anchor="middle">OrderId</text>

  <line x1="560" y1="360" x2="465" y2="284" stroke="#2d6a34" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ab-arrow-green)"/>
  <text x="540" y="330" font-size="9.5" fill="#2d6a34" text-anchor="middle" transform="rotate(38 540 330)">OrderId</text>

  <line x1="300" y1="284" x2="247" y2="358" stroke="#7a3b8f" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ab-arrow-purple)"/>
  <text x="245" y="325" font-size="9.5" fill="#7a3b8f" text-anchor="middle" transform="rotate(58 245 325)">CustomerId</text>

  <text x="390" y="458" font-size="10.5" fill="#444444" text-anchor="middle">Every arrow crosses an aggregate boundary as a plain identifier value, never as a live object</text>
  <text x="390" y="472" font-size="10.5" fill="#444444" text-anchor="middle">reference -- Order holds ProductId/CustomerId, Payment and Shipment each hold the OrderId they act on.</text>
</svg>
