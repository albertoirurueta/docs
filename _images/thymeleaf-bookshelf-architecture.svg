<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf application: from the browser to the database and back</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">Spring Boot 4.1 with Spring MVC, Thymeleaf 3.1, Spring Data JPA and optional htmx partial requests</text>

  <!-- browser -->
  <rect x="20" y="90" width="150" height="130" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="95" y="116" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="95" y="140" font-size="11" fill="#444444" text-anchor="middle">full page requests</text>
  <text x="95" y="158" font-size="11" fill="#444444" text-anchor="middle">forms (POST, redirect, GET)</text>
  <text x="95" y="176" font-size="11" fill="#444444" text-anchor="middle">htmx partial requests</text>
  <text x="95" y="194" font-size="11" fill="#444444" text-anchor="middle">Alpine.js, Tailwind CSS</text>

  <!-- security filter -->
  <rect x="215" y="90" width="130" height="130" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.6"/>
  <text x="280" y="116" font-size="13" font-weight="bold" fill="#5a1a1a" text-anchor="middle">Security filters</text>
  <text x="280" y="140" font-size="11" fill="#8c2b2b" text-anchor="middle">form login</text>
  <text x="280" y="158" font-size="11" fill="#8c2b2b" text-anchor="middle">CSRF token</text>
  <text x="280" y="176" font-size="11" fill="#8c2b2b" text-anchor="middle">READER, LIBRARIAN</text>

  <!-- controller -->
  <rect x="390" y="90" width="150" height="130" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="465" y="116" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Spring MVC controller</text>
  <text x="465" y="140" font-size="11" fill="#2b4c8c" text-anchor="middle">binds and validates input</text>
  <text x="465" y="158" font-size="11" fill="#2b4c8c" text-anchor="middle">fills the Model</text>
  <text x="465" y="176" font-size="11" fill="#2b4c8c" text-anchor="middle">returns a view name or</text>
  <text x="465" y="194" font-size="11" fill="#2b4c8c" text-anchor="middle">a fragment name</text>

  <!-- service -->
  <rect x="585" y="90" width="130" height="60" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="650" y="116" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Service</text>
  <text x="650" y="134" font-size="11" fill="#2b4c8c" text-anchor="middle">rules, transactions</text>

  <!-- repository -->
  <rect x="585" y="170" width="130" height="50" fill="#e8f0fe" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="650" y="192" font-size="13" font-weight="bold" fill="#1a2f5a" text-anchor="middle">Repository</text>
  <text x="650" y="208" font-size="11" fill="#2b4c8c" text-anchor="middle">Spring Data JPA</text>

  <!-- database -->
  <rect x="760" y="130" width="120" height="70" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="820" y="160" font-size="13" font-weight="bold" fill="#5c4600" text-anchor="middle">Database</text>
  <text x="820" y="178" font-size="11" fill="#8a6a00" text-anchor="middle">books, authors, reviews</text>

  <!-- Thymeleaf -->
  <rect x="215" y="290" width="325" height="130" fill="#e6f4ea" stroke="#2b6c3c" stroke-width="1.6"/>
  <text x="377" y="316" font-size="14" font-weight="bold" fill="#1a4a28" text-anchor="middle">Thymeleaf view layer</text>
  <text x="377" y="340" font-size="11" fill="#2b6c3c" text-anchor="middle">templates/layout, fragments, books, authors, reviews, error, mail</text>
  <text x="377" y="358" font-size="11" fill="#2b6c3c" text-anchor="middle">Standard expressions, th:* attributes, Layout Dialect</text>
  <text x="377" y="376" font-size="11" fill="#2b6c3c" text-anchor="middle">sec:* attributes, messages for English and Spanish</text>
  <text x="377" y="394" font-size="11" fill="#2b6c3c" text-anchor="middle">whole page, or one fragment for htmx</text>

  <!-- static -->
  <rect x="590" y="310" width="150" height="90" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="665" y="336" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Static resources</text>
  <text x="665" y="358" font-size="11" fill="#444444" text-anchor="middle">CSS built by Tailwind</text>
  <text x="665" y="376" font-size="11" fill="#444444" text-anchor="middle">htmx, Alpine.js, images</text>

  <!-- arrows request path -->
  <line x1="170" y1="130" x2="213" y2="130" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="345" y1="130" x2="388" y2="130" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="120" x2="583" y2="120" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="650" y1="150" x2="650" y2="168" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="715" y1="195" x2="758" y2="175" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- controller to view -->
  <line x1="465" y1="220" x2="400" y2="288" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="262" font-size="11" fill="#444444">model + view name</text>
  <!-- view to browser -->
  <path d="M 215 355 L 95 355 L 95 222" fill="none" stroke="#2b6c3c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="100" y="342" font-size="11" fill="#2b6c3c">HTML response</text>

  <text x="450" y="446" font-size="11" fill="#666666" text-anchor="middle">Solid arrows: the request path. Dashed arrow: the rendered HTML (a whole page, or a single fragment for htmx) returned to the browser.</text>
</svg>
