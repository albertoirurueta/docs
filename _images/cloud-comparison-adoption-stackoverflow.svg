<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 507" width="860" height="507" role="img" aria-labelledby="adoption-stackoverflow-t adoption-stackoverflow-d">
<title id="adoption-stackoverflow-t">Stack Overflow Developer Survey: cloud platform used (all respondents)</title>
<desc id="adoption-stackoverflow-d">Share of all respondents of the Stack Overflow Developer Survey who used each cloud platform, per survey year (data as of 2026-10-26). Other surveys measure other populations and are shown in separate figures; they are never put on this axis.</desc>
