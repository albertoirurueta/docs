<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Annotated layout of the WordPress 7.1 post editor</title>
  <desc id="d">Schematic of the block editor while editing a Lumen Press post. The top toolbar holds, from left to right, the back-to-posts button, the block inserter, undo and redo, the Document Overview toggle, the document bar that opens the Command Palette, then Save draft, View, Publish, the Settings toggle and the Options menu. On the left the Document Overview panel shows the List View and Outline tabs. The centre canvas, an iframe, shows the post title and blocks; the selected paragraph carries a floating block toolbar with the parent selector, the block type and transform button, the drag handle, move arrows, alignment, formatting controls and the More options menu, plus a note indicator. An inline inserter sits between blocks and a slash command is being typed in an empty paragraph. On the right the settings sidebar has a Post tab and a Block tab with Settings and Styles sub-tabs. A legend explains each numbered marker.</desc>
  <rect width="760" height="600" rx="12" fill="#2b3a4a"/>

  <!-- editor frame -->
  <rect x="20" y="20" width="720" height="400" rx="8" fill="#f4f6f8"/>

  <!-- top toolbar -->
  <rect x="20" y="20" width="720" height="44" rx="8" fill="#ffffff" stroke="#c3ccd6"/>
  <g font-size="12" fill="#1b2733">
    <rect x="28" y="28" width="28" height="28" rx="4" fill="#1b2733"/>
    <text x="36" y="47" fill="#ffffff" font-weight="bold">&#8592;</text>
    <rect x="62" y="30" width="24" height="24" rx="4" fill="#3858e9"/>
    <text x="69" y="47" fill="#ffffff" font-weight="bold" font-size="16">+</text>
    <text x="94" y="47" font-size="14">&#8630; &#8631;</text>
    <rect x="132" y="32" width="20" height="20" rx="3" fill="#dfe5ec"/>
    <text x="136" y="46" font-size="11">&#8801;</text>
    <rect x="248" y="30" width="230" height="24" rx="4" fill="#eef1f5" stroke="#c3ccd6"/>
    <text x="262" y="46">Announcing The Lighthouse Ledger  &#8984;K</text>
    <text x="520" y="47">Save draft</text>
    <text x="588" y="47">View</text>
    <rect x="622" y="30" width="58" height="24" rx="4" fill="#3858e9"/>
    <text x="630" y="47" fill="#ffffff" font-weight="bold">Publish</text>
    <rect x="686" y="32" width="20" height="20" rx="3" fill="#1b2733"/>
    <rect x="699" y="34" width="5" height="16" fill="#ffffff"/>
    <text x="714" y="47" font-size="14" font-weight="bold">&#8942;</text>
  </g>

  <!-- left: Document Overview -->
  <rect x="20" y="64" width="160" height="356" fill="#ffffff" stroke="#c3ccd6"/>
  <g font-size="12" fill="#1b2733">
    <text x="30" y="86" font-weight="bold">List View</text>
    <text x="104" y="86" fill="#5b6b7b">Outline</text>
    <rect x="30" y="91" width="58" height="2" fill="#3858e9"/>
    <text x="30" y="114">&#182; Paragraph</text>
    <text x="30" y="134">H Heading</text>
    <rect x="26" y="141" width="148" height="20" rx="3" fill="#dbe4ff"/>
    <text x="30" y="155">&#182; Paragraph</text>
    <text x="30" y="176">&#8220; Quote</text>
    <text x="42" y="195" fill="#5b6b7b">&#182; Paragraph</text>
    <text x="30" y="214">&#8226; List</text>
    <text x="30" y="233">&#9776; Accordion</text>
    <text x="30" y="252">&#182; Paragraph</text>
    <text x="150" y="252" fill="#5b6b7b">&#9677;</text>
    <text x="30" y="271">&#9645; Buttons</text>
    <text x="30" y="300" fill="#7a2fa8">&#9671; Bookshop CTA</text>
    <text x="30" y="316" font-size="10" fill="#7a2fa8">(synced pattern)</text>
  </g>

  <!-- centre canvas (iframe) -->
  <rect x="190" y="74" width="380" height="336" rx="4" fill="#ffffff" stroke="#9aa8b6" stroke-dasharray="5 3"/>
  <text x="474" y="404" font-size="10" fill="#5b6b7b">canvas = iframe (7.1)</text>
  <g font-size="12" fill="#1b2733">
    <text x="210" y="112" font-size="18" font-weight="bold">Announcing The Lighthouse</text>
    <text x="210" y="134" font-size="18" font-weight="bold">Ledger</text>
    <text x="210" y="160">Lumen Press is proud to announce The</text>
    <text x="210" y="176">Lighthouse Ledger, the first title in ...</text>
    <text x="210" y="204" font-size="14" font-weight="bold">About the book</text>

    <!-- floating block toolbar -->
    <rect x="206" y="214" width="300" height="30" rx="4" fill="#ffffff" stroke="#1b2733"/>
    <text x="214" y="234">&#8593;&#8598;</text>
    <rect x="236" y="218" width="1" height="22" fill="#c3ccd6"/>
    <text x="244" y="234">&#182;</text>
    <text x="260" y="234" fill="#5b6b7b">&#8942;&#8942;</text>
    <text x="280" y="234">&#8963;&#8964;</text>
    <rect x="304" y="218" width="1" height="22" fill="#c3ccd6"/>
    <text x="312" y="234">&#8801;</text>
    <rect x="330" y="218" width="1" height="22" fill="#c3ccd6"/>
    <text x="338" y="234" font-weight="bold">B</text>
    <text x="354" y="234" font-style="italic">I</text>
    <text x="368" y="234">&#128279;&#xFE0E;</text>
    <text x="388" y="234">&#9662;</text>
    <rect x="404" y="218" width="1" height="22" fill="#c3ccd6"/>
    <circle cx="424" cy="229" r="9" fill="#e9a23b"/>
    <text x="419" y="233" font-size="10" fill="#1b2733" font-weight="bold">M</text>
    <rect x="442" y="218" width="1" height="22" fill="#c3ccd6"/>
    <text x="482" y="235" font-weight="bold" font-size="14">&#8942;</text>

    <!-- selected block -->
    <rect x="204" y="248" width="352" height="40" fill="none" stroke="#3858e9" stroke-width="2"/>
    <text x="210" y="264">A retired harbour pilot finds a ledger</text>
    <text x="210" y="280">that should not exist. Read the catalogue ...</text>

    <!-- inline inserter between blocks -->
    <rect x="204" y="300" width="352" height="2" fill="#3858e9"/>
    <circle cx="380" cy="301" r="9" fill="#1b2733"/>
    <text x="375" y="306" fill="#ffffff" font-weight="bold" font-size="14">+</text>

    <!-- slash command -->
    <text x="210" y="330" fill="#1b2733">/acc</text>
    <rect x="210" y="338" width="170" height="54" rx="4" fill="#ffffff" stroke="#c3ccd6"/>
    <rect x="212" y="340" width="166" height="18" rx="3" fill="#dbe4ff"/>
    <text x="218" y="353">&#9776; Accordion</text>
    <text x="218" y="372" fill="#5b6b7b">&#9776; Accordion Item</text>
    <text x="218" y="388" fill="#5b6b7b">&#8230;</text>
  </g>

  <!-- right: settings sidebar -->
  <rect x="580" y="64" width="160" height="356" fill="#ffffff" stroke="#c3ccd6"/>
  <g font-size="12" fill="#1b2733">
    <text x="592" y="86" fill="#5b6b7b">Post</text>
    <text x="640" y="86" font-weight="bold">Block</text>
    <rect x="636" y="91" width="40" height="2" fill="#3858e9"/>
    <text x="592" y="112" font-weight="bold">&#182; Paragraph</text>
    <text x="592" y="130" font-size="10" fill="#5b6b7b">Start with the basic building</text>
    <text x="592" y="143" font-size="10" fill="#5b6b7b">block of all narrative.</text>
    <rect x="590" y="152" width="140" height="22" rx="4" fill="#eef1f5"/>
    <text x="600" y="167" font-weight="bold">Settings</text>
    <text x="664" y="167" fill="#5b6b7b">Styles</text>
    <text x="592" y="196">Typography</text>
    <text x="592" y="218">Color</text>
    <text x="592" y="240">Dimensions</text>
    <text x="592" y="262">Advanced</text>
    <text x="602" y="280" font-size="10" fill="#5b6b7b">HTML anchor, CSS class</text>
    <text x="602" y="294" font-size="10" fill="#5b6b7b">Custom CSS (7.0)</text>
    <rect x="590" y="306" width="140" height="1" fill="#c3ccd6"/>
    <text x="592" y="326" font-size="11" fill="#5b6b7b">Post tab: Status, Publish,</text>
    <text x="592" y="341" font-size="11" fill="#5b6b7b">Revisions, Template,</text>
    <text x="592" y="356" font-size="11" fill="#5b6b7b">Categories, Tags, Excerpt,</text>
    <text x="592" y="371" font-size="11" fill="#5b6b7b">Featured image, Discussion</text>
  </g>

  <!-- numbered markers -->
  <g font-size="11" font-weight="bold" fill="#ffffff">
    <circle cx="74" cy="16" r="10" fill="#d9534f"/><text x="71" y="20">1</text>
    <circle cx="142" cy="16" r="10" fill="#d9534f"/><text x="139" y="20">2</text>
    <circle cx="362" cy="16" r="10" fill="#d9534f"/><text x="359" y="20">3</text>
    <circle cx="650" cy="16" r="10" fill="#d9534f"/><text x="647" y="20">4</text>
    <circle cx="164" cy="114" r="10" fill="#d9534f"/><text x="161" y="118">5</text>
    <circle cx="196" cy="229" r="10" fill="#d9534f"/><text x="193" y="233">6</text>
    <circle cx="548" cy="268" r="10" fill="#d9534f"/><text x="545" y="272">7</text>
    <circle cx="400" cy="301" r="10" fill="#d9534f"/><text x="397" y="305">8</text>
    <circle cx="200" cy="326" r="10" fill="#d9534f"/><text x="197" y="330">9</text>
    <circle cx="722" cy="84" r="10" fill="#d9534f"/><text x="715" y="88">10</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#ffffff">
    <text x="24" y="446" font-weight="bold">Legend</text>
    <text x="24" y="468">1  Block inserter: Blocks, Patterns and Media tabs</text>
    <text x="24" y="488">2  Document Overview toggle (List View and Outline)</text>
    <text x="24" y="508">3  Document bar: title, opens the Command Palette (Ctrl/Cmd+K)</text>
    <text x="24" y="528">4  Save draft, View, Publish, Settings, Options menu</text>
    <text x="24" y="548">5  List View: hierarchy, drag to reorder, hidden and locked icons</text>
    <text x="400" y="468">6  Block toolbar: parent, transform, drag, move,</text>
    <text x="418" y="484">align, format, note (M = avatar), More options</text>
    <text x="400" y="504">7  Selected block (blue outline)</text>
    <text x="400" y="524">8  Inline inserter between blocks</text>
    <text x="400" y="544">9  Slash command in an empty paragraph</text>
    <text x="400" y="564">10 Settings sidebar: Post tab and Block tab</text>
    <text x="24" y="580" font-size="11" fill="#cfd8e3">Schematic drawing, not a screenshot; icons are simplified.</text>
  </g>
</svg>
