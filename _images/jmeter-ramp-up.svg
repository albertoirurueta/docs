<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12" fill="currentColor">
<title id="t">Active threads of a Thread Group over time</title>
<desc id="d">Chart of active threads against time for a Thread Group with 50 threads, a 20 second startup delay, a 60 second ramp-up and a 660 second duration. No thread runs during the startup delay; threads then start one every 1.2 seconds until all 50 are active at about 79 seconds; the level holds until the duration ends at 680 seconds, when each thread stops after its current sample. A dashed alternative shows a run ended by the loop count instead, where threads finish one by one. A zoomed inset shows the first threads starting as steps, the first one immediately.</desc>
