<text x="460" y="396" font-size="13" font-weight="bold">Ramp-up maths</text>
<text x="460" y="416" font-size="11">delay between starts = ramp-up / threads</text>
<text x="474" y="431" font-size="11">= 60 s / 50 = 1.2 s</text>
<text x="460" y="446" font-size="11">thread k starts at (k − 1) × 1.2 s</text>
<text x="474" y="461" font-size="11">thread 1 at 0 s, thread 50 at 58.8 s</text>
<text x="460" y="476" font-size="11">start rate = threads / ramp-up</text>
<text x="474" y="491" font-size="11">= 50 / 60 ≈ 0.83 threads per second</text>
<text x="460" y="506" font-size="11">duration counts from the end of the delay,</text>
<text x="474" y="521" font-size="11">so it includes the ramp-up</text>
</svg>
