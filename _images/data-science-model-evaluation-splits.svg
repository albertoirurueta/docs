<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Hold-out split and 5-fold cross-validation</title>
  <desc id="d1">Top: one data set cut into training, validation and test parts. Bottom: a final test set is kept aside while the remaining data is divided into five folds, each used once for validation.</desc>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Splitting data for evaluation</text>

  <text x="24" y="68" font-size="14" font-weight="bold" fill="#0F172A">A. Hold-out: one split</text>
  <rect x="24" y="80" width="400" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <rect x="424" y="80" width="136" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="560" y="80" width="136" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="224" y="105" font-size="14" text-anchor="middle" fill="#0F172A">train: fit the model</text>
  <text x="492" y="105" font-size="14" text-anchor="middle" fill="#0F172A">validation: tune</text>
  <text x="628" y="105" font-size="14" text-anchor="middle" fill="#0F172A">test: report once</text>

  <text x="24" y="162" font-size="14" font-weight="bold" fill="#0F172A">B. 5-fold cross-validation on the development data, test set kept aside</text>
  <g font-size="12" fill="#475569">
    <text x="24" y="194">split 1</text><text x="24" y="226">split 2</text><text x="24" y="258">split 3</text><text x="24" y="290">split 4</text><text x="24" y="322">split 5</text>
  </g>
  <g stroke-width="2">
    <!-- row 1 -->
    <rect x="80" y="178" width="96" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <rect x="176" y="178" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="272" y="178" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="368" y="178" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="464" y="178" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <!-- row 2 -->
    <rect x="80" y="210" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="176" y="210" width="96" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <rect x="272" y="210" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="368" y="210" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="464" y="210" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <!-- row 3 -->
    <rect x="80" y="242" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="176" y="242" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="272" y="242" width="96" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <rect x="368" y="242" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="464" y="242" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <!-- row 4 -->
    <rect x="80" y="274" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="176" y="274" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="272" y="274" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="368" y="274" width="96" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <rect x="464" y="274" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <!-- row 5 -->
    <rect x="80" y="306" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="176" y="306" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="272" y="306" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="368" y="306" width="96" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="464" y="306" width="96" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <!-- test column -->
    <rect x="576" y="178" width="120" height="152" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <text x="636" y="250" font-size="14" text-anchor="middle" fill="#0F172A">test set</text>
  <text x="636" y="270" font-size="12" text-anchor="middle" fill="#475569">untouched</text>
  <rect x="80" y="338" width="14" height="12" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="100" y="349" font-size="12" fill="#475569">train fold</text>
  <rect x="180" y="338" width="14" height="12" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="200" y="349" font-size="12" fill="#475569">validation fold (scored once per split)</text>
</svg>
