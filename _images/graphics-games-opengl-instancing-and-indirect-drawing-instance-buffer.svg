<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-inst-buf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Instanced attributes: one buffer per vertex, one buffer per instance</text>
<text x="20" y="58" font-size="13" font-weight="bold" fill="#3730A3">Binding 0: mesh (divisor 0, advances per vertex)</text>
<rect x="20" y="68" width="720" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="30" y="78" width="160" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5"/><text x="110" y="98" font-size="11" fill="#374151" text-anchor="middle">vertex 0: pos, normal</text>
<rect x="196" y="78" width="160" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5"/><text x="276" y="98" font-size="11" fill="#374151" text-anchor="middle">vertex 1: pos, normal</text>
<rect x="362" y="78" width="160" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5"/><text x="442" y="98" font-size="11" fill="#374151" text-anchor="middle">vertex 2: pos, normal</text>
<text x="640" y="98" font-size="11" fill="#374151" text-anchor="middle">... same for all instances</text>
<text x="20" y="152" font-size="13" font-weight="bold" fill="#047857">Binding 1: instance data (divisor 1, advances per instance)</text>
<rect x="20" y="162" width="720" height="104" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<g font-size="11" fill="#374151" text-anchor="middle">
<rect x="30" y="172" width="52" height="38" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="56" y="188">col 0</text><text x="56" y="202">loc 2</text>
<rect x="86" y="172" width="52" height="38" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="112" y="188">col 1</text><text x="112" y="202">loc 3</text>
<rect x="142" y="172" width="52" height="38" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="168" y="188">col 2</text><text x="168" y="202">loc 4</text>
<rect x="198" y="172" width="52" height="38" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="224" y="188">col 3</text><text x="224" y="202">loc 5</text>
<rect x="254" y="172" width="52" height="38" rx="5" fill="#FEF3C7" stroke="#B45309"/><text x="280" y="188">colour</text><text x="280" y="202">loc 6</text>
<text x="168" y="228">instance 0 (80 bytes: mat4 + vec4)</text>
<rect x="320" y="172" width="276" height="38" rx="5" fill="#FFFFFF" stroke="#047857" stroke-dasharray="4 3"/><text x="458" y="196">instance 1 (same layout)</text>
<rect x="604" y="172" width="126" height="38" rx="5" fill="#FFFFFF" stroke="#047857" stroke-dasharray="4 3"/><text x="667" y="196">instance 2 ...</text>
</g>
<text x="380" y="252" font-size="11" fill="#374151" text-anchor="middle">stride 80 bytes: offsets 0, 16, 32, 48 for the matrix columns and 64 for the colour</text>
<rect x="20" y="288" width="350" height="124" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="310" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Setup (direct state access)</text>
<text x="195" y="332" font-size="11" fill="#374151" text-anchor="middle">glVertexArrayVertexBuffer(vao, 1, instBuf, 0, 80)</text>
<text x="195" y="350" font-size="11" fill="#374151" text-anchor="middle">glVertexArrayBindingDivisor(vao, 1, 1)</text>
<text x="195" y="368" font-size="11" fill="#374151" text-anchor="middle">glVertexArrayAttribBinding(vao, loc, 1) for loc 2..6</text>
<text x="195" y="386" font-size="11" fill="#374151" text-anchor="middle">glVertexArrayAttribFormat(vao, 2 + i, 4, GL_FLOAT, ...)</text>
<rect x="390" y="288" width="350" height="124" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="310" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Which instance is fetched</text>
<text x="565" y="334" font-size="11" fill="#374151" text-anchor="middle">fetch index = baseInstance + floor(instance / divisor)</text>
<text x="565" y="354" font-size="11" fill="#374151" text-anchor="middle">gl_InstanceID counts 0, 1, 2 ... without baseInstance</text>
<text x="565" y="374" font-size="11" fill="#374151" text-anchor="middle">gl_BaseInstance supplies the offset (GLSL 4.60)</text>
<text x="565" y="394" font-size="11" fill="#374151" text-anchor="middle">a mat4 attribute is four vec4 attributes</text>
</svg>
