<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The Universal Journal table ACDOCA, the tables it kept beside it and the tables it absorbed</title>
  <desc id="d">The journal entry header table BKPF and the table BSEG stay in SAP S/4HANA: BKPF holds one header per journal entry and BSEG holds the source documents and the open item entries. The line item table ACDOCA holds the lines of every journal entry for all ledgers, with the G/L account, the Controlling account assignments and up to ten currency fields in one row. Greyed out on the right are the tables whose entries are now completely contained in ACDOCA: FAGLFLEXA and FAGLFLEXT of new General Ledger Accounting, the actual data of the Controlling tables COEP, COSS and COSP, the Material Ledger table MLIT and the Asset Accounting table ANEP. The released CDS view I_JournalEntryItem reads ACDOCA, and the coding block structure CI_COBL extends it with custom fields.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="50" width="270" height="100" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="85" text-anchor="middle" font-size="15" font-weight="bold">BKPF</text>
  <text x="155" y="105" text-anchor="middle" font-size="13">journal entry header</text>
  <text x="155" y="125" text-anchor="middle" font-size="13">one per journal entry</text>
  <rect x="20" y="210" width="270" height="110" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="250" text-anchor="middle" font-size="15" font-weight="bold">BSEG</text>
  <text x="155" y="270" text-anchor="middle" font-size="13">source documents and</text>
  <text x="155" y="290" text-anchor="middle" font-size="13">open item entries</text>
  <line x1="155" y1="210" x2="155" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="167" y="186" text-anchor="start" font-size="12">1 : n</text>
  <text x="20" y="340" text-anchor="start" font-size="12">Both tables stay in SAP S/4HANA.</text>
  <rect x="370" y="50" width="340" height="270" rx="10" fill="#7873f5" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="99.5" text-anchor="middle" font-size="18" font-weight="bold">ACDOCA</text>
  <text x="540" y="122.5" text-anchor="middle" font-size="16">Universal Journal: one row per</text>
  <text x="540" y="145.5" text-anchor="middle" font-size="16">journal entry line, all ledgers</text>
  <text x="540" y="168.5" text-anchor="middle" font-size="16"></text>
  <text x="540" y="191.5" text-anchor="middle" font-size="16">key fields run from RCLNT to DOCLN</text>
  <text x="540" y="214.5" text-anchor="middle" font-size="16">ledger, company code, G/L account,</text>
  <text x="540" y="237.5" text-anchor="middle" font-size="16">cost center, profit center, segment</text>
  <text x="540" y="260.5" text-anchor="middle" font-size="16">in one row, with no FI and CO split</text>
  <text x="540" y="283.5" text-anchor="middle" font-size="16">up to 10 currency fields: EUR, GBP, ...</text>
  <line x1="290" y1="100" x2="370" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="94" text-anchor="start" font-size="11">header of</text>
  <line x1="290" y1="265" x2="370" y2="255" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="298" y="296" text-anchor="start" font-size="11">basis for</text>
  <text x="790" y="40" text-anchor="start" font-size="13" font-weight="bold">Absorbed: now completely in ACDOCA</text>
  <rect x="790" y="52" width="270" height="62" rx="10" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="925" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill-opacity="0.65">FAGLFLEXA, FAGLFLEXT</text>
  <text x="925" y="98" text-anchor="middle" font-size="11" fill-opacity="0.65">new General Ledger Accounting</text>
  <rect x="790" y="130" width="270" height="62" rx="10" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="925" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill-opacity="0.65">COEP, COSS, COSP</text>
  <text x="925" y="176" text-anchor="middle" font-size="11" fill-opacity="0.65">Controlling actual data</text>
  <rect x="790" y="208" width="270" height="62" rx="10" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="925" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill-opacity="0.65">MLIT</text>
  <text x="925" y="254" text-anchor="middle" font-size="11" fill-opacity="0.65">Material Ledger</text>
  <rect x="790" y="286" width="270" height="62" rx="10" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="925" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill-opacity="0.65">ANEP</text>
  <text x="925" y="332" text-anchor="middle" font-size="11" fill-opacity="0.65">Asset Accounting line items</text>
  <line x1="790" y1="83" x2="710" y2="185" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="790" y1="161" x2="710" y2="185" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="790" y1="239" x2="710" y2="185" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="790" y1="317" x2="710" y2="185" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="790" y="374" text-anchor="start" font-size="11">Statistical postings and target data stay in</text>
  <text x="790" y="388" text-anchor="start" font-size="11">COEP, COSS and COSP. The list is not exhaustive.</text>
  <line x1="450" y1="320" x2="450" y2="420" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="462" y="376" text-anchor="start" font-size="11">is read by</text>
  <rect x="300" y="420" width="300" height="80" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="450" y="445.5" text-anchor="middle" font-size="14" font-weight="bold">I_JournalEntryItem</text>
  <text x="450" y="464.5" text-anchor="middle" font-size="12">released CDS view (cube)</text>
  <text x="450" y="483.5" text-anchor="middle" font-size="12">on ACDOCA, for apps and reports</text>
  <line x1="640" y1="420" x2="640" y2="320" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="652" y="376" text-anchor="start" font-size="11">extends</text>
  <rect x="640" y="420" width="420" height="80" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="850" y="445.5" text-anchor="middle" font-size="14" font-weight="bold">CI_COBL coding block, OXK3</text>
  <text x="850" y="464.5" text-anchor="middle" font-size="12">custom fields in journal entries;</text>
  <text x="850" y="483.5" text-anchor="middle" font-size="12">also the Custom Fields app for key users</text>
  <text x="540" y="560" text-anchor="middle" font-size="12">The currencies EUR and GBP and the ledgers of company code EX01 are the running example of this site.</text>
</svg>
