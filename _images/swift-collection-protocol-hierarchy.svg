<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>The Swift collection protocol hierarchy: Sequence refined by Collection, refined by BidirectionalCollection, refined by RandomAccessCollection, MutableCollection and RangeReplaceableCollection, with Array, Set, Dictionary, Range and ArraySlice placed at the protocols they conform to.</title>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>

  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Sequence / Collection protocol hierarchy</text>
  <text x="410" y="44" font-size="11" fill="#666666" text-anchor="middle">each arrow means "refines" -- a conformer to the lower protocol gets every algorithm written against the ones above it</text>

  <!-- connectors first so boxes sit on top -->
  <g stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="410" y1="90" x2="410" y2="130"/>
    <line x1="410" y1="160" x2="410" y2="200"/>
    <line x1="410" y1="230" x2="410" y2="270"/>
    <line x1="380" y1="300" x2="220" y2="330"/>
    <line x1="410" y1="300" x2="410" y2="330"/>
    <line x1="440" y1="300" x2="620" y2="330"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Sequence -->
  <rect x="320" y="60" width="180" height="30" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="410" y="80" font-size="13.5" text-anchor="middle" fill="#1f3b5c">Sequence</text>

  <!-- Collection -->
  <rect x="320" y="130" width="180" height="30" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="410" y="150" font-size="13.5" text-anchor="middle" fill="#1f3b5c">Collection</text>
  <text x="580" y="150" font-size="10.5" fill="#8a8a8a" text-anchor="start">Set, Dictionary conform here</text>

  <!-- BidirectionalCollection -->
  <rect x="290" y="200" width="240" height="30" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="410" y="220" font-size="12.5" text-anchor="middle" fill="#3c2a5c">BidirectionalCollection</text>
  <text x="600" y="220" font-size="10.5" fill="#8a8a8a" text-anchor="start">Range conforms here</text>

  <!-- Middle relay node so 3 children fan out -->
  <rect x="360" y="270" width="100" height="30" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="410" y="290" font-size="11" text-anchor="middle" fill="#3c2a5c">(refines further)</text>

  <!-- Three children -->
  <rect x="90" y="330" width="220" height="34" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
  <text x="200" y="352" font-size="12" text-anchor="middle" fill="#7a4d13">RandomAccessCollection</text>
  <text x="200" y="378" font-size="10.5" fill="#8a8a8a" text-anchor="middle">Array, ArraySlice conform here</text>

  <rect x="320" y="330" width="180" height="34" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
  <text x="410" y="352" font-size="12" text-anchor="middle" fill="#7a4d13">MutableCollection</text>
  <text x="410" y="378" font-size="10.5" fill="#8a8a8a" text-anchor="middle">Array conforms here</text>

  <rect x="520" y="330" width="240" height="34" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
  <text x="640" y="352" font-size="12" text-anchor="middle" fill="#7a4d13">RangeReplaceableCollection</text>
  <text x="640" y="378" font-size="10.5" fill="#8a8a8a" text-anchor="middle">Array conforms here</text>

  <text x="410" y="405" font-size="10.5" fill="#666666" text-anchor="middle">Array conforms to all six; Set and Dictionary stop at Collection; Range stops at BidirectionalCollection</text>
</svg>
