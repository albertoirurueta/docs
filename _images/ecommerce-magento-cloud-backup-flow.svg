<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">What is backed up, what is rebuilt and what is copied to the second region for the Pocket Coffee Magento shop</title>
<desc id="d">Seven rows. The database RDS pocketcoffee-prod has automated backups with point-in-time recovery and a snapshot before every release, and an AWS Backup copy in eu-central-1. The S3 media bucket has versioning and an AWS Backup plan with a cross-region copy; the EFS alternative has a daily AWS Backup plan. OpenSearch has hourly automated snapshots but is rebuilt by reindexing. Valkey is not backed up and starts empty, losing sessions. RabbitMQ topology is declared by setup:upgrade and messages in flight are not backed up. The secret pocketcoffee/prod/magento keeps versions, holds every old crypt key and has a replica in the disaster recovery region.</desc>
