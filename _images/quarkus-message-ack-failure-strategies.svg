<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">SmallRye Reactive Messaging: acknowledgement and failure strategies</text>
  <text x="400" y="45" font-size="11" fill="#666666" text-anchor="middle">what happens to a broker offset/message after an @Incoming method's Uni/return value settles</text>

  <!-- incoming message -->
  <rect x="320" y="60" width="160" height="40" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="400" y="85" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Message received</text>

  <line x1="400" y1="100" x2="400" y2="126" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="270" y="126" width="260" height="46" rx="6" fill="#f5f5f5" stroke="#555555" stroke-width="1.4"/>
  <text x="400" y="148" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">@Incoming method invoked</text>
  <text x="400" y="163" font-size="9.5" fill="#666666" text-anchor="middle">did processing succeed or fail?</text>

  <line x1="330" y1="172" x2="180" y2="210" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="230" y="195" font-size="10" fill="#2d6a34" text-anchor="middle">success</text>

  <line x1="470" y1="172" x2="620" y2="210" stroke="#9a3b3b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="575" y="195" font-size="10" fill="#9a3b3b" text-anchor="middle">failure</text>

  <!-- success side -->
  <rect x="40" y="210" width="280" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="180" y="230" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Acknowledge</text>
  <text x="180" y="248" font-size="9.5" fill="#333333" text-anchor="middle">strategy: POST_PROCESSING (default) commits</text>
  <text x="180" y="262" font-size="9.5" fill="#333333" text-anchor="middle">after the method returns; MANUAL defers to code</text>

  <line x1="180" y1="270" x2="180" y2="296" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="40" y="296" width="280" height="50" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="180" y="318" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Kafka: consumer offset committed</text>
  <text x="180" y="334" font-size="9.5" fill="#333333" text-anchor="middle">next poll resumes after this record</text>

  <!-- failure side -->
  <rect x="480" y="210" width="280" height="60" rx="6" fill="#fbeeee" stroke="#9a3b3b" stroke-width="1.4"/>
  <text x="620" y="230" font-size="12" font-weight="bold" fill="#9a3b3b" text-anchor="middle">Negative-acknowledge (nack)</text>
  <text x="620" y="248" font-size="9.5" fill="#333333" text-anchor="middle">the Uni failed, or the method threw --</text>
  <text x="620" y="262" font-size="9.5" fill="#333333" text-anchor="middle">connector's failure-strategy config decides next step</text>

  <line x1="560" y1="270" x2="500" y2="296" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="680" y1="270" x2="740" y2="296" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="400" y="296" width="160" height="60" rx="6" fill="#fbeeee" stroke="#9a3b3b" stroke-width="1.3"/>
  <text x="480" y="316" font-size="10.5" font-weight="bold" fill="#9a3b3b" text-anchor="middle">fail-stop</text>
  <text x="480" y="332" font-size="9" fill="#333333" text-anchor="middle">consumer stops;</text>
  <text x="480" y="345" font-size="9" fill="#333333" text-anchor="middle">no offset commit</text>

  <rect x="660" y="296" width="160" height="60" rx="6" fill="#fbeeee" stroke="#9a3b3b" stroke-width="1.3"/>
  <text x="740" y="316" font-size="10.5" font-weight="bold" fill="#9a3b3b" text-anchor="middle">dead-letter-queue</text>
  <text x="740" y="332" font-size="9" fill="#333333" text-anchor="middle">record forwarded to a</text>
  <text x="740" y="345" font-size="9" fill="#333333" text-anchor="middle">configured DLQ topic</text>

  <rect x="220" y="296" width="160" height="60" rx="6" fill="#fbeeee" stroke="#9a3b3b" stroke-width="1.3"/>
  <text x="300" y="316" font-size="10.5" font-weight="bold" fill="#9a3b3b" text-anchor="middle">ignore</text>
  <text x="300" y="332" font-size="9" fill="#333333" text-anchor="middle">offset still commits;</text>
  <text x="300" y="345" font-size="9" fill="#333333" text-anchor="middle">failure only logged</text>

  <line x1="480" y1="270" x2="300" y2="296" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- bottom note -->
  <rect x="30" y="380" width="740" height="60" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="398" font-size="10.5" fill="#666666" text-anchor="middle">Choosing fail-stop vs. ignore vs. dead-letter-queue is a per-connector config decision</text>
  <text x="400" y="413" font-size="10.5" fill="#666666" text-anchor="middle">(mp.messaging.incoming.&lt;channel&gt;.failure-strategy) -- getting it wrong either silently drops</text>
  <text x="400" y="428" font-size="10.5" fill="#666666" text-anchor="middle">failed records (ignore/misconfigured DLQ) or blocks the whole partition indefinitely (fail-stop).</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
