<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Store API request lifecycle: CORS, rate limit, cart session, nonce check, handler, response headers</title>
  <desc id="d">A Store API request passes seven stages. 1 the request with optional Cart-Token, Nonce and Origin headers. 2 CORS, where any origin is accepted if it sends a valid Cart-Token. 3 optional rate limiting, which answers 429 rate_limit_exceeded when the limit is exceeded and is skipped for users who can edit posts. 4 loading the cart session from a valid Cart-Token or from the session cookie. 5 the nonce check, required for cart writes and for every checkout request unless a valid Cart-Token is sent, answering 401 woocommerce_rest_missing_nonce or 403 woocommerce_rest_invalid_nonce. 6 the route handler, which can answer 400 or 409. 7 the response carries fresh Nonce, Nonce-Timestamp, User-ID, Cart-Token, Cart-Hash and Cache-Control no-store headers.</desc>
  <rect x="0" y="0" width="980" height="650" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Seven stages between a request and its response</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="52" width="190" height="66" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="80" font-weight="bold" font-size="14">1  Request</text>
    <rect x="230" y="52" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="80">/wp-json/wc/store/v1/..., optional headers</text>
    <text x="244" y="100">Cart-Token, Nonce and Origin</text>
    <rect x="20" y="136" width="190" height="66" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="164" font-weight="bold" font-size="14">2  CORS</text>
    <rect x="230" y="136" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="164">Allowed origin, or any origin that sends</text>
    <text x="244" y="184">a valid Cart-Token; preflight answered at once</text>
    <rect x="20" y="220" width="190" height="66" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="248" font-weight="bold" font-size="14">3  Rate limit</text>
    <rect x="230" y="220" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="248">Only when enabled; skipped for users who</text>
    <text x="244" y="268">can edit_posts; keyed by user ID or client IP</text>
    <rect x="710" y="220" width="250" height="66" rx="8" fill="#8a3b3b" stroke="#f2f5f8"/>
    <text x="724" y="248" font-weight="bold" font-size="11">429 rate_limit_exceeded</text>
    <text x="724" y="268" font-size="11">header RateLimit-Retry-After</text>
    <rect x="20" y="304" width="190" height="66" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="332" font-weight="bold" font-size="14">4  Cart session</text>
    <rect x="230" y="304" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="332">Valid Cart-Token: token session, no cookie</text>
    <text x="244" y="352">Otherwise the wp_woocommerce_session_* cookie</text>
    <rect x="20" y="388" width="190" height="66" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="416" font-weight="bold" font-size="14">5  Nonce check</text>
    <rect x="230" y="388" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="416">Cart: POST, PUT, PATCH, DELETE. Checkout: all</text>
    <text x="244" y="436">methods. Skipped with a valid Cart-Token</text>
    <rect x="710" y="388" width="250" height="66" rx="8" fill="#8a3b3b" stroke="#f2f5f8"/>
    <text x="724" y="416" font-weight="bold" font-size="11">401 woocommerce_rest_missing_nonce</text>
    <text x="724" y="436" font-size="11">403 woocommerce_rest_invalid_nonce</text>
    <rect x="20" y="472" width="190" height="66" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="500" font-weight="bold" font-size="14">6  Route handler</text>
    <rect x="230" y="472" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="500">Validate, change the cart or place the order,</text>
    <text x="244" y="520">recalculate totals, add ExtendSchema data</text>
    <rect x="710" y="472" width="250" height="66" rx="8" fill="#8a3b3b" stroke="#f2f5f8"/>
    <text x="724" y="500" font-weight="bold" font-size="11">400 or 409 from the route</text>
    <text x="724" y="520" font-size="11">409 also returns the current cart</text>
    <rect x="20" y="556" width="190" height="66" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="34" y="584" font-weight="bold" font-size="14">7  Response</text>
    <rect x="230" y="556" width="420" height="66" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="244" y="584">Nonce, Nonce-Timestamp, User-ID, Cart-Token,</text>
    <text x="244" y="604">Cart-Hash and Cache-Control: no-store</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M115 118 V 134"/>
    <path d="M115 202 V 218"/>
    <path d="M115 286 V 302"/>
    <path d="M115 370 V 386"/>
    <path d="M115 454 V 470"/>
    <path d="M115 538 V 554"/>
    <path d="M650 253 H 708"/>
    <path d="M650 421 H 708"/>
    <path d="M650 505 H 708"/>
  </g>
</svg>
