<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Layer order decides reading order in the exported PDF</text>
  <rect x="24" y="50" width="220" height="296" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="134" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">What the reader sees</text>
  <rect x="44" y="86" width="180" height="240" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="56" y="98" width="156" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="134" y="118" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">A Title</text>
  <rect x="56" y="140" width="70" height="100" fill="#EEF2FF" stroke="#9CA3AF" stroke-dasharray="4 3"/><text x="91" y="194" font-size="13" fill="#374151" text-anchor="middle">B Cover</text>
  <rect x="134" y="140" width="78" height="60" fill="#EEF2FF" stroke="#9CA3AF"/><text x="173" y="174" font-size="13" fill="#374151" text-anchor="middle">C Blurb</text>
  <rect x="134" y="268" width="78" height="30" rx="15" fill="#4F46E5"/><text x="173" y="288" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D Link</text>
  <path d="M246,198 L280,198" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="284" y="50" width="220" height="296" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="394" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Layers list in Position</text>
  <text x="394" y="90" font-size="11" fill="#6B7280" text-anchor="middle">top of the list is read last</text>
  <g stroke="#9CA3AF" fill="#EEF2FF"><rect x="304" y="100" width="180" height="40" rx="6"/><rect x="304" y="150" width="180" height="40" rx="6"/><rect x="304" y="200" width="180" height="40" rx="6"/></g>
  <rect x="304" y="250" width="180" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <g font-size="13" fill="#1F2937"><text x="320" y="125">D Link</text><text x="320" y="175">C Blurb</text><text x="320" y="225">B Cover</text><text x="320" y="275" font-weight="bold">A Title</text></g>
  <g font-size="12" fill="#374151" text-anchor="end"><text x="470" y="125">read 4th</text><text x="470" y="175">read 3rd</text><text x="470" y="225">read 2nd</text><text x="470" y="275">read 1st</text></g>
  <text x="394" y="312" font-size="12" fill="#374151" text-anchor="middle">bottom of the list is read first</text>
  <text x="394" y="330" font-size="11" fill="#6B7280" text-anchor="middle">Match reading order to layers: on</text>
  <path d="M506,198 L540,198" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="544" y="50" width="192" height="296" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="640" y="72" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Order a screen reader hears</text>
  <g fill="#B45309"><circle cx="568" cy="110" r="11"/><circle cx="568" cy="160" r="11"/><circle cx="568" cy="210" r="11"/><circle cx="568" cy="260" r="11"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="568" y="114">1</text><text x="568" y="164">2</text><text x="568" y="214">3</text><text x="568" y="264">4</text></g>
  <g font-size="13" fill="#1F2937"><text x="590" y="115">Heading 1: title</text><text x="590" y="165">Image: cover</text><text x="590" y="215">Paragraph: blurb</text><text x="590" y="265">Link: open Bookshelf</text></g>
  <text x="640" y="310" font-size="11" fill="#374151" text-anchor="middle">Without the setting, order is estimated</text>
  <text x="640" y="324" font-size="11" fill="#374151" text-anchor="middle">from the layout on export.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
