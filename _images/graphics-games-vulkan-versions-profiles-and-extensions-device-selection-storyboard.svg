<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vpe-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Choosing a device: version, extensions, features, profile</text>
<rect x="14" y="60" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5"/>
<text x="30" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="83" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Enumerate</text>
<text x="83" y="140" text-anchor="middle" font-size="10" fill="#374151">enumerate devices</text>
<text x="83" y="170" text-anchor="middle" font-size="10" fill="#6B7280">list every GPU</text>
<line x1="153" y1="145" x2="161" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-sb)"/>
<rect x="162" y="60" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="178" cy="76" r="11" fill="#4F46E5"/>
<text x="178" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="231" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Check version</text>
<text x="231" y="140" text-anchor="middle" font-size="10" fill="#374151">apiVersion &gt;= 1.3</text>
<text x="231" y="170" text-anchor="middle" font-size="10" fill="#6B7280">reject older drivers</text>
<line x1="301" y1="145" x2="309" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-sb)"/>
<rect x="310" y="60" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="76" r="11" fill="#4F46E5"/>
<text x="326" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="379" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Check extensions</text>
<text x="379" y="140" text-anchor="middle" font-size="10" fill="#374151">device extension list</text>
<text x="379" y="170" text-anchor="middle" font-size="10" fill="#6B7280">optional ones noted</text>
<line x1="449" y1="145" x2="457" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-sb)"/>
<rect x="458" y="60" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="76" r="11" fill="#4F46E5"/>
<text x="474" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="527" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Query features</text>
<text x="527" y="140" text-anchor="middle" font-size="10" fill="#374151">Features2 chain</text>
<text x="527" y="170" text-anchor="middle" font-size="10" fill="#6B7280">timeline, sync2, rendering</text>
<line x1="597" y1="145" x2="605" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-sb)"/>
<rect x="606" y="60" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="622" cy="76" r="11" fill="#4F46E5"/>
<text x="622" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="675" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Create device</text>
<text x="675" y="140" text-anchor="middle" font-size="10" fill="#374151">enable what was queried</text>
<text x="675" y="170" text-anchor="middle" font-size="10" fill="#6B7280">queues, features, exts</text>
<text x="380" y="260" text-anchor="middle" font-size="12" fill="#374151">The Bookshelf asks for Vulkan 1.3 and uses 1.4 and ray-query only when the device offers them</text>
<text x="380" y="285" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">A profile packs steps 2 to 4 into one named check</text>
</svg>
