<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Cloud Storage: where the bucket lives and how the objects are priced</text>

  <!-- Locations (left) -->
  <text x="20" y="58" font-size="14" font-weight="700" fill="#123a72">1. Location type (fixed when the bucket is created)</text>

  <rect x="20" y="70" width="400" height="86" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="34" y="92" font-size="13" font-weight="700" fill="#123a72">Region (for example us-central1)</text>
  <rect x="34" y="102" width="108" height="40" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <rect x="156" y="102" width="108" height="40" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <rect x="278" y="102" width="128" height="40" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="88" y="126" text-anchor="middle" font-size="11" fill="#123a72">zone a</text>
  <text x="210" y="126" text-anchor="middle" font-size="11" fill="#123a72">zone b</text>
  <text x="342" y="120" text-anchor="middle" font-size="11" fill="#123a72">zone c: data is spread</text>
  <text x="342" y="134" text-anchor="middle" font-size="11" fill="#123a72">across zones</text>

  <rect x="20" y="166" width="400" height="86" rx="10" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="34" y="188" font-size="13" font-weight="700" fill="#14572f">Dual-region (nam4 or a custom pair you choose)</text>
  <rect x="34" y="198" width="170" height="40" rx="6" fill="#d5eddd" stroke="#1e7e45"/>
  <rect x="236" y="198" width="170" height="40" rx="6" fill="#d5eddd" stroke="#1e7e45"/>
  <text x="119" y="222" text-anchor="middle" font-size="11" fill="#14572f">us-central1</text>
  <text x="321" y="222" text-anchor="middle" font-size="11" fill="#14572f">us-east1</text>
  <path d="M206 218 L234 218" stroke="#14572f" stroke-width="2"/>
  <text x="220" y="212" text-anchor="middle" font-size="9" fill="#14572f">sync</text>

  <rect x="20" y="262" width="400" height="86" rx="10" fill="#fff8e6" stroke="#b06a00" stroke-width="2"/>
  <text x="34" y="284" font-size="13" font-weight="700" fill="#7a4800">Multi-region (US, EU or ASIA)</text>
  <rect x="34" y="294" width="116" height="40" rx="6" fill="#fdeec3" stroke="#b06a00"/>
  <rect x="162" y="294" width="116" height="40" rx="6" fill="#fdeec3" stroke="#b06a00"/>
  <rect x="290" y="294" width="116" height="40" rx="6" fill="#fdeec3" stroke="#b06a00"/>
  <text x="92" y="318" text-anchor="middle" font-size="11" fill="#7a4800">region</text>
  <text x="220" y="318" text-anchor="middle" font-size="11" fill="#7a4800">region</text>
  <text x="348" y="318" text-anchor="middle" font-size="11" fill="#7a4800">region</text>

  <rect x="20" y="358" width="400" height="62" rx="10" fill="#fde8e8" stroke="#b3261e" stroke-width="2"/>
  <text x="34" y="380" font-size="13" font-weight="700" fill="#8a1c15">Zonal (Rapid Bucket, class RAPID)</text>
  <rect x="34" y="388" width="372" height="22" rx="6" fill="#f9d2d0" stroke="#b3261e"/>
  <text x="220" y="404" text-anchor="middle" font-size="11" fill="#8a1c15">one zone, appendable objects over gRPC, lowest latency</text>

  <!-- Classes (right) -->
  <text x="450" y="58" font-size="14" font-weight="700" fill="#123a72">2. Storage class (per object, can change)</text>

  <rect x="450" y="70" width="430" height="52" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="464" y="92" font-size="13" font-weight="700" fill="#123a72">Standard</text>
  <text x="464" y="110" font-size="11" fill="#3c4a58">no minimum duration, no retrieval fee: hot data</text>

  <rect x="450" y="132" width="430" height="52" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.6"/>
  <text x="464" y="154" font-size="13" font-weight="700" fill="#14572f">Nearline</text>
  <text x="464" y="172" font-size="11" fill="#3c4a58">30-day minimum, retrieval fee: about once a month</text>

  <rect x="450" y="194" width="430" height="52" rx="8" fill="#fff8e6" stroke="#b06a00" stroke-width="1.6"/>
  <text x="464" y="216" font-size="13" font-weight="700" fill="#7a4800">Coldline</text>
  <text x="464" y="234" font-size="11" fill="#3c4a58">90-day minimum, higher retrieval fee: about once a quarter</text>

  <rect x="450" y="256" width="430" height="52" rx="8" fill="#f1e8fb" stroke="#6a3fa0" stroke-width="1.6"/>
  <text x="464" y="278" font-size="13" font-weight="700" fill="#44226f">Archive</text>
  <text x="464" y="296" font-size="11" fill="#3c4a58">365-day minimum, highest retrieval fee: compliance copies</text>

  <rect x="450" y="318" width="430" height="44" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="464" y="338" font-size="12" font-weight="700" fill="#3c4a58">Legacy: Multi-Regional, Regional, Durable Reduced Availability</text>
  <text x="464" y="354" font-size="11" fill="#3c4a58">still readable, not recommended, not a lifecycle target</text>

  <!-- Autoclass bracket -->
  <rect x="450" y="378" width="430" height="42" rx="8" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="464" y="396" font-size="12" font-weight="700" fill="#123a72">Autoclass</text>
  <text x="464" y="412" font-size="11" fill="#3c4a58">moves each object up and down the ladder by access pattern</text>

  <!-- Footer -->
  <rect x="20" y="440" width="860" height="62" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="1.4"/>
  <text x="34" y="462" font-size="12" font-weight="700" fill="#3c4a58">Same on every combination</text>
  <text x="34" y="480" font-size="11" fill="#3c4a58">Eleven-nines durability, one API and the same latency to first byte for Standard to Archive.</text>
  <text x="34" y="494" font-size="11" fill="#3c4a58">Location sets availability, replication and price; class sets storage price against retrieval price.</text>
</svg>
