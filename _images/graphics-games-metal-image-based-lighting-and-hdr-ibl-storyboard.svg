<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-image-based-lighting-and-hdr-ibl-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Image-based lighting for the Bookshelf: four steps</text>
<rect x="20" y="55" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="71" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="75" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="45" y="90" width="120" height="80" rx="6" fill="#BFDBFE" stroke="#E5E7EB" stroke-width="1"/>
<circle cx="130" cy="115" r="10" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>
<text x="105" y="198" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Environment</text>
<text x="105" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">generate or load</text>
<text x="105" y="233" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">an HDR cube</text>
<line x1="190" y1="155" x2="205" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-ibl-storyboard)"/>
<rect x="205" y="55" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="221" cy="71" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="221" y="75" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="230" y="90" width="120" height="80" rx="6" fill="#DBEAFE" stroke="#E5E7EB" stroke-width="1"/>
<text x="290" y="198" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Irradiance</text>
<text x="290" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">convolve to a</text>
<text x="290" y="233" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">small diffuse cube</text>
<line x1="375" y1="155" x2="390" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-ibl-storyboard)"/>
<rect x="390" y="55" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="406" cy="71" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="406" y="75" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="415" y="90" width="120" height="80" rx="6" fill="#C7D2FE" stroke="#E5E7EB" stroke-width="1"/>
<text x="475" y="198" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Prefilter</text>
<text x="475" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blur per mip for</text>
<text x="475" y="233" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">specular reflections</text>
<line x1="560" y1="155" x2="575" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-ibl-storyboard)"/>
<rect x="575" y="55" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="591" cy="71" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="591" y="75" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="600" y="90" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="615" y="115" width="24" height="50" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="645" y="105" width="24" height="60" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="675" y="120" width="24" height="45" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<circle cx="687" cy="116" r="5" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
<text x="660" y="198" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Shade</text>
<text x="660" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sample both plus</text>
<text x="660" y="233" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the BRDF LUT</text>
<text x="380" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Steps 1 to 3 run once at load; step 4 is a few texture samples per pixel in the lighting shader.</text>
<text x="380" y="303" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Changing the environment at runtime only repeats steps 2 and 3.</text>
</svg>
