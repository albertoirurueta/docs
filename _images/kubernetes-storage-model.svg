<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The storage model: a Pod mounts a PersistentVolumeClaim, which binds to a PersistentVolume provisioned by a StorageClass through a CSI driver</title>
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">PVC, PV, StorageClass and CSI driver</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">a claim is bound to a volume that a class provisioned on demand</text>

  <rect x="30" y="70" width="200" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="130" y="96" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod</text>
  <text x="130" y="116" font-size="9.5" fill="#333333" text-anchor="middle">volumes: persistentVolumeClaim</text>

  <rect x="290" y="70" width="200" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="96" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">PersistentVolumeClaim</text>
  <text x="390" y="116" font-size="9.5" fill="#333333" text-anchor="middle">namespaced request: size, access mode</text>

  <rect x="550" y="70" width="200" height="70" rx="6" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.4"/>
  <text x="650" y="96" font-size="12" font-weight="bold" fill="#1f6b6b" text-anchor="middle">PersistentVolume</text>
  <text x="650" y="116" font-size="9.5" fill="#333333" text-anchor="middle">cluster-scoped piece of storage</text>

  <line x1="230" y1="105" x2="290" y2="105" stroke="#444444" stroke-width="1.4"/>
  <text x="260" y="98" font-size="9" fill="#444444" text-anchor="middle">mounts</text>
  <line x1="490" y1="105" x2="550" y2="105" stroke="#444444" stroke-width="1.4"/>
  <text x="520" y="98" font-size="9" fill="#444444" text-anchor="middle">binds 1:1</text>

  <rect x="290" y="210" width="200" height="70" rx="6" fill="#fdf5e6" stroke="#8a5a00" stroke-width="1.4"/>
  <text x="390" y="236" font-size="12" font-weight="bold" fill="#8a5a00" text-anchor="middle">StorageClass</text>
  <text x="390" y="256" font-size="9.5" fill="#333333" text-anchor="middle">provisioner, parameters, reclaimPolicy,</text>
  <text x="390" y="268" font-size="9.5" fill="#333333" text-anchor="middle">volumeBindingMode, allowVolumeExpansion</text>

  <rect x="290" y="320" width="200" height="60" rx="6" fill="#f3eefa" stroke="#5b3c8a" stroke-width="1.4"/>
  <text x="390" y="346" font-size="12" font-weight="bold" fill="#5b3c8a" text-anchor="middle">CSI driver</text>
  <text x="390" y="364" font-size="9.5" fill="#333333" text-anchor="middle">controller + node plugin -> disk, NFS, ...</text>

  <line x1="390" y1="140" x2="390" y2="210" stroke="#8a5a00" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="400" y="178" font-size="9" fill="#8a5a00">storageClassName</text>
  <line x1="390" y1="280" x2="390" y2="320" stroke="#5b3c8a" stroke-width="1.2"/>
  <text x="400" y="304" font-size="9" fill="#5b3c8a">provisioner</text>
  <path d="M 490 350 L 650 350 L 650 140" fill="none" stroke="#5b3c8a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="660" y="250" font-size="9" fill="#5b3c8a">creates PV</text>
  <text x="660" y="262" font-size="9" fill="#5b3c8a">on demand</text>
</svg>
