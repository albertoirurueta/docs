<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">DocFX settings and the files they add to the site folder</title>
  <desc id="d">Three docfx.json settings on the left each add a file or behaviour to the _site output folder on the right, which is then uploaded to a static host.</desc>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#1f2a3a"/>
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#f2f5f9">docfx.json settings</text>
  <text x="400" y="34" font-size="16" font-weight="bold" fill="#f2f5f9">_site folder (build output)</text>

  <rect x="30" y="52" width="250" height="62" rx="8" fill="#2f5d8a" stroke="#9cc4ea"/>
  <text x="46" y="78" font-size="14" font-weight="bold" fill="#ffffff">build.sitemap.baseUrl</text>
  <text x="46" y="99" font-size="12" fill="#e4eef8">absolute URL with trailing slash</text>

  <rect x="30" y="140" width="250" height="62" rx="8" fill="#2f5d8a" stroke="#9cc4ea"/>
  <text x="46" y="166" font-size="14" font-weight="bold" fill="#ffffff">_enableSearch: true</text>
  <text x="46" y="187" font-size="12" fill="#e4eef8">in globalMetadata</text>

  <rect x="30" y="228" width="250" height="62" rx="8" fill="#2f5d8a" stroke="#9cc4ea"/>
  <text x="46" y="254" font-size="14" font-weight="bold" fill="#ffffff">404.md in content</text>
  <text x="46" y="275" font-size="12" fill="#e4eef8">plus CNAME in resource</text>

  <rect x="400" y="52" width="330" height="62" rx="8" fill="#3d7a5a" stroke="#a6dcc0"/>
  <text x="416" y="78" font-size="14" font-weight="bold" fill="#ffffff">sitemap.xml</text>
  <text x="416" y="99" font-size="12" fill="#e6f5ec">one url entry per HTML page</text>

  <rect x="400" y="140" width="330" height="62" rx="8" fill="#3d7a5a" stroke="#a6dcc0"/>
  <text x="416" y="166" font-size="14" font-weight="bold" fill="#ffffff">index.json + search box</text>
  <text x="416" y="187" font-size="12" fill="#e6f5ec">read in the browser by public/search-worker.min.js</text>

  <rect x="400" y="228" width="330" height="62" rx="8" fill="#3d7a5a" stroke="#a6dcc0"/>
  <text x="416" y="254" font-size="14" font-weight="bold" fill="#ffffff">404.html and CNAME</text>
  <text x="416" y="275" font-size="12" fill="#e6f5ec">copied to the root of the site</text>

  <g stroke="#f2c14e" stroke-width="2" fill="none">
    <line x1="282" y1="83" x2="396" y2="83"/>
    <line x1="282" y1="171" x2="396" y2="171"/>
    <line x1="282" y1="259" x2="396" y2="259"/>
  </g>
  <g fill="#f2c14e">
    <polygon points="398,83 388,78 388,88"/>
    <polygon points="398,171 388,166 388,176"/>
    <polygon points="398,259 388,254 388,264"/>
  </g>
  <text x="380" y="330" font-size="13" text-anchor="middle" fill="#d6dde6">The whole folder is uploaded as is: all links are relative, so it works at a sub-path such as /pocket-units/</text>
</svg>
