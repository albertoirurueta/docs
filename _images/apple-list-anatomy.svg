<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of the FieldNotes note list</text>
  <text x="380" y="47" font-size="12" fill="#666666" text-anchor="middle">Each visible part of a SwiftUI List and the API that produces it</text>

  <defs>
    <marker id="la-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Phone frame -->
  <rect x="40" y="64" width="300" height="456" rx="30" fill="#f2f2f7" stroke="#555555" stroke-width="2"/>

  <!-- Navigation title -->
  <text x="60" y="112" font-size="24" font-weight="bold" fill="#111111">Birds</text>

  <!-- Search field -->
  <rect x="56" y="124" width="268" height="32" rx="9" fill="#e3e3e8"/>
  <circle cx="74" cy="139" r="6" fill="none" stroke="#8e8e93" stroke-width="1.8"/>
  <line x1="78.5" y1="143.5" x2="83" y2="148" stroke="#8e8e93" stroke-width="1.8"/>
  <text x="92" y="144" font-size="14" fill="#8e8e93">Search notes</text>

  <!-- Section header: Pinned -->
  <text x="64" y="182" font-size="13" fill="#6d6d72">PINNED</text>
  <rect x="56" y="190" width="268" height="52" rx="10" fill="#ffffff"/>
  <text x="72" y="212" font-size="14" font-weight="bold" fill="#111111">Heron at dawn</text>
  <text x="72" y="231" font-size="12" fill="#6d6d72">12 Sep · wetlands</text>
  <path d="M300,206 l6,0 l-1.5,7 l3.5,3 l-10,0 l3.5,-3 Z M303,216 l0,8" fill="#e08a00" stroke="#e08a00" stroke-width="1.4"/>

  <!-- Section header: Notes -->
  <text x="64" y="270" font-size="13" fill="#6d6d72">NOTES</text>

  <!-- Row: selected -->
  <rect x="56" y="278" width="268" height="52" rx="10" fill="#d6e6fb"/>
  <text x="72" y="300" font-size="14" font-weight="bold" fill="#111111">Kingfisher nest</text>
  <text x="72" y="319" font-size="12" fill="#6d6d72">10 Sep · river</text>
  <line x1="72" y1="330" x2="324" y2="330" stroke="#c6c6c8" stroke-width="1"/>

  <!-- Row: swiped, revealing trailing actions -->
  <rect x="56" y="330" width="268" height="52" fill="#ffffff"/>
  <rect x="204" y="330" width="60" height="52" fill="#e08a00"/>
  <text x="234" y="361" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Pin</text>
  <rect x="264" y="330" width="60" height="52" fill="#d93025"/>
  <text x="294" y="361" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Delete</text>
  <text x="72" y="352" font-size="14" font-weight="bold" fill="#111111">Owl pellets</text>
  <text x="72" y="371" font-size="12" fill="#6d6d72">8 Sep · barn</text>
  <line x1="72" y1="382" x2="324" y2="382" stroke="#c6c6c8" stroke-width="1"/>

  <!-- Row: plain -->
  <rect x="56" y="382" width="268" height="52" rx="10" fill="#ffffff"/>
  <rect x="56" y="382" width="268" height="12" fill="#ffffff"/>
  <text x="72" y="404" font-size="14" font-weight="bold" fill="#111111">Swifts over the tower</text>
  <text x="72" y="423" font-size="12" fill="#6d6d72">2 Sep · town</text>

  <!-- Section footer -->
  <text x="64" y="456" font-size="12" fill="#6d6d72">3 notes</text>

  <!-- Home indicator -->
  <rect x="140" y="500" width="100" height="5" rx="2.5" fill="#333333"/>

  <!-- Callouts -->
  <g font-size="13.5">
    <line x1="130" y1="104" x2="420" y2="94" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="90" font-weight="bold" fill="#1c4b73">Navigation title</text>
    <text x="428" y="106" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">.navigationTitle("Birds")</text>

    <line x1="324" y1="140" x2="420" y2="146" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="142" font-weight="bold" fill="#1c4b73">Search field</text>
    <text x="428" y="158" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">.searchable(text: $searchText)</text>

    <line x1="124" y1="178" x2="420" y2="184" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="186" font-weight="bold" fill="#1c4b73">Section header</text>
    <text x="428" y="202" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">Section("Pinned") { ... }</text>

    <line x1="324" y1="216" x2="420" y2="248" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="246" font-weight="bold" fill="#1c4b73">Row (one per Identifiable note)</text>
    <text x="428" y="262" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">ForEach(pinned) { NoteRow(note: $0) }</text>

    <line x1="324" y1="304" x2="420" y2="300" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="298" font-weight="bold" fill="#1c4b73">Selected row</text>
    <text x="428" y="314" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">List(selection: $selection)</text>

    <line x1="324" y1="356" x2="420" y2="352" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="350" font-weight="bold" fill="#1c4b73">Swipe actions (trailing edge)</text>
    <text x="428" y="366" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">.swipeActions(edge: .trailing) {</text>
    <text x="428" y="382" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">    Button("Pin") ...</text>
    <text x="428" y="398" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">    Button(role: .destructive) ... }</text>

    <line x1="112" y1="452" x2="420" y2="450" stroke="#1c4b73" stroke-width="1.2" marker-start="url(#la-dot)"/>
    <text x="428" y="446" font-weight="bold" fill="#1c4b73">Section footer</text>
    <text x="428" y="462" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#333333">Section { ... } footer: { Text(...) }</text>
  </g>

  <text x="380" y="530" font-size="12" fill="#666666" text-anchor="middle">Style shown: .listStyle(.insetGrouped) on iPhone. The same List renders as a sidebar or plain list on other platforms.</text>
</svg>
