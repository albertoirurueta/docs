<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The same triangle in a 2007 guide and in 2026</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="20" y="48" width="350" height="330" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="195" y="72" font-size="14" fill="#92400E" text-anchor="middle" font-weight="bold">Older guides: GL 2.1 fixed function</text>
<text x="34" y="100" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glMatrixMode(GL_PROJECTION);</text>
<text x="34" y="120" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glLoadIdentity();</text>
<text x="34" y="140" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">gluPerspective(60, aspect, 0.1, 100);</text>
<text x="34" y="160" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glMatrixMode(GL_MODELVIEW);</text>
<text x="34" y="180" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTranslatef(0, 0, -3);</text>
<text x="34" y="200" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glEnable(GL_LIGHTING);</text>
<text x="34" y="220" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glBegin(GL_TRIANGLES);</text>
<text x="34" y="240" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  glColor3f(1, 0, 0); glVertex3f(-1, -1, 0);</text>
<text x="34" y="260" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  glColor3f(0, 1, 0); glVertex3f( 1, -1, 0);</text>
<text x="34" y="280" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">  glColor3f(0, 0, 1); glVertex3f( 0,  1, 0);</text>
<text x="34" y="300" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glEnd();</text>
<text x="34" y="320" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glutSwapBuffers();</text>
<text x="195" y="352" font-size="11" fill="#92400E" text-anchor="middle">Removed from the core profile in 2009</text>
<text x="195" y="368" font-size="11" fill="#92400E" text-anchor="middle">and unavailable in macOS core contexts</text>
<rect x="390" y="48" width="350" height="330" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="565" y="72" font-size="14" fill="#3730A3" text-anchor="middle" font-weight="bold">2026: GL 4.1 core, shaders and buffers</text>
<text x="404" y="100" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">// once, at start-up</text>
<text x="404" y="119" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glfwWindowHint(GLFW_OPENGL_PROFILE,</text>
<text x="404" y="138" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GLFW_OPENGL_CORE_PROFILE);</text>
<text x="404" y="157" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">gladLoadGL(glfwGetProcAddress);</text>
<text x="404" y="176" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glGenVertexArrays(1, &amp;vao);</text>
<text x="404" y="195" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glGenBuffers(1, &amp;vbo);</text>
<text x="404" y="214" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glBufferData(GL_ARRAY_BUFFER, ...);</text>
<text x="404" y="233" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">program = link(vertexSrc, fragmentSrc);</text>
<text x="404" y="252" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">// every frame</text>
<text x="404" y="271" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glUseProgram(program);</text>
<text x="404" y="290" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glBindVertexArray(vao);</text>
<text x="404" y="309" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glDrawArrays(GL_TRIANGLES, 0, 3);</text>
<text x="404" y="328" font-size="11" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glfwSwapBuffers(window);</text>
<text x="565" y="352" font-size="11" fill="#3730A3" text-anchor="middle">Matrices come from GLM and reach the shader</text>
<text x="565" y="368" font-size="11" fill="#3730A3" text-anchor="middle">as uniforms; GLFW replaces GLUT</text>
<line x1="372" y1="213" x2="388" y2="213" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<text x="380" y="404" font-size="11" fill="#374151" text-anchor="middle">Conceptual comparison, not a complete program</text>
</svg>
