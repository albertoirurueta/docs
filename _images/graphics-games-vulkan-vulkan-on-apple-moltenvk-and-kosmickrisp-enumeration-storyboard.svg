<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-apple-enum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Making a Mac device visible to your app</text>
<rect x="16" y="66" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="32" cy="82" r="11" fill="#4F46E5"/><text x="32" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<rect x="24" y="104" width="122" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Enable instance</text>
<text x="85.0" y="146.8" text-anchor="middle" font-size="11" fill="#3730A3">extension</text>
<text x="85" y="196" text-anchor="middle" font-size="9" fill="#374151">VK_KHR_portability_enum.</text>
<line x1="155" y1="150" x2="163" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-apple-enum)"/>
<rect x="164" y="66" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="180" cy="82" r="11" fill="#4F46E5"/><text x="180" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<rect x="172" y="104" width="122" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="233.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Set the</text>
<text x="233.0" y="146.8" text-anchor="middle" font-size="11" fill="#3730A3">create flag</text>
<text x="233" y="196" text-anchor="middle" font-size="9" fill="#374151">ENUMERATE_PORTABILITY</text>
<line x1="303" y1="150" x2="311" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-apple-enum)"/>
<rect x="312" y="66" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="82" r="11" fill="#4F46E5"/><text x="328" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="320" y="104" width="122" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="381.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Enumerate</text>
<text x="381.0" y="146.8" text-anchor="middle" font-size="11" fill="#3730A3">devices</text>
<text x="381" y="196" text-anchor="middle" font-size="9" fill="#374151">vkEnumeratePhysicalDevices</text>
<line x1="451" y1="150" x2="459" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-apple-enum)"/>
<rect x="460" y="66" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="476" cy="82" r="11" fill="#4F46E5"/><text x="476" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<rect x="468" y="104" width="122" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="529.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Query device</text>
<text x="529.0" y="146.8" text-anchor="middle" font-size="11" fill="#3730A3">extensions</text>
<text x="529" y="196" text-anchor="middle" font-size="9" fill="#374151">find portability_subset</text>
<line x1="599" y1="150" x2="607" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-apple-enum)"/>
<rect x="608" y="66" width="138" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="624" cy="82" r="11" fill="#4F46E5"/><text x="624" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<rect x="616" y="104" width="122" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="677.0" y="132.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Enable it on</text>
<text x="677.0" y="146.8" text-anchor="middle" font-size="11" fill="#3730A3">the device</text>
<text x="677" y="196" text-anchor="middle" font-size="9" fill="#374151">and chain its features</text>
<rect x="40" y="272" width="320" height="92" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="200.0" y="307.9" text-anchor="middle" font-size="11" fill="#92400E">Without the flag the loader hides</text>
<text x="200.0" y="321.9" text-anchor="middle" font-size="11" fill="#92400E">portability devices, so an app that</text>
<text x="200.0" y="335.9" text-anchor="middle" font-size="11" fill="#92400E">predates the extension never sees them</text>
<rect x="400" y="272" width="320" height="92" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="307.9" text-anchor="middle" font-size="11" fill="#065F46">A conformant driver does not need</text>
<text x="560.0" y="321.9" text-anchor="middle" font-size="11" fill="#065F46">the portability path: check the list</text>
<text x="560.0" y="335.9" text-anchor="middle" font-size="11" fill="#065F46">instead of assuming either case</text>
</svg>
