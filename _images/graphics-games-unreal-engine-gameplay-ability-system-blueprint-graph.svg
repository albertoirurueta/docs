<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">GA_SpeedRead as a Blueprint graph</text>
<rect x="10" y="70" width="145" height="68" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="10" y="70" width="145" height="24" rx="8" fill="#B45309"/>
<text x="82.5" y="86" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Event ActivateAbility</text>
<text x="20" y="112" text-anchor="start" font-size="11" fill="#374151">exec</text>
<text x="20" y="130" text-anchor="start" font-size="11" fill="#374151">Trigger Event Data</text>
<rect x="175" y="70" width="115" height="86" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="175" y="70" width="115" height="24" rx="8" fill="#4F46E5"/>
<text x="232.5" y="86" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Commit Ability</text>
<text x="185" y="112" text-anchor="start" font-size="11" fill="#374151">exec in</text>
<text x="185" y="130" text-anchor="start" font-size="11" fill="#374151">exec out</text>
<text x="185" y="148" text-anchor="start" font-size="11" fill="#374151">Return Value</text>
<rect x="305" y="70" width="170" height="86" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="305" y="70" width="170" height="24" rx="8" fill="#4F46E5"/>
<text x="390.0" y="86" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Apply Gameplay Effect</text>
<text x="315" y="112" text-anchor="start" font-size="11" fill="#374151">to Owner</text>
<text x="315" y="130" text-anchor="start" font-size="11" fill="#374151">Class: GE_SpeedRead</text>
<text x="315" y="148" text-anchor="start" font-size="11" fill="#374151">Return: Effect Handle</text>
<rect x="495" y="70" width="110" height="68" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="495" y="70" width="110" height="24" rx="8" fill="#4F46E5"/>
<text x="550.0" y="86" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">WaitDelay</text>
<text x="505" y="112" text-anchor="start" font-size="11" fill="#374151">Time: 5.0</text>
<text x="505" y="130" text-anchor="start" font-size="11" fill="#374151">On Finish</text>
<rect x="625" y="70" width="120" height="68" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="625" y="70" width="120" height="24" rx="8" fill="#4F46E5"/>
<text x="685.0" y="86" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Remove Effect</text>
<text x="635" y="112" text-anchor="start" font-size="11" fill="#374151">with Handle</text>
<text x="635" y="130" text-anchor="start" font-size="11" fill="#374151">Handle</text>
<rect x="495" y="185" width="110" height="50" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="495" y="185" width="110" height="24" rx="8" fill="#B45309"/>
<text x="550.0" y="201" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">End Ability</text>
<text x="505" y="227" text-anchor="start" font-size="11" fill="#374151">exec in</text>
<line x1="155" y1="100" x2="173" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="285" y1="100" x2="303" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="475" y1="100" x2="493" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="605" y1="100" x2="623" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 685 160 L 685 175 L 550 175 L 550 183" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="262" text-anchor="middle" font-size="11" fill="#374151">Commit applies the cost and cooldown; if it fails the graph should call End Ability with Was Cancelled.</text>
<text x="380" y="280" text-anchor="middle" font-size="11" fill="#374151">The effect handle is stored in a variable between Apply and Remove.</text>
</svg>
