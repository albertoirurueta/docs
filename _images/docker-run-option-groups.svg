<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>docker run options, grouped by what they change</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">docker run options, grouped by what they change</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">docker run [OPTIONS] IMAGE [COMMAND] [ARG...]</text>
  <rect x="280" y="60" width="200" height="50" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="81.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">docker run</text>
  <text x="380.0" y="96.8" font-size="9.5" fill="#333333" text-anchor="middle">one container process</text>
  <rect x="12" y="170" width="142" height="170" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="83.0" y="225.0" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">Process and identity</text>
  <text x="83.0" y="240.0" font-size="9" fill="#333333" text-anchor="middle">-d  -it  --rm  --name</text>
  <text x="83.0" y="253.0" font-size="9" fill="#333333" text-anchor="middle">--entrypoint  -w  -u</text>
  <text x="83.0" y="266.0" font-size="9" fill="#333333" text-anchor="middle">--init  --restart</text>
  <text x="83.0" y="279.0" font-size="9" fill="#333333" text-anchor="middle">--stop-timeout  --stop-signal</text>
  <text x="83.0" y="292.0" font-size="9" fill="#333333" text-anchor="middle">-e  --env-file</text>
  <line x1="380" y1="110" x2="83.0" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="162" y="170" width="142" height="170" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="233.0" y="231.5" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Filesystem</text>
  <text x="233.0" y="246.5" font-size="9" fill="#333333" text-anchor="middle">-v name:/path</text>
  <text x="233.0" y="259.5" font-size="9" fill="#333333" text-anchor="middle">--mount type=volume|bind|tmpfs</text>
  <text x="233.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">--read-only</text>
  <text x="233.0" y="285.5" font-size="9" fill="#333333" text-anchor="middle">--tmpfs /tmp</text>
  <line x1="380" y1="110" x2="233.0" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="312" y="170" width="142" height="170" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="383.0" y="231.5" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">Network</text>
  <text x="383.0" y="246.5" font-size="9" fill="#333333" text-anchor="middle">--network backend</text>
  <text x="383.0" y="259.5" font-size="9" fill="#333333" text-anchor="middle">--network-alias api</text>
  <text x="383.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">-p 127.0.0.1:8080:8080</text>
  <text x="383.0" y="285.5" font-size="9" fill="#333333" text-anchor="middle">-P  --add-host  --dns</text>
  <line x1="380" y1="110" x2="383.0" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="462" y="170" width="142" height="170" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="533.0" y="231.5" font-size="11" font-weight="bold" fill="#8f2a2a" text-anchor="middle">Resources</text>
  <text x="533.0" y="246.5" font-size="9" fill="#333333" text-anchor="middle">--memory  --memory-swap</text>
  <text x="533.0" y="259.5" font-size="9" fill="#333333" text-anchor="middle">--cpus  --cpuset-cpus</text>
  <text x="533.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">--pids-limit  --ulimit</text>
  <text x="533.0" y="285.5" font-size="9" fill="#333333" text-anchor="middle">--gpus</text>
  <line x1="380" y1="110" x2="533.0" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="612" y="170" width="142" height="170" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="683.0" y="231.5" font-size="11" font-weight="bold" fill="#1f6b6b" text-anchor="middle">Metadata and platform</text>
  <text x="683.0" y="246.5" font-size="9" fill="#333333" text-anchor="middle">--label team=orders</text>
  <text x="683.0" y="259.5" font-size="9" fill="#333333" text-anchor="middle">--platform linux/amd64</text>
  <text x="683.0" y="272.5" font-size="9" fill="#333333" text-anchor="middle">--log-driver  --log-opt</text>
  <text x="683.0" y="285.5" font-size="9" fill="#333333" text-anchor="middle">--health-cmd</text>
  <line x1="380" y1="110" x2="683.0" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380" y="380" font-size="10" fill="#555555" text-anchor="middle">Arguments after IMAGE replace CMD; --entrypoint replaces ENTRYPOINT; every image default can be overridden at run time</text>
</svg>
