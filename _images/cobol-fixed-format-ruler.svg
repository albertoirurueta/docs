<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>The 80-column COBOL fixed reference format: sequence number area, indicator area, Area A, Area B and identification area</title>
<rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
<text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Fixed reference format: one 80-column line</text>
<text x="430" y="45" font-size="12" fill="#555555" text-anchor="middle">the compiler reads columns 1 to 72; columns 73 to 80 are ignored; one grid cell is one column</text>
<rect x="30" y="62" width="60" height="26" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<rect x="90" y="62" width="10" height="26" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<rect x="100" y="62" width="40" height="26" fill="#d8efd8" stroke="#2b6b2b" stroke-width="2"/>
<rect x="140" y="62" width="610" height="26" fill="#e6dcf3" stroke="#563a82" stroke-width="2"/>
<rect x="750" y="62" width="80" height="26" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="35.0" y="104" font-size="11" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">1</text>
<text x="90" y="104" font-size="11" fill="#222222" text-anchor="end" font-family="Courier New, monospace">6</text>
<text x="95.0" y="104" font-size="11" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">7</text>
<text x="100" y="104" font-size="11" fill="#222222" text-anchor="start" font-family="Courier New, monospace">8</text>
<text x="140" y="104" font-size="11" fill="#222222" text-anchor="end" font-family="Courier New, monospace">11</text>
<text x="140" y="104" font-size="11" fill="#222222" text-anchor="start" font-family="Courier New, monospace">12</text>
<text x="750" y="104" font-size="11" fill="#222222" text-anchor="end" font-family="Courier New, monospace">72</text>
<text x="750" y="104" font-size="11" fill="#222222" text-anchor="start" font-family="Courier New, monospace">73</text>
<text x="825.0" y="104" font-size="11" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">80</text>
<rect x="30" y="122" width="16" height="16" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="56" y="134" font-size="13" fill="#222222">Sequence number area, columns 1-6: any characters, ignored by the compiler (line numbers)</text>
<rect x="30" y="146" width="16" height="16" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<text x="56" y="158" font-size="13" fill="#222222">Indicator area, column 7: * or / comment, - continuation, D debugging line, blank otherwise</text>
<rect x="30" y="170" width="16" height="16" fill="#d8efd8" stroke="#2b6b2b" stroke-width="2"/>
<text x="56" y="182" font-size="13" fill="#222222">Area A, columns 8-11: division, section and paragraph names, FD, 01 and 77 start here</text>
<rect x="30" y="194" width="16" height="16" fill="#e6dcf3" stroke="#563a82" stroke-width="2"/>
<text x="56" y="206" font-size="13" fill="#222222">Area B, columns 12-72: statements, clauses and subordinate entries</text>
<rect x="30" y="218" width="16" height="16" fill="#e3e3e3" stroke="#444444" stroke-width="2"/>
<text x="56" y="230" font-size="13" fill="#222222">Identification area, columns 73-80: ignored, free for labels</text>
<text x="30" y="278" font-size="13" font-weight="bold" fill="#222222">Example lines (dashed guides at the area boundaries)</text>
<line x1="90" y1="288" x2="90" y2="412" stroke="#888888" stroke-dasharray="4 3"/>
<line x1="100" y1="288" x2="100" y2="412" stroke="#888888" stroke-dasharray="4 3"/>
<line x1="140" y1="288" x2="140" y2="412" stroke="#888888" stroke-dasharray="4 3"/>
<line x1="750" y1="288" x2="750" y2="412" stroke="#888888" stroke-dasharray="4 3"/>
<rect x="30" y="290" width="800" height="22" fill="none" stroke="#bbbbbb"/>
<text x="30" y="307" font-size="16.6" fill="#222222" font-family="Courier New, monospace" xml:space="preserve" textLength="170" lengthAdjust="spacing">000100 MAIN-PARA.</text>
<rect x="30" y="314" width="800" height="22" fill="none" stroke="#bbbbbb"/>
<text x="30" y="331" font-size="16.6" fill="#222222" font-family="Courier New, monospace" xml:space="preserve" textLength="290" lengthAdjust="spacing">000200     MOVE 1 TO WS-COUNT</text>
<rect x="30" y="338" width="800" height="22" fill="none" stroke="#bbbbbb"/>
<text x="30" y="355" font-size="16.6" fill="#222222" font-family="Courier New, monospace" xml:space="preserve" textLength="230" lengthAdjust="spacing">000300*    comment line</text>
<rect x="30" y="362" width="800" height="22" fill="none" stroke="#bbbbbb"/>
<text x="30" y="379" font-size="16.6" fill="#222222" font-family="Courier New, monospace" xml:space="preserve" textLength="720" lengthAdjust="spacing">000400     DISPLAY &quot;A long literal that runs to column 72 and continues </text>
<rect x="30" y="386" width="800" height="22" fill="none" stroke="#bbbbbb"/>
<text x="30" y="403" font-size="16.6" fill="#222222" font-family="Courier New, monospace" xml:space="preserve" textLength="290" lengthAdjust="spacing">000500-    &quot;on the next line&quot;</text>
</svg>