<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-interaction-picking-controls-gpu-picking" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">GPU picking with an ID render target</text>
<rect x="20" y="70" width="160" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="96.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">1  Scene</text>
<text x="100.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">each book gets a</text>
<text x="100.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">unique flat colour</text>
<text x="100.0" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(id packed in RGB)</text>
<rect x="220" y="70" width="160" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="300.0" y="96.7" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">2  Render target</text>
<text x="300.0" y="111.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">1 pixel region under</text>
<text x="300.0" y="126.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">the pointer</text>
<text x="300.0" y="141.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">no anti-aliasing</text>
<rect x="420" y="70" width="150" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="495.0" y="104.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">3  Read pixel</text>
<text x="495.0" y="119.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">readRenderTargetPixels</text>
<text x="495.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">or async variant</text>
<rect x="610" y="70" width="130" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="675.0" y="96.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">4  Decode</text>
<text x="675.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">id = r*65536 +</text>
<text x="675.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">g*256 + b</text>
<text x="675.0" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">lookup the book</text>
<line x1="180" y1="115" x2="220" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-interaction-picking-controls-gpu-picking)"/>
<line x1="380" y1="115" x2="420" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-interaction-picking-controls-gpu-picking)"/>
<line x1="570" y1="115" x2="610" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-interaction-picking-controls-gpu-picking)"/>
<rect x="50" y="190" width="20" height="60" rx="2" fill="#F59E0B" stroke="#4B5563" stroke-width="1"/>
<rect x="74" y="190" width="20" height="60" rx="2" fill="#10B981" stroke="#4B5563" stroke-width="1"/>
<rect x="98" y="190" width="20" height="60" rx="2" fill="#6366F1" stroke="#4B5563" stroke-width="1"/>
<rect x="122" y="190" width="20" height="60" rx="2" fill="#EF4444" stroke="#4B5563" stroke-width="1"/>
<rect x="146" y="190" width="20" height="60" rx="2" fill="#0EA5E9" stroke="#4B5563" stroke-width="1"/>
<text x="110" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">id colours (flat, unlit)</text>
<rect x="260" y="185" width="460" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="490.0" y="214.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Raycaster: CPU, tests triangles, simple, cost grows with triangle count</text>
<text x="490.0" y="228.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU picking: pixel-exact, constant cost, needs an extra render pass</text>
<text x="490.0" y="242.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Raw WebGL track uses the same idea in the colour-ID picking step</text>
<text x="380" y="325" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Use a scissor or setViewOffset so only the pixel under the pointer is rasterised.</text>
</svg>
