<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Pressable state transitions</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">The state read back inside style={({ pressed }) =&gt; [...] } and the callbacks that drive each transition</text>

  <defs>
    <marker id="ps-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="ps-arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Idle state -->
  <rect x="60" y="150" width="150" height="70" rx="12" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="135" y="182" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Idle</text>
  <text x="135" y="200" font-size="9.5" fill="#1c4b73" text-anchor="middle">pressed: false</text>

  <!-- Pressed state -->
  <rect x="315" y="150" width="150" height="70" rx="12" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="390" y="182" font-size="14" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Pressed</text>
  <text x="390" y="200" font-size="9.5" fill="#8a5a1c" text-anchor="middle">pressed: true</text>

  <!-- LongPressed state -->
  <rect x="570" y="150" width="150" height="70" rx="12" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="645" y="176" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">LongPressed</text>
  <text x="645" y="194" font-size="9.5" fill="#2d6a34" text-anchor="middle">onLongPress fired</text>
  <text x="645" y="207" font-size="9.5" fill="#2d6a34" text-anchor="middle">pressed: true</text>

  <!-- Idle -> Pressed -->
  <line x1="210" y1="172" x2="313" y2="172" stroke="#333333" stroke-width="1.5" marker-end="url(#ps-arrow)"/>
  <text x="261" y="163" font-size="9.5" fill="#333333" text-anchor="middle">press in</text>
  <text x="261" y="150" font-size="9" fill="#666666" text-anchor="middle">(onPressIn)</text>

  <!-- Pressed -> Idle -->
  <line x1="313" y1="198" x2="210" y2="198" stroke="#333333" stroke-width="1.5" marker-end="url(#ps-arrow)"/>
  <text x="261" y="216" font-size="9.5" fill="#333333" text-anchor="middle">press out / release</text>
  <text x="261" y="228" font-size="9" fill="#666666" text-anchor="middle">(onPressOut, onPress)</text>

  <!-- Pressed -> LongPressed -->
  <line x1="465" y1="172" x2="568" y2="172" stroke="#333333" stroke-width="1.5" marker-end="url(#ps-arrow)"/>
  <text x="517" y="163" font-size="9.5" fill="#333333" text-anchor="middle">hold elapsed</text>
  <text x="517" y="150" font-size="9" fill="#666666" text-anchor="middle">(onLongPress)</text>

  <!-- LongPressed -> Idle (curved back, release) -->
  <path d="M 645 220 C 645 300, 135 300, 135 220" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ps-arrow)"/>
  <text x="390" y="298" font-size="9.5" fill="#333333" text-anchor="middle">release after long-press</text>

  <!-- Disabled state -->
  <rect x="315" y="320" width="150" height="70" rx="12" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="390" y="352" font-size="14" font-weight="bold" fill="#a33333" text-anchor="middle">Disabled</text>
  <text x="390" y="370" font-size="9.5" fill="#a33333" text-anchor="middle">all input ignored</text>

  <!-- Idle -> Disabled -->
  <path d="M 155 220 C 155 300, 315 340, 313 350" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ps-arrow-gray)"/>
  <text x="185" y="290" font-size="9" fill="#999999" text-anchor="middle">disabled: true</text>

  <!-- Disabled -> Idle -->
  <path d="M 315 335 C 200 320, 60 280, 118 222" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ps-arrow-gray)"/>
  <text x="160" y="355" font-size="9" fill="#999999" text-anchor="middle">disabled: false</text>

  <!-- Disabled self loop -->
  <path d="M 465 340 C 520 320, 520 300, 468 320" fill="none" stroke="#a33333" stroke-width="1.3" marker-end="url(#ps-arrow)"/>
  <text x="560" y="313" font-size="9" fill="#a33333" text-anchor="middle">onPress never fires</text>

  <text x="390" y="410" font-size="10" fill="#666666" text-anchor="middle">A style function reads this same state directly: style={({ pressed }) =&gt; [base, pressed &amp;&amp; pressedStyle]}</text>
</svg>
