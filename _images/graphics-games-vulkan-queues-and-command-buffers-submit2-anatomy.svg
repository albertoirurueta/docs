<text x="385.0" y="118.8" text-anchor="middle" font-size="11" fill="#92400E">stageMask, deviceIndex</text>
<rect x="280" y="160" width="210" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="385.0" y="188.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">VkCommandBufferSubmitInfo</text>
<text x="385.0" y="203.8" text-anchor="middle" font-size="11" fill="#065F46">commandBuffer</text>
<text x="385.0" y="218.8" text-anchor="middle" font-size="11" fill="#065F46">deviceMask</text>
<rect x="280" y="260" width="210" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="385.0" y="288.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">VkSemaphoreSubmitInfo</text>
<text x="385.0" y="303.9" text-anchor="middle" font-size="11" fill="#92400E">signal: binary or timeline</text>
<text x="385.0" y="318.9" text-anchor="middle" font-size="11" fill="#92400E">stageMask limits the signal</text>
