<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-qcb-sub2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">vkQueueSubmit2 and the structures it takes</text>
<rect x="20" y="60" width="200" height="300" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="150.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">VkSubmitInfo2</text>
<text x="120.0" y="166.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="120.0" y="182.2" text-anchor="middle" font-size="12" fill="#3730A3">flags</text>
<text x="120.0" y="198.2" text-anchor="middle" font-size="12" fill="#3730A3">waitSemaphoreInfoCount</text>
<text x="120.0" y="214.2" text-anchor="middle" font-size="12" fill="#3730A3">pWaitSemaphoreInfos</text>
<text x="120.0" y="230.2" text-anchor="middle" font-size="12" fill="#3730A3">commandBufferInfoCount</text>
<text x="120.0" y="246.2" text-anchor="middle" font-size="12" fill="#3730A3">pCommandBufferInfos</text>
<text x="120.0" y="262.2" text-anchor="middle" font-size="12" fill="#3730A3">signalSemaphoreInfoCount</text>
<text x="120.0" y="278.2" text-anchor="middle" font-size="12" fill="#3730A3">pSignalSemaphoreInfos</text>
