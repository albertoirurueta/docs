<line x1="220" y1="235" x2="278" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-sub2)"/>
<line x1="220" y1="310" x2="278" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-sub2)"/>
<text x="255" y="125" text-anchor="middle" font-size="10" fill="#374151">wait</text>
<text x="255" y="225" text-anchor="middle" font-size="10" fill="#374151">record</text>
<text x="255" y="297" text-anchor="middle" font-size="10" fill="#374151">signal</text>
<rect x="550" y="100" width="190" height="180" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="154.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">VkQueue</text>
<text x="645.0" y="170.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="645.0" y="186.2" text-anchor="middle" font-size="12" fill="#374151">runs the buffers in</text>
<text x="645.0" y="202.2" text-anchor="middle" font-size="12" fill="#374151">submission order, with</text>
<text x="645.0" y="218.2" text-anchor="middle" font-size="12" fill="#374151">the waits before and the</text>
<text x="645.0" y="234.2" text-anchor="middle" font-size="12" fill="#374151">signals after</text>
<line x1="490" y1="200" x2="548" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-sub2)"/>
<text x="645" y="310" text-anchor="middle" font-size="11" fill="#4B5563">optional VkFence</text>
<line x1="645" y1="300" x2="645" y2="284" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-sub2)"/>
<text x="380" y="390" text-anchor="middle" font-size="11" fill="#374151">Wait stageMask: which stages must wait. Signal stageMask: after which stages the signal fires.</text>
</svg>
