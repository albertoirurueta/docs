<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Count-based and time-based sliding windows</text>
  <defs>
    <marker id="sw-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>
  <rect x="20" y="46" width="420" height="338" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="230" y="70" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">COUNT_BASED, slidingWindowSize = 10</text>
  <text x="230" y="87" font-size="10.5" fill="#666666" text-anchor="middle">the last 10 calls, however old they are</text>
  <rect x="460" y="46" width="420" height="338" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="670" y="70" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">TIME_BASED, slidingWindowSize = 10</text>
  <text x="670" y="87" font-size="10.5" fill="#666666" text-anchor="middle">the calls of the last 10 seconds, one bucket per second</text>
  <rect x="30" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="48.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ok</text>
  <text x="48.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">0</text>
  <rect x="70" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="88.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ok</text>
  <text x="88.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">1</text>
  <rect x="110" y="150" width="37" height="40" rx="4" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="128.5" y="175" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
  <text x="128.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">2</text>
  <rect x="150" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="168.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ok</text>
  <text x="168.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">3</text>
  <rect x="190" y="150" width="37" height="40" rx="4" fill="#cfe0ef" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="208.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">sl</text>
  <text x="208.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">4</text>
  <rect x="230" y="150" width="37" height="40" rx="4" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="248.5" y="175" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
  <text x="248.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">5</text>
  <rect x="270" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="288.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ok</text>
  <text x="288.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">6</text>
  <rect x="310" y="150" width="37" height="40" rx="4" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="328.5" y="175" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
  <text x="328.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">7</text>
  <rect x="350" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="368.5" y="175" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ok</text>
  <text x="368.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">8</text>
  <rect x="390" y="150" width="37" height="40" rx="4" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="408.5" y="175" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
  <text x="408.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">9</text>
  <text x="30" y="116" font-size="10.5" fill="#222222">oldest</text>
  <text x="30" y="128" font-size="10" fill="#666666">(evicted next)</text>
  <line x1="48" y1="134" x2="48" y2="147" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="408.5" y="124" font-size="10.5" fill="#222222" text-anchor="middle">newest</text>
  <line x1="408.5" y1="128" x2="408.5" y2="147" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="230" y="222" font-size="10.5" fill="#444444" text-anchor="middle">a circular array of 10 slots: a new call overwrites the oldest one</text>
  <text x="230" y="237" font-size="10" fill="#666666" text-anchor="middle">F = failed, sl = slow but successful, ok = fast success</text>
  <rect x="36" y="250" width="388" height="52" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="230" y="270" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Running total: 10 calls, 4 failed, 1 slow</text>
  <text x="230" y="288" font-size="10.5" fill="#444444" text-anchor="middle">failureRate 40 % | slowCallRate 10 % | subtract on evict</text>
  <text x="46" y="326" font-size="10.5" fill="#222222">&#8226; Memory: 10 slots, fixed, O(N)</text>
  <text x="46" y="343" font-size="10.5" fill="#222222">&#8226; Reading the rates: O(1), pre-aggregated</text>
  <text x="46" y="360" font-size="10.5" fill="#222222">&#8226; minimumNumberOfCalls is capped to the window size</text>
  <rect x="470" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="488.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <text x="488.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">1 F</text>
  <text x="488.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-9</text>
  <rect x="510" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="528.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <text x="528.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">2 F</text>
  <text x="528.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-8</text>
  <rect x="550" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="568.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">0</text>
  <text x="568.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">0 F</text>
  <text x="568.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-7</text>
  <rect x="590" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="608.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <text x="608.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">1 F</text>
  <text x="608.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-6</text>
  <rect x="630" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="648.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">6</text>
  <text x="648.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">3 F</text>
  <text x="648.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-5</text>
  <rect x="670" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="688.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <text x="688.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">0 F</text>
  <text x="688.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-4</text>
  <rect x="710" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="728.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <text x="728.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">2 F</text>
  <text x="728.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-3</text>
  <rect x="750" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="768.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <text x="768.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">1 F</text>
  <text x="768.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-2</text>
  <rect x="790" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="808.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <text x="808.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">1 F</text>
  <text x="808.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t-1</text>
  <rect x="830" y="150" width="37" height="40" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="848.5" y="166" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">8</text>
  <text x="848.5" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">3 F</text>
  <text x="848.5" y="204" font-size="9.5" fill="#666666" text-anchor="middle">t</text>
  <text x="470" y="116" font-size="10.5" fill="#222222">oldest second</text>
  <text x="470" y="128" font-size="10" fill="#666666">(leaves next)</text>
  <line x1="488" y1="134" x2="488" y2="147" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="866" y="124" font-size="10.5" fill="#222222" text-anchor="end">current second</text>
  <line x1="848.5" y1="128" x2="848.5" y2="147" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="670" y="222" font-size="10.5" fill="#444444" text-anchor="middle">each bucket: calls made in one epoch second, and how many failed</text>
  <text x="670" y="237" font-size="10" fill="#666666" text-anchor="middle">calls in the same second share a bucket; idle seconds are empty buckets</text>
  <rect x="476" y="250" width="388" height="52" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="670" y="270" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Running total: 40 calls, 14 failed</text>
  <text x="670" y="288" font-size="10.5" fill="#444444" text-anchor="middle">failureRate 35 % | a bucket is subtracted when it expires</text>
  <text x="486" y="326" font-size="10.5" fill="#222222">&#8226; Memory: 10 buckets, whatever the traffic, O(N)</text>
  <text x="486" y="343" font-size="10.5" fill="#222222">&#8226; Reading the rates: O(1) after moving the window</text>
  <text x="486" y="360" font-size="10.5" fill="#222222">&#8226; minimumNumberOfCalls may exceed the window size</text>
  <rect x="20" y="400" width="860" height="80" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="450" y="422" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Same rule for both windows</text>
  <text x="450" y="441" font-size="10.5" fill="#444444" text-anchor="middle">failureRate = failed / total calls  |  slowCallRate = slow / total calls  |  both read -1 until minimumNumberOfCalls is reached</text>
  <text x="450" y="458" font-size="10.5" fill="#444444" text-anchor="middle">the circuit opens when either rate is greater than or equal to its threshold (failureRateThreshold, slowCallRateThreshold)</text>
  <text x="450" y="474" font-size="10" fill="#666666" text-anchor="middle">HALF_OPEN always uses its own small count-based window of permittedNumberOfCallsInHalfOpenState calls</text>
</svg>
