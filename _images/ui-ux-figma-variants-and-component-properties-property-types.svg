<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four property types, four jobs</text>
  <g fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"><rect x="20" y="50" width="170" height="220" rx="10"/><rect x="200" y="50" width="170" height="220" rx="10"/><rect x="380" y="50" width="170" height="220" rx="10"/><rect x="560" y="50" width="170" height="220" rx="10"/></g>
  <g font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="105" y="76">Variant</text><text x="285" y="76">Boolean</text><text x="465" y="76">Text</text><text x="645" y="76">Instance swap</text></g>
  <g font-size="11" fill="#374151" text-anchor="middle"><text x="105" y="98">Chooses one variant</text><text x="105" y="114">Type, State</text><text x="285" y="98">Shows or hides</text><text x="285" y="114">one layer</text><text x="465" y="98">Edits a string</text><text x="465" y="114">without detaching</text><text x="645" y="98">Replaces a nested</text><text x="645" y="114">instance, e.g. icon</text></g>
  <rect x="45" y="140" width="120" height="30" rx="15" fill="#4F46E5"/><rect x="45" y="184" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#4F46E5"/><text x="105" y="240" font-size="11" fill="#374151" text-anchor="middle">Dropdown in sidebar</text>
  <rect x="225" y="150" width="120" height="30" rx="15" fill="#4F46E5"/><circle cx="246" cy="165" r="6" fill="#FFFFFF"/><rect x="225" y="190" width="120" height="30" rx="15" fill="#4F46E5"/><text x="285" y="240" font-size="11" fill="#374151" text-anchor="middle">Toggle in sidebar</text>
  <rect x="405" y="150" width="120" height="30" rx="15" fill="#4F46E5"/><text x="465" y="170" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to shelf</text><rect x="405" y="190" width="120" height="30" rx="15" fill="#4F46E5"/><text x="465" y="210" font-size="12" fill="#FFFFFF" text-anchor="middle">Reserve</text><text x="465" y="240" font-size="11" fill="#374151" text-anchor="middle">Text field in sidebar</text>
  <rect x="585" y="140" width="120" height="30" rx="15" fill="#4F46E5"/><circle cx="607" cy="155" r="7" fill="#FFFFFF"/><rect x="585" y="184" width="120" height="30" rx="15" fill="#4F46E5"/><rect x="600" y="192" width="14" height="14" fill="#FFFFFF"/><text x="645" y="240" font-size="11" fill="#374151" text-anchor="middle">Swap menu, preferred first</text>
  <text x="380" y="298" font-size="12" fill="#374151" text-anchor="middle">Applied properties appear as purple pills on the layer they control.</text>
  <text x="380" y="318" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, not a screenshot of the Figma interface.</text>
</svg>
