<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">The Bookshelf VPC: one global network, regional subnets and private paths</text>

  <!-- Internet -->
  <rect x="330" y="40" width="240" height="34" rx="17" fill="#fff8e6" stroke="#b06a00" stroke-width="1.6"/>
  <text x="450" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Internet and external clients</text>

  <!-- VPC -->
  <rect x="20" y="96" width="860" height="330" rx="14" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="38" y="118" font-size="13" font-weight="700" fill="#3c4a58">VPC network bookshelf-vpc (custom mode, global)</text>

  <!-- Region -->
  <rect x="38" y="132" width="520" height="280" rx="10" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="52" y="152" font-size="12" font-weight="700" fill="#123a72">Region us-central1</text>

  <!-- subnets -->
  <rect x="54" y="166" width="236" height="104" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="66" y="186" font-size="12" font-weight="700" fill="#123a72">Subnet app-us-central1</text>
  <text x="66" y="202" font-size="10.5" fill="#3c4a58">10.10.0.0/20, Private Google Access on</text>
  <text x="66" y="217" font-size="10.5" fill="#3c4a58">secondary ranges: pods, services</text>
  <rect x="66" y="228" width="98" height="30" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="115" y="247" text-anchor="middle" font-size="11" fill="#123a72">GKE cluster</text>
  <rect x="174" y="228" width="104" height="30" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="226" y="247" text-anchor="middle" font-size="11" fill="#123a72">Cloud Run egress</text>

  <rect x="306" y="166" width="236" height="104" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.6"/>
  <text x="318" y="186" font-size="12" font-weight="700" fill="#14572f">Subnet data-us-central1</text>
  <text x="318" y="202" font-size="10.5" fill="#3c4a58">10.10.16.0/24, flow logs on</text>
  <text x="318" y="217" font-size="10.5" fill="#3c4a58">firewall: only from app tag</text>
  <rect x="318" y="228" width="100" height="30" rx="5" fill="#d3ecdc" stroke="#1e7e45"/>
  <text x="368" y="247" text-anchor="middle" font-size="11" fill="#14572f">Cloud SQL (PSA)</text>
  <rect x="428" y="228" width="104" height="30" rx="5" fill="#d3ecdc" stroke="#1e7e45"/>
  <text x="480" y="247" text-anchor="middle" font-size="11" fill="#14572f">PSC endpoint</text>

  <!-- Cloud Router / NAT -->
  <rect x="54" y="290" width="236" height="58" rx="8" fill="#fff8e6" stroke="#b06a00" stroke-width="1.6"/>
  <text x="66" y="311" font-size="12" font-weight="700" fill="#7a4800">Cloud Router + Cloud NAT</text>
  <text x="66" y="328" font-size="10.5" fill="#3c4a58">outbound only, 2 reserved static IPs</text>
  <text x="66" y="341" font-size="10.5" fill="#3c4a58">no inbound connections from the internet</text>

  <!-- Firewall -->
  <rect x="306" y="290" width="236" height="58" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.6"/>
  <text x="318" y="311" font-size="12" font-weight="700" fill="#7f1d17">Network firewall policy</text>
  <text x="318" y="328" font-size="10.5" fill="#3c4a58">implied deny ingress, allow egress;</text>
  <text x="318" y="341" font-size="10.5" fill="#3c4a58">allow IAP range 35.235.240.0/20 on 22</text>

  <rect x="54" y="362" width="488" height="36" rx="8" fill="#f0f0f4" stroke="#6b6b80" stroke-width="1.4"/>
  <text x="298" y="385" text-anchor="middle" font-size="11.5" fill="#33334a">Routes: subnet routes (automatic) + default route 0.0.0.0/0 to the internet gateway</text>

  <!-- Right column -->
  <rect x="590" y="132" width="272" height="86" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="604" y="154" font-size="12" font-weight="700" fill="#123a72">Google APIs and services</text>
  <text x="604" y="172" font-size="10.5" fill="#3c4a58">Private Google Access (googleapis.com)</text>
  <text x="604" y="187" font-size="10.5" fill="#3c4a58">PSC endpoint 10.10.16.5 for all-apis</text>
  <text x="604" y="202" font-size="10.5" fill="#3c4a58">VPC Service Controls perimeter around it</text>

  <rect x="590" y="232" width="272" height="70" rx="10" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.6"/>
  <text x="604" y="254" font-size="12" font-weight="700" fill="#14572f">Private Service Access range</text>
  <text x="604" y="272" font-size="10.5" fill="#3c4a58">10.20.0.0/16 reserved, peered with the</text>
  <text x="604" y="287" font-size="10.5" fill="#3c4a58">Google-managed VPC of Cloud SQL</text>

  <rect x="590" y="316" width="272" height="82" rx="10" fill="#f3ecfb" stroke="#6a3fb0" stroke-width="1.6"/>
  <text x="604" y="338" font-size="12" font-weight="700" fill="#42257a">Other networks (non-transitive)</text>
  <text x="604" y="356" font-size="10.5" fill="#3c4a58">VPC Network Peering to partner-vpc</text>
  <text x="604" y="371" font-size="10.5" fill="#3c4a58">Shared VPC host project for service projects</text>
  <text x="604" y="386" font-size="10.5" fill="#3c4a58">HA VPN to on-premises (separate page)</text>

  <!-- arrows -->
  <line x1="450" y1="74" x2="450" y2="96" stroke="#b06a00" stroke-width="2"/>
  <polygon points="450,98 444,88 456,88" fill="#b06a00"/>
  <line x1="172" y1="270" x2="172" y2="290" stroke="#b06a00" stroke-width="2"/>
  <polygon points="172,292 166,282 178,282" fill="#b06a00"/>
  <line x1="542" y1="190" x2="588" y2="190" stroke="#1a5fb4" stroke-width="2"/>
  <polygon points="590,190 580,184 580,196" fill="#1a5fb4"/>
  <line x1="542" y1="260" x2="588" y2="260" stroke="#1e7e45" stroke-width="2"/>
  <polygon points="590,260 580,254 580,266" fill="#1e7e45"/>

  <!-- footer -->
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#3c4a58">Subnets are regional and the VPC is global: a VM in any region reaches any subnet over internal IPs, subject to firewall rules.</text>
  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#3c4a58">Private Google Access and Private Service Connect keep API traffic off the public internet; Cloud NAT covers everything else outbound.</text>
  <text x="450" y="492" text-anchor="middle" font-size="11" fill="#6b6b80">Illustrative addresses; reserve ranges that do not overlap your other networks.</text>
</svg>
