<svg viewBox="0 0 760 452" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="452" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two ways to relate parent and child documents in Lucene</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">A shared field value resolved at query time, or one contiguous indexed block</text>

  <line x1="380" y1="60" x2="380" y2="356" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: query-time join -->
  <text x="197" y="80" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">query-time join &#8212; linked by a field value</text>

  <rect x="30" y="92" width="330" height="252" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>

  <text x="44" y="112" font-size="10.5" fill="#666666">child docs (any segment)</text>
  <rect x="44" y="120" width="205" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="54" y="139" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">{ id: "o-1", cust: "c-1" }</text>
  <rect x="44" y="156" width="205" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="54" y="175" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">{ id: "o-2", cust: "c-1" }</text>

  <text x="44" y="207" font-family="'Courier New', monospace" font-size="9.5" fill="#1c4b73">JoinUtil.createJoinQuery("cust" &#8594; "id")</text>

  <text x="44" y="232" font-size="10.5" fill="#666666">parent docs (any segment)</text>
  <rect x="44" y="240" width="205" height="30" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="54" y="259" font-family="'Courier New', monospace" font-size="10.5" fill="#222222">{ id: "c-1", name: "Alice" }</text>

  <!-- join connector: child "cust" value -> parent "id" value -->
  <g stroke="#1c4b73" stroke-width="1.4" fill="none">
    <path d="M249,171 H300 V255 H253"/>
  </g>
  <polygon points="257,251 257,259 249,255" fill="#1c4b73"/>

  <text x="44" y="292" font-size="10.5" fill="#666666">Docs indexed independently, in any order.</text>
  <text x="44" y="308" font-size="10.5" fill="#666666">Match resolved per query via global ordinals.</text>
  <text x="44" y="324" font-size="10.5" fill="#666666">Update either side alone; may span two indexes.</text>

  <!-- RIGHT: block join -->
  <text x="563" y="80" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">block join &#8212; one parent + children block</text>

  <rect x="400" y="92" width="330" height="252" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="112" font-size="10.5" fill="#666666">one segment &#8212; adjacent doc ids, parent LAST</text>

  <!-- grouping bracket -->
  <path d="M470,120 H462 V208 H470" stroke="#999999" stroke-width="1.2" fill="none"/>

  <rect x="474" y="120" width="220" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="484" y="138" font-family="'Courier New', monospace" font-size="10" fill="#222222">docId 40  { child: "M", qty: 2 }</text>
  <rect x="474" y="150" width="220" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="484" y="168" font-family="'Courier New', monospace" font-size="10" fill="#222222">docId 41  { child: "L", qty: 1 }</text>
  <rect x="474" y="180" width="220" height="28" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="484" y="198" font-family="'Courier New', monospace" font-size="10" fill="#222222">docId 42  { parent: "Jacket" }</text>

  <text x="462" y="228" font-family="'Courier New', monospace" font-size="9.5" fill="#2f5424">writer.addDocuments(child, child, parent)</text>

  <!-- parents filter bitset -->
  <text x="462" y="252" font-size="10.5" fill="#666666">parentsFilter bitset over the segment</text>
  <g font-family="'Courier New', monospace" font-size="11" fill="#222222">
    <rect x="462" y="258" width="24" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <text x="471" y="274">0</text>
    <rect x="486" y="258" width="24" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <text x="495" y="274">0</text>
    <rect x="510" y="258" width="24" height="22" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
    <text x="519" y="274" fill="#2f5424">1</text>
  </g>
  <text x="542" y="274" font-size="10" fill="#999999">&#8592; bit set on each parent doc id</text>

  <text x="414" y="300" font-size="10.5" fill="#666666">Written together; children, then parent, contiguous.</text>
  <text x="414" y="316" font-size="10.5" fill="#666666">ToParentBlockJoinQuery / ToChildBlockJoinQuery.</text>
  <text x="414" y="332" font-size="10.5" fill="#666666">Change one child &#8594; re-index the whole block.</text>

  <!-- decision strip -->
  <rect x="30" y="366" width="700" height="74" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="44" y="390" font-size="12.5" font-weight="bold" fill="#222222">Choosing</text>
  <text x="44" y="414" font-size="11.5" fill="#222222">Children churn, are written on their own, or live in another index?&#160;&#160;&#8226;&#160;&#160;Bounded child set, always written with its parent?</text>
  <text x="44" y="432" font-size="12" font-weight="bold" fill="#1c4b73">&#8594; query-time join</text>
  <text x="240" y="432" font-size="12" font-weight="bold" fill="#2f5424">&#8594; block join</text>
</svg>
