<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Styles and variables compared</text>
<rect x="20" y="48" width="340" height="262" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="190" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730A3">Styles</text>
<rect x="40" y="92" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190" y="120" text-anchor="middle" font-size="13" fill="#374151">Bundle of properties (type, effect, grid)</text>
<rect x="40" y="148" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190" y="176" text-anchor="middle" font-size="13" fill="#374151">Several values under one name</text>
<rect x="40" y="204" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190" y="232" text-anchor="middle" font-size="13" fill="#374151">One definition per style, no modes</text>
<text x="190" y="280" text-anchor="middle" font-size="12" fill="#3730A3">Best for: text, effects, layout guides</text>
<rect x="380" y="48" width="340" height="262" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="550" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400E">Variables</text>
<rect x="400" y="92" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="550" y="120" text-anchor="middle" font-size="13" fill="#374151">Single values: color, number, string, boolean</text>
<rect x="400" y="148" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="550" y="176" text-anchor="middle" font-size="13" fill="#374151">Collections with modes (light, dark, brand)</text>
<rect x="400" y="204" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="550" y="232" text-anchor="middle" font-size="13" fill="#374151">Values can alias other values</text>
<text x="550" y="280" text-anchor="middle" font-size="12" fill="#92400E">Best for: colors, spacing, theming</text>
</svg>
