<svg viewBox="0 0 800 440" width="800" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrAir" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Airspace: one pixel, one renderer</text>
  <text x="400" y="48" font-size="13" fill="#666666" text-anchor="middle">A hosted HWND owns its rectangle of the WPF window. WPF cannot draw over it or blend with it.</text>

  <!-- Left: window with regions -->
  <rect x="20" y="64" width="370" height="360" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="205" y="88" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">One top-level window, several regions</text>

  <rect x="40" y="104" width="330" height="40" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="205" y="128" font-size="12" fill="#222222" text-anchor="middle">WPF region (HwndSource): toolbar, Bookshelf Desktop book list</text>

  <rect x="40" y="152" width="150" height="190" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="115" y="248" font-size="12" fill="#222222" text-anchor="middle">WPF region</text>
  <text x="115" y="266" font-size="12" fill="#222222" text-anchor="middle">DataGrid</text>

  <rect x="200" y="152" width="170" height="190" rx="6" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="285" y="220" font-size="12" font-weight="bold" fill="#7a5a10" text-anchor="middle">Child HWND region</text>
  <text x="285" y="240" font-size="12" fill="#222222" text-anchor="middle">WebView2, WindowsFormsHost,</text>
  <text x="285" y="258" font-size="12" fill="#222222" text-anchor="middle">HwndHost, native control</text>

  <rect x="40" y="350" width="330" height="60" rx="6" fill="#ffffff" stroke="#a02020" stroke-dasharray="5 4"/>
  <text x="205" y="372" font-size="12" font-weight="bold" fill="#a02020" text-anchor="middle">Not possible</text>
  <text x="205" y="390" font-size="12" fill="#333333" text-anchor="middle">A WPF popup, glow or semi-transparent overlay</text>
  <text x="205" y="406" font-size="12" fill="#333333" text-anchor="middle">drawn inside the amber rectangle</text>

  <!-- Right: rules -->
  <rect x="410" y="64" width="370" height="360" rx="12" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="595" y="88" font-size="15" font-weight="bold" fill="#7a5a10" text-anchor="middle">What the hosted HWND does to WPF</text>

  <rect x="430" y="104" width="330" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="595" y="123" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Z-order</text>
  <text x="595" y="139" font-size="11" fill="#333333" text-anchor="middle">Always on top of WPF elements in the same window</text>

  <rect x="430" y="158" width="330" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="595" y="177" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Transforms, Opacity, FlowDirection</text>
  <text x="595" y="193" font-size="11" fill="#333333" text-anchor="middle">Not applied to the hosted content</text>

  <rect x="430" y="212" width="330" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="595" y="231" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Clipping</text>
  <text x="595" y="247" font-size="11" fill="#333333" text-anchor="middle">Parent clip ignored (ScrollViewer, Canvas)</text>

  <rect x="430" y="266" width="330" height="44" rx="6" fill="#f8e9c4" stroke="#a07820"/>
  <text x="595" y="285" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Input</text>
  <text x="595" y="301" font-size="11" fill="#333333" text-anchor="middle">Mouse and keyboard go straight to Win32, no WPF events</text>

  <rect x="430" y="320" width="330" height="44" rx="6" fill="#ffffff" stroke="#2a6a2a" stroke-dasharray="4 3"/>
  <text x="595" y="339" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Still works on top</text>
  <text x="595" y="355" font-size="11" fill="#333333" text-anchor="middle">ToolTip and ContextMenu (own top-level windows)</text>

  <text x="595" y="392" font-size="12" fill="#333333" text-anchor="middle">Design around it: put WPF chrome beside the hosted</text>
  <text x="595" y="410" font-size="12" fill="#333333" text-anchor="middle">region, not over it, or use a separate window.</text>

  <line x1="372" y1="247" x2="408" y2="247" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrAir)"/>
</svg>
