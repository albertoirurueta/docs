<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 864 588" width="860" height="588" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Magento 2 code layers</title>
  <desc id="d">Three entry points (pub/index.php for HTTP, bin/magento for the console and cron, pub/static.php and pub/get.php for static files and media) start the Framework. The Framework serves modules organised in four layers: presentation, service, domain and persistence. Themes and language packs sit beside the modules. Modules read and write MariaDB or MySQL, OpenSearch, Valkey and the filesystem. A configuration column on the right shows config.php, env.php and the di.xml files that configure every layer.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- entry points -->
  <rect x="20" y="20" width="205" height="76" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="122" y="44" text-anchor="middle" font-weight="bold">pub/index.php</text>
  <text x="122" y="64" text-anchor="middle" font-size="12">storefront, Admin, REST,</text>
  <text x="122" y="80" text-anchor="middle" font-size="12">SOAP, GraphQL</text>

  <rect x="245" y="20" width="205" height="76" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="44" text-anchor="middle" font-weight="bold">bin/magento</text>
  <text x="347" y="64" text-anchor="middle" font-size="12">console commands,</text>
  <text x="347" y="80" text-anchor="middle" font-size="12">cron:run, queue consumers</text>

  <rect x="470" y="20" width="205" height="76" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="572" y="44" text-anchor="middle" font-weight="bold">pub/static.php, pub/get.php</text>
  <text x="572" y="64" text-anchor="middle" font-size="12">static files and media</text>
  <text x="572" y="80" text-anchor="middle" font-size="12">on demand</text>

  <line x1="122" y1="96" x2="122" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="347" y1="96" x2="347" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="572" y1="96" x2="572" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- framework -->
  <rect x="20" y="128" width="655" height="66" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="152" text-anchor="middle" font-weight="bold">Framework   (Magento\Framework, package magento/framework)</text>
  <text x="347" y="174" text-anchor="middle" font-size="12">Bootstrap, App\Http, State and AreaList, ObjectManager, Interception, Event, View, Config, Setup</text>

  <line x1="347" y1="194" x2="347" y2="222" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- modules -->
  <rect x="20" y="224" width="520" height="236" rx="12" fill="#1abc9c" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="246" text-anchor="middle" font-weight="bold">Modules   (Magento_*, Vendor_Module in vendor/ or app/code/)</text>

  <rect x="34" y="260" width="236" height="88" rx="10" fill="#1abc9c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
  <text x="152" y="282" text-anchor="middle" font-weight="bold">Presentation</text>
  <text x="152" y="302" text-anchor="middle" font-size="12">Controller, Block, ViewModel,</text>
  <text x="152" y="318" text-anchor="middle" font-size="12">layout XML, templates,</text>
  <text x="152" y="334" text-anchor="middle" font-size="12">UI components</text>

  <rect x="290" y="260" width="236" height="88" rx="10" fill="#1abc9c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
  <text x="408" y="282" text-anchor="middle" font-weight="bold">Service</text>
  <text x="408" y="302" text-anchor="middle" font-size="12">Api/ interfaces, Api/Data,</text>
  <text x="408" y="318" text-anchor="middle" font-size="12">repositories, webapi.xml,</text>
  <text x="408" y="334" text-anchor="middle" font-size="12">schema.graphqls</text>

  <rect x="34" y="364" width="236" height="84" rx="10" fill="#1abc9c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
  <text x="152" y="386" text-anchor="middle" font-weight="bold">Domain</text>
  <text x="152" y="406" text-anchor="middle" font-size="12">Model, Observer, Plugin,</text>
  <text x="152" y="422" text-anchor="middle" font-size="12">Helper, business rules</text>

  <rect x="290" y="364" width="236" height="84" rx="10" fill="#1abc9c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
  <text x="408" y="386" text-anchor="middle" font-weight="bold">Persistence</text>
  <text x="408" y="406" text-anchor="middle" font-size="12">ResourceModel, Collection,</text>
  <text x="408" y="422" text-anchor="middle" font-size="12">db_schema.xml, patches</text>

  <!-- themes and language packs -->
  <rect x="556" y="224" width="119" height="236" rx="12" fill="#f1c40f" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="615" y="248" text-anchor="middle" font-weight="bold">Themes</text>
  <text x="615" y="268" text-anchor="middle" font-size="12">app/design,</text>
  <text x="615" y="284" text-anchor="middle" font-size="12">theme-frontend-*</text>
  <text x="615" y="320" text-anchor="middle" font-weight="bold">Language packs</text>
  <text x="615" y="340" text-anchor="middle" font-size="12">app/i18n,</text>
  <text x="615" y="356" text-anchor="middle" font-size="12">language-*</text>
  <text x="615" y="392" text-anchor="middle" font-weight="bold">Libraries</text>
  <text x="615" y="412" text-anchor="middle" font-size="12">lib/internal,</text>
  <text x="615" y="428" text-anchor="middle" font-size="12">vendor/*</text>

  <line x1="280" y1="460" x2="280" y2="488" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- stores -->
  <rect x="20" y="490" width="150" height="62" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="95" y="515" text-anchor="middle" font-weight="bold">MariaDB or MySQL</text>
  <text x="95" y="535" text-anchor="middle" font-size="12">catalog, orders, config</text>
  <rect x="190" y="490" width="150" height="62" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="265" y="515" text-anchor="middle" font-weight="bold">OpenSearch</text>
  <text x="265" y="535" text-anchor="middle" font-size="12">search index</text>
  <rect x="360" y="490" width="150" height="62" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="515" text-anchor="middle" font-weight="bold">Valkey</text>
  <text x="435" y="535" text-anchor="middle" font-size="12">cache, sessions, locks</text>
  <rect x="530" y="490" width="145" height="62" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="602" y="515" text-anchor="middle" font-weight="bold">Filesystem</text>
  <text x="602" y="535" text-anchor="middle" font-size="12">var, generated, pub</text>

  <!-- configuration column -->
  <rect x="705" y="20" width="145" height="532" rx="12" fill="#e74c3c" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="777" y="46" text-anchor="middle" font-weight="bold">Configuration</text>
  <text x="777" y="82" text-anchor="middle" font-weight="bold" font-size="12">app/etc/config.php</text>
  <text x="777" y="100" text-anchor="middle" font-size="11">module list, shared</text>
  <text x="777" y="114" text-anchor="middle" font-size="11">settings (in Git)</text>
  <text x="777" y="150" text-anchor="middle" font-weight="bold" font-size="12">app/etc/env.php</text>
  <text x="777" y="168" text-anchor="middle" font-size="11">database, cache, queue,</text>
  <text x="777" y="182" text-anchor="middle" font-size="11">mode, crypt key (per</text>
  <text x="777" y="196" text-anchor="middle" font-size="11">environment, not in Git)</text>
  <text x="777" y="232" text-anchor="middle" font-weight="bold" font-size="12">core_config_data</text>
  <text x="777" y="250" text-anchor="middle" font-size="11">Stores &gt; Configuration</text>
  <text x="777" y="264" text-anchor="middle" font-size="11">values per scope</text>
  <text x="777" y="300" text-anchor="middle" font-weight="bold" font-size="12">etc/config.xml</text>
  <text x="777" y="318" text-anchor="middle" font-size="11">module defaults</text>
  <text x="777" y="354" text-anchor="middle" font-weight="bold" font-size="12">etc/di.xml</text>
  <text x="777" y="372" text-anchor="middle" font-size="11">primary, global and</text>
  <text x="777" y="386" text-anchor="middle" font-size="11">per-area wiring</text>
  <text x="777" y="422" text-anchor="middle" font-weight="bold" font-size="12">etc/*.xml</text>
  <text x="777" y="440" text-anchor="middle" font-size="11">events, routes, webapi,</text>
  <text x="777" y="454" text-anchor="middle" font-size="11">acl, crontab, queues</text>
  <text x="777" y="490" text-anchor="middle" font-size="11" opacity="0.8">configures every layer</text>
</svg>
