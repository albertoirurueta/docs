<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Reflection lobes: the shape of the light leaving a surface</text>
<rect x="20" y="50" width="225" height="250" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="132" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Diffuse (Lambert)</text>
<line x1="40" y1="240" x2="225" y2="240" stroke="#1F2937" stroke-width="3"/>
<line x1="50" y1="130" x2="132" y2="240" stroke="#B45309" stroke-width="2" marker-end="url(#ah1-w)"/>
<text x="58" y="124" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">light</text>
<path d="M 52 240 A 80 80 0 0 1 212 240 Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<line x1="132" y1="240" x2="132" y2="150" stroke="#6B7280" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 4"/>
<text x="126" y="146" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">N</text>
<text x="132" y="264" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">spread evenly, view independent</text>
<text x="132" y="284" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">metals: none</text>
<rect x="265" y="50" width="225" height="250" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="377" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Rough specular</text>
<line x1="285" y1="240" x2="470" y2="240" stroke="#1F2937" stroke-width="3"/>
<line x1="295" y1="130" x2="377" y2="240" stroke="#B45309" stroke-width="2" marker-end="url(#ah1-w)"/>
<text x="303" y="124" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">light</text>
<path d="M 377 240 C 397 160 437 110 472 150 C 492 180 477 215 472 240 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<line x1="377" y1="240" x2="377" y2="150" stroke="#6B7280" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 4"/>
<text x="371" y="146" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">N</text>
<text x="377" y="264" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">wide lobe around the mirror direction</text>
<text x="377" y="284" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">roughness near 0.6</text>
<rect x="510" y="50" width="225" height="250" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="622" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Smooth specular</text>
<line x1="530" y1="240" x2="715" y2="240" stroke="#1F2937" stroke-width="3"/>
<line x1="540" y1="130" x2="622" y2="240" stroke="#B45309" stroke-width="2" marker-end="url(#ah1-w)"/>
<text x="548" y="124" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">light</text>
<path d="M 622 240 C 637 190 672 120 692 112 C 704 125 692 190 674 240 Z" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<line x1="622" y1="240" x2="622" y2="150" stroke="#6B7280" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 4"/>
<text x="616" y="146" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">N</text>
<text x="622" y="264" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">narrow, bright lobe, low roughness</text>
<text x="622" y="284" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">roughness near 0.1</text>
<text x="380" y="324" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metals have no diffuse lobe and tint the specular lobe with the base colour; dielectrics reflect about 4 percent white.</text>
</svg>
