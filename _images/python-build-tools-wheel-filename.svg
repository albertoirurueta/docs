<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
<text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a wheel filename</text>
<text x="490" y="48" font-size="12" fill="#666666" text-anchor="middle">{distribution}-{version}(-{build tag})?-{python tag}-{abi tag}-{platform tag}.whl, fields separated by "-"</text>

<!-- pure wheel -->
<text x="40" y="86" font-size="13" font-weight="bold" fill="#555555">A pure-Python wheel (birdtally)</text>
<g font-family="Courier New, monospace" font-size="20">
<rect x="40" y="98" width="128" height="40" fill="#e8f0f8" stroke="#1c4b73"/><text x="104" y="125" text-anchor="middle" fill="#1c4b73">birdtally</text>
<text x="174" y="125" fill="#888888">-</text>
<rect x="188" y="98" width="76" height="40" fill="#e8f5e9" stroke="#2e7d32"/><text x="226" y="125" text-anchor="middle" fill="#1b5e20">1.2.0</text>
<text x="270" y="125" fill="#888888">-</text>
<rect x="284" y="98" width="50" height="40" fill="#fff4e0" stroke="#a65e00"/><text x="309" y="125" text-anchor="middle" fill="#7a4500">py3</text>
<text x="340" y="125" fill="#888888">-</text>
<rect x="354" y="98" width="62" height="40" fill="#f3e5f5" stroke="#6a1b9a"/><text x="385" y="125" text-anchor="middle" fill="#4a148c">none</text>
<text x="422" y="125" fill="#888888">-</text>
<rect x="436" y="98" width="50" height="40" fill="#fbe9e7" stroke="#bf360c"/><text x="461" y="125" text-anchor="middle" fill="#8a2500">any</text>
<text x="492" y="125" fill="#333333">.whl</text>
</g>
<g font-size="11" fill="#333333">
<text x="104" y="158" text-anchor="middle">name, normalised</text>
<text x="104" y="172" text-anchor="middle">("-" becomes "_")</text>
<text x="226" y="158" text-anchor="middle">PEP 440</text>
<text x="226" y="172" text-anchor="middle">version</text>
<text x="309" y="158" text-anchor="middle">any Python 3</text>
<text x="385" y="158" text-anchor="middle">no ABI</text>
<text x="385" y="172" text-anchor="middle">dependency</text>
<text x="461" y="158" text-anchor="middle">any</text>
<text x="461" y="172" text-anchor="middle">platform</text>
</g>
<text x="600" y="112" font-size="12" fill="#444444">One file installs everywhere that</text>
<text x="600" y="128" font-size="12" fill="#444444">requires-python allows.</text>

<!-- platform wheel -->
<text x="40" y="226" font-size="13" font-weight="bold" fill="#555555">A platform wheel with a compiled extension</text>
<g font-family="Courier New, monospace" font-size="20">
<rect x="40" y="238" width="66" height="40" fill="#e8f0f8" stroke="#1c4b73"/><text x="73" y="265" text-anchor="middle" fill="#1c4b73">name</text>
<text x="112" y="265" fill="#888888">-</text>
<rect x="126" y="238" width="50" height="40" fill="#e8f5e9" stroke="#2e7d32"/><text x="151" y="265" text-anchor="middle" fill="#1b5e20">ver</text>
<text x="182" y="265" fill="#888888">-</text>
<rect x="196" y="238" width="74" height="40" fill="#fff4e0" stroke="#a65e00"/><text x="233" y="265" text-anchor="middle" fill="#7a4500">cp314</text>
<text x="276" y="265" fill="#888888">-</text>
<rect x="290" y="238" width="74" height="40" fill="#f3e5f5" stroke="#6a1b9a"/><text x="327" y="265" text-anchor="middle" fill="#4a148c">cp314</text>
<text x="370" y="265" fill="#888888">-</text>
<rect x="384" y="238" width="290" height="40" fill="#fbe9e7" stroke="#bf360c"/><text x="529" y="265" text-anchor="middle" fill="#8a2500">manylinux_2_28_x86_64</text>
<text x="680" y="265" fill="#333333">.whl</text>
</g>
<g font-size="11" fill="#333333">
<text x="233" y="298" text-anchor="middle">CPython 3.14</text>
<text x="327" y="298" text-anchor="middle">its ABI</text>
<text x="327" y="312" text-anchor="middle">(abi3 = stable ABI)</text>
<text x="529" y="298" text-anchor="middle">Linux, glibc 2.28 or newer, x86-64</text>
<text x="529" y="312" text-anchor="middle">(musllinux, macosx_*, win_amd64, android_*, ios_* …)</text>
</g>

<text x="40" y="356" font-size="12" fill="#444444">Optional build tag: a number after the version (birdtally-0.1.0-123-py3-none-any.whl) to rebuild the same version.</text>
<text x="40" y="376" font-size="12" fill="#444444">Tag sets can be compressed with "." (py2.py3, manylinux_2_17_x86_64.manylinux2014_x86_64).</text>
<text x="40" y="396" font-size="12" fill="#444444">An sdist is just {name}-{version}.tar.gz, with the same name normalisation.</text>
</svg>
