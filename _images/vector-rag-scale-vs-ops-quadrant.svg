<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="620" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Vector engines: practical scale vs. operational effort</text>
  <text x="390" y="46" font-size="12" fill="#666666" text-anchor="middle">Approximate positioning to reason about trade-offs, not a benchmark ranking -- as of 2026-09-26</text>

  <!-- axes -->
  <line x1="90" y1="540" x2="740" y2="540" stroke="#999999" stroke-width="1.5"/>
  <line x1="90" y1="540" x2="90" y2="80" stroke="#999999" stroke-width="1.5"/>
  <text x="415" y="575" font-size="13" fill="#444444" text-anchor="middle">Practical scale (vector count the engine comfortably reaches)</text>
  <text x="30" y="310" font-size="13" fill="#444444" text-anchor="middle" transform="rotate(-90 30 310)">Operational effort to run it</text>

  <!-- quadrant divider lines -->
  <line x1="415" y1="80" x2="415" y2="540" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="310" x2="740" y2="310" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- quadrant labels -->
  <text x="250" y="100" font-size="11.5" fill="#999999" text-anchor="middle">low scale / low effort</text>
  <text x="580" y="100" font-size="11.5" fill="#999999" text-anchor="middle">high scale / low effort (managed)</text>
  <text x="250" y="525" font-size="11.5" fill="#999999" text-anchor="middle">low scale / high effort</text>
  <text x="580" y="525" font-size="11.5" fill="#999999" text-anchor="middle">high scale / high effort (self-managed distributed)</text>

  <!-- points: (x within 110-720, y within 100-520; y grows downward = more effort) -->
  <!-- SQLite/sqlite-vec -->
  <circle cx="140" cy="140" r="6" fill="#1c4b73"/>
  <text x="150" y="136" font-size="11" fill="#1c4b73">SQLite + sqlite-vec</text>

  <!-- Chroma -->
  <circle cx="175" cy="165" r="6" fill="#1c4b73"/>
  <text x="150" y="185" font-size="11" fill="#1c4b73">Chroma (embedded)</text>

  <!-- LanceDB -->
  <circle cx="230" cy="190" r="6" fill="#1c4b73"/>
  <text x="205" y="210" font-size="11" fill="#1c4b73">LanceDB (embedded)</text>

  <!-- pgvector -->
  <circle cx="330" cy="260" r="6" fill="#7a3b12"/>
  <text x="280" y="280" font-size="11" fill="#7a3b12">PostgreSQL + pgvector</text>

  <!-- Redis -->
  <circle cx="360" cy="320" r="6" fill="#7a3b12"/>
  <text x="310" y="340" font-size="11" fill="#7a3b12">Redis</text>

  <!-- Neo4j -->
  <circle cx="300" cy="350" r="6" fill="#7a3b12"/>
  <text x="150" y="370" font-size="11" fill="#7a3b12">Neo4j (vector + graph)</text>

  <!-- Couchbase -->
  <circle cx="420" cy="330" r="6" fill="#7a3b12"/>
  <text x="425" y="326" font-size="11" fill="#7a3b12">Couchbase</text>

  <!-- MongoDB Atlas -->
  <circle cx="460" cy="280" r="6" fill="#2f5424"/>
  <text x="465" y="276" font-size="11" fill="#2f5424">MongoDB Atlas</text>

  <!-- Qdrant Cloud / Pinecone / Zilliz -->
  <circle cx="600" cy="190" r="6" fill="#2f5424"/>
  <text x="530" y="175" font-size="11" fill="#2f5424">Pinecone / Zilliz Cloud (serverless)</text>

  <circle cx="560" cy="230" r="6" fill="#2f5424"/>
  <text x="450" y="245" font-size="11" fill="#2f5424">Qdrant Cloud / Weaviate Cloud</text>

  <!-- Elasticsearch / OpenSearch -->
  <circle cx="620" cy="290" r="6" fill="#7a3b12"/>
  <text x="565" y="308" font-size="11" fill="#7a3b12">Elasticsearch / OpenSearch</text>

  <!-- Solr/Lucene -->
  <circle cx="490" cy="360" r="6" fill="#7a3b12"/>
  <text x="440" y="380" font-size="11" fill="#7a3b12">Solr / Lucene</text>

  <!-- Milvus self-hosted distributed -->
  <circle cx="680" cy="440" r="6" fill="#7a3b12"/>
  <text x="560" y="460" font-size="11" fill="#7a3b12">Milvus (self-hosted distributed)</text>

  <!-- S3 Vectors / hyperscaler-native -->
  <circle cx="690" cy="150" r="6" fill="#2f5424"/>
  <text x="560" y="140" font-size="11" fill="#2f5424">S3 Vectors / hyperscaler-native</text>

  <!-- legend -->
  <circle cx="110" cy="590" r="6" fill="#1c4b73"/>
  <text x="122" y="594" font-size="11" fill="#444444">Embedded / zero-ops</text>
  <circle cx="290" cy="590" r="6" fill="#7a3b12"/>
  <text x="302" y="594" font-size="11" fill="#444444">Self-hosted server / cluster</text>
  <circle cx="510" cy="590" r="6" fill="#2f5424"/>
  <text x="522" y="594" font-size="11" fill="#444444">Fully managed / serverless</text>
</svg>
