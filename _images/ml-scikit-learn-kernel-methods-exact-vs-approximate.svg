<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Exact kernel versus explicit feature map</title>
<desc id="d">Top, an exact kernel method builds an n by n kernel matrix. Bottom, Nystroem or RBFSampler maps the data to n_components features and a linear model is fitted on them.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Exact kernel matrix versus explicit approximate feature map</text>
<rect x="30" y="70" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="96" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">X</text>
<text x="105" y="116" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(n, d)</text>
<rect x="250" y="70" width="160" height="60" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="330" y="96" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">K = k(X, X)</text>
<text x="330" y="116" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(n, n): O(n^2) memory</text>
<rect x="490" y="70" width="200" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="96" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">SVC / KernelRidge</text>
<text x="590" y="116" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">fit ~ O(n^2) to O(n^3)</text>
<line x1="180" y1="100" x2="248" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="410" y1="100" x2="488" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="190" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="216" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">X</text>
<text x="105" y="236" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(n, d)</text>
<rect x="250" y="190" width="160" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="330" y="216" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Nystroem/RBFSampler</text>
<text x="330" y="236" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">Z: (n, n_components)</text>
<rect x="490" y="190" width="200" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="590" y="216" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">linear model</text>
<text x="590" y="236" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">SGD, Ridge: ~ O(n * m)</text>
<line x1="180" y1="220" x2="248" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="410" y1="220" x2="488" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Choose m = n_components much smaller than n so that k(x, y) is close to the dot product z(x) . z(y)</text>
</svg>
