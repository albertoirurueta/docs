<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One native app, two React Native roots</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Each root mounts its own React tree, but both are served by a single host: one Hermes runtime, one JS bundle</text>

  <defs>
    <marker id="bf-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- The existing native application shell -->
  <rect x="30" y="62" width="700" height="228" rx="10" fill="#f7f7fa" stroke="#555555" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="380" y="84" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">Existing native app &#8212; com.irurueta.places</text>

  <!-- Native screens -->
  <rect x="50" y="100" width="190" height="165" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="145" y="124" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Native screens</text>
  <text x="145" y="142" font-size="10" fill="#666666" text-anchor="middle">untouched Kotlin / Swift UI</text>
  <text x="145" y="164" font-size="10" fill="#333333" text-anchor="middle">SignInActivity</text>
  <text x="145" y="180" font-size="10" fill="#333333" text-anchor="middle">SettingsViewController</text>
  <text x="145" y="204" font-size="10" fill="#333333" text-anchor="middle">own navigation stack,</text>
  <text x="145" y="220" font-size="10" fill="#333333" text-anchor="middle">own analytics, own</text>
  <text x="145" y="236" font-size="10" fill="#333333" text-anchor="middle">release cadence</text>

  <!-- React root 1 -->
  <rect x="285" y="100" width="190" height="165" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="380" y="124" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">React root #1</text>
  <text x="380" y="142" font-size="10" fill="#666666" text-anchor="middle">ReactFragment / UIViewController</text>
  <text x="380" y="164" font-size="10" fill="#333333" text-anchor="middle">moduleName: "PlacesList"</text>
  <text x="380" y="180" font-size="10" fill="#333333" text-anchor="middle">renders PlacesListScreen</text>
  <text x="380" y="204" font-size="10" fill="#333333" text-anchor="middle">initialProps:</text>
  <text x="380" y="220" font-size="10" fill="#333333" text-anchor="middle">userId, apiBaseUrl,</text>
  <text x="380" y="236" font-size="10" fill="#333333" text-anchor="middle">initialCategory</text>

  <!-- React root 2 -->
  <rect x="520" y="100" width="190" height="165" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="615" y="124" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">React root #2</text>
  <text x="615" y="142" font-size="10" fill="#666666" text-anchor="middle">presented modally</text>
  <text x="615" y="164" font-size="10" fill="#333333" text-anchor="middle">moduleName: "AddPlace"</text>
  <text x="615" y="180" font-size="10" fill="#333333" text-anchor="middle">renders AddPlaceScreen</text>
  <text x="615" y="204" font-size="10" fill="#333333" text-anchor="middle">separate React tree:</text>
  <text x="615" y="220" font-size="10" fill="#333333" text-anchor="middle">no shared Context,</text>
  <text x="615" y="236" font-size="10" fill="#333333" text-anchor="middle">no shared component state</text>

  <!-- Navigation arrows between the shells -->
  <line x1="240" y1="176" x2="285" y2="176" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>
  <line x1="285" y1="196" x2="240" y2="196" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>
  <line x1="475" y1="176" x2="520" y2="176" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>
  <line x1="520" y1="196" x2="475" y2="196" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>

  <!-- Shared host -->
  <rect x="185" y="330" width="390" height="86" rx="8" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.8"/>
  <text x="380" y="354" font-size="12.5" font-weight="bold" fill="#a35d00" text-anchor="middle">ReactHost (Android) / RCTReactNativeFactory (iOS)</text>
  <text x="380" y="374" font-size="10" fill="#333333" text-anchor="middle">one Hermes runtime &#183; one JS bundle &#183; one Turbo Module registry</text>
  <text x="380" y="392" font-size="10" fill="#333333" text-anchor="middle">created once, held by the Application / AppDelegate</text>
  <text x="380" y="408" font-size="10" fill="#333333" text-anchor="middle">for the whole process lifetime</text>

  <line x1="380" y1="265" x2="380" y2="330" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>
  <line x1="600" y1="265" x2="500" y2="330" stroke="#333333" stroke-width="1.4" marker-end="url(#bf-arrow)"/>

  <text x="380" y="444" font-size="10.5" fill="#666666" text-anchor="middle">Native and React screens push onto each other like any other screen; state is shared through native modules, not through React.</text>
  <text x="380" y="460" font-size="10.5" fill="#666666" text-anchor="middle">A second host would mean a second Hermes runtime and a second copy of the bundle &#8212; reuse the first one instead.</text>
</svg>
