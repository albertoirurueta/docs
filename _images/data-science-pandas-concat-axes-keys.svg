<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">pd.concat along rows and along columns</title>
<desc id="d">On the left, axis 0 stacks the jan and feb frames vertically; keys jan and feb become the outer level of a MultiIndex. On the right, axis 1 places the frames side by side and aligns rows by index label, keys become the outer column level.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="30" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pd.concat([jan, feb], keys=[...]) on each axis</text>
<text x="170" y="66" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">axis=0 (default): stack rows</text>
<rect x="60" y="90" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="104" y="90" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="60" y="118" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="104" y="118" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="102.0" y="160" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">jan</text>
<rect x="60" y="170" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="104" y="170" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="60" y="198" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="104" y="198" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="102.0" y="240" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">feb</text>
<line x1="170" y1="215" x2="170" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="100" y="255" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="144" y="255" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="100" y="283" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="144" y="283" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="100" y="311" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="144" y="311" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="100" y="339" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="144" y="339" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="30" y="272" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">jan</text>
<text x="30" y="300" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"></text>
<text x="30" y="328" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">feb</text>
<text x="170" y="376" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">outer index level = keys</text>
<text x="540" y="66" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">axis=1: place frames side by side</text>
<rect x="420" y="90" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="464" y="90" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="420" y="118" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="464" y="118" width="40" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="462.0" y="160" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">jan</text>
<rect x="520" y="90" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="564" y="90" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="520" y="118" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="564" y="118" width="40" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="562.0" y="160" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">feb</text>
<line x1="540" y1="170" x2="540" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="215" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="464" y="215" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="520" y="215" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="564" y="215" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="420" y="243" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="464" y="243" width="44" height="24" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="520" y="243" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="564" y="243" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="486" y="196" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">jan</text>
<text x="586" y="196" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">feb</text>
<text x="540" y="290" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">rows match by index label;</text>
<text x="540" y="308" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">missing labels become NaN (join="outer")</text>
<text x="540" y="376" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">outer column level = keys</text>
</svg>
