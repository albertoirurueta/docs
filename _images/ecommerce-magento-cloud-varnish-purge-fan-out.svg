<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">One cache purge from Magento reaches every Varnish replica</title>
  <desc id="d">On the left, the pods that can change data: web pods saving a product or an order, the admin pod, the cron job and the queue consumers. Each of them reads the same http_cache_hosts list built from the environment variable MAGENTO_VARNISH_HOSTS and sends an HTTP PURGE request with the header X-Magento-Tags-Pattern to every replica by its stable pod DNS name through the headless Service pocketcoffee-varnish-headless on port 6081: pocketcoffee-varnish-0, pocketcoffee-varnish-1 and pocketcoffee-varnish-2. Each Varnish pod checks that the client address is inside the purge ACL, which lists the pod subnets and not the load balancer subnets, and then bans the cached objects whose X-Magento-Tags header matches. The customer Service pocketcoffee-varnish is a different object: it load balances customer traffic to any replica, so a purge sent through it would reach only one replica and leave the others serving stale pages.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Every pod that changes data purges every Varnish replica itself</text>

  <rect x="30" y="64" width="250" height="300" rx="10" fill="#33485c"/>
  <text x="46" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">Magento pods (PHP)</text>
  <rect x="46" y="104" width="218" height="48" rx="8" fill="#4d7c5a"/>
  <text x="58" y="125" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-web</text>
  <text x="58" y="142" font-size="12.5" fill="#f2f5f8">REST, GraphQL, checkout saves</text>
  <rect x="46" y="162" width="218" height="48" rx="8" fill="#4d7c5a"/>
  <text x="58" y="183" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-admin</text>
  <text x="58" y="200" font-size="12.5" fill="#f2f5f8">product and CMS edits</text>
  <rect x="46" y="220" width="218" height="48" rx="8" fill="#4d7c5a"/>
  <text x="58" y="241" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-cron</text>
  <text x="58" y="258" font-size="12.5" fill="#f2f5f8">indexers, scheduled prices</text>
  <rect x="46" y="278" width="218" height="48" rx="8" fill="#4d7c5a"/>
  <text x="58" y="299" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-consumer-*</text>
  <text x="58" y="316" font-size="12.5" fill="#f2f5f8">bulk and async operations</text>
  <text x="46" y="350" font-size="12.5" fill="#f4b860">same env.php: same host list</text>

  <rect x="320" y="104" width="190" height="150" rx="10" fill="#3f6e9a"/>
  <text x="334" y="130" font-size="14" font-weight="bold" fill="#f2f5f8">http_cache_hosts</text>
  <text x="334" y="152" font-size="12.5" fill="#f2f5f8">from an env variable</text>
  <text x="334" y="174" font-size="12.5" fill="#f2f5f8">one entry per replica:</text>
  <text x="334" y="194" font-size="12" fill="#9fd3c7">pocketcoffee-varnish-0 ...</text>
  <text x="334" y="212" font-size="12" fill="#9fd3c7">pocketcoffee-varnish-1 ...</text>
  <text x="334" y="230" font-size="12" fill="#9fd3c7">pocketcoffee-varnish-2 ...</text>
  <text x="334" y="246" font-size="11.5" fill="#f2f5f8">(.pocketcoffee.svc, port 6081)</text>

  <line x1="264" y1="128" x2="318" y2="160" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="264" y1="186" x2="318" y2="180" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="264" y1="244" x2="318" y2="200" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="264" y1="302" x2="318" y2="220" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="550" y="64" width="380" height="300" rx="10" fill="#33485c"/>
  <text x="566" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">StatefulSet pocketcoffee-varnish</text>
  <rect x="566" y="104" width="348" height="72" rx="8" fill="#4d7c5a"/>
  <text x="578" y="126" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-varnish-0</text>
  <text x="578" y="145" font-size="12.5" fill="#f2f5f8">PURGE ... X-Magento-Tags-Pattern</text>
  <text x="578" y="163" font-size="12.5" fill="#9fd3c7">ACL ok: ban obj.http.X-Magento-Tags ~ pattern</text>
  <rect x="566" y="186" width="348" height="72" rx="8" fill="#4d7c5a"/>
  <text x="578" y="208" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-varnish-1</text>
  <text x="578" y="227" font-size="12.5" fill="#f2f5f8">PURGE ... X-Magento-Tags-Pattern</text>
  <text x="578" y="245" font-size="12.5" fill="#9fd3c7">ACL ok: ban obj.http.X-Magento-Tags ~ pattern</text>
  <rect x="566" y="268" width="348" height="72" rx="8" fill="#4d7c5a"/>
  <text x="578" y="290" font-size="12.5" font-weight="bold" fill="#f2f5f8">pocketcoffee-varnish-2</text>
  <text x="578" y="309" font-size="12.5" fill="#f2f5f8">PURGE ... X-Magento-Tags-Pattern</text>
  <text x="578" y="327" font-size="12.5" fill="#9fd3c7">ACL ok: ban obj.http.X-Magento-Tags ~ pattern</text>

  <g stroke="#f4b860" stroke-width="2" fill="none">
    <line x1="510" y1="150" x2="564" y2="140" marker-end="url(#b)"/>
    <line x1="510" y1="180" x2="564" y2="222" marker-end="url(#b)"/>
    <line x1="510" y1="210" x2="564" y2="304" marker-end="url(#b)"/>
  </g>
  <text x="450" y="282" font-size="12.5" fill="#f4b860" text-anchor="middle">headless Service,</text>
  <text x="450" y="299" font-size="12.5" fill="#f4b860" text-anchor="middle">pod DNS names</text>

  <rect x="30" y="394" width="430" height="140" rx="10" fill="#7a5c3a"/>
  <text x="46" y="420" font-size="14" font-weight="bold" fill="#f2f5f8">Wrong: purge through the customer Service</text>
  <text x="46" y="444" font-size="12.5" fill="#f2f5f8">Service pocketcoffee-varnish (port 80) spreads requests</text>
  <text x="46" y="462" font-size="12.5" fill="#f2f5f8">over the replicas, so one PURGE reaches one replica.</text>
  <text x="46" y="486" font-size="12.5" fill="#f2f5f8">The other replicas keep serving the old page until its</text>
  <text x="46" y="504" font-size="12.5" fill="#f2f5f8">TTL ends (86400 s by default).</text>

  <rect x="500" y="394" width="430" height="140" rx="10" fill="#3d5266"/>
  <text x="516" y="420" font-size="14" font-weight="bold" fill="#f2f5f8">Right: one list of pod names, same on every pod</text>
  <text x="516" y="444" font-size="12.5" fill="#f2f5f8">The Helm helper builds the list from varnish.replicas.</text>
  <text x="516" y="462" font-size="12.5" fill="#f2f5f8">Changing the replica count changes the list, so the</text>
  <text x="516" y="480" font-size="12.5" fill="#f2f5f8">Magento pods roll with it; CronJob runs pick it up</text>
  <text x="516" y="498" font-size="12.5" fill="#f2f5f8">next run. An empty list purges nobody.</text>
</svg>
