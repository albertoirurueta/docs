<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Navigation bar and left sidebar</text>
  <rect x="40" y="50" width="70" height="300" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="58" y="70" width="34" height="26" rx="5" fill="#C7D2FE"/><text x="75" y="110" font-size="9" fill="#3730A3" text-anchor="middle">Files</text>
  <rect x="58" y="124" width="34" height="26" rx="5" fill="#C7D2FE"/><text x="75" y="164" font-size="9" fill="#3730A3" text-anchor="middle">Agents</text>
  <rect x="58" y="178" width="34" height="26" rx="5" fill="#C7D2FE"/><text x="75" y="218" font-size="9" fill="#3730A3" text-anchor="middle">Assets</text>
  <rect x="58" y="232" width="34" height="26" rx="5" fill="#C7D2FE"/><text x="75" y="272" font-size="9" fill="#3730A3" text-anchor="middle">Tools</text>
  <rect x="58" y="286" width="34" height="26" rx="5" fill="#C7D2FE"/><text x="75" y="326" font-size="9" fill="#3730A3" text-anchor="middle">Variables</text>
  <rect x="110" y="50" width="230" height="300" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="124" y="74" font-size="13" font-weight="bold" fill="#374151">Bookshelf Mobile</text>
  <rect x="124" y="84" width="200" height="22" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/><text x="132" y="99" font-size="11" fill="#6B7280">Find and replace</text>
  <text x="124" y="130" font-size="12" font-weight="bold" fill="#374151">Pages</text>
  <rect x="124" y="138" width="200" height="16" rx="3" fill="#EEF2FF"/><text x="132" y="150" font-size="11" fill="#3730A3">Catalogue</text>
  <text x="132" y="170" font-size="11" fill="#374151">Book detail</text><text x="132" y="188" font-size="11" fill="#374151">Review form</text>
  <text x="124" y="218" font-size="12" font-weight="bold" fill="#374151">Layers</text>
  <text x="132" y="238" font-size="11" fill="#374151">Catalogue / mobile</text><text x="148" y="256" font-size="11" fill="#374151">Top bar</text><text x="148" y="274" font-size="11" fill="#374151">Book card</text><text x="148" y="292" font-size="11" fill="#374151">Add to shelf</text>
  <path d="M340 200 L240 200" stroke="none"/>
<circle cx="75" cy="62" r="11" fill="#4F46E5"/><text x="75" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="330" cy="62" r="11" fill="#4F46E5"/><text x="330" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="330" cy="130" r="11" fill="#4F46E5"/><text x="330" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="330" cy="218" r="11" fill="#B45309"/><text x="330" y="222" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="380" y="80" font-size="12" fill="#374151">1  Tabs: Files (Option 1 / Alt 1), Assets (Option 2 / Alt 2),</text>
  <text x="396" y="98" font-size="12" fill="#374151">Agents, Tools, Variables; Libraries modal (Option 3 / Alt 3)</text>
  <text x="380" y="132" font-size="12" fill="#374151">2  Left sidebar content follows the selected tab;</text><text x="396" y="150" font-size="12" fill="#374151">drag its right edge to resize</text>
  <text x="380" y="184" font-size="12" fill="#374151">3  Files tab: pages list and Find and replace</text>
  <text x="380" y="218" font-size="12" fill="#374151">4  Layers: the tree of the current page</text>
  <text x="380" y="262" font-size="12" fill="#374151">Minimize UI hides both sidebars and the nav bar:</text><text x="380" y="280" font-size="12" fill="#374151">Cmd+Shift+\ (macOS), Ctrl+Shift+\ (Windows)</text>
</svg>
