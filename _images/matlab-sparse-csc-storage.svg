<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="csc-t csc-d">
  <title id="csc-t">Compressed sparse column storage of a 3 by 3 matrix</title>
  <desc id="csc-d">The matrix with rows 4 0 0, 0 5 0 and 6 0 7 stored column by column as three arrays: the nonzero values 4, 6, 5, 7, their row indices 1, 3, 2, 3 and the column pointers 1, 3, 4, 5 that mark where each column starts.</desc>
  <rect x="0" y="0" width="900" height="360" rx="12" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Compressed column storage: three arrays hold the four nonzeros of S</text>
  <text x="60" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">S (3x3), 4 nonzeros</text>
  <rect x="60" y="85" width="56" height="50" fill="#dbeafe" stroke="#64748b"/>
  <text x="88" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">4</text>
  <rect x="116" y="85" width="56" height="50" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="144" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">0</text>
  <rect x="172" y="85" width="56" height="50" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="200" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">0</text>
  <rect x="60" y="135" width="56" height="50" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">0</text>
  <rect x="116" y="135" width="56" height="50" fill="#dcfce7" stroke="#64748b"/>
  <text x="144" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">5</text>
  <rect x="172" y="135" width="56" height="50" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="200" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">0</text>
  <rect x="60" y="185" width="56" height="50" fill="#dbeafe" stroke="#64748b"/>
  <text x="88" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">6</text>
  <rect x="116" y="185" width="56" height="50" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="144" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">0</text>
  <rect x="172" y="185" width="56" height="50" fill="#fef3c7" stroke="#64748b"/>
  <text x="200" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">7</text>
  <text x="88" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">col 1</text>
  <text x="144" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">col 2</text>
  <text x="200" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">col 3</text>
  <text x="360" y="110" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">values</text>
  <rect x="380" y="80" width="64" height="44" fill="#dbeafe" stroke="#64748b"/>
  <text x="412.0" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">4</text>
  <text x="412.0" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">1</text>
  <rect x="444" y="80" width="64" height="44" fill="#dbeafe" stroke="#64748b"/>
  <text x="476.0" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">6</text>
  <text x="476.0" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">2</text>
  <rect x="508" y="80" width="64" height="44" fill="#dcfce7" stroke="#64748b"/>
  <text x="540.0" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">5</text>
  <text x="540.0" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">3</text>
  <rect x="572" y="80" width="64" height="44" fill="#fef3c7" stroke="#64748b"/>
  <text x="604.0" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">7</text>
  <text x="604.0" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">4</text>
  <text x="360" y="190" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">row indices</text>
  <rect x="380" y="160" width="64" height="44" fill="#dbeafe" stroke="#64748b"/>
  <text x="412.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">1</text>
  <text x="412.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">1</text>
  <rect x="444" y="160" width="64" height="44" fill="#dbeafe" stroke="#64748b"/>
  <text x="476.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">3</text>
  <text x="476.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">2</text>
  <rect x="508" y="160" width="64" height="44" fill="#dcfce7" stroke="#64748b"/>
  <text x="540.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">2</text>
  <text x="540.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">3</text>
  <rect x="572" y="160" width="64" height="44" fill="#fef3c7" stroke="#64748b"/>
  <text x="604.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">3</text>
  <text x="604.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">4</text>
  <text x="360" y="270" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">column pointers</text>
  <rect x="380" y="240" width="64" height="44" fill="#dbeafe" stroke="#64748b"/>
  <text x="412.0" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">1</text>
  <text x="412.0" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">1</text>
  <rect x="444" y="240" width="64" height="44" fill="#dcfce7" stroke="#64748b"/>
  <text x="476.0" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">3</text>
  <text x="476.0" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">2</text>
  <rect x="508" y="240" width="64" height="44" fill="#fef3c7" stroke="#64748b"/>
  <text x="540.0" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">4</text>
  <text x="540.0" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">3</text>
  <rect x="572" y="240" width="64" height="44" fill="#e2e8f0" stroke="#64748b"/>
  <text x="604.0" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">5</text>
  <text x="604.0" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">4</text>
  <text x="450" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Column j occupies positions pointers(j) to pointers(j+1)-1:</text>
  <text x="450" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">column 1 holds entries 1 and 2, column 2 entry 3, column 3 entry 4.</text>
</svg>
