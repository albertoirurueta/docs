<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>AI security framework map</title>
  <desc>Five frameworks arranged by the question they answer. OWASP Top 10 for LLM Applications 2026 lists the ten most critical application risks. OWASP Top 10 for Agentic Applications lists ASI01 to ASI10 risks specific to autonomous agents. MITRE ATLAS catalogues adversary tactics and techniques used in tests and detections. NIST AI RMF 1.0 and the AI 600-1 Generative AI Profile organise risk management into Govern, Map, Measure and Manage and name twelve generative AI risks. The EU AI Act, Regulation (EU) 2024/1689, sets legal obligations by risk tier. Arrows show that the risk lists feed threat models and red-team plans, which feed the NIST functions, which provide the evidence for legal obligations.</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">How the frameworks fit together</text>
  <text x="170" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">WHAT CAN GO WRONG</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">HOW ATTACKERS DO IT</text>
  <text x="830" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">WHAT YOU MUST DO</text>

  <rect x="20" y="80" width="300" height="130" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="170" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">OWASP Top 10 for LLM Apps</text>
  <text x="36" y="132" font-size="12" fill="#1e293b">2026 edition, LLM01 to LLM10</text>
  <text x="36" y="152" font-size="12" fill="#1e293b">Prompt injection, data leakage,</text>
  <text x="36" y="172" font-size="12" fill="#1e293b">excessive agency, supply chain,</text>
  <text x="36" y="192" font-size="12" fill="#1e293b">unbounded consumption ...</text>

  <rect x="20" y="240" width="300" height="130" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
  <text x="170" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">OWASP Top 10 for Agentic Apps</text>
  <text x="36" y="292" font-size="12" fill="#1e293b">ASI01 to ASI10</text>
  <text x="36" y="312" font-size="12" fill="#1e293b">Goal hijack, tool misuse, identity</text>
  <text x="36" y="332" font-size="12" fill="#1e293b">abuse, memory poisoning, cascading</text>
  <text x="36" y="352" font-size="12" fill="#1e293b">failures, rogue agents</text>

  <rect x="350" y="80" width="300" height="290" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="500" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">MITRE ATLAS and MAESTRO</text>
  <text x="366" y="136" font-size="12" fill="#1e293b">ATLAS: tactics and techniques</text>
  <text x="366" y="156" font-size="12" fill="#1e293b">(for example AML.T0051 prompt</text>
  <text x="366" y="176" font-size="12" fill="#1e293b">injection, AML.T0070 RAG poisoning)</text>
  <text x="366" y="206" font-size="12" fill="#1e293b">MAESTRO: seven-layer threat model</text>
  <text x="366" y="226" font-size="12" fill="#1e293b">for agentic systems</text>
  <text x="366" y="256" font-size="12" fill="#1e293b">Used to write threat models,</text>
  <text x="366" y="276" font-size="12" fill="#1e293b">red-team plans and detections</text>
  <text x="366" y="316" font-size="12" font-weight="bold" fill="#0f172a">Tools: garak, PyRIT, promptfoo</text>
  <text x="366" y="340" font-size="12" fill="#1e293b">Test each risk, map the finding</text>

  <rect x="680" y="80" width="300" height="130" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="830" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">NIST AI RMF and AI 600-1</text>
  <text x="696" y="132" font-size="12" fill="#1e293b">Govern, Map, Measure, Manage</text>
  <text x="696" y="152" font-size="12" fill="#1e293b">Twelve generative AI risks with</text>
  <text x="696" y="172" font-size="12" fill="#1e293b">suggested actions; voluntary,</text>
  <text x="696" y="192" font-size="12" fill="#1e293b">risk-management vocabulary</text>

  <rect x="680" y="240" width="300" height="130" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="830" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">EU AI Act</text>
  <text x="696" y="292" font-size="12" fill="#1e293b">Regulation (EU) 2024/1689</text>
  <text x="696" y="312" font-size="12" fill="#1e293b">Risk tiers, GPAI duties, Art. 50</text>
  <text x="696" y="332" font-size="12" fill="#1e293b">transparency; binding law,</text>
  <text x="696" y="352" font-size="12" fill="#1e293b">dated obligations</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M320 145 L350 145"/><path d="M320 305 L350 305"/>
    <path d="M650 145 L680 145"/><path d="M650 305 L680 305"/>
    <path d="M830 210 L830 240"/>
  </g>
  <g fill="#475569"><path d="M350 145 l-8 -5 v10 z"/><path d="M350 305 l-8 -5 v10 z"/>
    <path d="M680 145 l-8 -5 v10 z"/><path d="M680 305 l-8 -5 v10 z"/><path d="M830 240 l-5 -8 h10 z"/></g>
  <text x="500" y="410" text-anchor="middle" font-size="13" fill="#0f172a">Risk lists name the problems; ATLAS and MAESTRO turn them into attacks you can test;</text>
  <text x="500" y="430" text-anchor="middle" font-size="13" fill="#0f172a">NIST organises the evidence; the EU AI Act decides which of it is legally required.</text>
  <text x="500" y="456" text-anchor="middle" font-size="11" fill="#475569">Each risk page in this sub-section maps its topic to one ID in each of the first four.</text>
</svg>
