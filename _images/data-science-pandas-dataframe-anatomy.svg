<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <title>Anatomy of a DataFrame</title>
  <desc>A small DataFrame with a row Index on the left, a column Index on top, one dtype per column and the values in the body. Four numbered markers point at the column labels, the row labels, the per-column dtype and a single column that is a Series sharing the row Index.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">DataFrame anatomy</text>

  <!-- column index -->
  <rect x="150" y="70" width="130" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="290" y="70" width="130" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="430" y="70" width="130" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="215" y="95">city</text><text x="355" y="95">pop_m</text><text x="495" y="95">capital</text>
  </g>
  <!-- row index -->
  <rect x="50" y="120" width="90" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="50" y="170" width="90" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="50" y="220" width="90" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="95" y="145">"es"</text><text x="95" y="195">"no"</text><text x="95" y="245">"pe"</text>
  </g>
  <!-- values -->
  <g fill="#CCFBF1" stroke="#0F766E" stroke-width="2">
    <rect x="150" y="120" width="130" height="40" rx="6"/><rect x="150" y="170" width="130" height="40" rx="6"/><rect x="150" y="220" width="130" height="40" rx="6"/>
    <rect x="290" y="120" width="130" height="40" rx="6"/><rect x="290" y="170" width="130" height="40" rx="6"/><rect x="290" y="220" width="130" height="40" rx="6"/>
    <rect x="430" y="120" width="130" height="40" rx="6"/><rect x="430" y="170" width="130" height="40" rx="6"/><rect x="430" y="220" width="130" height="40" rx="6"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="215" y="145">Madrid</text><text x="215" y="195">Oslo</text><text x="215" y="245">Lima</text>
    <text x="355" y="145">3.3</text><text x="355" y="195">0.7</text><text x="355" y="245">9.7</text>
    <text x="495" y="145">True</text><text x="495" y="195">True</text><text x="495" y="245">True</text>
  </g>
  <!-- dtypes -->
  <g fill="#EDE9FE" stroke="#6D28D9" stroke-width="2">
    <rect x="150" y="280" width="130" height="34" rx="6"/><rect x="290" y="280" width="130" height="34" rx="6"/><rect x="430" y="280" width="130" height="34" rx="6"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="215" y="302">str</text><text x="355" y="302">float64</text><text x="495" y="302">bool</text>
  </g>
  <text x="150" y="340" font-size="12" fill="#475569">df.dtypes: one dtype per column</text>
  <text x="150" y="358" font-size="12" fill="#475569">df.shape == (3, 3), df.index and df.columns are Index objects</text>

  <!-- column highlight (Series) -->
  <rect x="424" y="114" width="142" height="152" rx="8" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- callouts -->
  <g fill="#0F172A"><circle cx="600" cy="90" r="11"/><circle cx="25" cy="140" r="11"/><circle cx="600" cy="297" r="11"/><circle cx="600" cy="190" r="11"/></g>
  <g font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="600" y="95">1</text><text x="25" y="145">2</text><text x="600" y="302">3</text><text x="600" y="195">4</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="587" y1="90" x2="566" y2="90" marker-end="url(#arr)"/>
    <line x1="38" y1="140" x2="47" y2="140" marker-end="url(#arr)"/>
    <line x1="587" y1="297" x2="566" y2="297" marker-end="url(#arr)"/>
    <line x1="587" y1="190" x2="570" y2="190" marker-end="url(#arr)"/>
  </g>
</svg>
