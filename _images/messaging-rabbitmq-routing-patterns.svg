<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="520" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Six RabbitMQ routing patterns</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">Publisher confirms layers on top of any of the other five -- it is not its own topology</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2d6a34"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Panel 1: Work Queues (col1, row1) -->
  <g>
    <rect x="20" y="55" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="125" y="72" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">1. Work queues</text>
    <text x="125" y="85" font-size="8.5" fill="#666666" text-anchor="middle">competing consumers, fair dispatch</text>

    <rect x="35" y="100" width="46" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="58" y="113" font-size="8" text-anchor="middle" fill="#22326a">Publisher</text>

    <rect x="95" y="100" width="50" height="20" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="120" y="113" font-size="8" text-anchor="middle" fill="#333333">tasks</text>

    <circle cx="195" cy="90" r="16" fill="#eef7ee" stroke="#2d6a34"/>
    <text x="195" y="93" font-size="7.5" text-anchor="middle" fill="#2d6a34">C1</text>
    <circle cx="195" cy="130" r="16" fill="#eef7ee" stroke="#2d6a34"/>
    <text x="195" y="133" font-size="7.5" text-anchor="middle" fill="#2d6a34">C2</text>

    <line x1="81" y1="110" x2="93" y2="110" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="145" y1="106" x2="179" y2="92" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <line x1="145" y1="114" x2="179" y2="128" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <text x="120" y="155" font-size="7.8" fill="#555555" text-anchor="middle">round robin, one delivery per</text>
    <text x="120" y="165" font-size="7.8" fill="#555555" text-anchor="middle">consumer; basicQos(1) for fair</text>
    <text x="120" y="175" font-size="7.8" fill="#555555" text-anchor="middle">dispatch across uneven workers</text>
  </g>

  <!-- Panel 2: Publish/Subscribe (col2, row1) -->
  <g>
    <rect x="245" y="55" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="350" y="72" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">2. Publish/subscribe</text>
    <text x="350" y="85" font-size="8.5" fill="#666666" text-anchor="middle">fanout exchange, broadcast</text>

    <rect x="260" y="100" width="46" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="283" y="113" font-size="8" text-anchor="middle" fill="#22326a">Publisher</text>

    <polygon points="330,100 355,110 330,120 305,110" fill="#fff4e5" stroke="#b8730f"/>
    <text x="330" y="113" font-size="7" text-anchor="middle" fill="#8a5a0d">fanout</text>

    <rect x="390" y="85" width="50" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="415" y="97" font-size="7.5" text-anchor="middle" fill="#333333">queue A</text>
    <rect x="390" y="117" width="50" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="415" y="129" font-size="7.5" text-anchor="middle" fill="#333333">queue B</text>

    <line x1="306" y1="110" x2="330" y2="110" stroke="#555555" stroke-width="1.4"/>
    <line x1="355" y1="108" x2="388" y2="94" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="355" y1="112" x2="388" y2="126" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>

    <text x="350" y="155" font-size="7.8" fill="#555555" text-anchor="middle">every bound queue gets its own</text>
    <text x="350" y="165" font-size="7.8" fill="#555555" text-anchor="middle">copy; routing key is ignored --</text>
    <text x="350" y="175" font-size="7.8" fill="#555555" text-anchor="middle">binding key is empty</text>
  </g>

  <!-- Panel 3: Routing (col3, row1) -->
  <g>
    <rect x="470" y="55" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="575" y="72" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">3. Routing</text>
    <text x="575" y="85" font-size="8.5" fill="#666666" text-anchor="middle">direct exchange, multiple bindings</text>

    <rect x="485" y="100" width="46" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="508" y="113" font-size="8" text-anchor="middle" fill="#22326a">Publisher</text>

    <polygon points="555,100 578,110 555,120 532,110" fill="#fff4e5" stroke="#b8730f"/>
    <text x="555" y="113" font-size="7" text-anchor="middle" fill="#8a5a0d">direct</text>

    <rect x="615" y="85" width="50" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="640" y="97" font-size="7.2" text-anchor="middle" fill="#333333">logs.error</text>
    <rect x="615" y="117" width="50" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="640" y="129" font-size="7.2" text-anchor="middle" fill="#333333">logs.info</text>

    <line x1="531" y1="110" x2="553" y2="110" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="595" y="88" font-size="6.5" fill="#2d6a34" text-anchor="middle">key: error</text>
    <line x1="578" y1="108" x2="613" y2="94" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <line x1="578" y1="112" x2="613" y2="126" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowGray)"/>
    <text x="640" y="145" font-size="6.5" fill="#999999" text-anchor="middle">no binding-key match</text>

    <text x="575" y="165" font-size="7.8" fill="#555555" text-anchor="middle">routes only to queues whose</text>
    <text x="575" y="175" font-size="7.8" fill="#555555" text-anchor="middle">binding key exactly equals the</text>
    <text x="575" y="185" font-size="7.8" fill="#555555" text-anchor="middle">message's routing key</text>
  </g>

  <!-- Panel 4: Topics (col1, row2) -->
  <g>
    <rect x="20" y="280" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="125" y="297" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">4. Topics</text>
    <text x="125" y="310" font-size="8.5" fill="#666666" text-anchor="middle">topic exchange, wildcard bindings</text>

    <rect x="35" y="325" width="46" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="58" y="338" font-size="8" text-anchor="middle" fill="#22326a">Publisher</text>

    <polygon points="105,325 128,335 105,345 82,335" fill="#fff4e5" stroke="#b8730f"/>
    <text x="105" y="338" font-size="7" text-anchor="middle" fill="#8a5a0d">topic</text>

    <rect x="165" y="310" width="55" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="192" y="322" font-size="6.8" text-anchor="middle" fill="#333333">orders.eu.*</text>
    <rect x="165" y="342" width="55" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="192" y="354" font-size="6.8" text-anchor="middle" fill="#333333">orders.#</text>

    <line x1="81" y1="335" x2="103" y2="335" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="145" y="315" font-size="6.5" fill="#555555" text-anchor="middle">orders.eu.created</text>
    <line x1="128" y1="333" x2="163" y2="319" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <line x1="128" y1="337" x2="163" y2="351" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>

    <text x="125" y="390" font-size="7.8" fill="#555555" text-anchor="middle">"*" matches one word, "#"</text>
    <text x="125" y="400" font-size="7.8" fill="#555555" text-anchor="middle">matches zero or more --</text>
    <text x="125" y="410" font-size="7.8" fill="#555555" text-anchor="middle">one message can match both</text>
  </g>

  <!-- Panel 5: RPC (col2, row2) -->
  <g>
    <rect x="245" y="280" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="350" y="297" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">5. RPC</text>
    <text x="350" y="310" font-size="8.5" fill="#666666" text-anchor="middle">reply_to + correlation_id</text>

    <rect x="260" y="330" width="55" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="287" y="343" font-size="7.5" text-anchor="middle" fill="#22326a">Requester</text>

    <rect x="345" y="315" width="60" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="375" y="327" font-size="6.8" text-anchor="middle" fill="#333333">rpc.orders</text>
    <rect x="345" y="347" width="60" height="18" rx="3" fill="#eeeeee" stroke="#999999"/>
    <text x="375" y="359" font-size="6.8" text-anchor="middle" fill="#333333">reply_to queue</text>

    <rect x="425" y="330" width="20" height="20" rx="3" fill="#f3eefb" stroke="#7a4fa8"/>
    <text x="435" y="343" font-size="7" text-anchor="middle" fill="#4a2f6a">R</text>

    <line x1="315" y1="335" x2="343" y2="324" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="330" y="314" font-size="6.2" fill="#555555" text-anchor="middle">correlation_id: 42</text>
    <line x1="405" y1="324" x2="423" y2="335" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="423" y1="345" x2="405" y2="356" stroke="#7a4fa8" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="343" y1="356" x2="315" y2="345" stroke="#7a4fa8" stroke-width="1.4" marker-end="url(#arrow)"/>

    <text x="350" y="390" font-size="7.8" fill="#555555" text-anchor="middle">reply matched back by</text>
    <text x="350" y="400" font-size="7.8" fill="#555555" text-anchor="middle">correlation_id; amq.rabbitmq.reply-to</text>
    <text x="350" y="410" font-size="7.8" fill="#555555" text-anchor="middle">skips the per-request queue</text>
  </g>

  <!-- Panel 6: Publisher Confirms (col3, row2) -->
  <g>
    <rect x="470" y="280" width="210" height="210" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="575" y="297" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">6. Publisher confirms</text>
    <text x="575" y="310" font-size="8.5" fill="#666666" text-anchor="middle">a reliability layer, not a topology</text>

    <rect x="485" y="330" width="50" height="20" rx="3" fill="#eef2fb" stroke="#3a5fa8"/>
    <text x="510" y="343" font-size="8" text-anchor="middle" fill="#22326a">Publisher</text>

    <rect x="605" y="330" width="46" height="20" rx="3" fill="#f7f7f7" stroke="#999999"/>
    <text x="628" y="343" font-size="7.5" text-anchor="middle" fill="#333333">Broker</text>

    <line x1="535" y1="336" x2="603" y2="336" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="570" y="328" font-size="6.5" fill="#555555" text-anchor="middle">basic.publish (any exchange above)</text>
    <line x1="603" y1="346" x2="535" y2="346" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <text x="570" y="362" font-size="6.5" fill="#2d6a34" text-anchor="middle">basic.ack (delivery tag)</text>

    <text x="575" y="390" font-size="7.8" fill="#555555" text-anchor="middle">confirmSelect() opts a channel in;</text>
    <text x="575" y="400" font-size="7.8" fill="#555555" text-anchor="middle">works the same on top of work</text>
    <text x="575" y="410" font-size="7.8" fill="#555555" text-anchor="middle">queues, fanout, direct, topic or RPC</text>
  </g>
</svg>
