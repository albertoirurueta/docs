<svg viewBox="0 0 980 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Visual Basic numeric types by size and signedness</title>
  <desc id="d">A grid with the numeric types of Visual Basic. Columns are 8, 16, 32, 64 and 128 bits. The first row has the signed integers SByte, Short, Integer and Long. The second row has the unsigned integers Byte, UShort, UInteger and ULong. The third row has Single, Double and Decimal. Each box gives the CLR type name, the range and the literal suffix.</desc>
  <rect x="0" y="0" width="980" height="500" fill="#ffffff"/>
  <text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Visual Basic numeric types by size and signedness</text>
  <text x="490" y="46" font-size="12" fill="#666666" text-anchor="middle">each keyword is an alias of the CLR type below it; the literal suffix and type character force the type of a literal</text>
  <text x="240" y="78" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">8 bits</text>
  <line x1="170" y1="86" x2="310" y2="86" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="400" y="78" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">16 bits</text>
  <line x1="330" y1="86" x2="470" y2="86" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="560" y="78" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">32 bits</text>
  <line x1="490" y1="86" x2="630" y2="86" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="720" y="78" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">64 bits</text>
  <line x1="650" y1="86" x2="790" y2="86" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="880" y="78" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">128 bits</text>
  <line x1="810" y1="86" x2="950" y2="86" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="24" y="136" font-size="13" font-weight="bold" fill="#1c4b73">Signed integers</text>
  <rect x="170" y="98" width="140" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
  <g text-anchor="middle" fill="#222222">
    <text x="240" y="122" font-size="15" font-weight="bold">SByte</text>
    <text x="240" y="140" font-size="11" fill="#444444">System.SByte</text>
    <text x="240" y="158" font-size="10">-128 .. 127</text>
    <text x="240" y="176" font-size="10" fill="#555555">no literal suffix</text>
  </g>
  <rect x="330" y="98" width="140" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
  <g text-anchor="middle" fill="#222222">
    <text x="400" y="122" font-size="15" font-weight="bold">Short</text>
    <text x="400" y="140" font-size="11" fill="#444444">System.Int16</text>
    <text x="400" y="158" font-size="10">-32,768 .. 32,767</text>
    <text x="400" y="176" font-size="10" fill="#555555">suffix S</text>
  </g>
  <rect x="490" y="98" width="140" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
  <g text-anchor="middle" fill="#222222">
    <text x="560" y="122" font-size="15" font-weight="bold">Integer</text>
    <text x="560" y="140" font-size="11" fill="#444444">System.Int32</text>
    <text x="560" y="158" font-size="10">about +/- 2.1 billion</text>
    <text x="560" y="176" font-size="10" fill="#555555">suffix I, type char %</text>
  </g>
  <rect x="650" y="98" width="140" height="92" fill="#e8f0f8" stroke="#1c4b73"/>
  <g text-anchor="middle" fill="#222222">
    <text x="720" y="122" font-size="15" font-weight="bold">Long</text>
    <text x="720" y="140" font-size="11" fill="#444444">System.Int64</text>
    <text x="720" y="158" font-size="10">about +/- 9.2 x 10^18</text>
    <text x="720" y="176" font-size="10" fill="#555555">suffix L, type char &amp;</text>
  </g>
  <text x="24" y="244" font-size="13" font-weight="bold" fill="#2e7d32">Unsigned integers</text>
  <rect x="170" y="206" width="140" height="92" fill="#e9f5e9" stroke="#2e7d32"/>
  <g text-anchor="middle" fill="#222222">
    <text x="240" y="230" font-size="15" font-weight="bold">Byte</text>
    <text x="240" y="248" font-size="11" fill="#444444">System.Byte</text>
    <text x="240" y="266" font-size="10">0 .. 255</text>
    <text x="240" y="284" font-size="10" fill="#555555">no literal suffix</text>
  </g>
  <rect x="330" y="206" width="140" height="92" fill="#e9f5e9" stroke="#2e7d32"/>
  <g text-anchor="middle" fill="#222222">
    <text x="400" y="230" font-size="15" font-weight="bold">UShort</text>
    <text x="400" y="248" font-size="11" fill="#444444">System.UInt16</text>
    <text x="400" y="266" font-size="10">0 .. 65,535</text>
    <text x="400" y="284" font-size="10" fill="#555555">suffix US</text>
  </g>
  <rect x="490" y="206" width="140" height="92" fill="#e9f5e9" stroke="#2e7d32"/>
  <g text-anchor="middle" fill="#222222">
    <text x="560" y="230" font-size="15" font-weight="bold">UInteger</text>
    <text x="560" y="248" font-size="11" fill="#444444">System.UInt32</text>
    <text x="560" y="266" font-size="10">0 .. 4,294,967,295</text>
    <text x="560" y="284" font-size="10" fill="#555555">suffix UI</text>
  </g>
  <rect x="650" y="206" width="140" height="92" fill="#e9f5e9" stroke="#2e7d32"/>
  <g text-anchor="middle" fill="#222222">
    <text x="720" y="230" font-size="15" font-weight="bold">ULong</text>
    <text x="720" y="248" font-size="11" fill="#444444">System.UInt64</text>
    <text x="720" y="266" font-size="10">0 .. about 1.8 x 10^19</text>
    <text x="720" y="284" font-size="10" fill="#555555">suffix UL</text>
  </g>
  <text x="24" y="352" font-size="13" font-weight="bold" fill="#b26a00">Floating point</text>
  <text x="24" y="368" font-size="13" font-weight="bold" fill="#b26a00">and decimal</text>
  <rect x="490" y="314" width="140" height="92" fill="#fdf3e1" stroke="#b26a00"/>
  <g text-anchor="middle" fill="#222222">
    <text x="560" y="338" font-size="15" font-weight="bold">Single</text>
    <text x="560" y="356" font-size="11" fill="#444444">System.Single</text>
    <text x="560" y="374" font-size="10">+/- 3.4 x 10^38, ~7 digits</text>
    <text x="560" y="392" font-size="10" fill="#555555">suffix F, type char !</text>
  </g>
  <rect x="650" y="314" width="140" height="92" fill="#fdf3e1" stroke="#b26a00"/>
  <g text-anchor="middle" fill="#222222">
    <text x="720" y="338" font-size="15" font-weight="bold">Double</text>
    <text x="720" y="356" font-size="11" fill="#444444">System.Double</text>
    <text x="720" y="374" font-size="10">+/- 1.8 x 10^308, 15-17 digits</text>
    <text x="720" y="392" font-size="10" fill="#555555">suffix R, type char #</text>
  </g>
  <rect x="810" y="314" width="140" height="92" fill="#fdf3e1" stroke="#b26a00"/>
  <g text-anchor="middle" fill="#222222">
    <text x="880" y="338" font-size="15" font-weight="bold">Decimal</text>
    <text x="880" y="356" font-size="11" fill="#444444">System.Decimal</text>
    <text x="880" y="374" font-size="10">+/- 7.9 x 10^28, 28-29 digits</text>
    <text x="880" y="392" font-size="10" fill="#555555">suffix D, type char @</text>
  </g>
  <text x="320" y="350" font-size="11" fill="#666666" text-anchor="middle">no 8-bit or 16-bit floating-point keyword</text>
  <text x="320" y="366" font-size="11" fill="#666666" text-anchor="middle">(System.Half exists but has no keyword or literal)</text>
  <text x="24" y="440" font-size="12" fill="#222222">Not in the grid: Boolean (1 byte), Char (2 bytes, one UTF-16 code unit), Date (8 bytes, System.DateTime), and the reference types String and Object.</text>
  <text x="24" y="460" font-size="12" fill="#222222">SByte, UShort, UInteger and ULong are not CLS-compliant. Integer arithmetic is overflow-checked by default; Single and Double follow IEEE 754.</text>
  <text x="24" y="480" font-size="12" fill="#222222">Decimal stores a 96-bit integer and a power-of-ten scale from 0 to 28, so 0.1 is exact; Single and Double store binary fractions, so 0.1 is not.</text>
</svg>
