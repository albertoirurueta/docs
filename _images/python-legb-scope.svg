<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The LEGB Rule: Where Python Looks Up a Name</text>
  <text x="360" y="45" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">print(name) inside inner() -- search order: Local -&gt; Enclosing -&gt; Global -&gt; Built-in</text>

  <!-- Built-in (outermost) -->
  <rect x="20" y="80" width="680" height="360" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="30" y="100" font-size="13" font-weight="bold" fill="#444444">4. Built-in</text>

  <!-- Global -->
  <rect x="55" y="115" width="610" height="290" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="65" y="135" font-size="13" font-weight="bold" fill="#444444">3. Global</text>

  <!-- Enclosing -->
  <rect x="90" y="150" width="540" height="220" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="100" y="170" font-size="13" font-weight="bold" fill="#444444">2. Enclosing</text>

  <!-- Local (innermost) -->
  <rect x="125" y="185" width="470" height="150" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4"/>
  <text x="135" y="205" font-size="13" font-weight="bold" fill="#2f5424">1. Local</text>

  <!-- code inside Local -->
  <text x="145" y="228" font-size="13" fill="#222222" font-family="'Courier New', monospace">def inner():</text>
  <text x="145" y="246" font-size="13" fill="#222222" font-family="'Courier New', monospace">    print(name)</text>
  <text x="145" y="263" font-size="11" fill="#666666" font-family="'Courier New', monospace">    # 'name' not assigned here</text>
  <text x="145" y="280" font-size="11" fill="#666666">lookup for "name" starts in this scope</text>

  <!-- annotation band for Enclosing (between Local bottom 335 and Enclosing bottom 370) -->
  <text x="135" y="355" font-size="13" fill="#2f5424" font-weight="bold" font-family="'Courier New', monospace">name = "outer"   # found here</text>

  <!-- annotation band for Global (between Enclosing bottom 370 and Global bottom 405) -->
  <text x="100" y="390" font-size="12" fill="#888888" font-family="'Courier New', monospace">name = "global"   # not reached</text>

  <!-- annotation band for Built-in (between Global bottom 405 and Built-in bottom 440) -->
  <text x="65" y="425" font-size="12" fill="#888888" font-family="'Courier New', monospace">len, print, ...   # not reached</text>

  <!-- lookup arrow: from inside Local, stopping at the Enclosing annotation -->
  <g stroke="#2f5424" stroke-width="1.8" fill="#2f5424">
    <line x1="160" y1="252" x2="160" y2="349"/>
    <polygon points="154,343 166,343 160,353" stroke="none"/>
  </g>
  <text x="172" y="300" font-size="10" fill="#2f5424" font-style="italic">lookup for "name"</text>

  <!-- dashed grey line showing the search does NOT continue further out -->
  <line x1="160" y1="358" x2="160" y2="420" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="172" y="415" font-size="10" fill="#999999" font-style="italic">search stops -- never reaches Global or Built-in</text>

  <text x="360" y="458" font-size="12" fill="#444444" text-anchor="middle">Python searches Local, then Enclosing, then Global, then Built-in -- stopping at the first scope that defines the name.</text>
</svg>
