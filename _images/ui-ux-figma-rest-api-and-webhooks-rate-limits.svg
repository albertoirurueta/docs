<svg viewBox="0 0 740 340" width="740" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="740" height="340" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Rate limits: endpoint tier, seat type, plan</text>

<rect x="20" y="48" width="330" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="38" cy="66" r="11" fill="#4F46E5"/><text x="38" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="56" y="71" font-size="14" font-weight="bold" fill="#3730A3">The endpoint has a tier</text>
<text x="36" y="98" font-size="12" font-weight="bold" fill="#374151">Tier 1</text><text x="90" y="98" font-size="12" fill="#374151">files, nodes, images</text>
<text x="36" y="122" font-size="12" font-weight="bold" fill="#374151">Tier 2</text><text x="90" y="122" font-size="12" fill="#374151">comments, variables (read), webhooks</text>
<text x="36" y="146" font-size="12" font-weight="bold" fill="#374151">Tier 3</text><text x="90" y="146" font-size="12" fill="#374151">components and styles, users</text>
<text x="36" y="176" font-size="12" fill="#4B5563">Examples only; the official page is the full list</text>

<rect x="390" y="48" width="330" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<circle cx="408" cy="66" r="11" fill="#B45309"/><text x="408" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="426" y="71" font-size="14" font-weight="bold" fill="#92400E">Seat and plan set the budget</text>
<text x="406" y="98" font-size="12" fill="#374151">Full and Dev seats: high limit</text>
<text x="406" y="122" font-size="12" fill="#374151">View and Collab seats: low limit</text>
<text x="406" y="146" font-size="12" fill="#374151">Plan of the requested file matters</text>
<text x="406" y="176" font-size="12" fill="#4B5563">Starter, Professional, Organization, Enterprise</text>

<path d="M185,198 L185,226 L370,226 L370,244" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<path d="M555,198 L555,226 L370,226" fill="none" stroke="#4B5563" stroke-width="2"/>

<rect x="20" y="246" width="700" height="76" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<circle cx="38" cy="264" r="11" fill="#B91C1C"/><text x="38" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="56" y="269" font-size="14" font-weight="bold" fill="#991B1B">Over the limit: HTTP 429</text>
<text x="36" y="292" font-size="12" fill="#374151">Read Retry-After (seconds), wait, then retry with backoff. Also sent: X-Figma-Plan-Tier,</text>
<text x="36" y="310" font-size="12" fill="#374151">X-Figma-Rate-Limit-Type and X-Figma-Upgrade-Link. Cache responses and batch node ids.</text>
</svg>
