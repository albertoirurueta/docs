<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="940" height="330" fill="#ffffff"/>
<text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Struct layout and padding on a 64-bit platform (one cell = one byte)</text>
<text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">fields are aligned to their own alignment; the struct is padded to a multiple of its largest field alignment</text>
<defs><pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bbbbbb" stroke-width="2"/></pattern></defs>
<text x="30" y="90" font-size="14" font-weight="bold" fill="#1c4b73">Loose: Active bool, ID int64, Copies int8  (24 bytes)</text>
<rect x="30" y="102" width="34" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="47.0" y="128" font-size="10" fill="#222222" text-anchor="middle">bool</text>
<rect x="64" y="102" width="238" height="44" fill="url(#pad)" stroke="#888888"/>
<text x="183.0" y="128" font-size="11" fill="#555555" text-anchor="middle">pad 7</text>
<rect x="302" y="102" width="272" height="44" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="438.0" y="128" font-size="12" fill="#222222" text-anchor="middle">ID int64</text>
<rect x="574" y="102" width="34" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="591.0" y="128" font-size="10" fill="#222222" text-anchor="middle">int8</text>
<rect x="608" y="102" width="238" height="44" fill="url(#pad)" stroke="#888888"/>
<text x="727.0" y="128" font-size="11" fill="#555555" text-anchor="middle">pad 7</text>
<text x="30" y="164" font-size="11" fill="#666666" text-anchor="middle">0</text>
<line x1="30" y1="146" x2="30" y2="152" stroke="#666666"/>
<text x="302" y="164" font-size="11" fill="#666666" text-anchor="middle">8</text>
<line x1="302" y1="146" x2="302" y2="152" stroke="#666666"/>
<text x="574" y="164" font-size="11" fill="#666666" text-anchor="middle">16</text>
<line x1="574" y1="146" x2="574" y2="152" stroke="#666666"/>
<text x="846" y="164" font-size="11" fill="#666666" text-anchor="middle">24</text>
<line x1="846" y1="146" x2="846" y2="152" stroke="#666666"/>
<text x="30" y="220" font-size="14" font-weight="bold" fill="#1c4b73">Tight: ID int64, Active bool, Copies int8  (16 bytes)</text>
<rect x="30" y="232" width="272" height="44" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="166.0" y="258" font-size="12" fill="#222222" text-anchor="middle">ID int64</text>
<rect x="302" y="232" width="34" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="319.0" y="258" font-size="10" fill="#222222" text-anchor="middle">bool</text>
<rect x="336" y="232" width="34" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
<text x="353.0" y="258" font-size="10" fill="#222222" text-anchor="middle">int8</text>
<rect x="370" y="232" width="204" height="44" fill="url(#pad)" stroke="#888888"/>
<text x="472.0" y="258" font-size="11" fill="#555555" text-anchor="middle">pad 6</text>
<text x="30" y="294" font-size="11" fill="#666666" text-anchor="middle">0</text>
<line x1="30" y1="276" x2="30" y2="282" stroke="#666666"/>
<text x="302" y="294" font-size="11" fill="#666666" text-anchor="middle">8</text>
<line x1="302" y1="276" x2="302" y2="282" stroke="#666666"/>
<text x="574" y="294" font-size="11" fill="#666666" text-anchor="middle">16</text>
<line x1="574" y1="276" x2="574" y2="282" stroke="#666666"/>
<text x="470" y="318" font-size="12" fill="#444444" text-anchor="middle">same three fields, same values: ordering them from large to small alignment saves 8 bytes per value</text>
</svg>
