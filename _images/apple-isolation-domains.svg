<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Isolation domains in FieldNotes</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Only Sendable values cross a boundary; non-Sendable state stays inside the domain that owns it</text>

  <defs>
    <marker id="iso-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
    <marker id="iso-arrow-back" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- MainActor domain -->
  <rect x="20" y="70" width="230" height="300" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="135" y="95" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">MainActor</text>
  <text x="135" y="113" font-size="13" fill="#333333" text-anchor="middle">default for the app target</text>
  <rect x="38" y="128" width="194" height="40" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="135" y="153" font-size="13" fill="#222222" text-anchor="middle">SwiftUI views, NoteList</text>
  <rect x="38" y="178" width="194" height="40" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="135" y="203" font-size="13" fill="#222222" text-anchor="middle">NoteStore (@Observable)</text>
  <rect x="38" y="228" width="194" height="52" rx="6" fill="#fbecec" stroke="#a33333" stroke-dasharray="4,3"/>
  <text x="135" y="250" font-size="13" fill="#a33333" text-anchor="middle">LocationFixStream</text>
  <text x="135" y="268" font-size="13" fill="#a33333" text-anchor="middle">non-Sendable: stays here</text>
  <text x="135" y="310" font-size="13" fill="#333333" text-anchor="middle">Runs on the main thread;</text>
  <text x="135" y="328" font-size="13" fill="#333333" text-anchor="middle">mutable state accessed</text>
  <text x="135" y="346" font-size="13" fill="#333333" text-anchor="middle">without await inside</text>

  <!-- Custom actor domain -->
  <rect x="510" y="70" width="230" height="140" rx="10" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.6"/>
  <text x="625" y="95" font-size="15" font-weight="bold" fill="#5b3a8c" text-anchor="middle">actor CloudNoteSyncer</text>
  <text x="625" y="113" font-size="13" fill="#333333" text-anchor="middle">custom actor, serial</text>
  <rect x="528" y="128" width="194" height="40" rx="6" fill="#ffffff" stroke="#5b3a8c"/>
  <text x="625" y="153" font-size="13" fill="#222222" text-anchor="middle">pending changes, tokens</text>
  <text x="625" y="192" font-size="13" fill="#333333" text-anchor="middle">entered with await</text>

  <!-- Nonisolated / concurrent domain -->
  <rect x="510" y="230" width="230" height="140" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="625" y="255" font-size="15" font-weight="bold" fill="#2d6a34" text-anchor="middle">@concurrent / nonisolated</text>
  <text x="625" y="273" font-size="13" fill="#333333" text-anchor="middle">global concurrent executor</text>
  <rect x="528" y="288" width="194" height="40" rx="6" fill="#ffffff" stroke="#2d6a34"/>
  <text x="625" y="313" font-size="13" fill="#222222" text-anchor="middle">NoteSearchIndex.build</text>
  <text x="625" y="352" font-size="13" fill="#333333" text-anchor="middle">no shared mutable state</text>

  <!-- Crossings -->
  <line x1="250" y1="130" x2="506" y2="130" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#iso-arrow)"/>
  <text x="378" y="122" font-size="13" fill="#2d6a34" text-anchor="middle">await syncer.enqueue(notes)</text>
  <line x1="506" y1="165" x2="252" y2="165" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#iso-arrow-back)"/>
  <text x="378" y="182" font-size="13" fill="#1c4b73" text-anchor="middle">resumes on MainActor</text>

  <line x1="250" y1="290" x2="506" y2="290" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#iso-arrow)"/>
  <text x="378" y="282" font-size="13" fill="#2d6a34" text-anchor="middle">sends [Note] (Sendable)</text>
  <line x1="506" y1="325" x2="252" y2="325" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#iso-arrow-back)"/>
  <text x="378" y="342" font-size="13" fill="#1c4b73" text-anchor="middle">resumes on MainActor with index</text>

  <!-- Blocked crossing -->
  <line x1="250" y1="254" x2="380" y2="254" stroke="#a33333" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="392" y="259" font-size="16" font-weight="bold" fill="#a33333">&#215;</text>
  <text x="378" y="236" font-size="13" fill="#a33333" text-anchor="middle">compile error: not Sendable</text>

  <!-- Legend -->
  <rect x="20" y="392" width="720" height="52" rx="8" fill="#f7f7f7" stroke="#cccccc"/>
  <line x1="40" y1="412" x2="80" y2="412" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#iso-arrow)"/>
  <text x="90" y="416" font-size="13" fill="#333333">call that suspends and hops domains</text>
  <line x1="40" y1="432" x2="80" y2="432" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#iso-arrow-back)"/>
  <text x="90" y="436" font-size="13" fill="#333333">result returned to the caller's domain</text>
  <line x1="420" y1="422" x2="460" y2="422" stroke="#a33333" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="470" y="426" font-size="13" fill="#333333">crossing rejected by the compiler</text>
</svg>
