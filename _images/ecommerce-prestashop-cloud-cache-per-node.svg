<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Clearing the PrestaShop cache in a cluster reaches one pod</title>
  <desc id="d">An administrator presses Clear cache in the back office and the request is answered by pod A. Pod A deletes its own Symfony container and Smarty files in var/cache/prod and the combined CSS and JavaScript files in its theme assets/cache directory. Pod B keeps its old compiled container, compiled templates and combined assets, because those are files on its own disk. Below the pods, the shared services are not emptied by the button: the database receives the new combined-asset version counters and, when multi-front optimisation is on, a flush marker for Smarty that other pods read on their next request; Memcached keeps the SQL cache entries until a write invalidates them; Valkey keeps the PHP sessions.</desc>
  <rect x="0" y="0" width="960" height="552" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">The Clear cache button empties the disk of one pod, not the cluster</text>

  <rect x="30" y="70" width="170" height="110" rx="10" fill="#3d5266"/>
  <text x="44" y="96" font-size="14" font-weight="bold" fill="#f2f5f8">Back office</text>
  <text x="44" y="120" font-size="12.5" fill="#f2f5f8">Advanced Parameters,</text>
  <text x="44" y="137" font-size="12.5" fill="#f2f5f8">Performance, Clear cache</text>
  <text x="44" y="164" font-size="12.5" fill="#f4b860">one HTTP request</text>

  <line x1="200" y1="125" x2="258" y2="125" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>

  <rect x="260" y="60" width="300" height="300" rx="10" fill="#33485c"/>
  <text x="276" y="86" font-size="14" font-weight="bold" fill="#f2f5f8">Pod A (served the click)</text>
  <rect x="276" y="104" width="268" height="74" rx="8" fill="#4d7c5a"/>
  <text x="288" y="126" font-size="12.5" font-weight="bold" fill="#f2f5f8">var/cache/prod</text>
  <text x="288" y="145" font-size="12.5" fill="#f2f5f8">Symfony container, Smarty compile</text>
  <text x="288" y="163" font-size="12.5" fill="#f2f5f8">and cache: deleted, rebuilt on demand</text>
  <rect x="276" y="188" width="268" height="58" rx="8" fill="#4d7c5a"/>
  <text x="288" y="210" font-size="12.5" font-weight="bold" fill="#f2f5f8">themes/hummingbird/assets/cache</text>
  <text x="288" y="229" font-size="12.5" fill="#f2f5f8">combined CSS and JS: deleted</text>
  <rect x="276" y="256" width="268" height="44" rx="8" fill="#3f6e9a"/>
  <text x="288" y="283" font-size="12.5" fill="#f2f5f8">OPcache: not touched by the button</text>
  <text x="276" y="332" font-size="12.5" fill="#9fd3c7">new version numbers are in the database</text>

  <rect x="600" y="60" width="300" height="300" rx="10" fill="#33485c"/>
  <text x="616" y="86" font-size="14" font-weight="bold" fill="#f2f5f8">Pod B (not asked)</text>
  <rect x="616" y="104" width="268" height="74" rx="8" fill="#7a5c3a"/>
  <text x="628" y="126" font-size="12.5" font-weight="bold" fill="#f2f5f8">var/cache/prod</text>
  <text x="628" y="145" font-size="12.5" fill="#f2f5f8">old container, old compiled templates,</text>
  <text x="628" y="163" font-size="12.5" fill="#f2f5f8">old module caches: still served</text>
  <rect x="616" y="188" width="268" height="58" rx="8" fill="#7a5c3a"/>
  <text x="628" y="210" font-size="12.5" font-weight="bold" fill="#f2f5f8">themes/hummingbird/assets/cache</text>
  <text x="628" y="229" font-size="12.5" fill="#f2f5f8">old combined files: still on disk</text>
  <rect x="616" y="256" width="268" height="44" rx="8" fill="#3f6e9a"/>
  <text x="628" y="283" font-size="12.5" fill="#f2f5f8">OPcache: its own</text>
  <text x="616" y="332" font-size="12.5" fill="#f4b860">learns about the new version numbers</text>
  <text x="616" y="349" font-size="12.5" fill="#f4b860">only when it reads the database</text>

  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="410" y1="360" x2="410" y2="398" marker-end="url(#a)"/>
    <line x1="750" y1="360" x2="750" y2="398" marker-end="url(#a)"/>
  </g>

  <rect x="260" y="400" width="640" height="136" rx="10" fill="#3d5266"/>
  <text x="276" y="426" font-size="14" font-weight="bold" fill="#f2f5f8">Shared by every pod: not emptied by the button</text>
  <rect x="276" y="440" width="196" height="82" rx="8" fill="#34495e"/>
  <text x="288" y="460" font-size="12.5" font-weight="bold" fill="#9fd3c7">Database</text>
  <text x="288" y="478" font-size="12.5" fill="#f2f5f8">PS_CCCJS_VERSION and</text>
  <text x="288" y="494" font-size="12.5" fill="#f2f5f8">PS_CCCCSS_VERSION raised;</text>
  <text x="288" y="510" font-size="12.5" fill="#f2f5f8">Smarty flush marker</text>
  <rect x="482" y="440" width="196" height="82" rx="8" fill="#34495e"/>
  <text x="494" y="460" font-size="12.5" font-weight="bold" fill="#c9b3e6">Memcached</text>
  <text x="494" y="478" font-size="12.5" fill="#f2f5f8">SQL cache: entries live</text>
  <text x="494" y="494" font-size="12.5" fill="#f2f5f8">until a write to a table</text>
  <text x="494" y="510" font-size="12.5" fill="#f2f5f8">invalidates them</text>
  <rect x="688" y="440" width="196" height="82" rx="8" fill="#34495e"/>
  <text x="700" y="460" font-size="12.5" font-weight="bold" fill="#f4b860">Valkey</text>
  <text x="700" y="478" font-size="12.5" fill="#f2f5f8">PHP sessions: kept, so</text>
  <text x="700" y="494" font-size="12.5" fill="#f2f5f8">nobody is logged out</text>
  <text x="700" y="510" font-size="12.5" fill="#f2f5f8">by a cache clear</text>

  <text x="30" y="240" font-size="12.5" fill="#f2f5f8">The load balancer picks</text>
  <text x="30" y="257" font-size="12.5" fill="#f2f5f8">the pod; the operator</text>
  <text x="30" y="274" font-size="12.5" fill="#f2f5f8">cannot choose it.</text>
  <text x="30" y="310" font-size="12.5" fill="#f4b860">Fix: build caches per</text>
  <text x="30" y="327" font-size="12.5" fill="#f4b860">pod at start and ship</text>
  <text x="30" y="344" font-size="12.5" fill="#f4b860">changes as a new image.</text>
</svg>
