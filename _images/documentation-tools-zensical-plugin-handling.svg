<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">How Zensical treats the plugins entries of a configuration file</title>
  <desc id="d">A plugin entry is checked against the supported list. Supported plugins run natively and reject unknown settings, listed ignored settings are dropped silently, and unlisted plugins are ignored without any message.</desc>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#2b3340"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
    <rect x="20" y="125" width="150" height="70" rx="10" fill="#4a5568" stroke="#cbd5e0"/>
    <text x="95" y="155">plugins entry</text>
    <text x="95" y="175" font-size="12">zensical.toml or mkdocs.yml</text>
    <rect x="215" y="125" width="150" height="70" rx="10" fill="#6b46c1" stroke="#e9d8fd"/>
    <text x="290" y="155">In the supported</text>
    <text x="290" y="175">list of 31 plugins?</text>
    <path d="M170 160 H213" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <path d="M365 140 C400 140 405 70 440 70" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <path d="M365 180 C400 180 405 260 440 260" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <text x="402" y="108" font-size="12">yes</text>
    <text x="402" y="238" font-size="12">no</text>
    <rect x="440" y="25" width="300" height="55" rx="10" fill="#2f855a" stroke="#c6f6d5"/>
    <text x="590" y="48">Native implementation runs</text>
    <text x="590" y="68" font-size="12">unknown setting: configuration error</text>
    <rect x="440" y="95" width="300" height="55" rx="10" fill="#2c7a7b" stroke="#b2f5ea"/>
    <text x="590" y="118">Documented ignored setting</text>
    <text x="590" y="138" font-size="12">dropped silently, no warning</text>
    <rect x="440" y="232" width="300" height="55" rx="10" fill="#b7791f" stroke="#fefcbf"/>
    <text x="590" y="255">Unlisted plugin</text>
    <text x="590" y="275" font-size="12">not imported, ignored silently</text>
    <path d="M365 160 H400" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
    <path d="M400 160 C420 160 420 122 440 122" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  </g>
</svg>
