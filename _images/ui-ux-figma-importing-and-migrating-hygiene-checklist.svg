<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">File hygiene after an import</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="30" y="50" width="330" height="56" rx="10"/>
    <rect x="400" y="50" width="330" height="56" rx="10"/>
    <rect x="30" y="122" width="330" height="56" rx="10"/>
    <rect x="400" y="122" width="330" height="56" rx="10"/>
    <rect x="30" y="194" width="330" height="56" rx="10"/>
    <rect x="400" y="194" width="330" height="56" rx="10"/>
  </g>
  <g fill="#4F46E5">
    <circle cx="30" cy="50" r="11"/><circle cx="400" cy="50" r="11"/><circle cx="30" cy="122" r="11"/>
    <circle cx="400" cy="122" r="11"/><circle cx="30" cy="194" r="11"/><circle cx="400" cy="194" r="11"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="30" y="54">1</text><text x="400" y="54">2</text><text x="30" y="126">3</text>
    <text x="400" y="126">4</text><text x="30" y="198">5</text><text x="400" y="198">6</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#3730A3">
    <text x="50" y="74">Fix fonts</text>
    <text x="420" y="74">Rename pages and frames</text>
    <text x="50" y="146">Recreate styles</text>
    <text x="420" y="146">Reconnect components</text>
    <text x="50" y="218">Check images and vectors</text>
    <text x="420" y="218">Publish and archive</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="50" y="94">Resolve the Missing fonts prompt</text>
    <text x="420" y="94">Match the Bookshelf naming scheme</text>
    <text x="50" y="166">Colours and text as styles or variables</text>
    <text x="420" y="166">Library swap after publishing</text>
    <text x="50" y="238">Look for flattened or missing layers</text>
    <text x="420" y="238">Keep the original file as a backup</text>
  </g>
  <text x="380" y="280" font-size="12" fill="#4B5563" text-anchor="middle">Work through the list on one imported file before importing the rest.</text>
