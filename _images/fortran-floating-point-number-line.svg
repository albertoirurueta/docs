  <text x="330" y="422" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">1.1754944E-38</text>
  <text x="205.0" y="406" font-size="11" fill="#b07a00" text-anchor="middle" font-weight="normal">subnormal range, below tiny</text>
  <text x="350" y="458" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">Without subnormals (flush to zero) the gap from 0 to tiny would be empty:</text>
  <text x="350" y="474" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">tiny is 2^23 times the spacing of its neighbours.</text>
  <rect x="80" y="442" width="250" height="30" fill="#ffffff" stroke="#a33333" stroke-dasharray="5 3"/>
  <text x="205.0" y="461" font-size="11" fill="#a33333" text-anchor="middle" font-weight="normal">empty gap if flushed to zero</text>
  <text x="40" y="528" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">C.  Zoom on 1.0: the spacing doubles at every power of two, and epsilon is the spacing just above 1</text>
