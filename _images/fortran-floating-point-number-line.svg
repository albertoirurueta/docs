  <text x="470" y="624" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">1.0</text>
  <line x1="430" y1="642" x2="470" y2="642" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="430" y1="638" x2="430" y2="646" stroke="#2e7d32"/>
  <line x1="470" y1="638" x2="470" y2="646" stroke="#2e7d32"/>
  <line x1="470" y1="642" x2="550" y2="642" stroke="#a33333" stroke-width="1.5"/>
  <line x1="470" y1="638" x2="470" y2="646" stroke="#a33333"/>
  <line x1="550" y1="638" x2="550" y2="646" stroke="#a33333"/>
  <text x="464" y="662" font-size="11" fill="#2e7d32" text-anchor="end" font-weight="normal">epsilon/2 = 2^-24</text>
  <text x="476" y="662" font-size="11" fill="#a33333" text-anchor="start" font-weight="normal">epsilon = 2^-23</text>
  <text x="550" y="582" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">1 + epsilon</text>
  <text x="430" y="582" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">1 - epsilon/2</text>
  <text x="470" y="686" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">epsilon = 1.1920929E-07 = spacing(1.0), the gap between 1.0 and the next real32 number</text>
  <text x="250" y="548" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">numbers in [0.5, 1) are spaced epsilon/2</text>
  <text x="690" y="548" font-size="11" fill="#a33333" text-anchor="middle" font-weight="normal">numbers in [1, 2) are spaced epsilon</text>
  <text x="470" y="714" font-size="11.5" fill="#444444" text-anchor="middle" font-weight="normal">relative spacing stays between epsilon/2 and epsilon for all normal numbers, which is why epsilon measures relative rounding error</text>
  <text x="470" y="732" font-size="11.5" fill="#444444" text-anchor="middle" font-weight="normal">and why a fixed absolute tolerance is wrong far from 1: spacing(1.0e10) is 1024 for real32</text>
</svg>
