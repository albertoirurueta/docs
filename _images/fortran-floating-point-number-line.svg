<svg viewBox="0 0 940 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The real32 floating-point number line around zero: infinities, huge, tiny, subnormals, signed zeros and the epsilon spacing around 1</title>
  <rect x="0" y="0" width="940" height="760" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The floating-point number line (real32, binary radix)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">schematic and not to scale; the values are the ones gfortran 16.2 and Flang 23 print for real32</text>
  <text x="40" y="82" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">A.  The whole line: where each kind of value lives</text>
