  <text x="470" y="154" font-size="12" fill="#b07a00" text-anchor="middle" font-weight="normal">subnormal</text>
  <text x="655" y="154" font-size="12" fill="#1c4b73" text-anchor="middle" font-weight="normal">normal numbers</text>
  <text x="835" y="154" font-size="12" fill="#a33333" text-anchor="middle" font-weight="normal">overflow</text>
  <line x1="60" y1="128" x2="60" y2="172" stroke="#222222" stroke-width="1.8"/>
