  <line x1="880" y1="128" x2="880" y2="172" stroke="#222222" stroke-width="1.8"/>
  <text x="60" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-Infinity</text>
  <text x="150" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-huge</text>
  <text x="420" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-tiny</text>
  <text x="470" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-0  +0</text>
  <text x="520" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">+tiny</text>
  <text x="790" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">+huge</text>
  <text x="880" y="116" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">+Infinity</text>
  <text x="150" y="186" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-3.4028235E+38</text>
  <text x="420" y="186" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">-1.1754944E-38</text>
  <text x="520" y="186" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">1.1754944E-38</text>
  <text x="790" y="186" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">3.4028235E+38</text>
  <text x="470" y="204" font-size="11" fill="#b07a00" text-anchor="middle" font-weight="normal" font-family="Courier New, monospace">smallest subnormal 1.4012985E-45</text>
  <text x="470" y="220" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal">spacing 2^-149 everywhere between -tiny and +tiny</text>
  <rect x="650" y="214" width="230" height="28" rx="14" fill="#efe6f5" stroke="#6a3d8f"/>
  <text x="765" y="232" font-size="12" fill="#6a3d8f" text-anchor="middle" font-weight="normal">NaN: unordered, not on the line</text>
  <text x="60" y="220" font-size="11" fill="#a33333" text-anchor="start" font-weight="normal">beyond huge + half an ulp, rounding gives Infinity</text>
  <text x="40" y="300" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">B.  Zoom on [0, 4 tiny]: gradual underflow keeps the spacing uniform down to zero</text>
