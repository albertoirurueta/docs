<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">On-device storage options compared</text>
  <text x="410" y="44" font-size="11" fill="#666666" text-anchor="middle">Sync vs. async, encrypted vs. not, key-value vs. structured, and the typical use case for each</text>

  <!-- Column headers -->
  <text x="145" y="70" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Option</text>
  <text x="330" y="70" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Access</text>
  <text x="440" y="70" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Encrypted</text>
  <text x="555" y="70" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Shape</text>
  <text x="710" y="70" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Typical use</text>
  <line x1="20" y1="80" x2="800" y2="80" stroke="#cccccc" stroke-width="1"/>

  <!-- Row 1: AsyncStorage -->
  <rect x="20" y="90" width="780" height="56" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="35" y="114" font-size="12" font-weight="bold" fill="#1c4b73">AsyncStorage</text>
  <text x="35" y="130" font-size="9.5" fill="#1c4b73">@react-native-async-storage/async-storage</text>
  <text x="330" y="122" font-size="10.5" fill="#333333" text-anchor="middle">async</text>
  <text x="440" y="122" font-size="10.5" fill="#a33" text-anchor="middle">no</text>
  <text x="555" y="122" font-size="10.5" fill="#333333" text-anchor="middle">key-value (strings only)</text>
  <text x="710" y="122" font-size="10" fill="#333333" text-anchor="middle">small non-sensitive prefs</text>

  <!-- Row 2: MMKV -->
  <rect x="20" y="154" width="780" height="56" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="35" y="178" font-size="12" font-weight="bold" fill="#2d6a34">MMKV</text>
  <text x="35" y="194" font-size="9.5" fill="#2d6a34">react-native-mmkv</text>
  <text x="330" y="186" font-size="10.5" fill="#333333" text-anchor="middle">sync</text>
  <text x="440" y="186" font-size="10.5" fill="#2d6a34" text-anchor="middle">optional</text>
  <text x="555" y="186" font-size="10.5" fill="#333333" text-anchor="middle">key-value</text>
  <text x="710" y="186" font-size="10" fill="#333333" text-anchor="middle">fast prefs read during render</text>

  <!-- Row 3: SQLite -->
  <rect x="20" y="218" width="780" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="35" y="242" font-size="12" font-weight="bold" fill="#8a5a1c">SQLite</text>
  <text x="35" y="258" font-size="9.5" fill="#8a5a1c">expo-sqlite / react-native-quick-sqlite</text>
  <text x="330" y="250" font-size="10.5" fill="#333333" text-anchor="middle">async (mostly)</text>
  <text x="440" y="250" font-size="10.5" fill="#a33" text-anchor="middle">no*</text>
  <text x="555" y="250" font-size="10.5" fill="#333333" text-anchor="middle">relational, queryable</text>
  <text x="710" y="250" font-size="10" fill="#333333" text-anchor="middle">structured data, migrations</text>

  <!-- Row 4: Document/sync DBs -->
  <rect x="20" y="282" width="780" height="56" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="35" y="306" font-size="12" font-weight="bold" fill="#1c4b73">Document / sync DBs</text>
  <text x="35" y="322" font-size="9.5" fill="#1c4b73">WatermelonDB, Realm, Couchbase Lite</text>
  <text x="330" y="314" font-size="10.5" fill="#333333" text-anchor="middle">async / reactive</text>
  <text x="440" y="314" font-size="10.5" fill="#2d6a34" text-anchor="middle">varies</text>
  <text x="555" y="314" font-size="10.5" fill="#333333" text-anchor="middle">objects/documents, reactive</text>
  <text x="710" y="314" font-size="10" fill="#333333" text-anchor="middle">local DB with built-in sync</text>

  <!-- Row 5: Files -->
  <rect x="20" y="346" width="780" height="56" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="35" y="370" font-size="12" font-weight="bold" fill="#2d6a34">Files</text>
  <text x="35" y="386" font-size="9.5" fill="#2d6a34">expo-file-system</text>
  <text x="330" y="378" font-size="10.5" fill="#333333" text-anchor="middle">async</text>
  <text x="440" y="378" font-size="10.5" fill="#a33" text-anchor="middle">no</text>
  <text x="555" y="378" font-size="10.5" fill="#333333" text-anchor="middle">raw blobs</text>
  <text x="710" y="378" font-size="10" fill="#333333" text-anchor="middle">photos, downloaded documents</text>

  <!-- Row 6: Secure storage -->
  <rect x="20" y="410" width="780" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="35" y="434" font-size="12" font-weight="bold" fill="#8a5a1c">Secure storage</text>
  <text x="35" y="450" font-size="9.5" fill="#8a5a1c">Keychain / Keystore-backed</text>
  <text x="330" y="442" font-size="10.5" fill="#333333" text-anchor="middle">async</text>
  <text x="440" y="442" font-size="10.5" fill="#2d6a34" text-anchor="middle">yes</text>
  <text x="555" y="442" font-size="10.5" fill="#333333" text-anchor="middle">key-value, small</text>
  <text x="710" y="442" font-size="10" fill="#333333" text-anchor="middle">tokens, secrets, credentials</text>

  <text x="410" y="490" font-size="9" fill="#555555" text-anchor="middle">* SQLite is unencrypted by default on-disk; an encrypted build/extension is a separate opt-in choice, not the default.</text>
  <text x="410" y="504" font-size="9" fill="#555555" text-anchor="middle">Never store tokens or secrets in AsyncStorage, MMKV, or plain SQLite -- use secure storage instead.</text>
</svg>
