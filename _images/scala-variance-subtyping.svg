<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1c4b73"/></marker></defs>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Subtyping of generic types when Boots is a subtype of Gear</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">An arrow points from a subtype to its supertype; checked with summon[... &lt;:&lt; ...] on Scala 3.10.0</text>
<text x="120" y="95" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Invariant: Box[A]</text>
<text x="120" y="114" font-size="12" fill="#666666" text-anchor="middle">no arrow</text>
<rect x="35" y="140" width="170" height="40" rx="4" fill="#fff4e0" stroke="#a35a00" stroke-width="1.4"/>
<text x="120.0" y="165.0" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">Box[Gear]</text>
<rect x="35" y="260" width="170" height="40" rx="4" fill="#fff4e0" stroke="#a35a00" stroke-width="1.4"/>
<text x="120.0" y="285.0" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">Box[Boots]</text>
<text x="120" y="226" font-size="22" fill="#a35a00" text-anchor="middle">&#215;</text>
<text x="120" y="335" font-size="11.5" fill="#222222" text-anchor="middle">unrelated</text>
<text x="360" y="95" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Covariant: List[+A]</text>
<text x="360" y="114" font-size="12" fill="#666666" text-anchor="middle">same direction</text>
<rect x="275" y="140" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="360.0" y="165.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">List[Gear]</text>
<rect x="275" y="260" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="360.0" y="285.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">List[Boots]</text>
<line x1="360" y1="258" x2="360" y2="182" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="360" y="335" font-size="11.5" fill="#222222" text-anchor="middle">List[Boots] &lt;: List[Gear]</text>
<text x="600" y="95" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Contravariant: Printer[-A]</text>
<text x="600" y="114" font-size="12" fill="#666666" text-anchor="middle">reversed</text>
<rect x="515" y="140" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="600.0" y="165.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Printer[Boots]</text>
<rect x="515" y="260" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="600.0" y="285.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Printer[Gear]</text>
<line x1="600" y1="258" x2="600" y2="182" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="335" font-size="11.5" fill="#222222" text-anchor="middle">Printer[Gear] &lt;: Printer[Boots]</text>
<text x="840" y="95" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Function1[-A, +B]</text>
<text x="840" y="114" font-size="12" fill="#666666" text-anchor="middle">reversed in A, same in B</text>
<rect x="755" y="140" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="840.0" y="165.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Boots =&gt; Gear</text>
<rect x="755" y="260" width="170" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="840.0" y="285.0" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Gear =&gt; Boots</text>
<line x1="840" y1="258" x2="840" y2="182" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="840" y="335" font-size="11.5" fill="#222222" text-anchor="middle">(Gear =&gt; Boots) &lt;: (Boots =&gt; Gear)</text>
</svg>
