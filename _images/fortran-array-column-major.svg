<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A 3 by 4 Fortran array in column-major memory with the section a(1:3:2, 2:4) highlighted</title>
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Column-major order: integer a(3, 4) and the section a(1:3:2, 2:4)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">the first subscript varies fastest in memory; the section picks rows 1 and 3 of columns 2 to 4, so it is not contiguous</text>
  <rect x="270" y="62" width="14" height="14" fill="#e8f0f8" stroke="#1c4b73"/><text x="290" y="74" font-size="12" fill="#222222">element of a</text>
