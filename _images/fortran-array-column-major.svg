  <text x="470.0" y="486" font-size="12.5" fill="#222222" text-anchor="middle">position of a(i, j) = i + 3*(j - 1)   ·   the section visits positions 4, 6, 7, 9, 10, 12: stride 2 inside each column, then a jump to the next</text>
  <text x="470.0" y="506" font-size="12" fill="#666666" text-anchor="middle">looping with i innermost reads memory in order; looping with j innermost jumps by a whole column on every step</text>
