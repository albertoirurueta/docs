<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgl-versions-and-browser-support-context-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From a getContext call to the GPU</text>
<rect x="80" y="52" width="600" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="72.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Your JavaScript</text>
<text x="380.0" y="87.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">canvas.getContext('webgl2'), gl.drawArrays(...)</text>
<line x1="380" y1="100" x2="380" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl-versions-and-browser-support-context-stack)"/>
<rect x="80" y="114" width="600" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="134.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Browser WebGL implementation</text>
<text x="380.0" y="149.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">validates arguments, tracks state, checks WebGL rules, may lose the context</text>
<line x1="380" y1="162" x2="380" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl-versions-and-browser-support-context-stack)"/>
<rect x="80" y="176" width="600" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="196.7" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">ANGLE or a native driver path</text>
<text x="380.0" y="211.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">translates OpenGL ES calls to the platform API</text>
<line x1="380" y1="224" x2="380" y2="238" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl-versions-and-browser-support-context-stack)"/>
<rect x="80" y="238" width="600" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="258.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Platform graphics API</text>
<text x="380.0" y="273.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Direct3D 11 / 12, Metal, Vulkan, desktop OpenGL</text>
<line x1="380" y1="286" x2="380" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl-versions-and-browser-support-context-stack)"/>
<rect x="80" y="300" width="600" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="320.7" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">GPU driver and hardware</text>
<text x="380.0" y="335.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">runs the shaders</text>
<text x="380" y="366" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">ANGLE is an open-source translation layer; which browsers use it on which platform differs.</text>
</svg>
