<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a select statement runs</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">channel operands and send values are evaluated once, in source order; then one ready case is chosen at random</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="300" y="64" width="340" height="52" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="470" y="86" font-weight="bold">1. Evaluate every case once</text>
    <text x="470" y="104" font-size="12">channel expressions and values to send, top to bottom</text>
    <rect x="300" y="146" width="340" height="52" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="470" y="168" font-weight="bold">2. Which cases can proceed now?</text>
    <text x="470" y="186" font-size="12">nil channels are never ready; a closed channel always is</text>
  </g>
  <line x1="470" y1="116" x2="470" y2="142" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="400" y1="198" x2="170" y2="250" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="198" x2="470" y2="250" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="198" x2="770" y2="250" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="250" y="216" font-size="12" fill="#444444">one or more ready</text>
  <text x="478" y="226" font-size="12" fill="#444444">none, default present</text>
  <text x="668" y="216" font-size="12" fill="#444444">none, no default</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="40" y="252" width="260" height="80" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="170" y="276" font-weight="bold">3a. Pick one at random</text>
    <text x="170" y="296" font-size="12">uniform pseudo-random choice,</text>
    <text x="170" y="312" font-size="12">no priority, no fairness promise</text>
    <rect x="340" y="252" width="260" height="80" rx="6" fill="#fff6e0" stroke="#b07d00"/>
    <text x="470" y="276" font-weight="bold">3b. Run the default clause</text>
    <text x="470" y="296" font-size="12">the select never blocks,</text>
    <text x="470" y="312" font-size="12">which makes try-send and try-receive</text>
    <rect x="640" y="252" width="260" height="80" rx="6" fill="#fdecea" stroke="#a33"/>
    <text x="770" y="276" font-weight="bold">3c. Park the goroutine</text>
    <text x="770" y="296" font-size="12">wait on all channels at once; the first</text>
    <text x="770" y="312" font-size="12">to become ready wakes it (empty select: forever)</text>
  </g>
  <line x1="170" y1="332" x2="170" y2="368" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="332" x2="470" y2="368" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="770" y1="332" x2="770" y2="368" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="40" y="370" width="860" height="50" rx="6" fill="#f4f4f4" stroke="#999999"/>
    <text x="470" y="392" font-weight="bold">4. Run that case's communication and its statement list, then leave the select</text>
    <text x="470" y="410" font-size="12">only one case ever runs; break inside a select leaves the select, not the enclosing for loop</text>
  </g>
</svg>
