<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf Desktop in Windows Forms: containers and bindings</text>
  <text x="400" y="45" font-size="13" fill="#666666" text-anchor="middle">TableLayoutPanel (3 rows) + FlowLayoutPanel toolbar + SplitContainer + StatusStrip</text>

  <!-- form frame -->
  <rect x="20" y="58" width="760" height="432" rx="6" fill="#f0f0f0" stroke="#1c4b73" stroke-width="2"/>
  <rect x="20" y="58" width="760" height="28" rx="6" fill="#1c4b73"/>
  <rect x="20" y="74" width="760" height="12" fill="#1c4b73"/>
  <text x="36" y="77" font-size="13" font-weight="bold" fill="#ffffff">Bookshelf Desktop</text>

  <!-- row 0: FlowLayoutPanel toolbar -->
  <rect x="30" y="94" width="740" height="44" rx="4" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="40" y="112" font-size="11" font-weight="bold" fill="#1c4b73">Row 0 (AutoSize): FlowLayoutPanel</text>
  <text x="40" y="130" font-size="12" fill="#222222">Search</text>
  <rect x="92" y="114" width="230" height="20" fill="#ffffff" stroke="#666666"/>
  <text x="100" y="129" font-size="11" fill="#666666">TextBox _search</text>
  <rect x="560" y="114" width="64" height="20" rx="3" fill="#ffffff" stroke="#666666"/>
  <text x="592" y="128" font-size="11" fill="#222222" text-anchor="middle">Add</text>
  <rect x="632" y="114" width="64" height="20" rx="3" fill="#ffffff" stroke="#666666"/>
  <text x="664" y="128" font-size="11" fill="#222222" text-anchor="middle">Edit</text>
  <rect x="704" y="114" width="58" height="20" rx="3" fill="#ffffff" stroke="#666666"/>
  <text x="733" y="128" font-size="11" fill="#222222" text-anchor="middle">Delete</text>

  <!-- row 1: SplitContainer -->
  <rect x="30" y="146" width="740" height="272" rx="4" fill="#eef7ee" stroke="#2a6a2a"/>
  <text x="40" y="163" font-size="11" font-weight="bold" fill="#2a6a2a">Row 1 (100 percent): SplitContainer, Dock = Fill</text>
  <rect x="40" y="172" width="440" height="236" fill="#ffffff" stroke="#2a6a2a"/>
  <text x="50" y="190" font-size="12" font-weight="bold" fill="#222222">Panel1: DataGridView, Dock = Fill</text>
  <line x1="40" y1="198" x2="480" y2="198" stroke="#999999"/>
  <text x="50" y="214" font-size="11" fill="#444444">Title</text>
  <text x="250" y="214" font-size="11" fill="#444444">Author</text>
  <text x="380" y="214" font-size="11" fill="#444444">Year</text>
  <line x1="40" y1="222" x2="480" y2="222" stroke="#999999"/>
  <rect x="40" y="224" width="440" height="18" fill="#cfe3f8"/>
  <text x="50" y="237" font-size="11" fill="#222222">Dune</text>
  <text x="250" y="237" font-size="11" fill="#222222">Frank Herbert</text>
  <text x="380" y="237" font-size="11" fill="#222222">1965</text>
  <text x="50" y="259" font-size="11" fill="#222222">Neuromancer</text>
  <text x="250" y="259" font-size="11" fill="#222222">William Gibson</text>
  <text x="380" y="259" font-size="11" fill="#222222">1984</text>
  <text x="50" y="281" font-size="11" fill="#222222">Solaris</text>
  <text x="250" y="281" font-size="11" fill="#222222">Stanislaw Lem</text>
  <text x="380" y="281" font-size="11" fill="#222222">1961</text>
  <text x="50" y="395" font-size="11" fill="#2a6a2a">DataSource = BindingSource</text>

  <rect x="490" y="172" width="270" height="236" fill="#ffffff" stroke="#2a6a2a"/>
  <text x="500" y="190" font-size="12" font-weight="bold" fill="#222222">Panel2: details TableLayoutPanel</text>
  <text x="500" y="218" font-size="11" fill="#444444">Title</text>
  <rect x="560" y="205" width="190" height="18" fill="#f4f4f4" stroke="#999999"/>
  <text x="500" y="244" font-size="11" fill="#444444">Author</text>
  <rect x="560" y="231" width="190" height="18" fill="#f4f4f4" stroke="#999999"/>
  <text x="500" y="270" font-size="11" fill="#444444">Year</text>
  <rect x="560" y="257" width="190" height="18" fill="#f4f4f4" stroke="#999999"/>
  <text x="500" y="296" font-size="11" fill="#444444">Price</text>
  <rect x="560" y="283" width="190" height="18" fill="#f4f4f4" stroke="#999999"/>
  <rect x="560" y="311" width="14" height="14" fill="#ffffff" stroke="#666666"/>
  <text x="582" y="322" font-size="11" fill="#444444">Favorite (two-way)</text>
  <text x="500" y="395" font-size="11" fill="#2a6a2a">DataBindings to the same BindingSource</text>

  <!-- row 2: StatusStrip -->
  <rect x="30" y="426" width="740" height="26" rx="4" fill="#fdf1dc" stroke="#9a6a10"/>
  <text x="40" y="443" font-size="11" font-weight="bold" fill="#9a6a10">Row 2 (AutoSize): StatusStrip</text>
  <text x="760" y="443" font-size="11" fill="#222222" text-anchor="end">3 books</text>

  <text x="400" y="474" font-size="12" fill="#444444" text-anchor="middle">Buttons: Command = BooksViewModel commands. Status text: DataBindings to StatusMessage.</text>
  <text x="400" y="486" font-size="11" fill="#666666" text-anchor="middle">Original drawing for this guide; not a screenshot.</text>
</svg>
