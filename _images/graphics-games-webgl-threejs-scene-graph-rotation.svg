<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-sg-rotation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Rotation: one orientation, several ways to change it</text>
<rect x="20" y="56" width="220" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="78" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">object.rotation</text>
<text x="130" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Euler (x, y, z) in radians</text>
<text x="130" y="114" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">default order 'XYZ'</text>
<text x="130" y="134" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">gimbal lock is possible</text>
<text x="130" y="150" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">convenient for single axes</text>
<rect x="20" y="196" width="220" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">object.quaternion</text>
<text x="130" y="238" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">unit quaternion (x, y, z, w)</text>
<text x="130" y="254" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">no gimbal lock</text>
<text x="130" y="270" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">slerp, premultiply, lookAt</text>
<text x="130" y="286" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">use for blending and chains</text>
<line x1="130" y1="166" x2="130" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-sg-rotation)"/>
<line x1="150" y1="196" x2="150" y2="166" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-sg-rotation)"/>
<text x="190" y="186" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">synced</text>
<text x="520" y="56" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Ways to turn an object</text>
<rect x="290" y="70" width="440" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="305" y="95" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">rotation.y += 0.01</text>
<text x="715" y="95" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">absolute Euler change</text>
<rect x="290" y="120" width="440" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="305" y="145" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">rotateY(0.01)</text>
<text x="715" y="145" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">around its own local Y axis</text>
<rect x="290" y="170" width="440" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="305" y="195" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">rotateOnWorldAxis(axis, a)</text>
<text x="715" y="195" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">around a world axis</text>
<rect x="290" y="220" width="440" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="305" y="245" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">quaternion.slerp(target, t)</text>
<text x="715" y="245" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">blend toward an orientation</text>
<rect x="290" y="270" width="440" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="305" y="295" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">lookAt(x, y, z)</text>
<text x="715" y="295" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">face a world point</text>
<text x="520" y="322" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Setting rotation or quaternion updates the other one; matrix is rebuilt on the next update.</text>
</svg>
