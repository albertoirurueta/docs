<text x="380" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">With interval 1 the loop runs once per refresh. With interval 0 frames are not synchronised and tearing can occur.</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The swap interval is a request: a driver setting may override it.</text>
