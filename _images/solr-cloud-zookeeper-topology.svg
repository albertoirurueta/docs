<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">SolrCloud: one ZooKeeper ensemble, one Overseer, two sharded collections</text>
  <text x="380" y="42" font-size="11.5" fill="#666666" text-anchor="middle">collection: books &#8226; shards: 2 &#8226; replicas: mixed NRT / TLOG / PULL across 3 Solr nodes</text>

  <defs>
    <marker id="zk-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6d1d"/>
    </marker>
  </defs>

  <!-- ZooKeeper ensemble -->
  <rect x="28" y="56" width="704" height="84" rx="8" fill="#f0ece0" stroke="#8a6d1d" stroke-width="1.6"/>
  <text x="380" y="76" font-size="12.5" font-weight="bold" fill="#8a6d1d" text-anchor="middle">ZooKeeper ensemble &#8212; cluster state, live_nodes, /configs, Overseer &amp; shard-leader election</text>
  <rect x="65" y="88" width="150" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="140" y="113" font-size="12" fill="#8a6d1d" text-anchor="middle">zk1</text>
  <rect x="305" y="88" width="150" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="380" y="113" font-size="12" fill="#8a6d1d" text-anchor="middle">zk2</text>
  <rect x="545" y="88" width="150" height="40" rx="5" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.4"/>
  <text x="620" y="113" font-size="12" fill="#8a6d1d" text-anchor="middle">zk3</text>

  <line x1="140" y1="128" x2="140" y2="168" stroke="#8a6d1d" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#zk-arrow)"/>
  <line x1="380" y1="128" x2="380" y2="168" stroke="#8a6d1d" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#zk-arrow)"/>
  <line x1="620" y1="128" x2="620" y2="168" stroke="#8a6d1d" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#zk-arrow)"/>

  <!-- Solr Node 1 -->
  <rect x="28" y="170" width="224" height="240" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="140" y="192" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 1</text>
  <rect x="46" y="200" width="188" height="20" rx="4" fill="#f0ece0" stroke="#8a6d1d" stroke-width="1.2"/>
  <text x="140" y="214" font-size="9.5" font-weight="bold" fill="#8a6d1d" text-anchor="middle">OVERSEER (elected via ZooKeeper)</text>

  <rect x="46" y="230" width="188" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="140" y="250" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard 1 &#183; leader &#8226; NRT</text>
  <text x="140" y="266" font-size="9.5" fill="#444444" text-anchor="middle">takes writes; any NRT/TLOG replica</text>
  <text x="140" y="279" font-size="9.5" fill="#444444" text-anchor="middle">of shard 1 can win the next election</text>

  <rect x="46" y="300" width="188" height="60" rx="6" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="140" y="320" font-size="12" fill="#555555" text-anchor="middle">Shard 2 &#183; replica &#8226; PULL</text>
  <text x="140" y="336" font-size="9.5" fill="#777777" text-anchor="middle">pulls the index from the leader only;</text>
  <text x="140" y="349" font-size="9.5" fill="#777777" text-anchor="middle">never a leader candidate</text>

  <!-- Solr Node 2 -->
  <rect x="268" y="170" width="224" height="240" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="192" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 2</text>
  <rect x="286" y="200" width="188" height="20" rx="4" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="380" y="214" font-size="9.5" fill="#666666" text-anchor="middle">data node</text>

  <rect x="286" y="230" width="188" height="60" rx="6" fill="#ffffff" stroke="#a15c00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="380" y="250" font-size="12" fill="#a15c00" text-anchor="middle">Shard 1 &#183; replica &#8226; TLOG</text>
  <text x="380" y="266" font-size="9.5" fill="#777777" text-anchor="middle">logs locally, replicates the index</text>
  <text x="380" y="279" font-size="9.5" fill="#777777" text-anchor="middle">from the leader; election-eligible</text>

  <rect x="286" y="300" width="188" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="320" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shard 2 &#183; leader &#8226; NRT</text>
  <text x="380" y="336" font-size="9.5" fill="#444444" text-anchor="middle">takes writes; forwards updates to</text>
  <text x="380" y="349" font-size="9.5" fill="#444444" text-anchor="middle">every replica of shard 2</text>

  <!-- Solr Node 3 -->
  <rect x="508" y="170" width="224" height="240" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="620" y="192" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Solr Node 3</text>
  <rect x="526" y="200" width="188" height="20" rx="4" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="620" y="214" font-size="9.5" fill="#666666" text-anchor="middle">data node</text>

  <rect x="526" y="230" width="188" height="60" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="620" y="250" font-size="12" fill="#1c4b73" text-anchor="middle">Shard 1 &#183; replica &#8226; NRT</text>
  <text x="620" y="266" font-size="9.5" fill="#777777" text-anchor="middle">indexes locally in real time;</text>
  <text x="620" y="279" font-size="9.5" fill="#777777" text-anchor="middle">election-eligible</text>

  <rect x="526" y="300" width="188" height="60" rx="6" fill="#ffffff" stroke="#a15c00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="620" y="320" font-size="12" fill="#a15c00" text-anchor="middle">Shard 2 &#183; replica &#8226; TLOG</text>
  <text x="620" y="336" font-size="9.5" fill="#777777" text-anchor="middle">logs locally, replicates the index</text>
  <text x="620" y="349" font-size="9.5" fill="#777777" text-anchor="middle">from the leader; election-eligible</text>

  <!-- Legend -->
  <rect x="28" y="418" width="16" height="12" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="52" y="428" font-size="10.5" fill="#222222">leader (NRT) &#8212; accepts writes for its shard</text>

  <rect x="288" y="418" width="16" height="12" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="312" y="428" font-size="10.5" fill="#222222">NRT replica &#8212; full local index, election-eligible</text>

  <rect x="28" y="438" width="16" height="12" fill="#ffffff" stroke="#a15c00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="52" y="448" font-size="10.5" fill="#222222">TLOG replica &#8212; tlog + replicated index, election-eligible</text>

  <rect x="288" y="438" width="16" height="12" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="312" y="448" font-size="10.5" fill="#222222">PULL replica &#8212; read scaling only, never a leader</text>

  <text x="546" y="428" font-size="10.5" fill="#444444">Gold arrows: state sync &amp;</text>
  <text x="546" y="440" font-size="10.5" fill="#444444">leader-election watches</text>
  <text x="546" y="452" font-size="10.5" fill="#444444">(every node talks to all of ZK).</text>
</svg>
