<svg viewBox="0 0 830 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>What the C# compiler synthesises for a positional record: from one declaration line it generates an init-only property per positional parameter, a primary constructor, a protected copy constructor and Clone method used by with expressions, Equals and GetHashCode over every field, the == and != operators, a Deconstruct method, a virtual EqualityContract property and a PrintMembers method called by ToString.</title>
  <rect x="0" y="0" width="830" height="470" fill="#ffffff"/>

  <text x="415" y="27" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What the compiler writes for you</text>

  <!-- source -->
  <rect x="140" y="50" width="550" height="44" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.8"/>
  <text x="415" y="78" font-size="14" fill="#1f3b5c" text-anchor="middle" font-family="Consolas, monospace">public record Person(string FirstName, string LastName);</text>
  <text x="415" y="110" font-size="10.5" fill="#666666" text-anchor="middle" font-style="italic">one line of source …</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <line x1="415" y1="116" x2="415" y2="136" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#a3)"/>

  <!-- generated band -->
  <rect x="26" y="142" width="778" height="298" rx="8" fill="#f8fbf9" stroke="#8bbd9d" stroke-width="1.3"/>
  <text x="415" y="163" font-size="12" font-weight="bold" fill="#2d5c42" text-anchor="middle">… becomes these members</text>

  <!-- column 1 -->
  <rect x="44" y="176" width="244" height="118" rx="5" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.4"/>
  <text x="58" y="196" font-size="11.5" font-weight="bold" fill="#1d5236">State</text>
  <text x="58" y="216" font-size="10.5" fill="#2d6647" font-family="Consolas, monospace">public string FirstName { get; init; }</text>
  <text x="58" y="233" font-size="10.5" fill="#2d6647" font-family="Consolas, monospace">public string LastName  { get; init; }</text>
  <text x="58" y="256" font-size="10.5" fill="#2d6647" font-family="Consolas, monospace">public Person(string f, string l)</text>
  <text x="58" y="273" font-size="10" fill="#5a8a70">— the primary constructor</text>
  <text x="58" y="288" font-size="10" fill="#5a8a70">— one property per parameter</text>

  <!-- column 2 -->
  <rect x="300" y="176" width="244" height="118" rx="5" fill="#f3eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="314" y="196" font-size="11.5" font-weight="bold" fill="#3c2a5c">Equality</text>
  <text x="314" y="216" font-size="10.5" fill="#4a3a6c" font-family="Consolas, monospace">bool Equals(Person? other)</text>
  <text x="314" y="233" font-size="10.5" fill="#4a3a6c" font-family="Consolas, monospace">override bool Equals(object?)</text>
  <text x="314" y="250" font-size="10.5" fill="#4a3a6c" font-family="Consolas, monospace">override int GetHashCode()</text>
  <text x="314" y="267" font-size="10.5" fill="#4a3a6c" font-family="Consolas, monospace">operator == / operator !=</text>
  <text x="314" y="286" font-size="10" fill="#7a68a0">— compares every field, not identity</text>

  <!-- column 3 -->
  <rect x="556" y="176" width="230" height="118" rx="5" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
  <text x="570" y="196" font-size="11.5" font-weight="bold" fill="#7a4d13">Copying</text>
  <text x="570" y="216" font-size="10.5" fill="#6d563a" font-family="Consolas, monospace">protected Person(Person other)</text>
  <text x="570" y="233" font-size="10.5" fill="#6d563a" font-family="Consolas, monospace">virtual Person &lt;Clone&gt;$()</text>
  <text x="570" y="256" font-size="10" fill="#8a6a3e">— the copy constructor and</text>
  <text x="570" y="270" font-size="10" fill="#8a6a3e">  clone that `with` calls</text>
  <text x="570" y="288" font-size="10" fill="#8a6a3e">— a shallow copy</text>

  <!-- bottom row -->
  <rect x="44" y="308" width="360" height="114" rx="5" fill="#fdf3f3" stroke="#b5523d" stroke-width="1.4"/>
  <text x="58" y="328" font-size="11.5" font-weight="bold" fill="#7a2f20">Display</text>
  <text x="58" y="348" font-size="10.5" fill="#7a3d2d" font-family="Consolas, monospace">override string ToString()</text>
  <text x="58" y="365" font-size="10.5" fill="#7a3d2d" font-family="Consolas, monospace">protected virtual bool PrintMembers(</text>
  <text x="58" y="380" font-size="10.5" fill="#7a3d2d" font-family="Consolas, monospace">    StringBuilder builder)</text>
  <text x="58" y="401" font-size="10" fill="#a06a5a">Person { FirstName = Ada, LastName = Lovelace }</text>
  <text x="58" y="415" font-size="10" fill="#a06a5a">— override PrintMembers to change the middle</text>

  <rect x="420" y="308" width="366" height="114" rx="5" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="434" y="328" font-size="11.5" font-weight="bold" fill="#1f3b5c">Destructuring and type identity</text>
  <text x="434" y="348" font-size="10.5" fill="#31506e" font-family="Consolas, monospace">void Deconstruct(out string FirstName,</text>
  <text x="434" y="363" font-size="10.5" fill="#31506e" font-family="Consolas, monospace">                 out string LastName)</text>
  <text x="434" y="384" font-size="10.5" fill="#31506e" font-family="Consolas, monospace">protected virtual Type EqualityContract</text>
  <text x="434" y="403" font-size="10" fill="#5b7593">— enables `var (a, b) = person` and</text>
  <text x="434" y="417" font-size="10" fill="#5b7593">  positional patterns; a derived record</text>

  <text x="415" y="437" font-size="10" fill="#666666" text-anchor="middle" font-style="italic">Write any of these yourself and the compiler steps aside — it only supplies what is missing.</text>
</svg>
