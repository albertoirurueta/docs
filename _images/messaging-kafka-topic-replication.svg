<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="500" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Topic "orders": 4 partitions replicated across 3 brokers</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">Each partition has one leader replica (highlighted) and two follower replicas; leadership rotates round-robin across brokers</text>

  <!-- header row -->
  <rect x="20" y="58" width="100" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="120" y="58" width="183" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="303" y="58" width="183" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <rect x="486" y="58" width="184" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="30" y="79" font-size="12" font-weight="bold" fill="#222222">Partition</text>
  <text x="211" y="79" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Broker 1</text>
  <text x="394" y="79" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Broker 2</text>
  <text x="578" y="79" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Broker 3</text>

  <!-- Row P0 (90-178): leader on Broker 1 -->
  <rect x="20" y="90" width="100" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="120" y="90" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="303" y="90" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="486" y="90" width="184" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="138" font-size="13" font-weight="bold" fill="#222222">P0</text>

  <rect x="141" y="107" width="141" height="54" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="211" y="130" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Leader replica</text>
  <text x="211" y="144" font-size="9" fill="#3a7d40" text-anchor="middle">serves all reads/writes</text>

  <rect x="324" y="107" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="394" y="130" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="394" y="144" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <rect x="507" y="107" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="578" y="130" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="578" y="144" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <!-- Row P1 (178-266): leader on Broker 2 -->
  <rect x="20" y="178" width="100" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="120" y="178" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="303" y="178" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="486" y="178" width="184" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="226" font-size="13" font-weight="bold" fill="#222222">P1</text>

  <rect x="141" y="195" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="211" y="218" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="211" y="232" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <rect x="324" y="195" width="141" height="54" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="394" y="218" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Leader replica</text>
  <text x="394" y="232" font-size="9" fill="#3a7d40" text-anchor="middle">serves all reads/writes</text>

  <rect x="507" y="195" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="578" y="218" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="578" y="232" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <!-- Row P2 (266-354): leader on Broker 3 -->
  <rect x="20" y="266" width="100" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="120" y="266" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="303" y="266" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="486" y="266" width="184" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="314" font-size="13" font-weight="bold" fill="#222222">P2</text>

  <rect x="141" y="283" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="211" y="306" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="211" y="320" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <rect x="324" y="283" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="394" y="306" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="394" y="320" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <rect x="507" y="283" width="141" height="54" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="578" y="306" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Leader replica</text>
  <text x="578" y="320" font-size="9" fill="#3a7d40" text-anchor="middle">serves all reads/writes</text>

  <!-- Row P3 (354-442): leader on Broker 1 again -->
  <rect x="20" y="354" width="100" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="120" y="354" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="303" y="354" width="183" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="486" y="354" width="184" height="88" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="402" font-size="13" font-weight="bold" fill="#222222">P3</text>

  <rect x="141" y="371" width="141" height="54" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="211" y="394" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Leader replica</text>
  <text x="211" y="408" font-size="9" fill="#3a7d40" text-anchor="middle">serves all reads/writes</text>

  <rect x="324" y="371" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="394" y="394" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="394" y="408" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <rect x="507" y="371" width="141" height="54" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="578" y="394" font-size="11" fill="#444444" text-anchor="middle">Follower replica</text>
  <text x="578" y="408" font-size="9" fill="#777777" text-anchor="middle">in-sync (ISR member)</text>

  <!-- outer border -->
  <rect x="20" y="58" width="650" height="384" fill="none" stroke="#666666" stroke-width="1.4"/>

  <!-- legend -->
  <rect x="20" y="458" width="16" height="14" rx="2" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="42" y="469" font-size="10" fill="#333333">Leader replica -- the only replica any producer or consumer reads from or writes to</text>

  <rect x="20" y="478" width="16" height="14" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="42" y="489" font-size="10" fill="#333333">Follower replica -- passively replicates the leader's log; eligible to become leader if it stays in-sync</text>
</svg>
