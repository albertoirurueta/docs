<svg viewBox="0 0 900 420" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">The 4.x detection pipeline: DefaultDetector.detect()</text>
<text x="450" y="46" text-anchor="middle" font-size="12" fill="#444444">Blue: what you supply, green: detectors, amber: the answer, red: short-circuit and fallback</text>
<rect x="15" y="80" width="115" height="110" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="72.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Input</text>
<text x="72.5" y="122" text-anchor="middle" font-size="11.5" fill="#333333">TikaInputStream</text>
<text x="72.5" y="137" text-anchor="middle" font-size="11.5" fill="#333333">(may be null)</text>
<text x="72.5" y="152" text-anchor="middle" font-size="11.5" fill="#333333">Metadata hints:</text>
<text x="72.5" y="167" text-anchor="middle" font-size="11.5" fill="#333333">resource name,</text>
<text x="72.5" y="182" text-anchor="middle" font-size="11.5" fill="#333333">Content-Type</text>
<rect x="155" y="80" width="130" height="110" rx="8" fill="#f5d6d6" stroke="#9a2b2b" stroke-width="1.6"/>
<text x="220.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">0. Override</text>
<text x="220.0" y="122" text-anchor="middle" font-size="11.5" fill="#333333">tk:content-type-</text>
<text x="220.0" y="137" text-anchor="middle" font-size="11.5" fill="#333333">override (user) or</text>
<text x="220.0" y="152" text-anchor="middle" font-size="11.5" fill="#333333">parser-override</text>
<text x="220.0" y="167" text-anchor="middle" font-size="11.5" fill="#333333">set: return it</text>
<text x="220.0" y="182" text-anchor="middle" font-size="11.5" fill="#333333">and stop here</text>
<rect x="310" y="60" width="250" height="150" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="435.0" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">1. MimeTypes</text>
<text x="435.0" y="102" text-anchor="middle" font-size="11.5" fill="#333333">magic: first 64 KiB against</text>
<text x="435.0" y="117" text-anchor="middle" font-size="11.5" fill="#333333">tika-mimetypes.xml, priorities;</text>
<text x="435.0" y="132" text-anchor="middle" font-size="11.5" fill="#333333">root-XML for generic XML;</text>
<text x="435.0" y="147" text-anchor="middle" font-size="11.5" fill="#333333">then the name hint (glob) and</text>
<text x="435.0" y="162" text-anchor="middle" font-size="11.5" fill="#333333">the Content-Type hint, which</text>
<text x="435.0" y="177" text-anchor="middle" font-size="11.5" fill="#333333">only refine the magic result</text>
<rect x="585" y="80" width="300" height="110" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="735.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">2. Container detectors</text>
<text x="735.0" y="122" text-anchor="middle" font-size="11.5" fill="#333333">SPI detectors that open the file:</text>
<text x="735.0" y="137" text-anchor="middle" font-size="11.5" fill="#333333">ZIP (OOXML, ODF, EPUB), OLE2,</text>
<text x="735.0" y="152" text-anchor="middle" font-size="11.5" fill="#333333">gzip, Ogg, Matroska, BPList,</text>
<text x="735.0" y="167" text-anchor="middle" font-size="11.5" fill="#333333">TIFF, and your own</text>
<rect x="155" y="260" width="150" height="100" rx="8" fill="#f5d6d6" stroke="#9a2b2b" stroke-width="1.6"/>
<text x="230.0" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">3. Text fallback</text>
<text x="230.0" y="302" text-anchor="middle" font-size="11.5" fill="#333333">TextDetector, only</text>
<text x="230.0" y="317" text-anchor="middle" font-size="11.5" fill="#333333">if steps 1 and 2</text>
<text x="230.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">both said application/</text>
<text x="230.0" y="347" text-anchor="middle" font-size="11.5" fill="#333333">octet-stream</text>
<rect x="330" y="260" width="250" height="100" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="455.0" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">4. Most specific wins</text>
<text x="455.0" y="302" text-anchor="middle" font-size="11.5" fill="#333333">registry.isSpecializationOf:</text>
<text x="455.0" y="317" text-anchor="middle" font-size="11.5" fill="#333333">a child (docx under zip)</text>
<text x="455.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">beats its parent; unrelated</text>
<text x="455.0" y="347" text-anchor="middle" font-size="11.5" fill="#333333">types prefer the container</text>
<rect x="605" y="260" width="280" height="100" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="745.0" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Result: a MediaType</text>
<text x="745.0" y="302" text-anchor="middle" font-size="11.5" fill="#333333">application/pdf, for example,</text>
<text x="745.0" y="317" text-anchor="middle" font-size="11.5" fill="#333333">or application/octet-stream</text>
<text x="745.0" y="332" text-anchor="middle" font-size="11.5" fill="#333333">when nothing matched</text>
<line x1="130" y1="135" x2="153" y2="135" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="285" y1="135" x2="308" y2="135" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="560" y1="135" x2="583" y2="135" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="435" y1="210" x2="435" y2="258" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="735" y1="190" x2="560" y2="258" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="305" y1="310" x2="328" y2="310" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="580" y1="310" x2="603" y2="310" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<text x="450" y="395" text-anchor="middle" font-size="12" fill="#444444">An override in step 0 skips every other step.</text>
</svg>
