<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The evolution of ASP.NET, 2002-2025</text>

  <!-- baseline -->
  <line x1="40" y1="170" x2="860" y2="170" stroke="#9a9a9a" stroke-width="2"/>

  <!-- Web Forms lineage (top) -->
  <text x="60" y="60" font-size="12" font-weight="bold" fill="#8a3d10">ASP.NET Web Forms</text>
  <circle cx="70" cy="170" r="6" fill="#c25a1d"/>
  <line x1="70" y1="164" x2="70" y2="75" stroke="#c25a1d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="70" y="90" font-size="10.5" fill="#8a3d10" text-anchor="middle">2002–03</text>
  <text x="70" y="104" font-size="10.5" fill="#8a3d10" text-anchor="middle">Web Forms 1.0/1.1</text>

  <circle cx="150" cy="170" r="6" fill="#c25a1d"/>
  <line x1="150" y1="164" x2="150" y2="75" stroke="#c25a1d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="150" y="90" font-size="10.5" fill="#8a3d10" text-anchor="middle">2005–08</text>
  <text x="150" y="104" font-size="10.5" fill="#8a3d10" text-anchor="middle">2.0 masters/themes,</text>
  <text x="150" y="117" font-size="10.5" fill="#8a3d10" text-anchor="middle">membership; AJAX 2007</text>

  <text x="150" y="140" font-size="10.5" fill="#8a3d10" text-anchor="middle">security-fixes-only since 2021</text>

  <!-- MVC lineage (bottom) -->
  <text x="330" y="290" font-size="12" font-weight="bold" fill="#1c4b73">ASP.NET MVC (Razor)</text>
  <circle cx="290" cy="170" r="6" fill="#2f6fa8"/>
  <line x1="290" y1="176" x2="290" y2="230" stroke="#2f6fa8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="290" y="246" font-size="10.5" fill="#1c4b73" text-anchor="middle">2009</text>
  <text x="290" y="260" font-size="10.5" fill="#1c4b73" text-anchor="middle">MVC 1.0</text>

  <circle cx="370" cy="170" r="6" fill="#2f6fa8"/>
  <line x1="370" y1="176" x2="370" y2="230" stroke="#2f6fa8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="370" y="246" font-size="10.5" fill="#1c4b73" text-anchor="middle">2011</text>
  <text x="370" y="260" font-size="10.5" fill="#1c4b73" text-anchor="middle">Razor in MVC 3</text>

  <circle cx="450" cy="170" r="6" fill="#2f6fa8"/>
  <line x1="450" y1="176" x2="450" y2="230" stroke="#2f6fa8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="246" font-size="10.5" fill="#1c4b73" text-anchor="middle">2012–13</text>
  <text x="450" y="260" font-size="10.5" fill="#1c4b73" text-anchor="middle">Web API/Pages 2,</text>
  <text x="450" y="273" font-size="10.5" fill="#1c4b73" text-anchor="middle">MVC 5 + OWIN + Identity</text>

  <text x="450" y="300" font-size="10.5" fill="#1c4b73" text-anchor="middle">functionally frozen, security-fixes-only</text>

  <!-- dead end: MVC 6 / ASP.NET 5 -->
  <circle cx="510" cy="170" r="5" fill="#9a9a9a"/>
  <text x="510" y="150" font-size="10" fill="#666666" text-anchor="middle">2014–15</text>
  <text x="510" y="138" font-size="10" fill="#666666" text-anchor="middle">"MVC 6 / ASP.NET 5"</text>
  <text x="510" y="126" font-size="10" fill="#666666" text-anchor="middle">(abandoned name)</text>

  <!-- ASP.NET Core lineage (top, continuing) -->
  <text x="700" y="60" font-size="12" font-weight="bold" fill="#2f5424">ASP.NET Core (Blazor)</text>
  <circle cx="570" cy="170" r="7" fill="#4a7a3a"/>
  <line x1="570" y1="164" x2="570" y2="75" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="570" y="90" font-size="10.5" fill="#2f5424" text-anchor="middle">2016</text>
  <text x="570" y="104" font-size="10.5" fill="#2f5424" text-anchor="middle">ASP.NET Core 1.0</text>

  <circle cx="650" cy="170" r="6" fill="#4a7a3a"/>
  <line x1="650" y1="164" x2="650" y2="75" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="650" y="90" font-size="10.5" fill="#2f5424" text-anchor="middle">2017–19</text>
  <text x="650" y="104" font-size="10.5" fill="#2f5424" text-anchor="middle">2.x/3.x, Razor Pages,</text>
  <text x="650" y="117" font-size="10.5" fill="#2f5424" text-anchor="middle">Blazor Server</text>

  <circle cx="730" cy="170" r="6" fill="#4a7a3a"/>
  <line x1="730" y1="164" x2="730" y2="75" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="730" y="90" font-size="10.5" fill="#2f5424" text-anchor="middle">2020–21</text>
  <text x="730" y="104" font-size="10.5" fill="#2f5424" text-anchor="middle">Blazor WASM,</text>
  <text x="730" y="117" font-size="10.5" fill="#2f5424" text-anchor="middle">Minimal APIs</text>

  <circle cx="820" cy="170" r="7" fill="#1f7a1f" stroke="#0f4d0f" stroke-width="1.5"/>
  <line x1="820" y1="164" x2="820" y2="75" stroke="#1f7a1f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="820" y="90" font-size="10.5" fill="#0f4d0f" text-anchor="middle" font-weight="bold">2023–25</text>
  <text x="820" y="104" font-size="10.5" fill="#0f4d0f" text-anchor="middle" font-weight="bold">Blazor Web App,</text>
  <text x="820" y="117" font-size="10.5" fill="#0f4d0f" text-anchor="middle" font-weight="bold">.NET 10 (LTS), Aspire</text>

  <text x="820" y="140" font-size="10.5" fill="#0f4d0f" text-anchor="middle" font-weight="bold">today's anchor</text>

  <!-- Classic ASP note (out of scope, ancestor) -->
  <rect x="0" y="305" width="900" height="30" fill="#f3f3f3"/>
  <text x="450" y="325" font-size="10.5" fill="#555555" text-anchor="middle">Ancestor (out of scope in this reference): classic ASP (Active Server Pages), 1996–2002 -- the source of the "ASP" name, superseded entirely by the .NET-based frameworks above.</text>
</svg>
