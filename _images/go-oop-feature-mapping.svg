<svg viewBox="0 0 980 622" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="622" fill="#ffffff"/>
  <text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Object-oriented features and the Go mechanisms that replace them</text>
  <text x="490" y="46" font-size="12" fill="#666666" text-anchor="middle">Go has types, methods and interfaces, but no classes, no inheritance and no constructors</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="170" y="80">Concept from class-based languages</text><text x="520" y="80">Go mechanism</text><text x="800" y="80">How it works</text>
  </g>
  <rect x="20" y="92" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="120" font-size="13" fill="#222222" text-anchor="middle">Encapsulation (private / public)</text>
  <line x1="320" y1="115" x2="372" y2="115" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="92" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="120" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Exported vs unexported identifiers</text>
  <text x="682" y="112" font-size="11.5" fill="#444444">visibility is per package, not per type; the</text>
  <text x="682" y="127" font-size="11.5" fill="#444444">unit of encapsulation is the package</text>
  <rect x="20" y="154" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="182" font-size="13" fill="#222222" text-anchor="middle">Class and constructor</text>
  <line x1="320" y1="177" x2="372" y2="177" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="154" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">struct type + NewX function</text>
  <text x="682" y="174" font-size="11.5" fill="#444444">no constructors: a plain function returns a</text>
  <text x="682" y="189" font-size="11.5" fill="#444444">ready value; aim for a useful zero value</text>
  <rect x="20" y="216" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="244" font-size="13" fill="#222222" text-anchor="middle">Methods</text>
  <line x1="320" y1="239" x2="372" y2="239" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="216" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="244" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Functions with a receiver</text>
  <text x="682" y="236" font-size="11.5" fill="#444444">declared outside the struct, in the same</text>
  <text x="682" y="251" font-size="11.5" fill="#444444">package; value or pointer receiver</text>
  <rect x="20" y="278" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="306" font-size="13" fill="#222222" text-anchor="middle">Polymorphism (subtyping)</text>
  <line x1="320" y1="301" x2="372" y2="301" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="278" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="306" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Interfaces, satisfied implicitly</text>
  <text x="682" y="298" font-size="11.5" fill="#444444">the consumer declares the interface; the</text>
  <text x="682" y="313" font-size="11.5" fill="#444444">implementer never mentions it</text>
  <rect x="20" y="340" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="368" font-size="13" fill="#222222" text-anchor="middle">Inheritance (code reuse)</text>
  <line x1="320" y1="363" x2="372" y2="363" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="340" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="368" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Embedding + composition</text>
  <text x="682" y="360" font-size="11.5" fill="#444444">has-a with forwarding: the receiver stays</text>
  <text x="682" y="375" font-size="11.5" fill="#444444">the embedded value, no virtual dispatch</text>
  <rect x="20" y="402" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="430" font-size="13" fill="#222222" text-anchor="middle">Abstract class / strategy</text>
  <line x1="320" y1="425" x2="372" y2="425" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="402" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="430" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Small interface or function type</text>
  <text x="682" y="422" font-size="11.5" fill="#444444">PolicyFunc and http.HandlerFunc turn a plain</text>
  <text x="682" y="437" font-size="11.5" fill="#444444">function into an implementation</text>
  <rect x="20" y="464" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="492" font-size="13" fill="#222222" text-anchor="middle">Decorator / mixin</text>
  <line x1="320" y1="487" x2="372" y2="487" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="464" width="290" height="46" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="521" y="492" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Embed the interface in a struct</text>
  <text x="682" y="484" font-size="11.5" fill="#444444">override one method, every other method is</text>
  <text x="682" y="499" font-size="11.5" fill="#444444">forwarded to the wrapped value</text>
  <rect x="20" y="526" width="300" height="46" rx="4" fill="#f4f4f4" stroke="#888888"/>
  <text x="170" y="554" font-size="13" fill="#222222" text-anchor="middle">Method overloading</text>
  <line x1="320" y1="549" x2="372" y2="549" stroke="#b23b2e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="376" y="526" width="290" height="46" rx="4" fill="#fbe9e7" stroke="#b23b2e"/>
  <text x="521" y="554" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Not provided</text>
  <text x="682" y="546" font-size="11.5" fill="#444444">use distinct names, variadic parameters,</text>
  <text x="682" y="561" font-size="11.5" fill="#444444">options or generics</text>
</svg>
