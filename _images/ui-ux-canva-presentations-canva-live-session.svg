<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A Canva Live session: presenter, code and audience</text>
  <rect x="20" y="46" width="330" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="20" y="46" width="330" height="26" rx="10" fill="#EEF2FF"/><text x="34" y="64" font-size="12" fill="#374151">Presenter window</text>
  <rect x="34" y="84" width="170" height="104" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="46" y="96" width="90" height="12" rx="3" fill="#4F46E5"/><rect x="46" y="118" width="70" height="7" rx="3" fill="#D1D5DB"/>
  <rect x="216" y="84" width="120" height="104" rx="4" fill="#FFFFFF" stroke="#B45309"/>
  <text x="226" y="102" font-size="11" font-weight="bold" fill="#92400E">Live Q&amp;A</text>
  <rect x="226" y="110" width="100" height="16" rx="3" fill="#FEF3C7"/><rect x="226" y="130" width="100" height="16" rx="3" fill="#FEF3C7"/><rect x="226" y="150" width="100" height="16" rx="3" fill="#FEF3C7"/>
  <text x="226" y="182" font-size="10" fill="#374151">Newest, Oldest, Top voted</text>
  <rect x="34" y="200" width="302" height="84" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="46" y="212" width="120" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="106" y="232" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">8-char code</text>
  <rect x="186" y="212" width="40" height="40" fill="#E5E7EB" stroke="#6B7280"/><text x="206" y="268" font-size="10" fill="#374151" text-anchor="middle">QR code</text>
  <text x="246" y="228" font-size="11" fill="#374151">Settings: turn Q&amp;A</text><text x="246" y="244" font-size="11" fill="#374151">or reactions on or off</text>
  <path d="M350,170 L440,170" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="395" y="160" font-size="11" fill="#374151" text-anchor="middle">code or QR</text>
  <rect x="446" y="46" width="294" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="446" y="46" width="294" height="26" rx="10" fill="#EEF2FF"/><text x="460" y="64" font-size="12" fill="#374151">Audience devices at the live-session website</text>
  <rect x="470" y="86" width="100" height="190" rx="12" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="480" y="100" width="80" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="520" y="115" font-size="10" fill="#374151" text-anchor="middle">Enter code</text>
  <rect x="480" y="132" width="80" height="26" rx="4" fill="#FEF3C7"/><rect x="480" y="164" width="80" height="26" rx="4" fill="#FEF3C7"/>
  <text x="520" y="214" font-size="14" fill="#B45309" text-anchor="middle">+1</text><text x="520" y="232" font-size="10" fill="#374151" text-anchor="middle">upvote</text>
  <rect x="590" y="86" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="600" y="98" width="80" height="8" rx="3" fill="#D1D5DB"/><rect x="600" y="114" width="100" height="16" rx="3" fill="#FEF3C7"/><rect x="600" y="136" width="100" height="16" rx="3" fill="#FEF3C7"/>
  <text x="655" y="196" font-size="11" fill="#374151" text-anchor="middle">Laptop or phone:</text><text x="655" y="212" font-size="11" fill="#374151" text-anchor="middle">ask, upvote, delete</text><text x="655" y="228" font-size="11" fill="#374151" text-anchor="middle">your own messages</text>
  <text x="380" y="322" font-size="12" fill="#374151" text-anchor="middle">Leaving the presentation view does not end the session; End does.</text>
  <text x="380" y="344" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
