<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From sources to a published site with the Maven Site Plugin 3.22.0 (Maven 3.10.0)</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">The site lifecycle has four phases; only site and site-deploy have goals bound to them. Staging and run are separate goals.</text>
<text x="130" y="86" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Inputs</text>
<text x="400" y="86" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">site phase</text>
<text x="650" y="86" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Output</text>
<text x="855" y="86" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">site-deploy phase</text>
<rect x="20" y="96" width="220" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="130.0" y="120.5" font-size="12" fill="#222222" text-anchor="middle">src/site/ content</text>
<text x="130.0" y="135.5" font-size="12" fill="#222222" text-anchor="middle">markdown, apt, xdoc, fml, .vm</text>
<rect x="20" y="166" width="220" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="130.0" y="190.5" font-size="12" fill="#222222" text-anchor="middle">src/site/site.xml</text>
<text x="130.0" y="205.5" font-size="12" fill="#222222" text-anchor="middle">skin, menus, links, banner</text>
<rect x="20" y="236" width="220" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="130.0" y="260.5" font-size="12" fill="#222222" text-anchor="middle">pom.xml reporting</text>
<text x="130.0" y="275.5" font-size="12" fill="#222222" text-anchor="middle">plugins and reportSets</text>
<rect x="20" y="306" width="220" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="130.0" y="330.5" font-size="12" fill="#222222" text-anchor="middle">pom.xml project data</text>
<text x="130.0" y="345.5" font-size="12" fill="#222222" text-anchor="middle">name, url, licenses, scm, team</text>
<line x1="240" y1="124" x2="300" y2="196" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="240" y1="194" x2="300" y2="212" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="240" y1="264" x2="300" y2="236" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="240" y1="334" x2="300" y2="252" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="300" y="176" width="200" height="104" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="400.0" y="209.5" font-size="12" fill="#14502e" text-anchor="middle">site:site</text>
<text x="400.0" y="224.5" font-size="12" fill="#14502e" text-anchor="middle">Doxia renders content,</text>
<text x="400.0" y="239.5" font-size="12" fill="#14502e" text-anchor="middle">report plugins run,</text>
<text x="400.0" y="254.5" font-size="12" fill="#14502e" text-anchor="middle">skin wraps every page</text>
<line x1="500" y1="228" x2="560" y2="228" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="176" width="180" height="104" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="650.0" y="217.0" font-size="12" fill="#222222" text-anchor="middle">target/site</text>
<text x="650.0" y="232.0" font-size="12" fill="#222222" text-anchor="middle">one site per module</text>
<text x="650.0" y="247.0" font-size="12" fill="#222222" text-anchor="middle">HTML, CSS, report files</text>
<rect x="560" y="96" width="180" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="650.0" y="120.5" font-size="12" fill="#14502e" text-anchor="middle">site:stage</text>
<text x="650.0" y="135.5" font-size="12" fill="#14502e" text-anchor="middle">copy to target/staging</text>
<line x1="650" y1="176" x2="650" y2="152" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="304" width="180" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="650.0" y="328.5" font-size="12" fill="#14502e" text-anchor="middle">site:run</text>
<text x="650.0" y="343.5" font-size="12" fill="#14502e" text-anchor="middle">Jetty on localhost:8080</text>
<line x1="440" y1="280" x2="560" y2="332" stroke="#777777" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<rect x="770" y="176" width="170" height="104" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="855.0" y="209.5" font-size="12" fill="#14502e" text-anchor="middle">site:deploy</text>
<text x="855.0" y="224.5" font-size="12" fill="#14502e" text-anchor="middle">Wagon protocol from</text>
<text x="855.0" y="239.5" font-size="12" fill="#14502e" text-anchor="middle">distributionManagement</text>
<text x="855.0" y="254.5" font-size="12" fill="#14502e" text-anchor="middle">site url</text>
<line x1="740" y1="228" x2="770" y2="228" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="770" y="304" width="170" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="855.0" y="328.5" font-size="12" fill="#222222" text-anchor="middle">file://, scp://, dav:</text>
<text x="855.0" y="343.5" font-size="12" fill="#222222" text-anchor="middle">a web server</text>
<line x1="855" y1="280" x2="855" y2="304" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="770" y="96" width="170" height="56" rx="6" fill="#fff4e0" stroke="#c77d00" stroke-width="1.3"/>
<text x="855.0" y="120.5" font-size="12" fill="#222222" text-anchor="middle">scm-publish:publish-scm</text>
<text x="855.0" y="135.5" font-size="12" fill="#222222" text-anchor="middle">git branch such as gh-pages</text>
<line x1="740" y1="124" x2="770" y2="124" stroke="#777777" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
