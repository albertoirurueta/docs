<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Native projection vs. Cypher projection</text>

  <!-- Left column: native projection -->
  <text x="180" y="56" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Native projection</text>

  <rect x="40" y="70" width="280" height="70" fill="#eef4f9" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="180" y="93" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Graph store</text>
  <text x="180" y="111" font-size="10.5" fill="#555555" text-anchor="middle">label + relationship-type indexes</text>
  <text x="180" y="126" font-size="10.5" fill="#555555" text-anchor="middle">read directly, no query engine</text>

  <g stroke="#1c4b73" stroke-width="1.6" fill="#1c4b73">
    <line x1="180" y1="140" x2="180" y2="168"/>
    <polygon points="174,168 186,168 180,177" stroke="none"/>
  </g>

  <rect x="40" y="178" width="280" height="58" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" font-family="'Courier New', monospace"/>
  <text x="55" y="200" font-size="11" fill="#222222" font-family="'Courier New', monospace">gds.graph.project(</text>
  <text x="65" y="216" font-size="11" fill="#222222" font-family="'Courier New', monospace">'g', ['Person','Movie'],</text>
  <text x="65" y="230" font-size="11" fill="#222222" font-family="'Courier New', monospace">{ACTED_IN: {...}})</text>

  <g stroke="#1c4b73" stroke-width="1.6" fill="#1c4b73">
    <line x1="180" y1="236" x2="180" y2="264"/>
    <polygon points="174,264 186,264 180,273" stroke="none"/>
  </g>

  <rect x="40" y="274" width="280" height="64" fill="#eef4f9" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="180" y="297" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">In-memory graph</text>
  <text x="180" y="315" font-size="10.5" fill="#555555" text-anchor="middle">exact label / rel-type subset</text>
  <text x="180" y="330" font-size="10.5" fill="#555555" text-anchor="middle">fastest to build, least flexible</text>

  <text x="180" y="360" font-size="11" fill="#444444" text-anchor="middle">Best when the input is exactly</text>
  <text x="180" y="375" font-size="11" fill="#444444" text-anchor="middle">"these labels and rel types"</text>

  <!-- Divider -->
  <line x1="360" y1="60" x2="360" y2="390" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right column: cypher projection -->
  <text x="540" y="56" font-size="14" font-weight="bold" fill="#7a3b12" text-anchor="middle">Cypher projection</text>

  <rect x="400" y="70" width="280" height="70" fill="#fbf1e8" stroke="#7a3b12" stroke-width="1.2"/>
  <text x="540" y="93" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Graph store</text>
  <text x="540" y="111" font-size="10.5" fill="#555555" text-anchor="middle">read through the Cypher runtime,</text>
  <text x="540" y="126" font-size="10.5" fill="#555555" text-anchor="middle">row by row, one MATCH per side</text>

  <g stroke="#7a3b12" stroke-width="1.6" fill="#7a3b12">
    <line x1="540" y1="140" x2="540" y2="168"/>
    <polygon points="534,168 546,168 540,177" stroke="none"/>
  </g>

  <rect x="400" y="178" width="280" height="58" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="415" y="200" font-size="11" fill="#222222" font-family="'Courier New', monospace">gds.graph.project.cypher(</text>
  <text x="425" y="216" font-size="11" fill="#222222" font-family="'Courier New', monospace">'g', nodeQuery,</text>
  <text x="425" y="230" font-size="11" fill="#222222" font-family="'Courier New', monospace">relationshipQuery)</text>

  <g stroke="#7a3b12" stroke-width="1.6" fill="#7a3b12">
    <line x1="540" y1="236" x2="540" y2="264"/>
    <polygon points="534,264 546,264 540,273" stroke="none"/>
  </g>

  <rect x="400" y="274" width="280" height="64" fill="#fbf1e8" stroke="#7a3b12" stroke-width="1.2"/>
  <text x="540" y="297" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">In-memory graph</text>
  <text x="540" y="315" font-size="10.5" fill="#555555" text-anchor="middle">arbitrary / virtual / filtered shape</text>
  <text x="540" y="330" font-size="10.5" fill="#555555" text-anchor="middle">slower to build, most flexible</text>

  <text x="540" y="360" font-size="11" fill="#444444" text-anchor="middle">Best when the graph to analyze is</text>
  <text x="540" y="375" font-size="11" fill="#444444" text-anchor="middle">derived, filtered, or reshaped</text>

  <text x="360" y="415" font-size="11.5" fill="#444444" text-anchor="middle">Both fill the same graph catalog; algorithms cannot tell which projection produced their input graph.</text>
</svg>
