<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The /wc-auth/v1 handshake that hands an app a key pair</title>
  <desc id="d">A sequence between three parties: the app, the merchant's browser and the store. Step 1: the app sends the merchant's browser to the store at /wc-auth/v1/authorize with app_name, scope, user_id, return_url and callback_url. Step 2: the store validates the five parameters, the scope and the HTTPS callback; if the merchant is not logged in it redirects to the login form and back. Step 3: the store shows a grant screen listing the permissions of the scope and needs the manage_woocommerce capability. Step 4: the merchant approves and the browser requests access_granted with a nonce. Step 5: the store creates the key pair and posts it as JSON to the callback_url of the app. Step 6: the store redirects the browser to the return_url with success=1 and the app's user_id, or success=0 when the merchant refused.</desc>
  <rect x="0" y="0" width="980" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">/wc-auth/v1/authorize: six steps from the app to a key pair</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="60" y="48" width="200" height="40" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="160" y="73" text-anchor="middle" font-weight="bold" font-size="14">Your app (server)</text>
    <rect x="390" y="48" width="200" height="40" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="490" y="73" text-anchor="middle" font-weight="bold" font-size="14">Merchant's browser</text>
    <rect x="720" y="48" width="200" height="40" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="820" y="73" text-anchor="middle" font-weight="bold" font-size="14">Store (WooCommerce)</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="1" stroke-dasharray="5 5" opacity="0.6">
    <path d="M160 90 V 580"/>
    <path d="M490 90 V 580"/>
    <path d="M820 90 V 580"/>
  </g>
  <g fill="none" stroke-width="1.8">
    <path d="M160 130 H 488" stroke="#f4b860" marker-end="url(#a)"/>
    <path d="M490 190 H 818" stroke="#f4b860" marker-end="url(#a)"/>
    <path d="M818 250 H 492" stroke="#9fd3c7" marker-end="url(#b)"/>
    <path d="M490 330 H 818" stroke="#f4b860" marker-end="url(#a)"/>
    <path d="M818 400 H 162" stroke="#9fd3c7" marker-end="url(#b)"/>
    <path d="M818 470 H 492" stroke="#9fd3c7" marker-end="url(#b)"/>
    <path d="M490 530 H 162" stroke="#9fd3c7" marker-end="url(#b)"/>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <text x="174" y="112" font-weight="bold">1 redirect the merchant to the store</text>
    <text x="174" y="148" font-size="11" font-family="Menlo, Consolas, monospace">app_name, scope, user_id,</text>
    <text x="174" y="162" font-size="11" font-family="Menlo, Consolas, monospace">return_url, callback_url</text>

    <text x="504" y="166" font-weight="bold">2 GET /wc-auth/v1/authorize?...</text>
    <text x="504" y="184" font-size="11">all five parameters, scope read | write | read_write, HTTPS callback</text>
    <text x="504" y="212" font-size="11">not logged in: 302 to /wc-auth/v1/login, then back to authorize</text>

    <text x="504" y="238" font-weight="bold">3 grant screen (needs manage_woocommerce)</text>
    <text x="504" y="270" font-size="11">lists the permissions of the scope, shows app_name and the user</text>

    <text x="504" y="316" font-weight="bold">4 Approve: GET access_granted with wc_auth_nonce</text>

    <text x="174" y="382" font-weight="bold">5 POST callback_url (server to server, JSON)</text>
    <text x="174" y="416" font-size="11" font-family="Menlo, Consolas, monospace">key_id, user_id, consumer_key,</text>
    <text x="174" y="430" font-size="11" font-family="Menlo, Consolas, monospace">consumer_secret, key_permissions</text>

    <text x="504" y="452" font-weight="bold">6 302 to return_url?success=1&amp;user_id=...</text>
    <text x="504" y="488" font-size="11">refused: success=0 and no key is created</text>

    <text x="174" y="516" font-weight="bold">the browser lands on your return_url</text>
    <text x="174" y="552" font-size="11">your server already holds the pair</text>
    <text x="174" y="566" font-size="11">from step 5: store it, never in a URL</text>
  </g>
</svg>
