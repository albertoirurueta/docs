<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>One application.yml, three profiles: dev on H2, dev-memory on the RAM store, prod on PostgreSQL</title>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: one application.yml, three profile documents</text>
  <text x="450" y="50" font-size="12" fill="#444444" text-anchor="middle">The Java code (JobDetail and Trigger beans) is identical in every profile; only the store behind Quartz changes</text>

  <!-- source box -->
  <rect x="30" y="150" width="190" height="140" rx="8" fill="#eef3f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="125" y="178" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">application.yml</text>
  <text x="125" y="200" font-size="12" fill="#333333" text-anchor="middle">shared document</text>
  <text x="125" y="218" font-size="11" font-family="Menlo, Consolas, monospace" fill="#333333" text-anchor="middle">scheduler-name</text>
  <text x="125" y="236" font-size="11" font-family="Menlo, Consolas, monospace" fill="#333333" text-anchor="middle">wait-for-jobs...</text>
  <text x="125" y="268" font-size="11" fill="#444444" text-anchor="middle">+ one document per profile,</text>
  <text x="125" y="282" font-size="11" fill="#444444" text-anchor="middle">each with on-profile</text>

  <!-- arrows -->
  <path d="M220 190 C 260 150, 270 110, 310 108" fill="none" stroke="#555555" stroke-width="1.5"/>
  <path d="M220 220 L 310 232" fill="none" stroke="#555555" stroke-width="1.5"/>
  <path d="M220 255 C 260 300, 270 350, 310 360" fill="none" stroke="#555555" stroke-width="1.5"/>
  <polygon points="310,108 300,103 300,113" fill="#555555"/>
  <polygon points="310,232 300,227 300,237" fill="#555555"/>
  <polygon points="310,360 300,355 300,365" fill="#555555"/>
  <text x="262" y="125" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" transform="rotate(-24 262 125)">dev</text>
  <text x="262" y="218" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">dev-memory</text>
  <text x="262" y="340" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" transform="rotate(24 262 340)">prod</text>

  <!-- dev -->
  <rect x="310" y="70" width="270" height="76" rx="8" fill="#e9f5ec" stroke="#2e7d45" stroke-width="1.5"/>
  <text x="325" y="92" font-size="13" font-weight="bold" fill="#1f5c32">dev: embedded H2, in memory</text>
  <text x="325" y="110" font-size="11" fill="#333333">jdbc:h2:mem:bookshelf;DB_CLOSE_DELAY=-1</text>
  <text x="325" y="126" font-size="11" fill="#333333">initialize-schema=embedded creates 11 tables</text>
  <text x="325" y="140" font-size="11" fill="#333333">from tables_h2.sql, default StdJDBCDelegate</text>

  <!-- dev-memory -->
  <rect x="310" y="190" width="270" height="86" rx="8" fill="#fff6e5" stroke="#b36b00" stroke-width="1.5"/>
  <text x="325" y="212" font-size="13" font-weight="bold" fill="#7a4800">dev-memory: RAMJobStore</text>
  <text x="325" y="230" font-size="11" fill="#333333">job-store-type=memory, nothing persisted</text>
  <text x="325" y="246" font-size="11" fill="#333333">misfireThreshold 5000 ms (RAM store default)</text>
  <text x="325" y="262" font-size="11" fill="#333333">no QRTZ_ tables, restart forgets every trigger</text>

  <!-- prod -->
  <rect x="310" y="318" width="270" height="100" rx="8" fill="#eaf0fb" stroke="#2b4f9e" stroke-width="1.5"/>
  <text x="325" y="340" font-size="13" font-weight="bold" fill="#1d3a75">prod: PostgreSQL</text>
  <text x="325" y="358" font-size="11" fill="#333333">url, user and password from the environment</text>
  <text x="325" y="374" font-size="11" fill="#333333">Flyway V1 creates the tables (tables_postgres.sql)</text>
  <text x="325" y="390" font-size="11" fill="#333333">initialize-schema=never, PostgreSQLDelegate,</text>
  <text x="325" y="406" font-size="11" fill="#333333">isClustered=true, instanceId=AUTO</text>

  <!-- outcomes -->
  <rect x="640" y="78" width="230" height="60" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="755" y="100" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Laptop and unit tests</text>
  <text x="755" y="118" font-size="11" fill="#444444" text-anchor="middle">No Docker, starts in seconds,</text>
  <text x="755" y="131" font-size="11" fill="#444444" text-anchor="middle">state lives while the JVM lives</text>

  <rect x="640" y="198" width="230" height="70" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="755" y="220" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Fast feedback on job logic</text>
  <text x="755" y="238" font-size="11" fill="#444444" text-anchor="middle">Triggers fire, but persistence,</text>
  <text x="755" y="251" font-size="11" fill="#444444" text-anchor="middle">misfire recovery and clustering</text>
  <text x="755" y="264" font-size="11" fill="#444444" text-anchor="middle">are not exercised</text>

  <rect x="640" y="328" width="230" height="80" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="755" y="350" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Staging and production</text>
  <text x="755" y="368" font-size="11" fill="#444444" text-anchor="middle">Survives restarts, shared by every</text>
  <text x="755" y="381" font-size="11" fill="#444444" text-anchor="middle">node of the cluster, schema owned</text>
  <text x="755" y="394" font-size="11" fill="#444444" text-anchor="middle">by migrations</text>

  <line x1="580" y1="108" x2="640" y2="108" stroke="#555555" stroke-width="1.5"/>
  <polygon points="640,108 630,103 630,113" fill="#555555"/>
  <line x1="580" y1="233" x2="640" y2="233" stroke="#555555" stroke-width="1.5"/>
  <polygon points="640,233 630,228 630,238" fill="#555555"/>
  <line x1="580" y1="368" x2="640" y2="368" stroke="#555555" stroke-width="1.5"/>
  <polygon points="640,368 630,363 630,373" fill="#555555"/>

  <text x="450" y="452" font-size="11" fill="#444444" text-anchor="middle">Measured on Quartz 2.5.2 and Spring Boot 4.1.1: all three documents started the Bookshelf scheduler and fired the overdue-loan reminders</text>
</svg>
