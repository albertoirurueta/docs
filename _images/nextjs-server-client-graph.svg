<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The server and client module graphs of one Bookshelf page</title>
  <desc id="d">Two module graphs separated by a dashed use client boundary. The server graph on the left holds page.tsx, book-card.tsx, shelf-stats.tsx and the Reviews component, lib/books.ts guarded by server-only, and actions.ts marked use server. The client graph on the right holds shelf-providers.tsx, like-button.tsx and drawer.tsx, each marked use client. Arrows cross the boundary in three ways: an import of a use client file becomes a client reference, the rendered Reviews output crosses as the children of the Drawer, and the subscribe Server Function crosses as a reference. The client graph never imports the server graph.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a11d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One page, two module graphs</text>
  <text x="400" y="45" font-size="12" fill="#555555" text-anchor="middle">code crosses through imports of 'use client' files, data crosses through serialisable props</text>

  <!-- graph backgrounds -->
  <rect x="20" y="62" width="350" height="380" fill="#f4f8fd" stroke="#2b5c9e" stroke-width="1.4" rx="6"/>
  <rect x="430" y="62" width="350" height="380" fill="#fdf6ea" stroke="#9a5b00" stroke-width="1.4" rx="6"/>
  <text x="195" y="82" font-size="14" font-weight="bold" fill="#1d3f6e" text-anchor="middle">Server module graph</text>
  <text x="605" y="82" font-size="14" font-weight="bold" fill="#5c3500" text-anchor="middle">Client module graph</text>

  <!-- boundary -->
  <line x1="400" y1="56" x2="400" y2="452" stroke="#a11d2d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="400" y="470" font-size="12" font-weight="bold" fill="#a11d2d" text-anchor="middle">'use client' boundary</text>

  <!-- server modules -->
  <rect x="40" y="98" width="310" height="52" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="195" y="119" font-size="13" font-weight="bold" fill="#14304f" text-anchor="middle">shelf/page.tsx</text>
  <text x="195" y="137" font-size="11" fill="#333333" text-anchor="middle">async Server Component, owns every JSX element below</text>

  <rect x="40" y="168" width="150" height="46" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="115" y="188" font-size="12" font-weight="bold" fill="#14304f" text-anchor="middle">book-card.tsx</text>
  <text x="115" y="205" font-size="11" fill="#333333" text-anchor="middle">no directive</text>
  <rect x="200" y="168" width="150" height="46" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="275" y="188" font-size="12" font-weight="bold" fill="#14304f" text-anchor="middle">shelf-stats.tsx</text>
  <text x="275" y="205" font-size="11" fill="#333333" text-anchor="middle">async, no directive</text>

  <rect x="40" y="232" width="310" height="46" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="195" y="252" font-size="12" font-weight="bold" fill="#14304f" text-anchor="middle">Reviews (async, in page.tsx)</text>
  <text x="195" y="269" font-size="11" fill="#333333" text-anchor="middle">runs once on the server; code never ships</text>

  <rect x="40" y="298" width="310" height="46" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="195" y="318" font-size="12" font-weight="bold" fill="#14304f" text-anchor="middle">lib/books.ts</text>
  <text x="195" y="335" font-size="11" fill="#333333" text-anchor="middle">import 'server-only': a client import fails the build</text>

  <rect x="40" y="364" width="310" height="46" fill="#e4eefb" stroke="#2b5c9e" stroke-width="1.6" rx="4"/>
  <text x="195" y="384" font-size="12" font-weight="bold" fill="#14304f" text-anchor="middle">shelf/actions.ts</text>
  <text x="195" y="401" font-size="11" fill="#333333" text-anchor="middle">'use server': subscribe() runs here, checks auth()</text>

  <!-- client modules -->
  <rect x="450" y="98" width="310" height="52" fill="#fdebd0" stroke="#9a5b00" stroke-width="1.6" rx="4"/>
  <text x="605" y="119" font-size="13" font-weight="bold" fill="#5c3500" text-anchor="middle">shelf-providers.tsx</text>
  <text x="605" y="137" font-size="11" fill="#333333" text-anchor="middle">'use client': context provider that wraps children</text>

  <rect x="450" y="168" width="310" height="46" fill="#fdebd0" stroke="#9a5b00" stroke-width="1.6" rx="4"/>
  <text x="605" y="188" font-size="12" font-weight="bold" fill="#5c3500" text-anchor="middle">like-button.tsx</text>
  <text x="605" y="205" font-size="11" fill="#333333" text-anchor="middle">'use client': useState, onClick; reads the context</text>

  <rect x="450" y="232" width="310" height="46" fill="#fdebd0" stroke="#9a5b00" stroke-width="1.6" rx="4"/>
  <text x="605" y="252" font-size="12" font-weight="bold" fill="#5c3500" text-anchor="middle">drawer.tsx</text>
  <text x="605" y="269" font-size="11" fill="#333333" text-anchor="middle">'use client': open/closed state, renders {children}</text>

  <rect x="450" y="298" width="310" height="112" fill="#ffffff" stroke="#9a5b00" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
  <text x="605" y="320" font-size="12" font-weight="bold" fill="#5c3500" text-anchor="middle">Also in the client bundle</text>
  <text x="605" y="340" font-size="11" fill="#333333" text-anchor="middle">everything these three files import</text>
  <text x="605" y="357" font-size="11" fill="#333333" text-anchor="middle">like-button imports shelf-providers: same graph</text>
  <text x="605" y="378" font-size="11" fill="#a11d2d" text-anchor="middle">never: book-card, shelf-stats, Reviews,</text>
  <text x="605" y="394" font-size="11" fill="#a11d2d" text-anchor="middle">lib/books.ts, actions.ts source</text>

  <!-- crossing arrows -->
  <line x1="350" y1="116" x2="450" y2="116" stroke="#444444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="400" y="108" font-size="10" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">import</text>
  <line x1="350" y1="134" x2="450" y2="186" stroke="#444444" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="350" y1="142" x2="450" y2="246" stroke="#444444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="400" y="162" font-size="10" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">import</text>
  <text x="410" y="238" font-size="10" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">import</text>

  <!-- children: Reviews output -> Drawer -->
  <line x1="350" y1="262" x2="450" y2="262" stroke="#1e6b36" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="276" font-size="10" fill="#14411f" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">children</text>

  <!-- server action reference -->
  <path d="M350,387 C410,387 410,196 450,196" fill="none" stroke="#1e6b36" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="398" y="372" font-size="10" fill="#14411f" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">reference</text>

  <!-- forbidden: client -> server -->
  <line x1="450" y1="420" x2="350" y2="420" stroke="#a11d2d" stroke-width="2" marker-end="url(#arrx)"/>
  <text x="400" y="438" font-size="10" fill="#a11d2d" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">no import back</text>

  <!-- legend -->
  <g font-size="11" fill="#222222">
    <line x1="40" y1="494" x2="80" y2="494" stroke="#444444" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="88" y="498">import of a 'use client' file: becomes a client reference</text>
    <line x1="392" y1="494" x2="432" y2="494" stroke="#1e6b36" stroke-width="2" marker-end="url(#arr)"/>
    <text x="440" y="498">rendered output, as children</text>
    <path d="M610,494 L650,494" stroke="#1e6b36" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="658" y="498">Server Function reference</text>
  </g>
</svg>
