<svg viewBox="0 0 940 538" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="538" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which standard-library primitive for which job</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">start from the need, not the algorithm; the last column is the first thing to check before writing code</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="12" font-weight="bold" fill="#1c4b73"><text x="24" y="74">I need to</text><text x="420" y="74">use</text><text x="700" y="74">watch out for</text></g>
  <rect x="16" y="84" width="908" height="36" fill="#e8f0f8" stroke="#c4d3e3"/>
  <text x="28" y="108" font-size="13" fill="#222222">Get unpredictable bytes or a token</text>
  <line x1="360" y1="101" x2="408" y2="101" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="108" font-size="13" font-weight="bold" fill="#1c4b73">crypto/rand: Read, Text, Int</text>
  <text x="700" y="108" font-size="12" fill="#555555">never math/rand/v2</text>
  <rect x="16" y="126" width="908" height="36" fill="#f6f8fb" stroke="#c4d3e3"/>
  <text x="28" y="150" font-size="13" fill="#222222">Fingerprint or checksum some data</text>
  <line x1="360" y1="143" x2="408" y2="143" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="150" font-size="13" font-weight="bold" fill="#1c4b73">crypto/sha256, crypto/sha3</text>
  <text x="700" y="150" font-size="12" fill="#555555">not md5 or sha1 for security</text>
  <rect x="16" y="168" width="908" height="36" fill="#e8f0f8" stroke="#c4d3e3"/>
  <text x="28" y="192" font-size="13" fill="#222222">Authenticate a message with a shared key</text>
  <line x1="360" y1="185" x2="408" y2="185" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="192" font-size="13" font-weight="bold" fill="#1c4b73">crypto/hmac</text>
  <text x="700" y="192" font-size="12" fill="#555555">compare with hmac.Equal</text>
  <rect x="16" y="210" width="908" height="36" fill="#f6f8fb" stroke="#c4d3e3"/>
  <text x="28" y="234" font-size="13" fill="#222222">Encrypt data with a shared key</text>
  <line x1="360" y1="227" x2="408" y2="227" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="234" font-size="13" font-weight="bold" fill="#1c4b73">crypto/cipher AEAD: AES-GCM</text>
  <text x="700" y="234" font-size="12" fill="#555555">NewGCMWithRandomNonce (1.24)</text>
  <rect x="16" y="252" width="908" height="36" fill="#e8f0f8" stroke="#c4d3e3"/>
  <text x="28" y="276" font-size="13" fill="#222222">Store a user's password</text>
  <line x1="360" y1="269" x2="408" y2="269" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="276" font-size="13" font-weight="bold" fill="#1c4b73">x/crypto: argon2id, bcrypt, scrypt</text>
  <text x="700" y="276" font-size="12" fill="#555555">pbkdf2 (1.24) when FIPS is required</text>
  <rect x="16" y="294" width="908" height="36" fill="#f6f8fb" stroke="#c4d3e3"/>
  <text x="28" y="318" font-size="13" fill="#222222">Derive subkeys from a strong secret</text>
  <line x1="360" y1="311" x2="408" y2="311" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="318" font-size="13" font-weight="bold" fill="#1c4b73">crypto/hkdf (1.24)</text>
  <text x="700" y="318" font-size="12" fill="#555555">not for low-entropy passwords</text>
  <rect x="16" y="336" width="908" height="36" fill="#e8f0f8" stroke="#c4d3e3"/>
  <text x="28" y="360" font-size="13" fill="#222222">Encrypt to someone's public key</text>
  <line x1="360" y1="353" x2="408" y2="353" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="360" font-size="13" font-weight="bold" fill="#1c4b73">crypto/hpke (1.26)</text>
  <text x="700" y="360" font-size="12" fill="#555555">hybrid post-quantum KEMs available</text>
  <rect x="16" y="378" width="908" height="36" fill="#f6f8fb" stroke="#c4d3e3"/>
  <text x="28" y="402" font-size="13" fill="#222222">Agree on a key over a network</text>
  <line x1="360" y1="395" x2="408" y2="395" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="402" font-size="13" font-weight="bold" fill="#1c4b73">crypto/tls, crypto/ecdh, crypto/mlkem</text>
  <text x="700" y="402" font-size="12" fill="#555555">hybrid X25519MLKEM768 by default</text>
  <rect x="16" y="420" width="908" height="36" fill="#e8f0f8" stroke="#c4d3e3"/>
  <text x="28" y="444" font-size="13" fill="#222222">Sign data or a certificate</text>
  <line x1="360" y1="437" x2="408" y2="437" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="444" font-size="13" font-weight="bold" fill="#1c4b73">crypto/ed25519, crypto/ecdsa</text>
  <text x="700" y="444" font-size="12" fill="#555555">post-quantum: crypto/mldsa (1.27)</text>
  <rect x="16" y="462" width="908" height="36" fill="#f6f8fb" stroke="#c4d3e3"/>
  <text x="28" y="486" font-size="13" fill="#222222">Open a connection or verify a peer</text>
  <line x1="360" y1="479" x2="408" y2="479" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="486" font-size="13" font-weight="bold" fill="#1c4b73">crypto/tls and crypto/x509</text>
  <text x="700" y="486" font-size="12" fill="#555555">TLS 1.2 or later, verify by default</text>
  <text x="470" y="526" font-size="11" fill="#666666" text-anchor="middle">x/crypto packages are separate modules (golang.org/x/crypto) and need go get; everything else ships with the standard library</text>
</svg>
