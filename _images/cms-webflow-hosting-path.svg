<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Path of a request for a published Webflow page: visitor, DNS lookup, CDN edge, origin, with the staging and custom domain entry points">
<rect width="900" height="430" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">From the visitor to a published page</text>
<rect x="20" y="70" width="140" height="90" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="90" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Visitor</text>
<text x="90" y="128" text-anchor="middle" font-size="13" fill="#0B4F6C">browser</text>
<text x="90" y="146" text-anchor="middle" font-size="13" fill="#0B4F6C">types a URL</text>
<rect x="215" y="70" width="170" height="90" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="300" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4800">DNS</text>
<text x="300" y="122" text-anchor="middle" font-size="13" fill="#7A4800">www CNAME to Webflow</text>
<text x="300" y="142" text-anchor="middle" font-size="13" fill="#7A4800">apex A records to Webflow</text>
<rect x="440" y="70" width="190" height="90" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="535" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">CDN edge</text>
<text x="535" y="122" text-anchor="middle" font-size="13" fill="#0B4F6C">TLS ends here</text>
<text x="535" y="142" text-anchor="middle" font-size="13" fill="#0B4F6C">cached HTML, CSS, JS, images</text>
<rect x="685" y="70" width="195" height="90" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="782" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">Published site</text>
<text x="782" y="122" text-anchor="middle" font-size="13" fill="#1B5E20">static pages and CMS pages</text>
<text x="782" y="142" text-anchor="middle" font-size="13" fill="#1B5E20">rendered at publish time</text>
<line x1="160" y1="115" x2="213" y2="115" stroke="#333333" stroke-width="2"/>
<polygon points="213,115 205,110 205,120" fill="#333333"/>
<line x1="385" y1="115" x2="438" y2="115" stroke="#333333" stroke-width="2"/>
<polygon points="438,115 430,110 430,120" fill="#333333"/>
<line x1="630" y1="115" x2="683" y2="115" stroke="#333333" stroke-width="2"/>
<polygon points="683,115 675,110 675,120" fill="#333333"/>
<text x="20" y="205" font-size="17" font-weight="700" fill="#0B4F6C">Three entry points to the same site</text>
<rect x="20" y="220" width="270" height="86" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="34" y="246" font-size="14" font-weight="700" fill="#333333">Staging domain</text>
<text x="34" y="268" font-size="13" fill="#333333">fernbrook-gardens.webflow.io</text>
<text x="34" y="288" font-size="13" fill="#333333">always available, noindex by default</text>
<rect x="315" y="220" width="270" height="86" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="329" y="246" font-size="14" font-weight="700" fill="#333333">Default custom domain</text>
<text x="329" y="268" font-size="13" fill="#333333">www.fernbrook-gardens.example</text>
<text x="329" y="288" font-size="13" fill="#333333">serves the content</text>
<rect x="610" y="220" width="270" height="86" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="624" y="246" font-size="14" font-weight="700" fill="#333333">Other connected domains</text>
<text x="624" y="268" font-size="13" fill="#333333">fernbrook-gardens.example (apex)</text>
<text x="624" y="288" font-size="13" fill="#333333">301 redirect to the default domain</text>
<text x="20" y="346" font-size="17" font-weight="700" fill="#0B4F6C">What the owner controls</text>
<text x="20" y="370" font-size="14" fill="#333333">DNS records at the registrar or DNS host, the default domain, advanced publishing options</text>
<text x="20" y="392" font-size="14" fill="#333333">(minify, secure frame headers), and on Enterprise the security headers and custom certificates.</text>
<text x="20" y="414" font-size="13" fill="#555555">Fernbrook Gardens addresses use the reserved .example top-level domain.</text>
</svg>
