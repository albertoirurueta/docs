<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where Docusaurus styles come from and which one wins</title>
  <desc id="d">Stacked boxes from lowest to highest priority: Infima inside a cascade layer, theme-common and theme-classic layers, plugin layers, then the unlayered custom.css and CSS modules of the site. The html data-theme attribute switches the variable values.</desc>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#26323f"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Order of the style sources (lowest to highest priority)</text>
  <rect x="40" y="290" width="440" height="42" rx="8" fill="#3d6a99" stroke="#cfe3f7" stroke-width="2"/>
  <text x="260" y="316" text-anchor="middle" font-size="14" fill="#ffffff">1. Infima: --ifm-* variables and base rules</text>
  <rect x="40" y="238" width="440" height="42" rx="8" fill="#3b7d5a" stroke="#d3f0e0" stroke-width="2"/>
  <text x="260" y="264" text-anchor="middle" font-size="14" fill="#ffffff">2. theme-common and theme-classic CSS modules</text>
  <rect x="40" y="186" width="440" height="42" rx="8" fill="#3b7d5a" stroke="#d3f0e0" stroke-width="2"/>
  <text x="260" y="212" text-anchor="middle" font-size="14" fill="#ffffff">3. Core, debug, Mermaid, live code, search layers</text>
  <rect x="40" y="134" width="440" height="42" rx="8" fill="#8a5a2b" stroke="#f6dcc0" stroke-width="2"/>
  <text x="260" y="160" text-anchor="middle" font-size="14" fill="#ffffff">4. custom.css and your CSS modules (no layer)</text>
  <rect x="40" y="82" width="440" height="42" rx="8" fill="#5b4a8a" stroke="#ddd4f5" stroke-width="2"/>
  <text x="260" y="108" text-anchor="middle" font-size="14" fill="#ffffff">5. Inline style attributes in components</text>
  <rect x="40" y="46" width="440" height="26" rx="6" fill="none" stroke="#9fb4c9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#d5e1ee">cascade layers apply while future.v4.useCssCascadeLayers is on</text>
  <rect x="520" y="82" width="200" height="130" rx="8" fill="#3d6a99" stroke="#cfe3f7" stroke-width="2"/>
  <text x="620" y="108" text-anchor="middle" font-size="14" fill="#ffffff">html element</text>
  <text x="620" y="132" text-anchor="middle" font-size="12" fill="#e6f0fa">data-theme="light"</text>
  <text x="620" y="152" text-anchor="middle" font-size="12" fill="#e6f0fa">data-theme="dark"</text>
  <text x="620" y="178" text-anchor="middle" font-size="12" fill="#e6f0fa">selects which values of the</text>
  <text x="620" y="194" text-anchor="middle" font-size="12" fill="#e6f0fa">variables apply</text>
  <g stroke="#ffffff" stroke-width="2" fill="none"><path d="M520 147 L486 147"/><path d="M486 147 L494 142 M486 147 L494 152"/></g>
</svg>
