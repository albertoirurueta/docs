<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Relaying the outbox: polling publisher vs. transaction-log tailing</text>

  <defs>
    <marker id="pt-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="pt-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="390" y1="48" x2="390" y2="410" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT: polling publisher -->
  <text x="195" y="62" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Polling publisher</text>

  <rect x="95" y="78" width="200" height="46" rx="7" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="195" y="105" font-size="11.5" fill="#222222" text-anchor="middle">outbox table</text>

  <line x1="195" y1="124" x2="195" y2="156" stroke="#1c4b73" stroke-width="2" marker-end="url(#pt-arrow-blue)"/>
  <text x="255" y="144" font-size="9.5" fill="#1c4b73" text-anchor="middle">SELECT every</text>
  <text x="255" y="156" font-size="9.5" fill="#1c4b73" text-anchor="middle">poll interval</text>

  <rect x="95" y="160" width="200" height="46" rx="7" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="195" y="181" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">OutboxPollingRelay</text>
  <text x="195" y="196" font-size="9.5" fill="#333333" text-anchor="middle">application-level query</text>

  <line x1="195" y1="206" x2="195" y2="238" stroke="#1c4b73" stroke-width="2" marker-end="url(#pt-arrow-blue)"/>
  <text x="255" y="226" font-size="9.5" fill="#1c4b73" text-anchor="middle">publish batch,</text>
  <text x="255" y="238" font-size="9.5" fill="#1c4b73" text-anchor="middle">keyed by aggregate_id</text>

  <rect x="95" y="242" width="200" height="46" rx="7" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="195" y="269" font-size="11.5" fill="#222222" text-anchor="middle">Kafka</text>

  <line x1="195" y1="288" x2="195" y2="320" stroke="#1c4b73" stroke-width="2" marker-end="url(#pt-arrow-blue)"/>
  <text x="255" y="308" font-size="9.5" fill="#1c4b73" text-anchor="middle">mark published_at</text>

  <rect x="95" y="324" width="200" height="46" rx="7" fill="#f5f5f5" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="195" y="345" font-size="10.5" fill="#333333" text-anchor="middle">row marked or deleted</text>
  <text x="195" y="360" font-size="9" fill="#666666" text-anchor="middle">crash here republishes -- at-least-once</text>

  <text x="195" y="392" font-size="9.5" fill="#444444" text-anchor="middle">+ no extra infrastructure to run</text>
  <text x="195" y="405" font-size="9.5" fill="#444444" text-anchor="middle">- adds read load; latency bound by poll interval</text>

  <!-- RIGHT: transaction-log tailing -->
  <text x="585" y="62" font-size="13.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Transaction-log tailing (CDC)</text>

  <rect x="485" y="78" width="200" height="46" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="585" y="105" font-size="11.5" fill="#222222" text-anchor="middle">outbox table</text>

  <line x1="585" y1="124" x2="585" y2="156" stroke="#2d6a34" stroke-width="2" marker-end="url(#pt-arrow-green)"/>
  <text x="645" y="144" font-size="9.5" fill="#2d6a34" text-anchor="middle">write-ahead /</text>
  <text x="645" y="156" font-size="9.5" fill="#2d6a34" text-anchor="middle">binary log record</text>

  <rect x="485" y="160" width="200" height="46" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="585" y="181" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Debezium connector</text>
  <text x="585" y="196" font-size="9.5" fill="#333333" text-anchor="middle">no application query at all</text>

  <line x1="585" y1="206" x2="585" y2="238" stroke="#2d6a34" stroke-width="2" marker-end="url(#pt-arrow-green)"/>
  <text x="645" y="226" font-size="9.5" fill="#2d6a34" text-anchor="middle">outbox event</text>
  <text x="645" y="238" font-size="9.5" fill="#2d6a34" text-anchor="middle">router SMT</text>

  <rect x="485" y="242" width="200" height="46" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="585" y="263" font-size="11" fill="#222222" text-anchor="middle">clean domain event</text>
  <text x="585" y="278" font-size="9.5" fill="#333333" text-anchor="middle">topic named from aggregate_type</text>

  <line x1="585" y1="288" x2="585" y2="320" stroke="#2d6a34" stroke-width="2" marker-end="url(#pt-arrow-green)"/>

  <rect x="485" y="324" width="200" height="46" rx="7" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="585" y="345" font-size="11.5" fill="#222222" text-anchor="middle">Kafka</text>
  <text x="585" y="360" font-size="9" fill="#666666" text-anchor="middle">still only at-least-once delivery</text>

  <text x="585" y="392" font-size="9.5" fill="#444444" text-anchor="middle">+ lower latency; zero added read load on the outbox</text>
  <text x="585" y="405" font-size="9.5" fill="#444444" text-anchor="middle">- Kafka Connect and Debezium become infrastructure to run</text>

  <text x="390" y="432" font-size="10.5" fill="#666666" text-anchor="middle">Both relays deliver the outbox row at-least-once -- every consumer on either side must still be idempotent.</text>
</svg>
