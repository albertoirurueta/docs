<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-qf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where each storage qualifier gets its data</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="83.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Application</text>
<text x="95.0" y="99.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glUniform*, UBO, SSBO</text>
<text x="95.0" y="115.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex arrays</text>
<rect x="240" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="305.0" y="83.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Vertex shader</text>
<text x="305.0" y="99.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">in: attributes</text>
<text x="305.0" y="115.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">out: varyings</text>
<rect x="440" y="60" width="130" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="505.0" y="83.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Rasteriser</text>
<text x="505.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">interpolates</text>
<text x="505.0" y="115.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">smooth / flat / noperspective</text>
<rect x="630" y="60" width="110" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="685.0" y="83.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Fragment shader</text>
<text x="685.0" y="99.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">in: interpolants</text>
<text x="685.0" y="115.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">out: colours</text>
<line x1="170" y1="95" x2="240" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-qf)"/>
<line x1="370" y1="95" x2="440" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-qf)"/>
<line x1="570" y1="95" x2="630" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-qf)"/>
<text x="205" y="86" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">in</text>
<text x="405" y="86" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">out</text>
<text x="600" y="86" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">in</text>
<rect x="630" y="200" width="110" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="685.0" y="221.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Framebuffer</text>
<text x="685.0" y="237.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glDrawBuffers</text>
<line x1="685" y1="130" x2="685" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-qf)"/>
<text x="695" y="170" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">out</text>
<rect x="20" y="160" width="520" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="34" y="182" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">uniform and buffer blocks are visible to every stage, constant for the whole draw call</text>
<text x="34" y="200" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">uniform = read-only, set from the CPU      buffer (SSBO) = read-write from shaders</text>
<text x="34" y="216" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">shared = compute work group memory</text>
<line x1="120" y1="130" x2="120" y2="160" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-qf)"/>
<line x1="300" y1="160" x2="300" y2="130" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-qf)"/>
<text x="20" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Layout qualifiers decide which slot each name uses</text>
<text x="20" y="284" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">layout(location = 0) in vec3 aPos;</text>
<text x="430" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">vertex attribute slot 0 (vertex array attribute index)</text>
<text x="20" y="308" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">layout(location = 0) out vec4 oColor;</text>
<text x="430" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">draw buffer 0 (colour attachment)</text>
<text x="20" y="332" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">layout(binding = 0) uniform sampler2D uCover;</text>
<text x="430" y="332" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">texture unit 0 (GLSL 4.20)</text>
<text x="20" y="356" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">layout(std140, binding = 1) uniform Lights {...};</text>
<text x="430" y="356" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">UBO binding point 1</text>
<text x="20" y="380" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">layout(std430, binding = 2) buffer Books {...};</text>
<text x="430" y="380" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">SSBO binding point 2 (GLSL 4.30)</text>
<text x="20" y="414" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Interface matching: a vertex out and a fragment in link by name (or by location); flat integers need the flat qualifier.</text>
</svg>
