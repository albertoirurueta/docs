<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-debugging-and-profiling-capture-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Capturing a frame: four steps</text>
<rect x="20" y="60" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/><text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="115" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Enable capture</text>
<rect x="35" y="100" width="140" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">Info.plist</text>
<text x="105.0" y="153.8" text-anchor="middle" font-size="11" fill="#3730A3">MetalCaptureEnabled</text>
<text x="105.0" y="167.8" text-anchor="middle" font-size="11" fill="#3730A3">or env variable</text>
<line x1="190" y1="155" x2="203" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-debugging-and-profiling-capture-storyboard)"/>
<rect x="203" y="60" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="219" cy="76" r="11" fill="#4F46E5"/><text x="219" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="298" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Run the scheme</text>
<rect x="218" y="100" width="140" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="288.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">Product &gt; Run</text>
<text x="288.0" y="153.8" text-anchor="middle" font-size="11" fill="#3730A3">the debug bar shows</text>
<text x="288.0" y="167.8" text-anchor="middle" font-size="11" fill="#3730A3">the Metal icon</text>
<line x1="373" y1="155" x2="386" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-debugging-and-profiling-capture-storyboard)"/>
<rect x="386" y="60" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="76" r="11" fill="#4F46E5"/><text x="402" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="481" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Capture</text>
<rect x="401" y="100" width="140" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="471.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">Click the camera</text>
<text x="471.0" y="153.8" text-anchor="middle" font-size="11" fill="#3730A3">or call</text>
<text x="471.0" y="167.8" text-anchor="middle" font-size="11" fill="#3730A3">startCapture(with:)</text>
<line x1="556" y1="155" x2="569" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-debugging-and-profiling-capture-storyboard)"/>
<rect x="569" y="60" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="585" cy="76" r="11" fill="#4F46E5"/><text x="585" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="664" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Inspect</text>
<rect x="584" y="100" width="140" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="654.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">Debugger opens</text>
<text x="654.0" y="153.8" text-anchor="middle" font-size="11" fill="#3730A3">pick a draw, read</text>
<text x="654.0" y="167.8" text-anchor="middle" font-size="11" fill="#3730A3">state and shaders</text>
<text x="380" y="280" text-anchor="middle" font-size="11" fill="#374151">Capture only the frames that matter: a capture records every command in the buffers committed while it runs.</text>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">Use a custom capture scope to bracket exactly one frame.</text>
</svg>
