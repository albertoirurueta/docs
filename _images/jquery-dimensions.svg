<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="380" fill="#ffffff"/>

  <!-- margin layer -->
  <rect x="20" y="20" width="440" height="250" fill="#fdf1dc" stroke="#c9861f" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="30" y="40" font-size="14" font-weight="bold" fill="#8a5a10">margin</text>

  <!-- border layer -->
  <rect x="66" y="60" width="348" height="170" fill="#f6d9a4" stroke="#6b4207" stroke-width="6"/>
  <text x="78" y="80" font-size="14" font-weight="bold" fill="#6b4207">border</text>

  <!-- padding layer -->
  <rect x="108" y="100" width="264" height="90" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="120" y="120" font-size="14" font-weight="bold" fill="#2a6636">padding</text>

  <!-- content layer -->
  <rect x="160" y="132" width="160" height="26" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="240" y="150" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">content</text>

  <defs>
    <marker id="jqd-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- measurement bars, stacked below, each labelled to the right -->
  <g font-size="13">
    <g stroke="#1c4b73" fill="#1c4b73">
      <line x1="160" y1="292" x2="320" y2="292" stroke-width="1.5" marker-start="url(#jqd-arrow)" marker-end="url(#jqd-arrow)"/>
      <text x="470" y="296">.width() &#8594; content box only</text>
    </g>
    <g stroke="#2a6636" fill="#2a6636">
      <line x1="108" y1="316" x2="372" y2="316" stroke-width="1.5" marker-start="url(#jqd-arrow)" marker-end="url(#jqd-arrow)"/>
      <text x="470" y="320">.innerWidth() &#8594; + padding</text>
    </g>
    <g stroke="#6b4207" fill="#6b4207">
      <line x1="66" y1="340" x2="414" y2="340" stroke-width="1.5" marker-start="url(#jqd-arrow)" marker-end="url(#jqd-arrow)"/>
      <text x="470" y="344">.outerWidth() &#8594; + border</text>
    </g>
    <g stroke="#8a5a10" fill="#8a5a10">
      <line x1="20" y1="364" x2="460" y2="364" stroke-width="1.5" marker-start="url(#jqd-arrow)" marker-end="url(#jqd-arrow)"/>
      <text x="470" y="368">.outerWidth(true) &#8594; + margin</text>
    </g>
  </g>
</svg>
