<svg viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One 24 x 24 design, three pixel densities</text>
<rect x="40" y="60" width="24" height="24" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="200" y="60" width="48" height="48" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="400" y="60" width="72" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<g fill="#4F46E5"><rect x="46" y="68" width="12" height="9" rx="1"/><rect x="209" y="70" width="30" height="22" rx="2"/><rect x="412" y="72" width="48" height="36" rx="3"/></g>
<g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle"><text x="52" y="160">1x</text><text x="224" y="160">2x</text><text x="436" y="160">3x</text></g>
<g font-size="12" fill="#374151" text-anchor="middle"><text x="52" y="178">24 x 24 px</text><text x="224" y="178">48 x 48 px</text><text x="436" y="178">72 x 72 px</text>
<text x="52" y="196">72 dpi</text><text x="224" y="196">144 dpi</text><text x="436" y="196">216 dpi</text></g>
<rect x="30" y="210" width="700" height="100" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<g font-size="12" fill="#92400E">
<text x="46" y="234" font-weight="bold">Typical file names (suffix = @2x, @3x)</text>
<text x="46" y="256">iOS asset catalogue: shelf-icon.png, shelf-icon@2x.png, shelf-icon@3x.png</text>
<text x="46" y="276">Android drawable buckets: mdpi 1x, hdpi 1.5x, xhdpi 2x, xxhdpi 3x, xxxhdpi 4x</text>
<text x="46" y="296">SVG and PDF exports stay at 1x: they are resolution independent.</text></g>
<g font-size="12" fill="#4B5563"><text x="560" y="90">Scale = pixels / design pixels</text><text x="560" y="108">DPI = 72 x scale</text><text x="560" y="126">512w or 512h fix one side</text></g>
</svg>
