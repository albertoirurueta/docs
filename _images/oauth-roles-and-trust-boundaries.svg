<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The four OAuth roles and their trust boundaries</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">solid arrows: direct HTTP calls -- dashed box: the trust boundary each party controls</text>

  <!-- Resource Owner -->
  <rect x="300" y="70" width="160" height="70" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="96" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Resource Owner</text>
  <text x="380" y="112" font-size="10.5" fill="#333333" text-anchor="middle">the user; owns the data</text>
  <text x="380" y="126" font-size="10.5" fill="#333333" text-anchor="middle">grants or denies consent</text>

  <!-- Client -->
  <rect x="40" y="200" width="180" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="130" y="226" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Client</text>
  <text x="130" y="242" font-size="10.5" fill="#333333" text-anchor="middle">the application requesting</text>
  <text x="130" y="256" font-size="10.5" fill="#333333" text-anchor="middle">access; confidential or</text>
  <text x="130" y="270" font-size="10.5" fill="#333333" text-anchor="middle">public</text>

  <!-- Authorization Server -->
  <rect x="300" y="200" width="160" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="226" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Authorization</text>
  <text x="380" y="240" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Server</text>
  <text x="380" y="258" font-size="10.5" fill="#333333" text-anchor="middle">authenticates the owner,</text>
  <text x="380" y="272" font-size="10.5" fill="#333333" text-anchor="middle">issues tokens</text>

  <!-- Resource Server -->
  <rect x="560" y="200" width="160" height="80" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="640" y="226" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Resource Server</text>
  <text x="640" y="242" font-size="10.5" fill="#333333" text-anchor="middle">the API; accepts the</text>
  <text x="640" y="256" font-size="10.5" fill="#333333" text-anchor="middle">access token and serves</text>
  <text x="640" y="270" font-size="10.5" fill="#333333" text-anchor="middle">the protected data</text>

  <!-- arrows -->
  <line x1="330" y1="140" x2="180" y2="200" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="230" y="165" font-size="9.5" fill="#333333" text-anchor="middle">authenticates,</text>
  <text x="230" y="177" font-size="9.5" fill="#333333" text-anchor="middle">consents</text>

  <line x1="380" y1="140" x2="380" y2="200" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="418" y="170" font-size="9.5" fill="#333333" text-anchor="middle">authenticates,</text>
  <text x="418" y="182" font-size="9.5" fill="#333333" text-anchor="middle">grants consent</text>

  <line x1="220" y1="235" x2="300" y2="235" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="260" y="222" font-size="9.5" fill="#333333" text-anchor="middle">GET /authorize</text>
  <line x1="300" y1="255" x2="220" y2="255" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="260" y="270" font-size="9.5" fill="#333333" text-anchor="middle">token</text>

  <line x1="460" y1="235" x2="560" y2="235" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="510" y="222" font-size="9.5" fill="#333333" text-anchor="middle">token introspection</text>
  <text x="510" y="272" font-size="9.5" fill="#666666" text-anchor="middle">(or local JWT validation,</text>
  <text x="510" y="284" font-size="9.5" fill="#666666" text-anchor="middle">no call needed)</text>

  <line x1="130" y1="280" x2="130" y2="330" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="640" y1="280" x2="640" y2="330" stroke="#333333" stroke-width="1.3"/>
  <line x1="130" y1="345" x2="640" y2="345" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="385" y="335" font-size="9.5" fill="#333333" text-anchor="middle">GET /resource, Authorization: Bearer &lt;access_token&gt;</text>

  <!-- trust boundary note -->
  <rect x="20" y="380" width="720" height="60" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="398" font-size="10.5" fill="#666666" text-anchor="middle">In many real deployments the Authorization Server and Resource Server are the same</text>
  <text x="380" y="413" font-size="10.5" fill="#666666" text-anchor="middle">operator (or even the same process) -- the roles stay distinct even when the boxes merge, because a</text>
  <text x="380" y="428" font-size="10.5" fill="#666666" text-anchor="middle">JWT-based access token still needs an issuer and an audience, and revocation still needs a token store</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
