<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tpp-passes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">EffectComposer: two render targets, one pass at a time</text>
<rect x="20" y="60" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="86.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">RenderPass</text>
<text x="80.0" y="101.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">scene to RT A</text>
<rect x="170" y="60" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="230.0" y="86.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">UnrealBloomPass</text>
<text x="230.0" y="100.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">reads A, writes B</text>
<rect x="320" y="60" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="86.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">ShaderPass</text>
<text x="380.0" y="101.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">reads B, writes A</text>
<rect x="470" y="60" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="530.0" y="86.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">OutputPass</text>
<text x="530.0" y="101.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">tone map + sRGB</text>
<rect x="620" y="60" width="120" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="680.0" y="86.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Canvas</text>
<text x="680.0" y="101.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">final pass</text>
<line x1="140" y1="90" x2="170" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<line x1="290" y1="90" x2="320" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<line x1="440" y1="90" x2="470" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<line x1="590" y1="90" x2="620" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<rect x="20" y="160" width="300" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="186.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">readBuffer</text>
<text x="170.0" y="201.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(source of the next pass)</text>
<rect x="440" y="160" width="300" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="590.0" y="186.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">writeBuffer</text>
<text x="590.0" y="201.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(destination of the next pass)</text>
<line x1="320" y1="190" x2="440" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<line x1="440" y1="200" x2="320" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tpp-passes)"/>
<text x="380" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">swap</text>
<text x="380" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">needsSwap decides whether the buffers swap after a pass; the last enabled pass renders to the screen.</text>
<text x="380" y="270" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Render targets are created at renderer size times pixel ratio; setSize and setPixelRatio on the composer resize them.</text>
<rect x="60" y="295" width="640" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="316.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">HalfFloatType targets keep values above 1.0 so bloom can find the bright parts;</text>
<text x="380.0" y="330.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">OutputPass converts to the display colour space at the very end.</text>
</svg>
