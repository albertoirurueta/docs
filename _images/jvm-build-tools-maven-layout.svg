<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="mvnLayoutArrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
<marker id="mvnLayoutArrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="mvnLayoutArrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Maven standard directory layout: sources in src/, everything the build writes in target/</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Left: the layout of the Maven guide. Right: what mvn package (and mvn site) left in tidepool-model on Maven 3.10.0. No pom.xml element places any of it</text>
<text x="40" y="84" font-size="13" font-weight="bold" fill="#1c4b73">1. What you write and keep in version control</text>
<rect x="40" y="96" width="400" height="358" fill="#f7f7f7" stroke="#999999"/>
<text x="54" y="120" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222" font-weight="bold" xml:space="preserve">tidepool-model/</text>
<text x="428" y="120" font-size="11" fill="#555555" text-anchor="end">the module (project) directory</text>
<text x="54" y="144" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222" xml:space="preserve">+- pom.xml</text>
<text x="428" y="144" font-size="11" fill="#555555" text-anchor="end">the POM: required, always at the top</text>
<text x="54" y="168" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222" xml:space="preserve">+- LICENSE.txt NOTICE.txt README.txt</text>
<text x="428" y="168" font-size="11" fill="#555555" text-anchor="end">descriptive files</text>
<text x="54" y="192" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222" xml:space="preserve">`- src/</text>
<text x="54" y="216" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1c4b73" xml:space="preserve">   +- main/java</text>
<text x="428" y="216" font-size="11" fill="#555555" text-anchor="end">application or library sources</text>
<text x="54" y="240" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1c4b73" xml:space="preserve">   +- main/resources</text>
<text x="428" y="240" font-size="11" fill="#555555" text-anchor="end">resources, copied or filtered</text>
<text x="54" y="264" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">   +- main/filters</text>
<text x="428" y="264" font-size="11" fill="#555555" text-anchor="end">resource filter files</text>
<text x="54" y="288" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">   +- main/webapp</text>
<text x="428" y="288" font-size="11" fill="#555555" text-anchor="end">web application sources (war)</text>
<text x="54" y="312" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1b5e20" xml:space="preserve">   +- test/java</text>
<text x="428" y="312" font-size="11" fill="#555555" text-anchor="end">test sources</text>
<text x="54" y="336" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1b5e20" xml:space="preserve">   +- test/resources</text>
<text x="428" y="336" font-size="11" fill="#555555" text-anchor="end">test resources</text>
<text x="54" y="360" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">   +- test/filters</text>
<text x="428" y="360" font-size="11" fill="#555555" text-anchor="end">test resource filter files</text>
<text x="54" y="384" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">   +- it</text>
<text x="428" y="384" font-size="11" fill="#555555" text-anchor="end">integration tests (mostly plugins)</text>
<text x="54" y="408" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">   +- assembly</text>
<text x="428" y="408" font-size="11" fill="#555555" text-anchor="end">assembly descriptors</text>
<text x="54" y="432" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#6a1b9a" xml:space="preserve">   `- site</text>
<text x="428" y="432" font-size="11" fill="#555555" text-anchor="end">site sources</text>
<text x="560" y="84" font-size="13" font-weight="bold" fill="#8c1d18">2. What the build writes (delete it with mvn clean)</text>
<rect x="560" y="96" width="360" height="286" fill="#fdf3f2" stroke="#b3261e"/>
<text x="572" y="120" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222" font-weight="bold" xml:space="preserve">target/</text>
<text x="572" y="144" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1c4b73" xml:space="preserve">+- classes/</text>
<text x="572" y="168" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">+- generated-sources/annotations/</text>
<text x="572" y="192" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1b5e20" xml:space="preserve">+- test-classes/</text>
<text x="572" y="216" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">+- generated-test-sources/test-annotations/</text>
<text x="572" y="240" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1b5e20" xml:space="preserve">+- surefire-reports/</text>
<text x="572" y="264" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">+- maven-status/</text>
<text x="572" y="288" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#555555" xml:space="preserve">+- maven-archiver/pom.properties</text>
<text x="572" y="312" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#7a4500" xml:space="preserve">+- tidepool-model-1.0.0.jar</text>
<text x="572" y="336" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#7a4500" xml:space="preserve">+- tidepool-model-1.0.0-tests.jar</text>
<text x="572" y="360" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#6a1b9a" xml:space="preserve">`- site/   (after mvn site)</text>
<text x="640" y="120" font-size="11" fill="#555555">output of the whole build</text>
<line x1="446" y1="212" x2="554" y2="140" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#mvnLayoutArrow-b)"/>
<line x1="446" y1="236" x2="554" y2="140" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#mvnLayoutArrow-b)"/>
<line x1="446" y1="308" x2="554" y2="188" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#mvnLayoutArrow-g)"/>
<line x1="446" y1="332" x2="554" y2="188" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#mvnLayoutArrow-g)"/>
<line x1="446" y1="428" x2="554" y2="356" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#mvnLayoutArrow-p)"/>
<rect x="474" y="168" width="52" height="14" fill="#ffffff"/><text x="500" y="179" font-size="10" fill="#1c4b73" text-anchor="middle">compile</text>
<rect x="470" y="266" width="60" height="14" fill="#ffffff"/><text x="500" y="277" font-size="10" fill="#2e7d32" text-anchor="middle">test-compile</text>
<rect x="474" y="388" width="52" height="14" fill="#ffffff"/><text x="500" y="399" font-size="10" fill="#6a1b9a" text-anchor="middle">mvn site</text>
<text x="40" y="476" font-size="13" font-weight="bold" fill="#1c4b73">3. The same idea in the other two tools</text>
<rect x="40" y="488" width="280" height="64" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="52" y="508" font-size="13" font-weight="bold" fill="#1c4b73">Maven</text>
<text x="52" y="526" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#222222">src/main/java to target/classes</text>
<text x="52" y="542" font-size="11" fill="#555555">the layout is the default of the super POM</text>
<rect x="340" y="488" width="280" height="64" fill="#e9f5e9" stroke="#2e7d32"/>
<text x="352" y="508" font-size="13" font-weight="bold" fill="#1b5e20">Gradle</text>
<text x="352" y="526" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#222222">src/main/java to build/classes/java/main</text>
<text x="352" y="542" font-size="11" fill="#555555">the java plugin sets the same source layout</text>
<rect x="640" y="488" width="280" height="64" fill="#fff4e0" stroke="#a65e00"/>
<text x="652" y="508" font-size="13" font-weight="bold" fill="#7a4500">Ant</text>
<text x="652" y="526" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#222222">no layout built in</text>
<text x="652" y="542" font-size="11" fill="#555555">src/ and build/ by convention, spelled out in build.xml</text>
</svg>
