<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Setting up one texture: bind-to-edit versus direct state access</text>
<rect x="20" y="50" width="350" height="330" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="390" y="50" width="350" height="330" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195" y="74" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Bind-to-edit (GL 2.0 to 4.4)</text>
<text x="565" y="74" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Direct state access (GL 4.5)</text>
<text x="32" y="100" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">GLuint tex;</text>
<text x="32" y="117" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glGenTextures(1, &amp;tex);</text>
<text x="32" y="134" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glActiveTexture(GL_TEXTURE0);</text>
<text x="32" y="151" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glBindTexture(GL_TEXTURE_2D, tex);</text>
<text x="32" y="168" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTexStorage2D(GL_TEXTURE_2D, 4,</text>
<text x="32" y="185" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_RGBA8, w, h);</text>
<text x="32" y="202" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTexSubImage2D(GL_TEXTURE_2D, 0,</text>
<text x="32" y="219" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    0, 0, w, h, GL_RGBA,</text>
<text x="32" y="236" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_UNSIGNED_BYTE, px);</text>
<text x="32" y="253" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glGenerateMipmap(GL_TEXTURE_2D);</text>
<text x="32" y="270" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTexParameteri(GL_TEXTURE_2D,</text>
<text x="32" y="287" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_TEXTURE_MIN_FILTER,</text>
<text x="32" y="304" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_LINEAR_MIPMAP_LINEAR);</text>
<text x="402" y="100" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">GLuint tex;</text>
<text x="402" y="117" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glCreateTextures(GL_TEXTURE_2D, 1, &amp;tex);</text>
<text x="402" y="134" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace"></text>
<text x="402" y="151" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace"></text>
<text x="402" y="168" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTextureStorage2D(tex, 4,</text>
<text x="402" y="185" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_RGBA8, w, h);</text>
<text x="402" y="202" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTextureSubImage2D(tex, 0,</text>
<text x="402" y="219" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    0, 0, w, h, GL_RGBA,</text>
<text x="402" y="236" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_UNSIGNED_BYTE, px);</text>
<text x="402" y="253" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glGenerateTextureMipmap(tex);</text>
<text x="402" y="270" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glTextureParameteri(tex,</text>
<text x="402" y="287" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_TEXTURE_MIN_FILTER,</text>
<text x="402" y="304" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">    GL_LINEAR_MIPMAP_LINEAR);</text>
<rect x="28" y="121" width="334" height="38" rx="4" fill="none" stroke="#B45309" stroke-width="1.5"/>
<text x="195" y="340" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">the boxed calls change global state: unit 0 now holds tex</text>
<text x="195" y="360" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">2 of 7 calls only select the object; later calls depend on them</text>
<text x="565" y="360" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">each call names its object; nothing else changes</text>
</svg>
