<title id="popularity-vs-growth-zoom-t">Popularity vs 10-year growth, zoom on languages below 4%</title>
<desc id="popularity-vs-growth-zoom-d">Zoom of the popularity vs growth chart on the 22 languages with a TIOBE rating below 4% in October 2026: rating against the change since June 2016, in percentage points, coloured by editorial group. Labels that would overlap are omitted: hover a point for its name. TIOBE Index monthly series, retrieved 2026-10-26.</desc>
