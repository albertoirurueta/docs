  <text x="50" y="80" font-size="15" font-weight="bold" fill="#3730A3">UX: research, flows, content, behaviour, outcomes</text>
  <rect x="60" y="100" width="190" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="155" y="124" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Understand</text>
