<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pages Router fallback modes compared with the App Router dynamicParams option</title>
  <desc id="d">Three columns show what happens on the first request for a path that was not built at next build time. With fallback false the path returns a 404. With fallback true the browser receives a fallback page with empty props at once, the page is generated in the background and swapped in, and the next request is served from the cache. With fallback blocking the server renders the page while the visitor waits and caches it as static HTML. A bottom band maps these to the App Router: dynamicParams false, dynamicParams true (the default) and the App Shell with Cache Components and partial prefetching. Under Cache Components dynamicParams is not available and generateStaticParams must return at least one parameter.</desc>
  <defs>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a2b2b"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a5b00"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b36"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A path that was not built: three ways to answer it</text>
  <text x="450" y="47" font-size="12" fill="#555555" text-anchor="middle">getStaticPaths fallback (Pages Router) and its App Router counterpart</text>
  <rect x="30" y="64" width="270" height="52" fill="#9a2b2b"/>
  <text x="165.0" y="86" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">fallback: false</text>
  <text x="165.0" y="105" font-size="11" fill="#ffffff" text-anchor="middle">dynamicParams = false</text>
  <rect x="30" y="140" width="270" height="64" fill="#fbeaea" stroke="#9a2b2b" stroke-width="1.6"/>
  <text x="42" y="166" font-size="13.5" font-weight="bold" fill="#5c1414">1. Request /books/3</text>
  <text x="42" y="187" font-size="11" fill="#333333">not returned by getStaticPaths</text>
  <line x1="165.0" y1="204" x2="165.0" y2="226" stroke="#9a2b2b" stroke-width="1.8" marker-end="url(#ar-r)"/>
  <rect x="30" y="228" width="270" height="64" fill="#fbeaea" stroke="#9a2b2b" stroke-width="1.6"/>
  <text x="42" y="254" font-size="13.5" font-weight="bold" fill="#5c1414">2. 404 page</text>
  <text x="42" y="275" font-size="11" fill="#333333">no data function runs, nothing is cached</text>
  <line x1="165.0" y1="292" x2="165.0" y2="314" stroke="#9a2b2b" stroke-width="1.8" marker-end="url(#ar-r)"/>
  <rect x="30" y="316" width="270" height="64" fill="#fbeaea" stroke="#9a2b2b" stroke-width="1.6"/>
  <text x="42" y="342" font-size="13.5" font-weight="bold" fill="#5c1414">3. A new book appears</text>
  <text x="42" y="363" font-size="11" fill="#333333">only a new next build adds /books/3</text>
  <rect x="315" y="64" width="270" height="52" fill="#9a5b00"/>
  <text x="450.0" y="86" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">fallback: true</text>
  <text x="450.0" y="105" font-size="11" fill="#ffffff" text-anchor="middle">closest App Router match: App Shell (16.3)</text>
  <rect x="315" y="140" width="270" height="64" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="327" y="166" font-size="13.5" font-weight="bold" fill="#5c3500">1. Request /books/3</text>
  <text x="327" y="187" font-size="11" fill="#333333">browsers and next/link: not built yet</text>
  <line x1="450.0" y1="204" x2="450.0" y2="226" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-o)"/>
  <rect x="315" y="228" width="270" height="64" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="327" y="254" font-size="13.5" font-weight="bold" fill="#5c3500">2. Fallback HTML at once</text>
  <text x="327" y="275" font-size="11" fill="#333333">props are empty, router.isFallback is true</text>
  <line x1="450.0" y1="292" x2="450.0" y2="314" stroke="#9a5b00" stroke-width="1.8" marker-end="url(#ar-o)"/>
  <rect x="315" y="316" width="270" height="64" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="327" y="342" font-size="13.5" font-weight="bold" fill="#5c3500">3. Built in the background</text>
  <text x="327" y="363" font-size="11" fill="#333333">JSON arrives, page swaps; next request is a HIT</text>
  <rect x="600" y="64" width="270" height="52" fill="#1e6b36"/>
  <text x="735.0" y="86" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">fallback: 'blocking'</text>
  <text x="735.0" y="105" font-size="11" fill="#ffffff" text-anchor="middle">dynamicParams = true (the default)</text>
  <rect x="600" y="140" width="270" height="64" fill="#e8f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="612" y="166" font-size="13.5" font-weight="bold" fill="#0f3d1f">1. Request /books/3</text>
  <text x="612" y="187" font-size="11" fill="#333333">not built yet</text>
  <line x1="735.0" y1="204" x2="735.0" y2="226" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="600" y="228" width="270" height="64" fill="#e8f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="612" y="254" font-size="13.5" font-weight="bold" fill="#0f3d1f">2. Server renders, user waits</text>
  <text x="612" y="275" font-size="11" fill="#333333">like SSR, no loading flash</text>
  <line x1="735.0" y1="292" x2="735.0" y2="314" stroke="#1e6b36" stroke-width="1.8" marker-end="url(#ar-g)"/>
  <rect x="600" y="316" width="270" height="64" fill="#e8f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="612" y="342" font-size="13.5" font-weight="bold" fill="#0f3d1f">3. Cached as static HTML</text>
  <text x="612" y="363" font-size="11" fill="#333333">next request is a HIT; unknown ids: 404</text>
  <rect x="30" y="406" width="270" height="30" fill="#ffffff" stroke="#9a2b2b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="165.0" y="426" font-size="12" font-weight="bold" fill="#9a2b2b" text-anchor="middle">measured: 404</text>
  <rect x="315" y="406" width="270" height="30" fill="#ffffff" stroke="#9a5b00" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="450.0" y="426" font-size="12" font-weight="bold" fill="#9a5b00" text-anchor="middle">measured: 200 fallback, then 200 page</text>
  <rect x="600" y="406" width="270" height="30" fill="#ffffff" stroke="#1e6b36" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="735.0" y="426" font-size="12" font-weight="bold" fill="#1e6b36" text-anchor="middle">measured: 200 MISS, then 200 HIT</text>
  <rect x="30" y="452" width="840" height="90" fill="#eef2f8" stroke="#34506f" stroke-width="1.4"/>
  <text x="450" y="474" font-size="13" font-weight="bold" fill="#1d3250" text-anchor="middle">App Router: one option, export const dynamicParams (default true)</text>
  <text x="450" y="494" font-size="12" fill="#333333" text-anchor="middle">false = 404 for unlisted params; true = generated on the first request and cached (the blocking behaviour).</text>
  <text x="450" y="512" font-size="12" fill="#333333" text-anchor="middle">With cacheComponents: true, dynamicParams is rejected at build time and generateStaticParams</text>
  <text x="450" y="530" font-size="12" fill="#333333" text-anchor="middle">must return at least one param; unlisted params get the App Shell (with partialPrefetching, 16.3).</text>
</svg>
