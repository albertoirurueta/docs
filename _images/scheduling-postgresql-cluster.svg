<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three Bookshelf nodes, one PostgreSQL database: the database is the only coordinator</text>
  <defs>
    <marker id="pc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="pc-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- ============ nodes ============ -->
  <text x="190" y="62" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Three JVMs, same scheduler name "BookshelfCluster"</text>

  <!-- node A -->
  <rect x="20" y="76" width="340" height="132" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="98" font-size="13" font-weight="bold" fill="#222222">Node A   instanceId = host + epoch ms (AUTO)</text>
  <rect x="34" y="108" width="150" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="125" font-size="11" fill="#333333" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="109" y="140" font-size="10.5" fill="#666666" text-anchor="middle">acquires one trigger at a time</text>
  <rect x="194" y="108" width="152" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="125" font-size="11" fill="#333333" text-anchor="middle">worker threads (3)</text>
  <text x="270" y="140" font-size="10.5" fill="#666666" text-anchor="middle">run the jobs, then complete</text>
  <rect x="34" y="158" width="150" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="174" font-size="11" fill="#333333" text-anchor="middle">ClusterManager</text>
  <text x="109" y="188" font-size="10.5" fill="#666666" text-anchor="middle">check-in every 2000 ms</text>
  <rect x="194" y="158" width="152" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="174" font-size="11" fill="#333333" text-anchor="middle">Hikari pool</text>
  <text x="270" y="188" font-size="10.5" fill="#666666" text-anchor="middle">role quartz</text>

  <!-- node B -->
  <rect x="20" y="222" width="340" height="132" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="244" font-size="13" font-weight="bold" fill="#222222">Node B</text>
  <rect x="34" y="254" width="150" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="271" font-size="11" fill="#333333" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="109" y="286" font-size="10.5" fill="#666666" text-anchor="middle">same loop, same SQL</text>
  <rect x="194" y="254" width="152" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="271" font-size="11" fill="#333333" text-anchor="middle">worker threads (3)</text>
  <text x="270" y="286" font-size="10.5" fill="#666666" text-anchor="middle">first come, first served</text>
  <rect x="34" y="304" width="150" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="320" font-size="11" fill="#333333" text-anchor="middle">ClusterManager</text>
  <text x="109" y="334" font-size="10.5" fill="#666666" text-anchor="middle">check-in every 2000 ms</text>
  <rect x="194" y="304" width="152" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="320" font-size="11" fill="#333333" text-anchor="middle">Hikari pool</text>
  <text x="270" y="334" font-size="10.5" fill="#666666" text-anchor="middle">role quartz</text>

  <!-- node C -->
  <rect x="20" y="368" width="340" height="132" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="34" y="390" font-size="13" font-weight="bold" fill="#222222">Node C</text>
  <rect x="34" y="400" width="150" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="417" font-size="11" fill="#333333" text-anchor="middle">QuartzSchedulerThread</text>
  <text x="109" y="432" font-size="10.5" fill="#666666" text-anchor="middle">may stay idle for a whole run</text>
  <rect x="194" y="400" width="152" height="42" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="417" font-size="11" fill="#333333" text-anchor="middle">worker threads (3)</text>
  <text x="270" y="432" font-size="10.5" fill="#666666" text-anchor="middle">no load balancing</text>
  <rect x="34" y="450" width="150" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="109" y="466" font-size="11" fill="#333333" text-anchor="middle">ClusterManager</text>
  <text x="109" y="480" font-size="10.5" fill="#666666" text-anchor="middle">check-in every 2000 ms</text>
  <rect x="194" y="450" width="152" height="38" rx="5" fill="#ffffff" stroke="#a8641a"/>
  <text x="270" y="466" font-size="11" fill="#333333" text-anchor="middle">Hikari pool</text>
  <text x="270" y="480" font-size="10.5" fill="#666666" text-anchor="middle">role quartz</text>

  <!-- arrows nodes -> database -->
  <line x1="360" y1="142" x2="470" y2="200" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pc-arrow)"/>
  <line x1="360" y1="288" x2="470" y2="288" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pc-arrow)"/>
  <line x1="360" y1="434" x2="470" y2="376" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pc-arrow)"/>
  <text x="415" y="246" font-size="10.5" fill="#1c4b73" text-anchor="middle">JDBC</text>
  <text x="415" y="260" font-size="10.5" fill="#1c4b73" text-anchor="middle">currentSchema</text>
  <text x="415" y="274" font-size="10.5" fill="#1c4b73" text-anchor="middle">=quartz</text>

  <!-- red: no node-to-node traffic -->
  <path d="M24,516 L24,534 L356,534 L356,516" fill="none" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#pc-arrow-red)"/>
  <text x="190" y="552" font-size="11.5" fill="#b3261e" text-anchor="middle">no node talks to another node: no port, no discovery,</text>
  <text x="190" y="567" font-size="11.5" fill="#b3261e" text-anchor="middle">no leader; a node's death is seen only as missing check-ins</text>

  <!-- ============ database ============ -->
  <rect x="470" y="62" width="510" height="454" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="485" y="84" font-size="13.5" font-weight="bold" fill="#1c4b73">PostgreSQL 17, database "bookshelf"</text>
  <text x="485" y="101" font-size="11" fill="#444444">schema "quartz" owned by role quartz, search_path = quartz, nothing granted to PUBLIC</text>

  <rect x="486" y="112" width="478" height="86" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="500" y="132" font-size="12" font-weight="bold" fill="#222222">QRTZ_LOCKS   (two rows per scheduler name, created on first use)</text>
  <text x="500" y="150" font-size="11" fill="#444444">TRIGGER_ACCESS: SELECT ... FOR UPDATE in every "triggers fired" and "job complete"</text>
  <text x="500" y="165" font-size="11" fill="#444444">transaction, in recovery, and for inserts (lockOnInsert=true)</text>
  <text x="500" y="182" font-size="11" fill="#444444">STATE_ACCESS: first check-in and failure recovery. The rows are never updated.</text>

  <rect x="486" y="208" width="478" height="62" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="500" y="228" font-size="12" font-weight="bold" fill="#222222">QRTZ_SCHEDULER_STATE   (one row per live node)</text>
  <text x="500" y="246" font-size="11" fill="#444444">UPDATE LAST_CHECKIN_TIME every 2000 ms, no lock in the normal case.</text>
  <text x="500" y="261" font-size="11" fill="#444444">A row whose check-in is older than interval + 7500 ms marks a dead node.</text>

  <rect x="486" y="280" width="478" height="76" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="500" y="300" font-size="12" font-weight="bold" fill="#222222">QRTZ_TRIGGERS   (the schedule)</text>
  <text x="500" y="318" font-size="11" fill="#444444">UPDATE to 'ACQUIRED' WHERE state = 'WAITING' is the race: the node whose</text>
  <text x="500" y="333" font-size="11" fill="#444444">update changes one row owns the trigger, the others change zero rows.</text>
  <text x="500" y="348" font-size="11" fill="#444444">Updated about twice per firing, on indexed columns, so never a HOT update.</text>

  <rect x="486" y="366" width="478" height="76" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="500" y="386" font-size="12" font-weight="bold" fill="#222222">QRTZ_FIRED_TRIGGERS   (what is running, and who runs it)</text>
  <text x="500" y="404" font-size="11" fill="#444444">INSERT (ACQUIRED), UPDATE (EXECUTING), DELETE (complete): the churn table.</text>
  <text x="500" y="419" font-size="11" fill="#444444">After a crash its rows name the dead node, which is how a survivor knows</text>
  <text x="500" y="434" font-size="11" fill="#444444">what to free or to re-run (REQUESTS_RECOVERY).</text>

  <rect x="486" y="452" width="478" height="52" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
  <text x="500" y="469" font-size="11" fill="#444444">Also in the schema: QRTZ_JOB_DETAILS, QRTZ_CRON_TRIGGERS,</text>
  <text x="500" y="484" font-size="11" fill="#444444">QRTZ_SIMPLE_TRIGGERS, QRTZ_SIMPROP_TRIGGERS, QRTZ_BLOB_TRIGGERS,</text>
  <text x="500" y="499" font-size="11" fill="#444444">QRTZ_CALENDARS, QRTZ_PAUSED_TRIGGER_GRPS</text>

  <!-- failover note -->
  <rect x="470" y="528" width="510" height="76" rx="6" fill="#fff6f5" stroke="#b3261e" stroke-dasharray="6,4"/>
  <text x="485" y="548" font-size="12" font-weight="bold" fill="#b3261e">kill -9 on a node, measured on this setup</text>
  <text x="485" y="566" font-size="11" fill="#444444">Its rows stay behind. The first survivor that notices locks STATE_ACCESS and TRIGGER_ACCESS,</text>
  <text x="485" y="581" font-size="11" fill="#444444">frees the acquired triggers, stores a recovery trigger for each REQUESTS_RECOVERY job,</text>
  <text x="485" y="596" font-size="11" fill="#444444">deletes the dead node's rows. The job ran again 8.1 to 10.2 s after the kill (five runs).</text>
</svg>
