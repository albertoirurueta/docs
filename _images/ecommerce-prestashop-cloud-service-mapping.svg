<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">PrestaShop tiers on AWS, Google Cloud and Azure</title>
  <desc id="d">A grid with one row per tier of the PrestaShop cloud architecture and one column per provider. Kubernetes: Amazon EKS, GKE, AKS. Container registry: ECR, Artifact Registry, Azure Container Registry. Load balancer and CDN: Application Load Balancer with CloudFront, Cloud Load Balancing with Cloud CDN, Application Gateway or Front Door. MySQL: RDS for MySQL 8.4 or Aurora MySQL, Cloud SQL for MySQL, Azure Database for MySQL Flexible Server. Shared file volume for img, upload and download: Amazon EFS, Filestore, Azure Files. PHP sessions: ElastiCache for Valkey, Memorystore, Azure Managed Redis. SQL cache: ElastiCache for Memcached, Memorystore for Memcached, a self-run Memcached because Azure has no managed Memcached service. Secrets: Secrets Manager, Secret Manager, Key Vault. Pod identity: EKS Pod Identity, Workload Identity Federation for GKE, Microsoft Entra Workload ID.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">The same tiers on three clouds</text>
  <rect x="30" y="52" width="150" height="34" rx="6" fill="#33485c"/>
  <text x="105" y="74" font-size="13" font-weight="bold" fill="#f4b860" text-anchor="middle">Tier</text>
  <rect x="190" y="52" width="240" height="34" rx="6" fill="#7a5c3a"/>
  <text x="310" y="74" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">AWS (walkthrough)</text>
  <rect x="440" y="52" width="240" height="34" rx="6" fill="#3f6e9a"/>
  <text x="560" y="74" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Google Cloud</text>
  <rect x="690" y="52" width="240" height="34" rx="6" fill="#4d7c5a"/>
  <text x="810" y="74" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Azure</text>

  <g font-size="12" fill="#f2f5f8">
    <rect x="30" y="94" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="119" text-anchor="middle" font-weight="bold">Kubernetes</text>
    <rect x="190" y="94" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="119" text-anchor="middle">Amazon EKS</text>
    <rect x="440" y="94" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="119" text-anchor="middle">GKE</text>
    <rect x="690" y="94" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="119" text-anchor="middle">AKS</text>

    <rect x="30" y="140" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="165" text-anchor="middle" font-weight="bold">Image registry</text>
    <rect x="190" y="140" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="165" text-anchor="middle">Amazon ECR</text>
    <rect x="440" y="140" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="165" text-anchor="middle">Artifact Registry</text>
    <rect x="690" y="140" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="165" text-anchor="middle">Azure Container Registry</text>

    <rect x="30" y="186" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="211" text-anchor="middle" font-weight="bold">Load balancer, CDN</text>
    <rect x="190" y="186" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="211" text-anchor="middle">ALB + CloudFront + WAF</text>
    <rect x="440" y="186" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="211" text-anchor="middle">Cloud Load Balancing + CDN + Armor</text>
    <rect x="690" y="186" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="211" text-anchor="middle">Application Gateway or Front Door</text>

    <rect x="30" y="232" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="257" text-anchor="middle" font-weight="bold">MySQL</text>
    <rect x="190" y="232" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="257" text-anchor="middle">RDS for MySQL 8.4, Aurora MySQL</text>
    <rect x="440" y="232" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="257" text-anchor="middle">Cloud SQL for MySQL</text>
    <rect x="690" y="232" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="257" text-anchor="middle">Azure Database for MySQL, Flexible</text>

    <rect x="30" y="278" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="303" text-anchor="middle" font-weight="bold">Shared img/ upload/</text>
    <rect x="190" y="278" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="303" text-anchor="middle">Amazon EFS (access point)</text>
    <rect x="440" y="278" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="303" text-anchor="middle">Filestore</text>
    <rect x="690" y="278" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="303" text-anchor="middle">Azure Files (NFS)</text>

    <rect x="30" y="324" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="349" text-anchor="middle" font-weight="bold">PHP sessions</text>
    <rect x="190" y="324" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="349" text-anchor="middle">ElastiCache for Valkey</text>
    <rect x="440" y="324" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="349" text-anchor="middle">Memorystore</text>
    <rect x="690" y="324" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="349" text-anchor="middle">Azure Managed Redis</text>

    <rect x="30" y="370" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="395" text-anchor="middle" font-weight="bold">SQL cache</text>
    <rect x="190" y="370" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="395" text-anchor="middle">ElastiCache for Memcached</text>
    <rect x="440" y="370" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="395" text-anchor="middle">Memorystore for Memcached</text>
    <rect x="690" y="370" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="395" text-anchor="middle">Memcached you run yourself</text>

    <rect x="30" y="416" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="441" text-anchor="middle" font-weight="bold">Secrets</text>
    <rect x="190" y="416" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="441" text-anchor="middle">Secrets Manager</text>
    <rect x="440" y="416" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="441" text-anchor="middle">Secret Manager</text>
    <rect x="690" y="416" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="441" text-anchor="middle">Key Vault</text>

    <rect x="30" y="462" width="150" height="40" rx="6" fill="#3d5266"/><text x="105" y="487" text-anchor="middle" font-weight="bold">Identity of a pod</text>
    <rect x="190" y="462" width="240" height="40" rx="6" fill="#34495e"/><text x="310" y="487" text-anchor="middle">EKS Pod Identity</text>
    <rect x="440" y="462" width="240" height="40" rx="6" fill="#34495e"/><text x="560" y="487" text-anchor="middle">Workload Identity Federation</text>
    <rect x="690" y="462" width="240" height="40" rx="6" fill="#34495e"/><text x="810" y="487" text-anchor="middle">Microsoft Entra Workload ID</text>
  </g>
  <text x="30" y="530" font-size="12" fill="#9fd3c7">PrestaShop core has no Redis or Valkey cache backend: Valkey holds the PHP sessions, Memcached holds the SQL cache.</text>
  <text x="30" y="548" font-size="12" fill="#f4b860">Azure Database for MariaDB was retired on 2025-09-19, so MySQL is the managed choice on Azure.</text>
</svg>
