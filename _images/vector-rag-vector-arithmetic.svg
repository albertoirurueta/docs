<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Vector arithmetic: king − man + woman ≈ queen</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">A 2-D sketch of the relationship a Word2Vec-style embedding space encodes</text>

  <rect x="60" y="70" width="640" height="300" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>

  <!-- origin reference point (not drawn as a real origin, just a layout anchor) -->
  <!-- king -->
  <circle cx="470" cy="150" r="5" fill="#1c4b73"/>
  <text x="480" y="146" font-size="12.5" font-weight="bold" fill="#1c4b73">king</text>

  <!-- man -->
  <circle cx="470" cy="280" r="5" fill="#7a3b12"/>
  <text x="480" y="296" font-size="12.5" font-weight="bold" fill="#7a3b12">man</text>

  <!-- woman -->
  <circle cx="200" cy="280" r="5" fill="#2f5424"/>
  <text x="150" y="296" font-size="12.5" font-weight="bold" fill="#2f5424">woman</text>

  <!-- queen (result) -->
  <circle cx="200" cy="150" r="5" fill="#8a2a2a"/>
  <text x="150" y="146" font-size="12.5" font-weight="bold" fill="#8a2a2a">queen</text>

  <!-- king -> man : the "royal" axis (vertical) -->
  <line x1="470" y1="150" x2="470" y2="280" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="500" y="220" font-size="10.5" fill="#1c4b73" transform="rotate(90 500 220)">royalty axis</text>

  <!-- woman -> queen : the same "royal" axis, parallel, starting from woman -->
  <line x1="200" y1="280" x2="200" y2="150" stroke="#8a2a2a" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- man -> woman : the "gender" axis (horizontal), and king -> queen the same axis -->
  <line x1="470" y1="280" x2="200" y2="280" stroke="#7a3b12" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="335" y="300" font-size="10.5" fill="#7a3b12" text-anchor="middle">gender axis</text>

  <line x1="470" y1="150" x2="200" y2="150" stroke="#555555" stroke-width="1" stroke-dasharray="2,3"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a2a2a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a3b12"/>
    </marker>
  </defs>

  <text x="380" y="400" font-size="11.5" fill="#333333" text-anchor="middle">vector("king") − vector("man") + vector("woman") lands closest to vector("queen") in a well-trained Word2Vec space</text>
</svg>
