<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">PlaceCard's Accessibility Tree</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">One grouped accessible element, plus a custom action reaching the nested favourite toggle</text>

  <defs>
    <marker id="at-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- PlaceCard mock-up -->
  <rect x="60" y="90" width="260" height="150" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="190" y="108" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">PlaceCard (Pressable)</text>

  <!-- photo box -->
  <rect x="76" y="120" width="56" height="56" rx="6" fill="#d8e6f3" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="104" y="152" font-size="9" fill="#1c4b73" text-anchor="middle">photo</text>

  <!-- name / category -->
  <text x="142" y="136" font-size="12" font-weight="bold" fill="#222222">Eiffel Tower</text>
  <text x="142" y="154" font-size="11" fill="#555555">Landmark</text>

  <!-- star toggle -->
  <rect x="256" y="118" width="46" height="40" rx="6" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="279" y="145" font-size="18" fill="#8a5a1c" text-anchor="middle">&#9733;</text>
  <text x="279" y="172" font-size="9" fill="#8a5a1c" text-anchor="middle">favourite</text>

  <!-- card-level callout -->
  <rect x="76" y="196" width="228" height="34" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="190" y="209" font-size="9" fill="#1c4b73" text-anchor="middle">accessible={true}, accessibilityRole=button</text>
  <text x="190" y="221" font-size="9" fill="#1c4b73" text-anchor="middle">accessibilityLabel: '&lt;name&gt;, &lt;category&gt;'</text>

  <line x1="190" y1="90" x2="190" y2="60" stroke="#1c4b73" stroke-width="1.2" marker-end="url(#at-arrow)"/>

  <!-- annotation column: whole card -->
  <rect x="360" y="70" width="360" height="70" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="540" y="90" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Whole card: one accessible element</text>
  <text x="540" y="108" font-size="10" fill="#333333" text-anchor="middle">accessible={true} hides photo/name/category/star as</text>
  <text x="540" y="122" font-size="10" fill="#333333" text-anchor="middle">separate stops; the group reads its own composed label.</text>

  <line x1="304" y1="203" x2="358" y2="105" stroke="#2d6a34" stroke-width="1.3" marker-end="url(#at-arrow)"/>

  <!-- annotation: star toggle -->
  <rect x="360" y="160" width="360" height="70" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="540" y="180" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">Favourite star: its own control</text>
  <text x="540" y="198" font-size="10" fill="#333333" text-anchor="middle">accessibilityRole=button</text>
  <text x="540" y="212" font-size="10" fill="#333333" text-anchor="middle">accessibilityState={selected}</text>

  <line x1="302" y1="138" x2="358" y2="188" stroke="#a33" stroke-width="1.3" marker-end="url(#at-arrow)"/>

  <!-- annotation: custom action -->
  <rect x="360" y="250" width="360" height="86" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="540" y="270" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Reachable without leaving the card</text>
  <text x="540" y="288" font-size="10" fill="#333333" text-anchor="middle">A custom accessibilityAction ("Toggle favourite") on the</text>
  <text x="540" y="302" font-size="10" fill="#333333" text-anchor="middle">outer card lets a screen reader user toggle favourite status</text>
  <text x="540" y="316" font-size="10" fill="#333333" text-anchor="middle">without navigating to the nested star Pressable separately.</text>

  <line x1="190" y1="240" x2="190" y2="270" stroke="#8a5a1c" stroke-width="1.3"/>
  <line x1="190" y1="270" x2="358" y2="293" stroke="#8a5a1c" stroke-width="1.3" marker-end="url(#at-arrow)"/>

  <text x="390" y="460" font-size="10.5" fill="#666666" text-anchor="middle">A screen reader's swipe navigation stops once on the whole card, announcing its composed label and role;</text>
  <text x="390" y="474" font-size="10.5" fill="#666666" text-anchor="middle">the favourite toggle remains reachable both as a nested control and as a custom action on the card itself.</text>
</svg>
