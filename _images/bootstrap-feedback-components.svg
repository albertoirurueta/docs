<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>

  <!-- panel 1: alert -->
  <rect x="10" y="10" width="180" height="220" fill="#fafafa" stroke="#8a8f96" stroke-width="1.5"/>
  <rect x="20" y="20" width="160" height="30" fill="#d3ead6" stroke="#3f8f4f" stroke-width="1.5"/>
  <text x="100" y="40" font-size="11" fill="#2a6636" text-anchor="middle">alert message</text>
  <line x1="20" y1="66" x2="180" y2="66" stroke="#dddddd" stroke-width="6"/>
  <line x1="20" y1="82" x2="180" y2="82" stroke="#dddddd" stroke-width="6"/>
  <line x1="20" y1="98" x2="140" y2="98" stroke="#dddddd" stroke-width="6"/>
  <text x="100" y="248" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Alert</text>
  <text x="100" y="264" font-size="10" fill="#666666" text-anchor="middle">inline, in document flow</text>

  <!-- panel 2: modal -->
  <rect x="210" y="10" width="180" height="220" fill="#e9ecef" stroke="#8a8f96" stroke-width="1.5"/>
  <rect x="210" y="10" width="180" height="220" fill="#212529" opacity="0.45"/>
  <rect x="240" y="70" width="120" height="100" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="2"/>
  <line x1="250" y1="90" x2="350" y2="90" stroke="#2f6fa8" stroke-width="2"/>
  <text x="300" y="86" font-size="10" fill="#1c4b73" text-anchor="middle">modal-header</text>
  <line x1="250" y1="120" x2="350" y2="120" stroke="#cfe4fb" stroke-width="6"/>
  <line x1="250" y1="134" x2="330" y2="134" stroke="#cfe4fb" stroke-width="6"/>
  <rect x="250" y="150" width="46" height="14" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="1"/>
  <text x="300" y="248" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Modal</text>
  <text x="300" y="264" font-size="10" fill="#666666" text-anchor="middle">centered overlay, blocks page</text>

  <!-- panel 3: toast -->
  <rect x="410" y="10" width="180" height="220" fill="#fafafa" stroke="#8a8f96" stroke-width="1.5"/>
  <rect x="470" y="170" width="110" height="50" rx="4" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <line x1="478" y1="184" x2="530" y2="184" stroke="#8a5a10" stroke-width="1"/>
  <text x="504" y="181" font-size="9" fill="#6b4207" text-anchor="middle">toast-header</text>
  <text x="504" y="202" font-size="9" fill="#6b4207" text-anchor="middle">toast-body text</text>
  <text x="500" y="248" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Toast</text>
  <text x="500" y="264" font-size="10" fill="#666666" text-anchor="middle">corner notification, non-blocking</text>
</svg>
