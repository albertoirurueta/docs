<text x="376" y="119" text-anchor="middle" font-size="10" fill="#6B7280">stage VERTEX</text>
<line x1="440" y1="78" x2="458" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="458" y="55" width="128" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="522.0" y="82.2" text-anchor="middle" font-size="12" fill="#92400E">Tessellation</text>
<text x="522" y="119" text-anchor="middle" font-size="10" fill="#6B7280">stages TESS_CONTROL</text>
<text x="522" y="132" text-anchor="middle" font-size="10" fill="#6B7280">and TESS_EVAL</text>
<line x1="586" y1="78" x2="604" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="604" y="55" width="128" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="668.0" y="82.2" text-anchor="middle" font-size="12" fill="#92400E">Geometry</text>
<text x="668" y="119" text-anchor="middle" font-size="10" fill="#6B7280">stage GEOMETRY</text>
<rect x="20" y="180" width="128" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="84.0" y="207.2" text-anchor="middle" font-size="12" fill="#374151">Viewport and clip</text>
<text x="84" y="244" text-anchor="middle" font-size="10" fill="#6B7280">ViewportState</text>
<line x1="148" y1="203" x2="166" y2="203" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="166" y="180" width="128" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
