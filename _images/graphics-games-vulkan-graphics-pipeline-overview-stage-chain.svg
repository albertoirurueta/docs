<rect x="604" y="180" width="128" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="668.0" y="207.2" text-anchor="middle" font-size="12" fill="#374151">Colour blend</text>
<text x="668" y="244" text-anchor="middle" font-size="10" fill="#6B7280">ColorBlendState</text>
<path d="M 676 78 L 676 108 L 84 108 L 84 168" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="20" y="300" width="340" height="86" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="324.4" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Colour code</text>
<text x="190.0" y="339.4" text-anchor="middle" font-size="11" fill="#374151">Indigo: programmable stages (SPIR-V entry points).</text>
<text x="190.0" y="354.4" text-anchor="middle" font-size="11" fill="#374151">Grey: fixed-function state baked into the pipeline.</text>
<text x="190.0" y="369.4" text-anchor="middle" font-size="11" fill="#374151">Amber: optional stages that need a feature.</text>
<rect x="380" y="300" width="360" height="86" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="324.4" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Dynamic state and attachments</text>
<text x="560.0" y="339.4" text-anchor="middle" font-size="11" fill="#065F46">Viewport, scissor, cull mode and more can be dynamic.</text>
<text x="560.0" y="354.4" text-anchor="middle" font-size="11" fill="#065F46">Attachment formats come from</text>
<text x="560.0" y="369.4" text-anchor="middle" font-size="11" fill="#065F46">VkPipelineRenderingCreateInfo in pNext.</text>
</svg>
