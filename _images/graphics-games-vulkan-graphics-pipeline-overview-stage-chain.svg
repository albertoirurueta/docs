<text x="230" y="244" text-anchor="middle" font-size="10" fill="#6B7280">RasterizationState</text>
<text x="230" y="257" text-anchor="middle" font-size="10" fill="#6B7280">and MultisampleState</text>
<line x1="294" y1="203" x2="312" y2="203" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="312" y="180" width="128" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="376.0" y="207.2" text-anchor="middle" font-size="12" fill="#3730A3">Fragment shader</text>
<text x="376" y="244" text-anchor="middle" font-size="10" fill="#6B7280">stage FRAGMENT</text>
<line x1="440" y1="203" x2="458" y2="203" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-stages)"/>
<rect x="458" y="180" width="128" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
