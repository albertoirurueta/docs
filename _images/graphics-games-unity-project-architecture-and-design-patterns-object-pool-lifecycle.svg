<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-arch-pool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">ObjectPool lifecycle for the falling books</text>
<rect x="30" y="80" width="200" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="118.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Pool</text>
<text x="130.0" y="134.0" text-anchor="middle" font-size="12" fill="#3730A3">inactive books waiting</text>
<text x="130.0" y="150.0" text-anchor="middle" font-size="12" fill="#3730A3">(stack inside ObjectPool&lt;T&gt;)</text>
<rect x="280" y="80" width="200" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="118.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">In use</text>
<text x="380.0" y="134.0" text-anchor="middle" font-size="12" fill="#1F2937">book active, falling,</text>
<text x="380.0" y="150.0" text-anchor="middle" font-size="12" fill="#1F2937">visible, simulated</text>
<rect x="530" y="80" width="200" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="118.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Done</text>
<text x="630.0" y="134.0" text-anchor="middle" font-size="12" fill="#92400E">book hits the floor</text>
<text x="630.0" y="150.0" text-anchor="middle" font-size="12" fill="#92400E">or is caught</text>
<line x1="230" y1="115" x2="280" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-pool)"/>
<text x="255" y="105" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Get()</text>
<line x1="480" y1="130" x2="530" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-pool)"/>
<text x="505" y="120" text-anchor="middle" font-size="10" fill="#374151">play</text>
<line x1="630" y1="180" x2="630" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-pool)"/>
<line x1="630" y1="235" x2="130" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-pool)"/>
<line x1="130" y1="235" x2="130" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-pool)"/>
<text x="380" y="228" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Release(book)</text>
<rect x="30" y="255" width="220" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="278.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Four callbacks</text>
<text x="140.0" y="293.5" text-anchor="middle" font-size="11" fill="#374151">createFunc: Instantiate the prefab</text>
<text x="140.0" y="308.5" text-anchor="middle" font-size="11" fill="#374151">actionOnGet: SetActive(true)</text>
<text x="140.0" y="323.5" text-anchor="middle" font-size="11" fill="#374151">actionOnRelease: SetActive(false)</text>
<text x="140.0" y="338.5" text-anchor="middle" font-size="11" fill="#374151">actionOnDestroy: Destroy</text>
<rect x="280" y="255" width="200" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="286.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sizing</text>
<text x="380.0" y="301.0" text-anchor="middle" font-size="11" fill="#374151">defaultCapacity: 20</text>
<text x="380.0" y="316.0" text-anchor="middle" font-size="11" fill="#374151">maxSize: 64</text>
<text x="380.0" y="331.0" text-anchor="middle" font-size="11" fill="#374151">collectionCheck: true (Editor)</text>
<rect x="510" y="255" width="230" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="625.0" y="286.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Overflow</text>
<text x="625.0" y="301.0" text-anchor="middle" font-size="11" fill="#374151">Over maxSize, Release calls</text>
<text x="625.0" y="316.0" text-anchor="middle" font-size="11" fill="#374151">actionOnDestroy instead of</text>
<text x="625.0" y="331.0" text-anchor="middle" font-size="11" fill="#374151">keeping the instance.</text>
</svg>
