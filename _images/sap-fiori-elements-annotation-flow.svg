<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">SAP Fiori elements: annotations in a CAP or RAP service become the pages of an app</title>
  <desc id="d">A CAP model with UI annotations or an ABAP RAP service with metadata extensions is served as OData V4. The service metadata document carries the annotations. SAP Fiori elements reads that document in the browser and generates the pages: the list report with a filter bar and a table, the object page with header and sections, and further floorplans such as the worklist, the analytical list page and the overview page. The app itself holds only a manifest file that names the floorplans.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="300" height="96" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="53" text-anchor="middle" font-size="15" font-weight="bold">CAP service</text>
  <text x="170" y="73" text-anchor="middle" font-size="13">annotate ... with @(UI: {...})</text>
  <text x="170" y="93" text-anchor="middle" font-size="13">in app/*.cds</text>
  <rect x="20" y="140" width="300" height="96" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="173" text-anchor="middle" font-size="15" font-weight="bold">RAP service</text>
  <text x="170" y="193" text-anchor="middle" font-size="13">@UI annotations in a</text>
  <text x="170" y="213" text-anchor="middle" font-size="13">metadata extension (DDLX)</text>
  <line x1="320" y1="68" x2="380" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="188" x2="380" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="380" y="100" width="280" height="76" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="133" text-anchor="middle" font-size="15" font-weight="bold">OData V4 service</text>
  <text x="520" y="153" text-anchor="middle" font-size="13">$metadata carries the annotations</text>
  <line x1="660" y1="138" x2="720" y2="138" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="720" y="90" width="300" height="96" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="870" y="123" text-anchor="middle" font-size="15" font-weight="bold">SAP Fiori elements</text>
  <text x="870" y="143" text-anchor="middle" font-size="13">reads $metadata in the browser</text>
  <text x="870" y="163" text-anchor="middle" font-size="13">and builds the pages</text>
  <line x1="870" y1="186" x2="870" y2="248" stroke="currentColor" stroke-width="1.5"/>
  <line x1="135" y1="248" x2="895" y2="248" stroke="currentColor" stroke-width="1.5"/>
  <line x1="135" y1="248" x2="135" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="248" x2="385" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="635" y1="248" x2="635" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="895" y1="248" x2="895" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="260" width="230" height="90" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="290.5" text-anchor="middle" font-size="14" font-weight="bold">List report</text>
  <text x="135" y="309.5" text-anchor="middle" font-size="12">filter bar and table</text>
  <text x="135" y="328.5" text-anchor="middle" font-size="12">@UI.LineItem</text>
  <rect x="270" y="260" width="230" height="90" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="385" y="290.5" text-anchor="middle" font-size="14" font-weight="bold">Object page</text>
  <text x="385" y="309.5" text-anchor="middle" font-size="12">header and sections</text>
  <text x="385" y="328.5" text-anchor="middle" font-size="12">@UI.Facets</text>
  <rect x="520" y="260" width="230" height="90" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="635" y="290.5" text-anchor="middle" font-size="14" font-weight="bold">Worklist</text>
  <text x="635" y="309.5" text-anchor="middle" font-size="12">list report without</text>
  <text x="635" y="328.5" text-anchor="middle" font-size="12">a filter bar</text>
  <rect x="770" y="260" width="250" height="90" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="895" y="290.5" text-anchor="middle" font-size="14" font-weight="bold">Analytical list page</text>
  <text x="895" y="309.5" text-anchor="middle" font-size="12">charts and table</text>
  <text x="895" y="328.5" text-anchor="middle" font-size="12">with KPIs</text>
  <rect x="20" y="370" width="480" height="80" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="395.5" text-anchor="middle" font-size="14" font-weight="bold">Overview page</text>
  <text x="260" y="414.5" text-anchor="middle" font-size="12">role-based cards; documented in the</text>
  <text x="260" y="433.5" text-anchor="middle" font-size="12">OData V2 part of the SAPUI5 docs</text>
  <rect x="520" y="370" width="500" height="80" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="770" y="395.5" text-anchor="middle" font-size="14" font-weight="bold">manifest.json</text>
  <text x="770" y="414.5" text-anchor="middle" font-size="12">names the floorplans, the service and the</text>
  <text x="770" y="433.5" text-anchor="middle" font-size="12">few settings the annotations cannot hold</text>
</svg>
