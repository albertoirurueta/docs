<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Uniform quantisation grid</title>
  <desc id="d">A number line of evenly spaced integer levels. A floating-point value divided by the scale s equals 2.4 and rounds to level 2 with an error of 0.4 s. Below, two boxes contrast a narrow value range, which gives a small scale and small error, with a range stretched by an outlier, which gives a large scale and larger error everywhere.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#BE123C"/></marker></defs>
  <rect x="1" y="1" width="718" height="348" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">Rounding onto an integer grid</text>
  
<line x1="60" y1="138" x2="60" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="60" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-6</text>  <line x1="110" y1="138" x2="110" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="110" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-5</text>  <line x1="160" y1="138" x2="160" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="160" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-4</text>  <line x1="210" y1="138" x2="210" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="210" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-3</text>  <line x1="260" y1="138" x2="260" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="260" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-2</text>  <line x1="310" y1="138" x2="310" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="310" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">-1</text>  <line x1="360" y1="138" x2="360" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="360" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">0</text>  <line x1="410" y1="138" x2="410" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="410" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">1</text>  <line x1="460" y1="138" x2="460" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="460" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">2</text>  <line x1="510" y1="138" x2="510" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="510" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">3</text>  <line x1="560" y1="138" x2="560" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="560" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">4</text>  <line x1="610" y1="138" x2="610" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="610" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">5</text>  <line x1="660" y1="138" x2="660" y2="162" stroke="#0F766E" stroke-width="2"/>  <text x="660" y="182" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0F172A">6</text>  <line x1="50" y1="150" x2="670" y2="150" stroke="#94A3B8" stroke-width="2"/>  <circle cx="480" cy="150" r="7" fill="#B45309" stroke="#B45309"/>  <text x="480" y="112" font-size="13" text-anchor="middle" fill="#B45309" font-weight="bold">x / s = 2.4</text>  <line x1="480" y1="118" x2="480" y2="140" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>  <path d="M480,200 L460,200" stroke="#BE123C" stroke-width="2"/>  <path d="M480,200 L460,200" stroke="#BE123C" stroke-width="2" marker-end="url(#ar)"/>  <text x="470" y="222" font-size="12" text-anchor="middle" fill="#BE123C">round to 2</text>  <text x="470" y="240" font-size="12" text-anchor="middle" fill="#BE123C">error 0.4 s</text>  <text x="360" y="262" font-size="12" text-anchor="middle" fill="#475569">integer levels q (here a signed grid, only -6 to 6 drawn); dequantised value = q * s</text>  <rect x="60" y="282" width="290" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>  <text x="205" y="302" font-size="12" text-anchor="middle" fill="#0F172A">small outlier-free range</text><text x="205" y="318" font-size="12" text-anchor="middle" fill="#0F172A">small s, small error</text>  <rect x="370" y="282" width="290" height="46" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>  <text x="515" y="302" font-size="12" text-anchor="middle" fill="#0F172A">one outlier stretches the range</text><text x="515" y="318" font-size="12" text-anchor="middle" fill="#0F172A">large s, every value loses precision</text>
</svg>
