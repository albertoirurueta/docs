  <rect x="620" y="286" width="240" height="26" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="740" y="303" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">BDC /TH MCID 3 ... 5</text>
  <line x1="500" y1="299" x2="620" y2="299" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ts-arrow)"/>
  <rect x="620" y="354" width="240" height="26" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="740" y="371" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">BDC /TD MCID 6 ... 11</text>
  <line x1="500" y1="367" x2="620" y2="367" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ts-arrow)"/>
  <rect x="620" y="422" width="240" height="26" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="740" y="439" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">BDC /Link MCID 12</text>
  <line x1="500" y1="435" x2="620" y2="435" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ts-arrow)"/>
  <rect x="620" y="456" width="240" height="26" rx="4" fill="#fff1dc" stroke="#b36b00"/>
  <text x="740" y="473" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/Artifact BMC (no tag)</text>
  <text x="740" y="500" text-anchor="middle" font-size="11" fill="#7a4800">footers, rules, decoration</text>
  <rect x="20" y="534" width="860" height="52" rx="8" fill="#fff1dc" stroke="#b36b00" stroke-width="1.6"/>
  <text x="36" y="556" font-size="12" fill="#333">Every piece of real content in the stream is wrapped in marked content with an MCID that one structure element owns;</text>
  <text x="36" y="574" font-size="12" fill="#333">everything else must be marked as an Artifact. A validator walks the tree and checks both directions.</text>
</svg>
