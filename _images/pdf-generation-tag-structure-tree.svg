  <path d="M86,414 L86,435 L108,435" fill="none" stroke="#1f5fa6" stroke-width="1.2"/>
  <text x="180" y="99" font-size="11" fill="#444">root: language en-US, title from PdfUAConfig</text>
  <text x="214" y="133" font-size="11" fill="#444">heading level 1</text>
  <text x="214" y="167" font-size="11" fill="#444">Alt: Bookshelf logo, a blue rectangle</text>
  <text x="214" y="201" font-size="11" fill="#444">paragraph with three text spans</text>
  <text x="214" y="235" font-size="11" fill="#444">one table</text>
  <text x="238" y="269" font-size="11" fill="#444">header row</text>
  <text x="282" y="303" font-size="11" fill="#444">Scope = Column</text>
  <text x="282" y="371" font-size="11" fill="#444">data cells</text>
  <text x="248" y="439" font-size="11" fill="#444">Contents: Terms of sale</text>
