<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1c4b73"/></marker></defs>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Linearization of a class that mixes in traits</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">class D extends A, B, C, where B and C both extend A, as run on Scala 3.10.0</text>
<text x="30" y="90" font-size="13" font-weight="bold" fill="#222222">Declared hierarchy</text>
<rect x="110" y="110" width="110" height="36" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="165" y="133" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">trait A</text>
<rect x="40" y="200" width="110" height="36" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="95" y="223" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">trait B</text>
<rect x="180" y="200" width="110" height="36" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="235" y="223" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">trait C</text>
<rect x="110" y="290" width="110" height="36" rx="4" fill="#fff4e0" stroke="#a35a00" stroke-width="1.4"/>
<text x="165" y="313" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">class D</text>
<line x1="120" y1="200" x2="150" y2="148" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="210" y1="200" x2="180" y2="148" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="140" y1="290" x2="105" y2="238" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="190" y1="290" x2="225" y2="238" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="330" y="90" font-size="13" font-weight="bold" fill="#222222">Linearization of D: the order in which super calls are resolved</text>
<rect x="340" y="110" width="130" height="40" rx="4" fill="#fff4e0" stroke="#a35a00" stroke-width="1.4"/>
<text x="405" y="135" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">D</text>
<rect x="500" y="110" width="130" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="565" y="135" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">C</text>
<rect x="660" y="110" width="130" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="725" y="135" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">B</text>
<rect x="820" y="110" width="110" height="40" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
<text x="875" y="135" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">A</text>
<line x1="470" y1="130" x2="498" y2="130" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="630" y1="130" x2="658" y2="130" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="790" y1="130" x2="818" y2="130" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="405" y="172" font-size="11" fill="#666666" text-anchor="middle">super in D</text>
<text x="565" y="172" font-size="11" fill="#666666" text-anchor="middle">super in C</text>
<text x="725" y="172" font-size="11" fill="#666666" text-anchor="middle">super in B</text>
<text x="875" y="172" font-size="11" fill="#666666" text-anchor="middle">end of the chain</text>
<text x="340" y="215" font-size="13" font-weight="bold" fill="#222222">Initialization runs the other way</text>
<rect x="340" y="230" width="130" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
<text x="405" y="255" font-size="13" fill="#222222" text-anchor="middle">1. A</text>
<rect x="500" y="230" width="130" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
<text x="565" y="255" font-size="13" fill="#222222" text-anchor="middle">2. B</text>
<rect x="660" y="230" width="130" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
<text x="725" y="255" font-size="13" fill="#222222" text-anchor="middle">3. C</text>
<rect x="820" y="230" width="110" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
<text x="875" y="255" font-size="13" fill="#222222" text-anchor="middle">4. D</text>
<text x="340" y="310" font-size="12" fill="#444444">A.who is reached last, so D.who returns "D&gt;C&gt;B&gt;A". Declaring extends A, C, B instead reverses the middle</text>
<text x="340" y="328" font-size="12" fill="#444444">and gives "E&gt;B&gt;C&gt;A". Each trait appears once, however many paths lead to it.</text>
</svg>
