<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Where to resample in cross-validation</title>
<desc id="d">Resampling the whole dataset before splitting puts synthetic copies of the same sample in both train and validation folds and inflates the score; resampling inside an imbalanced-learn pipeline touches only the training part of each fold.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Resample inside each fold, never before the split</text>
<text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#BE123C">Wrong</text>
<rect x="24" y="78" width="130" height="44" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="89" y="105" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SMOTE (all data)</text>
<line x1="154" y1="100" x2="204" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="208" y="78" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="273" y="105" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">split into folds</text>
<line x1="338" y1="100" x2="388" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="392" y="78" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="457" y="105" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">fit / score</text>
<text x="540" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C">synthetic neighbours of a</text>
<text x="540" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C">validation sample are in train</text>
<text x="24" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F766E">Right</text>
<rect x="24" y="182" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="89" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">split into folds</text>
<line x1="154" y1="204" x2="204" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="208" y="182" width="130" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="273" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SMOTE (train)</text>
<line x1="338" y1="204" x2="388" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="392" y="182" width="130" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="457" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">fit estimator</text>
<text x="540" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F766E">validation fold is scored</text>
<text x="540" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F766E">untouched, at the true ratio</text>
<text x="360" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">imblearn.pipeline.Pipeline applies samplers during fit only, so cross_val_score does this correctly</text>
</svg>
