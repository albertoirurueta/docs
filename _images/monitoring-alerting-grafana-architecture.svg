<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Grafana architecture: data sources feed data source plugins in the Grafana server, which turns query results into data frames, applies transformations and sends them to panels in the browser; the alerting engine evaluates rules and sends notifications; a database with unified storage holds dashboards, folders and settings</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Grafana server: from data source to panel, and from rule to notification</text>
<text x="480" y="44" font-size="10.5" fill="#555555" text-anchor="middle">Backends stay outside Grafana; the server queries them on demand and stores only its own configuration</text>

<text x="110" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Backends</text>
<text x="500" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Grafana server (one Go process)</text>
<text x="860" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Consumers</text>

<rect x="15" y="90" width="190" height="320" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<rect x="30" y="105" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="129" font-size="11" fill="#222222" text-anchor="middle">Prometheus or Mimir</text>
<rect x="30" y="153" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="177" font-size="11" fill="#222222" text-anchor="middle">Loki (logs)</text>
<rect x="30" y="201" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="225" font-size="11" fill="#222222" text-anchor="middle">Tempo (traces)</text>
<rect x="30" y="249" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="273" font-size="11" fill="#222222" text-anchor="middle">Pyroscope (profiles)</text>
<rect x="30" y="297" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="321" font-size="11" fill="#222222" text-anchor="middle">Elasticsearch</text>
<rect x="30" y="345" width="160" height="38" rx="6" fill="#ffffff" stroke="#9e9e9e"/><text x="110" y="369" font-size="11" fill="#222222" text-anchor="middle">PostgreSQL (SQL)</text>

<rect x="245" y="90" width="500" height="430" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>

<rect x="265" y="105" width="460" height="34" rx="6" fill="#ffffff" stroke="#1976d2"/>
<text x="495" y="126" font-size="11" fill="#222222" text-anchor="middle">HTTP API: /api (legacy, deprecated in 13) and /apis (resource API)</text>

<rect x="265" y="152" width="210" height="150" rx="8" fill="#ffffff" stroke="#1976d2"/>
<text x="370" y="172" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Data path</text>
<text x="370" y="194" font-size="10.5" fill="#222222" text-anchor="middle">1. Data source plugin</text>
<text x="370" y="212" font-size="10.5" fill="#222222" text-anchor="middle">2. Query (PromQL, LogQL, SQL)</text>
<text x="370" y="230" font-size="10.5" fill="#222222" text-anchor="middle">3. Data frames</text>
<text x="370" y="248" font-size="10.5" fill="#222222" text-anchor="middle">4. Expressions (alerting)</text>
<text x="370" y="266" font-size="10.5" fill="#222222" text-anchor="middle">5. Transformations (panels)</text>
<text x="370" y="288" font-size="10" fill="#555555" text-anchor="middle">panel and app plugins add UI</text>

<rect x="495" y="152" width="230" height="150" rx="8" fill="#ffffff" stroke="#1976d2"/>
<text x="610" y="172" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Alerting engine</text>
<text x="610" y="194" font-size="10.5" fill="#222222" text-anchor="middle">Scheduler evaluates rules</text>
<text x="610" y="212" font-size="10.5" fill="#222222" text-anchor="middle">Alert instances and states</text>
<text x="610" y="230" font-size="10.5" fill="#222222" text-anchor="middle">Embedded Alertmanager</text>
<text x="610" y="248" font-size="10.5" fill="#222222" text-anchor="middle">Policies, contact points</text>
<text x="610" y="270" font-size="10" fill="#555555" text-anchor="middle">same queries as panels</text>

<rect x="265" y="320" width="460" height="86" rx="8" fill="#ffffff" stroke="#1976d2"/>
<text x="495" y="340" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Provisioning, auth and permissions</text>
<text x="495" y="362" font-size="10.5" fill="#222222" text-anchor="middle">YAML files at startup, Terraform, Git Sync; orgs, teams, roles, service accounts</text>
<text x="495" y="380" font-size="10.5" fill="#222222" text-anchor="middle">Internal metrics at /metrics; logs to console and file</text>

<rect x="265" y="422" width="460" height="82" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="495" y="444" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Database</text>
<text x="495" y="464" font-size="10.5" fill="#222222" text-anchor="middle">SQLite (default), MySQL or PostgreSQL</text>
<text x="495" y="482" font-size="10.5" fill="#222222" text-anchor="middle">Dashboards and folders live in unified storage since 13.0</text>
<text x="495" y="498" font-size="10" fill="#555555" text-anchor="middle">Shared database is required for high availability</text>

<rect x="765" y="105" width="180" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="855" y="130" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
<text x="855" y="148" font-size="10" fill="#555555" text-anchor="middle">dashboards, Explore, panels</text>
<rect x="765" y="190" width="180" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="855" y="215" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Notification targets</text>
<text x="855" y="233" font-size="10" fill="#555555" text-anchor="middle">webhook, e-mail, chat, paging</text>
<rect x="765" y="275" width="180" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="855" y="300" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Automation</text>
<text x="855" y="318" font-size="10" fill="#555555" text-anchor="middle">Terraform, CLI, CI, Git</text>
<rect x="765" y="360" width="180" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="855" y="385" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Prometheus</text>
<text x="855" y="403" font-size="10" fill="#555555" text-anchor="middle">scrapes Grafana /metrics</text>

<line x1="205" y1="250" x2="262" y2="228" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="745" y1="136" x2="763" y2="136" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="725" y1="221" x2="763" y2="221" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="763" y1="306" x2="747" y2="340" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="763" y1="391" x2="747" y2="391" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="495" y1="406" x2="495" y2="420" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
