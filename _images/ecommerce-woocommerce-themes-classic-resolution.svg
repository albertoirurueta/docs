<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a classic theme resolves WooCommerce templates</title>
  <desc id="d">Two columns. The left column lists, in order, the files WooCommerce looks for when a classic theme renders a single product page: files added by the woocommerce_template_loader_files filter, woocommerce.php, the page template, single-product followed by the product slug, and the default single-product.php, each also searched in the woocommerce subfolder, before the file shipped in the plugin templates folder. The right column shows how a template part such as single-product/meta.php is located: the woocommerce folder of the child theme, the woocommerce folder of the parent theme, the same paths without the folder, and finally the plugin. A final box compares the version in the override header with the version in the core file and reports the override as outdated when it is lower.</desc>
  <rect x="0" y="0" width="960" height="620" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Classic theme: template loader and template parts</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Order taken from WC_Template_Loader and wc_locate_template() in WooCommerce 11.2.1</text>

  <text x="40" y="98" font-size="13" font-weight="bold" fill="#f4b860">1  The page file (single product /product/themes-test-kit/)</text>
  <g font-size="12" fill="#f2f5f8">
    <rect x="40" y="110" width="410" height="34" rx="5" fill="#3d5266"/>
    <text x="52" y="132">files from the woocommerce_template_loader_files filter</text>
    <rect x="40" y="152" width="410" height="34" rx="5" fill="#3d5266"/>
    <text x="52" y="174">woocommerce.php (wins over everything below)</text>
    <rect x="40" y="194" width="410" height="34" rx="5" fill="#3d5266"/>
    <text x="52" y="216">the page template slug, when the page selects one</text>
    <rect x="40" y="236" width="410" height="34" rx="5" fill="#3d5266"/>
    <text x="52" y="258">single-product-themes-test-kit.php</text>
    <rect x="40" y="278" width="410" height="34" rx="5" fill="#3d5266"/>
    <text x="52" y="300">single-product.php, then woocommerce/single-product.php</text>
    <rect x="40" y="320" width="410" height="34" rx="5" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
    <text x="52" y="342">WooCommerce: templates/single-product.php</text>
  </g>
  <g stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M245 144 L245 150"/>
    <path d="M245 186 L245 192"/>
    <path d="M245 228 L245 234"/>
    <path d="M245 270 L245 276"/>
    <path d="M245 312 L245 318"/>
  </g>
  <text x="40" y="378" font-size="12" fill="#f2f5f8">Each name is searched in the child theme first, then in the parent theme.</text>
  <text x="40" y="396" font-size="12" fill="#f2f5f8">Archives and categories use archive-product.php and taxonomy-product-cat.php.</text>

  <text x="500" y="98" font-size="13" font-weight="bold" fill="#f4b860">2  A template part (single-product/meta.php)</text>
  <g font-size="11.5" fill="#f2f5f8">
    <rect x="500" y="110" width="420" height="34" rx="5" fill="#3d5266"/>
    <text x="512" y="132">child/woocommerce/single-product/meta.php</text>
    <rect x="500" y="152" width="420" height="34" rx="5" fill="#3d5266"/>
    <text x="512" y="174">parent/woocommerce/single-product/meta.php</text>
    <rect x="500" y="194" width="420" height="34" rx="5" fill="#3d5266"/>
    <text x="512" y="216">child/single-product/meta.php, then parent/single-product/meta.php</text>
    <rect x="500" y="236" width="420" height="34" rx="5" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
    <text x="512" y="258">WooCommerce: templates/single-product/meta.php</text>
  </g>
  <g stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M710 144 L710 150"/>
    <path d="M710 186 L710 192"/>
    <path d="M710 228 L710 234"/>
  </g>

  <rect x="500" y="296" width="420" height="152" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="514" y="320" font-weight="bold">3  Version check (WooCommerce &gt; Status)</text>
    <text x="514" y="344">override header:   @version 9.7.0</text>
    <text x="514" y="364">core file header:  @version 11.2.0</text>
    <text x="514" y="388" fill="#f4b860" font-weight="bold">9.7.0 &lt; 11.2.0, so the override is outdated</text>
    <text x="514" y="410">has_outdated_templates = true in the system status</text>
    <text x="514" y="430">The override still loads; nothing is merged for you.</text>
  </g>
  <path d="M710 270 L710 294" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <g font-size="12.5" fill="#f2f5f8">
    <text x="40" y="478" font-weight="bold" fill="#f4b860">Why overrides break</text>
    <text x="40" y="500">A copy freezes the markup of one release. When core adds a filter, an argument or an accessibility fix to the template, the copy keeps the old code</text>
    <text x="40" y="520">and the version header is the only signal. The 11.2.0 meta.php added the woocommerce_product_meta_category_orderby filter that the old copy lacks.</text>
    <text x="40" y="552" font-weight="bold" fill="#f4b860">Safer first choice</text>
    <text x="40" y="574">Use an action or filter hook from the page file; override a template only when the markup itself must change, and keep the override small.</text>
  </g>
</svg>
