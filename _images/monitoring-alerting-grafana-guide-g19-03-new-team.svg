<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="monitoring-alerting-grafana-guide-g19-03-new-team-title" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="monitoring-alerting-grafana-guide-g19-03-new-team-title">New team form: the field Name holds guide-team (callout 10), the Team folder option Auto-create a team folder is switched off (callout 11) and the Create button is marked by callout 12</title>
<g><rect x="0" y="0" width="1080" height="520" fill="#111217" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><g><rect x="0" y="0" width="1080" height="48" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><text x="16" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Administration</text><text x="118.01" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">/</text><text x="132.01" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Users and access</text><text x="257.94" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">/</text><text x="271.94" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Teams</text><text x="325.3" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">/</text><text x="339.3" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#CCCCDC">New team</text></g>
<text x="16" y="104" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#CCCCDC">New team</text>
<text x="16" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Create a new team. Teams let you grant permissions to a group of users.</text>
<g><text x="16" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CCCCDC">Name *</text><rect x="16" y="170" width="480" height="32" rx="6" fill="#111217" stroke="rgba(204,204,220,0.2)" stroke-width="1"/><text x="26" y="190.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">guide-team</text></g>
<g><text x="16" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CCCCDC">Email</text><rect x="16" y="238" width="480" height="32" rx="6" fill="#111217" stroke="rgba(204,204,220,0.2)" stroke-width="1"/><text x="16" y="286" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">This is optional and is primarily used for allowing custom team avatars</text></g>
<text x="16" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#CCCCDC">Team folder</text>
<text x="16" y="354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">This creates a folder associated with the team, where users can add resources like dashboards and schedules with the right permissions.</text>
