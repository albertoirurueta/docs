<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Antora attribute precedence</title>
  <desc id="d">Three layers, the playbook, the component descriptor and the page header, each able to override the next only when the value is soft set or soft unset.</desc>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="15" fill="#f2f5f8">
    <rect x="30" y="50" width="200" height="110" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="130" y="80" text-anchor="middle" font-weight="bold">Playbook</text>
    <text x="130" y="104" text-anchor="middle" font-size="13">asciidoc.attributes</text>
    <text x="130" y="126" text-anchor="middle" font-size="13">site attributes</text>
    <text x="130" y="146" text-anchor="middle" font-size="12">strongest layer</text>

    <rect x="280" y="50" width="200" height="110" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="380" y="80" text-anchor="middle" font-weight="bold">antora.yml</text>
    <text x="380" y="104" text-anchor="middle" font-size="13">asciidoc.attributes</text>
    <text x="380" y="126" text-anchor="middle" font-size="13">component version attributes</text>
    <text x="380" y="146" text-anchor="middle" font-size="12">one set per version</text>

    <rect x="530" y="50" width="200" height="110" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="630" y="80" text-anchor="middle" font-weight="bold">Page header</text>
    <text x="630" y="104" text-anchor="middle" font-size="13">:name: value</text>
    <text x="630" y="126" text-anchor="middle" font-size="13">page attributes</text>
    <text x="630" y="146" text-anchor="middle" font-size="12">weakest layer</text>

    <line x1="232" y1="105" x2="276" y2="105" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="482" y1="105" x2="526" y2="105" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g fill="#f2f5f8" font-size="14">
    <text x="30" y="205" font-weight="bold">What a lower layer may do with a value set above it</text>
    <text x="30" y="232">value: x  (hard set)</text><text x="300" y="232">locked, cannot be changed or unset</text>
    <text x="30" y="256">value: x@  (soft set)</text><text x="300" y="256">can be replaced or unset by the next layer</text>
    <text x="30" y="280">~  (hard unset)</text><text x="300" y="280">locked unset, cannot be set again</text>
    <text x="30" y="304">false  (soft unset)</text><text x="300" y="304">the next layer may set it</text>
  </g>
</svg>
