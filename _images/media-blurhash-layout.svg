<text x="828.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">j</text>
<line x1="282" y1="50" x2="282" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="338" y1="50" x2="338" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="394" y1="50" x2="394" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="450" y1="50" x2="450" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="506" y1="50" x2="506" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="562" y1="50" x2="562" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="618" y1="50" x2="618" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="674" y1="50" x2="674" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="730" y1="50" x2="730" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="786" y1="50" x2="786" y2="94" stroke="#7b3fb5" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="60" y="116" width="14" height="14" fill="#b36b00"/>
<text x="84" y="128" font-size="13" font-weight="700" fill="#b36b00">Size flag  (1 character)</text>
<text x="84" y="146" font-size="12" fill="#333">(n_x - 1) + 9 (n_y - 1) = 3 + 18 = 21, which is "L"; decodes to 4 x 3 components</text>
<rect x="60" y="164" width="14" height="14" fill="#1f5fa6"/>
<text x="84" y="176" font-size="13" font-weight="700" fill="#1f5fa6">Maximum AC value  (1 character)</text>
<text x="84" y="194" font-size="12" fill="#333">q_max in 0..82; M = (q_max + 1) / 166 (here "E" = 14, M = 0.0904)</text>
<rect x="60" y="212" width="14" height="14" fill="#2b7a2b"/>
<text x="84" y="224" font-size="13" font-weight="700" fill="#2b7a2b">DC  (4 characters)</text>
<text x="84" y="242" font-size="12" fill="#333">24-bit sRGB average colour (R shifted left 16) + (G shifted left 8) + B</text>
<rect x="60" y="260" width="14" height="14" fill="#7b3fb5"/>
<text x="84" y="272" font-size="13" font-weight="700" fill="#7b3fb5">AC components, 11 of them  (2 characters each)</text>
<text x="84" y="290" font-size="12" fill="#333">19 levels per channel, 19^2 q_R + 19 q_G + q_B, base 83 two digits</text>
<text x="450" y="254" text-anchor="middle" font-size="12" fill="#555">Length = 4 + 2 n_x n_y = 4 + 2 x 12 = 28. Alphabet: 83 characters, 0-9 A-Z a-z then #$%*+,-.:;=?@[]^_{|}~</text>
</svg>
