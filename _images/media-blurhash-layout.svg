<text x="436.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">y</text>
<text x="464.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">o</text>
<text x="492.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">0</text>
<text x="520.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">a</text>
<text x="548.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">d</text>
<text x="576.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">R</text>
<text x="604.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">*</text>
<text x="632.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">.</text>
<text x="660.0" y="80" text-anchor="middle" font-size="20" font-family="Courier New, monospace" font-weight="700" fill="#1a1a1a">7</text>
