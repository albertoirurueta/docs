<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Entity identity vs. value equality in the running domain</text>

  <!-- Left half: Order entity, identity-based equality -->
  <text x="195" y="58" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order -- entity, identity-based equality</text>

  <rect x="45" y="80" width="180" height="86" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="135" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order (t1)</text>
  <text x="135" y="122" font-size="10" fill="#333333" text-anchor="middle">OrderId = 7f3a...</text>
  <text x="135" y="138" font-size="10" fill="#333333" text-anchor="middle">status = PENDING</text>
  <text x="135" y="154" font-size="9" fill="#666666" text-anchor="middle">reference A</text>

  <rect x="165" y="200" width="180" height="86" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="255" y="224" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order (t2)</text>
  <text x="255" y="242" font-size="10" fill="#333333" text-anchor="middle">OrderId = 7f3a...</text>
  <text x="255" y="258" font-size="10" fill="#333333" text-anchor="middle">status = APPROVED</text>
  <text x="255" y="274" font-size="9" fill="#666666" text-anchor="middle">reference B (different instance)</text>

  <line x1="180" y1="166" x2="220" y2="200" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="245" y="185" font-size="9.5" fill="#1c4b73" text-anchor="middle">equal --</text>
  <text x="270" y="197" font-size="9.5" fill="#1c4b73" text-anchor="middle">same OrderId</text>

  <rect x="55" y="310" width="290" height="60" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="200" y="332" font-size="10.5" fill="#333333" text-anchor="middle">Different reference, different status,</text>
  <text x="200" y="348" font-size="10.5" fill="#333333" text-anchor="middle">but considered the same Order --</text>
  <text x="200" y="363" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">equality keyed on OrderId alone</text>

  <!-- divider -->
  <line x1="390" y1="55" x2="390" y2="400" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="4,4"/>

  <!-- Right half: Money value object, attribute-based equality -->
  <text x="585" y="58" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Money -- value object, attribute equality</text>

  <rect x="435" y="80" width="180" height="76" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="525" y="106" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Money</text>
  <text x="525" y="124" font-size="10" fill="#333333" text-anchor="middle">amount = 10, currency = USD</text>
  <text x="525" y="140" font-size="9" fill="#666666" text-anchor="middle">instance A -- no identity</text>

  <rect x="555" y="190" width="180" height="76" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2"/>
  <text x="645" y="216" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Money</text>
  <text x="645" y="234" font-size="10" fill="#333333" text-anchor="middle">amount = 10, currency = USD</text>
  <text x="645" y="250" font-size="9" fill="#666666" text-anchor="middle">instance B -- no identity</text>

  <line x1="560" y1="156" x2="600" y2="190" stroke="#2d6a34" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="618" y="175" font-size="9.5" fill="#2d6a34" text-anchor="middle">equal --</text>
  <text x="648" y="187" font-size="9.5" fill="#2d6a34" text-anchor="middle">same attributes</text>

  <rect x="440" y="300" width="290" height="70" rx="8" fill="#f4f4f4" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="585" y="322" font-size="10.5" fill="#333333" text-anchor="middle">Separately constructed, no identifier</text>
  <text x="585" y="338" font-size="10.5" fill="#333333" text-anchor="middle">at all, yet interchangeable --</text>
  <text x="585" y="353" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">equality keyed on amount + currency</text>

  <text x="390" y="425" font-size="10.5" fill="#444444" text-anchor="middle">Two Order snapshots with the same OrderId are the same order despite a different status and a different</text>
  <text x="390" y="440" font-size="10.5" fill="#444444" text-anchor="middle">object reference; two Money(10, USD) instances are equal purely because their attributes match.</text>
</svg>
