<text x="649.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">round 5</text>
<rect x="80" y="338" width="20" height="16" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="108" y="351" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start">candidates still in the race (n_candidates_)</text>
<rect x="420" y="338" width="20" height="16" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
<text x="448" y="351" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start">resource per candidate (n_resources_)</text>
<text x="80" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The search stops at the first round that evaluates factor (here 2) candidates or fewer.</text>
</svg>
