<rect x="614" y="294.57142857142856" width="33.0" height="5.428571428571429" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="651.0" y="110.0" width="33.0" height="190.0" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
