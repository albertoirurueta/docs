<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img">
<title>Successive halving with factor 2</title>
<desc>Six rounds starting with 70 candidates and 3 resources each. Every round doubles the resource per candidate and keeps half of the candidates: 70, 35, 17, 8, 4, 2 candidates with 3, 6, 12, 24, 48, 96 resources.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Successive halving: min_resources=3, factor=2, 70 candidates</text>
<line x1="70" y1="300" x2="690" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="70" y1="300" x2="70" y2="60" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="94" y="110.0" width="33.0" height="190.0" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="131.0" y="294.0625" width="33.0" height="5.9375" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="110.5" y="104.0" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">70</text>
<text x="147.5" y="288.0625" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">3</text>
<text x="129.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">round 0</text>
<rect x="198" y="205.0" width="33.0" height="95.0" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="235.0" y="288.125" width="33.0" height="11.875" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="214.5" y="199.0" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">35</text>
<text x="251.5" y="282.125" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">6</text>
<text x="233.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">round 1</text>
<rect x="302" y="253.85714285714286" width="33.0" height="46.142857142857146" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="339.0" y="276.25" width="33.0" height="23.75" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="318.5" y="247.85714285714286" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">17</text>
<text x="355.5" y="270.25" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">12</text>
<text x="337.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">round 2</text>
<rect x="406" y="278.2857142857143" width="33.0" height="21.714285714285715" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="443.0" y="252.5" width="33.0" height="47.5" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="422.5" y="272.2857142857143" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">8</text>
<text x="459.5" y="246.5" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">24</text>
<text x="441.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">round 3</text>
