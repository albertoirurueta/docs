<title id="t">DBSCAN core, border and noise points</title>
<desc id="d">A cloud of points with eps circles. Core points have at least min_samples neighbours inside the circle, border points lie inside a core point's circle but have too few neighbours themselves, and noise points have no core point within eps.</desc>
