<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vid-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Decode one frame: from bitstream to a sampled image</text>
<rect x="20" y="70" width="170" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="98.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Bitstream</text>
<text x="105.0" y="113.8" text-anchor="middle" font-size="11" fill="#92400E">compressed data in</text>
<text x="105.0" y="128.8" text-anchor="middle" font-size="11" fill="#92400E">a video buffer</text>
<rect x="200" y="70" width="170" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="98.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Decode queue</text>
<text x="285.0" y="113.8" text-anchor="middle" font-size="11" fill="#3730A3">vkCmdDecodeVideoKHR</text>
<text x="285.0" y="128.8" text-anchor="middle" font-size="11" fill="#3730A3">inside Begin / End</text>
<rect x="380" y="70" width="170" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="98.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Decoded image</text>
<text x="465.0" y="113.8" text-anchor="middle" font-size="11" fill="#065F46">DPB slot or separate</text>
<text x="465.0" y="128.8" text-anchor="middle" font-size="11" fill="#065F46">output image</text>
<rect x="560" y="70" width="170" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="98.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Graphics queue</text>
<text x="645.0" y="113.8" text-anchor="middle" font-size="11" fill="#3730A3">sample it like any</text>
<text x="645.0" y="128.8" text-anchor="middle" font-size="11" fill="#3730A3">texture (NV12-style)</text>
<line x1="190" y1="110" x2="200" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<line x1="370" y1="110" x2="380" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<line x1="550" y1="110" x2="560" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<rect x="200" y="200" width="170" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="224.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Semaphore signal</text>
<text x="285.0" y="239.3" text-anchor="middle" font-size="11" fill="#374151">timeline or binary</text>
<line x1="285" y1="150" x2="285" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<line x1="370" y1="228" x2="645" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<line x1="645" y1="228" x2="645" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-flow)"/>
<rect x="20" y="200" width="160" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="100.0" y="224.3" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Reference slots</text>
<text x="100.0" y="239.3" text-anchor="middle" font-size="11" fill="#065F46">earlier pictures read</text>
<line x1="100" y1="200" x2="230" y2="150" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-vid-flow)"/>
<text x="380" y="300" text-anchor="middle" font-size="12" fill="#374151">Decode and graphics usually run on different queue families, so an ownership transfer or a</text>
<text x="380" y="320" text-anchor="middle" font-size="12" fill="#374151">concurrent sharing mode, plus a semaphore, orders the two queues.</text>
<text x="380" y="350" text-anchor="middle" font-size="11" fill="#374151">Image layouts for decode output and reference use are VK_IMAGE_LAYOUT_VIDEO_DECODE_DST_KHR,</text>
<text x="380" y="368" text-anchor="middle" font-size="11" fill="#374151">VK_IMAGE_LAYOUT_VIDEO_DECODE_DPB_KHR and VK_IMAGE_LAYOUT_VIDEO_DECODE_SRC_KHR (encode has equivalents).</text>
</svg>
