<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask upload pipeline</title>
  <defs>
    <marker id="fup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where an upload can be stopped</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">each stage rejects early and answers with its own status code</text>
  <rect x="10" y="70" width="700" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="92" font-size="12" fill="currentColor" text-anchor="middle">reverse proxy: client_max_body_size, timeouts, TLS (first and cheapest line of defence)</text>
  <rect x="10" y="130" width="124" height="86" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="72" y="156" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">1 Limits</text>
  <text x="72" y="180" font-size="10.5" fill="currentColor" text-anchor="middle">MAX_CONTENT_LENGTH</text>
  <text x="72" y="196" font-size="10.5" fill="currentColor" text-anchor="middle">MAX_FORM_PARTS</text>
  <line x1="134" y1="173" x2="154" y2="173" stroke="currentColor" stroke-width="1.5" marker-end="url(#fup-arrow)"/>
  <line x1="72" y1="216" x2="72" y2="250" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fup-arrow)"/>
  <rect x="32" y="252" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="72" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">413</text>
  <rect x="154" y="130" width="124" height="86" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="216" y="156" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">2 Parse</text>
  <text x="216" y="180" font-size="10.5" fill="currentColor" text-anchor="middle">request.files</text>
  <text x="216" y="196" font-size="10.5" fill="currentColor" text-anchor="middle">FileStorage</text>
  <line x1="278" y1="173" x2="298" y2="173" stroke="currentColor" stroke-width="1.5" marker-end="url(#fup-arrow)"/>
  <line x1="216" y1="216" x2="216" y2="250" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fup-arrow)"/>
  <rect x="176" y="252" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="216" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">400</text>
  <rect x="298" y="130" width="124" height="86" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="156" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">3 Validate</text>
  <text x="360" y="180" font-size="10.5" fill="currentColor" text-anchor="middle">name, extension,</text>
  <text x="360" y="196" font-size="10.5" fill="currentColor" text-anchor="middle">content, size</text>
  <line x1="422" y1="173" x2="442" y2="173" stroke="currentColor" stroke-width="1.5" marker-end="url(#fup-arrow)"/>
  <line x1="360" y1="216" x2="360" y2="250" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fup-arrow)"/>
  <rect x="320" y="252" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">415 / 422</text>
  <rect x="442" y="130" width="124" height="86" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="504" y="156" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">4 Store</text>
  <text x="504" y="180" font-size="10.5" fill="currentColor" text-anchor="middle">generated name,</text>
  <text x="504" y="196" font-size="10.5" fill="currentColor" text-anchor="middle">outside web root</text>
  <line x1="566" y1="173" x2="586" y2="173" stroke="currentColor" stroke-width="1.5" marker-end="url(#fup-arrow)"/>
  <line x1="504" y1="216" x2="504" y2="250" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fup-arrow)"/>
  <rect x="464" y="252" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="504" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">500</text>
  <rect x="586" y="130" width="124" height="86" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="648" y="156" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">5 Hand off</text>
  <text x="648" y="180" font-size="10.5" fill="currentColor" text-anchor="middle">DB row, queue job</text>
  <text x="648" y="196" font-size="10.5" fill="currentColor" text-anchor="middle">return 201 / 202</text>
  <text x="360" y="312" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">dashed arrows: rejection paths; the file is served back later by a separate, authorised view</text>
</svg>
