<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">HNSW: a layered proximity graph searched greedily from the top</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Upper layers are sparse and span long hops; each layer hands a better entry point to the layer below</text>

  <!-- layer bands -->
  <rect x="150" y="68" width="580" height="62" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <rect x="150" y="168" width="580" height="62" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <rect x="150" y="286" width="580" height="78" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>

  <text x="42" y="103" font-size="12" fill="#666666">Layer 2</text>
  <text x="42" y="119" font-size="10" fill="#999999">sparse</text>
  <text x="42" y="203" font-size="12" fill="#666666">Layer 1</text>
  <text x="42" y="329" font-size="12" fill="#666666">Layer 0</text>
  <text x="42" y="345" font-size="10" fill="#999999">every vector</text>

  <!-- graph edges: Layer 2 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="230" y1="100" x2="430" y2="100"/>
    <line x1="430" y1="100" x2="610" y2="100"/>
  </g>
  <!-- graph edges: Layer 1 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="185" y1="200" x2="295" y2="200"/>
    <line x1="295" y1="200" x2="410" y2="200"/>
    <line x1="410" y1="200" x2="520" y2="200"/>
    <line x1="520" y1="200" x2="620" y2="200"/>
    <line x1="620" y1="200" x2="695" y2="200"/>
    <line x1="295" y1="200" x2="520" y2="200"/>
  </g>
  <!-- graph edges: Layer 0 -->
  <g stroke="#cccccc" stroke-width="1.2">
    <line x1="175" y1="326" x2="240" y2="326"/>
    <line x1="240" y1="326" x2="305" y2="326"/>
    <line x1="305" y1="326" x2="370" y2="326"/>
    <line x1="370" y1="326" x2="435" y2="326"/>
    <line x1="435" y1="326" x2="500" y2="326"/>
    <line x1="500" y1="326" x2="560" y2="326"/>
    <line x1="560" y1="326" x2="620" y2="326"/>
    <line x1="620" y1="326" x2="690" y2="326"/>
    <line x1="240" y1="326" x2="370" y2="326"/>
    <line x1="435" y1="326" x2="560" y2="326"/>
    <line x1="500" y1="326" x2="620" y2="326"/>
  </g>

  <!-- inter-layer alignment (same vector present on several layers) -->
  <g stroke="#dddddd" stroke-width="1" stroke-dasharray="3 3">
    <line x1="230" y1="100" x2="185" y2="200"/>
    <line x1="430" y1="100" x2="410" y2="200"/>
    <line x1="610" y1="100" x2="620" y2="200"/>
    <line x1="410" y1="200" x2="435" y2="326"/>
    <line x1="620" y1="200" x2="620" y2="326"/>
  </g>

  <!-- ordinary nodes -->
  <g fill="#f4f4f4" stroke="#999999" stroke-width="1.2">
    <circle cx="610" cy="100" r="10"/>
    <circle cx="185" cy="200" r="10"/>
    <circle cx="295" cy="200" r="10"/>
    <circle cx="520" cy="200" r="10"/>
    <circle cx="695" cy="200" r="10"/>
    <circle cx="175" cy="326" r="10"/>
    <circle cx="240" cy="326" r="10"/>
    <circle cx="305" cy="326" r="10"/>
    <circle cx="370" cy="326" r="10"/>
    <circle cx="435" cy="326" r="10"/>
    <circle cx="500" cy="326" r="10"/>
    <circle cx="560" cy="326" r="10"/>
  </g>

  <!-- greedy search path -->
  <g stroke="#1c4b73" stroke-width="2.4" marker-end="url(#ah)">
    <line x1="242" y1="100" x2="416" y2="100"/>
    <line x1="430" y1="112" x2="412" y2="187"/>
    <line x1="422" y1="200" x2="506" y2="200"/>
    <line x1="532" y1="200" x2="606" y2="200"/>
    <line x1="620" y1="212" x2="620" y2="312"/>
    <line x1="632" y1="326" x2="676" y2="326"/>
  </g>

  <!-- path nodes drawn on top -->
  <g fill="#ffffff" stroke="#1c4b73" stroke-width="2">
    <circle cx="230" cy="100" r="10"/>
    <circle cx="430" cy="100" r="10"/>
    <circle cx="410" cy="200" r="10"/>
    <circle cx="520" cy="200" r="10"/>
    <circle cx="620" cy="200" r="10"/>
    <circle cx="620" cy="326" r="10"/>
  </g>

  <text x="230" y="82" font-size="10.5" fill="#1c4b73" text-anchor="middle">entry point</text>

  <!-- result node -->
  <circle cx="690" cy="326" r="10" fill="#ffffff" stroke="#2f5424" stroke-width="2"/>
  <circle cx="690" cy="326" r="15" fill="none" stroke="#2f5424" stroke-width="1.4"/>

  <!-- query vector -->
  <path d="M690,296 L701,307 L690,318 L679,307 Z" fill="#2f5424"/>
  <line x1="690" y1="313" x2="690" y2="309" stroke="#2f5424" stroke-width="1"/>
  <line x1="690" y1="311" x2="690" y2="316" stroke="#2f5424" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text x="690" y="285" font-size="10.5" fill="#2f5424" text-anchor="middle">query vector q</text>

  <!-- legend -->
  <g>
    <line x1="150" y1="392" x2="182" y2="392" stroke="#1c4b73" stroke-width="2.4"/>
    <text x="188" y="396" font-size="10.5" fill="#666666">greedy search path</text>
    <circle cx="332" cy="392" r="7" fill="none" stroke="#2f5424" stroke-width="1.4"/>
    <text x="345" y="396" font-size="10.5" fill="#666666">nearest neighbour returned</text>
    <line x1="540" y1="392" x2="572" y2="392" stroke="#cccccc" stroke-width="1.2"/>
    <text x="578" y="396" font-size="10.5" fill="#666666">graph edge</text>
  </g>

  <text x="380" y="430" font-size="11" fill="#444444" text-anchor="middle">Search enters at the top layer, walks to the closest visible node, drops one layer from there, and repeats.</text>
  <text x="380" y="448" font-size="11" fill="#444444" text-anchor="middle">M bounds the edges kept per node; beamWidth is how many candidates the build keeps while wiring each node in.</text>
</svg>
