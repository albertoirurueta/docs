<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From object space to window pixels</text>
<rect x="40" y="70" width="170" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="97.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Object space</text>
<text x="125.0" y="112.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">vertex as modelled</text>
<rect x="290" y="70" width="170" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="375.0" y="97.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">World space</text>
<text x="375.0" y="112.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">shelf, books, lamp</text>
<rect x="540" y="70" width="170" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="625.0" y="97.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">View space</text>
<text x="625.0" y="112.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">camera at the origin</text>
<rect x="40" y="220" width="170" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="125.0" y="247.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Clip space</text>
<text x="125.0" y="262.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">homogeneous x y z w</text>
<rect x="290" y="220" width="170" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="375.0" y="247.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">NDC</text>
<text x="375.0" y="262.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">after the divide by w</text>
<rect x="540" y="220" width="170" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="625.0" y="247.5" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Window space</text>
<text x="625.0" y="262.5" font-size="12" font-weight="normal" fill="#047857" text-anchor="middle">pixels and depth</text>
<line x1="210" y1="101" x2="290" y2="101" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ch)"/>
<text x="250" y="92" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">model M</text>
<line x1="460" y1="101" x2="540" y2="101" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ch)"/>
<text x="500" y="92" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">view V</text>
<path d="M 625,132 L 625,176 L 125,176 L 125,220" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ch)"/>
<text x="375" y="168" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">projection P (vertex shader output)</text>
<line x1="210" y1="251" x2="290" y2="251" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ch)"/>
<text x="250" y="242" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">clip, then ÷ w</text>
<line x1="460" y1="251" x2="540" y2="251" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ch)"/>
<text x="500" y="242" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">viewport</text>
<text x="125" y="306" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">gl_Position = P V M v</text>
<text x="375" y="306" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">x y in -1..1, depth in 0..1 or -1..1</text>
<text x="625" y="306" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">origin top-left or bottom-left</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">The vertex shader stops at clip space; the divide, clipping and viewport transform are fixed function.</text>
</svg>
