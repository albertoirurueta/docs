<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Consumer groups fan out the same partitions independently</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">topic "orders", 4 partitions -- each consumer group gets its own full copy of the stream</text>

  <!-- Topic outer box -->
  <rect x="20" y="66" width="170" height="300" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="105" y="86" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Topic: orders</text>

  <!-- Partitions -->
  <rect x="35" y="98" width="140" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="105" y="129" font-size="11.5" fill="#222222" text-anchor="middle">Partition 0</text>

  <rect x="35" y="160" width="140" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="105" y="191" font-size="11.5" fill="#222222" text-anchor="middle">Partition 1</text>

  <rect x="35" y="222" width="140" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="105" y="253" font-size="11.5" fill="#222222" text-anchor="middle">Partition 2</text>

  <rect x="35" y="284" width="140" height="54" fill="#ffffff" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="105" y="315" font-size="11.5" fill="#222222" text-anchor="middle">Partition 3</text>

  <!-- Group A outer box -->
  <rect x="255" y="66" width="180" height="230" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="345" y="86" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer Group A</text>
  <text x="345" y="100" font-size="9.5" fill="#555555" text-anchor="middle">group.id = "group-a" (2 members)</text>

  <rect x="270" y="112" width="150" height="86" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="345" y="140" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer A-1</text>
  <text x="345" y="156" font-size="10" fill="#333333" text-anchor="middle">owns Partition 0</text>
  <text x="345" y="170" font-size="10" fill="#333333" text-anchor="middle">owns Partition 1</text>

  <rect x="270" y="210" width="150" height="86" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="345" y="238" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Consumer A-2</text>
  <text x="345" y="254" font-size="10" fill="#333333" text-anchor="middle">owns Partition 2</text>
  <text x="345" y="268" font-size="10" fill="#333333" text-anchor="middle">owns Partition 3</text>

  <!-- Group B outer box -->
  <rect x="500" y="66" width="180" height="300" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="590" y="86" font-size="12" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer Group B</text>
  <text x="590" y="100" font-size="9.5" fill="#555555" text-anchor="middle">group.id = "group-b" (4 members)</text>

  <rect x="515" y="98" width="150" height="54" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="590" y="120" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer B-1</text>
  <text x="590" y="136" font-size="10" fill="#333333" text-anchor="middle">owns Partition 0</text>

  <rect x="515" y="160" width="150" height="54" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="590" y="182" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer B-2</text>
  <text x="590" y="198" font-size="10" fill="#333333" text-anchor="middle">owns Partition 1</text>

  <rect x="515" y="222" width="150" height="54" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="590" y="244" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer B-3</text>
  <text x="590" y="260" font-size="10" fill="#333333" text-anchor="middle">owns Partition 2</text>

  <rect x="515" y="284" width="150" height="54" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="590" y="306" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Consumer B-4</text>
  <text x="590" y="322" font-size="10" fill="#333333" text-anchor="middle">owns Partition 3</text>

  <!-- arrows: partitions to Group A -->
  <line x1="175" y1="125" x2="270" y2="145" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="175" y1="187" x2="270" y2="155" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="175" y1="249" x2="270" y2="243" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="175" y1="311" x2="270" y2="253" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#arrowA)"/>

  <!-- arrows: partitions to Group B -->
  <line x1="175" y1="118" x2="515" y2="125" stroke="#a33333" stroke-width="1.1" marker-end="url(#arrowB)"/>
  <line x1="175" y1="180" x2="515" y2="187" stroke="#a33333" stroke-width="1.1" marker-end="url(#arrowB)"/>
  <line x1="175" y1="242" x2="515" y2="249" stroke="#a33333" stroke-width="1.1" marker-end="url(#arrowB)"/>
  <line x1="175" y1="304" x2="515" y2="311" stroke="#a33333" stroke-width="1.1" marker-end="url(#arrowB)"/>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a33333"/>
    </marker>
  </defs>

  <text x="30" y="382" font-size="10.5" fill="#666666">Group A splits the 4 partitions across 2 consumers (2 each); Group B fans the same 4 partitions out to 4</text>
  <text x="30" y="396" font-size="10.5" fill="#666666">consumers (1 each) -- the two groups track separate committed offsets and never affect each other's assignment.</text>
</svg>
