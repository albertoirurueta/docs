<svg viewBox="0 0 780 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="600" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Push Notification Delivery Path</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">From Places's backend to a delivered notification, via Expo's push service and each platform's own push gateway</text>

  <defs>
    <marker id="pn-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="pn-arrow-dashed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Box 1: Places app -->
  <rect x="290" y="64" width="200" height="66" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="390" y="86" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Places app (expo-notifications)</text>
  <text x="390" y="103" font-size="9.5" fill="#333333" text-anchor="middle">requestPermissionsAsync(), then</text>
  <text x="390" y="117" font-size="9.5" fill="#333333" text-anchor="middle">getExpoPushTokenAsync()</text>

  <line x1="390" y1="130" x2="390" y2="160" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>
  <text x="620" y="149" font-size="9.5" fill="#333333" text-anchor="middle">(1) Expo push token</text>

  <!-- Box 2: Your backend -->
  <rect x="290" y="160" width="200" height="66" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.6"/>
  <text x="390" y="182" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">Your backend</text>
  <text x="390" y="199" font-size="9.5" fill="#333333" text-anchor="middle">stores the token per user/device,</text>
  <text x="390" y="213" font-size="9.5" fill="#333333" text-anchor="middle">reuses it for every future push</text>

  <line x1="390" y1="226" x2="390" y2="256" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>
  <text x="605" y="245" font-size="9.5" fill="#333333" text-anchor="middle">(2) POST {to, title, body, data}</text>

  <!-- Box 3: Expo Push API -->
  <rect x="290" y="256" width="200" height="66" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="390" y="278" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Expo Push API</text>
  <text x="390" y="295" font-size="9.5" fill="#333333" text-anchor="middle">exp.host/--/api/v2/push/send</text>
  <text x="390" y="309" font-size="9.5" fill="#333333" text-anchor="middle">relays, does not deliver directly</text>

  <line x1="330" y1="322" x2="220" y2="356" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>
  <line x1="450" y1="322" x2="560" y2="356" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>
  <text x="205" y="340" font-size="9.5" fill="#333333" text-anchor="middle">(3a) iOS</text>
  <text x="580" y="340" font-size="9.5" fill="#333333" text-anchor="middle">(3b) Android</text>

  <!-- Box 4a: APNs (iOS) -->
  <rect x="90" y="360" width="220" height="60" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="200" y="382" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">APNs (iOS)</text>
  <text x="200" y="399" font-size="9.5" fill="#333333" text-anchor="middle">Apple's own push gateway</text>

  <!-- Box 4b: FCM (Android) -->
  <rect x="470" y="360" width="220" height="60" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="580" y="382" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">FCM (Android)</text>
  <text x="580" y="399" font-size="9.5" fill="#333333" text-anchor="middle">Google's own push gateway</text>

  <line x1="220" y1="420" x2="350" y2="452" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>
  <line x1="560" y1="420" x2="430" y2="452" stroke="#333333" stroke-width="1.4" marker-end="url(#pn-arrow)"/>

  <!-- Box 5: Device OS -->
  <rect x="290" y="452" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="390" y="474" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Device OS</text>
  <text x="390" y="491" font-size="9.5" fill="#333333" text-anchor="middle">shows the system notification, wakes the app</text>

  <!-- Dashed return path: Device OS delivers back into the Places app -->
  <path d="M 490 470 C 700 470, 700 96, 492 96" fill="none" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#pn-arrow-dashed)"/>
  <text x="700" y="290" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(90 700 290)">(4) expo-notifications surfaces it</text>

  <text x="390" y="535" font-size="10.5" fill="#666666" text-anchor="middle">expo-notifications surfaces the delivered notification either way: a foreground listener while Places is open,</text>
  <text x="390" y="551" font-size="10.5" fill="#666666" text-anchor="middle">or a notification-response event when a backgrounded/killed app is launched by tapping it -- routed to a screen</text>
  <text x="390" y="567" font-size="10.5" fill="#666666" text-anchor="middle">by the deep-link handling covered on navigation.adoc, not duplicated here.</text>
</svg>
