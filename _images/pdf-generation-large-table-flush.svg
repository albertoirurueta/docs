<svg viewBox="0 0 900 560" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Large table: rows are laid out, written and released at every flush()</text>
  <rect x="30" y="42" width="160" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="110" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Your code</text>
  <line x1="110" y1="74" x2="110" y2="540" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="240" y="42" width="160" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Table (large)</text>
  <line x1="320" y1="74" x2="320" y2="540" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="460" y="42" width="160" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="540" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Document + renderers</text>
  <line x1="540" y1="74" x2="540" y2="540" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="690" y="42" width="160" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="770" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">PdfDocument / PdfWriter</text>
  <line x1="770" y1="74" x2="770" y2="540" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="110" y1="102" x2="320" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="215.0" y="96" text-anchor="middle" font-size="11" fill="#1a1a1a">new Table(widths, true)</text>
  <line x1="110" y1="132" x2="540" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="325.0" y="126" text-anchor="middle" font-size="11" fill="#1a1a1a">document.add(table)</text>
  <line x1="540" y1="160" x2="770" y2="160" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#lt-arrow)"/>
  <text x="655.0" y="154" text-anchor="middle" font-size="11" fill="#1a1a1a">start page, draw header</text>
  <rect x="130" y="176" width="380" height="34" rx="5" fill="#fff3d6" stroke="#b36b00"/>
  <text x="320.0" y="193" text-anchor="middle" font-size="11" fill="#333">Header and footer are defined before the first flush</text>
  <text x="320.0" y="208" text-anchor="middle" font-size="11" fill="#333">only the table shell is placed on the page</text>
  <rect x="30" y="226" width="840" height="212" rx="8" fill="none" stroke="#1f5fa6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#1f5fa6">repeat for every batch of rows (for example 1000)</text>
  <line x1="110" y1="272" x2="320" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="215.0" y="266" text-anchor="middle" font-size="11" fill="#1a1a1a">addCell(...) x rows x columns</text>
  <rect x="170" y="282" width="300" height="34" rx="5" fill="#fff3d6" stroke="#b36b00"/>
  <text x="320.0" y="299" text-anchor="middle" font-size="11" fill="#333">rows accumulate in memory</text>
  <text x="320.0" y="314" text-anchor="middle" font-size="11" fill="#333">(only the batch, not the whole table)</text>
  <line x1="110" y1="340" x2="320" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="215.0" y="334" text-anchor="middle" font-size="11" fill="#1a1a1a">flush()</text>
  <line x1="320" y1="364" x2="540" y2="364" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="430.0" y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">lay out the pending rows</text>
  <line x1="540" y1="388" x2="770" y2="388" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#lt-arrow)"/>
  <text x="655.0" y="382" text-anchor="middle" font-size="11" fill="#1a1a1a">write rows (and a new page if needed)</text>
  <rect x="130" y="398" width="380" height="32" rx="5" fill="#e3f4e3" stroke="#2f7a2f"/>
  <text x="320.0" y="415" text-anchor="middle" font-size="11" fill="#333">flushContent(): written rows are released from memory</text>
  <text x="320.0" y="430" text-anchor="middle" font-size="11" fill="#333">so the heap stays flat</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#555">end of loop</text>
  <line x1="110" y1="486" x2="320" y2="486" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="215.0" y="480" text-anchor="middle" font-size="11" fill="#1a1a1a">complete()</text>
  <line x1="320" y1="510" x2="540" y2="510" stroke="#555" stroke-width="1.5" marker-end="url(#lt-arrow)"/>
  <text x="430.0" y="504" text-anchor="middle" font-size="11" fill="#1a1a1a">remaining rows, then the footer (unless skipLastFooter)</text>
  <line x1="540" y1="534" x2="770" y2="534" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#lt-arrow)"/>
  <text x="655.0" y="528" text-anchor="middle" font-size="11" fill="#1a1a1a">last page, borders closed</text>
</svg>