<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-qcb-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One Bookshelf frame, recorded and submitted in five steps</text>
<rect x="14" y="60" width="134" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="81.0" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Wait for slot</text>
<text x="81.0" y="133.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="81.0" y="149.2" text-anchor="middle" font-size="12" fill="#3730A3">timeline value</text>
<text x="81.0" y="165.2" text-anchor="middle" font-size="12" fill="#3730A3">of frame N-2</text>
<text x="81.0" y="181.2" text-anchor="middle" font-size="12" fill="#3730A3">reached</text>
<circle cx="28" cy="60" r="11" fill="#4F46E5"/><text x="28" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="148" y1="145" x2="160" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-story)"/>
<rect x="160" y="60" width="134" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="227.0" y="125.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Reset pool</text>
<text x="227.0" y="141.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="227.0" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">vkResetCommandPool</text>
<text x="227.0" y="173.2" text-anchor="middle" font-size="12" fill="#3730A3">for this frame</text>
<circle cx="174" cy="60" r="11" fill="#4F46E5"/><text x="174" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="294" y1="145" x2="306" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-story)"/>
<rect x="306" y="60" width="134" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="373.0" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Record</text>
<text x="373.0" y="125.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="373.0" y="141.2" text-anchor="middle" font-size="12" fill="#3730A3">barrier2 to</text>
<text x="373.0" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">attachment layout</text>
<text x="373.0" y="173.2" text-anchor="middle" font-size="12" fill="#3730A3">beginRendering</text>
<text x="373.0" y="189.2" text-anchor="middle" font-size="12" fill="#3730A3">draw books</text>
<circle cx="320" cy="60" r="11" fill="#4F46E5"/><text x="320" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="440" y1="145" x2="452" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-story)"/>
<rect x="452" y="60" width="134" height="170" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="519.0" y="109.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Submit</text>
<text x="519.0" y="125.2" text-anchor="middle" font-size="12" fill="#065F46"></text>
<text x="519.0" y="141.2" text-anchor="middle" font-size="12" fill="#065F46">vkQueueSubmit2</text>
<text x="519.0" y="157.2" text-anchor="middle" font-size="12" fill="#065F46">wait: acquire</text>
<text x="519.0" y="173.2" text-anchor="middle" font-size="12" fill="#065F46">signal: render,</text>
<text x="519.0" y="189.2" text-anchor="middle" font-size="12" fill="#065F46">timeline</text>
<circle cx="466" cy="60" r="11" fill="#4F46E5"/><text x="466" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="586" y1="145" x2="598" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-story)"/>
<rect x="598" y="60" width="134" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665.0" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Present</text>
<text x="665.0" y="133.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="665.0" y="149.2" text-anchor="middle" font-size="12" fill="#3730A3">vkQueuePresentKHR</text>
<text x="665.0" y="165.2" text-anchor="middle" font-size="12" fill="#3730A3">waits on the</text>
<text x="665.0" y="181.2" text-anchor="middle" font-size="12" fill="#3730A3">render semaphore</text>
<circle cx="612" cy="60" r="11" fill="#4F46E5"/><text x="612" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="380" y="262" text-anchor="middle" font-size="11" fill="#374151">Steps 2 and 3 touch only the pool of the current frame in flight, so the GPU can still be running</text>
<text x="380" y="280" text-anchor="middle" font-size="11" fill="#374151">the previous frame while the CPU records this one.</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="#374151">Code for every step is in the sections below.</text>
</svg>
