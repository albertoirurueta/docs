<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Metro's Platform-Specific Extension Resolution</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Resolving `import './Header'`: the first matching file on disk wins, in this priority order</text>

  <defs>
    <marker id="pe-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- import statement -->
  <rect x="290" y="64" width="200" height="40" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="390" y="89" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">import './Header'</text>

  <line x1="340" y1="104" x2="200" y2="134" stroke="#333333" stroke-width="1.3"/>
  <line x1="440" y1="104" x2="580" y2="134" stroke="#333333" stroke-width="1.3"/>

  <!-- iOS build column header -->
  <rect x="90" y="134" width="220" height="30" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="200" y="154" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Bundling for iOS</text>

  <!-- Web build column header -->
  <rect x="470" y="134" width="220" height="30" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="580" y="154" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Bundling for web (react-native-web)</text>

  <!-- iOS chain -->
  <line x1="200" y1="164" x2="200" y2="184" stroke="#333333" stroke-width="1.2" marker-end="url(#pe-arrow)"/>
  <rect x="90" y="188" width="220" height="46" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="200" y="207" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">1. Header.ios.tsx</text>
  <text x="200" y="223" font-size="9.5" fill="#2d6a34" text-anchor="middle">exists on disk -&gt; picked, resolution stops</text>

  <line x1="200" y1="234" x2="200" y2="254" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#pe-arrow)"/>
  <rect x="90" y="258" width="220" height="42" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="200" y="276" font-size="11.5" fill="#777777" text-anchor="middle">2. Header.native.tsx</text>
  <text x="200" y="291" font-size="9" fill="#999999" text-anchor="middle">checked only if step 1 is absent</text>

  <line x1="200" y1="300" x2="200" y2="320" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#pe-arrow)"/>
  <rect x="90" y="324" width="220" height="42" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="200" y="342" font-size="11.5" fill="#777777" text-anchor="middle">3. Header.tsx</text>
  <text x="200" y="357" font-size="9" fill="#999999" text-anchor="middle">the platform-agnostic fallback</text>

  <!-- Web chain -->
  <line x1="580" y1="164" x2="580" y2="184" stroke="#333333" stroke-width="1.2" marker-end="url(#pe-arrow)"/>
  <rect x="470" y="188" width="220" height="46" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="580" y="207" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">1. Header.web.tsx</text>
  <text x="580" y="223" font-size="9.5" fill="#2d6a34" text-anchor="middle">exists on disk -&gt; picked, resolution stops</text>

  <line x1="580" y1="234" x2="580" y2="254" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#pe-arrow)"/>
  <rect x="470" y="258" width="220" height="42" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <text x="580" y="276" font-size="11.5" fill="#777777" text-anchor="middle">2. Header.tsx</text>
  <text x="580" y="291" font-size="9" fill="#999999" text-anchor="middle">the platform-agnostic fallback</text>

  <!-- note box -->
  <rect x="90" y="390" width="600" height="50" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="390" y="410" font-size="10.5" fill="#a33" text-anchor="middle" font-weight="bold">.native.tsx has no meaning to react-native-web's bundler</text>
  <text x="390" y="426" font-size="10" fill="#333333" text-anchor="middle">it is Metro's own convention for "iOS or Android, not web" and is skipped entirely when bundling for web.</text>

  <text x="390" y="452" font-size="10.5" fill="#666666" text-anchor="middle">A more specific extension always wins over a less specific one; only the highest-priority file present on disk is ever bundled.</text>
</svg>
