<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A three-level class hierarchy (Base, Mid, Leaf) showing each class's designated initializer delegating up to its superclass's designated initializer in Phase 1, then Phase 2 running back down from Base to Leaf; a convenience initializer on Leaf delegates across to Leaf's own designated initializer instead.</title>
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two-Phase Initialization Across a Class Hierarchy</text>

  <defs>
    <marker id="tpiArrowUp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f7d51"/>
    </marker>
    <marker id="tpiArrowDown" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d6fa5"/>
    </marker>
    <marker id="tpiArrowAcross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a9821f"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="150" y="60" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Leaf</text>
  <text x="430" y="60" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Mid</text>
  <text x="710" y="60" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Base</text>

  <!-- Phase 1 label -->
  <rect x="20" y="75" width="820" height="150" rx="8" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.2"/>
  <text x="40" y="98" font-size="12.5" font-weight="bold" fill="#1d5236">Phase 1 -- set every stored property, bottom to top</text>

  <rect x="80" y="115" width="140" height="50" rx="6" fill="#ffffff" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="150" y="145" font-size="11.5" fill="#1d5236" text-anchor="middle">Leaf.init sets</text>
  <text x="150" y="160" font-size="10" fill="#3a7a58" text-anchor="middle">its own properties</text>

  <rect x="360" y="115" width="140" height="50" rx="6" fill="#ffffff" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="430" y="145" font-size="11.5" fill="#1d5236" text-anchor="middle">Mid.init sets</text>
  <text x="430" y="160" font-size="10" fill="#3a7a58" text-anchor="middle">its own properties</text>

  <rect x="640" y="115" width="140" height="50" rx="6" fill="#ffffff" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="710" y="145" font-size="11.5" fill="#1d5236" text-anchor="middle">Base.init sets</text>
  <text x="710" y="160" font-size="10" fill="#3a7a58" text-anchor="middle">its own properties</text>

  <line x1="220" y1="140" x2="355" y2="140" stroke="#2f7d51" stroke-width="1.8" marker-end="url(#tpiArrowUp)"/>
  <text x="287" y="130" font-size="9.5" fill="#1d5236" text-anchor="middle">super.init(...)</text>

  <line x1="500" y1="140" x2="635" y2="140" stroke="#2f7d51" stroke-width="1.8" marker-end="url(#tpiArrowUp)"/>
  <text x="567" y="130" font-size="9.5" fill="#1d5236" text-anchor="middle">super.init(...)</text>

  <text x="430" y="205" font-size="10.5" fill="#1d5236" text-anchor="middle">Base's designated init finishes last: every stored property in the whole hierarchy is now set.</text>

  <!-- Phase 2 label -->
  <rect x="20" y="240" width="820" height="150" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.2"/>
  <text x="40" y="263" font-size="12.5" font-weight="bold" fill="#1f3b5c">Phase 2 -- further customization, top to bottom (self now usable)</text>

  <rect x="80" y="280" width="140" height="50" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="150" y="310" font-size="11" fill="#1f3b5c" text-anchor="middle">Leaf may further</text>
  <text x="150" y="324" font-size="10" fill="#3d6fa5" text-anchor="middle">customize self</text>

  <rect x="360" y="280" width="140" height="50" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="430" y="310" font-size="11" fill="#1f3b5c" text-anchor="middle">Mid may further</text>
  <text x="430" y="324" font-size="10" fill="#3d6fa5" text-anchor="middle">customize self</text>

  <rect x="640" y="280" width="140" height="50" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="710" y="310" font-size="11" fill="#1f3b5c" text-anchor="middle">Base may further</text>
  <text x="710" y="324" font-size="10" fill="#3d6fa5" text-anchor="middle">customize self</text>

  <line x1="635" y1="355" x2="500" y2="355" stroke="#3d6fa5" stroke-width="1.8" marker-end="url(#tpiArrowDown)"/>
  <text x="567" y="370" font-size="9.5" fill="#1f3b5c" text-anchor="middle">returns to Mid.init</text>

  <line x1="355" y1="355" x2="220" y2="355" stroke="#3d6fa5" stroke-width="1.8" marker-end="url(#tpiArrowDown)"/>
  <text x="287" y="370" font-size="9.5" fill="#1f3b5c" text-anchor="middle">returns to Leaf.init</text>

  <!-- Convenience initializer -->
  <rect x="20" y="410" width="820" height="130" rx="8" fill="#fdf7e8" stroke="#a9821f" stroke-width="1.2"/>
  <text x="40" y="433" font-size="12.5" font-weight="bold" fill="#7a5b1d">Convenience initializer -- delegates ACROSS, never straight to super</text>

  <rect x="500" y="450" width="180" height="50" rx="6" fill="#ffffff" stroke="#a9821f" stroke-width="1.6"/>
  <text x="590" y="472" font-size="11" fill="#5c4713" text-anchor="middle">Leaf's convenience init</text>
  <text x="590" y="487" font-size="10" fill="#7a5b1d" text-anchor="middle">e.g. init(name:)</text>

  <rect x="180" y="450" width="220" height="50" rx="6" fill="#ffffff" stroke="#a9821f" stroke-width="1.6"/>
  <text x="290" y="472" font-size="11" fill="#5c4713" text-anchor="middle">Leaf's designated init</text>
  <text x="290" y="487" font-size="10" fill="#7a5b1d" text-anchor="middle">e.g. init(name:quantity:)</text>

  <line x1="495" y1="475" x2="405" y2="475" stroke="#a9821f" stroke-width="1.8" marker-end="url(#tpiArrowAcross)"/>
  <text x="450" y="465" font-size="9.5" fill="#7a5b1d" text-anchor="middle">self.init(...)</text>
</svg>
