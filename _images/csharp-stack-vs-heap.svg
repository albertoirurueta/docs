<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Value-type and reference-type copy semantics: a struct local holds its fields inline so assignment copies the data and the two variables are independent; a class local holds only a reference so assignment copies the reference and both variables observe the same heap object; boxing copies a value into a new heap object.</title>
  <rect x="0" y="0" width="820" height="430" fill="#ffffff"/>

  <text x="410" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Copy semantics: value types versus reference types</text>
  <text x="410" y="45" font-size="11" fill="#666666" text-anchor="middle">assignment copies what the variable holds -- the data, or the reference to it</text>

  <!-- stack column -->
  <rect x="28" y="70" width="330" height="330" rx="8" fill="#f7f9fc" stroke="#8fa4bd" stroke-width="1.3"/>
  <text x="193" y="92" font-size="13" font-weight="bold" fill="#31465e" text-anchor="middle">Stack frame (locals)</text>

  <!-- heap column -->
  <rect x="462" y="70" width="330" height="330" rx="8" fill="#f6fbf7" stroke="#8bbd9d" stroke-width="1.3"/>
  <text x="627" y="92" font-size="13" font-weight="bold" fill="#2d5c42" text-anchor="middle">Managed heap (objects)</text>

  <!-- value type pair -->
  <text x="48" y="122" font-size="11.5" font-weight="bold" fill="#31465e">struct PointStruct</text>
  <rect x="48" y="130" width="128" height="52" rx="4" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="112" y="147" font-size="11" font-weight="bold" fill="#1f3b5c" text-anchor="middle">vs</text>
  <text x="112" y="163" font-size="10.5" fill="#41566e" text-anchor="middle">X = 1</text>
  <text x="112" y="176" font-size="10.5" fill="#41566e" text-anchor="middle">Y = 1</text>

  <rect x="208" y="130" width="128" height="52" rx="4" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="272" y="147" font-size="11" font-weight="bold" fill="#1f3b5c" text-anchor="middle">vsCopy = vs</text>
  <text x="272" y="163" font-size="10.5" fill="#b5432a" text-anchor="middle" font-weight="bold">X = 99</text>
  <text x="272" y="176" font-size="10.5" fill="#41566e" text-anchor="middle">Y = 1</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <line x1="180" y1="156" x2="204" y2="156" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="193" y="199" font-size="10" fill="#2f7d51" text-anchor="middle" font-weight="bold">independent copies</text>

  <!-- reference type pair -->
  <text x="48" y="240" font-size="11.5" font-weight="bold" fill="#31465e">class PointClass</text>
  <rect x="48" y="248" width="128" height="38" rx="4" fill="#fdf1e7" stroke="#b5762a" stroke-width="1.4"/>
  <text x="112" y="264" font-size="11" font-weight="bold" fill="#7a4d13" text-anchor="middle">rc</text>
  <text x="112" y="279" font-size="10" fill="#8a6a3e" text-anchor="middle">reference ──▶</text>

  <rect x="208" y="248" width="128" height="38" rx="4" fill="#fdf1e7" stroke="#b5762a" stroke-width="1.4"/>
  <text x="272" y="264" font-size="11" font-weight="bold" fill="#7a4d13" text-anchor="middle">rcAlias = rc</text>
  <text x="272" y="279" font-size="10" fill="#8a6a3e" text-anchor="middle">reference ──▶</text>

  <!-- heap object -->
  <rect x="498" y="230" width="180" height="72" rx="6" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="588" y="252" font-size="11.5" font-weight="bold" fill="#1d5236" text-anchor="middle">PointClass instance</text>
  <text x="588" y="271" font-size="10.5" fill="#b5432a" text-anchor="middle" font-weight="bold">X = 99</text>
  <text x="588" y="287" font-size="10.5" fill="#3a6b51" text-anchor="middle">Y = 1</text>

  <path d="M176,268 C 300,268 380,266 494,266" fill="none" stroke="#b5762a" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M336,272 C 400,300 440,290 494,276" fill="none" stroke="#b5762a" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="410" y="318" font-size="10" fill="#b5432a" text-anchor="middle" font-weight="bold">one object, two variables</text>

  <!-- boxing -->
  <text x="48" y="350" font-size="11.5" font-weight="bold" fill="#31465e">boxing</text>
  <rect x="48" y="358" width="128" height="34" rx="4" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="112" y="379" font-size="10.5" fill="#1f3b5c" text-anchor="middle">int value = 42</text>

  <rect x="208" y="358" width="128" height="34" rx="4" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="272" y="379" font-size="10.5" fill="#3c2a5c" text-anchor="middle">object boxed ──▶</text>

  <rect x="498" y="352" width="180" height="46" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.6"/>
  <text x="588" y="371" font-size="11" font-weight="bold" fill="#3c2a5c" text-anchor="middle">boxed int (heap)</text>
  <text x="588" y="388" font-size="10.5" fill="#5a4a72" text-anchor="middle">holds a copy: 42</text>

  <line x1="336" y1="375" x2="494" y2="375" stroke="#6b4fa5" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="193" y="410" font-size="10" fill="#6b4fa5" text-anchor="middle" font-style="italic">later writes to `value` do not change the box</text>
</svg>
