<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Shipping zones, ordered, each with its own method instances</title>
  <desc id="d">The destination address of a package is compared with the shipping zones in order of zone_order and zone_id. The first zone with a matching region wins. Each zone owns method instances with their own settings and an instance ID: Spain has flat_rate 1 and free_shipping 2, the Portugal test zone has pocketcoffee_parcel 3 and local_pickup 4, the EU test zone has flat_rate 5 and free_shipping 6, and locations not covered by any zone have no methods. The block local pickup method pickup_location is not part of a zone.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="150" width="170" height="110" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="95.0" y="182.0" text-anchor="middle" font-weight="bold">Destination</text>
  <text x="95.0" y="200.0" text-anchor="middle">country, state,</text>
  <text x="95.0" y="218.0" text-anchor="middle">postcode of the</text>
  <text x="95.0" y="236.0" text-anchor="middle">package</text>
  <line x1="180" y1="205" x2="218" y2="205" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="220" y="35" width="670" height="345" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="232" y="55" font-weight="bold">Zones, checked top to bottom: the first match wins</text>
  <rect x="240" y="60" width="250" height="70" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365.0" y="90.0" text-anchor="middle" font-weight="bold">Spain</text>
  <text x="365.0" y="108.0" text-anchor="middle">order 0, id 1 | ES</text>
  <rect x="540" y="60" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="620.0" y="99.0" text-anchor="middle" font-weight="bold">flat_rate:1</text>
  <rect x="710" y="60" width="160" height="70" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="790.0" y="99.0" text-anchor="middle" font-weight="bold">free_shipping:2</text>
  <line x1="490" y1="95" x2="538" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="140" width="250" height="70" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365.0" y="170.0" text-anchor="middle" font-weight="bold">Portugal (test)</text>
  <text x="365.0" y="188.0" text-anchor="middle">order 20, id 2 | PT</text>
  <rect x="540" y="140" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="620.0" y="179.0" text-anchor="middle" font-weight="bold">pocketcoffee_parcel:3</text>
  <rect x="710" y="140" width="160" height="70" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="790.0" y="179.0" text-anchor="middle" font-weight="bold">local_pickup:4</text>
  <line x1="490" y1="175" x2="538" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="220" width="250" height="70" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365.0" y="250.0" text-anchor="middle" font-weight="bold">EU (test)</text>
  <text x="365.0" y="268.0" text-anchor="middle">order 21, id 3 | DE, FR</text>
  <rect x="540" y="220" width="160" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="620.0" y="259.0" text-anchor="middle" font-weight="bold">flat_rate:5</text>
  <rect x="710" y="220" width="160" height="70" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="790.0" y="259.0" text-anchor="middle" font-weight="bold">free_shipping:6</text>
  <line x1="490" y1="255" x2="538" y2="255" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="300" width="250" height="70" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="365.0" y="330.0" text-anchor="middle" font-weight="bold">Locations not covered</text>
  <text x="365.0" y="348.0" text-anchor="middle">zone 0, always last | everything else</text>
  <rect x="540" y="300" width="330" height="70" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="705.0" y="330.0" text-anchor="middle" font-weight="bold">no methods: no rates</text>
  <text x="705.0" y="348.0" text-anchor="middle">the shopper cannot ship here</text>
  <line x1="490" y1="335" x2="538" y2="335" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="220" y="395" width="670" height="60" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="555.0" y="420.0" text-anchor="middle" font-weight="bold">pickup_location (block local pickup)</text>
  <text x="555.0" y="438.0" text-anchor="middle">not part of any zone: one rate per enabled location is added to every package</text>
</svg>
