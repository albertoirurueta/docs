<svg viewBox="0 0 900 460" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">HA VPN between bookshelf-vpc and a simulated on-premises VPC</text>

  <!-- Google Cloud side -->
  <rect x="20" y="48" width="330" height="372" rx="12" fill="#f3f7fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="38" y="72" font-size="14" font-weight="700" fill="#123a72">Network bookshelf-vpc (us-central1)</text>
  <rect x="40" y="90" width="290" height="62" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="185" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Subnet 10.10.0.0/24</text>
  <text x="185" y="136" text-anchor="middle" font-size="12" fill="#2b4f86">VM cloud-vm (no external IP)</text>
  <rect x="40" y="178" width="290" height="62" rx="8" fill="#fff8e6" stroke="#b06a00" stroke-width="1.5"/>
  <text x="185" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Cloud Router bookshelf-router</text>
  <text x="185" y="224" text-anchor="middle" font-size="12" fill="#7a4800">BGP ASN 65001, learns 192.168.0.0/24</text>
  <rect x="40" y="266" width="290" height="132" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="185" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">HA VPN gateway bookshelf-vpn</text>
  <rect x="190" y="300" width="130" height="42" rx="6" fill="#ffffff" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="255" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">interface 0</text>
  <text x="255" y="334" text-anchor="middle" font-size="11" fill="#14572f">external IP A</text>
  <rect x="190" y="350" width="130" height="42" rx="6" fill="#ffffff" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="255" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">interface 1</text>
  <text x="255" y="384" text-anchor="middle" font-size="11" fill="#14572f">external IP B</text>
  <!-- On-premises side -->
  <rect x="550" y="48" width="330" height="372" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="568" y="72" font-size="14" font-weight="700" fill="#3c4a58">Network onprem-vpc (simulated data center)</text>
  <rect x="570" y="90" width="290" height="62" rx="8" fill="#e9edf2" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="715" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Subnet 192.168.0.0/24</text>
  <text x="715" y="136" text-anchor="middle" font-size="12" fill="#4a5967">VM onprem-vm (no external IP)</text>
  <rect x="570" y="178" width="290" height="62" rx="8" fill="#fff8e6" stroke="#b06a00" stroke-width="1.5"/>
  <text x="715" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Cloud Router onprem-router</text>
  <text x="715" y="224" text-anchor="middle" font-size="12" fill="#7a4800">BGP ASN 65002, learns 10.10.0.0/24</text>
  <rect x="570" y="266" width="290" height="132" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="715" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">HA VPN gateway onprem-vpn</text>
  <rect x="580" y="300" width="130" height="42" rx="6" fill="#ffffff" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="645" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">interface 0</text>
  <text x="645" y="334" text-anchor="middle" font-size="11" fill="#14572f">external IP C</text>
  <rect x="580" y="350" width="130" height="42" rx="6" fill="#ffffff" stroke="#1e7e45" stroke-width="1.5"/>
  <text x="645" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">interface 1</text>
  <text x="645" y="384" text-anchor="middle" font-size="11" fill="#14572f">external IP D</text>
  <path d="M320 321 L580 321" stroke="#1e7e45" stroke-width="3" fill="none"/>
  <path d="M320 371 L580 371" stroke="#1e7e45" stroke-width="3" fill="none"/>
  <text x="450" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">tunnel 0: IPsec, IKEv2</text>
  <text x="450" y="337" text-anchor="middle" font-size="10.5" fill="#14572f">BGP 169.254.0.1 / .2 (/30)</text>
  <text x="450" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#14572f">tunnel 1: IPsec, IKEv2</text>
  <text x="450" y="387" text-anchor="middle" font-size="10.5" fill="#14572f">BGP 169.254.1.1 / .2 (/30)</text>
  <!-- Internet note -->
  <text x="450" y="120" text-anchor="middle" font-size="12" fill="#5c6b7a">Tunnels cross the public internet,</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#5c6b7a">encrypted end to end</text>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#5c6b7a">Two tunnels on separate interfaces</text>
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#5c6b7a">give the 99.99% availability SLA</text>

  <!-- Internal links -->
  <path d="M185 152 L185 178" stroke="#7a8a9a" stroke-width="1.5" fill="none"/>
  <path d="M185 240 L185 266" stroke="#7a8a9a" stroke-width="1.5" fill="none"/>
  <path d="M715 152 L715 178" stroke="#7a8a9a" stroke-width="1.5" fill="none"/>
  <path d="M715 240 L715 266" stroke="#7a8a9a" stroke-width="1.5" fill="none"/>
</svg>
