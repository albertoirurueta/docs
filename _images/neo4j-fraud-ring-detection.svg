<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two suspicious transfer rings linked by a bridge account</text>

  <!-- ring groupings (background) -->
  <ellipse cx="140" cy="220" rx="112" ry="98" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
  <ellipse cx="380" cy="220" rx="112" ry="102" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="140" y="112" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">Ring 1</text>
  <text x="380" y="108" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">Ring 2</text>

  <!-- edges (drawn under nodes) -->
  <g stroke="#888888" stroke-width="1.4" fill="none">
    <line x1="90" y1="196" x2="90" y2="244"/>
    <line x1="113.2" y1="258.4" x2="166.8" y2="231.6"/>
    <line x1="166.8" y1="208.4" x2="113.2" y2="181.6"/>
    <line x1="216" y1="220" x2="304" y2="220"/>
    <line x1="352.3" y1="206.6" x2="407.7" y2="173.4"/>
    <line x1="430" y1="186" x2="430" y2="254"/>
    <line x1="407.7" y1="266.6" x2="352.3" y2="233.4"/>
    <line x1="356" y1="220" x2="594" y2="220"/>
  </g>

  <!-- arrowheads -->
  <g fill="#888888">
    <polygon points="90,244 85,234 95,234"/>
    <polygon points="166.8,231.6 160.1,240.5 155.6,231.6"/>
    <polygon points="113.2,181.6 124.4,181.6 119.9,190.6"/>
    <polygon points="304,220 294,225 294,215"/>
    <polygon points="407.7,173.4 401.7,182.8 396.6,174.3"/>
    <polygon points="430,254 425,244 435,244"/>
    <polygon points="352.3,233.4 363.4,234.3 358.3,242.8"/>
    <polygon points="594,220 584,225 584,215"/>
  </g>

  <!-- ring 1 nodes -->
  <circle cx="90" cy="170" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="90" y="175" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">A1</text>

  <circle cx="90" cy="270" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="90" y="275" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">A2</text>

  <circle cx="190" cy="220" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="225" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">A3</text>

  <!-- bridge node -->
  <circle cx="330" cy="220" r="31" fill="#fff2cc" stroke="#b8860b" stroke-width="3.4"/>
  <text x="330" y="226" font-size="15" font-weight="bold" fill="#6b5200" text-anchor="middle">A4</text>
  <text x="330" y="266" font-size="11" font-weight="bold" fill="#b8860b" text-anchor="middle">bridge account</text>

  <!-- ring 2 nodes -->
  <circle cx="430" cy="160" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="165" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">A5</text>

  <circle cx="430" cy="280" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="285" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">A6</text>

  <!-- outside / normal account -->
  <circle cx="620" cy="220" r="26" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="620" y="225" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">A7</text>
  <text x="620" y="262" font-size="11" fill="#666666" text-anchor="middle">outside contact</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="396" r="8" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="400" font-size="11.5" fill="#444444">Suspicious ring account</text>

    <circle cx="244" cy="396" r="8" fill="#fff2cc" stroke="#b8860b" stroke-width="3"/>
    <text x="260" y="400" font-size="11.5" fill="#444444">Bridge account (highest betweenness)</text>

    <circle cx="560" cy="396" r="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
    <text x="576" y="400" font-size="11.5" fill="#444444">Other account</text>
  </g>

  <text x="360" y="424" font-size="11.5" fill="#444444" text-anchor="middle">WCC isolates the two components, Louvain confirms each is a dense sub-community, and Betweenness Centrality ranks A4 as the connector worth investigating.</text>
</svg>
