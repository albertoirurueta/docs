<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Active Record vs. Repository -- the same Book entity, modeled two ways</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Panache supports both persistence styles on top of the same Hibernate ORM entity underneath</text>

  <!-- vertical divider -->
  <line x1="392" y1="58" x2="392" y2="412" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ================= LEFT: Active Record ================= -->
  <rect x="30" y="64" width="330" height="38" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="195" y="88" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">BookResource / BookService</text>

  <line x1="195" y1="102" x2="195" y2="122" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="205" y="112" font-size="9" fill="#333333" text-anchor="start">calls Book</text>
  <text x="205" y="122" font-size="9" fill="#333333" text-anchor="start">directly</text>

  <rect x="30" y="122" width="330" height="150" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="195" y="144" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Book extends PanacheEntity</text>
  <text x="48" y="164" font-size="10.5" fill="#333333" text-anchor="start">public Long id;   // inherited from PanacheEntity</text>
  <text x="48" y="180" font-size="10.5" fill="#333333" text-anchor="start">public String title;</text>
  <text x="48" y="196" font-size="10.5" fill="#333333" text-anchor="start">public String author;</text>
  <text x="48" y="216" font-size="9.5" fill="#666666" text-anchor="start">// static helpers, inherited:</text>
  <text x="48" y="232" font-size="10.5" fill="#333333" text-anchor="start">Book.findAll(), Book.find("title", t)</text>
  <text x="48" y="248" font-size="10.5" fill="#333333" text-anchor="start">Book.persist(book)</text>
  <text x="48" y="262" font-size="10.5" fill="#333333" text-anchor="start">book.delete()</text>

  <rect x="30" y="290" width="330" height="100" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="195" y="309" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Active Record trade-off</text>
  <text x="195" y="327" font-size="10" fill="#333333" text-anchor="middle">Less code -- persistence calls live directly on Book itself.</text>
  <text x="195" y="344" font-size="10" fill="#333333" text-anchor="middle">Static methods (Book.findAll(), Book.persist(...)) are harder</text>
  <text x="195" y="361" font-size="10" fill="#333333" text-anchor="middle">to mock/stub in isolation; unit tests typically need PanacheMock.</text>

  <!-- ================= RIGHT: Repository ================= -->
  <rect x="410" y="64" width="330" height="38" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="575" y="88" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">BookResource / BookService</text>

  <line x1="575" y1="102" x2="575" y2="122" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="585" y="112" font-size="9" fill="#333333" text-anchor="start">calls injected</text>
  <text x="585" y="122" font-size="9" fill="#333333" text-anchor="start">BookRepository</text>

  <rect x="410" y="122" width="330" height="64" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="575" y="142" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">BookRepository</text>
  <text x="575" y="158" font-size="10.5" fill="#333333" text-anchor="middle">implements PanacheRepository&lt;Book&gt;</text>
  <text x="575" y="174" font-size="10" fill="#666666" text-anchor="middle">@Inject BookRepository repository;</text>

  <line x1="575" y1="186" x2="575" y2="204" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="585" y="198" font-size="9" fill="#333333" text-anchor="start">acts on</text>

  <rect x="410" y="204" width="330" height="68" rx="6" fill="#f5f5f5" stroke="#555555" stroke-width="1.4"/>
  <text x="575" y="224" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Book (plain entity)</text>
  <text x="575" y="242" font-size="10" fill="#333333" text-anchor="middle">private Long id, String title, String author;</text>
  <text x="575" y="258" font-size="9.5" fill="#666666" text-anchor="middle">// standard getters/setters, no Panache inheritance</text>

  <rect x="410" y="290" width="330" height="100" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="575" y="309" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Repository trade-off</text>
  <text x="575" y="327" font-size="10" fill="#333333" text-anchor="middle">Standard, DI-friendly boundary -- BookRepository is just a bean.</text>
  <text x="575" y="344" font-size="10" fill="#333333" text-anchor="middle">One extra class per entity, but Book / BookRepository are each</text>
  <text x="575" y="361" font-size="10" fill="#333333" text-anchor="middle">easy to unit test in isolation with a mocked repository.</text>

  <!-- bottom note -->
  <rect x="60" y="415" width="640" height="42" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="432" font-size="10.5" fill="#666666" text-anchor="middle">Both styles wrap the same underlying Hibernate ORM entity -- Panache only changes where</text>
  <text x="380" y="446" font-size="10.5" fill="#666666" text-anchor="middle">persistence calls are invoked from: directly on the entity, or through an injected repository.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
