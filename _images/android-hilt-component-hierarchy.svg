<svg viewBox="0 0 760 620" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Hilt Component Hierarchy and Scopes</text>
  <text x="380" y="45" text-anchor="middle" font-size="12" fill="#3c4043">A child component can see every binding of its parent; a parent can never see a child's bindings</text>

  <!-- SingletonComponent -->
  <rect x="270" y="60" width="220" height="58" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a3a6b">SingletonComponent</text>
  <text x="380" y="98" text-anchor="middle" font-size="10.5" fill="#1a3a6b">@Singleton -- process lifetime</text>
  <text x="380" y="112" text-anchor="middle" font-size="9.5" fill="#3c4073">NetworkModule, DatabaseModule</text>

  <!-- vertical line down to ActivityRetainedComponent and ServiceComponent -->
  <path d="M 380 118 L 380 140" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 380 140 L 200 140" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 380 140 L 600 140" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 200 140 L 200 158" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 600 140 L 600 158" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ActivityRetainedComponent -->
  <rect x="95" y="160" width="210" height="54" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.8"/>
  <text x="200" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4a00">ActivityRetainedComponent</text>
  <text x="200" y="195" text-anchor="middle" font-size="10" fill="#7a4a00">@ActivityRetainedScoped</text>
  <text x="200" y="208" text-anchor="middle" font-size="9" fill="#7a4a00">survives configuration changes</text>

  <!-- ServiceComponent -->
  <rect x="495" y="160" width="210" height="54" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/>
  <text x="600" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1a12">ServiceComponent</text>
  <text x="600" y="195" text-anchor="middle" font-size="10" fill="#7a1a12">@ServiceScoped</text>
  <text x="600" y="208" text-anchor="middle" font-size="9" fill="#7a1a12">one Service, e.g. RecordHikeService</text>

  <!-- ActivityRetainedComponent -> ViewModelComponent -->
  <path d="M 200 214 L 200 236" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="95" y="238" width="210" height="52" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.8"/>
  <text x="200" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4a00">ViewModelComponent</text>
  <text x="200" y="273" text-anchor="middle" font-size="10" fill="#7a4a00">@ViewModelScoped</text>
  <text x="200" y="286" text-anchor="middle" font-size="9" fill="#7a4a00">@HiltViewModel (RepositoryModule)</text>

  <!-- ActivityRetainedComponent -> ActivityComponent -->
  <path d="M 300 187 L 380 187 L 380 236" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ActivityComponent -->
  <rect x="335" y="238" width="220" height="54" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="445" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d4c22">ActivityComponent</text>
  <text x="445" y="273" text-anchor="middle" font-size="10" fill="#0d4c22">@ActivityScoped</text>
  <text x="445" y="286" text-anchor="middle" font-size="9" fill="#0d4c22">@AndroidEntryPoint MainActivity</text>

  <!-- ActivityComponent -> FragmentComponent and ViewComponent -->
  <path d="M 445 292 L 445 312" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 445 312 L 300 312" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 445 312 L 590 312" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M 300 312 L 300 330" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 590 312 L 590 330" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- FragmentComponent -->
  <rect x="195" y="332" width="210" height="52" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="300" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d4c22">FragmentComponent</text>
  <text x="300" y="367" text-anchor="middle" font-size="10" fill="#0d4c22">@FragmentScoped</text>
  <text x="300" y="380" text-anchor="middle" font-size="9" fill="#0d4c22">@AndroidEntryPoint TrailListFragment</text>

  <!-- ViewComponent -->
  <rect x="485" y="332" width="210" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/>
  <text x="590" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a1a7a">ViewComponent</text>
  <text x="590" y="367" text-anchor="middle" font-size="10" fill="#4a1a7a">@ViewScoped</text>
  <text x="590" y="380" text-anchor="middle" font-size="9" fill="#4a1a7a">@AndroidEntryPoint custom view</text>

  <!-- FragmentComponent -> ViewWithFragmentComponent -->
  <path d="M 300 384 L 300 406" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="185" y="408" width="230" height="46" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/>
  <text x="300" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1a7a">ViewWithFragmentComponent</text>
  <text x="300" y="443" text-anchor="middle" font-size="9.5" fill="#4a1a7a">@ViewScoped -- inside a Fragment's view</text>

  <!-- SingletonComponent -> WorkerComponent (side branch, dashed to show androidx.hilt) -->
  <path d="M 490 100 L 660 100 L 660 460 L 610 460" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <rect x="470" y="440" width="140" height="42" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="540" y="458" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3c4043">@HiltWorker</text>
  <text x="540" y="472" text-anchor="middle" font-size="8.5" fill="#3c4043">androidx.hilt:hilt-work</text>

  <!-- EntryPoint note, separate box, not part of the tree -->
  <rect x="60" y="480" width="220" height="60" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="170" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#3c4043">@EntryPoint</text>
  <text x="170" y="516" text-anchor="middle" font-size="9" fill="#3c4043">reaches a component's bindings</text>
  <text x="170" y="529" text-anchor="middle" font-size="9" fill="#3c4043">from code Hilt does not manage</text>

  <!-- Legend -->
  <text x="60" y="565" font-size="11" fill="#3c4043">Solid arrow: parent component creates a child component (one child per instance of its Android class).</text>
  <text x="60" y="581" font-size="11" fill="#3c4043">Dashed arrow: an androidx.hilt extension component layered on top of a standard Hilt component.</text>
  <text x="60" y="597" font-size="11" fill="#3c4043">A binding installed higher up (e.g. in SingletonComponent) is visible everywhere below it in the tree.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aa0a6"/>
    </marker>
  </defs>
</svg>
