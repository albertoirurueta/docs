<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">tf.function trace cache and retracing</title>
  <desc id="d">Calls with new tensor shapes, new dtypes or new Python values miss the trace cache and trigger a trace that builds a ConcreteFunction; calls with matching tensor types reuse a cached graph.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">One signature, one trace</text>
  <rect x="30" y="70" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="105" y="96" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">f(x)</text>
  <text x="105" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">tensor dtype + shape,</text>
  <text x="105" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Python values</text>
  <rect x="250" y="70" width="150" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="325" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Signature in cache?</text>
  <text x="325" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">(subtype match counts)</text>
  <line x1="180" y1="100" x2="248" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="500" y="50" width="190" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="595" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Hit: run cached graph</text>
  <text x="595" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Python body is skipped</text>
  <rect x="500" y="130" width="190" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="595" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Miss: trace the body</text>
  <text x="595" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Python runs once, graph added</text>
  <line x1="400" y1="90" x2="498" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="112" x2="498" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="450" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">yes</text>
  <text x="450" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">no</text>
  <text x="30" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Common causes of misses</text>
  <rect x="30" y="238" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="130" y="262" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">new shape: [3] then [4]</text>
  <text x="130" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fix: None dim in signature</text>
  <rect x="260" y="238" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="360" y="262" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">Python value: f(3), f(4)</text>
  <text x="360" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fix: pass a tf.constant</text>
  <rect x="490" y="238" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="590" y="262" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">new dtype or new object</text>
  <text x="590" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fix: cast, reuse the object</text>
</svg>
