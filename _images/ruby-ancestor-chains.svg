<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Ancestor chains with a prepended, an included and an extended module</title>
  <desc>Two lookup chains for the shelf Branch class. Instance lookup starts at the prepended Shelf::Audit, then Shelf::Branch, the included Shelf::Searchable and Enumerable, then Object, Kernel and BasicObject. Class-level lookup starts at the singleton class of Branch, then the extended Shelf::Registry, then the singleton classes of Object and BasicObject, then Class, Module, Object, Kernel and BasicObject.</desc>
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where prepend, include and extend put a module</text>
  <text x="480.0" y="47" font-size="12" fill="#666666" text-anchor="middle">Ruby searches each chain from the top down and stops at the first method with the requested name</text>
  <text x="220" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Instance lookup</text>
  <text x="220" y="100" font-size="12" fill="#666666" text-anchor="middle">Shelf::Branch.ancestors</text>
  <rect x="20" y="116" width="260" height="34" rx="5" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150" y="138" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#8a4a12" text-anchor="middle">Shelf::Audit</text>
  <text x="290" y="138" font-size="12" font-style="italic" fill="#b5651d">prepend</text>
  <path d="M150,150 L150,166" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,161 L150,167 L155,161" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="168" width="260" height="34" rx="5" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="150" y="190" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">Shelf::Branch</text>
  <text x="290" y="190" font-size="12" font-style="italic" fill="#1c4b73">the class</text>
  <path d="M150,202 L150,218" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,213 L150,219 L155,213" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="220" width="260" height="34" rx="5" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="150" y="242" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#1f5a37" text-anchor="middle">Shelf::Searchable</text>
  <text x="290" y="242" font-size="12" font-style="italic" fill="#2e7d4f">include (last)</text>
  <path d="M150,254 L150,270" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,265 L150,271 L155,265" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="272" width="260" height="34" rx="5" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="150" y="294" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#1f5a37" text-anchor="middle">Enumerable</text>
  <text x="290" y="294" font-size="12" font-style="italic" fill="#2e7d4f">include (first)</text>
  <path d="M150,306 L150,322" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,317 L150,323 L155,317" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="324" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="150" y="346" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Object</text>
  <path d="M150,358 L150,374" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,369 L150,375 L155,369" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="376" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="150" y="398" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Kernel</text>
  <path d="M150,410 L150,426" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M145,421 L150,427 L155,421" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="20" y="428" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="150" y="450" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">BasicObject</text>
  <text x="700" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Class-level lookup</text>
  <text x="700" y="100" font-size="12" fill="#666666" text-anchor="middle">Shelf::Branch.singleton_class.ancestors</text>
  <rect x="500" y="116" width="260" height="34" rx="5" fill="#e8eef5" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="630" y="138" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#1c4b73" text-anchor="middle">#&lt;Class:Shelf::Branch&gt;</text>
  <text x="770" y="138" font-size="12" font-style="italic" fill="#1c4b73">singleton class</text>
  <path d="M630,150 L630,166" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,161 L630,167 L635,161" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="168" width="260" height="34" rx="5" fill="#f0e9f7" stroke="#6a3d9a" stroke-width="1.4"/>
  <text x="630" y="190" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#4b2a73" text-anchor="middle">Shelf::Registry</text>
  <text x="770" y="190" font-size="12" font-style="italic" fill="#6a3d9a">extend</text>
  <path d="M630,202 L630,218" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,213 L630,219 L635,213" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="220" width="260" height="34" rx="5" fill="#e8eef5" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="630" y="242" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#1c4b73" text-anchor="middle">#&lt;Class:Object&gt;</text>
  <path d="M630,254 L630,270" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,265 L630,271 L635,265" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="272" width="260" height="34" rx="5" fill="#e8eef5" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="630" y="294" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#1c4b73" text-anchor="middle">#&lt;Class:BasicObject&gt;</text>
  <path d="M630,306 L630,322" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,317 L630,323 L635,317" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="324" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="630" y="346" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Class</text>
  <path d="M630,358 L630,374" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,369 L630,375 L635,369" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="376" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="630" y="398" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Module</text>
  <path d="M630,410 L630,426" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,421 L630,427 L635,421" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="428" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="630" y="450" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Object</text>
  <path d="M630,462 L630,478" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,473 L630,479 L635,473" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="480" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="630" y="502" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">Kernel</text>
  <path d="M630,514 L630,530" stroke="#777777" stroke-width="1.4" fill="none"/>
  <path d="M625,525 L630,531 L635,525" stroke="#777777" stroke-width="1.4" fill="none"/>
  <rect x="500" y="532" width="260" height="34" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="630" y="554" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">BasicObject</text>
  <rect x="20" y="604" width="920" height="46" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <rect x="36" y="620" width="16" height="14" rx="3" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="58" y="632" font-size="12" fill="#222222">prepend: before the class</text>
  <rect x="220.0" y="620" width="16" height="14" rx="3" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="242.0" y="632" font-size="12" fill="#222222">the class itself</text>
  <rect x="350.0" y="620" width="16" height="14" rx="3" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="372.0" y="632" font-size="12" fill="#222222">include: after the class</text>
  <rect x="528.0" y="620" width="16" height="14" rx="3" fill="#f0e9f7" stroke="#6a3d9a" stroke-width="1.4"/>
  <text x="550.0" y="632" font-size="12" fill="#222222">extend: via the singleton class</text>
  <rect x="748.0" y="620" width="16" height="14" rx="3" fill="#f2f2f2" stroke="#777777" stroke-width="1.4"/>
  <text x="770.0" y="632" font-size="12" fill="#222222">core ancestors</text>
</svg>
