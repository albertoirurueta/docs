<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="pbtCfgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a pip option value comes from</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Later sources override earlier ones; within each file a [command] section overrides [global]</text>

<!-- files column -->
<text x="200" y="80" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">CONFIGURATION FILES (read in this order)</text>
<rect x="40" y="94" width="320" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="56" y="116" font-size="13" font-weight="bold" fill="#333333">1. Global</text>
<text x="56" y="136" font-size="11" fill="#444444" font-family="Courier New, monospace">/etc/xdg/pip/pip.conf, /etc/pip.conf</text>
<rect x="40" y="162" width="320" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="56" y="184" font-size="13" font-weight="bold" fill="#333333">2. User</text>
<text x="56" y="204" font-size="11" fill="#444444" font-family="Courier New, monospace">~/.pip/pip.conf, ~/.config/pip/pip.conf</text>
<rect x="40" y="230" width="320" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="56" y="252" font-size="13" font-weight="bold" fill="#333333">3. Site</text>
<text x="56" y="272" font-size="11" fill="#444444" font-family="Courier New, monospace">$VIRTUAL_ENV/pip.conf</text>
<rect x="40" y="298" width="320" height="58" fill="#f5f5f5" stroke="#777777"/>
<text x="56" y="320" font-size="13" font-weight="bold" fill="#333333">4. PIP_CONFIG_FILE</text>
<text x="56" y="340" font-size="11" fill="#444444">a file named by the variable (os.devnull = none)</text>
<line x1="200" y1="152" x2="200" y2="160" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtCfgArrow)"/>
<line x1="200" y1="220" x2="200" y2="228" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtCfgArrow)"/>
<line x1="200" y1="288" x2="200" y2="296" stroke="#444444" stroke-width="1.5" marker-end="url(#pbtCfgArrow)"/>

<!-- inside a file -->
<rect x="40" y="374" width="320" height="70" fill="#fffde7" stroke="#8d6e00"/>
<text x="56" y="394" font-size="12" font-weight="bold" fill="#5d4600">Inside one file</text>
<text x="56" y="414" font-size="11" fill="#444444" font-family="Courier New, monospace">[global]  index-url = A</text>
<text x="56" y="432" font-size="11" fill="#444444" font-family="Courier New, monospace">[install] index-url = B   wins for install</text>

<!-- merged arrow -->
<line x1="362" y1="226" x2="438" y2="226" stroke="#444444" stroke-width="2" marker-end="url(#pbtCfgArrow)"/>
<text x="400" y="216" font-size="11" fill="#555555" text-anchor="middle">merged</text>

<!-- env -->
<rect x="440" y="176" width="200" height="100" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="540" y="200" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Environment</text>
<text x="540" y="222" font-size="11" fill="#333333" text-anchor="middle" font-family="Courier New, monospace">PIP_INDEX_URL=…</text>
<text x="540" y="242" font-size="11" fill="#333333" text-anchor="middle">overrides every file</text>
<text x="540" y="262" font-size="10" fill="#666666" text-anchor="middle">an empty value is ignored, not false</text>
<line x1="642" y1="226" x2="698" y2="226" stroke="#444444" stroke-width="2" marker-end="url(#pbtCfgArrow)"/>

<!-- cli -->
<rect x="700" y="176" width="220" height="100" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="810" y="200" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Command line</text>
<text x="810" y="222" font-size="11" fill="#333333" text-anchor="middle" font-family="Courier New, monospace">--index-url …</text>
<text x="810" y="242" font-size="11" fill="#333333" text-anchor="middle">overrides everything</text>
<text x="810" y="262" font-size="10" fill="#666666" text-anchor="middle">the value pip finally uses</text>

<!-- isolated note -->
<rect x="440" y="320" width="480" height="60" fill="#fff4e0" stroke="#a65e00"/>
<text x="680" y="344" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">--isolated</text>
<text x="680" y="364" font-size="11" fill="#444444" text-anchor="middle">ignores the environment variables and the user configuration</text>
<text x="480" y="456" font-size="10" fill="#888888" text-anchor="middle">Linux paths shown; macOS and Windows use the locations listed on the page. pip config debug prints them.</text>
</svg>
