<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 529" width="860" height="529" role="img" aria-labelledby="cost-hosting-t cost-hosting-d">
<title id="cost-hosting-t">Hosting cost assumptions per month</title>
<desc id="cost-hosting-d">Monthly cost in US dollars of two hosting profiles on AWS, Azure and Google Cloud, taken from the cloud providers comparison page: a static website of 50 GB files and 500 GB egress per month, and a simple dynamic site on a 2 vCPU 8 GiB virtual machine with a small managed PostgreSQL database, 100 GB of uploads and backups and 200 GB of egress. A self-hosted CMS adds this cost to its licence and development cost; hosted builders include it in the plan price.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}</style>
<rect width="860" height="529" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Hosting cost assumptions per month</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">AWS</text><rect class="m1" x="228" y="-4" width="8" height="8"/><text x="250" y="4">Azure</text><path class="m2" d="M382 -5L387 4L377 4Z"/><text x="400" y="4">Google Cloud</text></g></g><line class="grid" x1="70" y1="388" x2="836" y2="388"/><text class="muted" x="62" y="392" text-anchor="end">0</text><line class="grid" x1="70" y1="313" x2="836" y2="313"/><text class="muted" x="62" y="317" text-anchor="end">50</text><line class="grid" x1="70" y1="238" x2="836" y2="238"/><text class="muted" x="62" y="242" text-anchor="end">100</text><line class="grid" x1="70" y1="163" x2="836" y2="163"/><text class="muted" x="62" y="167" text-anchor="end">150</text><line class="grid" x1="70" y1="88" x2="836" y2="88"/><text class="muted" x="62" y="92" text-anchor="end">200</text><path class="axis" d="M70 88V388H836"/><g><title>AWS: USD 48</title><rect class="f0" x="202.5" y="315.7" width="38" height="72.3"/><text class="muted" x="221.5" y="311.7" text-anchor="middle" font-size="10">USD 48</text></g><g><title>Azure: USD 47</title><rect class="f1" x="242.5" y="318.12" width="38" height="69.88"/><text class="muted" x="261.5" y="314.12" text-anchor="middle" font-size="10">USD 47</text></g><g><title>Google Cloud: USD 63</title><rect class="f2" x="282.5" y="293.43" width="38" height="94.57"/><text class="muted" x="301.5" y="289.43" text-anchor="middle" font-size="10">USD 63</text></g><text x="261.5" y="406" text-anchor="middle"><tspan x="261.5" dy="0">Static website (50 GB files, 500 GB egress)</tspan></text><g><title>AWS: USD 147</title><rect class="f0" x="585.5" y="167.38" width="38" height="220.62"/><text class="muted" x="604.5" y="163.38" text-anchor="middle" font-size="10">USD 147</text></g><g><title>Azure: USD 145</title><rect class="f1" x="625.5" y="170.58" width="38" height="217.42"/><text class="muted" x="644.5" y="166.58" text-anchor="middle" font-size="10">USD 145</text></g><g><title>Google Cloud: USD 186</title><rect class="f2" x="665.5" y="108.81" width="38" height="279.19"/><text class="muted" x="684.5" y="104.81" text-anchor="middle" font-size="10">USD 186</text></g><text x="644.5" y="406" text-anchor="middle"><tspan x="644.5" dy="0">Simple dynamic site (2 vCPU VM, small PostgreSQL, 200 GB</tspan><tspan x="644.5" dy="14">egress)</tspan></text><text class="axis-label" x="453" y="462" text-anchor="middle">Hosting profile</text><text class="axis-label" transform="translate(16 238) rotate(-90)" text-anchor="middle">Cost (USD per month)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="478" text-anchor="start"><tspan x="24" dy="0">Source: provider price lists, as compiled in cloud/comparing-cloud-providers.adoc (2026-10-26); retrieved 2026-10-29. Prices in USD; the total</tspan><tspan x="24" dy="15">cost of ownership chart converts them to euros at the ECB reference rate. Raw data: scripts/cms-comparison-charts/data/cost.csv. See the</tspan><tspan x="24" dy="15">Bibliography for the sources.</tspan></text>
</svg>
