<svg viewBox="0 0 1340 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1340" height="360" fill="#ffffff"/>
  <text x="670" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">OAuth timeline, 2006-2026</text>
  <text x="670" y="44" font-size="11" fill="#666666" text-anchor="middle">proprietary era -&gt; OAuth 1.0/1.0a -&gt; WRAP -&gt; RFC 6749/6750 -&gt; the extension decade -&gt; the 2.1 draft</text>

  <line x1="40" y1="190" x2="1300" y2="190" stroke="#9a9a9a" stroke-width="2"/>

  <!-- Proprietary era -->
  <text x="80" y="70" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Proprietary era</text>
  <circle cx="80" cy="190" r="6" fill="#c25a1d"/>
  <line x1="80" y1="184" x2="80" y2="85" stroke="#c25a1d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="80" y="100" font-size="10" fill="#8a5a1c" text-anchor="middle">2006-07</text>
  <text x="80" y="113" font-size="10" fill="#8a5a1c" text-anchor="middle">Google ClientLogin /</text>
  <text x="80" y="126" font-size="10" fill="#8a5a1c" text-anchor="middle">AuthSub, Yahoo! BBAuth</text>

  <!-- OAuth 1.0 -->
  <circle cx="270" cy="190" r="7" fill="#1c4b73"/>
  <line x1="270" y1="184" x2="270" y2="85" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="270" y="70" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">OAuth Core 1.0</text>
  <text x="270" y="100" font-size="10" fill="#1c4b73" text-anchor="middle">Dec 2007</text>

  <circle cx="270" cy="190" r="0"/>
  <line x1="270" y1="196" x2="270" y2="230" stroke="#a33" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="270" y="246" font-size="10" fill="#a33" text-anchor="middle">2009</text>
  <text x="270" y="259" font-size="10" fill="#a33" text-anchor="middle">Security Advisory 2009.1</text>
  <text x="270" y="272" font-size="10" fill="#a33" text-anchor="middle">(session fixation)</text>

  <circle cx="440" cy="190" r="6" fill="#1c4b73"/>
  <line x1="440" y1="196" x2="440" y2="230" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="440" y="246" font-size="10" fill="#1c4b73" text-anchor="middle">Jun 2009</text>
  <text x="440" y="259" font-size="10" fill="#1c4b73" text-anchor="middle">Revision A</text>
  <text x="440" y="272" font-size="10" fill="#1c4b73" text-anchor="middle">(fixes the flaw)</text>

  <circle cx="570" cy="190" r="6" fill="#1c4b73"/>
  <line x1="570" y1="184" x2="570" y2="85" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="570" y="100" font-size="10" fill="#1c4b73" text-anchor="middle">Apr 2010</text>
  <text x="570" y="113" font-size="10" fill="#1c4b73" text-anchor="middle">RFC 5849</text>
  <text x="570" y="126" font-size="10" fill="#1c4b73" text-anchor="middle">(OAuth 1.0, Informational)</text>

  <!-- WRAP -->
  <circle cx="710" cy="190" r="5" fill="#9a9a9a"/>
  <text x="710" y="246" font-size="10" fill="#666666" text-anchor="middle">2009-10</text>
  <text x="710" y="259" font-size="10" fill="#666666" text-anchor="middle">OAuth WRAP</text>
  <text x="710" y="272" font-size="10" fill="#666666" text-anchor="middle">(bridge, signatures dropped)</text>

  <!-- RFC 6749/6750 -->
  <circle cx="860" cy="190" r="7" fill="#2d6a34"/>
  <line x1="860" y1="184" x2="860" y2="85" stroke="#2d6a34" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="860" y="70" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">RFC 6749 / 6750</text>
  <text x="860" y="100" font-size="10" fill="#2d6a34" text-anchor="middle">Oct 2012</text>
  <text x="860" y="113" font-size="10" fill="#2d6a34" text-anchor="middle">OAuth 2.0 framework</text>
  <text x="860" y="126" font-size="10" fill="#2d6a34" text-anchor="middle">+ Bearer Token Usage</text>

  <!-- extension decade -->
  <text x="1040" y="70" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">The extension decade</text>
  <circle cx="980" cy="190" r="5" fill="#8a5a1c"/>
  <circle cx="1040" cy="190" r="5" fill="#8a5a1c"/>
  <circle cx="1100" cy="190" r="5" fill="#8a5a1c"/>
  <line x1="980" y1="184" x2="980" y2="88" stroke="#8a5a1c" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="1040" y1="184" x2="1040" y2="88" stroke="#8a5a1c" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="1100" y1="184" x2="1100" y2="88" stroke="#8a5a1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1040" y="100" font-size="9.5" fill="#8a5a1c" text-anchor="middle">2012-2025: PKCE, JWT, DPoP,</text>
  <text x="1040" y="113" font-size="9.5" fill="#8a5a1c" text-anchor="middle">PAR/JAR, mTLS, device flow</text>

  <line x1="980" y1="196" x2="980" y2="230" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="1040" y1="196" x2="1040" y2="230" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="1100" y1="196" x2="1100" y2="230" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1040" y="246" font-size="9.5" fill="#666666" text-anchor="middle">around twenty RFCs total --</text>
  <text x="1040" y="259" font-size="9.5" fill="#666666" text-anchor="middle">see the table in this page</text>

  <!-- 2.1 draft -->
  <circle cx="1240" cy="190" r="7" fill="#a33"/>
  <line x1="1240" y1="184" x2="1240" y2="85" stroke="#a33" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1240" y="70" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">draft-ietf-oauth-v2-1-16</text>
  <text x="1240" y="100" font-size="10" fill="#a33" text-anchor="middle">3 Sep 2026</text>
  <text x="1240" y="113" font-size="10" fill="#a33" text-anchor="middle">Internet-Draft, WG document</text>
  <text x="1240" y="126" font-size="10" fill="#a33" text-anchor="middle">(NOT a published standard)</text>

  <rect x="40" y="300" width="1260" height="46" fill="#fbecec" stroke="#a33" stroke-width="1"/>
  <text x="670" y="318" font-size="10.5" fill="#a33" text-anchor="middle" font-weight="bold">OAuth 2.1 is still an Internet-Draft as of this page's writing</text>
  <text x="670" y="333" font-size="10" fill="#333333" text-anchor="middle">milestone "submit to IESG": December 2026 -- it consolidates existing practice, it does not replace RFC 6749</text>
</svg>
