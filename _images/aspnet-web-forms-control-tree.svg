<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="340" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Web Forms control tree</text>
  <text x="390" y="48" font-size="11.5" fill="#555555" text-anchor="middle">Every element with runat="server" becomes a node the Page walks during its life cycle</text>

  <!-- Page root -->
  <rect x="310" y="65" width="160" height="50" rx="6" fill="#eeeeee" stroke="#555555" stroke-width="2"/>
  <text x="390" y="88" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Page</text>
  <text x="390" y="104" font-size="10" fill="#555555" text-anchor="middle">Controls collection</text>

  <path d="M390 115 L390 135 M390 135 L170 135 M390 135 L390 155 M390 135 L610 135" stroke="#888888" stroke-width="2" fill="none"/>
  <path d="M170 135 L170 155" stroke="#888888" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M390 135 L390 155" stroke="#888888" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M610 135 L610 155" stroke="#888888" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Master page -->
  <rect x="90" y="158" width="160" height="60" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="170" y="182" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Master page</text>
  <text x="170" y="198" font-size="10" fill="#1c4b73" text-anchor="middle">ContentPlaceHolder</text>
  <text x="170" y="211" font-size="10" fill="#1c4b73" text-anchor="middle">Init/Load before the page</text>

  <!-- HtmlForm -->
  <rect x="310" y="158" width="160" height="60" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="390" y="182" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">HtmlForm</text>
  <text x="390" y="198" font-size="10" fill="#2f5424" text-anchor="middle">runat="server" form</text>
  <text x="390" y="211" font-size="10" fill="#2f5424" text-anchor="middle">carries postback data</text>

  <!-- User control -->
  <rect x="530" y="158" width="160" height="60" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="610" y="182" font-size="12.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">User control</text>
  <text x="610" y="198" font-size="10" fill="#8a3d10" text-anchor="middle">.ascx (INamingContainer)</text>
  <text x="610" y="211" font-size="10" fill="#8a3d10" text-anchor="middle">its own ID namespace</text>

  <!-- children of HtmlForm -->
  <path d="M390 218 L390 235 M390 235 L300 235 M390 235 L480 235" stroke="#888888" stroke-width="2" fill="none"/>
  <path d="M300 235 L300 250" stroke="#888888" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M480 235 L480 250" stroke="#888888" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="220" y="253" width="160" height="60" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="300" y="278" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">GridView</text>
  <text x="300" y="294" font-size="9.5" fill="#1c4b73" text-anchor="middle">data-bound composite</text>
  <text x="300" y="306" font-size="9.5" fill="#1c4b73" text-anchor="middle">control -&gt; row templates</text>

  <rect x="400" y="253" width="160" height="60" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="480" y="278" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">TextBox / Button</text>
  <text x="480" y="294" font-size="9.5" fill="#1c4b73" text-anchor="middle">HtmlControl or</text>
  <text x="480" y="306" font-size="9.5" fill="#1c4b73" text-anchor="middle">WebControl leaf nodes</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888888"/>
    </marker>
  </defs>
</svg>
