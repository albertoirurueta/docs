<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Frames, groups and sections compared</text>
  <rect x="20" y="50" width="226" height="320" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="257" y="50" width="226" height="320" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
  <rect x="494" y="50" width="246" height="320" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="133" y="76" font-size="15" font-weight="bold" fill="#3730A3" text-anchor="middle">Frame  (F)</text>
  <text x="370" y="76" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Group  (Cmd/Ctrl G)</text>
  <text x="617" y="76" font-size="15" font-weight="bold" fill="#92400E" text-anchor="middle">Section  (Shift S)</text>
  <rect x="73" y="92" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="83" y="104" width="64" height="12" rx="3" fill="#C7D2FE"/><rect x="83" y="124" width="100" height="40" rx="4" fill="#E5E7EB"/><rect x="150" y="170" width="60" height="26" rx="4" fill="#E5E7EB"/>
  <rect x="310" y="92" width="120" height="96" rx="2" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="318" y="100" width="64" height="30" rx="4" fill="#E5E7EB"/><rect x="350" y="140" width="72" height="40" rx="4" fill="#E5E7EB"/>
  <rect x="534" y="92" width="166" height="96" rx="4" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="542" y="106" font-size="10" font-weight="bold" fill="#92400E">Catalogue flow</text>
  <rect x="544" y="114" width="40" height="64" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><rect x="592" y="114" width="40" height="64" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><rect x="640" y="114" width="40" height="64" rx="4" fill="#FFFFFF" stroke="#4F46E5"/>
  <g font-size="12" fill="#374151">
    <text x="32" y="216">Size set by you</text><text x="32" y="236">Fill, stroke, radius, effects</text><text x="32" y="256">Clip content, constraints, auto layout</text><text x="32" y="276">Layout guides, prototype starting point</text><text x="32" y="296">Can nest in frames, groups, sections</text><text x="32" y="316">Top-level frame = a screen or artboard</text>
    <text x="269" y="216">Size follows its children</text><text x="269" y="236">No fill, no clipping, no layout</text><text x="269" y="256">No constraints of its own</text><text x="269" y="276">Cmd/Ctrl G, ungroup Shift Cmd/Ctrl G</text><text x="269" y="296">Nests in frames, groups, sections</text><text x="269" y="316">Quick unit to move or tidy layers</text>
    <text x="506" y="216">Labelled region of the canvas</text><text x="506" y="236">Top level by default</text><text x="506" y="256">Cannot sit inside frames or groups</text><text x="506" y="276">Holds frames, layers, other sections</text><text x="506" y="296">Fill, stroke, share link, Ready for dev</text><text x="506" y="316">Prototype link returns to last frame</text>
  </g>
  <text x="133" y="350" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Use for: screens, components</text>
  <text x="370" y="350" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Use for: tidy sets of layers</text>
  <text x="617" y="350" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Use for: organizing flows</text>
  <text x="380" y="396" font-size="11" fill="#6B7280" text-anchor="middle">Schematic comparison based on the Figma Learn articles checked on 2026-10-30.</text>
</svg>
