<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Topology of the Lumen Press Multisite network</title>
  <desc id="d">Three kinds of address reach the same web server and the same WordPress installation: the main site at lumenpress.example, the Lumen Kids imprint either as a subdirectory (lumenpress.example/kids/) or as a subdomain (kids.lumenpress.example), and the Lumen Noir imprint on its own mapped domain, lumennoir.example. WordPress looks up the domain and path in the wp_blogs table to pick the site. One network (a row in wp_site) holds three sites: site 1 uses the base table prefix wp_, site 2 uses wp_2_ and site 3 uses wp_3_, each with its own uploads folder. All sites share one codebase (plugins and themes, installed only by super admins), the network-activated lumen-catalog plugin, the network-enabled themes, and the global tables for users and the network itself.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8eef4"/>
    </marker>
  </defs>
  <rect width="760" height="600" rx="12" fill="#2b3a4a"/>

  <g font-size="12" fill="#1b2733">
    <rect x="20" y="20" width="230" height="58" rx="8" fill="#cfe3f7"/>
    <text x="32" y="42" font-weight="bold">Main site</text>
    <text x="32" y="62">lumenpress.example/</text>
    <rect x="265" y="20" width="230" height="58" rx="8" fill="#cfe3f7"/>
    <text x="277" y="38" font-weight="bold">Lumen Kids (either form)</text>
    <text x="277" y="56">lumenpress.example/kids/</text>
    <text x="277" y="72">or kids.lumenpress.example</text>
    <rect x="510" y="20" width="230" height="58" rx="8" fill="#cfe3f7"/>
    <text x="522" y="42" font-weight="bold">Lumen Noir (mapped domain)</text>
    <text x="522" y="62">lumennoir.example</text>

    <rect x="20" y="112" width="720" height="70" rx="8" fill="#fbe5c8"/>
    <text x="32" y="134" font-weight="bold">One web server and one WordPress installation (Apache, or nginx with PHP-FPM)</text>
    <text x="32" y="154">wp-config.php: MULTISITE, SUBDOMAIN_INSTALL, DOMAIN_CURRENT_SITE, PATH_CURRENT_SITE, ...</text>
    <text x="32" y="172">ms-settings.php finds the site by domain and path in wp_blogs, then sets the table prefix</text>
  </g>

  <rect x="12" y="206" width="736" height="166" rx="10" fill="#3d5266"/>
  <g stroke="#e8eef4" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="135" y1="78" x2="135" y2="110"/>
    <line x1="380" y1="78" x2="380" y2="110"/>
    <line x1="625" y1="78" x2="625" y2="110"/>
    <line x1="135" y1="182" x2="135" y2="238"/>
    <line x1="380" y1="182" x2="380" y2="238"/>
    <line x1="625" y1="182" x2="625" y2="238"/>
  </g>

  <text x="150" y="226" font-size="12" font-weight="bold" fill="#e8eef4">Network 1 (wp_site)</text>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="240" width="230" height="120" rx="8" fill="#d9ead3"/>
    <text x="32" y="262" font-weight="bold">Site 1: Lumen Press</text>
    <text x="32" y="282">blog_id 1, the main site</text>
    <text x="32" y="300">tables wp_posts, wp_options, ...</text>
    <text x="32" y="318">uploads: wp-content/uploads/</text>
    <text x="32" y="336">theme: lumen</text>
    <rect x="265" y="240" width="230" height="120" rx="8" fill="#d9ead3"/>
    <text x="277" y="262" font-weight="bold">Site 2: Lumen Kids</text>
    <text x="277" y="282">blog_id 2</text>
    <text x="277" y="300">tables wp_2_posts, wp_2_options, ...</text>
    <text x="277" y="318">uploads: uploads/sites/2/</text>
    <text x="277" y="336">theme: lumen-child</text>
    <rect x="510" y="240" width="230" height="120" rx="8" fill="#d9ead3"/>
    <text x="522" y="262" font-weight="bold">Site 3: Lumen Noir</text>
    <text x="522" y="282">blog_id 3, domain lumennoir.example</text>
    <text x="522" y="300">tables wp_3_posts, wp_3_options, ...</text>
    <text x="522" y="318">uploads: uploads/sites/3/</text>
    <text x="522" y="336">theme: lumen-child</text>
  </g>

  <g stroke="#e8eef4" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="255" y1="420" x2="255" y2="374"/>
    <line x1="505" y1="420" x2="505" y2="374"/>
  </g>

  <g font-size="12" fill="#1b2733">
    <rect x="20" y="422" width="355" height="160" rx="8" fill="#e6dcf2"/>
    <text x="32" y="444" font-weight="bold">Shared code (wp-content, one copy)</text>
    <text x="32" y="464">plugins/ and themes/: installed and updated</text>
    <text x="32" y="482">only by super admins</text>
    <text x="32" y="502">lumen-catalog: network-activated, runs on</text>
    <text x="32" y="520">every site (active_sitewide_plugins)</text>
    <text x="32" y="540">lumen, lumen-child: network-enabled themes</text>
    <text x="32" y="558">(allowedthemes); each site picks one</text>
    <rect x="385" y="422" width="355" height="160" rx="8" fill="#f7d6d6"/>
    <text x="397" y="444" font-weight="bold">Global tables (base prefix wp_)</text>
    <text x="397" y="464">wp_users, wp_usermeta: one account for every</text>
    <text x="397" y="482">site; a role per site (wp_2_capabilities, ...)</text>
    <text x="397" y="502">wp_site, wp_sitemeta: the network and its options</text>
    <text x="397" y="520">(site_admins, registration, upload limits)</text>
    <text x="397" y="540">wp_blogs, wp_blogmeta: each site's domain and path</text>
    <text x="397" y="558">wp_signups, wp_registration_log</text>
  </g>
</svg>
