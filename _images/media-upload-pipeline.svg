<svg viewBox="0 0 900 400" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Media upload pipeline: direct upload, queue, workers, status</text>

  <rect x="30" y="150" width="110" height="60" rx="8" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="85" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Client</text>
  <text x="85" y="194" text-anchor="middle" font-size="11" fill="#7a4800">web or app</text>

  <rect x="200" y="60" width="130" height="60" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="265" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Media API</text>
  <text x="265" y="104" text-anchor="middle" font-size="11" fill="#1f5fa6">pre-signed URL, status</text>

  <rect x="200" y="240" width="130" height="60" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="265" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">Object storage</text>
  <text x="265" y="284" text-anchor="middle" font-size="11" fill="#2b7a2b">uploads/ and media/</text>

  <rect x="400" y="150" width="120" height="60" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="460" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Queue</text>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#4a1d75">plus dead-letter queue</text>

  <rect x="590" y="150" width="140" height="60" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="660" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Workers</text>
  <text x="660" y="194" text-anchor="middle" font-size="11" fill="#1f5fa6">images, BlurHash, video</text>

  <rect x="590" y="60" width="140" height="60" rx="8" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="660" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Database</text>
  <text x="660" y="104" text-anchor="middle" font-size="11" fill="#7a4800">status, variants, blurhash</text>

  <rect x="760" y="240" width="110" height="60" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="815" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">CDN</text>
  <text x="815" y="284" text-anchor="middle" font-size="11" fill="#2b7a2b">serves variants</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M110,150 L200,100"/>
    <path d="M140,195 L200,255"/>
    <path d="M330,270 L420,212"/>
    <path d="M520,180 L590,180"/>
    <path d="M660,150 L660,122"/>
    <path d="M630,212 L330,285" stroke-dasharray="5 4"/>
    <path d="M730,200 L790,240"/>
    <path d="M590,95 L332,92" stroke-dasharray="5 4"/>
  </g>
  <text x="30" y="112" font-size="11" fill="#333">1 request URL</text>
  <text x="120" y="250" font-size="11" fill="#333">2 PUT file</text>
  <text x="338" y="236" font-size="11" fill="#333">3 storage event</text>
  <text x="525" y="172" font-size="11" fill="#333">4 job</text>
  <text x="668" y="138" font-size="11" fill="#333">5 status</text>
  <text x="470" y="284" font-size="11" fill="#333">writes variants</text>
  <text x="755" y="224" font-size="11" fill="#333">6 GET</text>
  <text x="440" y="84" font-size="11" fill="#333">client polls or gets a webhook</text>

  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#333">The upload never passes through the API, and no transcoding happens inside an HTTP request.</text>
  <text x="450" y="365" text-anchor="middle" font-size="12" fill="#333">Workers are idempotent, retry with backoff, and send exhausted jobs to the dead-letter queue.</text>
</svg>
