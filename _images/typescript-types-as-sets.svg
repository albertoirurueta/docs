<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <text x="350" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Types as sets of values</text>
  <text x="350" y="48" font-size="12" fill="#666666" text-anchor="middle">a type is the set of values you can assign to it; assignability is the subset relation</text>

  <!-- nested Euler ovals, cx = 250 -->
  <ellipse cx="250" cy="235" rx="228" ry="160" fill="none" stroke="#999999" stroke-width="1.6"/>
  <ellipse cx="250" cy="252" rx="182" ry="128" fill="none" stroke="#1c4b73" stroke-width="1.6"/>
  <ellipse cx="250" cy="268" rx="134" ry="98" fill="none" stroke="#2f5424" stroke-width="1.6"/>
  <ellipse cx="250" cy="284" rx="84" ry="62" fill="none" stroke="#8a3d10" stroke-width="1.6"/>
  <ellipse cx="250" cy="298" rx="38" ry="26" fill="none" stroke="#7a2f6a" stroke-width="1.6"/>

  <!-- labels near the top of each oval -->
  <g text-anchor="middle" font-family="'Courier New', monospace">
    <text x="250" y="96" font-size="13" font-weight="bold" fill="#666666">unknown</text>
    <text x="250" y="144" font-size="13" font-weight="bold" fill="#1c4b73">string</text>
    <text x="250" y="189" font-size="13" font-weight="bold" fill="#2f5424">'a' | 'b'</text>
    <text x="250" y="240" font-size="13" font-weight="bold" fill="#8a3d10">'a'</text>
    <text x="250" y="296" font-size="12" font-weight="bold" fill="#7a2f6a">never</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#444444">
    <text x="250" y="110">top type: every value</text>
    <text x="250" y="158">primitive</text>
    <text x="250" y="203">union</text>
    <text x="250" y="254">literal</text>
    <text x="250" y="309" font-size="9" fill="#7a2f6a">(empty)</text>
  </g>

  <!-- side notes: set operators -->
  <text x="500" y="112" font-size="13" font-weight="bold" fill="#222222">Set operators</text>

  <text x="505" y="142" font-size="13" font-weight="bold" fill="#7a2f6a" font-family="'Courier New', monospace">A &amp; B</text>
  <g font-size="12" fill="#444444">
    <text x="505" y="160">intersection</text>
    <text x="505" y="176">= the overlap</text>
    <text x="505" y="192">narrows</text>
  </g>

  <text x="505" y="232" font-size="13" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">A | B</text>
  <g font-size="12" fill="#444444">
    <text x="505" y="250">union</text>
    <text x="505" y="266">= combined area</text>
    <text x="505" y="282">widens</text>
  </g>

  <text x="505" y="330" font-size="12" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">A extends B</text>
  <g font-size="12" fill="#444444">
    <text x="505" y="348" font-family="'Courier New', monospace">&#8776; A &#8834; B</text>
    <text x="505" y="364">every A is a B</text>
  </g>

  <text x="250" y="412" font-size="11" fill="#666666" text-anchor="middle">narrowing shrinks the set &#8594; widening grows it</text>
</svg>
