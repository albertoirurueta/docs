<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Two media paths for WordPress uploads on Kubernetes: S3 offload and a shared EFS volume</title>
  <desc id="d">Top lane, S3 offload: an editor uploads a file through a WordPress pod. The offload plugin writes the original and its image sizes to the S3 bucket using the pod's IAM role through EKS Pod Identity. A visitor requests the path /wp-content/uploads through CloudFront on media.lumenpress.example, and CloudFront reads the object from the private bucket with origin access control, without touching a pod. Bottom lane, shared file system: every WordPress pod mounts the same EFS access point as a ReadWriteMany volume at wp-content/uploads with user ID 33. The upload is written to EFS by one pod and read by all others. A visitor request reaches nginx in a pod through CloudFront and the load balancer, and nginx serves the file from EFS. A footer notes that PHP code, plugins and themes never go on EFS because they come from the image, and that a Kubernetes Job regenerates image sizes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="12" fill="#2b3a4a"/>

  <!-- Lane 1 -->
  <rect x="20" y="20" width="920" height="214" rx="10" fill="#33485c"/>
  <text x="36" y="46" font-size="16" font-weight="bold" fill="#f4b860">A. Offload to S3 (recommended for new sites)</text>

  <rect x="36" y="64" width="150" height="56" rx="8" fill="#3d5266"/>
  <text x="48" y="86" font-size="12" font-weight="bold" fill="#f2f5f8">Editor</text>
  <text x="48" y="104" font-size="12" fill="#f2f5f8">uploads an image</text>
  <rect x="236" y="64" width="190" height="56" rx="8" fill="#6f8aa3"/>
  <text x="248" y="86" font-size="12" font-weight="bold" fill="#f2f5f8">WordPress pod</text>
  <text x="248" y="104" font-size="12" fill="#f2f5f8">creates the sub-sizes</text>
  <rect x="476" y="64" width="190" height="56" rx="8" fill="#6f8aa3"/>
  <text x="488" y="86" font-size="12" font-weight="bold" fill="#f2f5f8">Offload plugin</text>
  <text x="488" y="104" font-size="12" fill="#f2f5f8">PutObject, rewrites URLs</text>
  <rect x="716" y="64" width="208" height="56" rx="8" fill="#c9b3e6"/>
  <text x="728" y="86" font-size="12" font-weight="bold" fill="#1b2733">S3 lumenpress-prod-media</text>
  <text x="728" y="104" font-size="12" fill="#1b2733">private, versioned</text>
  <line x1="186" y1="92" x2="232" y2="92" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="426" y1="92" x2="472" y2="92" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="666" y1="92" x2="712" y2="92" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="476" y="140" font-size="12" fill="#9fd3c7">pod IAM role (EKS Pod Identity), no keys</text>

  <rect x="36" y="160" width="150" height="56" rx="8" fill="#3d5266"/>
  <text x="48" y="182" font-size="12" font-weight="bold" fill="#f2f5f8">Visitor</text>
  <text x="48" y="200" font-size="12" fill="#f2f5f8">GET /wp-content/uploads</text>
  <rect x="476" y="160" width="190" height="56" rx="8" fill="#4d7c5a"/>
  <text x="488" y="182" font-size="12" font-weight="bold" fill="#f2f5f8">CloudFront</text>
  <text x="488" y="200" font-size="12" fill="#f2f5f8">media.lumenpress.example</text>
  <line x1="186" y1="188" x2="472" y2="188" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="666" y1="188" x2="820" y2="188" stroke="#f4b860" stroke-width="2"/>
  <line x1="820" y1="188" x2="820" y2="124" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="680" y="178" font-size="12" fill="#f4b860">origin access control</text>
  <text x="236" y="178" font-size="12" fill="#9fd3c7">no pod involved</text>

  <!-- Lane 2 -->
  <rect x="20" y="246" width="920" height="214" rx="10" fill="#33485c"/>
  <text x="36" y="272" font-size="16" font-weight="bold" fill="#f4b860">B. Shared EFS volume (when plugins expect a real directory)</text>

  <rect x="36" y="290" width="150" height="56" rx="8" fill="#3d5266"/>
  <text x="48" y="312" font-size="12" font-weight="bold" fill="#f2f5f8">Editor</text>
  <text x="48" y="330" font-size="12" fill="#f2f5f8">uploads an image</text>
  <rect x="236" y="290" width="190" height="56" rx="8" fill="#6f8aa3"/>
  <text x="248" y="312" font-size="12" font-weight="bold" fill="#f2f5f8">Any web pod</text>
  <text x="248" y="330" font-size="12" fill="#f2f5f8">writes to the mount</text>
  <rect x="476" y="290" width="190" height="56" rx="8" fill="#6f8aa3"/>
  <text x="488" y="312" font-size="12" font-weight="bold" fill="#f2f5f8">PVC ReadWriteMany</text>
  <text x="488" y="330" font-size="12" fill="#f2f5f8">EFS CSI driver, TLS mount</text>
  <rect x="716" y="290" width="208" height="56" rx="8" fill="#c9b3e6"/>
  <text x="728" y="312" font-size="12" font-weight="bold" fill="#1b2733">EFS access point</text>
  <text x="728" y="330" font-size="12" fill="#1b2733">uid 33, gid 33, mode 0775</text>
  <line x1="186" y1="318" x2="232" y2="318" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="426" y1="318" x2="472" y2="318" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="666" y1="318" x2="712" y2="318" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="36" y="386" width="150" height="56" rx="8" fill="#3d5266"/>
  <text x="48" y="408" font-size="12" font-weight="bold" fill="#f2f5f8">Visitor</text>
  <text x="48" y="426" font-size="12" fill="#f2f5f8">GET /wp-content/uploads</text>
  <rect x="236" y="386" width="190" height="56" rx="8" fill="#4d7c5a"/>
  <text x="248" y="408" font-size="12" font-weight="bold" fill="#f2f5f8">CloudFront + load balancer</text>
  <text x="248" y="426" font-size="12" fill="#f2f5f8">cached after the first hit</text>
  <rect x="476" y="386" width="190" height="56" rx="8" fill="#6f8aa3"/>
  <text x="488" y="408" font-size="12" font-weight="bold" fill="#f2f5f8">nginx in a pod</text>
  <text x="488" y="426" font-size="12" fill="#f2f5f8">serves the file from the mount</text>
  <line x1="186" y1="414" x2="232" y2="414" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="426" y1="414" x2="472" y2="414" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="666" y1="414" x2="820" y2="414" stroke="#f4b860" stroke-width="2"/>
  <line x1="820" y1="414" x2="820" y2="350" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <text x="690" y="404" font-size="12" fill="#f4b860">read through the mount</text>

  <!-- Footer -->
  <rect x="20" y="472" width="920" height="32" rx="8" fill="#7a5c3a"/>
  <text x="36" y="493" font-size="12" font-weight="bold" fill="#f2f5f8">Never on EFS or S3: PHP code, plugins and themes (they ship in the image). Job lumenpress-media-regenerate rebuilds image sizes.</text>
</svg>
