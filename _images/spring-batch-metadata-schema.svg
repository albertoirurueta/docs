<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Spring Batch metadata schema</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">one job instance, many executions; one job execution, many step executions</text>

  <!-- BATCH_JOB_INSTANCE -->
  <rect x="40" y="70" width="250" height="76" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="52" y="90" font-size="13" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">BATCH_JOB_INSTANCE</text>
  <text x="52" y="108" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_INSTANCE_ID (PK)</text>
  <text x="52" y="124" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_NAME, JOB_KEY</text>
  <text x="52" y="140" font-size="10.5" fill="#666666">job name + hash of identifying params</text>

  <!-- BATCH_JOB_EXECUTION -->
  <rect x="40" y="196" width="250" height="92" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="52" y="216" font-size="13" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">BATCH_JOB_EXECUTION</text>
  <text x="52" y="234" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_EXECUTION_ID (PK)</text>
  <text x="52" y="250" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_INSTANCE_ID (FK)</text>
  <text x="52" y="266" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">STATUS, EXIT_CODE</text>
  <text x="52" y="282" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">START_TIME, END_TIME</text>

  <!-- BATCH_STEP_EXECUTION -->
  <rect x="40" y="338" width="250" height="108" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="52" y="358" font-size="13" font-weight="bold" fill="#1c4b73" font-family="'Courier New', monospace">BATCH_STEP_EXECUTION</text>
  <text x="52" y="376" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">STEP_EXECUTION_ID (PK)</text>
  <text x="52" y="392" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_EXECUTION_ID (FK)</text>
  <text x="52" y="408" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">STEP_NAME, STATUS</text>
  <text x="52" y="424" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">READ_COUNT, WRITE_COUNT</text>
  <text x="52" y="440" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">COMMIT_COUNT, ROLLBACK_COUNT</text>

  <!-- right column -->
  <rect x="430" y="196" width="290" height="60" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="442" y="216" font-size="12.5" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">BATCH_JOB_EXECUTION_PARAMS</text>
  <text x="442" y="234" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_EXECUTION_ID (FK)</text>
  <text x="442" y="250" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">PARAMETER_NAME/TYPE/VALUE, IDENTIFYING</text>

  <rect x="430" y="276" width="290" height="52" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="442" y="296" font-size="12.5" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">BATCH_JOB_EXECUTION_CONTEXT</text>
  <text x="442" y="314" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">JOB_EXECUTION_ID (PK/FK), SERIALIZED_CONTEXT</text>

  <rect x="430" y="368" width="290" height="52" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="442" y="388" font-size="12.5" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">BATCH_STEP_EXECUTION_CONTEXT</text>
  <text x="442" y="406" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">STEP_EXECUTION_ID (PK/FK), SERIALIZED_CONTEXT</text>

  <!-- relations -->
  <line x1="165" y1="146" x2="165" y2="196" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="176" y="176" font-size="11" fill="#1c4b73">1 : N</text>
  <line x1="165" y1="288" x2="165" y2="338" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="176" y="318" font-size="11" fill="#1c4b73">1 : N</text>

  <line x1="290" y1="226" x2="430" y2="226" stroke="#2f5424" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="330" y="220" font-size="10.5" fill="#2f5424">1 : N</text>
  <line x1="290" y1="256" x2="430" y2="300" stroke="#2f5424" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="330" y="284" font-size="10.5" fill="#2f5424">1 : 1</text>
  <line x1="290" y1="392" x2="430" y2="392" stroke="#2f5424" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="330" y="386" font-size="10.5" fill="#2f5424">1 : 1</text>

  <!-- sequences -->
  <rect x="40" y="480" width="680" height="50" fill="#f9f9f9" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="500" font-size="12" font-weight="bold" fill="#222222">Sequences</text>
  <text x="52" y="518" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">BATCH_JOB_SEQ &#183; BATCH_JOB_EXECUTION_SEQ &#183; BATCH_STEP_EXECUTION_SEQ</text>
</svg>
