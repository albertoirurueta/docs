<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From camera image and IMU to a virtual camera</text>
<rect x="20" y="56" width="150" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="78.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Camera image</text>
<text x="95.0" y="95.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">frames at 30 to 60 Hz</text>
<rect x="20" y="124" width="150" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="146.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">IMU samples</text>
<text x="95.0" y="163.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gyro, accelerometer</text>
<rect x="220" y="80" width="170" height="78" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="305.0" y="107.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Tracking</text>
<text x="305.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">feature tracking plus</text>
<text x="305.0" y="140.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">inertial (VIO, SLAM)</text>
<rect x="440" y="80" width="150" height="78" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="515.0" y="107.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">World model</text>
<text x="515.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">camera pose, planes,</text>
<text x="515.0" y="140.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">anchors, depth</text>
<rect x="620" y="80" width="120" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="680.0" y="107.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Virtual camera</text>
<text x="680.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">inverse pose,</text>
<text x="680.0" y="140.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">projection from K</text>
<line x1="170" y1="82" x2="218" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arc)"/>
<line x1="170" y1="150" x2="218" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arc)"/>
<line x1="390" y1="119" x2="438" y2="119" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arc)"/>
<line x1="590" y1="119" x2="618" y2="119" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arc)"/>
<rect x="60" y="214" width="640" height="66" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="235.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Render pass order</text>
<text x="380.0" y="252.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">1. draw the camera image as a full-screen background (no depth write)</text>
<text x="380.0" y="268.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">2. draw virtual content with the virtual camera, depth test on, then composite</text>
<path d="M680,160 C 680,190 680,190 680,212" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arc)"/>
<text x="380" y="312" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Pinhole projection with intrinsics K (pixels)</text>
<rect x="40" y="326" width="330" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="205.0" y="356.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">u = fx * X / Z + cx</text>
<text x="205.0" y="372.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v = fy * Y / Z + cy</text>
<text x="205.0" y="388.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(X, Y, Z) in camera space, Z in front</text>
<rect x="400" y="326" width="320" height="84" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="560.0" y="348.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Parameters</text>
<text x="560.0" y="365.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fx, fy: focal length in pixels</text>
<text x="560.0" y="381.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">cx, cy: principal point in pixels</text>
<text x="560.0" y="397.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">update after cropping or rotation</text>
</svg>
