<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>How a fiber scheduler runs non-blocking fibers</title>
  <desc>Inside one thread, several non-blocking fibers created by Fiber.schedule run until they reach a blocking operation such as sleep, an IO wait, Queue pop or Mutex lock. Ruby calls the matching scheduler hook, kernel_sleep, io_wait or block. The scheduler records what the fiber waits for and calls Fiber.yield. The event loop, started when the thread exits, waits for the nearest timer or a ready descriptor, then resumes the fibers that can continue. Control goes back to those fibers, which run until their next blocking operation or until they finish.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">How a fiber scheduler runs non-blocking fibers</text>
  <text x="470" y="50" font-size="12" fill="#666666" text-anchor="middle">Everything happens in one thread: the scheduler and its fibers take turns</text>

  <rect x="30" y="80" width="250" height="150" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="155" y="104" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Non-blocking fibers</text>
  <text x="155" y="126" font-size="12" fill="#222222" text-anchor="middle">Fiber.schedule { ... }</text>
  <text x="155" y="146" font-size="12" fill="#222222" text-anchor="middle">run until a blocking call:</text>
  <text x="155" y="166" font-size="12" fill="#222222" text-anchor="middle">sleep, IO read or write,</text>
  <text x="155" y="186" font-size="12" fill="#222222" text-anchor="middle">Queue#pop, Mutex#lock,</text>
  <text x="155" y="206" font-size="12" fill="#222222" text-anchor="middle">Thread#join, Timeout</text>

  <rect x="345" y="80" width="250" height="150" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="470" y="104" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Scheduler hooks</text>
  <text x="470" y="126" font-size="12" fill="#222222" text-anchor="middle">kernel_sleep(duration)</text>
  <text x="470" y="146" font-size="12" fill="#222222" text-anchor="middle">io_wait(io, events, timeout)</text>
  <text x="470" y="166" font-size="12" fill="#222222" text-anchor="middle">block(blocker, timeout) / unblock</text>
  <text x="470" y="186" font-size="12" fill="#222222" text-anchor="middle">timeout_after, process_wait, ...</text>
  <text x="470" y="210" font-size="11" fill="#666666" text-anchor="middle">record what the fiber waits for, then Fiber.yield</text>

  <rect x="660" y="80" width="250" height="150" rx="8" fill="#eef5ea" stroke="#3b6b2a" stroke-width="1.5"/>
  <text x="785" y="104" font-size="14" font-weight="bold" fill="#3b6b2a" text-anchor="middle">Waiting tables</text>
  <text x="785" y="128" font-size="12" fill="#222222" text-anchor="middle">timers: fiber to deadline</text>
  <text x="785" y="148" font-size="12" fill="#222222" text-anchor="middle">IO set: descriptor to fiber</text>
  <text x="785" y="168" font-size="12" fill="#222222" text-anchor="middle">ready list: fibers to resume</text>
  <text x="785" y="188" font-size="12" fill="#222222" text-anchor="middle">(unblock may come from</text>
  <text x="785" y="206" font-size="12" fill="#222222" text-anchor="middle">another thread)</text>

  <line x1="282" y1="155" x2="343" y2="155" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="313" y="146" font-size="11" fill="#444444" text-anchor="middle">1</text>
  <line x1="597" y1="155" x2="658" y2="155" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="628" y="146" font-size="11" fill="#444444" text-anchor="middle">2</text>

  <rect x="200" y="330" width="540" height="140" rx="8" fill="#fdf3e3" stroke="#a5661a" stroke-width="1.5"/>
  <text x="470" y="356" font-size="14" font-weight="bold" fill="#a5661a" text-anchor="middle">Event loop (scheduler.close, run when the thread exits)</text>
  <text x="470" y="382" font-size="12" fill="#222222" text-anchor="middle">while any fiber is waiting:</text>
  <text x="470" y="402" font-size="12" fill="#222222" text-anchor="middle">wait for the nearest deadline or a ready descriptor (IO.select, epoll, kqueue)</text>
  <text x="470" y="422" font-size="12" fill="#222222" text-anchor="middle">move the fibers whose timer expired or whose IO is ready to the ready list</text>
  <text x="470" y="442" font-size="12" fill="#222222" text-anchor="middle">fiber.resume for each of them, until it blocks again or finishes</text>

  <path d="M785,232 L785,300 L700,300 L700,328" fill="none" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="838" y="300" font-size="11" fill="#444444" text-anchor="middle">3 loop reads them</text>

  <path d="M198,400 L100,400 L100,234" fill="none" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="100" y="296" font-size="11" fill="#444444" text-anchor="start" transform="translate(8 0)">4 resume</text>
  <text x="100" y="312" font-size="11" fill="#444444" text-anchor="start" transform="translate(8 0)">control</text>
  <text x="100" y="328" font-size="11" fill="#444444" text-anchor="start" transform="translate(8 0)">returns to</text>
  <text x="100" y="344" font-size="11" fill="#444444" text-anchor="start" transform="translate(8 0)">the fiber</text>
</svg>
