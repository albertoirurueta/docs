<svg viewBox="0 0 740 300" width="740" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="740" height="300" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One style, many layers: the Bookshelf style types</text>
<rect x="20" y="50" width="160" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Color style</text>
<rect x="40" y="90" width="50" height="50" rx="6" fill="#4F46E5"/><rect x="100" y="90" width="50" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="100" y="165" text-anchor="middle" font-size="12" fill="#374151">fills, strokes, gradients</text>
<text x="100" y="183" text-anchor="middle" font-size="12" fill="#374151">brand/primary</text>
<rect x="195" y="50" width="160" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Text style</text>
<text x="275" y="118" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2937">Aa</text>
<text x="275" y="165" text-anchor="middle" font-size="12" fill="#374151">font, size, line height</text>
<text x="275" y="183" text-anchor="middle" font-size="12" fill="#374151">type/book-title</text>
<rect x="370" y="50" width="160" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="450" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Effect style</text>
<rect x="415" y="92" width="70" height="46" rx="6" fill="#E5E7EB"/><rect x="410" y="88" width="70" height="46" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="450" y="165" text-anchor="middle" font-size="12" fill="#374151">shadows, blurs, texture</text>
<text x="450" y="183" text-anchor="middle" font-size="12" fill="#374151">elevation/card</text>
<rect x="545" y="50" width="175" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="632" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Layout guide style</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#E5E7EB"><rect x="580" y="90" width="12" height="50"/><rect x="600" y="90" width="12" height="50"/><rect x="620" y="90" width="12" height="50"/><rect x="640" y="90" width="12" height="50"/><rect x="660" y="90" width="12" height="50"/></g>
<text x="632" y="165" text-anchor="middle" font-size="12" fill="#374151">rows, columns, grids</text>
<text x="632" y="183" text-anchor="middle" font-size="12" fill="#374151">grid/catalogue-4col</text>
<line x1="370" y1="204" x2="370" y2="232" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150" y="236" width="440" height="44" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="370" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Edit the style once</text>
<text x="370" y="271" text-anchor="middle" font-size="12" fill="#92400E">every layer that uses it in the file updates</text>
</svg>
