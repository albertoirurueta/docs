<svg viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Ways to reach the bookshelf-catalog instance</text>

  <!-- clients column -->
  <rect x="20" y="60" width="190" height="64" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">Cloud Run catalog-api</text>
  <text x="115" y="106" text-anchor="middle" font-size="10.5" fill="#14572f">Java connector, Unix socket</text>

  <rect x="20" y="150" width="190" height="64" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="115" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">GKE pod</text>
  <text x="115" y="196" text-anchor="middle" font-size="10.5" fill="#14572f">Auth Proxy sidecar, WIF for GKE</text>

  <rect x="20" y="240" width="190" height="64" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="115" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">Compute Engine VM</text>
  <text x="115" y="286" text-anchor="middle" font-size="10.5" fill="#14572f">Direct private IP, TLS</text>

  <rect x="20" y="330" width="190" height="64" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="115" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Admin laptop</text>
  <text x="115" y="376" text-anchor="middle" font-size="10.5" fill="#3c4a58">Auth Proxy via IAP tunnel</text>

  <!-- middle: paths -->
  <rect x="300" y="60" width="250" height="334" rx="12" fill="#eef4fd" stroke="#1a5fb4" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="425" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Your VPC network</text>
  <rect x="320" y="100" width="210" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="425" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Private services access</text>
  <text x="425" y="146" text-anchor="middle" font-size="10.5" fill="#123a72">VPC peering, reserved /16 range</text>
  <rect x="320" y="190" width="210" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="425" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Private Service Connect</text>
  <text x="425" y="236" text-anchor="middle" font-size="10.5" fill="#123a72">endpoint IP + service attachment</text>
  <rect x="320" y="280" width="210" height="90" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
  <text x="425" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4e0a">Public IP (avoid)</text>
  <text x="425" y="324" text-anchor="middle" font-size="10.5" fill="#7a4e0a">authorized networks or proxy only,</text>
  <text x="425" y="340" text-anchor="middle" font-size="10.5" fill="#7a4e0a">needed for no VPC path at all</text>

  <!-- arrows clients to middle -->
  <line x1="210" y1="92" x2="316" y2="132" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="316,126 326,132 316,138" fill="#3c4a58"/>
  <line x1="210" y1="182" x2="316" y2="212" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="316,207 326,212 316,217" fill="#3c4a58"/>
  <line x1="210" y1="272" x2="316" y2="145" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="311,146 320,142 315,152" fill="#3c4a58"/>
  <line x1="210" y1="362" x2="316" y2="320" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="316,315 326,320 316,325" fill="#3c4a58"/>

  <!-- instance -->
  <rect x="650" y="150" width="230" height="140" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="765" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#123a72">Cloud SQL instance</text>
  <text x="765" y="200" text-anchor="middle" font-size="11" fill="#123a72">bookshelf-catalog (PostgreSQL 18)</text>
  <text x="765" y="222" text-anchor="middle" font-size="10.5" fill="#123a72">Google-managed project and VPC</text>
  <text x="765" y="240" text-anchor="middle" font-size="10.5" fill="#123a72">TLS 1.3 on port 3307 for the proxy</text>
  <text x="765" y="258" text-anchor="middle" font-size="10.5" fill="#123a72">Database or IAM authentication</text>

  <line x1="530" y1="132" x2="646" y2="190" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="640,184 650,192 637,194" fill="#3c4a58"/>
  <line x1="530" y1="222" x2="646" y2="222" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="640,217 650,222 640,227" fill="#3c4a58"/>
  <line x1="530" y1="325" x2="646" y2="262" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="636,261 650,258 642,270" fill="#3c4a58"/>
</svg>
