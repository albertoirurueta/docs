<svg viewBox="0 0 760 520" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <defs>
    <marker id="pipeArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73e8"/>
    </marker>
    <marker id="hitArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#188038"/>
    </marker>
    <marker id="missArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c5221f"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">
    Image Loading Pipeline (Coil / Glide)
  </text>
  <text x="380" y="48" text-anchor="middle" font-size="12.5" fill="#3c4043">
    trail.photoUrl requested by AsyncImage / ImageView.load() / Glide.with(...).load(...)
  </text>

  <!-- Request box -->
  <rect x="20" y="70" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="90" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">1. Request</text>
  <text x="90" y="113" text-anchor="middle" font-size="10.5" fill="#1a3a6b">ImageRequest /</text>
  <text x="90" y="125" text-anchor="middle" font-size="10.5" fill="#1a3a6b">RequestOptions</text>

  <path d="M 160 100 L 200 100" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#pipeArrow)"/>

  <!-- Memory cache decision -->
  <rect x="200" y="70" width="150" height="60" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="2"/>
  <text x="275" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a00">2. Memory cache</text>
  <text x="275" y="109" text-anchor="middle" font-size="10.5" fill="#7a4a00">MemoryCache / Glide</text>
  <text x="275" y="122" text-anchor="middle" font-size="10.5" fill="#7a4a00">memory cache (LRU)</text>

  <!-- hit path straight down to display -->
  <path d="M 275 130 L 275 165 L 600 165 L 600 260"
        fill="none" stroke="#188038" stroke-width="2.2" stroke-dasharray="1,0" marker-end="url(#hitArrow)"/>
  <rect x="480" y="140" width="120" height="24" rx="5" fill="#e6f4ea" stroke="#188038" stroke-width="1"/>
  <text x="540" y="157" text-anchor="middle" font-size="10.5" fill="#0d4c22" font-weight="600">cache hit</text>

  <!-- miss to disk cache -->
  <path d="M 350 100 L 390 100" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#missArrow)"/>
  <text x="370" y="90" text-anchor="middle" font-size="10" fill="#c5221f">miss</text>

  <!-- Disk cache decision -->
  <rect x="390" y="70" width="150" height="60" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="2"/>
  <text x="465" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a00">3. Disk cache</text>
  <text x="465" y="109" text-anchor="middle" font-size="10.5" fill="#7a4a00">DiskCache / Glide</text>
  <text x="465" y="122" text-anchor="middle" font-size="10.5" fill="#7a4a00">DiskLruCache</text>

  <!-- disk hit to decode (down) -->
  <path d="M 465 130 L 465 200" fill="none" stroke="#188038" stroke-width="2.2" marker-end="url(#hitArrow)"/>
  <text x="500" y="170" text-anchor="middle" font-size="10" fill="#0d4c22">hit</text>

  <!-- disk miss to network -->
  <path d="M 540 100 L 590 100 L 590 100" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 540 100 L 620 100" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#missArrow)"/>
  <text x="580" y="90" text-anchor="middle" font-size="10" fill="#c5221f">miss</text>

  <!-- Network box -->
  <rect x="600" y="70" width="140" height="60" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="2"/>
  <text x="670" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#8c1d18">4. Network</text>
  <text x="670" y="109" text-anchor="middle" font-size="10.5" fill="#8c1d18">shared OkHttpClient</text>
  <text x="670" y="122" text-anchor="middle" font-size="10.5" fill="#8c1d18">(coil-network-okhttp)</text>

  <!-- network -> write to disk cache, then down to decode -->
  <path d="M 670 130 L 670 200 L 540 200" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#pipeArrow)"/>
  <text x="670" y="150" text-anchor="middle" font-size="10" fill="#1a3a6b">writes response</text>
  <text x="670" y="163" text-anchor="middle" font-size="10" fill="#1a3a6b">to disk cache</text>

  <!-- Decode box -->
  <rect x="390" y="200" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="465" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">5. Decode</text>
  <text x="465" y="239" text-anchor="middle" font-size="10.5" fill="#1a3a6b">ImageDecoder / Bitmap,</text>
  <text x="465" y="252" text-anchor="middle" font-size="10.5" fill="#1a3a6b">inSampleSize downsizing</text>

  <path d="M 390 230 L 350 230" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#pipeArrow)"/>

  <!-- Transform box -->
  <rect x="200" y="200" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="275" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">6. Transform</text>
  <text x="275" y="239" text-anchor="middle" font-size="10.5" fill="#1a3a6b">circle crop, rounded</text>
  <text x="275" y="252" text-anchor="middle" font-size="10.5" fill="#1a3a6b">corners, grayscale, ...</text>

  <path d="M 200 230 L 160 230" fill="none" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#pipeArrow)"/>

  <!-- Display box -->
  <rect x="20" y="200" width="140" height="60" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="90" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4c22">7. Display</text>
  <text x="90" y="239" text-anchor="middle" font-size="10.5" fill="#0d4c22">ImageView / Image</text>
  <text x="90" y="252" text-anchor="middle" font-size="10.5" fill="#0d4c22">(Compose)</text>

  <!-- memory cache write-back from decode -->
  <path d="M 465 200 L 465 165 L 275 165" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="380" y="180" text-anchor="middle" font-size="9.5" fill="#5f6368">decoded + transformed bitmap is stored back in the memory cache</text>

  <!-- hit path also lands on display -->
  <path d="M 600 260 L 600 290 L 90 290 L 90 260" fill="none" stroke="#188038" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#hitArrow)"/>
  <text x="345" y="304" text-anchor="middle" font-size="9.5" fill="#0d4c22">a memory-cache hit skips decode/transform and displays immediately</text>

  <!-- Legend -->
  <rect x="20" y="340" width="720" height="160" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="40" y="365" font-size="13.5" font-weight="700" fill="#1a1a1a">How to read this figure</text>
  <text x="40" y="388" font-size="11.5" fill="#3c4043">Blue solid arrows: the normal forward path a request takes through the pipeline stages 1-7.</text>
  <text x="40" y="408" font-size="11.5" fill="#3c4043">Green arrows: a cache hit (memory or disk) short-circuits the remaining stages and reuses already-decoded pixels.</text>
  <text x="40" y="428" font-size="11.5" fill="#3c4043">Red dashed arrows: a cache miss falls through to the next, more expensive, stage (disk, then network).</text>
  <text x="40" y="448" font-size="11.5" fill="#3c4043">Both Coil 3 and Glide 5 implement this same shape: an in-memory LRU cache of already-decoded bitmaps, a</text>
  <text x="40" y="466" font-size="11.5" fill="#3c4043">disk cache of raw encoded bytes keyed by URL/signature, a shared OkHttp/HTTP client for the network fetch,</text>
  <text x="40" y="484" font-size="11.5" fill="#3c4043">off-main-thread decoding with downsampling, then optional pixel transformations before the final bitmap is bound to a view or composable.</text>
</svg>
