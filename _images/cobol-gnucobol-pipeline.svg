<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The GnuCOBOL pipeline: a .cob source is preprocessed, parsed and translated to C by cobc, compiled and linked by the C compiler into an executable or a module, and run with the libcob runtime</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="380" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From hello.cob to a running program with GnuCOBOL 3.2</text>
  <text x="470" y="47" font-size="12" fill="#666666" text-anchor="middle">cobc translates COBOL to C and drives the C compiler; the result calls the libcob run-time library</text>

  <rect x="20" y="75" width="470" height="150" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="34" y="96" font-size="13" font-weight="bold" fill="#1c4b73">cobc (the GnuCOBOL compiler driver)</text>

  <rect x="35" y="112" width="100" height="56" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="85" y="135" font-size="13" fill="#222222" text-anchor="middle">Preprocess</text>
  <text x="85" y="153" font-size="11" fill="#444444" text-anchor="middle">COPY, REPLACE</text>
  <rect x="195" y="112" width="100" height="56" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="245" y="135" font-size="13" fill="#222222" text-anchor="middle">Parse</text>
  <text x="245" y="153" font-size="11" fill="#444444" text-anchor="middle">check the dialect</text>
  <rect x="355" y="112" width="120" height="56" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="415" y="135" font-size="13" fill="#222222" text-anchor="middle">Translate</text>
  <text x="415" y="153" font-size="11" fill="#444444" text-anchor="middle">COBOL to C</text>
  <line x1="135" y1="140" x2="193" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="295" y1="140" x2="353" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="85" y="192" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">cobc -E</text>
  <text x="415" y="192" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">cobc -C</text>
  <text x="245" y="192" font-size="11" fill="#444444" text-anchor="middle">errors and warnings</text>
  <text x="245" y="210" font-size="11" fill="#444444" text-anchor="middle">with line numbers</text>

  <rect x="20" y="255" width="110" height="56" rx="5" fill="#fde7a8" stroke="#a15c00" stroke-width="1.5"/>
  <text x="75" y="278" font-size="13" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">hello.cob</text>
  <text x="75" y="296" font-size="11" fill="#444444" text-anchor="middle">COBOL source</text>
  <line x1="75" y1="253" x2="75" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)" transform="translate(0,0)"/>

  <line x1="475" y1="140" x2="540" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="542" y="112" width="110" height="56" rx="5" fill="#f1f1f1" stroke="#555555"/>
  <text x="597" y="135" font-size="13" fill="#222222" text-anchor="middle">C source</text>
  <text x="597" y="153" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">hello.c</text>
  <line x1="652" y1="140" x2="690" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="692" y="112" width="120" height="56" rx="5" fill="#f1f1f1" stroke="#555555"/>
  <text x="752" y="135" font-size="13" fill="#222222" text-anchor="middle">C compiler</text>
  <text x="752" y="153" font-size="11" fill="#444444" text-anchor="middle">gcc, clang, cl</text>
  <text x="752" y="192" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">cobc -c, -S</text>
  <line x1="812" y1="140" x2="840" y2="140" stroke="#444444" stroke-width="1.5"/>
  <line x1="840" y1="140" x2="840" y2="232" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="780" y="236" width="140" height="56" rx="5" fill="#f1f1f1" stroke="#555555"/>
  <text x="850" y="259" font-size="13" fill="#222222" text-anchor="middle">Object + link</text>
  <text x="850" y="277" font-size="11" fill="#444444" text-anchor="middle">hello.o, -lcob</text>

  <line x1="780" y1="264" x2="700" y2="264" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="780" y1="278" x2="700" y2="320" stroke="#444444" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="540" y="236" width="160" height="56" rx="5" fill="#d9ecd8" stroke="#2e6b2e" stroke-width="1.5"/>
  <text x="620" y="259" font-size="13" fill="#222222" text-anchor="middle">Executable</text>
  <text x="620" y="277" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">cobc -x  (hello)</text>
  <rect x="540" y="316" width="160" height="56" rx="5" fill="#d9ecd8" stroke="#2e6b2e" stroke-width="1.5"/>
  <text x="620" y="339" font-size="13" fill="#222222" text-anchor="middle">Module</text>
  <text x="620" y="357" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">cobc -m  (hello.so)</text>

  <rect x="230" y="270" width="250" height="90" rx="8" fill="#fbe3e3" stroke="#8a2b2b" stroke-width="1.5"/>
  <text x="355" y="294" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">libcob at run time</text>
  <text x="355" y="314" font-size="11" fill="#444444" text-anchor="middle">files, DISPLAY/ACCEPT, decimal arithmetic,</text>
  <text x="355" y="330" font-size="11" fill="#444444" text-anchor="middle">intrinsic functions, CALL and module loading</text>
  <text x="355" y="349" font-size="11" fill="#444444" text-anchor="middle" font-family="Courier New, monospace">./hello  |  cobcrun HELLO  |  cobc -j</text>
  <line x1="538" y1="264" x2="482" y2="300" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="538" y1="344" x2="482" y2="335" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
</svg>
