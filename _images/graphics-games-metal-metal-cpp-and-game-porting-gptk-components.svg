<svg viewBox="0 0 760 375" width="760" height="375" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metal-cpp-and-game-porting-gptk-components" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="375" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Game Porting Toolkit 4: what to use at each stage</text>
<rect x="20" y="55" width="170" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="76.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">1 Evaluate</text>
<rect x="20" y="95" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="129.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Evaluation environment</text>
<text x="105" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">runs the unmodified</text>
<text x="105" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Windows game on</text>
<text x="105" y="204" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Apple silicon</text>
<text x="105" y="226" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">Metal HUD, GPU capture,</text>
<text x="105" y="239" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">System Trace</text>
<line x1="192" y1="72" x2="201" y2="72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-gptk-components)"/>
<rect x="203" y="55" width="170" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="288.0" y="76.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">2 Convert</text>
<rect x="203" y="95" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="288.0" y="129.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Metal shader converter</text>
<text x="288" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">DXIL to metallib</text>
<text x="288" y="226" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">frame buffer fetch,</text>
<text x="288" y="239" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">function constants,</text>
<text x="288" y="252" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">debug info</text>
<line x1="375" y1="72" x2="384" y2="72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-gptk-components)"/>
<rect x="386" y="55" width="170" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="471.0" y="76.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">3 Port</text>
<rect x="386" y="95" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="471.0" y="129.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">metal-cpp</text>
<text x="471" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">C++ interface to</text>
<text x="471" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal and MetalFX</text>
<text x="471" y="226" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">no measurable overhead</text>
<text x="471" y="239" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">vs Objective-C</text>
<line x1="558" y1="72" x2="567" y2="72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-gptk-components)"/>
<rect x="569" y="55" width="170" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="654.0" y="76.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">4 Build</text>
<rect x="569" y="95" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="129.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Windows developer tools</text>
<text x="654" y="176" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">compiler, binary</text>
<text x="654" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">generator, texture</text>
<text x="654" y="204" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">converter</text>
<text x="654" y="226" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">Mac Remote tools:</text>
<text x="654" y="239" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">CMake builds on a Mac</text>
<rect x="20" y="280" width="720" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="301.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">New in version 4: a companion GitHub repository with agent skills and sample code, plus Metal 4 support</text>
<text x="380.0" y="315.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">in the evaluation environment. The agents get command line access to Metal tools to capture, debug and profile.</text>
<text x="380" y="355" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The stages are a suggested order, not a requirement: many teams skip the evaluation step.</text>
</svg>
