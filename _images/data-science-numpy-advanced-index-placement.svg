<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
<title>Where advanced-index dimensions land in the result</title>
<desc>For a 2 by 3 by 4 array, adjacent advanced indices keep their position, separated ones move to the front of the result shape.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0F172A" text-anchor="start" font-weight="bold">z has shape (2, 3, 4)</text>
<rect x="24" y="64" width="672" height="62" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="40" y="90" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="start" font-weight="bold">z[0, :, [1, 2]]</text>
<text x="40" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">0 and [1, 2] separated by a slice; broadcast dim first, then the slice</text>
<rect x="580" y="74" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="630" y="101" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="middle" font-weight="bold">(2, 3)</text>
<line x1="540" y1="95" x2="576" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="140" width="672" height="62" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="40" y="166" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="start" font-weight="bold">z[:, 0, [1, 2]]</text>
<text x="40" y="188" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">0 and [1, 2] are adjacent; broadcast dim stays in place</text>
<rect x="580" y="150" width="100" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="630" y="177" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="middle" font-weight="bold">(2, 2)</text>
<line x1="540" y1="171" x2="576" y2="171" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="216" width="672" height="62" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="40" y="242" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="start" font-weight="bold">z[0, [0, 1], :]</text>
<text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">one advanced index group, slice after it; dim replaces the indexed axis</text>
<rect x="580" y="226" width="100" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="630" y="253" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="middle" font-weight="bold">(2, 4)</text>
<line x1="540" y1="247" x2="576" y2="247" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="292" width="672" height="62" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="40" y="318" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="start" font-weight="bold">z[[0, 1], :, [1, 2]]</text>
<text x="40" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">two arrays separated by a slice; broadcast dim first, then the slice</text>
<rect x="580" y="302" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="630" y="329" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="middle" font-weight="bold">(2, 3)</text>
<line x1="540" y1="323" x2="576" y2="323" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
</svg>
