<svg viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Amazon ECR private registry: repositories, images and the features around them</text>

  <!-- Producers -->
  <rect x="20" y="60" width="170" height="90" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="105" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Build</text>
  <text x="105" y="106" text-anchor="middle" font-size="11" fill="#123a72">developer laptop or</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#123a72">GitHub Actions (OIDC role)</text>
  <text x="105" y="138" text-anchor="middle" font-size="11" fill="#123a72">docker push / buildx</text>

  <rect x="20" y="190" width="170" height="90" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.8"/>
  <text x="105" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Upstream registries</text>
  <text x="105" y="236" text-anchor="middle" font-size="11" fill="#3c4a58">Docker Hub, Quay, GHCR,</text>
  <text x="105" y="252" text-anchor="middle" font-size="11" fill="#3c4a58">ECR Public, registry.k8s.io</text>
  <text x="105" y="268" text-anchor="middle" font-size="11" fill="#3c4a58">(pull through cache)</text>

  <!-- Registry -->
  <rect x="250" y="50" width="400" height="360" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="270" y="74" font-size="14" font-weight="700" fill="#3c4a58">Private registry (one per account and Region)</text>
  <text x="270" y="92" font-size="11" fill="#3c4a58">111122223333.dkr.ecr.us-east-1.amazonaws.com</text>

  <rect x="270" y="108" width="360" height="120" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="285" y="128" font-size="12.5" font-weight="700" fill="#123a72">Repository bookshelf/catalog-api</text>
  <rect x="285" y="140" width="94" height="34" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="332" y="161" text-anchor="middle" font-size="10.5" fill="#123a72">1.4.2 (digest)</text>
  <rect x="389" y="140" width="94" height="34" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="436" y="161" text-anchor="middle" font-size="10.5" fill="#123a72">1.4.1 (digest)</text>
  <rect x="493" y="140" width="124" height="34" rx="5" fill="#eef1f4" stroke="#8a97a4" stroke-dasharray="4,3"/>
  <text x="555" y="161" text-anchor="middle" font-size="10.5" fill="#3c4a58">1.3.0 (archived)</text>
  <text x="285" y="198" font-size="10.5" fill="#3c4a58">tag mutability, scan on push, encryption (AES-256 or KMS),</text>
  <text x="285" y="214" font-size="10.5" fill="#3c4a58">repository policy, lifecycle policy, signatures</text>

  <rect x="270" y="244" width="170" height="70" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.6"/>
  <text x="355" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#6b4410">Scanning</text>
  <text x="355" y="284" text-anchor="middle" font-size="10.5" fill="#6b4410">basic (native) or</text>
  <text x="355" y="299" text-anchor="middle" font-size="10.5" fill="#6b4410">enhanced (Inspector)</text>

  <rect x="460" y="244" width="170" height="70" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.6"/>
  <text x="545" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#6b4410">Lifecycle policy</text>
  <text x="545" y="284" text-anchor="middle" font-size="10.5" fill="#6b4410">archive, then expire</text>
  <text x="545" y="299" text-anchor="middle" font-size="10.5" fill="#6b4410">evaluated within 24 hours</text>

  <rect x="270" y="330" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="355" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">Managed signing</text>
  <text x="355" y="370" text-anchor="middle" font-size="10.5" fill="#1b5e20">AWS Signer, on push</text>

  <rect x="460" y="330" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="545" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">Replication</text>
  <text x="545" y="370" text-anchor="middle" font-size="10.5" fill="#1b5e20">other Regions / accounts</text>

  <!-- Consumers -->
  <rect x="710" y="60" width="170" height="90" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="795" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">ECS / Fargate</text>
  <text x="795" y="108" text-anchor="middle" font-size="11" fill="#123a72">task execution role pulls</text>
  <text x="795" y="124" text-anchor="middle" font-size="11" fill="#123a72">at task start</text>

  <rect x="710" y="170" width="170" height="90" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="795" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">EKS</text>
  <text x="795" y="218" text-anchor="middle" font-size="11" fill="#123a72">node role pulls</text>
  <text x="795" y="234" text-anchor="middle" font-size="11" fill="#123a72">(kubelet credential provider)</text>

  <rect x="710" y="280" width="170" height="90" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="795" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Lambda</text>
  <text x="795" y="328" text-anchor="middle" font-size="11" fill="#123a72">container-image functions</text>
  <text x="795" y="344" text-anchor="middle" font-size="11" fill="#123a72">(same-Region private repo)</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3c4a58"/></marker></defs>
  <line x1="190" y1="105" x2="268" y2="150" stroke="#3c4a58" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="190" y1="235" x2="268" y2="195" stroke="#3c4a58" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="632" y1="150" x2="708" y2="105" stroke="#3c4a58" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="632" y1="170" x2="708" y2="215" stroke="#3c4a58" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="632" y1="200" x2="708" y2="320" stroke="#3c4a58" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="105" y="420" text-anchor="middle" font-size="10.5" fill="#3c4a58">push (left) and pull (right)</text>
  <text x="105" y="434" text-anchor="middle" font-size="10.5" fill="#3c4a58">both need ecr:GetAuthorizationToken</text>
</svg>
