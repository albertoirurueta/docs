<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-security-cors-and-privacy-cors-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Cross-origin texture: what the browser checks</text>
<rect x="20" y="60" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="91.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Page origin A</text>
<text x="115.0" y="106.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">https://shop.example</text>
<rect x="285" y="60" width="190" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="91.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">img.crossOrigin =</text>
<text x="380.0" y="106.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">'anonymous'</text>
<rect x="550" y="60" width="190" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="91.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Image server, origin B</text>
<text x="645.0" y="106.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">https://cdn.example</text>
<line x1="210" y1="95" x2="285" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-cors-flow)"/>
<line x1="475" y1="95" x2="550" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-cors-flow)"/>
<text x="247" y="85" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">set before src</text>
<text x="512" y="85" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">GET + Origin: A</text>
<line x1="645" y1="130" x2="645" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-cors-flow)"/>
<rect x="500" y="178" width="240" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="202.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Response header present?</text>
<text x="620.0" y="217.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Access-Control-Allow-Origin: A or *</text>
<line x1="500" y1="206" x2="400" y2="206" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-cors-flow)"/>
<rect x="160" y="170" width="240" height="72" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="280.0" y="195.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Yes: image stays clean</text>
<text x="280.0" y="210.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">texImage2D succeeds</text>
<text x="280.0" y="225.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">and the texture samples normally</text>
<line x1="620" y1="234" x2="620" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-cors-flow)"/>
<rect x="500" y="282" width="240" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="301.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">No header: load fails</text>
<text x="620.0" y="316.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">onerror fires, nothing to upload</text>
<text x="620.0" y="331.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(or SecurityError on upload)</text>
<rect x="20" y="170" width="120" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="202.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Same origin</text>
<text x="80.0" y="217.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">always allowed</text>
<text x="380" y="372" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Without crossOrigin the image still displays in img, but texImage2D throws a SecurityError.</text>
<text x="380" y="390" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A 2D canvas that drew a cross-origin image is tainted and cannot be uploaded either.</text>
</svg>
