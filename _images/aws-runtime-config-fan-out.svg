<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a58"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">One set of Bookshelf settings, three delivery paths, three runtimes</text>

  <text x="130" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Where values live</text>
  <text x="435" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">How they are delivered</text>
  <text x="760" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Who consumes them</text>

  <!-- sources -->
  <rect x="20" y="70" width="220" height="100" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="130" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">AWS AppConfig</text>
  <text x="130" y="116" text-anchor="middle" font-size="11" fill="#123a72">app bookshelf, env prod</text>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#123a72">profiles: feature flags, freeform</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#123a72">gradual deployment + alarm rollback</text>

  <rect x="20" y="200" width="220" height="100" rx="10" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="2"/>
  <text x="130" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Parameter Store</text>
  <text x="130" y="246" text-anchor="middle" font-size="11" fill="#14532d">/bookshelf/prod/catalog-api/*</text>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#14532d">hierarchy, versions, labels,</text>
  <text x="130" y="278" text-anchor="middle" font-size="11" fill="#14532d">policies (Advanced tier)</text>

  <rect x="20" y="330" width="220" height="100" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="130" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Your repository</text>
  <text x="130" y="376" text-anchor="middle" font-size="11" fill="#7a4800">task definition environment,</text>
  <text x="130" y="392" text-anchor="middle" font-size="11" fill="#7a4800">Lambda env vars, ConfigMap YAML,</text>
  <text x="130" y="408" text-anchor="middle" font-size="11" fill="#7a4800">application.yml</text>

  <!-- channels -->
  <rect x="320" y="70" width="230" height="100" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="435" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">AppConfig Agent</text>
  <text x="435" y="116" text-anchor="middle" font-size="11" fill="#3c4a58">HTTP on localhost:2772</text>
  <text x="435" y="132" text-anchor="middle" font-size="11" fill="#3c4a58">polls, caches, no restart</text>
  <text x="435" y="148" text-anchor="middle" font-size="11" fill="#3c4a58">changes within minutes</text>

  <rect x="320" y="200" width="230" height="100" rx="10" fill="#ffffff" stroke="#c77700" stroke-width="2"/>
  <text x="435" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Injected at start</text>
  <text x="435" y="246" text-anchor="middle" font-size="11" fill="#3c4a58">environment / valueFrom,</text>
  <text x="435" y="262" text-anchor="middle" font-size="11" fill="#3c4a58">envFrom, volume mount</text>
  <text x="435" y="278" text-anchor="middle" font-size="11" fill="#3c4a58">change needs a new deployment</text>

  <rect x="320" y="330" width="230" height="100" rx="10" fill="#ffffff" stroke="#1e7b3a" stroke-width="2"/>
  <text x="435" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">SDK or Spring import</text>
  <text x="435" y="376" text-anchor="middle" font-size="11" fill="#3c4a58">spring.config.import at start,</text>
  <text x="435" y="392" text-anchor="middle" font-size="11" fill="#3c4a58">optional reload (Parameter Store),</text>
  <text x="435" y="408" text-anchor="middle" font-size="11" fill="#3c4a58">or your own cached read</text>

  <!-- consumers -->
  <rect x="640" y="70" width="240" height="360" rx="12" fill="#f4f6f8" stroke="#3c4a58" stroke-width="1.8"/>
  <rect x="656" y="90" width="208" height="96" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="760" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Lambda: notifier</text>
  <text x="760" y="134" text-anchor="middle" font-size="11" fill="#3c4a58">extension layer on :2772</text>
  <text x="760" y="150" text-anchor="middle" font-size="11" fill="#3c4a58">function env vars (4 KB)</text>
  <text x="760" y="166" text-anchor="middle" font-size="11" fill="#3c4a58">execution role reads</text>
  <rect x="656" y="200" width="208" height="96" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="760" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">ECS: catalog-api</text>
  <text x="760" y="244" text-anchor="middle" font-size="11" fill="#3c4a58">sidecar container on :2772</text>
  <text x="760" y="260" text-anchor="middle" font-size="11" fill="#3c4a58">task definition environment</text>
  <text x="760" y="276" text-anchor="middle" font-size="11" fill="#3c4a58">task role reads, exec role injects</text>
  <rect x="656" y="310" width="208" height="96" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="760" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">EKS: orders-api pod</text>
  <text x="760" y="354" text-anchor="middle" font-size="11" fill="#3c4a58">sidecar or DaemonSet agent</text>
  <text x="760" y="370" text-anchor="middle" font-size="11" fill="#3c4a58">ConfigMap as env vars or file</text>
  <text x="760" y="386" text-anchor="middle" font-size="11" fill="#3c4a58">Pod Identity role reads</text>

  <!-- arrows sources -> channels -->
  <line x1="240" y1="120" x2="318" y2="120" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="135" x2="318" y2="345" stroke="#3c4a58" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="250" x2="318" y2="250" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="270" x2="318" y2="365" stroke="#3c4a58" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="380" x2="318" y2="275" stroke="#3c4a58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrows channels -> consumers -->
  <line x1="550" y1="120" x2="638" y2="120" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="250" x2="638" y2="250" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="380" x2="638" y2="380" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>

  <text x="450" y="455" text-anchor="middle" font-size="11" fill="#3c4a58">Fast-changing and risky values go through the agent; stable values are injected; secrets are only referenced, never stored here.</text>
</svg>
