<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Three isolation domains -- the main actor, a BankAccount actor, and non-isolated concurrent code -- with a Sendable value crossing from the non-isolated domain into the actor via an await, and a Sendable result crossing back to the main actor.</title>
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Isolation Domains and a Value Crossing Between Them</text>

  <defs>
    <marker id="idArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Main actor domain -->
  <rect x="40" y="70" width="230" height="330" rx="10" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.8"/>
  <text x="155" y="96" font-size="13" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Main Actor</text>
  <text x="155" y="112" font-size="9.5" fill="#1f3b5c" text-anchor="middle">(@MainActor)</text>
  <rect x="65" y="130" width="180" height="50" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.2"/>
  <text x="155" y="150" font-size="10.5" fill="#1f3b5c" text-anchor="middle">ProfileViewModel</text>
  <text x="155" y="165" font-size="9.5" fill="#1f3b5c" text-anchor="middle">displayName: String</text>
  <rect x="65" y="330" width="180" height="46" rx="6" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.2"/>
  <text x="155" y="350" font-size="10" fill="#1f3b5c" text-anchor="middle">await refresh()</text>
  <text x="155" y="365" font-size="9" fill="#1f3b5c" text-anchor="middle">resumes here with the result</text>

  <!-- Actor domain -->
  <rect x="315" y="70" width="230" height="330" rx="10" fill="#f2eefb" stroke="#6a3d9a" stroke-width="1.8"/>
  <text x="430" y="96" font-size="13" font-weight="bold" fill="#3a1f5c" text-anchor="middle">BankAccount actor</text>
  <rect x="340" y="130" width="180" height="50" rx="6" fill="#ffffff" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="430" y="150" font-size="10.5" fill="#3a1f5c" text-anchor="middle">balance: Int</text>
  <text x="430" y="165" font-size="9.5" fill="#3a1f5c" text-anchor="middle">(actor-isolated state)</text>
  <rect x="340" y="330" width="180" height="46" rx="6" fill="#ffffff" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="430" y="350" font-size="10" fill="#3a1f5c" text-anchor="middle">func withdraw(_:)</text>
  <text x="430" y="365" font-size="9" fill="#3a1f5c" text-anchor="middle">returns a Sendable result</text>

  <!-- Non-isolated concurrent domain -->
  <rect x="590" y="70" width="230" height="330" rx="10" fill="#fdeeee" stroke="#a4282c" stroke-width="1.8"/>
  <text x="705" y="96" font-size="13" font-weight="bold" fill="#7a1d20" text-anchor="middle">Non-Isolated</text>
  <text x="705" y="112" font-size="9.5" fill="#7a1d20" text-anchor="middle">(concurrent code / a Task)</text>
  <rect x="615" y="130" width="180" height="50" rx="6" fill="#ffffff" stroke="#a4282c" stroke-width="1.2"/>
  <text x="705" y="150" font-size="10.5" fill="#7a1d20" text-anchor="middle">Task { }</text>
  <text x="705" y="165" font-size="9.5" fill="#7a1d20" text-anchor="middle">background work</text>
  <rect x="615" y="330" width="180" height="46" rx="6" fill="#ffffff" stroke="#a4282c" stroke-width="1.2"/>
  <text x="705" y="350" font-size="10" fill="#7a1d20" text-anchor="middle">let amount = 100</text>
  <text x="705" y="365" font-size="9" fill="#7a1d20" text-anchor="middle">a Sendable Int, safe to send</text>

  <!-- crossing arrow: non-isolated -> actor -->
  <line x1="615" y1="353" x2="520" y2="353" stroke="#333333" stroke-width="1.6" marker-end="url(#idArrow)"/>
  <text x="567" y="300" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">await account.withdraw(amount)</text>
  <text x="567" y="316" font-size="9" fill="#555555" text-anchor="middle">crossing #1: Sendable `amount` sent in</text>

  <!-- crossing arrow: actor -> main actor -->
  <line x1="340" y1="353" x2="245" y2="353" stroke="#333333" stroke-width="1.6" marker-end="url(#idArrow)"/>
  <text x="292" y="300" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">await transfer(amount:)</text>
  <text x="292" y="316" font-size="9" fill="#555555" text-anchor="middle">crossing #2: Sendable result sent back</text>

  <text x="430" y="425" font-size="10.5" fill="#333333" text-anchor="middle">Only a `Sendable` value (or a `sending` value whose ownership transfers) may cross a domain boundary; every crossing is an `await`.</text>
</svg>
