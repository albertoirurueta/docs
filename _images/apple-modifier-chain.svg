<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A modifier chain is a set of nested wrappers</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Each modifier wraps the view it receives; read from the innermost box outwards</text>

  <!-- Panel A: padding then background -->
  <text x="190" y="80" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">A: padding, then background</text>
  <rect x="30" y="92" width="320" height="72" rx="6" fill="#f4f4f4" stroke="#cccccc"/>
  <text x="46" y="114" font-family="Menlo, Consolas, monospace" font-size="13" fill="#333333">Text("erosion")</text>
  <text x="46" y="134" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1c4b73">    .padding(...)</text>
  <text x="46" y="154" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a5a1c">    .background(.yellow, in: .capsule)</text>

  <!-- outer: background wrapper -->
  <rect x="50" y="186" width="280" height="150" rx="10" fill="none" stroke="#8a5a1c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="62" y="204" font-size="13" fill="#8a5a1c">background</text>
  <!-- painted capsule fills padded area -->
  <rect x="80" y="222" width="220" height="92" rx="46" fill="#ffe27a" stroke="#c9a400" stroke-width="1.2"/>
  <!-- padding wrapper -->
  <rect x="80" y="222" width="220" height="92" rx="46" fill="none" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="190" y="242" font-size="13" fill="#1c4b73" text-anchor="middle">padding</text>
  <!-- text -->
  <rect x="140" y="254" width="100" height="34" rx="4" fill="#ffffff" fill-opacity="0.55" stroke="#333333" stroke-width="1.2"/>
  <text x="190" y="276" font-size="14" fill="#222222" text-anchor="middle">erosion</text>

  <text x="190" y="362" font-size="13" fill="#444444" text-anchor="middle">background receives the padded view,</text>
  <text x="190" y="380" font-size="13" fill="#444444" text-anchor="middle">so yellow fills text + padding: a chip</text>

  <!-- Panel B: background then padding -->
  <text x="570" y="80" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">B: background, then padding</text>
  <rect x="410" y="92" width="320" height="72" rx="6" fill="#f4f4f4" stroke="#cccccc"/>
  <text x="426" y="114" font-family="Menlo, Consolas, monospace" font-size="13" fill="#333333">Text("erosion")</text>
  <text x="426" y="134" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a5a1c">    .background(.yellow, in: .capsule)</text>
  <text x="426" y="154" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1c4b73">    .padding(...)</text>

  <!-- outer: padding wrapper (transparent) -->
  <rect x="430" y="186" width="280" height="150" rx="10" fill="none" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="442" y="204" font-size="13" fill="#1c4b73">padding (transparent space)</text>
  <!-- background wrapper hugging text -->
  <rect x="512" y="246" width="116" height="50" rx="25" fill="#ffe27a" stroke="#c9a400" stroke-width="1.2"/>
  <rect x="504" y="238" width="132" height="66" rx="10" fill="none" stroke="#8a5a1c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="570" y="320" font-size="13" fill="#8a5a1c" text-anchor="middle">background</text>
  <!-- text -->
  <rect x="520" y="254" width="100" height="34" rx="4" fill="#ffffff" fill-opacity="0.55" stroke="#333333" stroke-width="1.2"/>
  <text x="570" y="276" font-size="14" fill="#222222" text-anchor="middle">erosion</text>

  <text x="570" y="362" font-size="13" fill="#444444" text-anchor="middle">background receives only the text,</text>
  <text x="570" y="380" font-size="13" fill="#444444" text-anchor="middle">so yellow hugs the glyphs; padding stays empty</text>

  <!-- legend -->
  <line x1="120" y1="420" x2="150" y2="420" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="158" y="425" font-size="13" fill="#333333">padding wrapper</text>
  <line x1="300" y1="420" x2="330" y2="420" stroke="#8a5a1c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="338" y="425" font-size="13" fill="#333333">background wrapper</text>
  <rect x="490" y="411" width="30" height="18" rx="9" fill="#ffe27a" stroke="#c9a400"/>
  <text x="528" y="425" font-size="13" fill="#333333">painted area</text>
</svg>
