<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Test layers of an Express application</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">more of the stack is real as you go up; fewer tests, slower runs</text>

  <!-- E2E -->
  <rect x="200" y="62" width="320" height="64" fill="#f4f4f4" stroke="#7a2e2e" stroke-width="1.6"/>
  <text x="360" y="86" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">End to end</text>
  <text x="360" y="104" font-size="11" fill="#666666" text-anchor="middle">Playwright against a booted server and real browser</text>
  <text x="360" y="118" font-size="10" fill="#666666" text-anchor="middle">a handful of journeys</text>

  <!-- HTTP -->
  <rect x="140" y="134" width="440" height="72" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="360" y="158" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">HTTP layer</text>
  <text x="360" y="176" font-size="11" fill="#666666" text-anchor="middle">supertest drives the exported app without listening: routing, middleware,</text>
  <text x="360" y="192" font-size="11" fill="#666666" text-anchor="middle">validation, status codes, error handlers, authentication</text>

  <!-- Data -->
  <rect x="80" y="214" width="560" height="72" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="360" y="238" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Data layer</text>
  <text x="360" y="256" font-size="11" fill="#666666" text-anchor="middle">model and repository tests against a real engine:</text>
  <text x="360" y="272" font-size="11" fill="#666666" text-anchor="middle">mongodb-memory-server, in-memory SQLite or a Testcontainers database</text>

  <!-- Unit -->
  <rect x="20" y="294" width="680" height="72" fill="#f4f4f4" stroke="#555555" stroke-width="1.6"/>
  <text x="360" y="318" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Units</text>
  <text x="360" y="336" font-size="11" fill="#666666" text-anchor="middle">pure functions, services with a fake repository, single middleware called</text>
  <text x="360" y="352" font-size="11" fill="#666666" text-anchor="middle">with stub req, res and next; milliseconds each, the bulk of the suite</text>

  <text x="360" y="388" font-size="10" fill="#888888" text-anchor="middle">Bookshelf API test suite</text>
</svg>
