<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A Person and an Apartment instance holding strong references to each other, forming a retain cycle that leaks both; below it, the same relationship with the Apartment's reference to the tenant marked weak, breaking the cycle so both instances deinitialize once external references are cleared.</title>
  <rect x="0" y="0" width="860" height="480" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A Retain Cycle, and Breaking It with `weak`</text>

  <defs>
    <marker id="rcArrowStrong" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a4282c"/>
    </marker>
    <marker id="rcArrowWeak" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d6fa5"/>
    </marker>
  </defs>

  <!-- Top: the cycle -->
  <rect x="20" y="50" width="820" height="170" rx="8" fill="#fdeeee" stroke="#a4282c" stroke-width="1.2"/>
  <text x="40" y="73" font-size="12.5" font-weight="bold" fill="#7a1d20">Strong reference cycle -- neither count ever reaches zero</text>

  <rect x="130" y="100" width="200" height="70" rx="8" fill="#ffffff" stroke="#a4282c" stroke-width="1.8"/>
  <text x="230" y="130" font-size="13" font-weight="bold" fill="#7a1d20" text-anchor="middle">Person "john"</text>
  <text x="230" y="150" font-size="10.5" fill="#7a1d20" text-anchor="middle">var apartment: Apartment?</text>

  <rect x="530" y="100" width="200" height="70" rx="8" fill="#ffffff" stroke="#a4282c" stroke-width="1.8"/>
  <text x="630" y="130" font-size="13" font-weight="bold" fill="#7a1d20" text-anchor="middle">Apartment "4A"</text>
  <text x="630" y="150" font-size="10.5" fill="#7a1d20" text-anchor="middle">var tenant: Person?</text>

  <path d="M330,120 C420,105 440,105 530,120" fill="none" stroke="#a4282c" stroke-width="1.8" marker-end="url(#rcArrowStrong)"/>
  <text x="430" y="102" font-size="10" fill="#7a1d20" text-anchor="middle">strong: john.apartment</text>

  <path d="M530,150 C440,165 420,165 330,150" fill="none" stroke="#a4282c" stroke-width="1.8" marker-end="url(#rcArrowStrong)"/>
  <text x="430" y="182" font-size="10" fill="#7a1d20" text-anchor="middle">strong: unit4A.tenant</text>

  <text x="430" y="205" font-size="10.5" fill="#7a1d20" text-anchor="middle">Setting the outside "john" / "unit4A" variables to nil removes only the external references -- both leak forever.</text>

  <!-- Bottom: fixed with weak -->
  <rect x="20" y="250" width="820" height="200" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.2"/>
  <text x="40" y="273" font-size="12.5" font-weight="bold" fill="#1f3b5c">Cycle broken -- Apartment's reference to its tenant is `weak`</text>

  <rect x="130" y="300" width="200" height="70" rx="8" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.8"/>
  <text x="230" y="330" font-size="13" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Person "john"</text>
  <text x="230" y="350" font-size="10.5" fill="#1f3b5c" text-anchor="middle">var apartment: Apartment?</text>

  <rect x="530" y="300" width="200" height="70" rx="8" fill="#ffffff" stroke="#3d6fa5" stroke-width="1.8"/>
  <text x="630" y="330" font-size="13" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Apartment "4B"</text>
  <text x="630" y="350" font-size="10.5" fill="#1f3b5c" text-anchor="middle">weak var tenant: Person?</text>

  <path d="M330,320 C420,305 440,305 530,320" fill="none" stroke="#3d6fa5" stroke-width="1.8" marker-end="url(#rcArrowWeak)"/>
  <text x="430" y="302" font-size="10" fill="#1f3b5c" text-anchor="middle">strong: john.apartment</text>

  <path d="M530,350 C440,365 420,365 330,350" fill="none" stroke="#3d6fa5" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#rcArrowWeak)"/>
  <text x="430" y="382" font-size="10" fill="#1f3b5c" text-anchor="middle">weak: unit4B.tenant (doesn't count)</text>

  <text x="430" y="410" font-size="10.5" fill="#1f3b5c" text-anchor="middle">john = nil drops Person's count to 0 immediately: deinit runs, and unit4B.tenant is set to nil automatically.</text>
  <text x="430" y="428" font-size="10.5" fill="#1f3b5c" text-anchor="middle">unit4B = nil then drops Apartment's count to 0 too -- both instances deinitialize, no leak.</text>
</svg>
