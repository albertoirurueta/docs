<svg viewBox="0 0 900 400" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">The four Amazon S3 bucket types and what lives inside them</text>

  <rect x="20" y="50" width="205" height="320" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="122" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">General purpose</text>
  <text x="122" y="96" text-anchor="middle" font-size="11" fill="#123a72">the default; Bookshelf uses it</text>
  <rect x="38" y="112" width="169" height="40" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="122" y="130" text-anchor="middle" font-size="11" fill="#123a72">objects = key + data</text>
  <text x="122" y="145" text-anchor="middle" font-size="11" fill="#123a72">+ metadata + tags</text>
  <text x="122" y="178" text-anchor="middle" font-size="11" fill="#123a72">Standard, Intelligent-Tiering,</text>
  <text x="122" y="194" text-anchor="middle" font-size="11" fill="#123a72">IA, One Zone-IA, Glacier classes</text>
  <text x="122" y="222" text-anchor="middle" font-size="11" fill="#123a72">versioning, lifecycle,</text>
  <text x="122" y="238" text-anchor="middle" font-size="11" fill="#123a72">replication, events</text>
  <text x="122" y="266" text-anchor="middle" font-size="11" fill="#123a72">API: s3, s3api</text>
  <text x="122" y="282" text-anchor="middle" font-size="11" fill="#123a72">3 or more AZs</text>
  <text x="122" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#123a72">web assets, uploads,</text>
  <text x="122" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#123a72">backups, data lakes</text>

  <rect x="240" y="50" width="205" height="320" rx="10" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.8"/>
  <text x="342" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4410">Directory</text>
  <text x="342" y="96" text-anchor="middle" font-size="11" fill="#6b4410">S3 Express One Zone</text>
  <rect x="258" y="112" width="169" height="40" rx="6" fill="#f9e6c2" stroke="#b7791f"/>
  <text x="342" y="130" text-anchor="middle" font-size="11" fill="#6b4410">objects in one chosen</text>
  <text x="342" y="145" text-anchor="middle" font-size="11" fill="#6b4410">Availability Zone</text>
  <text x="342" y="178" text-anchor="middle" font-size="11" fill="#6b4410">single-digit millisecond</text>
  <text x="342" y="194" text-anchor="middle" font-size="11" fill="#6b4410">latency</text>
  <text x="342" y="222" text-anchor="middle" font-size="11" fill="#6b4410">session-based auth,</text>
  <text x="342" y="238" text-anchor="middle" font-size="11" fill="#6b4410">hierarchical namespace</text>
  <text x="342" y="266" text-anchor="middle" font-size="11" fill="#6b4410">API: s3, s3api</text>
  <text x="342" y="282" text-anchor="middle" font-size="11" fill="#6b4410">1 AZ (or Local Zone)</text>
  <text x="342" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#6b4410">latency-sensitive</text>
  <text x="342" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#6b4410">analytics, ML training</text>

  <rect x="460" y="50" width="205" height="320" rx="10" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.8"/>
  <text x="562" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#145224">Table</text>
  <text x="562" y="96" text-anchor="middle" font-size="11" fill="#145224">S3 Tables</text>
  <rect x="478" y="112" width="169" height="40" rx="6" fill="#cfebd6" stroke="#1e7e34"/>
  <text x="562" y="130" text-anchor="middle" font-size="11" fill="#145224">namespaces and tables</text>
  <text x="562" y="145" text-anchor="middle" font-size="11" fill="#145224">in Apache Iceberg format</text>
  <text x="562" y="178" text-anchor="middle" font-size="11" fill="#145224">automatic compaction</text>
  <text x="562" y="194" text-anchor="middle" font-size="11" fill="#145224">and snapshot cleanup</text>
  <text x="562" y="222" text-anchor="middle" font-size="11" fill="#145224">queried by Athena,</text>
  <text x="562" y="238" text-anchor="middle" font-size="11" fill="#145224">Redshift, Spark</text>
  <text x="562" y="266" text-anchor="middle" font-size="11" fill="#145224">API: s3tables</text>
  <text x="562" y="282" text-anchor="middle" font-size="11" fill="#145224">Block Public Access always on</text>
  <text x="562" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#145224">analytics tables</text>
  <text x="562" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#145224">(not Bookshelf files)</text>

  <rect x="680" y="50" width="205" height="320" rx="10" fill="#f3e8fd" stroke="#7b3fb0" stroke-width="1.8"/>
  <text x="782" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1f70">Vector</text>
  <text x="782" y="96" text-anchor="middle" font-size="11" fill="#4a1f70">S3 Vectors</text>
  <rect x="698" y="112" width="169" height="40" rx="6" fill="#e6d3f7" stroke="#7b3fb0"/>
  <text x="782" y="130" text-anchor="middle" font-size="11" fill="#4a1f70">vector indexes holding</text>
  <text x="782" y="145" text-anchor="middle" font-size="11" fill="#4a1f70">embeddings + metadata</text>
  <text x="782" y="178" text-anchor="middle" font-size="11" fill="#4a1f70">similarity query API</text>
  <text x="782" y="194" text-anchor="middle" font-size="11" fill="#4a1f70">(nearest neighbours)</text>
  <text x="782" y="222" text-anchor="middle" font-size="11" fill="#4a1f70">strongly consistent writes,</text>
  <text x="782" y="238" text-anchor="middle" font-size="11" fill="#4a1f70">metadata filtering</text>
  <text x="782" y="266" text-anchor="middle" font-size="11" fill="#4a1f70">API: s3vectors</text>
  <text x="782" y="282" text-anchor="middle" font-size="11" fill="#4a1f70">Block Public Access always on</text>
  <text x="782" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#4a1f70">RAG, semantic search</text>
  <text x="782" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#4a1f70">(see vector databases page)</text>
</svg>
