<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-machine-learning-in-metal-4-ml-pass-in-frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One Metal 4 command buffer: render, ML, compute, present</text>
<rect x="20" y="70" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3">Draw the scene</text>
<text x="105.0" y="124.2" text-anchor="middle" font-size="12" fill="#3730A3">at low resolution</text>
<text x="105.0" y="139.2" text-anchor="middle" font-size="12" fill="#3730A3">colour + depth</text>
<circle cx="34" cy="66" r="11" fill="#4F46E5"/><text x="34" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="105" y="190" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Render pass 1</text>
<rect x="200" y="70" width="170" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="285.0" y="109.2" text-anchor="middle" font-size="12" fill="#92400E">MTL4MachineLearning</text>
<text x="285.0" y="124.2" text-anchor="middle" font-size="12" fill="#92400E">CommandEncoder</text>
<text x="285.0" y="139.2" text-anchor="middle" font-size="12" fill="#92400E">dispatchNetwork</text>
<circle cx="214" cy="66" r="11" fill="#B45309"/><text x="214" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="285" y="190" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">ML pass</text>
<rect x="380" y="70" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3">Inline tensor ops</text>
<text x="465.0" y="124.2" text-anchor="middle" font-size="12" fill="#3730A3">(matmul2d) or</text>
<text x="465.0" y="139.2" text-anchor="middle" font-size="12" fill="#3730A3">post-process kernel</text>
<circle cx="394" cy="66" r="11" fill="#4F46E5"/><text x="394" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="465" y="190" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Compute pass</text>
<rect x="560" y="70" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3">Composite, tone map</text>
<text x="645.0" y="124.2" text-anchor="middle" font-size="12" fill="#3730A3">draw to drawable</text>
<text x="645.0" y="139.2" text-anchor="middle" font-size="12" fill="#3730A3">present</text>
<circle cx="574" cy="66" r="11" fill="#4F46E5"/><text x="574" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="645" y="190" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Render pass 2</text>
<line x1="190" y1="120" x2="200" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-machine-learning-in-metal-4-ml-pass-in-frame)"/>
<line x1="370" y1="120" x2="380" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-machine-learning-in-metal-4-ml-pass-in-frame)"/>
<line x1="550" y1="120" x2="560" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-machine-learning-in-metal-4-ml-pass-in-frame)"/>
<rect x="20" y="222" width="330" height="44" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="185.0" y="248.2" text-anchor="middle" font-size="12" fill="#374151">Argument table: textures, MTLTensor handles</text>
<rect x="380" y="222" width="170" height="44" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="465.0" y="240.7" text-anchor="middle" font-size="12" fill="#374151">Intermediates heap</text>
<text x="465.0" y="255.7" text-anchor="middle" font-size="12" fill="#374151">(MTLHeap)</text>
<rect x="560" y="222" width="170" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">Barriers between passes</text>
<text x="645.0" y="254.8" text-anchor="middle" font-size="11" fill="#065F46">(consumer waits producer)</text>
<line x1="285" y1="222" x2="285" y2="172" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-machine-learning-in-metal-4-ml-pass-in-frame)"/>
<line x1="465" y1="222" x2="465" y2="172" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-machine-learning-in-metal-4-ml-pass-in-frame)"/>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">All four passes are encoded into the same MTL4CommandBuffer and run on the GPU timeline, with no CPU round trip.</text>
</svg>
