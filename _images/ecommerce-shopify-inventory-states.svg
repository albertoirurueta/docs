<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify inventory states</title>
  <desc id="d">A bar showing 40 units on hand at one location as 28 available, 8 committed and 4 unavailable, with 24 incoming units arriving through a transfer, and the moves between states.</desc>
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g fill="#f2f5f8">
    <text x="30" y="34" font-size="15" font-weight="bold">PC-ETH-WHL-250 at the Madrid roastery</text>
    <text x="30" y="56" font-size="13">on hand 40 = available 28 + committed 8 + unavailable 4</text>

    <rect x="30" y="72" width="420" height="52" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="240" y="94" text-anchor="middle" font-size="14" font-weight="bold">available 28</text>
    <text x="240" y="112" text-anchor="middle" font-size="12">can be sold online and in person</text>
    <rect x="450" y="72" width="120" height="52" fill="#b0743a" stroke="#f2f5f8"/>
    <text x="510" y="94" text-anchor="middle" font-size="14" font-weight="bold">committed 8</text>
    <text x="510" y="112" text-anchor="middle" font-size="12">unfulfilled orders</text>
    <rect x="570" y="72" width="60" height="52" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="600" y="94" text-anchor="middle" font-size="12" font-weight="bold">unavail.</text>
    <text x="600" y="112" text-anchor="middle" font-size="12">4</text>

    <path d="M30,134 L30,142 L630,142 L630,134" fill="none" stroke="#f2f5f8" stroke-width="1.5"/>
    <text x="330" y="160" text-anchor="middle" font-size="13" font-weight="bold">on hand 40</text>

    <rect x="30" y="220" width="250" height="52" rx="8" fill="none" stroke="#f2f5f8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="155" y="242" text-anchor="middle" font-size="14" font-weight="bold">incoming 24</text>
    <text x="155" y="260" text-anchor="middle" font-size="12">transfer or purchase order</text>
    <line x1="155" y1="218" x2="155" y2="128" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
    <text x="165" y="196" font-size="12">received: becomes available</text>

    <text x="30" y="312" font-size="12">Unavailable splits into reserved, damaged, safety_stock and quality_control in the API.</text>
    <text x="30" y="332" font-size="12">Incoming is not part of on hand until it is received.</text>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <text x="440" y="212" font-weight="bold" font-size="13">Moves between states</text>
    <text x="440" y="236">order placed: available → committed</text>
    <text x="440" y="256">order fulfilled: committed leaves on hand</text>
    <text x="440" y="276">damaged item: available → unavailable</text>
    <text x="440" y="296">stocktake: on hand and available change together</text>
  </g>
</svg>
