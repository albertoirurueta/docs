<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Upgrade runbook of a Magento shop from one minor release to the next</title>
<desc id="d">Three phases: preparation while the shop is online (inventory, dependencies, scanning custom code, rehearsal on staging), the maintenance window (maintenance mode, draining consumers, backup, Composer require-commerce and update, setup:upgrade, compile and deploy, leaving maintenance mode) and verification afterwards (database status, tests, reindex, PHP version step, patch status).</desc>
<rect width="1000" height="640" rx="14" fill="#2b3a4a"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/></marker></defs>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Upgrade runbook: from 2.4.8-p5 to 2.4.9 (Composer, on-premises)</text>
<rect x="30" y="56" width="300" height="560" rx="12" fill="#35607a" fill-opacity="0.35" stroke="#35607a" stroke-width="2"/>
<text x="44" y="82" font-size="14" font-weight="bold" fill="#f2f5f8">1  Prepare (shop online)</text>
<rect x="42" y="98" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="54" y="120" font-size="13.5" font-weight="bold" fill="#f2f5f8">Inventory</text>
<text x="54" y="140" font-size="11.5" fill="#f2f5f8">Custom modules, themes, third-party</text>
<text x="54" y="156" font-size="11.5" fill="#f2f5f8">extensions, patches applied</text>
<line x1="180.0" y1="190" x2="180.0" y2="200" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="42" y="200" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="54" y="222" font-size="13.5" font-weight="bold" fill="#f2f5f8">Dependencies</text>
<text x="54" y="242" font-size="11.5" fill="#f2f5f8">PHP 8.4, OpenSearch 3, MariaDB 11.8,</text>
<text x="54" y="258" font-size="11.5" fill="#f2f5f8">Composer 2.10: valid on both versions</text>
<line x1="180.0" y1="292" x2="180.0" y2="302" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="42" y="302" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="54" y="324" font-size="13.5" font-weight="bold" fill="#f2f5f8">Scan custom code</text>
<text x="54" y="344" font-size="11.5" fill="#f2f5f8">phpcs PHPCompatibility + Magento2, PHPStan,</text>
<text x="54" y="360" font-size="11.5" fill="#f2f5f8">UCT (Commerce only)</text>
<line x1="180.0" y1="394" x2="180.0" y2="404" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="42" y="404" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="54" y="426" font-size="13.5" font-weight="bold" fill="#f2f5f8">Rehearse</text>
<text x="54" y="446" font-size="11.5" fill="#f2f5f8">Staging copy of the production database:</text>
<text x="54" y="462" font-size="11.5" fill="#f2f5f8">whole runbook, tests, timing</text>
<rect x="350" y="56" width="300" height="560" rx="12" fill="#7a4f35" fill-opacity="0.35" stroke="#7a4f35" stroke-width="2"/>
<text x="364" y="82" font-size="14" font-weight="bold" fill="#f2f5f8">2  Window (maintenance mode on)</text>
<rect x="362" y="98" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="374" y="120" font-size="13.5" font-weight="bold" fill="#f2f5f8">Freeze</text>
<text x="374" y="140" font-size="11.5" fill="#f2f5f8">maintenance:enable, drain queue consumers,</text>
<text x="374" y="156" font-size="11.5" fill="#f2f5f8">cron:remove</text>
<line x1="500.0" y1="190" x2="500.0" y2="200" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="362" y="200" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="374" y="222" font-size="13.5" font-weight="bold" fill="#f2f5f8">Back up</text>
<text x="374" y="242" font-size="11.5" fill="#f2f5f8">Database dump, composer.json and</text>
<text x="374" y="258" font-size="11.5" fill="#f2f5f8">composer.lock, app/etc</text>
<line x1="500.0" y1="292" x2="500.0" y2="302" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="362" y="302" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="374" y="324" font-size="13.5" font-weight="bold" fill="#f2f5f8">Change packages</text>
<text x="374" y="344" font-size="11.5" fill="#f2f5f8">composer require-commerce ... --no-update,</text>
<text x="374" y="360" font-size="11.5" fill="#f2f5f8">merge the root composer.json, composer</text>
<text x="374" y="376" font-size="11.5" fill="#f2f5f8">update</text>
<line x1="500.0" y1="394" x2="500.0" y2="404" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="362" y="404" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="374" y="426" font-size="13.5" font-weight="bold" fill="#f2f5f8">Upgrade</text>
<text x="374" y="446" font-size="11.5" fill="#f2f5f8">Clear generated and var/cache,</text>
<text x="374" y="462" font-size="11.5" fill="#f2f5f8">setup:upgrade, setup:di:compile, static</text>
<text x="374" y="478" font-size="11.5" fill="#f2f5f8">content deploy</text>
<line x1="500.0" y1="496" x2="500.0" y2="506" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="362" y="506" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="374" y="528" font-size="13.5" font-weight="bold" fill="#f2f5f8">Reopen</text>
<text x="374" y="548" font-size="11.5" fill="#f2f5f8">maintenance:disable, cron:install,</text>
<text x="374" y="564" font-size="11.5" fill="#f2f5f8">indexer:reindex, cache:flush</text>
<rect x="670" y="56" width="300" height="560" rx="12" fill="#2f6b73" fill-opacity="0.35" stroke="#2f6b73" stroke-width="2"/>
<text x="684" y="82" font-size="14" font-weight="bold" fill="#f2f5f8">3  Verify (shop online)</text>
<rect x="682" y="98" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="694" y="120" font-size="13.5" font-weight="bold" fill="#f2f5f8">Check</text>
<text x="694" y="140" font-size="11.5" fill="#f2f5f8">setup:db:status, module:status, patch</text>
<text x="694" y="156" font-size="11.5" fill="#f2f5f8">status, logs</text>
<line x1="820.0" y1="190" x2="820.0" y2="200" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="682" y="200" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="694" y="222" font-size="13.5" font-weight="bold" fill="#f2f5f8">Test</text>
<text x="694" y="242" font-size="11.5" fill="#f2f5f8">Unit and integration tests, MFTF smoke</text>
<text x="694" y="258" font-size="11.5" fill="#f2f5f8">tests, order as guest and customer</text>
<line x1="820.0" y1="292" x2="820.0" y2="302" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="682" y="302" width="276" height="92" rx="9" fill="#2b3a4a" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="694" y="324" font-size="13.5" font-weight="bold" fill="#f2f5f8">Platform step</text>
<text x="694" y="344" font-size="11.5" fill="#f2f5f8">PHP 8.4 to 8.5 after the application is on</text>
<text x="694" y="360" font-size="11.5" fill="#f2f5f8">2.4.9, then re-run the tests</text>
<line x1="331" y1="330" x2="348" y2="330" stroke="#f2f5f8" stroke-width="2" marker-end="url(#m)"/>
<line x1="651" y1="330" x2="668" y2="330" stroke="#f2f5f8" stroke-width="2" marker-end="url(#m)"/>
</svg>