<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">An interface value is two words: a type word and a data word</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">an interface is nil only when both words are nil; a nil pointer stored in an interface still sets the type word</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker>
  </defs>
  <g stroke="#dddddd"><line x1="235" y1="64" x2="235" y2="520"/><line x1="460" y1="64" x2="460" y2="520"/><line x1="685" y1="64" x2="685" y2="520"/></g>

  <!-- Panel A: nil interface -->
  <text x="127" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">nil interface</text>
  <text x="127" y="104" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">var e error</text>
  <rect x="20" y="124" width="100" height="36" fill="#f0f0f0" stroke="#777777"/>
  <rect x="120" y="124" width="100" height="36" fill="#f0f0f0" stroke="#777777"/>
  <text x="70" y="147" font-size="13" fill="#222222" text-anchor="middle">itab: nil</text>
  <text x="170" y="147" font-size="13" fill="#222222" text-anchor="middle">data: nil</text>
  <text x="20" y="116" font-size="11" fill="#666666">word 1</text>
  <text x="120" y="116" font-size="11" fill="#666666">word 2</text>
  <text x="127" y="200" font-size="12" fill="#444444" text-anchor="middle">no dynamic type, no value</text>
  <text x="127" y="440" font-size="13" font-weight="bold" fill="#1f7a3a" text-anchor="middle">e == nil is true</text>
  <text x="127" y="460" font-size="12" fill="#444444" text-anchor="middle">calling e.Error() panics:</text>
  <text x="127" y="476" font-size="12" fill="#444444" text-anchor="middle">there is no method to find</text>

  <!-- Panel B: interface holding a pointer -->
  <text x="352" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">holding a pointer</text>
  <text x="352" y="104" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">var s Store = NewMemStore()</text>
  <rect x="245" y="124" width="100" height="36" fill="#e8f0f8" stroke="#1c4b73"/>
  <rect x="345" y="124" width="100" height="36" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="295" y="147" font-size="13" fill="#222222" text-anchor="middle">itab</text>
  <text x="395" y="147" font-size="13" fill="#222222" text-anchor="middle">data</text>
  <line x1="295" y1="160" x2="295" y2="206" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="395" y1="160" x2="395" y2="330" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="245" y="208" width="100" height="106" rx="3" fill="#f7f9fb" stroke="#9aa9b8"/>
  <g font-size="11" fill="#222222">
    <text x="251" y="226" font-weight="bold">itab (cached)</text>
    <text x="251" y="244">Store</text>
    <text x="251" y="260">*MemStore</text>
    <text x="251" y="278">fun[0] Get</text>
    <text x="251" y="294">fun[1] Put</text>
    <text x="251" y="310">fun[2] All</text>
  </g>
  <rect x="345" y="332" width="100" height="62" rx="3" fill="#fff8e6" stroke="#b58a1f"/>
  <g font-size="11" fill="#222222">
    <text x="351" y="350" font-weight="bold">MemStore</text>
    <text x="351" y="368">mu, books</text>
    <text x="351" y="384" fill="#666666">(the pointee)</text>
  </g>
  <text x="352" y="440" font-size="13" font-weight="bold" fill="#b23a2a" text-anchor="middle">s == nil is false</text>
  <text x="352" y="460" font-size="12" fill="#444444" text-anchor="middle">s.Get(i) loads fun[0] from the</text>
  <text x="352" y="476" font-size="12" fill="#444444" text-anchor="middle">itab and calls it with data</text>

  <!-- Panel C: typed nil pointer -->
  <text x="577" y="82" font-size="14" font-weight="bold" fill="#b23a2a" text-anchor="middle">typed nil pointer</text>
  <text x="577" y="100" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">var p *ParseError</text>
  <text x="577" y="115" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">var err error = p</text>
  <rect x="470" y="124" width="100" height="36" fill="#fbe4e0" stroke="#b23a2a"/>
  <rect x="570" y="124" width="100" height="36" fill="#f0f0f0" stroke="#777777"/>
  <text x="520" y="147" font-size="13" fill="#222222" text-anchor="middle">itab</text>
  <text x="620" y="147" font-size="13" fill="#222222" text-anchor="middle">data: nil</text>
  <line x1="520" y1="160" x2="520" y2="206" stroke="#b23a2a" stroke-width="1.6" marker-end="url(#r)"/>
  <rect x="470" y="208" width="100" height="90" rx="3" fill="#fdf3f1" stroke="#b23a2a"/>
  <g font-size="11" fill="#222222">
    <text x="476" y="226" font-weight="bold">itab (cached)</text>
    <text x="476" y="244">error</text>
    <text x="476" y="260">*ParseError</text>
    <text x="476" y="278">fun[0] Error</text>
  </g>
  <text x="577" y="330" font-size="12" fill="#444444" text-anchor="middle">the type word is set, so the</text>
  <text x="577" y="346" font-size="12" fill="#444444" text-anchor="middle">interface is not nil even</text>
  <text x="577" y="362" font-size="12" fill="#444444" text-anchor="middle">though the pointer inside is</text>
  <text x="577" y="440" font-size="13" font-weight="bold" fill="#b23a2a" text-anchor="middle">err == nil is false</text>
  <text x="577" y="460" font-size="12" fill="#444444" text-anchor="middle">err.Error() runs with a nil</text>
  <text x="577" y="476" font-size="12" fill="#444444" text-anchor="middle">receiver (may panic inside)</text>

  <!-- Panel D: empty interface -->
  <text x="802" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">empty interface (any)</text>
  <text x="802" y="104" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">var v any = Book{...}</text>
  <rect x="695" y="124" width="100" height="36" fill="#e8f0f8" stroke="#1c4b73"/>
  <rect x="795" y="124" width="100" height="36" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="745" y="147" font-size="13" fill="#222222" text-anchor="middle">type</text>
  <text x="845" y="147" font-size="13" fill="#222222" text-anchor="middle">data</text>
  <line x1="745" y1="160" x2="745" y2="206" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="845" y1="160" x2="845" y2="330" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="695" y="208" width="100" height="62" rx="3" fill="#f7f9fb" stroke="#9aa9b8"/>
  <g font-size="11" fill="#222222">
    <text x="701" y="226" font-weight="bold">type descriptor</text>
    <text x="701" y="244">Book</text>
    <text x="701" y="260" fill="#666666">size, kind, ...</text>
  </g>
  <rect x="795" y="332" width="100" height="62" rx="3" fill="#fff8e6" stroke="#b58a1f"/>
  <g font-size="11" fill="#222222">
    <text x="801" y="350" font-weight="bold">copy of Book</text>
    <text x="801" y="368">ISBN, Title,</text>
    <text x="801" y="384">Authors</text>
  </g>
  <text x="802" y="440" font-size="13" font-weight="bold" fill="#b23a2a" text-anchor="middle">v == nil is false</text>
  <text x="802" y="460" font-size="12" fill="#444444" text-anchor="middle">no methods, so no itab: the</text>
  <text x="802" y="476" font-size="12" fill="#444444" text-anchor="middle">type word points straight</text>
  <text x="802" y="492" font-size="12" fill="#444444" text-anchor="middle">to the type descriptor</text>

  <text x="470" y="520" font-size="12" fill="#666666" text-anchor="middle">on a 64-bit platform every interface value is 16 bytes, whatever it holds (shown by unsafe.Sizeof in the page)</text>
</svg>
