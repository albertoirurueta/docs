<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Three ways to authenticate users of an app</text>
  <g stroke="#4F46E5" stroke-width="1.5"><rect x="16" y="50" width="226" height="270" rx="10" fill="#FEF3C7" stroke="#B45309"/><rect x="267" y="50" width="226" height="270" rx="10" fill="#FFFFFF"/><rect x="518" y="50" width="226" height="270" rx="10" fill="#FFFFFF"/></g>
  <circle cx="36" cy="70" r="11" fill="#B45309"/><text x="36" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="287" cy="70" r="11" fill="#4F46E5"/><text x="287" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="538" cy="70" r="11" fill="#4F46E5"/><text x="538" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="56" y="75" font-size="13" font-weight="bold" fill="#92400E">Frictionless (preferred)</text>
  <text x="307" y="75" font-size="13" font-weight="bold" fill="#1F2937">OAuth to a provider</text>
  <text x="558" y="75" font-size="13" font-weight="bold" fill="#1F2937">Manual</text>
  <g font-size="12" fill="#374151">
  <text x="30" y="108">Canva user is already known.</text><text x="30" y="126">App asks Canva for a user</text><text x="30" y="144">token (JWT) and sends it to</text><text x="30" y="162">your backend, which verifies</text><text x="30" y="180">it and finds the account.</text>
  <text x="30" y="212" font-weight="bold">No login screen for the user</text>
  <text x="281" y="108">Your service has its own</text><text x="281" y="126">sign-in. App calls the auth</text><text x="281" y="144">API: initOauth, then</text><text x="281" y="162">requestAuthorization and</text><text x="281" y="180">getAccessToken.</text>
  <text x="281" y="212" font-weight="bold">Configured under Auth providers</text>
  <text x="532" y="108">App shows its own login or</text><text x="532" y="126">link-account screen and</text><text x="532" y="144">manages the session itself.</text><text x="532" y="180">Use when the other two</text><text x="532" y="198">do not fit.</text>
  <text x="532" y="230" font-weight="bold">Most work for you</text>
  </g>
  <rect x="30" y="250" width="198" height="52" rx="6" fill="#FFFFFF" stroke="#B45309"/><text x="129" y="272" font-size="11" fill="#92400E" text-anchor="middle">Token from getCanvaUserToken</text><text x="129" y="288" font-size="11" fill="#92400E" text-anchor="middle">verified only on the backend</text>
  <rect x="281" y="250" width="198" height="52" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="380" y="272" font-size="11" fill="#374151" text-anchor="middle">Start from a user action or</text><text x="380" y="288" font-size="11" fill="#374151" text-anchor="middle">render, never at module load</text>
  <rect x="532" y="250" width="198" height="52" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="631" y="272" font-size="11" fill="#374151" text-anchor="middle">Still verify tokens you rely</text><text x="631" y="288" font-size="11" fill="#374151" text-anchor="middle">on for Canva identity</text>
  <text x="380" y="348" font-size="12" fill="#374151" text-anchor="middle">Bookshelf Covers needs none of them while it only reads a public cover list.</text>
  <text x="380" y="366" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor and app, not a screenshot of any product.</text>
</svg>
