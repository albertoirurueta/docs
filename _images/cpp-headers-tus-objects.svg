<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>
  <defs>
    <marker id="hdrarrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- headers -->
  <rect x="10" y="20" width="120" height="40" rx="5" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
  <text x="70" y="44" text-anchor="middle" font-size="13" fill="#333">point.h</text>
  <rect x="10" y="70" width="120" height="40" rx="5" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
  <text x="70" y="94" text-anchor="middle" font-size="13" fill="#333">shape.h</text>

  <!-- sources -->
  <rect x="180" y="10" width="130" height="50" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="245" y="40" text-anchor="middle" font-size="13" fill="#1c4b73">main.cpp</text>
  <rect x="180" y="75" width="130" height="50" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="245" y="105" text-anchor="middle" font-size="13" fill="#1c4b73">shape.cpp</text>

  <line x1="130" y1="40" x2="176" y2="35" stroke="#888" stroke-width="1.5" marker-end="url(#hdrarrow)"/>
  <line x1="130" y1="90" x2="176" y2="45" stroke="#888" stroke-width="1.5" marker-end="url(#hdrarrow)"/>
  <line x1="130" y1="90" x2="176" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#hdrarrow)"/>

  <text x="245" y="145" text-anchor="middle" font-size="11" fill="#555">each = 1 translation unit</text>

  <!-- objects -->
  <rect x="380" y="10" width="120" height="50" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="13" fill="#6b4207">main.o</text>
  <rect x="380" y="75" width="120" height="50" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="440" y="105" text-anchor="middle" font-size="13" fill="#6b4207">shape.o</text>

  <line x1="310" y1="35" x2="376" y2="35" stroke="#3a3a3a" stroke-width="2" marker-end="url(#hdrarrow)"/>
  <line x1="310" y1="100" x2="376" y2="100" stroke="#3a3a3a" stroke-width="2" marker-end="url(#hdrarrow)"/>
  <text x="343" y="25" text-anchor="middle" font-size="11" fill="#555">compile</text>

  <!-- executable -->
  <rect x="570" y="45" width="130" height="50" rx="6" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="635" y="75" text-anchor="middle" font-size="13" fill="#2a6636">a.out</text>

  <line x1="500" y1="35" x2="566" y2="60" stroke="#3a3a3a" stroke-width="2" marker-end="url(#hdrarrow)"/>
  <line x1="500" y1="100" x2="566" y2="80" stroke="#3a3a3a" stroke-width="2" marker-end="url(#hdrarrow)"/>
  <text x="535" y="140" text-anchor="middle" font-size="11" fill="#555">link</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#333">A header is text pasted into every TU that includes it -- it is never itself compiled or linked directly.</text>
</svg>
