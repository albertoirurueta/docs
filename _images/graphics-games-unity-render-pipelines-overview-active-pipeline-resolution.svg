<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-rp4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How Unity decides which render pipeline is active</text>
<rect x="280" y="45" width="200" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="66.7" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Current Quality level</text>
<text x="380.0" y="81.7" text-anchor="middle" font-size="12" fill="#3730A3">has a Render Pipeline Asset?</text>
<rect x="540" y="110" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="131.7" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Use that asset</text>
<text x="640.0" y="146.7" text-anchor="middle" font-size="12" fill="#1F2937">(Quality override)</text>
<line x1="480" y1="70" x2="640" y2="70" stroke="#4B5563" stroke-width="1.5"/>
<line x1="640" y1="70" x2="640" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-rp4)"/>
<text x="560" y="62" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">yes</text>
<line x1="380" y1="95" x2="380" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-rp4)"/>
<text x="392" y="122" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">no</text>
<rect x="280" y="140" width="200" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="161.7" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Graphics settings: Default</text>
<text x="380.0" y="176.7" text-anchor="middle" font-size="12" fill="#3730A3">Render Pipeline set?</text>
<rect x="540" y="205" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="226.7" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Use the default asset</text>
<text x="640.0" y="241.7" text-anchor="middle" font-size="12" fill="#1F2937">(URP, HDRP or custom)</text>
<line x1="480" y1="165" x2="640" y2="165" stroke="#4B5563" stroke-width="1.5"/>
<line x1="640" y1="165" x2="640" y2="205" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-rp4)"/>
<text x="560" y="184" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">yes</text>
<line x1="380" y1="190" x2="380" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-rp4)"/>
<text x="392" y="217" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">no</text>
<rect x="280" y="235" width="200" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="256.7" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Built-In Render Pipeline</text>
<text x="380.0" y="271.7" text-anchor="middle" font-size="12" fill="#92400E">(no asset assigned)</text>
<rect x="20" y="60" width="220" height="200" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130" y="85" text-anchor="middle" font-size="11" fill="#374151">In scripts</text>
<text x="130" y="102" text-anchor="middle" font-size="11" fill="#374151">GraphicsSettings.</text>
<text x="130" y="119" text-anchor="middle" font-size="11" fill="#374151">currentRenderPipeline</text>
<text x="130" y="136" text-anchor="middle" font-size="11" fill="#374151">gives the active asset;</text>
<text x="130" y="153" text-anchor="middle" font-size="11" fill="#374151">QualitySettings.</text>
<text x="130" y="170" text-anchor="middle" font-size="11" fill="#374151">renderPipeline is the</text>
<text x="130" y="187" text-anchor="middle" font-size="11" fill="#374151">per-level override.</text>
</svg>
