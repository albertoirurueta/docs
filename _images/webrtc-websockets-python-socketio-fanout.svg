<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two Uvicorn processes each running an ASGIApp with a Socket.IO AsyncServer and a FastAPI app, connected to one Redis that carries the pub/sub channel socketio and the Chatterbox state, plus a write-only announcer process</title>
  <defs>
    <marker id="pyfan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Fan-out across Uvicorn processes with AsyncRedisManager</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">a room exists on every process that has a member; the manager relays each emit through Redis pub/sub</text>

  <rect x="20" y="70" width="150" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="95" y="94" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser A</text>
  <text x="95" y="112" font-size="10.5" fill="#0d3c75" text-anchor="middle">alice, io() websocket</text>

  <rect x="630" y="70" width="150" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="705" y="94" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser B</text>
  <text x="705" y="112" font-size="10.5" fill="#0d3c75" text-anchor="middle">bob, io() websocket</text>

  <rect x="20" y="170" width="250" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="145" y="194" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Uvicorn process 1</text>
  <text x="145" y="214" font-size="10.5" fill="#1b5e20" text-anchor="middle">ASGIApp</text>
  <text x="145" y="231" font-size="10.5" fill="#1b5e20" text-anchor="middle">AsyncServer (rooms of its sockets)</text>
  <text x="145" y="248" font-size="10.5" fill="#1b5e20" text-anchor="middle">other_asgi_app: FastAPI /ticket</text>
  <text x="145" y="265" font-size="10.5" fill="#1b5e20" text-anchor="middle">AsyncRedisManager</text>

  <rect x="530" y="170" width="250" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="655" y="194" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Uvicorn process 2</text>
  <text x="655" y="214" font-size="10.5" fill="#1b5e20" text-anchor="middle">ASGIApp</text>
  <text x="655" y="231" font-size="10.5" fill="#1b5e20" text-anchor="middle">AsyncServer (rooms of its sockets)</text>
  <text x="655" y="248" font-size="10.5" fill="#1b5e20" text-anchor="middle">other_asgi_app: FastAPI /ticket</text>
  <text x="655" y="265" font-size="10.5" fill="#1b5e20" text-anchor="middle">AsyncRedisManager</text>

  <rect x="305" y="170" width="190" height="110" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="400" y="194" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Redis</text>
  <text x="400" y="214" font-size="10.5" fill="#7f1d1d" text-anchor="middle">pub/sub channel "socketio"</text>
  <text x="400" y="231" font-size="10.5" fill="#7f1d1d" text-anchor="middle">room seq, messages, log</text>
  <text x="400" y="248" font-size="10.5" fill="#7f1d1d" text-anchor="middle">tickets, acks, sessions</text>
  <text x="400" y="265" font-size="10.5" fill="#7f1d1d" text-anchor="middle">presence counters</text>

  <rect x="305" y="318" width="190" height="46" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="400" y="338" font-size="12" font-weight="bold" fill="#6d4c00" text-anchor="middle">announce.py</text>
  <text x="400" y="354" font-size="10" fill="#6d4c00" text-anchor="middle">write_only manager, no sockets</text>

  <line x1="95" y1="126" x2="95" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#pyfan-arrow)"/>
  <line x1="705" y1="126" x2="705" y2="170" stroke="#444444" stroke-width="1.5" marker-end="url(#pyfan-arrow)"/>
  <line x1="270" y1="225" x2="305" y2="225" stroke="#444444" stroke-width="1.5" marker-start="url(#pyfan-arrow)" marker-end="url(#pyfan-arrow)"/>
  <line x1="530" y1="225" x2="495" y2="225" stroke="#444444" stroke-width="1.5" marker-start="url(#pyfan-arrow)" marker-end="url(#pyfan-arrow)"/>
  <line x1="400" y1="318" x2="400" y2="280" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#pyfan-arrow)"/>
  <text x="112" y="152" font-size="10" fill="#555555">one Socket.IO connection</text>
  <text x="688" y="152" font-size="10" fill="#555555" text-anchor="end">one Socket.IO connection</text>
</svg>
