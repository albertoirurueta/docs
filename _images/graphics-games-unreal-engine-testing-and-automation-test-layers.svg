<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Test layers: from a function to a device farm</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#374151"></text>
<rect x="20.0" y="58" width="640" height="64" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="340.0" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Automation Spec and simple tests</text>
<text x="340.0" y="100" text-anchor="middle" font-size="12" fill="#3730A3">C++, milliseconds</text>
<text x="340.0" y="116" text-anchor="middle" font-size="11" fill="#374151">Pure logic: scoring, parsing, math</text>
<rect x="70.0" y="134" width="540" height="64" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="340.0" y="158" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">CQTest</text>
<text x="340.0" y="176" text-anchor="middle" font-size="12" fill="#3730A3">C++ with fixtures and latent steps</text>
<text x="340.0" y="192" text-anchor="middle" font-size="11" fill="#374151">Classes that need setup and several frames</text>
<rect x="120.0" y="210" width="440" height="64" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="340.0" y="234" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Functional tests</text>
<text x="340.0" y="252" text-anchor="middle" font-size="12" fill="#3730A3">Test actors in a map, C++ or Blueprint</text>
<text x="340.0" y="268" text-anchor="middle" font-size="11" fill="#374151">Gameplay in a real level and world</text>
<rect x="170.0" y="286" width="340" height="64" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="340.0" y="310" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Gauntlet</text>
<text x="340.0" y="328" text-anchor="middle" font-size="12" fill="#92400E">Whole sessions on devices</text>
<text x="340.0" y="344" text-anchor="middle" font-size="11" fill="#374151">Packaged builds, clients and servers, boot tests</text>
<line x1="710" y1="330" x2="710" y2="62" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<text x="722" y="200" text-anchor="start" font-size="11" fill="#374151">slower</text>
<text x="722" y="340" text-anchor="start" font-size="11" fill="#374151">faster</text>
<text x="380" y="366" text-anchor="middle" font-size="12" fill="#374151">Run many cheap tests on every change and a few expensive ones on every build</text>
