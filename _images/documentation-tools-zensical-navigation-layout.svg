<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Zensical page layout with navigation features</title>
  <desc id="d">A page with header, tabs row, left sidebar, breadcrumb path, content and right table of contents, each labelled with the feature that controls it.</desc>
  <rect width="720" height="360" rx="12" fill="#1f2937"/>
  <rect x="20" y="16" width="680" height="40" rx="6" fill="#374151" stroke="#9ca3af"/>
  <text x="36" y="41" fill="#f9fafb" font-size="14">Header: site name, search, palette</text>
  <rect x="20" y="64" width="680" height="34" rx="6" fill="#1e40af" stroke="#93c5fd"/>
  <text x="36" y="86" fill="#ffffff" font-size="14">Tabs row: navigation.tabs (top-level entries), navigation.tabs.sticky</text>
  <rect x="20" y="106" width="170" height="210" rx="6" fill="#065f46" stroke="#6ee7b7"/>
  <text x="32" y="130" fill="#ffffff" font-size="13" font-weight="bold">Left sidebar</text>
  <text x="32" y="152" fill="#ecfdf5" font-size="12">navigation.sections</text>
  <text x="32" y="172" fill="#ecfdf5" font-size="12">navigation.expand</text>
  <text x="32" y="192" fill="#ecfdf5" font-size="12">navigation.prune</text>
  <text x="32" y="212" fill="#ecfdf5" font-size="12">navigation.indexes</text>
  <text x="32" y="240" fill="#ecfdf5" font-size="12">hide: [navigation]</text>
  <rect x="200" y="106" width="320" height="30" rx="6" fill="#7c2d12" stroke="#fdba74"/>
  <text x="212" y="126" fill="#ffffff" font-size="13">Breadcrumbs: navigation.path</text>
  <rect x="200" y="144" width="320" height="172" rx="6" fill="#374151" stroke="#9ca3af"/>
  <text x="212" y="170" fill="#f9fafb" font-size="13" font-weight="bold">Page content</text>
  <text x="212" y="194" fill="#e5e7eb" font-size="12">navigation.instant, .prefetch, .progress</text>
  <text x="212" y="214" fill="#e5e7eb" font-size="12">data-preview header links</text>
  <text x="212" y="234" fill="#e5e7eb" font-size="12">navigation.top: back-to-top button</text>
  <rect x="530" y="106" width="170" height="210" rx="6" fill="#581c87" stroke="#d8b4fe"/>
  <text x="542" y="130" fill="#ffffff" font-size="13" font-weight="bold">Table of contents</text>
  <text x="542" y="152" fill="#f5f3ff" font-size="12">toc.follow</text>
  <text x="542" y="172" fill="#f5f3ff" font-size="12">toc.integrate</text>
  <text x="542" y="192" fill="#f5f3ff" font-size="12">navigation.tracking</text>
  <text x="542" y="220" fill="#f5f3ff" font-size="12">hide: [toc]</text>
  <text x="360" y="342" fill="#d1d5db" font-size="12" text-anchor="middle">Tabs and sections apply to viewports wider than 1220 px</text>
</svg>
