<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Same logits, three temperatures</text>
  <text x="380" y="42" font-size="11.5" fill="#666666" text-anchor="middle">Logits for four candidate next tokens: "the"=2.0, "a"=1.0, "an"=0.5, "this"=0.1 -- the distribution flattens as T rises</text>

  <!-- shared layout -->
  <!-- panel width 220, 3 panels, gap 20, left margin 40 -->

  <!-- Panel 1: T = 0.2 -->
  <g>
    <rect x="40" y="66" width="220" height="244" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="150" y="86" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">T = 0.2 (near-greedy)</text>

    <!-- baseline -->
    <line x1="60" y1="280" x2="240" y2="280" stroke="#999999" stroke-width="1"/>

    <!-- bars: max height 180px at y=280 top -->
    <!-- the: 0.9927 -->
    <rect x="65" y="100.5" width="30" height="179.5" fill="#1c4b73"/>
    <text x="80" y="94" font-size="10.5" fill="#222222" text-anchor="middle">0.993</text>
    <text x="80" y="294" font-size="10.5" fill="#333333" text-anchor="middle">the</text>

    <!-- a: 0.0067 -->
    <rect x="110" y="278.8" width="30" height="1.2" fill="#1c4b73"/>
    <text x="125" y="272" font-size="10.5" fill="#222222" text-anchor="middle">0.007</text>
    <text x="125" y="294" font-size="10.5" fill="#333333" text-anchor="middle">a</text>

    <!-- an: 0.0005 -->
    <rect x="155" y="279.9" width="30" height="0.1" fill="#1c4b73"/>
    <text x="170" y="272" font-size="10.5" fill="#222222" text-anchor="middle">0.001</text>
    <text x="170" y="294" font-size="10.5" fill="#333333" text-anchor="middle">an</text>

    <!-- this: 0.0001 -->
    <rect x="200" y="279.98" width="30" height="0.02" fill="#1c4b73"/>
    <text x="215" y="272" font-size="10.5" fill="#222222" text-anchor="middle">0.000</text>
    <text x="215" y="294" font-size="10.5" fill="#333333" text-anchor="middle">this</text>
  </g>

  <!-- Panel 2: T = 1 -->
  <g>
    <rect x="270" y="66" width="220" height="244" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="380" y="86" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">T = 1 (unmodified softmax)</text>

    <line x1="290" y1="280" x2="470" y2="280" stroke="#999999" stroke-width="1"/>

    <!-- the: 0.5745 -->
    <rect x="295" y="177.6" width="30" height="102.4" fill="#2f5424"/>
    <text x="310" y="171" font-size="10.5" fill="#222222" text-anchor="middle">0.574</text>
    <text x="310" y="294" font-size="10.5" fill="#333333" text-anchor="middle">the</text>

    <!-- a: 0.2114 -->
    <rect x="340" y="242.3" width="30" height="37.7" fill="#2f5424"/>
    <text x="355" y="236" font-size="10.5" fill="#222222" text-anchor="middle">0.211</text>
    <text x="355" y="294" font-size="10.5" fill="#333333" text-anchor="middle">a</text>

    <!-- an: 0.1282 -->
    <rect x="385" y="257" width="30" height="23" fill="#2f5424"/>
    <text x="400" y="251" font-size="10.5" fill="#222222" text-anchor="middle">0.128</text>
    <text x="400" y="294" font-size="10.5" fill="#333333" text-anchor="middle">an</text>

    <!-- this: 0.0859 -->
    <rect x="430" y="264.6" width="30" height="15.4" fill="#2f5424"/>
    <text x="445" y="259" font-size="10.5" fill="#222222" text-anchor="middle">0.086</text>
    <text x="445" y="294" font-size="10.5" fill="#333333" text-anchor="middle">this</text>
  </g>

  <!-- Panel 3: T = 2 -->
  <g>
    <rect x="500" y="66" width="220" height="244" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>
    <text x="610" y="86" font-size="13" font-weight="bold" fill="#7a3b12" text-anchor="middle">T = 2 (flatter, more random)</text>

    <line x1="520" y1="280" x2="700" y2="280" stroke="#999999" stroke-width="1"/>

    <!-- the: 0.4056 -->
    <rect x="525" y="207.2" width="30" height="72.8" fill="#7a3b12"/>
    <text x="540" y="201" font-size="10.5" fill="#222222" text-anchor="middle">0.406</text>
    <text x="540" y="294" font-size="10.5" fill="#333333" text-anchor="middle">the</text>

    <!-- a: 0.246 -->
    <rect x="570" y="235.7" width="30" height="44.3" fill="#7a3b12"/>
    <text x="585" y="229" font-size="10.5" fill="#222222" text-anchor="middle">0.246</text>
    <text x="585" y="294" font-size="10.5" fill="#333333" text-anchor="middle">a</text>

    <!-- an: 0.1916 -->
    <rect x="615" y="245.5" width="30" height="34.5" fill="#7a3b12"/>
    <text x="630" y="239" font-size="10.5" fill="#222222" text-anchor="middle">0.192</text>
    <text x="630" y="294" font-size="10.5" fill="#333333" text-anchor="middle">an</text>

    <!-- this: 0.1569 -->
    <rect x="660" y="251.7" width="30" height="28.3" fill="#7a3b12"/>
    <text x="675" y="245" font-size="10.5" fill="#222222" text-anchor="middle">0.157</text>
    <text x="675" y="294" font-size="10.5" fill="#333333" text-anchor="middle">this</text>
  </g>

  <text x="380" y="326" font-size="11" fill="#666666" text-anchor="middle">p_i = e^(z_i / T) / sum_j e^(z_j / T) -- lower T sharpens toward the top logit, higher T flattens toward uniform</text>
</svg>
