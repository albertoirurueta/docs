<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Adding a Post Process Volume to L_Library</text>
<rect x="20.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="114" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Place</text>
<text x="106" y="105" text-anchor="middle" font-size="11" fill="#374151">Place Actors panel:</text>
<text x="106" y="121" text-anchor="middle" font-size="11" fill="#374151">Volumes &gt;</text>
<text x="106" y="137" text-anchor="middle" font-size="11" fill="#374151">Post Process Volume;</text>
<text x="106" y="153" text-anchor="middle" font-size="11" fill="#374151">drop it in</text>
<text x="106" y="169" text-anchor="middle" font-size="11" fill="#374151">L_Library</text>
<text x="106" y="262" text-anchor="middle" font-size="11" fill="#374151">Brush volume</text>
<text x="106" y="276" text-anchor="middle" font-size="11" fill="#374151">in the level</text>
<line x1="191" y1="145" x2="203" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="203.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="219" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="219" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="296" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Extent</text>
<text x="288" y="105" text-anchor="middle" font-size="11" fill="#374151">Details: tick</text>
<text x="288" y="121" text-anchor="middle" font-size="11" fill="#374151">Infinite Extent</text>
<text x="288" y="137" text-anchor="middle" font-size="11" fill="#374151">(Unbound) for a</text>
<text x="288" y="153" text-anchor="middle" font-size="11" fill="#374151">whole-level look or</text>
<text x="288" y="169" text-anchor="middle" font-size="11" fill="#374151">scale the brush</text>
<text x="288" y="262" text-anchor="middle" font-size="11" fill="#374151">Bounds or</text>
<text x="288" y="276" text-anchor="middle" font-size="11" fill="#374151">unbound</text>
<line x1="374" y1="145" x2="386" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="386.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="402" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="480" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Settings</text>
<text x="472" y="105" text-anchor="middle" font-size="11" fill="#374151">Tick the check box</text>
<text x="472" y="121" text-anchor="middle" font-size="11" fill="#374151">next to each setting</text>
<text x="472" y="137" text-anchor="middle" font-size="11" fill="#374151">to override it:</text>
<text x="472" y="153" text-anchor="middle" font-size="11" fill="#374151">Exposure, Bloom,</text>
<text x="472" y="169" text-anchor="middle" font-size="11" fill="#374151">Color Grading</text>
<text x="472" y="262" text-anchor="middle" font-size="11" fill="#374151">Only ticked</text>
<text x="472" y="276" text-anchor="middle" font-size="11" fill="#374151">values apply</text>
<line x1="557" y1="145" x2="569" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="569.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="585" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="585" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="662" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Blend</text>
<text x="654" y="105" text-anchor="middle" font-size="11" fill="#374151">Set Priority,</text>
<text x="654" y="121" text-anchor="middle" font-size="11" fill="#374151">Blend Radius and</text>
<text x="654" y="137" text-anchor="middle" font-size="11" fill="#374151">Blend Weight;</text>
<text x="654" y="153" text-anchor="middle" font-size="11" fill="#374151">press Play and</text>
<text x="654" y="169" text-anchor="middle" font-size="11" fill="#374151">walk into it</text>
<text x="654" y="262" text-anchor="middle" font-size="11" fill="#374151">Check it in</text>
<text x="654" y="276" text-anchor="middle" font-size="11" fill="#374151">PIE</text>
</svg>
