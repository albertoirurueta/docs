<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The context manager protocol</text>
  <text x="360" y="47" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">with Ctx() as x:</text>

  <!-- Step 1: __enter__ -->
  <rect x="40" y="66" width="300" height="46" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="86" font-size="13" fill="#222222" font-family="'Courier New', monospace">Ctx().__enter__()</text>
  <text x="52" y="103" font-size="11" fill="#666666">called first; its return value is bound to x</text>

  <text x="360" y="94" font-size="13" font-weight="bold" fill="#1c4b73">1</text>

  <!-- arrow down to body -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="190" y1="112" x2="190" y2="142"/>
    <polygon points="184,142 196,142 190,150" stroke="none"/>
  </g>

  <!-- Step 2: body -->
  <rect x="40" y="152" width="300" height="56" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="172" font-size="13" fill="#222222" font-family="'Courier New', monospace">    body runs, using x</text>
  <text x="52" y="189" font-size="11" fill="#666666">the indented with-block; may raise</text>
  <text x="52" y="203" font-size="11" fill="#666666">an exception at any point</text>

  <text x="360" y="184" font-size="13" font-weight="bold" fill="#1c4b73">2</text>

  <!-- split into two branches -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="120" y1="208" x2="120" y2="230"/>
    <line x1="120" y1="230" x2="260" y2="230"/>
    <line x1="120" y1="230" x2="120" y2="252"/>
    <polygon points="114,252 126,252 120,260" stroke="none"/>
    <line x1="260" y1="230" x2="260" y2="252"/>
    <polygon points="254,252 266,252 260,260" stroke="none"/>
  </g>
  <text x="70" y="224" font-size="10.5" fill="#666666">normal exit</text>
  <text x="270" y="224" font-size="10.5" fill="#666666">exception raised</text>

  <!-- Step 3a: normal path -->
  <rect x="20" y="262" width="220" height="60" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="32" y="280" font-size="12.5" fill="#222222" font-family="'Courier New', monospace">__exit__(None, None, None)</text>
  <text x="32" y="297" font-size="11" fill="#666666">no exception: all three args</text>
  <text x="32" y="311" font-size="11" fill="#666666">are None</text>

  <text x="248" y="296" font-size="13" font-weight="bold" fill="#1c4b73">3a</text>

  <!-- Step 3b: exception path -->
  <rect x="270" y="262" width="240" height="60" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="282" y="280" font-size="12.5" fill="#222222" font-family="'Courier New', monospace">__exit__(exc_type, exc, tb)</text>
  <text x="282" y="297" font-size="11" fill="#666666">exception info passed in as the</text>
  <text x="282" y="311" font-size="11" fill="#666666">three arguments</text>

  <text x="518" y="296" font-size="13" font-weight="bold" fill="#1c4b73">3b</text>

  <!-- arrow from 3a down to continue -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="130" y1="322" x2="130" y2="350"/>
    <polygon points="124,350 136,350 130,358" stroke="none"/>
  </g>
  <rect x="20" y="360" width="220" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="32" y="378" font-size="11.5" fill="#2f5424">execution continues normally</text>
  <text x="32" y="392" font-size="11" fill="#666666">after the with-block</text>

  <!-- arrows from 3b down to two outcomes -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="390" y1="322" x2="390" y2="336"/>
    <line x1="390" y1="336" x2="330" y2="336"/>
    <line x1="330" y1="336" x2="330" y2="350"/>
    <polygon points="324,350 336,350 330,358" stroke="none"/>
    <line x1="390" y1="336" x2="450" y2="336"/>
    <line x1="450" y1="336" x2="450" y2="350"/>
    <polygon points="444,350 456,350 450,358" stroke="none"/>
  </g>

  <rect x="270" y="360" width="120" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="282" y="378" font-size="11.5" fill="#8a1f1f" font-weight="bold">returns False</text>
  <text x="282" y="393" font-size="11" fill="#666666">(or None):</text>
  <text x="282" y="406" font-size="11" fill="#666666">exception re-raised</text>

  <rect x="400" y="360" width="120" height="52" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="412" y="378" font-size="11.5" fill="#2f5424" font-weight="bold">returns True</text>
  <text x="412" y="393" font-size="11" fill="#666666">exception is</text>
  <text x="412" y="406" font-size="11" fill="#666666">swallowed</text>

  <text x="360" y="440" font-size="12" fill="#444444" text-anchor="middle">__enter__ runs once on entry; __exit__ always runs on exit, and its return value decides whether an exception propagates.</text>
</svg>
