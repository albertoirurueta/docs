<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="rc-red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#a33a3a"/>
    </marker>
    <marker id="rc-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#4a7a3a"/>
    </marker>
    <marker id="rc-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2f6fa8"/>
    </marker>
  </defs>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A retain cycle, and how __weak breaks it</text>

  <!-- LEFT: the cycle -->
  <rect x="25" y="50" width="345" height="315" rx="8" fill="#fbf3f3" stroke="#a33a3a" stroke-width="2"/>
  <text x="197" y="73" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Both references strong &#8212; leaked</text>

  <rect x="70" y="95" width="250" height="62" rx="6" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
  <text x="195" y="117" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Parent</text>
  <text x="195" y="136" font-size="11" font-family="Menlo, Consolas, monospace" fill="#8a1f1f" text-anchor="middle">@property (strong) Child *child;</text>
  <text x="195" y="151" font-size="10.5" fill="#a33a3a" text-anchor="middle">retain count: 1 (held by the child)</text>

  <rect x="70" y="235" width="250" height="62" rx="6" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
  <text x="195" y="257" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Child</text>
  <text x="195" y="276" font-size="11" font-family="Menlo, Consolas, monospace" fill="#8a1f1f" text-anchor="middle">@property (strong) Parent *parent;</text>
  <text x="195" y="291" font-size="10.5" fill="#a33a3a" text-anchor="middle">retain count: 1 (held by the parent)</text>

  <path d="M150 157 L150 232" stroke="#a33a3a" stroke-width="2.5" marker-end="url(#rc-red)"/>
  <text x="110" y="198" font-size="11" font-weight="bold" fill="#8a1f1f" text-anchor="middle">strong</text>

  <path d="M245 232 L245 157" stroke="#a33a3a" stroke-width="2.5" marker-end="url(#rc-red)"/>
  <text x="290" y="198" font-size="11" font-weight="bold" fill="#8a1f1f" text-anchor="middle">strong</text>

  <text x="197" y="322" font-size="11" fill="#8a1f1f" text-anchor="middle">Every outside reference can go away, and neither</text>
  <text x="197" y="337" font-size="11" fill="#8a1f1f" text-anchor="middle">count reaches 0. dealloc never runs on either object.</text>
  <text x="197" y="355" font-size="11" font-weight="bold" fill="#8a1f1f" text-anchor="middle">ARC counts correctly &#8212; and still leaks.</text>

  <!-- RIGHT: broken -->
  <rect x="390" y="50" width="345" height="315" rx="8" fill="#f2f7f0" stroke="#4a7a3a" stroke-width="2"/>
  <text x="562" y="73" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Back-reference weak &#8212; reclaimed</text>

  <rect x="435" y="95" width="250" height="62" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
  <text x="560" y="117" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Parent</text>
  <text x="560" y="136" font-size="11" font-family="Menlo, Consolas, monospace" fill="#2f5424" text-anchor="middle">@property (strong) Child *child;</text>
  <text x="560" y="151" font-size="10.5" fill="#4a7a3a" text-anchor="middle">retain count: 0 once the owner lets go</text>

  <rect x="435" y="235" width="250" height="62" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
  <text x="560" y="257" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Child</text>
  <text x="560" y="276" font-size="11" font-family="Menlo, Consolas, monospace" fill="#2f5424" text-anchor="middle">@property (weak) Parent *parent;</text>
  <text x="560" y="291" font-size="10.5" fill="#4a7a3a" text-anchor="middle">released when the parent is released</text>

  <path d="M515 157 L515 232" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#rc-green)"/>
  <text x="475" y="198" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">strong</text>

  <path d="M610 232 L610 157" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rc-green)"/>
  <text x="655" y="192" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">weak</text>
  <text x="655" y="207" font-size="10" fill="#4a7a3a" text-anchor="middle">(zeroed on dealloc)</text>

  <text x="562" y="322" font-size="11" fill="#2f5424" text-anchor="middle">The owner holds strong; the owned holds weak. When the</text>
  <text x="562" y="337" font-size="11" fill="#2f5424" text-anchor="middle">parent's last strong reference goes, both are deallocated,</text>
  <text x="562" y="355" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">and child.parent becomes nil rather than dangling.</text>

  <text x="380" y="393" font-size="11.5" fill="#5b7089" text-anchor="middle">The same shape appears three ways: parent/child back-references, delegate properties (always weak), and blocks that</text>
  <text x="380" y="409" font-size="11.5" fill="#5b7089" text-anchor="middle">capture self while self owns the block (use __weak typeof(self) weakSelf, then a __strong strongSelf inside).</text>
</svg>
