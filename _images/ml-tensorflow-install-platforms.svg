<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Where TensorFlow GPU works</title>
  <desc id="d">Four platform boxes: Linux uses tensorflow[and-cuda] for NVIDIA GPUs; Windows native is CPU only after 2.10 and uses WSL2 for GPU; macOS uses tensorflow-metal for Apple silicon; Docker images ship CUDA libraries and need only the NVIDIA driver.</desc>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Where TensorFlow GPU works</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
    <rect x="24" y="56" width="156" height="200" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="102" y="82" text-anchor="middle" font-size="15" font-weight="bold">Linux</text>
    <text x="102" y="112" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">tensorflow[and-cuda]</text>
    <text x="102" y="140" text-anchor="middle" font-size="12">NVIDIA GPU</text>
    <text x="102" y="160" text-anchor="middle" font-size="12">driver only on host</text>
    <text x="102" y="180" text-anchor="middle" font-size="12">CUDA libs from pip</text>
    <rect x="192" y="56" width="156" height="200" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
    <text x="270" y="82" text-anchor="middle" font-size="15" font-weight="bold">Windows native</text>
    <text x="270" y="112" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">tensorflow (CPU)</text>
    <text x="270" y="140" text-anchor="middle" font-size="12">GPU ended after 2.10</text>
    <text x="270" y="160" text-anchor="middle" font-size="12">use WSL2 for GPU</text>
    <rect x="360" y="56" width="156" height="200" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
    <text x="438" y="82" text-anchor="middle" font-size="15" font-weight="bold">WSL2 (Windows)</text>
    <text x="438" y="112" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">tensorflow[and-cuda]</text>
    <text x="438" y="140" text-anchor="middle" font-size="12">Linux userland</text>
    <text x="438" y="160" text-anchor="middle" font-size="12">Windows NVIDIA driver</text>
    <rect x="528" y="56" width="168" height="200" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="612" y="82" text-anchor="middle" font-size="15" font-weight="bold">macOS</text>
    <text x="612" y="112" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">tensorflow-metal</text>
    <text x="612" y="140" text-anchor="middle" font-size="12">Apple silicon GPU</text>
    <text x="612" y="160" text-anchor="middle" font-size="12">plug-in, separate project</text>
  </g>
  <text x="360" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Original summary of the tensorflow.org install pages and the Apple Metal plug-in page.</text>
</svg>
