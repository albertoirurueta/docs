<svg viewBox="0 0 880 470" width="880" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
<text x="440.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a portable shelf CLI meets platform differences</text>
<text x="440.0" y="48" font-size="13" fill="#666666" text-anchor="middle">Each row is a decision the program must not hard-code; use the language abstraction instead.</text>
<rect x="173.0" y="64" width="166.5" height="26" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
<text x="256.25" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Windows</text>
<rect x="345.5" y="64" width="166.5" height="26" rx="6" fill="#e3efe0" stroke="#2a6a2a"/>
<text x="428.75" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">macOS</text>
<rect x="518.0" y="64" width="166.5" height="26" rx="6" fill="#f8e9c4" stroke="#a07820"/>
<text x="601.25" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Linux</text>
<rect x="690.5" y="64" width="166.5" height="26" rx="6" fill="#efe0f0" stroke="#6a3a7a"/>
<text x="773.75" y="82" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">FreeBSD / OpenBSD</text>
<rect x="20" y="96" width="840" height="36" rx="6" fill="#f7f9fc" stroke="#c9d3de"/>
<text x="30" y="118" font-size="12" font-weight="bold" fill="#222222">Path separator</text>
<text x="256.25" y="118" font-size="11" fill="#333333" text-anchor="middle">\ and / (drive letters, UNC)</text>
<text x="428.75" y="118" font-size="11" fill="#333333" text-anchor="middle">/</text>
<text x="601.25" y="118" font-size="11" fill="#333333" text-anchor="middle">/</text>
<text x="773.75" y="118" font-size="11" fill="#333333" text-anchor="middle">/</text>
<rect x="20" y="136" width="840" height="36" rx="6" fill="#ffffff" stroke="#c9d3de"/>
<text x="30" y="158" font-size="12" font-weight="bold" fill="#222222">Case in file names</text>
<text x="256.25" y="158" font-size="11" fill="#333333" text-anchor="middle">insensitive (per-dir option)</text>
<text x="428.75" y="158" font-size="11" fill="#333333" text-anchor="middle">insensitive by default</text>
<text x="601.25" y="158" font-size="11" fill="#333333" text-anchor="middle">sensitive</text>
<text x="773.75" y="158" font-size="11" fill="#333333" text-anchor="middle">sensitive (UFS)</text>
<rect x="20" y="176" width="840" height="36" rx="6" fill="#f7f9fc" stroke="#c9d3de"/>
<text x="30" y="198" font-size="12" font-weight="bold" fill="#222222">Line ending (text)</text>
<text x="256.25" y="198" font-size="11" fill="#333333" text-anchor="middle">CRLF by convention</text>
<text x="428.75" y="198" font-size="11" fill="#333333" text-anchor="middle">LF</text>
<text x="601.25" y="198" font-size="11" fill="#333333" text-anchor="middle">LF</text>
<text x="773.75" y="198" font-size="11" fill="#333333" text-anchor="middle">LF</text>
<rect x="20" y="216" width="840" height="36" rx="6" fill="#ffffff" stroke="#c9d3de"/>
<text x="30" y="238" font-size="12" font-weight="bold" fill="#222222">Env var names</text>
<text x="256.25" y="238" font-size="11" fill="#333333" text-anchor="middle">case-insensitive</text>
<text x="428.75" y="238" font-size="11" fill="#333333" text-anchor="middle">case-sensitive</text>
<text x="601.25" y="238" font-size="11" fill="#333333" text-anchor="middle">case-sensitive</text>
<text x="773.75" y="238" font-size="11" fill="#333333" text-anchor="middle">case-sensitive</text>
<rect x="20" y="256" width="840" height="36" rx="6" fill="#f7f9fc" stroke="#c9d3de"/>
<text x="30" y="278" font-size="12" font-weight="bold" fill="#222222">PATH separator</text>
<text x="256.25" y="278" font-size="11" fill="#333333" text-anchor="middle">; (plus PATHEXT)</text>
<text x="428.75" y="278" font-size="11" fill="#333333" text-anchor="middle">:</text>
<text x="601.25" y="278" font-size="11" fill="#333333" text-anchor="middle">:</text>
<text x="773.75" y="278" font-size="11" fill="#333333" text-anchor="middle">:</text>
<rect x="20" y="296" width="840" height="36" rx="6" fill="#ffffff" stroke="#c9d3de"/>
<text x="30" y="318" font-size="12" font-weight="bold" fill="#222222">Run a script</text>
<text x="256.25" y="318" font-size="11" fill="#333333" text-anchor="middle">extension, no shebang</text>
<text x="428.75" y="318" font-size="11" fill="#333333" text-anchor="middle">exec bit + shebang</text>
<text x="601.25" y="318" font-size="11" fill="#333333" text-anchor="middle">exec bit + shebang</text>
<text x="773.75" y="318" font-size="11" fill="#333333" text-anchor="middle">exec bit + shebang</text>
<rect x="20" y="336" width="840" height="36" rx="6" fill="#f7f9fc" stroke="#c9d3de"/>
<text x="30" y="358" font-size="12" font-weight="bold" fill="#222222">Stop request</text>
<text x="256.25" y="358" font-size="11" fill="#333333" text-anchor="middle">Ctrl event / CTRL_CLOSE</text>
<text x="428.75" y="358" font-size="11" fill="#333333" text-anchor="middle">SIGINT, SIGTERM</text>
<text x="601.25" y="358" font-size="11" fill="#333333" text-anchor="middle">SIGINT, SIGTERM</text>
<text x="773.75" y="358" font-size="11" fill="#333333" text-anchor="middle">SIGINT, SIGTERM</text>
<rect x="20" y="376" width="840" height="36" rx="6" fill="#ffffff" stroke="#c9d3de"/>
<text x="30" y="398" font-size="12" font-weight="bold" fill="#222222">Default shell</text>
<text x="256.25" y="398" font-size="11" fill="#333333" text-anchor="middle">cmd, PowerShell</text>
<text x="428.75" y="398" font-size="11" fill="#333333" text-anchor="middle">zsh</text>
<text x="601.25" y="398" font-size="11" fill="#333333" text-anchor="middle">bash / dash</text>
<text x="773.75" y="398" font-size="11" fill="#333333" text-anchor="middle">sh (ksh on OpenBSD)</text>
<rect x="20" y="422" width="840" height="34" rx="6" fill="#fdf8ee" stroke="#a07820"/>
<text x="440.0" y="443" font-size="12" fill="#333333" text-anchor="middle">Abstractions: Path / PathBuf / filepath.Join / pathlib / Path.Combine, home and config directory APIs, which / LookPath, signal libraries.</text>
</svg>
