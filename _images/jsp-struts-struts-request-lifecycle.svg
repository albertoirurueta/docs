<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4d9c"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e6b34"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Struts 7 request lifecycle</text>
  <text x="480" y="44" font-size="12" fill="#666666" text-anchor="middle">GET /books.action?filter=sci: the filter finds the action, the invocation recurses through the interceptors, the result runs at the innermost level</text>

  <!-- left column: filter, mapper, proxy, invocation -->
  <rect x="30" y="70" width="400" height="58" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="62" y="94" font-size="12" font-weight="bold" fill="#222222">Browser</text>
  <text x="62" y="112" font-size="11" fill="#555555">HTTP request: GET /books.action?filter=sci</text>

  <rect x="30" y="152" width="400" height="74" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="62" y="176" font-size="12" font-weight="bold" fill="#133a75">Servlet container: filter chain</text>
  <text x="62" y="194" font-size="11" fill="#1a4d9c">StrutsPrepareAndExecuteFilter: skip excluded URLs, serve /static/*,</text>
  <text x="62" y="210" font-size="11" fill="#1a4d9c">set encoding, bind ActionContext, wrap the request</text>

  <rect x="30" y="250" width="400" height="66" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="62" y="274" font-size="12" font-weight="bold" fill="#133a75">ActionMapper.getMapping(request)</text>
  <text x="62" y="292" font-size="11" fill="#1a4d9c">returns an ActionMapping: namespace "/", name "books", method null,</text>
  <text x="62" y="306" font-size="11" fill="#1a4d9c">or null, and then the request simply continues down the filter chain</text>

  <rect x="30" y="340" width="400" height="74" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="62" y="364" font-size="12" font-weight="bold" fill="#133a75">Dispatcher.serviceAction, ActionProxyFactory</text>
  <text x="62" y="382" font-size="11" fill="#1a4d9c">ActionProxy looks the action up in the Configuration (struts.xml);</text>
  <text x="62" y="398" font-size="11" fill="#1a4d9c">ObjectFactory builds a new action; the interceptor objects are shared</text>

  <rect x="30" y="438" width="400" height="58" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="62" y="462" font-size="12" font-weight="bold" fill="#5c4600">ActionInvocation.invoke()</text>
  <text x="62" y="480" font-size="11" fill="#8a6a00">command pattern: walks the interceptor list, then the action, then the result</text>

  <line x1="230" y1="128" x2="230" y2="150" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="226" x2="230" y2="248" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="316" x2="230" y2="338" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="414" x2="230" y2="436" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>

  <circle cx="44" cy="82" r="10" fill="#222222"/><text x="44" y="86" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="44" cy="164" r="10" fill="#1a4d9c"/><text x="44" y="168" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="44" cy="262" r="10" fill="#1a4d9c"/><text x="44" y="266" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="44" cy="352" r="10" fill="#1a4d9c"/><text x="44" y="356" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="44" cy="450" r="10" fill="#8a6a00"/><text x="44" y="454" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- right column: nested interceptors -->
  <rect x="490" y="70" width="440" height="430" fill="#f3f7ff" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="524" y="90" font-size="12" font-weight="bold" fill="#133a75">interceptor 1 (outer)</text>
  <text x="914" y="90" font-size="10" fill="#1a4d9c" text-anchor="end">code before invoke()</text>
  <text x="524" y="490" font-size="10" fill="#1a4d9c">interceptors after invoke(): code runs innermost first, so this one runs last</text>

  <rect x="510" y="104" width="400" height="368" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="526" y="124" font-size="12" font-weight="bold" fill="#133a75">interceptor 2 ... n-1 (defaultStack)</text>
  <text x="894" y="124" font-size="10" fill="#1a4d9c" text-anchor="end">params, validation, workflow ...</text>
  <text x="526" y="462" font-size="10" fill="#1a4d9c">code after invoke()</text>

  <rect x="530" y="138" width="360" height="304" fill="#dbe7fc" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="546" y="158" font-size="12" font-weight="bold" fill="#133a75">interceptor n (innermost)</text>
  <text x="546" y="432" font-size="10" fill="#1a4d9c">code after invoke() (first)</text>

  <rect x="560" y="176" width="300" height="62" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="576" y="198" font-size="12" font-weight="bold" fill="#14501f">Action: BookAction.execute()</text>
  <text x="576" y="216" font-size="11" fill="#1e6b34">returns the result code "success"</text>

  <rect x="560" y="262" width="300" height="46" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="576" y="282" font-size="12" font-weight="bold" fill="#5c4600">PreResultListeners</text>
  <text x="576" y="298" font-size="11" fill="#8a6a00">beforeResult(invocation, "success")</text>

  <rect x="560" y="332" width="300" height="76" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="576" y="354" font-size="12" font-weight="bold" fill="#14501f">Result: dispatcher (JSP)</text>
  <text x="576" y="372" font-size="11" fill="#1e6b34">/WEB-INF/views/books.jsp reads the action</text>
  <text x="576" y="388" font-size="11" fill="#1e6b34">through the ValueStack and writes the response</text>

  <line x1="710" y1="238" x2="710" y2="260" stroke="#1e6b34" stroke-width="1.6" marker-end="url(#arrg)"/>
  <line x1="710" y1="308" x2="710" y2="330" stroke="#1e6b34" stroke-width="1.6" marker-end="url(#arrg)"/>

  <!-- invocation to interceptors -->
  <path d="M 430 467 L 462 467 L 462 150 L 488 150" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="456" y="300" font-size="10" fill="#444444" text-anchor="end" transform="rotate(-90 456 300)">invoke()</text>

  <circle cx="506" cy="86" r="10" fill="#1a4d9c"/><text x="506" y="90" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <circle cx="548" cy="196" r="10" fill="#1e6b34"/><text x="548" y="200" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <circle cx="548" cy="282" r="10" fill="#8a6a00"/><text x="548" y="286" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <circle cx="548" cy="352" r="10" fill="#1e6b34"/><text x="548" y="356" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <circle cx="506" cy="486" r="10" fill="#1a4d9c"/><text x="506" y="490" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>

  <!-- response -->
  <rect x="30" y="520" width="400" height="48" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <circle cx="44" cy="532" r="10" fill="#222222"/><text x="44" y="536" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
  <text x="62" y="540" font-size="12" font-weight="bold" fill="#222222">Response leaves through the filters</text>
  <text x="62" y="556" font-size="11" fill="#555555">cleanup of ActionContext and request wrapper, then HTTP 200</text>
  <path d="M 930 500 L 930 544 L 432 544" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="680" y="538" font-size="10" fill="#444444" text-anchor="middle">return flows back out, innermost first</text>

  <!-- internal container -->
  <rect x="30" y="590" width="900" height="38" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="480" y="606" font-size="12" font-weight="bold" fill="#5c4600" text-anchor="middle">Internal container (beans from struts-beans.xml and plugins, constants from default.properties and struts.xml)</text>
  <text x="480" y="621" font-size="11" fill="#8a6a00" text-anchor="middle">ObjectFactory, ActionProxyFactory, ActionMapper, StaticContentLoader, DispatcherErrorHandler, ValueStackFactory ... all replaceable by name</text>
</svg>
