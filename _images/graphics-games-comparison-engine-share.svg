<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 535" width="860" height="535" role="img" aria-labelledby="engine-share-t engine-share-d">
<title id="engine-share-t">Engine usage by studio type, survey data</title>
<desc id="engine-share-d">Share of respondents who use each engine, by studio type, from the JetBrains State of GameDev 2025 report (Developer Ecosystem Survey 2025): Unity 64% of AAA, 63% of mid-size and indie, 57% of hobbyist respondents; Unreal Engine 55%, 38% and 28%; Godot and custom C++ engines shown for context. Respondents could pick several engines, so the shares do not sum to 100%. This is survey data with few AAA respondents, not market share. No GDC 2026 percentages are cited.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}</style>
<rect width="860" height="535" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Engine usage by studio type, survey data</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Unity</text><rect class="m1" x="301" y="-4" width="8" height="8"/><text x="323" y="4">Unreal Engine</text><path class="m2" d="M528 -5L533 4L523 4Z"/><text x="546" y="4">Godot (context)</text><path class="m3" d="M82 15L87 20L82 25L77 20Z"/><text x="100" y="24">Custom C++ engine (context)</text></g></g><line class="grid" x1="70" y1="408" x2="836" y2="408"/><text class="muted" x="62" y="412" text-anchor="end">0</text><line class="grid" x1="70" y1="333" x2="836" y2="333"/><text class="muted" x="62" y="337" text-anchor="end">20</text><line class="grid" x1="70" y1="258" x2="836" y2="258"/><text class="muted" x="62" y="262" text-anchor="end">40</text><line class="grid" x1="70" y1="183" x2="836" y2="183"/><text class="muted" x="62" y="187" text-anchor="end">60</text><line class="grid" x1="70" y1="108" x2="836" y2="108"/><text class="muted" x="62" y="112" text-anchor="end">80</text><path class="axis" d="M70 108V408H836"/><g><title>Unity: 64%</title><rect class="f0" x="118.67" y="168" width="38" height="240"/><text class="muted" x="137.67" y="164" text-anchor="middle" font-size="10">64%</text></g><g><title>Unreal Engine: 55%</title><rect class="f1" x="158.67" y="201.75" width="38" height="206.25"/><text class="muted" x="177.67" y="197.75" text-anchor="middle" font-size="10">55%</text></g><g><title>Godot (context): 19%</title><rect class="f2" x="198.67" y="336.75" width="38" height="71.25"/><text class="muted" x="217.67" y="332.75" text-anchor="middle" font-size="10">19%</text></g><g><title>Custom C++ engine (context): 19%</title><rect class="f3" x="238.67" y="336.75" width="38" height="71.25"/><text class="muted" x="257.67" y="332.75" text-anchor="middle" font-size="10">19%</text></g><text x="197.67" y="426" text-anchor="middle"><tspan x="197.67" dy="0">AAA studio</tspan></text><g><title>Unity: 63%</title><rect class="f0" x="374" y="171.75" width="38" height="236.25"/><text class="muted" x="393" y="167.75" text-anchor="middle" font-size="10">63%</text></g><g><title>Unreal Engine: 38%</title><rect class="f1" x="414" y="265.5" width="38" height="142.5"/><text class="muted" x="433" y="261.5" text-anchor="middle" font-size="10">38%</text></g><g><title>Godot (context): 18%</title><rect class="f2" x="454" y="340.5" width="38" height="67.5"/><text class="muted" x="473" y="336.5" text-anchor="middle" font-size="10">18%</text></g><g><title>Custom C++ engine (context): 8%</title><rect class="f3" x="494" y="378" width="38" height="30"/><text class="muted" x="513" y="374" text-anchor="middle" font-size="10">8%</text></g><text x="453" y="426" text-anchor="middle"><tspan x="453" dy="0">Mid-size and indie studio</tspan></text><g><title>Unity: 57%</title><rect class="f0" x="629.33" y="194.25" width="38" height="213.75"/><text class="muted" x="648.33" y="190.25" text-anchor="middle" font-size="10">57%</text></g><g><title>Unreal Engine: 28%</title><rect class="f1" x="669.33" y="303" width="38" height="105"/><text class="muted" x="688.33" y="299" text-anchor="middle" font-size="10">28%</text></g><g><title>Godot (context): 31%</title><rect class="f2" x="709.33" y="291.75" width="38" height="116.25"/><text class="muted" x="728.33" y="287.75" text-anchor="middle" font-size="10">31%</text></g><g><title>Custom C++ engine (context): 9%</title><rect class="f3" x="749.33" y="374.25" width="38" height="33.75"/><text class="muted" x="768.33" y="370.25" text-anchor="middle" font-size="10">9%</text></g><text x="708.33" y="426" text-anchor="middle"><tspan x="708.33" dy="0">Hobbyist</tspan></text><text class="axis-label" x="453" y="468" text-anchor="middle">Studio type (survey group)</text><text class="axis-label" transform="translate(16 258) rotate(-90)" text-anchor="middle">Respondents using the engine (%)</text>
