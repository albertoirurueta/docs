<text class="footer" x="24" y="484" text-anchor="start"><tspan x="24" dy="0">Source: JetBrains State of GameDev 2025 (lp.jetbrains.com/the-state-of-gamedev-2025); retrieved 2026-11-01. Survey data: sample size and</tspan><tspan x="24" dy="15">fieldwork dates are not stated on the page. Raw data: scripts/graphics-games-comparison-charts/data/current.csv. See the References for the</tspan><tspan x="24" dy="15">sources.</tspan></text>
