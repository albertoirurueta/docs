<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Layers of defence around a PrestaShop shop</title>
  <desc id="d">A request travels from the browser through the edge (TLS, web application firewall, security headers), the web server (deny rules, hidden admin folder, rate limits), the PrestaShop controllers (form tokens, input validation, back-office permission checks) and the data layer (escaped SQL, least-privilege database account). Below the request path three supply chain boxes show the places where vulnerable code enters the shop: core releases, bundled modules and third-party modules, each fed by an advisory source.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Request path : each layer assumes the previous one can fail</text>

  <!-- request path boxes -->
  <g>
    <rect x="30" y="64" width="150" height="190" rx="10" fill="#3d5266"/>
    <rect x="215" y="64" width="170" height="190" rx="10" fill="#33485c"/>
    <rect x="420" y="64" width="170" height="190" rx="10" fill="#3d5266"/>
    <rect x="625" y="64" width="185" height="190" rx="10" fill="#33485c"/>
    <rect x="845" y="64" width="90" height="190" rx="10" fill="#3d5266"/>
  </g>
  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="90" font-weight="bold">Browser</text>
    <text x="42" y="116" font-size="12.5">Customer or</text>
    <text x="42" y="133" font-size="12.5">API client of</text>
    <text x="42" y="150" font-size="12.5">Pocket Coffee,</text>
    <text x="42" y="167" font-size="12.5">or an attacker</text>

    <text x="227" y="90" font-weight="bold">Edge</text>
    <text x="227" y="116" font-size="12.5">TLS, HSTS</text>
    <text x="227" y="136" font-size="12.5">WAF / CDN rules</text>
    <text x="227" y="156" font-size="12.5">Security headers</text>
    <text x="227" y="176" font-size="12.5">CSP report-only</text>
    <text x="227" y="196" font-size="12.5">Bot and rate limits</text>

    <text x="432" y="90" font-weight="bold">Web server</text>
    <text x="432" y="116" font-size="12.5">Deny rules in</text>
    <text x="432" y="133" font-size="12.5">.htaccess / Nginx</text>
    <text x="432" y="153" font-size="12.5">Random admin folder</text>
    <text x="432" y="173" font-size="12.5">No install/ folder</text>
    <text x="432" y="193" font-size="12.5">PHP only as www user</text>

    <text x="637" y="90" font-weight="bold">PrestaShop code</text>
    <text x="637" y="116" font-size="12.5">Form tokens (CSRF)</text>
    <text x="637" y="136" font-size="12.5">Signature checks</text>
    <text x="637" y="156" font-size="12.5">Validate::, casts</text>
    <text x="637" y="176" font-size="12.5">Smarty/Twig escaping</text>
    <text x="637" y="196" font-size="12.5">#[AdminSecurity]</text>
    <text x="637" y="216" font-size="12.5">Webservice / API scopes</text>

    <text x="856" y="90" font-weight="bold">Data</text>
    <text x="856" y="116" font-size="12.5">pSQL(),</text>
    <text x="856" y="133" font-size="12.5">DbQuery</text>
    <text x="856" y="153" font-size="12.5">Least-</text>
    <text x="856" y="170" font-size="12.5">privilege</text>
    <text x="856" y="187" font-size="12.5">DB user</text>
    <text x="856" y="207" font-size="12.5">Backups</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.8">
    <path d="M182 159 L213 159" marker-end="url(#a)"/>
    <path d="M387 159 L418 159" marker-end="url(#a)"/>
    <path d="M592 159 L623 159" marker-end="url(#a)"/>
    <path d="M812 159 L843 159" marker-end="url(#a)"/>
  </g>

  <!-- supply chain -->
  <text x="40" y="304" font-size="18" font-weight="bold" fill="#f2f5f8">Supply chain : where vulnerable code arrives</text>
  <g>
    <rect x="30" y="324" width="290" height="150" rx="10" fill="#33485c"/>
    <rect x="335" y="324" width="290" height="150" rx="10" fill="#3d5266"/>
    <rect x="640" y="324" width="290" height="150" rx="10" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <text x="44" y="350" font-size="14" font-weight="bold">Core</text>
    <text x="44" y="374">Patch releases 9.x and 8.2.x</text>
    <text x="44" y="394">GitHub security advisories of</text>
    <text x="44" y="411">the core repository</text>
    <text x="44" y="434" fill="#f4b860">Action: update on every patch</text>
    <text x="44" y="454" fill="#f4b860">release</text>

    <text x="349" y="350" font-size="14" font-weight="bold">Bundled and official modules</text>
    <text x="349" y="374">ps_facetedsearch, ps_checkout,</text>
    <text x="349" y="394">ps_emailsubscription, ...</text>
    <text x="349" y="411">Updated by the Module Manager,</text>
    <text x="349" y="428">not by the core release</text>
    <text x="349" y="454" fill="#f4b860">Action: update modules separately</text>

    <text x="654" y="350" font-size="14" font-weight="bold">Third-party modules and themes</text>
    <text x="654" y="374">Addons, agencies, custom code</text>
    <text x="654" y="394">Friends-of-Presta advisories:</text>
    <text x="654" y="411">most published entries concern</text>
    <text x="654" y="428">these modules</text>
    <text x="654" y="454" fill="#f4b860">Action: inventory, review, remove</text>
  </g>
  <g fill="none" stroke="#f4b860" stroke-width="1.8" stroke-dasharray="6 4">
    <path d="M300 322 C 300 292, 690 296, 705 256" marker-end="url(#b)"/>
    <path d="M480 322 C 480 296, 710 296, 720 256" marker-end="url(#b)"/>
    <path d="M785 322 C 785 296, 760 290, 750 256" marker-end="url(#b)"/>
  </g>
</svg>
