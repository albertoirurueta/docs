<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>The five components of an LLM agent</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">The five components of an LLM agent</text>

  <!-- orchestration frame -->
  <rect x="250" y="70" width="400" height="330" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="450" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">5. Orchestration</text>
  <text x="450" y="115" text-anchor="middle" font-size="12" fill="#4c1d95">the loop, planning, routing, stop conditions and limits</text>

  <!-- loop inside orchestration -->
  <g font-size="12" fill="#1e1b4b">
    <rect x="300" y="140" width="130" height="36" rx="18" fill="#ffffff" stroke="#6d28d9"/>
    <text x="365" y="163" text-anchor="middle">Perceive</text>
    <rect x="470" y="140" width="130" height="36" rx="18" fill="#ffffff" stroke="#6d28d9"/>
    <text x="535" y="163" text-anchor="middle">Reason</text>
    <rect x="470" y="330" width="130" height="36" rx="18" fill="#ffffff" stroke="#6d28d9"/>
    <text x="535" y="353" text-anchor="middle">Act</text>
    <rect x="300" y="330" width="130" height="36" rx="18" fill="#ffffff" stroke="#6d28d9"/>
    <text x="365" y="353" text-anchor="middle">Observe</text>
  </g>
  <g stroke="#6d28d9" stroke-width="2" fill="none">
    <path d="M430 158 L466 158"/>
    <path d="M535 176 L535 326"/>
    <path d="M470 348 L434 348"/>
    <path d="M365 330 L365 180"/>
  </g>
  <g fill="#6d28d9">
    <path d="M466 153 L474 158 L466 163 Z"/>
    <path d="M530 322 L535 330 L540 322 Z"/>
    <path d="M434 343 L426 348 L434 353 Z"/>
    <path d="M360 184 L365 176 L370 184 Z"/>
  </g>

  <!-- model at center -->
  <rect x="385" y="215" width="130" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. Model</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#1e3a8a">reasons, decides</text>
  <text x="450" y="277" text-anchor="middle" font-size="12" fill="#1e3a8a">llama3.1:8b</text>

  <!-- instructions (left top) -->
  <rect x="30" y="90" width="190" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="125" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">2. Instructions</text>
  <text x="125" y="137" text-anchor="middle" font-size="12" fill="#78350f">role / persona, goals,</text>
  <text x="125" y="153" text-anchor="middle" font-size="12" fill="#78350f">rules, output format</text>
  <text x="125" y="178" text-anchor="middle" font-size="11" fill="#78350f">"You are DocsAssistant..."</text>

  <!-- memory (left bottom) -->
  <rect x="30" y="260" width="190" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="125" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">4. Memory</text>
  <text x="125" y="307" text-anchor="middle" font-size="12" fill="#14532d">short-term: this thread</text>
  <text x="125" y="323" text-anchor="middle" font-size="12" fill="#14532d">long-term: semantic,</text>
  <text x="125" y="339" text-anchor="middle" font-size="12" fill="#14532d">episodic, procedural</text>
  <text x="125" y="362" text-anchor="middle" font-size="11" fill="#14532d">checkpointer + store</text>

  <!-- tools (right) -->
  <rect x="680" y="150" width="190" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="775" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">3. Tools</text>
  <text x="775" y="197" text-anchor="middle" font-size="12" fill="#7f1d1d">read: docs_search,</text>
  <text x="775" y="213" text-anchor="middle" font-size="12" fill="#7f1d1d">docs_get_section</text>
  <text x="775" y="235" text-anchor="middle" font-size="12" fill="#7f1d1d">write (approval-gated):</text>
  <text x="775" y="251" text-anchor="middle" font-size="12" fill="#7f1d1d">github_open_issue</text>
  <text x="775" y="277" text-anchor="middle" font-size="11" fill="#7f1d1d">via function calling / MCP</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M220 145 L385 235"/>
    <path d="M220 320 L385 265"/>
    <path d="M515 250 L680 225"/>
  </g>

  <!-- environment -->
  <rect x="30" y="430" width="840" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Environment</text>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#334155">users and reviewers (human-in-the-loop) - the documentation corpus - GitHub - other agents (A2A)</text>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M450 400 L450 430"/>
    <path d="M775 300 L775 430"/>
  </g>
</svg>
