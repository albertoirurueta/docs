<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-abap-guide-data-types-strings-and-templates-02-declare-and-convert-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-data-types-strings-and-templates-02-declare-and-convert-title">Terminal after npm run run:summary: seven lines of output, from C-1001: 6 characters to Text to number plus 1: 43; callout 3 marks the seven lines</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:summary</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">C-1001: 6 characters</text>
