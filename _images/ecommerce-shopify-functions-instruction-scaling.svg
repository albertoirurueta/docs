<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Instructions used by a JavaScript Discount Function as the cart grows</title>
  <desc id="d">Measured with the local function runner. One cart line uses 0.31 million instructions, 50 lines 2.11 million, 200 lines 7.60 million of the 11 million allowed, and 1,000 lines 36.66 million of the 55 million allowed. The allowance scales proportionally above 200 lines.</desc>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#2b3a4a"/>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#f2f5f8">Coffee Club discount, JavaScript: instructions per run (millions)</text>

  <g stroke="#f2f5f8" stroke-opacity="0.35" stroke-width="1">
    <path d="M150 52 V270"/><path d="M280 52 V270"/><path d="M410 52 V270"/><path d="M540 52 V270"/><path d="M670 52 V270"/>
  </g>
  <g font-size="11" fill="#f2f5f8" text-anchor="middle">
    <text x="150" y="288">0</text><text x="280" y="288">15</text><text x="410" y="288">30</text><text x="540" y="288">45</text><text x="670" y="288">60</text>
  </g>

  <g font-size="12" fill="#f2f5f8" text-anchor="end">
    <text x="140" y="82">1 line</text>
    <text x="140" y="140">50 lines</text>
    <text x="140" y="198">200 lines</text>
    <text x="140" y="256">1,000 lines</text>
  </g>

  <g fill="none" stroke="#f2f5f8" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="150" y="62" width="95.3" height="28"/>
    <rect x="150" y="120" width="95.3" height="28"/>
    <rect x="150" y="178" width="95.3" height="28"/>
    <rect x="150" y="236" width="476.7" height="28"/>
  </g>
  <g fill="#6fb38a">
    <rect x="150" y="66" width="2.7" height="20"/>
    <rect x="150" y="124" width="18.3" height="20"/>
    <rect x="150" y="182" width="65.9" height="20"/>
    <rect x="150" y="240" width="317.7" height="20"/>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <text x="253" y="80">0.31 of 11</text>
    <text x="253" y="138">2.11 of 11</text>
    <text x="253" y="196">7.60 of 11</text>
    <text x="478" y="254">36.66 of 55</text>
  </g>
  <g font-size="11" fill="#f2f5f8">
    <rect x="450" y="62" width="22" height="10" fill="none" stroke="#f2f5f8" stroke-dasharray="5 4"/>
    <text x="478" y="71">allowance for that cart size</text>
    <rect x="450" y="80" width="22" height="10" fill="#6fb38a"/>
    <text x="478" y="89">instructions used</text>
  </g>
</svg>
