<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-debugging-and-tools-message-anatomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a KHR_debug message</text>
<text x="380" y="56" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">glDebugMessageCallback(callback, userParam) receives six values per message</text>
<rect x="30" y="72" width="200" height="182" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_DEBUG_SOURCE_*</text>
<text x="130.0" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">API</text>
<text x="130.0" y="146" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">WINDOW_SYSTEM</text>
<text x="130.0" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">SHADER_COMPILER</text>
<text x="130.0" y="194" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">THIRD_PARTY</text>
<text x="130.0" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">APPLICATION</text>
<text x="130.0" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">OTHER</text>
<rect x="250" y="72" width="220" height="206" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_DEBUG_TYPE_*</text>
<text x="360.0" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">ERROR</text>
<text x="360.0" y="146" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">DEPRECATED_BEHAVIOR</text>
<text x="360.0" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">UNDEFINED_BEHAVIOR</text>
<text x="360.0" y="194" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">PORTABILITY</text>
<text x="360.0" y="218" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">PERFORMANCE</text>
<text x="360.0" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MARKER / PUSH_GROUP / POP_GROUP</text>
<text x="360.0" y="266" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">OTHER</text>
<rect x="490" y="72" width="200" height="134" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="590.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">GL_DEBUG_SEVERITY_*</text>
<text x="590.0" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">HIGH</text>
<text x="590.0" y="146" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MEDIUM</text>
<text x="590.0" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">LOW</text>
<text x="590.0" y="194" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">NOTIFICATION</text>
<rect x="30" y="310" width="700" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="332" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Also passed: id (driver-specific number), length and the message text (a C string).</text>
<text x="380" y="347" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Put a breakpoint in the callback, enable GL_DEBUG_OUTPUT_SYNCHRONOUS, and the call stack points at the offending GL call.</text>
</svg>
