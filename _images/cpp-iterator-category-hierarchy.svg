<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="itarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="240" y="10" width="160" height="34" rx="6" fill="#fddede" stroke="#a83a3a" stroke-width="2"/>
  <text x="320" y="31" text-anchor="middle" font-size="12" fill="#7a2323">Contiguous (C++20)</text>

  <line x1="320" y1="44" x2="320" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#itarrow)"/>

  <rect x="240" y="74" width="160" height="34" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" font-size="12" fill="#6b4207">Random-access</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#555">+ O(1) it+n, it[n]</text>

  <line x1="320" y1="108" x2="320" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#itarrow)"/>

  <rect x="240" y="150" width="160" height="34" rx="6" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="320" y="171" text-anchor="middle" font-size="12" fill="#2a6636">Bidirectional</text>
  <text x="320" y="198" text-anchor="middle" font-size="10" fill="#555">+ operator--</text>

  <line x1="320" y1="184" x2="320" y2="221" stroke="#555" stroke-width="1.5" marker-end="url(#itarrow)"/>

  <rect x="240" y="226" width="160" height="34" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="320" y="247" text-anchor="middle" font-size="12" fill="#1c4b73">Forward</text>
  <text x="320" y="274" text-anchor="middle" font-size="10" fill="#555">+ multi-pass guarantee</text>

  <line x1="280" y1="260" x2="140" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#itarrow)"/>
  <line x1="360" y1="260" x2="500" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#itarrow)"/>

  <rect x="60" y="294" width="160" height="34" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="140" y="315" text-anchor="middle" font-size="12" fill="#444">Input (read, single-pass)</text>

  <rect x="420" y="294" width="160" height="34" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="500" y="315" text-anchor="middle" font-size="12" fill="#444">Output (write, single-pass)</text>
</svg>
