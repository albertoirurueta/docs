<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How WooCommerce finds the tax for a Pocket Coffee line</title>
  <desc id="d">A product has a tax class. The location comes from the customer shipping address, billing address or shop base address. WC_Tax finds the rates for country, state, postcode, city and class, orders them by priority, applies regular rates together and compound rates on top, and the result is shown including or excluding tax. Example: 2 bags at 9.90 euro to Madrid pay 10 percent, to Berlin 7 percent.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="30" y="30" width="250" height="70" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="60.0" text-anchor="middle" font-weight="bold">Product (tax status, tax class)</text>
  <text x="155.0" y="78.0" text-anchor="middle">taxable, class pocket-coffee-beans</text>
  <rect x="325" y="30" width="250" height="70" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="51.0" text-anchor="middle" font-weight="bold">Location</text>
  <text x="450.0" y="69.0" text-anchor="middle">Calculate tax based on:</text>
  <text x="450.0" y="87.0" text-anchor="middle">shipping, billing or shop base</text>
  <rect x="620" y="30" width="250" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="51.0" text-anchor="middle" font-weight="bold">Settings &gt; Tax</text>
  <text x="745.0" y="69.0" text-anchor="middle">prices entered with tax, rounding,</text>
  <text x="745.0" y="87.0" text-anchor="middle">shipping tax class, display</text>
  <line x1="280" y1="65" x2="325" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="65" x2="620" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="150" y="150" width="600" height="70" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="180.0" text-anchor="middle" font-weight="bold">WC_Tax::find_rates( country, state, postcode, city, tax_class )</text>
  <text x="450.0" y="198.0" text-anchor="middle">rows of woocommerce_tax_rates + locations, cached; filter woocommerce_find_rates</text>
  <line x1="450" y1="100" x2="450" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="265" width="260" height="80" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="160.0" y="291.0" text-anchor="middle" font-weight="bold">Priority groups</text>
  <text x="160.0" y="309.0" text-anchor="middle">one rate per priority is used;</text>
  <text x="160.0" y="327.0" text-anchor="middle">equal priority rates add up</text>
  <rect x="320" y="265" width="260" height="80" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="291.0" text-anchor="middle" font-weight="bold">Compound rates</text>
  <text x="450.0" y="309.0" text-anchor="middle">taxed on price + earlier tax</text>
  <text x="450.0" y="327.0" text-anchor="middle">(calc_exclusive_tax / inclusive)</text>
  <rect x="610" y="265" width="260" height="80" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="740.0" y="291.0" text-anchor="middle" font-weight="bold">Rounding</text>
  <text x="740.0" y="309.0" text-anchor="middle">woocommerce_tax_round,</text>
  <text x="740.0" y="327.0" text-anchor="middle">per line or at subtotal</text>
  <line x1="450" y1="220" x2="160" y2="265" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="220" x2="450" y2="265" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="220" x2="740" y2="265" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="385" width="300" height="65" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="270.0" y="412.5" text-anchor="middle" font-weight="bold">Madrid 28013 (ES)</text>
  <text x="270.0" y="430.5" text-anchor="middle">IVA 10%: 2 x 9.90 -&gt; tax 1.98, total 21.78</text>
  <rect x="480" y="385" width="300" height="65" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="630.0" y="412.5" text-anchor="middle" font-weight="bold">Berlin 10115 (DE)</text>
  <text x="630.0" y="430.5" text-anchor="middle">MwSt 7%: 2 x 9.90 -&gt; tax 1.39, total 21.19</text>
  <line x1="450" y1="345" x2="270" y2="385" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="345" x2="630" y2="385" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
