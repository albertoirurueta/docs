<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="stackoverflow-questions-traditional-t stackoverflow-questions-traditional-d">
<title id="stackoverflow-questions-traditional-t">Stack Overflow questions per year (traditional open-source)</title>
<desc id="stackoverflow-questions-traditional-d">Questions asked each year on Stack Overflow with the tag of WordPress, Drupal, Joomla, TYPO3, Craft CMS, 2018 to 2025. The number of questions asked on the whole site has fallen since 2023, so a falling line says little about the popularity of a CMS. The partial year 2026 is omitted.</desc>
