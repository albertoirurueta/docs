<text x="380" y="215" text-anchor="middle" font-size="12" fill="#374151">In C++ the same chain is CreateWidget and AddToPlayerScreen, or AddWidget on a stack.</text>
<text x="380" y="235" text-anchor="middle" font-size="12" fill="#374151">AddToViewport also works, but the player screen variant respects split-screen viewports.</text>
<rect x="20" y="255" width="720" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="275" text-anchor="middle" font-size="12" fill="#92400E">Prefer the Common Activatable Widget Stack: Get Game Stack &gt; Add Widget (class WBP_BookshelfHUD)</text>
<text x="380" y="293" text-anchor="middle" font-size="12" fill="#92400E">so that input routing, focus and Back handling are managed for you.</text>
