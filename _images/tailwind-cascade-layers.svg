<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <defs>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Tailwind's CSS cascade layers</text>
  <text x="360" y="50" font-size="12.5" fill="#555555" text-anchor="middle">@import "tailwindcss" emits four native @layer blocks, in this order</text>

  <!-- four stacked bands, first defined = lowest priority -->
  <rect x="120" y="70"  width="480" height="60" rx="6" fill="#eef2f6" stroke="#9db8d0" stroke-width="1.6"/>
  <text x="360" y="95"  font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">theme</text>
  <text x="360" y="116" font-size="11.5" fill="#555555" text-anchor="middle">@theme &#8594; design tokens as CSS variables (--color-*, --spacing, --breakpoint-*)</text>

  <rect x="120" y="140" width="480" height="60" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="360" y="165" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">base</text>
  <text x="360" y="186" font-size="11.5" fill="#2f5424" text-anchor="middle">Preflight reset + anything you add in @layer base (element defaults)</text>

  <rect x="120" y="210" width="480" height="60" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="1.6"/>
  <text x="360" y="235" font-size="14" font-weight="bold" fill="#8a3d10" text-anchor="middle">components</text>
  <text x="360" y="256" font-size="11.5" fill="#8a3d10" text-anchor="middle">@layer components (e.g. .btn, .card) &#8212; meant to be overridden by utilities</text>

  <rect x="120" y="280" width="480" height="60" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="360" y="305" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">utilities</text>
  <text x="360" y="326" font-size="11.5" fill="#1c4b73" text-anchor="middle">every utility class and variant (px-4, bg-sky-500, md:flex, hover:&#8230;) + @utility</text>

  <!-- priority arrow -->
  <line x1="70" y1="76" x2="70" y2="334" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#darrow)"/>
  <text x="40" y="210" font-size="12" fill="#1c4b73" text-anchor="middle" transform="rotate(-90 40 210)">later layer wins</text>

  <text x="360" y="370" font-size="12" fill="#222222" text-anchor="middle">A later layer beats an earlier one <tspan font-weight="bold">regardless of selector specificity</tspan>,</text>
  <text x="360" y="388" font-size="12" fill="#222222" text-anchor="middle">so a single <tspan font-family="'Courier New', monospace">rounded-none</tspan> utility overrides a <tspan font-family="'Courier New', monospace">.card</tspan> rule in @layer components.</text>
</svg>
