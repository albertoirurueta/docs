<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Data flow from glDrawMeshTasksEXT to the rasteriser</text>
<rect x="30" y="60" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="115.0" y="86.5" text-anchor="middle" font-size="12" fill="#374151">glDrawMeshTasksEXT</text>
<text x="115.0" y="101.5" text-anchor="middle" font-size="12" fill="#374151">(x, y, z) groups</text>
<rect x="250" y="50" width="230" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="365.0" y="71.5" text-anchor="middle" font-size="11" fill="#92400E">Task shader group</text>
<text x="365.0" y="86.5" text-anchor="middle" font-size="11" fill="#92400E">local_size invocations</text>
<text x="365.0" y="101.5" text-anchor="middle" font-size="11" fill="#92400E">taskPayloadSharedEXT payload</text>
<text x="365.0" y="116.5" text-anchor="middle" font-size="11" fill="#92400E">EmitMeshTasksEXT(nx, ny, nz)</text>
<rect x="530" y="50" width="200" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="71.5" text-anchor="middle" font-size="11" fill="#92400E">Mesh shader group(s)</text>
<text x="630.0" y="86.5" text-anchor="middle" font-size="11" fill="#92400E">local_size invocations</text>
<text x="630.0" y="101.5" text-anchor="middle" font-size="11" fill="#92400E">SetMeshOutputsEXT(v, p)</text>
<text x="630.0" y="116.5" text-anchor="middle" font-size="11" fill="#92400E">reads payload (read only)</text>
<line x1="200" y1="90" x2="248" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="480" y1="90" x2="528" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="250" y="160" width="480" height="130" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="490" y="182" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">What a mesh shader group writes</text>
<text x="265" y="206" text-anchor="start" font-size="11" fill="#374151">gl_MeshVerticesEXT[i].gl_Position   (and optional PointSize, ClipDistance)</text>
<text x="265" y="226" text-anchor="start" font-size="11" fill="#374151">gl_PrimitiveTriangleIndicesEXT[j] = uvec3(a, b, c)   (or uvec2 / uint for lines / points)</text>
<text x="265" y="246" text-anchor="start" font-size="11" fill="#374151">out vec2 vUv[]            per-vertex user outputs, always arrays</text>
<text x="265" y="266" text-anchor="start" font-size="11" fill="#374151">perprimitiveEXT out ...   per-primitive outputs (gl_PrimitiveID, gl_CullPrimitiveEXT)</text>
<rect x="250" y="310" width="480" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="490.0" y="339.0" text-anchor="middle" font-size="12" fill="#3730A3">Rasteriser, fragment shader, depth, blending (unchanged)</text>
<line x1="490" y1="290" x2="490" y2="308" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="160" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130.0" y="206.5" text-anchor="middle" font-size="11" fill="#374151">Without a task shader</text>
<text x="130.0" y="221.5" text-anchor="middle" font-size="11" fill="#374151">the draw launches mesh</text>
<text x="130.0" y="236.5" text-anchor="middle" font-size="11" fill="#374151">groups directly; the task</text>
<text x="130.0" y="251.5" text-anchor="middle" font-size="11" fill="#374151">stage is optional</text>
<text x="380" y="385" text-anchor="middle" font-size="11" fill="#4B5563">Task and mesh stages cannot share a program with vertex, tessellation or geometry shaders.</text>
</svg>
