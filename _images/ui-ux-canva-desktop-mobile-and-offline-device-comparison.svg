    <rect x="266" y="156" width="86" height="26" rx="13" fill="#4F46E5"/><text x="309" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Supported</text>
    <rect x="266" y="214" width="86" height="26" rx="13" fill="#4F46E5"/><text x="309" y="232" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Supported</text>
    <rect x="266" y="272" width="86" height="26" rx="13" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="309" y="290" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Not offered</text>
