    <text x="34" y="182">macOS and Windows installers</text>
    <text x="34" y="240">Google Play</text>
    <text x="34" y="298">App Store</text>
    <text x="34" y="356">Safari or Chrome on a phone or tablet</text>
  </g>
  <g>
