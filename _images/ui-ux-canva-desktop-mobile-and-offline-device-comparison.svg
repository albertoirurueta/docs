  <g stroke="#D1D5DB" stroke-width="1" fill="#FFFFFF">
    <rect x="20" y="84" width="720" height="52" rx="6"/><rect x="20" y="142" width="720" height="52" rx="6"/><rect x="20" y="200" width="720" height="52" rx="6"/><rect x="20" y="258" width="720" height="52" rx="6"/><rect x="20" y="316" width="720" height="52" rx="6"/>
  </g>
  <g font-size="13" fill="#1F2937" font-weight="bold">
    <text x="34" y="106">Desktop browser</text><text x="34" y="164">Desktop app</text><text x="34" y="222">Android app</text><text x="34" y="280">iPhone and iPad app</text><text x="34" y="338">Mobile browser</text>
  </g>
