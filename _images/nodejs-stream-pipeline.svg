<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A Node.js stream pipeline with backpressure</title>
  <desc id="d">Three streams connected in a row: a Readable source, a Transform in the middle and a Writable destination. Chunks flow from left to right. The destination is slower than the source, so its internal buffer fills up to the highWaterMark and write returns false. That signal travels back through the pipeline: the transform stops accepting and producing data, the source is paused and does not call its read method again. When the destination emits drain, the signal reverses and data flows again. Five numbered steps explain the cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="640" rx="10" fill="#fafafa" stroke="#c8c8c8"/>

  <text x="460" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">A stream pipeline with backpressure</text>
  <text x="460" y="50" font-size="12" fill="#555555" text-anchor="middle">pipeline(source, transform, destination): a slow destination slows down everything upstream</text>

  <!-- ===== Source ===== -->
  <rect x="30" y="76" width="210" height="190" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="135" y="100" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">Readable (source)</text>
  <text x="135" y="118" font-size="11.5" fill="#333333" text-anchor="middle">fs.createReadStream()</text>
  <text x="135" y="146" font-size="11" fill="#444444" text-anchor="middle">internal read buffer</text>
  <g stroke="#1c4b73" stroke-width="1.2">
    <rect x="46" y="154" width="24" height="18" fill="#9cc2e6"/>
    <rect x="74" y="154" width="24" height="18" fill="#9cc2e6"/>
    <rect x="102" y="154" width="24" height="18" fill="#ffffff"/>
    <rect x="130" y="154" width="24" height="18" fill="#ffffff"/>
    <rect x="158" y="154" width="24" height="18" fill="#ffffff"/>
    <rect x="186" y="154" width="24" height="18" fill="#ffffff"/>
  </g>
  <text x="135" y="190" font-size="11" fill="#444444" text-anchor="middle">refilled by _read() while</text>
  <text x="135" y="205" font-size="11" fill="#444444" text-anchor="middle">there is room below the mark</text>
  <text x="135" y="232" font-size="11.5" fill="#12324d" text-anchor="middle">paused when the pipeline</text>
  <text x="135" y="247" font-size="11.5" fill="#12324d" text-anchor="middle">hears backpressure</text>

  <!-- ===== Transform ===== -->
  <rect x="355" y="76" width="210" height="190" rx="6" fill="#e9f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="460" y="100" font-size="14" font-weight="bold" fill="#12324d" text-anchor="middle">Transform (middle stage)</text>
  <text x="460" y="118" font-size="11.5" fill="#333333" text-anchor="middle">zlib.createGzip()</text>
  <text x="460" y="144" font-size="11" fill="#444444" text-anchor="middle">writable side buffer</text>
  <g stroke="#1c4b73" stroke-width="1.2">
    <rect x="371" y="152" width="24" height="18" fill="#9cc2e6"/>
    <rect x="399" y="152" width="24" height="18" fill="#9cc2e6"/>
    <rect x="427" y="152" width="24" height="18" fill="#9cc2e6"/>
    <rect x="455" y="152" width="24" height="18" fill="#ffffff"/>
    <rect x="483" y="152" width="24" height="18" fill="#ffffff"/>
    <rect x="511" y="152" width="24" height="18" fill="#ffffff"/>
  </g>
  <text x="460" y="198" font-size="11" fill="#444444" text-anchor="middle">readable side buffer</text>
  <g stroke="#1c4b73" stroke-width="1.2">
    <rect x="371" y="206" width="24" height="18" fill="#9cc2e6"/>
    <rect x="399" y="206" width="24" height="18" fill="#9cc2e6"/>
    <rect x="427" y="206" width="24" height="18" fill="#9cc2e6"/>
    <rect x="455" y="206" width="24" height="18" fill="#9cc2e6"/>
    <rect x="483" y="206" width="24" height="18" fill="#9cc2e6"/>
    <rect x="511" y="206" width="24" height="18" fill="#ffffff"/>
  </g>
  <text x="460" y="247" font-size="11" fill="#444444" text-anchor="middle">two independent buffers, one per side</text>

  <!-- ===== Destination ===== -->
  <rect x="680" y="76" width="210" height="190" rx="6" fill="#fff3dc" stroke="#7a4a00" stroke-width="2.4"/>
  <text x="785" y="100" font-size="14" font-weight="bold" fill="#5c3700" text-anchor="middle">Writable (destination)</text>
  <text x="785" y="118" font-size="11.5" fill="#333333" text-anchor="middle">fs.createWriteStream()</text>
  <text x="785" y="146" font-size="11" fill="#444444" text-anchor="middle">internal write buffer</text>
  <g stroke="#7a4a00" stroke-width="1.2">
    <rect x="696" y="154" width="24" height="18" fill="#f2c27a"/>
    <rect x="724" y="154" width="24" height="18" fill="#f2c27a"/>
    <rect x="752" y="154" width="24" height="18" fill="#f2c27a"/>
    <rect x="780" y="154" width="24" height="18" fill="#f2c27a"/>
    <rect x="808" y="154" width="24" height="18" fill="#f2c27a"/>
    <rect x="836" y="154" width="24" height="18" fill="#f2c27a"/>
  </g>
  <text x="785" y="190" font-size="11.5" font-weight="bold" fill="#5c3700" text-anchor="middle">full: highWaterMark reached</text>
  <text x="785" y="208" font-size="11.5" fill="#333333" text-anchor="middle">write() returns false</text>
  <text x="785" y="232" font-size="11" fill="#444444" text-anchor="middle">the disk is slower than</text>
  <text x="785" y="247" font-size="11" fill="#444444" text-anchor="middle">the reader and the gzip stage</text>

  <!-- ===== Forward data arrows ===== -->
  <line x1="242" y1="130" x2="353" y2="130" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="297" y="122" font-size="11" fill="#333333" text-anchor="middle">chunks</text>
  <line x1="567" y1="130" x2="678" y2="130" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="622" y="122" font-size="11" fill="#333333" text-anchor="middle">chunks</text>

  <!-- ===== Backpressure arrows ===== -->
  <line x1="678" y1="200" x2="567" y2="200" stroke="#7a4a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWarn)"/>
  <text x="622" y="190" font-size="11" fill="#5c3700" text-anchor="middle">stop writing</text>
  <text x="622" y="218" font-size="11" fill="#5c3700" text-anchor="middle">wait for 'drain'</text>
  <line x1="353" y1="200" x2="242" y2="200" stroke="#7a4a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWarn)"/>
  <text x="297" y="190" font-size="11" fill="#5c3700" text-anchor="middle">pause source</text>
  <text x="297" y="218" font-size="11" fill="#5c3700" text-anchor="middle">no more _read()</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="288" x2="80" y2="288" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="90" y="292" font-size="11.5" fill="#333333">data flows downstream</text>
  <line x1="260" y1="288" x2="300" y2="288" stroke="#7a4a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWarn)"/>
  <text x="310" y="292" font-size="11.5" fill="#333333">backpressure travels upstream</text>
  <rect x="540" y="280" width="24" height="16" fill="#9cc2e6" stroke="#1c4b73"/>
  <text x="572" y="292" font-size="11.5" fill="#333333">buffered chunk</text>
  <rect x="690" y="280" width="24" height="16" fill="#ffffff" stroke="#1c4b73"/>
  <text x="722" y="292" font-size="11.5" fill="#333333">free room below the mark</text>

  <!-- ===== Steps ===== -->
  <rect x="30" y="314" width="860" height="186" rx="6" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="46" y="338" font-size="13" font-weight="bold" fill="#222222">One backpressure cycle, step by step</text>

  <circle cx="54" cy="362" r="10" fill="#1c4b73"/><text x="54" y="366" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="366" font-size="12" fill="#222222">The source reads a chunk; the pipeline writes it into the next stage. While the buffers are below the mark, write() returns true.</text>
  <circle cx="54" cy="392" r="10" fill="#1c4b73"/><text x="54" y="396" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="396" font-size="12" fill="#222222">The destination is slow: its write buffer reaches highWaterMark (64 KiB by default for byte streams), so write() returns false.</text>
  <circle cx="54" cy="422" r="10" fill="#7a4a00"/><text x="54" y="426" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="74" y="426" font-size="12" fill="#222222">The stage in front stops writing, so its own buffers fill; in turn it stops asking the source for data (the source is paused).</text>
  <circle cx="54" cy="452" r="10" fill="#7a4a00"/><text x="54" y="456" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="74" y="456" font-size="12" fill="#222222">Memory stays bounded: roughly one highWaterMark of data per buffer, however large the file or slow the consumer.</text>
  <circle cx="54" cy="482" r="10" fill="#2f5424"/><text x="54" y="486" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="74" y="486" font-size="12" fill="#222222">The destination empties its buffer and emits 'drain'; the source resumes and the cycle starts again at step 1.</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="516" width="860" height="104" rx="6" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="46" y="538" font-size="12" fill="#222222"><tspan font-weight="bold">pipeline() and pipe()</tspan> both implement steps 2 to 5 for you; with a manual write() loop you must wait for 'drain' yourself.</text>
  <text x="46" y="558" font-size="12" fill="#222222"><tspan font-weight="bold">highWaterMark is a threshold, not a limit:</tspan> it says when to stop asking for more data, it does not refuse writes.</text>
  <text x="46" y="578" font-size="12" fill="#222222"><tspan font-weight="bold">Units:</tspan> bytes for byte streams, UTF-16 code units for string streams, objects (default 16) in object mode.</text>
  <text x="46" y="598" font-size="12" fill="#222222"><tspan font-weight="bold">Errors:</tspan> pipeline() destroys every stage when one fails; pipe() does not, so the other streams can leak.</text>
</svg>
