<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Activity lifecycle state diagram</title>
  <defs>
    <marker id="arrLc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Activity lifecycle</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">callbacks the system invokes as an activity moves between states, and the three loops it can repeat</text>

  <!-- Destroyed (top, before creation) -->
  <rect x="300" y="54" width="160" height="34" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="380" y="75" font-size="12" fill="#333333" text-anchor="middle">does not exist</text>

  <line x1="380" y1="88" x2="380" y2="112" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="440" y="104" font-size="9.5" fill="#666666" text-anchor="middle">onCreate()</text>

  <!-- Created -->
  <rect x="290" y="114" width="180" height="34" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="135" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Created</text>

  <line x1="380" y1="148" x2="380" y2="172" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="440" y="164" font-size="9.5" fill="#666666" text-anchor="middle">onStart()</text>

  <!-- Started -->
  <rect x="290" y="174" width="180" height="34" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="195" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Started</text>

  <line x1="380" y1="208" x2="380" y2="232" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="440" y="224" font-size="9.5" fill="#666666" text-anchor="middle">onResume()</text>

  <!-- Resumed -->
  <rect x="270" y="234" width="220" height="38" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="380" y="258" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Resumed (foreground)</text>

  <!-- Resumed self-loop: rotation / multi-window relayout -->
  <path d="M 490 245 C 620 210, 620 300, 490 262" fill="none" stroke="#8a5b12" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="640" y="250" font-size="9" fill="#8a5b12" text-anchor="middle">
    <tspan x="640" dy="0">rotation / multi-window resize:</tspan>
    <tspan x="640" dy="11">onPause -&gt; onStop -&gt; onDestroy -&gt;</tspan>
    <tspan x="640" dy="11">onCreate -&gt; ... -&gt; onResume</tspan>
    <tspan x="640" dy="11">(new instance, same task)</tspan>
  </text>

  <!-- Resumed -> Started (Paused) via onPause -->
  <line x1="330" y1="272" x2="330" y2="296" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="260" y="288" font-size="9.5" fill="#666666" text-anchor="middle">onPause()</text>

  <!-- Started -> Resumed back via onResume (loop label near arrow up) -->
  <line x1="430" y1="296" x2="430" y2="272" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="497" y="288" font-size="9.5" fill="#666666" text-anchor="middle">onResume()</text>

  <!-- Started (visible, paused) box -->
  <rect x="290" y="298" width="180" height="34" rx="6" fill="#fff7e6" stroke="#8a5b12" stroke-width="1.4"/>
  <text x="380" y="315" font-size="11" font-weight="bold" fill="#8a5b12" text-anchor="middle">Started</text>
  <text x="380" y="327" font-size="9" fill="#8a5b12" text-anchor="middle">(visible, partially covered)</text>

  <line x1="330" y1="332" x2="330" y2="356" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="255" y="348" font-size="9.5" fill="#666666" text-anchor="middle">onStop()</text>

  <line x1="430" y1="356" x2="430" y2="332" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="497" y="348" font-size="9.5" fill="#666666" text-anchor="middle">onRestart()+onStart()</text>

  <!-- Created (stopped, not visible) box -->
  <rect x="290" y="358" width="180" height="34" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.4"/>
  <text x="380" y="375" font-size="11" font-weight="bold" fill="#a33" text-anchor="middle">Created</text>
  <text x="380" y="387" font-size="9" fill="#a33" text-anchor="middle">(stopped, not visible)</text>

  <line x1="380" y1="392" x2="380" y2="416" stroke="#444444" stroke-width="1.3" marker-end="url(#arrLc)"/>
  <text x="440" y="408" font-size="9.5" fill="#666666" text-anchor="middle">onDestroy()</text>

  <!-- Destroyed (bottom, final) -->
  <rect x="290" y="418" width="180" height="34" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.4"/>
  <text x="380" y="439" font-size="12" fill="#333333" text-anchor="middle">Destroyed</text>

  <!-- Process death branch from Stopped -->
  <path d="M 290 375 C 130 375, 90 430, 150 460" fill="none" stroke="#a33" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrLc)"/>
  <rect x="30" y="462" width="200" height="46" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.4"/>
  <text x="130" y="480" font-size="10.5" font-weight="bold" fill="#a33" text-anchor="middle">Process killed by the OS</text>
  <text x="130" y="494" font-size="9" fill="#a33" text-anchor="middle">
    <tspan x="130" dy="0">only reachable from Stopped;</tspan>
    <tspan x="130" dy="11">Bundle from onSaveInstanceState</tspan>
  </text>
  <text x="130" y="518" font-size="9" fill="#a33" text-anchor="middle">survives, restored into the new</text>
  <text x="130" y="529" font-size="9" fill="#a33" text-anchor="middle">instance's onCreate()</text>

  <!-- back button from Stopped straight to does-not-exist illustrated via Destroyed already; add note box for finish()/back -->
  <rect x="550" y="358" width="180" height="76" rx="6" fill="#f6f6ff" stroke="#3b3b8f" stroke-width="1.2"/>
  <text x="640" y="376" font-size="10" font-weight="bold" fill="#3b3b8f" text-anchor="middle">Back / finish()</text>
  <text x="640" y="392" font-size="9" fill="#3b3b8f" text-anchor="middle">
    <tspan x="640" dy="0">onPause -&gt; onStop -&gt;</tspan>
    <tspan x="640" dy="11">onDestroy, isFinishing</tspan>
    <tspan x="640" dy="11">true throughout --</tspan>
    <tspan x="640" dy="11">no restart expected</tspan>
  </text>

  <text x="380" y="552" font-size="9" fill="#666666" text-anchor="middle">solid arrows: guaranteed callbacks. dashed arrow: only when the OS reclaims memory from a stopped, non-visible activity.</text>
</svg>
