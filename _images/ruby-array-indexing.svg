<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Array indexing and slicing</title>
  <desc>A six element array a to f. Positive indexes 0 to 5 run left to right above the cells and negative indexes -6 to -1 below them. Brackets show that a[1, 3] and a[1..3] select b, c and d, a[1...3] selects b and c, a[4, 10] selects e and f, and a[6, 1] selects an empty array at the end while a[7, 1] is nil.</desc>
  <rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
  <text x="410" y="28" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Positions, not elements: indexes and slices</text>
  <text x="410" y="48" font-size="12" fill="#666666" text-anchor="middle">a = %w[a b c d e f]; a slice is a start position and a length</text>
  <rect x="80" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="130.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"a"</text>
  <text x="130.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">0</text>
  <text x="130.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-6</text>
  <rect x="180" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="230.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"b"</text>
  <text x="230.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">1</text>
  <text x="230.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-5</text>
  <rect x="280" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="330.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"c"</text>
  <text x="330.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">2</text>
  <text x="330.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-4</text>
  <rect x="410" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="430.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"d"</text>
  <text x="430.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">3</text>
  <text x="430.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-3</text>
  <rect x="480" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="530.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"e"</text>
  <text x="530.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">4</text>
  <text x="530.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-2</text>
  <rect x="580" y="130" width="100" height="50" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="630.0" y="162" font-size="20" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">"f"</text>
  <text x="630.0" y="118" font-size="14" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">5</text>
  <text x="630.0" y="202" font-size="14" font-family="Menlo, Consolas, monospace" fill="#8a3b12" text-anchor="middle">-1</text>
  <text x="694" y="118" font-size="12" fill="#222222">size = 6</text>
  <text x="10" y="118" font-size="12" fill="#222222">a[i]</text>
  <text x="10" y="202" font-size="12" fill="#8a3b12">a[-i]</text>
  <path d="M186,225 L186,233 L474,233 L474,225" fill="none" stroke="#1c6b3a" stroke-width="2"/>
  <text x="330.0" y="251" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1c6b3a" text-anchor="middle">a[1, 3] = a[1..3] = b c d</text>
  <path d="M186,262 L186,270 L374,270 L374,262" fill="none" stroke="#7a4a00" stroke-width="2"/>
  <text x="280.0" y="288" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7a4a00" text-anchor="middle">a[1...3]</text>
  <path d="M486,225 L486,233 L674,233 L674,225" fill="none" stroke="#1c6b3a" stroke-width="2"/>
  <text x="580.0" y="251" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1c6b3a" text-anchor="middle">a[4, 10] = e f</text>
  <line x1="680" y1="126" x2="680" y2="184" stroke="#b00020" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="694" y="160" font-size="12" fill="#b00020">a[6, 1] = []</text>
  <text x="694" y="176" font-size="12" fill="#b00020">a[7, 1] = nil</text>
</svg>
