<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Lifetimes as regions of code</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">the reference stored in `result` must not be used outside the region where both inputs are alive</text>
  <rect x="40" y="66" width="560" height="290" fill="#f8f8f8" stroke="#dddddd"/>
  <g font-family="Courier New, monospace" font-size="13" fill="#222222" style="white-space:pre">
    <text x="56" y="92">fn main() {</text>
    <text x="87" y="120">let a = String::from("Middlemarch");</text>
    <text x="87" y="148">let result;</text>
    <text x="87" y="176">{</text>
    <text x="118" y="204">let b = String::from("Dune");</text>
    <text x="118" y="232">result = longest(&amp;a, &amp;b);</text>
    <text x="118" y="260">println!("{result}");  // OK</text>
    <text x="87" y="288">}  // b dropped</text>
    <text x="87" y="316">// println!("{result}");  // E0597</text>
    <text x="56" y="344">}  // a dropped</text>
  </g>
  <!-- 'a bar -->
  <rect x="640" y="108" width="34" height="242" rx="4" fill="#1c4b73" opacity="0.85"/>
  <text x="657" y="98" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">a</text>
  <!-- 'b bar -->
  <rect x="700" y="192" width="34" height="102" rx="4" fill="#a35a00" opacity="0.85"/>
  <text x="717" y="182" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">b</text>
  <!-- result usable region -->
  <rect x="760" y="222" width="34" height="44" rx="4" fill="#2e7d32" opacity="0.85"/>
  <text x="777" y="212" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">result</text>
  <rect x="760" y="300" width="34" height="24" rx="4" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="810" y="317" font-size="12" fill="#c62828">rejected</text>
  <g font-size="12" fill="#333333">
    <text x="40" y="376">fn longest&lt;'x&gt;(a: &amp;'x str, b: &amp;'x str) -&gt; &amp;'x str: the compiler picks 'x as the region</text>
    <text x="40" y="392">where both borrows are valid, so result cannot be used after b is dropped</text>
  </g>
  <text x="820" y="240" font-size="11" fill="#2e7d32">'x = overlap</text>
  <text x="820" y="254" font-size="11" fill="#2e7d32">of a and b</text>
</svg>
