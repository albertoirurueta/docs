<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Application modes and the commands that switch them</title>
  <desc id="d">The installer leaves a new store in default mode. deploy:mode:set developer or production switches modes. Developer mode generates code and static files on demand and shows errors. Production mode compiles code and deploys static files before it opens the store and only logs errors. Maintenance mode is a separate switch that answers every request with HTTP 503.</desc>
  <rect x="15" y="24" width="300" height="218" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="165.0" y="52" text-anchor="middle" font-size="16" font-weight="bold">default</text>
  <line x1="35" y1="64" x2="295" y2="64" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="165.0" y="88" text-anchor="middle" font-size="13">set by setup:install</text>
  <text x="165.0" y="112" text-anchor="middle" font-size="13">MAGE_MODE: default in env.php</text>
  <text x="165.0" y="136" text-anchor="middle" font-size="13">code and static files</text>
  <text x="165.0" y="160" text-anchor="middle" font-size="13">generated on demand</text>
  <text x="165.0" y="184" text-anchor="middle" font-size="13">fine for a first look,</text>
  <text x="165.0" y="208" text-anchor="middle" font-size="13">not for production</text>
  <rect x="355" y="24" width="300" height="218" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505.0" y="52" text-anchor="middle" font-size="16" font-weight="bold">developer</text>
  <line x1="375" y1="64" x2="635" y2="64" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="505.0" y="88" text-anchor="middle" font-size="13">deploy:mode:set developer</text>
  <text x="505.0" y="112" text-anchor="middle" font-size="13">exceptions shown in the page</text>
  <text x="505.0" y="136" text-anchor="middle" font-size="13">static files generated on</text>
  <text x="505.0" y="160" text-anchor="middle" font-size="13">request, no compile step</text>
  <text x="505.0" y="184" text-anchor="middle" font-size="13">slower pages, easier debugging</text>
  <text x="505.0" y="208" text-anchor="middle" font-size="13">use on a laptop only</text>
  <rect x="695" y="24" width="300" height="218" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="845.0" y="52" text-anchor="middle" font-size="16" font-weight="bold">production</text>
  <line x1="715" y1="64" x2="975" y2="64" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="845.0" y="88" text-anchor="middle" font-size="13">deploy:mode:set production</text>
  <text x="845.0" y="112" text-anchor="middle" font-size="13">maintenance on, compile,</text>
  <text x="845.0" y="136" text-anchor="middle" font-size="13">static content deploy,</text>
  <text x="845.0" y="160" text-anchor="middle" font-size="13">maintenance off</text>
  <text x="845.0" y="184" text-anchor="middle" font-size="13">errors only logged</text>
  <text x="845.0" y="208" text-anchor="middle" font-size="13">faster, nothing built on request</text>
  <path d="M315 110 L353 110" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M353 140 L315 140" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M655 110 L693 110" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M693 140 L655 140" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="335" y="98" text-anchor="middle" font-size="10.5">set</text>
  <text x="675" y="98" text-anchor="middle" font-size="10.5">set</text>
  <rect x="15" y="264" width="980" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="290" text-anchor="middle" font-size="13" font-weight="bold">What switching to production mode did in the test install (Mage-OS 3.6.0, 2 locales, arm64 container)</text>
  <text x="40" y="316" font-size="12.5">code compilation: 24 s, peak memory 514 MiB</text>
  <text x="40" y="336" font-size="12.5">static content: quick strategy, es_ES and en_US,</text>
  <text x="40" y="356" font-size="12.5">themes Magento/blank, Magento/luma, backend themes</text>
  <text x="520" y="316" font-size="12.5">whole command: 1 min 14 s</text>
  <text x="520" y="336" font-size="12.5">pub/static 302 MB, generated/ 119 MB afterwards</text>
  <text x="520" y="356" font-size="12.5">storefront HTTP 200 before and after</text>
  <rect x="15" y="392" width="980" height="62" rx="10" fill="#e67e22" fill-opacity="0.15" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="40" y="418" font-size="13" font-family="Menlo, Consolas, monospace">maintenance:enable</text>
  <text x="40" y="438" font-size="13" font-family="Menlo, Consolas, monospace">maintenance:disable</text>
  <text x="330" y="418" font-size="12.5">separate from the three modes: every request gets HTTP 503 (measured),</text>
  <text x="330" y="438" font-size="12.5">exempt IPs with maintenance:allow-ips, status with maintenance:status</text>
</svg>
