<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Isolation layers around a container process</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Isolation layers around a container process</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">each ring removes something the process could otherwise reach</text>
  <rect x="20" y="55" width="720" height="360" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="380.0" y="72" font-size="9.5" fill="#333333" text-anchor="middle">Host kernel (shared)  --  keep patched; rootless or user namespaces map container root to an unprivileged host user</text>
  <rect x="50" y="79" width="660" height="312" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380.0" y="96" font-size="9.5" fill="#333333" text-anchor="middle">AppArmor / SELinux  --  mandatory access control profile</text>
  <rect x="80" y="103" width="600" height="264" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="380.0" y="120" font-size="9.5" fill="#333333" text-anchor="middle">seccomp  --  default profile blocks ~44 of 300+ syscalls</text>
  <rect x="110" y="127" width="540" height="216" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="380.0" y="144" font-size="9.5" fill="#333333" text-anchor="middle">capabilities  --  reduced default set; --cap-drop ALL + add back</text>
  <rect x="140" y="151" width="480" height="168" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380.0" y="168" font-size="9.5" fill="#333333" text-anchor="middle">cgroups  --  memory, CPU, PIDs limits</text>
  <rect x="170" y="175" width="420" height="120" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="192" font-size="9.5" fill="#333333" text-anchor="middle">namespaces  --  pid, mnt, net, uts, ipc, user, cgroup</text>
  <rect x="200" y="199" width="360" height="72" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="230.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">process (USER 10001)</text>
  <text x="380.0" y="246.2" font-size="9.5" fill="#333333" text-anchor="middle">read-only rootfs, no-new-privileges</text>
</svg>
