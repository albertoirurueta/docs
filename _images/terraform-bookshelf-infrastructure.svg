<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>The Bookshelf infrastructure managed by Terraform: a network with catalog-api, reviews-api and web services, PostgreSQL, Redis, a covers bucket, DNS, secrets and IAM, with the configuration and state backend that describe them</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf infrastructure managed by Terraform</text>
<text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">one configuration describes every object; the state backend records what exists</text>
<rect x="20" y="70" width="170" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="105.0" y="97.0" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">Configuration</text>
<text x="105.0" y="113.0" font-size="10" fill="#0d3c75" text-anchor="middle">modules + envs (HCL)</text>
<rect x="20" y="170" width="170" height="60" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="105.0" y="197.0" font-size="12.5" font-weight="bold" fill="#2e1a63" text-anchor="middle">Terraform / OpenTofu</text>
<text x="105.0" y="213.0" font-size="10" fill="#2e1a63" text-anchor="middle">plan, then apply</text>
<rect x="20" y="270" width="170" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="105.0" y="297.0" font-size="12.5" font-weight="bold" fill="#5d4200" text-anchor="middle">State backend</text>
<text x="105.0" y="313.0" font-size="10" fill="#5d4200" text-anchor="middle">remote state + locking</text>
<line x1="105" y1="130" x2="105" y2="168" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="105" y1="230" x2="105" y2="268" stroke="#37474f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="190" y1="200" x2="236" y2="200" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="105" y="360" font-size="10" fill="#555555" text-anchor="middle">providers translate the plan</text>
<text x="105" y="374" font-size="10" fill="#555555" text-anchor="middle">into API calls</text>
<rect x="240" y="64" width="540" height="440" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260" y="86" font-size="11.5" font-weight="bold" fill="#37474f">Target environment (dev or prod)</text>
<rect x="258" y="100" width="504" height="250" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="274" y="120" font-size="11.5" font-weight="bold" fill="#1b5e20">Network (subnets, routing, firewall rules)</text>
<rect x="274" y="134" width="140" height="56" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="344.0" y="159.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">web</text>
<text x="344.0" y="175.0" font-size="10" fill="#1b5e20" text-anchor="middle">front end</text>
<rect x="430" y="134" width="140" height="56" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="500.0" y="159.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">catalog-api</text>
<text x="500.0" y="175.0" font-size="10" fill="#1b5e20" text-anchor="middle">service</text>
<rect x="586" y="134" width="160" height="56" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="666.0" y="159.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">reviews-api</text>
<text x="666.0" y="175.0" font-size="10" fill="#1b5e20" text-anchor="middle">service</text>
<rect x="274" y="260" width="200" height="66" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="374.0" y="290.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">PostgreSQL</text>
<text x="374.0" y="306.0" font-size="10" fill="#1b5e20" text-anchor="middle">managed database</text>
<rect x="500" y="260" width="246" height="66" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="623.0" y="290.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Redis</text>
<text x="623.0" y="306.0" font-size="10" fill="#1b5e20" text-anchor="middle">cache</text>
<line x1="414" y1="162" x2="428" y2="162" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="500" y1="190" x2="400" y2="258" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="666" y1="190" x2="420" y2="258" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="520" y1="190" x2="600" y2="258" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="258" y="376" width="120" height="56" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="318.0" y="401.0" font-size="12.5" font-weight="bold" fill="#5d2c00" text-anchor="middle">Covers bucket</text>
<text x="318.0" y="417.0" font-size="10" fill="#5d2c00" text-anchor="middle">object storage</text>
<rect x="394" y="376" width="120" height="56" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="454.0" y="401.0" font-size="12.5" font-weight="bold" fill="#5d2c00" text-anchor="middle">DNS</text>
<text x="454.0" y="417.0" font-size="10" fill="#5d2c00" text-anchor="middle">records, certificates</text>
<rect x="530" y="376" width="110" height="56" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="585.0" y="401.0" font-size="12.5" font-weight="bold" fill="#5d2c00" text-anchor="middle">Secrets</text>
<text x="585.0" y="417.0" font-size="10" fill="#5d2c00" text-anchor="middle">secret manager</text>
<rect x="656" y="376" width="106" height="56" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="709.0" y="401.0" font-size="12.5" font-weight="bold" fill="#5d2c00" text-anchor="middle">IAM</text>
<text x="709.0" y="417.0" font-size="10" fill="#5d2c00" text-anchor="middle">roles, policies</text>
<text x="520" y="462" font-size="10.5" fill="#555555" text-anchor="middle">identity-based access ties the services to the bucket, the database credentials and the secrets</text>
<text x="520" y="480" font-size="10.5" fill="#555555" text-anchor="middle">the same modules are instantiated per environment from envs/dev and envs/prod</text>
</svg>
