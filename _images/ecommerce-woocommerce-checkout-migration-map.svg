<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where a classic checkout customisation goes in the Cart and Checkout blocks</title>
  <desc id="d">A three column table. The left column lists classic shortcode customisations: add or change a field with woocommerce_checkout_fields, hide a field, validate on submit, save extra order data, run code after the order is created, print markup at a classic hook, change item names or the order button label, limit quantities, change gateway title or icon, override cart and checkout templates, add fees, and the thank you page hooks. The middle column gives the block replacement. The right column marks each row as works unchanged, alternative needed or no equivalent.</desc>
  <rect x="0" y="0" width="960" height="700" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Migrating classic customisations</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Teal: keeps working. Amber: use the replacement. Rose: no replacement, change the design.</text>
  <text x="48" y="86" font-size="13" font-weight="bold" fill="#f4b860">Classic checkout</text>
  <text x="360" y="86" font-size="13" font-weight="bold" fill="#9fd3c7">Cart and Checkout blocks</text>
  <rect x="40" y="98" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="116.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_fields</text>
  <text x="52" y="132.5" font-size="11" fill="#f2f5f8">add a field</text>
  <path d="M342 120 L356 120" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="98" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="124.5" font-size="11" fill="#f2f5f8">woocommerce_register_additional_checkout_field()</text>
  <rect x="806" y="98" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="124" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="148" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="166.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_fields</text>
  <text x="52" y="182.5" font-size="11" fill="#f2f5f8">edit or remove a core field</text>
  <path d="M342 170 L356 170" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="148" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="166.5" font-size="11" fill="#f2f5f8">woocommerce_get_country_locale and the field</text>
  <text x="370" y="182.5" font-size="11" fill="#f2f5f8">options of the Checkout block</text>
  <rect x="806" y="148" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="174" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="198" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="216.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_process</text>
  <text x="52" y="232.5" font-size="11" fill="#f2f5f8">woocommerce_after_checkout_validation</text>
  <path d="M342 220 L356 220" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="198" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="216.5" font-size="11" fill="#f2f5f8">RouteException thrown in</text>
  <text x="370" y="232.5" font-size="11" fill="#f2f5f8">woocommerce_store_api_checkout_update_order_from_request</text>
  <rect x="806" y="198" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="224" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="248" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="266.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_create_order</text>
  <text x="52" y="282.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_update_order_meta</text>
  <path d="M342 270 L356 270" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="248" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="266.5" font-size="11" fill="#f2f5f8">woocommerce_store_api_checkout_update_order_meta</text>
  <text x="370" y="282.5" font-size="11" fill="#f2f5f8">or ..._update_order_from_request</text>
  <rect x="806" y="248" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="274" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="298" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="324.5" font-size="11" fill="#f2f5f8">woocommerce_checkout_order_processed</text>
  <path d="M342 320 L356 320" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="298" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="324.5" font-size="11" fill="#f2f5f8">woocommerce_store_api_checkout_order_processed</text>
  <rect x="806" y="298" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="324" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="348" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="366.5" font-size="11" fill="#f2f5f8">woocommerce_cart_calculate_fees</text>
  <text x="52" y="382.5" font-size="11" fill="#f2f5f8">woocommerce_before_calculate_totals</text>
  <path d="M342 370 L356 370" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="358" y="348" width="440" height="44" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="370" y="374.5" font-size="11" fill="#f2f5f8">the same hooks, unchanged</text>
  <rect x="806" y="348" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="374" font-size="11" font-weight="bold" fill="#9fd3c7" text-anchor="middle">keeps working</text>
  <rect x="40" y="398" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="416.5" font-size="11" fill="#f2f5f8">woocommerce_thankyou</text>
  <text x="52" y="432.5" font-size="11" fill="#f2f5f8">woocommerce_thankyou_&lt;gateway&gt;</text>
  <path d="M342 420 L356 420" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="358" y="398" width="440" height="44" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="370" y="424.5" font-size="11" fill="#f2f5f8">still fired by the Order confirmation blocks</text>
  <rect x="806" y="398" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="424" font-size="11" font-weight="bold" fill="#9fd3c7" text-anchor="middle">keeps working</text>
  <rect x="40" y="448" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="466.5" font-size="11" fill="#f2f5f8">woocommerce_before_checkout_form</text>
  <text x="52" y="482.5" font-size="11" fill="#f2f5f8">and the other markup hooks</text>
  <path d="M342 470 L356 470" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="448" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="466.5" font-size="11" fill="#f2f5f8">Slot and Fill, or an inner block that the</text>
  <text x="370" y="482.5" font-size="11" fill="#f2f5f8">merchant adds in the editor</text>
  <rect x="806" y="448" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="474" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="498" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="516.5" font-size="11" fill="#f2f5f8">woocommerce_cart_item_name</text>
  <text x="52" y="532.5" font-size="11" fill="#f2f5f8">woocommerce_order_button_text</text>
  <path d="M342 520 L356 520" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="498" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="516.5" font-size="11" fill="#f2f5f8">registerCheckoutFilters( itemName,</text>
  <text x="370" y="532.5" font-size="11" fill="#f2f5f8">placeOrderButtonLabel, totalLabel, ... )</text>
  <rect x="806" y="498" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="524" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="548" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="566.5" font-size="11" fill="#f2f5f8">woocommerce_quantity_input_max</text>
  <text x="52" y="582.5" font-size="11" fill="#f2f5f8">woocommerce_quantity_input_step</text>
  <path d="M342 570 L356 570" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="548" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="566.5" font-size="11" fill="#f2f5f8">woocommerce_store_api_product_quantity_maximum,</text>
  <text x="370" y="582.5" font-size="11" fill="#f2f5f8">_minimum and _multiple_of</text>
  <rect x="806" y="548" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="574" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="598" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="616.5" font-size="11" fill="#f2f5f8">woocommerce_gateway_title</text>
  <text x="52" y="632.5" font-size="11" fill="#f2f5f8">woocommerce_gateway_icon</text>
  <path d="M342 620 L356 620" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="358" y="598" width="440" height="44" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="370" y="616.5" font-size="11" fill="#f2f5f8">registerPaymentMethod( { label, content } )</text>
  <text x="370" y="632.5" font-size="11" fill="#f2f5f8">written in JavaScript</text>
  <rect x="806" y="598" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="624" font-size="11" font-weight="bold" fill="#f4b860" text-anchor="middle">use replacement</text>
  <rect x="40" y="648" width="300" height="44" rx="6" fill="#3d5266"/>
  <text x="52" y="666.5" font-size="11" fill="#f2f5f8">theme overrides of cart/cart.php</text>
  <text x="52" y="682.5" font-size="11" fill="#f2f5f8">and checkout/form-checkout.php</text>
  <path d="M342 670 L356 670" stroke="#e8a0a0" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <rect x="358" y="648" width="440" height="44" rx="6" fill="#33485c" stroke="#e8a0a0" stroke-width="1.5"/>
  <text x="370" y="666.5" font-size="11" fill="#f2f5f8">ignored: edit the block template parts,</text>
  <text x="370" y="682.5" font-size="11" fill="#f2f5f8">page-cart.html and page-checkout.html</text>
  <rect x="806" y="648" width="114" height="44" rx="6" fill="#3d5266"/>
  <text x="863" y="674" font-size="11" font-weight="bold" fill="#e8a0a0" text-anchor="middle">no equivalent</text>
</svg>
