<svg viewBox="0 0 900 496" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="900" height="496" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">One document, one SAX stream, six outputs</text>
<text x="450" y="46" text-anchor="middle" font-size="12" fill="#444444">Blue: input, green: parser and handlers, amber: the 4.x default, red: no content</text>
<rect x="15" y="200" width="150" height="110" rx="8" fill="#d6e4f5" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="90.0" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">manuscript.docx</text>
<text x="90.0" y="238" text-anchor="middle" font-size="11.5" fill="#333333">heading, paragraphs,</text>
<text x="90.0" y="254" text-anchor="middle" font-size="11.5" fill="#333333">bold, list, table,</text>
<text x="90.0" y="270" text-anchor="middle" font-size="11.5" fill="#333333">hyperlink</text>
<text x="90.0" y="286" text-anchor="middle" font-size="11.5" fill="#333333">(stand-in sample)</text>
<rect x="190" y="200" width="170" height="110" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="275.0" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Parser</text>
<text x="275.0" y="238" text-anchor="middle" font-size="11.5" fill="#333333">AutoDetectParser picks</text>
<text x="275.0" y="254" text-anchor="middle" font-size="11.5" fill="#333333">OOXMLParser, which wraps</text>
<text x="275.0" y="270" text-anchor="middle" font-size="11.5" fill="#333333">your handler in an</text>
<text x="275.0" y="286" text-anchor="middle" font-size="11.5" fill="#333333">XHTMLContentHandler</text>
<rect x="385" y="64" width="270" height="400" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="520" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">SAX events (XHTML)</text>
<text x="393" y="108" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">startDocument</text>
<text x="393" y="126" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">&lt;html&gt;</text>
<text x="393" y="144" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;head&gt;  &lt;meta/&gt; x8  &lt;title&gt;</text>
<text x="393" y="162" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">    chars "The Lighthouse Keeper"</text>
<text x="393" y="180" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;/head&gt;  &lt;body&gt;</text>
<text x="393" y="198" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;h1&gt; chars "The Lighthouse Keeper" &lt;/h1&gt;</text>
<text x="393" y="216" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;p&gt; chars "A short novel ..." &lt;/p&gt;</text>
<text x="393" y="234" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;p&gt; chars "The keeper climbs ... "</text>
<text x="393" y="252" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">     &lt;b&gt; chars "night" &lt;/b&gt; chars "." &lt;/p&gt;</text>
<text x="393" y="270" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;h2&gt; chars "Themes" &lt;/h2&gt;</text>
<text x="393" y="288" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;p&gt; chars "· Solitude" &lt;/p&gt;</text>
<text x="393" y="306" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;p&gt; chars "· The sea" &lt;/p&gt;</text>
<text x="393" y="324" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;table&gt; &lt;tr&gt; &lt;td&gt; chars "Chapter" ..</text>
<text x="393" y="342" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;p&gt; chars "Read more at "</text>
<text x="393" y="360" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">     &lt;a href=..&gt; chars "the Bookshelf page"</text>
<text x="393" y="378" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">     &lt;/a&gt; chars "." &lt;/p&gt;</text>
<text x="393" y="396" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">  &lt;/body&gt;</text>
<text x="393" y="414" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">&lt;/html&gt;</text>
<text x="393" y="432" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" fill="#333333">endDocument</text>
<rect x="690" y="64" width="200" height="58" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="790" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">TEXT</text>
<text x="790" y="97" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ToTextContentHandler</text>
<text x="790" y="113" text-anchor="middle" font-size="10.5" fill="#333333">characters only, head text too</text>
<line x1="655" y1="264" x2="688" y2="93" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="690" y="132" width="200" height="58" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="790" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">BODY</text>
<text x="790" y="165" text-anchor="middle" font-size="10.5" fill="#1a1a1a">BodyContentHandler</text>
<text x="790" y="181" text-anchor="middle" font-size="10.5" fill="#333333">inside body only, 100,000 limit</text>
<line x1="655" y1="264" x2="688" y2="161" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="690" y="200" width="200" height="58" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="790" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">HTML</text>
<text x="790" y="233" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ToHTMLContentHandler</text>
<text x="790" y="249" text-anchor="middle" font-size="10.5" fill="#333333">markup, void elements unclosed</text>
<line x1="655" y1="264" x2="688" y2="229" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="690" y="268" width="200" height="58" rx="8" fill="#d6ecd6" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="790" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">XML</text>
<text x="790" y="301" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ToXMLContentHandler</text>
<text x="790" y="317" text-anchor="middle" font-size="10.5" fill="#333333">well-formed XHTML, closes tags</text>
<line x1="655" y1="264" x2="688" y2="297" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="690" y="336" width="200" height="58" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="790" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">MARKDOWN</text>
<text x="790" y="369" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ToMarkdownContentHandler</text>
<text x="790" y="385" text-anchor="middle" font-size="10.5" fill="#333333"># headings, **bold**, pipe tables</text>
<line x1="655" y1="264" x2="688" y2="365" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="690" y="404" width="200" height="58" rx="8" fill="#f5d6d6" stroke="#9a2b2b" stroke-width="1.6"/>
<text x="790" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">IGNORE</text>
<text x="790" y="437" text-anchor="middle" font-size="10.5" fill="#1a1a1a">NoOpContentHandler</text>
<text x="790" y="453" text-anchor="middle" font-size="10.5" fill="#333333">nothing kept, metadata only</text>
<line x1="655" y1="264" x2="688" y2="433" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="165" y1="255" x2="188" y2="255" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="360" y1="255" x2="383" y2="255" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<text x="450" y="488" text-anchor="middle" font-size="12" fill="#444444">Metadata goes into the head as meta elements; the handler decides what survives.</text>
</svg>
