<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Which module service folder is loaded into which PrestaShop container</title>
  <desc>A matrix of the module service folders config, config/admin, config/front and config/webservice against the three containers that were inspected on PrestaShop 9.2.0: the back-office Symfony kernel, the Admin API kernel and the light front-office container. config loads in the two Symfony kernels only; config/admin loads in the two Symfony kernels; config/front loads in the front container only, although the documentation also lists the Symfony container; config/webservice was not run.</desc>
  <text x="480" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">Service definition folders of a module and the containers that load them</text>
  <text x="480" y="46" font-size="12" fill="#7b8794" text-anchor="middle">Result of debug:container and of Module::get() on PrestaShop 9.2.0 with the module pcfdadmin</text>

  <!-- column headers -->
  <rect x="250" y="64" width="210" height="66" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="355" y="88" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Back-office kernel</text>
  <text x="355" y="106" font-size="11.5" fill="#1f2933" text-anchor="middle">--app-id=admin</text>
  <text x="355" y="121" font-size="11.5" fill="#1f2933" text-anchor="middle">full Symfony container</text>
  <rect x="475" y="64" width="210" height="66" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="580" y="88" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Admin API kernel</text>
  <text x="580" y="106" font-size="11.5" fill="#1f2933" text-anchor="middle">--app-id=admin-api</text>
  <text x="580" y="121" font-size="11.5" fill="#1f2933" text-anchor="middle">API Platform</text>
  <rect x="700" y="64" width="240" height="66" rx="8" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="820" y="88" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Front office</text>
  <text x="820" y="106" font-size="11.5" fill="#1f2933" text-anchor="middle">light container, no router,</text>
  <text x="820" y="121" font-size="11.5" fill="#1f2933" text-anchor="middle">no translator, Doctrine yes</text>

  <!-- row labels + cells -->
  <rect x="20" y="144" width="215" height="58" rx="8" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="34" y="168" font-size="13" font-weight="bold" fill="#1f2933" font-family="Courier New, monospace">config/</text>
  <text x="34" y="187" font-size="11.5" fill="#1f2933">services.yml, routes.yml</text>
  <rect x="250" y="144" width="210" height="58" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="355" y="178" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">loaded</text>
  <rect x="475" y="144" width="210" height="58" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="580" y="178" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">loaded</text>
  <rect x="700" y="144" width="240" height="58" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="178" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">not loaded</text>

  <rect x="20" y="214" width="215" height="58" rx="8" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="34" y="238" font-size="13" font-weight="bold" fill="#1f2933" font-family="Courier New, monospace">config/admin/</text>
  <text x="34" y="257" font-size="11.5" fill="#1f2933">back-office legacy pages</text>
  <rect x="250" y="214" width="210" height="58" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="355" y="248" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">loaded</text>
  <rect x="475" y="214" width="210" height="58" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="580" y="248" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">loaded</text>
  <rect x="700" y="214" width="240" height="58" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="248" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">not loaded</text>

  <rect x="20" y="284" width="215" height="58" rx="8" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="34" y="308" font-size="13" font-weight="bold" fill="#1f2933" font-family="Courier New, monospace">config/front/</text>
  <text x="34" y="327" font-size="11.5" fill="#1f2933">hooks and front controllers</text>
  <rect x="250" y="284" width="210" height="58" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="355" y="308" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">not loaded</text>
  <text x="355" y="326" font-size="11" fill="#1f2933" text-anchor="middle">the documentation says loaded</text>
  <rect x="475" y="284" width="210" height="58" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="580" y="318" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">not loaded</text>
  <rect x="700" y="284" width="240" height="58" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="820" y="318" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">loaded</text>

  <rect x="20" y="354" width="215" height="58" rx="8" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="34" y="378" font-size="13" font-weight="bold" fill="#1f2933" font-family="Courier New, monospace">config/webservice/</text>
  <text x="34" y="397" font-size="11.5" fill="#1f2933">Webservice extensions</text>
  <rect x="250" y="354" width="690" height="58" rx="8" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="595" y="388" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">documented (own container), not run here</text>

  <text x="480" y="440" font-size="12" fill="#7b8794" text-anchor="middle">In each folder one file wins: services.php, then services-9.2.yml, then services-9.yml, then services.yml (9.2 and later).</text>
  <text x="480" y="458" font-size="12" fill="#7b8794" text-anchor="middle">Definitions shared by several folders go in one file that each folder imports.</text>
</svg>
