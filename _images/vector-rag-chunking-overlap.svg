<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="320" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Overlapping chunk windows over a document</text>
  <text x="390" y="46" font-size="12" fill="#666666" text-anchor="middle">Each window shares its trailing/leading words with the next, so a sentence split at a boundary still appears whole in one chunk</text>

  <!-- source text bar -->
  <rect x="40" y="70" width="700" height="34" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1"/>
  <text x="390" y="91" font-size="11" fill="#444444" text-anchor="middle">source_path = docs/vector-rag/hnsw.adoc -- continuous token stream</text>

  <!-- ticks -->
  <g stroke="#bbbbbb" stroke-width="1">
    <line x1="40" y1="104" x2="40" y2="112"/>
    <line x1="160" y1="104" x2="160" y2="112"/>
    <line x1="280" y1="104" x2="280" y2="112"/>
    <line x1="400" y1="104" x2="400" y2="112"/>
    <line x1="520" y1="104" x2="520" y2="112"/>
    <line x1="640" y1="104" x2="640" y2="112"/>
    <line x1="740" y1="104" x2="740" y2="112"/>
  </g>

  <!-- chunk 0 -->
  <rect x="40" y="130" width="200" height="34" rx="4" fill="#eaf1f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="140" y="151" font-size="11" fill="#1c4b73" text-anchor="middle">chunk_index = 0  (words 0-199)</text>

  <!-- chunk 1, overlaps chunk 0's tail -->
  <rect x="200" y="172" width="200" height="34" rx="4" fill="#eaf3ec" stroke="#2f6d45" stroke-width="1.5"/>
  <text x="300" y="193" font-size="11" fill="#2f6d45" text-anchor="middle">chunk_index = 1  (words 150-349)</text>

  <!-- chunk 2 -->
  <rect x="360" y="130" width="200" height="34" rx="4" fill="#f4ece2" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="460" y="151" font-size="11" fill="#7a3b12" text-anchor="middle">chunk_index = 2  (words 300-499)</text>

  <!-- chunk 3 -->
  <rect x="520" y="172" width="200" height="34" rx="4" fill="#f2e7ee" stroke="#7a2e58" stroke-width="1.5"/>
  <text x="620" y="193" font-size="11" fill="#7a2e58" text-anchor="middle">chunk_index = 3  (words 450-649)</text>

  <!-- overlap shading -->
  <rect x="200" y="130" width="40" height="76" fill="#888888" fill-opacity="0.18"/>
  <rect x="360" y="130" width="40" height="76" fill="#888888" fill-opacity="0.18"/>
  <rect x="520" y="130" width="40" height="76" fill="#888888" fill-opacity="0.18"/>

  <text x="220" y="222" font-size="9.5" fill="#666666" text-anchor="middle">50-word</text>
  <text x="220" y="233" font-size="9.5" fill="#666666" text-anchor="middle">overlap</text>
  <text x="380" y="222" font-size="9.5" fill="#666666" text-anchor="middle">50-word</text>
  <text x="380" y="233" font-size="9.5" fill="#666666" text-anchor="middle">overlap</text>
  <text x="540" y="222" font-size="9.5" fill="#666666" text-anchor="middle">50-word</text>
  <text x="540" y="233" font-size="9.5" fill="#666666" text-anchor="middle">overlap</text>

  <text x="390" y="265" font-size="11.5" fill="#333333" text-anchor="middle">A 200-word window with a 50-word overlap: each chunk begins 150 words after the previous one starts.</text>
  <text x="390" y="283" font-size="11.5" fill="#333333" text-anchor="middle">A sentence spanning a boundary (e.g. around word 200) still lands intact in at least one of the two neighboring chunks.</text>
</svg>
