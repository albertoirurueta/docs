<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <defs>
    <marker id="val-arrow-orange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Vaadin AppLayout anatomy</text>

  <!-- ============ Wide viewport: drawer sits beside the content ============ -->
  <text x="243" y="48" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Wide viewport &#8212; drawer beside content</text>

  <!-- outer frame -->
  <rect x="40" y="58" width="406" height="300" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="2"/>

  <!-- navbar spans the full width -->
  <rect x="40" y="58" width="406" height="46" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <rect x="54" y="70" width="22" height="22" rx="3" fill="#ffffff" stroke="#c25a1d" stroke-width="1.5"/>
  <line x1="59" y1="77" x2="71" y2="77" stroke="#c25a1d" stroke-width="1.6"/>
  <line x1="59" y1="81" x2="71" y2="81" stroke="#c25a1d" stroke-width="1.6"/>
  <line x1="59" y1="85" x2="71" y2="85" stroke="#c25a1d" stroke-width="1.6"/>
  <text x="86" y="86" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="start">App title / actions</text>
  <text x="434" y="82" font-size="11" fill="#1c4b73" text-anchor="end">navbar</text>
  <text x="86" y="99" font-size="9" fill="#8a3d13" text-anchor="start">DrawerToggle (hamburger)</text>

  <!-- drawer -->
  <rect x="40" y="104" width="118" height="254" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <rect x="52" y="118" width="94" height="18" rx="3" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <rect x="52" y="142" width="94" height="18" rx="3" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <rect x="52" y="166" width="94" height="18" rx="3" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <rect x="52" y="190" width="94" height="18" rx="3" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <text x="99" y="332" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">drawer</text>
  <text x="99" y="347" font-size="9.5" fill="#666666" text-anchor="middle">navigation items</text>

  <!-- content -->
  <rect x="158" y="104" width="288" height="254" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="302" y="228" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">content</text>
  <text x="302" y="246" font-size="10" fill="#666666" text-anchor="middle">routed view fills the rest</text>

  <text x="243" y="380" font-size="9.5" fill="#444444" text-anchor="middle">setPrimarySection(Section.DRAWER | Section.NAVBAR) chooses which one spans the full width</text>

  <!-- ============ Below breakpoint: drawer overlays the content ============ -->
  <text x="592" y="48" font-size="12" font-weight="bold" fill="#8a3d13" text-anchor="middle">Below breakpoint &#8212; overlay mode</text>

  <rect x="500" y="58" width="184" height="300" rx="6" fill="#ffffff" stroke="#c25a1d" stroke-width="2"/>

  <!-- navbar -->
  <rect x="500" y="58" width="184" height="42" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.5"/>
  <rect x="512" y="69" width="20" height="20" rx="3" fill="#ffffff" stroke="#c25a1d" stroke-width="1.5"/>
  <line x1="516" y1="75" x2="528" y2="75" stroke="#c25a1d" stroke-width="1.6"/>
  <line x1="516" y1="79" x2="528" y2="79" stroke="#c25a1d" stroke-width="1.6"/>
  <line x1="516" y1="83" x2="528" y2="83" stroke="#c25a1d" stroke-width="1.6"/>
  <text x="543" y="84" font-size="10.5" fill="#8a3d13" text-anchor="start">App title</text>

  <!-- content underneath -->
  <rect x="500" y="100" width="184" height="258" fill="#ffffff" stroke="#c25a1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="648" y="238" font-size="11" font-weight="bold" fill="#8a3d13" text-anchor="middle">content</text>

  <!-- scrim over the content -->
  <rect x="500" y="100" width="184" height="258" fill="#8a3d13" opacity="0.12"/>

  <!-- drawer slides over the content -->
  <rect x="500" y="100" width="112" height="258" fill="#f3d9c6" stroke="#c25a1d" stroke-width="1.5"/>
  <rect x="512" y="114" width="88" height="16" rx="3" fill="#ffffff" stroke="#c25a1d" stroke-width="1"/>
  <rect x="512" y="136" width="88" height="16" rx="3" fill="#ffffff" stroke="#c25a1d" stroke-width="1"/>
  <rect x="512" y="158" width="88" height="16" rx="3" fill="#ffffff" stroke="#c25a1d" stroke-width="1"/>
  <text x="556" y="338" font-size="10.5" font-weight="bold" fill="#8a3d13" text-anchor="middle">drawer overlays</text>

  <line x1="656" y1="132" x2="616" y2="132" stroke="#c25a1d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#val-arrow-orange)"/>
  <text x="650" y="123" font-size="9" fill="#8a3d13" text-anchor="middle">over content</text>

  <!-- caption -->
  <text x="360" y="398" font-size="11.5" fill="#444444" text-anchor="middle">DrawerToggle shows and hides the drawer. Wide: the drawer sits beside the content. Narrow: it slides over the content behind a scrim.</text>
</svg>
