<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Laravel's component map</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">Laravel 13: the framework's components, the libraries it is built on, and the runtime underneath</text>

  <!-- application -->
  <rect x="20" y="62" width="860" height="44" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="450" y="81" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Your application</text>
  <text x="450" y="98" font-size="11" fill="#444444" text-anchor="middle">routes/web.php · app/Http/Controllers · app/Models · resources/views · config/ · database/migrations · tests/</text>

  <!-- four columns -->
  <g font-size="11" fill="#333333">
    <rect x="20" y="120" width="205" height="196" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="122" y="140" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">HTTP and views</text>
    <text x="34" y="162">Routing and route model binding</text>
    <text x="34" y="180">Middleware</text>
    <text x="34" y="198">Controllers</text>
    <text x="34" y="216">Requests and validation</text>
    <text x="34" y="234">Responses, redirects, sessions</text>
    <text x="34" y="252">Blade templates and components</text>
    <text x="34" y="270">Vite asset bundling</text>
    <text x="34" y="288">Livewire or Inertia</text>
    <text x="34" y="306" fill="#666666">(React, Vue, Svelte)</text>

    <rect x="238" y="120" width="205" height="196" fill="#e9f5ec" stroke="#1d6b34" stroke-width="1.6"/>
    <text x="340" y="140" font-size="13" font-weight="bold" fill="#1d6b34" text-anchor="middle">Data</text>
    <text x="252" y="162">Database connections</text>
    <text x="252" y="180">Query builder</text>
    <text x="252" y="198">Eloquent ORM and relationships</text>
    <text x="252" y="216">Casts, accessors, API resources</text>
    <text x="252" y="234">Migrations and schema builder</text>
    <text x="252" y="252">Seeders and model factories</text>
    <text x="252" y="270">Collections</text>
    <text x="252" y="288">Pagination</text>
    <text x="252" y="306">Redis</text>

    <rect x="456" y="120" width="205" height="196" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
    <text x="558" y="140" font-size="13" font-weight="bold" fill="#a05a00" text-anchor="middle">Services</text>
    <text x="470" y="162">Queues and jobs</text>
    <text x="470" y="180">Events and listeners</text>
    <text x="470" y="198">Broadcasting</text>
    <text x="470" y="216">Mail and notifications</text>
    <text x="470" y="234">Cache and locks</text>
    <text x="470" y="252">File storage</text>
    <text x="470" y="270">Task scheduler</text>
    <text x="470" y="288">HTTP client</text>
    <text x="470" y="306">Processes, concurrency, localization</text>

    <rect x="674" y="120" width="206" height="196" fill="#fbeaea" stroke="#9b1c1c" stroke-width="1.6"/>
    <text x="777" y="140" font-size="13" font-weight="bold" fill="#9b1c1c" text-anchor="middle">Security</text>
    <text x="688" y="162">Authentication and guards</text>
    <text x="688" y="180">Gates and policies</text>
    <text x="688" y="198">CSRF (PreventRequestForgery)</text>
    <text x="688" y="216">Encryption</text>
    <text x="688" y="234">Hashing</text>
    <text x="688" y="252">Rate limiting</text>
    <text x="688" y="270">Signed URLs</text>
    <text x="688" y="288">Email verification and</text>
    <text x="688" y="306">password reset</text>
  </g>

  <!-- foundation -->
  <rect x="20" y="330" width="860" height="56" fill="#efe9f7" stroke="#5b3a8a" stroke-width="1.6"/>
  <text x="450" y="350" font-size="13" font-weight="bold" fill="#5b3a8a" text-anchor="middle">Foundation</text>
  <text x="450" y="372" font-size="11" fill="#333333" text-anchor="middle">service container · service providers · facades · configuration and .env · Artisan console · exceptions and logging · testing helpers</text>

  <!-- built on -->
  <rect x="20" y="400" width="520" height="86" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="280" y="420" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Symfony components</text>
  <text x="280" y="442" font-size="11" fill="#333333" text-anchor="middle">HttpFoundation · HttpKernel · Routing · Console · ErrorHandler</text>
  <text x="280" y="460" font-size="11" fill="#333333" text-anchor="middle">Mailer · Mime · Process · Finder · VarDumper · Uid</text>
  <text x="280" y="478" font-size="10" fill="#666666" text-anchor="middle">7.4 or 8.x (Symfony 8 needs PHP 8.4)</text>

  <rect x="552" y="400" width="328" height="86" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="716" y="420" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Other libraries</text>
  <text x="716" y="442" font-size="11" fill="#333333" text-anchor="middle">Monolog · Carbon · Flysystem · Guzzle</text>
  <text x="716" y="460" font-size="11" fill="#333333" text-anchor="middle">phpdotenv · CommonMark · ramsey/uuid</text>
  <text x="716" y="478" font-size="11" fill="#333333" text-anchor="middle">cron-expression · brick/math · league/uri</text>

  <!-- runtime -->
  <rect x="20" y="500" width="860" height="44" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="450" y="519" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">PHP 8.3 to 8.5</text>
  <text x="450" y="536" font-size="11" fill="#333333" text-anchor="middle">PHP-FPM behind Nginx or Apache · FrankenPHP · Octane worker mode (FrankenPHP, Swoole, RoadRunner) · the CLI for Artisan and queue workers</text>

  <!-- packages -->
  <text x="450" y="566" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">First-party packages, installed when needed</text>
  <text x="450" y="584" font-size="11" fill="#444444" text-anchor="middle">Sanctum · Passport · Fortify · Socialite · Horizon · Reverb · Octane · Scout · Telescope · Pulse · Pennant · Cashier · Pint · Sail · Boost · AI SDK</text>
</svg>
