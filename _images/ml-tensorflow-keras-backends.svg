<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Keras 3 above interchangeable backends</title>
<desc id="d">Layered diagram: your code uses keras layers, models and fit on top of the keras.ops namespace, which dispatches to one of three backends chosen by KERAS_BACKEND before import: TensorFlow, JAX or PyTorch. OpenVINO is shown as inference only. Saved .keras files are portable across the backends.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One Keras program, three execution engines</text>
<rect x="60" y="52" width="600" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="360" y="75" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Your code</text>
<text x="360" y="94" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">keras.layers  keras.Model  fit / evaluate / predict  custom layers</text>
<line x1="360" y1="104" x2="360" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="130" width="600" height="52" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="153" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Keras 3 core</text>
<text x="360" y="172" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">keras.ops: NumPy API + neural-network ops (conv, softmax, ...)</text>
<line x1="155" y1="182" x2="155" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="360" y1="182" x2="360" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="565" y1="182" x2="565" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="216" width="190" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="155" y="240" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">TensorFlow</text>
<text x="155" y="260" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">KERAS_BACKEND=tensorflow</text>
<rect x="265" y="216" width="190" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360" y="240" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">JAX</text>
<text x="360" y="260" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">KERAS_BACKEND=jax</text>
<rect x="470" y="216" width="190" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="565" y="240" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">PyTorch</text>
<text x="565" y="260" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">KERAS_BACKEND=torch</text>
<rect x="60" y="292" width="320" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="220" y="316" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">OpenVINO: inference only (predict)</text>
<rect x="400" y="292" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="530" y="316" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">.keras files load on any backend</text>
<text x="360" y="350" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Set the variable before import keras; redrawn from the description at keras.io/keras_3</text>
</svg>
