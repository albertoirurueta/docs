<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: share the Bookshelf file with a password</text>
  <rect x="20" y="50" width="160" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="34" y="68" width="132" height="16" rx="3" fill="#E5E7EB"/>
  <rect x="112" y="68" width="54" height="16" rx="8" fill="#4F46E5"/>
  <text x="139" y="80" font-size="10" fill="#FFFFFF" text-anchor="middle">Share</text>
  <rect x="34" y="100" width="62" height="80" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="104" y="100" width="62" height="80" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="100" y="212" font-size="12" fill="#374151" text-anchor="middle">Click Share</text>
  <path d="M184 145 L212 145" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="216" y="50" width="160" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="232" y="80" font-size="12" font-weight="bold" fill="#3730A3">Who has access</text>
  <rect x="232" y="92" width="128" height="26" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <text x="296" y="109" font-size="12" fill="#92400E" text-anchor="middle">Anyone</text>
  <text x="296" y="212" font-size="12" fill="#374151" text-anchor="middle">Set to Anyone</text>
  <path d="M380 145 L408 145" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="412" y="50" width="160" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="428" y="80" font-size="12" font-weight="bold" fill="#3730A3">Additional security</text>
  <rect x="428" y="94" width="14" height="14" rx="2" fill="#4F46E5"/>
  <text x="450" y="106" font-size="12" fill="#374151">Password required</text>
  <rect x="428" y="122" width="128" height="22" rx="4" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="438" y="137" font-size="12" fill="#4B5563">four random words</text>
  <text x="492" y="212" font-size="12" fill="#374151" text-anchor="middle">Enter or generate</text>
  <path d="M576 145 L604 145" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="608" y="50" width="132" height="190" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <rect x="632" y="104" width="84" height="26" rx="13" fill="#047857"/>
  <text x="674" y="121" font-size="12" fill="#FFFFFF" text-anchor="middle">Save</text>
  <text x="674" y="212" font-size="12" fill="#374151" text-anchor="middle">Click Save, copy it</text>
  <circle cx="20" cy="50" r="11" fill="#4F46E5"/><text x="20" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="216" cy="50" r="11" fill="#4F46E5"/><text x="216" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="412" cy="50" r="11" fill="#4F46E5"/><text x="412" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="608" cy="50" r="11" fill="#047857"/><text x="608" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="380" y="276" font-size="12" fill="#374151" text-anchor="middle">Passwords cannot be read back after saving, so store the new one before closing the dialog.</text>
</svg>
