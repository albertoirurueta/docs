<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kafka producer internals: from send() to the broker</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">one ProducerRecord's path through the client, drawn left to right in the order it is actually processed</text>

  <!-- Stage 1: Application -->
  <rect x="10" y="90" width="115" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="67" y="116" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Application</text>
  <text x="67" y="132" font-size="9.5" fill="#333333" text-anchor="middle">send(</text>
  <text x="67" y="145" font-size="9.5" fill="#333333" text-anchor="middle">ProducerRecord,</text>
  <text x="67" y="158" font-size="9.5" fill="#333333" text-anchor="middle">Callback)</text>

  <!-- Stage 2: Serializer -->
  <rect x="140" y="90" width="115" height="80" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="197" y="116" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Serializer</text>
  <text x="197" y="133" font-size="9.5" fill="#333333" text-anchor="middle">key.serializer</text>
  <text x="197" y="146" font-size="9.5" fill="#333333" text-anchor="middle">value.serializer</text>
  <text x="197" y="159" font-size="9.5" fill="#333333" text-anchor="middle">object to bytes</text>

  <!-- Stage 3: Partitioner -->
  <rect x="270" y="90" width="120" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="330" y="116" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Partitioner</text>
  <text x="330" y="133" font-size="9.5" fill="#333333" text-anchor="middle">key hash, sticky</text>
  <text x="330" y="146" font-size="9.5" fill="#333333" text-anchor="middle">(no key), or custom</text>
  <text x="330" y="159" font-size="9.5" fill="#333333" text-anchor="middle">Partitioner impl</text>

  <!-- Stage 4: Record Accumulator -->
  <rect x="405" y="80" width="140" height="100" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="475" y="102" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Record</text>
  <text x="475" y="116" font-size="11.5" font-weight="bold" fill="#a33333" text-anchor="middle">Accumulator</text>
  <text x="475" y="133" font-size="9.5" fill="#333333" text-anchor="middle">batches per partition</text>
  <text x="475" y="146" font-size="9.5" fill="#333333" text-anchor="middle">batch.size (bytes)</text>
  <text x="475" y="159" font-size="9.5" fill="#333333" text-anchor="middle">linger.ms (wait)</text>
  <text x="475" y="172" font-size="9.5" fill="#333333" text-anchor="middle">compression.type</text>

  <!-- Stage 5: Sender thread -->
  <rect x="570" y="90" width="120" height="80" fill="#f3eefa" stroke="#6a3fa0" stroke-width="1.4"/>
  <text x="630" y="116" font-size="11.5" font-weight="bold" fill="#6a3fa0" text-anchor="middle">Sender</text>
  <text x="630" y="129" font-size="11.5" font-weight="bold" fill="#6a3fa0" text-anchor="middle">thread</text>
  <text x="630" y="146" font-size="9.5" fill="#333333" text-anchor="middle">background I/O</text>
  <text x="630" y="159" font-size="9.5" fill="#333333" text-anchor="middle">Produce requests</text>

  <!-- arrows stage 1-5 -->
  <line x1="125" y1="130" x2="140" y2="130" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="255" y1="130" x2="270" y2="130" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="405" y2="130" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="545" y1="130" x2="570" y2="130" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Broker, below sender, second row -->
  <rect x="570" y="230" width="120" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="630" y="256" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Broker</text>
  <text x="630" y="273" font-size="9.5" fill="#333333" text-anchor="middle">partition leader</text>
  <text x="630" y="286" font-size="9.5" fill="#333333" text-anchor="middle">appends to log,</text>
  <text x="630" y="299" font-size="9.5" fill="#333333" text-anchor="middle">replies per acks</text>

  <!-- arrow sender -> broker -->
  <line x1="630" y1="170" x2="630" y2="230" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="642" y="200" font-size="9" fill="#666666">Produce</text>
  <text x="642" y="211" font-size="9" fill="#666666">request</text>

  <!-- arrow broker -> callback (RecordMetadata / Future) -->
  <line x1="570" y1="270" x2="130" y2="270" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowgray)"/>
  <rect x="10" y="240" width="120" height="60" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="70" y="262" font-size="10.5" font-weight="bold" fill="#333333" text-anchor="middle">Callback.onCompletion</text>
  <text x="70" y="277" font-size="9.5" fill="#333333" text-anchor="middle">RecordMetadata /</text>
  <text x="70" y="290" font-size="9.5" fill="#333333" text-anchor="middle">Future&lt;RecordMetadata&gt;</text>

  <text x="350" y="345" font-size="10" fill="#666666" text-anchor="middle">send() never blocks on the broker -- it hands the record to the accumulator and returns immediately;</text>
  <text x="350" y="360" font-size="10" fill="#666666" text-anchor="middle">the sender thread drains full or lingered batches and the callback/Future resolves only once the</text>
  <text x="350" y="375" font-size="10" fill="#666666" text-anchor="middle">broker actually replies, asynchronously, on a separate thread from the one that called send().</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
