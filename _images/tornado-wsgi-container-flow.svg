<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>WSGIContainer request flow</title>
  <defs>
    <marker id="wcf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">One request through WSGIContainer</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the event loop keeps its thread only if the WSGI call runs on an executor</text>

  <!-- event loop lane -->
  <rect x="20" y="62" width="680" height="120" rx="8" fill="#808080" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
  <text x="34" y="82" font-size="12" font-weight="bold" fill="currentColor">Event loop thread (one per process)</text>

  <rect x="36" y="96" width="140" height="64" rx="6" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="106" y="120" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">HTTPServer</text>
  <text x="106" y="138" font-size="11" fill="currentColor" text-anchor="middle">parses the whole</text>
  <text x="106" y="151" font-size="11" fill="currentColor" text-anchor="middle">request, body included</text>

  <rect x="206" y="96" width="140" height="64" rx="6" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="276" y="120" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Router / Fallback</text>
  <text x="276" y="138" font-size="11" fill="currentColor" text-anchor="middle">native handler or</text>
  <text x="276" y="151" font-size="11" fill="currentColor" text-anchor="middle">WSGIContainer</text>

  <rect x="376" y="96" width="140" height="64" rx="6" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="446" y="120" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">environ()</text>
  <text x="446" y="138" font-size="11" fill="currentColor" text-anchor="middle">builds the WSGI dict,</text>
  <text x="446" y="151" font-size="11" fill="currentColor" text-anchor="middle">body in a BytesIO</text>

  <rect x="546" y="96" width="140" height="64" rx="6" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="616" y="120" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">write_headers</text>
  <text x="616" y="138" font-size="11" fill="currentColor" text-anchor="middle">status, headers and the</text>
  <text x="616" y="151" font-size="11" fill="currentColor" text-anchor="middle">full body in one go</text>

  <line x1="176" y1="128" x2="204" y2="128" stroke="currentColor" stroke-width="1.5" marker-end="url(#wcf-arrow)"/>
  <line x1="346" y1="128" x2="374" y2="128" stroke="currentColor" stroke-width="1.5" marker-end="url(#wcf-arrow)"/>

  <!-- executor lane -->
  <rect x="20" y="236" width="680" height="110" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="256" font-size="12" font-weight="bold" fill="currentColor">Executor thread (ThreadPoolExecutor, Tornado 6.3 or newer)</text>

  <rect x="306" y="270" width="210" height="64" rx="6" fill="#808080" fill-opacity="0.40" stroke="currentColor" stroke-width="2"/>
  <text x="411" y="294" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">wsgi_application(environ,</text>
  <text x="411" y="310" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">start_response)</text>
  <text x="411" y="326" font-size="11" fill="currentColor" text-anchor="middle">Flask, Pyramid, Django ...</text>

  <rect x="36" y="270" width="200" height="64" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="136" y="294" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Without an executor</text>
  <text x="136" y="312" font-size="11" fill="currentColor" text-anchor="middle">the call runs on the loop</text>
  <text x="136" y="326" font-size="11" fill="currentColor" text-anchor="middle">thread and blocks it</text>

  <!-- arrows loop to executor and back -->
  <line x1="446" y1="162" x2="446" y2="268" stroke="currentColor" stroke-width="1.5" marker-end="url(#wcf-arrow)"/>
  <text x="456" y="214" font-size="11" fill="currentColor">run_in_executor</text>
  <line x1="580" y1="302" x2="580" y2="162" stroke="currentColor" stroke-width="1.5" marker-end="url(#wcf-arrow)" stroke-dasharray="4 3"/>
  <line x1="516" y1="302" x2="580" y2="302" stroke="currentColor" stroke-width="1.5"/>
  <text x="590" y="214" font-size="11" fill="currentColor">iterated chunk by chunk,</text>
  <text x="590" y="228" font-size="11" fill="currentColor">joined, then sent</text>

  <text x="360" y="378" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.85">No streaming: the client sees nothing until the WSGI iterable is exhausted</text>
</svg>
