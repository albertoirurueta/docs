<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-shared-header" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One header, two compilers: sharing structs between Swift and MSL</text>
<rect x="280" y="60" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="83.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">shared source of truth</text>
<text x="380.0" y="98.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">ShaderTypes.h</text>
<text x="380.0" y="113.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">enums, structs, simd types</text>
<rect x="20" y="190" width="300" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="217.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Swift side</text>
<text x="170.0" y="231.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Bookshelf-Bridging-Header.h</text>
<text x="170.0" y="245.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">#import "ShaderTypes.h"</text>
<text x="170.0" y="259.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Build setting: Objective-C Bridging Header</text>
<rect x="440" y="190" width="300" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="590.0" y="217.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal side</text>
<text x="590.0" y="231.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Shaders.metal</text>
<text x="590.0" y="245.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">#include "ShaderTypes.h"</text>
<text x="590.0" y="259.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Compiled by the Metal compiler to AIR</text>
<line x1="330" y1="130" x2="200" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<line x1="430" y1="130" x2="560" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<rect x="20" y="310" width="300" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="170.0" y="330.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Swift types, imported by clang</text>
<text x="170.0" y="344.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">BookUniforms, BookBufferIndex.uniforms</text>
<text x="170.0" y="358.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">MemoryLayout stride 144</text>
<rect x="440" y="310" width="300" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="590.0" y="330.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">MSL types, same layout</text>
<text x="590.0" y="344.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">constant BookUniforms &amp;u</text>
<text x="590.0" y="358.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">[[buffer(BookBufferIndexUniforms)]]</text>
<line x1="170" y1="280" x2="170" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<line x1="590" y1="280" x2="590" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<line x1="320" y1="341" x2="440" y2="341" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<line x1="440" y1="341" x2="320" y2="341" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-msl-shading-language-shared-header)"/>
<text x="380" y="333" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">same bytes</text>
<rect x="20" y="392" width="720" height="62" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="412.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Guard the layout</text>
<text x="380.0" y="426.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The SHARED_ASSERT macro in the header fails the build if sizeof(BookUniforms) changes on either side,</text>
<text x="380.0" y="440.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">which catches float3 padding mistakes at compile time instead of as garbage on screen.</text>
</svg>
