<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-cameras-and-projection-orbit-camera" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">An orbit camera: yaw, pitch and distance around a target</text>
<line x1="250" y1="275" x2="250" y2="60" stroke="#9CA3AF" stroke-width="1" marker-end="url(#ah-cameras-and-projection-orbit-camera)"/>
<text x="266" y="70" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">y (up)</text>
<line x1="150" y1="255" x2="370" y2="195" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ah-cameras-and-projection-orbit-camera)"/>
<circle cx="250" cy="215" r="6" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="250" y="237" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">target (book)</text>
<line x1="400" y1="105" x2="250" y2="215" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah-cameras-and-projection-orbit-camera)"/>
<circle cx="400" cy="105" r="7" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="410" y="95" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">camera</text>
<text x="341.0" y="156.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">distance r</text>
<line x1="400" y1="105" x2="400" y2="225" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M320,215 A70,70 0 0 0 305,171" fill="none" stroke="#047857" stroke-width="1.5"/>
<text x="336" y="191" font-size="12" font-weight="bold" fill="#065F46" text-anchor="start">pitch</text>
<path d="M100,251 A150,40 0 1 1 400,251" fill="none" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="140" y="299" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">yaw circle</text>
<rect x="470" y="70" width="260" height="250" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="600" y="94" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Spherical to Cartesian</text>
<text x="600" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye.x = target.x + r cos(pitch) sin(yaw)</text>
<text x="600" y="137" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye.y = target.y + r sin(pitch)</text>
<text x="600" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye.z = target.z + r cos(pitch) cos(yaw)</text>
<text x="600" y="186" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mouse drag: yaw and pitch change</text>
<text x="600" y="201" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scroll wheel: r changes</text>
<text x="600" y="216" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">pitch clamped to about +/- 89 degrees</text>
<text x="600" y="231" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">r clamped above the near distance</text>
<text x="600" y="262" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">view = lookAt(eye, target, (0,1,0))</text>
<text x="600" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Clamping pitch keeps the forward vector</text>
<text x="600" y="299" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">from becoming parallel to the up vector.</text>
</svg>
