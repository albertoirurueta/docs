<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="ie-t ie-d">
  <title id="ie-t">Implicit expansion of a column and a row</title>
  <desc id="ie-d">A 3 by 1 column with the values 5, 6 and 7 and a 1 by 4 row with the values 1, 2, 3 and 4. MATLAB conceptually repeats the column across four columns and the row down three rows, then adds them to give a 3 by 4 matrix.</desc>
  <rect x="0" y="0" width="900" height="330" rx="12" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">b + a with b of size 3-by-1 and a of size 1-by-4 gives a 3-by-4 result</text>
  <text x="60" y="70" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">b (3x1)</text>
  <rect x="60" y="85" width="50" height="45" fill="#dbeafe" stroke="#64748b"/>
  <text x="85.0" y="112.83333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">5</text>
  <rect x="120" y="85" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="145.0" y="112.83333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">5</text>
  <rect x="170" y="85" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="195.0" y="112.83333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">5</text>
  <rect x="220" y="85" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="245.0" y="112.83333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">5</text>
  <rect x="60" y="130" width="50" height="45" fill="#dbeafe" stroke="#64748b"/>
  <text x="85.0" y="157.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">6</text>
  <rect x="120" y="130" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="145.0" y="157.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">6</text>
  <rect x="170" y="130" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="195.0" y="157.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">6</text>
  <rect x="220" y="130" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="245.0" y="157.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">6</text>
  <rect x="60" y="175" width="50" height="45" fill="#dbeafe" stroke="#64748b"/>
  <text x="85.0" y="202.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">7</text>
  <rect x="120" y="175" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="145.0" y="202.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">7</text>
  <rect x="170" y="175" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="195.0" y="202.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">7</text>
  <rect x="220" y="175" width="50" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="245.0" y="202.83333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">7</text>
  <text x="125" y="70" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">repeated across the columns (dashed)</text>
  <text x="60" y="250" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a">+</text>
  <text x="60" y="275" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">a (1x4)</text>
  <rect x="60" y="285" width="60" height="38" fill="#dcfce7" stroke="#64748b"/>
  <text x="90.0" y="309.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">1</text>
  <rect x="120" y="285" width="60" height="38" fill="#dcfce7" stroke="#64748b"/>
  <text x="150.0" y="309.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">2</text>
  <rect x="180" y="285" width="60" height="38" fill="#dcfce7" stroke="#64748b"/>
  <text x="210.0" y="309.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">3</text>
  <rect x="240" y="285" width="60" height="38" fill="#dcfce7" stroke="#64748b"/>
  <text x="270.0" y="309.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">4</text>
  <text x="310" y="309" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">is repeated down the rows too (not drawn)</text>
  <text x="560" y="70" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">result (3x4)</text>
  <rect x="560" y="85" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="600.0" y="113.16666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">6</text>
  <rect x="640" y="85" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="680.0" y="113.16666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">7</text>
  <rect x="720" y="85" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="760.0" y="113.16666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">8</text>
  <rect x="800" y="85" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="840.0" y="113.16666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">9</text>
  <rect x="560" y="130" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="600.0" y="158.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">7</text>
  <rect x="640" y="130" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="680.0" y="158.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">8</text>
  <rect x="720" y="130" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="760.0" y="158.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">9</text>
  <rect x="800" y="130" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="840.0" y="158.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">10</text>
  <rect x="560" y="175" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="600.0" y="203.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">8</text>
  <rect x="640" y="175" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="680.0" y="203.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">9</text>
  <rect x="720" y="175" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="760.0" y="203.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">10</text>
  <rect x="800" y="175" width="80" height="45" fill="#fef9c3" stroke="#64748b"/>
  <text x="840.0" y="203.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">11</text>
  <text x="560" y="250" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">no copy of b or a is stored: the expansion is conceptual</text>
</svg>
