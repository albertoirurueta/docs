<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="420" fill="#ffffff"/>

  <text x="240" y="24" font-size="14" fill="#666666" text-anchor="middle">Anatomy of a .card</text>

  <!-- card outline -->
  <rect x="60" y="40" width="360" height="360" rx="6" fill="#ffffff" stroke="#495057" stroke-width="2"/>

  <!-- header -->
  <rect x="60" y="40" width="360" height="56" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="80" y="73" font-size="14" font-weight="bold" fill="#6b4207">card-header</text>

  <!-- body -->
  <rect x="60" y="96" width="360" height="216" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="80" y="128" font-size="14" font-weight="bold" fill="#1c4b73">card-body</text>
  <text x="80" y="154" font-size="12" fill="#1c4b73">card-title</text>
  <rect x="80" y="164" width="200" height="14" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <text x="80" y="196" font-size="12" fill="#1c4b73">card-text</text>
  <rect x="80" y="206" width="320" height="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <rect x="80" y="222" width="280" height="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1"/>
  <rect x="80" y="248" width="90" height="26" rx="4" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="125" y="266" font-size="11" fill="#1c4b73" text-anchor="middle">btn</text>

  <!-- footer -->
  <rect x="60" y="312" width="360" height="88" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="80" y="345" font-size="14" font-weight="bold" fill="#2a6636">card-footer</text>
  <text x="80" y="368" font-size="11" fill="#2a6636">e.g. timestamp, meta text</text>
</svg>
