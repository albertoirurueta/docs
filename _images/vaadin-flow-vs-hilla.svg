<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <defs>
    <marker id="fh-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
  </defs>

  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Flow and Hilla on one backend</text>

  <!-- browser row -->
  <text x="390" y="52" font-size="11" fill="#666666" text-anchor="middle">browser</text>

  <!-- Flow column -->
  <text x="205" y="76" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Flow &#8212; UI in Java</text>

  <rect x="70" y="86" width="270" height="46" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="205" y="108" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Vaadin Web Components</text>
  <text x="205" y="123" font-size="9.5" fill="#666666" text-anchor="middle">&lt;vaadin-grid&gt;, &lt;vaadin-button&gt; &#8230;</text>

  <line x1="205" y1="132" x2="205" y2="168" stroke="#2f6fa8" stroke-width="1.6" marker-end="url(#fh-arrow)"/>
  <line x1="205" y1="168" x2="205" y2="132" stroke="#2f6fa8" stroke-width="1.6" marker-end="url(#fh-arrow)"/>
  <text x="215" y="153" font-size="9" fill="#444444" text-anchor="start">sync channel</text>

  <rect x="70" y="172" width="270" height="52" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="205" y="193" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">@Route view classes (Java)</text>
  <text x="205" y="209" font-size="9.5" fill="#666666" text-anchor="middle">server-side component tree, Binder, Grid</text>

  <line x1="205" y1="224" x2="205" y2="300" stroke="#2f6fa8" stroke-width="1.6" marker-end="url(#fh-arrow)"/>

  <!-- Hilla column -->
  <text x="575" y="76" font-size="13" font-weight="bold" fill="#8a3d13" text-anchor="middle">Hilla &#8212; UI in React / TS</text>

  <rect x="440" y="86" width="270" height="46" rx="6" fill="#ffffff" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="575" y="108" font-size="11" font-weight="bold" fill="#8a3d13" text-anchor="middle">React view (.tsx)</text>
  <text x="575" y="123" font-size="9.5" fill="#666666" text-anchor="middle">@vaadin/react-components</text>

  <line x1="575" y1="132" x2="575" y2="168" stroke="#c25a1d" stroke-width="1.6" marker-end="url(#fh-arrow)"/>
  <text x="585" y="153" font-size="9" fill="#8a3d13" text-anchor="start">generated TS client</text>

  <rect x="440" y="172" width="270" height="52" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="575" y="193" font-size="11" font-weight="bold" fill="#8a3d13" text-anchor="middle">@BrowserCallable endpoints (Java)</text>
  <text x="575" y="209" font-size="9.5" fill="#666666" text-anchor="middle">type-safe, same Bean Validation</text>

  <line x1="575" y1="224" x2="575" y2="300" stroke="#c25a1d" stroke-width="1.6" marker-end="url(#fh-arrow)"/>

  <!-- shared backend -->
  <rect x="70" y="304" width="640" height="80" rx="8" fill="#eef3ee" stroke="#2f6f4f" stroke-width="2"/>
  <text x="390" y="330" font-size="13" font-weight="bold" fill="#2f6f4f" text-anchor="middle">One Spring Boot backend</text>
  <text x="390" y="350" font-size="10.5" fill="#4a6b56" text-anchor="middle">domain services &#183; repositories &#183; one SecurityFilterChain &#183; one theme &#183; one build</text>
  <text x="390" y="368" font-size="10.5" fill="#4a6b56" text-anchor="middle">a single application can route some paths to Flow and others to Hilla</text>

  <text x="390" y="412" font-size="11" fill="#444444" text-anchor="middle">Both models render the same Vaadin Web Components; the difference is the language the view is written in.</text>
</svg>
