<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Buildx builders and drivers</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Buildx builders and drivers</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">one client; the driver decides where BuildKit runs</text>
  <rect x="290" y="60" width="180" height="60" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="86.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">docker buildx</text>
  <text x="380.0" y="101.8" font-size="9.5" fill="#333333" text-anchor="middle">build  /  bake  /  imagetools</text>
  <rect x="15" y="190" width="140" height="110" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="85.0" y="228.0" font-size="11" font-weight="bold" fill="#1f6b6b" text-anchor="middle">docker</text>
  <text x="85.0" y="243.0" font-size="9" fill="#333333" text-anchor="middle">BuildKit inside dockerd</text>
  <text x="85.0" y="256.0" font-size="9" fill="#333333" text-anchor="middle">default; loads into</text>
  <text x="85.0" y="269.0" font-size="9" fill="#333333" text-anchor="middle">the Engine image store</text>
  <line x1="380" y1="120" x2="85.0" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="162" y="190" width="140" height="110" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="232.0" y="228.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">docker-container</text>
  <text x="232.0" y="243.0" font-size="9" fill="#333333" text-anchor="middle">BuildKit in a container</text>
  <text x="232.0" y="256.0" font-size="9" fill="#333333" text-anchor="middle">multi-platform, gha/registry</text>
  <text x="232.0" y="269.0" font-size="9" fill="#333333" text-anchor="middle">cache export, pinned version</text>
  <line x1="380" y1="120" x2="232.0" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="309" y="190" width="140" height="110" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="379.0" y="228.0" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">kubernetes</text>
  <text x="379.0" y="243.0" font-size="9" fill="#333333" text-anchor="middle">BuildKit pods</text>
  <text x="379.0" y="256.0" font-size="9" fill="#333333" text-anchor="middle">shared, scalable,</text>
  <text x="379.0" y="269.0" font-size="9" fill="#333333" text-anchor="middle">native node per arch</text>
  <line x1="380" y1="120" x2="379.0" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="456" y="190" width="140" height="110" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="526.0" y="228.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">remote</text>
  <text x="526.0" y="243.0" font-size="9" fill="#333333" text-anchor="middle">your BuildKit daemon</text>
  <text x="526.0" y="256.0" font-size="9" fill="#333333" text-anchor="middle">TCP or Unix socket</text>
  <text x="526.0" y="269.0" font-size="9" fill="#333333" text-anchor="middle">self-hosted farm</text>
  <line x1="380" y1="120" x2="526.0" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="603" y="190" width="140" height="110" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="673.0" y="228.0" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">cloud</text>
  <text x="673.0" y="243.0" font-size="9" fill="#333333" text-anchor="middle">Docker Build Cloud</text>
  <text x="673.0" y="256.0" font-size="9" fill="#333333" text-anchor="middle">managed amd64 + arm64</text>
  <text x="673.0" y="269.0" font-size="9" fill="#333333" text-anchor="middle">shared cache</text>
  <line x1="380" y1="120" x2="673.0" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380" y="330" font-size="10" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">docker buildx create --name ci --driver docker-container --use --bootstrap</text>
  <text x="380" y="355" font-size="10" fill="#555555" text-anchor="middle">exporters: --load (image store)  --push (registry)  type=local / oci / tar (files)</text>
  <text x="380" y="375" font-size="10" fill="#555555" text-anchor="middle">caches: inline  registry  local  gha  s3  azblob</text>
</svg>
