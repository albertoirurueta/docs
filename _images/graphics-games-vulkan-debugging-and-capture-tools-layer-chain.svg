<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dbg-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Capture and diagnostic layers sit between the app and the driver</text>
<rect x="40" y="55" width="230" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="155.0" y="77.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Application</text>
<text x="285" y="77" text-anchor="start" font-size="11" fill="#374151">vulkan-1 / libvulkan</text>
<line x1="155" y1="91" x2="155" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-chain)"/>
<rect x="40" y="98" width="230" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="155.0" y="120.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Loader</text>
<text x="285" y="120" text-anchor="start" font-size="11" fill="#374151">reads layer manifests</text>
<line x1="155" y1="134" x2="155" y2="141" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-chain)"/>
<rect x="40" y="141" width="230" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="155.0" y="163.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">api_dump layer</text>
<text x="285" y="163" text-anchor="start" font-size="11" fill="#374151">VK_LAYER_LUNARG_api_dump</text>
<line x1="155" y1="177" x2="155" y2="184" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-chain)"/>
<rect x="40" y="184" width="230" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="155.0" y="206.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">gfxreconstruct</text>
<text x="285" y="206" text-anchor="start" font-size="11" fill="#374151">VK_LAYER_LUNARG_gfxreconstruct</text>
<line x1="155" y1="220" x2="155" y2="227" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-chain)"/>
<rect x="40" y="227" width="230" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="155.0" y="249.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Validation</text>
<text x="285" y="249" text-anchor="start" font-size="11" fill="#374151">VK_LAYER_KHRONOS_validation</text>
<line x1="155" y1="263" x2="155" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-chain)"/>
<rect x="40" y="270" width="230" height="36" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="155.0" y="292.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Driver (ICD)</text>
<text x="285" y="292" text-anchor="start" font-size="11" fill="#374151">GPU</text>
<rect x="500" y="55" width="240" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="98.8" text-anchor="middle" font-size="11" fill="#374151">Order is the order enabled:</text>
<text x="620.0" y="112.8" text-anchor="middle" font-size="11" fill="#374151">the first layer listed is closest</text>
<text x="620.0" y="126.8" text-anchor="middle" font-size="11" fill="#374151">to the application. Put capture</text>
<text x="620.0" y="140.8" text-anchor="middle" font-size="11" fill="#374151">layers first and validation last</text>
<text x="620.0" y="154.8" text-anchor="middle" font-size="11" fill="#374151">if you want a replayable capture</text>
<text x="620.0" y="168.8" text-anchor="middle" font-size="11" fill="#374151">that excludes validation work.</text>
<text x="620" y="230" text-anchor="middle" font-size="11" fill="#374151">vkconfig or VK_INSTANCE_LAYERS sets the list;</text>
<text x="620" y="247" text-anchor="middle" font-size="11" fill="#374151">an app may also name layers at vkCreateInstance.</text>
</svg>
