<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Blocking driver versus async driver versus executor in a Tornado process</title>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where the waiting for the database happens</text>

  <text x="20" y="62" font-size="12" font-weight="bold" fill="currentColor">1. Blocking driver in the handler</text>
  <text x="20" y="84" font-size="11" fill="currentColor">event loop</text>
  <rect x="110" y="70" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="140" y="84" font-size="10" fill="currentColor" text-anchor="middle">parse</text>
  <rect x="170" y="70" width="330" height="20" rx="3" fill="#808080" fill-opacity="0.65" stroke="currentColor"/>
  <text x="335" y="84" font-size="10" fill="currentColor" text-anchor="middle">loop blocked: waiting for the database</text>
  <rect x="500" y="70" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="530" y="84" font-size="10" fill="currentColor" text-anchor="middle">reply</text>
  <rect x="560" y="70" width="50" height="20" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="585" y="84" font-size="10" fill="currentColor" text-anchor="middle">ping</text>
  <text x="110" y="108" font-size="10" fill="currentColor" opacity="0.85">every other request in the process waits for the whole bar</text>

  <text x="20" y="152" font-size="12" font-weight="bold" fill="currentColor">2. Native async driver (asyncpg, SQLAlchemy asyncio, redis.asyncio, AsyncMongoClient)</text>
  <text x="20" y="174" font-size="11" fill="currentColor">event loop</text>
  <rect x="110" y="160" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="140" y="174" font-size="10" fill="currentColor" text-anchor="middle">parse</text>
  <rect x="190" y="160" width="50" height="20" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="215" y="174" font-size="10" fill="currentColor" text-anchor="middle">ping</text>
  <rect x="290" y="160" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="320" y="174" font-size="10" fill="currentColor" text-anchor="middle">other req</text>
  <rect x="500" y="160" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="530" y="174" font-size="10" fill="currentColor" text-anchor="middle">reply</text>
  <text x="110" y="198" font-size="10" fill="currentColor" opacity="0.85">the handler awaits; the socket wait costs no thread and the loop serves others</text>
  <rect x="170" y="206" width="330" height="8" rx="3" fill="#808080" fill-opacity="0.5" stroke="currentColor"/>
  <text x="335" y="228" font-size="10" fill="currentColor" text-anchor="middle">query in flight on the pooled connection</text>

  <text x="20" y="262" font-size="12" font-weight="bold" fill="currentColor">3. Blocking library through run_in_executor</text>
  <text x="20" y="284" font-size="11" fill="currentColor">event loop</text>
  <rect x="110" y="270" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="140" y="284" font-size="10" fill="currentColor" text-anchor="middle">parse</text>
  <rect x="190" y="270" width="50" height="20" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="215" y="284" font-size="10" fill="currentColor" text-anchor="middle">ping</text>
  <rect x="500" y="270" width="60" height="20" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor"/>
  <text x="530" y="284" font-size="10" fill="currentColor" text-anchor="middle">reply</text>
  <text x="20" y="318" font-size="11" fill="currentColor">worker thread</text>
  <rect x="170" y="304" width="330" height="20" rx="3" fill="#808080" fill-opacity="0.65" stroke="currentColor"/>
  <text x="335" y="318" font-size="10" fill="currentColor" text-anchor="middle">blocking call runs here</text>

  <text x="20" y="364" font-size="12" font-weight="bold" fill="currentColor">Rule of thumb</text>
  <text x="20" y="382" font-size="11" fill="currentColor">Prefer 2. Use 3 only when no async driver exists. Never use 1: one slow query delays every connection of the process.</text>
</svg>
