<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two runners contend for the lock on remote state: runner A acquires the lock, reads and writes the state and releases the lock, while runner B is refused until the lock is released</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="430" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Remote state with locking: two runners, one state</text>
  <text x="430" y="44" font-size="10.5" fill="#555555" text-anchor="middle">time flows downwards; the lock serialises every operation that can write state</text>

  <!-- participants -->
  <rect x="60" y="62" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="84" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Runner A</text>
  <text x="160" y="101" font-size="10.5" fill="#0d3c75" text-anchor="middle">CI job: terraform apply</text>

  <rect x="330" y="62" width="200" height="50" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="430" y="84" font-size="13" font-weight="bold" fill="#2e1a63" text-anchor="middle">Runner B</text>
  <text x="430" y="101" font-size="10.5" fill="#2e1a63" text-anchor="middle">engineer laptop: terraform plan</text>

  <rect x="600" y="62" width="220" height="50" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="710" y="84" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">Remote backend</text>
  <text x="710" y="101" font-size="10.5" fill="#5d4200" text-anchor="middle">state object + lock object</text>

  <!-- lifelines -->
  <line x1="160" y1="112" x2="160" y2="536" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="430" y1="112" x2="430" y2="536" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="710" y1="112" x2="710" y2="536" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- lock held band on the backend lifeline -->
  <rect x="702" y="146" width="16" height="258" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.2"/>
  <text x="730" y="276" font-size="10" fill="#8e1a1a" transform="rotate(90 730 276)" text-anchor="middle">lock held by A</text>

  <!-- 1 acquire -->
  <line x1="160" y1="150" x2="700" y2="150" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="142" font-size="11.5" fill="#222222" text-anchor="middle">1. acquire lock: create the lock object only if absent</text>
  <line x1="700" y1="176" x2="170" y2="176" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="170" font-size="11" fill="#14391a" text-anchor="middle">lock granted (records an ID, operation and who)</text>

  <!-- 2 B refused -->
  <line x1="430" y1="214" x2="700" y2="214" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="565" y="206" font-size="11.5" fill="#222222" text-anchor="middle">2. acquire lock</text>
  <line x1="700" y1="240" x2="440" y2="240" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <text x="565" y="234" font-size="11" fill="#8e1a1a" text-anchor="middle">refused: lock is held</text>
  <text x="300" y="228" font-size="10.5" fill="#8e1a1a" text-anchor="middle">B fails, or waits for</text>
  <text x="300" y="242" font-size="10.5" fill="#8e1a1a" text-anchor="middle">-lock-timeout, then retries</text>

  <!-- 3 read -->
  <line x1="160" y1="284" x2="700" y2="284" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="276" font-size="11.5" fill="#222222" text-anchor="middle">3. read the latest state snapshot</text>

  <!-- 4 write -->
  <line x1="160" y1="336" x2="700" y2="336" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="328" font-size="11.5" fill="#222222" text-anchor="middle">4. apply, then write the new state (serial + 1)</text>

  <!-- 5 release -->
  <line x1="160" y1="388" x2="700" y2="388" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="380" font-size="11.5" fill="#222222" text-anchor="middle">5. release lock: delete the lock object</text>

  <!-- 6 B retries -->
  <line x1="430" y1="440" x2="710" y2="440" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="570" y="432" font-size="11.5" fill="#222222" text-anchor="middle">6. acquire lock (retry)</text>
  <line x1="710" y1="464" x2="440" y2="464" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="570" y="458" font-size="11" fill="#14391a" text-anchor="middle">granted</text>
  <line x1="430" y1="496" x2="710" y2="496" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="570" y="488" font-size="11.5" fill="#222222" text-anchor="middle">7. read state: sees A's changes</text>

  <text x="430" y="548" font-size="10.5" fill="#555555" text-anchor="middle">a crashed run can leave the lock behind; only then is terraform force-unlock LOCK_ID appropriate</text>
</svg>
