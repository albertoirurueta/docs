<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Ruby heap pages, slots and object generations</title>
  <desc>Two panels. The left panel shows the Ruby heap as five size pools with slots of 40, 80, 160, 320 and 640 bytes. Each pool is a list of 64 KiB pages, and a zoomed-in page is a grid of equal slots that are free, young (age 0 to 2) or old (age 3 and above). The right panel shows how a young object becomes old: it survives collections and its age rises from 0 to 3. A minor collection marks only young objects and the objects remembered by the write barrier, while a major collection marks every object. An arrow shows an old object that now points to a young object: the write barrier records the old object in the remembered set so that a minor collection still finds the young one.</desc>
