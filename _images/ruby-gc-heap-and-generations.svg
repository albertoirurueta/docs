  <text x="294" y="459" font-size="12" fill="#444444">old, in the remembered set</text>
  <text x="60" y="524" font-size="12" fill="#444444">Data that does not fit in a slot (over 640 bytes) lives in malloc memory.</text>
  <rect x="480" y="70" width="440" height="470" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="700" y="94" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Generations: young becomes old</text>
  <rect x="500" y="116" width="86" height="38" rx="5" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.6"/>
  <text x="543" y="139" font-size="12" font-weight="bold" fill="#8a4a12" text-anchor="middle">age 0</text>
  <path d="M588,135 L598,135" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="600" y="116" width="86" height="38" rx="5" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.6"/>
  <text x="643" y="139" font-size="12" font-weight="bold" fill="#8a4a12" text-anchor="middle">age 1</text>
  <path d="M688,135 L698,135" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="700" y="116" width="86" height="38" rx="5" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.6"/>
  <text x="743" y="139" font-size="12" font-weight="bold" fill="#8a4a12" text-anchor="middle">age 2</text>
  <path d="M788,135 L798,135" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="800" y="116" width="86" height="38" rx="5" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="843" y="139" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">age 3 (old)</text>
  <text x="700" y="176" font-size="12" fill="#444444" text-anchor="middle">each collection the object survives raises its age</text>
  <rect x="500" y="196" width="196" height="116" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="598" y="218" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Minor collection</text>
  <text x="598" y="240" font-size="12" fill="#444444" text-anchor="middle">marks young objects and</text>
  <text x="598" y="257" font-size="12" fill="#444444" text-anchor="middle">the remembered set only;</text>
  <text x="598" y="274" font-size="12" fill="#444444" text-anchor="middle">old objects are assumed live;</text>
  <text x="598" y="291" font-size="12" fill="#444444" text-anchor="middle">cheap, frequent</text>
  <rect x="716" y="196" width="196" height="116" rx="6" fill="#ffffff" stroke="#9a4f0f" stroke-width="1.4"/>
  <text x="814" y="218" font-size="13" font-weight="bold" fill="#9a4f0f" text-anchor="middle">Major collection</text>
  <text x="814" y="240" font-size="12" fill="#444444" text-anchor="middle">marks every object, old</text>
  <text x="814" y="257" font-size="12" fill="#444444" text-anchor="middle">and young; reclaims old</text>
  <text x="814" y="274" font-size="12" fill="#444444" text-anchor="middle">garbage too; costlier,</text>
  <text x="814" y="291" font-size="12" fill="#444444" text-anchor="middle">rarer, can be incremental</text>
  <text x="700" y="346" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Write barrier</text>
  <rect x="520" y="362" width="110" height="38" rx="5" fill="#1c4b73" stroke="#c0392b" stroke-width="3"/>
  <text x="575" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">old catalog</text>
  <rect x="780" y="362" width="110" height="38" rx="5" fill="#f7dcc2" stroke="#9a4f0f" stroke-width="1.6"/>
  <text x="835" y="385" font-size="12" font-weight="bold" fill="#8a4a12" text-anchor="middle">new book</text>
  <path d="M632,381 L778,381" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="705" y="374" font-size="12" font-family="Courier New, monospace" fill="#444444" text-anchor="middle">catalog.add(book)</text>
  <text x="700" y="432" font-size="12" fill="#444444" text-anchor="middle">The old catalog now points to a young book. The write barrier</text>
  <text x="700" y="450" font-size="12" fill="#444444" text-anchor="middle">adds the catalog to the remembered set, so a minor collection</text>
  <text x="700" y="468" font-size="12" fill="#444444" text-anchor="middle">still finds and keeps the book without scanning every old object.</text>
  <text x="700" y="486" font-size="12" fill="#444444" text-anchor="middle">Objects without a write barrier cannot be treated as old, and</text>
  <text x="700" y="504" font-size="12" fill="#444444" text-anchor="middle">too many of them trigger a major collection.</text>
</svg>
