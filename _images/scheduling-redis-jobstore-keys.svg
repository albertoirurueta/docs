<svg viewBox="0 0 950 570" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="950" height="570" fill="#ffffff"/>
  <text x="475" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What quartz-redis-jobstore 1.2.0 keeps in Redis (every key starts with the configured keyPrefix)</text>
  <text x="475" y="48" font-size="12" fill="#555555" text-anchor="middle">Key names read from the store's source and confirmed with redis-cli SCAN, TYPE and PTTL against redis:8 (Redis 8.10.2)</text>

  <!-- column 1: definitions -->
  <rect x="14" y="70" width="222" height="340" rx="8" fill="#eaf2fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="125" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Definitions (hashes)</text>
  <text x="125" y="112" font-size="10.5" fill="#444444" text-anchor="middle">one hash per object, no TTL</text>
  <rect x="26" y="126" width="198" height="62" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="125" y="146" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">job:{group}:{name}</text>
  <text x="125" y="162" font-size="10" fill="#444444" text-anchor="middle">jobClass, durable, description (if set);</text>
  <text x="125" y="176" font-size="10" fill="#444444" text-anchor="middle">requestsRecovery is never acted on</text>
  <rect x="26" y="198" width="198" height="62" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="125" y="218" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">job_data_map:{group}:{name}</text>
  <text x="125" y="234" font-size="10" fill="#444444" text-anchor="middle">every value stored with toString():</text>
  <text x="125" y="248" font-size="10" fill="#444444" text-anchor="middle">a Long 42 comes back as "42"</text>
  <rect x="26" y="270" width="198" height="62" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="125" y="290" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">trigger:{group}:{name}</text>
  <text x="125" y="306" font-size="10" fill="#444444" text-anchor="middle">trigger_class, cronExpression,</text>
  <text x="125" y="320" font-size="10" fill="#444444" text-anchor="middle">nextFireTime, previousFireTime, ...</text>
  <rect x="26" y="342" width="198" height="46" rx="5" fill="#ffffff" stroke="#1c4b73"/>
  <text x="125" y="362" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">calendar:{name}</text>
  <text x="125" y="378" font-size="10" fill="#444444" text-anchor="middle">class name + JSON</text>

  <!-- column 2: indexes -->
  <rect x="254" y="70" width="222" height="340" rx="8" fill="#f1f7ec" stroke="#4d7c2a" stroke-width="1.4"/>
  <text x="365" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Indexes (sets)</text>
  <text x="365" y="112" font-size="10.5" fill="#444444" text-anchor="middle">membership lists, no TTL</text>
  <text x="365" y="146" font-size="11" fill="#222222" text-anchor="middle">jobs</text>
  <text x="365" y="170" font-size="11" fill="#222222" text-anchor="middle">job_groups</text>
  <text x="365" y="194" font-size="11" fill="#222222" text-anchor="middle">job_group:{group}</text>
  <text x="365" y="218" font-size="11" fill="#222222" text-anchor="middle">job_triggers:{group}:{name}</text>
  <text x="365" y="242" font-size="11" fill="#222222" text-anchor="middle">triggers</text>
  <text x="365" y="266" font-size="11" fill="#222222" text-anchor="middle">trigger_groups</text>
  <text x="365" y="290" font-size="11" fill="#222222" text-anchor="middle">trigger_group:{group}</text>
  <text x="365" y="314" font-size="11" fill="#222222" text-anchor="middle">calendars</text>
  <text x="365" y="338" font-size="11" fill="#222222" text-anchor="middle">blocked_jobs</text>
  <text x="365" y="366" font-size="10" fill="#444444" text-anchor="middle">members are the full key names of</text>
  <text x="365" y="380" font-size="10" fill="#444444" text-anchor="middle">the hashes, prefix included, for example</text>
  <text x="365" y="394" font-size="10" fill="#444444" text-anchor="middle">bookshelf:job:bookshelf:overdueLoanReminders</text>

  <!-- column 3: states -->
  <rect x="494" y="70" width="222" height="340" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.4"/>
  <text x="605" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Trigger state (sorted sets)</text>
  <text x="605" y="112" font-size="10.5" fill="#444444" text-anchor="middle">score = next fire time in epoch ms</text>
  <text x="605" y="146" font-size="11" fill="#222222" text-anchor="middle">waiting_triggers</text>
  <text x="605" y="170" font-size="11" fill="#222222" text-anchor="middle">acquired_triggers</text>
  <text x="605" y="194" font-size="11" fill="#222222" text-anchor="middle">blocked_triggers</text>
  <text x="605" y="218" font-size="11" fill="#222222" text-anchor="middle">paused_triggers</text>
  <text x="605" y="242" font-size="11" fill="#222222" text-anchor="middle">paused_blocked_triggers</text>
  <text x="605" y="266" font-size="11" fill="#222222" text-anchor="middle">completed_triggers</text>
  <text x="605" y="290" font-size="11" fill="#222222" text-anchor="middle">error_triggers</text>
  <text x="605" y="330" font-size="10" fill="#444444" text-anchor="middle">a trigger is a member of exactly one</text>
  <text x="605" y="344" font-size="10" fill="#444444" text-anchor="middle">of them; acquiring one runs ZRANGEBYSCORE</text>
  <text x="605" y="358" font-size="10" fill="#444444" text-anchor="middle">on waiting_triggers, then moves it to</text>
  <text x="605" y="372" font-size="10" fill="#444444" text-anchor="middle">acquired_triggers</text>

  <!-- column 4: locks -->
  <rect x="734" y="70" width="202" height="340" rx="8" fill="#fbeaea" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="835" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Locks and cluster state</text>
  <text x="835" y="112" font-size="10.5" fill="#444444" text-anchor="middle">the only keys that expire</text>
  <rect x="746" y="126" width="178" height="62" rx="5" fill="#ffffff" stroke="#a33a3a"/>
  <text x="835" y="146" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">lock</text>
  <text x="835" y="162" font-size="10" fill="#444444" text-anchor="middle">global mutex, string, random UUID</text>
  <text x="835" y="176" font-size="10" fill="#444444" text-anchor="middle">SET NX PX lockTimeout (30 s)</text>
  <rect x="746" y="198" width="178" height="62" rx="5" fill="#ffffff" stroke="#a33a3a"/>
  <text x="835" y="218" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">trigger_lock:{group}:{name}</text>
  <text x="835" y="234" font-size="10" fill="#444444" text-anchor="middle">only for non-concurrent jobs</text>
  <text x="835" y="248" font-size="10" fill="#444444" text-anchor="middle">value = instance id, TTL 600000 ms</text>
  <rect x="746" y="270" width="178" height="46" rx="5" fill="#ffffff" stroke="#a33a3a"/>
  <text x="835" y="290" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">job_blocked:{group}:{name}</text>
  <text x="835" y="306" font-size="10" fill="#444444" text-anchor="middle">no TTL, for non-concurrent jobs</text>
  <rect x="746" y="326" width="178" height="62" rx="5" fill="#ffffff" stroke="#a33a3a"/>
  <text x="835" y="346" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">last_instance_active_time</text>
  <text x="835" y="362" font-size="10" fill="#444444" text-anchor="middle">hash: instance id to last check-in;</text>
  <text x="835" y="376" font-size="10" fill="#444444" text-anchor="middle">last_triggers_release_time (string)</text>

  <!-- bottom summary -->
  <rect x="14" y="426" width="922" height="124" rx="8" fill="#f4f4f4" stroke="#777777" stroke-width="1.2"/>
  <text x="475" y="450" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Consequences</text>
  <text x="30" y="472" font-size="11.5" fill="#222222">Everything is plain Redis data with no schema and no transactions: each store operation first takes the single lock key, then issues many small commands.</text>
  <text x="30" y="492" font-size="11.5" fill="#222222">Only the two lock key families have a TTL, so an eviction policy other than noeviction can delete scheduling state, and a Redis that restarts empty loses every job.</text>
  <text x="30" y="512" font-size="11.5" fill="#222222">One job with one cron trigger and one running scheduler produced 14 keys in the sample run; the exact set varies with the trigger state.</text>
  <text x="30" y="532" font-size="11.5" fill="#222222">The store is not part of Quartz, so nothing in this layout is a stable contract: it can change between releases of the community project.</text>
</svg>
