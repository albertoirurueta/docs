<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <defs>
    <marker id="isa-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2f6fa8"/>
    </marker>
    <marker id="isa-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">isa and superclass: instances, classes and metaclasses</text>

  <!-- legend -->
  <line x1="230" y1="43" x2="270" y2="43" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#isa-blue)"/>
  <text x="277" y="47" font-size="11.5" fill="#2f6fa8">isa</text>
  <line x1="330" y1="43" x2="370" y2="43" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>
  <text x="377" y="47" font-size="11.5" fill="#4a7a3a">superclass</text>

  <!-- column headers -->
  <text x="110" y="78" font-size="12.5" font-weight="bold" fill="#5b7089" text-anchor="middle">Instances</text>
  <text x="350" y="78" font-size="12.5" font-weight="bold" fill="#5b7089" text-anchor="middle">Classes</text>
  <text x="600" y="78" font-size="12.5" font-weight="bold" fill="#5b7089" text-anchor="middle">Metaclasses</text>

  <!-- instance -->
  <rect x="35" y="290" width="150" height="62" rx="6" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="110" y="312" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">a Circle instance</text>
  <text x="110" y="330" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#5b7089" text-anchor="middle">isa &#8594;</text>
  <text x="110" y="345" font-size="10" fill="#5b7089" text-anchor="middle">ivars follow the isa</text>

  <!-- classes column -->
  <rect x="265" y="290" width="170" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="350" y="312" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">Circle (class)</text>
  <text x="350" y="331" font-size="10.5" fill="#14395c" text-anchor="middle">instance methods: -area, -draw</text>
  <text x="350" y="345" font-size="10" fill="#5b7089" text-anchor="middle">ivar layout, method cache</text>

  <rect x="265" y="190" width="170" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="350" y="212" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">Shape (class)</text>
  <text x="350" y="231" font-size="10.5" fill="#14395c" text-anchor="middle">instance methods: -describe</text>
  <text x="350" y="245" font-size="10" fill="#5b7089" text-anchor="middle">superclass of Circle</text>

  <rect x="265" y="90" width="170" height="62" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2.5"/>
  <text x="350" y="112" font-size="13" font-weight="bold" fill="#14395c" text-anchor="middle">NSObject (root class)</text>
  <text x="350" y="131" font-size="10.5" fill="#14395c" text-anchor="middle">-isEqual:, -hash, -description</text>
  <text x="350" y="145" font-size="10" fill="#5b7089" text-anchor="middle">superclass is nil</text>

  <!-- metaclasses column -->
  <rect x="505" y="290" width="185" height="62" rx="6" fill="#f6e9cf" stroke="#b08a34" stroke-width="2"/>
  <text x="597" y="312" font-size="12.5" font-weight="bold" fill="#6b4f0d" text-anchor="middle">Circle metaclass</text>
  <text x="597" y="331" font-size="10.5" fill="#6b4f0d" text-anchor="middle">class methods: +circleWithRadius:</text>
  <text x="597" y="345" font-size="10" fill="#8a7340" text-anchor="middle">this is where "+" methods live</text>

  <rect x="505" y="190" width="185" height="62" rx="6" fill="#f6e9cf" stroke="#b08a34" stroke-width="2"/>
  <text x="597" y="212" font-size="12.5" font-weight="bold" fill="#6b4f0d" text-anchor="middle">Shape metaclass</text>
  <text x="597" y="231" font-size="10.5" fill="#6b4f0d" text-anchor="middle">class methods: +shape</text>

  <rect x="505" y="90" width="185" height="62" rx="6" fill="#f6e9cf" stroke="#b08a34" stroke-width="2.5"/>
  <text x="597" y="112" font-size="12.5" font-weight="bold" fill="#6b4f0d" text-anchor="middle">NSObject metaclass</text>
  <text x="597" y="131" font-size="10.5" fill="#6b4f0d" text-anchor="middle">+alloc, +class, +new</text>
  <text x="597" y="145" font-size="10" font-weight="bold" fill="#8a7340" text-anchor="middle">the root metaclass</text>

  <!-- isa arrows: instance -> Circle -->
  <path d="M188 321 L260 321" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#isa-blue)"/>
  <!-- Circle -> Circle metaclass -->
  <path d="M438 321 L500 321" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#isa-blue)"/>
  <!-- Shape -> Shape metaclass -->
  <path d="M438 221 L500 221" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#isa-blue)"/>
  <!-- NSObject -> NSObject metaclass -->
  <path d="M438 121 L500 121" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#isa-blue)"/>

  <!-- metaclass isa: Circle meta -> root meta, Shape meta -> root meta -->
  <path d="M695 310 C 735 300, 735 160, 697 128" stroke="#2f6fa8" stroke-width="2" fill="none" marker-end="url(#isa-blue)"/>
  <path d="M695 212 C 722 200, 722 160, 697 133" stroke="#2f6fa8" stroke-width="2" fill="none" marker-end="url(#isa-blue)"/>

  <!-- root metaclass isa -> itself -->
  <path d="M560 88 C 545 60, 640 60, 632 87" stroke="#2f6fa8" stroke-width="2" fill="none" marker-end="url(#isa-blue)"/>
  <text x="597" y="62" font-size="10.5" font-weight="bold" fill="#2f6fa8" text-anchor="middle">isa points to itself</text>

  <!-- superclass arrows -->
  <path d="M350 287 L350 256" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>
  <path d="M350 187 L350 156" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>
  <path d="M597 287 L597 256" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>
  <path d="M597 187 L597 156" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>

  <!-- root metaclass superclass -> NSObject class -->
  <path d="M502 105 L440 105" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#isa-green)"/>
  <text x="471" y="98" font-size="9.5" fill="#4a7a3a" text-anchor="middle">superclass</text>

  <!-- notes -->
  <text x="380" y="385" font-size="11.5" fill="#5b7089" text-anchor="middle">Sending [circle area] follows circle's isa into the Circle class and searches its instance-method list, then up the</text>
  <text x="380" y="401" font-size="11.5" fill="#5b7089" text-anchor="middle">green superclass chain. Sending [Circle circleWithRadius:] follows the Circle CLASS's isa into its metaclass</text>
  <text x="380" y="417" font-size="11.5" fill="#5b7089" text-anchor="middle">and searches there, then up the metaclass chain &#8212; which is why class methods are inherited just like instance ones.</text>
  <text x="380" y="441" font-size="11.5" fill="#5b7089" text-anchor="middle">The root metaclass's superclass is the NSObject CLASS. That single link is why [NSString respondsToSelector:...]</text>
  <text x="380" y="457" font-size="11.5" fill="#5b7089" text-anchor="middle">works: the metaclass search falls off the top into NSObject's instance methods. Use object_getClass(), not [x class],</text>
  <text x="380" y="473" font-size="11.5" fill="#5b7089" text-anchor="middle">to reach a metaclass &#8212; [cls class] returns the class itself, not its metaclass.</text>
</svg>
