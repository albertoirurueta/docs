<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Anatomy of an Antora UI bundle and where each part ends up</title>
  <desc id="d">The folders layouts, partials and helpers are combined with the UI model into HTML pages. The folders css, js, img and font are copied under the UI output directory. The ui.yml file lists static files promoted to the site root.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" rx="14" fill="#1e293b"/>
  <text x="30" y="34" font-size="15" font-weight="bold" fill="#f1f5f9">UI bundle (ZIP or directory)</text>
  <text x="440" y="34" font-size="15" font-weight="bold" fill="#f1f5f9">Published site (build/site)</text>

  <rect x="30" y="50" width="250" height="60" rx="8" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="46" y="75" font-size="14" font-weight="bold" fill="#ffffff">layouts/</text>
  <text x="46" y="95" font-size="12" fill="#e0e7ff">default.hbs (required), 404.hbs</text>

  <rect x="30" y="122" width="250" height="52" rx="8" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="46" y="146" font-size="14" font-weight="bold" fill="#ffffff">partials/</text>
  <text x="46" y="164" font-size="12" fill="#e0e7ff">header, nav, toc, footer, ...</text>

  <rect x="30" y="186" width="250" height="52" rx="8" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="46" y="210" font-size="14" font-weight="bold" fill="#ffffff">helpers/</text>
  <text x="46" y="228" font-size="12" fill="#e0e7ff">JavaScript functions called from templates</text>

  <rect x="30" y="256" width="250" height="100" rx="8" fill="#047857" stroke="#6ee7b7"/>
  <text x="46" y="280" font-size="14" font-weight="bold" fill="#ffffff">css/  js/  img/  font/</text>
  <text x="46" y="300" font-size="12" fill="#d1fae5">stylesheets, scripts, images, fonts</text>
  <text x="46" y="318" font-size="12" fill="#d1fae5">any other folder or file that is</text>
  <text x="46" y="334" font-size="12" fill="#d1fae5">not recognized is also static</text>

  <rect x="30" y="368" width="250" height="52" rx="8" fill="#b45309" stroke="#fcd34d"/>
  <text x="46" y="392" font-size="14" font-weight="bold" fill="#ffffff">ui.yml (optional)</text>
  <text x="46" y="410" font-size="12" fill="#fef3c7">static_files: paths and globs</text>

  <rect x="440" y="50" width="290" height="124" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="456" y="75" font-size="14" font-weight="bold" fill="#ffffff">HTML pages</text>
  <text x="456" y="96" font-size="12" fill="#e2e8f0">index.html, pocket-units/2.0/index.html, 404.html</text>
  <text x="456" y="116" font-size="12" fill="#e2e8f0">Templates are combined with the UI model</text>
  <text x="456" y="134" font-size="12" fill="#e2e8f0">at build time. The template folders themselves</text>
  <text x="456" y="152" font-size="12" fill="#e2e8f0">are not copied to the site.</text>

  <rect x="440" y="256" width="290" height="100" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="456" y="280" font-size="14" font-weight="bold" fill="#ffffff">_/  (ui.output_dir)</text>
  <text x="456" y="300" font-size="12" fill="#e2e8f0">_/css/site.css   _/js/site.js</text>
  <text x="456" y="318" font-size="12" fill="#e2e8f0">_/img/...   _/font/...</text>
  <text x="456" y="336" font-size="12" fill="#e2e8f0">pages reach it through uiRootPath</text>

  <rect x="440" y="368" width="290" height="52" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="456" y="392" font-size="14" font-weight="bold" fill="#ffffff">Site root</text>
  <text x="456" y="410" font-size="12" fill="#e2e8f0">.nojekyll, favicon.ico (promoted files)</text>

  <path d="M280 80 C 360 80 360 100 438 100" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M280 148 C 360 148 360 120 438 120" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M280 212 C 360 212 360 140 438 140" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M280 306 L438 306" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M280 394 L438 394" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="252" font-size="11" fill="#cbd5e1">copied as is</text>
  <text x="300" y="384" font-size="11" fill="#cbd5e1">promoted</text>
</svg>
