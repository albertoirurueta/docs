<svg viewBox="0 0 860 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Bookshelf architecture</title>
  <desc id="d">Clients (browsers, crawlers and API clients) reach a CDN or host, then the Next.js server. Inside the server, proxy.ts runs first, then the App Router serves the public shop route group, the signed-in account route group, the modal slot, Route Handlers and Server Actions. Pages and actions use a server-only Data Access Layer with Auth.js and the cache layers. Behind the server are the Bookshelf data source, an optional back-end API (FastAPI, NestJS or Django) reached as a backend for frontend, and the OAuth provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="660" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: the Next.js App Router front end built across this section</text>
  <text x="430" y="47" font-size="12" fill="#555555" text-anchor="middle">arrows point in the direction of the request; the route groups, slot and files are those of the final project layout</text>

  <!-- Clients -->
  <rect x="30" y="64" width="250" height="74" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="155" y="86" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle">Browser</text>
  <text x="155" y="105" font-size="12" fill="#333333" text-anchor="middle">HTML first paint, then hydration</text>
  <text x="155" y="122" font-size="12" fill="#333333" text-anchor="middle">Client Components, Link, router cache</text>

  <rect x="305" y="64" width="250" height="74" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="430" y="86" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle">Crawlers and link previews</text>
  <text x="430" y="105" font-size="12" fill="#333333" text-anchor="middle">sitemap.ts, robots.ts</text>
  <text x="430" y="122" font-size="12" fill="#333333" text-anchor="middle">metadata and OG images</text>

  <rect x="580" y="64" width="250" height="74" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="705" y="86" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle">API clients</text>
  <text x="705" y="105" font-size="12" fill="#333333" text-anchor="middle">curl, mobile apps</text>
  <text x="705" y="122" font-size="12" fill="#333333" text-anchor="middle">GET /api/books?q=dune (JSON)</text>

  <line x1="155" y1="138" x2="155" y2="162" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="430" y1="138" x2="430" y2="162" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="705" y1="138" x2="705" y2="162" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CDN / host -->
  <rect x="30" y="164" width="800" height="40" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="430" y="189" font-size="13" fill="#222222" text-anchor="middle"><tspan font-weight="bold">CDN or host</tspan>: static HTML and immutable assets; Docker standalone server, or a static export of the catalogue</text>

  <line x1="430" y1="204" x2="430" y2="228" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Next.js server -->
  <rect x="30" y="230" width="800" height="300" fill="#f7fbf8" stroke="#1e6b36" stroke-width="1.8"/>
  <text x="44" y="250" font-size="14" font-weight="bold" fill="#14411f">Next.js server (Node.js process)</text>

  <rect x="50" y="262" width="760" height="38" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="430" y="286" font-size="13" fill="#5c3500" text-anchor="middle"><tspan font-weight="bold">proxy.ts</tspan>: locale detection and redirect to /en or /es, optimistic session-cookie check</text>

  <line x1="430" y1="300" x2="430" y2="318" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="50" y="334" font-size="12" font-weight="bold" fill="#14411f">App Router: app/[locale]/ ...</text>

  <rect x="50" y="342" width="180" height="88" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="140" y="361" font-size="13" font-weight="bold" fill="#14411f" text-anchor="middle">(shop)</text>
  <text x="140" y="379" font-size="11.5" fill="#333333" text-anchor="middle">catalogue and search</text>
  <text x="140" y="395" font-size="11.5" fill="#333333" text-anchor="middle">book pages: SSG, ISR</text>
  <text x="140" y="411" font-size="11.5" fill="#333333" text-anchor="middle">or 'use cache'</text>

  <rect x="240" y="342" width="180" height="88" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="330" y="361" font-size="13" font-weight="bold" fill="#14411f" text-anchor="middle">(account)</text>
  <text x="330" y="379" font-size="11.5" fill="#333333" text-anchor="middle">header and my reviews</text>
  <text x="330" y="395" font-size="11.5" fill="#333333" text-anchor="middle">dynamic, cookies()</text>
  <text x="330" y="411" font-size="11.5" fill="#333333" text-anchor="middle">streamed with Suspense</text>

  <rect x="430" y="342" width="180" height="88" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="520" y="361" font-size="13" font-weight="bold" fill="#14411f" text-anchor="middle">@modal</text>
  <text x="520" y="379" font-size="11.5" fill="#333333" text-anchor="middle">(.)books/[id]</text>
  <text x="520" y="395" font-size="11.5" fill="#333333" text-anchor="middle">intercepted cover modal</text>
  <text x="520" y="411" font-size="11.5" fill="#333333" text-anchor="middle">parallel-route slot</text>

  <rect x="620" y="342" width="190" height="40" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="715" y="359" font-size="12.5" font-weight="bold" fill="#14411f" text-anchor="middle">Route Handlers</text>
  <text x="715" y="375" font-size="11.5" fill="#333333" text-anchor="middle">app/api/books/route.ts</text>

  <rect x="620" y="390" width="190" height="40" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.5"/>
  <text x="715" y="407" font-size="12.5" font-weight="bold" fill="#14411f" text-anchor="middle">Server Actions</text>
  <text x="715" y="423" font-size="11.5" fill="#333333" text-anchor="middle">reviews: create, edit, updateTag</text>

  <line x1="425" y1="430" x2="425" y2="452" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="50" y="454" width="370" height="60" fill="#f3eefb" stroke="#5b3a91" stroke-width="1.5"/>
  <text x="235" y="474" font-size="13" font-weight="bold" fill="#3a2360" text-anchor="middle">lib/dal.ts: Data Access Layer (server-only)</text>
  <text x="235" y="492" font-size="11.5" fill="#333333" text-anchor="middle">Auth.js v5 auth(), requireUser(), DTOs</text>
  <text x="235" y="507" font-size="11.5" fill="#333333" text-anchor="middle">forbidden() and unauthorized()</text>

  <rect x="440" y="454" width="370" height="60" fill="#f3eefb" stroke="#5b3a91" stroke-width="1.5"/>
  <text x="625" y="474" font-size="13" font-weight="bold" fill="#3a2360" text-anchor="middle">Cache layers</text>
  <text x="625" y="492" font-size="11.5" fill="#333333" text-anchor="middle">Cache Components or the previous model</text>
  <text x="625" y="507" font-size="11.5" fill="#333333" text-anchor="middle">cacheLife, cacheTag, revalidateTag, updateTag</text>

  <line x1="160" y1="514" x2="160" y2="552" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="430" y1="514" x2="430" y2="552" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="700" y1="514" x2="700" y2="552" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Backing services -->
  <rect x="30" y="554" width="250" height="66" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <text x="155" y="576" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf data</text>
  <text x="155" y="595" font-size="11.5" fill="#333333" text-anchor="middle">books, authors, reviews</text>
  <text x="155" y="610" font-size="11.5" fill="#333333" text-anchor="middle">read through lib/books.ts</text>

  <rect x="305" y="554" width="250" height="66" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <text x="430" y="576" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Back-end API (optional BFF)</text>
  <text x="430" y="595" font-size="11.5" fill="#333333" text-anchor="middle">the FastAPI, NestJS or Django</text>
  <text x="430" y="610" font-size="11.5" fill="#333333" text-anchor="middle">Bookshelf, proxied server-side</text>

  <rect x="580" y="554" width="250" height="66" fill="#f4f4f4" stroke="#444444" stroke-width="1.5"/>
  <text x="705" y="576" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Identity provider</text>
  <text x="705" y="595" font-size="11.5" fill="#333333" text-anchor="middle">OAuth sign-in for Auth.js</text>
  <text x="705" y="610" font-size="11.5" fill="#333333" text-anchor="middle">secrets only in server env vars</text>

  <text x="430" y="646" font-size="11.5" fill="#555555" text-anchor="middle">Also part of the scenario: next/image covers, next/font, Tailwind v4, i18n messages, instrumentation.ts, Vitest and Playwright tests</text>
</svg>
