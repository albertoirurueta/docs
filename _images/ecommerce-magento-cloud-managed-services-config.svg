<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How the endpoints and credentials of the managed services reach Magento</title>
  <desc id="d">A left to right flow. In AWS Secrets Manager the single secret pocketcoffee/prod/magento holds the passwords and AUTH tokens; OpenTofu creates the services and their endpoints. An ExternalSecret copies the secret into the Kubernetes Secret pocketcoffee-magento and the Helm values put the endpoints into a ConfigMap. Both reach every pod as environment variables. The env.php template in the ConfigMap pocketcoffee-env-php, mounted read-only, reads them with getenv and builds the system, cache, session and queue nodes. Magento reads that file at run time. Below the flow, two side paths are crossed out for the cluster: bin/magento setup:config:set, which writes env.php and is used only in the writable throwaway app/etc of the install Job or on a laptop to see the shape, and the Admin configuration or config:set, which would write the OpenSearch password in clear text into core_config_data. The search options exist on setup:install but not on setup:config:set, so the search engine is configured through the system node of env.php.</desc>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One template reads the environment; nothing secret is written in a file</text>

  <rect x="24" y="70" width="170" height="170" rx="10" fill="#3d5266"/>
  <text x="38" y="96" font-size="13.5" font-weight="bold" fill="#f2f5f8">AWS</text>
  <text x="38" y="118" font-size="12" fill="#f2f5f8">Secrets Manager</text>
  <text x="38" y="135" font-size="12" fill="#f2f5f8">pocketcoffee/prod/magento</text>
  <text x="38" y="159" font-size="12" fill="#9fd3c7">passwords, AUTH tokens</text>
  <text x="38" y="190" font-size="12" fill="#f2f5f8">OpenTofu outputs</text>
  <text x="38" y="207" font-size="12" fill="#9fd3c7">endpoints of the services</text>

  <rect x="232" y="70" width="170" height="170" rx="10" fill="#4d7c5a"/>
  <text x="246" y="96" font-size="13.5" font-weight="bold" fill="#f2f5f8">Kubernetes</text>
  <text x="246" y="118" font-size="12" fill="#f2f5f8">ExternalSecret</text>
  <text x="246" y="135" font-size="12" fill="#f2f5f8">Secret pocketcoffee-magento</text>
  <text x="246" y="172" font-size="12" fill="#f2f5f8">Helm values</text>
  <text x="246" y="189" font-size="12" fill="#f2f5f8">ConfigMap with the hosts</text>
  <text x="246" y="206" font-size="12" fill="#f2f5f8">and ports (not secret)</text>

  <rect x="440" y="70" width="170" height="170" rx="10" fill="#3f6e9a"/>
  <text x="454" y="96" font-size="13.5" font-weight="bold" fill="#f2f5f8">Environment</text>
  <text x="454" y="118" font-size="12" fill="#f2f5f8">MAGENTO_OPENSEARCH_*</text>
  <text x="454" y="135" font-size="12" fill="#f2f5f8">MAGENTO_VALKEY_CACHE_*</text>
  <text x="454" y="152" font-size="12" fill="#f2f5f8">MAGENTO_VALKEY_SESSION_*</text>
  <text x="454" y="169" font-size="12" fill="#f2f5f8">MAGENTO_AMQP_*</text>
  <text x="454" y="200" font-size="12" fill="#9fd3c7">envFrom on every pod</text>

  <rect x="648" y="70" width="170" height="170" rx="10" fill="#7a5c3a"/>
  <text x="662" y="96" font-size="13.5" font-weight="bold" fill="#f2f5f8">app/etc/env.php</text>
  <text x="662" y="118" font-size="12" fill="#f2f5f8">ConfigMap env-php,</text>
  <text x="662" y="135" font-size="12" fill="#f2f5f8">read-only subPath</text>
  <text x="662" y="159" font-size="12" fill="#f2f5f8">getenv() builds the</text>
  <text x="662" y="176" font-size="12" fill="#f2f5f8">system, cache, session</text>
  <text x="662" y="193" font-size="12" fill="#f2f5f8">and queue nodes</text>

  <rect x="850" y="70" width="90" height="170" rx="10" fill="#2f4a44"/>
  <text x="862" y="96" font-size="13.5" font-weight="bold" fill="#f2f5f8">Magento</text>
  <text x="862" y="118" font-size="12" fill="#f2f5f8">reads the</text>
  <text x="862" y="135" font-size="12" fill="#f2f5f8">file per</text>
  <text x="862" y="152" font-size="12" fill="#f2f5f8">request</text>

  <line x1="194" y1="155" x2="230" y2="155" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="402" y1="155" x2="438" y2="155" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="155" x2="646" y2="155" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="818" y1="155" x2="848" y2="155" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="24" y="280" width="450" height="190" rx="10" fill="#33485c"/>
  <text x="40" y="306" font-size="13.5" font-weight="bold" fill="#f4b860">setup:config:set (and setup:install)</text>
  <text x="40" y="330" font-size="12" fill="#f2f5f8">Writes env.php. On the cluster the file is read-only, so the command</text>
  <text x="40" y="347" font-size="12" fill="#f2f5f8">runs only in the writable throwaway app/etc of the install Job,</text>
  <text x="40" y="364" font-size="12" fill="#f2f5f8">or on a laptop, to see the shape the template must produce.</text>
  <text x="40" y="388" font-size="12" fill="#f2f5f8">Cache, session and queue options exist on setup:config:set.</text>
  <text x="40" y="405" font-size="12" fill="#f2f5f8">Search options exist only on setup:install.</text>
  <text x="40" y="429" font-size="12" fill="#9fd3c7">No option sets TLS for Valkey: tls:// goes in the host value.</text>
  <text x="40" y="446" font-size="12" fill="#9fd3c7">The queue has --amqp-ssl and --amqp-ssl-options.</text>

  <rect x="500" y="280" width="436" height="190" rx="10" fill="#33485c"/>
  <text x="516" y="306" font-size="13.5" font-weight="bold" fill="#f4b860">Not for the secrets: Admin and config:set</text>
  <text x="516" y="330" font-size="12" fill="#f2f5f8">They write core_config_data, which is in the database and in its</text>
  <text x="516" y="347" font-size="12" fill="#f2f5f8">backups. The OpenSearch password field is plain text there.</text>
  <text x="516" y="371" font-size="12" fill="#f2f5f8">The system node of env.php overrides the database value and</text>
  <text x="516" y="388" font-size="12" fill="#f2f5f8">locks the field in the Admin, so the value is set in one place.</text>
  <text x="516" y="412" font-size="12" fill="#9fd3c7">config.php (baked into the image) must hold no host, user or password:</text>
  <text x="516" y="429" font-size="12" fill="#9fd3c7">those paths are marked sensitive and belong in env.php (or the environment).</text>
  <line x1="480" y1="375" x2="498" y2="375" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
</svg>
