<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="JMeter distributed topology: one controller sends the plan over RMI with TLS to several workers running jmeter-server, every worker runs the whole plan against the Bookshelf API, and sample results flow back to the controller, which writes the results file and the dashboard" font-family="sans-serif" font-size="13" fill="currentColor">
<defs>
<marker id="dtA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
<marker id="dtB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="dtC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
</defs>
<text x="24" y="30" font-size="16" font-weight="bold">JMeter distributed testing: one controller, N workers, one system under test</text>
<text x="24" y="50" font-size="12" opacity="0.75">The controller sends the plan to every worker; each worker runs the whole plan, so the load is threads x workers.</text>
<text x="24" y="66" font-size="12" opacity="0.75">Sample results travel back to the controller, which is the only node that writes the results file and the dashboard.</text>

<!-- Controller -->
<rect x="24" y="150" width="230" height="300" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.8"/>
<text x="40" y="176" font-size="14" font-weight="bold">Controller (client)</text>
<text x="40" y="194" font-size="12" opacity="0.8">JMeter 5.6.3, CLI mode</text>
<text x="40" y="222" font-family="monospace" font-size="12">jmeter -n -t plan.jmx</text>
<text x="40" y="240" font-family="monospace" font-size="12">  -R w1,w2,...,wN</text>
<text x="40" y="258" font-family="monospace" font-size="12">  -Gthreads=25 -X</text>
<text x="40" y="276" font-family="monospace" font-size="12">  -l results.jtl -e -o report</text>
<text x="40" y="306" font-size="12">holds: plan, rmi_keystore.jks</text>
<text x="40" y="324" font-size="12">sets: mode (sample sender)</text>
<text x="40" y="342" font-size="12">writes: results.jtl, report/</text>
<rect x="40" y="360" width="198" height="72" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
<text x="50" y="380" font-size="12" font-weight="bold">inbound callback ports</text>
<text x="50" y="398" font-family="monospace" font-size="11">client.rmi.localport</text>
<text x="50" y="414" font-size="11" opacity="0.8">0 = random (default); base+1, base+2</text>

<!-- Workers -->
<g>
<rect x="380" y="96" width="250" height="112" rx="10" fill="#8e8e93" fill-opacity="0.12" stroke="#8e8e93"/>
<text x="394" y="118" font-size="14" font-weight="bold">Worker 1 (server)</text>
<text x="394" y="138" font-family="monospace" font-size="12">jmeter-server</text>
<text x="394" y="156" font-size="12">registry :1099 (server_port)</text>
<text x="394" y="172" font-size="12">engine :server.rmi.localport</text>
<text x="394" y="194" font-size="11" opacity="0.8">same JMeter, Java, plugins, CSV files</text>
</g>
<g>
<rect x="380" y="236" width="250" height="112" rx="10" fill="#8e8e93" fill-opacity="0.12" stroke="#8e8e93"/>
<text x="394" y="258" font-size="14" font-weight="bold">Worker 2 (server)</text>
<text x="394" y="278" font-family="monospace" font-size="12">jmeter-server</text>
<text x="394" y="296" font-size="12">registry :1099 (server_port)</text>
<text x="394" y="312" font-size="12">engine :server.rmi.localport</text>
<text x="394" y="334" font-size="11" opacity="0.8">same JMeter, Java, plugins, CSV files</text>
</g>
<text x="505" y="370" font-size="16" text-anchor="middle" opacity="0.7">...</text>
<g>
<rect x="380" y="384" width="250" height="112" rx="10" fill="#8e8e93" fill-opacity="0.12" stroke="#8e8e93"/>
<text x="394" y="406" font-size="14" font-weight="bold">Worker N (server)</text>
<text x="394" y="426" font-family="monospace" font-size="12">jmeter-server</text>
<text x="394" y="444" font-size="12">registry :1099 (server_port)</text>
<text x="394" y="460" font-size="12">engine :server.rmi.localport</text>
<text x="394" y="482" font-size="11" opacity="0.8">same JMeter, Java, plugins, CSV files</text>
</g>

<!-- Controller to workers: plan and commands (blue) -->
<line x1="254" y1="230" x2="376" y2="132" stroke="#3b82f6" stroke-width="2" marker-end="url(#dtA)"/>
<line x1="254" y1="250" x2="376" y2="272" stroke="#3b82f6" stroke-width="2" marker-end="url(#dtA)"/>
<line x1="254" y1="270" x2="376" y2="420" stroke="#3b82f6" stroke-width="2" marker-end="url(#dtA)"/>
<!-- Workers to controller: results (amber, dashed) -->
<line x1="376" y1="190" x2="258" y2="380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dtB)"/>
<line x1="376" y1="330" x2="258" y2="396" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dtB)"/>
<line x1="376" y1="474" x2="258" y2="414" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dtB)"/>

<!-- SUT -->
<rect x="760" y="150" width="176" height="300" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.8"/>
<text x="776" y="176" font-size="14" font-weight="bold">System under test</text>
<text x="776" y="194" font-size="12" opacity="0.8">Bookshelf API</text>
<text x="776" y="224" font-family="monospace" font-size="12">GET /api/books</text>
<text x="776" y="242" font-family="monospace" font-size="12">POST /api/auth/login</text>
<text x="776" y="260" font-family="monospace" font-size="12">POST /api/loans</text>
<text x="776" y="294" font-size="12">receives the sum of</text>
<text x="776" y="310" font-size="12">all workers' traffic:</text>
<text x="776" y="334" font-size="13" font-weight="bold">N x threads users</text>
<text x="776" y="364" font-size="11" opacity="0.8">workers on the same network</text>
<text x="776" y="380" font-size="11" opacity="0.8">segment as the SUT; never on</text>
<text x="776" y="396" font-size="11" opacity="0.8">the SUT host itself</text>

<!-- Workers to SUT (green) -->
<line x1="630" y1="152" x2="756" y2="250" stroke="#10b981" stroke-width="2.5" marker-end="url(#dtC)"/>
<line x1="630" y1="292" x2="756" y2="300" stroke="#10b981" stroke-width="2.5" marker-end="url(#dtC)"/>
<line x1="630" y1="440" x2="756" y2="350" stroke="#10b981" stroke-width="2.5" marker-end="url(#dtC)"/>

<!-- Legend -->
<g font-size="12">
<line x1="24" y1="530" x2="64" y2="530" stroke="#3b82f6" stroke-width="2" marker-end="url(#dtA)"/>
<text x="74" y="534">Plan, -G properties and start/stop/exit commands: RMI, TLS with client auth (default since 4.0)</text>
<line x1="24" y1="556" x2="64" y2="556" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dtB)"/>
<text x="74" y="560">Sample results: StrippedBatch by default (every 100 samples or 60 s, response bodies removed)</text>
<line x1="24" y1="582" x2="64" y2="582" stroke="#10b981" stroke-width="2.5" marker-end="url(#dtC)"/>
<text x="74" y="586">Load: each worker runs every Thread Group of the plan against the system under test</text>
<text x="24" y="618" font-size="12" opacity="0.8">Firewall: controller to worker on 1099 and server.rmi.localport; worker to controller on the client.rmi.localport range.</text>
<text x="24" y="636" font-size="12" opacity="0.8">Behind NAT, each node advertises the address set in java.rmi.server.hostname, which the other side must be able to reach.</text>
</g>
</svg>
