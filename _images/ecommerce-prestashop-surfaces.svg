<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <title id="t">The four ways to extend a self-hosted PrestaShop shop</title>
  <desc id="d">Modules, themes, APIs and the command line surround the PrestaShop core, which runs on a web server, PHP and a database that you operate. A strip below lists the project resources around the core: developer documentation, GitHub repositories, the Addons marketplace and the Friends-of-Presta advisories.</desc>

  <rect x="285" y="160" width="230" height="150" rx="14" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-weight="bold" font-size="16">PrestaShop core</text>
  <text x="400" y="214" text-anchor="middle">legacy classes and ObjectModel</text>
  <text x="400" y="234" text-anchor="middle">Symfony 6.4 back office, CQRS</text>
  <text x="400" y="254" text-anchor="middle">hooks, Smarty and Twig</text>
  <text x="400" y="280" text-anchor="middle" font-size="12" opacity="0.85">runs on your PHP, web server</text>
  <text x="400" y="298" text-anchor="middle" font-size="12" opacity="0.85">and MySQL or MariaDB</text>

  <rect x="20" y="20" width="340" height="100" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="46" text-anchor="middle" font-weight="bold">1. Modules</text>
  <text x="190" y="68" text-anchor="middle">main class, hooks, services.yml, controllers</text>
  <text x="190" y="88" text-anchor="middle">own tables, payment and carrier modules</text>
  <text x="190" y="108" text-anchor="middle" font-size="12" opacity="0.85">installed from a zip, Composer or Addons</text>

  <rect x="440" y="20" width="340" height="100" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="610" y="46" text-anchor="middle" font-weight="bold">2. Themes</text>
  <text x="610" y="68" text-anchor="middle">Hummingbird (default) or Classic, theme.yml</text>
  <text x="610" y="88" text-anchor="middle">Smarty templates, child themes</text>
  <text x="610" y="108" text-anchor="middle" font-size="12" opacity="0.85">module templates can be overridden by the theme</text>

  <rect x="20" y="350" width="340" height="100" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="376" text-anchor="middle" font-weight="bold">3. APIs</text>
  <text x="190" y="398" text-anchor="middle">Webservice at /api (key as Basic user)</text>
  <text x="190" y="418" text-anchor="middle">Admin API at /admin-api (OAuth2 client credentials)</text>
  <text x="190" y="438" text-anchor="middle" font-size="12" opacity="0.85">XML or JSON, ships with every 9.x install</text>

  <rect x="440" y="350" width="340" height="100" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="610" y="376" text-anchor="middle" font-weight="bold">4. Command line and overrides</text>
  <text x="610" y="398" text-anchor="middle">bin/console prestashop:* commands</text>
  <text x="610" y="418" text-anchor="middle">override/ classes (legacy, last resort)</text>
  <text x="610" y="438" text-anchor="middle" font-size="12" opacity="0.85">feature flags, API clients, module lifecycle</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M190 120 L190 235 L285 235"/>
    <path d="M610 120 L610 235 L515 235"/>
    <path d="M190 350 L190 245 L285 245"/>
    <path d="M610 350 L610 245 L515 245"/>
  </g>

  <rect x="20" y="470" width="760" height="38" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="400" y="494" text-anchor="middle" font-size="13">Around the core: developer docs, GitHub repositories, Addons marketplace, Friends-of-Presta advisories</text>
</svg>
