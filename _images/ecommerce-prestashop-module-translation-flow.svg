<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a module wording is translated at runtime and exported</title>
  <desc id="d">Left to right. Wordings written in PHP with trans, in Smarty with the l tag and a d parameter, and in Twig with the trans filter are looked up by the translator in three places in this order: rows of the ps_translation table, then the XLF files in the module translations folder, then the source text itself. The export command reads the same code and the catalogue and writes one XLF file per domain for a locale. A second lane shows the classic system: the l method and the l tag with a mod parameter read translations/es.php, a PHP dictionary keyed by an md5 hash.</desc>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">New system (domains, XLF): used when the module opts in</text>

  <!-- code column -->
  <rect x="40" y="52" width="300" height="40" rx="6" fill="#3d5266"/>
  <rect x="40" y="100" width="300" height="40" rx="6" fill="#3d5266"/>
  <rect x="40" y="148" width="300" height="40" rx="6" fill="#3d5266"/>
  <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#f2f5f8">
    <text x="50" y="76">$this-&gt;trans('Roast date', [], $d)</text>
    <text x="50" y="124">{l s='Roast date' d='Modules.Pcfe45.Shop'}</text>
    <text x="50" y="172">{{ 'Next roast'|trans }}</text>
  </g>
  <text x="40" y="208" font-size="12.5" fill="#f2f5f8">PHP, Smarty and Twig call the same translator</text>

  <!-- translator -->
  <rect x="390" y="60" width="150" height="128" rx="8" fill="#33485c" stroke="#f2f5f8" stroke-width="1.5"/>
  <text x="465" y="96" font-size="15" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Translator</text>
  <text x="465" y="120" font-size="12.5" fill="#f2f5f8" text-anchor="middle">locale es-ES</text>
  <text x="465" y="140" font-size="12.5" fill="#f2f5f8" text-anchor="middle">domain</text>
  <text x="465" y="158" font-size="12.5" fill="#f2f5f8" text-anchor="middle">ModulesPcfe45Shop</text>

  <g fill="none" stroke="#f2f5f8" stroke-width="1.8">
    <path d="M342 72 L388 100" marker-end="url(#a)"/>
    <path d="M342 120 L388 120" marker-end="url(#a)"/>
    <path d="M342 168 L388 140" marker-end="url(#a)"/>
  </g>

  <!-- lookup order -->
  <rect x="590" y="52" width="330" height="40" rx="6" fill="#3d5266"/>
  <rect x="590" y="108" width="330" height="40" rx="6" fill="#3d5266"/>
  <rect x="590" y="164" width="330" height="40" rx="6" fill="#3d5266"/>
  <g font-size="13" fill="#f2f5f8">
    <text x="602" y="77"><tspan font-weight="bold" fill="#f4b860">1</tspan>  ps_translation row (edited in the back office)</text>
    <text x="602" y="133"><tspan font-weight="bold" fill="#f4b860">2</tspan>  pcfe45/translations/es-ES/*.xlf</text>
    <text x="602" y="189"><tspan font-weight="bold" fill="#f4b860">3</tspan>  the source text, as written in the code</text>
  </g>
  <g fill="none" stroke="#f4b860" stroke-width="1.8">
    <path d="M542 124 L588 76" marker-end="url(#b)"/>
    <path d="M755 94 L755 106" marker-end="url(#b)"/>
    <path d="M755 150 L755 162" marker-end="url(#b)"/>
  </g>
  <text x="590" y="226" font-size="12.5" fill="#f4b860">First hit wins. A missing wording shows the source text.</text>

  <!-- export lane -->
  <rect x="40" y="250" width="880" height="1" fill="#f2f5f8" opacity="0.5"/>
  <text x="40" y="280" font-size="15" font-weight="bold" fill="#f2f5f8">Export (prestashop:translation:export-module pcfe45 es-ES)</text>
  <rect x="40" y="296" width="190" height="52" rx="6" fill="#3d5266"/>
  <text x="135" y="318" font-size="12.5" fill="#f2f5f8" text-anchor="middle">scan PHP, TPL, Twig</text>
  <text x="135" y="336" font-size="12.5" fill="#f2f5f8" text-anchor="middle">literal wordings only</text>
  <rect x="290" y="296" width="190" height="52" rx="6" fill="#3d5266"/>
  <text x="385" y="318" font-size="12.5" fill="#f2f5f8" text-anchor="middle">merge targets already</text>
  <text x="385" y="336" font-size="12.5" fill="#f2f5f8" text-anchor="middle">known (XLF, database)</text>
  <rect x="540" y="296" width="190" height="52" rx="6" fill="#3d5266"/>
  <text x="635" y="318" font-size="12.5" fill="#f2f5f8" text-anchor="middle">one XLF per domain</text>
  <text x="635" y="336" font-size="12.5" fill="#f2f5f8" text-anchor="middle">zip in var/cache/dev</text>
  <rect x="780" y="296" width="140" height="52" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5"/>
  <text x="850" y="318" font-size="12.5" fill="#f4b860" text-anchor="middle">ship in the</text>
  <text x="850" y="336" font-size="12.5" fill="#f4b860" text-anchor="middle">translations folder</text>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.8">
    <path d="M232 322 L288 322" marker-end="url(#a)"/>
    <path d="M482 322 L538 322" marker-end="url(#a)"/>
    <path d="M732 322 L778 322" marker-end="url(#a)"/>
  </g>

  <!-- classic lane -->
  <rect x="40" y="376" width="880" height="1" fill="#f2f5f8" opacity="0.5"/>
  <text x="40" y="404" font-size="15" font-weight="bold" fill="#f2f5f8">Classic system (PHP dictionary): modules that must run on PrestaShop 1.7.5 or older</text>
  <rect x="40" y="420" width="420" height="52" rx="6" fill="#3d5266"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#f2f5f8">
    <text x="50" y="442">$this-&gt;l('Roast date', 'classic')</text>
    <text x="50" y="460">{l s='Roast date' mod='pcfe45classic'}</text>
  </g>
  <rect x="520" y="420" width="400" height="52" rx="6" fill="#3d5266"/>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#f2f5f8">
    <text x="530" y="442">translations/es.php</text>
    <text x="530" y="460" fill="#f4b860">'&lt;{pcfe45classic}prestashop&gt;classic_&lt;md5&gt;'</text>
  </g>
  <path d="M462 446 L518 446" fill="none" stroke="#f2f5f8" stroke-width="1.8" marker-end="url(#a)"/>
</svg>
