<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Anatomy of a settings tab and the order of its save hooks</title>
  <desc id="d">The URL of a settings screen has three parts. page equals wc-settings is rendered by WC_Admin_Settings, which collects the page objects through the woocommerce_get_settings_pages filter. tab equals pocket_coffee selects the WC_Settings_Page subclass with its id and label. section equals club selects get_settings_for_club_section. Below, seven steps show what happens when the merchant saves the Coffee Club section, in the order recorded on WooCommerce 11.2.1.</desc>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">One URL, three layers</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Admin_Settings, the WC_Settings_Page subclass and the section method; below, what a save runs</text>
  <rect x="40" y="74" width="880" height="36" rx="6" fill="#34495e"/>
  <text x="52" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wp-admin/admin.php?page=wc-settings&amp;tab=pocket_coffee&amp;section=club</text>
  <rect x="40" y="128" width="280" height="132" rx="6" fill="#3d5266"/>
  <rect x="40" y="128" width="280" height="5" rx="2" fill="#f4b860"/>
  <text x="52" y="156" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">page=wc-settings</text>
  <text x="52" y="180" font-size="12" text-anchor="start" fill="#f2f5f8">WC_Admin_Settings::output()</text>
  <text x="52" y="200" font-size="12" text-anchor="start" fill="#f2f5f8">pages: woocommerce_get_settings_pages</text>
  <text x="52" y="220" font-size="12" text-anchor="start" fill="#f2f5f8">tabs: woocommerce_settings_tabs_array</text>
  <text x="52" y="240" font-size="12" text-anchor="start" fill="#f2f5f8">draws the active tab</text>
  <rect x="340" y="128" width="280" height="132" rx="6" fill="#3d5266"/>
  <rect x="340" y="128" width="280" height="5" rx="2" fill="#9fd3c7"/>
  <text x="352" y="156" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">tab=pocket_coffee</text>
  <text x="352" y="180" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">class PC_Settings_Page</text>
  <text x="352" y="200" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">$this-&gt;id = 'pocket_coffee'</text>
  <text x="352" y="220" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">$this-&gt;label = 'Pocket Coffee'</text>
  <text x="352" y="240" font-size="12" text-anchor="start" fill="#f2f5f8">get_own_sections(): '' and 'club'</text>
  <rect x="640" y="128" width="280" height="132" rx="6" fill="#3d5266"/>
  <rect x="640" y="128" width="280" height="5" rx="2" fill="#a8d18d"/>
  <text x="652" y="156" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">section=club</text>
  <text x="652" y="180" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">get_settings_for_club_section()</text>
  <text x="652" y="200" font-size="12" text-anchor="start" fill="#f2f5f8">filter woocommerce_get_settings_</text>
  <text x="652" y="220" font-size="12" text-anchor="start" fill="#f2f5f8">pocket_coffee can still change it</text>
  <text x="652" y="240" font-size="12" text-anchor="start" fill="#f2f5f8">WC_Admin_Settings::output_fields()</text>
  <text x="40" y="292" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Saving the Coffee Club section (hooks in the order recorded by a trace on WooCommerce 11.2.1)</text>
  <rect x="40" y="306" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="306" width="38" height="38" rx="6" fill="#34495e"/>
  <text x="59" y="331" font-size="14" font-weight="bold" text-anchor="middle" fill="#f2f5f8">1</text>
  <text x="92" y="330" font-size="12.5" text-anchor="start" fill="#f2f5f8">check_admin_referer( 'woocommerce-settings' ) and the manage_woocommerce capability</text>
  <rect x="40" y="352" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="352" width="38" height="38" rx="6" fill="#f4b860"/>
  <text x="59" y="377" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b3a4a">2</text>
  <text x="92" y="376" font-size="12.5" text-anchor="start" fill="#f2f5f8">do_action( 'woocommerce_settings_save_pocket_coffee' ): PC_Settings_Page::save() runs</text>
  <rect x="40" y="398" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="398" width="38" height="38" rx="6" fill="#9fd3c7"/>
  <text x="59" y="423" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b3a4a">3</text>
  <text x="92" y="422" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Admin_Settings::save_fields(): clean by field type, then two sanitize filters per option</text>
  <rect x="40" y="444" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="444" width="38" height="38" rx="6" fill="#34495e"/>
  <text x="59" y="469" font-size="14" font-weight="bold" text-anchor="middle" fill="#f2f5f8">4</text>
  <text x="92" y="468" font-size="12.5" text-anchor="start" fill="#f2f5f8">update_option() for every field id that returned a value (null skips the option)</text>
  <rect x="40" y="490" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="490" width="38" height="38" rx="6" fill="#f4b860"/>
  <text x="59" y="515" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b3a4a">5</text>
  <text x="92" y="514" font-size="12.5" text-anchor="start" fill="#f2f5f8">woocommerce_update_options_pocket_coffee_club: only for a named section</text>
  <rect x="40" y="536" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="536" width="38" height="38" rx="6" fill="#f4b860"/>
  <text x="59" y="561" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b3a4a">6</text>
  <text x="92" y="560" font-size="12.5" text-anchor="start" fill="#f2f5f8">woocommerce_update_options_pocket_coffee, then woocommerce_update_options</text>
  <rect x="40" y="582" width="880" height="38" rx="6" fill="#3d5266"/>
  <rect x="40" y="582" width="38" height="38" rx="6" fill="#f4b860"/>
  <text x="59" y="607" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b3a4a">7</text>
  <text x="92" y="606" font-size="12.5" text-anchor="start" fill="#f2f5f8">woocommerce_settings_saved: last hook; the success notice is already queued</text>
</svg>
