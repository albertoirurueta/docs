<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The ViewState round trip</text>

  <!-- Server render (left) -->
  <rect x="30" y="55" width="320" height="150" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="190" y="78" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Server: Render (response 1)</text>
  <text x="50" y="102" font-size="11.5" fill="#1c4b73">1. PreRender: control tree is final</text>
  <text x="50" y="120" font-size="11.5" fill="#1c4b73">2. SaveViewState walks the tree, collects</text>
  <text x="60" y="136" font-size="11.5" fill="#1c4b73">changed/EnableViewState=true state</text>
  <text x="50" y="154" font-size="11.5" fill="#1c4b73">3. Serialize (LosFormatter) + Base64</text>
  <text x="50" y="170" font-size="11.5" fill="#1c4b73">4. MAC-sign using machineKey</text>
  <text x="50" y="186" font-size="11.5" fill="#1c4b73">5. Write into hidden __VIEWSTATE field</text>

  <!-- Browser (right) -->
  <rect x="430" y="55" width="320" height="150" rx="8" fill="#f7e6cf" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="590" y="78" font-size="13.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Browser: holds the page</text>
  <text x="450" y="102" font-size="11.5" fill="#8a3d10">&lt;input type="hidden"</text>
  <text x="460" y="118" font-size="11.5" fill="#8a3d10">  name="__VIEWSTATE"</text>
  <text x="460" y="134" font-size="11.5" fill="#8a3d10">  value="/wEPDwUJ...=" /&gt;</text>
  <text x="450" y="158" font-size="11.5" fill="#8a3d10">Opaque to the client; only</text>
  <text x="450" y="174" font-size="11.5" fill="#8a3d10">re-submitted verbatim on postback</text>

  <!-- arrow render -->
  <line x1="350" y1="130" x2="428" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="389" y="122" font-size="10.5" fill="#555555" text-anchor="middle">HTTP response</text>

  <!-- arrow postback -->
  <line x1="430" y1="230" x2="352" y2="230" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="391" y="222" font-size="10.5" fill="#555555" text-anchor="middle">HTTP POST (form submit)</text>

  <!-- Server load (bottom left) -->
  <rect x="30" y="245" width="320" height="150" rx="8" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="190" y="268" font-size="13.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Server: Load (postback)</text>
  <text x="50" y="292" font-size="11.5" fill="#2f5424">1. Verify MAC signature (machineKey)</text>
  <text x="50" y="308" font-size="11.5" fill="#2f5424">2. Base64-decode + deserialize</text>
  <text x="50" y="324" font-size="11.5" fill="#2f5424">3. LoadViewState walks the tree, restores</text>
  <text x="62" y="340" font-size="11.5" fill="#2f5424">each control's saved state by ID/position</text>
  <text x="50" y="358" font-size="11.5" fill="#2f5424">4. EventValidation checks __EVENTTARGET /</text>
  <text x="62" y="374" font-size="11.5" fill="#2f5424">list values against the registered set</text>

  <!-- Browser bottom -->
  <rect x="430" y="245" width="320" height="150" rx="8" fill="#f3d9e6" stroke="#a83070" stroke-width="1.5"/>
  <text x="590" y="268" font-size="13.5" font-weight="bold" fill="#7a1f52" text-anchor="middle">Browser: submits postback</text>
  <text x="450" y="292" font-size="11.5" fill="#7a1f52">__doPostBack(target, arg) sets</text>
  <text x="450" y="308" font-size="11.5" fill="#7a1f52">__EVENTTARGET / __EVENTARGUMENT,</text>
  <text x="450" y="324" font-size="11.5" fill="#7a1f52">then submits the &lt;form&gt; including the</text>
  <text x="450" y="340" font-size="11.5" fill="#7a1f52">unchanged __VIEWSTATE and all field values</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
