<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The complete Bookshelf deployment on a kind cluster from Gateway and HTTPRoutes through three Deployments to PostgreSQL and Redis with the notifier CronJob</title>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <text x="400" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf -- the complete deployment</text>
  <text x="400" y="42" font-size="10.5" fill="#666666" text-anchor="middle">namespace bookshelf with Pod Security labels, NetworkPolicies, RBAC, HPA and PDB around the workloads</text>

  <!-- client -->
  <rect x="320" y="56" width="160" height="28" rx="6" fill="#fbeee0" stroke="#a05a1f" stroke-width="1.2"/>
  <text x="400" y="74" font-size="11" font-weight="bold" fill="#a05a1f" text-anchor="middle">Browser or API client</text>
  <line x1="400" y1="84" x2="400" y2="104" stroke="#555555" stroke-width="1.3"/>
  <polygon points="395,100 405,100 400,108" fill="#555555"/>

  <!-- namespace -->
  <rect x="20" y="108" width="760" height="436" rx="10" fill="#f7f9fb" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="36" y="128" font-size="12.5" font-weight="bold" fill="#1c4b73">Namespace bookshelf (pod-security.kubernetes.io/enforce: restricted)</text>

  <!-- gateway -->
  <rect x="250" y="140" width="300" height="44" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="400" y="159" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Gateway bookshelf-gateway + HTTPRoutes</text>
  <text x="400" y="175" font-size="9" fill="#333333" text-anchor="middle">/catalog, /reviews, everything else</text>

  <!-- deployments -->
  <rect x="40" y="220" width="220" height="110" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="150" y="240" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment catalog-api</text>
  <text x="150" y="258" font-size="9" fill="#333333" text-anchor="middle">Service catalog-api</text>
  <text x="150" y="274" font-size="9" fill="#333333" text-anchor="middle">probes, resources, securityContext</text>
  <text x="150" y="290" font-size="9" fill="#333333" text-anchor="middle">HPA 2 to 6 replicas</text>
  <text x="150" y="306" font-size="9" fill="#333333" text-anchor="middle">PodDisruptionBudget minAvailable 1</text>

  <rect x="290" y="220" width="220" height="110" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="400" y="240" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment reviews-api</text>
  <text x="400" y="258" font-size="9" fill="#333333" text-anchor="middle">Service reviews-api</text>
  <text x="400" y="274" font-size="9" fill="#333333" text-anchor="middle">probes, resources, securityContext</text>
  <text x="400" y="290" font-size="9" fill="#333333" text-anchor="middle">ConfigMap bookshelf-config</text>

  <rect x="540" y="220" width="220" height="110" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="650" y="240" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment web</text>
  <text x="650" y="258" font-size="9" fill="#333333" text-anchor="middle">Service web</text>
  <text x="650" y="274" font-size="9" fill="#333333" text-anchor="middle">static front end</text>
  <text x="650" y="290" font-size="9" fill="#333333" text-anchor="middle">2 replicas, rolling update</text>

  <line x1="330" y1="184" x2="150" y2="220" stroke="#555555" stroke-width="1.2"/>
  <line x1="400" y1="184" x2="400" y2="220" stroke="#555555" stroke-width="1.2"/>
  <line x1="470" y1="184" x2="650" y2="220" stroke="#555555" stroke-width="1.2"/>

  <!-- data tier -->
  <rect x="40" y="370" width="230" height="100" rx="6" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="155" y="390" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">StatefulSet postgres</text>
  <text x="155" y="408" font-size="9" fill="#333333" text-anchor="middle">headless Service postgres</text>
  <text x="155" y="424" font-size="9" fill="#333333" text-anchor="middle">volumeClaimTemplate data, 10Gi</text>
  <text x="155" y="440" font-size="9" fill="#333333" text-anchor="middle">Secret postgres-credentials</text>

  <rect x="300" y="370" width="200" height="100" rx="6" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="400" y="390" font-size="11" font-weight="bold" fill="#5b3a8c" text-anchor="middle">Redis cache</text>
  <text x="400" y="408" font-size="9" fill="#333333" text-anchor="middle">Service redis</text>
  <text x="400" y="424" font-size="9" fill="#333333" text-anchor="middle">used by catalog-api</text>

  <rect x="530" y="370" width="230" height="100" rx="6" fill="#fbf6e0" stroke="#8a6d10" stroke-width="1.3"/>
  <text x="645" y="390" font-size="11" font-weight="bold" fill="#8a6d10" text-anchor="middle">CronJob notifier</text>
  <text x="645" y="408" font-size="9" fill="#333333" text-anchor="middle">schedule every 15 minutes</text>
  <text x="645" y="424" font-size="9" fill="#333333" text-anchor="middle">concurrencyPolicy Forbid</text>
  <text x="645" y="440" font-size="9" fill="#333333" text-anchor="middle">ServiceAccount notifier</text>

  <line x1="150" y1="330" x2="155" y2="370" stroke="#555555" stroke-width="1.2"/>
  <line x1="400" y1="330" x2="155" y2="370" stroke="#555555" stroke-width="1.2"/>
  <line x1="170" y1="330" x2="400" y2="370" stroke="#555555" stroke-width="1.2"/>
  <line x1="645" y1="370" x2="270" y2="410" stroke="#8a6d10" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- footer -->
  <rect x="40" y="490" width="720" height="40" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="400" y="507" font-size="10" fill="#333333" text-anchor="middle">NetworkPolicies: default deny, then allow gateway to apps, apps to postgres and redis, DNS egress</text>
  <text x="400" y="522" font-size="10" fill="#333333" text-anchor="middle">Delivery: Kustomize overlays or the Helm chart, reconciled from Git by Argo CD</text>
</svg>
