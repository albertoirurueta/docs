<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Vapor's service model: one typed map on Application, read through computed properties</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the key is a type (ObjectIdentifier), the value must be Sendable, and the app owns it until shutdown</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- Application -->
  <rect x="30" y="70" width="400" height="340" rx="10" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="46" y="94" font-size="14" font-weight="bold" fill="#1f5f99">Application (one per process)</text>
  <text x="46" y="112" font-size="11" fill="#222222">app.storage : Storage   (locked, [ObjectIdentifier: value])</text>

  <rect x="50" y="128" width="360" height="40" rx="6" fill="#ffffff" stroke="#1f5f99"/>
  <text x="62" y="146" font-size="12" font-weight="bold" fill="#222222">BookshelfSettingsKey</text>
  <text x="62" y="161" font-size="11" fill="#222222">Value = BookshelfSettings (struct, Sendable)</text>

  <rect x="50" y="176" width="360" height="40" rx="6" fill="#ffffff" stroke="#1f5f99"/>
  <text x="62" y="194" font-size="12" font-weight="bold" fill="#222222">BookRepositoryFactoryKey</text>
  <text x="62" y="209" font-size="11" fill="#222222">Value = factory closure (@Sendable), makes a repository per Request</text>

  <rect x="50" y="224" width="360" height="40" rx="6" fill="#ffffff" stroke="#1f5f99"/>
  <text x="62" y="242" font-size="12" font-weight="bold" fill="#222222">AuditLogKey  (also a LockKey)</text>
  <text x="62" y="257" font-size="11" fill="#222222">Value = AuditLog (final class, Sendable) + onShutdown flush</text>

  <rect x="50" y="272" width="360" height="40" rx="6" fill="#ffffff" stroke="#1f5f99"/>
  <text x="62" y="290" font-size="12" font-weight="bold" fill="#222222">Vapor's own keys</text>
  <text x="62" y="305" font-size="11" fill="#222222">routes, middleware, responder, HTTP client, caches, sessions ...</text>

  <rect x="50" y="326" width="360" height="62" rx="6" fill="#fff8e1" stroke="#b58900"/>
  <text x="62" y="344" font-size="12" font-weight="bold" fill="#8a6a00">app.locks.lock(for: Key.self)</text>
  <text x="62" y="360" font-size="11" fill="#222222">one NIOLock per LockKey type: makes "check, create, store"</text>
  <text x="62" y="375" font-size="11" fill="#222222">atomic for lazily created services</text>

  <!-- computed properties -->
  <rect x="490" y="120" width="190" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="585" y="144" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Computed properties</text>
  <text x="585" y="164" font-size="11" fill="#222222" text-anchor="middle">extension Application</text>
  <text x="585" y="180" font-size="11" fill="#222222" text-anchor="middle">var bookshelf, var auditLog</text>
  <text x="585" y="200" font-size="11" fill="#222222" text-anchor="middle">extension Request</text>
  <text x="585" y="216" font-size="11" fill="#222222" text-anchor="middle">var books, var bookshelf</text>

  <!-- handlers -->
  <rect x="740" y="120" width="170" height="110" rx="10" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="825" y="144" font-size="13" font-weight="bold" fill="#b7410e" text-anchor="middle">Route handlers</text>
  <text x="825" y="166" font-size="11" fill="#222222" text-anchor="middle">req.books.all()</text>
  <text x="825" y="182" font-size="11" fill="#222222" text-anchor="middle">req.bookshelf.libraryName</text>
  <text x="825" y="198" font-size="11" fill="#222222" text-anchor="middle">req.application.auditLog</text>

  <!-- tests -->
  <rect x="490" y="290" width="420" height="100" rx="10" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="700" y="314" font-size="13" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Tests swap the factory</text>
  <text x="700" y="336" font-size="11" fill="#222222" text-anchor="middle">app.bookRepositoryFactory = BookRepositoryFactory { _ in stub }</text>
  <text x="700" y="354" font-size="11" fill="#222222" text-anchor="middle">handlers are unchanged: they only know the BookRepository protocol</text>
  <text x="700" y="372" font-size="11" fill="#222222" text-anchor="middle">asyncShutdown() runs every onShutdown closure, then clears the map</text>

  <line x1="410" y1="150" x2="488" y2="165" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="175" x2="738" y2="175" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="232" x2="620" y2="288" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="449" y="140" font-size="10" fill="#444444" text-anchor="middle">read</text>
  <text x="709" y="168" font-size="10" fill="#444444" text-anchor="middle">call</text>
</svg>
