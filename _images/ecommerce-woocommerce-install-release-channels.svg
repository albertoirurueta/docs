<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 360" width="1010" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Where a WooCommerce build can come from</title>
  <desc id="d">Four sources ordered from safest to riskiest: stable releases from WordPress.org, beta and release candidate zips, live branch builds from pull requests, and a clone of the repository built with pnpm. Each lists the tool that installs it and what it is for.</desc>
  <rect x="15" y="30" width="232" height="170" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="131.0" y="54" text-anchor="middle" font-size="14" font-weight="bold">Stable release</text>
  <text x="131.0" y="78" text-anchor="middle" font-size="12.5">WordPress.org: 11.2.1</text>
  <text x="131.0" y="100" text-anchor="middle" font-size="12.5">wp plugin install woocommerce</text>
  <text x="131.0" y="122" text-anchor="middle" font-size="12.5">wp-admin updates</text>
  <text x="131.0" y="144" text-anchor="middle" font-size="12.5">use for: production</text>
  <path d="M247 115 L262 115" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="264" y="30" width="232" height="170" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="380.0" y="54" text-anchor="middle" font-size="14" font-weight="bold">Beta and RC zips</text>
  <text x="380.0" y="78" text-anchor="middle" font-size="12.5">11.3.0-beta.1 (2026-10-26)</text>
  <text x="380.0" y="100" text-anchor="middle" font-size="12.5">--version=11.3.0-beta.1</text>
  <text x="380.0" y="122" text-anchor="middle" font-size="12.5">Beta Tester channels</text>
  <text x="380.0" y="144" text-anchor="middle" font-size="12.5">use for: compatibility runs</text>
  <path d="M496 115 L511 115" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="513" y="30" width="232" height="170" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="629.0" y="54" text-anchor="middle" font-size="14" font-weight="bold">Live branch builds</text>
  <text x="629.0" y="78" text-anchor="middle" font-size="12.5">builds of open pull requests</text>
  <text x="629.0" y="100" text-anchor="middle" font-size="12.5">wp wc-beta-tester install</text>
  <text x="629.0" y="122" text-anchor="middle" font-size="12.5">Live Branches page</text>
  <text x="629.0" y="144" text-anchor="middle" font-size="12.5">use for: testing one fix</text>
  <path d="M745 115 L760 115" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="762" y="30" width="232" height="170" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="878.0" y="54" text-anchor="middle" font-size="14" font-weight="bold">Repository clone</text>
  <text x="878.0" y="78" text-anchor="middle" font-size="12.5">woocommerce/woocommerce on GitHub</text>
  <text x="878.0" y="100" text-anchor="middle" font-size="12.5">pnpm install, pnpm build</text>
  <text x="878.0" y="122" text-anchor="middle" font-size="12.5">symlink plugins/woocommerce</text>
  <text x="878.0" y="144" text-anchor="middle" font-size="12.5">use for: core contributions</text>
  <rect x="15" y="226" width="980" height="112" rx="10" fill="#7f8c8d" fill-opacity="0.12" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="254" text-anchor="middle" font-weight="bold">Risk and effort grow to the right</text>
  <text x="40" y="282" font-size="12.5">Folder name: a zip from WordPress.org unpacks to woocommerce, a URL source in wp-env is mounted as woocommerce.11.3.0-beta.</text>
  <text x="40" y="304" font-size="12.5">Version change: wp plugin install --force replaces files in place, wp-env needs the URL changed in .wp-env.json and a restart.</text>
  <text x="40" y="326" font-size="12.5">Database: the beta raised woocommerce_version to 11.3.0-beta.1 while woocommerce_db_version stayed 11.2.1 until the update ran.</text>
</svg>
