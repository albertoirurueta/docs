<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-mat-orm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One packed texture can feed three material slots</text>
<rect x="30" y="60" width="200" height="200" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="40" y="70" width="60" height="180" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
<rect x="105" y="70" width="60" height="180" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<rect x="170" y="70" width="50" height="180" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
<text x="70" y="165" font-size="22" font-weight="bold" fill="#B91C1C" text-anchor="middle">R</text>
<text x="135" y="165" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">G</text>
<text x="195" y="165" font-size="22" font-weight="bold" fill="#1D4ED8" text-anchor="middle">B</text>
<text x="130" y="282" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">bookshelf-orm.png</text>
<text x="130" y="298" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">NoColorSpace, one image, one upload</text>
<rect x="430" y="70" width="300" height="60" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="580" y="92" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">material.aoMap</text>
<text x="580" y="110" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">red channel: ambient occlusion</text>
<path d="M 230 110 C 330 100 360 100 428 100" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah-webgl-tjs-mat-orm)"/>
<rect x="430" y="155" width="300" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580" y="177" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">material.roughnessMap</text>
<text x="580" y="195" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">green channel: multiplies roughness</text>
<path d="M 230 165 C 330 185 360 185 428 185" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#ah-webgl-tjs-mat-orm)"/>
<rect x="430" y="240" width="300" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="580" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">material.metalnessMap</text>
<text x="580" y="280" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">blue channel: multiplies metalness</text>
<path d="M 230 215 C 330 270 360 270 428 270" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#ah-webgl-tjs-mat-orm)"/>
<text x="380" y="336" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glTF calls this the ORM layout; aoMap also needs a UV channel (texture.channel) that matches the geometry</text>
