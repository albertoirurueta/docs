<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">File trees of a block, a classic and a hybrid WordPress theme</title>
  <desc id="d">Three side-by-side folder trees. The block theme lumen has style.css, theme.json, readme.txt, screenshot.png, an optional functions.php and the folders templates (with index.html, which makes it a block theme), parts, patterns, styles and assets. The classic theme lumen-classic has style.css, index.php, functions.php and PHP template files such as header.php, single.php and comments.php. The hybrid theme is the classic theme plus theme.json, block template parts and patterns, still without templates/index.html, so WordPress treats it as classic.</desc>
  <rect width="760" height="600" rx="12" fill="#2b3a4a"/>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="20" width="232" height="470" rx="8" fill="#d9ead3"/>
    <text x="32" y="42" font-size="14" font-weight="bold">Block theme</text>
    <text x="32" y="66" font-family="Courier New, monospace" font-weight="bold">lumen/</text>
    <text x="46" y="88" font-family="Courier New, monospace" font-weight="bold">style.css</text>
    <text x="240" y="88" text-anchor="end" font-size="10" font-style="italic">required</text>
    <text x="46" y="108" font-family="Courier New, monospace">theme.json</text>
    <text x="46" y="128" font-family="Courier New, monospace">readme.txt</text>
    <text x="46" y="148" font-family="Courier New, monospace">screenshot.png</text>
    <text x="46" y="168" font-family="Courier New, monospace" font-style="italic">functions.php</text>
    <text x="240" y="168" text-anchor="end" font-size="10" font-style="italic">optional</text>
    <text x="46" y="188" font-family="Courier New, monospace" font-weight="bold">templates/</text>
    <rect x="56" y="195" width="81" height="18" rx="3" fill="#ffd966"/>
    <text x="60" y="208" font-family="Courier New, monospace" font-weight="bold">index.html</text>
    <text x="60" y="228" font-family="Courier New, monospace">single.html</text>
    <text x="60" y="248" font-family="Courier New, monospace">page.html</text>
    <text x="60" y="268" font-family="Courier New, monospace">archive-lp_book.html</text>
    <text x="60" y="288" font-family="Courier New, monospace">404.html</text>
    <text x="46" y="308" font-family="Courier New, monospace" font-weight="bold">parts/</text>
    <text x="60" y="328" font-family="Courier New, monospace">header.html</text>
    <text x="60" y="348" font-family="Courier New, monospace">footer.html</text>
    <text x="46" y="368" font-family="Courier New, monospace" font-weight="bold">patterns/</text>
    <text x="60" y="388" font-family="Courier New, monospace">book-hero.php</text>
    <text x="46" y="408" font-family="Courier New, monospace" font-weight="bold">styles/</text>
    <text x="60" y="428" font-family="Courier New, monospace">paper.json</text>
    <text x="60" y="448" font-family="Courier New, monospace">midnight.json</text>
    <text x="46" y="468" font-family="Courier New, monospace" font-weight="bold">assets/fonts/</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="264" y="20" width="232" height="470" rx="8" fill="#fbe5c8"/>
    <text x="276" y="42" font-size="14" font-weight="bold">Classic theme</text>
    <text x="276" y="66" font-family="Courier New, monospace" font-weight="bold">lumen-classic/</text>
    <text x="290" y="88" font-family="Courier New, monospace" font-weight="bold">style.css</text>
    <text x="484" y="88" text-anchor="end" font-size="10" font-style="italic">required</text>
    <rect x="286" y="95" width="74" height="18" rx="3" fill="#ffd966"/>
    <text x="290" y="108" font-family="Courier New, monospace" font-weight="bold">index.php</text>
    <text x="290" y="128" font-family="Courier New, monospace">functions.php</text>
    <text x="290" y="148" font-family="Courier New, monospace">readme.txt</text>
    <text x="290" y="168" font-family="Courier New, monospace">screenshot.png</text>
    <text x="290" y="188" font-family="Courier New, monospace">header.php</text>
    <text x="290" y="208" font-family="Courier New, monospace">footer.php</text>
    <text x="290" y="228" font-family="Courier New, monospace">sidebar.php</text>
    <text x="290" y="248" font-family="Courier New, monospace">single.php</text>
    <text x="290" y="268" font-family="Courier New, monospace">page.php</text>
    <text x="290" y="288" font-family="Courier New, monospace">archive.php</text>
    <text x="290" y="308" font-family="Courier New, monospace">comments.php</text>
    <text x="290" y="328" font-family="Courier New, monospace">searchform.php</text>
    <text x="290" y="348" font-family="Courier New, monospace">404.php</text>
    <text x="290" y="368" font-family="Courier New, monospace" font-weight="bold">template-parts/</text>
    <text x="304" y="388" font-family="Courier New, monospace">content.php</text>
    <text x="290" y="408" font-family="Courier New, monospace" font-weight="bold">assets/</text>
    <text x="304" y="428" font-family="Courier New, monospace">css/  js/</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="508" y="20" width="232" height="470" rx="8" fill="#e6dcf2"/>
    <text x="520" y="42" font-size="14" font-weight="bold">Hybrid theme</text>
    <text x="520" y="66" font-family="Courier New, monospace" font-weight="bold">lumen-classic/ + blocks</text>
    <text x="534" y="88" font-family="Courier New, monospace" font-weight="bold">style.css</text>
    <text x="728" y="88" text-anchor="end" font-size="10" font-style="italic">required</text>
    <rect x="530" y="95" width="74" height="18" rx="3" fill="#ffd966"/>
    <text x="534" y="108" font-family="Courier New, monospace" font-weight="bold">index.php</text>
    <text x="534" y="128" font-family="Courier New, monospace">functions.php</text>
    <text x="534" y="148" font-family="Courier New, monospace">readme.txt</text>
    <text x="534" y="168" font-family="Courier New, monospace">screenshot.png</text>
    <text x="534" y="188" font-family="Courier New, monospace">header.php</text>
    <text x="534" y="208" font-family="Courier New, monospace">footer.php</text>
    <text x="534" y="228" font-family="Courier New, monospace">single.php</text>
    <text x="534" y="248" font-family="Courier New, monospace">page.php</text>
    <text x="534" y="268" font-family="Courier New, monospace" font-weight="bold" fill="#6a1b9a">theme.json</text>
    <text x="534" y="288" font-family="Courier New, monospace" font-weight="bold" fill="#6a1b9a">parts/</text>
    <text x="548" y="308" font-family="Courier New, monospace" font-weight="bold" fill="#6a1b9a">header.html</text>
    <text x="534" y="328" font-family="Courier New, monospace" font-weight="bold" fill="#6a1b9a">patterns/</text>
    <text x="548" y="348" font-family="Courier New, monospace" font-weight="bold" fill="#6a1b9a">book-hero.php</text>
    <text x="534" y="368" font-style="italic">(no templates/index.html)</text>
  </g>
  <rect x="20" y="504" width="12" height="12" rx="2" fill="#ffd966" stroke="#ffffff"/>
  <text x="40" y="515" font-size="12" fill="#ffffff">Highlighted file decides the kind: templates/index.html makes a block theme (wp_is_block_theme() is true);</text>
  <text x="40" y="534" font-size="12" fill="#ffffff">without it the theme is classic and needs index.php. the deprecated block-templates/index.html also counts.</text>
  <rect x="20" y="542" width="12" height="12" rx="2" fill="#6a1b9a" stroke="#ffffff"/>
  <text x="40" y="553" font-size="12" fill="#ffffff">Purple: block features added to a classic theme. theme.json turns on global settings and styles and the</text>
  <text x="40" y="572" font-size="12" fill="#ffffff">template editor (block-templates support), but wp_is_block_theme() stays false and there is no Site Editor.</text>
</svg>
