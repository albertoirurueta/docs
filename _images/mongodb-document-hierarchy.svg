<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">MongoDB storage hierarchy and the relational analogy</text>

  <text x="190" y="58" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">MongoDB</text>
  <text x="530" y="58" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Relational (SQL)</text>

  <!-- Tier 1 -->
  <rect x="60" y="73" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="97" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">database</text>
  <text x="74" y="115" font-size="10.5" fill="#666666">top-level namespace on mongod</text>
  <rect x="400" y="73" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="97" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">database / schema</text>
  <text x="414" y="115" font-size="10.5" fill="#666666">CREATE SCHEMA</text>

  <!-- Tier 2 -->
  <rect x="60" y="163" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="187" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">collection</text>
  <text x="74" y="205" font-size="10.5" fill="#666666">group of documents; no fixed columns</text>
  <rect x="400" y="163" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="187" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">table</text>
  <text x="414" y="205" font-size="10.5" fill="#666666">CREATE TABLE with a fixed column list</text>

  <!-- Tier 3 -->
  <rect x="60" y="253" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="277" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">document</text>
  <text x="74" y="295" font-size="10.5" fill="#666666">BSON object, up to 16 MB</text>
  <rect x="400" y="253" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="277" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">row</text>
  <text x="414" y="295" font-size="10.5" fill="#666666">one tuple, fixed arity</text>

  <!-- Tier 4 -->
  <rect x="60" y="343" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="74" y="367" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">field</text>
  <text x="74" y="385" font-size="10.5" fill="#666666">name/value pair; type set per document</text>
  <rect x="400" y="343" width="260" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="414" y="367" font-size="15" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">column</text>
  <text x="414" y="385" font-size="10.5" fill="#666666">one typed cell, type fixed by DDL</text>

  <!-- vertical connectors, MongoDB side -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="190" y1="127" x2="190" y2="159"/>
    <polygon points="184,159 196,159 190,167" stroke="none"/>
    <line x1="190" y1="217" x2="190" y2="249"/>
    <polygon points="184,249 196,249 190,257" stroke="none"/>
    <line x1="190" y1="307" x2="190" y2="339"/>
    <polygon points="184,339 196,339 190,347" stroke="none"/>
  </g>

  <!-- vertical connectors, relational side -->
  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="530" y1="127" x2="530" y2="159"/>
    <polygon points="524,159 536,159 530,167" stroke="none"/>
    <line x1="530" y1="217" x2="530" y2="249"/>
    <polygon points="524,249 536,249 530,257" stroke="none"/>
    <line x1="530" y1="307" x2="530" y2="339"/>
    <polygon points="524,339 536,339 530,347" stroke="none"/>
  </g>

  <!-- horizontal "maps to" links -->
  <g stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="320" y1="100" x2="400" y2="100"/>
    <line x1="320" y1="190" x2="400" y2="190"/>
    <line x1="320" y1="280" x2="400" y2="280"/>
    <line x1="320" y1="370" x2="400" y2="370"/>
  </g>
  <g font-size="10" fill="#666666" text-anchor="middle">
    <text x="360" y="95">maps to</text>
    <text x="360" y="185">maps to</text>
    <text x="360" y="275">maps to</text>
    <text x="360" y="365">maps to</text>
  </g>

  <text x="360" y="425" font-size="11.5" fill="#444444" text-anchor="middle">The tiers line up one-to-one; only a MongoDB collection does not force every document to share one column list.</text>
</svg>
