<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What FileMiddleware does with a request</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">anything that does not become a file response is passed to the next responder (router, then handler or 404)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- start -->
  <rect x="30" y="70" width="170" height="50" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="115" y="92" font-size="12" font-weight="bold" fill="#1f5f99" text-anchor="middle">Request URL path</text>
  <text x="115" y="108" font-size="11" fill="#222222" text-anchor="middle">percent-decode, drop leading /</text>
  <line x1="200" y1="95" x2="250" y2="95" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- decision 1 -->
  <rect x="252" y="65" width="200" height="60" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="352" y="90" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">Invalid encoding or</text>
  <text x="352" y="106" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">path contains "../" ?</text>
  <line x1="452" y1="95" x2="520" y2="95" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="486" y="88" font-size="11" fill="#222222" text-anchor="middle">yes</text>
  <rect x="522" y="70" width="230" height="50" rx="8" fill="#fbe9e7" stroke="#c62828" stroke-width="1.5"/>
  <text x="637" y="92" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">throw Abort</text>
  <text x="637" y="108" font-size="11" fill="#222222" text-anchor="middle">400 (bad encoding) or 403 (traversal)</text>
  <line x1="352" y1="125" x2="352" y2="165" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="364" y="150" font-size="11" fill="#222222">no</text>

  <!-- decision 2 -->
  <rect x="252" y="167" width="200" height="60" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="352" y="192" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">publicDirectory + path</text>
  <text x="352" y="208" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">exists on disk?</text>
  <line x1="452" y1="197" x2="780" y2="197" stroke="#444444" stroke-width="1.5"/>
  <line x1="780" y1="197" x2="780" y2="455" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="560" y="190" font-size="11" fill="#222222">no: fall through</text>
  <line x1="352" y1="227" x2="352" y2="265" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="364" y="251" font-size="11" fill="#222222">yes</text>

  <!-- decision 3 -->
  <rect x="252" y="267" width="200" height="60" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="352" y="292" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">Regular file or</text>
  <text x="352" y="308" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">directory?</text>
  <line x1="252" y1="297" x2="200" y2="297" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="226" y="290" font-size="11" fill="#222222" text-anchor="middle">file</text>

  <!-- file response -->
  <rect x="30" y="262" width="168" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="114" y="284" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">asyncStreamFile</text>
  <text x="114" y="300" font-size="11" fill="#222222" text-anchor="middle">200, 206 (Range) or 304</text>
  <text x="114" y="316" font-size="11" fill="#222222" text-anchor="middle">+ ETag, Cache-Control</text>

  <!-- directory branch -->
  <line x1="452" y1="297" x2="520" y2="297" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="486" y="290" font-size="11" fill="#222222" text-anchor="middle">dir</text>
  <rect x="522" y="262" width="230" height="70" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
  <text x="637" y="284" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">URL ends with / ?</text>
  <text x="637" y="300" font-size="11" fill="#222222" text-anchor="middle">yes: look for defaultFile in it</text>
  <text x="637" y="316" font-size="11" fill="#222222" text-anchor="middle">no: directoryAction decides</text>

  <line x1="637" y1="332" x2="637" y2="370" stroke="#444444" stroke-width="1.5"/>
  <line x1="637" y1="370" x2="180" y2="370" stroke="#444444" stroke-width="1.5"/>
  <rect x="30" y="385" width="300" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="407" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">defaultFile exists: stream it</text>
  <text x="180" y="423" font-size="11" fill="#222222" text-anchor="middle">trailing slash and defaultFile set</text>
  <line x1="180" y1="370" x2="180" y2="383" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="350" y="385" width="300" height="50" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="500" y="407" font-size="12" font-weight="bold" fill="#1f5f99" text-anchor="middle">301 to the URL with a trailing slash</text>
  <text x="500" y="423" font-size="11" fill="#222222" text-anchor="middle">no slash and directoryAction is .redirect</text>
  <line x1="500" y1="370" x2="500" y2="383" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- fall through -->
  <rect x="660" y="457" width="250" height="50" rx="8" fill="#f3f3f3" stroke="#666666" stroke-width="1.5"/>
  <text x="785" y="479" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">next.respond(to: request)</text>
  <text x="785" y="495" font-size="11" fill="#222222" text-anchor="middle">router, handler or 404</text>
  <path d="M660,432 L720,432 L720,455" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="715" y="449" font-size="11" fill="#222222" text-anchor="end">otherwise: fall through</text>
</svg>
