<svg viewBox="0 0 1080 546" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1080" height="546" fill="#ffffff"/>
<text x="540" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Life cycle of a custom Ant task, step by step</text>
<text x="540" y="46" font-size="12" fill="#666666" text-anchor="middle">Order from the manual page Writing Your Own Task; the right column names the methods of the tidepool checkstations task</text>
<text x="76" y="68" font-size="11" fill="#666666">Step</text><text x="260" y="68" font-size="11" fill="#666666">What Ant does</text><text x="660" y="68" font-size="11" fill="#666666">Method that runs in CheckStationsTask</text>
<rect x="20" y="76" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="97" r="12" fill="#4a7fb5"/>
<text x="44" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="70" y="101" font-size="12" font-weight="bold" fill="#222222">Parse time</text>
<text x="260" y="101" font-size="12" fill="#333333">Task element becomes an UnknownElement in its target</text>
<text x="660" y="101" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">nothing of the class exists yet</text>
<rect x="20" y="126" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="147" r="12" fill="#4a7fb5"/>
<text x="44" y="151" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="70" y="151" font-size="12" font-weight="bold" fill="#222222">perform()</text>
<text x="260" y="151" font-size="12" fill="#333333">Ant instantiates the class, sets project and location</text>
<text x="660" y="151" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">new CheckStationsTask()</text>
<rect x="20" y="176" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="197" r="12" fill="#4a7fb5"/>
<text x="44" y="201" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="70" y="201" font-size="12" font-weight="bold" fill="#222222">init()</text>
<text x="260" y="201" font-size="12" fill="#333333">Called once, before any child or attribute</text>
<text x="660" y="201" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">init()  (inherited, empty)</text>
<rect x="20" y="226" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="247" r="12" fill="#4a7fb5"/>
<text x="44" y="251" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="70" y="251" font-size="12" font-weight="bold" fill="#222222">Children created</text>
<text x="260" y="251" font-size="12" fill="#333333">createXXX() results and addXXX() instances</text>
<text x="660" y="251" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">addFileset(FileSet)</text>
<rect x="20" y="276" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="297" r="12" fill="#4a7fb5"/>
<text x="44" y="301" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="70" y="301" font-size="12" font-weight="bold" fill="#222222">Attributes set</text>
<text x="260" y="301" font-size="12" fill="#333333">Properties expanded, values converted to the type</text>
<text x="660" y="301" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">setFile(File), setMinconstituents(int)</text>
<rect x="20" y="326" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="347" r="12" fill="#4a7fb5"/>
<text x="44" y="351" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="70" y="351" font-size="12" font-weight="bold" fill="#222222">Nested text</text>
<text x="260" y="351" font-size="12" fill="#333333">addText() gets the raw text, no property expansion</text>
<text x="660" y="351" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">addText(String)</text>
<rect x="20" y="376" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="397" r="12" fill="#4a7fb5"/>
<text x="44" y="401" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="70" y="401" font-size="12" font-weight="bold" fill="#222222">Child attributes</text>
<text x="260" y="401" font-size="12" fill="#333333">Attributes of every nested element are set</text>
<text x="660" y="401" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">Require.setId(String)</text>
<rect x="20" y="426" width="1040" height="42" rx="4" fill="#e8f1fb" stroke="#4a7fb5"/>
<circle cx="44" cy="447" r="12" fill="#4a7fb5"/>
<text x="44" y="451" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<text x="70" y="451" font-size="12" font-weight="bold" fill="#222222">Configured children</text>
<text x="260" y="451" font-size="12" fill="#333333">addConfiguredXXX() gets fully configured objects</text>
<text x="660" y="451" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">addConfiguredRequire(Require)</text>
<rect x="20" y="476" width="1040" height="42" rx="4" fill="#e6f4ea" stroke="#3b8a55"/>
<circle cx="44" cy="497" r="12" fill="#3b8a55"/>
<text x="44" y="501" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
<text x="70" y="501" font-size="12" font-weight="bold" fill="#222222">execute()</text>
<text x="260" y="501" font-size="12" fill="#333333">Task.perform() fires build events, calls execute()</text>
<text x="660" y="501" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">execute()  throws BuildException</text>
</svg>
