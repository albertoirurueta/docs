<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A signed OAuth 1.0a request vs. a bearer-token OAuth 2.0 request</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">same GET, two very different Authorization headers</text>

  <!-- OAuth 1.0a box -->
  <rect x="30" y="70" width="330" height="320" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="195" y="94" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">OAuth 1.0a (RFC 5849)</text>
  <text x="195" y="110" font-size="10" fill="#666666" text-anchor="middle">every request individually signed</text>

  <text x="45" y="130" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">GET /photos?file=vacation.jpg&amp;size=original</text>
  <text x="45" y="144" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">Host: photos.example.net</text>
  <text x="45" y="160" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">Authorization: OAuth</text>
  <text x="55" y="174" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_consumer_key="dpf43f3p2l4k3l03",</text>
  <text x="55" y="187" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_token="nnch734d00sl2jdk",</text>
  <text x="55" y="200" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_signature_method="HMAC-SHA1",</text>
  <text x="55" y="213" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_timestamp="1191242096",</text>
  <text x="55" y="226" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_nonce="kllo9940pd9333jh",</text>
  <text x="55" y="239" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_version="1.0",</text>
  <text x="55" y="252" font-size="9" fill="#333333" font-family="'Courier New', monospace">oauth_signature="tR3%2BTy81lMeY...%3D"</text>

  <text x="45" y="278" font-size="10" fill="#8a5a1c" font-weight="bold">requires:</text>
  <text x="55" y="293" font-size="9.5" fill="#333333">a per-request HMAC-SHA1/RSA-SHA1/PLAINTEXT</text>
  <text x="55" y="306" font-size="9.5" fill="#333333">signature, a nonce + timestamp, and exact</text>
  <text x="55" y="319" font-size="9.5" fill="#333333">canonicalisation of the URL and parameters --</text>
  <text x="55" y="332" font-size="9.5" fill="#333333">TLS is optional (the signature protects</text>
  <text x="55" y="345" font-size="9.5" fill="#333333">integrity, not confidentiality)</text>

  <text x="45" y="368" font-size="9.5" fill="#a33" font-weight="bold">token holder can forge nothing without the</text>
  <text x="45" y="381" font-size="9.5" fill="#a33" font-weight="bold">secret, but implementing the signature</text>
  <text x="45" y="394" font-size="9.5" fill="#a33" font-weight="bold">correctly is the developer's problem</text>

  <!-- OAuth 2.0 box -->
  <rect x="400" y="70" width="330" height="320" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="565" y="94" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">OAuth 2.0 (RFC 6749/6750)</text>
  <text x="565" y="110" font-size="10" fill="#666666" text-anchor="middle">one bearer token, presented as-is</text>

  <text x="415" y="130" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">GET /photos?file=vacation.jpg&amp;size=original</text>
  <text x="415" y="144" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">Host: photos.example.net</text>
  <text x="415" y="160" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">Authorization: Bearer 2YotnFZFEjr1zCsic</text>
  <text x="425" y="174" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">MWpAA</text>

  <text x="415" y="200" font-size="10" fill="#1c4b73" font-weight="bold">requires:</text>
  <text x="425" y="215" font-size="9.5" fill="#333333">no per-request cryptography and no</text>
  <text x="425" y="228" font-size="9.5" fill="#333333">canonicalisation -- the token is opaque to</text>
  <text x="425" y="241" font-size="9.5" fill="#333333">the client; *mandatory* TLS end to end, since</text>
  <text x="425" y="254" font-size="9.5" fill="#333333">the token is a bearer credential in transit</text>

  <text x="415" y="280" font-size="9.5" fill="#a33" font-weight="bold">whoever holds the token can use it -- there is</text>
  <text x="415" y="293" font-size="9.5" fill="#a33" font-weight="bold">no built-in proof of possession, which is why</text>
  <text x="415" y="306" font-size="9.5" fill="#a33" font-weight="bold">DPoP / mTLS (see</text>
  <text x="415" y="319" font-size="9.5" fill="#a33" font-weight="bold">sender-constrained-tokens-dpop-and-mtls)</text>
  <text x="415" y="332" font-size="9.5" fill="#a33" font-weight="bold">exist for high-value tokens</text>

  <text x="565" y="360" font-size="9.5" fill="#2d6a34" font-weight="bold">much simpler for the client; the burden</text>
  <text x="565" y="373" font-size="9.5" fill="#2d6a34" font-weight="bold" text-anchor="middle">moves to protecting the token in transit</text>
  <text x="565" y="386" font-size="9.5" fill="#2d6a34" font-weight="bold" text-anchor="middle">and at rest</text>
</svg>
