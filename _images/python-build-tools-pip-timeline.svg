<svg viewBox="0 0 980 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="980" height="360" fill="#ffffff"/>
<text x="490" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">pip milestones, 2020 to 2026</text>
<text x="490" y="48" font-size="12" fill="#666666" text-anchor="middle">Dates from the pip changelog; one release per quarter, version YY.N</text>

<!-- axis -->
<line x1="40" y1="180" x2="940" y2="180" stroke="#444444" stroke-width="2"/>
<g font-size="11" fill="#555555" text-anchor="middle">
<text x="70" y="200">2020</text><text x="200" y="200">2021</text><text x="330" y="200">2022</text><text x="460" y="200">2023</text>
<text x="590" y="200">2024</text><text x="720" y="200">2025</text><text x="850" y="200">2026</text>
</g>

<!-- 20.3 -->
<circle cx="105" cy="180" r="7" fill="#1c4b73"/>
<line x1="105" y1="173" x2="105" y2="110" stroke="#1c4b73"/>
<rect x="40" y="62" width="150" height="48" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="115" y="80" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">20.3 (2020-11-30)</text>
<text x="115" y="98" font-size="11" fill="#333333" text-anchor="middle">backtracking resolver</text>

<!-- 21.3 -->
<circle cx="303" cy="180" r="7" fill="#2e7d32"/>
<line x1="303" y1="187" x2="303" y2="240" stroke="#2e7d32"/>
<rect x="223" y="240" width="160" height="48" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="303" y="258" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">21.3 (2021-10-11)</text>
<text x="303" y="276" font-size="11" fill="#333333" text-anchor="middle">PEP 660 editables, in-tree builds</text>

<!-- 23.0 -->
<circle cx="465" cy="180" r="7" fill="#a65e00"/>
<line x1="465" y1="173" x2="465" y2="110" stroke="#a65e00"/>
<rect x="385" y="62" width="160" height="48" fill="#fff4e0" stroke="#a65e00"/>
<text x="465" y="80" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">23.0 (2023-01-30)</text>
<text x="465" y="98" font-size="11" fill="#333333" text-anchor="middle">PEP 668 externally managed</text>

<!-- 25.1 -->
<circle cx="760" cy="180" r="7" fill="#6a1b9a"/>
<line x1="760" y1="187" x2="760" y2="240" stroke="#6a1b9a"/>
<rect x="640" y="240" width="170" height="64" fill="#f3e5f5" stroke="#6a1b9a"/>
<text x="725" y="258" font-size="12" font-weight="bold" fill="#4a148c" text-anchor="middle">25.1 (2025-04-26)</text>
<text x="725" y="276" font-size="11" fill="#333333" text-anchor="middle">--group (PEP 735),</text>
<text x="725" y="292" font-size="11" fill="#333333" text-anchor="middle">pip lock (experimental)</text>

<!-- 25.3 -->
<circle cx="815" cy="180" r="7" fill="#b71c1c"/>
<line x1="815" y1="173" x2="815" y2="110" stroke="#b71c1c"/>
<rect x="625" y="62" width="200" height="48" fill="#ffebee" stroke="#b71c1c"/>
<text x="725" y="80" font-size="12" font-weight="bold" fill="#8e0000" text-anchor="middle">25.3 (2025-10-24)</text>
<text x="725" y="98" font-size="11" fill="#333333" text-anchor="middle">PEP 517 only, setup.py develop gone</text>

<!-- 26.2 -->
<circle cx="910" cy="180" r="7" fill="#00695c"/>
<line x1="910" y1="187" x2="910" y2="240" stroke="#00695c"/>
<rect x="820" y="240" width="150" height="80" fill="#e0f2f1" stroke="#00695c"/>
<text x="895" y="258" font-size="12" font-weight="bold" fill="#004d40" text-anchor="middle">26.2 (2026-07-29)</text>
<text x="895" y="276" font-size="11" fill="#333333" text-anchor="middle">--only-deps,</text>
<text x="895" y="292" font-size="11" fill="#333333" text-anchor="middle">build constraints only,</text>
<text x="895" y="308" font-size="11" fill="#333333" text-anchor="middle">CVE-2026-13346 fix</text>

<text x="490" y="345" font-size="10" fill="#888888" text-anchor="middle">26.2.2 (2026-10-20) is the baseline of this section. Only the latest pip release is supported.</text>
</svg>
