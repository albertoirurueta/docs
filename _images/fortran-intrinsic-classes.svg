<svg viewBox="0 0 1010 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The eight classes of Fortran intrinsic procedures with their counts in Table 16.1 and their pure or simple status</title>
  <rect x="0" y="0" width="1010" height="470" fill="#ffffff"/>
  <text x="505" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The eight classes of intrinsic procedures</text>
  <text x="505" y="46" font-size="12" fill="#666666" text-anchor="middle">counts are the names in Table 16.1 of J3/23-007r1 (bessel_jn and bessel_yn belong to two classes)</text>

  <text x="20" y="80" font-size="14" font-weight="bold" fill="#1c4b73">Functions: all standard intrinsic functions are simple (hence pure)</text>
  <line x1="20" y1="88" x2="990" y2="88" stroke="#1c4b73"/>

  <rect x="20" y="98" width="310" height="120" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="32" y="122" font-size="14" font-weight="bold" fill="#1c4b73">Inquiry (28)</text>
  <text x="32" y="144" font-size="12" fill="#222222">result depends on properties, not values</text>
  <text x="32" y="162" font-size="12" fill="#222222">argument may be undefined, unallocated</text>
  <text x="32" y="180" font-size="12" fill="#222222">or a disassociated pointer</text>
  <text x="32" y="204" font-size="12" font-family="Courier New, monospace" fill="#222222">size  kind  huge  present  rank</text>

  <rect x="350" y="98" width="310" height="120" fill="#e9f3e6" stroke="#2f6b2a"/>
  <text x="362" y="122" font-size="14" font-weight="bold" fill="#2f6b2a">Elemental (117)</text>
  <text x="362" y="144" font-size="12" fill="#222222">defined for scalars, applied to arrays</text>
  <text x="362" y="162" font-size="12" fill="#222222">element by element; result has the shape</text>
  <text x="362" y="180" font-size="12" fill="#222222">of the array argument</text>
  <text x="362" y="204" font-size="12" font-family="Courier New, monospace" fill="#222222">sqrt  sind  hypot  merge  iand</text>

  <rect x="680" y="98" width="310" height="120" fill="#fdf0d5" stroke="#a56a00"/>
  <text x="692" y="122" font-size="14" font-weight="bold" fill="#a56a00">Transformational (43)</text>
  <text x="692" y="144" font-size="12" fill="#222222">all other functions: whole-array or</text>
  <text x="692" y="162" font-size="12" fill="#222222">whole-object arguments, result computed</text>
  <text x="692" y="180" font-size="12" fill="#222222">from all of them</text>
  <text x="692" y="204" font-size="12" font-family="Courier New, monospace" fill="#222222">sum  matmul  reshape  trim  null</text>

  <text x="20" y="262" font-size="14" font-weight="bold" fill="#7a1f1f">Subroutines: called with call; only four standard ones are pure or simple</text>
  <line x1="20" y1="270" x2="990" y2="270" stroke="#7a1f1f"/>

  <rect x="20" y="280" width="190" height="170" fill="#ffffff" stroke="#2f6b2a"/>
  <text x="30" y="302" font-size="13" font-weight="bold" fill="#2f6b2a">Elemental (1)</text>
  <text x="30" y="322" font-size="11.5" fill="#222222">simple, applied to arrays</text>
  <text x="30" y="346" font-size="12" font-family="Courier New, monospace" fill="#222222">mvbits</text>

  <rect x="220" y="280" width="190" height="170" fill="#ffffff" stroke="#2f6b2a"/>
  <text x="230" y="302" font-size="13" font-weight="bold" fill="#2f6b2a">Simple (3)</text>
  <text x="230" y="322" font-size="11.5" fill="#222222">usable in pure code</text>
  <text x="230" y="346" font-size="12" font-family="Courier New, monospace" fill="#222222">split</text>
  <text x="230" y="364" font-size="12" font-family="Courier New, monospace" fill="#222222">tokenize</text>
  <text x="230" y="382" font-size="12" font-family="Courier New, monospace" fill="#222222">move_alloc</text>
  <text x="230" y="404" font-size="10.5" fill="#666666">(move_alloc: if from is no coarray)</text>

  <rect x="420" y="280" width="190" height="170" fill="#ffffff" stroke="#7a1f1f"/>
  <text x="430" y="302" font-size="13" font-weight="bold" fill="#7a1f1f">Impure (11)</text>
  <text x="430" y="322" font-size="11.5" fill="#222222">not allowed in pure procedures</text>
  <text x="430" y="346" font-size="12" font-family="Courier New, monospace" fill="#222222">random_number</text>
  <text x="430" y="364" font-size="12" font-family="Courier New, monospace" fill="#222222">system_clock</text>
  <text x="430" y="382" font-size="12" font-family="Courier New, monospace" fill="#222222">cpu_time</text>
  <text x="430" y="400" font-size="12" font-family="Courier New, monospace" fill="#222222">get_command_argument</text>

  <rect x="620" y="280" width="180" height="170" fill="#ffffff" stroke="#7a1f1f"/>
  <text x="630" y="302" font-size="13" font-weight="bold" fill="#7a1f1f">Atomic (11)</text>
  <text x="630" y="322" font-size="11.5" fill="#222222">act on one coarray atom</text>
  <text x="630" y="346" font-size="12" font-family="Courier New, monospace" fill="#222222">atomic_add</text>
  <text x="630" y="364" font-size="12" font-family="Courier New, monospace" fill="#222222">atomic_cas</text>
  <text x="630" y="382" font-size="12" font-family="Courier New, monospace" fill="#222222">atomic_ref</text>

  <rect x="810" y="280" width="180" height="170" fill="#ffffff" stroke="#7a1f1f"/>
  <text x="820" y="302" font-size="13" font-weight="bold" fill="#7a1f1f">Collective (5)</text>
  <text x="820" y="322" font-size="11.5" fill="#222222">all images of a team call it</text>
  <text x="820" y="346" font-size="12" font-family="Courier New, monospace" fill="#222222">co_sum</text>
  <text x="820" y="364" font-size="12" font-family="Courier New, monospace" fill="#222222">co_max</text>
  <text x="820" y="382" font-size="12" font-family="Courier New, monospace" fill="#222222">co_broadcast</text>
</svg>
