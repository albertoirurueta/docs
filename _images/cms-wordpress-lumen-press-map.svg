<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Map of the Lumen Press site built across the WordPress sub-section</title>
  <desc id="d">A self-hosted WordPress 7.1 site at lumenpress.example sits in the middle, backed by MariaDB and a Redis object cache. The lumen block theme, with lumen-child and the classic lumen-classic theme, renders the front end for visitors. The lumen-catalog plugin adds the lp_book post type, its taxonomies and meta, a settings screen, a stock-sync cron job and a WP-CLI command. Its blocks (book card, latest books, series shelf, book shelf, wishlist, local bookshop and call to action) appear in the editor and in theme templates. The plugin's REST namespace lumen/v1 and the core REST API feed a Next.js reader app, and abilities such as lumen/get-book and lumen/summarize-book are exposed to AI agents through the MCP Adapter.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8eef4"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="12" fill="#2b3a4a"/>
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Lumen Press: what the sub-section builds</text>

  <g stroke="#e8eef4" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M380 236 L380 196"/>
    <path d="M270 277 L222 277"/>
    <path d="M490 268 L538 268"/>
    <path d="M330 318 L250 382"/>
    <path d="M430 318 L510 382"/>
    <path d="M380 318 L380 470"/>
  </g>

  <g font-size="12" fill="#1b2733">
    <rect x="270" y="236" width="220" height="82" rx="10" fill="#fbe5c8"/>
    <text x="380" y="258" text-anchor="middle" font-weight="bold">WordPress 7.1 core</text>
    <text x="380" y="277" text-anchor="middle">lumenpress.example (production)</text>
    <text x="380" y="294" text-anchor="middle">lumenpress.test (local, staging)</text>
    <text x="380" y="311" text-anchor="middle">hooks, roles, WP_Query, REST</text>

    <rect x="240" y="56" width="280" height="140" rx="10" fill="#d9ead3"/>
    <text x="380" y="78" text-anchor="middle" font-weight="bold">Plugin lumen-catalog</text>
    <text x="254" y="100">lp_book post type at /books/</text>
    <text x="254" y="118">lp_genre and lp_series taxonomies</text>
    <text x="254" y="136">meta lp_isbn, lp_pages, lp_published_on</text>
    <text x="254" y="154">Catalogue Manager role, settings screen</text>
    <text x="254" y="172">cron lp_catalog_sync_stock</text>
    <text x="254" y="190">wp lumen import, privacy exporter</text>

    <rect x="20" y="206" width="198" height="124" rx="10" fill="#cfe3f7"/>
    <text x="119" y="228" text-anchor="middle" font-weight="bold">Themes</text>
    <text x="32" y="250">lumen: block theme,</text>
    <text x="32" y="268">theme.json v3, patterns,</text>
    <text x="32" y="286">Paper and Midnight variations</text>
    <text x="32" y="304">lumen-child</text>
    <text x="32" y="322">lumen-classic (teaching only)</text>

    <rect x="542" y="196" width="198" height="144" rx="10" fill="#e6dcf2"/>
    <text x="641" y="218" text-anchor="middle" font-weight="bold">Blocks (lumen/...)</text>
    <text x="554" y="240">book-card (static)</text>
    <text x="554" y="258">latest-books (dynamic)</text>
    <text x="554" y="276">series-shelf, book-shelf</text>
    <text x="554" y="294">wishlist (Interactivity API)</text>
    <text x="554" y="312">local-bookshop (block hook)</text>
    <text x="554" y="330">call-to-action (PHP only)</text>

    <rect x="80" y="382" width="250" height="78" rx="10" fill="#cfe3f7"/>
    <text x="205" y="404" text-anchor="middle" font-weight="bold">Headless reader app</text>
    <text x="205" y="424" text-anchor="middle">Next.js over /wp-json/wp/v2</text>
    <text x="205" y="442" text-anchor="middle">and the lumen/v1 namespace</text>

    <rect x="430" y="382" width="250" height="78" rx="10" fill="#e6dcf2"/>
    <text x="555" y="404" text-anchor="middle" font-weight="bold">AI agents via MCP Adapter</text>
    <text x="555" y="424" text-anchor="middle">abilities lumen/get-book,</text>
    <text x="555" y="442" text-anchor="middle">lumen/summarize-book</text>

    <rect x="200" y="470" width="360" height="72" rx="10" fill="#f4d4d4"/>
    <text x="380" y="492" text-anchor="middle" font-weight="bold">Operations</text>
    <text x="380" y="512" text-anchor="middle">MariaDB, Redis object cache, nginx or Apache,</text>
    <text x="380" y="530" text-anchor="middle">WP-CLI, backups, CI/CD, Multisite imprints</text>
  </g>
</svg>
