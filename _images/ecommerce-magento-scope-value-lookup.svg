<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Where Magento looks for a configuration value</title>
  <desc id="d">A configuration value is resolved from the most specific scope to the least specific one: the store view, then the website, then the default scope in the core_config_data table. Values in the system section of config.php or env.php win over the database and lock the field in the Admin. When nothing is stored the default of the module config.xml applies.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="30" width="160" height="100" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="90.0" y="57" text-anchor="middle" font-weight="bold">1. Store view</text>
  <text x="90.0" y="75" text-anchor="middle">config:set, scope</text>
  <text x="90.0" y="93" text-anchor="middle">stores</text>
  <text x="90.0" y="111" text-anchor="middle">core_config_data</text>
  <rect x="200" y="30" width="160" height="100" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="280.0" y="57" text-anchor="middle" font-weight="bold">2. Website</text>
  <text x="280.0" y="75" text-anchor="middle">config:set, scope</text>
  <text x="280.0" y="93" text-anchor="middle">websites</text>
  <text x="280.0" y="111" text-anchor="middle">core_config_data</text>
  <rect x="390" y="30" width="160" height="100" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="470.0" y="57" text-anchor="middle" font-weight="bold">3. Default</text>
  <text x="470.0" y="75" text-anchor="middle">config:set, scope</text>
  <text x="470.0" y="93" text-anchor="middle">default</text>
  <text x="470.0" y="111" text-anchor="middle">core_config_data</text>
  <rect x="580" y="30" width="140" height="100" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="650.0" y="57" text-anchor="middle" font-weight="bold">4. config.xml</text>
  <text x="650.0" y="75" text-anchor="middle">default of the</text>
  <text x="650.0" y="93" text-anchor="middle">module that</text>
  <text x="650.0" y="111" text-anchor="middle">declares the path</text>
  <rect x="750" y="30" width="140" height="100" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="820.0" y="57" text-anchor="middle" font-weight="bold">Value used</text>
  <text x="820.0" y="75" text-anchor="middle">first one found</text>
  <text x="820.0" y="93" text-anchor="middle">wins, from the</text>
  <text x="820.0" y="111" text-anchor="middle">left to the right</text>
  <line x1="170" y1="80" x2="198" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="80" x2="388" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="80" x2="578" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="80" x2="748" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="190" width="880" height="110" rx="12" fill="#e67e22" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450.0" y="231" text-anchor="middle" font-weight="bold">Locked values: system section of app/etc/config.php or app/etc/env.php</text>
  <text x="450.0" y="249" text-anchor="middle">environment variables CONFIG__DEFAULT__..., CONFIG__WEBSITES__..., CONFIG__STORES__...</text>
  <text x="450.0" y="267" text-anchor="middle">override the database for that path and scope, and the Admin shows the field as read-only</text>
  <line x1="450" y1="190" x2="450" y2="132" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="450" y="330" text-anchor="middle" font-size="12" opacity="0.85">Magento\Config\App\Config\Type\System merges the sources into one tree per scope and caches it in the config cache type.</text>
</svg>
