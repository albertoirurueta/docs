<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="740" height="330" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Status life of one section</text>
  <g stroke-width="2">
    <rect x="20" y="90" width="150" height="70" rx="12" fill="#F3F4F6" stroke="#4B5563"/>
    <rect x="215" y="90" width="150" height="70" rx="12" fill="#D1FAE5" stroke="#047857"/>
    <rect x="410" y="90" width="150" height="70" rx="12" fill="#FEF3C7" stroke="#B45309"/>
    <rect x="590" y="90" width="130" height="70" rx="12" fill="#D1FAE5" stroke="#047857"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="95" y="120" fill="#374151">No status</text><text x="290" y="120" fill="#047857">Ready for dev</text>
    <text x="485" y="120" fill="#92400E">Changed</text><text x="655" y="120" fill="#047857">Completed</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="95" y="142">draft work</text><text x="290" y="142">note for the developer</text>
    <text x="485" y="142">set automatically</text><text x="655" y="142">paid plans, higher tier</text>
  </g>
  <g stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="172" y1="125" x2="211" y2="125"/><line x1="367" y1="125" x2="406" y2="125"/>
    <path d="M485,162 C485,215 300,215 290,164" stroke="#B45309"/>
    <path d="M290,88 C290,50 95,50 95,86"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="191" y="108">mark</text>
    <text x="386" y="108">edit</text>
    <text x="395" y="222" fill="#92400E">Done with changes (optional reason)</text>
    <text x="192" y="46">Remove status</text>
  </g>
  <text x="575" y="178" font-size="11" fill="#374151" text-anchor="middle">Mark as completed (from Ready for dev)</text>
  <path d="M290,162 C290,260 640,260 655,164" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="20" y="270" width="700" height="44" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="370" y="290" font-size="12" fill="#374151" text-anchor="middle">Full or Dev seats change statuses; developers are notified on first mark, and on later updates on higher tiers.</text>
  <text x="370" y="306" font-size="12" fill="#374151" text-anchor="middle">Instance updates from libraries and changed variable or style values do not set Changed.</text>
</svg>
