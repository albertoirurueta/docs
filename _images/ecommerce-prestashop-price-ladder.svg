<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How three bags of Pocket Coffee Ethiopia whole bean 250 g reach 27.94 EUR for a Coffee Club member in Madrid</title>
  <desc id="d">Six stages from left to right: base price 8.90 plus combination impact 1.00 gives 9.90, the specific price of 5 percent from three units gives 9.405, the group reduction of 0 percent keeps 9.405, Spanish reduced VAT of 10 percent gives 10.3455 per unit, three units rounded per line give 31.04, and the Coffee Club cart rule takes 3.10 off for 27.94.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold">Unit price steps (Product::priceCalculation) and cart steps (Cart::getOrderTotal)</text>

  <rect x="10" y="50" width="130" height="150" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="75" y="76" text-anchor="middle" font-weight="bold">1. Base</text>
  <text x="75" y="98" text-anchor="middle">product price</text>
  <text x="75" y="116" text-anchor="middle">8.90</text>
  <text x="75" y="138" text-anchor="middle">+ combination</text>
  <text x="75" y="156" text-anchor="middle">impact 1.00</text>
  <text x="75" y="184" text-anchor="middle" font-weight="bold">9.90</text>

  <rect x="160" y="50" width="130" height="150" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="225" y="76" text-anchor="middle" font-weight="bold">2. Specific price</text>
  <text x="225" y="98" text-anchor="middle">5% from 3 units</text>
  <text x="225" y="116" text-anchor="middle">(counted over the</text>
  <text x="225" y="134" text-anchor="middle">whole product)</text>
  <text x="225" y="184" text-anchor="middle" font-weight="bold">9.405</text>

  <rect x="310" y="50" width="130" height="150" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="375" y="76" text-anchor="middle" font-weight="bold">3. Group</text>
  <text x="375" y="98" text-anchor="middle">reduction</text>
  <text x="375" y="116" text-anchor="middle">Coffee Club: 0%</text>
  <text x="375" y="134" text-anchor="middle">(5% would give</text>
  <text x="375" y="152" text-anchor="middle">8.9347)</text>
  <text x="375" y="184" text-anchor="middle" font-weight="bold">9.405</text>

  <rect x="460" y="50" width="130" height="150" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="525" y="76" text-anchor="middle" font-weight="bold">4. Tax</text>
  <text x="525" y="98" text-anchor="middle">rules group of the</text>
  <text x="525" y="116" text-anchor="middle">delivery address:</text>
  <text x="525" y="134" text-anchor="middle">Spain, 10%</text>
  <text x="525" y="184" text-anchor="middle" font-weight="bold">10.3455</text>

  <rect x="610" y="50" width="130" height="150" rx="12" fill="#f1c40f" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="675" y="76" text-anchor="middle" font-weight="bold">5. Cart line</text>
  <text x="675" y="98" text-anchor="middle">quantity 3</text>
  <text x="675" y="116" text-anchor="middle">rounded per line</text>
  <text x="675" y="134" text-anchor="middle">(PS_ROUND_TYPE 2)</text>
  <text x="675" y="184" text-anchor="middle" font-weight="bold">31.04</text>

  <rect x="760" y="50" width="130" height="150" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="825" y="76" text-anchor="middle" font-weight="bold">6. Cart rule</text>
  <text x="825" y="98" text-anchor="middle">Coffee Club 10%</text>
  <text x="825" y="116" text-anchor="middle">of 28.21 tax excl.</text>
  <text x="825" y="134" text-anchor="middle">= 3.10 tax incl.</text>
  <text x="825" y="184" text-anchor="middle" font-weight="bold">27.94</text>

  <line x1="140" y1="125" x2="158" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="125" x2="308" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="125" x2="458" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="125" x2="608" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="125" x2="758" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="10" y="230" width="580" height="100" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="300" y="256" text-anchor="middle" font-weight="bold">Product level: the same for every cart</text>
  <text x="300" y="278" text-anchor="middle">specific_price rows, group reduction and tax rules are looked up per</text>
  <text x="300" y="296" text-anchor="middle">customer group, country, currency and quantity</text>
  <text x="300" y="316" text-anchor="middle" font-size="11" opacity="0.8">Measured with Product::getPriceStatic() on PrestaShop 9.2.0</text>

  <rect x="610" y="230" width="280" height="100" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="750" y="256" text-anchor="middle" font-weight="bold">Cart level</text>
  <text x="750" y="278" text-anchor="middle">cart rules read the cart lines and</text>
  <text x="750" y="296" text-anchor="middle">are checked again by validateOrder()</text>
  <text x="750" y="316" text-anchor="middle" font-size="11" opacity="0.8">Order detail keeps 9.405 and 5% reduction</text>
</svg>
