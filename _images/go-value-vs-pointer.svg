<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Passing a Book by value and by pointer</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a value argument is copied into the callee's frame; a pointer argument copies only the address, which may point into a stack frame or to the heap</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker>
  </defs>
  <line x1="470" y1="64" x2="470" y2="452" stroke="#dddddd"/>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="235" y="82">byValue(b)  --  func rename(b Book)</text>
    <text x="705" y="82">byPointer(&amp;b)  --  func rename(b *Book)</text>
  </g>

  <!-- LEFT: value -->
  <text x="30" y="108" font-size="12" font-weight="bold" fill="#555555">stack (goroutine)</text>
  <rect x="30" y="116" width="400" height="104" rx="4" fill="#f7f9fb" stroke="#9aa9b8"/>
  <text x="40" y="134" font-size="12" font-weight="bold" fill="#444444">frame of main (the caller)</text>
  <g font-size="13" fill="#222222">
    <text x="50" y="170" font-weight="bold">b</text>
    <rect x="70" y="146" width="110" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="78" y="165">Title ptr/len</text>
    <rect x="180" y="146" width="80" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="188" y="165">Year 1965</text>
  </g>
  <text x="40" y="204" font-size="12" fill="#444444">the caller's variable keeps Year 1965</text>

  <rect x="30" y="236" width="400" height="104" rx="4" fill="#fdf3f1" stroke="#b23a2a"/>
  <text x="40" y="254" font-size="12" font-weight="bold" fill="#444444">frame of rename (the callee)</text>
  <g font-size="13" fill="#222222">
    <text x="50" y="290" font-weight="bold">b</text>
    <rect x="70" y="266" width="110" height="28" fill="#fbe4e0" stroke="#b23a2a"/><text x="78" y="285">Title ptr/len</text>
    <rect x="180" y="266" width="80" height="28" fill="#fbe4e0" stroke="#b23a2a"/><text x="188" y="285">Year 0</text>
  </g>
  <text x="40" y="324" font-size="12" fill="#444444">a separate copy: b.Year = 0 changes only this one</text>
  <line x1="330" y1="160" x2="330" y2="280" stroke="#b23a2a" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="262" y1="160" x2="330" y2="160" stroke="#b23a2a" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="330" y1="280" x2="264" y2="280" stroke="#b23a2a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r)"/>
  <text x="340" y="226" font-size="12" fill="#b23a2a">copy of every field</text>
  <text x="30" y="372" font-size="12" fill="#444444">The text of the title is not copied: the string header is, and both headers</text>
  <text x="30" y="388" font-size="12" fill="#444444">point at the same read-only bytes. The cost of the call grows with the</text>
  <text x="30" y="404" font-size="12" fill="#444444">size of Book, not with the size of its data.</text>

  <!-- RIGHT: pointer -->
  <text x="500" y="108" font-size="12" font-weight="bold" fill="#555555">stack (goroutine)</text>
  <rect x="500" y="116" width="410" height="104" rx="4" fill="#f7f9fb" stroke="#9aa9b8"/>
  <text x="510" y="134" font-size="12" font-weight="bold" fill="#444444">frame of main (the caller)</text>
  <g font-size="13" fill="#222222">
    <text x="520" y="170" font-weight="bold">b</text>
    <rect x="540" y="146" width="110" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="548" y="165">Title ptr/len</text>
    <rect x="650" y="146" width="80" height="28" fill="#e8f0f8" stroke="#1c4b73"/><text x="658" y="165">Year 0</text>
  </g>
  <text x="510" y="204" font-size="12" fill="#444444">Year was written through the pointer</text>

  <rect x="500" y="236" width="410" height="104" rx="4" fill="#fdf3f1" stroke="#b23a2a"/>
  <text x="510" y="254" font-size="12" font-weight="bold" fill="#444444">frame of rename (the callee)</text>
  <g font-size="13" fill="#222222">
    <text x="520" y="290" font-weight="bold">b</text>
    <rect x="540" y="266" width="110" height="28" fill="#fbe4e0" stroke="#b23a2a"/><text x="548" y="285">*Book (8 bytes)</text>
  </g>
  <text x="510" y="324" font-size="12" fill="#444444">only the address is copied</text>
  <path d="M650,280 C830,280 830,160 732,160" fill="none" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="805" y="224" font-size="12" fill="#1c4b73">b.Year = 0</text>

  <!-- heap -->
  <text x="500" y="372" font-size="12" font-weight="bold" fill="#555555">heap (managed by the garbage collector)</text>
  <rect x="500" y="380" width="410" height="68" rx="4" fill="#f4faf4" stroke="#2e7d32" stroke-dasharray="6,4"/>
  <g font-size="13" fill="#222222">
    <rect x="520" y="400" width="110" height="28" fill="#e9f5e9" stroke="#2e7d32"/><text x="528" y="419">Title ptr/len</text>
    <rect x="630" y="400" width="80" height="28" fill="#e9f5e9" stroke="#2e7d32"/><text x="638" y="419">Year</text>
  </g>
  <text x="722" y="415" font-size="12" fill="#444444">only when the value escapes,</text>
  <text x="722" y="431" font-size="12" fill="#444444">e.g. "moved to heap: b"</text>
</svg>
