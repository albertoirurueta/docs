<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="sap-hr-guide-compute-pay-for-a-partial-period-06-three-methods-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-compute-pay-for-a-partial-period-06-three-methods-title">Terminal with two curl commands that calculate Ben payslips with the payment and the deduction method, each answered with HTTP 200 (callout 11), and a curl command that lists the four stored payslips: Ben gross pay is 1854.55 with PWS, 1942.86 with PAYMENT and 1828.57 with DEDUCTION, and the factors are 0.7727, 0.8095 and 0.7619 (callout 12)</title>
<g><rect x="0" y="0" width="1080" height="360" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="328" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w &quot;HTTP %{http_code}\n&quot; --json @http/calc-ben-payment.json http://localhost:4004/odata/v4/payr</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">oll/calculate</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w &quot;HTTP %{http_code}\n&quot; --json @http/calc-ben-deduction.json http://localhost:4004/odata/v4/pa</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">yroll/calculate</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/payroll/Payslips?$select=Number,EmployeeName,Method,Factor,GrossPay,NetPay,P</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">ayment&amp;$orderby=Number'</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Payslips&quot;,&quot;value&quot;:[{&quot;Number&quot;:1,&quot;EmployeeName&quot;:&quot;Ana Torres&quot;,&quot;Method&quot;:&quot;PWS&quot;,&quot;Factor&quot;:&quot;1.000</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">0&quot;,&quot;GrossPay&quot;:&quot;4000.00&quot;,&quot;NetPay&quot;:&quot;2720.00&quot;,&quot;Payment&quot;:&quot;2720.00&quot;},{&quot;Number&quot;:2,&quot;EmployeeName&quot;:&quot;Ben Okoye&quot;,&quot;Method&quot;:&quot;PWS&quot;,</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Factor&quot;:&quot;0.7727&quot;,&quot;GrossPay&quot;:&quot;1854.55&quot;,&quot;NetPay&quot;:&quot;1261.09&quot;,&quot;Payment&quot;:&quot;1236.09&quot;},{&quot;Number&quot;:3,&quot;EmployeeName&quot;:&quot;Ben Okoye&quot;,</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Method&quot;:&quot;PAYMENT&quot;,&quot;Factor&quot;:&quot;0.8095&quot;,&quot;GrossPay&quot;:&quot;1942.86&quot;,&quot;NetPay&quot;:&quot;1321.15&quot;,&quot;Payment&quot;:&quot;1296.15&quot;},{&quot;Number&quot;:4,&quot;Employe</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">eName&quot;:&quot;Ben Okoye&quot;,&quot;Method&quot;:&quot;DEDUCTION&quot;,&quot;Factor&quot;:&quot;0.7619&quot;,&quot;GrossPay&quot;:&quot;1828.57&quot;,&quot;NetPay&quot;:&quot;1243.43&quot;,&quot;Payment&quot;:&quot;1218.43&quot;}</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">]}</text>
