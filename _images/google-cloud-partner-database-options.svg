<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <title>Where each Bookshelf support database can run on Google Cloud</title>
  <desc>A grid with one row per engine (Valkey and Redis, Elasticsearch, Couchbase, Neo4j, Qdrant, Solr, Prometheus) and three columns: Google-operated, Marketplace SaaS, and self-hosted on GKE.</desc>
  <rect width="900" height="470" fill="#f8fafc"/>
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Where each engine can run on Google Cloud</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <rect x="150" y="48" width="230" height="34" rx="6" fill="#1a73e8"/><text x="265" y="70">Operated by Google</text>
    <rect x="390" y="48" width="230" height="34" rx="6" fill="#0f9d58"/><text x="505" y="70">Marketplace SaaS (partner)</text>
    <rect x="630" y="48" width="250" height="34" rx="6" fill="#7e57c2"/><text x="755" y="70">Self-hosted on GKE</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#1f2937">
    <text x="20" y="116">Valkey / Redis</text>
    <text x="20" y="168">Elasticsearch</text>
    <text x="20" y="220">Couchbase</text>
    <text x="20" y="272">Neo4j</text>
    <text x="20" y="324">Qdrant</text>
    <text x="20" y="376">Solr</text>
    <text x="20" y="428">Prometheus</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="10" y1="132" x2="890" y2="132"/><line x1="10" y1="184" x2="890" y2="184"/>
    <line x1="10" y1="236" x2="890" y2="236"/><line x1="10" y1="288" x2="890" y2="288"/>
    <line x1="10" y1="340" x2="890" y2="340"/><line x1="10" y1="392" x2="890" y2="392"/>
  </g>
  <g font-size="12" fill="#1f2937">
    <rect x="150" y="94" width="230" height="30" rx="5" fill="#e8f0fe" stroke="#1a73e8"/><text x="162" y="113">Memorystore for Valkey / Redis Cluster</text>
    <rect x="390" y="94" width="230" height="30" rx="5" fill="#e6f4ea" stroke="#0f9d58"/><text x="402" y="113">Redis Cloud</text>
    <rect x="630" y="94" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="113">Possible, rarely worth it</text>

    <rect x="150" y="146" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="162" y="165">Agent Search (alternative)</text>
    <rect x="390" y="146" width="230" height="30" rx="5" fill="#e6f4ea" stroke="#0f9d58"/><text x="402" y="165">Elastic Cloud</text>
    <rect x="630" y="146" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="165">ECK operator</text>

    <rect x="150" y="198" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="162" y="217">None</text>
    <rect x="390" y="198" width="230" height="30" rx="5" fill="#e6f4ea" stroke="#0f9d58"/><text x="402" y="217">Couchbase Capella</text>
    <rect x="630" y="198" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="217">Autonomous Operator</text>

    <rect x="150" y="250" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="162" y="269">Spanner Graph (alternative)</text>
    <rect x="390" y="250" width="230" height="30" rx="5" fill="#e6f4ea" stroke="#0f9d58"/><text x="402" y="269">Neo4j AuraDB</text>
    <rect x="630" y="250" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="269">Helm chart</text>

    <rect x="150" y="302" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="162" y="321">Vector search in managed DBs</text>
    <rect x="390" y="302" width="230" height="30" rx="5" fill="#e6f4ea" stroke="#0f9d58"/><text x="402" y="321">Qdrant Cloud</text>
    <rect x="630" y="302" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="321">Helm chart (Google tutorial)</text>

    <rect x="150" y="354" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="162" y="373">None (Agent Search alternative)</text>
    <rect x="390" y="354" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="402" y="373">None</text>
    <rect x="630" y="354" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="373">Solr Operator</text>

    <rect x="150" y="406" width="230" height="30" rx="5" fill="#e8f0fe" stroke="#1a73e8"/><text x="162" y="425">Managed Service for Prometheus</text>
    <rect x="390" y="406" width="230" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="402" y="425">Grafana Cloud (optional)</text>
    <rect x="630" y="406" width="250" height="30" rx="5" fill="#ede7f6" stroke="#7e57c2"/><text x="642" y="425">Self-deployed collection</text>
  </g>
  <text x="450" y="458" font-size="11" text-anchor="middle" fill="#64748b">Solid boxes are the usual choice; dashed boxes mean no direct offering or an alternative product.</text>
</svg>
