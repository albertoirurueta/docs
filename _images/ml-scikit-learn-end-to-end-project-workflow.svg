<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">End-to-end scikit-learn project workflow</title>
<desc id="d">Seven stages: frame the problem and metric, split off a test set, build one preprocessing and model pipeline, compare against a dummy baseline with cross-validation, tune, evaluate once on the test set, then persist with metadata and monitor. The test set is touched only at the sixth stage.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">From question to a persisted pipeline</text>
<rect x="24" y="56" width="150" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="99" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1. Frame</text>
<text x="99" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">metric, baseline, cost</text>
<rect x="285" y="56" width="150" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="360" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">2. Split first</text>
<text x="360" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">hold out the test set</text>
<rect x="546" y="56" width="150" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="621" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">3. One pipeline</text>
<text x="621" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">preprocess + model</text>
<line x1="174" y1="84" x2="281" y2="84" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="435" y1="84" x2="542" y2="84" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M621,112 L621,150 L99,150 L99,170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="174" width="150" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="99" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">4. Compare</text>
<text x="99" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">CV vs dummy baseline</text>
<rect x="285" y="174" width="150" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">5. Tune</text>
<text x="360" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">search with the same CV</text>
<rect x="546" y="174" width="150" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="621" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">6. Test once</text>
<text x="621" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">the only use of test</text>
<line x1="174" y1="202" x2="281" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="435" y1="202" x2="542" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M621,230 L621,262 L360,262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="210" y="244" width="150" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="285" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">7. Persist</text>
<text x="285" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">file + versions + monitor</text>
<text x="660" y="300" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Back to 1 when the monitor drifts</text>
</svg>
