<title id="radar-jvm-t">Radar comparison: JVM languages</title>
<desc id="radar-jvm-d">Scores from 0 to 10 on 9 axes (Popularity, Ecosystem, Performance, Memory, Energy, Learning (ease), Safety, Versatility, Job market) for Java, Kotlin, Scala, Groovy, computed from the sourced CSV data with the rubric in data/NOTES.md (retrieved 2026-10-26). A gap in an outline means no data (n/a) on that axis, not a score of zero; languages with at least one gap: Kotlin, Scala, Groovy.</desc>
<style>
