<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How OrderController chooses the checkout process of a PrestaShop 9.2 shop</title>
  <desc id="d">OrderController asks every module that implements actionCheckoutBuildProcess for a provider. If exactly one enabled provider is returned, its process runs: the single page of the One Page Checkout module. Otherwise the native process runs with four steps: personal information, addresses, delivery and payment. Both end at the payment module action that calls validateOrder.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="10" y="20" width="200" height="90" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="110" y="46" text-anchor="middle" font-weight="bold">GET /order</text>
  <text x="110" y="66" text-anchor="middle">OrderController::bootstrap()</text>
  <text x="110" y="84" text-anchor="middle">buildCheckoutProcess()</text>

  <rect x="260" y="20" width="250" height="90" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="385" y="46" text-anchor="middle" font-weight="bold">Hook actionCheckoutBuildProcess</text>
  <text x="385" y="66" text-anchor="middle">every module may return a provider</text>
  <text x="385" y="84" text-anchor="middle">that implements isEnabled()</text>

  <rect x="560" y="20" width="330" height="90" rx="12" fill="#f1c40f" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="725" y="46" text-anchor="middle" font-weight="bold">Exactly one enabled provider?</text>
  <text x="725" y="66" text-anchor="middle">none, two or more: native process</text>
  <text x="725" y="84" text-anchor="middle">provider returns a non-process: native</text>

  <line x1="210" y1="65" x2="258" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="65" x2="558" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="450" y="150" text-anchor="middle" font-weight="bold">Native process (default in 9.2.0: PS_ONE_PAGE_CHECKOUT_ENABLED is 0)</text>

  <rect x="10" y="165" width="190" height="95" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="105" y="190" text-anchor="middle" font-weight="bold">1. Personal information</text>
  <text x="105" y="210" text-anchor="middle">login or guest form</text>
  <text x="105" y="228" text-anchor="middle">guest checkout allowed</text>
  <text x="105" y="246" text-anchor="middle" font-size="11" opacity="0.8">checkout-personal-information-step</text>

  <rect x="225" y="165" width="190" height="95" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-weight="bold">2. Addresses</text>
  <text x="320" y="210" text-anchor="middle">confirm-addresses=1</text>
  <text x="320" y="228" text-anchor="middle">id_address_delivery</text>
  <text x="320" y="246" text-anchor="middle" font-size="11" opacity="0.8">checkout-addresses-step</text>

  <rect x="440" y="165" width="190" height="95" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="535" y="190" text-anchor="middle" font-weight="bold">3. Delivery</text>
  <text x="535" y="210" text-anchor="middle">confirmDeliveryOption=1</text>
  <text x="535" y="228" text-anchor="middle">delivery_option[address]</text>
  <text x="535" y="246" text-anchor="middle" font-size="11" opacity="0.8">skipped for virtual carts</text>

  <rect x="655" y="165" width="235" height="95" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="772" y="190" text-anchor="middle" font-weight="bold">4. Payment</text>
  <text x="772" y="210" text-anchor="middle">paymentOptions of every module</text>
  <text x="772" y="228" text-anchor="middle">terms checkbox, then one form</text>
  <text x="772" y="246" text-anchor="middle" font-size="11" opacity="0.8">checkout-payment-step</text>

  <line x1="200" y1="212" x2="223" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="212" x2="438" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="212" x2="653" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="450" y="296" text-anchor="middle" font-weight="bold">One Page Checkout (module ps_onepagecheckout, 9.2, off by default)</text>
  <rect x="10" y="310" width="880" height="55" rx="12" fill="#e74c3c" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <text x="450" y="333" text-anchor="middle">One form (opc-form) with contact, addresses, delivery and payment sections, refreshed by AJAX controllers</text>
  <text x="450" y="351" text-anchor="middle">(carriers, selectcarrier, paymentmethods, selectpayment, cartTotals, opcSubmit ...)</text>

  <text x="450" y="396" text-anchor="middle" font-size="12">Both ways end with a POST to /module/MODULE/validation (or similar), which calls PaymentModule::validateOrder()</text>
  <text x="450" y="412" text-anchor="middle" font-size="11" opacity="0.8">Step ids and form names were read from the HTML served by a PrestaShop 9.2.0 shop</text>
</svg>
