<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Two architectures, side by side</text>
  <text x="380" y="42" font-size="10.5" fill="#666666" text-anchor="middle">Kafka: producer-side partitioning into an append-only log -- RabbitMQ: broker-side routing into per-queue-type storage</text>

  <!-- Column headers -->
  <text x="190" y="64" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Apache Kafka</text>
  <text x="575" y="64" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">RabbitMQ</text>

  <!-- Divider -->
  <line x1="380" y1="60" x2="380" y2="452" stroke="#dddddd" stroke-width="1.2"/>

  <!-- ===================== KAFKA SIDE ===================== -->

  <!-- Producer -->
  <rect x="120" y="76" width="140" height="38" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="190" y="100" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Producer</text>

  <!-- Topic outer -->
  <rect x="30" y="138" width="320" height="112" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="190" y="156" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Topic: orders</text>
  <text x="190" y="169" font-size="9" fill="#555555" text-anchor="middle">producer hashes the record key to pick a partition</text>

  <rect x="44" y="180" width="90" height="54" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <text x="89" y="211" font-size="10.5" fill="#222222" text-anchor="middle">Partition 0</text>

  <rect x="145" y="180" width="90" height="54" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <text x="190" y="211" font-size="10.5" fill="#222222" text-anchor="middle">Partition 1</text>

  <rect x="246" y="180" width="90" height="54" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <text x="291" y="211" font-size="10.5" fill="#222222" text-anchor="middle">Partition 2</text>

  <!-- Producer -> Topic -->
  <line x1="190" y1="114" x2="190" y2="138" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowK)"/>

  <!-- Consumer group -->
  <rect x="30" y="290" width="150" height="80" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="105" y="308" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Consumer group</text>
  <text x="105" y="324" font-size="9" fill="#333333" text-anchor="middle">each partition owned by</text>
  <text x="105" y="337" font-size="9" fill="#333333" text-anchor="middle">exactly one consumer;</text>
  <text x="105" y="350" font-size="9" fill="#333333" text-anchor="middle">bulk offset commit</text>

  <!-- Share group -->
  <rect x="200" y="290" width="150" height="80" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="275" y="308" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">Share group</text>
  <text x="275" y="324" font-size="9" fill="#333333" text-anchor="middle">any member acquires any</text>
  <text x="275" y="337" font-size="9" fill="#333333" text-anchor="middle">record under a lock;</text>
  <text x="275" y="350" font-size="9" fill="#333333" text-anchor="middle">per-record ACCEPT/RELEASE</text>

  <!-- Topic -> Consumer group (solid) -->
  <line x1="105" y1="250" x2="105" y2="290" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <!-- Topic -> Share group (dashed) -->
  <line x1="245" y1="250" x2="275" y2="290" stroke="#a33333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>

  <text x="30" y="398" font-size="9.5" fill="#666666">Parallelism capped at partition count (consumer group)</text>
  <text x="30" y="412" font-size="9.5" fill="#666666">vs. uncapped cooperative acquisition (share group).</text>

  <!-- ===================== RABBITMQ SIDE ===================== -->

  <!-- Publisher -->
  <rect x="505" y="76" width="140" height="38" fill="#fff4e5" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="575" y="100" font-size="11.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Publisher</text>

  <!-- Exchange -->
  <rect x="475" y="138" width="200" height="46" fill="#fff4e5" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="575" y="158" font-size="11" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Exchange</text>
  <text x="575" y="172" font-size="8.5" fill="#555555" text-anchor="middle">direct / topic / fanout / headers</text>

  <!-- Publisher -> Exchange -->
  <line x1="575" y1="114" x2="575" y2="138" stroke="#8a5a1c" stroke-width="1.4" marker-end="url(#arrowO)"/>

  <!-- Queues -->
  <rect x="410" y="216" width="90" height="52" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="455" y="240" font-size="10" fill="#222222" text-anchor="middle">Classic</text>
  <text x="455" y="252" font-size="10" fill="#222222" text-anchor="middle">queue</text>

  <rect x="530" y="216" width="90" height="52" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="575" y="240" font-size="10" fill="#222222" text-anchor="middle">Quorum</text>
  <text x="575" y="252" font-size="10" fill="#222222" text-anchor="middle">queue</text>

  <rect x="650" y="216" width="90" height="52" fill="#ffffff" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="695" y="240" font-size="10" fill="#222222" text-anchor="middle">Stream</text>

  <!-- Exchange -> Queues via bindings (dashed, routing-key labeled once) -->
  <line x1="530" y1="184" x2="455" y2="216" stroke="#8a5a1c" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>
  <line x1="575" y1="184" x2="575" y2="216" stroke="#8a5a1c" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>
  <line x1="620" y1="184" x2="695" y2="216" stroke="#8a5a1c" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>
  <text x="575" y="200" font-size="8.5" fill="#777777" text-anchor="middle">bindings (routing key match)</text>

  <!-- Consumers -->
  <rect x="410" y="290" width="330" height="80" fill="#f7f7f7" stroke="#555555" stroke-width="1.2"/>
  <text x="575" y="308" font-size="11" font-weight="bold" fill="#333333" text-anchor="middle">Consumers</text>
  <text x="575" y="324" font-size="9" fill="#333333" text-anchor="middle">competing consumers, bounded by per-consumer prefetch (QoS) --</text>
  <text x="575" y="337" font-size="9" fill="#333333" text-anchor="middle">or single active consumer, where only one member is</text>
  <text x="575" y="350" font-size="9" fill="#333333" text-anchor="middle">delivered to at a time for strict ordering</text>

  <!-- Queues -> Consumers -->
  <line x1="455" y1="268" x2="500" y2="290" stroke="#555555" stroke-width="1.2" marker-end="url(#arrowGrey)"/>
  <line x1="575" y1="268" x2="575" y2="290" stroke="#555555" stroke-width="1.2" marker-end="url(#arrowGrey)"/>
  <line x1="695" y1="268" x2="650" y2="290" stroke="#555555" stroke-width="1.2" marker-end="url(#arrowGrey)"/>

  <text x="410" y="398" font-size="9.5" fill="#666666">Routing decided broker-side, at publish time, and</text>
  <text x="410" y="412" font-size="9.5" fill="#666666">changeable at runtime by adding or removing a binding.</text>

  <defs>
    <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2d6a34"/>
    </marker>
    <marker id="arrowR" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#a33333"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a5a1c"/>
    </marker>
    <marker id="arrowGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <line x1="30" y1="440" x2="30" y2="440" stroke="none"/>
  <text x="30" y="440" font-size="10.5" fill="#666666">Kafka: parallel unit is the partition, addressed only via its topic --</text>
  <text x="30" y="454" font-size="10.5" fill="#666666">routing is a producer-side decision baked in before the broker sees the record.</text>
  <text x="410" y="440" font-size="10.5" fill="#666666">RabbitMQ: parallel unit is the queue (or, for a super stream,</text>
  <text x="410" y="454" font-size="10.5" fill="#666666">one of its member streams) -- the broker itself decides where each message goes.</text>
</svg>
