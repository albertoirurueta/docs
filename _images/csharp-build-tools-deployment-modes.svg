<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtDeployArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What each publishing mode puts in the publish folder</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">samples/Ledgerline.Report, Release, linux-x64 -- folders measured with .NET SDK 10.0.402</text>
<rect x="20" y="74" width="184" height="330" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="112.0" y="98" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Framework-dependent</text>
<text x="112.0" y="116" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">needs .NET 10 installed</text>
<text x="112.0" y="136" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">7 files, 132 KB</text>
<line x1="30" y1="146" x2="194" y2="146" stroke="#555555" stroke-width="1"/>
<text x="30" y="170" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report</text>
<text x="30" y="196" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (apphost)</text>
<text x="30" y="222" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report.dll</text>
<text x="30" y="248" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.dll</text>
<text x="30" y="274" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.deps.json</text>
<text x="30" y="300" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.runtimeconfig.json</text>
<text x="30" y="326" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.pdb</text>
<text x="30" y="352" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">journal.ledger.csv</text>
<rect x="214" y="74" width="184" height="330" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="306.0" y="98" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Self-contained</text>
<text x="306.0" y="116" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">runtime included</text>
<text x="306.0" y="136" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">194 files, 81 MB</text>
<line x1="224" y1="146" x2="388" y2="146" stroke="#2f6db5" stroke-width="1"/>
<text x="224" y="170" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">the 7 app files</text>
<text x="224" y="196" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">+ 172 runtime .dll</text>
<text x="224" y="222" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (System.*.dll, ...)</text>
<text x="224" y="248" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">+ 14 native .so</text>
<text x="224" y="274" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (libcoreclr.so,</text>
<text x="224" y="300" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">   libclrjit.so, ...)</text>
<text x="224" y="326" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">+ createdump</text>
<rect x="408" y="74" width="184" height="330" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="500.0" y="98" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Single-file</text>
<text x="500.0" y="116" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">one executable bundle</text>
<text x="500.0" y="136" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">3 files, 72 MB</text>
<line x1="418" y1="146" x2="582" y2="146" stroke="#2e7d3b" stroke-width="1"/>
<text x="418" y="170" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report</text>
<text x="418" y="196" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (apphost + app +</text>
<text x="418" y="222" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  runtime bundled)</text>
<text x="418" y="248" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report.pdb</text>
<text x="418" y="274" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">journal.ledger.csv</text>
<text x="418" y="300" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">38 MB with</text>
<text x="418" y="326" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  compression</text>
<rect x="602" y="74" width="184" height="330" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="694.0" y="98" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Trimmed</text>
<text x="694.0" y="116" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">unused code removed</text>
<text x="694.0" y="136" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">37 files, 23 MB</text>
<line x1="612" y1="146" x2="776" y2="146" stroke="#b26a00" stroke-width="1"/>
<text x="612" y="170" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">the 7 app files</text>
<text x="612" y="196" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">+ 15 runtime .dll</text>
<text x="612" y="222" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">+ the 14 native .so</text>
<text x="612" y="248" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">IL2026 warning:</text>
<text x="612" y="274" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">reflection JSON</text>
<text x="612" y="300" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">fails at run time</text>
<rect x="796" y="74" width="184" height="330" rx="6" fill="#f6e8f3" stroke="#8e3b7f"/>
<text x="888.0" y="98" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Native AOT</text>
<text x="888.0" y="116" font-size="11" fill="#555555" text-anchor="middle" font-style="italic">machine code, no JIT</text>
<text x="888.0" y="136" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">2.4 MB executable</text>
<line x1="806" y1="146" x2="970" y2="146" stroke="#8e3b7f" stroke-width="1"/>
<text x="806" y="170" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report</text>
<text x="806" y="196" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (native ELF)</text>
<text x="806" y="222" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">Ledgerline.Report.dbg</text>
<text x="806" y="248" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">  (4.1 MB symbols)</text>
<text x="806" y="274" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">journal.ledger.csv</text>
<text x="806" y="300" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">IL2104 / IL3053:</text>
<text x="806" y="326" font-size="10" fill="#333333" text-anchor="start" font-family="Courier New, monospace">library not AOT-ready</text>
<rect x="20" y="420" width="960" height="74" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
<text x="36" y="442" font-size="12" fill="#333333" text-anchor="start">ReadyToRun is not a separate layout: it precompiles the app assemblies in any mode (here 7 files, 144 KB, framework-dependent).</text>
<text x="36" y="462" font-size="12" fill="#333333" text-anchor="start">Trimming and Native AOT need every library to be trim- and AOT-compatible; Ledgerline 1.0.0 is not, so both runs</text>
<text x="36" y="482" font-size="12" fill="#333333" text-anchor="start">failed with "Reflection-based serialization has been disabled" while the other modes printed the trial balance.</text>
</svg>
