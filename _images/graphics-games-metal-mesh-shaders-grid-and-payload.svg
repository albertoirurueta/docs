<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ms-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From an object grid to mesh grids</text>
<text x="130" y="58" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Object grid</text>
<rect x="30" y="70" width="44" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="52.0" y="95.5" text-anchor="middle" font-size="11" fill="#92400E">O0</text>
<rect x="82" y="70" width="44" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="104.0" y="95.5" text-anchor="middle" font-size="11" fill="#92400E">O1</text>
<rect x="134" y="70" width="44" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="156.0" y="95.5" text-anchor="middle" font-size="11" fill="#92400E">O2</text>
<rect x="186" y="70" width="44" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="208.0" y="95.5" text-anchor="middle" font-size="11" fill="#92400E">O3</text>
<text x="130" y="136" text-anchor="middle" font-size="11" fill="#374151">each one culls its meshlets</text>
<line x1="240" y1="92" x2="262" y2="92" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ms-grid)"/>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Mesh grids (one per object threadgroup)</text>
<text x="320" y="80" text-anchor="middle" font-size="11" fill="#374151">from O0</text>
<rect x="270" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<rect x="303" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="318.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<rect x="336" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="320" y="150" text-anchor="middle" font-size="11" fill="#374151">2 meshlets live</text>
<text x="435" y="80" text-anchor="middle" font-size="11" fill="#374151">from O1</text>
<rect x="385" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="418" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="451" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="435" y="150" text-anchor="middle" font-size="11" fill="#374151">0 meshlets live</text>
<text x="550" y="80" text-anchor="middle" font-size="11" fill="#374151">from O2</text>
<rect x="500" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="515.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<rect x="533" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="548.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<rect x="566" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="581.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<text x="550" y="150" text-anchor="middle" font-size="11" fill="#374151">3 meshlets live</text>
<text x="665" y="80" text-anchor="middle" font-size="11" fill="#374151">from O3</text>
<rect x="615" y="90" width="30" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">M</text>
<rect x="648" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="681" y="90" width="30" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="665" y="150" text-anchor="middle" font-size="11" fill="#374151">1 meshlets live</text>
<rect x="30" y="175" width="700" height="60" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="201.0" text-anchor="middle" font-size="11" fill="#374151">Payload, passed from object to mesh: surviving meshlet indices, the LOD, any per-group data.</text>
<text x="380.0" y="216.0" text-anchor="middle" font-size="11" fill="#374151">Its size is set with payloadMemoryLength on the pipeline descriptor.</text>
<rect x="30" y="255" width="700" height="80" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="283.5" text-anchor="middle" font-size="11" fill="#374151">Object threadgroup size: threadsPerObjectThreadgroup in the draw call.</text>
<text x="380.0" y="298.5" text-anchor="middle" font-size="11" fill="#374151">Mesh threadgroup size: threadsPerMeshThreadgroup in the draw call.</text>
<text x="380.0" y="313.5" text-anchor="middle" font-size="11" fill="#374151">Mesh grid size: set_threadgroups_per_grid in the object function.</text>
</svg>
