<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="mvnRepoArrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
<marker id="mvnRepoArrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="mvnRepoArrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
<marker id="mvnRepoArrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="mvnRepoArrow-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where a Maven dependency comes from: local repository, mirror, proxy, repository manager</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">The path every artifact of the tidepool-ingest build took in the experiments of this page. Numbers give the order</text>

<rect x="40" y="76" width="200" height="64" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="140" y="100" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Your build</text>
<text x="140" y="120" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">mvn compile</text>
<text x="140" y="134" font-size="11" fill="#555555" text-anchor="middle">needs tidepool-model 1.0.0</text>

<line x1="140" y1="140" x2="140" y2="226" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#mvnRepoArrow-g)"/>
<rect x="148" y="174" width="86" height="16" fill="#ffffff"/><text x="191" y="186" font-size="11" fill="#2e7d32" text-anchor="middle">1 look here first</text>

<rect x="40" y="226" width="200" height="118" fill="#e9f5e9" stroke="#2e7d32"/>
<text x="140" y="248" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Local repository</text>
<text x="140" y="268" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">~/.m2/repository</text>
<text x="140" y="286" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">-Dmaven.repo.local</text>
<text x="140" y="304" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">&lt;localRepository&gt;</text>
<text x="140" y="326" font-size="11" fill="#555555" text-anchor="middle">hit: build continues, no network</text>

<rect x="300" y="76" width="240" height="116" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="420" y="98" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">2 Which repositories, in which order</text>
<text x="420" y="120" font-size="11" fill="#222222" text-anchor="middle">settings.xml profiles (first)</text>
<text x="420" y="138" font-size="11" fill="#222222" text-anchor="middle">POM &lt;repositories&gt;, parent POMs</text>
<text x="420" y="156" font-size="11" fill="#222222" text-anchor="middle">Super POM: central (last)</text>
<text x="420" y="178" font-size="11" fill="#555555" text-anchor="middle">first repository with the file wins</text>

<line x1="240" y1="260" x2="300" y2="150" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#mvnRepoArrow-b)"/>
<rect x="246" y="190" width="40" height="16" fill="#ffffff"/><text x="266" y="202" font-size="11" fill="#1c4b73" text-anchor="middle">miss</text>

<line x1="420" y1="192" x2="420" y2="240" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#mvnRepoArrow-p)"/>
<rect x="300" y="240" width="240" height="104" fill="#f3e8f9" stroke="#6a1b9a"/>
<text x="420" y="262" font-size="13" font-weight="bold" fill="#6a1b9a" text-anchor="middle">3 Mirrors (settings.xml)</text>
<text x="420" y="282" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">mirrorOf  *   external:*</text>
<text x="420" y="299" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">external:http:*   a,b   !c</text>
<text x="420" y="320" font-size="11" fill="#555555" text-anchor="middle">replaces the repository URL,</text>
<text x="420" y="334" font-size="11" fill="#555555" text-anchor="middle">server id = mirror id for credentials</text>

<line x1="420" y1="344" x2="420" y2="378" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#mvnRepoArrow-r)"/>
<rect x="300" y="378" width="240" height="64" fill="#fdf3f2" stroke="#b3261e" stroke-dasharray="5,3"/>
<text x="420" y="400" font-size="12" font-weight="bold" fill="#8c1d18" text-anchor="middle">Default HTTP blocker (3.8.1)</text>
<text x="420" y="418" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">external:http:*  &lt;blocked&gt;</text>
<text x="420" y="434" font-size="11" fill="#555555" text-anchor="middle">only if no mirror matched first</text>

<line x1="540" y1="292" x2="590" y2="292" stroke="#555555" stroke-width="1.6" marker-end="url(#mvnRepoArrow-k)"/>
<rect x="590" y="248" width="84" height="88" fill="#f7f7f7" stroke="#999999" stroke-dasharray="5,3"/>
<text x="632" y="272" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">4 HTTP proxy</text>
<text x="632" y="290" font-size="10.5" fill="#555555" text-anchor="middle">&lt;proxy&gt; in</text>
<text x="632" y="304" font-size="10.5" fill="#555555" text-anchor="middle">settings.xml,</text>
<text x="632" y="318" font-size="10.5" fill="#555555" text-anchor="middle">optional</text>

<line x1="674" y1="292" x2="728" y2="292" stroke="#555555" stroke-width="1.6" marker-end="url(#mvnRepoArrow-k)"/>
<rect x="728" y="76" width="204" height="296" fill="#fff4e0" stroke="#a65e00"/>
<text x="830" y="98" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">5 Repository manager</text>
<text x="830" y="114" font-size="10.5" fill="#555555" text-anchor="middle">Nexus, Artifactory, Reposilite</text>
<rect x="744" y="126" width="172" height="40" fill="#ffffff" stroke="#a65e00"/>
<text x="830" y="144" font-size="12" font-weight="bold" fill="#7a4500" text-anchor="middle">group (one URL)</text>
<text x="830" y="159" font-size="10.5" fill="#555555" text-anchor="middle">what the mirror points at</text>
<rect x="744" y="180" width="172" height="34" fill="#ffffff" stroke="#a65e00"/>
<text x="830" y="201" font-size="11.5" fill="#222222" text-anchor="middle">hosted: releases</text>
<rect x="744" y="224" width="172" height="34" fill="#ffffff" stroke="#a65e00"/>
<text x="830" y="245" font-size="11.5" fill="#222222" text-anchor="middle">hosted: snapshots</text>
<rect x="744" y="268" width="172" height="34" fill="#ffffff" stroke="#a65e00"/>
<text x="830" y="289" font-size="11.5" fill="#222222" text-anchor="middle">proxy: Maven Central</text>
<rect x="744" y="312" width="172" height="34" fill="#ffffff" stroke="#a65e00"/>
<text x="830" y="333" font-size="11.5" fill="#222222" text-anchor="middle">proxy: a partner repository</text>
<text x="830" y="364" font-size="10.5" fill="#555555" text-anchor="middle">hosted = published here, proxy = cached</text>

<line x1="800" y1="372" x2="800" y2="418" stroke="#a65e00" stroke-width="1.6" marker-end="url(#mvnRepoArrow-k)"/>
<line x1="880" y1="372" x2="880" y2="418" stroke="#a65e00" stroke-width="1.6" marker-end="url(#mvnRepoArrow-k)"/>
<rect x="744" y="418" width="112" height="40" fill="#f7f7f7" stroke="#999999"/>
<text x="800" y="436" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Maven Central</text>
<text x="800" y="451" font-size="10.5" fill="#555555" text-anchor="middle">on a cache miss</text>
<rect x="868" y="418" width="64" height="40" fill="#f7f7f7" stroke="#999999"/>
<text x="900" y="436" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Partner</text>
<text x="900" y="451" font-size="10.5" fill="#555555" text-anchor="middle">repo</text>

<polyline points="728,350 700,350 700,492 140,492 140,346" fill="none" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#mvnRepoArrow-g)"/>
<rect x="250" y="476" width="400" height="32" fill="#ffffff"/>
<text x="450" y="491" font-size="11" fill="#2e7d32" text-anchor="middle">6 the answer is stored in the local repository with a _remote.repositories record,</text>
<text x="450" y="505" font-size="11" fill="#2e7d32" text-anchor="middle">so the next build is a local hit</text>
</svg>
