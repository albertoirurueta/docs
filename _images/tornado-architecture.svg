<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Bookshelf Live architecture</title>
  <defs>
    <marker id="tar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Bookshelf Live at a glance</text>
  <text x="380" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the running scenario of this section: long-lived connections on one event loop per process</text>

  <!-- Clients -->
  <rect x="20" y="70" width="120" height="190" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="80" y="94" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Clients</text>
  <text x="80" y="118" font-size="11" fill="currentColor" text-anchor="middle">Browser</text>
  <text x="80" y="136" font-size="11" fill="currentColor" text-anchor="middle">curl, HTTPie</text>
  <text x="80" y="154" font-size="11" fill="currentColor" text-anchor="middle">WebSocket chat</text>
  <text x="80" y="172" font-size="11" fill="currentColor" text-anchor="middle">EventSource</text>
  <text x="80" y="190" font-size="11" fill="currentColor" text-anchor="middle">long-poll loop</text>
  <text x="80" y="236" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.8">HTTP, WS, SSE</text>

  <!-- nginx -->
  <rect x="170" y="70" width="110" height="190" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="225" y="94" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">nginx</text>
  <text x="225" y="118" font-size="11" fill="currentColor" text-anchor="middle">TLS termination</text>
  <text x="225" y="136" font-size="11" fill="currentColor" text-anchor="middle">Upgrade headers</text>
  <text x="225" y="154" font-size="11" fill="currentColor" text-anchor="middle">static files</text>
  <text x="225" y="172" font-size="11" fill="currentColor" text-anchor="middle">X-Forwarded-*</text>
  <text x="225" y="236" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.8">upstream pool</text>

  <line x1="140" y1="165" x2="168" y2="165" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>
  <line x1="280" y1="165" x2="318" y2="165" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>

  <!-- Tornado processes -->
  <rect x="320" y="70" width="290" height="270" rx="8" fill="#808080" fill-opacity="0.08" stroke="currentColor" stroke-width="2"/>
  <text x="465" y="92" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Tornado process (one per CPU)</text>
  <text x="465" y="108" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.8">one thread, one asyncio event loop, N copies behind nginx</text>

  <rect x="334" y="120" width="130" height="44" rx="5" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="399" y="140" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">JSON API</text>
  <text x="399" y="155" font-size="10" fill="currentColor" text-anchor="middle">books, reviews</text>

  <rect x="474" y="120" width="124" height="44" rx="5" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="536" y="140" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Auth</text>
  <text x="536" y="155" font-size="10" fill="currentColor" text-anchor="middle">signed cookie, XSRF</text>

  <rect x="334" y="174" width="130" height="44" rx="5" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="399" y="194" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">WebSocket chat</text>
  <text x="399" y="209" font-size="10" fill="currentColor" text-anchor="middle">one room per book</text>

  <rect x="474" y="174" width="124" height="44" rx="5" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="536" y="194" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">New-reviews feed</text>
  <text x="536" y="209" font-size="10" fill="currentColor" text-anchor="middle">long polling, SSE</text>

  <rect x="334" y="228" width="264" height="44" rx="5" fill="#808080" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="466" y="248" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Cover fetcher: bounded queue + workers</text>
  <text x="466" y="263" font-size="10" fill="currentColor" text-anchor="middle">tornado.queues, AsyncHTTPClient, asyncio.gather</text>

  <rect x="334" y="282" width="264" height="44" rx="5" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="466" y="302" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Application + IOLoop</text>
  <text x="466" y="317" font-size="10" fill="currentColor" text-anchor="middle">routing, settings, options, logging</text>

  <!-- Backends -->
  <rect x="640" y="70" width="100" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">PostgreSQL</text>
  <text x="690" y="111" font-size="10" fill="currentColor" text-anchor="middle">async driver pool</text>

  <rect x="640" y="146" width="100" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="170" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Redis</text>
  <text x="690" y="187" font-size="10" fill="currentColor" text-anchor="middle">pub/sub fan-out</text>

  <rect x="640" y="222" width="100" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="246" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Metadata API</text>
  <text x="690" y="263" font-size="10" fill="currentColor" text-anchor="middle">cover lookups</text>

  <rect x="640" y="298" width="100" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="322" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Google</text>
  <text x="690" y="339" font-size="10" fill="currentColor" text-anchor="middle">OAuth 2.0 sign-in</text>

  <line x1="610" y1="98" x2="638" y2="98" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>
  <line x1="610" y1="174" x2="638" y2="174" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>
  <line x1="610" y1="250" x2="638" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>
  <line x1="610" y1="326" x2="638" y2="326" stroke="currentColor" stroke-width="1.5" marker-end="url(#tar-arrow)"/>

  <!-- test + legend -->
  <rect x="20" y="370" width="720" height="86" rx="6" fill="#808080" fill-opacity="0.10" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="36" y="392" font-size="12" font-weight="bold" fill="currentColor">How it is run and checked</text>
  <text x="36" y="412" font-size="11" fill="currentColor">Production: systemd or containers start one process per CPU; nginx balances them and forwards WebSocket upgrades.</text>
  <text x="36" y="430" font-size="11" fill="currentColor">Tests: AsyncHTTPTestCase starts the same Application on a loopback port; the metadata service is a local fake app.</text>
  <text x="36" y="448" font-size="11" fill="currentColor">Nothing in a handler may block the loop: sync drivers and password hashing go through run_in_executor.</text>
</svg>
