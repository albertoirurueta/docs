<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where remark and rehype plugins run when Docusaurus compiles a document</title>
  <desc id="d">A Markdown file is parsed to a Markdown syntax tree, passes through the before-default remark plugins, the default remark plugins and the remark plugins, becomes an HTML syntax tree, passes through the rehype stages, and ends as a React component.</desc>
  <rect width="760" height="300" rx="12" fill="#2b3a4a"/>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="40" width="110" height="50" rx="8" fill="#cfe3f7"/>
    <text x="32" y="62" font-weight="bold">Markdown</text>
    <text x="32" y="80">file or MDX</text>

    <rect x="160" y="40" width="130" height="50" rx="8" fill="#d9ead3"/>
    <text x="172" y="62" font-weight="bold">Remark stages</text>
    <text x="172" y="80">tree: mdast</text>

    <rect x="320" y="40" width="130" height="50" rx="8" fill="#fbe5c8"/>
    <text x="332" y="62" font-weight="bold">Rehype stages</text>
    <text x="332" y="80">tree: hast</text>

    <rect x="480" y="40" width="130" height="50" rx="8" fill="#cfe3f7"/>
    <text x="492" y="62" font-weight="bold">JSX module</text>
    <text x="492" y="80">React component</text>

    <rect x="160" y="120" width="130" height="34" rx="8" fill="#d9ead3"/>
    <text x="172" y="142">1 before default</text>
    <rect x="160" y="162" width="130" height="34" rx="8" fill="#d9ead3"/>
    <text x="172" y="184">2 default plugins</text>
    <rect x="160" y="204" width="130" height="34" rx="8" fill="#d9ead3"/>
    <text x="172" y="226">3 remarkPlugins</text>

    <rect x="320" y="120" width="130" height="34" rx="8" fill="#fbe5c8"/>
    <text x="332" y="142">1 before default</text>
    <rect x="320" y="162" width="130" height="34" rx="8" fill="#fbe5c8"/>
    <text x="332" y="184">2 default plugins</text>
    <rect x="320" y="204" width="130" height="34" rx="8" fill="#fbe5c8"/>
    <text x="332" y="226">3 rehypePlugins</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M130 65 H160"/><path d="M290 65 H320"/><path d="M450 65 H480"/>
    <path d="M225 90 V120"/><path d="M385 90 V120"/>
  </g>
  <text x="30" y="272" font-size="12" fill="#ffffff">Default plugins build the table of contents, heading anchors and asset requires; plugins you add run after them</text>
  <text x="30" y="290" font-size="12" fill="#ffffff">unless you use the before-default options.</text>
</svg>
