<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dbg-lost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Narrowing a device-lost crash in four steps</text>
<rect x="20" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/><text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="105" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Mark the work</text>
<text x="102" y="120" text-anchor="middle" font-size="11" fill="#374151">vkCmdSetCheckpointNV</text>
<text x="102" y="144" text-anchor="middle" font-size="11" fill="#374151">or vkCmdBeginDebugUtilsLabelEXT</text>
<text x="102" y="168" text-anchor="middle" font-size="11" fill="#374151">markers around each pass</text>
<text x="102" y="192" text-anchor="middle" font-size="11" fill="#374151">(NVIDIA / all vendors)</text>
<line x1="185" y1="145" x2="203" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-lost)"/>
<rect x="203" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="219" cy="76" r="11" fill="#B45309"/><text x="219" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="288" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Device lost</text>
<text x="285" y="120" text-anchor="middle" font-size="11" fill="#374151">vkQueueSubmit2 or</text>
<text x="285" y="144" text-anchor="middle" font-size="11" fill="#374151">vkQueuePresentKHR returns</text>
<text x="285" y="168" text-anchor="middle" font-size="11" fill="#374151">VK_ERROR_DEVICE_LOST</text>
<text x="285" y="192" text-anchor="middle" font-size="11" fill="#374151">stop submitting</text>
<line x1="368" y1="145" x2="386" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-lost)"/>
<rect x="386" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="468.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="402" cy="76" r="11" fill="#4F46E5"/><text x="402" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="471" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Ask the driver</text>
<text x="468" y="120" text-anchor="middle" font-size="11" fill="#374151">vkGetQueueCheckpointData2</text>
<text x="468" y="144" text-anchor="middle" font-size="11" fill="#374151">or vkGetDeviceFaultInfoEXT</text>
<text x="468" y="168" text-anchor="middle" font-size="11" fill="#374151">(KHR version exists)</text>
<text x="468" y="192" text-anchor="middle" font-size="11" fill="#374151">dump vendor binary</text>
<line x1="551" y1="145" x2="569" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-lost)"/>
<rect x="569" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="651.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="585" cy="76" r="11" fill="#4F46E5"/><text x="585" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="654" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Map to the draw</text>
<text x="651" y="120" text-anchor="middle" font-size="11" fill="#374151">last checkpoint reached</text>
<text x="651" y="144" text-anchor="middle" font-size="11" fill="#374151">names the pass to inspect</text>
<text x="651" y="168" text-anchor="middle" font-size="11" fill="#374151">replay it in RenderDoc</text>
<text x="651" y="192" text-anchor="middle" font-size="11" fill="#374151">or feed vendor tools</text>
<text x="380" y="262" text-anchor="middle" font-size="11" fill="#374151">Object names and labels from VK_EXT_debug_utils make every tool above readable.</text>
<text x="380" y="282" text-anchor="middle" font-size="11" fill="#374151">After a device loss every other call on the device may fail; recreate the device to continue.</text>
</svg>
