<svg viewBox="0 0 860 560" width="860" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <text x="430" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Cosmos DB partitions and RU consumption</text>
  <text x="430" y="44" text-anchor="middle" font-size="11.5" fill="#5f6368">Logical partitions (by partition key) mapped onto physical partitions, and per-operation RU cost</text>

  <!-- Section 1: logical -> physical mapping -->
  <text x="20" y="72" font-size="12.5" font-weight="700" fill="#1a1a1a">Logical partitions (by partition key value)</text>

  <g font-size="10" text-anchor="middle">
    <rect x="20" y="82" width="110" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="75" y="103" fill="#123a70">orderId=A1..A9</text>

    <rect x="140" y="82" width="110" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="195" y="103" fill="#123a70">orderId=B1..B9</text>

    <rect x="260" y="82" width="110" height="34" rx="4" fill="#fbe8cf" stroke="#f29900" stroke-width="1.4"/>
    <text x="315" y="98" fill="#7a4a00" font-weight="700">orderId=HOT</text>
    <text x="315" y="110" fill="#7a4a00">(celebrity SKU)</text>

    <rect x="380" y="82" width="110" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="435" y="103" fill="#123a70">orderId=C1..C9</text>

    <rect x="500" y="82" width="110" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="555" y="103" fill="#123a70">orderId=D1..D9</text>

    <rect x="620" y="82" width="110" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="675" y="103" fill="#123a70">orderId=E1..E9</text>

    <rect x="740" y="82" width="100" height="34" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1"/>
    <text x="790" y="103" fill="#123a70">orderId=F..</text>
  </g>

  <!-- arrows down to physical partitions -->
  <g stroke="#9aa0a6" stroke-width="1.2" fill="none">
    <path d="M75,116 L75,150 L145,150 L145,168" marker-end="url(#arrow)"/>
    <path d="M195,116 L195,150 L145,150" />
    <path d="M315,116 L315,168" marker-end="url(#arrow)"/>
    <path d="M435,116 L435,150 L500,150 L500,168" marker-end="url(#arrow)"/>
    <path d="M555,116 L555,150 L500,150" />
    <path d="M675,116 L675,150 L745,150 L745,168" marker-end="url(#arrow)"/>
    <path d="M790,116 L790,150 L745,150" />
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="20" y="200" font-size="12.5" font-weight="700" fill="#1a1a1a">Physical partitions (server-managed; Cosmos DB splits/rebalances automatically)</text>

  <g>
    <rect x="90" y="168" width="110" height="52" rx="4" fill="#d6eadf" stroke="#188038" stroke-width="1.4"/>
    <text x="145" y="190" text-anchor="middle" font-size="10.5" fill="#0d4c22">Physical</text>
    <text x="145" y="203" text-anchor="middle" font-size="10.5" fill="#0d4c22">partition 1</text>
    <text x="145" y="215" text-anchor="middle" font-size="9" fill="#0d4c22">~4,000 RU/s cap</text>

    <rect x="260" y="168" width="110" height="52" rx="4" fill="#fde2e1" stroke="#c5221f" stroke-width="1.6"/>
    <text x="315" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1a17">Physical</text>
    <text x="315" y="201" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1a17">partition 2 (HOT)</text>
    <text x="315" y="214" text-anchor="middle" font-size="9" fill="#7a1a17">throttled: 429s</text>

    <rect x="445" y="168" width="110" height="52" rx="4" fill="#d6eadf" stroke="#188038" stroke-width="1.4"/>
    <text x="500" y="190" text-anchor="middle" font-size="10.5" fill="#0d4c22">Physical</text>
    <text x="500" y="203" text-anchor="middle" font-size="10.5" fill="#0d4c22">partition 3</text>
    <text x="500" y="215" text-anchor="middle" font-size="9" fill="#0d4c22">~4,000 RU/s cap</text>

    <rect x="690" y="168" width="110" height="52" rx="4" fill="#d6eadf" stroke="#188038" stroke-width="1.4"/>
    <text x="745" y="190" text-anchor="middle" font-size="10.5" fill="#0d4c22">Physical</text>
    <text x="745" y="203" text-anchor="middle" font-size="10.5" fill="#0d4c22">partition 4</text>
    <text x="745" y="215" text-anchor="middle" font-size="9" fill="#0d4c22">~4,000 RU/s cap</text>
  </g>

  <!-- Hot partition pitfall callout -->
  <rect x="230" y="232" width="380" height="70" rx="6" fill="#fff8e1" stroke="#f29900" stroke-width="1.2"/>
  <text x="420" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a00">Hot-partition pitfall</text>
  <text x="420" y="266" text-anchor="middle" font-size="9.5" fill="#5f3d00">A single logical partition key value (e.g. one celebrity</text>
  <text x="420" y="279" text-anchor="middle" font-size="9.5" fill="#5f3d00">SKU) concentrates RU demand on one physical partition --</text>
  <text x="420" y="292" text-anchor="middle" font-size="9.5" fill="#5f3d00">provisioned RU/s is split evenly per partition, not pooled.</text>

  <line x1="315" y1="220" x2="315" y2="232" stroke="#f29900" stroke-width="1.4"/>

  <!-- Section 2: RU cost per operation -->
  <text x="20" y="340" font-size="12.5" font-weight="700" fill="#1a1a1a">Approximate RU cost per operation (1 KB item, single partition key)</text>

  <g font-size="10">
    <rect x="20" y="352" width="820" height="26" fill="#f1f3f4"/>
    <text x="30" y="369" font-weight="700" fill="#1a1a1a">Operation</text>
    <text x="330" y="369" font-weight="700" fill="#1a1a1a">Relative RU cost</text>
    <text x="560" y="369" font-weight="700" fill="#1a1a1a">Notes</text>

    <text x="30" y="396" fill="#1a1a1a">Point read (by id + partition key)</text>
    <rect x="330" y="384" width="18" height="12" fill="#188038"/>
    <text x="560" y="396" fill="#5f6368">~1 RU</text>

    <text x="30" y="420" fill="#1a1a1a">Point write / insert</text>
    <rect x="330" y="408" width="55" height="12" fill="#1a5fb4"/>
    <text x="560" y="420" fill="#5f6368">~5 RU (indexing adds more)</text>

    <text x="30" y="444" fill="#1a1a1a">Replace / update</text>
    <rect x="330" y="432" width="70" height="12" fill="#1a5fb4"/>
    <text x="560" y="444" fill="#5f6368">~6-10 RU depending on indexed properties changed</text>

    <text x="30" y="468" fill="#1a1a1a">Delete</text>
    <rect x="330" y="456" width="55" height="12" fill="#1a5fb4"/>
    <text x="560" y="468" fill="#5f6368">~5 RU</text>

    <text x="30" y="492" fill="#1a1a1a">Query, cross-partition, no index (scan)</text>
    <rect x="330" y="480" width="300" height="12" fill="#c5221f"/>
    <text x="560" y="492" fill="#5f6368">100+ RU, scales with items examined</text>

    <text x="30" y="516" fill="#1a1a1a">Query, single-partition, indexed filter</text>
    <rect x="330" y="504" width="100" height="12" fill="#f29900"/>
    <text x="560" y="516" fill="#5f6368">~10-30 RU depending on result size</text>
  </g>

  <text x="430" y="546" text-anchor="middle" font-size="9.5" fill="#5f6368">RU/s is provisioned (or consumed, if serverless) per second, per physical partition -- a query that fans out
    across many partitions consumes RU on each one it touches.</text>
</svg>
