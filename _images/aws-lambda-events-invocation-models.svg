<svg viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Three ways Lambda is invoked, and who owns retries</text>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a58"/>
    </marker>
  </defs>

  <!-- Column 1: synchronous -->
  <rect x="20" y="48" width="270" height="372" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="155" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#123a72">Synchronous</text>
  <text x="155" y="94" text-anchor="middle" font-size="11.5" fill="#123a72">caller waits for the response</text>
  <rect x="40" y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="95" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Caller</text>
  <text x="95" y="146" text-anchor="middle" font-size="10.5" fill="#3c4a58">API Gateway, ALB, URL</text>
  <rect x="180" y="110" width="90" height="46" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="225" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Function</text>
  <line x1="150" y1="126" x2="178" y2="126" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="178" y1="142" x2="152" y2="142" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="190" font-size="12" font-weight="700" fill="#123a72">Errors</text>
  <text x="40" y="208" font-size="11.5" fill="#1a1a1a">Returned to the caller as an error</text>
  <text x="40" y="236" font-size="12" font-weight="700" fill="#123a72">Retries</text>
  <text x="40" y="254" font-size="11.5" fill="#1a1a1a">None by Lambda: the caller or</text>
  <text x="40" y="270" font-size="11.5" fill="#1a1a1a">client SDK decides</text>
  <text x="40" y="298" font-size="12" font-weight="700" fill="#123a72">Payload limit</text>
  <text x="40" y="316" font-size="11.5" fill="#1a1a1a">6 MB request and response</text>
  <text x="40" y="344" font-size="12" font-weight="700" fill="#123a72">Examples</text>
  <text x="40" y="362" font-size="11.5" fill="#1a1a1a">Invoke API, function URL, API</text>
  <text x="40" y="378" font-size="11.5" fill="#1a1a1a">Gateway, ALB target, Step Functions</text>
  <text x="40" y="394" font-size="11.5" fill="#1a1a1a">(request-response task)</text>

  <!-- Column 2: asynchronous -->
  <rect x="315" y="48" width="270" height="372" rx="10" fill="#e9f7ee" stroke="#2d7a46" stroke-width="1.8"/>
  <text x="450" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1c4f2d">Asynchronous</text>
  <text x="450" y="94" text-anchor="middle" font-size="11.5" fill="#1c4f2d">Lambda queues the event, returns 202</text>
  <rect x="335" y="110" width="80" height="46" rx="6" fill="#ffffff" stroke="#2d7a46"/>
  <text x="375" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Source</text>
  <text x="375" y="146" text-anchor="middle" font-size="10.5" fill="#3c4a58">S3, EventBridge</text>
  <rect x="432" y="110" width="52" height="46" rx="6" fill="#f0f0f0" stroke="#5c6b7a"/>
  <text x="458" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">Internal</text>
  <text x="458" y="146" text-anchor="middle" font-size="10.5" fill="#1a1a1a">queue</text>
  <rect x="501" y="110" width="70" height="46" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="536" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Function</text>
  <line x1="415" y1="133" x2="430" y2="133" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="484" y1="133" x2="499" y2="133" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="190" font-size="12" font-weight="700" fill="#1c4f2d">Errors</text>
  <text x="335" y="208" font-size="11.5" fill="#1a1a1a">Lambda retries, then drops the event</text>
  <text x="335" y="224" font-size="11.5" fill="#1a1a1a">or sends it to a failure destination / DLQ</text>
  <text x="335" y="252" font-size="12" font-weight="700" fill="#1c4f2d">Retries</text>
  <text x="335" y="270" font-size="11.5" fill="#1a1a1a">Up to 2 by default; max event age</text>
  <text x="335" y="286" font-size="11.5" fill="#1a1a1a">configurable, up to 6 hours</text>
  <text x="335" y="314" font-size="12" font-weight="700" fill="#1c4f2d">Payload limit</text>
  <text x="335" y="332" font-size="11.5" fill="#1a1a1a">1 MB</text>
  <text x="335" y="360" font-size="12" font-weight="700" fill="#1c4f2d">Examples</text>
  <text x="335" y="378" font-size="11.5" fill="#1a1a1a">S3 notifications, EventBridge rules,</text>
  <text x="335" y="394" font-size="11.5" fill="#1a1a1a">EventBridge Scheduler, SNS</text>

  <!-- Column 3: event source mapping -->
  <rect x="610" y="48" width="270" height="372" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.8"/>
  <text x="745" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1a15">Event source mapping (poll)</text>
  <text x="745" y="94" text-anchor="middle" font-size="11.5" fill="#7a1a15">Lambda polls and invokes with a batch</text>
  <rect x="628" y="110" width="76" height="46" rx="6" fill="#ffffff" stroke="#b3261e"/>
  <text x="666" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Queue or</text>
  <text x="666" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">stream</text>
  <rect x="716" y="110" width="68" height="46" rx="6" fill="#f0f0f0" stroke="#5c6b7a"/>
  <text x="750" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">Poller</text>
  <text x="750" y="146" text-anchor="middle" font-size="10.5" fill="#1a1a1a">(managed)</text>
  <rect x="796" y="110" width="70" height="46" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="831" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Function</text>
  <line x1="704" y1="133" x2="714" y2="133" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="784" y1="133" x2="794" y2="133" stroke="#3c4a58" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="630" y="190" font-size="12" font-weight="700" fill="#7a1a15">Errors</text>
  <text x="630" y="208" font-size="11.5" fill="#1a1a1a">SQS: batch reappears after the visibility</text>
  <text x="630" y="224" font-size="11.5" fill="#1a1a1a">timeout. Streams: retried until the record</text>
  <text x="630" y="240" font-size="11.5" fill="#1a1a1a">expires, or limits you set are hit</text>
  <text x="630" y="268" font-size="12" font-weight="700" fill="#7a1a15">Retries</text>
  <text x="630" y="286" font-size="11.5" fill="#1a1a1a">Owned by the mapping and the source;</text>
  <text x="630" y="302" font-size="11.5" fill="#1a1a1a">report partial failures per item</text>
  <text x="630" y="330" font-size="12" font-weight="700" fill="#7a1a15">Failure target</text>
  <text x="630" y="348" font-size="11.5" fill="#1a1a1a">SQS: DLQ on the queue. Streams and Kafka:</text>
  <text x="630" y="364" font-size="11.5" fill="#1a1a1a">on-failure destination of the mapping</text>
  <text x="630" y="392" font-size="12" font-weight="700" fill="#7a1a15">Examples</text>
  <text x="630" y="410" font-size="11.5" fill="#1a1a1a">SQS, Kinesis, DynamoDB Streams, MSK</text>
</svg>
