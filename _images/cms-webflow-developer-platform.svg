<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Map of the Webflow developer platform: remote APIs, client tooling, apps, Designer-side code, hosting and AI tooling around a Webflow site">
