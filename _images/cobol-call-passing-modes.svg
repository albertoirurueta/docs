<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">CALL passing modes: who owns which bytes</title><desc id="d">Three columns compare BY REFERENCE, BY CONTENT and BY VALUE for the argument WS-COPIES holding 003: with BY REFERENCE the called program points at the caller's own bytes, with BY CONTENT it points at a temporary copy made by the CALL, and with BY VALUE it receives the value itself in the argument list. A table underneath states what the callee can change and which items are allowed.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="500" fill="#ffffff" stroke="#9aa3ad"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#1f2933">CALL "BKCHECK" USING ... WS-COPIES (PIC 9(3), value 003): who owns which bytes</text>
<rect x="15" y="42" width="230" height="28" fill="#cfe3f7" stroke="#52606d"/>
<text x="130.0" y="61" text-anchor="middle" font-weight="bold" fill="#1f2933">BY REFERENCE (default)</text>
<rect x="15" y="80" width="230" height="56" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="23" y="95" font-size="11" fill="#3e4c59">caller: WORKING-STORAGE</text>
<rect x="23" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="38" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="53" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="68" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="83" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="98" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<text x="119" y="120" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">WS-COPIES</text>
<rect x="15" y="200" width="230" height="60" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="237" y="215" text-anchor="end" font-size="11" fill="#3e4c59">callee: LINKAGE SECTION</text>
<text x="119" y="248" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">LK-COPIES</text>
<rect x="265" y="42" width="230" height="28" fill="#fbe7b5" stroke="#52606d"/>
<text x="380.0" y="61" text-anchor="middle" font-weight="bold" fill="#1f2933">BY CONTENT</text>
<rect x="265" y="80" width="230" height="56" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="273" y="95" font-size="11" fill="#3e4c59">caller: WORKING-STORAGE</text>
<rect x="273" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="288" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="303" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="318" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="333" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="348" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<text x="369" y="120" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">WS-COPIES</text>
<rect x="265" y="200" width="230" height="60" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="487" y="215" text-anchor="end" font-size="11" fill="#3e4c59">callee: LINKAGE SECTION</text>
<text x="369" y="248" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">LK-COPIES</text>
<rect x="515" y="42" width="230" height="28" fill="#d6efd8" stroke="#52606d"/>
<text x="630.0" y="61" text-anchor="middle" font-weight="bold" fill="#1f2933">BY VALUE</text>
<rect x="515" y="80" width="230" height="56" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="523" y="95" font-size="11" fill="#3e4c59">caller: WORKING-STORAGE</text>
<rect x="523" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="538" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="553" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="568" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="583" y="102" width="30" height="26" fill="#cfe3f7" stroke="#52606d"/><text x="598" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<text x="619" y="120" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">WS-COPIES</text>
<rect x="515" y="200" width="230" height="60" fill="#f5f7fa" stroke="#9aa3ad"/>
<text x="737" y="215" text-anchor="end" font-size="11" fill="#3e4c59">callee: LINKAGE SECTION</text>
<text x="619" y="248" font-size="11" fill="#1f2933" font-family="Menlo, Consolas, monospace">LK-COPIES</text>
<path d="M75 228 L75 130" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="23" y="226" width="30" height="26" fill="#ffffff" stroke="#52606d" stroke-dasharray="3 2"/><text x="38" y="243" text-anchor="middle" font-size="10" fill="#3e4c59">addr</text>
<text x="83" y="175" font-size="11" fill="#1f2933">same bytes, no copy</text>
<path d="M53 239 L75 239" stroke="#52606d" stroke-width="2" fill="none"/>
<rect x="273" y="152" width="30" height="26" fill="#fbe7b5" stroke="#52606d"/><text x="288" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="303" y="152" width="30" height="26" fill="#fbe7b5" stroke="#52606d"/><text x="318" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="333" y="152" width="30" height="26" fill="#fbe7b5" stroke="#52606d"/><text x="348" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<text x="369" y="162" font-size="11" fill="#1f2933">temporary copy</text><text x="369" y="175" font-size="11" fill="#1f2933">made by the CALL</text>
<path d="M325 228 L325 180" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="273" y="226" width="30" height="26" fill="#ffffff" stroke="#52606d" stroke-dasharray="3 2"/><text x="288" y="243" text-anchor="middle" font-size="10" fill="#3e4c59">addr</text>
<path d="M303 239 L325 239" stroke="#52606d" stroke-width="2" fill="none"/>
<rect x="523" y="152" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="538" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="553" y="152" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="568" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="583" y="152" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="598" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<text x="619" y="162" font-size="11" fill="#1f2933">value in the</text><text x="619" y="175" font-size="11" fill="#1f2933">argument list</text>
<rect x="523" y="226" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="538" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="553" y="226" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="568" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">0</text>
<rect x="583" y="226" width="30" height="26" fill="#d6efd8" stroke="#52606d"/><text x="598" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#1f2933">3</text>
<path d="M575 180 L575 222" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<rect x="10" y="278" width="740" height="44" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="23" y="292" font-size="11" fill="#1f2933">Writes: reach the caller's data</text>
<text x="273" y="292" font-size="11" fill="#1f2933">Writes: stay in the copy; the caller</text>
<text x="273" y="306" font-size="11" fill="#1f2933">  still sees 003</text>
<text x="523" y="292" font-size="11" fill="#1f2933">Writes: stay local; the caller</text>
<text x="523" y="306" font-size="11" fill="#1f2933">  still sees 003</text>
<rect x="10" y="322" width="740" height="44" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="23" y="336" font-size="11" fill="#1f2933">Items: any data item (any level</text>
<text x="23" y="350" font-size="11" fill="#1f2933"> in the caller)</text>
<text x="273" y="336" font-size="11" fill="#1f2933">Items: any item or literal, except an</text>
<text x="273" y="350" font-size="11" fill="#1f2933">  unbounded group</text>
<text x="523" y="336" font-size="11" fill="#1f2933">Items: elementary binary, float, pointer</text>
<text x="523" y="350" font-size="11" fill="#1f2933">  or one-character items</text>
<rect x="10" y="366" width="740" height="32" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="23" y="380" font-size="11" fill="#1f2933">Use: output fields, records, tables</text>
<text x="273" y="380" font-size="11" fill="#1f2933">Use: read-only inputs, literals</text>
<text x="523" y="380" font-size="11" fill="#1f2933">Use: C functions that expect a value</text>
<text x="20" y="434" font-size="12" fill="#1f2933">Rule of thumb: BY REFERENCE for what the callee must change, BY CONTENT for what it may only read,</text>
<text x="20" y="452" font-size="12" fill="#1f2933">BY VALUE mainly for C and other non-COBOL callees.</text>
<text x="20" y="470" font-size="11" fill="#3e4c59">An omitted argument (OMITTED) is a BY REFERENCE argument with no bytes at all: the callee tests ADDRESS OF = NULL or IS OMITTED.</text>
</svg>
