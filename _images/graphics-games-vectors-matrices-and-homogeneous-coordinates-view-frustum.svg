<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The perspective view frustum (side view)</text>
<polygon points="210,160 630,46 630,354 210,240" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<line x1="70" y1="200" x2="630" y2="46" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="70" y1="200" x2="630" y2="354" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="210" y1="160" x2="210" y2="240" stroke="#4F46E5" stroke-width="3"/>
<line x1="630" y1="46" x2="630" y2="354" stroke="#4F46E5" stroke-width="3"/>
<circle cx="70" cy="200" r="6" fill="#1F2937" stroke="none" stroke-width="1.5"/>
<text x="70" y="224" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">eye</text>
<line x1="70" y1="200" x2="550" y2="200" stroke="#B45309" stroke-width="1.5" marker-end="url(#fr)"/>
<text x="550" y="216" font-size="11" font-weight="normal" fill="#92400E" text-anchor="end">-z (view direction)</text>
<text x="210" y="262" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">near plane n</text>
<text x="630" y="375" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">far plane f</text>
<text x="205" y="148" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="end">top = n tan(fovy/2)</text>
<path d="M 130,183 A 62 62 0 0 1 130,217" fill="none" stroke="#B45309" stroke-width="1.5"/>
<text x="136" y="194" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">fovy</text>
<rect x="370" y="176" width="14" height="48" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
<text x="377" y="168" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book</text>
<text x="380" y="392" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">aspect = width / height; the volume between n and f maps to the clip volume -w..w.</text>
</svg>
