<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:summary</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">Error: parser_error, Statement does not exist in the configured ABAP version(or a parser error), &quot;WRITE&quot;, zdt_summary.prog.abap:10</text>
<rect x="5" y="67" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
