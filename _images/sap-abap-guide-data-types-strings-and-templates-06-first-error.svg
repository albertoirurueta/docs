<title id="sap-abap-guide-data-types-strings-and-templates-06-first-error-title">Terminal after npm run run:summary with the spaces removed inside the braces of the first template: the transpiler stops with the line Error: parser_error, Statement does not exist in the configured ABAP version or a parser error, WRITE, zdt_summary.prog.abap:10 and the program does not run; callout 14 marks the error line</title>
<g><rect x="0" y="0" width="1080" height="108" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
