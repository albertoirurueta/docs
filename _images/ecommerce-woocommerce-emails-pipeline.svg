<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Path of a WooCommerce transactional email</title>
  <desc id="d">Six steps from top to bottom with the hooks that fire at each step on the right. First a trigger action listed in woocommerce_email_actions fires. Second WC_Emails either sends at once or queues the email and then calls the action name followed by _notification. Third the WC_Email trigger method sets the order, the recipient and the placeholders and calls send_notification, which stops with woocommerce_email_disabled or woocommerce_email_skipped. Fourth get_content builds the body, from the block email renderer when the block email editor is on and the email is opted in, otherwise from the plain or HTML template. Fifth style_inline applies the email stylesheet to the HTML. Sixth send calls wp_mail through woocommerce_mail_callback and fires woocommerce_email_sent.</desc>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">From trigger to wp_mail()</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Pocket Coffee "Roast ready" email on WooCommerce 11.2.1; hooks on the right fire at the step they sit beside</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#f4b860">Step</text>
  <text x="560" y="92" font-size="13" font-weight="bold" fill="#f4b860">Hooks and filters you can use</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="104" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="126" font-weight="bold">1  A trigger action fires</text>
    <text x="54" y="146">do_action( 'pocket_coffee_roast_ready', $order_id )</text>
    <text x="54" y="162" font-size="11.5">its name was added with woocommerce_email_actions</text>

    <rect x="40" y="188" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="210" font-weight="bold">2  WC_Emails sends now or queues</text>
    <text x="54" y="230">then fires pocket_coffee_roast_ready_notification</text>
    <text x="54" y="246" font-size="11.5">queued through Action Scheduler when deferral is on</text>

    <rect x="40" y="272" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="294" font-weight="bold">3  WC_Email::trigger() prepares the email</text>
    <text x="54" y="314">object, recipient, placeholders; send_notification()</text>
    <text x="54" y="330" font-size="11.5">stops when the email is disabled or has no recipient</text>

    <rect x="40" y="356" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="378" font-weight="bold">4  get_content() builds the body</text>
    <text x="54" y="398">block renderer, or plain or HTML template</text>
    <text x="54" y="414" font-size="11.5">theme overrides are found by wc_locate_template()</text>

    <rect x="40" y="440" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="462" font-weight="bold">5  style_inline() inlines the CSS</text>
    <text x="54" y="482">emails/email-styles.php plus your extra CSS</text>
    <text x="54" y="498" font-size="11.5">HTML only; plain text is left as it is</text>

    <rect x="40" y="524" width="480" height="64" rx="6" fill="#3d5266"/>
    <text x="54" y="546" font-weight="bold">6  send() hands the message to wp_mail()</text>
    <text x="54" y="566">From, Reply-to, Content-Type and attachments applied</text>
    <text x="54" y="582" font-size="11.5">your SMTP plugin or the server sends it</text>
  </g>
  <g stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M280 168 L280 186"/>
    <path d="M280 252 L280 270"/>
    <path d="M280 336 L280 354"/>
    <path d="M280 420 L280 438"/>
    <path d="M280 504 L280 522"/>
  </g>

  <g font-size="11.5" fill="#f2f5f8">
    <text x="560" y="124">woocommerce_email_actions</text>
    <text x="560" y="142">woocommerce_defer_transactional_emails</text>
    <text x="560" y="208">woocommerce_allow_send_queued_transactional_email</text>
    <text x="560" y="292">woocommerce_email_recipient_{id}, _cc_ and _bcc_</text>
    <text x="560" y="310">woocommerce_email_enabled_{id}</text>
    <text x="560" y="328">woocommerce_email_disabled, woocommerce_email_skipped</text>
    <text x="560" y="376">woocommerce_email_subject_{id}, _heading_{id}</text>
    <text x="560" y="394">woocommerce_email_additional_content_{id}</text>
    <text x="560" y="412">woocommerce_email_header, _order_details, _footer</text>
    <text x="560" y="458">woocommerce_email_styles</text>
    <text x="560" y="476">woocommerce_mail_style_inline_callback</text>
    <text x="560" y="494">woocommerce_emogrifier</text>
    <text x="560" y="542">woocommerce_email_headers, woocommerce_email_attachments</text>
    <text x="560" y="560">woocommerce_mail_content, woocommerce_mail_callback</text>
    <text x="560" y="578">woocommerce_email_sent</text>
  </g>
  <g stroke="#6f8aa3" stroke-width="1" stroke-dasharray="4 3">
    <path d="M524 136 L552 136"/>
    <path d="M524 220 L552 220"/>
    <path d="M524 304 L552 304"/>
    <path d="M524 388 L552 388"/>
    <path d="M524 472 L552 472"/>
    <path d="M524 556 L552 556"/>
  </g>
  <text x="40" y="618" font-size="12.5" fill="#f2f5f8">{id} is the email ID, here pocket_coffee_roast_ready; the core emails use IDs such as customer_processing_order.</text>
</svg>
