<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vdu-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From a detected error to your log line</text>
<rect x="20" y="70" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="93.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Application call</text>
<text x="95.0" y="108.5" text-anchor="middle" font-size="11" fill="#92400E">wrong layout, missing</text>
<text x="95.0" y="123.5" text-anchor="middle" font-size="11" fill="#92400E">barrier, bad flags</text>
<rect x="205" y="70" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="93.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Validation layer</text>
<text x="280.0" y="108.5" text-anchor="middle" font-size="11" fill="#3730A3">finds the violation</text>
<text x="280.0" y="123.5" text-anchor="middle" font-size="11" fill="#3730A3">builds the message</text>
<rect x="390" y="70" width="150" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="465.0" y="93.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Messenger filter</text>
<text x="465.0" y="108.5" text-anchor="middle" font-size="11" fill="#374151">messageSeverity mask</text>
<text x="465.0" y="123.5" text-anchor="middle" font-size="11" fill="#374151">messageType mask</text>
<rect x="575" y="70" width="165" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="657.5" y="93.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Your callback</text>
<text x="657.5" y="108.5" text-anchor="middle" font-size="11" fill="#065F46">pfnUserCallback</text>
<text x="657.5" y="123.5" text-anchor="middle" font-size="11" fill="#065F46">returns VK_FALSE</text>
<line x1="170" y1="105" x2="205" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-flow)"/>
<line x1="355" y1="105" x2="390" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-flow)"/>
<line x1="540" y1="105" x2="575" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-flow)"/>
<rect x="205" y="190" width="150" height="60" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="280.0" y="208.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Callback data</text>
<text x="280.0" y="223.5" text-anchor="middle" font-size="11" fill="#374151">VUID id, text, objects</text>
<text x="280.0" y="238.5" text-anchor="middle" font-size="11" fill="#374151">queue and cmd labels</text>
<line x1="280" y1="140" x2="280" y2="188" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-vdu-flow)"/>
<rect x="575" y="190" width="165" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="657.5" y="208.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Typical action</text>
<text x="657.5" y="223.5" text-anchor="middle" font-size="11" fill="#065F46">log, assert, break</text>
<text x="657.5" y="238.5" text-anchor="middle" font-size="11" fill="#065F46">in the debugger</text>
<line x1="657" y1="140" x2="657" y2="188" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-vdu-flow)"/>
<text x="380" y="285" text-anchor="middle" font-size="12" fill="#374151">Return VK_FALSE: VK_TRUE would abort the call that triggered the message</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="#6B7280">A messenger in the instance pNext chain also covers vkCreateInstance and vkDestroyInstance</text>
</svg>
