<svg viewBox="0 0 820 460" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AKS workload identity: token exchange flow</text>
  <text x="410" y="44" text-anchor="middle" font-size="11.5" fill="#5f6368">catalog-api pod, annotated ServiceAccount, federated credential -- no secret anywhere in the chain</text>

  <!-- Pod / ServiceAccount box -->
  <rect x="24" y="76" width="190" height="150" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="119" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b3d91">Pod: catalog-api</text>
  <text x="119" y="116" text-anchor="middle" font-size="10" fill="#0b3d91">label</text>
  <text x="119" y="130" text-anchor="middle" font-size="9.5" fill="#0b3d91">azure.workload.identity/use: "true"</text>

  <rect x="40" y="142" width="158" height="70" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1"/>
  <text x="119" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b3d91">ServiceAccount</text>
  <text x="119" y="176" text-anchor="middle" font-size="9" fill="#0b3d91">annotation: client-id</text>
  <text x="119" y="188" text-anchor="middle" font-size="9" fill="#0b3d91">annotation: tenant-id</text>
  <text x="119" y="200" text-anchor="middle" font-size="9" fill="#0b3d91">projected token volume</text>

  <!-- OIDC issuer box (AKS cluster) -->
  <rect x="24" y="256" width="190" height="80" rx="8" fill="#fef7e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="119" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a00">aks-bookshelf</text>
  <text x="119" y="298" text-anchor="middle" font-size="9.5" fill="#7a4a00">OIDC issuer</text>
  <text x="119" y="312" text-anchor="middle" font-size="9" fill="#7a4a00">(--enable-oidc-issuer)</text>

  <!-- Entra ID box -->
  <rect x="315" y="150" width="200" height="150" rx="8" fill="#d6eadf" stroke="#188038" stroke-width="1.5"/>
  <text x="415" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d4c22">Microsoft Entra ID</text>
  <text x="415" y="192" text-anchor="middle" font-size="9.5" fill="#0d4c22">federated credential</text>
  <text x="415" y="204" text-anchor="middle" font-size="9" fill="#0d4c22">subject: system:serviceaccount:</text>
  <text x="415" y="216" text-anchor="middle" font-size="9" fill="#0d4c22">bookshelf:catalog-api</text>
  <text x="415" y="236" text-anchor="middle" font-size="9.5" fill="#0d4c22">validates OIDC token against</text>
  <text x="415" y="248" text-anchor="middle" font-size="9.5" fill="#0d4c22">issuer's public signing keys</text>
  <text x="415" y="268" text-anchor="middle" font-size="9.5" fill="#0d4c22">issues Entra access token</text>
  <text x="415" y="282" text-anchor="middle" font-size="9" fill="#0d4c22">(id-catalog-api identity)</text>

  <!-- Target resources -->
  <rect x="616" y="70" width="180" height="60" rx="8" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
  <text x="706" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a1a17">kv-bookshelf</text>
  <text x="706" y="110" text-anchor="middle" font-size="9" fill="#7a1a17">Key Vault Secrets User</text>

  <rect x="616" y="150" width="180" height="60" rx="8" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
  <text x="706" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a1a17">pg-bookshelf</text>
  <text x="706" y="190" text-anchor="middle" font-size="9" fill="#7a1a17">Entra-authenticated connection</text>

  <rect x="616" y="230" width="180" height="60" rx="8" fill="#fde2e1" stroke="#c5221f" stroke-width="1.5"/>
  <text x="706" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a1a17">stbookshelf</text>
  <text x="706" y="270" text-anchor="middle" font-size="9" fill="#7a1a17">Storage Blob Data Contributor</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3c4043"/>
    </marker>
  </defs>

  <!-- Pod projected token -> OIDC issuer trust (dashed, established ahead of time) -->
  <line x1="119" y1="226" x2="119" y2="256" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="128" y="244" font-size="8.5" fill="#3c4043">issuer trust</text>

  <!-- Pod -> Entra ID: present projected token for exchange -->
  <path d="M214,140 C260,120 280,150 315,190" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="128" font-size="9" fill="#3c4043">1. present projected</text>
  <text x="222" y="140" font-size="9" fill="#3c4043">   Kubernetes token</text>

  <!-- OIDC issuer -> Entra: discovery / signing keys -->
  <path d="M214,296 C260,296 270,270 315,250" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="222" y="318" font-size="9" fill="#3c4043">2. Entra fetches OIDC discovery</text>
  <text x="222" y="330" font-size="9" fill="#3c4043">   doc / public signing keys</text>

  <!-- Entra -> Pod: access token back -->
  <path d="M340,150 C300,110 250,100 214,110" fill="none" stroke="#188038" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="96" font-size="9" fill="#0d4c22">3. Entra access token</text>
  <text x="222" y="108" font-size="9" fill="#0d4c22">   (short-lived, scoped)</text>

  <!-- Pod -> resources with bearer token -->
  <path d="M214,100 C420,60 560,80 616,100" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M214,150 C420,150 560,175 616,180" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M214,200 C420,220 560,255 616,260" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="55" font-size="9" fill="#3c4043">4. data-plane call with bearer token</text>

  <text x="410" y="410" text-anchor="middle" font-size="10.5" fill="#5f6368">No client secret or connection-string password is stored, rotated or read by catalog-api at any step.</text>
  <text x="410" y="428" text-anchor="middle" font-size="10.5" fill="#5f6368">Azure RBAC role assignments on kv-bookshelf / stbookshelf, and Entra-authenticated access to pg-bookshelf,</text>
  <text x="410" y="444" text-anchor="middle" font-size="10.5" fill="#5f6368">target the id-catalog-api managed identity's principal, exactly as in Identity and Access.</text>
</svg>
