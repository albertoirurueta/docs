<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; }
    .cat { fill: #eef3fb; stroke: #35618c; stroke-width: 1.5; rx: 6; }
    .txt { fill: #1a1a1a; font-size: 13px; }
    .lbl { fill: #1a1a1a; font-size: 12px; font-weight: bold; }
    .small { fill: #333333; font-size: 11px; }
    .edge { stroke: #555555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="340" y="10" width="220" height="42" class="cat"/>
  <text x="450" y="36" text-anchor="middle" class="lbl">What kind of engine?</text>

  <!-- Relational -->
  <path d="M400,52 L220,95" class="edge"/>
  <text x="270" y="80" class="small">relational / SQL</text>
  <rect x="60" y="95" width="220" height="46" class="cat"/>
  <text x="170" y="115" text-anchor="middle" class="lbl">SQL Server family?</text>
  <text x="170" y="132" text-anchor="middle" class="small">or generic ANSI SQL</text>

  <path d="M170,141 L170,180" class="edge"/>
  <rect x="20" y="180" width="300" height="70" class="box"/>
  <text x="170" y="200" text-anchor="middle" class="txt">Azure SQL Database (PaaS, 1st-party)</text>
  <text x="170" y="217" text-anchor="middle" class="txt">Azure SQL Managed Instance (near-100% compat)</text>
  <text x="170" y="234" text-anchor="middle" class="txt">SQL Server on Azure VMs (full control, IaaS)</text>

  <!-- Postgres/MySQL -->
  <path d="M420,52 L450,95" class="edge"/>
  <text x="470" y="80" class="small">Postgres / MySQL / pgvector</text>
  <rect x="340" y="95" width="220" height="46" class="cat"/>
  <text x="450" y="115" text-anchor="middle" class="lbl">Open-source RDBMS?</text>
  <text x="450" y="132" text-anchor="middle" class="small">community engine, managed</text>

  <path d="M450,141 L450,180" class="edge"/>
  <rect x="340" y="180" width="220" height="70" class="box"/>
  <text x="450" y="200" text-anchor="middle" class="txt">PostgreSQL flexible server</text>
  <text x="450" y="217" text-anchor="middle" class="txt">(+ pgvector, + elastic clusters)</text>
  <text x="450" y="234" text-anchor="middle" class="txt">MySQL flexible server</text>

  <!-- Document/KV/Search -->
  <path d="M500,52 L680,95" class="edge"/>
  <text x="640" y="80" class="small">document / KV / search / graph</text>
  <rect x="620" y="95" width="240" height="46" class="cat"/>
  <text x="740" y="115" text-anchor="middle" class="lbl">Non-relational engine?</text>
  <text x="740" y="132" text-anchor="middle" class="small">by original engine below</text>

  <path d="M740,141 L740,175" class="edge"/>
  <rect x="580" y="175" width="320" height="130" class="box"/>
  <text x="740" y="195" text-anchor="middle" class="txt" font-weight="bold">MongoDB</text>
  <text x="740" y="211" text-anchor="middle" class="small">Azure DocumentDB / Cosmos DB for MongoDB (RU) /</text>
  <text x="740" y="225" text-anchor="middle" class="small">MongoDB Atlas on Azure (Marketplace)</text>
  <text x="740" y="245" text-anchor="middle" class="txt" font-weight="bold">Redis</text>
  <text x="740" y="261" text-anchor="middle" class="small">Azure Managed Redis / Azure Cache for Redis (retiring) /</text>
  <text x="740" y="275" text-anchor="middle" class="small">Redis Cloud (Marketplace)</text>
  <text x="740" y="295" text-anchor="middle" class="small">Elasticsearch, Couchbase, Neo4j, Qdrant, Solr -&gt; see table</text>

  <!-- Metrics -->
  <rect x="20" y="330" width="280" height="60" class="box"/>
  <text x="160" y="352" text-anchor="middle" class="txt" font-weight="bold">Metrics / observability</text>
  <text x="160" y="370" text-anchor="middle" class="small">Azure Monitor managed Prometheus</text>
  <text x="160" y="384" text-anchor="middle" class="small">+ Azure Managed Grafana</text>

  <!-- Vector -->
  <rect x="330" y="330" width="280" height="60" class="box"/>
  <text x="470" y="352" text-anchor="middle" class="txt" font-weight="bold">Vector search / RAG</text>
  <text x="470" y="370" text-anchor="middle" class="small">pgvector, Qdrant, Redis, Elasticsearch, ...</text>
  <text x="470" y="384" text-anchor="middle" class="small">see comparing-vector-databases.adoc</text>

  <!-- decision axis: managed level -->
  <rect x="40" y="420" width="820" height="180" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="450" y="444" text-anchor="middle" class="lbl">How much do you want to manage?</text>

  <rect x="70" y="465" width="180" height="110" class="box"/>
  <text x="160" y="487" text-anchor="middle" class="txt" font-weight="bold">First-party PaaS</text>
  <text x="160" y="505" text-anchor="middle" class="small">Azure SQL Database</text>
  <text x="160" y="521" text-anchor="middle" class="small">Postgres/MySQL flexible server</text>
  <text x="160" y="537" text-anchor="middle" class="small">Azure DocumentDB</text>
  <text x="160" y="553" text-anchor="middle" class="small">Azure Managed Redis</text>

  <rect x="280" y="465" width="180" height="110" class="box"/>
  <text x="370" y="487" text-anchor="middle" class="txt" font-weight="bold">Native ISV service</text>
  <text x="370" y="505" text-anchor="middle" class="small">Elastic Cloud (az elastic)</text>
  <text x="370" y="523" text-anchor="middle" class="small">billed through Azure,</text>
  <text x="370" y="539" text-anchor="middle" class="small">portal-integrated</text>

  <rect x="490" y="465" width="180" height="110" class="box"/>
  <text x="580" y="487" text-anchor="middle" class="txt" font-weight="bold">Marketplace SaaS</text>
  <text x="580" y="505" text-anchor="middle" class="small">MongoDB Atlas, Redis Cloud,</text>
  <text x="580" y="521" text-anchor="middle" class="small">Couchbase Capella, Neo4j AuraDB,</text>
  <text x="580" y="537" text-anchor="middle" class="small">Qdrant Cloud</text>

  <rect x="700" y="465" width="140" height="110" class="box"/>
  <text x="770" y="487" text-anchor="middle" class="txt" font-weight="bold">Self-managed</text>
  <text x="770" y="505" text-anchor="middle" class="small">on AKS or VMs</text>
  <text x="770" y="521" text-anchor="middle" class="small">Solr, Lucene,</text>
  <text x="770" y="537" text-anchor="middle" class="small">Neo4j Helm,</text>
  <text x="770" y="553" text-anchor="middle" class="small">ECK, Couchbase Operator</text>
</svg>
