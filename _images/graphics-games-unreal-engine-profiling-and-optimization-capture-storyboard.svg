<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: capture and read an Unreal Insights trace</text>
<rect x="16" y="52" width="136" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="30" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="84.0" y="94" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Start Insights</text>
<rect x="30" y="108" width="108" height="110" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="36" y="116" width="96" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="84.0" y="164" text-anchor="middle" font-size="10" fill="#374151">Session Browser</text>
<text x="84.0" y="182" text-anchor="middle" font-size="10" fill="#374151">waiting...</text>
<text x="84.0" y="274" text-anchor="middle" font-size="11" fill="#374151">Open UnrealInsights</text>
<text x="84.0" y="288" text-anchor="middle" font-size="11" fill="#374151">so it can receive</text>
<text x="84.0" y="302" text-anchor="middle" font-size="11" fill="#374151">the live session</text>
<line x1="152" y1="152" x2="164" y2="152" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="164" y="52" width="136" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="178" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="178" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="232.0" y="94" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Launch game</text>
<rect x="178" y="112" width="108" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.0" y="129.0" text-anchor="middle" font-size="10" fill="#3730A3">Bookshelf.exe</text>
<text x="232.0" y="142.0" text-anchor="middle" font-size="10" fill="#3730A3">-trace=default</text>
<line x1="232" y1="152" x2="232" y2="184" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="178" y="186" width="108" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="232.0" y="204.5" text-anchor="middle" font-size="10" fill="#374151">UnrealTraceServer</text>
<text x="232.0" y="274" text-anchor="middle" font-size="11" fill="#374151">Run with -trace</text>
<text x="232.0" y="288" text-anchor="middle" font-size="11" fill="#374151">default,memory or</text>
<text x="232.0" y="302" text-anchor="middle" font-size="11" fill="#374151">use Trace.Start</text>
<line x1="300" y1="152" x2="312" y2="152" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="312" y="52" width="136" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="326" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="380.0" y="94" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Play and mark</text>
<rect x="326" y="110" width="108" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="336" y="150" width="22" height="20" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="368" y="140" width="26" height="30" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<line x1="402" y1="114" x2="402" y2="176" stroke="#B45309" stroke-width="2"/>
<text x="380.0" y="202" text-anchor="middle" font-size="10" fill="#92400E">flag at the hitch</text>
<text x="380.0" y="274" text-anchor="middle" font-size="11" fill="#374151">Reproduce the hitch,</text>
<text x="380.0" y="288" text-anchor="middle" font-size="11" fill="#374151">Trace.Bookmark or</text>
<text x="380.0" y="302" text-anchor="middle" font-size="11" fill="#374151">TRACE_BOOKMARK</text>
<line x1="448" y1="152" x2="460" y2="152" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="460" y="52" width="136" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="474" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="528.0" y="94" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Stop and open</text>
<rect x="474" y="112" width="108" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="528.0" y="130.8" text-anchor="middle" font-size="11" fill="#3730A3">Trace.Stop</text>
<line x1="528" y1="142" x2="528" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="474" y="160" width="108" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="528.0" y="177.0" text-anchor="middle" font-size="10" fill="#374151">Saved/Profiling</text>
<text x="528.0" y="190.0" text-anchor="middle" font-size="10" fill="#374151">.utrace file</text>
<text x="528.0" y="274" text-anchor="middle" font-size="11" fill="#374151">Trace.Stop, then open</text>
<text x="528.0" y="288" text-anchor="middle" font-size="11" fill="#374151">the .utrace in the</text>
<text x="528.0" y="302" text-anchor="middle" font-size="11" fill="#374151">Session Browser</text>
<line x1="596" y1="152" x2="608" y2="152" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b3)"/>
<rect x="608" y="52" width="136" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="622" cy="66" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="622" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="676.0" y="94" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Analyse</text>
<rect x="622" y="130" width="24" height="40" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="650" y="130" width="24" height="40" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="678" y="130" width="62" height="40" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<rect x="622" y="182" width="108" height="30" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="676.0" y="202" text-anchor="middle" font-size="10" fill="#065F46">SpawnBook: 31 ms</text>
<text x="676.0" y="274" text-anchor="middle" font-size="11" fill="#374151">Find the long frame,</text>
<text x="676.0" y="288" text-anchor="middle" font-size="11" fill="#374151">select it, read the</text>
<text x="676.0" y="302" text-anchor="middle" font-size="11" fill="#374151">Timers panel</text>
<text x="380" y="322" text-anchor="middle" font-size="11" fill="#374151">Schematic panels drawn for this page; the real Insights UI differs in layout and colours</text>
</svg>
