<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
<title id="t">RaggedTensor with row_splits</title>
<desc id="d">A ragged tensor with rows 3 1 4, 1 and 5 9 is stored as a flat values vector of six numbers and a row_splits vector 0, 3, 4, 6 that marks where each row starts and ends.</desc>
<rect x="1" y="1" width="718" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">RaggedTensor: flat values plus row boundaries</text>
<g font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A" text-anchor="middle">
<text x="40" y="82" font-size="12" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#475569">values</text>
<rect x="100" y="60" width="60" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="130" y="82">3</text>
<rect x="160" y="60" width="60" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="190" y="82">1</text>
<rect x="220" y="60" width="60" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="250" y="82">4</text>
<rect x="280" y="60" width="60" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="310" y="82">1</text>
<rect x="340" y="60" width="60" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="370" y="82">5</text>
<rect x="400" y="60" width="60" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="430" y="82">9</text>
<text x="40" y="150" font-size="12" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#475569">row_splits</text>
<rect x="100" y="128" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="130" y="150">0</text>
<rect x="160" y="128" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="190" y="150">3</text>
<rect x="220" y="128" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="250" y="150">4</text>
<rect x="280" y="128" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="310" y="150">6</text>
<text x="500" y="76" font-size="13" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#475569">row 0 = values[0:3]</text>
<text x="500" y="96" font-size="13" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#475569">row 1 = values[3:4]</text>
<text x="500" y="116" font-size="13" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#475569">row 2 = values[4:6]</text>
</g>
<text x="360" y="215" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">[[3, 1, 4], [1], [5, 9]]  shape (3, None)</text>
</svg>
