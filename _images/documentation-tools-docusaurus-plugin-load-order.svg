<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How Docusaurus builds the ordered plugin list from presets, plugins and themes</title>
  <desc id="d">The presets entry yields preset plugins and preset themes, followed by the plugins entry and then the themes entry of the site config. Later entries have higher priority for theme component shadowing.</desc>
  <rect width="760" height="360" rx="12" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="13" font-weight="bold" fill="#ffffff">Site config entries</text>
  <text x="390" y="34" font-size="13" font-weight="bold" fill="#ffffff">Ordered instances, lowest priority first</text>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="50" width="300" height="60" rx="8" fill="#cfe3f7"/>
    <text x="32" y="74" font-weight="bold">presets: [ [classic, options] ]</text>
    <text x="32" y="94">each preset function returns plugins and themes</text>

    <rect x="20" y="130" width="300" height="60" rx="8" fill="#d9ead3"/>
    <text x="32" y="154" font-weight="bold">plugins: [ ... ]</text>
    <text x="32" y="174">names, paths, functions or tuples</text>

    <rect x="20" y="210" width="300" height="60" rx="8" fill="#fbe5c8"/>
    <text x="32" y="234" font-weight="bold">themes: [ ... ]</text>
    <text x="32" y="254">same loading rules as plugins</text>

    <rect x="400" y="50" width="160" height="40" rx="8" fill="#cfe3f7"/>
    <text x="412" y="75">1. preset plugins</text>
    <rect x="400" y="100" width="160" height="40" rx="8" fill="#cfe3f7"/>
    <text x="412" y="125">2. preset themes</text>
    <rect x="400" y="150" width="160" height="40" rx="8" fill="#d9ead3"/>
    <text x="412" y="175">3. site plugins</text>
    <rect x="400" y="200" width="160" height="40" rx="8" fill="#fbe5c8"/>
    <text x="412" y="225">4. site themes</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M320 80 H360 V70 H400"/>
    <path d="M320 80 H360 V120 H400"/>
    <path d="M320 160 H400"/>
    <path d="M320 240 H360 V220 H400"/>
    <path d="M610 60 V230"/>
    <path d="M603 218 L610 230 L617 218"/>
  </g>
  <text x="625" y="140" font-size="12" fill="#ffffff">later wins when two</text>
  <text x="625" y="158" font-size="12" fill="#ffffff">themes shadow the</text>
  <text x="625" y="176" font-size="12" fill="#ffffff">same component</text>
  <text x="30" y="305" font-size="12" fill="#ffffff">Every instance is then initialised: options are validated, the constructor runs and a plugin</text>
  <text x="30" y="324" font-size="12" fill="#ffffff">that returns null is dropped. Two instances with the same name and id stop the build.</text>
</svg>
