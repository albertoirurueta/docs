<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="340" fill="#ffffff"/>
  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Multitenancy strategies -- isolation vs. operational cost</text>

  <!-- Separate database -->
  <text x="130" y="55" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Separate database</text>
  <rect x="30" y="70" width="200" height="70" rx="4" fill="#eef3f8" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="130" y="93" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Database A</text>
  <text x="130" y="110" font-size="10" fill="#1c4b73" text-anchor="middle">Tenant 1 only</text>
  <rect x="30" y="150" width="200" height="70" rx="4" fill="#eef3f8" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="130" y="173" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Database B</text>
  <text x="130" y="190" font-size="10" fill="#1c4b73" text-anchor="middle">Tenant 2 only</text>
  <text x="130" y="245" font-size="10" fill="#1c4b73" text-anchor="middle">Strongest isolation</text>
  <text x="130" y="260" font-size="10" fill="#1c4b73" text-anchor="middle">Highest operational cost</text>

  <!-- Separate schema -->
  <text x="390" y="55" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Separate schema</text>
  <rect x="290" y="70" width="200" height="150" rx="4" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="390" y="88" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle">One database</text>
  <rect x="305" y="100" width="80" height="50" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
  <text x="345" y="128" font-size="9.5" fill="#2f5424" text-anchor="middle">schema_1</text>
  <rect x="395" y="100" width="80" height="50" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
  <text x="435" y="128" font-size="9.5" fill="#2f5424" text-anchor="middle">schema_2</text>
  <text x="390" y="180" font-size="10" fill="#2f5424" text-anchor="middle">connection switches schema</text>
  <text x="390" y="196" font-size="10" fill="#2f5424" text-anchor="middle">per request</text>
  <text x="390" y="245" font-size="10" fill="#2f5424" text-anchor="middle">Strong logical isolation</text>
  <text x="390" y="260" font-size="10" fill="#2f5424" text-anchor="middle">Shared infrastructure</text>

  <!-- Discriminator column -->
  <text x="650" y="55" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">Discriminator column</text>
  <rect x="550" y="70" width="200" height="90" rx="4" fill="#fbf1e4" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="650" y="88" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">orders (shared table)</text>
  <text x="650" y="106" font-size="9.5" fill="#8a3d10" text-anchor="middle">id | tenant_id | ...</text>
  <text x="650" y="122" font-size="9.5" fill="#8a3d10" text-anchor="middle">1  | tenant-1  | ...</text>
  <text x="650" y="138" font-size="9.5" fill="#8a3d10" text-anchor="middle">2  | tenant-2  | ...</text>
  <text x="650" y="154" font-size="9.5" fill="#8a3d10" text-anchor="middle">3  | tenant-1  | ...</text>
  <text x="650" y="245" font-size="10" fill="#8a3d10" text-anchor="middle">Cheapest operationally</text>
  <text x="650" y="260" font-size="10" fill="#8a3d10" text-anchor="middle">Weakest isolation (query-level only)</text>

  <rect x="20" y="290" width="740" height="40" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="390" y="314" font-size="11.5" fill="#444444" text-anchor="middle">Isolation strength decreases left to right; operational cost decreases left to right</text>
</svg>
