<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Paths from a trained model to a LiteRT .tflite file</title>
<desc id="d">A Keras 3 model exports with model.export format litert, a SavedModel or Keras model goes through the TFLiteConverter, and a PyTorch model goes through litert-torch. All three produce a .tflite flatbuffer that the LiteRT runtime runs on Android, iOS, embedded Linux or in Python.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Conversion paths to .tflite</text>
<rect x="24" y="64" width="150" height="48" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="99" y="93" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">Keras 3 model</text>
<rect x="24" y="136" width="150" height="48" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="99" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">SavedModel</text>
<rect x="24" y="208" width="150" height="48" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="99" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">PyTorch model</text>
<rect x="222" y="64" width="190" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="317" y="93" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">model.export(format="litert")</text>
<rect x="222" y="136" width="190" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="317" y="165" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">TFLiteConverter</text>
<rect x="222" y="208" width="190" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="317" y="237" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">litert-torch convert</text>
<rect x="456" y="136" width="100" height="48" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="506" y="165" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">.tflite</text>
<rect x="596" y="116" width="104" height="88" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="648" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">LiteRT</text>
<text x="648" y="164" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">runtime on</text>
<text x="648" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">device</text>
<line x1="174" y1="88" x2="220" y2="88" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="174" y1="160" x2="220" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="174" y1="232" x2="220" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="412" y1="88" x2="470" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="412" y1="160" x2="454" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="412" y1="232" x2="470" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="556" y1="160" x2="594" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Original drawing based on the LiteRT conversion guides and the Keras export API.</text>
</svg>
