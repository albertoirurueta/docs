<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="wc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">A chart in monthly-report.docx: three parts that must agree</text>

  <!-- document part -->
  <rect x="20" y="48" width="250" height="250" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="145" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">word/document.xml</text>
  <text x="34" y="100" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;w:p&gt;&lt;w:r&gt;</text>
  <text x="46" y="120" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;w:drawing&gt;</text>
  <text x="58" y="140" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;wp:inline&gt;</text>
  <text x="70" y="160" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;wp:extent cx cy/&gt;</text>
  <text x="70" y="180" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:chart r:id="rId2"/&gt;</text>
  <text x="58" y="200" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;/wp:inline&gt;</text>
  <text x="145" y="240" text-anchor="middle" font-size="12" fill="#333">Only the place (inline)</text>
  <text x="145" y="257" text-anchor="middle" font-size="12" fill="#333">and the size (EMU) of the chart</text>
  <text x="145" y="274" text-anchor="middle" font-size="12" fill="#333">XWPFDocument.createChart</text>

  <!-- chart part -->
  <rect x="330" y="48" width="270" height="250" rx="8" fill="#e3f6e8" stroke="#2f8a4d" stroke-width="1.4"/>
  <text x="465" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">word/charts/chart1.xml</text>
  <text x="344" y="100" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:barChart&gt;</text>
  <text x="356" y="120" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:ser&gt;</text>
  <text x="368" y="140" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:cat&gt;&lt;c:f&gt;Sheet0!$A$2:$A$6</text>
  <text x="368" y="160" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">  strCache: Fiction, Fantasy ...</text>
  <text x="368" y="180" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:val&gt;&lt;c:f&gt;Sheet0!$B$2:$B$6</text>
  <text x="368" y="200" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">  numCache: 128, 96, 61 ...</text>
  <text x="344" y="226" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">&lt;c:externalData r:id="rId1"/&gt;</text>
  <text x="465" y="258" text-anchor="middle" font-size="12" fill="#333">What is drawn: formulas plus a cached</text>
  <text x="465" y="275" text-anchor="middle" font-size="12" fill="#333">copy of the numbers (XDDF classes)</text>

  <!-- workbook part -->
  <rect x="660" y="48" width="220" height="250" rx="8" fill="#fff4e0" stroke="#c77a00" stroke-width="1.4"/>
  <text x="770" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">word/embeddings/*.xlsx</text>
  <rect x="680" y="88" width="180" height="22" fill="#ffe3b3" stroke="#c77a00"/>
  <g font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d"><text x="686" y="104">A</text><text x="748" y="104">B</text><text x="796" y="104">C</text></g>
  <rect x="680" y="110" width="180" height="22" fill="#fffaf0" stroke="#c77a00"/>
  <g font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d"><text x="686" y="126"></text><text x="748" y="126">Loaned</text><text x="796" y="126">Returned</text></g>
  <rect x="680" y="132" width="180" height="22" fill="#fffaf0" stroke="#c77a00"/>
  <g font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d"><text x="686" y="148">Fiction</text><text x="748" y="148">128</text><text x="796" y="148">120</text></g>
  <rect x="680" y="154" width="180" height="22" fill="#fffaf0" stroke="#c77a00"/>
  <g font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d"><text x="686" y="170">Fantasy</text><text x="748" y="170">96</text><text x="796" y="170">90</text></g>
  <text x="770" y="204" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#2d2d2d">sheet name: Sheet0</text>
  <text x="770" y="258" text-anchor="middle" font-size="12" fill="#333">What "Edit Data" in Word opens</text>
  <text x="770" y="275" text-anchor="middle" font-size="12" fill="#333">XWPFChart.getWorkbook()</text>

  <!-- arrows -->
  <line x1="270" y1="180" x2="326" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#wc-arrow)"/>
  <text x="298" y="170" text-anchor="middle" font-size="11" fill="#333">rel.</text>
  <line x1="600" y1="180" x2="656" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#wc-arrow)"/>
  <text x="628" y="170" text-anchor="middle" font-size="11" fill="#333">rel.</text>

  <!-- footer -->
  <rect x="20" y="322" width="860" height="86" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="1.2"/>
  <text x="34" y="346" font-size="13" font-weight="700" fill="#333">Consequences for the code</text>
  <text x="34" y="368" font-size="12.5" fill="#333">1. The chart part and the workbook hold the same numbers twice: change both, or the two views disagree.</text>
  <text x="34" y="388" font-size="12.5" fill="#333">2. The chart formulas (Sheet0!$B$2:$B$6) must point at cells that exist in the embedded workbook.</text>
  <text x="34" y="404" font-size="12.5" fill="#333">3. Word and LibreOffice draw from the cached values; the workbook is opened only when the user edits the data.</text>
</svg>
