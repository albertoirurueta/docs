<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a log call to the log shipper</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the application chooses the backend once; libraries only see Logger</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="70" width="210" height="150" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="125" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Callers</text>
  <text x="125" y="118" font-size="11" fill="#222222" text-anchor="middle">route handlers: req.logger</text>
  <text x="125" y="136" font-size="11" fill="#222222" text-anchor="middle">configure, commands: app.logger</text>
  <text x="125" y="154" font-size="11" fill="#222222" text-anchor="middle">RouteLoggingMiddleware,</text>
  <text x="125" y="170" font-size="11" fill="#222222" text-anchor="middle">ErrorMiddleware, Fluent, NIO</text>
  <text x="125" y="194" font-size="11" fill="#222222" text-anchor="middle">services: Logger(label:)</text>

  <rect x="270" y="70" width="190" height="150" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="365" y="94" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Logger (a value)</text>
  <text x="365" y="118" font-size="11" fill="#222222" text-anchor="middle">label, logLevel, metadata</text>
  <text x="365" y="136" font-size="11" fill="#222222" text-anchor="middle">request-id on req.logger</text>
  <text x="365" y="154" font-size="11" fill="#222222" text-anchor="middle">below logLevel: dropped,</text>
  <text x="365" y="170" font-size="11" fill="#222222" text-anchor="middle">message never built</text>
  <text x="365" y="194" font-size="11" fill="#222222" text-anchor="middle">above: build a LogEvent</text>

  <rect x="500" y="70" width="210" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="605" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">LogHandler</text>
  <text x="605" y="118" font-size="11" fill="#222222" text-anchor="middle">created by LoggingSystem.bootstrap</text>
  <text x="605" y="136" font-size="11" fill="#222222" text-anchor="middle">merges provider, logger and</text>
  <text x="605" y="152" font-size="11" fill="#222222" text-anchor="middle">per-message metadata</text>
  <text x="605" y="176" font-size="11" fill="#222222" text-anchor="middle">ConsoleLogger: text lines</text>
  <text x="605" y="194" font-size="11" fill="#222222" text-anchor="middle">JSONLogHandler: JSON lines</text>

  <rect x="750" y="70" width="170" height="150" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="835" y="94" font-size="14" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Standard output</text>
  <text x="835" y="118" font-size="11" fill="#222222" text-anchor="middle">one line per event</text>
  <text x="835" y="136" font-size="11" fill="#222222" text-anchor="middle">Docker log driver or</text>
  <text x="835" y="152" font-size="11" fill="#222222" text-anchor="middle">Kubernetes node agent</text>
  <text x="835" y="176" font-size="11" fill="#222222" text-anchor="middle">collector, search, alerts</text>

  <line x1="230" y1="145" x2="268" y2="145" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="145" x2="498" y2="145" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="710" y1="145" x2="748" y2="145" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="270" y="260" width="440" height="110" rx="8" fill="#fafafa" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="490" y="284" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Metadata provider (optional, set at bootstrap)</text>
  <text x="490" y="308" font-size="11" fill="#222222" text-anchor="middle">called by the handler for every event; reads task-local values</text>
  <text x="490" y="326" font-size="11" fill="#222222" text-anchor="middle">RequestIDMiddleware binds the id with @TaskLocal withValue,</text>
  <text x="490" y="342" font-size="11" fill="#222222" text-anchor="middle">so a service without a Request still logs request-id</text>
  <line x1="605" y1="258" x2="605" y2="222" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="20" y="260" font-size="12" fill="#666666">Level order, least to most severe:</text>
  <text x="20" y="280" font-size="12" fill="#222222">trace, debug, info, notice,</text>
  <text x="20" y="298" font-size="12" fill="#222222">warning, error, critical</text>
  <text x="20" y="324" font-size="12" fill="#666666">Default level:</text>
  <text x="20" y="342" font-size="12" fill="#222222">notice in production, info otherwise</text>
  <text x="20" y="360" font-size="12" fill="#222222">(--log or LOG_LEVEL overrides)</text>
</svg>
