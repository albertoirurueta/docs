<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One server, many data models</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">a single in-memory keyspace exposes each data structure and engine as its own command family</text>

  <!-- spokes from the core to each model -->
  <g stroke="#cccccc" stroke-width="1.4">
    <line x1="380" y1="255" x2="260" y2="115"/>
    <line x1="380" y1="255" x2="380" y2="115"/>
    <line x1="380" y1="255" x2="500" y2="115"/>
    <line x1="380" y1="255" x2="170" y2="170"/>
    <line x1="380" y1="255" x2="590" y2="170"/>
    <line x1="380" y1="255" x2="145" y2="255"/>
    <line x1="380" y1="255" x2="615" y2="255"/>
    <line x1="380" y1="255" x2="170" y2="340"/>
    <line x1="380" y1="255" x2="590" y2="340"/>
    <line x1="380" y1="255" x2="260" y2="405"/>
    <line x1="380" y1="255" x2="380" y2="405"/>
    <line x1="380" y1="255" x2="500" y2="405"/>
  </g>

  <!-- Redis core -->
  <circle cx="380" cy="255" r="56" fill="#a3281f" stroke="#7a1f18" stroke-width="1.5"/>
  <text x="380" y="251" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Redis core</text>
  <text x="380" y="267" font-size="10" fill="#f3d9d6" text-anchor="middle">single process,</text>
  <text x="380" y="279" font-size="10" fill="#f3d9d6" text-anchor="middle">one keyspace</text>

  <!-- satellite data models -->
  <g fill="#f4f4f4" stroke="#999999" stroke-width="1.2">
    <rect x="207" y="100" width="106" height="30" rx="6"/>
    <rect x="327" y="100" width="106" height="30" rx="6"/>
    <rect x="447" y="100" width="106" height="30" rx="6"/>
    <rect x="115" y="155" width="110" height="30" rx="6"/>
    <rect x="535" y="155" width="110" height="30" rx="6"/>
    <rect x="90"  y="240" width="110" height="30" rx="6"/>
    <rect x="560" y="240" width="110" height="30" rx="6"/>
    <rect x="115" y="325" width="110" height="30" rx="6"/>
    <rect x="535" y="325" width="110" height="30" rx="6"/>
    <rect x="207" y="395" width="106" height="30" rx="6"/>
    <rect x="327" y="395" width="106" height="30" rx="6"/>
    <rect x="447" y="395" width="106" height="30" rx="6"/>
  </g>

  <g font-size="12" fill="#222222" text-anchor="middle">
    <text x="260" y="119">Strings</text>
    <text x="380" y="119">Hashes</text>
    <text x="500" y="119">Lists</text>
    <text x="170" y="174">Sets</text>
    <text x="590" y="174">Sorted sets</text>
    <text x="145" y="259">Streams</text>
    <text x="615" y="259">Geo</text>
    <text x="170" y="344">JSON</text>
    <text x="590" y="344">Query Engine</text>
    <text x="260" y="414">Vector sets</text>
    <text x="380" y="414">Time series</text>
    <text x="500" y="414">Probabilistic</text>
  </g>

  <text x="380" y="447" font-size="11" fill="#444444" text-anchor="middle">Every model above lives in the same keyspace and is reached through its own command family --</text>
  <text x="380" y="463" font-size="11" fill="#444444" text-anchor="middle">e.g. SET/GET for strings, HSET for hashes, XADD for streams, FT.SEARCH for the Query Engine.</text>
</svg>
