<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">LSTM cell</title>
  <desc id="d">An LSTM cell: the cell state flows left to right along the top, multiplied by the forget gate and added to the input gate times the candidate; the output gate multiplies tanh of the cell state to give the new hidden state; the previous hidden state and the input feed all gates.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">One LSTM cell</text>
  <text x="30" y="68" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">c(t-1)</text>
  <line x1="30" y1="80" x2="690" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="640" y="68" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">c(t)</text>
  <circle cx="180" cy="80" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="180" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">×</text>
  <circle cx="400" cy="80" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">+</text>
  <circle cx="400" cy="150" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="156" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">×</text>
  <line x1="400" y1="136" x2="400" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M560,80 L560,110" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="530" y="110" width="60" height="26" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="560" y="128" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">tanh</text>
  <circle cx="560" cy="190" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="560" y="196" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">×</text>
  <line x1="560" y1="136" x2="560" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="140" y="215" width="80" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="180" y="235" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">σ forget</text>
  <rect x="260" y="215" width="80" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="300" y="235" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">σ input</text>
  <rect x="360" y="215" width="80" height="30" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="400" y="235" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">tanh cand</text>
  <rect x="460" y="215" width="80" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="500" y="235" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">σ output</text>
  <line x1="180" y1="215" x2="180" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M300,215 L300,150 L384,150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <line x1="400" y1="215" x2="400" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M500,215 L500,190 L544,190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <line x1="150" y1="290" x2="530" y2="290" stroke="#94A3B8" stroke-width="2"/>
  <line x1="180" y1="290" x2="180" y2="245" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="290" x2="300" y2="245" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="400" y1="290" x2="400" y2="245" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="500" y1="290" x2="500" y2="245" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="30" y="320" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">h(t-1)</text>
  <line x1="80" y1="316" x2="150" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="330" y="345" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">x(t)</text>
  <line x1="330" y1="330" x2="330" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="560" y1="204" x2="560" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="560" y1="330" x2="640" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="648" y="334" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">h(t)</text>
  <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">× elementwise product</text>
  <text x="30" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">+ elementwise sum</text>
</svg>
