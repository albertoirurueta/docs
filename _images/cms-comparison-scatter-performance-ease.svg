<text class="footer" x="24" y="566" text-anchor="start"><tspan x="24" dy="0">Source: editorial scores with their basis and source ids in radar-scores.csv; popularity, growth, talent pool and ecosystem from W3Techs, HTTP Archive,</tspan><tspan x="24" dy="15">GitHub and Stack Exchange; performance from the HTTP Archive Tech Report; retrieved 2026-10-29. A CMS missing either score is not plotted. Raw data:</tspan><tspan x="24" dy="15">scripts/cms-comparison-charts/data/radar-scores.csv. See the Bibliography for the sources.</tspan></text>
