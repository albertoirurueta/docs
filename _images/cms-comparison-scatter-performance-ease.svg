<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" role="img" aria-labelledby="scatter-performance-ease-t scatter-performance-ease-d">
<title id="scatter-performance-ease-t">Performance against ease of use for developers</title>
<desc id="scatter-performance-ease-d">Editorial ease of use for developers (x) against computed performance (y: Core Web Vitals pass rate and Lighthouse score from the HTTP Archive), coloured by group. A CMS with no performance series is not plotted.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}</style>
<rect width="900" height="617" fill="var(--bg)"/>
<text class="title" x="450" y="24" text-anchor="middle">Performance against ease of use for developers</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Traditional open-source</text><rect class="m1" x="301" y="-4" width="8" height="8"/><text x="323" y="4">Hosted builders</text><path class="m2" d="M528 -5L533 4L523 4Z"/><text x="546" y="4">Headless</text><path class="m3" d="M82 15L87 20L82 25L77 20Z"/><text x="100" y="24">Enterprise and other stacks</text></g></g><line class="grid" x1="70" y1="504" x2="870" y2="504"/><text class="muted" x="62" y="508" text-anchor="end">0</text><line class="grid" x1="70" y1="422" x2="870" y2="422"/><text class="muted" x="62" y="426" text-anchor="end">2</text><line class="grid" x1="70" y1="340" x2="870" y2="340"/><text class="muted" x="62" y="344" text-anchor="end">4</text><line class="grid" x1="70" y1="258" x2="870" y2="258"/><text class="muted" x="62" y="262" text-anchor="end">6</text><line class="grid" x1="70" y1="176" x2="870" y2="176"/><text class="muted" x="62" y="180" text-anchor="end">8</text><line class="grid" x1="70" y1="94" x2="870" y2="94"/><text class="muted" x="62" y="98" text-anchor="end">10</text><line class="grid" x1="70" y1="94" x2="70" y2="504"/><text class="muted" x="70" y="522" text-anchor="middle">0</text><line class="grid" x1="336.67" y1="94" x2="336.67" y2="504"/><text class="muted" x="336.67" y="522" text-anchor="middle">5</text><line class="grid" x1="603.33" y1="94" x2="603.33" y2="504"/><text class="muted" x="603.33" y="522" text-anchor="middle">10</text><line class="grid" x1="870" y1="94" x2="870" y2="504"/><text class="muted" x="870" y="522" text-anchor="middle">15</text><path class="axis" d="M70 94V504H870"/><text class="axis-label" x="470" y="544" text-anchor="middle">Ease of use (developers) score 0-10 (editorial)</text><text class="axis-label" transform="translate(16 299) rotate(-90)" text-anchor="middle">Performance score 0-10 (computed)</text><g><title>WordPress</title><circle class="m0" cx="390" cy="290.8" r="4.5"/><text class="muted" x="398" y="294.8">WordPress</text></g><g><title>Drupal</title><circle class="m0" cx="283.33" cy="249.8" r="4.5"/><text class="muted" x="291.33" y="253.8">Drupal</text></g><g><title>Joomla</title><circle class="m0" cx="336.67" cy="278.5" r="4.5"/><text class="muted" x="344.67" y="282.5">Joomla</text></g><g><title>TYPO3</title><circle class="m0" cx="283.33" cy="225.2" r="4.5"/><text class="muted" x="291.33" y="229.2">TYPO3</text></g><g><title>Craft CMS</title><circle class="m0" cx="496.67" cy="249.8" r="4.5"/></g><g><title>Webflow</title><rect class="m1" x="385.5" y="204.3" width="9" height="9"/><text class="muted" x="398" y="212.8">Webflow</text></g><g><title>Wix</title><rect class="m1" x="385.5" y="183.8" width="9" height="9"/><text class="muted" x="398" y="192.3">Wix</text></g><g><title>Squarespace</title><rect class="m1" x="332.17" y="257.6" width="9" height="9"/><text class="muted" x="344.67" y="266.1">Squarespace</text></g><g><title>Contentful</title><path class="m2" d="M443.33 297.6L448.83 307.6L437.83 307.6Z"/></g><g><title>Strapi</title><path class="m2" d="M496.67 305.8L502.17 315.8L491.17 315.8Z"/><text class="muted" x="504.67" y="315.3">Strapi</text></g><g><title>Sanity</title><path class="m2" d="M496.67 252.5L502.17 262.5L491.17 262.5Z"/><text class="muted" x="504.67" y="262">Sanity</text></g><g><title>AEM</title><path class="m3" d="M230 326.3L235.5 331.8L230 337.3L224.5 331.8Z"/><text class="muted" x="238" y="335.8">AEM</text></g><g><title>Umbraco</title><path class="m3" d="M443.33 236.1L448.83 241.6L443.33 247.1L437.83 241.6Z"/><text class="muted" x="451.33" y="245.6">Umbraco</text></g><g><title>Wagtail</title><path class="m3" d="M496.67 248.4L502.17 253.9L496.67 259.4L491.17 253.9Z"/></g><g><title>Ghost</title><path class="m3" d="M443.33 211.5L448.83 217L443.33 222.5L437.83 217Z"/><text class="muted" x="451.33" y="221">Ghost</text></g>
