<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">Front-end tooling pipeline of a Drupal theme</title>
  <desc id="d">Source files are compiled by Vite or PostCSS with Tailwind into compiled assets, which Drupal attaches through libraries.yml. A second path compiles Twig stories to JSON for Storybook, which asks Drupal to render each story.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">
    <text x="20" y="28" font-size="15" font-weight="bold">Build path (theme meridian)</text>
    <rect x="20" y="44" width="190" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="115" y="68" text-anchor="middle" font-weight="bold">Sources</text>
    <text x="115" y="90" text-anchor="middle">src/css/main.css</text>
    <text x="115" y="108" text-anchor="middle">src/js/main.js</text>
    <text x="115" y="126" text-anchor="middle">components/*/*.twig</text>

    <rect x="260" y="44" width="190" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="355" y="68" text-anchor="middle" font-weight="bold">Build tool</text>
    <text x="355" y="90" text-anchor="middle">Vite or PostCSS</text>
    <text x="355" y="108" text-anchor="middle">Tailwind CSS 4 scans</text>
    <text x="355" y="126" text-anchor="middle">Twig for class names</text>

    <rect x="500" y="44" width="170" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="585" y="68" text-anchor="middle" font-weight="bold">Compiled assets</text>
    <text x="585" y="90" text-anchor="middle">dist/css/main.css</text>
    <text x="585" y="108" text-anchor="middle">dist/js/main.js</text>
    <text x="585" y="126" text-anchor="middle">(built in CI)</text>

    <rect x="710" y="44" width="150" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="785" y="68" text-anchor="middle" font-weight="bold">Drupal</text>
    <text x="785" y="90" text-anchor="middle">meridian.libraries.yml</text>
    <text x="785" y="108" text-anchor="middle">attach_library</text>
    <text x="785" y="126" text-anchor="middle">aggregation</text>

    <line x1="210" y1="92" x2="258" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="92" x2="498" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="670" y1="92" x2="708" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

    <text x="20" y="196" font-size="15" font-weight="bold">Preview and test path</text>
    <rect x="20" y="212" width="190" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="115" y="236" text-anchor="middle" font-weight="bold">Twig stories</text>
    <text x="115" y="258" text-anchor="middle">card.stories.twig</text>
    <text x="115" y="276" text-anchor="middle">story and stories tags</text>

    <rect x="260" y="212" width="190" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="355" y="236" text-anchor="middle" font-weight="bold">Drush</text>
    <text x="355" y="258" text-anchor="middle">storybook:generate-</text>
    <text x="355" y="276" text-anchor="middle">all-stories</text>

    <rect x="500" y="212" width="170" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="585" y="236" text-anchor="middle" font-weight="bold">Storybook</text>
    <text x="585" y="258" text-anchor="middle">reads *.stories.json</text>
    <text x="585" y="276" text-anchor="middle">fetches HTML</text>

    <rect x="710" y="212" width="150" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="785" y="236" text-anchor="middle" font-weight="bold">Drupal render</text>
    <text x="785" y="258" text-anchor="middle">route renders the</text>
    <text x="785" y="276" text-anchor="middle">real Twig template</text>

    <line x1="210" y1="260" x2="258" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="260" x2="498" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="670" y1="260" x2="708" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

    <rect x="500" y="338" width="360" height="40" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.5"/>
    <text x="680" y="363" text-anchor="middle">Linters (ESLint, Stylelint) and screenshot tests</text>
    <line x1="585" y1="310" x2="585" y2="336" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="355" y1="140" x2="355" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="365" y="180" font-size="12" fill="#475569">same CSS is loaded by both</text>
  </g>
</svg>
