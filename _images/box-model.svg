<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="440" fill="#ffffff"/>

  <!-- margin layer -->
  <rect x="20" y="20" width="520" height="400" fill="#fdf1dc" stroke="#c9861f" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="38" y="46" font-size="17" font-weight="bold" fill="#8a5a10">margin</text>

  <!-- border layer -->
  <rect x="70" y="66" width="420" height="308" fill="#f6d9a4" stroke="#8a5a10" stroke-width="5"/>
  <text x="88" y="92" font-size="17" font-weight="bold" fill="#6b4207">border</text>

  <!-- padding layer -->
  <rect x="112" y="108" width="336" height="224" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="130" y="134" font-size="17" font-weight="bold" fill="#2a6636">padding</text>

  <!-- content layer -->
  <rect x="168" y="164" width="224" height="112" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="280" y="212" font-size="17" font-weight="bold" fill="#1c4b73" text-anchor="middle">content</text>
  <text x="280" y="232" font-size="13" fill="#1c4b73" text-anchor="middle">width x height</text>

  <!-- width arrow (below content box) -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c4b73"/>
    </marker>
  </defs>
  <line x1="168" y1="290" x2="392" y2="290" stroke="#1c4b73" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="306" font-size="12" fill="#1c4b73" text-anchor="middle">width</text>

  <!-- height arrow (left of content box) -->
  <line x1="150" y1="164" x2="150" y2="276" stroke="#1c4b73" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="220" font-size="12" fill="#1c4b73" text-anchor="middle" transform="rotate(-90 140 220)">height</text>
</svg>
