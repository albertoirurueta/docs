<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Published Docusaurus Faster benchmark, build time in seconds</title>
  <desc id="d">Bar chart of the benchmark published with Docusaurus 3.8. ReactNative.dev: cold build 120 seconds without Faster and 31 with, warm rebuild 33 and 17. Docusaurus.io: cold build 146 and 42, warm rebuild 45 and 24.</desc>
  <rect width="760" height="420" rx="12" fill="#2b3a4a"/>
  <text x="20" y="30" font-size="14" fill="#ffffff" font-weight="bold">Build time in seconds (lower is better)</text>
  <rect x="470" y="16" width="14" height="14" fill="#f7c97b"/><text x="490" y="28" font-size="12" fill="#ffffff">Without Faster</text>
  <rect x="610" y="16" width="14" height="14" fill="#7fd1a0"/><text x="630" y="28" font-size="12" fill="#ffffff">With Faster</text>
  <line x1="40" y1="330" x2="740" y2="330" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="70" y="150.0" width="50" height="180.0" fill="#f7c97b"/>
  <text x="95" y="144.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">120 s</text>
  <rect x="128" y="283.5" width="50" height="46.5" fill="#7fd1a0"/>
  <text x="153" y="277.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">31 s</text>
  <text x="124" y="352" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ReactNative.dev</text>
  <text x="124" y="370" font-size="12" fill="#ffffff" text-anchor="middle">cold build</text>
  <rect x="240" y="280.5" width="50" height="49.5" fill="#f7c97b"/>
  <text x="265" y="274.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">33 s</text>
  <rect x="298" y="304.5" width="50" height="25.5" fill="#7fd1a0"/>
  <text x="323" y="298.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">17 s</text>
  <text x="294" y="352" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ReactNative.dev</text>
  <text x="294" y="370" font-size="12" fill="#ffffff" text-anchor="middle">warm rebuild</text>
  <rect x="410" y="111.0" width="50" height="219.0" fill="#f7c97b"/>
  <text x="435" y="105.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">146 s</text>
  <rect x="468" y="267.0" width="50" height="63.0" fill="#7fd1a0"/>
  <text x="493" y="261.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">42 s</text>
  <text x="464" y="352" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Docusaurus.io</text>
  <text x="464" y="370" font-size="12" fill="#ffffff" text-anchor="middle">cold build</text>
  <rect x="580" y="262.5" width="50" height="67.5" fill="#f7c97b"/>
  <text x="605" y="256.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">45 s</text>
  <rect x="638" y="294.0" width="50" height="36.0" fill="#7fd1a0"/>
  <text x="663" y="288.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">24 s</text>
  <text x="634" y="352" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Docusaurus.io</text>
  <text x="634" y="370" font-size="12" fill="#ffffff" text-anchor="middle">warm rebuild</text>
  <text x="20" y="408" font-size="11" fill="#d7e0ea">Figures from the Docusaurus 3.8 release post, measured by the Docusaurus team on large sites.</text>
</svg>
