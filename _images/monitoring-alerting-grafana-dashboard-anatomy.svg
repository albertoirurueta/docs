<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Anatomy of a Grafana dashboard: the dashboard holds controls (time picker, variables, annotation queries, links) and a layout of rows or tabs that contain panels; inside each panel the data flows from queries to transformations to field configuration and then to the visualization</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
<text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a Grafana dashboard</text>
<text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">dashboard, then rows or tabs, then panels; in each panel, queries, transformations, field config</text>

<rect x="20" y="58" width="760" height="428" rx="10" fill="#fafafa" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="76" font-size="10.5" fill="#37474f">Dashboard: one JSON model (uid, title, tags, time range, refresh, panels, templating, annotations, links), stored in a folder</text>

<rect x="40" y="88" width="720" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="56" y="107" font-size="12" font-weight="bold" fill="#0d3c75">Controls: time picker and refresh, variables, annotation queries, dashboard links</text>
<text x="56" y="125" font-size="9.5" fill="#37474f">Apply to every panel; variable values are written to the URL as var-&lt;name&gt; and substituted into the queries</text>

<rect x="40" y="148" width="720" height="140" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="56" y="168" font-size="12" font-weight="bold" fill="#4a148c">Layout: rows or tabs, each holding a Custom grid or an Auto grid of panels</text>

<rect x="56" y="180" width="220" height="96" rx="6" fill="#ffffff" stroke="#6a1b9a"/>
<text x="68" y="198" font-size="10.5" font-weight="bold" fill="#4a148c">Row: Golden signals</text>
<rect x="68" y="208" width="44" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="90" y="225" font-size="9" fill="#1b5e20" text-anchor="middle">Stat</text>
<rect x="118" y="208" width="44" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="140" y="225" font-size="9" fill="#1b5e20" text-anchor="middle">Stat</text>
<rect x="168" y="208" width="44" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="190" y="225" font-size="9" fill="#1b5e20" text-anchor="middle">Stat</text>
<rect x="218" y="208" width="44" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="240" y="225" font-size="9" fill="#1b5e20" text-anchor="middle">Stat</text>
<rect x="68" y="240" width="94" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="115" y="257" font-size="9" fill="#1b5e20" text-anchor="middle">Time series</text>
<rect x="168" y="240" width="94" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="215" y="257" font-size="9" fill="#1b5e20" text-anchor="middle">Time series</text>

<rect x="290" y="180" width="220" height="96" rx="6" fill="#ffffff" stroke="#6a1b9a"/>
<text x="302" y="198" font-size="10.5" font-weight="bold" fill="#4a148c">Row: Logs and traces</text>
<rect x="302" y="208" width="94" height="58" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="349" y="241" font-size="9" fill="#1b5e20" text-anchor="middle">Logs</text>
<rect x="402" y="208" width="94" height="58" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="449" y="241" font-size="9" fill="#1b5e20" text-anchor="middle">Table</text>

<rect x="524" y="180" width="220" height="96" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-dasharray="4 3"/>
<text x="536" y="198" font-size="10.5" font-weight="bold" fill="#4a148c">Row: Dependencies (collapsed)</text>
<text x="536" y="222" font-size="9.5" fill="#37474f">JVM heap and database pool panels,</text>
<text x="536" y="236" font-size="9.5" fill="#37474f">queried only when the row is expanded</text>
<text x="536" y="258" font-size="9.5" fill="#37474f">Tabs work the same way, one tab visible</text>

<path d="M115,266 L115,300 L80,300 L80,318" fill="none" stroke="#37474f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="124" y="296" font-size="9.5" fill="#555555">inside one panel</text>

<rect x="40" y="320" width="720" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="56" y="340" font-size="12" font-weight="bold" fill="#1b5e20">Panel: the data flows left to right, then the visualization draws it</text>

<rect x="56" y="352" width="160" height="104" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="136" y="372" font-size="10.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Queries</text>
<text x="136" y="390" font-size="9.5" fill="#37474f" text-anchor="middle">one per refId (A, B, ...)</text>
<text x="136" y="404" font-size="9.5" fill="#37474f" text-anchor="middle">data source: Prometheus,</text>
<text x="136" y="418" font-size="9.5" fill="#37474f" text-anchor="middle">Loki, Tempo or Mixed</text>
<text x="136" y="432" font-size="9.5" fill="#37474f" text-anchor="middle">$variables, $__rate_interval</text>
<text x="136" y="446" font-size="9.5" fill="#37474f" text-anchor="middle">expressions (Math, Reduce)</text>

<rect x="234" y="352" width="160" height="104" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="314" y="372" font-size="10.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Transformations</text>
<text x="314" y="390" font-size="9.5" fill="#37474f" text-anchor="middle">applied in order to the</text>
<text x="314" y="404" font-size="9.5" fill="#37474f" text-anchor="middle">returned frames: join,</text>
<text x="314" y="418" font-size="9.5" fill="#37474f" text-anchor="middle">filter, organize fields,</text>
<text x="314" y="432" font-size="9.5" fill="#37474f" text-anchor="middle">reduce, group by</text>

<rect x="412" y="352" width="160" height="104" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="492" y="372" font-size="10.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Field config</text>
<text x="492" y="390" font-size="9.5" fill="#37474f" text-anchor="middle">standard options: unit,</text>
<text x="492" y="404" font-size="9.5" fill="#37474f" text-anchor="middle">min and max, decimals</text>
<text x="492" y="418" font-size="9.5" fill="#37474f" text-anchor="middle">thresholds, value mappings,</text>
<text x="492" y="432" font-size="9.5" fill="#37474f" text-anchor="middle">data links, overrides</text>

<rect x="590" y="352" width="154" height="104" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="667" y="372" font-size="10.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Visualization</text>
<text x="667" y="390" font-size="9.5" fill="#37474f" text-anchor="middle">Stat, Time series, Logs,</text>
<text x="667" y="404" font-size="9.5" fill="#37474f" text-anchor="middle">Table, ...</text>
<text x="667" y="418" font-size="9.5" fill="#37474f" text-anchor="middle">panel options: title,</text>
<text x="667" y="432" font-size="9.5" fill="#37474f" text-anchor="middle">legend, tooltip, repeat</text>

<line x1="216" y1="404" x2="232" y2="404" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="394" y1="404" x2="410" y2="404" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="572" y1="404" x2="588" y2="404" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
