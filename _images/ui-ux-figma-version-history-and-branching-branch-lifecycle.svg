<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Branch lifecycle and who can do what</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="20" y="60" width="130" height="60" rx="10"/><rect x="190" y="60" width="130" height="60" rx="10"/><rect x="360" y="60" width="130" height="60" rx="10"/><rect x="530" y="60" width="130" height="60" rx="10"/>
  </g>
  <rect x="190" y="200" width="130" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <rect x="530" y="200" width="130" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <rect x="360" y="200" width="130" height="60" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M151,90 L189,90" marker-end="url(#ah)"/><path d="M321,90 L359,90" marker-end="url(#ah)"/><path d="M491,90 L529,90" marker-end="url(#ah)"/><path d="M255,121 L255,199" marker-end="url(#ah)"/><path d="M595,121 L595,199" marker-end="url(#ah)"/><path d="M529,230 L491,230" marker-end="url(#ah)"/></g>
  <g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="85" y="95">Create branch</text><text x="255" y="95">Edit</text><text x="425" y="85">Request</text><text x="425" y="102">review</text><text x="595" y="85">Review and</text><text x="595" y="102">merge</text></g>
  <g font-size="13" font-weight="bold" text-anchor="middle"><text x="255" y="226" fill="#92400E">Update from</text><text x="255" y="243" fill="#92400E">main</text><text x="425" y="235" fill="#374151">Archived</text><text x="595" y="226" fill="#047857">Main file</text><text x="595" y="243" fill="#047857">updated</text></g>
  <g font-size="11" fill="#374151" text-anchor="middle"><text x="85" y="140">Full seat, view or</text><text x="85" y="155">edit access to main</text><text x="255" y="285">Notified when main changes;</text><text x="255" y="300">resolve conflicts if any</text><text x="425" y="140">Review is optional</text><text x="425" y="155">with edit access</text><text x="595" y="285">Merging needs edit</text><text x="595" y="300">access to the main file</text><text x="425" y="285">Merging archives</text><text x="425" y="300">the branch</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Plans with branching: Education (K-12), Organization, Government and Enterprise (checked 2026-10-30).</text>
