<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which deadline covers which part of one request on a keep-alive connection</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">http.Server timeouts and http.TimeoutHandler drawn on the life of a single HTTP/1.1 request; time runs left to right</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  </defs>

  <!-- connection lane -->
  <text x="20" y="92" font-size="13" font-weight="bold" fill="#222222">connection</text>
  <text x="20" y="108" font-size="11" fill="#666666">bytes on the wire</text>
  <g font-size="12" fill="#222222">
    <rect x="130" y="76" width="150" height="40" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="205" y="94" text-anchor="middle">request line</text>
    <text x="205" y="108" text-anchor="middle">and headers</text>
    <rect x="280" y="76" width="170" height="40" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="365" y="101" text-anchor="middle">request body</text>
    <rect x="610" y="76" width="170" height="40" fill="#fdf1e3" stroke="#a5651a"/>
    <text x="695" y="101" text-anchor="middle">response written</text>
    <rect x="780" y="76" width="150" height="40" fill="#eeeeee" stroke="#777777"/>
    <text x="855" y="94" text-anchor="middle">idle, waiting for</text>
    <text x="855" y="108" text-anchor="middle">the next request</text>
  </g>

  <!-- handler lane -->
  <text x="20" y="152" font-size="13" font-weight="bold" fill="#222222">your code</text>
  <text x="20" y="168" font-size="11" fill="#666666">ServeHTTP</text>
  <rect x="280" y="136" width="500" height="40" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="530" y="161" font-size="12" fill="#222222" text-anchor="middle">handler runs: reads the body, queries, writes the response</text>

  <!-- vertical guides -->
  <g stroke="#999999" stroke-dasharray="4,4">
    <line x1="130" y1="120" x2="130" y2="440"/>
    <line x1="280" y1="120" x2="280" y2="440"/>
    <line x1="450" y1="120" x2="450" y2="440"/>
    <line x1="780" y1="120" x2="780" y2="440"/>
    <line x1="930" y1="120" x2="930" y2="440"/>
  </g>

  <!-- timeout brackets -->
  <g font-size="12" fill="#222222">
    <!-- ReadHeaderTimeout -->
    <line x1="130" y1="206" x2="280" y2="206" stroke="#2e7d32" stroke-width="4"/>
    <text x="290" y="210" font-weight="bold" fill="#2e7d32">ReadHeaderTimeout</text>
    <text x="440" y="210" fill="#555555">time allowed to read the request line and headers (a stalled client is dropped)</text>

    <!-- ReadTimeout -->
    <line x1="130" y1="246" x2="450" y2="246" stroke="#1c4b73" stroke-width="4"/>
    <text x="460" y="250" font-weight="bold" fill="#1c4b73">ReadTimeout</text>
    <text x="560" y="250" fill="#555555">headers and the whole body, one deadline for the request</text>

    <!-- WriteTimeout -->
    <line x1="280" y1="286" x2="780" y2="286" stroke="#a5651a" stroke-width="4"/>
    <text x="790" y="290" font-weight="bold" fill="#a5651a">WriteTimeout</text>
    <text x="280" y="306" font-size="11" fill="#555555">starts when the headers have been read; covers the handler and the response</text>

    <!-- TimeoutHandler -->
    <line x1="280" y1="336" x2="620" y2="336" stroke="#6a1b9a" stroke-width="4"/>
    <text x="630" y="340" font-weight="bold" fill="#6a1b9a">http.TimeoutHandler(h, d)</text>
    <text x="280" y="356" font-size="11" fill="#555555">limits the handler only: after d the client gets a 503 and the request context is cancelled</text>

    <!-- IdleTimeout -->
    <line x1="780" y1="396" x2="930" y2="396" stroke="#555555" stroke-width="4"/>
    <text x="780" y="416" font-weight="bold" fill="#555555">IdleTimeout</text>
    <text x="780" y="432" font-size="11" fill="#555555">keep-alive wait</text>
  </g>

  <!-- ResponseController note -->
  <g font-size="12" fill="#222222">
    <rect x="130" y="454" width="800" height="40" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="5,3"/>
    <text x="142" y="472" font-weight="bold">Per request:</text>
    <text x="222" y="472">http.NewResponseController(w).SetReadDeadline / SetWriteDeadline replace the server deadlines for this request only,</text>
    <text x="142" y="488">so a slow export can have minutes while the rest of the service keeps a short WriteTimeout.</text>
  </g>

  <!-- time axis -->
  <line x1="20" y1="508" x2="940" y2="508" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>
  <text x="940" y="502" font-size="11" fill="#555555" text-anchor="end">time</text>
</svg>
