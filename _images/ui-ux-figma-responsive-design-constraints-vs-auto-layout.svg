<svg viewBox="0 0 740 280" width="740" height="280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="280" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Constraints versus auto layout when a frame grows</text>
<text x="190" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Constraints (pinning)</text>
<text x="550" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Auto layout (flow)</text>
<rect x="40" y="70" width="110" height="130" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="50" y="80" width="90" height="40" rx="4" fill="#C7D2FE"/>
<rect x="50" y="165" width="90" height="26" rx="4" fill="#4F46E5"/>
<line x1="165" y1="135" x2="195" y2="135" stroke="#4B5563" stroke-width="2"/>
<polygon points="195,129 207,135 195,141" fill="#4B5563"/>
<rect x="215" y="70" width="170" height="190" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="225" y="80" width="150" height="40" rx="4" fill="#C7D2FE"/>
<rect x="225" y="225" width="150" height="26" rx="4" fill="#4F46E5"/>
<text x="190" y="272" text-anchor="middle" font-size="12" fill="#374151">Edges stay pinned to the frame</text>
<rect x="400" y="70" width="110" height="130" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="410" y="80" width="90" height="40" rx="4" fill="#FDE68A"/>
<rect x="410" y="128" width="90" height="26" rx="4" fill="#B45309"/>
<line x1="525" y1="135" x2="555" y2="135" stroke="#4B5563" stroke-width="2"/>
<polygon points="555,129 567,135 555,141" fill="#4B5563"/>
<rect x="575" y="70" width="140" height="190" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="585" y="80" width="120" height="40" rx="4" fill="#FDE68A"/>
<rect x="585" y="128" width="120" height="26" rx="4" fill="#B45309"/>
<text x="550" y="272" text-anchor="middle" font-size="12" fill="#374151">Children flow and fill the space</text>
<circle cx="40" cy="70" r="11" fill="#4F46E5"/><text x="40" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="400" cy="70" r="11" fill="#B45309"/><text x="400" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
</svg>
