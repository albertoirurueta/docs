<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three token types, three audiences</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">solid arrows: the correct destination of each token -- dashed red arrows: the two broken uses this page warns about</text>

  <!-- Authorization Server -->
  <rect x="290" y="66" width="180" height="76" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="92" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Authorization Server</text>
  <text x="380" y="108" font-size="10.5" fill="#333333" text-anchor="middle">(also the OpenID Provider)</text>
  <text x="380" y="122" font-size="10.5" fill="#333333" text-anchor="middle">issues all three token types</text>
  <text x="380" y="134" font-size="10.5" fill="#333333" text-anchor="middle">in a single token response</text>

  <!-- Client -->
  <rect x="40" y="230" width="180" height="80" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="130" y="256" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Client</text>
  <text x="130" y="272" font-size="10.5" fill="#333333" text-anchor="middle">consumes the ID token once;</text>
  <text x="130" y="286" font-size="10.5" fill="#333333" text-anchor="middle">holds the access + refresh</text>
  <text x="130" y="300" font-size="10.5" fill="#333333" text-anchor="middle">token, opaque to it either way</text>

  <!-- Resource Server -->
  <rect x="540" y="230" width="180" height="80" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="630" y="256" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Resource Server</text>
  <text x="630" y="272" font-size="10.5" fill="#333333" text-anchor="middle">accepts only the access</text>
  <text x="630" y="286" font-size="10.5" fill="#333333" text-anchor="middle">token; validates aud, scope,</text>
  <text x="630" y="300" font-size="10.5" fill="#333333" text-anchor="middle">exp before serving data</text>

  <!-- ID token: AS -> Client -->
  <line x1="330" y1="142" x2="175" y2="230" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="230" y="176" font-size="10" font-weight="bold" fill="#1c4b73" text-anchor="middle">ID token</text>
  <text x="230" y="190" font-size="9" fill="#333333" text-anchor="middle">aud = client_id</text>
  <text x="230" y="202" font-size="9" fill="#333333" text-anchor="middle">consumed once by the client</text>

  <!-- Refresh token: Client <-> AS -->
  <line x1="200" y1="222" x2="310" y2="150" stroke="#8a5a1c" stroke-width="1.6" marker-end="url(#arrowTan)" marker-start="url(#arrowTanStart)"/>
  <text x="215" y="140" font-size="10" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Refresh token</text>
  <text x="215" y="153" font-size="9" fill="#333333" text-anchor="middle">token endpoint only</text>
  <text x="215" y="165" font-size="9" fill="#333333" text-anchor="middle">never sent anywhere else</text>

  <!-- Access token: Client -> Resource Server -->
  <line x1="220" y1="270" x2="540" y2="270" stroke="#a33" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="380" y="255" font-size="10" font-weight="bold" fill="#a33" text-anchor="middle">Access token</text>
  <text x="380" y="288" font-size="9" fill="#333333" text-anchor="middle">aud = resource server(s); sent on every API call</text>

  <!-- Broken use 1: ID token sent to Resource Server -->
  <path d="M 130,310 C 130,400 400,420 540,290" fill="none" stroke="#a33" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowRedDash)"/>
  <text x="330" y="410" font-size="10" fill="#a33" text-anchor="middle">WRONG: ID token sent to an API as if it were a bearer token</text>
  <text x="330" y="424" font-size="9" fill="#666666" text-anchor="middle">no scope to check; aud never names this resource server</text>

  <!-- Broken use 2: Access token treated as proof of login -->
  <rect x="260" y="440" width="260" height="56" fill="none" stroke="#a33" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="390" y="460" font-size="10" fill="#a33" text-anchor="middle" font-weight="bold">WRONG: "I have an access token" read as</text>
  <text x="390" y="474" font-size="10" fill="#a33" text-anchor="middle" font-weight="bold">"the user is signed in"</text>
  <text x="390" y="488" font-size="9" fill="#666666" text-anchor="middle">no sub, no auth_time, no nonce to check against replay</text>
  <path d="M 220,300 C 220,420 260,460 260,468" fill="none" stroke="#a33" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowRedDash)"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowTan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a5a1c"/>
    </marker>
    <marker id="arrowTanStart" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#8a5a1c"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a33"/>
    </marker>
    <marker id="arrowRedDash" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a33"/>
    </marker>
  </defs>
</svg>
