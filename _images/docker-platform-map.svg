<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Docker platform map</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The Docker platform map</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">where each product sits between a developer laptop, CI, a registry and the runtime hosts</text>
  <rect x="20" y="60" width="230" height="300" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="135" y="80" font-size="12" fill="#1c4b73" text-anchor="middle" font-weight="bold">Developer laptop</text>
  <rect x="35" y="92" width="200" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="112.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Docker Desktop</text>
  <text x="135.0" y="128.2" font-size="9.5" fill="#333333" text-anchor="middle">Linux VM running Docker Engine</text>
  <rect x="35" y="150" width="95" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="82.5" y="168.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">CLI</text>
  <text x="82.5" y="184.2" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">docker</text>
  <rect x="140" y="150" width="95" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="187.5" y="168.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Compose</text>
  <text x="187.5" y="184.2" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">compose.yaml</text>
  <rect x="35" y="204" width="95" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="82.5" y="222.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Buildx</text>
  <text x="82.5" y="238.2" font-size="9.5" fill="#333333" text-anchor="middle">BuildKit</text>
  <rect x="140" y="204" width="95" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="187.5" y="222.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Scout</text>
  <text x="187.5" y="238.2" font-size="9.5" fill="#333333" text-anchor="middle">CVEs + SBOM</text>
  <rect x="35" y="258" width="200" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="276.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Testcontainers</text>
  <text x="135.0" y="292.2" font-size="9.5" fill="#333333" text-anchor="middle">containers from test code</text>
  <rect x="35" y="312" width="200" height="38" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="135.0" y="333.8" font-size="9.5" fill="#333333" text-anchor="middle">IDE-run app talks to local containers</text>
  <rect x="290" y="60" width="180" height="140" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="380" y="80" font-size="12" fill="#9a5a12" text-anchor="middle" font-weight="bold">CI (GitHub Actions)</text>
  <rect x="305" y="92" width="150" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="110.0" font-size="9.5" fill="#333333" text-anchor="middle">build + test with Buildx</text>
  <text x="380.0" y="123.5" font-size="9.5" fill="#333333" text-anchor="middle">and Testcontainers</text>
  <rect x="305" y="144" width="150" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="162.0" font-size="9.5" fill="#333333" text-anchor="middle">docker/* actions push</text>
  <text x="380.0" y="175.5" font-size="9.5" fill="#333333" text-anchor="middle">image + attestations</text>
  <rect x="290" y="230" width="180" height="130" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="380" y="250" font-size="12" fill="#2d6a34" text-anchor="middle" font-weight="bold">Registries</text>
  <rect x="305" y="262" width="150" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="278.0" font-size="9.5" fill="#333333" text-anchor="middle">Docker Hub</text>
  <text x="380.0" y="291.5" font-size="9.5" fill="#333333" text-anchor="middle">Official Images + DHI</text>
  <rect x="305" y="310" width="150" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="326.0" font-size="9.5" fill="#333333" text-anchor="middle">GHCR / ECR / ACR /</text>
  <text x="380.0" y="339.5" font-size="9.5" fill="#333333" text-anchor="middle">Artifact Registry</text>
  <rect x="510" y="60" width="230" height="300" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="625" y="80" font-size="12" fill="#5b3a8c" text-anchor="middle" font-weight="bold">Runtime hosts</text>
  <rect x="525" y="92" width="200" height="80" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="625.0" y="121.0" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Docker Engine</text>
  <text x="625.0" y="136.5" font-size="9.5" fill="#333333" text-anchor="middle">dockerd + containerd + runc</text>
  <text x="625.0" y="150.0" font-size="9.5" fill="#333333" text-anchor="middle">one Linux host</text>
  <rect x="525" y="182" width="200" height="70" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="625.0" y="212.8" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Swarm mode</text>
  <text x="625.0" y="228.2" font-size="9.5" fill="#333333" text-anchor="middle">several Engines as one cluster</text>
  <rect x="525" y="262" width="200" height="86" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="625.0" y="294.0" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Kubernetes</text>
  <text x="625.0" y="309.5" font-size="9.5" fill="#333333" text-anchor="middle">any OCI runtime</text>
  <text x="625.0" y="323.0" font-size="9.5" fill="#333333" text-anchor="middle">runs the same image</text>
  <line x1="250" y1="120" x2="290" y2="120" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="270.0" y="115.0" font-size="9.5" fill="#555555" text-anchor="middle">git push</text>
  <line x1="380" y1="200" x2="380" y2="230" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="210.0" font-size="9.5" fill="#555555" text-anchor="middle">push</text>
  <line x1="250" y1="280" x2="305" y2="280" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="277.5" y="275.0" font-size="9.5" fill="#555555" text-anchor="middle">pull</text>
  <line x1="455" y1="282" x2="525" y2="140" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="490.0" y="206.0" font-size="9.5" fill="#555555" text-anchor="middle">pull</text>
  <line x1="455" y1="330" x2="525" y2="300" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="490.0" y="310.0" font-size="9.5" fill="#555555" text-anchor="middle">pull</text>
  <text x="380" y="395" font-size="10" fill="#555555" text-anchor="middle">The same OCI image moves unchanged from build to run: build once -- ship -- run anywhere with a container engine</text>
</svg>
