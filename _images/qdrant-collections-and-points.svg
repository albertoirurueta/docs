<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A collection holds points; each point is id + vector + payload</text>
  <text x="360" y="46" font-size="11.5" fill="#666666" text-anchor="middle">Vector size and distance metric are configured once, on the collection -- not on each point</text>

  <!-- Outer collection container -->
  <rect x="20" y="66" width="680" height="360" rx="10" fill="#dce8f5" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="40" y="90" font-size="14" font-weight="bold" fill="#1c4b73">Collection: products</text>
  <text x="40" y="106" font-size="10.5" fill="#1c4b73" font-family="'Courier New', monospace">vectors.size: 4    vectors.distance: Cosine</text>

  <!-- Point 1 -->
  <rect x="42" y="126" width="150" height="150" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="117" y="146" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Point</text>
  <text x="52" y="166" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">id: 1</text>
  <text x="52" y="184" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">vector:</text>
  <text x="52" y="198" font-size="9" fill="#333333" font-family="'Courier New', monospace">[0.12, -0.98,</text>
  <text x="52" y="210" font-size="9" fill="#333333" font-family="'Courier New', monospace"> 0.33, 0.47]</text>
  <rect x="50" y="220" width="134" height="46" fill="#e0f0d8" stroke="#2f5424" stroke-width="1"/>
  <text x="56" y="233" font-size="9" fill="#2f5424" font-family="'Courier New', monospace">payload:</text>
  <text x="56" y="246" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">category: "audio"</text>
  <text x="56" y="258" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">in_stock: true</text>

  <!-- Point 2 -->
  <rect x="212" y="126" width="150" height="150" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="287" y="146" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Point</text>
  <text x="222" y="166" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">id: 2</text>
  <text x="222" y="184" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">vector:</text>
  <text x="222" y="198" font-size="9" fill="#333333" font-family="'Courier New', monospace">[0.55, 0.04,</text>
  <text x="222" y="210" font-size="9" fill="#333333" font-family="'Courier New', monospace"> -0.21, 0.88]</text>
  <rect x="220" y="220" width="134" height="46" fill="#e0f0d8" stroke="#2f5424" stroke-width="1"/>
  <text x="226" y="233" font-size="9" fill="#2f5424" font-family="'Courier New', monospace">payload:</text>
  <text x="226" y="246" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">category: "kitchen"</text>
  <text x="226" y="258" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">in_stock: false</text>

  <!-- Point 3 -->
  <rect x="382" y="126" width="150" height="150" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="457" y="146" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Point</text>
  <text x="392" y="166" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">id: 3</text>
  <text x="392" y="184" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">vector:</text>
  <text x="392" y="198" font-size="9" fill="#333333" font-family="'Courier New', monospace">[-0.07, 0.61,</text>
  <text x="392" y="210" font-size="9" fill="#333333" font-family="'Courier New', monospace"> 0.19, -0.44]</text>
  <rect x="390" y="220" width="134" height="46" fill="#e0f0d8" stroke="#2f5424" stroke-width="1"/>
  <text x="396" y="233" font-size="9" fill="#2f5424" font-family="'Courier New', monospace">payload:</text>
  <text x="396" y="246" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">category: "audio"</text>
  <text x="396" y="258" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">in_stock: true</text>

  <!-- Point 4 (UUID id, different payload) -->
  <rect x="552" y="126" width="150" height="150" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="627" y="146" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Point</text>
  <text x="562" y="163" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">id: 7b6e...c1a4</text>
  <text x="562" y="181" font-size="9.5" fill="#333333" font-family="'Courier New', monospace">vector:</text>
  <text x="562" y="195" font-size="9" fill="#333333" font-family="'Courier New', monospace">[0.30, -0.12,</text>
  <text x="562" y="207" font-size="9" fill="#333333" font-family="'Courier New', monospace"> 0.77, 0.05]</text>
  <rect x="560" y="220" width="134" height="46" fill="#e0f0d8" stroke="#2f5424" stroke-width="1"/>
  <text x="566" y="233" font-size="9" fill="#2f5424" font-family="'Courier New', monospace">payload:</text>
  <text x="566" y="246" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">category: "toys"</text>
  <text x="566" y="258" font-size="8.5" fill="#2f5424" font-family="'Courier New', monospace">in_stock: true</text>

  <text x="360" y="298" font-size="10" fill="#666666" text-anchor="middle">id may be an unsigned integer or a UUID -- vector length always matches the collection's configured size</text>

  <!-- Note box about per-collection config -->
  <rect x="42" y="318" width="660" height="90" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="54" y="338" font-size="11.5" font-weight="bold" fill="#222222">Configured once, on the collection -- not per point</text>
  <text x="54" y="356" font-size="10.5" fill="#333333">- Vector size (dimensionality): every point's vector must match it.</text>
  <text x="54" y="372" font-size="10.5" fill="#333333">- Distance metric: Cosine, Dot product, or Euclidean -- fixed for all points (or per named vector).</text>
  <text x="54" y="388" font-size="10.5" fill="#333333">- A point may instead carry several named vectors, or a multivector (many vectors under one name).</text>
</svg>
