<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">When the logic runs: behavior tree versus StateTree</text>
<rect x="20" y="50" width="355" height="400" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<rect x="385" y="50" width="355" height="400" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Behavior tree</text>
<text x="562" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">StateTree</text>
<rect x="115" y="90" width="165" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197.5" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3">Selector (root)</text>
<rect x="45" y="150" width="140" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="166.8" text-anchor="middle" font-size="11" fill="#3730A3">Sequence Investigate</text>
<text x="115.0" y="180.8" text-anchor="middle" font-size="11" fill="#3730A3">decorator: HasNoise</text>
<rect x="210" y="150" width="140" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="280.0" y="166.8" text-anchor="middle" font-size="11" fill="#92400E">Sequence Patrol</text>
<text x="280.0" y="180.8" text-anchor="middle" font-size="11" fill="#92400E">no decorator</text>
<rect x="35" y="225" width="70" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="70.0" y="244.2" text-anchor="middle" font-size="12" fill="#1F2937">Move To</text>
<rect x="120" y="225" width="70" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="155.0" y="244.2" text-anchor="middle" font-size="12" fill="#1F2937">Wait</text>
<rect x="210" y="225" width="70" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="245.0" y="244.2" text-anchor="middle" font-size="12" fill="#92400E">Wander</text>
<rect x="290" y="225" width="60" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="320.0" y="244.2" text-anchor="middle" font-size="12" fill="#1F2937">Wait</text>
<line x1="197" y1="120" x2="115" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="197" y1="120" x2="280" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="115" y1="190" x2="70" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="115" y1="190" x2="155" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="280" y1="190" x2="245" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="280" y1="190" x2="320" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<text x="197" y="290" text-anchor="middle" font-size="12" fill="#374151">Running branch is highlighted.</text>
<text x="197" y="306" text-anchor="middle" font-size="12" fill="#374151">A Blackboard decorator with Observer Aborts</text>
<text x="197" y="322" text-anchor="middle" font-size="12" fill="#374151">watches its key; when the key changes the</text>
<text x="197" y="338" text-anchor="middle" font-size="12" fill="#374151">running lower-priority branch is aborted</text>
<text x="197" y="354" text-anchor="middle" font-size="12" fill="#374151">and the tree searches again from there.</text>
<rect x="40" y="385" width="315" height="48" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197.5" y="405.4" text-anchor="middle" font-size="11" fill="#1F2937">Logic: node results flow up, decorators</text>
<text x="197.5" y="420.4" text-anchor="middle" font-size="11" fill="#1F2937">observe data, services tick on an interval</text>
<rect x="480" y="90" width="165" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="562.5" y="109.2" text-anchor="middle" font-size="12" fill="#3730A3">Root (selector state)</text>
<rect x="410" y="150" width="140" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="480.0" y="166.8" text-anchor="middle" font-size="11" fill="#1F2937">Investigate</text>
<text x="480.0" y="180.8" text-anchor="middle" font-size="11" fill="#1F2937">task: Investigate Noise</text>
<rect x="575" y="150" width="140" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="645.0" y="166.8" text-anchor="middle" font-size="11" fill="#92400E">Patrol (active)</text>
<text x="645.0" y="180.8" text-anchor="middle" font-size="11" fill="#92400E">task: Wander</text>
<line x1="562" y1="120" x2="480" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="562" y1="120" x2="645" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<path d="M600,190 C600,225 500,225 480,194" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#c1)"/>
<text x="560" y="236" text-anchor="middle" font-size="11" fill="#92400E">transition: On Event BookDropped</text>
<text x="562" y="290" text-anchor="middle" font-size="12" fill="#374151">Only the active states run their tasks.</text>
<text x="562" y="306" text-anchor="middle" font-size="12" fill="#374151">Selection re-runs when a transition fires:</text>
<text x="562" y="322" text-anchor="middle" font-size="12" fill="#374151">conditions are tested from the leaf up,</text>
<text x="562" y="338" text-anchor="middle" font-size="12" fill="#374151">the first that succeeds picks the next state.</text>
<text x="562" y="354" text-anchor="middle" font-size="12" fill="#374151">Global tasks and evaluators run for the whole tree.</text>
<rect x="405" y="385" width="315" height="48" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="562.5" y="405.4" text-anchor="middle" font-size="11" fill="#1F2937">Logic: states hold tasks and transitions,</text>
<text x="562.5" y="420.4" text-anchor="middle" font-size="11" fill="#1F2937">completion or events trigger selection</text>
</svg>
