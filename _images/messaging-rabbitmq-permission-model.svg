<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>
  <text x="350" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">RabbitMQ permission model</text>
  <text x="350" y="42" font-size="10.5" fill="#666666" text-anchor="middle">A user's regex-scoped permissions are always evaluated within one virtual host</text>

  <!-- Virtual host boundary -->
  <rect x="30" y="66" width="640" height="336" rx="8" fill="#f7f7f7" stroke="#888888" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="50" y="90" font-size="12.5" font-weight="bold" fill="#444444">Virtual host: "payments" (tenant boundary)</text>
  <text x="50" y="104" font-size="9.5" fill="#777777">Exchanges, queues and bindings are namespaced per vhost -- a user has no visibility outside it</text>

  <!-- User box -->
  <rect x="60" y="122" width="200" height="64" rx="4" fill="#eef2fb" stroke="#3a5fa8" stroke-width="1.6"/>
  <text x="160" y="148" font-size="12.5" font-weight="bold" fill="#22326a" text-anchor="middle">User: order-service</text>
  <text x="160" y="166" font-size="9.5" fill="#3a5fa8" text-anchor="middle">granted access to this vhost</text>

  <!-- arrow user -> permissions -->
  <line x1="260" y1="154" x2="300" y2="154" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Three permission regex boxes -->
  <rect x="305" y="122" width="115" height="64" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="362" y="144" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">configure</text>
  <text x="362" y="160" font-size="9" fill="#3a7d40" text-anchor="middle">^orders\.</text>
  <text x="362" y="174" font-size="8.5" fill="#3a7d40" text-anchor="middle">declare / delete</text>

  <rect x="432" y="122" width="115" height="64" rx="4" fill="#fff4e5" stroke="#b8730f" stroke-width="1.6"/>
  <text x="489" y="144" font-size="11.5" font-weight="bold" fill="#8a5a0d" text-anchor="middle">write</text>
  <text x="489" y="160" font-size="9" fill="#8a5a0d" text-anchor="middle">^orders\.</text>
  <text x="489" y="174" font-size="8.5" fill="#8a5a0d" text-anchor="middle">publish</text>

  <rect x="559" y="122" width="95" height="64" rx="4" fill="#f3eefb" stroke="#7a4fa8" stroke-width="1.6"/>
  <text x="606" y="144" font-size="11.5" font-weight="bold" fill="#4a2f6a" text-anchor="middle">read</text>
  <text x="606" y="160" font-size="9" fill="#4a2f6a" text-anchor="middle">^orders\.</text>
  <text x="606" y="174" font-size="8.5" fill="#4a2f6a" text-anchor="middle">consume</text>

  <!-- separator -->
  <line x1="50" y1="204" x2="650" y2="204" stroke="#cccccc" stroke-width="1"/>

  <!-- Topic authorisation section -->
  <text x="50" y="226" font-size="12.5" font-weight="bold" fill="#444444">Topic authorisation (topic exchanges only)</text>
  <text x="50" y="242" font-size="9.5" fill="#777777">An additional, per-binding-key regex layered on top of write/read -- checked against the</text>
  <text x="50" y="256" font-size="9.5" fill="#777777">routing key itself, not just the exchange name -- so publishing/consuming can be scoped by topic</text>

  <rect x="60" y="270" width="270" height="52" rx="4" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="195" y="292" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">write_topic_permission</text>
  <text x="195" y="308" font-size="9" fill="#a33333" text-anchor="middle">e.g. ^orders\.eu\..*</text>

  <rect x="345" y="270" width="270" height="52" rx="4" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="480" y="292" font-size="11" font-weight="bold" fill="#a33333" text-anchor="middle">read_topic_permission</text>
  <text x="480" y="308" font-size="9" fill="#a33333" text-anchor="middle">e.g. ^orders\.eu\..*</text>

  <!-- separator -->
  <line x1="50" y1="340" x2="650" y2="340" stroke="#cccccc" stroke-width="1"/>

  <text x="50" y="362" font-size="9.5" fill="#777777">Every regex is matched against the resource (or routing key) name in full -- an empty pattern grants</text>
  <text x="50" y="376" font-size="9.5" fill="#777777">no access at all, and a user with no permission entry for a vhost cannot see it or act within it -- the</text>
  <text x="50" y="390" font-size="9.5" fill="#777777">same three-way split (configure/write/read) is set with rabbitmqctl set_permissions or rabbitmqadmin</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
