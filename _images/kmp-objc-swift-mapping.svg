<svg viewBox="0 0 760 540" width="760" height="540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How Kotlin constructs map to the Objective-C header and to Swift</title>
  <desc>A table-like figure with four columns: Kotlin source, the default Objective-C header, Swift as seen by default, and Swift as seen with SKIE or Swift export. Six rows cover top-level functions, enums, sealed types, suspend functions, Flow and default arguments.</desc>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Kotlin to Objective-C header to Swift</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">default export on the left; SKIE and Swift export (Alpha) improve the right-hand column</text>
  <rect x="10" y="54" width="170" height="26" rx="5" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="95.0" y="71" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Kotlin source</text>
  <rect x="190" y="54" width="170" height="26" rx="5" fill="#fdf3e6" stroke="#8a5a14" stroke-width="1.3"/>
  <text x="275.0" y="71" font-size="11.5" font-weight="bold" fill="#8a5a14" text-anchor="middle">Obj-C header (default)</text>
  <rect x="370" y="54" width="150" height="26" rx="5" fill="#f4f4f4" stroke="#333333" stroke-width="1.3"/>
  <text x="445.0" y="71" font-size="11.5" font-weight="bold" fill="#333333" text-anchor="middle">Swift, default</text>
  <rect x="530" y="54" width="210" height="26" rx="5" fill="#eef7ee" stroke="#1f6b2e" stroke-width="1.3"/>
  <text x="635.0" y="71" font-size="11.5" font-weight="bold" fill="#1f6b2e" text-anchor="middle">Swift, SKIE / Swift export</text>
  <text x="10" y="100" font-size="9.5" font-weight="bold" fill="#777777">TOP-LEVEL FUNCTION</text>
  <rect x="10" y="106" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="106" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="106" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="106" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="118" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">fun formatKm(m: Double)</text>
  <text x="17" y="132" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">in TrailFormatting.kt, package</text>
  <text x="17" y="146" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">com.example.trailmate.domain</text>
  <text x="197" y="118" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">SharedTrailFormattingKt</text>
  <text x="197" y="132" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">+ formatKmM:(double)</text>
  <text x="377" y="118" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">TrailFormattingKt.formatKm(m:)</text>
  <text x="377" y="132" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">(package flattened,</text>
  <text x="377" y="146" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">file name + Kt)</text>
  <text x="537" y="118" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: unchanged</text>
  <text x="537" y="132" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: global func</text>
  <text x="10" y="169" font-size="9.5" font-weight="bold" fill="#777777">ENUM</text>
  <rect x="10" y="175" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="175" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="175" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="175" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="187" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">enum class Difficulty</text>
  <text x="17" y="201" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">{ EASY, MODERATE, HARD }</text>
  <text x="197" y="187" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">SharedDifficulty : KotlinEnum</text>
  <text x="197" y="201" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">(entries as class properties)</text>
  <text x="377" y="187" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">Difficulty.easy</text>
  <text x="377" y="201" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">switch needs a default:</text>
  <text x="377" y="215" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">(not exhaustive)</text>
  <text x="537" y="187" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: exhaustive switch</text>
  <text x="537" y="201" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: Swift enum</text>
  <text x="10" y="238" font-size="9.5" font-weight="bold" fill="#777777">SEALED TYPE</text>
  <rect x="10" y="244" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="244" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="244" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="244" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="256" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">sealed interface UiState</text>
  <text x="17" y="270" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">Loading, Success, Failed</text>
  <text x="197" y="256" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">protocol + one class per</text>
  <text x="197" y="270" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">subclass, e.g. UiStateLoading</text>
  <text x="377" y="256" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">state as? UiStateSuccess</text>
  <text x="377" y="270" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">if-let chain, no</text>
  <text x="377" y="284" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">exhaustiveness check</text>
  <text x="537" y="256" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: onEnum(of:) switch</text>
  <text x="537" y="270" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: Swift enum (2.4.20)</text>
  <text x="10" y="307" font-size="9.5" font-weight="bold" fill="#777777">SUSPEND FUNCTION</text>
  <rect x="10" y="313" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="313" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="313" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="313" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="325" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">suspend fun refresh()</text>
  <text x="197" y="325" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">refreshWithCompletionHandler:</text>
  <text x="197" y="339" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">(NSError for @Throws only)</text>
  <text x="377" y="325" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">try await vm.refresh()</text>
  <text x="377" y="339" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">works, but cancelling the</text>
  <text x="377" y="353" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">Swift Task is not mapped</text>
  <text x="537" y="325" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: async + cancellation</text>
  <text x="537" y="339" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: async</text>
  <text x="10" y="376" font-size="9.5" font-weight="bold" fill="#777777">FLOW</text>
  <rect x="10" y="382" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="382" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="382" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="382" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="394" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">val trails: Flow&lt;List&lt;Trail&gt;&gt;</text>
  <text x="197" y="394" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">Kotlinx_coroutines_coreFlow</text>
  <text x="197" y="408" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">collectWithCollector:...</text>
  <text x="377" y="394" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">implement FlowCollector</text>
  <text x="377" y="408" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">by hand, or use</text>
  <text x="377" y="422" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">KMP-NativeCoroutines</text>
  <text x="537" y="394" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: for await in ...</text>
  <text x="537" y="408" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: AsyncSequence</text>
  <text x="10" y="445" font-size="9.5" font-weight="bold" fill="#777777">DEFAULT ARGUMENT</text>
  <rect x="10" y="451" width="170" height="58" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.1"/>
  <rect x="190" y="451" width="170" height="58" rx="5" fill="#ffffff" stroke="#8a5a14" stroke-width="1.1"/>
  <rect x="370" y="451" width="150" height="58" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <rect x="530" y="451" width="210" height="58" rx="5" fill="#ffffff" stroke="#1f6b2e" stroke-width="1.1"/>
  <text x="17" y="463" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1c4b73">fun load(page: Int = 0)</text>
  <text x="197" y="463" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">load(page:) only, no default</text>
  <text x="197" y="477" font-size="8" font-family="Menlo, Consolas, monospace" fill="#8a5a14">(no overload generated)</text>
  <text x="377" y="463" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">load(page: 0)</text>
  <text x="377" y="477" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">every argument must</text>
  <text x="377" y="491" font-size="8" font-family="Menlo, Consolas, monospace" fill="#333333">be passed explicitly</text>
  <text x="537" y="463" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">SKIE: default args (opt-in)</text>
  <text x="537" y="477" font-size="8" font-family="Menlo, Consolas, monospace" fill="#1f6b2e">Swift export: check limits</text>
  <text x="380" y="528" font-size="10" fill="#666666" text-anchor="middle">Obj-C names carry the framework prefix (here Shared); Swift hides it behind the module name.</text>
</svg>
