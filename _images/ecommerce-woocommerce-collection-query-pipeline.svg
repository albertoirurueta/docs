<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a Product Collection query is built on the front end and in the editor</title>
  <desc id="d">Two lanes. The front-end lane starts with the block attributes and the collection name, goes through the query_loop_block_query_vars filter where the WooCommerce query builder runs first (priority 10) and a custom callback second (priority 20), and ends in a WP_Query whose products are rendered by the product template. The editor lane starts with a REST request to wp/v2/product that carries isProductCollectionBlock and productCollectionQueryContext, goes through the rest_product_query filter with the same two-step order, and ends as JSON for the editor preview. A note says the collection handler registry is internal in 11.2.1.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Two paths to the same products</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">The same collection name selects the rules on the page and in the editor preview</text>
  <text x="40" y="90" font-size="13" font-weight="bold" fill="#f4b860">Front end (page render)</text>
  <rect x="40" y="104" width="190" height="96" rx="6" fill="#3d5266"/>
  <text x="135.0" y="139.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Block attributes</text>
  <text x="135.0" y="156.5" font-size="12" fill="#f2f5f8" text-anchor="middle">query, collection,</text>
  <text x="135.0" y="173.5" font-size="12" fill="#f2f5f8" text-anchor="middle">displayLayout, hideControls</text>
  <rect x="40" y="214" width="190" height="56" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135.0" y="238.0" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">URL filter parameters</text>
  <text x="135.0" y="255.0" font-size="12" fill="#f2f5f8" text-anchor="middle">only if inherit or filterable</text>
  <path d="M230 152 L268 152" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M230 242 L250 242" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M250 242 L250 170 L268 170" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="270" y="104" width="290" height="168" rx="6" fill="#3d5266"/>
  <text x="415.0" y="147.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">query_loop_block_query_vars</text>
  <text x="415.0" y="165.5" font-size="12" fill="#f2f5f8" text-anchor="middle">priority 10: WooCommerce</text>
  <text x="415.0" y="183.5" font-size="12" fill="#f2f5f8" text-anchor="middle">per page, order, offset, on sale,</text>
  <text x="415.0" y="201.5" font-size="12" fill="#f2f5f8" text-anchor="middle">stock status, attributes, price range,</text>
  <text x="415.0" y="219.5" font-size="12" fill="#f2f5f8" text-anchor="middle">featured, time frame, hand-picked,</text>
  <text x="415.0" y="237.5" font-size="12" fill="#f2f5f8" text-anchor="middle">collection handler, filter clauses</text>
  <path d="M560 152 L598 152" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="600" y="104" width="170" height="168" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="685.0" y="147.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Your callback</text>
  <text x="685.0" y="165.5" font-size="12" fill="#f2f5f8" text-anchor="middle">priority 20 or later</text>
  <text x="685.0" y="183.5" font-size="12" fill="#f2f5f8" text-anchor="middle">reads</text>
  <text x="685.0" y="201.5" font-size="12" fill="#f2f5f8" text-anchor="middle">$block-&gt;context</text>
  <text x="685.0" y="219.5" font-size="12" fill="#f2f5f8" text-anchor="middle">['collection']</text>
  <text x="685.0" y="237.5" font-size="12" fill="#f2f5f8" text-anchor="middle">and edits $query</text>
  <path d="M770 152 L808 152" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="810" y="104" width="110" height="168" rx="6" fill="#3d5266"/>
  <text x="865.0" y="156.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">WP_Query</text>
  <text x="865.0" y="174.5" font-size="12" fill="#f2f5f8" text-anchor="middle">then</text>
  <text x="865.0" y="192.5" font-size="12" fill="#f2f5f8" text-anchor="middle">product-template</text>
  <text x="865.0" y="210.5" font-size="12" fill="#f2f5f8" text-anchor="middle">renders each</text>
  <text x="865.0" y="228.5" font-size="12" fill="#f2f5f8" text-anchor="middle">product</text>
  <text x="40" y="318" font-size="13" font-weight="bold" fill="#9fd3c7">Block editor (preview)</text>
  <rect x="40" y="332" width="190" height="96" rx="6" fill="#3d5266"/>
  <text x="135.0" y="367.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">REST request</text>
  <text x="135.0" y="384.5" font-size="12" fill="#f2f5f8" text-anchor="middle">GET /wp/v2/product</text>
  <text x="135.0" y="401.5" font-size="12" fill="#f2f5f8" text-anchor="middle">isProductCollectionBlock=true</text>
  <path d="M230 380 L268 380" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="270" y="332" width="290" height="96" rx="6" fill="#3d5266"/>
  <text x="415.0" y="357.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">rest_product_query</text>
  <text x="415.0" y="375.5" font-size="12" fill="#f2f5f8" text-anchor="middle">priority 10: WooCommerce applies</text>
  <text x="415.0" y="393.5" font-size="12" fill="#f2f5f8" text-anchor="middle">the same rules; the request carries</text>
  <text x="415.0" y="411.5" font-size="12" fill="#f2f5f8" text-anchor="middle">productCollectionQueryContext[collection]</text>
  <path d="M560 380 L598 380" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="600" y="332" width="170" height="96" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="685.0" y="357.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Your callback</text>
  <text x="685.0" y="375.5" font-size="12" fill="#f2f5f8" text-anchor="middle">priority 20 or later</text>
  <text x="685.0" y="393.5" font-size="12" fill="#f2f5f8" text-anchor="middle">reads the request</text>
  <text x="685.0" y="411.5" font-size="12" fill="#f2f5f8" text-anchor="middle">parameter</text>
  <path d="M770 380 L808 380" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="810" y="332" width="110" height="96" rx="6" fill="#3d5266"/>
  <text x="865.0" y="366.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">JSON for</text>
  <text x="865.0" y="384.5" font-size="12" fill="#f2f5f8" text-anchor="middle">the editor</text>
  <text x="865.0" y="402.5" font-size="12" fill="#f2f5f8" text-anchor="middle">preview</text>
  <rect x="40" y="452" width="880" height="84" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="476" font-size="12.5" fill="#f2f5f8">Collections registered from JavaScript only describe attributes (query, layout, inner blocks).</text>
  <text x="56" y="496" font-size="12.5" fill="#f2f5f8">The server-side collection handlers (HandlerRegistry) are internal in 11.2.1: the core collections use them, third parties do not.</text>
  <text x="56" y="516" font-size="12.5" fill="#f2f5f8">A third-party collection that needs a rule WordPress queries cannot express adds both filters above and checks the collection name.</text>
</svg>
