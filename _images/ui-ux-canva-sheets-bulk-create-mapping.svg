<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Bulk Create: sheet columns mapped to template fields</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Bulk Create: sheet columns mapped to template fields</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic spreadsheet editor, not a screenshot of any product.</text>
  <text x="150" y="62" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Sheet range A2:D21</text>
  <text x="580" y="62" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Connected design</text>
  <rect x="40" y="76" width="220" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="150" y="96" font-size="12" fill="#1F2937" text-anchor="middle">A  Title</text>
  <rect x="470" y="76" width="220" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="96" font-size="12" fill="#374151" text-anchor="middle">Headline</text>
  <path d="M262,91 L466,91" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="116" width="220" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="150" y="136" font-size="12" fill="#1F2937" text-anchor="middle">B  Author</text>
  <rect x="470" y="116" width="220" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="136" font-size="12" fill="#374151" text-anchor="middle">Subtitle</text>
  <path d="M262,131 L466,131" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="156" width="220" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="150" y="176" font-size="12" fill="#1F2937" text-anchor="middle">C  Cover (image)</text>
  <rect x="470" y="156" width="220" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="176" font-size="12" fill="#374151" text-anchor="middle">Photo frame</text>
  <path d="M262,171 L466,171" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="196" width="220" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="150" y="216" font-size="12" fill="#1F2937" text-anchor="middle">D  Quote</text>
  <rect x="470" y="196" width="220" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="216" font-size="12" fill="#374151" text-anchor="middle">Quote text</text>
  <path d="M262,211 L466,211" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="364" y="70" font-size="11" fill="#6B7280" text-anchor="middle">Match data</text>
  <text x="380" y="246" font-size="11" fill="#6B7280" text-anchor="middle">Each column holds one type of content; images come from uploads or the library, not URLs.</text>
  <circle cx="60" cy="270" r="11" fill="#4F46E5"/>
  <text x="60" y="274" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="78" y="274" font-size="12" fill="#374151" text-anchor="start">Match and fill fields</text>
  <circle cx="290" cy="270" r="11" fill="#4F46E5"/>
  <text x="290" y="274" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="308" y="274" font-size="12" fill="#374151" text-anchor="start">Preview</text>
  <circle cx="520" cy="270" r="11" fill="#B45309"/>
  <text x="520" y="274" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="538" y="274" font-size="12" fill="#92400E" text-anchor="start" font-weight="bold">Create designs</text>
  <rect x="30" y="298" width="330" height="66" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="195" y="320" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">1 design with multiple pages</text>
  <text x="195" y="340" font-size="11" fill="#374151" text-anchor="middle">One page for every row of data</text>
  <text x="195" y="356" font-size="10" fill="#6B7280" text-anchor="middle">Name pages from a field; pick the Save in folder</text>
  <rect x="400" y="298" width="330" height="66" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="565" y="320" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Individual designs</text>
  <text x="565" y="340" font-size="11" fill="#374151" text-anchor="middle">One design for every row; links appear beside the data</text>
  <text x="565" y="356" font-size="10" fill="#6B7280" text-anchor="middle">Set under More options, then Advanced options</text>
</svg>
