<svg viewBox="0 0 720 440" width="720" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="440" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Bookshelf persona board: Lena, book-club organiser</text>
<rect x="20" y="48" width="300" height="372" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="36" y="72" font-size="14" font-weight="bold" fill="#3730A3">Persona card</text>
<circle cx="70" cy="116" r="28" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="121" font-size="12" fill="#374151" text-anchor="middle">photo</text>
<text x="112" y="108" font-size="14" font-weight="bold" fill="#1F2937">Lena, 34</text>
<text x="112" y="126" font-size="12" fill="#374151">Runs a monthly book club</text>
<rect x="36" y="156" width="268" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="46" y="174" font-size="12" font-weight="bold" fill="#3730A3">Goals</text>
<text x="46" y="192" font-size="12" fill="#374151">Pick a book the whole club can finish</text>
<text x="46" y="208" font-size="12" fill="#374151">Share reviews before each meeting</text>
<rect x="36" y="228" width="268" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="46" y="246" font-size="12" font-weight="bold" fill="#3730A3">Frustrations</text>
<text x="46" y="264" font-size="12" fill="#374151">Opinions scattered across chat threads</text>
<text x="46" y="280" font-size="12" fill="#374151">Hard to see what others already read</text>
<rect x="36" y="300" width="268" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="46" y="318" font-size="12" font-weight="bold" fill="#3730A3">Behaviours</text>
<text x="46" y="336" font-size="12" fill="#374151">Phone on the commute, laptop at home</text>
<rect x="36" y="362" width="268" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="46" y="380" font-size="12" font-weight="bold" fill="#92400E">Quote (from research)</text>
<text x="46" y="396" font-size="12" fill="#92400E">"I just want one place for our shelf."</text>
<path d="M322,234 L372,234" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="372" y="62" font-size="14" font-weight="bold" fill="#3730A3">Empathy map</text>
<rect x="372" y="72" width="328" height="348" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<line x1="536" y1="72" x2="536" y2="420" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="372" y1="246" x2="700" y2="246" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="388" y="96" font-size="13" font-weight="bold" fill="#3730A3">Says</text>
<text x="388" y="118" font-size="12" fill="#374151">"What did we read last?"</text>
<text x="388" y="136" font-size="12" fill="#374151">"Send me the link."</text>
<text x="552" y="96" font-size="13" font-weight="bold" fill="#3730A3">Thinks</text>
<text x="552" y="118" font-size="12" fill="#374151">Will anyone finish it?</text>
<text x="552" y="136" font-size="12" fill="#374151">I should keep notes.</text>
<text x="388" y="270" font-size="13" font-weight="bold" fill="#3730A3">Does</text>
<text x="388" y="292" font-size="12" fill="#374151">Browses covers, asks friends,</text>
<text x="388" y="310" font-size="12" fill="#374151">keeps a spreadsheet</text>
<text x="552" y="270" font-size="13" font-weight="bold" fill="#3730A3">Feels</text>
<text x="552" y="292" font-size="12" fill="#374151">Overloaded by choices,</text>
<text x="552" y="310" font-size="12" fill="#374151">happy when members reply</text>
<rect x="404" y="164" width="100" height="60" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="454" y="198" font-size="12" fill="#92400E" text-anchor="middle">sticky: quote</text>
<circle cx="34" cy="48" r="11" fill="#4F46E5"/><text x="34" y="52" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="384" cy="72" r="11" fill="#4F46E5"/><text x="384" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="536" cy="246" r="11" fill="#B45309"/><text x="536" y="250" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="404" cy="164" r="11" fill="#4F46E5"/><text x="404" y="168" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
