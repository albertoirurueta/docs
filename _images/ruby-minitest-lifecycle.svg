<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Life of one Minitest test</title>
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Life of a Minitest run (Minitest 6)</text>
  <text x="500" y="47" font-size="12" fill="#666666" text-anchor="middle">a fresh instance of the test class is created for every test method; the order of tests is shuffled by the seed</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
  <rect x="30" y="70" width="170" height="52" rx="6" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="115.0" y="97.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">--seed N</text>
  <text x="115.0" y="113.0" font-size="11" fill="#666666" text-anchor="middle">srand(N) for the whole run</text>
  <rect x="250" y="70" width="200" height="52" rx="6" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="350.0" y="97.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">shuffle</text>
  <text x="350.0" y="113.0" font-size="11" fill="#666666" text-anchor="middle">suites and tests (run_order)</text>
  <rect x="500" y="70" width="210" height="52" rx="6" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="605.0" y="97.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">parallelize_me!?</text>
  <text x="605.0" y="113.0" font-size="11" fill="#666666" text-anchor="middle">marked classes run on MT_CPU threads</text>
  <rect x="760" y="70" width="210" height="52" rx="6" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="865.0" y="97.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">each test method</text>
  <text x="865.0" y="113.0" font-size="11" fill="#666666" text-anchor="middle">new instance, steps below</text>
  <path d="M200,96 L250,96" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M450,96 L500,96" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M710,96 L760,96" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="20" y="180" width="120" height="60" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.4"/>
  <text x="80.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">before_setup</text>
  <text x="80.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">hook</text>
  <path d="M140,210 L155,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="155" y="180" width="120" height="60" rx="6" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="215.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">setup</text>
  <text x="215.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">your code</text>
  <path d="M275,210 L290,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="290" y="180" width="120" height="60" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.4"/>
  <text x="350.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">after_setup</text>
  <text x="350.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">hook</text>
  <path d="M410,210 L425,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="425" y="180" width="120" height="60" rx="6" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="485.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">test_*</text>
  <text x="485.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">your test</text>
  <path d="M545,210 L560,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="560" y="180" width="120" height="60" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.4"/>
  <text x="620.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">before_teardown</text>
  <text x="620.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">hook</text>
  <path d="M680,210 L695,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="695" y="180" width="120" height="60" rx="6" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="755.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">teardown</text>
  <text x="755.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">your code</text>
  <path d="M815,210 L830,210" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="830" y="180" width="120" height="60" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.4"/>
  <text x="890.0" y="211.0" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#222222" text-anchor="middle">after_teardown</text>
  <text x="890.0" y="227.0" font-size="11" fill="#666666" text-anchor="middle">hook</text>
  <path d="M865,122 L865,150 L80,150 L80,180" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="20" y="268" width="960" height="46" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="500" y="288" font-size="13" fill="#222222" text-anchor="middle">Result of the test method: <tspan font-family="Courier New, monospace" font-weight="bold">.</tspan> pass   <tspan font-family="Courier New, monospace" font-weight="bold">F</tspan> failed assertion   <tspan font-family="Courier New, monospace" font-weight="bold">E</tspan> unexpected exception   <tspan font-family="Courier New, monospace" font-weight="bold">S</tspan> skip   <tspan font-family="Courier New, monospace" font-weight="bold">W</tspan> warning (-Werror)</text>
  <text x="500" y="305" font-size="11" fill="#666666" text-anchor="middle">teardown steps still run when the test fails or raises</text>
  <rect x="20" y="338" width="960" height="40" rx="6" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="500" y="363" font-size="13" fill="#222222" text-anchor="middle">After all tests: Minitest.after_run blocks (coverage report, cleanup), then the summary line and the exit status</text>
  <text x="140" y="172" font-size="11" fill="#666666">grey = hooks for modules and plugins (call super)   orange = what you normally define</text>
</svg>
