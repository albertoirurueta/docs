<svg viewBox="0 0 760 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Fragment lifecycle compared to the Activity lifecycle, with the fragment view lifecycle highlighted</title>
  <defs>
    <marker id="arrFl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="900" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Activity lifecycle vs. Fragment lifecycle</text>
  <text x="380" y="45" font-size="11" fill="#666666" text-anchor="middle">dashed lines tie matching calls together; the fragment column has extra states an activity has none for</text>

  <!-- Column headers -->
  <rect x="70" y="62" width="200" height="26" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="170" y="80" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Activity</text>

  <rect x="470" y="62" width="220" height="26" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
  <text x="580" y="80" font-size="13" font-weight="bold" fill="#6a2d6a" text-anchor="middle">Fragment</text>

  <!-- Shaded band for fragment view lifecycle, drawn first so boxes sit on top -->
  <rect x="450" y="230" width="260" height="380" rx="8" fill="#fff6e6" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="580" y="222" font-size="10.5" font-weight="bold" fill="#8a6400" text-anchor="middle">fragment view lifecycle (viewLifecycleOwner)</text>

  <!-- Activity boxes -->
  <g font-size="11" fill="#333333">
    <rect x="90" y="106" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="125" text-anchor="middle">onCreate()</text>

    <rect x="90" y="166" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="185" text-anchor="middle">onStart()</text>

    <rect x="90" y="226" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="245" text-anchor="middle">onResume()</text>

    <rect x="90" y="286" width="160" height="40" rx="4" fill="#e3edf7" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="170" y="306" text-anchor="middle" font-weight="bold">Running</text>
    <text x="170" y="319" text-anchor="middle" font-size="9" fill="#555555">visible and interactive</text>

    <rect x="90" y="356" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="375" text-anchor="middle">onPause()</text>

    <rect x="90" y="416" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="435" text-anchor="middle">onStop()</text>

    <rect x="90" y="476" width="160" height="30" rx="4" fill="#f4e9e0" stroke="#8a4b1c" stroke-width="1.2"/>
    <text x="170" y="495" text-anchor="middle">onSaveInstanceState()</text>

    <rect x="90" y="536" width="160" height="30" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="170" y="555" text-anchor="middle">onDestroy()</text>
  </g>

  <!-- Activity connecting arrows -->
  <g stroke="#666666" stroke-width="1.2" marker-end="url(#arrFl)">
    <line x1="170" y1="136" x2="170" y2="164"/>
    <line x1="170" y1="196" x2="170" y2="224"/>
    <line x1="170" y1="256" x2="170" y2="284"/>
    <line x1="170" y1="326" x2="170" y2="354"/>
    <line x1="170" y1="386" x2="170" y2="414"/>
    <line x1="170" y1="446" x2="170" y2="474"/>
    <line x1="170" y1="506" x2="170" y2="534"/>
  </g>

  <!-- Fragment boxes -->
  <g font-size="11" fill="#333333">
    <rect x="490" y="106" width="180" height="26" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="123" text-anchor="middle">onAttach()</text>

    <rect x="490" y="146" width="180" height="26" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="163" text-anchor="middle">onCreate()</text>

    <!-- view lifecycle band contents -->
    <rect x="490" y="240" width="180" height="26" rx="4" fill="#fff0cc" stroke="#8a6400" stroke-width="1.2"/>
    <text x="580" y="257" text-anchor="middle">onCreateView()</text>

    <rect x="490" y="280" width="180" height="26" rx="4" fill="#fff0cc" stroke="#8a6400" stroke-width="1.2"/>
    <text x="580" y="297" text-anchor="middle">onViewCreated()</text>

    <rect x="490" y="320" width="180" height="24" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="336" text-anchor="middle" font-size="10.5">onStart()</text>

    <rect x="490" y="356" width="180" height="24" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="372" text-anchor="middle" font-size="10.5">onResume()</text>

    <rect x="490" y="392" width="180" height="34" rx="4" fill="#efdff0" stroke="#6a2d6a" stroke-width="1.6"/>
    <text x="580" y="409" text-anchor="middle" font-weight="bold" font-size="10.5">Running</text>
    <text x="580" y="421" text-anchor="middle" font-size="8.5" fill="#555555">view visible; viewLifecycleOwner is RESUMED</text>

    <rect x="490" y="438" width="180" height="24" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="454" text-anchor="middle" font-size="10.5">onPause()</text>

    <rect x="490" y="474" width="180" height="24" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="490" text-anchor="middle" font-size="10.5">onStop()</text>

    <rect x="490" y="510" width="180" height="26" rx="4" fill="#f4e9e0" stroke="#8a4b1c" stroke-width="1.2"/>
    <text x="580" y="527" text-anchor="middle" font-size="10.5">onSaveInstanceState()</text>

    <rect x="490" y="550" width="180" height="26" rx="4" fill="#fff0cc" stroke="#8a6400" stroke-width="1.6"/>
    <text x="580" y="567" text-anchor="middle" font-weight="bold" font-size="10.5">onDestroyView()</text>

    <rect x="490" y="626" width="180" height="26" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="643" text-anchor="middle">onDestroy()</text>

    <rect x="490" y="666" width="180" height="26" rx="4" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="580" y="683" text-anchor="middle">onDetach()</text>
  </g>

  <!-- Fragment connecting arrows -->
  <g stroke="#666666" stroke-width="1.1" marker-end="url(#arrFl)">
    <line x1="580" y1="132" x2="580" y2="144"/>
    <line x1="580" y1="172" x2="580" y2="238"/>
    <line x1="580" y1="266" x2="580" y2="278"/>
    <line x1="580" y1="306" x2="580" y2="318"/>
    <line x1="580" y1="344" x2="580" y2="354"/>
    <line x1="580" y1="380" x2="580" y2="390"/>
    <line x1="580" y1="426" x2="580" y2="436"/>
    <line x1="580" y1="462" x2="580" y2="472"/>
    <line x1="580" y1="498" x2="580" y2="508"/>
    <line x1="580" y1="536" x2="580" y2="548"/>
  </g>
  <!-- loop back from onDestroyView to onCreateView, showing the view can be re-created while the fragment survives -->
  <path d="M 675 563 C 735 563 735 250 675 250" fill="none" stroke="#8a6400" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrFl)"/>
  <text x="705" y="410" font-size="9" fill="#8a6400" text-anchor="middle" transform="rotate(90 705 410)">view re-created (e.g. back stack, ViewPager2 page re-attach)</text>

  <line x1="580" y1="576" x2="580" y2="624" stroke="#666666" stroke-width="1.1" marker-end="url(#arrFl)"/>
  <line x1="580" y1="652" x2="580" y2="664" stroke="#666666" stroke-width="1.1" marker-end="url(#arrFl)"/>

  <!-- Dashed connectors between matching activity/fragment calls -->
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3,3">
    <line x1="250" y1="181" x2="490" y2="332"/>
    <line x1="250" y1="241" x2="490" y2="368"/>
    <line x1="250" y1="306" x2="490" y2="409"/>
    <line x1="250" y1="371" x2="490" y2="450"/>
    <line x1="250" y1="431" x2="490" y2="486"/>
    <line x1="250" y1="491" x2="490" y2="523"/>
  </g>

  <!-- Legend -->
  <g font-size="10" fill="#333333">
    <rect x="60" y="720" width="14" height="14" fill="#f7eef7" stroke="#6a2d6a" stroke-width="1.2"/>
    <text x="80" y="731">Fragment-only callback, no view attached yet</text>

    <rect x="60" y="742" width="14" height="14" fill="#fff0cc" stroke="#8a6400" stroke-width="1.2"/>
    <text x="80" y="753">Fragment view lifecycle callback (scoped to viewLifecycleOwner)</text>

    <rect x="60" y="764" width="14" height="14" fill="#f4e9e0" stroke="#8a4b1c" stroke-width="1.2"/>
    <text x="80" y="775">State-saving callback, shared name and timing on both sides</text>

    <line x1="60" y1="793" x2="88" y2="793" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="94" y="797">Fragment callback runs in lockstep with the matching Activity callback</text>

    <line x1="60" y1="812" x2="88" y2="812" stroke="#8a6400" stroke-width="1.4" stroke-dasharray="3,3"/>
    <text x="94" y="816">The fragment view can be destroyed and re-created while the fragment instance itself survives</text>
  </g>

  <text x="380" y="850" font-size="10.5" fill="#555555" text-anchor="middle">
    onAttach() and onDetach() have no Activity equivalent: they mark the fragment joining and leaving its host,
  </text>
  <text x="380" y="865" font-size="10.5" fill="#555555" text-anchor="middle">
    independently of the host Activity itself being created or destroyed.
  </text>
</svg>
