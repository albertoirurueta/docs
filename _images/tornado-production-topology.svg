<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Production topology of Bookshelf Live</title>
  <defs>
    <marker id="tpt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Bookshelf Live in production</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one single-threaded Tornado process per core, a reverse proxy in front</text>

  <rect x="20" y="130" width="110" height="80" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="75" y="160" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Clients</text>
  <text x="75" y="178" font-size="11" fill="currentColor" text-anchor="middle">browsers, scanners,</text>
  <text x="75" y="192" font-size="11" fill="currentColor" text-anchor="middle">WebSocket pages</text>

  <rect x="175" y="110" width="150" height="120" rx="6" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/>
  <text x="250" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">nginx</text>
  <text x="250" y="156" font-size="11" fill="currentColor" text-anchor="middle">TLS termination</text>
  <text x="250" y="172" font-size="11" fill="currentColor" text-anchor="middle">static files, gzip</text>
  <text x="250" y="188" font-size="11" fill="currentColor" text-anchor="middle">Upgrade headers</text>
  <text x="250" y="204" font-size="11" fill="currentColor" text-anchor="middle">X-Real-IP, X-Scheme</text>
  <text x="250" y="220" font-size="11" fill="currentColor" text-anchor="middle">upstream failover</text>

  <rect x="380" y="70" width="150" height="46" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="455" y="90" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Tornado, task 0</text>
  <text x="455" y="106" font-size="11" fill="currentColor" text-anchor="middle">127.0.0.1:8000</text>
  <rect x="380" y="140" width="150" height="46" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="455" y="160" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Tornado, task 1</text>
  <text x="455" y="176" font-size="11" fill="currentColor" text-anchor="middle">127.0.0.1:8001</text>
  <rect x="380" y="210" width="150" height="46" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="455" y="230" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Tornado, task N</text>
  <text x="455" y="246" font-size="11" fill="currentColor" text-anchor="middle">127.0.0.1:800N</text>

  <rect x="575" y="110" width="125" height="120" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="637" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Backing services</text>
  <text x="637" y="160" font-size="11" fill="currentColor" text-anchor="middle">SQL database</text>
  <text x="637" y="178" font-size="11" fill="currentColor" text-anchor="middle">Redis pub/sub</text>
  <text x="637" y="196" font-size="11" fill="currentColor" text-anchor="middle">object storage</text>

  <line x1="130" y1="170" x2="173" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <text x="152" y="162" font-size="10" fill="currentColor" text-anchor="middle">HTTPS</text>
  <line x1="325" y1="150" x2="378" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <line x1="325" y1="170" x2="378" y2="163" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <line x1="325" y1="190" x2="378" y2="233" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <text x="352" y="270" font-size="10" fill="currentColor" text-anchor="middle">plain HTTP on loopback</text>
  <line x1="530" y1="93" x2="573" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <line x1="530" y1="163" x2="573" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>
  <line x1="530" y1="233" x2="573" y2="190" stroke="currentColor" stroke-width="1.5" marker-end="url(#tpt-arrow)"/>

  <rect x="20" y="300" width="680" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="322" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Supervision: systemd, Supervisor or the container orchestrator</text>
  <text x="360" y="344" font-size="11" fill="currentColor" text-anchor="middle">starts and restarts the processes, sends SIGTERM, probes /healthz (liveness) and /readyz (readiness)</text>
  <text x="360" y="362" font-size="11" fill="currentColor" text-anchor="middle">on SIGTERM: readiness fails, accepting stops, running requests finish, WebSockets close with 1001, exit 0</text>
  <line x1="455" y1="258" x2="455" y2="298" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#tpt-arrow)"/>
</svg>
