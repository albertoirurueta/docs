<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-migrating-from-opengl-conventions" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Conventions that change when porting from OpenGL</text>
<rect x="30" y="55" width="330" height="200" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="159.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="400" y="55" width="330" height="200" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="159.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="195" y="78" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">OpenGL</text>
<text x="565" y="78" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Metal</text>
<text x="195" y="109" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">clip-space depth: -1 to 1</text>
<text x="565" y="109" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">clip-space depth: 0 to 1</text>
<text x="195" y="141" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">window origin: bottom left</text>
<text x="565" y="141" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">window origin: top left</text>
<text x="195" y="173" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texture origin (0,0): bottom left</text>
<text x="565" y="173" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texture origin (0,0): top left</text>
<text x="195" y="205" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">matrices: column-major</text>
<text x="565" y="205" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">matrices: column-major</text>
<text x="195" y="237" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">front face default: counter-clockwise</text>
<text x="565" y="237" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">front face default: clockwise</text>
<rect x="30" y="275" width="700" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="296.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">Only the depth range, the origins and the winding default differ; matrix layout does not.</text>
<text x="380" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Winding is a state in both APIs: set it explicitly (setFrontFacing) instead of relying on the default.</text>
</svg>
