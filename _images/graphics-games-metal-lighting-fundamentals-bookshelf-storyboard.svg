<text x="685.0" y="287" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">the desk lamp</text>
<text x="380" y="316" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each panel adds one term of the same fragment function; the final panel is the code of this page.</text>
