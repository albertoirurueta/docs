<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="laa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="law" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="lag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Look-at builds an orthonormal basis from eye, target and up</text>
<rect x="134" y="188" width="32" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150" y="230" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">eye</text>
<circle cx="560.0" cy="100.0" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="560" y="80" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">target</text>
<line x1="166.0" y1="192.0" x2="546.0" y2="106.0" stroke="#4B5563" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="150.0" y1="200.0" x2="295.7" y2="164.5" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#laa)"/>
<text x="301.72805081746947" y="156.45657297134892" text-anchor="start" font-size="11" fill="#3730A3">forward f = normalise(target - eye)</text>
<line x1="150.0" y1="200.0" x2="126.3" y2="102.8" stroke="#047857" stroke-width="2.5" marker-end="url(#lag)"/>
<text x="120.30438198089928" y="94.84796612168704" text-anchor="end" font-size="11" fill="#047857">true up u = r x f</text>
<line x1="150.0" y1="200.0" x2="80.0" y2="236.0" stroke="#B45309" stroke-width="2.5" marker-end="url(#law)"/>
<text x="76" y="252" text-anchor="start" font-size="11" fill="#92400E">right r = normalise(f x worldUp)</text>
<line x1="210.0" y1="310.0" x2="210.0" y2="268.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#la)"/>
<text x="218" y="300" text-anchor="start" font-size="11" fill="#374151">world up</text>
<text x="600" y="300" text-anchor="end" font-size="12" fill="#1F2937" font-weight="bold">Rotation part of the view matrix = rows r, u, -f</text>
<text x="600" y="318" text-anchor="end" font-size="11" fill="#374151">(for a right-handed camera that looks down -Z)</text>
</svg>
