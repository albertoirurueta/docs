<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The three-layer AI stack</text>
  <text x="380" y="48" font-size="12" fill="#666666" text-anchor="middle">What an AI-engineered application is built from, top to bottom</text>

  <!-- Application layer -->
  <rect x="60" y="70" width="640" height="90" rx="8" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="90" y="98" font-size="14" font-weight="bold" fill="#1c4b73">Application layer</text>
  <text x="90" y="120" font-size="11.5" fill="#333333">Product code, prompts and context assembly, orchestration,</text>
  <text x="90" y="138" font-size="11.5" fill="#333333">guardrails and evaluation -- what AI engineering mostly works on</text>

  <!-- arrow 1 -->
  <polygon points="380,164 372,178 388,178" fill="#555555"/>

  <!-- Model layer -->
  <rect x="60" y="184" width="640" height="90" rx="8" fill="#fbeee7" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="90" y="212" font-size="14" font-weight="bold" fill="#7a3b12">Model layer</text>
  <text x="90" y="234" font-size="11.5" fill="#333333">The foundation model itself -- pre-trained and post-trained,</text>
  <text x="90" y="252" font-size="11.5" fill="#333333">accessed as a hosted API or run locally -- what ML engineering mostly works on</text>

  <!-- arrow 2 -->
  <polygon points="380,278 372,292 388,292" fill="#555555"/>

  <!-- Infrastructure layer -->
  <rect x="60" y="298" width="640" height="90" rx="8" fill="#eef2ec" stroke="#2f5424" stroke-width="1.5"/>
  <text x="90" y="326" font-size="14" font-weight="bold" fill="#2f5424">Infrastructure layer</text>
  <text x="90" y="348" font-size="11.5" fill="#333333">Compute, data pipelines, model serving, storage and observability</text>
  <text x="90" y="366" font-size="11.5" fill="#333333">that the two layers above run on, whether self-hosted or cloud-managed</text>

  <text x="60" y="408" font-size="11" fill="#888888">Most day-to-day AI engineering work sits in the application layer, treating the model layer as a dependency rather than something it trains.</text>
</svg>
