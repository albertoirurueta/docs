<rect x="30" y="430" width="14" height="14" fill="#e1f0ff" stroke="#1f5fa6"/><text x="50" y="442" font-size="11" fill="#333">group header and footer bands</text>
<rect x="250" y="430" width="14" height="14" fill="#fff3d6" stroke="#b36b00"/><text x="270" y="442" font-size="11" fill="#333">detail band, once per row</text>
<rect x="430" y="430" width="14" height="14" fill="#e3f4e3" stroke="#2f7a2f"/><text x="450" y="442" font-size="11" fill="#333">page and report bands</text>
<text x="30" y="478" font-size="11" fill="#333">A group longer than one page continues on the next one: with reprintHeaderOnEachPage=true its groupHeader band is printed again there.</text>
<text x="30" y="496" font-size="11" fill="#333">Group variables (resetType=Group) restart at each break: the groupFooter band shows the total of the group just closed.</text>
<text x="30" y="514" font-size="11" fill="#333">Without sorted data a category would break every time it reappears: groups compare consecutive rows, they do not merge them.</text>
