<text x="30" y="58" font-size="13" font-weight="700" fill="#1f5fa6">1. Rows reach the groups sorted and filtered</text>
<rect x="30" y="68" width="400" height="30" rx="4" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
<text x="40" y="88" font-size="12" font-weight="700" fill="#1f5fa6">sortField category, month, amount desc</text>
<text x="30" y="124" font-size="11" fill="#1a1a1a">filterExpression $F{quantity} &gt;= $P{MIN_QUANTITY} drops the rows first</text>
<text x="40" y="140" font-size="11" font-weight="700" fill="#333">category</text><text x="130" y="140" font-size="11" font-weight="700" fill="#333">month</text><text x="215" y="140" font-size="11" font-weight="700" fill="#333">title</text><text x="380" y="140" font-size="11" font-weight="700" fill="#333" text-anchor="end">amount</text>
