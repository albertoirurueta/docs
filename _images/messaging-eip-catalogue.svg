<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="500" fill="#ffffff"/>
  <text x="350" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Enterprise Integration Patterns used in this section</text>
  <text x="350" y="48" font-size="11" fill="#666666" text-anchor="middle">each pattern's Kafka and RabbitMQ realisation is mapped in the table later on this page</text>

  <!-- Row 0 -->
  <g>
    <rect x="20" y="74" width="154" height="92" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="97" y="98" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Message</text>
    <text x="97" y="118" font-size="9.5" fill="#333333" text-anchor="middle">atomic packet of data:</text>
    <text x="97" y="132" font-size="9.5" fill="#333333" text-anchor="middle">payload + headers</text>
  </g>
  <g>
    <rect x="188" y="74" width="154" height="92" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
    <text x="265" y="98" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Message Channel</text>
    <text x="265" y="118" font-size="9.5" fill="#333333" text-anchor="middle">the conduit a message</text>
    <text x="265" y="132" font-size="9.5" fill="#333333" text-anchor="middle">travels between apps</text>
  </g>
  <g>
    <rect x="356" y="74" width="154" height="92" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
    <text x="433" y="98" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pipes and Filters</text>
    <text x="433" y="118" font-size="9.5" fill="#333333" text-anchor="middle">chain of independent</text>
    <text x="433" y="132" font-size="9.5" fill="#333333" text-anchor="middle">processing steps</text>
  </g>
  <g>
    <rect x="524" y="74" width="154" height="92" fill="#fbecec" stroke="#a33" stroke-width="1.3"/>
    <text x="601" y="98" font-size="12" font-weight="bold" fill="#a33" text-anchor="middle">Message Router</text>
    <text x="601" y="118" font-size="9.5" fill="#333333" text-anchor="middle">sends a message down</text>
    <text x="601" y="132" font-size="9.5" fill="#333333" text-anchor="middle">one of many paths</text>
  </g>

  <!-- Row 1 -->
  <g>
    <rect x="20" y="180" width="154" height="92" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="97" y="204" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Message Translator</text>
    <text x="97" y="224" font-size="9.5" fill="#333333" text-anchor="middle">converts one message</text>
    <text x="97" y="238" font-size="9.5" fill="#333333" text-anchor="middle">format into another</text>
  </g>
  <g>
    <rect x="188" y="180" width="154" height="92" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
    <text x="265" y="204" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Message Endpoint</text>
    <text x="265" y="224" font-size="9.5" fill="#333333" text-anchor="middle">connects an app to</text>
    <text x="265" y="238" font-size="9.5" fill="#333333" text-anchor="middle">a messaging channel</text>
  </g>
  <g>
    <rect x="356" y="180" width="154" height="92" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
    <text x="433" y="204" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Correlation Identifier</text>
    <text x="433" y="224" font-size="9.5" fill="#333333" text-anchor="middle">ties a reply back to</text>
    <text x="433" y="238" font-size="9.5" fill="#333333" text-anchor="middle">its original request</text>
  </g>
  <g>
    <rect x="524" y="180" width="154" height="92" fill="#fbecec" stroke="#a33" stroke-width="1.3"/>
    <text x="601" y="204" font-size="12" font-weight="bold" fill="#a33" text-anchor="middle">Return Address</text>
    <text x="601" y="224" font-size="9.5" fill="#333333" text-anchor="middle">tells the replier</text>
    <text x="601" y="238" font-size="9.5" fill="#333333" text-anchor="middle">where to send a reply</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="20" y="286" width="154" height="92" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="97" y="310" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Message Expiration</text>
    <text x="97" y="330" font-size="9.5" fill="#333333" text-anchor="middle">a message that goes</text>
    <text x="97" y="344" font-size="9.5" fill="#333333" text-anchor="middle">stale after some time</text>
  </g>
  <g>
    <rect x="188" y="286" width="154" height="92" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
    <text x="265" y="310" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Dead-Letter Channel</text>
    <text x="265" y="330" font-size="9.5" fill="#333333" text-anchor="middle">holds messages that</text>
    <text x="265" y="344" font-size="9.5" fill="#333333" text-anchor="middle">could not be delivered</text>
  </g>
  <g>
    <rect x="356" y="286" width="154" height="92" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
    <text x="433" y="310" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Idempotent Receiver</text>
    <text x="433" y="330" font-size="9.5" fill="#333333" text-anchor="middle">handles the same</text>
    <text x="433" y="344" font-size="9.5" fill="#333333" text-anchor="middle">message safely twice</text>
  </g>
  <g>
    <rect x="524" y="286" width="154" height="92" fill="#fbecec" stroke="#a33" stroke-width="1.3"/>
    <text x="601" y="310" font-size="11.5" font-weight="bold" fill="#a33" text-anchor="middle">Competing Consumers</text>
    <text x="601" y="330" font-size="9.5" fill="#333333" text-anchor="middle">many consumers share</text>
    <text x="601" y="344" font-size="9.5" fill="#333333" text-anchor="middle">one channel's load</text>
  </g>

  <!-- Row 3 (centered pair) -->
  <g>
    <rect x="188" y="392" width="154" height="92" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="265" y="416" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Message Filter</text>
    <text x="265" y="436" font-size="9.5" fill="#333333" text-anchor="middle">drops messages that</text>
    <text x="265" y="450" font-size="9.5" fill="#333333" text-anchor="middle">fail a criterion</text>
  </g>
  <g>
    <rect x="356" y="392" width="154" height="92" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
    <text x="433" y="416" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Aggregator / Splitter</text>
    <text x="433" y="436" font-size="9.5" fill="#333333" text-anchor="middle">combines many into one,</text>
    <text x="433" y="450" font-size="9.5" fill="#333333" text-anchor="middle">or splits one into many</text>
  </g>
</svg>
