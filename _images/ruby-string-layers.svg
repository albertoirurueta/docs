<svg viewBox="0 0 1010 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>One Ruby string as bytes, code points and grapheme clusters</title>
  <desc>The string made of the letters C, a, f, the letter e followed by a combining acute accent, and a flag made of two regional indicator code points. It has 14 bytes in UTF-8, 7 code points and 5 grapheme clusters. Each grapheme cluster spans one or more code points and each code point spans one to four bytes.</desc>
  <rect x="0" y="0" width="1010" height="400" fill="#ffffff"/>
  <text x="505" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">One string, three ways to count it</text>
  <text x="505" y="50" font-size="12" fill="#666666" text-anchor="middle">UTF-8 string "Cafe" + U+0301 + U+1F1EA + U+1F1F8, written "Cafe\u{301}\u{1F1EA}\u{1F1F8}" in Ruby</text>
  <text x="12" y="90" font-size="14" font-weight="bold" fill="#222222">Grapheme clusters</text>
  <text x="12" y="108" font-size="11" fill="#444444">what a reader counts</text>
  <text x="12" y="124" font-size="11" font-weight="bold" fill="#1f4f1f">grapheme_clusters.length = 5</text>
  <rect x="200" y="70" width="56" height="64" rx="5" fill="#e6f2e6" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="228.0" y="108" font-size="16" font-weight="bold" fill="#1f4f1f" text-anchor="middle">C</text>
  <rect x="256" y="70" width="56" height="64" rx="5" fill="#e6f2e6" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="284.0" y="108" font-size="16" font-weight="bold" fill="#1f4f1f" text-anchor="middle">a</text>
  <rect x="312" y="70" width="56" height="64" rx="5" fill="#e6f2e6" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="340.0" y="108" font-size="16" font-weight="bold" fill="#1f4f1f" text-anchor="middle">f</text>
  <rect x="368" y="70" width="168" height="64" rx="5" fill="#e6f2e6" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="452.0" y="98" font-size="16" font-weight="bold" fill="#1f4f1f" text-anchor="middle">e + accent</text>
  <text x="452.0" y="118" font-size="11" fill="#444444" text-anchor="middle">one cluster</text>
  <rect x="536" y="70" width="448" height="64" rx="5" fill="#e6f2e6" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="760.0" y="98" font-size="16" font-weight="bold" fill="#1f4f1f" text-anchor="middle">flag</text>
  <text x="760.0" y="118" font-size="11" fill="#444444" text-anchor="middle">two regional indicators, one cluster</text>
  <text x="12" y="190" font-size="14" font-weight="bold" fill="#222222">Code points</text>
  <text x="12" y="208" font-size="11" fill="#444444">what Ruby calls characters</text>
  <text x="12" y="224" font-size="11" font-weight="bold" fill="#1c4b73">length = 7, codepoints</text>
  <rect x="200" y="170" width="56" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="228.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+0043</text>
  <text x="228.0" y="218" font-size="11" fill="#444444" text-anchor="middle">C</text>
  <rect x="256" y="170" width="56" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="284.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+0061</text>
  <text x="284.0" y="218" font-size="11" fill="#444444" text-anchor="middle">a</text>
  <rect x="312" y="170" width="56" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="340.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+0066</text>
  <text x="340.0" y="218" font-size="11" fill="#444444" text-anchor="middle">f</text>
  <rect x="368" y="170" width="56" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="396.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+0065</text>
  <text x="396.0" y="218" font-size="11" fill="#444444" text-anchor="middle">e</text>
  <rect x="424" y="170" width="112" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="480.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+0301</text>
  <text x="480.0" y="218" font-size="11" fill="#444444" text-anchor="middle">combining acute</text>
  <rect x="536" y="170" width="224" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="648.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+1F1EA</text>
  <text x="648.0" y="218" font-size="11" fill="#444444" text-anchor="middle">regional indicator E</text>
  <rect x="760" y="170" width="224" height="64" rx="5" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="872.0" y="198" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">U+1F1F8</text>
  <text x="872.0" y="218" font-size="11" fill="#444444" text-anchor="middle">regional indicator S</text>
  <text x="12" y="290" font-size="14" font-weight="bold" fill="#222222">Bytes</text>
  <text x="12" y="308" font-size="11" fill="#444444">what is stored in UTF-8</text>
  <text x="12" y="324" font-size="11" font-weight="bold" fill="#6b3f00">bytesize = 14, bytes</text>
  <rect x="200" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="228.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">43</text>
  <rect x="256" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="284.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">61</text>
  <rect x="312" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="340.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">66</text>
  <rect x="368" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="396.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">65</text>
  <rect x="424" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="452.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">CC</text>
  <rect x="480" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="508.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">81</text>
  <rect x="536" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="564.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">F0</text>
  <rect x="592" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="620.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">9F</text>
  <rect x="648" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="676.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">87</text>
  <rect x="704" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="732.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">AA</text>
  <rect x="760" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="788.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">F0</text>
  <rect x="816" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="844.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">9F</text>
  <rect x="872" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="900.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">87</text>
  <rect x="928" y="270" width="56" height="64" rx="5" fill="#fdf1e3" stroke="#8a5200" stroke-width="1.5"/>
  <text x="956.0" y="308" font-size="16" font-weight="bold" fill="#6b3f00" text-anchor="middle">B8</text>
  <text x="505" y="372" font-size="12" fill="#444444" text-anchor="middle">Indexing, slicing, length and reverse count code points. Bytes matter for I/O and size limits. Clusters matter for display, truncation and cursors.</text>
  <text x="505" y="390" font-size="12" fill="#444444" text-anchor="middle">Normalization (NFC, NFD) changes the code points but not what the reader sees.</text>
</svg>
