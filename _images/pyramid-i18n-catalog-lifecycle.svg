<svg viewBox="0 0 720 590" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How a Pyramid translation travels from source code to a rendered page</title>
  <defs><marker id="pi18n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">From marked string to translated page</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">build time and startup above the dashed line, each request below it</text>
  <rect x="30" y="70" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="89" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Mark strings in code and templates</text>
  <text x="360.0" y="106" font-size="10.5" fill="currentColor" text-anchor="middle">_() from TranslationStringFactory, localizer.pluralize, {% trans %}, i18n:translate</text>
  <line x1="360.0" y1="116" x2="360.0" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="132" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="151" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Extract a template catalog (.pot)</text>
  <text x="360.0" y="168" font-size="10.5" fill="currentColor" text-anchor="middle">pot-create (Lingua) or pybabel extract (Babel)</text>
  <line x1="360.0" y1="178" x2="360.0" y2="194" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="194" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="213" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Create or update one .po per locale</text>
  <text x="360.0" y="230" font-size="10.5" fill="currentColor" text-anchor="middle">msginit and msgmerge, or pybabel init and update; translators edit here</text>
  <line x1="360.0" y1="240" x2="360.0" y2="256" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="256" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="275" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Compile to binary .mo files</text>
  <text x="360.0" y="292" font-size="10.5" fill="currentColor" text-anchor="middle">msgfmt or pybabel compile; Pyramid reads only .mo</text>
  <line x1="360.0" y1="302" x2="360.0" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="318" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="337" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Register the directories at startup</text>
  <text x="360.0" y="354" font-size="10.5" fill="currentColor" text-anchor="middle">config.add_translation_dirs("bookshelf_shelves:locale")</text>
  <line x1="360.0" y1="364" x2="360.0" y2="394" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="394" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="413" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Negotiate the locale for each request</text>
  <text x="360.0" y="430" font-size="10.5" fill="currentColor" text-anchor="middle">request.locale_name: negotiator, then pyramid.default_locale_name, then en</text>
  <line x1="360.0" y1="440" x2="360.0" y2="456" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="456" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="475" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Localizer built once per locale name</text>
  <text x="360.0" y="492" font-size="10.5" fill="currentColor" text-anchor="middle">request.localizer merges every .mo of that locale and caches it in the registry</text>
  <line x1="360.0" y1="502" x2="360.0" y2="518" stroke="currentColor" stroke-width="1.5" marker-end="url(#pi18n-arrow)"/>
  <rect x="30" y="518" width="660" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="360.0" y="537" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Translate and pluralize</text>
  <text x="360.0" y="554" font-size="10.5" fill="currentColor" text-anchor="middle">localizer.translate(ts) and localizer.pluralize(...); Chameleon does it for you</text>
  <line x1="14" y1="379.0" x2="706" y2="379.0" stroke="currentColor" stroke-width="1" stroke-dasharray="6 4" opacity="0.8"/>
  <text x="30" y="390.0" font-size="10" fill="currentColor" text-anchor="start" opacity="0.8">each request</text>
  <text x="30" y="375.0" font-size="10" fill="currentColor" opacity="0.8">build and startup</text>
</svg>
