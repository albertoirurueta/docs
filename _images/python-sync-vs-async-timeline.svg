<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Blocking calls vs. cooperative tasks</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">fetch_a(), fetch_b(), fetch_c() -- same three waits, two schedules</text>

  <!-- ===================== Synchronous section ===================== -->
  <text x="100" y="68" font-size="13" font-weight="bold" fill="#222222">Synchronous -- each call blocks the thread until it returns</text>
  <text x="36" y="100" font-size="11" fill="#666666">calls</text>

  <rect x="100" y="76" width="200" height="40" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="200" y="99" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">fetch_a()</text>
  <text x="200" y="112" font-size="9.5" fill="#666666" text-anchor="middle">0-100ms, blocked</text>

  <rect x="300" y="76" width="160" height="40" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <text x="380" y="99" font-size="13" font-weight="bold" fill="#8a1f1f" text-anchor="middle" font-family="'Courier New', monospace">fetch_b()</text>
  <text x="380" y="112" font-size="9.5" fill="#666666" text-anchor="middle">100-180ms, blocked</text>

  <rect x="460" y="76" width="120" height="40" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <text x="520" y="99" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">fetch_c()</text>
  <text x="520" y="112" font-size="9.5" fill="#666666" text-anchor="middle">180-240ms, blocked</text>

  <text x="590" y="100" font-size="12" font-weight="bold" fill="#222222">= 240ms total</text>

  <!-- ===================== Asynchronous section ===================== -->
  <text x="100" y="150" font-size="13" font-weight="bold" fill="#222222">Asynchronous -- tasks yield at each await, sharing one thread</text>

  <text x="36" y="178" font-size="11" fill="#666666">thread</text>
  <rect x="100" y="160" width="20" height="28" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="120" y="160" width="20" height="28" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="140" y="160" width="20" height="28" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="160" y="160" width="90" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="205" y="177" font-size="9" fill="#999999" text-anchor="middle">idle -- awaiting I/O</text>
  <rect x="250" y="160" width="20" height="28" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="270" y="160" width="20" height="28" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="290" y="160" width="20" height="28" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>

  <text x="320" y="178" font-size="12" font-weight="bold" fill="#222222">= 105ms total</text>

  <text x="36" y="211" font-size="11" fill="#1c4b73">task_a()</text>
  <rect x="100" y="196" width="20" height="22" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="120" y="196" width="170" height="22" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="290" y="196" width="20" height="22" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>

  <text x="36" y="237" font-size="11" fill="#8a1f1f">task_b()</text>
  <rect x="120" y="222" width="20" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>
  <rect x="140" y="222" width="130" height="22" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="270" y="222" width="20" height="22" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.4"/>

  <text x="36" y="263" font-size="11" fill="#2f5424">task_c()</text>
  <rect x="140" y="248" width="20" height="22" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>
  <rect x="160" y="248" width="90" height="22" fill="#ffffff" stroke="#2f5424" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="250" y="248" width="20" height="22" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.4"/>

  <!-- shared time axis -->
  <g stroke="#999999" stroke-width="1" fill="#666666">
    <line x1="100" y1="285" x2="620" y2="285"/>
    <line x1="100" y1="285" x2="100" y2="290"/>
    <line x1="200" y1="285" x2="200" y2="290"/>
    <line x1="300" y1="285" x2="300" y2="290"/>
    <line x1="400" y1="285" x2="400" y2="290"/>
    <line x1="500" y1="285" x2="500" y2="290"/>
    <line x1="600" y1="285" x2="600" y2="290"/>
  </g>
  <g font-size="10" fill="#666666" text-anchor="middle">
    <text x="100" y="302">0</text>
    <text x="200" y="302">50</text>
    <text x="300" y="302">100</text>
    <text x="400" y="302">150</text>
    <text x="500" y="302">200</text>
    <text x="600" y="302">250ms</text>
  </g>

  <text x="360" y="326" font-size="12" fill="#444444" text-anchor="middle">Blocking waits add up in sequence; cooperative awaiting overlaps them and finishes near the longest single wait.</text>

  <!-- legend -->
  <rect x="150" y="344" width="18" height="14" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="174" y="355" font-size="11" fill="#444444">running on the thread</text>
  <rect x="360" y="344" width="18" height="14" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="384" y="355" font-size="11" fill="#444444">awaiting -- thread free for other tasks</text>
</svg>
