<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Static files in development and in production</title>
  <defs>
    <marker id="fss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Who answers a request for /static/css/site.css</text>

  <!-- development lane -->
  <text x="30" y="60" font-size="13" font-weight="bold" fill="currentColor">Development</text>
  <rect x="30" y="72" width="130" height="50" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="95" y="102" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Browser</text>
  <rect x="230" y="72" width="200" height="50" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="330" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Flask static route</text>
  <text x="330" y="111" font-size="11" fill="currentColor" text-anchor="middle">send_static_file, send_from_directory</text>
  <rect x="500" y="72" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="595" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">static folder</text>
  <text x="595" y="111" font-size="11" fill="currentColor" text-anchor="middle">files on disk</text>
  <line x1="160" y1="97" x2="228" y2="97" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>
  <line x1="430" y1="97" x2="498" y2="97" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>

  <line x1="30" y1="150" x2="690" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- production lane -->
  <text x="30" y="178" font-size="13" font-weight="bold" fill="currentColor">Production</text>
  <rect x="30" y="196" width="110" height="50" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="85" y="226" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Browser</text>
  <rect x="190" y="196" width="130" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="255" y="218" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">CDN</text>
  <text x="255" y="235" font-size="11" fill="currentColor" text-anchor="middle">optional cache</text>
  <rect x="370" y="196" width="130" height="50" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="218" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">nginx</text>
  <text x="435" y="235" font-size="11" fill="currentColor" text-anchor="middle">location /static/</text>
  <rect x="550" y="196" width="140" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="620" y="218" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">built assets</text>
  <text x="620" y="235" font-size="11" fill="currentColor" text-anchor="middle">hashed file names</text>
  <line x1="140" y1="221" x2="188" y2="221" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>
  <line x1="320" y1="221" x2="368" y2="221" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>
  <line x1="500" y1="221" x2="548" y2="221" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>

  <rect x="370" y="316" width="130" height="50" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="338" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Gunicorn</text>
  <text x="435" y="355" font-size="11" fill="currentColor" text-anchor="middle">Flask workers</text>
  <line x1="435" y1="246" x2="435" y2="314" stroke="currentColor" stroke-width="1.5" marker-end="url(#fss-arrow)"/>
  <text x="445" y="285" font-size="11" fill="currentColor">everything else</text>
  <text x="190" y="346" font-size="11" fill="currentColor">/static/ never reaches Python:</text>
  <text x="190" y="362" font-size="11" fill="currentColor">views and the JSON API do.</text>
</svg>
