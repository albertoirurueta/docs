<circle cx="294" cy="150" r="9" fill="#c0392b"/><text x="294" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="534" cy="94" r="9" fill="#c0392b"/><text x="534" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
<circle cx="534" cy="234" r="9" fill="#c0392b"/><text x="534" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
<text x="660" y="60" font-size="13" font-weight="700" fill="#1f5fa6">Parts of the crosstab element</text>
<circle cx="669" cy="90" r="9" fill="#c0392b"/><text x="669" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<text x="684" y="89" font-size="11.5" font-weight="700" fill="#1a1a1a">headerCell</text>
<text x="684" y="104" font-size="10.5" fill="#333">top left corner, where row and column headers meet</text>
<circle cx="669" cy="128" r="9" fill="#c0392b"/><text x="669" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<text x="684" y="127" font-size="11.5" font-weight="700" fill="#1a1a1a">columnGroup + bucket</text>
<text x="684" y="142" font-size="10.5" fill="#333">one column per distinct $F{month}; header and totalHeader</text>
<circle cx="669" cy="166" r="9" fill="#c0392b"/><text x="669" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<text x="684" y="165" font-size="11.5" font-weight="700" fill="#1a1a1a">rowGroup + bucket (outer)</text>
<text x="684" y="180" font-size="10.5" fill="#333">one block per distinct $F{category}</text>
<circle cx="669" cy="204" r="9" fill="#c0392b"/><text x="669" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<text x="684" y="203" font-size="11.5" font-weight="700" fill="#1a1a1a">rowGroup + bucket (inner)</text>
<text x="684" y="218" font-size="10.5" fill="#333">nested: one row per $F{title} inside a category</text>
<circle cx="669" cy="242" r="9" fill="#c0392b"/><text x="669" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
<text x="684" y="241" font-size="11.5" font-weight="700" fill="#1a1a1a">cell</text>
<text x="684" y="256" font-size="10.5" fill="#333">detail: one cell per bucket pair, shows the measures</text>
<circle cx="669" cy="280" r="9" fill="#c0392b"/><text x="669" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<text x="684" y="279" font-size="11.5" font-weight="700" fill="#1a1a1a">cell rowTotalGroup=TitleRow</text>
<text x="684" y="294" font-size="10.5" fill="#333">subtotal: the inner row group summed over a category</text>
<circle cx="669" cy="318" r="9" fill="#c0392b"/><text x="669" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
<text x="684" y="317" font-size="11.5" font-weight="700" fill="#1a1a1a">cell columnTotalGroup=MonthColumn</text>
<text x="684" y="332" font-size="10.5" fill="#333">total of the column group, at the end of each row</text>
<circle cx="669" cy="356" r="9" fill="#c0392b"/><text x="669" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
<text x="684" y="355" font-size="11.5" font-weight="700" fill="#1a1a1a">cell with both total groups</text>
<text x="684" y="370" font-size="10.5" fill="#333">grand total: the outermost total of both axes</text>
<text x="40" y="282" font-size="12" font-weight="700" fill="#1f5fa6">How the grid is built</text>
<text x="40" y="302" font-size="11" fill="#333">Every input row goes through the bucket expressions (category, title, month) to find its detail cell,</text>
<text x="40" y="318" font-size="11" fill="#333">and the measure expression ($F{amount}, calculation Sum) is accumulated there and in every total cell it belongs to.</text>
<text x="40" y="334" font-size="11" fill="#333">A bucket pair with no input rows (Poetry in 2026-07) still gets a cell: Sum shows 0.00.</text>
<text x="40" y="350" font-size="11" fill="#333">totalPosition (Start, End or None) on a group decides whether its total row or column exists and where it goes.</text>
</svg>
