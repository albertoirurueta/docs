<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How one copy of Action Scheduler wins when several are installed</title>
  <desc id="d">Three copies of Action Scheduler are present on a site: the one bundled in WooCommerce with version 4.1.0, one bundled in another plugin with version 3.9.3, and a standalone plugin with version 4.2.0. During plugins_loaded at priority 0 each copy registers its version number and an initialization callback in the ActionScheduler_Versions registry. At plugins_loaded priority 1 the registry calls the callback of the highest version, here 4.2.0, which loads its classes. The other copies stay on disk and are never initialized. The API functions can be used from action_scheduler_init, which fires after init at priority 1.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Three copies on disk, one in memory</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">How the version registry of Action Scheduler chooses a copy; wp action-scheduler version --all lists the registered copies</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="84" width="270" height="76" rx="8" fill="#3d5266"/>
    <text x="56" y="108" font-weight="bold">WooCommerce 11.2.1</text>
    <text x="56" y="128">packages/action-scheduler</text>
    <text x="56" y="146">version 4.1.0</text>

    <rect x="40" y="184" width="270" height="76" rx="8" fill="#3d5266"/>
    <text x="56" y="208" font-weight="bold">Another plugin, bundled copy</text>
    <text x="56" y="228">libraries/action-scheduler</text>
    <text x="56" y="246">version 3.9.3</text>

    <rect x="40" y="284" width="270" height="76" rx="8" fill="#3d5266"/>
    <text x="56" y="308" font-weight="bold">Standalone plugin</text>
    <text x="56" y="328">plugins/action-scheduler</text>
    <text x="56" y="346">version 4.2.0</text>
  </g>

  <path d="M310 122 L380 200" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M310 222 L376 222" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M310 322 L380 246" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="312" y="402" font-size="12" fill="#f2f5f8">plugins_loaded, priority 0:</text>
  <text x="312" y="420" font-size="12" fill="#f2f5f8">each copy calls register( version, callback )</text>

  <rect x="384" y="170" width="220" height="104" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="2"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="398" y="194" font-weight="bold" fill="#f4b860">ActionScheduler_Versions</text>
    <text x="398" y="216">4.1.0  callback registered</text>
    <text x="398" y="234">3.9.3  callback registered</text>
    <text x="398" y="252">4.2.0  callback registered</text>
  </g>

  <path d="M604 222 L660 222" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="610" y="212" font-size="11" fill="#f2f5f8">priority 1</text>

  <rect x="664" y="170" width="256" height="104" rx="8" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="678" y="194" font-weight="bold" fill="#9fd3c7">Highest version wins</text>
    <text x="678" y="216">version_compare picks 4.2.0;</text>
    <text x="678" y="234">only its classes are loaded,</text>
    <text x="678" y="252">the others are never started</text>
  </g>
  <path d="M792 274 L792 330" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="664" y="334" width="256" height="104" rx="8" fill="#3d5266"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="678" y="358" font-weight="bold">init priority 1</text>
    <text x="678" y="380">stores, logger and runner</text>
    <text x="678" y="398">start; then the action</text>
    <text x="678" y="416">action_scheduler_init fires</text>
  </g>
  <rect x="40" y="454" width="880" height="46" rx="8" fill="#33485c" stroke="#e8908a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="474" font-size="12.5" fill="#f2f5f8"><tspan font-weight="bold" fill="#e8908a">Consequence</tspan>: every plugin runs on the newest copy. A copy that is loaded after priority 0, or that requires its own class files directly,</text>
  <text x="56" y="491" font-size="12.5" fill="#f2f5f8">bypasses the registry and can clash with it.</text>
</svg>
