<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The seven fields of a Quartz cron expression</text>
  <text x="450" y="50" font-size="12" fill="#444444" text-anchor="middle">Fields are separated by white space, read left to right; the first six are required</text>
  <text x="77.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">0</text>
  <text x="202.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">0</text>
  <text x="327.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">2</text>
  <text x="452.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">?</text>
  <text x="577.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">*</text>
  <text x="702.5" y="92" font-size="22" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle" font-weight="bold">MON-FRI</text>
  <text x="450" y="114" font-size="12" fill="#444444" text-anchor="middle">at 02:00:00 on every weekday (Monday to Friday), in the time zone of the trigger</text>
  <rect x="20" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="77.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 1</text>
  <text x="77.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Seconds</text>
  <line x1="30" y1="194" x2="125" y2="194" stroke="#cccccc"/>
  <text x="77.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="77.5" y="231" font-size="11" fill="#222222" text-anchor="middle">0-59</text>
  <text x="77.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="77.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * /</text>
  <text x="77.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: 0</text>
  <rect x="145" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="202.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 2</text>
  <text x="202.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Minutes</text>
  <line x1="155" y1="194" x2="250" y2="194" stroke="#cccccc"/>
  <text x="202.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="202.5" y="231" font-size="11" fill="#222222" text-anchor="middle">0-59</text>
  <text x="202.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="202.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * /</text>
  <text x="202.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: 0</text>
  <rect x="270" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="327.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 3</text>
  <text x="327.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Hours</text>
  <line x1="280" y1="194" x2="375" y2="194" stroke="#cccccc"/>
  <text x="327.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="327.5" y="231" font-size="11" fill="#222222" text-anchor="middle">0-23</text>
  <text x="327.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="327.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * /</text>
  <text x="327.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: 2</text>
  <rect x="395" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="452.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 4</text>
  <text x="452.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Day-of-month</text>
  <line x1="405" y1="194" x2="500" y2="194" stroke="#cccccc"/>
  <text x="452.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="452.5" y="231" font-size="11" fill="#222222" text-anchor="middle">1-31</text>
  <text x="452.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="452.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * ? / L W</text>
  <text x="452.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: ?</text>
  <rect x="520" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="577.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 5</text>
  <text x="577.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Month</text>
  <line x1="530" y1="194" x2="625" y2="194" stroke="#cccccc"/>
  <text x="577.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="577.5" y="231" font-size="11" fill="#222222" text-anchor="middle">1-12 or JAN-DEC</text>
  <text x="577.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="577.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * /</text>
  <text x="577.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: *</text>
  <rect x="645" y="140" width="115" height="170" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="702.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 6</text>
  <text x="702.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Day-of-week</text>
  <line x1="655" y1="194" x2="750" y2="194" stroke="#cccccc"/>
  <text x="702.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="702.5" y="231" font-size="11" fill="#222222" text-anchor="middle">1-7 or SUN-SAT</text>
  <text x="702.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="702.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * ? / L #</text>
  <text x="702.5" y="298" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">example: MON-FRI</text>
  <rect x="770" y="140" width="115" height="170" rx="8" fill="#ffffff" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="827.5" y="162" font-size="10" fill="#666666" text-anchor="middle">field 7</text>
  <text x="827.5" y="182" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Year (optional)</text>
  <line x1="780" y1="194" x2="875" y2="194" stroke="#cccccc"/>
  <text x="827.5" y="214" font-size="10" fill="#666666" text-anchor="middle">allowed values</text>
  <text x="827.5" y="231" font-size="11" fill="#222222" text-anchor="middle">a year, or omitted</text>
  <text x="827.5" y="256" font-size="10" fill="#666666" text-anchor="middle">special characters</text>
  <text x="827.5" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c26a00" font-weight="bold" text-anchor="middle">, - * /</text>
  <text x="827.5" y="298" font-size="11" fill="#666666" text-anchor="middle">omitted above</text>
  <rect x="20" y="326" width="860" height="86" rx="8" fill="#fbf3e6" stroke="#c26a00" stroke-width="1.2"/>
  <text x="36" y="348" font-size="12.5" font-weight="bold" fill="#222222">Two rules that trip people up</text>
  <text x="36" y="368" font-size="12" fill="#333333">1. Day-of-month (field 4) and day-of-week (field 6) cannot both be restricted: one of the two must be ? (no specific value).</text>
  <text x="36" y="386" font-size="12" fill="#333333">2. Day-of-week counts from Sunday = 1 (Monday = 2, Friday = 6, Saturday = 7); 0 is rejected. Spring and Unix cron number differently.</text>
  <text x="36" y="403" font-size="10.5" fill="#666666">Verified against org.quartz.CronExpression 2.5.2. Spring Framework 7.0.9 uses six fields (no year) and no ? requirement.</text>
</svg>
