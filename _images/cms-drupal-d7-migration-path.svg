<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Migration path from Drupal 7 to Drupal 11 and then Drupal 12</title>
  <desc id="d">A Drupal 7 source site is migrated into a new Drupal 11 site using Migrate Drupal. After launch, the Drupal 11 site is updated to Drupal 12 with the normal update process. Migrating directly into Drupal 12 is not possible because Migrate Drupal is removed there.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2933; }
    .box { fill: #ffffff; stroke: #334e68; stroke-width: 2; }
    .src { fill: #fde8e8; stroke: #9b1c1c; stroke-width: 2; }
    .ok { fill: #e3f4e8; stroke: #1b6e3c; stroke-width: 2; }
    .no { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 5; }
    .h { font-size: 17px; font-weight: bold; }
    .s { font-size: 13px; }
    .arrow { stroke: #334e68; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .bad { stroke: #9b1c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <rect class="src" x="20" y="110" width="220" height="130" rx="10"/>
  <text class="h" x="130" y="145" text-anchor="middle">Meridian Drupal 7 site</text>
  <text class="s" x="130" y="172" text-anchor="middle">end of life 2025-01-05</text>
  <text class="s" x="130" y="192" text-anchor="middle">database + files</text>
  <text class="s" x="130" y="212" text-anchor="middle">read-only source</text>

  <rect class="ok" x="370" y="110" width="230" height="130" rx="10"/>
  <text class="h" x="485" y="145" text-anchor="middle">New Drupal 11.x site</text>
  <text class="s" x="485" y="172" text-anchor="middle">migrate + migrate_drupal</text>
  <text class="s" x="485" y="192" text-anchor="middle">rebuilt theme, views, modules</text>
  <text class="s" x="485" y="212" text-anchor="middle">content and config migrated</text>

  <rect class="box" x="730" y="110" width="210" height="130" rx="10"/>
  <text class="h" x="835" y="145" text-anchor="middle">Drupal 12</text>
  <text class="s" x="835" y="172" text-anchor="middle">normal update from 11.3+</text>
  <text class="s" x="835" y="192" text-anchor="middle">no Migrate Drupal</text>
  <text class="s" x="835" y="212" text-anchor="middle">Migrate API stays</text>

  <path class="arrow" d="M240,175 L368,175"/>
  <text class="s" x="304" y="160" text-anchor="middle">migrate</text>
  <path class="arrow" d="M600,175 L728,175"/>
  <text class="s" x="664" y="160" text-anchor="middle">update</text>

  <path class="bad" d="M130,110 C130,40 835,40 835,106"/>
  <text class="s" x="485" y="52" text-anchor="middle">direct migration into Drupal 12: not possible</text>

  <rect class="no" x="20" y="290" width="920" height="50" rx="8"/>
  <text class="s" x="480" y="320" text-anchor="middle">Optional while the migration runs: a commercial extended security support provider covers the Drupal 7 site.</text>
</svg>
