<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">ECS on Fargate with awsvpc: one ENI per task, ALB in front, endpoints behind</text>

  <rect x="20" y="44" width="860" height="456" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="38" y="66" font-size="13" font-weight="700" fill="#3c4a58">VPC bookshelf-vpc (placeholder CIDR 10.0.0.0/16)</text>

  <!-- Internet -->
  <rect x="330" y="78" width="240" height="34" rx="17" fill="#fff4e0" stroke="#c77700" stroke-width="1.6"/>
  <text x="450" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4500">Clients on the internet (HTTPS)</text>
  <line x1="450" y1="112" x2="450" y2="140" stroke="#444" stroke-width="1.6"/>
  <polygon points="450,146 444,136 456,136" fill="#444"/>

  <!-- Public subnets -->
  <rect x="40" y="148" width="820" height="108" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="56" y="168" font-size="12" font-weight="700" fill="#123a72">Public subnets (one per Availability Zone)</text>
  <rect x="300" y="178" width="300" height="62" rx="6" fill="#dbe7fb" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="450" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Application Load Balancer alb-bookshelf</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#123a72">listeners 443 (production) and 8443 (test), security group sg-alb</text>
  <rect x="70" y="190" width="150" height="40" rx="6" fill="#ffffff" stroke="#5c6b7a"/>
  <text x="145" y="208" text-anchor="middle" font-size="11" fill="#333">NAT gateway</text>
  <text x="145" y="222" text-anchor="middle" font-size="10" fill="#555">only if endpoints are not used</text>
  <rect x="680" y="190" width="150" height="40" rx="6" fill="#ffffff" stroke="#5c6b7a"/>
  <text x="755" y="208" text-anchor="middle" font-size="11" fill="#333">Internet gateway route</text>
  <text x="755" y="222" text-anchor="middle" font-size="10" fill="#555">0.0.0.0/0 on the public route table</text>

  <line x1="400" y1="240" x2="260" y2="290" stroke="#1a73e8" stroke-width="1.6"/>
  <polygon points="255,292 266,284 268,296" fill="#1a73e8"/>
  <line x1="500" y1="240" x2="640" y2="290" stroke="#1a73e8" stroke-width="1.6"/>
  <polygon points="645,292 633,296 636,284" fill="#1a73e8"/>
  <text x="450" y="274" text-anchor="middle" font-size="10.5" fill="#1a5fb4">target type ip, port 8080</text>

  <!-- Private subnets -->
  <rect x="40" y="296" width="820" height="190" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="56" y="316" font-size="12" font-weight="700" fill="#1b4d1f">Private subnets (one per Availability Zone), assignPublicIp DISABLED, security group sg-tasks</text>

  <rect x="70" y="328" width="270" height="140" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="205" y="348" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4d1f">AZ a: Fargate task catalog-api</text>
  <rect x="86" y="358" width="238" height="30" rx="4" fill="#d9eedc" stroke="#2e7d32"/>
  <text x="205" y="378" text-anchor="middle" font-size="11" fill="#1b4d1f">app container :8080 + Service Connect proxy</text>
  <rect x="86" y="396" width="238" height="26" rx="4" fill="#fff9d6" stroke="#b59b00"/>
  <text x="205" y="414" text-anchor="middle" font-size="11" fill="#5c4d00">own ENI + private IP (from the subnet)</text>
  <text x="205" y="446" text-anchor="middle" font-size="10.5" fill="#444">task role and execution role attached</text>
  <text x="205" y="460" text-anchor="middle" font-size="10.5" fill="#444">reached directly by the ALB or by peers</text>

  <rect x="365" y="328" width="270" height="140" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="500" y="348" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4d1f">AZ b: Fargate task catalog-api</text>
  <rect x="381" y="358" width="238" height="30" rx="4" fill="#d9eedc" stroke="#2e7d32"/>
  <text x="500" y="378" text-anchor="middle" font-size="11" fill="#1b4d1f">app container :8080 + Service Connect proxy</text>
  <rect x="381" y="396" width="238" height="26" rx="4" fill="#fff9d6" stroke="#b59b00"/>
  <text x="500" y="414" text-anchor="middle" font-size="11" fill="#5c4d00">own ENI + private IP (from the subnet)</text>
  <text x="500" y="446" text-anchor="middle" font-size="10.5" fill="#444">orders-api calls http://catalog-api:8080</text>
  <text x="500" y="460" text-anchor="middle" font-size="10.5" fill="#444">through Service Connect, not the ALB</text>

  <rect x="660" y="328" width="180" height="140" rx="8" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.4"/>
  <text x="750" y="348" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a148c">VPC endpoints</text>
  <text x="750" y="368" text-anchor="middle" font-size="10.5" fill="#333">ecr.api, ecr.dkr (interface)</text>
  <text x="750" y="384" text-anchor="middle" font-size="10.5" fill="#333">s3 (gateway, image layers)</text>
  <text x="750" y="400" text-anchor="middle" font-size="10.5" fill="#333">logs (interface)</text>
  <text x="750" y="416" text-anchor="middle" font-size="10.5" fill="#333">secretsmanager, ssm (interface)</text>
  <text x="750" y="432" text-anchor="middle" font-size="10.5" fill="#333">ssmmessages (ECS Exec)</text>
  <text x="750" y="454" text-anchor="middle" font-size="10" fill="#555">keep traffic off the NAT gateway</text>
</svg>
