<svg viewBox="0 0 900 590" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From folders to URL to component tree</title>
  <desc id="d">The Bookshelf app folder tree on the left, with the route books slash id slash reviews highlighted. Each highlighted folder is one URL segment in the middle. On the right, the layouts and the page that render for that URL are nested inside each other: the root layout contains the books layout, which contains the reviews page.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4f91"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="590" fill="#ffffff"/>

  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One route, three views: folders, URL segments, component tree</text>
  <text x="450" y="47" font-size="12" fill="#555555" text-anchor="middle">blue = the path taken by a request for /books/2/reviews; grey = routes that are not part of this request</text>

  <!-- column titles -->
  <text x="20" y="82" font-size="14" font-weight="bold" fill="#222222">1. Folders and files in app/</text>
  <text x="372" y="82" font-size="14" font-weight="bold" fill="#222222">2. URL segments</text>
  <text x="600" y="82" font-size="14" font-weight="bold" fill="#222222">3. What React renders</text>

  <!-- folder tree panel -->
  <rect x="14" y="94" width="330" height="478" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <text x="28" y="122" fill="#333333">app/</text>
    <rect x="40" y="136" width="296" height="24" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.2"/>
    <text x="48" y="153" fill="#1d3557">layout.tsx</text>
    <text x="40" y="186" fill="#6a717a">page.tsx</text><text x="262" y="186" fill="#6a717a">/</text>
    <text x="40" y="220" fill="#6a717a">(marketing)/</text>
    <text x="58" y="254" fill="#6a717a">about/page.tsx</text><text x="262" y="254" fill="#6a717a">/about</text>
    <rect x="40" y="272" width="296" height="24" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.2"/>
    <text x="48" y="289" fill="#1d3557">books/</text>
    <rect x="58" y="306" width="278" height="24" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.2"/>
    <text x="66" y="323" fill="#1d3557">layout.tsx</text>
    <text x="58" y="356" fill="#6a717a">page.tsx</text><text x="262" y="356" fill="#6a717a">/books</text>
    <rect x="58" y="374" width="278" height="24" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.2"/>
    <text x="66" y="391" fill="#1d3557">[id]/</text>
    <text x="76" y="424" fill="#6a717a">page.tsx</text><text x="262" y="424" fill="#6a717a">/books/2</text>
    <rect x="76" y="442" width="260" height="24" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.2"/>
    <text x="84" y="459" fill="#1d3557">reviews/</text>
    <rect x="94" y="476" width="242" height="24" fill="#cfe0f5" stroke="#1d4f91" stroke-width="2"/>
    <text x="102" y="493" fill="#1d3557" font-weight="bold">page.tsx</text>
    <text x="40" y="530" font-size="11" fill="#555555" font-family="Helvetica, Arial, sans-serif">A folder without page.tsx (or route.ts) is not a URL.</text>
    <text x="40" y="546" font-size="11" fill="#555555" font-family="Helvetica, Arial, sans-serif">(marketing) is a route group: not part of the URL.</text>
  </g>

  <!-- URL segment chips -->
  <rect x="372" y="94" width="196" height="40" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="470" y="119" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">/books/2/reviews</text>

  <rect x="388" y="190" width="164" height="38" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="470" y="207" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">root segment  /</text>
  <text x="470" y="222" font-size="11" fill="#333333" text-anchor="middle">app/layout.tsx</text>

  <rect x="388" y="266" width="164" height="38" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="470" y="283" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">segment  books</text>
  <text x="470" y="298" font-size="11" fill="#333333" text-anchor="middle">books/layout.tsx</text>

  <rect x="388" y="342" width="164" height="38" fill="#e3edf9" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="470" y="359" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">dynamic segment  2</text>
  <text x="470" y="374" font-size="11" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">params = { id: "2" }</text>

  <rect x="388" y="418" width="164" height="38" fill="#cfe0f5" stroke="#1d4f91" stroke-width="2"/>
  <text x="470" y="435" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">leaf segment  reviews</text>
  <text x="470" y="450" font-size="11" fill="#333333" text-anchor="middle">reviews/page.tsx</text>

  <!-- vertical chain of chips -->
  <line x1="470" y1="134" x2="470" y2="188" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="470" y1="228" x2="470" y2="264" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="470" y1="304" x2="470" y2="340" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="470" y1="380" x2="470" y2="416" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- folder -> chip arrows -->
  <line x1="340" y1="148" x2="386" y2="200" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="340" y1="284" x2="386" y2="282" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="340" y1="386" x2="386" y2="360" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="340" y1="488" x2="386" y2="440" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- nested component tree -->
  <rect x="600" y="94" width="288" height="478" fill="#eef3fb" stroke="#1d4f91" stroke-width="2"/>
  <text x="612" y="116" font-size="13" font-weight="bold" fill="#1d3557">RootLayout</text>
  <text x="612" y="132" font-size="11" fill="#333333" font-family="Menlo, Consolas, monospace">&lt;html&gt; &lt;body&gt; header + {children}</text>

  <rect x="618" y="160" width="252" height="392" fill="#e9f5ec" stroke="#1e6b36" stroke-width="2"/>
  <text x="630" y="182" font-size="13" font-weight="bold" fill="#14411f">BooksLayout</text>
  <text x="630" y="198" font-size="11" fill="#333333">sidebar (kept) + {children}</text>

  <rect x="636" y="214" width="216" height="52" fill="#ffffff" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="648" y="236" font-size="12" font-weight="bold" fill="#14411f">MountedAt, BookNav</text>
  <text x="648" y="254" font-size="11" fill="#333333">Client Components in the layout</text>

  <rect x="636" y="290" width="216" height="104" fill="#fdf3e3" stroke="#9a5b00" stroke-width="2"/>
  <text x="648" y="314" font-size="13" font-weight="bold" fill="#5c3500">ReviewsPage</text>
  <text x="648" y="334" font-size="11" fill="#333333" font-family="Menlo, Consolas, monospace">params = { id: "2" }</text>
  <text x="648" y="354" font-size="11" fill="#333333">the leaf: the only part that is</text>
  <text x="648" y="370" font-size="11" fill="#333333">replaced when you move to a</text>
  <text x="648" y="386" font-size="11" fill="#333333">sibling route</text>

  <text x="636" y="428" font-size="11" fill="#555555">BookPage (books/[id]/page.tsx) is not</text>
  <text x="636" y="444" font-size="11" fill="#555555">rendered here: it is the leaf of</text>
  <text x="636" y="460" font-size="11" fill="#555555">/books/2, a sibling of reviews/.</text>

  <!-- chip -> component arrows -->
  <line x1="554" y1="206" x2="598" y2="150" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="554" y1="284" x2="616" y2="240" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="554" y1="440" x2="634" y2="350" stroke="#1d4f91" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
</svg>
