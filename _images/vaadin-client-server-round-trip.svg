<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <defs>
    <marker id="vcsrt-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="vcsrt-arrow-orange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Client-server round trip in Vaadin Flow</text>

  <!-- ===== Browser panel ===== -->
  <rect x="28" y="46" width="300" height="300" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="178" y="68" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Browser</text>

  <rect x="52" y="82" width="252" height="66" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="178" y="106" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;vaadin-button&gt; Web Component</text>
  <text x="178" y="124" font-size="11" fill="#1c4b73" text-anchor="middle">a real element in the page DOM</text>
  <text x="178" y="140" font-size="10.5" fill="#666666" text-anchor="middle">user clicks it</text>

  <rect x="52" y="256" width="252" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="178" y="280" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Client engine (bootstrap script)</text>
  <text x="178" y="298" font-size="11" fill="#1c4b73" text-anchor="middle">applies the JSON change list</text>
  <text x="178" y="314" font-size="11" fill="#1c4b73" text-anchor="middle">to the DOM &#8212; no page reload</text>

  <!-- ===== Server panel ===== -->
  <rect x="432" y="46" width="300" height="300" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="582" y="68" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Server &#8212; VaadinSession</text>

  <!-- session lock band -->
  <rect x="446" y="82" width="272" height="200" rx="6" fill="none" stroke="#c25a1d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="458" y="182" font-size="10.5" font-weight="bold" fill="#8a3d13" text-anchor="middle" transform="rotate(-90 458 182)">one session lock held for the whole request</text>

  <rect x="474" y="94" width="232" height="82" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="590" y="116" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Server-side component tree</text>
  <text x="590" y="134" font-size="11" fill="#1c4b73" text-anchor="middle">UI &#8594; Component &#8594; Element</text>
  <text x="590" y="150" font-size="11" fill="#1c4b73" text-anchor="middle">the authoritative state tree</text>
  <text x="590" y="167" font-size="10.5" fill="#666666" text-anchor="middle">listener runs, mutates the tree</text>

  <rect x="474" y="200" width="232" height="66" rx="6" fill="#fbf0e8" stroke="#c25a1d" stroke-width="1.5"/>
  <text x="590" y="223" font-size="12" font-weight="bold" fill="#8a3d13" text-anchor="middle">Diff against last sent state</text>
  <text x="590" y="241" font-size="11" fill="#8a3d13" text-anchor="middle">changed nodes only &#8594;</text>
  <text x="590" y="257" font-size="11" fill="#8a3d13" text-anchor="middle">JSON change list</text>

  <!-- ===== Arrows ===== -->
  <!-- event: client -> server -->
  <line x1="304" y1="104" x2="470" y2="118" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#vcsrt-arrow-orange)"/>
  <text x="386" y="86" font-size="11" font-weight="bold" fill="#8a3d13" text-anchor="middle">1. click event as RPC</text>
  <text x="386" y="100" font-size="10" fill="#8a3d13" text-anchor="middle">@Push / XHR channel, syncId</text>

  <!-- internal: tree -> diff -->
  <line x1="590" y1="176" x2="590" y2="198" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vcsrt-arrow)"/>
  <text x="590" y="192" font-size="9.5" fill="#444444" text-anchor="middle"></text>

  <!-- patch: server -> client -->
  <line x1="470" y1="240" x2="306" y2="278" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vcsrt-arrow)"/>
  <text x="388" y="250" font-size="11" font-weight="bold" fill="#2f6fa8" text-anchor="middle">2. JSON patch back</text>
  <text x="388" y="264" font-size="10" fill="#2f6fa8" text-anchor="middle">over the same channel</text>

  <!-- client engine -> web component -->
  <line x1="178" y1="256" x2="178" y2="150" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#vcsrt-arrow)"/>
  <text x="188" y="206" font-size="10" fill="#2f6fa8" text-anchor="start">3. DOM updated</text>

  <!-- captions -->
  <text x="380" y="372" font-size="12" fill="#444444" text-anchor="middle">The browser never holds application logic: every event is a message to the server, every response is a diff.</text>
  <text x="380" y="392" font-size="12" fill="#444444" text-anchor="middle">The session lock serialises request threads and UI.access() background threads onto one component tree at a time.</text>
</svg>
