<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="tfl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="tfla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="tflw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="tflg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Texture filtering: nearest, bilinear and anisotropic footprints</text>
<rect x="30" y="50" width="220" height="190" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="140" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Nearest</text>
<rect x="50" y="100" width="45" height="45" fill="#1F2937"/>
<rect x="95" y="100" width="45" height="45" fill="#6B7280"/>
<rect x="140" y="100" width="45" height="45" fill="#D1D5DB"/>
<rect x="185" y="100" width="45" height="45" fill="#6B7280"/>
<text x="140" y="170" text-anchor="middle" font-size="11" fill="#374151">blocky: one texel per sample</text>
<text x="140" y="188" text-anchor="middle" font-size="11" fill="#374151">1 fetch</text>
<text x="140" y="206" text-anchor="middle" font-size="11" fill="#374151">magnified texels visible</text>
<rect x="270" y="50" width="220" height="190" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="380" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Bilinear / trilinear</text>
<defs><linearGradient id="tflg" x1="0" x2="1"><stop offset="0" stop-color="#1F2937"/><stop offset="0.33" stop-color="#6B7280"/><stop offset="0.66" stop-color="#D1D5DB"/><stop offset="1" stop-color="#6B7280"/></linearGradient></defs>
<rect x="290" y="100" width="180" height="45" fill="url(#tflg)"/>
<text x="380" y="170" text-anchor="middle" font-size="11" fill="#374151">blends the 2 x 2 nearest texels</text>
<text x="380" y="188" text-anchor="middle" font-size="11" fill="#374151">4 fetches (8 trilinear: two mips)</text>
<text x="380" y="206" text-anchor="middle" font-size="11" fill="#374151">smooth but blurry when oblique</text>
<rect x="510" y="50" width="220" height="190" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="620" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Anisotropic (4x)</text>
<polygon points="530,130 600,130 580,100 548,100" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" transform="translate(0,0)"/>
<ellipse cx="660" cy="118" rx="52" ry="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="620.0" cy="118.0" r="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<circle cx="640.0" cy="118.0" r="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<circle cx="660.0" cy="118.0" r="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<circle cx="680.0" cy="118.0" r="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<circle cx="700.0" cy="118.0" r="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="620" y="170" text-anchor="middle" font-size="11" fill="#374151">pixel footprint is a long thin ellipse</text>
<text x="620" y="188" text-anchor="middle" font-size="11" fill="#374151">takes several trilinear taps along it</text>
<text x="620" y="206" text-anchor="middle" font-size="11" fill="#374151">cost up to 16x trilinear taps</text>
<text x="380" y="266" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Quality and cost rise from left to right</text>
<line x1="120.0" y1="278.0" x2="640.0" y2="278.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#tfl)"/>
<text x="380" y="304" text-anchor="middle" font-size="11" fill="#374151">Mip filter (between levels) and min/mag filters are separate sampler settings.</text>
<text x="380" y="336" text-anchor="middle" font-size="11" fill="#374151">Set anisotropy to 4x-16x for floors and roads seen at grazing angles; 16x is the usual ceiling.</text>
<text x="380" y="356" text-anchor="middle" font-size="11" fill="#374151">Always enable mipmaps for minification; magnification beyond level 0 only has nearest or linear.</text>
</svg>
