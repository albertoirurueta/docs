<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Layers of an API test strategy</title>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Layers of an API test strategy</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">each layer answers a different question; the wide bottom layers run most often</text>

  <rect x="190" y="62" width="340" height="50" rx="6" fill="#808080" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="84" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Smoke and end-to-end checks</text>
  <text x="360" y="102" font-size="11" fill="currentColor" text-anchor="middle">a deployed instance answers; a few critical journeys</text>

  <rect x="150" y="120" width="420" height="50" rx="6" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="142" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Consumer-driven contracts</text>
  <text x="360" y="160" font-size="11" fill="currentColor" text-anchor="middle">does the provider still satisfy what each client really uses?</text>

  <rect x="110" y="178" width="500" height="50" rx="6" fill="#808080" fill-opacity="0.26" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="200" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Schema-driven tests (Schemathesis)</text>
  <text x="360" y="218" font-size="11" fill="currentColor" text-anchor="middle">does every response obey the OpenAPI document, for generated inputs?</text>

  <rect x="70" y="236" width="580" height="50" rx="6" fill="#808080" fill-opacity="0.34" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="258" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Property-based tests (Hypothesis)</text>
  <text x="360" y="276" font-size="11" fill="currentColor" text-anchor="middle">which rule of your own domain survives thousands of generated cases?</text>

  <rect x="30" y="294" width="660" height="50" rx="6" fill="#808080" fill-opacity="0.44" stroke="currentColor" stroke-width="2"/>
  <text x="360" y="316" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Example-based tests (pytest and the test client)</text>
  <text x="360" y="334" font-size="11" fill="currentColor" text-anchor="middle">does this exact request give this exact answer? fast, readable, the regression net</text>

  <text x="360" y="372" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.85">security cases (injection payloads, missing or wrong credentials) belong in every layer, not in one</text>
</svg>
