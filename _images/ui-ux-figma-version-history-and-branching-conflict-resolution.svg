<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Resolving a conflict: main on the left, branch on the right</text>
  <rect x="20" y="50" width="190" height="290" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="34" y="74" font-size="13" font-weight="bold" fill="#374151">Conflicts</text>
  <rect x="32" y="88" width="166" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="44" y="109" font-size="11" fill="#3730A3">Button / Add to shelf</text>
  <rect x="32" y="130" width="166" height="34" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/><text x="44" y="151" font-size="11" fill="#6B7280">Book card title</text>
  <rect x="32" y="298" width="166" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="115" y="317" font-size="11" fill="#3730A3" text-anchor="middle">Resolve all  v</text>
  <rect x="230" y="50" width="240" height="290" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="350" y="74" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Main file</text>
  <rect x="290" y="100" width="120" height="40" rx="8" fill="#9CA3AF"/><text x="350" y="125" font-size="11" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <rect x="270" y="290" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="350" y="309" font-size="11" fill="#3730A3" text-anchor="middle">Pick main file</text>
  <rect x="490" y="50" width="250" height="290" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="615" y="74" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Branch</text>
  <rect x="545" y="100" width="140" height="40" rx="20" fill="#4F46E5"/><text x="615" y="125" font-size="11" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <rect x="535" y="290" width="160" height="30" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="615" y="309" font-size="11" fill="#92400E" text-anchor="middle">Pick branch</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="350" y="190">Same layer changed on both sides:</text><text x="350" y="206">grey fill, square corners on main</text><text x="615" y="190">indigo fill, round corners on branch</text><text x="615" y="206">A badge records the choice</text><text x="480" y="250">Every conflict needs a choice, then Next</text><text x="480" y="268">and Apply changes</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked against the Figma Learn update and merge articles on 2026-10-30.</text>
