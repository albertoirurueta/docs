<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One module, six permutations</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">Bookshelf compiled with GWT 2.13.1: 2 user.agent values times 3 locale values</text>

  <text x="30" y="76" font-size="12" font-weight="bold" fill="#444444">Compiler output: one JavaScript file per permutation</text>

  <text x="215" y="102" font-size="12" font-weight="bold" fill="#1a4f8b" text-anchor="middle">locale = default</text>
  <text x="345" y="102" font-size="12" font-weight="bold" fill="#1a4f8b" text-anchor="middle">locale = en</text>
  <text x="475" y="102" font-size="12" font-weight="bold" fill="#1a4f8b" text-anchor="middle">locale = es</text>
  <text x="140" y="146" font-size="12" font-weight="bold" fill="#1e6b34" text-anchor="end">user.agent = gecko1_8</text>
  <text x="140" y="206" font-size="12" font-weight="bold" fill="#1e6b34" text-anchor="end">user.agent = safari</text>

  <rect x="150" y="112" width="130" height="56" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="215" y="136" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">835F...cache.js</text>
  <text x="215" y="154" font-size="11" fill="#666666" text-anchor="middle">244,649 bytes</text>
  <rect x="280" y="112" width="130" height="56" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="345" y="136" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">FC4F...cache.js</text>
  <text x="345" y="154" font-size="11" fill="#666666" text-anchor="middle">244,639 bytes</text>
  <rect x="410" y="112" width="130" height="56" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="475" y="136" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">8507...cache.js</text>
  <text x="475" y="154" font-size="11" fill="#666666" text-anchor="middle">244,735 bytes</text>

  <rect x="150" y="172" width="130" height="56" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="215" y="196" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">AB80...cache.js</text>
  <text x="215" y="214" font-size="11" fill="#666666" text-anchor="middle">246,028 bytes</text>
  <rect x="280" y="172" width="130" height="56" fill="#fff4d6" stroke="#9a6a00" stroke-width="2.4"/>
  <text x="345" y="196" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">4DF1...cache.js</text>
  <text x="345" y="214" font-size="11" fill="#666666" text-anchor="middle">246,018 bytes</text>
  <rect x="410" y="172" width="130" height="56" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="475" y="196" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">1199...cache.js</text>
  <text x="475" y="214" font-size="11" fill="#666666" text-anchor="middle">246,103 bytes</text>

  <text x="430" y="266" font-size="11" fill="#666666" text-anchor="middle">6 files, 1,472,172 bytes on the server; a visitor downloads one of them</text>

  <rect x="620" y="112" width="200" height="116" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="720" y="134" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf.nocache.js</text>
  <text x="720" y="154" font-size="11" fill="#444444" text-anchor="middle">small bootstrap script</text>
  <text x="720" y="172" font-size="11" fill="#444444" text-anchor="middle">asks the browser for user.agent</text>
  <text x="720" y="188" font-size="11" fill="#444444" text-anchor="middle">and locale, then loads the</text>
  <text x="720" y="204" font-size="11" fill="#444444" text-anchor="middle">one matching file</text>
  <text x="720" y="220" font-size="11" fill="#444444" text-anchor="middle">(here: 4DF1)</text>
  <path d="M720 228 L720 248 L345 248 L345 234" stroke="#9a6a00" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <path d="M345 230 L340 238 M345 230 L350 238" stroke="#9a6a00" stroke-width="2" fill="none"/>

  <line x1="30" y1="280" x2="830" y2="280" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="298" font-size="12" font-weight="bold" fill="#444444">Reducing permutations (measured on the same module)</text>

  <text x="30" y="326" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">no flags</text>
  <rect x="330" y="312" width="300" height="20" fill="#1a4f8b"/>
  <text x="640" y="327" font-size="12" fill="#222222">6 permutations, 1,472,172 bytes</text>

  <text x="30" y="362" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">-setProperty user.agent=gecko1_8</text>
  <rect x="330" y="348" width="150" height="20" fill="#1a4f8b"/>
  <text x="490" y="363" font-size="12" fill="#222222">3 permutations, 734,023 bytes</text>

  <text x="30" y="398" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">-setProperty locale=en</text>
  <rect x="330" y="384" width="100" height="20" fill="#1a4f8b"/>
  <text x="440" y="399" font-size="12" fill="#222222">2 permutations, 490,657 bytes</text>

  <text x="30" y="434" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">both properties set</text>
  <rect x="330" y="420" width="50" height="20" fill="#1e6b34"/>
  <text x="390" y="435" font-size="12" fill="#222222">1 permutation, 244,639 bytes</text>

  <text x="30" y="470" font-size="12" font-family="Menlo, Consolas, monospace" fill="#222222">collapse-all-properties</text>
  <rect x="330" y="456" width="63" height="20" fill="#9a6a00"/>
  <text x="403" y="471" font-size="12" fill="#222222">1 permutation, 307,805 bytes, choices made at run time</text>

  <text x="430" y="504" font-size="11" fill="#666666" text-anchor="middle">Each bar is the total size of the *.cache.js files; bar width is proportional to that total.</text>
</svg>
