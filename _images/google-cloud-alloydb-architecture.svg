<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AlloyDB cluster bookshelf-alloy: compute above, shared storage below</text>

  <!-- clients -->
  <rect x="20" y="150" width="110" height="90" rx="8" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="75" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Clients</text>
  <text x="75" y="204" text-anchor="middle" font-size="10.5" fill="#3c4a58">catalog-api via</text>
  <text x="75" y="218" text-anchor="middle" font-size="10.5" fill="#3c4a58">Auth Proxy or</text>
  <text x="75" y="232" text-anchor="middle" font-size="10.5" fill="#3c4a58">connector</text>

  <line x1="130" y1="170" x2="196" y2="125" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="190,118 202,121 194,131" fill="#3c4a58"/>
  <line x1="130" y1="220" x2="196" y2="262" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="188,262 202,266 195,254" fill="#3c4a58"/>

  <!-- cluster frame -->
  <rect x="200" y="46" width="680" height="410" rx="12" fill="#eef4fd" stroke="#1a5fb4" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="216" y="70" font-size="13.5" font-weight="700" fill="#123a72">Cluster bookshelf-alloy (region us-central1, one PostgreSQL major version)</text>

  <!-- primary -->
  <rect x="216" y="84" width="300" height="150" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="232" y="106" font-size="13" font-weight="700" fill="#123a72">Primary instance (read and write)</text>
  <text x="232" y="122" font-size="10.5" fill="#123a72">REGIONAL: standby in another zone</text>
  <rect x="232" y="134" width="130" height="86" rx="5" fill="#d2e3fc" stroke="#1a73e8"/>
  <text x="297" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123a72">PostgreSQL</text>
  <text x="297" y="172" text-anchor="middle" font-size="10" fill="#123a72">row store, buffer</text>
  <text x="297" y="186" text-anchor="middle" font-size="10" fill="#123a72">cache, ScaNN and</text>
  <text x="297" y="200" text-anchor="middle" font-size="10" fill="#123a72">pgvector indexes</text>
  <rect x="372" y="134" width="130" height="86" rx="5" fill="#fff4d6" stroke="#b7791f"/>
  <text x="437" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b4410">Columnar engine</text>
  <text x="437" y="172" text-anchor="middle" font-size="10" fill="#6b4410">in-memory column</text>
  <text x="437" y="186" text-anchor="middle" font-size="10" fill="#6b4410">store, kept in sync,</text>
  <text x="437" y="200" text-anchor="middle" font-size="10" fill="#6b4410">auto-selected by planner</text>

  <!-- read pool -->
  <rect x="540" y="84" width="324" height="150" rx="8" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="556" y="106" font-size="13" font-weight="700" fill="#14572f">Read pool instance (read only)</text>
  <text x="556" y="122" font-size="10.5" fill="#14572f">1 to 20 nodes behind one read endpoint</text>
  <rect x="556" y="134" width="90" height="86" rx="5" fill="#d6efdd" stroke="#1e7e45"/>
  <text x="601" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#14572f">Node 1</text>
  <text x="601" y="188" text-anchor="middle" font-size="10" fill="#14572f">own caches</text>
  <rect x="656" y="134" width="90" height="86" rx="5" fill="#d6efdd" stroke="#1e7e45"/>
  <text x="701" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#14572f">Node 2</text>
  <text x="701" y="188" text-anchor="middle" font-size="10" fill="#14572f">own caches</text>
  <rect x="756" y="134" width="92" height="86" rx="5" fill="#d6efdd" stroke="#1e7e45"/>
  <text x="802" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#14572f">Node N</text>
  <text x="802" y="188" text-anchor="middle" font-size="10" fill="#14572f">own caches</text>

  <!-- arrows to storage -->
  <line x1="366" y1="236" x2="366" y2="290" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="361,288 366,300 371,288" fill="#3c4a58"/>
  <text x="376" y="266" font-size="10.5" fill="#3c4a58">WAL records only</text>
  <line x1="700" y1="300" x2="700" y2="246" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="695,248 700,236 705,248" fill="#3c4a58"/>
  <text x="710" y="274" font-size="10.5" fill="#3c4a58">pages served on demand</text>

  <!-- storage layer -->
  <rect x="216" y="304" width="648" height="136" rx="8" fill="#f3eefb" stroke="#6a3fb5" stroke-width="2"/>
  <text x="232" y="326" font-size="13" font-weight="700" fill="#3f1f7a">Intelligent regional storage layer (shared by every instance, separate from compute)</text>
  <rect x="232" y="340" width="190" height="84" rx="5" fill="#e4d9f6" stroke="#6a3fb5"/>
  <text x="327" y="362" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f1f7a">Log processing</text>
  <text x="327" y="380" text-anchor="middle" font-size="10" fill="#3f1f7a">applies WAL to blocks,</text>
  <text x="327" y="394" text-anchor="middle" font-size="10" fill="#3f1f7a">materialises pages</text>
  <text x="327" y="408" text-anchor="middle" font-size="10" fill="#3f1f7a">in the background</text>
  <rect x="436" y="340" width="190" height="84" rx="5" fill="#e4d9f6" stroke="#6a3fb5"/>
  <text x="531" y="362" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f1f7a">Block storage</text>
  <text x="531" y="380" text-anchor="middle" font-size="10" fill="#3f1f7a">replicated across zones,</text>
  <text x="531" y="394" text-anchor="middle" font-size="10" fill="#3f1f7a">grows automatically,</text>
  <text x="531" y="408" text-anchor="middle" font-size="10" fill="#3f1f7a">billed for use</text>
  <rect x="640" y="340" width="210" height="84" rx="5" fill="#e4d9f6" stroke="#6a3fb5"/>
  <text x="745" y="362" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f1f7a">Backups and PITR</text>
  <text x="745" y="380" text-anchor="middle" font-size="10" fill="#3f1f7a">automated, on-demand,</text>
  <text x="745" y="394" text-anchor="middle" font-size="10" fill="#3f1f7a">continuous (WAL archive)</text>
  <text x="745" y="408" text-anchor="middle" font-size="10" fill="#3f1f7a">no impact on compute</text>
</svg>
