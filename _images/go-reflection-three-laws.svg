<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The three laws of reflection</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">reflection moves between an interface value and a reflection object; only an addressable Value can be changed</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker>
  </defs>

  <!-- left box: interface value -->
  <rect x="40" y="90" width="260" height="130" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="170" y="116" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">interface value (any)</text>
  <rect x="62" y="134" width="100" height="34" fill="#ffffff" stroke="#1c4b73"/>
  <text x="112" y="156" font-size="12" fill="#222222" text-anchor="middle">type word</text>
  <rect x="178" y="134" width="100" height="34" fill="#ffffff" stroke="#1c4b73"/>
  <text x="228" y="156" font-size="12" fill="#222222" text-anchor="middle">data word</text>
  <text x="170" y="196" font-size="12" fill="#444444" text-anchor="middle">dynamic type and value of x</text>

  <!-- right box: reflect objects -->
  <rect x="640" y="90" width="260" height="130" rx="8" fill="#eef7f1" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="770" y="116" font-size="14" font-weight="bold" fill="#2f7d4f" text-anchor="middle">reflection objects</text>
  <rect x="662" y="134" width="100" height="34" fill="#ffffff" stroke="#2f7d4f"/>
  <text x="712" y="156" font-size="12" fill="#222222" text-anchor="middle">reflect.Type</text>
  <rect x="778" y="134" width="100" height="34" fill="#ffffff" stroke="#2f7d4f"/>
  <text x="828" y="156" font-size="12" fill="#222222" text-anchor="middle">reflect.Value</text>
  <text x="770" y="196" font-size="12" fill="#444444" text-anchor="middle">Kind, fields, methods, Set*</text>

  <!-- law 1 -->
  <line x1="304" y1="130" x2="636" y2="130" stroke="#1c4b73" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="122" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">law 1: TypeOf / ValueOf</text>
  <text x="470" y="148" font-size="11" fill="#444444" text-anchor="middle">reflection goes from interface value to reflection object</text>

  <!-- law 2 -->
  <line x1="636" y1="190" x2="304" y2="190" stroke="#2f7d4f" stroke-width="2" marker-end="url(#g)"/>
  <text x="470" y="182" font-size="13" font-weight="bold" fill="#2f7d4f" text-anchor="middle">law 2: v.Interface() / TypeAssert</text>
  <text x="470" y="208" font-size="11" fill="#444444" text-anchor="middle">and back from reflection object to interface value</text>

  <!-- law 3 -->
  <rect x="640" y="268" width="260" height="110" rx="8" fill="#fbeeeb" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="770" y="294" font-size="14" font-weight="bold" fill="#b23a2a" text-anchor="middle">settable reflect.Value</text>
  <text x="770" y="318" font-size="12" fill="#222222" text-anchor="middle">CanSet() is true only if the Value is</text>
  <text x="770" y="336" font-size="12" fill="#222222" text-anchor="middle">addressable and not from an</text>
  <text x="770" y="354" font-size="12" fill="#222222" text-anchor="middle">unexported field</text>
  <line x1="800" y1="170" x2="800" y2="262" stroke="#b23a2a" stroke-width="2" marker-end="url(#r)"/>
  <text x="808" y="236" font-size="12" font-weight="bold" fill="#b23a2a">Elem()</text>

  <rect x="40" y="268" width="560" height="110" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="60" y="294" font-size="13" font-weight="bold" fill="#222222">law 3: to modify a reflection object, its value must be settable</text>
  <text x="60" y="320" font-size="12" fill="#444444">reflect.ValueOf(n): copy of n inside an interface: not addressable, Set panics</text>
  <text x="60" y="342" font-size="12" fill="#444444">reflect.ValueOf(&amp;n): pointer value: not settable itself</text>
  <text x="60" y="364" font-size="12" fill="#444444">reflect.ValueOf(&amp;n).Elem(): the variable n: addressable and settable</text>
</svg>
