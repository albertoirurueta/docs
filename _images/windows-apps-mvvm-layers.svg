<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">MVVM layers in Bookshelf Desktop</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Dependencies point downwards only. Binding, commands and notifications carry the traffic upwards and downwards.</text>

  <!-- View -->
  <rect x="40" y="70" width="440" height="100" rx="8" fill="#e6effa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="60" y="95" font-size="15" font-weight="bold" fill="#1c4b73">View</text>
  <text x="60" y="117" font-size="12" fill="#1c4b73">XAML: MainWindow, BooksView, DataTemplates, styles</text>
  <text x="60" y="135" font-size="12" fill="#1c4b73">Layout, appearance, animations, input gestures</text>
  <text x="60" y="153" font-size="12" fill="#1c4b73">Thin code-behind: UI-only logic (focus, scrolling, window chrome)</text>

  <!-- ViewModel -->
  <rect x="40" y="200" width="440" height="110" rx="8" fill="#e3f2e4" stroke="#2d6a34" stroke-width="1.5"/>
  <text x="60" y="225" font-size="15" font-weight="bold" fill="#2d6a34">ViewModel</text>
  <text x="60" y="247" font-size="12" fill="#2d6a34">BooksViewModel, BookViewModel, BookEditorViewModel</text>
  <text x="60" y="265" font-size="12" fill="#2d6a34">State for the screen: Books, SelectedBook, SearchText, StatusMessage</text>
  <text x="60" y="283" font-size="12" fill="#2d6a34">Commands: Load, AddBook, EditSelected, DeleteSelected</text>
  <text x="60" y="301" font-size="12" fill="#2d6a34">No reference to any control, window or Dispatcher type</text>

  <!-- Model -->
  <rect x="40" y="340" width="440" height="100" rx="8" fill="#fdf0e0" stroke="#8a5200" stroke-width="1.5"/>
  <text x="60" y="365" font-size="15" font-weight="bold" fill="#8a5200">Model</text>
  <text x="60" y="387" font-size="12" fill="#8a5200">Book record, validation rules, domain logic</text>
  <text x="60" y="405" font-size="12" fill="#8a5200">IBookRepository and its EF Core + SQLite implementation</text>
  <text x="60" y="423" font-size="12" fill="#8a5200">Knows nothing about the view model or the view</text>

  <!-- vertical dependency arrows -->
  <line x1="260" y1="170" x2="260" y2="198" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="310" x2="260" y2="338" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="188" font-size="11" fill="#444444">DataContext</text>
  <text x="270" y="328" font-size="11" fill="#444444">calls, awaits</text>

  <!-- Glue -->
  <rect x="520" y="70" width="200" height="240" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="95" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">The glue</text>
  <text x="620" y="120" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Data binding</text>
  <text x="620" y="136" font-size="11" fill="#333333" text-anchor="middle">Binding, DataContext</text>
  <text x="620" y="164" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Commands</text>
  <text x="620" y="180" font-size="11" fill="#333333" text-anchor="middle">ICommand, CanExecute</text>
  <text x="620" y="208" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Change notifications</text>
  <text x="620" y="224" font-size="11" fill="#333333" text-anchor="middle">INotifyPropertyChanged</text>
  <text x="620" y="240" font-size="11" fill="#333333" text-anchor="middle">INotifyCollectionChanged</text>
  <text x="620" y="268" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Behaviors</text>
  <text x="620" y="284" font-size="11" fill="#333333" text-anchor="middle">Event to command</text>
  <line x1="482" y1="120" x2="518" y2="120" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="482" y1="255" x2="518" y2="255" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Services -->
  <rect x="520" y="340" width="200" height="100" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
  <text x="620" y="365" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Services (interfaces)</text>
  <text x="620" y="388" font-size="11" fill="#333333" text-anchor="middle">IDialogService, INavigationService</text>
  <text x="620" y="405" font-size="11" fill="#333333" text-anchor="middle">Implemented in the UI project</text>
  <text x="620" y="422" font-size="11" fill="#333333" text-anchor="middle">Injected into view models</text>
  <line x1="480" y1="270" x2="520" y2="370" stroke="#444444" stroke-width="1.3" marker-end="url(#arr)"/>

  <text x="380" y="472" font-size="12" fill="#666666" text-anchor="middle">The view knows the view model through bindings only. The view model knows the model and service interfaces, never the view.</text>
</svg>
