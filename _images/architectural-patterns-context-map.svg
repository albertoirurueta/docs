<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Context map of the running e-commerce domain</text>

  <defs>
    <marker id="cm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="cm-arrow-acl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7a3b8f"/>
    </marker>
  </defs>

  <!-- Order: core domain, center -->
  <rect x="300" y="195" width="180" height="70" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="390" y="222" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Order</text>
  <text x="390" y="238" font-size="10" fill="#333333" text-anchor="middle">core domain</text>
  <text x="390" y="252" font-size="9" fill="#666666" text-anchor="middle">owns Order aggregate + DB</text>

  <!-- Inventory: supporting, top right -->
  <rect x="560" y="60" width="180" height="64" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="650" y="86" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Inventory</text>
  <text x="650" y="102" font-size="10" fill="#333333" text-anchor="middle">supporting subdomain</text>
  <text x="650" y="115" font-size="9" fill="#666666" text-anchor="middle">stock reservation</text>

  <!-- Payment: supporting, right -->
  <rect x="580" y="200" width="180" height="64" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="670" y="226" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Payment</text>
  <text x="670" y="242" font-size="10" fill="#333333" text-anchor="middle">supporting subdomain</text>
  <text x="670" y="255" font-size="9" fill="#666666" text-anchor="middle">authorization</text>

  <!-- Shipping: supporting, bottom right -->
  <rect x="560" y="340" width="180" height="64" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="650" y="366" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Shipping</text>
  <text x="650" y="382" font-size="10" fill="#333333" text-anchor="middle">supporting subdomain</text>
  <text x="650" y="395" font-size="9" fill="#666666" text-anchor="middle">scheduling</text>

  <!-- Customer: generic subdomain, not implemented, bottom left -->
  <rect x="40" y="330" width="200" height="74" rx="8" fill="#f5f5f5" stroke="#7a3b8f" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="140" y="356" font-size="13" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Customer</text>
  <text x="140" y="372" font-size="10" fill="#333333" text-anchor="middle">generic subdomain</text>
  <text x="140" y="385" font-size="9" fill="#666666" text-anchor="middle">not implemented --</text>
  <text x="140" y="397" font-size="9" fill="#666666" text-anchor="middle">referenced by CustomerId only</text>

  <!-- relationships: Order (customer) -> Inventory/Payment/Shipping (suppliers) -->
  <line x1="470" y1="215" x2="576" y2="120" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#cm-arrow)"/>
  <text x="545" y="165" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(-30 545 165)">customer/supplier</text>

  <line x1="480" y1="232" x2="578" y2="232" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#cm-arrow)"/>
  <text x="530" y="224" font-size="9.5" fill="#1c4b73" text-anchor="middle">customer/supplier</text>

  <line x1="465" y1="255" x2="576" y2="345" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#cm-arrow)"/>
  <text x="540" y="310" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(28 540 310)">customer/supplier</text>

  <!-- relationship: Order -> Customer, ACL, dashed -->
  <line x1="300" y1="250" x2="245" y2="345" stroke="#7a3b8f" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#cm-arrow-acl)"/>
  <text x="245" y="295" font-size="9.5" fill="#7a3b8f" text-anchor="middle" transform="rotate(65 245 295)">anticorruption layer</text>

  <text x="390" y="440" font-size="10.5" fill="#444444" text-anchor="middle">Order drives the Place Order Saga as customer of Inventory, Payment and Shipping; Customer is only ever</text>
  <text x="390" y="454" font-size="10.5" fill="#444444" text-anchor="middle">referenced through an anticorruption-layer translation into CustomerId, never modeled as its own aggregate.</text>
</svg>
