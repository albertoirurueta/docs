<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">AGameMode match states</text>
<rect x="20" y="70" width="120" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">EnteringMap</text>
<rect x="165" y="70" width="130" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="230.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">WaitingToStart</text>
<rect x="330" y="70" width="120" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="390.0" y="99.2" text-anchor="middle" font-size="12" fill="#047857">InProgress</text>
<rect x="470" y="70" width="140" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="540.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">WaitingPostMatch</text>
<rect x="625" y="70" width="120" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="685.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">LeavingMap</text>
<line x1="140" y1="95" x2="165" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<line x1="295" y1="95" x2="330" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<line x1="450" y1="95" x2="470" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<line x1="610" y1="95" x2="625" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<path d="M685,120 L685,150 L80,150 L80,124" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<text x="230" y="168" text-anchor="middle" font-size="11" fill="#374151">next map loads, the cycle repeats</text>
<text x="230" y="62" text-anchor="middle" font-size="11" fill="#374151">ReadyToStartMatch or StartMatch</text>
<text x="460" y="62" text-anchor="middle" font-size="11" fill="#374151">ReadyToEndMatch or EndMatch</text>
<rect x="330" y="205" width="120" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390.0" y="231.2" text-anchor="middle" font-size="12" fill="#92400E">Aborted</text>
<path d="M390,120 L390,205" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#c3)"/>
<text x="400" y="190" text-anchor="start" font-size="11" fill="#92400E">AbortMatch after an unrecoverable error</text>
<text x="20" y="285" text-anchor="start" font-size="11" fill="#374151">Actors do not tick in EnteringMap. Players have not spawned in WaitingToStart.</text>
<text x="20" y="300" text-anchor="start" font-size="11" fill="#374151">BeginPlay is called on all actors when InProgress starts.</text>
<text x="20" y="315" text-anchor="start" font-size="11" fill="#374151">AGameModeBase has none of these states.</text>
</svg>
