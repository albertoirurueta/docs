<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Joomla release timeline: development, bugfix and security windows of the 4.x, 5.x, 6.x and 7.x series</title>
<desc id="d">Horizontal bars from 2022 to 2032. Each series has a development phase up to its x.4.0 bridge release, one year of bugfixes, then one year of security-only fixes. The 7.x bars are projections.</desc>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Joomla series lifecycle (dashed = projection)</text>
<line x1="100" y1="60" x2="100" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="100" y="318" text-anchor="middle" font-size="12" fill="#333333">2022</text>
<line x1="170" y1="60" x2="170" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="170" y="318" text-anchor="middle" font-size="12" fill="#333333">2023</text>
<line x1="240" y1="60" x2="240" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="240" y="318" text-anchor="middle" font-size="12" fill="#333333">2024</text>
<line x1="310" y1="60" x2="310" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="310" y="318" text-anchor="middle" font-size="12" fill="#333333">2025</text>
<line x1="380" y1="60" x2="380" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="380" y="318" text-anchor="middle" font-size="12" fill="#333333">2026</text>
<line x1="450" y1="60" x2="450" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="450" y="318" text-anchor="middle" font-size="12" fill="#333333">2027</text>
<line x1="520" y1="60" x2="520" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="520" y="318" text-anchor="middle" font-size="12" fill="#333333">2028</text>
<line x1="590" y1="60" x2="590" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="590" y="318" text-anchor="middle" font-size="12" fill="#333333">2029</text>
<line x1="660" y1="60" x2="660" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="660" y="318" text-anchor="middle" font-size="12" fill="#333333">2030</text>
<line x1="730" y1="60" x2="730" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="730" y="318" text-anchor="middle" font-size="12" fill="#333333">2031</text>
<line x1="800" y1="60" x2="800" y2="300" stroke="#d0d0d0" stroke-width="1"/>
<text x="800" y="318" text-anchor="middle" font-size="12" fill="#333333">2032</text>
<text x="30" y="104" font-size="16" font-weight="bold" fill="#1a1a1a">4.x</text>
<rect x="145.5" y="80" width="79.8" height="34" fill="#bcd4ee" stroke="#444444" stroke-width="1"/>
<rect x="225.3" y="80" width="70.0" height="34" fill="#8fcf9f" stroke="#444444" stroke-width="1"/>
<rect x="295.3" y="80" width="70.0" height="34" fill="#f2c777" stroke="#444444" stroke-width="1"/>
<text x="225.3" y="132" text-anchor="middle" font-size="11" fill="#333333">4.4.0</text>
<text x="30" y="159" font-size="16" font-weight="bold" fill="#1a1a1a">5.x</text>
<rect x="225.3" y="135" width="140.0" height="34" fill="#bcd4ee" stroke="#444444" stroke-width="1"/>
<rect x="365.3" y="135" width="70.0" height="34" fill="#8fcf9f" stroke="#444444" stroke-width="1"/>
<rect x="435.3" y="135" width="70.0" height="34" fill="#f2c777" stroke="#444444" stroke-width="1"/>
<text x="365.3" y="187" text-anchor="middle" font-size="11" fill="#333333">5.4.0</text>
<text x="30" y="214" font-size="16" font-weight="bold" fill="#1a1a1a">6.x</text>
<rect x="365.3" y="190" width="140.0" height="34" fill="#bcd4ee" stroke="#444444" stroke-width="1"/>
<rect x="505.3" y="190" width="70.0" height="34" fill="#8fcf9f" stroke="#444444" stroke-width="1"/>
<rect x="575.3" y="190" width="70.0" height="34" fill="#f2c777" stroke="#444444" stroke-width="1"/>
<text x="505.3" y="242" text-anchor="middle" font-size="11" fill="#333333">6.4.0</text>
<text x="30" y="269" font-size="16" font-weight="bold" fill="#1a1a1a">7.x</text>
<rect x="505.3" y="245" width="140.0" height="34" fill="#bcd4ee" stroke="#444444" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="645.3" y="245" width="70.0" height="34" fill="#8fcf9f" stroke="#444444" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="715.3" y="245" width="70.0" height="34" fill="#f2c777" stroke="#444444" stroke-width="1" stroke-dasharray="5 3"/>
<text x="645.3" y="297" text-anchor="middle" font-size="11" fill="#333333">7.4.0</text>
<line x1="438.1" y1="62" x2="438.1" y2="300" stroke="#b3261e" stroke-width="2"/>
<text x="442.1" y="72" font-size="12" fill="#b3261e">today (2026-10-30)</text>
<rect x="120" y="345" width="16" height="16" fill="#bcd4ee" stroke="#444444"/>
<text x="142" y="358" font-size="12" fill="#1a1a1a">Development (minors 0 to 3 and bridge)</text>
<rect x="430" y="345" width="16" height="16" fill="#8fcf9f" stroke="#444444"/>
<text x="452" y="358" font-size="12" fill="#1a1a1a">Bugfixes (1 year after x.4.0)</text>
<rect x="680" y="345" width="16" height="16" fill="#f2c777" stroke="#444444"/>
<text x="702" y="358" font-size="12" fill="#1a1a1a">Security only (2nd year)</text>
</svg>