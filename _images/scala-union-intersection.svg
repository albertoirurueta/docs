<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Union and intersection types as sets of values</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">The left circle is the set of Waterproof values, the right circle the set of Insulated values</text>
<text x="240" y="85" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Waterproof | Insulated</text>
<text x="720" y="85" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Waterproof &amp; Insulated</text>
<g>
<circle cx="190" cy="215" r="90" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.8"/>
<circle cx="290" cy="215" r="90" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.8"/>
<text x="150" y="220" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Waterproof</text>
<text x="330" y="220" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Insulated</text>
<text x="240" y="220" font-size="13" fill="#1c4b73" text-anchor="middle">both</text>
</g>
<text x="240" y="335" font-size="12" fill="#222222" text-anchor="middle">every value in either circle: only members common to both</text>
<text x="240" y="352" font-size="12" fill="#222222" text-anchor="middle">are usable without a match (here none)</text>
<g>
<circle cx="670" cy="215" r="90" fill="#ffffff" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="770" cy="215" r="90" fill="#ffffff" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M720,140.2 A90,90 0 0 1 720,289.8 A90,90 0 0 1 720,140.2 Z" fill="#fff4e0" stroke="#a35a00" stroke-width="2"/>
<text x="640" y="220" font-size="13" fill="#1c4b73" text-anchor="middle">only</text>
<text x="640" y="237" font-size="13" fill="#1c4b73" text-anchor="middle">Waterproof</text>
<text x="800" y="220" font-size="13" fill="#1c4b73" text-anchor="middle">only</text>
<text x="800" y="237" font-size="13" fill="#1c4b73" text-anchor="middle">Insulated</text>
<text x="720" y="220" font-size="13" font-weight="bold" fill="#a35a00" text-anchor="middle">both</text>
</g>
<text x="720" y="335" font-size="12" fill="#222222" text-anchor="middle">only the overlap: members of both types</text>
<text x="720" y="352" font-size="12" fill="#222222" text-anchor="middle">(rating and warmth) are available</text>
</svg>
