<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Additional checkout field locations and where their values are stored</title>
  <desc id="d">The Checkout block has three locations for additional fields. The contact location sits beside the email field and its value is stored under the key prefix _wc_other on the customer and the order. The address location appears inside both the shipping and the billing address forms, so one registered field produces two values stored under _wc_shipping and _wc_billing on the customer and the order. The order location renders in the Order information block, by default the last step, and its value is stored under _wc_other on the order only.</desc>
  <rect x="0" y="0" width="980" height="580" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Three locations, three storage rules</text>
  <text x="40" y="58" font-size="13" font-weight="bold" fill="#c9d3dc">Checkout block (what the shopper sees)</text>
  <text x="620" y="58" font-size="13" font-weight="bold" fill="#c9d3dc">Meta keys written when the order is placed</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="70" width="560" height="100" rx="10" fill="#33485c" stroke="#f2f5f8"/>
    <text x="36" y="92" font-weight="bold" font-size="14">location: contact</text>
    <rect x="36" y="106" width="250" height="48" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="48" y="127" font-weight="bold">email</text>
    <text x="48" y="144" font-size="11">core field, always shown</text>
    <rect x="304" y="106" width="260" height="48" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="316" y="127" font-weight="bold">pocket-coffee/newsletter</text>
    <text x="316" y="144" font-size="11">checkbox, one value</text>

    <rect x="20" y="190" width="560" height="170" rx="10" fill="#33485c" stroke="#f2f5f8"/>
    <text x="36" y="212" font-weight="bold" font-size="14">location: address (both address forms)</text>
    <rect x="36" y="226" width="250" height="120" rx="8" fill="#3d5266" stroke="#f2f5f8"/>
    <text x="48" y="246" font-weight="bold">Shipping address</text>
    <text x="48" y="264" font-size="11">first name, address, city, postcode...</text>
    <rect x="48" y="282" width="226" height="48" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="60" y="303" font-weight="bold">pocket-coffee/tax-id</text>
    <text x="60" y="320" font-size="11">text, value no. 1</text>
    <rect x="304" y="226" width="260" height="120" rx="8" fill="#3d5266" stroke="#f2f5f8"/>
    <text x="316" y="246" font-weight="bold">Billing address</text>
    <text x="316" y="264" font-size="11">same core fields plus email, phone</text>
    <rect x="316" y="282" width="236" height="48" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="328" y="303" font-weight="bold">pocket-coffee/tax-id</text>
    <text x="328" y="320" font-size="11">text, value no. 2</text>

    <rect x="20" y="380" width="560" height="180" rx="10" fill="#33485c" stroke="#f2f5f8"/>
    <text x="36" y="402" font-weight="bold" font-size="14">location: order (Order information block)</text>
    <rect x="36" y="416" width="250" height="44" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="48" y="436" font-weight="bold">pocket-coffee/gift-message</text>
    <text x="48" y="452" font-size="11">text with sanitize and validate callbacks</text>
    <rect x="304" y="416" width="260" height="44" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="316" y="436" font-weight="bold">pocket-coffee/heard-from</text>
    <text x="316" y="452" font-size="11">select with a placeholder</text>
    <rect x="36" y="472" width="250" height="44" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="48" y="492" font-weight="bold">pocket-coffee/delivery-date</text>
    <text x="48" y="508" font-size="11">date, min P1D, max P30D</text>
    <rect x="304" y="472" width="260" height="44" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="316" y="492" font-weight="bold">pocket-coffee/club-number</text>
    <text x="316" y="508" font-size="11">required only with the coffeeclub coupon</text>
    <text x="36" y="540" font-size="11" fill="#c9d3dc">Last step by default; movable with the block editor controls.</text>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <rect x="620" y="70" width="340" height="100" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="634" y="92" font-weight="bold">Customer account and order</text>
    <text x="634" y="112" font-family="Menlo, Consolas, monospace" font-size="11">_wc_other/pocket-coffee/newsletter</text>
    <text x="634" y="134" font-size="11">One value per field. Shown and editable in</text>
    <text x="634" y="150" font-size="11">My Account, Account details.</text>

    <rect x="620" y="190" width="340" height="170" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="634" y="212" font-weight="bold">Customer and order, two values</text>
    <text x="634" y="234" font-family="Menlo, Consolas, monospace" font-size="11">_wc_shipping/pocket-coffee/tax-id</text>
    <text x="634" y="252" font-family="Menlo, Consolas, monospace" font-size="11">_wc_billing/pocket-coffee/tax-id</text>
    <text x="634" y="278" font-size="11">Never one value for both forms: with "use</text>
    <text x="634" y="294" font-size="11">same address for billing" the two values are</text>
    <text x="634" y="310" font-size="11">equal but still saved independently.</text>
    <text x="634" y="334" font-size="11">Returning customers are pre-filled.</text>

    <rect x="620" y="380" width="340" height="180" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="634" y="402" font-weight="bold">Order only</text>
    <text x="634" y="424" font-family="Menlo, Consolas, monospace" font-size="11">_wc_other/pocket-coffee/gift-message</text>
    <text x="634" y="442" font-family="Menlo, Consolas, monospace" font-size="11">_wc_other/pocket-coffee/heard-from</text>
    <text x="634" y="460" font-family="Menlo, Consolas, monospace" font-size="11">_wc_other/pocket-coffee/delivery-date</text>
    <text x="634" y="478" font-family="Menlo, Consolas, monospace" font-size="11">_wc_other/pocket-coffee/club-number</text>
    <text x="634" y="504" font-size="11">Not part of the saved address or account.</text>
    <text x="634" y="520" font-size="11">A new order starts empty.</text>
    <text x="634" y="544" font-size="11" fill="#c9d3dc">Contact and order share the _wc_other prefix.</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M580 120 H 618"/>
    <path d="M580 275 H 618"/>
    <path d="M580 470 H 618"/>
  </g>
</svg>
