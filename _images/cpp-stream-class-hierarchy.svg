<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <defs>
    <marker id="sharrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="270" y="10" width="160" height="34" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="350" y="31" text-anchor="middle" font-size="12" fill="#333">ios_base</text>
  <line x1="350" y1="44" x2="350" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#sharrow)"/>

  <rect x="270" y="70" width="160" height="34" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="350" y="91" text-anchor="middle" font-size="12" fill="#333">basic_ios&lt;charT&gt;</text>

  <line x1="320" y1="104" x2="150" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#sharrow)"/>
  <line x1="380" y1="104" x2="550" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#sharrow)"/>

  <rect x="60" y="145" width="180" height="34" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#1c4b73">basic_istream</text>

  <rect x="460" y="145" width="180" height="34" rx="6" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="550" y="166" text-anchor="middle" font-size="12" fill="#2a6636">basic_ostream</text>

  <line x1="220" y1="179" x2="300" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#sharrow)"/>
  <line x1="480" y1="179" x2="400" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#sharrow)"/>

  <rect x="260" y="220" width="180" height="34" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="350" y="241" text-anchor="middle" font-size="12" fill="#6b4207">basic_iostream</text>

  <!-- leaves: file/string/span streams under both istream and ostream families -->
  <text x="150" y="205" text-anchor="middle" font-size="10" fill="#555">cin, ifstream,</text>
  <text x="150" y="217" text-anchor="middle" font-size="10" fill="#555">istringstream,</text>
  <text x="150" y="229" text-anchor="middle" font-size="10" fill="#555">ispanstream</text>

  <text x="550" y="205" text-anchor="middle" font-size="10" fill="#555">cout, ofstream,</text>
  <text x="550" y="217" text-anchor="middle" font-size="10" fill="#555">ostringstream,</text>
  <text x="550" y="229" text-anchor="middle" font-size="10" fill="#555">ospanstream</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="#555">fstream, stringstream, spanstream</text>
  <text x="350" y="304" text-anchor="middle" font-size="11" fill="#555">(read+write) derive from basic_iostream</text>

  <text x="350" y="335" text-anchor="middle" font-size="12" fill="#333">Same interface regardless of backing medium -- code written against</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#333">basic_istream/basic_ostream works unchanged for files, strings, or spans.</text>
</svg>
