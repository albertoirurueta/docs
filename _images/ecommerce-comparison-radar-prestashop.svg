<text class="footer" x="24" y="580" text-anchor="start"><tspan x="24" dy="0">Source: editorial scores with their basis in radar-scores.csv; performance from the HTTP Archive Tech Report; ecosystem from</tspan><tspan x="24" dy="15">Store Leads, Stack Exchange and GitHub; retrieved 2026-10-27. Scores summarise the evidence and are not a benchmark. Raw data:</tspan><tspan x="24" dy="15">scripts/ecommerce-comparison-charts/data/radar-scores.csv. See the Bibliography for the sources.</tspan></text>
