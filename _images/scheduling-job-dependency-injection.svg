<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A job gets its dependencies twice on every firing: at creation and at execution</text>
  <defs>
    <marker id="jdi-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="jdi-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d4f"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="20" y="56" width="200" height="140" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="34" y="80" font-size="13" font-weight="bold" fill="#1c4b73">1  The trigger fires</text>
  <text x="34" y="104" font-size="11.5" fill="#333333">A worker thread receives a</text>
  <text x="34" y="120" font-size="11.5" fill="#333333">TriggerFiredBundle: the</text>
  <text x="34" y="136" font-size="11.5" fill="#333333">JobDetail, the Trigger and</text>
  <text x="34" y="152" font-size="11.5" fill="#333333">their two JobDataMaps.</text>
  <text x="34" y="178" font-size="10.5" fill="#666666">no job object exists yet</text>
  <line x1="220" y1="126" x2="238" y2="126" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#jdi-arrow)"/>

  <!-- step 2 -->
  <rect x="240" y="56" width="200" height="140" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="254" y="80" font-size="13" font-weight="bold" fill="#1c4b73">2  SpringBeanJobFactory</text>
  <text x="254" y="104" font-size="11.5" fill="#333333">createBean(jobClass) on the</text>
  <text x="254" y="120" font-size="11.5" fill="#333333">ApplicationContext:</text>
  <text x="254" y="136" font-size="11.5" fill="#333333">constructor injection and</text>
  <text x="254" y="152" font-size="11.5" fill="#333333">@Autowired fields/setters.</text>
  <text x="254" y="178" font-size="10.5" fill="#b03030">a NEW instance every firing</text>
  <line x1="440" y1="126" x2="458" y2="126" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#jdi-arrow)"/>

  <!-- step 3 -->
  <rect x="460" y="56" width="200" height="140" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="474" y="80" font-size="13" font-weight="bold" fill="#1c4b73">3  QuartzJobBean.execute</text>
  <text x="474" y="104" font-size="11.5" fill="#333333">Binds the SchedulerContext</text>
  <text x="474" y="120" font-size="11.5" fill="#333333">and the merged JobDataMap</text>
  <text x="474" y="136" font-size="11.5" fill="#333333">to setters by name, for</text>
  <text x="474" y="152" font-size="11.5" fill="#333333">example setMaxReminders.</text>
  <text x="474" y="178" font-size="10.5" fill="#b03030">unknown keys are ignored</text>
  <line x1="660" y1="126" x2="678" y2="126" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#jdi-arrow)"/>

  <!-- step 4 -->
  <rect x="680" y="56" width="200" height="140" rx="8" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="694" y="80" font-size="13" font-weight="bold" fill="#2e7d4f">4  executeInternal</text>
  <text x="694" y="104" font-size="11.5" fill="#333333">Your code runs with its</text>
  <text x="694" y="120" font-size="11.5" fill="#333333">services and its settings</text>
  <text x="694" y="136" font-size="11.5" fill="#333333">already in place, then the</text>
  <text x="694" y="152" font-size="11.5" fill="#333333">instance is discarded.</text>

  <!-- ApplicationContext source for step 2 -->
  <rect x="240" y="256" width="200" height="86" rx="8" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="340" y="280" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">ApplicationContext</text>
  <text x="340" y="302" font-size="11" fill="#444444" text-anchor="middle">OverdueLoanService</text>
  <text x="340" y="318" font-size="11" fill="#444444" text-anchor="middle">Clock, repositories ...</text>
  <text x="340" y="334" font-size="10.5" fill="#666666" text-anchor="middle">regular Spring beans</text>
  <line x1="340" y1="256" x2="340" y2="198" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#jdi-arrow-green)"/>

  <!-- the three maps feeding step 3 -->
  <rect x="470" y="236" width="180" height="40" rx="6" fill="#fdf3e1" stroke="#b9770e" stroke-width="1.4"/>
  <text x="560" y="253" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Trigger JobDataMap</text>
  <text x="560" y="268" font-size="10.5" fill="#444444" text-anchor="middle">strongest: wins ties</text>
  <rect x="470" y="282" width="180" height="40" rx="6" fill="#fdf3e1" stroke="#b9770e" stroke-width="1.4"/>
  <text x="560" y="299" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">JobDetail JobDataMap</text>
  <text x="560" y="314" font-size="10.5" fill="#444444" text-anchor="middle">maxReminders = 100</text>
  <rect x="470" y="328" width="180" height="40" rx="6" fill="#fdf3e1" stroke="#b9770e" stroke-width="1.4"/>
  <text x="560" y="345" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">SchedulerContext</text>
  <text x="560" y="360" font-size="10.5" fill="#444444" text-anchor="middle">weakest: scheduler-wide</text>
  <line x1="560" y1="234" x2="560" y2="198" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#jdi-arrow)"/>
  <text x="664" y="262" font-size="10.5" fill="#666666">applied from the bottom up,</text>
  <text x="664" y="277" font-size="10.5" fill="#666666">a later value replaces</text>
  <text x="664" y="292" font-size="10.5" fill="#666666">an earlier one</text>
  <text x="664" y="344" font-size="10.5" fill="#666666">measured result:</text>
  <text x="664" y="359" font-size="10.5" fill="#666666">1, 2 and 3 give 3</text>

  <!-- notes -->
  <text x="20" y="408" font-size="12" font-weight="bold" fill="#222222">What this means in code</text>
  <text x="20" y="429" font-size="11.5" fill="#333333">Services: take them in the constructor (or an @Autowired field or setter). A setter without @Autowired is never called with a bean.</text>
  <text x="20" y="447" font-size="11.5" fill="#333333">Settings: put Strings and primitives in the JobDataMap and give the job a setter with the same name. A misspelled key is silently dropped.</text>
  <text x="20" y="465" font-size="11.5" fill="#333333">A plain Job that is not a QuartzJobBean gets the same three maps in step 2 instead of step 3.</text>
  <text x="20" y="483" font-size="11.5" fill="#333333">With a JDBC job store the JobDataMap is serialized: keep Spring beans out of it.</text>
</svg>
