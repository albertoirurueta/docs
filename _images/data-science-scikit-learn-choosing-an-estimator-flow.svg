<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" width="720" height="570" role="img">
<title>Choosing an estimator, simplified</title>
<desc>A simplified decision flow: with more than 50 samples, ask what you want to predict. A category with labels leads to linear models, nearest neighbours, SVC and ensembles; a quantity leads to Ridge, Lasso, SVR and ensembles; unlabeled groups lead to clustering; looking at structure leads to dimensionality reduction.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="568" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start">Choosing an estimator (simplified from the official map)</text>
<rect x="260" y="52" width="200" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360.0" y="78.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">More than 50 samples?</text>
<text x="520" y="79" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#BE123C" text-anchor="start">no: collect more data</text>
<line x1="460" y1="74" x2="512" y2="74" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="260" y="118" width="200" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360.0" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">What do you want?</text>
<line x1="360" y1="96" x2="360" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<line x1="360" y1="162" x2="105.0" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="198" width="152" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="216.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">A category</text>
<text x="105.0" y="236.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">labeled data</text>
<rect x="29" y="262" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="281.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">LogisticRegression</text>
<line x1="105.0" y1="292" x2="105.0" y2="302" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="302" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">LinearSVC</text>
<line x1="105.0" y1="332" x2="105.0" y2="342" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="342" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="361.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">SVC / KNN</text>
<line x1="105.0" y1="372" x2="105.0" y2="382" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="382" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="401.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Naive Bayes (text)</text>
<line x1="105.0" y1="412" x2="105.0" y2="422" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="422" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="441.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">HistGradientBoosting</text>
<line x1="105.0" y1="452" x2="105.0" y2="462" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="29" y="462" width="152" height="30" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105.0" y="481.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">RandomForest</text>
<text x="105.0" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">SGDClassifier above ~100K</text>
<line x1="360" y1="162" x2="275.0" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="199" y="198" width="152" height="48" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="216.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">A quantity</text>
<text x="275.0" y="236.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">numeric target</text>
<rect x="199" y="262" width="152" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="281.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Ridge / RidgeCV</text>
<line x1="275.0" y1="292" x2="275.0" y2="302" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="199" y="302" width="152" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Lasso, ElasticNet</text>
<line x1="275.0" y1="332" x2="275.0" y2="342" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="199" y="342" width="152" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="361.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">SVR (linear, rbf)</text>
<line x1="275.0" y1="372" x2="275.0" y2="382" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="199" y="382" width="152" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="401.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">HistGradientBoosting</text>
<line x1="275.0" y1="412" x2="275.0" y2="422" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="199" y="422" width="152" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275.0" y="441.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">RandomForest</text>
<text x="275.0" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">SGDRegressor above ~100K</text>
<line x1="360" y1="162" x2="445.0" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="369" y="198" width="152" height="48" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="216.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Groups</text>
<text x="445.0" y="236.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">no labels</text>
<rect x="369" y="262" width="152" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="281.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">KMeans</text>
<line x1="445.0" y1="292" x2="445.0" y2="302" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="369" y="302" width="152" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">MiniBatchKMeans</text>
<line x1="445.0" y1="332" x2="445.0" y2="342" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="369" y="342" width="152" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="361.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">HDBSCAN, DBSCAN</text>
<line x1="445.0" y1="372" x2="445.0" y2="382" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="369" y="382" width="152" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="401.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">GaussianMixture</text>
<line x1="445.0" y1="412" x2="445.0" y2="422" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="369" y="422" width="152" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445.0" y="441.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Spectral, Agglomerative</text>
<text x="445.0" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">MiniBatchKMeans above ~10K</text>
<line x1="360" y1="162" x2="615.0" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="539" y="198" width="152" height="48" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615.0" y="216.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Structure</text>
<text x="615.0" y="236.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">look at the data</text>
<rect x="539" y="262" width="152" height="30" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615.0" y="281.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">PCA</text>
<line x1="615.0" y1="292" x2="615.0" y2="302" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="539" y="302" width="152" height="30" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615.0" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">TruncatedSVD, NMF</text>
<line x1="615.0" y1="332" x2="615.0" y2="342" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="539" y="342" width="152" height="30" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615.0" y="361.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Isomap, t-SNE</text>
<line x1="615.0" y1="372" x2="615.0" y2="382" stroke="#B45309" stroke-width="2" marker-end="url(#arr)"/>
<rect x="539" y="382" width="152" height="30" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615.0" y="401.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Spectral embedding</text>
<text x="615.0" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Kernel approx. for large data</text>
<text x="360" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Arrows: if an estimator is not good enough, try the next one down.</text>
</svg>
