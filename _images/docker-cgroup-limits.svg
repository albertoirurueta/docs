<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>cgroup v2 limits for one container</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">cgroup v2 limits for one container</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">docker run --memory 512m --memory-swap 512m --cpus 1.5 --pids-limit 200 orders-service:1.4.0</text>
  <rect x="250" y="60" width="260" height="50" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="81.2" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">/sys/fs/cgroup</text>
  <text x="380.0" y="96.8" font-size="9.5" fill="#333333" text-anchor="middle">root of the unified hierarchy</text>
  <rect x="250" y="135" width="260" height="50" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="380.0" y="156.2" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">system.slice</text>
  <text x="380.0" y="171.8" font-size="9.5" fill="#333333" text-anchor="middle">systemd driver (default)</text>
  <rect x="250" y="210" width="260" height="60" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="380.0" y="236.2" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">docker-&lt;container-id&gt;.scope</text>
  <text x="380.0" y="251.8" font-size="9.5" fill="#333333" text-anchor="middle">the container's own cgroup</text>
  <line x1="380" y1="110" x2="380" y2="135" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="380" y1="185" x2="380" y2="210" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="20" y="300" width="175" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="107.5" y="324.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">memory.max</text>
  <text x="107.5" y="339.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">536870912</text>
  <text x="107.5" y="353.0" font-size="9.5" fill="#333333" text-anchor="middle">OOM kill above it</text>
  <line x1="380" y1="270" x2="107" y2="300" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="205" y="300" width="175" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="292.5" y="324.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">memory.swap.max</text>
  <text x="292.5" y="339.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
  <text x="292.5" y="353.0" font-size="9.5" fill="#333333" text-anchor="middle">no swap</text>
  <line x1="380" y1="270" x2="292" y2="300" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="390" y="300" width="175" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="477.5" y="324.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">cpu.max</text>
  <text x="477.5" y="339.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">150000 100000</text>
  <text x="477.5" y="353.0" font-size="9.5" fill="#333333" text-anchor="middle">1.5 CPUs per period</text>
  <line x1="380" y1="270" x2="477" y2="300" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="575" y="300" width="175" height="70" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="662.5" y="324.0" font-size="11" font-weight="bold" fill="#9a5a12" text-anchor="middle">pids.max</text>
  <text x="662.5" y="339.5" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">200</text>
  <text x="662.5" y="353.0" font-size="9.5" fill="#333333" text-anchor="middle">fork-bomb guard</text>
  <line x1="380" y1="270" x2="662" y2="300" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
</svg>
