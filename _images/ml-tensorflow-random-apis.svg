<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">TensorFlow random number APIs</title>
<desc id="d">Four boxes compare tf.random functional ops with a global seed, tf.random.Generator holding a state variable, stateless ops taking a seed argument, and keras.random with an integer seed or a SeedGenerator.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Where the random state lives</text>
<g font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">
<rect x="20" y="52" width="160" height="150" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="100" y="76" text-anchor="middle" font-weight="bold">tf.random.normal</text>
<text x="100" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">hidden global state</text>
<text x="100" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">set_seed(n)</text>
<text x="100" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">order dependent</text>
<text x="100" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">subtle in graphs</text>
<rect x="196" y="52" width="160" height="150" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="276" y="76" text-anchor="middle" font-weight="bold">random.Generator</text>
<text x="276" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">state in a tf.Variable</text>
<text x="276" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">from_seed, split</text>
<text x="276" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">checkpointable</text>
<text x="276" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">works in tf.function</text>
<rect x="372" y="52" width="160" height="150" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="452" y="76" text-anchor="middle" font-weight="bold">stateless_normal</text>
<text x="452" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">seed is an argument</text>
<text x="452" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pure function</text>
<text x="452" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">same seed, same output</text>
<text x="452" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">you split the seeds</text>
<rect x="548" y="52" width="152" height="150" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="624" y="76" text-anchor="middle" font-weight="bold">keras.random</text>
<text x="624" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">int seed: stateless</text>
<text x="624" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">SeedGenerator: state</text>
<text x="624" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all Keras backends</text>
<text x="624" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">used inside layers</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">
<text x="360" y="236" text-anchor="middle">Repeats on every call: stateless ops and integer keras seeds.</text>
<text x="360" y="258" text-anchor="middle">Advances on every call: global ops, Generator and SeedGenerator.</text>
<text x="360" y="280" text-anchor="middle">Redrawn from the descriptions in the official random number guide.</text>
</g>
</svg>
