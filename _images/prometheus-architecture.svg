<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="22" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Prometheus architecture: pull by default, push as the exception</text>
  <text x="380" y="40" font-size="12" fill="#666666" text-anchor="middle">scrape targets -&gt; Prometheus server (TSDB + rule evaluation) -&gt; Alertmanager / remote_write / Grafana</text>

  <defs>
    <marker id="pa-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="pa-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
    <marker id="pa-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Row 1: scrape targets -->
  <rect x="30" y="52" width="210" height="52" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="135" y="74" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Instrumented Apps</text>
  <text x="135" y="91" font-size="10" fill="#444444" text-anchor="middle">client libraries expose /metrics</text>

  <rect x="270" y="52" width="210" height="52" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="375" y="74" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Exporters</text>
  <text x="375" y="91" font-size="10" fill="#444444" text-anchor="middle">translate a third-party system to /metrics</text>

  <rect x="520" y="52" width="210" height="52" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="625" y="74" font-size="12.5" fill="#333333" text-anchor="middle">Short-Lived / Batch Jobs</text>
  <text x="625" y="91" font-size="10" fill="#666666" text-anchor="middle">exit before a scrape could happen</text>

  <!-- Short-lived jobs push to Pushgateway -->
  <line x1="625" y1="104" x2="625" y2="122" stroke="#999999" stroke-width="1.6" marker-end="url(#pa-arrow-grey)"/>
  <text x="655" y="116" font-size="9.5" fill="#666666" text-anchor="start">push</text>

  <rect x="520" y="122" width="210" height="40" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="625" y="146" font-size="12" fill="#333333" text-anchor="middle">Pushgateway</text>

  <!-- Arrows from apps/exporters down to Prometheus -->
  <line x1="135" y1="104" x2="135" y2="122" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="135" y1="122" x2="330" y2="122" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="330" y1="122" x2="330" y2="196" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>

  <line x1="375" y1="104" x2="375" y2="196" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>
  <text x="345" y="185" font-size="9.5" fill="#1c4b73" text-anchor="end">scrape (pull, HTTP)</text>

  <!-- Pushgateway down to Prometheus (still scraped, i.e. pulled) -->
  <line x1="625" y1="162" x2="625" y2="180" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="625" y1="180" x2="440" y2="180" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="440" y1="180" x2="440" y2="196" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>
  <text x="630" y="174" font-size="9.5" fill="#1c4b73" text-anchor="start">scrape (pull)</text>

  <!-- Prometheus server -->
  <rect x="120" y="196" width="520" height="110" rx="8" fill="#ffffff" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="380" y="216" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Prometheus Server</text>

  <rect x="150" y="228" width="220" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="260" y="252" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">TSDB</text>
  <text x="260" y="269" font-size="9.5" fill="#444444" text-anchor="middle">local time-series storage</text>

  <rect x="390" y="228" width="220" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="500" y="252" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Rule Evaluation</text>
  <text x="500" y="269" font-size="9.5" fill="#444444" text-anchor="middle">recording &amp; alerting rules</text>

  <!-- Service discovery feeding the server (small side note) -->
  <rect x="30" y="228" width="80" height="40" rx="5" fill="#f4f4f4" stroke="#999999" stroke-width="1.1"/>
  <text x="70" y="245" font-size="9" fill="#555555" text-anchor="middle">Service</text>
  <text x="70" y="256" font-size="9" fill="#555555" text-anchor="middle">Discovery</text>
  <line x1="110" y1="248" x2="118" y2="248" stroke="#999999" stroke-width="1.4" marker-end="url(#pa-arrow-grey)"/>

  <!-- Fan out arrows -->
  <line x1="220" y1="306" x2="220" y2="326" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>
  <line x1="380" y1="306" x2="380" y2="326" stroke="#2f5424" stroke-width="1.8" marker-end="url(#pa-arrow-green)"/>
  <line x1="540" y1="306" x2="540" y2="326" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>

  <text x="220" y="320" font-size="9.5" fill="#1c4b73" text-anchor="middle">alerts (push)</text>
  <text x="380" y="320" font-size="9.5" fill="#2f5424" text-anchor="middle">remote_write (push)</text>
  <text x="540" y="320" font-size="9.5" fill="#1c4b73" text-anchor="middle">query API (pull)</text>

  <!-- Row 3: downstream systems -->
  <rect x="110" y="330" width="220" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="220" y="354" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Alertmanager</text>
  <text x="220" y="371" font-size="10" fill="#444444" text-anchor="middle">dedup, group, route, silence</text>

  <rect x="330" y="330" width="220" height="60" rx="6" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="440" y="354" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Remote Storage</text>
  <text x="440" y="371" font-size="10" fill="#444444" text-anchor="middle">long-term retention (Thanos, Mimir, Cortex, ...)</text>

  <!-- Alertmanager notifies -->
  <line x1="220" y1="390" x2="220" y2="410" stroke="#999999" stroke-width="1.4" marker-end="url(#pa-arrow-grey)"/>
  <text x="220" y="424" font-size="10" fill="#666666" text-anchor="middle">email / Slack / PagerDuty / webhook</text>

  <!-- Grafana -->
  <rect x="560" y="330" width="170" height="60" rx="6" fill="#d7e6f2" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="645" y="354" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Grafana</text>
  <text x="645" y="371" font-size="10" fill="#444444" text-anchor="middle">dashboards, PromQL panels</text>

  <line x1="540" y1="326" x2="645" y2="326" stroke="#1c4b73" stroke-width="1.8"/>
  <line x1="645" y1="326" x2="645" y2="330" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pa-arrow)"/>

</svg>
