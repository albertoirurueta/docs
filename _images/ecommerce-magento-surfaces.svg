<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <title id="t">The four ways to extend Magento and Adobe Commerce</title>
  <desc id="d">PHP modules, themes and storefronts, web APIs and out-of-process extensions surround the Magento core, which runs on PHP, a database, a search engine and a cache that you or Adobe operate. A strip below lists the command line, cron, message queues and Composer that tie the pieces together.</desc>

  <rect x="250" y="160" width="300" height="150" rx="14" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-weight="bold" font-size="16">Magento core</text>
  <text x="400" y="214" text-anchor="middle">framework and about 320 modules</text>
  <text x="400" y="234" text-anchor="middle">dependency injection, plugins, events</text>
  <text x="400" y="254" text-anchor="middle">declarative schema, EAV, layouts</text>
  <text x="400" y="280" text-anchor="middle" font-size="12" opacity="0.85">runs on PHP 8.5, MariaDB or MySQL,</text>
  <text x="400" y="298" text-anchor="middle" font-size="12" opacity="0.85">OpenSearch and Valkey</text>

  <rect x="20" y="20" width="340" height="100" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="46" text-anchor="middle" font-weight="bold">1. PHP modules (in-process)</text>
  <text x="190" y="68" text-anchor="middle">module.xml, di.xml, plugins, observers</text>
  <text x="190" y="88" text-anchor="middle">db_schema.xml, controllers, admin pages</text>
  <text x="190" y="108" text-anchor="middle" font-size="12" opacity="0.85">not available on Adobe Commerce as a Cloud Service</text>

  <rect x="440" y="20" width="340" height="100" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="610" y="46" text-anchor="middle" font-weight="bold">2. Themes and storefronts</text>
  <text x="610" y="68" text-anchor="middle">Blank and Luma, Hyva, PWA Studio</text>
  <text x="610" y="88" text-anchor="middle">Commerce Storefront on Edge Delivery</text>
  <text x="610" y="108" text-anchor="middle" font-size="12" opacity="0.85">layout XML, LESS, RequireJS or Tailwind and Alpine</text>

  <rect x="20" y="350" width="340" height="100" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="376" text-anchor="middle" font-weight="bold">3. Web APIs</text>
  <text x="190" y="398" text-anchor="middle">REST at /rest/V1, GraphQL at /graphql</text>
  <text x="190" y="418" text-anchor="middle">tokens, OAuth integrations, async endpoints</text>
  <text x="190" y="438" text-anchor="middle" font-size="12" opacity="0.85">webapi.xml and schema.graphqls add routes</text>

  <rect x="440" y="350" width="340" height="100" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="610" y="376" text-anchor="middle" font-weight="bold">4. Out-of-process extensions</text>
  <text x="610" y="398" text-anchor="middle">App Builder, webhooks, I/O Events</text>
  <text x="610" y="418" text-anchor="middle">API Mesh, Admin UI SDK</text>
  <text x="610" y="438" text-anchor="middle" font-size="12" opacity="0.85">events and webhooks: Adobe Commerce only</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M190 120 L190 235 L250 235"/>
    <path d="M610 120 L610 235 L550 235"/>
    <path d="M190 350 L190 245 L250 245"/>
    <path d="M610 350 L610 245 L550 245"/>
  </g>

  <rect x="20" y="470" width="760" height="38" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="400" y="494" text-anchor="middle" font-size="13">Around the core: bin/magento CLI, cron, message queues, Composer and Marketplace packages</text>
</svg>
