<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">HLS structure: one multivariant playlist, one media playlist per rendition, many segments</text>

  <rect x="40" y="50" width="220" height="130" rx="8" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="150" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">master.m3u8</text>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#7a4800">multivariant playlist</text>
  <text x="54" y="112" font-size="11" font-family="Courier New, monospace" fill="#333">#EXT-X-STREAM-INF</text>
  <text x="54" y="128" font-size="11" font-family="Courier New, monospace" fill="#333">BANDWIDTH, RESOLUTION,</text>
  <text x="54" y="144" font-size="11" font-family="Courier New, monospace" fill="#333">CODECS</text>
  <text x="54" y="164" font-size="11" font-family="Courier New, monospace" fill="#333">#EXT-X-MEDIA (audio)</text>

  <rect x="360" y="44" width="230" height="60" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="475" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">1080p/index.m3u8</text>
  <text x="475" y="84" text-anchor="middle" font-size="11" fill="#1f5fa6">media playlist, 6 s target duration</text>
  <rect x="360" y="118" width="230" height="60" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="475" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">720p/index.m3u8</text>
  <text x="475" y="158" text-anchor="middle" font-size="11" fill="#1f5fa6">media playlist</text>
  <rect x="360" y="192" width="230" height="60" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="475" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">360p/index.m3u8</text>
  <text x="475" y="232" text-anchor="middle" font-size="11" fill="#1f5fa6">media playlist</text>
  <rect x="360" y="266" width="230" height="60" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="475" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">audio/index.m3u8</text>
  <text x="475" y="306" text-anchor="middle" font-size="11" fill="#2b7a2b">audio rendition group</text>

  <line x1="260" y1="115" x2="360" y2="74" stroke="#555" stroke-width="1.4"/>
  <line x1="260" y1="125" x2="360" y2="148" stroke="#555" stroke-width="1.4"/>
  <line x1="260" y1="135" x2="360" y2="222" stroke="#555" stroke-width="1.4"/>
  <line x1="260" y1="150" x2="360" y2="296" stroke="#555" stroke-width="1.4"/>

  <rect x="680" y="44" width="190" height="34" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="775" y="66" text-anchor="middle" font-size="12" fill="#4a1d75">init.mp4 (EXT-X-MAP)</text>
  <rect x="680" y="88" width="190" height="34" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="775" y="110" text-anchor="middle" font-size="12" fill="#4a1d75">seg_000.m4s (6 s, IDR first)</text>
  <rect x="680" y="132" width="190" height="34" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="775" y="154" text-anchor="middle" font-size="12" fill="#4a1d75">seg_001.m4s</text>
  <rect x="680" y="176" width="190" height="34" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="775" y="198" text-anchor="middle" font-size="12" fill="#4a1d75">seg_002.m4s ...</text>
  <line x1="590" y1="74" x2="680" y2="61" stroke="#555" stroke-width="1.4"/>
  <line x1="590" y1="74" x2="680" y2="105" stroke="#555" stroke-width="1.4"/>
  <line x1="590" y1="74" x2="680" y2="149" stroke="#555" stroke-width="1.4"/>
  <line x1="590" y1="74" x2="680" y2="193" stroke="#555" stroke-width="1.4"/>

  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#333">The player downloads master.m3u8 once, picks a rendition from its bandwidth estimate, then fetches that rendition's playlist and segments.</text>
  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#333">It can switch rendition at any segment boundary, which is why every rendition must have keyframes at the same timestamps.</text>
  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#555">Each rendition folder repeats the same pattern of init segment plus numbered media segments (only the first is drawn).</text>
</svg>
