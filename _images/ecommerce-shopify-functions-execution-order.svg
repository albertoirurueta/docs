<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Order in which Shopify Functions run during checkout</title>
  <desc id="d">Seven stages in execution order. Cart lines: Cart Transform. Cart line discounts: Discount. Fulfillment groups: Fulfillment Constraints and Order Routing. Delivery methods: pickup generators and Delivery Customization. Delivery discounts: Discount. Payment methods: Payment Customization. Verification: Cart and Checkout Validation. Each stage receives the output of the earlier ones.</desc>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#f2f5f8">Each stage reads what the earlier stages produced</text>

  <g stroke="#f2f5f8" stroke-width="1">
    <rect x="20" y="48" width="160" height="150" rx="8" fill="#3f6e9a"/>
    <rect x="200" y="48" width="160" height="150" rx="8" fill="#3f6e9a"/>
    <rect x="380" y="48" width="160" height="150" rx="8" fill="#6a5a8e"/>
    <rect x="560" y="48" width="180" height="150" rx="8" fill="#6a5a8e"/>
    <rect x="20" y="236" width="160" height="150" rx="8" fill="#4f7f5b"/>
    <rect x="200" y="236" width="160" height="150" rx="8" fill="#4f7f5b"/>
    <rect x="380" y="236" width="160" height="150" rx="8" fill="#8a6a3a"/>
  </g>

  <g fill="#f2f5f8" text-anchor="middle">
    <text x="100" y="72" font-size="13" font-weight="bold">1  Cart lines</text>
    <text x="100" y="104" font-size="13">Cart Transform</text>
    <text x="100" y="124" font-size="11">cart.transform.run</text>
    <text x="100" y="152" font-size="11">expand, merge, update</text>

    <text x="280" y="72" font-size="13" font-weight="bold">2  Line discounts</text>
    <text x="280" y="104" font-size="13">Discount</text>
    <text x="280" y="124" font-size="11">cart.lines.discounts</text>
    <text x="280" y="140" font-size="11">.generate.run</text>
    <text x="280" y="168" font-size="11">product and order classes</text>

    <text x="460" y="72" font-size="13" font-weight="bold">3  Fulfillment groups</text>
    <text x="460" y="104" font-size="13">Fulfillment Constraints</text>
    <text x="460" y="124" font-size="13">Order Routing</text>
    <text x="460" y="152" font-size="11">where items ship from</text>

    <text x="650" y="72" font-size="13" font-weight="bold">4  Delivery methods</text>
    <text x="650" y="104" font-size="13">Pickup generators</text>
    <text x="650" y="122" font-size="11">(unstable version only)</text>
    <text x="650" y="148" font-size="13">Delivery Customization</text>
    <text x="650" y="166" font-size="11">cart.delivery-options</text>
    <text x="650" y="182" font-size="11">.transform.run</text>

    <text x="100" y="260" font-size="13" font-weight="bold">5  Delivery discounts</text>
    <text x="100" y="292" font-size="13">Discount</text>
    <text x="100" y="312" font-size="11">cart.delivery-options</text>
    <text x="100" y="328" font-size="11">.discounts.generate.run</text>
    <text x="100" y="356" font-size="11">shipping class</text>

    <text x="280" y="260" font-size="13" font-weight="bold">6  Payment methods</text>
    <text x="280" y="292" font-size="13">Payment Customization</text>
    <text x="280" y="312" font-size="11">cart.payment-methods</text>
    <text x="280" y="328" font-size="11">.transform.run</text>
    <text x="280" y="356" font-size="11">hide, move, rename, terms</text>

    <text x="460" y="260" font-size="13" font-weight="bold">7  Verification</text>
    <text x="460" y="292" font-size="13">Cart and Checkout</text>
    <text x="460" y="310" font-size="13">Validation</text>
    <text x="460" y="330" font-size="11">cart.validations</text>
    <text x="460" y="346" font-size="11">.generate.run</text>
    <text x="460" y="372" font-size="11">can block the buyer</text>
  </g>

  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 123 H196"/><path d="M360 123 H376"/><path d="M540 123 H556"/>
    <path d="M650 198 V216 H100 V232"/>
    <path d="M180 311 H196"/><path d="M360 311 H376"/>
  </g>

  <g fill="#f2f5f8" font-size="12">
    <text x="560" y="262">A validation cannot run</text>
    <text x="560" y="278">before the discounts it</text>
    <text x="560" y="294">may depend on are known.</text>
    <text x="560" y="326">Active discount functions run</text>
    <text x="560" y="342">concurrently and do not see</text>
    <text x="560" y="358">each other.</text>
  </g>
</svg>
