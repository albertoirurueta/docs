<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">Layout of a Parquet file</title>
  <desc id="d">A Parquet file drawn as a stack: the magic bytes PAR1, two row groups each holding one column chunk per column made of pages, then a footer with the schema and per-column statistics, and PAR1 again. A second panel shows a Hive-partitioned dataset as a directory tree.</desc>
  <rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Parquet file layout and a partitioned dataset</text>
