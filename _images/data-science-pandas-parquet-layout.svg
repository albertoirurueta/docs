2A" text-anchor="middle">country</text><text x="350" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">column chunk</text><rect x="302" y="318" width="44" height="20" rx="4" fill="#FFFFFF" stroke="#0F766E"/><rect x="354" y="318" width="44" height="20" rx="4" fill="#FFFFFF" stroke="#0F766E"/><text x="324" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">page</text><text x="376" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">page</text>
