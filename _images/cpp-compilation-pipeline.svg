<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="220" fill="#ffffff"/>

  <defs>
    <marker id="cpparrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- Stage boxes -->
  <g font-size="14">
    <rect x="10" y="60" width="140" height="70" rx="6" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
    <text x="80" y="90" text-anchor="middle" font-weight="bold" fill="#1c4b73">Preprocess</text>
    <text x="80" y="110" text-anchor="middle" font-size="12" fill="#1c4b73">main.cpp -&gt; main.ii</text>

    <rect x="180" y="60" width="140" height="70" rx="6" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
    <text x="250" y="90" text-anchor="middle" font-weight="bold" fill="#2a6636">Compile</text>
    <text x="250" y="110" text-anchor="middle" font-size="12" fill="#2a6636">main.ii -&gt; main.s</text>

    <rect x="350" y="60" width="140" height="70" rx="6" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
    <text x="420" y="90" text-anchor="middle" font-weight="bold" fill="#6b4207">Assemble</text>
    <text x="420" y="110" text-anchor="middle" font-size="12" fill="#6b4207">main.s -&gt; main.o</text>

    <rect x="520" y="60" width="140" height="70" rx="6" fill="#fddede" stroke="#a83a3a" stroke-width="2"/>
    <text x="590" y="90" text-anchor="middle" font-weight="bold" fill="#7a2323">Link</text>
    <text x="590" y="110" text-anchor="middle" font-size="12" fill="#7a2323">*.o + libs -&gt; a.out</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="150" y1="95" x2="176" y2="95" stroke="#3a3a3a" stroke-width="2" marker-end="url(#cpparrow)"/>
  <line x1="320" y1="95" x2="346" y2="95" stroke="#3a3a3a" stroke-width="2" marker-end="url(#cpparrow)"/>
  <line x1="490" y1="95" x2="516" y2="95" stroke="#3a3a3a" stroke-width="2" marker-end="url(#cpparrow)"/>

  <!-- Inputs/outputs annotations -->
  <text x="80" y="45" text-anchor="middle" font-size="12" fill="#555">expands #include, #define, #if</text>
  <text x="250" y="45" text-anchor="middle" font-size="12" fill="#555">front end + optimizer -&gt; asm</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#555">assembler -&gt; machine code</text>
  <text x="590" y="45" text-anchor="middle" font-size="12" fill="#555">linker resolves symbols</text>

  <!-- other TU note -->
  <rect x="520" y="150" width="140" height="46" rx="6" fill="#eeeeee" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="590" y="170" text-anchor="middle" font-size="12" fill="#444">other.o</text>
  <text x="590" y="185" text-anchor="middle" font-size="11" fill="#444">(other translation units)</text>
  <line x1="590" y1="150" x2="590" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#cpparrow)"/>

  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#333">clang++ -std=c++23 -Wall -Wextra main.cpp other.cpp -o a.out runs all four stages in one invocation</text>
</svg>
