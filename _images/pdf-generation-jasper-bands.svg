<svg viewBox="0 0 960 700" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
<text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">JasperReports page layout: the bands and where they print</text>
<rect x="60" y="48" width="360" height="640" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="240.0" y="688" text-anchor="middle" font-size="1" fill="none"> </text>
<rect x="82" y="70" width="316" height="596" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="76" y="368.0" font-size="11" fill="#555" text-anchor="middle" transform="rotate(-90 76 368.0)">background (behind every band, whole page)</text>
<text x="240.0" y="62" text-anchor="middle" font-size="10" fill="#555">top margin</text>
<text x="240.0" y="680" text-anchor="middle" font-size="10" fill="#555">bottom margin</text>
<rect x="90" y="74" width="300" height="52" rx="3" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.3"/>
<text x="240.0" y="99.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">title</text>
<text x="240.0" y="112.0" text-anchor="middle" font-size="10" fill="#333">first page only</text>
<rect x="90" y="129" width="300" height="36" rx="3" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.3"/>
<text x="240.0" y="146.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">pageHeader</text>
<text x="240.0" y="159.0" text-anchor="middle" font-size="10" fill="#333">every page</text>
<rect x="90" y="168" width="300" height="30" rx="3" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1.3"/>
<text x="240.0" y="182.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">columnHeader</text>
<text x="240.0" y="195.0" text-anchor="middle" font-size="10" fill="#333">top of every column</text>
<rect x="90" y="201" width="300" height="28" rx="3" fill="#fff3d6" stroke="#b36b00" stroke-width="1.3"/>
<text x="240.0" y="214.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">detail</text>
<text x="240.0" y="227.0" text-anchor="middle" font-size="10" fill="#333">one band per record, repeated</text>
<rect x="90" y="232" width="300" height="28" rx="3" fill="#fff3d6" stroke="#b36b00" stroke-width="1.3"/>
<text x="240.0" y="250.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">detail</text>
<rect x="90" y="263" width="300" height="28" rx="3" fill="#fff3d6" stroke="#b36b00" stroke-width="1.3"/>
<text x="240.0" y="281.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">detail</text>
<text x="240.0" y="302" text-anchor="middle" font-size="11" fill="#555">... more detail rows ... (a detail may hold several bands)</text>
<rect x="90" y="312" width="300" height="40" rx="3" fill="#f1e6fa" stroke="#7a3fa0" stroke-width="1.3"/>
<text x="240.0" y="331.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">summary</text>
<text x="240.0" y="344.0" text-anchor="middle" font-size="10" fill="#333">once, after the last detail</text>
<rect x="90" y="544" width="300" height="30" rx="3" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1.3"/>
<text x="240.0" y="558.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">columnFooter</text>
<text x="240.0" y="571.0" text-anchor="middle" font-size="10" fill="#333">bottom of every column</text>
<rect x="90" y="577" width="300" height="36" rx="3" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.3"/>
<text x="240.0" y="594.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">pageFooter / lastPageFooter</text>
<text x="240.0" y="607.0" text-anchor="middle" font-size="10" fill="#333">lastPageFooter replaces pageFooter on the last page</text>
<text x="530.0" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Page 1</text>
<rect x="470" y="90" width="120" height="230" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="476" y="95" width="108" height="34.166666666666664" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="530.0" y="116.08333333333333" text-anchor="middle" font-size="10" fill="#1a1a1a">title</text>
<rect x="476" y="132.16666666666666" width="108" height="34.166666666666664" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="530.0" y="153.25" text-anchor="middle" font-size="10" fill="#1a1a1a">pageHeader</text>
<rect x="476" y="169.33333333333331" width="108" height="34.166666666666664" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="530.0" y="190.41666666666666" text-anchor="middle" font-size="10" fill="#1a1a1a">columnHeader</text>
<rect x="476" y="206.49999999999997" width="108" height="34.166666666666664" rx="2" fill="#fff3d6" stroke="#b36b00" stroke-width="1"/>
<text x="530.0" y="227.58333333333331" text-anchor="middle" font-size="10" fill="#1a1a1a">detail ...</text>
<rect x="476" y="243.66666666666663" width="108" height="34.166666666666664" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="530.0" y="264.74999999999994" text-anchor="middle" font-size="10" fill="#1a1a1a">columnFooter</text>
<rect x="476" y="280.8333333333333" width="108" height="34.166666666666664" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="530.0" y="301.91666666666663" text-anchor="middle" font-size="10" fill="#1a1a1a">pageFooter</text>
<text x="665.0" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Middle page</text>
<rect x="605" y="90" width="120" height="230" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="611" y="95" width="108" height="41.6" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="665.0" y="119.8" text-anchor="middle" font-size="10" fill="#1a1a1a">pageHeader</text>
<rect x="611" y="139.6" width="108" height="41.6" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="665.0" y="164.4" text-anchor="middle" font-size="10" fill="#1a1a1a">columnHeader</text>
<rect x="611" y="184.2" width="108" height="41.6" rx="2" fill="#fff3d6" stroke="#b36b00" stroke-width="1"/>
<text x="665.0" y="209.0" text-anchor="middle" font-size="10" fill="#1a1a1a">detail ...</text>
<rect x="611" y="228.79999999999998" width="108" height="41.6" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="665.0" y="253.6" text-anchor="middle" font-size="10" fill="#1a1a1a">columnFooter</text>
<rect x="611" y="273.4" width="108" height="41.6" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="665.0" y="298.2" text-anchor="middle" font-size="10" fill="#1a1a1a">pageFooter</text>
<text x="800.0" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Last page</text>
<rect x="740" y="90" width="120" height="230" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="746" y="95" width="108" height="34.166666666666664" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="800.0" y="116.08333333333333" text-anchor="middle" font-size="10" fill="#1a1a1a">pageHeader</text>
<rect x="746" y="132.16666666666666" width="108" height="34.166666666666664" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="800.0" y="153.25" text-anchor="middle" font-size="10" fill="#1a1a1a">columnHeader</text>
<rect x="746" y="169.33333333333331" width="108" height="34.166666666666664" rx="2" fill="#fff3d6" stroke="#b36b00" stroke-width="1"/>
<text x="800.0" y="190.41666666666666" text-anchor="middle" font-size="10" fill="#1a1a1a">detail ...</text>
<rect x="746" y="206.49999999999997" width="108" height="34.166666666666664" rx="2" fill="#f1e6fa" stroke="#7a3fa0" stroke-width="1"/>
<text x="800.0" y="227.58333333333331" text-anchor="middle" font-size="10" fill="#1a1a1a">summary</text>
<rect x="746" y="243.66666666666663" width="108" height="34.166666666666664" rx="2" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1"/>
<text x="800.0" y="264.74999999999994" text-anchor="middle" font-size="10" fill="#1a1a1a">columnFooter</text>
<rect x="746" y="280.8333333333333" width="108" height="34.166666666666664" rx="2" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1"/>
<text x="800.0" y="301.91666666666663" text-anchor="middle" font-size="10" fill="#1a1a1a">lastPageFooter</text>
<text x="910.0" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">No data</text>
<rect x="875" y="90" width="70" height="230" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="881" y="95" width="58" height="220.0" rx="2" fill="#fde4e4" stroke="#b03030" stroke-width="1"/>
<text x="910.0" y="209.0" text-anchor="middle" font-size="10" fill="#1a1a1a">noData</text>
<text x="470" y="352" font-size="11.5" fill="#333">A one-page report is first and last page at once: title, summary, lastPageFooter.</text>
<text x="470" y="384" font-size="13" font-weight="700" fill="#1a1a1a">What decides the layout</text>
<text x="470" y="406" font-size="11.5" fill="#333">Vertical order is fixed: title, pageHeader, columnHeader, detail,</text>
<text x="470" y="424" font-size="11.5" fill="#333">summary, columnFooter, pageFooter (lastPageFooter on the last page).</text>
<text x="470" y="442" font-size="11.5" fill="#333">Details fill the space between headers and footers; when it runs out</text>
<text x="470" y="460" font-size="11.5" fill="#333">the engine closes the page and opens the next one.</text>
<text x="470" y="478" font-size="11.5" fill="#333">summary follows the last detail; floatColumnFooter=true floats the</text>
<text x="470" y="496" font-size="11.5" fill="#333">columnFooter up under it instead of leaving it at the column bottom.</text>
<text x="470" y="514" font-size="11.5" fill="#333">background is printed first on every page, under all other bands.</text>
<text x="470" y="532" font-size="11.5" fill="#333">Band heights and margins must fit the page height, background included</text>
<text x="470" y="550" font-size="11.5" fill="#333">(752 pt of background on A4 with 50 pt top and 40 pt bottom margins).</text>
<text x="470" y="590" font-size="13" font-weight="700" fill="#1a1a1a">whenNoDataType (no records)</text>
<text x="470" y="612" font-size="11.5" fill="#333">NoPages (default): no page. BlankPage: one empty page.</text>
<text x="470" y="630" font-size="11.5" fill="#333">AllSectionsNoDetail: every band except detail.</text>
<text x="470" y="648" font-size="11.5" fill="#333">NoDataSection: only the noData band (and the background).</text>
</svg>
