<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three ways type declarations reach your code</text>

  <!-- band separators -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3">
    <line x1="30" y1="165" x2="730" y2="165"/>
    <line x1="30" y1="298" x2="730" y2="298"/>
  </g>

  <!-- ================= (a) emit from your own source ================= -->
  <text x="40" y="58" font-size="13" font-weight="bold" fill="#1c4b73">(a) Emit from your own source</text>

  <g font-family="'Courier New', monospace" font-size="13">
    <rect x="46" y="76" width="120" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="106" y="101" fill="#222222" text-anchor="middle">app.ts</text>

    <rect x="360" y="66" width="150" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="435" y="88" fill="#2f5424" text-anchor="middle">app.js</text>

    <rect x="360" y="108" width="150" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="435" y="130" fill="#8a3d10" text-anchor="middle">app.d.ts</text>
  </g>

  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="170" y1="96" x2="352" y2="96"/>
    <polygon points="350,91 350,101 360,96" stroke="none"/>
  </g>
  <text x="262" y="88" font-size="12" fill="#8a3d10" text-anchor="middle" font-family="'Courier New', monospace">tsc --declaration</text>
  <text x="530" y="92" font-size="11.5" fill="#444444">JavaScript and its</text>
  <text x="530" y="128" font-size="11.5" fill="#444444">types, emitted together</text>

  <!-- ================= (b) install a separate @types package ================= -->
  <text x="40" y="190" font-size="13" font-weight="bold" fill="#2f5424">(b) Install a separate @types package</text>

  <g font-family="'Courier New', monospace" font-size="13">
    <rect x="46" y="212" width="180" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="136" y="236" fill="#222222" text-anchor="middle">lodash</text>
    <text x="136" y="254" font-size="10.5" fill="#666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">plain JavaScript, ships no types</text>

    <rect x="330" y="202" width="210" height="54" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="435" y="226" fill="#7a2f6a" text-anchor="middle">@types/lodash</text>
    <text x="435" y="244" font-size="10.5" fill="#666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">.d.ts files only, from DefinitelyTyped</text>
  </g>

  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="330" y1="245" x2="234" y2="245"/>
    <polygon points="236,240 236,250 226,245" stroke="none"/>
  </g>
  <text x="282" y="233" font-size="11" fill="#444444" text-anchor="middle">feeds types in</text>
  <text x="435" y="285" font-size="12" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">npm i -D @types/lodash</text>

  <!-- ================= (c) ambient declaration for a non-code import ================= -->
  <text x="40" y="322" font-size="13" font-weight="bold" fill="#8a3d10">(c) Ambient declaration for a non-code import</text>

  <g font-family="'Courier New', monospace" font-size="12.5">
    <rect x="46" y="336" width="322" height="80" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="58" y="357" fill="#222222">declare module "*.svg" {</text>
    <text x="58" y="375" fill="#222222">  const url: string;</text>
    <text x="58" y="393" fill="#222222">  export default url;</text>
    <text x="58" y="411" fill="#222222">}</text>
  </g>

  <g stroke="#999999" stroke-width="1.4" fill="#999999">
    <line x1="370" y1="376" x2="430" y2="376"/>
    <polygon points="428,371 428,381 438,376" stroke="none"/>
  </g>

  <rect x="440" y="352" width="280" height="48" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="452" y="372" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">import logo from "./logo.svg";</text>
  <text x="452" y="390" font-size="10.5" fill="#666666">logo is now typed as string</text>

  <text x="585" y="330" font-size="11" fill="#444444" text-anchor="middle">in any .d.ts on the tsconfig include path</text>
</svg>
