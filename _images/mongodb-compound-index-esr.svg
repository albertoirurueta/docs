<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="340" fill="#ffffff"/>

  <text x="370" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Compound index key order: Equality, Sort, Range</text>
  <text x="370" y="52" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">db.orders.createIndex({ status: 1, orderDate: 1, qty: 1 })</text>
  <text x="370" y="72" font-size="11" fill="#666666" text-anchor="middle">query: find({ status: "shipped", qty: { $gte: 20 } }).sort({ orderDate: 1 })</text>

  <!-- Equality zone -->
  <g>
    <rect x="40" y="92" width="200" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="40" y="92" width="200" height="26" fill="#1c4b73"/>
    <text x="140" y="110" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1 &#183; EQUALITY</text>
    <text x="140" y="140" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">{ status: 1 }</text>
    <text x="140" y="164" font-size="10.5" fill="#666666" text-anchor="middle">exact-match predicates</text>
    <text x="140" y="180" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">status: "shipped"</text>
    <text x="140" y="204" font-size="10.5" fill="#444444" text-anchor="middle">first, so the scan seeks</text>
    <text x="140" y="219" font-size="10.5" fill="#444444" text-anchor="middle">straight to matching keys</text>
  </g>

  <!-- Sort zone -->
  <g>
    <rect x="270" y="92" width="200" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="270" y="92" width="200" height="26" fill="#2f5424"/>
    <text x="370" y="110" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2 &#183; SORT</text>
    <text x="370" y="140" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">{ orderDate: 1 }</text>
    <text x="370" y="164" font-size="10.5" fill="#666666" text-anchor="middle">field(s) the query sorts on</text>
    <text x="370" y="180" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">.sort({ orderDate: 1 })</text>
    <text x="370" y="204" font-size="10.5" fill="#444444" text-anchor="middle">next, so keys come out</text>
    <text x="370" y="219" font-size="10.5" fill="#444444" text-anchor="middle">ordered &#8212; no blocking sort</text>
  </g>

  <!-- Range zone -->
  <g>
    <rect x="500" y="92" width="200" height="150" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <rect x="500" y="92" width="200" height="26" fill="#666666"/>
    <text x="600" y="110" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3 &#183; RANGE</text>
    <text x="600" y="140" font-size="13" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">{ qty: 1 }</text>
    <text x="600" y="164" font-size="10.5" fill="#666666" text-anchor="middle">$gt / $lt / $gte / $in</text>
    <text x="600" y="180" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">qty: { $gte: 20 }</text>
    <text x="600" y="204" font-size="10.5" fill="#444444" text-anchor="middle">last, since a range scan</text>
    <text x="600" y="219" font-size="10.5" fill="#444444" text-anchor="middle">can't order later keys</text>
  </g>

  <!-- arrows between zones -->
  <g stroke="#999999" stroke-width="1.6" fill="#999999">
    <line x1="242" y1="167" x2="266" y2="167"/>
    <polygon points="264,162 264,172 272,167" stroke="none"/>
    <line x1="472" y1="167" x2="496" y2="167"/>
    <polygon points="494,162 494,172 502,167" stroke="none"/>
  </g>

  <text x="370" y="278" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Winning key order:  Equality  &#8594;  Sort  &#8594;  Range</text>
  <text x="370" y="302" font-size="11" fill="#666666" text-anchor="middle">Equality fields narrow the scan; the sort field then rides along in index order; range predicates come last.</text>
</svg>
