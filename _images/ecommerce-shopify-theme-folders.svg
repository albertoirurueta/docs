<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify theme folder map</title>
  <desc id="d">The eight folders of an Online Store 2.0 theme with the files of the Pocket Coffee example theme: layout renders templates and section groups, templates list sections, sections hold blocks, sections and blocks render snippets, assets carry CSS, config stores theme settings and locales store translations.</desc>
  <rect x="0" y="0" width="960" height="690" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>

  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">pocket-coffee-theme/ : the eight folders of a theme</text>

  <!-- arcs and arrows (drawn first, boxes on top) -->
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M150 72 C 150 34, 820 34, 820 72" stroke-dasharray="6 4"/>
    <path d="M270 170 H 366"/>
    <path d="M610 170 H 706"/>
    <path d="M150 262 V 290"/>
    <path d="M820 262 V 290"/>
    <path d="M706 380 H 614"/>
    <path d="M366 380 H 274" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="485" y="64">{% sections %} renders header-group and footer-group</text>
    <text x="318" y="160" font-size="11">content_for_layout</text>
    <text x="660" y="160" font-size="11">type + order</text>
    <text x="160" y="282" text-anchor="start">asset_url</text>
    <text x="830" y="282" text-anchor="start">blocks</text>
    <text x="660" y="370">render</text>
    <text x="320" y="370">render</text>
  </g>

  <g fill="#f2f5f8">
    <!-- layout -->
    <rect x="30" y="78" width="240" height="184" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="45" y="104" font-size="16" font-weight="bold">layout/</text>
    <text x="45" y="124" font-size="12">page frame: head, header, main, footer</text>
    <text x="45" y="152" font-size="13" font-family="Menlo, Consolas, monospace">theme.liquid  (required)</text>
    <text x="45" y="174" font-size="13" font-family="Menlo, Consolas, monospace">landing.liquid</text>
    <text x="45" y="204" font-size="12">must output content_for_header</text>
    <text x="45" y="222" font-size="12">and content_for_layout</text>
    <text x="45" y="246" font-size="12">chosen per template by "layout"</text>

    <!-- templates -->
    <rect x="370" y="78" width="240" height="184" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="385" y="104" font-size="16" font-weight="bold">templates/</text>
    <text x="385" y="124" font-size="12">one per page type, JSON or Liquid</text>
    <text x="385" y="152" font-size="13" font-family="Menlo, Consolas, monospace">index.json   page.json</text>
    <text x="385" y="174" font-size="13" font-family="Menlo, Consolas, monospace">product.json</text>
    <text x="385" y="196" font-size="13" font-family="Menlo, Consolas, monospace">product.club.json</text>
    <text x="385" y="218" font-size="13" font-family="Menlo, Consolas, monospace">collection.json</text>
    <text x="385" y="246" font-size="12">+ customers/ and metaobject/</text>

    <!-- sections -->
    <rect x="710" y="78" width="220" height="184" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="725" y="104" font-size="16" font-weight="bold">sections/</text>
    <text x="725" y="124" font-size="12">editable modules and groups</text>
    <text x="725" y="152" font-size="13" font-family="Menlo, Consolas, monospace">main-product.liquid</text>
    <text x="725" y="174" font-size="13" font-family="Menlo, Consolas, monospace">roast-story.liquid</text>
    <text x="725" y="196" font-size="13" font-family="Menlo, Consolas, monospace">header-group.json</text>
    <text x="725" y="218" font-size="13" font-family="Menlo, Consolas, monospace">footer-group.json</text>
    <text x="725" y="246" font-size="12">each with a schema tag</text>

    <!-- assets -->
    <rect x="30" y="292" width="240" height="176" rx="10" fill="#9a6a3a" stroke="#f2f5f8"/>
    <text x="45" y="318" font-size="16" font-weight="bold">assets/</text>
    <text x="45" y="338" font-size="12">static files served from the CDN</text>
    <text x="45" y="366" font-size="13" font-family="Menlo, Consolas, monospace">pocket-coffee.css</text>
    <text x="45" y="388" font-size="12">images, fonts, JavaScript, SVG</text>
    <text x="45" y="410" font-size="12">a .liquid suffix gives limited</text>
    <text x="45" y="428" font-size="12">Liquid (settings and filters)</text>
    <text x="45" y="452" font-size="12">referenced with asset_url</text>

    <!-- snippets -->
    <rect x="370" y="292" width="240" height="176" rx="10" fill="#3a8a8a" stroke="#f2f5f8"/>
    <text x="385" y="318" font-size="16" font-weight="bold">snippets/</text>
    <text x="385" y="338" font-size="12">reusable Liquid, hidden in the editor</text>
    <text x="385" y="366" font-size="13" font-family="Menlo, Consolas, monospace">roast-date-badge.liquid</text>
    <text x="385" y="394" font-size="12">receives data through render</text>
    <text x="385" y="412" font-size="12">arguments, documented with a</text>
    <text x="385" y="430" font-size="12">doc tag (LiquidDoc)</text>
    <text x="385" y="454" font-size="12">no schema, no settings</text>

    <!-- blocks -->
    <rect x="710" y="292" width="220" height="176" rx="10" fill="#a8556a" stroke="#f2f5f8"/>
    <text x="725" y="318" font-size="16" font-weight="bold">blocks/</text>
    <text x="725" y="338" font-size="12">reusable, nestable theme blocks</text>
    <text x="725" y="366" font-size="13" font-family="Menlo, Consolas, monospace">roast-note.liquid</text>
    <text x="725" y="394" font-size="12">own schema, settings, presets</text>
    <text x="725" y="412" font-size="12">used by sections that accept</text>
    <text x="725" y="430" font-size="12">the @theme block type</text>
    <text x="725" y="454" font-size="12">at most 300 per theme</text>

    <!-- config -->
    <rect x="30" y="498" width="240" height="170" rx="10" fill="#5f6fa8" stroke="#f2f5f8"/>
    <text x="45" y="524" font-size="16" font-weight="bold">config/</text>
    <text x="45" y="544" font-size="12">theme settings: definition and values</text>
    <text x="45" y="572" font-size="13" font-family="Menlo, Consolas, monospace">settings_schema.json</text>
    <text x="45" y="594" font-size="13" font-family="Menlo, Consolas, monospace">settings_data.json</text>
    <text x="45" y="616" font-size="13" font-family="Menlo, Consolas, monospace">markets.json  (optional)</text>
    <text x="45" y="644" font-size="12">read in Liquid as settings.id</text>

    <!-- locales -->
    <rect x="370" y="498" width="240" height="170" rx="10" fill="#7a7a3a" stroke="#f2f5f8"/>
    <text x="385" y="524" font-size="16" font-weight="bold">locales/</text>
    <text x="385" y="544" font-size="12">storefront and editor translations</text>
    <text x="385" y="572" font-size="13" font-family="Menlo, Consolas, monospace">es.default.json   en.json</text>
    <text x="385" y="594" font-size="13" font-family="Menlo, Consolas, monospace">es.default.schema.json</text>
    <text x="385" y="616" font-size="13" font-family="Menlo, Consolas, monospace">en.schema.json</text>
    <text x="385" y="644" font-size="12">read with the t filter or t: keys</text>

    <!-- limits -->
    <rect x="710" y="498" width="220" height="170" rx="10" fill="none" stroke="#f2f5f8" stroke-dasharray="6 4"/>
    <text x="725" y="524" font-size="15" font-weight="bold">Platform limits</text>
    <text x="725" y="550" font-size="12">25 sections per template or group</text>
    <text x="725" y="570" font-size="12">50 blocks per section</text>
    <text x="725" y="590" font-size="12">1,000 JSON templates per theme</text>
    <text x="725" y="610" font-size="12">300 theme blocks per theme</text>
    <text x="725" y="630" font-size="12">5 theme presets</text>
    <text x="725" y="650" font-size="12">3,400 strings per locale file</text>
  </g>
</svg>
