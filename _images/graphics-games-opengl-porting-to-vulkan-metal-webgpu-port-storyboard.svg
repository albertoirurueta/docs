<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-graphics-games-opengl-porting-to-vulkan-" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: porting the hello-triangle to a modern API in five steps</text>
<rect x="14" y="50" width="138" height="200" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="30" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="89" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Shaders</text>
<rect x="28" y="100" width="110" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="83.0" y="127.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GLSL to SPIR-V,</text>
<text x="83.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MSL or WGSL</text>
<polygon points="83,180 108,225 58,225" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<line x1="152" y1="150" x2="162" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<rect x="162" y="50" width="138" height="200" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="178" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="178" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="237" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Device</text>
<rect x="176" y="100" width="110" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="231.0" y="127.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">device, queue,</text>
<text x="231.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">swapchain or surface</text>
<polygon points="231,180 256,225 206,225" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="300" y1="150" x2="310" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<rect x="310" y="50" width="138" height="200" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="326" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="385" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Pipeline</text>
<rect x="324" y="100" width="110" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="379.0" y="127.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shaders + state</text>
<text x="379.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">in one object</text>
<polygon points="379,180 404,225 354,225" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="448" y1="150" x2="458" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<rect x="458" y="50" width="138" height="200" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="474" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="533" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Resources</text>
<rect x="472" y="100" width="110" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="527.0" y="127.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex buffer,</text>
<text x="527.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bind groups</text>
<polygon points="527,180 552,225 502,225" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="596" y1="150" x2="606" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-porting-to-vulkan-)"/>
<rect x="606" y="50" width="138" height="200" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="622" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="622" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="681" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Frame</text>
<rect x="620" y="100" width="110" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="675.0" y="127.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">record, submit,</text>
<text x="675.0" y="142.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">present</text>
<polygon points="675,180 700,225 650,225" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The triangle only appears at step 5; each earlier step is a prerequisite that OpenGL hid inside the context.</text>
</svg>
