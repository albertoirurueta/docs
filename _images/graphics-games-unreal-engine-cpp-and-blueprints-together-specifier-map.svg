<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which specifier exposes what to Blueprints</text>
<rect x="15" y="50" width="230" height="235" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="15" y="50" width="230" height="32" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="130" y="72" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">UCLASS</text>
<text x="29" y="104" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Blueprintable</text>
<text x="29" y="120" text-anchor="start" font-size="11" fill="#374151">a Blueprint may subclass it</text>
<text x="29" y="146" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintType</text>
<text x="29" y="162" text-anchor="start" font-size="11" fill="#374151">usable as a variable type</text>
<text x="29" y="188" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">NotBlueprintable</text>
<text x="29" y="204" text-anchor="start" font-size="11" fill="#374151">no Blueprint subclass</text>
<rect x="265" y="50" width="230" height="235" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="265" y="50" width="230" height="32" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="72" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">UPROPERTY</text>
<text x="279" y="104" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintReadOnly</text>
<text x="279" y="120" text-anchor="start" font-size="11" fill="#374151">Get node only</text>
<text x="279" y="146" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintReadWrite</text>
<text x="279" y="162" text-anchor="start" font-size="11" fill="#374151">Get and Set nodes</text>
<text x="279" y="188" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintAssignable</text>
<text x="279" y="204" text-anchor="start" font-size="11" fill="#374151">bind to a multicast delegate</text>
<text x="279" y="230" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintCallable</text>
<text x="279" y="246" text-anchor="start" font-size="11" fill="#374151">broadcast a multicast delegate</text>
<rect x="515" y="50" width="230" height="235" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="515" y="50" width="230" height="32" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="630" y="72" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">UFUNCTION</text>
<text x="529" y="104" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintCallable</text>
<text x="529" y="120" text-anchor="start" font-size="11" fill="#374151">node with exec pins, side effects</text>
<text x="529" y="146" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintPure</text>
<text x="529" y="162" text-anchor="start" font-size="11" fill="#374151">no exec pins, no side effects</text>
<text x="529" y="188" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintImplementableEvent</text>
<text x="529" y="204" text-anchor="start" font-size="11" fill="#374151">Blueprint supplies the body</text>
<text x="529" y="230" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">BlueprintNativeEvent</text>
<text x="529" y="246" text-anchor="start" font-size="11" fill="#374151">C++ default, Blueprint may override</text>
<text x="380" y="312" text-anchor="middle" font-size="10" fill="#374151">Edit specifiers (EditAnywhere, VisibleAnywhere) control the Details panel; Blueprint specifiers control the graph.</text>
</svg>
