<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="sparrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3a3a3a"/>
    </marker>
    <marker id="sparrowweak" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- unique_ptr -->
  <rect x="20" y="20" width="140" height="36" rx="5" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="90" y="43" text-anchor="middle" font-size="12" fill="#1c4b73">unique_ptr&lt;T&gt;</text>
  <rect x="20" y="100" width="140" height="40" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="90" y="125" text-anchor="middle" font-size="12" fill="#2a6636">T object A</text>
  <line x1="90" y1="56" x2="90" y2="96" stroke="#3a3a3a" stroke-width="2" marker-end="url(#sparrow)"/>
  <text x="90" y="170" text-anchor="middle" font-size="11" fill="#555">exclusive owner --</text>
  <text x="90" y="184" text-anchor="middle" font-size="11" fill="#555">only one at a time</text>

  <!-- shared_ptr x2 -->
  <rect x="240" y="10" width="140" height="36" rx="5" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="310" y="33" text-anchor="middle" font-size="12" fill="#1c4b73">shared_ptr&lt;T&gt; s1</text>
  <rect x="240" y="55" width="140" height="36" rx="5" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#1c4b73">shared_ptr&lt;T&gt; s2</text>

  <rect x="240" y="120" width="140" height="60" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="310" y="145" text-anchor="middle" font-size="12" fill="#2a6636">T object B</text>
  <text x="310" y="163" text-anchor="middle" font-size="11" fill="#2a6636">refcount = 2</text>

  <line x1="310" y1="46" x2="310" y2="116" stroke="#3a3a3a" stroke-width="2" marker-end="url(#sparrow)"/>
  <line x1="310" y1="91" x2="310" y2="116" stroke="#3a3a3a" stroke-width="2" marker-end="url(#sparrow)"/>

  <!-- weak_ptr -->
  <rect x="460" y="55" width="140" height="36" rx="5" fill="#eeeeee" stroke="#888" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="530" y="78" text-anchor="middle" font-size="12" fill="#555">weak_ptr&lt;T&gt; w</text>
  <line x1="460" y1="73" x2="384" y2="150" stroke="#888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#sparrowweak)"/>
  <text x="530" y="120" text-anchor="middle" font-size="11" fill="#555">observes B, does NOT</text>
  <text x="530" y="134" text-anchor="middle" font-size="11" fill="#555">increment refcount or</text>
  <text x="530" y="148" text-anchor="middle" font-size="11" fill="#555">keep it alive</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#333">Object B is destroyed only when refcount reaches 0 (both s1 and s2 gone) --</text>
  <text x="320" y="248" text-anchor="middle" font-size="12" fill="#333">w.lock() then returns an empty shared_ptr instead of dangling.</text>
</svg>
