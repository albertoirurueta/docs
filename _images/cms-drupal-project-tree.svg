<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="t">Composer project tree of the Meridian Museum Drupal site</title>
  <desc id="d">The project root holds composer.json, composer.lock, vendor, config/sync, private and recipes outside the web root, and a web directory with core, modules, themes, libraries and sites/default.</desc>
  <rect width="920" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="880" height="520" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="50" font-size="16" font-weight="bold" fill="#0f172a">meridian-museum/ (project root, never served)</text>

  <rect x="40" y="70" width="400" height="450" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="56" y="94" font-weight="bold" fill="#1e3a8a">Outside the web root</text>
  <g fill="#0f172a">
    <text x="56" y="126">composer.json</text><text x="230" y="126" fill="#475569" font-size="12">commit: requirements, scaffold, paths</text>
    <text x="56" y="156">composer.lock</text><text x="230" y="156" fill="#475569" font-size="12">commit: exact versions</text>
    <text x="56" y="186">vendor/</text><text x="230" y="186" fill="#475569" font-size="12">ignore: Composer output</text>
    <text x="56" y="216">config/sync/</text><text x="230" y="216" fill="#475569" font-size="12">commit: exported config</text>
    <text x="56" y="246">private/</text><text x="230" y="246" fill="#475569" font-size="12">ignore: private files</text>
    <text x="56" y="276">recipes/</text><text x="230" y="276" fill="#475569" font-size="12">commit: custom recipes</text>
    <text x="56" y="306">drush/</text><text x="230" y="306" fill="#475569" font-size="12">commit: drush.yml, site aliases</text>
    <text x="56" y="336">.ddev/</text><text x="230" y="336" fill="#475569" font-size="12">commit: config.yaml</text>
    <text x="56" y="366">.gitignore</text><text x="230" y="366" fill="#475569" font-size="12">commit</text>
  </g>
  <text x="56" y="410" font-size="13" fill="#1e3a8a">Nothing here can be requested by URL.</text>
  <text x="56" y="432" font-size="13" fill="#1e3a8a">Secrets and private data live here,</text>
  <text x="56" y="452" font-size="13" fill="#1e3a8a">never under web/.</text>

  <rect x="480" y="70" width="400" height="450" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="496" y="94" font-weight="bold" fill="#14532d">web/ (document root)</text>
  <g fill="#0f172a">
    <text x="496" y="126">core/</text><text x="690" y="126" fill="#475569" font-size="12">ignore: Drupal core</text>
    <text x="496" y="156">index.php, update.php, robots.txt</text><text x="760" y="156" fill="#475569" font-size="12">scaffold</text>
    <text x="496" y="186">modules/contrib/</text><text x="690" y="186" fill="#475569" font-size="12">ignore: Composer</text>
    <text x="496" y="216">modules/custom/meridian_collection/</text>
    <text x="690" y="236" fill="#475569" font-size="12">commit: your code</text>
    <text x="496" y="266">themes/contrib/</text><text x="690" y="266" fill="#475569" font-size="12">ignore: Composer</text>
    <text x="496" y="296">themes/custom/meridian/</text><text x="690" y="296" fill="#475569" font-size="12">commit</text>
    <text x="496" y="326">libraries/</text><text x="690" y="326" fill="#475569" font-size="12">ignore: Composer</text>
    <text x="496" y="356">sites/default/settings.php</text><text x="750" y="376" fill="#475569" font-size="12">commit, no secrets</text>
    <text x="496" y="396">sites/default/settings.local.php</text><text x="750" y="416" fill="#475569" font-size="12">ignore</text>
    <text x="496" y="436">sites/default/files/</text><text x="690" y="436" fill="#475569" font-size="12">ignore: public files</text>
  </g>
  <text x="496" y="480" font-size="13" fill="#14532d">Composer installer paths decide where each</text>
  <text x="496" y="500" font-size="13" fill="#14532d">package type lands under web/.</text>
</svg>
