<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where the media and var paths of Magento live on a cluster</title>
  <desc id="d">Three columns and a delivery path. The S3 bucket pocketcoffee-prod-media, written by the pods with the IAM role pocketcoffee-prod-magento through EKS Pod Identity, holds the key prefix media with catalog product images and their generated cache, wysiwyg, logo, favicon, sitemap and the private folders customer, downloadable, import and custom_options; the key prefix import_export with the files of Admin import and export; and the maintenance flag at the root of the bucket. Per-pod emptyDir volumes hold var with log, report, tmp and resource_config.json, and no volume at all for pub/media in S3 mode. The read-only container image holds the code, generated, pub/static and the baked app/etc/config.php, and the env.php template is mounted from a ConfigMap. Below, the delivery path: the browser asks CloudFront for media.pocketcoffee.example, a CloudFront function denies the private folders, and CloudFront reads the object from the bucket with an origin access control. The pods never serve media in this mode, and the EFS alternative replaces the bucket by the volume pocketcoffee-media mounted at pub/media.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Three homes for the paths Magento writes to</text>

  <rect x="30" y="52" width="290" height="340" rx="10" fill="#2f4a44"/>
  <rect x="335" y="52" width="290" height="340" rx="10" fill="#7a5c3a"/>
  <rect x="640" y="52" width="290" height="340" rx="10" fill="#3f6e9a"/>

  <g fill="#f2f5f8" font-size="12.5">
    <text x="44" y="78" font-size="14" font-weight="bold" fill="#9fd3c7">Shared: S3 bucket, remote storage</text>
    <text x="44" y="96" font-size="12" fill="#9fd3c7">pocketcoffee-prod-media, driver aws-s3</text>
    <rect x="44" y="106" width="262" height="86" rx="8" fill="#3d5266"/>
    <text x="54" y="124" font-weight="bold">media/</text>
    <text x="54" y="141" font-size="11.5">catalog/product, catalog/product/cache</text>
    <text x="54" y="157" font-size="11.5">wysiwyg, logo, favicon, sitemap,</text>
    <text x="54" y="173" font-size="11.5">theme_customization, tmp</text>
    <text x="54" y="187" font-size="11.5" fill="#f4b860">private: customer, downloadable, import</text>
    <rect x="44" y="198" width="262" height="44" rx="8" fill="#3d5266"/>
    <text x="54" y="216" font-weight="bold">import_export/</text>
    <text x="54" y="233" font-size="11.5">files of the Admin import and export</text>
    <rect x="44" y="248" width="262" height="44" rx="8" fill="#3d5266"/>
    <text x="54" y="266" font-weight="bold">.maintenance.flag, .maintenance.ip</text>
    <text x="54" y="283" font-size="11.5">at the root: all pods see the same state</text>
    <text x="44" y="316" font-size="11.5">Pods write with the role</text>
    <text x="44" y="332" font-size="11.5" font-weight="bold">pocketcoffee-prod-magento (Pod Identity)</text>
    <text x="44" y="352" font-size="11.5">The bucket is private; only CloudFront reads</text>
    <text x="44" y="368" font-size="11.5">under media/ (OAC), nobody reads the rest</text>
  </g>

  <g fill="#f2f5f8" font-size="12.5">
    <text x="349" y="78" font-size="14" font-weight="bold" fill="#f4b860">Per pod: emptyDir</text>
    <text x="349" y="96" font-size="12" fill="#f4b860">lost with the pod, rebuilt when needed</text>
    <rect x="349" y="106" width="262" height="62" rx="8" fill="#8a6c4a"/>
    <text x="359" y="124" font-weight="bold">var/log, var/report</text>
    <text x="359" y="141" font-size="11.5">files of this pod; ship them off the pod</text>
    <text x="359" y="157" font-size="11.5">(see operations page)</text>
    <rect x="349" y="174" width="262" height="48" rx="8" fill="#8a6c4a"/>
    <text x="359" y="192" font-weight="bold">var/tmp</text>
    <text x="359" y="209" font-size="11.5">scratch of the image resize and uploads</text>
    <rect x="349" y="228" width="262" height="48" rx="8" fill="#8a6c4a"/>
    <text x="359" y="246" font-weight="bold">var/resource_config.json</text>
    <text x="359" y="263" font-size="11.5">written by pub/get.php, a cache</text>
    <rect x="349" y="282" width="262" height="48" rx="8" fill="#8a6c4a"/>
    <text x="359" y="300" font-weight="bold">pub/media: no volume</text>
    <text x="359" y="317" font-size="11.5">S3 mode: nothing is written there</text>
    <text x="349" y="352" font-size="11.5">var/cache, var/session, var/page_cache stay</text>
    <text x="349" y="368" font-size="11.5">empty: Valkey and Varnish hold that state</text>
  </g>

  <g fill="#f2f5f8" font-size="12.5">
    <text x="654" y="78" font-size="14" font-weight="bold" fill="#f2f5f8">Read-only: container image</text>
    <text x="654" y="96" font-size="12" fill="#cfe3f7">built once per release, never written</text>
    <rect x="654" y="106" width="262" height="48" rx="8" fill="#4d82ae"/>
    <text x="664" y="124" font-weight="bold">app, lib, vendor, generated</text>
    <text x="664" y="141" font-size="11.5">code and compiled DI, setup:di:compile</text>
    <rect x="654" y="160" width="262" height="48" rx="8" fill="#4d82ae"/>
    <text x="664" y="178" font-weight="bold">pub/static</text>
    <text x="664" y="195" font-size="11.5">deployed at build for es_ES, en_GB, en_US</text>
    <rect x="654" y="214" width="262" height="48" rx="8" fill="#4d82ae"/>
    <text x="664" y="232" font-weight="bold">app/etc/config.php</text>
    <text x="664" y="249" font-size="11.5">baked by app:config:dump</text>
    <rect x="654" y="268" width="262" height="48" rx="8" fill="#4d82ae"/>
    <text x="664" y="286" font-weight="bold">app/etc/env.php</text>
    <text x="664" y="303" font-size="11.5">ConfigMap template, read with getenv()</text>
    <text x="654" y="340" font-size="11.5">With media.mode=efs the claim</text>
    <text x="654" y="356" font-size="11.5">pocketcoffee-media replaces the bucket:</text>
    <text x="654" y="372" font-size="11.5">mounted at pub/media, uid and gid 33</text>
  </g>

  <text x="40" y="420" font-size="14" font-weight="bold" fill="#f4b860">Delivery path of one product image</text>
  <g stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,470 L222,470"/>
    <path d="M410,470 L462,470"/>
    <path d="M702,470 L652,470"/>
  </g>
  <g font-size="12.5" fill="#f2f5f8" text-anchor="middle">
    <rect x="40" y="440" width="130" height="60" rx="8" fill="#3d5266"/>
    <text x="105" y="466" font-weight="bold">Browser</text>
    <text x="105" y="484" font-size="11.5">media.pocketcoffee.example</text>
    <rect x="224" y="440" width="186" height="60" rx="8" fill="#3f6e9a"/>
    <text x="317" y="462" font-weight="bold">CloudFront</text>
    <text x="317" y="478" font-size="11.5">function denies private folders</text>
    <text x="317" y="492" font-size="11.5">long cache lifetime</text>
    <rect x="464" y="440" width="186" height="60" rx="8" fill="#2f4a44"/>
    <text x="557" y="462" font-weight="bold">S3 bucket (OAC)</text>
    <text x="557" y="478" font-size="11.5">key media/catalog/product/</text>
    <text x="557" y="492" font-size="11.5">cache/hash/a/b/file.jpg</text>
    <rect x="704" y="440" width="226" height="60" rx="8" fill="#7a5c3a"/>
    <text x="817" y="462" font-weight="bold">Written earlier by a pod</text>
    <text x="817" y="478" font-size="11.5">resize on first render, or the Job</text>
    <text x="817" y="492" font-size="11.5">catalog:images:resize</text>
  </g>
  <text x="40" y="534" font-size="11.5" fill="#cfe3f7">The pods do not appear in the path: the base media URL points to the media host, so no request for an image reaches nginx.</text>
</svg>
