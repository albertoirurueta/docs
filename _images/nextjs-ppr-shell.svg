<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A Partial Prerendering shell with dynamic holes</title>
  <desc id="d">A page is split into a static shell, built once and servable from a CDN, and dynamic holes. The header and a cached catalogue belong to the shell. Two Suspense boundaries, one reading a cookie and one reading the clock, appear in the shell as fallbacks and are filled in by streamed chunks at request time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a65a00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One route, two kinds of output: a static shell and dynamic holes</text>
  <text x="400" y="47" font-size="12" fill="#555555" text-anchor="middle">route / of the Bookshelf, built with cacheComponents: true</text>

  <!-- Page mock-up -->
  <rect x="30" y="68" width="400" height="400" fill="#f7f7f7" stroke="#444444" stroke-width="1.6"/>
  <text x="230" y="90" font-size="12" fill="#555555" text-anchor="middle">what the browser receives first (HTML shell)</text>

  <!-- Static header -->
  <rect x="50" y="102" width="360" height="56" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="66" y="126" font-size="14" font-weight="bold" fill="#1d3557">Bookshelf</text>
  <text x="66" y="146" font-size="12" fill="#333333">static: no I/O, rendered at build time</text>

  <!-- Cached catalogue -->
  <rect x="50" y="172" width="360" height="96" fill="#e9f5ec" stroke="#2c7a3f" stroke-width="1.6"/>
  <text x="66" y="196" font-size="14" font-weight="bold" fill="#1f5a2d">Catalogue</text>
  <text x="66" y="216" font-size="12" fill="#333333">'use cache' + cacheLife('hours'):</text>
  <text x="66" y="234" font-size="12" fill="#333333">the cached result is baked into the shell</text>
  <text x="66" y="252" font-size="12" fill="#333333">and refreshed in the background</text>

  <!-- Hole 1 -->
  <rect x="50" y="282" width="360" height="74" fill="#fff4e0" stroke="#a65a00" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="66" y="306" font-size="14" font-weight="bold" fill="#7a4300">Hole 1: &lt;Suspense&gt; around Greeting</text>
  <text x="66" y="326" font-size="12" fill="#333333">shell shows: "Loading your greeting..."</text>
  <text x="66" y="344" font-size="12" fill="#333333">request time: await cookies()</text>

  <!-- Hole 2 -->
  <rect x="50" y="370" width="360" height="82" fill="#fff4e0" stroke="#a65a00" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="66" y="394" font-size="14" font-weight="bold" fill="#7a4300">Hole 2: &lt;Suspense&gt; around RequestStamp</text>
  <text x="66" y="414" font-size="12" fill="#333333">shell shows: "Loading the clock..."</text>
  <text x="66" y="432" font-size="12" fill="#333333">request time: await connection(), then new Date()</text>

  <!-- Right: how it is served -->
  <text x="610" y="90" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">How the response is built</text>

  <rect x="470" y="104" width="280" height="86" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="610" y="128" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle">Build time</text>
  <text x="610" y="148" font-size="12" fill="#333333" text-anchor="middle">React prerenders until it hits a hole</text>
  <text x="610" y="166" font-size="12" fill="#333333" text-anchor="middle">output: HTML shell + postponed state</text>
  <text x="610" y="182" font-size="12" fill="#333333" text-anchor="middle">+ RSC payload for client navigation</text>

  <line x1="610" y1="190" x2="610" y2="224" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="212" font-size="12" fill="#555555">stored (CDN or disk)</text>

  <rect x="470" y="226" width="280" height="76" fill="#e9f5ec" stroke="#2c7a3f" stroke-width="1.6"/>
  <text x="610" y="250" font-size="14" font-weight="bold" fill="#1f5a2d" text-anchor="middle">Request time, step 1</text>
  <text x="610" y="270" font-size="12" fill="#333333" text-anchor="middle">the shell is sent at once (first byte,</text>
  <text x="610" y="286" font-size="12" fill="#333333" text-anchor="middle">fallbacks included), HTTP status fixed</text>

  <line x1="610" y1="302" x2="610" y2="336" stroke="#a65a00" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <text x="620" y="324" font-size="12" fill="#7a4300">resume(postponed state)</text>

  <rect x="470" y="338" width="280" height="76" fill="#fff4e0" stroke="#a65a00" stroke-width="1.6"/>
  <text x="610" y="362" font-size="14" font-weight="bold" fill="#7a4300" text-anchor="middle">Request time, step 2</text>
  <text x="610" y="382" font-size="12" fill="#333333" text-anchor="middle">only the holes render; each one streams</text>
  <text x="610" y="398" font-size="12" fill="#333333" text-anchor="middle">as a chunk that replaces its fallback</text>

  <!-- Legend -->
  <rect x="470" y="428" width="16" height="12" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="494" y="439" font-size="12" fill="#333333">static</text>
  <rect x="550" y="428" width="16" height="12" fill="#e9f5ec" stroke="#2c7a3f" stroke-width="1.4"/>
  <text x="574" y="439" font-size="12" fill="#333333">cached</text>
  <rect x="640" y="428" width="16" height="12" fill="#fff4e0" stroke="#a65a00" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="664" y="439" font-size="12" fill="#333333">dynamic hole</text>

  <text x="400" y="500" font-size="12" fill="#555555" text-anchor="middle">Static and cached parts are the shell. Everything behind a Suspense boundary that needs request data is a hole.</text>
</svg>
