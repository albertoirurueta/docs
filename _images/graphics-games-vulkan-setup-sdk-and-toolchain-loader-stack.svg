<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-setup-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">From the application to the GPU driver</text>
<rect x="120" y="55" width="520" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="73" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Your application</text>
<text x="380.0" y="91" text-anchor="middle" font-size="11" fill="#3730A3">C++20 + Vulkan-Hpp or C API, GLFW or SDL3 window</text>
<line x1="380" y1="106" x2="380" y2="122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-stack)"/>
<rect x="120" y="123" width="520" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="141" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Vulkan loader</text>
<text x="380.0" y="159" text-anchor="middle" font-size="11" fill="#374151">vulkan-1.dll, libvulkan.so, libvulkan.dylib: finds layers and drivers</text>
<line x1="380" y1="174" x2="380" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-stack)"/>
<rect x="120" y="191" width="520" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="209" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Layers</text>
<text x="380.0" y="227" text-anchor="middle" font-size="11" fill="#92400E">VK_LAYER_KHRONOS_validation and other optional layers</text>
<line x1="380" y1="242" x2="380" y2="258" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-stack)"/>
<rect x="120" y="259" width="520" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="277" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">ICD (driver)</text>
<text x="380.0" y="295" text-anchor="middle" font-size="11" fill="#065F46">one per GPU vendor, or MoltenVK / KosmicKrisp on Apple</text>
<line x1="380" y1="310" x2="380" y2="326" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-stack)"/>
<rect x="120" y="327" width="520" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="345" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">GPU</text>
<text x="380.0" y="363" text-anchor="middle" font-size="11" fill="#374151">executes the command buffers</text>
<text x="60" y="150" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">SDK</text>
<text x="60" y="166" text-anchor="middle" font-size="11" fill="#374151">headers,</text>
<text x="60" y="180" text-anchor="middle" font-size="11" fill="#374151">loader,</text>
<text x="60" y="194" text-anchor="middle" font-size="11" fill="#374151">layers</text>
<text x="700" y="290" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">installed</text>
<text x="700" y="306" text-anchor="middle" font-size="11" fill="#065F46">with the</text>
<text x="700" y="322" text-anchor="middle" font-size="11" fill="#065F46">GPU driver</text>
</svg>
