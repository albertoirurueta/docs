<svg viewBox="0 0 940 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vsArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/>
    </marker>
    <marker id="vsArrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a4d9c"/>
    </marker>
    <marker id="vsArrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1e6b34"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The ValueStack inside the ActionContext (one pair per request)</text>
  <text x="470" y="47" font-size="12" fill="#666666" text-anchor="middle">Struts 7.4.0 on the Bookshelf ModelShelfAction: the stack is the OGNL root, the context map is everything reached with #</text>

  <!-- ActionContext / OGNL context map -->
  <rect x="24" y="64" width="600" height="496" rx="10" fill="#f7f9fc" stroke="#1a4d9c" stroke-width="2"/>
  <text x="40" y="88" font-size="14" font-weight="bold" fill="#133a75">ActionContext = the OGNL context map (a Map held in a ThreadLocal)</text>
  <text x="40" y="105" font-size="11" fill="#1a4d9c">ActionContext.getContext() returns it; ValueStack.getContext() returns the same map</text>

  <!-- ValueStack -->
  <rect x="44" y="126" width="270" height="352" rx="8" fill="#e6f4ea" stroke="#1e6b34" stroke-width="2"/>
  <text x="58" y="148" font-size="14" font-weight="bold" fill="#14501f">ValueStack (OGNL root)</text>
  <text x="58" y="164" font-size="11" fill="#1e6b34">CompoundRoot: a list of objects</text>

  <rect x="62" y="180" width="234" height="62" fill="#ffffff" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="72" y="199" font-size="12" font-weight="bold" fill="#14501f">[0] Book (top)</text>
  <text x="72" y="215" font-size="11" fill="#333333">pushed by the modelDriven interceptor</text>
  <text x="72" y="231" font-size="11" fill="#333333">getTitle(), getAuthor(), getYear()</text>

  <rect x="62" y="250" width="234" height="62" fill="#ffffff" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="72" y="269" font-size="12" font-weight="bold" fill="#14501f">[1] ModelShelfAction</text>
  <text x="72" y="285" font-size="11" fill="#333333">the action, pushed before the</text>
  <text x="72" y="301" font-size="11" fill="#333333">interceptors run; getTitle() too</text>

  <rect x="62" y="320" width="234" height="62" fill="#ffffff" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="72" y="339" font-size="12" font-weight="bold" fill="#14501f">[2] DefaultTextProvider</text>
  <text x="72" y="355" font-size="11" fill="#333333">always the bottom element of a</text>
  <text x="72" y="371" font-size="11" fill="#333333">new stack (a TextProvider)</text>

  <text x="58" y="404" font-size="11" fill="#1e6b34">s:push, s:iterator, s:bean, the</text>
  <text x="58" y="418" font-size="11" fill="#1e6b34">modelDriven interceptor and</text>
  <text x="58" y="432" font-size="11" fill="#1e6b34">ValueStack.set() put objects on top</text>
  <text x="58" y="446" font-size="11" fill="#1e6b34">and pop them off afterwards</text>
  <text x="58" y="466" font-size="11" font-weight="bold" fill="#14501f">plain name: search top, then down</text>

  <!-- search arrow -->
  <line x1="324" y1="190" x2="324" y2="368" stroke="#1e6b34" stroke-width="2" marker-end="url(#vsArrowGreen)"/>
  <text x="332" y="282" font-size="10" fill="#1e6b34" transform="rotate(90 332 282)">first match wins</text>

  <!-- context map entries -->
  <rect x="352" y="126" width="256" height="352" rx="8" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="366" y="148" font-size="14" font-weight="bold" fill="#133a75">other keys of the map (use #)</text>

  <rect x="366" y="160" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="175" font-size="12" font-weight="bold" fill="#133a75">#session</text>
  <text x="374" y="188" font-size="10" fill="#333333">HttpSession attributes (a Map)</text>

  <rect x="366" y="198" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="213" font-size="12" font-weight="bold" fill="#133a75">#request</text>
  <text x="374" y="226" font-size="10" fill="#333333">request attributes (a Map)</text>

  <rect x="366" y="236" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="251" font-size="12" font-weight="bold" fill="#133a75">#application</text>
  <text x="374" y="264" font-size="10" fill="#333333">ServletContext attributes (a Map)</text>

  <rect x="366" y="274" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="289" font-size="12" font-weight="bold" fill="#133a75">#parameters</text>
  <text x="374" y="302" font-size="10" fill="#333333">request parameters (HttpParameters)</text>

  <rect x="366" y="312" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="327" font-size="12" font-weight="bold" fill="#133a75">#attr</text>
  <text x="374" y="340" font-size="10" fill="#333333">page, then request, session, application</text>

  <rect x="366" y="350" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="365" font-size="12" font-weight="bold" fill="#133a75">#action</text>
  <text x="374" y="378" font-size="10" fill="#333333">the current action (also on the stack)</text>

  <rect x="366" y="388" width="228" height="34" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="374" y="403" font-size="12" font-weight="bold" fill="#133a75">#root, #this, #var</text>
  <text x="374" y="416" font-size="10" fill="#333333">built-ins, and s:set variables</text>

  <rect x="366" y="426" width="228" height="42" fill="#ffffff" stroke="#1a4d9c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="374" y="441" font-size="11" font-weight="bold" fill="#133a75">org.apache.struts2.ActionContext.*</text>
  <text x="374" y="455" font-size="10" fill="#333333">locale, name, container, conversionErrors,</text>
  <text x="374" y="466" font-size="10" fill="#333333">and the key that holds the stack itself</text>

  <text x="40" y="508" font-size="11" fill="#133a75">Both halves are created for every request by the Dispatcher and live only as long as the request.</text>
  <text x="40" y="524" font-size="11" fill="#133a75">Nothing is shared between two requests: actions need no thread safety, the stack is garbage afterwards.</text>
  <text x="40" y="540" font-size="11" fill="#133a75">In the JSP the stack is reached through the request (struts.valueStack), not through a servlet API of its own.</text>

  <!-- right: expressions -->
  <rect x="650" y="64" width="268" height="496" rx="10" fill="#fffaf0" stroke="#a15c00" stroke-width="1.8"/>
  <text x="664" y="88" font-size="14" font-weight="bold" fill="#7a4500">Where an expression is looked up</text>

  <rect x="664" y="102" width="240" height="64" fill="#ffffff" stroke="#a15c00" stroke-width="1.2"/>
  <text x="672" y="119" font-size="12" font-weight="bold" fill="#7a4500">title</text>
  <text x="672" y="135" font-size="10" fill="#333333">stack, top down: Book.getTitle()</text>
  <text x="672" y="149" font-size="10" fill="#333333">wins over the action getTitle()</text>

  <rect x="664" y="174" width="240" height="64" fill="#ffffff" stroke="#a15c00" stroke-width="1.2"/>
  <text x="672" y="191" font-size="12" font-weight="bold" fill="#7a4500">[1].title</text>
  <text x="672" y="207" font-size="10" fill="#333333">cut the stack at element 1, then</text>
  <text x="672" y="221" font-size="10" fill="#333333">search down: the action's own getter</text>

  <rect x="664" y="246" width="240" height="64" fill="#ffffff" stroke="#a15c00" stroke-width="1.2"/>
  <text x="672" y="263" font-size="12" font-weight="bold" fill="#7a4500">#session.user</text>
  <text x="672" y="279" font-size="10" fill="#333333">not the stack: the key "session"</text>
  <text x="672" y="293" font-size="10" fill="#333333">of the context map, then get("user")</text>

  <rect x="664" y="318" width="240" height="64" fill="#ffffff" stroke="#a15c00" stroke-width="1.2"/>
  <text x="672" y="335" font-size="12" font-weight="bold" fill="#7a4500">%{filter} in a String attribute</text>
  <text x="672" y="351" font-size="10" fill="#333333">the tag evaluates what is inside</text>
  <text x="672" y="365" font-size="10" fill="#333333">%{ } as OGNL against the stack</text>

  <rect x="664" y="390" width="240" height="64" fill="#ffffff" stroke="#a15c00" stroke-width="1.2"/>
  <text x="672" y="407" font-size="12" font-weight="bold" fill="#7a4500">${filter} (JSP EL)</text>
  <text x="672" y="423" font-size="10" fill="#333333">request.getAttribute("filter"): the</text>
  <text x="672" y="437" font-size="10" fill="#333333">request wrapper asks the stack next</text>

  <rect x="664" y="462" width="240" height="84" fill="#ffffff" stroke="#a15c00" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="672" y="479" font-size="12" font-weight="bold" fill="#7a4500">session (no #)</text>
  <text x="672" y="495" font-size="10" fill="#333333">stack finds nothing, then the context</text>
  <text x="672" y="509" font-size="10" fill="#333333">fallback returns the context entry;</text>
  <text x="672" y="523" font-size="10" fill="#333333">off with valueStackFallbackToContext</text>
  <text x="672" y="537" font-size="10" fill="#333333">set to false</text>

  <!-- bottom strip -->
  <rect x="24" y="576" width="894" height="48" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <text x="40" y="596" font-size="12" font-weight="bold" fill="#333333">Reading order of the picture</text>
  <text x="40" y="612" font-size="11" fill="#333333">no marker = ask the stack (green), # = ask the context map (blue), %{ } = tell a tag attribute to evaluate; the green and blue boxes are one object graph.</text>
</svg>
