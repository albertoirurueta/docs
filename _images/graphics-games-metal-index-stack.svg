<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where Metal sits in the Apple graphics stack</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="140" y="48" width="480" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="158" cy="68" r="11" fill="#4F46E5"/><text x="158" y="72.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="170" y="72" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Your app</text>
<text x="170" y="89" font-size="11" fill="#374151" text-anchor="start">SwiftUI, UIKit and AppKit views, RealityKit scenes, game engines such as Unity and Unreal</text>
<line x1="380" y1="100" x2="380" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="114" width="480" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="158" cy="134" r="11" fill="#4F46E5"/><text x="158" y="138.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="170" y="138" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">MetalKit and the helper frameworks</text>
<text x="170" y="155" font-size="11" fill="#374151" text-anchor="start">MTKView, MTKTextureLoader, Model I/O, MetalFX, Metal Performance Shaders, Compositor Services</text>
<line x1="380" y1="166" x2="380" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="180" width="480" height="52" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="158" cy="200" r="11" fill="#B45309"/><text x="158" y="204.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="170" y="204" font-size="13" fill="#92400E" text-anchor="start" font-weight="bold">Metal</text>
<text x="170" y="221" font-size="11" fill="#374151" text-anchor="start">MTLDevice, MTL4CommandQueue, pipelines, resources and Metal Shading Language shaders</text>
<line x1="380" y1="232" x2="380" y2="246" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="246" width="480" height="52" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="158" cy="266" r="11" fill="#4B5563"/><text x="158" y="270.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="170" y="270" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Metal driver and system</text>
<text x="170" y="287" font-size="11" fill="#374151" text-anchor="start">compiles AIR to GPU code, manages memory residency, presents drawables</text>
<line x1="380" y1="298" x2="380" y2="312" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="312" width="480" height="52" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<circle cx="158" cy="332" r="11" fill="#047857"/><text x="158" y="336.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="170" y="336" font-size="13" fill="#065F46" text-anchor="start" font-weight="bold">Apple silicon GPU</text>
<text x="170" y="353" font-size="11" fill="#374151" text-anchor="start">unified memory, tile-based deferred rendering, hardware ray tracing on A17 and M3 or later</text>
<text x="380" y="386" font-size="11" fill="#374151" text-anchor="middle">SceneKit is in maintenance; RealityKit and Metal are the current routes for 3D on Apple platforms</text>
</svg>
