<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Quality tiers: one URP asset per Quality level (example values for the Bookshelf)</text>
<rect x="20" y="44" width="720" height="26" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="60.9" text-anchor="middle" font-size="11" fill="#374151">QualitySettings.SetQualityLevel(i) activates the URP asset assigned to level i. Change levels on a loading screen, not mid-frame.</text>
<rect x="20" y="84" width="232" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="136.0" y="103.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Low (phone)</text>
<rect x="20" y="134" width="232" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="136.0" y="152.2" text-anchor="middle" font-size="12" fill="#374151">URP-Low.asset</text>
<line x1="136.0" y1="114" x2="136.0" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="172" width="232" height="136" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="136.0" y="208.8" text-anchor="middle" font-size="11" fill="#374151">Rendering path: Forward</text>
<text x="136.0" y="222.8" text-anchor="middle" font-size="11" fill="#374151">Render scale 0.7 + STP off</text>
<text x="136.0" y="236.8" text-anchor="middle" font-size="11" fill="#374151">MSAA: off, HDR: off</text>
<text x="136.0" y="250.8" text-anchor="middle" font-size="11" fill="#374151">Shadows: main light, 25 m</text>
<text x="136.0" y="264.9" text-anchor="middle" font-size="11" fill="#374151">Soft shadows: off</text>
<text x="136.0" y="278.9" text-anchor="middle" font-size="11" fill="#374151">Additional lights: 4 per object</text>
<rect x="266" y="84" width="232" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="382.0" y="103.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Medium (laptop)</text>
<rect x="266" y="134" width="232" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="152.2" text-anchor="middle" font-size="12" fill="#374151">URP-Medium.asset</text>
<line x1="382.0" y1="114" x2="382.0" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="266" y="172" width="232" height="136" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="208.8" text-anchor="middle" font-size="11" fill="#374151">Rendering path: Forward+</text>
<text x="382.0" y="222.8" text-anchor="middle" font-size="11" fill="#374151">Render scale 1.0</text>
<text x="382.0" y="236.8" text-anchor="middle" font-size="11" fill="#374151">MSAA: 2x, HDR: on</text>
<text x="382.0" y="250.8" text-anchor="middle" font-size="11" fill="#374151">Shadows: 50 m, 2 cascades</text>
<text x="382.0" y="264.9" text-anchor="middle" font-size="11" fill="#374151">Soft shadows: low</text>
<text x="382.0" y="278.9" text-anchor="middle" font-size="11" fill="#374151">GPU Resident Drawer: on</text>
<rect x="512" y="84" width="232" height="30" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="628.0" y="103.5" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">High (desktop)</text>
<rect x="512" y="134" width="232" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="628.0" y="152.2" text-anchor="middle" font-size="12" fill="#374151">URP-High.asset</text>
<line x1="628.0" y1="114" x2="628.0" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="512" y="172" width="232" height="136" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="628.0" y="208.8" text-anchor="middle" font-size="11" fill="#374151">Rendering path: Forward+</text>
<text x="628.0" y="222.8" text-anchor="middle" font-size="11" fill="#374151">Render scale 0.77 + STP</text>
<text x="628.0" y="236.8" text-anchor="middle" font-size="11" fill="#374151">TAA instead of MSAA</text>
<text x="628.0" y="250.8" text-anchor="middle" font-size="11" fill="#374151">Shadows: 100 m, 4 cascades</text>
<text x="628.0" y="264.9" text-anchor="middle" font-size="11" fill="#374151">Soft shadows: medium</text>
<text x="628.0" y="278.9" text-anchor="middle" font-size="11" fill="#374151">GPU occlusion culling: on</text>
<rect x="20" y="320" width="720" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="346.9" text-anchor="middle" font-size="11" fill="#92400E">STP needs temporal anti-aliasing, so it replaces MSAA on the cameras that use it (the two cannot be combined).</text>
<text x="380.0" y="360.9" text-anchor="middle" font-size="11" fill="#92400E">These numbers are examples to show how tiers differ, not recommended defaults: measure on the target device.</text>
</svg>
