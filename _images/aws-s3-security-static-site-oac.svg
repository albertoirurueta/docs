<svg viewBox="0 0 900 400" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3c4a58"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b42318"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf static site: private bucket served through CloudFront with OAC</text>

  <rect x="20" y="140" width="130" height="90" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.8"/>
  <text x="85" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Browser</text>
  <text x="85" y="190" text-anchor="middle" font-size="11" fill="#3c4a58">HTTPS only</text>
  <text x="85" y="206" text-anchor="middle" font-size="11" fill="#3c4a58">www.example.com</text>

  <rect x="230" y="110" width="210" height="150" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="335" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">CloudFront bookshelf-cdn</text>
  <text x="335" y="160" text-anchor="middle" font-size="11" fill="#123a72">viewer HTTPS, ACM cert (us-east-1)</text>
  <text x="335" y="178" text-anchor="middle" font-size="11" fill="#123a72">default root object index.html</text>
  <text x="335" y="196" text-anchor="middle" font-size="11" fill="#123a72">cache policy, response headers</text>
  <rect x="250" y="212" width="170" height="36" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="335" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Origin access control</text>
  <text x="335" y="241" text-anchor="middle" font-size="10" fill="#123a72">signs requests with SigV4</text>

  <rect x="540" y="90" width="340" height="200" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="556" y="112" font-size="13" font-weight="700" fill="#3c4a58">S3 bucket bookshelf-web-ACCOUNT_ID (private)</text>
  <rect x="556" y="126" width="150" height="48" rx="6" fill="#e6f4ea" stroke="#1e8e3e"/>
  <text x="631" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Block Public Access</text>
  <text x="631" y="162" text-anchor="middle" font-size="10" fill="#14532d">all four settings on</text>
  <rect x="714" y="126" width="150" height="48" rx="6" fill="#e6f4ea" stroke="#1e8e3e"/>
  <text x="789" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Ownership enforced</text>
  <text x="789" y="162" text-anchor="middle" font-size="10" fill="#14532d">ACLs disabled</text>
  <rect x="556" y="184" width="308" height="44" rx="6" fill="#fff4e0" stroke="#d98a00"/>
  <text x="710" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#6b4300">Bucket policy</text>
  <text x="710" y="219" text-anchor="middle" font-size="10" fill="#6b4300">allow cloudfront.amazonaws.com s3:GetObject if SourceArn = distribution</text>
  <rect x="556" y="238" width="308" height="40" rx="6" fill="#eef1f4" stroke="#5c6b7a"/>
  <text x="710" y="262" text-anchor="middle" font-size="11" fill="#3c4a58">index.html, assets/*.js, assets/*.css (SSE-S3)</text>

  <line x1="150" y1="185" x2="228" y2="185" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="185" x2="538" y2="185" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <text x="489" y="176" text-anchor="middle" font-size="10" fill="#3c4a58">signed GET</text>

  <rect x="230" y="320" width="310" height="52" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1.6"/>
  <text x="385" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1b12">Direct request to the S3 URL</text>
  <text x="385" y="358" text-anchor="middle" font-size="11" fill="#7a1b12">403 Access Denied: no policy grants the public</text>
  <line x1="85" y1="232" x2="85" y2="346" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="85" y1="346" x2="228" y2="346" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrRed)"/>
  <line x1="540" y1="346" x2="700" y2="346" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="700" y1="346" x2="700" y2="292" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrRed)"/>
</svg>
