<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">OpenTofu layout of the Pocket Coffee Magento platform</title>
  <desc id="d">One root module in the infra directory with an S3 state backend and two workspaces, staging and production. Inside the VPC in eu-west-1 across three Availability Zones: public subnets with the load balancer and NAT gateways; private subnets with the EKS Auto Mode cluster pocketcoffee-prod running the web, Varnish, consumer, cron and Job workloads, plus the Amazon OpenSearch Service domain with fine-grained access control and the Amazon MQ for RabbitMQ 4.3 cluster; database subnets with the RDS for MySQL 8.4 instance pocketcoffee-prod and the parameter group pocketcoffee-magento-mysql84; ElastiCache subnets with two Valkey replication groups, pocketcoffee-prod-cache for the Magento cache and pocketcoffee-prod-session for sessions. Outside the VPC: the S3 media bucket behind CloudFront, an optional EFS file system, ECR with the repositories pocketcoffee/magento and pocketcoffee/varnish, Secrets Manager with the secret pocketcoffee/prod/magento, a KMS key, ACM certificates and a regional WAF web ACL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2f5f8"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">infra/: one root module, one environment per workspace</text>
  <rect x="30" y="50" width="900" height="34" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="480" y="72" font-size="13" fill="#f2f5f8" text-anchor="middle">S3 state backend (use_lockfile)  |  workspace staging: pocketcoffee-staging  |  workspace production: pocketcoffee-prod</text>

  <rect x="30" y="100" width="640" height="480" rx="12" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="46" y="122" font-size="14" font-weight="bold" fill="#9fd3c7">VPC, eu-west-1, three Availability Zones</text>

  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="50" y="136" width="600" height="56" rx="8" fill="#3d5266"/>
    <text x="350" y="158" font-weight="bold">Public subnets</text>
    <text x="350" y="178">Application load balancer, NAT gateways, S3 gateway endpoint</text>

    <rect x="50" y="202" width="600" height="150" rx="8" fill="#3f6e9a"/>
    <text x="350" y="224" font-weight="bold">Private subnets (/20 each)</text>
    <rect x="70" y="236" width="270" height="104" rx="6" fill="#2f4a44"/>
    <text x="205" y="258" font-weight="bold">EKS Auto Mode: pocketcoffee-prod</text>
    <text x="205" y="278">web and optional admin pods</text>
    <text x="205" y="296">Varnish StatefulSet, consumers</text>
    <text x="205" y="314">cron, install and migrate Jobs</text>
    <text x="205" y="332">Pod Identity: S3 role, ESO role</text>
    <rect x="360" y="236" width="270" height="48" rx="6" fill="#7a5c3a"/>
    <text x="495" y="256" font-weight="bold">OpenSearch 3.5 domain</text>
    <text x="495" y="274">3 zones, fine-grained access control</text>
    <rect x="360" y="292" width="270" height="48" rx="6" fill="#4d7c5a"/>
    <text x="495" y="312" font-weight="bold">Amazon MQ: RabbitMQ 4.3</text>
    <text x="495" y="330">cluster, AMQP over TLS 5671</text>

    <rect x="50" y="362" width="290" height="80" rx="8" fill="#7a5c3a"/>
    <text x="195" y="386" font-weight="bold">Database subnets</text>
    <text x="195" y="406">RDS for MySQL 8.4, Multi-AZ</text>
    <text x="195" y="424">users mg_app and mg_migrate</text>

    <rect x="360" y="362" width="290" height="80" rx="8" fill="#3d5266"/>
    <text x="505" y="386" font-weight="bold">ElastiCache subnets</text>
    <text x="505" y="406">Valkey pocketcoffee-prod-cache</text>
    <text x="505" y="424">Valkey pocketcoffee-prod-session</text>

    <rect x="50" y="452" width="600" height="116" rx="8" fill="#33485c"/>
    <text x="350" y="474" font-weight="bold" fill="#f4b860">Security groups: only the cluster reaches the data tier</text>
    <text x="350" y="496">3306 to RDS  |  443 to OpenSearch and the MQ management API</text>
    <text x="350" y="516">5671 to Amazon MQ  |  6379 to both Valkey groups  |  2049 to EFS</text>
    <text x="350" y="538">Source of every rule: the cluster primary security group</text>
  </g>

  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="700" y="100" width="230" height="56" rx="8" fill="#4d7c5a"/>
    <text x="815" y="122" font-weight="bold">S3 media bucket</text><text x="815" y="140">pocketcoffee-prod-media, CloudFront</text>
    <rect x="700" y="164" width="230" height="56" rx="8" fill="#4d7c5a"/>
    <text x="815" y="186" font-weight="bold">EFS (media.mode=efs)</text><text x="815" y="204">access point UID and GID 33</text>
    <rect x="700" y="228" width="230" height="56" rx="8" fill="#3d5266"/>
    <text x="815" y="250" font-weight="bold">ECR</text><text x="815" y="268">pocketcoffee/magento and /varnish</text>
    <rect x="700" y="292" width="230" height="56" rx="8" fill="#7a5c3a"/>
    <text x="815" y="314" font-weight="bold">Secrets Manager</text><text x="815" y="332">pocketcoffee/prod/magento</text>
    <rect x="700" y="356" width="230" height="56" rx="8" fill="#3f6e9a"/>
    <text x="815" y="378" font-weight="bold">KMS key</text><text x="815" y="396">RDS, data tier, secrets, EFS</text>
    <rect x="700" y="420" width="230" height="56" rx="8" fill="#4d7c5a"/>
    <text x="815" y="442" font-weight="bold">ACM certificates</text><text x="815" y="460">regional site, us-east-1 media</text>
    <rect x="700" y="484" width="230" height="56" rx="8" fill="#2f4a44"/>
    <text x="815" y="506" font-weight="bold">WAF web ACL</text><text x="815" y="524">Admin allow-list, rate limit</text>
    <text x="815" y="568" fill="#f4b860" font-weight="bold">Outside the VPC</text>
  </g>
</svg>
