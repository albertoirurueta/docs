<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf on Express: the components built in this section</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">one Express app, several routers, and the services around it</text>

  <!-- clients -->
  <rect x="20" y="70" width="150" height="170" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="95" y="92" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="95" y="120" font-size="11" fill="#444444" text-anchor="middle">browser (admin area)</text>
  <text x="95" y="142" font-size="11" fill="#444444" text-anchor="middle">SPA with JWT and CORS</text>
  <text x="95" y="164" font-size="11" fill="#444444" text-anchor="middle">curl and supertest</text>
  <text x="95" y="186" font-size="11" fill="#444444" text-anchor="middle">SSE and Socket.IO clients</text>
  <text x="95" y="208" font-size="11" fill="#444444" text-anchor="middle">GraphQL clients</text>

  <!-- proxy -->
  <rect x="200" y="70" width="70" height="170" fill="#fdf3e1" stroke="#a15c00" stroke-width="1.6"/>
  <text x="235" y="92" font-size="12" font-weight="bold" fill="#a15c00" text-anchor="middle">Proxy</text>
  <text x="235" y="130" font-size="10" fill="#444444" text-anchor="middle">TLS</text>
  <text x="235" y="150" font-size="10" fill="#444444" text-anchor="middle">trust proxy</text>
  <text x="235" y="170" font-size="10" fill="#444444" text-anchor="middle">X-Forwarded-*</text>

  <!-- app -->
  <rect x="300" y="70" width="270" height="170" fill="#eef5ea" stroke="#2f5424" stroke-width="1.6"/>
  <text x="435" y="92" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">bookshelf-api (Express 5 app)</text>
  <text x="435" y="116" font-size="11" fill="#444444" text-anchor="middle">helmet, cors, json, session, morgan</text>
  <text x="435" y="136" font-size="11" fill="#444444" text-anchor="middle">routers: /api/v1/books, reviews, authors</text>
  <text x="435" y="156" font-size="11" fill="#444444" text-anchor="middle">/admin views, /graphql, /events</text>
  <text x="435" y="176" font-size="11" fill="#444444" text-anchor="middle">Passport and JWT, multer uploads</text>
  <text x="435" y="196" font-size="11" fill="#444444" text-anchor="middle">validation, problem-details errors</text>
  <text x="435" y="216" font-size="11" fill="#444444" text-anchor="middle">/healthz, graceful shutdown</text>

  <!-- data -->
  <rect x="600" y="70" width="140" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="670" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Databases</text>
  <text x="670" y="118" font-size="11" fill="#444444" text-anchor="middle">node:sqlite, PostgreSQL</text>
  <rect x="600" y="160" width="140" height="80" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="670" y="184" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">MongoDB</text>
  <text x="670" y="208" font-size="11" fill="#444444" text-anchor="middle">Mongoose, sessions</text>
  <text x="670" y="224" font-size="11" fill="#444444" text-anchor="middle">connect-mongo</text>

  <!-- arrows -->
  <line x1="170" y1="155" x2="198" y2="155" stroke="#444444" stroke-width="1.6"/>
  <polygon points="198,155 188,150 188,160" fill="#444444"/>
  <line x1="270" y1="155" x2="298" y2="155" stroke="#444444" stroke-width="1.6"/>
  <polygon points="298,155 288,150 288,160" fill="#444444"/>
  <line x1="570" y1="105" x2="598" y2="105" stroke="#444444" stroke-width="1.6"/>
  <polygon points="598,105 588,100 588,110" fill="#444444"/>
  <line x1="570" y1="200" x2="598" y2="200" stroke="#444444" stroke-width="1.6"/>
  <polygon points="598,200 588,195 588,205" fill="#444444"/>

  <!-- uploads -->
  <rect x="300" y="280" width="130" height="64" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="365" y="304" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cover storage</text>
  <text x="365" y="324" font-size="11" fill="#444444" text-anchor="middle">disk or object store</text>
  <line x1="365" y1="240" x2="365" y2="278" stroke="#444444" stroke-width="1.6"/>
  <polygon points="365,278 360,268 370,268" fill="#444444"/>

  <!-- realtime -->
  <rect x="450" y="280" width="120" height="64" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="510" y="304" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Real time</text>
  <text x="510" y="324" font-size="11" fill="#444444" text-anchor="middle">ws, Socket.IO, SSE</text>
  <line x1="510" y1="240" x2="510" y2="278" stroke="#444444" stroke-width="1.6"/>
  <polygon points="510,278 505,268 515,268" fill="#444444"/>

  <!-- tests -->
  <rect x="20" y="280" width="260" height="64" fill="#e8eef8" stroke="#1f4e8c" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="150" y="304" font-size="12" font-weight="bold" fill="#1f4e8c" text-anchor="middle">Tests</text>
  <text x="150" y="324" font-size="11" fill="#444444" text-anchor="middle">supertest and node:test import the app, never listen</text>

  <!-- deployment -->
  <rect x="20" y="370" width="720" height="70" fill="#fdf3e1" stroke="#a15c00" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="380" y="394" font-size="13" font-weight="bold" fill="#a15c00" text-anchor="middle">Production</text>
  <text x="380" y="416" font-size="11" fill="#444444" text-anchor="middle">Docker image, NODE_ENV=production, health checks, graceful shutdown, reverse proxy, multiple processes</text>
</svg>
