<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Main axis vs. cross axis in Yoga</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">flexDirection picks the main axis -- React Native defaults to 'column', unlike web CSS Flexbox's 'row' default</text>

  <defs>
    <marker id="fa-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Panel A: flexDirection: column -->
  <text x="195" y="62" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">flexDirection: 'column' (default)</text>

  <!-- cross axis arrow (horizontal, above container) -->
  <line x1="110" y1="78" x2="280" y2="78" stroke="#a33" stroke-width="1.4" marker-end="url(#fa-arrow)"/>
  <text x="195" y="72" font-size="10.5" font-weight="bold" fill="#a33" text-anchor="middle">cross axis (alignItems)</text>

  <!-- main axis arrow (vertical, left of container) -->
  <line x1="94" y1="94" x2="94" y2="350" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#fa-arrow)"/>
  <text x="70" y="222" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle" transform="rotate(-90,70,222)">main axis (justifyContent)</text>

  <!-- container -->
  <rect x="110" y="94" width="170" height="256" rx="8" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>

  <!-- items stacked vertically -->
  <rect x="125" y="109" width="140" height="60" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="195" y="143" font-size="10.5" fill="#1c4b73" text-anchor="middle">item 1</text>
  <rect x="125" y="179" width="140" height="60" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="195" y="213" font-size="10.5" fill="#8a5a1c" text-anchor="middle">item 2</text>
  <rect x="125" y="249" width="140" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="195" y="283" font-size="10.5" fill="#2d6a34" text-anchor="middle">item 3</text>

  <!-- justifyContent sample ticks along main axis -->
  <circle cx="94" cy="109" r="2.6" fill="#1c4b73"/>
  <text x="86" y="107" font-size="8.5" fill="#1c4b73" text-anchor="end">flex-start</text>
  <circle cx="94" cy="222" r="2.6" fill="#1c4b73"/>
  <text x="86" y="220" font-size="8.5" fill="#1c4b73" text-anchor="end">center</text>
  <circle cx="94" cy="335" r="2.6" fill="#1c4b73"/>
  <text x="86" y="333" font-size="8.5" fill="#1c4b73" text-anchor="end">flex-end</text>

  <!-- alignItems sample ticks along cross axis -->
  <circle cx="110" cy="78" r="2.6" fill="#a33"/>
  <text x="110" y="90" font-size="8.5" fill="#a33" text-anchor="middle">start</text>
  <circle cx="280" cy="78" r="2.6" fill="#a33"/>
  <text x="280" y="90" font-size="8.5" fill="#a33" text-anchor="middle">end</text>

  <text x="195" y="373" font-size="9" fill="#555555" text-anchor="middle">justifyContent: flex-start | flex-end | center | space-between | space-around | space-evenly</text>
  <text x="195" y="387" font-size="9" fill="#555555" text-anchor="middle">alignItems / alignSelf: flex-start | flex-end | center | stretch | baseline</text>

  <!-- Panel B: flexDirection: row -->
  <text x="610" y="62" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">flexDirection: 'row'</text>

  <!-- cross axis arrow (vertical, left of container) -->
  <line x1="444" y1="94" x2="444" y2="264" stroke="#a33" stroke-width="1.4" marker-end="url(#fa-arrow)"/>
  <text x="424" y="179" font-size="10.5" font-weight="bold" fill="#a33" text-anchor="middle" transform="rotate(-90,424,179)">cross axis (alignItems)</text>

  <!-- main axis arrow (horizontal, below container) -->
  <line x1="460" y1="280" x2="760" y2="280" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#fa-arrow)"/>
  <text x="610" y="298" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">main axis (justifyContent)</text>

  <!-- container -->
  <rect x="460" y="94" width="300" height="170" rx="8" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>

  <!-- items side by side -->
  <rect x="475" y="109" width="83" height="140" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="516.5" y="183" font-size="10.5" fill="#1c4b73" text-anchor="middle">item 1</text>
  <rect x="568" y="109" width="83" height="140" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="609.5" y="183" font-size="10.5" fill="#8a5a1c" text-anchor="middle">item 2</text>
  <rect x="661" y="109" width="83" height="140" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="702.5" y="183" font-size="10.5" fill="#2d6a34" text-anchor="middle">item 3</text>

  <!-- justifyContent sample ticks along main axis -->
  <circle cx="475" cy="280" r="2.6" fill="#1c4b73"/>
  <text x="475" y="272" font-size="8.5" fill="#1c4b73" text-anchor="middle">start</text>
  <circle cx="610" cy="280" r="2.6" fill="#1c4b73"/>
  <text x="610" y="272" font-size="8.5" fill="#1c4b73" text-anchor="middle">center</text>
  <circle cx="744" cy="280" r="2.6" fill="#1c4b73"/>
  <text x="744" y="272" font-size="8.5" fill="#1c4b73" text-anchor="middle">end</text>

  <!-- alignItems sample ticks along cross axis -->
  <circle cx="444" cy="109" r="2.6" fill="#a33"/>
  <text x="436" y="107" font-size="8.5" fill="#a33" text-anchor="end">flex-start</text>
  <circle cx="444" cy="249" r="2.6" fill="#a33"/>
  <text x="436" y="247" font-size="8.5" fill="#a33" text-anchor="end">flex-end</text>

  <text x="610" y="373" font-size="9" fill="#555555" text-anchor="middle">justifyContent: flex-start | flex-end | center | space-between | space-around | space-evenly</text>
  <text x="610" y="387" font-size="9" fill="#555555" text-anchor="middle">alignItems / alignSelf: flex-start | flex-end | center | stretch | baseline</text>

  <text x="390" y="420" font-size="10.5" fill="#666666" text-anchor="middle">Yoga -- React Native's C++ Flexbox implementation -- computes both layouts identically; only which</text>
  <text x="390" y="435" font-size="10.5" fill="#666666" text-anchor="middle">axis is "main" changes, which is why swapping flexDirection swaps justifyContent and alignItems's roles.</text>
</svg>
