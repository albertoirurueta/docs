<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Distributed search: query phase, then fetch phase</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">GET /products/_search?size=10 &#8226; one coordinating node, three shards</text>

  <!-- client -->
  <rect x="310" y="58" width="140" height="34" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="380" y="80" font-size="12" fill="#222222" text-anchor="middle">client</text>
  <path d="M380,92 L380,108" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,106 386,106 380,114" fill="#999999"/>

  <!-- coordinating node -->
  <rect x="270" y="114" width="220" height="44" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="132" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Coordinating node</text>
  <text x="380" y="149" font-size="10" fill="#666666" text-anchor="middle">any node can play this role</text>

  <!-- QUERY PHASE band -->
  <line x1="14" y1="176" x2="746" y2="176" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="192" font-size="11" font-weight="bold" fill="#1c4b73">QUERY PHASE &#8212; scatter / gather sorted ids</text>

  <!-- shard boxes row 1 -->
  <g>
    <rect x="40" y="206" width="200" height="70" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="140" y="226" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Shard 0</text>
    <text x="140" y="244" font-size="9.5" fill="#666666" text-anchor="middle">match + sort locally</text>
    <text x="140" y="260" font-size="9.5" fill="#666666" text-anchor="middle">return top 10 [id, score]</text>
  </g>
  <g>
    <rect x="280" y="206" width="200" height="70" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="380" y="226" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Shard 1</text>
    <text x="380" y="244" font-size="9.5" fill="#666666" text-anchor="middle">match + sort locally</text>
    <text x="380" y="260" font-size="9.5" fill="#666666" text-anchor="middle">return top 10 [id, score]</text>
  </g>
  <g>
    <rect x="520" y="206" width="200" height="70" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="620" y="226" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Shard 2</text>
    <text x="620" y="244" font-size="9.5" fill="#666666" text-anchor="middle">match + sort locally</text>
    <text x="620" y="260" font-size="9.5" fill="#666666" text-anchor="middle">return top 10 [id, score]</text>
  </g>

  <!-- scatter arrows (solid) -->
  <g stroke="#2f5424" stroke-width="1.4" fill="none">
    <path d="M330,158 L150,204"/>
    <path d="M380,158 L380,204"/>
    <path d="M430,158 L610,204"/>
  </g>
  <polygon points="146,197 156,201 150,207" fill="#2f5424"/>
  <polygon points="374,196 386,196 380,205" fill="#2f5424"/>
  <polygon points="614,197 604,201 610,207" fill="#2f5424"/>
  <text x="196" y="180" font-size="9.5" fill="#2f5424">1. scatter the query to one copy of every shard</text>

  <!-- gather arrows (dashed) -->
  <g stroke="#1c4b73" stroke-width="1.4" fill="none" stroke-dasharray="5 3">
    <path d="M170,206 L360,160"/>
    <path d="M400,206 L400,160"/>
    <path d="M600,206 L440,160"/>
  </g>
  <polygon points="356,157 366,155 362,165" fill="#1c4b73"/>
  <polygon points="394,158 406,158 400,150" fill="#1c4b73"/>
  <polygon points="444,159 434,153 440,165" fill="#1c4b73"/>
  <text x="470" y="196" font-size="9.5" fill="#1c4b73" text-anchor="end">2. gather each shard's sorted [id, score] list</text>

  <!-- merge box -->
  <rect x="210" y="296" width="340" height="46" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="315" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">3. merge lists, sort globally, keep the top 10 ids</text>
  <text x="380" y="332" font-size="9.5" fill="#666666" text-anchor="middle">no _source yet &#8212; only ids and sort values crossed the wire</text>

  <path d="M380,276 L380,294" stroke="#999999" stroke-width="1.2"/>
  <polygon points="374,292 386,292 380,300" fill="#999999"/>

  <!-- FETCH PHASE band -->
  <line x1="14" y1="360" x2="746" y2="360" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="376" font-size="11" font-weight="bold" fill="#1c4b73">FETCH PHASE &#8212; pull _source for the survivors only</text>

  <!-- shard boxes row 2 -->
  <g>
    <rect x="40" y="392" width="200" height="60" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="140" y="414" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Shard 0</text>
    <text x="140" y="434" font-size="9.5" fill="#666666" text-anchor="middle">return _source for 6 requested ids</text>
  </g>
  <g>
    <rect x="280" y="392" width="200" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="380" y="414" font-size="12" font-weight="bold" fill="#999999" text-anchor="middle">Shard 1</text>
    <text x="380" y="434" font-size="9.5" fill="#999999" text-anchor="middle">skipped &#8212; no id survived the merge</text>
  </g>
  <g>
    <rect x="520" y="392" width="200" height="60" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="620" y="414" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Shard 2</text>
    <text x="620" y="434" font-size="9.5" fill="#666666" text-anchor="middle">return _source for 4 requested ids</text>
  </g>

  <g stroke="#2f5424" stroke-width="1.4" fill="none">
    <path d="M320,342 L150,390"/>
    <path d="M440,342 L610,390"/>
  </g>
  <polygon points="146,383 156,387 150,393" fill="#2f5424"/>
  <polygon points="614,383 604,387 610,393" fill="#2f5424"/>
  <text x="380" y="360" font-size="9.5" fill="#2f5424" text-anchor="middle">4. fetch: GET _source only for the ids in the global top 10</text>

  <!-- assemble box -->
  <rect x="250" y="474" width="260" height="44" fill="#ffffff" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="492" font-size="11.5" font-weight="bold" fill="#2f5424" text-anchor="middle">5. assemble the 10 hits in order</text>
  <text x="380" y="509" font-size="9.5" fill="#666666" text-anchor="middle">return the response to the client</text>

  <g stroke="#1c4b73" stroke-width="1.4" fill="none" stroke-dasharray="5 3">
    <path d="M150,452 L320,472"/>
    <path d="M610,452 L440,472"/>
  </g>
  <polygon points="316,466 326,470 318,477" fill="#1c4b73"/>
  <polygon points="444,466 434,470 442,477" fill="#1c4b73"/>

  <text x="380" y="540" font-size="10.5" fill="#444444" text-anchor="middle">Two round trips keep the network cheap: deep pagination is costly because every shard must still sort from + size hits in phase 1.</text>
</svg>
