<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A task's back stack under each activity launch mode</title>
  <defs>
    <marker id="arrLm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Tasks and the back stack under each launch mode</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">starting from List, opening Detail, then triggering Detail again -- boxes stack bottom (oldest) to top (frontmost)</text>

  <!-- Column 1: standard -->
  <g>
    <rect x="10" y="56" width="172" height="24" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="96" y="72" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">standard</text>

    <rect x="46" y="380" width="100" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="96" y="401" font-size="10.5" fill="#333333" text-anchor="middle">List</text>

    <line x1="96" y1="380" x2="96" y2="356" stroke="#444444" stroke-width="1.2" marker-end="url(#arrLm)"/>
    <text x="140" y="371" font-size="8.5" fill="#666666" text-anchor="middle">open</text>

    <rect x="46" y="312" width="100" height="34" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="96" y="333" font-size="10.5" fill="#1c4b73" text-anchor="middle">Detail #1</text>

    <line x1="96" y1="312" x2="96" y2="288" stroke="#444444" stroke-width="1.2" marker-end="url(#arrLm)"/>
    <text x="140" y="303" font-size="8.5" fill="#666666" text-anchor="middle">tap again</text>

    <rect x="46" y="244" width="100" height="34" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="96" y="265" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Detail #2</text>

    <text x="96" y="428" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="96" dy="0">a brand-new instance is</tspan>
      <tspan x="96" dy="11">pushed every time --</tspan>
      <tspan x="96" dy="11">two Detail instances now</tspan>
      <tspan x="96" dy="11">exist in the back stack</tspan>
    </text>
  </g>

  <!-- Column 2: singleTop -->
  <g>
    <rect x="200" y="56" width="172" height="24" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
    <text x="286" y="72" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">singleTop</text>

    <rect x="236" y="380" width="100" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="286" y="401" font-size="10.5" fill="#333333" text-anchor="middle">List</text>

    <line x1="286" y1="380" x2="286" y2="356" stroke="#444444" stroke-width="1.2" marker-end="url(#arrLm)"/>
    <text x="330" y="371" font-size="8.5" fill="#666666" text-anchor="middle">open</text>

    <rect x="236" y="312" width="100" height="34" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
    <text x="286" y="333" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Detail</text>

    <path d="M 350 328 C 380 328, 380 250, 340 246" fill="none" stroke="#444444" stroke-width="1.1" marker-end="url(#arrLm)"/>
    <text x="382" y="290" font-size="8.5" fill="#666666" text-anchor="middle">
      <tspan x="382" dy="0">tap again --</tspan>
      <tspan x="382" dy="11">no new</tspan>
      <tspan x="382" dy="11">instance</tspan>
    </text>

    <text x="286" y="428" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="286" dy="0">the existing top instance</tspan>
      <tspan x="286" dy="11">receives onNewIntent()</tspan>
      <tspan x="286" dy="11">instead of a new one</tspan>
      <tspan x="286" dy="11">being created</tspan>
    </text>
  </g>

  <!-- Column 3: singleTask -->
  <g>
    <rect x="390" y="56" width="172" height="24" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.2"/>
    <text x="476" y="72" font-size="12" font-weight="bold" fill="#9a5a12" text-anchor="middle">singleTask</text>

    <text x="476" y="98" font-size="9" fill="#666666" text-anchor="middle">before: tap Detail from</text>
    <rect x="410" y="106" width="46" height="26" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="433" y="123" font-size="8.5" fill="#333333" text-anchor="middle">List</text>
    <rect x="461" y="106" width="52" height="26" rx="3" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1"/>
    <text x="487" y="123" font-size="8.5" fill="#9a5a12" text-anchor="middle">Detail</text>
    <rect x="518" y="106" width="58" height="26" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="547" y="123" font-size="8.5" fill="#333333" text-anchor="middle">Settings</text>
    <text x="476" y="146" font-size="8.5" fill="#666666" text-anchor="middle">(Settings is on top)</text>

    <line x1="476" y1="156" x2="476" y2="180" stroke="#444444" stroke-width="1.2" marker-end="url(#arrLm)"/>
    <text x="476" y="196" font-size="8.5" fill="#666666" text-anchor="middle">Settings finished; Detail.onNewIntent()</text>

    <rect x="426" y="312" width="100" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="476" y="333" font-size="10.5" fill="#333333" text-anchor="middle">List</text>

    <line x1="476" y1="312" x2="476" y2="288" stroke="#444444" stroke-width="1.2" marker-end="url(#arrLm)"/>

    <rect x="426" y="244" width="100" height="34" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.6"/>
    <text x="476" y="265" font-size="10.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">Detail</text>

    <text x="476" y="428" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="476" dy="0">only one Detail instance</tspan>
      <tspan x="476" dy="11">may exist in the task --</tspan>
      <tspan x="476" dy="11">everything above it is</tspan>
      <tspan x="476" dy="11">finished to bring it to top</tspan>
    </text>
  </g>

  <!-- Column 4: singleInstance -->
  <g>
    <rect x="580" y="56" width="172" height="24" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.2"/>
    <text x="666" y="72" font-size="12" font-weight="bold" fill="#5b3a8c" text-anchor="middle">singleInstance</text>

    <rect x="592" y="96" width="148" height="92" rx="6" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="666" y="110" font-size="8.5" fill="#666666" text-anchor="middle">Task A</text>
    <rect x="616" y="150" width="100" height="30" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.1"/>
    <text x="666" y="169" font-size="10" fill="#333333" text-anchor="middle">List</text>
    <rect x="616" y="116" width="100" height="30" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.1"/>
    <text x="666" y="135" font-size="10" fill="#333333" text-anchor="middle">Settings</text>

    <rect x="592" y="210" width="148" height="60" rx="6" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="666" y="224" font-size="8.5" fill="#666666" text-anchor="middle">Task B</text>
    <rect x="616" y="234" width="100" height="30" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.6"/>
    <text x="666" y="253" font-size="10" font-weight="bold" fill="#5b3a8c" text-anchor="middle">Detail</text>

    <text x="666" y="428" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="666" dy="0">Detail lives alone in its</tspan>
      <tspan x="666" dy="11">own task -- anything it</tspan>
      <tspan x="666" dy="11">starts opens in a</tspan>
      <tspan x="666" dy="11">different task entirely</tspan>
    </text>
  </g>

  <text x="380" y="502" font-size="9" fill="#888888" text-anchor="middle">Launch mode is set per activity with android:launchMode, or per call with Intent flags such as FLAG_ACTIVITY_SINGLE_TOP.</text>
</svg>
