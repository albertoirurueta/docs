<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from prompt to a presented launch deck</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: prompt -->
  <rect x="26" y="96" width="112" height="60" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="34" y="106" width="90" height="6" rx="3" fill="#9CA3AF"/><rect x="34" y="120" width="70" height="6" rx="3" fill="#9CA3AF"/><rect x="34" y="134" width="80" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="38" y="190" width="88" height="26" rx="13" fill="#4F46E5"/><text x="82" y="207" font-size="12" fill="#FFFFFF" text-anchor="middle">Submit</text>
  <rect x="38" y="232" width="88" height="40" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><text x="82" y="256" font-size="11" fill="#374151" text-anchor="middle">+ Apply brand</text>
  <!-- panel 2: outline -->
  <g fill="#EEF2FF" stroke="#9CA3AF"><rect x="178" y="94" width="112" height="22" rx="4"/><rect x="178" y="122" width="112" height="22" rx="4"/><rect x="178" y="150" width="112" height="22" rx="4"/><rect x="178" y="178" width="112" height="22" rx="4"/></g>
  <g fill="#9CA3AF"><rect x="186" y="102" width="70" height="6" rx="3"/><rect x="186" y="130" width="84" height="6" rx="3"/><rect x="186" y="158" width="60" height="6" rx="3"/><rect x="186" y="186" width="76" height="6" rx="3"/></g>
  <rect x="190" y="228" width="88" height="26" rx="13" fill="#4F46E5"/><text x="234" y="245" font-size="11" fill="#FFFFFF" text-anchor="middle">Generate</text>
  <!-- panel 3: editor with edit page -->
  <rect x="328" y="92" width="116" height="110" rx="4" fill="#F9FAFB" stroke="#6B7280"/>
  <rect x="334" y="98" width="64" height="62" rx="2" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="340" y="106" width="40" height="8" rx="2" fill="#4F46E5"/>
  <rect x="402" y="98" width="36" height="98" rx="2" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="420" y="116" font-size="10" fill="#374151" text-anchor="middle">Edit</text><text x="420" y="130" font-size="10" fill="#374151" text-anchor="middle">Page</text>
  <rect x="334" y="166" width="64" height="30" rx="2" fill="#E5E7EB"/>
  <rect x="334" y="222" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#B45309"/><text x="386" y="239" font-size="11" fill="#92400E" text-anchor="middle">Layouts, Styles</text>
  <!-- panel 4: notes bar -->
  <rect x="480" y="92" width="116" height="80" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="490" y="102" width="70" height="10" rx="3" fill="#4F46E5"/>
  <rect x="480" y="182" width="116" height="62" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <text x="490" y="198" font-size="11" font-weight="bold" fill="#92400E">Notes</text>
  <rect x="490" y="206" width="90" height="6" rx="3" fill="#D1D5DB"/><rect x="490" y="218" width="76" height="6" rx="3" fill="#D1D5DB"/><rect x="490" y="230" width="84" height="6" rx="3" fill="#D1D5DB"/>
  <!-- panel 5: present -->
  <rect x="634" y="96" width="100" height="70" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="642" y="104" width="50" height="9" rx="3" fill="#4F46E5"/>
  <rect x="642" y="120" width="38" height="36" rx="2" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="640" y="186" width="88" height="26" rx="13" fill="#B45309"/><text x="684" y="203" font-size="12" fill="#FFFFFF" text-anchor="middle">Present</text>
  <rect x="640" y="224" width="88" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="239" font-size="10" fill="#92400E" text-anchor="middle">Live session code</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Describe the deck</text><text x="82" y="338">in Canva AI</text><text x="234" y="322">Adjust the outline,</text><text x="234" y="338">then generate</text><text x="386" y="322">Refine pages with</text><text x="386" y="338">the Edit Page panel</text><text x="538" y="322">Write notes for</text><text x="538" y="338">each slide</text><text x="684" y="322">Present</text><text x="684" y="338">amber marks the outcome</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
