<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Child template lookup order: child, then parent, then core</title>
  <desc id="d">Four rows show where Joomla looks for a file when the active template is cassiopeia_tallpine with parent cassiopeia. Each row tries the child first, then the parent, then the core fallback.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2b3a">Lookup order for cassiopeia_tallpine (parent: cassiopeia)</text>

  <g font-size="12" fill="#1d2b3a" font-weight="bold">
    <text x="250" y="62" text-anchor="middle">1. Child template</text>
    <text x="520" y="62" text-anchor="middle">2. Parent template</text>
    <text x="780" y="62" text-anchor="middle">3. Core fallback</text>
  </g>

  <!-- row labels -->
  <g font-size="12" fill="#1d2b3a">
    <text x="12" y="104">index.php,</text><text x="12" y="120">component.php,</text><text x="12" y="136">error.php, offline.php</text>
    <text x="12" y="204">Module and component</text><text x="12" y="220">overrides (html/)</text>
    <text x="12" y="304">Layouts (html/layouts/)</text>
    <text x="12" y="404">Assets and language</text><text x="12" y="420">files</text>
  </g>

  <!-- row 1 -->
  <g stroke="#2b6cb0" stroke-width="1.5" fill="#e8f1fb">
    <rect x="160" y="84" width="180" height="60" rx="6"/>
  </g>
  <g stroke="#6b46c1" stroke-width="1.5" fill="#f0eafa"><rect x="430" y="84" width="180" height="60" rx="6"/></g>
  <g stroke="#555" stroke-width="1.5" fill="#eeeeee"><rect x="690" y="84" width="180" height="60" rx="6"/></g>
  <g font-size="11.5" fill="#1d2b3a" text-anchor="middle">
    <text x="250" y="110">templates/cassiopeia_tallpine/</text><text x="250" y="128">index.php</text>
    <text x="520" y="110">templates/cassiopeia/</text><text x="520" y="128">index.php</text>
    <text x="780" y="110">templates/system/</text><text x="780" y="128">index.php</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#a)"><line x1="340" y1="114" x2="428" y2="114"/><line x1="610" y1="114" x2="688" y2="114"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle"><text x="384" y="108">missing</text><text x="649" y="108">missing</text></g>

  <!-- row 2 -->
  <g stroke="#2b6cb0" stroke-width="1.5" fill="#e8f1fb"><rect x="160" y="184" width="180" height="60" rx="6"/></g>
  <g stroke="#6b46c1" stroke-width="1.5" fill="#f0eafa"><rect x="430" y="184" width="180" height="60" rx="6"/></g>
  <g stroke="#555" stroke-width="1.5" fill="#eeeeee"><rect x="690" y="184" width="180" height="60" rx="6"/></g>
  <g font-size="11.5" fill="#1d2b3a" text-anchor="middle">
    <text x="250" y="210">cassiopeia_tallpine/html/</text><text x="250" y="228">com_content/article/default.php</text>
    <text x="520" y="210">cassiopeia/html/</text><text x="520" y="228">com_content/article/default.php</text>
    <text x="780" y="210">components/com_content/</text><text x="780" y="228">tmpl/article/default.php</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#a)"><line x1="340" y1="214" x2="428" y2="214"/><line x1="610" y1="214" x2="688" y2="214"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle"><text x="384" y="208">missing</text><text x="649" y="208">missing</text></g>

  <!-- row 3 -->
  <g stroke="#2b6cb0" stroke-width="1.5" fill="#e8f1fb"><rect x="160" y="284" width="180" height="60" rx="6"/></g>
  <g stroke="#6b46c1" stroke-width="1.5" fill="#f0eafa"><rect x="430" y="284" width="180" height="60" rx="6"/></g>
  <g stroke="#555" stroke-width="1.5" fill="#eeeeee"><rect x="690" y="284" width="180" height="60" rx="6"/></g>
  <g font-size="11.5" fill="#1d2b3a" text-anchor="middle">
    <text x="250" y="310">cassiopeia_tallpine/html/</text><text x="250" y="328">layouts/com_fields/field/render.php</text>
    <text x="520" y="310">cassiopeia/html/</text><text x="520" y="328">layouts/com_fields/field/render.php</text>
    <text x="780" y="304">component layouts/,</text><text x="780" y="322">then core layouts/</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#a)"><line x1="340" y1="314" x2="428" y2="314"/><line x1="610" y1="314" x2="688" y2="314"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle"><text x="384" y="308">missing</text><text x="649" y="308">missing</text></g>

  <!-- row 4 -->
  <g stroke="#2b6cb0" stroke-width="1.5" fill="#e8f1fb"><rect x="160" y="384" width="180" height="60" rx="6"/></g>
  <g stroke="#6b46c1" stroke-width="1.5" fill="#f0eafa"><rect x="430" y="384" width="180" height="60" rx="6"/></g>
  <g stroke="#555" stroke-width="1.5" fill="#eeeeee"><rect x="690" y="384" width="180" height="60" rx="6"/></g>
  <g font-size="11.5" fill="#1d2b3a" text-anchor="middle">
    <text x="250" y="410">media/templates/site/</text><text x="250" y="428">cassiopeia_tallpine/css/user.css</text>
    <text x="520" y="410">media/templates/site/</text><text x="520" y="428">cassiopeia/css/user.css</text>
    <text x="780" y="404">asset not found:</text><text x="780" y="422">no file is added</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#a)"><line x1="340" y1="414" x2="428" y2="414"/><line x1="610" y1="414" x2="688" y2="414"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle"><text x="384" y="408">missing</text><text x="649" y="408">missing</text></g>

  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#444">The first file found wins. Registry files (joomla.asset.json) load parent first, then child, so the child redefines same-named assets.</text>
</svg>
