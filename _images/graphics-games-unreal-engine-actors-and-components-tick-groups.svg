<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One frame: tick groups around the physics step</text>
<rect x="20" y="60" width="120" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="85.8" text-anchor="middle" font-size="11" fill="#3730A3">TG_PrePhysics</text>
<rect x="145" y="60" width="105" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197.5" y="85.8" text-anchor="middle" font-size="11" fill="#1F2937">TG_StartPhysics</text>
<rect x="255" y="60" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="85.8" text-anchor="middle" font-size="11" fill="#3730A3">TG_DuringPhysics</text>
<rect x="390" y="60" width="100" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="440.0" y="85.8" text-anchor="middle" font-size="11" fill="#1F2937">TG_EndPhysics</text>
<rect x="495" y="60" width="120" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="555.0" y="85.8" text-anchor="middle" font-size="11" fill="#3730A3">TG_PostPhysics</text>
<rect x="620" y="60" width="125" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="682.5" y="85.8" text-anchor="middle" font-size="11" fill="#3730A3">TG_PostUpdateWork</text>
<line x1="140" y1="82" x2="145" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="250" y1="82" x2="255" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="385" y1="82" x2="390" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="490" y1="82" x2="495" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="615" y1="82" x2="620" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<rect x="145" y="122" width="345" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="317" y="139" text-anchor="middle" font-size="11" fill="#92400E">physics simulation runs on other threads</text>
<text x="80" y="185" text-anchor="middle" font-size="11" fill="#374151">Things that feed</text>
<text x="80" y="199" text-anchor="middle" font-size="11" fill="#374151">the simulation:</text>
<text x="80" y="213" text-anchor="middle" font-size="11" fill="#374151">movement,</text>
<text x="80" y="227" text-anchor="middle" font-size="11" fill="#374151">RotatingMovement</text>
<text x="320" y="185" text-anchor="middle" font-size="11" fill="#374151">Logic that tolerates</text>
<text x="320" y="199" text-anchor="middle" font-size="11" fill="#374151">one frame of lag:</text>
<text x="320" y="213" text-anchor="middle" font-size="11" fill="#374151">HUD, UI updates</text>
<text x="555" y="185" text-anchor="middle" font-size="11" fill="#374151">Needs final</text>
<text x="555" y="199" text-anchor="middle" font-size="11" fill="#374151">positions: traces,</text>
<text x="555" y="213" text-anchor="middle" font-size="11" fill="#374151">laser sights,</text>
<text x="555" y="227" text-anchor="middle" font-size="11" fill="#374151">aim checks</text>
<text x="682" y="185" text-anchor="middle" font-size="11" fill="#374151">After the camera:</text>
<text x="682" y="199" text-anchor="middle" font-size="11" fill="#374151">effects that follow</text>
<text x="682" y="213" text-anchor="middle" font-size="11" fill="#374151">the final view</text>
<line x1="80" y1="160" x2="80" y2="172" stroke="#4B5563" stroke-width="1.5"/>
<line x1="320" y1="160" x2="320" y2="172" stroke="#4B5563" stroke-width="1.5"/>
<line x1="555" y1="112" x2="555" y2="172" stroke="#4B5563" stroke-width="1.5"/>
<line x1="682" y1="112" x2="682" y2="172" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">All members of a group finish before the next group starts; prerequisites order ticks inside the frame.</text>
</svg>
