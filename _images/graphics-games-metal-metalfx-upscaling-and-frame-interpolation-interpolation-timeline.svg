<text x="100" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">render 1</text>
<rect x="320" y="70" width="80" height="50" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360" y="100" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">render 2</text>
