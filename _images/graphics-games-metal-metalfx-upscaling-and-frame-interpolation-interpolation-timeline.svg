<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metalfx-upscaling-and-frame-interpolation-interpolation-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Frame interpolation: one generated frame between two rendered frames</text>
<line x1="40" y1="120" x2="720" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-metalfx-upscaling-and-frame-interpolation-interpolation-timeline)"/>
