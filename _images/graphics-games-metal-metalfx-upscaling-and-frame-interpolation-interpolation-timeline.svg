<text x="205" y="235" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth and motion vectors</text>
<text x="205" y="252" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">camera matrices and near/far</text>
<text x="205" y="269" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">delta time, UI texture (optional)</text>
<rect x="390" y="170" width="330" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="555" y="195" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Cost and cautions</text>
<text x="555" y="218" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">one extra pass; latency of about a frame</text>
<text x="555" y="235" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">reset history on camera cuts</text>
<text x="555" y="252" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">UI must be composited after, or passed in</text>
<text x="555" y="269" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">frame pacing needs care in presentation</text>
