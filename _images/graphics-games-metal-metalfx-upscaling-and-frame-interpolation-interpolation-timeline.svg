<text x="230" y="95" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">generated</text>
<text x="230" y="110" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">(MetalFX)</text>
<rect x="450" y="70" width="80" height="50" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="490" y="95" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">generated</text>
<text x="490" y="110" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">(MetalFX)</text>
<text x="380" y="60" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Presented sequence: 1, generated, 2, generated, 3</text>
