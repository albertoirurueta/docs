<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>The Bookshelf application: clients, nginx, Gunicorn, the Flask application with its blueprints and extensions, PostgreSQL, Redis and a Celery worker</title>
  <defs>
    <marker id="fa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The Bookshelf application at a glance</text>
  <text x="380" y="45" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the running scenario of this section, from client to database</text>

  <!-- clients -->
  <rect x="16" y="110" width="104" height="130" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="68" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Clients</text>
  <text x="68" y="162" font-size="11" fill="currentColor" text-anchor="middle">browser, SPA</text>
  <text x="68" y="180" font-size="11" fill="currentColor" text-anchor="middle">curl, HTTPie</text>
  <text x="68" y="198" font-size="11" fill="currentColor" text-anchor="middle">mobile app</text>
  <text x="68" y="222" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.8">HTTP, SSE</text>
  <line x1="120" y1="175" x2="148" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- nginx -->
  <rect x="150" y="100" width="120" height="150" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="210" y="124" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">nginx</text>
  <text x="210" y="148" font-size="11" fill="currentColor" text-anchor="middle">TLS termination</text>
  <text x="210" y="166" font-size="11" fill="currentColor" text-anchor="middle">size and time limits</text>
  <text x="210" y="184" font-size="11" fill="currentColor" text-anchor="middle">sets X-Forwarded-*</text>
  <text x="210" y="202" font-size="11" fill="currentColor" text-anchor="middle">proxy_pass</text>
  <text x="210" y="234" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">location /static/</text>
  <line x1="270" y1="175" x2="298" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- gunicorn -->
  <rect x="300" y="100" width="120" height="150" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="124" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Gunicorn</text>
  <text x="360" y="148" font-size="11" fill="currentColor" text-anchor="middle">workers and threads</text>
  <text x="360" y="166" font-size="11" fill="currentColor" text-anchor="middle">WSGI, PEP 3333</text>
  <text x="360" y="184" font-size="11" fill="currentColor" text-anchor="middle">Werkzeug ProxyFix</text>
  <text x="360" y="202" font-size="11" fill="currentColor" text-anchor="middle">calls create_app()</text>
  <line x1="420" y1="175" x2="448" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- flask application -->
  <rect x="450" y="62" width="294" height="258" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="597" y="82" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Bookshelf Flask application</text>
  <text x="597" y="98" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.8">built by the create_app() application factory</text>

  <rect x="462" y="108" width="62" height="52" rx="4" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="493" y="128" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">catalog</text>
  <text x="493" y="146" font-size="10" fill="currentColor" text-anchor="middle">/</text>
  <rect x="532" y="108" width="62" height="52" rx="4" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="563" y="128" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">auth</text>
  <text x="563" y="146" font-size="10" fill="currentColor" text-anchor="middle">/auth</text>
  <rect x="602" y="108" width="62" height="52" rx="4" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="633" y="128" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">admin</text>
  <text x="633" y="146" font-size="10" fill="currentColor" text-anchor="middle">/admin</text>
  <rect x="672" y="108" width="62" height="52" rx="4" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="703" y="128" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">api</text>
  <text x="703" y="146" font-size="10" fill="currentColor" text-anchor="middle">/api/v1</text>

  <rect x="462" y="170" width="272" height="40" rx="4" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
  <text x="598" y="187" font-size="11" fill="currentColor" text-anchor="middle">Jinja templates, Flask-WTF forms</text>
  <text x="598" y="202" font-size="11" fill="currentColor" text-anchor="middle">sessions, flashing, Flask-Babel</text>

  <rect x="462" y="220" width="272" height="88" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="598" y="238" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">Extensions, wired with init_app</text>
  <text x="598" y="255" font-size="10" fill="currentColor" text-anchor="middle">Flask-SQLAlchemy, Flask-Migrate</text>
  <text x="598" y="269" font-size="10" fill="currentColor" text-anchor="middle">Flask-Login, Flask-JWT-Extended</text>
  <text x="598" y="283" font-size="10" fill="currentColor" text-anchor="middle">flask-smorest, Flask-Caching</text>
  <text x="598" y="297" font-size="10" fill="currentColor" text-anchor="middle">Flask-Admin, Flask-Limiter</text>

  <!-- static files -->
  <rect x="150" y="372" width="120" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="210" y="394" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Static files</text>
  <text x="210" y="411" font-size="11" fill="currentColor" text-anchor="middle">served without Python</text>
  <line x1="210" y1="250" x2="210" y2="370" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- celery worker -->
  <rect x="300" y="372" width="120" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="394" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Celery worker</text>
  <text x="360" y="412" font-size="10" fill="currentColor" text-anchor="middle">review digest e-mail</text>
  <text x="360" y="428" font-size="10" fill="currentColor" text-anchor="middle">same app factory</text>

  <!-- postgresql -->
  <rect x="450" y="372" width="130" height="70" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="515" y="394" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">PostgreSQL</text>
  <text x="515" y="412" font-size="10" fill="currentColor" text-anchor="middle">books, authors, reviews</text>
  <text x="515" y="428" font-size="10" fill="currentColor" text-anchor="middle">SQLAlchemy 2.0 models</text>
  <line x1="515" y1="320" x2="515" y2="370" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- redis -->
  <rect x="614" y="372" width="130" height="70" rx="6" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="679" y="394" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Redis</text>
  <text x="679" y="412" font-size="10" fill="currentColor" text-anchor="middle">cache, sessions, rate limits</text>
  <text x="679" y="428" font-size="10" fill="currentColor" text-anchor="middle">Celery broker</text>
  <line x1="679" y1="320" x2="679" y2="370" stroke="currentColor" stroke-width="1.5" marker-end="url(#fa-arrow)"/>

  <!-- redis to celery, below the boxes -->
  <line x1="679" y1="442" x2="679" y2="456" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="679" y1="456" x2="360" y2="456" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="360" y1="456" x2="360" y2="444" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fa-arrow)"/>
  <text x="520" y="451" font-size="10" fill="currentColor" text-anchor="middle">tasks from the queue</text>
</svg>
