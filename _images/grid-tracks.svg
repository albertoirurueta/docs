<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>

  <text x="240" y="24" font-size="15" fill="#666666" text-anchor="middle">grid-template-columns: 90px 1fr; grid-template-rows: repeat(3, 80px);</text>

  <!-- column line numbers (top) -->
  <text x="60" y="52" font-size="12" fill="#8a5a10" text-anchor="middle">1</text>
  <text x="150" y="52" font-size="12" fill="#8a5a10" text-anchor="middle">2</text>
  <text x="420" y="52" font-size="12" fill="#8a5a10" text-anchor="middle">3</text>

  <!-- row line numbers (left) -->
  <text x="38" y="64" font-size="12" fill="#8a5a10" text-anchor="middle">1</text>
  <text x="38" y="144" font-size="12" fill="#8a5a10" text-anchor="middle">2</text>
  <text x="38" y="224" font-size="12" fill="#8a5a10" text-anchor="middle">3</text>
  <text x="38" y="304" font-size="12" fill="#8a5a10" text-anchor="middle">4</text>

  <!-- grid lines (column) -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="150" y1="60" x2="150" y2="300" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="420" y1="60" x2="420" y2="300" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- grid lines (row) -->
  <line x1="60" y1="60" x2="420" y2="60" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="60" y1="140" x2="420" y2="140" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="60" y1="220" x2="420" y2="220" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="60" y1="300" x2="420" y2="300" stroke="#c9861f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- sidebar: grid-column 1 / 2, grid-row 1 / 4 -->
  <rect x="64" y="64" width="82" height="232" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="105" y="184" font-size="14" font-weight="bold" fill="#2a6636" text-anchor="middle">sidebar</text>
  <text x="105" y="202" font-size="10" fill="#2a6636" text-anchor="middle">column 1 / row 1-4</text>

  <!-- header: grid-column 2 / 3, grid-row 1 / 2 -->
  <rect x="154" y="64" width="262" height="72" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="285" y="106" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">header</text>

  <!-- main: grid-column 2 / 3, grid-row 2 / 3 -->
  <rect x="154" y="144" width="262" height="72" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="285" y="186" font-size="14" font-weight="bold" fill="#6b4207" text-anchor="middle">main</text>

  <!-- footer: grid-column 2 / 3, grid-row 3 / 4 -->
  <rect x="154" y="224" width="262" height="72" fill="#e6d6f5" stroke="#7a4fa8" stroke-width="2"/>
  <text x="285" y="266" font-size="14" font-weight="bold" fill="#4e2e6b" text-anchor="middle">footer</text>

  <text x="240" y="326" font-size="12" fill="#666666" text-anchor="middle">grid line numbers along each edge; "sidebar" spans grid-row: 1 / 4</text>
  <text x="240" y="344" font-size="12" fill="#666666" text-anchor="middle">equivalent to: grid-template-areas: "sidebar header" "sidebar main" "sidebar footer";</text>
</svg>
