<text x="380.0" y="387.4" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Reading the figure</text>
<text x="380.0" y="402.4" text-anchor="middle" font-size="11" fill="#374151">FixedUpdate runs zero, one or several times per frame so physics keeps up with real time.</text>
<text x="380.0" y="417.4" text-anchor="middle" font-size="11" fill="#374151">Time.fixedDeltaTime is 0.02 s by default. Update, the coroutine resumes, LateUpdate</text>
<text x="380.0" y="432.4" text-anchor="middle" font-size="11" fill="#374151">and rendering run once per frame. The millisecond values are illustrative.</text>
