<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where cooked data goes in 5.8</text>
<rect x="14" y="60" width="120" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="83.2" text-anchor="middle" font-size="12" fill="#3730A3">Cook</text>
<text x="74.0" y="99.2" text-anchor="middle" font-size="12" fill="#3730A3">converts assets to</text>
<text x="74.0" y="115.2" text-anchor="middle" font-size="12" fill="#3730A3">platform formats</text>
<rect x="190" y="52" width="200" height="86" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="290" y="74" text-anchor="middle" font-size="13" fill="#047857" font-weight="bold">Zenserver store (default)</text>
<text x="290" y="96" text-anchor="middle" font-size="11" fill="#374151">Saved/Cooked holds only a</text>
<text x="290" y="112" text-anchor="middle" font-size="11" fill="#374151">ue.projectstore descriptor</text>
<rect x="190" y="160" width="200" height="70" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="290" y="182" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Loose files (opt out)</text>
<text x="290" y="202" text-anchor="middle" font-size="11" fill="#374151">cook with -skipzenstore, or turn</text>
<text x="290" y="218" text-anchor="middle" font-size="11" fill="#374151">the project setting off</text>
<line x1="135" y1="90" x2="188" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="135" y1="110" x2="188" y2="195" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<rect x="450" y="52" width="296" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="598.0" y="74.8" text-anchor="middle" font-size="11" fill="#3730A3">Container staging: UAT and UnrealPak</text>
<text x="598.0" y="90.8" text-anchor="middle" font-size="11" fill="#3730A3">pull data from Zenserver and write</text>
<text x="598.0" y="106.8" text-anchor="middle" font-size="11" fill="#3730A3">.pak, or .utoc and .ucas with Use Io Store</text>
<text x="598.0" y="122.8" text-anchor="middle" font-size="11" fill="#3730A3">into the staged build</text>
<line x1="391" y1="95" x2="448" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="450" y="160" width="296" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="598" y="182" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Loose staging with Zen Streaming</text>
<text x="598" y="202" text-anchor="middle" font-size="11" fill="#374151">the staged build keeps ue.projectstore and</text>
<text x="598" y="218" text-anchor="middle" font-size="11" fill="#374151">streams data from Zenserver on demand</text>
<line x1="391" y1="100" x2="448" y2="190" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<rect x="14" y="262" width="732" height="98" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="284" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Why Zenserver</text>
<text x="380" y="304" text-anchor="middle" font-size="11" fill="#374151">Far fewer files for the file system on projects with a million or more cooked files, faster cook and delete.</text>
<text x="380" y="321" text-anchor="middle" font-size="11" fill="#374151">Shared, de-duplicated storage across platforms and workspaces; enables cooked data snapshots and incremental cooking (Beta).</text>
<text x="380" y="338" text-anchor="middle" font-size="11" fill="#374151">Harder to inspect by hand: use the Zen Dashboard. Data is reference-counted and can be collected after 14 days.</text>
</svg>
