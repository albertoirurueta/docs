<rect x="515" y="268" width="121" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="575.5" y="286.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<text x="648" y="286" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">size 96</text>
<rect x="20" y="312" width="720" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="34" y="332" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">vec3 and vec4 align to 16, vec2 to 8, scalars to 4. A scalar may follow a vec3 inside the same 16-byte row (c above).</text>
<text x="34" y="348" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">Every array element and every matrix column is rounded up to 16 bytes. A struct is aligned and sized to a multiple of 16.</text>
<text x="34" y="364" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">Query the truth: glGetActiveUniformsiv(program, n, indices, GL_UNIFORM_OFFSET, offsets).</text>
</svg>
