<rect x="140" y="232" width="371" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="325.5" y="250.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">m column 1</text>
<rect x="515" y="232" width="121" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="575.5" y="250.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<text x="20" y="288" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">offset 80</text>
<rect x="140" y="268" width="371" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
