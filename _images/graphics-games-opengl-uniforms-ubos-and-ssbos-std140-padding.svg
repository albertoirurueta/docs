<text x="513.0" y="178.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">padding</text>
<text x="648" y="178" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">d: 32</text>
<text x="20" y="216" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">offset 48</text>
