<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Choosing where to run PrestaShop: managed hosting, a container service or Kubernetes</title>
  <desc id="d">A decision tree. The first question asks whether the shop needs infrastructure or modules that a managed host does not allow. If not, a PrestaShop hosting offer is the simplest choice. If so, the second question asks whether other workloads or a platform team already run Kubernetes. If yes, use EKS, GKE or AKS with the same container image and chart. If no, a third question asks which cloud the organisation uses: ECS on Fargate on AWS, Cloud Run on Google Cloud, or Azure Container Apps on Azure, while a team that operates virtual machines uses an EC2 Auto Scaling group. All the container options need a shared file system for img, upload and download, a managed MySQL database and shared sessions.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#2b3a4a"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#f4b860">Where to run Pocket Coffee</text>

  <rect x="300" y="52" width="360" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="480" y="78" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Does the shop need custom infrastructure,</text>
  <text x="480" y="98" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">private networking or modules a host forbids?</text>

  <path d="M300 83 H150 V150" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="76" font-size="12" fill="#9fd3c7" text-anchor="middle">no</text>
  <rect x="30" y="152" width="240" height="92" rx="10" fill="#4d7c5a"/>
  <text x="150" y="180" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">PrestaShop hosting offer</text>
  <text x="150" y="202" font-size="12" fill="#f2f5f8" text-anchor="middle">managed or partner hosting;</text>
  <text x="150" y="220" font-size="12" fill="#f2f5f8" text-anchor="middle">verify current offers on prestashop.com</text>

  <path d="M480 114 V160" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="496" y="142" font-size="12" fill="#f4b860">yes</text>
  <rect x="330" y="162" width="300" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="480" y="188" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Do other workloads or a platform team</text>
  <text x="480" y="208" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">already run Kubernetes?</text>

  <path d="M630 193 H760 V262" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="690" y="186" font-size="12" fill="#f4b860" text-anchor="middle">yes</text>
  <rect x="640" y="264" width="290" height="110" rx="10" fill="#3f6e9a"/>
  <text x="785" y="290" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Kubernetes: same image and chart</text>
  <text x="785" y="314" font-size="12" fill="#f2f5f8" text-anchor="middle">EKS + RDS + EFS + ElastiCache</text>
  <text x="785" y="332" font-size="12" fill="#f2f5f8" text-anchor="middle">GKE + Cloud SQL + Filestore + Memorystore</text>
  <text x="785" y="350" font-size="12" fill="#f2f5f8" text-anchor="middle">AKS + MySQL Flexible Server + Azure Files</text>

  <path d="M480 224 V290" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <text x="496" y="262" font-size="12" fill="#9fd3c7">no</text>
  <rect x="330" y="292" width="300" height="46" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="480" y="320" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Which cloud, and who operates it?</text>

  <path d="M360 338 V390 H160 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M420 338 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M540 338 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600 338 V390 H800 V410" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="412" width="240" height="84" rx="10" fill="#7a5c3a"/>
  <text x="160" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">EC2 Auto Scaling group</text>
  <text x="160" y="458" font-size="12" fill="#f2f5f8" text-anchor="middle">a team that runs VMs;</text>
  <text x="160" y="476" font-size="12" fill="#f2f5f8" text-anchor="middle">instance refresh as release</text>
  <rect x="300" y="412" width="170" height="84" rx="10" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="385" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">AWS: ECS on</text>
  <text x="385" y="456" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Fargate</text>
  <text x="385" y="476" font-size="12" fill="#f2f5f8" text-anchor="middle">EFS for the shared paths</text>
  <rect x="490" y="412" width="170" height="84" rx="10" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="575" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Google Cloud:</text>
  <text x="575" y="456" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Cloud Run</text>
  <text x="575" y="476" font-size="12" fill="#f2f5f8" text-anchor="middle">Filestore NFS volume</text>
  <rect x="690" y="412" width="240" height="84" rx="10" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="810" y="438" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Azure: Container Apps</text>
  <text x="810" y="458" font-size="12" fill="#f2f5f8" text-anchor="middle">Azure Files NFS needs a</text>
  <text x="810" y="476" font-size="12" fill="#f2f5f8" text-anchor="middle">custom virtual network</text>
</svg>
