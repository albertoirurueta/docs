<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Touch and pointer target sizes (drawn at 2x)</text>
<rect x="30" y="50" width="220" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="50" cy="70" r="11" fill="#4F46E5"/><text x="50" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="140" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">16 x 16 px icon</text>
<rect x="124" y="154" width="32" height="32" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<rect x="116" y="146" width="48" height="48" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
<text x="140" y="250" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Fails 2.5.8 unless spaced</text>
<rect x="266" y="50" width="220" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="286" cy="70" r="11" fill="#4F46E5"/><text x="286" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="376" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">24 x 24 px</text>
<rect x="352" y="146" width="48" height="48" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="376" y="250" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Meets 2.5.8 (AA)</text>
<rect x="502" y="50" width="220" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="522" cy="70" r="11" fill="#4F46E5"/><text x="522" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="612" y="90" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">44 x 44 px</text>
<rect x="568" y="126" width="88" height="88" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<rect x="588" y="146" width="48" height="48" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="568" y="126" width="88" height="88" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="2 3"/>
<text x="612" y="250" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Meets 2.5.5 (AAA)</text>
<rect x="30" y="278" width="330" height="122" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="50" cy="298" r="11" fill="#4F46E5"/><text x="50" y="302" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="195" y="298" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">16 px icon inside a 44 px hit area</text>
<rect x="70" y="316" width="64" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 3"/><rect x="94" y="340" width="16" height="16" rx="3" fill="#4F46E5"/>
<text x="150" y="340" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Icon stays 16 px;</text>
<text x="150" y="358" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">the frame around it is</text>
<text x="150" y="376" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">the target (padding).</text>
<rect x="380" y="278" width="350" height="122" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="400" cy="298" r="11" fill="#4F46E5"/><text x="400" y="302" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="565" y="298" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Spacing exception: circles must not overlap</text>
<circle cx="460" cy="350" r="24" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="444" y="334" width="32" height="32" rx="4" fill="#4F46E5"/>
<circle cx="520" cy="350" r="24" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="504" y="334" width="32" height="32" rx="4" fill="#4F46E5"/>
<text x="570" y="346" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Two 16 px icons,</text>
<text x="570" y="364" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">30 px apart: pass.</text>
<text x="380" y="422" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">Dashed amber = 24 px square; dotted grey = 44 px square.</text>
</svg>
