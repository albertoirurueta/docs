<text x="130" y="328" text-anchor="middle" font-size="11" fill="#374151">4 meshlets (colours), grouped by locality</text>
<line x1="240" y1="200" x2="290" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mesh-ml)"/>
