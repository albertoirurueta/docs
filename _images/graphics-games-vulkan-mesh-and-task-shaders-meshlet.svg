<text x="515.0" y="204.0" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="515" y="72" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">One meshlet in memory</text>
<rect x="310" y="90" width="200" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="410.0" y="122.0" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Vertex index list</text>
<text x="410.0" y="138.0" text-anchor="middle" font-size="11" fill="#3730A3">up to 64 entries into the global vertex buffer</text>
<rect x="310" y="175" width="200" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="410.0" y="207.0" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Primitive index list</text>
<text x="410.0" y="223.0" text-anchor="middle" font-size="11" fill="#065F46">up to 124 triangles, 3 x uint8 each</text>
<rect x="530" y="90" width="190" height="155" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="164.5" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Meshlet record</text>
<text x="625.0" y="180.5" text-anchor="middle" font-size="11" fill="#92400E">vertexOffset, vertexCount</text>
<text x="625" y="185" text-anchor="middle" font-size="11" fill="#92400E">triangleOffset, triangleCount</text>
<text x="625" y="203" text-anchor="middle" font-size="11" fill="#92400E">bounding sphere, normal cone</text>
<text x="515" y="275" text-anchor="middle" font-size="11" fill="#374151">One mesh workgroup processes one meshlet:</text>
<text x="515" y="293" text-anchor="middle" font-size="11" fill="#374151">load the vertices once, write them to the output arrays,</text>
<text x="515" y="311" text-anchor="middle" font-size="11" fill="#374151">call SetMeshOutputsEXT(vertexCount, triangleCount).</text>
<text x="515" y="336" text-anchor="middle" font-size="11" fill="#92400E">64 and 124 are common starting sizes; query the device limits</text>
</svg>
