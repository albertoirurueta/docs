<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two startup pipelines: build-time augmentation vs. runtime reflection</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Quarkus resolves beans, config and routes once at build time; Spring Boot's classpath scan and auto-configuration normally run again at every start</text>

  <!-- vertical divider -->
  <line x1="380" y1="58" x2="380" y2="380" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- column headers -->
  <text x="195" y="60" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Quarkus</text>
  <text x="575" y="60" font-size="12.5" font-weight="bold" fill="#8a6d1f" text-anchor="middle">Spring Boot (default, non-AOT)</text>

  <!-- ================= LEFT: Quarkus ================= -->
  <rect x="30" y="66" width="330" height="72" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="195" y="86" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Build time -- augmentation (once per build)</text>
  <text x="195" y="104" font-size="10" fill="#333333" text-anchor="middle">CDI beans, config metadata and routes resolved;</text>
  <text x="195" y="120" font-size="10" fill="#333333" text-anchor="middle">the replay bytecode is recorded, not executed yet</text>

  <line x1="195" y1="138" x2="195" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="150" width="330" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="195" y="169" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Static init</text>
  <text x="195" y="186" font-size="10" fill="#333333" text-anchor="middle">environment-independent recorded steps replay --</text>
  <text x="195" y="200" font-size="10" fill="#333333" text-anchor="middle">for native, this already happened inside the builder</text>

  <line x1="195" y1="210" x2="195" y2="222" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="222" width="330" height="60" rx="6" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="195" y="241" font-size="12.5" font-weight="bold" fill="#a33333" text-anchor="middle">Runtime init (every process start)</text>
  <text x="195" y="258" font-size="10" fill="#333333" text-anchor="middle">real config values read, connection pools and</text>
  <text x="195" y="272" font-size="10" fill="#333333" text-anchor="middle">sockets opened -- the only per-start cost left</text>

  <line x1="195" y1="282" x2="195" y2="294" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="294" width="330" height="54" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="195" y="315" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">App ready</text>
  <text x="195" y="333" font-size="10" fill="#333333" text-anchor="middle">JVM: tens of milliseconds -- native: single-digit ms</text>

  <!-- ================= RIGHT: Spring Boot ================= -->
  <rect x="410" y="66" width="330" height="72" rx="6" fill="#f5f0e6" stroke="#8a6d1f" stroke-width="1.4"/>
  <text x="575" y="86" font-size="12.5" font-weight="bold" fill="#8a6d1f" text-anchor="middle">Process start -- classpath scan</text>
  <text x="575" y="104" font-size="10" fill="#333333" text-anchor="middle">component scanning walks the classpath and</text>
  <text x="575" y="120" font-size="10" fill="#333333" text-anchor="middle">reflection discovers candidate bean classes</text>

  <line x1="575" y1="138" x2="575" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="410" y="150" width="330" height="60" rx="6" fill="#f5f0e6" stroke="#8a6d1f" stroke-width="1.4"/>
  <text x="575" y="169" font-size="12.5" font-weight="bold" fill="#8a6d1f" text-anchor="middle">Auto-configuration evaluation</text>
  <text x="575" y="186" font-size="10" fill="#333333" text-anchor="middle">hundreds of `@Conditional` auto-configuration</text>
  <text x="575" y="200" font-size="10" fill="#333333" text-anchor="middle">classes are evaluated against classpath &amp; environment</text>

  <line x1="575" y1="210" x2="575" y2="222" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="410" y="222" width="330" height="60" rx="6" fill="#f5f0e6" stroke="#8a6d1f" stroke-width="1.4"/>
  <text x="575" y="241" font-size="12.5" font-weight="bold" fill="#8a6d1f" text-anchor="middle">Bean creation &amp; wiring</text>
  <text x="575" y="258" font-size="10" fill="#333333" text-anchor="middle">beans instantiated, proxies (CGLIB/JDK dynamic</text>
  <text x="575" y="272" font-size="10" fill="#333333" text-anchor="middle">proxy) created, the dependency graph wired</text>

  <line x1="575" y1="282" x2="575" y2="294" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="410" y="294" width="330" height="54" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="575" y="315" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">App ready</text>
  <text x="575" y="333" font-size="10" fill="#333333" text-anchor="middle">startup time tracks classpath size &amp; bean count</text>

  <!-- bottom note -->
  <rect x="40" y="392" width="680" height="86" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="411" font-size="10.5" font-weight="bold" fill="#666666" text-anchor="middle">Where Spring Boot narrows this gap</text>
  <text x="380" y="429" font-size="10" fill="#666666" text-anchor="middle">Spring's AOT engine (`spring-boot:process-aot`) precomputes bean definitions ahead of time for a</text>
  <text x="380" y="445" font-size="10" fill="#666666" text-anchor="middle">GraalVM native-image build, replacing part of the runtime reflection above -- but the default JVM</text>
  <text x="380" y="461" font-size="10" fill="#666666" text-anchor="middle">startup path most Spring Boot applications actually run is still the fully runtime-resolved pipeline shown here.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
