<svg viewBox="0 0 900 420" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Managed domain versus Serverless collection: where the data lives</text>

  <rect x="20" y="48" width="415" height="352" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="227" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">Managed domain (cluster you size)</text>
  <text x="227" y="92" text-anchor="middle" font-size="11" fill="#123a72">instance hours + EBS, Multi-AZ with standby</text>

  <rect x="40" y="108" width="375" height="26" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="227" y="126" text-anchor="middle" font-size="11" fill="#123a72">3 dedicated master nodes (one per AZ)</text>

  <rect x="40" y="144" width="115" height="96" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="97" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">AZ a</text>
  <text x="97" y="184" text-anchor="middle" font-size="11" fill="#123a72">data node</text>
  <text x="97" y="200" text-anchor="middle" font-size="11" fill="#123a72">shards + EBS</text>
  <text x="97" y="224" text-anchor="middle" font-size="10" fill="#123a72">active</text>
  <rect x="170" y="144" width="115" height="96" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="227" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">AZ b</text>
  <text x="227" y="184" text-anchor="middle" font-size="11" fill="#123a72">data node</text>
  <text x="227" y="200" text-anchor="middle" font-size="11" fill="#123a72">shards + EBS</text>
  <text x="227" y="224" text-anchor="middle" font-size="10" fill="#123a72">active</text>
  <rect x="300" y="144" width="115" height="96" rx="6" fill="#f3f3f3" stroke="#7a7a7a" stroke-dasharray="5 3"/>
  <text x="357" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#333333">AZ c</text>
  <text x="357" y="184" text-anchor="middle" font-size="11" fill="#333333">data node</text>
  <text x="357" y="200" text-anchor="middle" font-size="11" fill="#333333">shards + EBS</text>
  <text x="357" y="224" text-anchor="middle" font-size="10" fill="#333333">standby</text>

  <rect x="40" y="254" width="375" height="26" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="227" y="272" text-anchor="middle" font-size="11" fill="#5c3b00">UltraWarm nodes (S3 backed, read-only) and cold storage</text>
  <text x="227" y="306" text-anchor="middle" font-size="11" fill="#123a72">Endpoint: public or inside one VPC (chosen at creation)</text>
  <text x="227" y="324" text-anchor="middle" font-size="11" fill="#123a72">Access: domain policy + fine-grained access control</text>
  <text x="227" y="342" text-anchor="middle" font-size="11" fill="#123a72">Snapshots: automated hourly + manual to your S3 bucket</text>
  <text x="227" y="372" text-anchor="middle" font-size="11" font-style="italic" fill="#123a72">full plugin set, every API, you pick instances and shards</text>

  <rect x="465" y="48" width="415" height="352" rx="10" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.8"/>
  <text x="672" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Serverless collection (capacity you bound)</text>
  <text x="672" y="92" text-anchor="middle" font-size="11" fill="#14532d">OCU-hours for indexing and search, S3 storage</text>

  <rect x="485" y="108" width="375" height="26" rx="6" fill="#d2ecd9" stroke="#2e9d4a"/>
  <text x="672" y="126" text-anchor="middle" font-size="11" fill="#14532d">Collection group: min / max OCU, shared by its collections</text>

  <rect x="485" y="144" width="175" height="60" rx="6" fill="#ffffff" stroke="#2e9d4a"/>
  <text x="572" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Indexing OCUs</text>
  <text x="572" y="184" text-anchor="middle" font-size="11" fill="#14532d">scale 0 to max</text>
  <rect x="685" y="144" width="175" height="60" rx="6" fill="#ffffff" stroke="#2e9d4a"/>
  <text x="772" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Search OCUs</text>
  <text x="772" y="184" text-anchor="middle" font-size="11" fill="#14532d">scale 0 to max</text>

  <rect x="485" y="218" width="375" height="40" rx="6" fill="#fff4d6" stroke="#b7791f"/>
  <text x="672" y="236" text-anchor="middle" font-size="11" fill="#5c3b00">Amazon S3 holds the indexes (storage decoupled from compute)</text>
  <text x="672" y="250" text-anchor="middle" font-size="10" fill="#5c3b00">no shards, replicas or instance types to choose</text>
  <text x="672" y="288" text-anchor="middle" font-size="11" fill="#14532d">Types: search, vector search (NextGen); time series (Classic)</text>
  <text x="672" y="306" text-anchor="middle" font-size="11" fill="#14532d">Endpoint: public or VPC endpoint rules (network policy)</text>
  <text x="672" y="324" text-anchor="middle" font-size="11" fill="#14532d">Access: data access policy + IAM (aoss: actions)</text>
  <text x="672" y="342" text-anchor="middle" font-size="11" fill="#14532d">Idle 10 minutes: scales to 0 OCU, first request waits 10 to 30 s</text>
  <text x="672" y="372" text-anchor="middle" font-size="11" font-style="italic" fill="#14532d">subset of APIs and plugins, no capacity planning</text>
</svg>
