<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Three browser automation architectures side by side: Selenium sends WebDriver commands over HTTP to a driver process that controls the browser, Playwright sends its own protocol over a pipe or WebSocket to a patched browser build, and Cypress runs the test code inside the browser next to the application with a Node.js process that handles the network and file system</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Where the test code runs and how it reaches the page</text>
<text x="20" y="60" font-size="13" font-weight="bold" fill="#1b5e20">Selenium: out of process, standard protocol</text>
<rect x="20" y="72" width="150" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="95.0" y="98.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Test code</text><text x="95.0" y="113.0" font-size="10" fill="#444" text-anchor="middle">any language binding</text>
<rect x="300" y="72" width="170" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="385.0" y="98.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Driver process</text><text x="385.0" y="113.0" font-size="10" fill="#444" text-anchor="middle">chromedriver, geckodriver</text>
<rect x="600" y="72" width="170" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="685.0" y="98.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Real browser</text><text x="685.0" y="113.0" font-size="10" fill="#444" text-anchor="middle">branded or open source</text>
<line x1="170" y1="92" x2="300" y2="92" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="235.0" y="86" font-size="9.5" fill="#37474f" text-anchor="middle">WebDriver Classic (HTTP)</text>
<line x1="470" y1="92" x2="600" y2="92" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="535.0" y="86" font-size="9.5" fill="#37474f" text-anchor="middle">native automation</text>
<line x1="300" y1="114" x2="170" y2="114" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="235.0" y="108" font-size="9.5" fill="#37474f" text-anchor="middle">BiDi events (WebSocket)</text>
<text x="20" y="178" font-size="13" font-weight="bold" fill="#0d47a1">Playwright: out of process, own protocol, patched builds</text>
<rect x="20" y="190" width="150" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="95.0" y="216.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Test runner</text><text x="95.0" y="231.0" font-size="10" fill="#444" text-anchor="middle">Node.js, Python, Java, .NET</text>
<rect x="300" y="190" width="170" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="385.0" y="216.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Playwright driver</text><text x="385.0" y="231.0" font-size="10" fill="#444" text-anchor="middle">one Node.js server process</text>
<rect x="600" y="190" width="170" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="685.0" y="216.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Chromium, Firefox, WebKit</text><text x="685.0" y="231.0" font-size="10" fill="#444" text-anchor="middle">builds Playwright ships</text>
<line x1="170" y1="210" x2="300" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="235.0" y="204" font-size="9.5" fill="#37474f" text-anchor="middle">client/server protocol</text>
<line x1="470" y1="210" x2="600" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="535.0" y="204" font-size="9.5" fill="#37474f" text-anchor="middle">CDP or engine protocol</text>
<line x1="300" y1="232" x2="170" y2="232" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="235.0" y="226" font-size="9.5" fill="#37474f" text-anchor="middle">results and events</text>
<text x="20" y="296" font-size="13" font-weight="bold" fill="#6a1b9a">Cypress: tests run inside the browser</text>
<rect x="20" y="308" width="150" height="56" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="95.0" y="334.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Node.js process</text><text x="95.0" y="349.0" font-size="10" fill="#444" text-anchor="middle">config, tasks, file system</text>
<rect x="300" y="302" width="470" height="100" rx="8" fill="#fafafa" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="5 3"/><text x="310" y="318" font-size="10" fill="#6a1b9a">Browser (one at a time)</text>
<rect x="315" y="326" width="200" height="56" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="415.0" y="352.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Test code</text><text x="415.0" y="367.0" font-size="10" fill="#444" text-anchor="middle">same run loop as the app</text>
<rect x="555" y="326" width="200" height="56" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="655.0" y="352.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Application under test</text><text x="655.0" y="367.0" font-size="10" fill="#444" text-anchor="middle">DOM, network, JavaScript</text>
<line x1="170" y1="336" x2="300" y2="336" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="235.0" y="330" font-size="9.5" fill="#37474f" text-anchor="middle">WebSocket, proxy</text>
<line x1="515" y1="354" x2="555" y2="354" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/><text x="535.0" y="348" font-size="9.5" fill="#37474f" text-anchor="middle">direct access</text>
<line x1="300" y1="356" x2="170" y2="356" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="235.0" y="350" font-size="9.5" fill="#37474f" text-anchor="middle">cy.task, events</text>
<text x="400" y="422" font-size="10" fill="#555" text-anchor="middle">Simplified: Cypress also drives some browser features through CDP or WebDriver BiDi</text>
</svg>