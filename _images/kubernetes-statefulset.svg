<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A StatefulSet with three ordered Pods each bound to its own PersistentVolumeClaim and reachable by its own per-pod DNS name</title>
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">StatefulSet/postgres -- stable identity, storage and DNS</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">a headless Service, three ordinals, one PersistentVolumeClaim per ordinal</text>

  <!-- headless service -->
  <rect x="230" y="60" width="320" height="46" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="80" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Service/postgres -- clusterIP: None (headless)</text>
  <text x="390" y="96" font-size="9" fill="#333333" text-anchor="middle">serviceName referenced by the StatefulSet below</text>

  <!-- statefulset boundary -->
  <rect x="30" y="130" width="720" height="180" rx="8" fill="#f7f9fb" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="60" y="150" font-size="12.5" font-weight="bold" fill="#2d6a34">StatefulSet/postgres (replicas: 3)</text>

  <!-- pod 0 -->
  <rect x="55" y="166" width="210" height="130" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="160" y="186" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod postgres-0</text>
  <text x="160" y="202" font-size="8.5" fill="#333333" text-anchor="middle">postgres-0.postgres.bookshelf</text>
  <text x="160" y="214" font-size="8.5" fill="#333333" text-anchor="middle">.svc.cluster.local</text>
  <rect x="75" y="226" width="170" height="24" rx="3" fill="#ffffff" stroke="#2d6a34" stroke-width="1"/>
  <text x="160" y="242" font-size="9" fill="#333333" text-anchor="middle">mounts data-postgres-0</text>
  <text x="160" y="278" font-size="8.5" fill="#555555" text-anchor="middle">created first, deleted last</text>

  <!-- pod 1 -->
  <rect x="285" y="166" width="210" height="130" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="390" y="186" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod postgres-1</text>
  <text x="390" y="202" font-size="8.5" fill="#333333" text-anchor="middle">postgres-1.postgres.bookshelf</text>
  <text x="390" y="214" font-size="8.5" fill="#333333" text-anchor="middle">.svc.cluster.local</text>
  <rect x="305" y="226" width="170" height="24" rx="3" fill="#ffffff" stroke="#2d6a34" stroke-width="1"/>
  <text x="390" y="242" font-size="9" fill="#333333" text-anchor="middle">mounts data-postgres-1</text>
  <text x="390" y="278" font-size="8.5" fill="#555555" text-anchor="middle">created second</text>

  <!-- pod 2 -->
  <rect x="515" y="166" width="210" height="130" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="620" y="186" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Pod postgres-2</text>
  <text x="620" y="202" font-size="8.5" fill="#333333" text-anchor="middle">postgres-2.postgres.bookshelf</text>
  <text x="620" y="214" font-size="8.5" fill="#333333" text-anchor="middle">.svc.cluster.local</text>
  <rect x="535" y="226" width="170" height="24" rx="3" fill="#ffffff" stroke="#2d6a34" stroke-width="1"/>
  <text x="620" y="242" font-size="9" fill="#333333" text-anchor="middle">mounts data-postgres-2</text>
  <text x="620" y="278" font-size="8.5" fill="#555555" text-anchor="middle">created last, deleted first</text>

  <!-- service to pods lines -->
  <line x1="330" y1="106" x2="160" y2="166" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="390" y1="106" x2="390" y2="166" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="450" y1="106" x2="620" y2="166" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- pvc row -->
  <rect x="30" y="330" width="720" height="100" rx="8" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.4"/>
  <text x="60" y="352" font-size="12.5" font-weight="bold" fill="#1f6b6b">PersistentVolumeClaims (one per ordinal, from volumeClaimTemplates)</text>

  <rect x="55" y="366" width="210" height="46" rx="4" fill="#ffffff" stroke="#1f6b6b" stroke-width="1.1"/>
  <text x="160" y="386" font-size="10" font-weight="bold" fill="#1f6b6b" text-anchor="middle">data-postgres-0</text>
  <text x="160" y="400" font-size="8.5" fill="#555555" text-anchor="middle">bound to its own PersistentVolume</text>

  <rect x="285" y="366" width="210" height="46" rx="4" fill="#ffffff" stroke="#1f6b6b" stroke-width="1.1"/>
  <text x="390" y="386" font-size="10" font-weight="bold" fill="#1f6b6b" text-anchor="middle">data-postgres-1</text>
  <text x="390" y="400" font-size="8.5" fill="#555555" text-anchor="middle">bound to its own PersistentVolume</text>

  <rect x="515" y="366" width="210" height="46" rx="4" fill="#ffffff" stroke="#1f6b6b" stroke-width="1.1"/>
  <text x="620" y="386" font-size="10" font-weight="bold" fill="#1f6b6b" text-anchor="middle">data-postgres-2</text>
  <text x="620" y="400" font-size="8.5" fill="#555555" text-anchor="middle">bound to its own PersistentVolume</text>

  <text x="390" y="426" font-size="8.5" fill="#555555" text-anchor="middle">retained across Pod rescheduling; retention on delete/scale set by persistentVolumeClaimRetentionPolicy</text>

  <!-- mount lines from pods to pvcs -->
  <line x1="160" y1="296" x2="160" y2="366" stroke="#1f6b6b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="390" y1="296" x2="390" y2="366" stroke="#1f6b6b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="620" y1="296" x2="620" y2="366" stroke="#1f6b6b" stroke-width="1.4" stroke-dasharray="4,3"/>
</svg>
