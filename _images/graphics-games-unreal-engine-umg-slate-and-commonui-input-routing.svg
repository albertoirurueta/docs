<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">CommonUI input routing and layers</text>
<rect x="20" y="60" width="150" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="78.7" text-anchor="middle" font-size="12" fill="#1F2937">Keyboard, gamepad,</text>
<text x="95.0" y="93.7" text-anchor="middle" font-size="12" fill="#1F2937">touch</text>
<rect x="215" y="60" width="170" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="300.0" y="78.7" text-anchor="middle" font-size="12" fill="#065F46">UCommonGameViewport</text>
<text x="300.0" y="93.7" text-anchor="middle" font-size="12" fill="#065F46">Client</text>
<rect x="430" y="60" width="170" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="515.0" y="78.7" text-anchor="middle" font-size="12" fill="#065F46">UCommonUIActionRouter</text>
<text x="515.0" y="93.7" text-anchor="middle" font-size="12" fill="#065F46">Base (per local player)</text>
<rect x="630" y="60" width="110" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="685.0" y="78.7" text-anchor="middle" font-size="12" fill="#3730A3">Active widget</text>
<text x="685.0" y="93.7" text-anchor="middle" font-size="12" fill="#3730A3">consumes it</text>
<line x1="170" y1="82" x2="213" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="385" y1="82" x2="428" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<line x1="600" y1="82" x2="628" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
<text x="380" y="130" text-anchor="middle" font-size="12" fill="#374151">Only the topmost painted layer receives routed input; layers below stay active but silent.</text>
<rect x="20" y="150" width="470" height="270" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255" y="172" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Layers of the primary layout (UCommonActivatableWidgetStack)</text>
<rect x="40" y="190" width="430" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="255.0" y="214.2" text-anchor="middle" font-size="12" fill="#3730A3">Modal stack</text>
<text x="255.0" y="230.2" text-anchor="middle" font-size="12" fill="#3730A3">WBP_ConfirmReturn  (active, gets input and focus)</text>
<rect x="40" y="262" width="430" height="56" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255.0" y="286.2" text-anchor="middle" font-size="12" fill="#1F2937">Menu stack</text>
<text x="255.0" y="302.2" text-anchor="middle" font-size="12" fill="#1F2937">WBP_PauseMenu  (deactivated while the modal is on top)</text>
<rect x="40" y="334" width="430" height="56" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255.0" y="358.2" text-anchor="middle" font-size="12" fill="#1F2937">Game stack</text>
<text x="255.0" y="374.2" text-anchor="middle" font-size="12" fill="#1F2937">WBP_BookshelfHUD  (stays activated, not routed to)</text>
<line x1="255" y1="246" x2="255" y2="262" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c1)"/>
<line x1="255" y1="318" x2="255" y2="334" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c1)"/>
<rect x="520" y="150" width="220" height="270" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630" y="172" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">On activation</text>
<text x="630" y="198" text-anchor="middle" font-size="12" fill="#92400E">GetDesiredInputConfig()</text>
<text x="630" y="213" text-anchor="middle" font-size="12" fill="#92400E">returns an FUIInputConfig:</text>
<text x="630" y="228" text-anchor="middle" font-size="12" fill="#92400E">input mode (Menu, Game, All),</text>
<text x="630" y="243" text-anchor="middle" font-size="12" fill="#92400E">mouse capture, mouse lock.</text>
<text x="630" y="258" text-anchor="middle" font-size="12" fill="#92400E"></text>
<text x="630" y="273" text-anchor="middle" font-size="12" fill="#92400E">NativeGetDesiredFocus</text>
<text x="630" y="288" text-anchor="middle" font-size="12" fill="#92400E">Target() picks the button</text>
<text x="630" y="303" text-anchor="middle" font-size="12" fill="#92400E">that gets gamepad focus.</text>
<text x="630" y="318" text-anchor="middle" font-size="12" fill="#92400E"></text>
<text x="630" y="333" text-anchor="middle" font-size="12" fill="#92400E">On deactivation the router</text>
<text x="630" y="348" text-anchor="middle" font-size="12" fill="#92400E">restores the previous</text>
<text x="630" y="363" text-anchor="middle" font-size="12" fill="#92400E">input config.</text>
<path d="M490,218 L520,218" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c1)"/>
</svg>
