<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">RDS deployment options: Multi-AZ instance, Multi-AZ DB cluster, read replicas</text>

  <!-- Column 1 -->
  <rect x="15" y="45" width="280" height="370" rx="10" fill="#f4f7fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="155" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#123a72">Multi-AZ DB instance</text>
  <text x="155" y="88" text-anchor="middle" font-size="11" fill="#3c4a58">one standby, synchronous, no reads</text>
  <rect x="30" y="105" width="120" height="110" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">AZ a</text>
  <rect x="42" y="136" width="96" height="40" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="90" y="160" text-anchor="middle" font-size="12" fill="#123a72">Primary</text>
  <text x="90" y="196" text-anchor="middle" font-size="10" fill="#3c4a58">EBS volume</text>
  <rect x="170" y="105" width="110" height="110" rx="8" fill="#eef0f2" stroke="#7a8794" stroke-dasharray="4,3"/>
  <text x="225" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#3c4a58">AZ b</text>
  <rect x="180" y="136" width="90" height="40" rx="6" fill="#ffffff" stroke="#7a8794"/>
  <text x="225" y="160" text-anchor="middle" font-size="12" fill="#3c4a58">Standby</text>
  <text x="225" y="196" text-anchor="middle" font-size="10" fill="#3c4a58">EBS volume</text>
  <line x1="138" y1="156" x2="180" y2="156" stroke="#1a5fb4" stroke-width="2"/>
  <text x="159" y="150" text-anchor="middle" font-size="9" fill="#123a72">sync</text>
  <text x="155" y="245" text-anchor="middle" font-size="11" fill="#1a1a1a">One DB endpoint, DNS flips on failover</text>
  <text x="155" y="265" text-anchor="middle" font-size="11" fill="#1a1a1a">Failover typically 60-120 s</text>
  <text x="155" y="285" text-anchor="middle" font-size="11" fill="#1a1a1a">All engines (SQL Server and Oracle</text>
  <text x="155" y="301" text-anchor="middle" font-size="11" fill="#1a1a1a">use their own mirroring/replication)</text>
  <text x="155" y="330" text-anchor="middle" font-size="11" fill="#3c4a58">Standby is for availability only:</text>
  <text x="155" y="346" text-anchor="middle" font-size="11" fill="#3c4a58">it never serves queries.</text>
  <text x="155" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Default choice for production</text>

  <!-- Column 2 -->
  <rect x="310" y="45" width="280" height="370" rx="10" fill="#f1f8f3" stroke="#1e7b3a" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Multi-AZ DB cluster</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#3c4a58">writer + two readable standbys</text>
  <rect x="322" y="105" width="82" height="110" rx="8" fill="#e6f4ea" stroke="#1e7b3a"/>
  <text x="363" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">AZ a</text>
  <rect x="330" y="136" width="66" height="40" rx="6" fill="#ffffff" stroke="#1e7b3a"/>
  <text x="363" y="160" text-anchor="middle" font-size="11" fill="#14532d">Writer</text>
  <rect x="409" y="105" width="82" height="110" rx="8" fill="#e6f4ea" stroke="#1e7b3a"/>
  <text x="450" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">AZ b</text>
  <rect x="417" y="136" width="66" height="40" rx="6" fill="#ffffff" stroke="#1e7b3a"/>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#14532d">Reader</text>
  <rect x="496" y="105" width="82" height="110" rx="8" fill="#e6f4ea" stroke="#1e7b3a"/>
  <text x="537" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">AZ c</text>
  <rect x="504" y="136" width="66" height="40" rx="6" fill="#ffffff" stroke="#1e7b3a"/>
  <text x="537" y="160" text-anchor="middle" font-size="11" fill="#14532d">Reader</text>
  <text x="450" y="196" text-anchor="middle" font-size="10" fill="#3c4a58">local NVMe or EBS, semi-sync log shipping</text>
  <text x="450" y="245" text-anchor="middle" font-size="11" fill="#1a1a1a">Cluster, reader and instance endpoints</text>
  <text x="450" y="265" text-anchor="middle" font-size="11" fill="#1a1a1a">Failover typically under 35 s</text>
  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#1a1a1a">RDS for PostgreSQL and MySQL only</text>
  <text x="450" y="301" text-anchor="middle" font-size="11" fill="#1a1a1a">(limited instance classes)</text>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#3c4a58">Readers offload SELECTs, but this is</text>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#3c4a58">not Aurora: storage is not shared.</text>
  <text x="450" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Faster failover and read scaling</text>

  <!-- Column 3 -->
  <rect x="605" y="45" width="280" height="370" rx="10" fill="#fff8ec" stroke="#c77700" stroke-width="1.5"/>
  <text x="745" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4800">Read replicas</text>
  <text x="745" y="88" text-anchor="middle" font-size="11" fill="#3c4a58">asynchronous copies for scale and DR</text>
  <rect x="620" y="105" width="110" height="64" rx="8" fill="#fff4e0" stroke="#c77700"/>
  <text x="675" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4800">Source, us-east-1</text>
  <rect x="632" y="134" width="86" height="28" rx="6" fill="#ffffff" stroke="#c77700"/>
  <text x="675" y="152" text-anchor="middle" font-size="11" fill="#7a4800">Primary</text>
  <rect x="750" y="105" width="125" height="30" rx="6" fill="#ffffff" stroke="#c77700"/>
  <text x="812" y="124" text-anchor="middle" font-size="11" fill="#7a4800">Replica, same Region</text>
  <rect x="750" y="145" width="125" height="30" rx="6" fill="#ffffff" stroke="#c77700"/>
  <text x="812" y="164" text-anchor="middle" font-size="11" fill="#7a4800">Replica, other Region</text>
  <line x1="730" y1="125" x2="750" y2="120" stroke="#c77700" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="730" y1="145" x2="750" y2="160" stroke="#c77700" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="745" y="205" text-anchor="middle" font-size="10" fill="#3c4a58">async replication, replica lag is possible</text>
  <text x="745" y="245" text-anchor="middle" font-size="11" fill="#1a1a1a">Each replica has its own endpoint</text>
  <text x="745" y="265" text-anchor="middle" font-size="11" fill="#1a1a1a">Can be promoted to a standalone DB</text>
  <text x="745" y="285" text-anchor="middle" font-size="11" fill="#1a1a1a">Cross-Region replicas for DR and</text>
  <text x="745" y="301" text-anchor="middle" font-size="11" fill="#1a1a1a">low-latency reads near users</text>
  <text x="745" y="330" text-anchor="middle" font-size="11" fill="#3c4a58">Combine with Multi-AZ on the source:</text>
  <text x="745" y="346" text-anchor="middle" font-size="11" fill="#3c4a58">replicas are not an HA mechanism.</text>
  <text x="745" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4800">Read scaling and Regional DR</text>
</svg>
