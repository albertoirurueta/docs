<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A Kubernetes cluster: control plane and node components</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <text x="400" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">A Kubernetes cluster</text>
  <text x="400" y="42" font-size="10.5" fill="#666666" text-anchor="middle">control plane on the left, worker nodes on the right, talking only through the API server</text>

  <!-- Control plane box -->
  <rect x="20" y="60" width="360" height="430" rx="6" fill="#f7f9fb" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="200" y="80" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Control plane</text>

  <rect x="40" y="94" width="320" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="200" y="113" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">kube-apiserver</text>
  <text x="200" y="128" font-size="9" fill="#333333" text-anchor="middle">REST front door -- auth, admission, validation</text>

  <rect x="40" y="150" width="320" height="46" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.2"/>
  <text x="200" y="169" font-size="11.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">etcd</text>
  <text x="200" y="184" font-size="9" fill="#333333" text-anchor="middle">consistent key-value store -- the only source of truth</text>

  <rect x="40" y="206" width="320" height="46" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.2"/>
  <text x="200" y="225" font-size="11.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">kube-scheduler</text>
  <text x="200" y="240" font-size="9" fill="#333333" text-anchor="middle">assigns unscheduled Pods to a node</text>

  <rect x="40" y="262" width="320" height="46" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="200" y="281" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">kube-controller-manager</text>
  <text x="200" y="296" font-size="9" fill="#333333" text-anchor="middle">runs the built-in reconciliation loops (Deployment, Node, ...)</text>

  <rect x="40" y="318" width="320" height="46" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.2"/>
  <text x="200" y="337" font-size="11.5" font-weight="bold" fill="#5b3a8c" text-anchor="middle">cloud-controller-manager</text>
  <text x="200" y="352" font-size="9" fill="#333333" text-anchor="middle">optional -- talks to the cloud provider's API (LB, nodes, routes)</text>

  <rect x="40" y="374" width="320" height="46" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.2"/>
  <text x="200" y="393" font-size="11.5" font-weight="bold" fill="#8f2a2a" text-anchor="middle">CoreDNS</text>
  <text x="200" y="408" font-size="9" fill="#333333" text-anchor="middle">cluster DNS add-on -- usually a Deployment behind a Service</text>

  <text x="200" y="440" font-size="9.5" fill="#555555" text-anchor="middle">Everything above talks only to the API server, never to each other directly.</text>
  <text x="200" y="454" font-size="9.5" fill="#555555" text-anchor="middle">A managed cluster (GKE, EKS, AKS) hosts this side for you.</text>

  <!-- Node box -->
  <rect x="420" y="60" width="360" height="430" rx="6" fill="#f7f9fb" stroke="#1f6b6b" stroke-width="1.3"/>
  <text x="600" y="80" font-size="12.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">Worker node</text>

  <rect x="440" y="94" width="320" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="600" y="113" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">kubelet</text>
  <text x="600" y="128" font-size="9" fill="#333333" text-anchor="middle">registers the node, runs Pods, reports node and Pod status</text>

  <rect x="440" y="150" width="320" height="46" rx="4" fill="#e9f6f6" stroke="#1f6b6b" stroke-width="1.2"/>
  <text x="600" y="169" font-size="11.5" font-weight="bold" fill="#1f6b6b" text-anchor="middle">kube-proxy</text>
  <text x="600" y="184" font-size="9" fill="#333333" text-anchor="middle">programs Service virtual IPs (nftables mode by default)</text>

  <rect x="440" y="206" width="320" height="46" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.2"/>
  <text x="600" y="225" font-size="11.5" font-weight="bold" fill="#9a5a12" text-anchor="middle">Container runtime (CRI)</text>
  <text x="600" y="240" font-size="9" fill="#333333" text-anchor="middle">containerd or CRI-O -- pulls images, runs containers</text>

  <rect x="440" y="262" width="320" height="46" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="600" y="281" font-size="11.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">CNI plugin</text>
  <text x="600" y="296" font-size="9" fill="#333333" text-anchor="middle">wires each Pod's network namespace to the cluster network</text>

  <rect x="440" y="330" width="150" height="70" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
  <text x="515" y="352" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">Pod</text>
  <text x="515" y="366" font-size="8.5" fill="#333333" text-anchor="middle">catalog-api</text>
  <text x="515" y="380" font-size="8.5" fill="#333333" text-anchor="middle">container(s)</text>

  <rect x="610" y="330" width="150" height="70" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
  <text x="685" y="352" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">Pod</text>
  <text x="685" y="366" font-size="8.5" fill="#333333" text-anchor="middle">reviews-api</text>
  <text x="685" y="380" font-size="8.5" fill="#333333" text-anchor="middle">container(s)</text>

  <text x="600" y="440" font-size="9.5" fill="#555555" text-anchor="middle">A cluster has many such nodes; the kubelet on each one is the</text>
  <text x="600" y="454" font-size="9.5" fill="#555555" text-anchor="middle">only control-plane agent running there.</text>

  <!-- connecting arrow between the two boxes -->
  <line x1="380" y1="117" x2="440" y2="117" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="440" y1="173" x2="380" y2="173" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="410" y="108" font-size="8" fill="#444444" text-anchor="middle">watch</text>
  <text x="410" y="192" font-size="8" fill="#444444" text-anchor="middle">status</text>
</svg>
