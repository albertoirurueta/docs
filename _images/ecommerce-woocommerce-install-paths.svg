<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Six ways to get a WordPress and WooCommerce site running locally</title>
  <desc id="d">Six cards in two rows: the wp-admin installer, WP-CLI, the official Docker images with Compose, WordPress Studio, wp-env and the Playground CLI. Each card says where it runs, what it needs and whether it was run for this page.</desc>
  <rect x="15" y="20" width="318" height="205" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="174.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">1. wp-admin installer</text>
  <text x="174.0" y="68" text-anchor="middle" font-size="12.5">Plugins &gt; Add New &gt; WooCommerce</text>
  <text x="174.0" y="88" text-anchor="middle" font-size="12.5">needs a running WordPress</text>
  <text x="174.0" y="108" text-anchor="middle" font-size="12.5">Core Profiler runs in the browser</text>
  <text x="174.0" y="128" text-anchor="middle" font-size="12.5">best for hosting and production</text>
  <path d="M35 175 L313 175" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="174" y="205" text-anchor="middle" font-size="12" font-weight="bold">Run: described, wizard not run</text>
  <rect x="347" y="20" width="318" height="205" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="506.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">2. WP-CLI</text>
  <text x="506.0" y="68" text-anchor="middle" font-size="12.5">wp core download and install</text>
  <text x="506.0" y="88" text-anchor="middle" font-size="12.5">wp plugin install woocommerce</text>
  <text x="506.0" y="108" text-anchor="middle" font-size="12.5">scriptable, same in CI</text>
  <text x="506.0" y="128" text-anchor="middle" font-size="12.5">needs PHP, a database, a web server</text>
  <path d="M367 175 L645 175" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="506" y="205" text-anchor="middle" font-size="12" font-weight="bold">Run: yes, WordPress 7.1.3 + 11.2.1</text>
  <rect x="679" y="20" width="318" height="205" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="838.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">3. Official Docker images</text>
  <text x="838.0" y="68" text-anchor="middle" font-size="12.5">wordpress:7.1.3-php8.3-apache</text>
  <text x="838.0" y="88" text-anchor="middle" font-size="12.5">mariadb:11.8 with a health check</text>
  <text x="838.0" y="108" text-anchor="middle" font-size="12.5">Compose file, WP-CLI as a profile</text>
  <text x="838.0" y="128" text-anchor="middle" font-size="12.5">closest to a Linux server</text>
  <path d="M699 175 L977 175" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="838" y="205" text-anchor="middle" font-size="12" font-weight="bold">Run: yes, Compose on port 8097</text>
  <rect x="15" y="245" width="318" height="205" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="174.0" y="269" text-anchor="middle" font-size="14" font-weight="bold">4. WordPress Studio</text>
  <text x="174.0" y="293" text-anchor="middle" font-size="12.5">desktop app and wp-studio CLI</text>
  <text x="174.0" y="313" text-anchor="middle" font-size="12.5">no Docker, one site per folder</text>
  <text x="174.0" y="333" text-anchor="middle" font-size="12.5">blueprints, preview sites</text>
  <text x="174.0" y="353" text-anchor="middle" font-size="12.5">recommended in the Woo docs</text>
  <path d="M35 400 L313 400" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="174" y="430" text-anchor="middle" font-size="12" font-weight="bold">Run: no, only CLI help read</text>
  <rect x="347" y="245" width="318" height="205" rx="10" fill="#1abc9c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="506.0" y="269" text-anchor="middle" font-size="14" font-weight="bold">5. wp-env</text>
  <text x="506.0" y="293" text-anchor="middle" font-size="12.5">npm package @wordpress/env 12.0.0</text>
  <text x="506.0" y="313" text-anchor="middle" font-size="12.5">Docker, driven by .wp-env.json</text>
  <text x="506.0" y="333" text-anchor="middle" font-size="12.5">mounts plugins and themes</text>
  <text x="506.0" y="353" text-anchor="middle" font-size="12.5">good for CI and test suites</text>
  <path d="M367 400 L645 400" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="506" y="430" text-anchor="middle" font-size="12" font-weight="bold">Run: yes, 11.2.1 and 11.3 beta</text>
  <rect x="679" y="245" width="318" height="205" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="838.0" y="269" text-anchor="middle" font-size="14" font-weight="bold">6. Playground CLI</text>
  <text x="838.0" y="293" text-anchor="middle" font-size="12.5">npm package @wp-playground/cli</text>
  <text x="838.0" y="313" text-anchor="middle" font-size="12.5">WebAssembly PHP, SQLite database</text>
  <text x="838.0" y="333" text-anchor="middle" font-size="12.5">no Docker, auto-login, blueprints</text>
  <text x="838.0" y="353" text-anchor="middle" font-size="12.5">replaces the deprecated wp-now</text>
  <path d="M699 400 L977 400" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="838" y="430" text-anchor="middle" font-size="12" font-weight="bold">Run: yes, 11.2.1 with a blueprint</text>
</svg>
