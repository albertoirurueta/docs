<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Declared type, dynamic type and dispatch of a polymorphic variable</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a typical implementation: the standard defines the behaviour, not the memory layout</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999999"/></marker>
  </defs>

  <!-- the variable -->
  <rect x="20" y="80" width="250" height="150" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="145" y="104" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">the variable s</text>
  <text x="145" y="126" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">class(heat_source_t),</text>
  <text x="145" y="142" font-size="11.5" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">allocatable :: s</text>
  <text x="145" y="170" font-size="12" fill="#222222" text-anchor="middle">declared type: heat_source_t</text>
  <text x="145" y="188" font-size="12" fill="#222222" text-anchor="middle">fixed at compile time; decides</text>
  <text x="145" y="204" font-size="12" fill="#222222" text-anchor="middle">which components s% may name</text>
  <text x="145" y="221" font-size="11" fill="#555555" text-anchor="middle">holds a pointer to the object + a type link</text>

  <!-- the object -->
  <rect x="340" y="80" width="250" height="170" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="465" y="104" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">the object after allocate (disc_source_t :: s)</text>
  <rect x="360" y="116" width="210" height="76" rx="4" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="465" y="134" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">parent component heat_source_t</text>
  <text x="465" y="153" font-size="12" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">x   y   power</text>
  <text x="465" y="172" font-size="11" fill="#555555" text-anchor="middle">all that s% can name (declared type)</text>
  <rect x="360" y="198" width="210" height="44" rx="4" fill="#fde9d3" stroke="#d9772b"/>
  <text x="465" y="217" font-size="12" font-weight="bold" fill="#a04a00" text-anchor="middle">extension part</text>
  <text x="465" y="234" font-size="12" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">radius</text>

  <!-- descriptors -->
  <rect x="660" y="80" width="260" height="150" rx="8" fill="#fde9d3" stroke="#d9772b" stroke-width="2"/>
  <text x="790" y="102" font-size="13" font-weight="bold" fill="#a04a00" text-anchor="middle">type descriptor of disc_source_t</text>
  <text x="790" y="122" font-size="11" fill="#555555" text-anchor="middle">parent: heat_source_t   size: 256 bits</text>
  <text x="790" y="148" font-size="12" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">describe  -&gt; describe_source</text>
  <text x="790" y="170" font-size="12" font-family="Courier New, monospace" font-weight="bold" fill="#a04a00" text-anchor="middle">footprint -&gt; disc_footprint</text>
  <text x="790" y="196" font-size="11" fill="#555555" text-anchor="middle">overridden binding in bold</text>
  <text x="790" y="214" font-size="11" fill="#555555" text-anchor="middle">same_type_as compares descriptors</text>

  <rect x="660" y="290" width="260" height="120" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="790" y="312" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">type descriptor of heat_source_t</text>
  <text x="790" y="332" font-size="11" fill="#555555" text-anchor="middle">parent: none   size: 192 bits</text>
  <text x="790" y="358" font-size="12" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">describe  -&gt; describe_source</text>
  <text x="790" y="380" font-size="12" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">footprint -&gt; point_footprint</text>
  <text x="790" y="400" font-size="11" fill="#555555" text-anchor="middle">used when s is allocated as heat_source_t</text>

  <line x1="270" y1="150" x2="336" y2="150" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="303" y="142" font-size="10.5" fill="#1c4b73" text-anchor="middle">data</text>
  <path d="M145,80 V66 H790 V76" fill="none" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="61" font-size="10.5" fill="#1c4b73" text-anchor="middle">type link: the dynamic type</text>
  <line x1="790" y1="230" x2="790" y2="286" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="800" y="262" font-size="10.5" fill="#666666">extends</text>

  <!-- the call -->
  <rect x="20" y="330" width="570" height="140" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="305" y="354" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">what call s%footprint() does</text>
  <text x="40" y="378" font-size="12" fill="#222222">1. the compiler checks s%footprint against the declared type heat_source_t</text>
  <text x="40" y="398" font-size="12" fill="#222222">2. at run time it follows the type link of s to the dynamic type</text>
  <text x="40" y="418" font-size="12" fill="#222222">3. it calls the binding found there, passing s as the passed-object dummy</text>
  <text x="40" y="438" font-size="12" fill="#222222">4. a nonpolymorphic type(disc_source_t) variable skips step 2: the target is known</text>
  <text x="58" y="458" font-size="12" fill="#444444">so the compiler may inline it, which is where the cost difference comes from</text>
</svg>
