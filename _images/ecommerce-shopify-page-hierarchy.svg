<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Information hierarchy of the four key storefront pages</title>
  <desc>Four wireframes (home, collection, product and cart) with numbered blocks in reading order. Blue blocks identify the shop, green blocks carry content and amber blocks ask the visitor to decide or act.</desc>
  <text x="500" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">What each page says first, second and third</text>
  <text x="500" y="46" font-size="12" fill="#7b8794" text-anchor="middle">Numbers are the reading order; the order of the sections in the JSON template is the order in the DOM</text>
  <rect x="20" y="62" width="222" height="350" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="131.0" y="84" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Home</text>
  <rect x="30" y="94.0" width="202" height="52.8" rx="5" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <circle cx="47" cy="120.4" r="10" fill="#2f6db5"/>
  <text x="47" y="124.4" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="64" y="117.4" font-size="11.5" fill="#1f2933">Header: logo, menu,</text>
  <text x="64" y="131.4" font-size="11.5" fill="#1f2933">search, cart</text>
  <rect x="30" y="156.8" width="202" height="52.8" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="47" cy="183.2" r="10" fill="#b7791f"/>
  <text x="47" y="187.2" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="64" y="180.2" font-size="11.5" fill="#1f2933">Hero: one h1, one</text>
  <text x="64" y="194.2" font-size="11.5" fill="#1f2933">promise, one button</text>
  <rect x="30" y="219.6" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="47" cy="246.0" r="10" fill="#1f8a5b"/>
  <text x="47" y="250.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="64" y="243.0" font-size="11.5" fill="#1f2933">Featured collections:</text>
  <text x="64" y="257.0" font-size="11.5" fill="#1f2933">Beans, Equipment</text>
  <rect x="30" y="282.4" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="47" cy="308.8" r="10" fill="#1f8a5b"/>
  <text x="47" y="312.8" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="64" y="305.8" font-size="11.5" fill="#1f2933">Story and proof:</text>
  <text x="64" y="319.8" font-size="11.5" fill="#1f2933">roasting, reviews</text>
  <rect x="30" y="345.2" width="202" height="52.8" rx="5" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <circle cx="47" cy="371.6" r="10" fill="#2f6db5"/>
  <text x="47" y="375.6" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="64" y="368.6" font-size="11.5" fill="#1f2933">Footer: policies,</text>
  <text x="64" y="382.6" font-size="11.5" fill="#1f2933">newsletter, locale</text>
  <rect x="266" y="62" width="222" height="350" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="377.0" y="84" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Collection</text>
  <rect x="276" y="94.0" width="202" height="52.8" rx="5" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <circle cx="293" cy="120.4" r="10" fill="#2f6db5"/>
  <text x="293" y="124.4" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="310" y="117.4" font-size="11.5" fill="#1f2933">Header: logo, menu,</text>
  <text x="310" y="131.4" font-size="11.5" fill="#1f2933">search, cart</text>
  <rect x="276" y="156.8" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="293" cy="183.2" r="10" fill="#1f8a5b"/>
  <text x="293" y="187.2" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="310" y="180.2" font-size="11.5" fill="#1f2933">Title (h1) and short</text>
  <text x="310" y="194.2" font-size="11.5" fill="#1f2933">description</text>
  <rect x="276" y="219.6" width="202" height="52.8" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="293" cy="246.0" r="10" fill="#b7791f"/>
  <text x="293" y="250.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="310" y="243.0" font-size="11.5" fill="#1f2933">Filters and sort: origin,</text>
  <text x="310" y="257.0" font-size="11.5" fill="#1f2933">grind</text>
  <rect x="276" y="282.4" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="293" cy="308.8" r="10" fill="#1f8a5b"/>
  <text x="293" y="312.8" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="310" y="305.8" font-size="11.5" fill="#1f2933">Product grid: image,</text>
  <text x="310" y="319.8" font-size="11.5" fill="#1f2933">title, price</text>
  <rect x="276" y="345.2" width="202" height="52.8" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="293" cy="371.6" r="10" fill="#b7791f"/>
  <text x="293" y="375.6" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="310" y="368.6" font-size="11.5" fill="#1f2933">Pagination (25,000</text>
  <text x="310" y="382.6" font-size="11.5" fill="#1f2933">objects max)</text>
  <rect x="512" y="62" width="222" height="350" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="623.0" y="84" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Product</text>
  <rect x="522" y="94.0" width="202" height="42.3" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="539" cy="115.2" r="10" fill="#1f8a5b"/>
  <text x="539" y="119.2" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="556" y="112.2" font-size="11.5" fill="#1f2933">Gallery: first image</text>
  <text x="556" y="126.2" font-size="11.5" fill="#1f2933">loads eagerly</text>
  <rect x="522" y="146.3" width="202" height="42.3" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="539" cy="167.5" r="10" fill="#1f8a5b"/>
  <text x="539" y="171.5" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="556" y="164.5" font-size="11.5" fill="#1f2933">Title (h1) and price</text>
  <text x="556" y="178.5" font-size="11.5" fill="#1f2933">(sale marked)</text>
  <rect x="522" y="198.7" width="202" height="42.3" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="539" cy="219.8" r="10" fill="#b7791f"/>
  <text x="539" y="223.8" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="556" y="216.8" font-size="11.5" fill="#1f2933">Variant picker: origin,</text>
  <text x="556" y="230.8" font-size="11.5" fill="#1f2933">grind, size</text>
  <rect x="522" y="251.0" width="202" height="42.3" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="539" cy="272.2" r="10" fill="#b7791f"/>
  <text x="539" y="276.2" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="556" y="269.2" font-size="11.5" fill="#1f2933">Add to cart, stock,</text>
  <text x="556" y="283.2" font-size="11.5" fill="#1f2933">shipping hint</text>
  <rect x="522" y="303.3" width="202" height="42.3" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="539" cy="324.5" r="10" fill="#1f8a5b"/>
  <text x="539" y="328.5" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="556" y="321.5" font-size="11.5" fill="#1f2933">Description and roast</text>
  <text x="556" y="335.5" font-size="11.5" fill="#1f2933">date</text>
  <rect x="522" y="355.7" width="202" height="42.3" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="539" cy="376.8" r="10" fill="#1f8a5b"/>
  <text x="539" y="380.8" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="556" y="380.8" font-size="11.5" fill="#1f2933">Recommendations</text>
  <rect x="758" y="62" width="222" height="350" rx="8" fill="none" stroke="#7b8794" stroke-width="1.2"/>
  <text x="869.0" y="84" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Cart</text>
  <rect x="768" y="94.0" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="785" cy="120.4" r="10" fill="#1f8a5b"/>
  <text x="785" y="124.4" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="802" y="124.4" font-size="11.5" fill="#1f2933">Title (h1) and item count</text>
  <rect x="768" y="156.8" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="785" cy="183.2" r="10" fill="#1f8a5b"/>
  <text x="785" y="187.2" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="802" y="180.2" font-size="11.5" fill="#1f2933">Lines: image, name,</text>
  <text x="802" y="194.2" font-size="11.5" fill="#1f2933">quantity, remove</text>
  <rect x="768" y="219.6" width="202" height="52.8" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="785" cy="246.0" r="10" fill="#b7791f"/>
  <text x="785" y="250.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="802" y="243.0" font-size="11.5" fill="#1f2933">Discount code,</text>
  <text x="802" y="257.0" font-size="11.5" fill="#1f2933">free-shipping progress</text>
  <rect x="768" y="282.4" width="202" height="52.8" rx="5" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <circle cx="785" cy="308.8" r="10" fill="#1f8a5b"/>
  <text x="785" y="312.8" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="802" y="312.8" font-size="11.5" fill="#1f2933">Subtotal and taxes note</text>
  <rect x="768" y="345.2" width="202" height="52.8" rx="5" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <circle cx="785" cy="371.6" r="10" fill="#b7791f"/>
  <text x="785" y="375.6" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="802" y="368.6" font-size="11.5" fill="#1f2933">Checkout button, express</text>
  <text x="802" y="382.6" font-size="11.5" fill="#1f2933">payments</text>
  <rect x="220" y="438" width="18" height="14" rx="3" fill="#e3effd" stroke="#2f6db5" stroke-width="1.2"/>
  <text x="246" y="450" font-size="12" fill="#7b8794">Identity and navigation</text>
  <rect x="430" y="438" width="18" height="14" rx="3" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.2"/>
  <text x="456" y="450" font-size="12" fill="#7b8794">Content</text>
  <rect x="640" y="438" width="18" height="14" rx="3" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.2"/>
  <text x="666" y="450" font-size="12" fill="#7b8794">Decision or action</text>
</svg>
