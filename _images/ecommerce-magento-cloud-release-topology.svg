<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Kubernetes objects of the pocketcoffee release</title>
  <desc id="d">Customer traffic goes from the load balancer with the WAF web ACL to the Gateway and the HTTPRoute pocketcoffee-www, then to the Service pocketcoffee-varnish and the Varnish StatefulSet pocketcoffee-varnish, whose pods fetch cache misses from the Service pocketcoffee-web on port 8080. The HTTPRoute pocketcoffee-admin sends the Admin path prefix directly to the web Deployment or to the optional admin Deployment, bypassing Varnish. Each web pod runs an nginx container and a php-fpm container with scratch volumes for tmp, var and pub/media, a read-only env.php from a ConfigMap and environment variables from a ConfigMap and from the Secret created by the ExternalSecret. The queue consumers, the cron job and the install, migrate and reindex Jobs use the same image and the same configuration. The external services are the RDS database, OpenSearch, two Valkey groups, Amazon MQ and the S3 media bucket.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2f5f8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f4b860"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Release pocketcoffee in the namespace pocketcoffee</text>

  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="30" y="56" width="150" height="56" rx="8" fill="#4d7c5a"/>
    <text x="105" y="78" font-weight="bold">Load balancer</text><text x="105" y="96">WAF, ACM certificate</text>
    <rect x="210" y="56" width="170" height="56" rx="8" fill="#3d5266"/>
    <text x="295" y="78" font-weight="bold">Gateway, HTTPRoutes</text><text x="295" y="96">www, admin, apex redirect</text>

    <rect x="30" y="140" width="300" height="196" rx="10" fill="#34495e" stroke="#c9b3e6" stroke-width="2"/>
    <text x="180" y="160" font-weight="bold" fill="#c9b3e6">StatefulSet pocketcoffee-varnish</text>
    <rect x="46" y="172" width="130" height="50" rx="6" fill="#3f6e9a"/>
    <text x="111" y="192" font-weight="bold">varnish-0</text><text x="111" y="210">memory only</text>
    <rect x="186" y="172" width="130" height="50" rx="6" fill="#3f6e9a"/>
    <text x="251" y="192" font-weight="bold">varnish-1</text><text x="251" y="210">memory only</text>
    <text x="180" y="244">Service pocketcoffee-varnish (80 to 6081)</text>
    <text x="180" y="262">Service pocketcoffee-varnish-headless</text>
    <text x="180" y="280" fill="#f4b860">purge target: every pod by DNS name</text>
    <text x="180" y="300">ConfigMap pocketcoffee-varnish-vcl</text>
    <text x="180" y="320">PDB pocketcoffee-varnish</text>

    <rect x="360" y="140" width="570" height="196" rx="10" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
    <text x="645" y="160" font-weight="bold" fill="#9fd3c7">Deployments pocketcoffee-web and pocketcoffee-admin (optional)</text>
    <rect x="376" y="172" width="250" height="88" rx="6" fill="#2f4a44"/>
    <text x="501" y="192" font-weight="bold">web pod (2 or more, over zones)</text>
    <text x="501" y="212">nginx :8080  |  php-fpm :9000</text>
    <text x="501" y="230">startup, readiness: /health_check.php</text>
    <text x="501" y="248">liveness: /healthz</text>
    <rect x="640" y="172" width="274" height="88" rx="6" fill="#33485c"/>
    <text x="777" y="192" font-weight="bold">Per-pod scratch (emptyDir)</text>
    <text x="777" y="212">/tmp, var/, pub/media (mode s3)</text>
    <text x="777" y="230">env.php: read-only from a ConfigMap</text>
    <text x="777" y="248">code, generated/, pub/static: image</text>
    <text x="645" y="284">Service pocketcoffee-web :8080  |  HPA pocketcoffee-web  |  PDB pocketcoffee-web</text>
    <text x="645" y="304">Service pocketcoffee-admin :8080 when admin.enabled=true</text>
    <text x="645" y="324">ConfigMaps: env, env-php, nginx, php  |  Secret from the ExternalSecret</text>

    <rect x="30" y="356" width="440" height="116" rx="10" fill="#34495e" stroke="#f4b860" stroke-width="2"/>
    <text x="250" y="376" font-weight="bold" fill="#f4b860">Background work, same image</text>
    <text x="250" y="398">Deployments pocketcoffee-consumer-async-operations-all,</text>
    <text x="250" y="416">-product-action-attribute-update, -media-storage-catalog-image-resize</text>
    <text x="250" y="434">KEDA ScaledObject per consumer (RabbitMQ queue length)</text>
    <text x="250" y="454">CronJob pocketcoffee-cron: Forbid, one scheduler</text>

    <rect x="490" y="356" width="440" height="116" rx="10" fill="#34495e" stroke="#6f8aa3" stroke-width="2"/>
    <text x="710" y="376" font-weight="bold" fill="#f2f5f8">Jobs</text>
    <text x="710" y="398">pocketcoffee-install: first release only, web pods at 0</text>
    <text x="710" y="416">pocketcoffee-migrate: pre-upgrade hook, setup:db:status gate</text>
    <text x="710" y="434">pocketcoffee-reindex: on demand</text>
    <text x="710" y="454">throwaway app/etc where setup:install or setup:upgrade write</text>

    <rect x="30" y="500" width="900" height="100" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
    <text x="480" y="522" font-weight="bold" fill="#f4b860">Outside the cluster, reached by every workload</text>
    <rect x="46" y="534" width="132" height="52" rx="6" fill="#7a5c3a"/><text x="112" y="556" font-weight="bold">RDS MySQL 8.4</text><text x="112" y="574">mg_app, mg_migrate</text>
    <rect x="190" y="534" width="132" height="52" rx="6" fill="#7a5c3a"/><text x="256" y="556" font-weight="bold">OpenSearch</text><text x="256" y="574">HTTPS 443</text>
    <rect x="334" y="534" width="132" height="52" rx="6" fill="#3d5266"/><text x="400" y="556" font-weight="bold">Valkey cache</text><text x="400" y="574">TLS, AUTH</text>
    <rect x="478" y="534" width="132" height="52" rx="6" fill="#3d5266"/><text x="544" y="556" font-weight="bold">Valkey session</text><text x="544" y="574">TLS, AUTH</text>
    <rect x="622" y="534" width="132" height="52" rx="6" fill="#4d7c5a"/><text x="688" y="556" font-weight="bold">Amazon MQ</text><text x="688" y="574">AMQP TLS 5671</text>
    <rect x="766" y="534" width="148" height="52" rx="6" fill="#4d7c5a"/><text x="840" y="556" font-weight="bold">S3 media bucket</text><text x="840" y="574">Pod Identity role</text>
  </g>

  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 84 L208 84"/>
    <path d="M295 112 L295 126 L180 126 L180 138"/>
    <path d="M330 238 L358 238"/>
    <path d="M380 112 L380 126 L640 126 L640 138" stroke="#f4b860" marker-end="url(#b)"/>
    <path d="M250 472 L250 498"/>
    <path d="M710 472 L710 498"/>
  </g>
  <text x="520" y="122" font-size="11" fill="#f4b860">Admin prefix: no Varnish</text>
</svg>
