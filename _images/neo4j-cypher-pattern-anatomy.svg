<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a Cypher pattern</text>

  <!-- the pattern itself, large, monospace -->
  <text x="360" y="90" font-size="19" text-anchor="middle" font-family="'Courier New', monospace" fill="#222222">
    <tspan fill="#1c4b73">(a:Person {name: $name})</tspan><tspan fill="#7a4b00">-[:ACTED_IN {roles: $roles}]-&gt;</tspan><tspan fill="#2f5424">(m:Movie)</tspan>
  </text>

  <!-- node 1 group -->
  <rect x="70" y="130" width="190" height="120" fill="#eaf1f7" stroke="#1c4b73" stroke-width="1.2" rx="4"/>
  <text x="165" y="150" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Node</text>
  <text x="165" y="170" font-size="10.5" fill="#444444" text-anchor="middle">(a:Person {name: $name})</text>
  <line x1="120" y1="182" x2="120" y2="196" stroke="#1c4b73" stroke-width="1"/>
  <text x="80" y="208" font-size="10" fill="#1c4b73">a</text>
  <text x="80" y="222" font-size="9.5" fill="#666666">variable name</text>
  <line x1="150" y1="182" x2="150" y2="196" stroke="#1c4b73" stroke-width="1"/>
  <text x="130" y="208" font-size="10" fill="#1c4b73">:Person</text>
  <text x="118" y="222" font-size="9.5" fill="#666666">label</text>
  <line x1="205" y1="182" x2="205" y2="196" stroke="#1c4b73" stroke-width="1"/>
  <text x="152" y="208" font-size="10" fill="#1c4b73">{name: $name}</text>
  <text x="150" y="222" font-size="9.5" fill="#666666">property map</text>
  <text x="150" y="235" font-size="9.5" fill="#666666">($name = query parameter)</text>

  <!-- relationship group -->
  <rect x="270" y="130" width="190" height="120" fill="#fbf1e0" stroke="#7a4b00" stroke-width="1.2" rx="4"/>
  <text x="365" y="150" font-size="12.5" font-weight="bold" fill="#7a4b00" text-anchor="middle">Relationship</text>
  <text x="365" y="170" font-size="10.5" fill="#444444" text-anchor="middle">-[:ACTED_IN {roles: $roles}]-&gt;</text>
  <line x1="330" y1="182" x2="330" y2="196" stroke="#7a4b00" stroke-width="1"/>
  <text x="290" y="208" font-size="10" fill="#7a4b00">:ACTED_IN</text>
  <text x="288" y="222" font-size="9.5" fill="#666666">relationship type</text>
  <line x1="400" y1="182" x2="400" y2="196" stroke="#7a4b00" stroke-width="1"/>
  <text x="355" y="208" font-size="10" fill="#7a4b00">{roles: $roles}</text>
  <text x="352" y="222" font-size="9.5" fill="#666666">property map</text>
  <line x1="445" y1="182" x2="445" y2="196" stroke="#7a4b00" stroke-width="1"/>
  <text x="405" y="208" font-size="10" fill="#7a4b00">-&gt;</text>
  <text x="382" y="222" font-size="9.5" fill="#666666">direction (left-to-right)</text>
  <text x="382" y="235" font-size="9.5" fill="#666666">omit arrow head for either/undirected</text>

  <!-- node 2 group -->
  <rect x="470" y="130" width="180" height="120" fill="#ecf3e6" stroke="#2f5424" stroke-width="1.2" rx="4"/>
  <text x="560" y="150" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Node</text>
  <text x="560" y="170" font-size="10.5" fill="#444444" text-anchor="middle">(m:Movie)</text>
  <line x1="500" y1="182" x2="500" y2="196" stroke="#2f5424" stroke-width="1"/>
  <text x="482" y="208" font-size="10" fill="#2f5424">m</text>
  <text x="472" y="222" font-size="9.5" fill="#666666">variable name</text>
  <line x1="540" y1="182" x2="540" y2="196" stroke="#2f5424" stroke-width="1"/>
  <text x="520" y="208" font-size="10" fill="#2f5424">:Movie</text>
  <text x="508" y="222" font-size="9.5" fill="#666666">label</text>
  <text x="472" y="238" font-size="9.5" fill="#666666">no property map here --</text>
  <text x="472" y="250" font-size="9.5" fill="#666666">matched by label alone</text>

  <!-- connectors from pattern text down to groups -->
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3 2">
    <line x1="165" y1="100" x2="165" y2="128"/>
    <line x1="365" y1="100" x2="365" y2="128"/>
    <line x1="560" y1="100" x2="560" y2="128"/>
  </g>

  <!-- legend / summary strip -->
  <rect x="60" y="280" width="600" height="130" fill="#f4f4f4" stroke="#999999" stroke-width="1" rx="4"/>
  <text x="80" y="303" font-size="12" font-weight="bold" fill="#222222">Reading order</text>
  <text x="80" y="323" font-size="11" fill="#333333">1. Round brackets <tspan font-family="'Courier New', monospace">( )</tspan> always denote a node; square brackets <tspan font-family="'Courier New', monospace">[ ]</tspan> always denote a relationship.</text>
  <text x="80" y="343" font-size="11" fill="#333333">2. A leading colon introduces a label (on a node) or a type (on a relationship): <tspan font-family="'Courier New', monospace">:Person</tspan>, <tspan font-family="'Courier New', monospace">:ACTED_IN</tspan>.</text>
  <text x="80" y="363" font-size="11" fill="#333333">3. A property map is <tspan font-family="'Courier New', monospace">{key: value, ...}</tspan> immediately after the variable/label -- values are often query parameters (<tspan font-family="'Courier New', monospace">$name</tspan>).</text>
  <text x="80" y="383" font-size="11" fill="#333333">4. An arrow head (<tspan font-family="'Courier New', monospace">-&gt;</tspan> or <tspan font-family="'Courier New', monospace">&lt;-</tspan>) sets the relationship's direction; a plain <tspan font-family="'Courier New', monospace">-</tspan> on both sides matches either direction.</text>
  <text x="80" y="403" font-size="11" fill="#333333">5. The whole expression is one pattern: it matches or creates a path, not two nodes and an edge independently.</text>
</svg>
