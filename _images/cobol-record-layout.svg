<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Record layout of BOOK-RECORD</title><desc id="d">The 60-byte Circulation BOOK-RECORD with level numbers, PICTURE clauses, byte offsets and lengths, and a proportional bar of the fields.</desc>
<rect width="760" height="470" fill="#ffffff" stroke="#9aa3ad"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#1f2933">BOOK-RECORD (copybook BOOKREC): 60 bytes</text>
<rect x="20.0" y="40" width="72.0" height="30" fill="#cfe3f7" stroke="#52606d"/>
<text x="56.0" y="60" text-anchor="middle" fill="#1f2933" font-size="12">ID</text>
<rect x="92.0" y="40" width="156.0" height="30" fill="#d6efd8" stroke="#52606d"/>
<text x="170.0" y="60" text-anchor="middle" fill="#1f2933" font-size="12">ISBN</text>
<rect x="248.0" y="40" width="360.0" height="30" fill="#fbe7b5" stroke="#52606d"/>
<text x="428.0" y="60" text-anchor="middle" fill="#1f2933" font-size="12">TITLE</text>
<rect x="608.0" y="40" width="36.0" height="30" fill="#e8d3f3" stroke="#52606d"/>
<rect x="644.0" y="40" width="72.0" height="30" fill="#f8d0cf" stroke="#52606d"/>
<text x="680.0" y="60" text-anchor="middle" fill="#1f2933" font-size="12">PRICE</text>
<rect x="716.0" y="40" width="12.0" height="30" fill="#c8ece8" stroke="#52606d"/>
<rect x="728.0" y="40" width="12.0" height="30" fill="#dddddd" stroke="#52606d"/>
<text x="20" y="86" fill="#3e4c59" font-size="11">offset 0</text><text x="740" y="86" text-anchor="end" fill="#3e4c59" font-size="11">offset 60 (end)</text>
<rect x="10" y="100" width="740" height="26" fill="#e4e7eb" stroke="#9aa3ad"/>
<text x="20" y="118" font-weight="bold" fill="#1f2933">Level</text>
<text x="80" y="118" font-weight="bold" fill="#1f2933">Name</text>
<text x="300" y="118" font-weight="bold" fill="#1f2933">PICTURE / value</text>
<text x="470" y="118" font-weight="bold" fill="#1f2933">Offset</text>
<text x="540" y="118" font-weight="bold" fill="#1f2933">Length</text>
<text x="610" y="118" font-weight="bold" fill="#1f2933">Bytes (1-based)</text>
<rect x="10" y="126" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="146" fill="#1f2933">01</text>
<text x="80" y="146" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-RECORD</text>
<text x="300" y="146" fill="#1f2933" font-family="Menlo, Consolas, monospace">group</text>
<text x="470" y="146" fill="#1f2933">0</text><text x="540" y="146" fill="#1f2933">60</text><text x="610" y="146" fill="#1f2933"></text>
<rect x="10" y="156" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="176" fill="#1f2933">05</text>
<text x="96" y="176" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-ID</text>
<text x="300" y="176" fill="#1f2933" font-family="Menlo, Consolas, monospace">9(6)</text>
<text x="470" y="176" fill="#1f2933">0</text><text x="540" y="176" fill="#1f2933">6</text><text x="610" y="176" fill="#1f2933">1-6</text>
<rect x="10" y="186" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="206" fill="#1f2933">05</text>
<text x="96" y="206" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-ISBN</text>
<text x="300" y="206" fill="#1f2933" font-family="Menlo, Consolas, monospace">X(13)</text>
<text x="470" y="206" fill="#1f2933">6</text><text x="540" y="206" fill="#1f2933">13</text><text x="610" y="206" fill="#1f2933">7-19</text>
<rect x="10" y="216" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="236" fill="#1f2933">05</text>
<text x="96" y="236" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-TITLE</text>
<text x="300" y="236" fill="#1f2933" font-family="Menlo, Consolas, monospace">X(30)</text>
<text x="470" y="236" fill="#1f2933">19</text><text x="540" y="236" fill="#1f2933">30</text><text x="610" y="236" fill="#1f2933">20-49</text>
<rect x="10" y="246" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="266" fill="#1f2933">05</text>
<text x="96" y="266" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-COPIES</text>
<text x="300" y="266" fill="#1f2933" font-family="Menlo, Consolas, monospace">9(3)</text>
<text x="470" y="266" fill="#1f2933">49</text><text x="540" y="266" fill="#1f2933">3</text><text x="610" y="266" fill="#1f2933">50-52</text>
<rect x="10" y="276" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="296" fill="#1f2933">05</text>
<text x="96" y="296" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-PRICE</text>
<text x="300" y="296" fill="#1f2933" font-family="Menlo, Consolas, monospace">9(4)V99</text>
<text x="470" y="296" fill="#1f2933">52</text><text x="540" y="296" fill="#1f2933">6</text><text x="610" y="296" fill="#1f2933">53-58</text>
<rect x="10" y="306" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="326" fill="#1f2933">05</text>
<text x="96" y="326" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-STATUS</text>
<text x="300" y="326" fill="#1f2933" font-family="Menlo, Consolas, monospace">X</text>
<text x="470" y="326" fill="#1f2933">58</text><text x="540" y="326" fill="#1f2933">1</text><text x="610" y="326" fill="#1f2933">59</text>
<rect x="10" y="336" width="740" height="30" fill="#fffbea" stroke="#cbd2d9"/>
<text x="20" y="356" fill="#1f2933">88</text>
<text x="112" y="356" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-ACTIVE</text>
<text x="300" y="356" fill="#1f2933" font-family="Menlo, Consolas, monospace">VALUE &quot;A&quot;</text>
<text x="470" y="356" fill="#1f2933">58</text><text x="540" y="356" fill="#1f2933">(none)</text><text x="610" y="356" fill="#1f2933">no storage</text>
<rect x="10" y="366" width="740" height="30" fill="#fffbea" stroke="#cbd2d9"/>
<text x="20" y="386" fill="#1f2933">88</text>
<text x="112" y="386" fill="#1f2933" font-family="Menlo, Consolas, monospace">BOOK-WITHDRAWN</text>
<text x="300" y="386" fill="#1f2933" font-family="Menlo, Consolas, monospace">VALUE &quot;W&quot;</text>
<text x="470" y="386" fill="#1f2933">58</text><text x="540" y="386" fill="#1f2933">(none)</text><text x="610" y="386" fill="#1f2933">no storage</text>
<rect x="10" y="396" width="740" height="30" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="20" y="416" fill="#1f2933">05</text>
<text x="96" y="416" fill="#1f2933" font-family="Menlo, Consolas, monospace">FILLER</text>
<text x="300" y="416" fill="#1f2933" font-family="Menlo, Consolas, monospace">X(1)</text>
<text x="470" y="416" fill="#1f2933">59</text><text x="540" y="416" fill="#1f2933">1</text><text x="610" y="416" fill="#1f2933">60</text>
</svg>