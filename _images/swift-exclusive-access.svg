<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>A timeline showing a long-term write access held for the duration of an inout call to stepSize overlapping with a second read access to the same storage inside the callee's body, and why the compiler must reject the call rather than let the two accesses interleave.</title>
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Overlapping Access to `stepSize` via `inout`</text>

  <defs>
    <marker id="eaArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Timeline axis -->
  <line x1="80" y1="360" x2="780" y2="360" stroke="#888888" stroke-width="1.5" marker-end="url(#eaArrow)"/>
  <text x="785" y="364" font-size="11" fill="#555555">time</text>

  <!-- Long-term write access bar (inout) -->
  <rect x="120" y="90" width="560" height="46" rx="6" fill="#fdeeee" stroke="#a4282c" stroke-width="1.8"/>
  <text x="400" y="118" font-size="12.5" font-weight="bold" fill="#7a1d20" text-anchor="middle">Long-term WRITE access to `stepSize` -- held for the entire call `increment(&amp;stepSize)`</text>

  <!-- call start / end markers -->
  <line x1="120" y1="80" x2="120" y2="360" stroke="#a4282c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="120" y="72" font-size="10" fill="#7a1d20" text-anchor="middle">call begins</text>
  <line x1="680" y1="80" x2="680" y2="360" stroke="#a4282c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="680" y="72" font-size="10" fill="#7a1d20" text-anchor="middle">call ends</text>

  <!-- overlapping read access, inside the callee body -->
  <rect x="320" y="180" width="180" height="46" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.8"/>
  <text x="410" y="203" font-size="11.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">READ of `stepSize`</text>
  <text x="410" y="219" font-size="9.5" fill="#1f3b5c" text-anchor="middle">inside `number += stepSize`</text>

  <!-- overlap bracket -->
  <line x1="320" y1="160" x2="500" y2="160" stroke="#8a1f6b" stroke-width="1.6"/>
  <line x1="320" y1="152" x2="320" y2="168" stroke="#8a1f6b" stroke-width="1.6"/>
  <line x1="500" y1="152" x2="500" y2="168" stroke="#8a1f6b" stroke-width="1.6"/>
  <text x="410" y="148" font-size="11" font-weight="bold" fill="#8a1f6b" text-anchor="middle">overlap: read while a write access is already held</text>

  <!-- conflict callout -->
  <rect x="240" y="250" width="340" height="60" rx="8" fill="#fff7e6" stroke="#a9821f" stroke-width="1.4"/>
  <text x="410" y="273" font-size="11.5" font-weight="bold" fill="#7a5b1d" text-anchor="middle">Compile-time error: conflicting access to `stepSize`</text>
  <text x="410" y="292" font-size="10" fill="#7a5b1d" text-anchor="middle">the read's ordering relative to the in-progress write is not guaranteed by the source</text>

  <text x="430" y="340" font-size="10.5" fill="#333333" text-anchor="middle">`&amp;stepSize` grants exclusive write access for the whole call; the global read inside the callee body overlaps it.</text>
</svg>
