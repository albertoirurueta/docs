<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Life of an Action Scheduler action</title>
  <desc id="d">Plugin code creates actions with four API functions and they are stored as pending rows in the actionscheduler actions table. Three runners can claim a batch of pending actions: the WP-Cron event action_scheduler_run_queue every minute, an asynchronous loopback request dispatched on admin requests at most once per 60 seconds, and the wp action-scheduler run command. A claimed action becomes in-progress and ends as complete, or as failed when the callback throws or the process dies. A pending action can also become canceled. A recurring or cron action creates its next pending row when an instance finishes.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">From as_enqueue_async_action() to a finished row</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Statuses as stored in the status column; the runners and limits are the defaults of Action Scheduler 4.1.0</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="80" width="260" height="130" rx="8" fill="#3d5266"/>
    <text x="56" y="104" font-weight="bold">Your code</text>
    <text x="56" y="126">as_enqueue_async_action()</text>
    <text x="56" y="146">as_schedule_single_action()</text>
    <text x="56" y="166">as_schedule_recurring_action()</text>
    <text x="56" y="186">as_schedule_cron_action()</text>

    <rect x="350" y="80" width="260" height="130" rx="8" fill="#3d5266"/>
    <text x="366" y="104" font-weight="bold">Data store</text>
    <text x="366" y="126">wp_actionscheduler_actions</text>
    <text x="366" y="146">plus groups, claims and logs</text>
    <text x="366" y="170">async rows: scheduled date</text>
    <text x="366" y="188">0000-00-00 (run when free)</text>

    <rect x="660" y="80" width="260" height="130" rx="8" fill="#3d5266"/>
    <text x="676" y="104" font-weight="bold">Runners</text>
    <text x="676" y="126">WP-Cron every_minute event</text>
    <text x="676" y="146">async loopback, admin pages,</text>
    <text x="676" y="162">at most once per 60 s</text>
    <text x="676" y="186">wp action-scheduler run</text>
  </g>
  <path d="M300 130 L346 130" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="304" y="122" font-size="11" fill="#f2f5f8">insert</text>
  <path d="M656 150 L614 150" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="618" y="142" font-size="11" fill="#f2f5f8">claim</text>

  <g font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">
    <rect x="40" y="290" width="150" height="50" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="115" y="320">pending</text>
    <rect x="290" y="290" width="150" height="50" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="365" y="320">in-progress</text>
    <rect x="560" y="250" width="150" height="50" rx="8" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
    <text x="635" y="280">complete</text>
    <rect x="560" y="330" width="150" height="50" rx="8" fill="#3d5266" stroke="#e8908a" stroke-width="2"/>
    <text x="635" y="360">failed</text>
    <rect x="40" y="410" width="150" height="50" rx="8" fill="#3d5266" stroke="#6f8aa3" stroke-width="2"/>
    <text x="115" y="440">canceled</text>
  </g>
  <path d="M190 315 L286 315" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="196" y="306" font-size="11" fill="#f2f5f8">claimed, run</text>
  <path d="M440 305 L556 275" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="452" y="278" font-size="11" fill="#f2f5f8">callback returns</text>
  <path d="M440 325 L556 355" stroke="#e8908a" stroke-width="2" fill="none" marker-end="url(#c)"/>
  <text x="300" y="366" font-size="11" fill="#f2f5f8">exception, fatal error or timeout</text>
  <path d="M115 340 L115 406" stroke="#6f8aa3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="124" y="378" font-size="11" fill="#f2f5f8">as_unschedule_action() / admin screen</text>

  <rect x="750" y="250" width="170" height="130" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-size="12" fill="#f2f5f8">
    <text x="762" y="274" font-weight="bold" fill="#f4b860">Recurring and cron</text>
    <text x="762" y="294">a new pending row is</text>
    <text x="762" y="310">created when an instance</text>
    <text x="762" y="326">finishes; five failures in</text>
    <text x="762" y="342">a row stop the series</text>
  </g>
  <path d="M710 275 L746 275" stroke="#9fd3c7" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <rect x="240" y="410" width="680" height="120" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="256" y="434" font-weight="bold" fill="#f4b860">Defaults of one queue run</text>
    <text x="256" y="456">Claim 25 actions per batch; stop when 90 percent of the memory limit is used or another action would pass 30 s.</text>
    <text x="256" y="476">One concurrent batch. A claim older than 300 s is released, an in-progress action older than 300 s is marked failed.</text>
    <text x="256" y="496">Order inside a claim: priority (0 to 255, lower first), attempts, scheduled date, action ID.</text>
    <text x="256" y="516">Completed and canceled rows are deleted after one month, failed rows after three months.</text>
  </g>
</svg>
