<svg viewBox="0 0 900 480" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Google Cloud locations: zones, regions, a dual-region and a multi-region</text>

  <!-- Multi-region overlay -->
  <rect x="14" y="40" width="872" height="408" rx="14" fill="#fff8e6" stroke="#b06a00" stroke-width="2" stroke-dasharray="9,6"/>
  <text x="32" y="62" font-size="13" font-weight="700" fill="#7a4800">Multi-region (for example US or EU): Google replicates across several regions in the geography</text>

  <!-- Dual-region overlay -->
  <rect x="30" y="76" width="560" height="318" rx="12" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="48" y="98" font-size="12.5" font-weight="700" fill="#14572f">Dual-region (for example nam4): exactly two regions you can name</text>

  <!-- Region 1 -->
  <rect x="46" y="112" width="252" height="266" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="62" y="134" font-size="13" font-weight="700" fill="#3c4a58">Region us-central1</text>
  <rect x="62" y="148" width="68" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="96" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone a</text>
  <rect x="72" y="182" width="48" height="26" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="96" y="199" text-anchor="middle" font-size="10" fill="#123a72">VM</text>
  <text x="96" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-central1-a</text>
  <rect x="140" y="148" width="68" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="174" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone b</text>
  <rect x="150" y="182" width="48" height="26" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="174" y="199" text-anchor="middle" font-size="10" fill="#123a72">VM</text>
  <text x="174" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-central1-b</text>
  <rect x="218" y="148" width="68" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="252" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone c</text>
  <rect x="228" y="182" width="48" height="26" rx="4" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="252" y="199" text-anchor="middle" font-size="10" fill="#123a72">VM</text>
  <text x="252" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-central1-c</text>
  <text x="172" y="326" text-anchor="middle" font-size="10.5" fill="#3c4a58">Regional resources (regional MIG,</text>
  <text x="172" y="341" text-anchor="middle" font-size="10.5" fill="#3c4a58">regional disk, Cloud Run service)</text>
  <text x="172" y="356" text-anchor="middle" font-size="10.5" fill="#3c4a58">span all zones of the region</text>

  <!-- Region 2 -->
  <rect x="330" y="112" width="244" height="266" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="346" y="134" font-size="13" font-weight="700" fill="#3c4a58">Region us-east1</text>
  <rect x="346" y="148" width="68" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="380" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone b</text>
  <text x="380" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-east1-b</text>
  <rect x="424" y="148" width="68" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="458" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone c</text>
  <text x="458" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-east1-c</text>
  <rect x="502" y="148" width="62" height="150" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="533" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone d</text>
  <text x="533" y="262" text-anchor="middle" font-size="9.5" fill="#3c4a58">us-east1-d</text>
  <text x="452" y="326" text-anchor="middle" font-size="10.5" fill="#3c4a58">Second region of the dual-region</text>
  <text x="452" y="341" text-anchor="middle" font-size="10.5" fill="#3c4a58">(objects replicated to both)</text>

  <!-- Another region -->
  <rect x="616" y="112" width="254" height="150" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="632" y="134" font-size="13" font-weight="700" fill="#3c4a58">Region us-west1</text>
  <rect x="632" y="148" width="64" height="96" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="664" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone a</text>
  <rect x="706" y="148" width="64" height="96" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="738" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone b</text>
  <rect x="780" y="148" width="64" height="96" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="812" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#123a72">Zone c</text>

  <!-- Global / edge -->
  <rect x="616" y="282" width="254" height="96" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.8"/>
  <text x="743" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1a14">Global network edge</text>
  <text x="743" y="324" text-anchor="middle" font-size="10.5" fill="#3c4a58">Points of presence terminate user traffic,</text>
  <text x="743" y="339" text-anchor="middle" font-size="10.5" fill="#3c4a58">Cloud CDN caches content, the global external</text>
  <text x="743" y="354" text-anchor="middle" font-size="10.5" fill="#3c4a58">load balancer has one anycast IP address</text>

  <!-- Legend -->
  <text x="32" y="420" font-size="11.5" fill="#3c4a58">Failure domains, smallest to largest: zone, region, multi-region. Global resources (VPC networks, global external load</text>
  <text x="32" y="436" font-size="11.5" fill="#3c4a58">balancer, IAM) are not tied to any one of them.</text>
</svg>
