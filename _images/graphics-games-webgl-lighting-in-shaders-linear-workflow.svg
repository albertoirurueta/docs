<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-lighting-in-shaders-linear-workflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where sRGB and linear light meet in a WebGL 2 lit shader</text>
<rect x="20" y="70" width="140" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" />
<text x="90.0" y="98.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Cover PNG</text>
<text x="90.0" y="113.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">sRGB encoded</text>
<rect x="165" y="70" width="140" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
<text x="235.0" y="98.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">SRGB8_ALPHA8</text>
<text x="235.0" y="113.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">texture format</text>
<rect x="310" y="70" width="140" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
<text x="380.0" y="98.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">texture()</text>
<text x="380.0" y="113.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">returns linear rgb</text>
<rect x="455" y="70" width="140" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5" />
<text x="525.0" y="98.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Lighting</text>
<text x="525.0" y="113.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">N.L, spec, att (linear)</text>
<rect x="600" y="70" width="140" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" />
<text x="670.0" y="98.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">linearToSrgb</text>
<text x="670.0" y="113.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">encode in shader</text>
<line x1="160" y1="102" x2="165" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-lighting-in-shaders-linear-workflow)"/>
<line x1="305" y1="102" x2="310" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-lighting-in-shaders-linear-workflow)"/>
<line x1="450" y1="102" x2="455" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-lighting-in-shaders-linear-workflow)"/>
<line x1="595" y1="102" x2="600" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-lighting-in-shaders-linear-workflow)"/>
<rect x="600" y="190" width="140" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" />
<text x="670.0" y="214.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Canvas</text>
<text x="670.0" y="229.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">displays sRGB</text>
<line x1="670" y1="134" x2="670" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-lighting-in-shaders-linear-workflow)"/>
<rect x="165" y="190" width="290" height="56" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5" />
<text x="310.0" y="214.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Normal map: RGBA8</text>
<text x="310.0" y="229.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">data, no decode, no encode</text>
<text x="380" y="280" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The default WebGL canvas does not encode for you: write sRGB values yourself.</text>
<text x="380" y="300" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Lighting a texel in encoded values makes midtones too dark and highlights wrong.</text>
</svg>
