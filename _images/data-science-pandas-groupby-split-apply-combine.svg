<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Split, apply, combine</title>
  <desc id="d1">A table of six rows with a city key and a units value is split into three groups by city, each group is reduced with sum, and the three sums are combined into a result indexed by city: Madrid 7, Paris 7 and Rome 3.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">df.groupby("city")["units"].sum()</text>
  <g font-size="14" font-weight="bold" fill="#475569">
    <text x="24" y="70">DataFrame</text><text x="240" y="70">1. Split by key</text><text x="420" y="70">2. Apply sum</text><text x="570" y="70">3. Combine</text>
  </g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="86" width="180" height="28" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="36" y="105">Madrid</text><text x="196" y="105" text-anchor="end" font-family="Menlo, Consolas, monospace">3</text></g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="116" width="180" height="28" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="36" y="135">Madrid</text><text x="196" y="135" text-anchor="end" font-family="Menlo, Consolas, monospace">4</text></g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="146" width="180" height="28" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="36" y="165">Paris</text><text x="196" y="165" text-anchor="end" font-family="Menlo, Consolas, monospace">2</text></g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="176" width="180" height="28" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="36" y="195">Paris</text><text x="196" y="195" text-anchor="end" font-family="Menlo, Consolas, monospace">5</text></g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="206" width="180" height="28" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="36" y="225">Rome</text><text x="196" y="225" text-anchor="end" font-family="Menlo, Consolas, monospace">1</text></g>
  <g font-size="14" fill="#0F172A"><rect x="24" y="236" width="180" height="28" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="36" y="255">Rome</text><text x="196" y="255" text-anchor="end" font-family="Menlo, Consolas, monospace">2</text></g>
  <rect x="240" y="86" width="150" height="58" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <g font-size="14" fill="#0F172A"><text x="252" y="108">Madrid</text><text x="252" y="130" font-family="Menlo, Consolas, monospace">units = 3, 4</text></g>
  <line x1="206" y1="115" x2="236" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="394" y1="115" x2="436" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="440" y="99" width="90" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="485" y="120" font-size="14" text-anchor="middle" fill="#0F172A" font-family="Menlo, Consolas, monospace">7</text>
  <line x1="534" y1="115" x2="566" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <g font-size="14" fill="#0F172A"><rect x="570" y="99" width="126" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="580" y="120">Madrid</text><text x="688" y="120" text-anchor="end" font-family="Menlo, Consolas, monospace">7</text></g>
  <rect x="240" y="146" width="150" height="58" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <g font-size="14" fill="#0F172A"><text x="252" y="168">Paris</text><text x="252" y="190" font-family="Menlo, Consolas, monospace">units = 2, 5</text></g>
  <line x1="206" y1="175" x2="236" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="394" y1="175" x2="436" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="440" y="159" width="90" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="485" y="180" font-size="14" text-anchor="middle" fill="#0F172A" font-family="Menlo, Consolas, monospace">7</text>
  <line x1="534" y1="175" x2="566" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <g font-size="14" fill="#0F172A"><rect x="570" y="159" width="126" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="580" y="180">Paris</text><text x="688" y="180" text-anchor="end" font-family="Menlo, Consolas, monospace">7</text></g>
  <rect x="240" y="206" width="150" height="58" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <g font-size="14" fill="#0F172A"><text x="252" y="228">Rome</text><text x="252" y="250" font-family="Menlo, Consolas, monospace">units = 1, 2</text></g>
  <line x1="206" y1="235" x2="236" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="394" y1="235" x2="436" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="440" y="219" width="90" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="485" y="240" font-size="14" text-anchor="middle" fill="#0F172A" font-family="Menlo, Consolas, monospace">3</text>
  <line x1="534" y1="235" x2="566" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <g font-size="14" fill="#0F172A"><rect x="570" y="219" width="126" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="580" y="240">Rome</text><text x="688" y="240" text-anchor="end" font-family="Menlo, Consolas, monospace">3</text></g>
  <text x="24" y="296" font-size="12" fill="#475569">The group key becomes the index of the result; with as_index=False it stays a regular column instead.</text>
