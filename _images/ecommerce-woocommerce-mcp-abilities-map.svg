<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 512" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How abilities reach REST, MCP and the command line</title>
<desc id="d">Abilities registered by WordPress core, WooCommerce and the Pocket Coffee plugin go into the Abilities API registry in core. The registry is reached through the REST routes under wp-abilities v1, the MCP Adapter default server over HTTP, and the WP-CLI stdio command. The old WooCommerce MCP endpoint is shown dashed because it returns 404 on 11.2.1 and was removed in 11.3.</desc>
<rect width="1040" height="512" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One registry, several doors: how abilities reach clients on WordPress 7.1.3 and WooCommerce 11.2.1</text>
<rect x="30" y="70" width="250" height="102" rx="10" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="155.0" y="94" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">WordPress core</text>
<text x="155.0" y="116" font-size="12" fill="#f2f5f8" text-anchor="middle">core/get-site-info</text>
<text x="155.0" y="133" font-size="12" fill="#f2f5f8" text-anchor="middle">core/get-user-info</text>
<text x="155.0" y="150" font-size="12" fill="#f2f5f8" text-anchor="middle">core/get-environment-info</text>
<text x="155.0" y="167" font-size="12" fill="#f2f5f8" text-anchor="middle">meta.public = true</text>
<rect x="30" y="188" width="250" height="128" rx="10" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="155.0" y="212" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">WooCommerce 11.2.1</text>
<text x="155.0" y="234" font-size="12" fill="#f2f5f8" text-anchor="middle">woocommerce/products-query</text>
<text x="155.0" y="251" font-size="12" fill="#f2f5f8" text-anchor="middle">product-create, -update, -delete</text>
<text x="155.0" y="268" font-size="12" fill="#f2f5f8" text-anchor="middle">orders-query, order-add-note</text>
<text x="155.0" y="285" font-size="12" fill="#f2f5f8" text-anchor="middle">order-update-status</text>
<text x="155.0" y="302" font-size="12" fill="#f2f5f8" text-anchor="middle">meta.mcp.public = true</text>
<rect x="30" y="334" width="250" height="134" rx="10" fill="#2f6b6b" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="155.0" y="358" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">pocket-coffee-mcp plugin</text>
<text x="155.0" y="380" font-size="12" fill="#f2f5f8" text-anchor="middle">pocket-coffee/shipping-quote  (tool)</text>
<text x="155.0" y="397" font-size="12" fill="#f2f5f8" text-anchor="middle">pocket-coffee/shipping-policy  (resource)</text>
<text x="155.0" y="414" font-size="12" fill="#f2f5f8" text-anchor="middle">pocket-coffee/restock-prompt  (prompt)</text>
<text x="155.0" y="431" font-size="12" fill="#f2f5f8" text-anchor="middle">pocket-coffee/stock-audit</text>
<text x="155.0" y="448" font-size="12" fill="#f2f5f8" text-anchor="middle">no mcp.public: never offered to MCP</text>
<rect x="370" y="150" width="240" height="170" rx="10" fill="#5a4a6a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="490.0" y="174" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Abilities API (core)</text>
<text x="490.0" y="196" font-size="12" fill="#f2f5f8" text-anchor="middle">wp_register_ability()</text>
<text x="490.0" y="213" font-size="12" fill="#f2f5f8" text-anchor="middle">categories, input and output schema</text>
<text x="490.0" y="230" font-size="12" fill="#f2f5f8" text-anchor="middle">permission_callback</text>
<text x="490.0" y="247" font-size="12" fill="#f2f5f8" text-anchor="middle">execute_callback</text>
<text x="490.0" y="264" font-size="12" fill="#f2f5f8" text-anchor="middle">wp_abilities_api_init</text>
<line x1="280" y1="121" x2="370" y2="200" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="370,200 361.5,197.2 366.1,191.9" fill="#7fb3e6"/>
<line x1="280" y1="252" x2="370" y2="235" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="370,235 362.5,240.0 361.2,233.1" fill="#7fb3e6"/>
<line x1="280" y1="401" x2="370" y2="270" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="370,270 368.2,278.8 362.4,274.8" fill="#7fb3e6"/>
<rect x="710" y="70" width="300" height="86" rx="10" fill="#3d5266" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="860.0" y="94" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">REST: /wp-json/wp-abilities/v1</text>
<text x="860.0" y="116" font-size="12" fill="#f2f5f8" text-anchor="middle">GET abilities, GET categories</text>
<text x="860.0" y="133" font-size="12" fill="#f2f5f8" text-anchor="middle">GET or POST .../run</text>
<text x="860.0" y="150" font-size="12" fill="#f2f5f8" text-anchor="middle">needs meta.show_in_rest = true</text>
<rect x="710" y="176" width="300" height="120" rx="10" fill="#35607a" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="860.0" y="200" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">MCP Adapter 0.7.1 over HTTP</text>
<text x="860.0" y="222" font-size="12" fill="#f2f5f8" text-anchor="middle">/wp-json/mcp/mcp-adapter-default-server</text>
<text x="860.0" y="239" font-size="12" fill="#f2f5f8" text-anchor="middle">3 tools: discover, get-info, execute</text>
<text x="860.0" y="256" font-size="12" fill="#f2f5f8" text-anchor="middle">resources and prompts listed directly</text>
<text x="860.0" y="273" font-size="12" fill="#f2f5f8" text-anchor="middle">only abilities with mcp.public</text>
<rect x="710" y="314" width="300" height="70" rx="10" fill="#2f6b6b" stroke="#f2f5f8" stroke-opacity="0.5"/>
<text x="860.0" y="338" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">WP-CLI stdio: wp mcp-adapter serve</text>
<text x="860.0" y="360" font-size="12" fill="#f2f5f8" text-anchor="middle">same server, local, --user=admin</text>
<rect x="710" y="402" width="300" height="70" rx="10" fill="#3a3a3a" stroke="#f2f5f8" stroke-opacity="0.5" stroke-dasharray="6 4"/>
<text x="860.0" y="426" font-size="14" font-weight="bold" fill="#e88b8b" text-anchor="middle">/wp-json/woocommerce/mcp</text>
<text x="860.0" y="448" font-size="12" fill="#f2f5f8" text-anchor="middle">404 in 11.2.1 (flag off); removed in 11.3: 410 Gone</text>
<line x1="610" y1="200" x2="710" y2="113" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="710,113 706.0,121.1 701.4,115.8" fill="#7fb3e6"/>
<line x1="610" y1="235" x2="710" y2="231" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="710,231 701.9,234.8 701.6,227.8" fill="#7fb3e6"/>
<line x1="610" y1="270" x2="710" y2="349" stroke="#7fb3e6" stroke-width="1.6"/>
<polygon points="710,349 701.3,346.6 705.7,341.1" fill="#7fb3e6"/>
<text x="30" y="494" font-size="12.5" fill="#f2f5f8">Every call is made as a WordPress user (Application Password or --user) and checked by the permission_callback of the ability.</text>
</svg>
