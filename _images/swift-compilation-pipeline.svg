<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>The Swift compilation pipeline: source is parsed to an AST, type-checked, lowered to SIL, optimized, then lowered to LLVM IR and compiled to machine code, with SwiftPM driving the build, the REPL sharing the same front end interactively, and LLDB attaching at run time.</title>
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From Swift source to machine code</text>
  <text x="410" y="47" font-size="11" fill="#666666" text-anchor="middle">parse, type-check, lower to SIL, optimize, then lower to LLVM IR</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <!-- swiftc front-end/back-end row -->
  <rect x="16" y="70" width="120" height="64" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="76" y="94" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Parser</text>
  <text x="76" y="111" font-size="10.5" fill="#41566e" text-anchor="middle">source -&gt; AST</text>
  <text x="76" y="124" font-size="10.5" fill="#41566e" text-anchor="middle">(.swift files)</text>

  <rect x="152" y="70" width="128" height="64" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="216" y="94" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">Type Checker</text>
  <text x="216" y="111" font-size="10.5" fill="#41566e" text-anchor="middle">typed AST</text>
  <text x="216" y="124" font-size="10.5" fill="#41566e" text-anchor="middle">+ Sendable checks</text>

  <rect x="296" y="70" width="128" height="64" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.5"/>
  <text x="360" y="94" font-size="12.5" font-weight="bold" fill="#3c2a5c" text-anchor="middle">SILGen</text>
  <text x="360" y="111" font-size="10.5" fill="#5a4a72" text-anchor="middle">raw SIL</text>
  <text x="360" y="124" font-size="10.5" fill="#5a4a72" text-anchor="middle">(Swift IL)</text>

  <rect x="440" y="70" width="140" height="64" rx="6" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.5"/>
  <text x="510" y="94" font-size="12.5" font-weight="bold" fill="#3c2a5c" text-anchor="middle">SIL Optimizer</text>
  <text x="510" y="111" font-size="10.5" fill="#5a4a72" text-anchor="middle">canonical + optimized SIL</text>
  <text x="510" y="124" font-size="10.5" fill="#5a4a72" text-anchor="middle">diagnostics, generics spec.</text>

  <rect x="596" y="70" width="112" height="64" rx="6" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.5"/>
  <text x="652" y="94" font-size="12.5" font-weight="bold" fill="#1d5236" text-anchor="middle">IRGen</text>
  <text x="652" y="111" font-size="10.5" fill="#3a6b51" text-anchor="middle">LLVM IR</text>

  <rect x="724" y="70" width="80" height="64" rx="6" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.5"/>
  <text x="764" y="94" font-size="12.5" font-weight="bold" fill="#1d5236" text-anchor="middle">LLVM</text>
  <text x="764" y="111" font-size="10.5" fill="#3a6b51" text-anchor="middle">backend</text>

  <line x1="136" y1="102" x2="148" y2="102" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="280" y1="102" x2="292" y2="102" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="424" y1="102" x2="436" y2="102" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="580" y1="102" x2="592" y2="102" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="708" y1="102" x2="720" y2="102" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- machine code -->
  <rect x="620" y="168" width="184" height="60" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.5"/>
  <text x="712" y="190" font-size="12.5" font-weight="bold" fill="#7a4d13" text-anchor="middle">Machine code</text>
  <text x="712" y="206" font-size="10.5" fill="#6d563a" text-anchor="middle">executable / library, per target</text>
  <text x="712" y="219" font-size="10.5" fill="#6d563a" text-anchor="middle">CPU + OS (incl. cross-compiled)</text>
  <line x1="764" y1="134" x2="726" y2="164" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- SwiftPM band driving the whole build -->
  <rect x="16" y="256" width="788" height="50" rx="8" fill="#fbfaf5" stroke="#c9c2ab" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="410" y="286" font-size="12" font-weight="bold" fill="#6b6244" text-anchor="middle">SwiftPM (`swift build` / `swift run`) drives every stage above, resolving dependencies and invoking swiftc per target/module</text>

  <!-- REPL branch -->
  <rect x="60" y="330" width="300" height="86" rx="6" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="210" y="352" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">REPL / `swift` script mode</text>
  <text x="210" y="371" font-size="10.5" fill="#41566e" text-anchor="middle">reuses the parser and type checker above,</text>
  <text x="210" y="386" font-size="10.5" fill="#41566e" text-anchor="middle">then JIT-executes each line via LLVM's</text>
  <text x="210" y="401" font-size="10.5" fill="#41566e" text-anchor="middle">execution engine instead of writing a binary</text>

  <!-- LLDB branch -->
  <rect x="460" y="330" width="300" height="86" rx="6" fill="#fff4e8" stroke="#b5762a" stroke-width="1.5"/>
  <text x="610" y="352" font-size="12.5" font-weight="bold" fill="#7a4d13" text-anchor="middle">LLDB</text>
  <text x="610" y="371" font-size="10.5" fill="#6d563a" text-anchor="middle">attaches to the running machine code,</text>
  <text x="610" y="386" font-size="10.5" fill="#6d563a" text-anchor="middle">reading debug info that IRGen/LLVM embed</text>
  <text x="610" y="401" font-size="10.5" fill="#6d563a" text-anchor="middle">to map back to Swift source lines</text>

  <line x1="210" y1="326" x2="210" y2="310" stroke="#8a7e60" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="712" y1="228" x2="650" y2="326" stroke="#8a7e60" stroke-width="1.3" marker-end="url(#ar)"/>

  <text x="410" y="440" font-size="11" fill="#444444" text-anchor="middle">Every path shares the same front end (parser, type checker, SIL); only how the result is executed differs.</text>
</svg>
