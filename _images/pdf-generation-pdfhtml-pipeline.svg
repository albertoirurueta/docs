<svg viewBox="0 0 900 500" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ph-arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b36b00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">pdfHTML: HTML to CSS resolution to iText layout to PDF</text>

  <!-- Row of stages -->
  <rect x="15" y="50" width="150" height="130" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">1. HTML in</text>
  <text x="90" y="96" text-anchor="middle" font-size="11" fill="#333">String, File or</text>
  <text x="90" y="111" text-anchor="middle" font-size="11" fill="#333">InputStream</text>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#333">from a template engine</text>
  <text x="90" y="150" text-anchor="middle" font-size="11" fill="#333">such as Thymeleaf</text>

  <rect x="195" y="50" width="150" height="130" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="270" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">2. Parse</text>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#333">HTML parser of the</text>
  <text x="270" y="111" text-anchor="middle" font-size="11" fill="#333">styled-xml-parser module</text>
  <text x="270" y="135" text-anchor="middle" font-size="11" fill="#333">result: a tree of</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#333">element and text nodes</text>

  <rect x="375" y="50" width="150" height="130" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">3. CSS resolution</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#333">user-agent CSS, style</text>
  <text x="450" y="111" text-anchor="middle" font-size="11" fill="#333">and link elements,</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#333">style attributes, @media</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#333">result: computed styles</text>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#333">per node, @page rules</text>

  <rect x="555" y="50" width="150" height="130" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="630" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">4. Attach</text>
  <text x="630" y="96" text-anchor="middle" font-size="11" fill="#333">one tag worker per tag</text>
  <text x="630" y="111" text-anchor="middle" font-size="11" fill="#333">builds an iText element,</text>
  <text x="630" y="126" text-anchor="middle" font-size="11" fill="#333">one CSS applier copies</text>
  <text x="630" y="141" text-anchor="middle" font-size="11" fill="#333">the computed styles</text>
  <text x="630" y="156" text-anchor="middle" font-size="11" fill="#333">onto it</text>

  <rect x="735" y="50" width="150" height="130" rx="8" fill="#e3f4e3" stroke="#2f7a2f" stroke-width="1.5"/>
  <text x="810" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7a2f">5. Layout and write</text>
  <text x="810" y="96" text-anchor="middle" font-size="11" fill="#333">layout Document and</text>
  <text x="810" y="111" text-anchor="middle" font-size="11" fill="#333">renderers paginate the</text>
  <text x="810" y="126" text-anchor="middle" font-size="11" fill="#333">elements, margin boxes</text>
  <text x="810" y="141" text-anchor="middle" font-size="11" fill="#333">are drawn, PdfWriter</text>
  <text x="810" y="156" text-anchor="middle" font-size="11" fill="#333">emits the bytes</text>

  <line x1="165" y1="115" x2="195" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ph-arrow)"/>
  <line x1="345" y1="115" x2="375" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ph-arrow)"/>
  <line x1="525" y1="115" x2="555" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ph-arrow)"/>
  <line x1="705" y1="115" x2="735" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ph-arrow)"/>

  <text x="15" y="212" font-size="11" fill="#555">convertToPdf runs all five stages and writes the PDF bytes.</text>
  <text x="15" y="228" font-size="11" fill="#555">convertToElements stops after stage 4 and returns elements.</text>

  <!-- Extension points -->
  <text x="15" y="290" font-size="13" font-weight="700" fill="#b36b00">What you can plug in through ConverterProperties</text>
  <line x1="15" y1="296" x2="885" y2="296" stroke="#b36b00" stroke-dasharray="4 4"/>

  <rect x="15" y="318" width="190" height="64" rx="6" fill="#fff3d6" stroke="#b36b00"/>
  <text x="110" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#333">baseUri</text>
  <text x="110" y="354" text-anchor="middle" font-size="11" fill="#333">where relative links to</text>
  <text x="110" y="369" text-anchor="middle" font-size="11" fill="#333">CSS, images and fonts resolve</text>

  <rect x="225" y="318" width="190" height="64" rx="6" fill="#fff3d6" stroke="#b36b00"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#333">MediaDeviceDescription</text>
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#333">print or screen, and a width,</text>
  <text x="320" y="369" text-anchor="middle" font-size="11" fill="#333">decides which @media applies</text>

  <rect x="435" y="318" width="210" height="64" rx="6" fill="#fff3d6" stroke="#b36b00"/>
  <text x="540" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#333">TagWorkerFactory,</text>
  <text x="540" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#333">CssApplierFactory</text>
  <text x="540" y="369" text-anchor="middle" font-size="11" fill="#333">custom tags and CSS handling</text>

  <rect x="665" y="318" width="220" height="64" rx="6" fill="#fff3d6" stroke="#b36b00"/>
  <text x="775" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#333">ResourceRetriever,</text>
  <text x="775" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#333">FontProvider</text>
  <text x="775" y="369" text-anchor="middle" font-size="11" fill="#333">what is fetched, which fonts exist</text>

    <path d="M110,318 L110,300 L450,300 L450,182" fill="none" stroke="#b36b00" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ph-arrow-o)"/>
  <path d="M320,318 L320,300" fill="none" stroke="#b36b00" stroke-width="1.2" stroke-dasharray="5 3"/>
  <path d="M540,318 L540,300 L630,300 L630,182" fill="none" stroke="#b36b00" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ph-arrow-o)"/>
  <path d="M775,318 L775,300 L810,300 L810,182" fill="none" stroke="#b36b00" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ph-arrow-o)"/>

  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#555">Stylesheets, images and @font-face files are fetched while stages 3 to 5 run, always through the ResourceRetriever.</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#555">There is no JavaScript engine in the pipeline: scripts in the HTML are ignored, so render dynamic content before conversion.</text>
  <text x="450" y="470" text-anchor="middle" font-size="11" fill="#555">Properties shown are those of pdfHTML 6.3.4 (as of 2026-10-09).</text>
</svg>
