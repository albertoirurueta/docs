<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="30" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A MultiIndex stores levels once and a code per row</text>
<text x="115" y="64" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">levels</text>
<rect x="30" y="76" width="170" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
