<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">MultiIndex levels and codes</title>
<desc id="d">A two level MultiIndex stores unique values in two level lists and, for each row, an integer code per level that points into those lists. Codes 0 0 0 1 1 1 and 0 1 2 0 1 2 produce the six tuples from 2025 Q1 to 2026 Q3.</desc>
