<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How a React admin page reaches WooCommerce Admin</title>
  <desc id="d">Four lanes. At build time wp-scripts compiles src/index.js with the WooCommerce dependency extraction plugin into build/index.js and build/index.asset.php. In the PHP request, wc_admin_register_page adds the menu entry and admin_enqueue_scripts enqueues the bundle with the dependencies listed in the asset file. In the browser the wc-admin shell reads the woocommerce_admin_pages_list filter and renders the container, which uses the wc.components, wc.data and wc.navigation globals. The data stores call the wc-analytics settings route and the wc/v3 products route, and the save ends in WC_Admin_Settings::save_fields.</desc>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">From source file to rendered page</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">The Pocket Coffee page at admin.php?page=wc-admin&amp;path=/pocket-coffee</text>
  <rect x="40" y="76" width="880" height="100" rx="6" fill="#34495e"/>
  <text x="52" y="98" font-size="13" font-weight="bold" text-anchor="start" fill="#f4b860">Build time</text>
  <rect x="40" y="196" width="880" height="100" rx="6" fill="#34495e"/>
  <text x="52" y="218" font-size="13" font-weight="bold" text-anchor="start" fill="#f4b860">PHP request</text>
  <rect x="40" y="316" width="880" height="120" rx="6" fill="#34495e"/>
  <text x="52" y="338" font-size="13" font-weight="bold" text-anchor="start" fill="#f4b860">Browser</text>
  <rect x="40" y="456" width="880" height="100" rx="6" fill="#34495e"/>
  <text x="52" y="478" font-size="13" font-weight="bold" text-anchor="start" fill="#f4b860">REST and options</text>
  <rect x="190" y="92" width="190" height="70" rx="6" fill="#3d5266"/>
  <text x="285.0" y="121.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">src/index.js</text>
  <text x="285.0" y="139.0" font-size="12" text-anchor="middle" fill="#f2f5f8">JSX, @woocommerce imports</text>
  <rect x="430" y="92" width="230" height="70" rx="6" fill="#3d5266"/>
  <text x="545.0" y="112.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">wp-scripts build</text>
  <text x="545.0" y="130.0" font-size="12" text-anchor="middle" fill="#f2f5f8">DependencyExtraction plugin</text>
  <text x="545.0" y="148.0" font-size="12" text-anchor="middle" fill="#f2f5f8">for @woocommerce/* packages</text>
  <rect x="710" y="92" width="190" height="70" rx="6" fill="#3d5266"/>
  <text x="805.0" y="112.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">build/index.js</text>
  <text x="805.0" y="130.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">build/index.asset.php</text>
  <text x="805.0" y="148.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">dependencies + version</text>
  <path d="M380 127 L428 127" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M660 127 L708 127" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="190" y="212" width="330" height="70" rx="6" fill="#3d5266"/>
  <text x="355.0" y="232.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">admin_menu</text>
  <text x="355.0" y="250.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wc_admin_register_page( ... )</text>
  <text x="355.0" y="268.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id, parent, path, capability</text>
  <rect x="560" y="212" width="340" height="70" rx="6" fill="#3d5266"/>
  <text x="730.0" y="232.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">admin_enqueue_scripts</text>
  <text x="730.0" y="250.0" font-size="12" text-anchor="middle" fill="#f2f5f8">is_admin_or_embed_page() then wp_enqueue_script</text>
  <text x="730.0" y="268.0" font-size="12" text-anchor="middle" fill="#f2f5f8">with the dependencies of index.asset.php</text>
  <path d="M805 162 L805 210" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="190" y="334" width="200" height="82" rx="6" fill="#3d5266"/>
  <text x="290.0" y="360.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">wc-admin shell</text>
  <text x="290.0" y="378.0" font-size="12" text-anchor="middle" fill="#f2f5f8">script wc-admin-app</text>
  <text x="290.0" y="396.0" font-size="12" text-anchor="middle" fill="#f2f5f8">router for ?path=...</text>
  <rect x="430" y="334" width="230" height="82" rx="6" fill="#3d5266"/>
  <text x="545.0" y="360.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">woocommerce_admin_pages_list</text>
  <text x="545.0" y="378.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">JS filter: push container,</text>
  <text x="545.0" y="396.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">path and breadcrumbs</text>
  <rect x="700" y="334" width="200" height="82" rx="6" fill="#3d5266"/>
  <text x="800.0" y="360.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">wc.components, wc.data</text>
  <text x="800.0" y="378.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wc.navigation, wc.number</text>
  <text x="800.0" y="396.0" font-size="12" text-anchor="middle" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">(externals, not bundled)</text>
  <path d="M805 282 L805 332" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M430 375 L392 375" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M698 375 L662 375" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="190" y="472" width="300" height="66" rx="6" fill="#3d5266"/>
  <text x="340.0" y="499.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">/wc-analytics/settings/pocket_coffee</text>
  <text x="340.0" y="517.0" font-size="12" text-anchor="middle" fill="#f2f5f8">GET; POST .../batch to save</text>
  <rect x="720" y="472" width="180" height="66" rx="6" fill="#3d5266"/>
  <text x="810.0" y="499.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">/wc/v3/products</text>
  <text x="810.0" y="517.0" font-size="12" text-anchor="middle" fill="#f2f5f8">wc/admin/products</text>
  <rect x="520" y="472" width="180" height="66" rx="6" fill="#3d5266"/>
  <text x="610.0" y="499.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">wp_options</text>
  <text x="610.0" y="517.0" font-size="12" text-anchor="middle" fill="#f2f5f8">via save_fields()</text>
  <path d="M770 416 L400 470" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M810 416 L810 470" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M492 505 L518 505" stroke="#e8908a" stroke-width="2" fill="none" marker-end="url(#c)"/>
  <text x="40" y="590" font-size="12" text-anchor="start" fill="#9fd3c7">The page container is plain React; everything it needs from WooCommerce arrives as a script dependency, so the bundle stays small.</text>
  <text x="40" y="612" font-size="12" text-anchor="start" fill="#9fd3c7">A page registered for PHP only (wc_admin_connect_page) skips the right-hand half: WordPress renders it and WooCommerce Admin adds the header.</text>
</svg>
