<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah2-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><radialGradient id="gd" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#E8C9A0"/><stop offset="1" stop-color="#2B1D12"/></radialGradient>
<radialGradient id="gs" cx="35%" cy="32%" r="45%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#111827"/></radialGradient>
<radialGradient id="gr" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#FFF7E6"/><stop offset="0.25" stop-color="#D9AE7B"/><stop offset="1" stop-color="#3A2818"/></radialGradient></defs>
<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Ambient, diffuse and specular add up to the final colour</text>
<circle cx="100" cy="140" r="62" fill="#4A3524" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="290" cy="140" r="62" fill="url(#gd)" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="480" cy="140" r="62" fill="url(#gs)" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="670" cy="140" r="62" fill="url(#gr)" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="152" font-size="34" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text>
<text x="385" y="152" font-size="34" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text>
<text x="575" y="152" font-size="34" font-weight="bold" fill="#1F2937" text-anchor="middle">=</text>
<text x="100" y="230" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Ambient</text>
<text x="100" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">k_a · lightColor</text>
<text x="290" y="230" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Diffuse</text>
<text x="290" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">k_d · max(N·L, 0)</text>
<text x="480" y="230" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Specular</text>
<text x="480" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">k_s · max(N·H, 0)^s</text>
<text x="670" y="230" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Result</text>
<text x="670" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sum, then gamma</text>
<text x="380" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Constant fill, view-independent shading from the cosine law, and a view-dependent highlight; the sum is clamped or tone mapped.</text>
</svg>
