<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Hexagonal (ports and adapters) architecture</text>

  <defs>
    <marker id="hex-arrow-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="hex-arrow-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <!-- hexagon: Domain at the center -->
  <polygon points="390,105 498.25,167.5 498.25,292.5 390,355 281.75,292.5 281.75,167.5"
           fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="390" y="222" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Domain</text>
  <text x="390" y="240" font-size="10" fill="#666666" text-anchor="middle">entities, value objects, use cases</text>

  <!-- port labels on the left (inbound) and right (outbound) edges -->
  <text x="281.75" y="230" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle"
        transform="rotate(-90 281.75 230)">Inbound Port</text>
  <text x="498.25" y="230" font-size="11" font-weight="bold" fill="#2f5424" text-anchor="middle"
        transform="rotate(90 498.25 230)">Outbound Port</text>

  <!-- inbound adapters (left, driving the domain) -->
  <rect x="40" y="90" width="180" height="50" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="110" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">REST Controller</text>
  <text x="130" y="126" font-size="9.5" fill="#666666" text-anchor="middle">inbound adapter</text>
  <line x1="220" y1="118" x2="278" y2="185" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#hex-arrow-in)"/>

  <rect x="40" y="290" width="180" height="50" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="310" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Kafka Listener</text>
  <text x="130" y="326" font-size="9.5" fill="#666666" text-anchor="middle">inbound adapter</text>
  <line x1="220" y1="312" x2="278" y2="275" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#hex-arrow-in)"/>

  <!-- outbound adapters (right, driven by the domain) -->
  <rect x="560" y="90" width="180" height="50" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="650" y="110" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JPA Repository Adapter</text>
  <text x="650" y="126" font-size="9.5" fill="#666666" text-anchor="middle">outbound adapter</text>
  <line x1="502" y1="185" x2="558" y2="120" stroke="#2f5424" stroke-width="1.8" marker-end="url(#hex-arrow-out)"/>

  <rect x="560" y="290" width="180" height="50" rx="6" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="650" y="310" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Kafka Producer</text>
  <text x="650" y="326" font-size="9.5" fill="#666666" text-anchor="middle">outbound adapter</text>
  <line x1="502" y1="275" x2="558" y2="310" stroke="#2f5424" stroke-width="1.8" marker-end="url(#hex-arrow-out)"/>

  <text x="390" y="404" font-size="11" fill="#444444" text-anchor="middle">Adapters plug into port interfaces from outside; the domain never depends on REST, JPA, or Kafka directly.</text>
</svg>
