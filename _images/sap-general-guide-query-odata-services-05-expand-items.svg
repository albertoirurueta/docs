</text><text x="28" y="346" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;amount&quot;: &quot;50.00&quot;,</text><text x="28" y="366" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;ID&quot;: 104</text><text x="28" y="386" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    }</text><text x="28" y="406" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">  ],</text><text x="28" y="426" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">  &quot;ID&quot;: 4</text><text x="28" y="446" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29">}</text></g>
