<title id="sap-general-guide-query-odata-services-05-expand-items-title">Browser with the address localhost:4004/odata/v4/query/Claims(4) with the options expand items and select title, marked by callout 9: the JSON response holds the claim Conference fee with its two items inside, Registration 300.00 and Workshop 50.00</title>
<g><rect x="0" y="0" width="1080" height="470" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><rect x="0" y="0" width="1080" height="92" fill="#f5f6f7" stroke="#d9d9d9" stroke-width="1"/>
