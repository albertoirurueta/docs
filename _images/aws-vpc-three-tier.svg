<svg viewBox="0 0 900 560" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a58"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf VPC 10.0.0.0/16: three tiers across two Availability Zones</text>

  <text x="450" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Internet</text>
  <rect x="380" y="58" width="140" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="77" text-anchor="middle" font-size="12" fill="#1a1a1a">Users and the open internet</text>
  <line x1="450" y1="86" x2="450" y2="108" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>

  <!-- VPC -->
  <rect x="20" y="108" width="860" height="440" rx="12" fill="#f8fafc" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="34" y="128" font-size="13" font-weight="700" fill="#123a72">VPC bookshelf-vpc</text>

  <rect x="340" y="116" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="450" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Internet gateway (igw)</text>

  <!-- AZ A -->
  <rect x="40" y="160" width="400" height="330" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="240" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Availability Zone us-east-1a</text>
  <!-- AZ B -->
  <rect x="460" y="160" width="400" height="330" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="660" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4a58">Availability Zone us-east-1b</text>

  <!-- public A/B -->
  <rect x="56" y="192" width="368" height="76" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="68" y="210" font-size="12" font-weight="700" fill="#123a72">Public subnet 10.0.0.0/24</text>
  <rect x="72" y="220" width="150" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="147" y="244" text-anchor="middle" font-size="11" fill="#123a72">ALB node alb-bookshelf</text>
  <rect x="240" y="220" width="170" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="325" y="244" text-anchor="middle" font-size="11" fill="#123a72">NAT gateway + Elastic IP</text>

  <rect x="476" y="192" width="368" height="76" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="488" y="210" font-size="12" font-weight="700" fill="#123a72">Public subnet 10.0.1.0/24</text>
  <rect x="492" y="220" width="150" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="567" y="244" text-anchor="middle" font-size="11" fill="#123a72">ALB node alb-bookshelf</text>
  <rect x="660" y="220" width="170" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4" stroke-dasharray="4 3"/>
  <text x="745" y="244" text-anchor="middle" font-size="11" fill="#123a72">NAT gateway (optional)</text>

  <!-- app -->
  <rect x="56" y="290" width="368" height="76" rx="8" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="2"/>
  <text x="68" y="308" font-size="12" font-weight="700" fill="#14532d">Private app subnet 10.0.2.0/24</text>
  <rect x="72" y="318" width="338" height="38" rx="6" fill="#ffffff" stroke="#1e7b3a"/>
  <text x="241" y="342" text-anchor="middle" font-size="11" fill="#14532d">ECS tasks catalog-api, orders-api (awsvpc ENIs)</text>

  <rect x="476" y="290" width="368" height="76" rx="8" fill="#e6f4ea" stroke="#1e7b3a" stroke-width="2"/>
  <text x="488" y="308" font-size="12" font-weight="700" fill="#14532d">Private app subnet 10.0.3.0/24</text>
  <rect x="492" y="318" width="338" height="38" rx="6" fill="#ffffff" stroke="#1e7b3a"/>
  <text x="661" y="342" text-anchor="middle" font-size="11" fill="#14532d">ECS tasks catalog-api, orders-api (awsvpc ENIs)</text>

  <!-- data -->
  <rect x="56" y="388" width="368" height="76" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="68" y="406" font-size="12" font-weight="700" fill="#7a4800">Isolated data subnet 10.0.4.0/24 (no default route)</text>
  <rect x="72" y="416" width="338" height="38" rx="6" fill="#ffffff" stroke="#c77700"/>
  <text x="241" y="440" text-anchor="middle" font-size="11" fill="#7a4800">Aurora writer bookshelf-catalog</text>

  <rect x="476" y="388" width="368" height="76" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="488" y="406" font-size="12" font-weight="700" fill="#7a4800">Isolated data subnet 10.0.5.0/24 (no default route)</text>
  <rect x="492" y="416" width="338" height="38" rx="6" fill="#ffffff" stroke="#c77700"/>
  <text x="661" y="440" text-anchor="middle" font-size="11" fill="#7a4800">Aurora reader</text>

  <!-- flows -->
  <line x1="450" y1="146" x2="450" y2="160" stroke="#3c4a58" stroke-width="2"/>
  <line x1="147" y1="268" x2="147" y2="318" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="567" y1="268" x2="567" y2="318" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="241" y1="356" x2="241" y2="416" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="661" y1="356" x2="661" y2="416" stroke="#3c4a58" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="318" x2="340" y2="258" stroke="#3c4a58" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- endpoints bar -->
  <rect x="56" y="500" width="788" height="36" rx="8" fill="#f3e8ff" stroke="#7e3ab5" stroke-width="2"/>
  <text x="450" y="523" text-anchor="middle" font-size="12" fill="#4a1d75">VPC endpoints: gateway (S3, DynamoDB) in the app and data route tables; interface (ECR, CloudWatch Logs, Secrets Manager)</text>
</svg>
