<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 594" width="760" height="594" role="img" aria-labelledby="radar-scientific-t radar-scientific-d">
<title id="radar-scientific-t">Radar comparison: Scientific languages</title>
<desc id="radar-scientific-d">Scores from 0 to 10 on 9 axes (Popularity, Ecosystem, Performance, Memory, Energy, Learning (ease), Safety, Versatility, Job market) for Python, R, MATLAB, Julia, Fortran, computed from the sourced CSV data with the rubric in data/NOTES.md (retrieved 2026-10-26). A gap in an outline means no data (n/a) on that axis, not a score of zero; languages with at least one gap: Python, R, MATLAB, Julia, Fortran.</desc>
