<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 864 560" width="860" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">PrestaShop 9 code layers</title>
  <desc id="d">Three entry points (front office, back office and Admin API, each with its own kernel configuration) call the PrestaShopBundle application layer, which uses the Core domain (commands, queries, value objects and interfaces); the Adapter layer implements the Core interfaces on top of the legacy ObjectModel code, which reads and writes the database. Modules plug into every layer through hooks, services and overrides.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- entry points -->
  <rect x="20" y="20" width="205" height="84" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="122" y="44" text-anchor="middle" font-weight="bold">Front office</text>
  <text x="122" y="64" text-anchor="middle" font-size="12">FrontController + Smarty themes</text>
  <text x="122" y="82" text-anchor="middle" font-size="11" opacity="0.8">FrontKernel (experimental)</text>

  <rect x="245" y="20" width="205" height="84" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="44" text-anchor="middle" font-weight="bold">Back office</text>
  <text x="347" y="64" text-anchor="middle" font-size="12">Symfony controllers + Twig</text>
  <text x="347" y="82" text-anchor="middle" font-size="11" opacity="0.8">AdminKernel, app-id admin</text>

  <rect x="470" y="20" width="205" height="84" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="572" y="44" text-anchor="middle" font-weight="bold">Admin API</text>
  <text x="572" y="64" text-anchor="middle" font-size="12">API Platform + OAuth2</text>
  <text x="572" y="82" text-anchor="middle" font-size="11" opacity="0.8">AdminAPIKernel, app-id admin-api</text>

  <!-- layers -->
  <rect x="20" y="140" width="655" height="62" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="164" text-anchor="middle" font-weight="bold">PrestaShopBundle   (src/PrestaShopBundle)</text>
  <text x="347" y="186" text-anchor="middle" font-size="12">controllers, form types, grids, Twig components, console commands, API resources</text>

  <rect x="20" y="228" width="655" height="62" rx="12" fill="#1abc9c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="252" text-anchor="middle" font-weight="bold">Core   (src/Core)</text>
  <text x="347" y="274" text-anchor="middle" font-size="12">Domain: commands, queries, handler interfaces, value objects, exceptions, context services</text>

  <rect x="20" y="316" width="655" height="62" rx="12" fill="#f1c40f" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="340" text-anchor="middle" font-weight="bold">Adapter   (src/Adapter)</text>
  <text x="347" y="362" text-anchor="middle" font-size="12">command and query handlers, repositories, bridges to legacy classes</text>

  <rect x="20" y="404" width="655" height="62" rx="12" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="428" text-anchor="middle" font-weight="bold">Legacy   (classes/, controllers/)</text>
  <text x="347" y="450" text-anchor="middle" font-size="12">ObjectModel, Db, Hook, Tools, Context, legacy controllers</text>

  <rect x="20" y="492" width="655" height="48" rx="12" fill="#e74c3c" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <text x="347" y="521" text-anchor="middle" font-weight="bold">MySQL or MariaDB</text>

  <!-- modules -->
  <rect x="705" y="20" width="135" height="446" rx="12" fill="#95a5a6" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="772" y="46" text-anchor="middle" font-weight="bold">Modules</text>
  <text x="772" y="72" text-anchor="middle" font-size="12">hooks</text>
  <text x="772" y="94" text-anchor="middle" font-size="12">services.yml</text>
  <text x="772" y="116" text-anchor="middle" font-size="12">controllers</text>
  <text x="772" y="138" text-anchor="middle" font-size="12">command and</text>
  <text x="772" y="154" text-anchor="middle" font-size="12">query handlers</text>
  <text x="772" y="176" text-anchor="middle" font-size="12">service decoration</text>
  <text x="772" y="198" text-anchor="middle" font-size="12">API resources</text>
  <text x="772" y="220" text-anchor="middle" font-size="12">overrides</text>
  <text x="772" y="242" text-anchor="middle" font-size="12">(legacy)</text>
  <text x="772" y="300" text-anchor="middle" font-size="11" opacity="0.8">plug into every</text>
  <text x="772" y="316" text-anchor="middle" font-size="11" opacity="0.8">layer to the left</text>

  <!-- arrows -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M347 104 L347 138"/>
    <path d="M572 104 L572 138"/>
    <path d="M200 202 L200 226"/>
    <path d="M200 378 L200 402"/>
    <path d="M347 466 L347 490"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)">
    <path d="M500 316 L500 292"/>
  </g>
  <path d="M20 62 L8 62 L8 435 L18 435" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="213" y="219" font-size="11">uses</text>
  <text x="213" y="395" font-size="11">wraps</text>
  <text x="512" y="308" font-size="11">implements Core interfaces</text>
  <text x="360" y="482" font-size="11">Db, ObjectModel</text>
</svg>
