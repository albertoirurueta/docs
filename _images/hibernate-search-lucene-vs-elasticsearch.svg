<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <text x="390" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Embedded Lucene (per node) vs. shared Elasticsearch cluster</text>

  <!-- Lucene side -->
  <text x="180" y="55" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">Lucene backend -- does not scale out</text>

  <rect x="50" y="70" width="120" height="70" rx="6" fill="#fbf1e4" stroke="#c25a1d" stroke-width="2"/>
  <text x="110" y="95" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">App instance 1</text>
  <text x="110" y="112" font-size="9.5" fill="#8a3d10" text-anchor="middle">own local Lucene index</text>
  <text x="110" y="126" font-size="9.5" fill="#8a3d10" text-anchor="middle">(disk on this node)</text>

  <rect x="190" y="70" width="120" height="70" rx="6" fill="#fbf1e4" stroke="#c25a1d" stroke-width="2"/>
  <text x="250" y="95" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">App instance 2</text>
  <text x="250" y="112" font-size="9.5" fill="#8a3d10" text-anchor="middle">own local Lucene index</text>
  <text x="250" y="126" font-size="9.5" fill="#8a3d10" text-anchor="middle">(disk on this node)</text>

  <line x1="170" y1="105" x2="190" y2="105" stroke="#c25a1d" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="180" y="155" font-size="9.5" fill="#8a3d10" text-anchor="middle">no shared refresh --</text>
  <text x="180" y="168" font-size="9.5" fill="#8a3d10" text-anchor="middle">indexes drift apart independently</text>
  <text x="180" y="185" font-size="9.5" fill="#8a3d10" text-anchor="middle">full reindex must run per node</text>

  <!-- divider -->
  <line x1="390" y1="45" x2="390" y2="340" stroke="#cccccc" stroke-width="1"/>

  <!-- Elasticsearch side -->
  <text x="600" y="55" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Elasticsearch/OpenSearch backend -- scales out</text>

  <rect x="450" y="70" width="100" height="55" rx="6" fill="#eef3f8" stroke="#2f6fa8" stroke-width="2"/>
  <text x="500" y="95" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">App instance 1</text>
  <rect x="565" y="70" width="100" height="55" rx="6" fill="#eef3f8" stroke="#2f6fa8" stroke-width="2"/>
  <text x="615" y="95" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">App instance 2</text>
  <rect x="680" y="70" width="90" height="55" rx="6" fill="#eef3f8" stroke="#2f6fa8" stroke-width="2"/>
  <text x="725" y="95" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">App instance 3</text>

  <line x1="500" y1="125" x2="600" y2="190" stroke="#2f6fa8" stroke-width="1.5"/>
  <line x1="615" y1="125" x2="600" y2="190" stroke="#2f6fa8" stroke-width="1.5"/>
  <line x1="725" y1="125" x2="600" y2="190" stroke="#2f6fa8" stroke-width="1.5"/>

  <rect x="490" y="190" width="220" height="90" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="600" y="215" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Shared Elasticsearch cluster</text>
  <text x="600" y="235" font-size="10" fill="#1c4b73" text-anchor="middle">one logical index, consistent view</text>
  <text x="600" y="251" font-size="10" fill="#1c4b73" text-anchor="middle">regardless of which instance wrote/read</text>
  <text x="600" y="267" font-size="10" fill="#1c4b73" text-anchor="middle">scales independently of app instance count</text>

  <text x="600" y="310" font-size="10" fill="#1c4b73" text-anchor="middle">Recommended for any multi-instance / scaled-out deployment</text>
</svg>
