<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">MLPClassifier layers and fitted attributes</title>
<desc id="d">Input of 64 features, two hidden layers of 64 and 32 units, and a softmax output of 10 classes, with the weight matrices stored in coefs_ and the bias vectors in intercepts_.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">MLPClassifier(hidden_layer_sizes=(64, 32)) on 64 features and 10 classes</text>
<rect x="30" y="110" width="110" height="80" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="85" y="145" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">input X</text>
<text x="85" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">64 features</text>
<rect x="200" y="110" width="110" height="80" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="255" y="145" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">hidden 1</text>
<text x="255" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">64 units, relu</text>
<rect x="370" y="110" width="110" height="80" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="425" y="145" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">hidden 2</text>
<text x="425" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">32 units, relu</text>
<rect x="540" y="110" width="150" height="80" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="615" y="145" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">output</text>
<text x="615" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">10 units, softmax</text>
<line x1="140" y1="150" x2="198" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="310" y1="150" x2="368" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="480" y1="150" x2="538" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="169" y="138" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">coefs_[0]</text>
<text x="339" y="138" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">coefs_[1]</text>
<text x="509" y="138" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">coefs_[2]</text>
<text x="169" y="98" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(64, 64)</text>
<text x="339" y="98" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(64, 32)</text>
<text x="509" y="98" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">(32, 10)</text>
<text x="360" y="235" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">intercepts_[i] holds one bias vector per layer transition; n_layers_ = 4 (input, 2 hidden, output)</text>
<text x="360" y="262" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">loss: cross-entropy + alpha/(2n) * sum of squared weights (L2); solver: adam, sgd or lbfgs</text>
</svg>
