<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">GDS algorithm categories</text>
  <text x="360" y="50" font-size="11.5" fill="#666666" text-anchor="middle">all run against a projected graph, via stream / mutate / write / stats</text>

  <!-- Box 1: Pathfinding and centrality -->
  <rect x="30" y="70" width="310" height="150" fill="#eef4f9" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="185" y="94" font-size="13.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Pathfinding &amp; centrality</text>
  <text x="46" y="115" font-size="10.5" fill="#444444">Shortest / cheapest routes, and which</text>
  <text x="46" y="129" font-size="10.5" fill="#444444">nodes matter most to the structure.</text>
  <rect x="46" y="141" width="120" height="22" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="106" y="156" font-size="10" fill="#222222" text-anchor="middle">Dijkstra / A*</text>
  <rect x="174" y="141" width="120" height="22" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="234" y="156" font-size="10" fill="#222222" text-anchor="middle">PageRank</text>
  <rect x="46" y="169" width="248" height="22" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="170" y="184" font-size="10" fill="#222222" text-anchor="middle">Betweenness Centrality</text>
  <text x="185" y="207" font-size="9.5" fill="#666666" text-anchor="middle">see: Pathfinding and Centrality Algorithms</text>

  <!-- Box 2: Community detection -->
  <rect x="380" y="70" width="310" height="150" fill="#eef4ea" stroke="#2f5424" stroke-width="1.3"/>
  <text x="535" y="94" font-size="13.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Community detection</text>
  <text x="396" y="115" font-size="10.5" fill="#444444">Partition or score the graph into</text>
  <text x="396" y="129" font-size="10.5" fill="#444444">densely connected groups.</text>
  <rect x="396" y="141" width="120" height="22" fill="#ffffff" stroke="#2f5424" stroke-width="1"/>
  <text x="456" y="156" font-size="10" fill="#222222" text-anchor="middle">Louvain</text>
  <rect x="524" y="141" width="120" height="22" fill="#ffffff" stroke="#2f5424" stroke-width="1"/>
  <text x="584" y="156" font-size="10" fill="#222222" text-anchor="middle">WCC</text>
  <rect x="396" y="169" width="248" height="22" fill="#ffffff" stroke="#2f5424" stroke-width="1"/>
  <text x="520" y="184" font-size="10" fill="#222222" text-anchor="middle">Label Propagation</text>
  <text x="535" y="207" font-size="9.5" fill="#666666" text-anchor="middle">see: Community Detection Algorithms</text>

  <!-- Box 3: Similarity and embeddings -->
  <rect x="30" y="240" width="310" height="150" fill="#fbf1e8" stroke="#7a3b12" stroke-width="1.3"/>
  <text x="185" y="264" font-size="13.5" font-weight="bold" fill="#7a3b12" text-anchor="middle">Similarity &amp; embeddings</text>
  <text x="46" y="285" font-size="10.5" fill="#444444">Compare nodes directly, or turn each</text>
  <text x="46" y="299" font-size="10.5" fill="#444444">node into a vector for reuse elsewhere.</text>
  <rect x="46" y="311" width="120" height="22" fill="#ffffff" stroke="#7a3b12" stroke-width="1"/>
  <text x="106" y="326" font-size="10" fill="#222222" text-anchor="middle">Node Similarity</text>
  <rect x="174" y="311" width="120" height="22" fill="#ffffff" stroke="#7a3b12" stroke-width="1"/>
  <text x="234" y="326" font-size="10" fill="#222222" text-anchor="middle">K-Nearest Neighbors</text>
  <rect x="46" y="339" width="120" height="22" fill="#ffffff" stroke="#7a3b12" stroke-width="1"/>
  <text x="106" y="354" font-size="10" fill="#222222" text-anchor="middle">FastRP</text>
  <rect x="174" y="339" width="120" height="22" fill="#ffffff" stroke="#7a3b12" stroke-width="1"/>
  <text x="234" y="354" font-size="10" fill="#222222" text-anchor="middle">Node2Vec</text>
  <text x="185" y="377" font-size="9.5" fill="#666666" text-anchor="middle">see: Similarity, Embeddings and ML Pipelines</text>

  <!-- Box 4: ML pipelines -->
  <rect x="380" y="240" width="310" height="150" fill="#f4ecf7" stroke="#5b2c78" stroke-width="1.3"/>
  <text x="535" y="264" font-size="13.5" font-weight="bold" fill="#5b2c78" text-anchor="middle">ML pipelines</text>
  <text x="396" y="285" font-size="10.5" fill="#444444">Train supervised models directly on</text>
  <text x="396" y="299" font-size="10.5" fill="#444444">graph-derived features.</text>
  <rect x="396" y="311" width="120" height="22" fill="#ffffff" stroke="#5b2c78" stroke-width="1"/>
  <text x="456" y="326" font-size="10" fill="#222222" text-anchor="middle">Node Classification</text>
  <rect x="524" y="311" width="120" height="22" fill="#ffffff" stroke="#5b2c78" stroke-width="1"/>
  <text x="584" y="326" font-size="10" fill="#222222" text-anchor="middle">Link Prediction</text>
  <text x="535" y="377" font-size="9.5" fill="#666666" text-anchor="middle">see: Similarity, Embeddings and ML Pipelines</text>

  <text x="360" y="415" font-size="11.5" fill="#444444" text-anchor="middle">Similarity/embeddings often feed the ML pipelines' feature vectors as input.</text>
</svg>
