<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How the AI pieces stack up, and how usage is tiered</text>
  <rect x="24" y="52" width="440" height="52" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="244" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">You: a prompt, a sketch or a brief</text>
  <text x="244" y="92" font-size="11" fill="#374151" text-anchor="middle">typed in the Canva AI tab or on the homepage</text>
  <path d="M244,106 L244,122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="24" y="126" width="440" height="82" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="244" y="148" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Canva AI 2.0: chat in the editor</text>
  <text x="244" y="166" font-size="11" fill="#374151" text-anchor="middle">conversational design, agentic editing, Memory Library,</text>
  <text x="244" y="182" font-size="11" fill="#374151" text-anchor="middle">connectors, scheduling, web research, brand intelligence,</text>
  <text x="244" y="198" font-size="11" fill="#374151" text-anchor="middle">Sheets AI, Canva Code</text>
  <path d="M244,210 L244,226" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="24" y="230" width="440" height="64" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="244" y="252" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Canva Design Model</text>
  <text x="244" y="270" font-size="11" fill="#92400E" text-anchor="middle">understands structure, layering, hierarchy and brand</text>
  <text x="244" y="285" font-size="11" fill="#92400E" text-anchor="middle">so output arrives as separate, editable objects</text>
  <path d="M244,296 L244,312" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="24" y="316" width="440" height="52" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="244" y="338" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Models for single jobs</text>
  <text x="244" y="356" font-size="11" fill="#374151" text-anchor="middle">Canva Craft (images), Canva Brush (design edits), Dream Lab</text>
  <text x="612" y="68" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Usage tiers (Help Center)</text>
  <rect x="496" y="80" width="232" height="80" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="612" y="100" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">Standard</text>
  <text x="612" y="118" font-size="11" fill="#374151" text-anchor="middle">unmetered on paid subscriptions;</text>
  <text x="612" y="133" font-size="11" fill="#374151" text-anchor="middle">draws on the allowance on Free</text>
  <text x="612" y="149" font-size="11" fill="#374151" text-anchor="middle">e.g. Image Upscaler, Magic Formulas</text>
  <rect x="496" y="172" width="232" height="80" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="612" y="192" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">Premium</text>
  <text x="612" y="210" font-size="11" fill="#374151" text-anchor="middle">counts against the monthly allowance</text>
  <text x="612" y="225" font-size="11" fill="#374151" text-anchor="middle">e.g. Magic Layers, Canva Code,</text>
  <text x="612" y="241" font-size="11" fill="#374151" text-anchor="middle">Generate elements</text>
  <rect x="496" y="264" width="232" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="612" y="284" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Ultra</text>
  <text x="612" y="302" font-size="11" fill="#92400E" text-anchor="middle">counts most against the allowance</text>
  <text x="612" y="317" font-size="11" fill="#92400E" text-anchor="middle">e.g. conversational design with</text>
  <text x="612" y="333" font-size="11" fill="#92400E" text-anchor="middle">Canva AI 2.0, video clips</text>
  <text x="380" y="388" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
