<text x="220.0" y="82.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">alias</text>
<rect x="290" y="60" width="100" height="34" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="340.0" y="82.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">missing</text>
<rect x="390" y="60" width="150" height="34" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="465.0" y="82.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">storage</text>
<rect x="540" y="60" width="150" height="34" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="615.0" y="82.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">str.len() dtype</text>
<rect x="30" y="94" width="120" height="44" rx="3" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.5"/>
<text x="90.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">object</text>
<rect x="150" y="94" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="220.0" y="121.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">"object"</text>
<rect x="290" y="94" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="340.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">None or NaN</text>
<rect x="390" y="94" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="465.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Python objects</text>
<rect x="540" y="94" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="615.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">float64</text>
<rect x="30" y="138" width="120" height="44" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="90.0" y="165.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">str (default)</text>
<rect x="150" y="138" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="220.0" y="165.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">"str"</text>
<rect x="290" y="138" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="340.0" y="165.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">NaN</text>
<rect x="390" y="138" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="465.0" y="165.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">PyArrow if installed</text>
<rect x="540" y="138" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="615.0" y="165.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">float64</text>
<rect x="30" y="182" width="120" height="44" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="90.0" y="209.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">string</text>
<rect x="150" y="182" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="220.0" y="209.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">"string"</text>
<rect x="290" y="182" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="340.0" y="209.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">pd.NA</text>
<rect x="390" y="182" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="465.0" y="209.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">PyArrow if installed</text>
<rect x="540" y="182" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="615.0" y="209.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Int64</text>
<rect x="30" y="226" width="120" height="44" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
<text x="90.0" y="253.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">ArrowDtype</text>
<rect x="150" y="226" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="220.0" y="253.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">string[pyarrow]</text>
<rect x="290" y="226" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="340.0" y="253.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">pd.NA</text>
<rect x="390" y="226" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="465.0" y="253.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">PyArrow only</text>
<rect x="540" y="226" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="615.0" y="253.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">int32[pyarrow]</text>
<text x="360" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Only str is inferred from plain Python strings in pandas 3.x; the others are requested explicitly.</text>
<text x="360" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Without PyArrow, str and string fall back to Python-object storage.</text>
<text x="360" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">The last column is the dtype of s.str.len() with a missing value present (pandas 3.1.0, PyArrow 26).</text>
</svg>