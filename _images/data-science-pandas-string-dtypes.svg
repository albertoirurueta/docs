<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="t d">
<title id="t">String dtypes in pandas 3.1 compared</title><desc id="d">A table comparing object, str, string and string[pyarrow] columns by missing value, how the dtype prints, storage and result of a comparison.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="368" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360.0" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Four ways to hold text in pandas 3.1</text>
<rect x="30" y="60" width="120" height="34" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="90.0" y="82.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">dtype</text>
