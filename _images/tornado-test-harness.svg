<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>What AsyncHTTPTestCase builds around each test</title>
  <defs>
    <marker id="tth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">One fresh world per test method</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">setUp builds it, tearDown closes it, nothing leaks into the next test</text>

  <!-- outer frame: the test case -->
  <rect x="20" y="62" width="680" height="300" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="84" font-size="12" font-weight="bold" fill="currentColor">unittest.TestCase subclass (AsyncHTTPTestCase), one thread, one new IOLoop</text>

  <!-- test method -->
  <rect x="40" y="110" width="190" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">test_* method</text>
  <text x="135" y="154" font-size="11" fill="currentColor" text-anchor="middle">self.fetch("/books")</text>
  <text x="135" y="168" font-size="11" fill="currentColor" text-anchor="middle">blocks via io_loop.run_sync</text>

  <!-- http client -->
  <rect x="40" y="230" width="190" height="60" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="256" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">self.http_client</text>
  <text x="135" y="274" font-size="11" fill="currentColor" text-anchor="middle">get_http_client()</text>

  <!-- app server -->
  <rect x="290" y="170" width="190" height="90" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="385" y="196" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">HTTPServer(get_app())</text>
  <text x="385" y="214" font-size="11" fill="currentColor" text-anchor="middle">127.0.0.1:port from</text>
  <text x="385" y="228" font-size="11" fill="currentColor" text-anchor="middle">bind_unused_port()</text>
  <text x="385" y="246" font-size="11" fill="currentColor" text-anchor="middle">your real Application</text>

  <!-- fake upstream -->
  <rect x="520" y="110" width="160" height="70" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="136" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Fake upstream</text>
  <text x="600" y="154" font-size="11" fill="currentColor" text-anchor="middle">optional second server</text>
  <text x="600" y="168" font-size="11" fill="currentColor" text-anchor="middle">on another free port</text>

  <!-- io loop band -->
  <rect x="40" y="310" width="640" height="38" rx="6" fill="#808080" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="334" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">self.io_loop: a new IOLoop per test, run only while a fetch or @gen_test coroutine is waiting</text>

  <!-- arrows -->
  <line x1="135" y1="180" x2="135" y2="228" stroke="currentColor" stroke-width="1.5" marker-end="url(#tth-arrow)"/>
  <line x1="230" y1="260" x2="288" y2="230" stroke="currentColor" stroke-width="1.5" marker-end="url(#tth-arrow)"/>
  <text x="262" y="236" font-size="10" fill="currentColor" text-anchor="middle">real TCP</text>
  <line x1="480" y1="200" x2="560" y2="182" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#tth-arrow)"/>
  <text x="535" y="206" font-size="10" fill="currentColor" text-anchor="middle">handler calls</text>
  <text x="535" y="218" font-size="10" fill="currentColor" text-anchor="middle">AsyncHTTPClient</text>
</svg>
