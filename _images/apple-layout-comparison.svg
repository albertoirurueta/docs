<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three ways FieldNotes arranges its content</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Same propose / choose / place protocol, three different placement rules</text>

  <!-- Panel 1: HStack -->
  <text x="130" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">HStack</text>
  <rect x="20" y="94" width="220" height="220" rx="10" fill="#fbfbfb" stroke="#999999" stroke-width="1.4"/>
  <rect x="32" y="190" width="60" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="62" y="208" font-size="13" fill="#1c4b73" text-anchor="middle">#trail</text>
  <rect x="98" y="190" width="54" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="125" y="208" font-size="13" fill="#1c4b73" text-anchor="middle">#bird</text>
  <rect x="158" y="190" width="70" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="193" y="208" font-size="13" fill="#1c4b73" text-anchor="middle">#stream</text>
  <line x1="36" y1="236" x2="224" y2="236" stroke="#1c4b73" stroke-width="1.2" marker-end="url(#arrowBlue)"/>
  <text x="130" y="256" font-size="13" fill="#555555" text-anchor="middle">one row, left to right</text>
  <text x="130" y="340" font-size="13" fill="#444444" text-anchor="middle">TagStrip in NoteRow</text>
  <text x="130" y="358" font-size="13" fill="#666666" text-anchor="middle">measures every child</text>

  <!-- Panel 2: LazyVGrid adaptive -->
  <text x="380" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">LazyVGrid (.adaptive)</text>
  <rect x="270" y="94" width="220" height="220" rx="10" fill="#fbfbfb" stroke="#999999" stroke-width="1.4"/>
  <rect x="284" y="108" width="92" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="330" y="141" font-size="13" fill="#8a5a1c" text-anchor="middle">Birds</text>
  <rect x="384" y="108" width="92" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="430" y="141" font-size="13" fill="#8a5a1c" text-anchor="middle">Trails</text>
  <rect x="284" y="174" width="92" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="330" y="207" font-size="13" fill="#8a5a1c" text-anchor="middle">Streams</text>
  <rect x="384" y="174" width="92" height="56" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="430" y="207" font-size="13" fill="#8a5a1c" text-anchor="middle">Geology</text>
  <rect x="284" y="240" width="92" height="56" rx="8" fill="none" stroke="#8a5a1c" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="384" y="240" width="92" height="56" rx="8" fill="none" stroke="#8a5a1c" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="380" y="273" font-size="12" fill="#8a5a1c" text-anchor="middle">created on scroll</text>
  <text x="380" y="340" font-size="13" fill="#444444" text-anchor="middle">NotebookGrid</text>
  <text x="380" y="358" font-size="13" fill="#666666" text-anchor="middle">columns fit the width; rows wrap</text>

  <!-- Panel 3: Radial custom layout -->
  <text x="630" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">RadialTagLayout</text>
  <rect x="520" y="94" width="220" height="220" rx="10" fill="#fbfbfb" stroke="#999999" stroke-width="1.4"/>
  <circle cx="630" cy="204" r="72" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="630" cy="204" r="20" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="630" y="209" font-size="13" fill="#2d6a34" text-anchor="middle">icon</text>
  <!-- chips at 12, 3, 6, 9 o'clock and diagonals (5 chips: 72deg apart) -->
  <rect x="600" y="119" width="60" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="630" y="137" font-size="13" fill="#1c4b73" text-anchor="middle">#trail</text>
  <rect x="668" y="168" width="60" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="698" y="186" font-size="13" fill="#1c4b73" text-anchor="middle">#bird</text>
  <rect x="642" y="249" width="66" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="675" y="267" font-size="13" fill="#1c4b73" text-anchor="middle">#moss</text>
  <rect x="552" y="249" width="66" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="585" y="267" font-size="13" fill="#1c4b73" text-anchor="middle">#rock</text>
  <rect x="528" y="168" width="64" height="26" rx="13" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="560" y="186" font-size="13" fill="#1c4b73" text-anchor="middle">#stream</text>
  <text x="630" y="340" font-size="13" fill="#444444" text-anchor="middle">TagCloud on iPad and Mac</text>
  <text x="630" y="358" font-size="13" fill="#666666" text-anchor="middle">custom Layout: even angles</text>

  <text x="380" y="396" font-size="13" fill="#555555" text-anchor="middle">AnyLayout switches TagCloud between the HStack and the radial layout while keeping each chip's identity.</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/>
    </marker>
  </defs>
</svg>
