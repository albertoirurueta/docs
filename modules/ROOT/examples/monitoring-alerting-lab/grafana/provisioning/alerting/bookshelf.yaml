apiVersion: 1

groups:
  - orgId: 1
    name: bookshelf-service-level
    folder: bookshelf
    interval: 1m
    rules:
      - uid: bookshelf-5xx-ratio
        title: Bookshelf high 5xx ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'sum(rate(http_server_requests_seconds_count{application="bookshelf",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="bookshelf"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: 'Bookshelf 5xx ratio is {{ printf "%.1f" $values.B.Value }} (threshold 0.05)'
          description: 'More than 5 percent of Bookshelf requests answered with a 5xx status for 2 minutes.'
          runbook_url: https://example.com/runbooks/bookshelf-5xx-ratio
          __dashboardUid__: bookshelf-service-health
          __panelId__: '2'
        labels:
          application: bookshelf
          team: bookshelf-sre
          severity: critical

      - uid: bookshelf-p95-latency
        title: Bookshelf p95 latency above SLO
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="bookshelf"}[5m])))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: 'Bookshelf p95 latency is {{ printf "%.2f" $values.B.Value }} s (SLO 0.5 s)'
          description: 'The 95th percentile of Bookshelf request latency has been above the 0.5 s objective for 5 minutes.'
          runbook_url: https://example.com/runbooks/bookshelf-latency
        labels:
          application: bookshelf
          team: bookshelf-sre
          severity: warning

      - uid: bookshelf-slo-burn-rate
        title: Bookshelf SLO burn rate
        condition: E
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'sum(rate(http_server_requests_seconds_count{application="bookshelf",status=~"5.."}[1h])) / sum(rate(http_server_requests_seconds_count{application="bookshelf"}[1h]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'sum(rate(http_server_requests_seconds_count{application="bookshelf",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="bookshelf"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: C
              type: reduce
          - refId: D
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              reducer: last
              settings: { mode: dropNN }
              refId: D
              type: reduce
          - refId: E
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: '$C > 0.072 && $D > 0.072'
              refId: E
              type: math
        noDataState: OK
        execErrState: Error
        for: 2m
        keepFiringFor: 5m
        isPaused: false
        annotations:
          summary: 'Bookshelf burns its error budget 14.4 times too fast (1h {{ printf "%.3f" $values.C.Value }}, 5m {{ printf "%.3f" $values.D.Value }})'
          description: 'The 5xx ratio exceeds 0.072 in both the 1 hour and the 5 minute window, a 14.4x burn of a 99.5 percent availability objective.'
          runbook_url: https://example.com/runbooks/bookshelf-slo-burn
        labels:
          application: bookshelf
          team: bookshelf-sre
          severity: critical

  - orgId: 1
    name: bookshelf-availability-and-logs
    folder: bookshelf
    interval: 1m
    rules:
      - uid: bookshelf-no-data
        title: Bookshelf no data
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'max(up{job="bookshelf"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: 'Bookshelf is not reporting metrics or is down'
          description: 'The up series for job bookshelf is missing or 0 for 2 minutes.'
          runbook_url: https://example.com/runbooks/bookshelf-no-data
        labels:
          application: bookshelf
          team: bookshelf-sre
          severity: critical

      - uid: bookshelf-error-log-spike
        title: Bookshelf error-log spike
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              editorMode: code
              expr: 'sum(count_over_time({application="bookshelf"} | json | level="ERROR" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        annotations:
          summary: 'Bookshelf logged {{ printf "%.0f" $values.B.Value }} ERROR lines in 5 minutes'
          description: 'More than 20 ERROR log lines in 5 minutes, counted in Loki from the JSON logs of the service.'
          runbook_url: https://example.com/runbooks/bookshelf-error-logs
        labels:
          application: bookshelf
          team: bookshelf-sre
          severity: warning

contactPoints:
  - orgId: 1
    name: bookshelf-webhook
    receivers:
      - uid: bookshelf-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://webhook-receiver:8080/grafana
          httpMethod: POST
          title: '{{ template "bookshelf.title" . }}'
          message: '{{ template "bookshelf.message" . }}'

templates:
  - orgId: 1
    name: bookshelf
    template: |
      {{ define "bookshelf.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "bookshelf.message" -}}
      {{ range .Alerts -}}
      * {{ .Labels.alertname }} ({{ .Labels.severity }}): {{ .Annotations.summary }}
        {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
      {{ end -}}
      {{- end }}

muteTimes:
  - orgId: 1
    name: bookshelf-weekends
    time_intervals:
      - weekdays: ['saturday', 'sunday']
        location: 'UTC'

policies:
  - orgId: 1
    receiver: bookshelf-webhook
    group_by: ['alertname', 'grafana_folder']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: bookshelf-webhook
        object_matchers:
          - ['team', '=', 'bookshelf-sre']
        routes:
          - receiver: bookshelf-webhook
            object_matchers:
              - ['severity', '=', 'critical']
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 1h
          - receiver: bookshelf-webhook
            object_matchers:
              - ['severity', '=', 'warning']
            mute_time_intervals:
              - bookshelf-weekends
            repeat_interval: 12h
