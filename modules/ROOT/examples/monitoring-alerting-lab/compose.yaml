name: monitoring-lab

services:
  # ---- Shared by both profiles -------------------------------------------------------------
  bookshelf:
    image: python:3.13-slim
    profiles: ["grafana", "kibana"]
    command: ["python", "-u", "/app/app.py"]
    environment:
      DEPLOYMENT_ENVIRONMENT: lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4318
      OTEL_LOGS_EXPORTER: otlp
      LOG_FILE: /logs/bookshelf.log
    volumes:
      - ./bookshelf/app.py:/app/app.py:ro
      - logs:/logs
    ports:
      - "8080:8080"

  loadgen:
    image: python:3.13-slim
    profiles: ["grafana", "kibana"]
    command: ["python", "-u", "/app/loadgen.py"]
    environment:
      TARGET: http://bookshelf:8080
      RATE: "10"
    volumes:
      - ./loadgen/loadgen.py:/app/loadgen.py:ro
    ports:
      - "8090:8090"
    depends_on:
      - bookshelf

  webhook-receiver:
    image: python:3.13-slim
    profiles: ["grafana", "kibana"]
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./webhook/receiver.py:/app/receiver.py:ro
    ports:
      - "8081:8080"
    # The webhook connector form of Kibana 9.5 rejects a host name without a dot (except localhost),
    # so the receiver also answers to "webhook.lab".
    networks:
      default:
        aliases:
          - webhook.lab

  # ---- Profile grafana ---------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    profiles: ["grafana"]
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: ["grafana"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - logs:/logs:ro
    ports:
      - "12345:12345"
    networks:
      default:
        aliases: [otel-gateway]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["grafana"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.0
    profiles: ["grafana"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.0
    profiles: ["grafana"]
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana-enterprise:13.3.0
    profiles: ["grafana"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_UNIFIED_ALERTING_STATE_HISTORY_ENABLED: "true"
      GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND: loki
      GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL: http://loki:3100
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards/bookshelf:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # ---- Profile kibana ----------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: ["kibana"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-lab-elastic-password}
    mem_limit: 2g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: ["kibana"]
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-lab-elastic-password}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-lab-kibana-password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -fsS -X POST -u "elastic:$${ELASTIC_PASSWORD}"
        -H "Content-Type: application/json"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    profiles: ["kibana"]
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-lab-kibana-password}
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_KEY:-bookshelf-lab-saved-objects-key-0000}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_KEY:-bookshelf-lab-security-key-00000000}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:-bookshelf-lab-reporting-key-000000}
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  edot-collector:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.6
    profiles: ["kibana"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["--config", "/etc/otel/config.yaml"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-lab-elastic-password}
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    networks:
      default:
        aliases: [otel-gateway]

volumes:
  logs: {}
  grafana-data: {}
  esdata: {}
