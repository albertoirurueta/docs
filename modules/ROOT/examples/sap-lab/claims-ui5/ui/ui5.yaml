specVersion: "4.0"
metadata:
  name: sap.guide.claims
type: application
framework:
  name: OpenUI5
  version: "1.154.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: odata-proxy
      afterMiddleware: compression
      configuration:
        prefix: /odata
        target: http://localhost:4004
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: odata-proxy
middleware:
  path: lib/odata-proxy.js
