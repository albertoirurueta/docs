  <rect x="50" y="70" width="120" height="110" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/><rect x="60" y="80" width="100" height="50" rx="6" fill="#E5E7EB"/><rect x="60" y="140" width="60" height="8" rx="3" fill="#6B7280"/><rect x="60" y="154" width="90" height="20" rx="5" fill="#4F46E5"/>
