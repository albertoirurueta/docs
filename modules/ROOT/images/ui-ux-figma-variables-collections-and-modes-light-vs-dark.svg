  <rect x="430" y="50" width="300" height="200" rx="12" fill="#111827" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="450" y="70" width="120" height="110" rx="8" fill="#1F2937" stroke="#374151"/><rect x="460" y="80" width="100" height="50" rx="6" fill="#374151"/><rect x="460" y="140" width="60" height="8" rx="3" fill="#9CA3AF"/><rect x="460" y="154" width="90" height="20" rx="5" fill="#A5B4FC"/>
