<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-rendering-pipeline-spaces" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From clip space to window coordinates</text>
<rect x="20" y="50" width="220" height="250" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip space</text>
<rect x="270" y="50" width="220" height="250" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">NDC</text>
<rect x="520" y="50" width="220" height="250" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Window</text>
<polygon points="60,250 200,250 230,120 30,120" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="145" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">visible volume</text>
<text x="130" y="160" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">-w &lt;= x, y, z &lt;= w</text>
<polygon points="95,235 165,235 140,175" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(x, y, z, w) from gl_Position</text>
<line x1="240" y1="175" x2="270" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-spaces)"/>
<text x="255" y="168" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">/ w</text>
<rect x="310" y="105" width="140" height="140" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="380" y1="105" x2="380" y2="245" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="310" y1="175" x2="450" y2="175" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="335,225 425,225 380,150" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="310" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">-1</text>
<text x="450" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">+1</text>
<text x="296" y="248" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">-1</text>
<text x="296" y="110" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">+1</text>
<text x="380" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cube -1..1 on every axis</text>
<line x1="490" y1="175" x2="520" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-rendering-pipeline-spaces)"/>
<text x="505" y="168" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">scale</text>
<rect x="565" y="105" width="150" height="140" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<polygon points="590,225 690,225 640,140" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">(x0, y0)</text>
<text x="715" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">x0 + w</text>
<text x="559" y="110" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">y0 + h</text>
<text x="640" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">origin at lower left, pixels</text>
<circle cx="565" cy="245" r="3.5" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="380" y="320" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">x_w = (x_ndc + 1) / 2 * width + x0</text>
<text x="380" y="338" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">y_w = (y_ndc + 1) / 2 * height + y0</text>
<text x="380" y="356" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">z_w = (far - near) / 2 * z_ndc + (far + near) / 2      (gl.depthRange, default 0 and 1)</text>
<text x="380" y="384" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Dropping the canvas into the page flips y: row 0 of the page is the top, window y = 0 is the bottom.</text>
<text x="380" y="404" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">gl.viewport(x0, y0, width, height) sets the rectangle; resizing the canvas does not change it.</text>
</svg>
