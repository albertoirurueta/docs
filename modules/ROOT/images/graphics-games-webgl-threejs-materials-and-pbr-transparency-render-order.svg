<svg viewBox="0 0 760 396" width="760" height="396" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-mat-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="396" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How WebGLRenderer orders opaque, transmissive and transparent objects</text>
<rect x="24" y="54" width="226" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
<circle cx="44" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="44" y="80.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="144" y="81" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Opaque list</text>
<text x="137" y="112" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">grouped by renderOrder and</text>
<text x="137" y="127" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">material, then front to back</text>
<text x="137" y="142" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">depthWrite on, no blending</text>
<line x1="252" y1="129" x2="268" y2="129" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-order)"/>
<rect x="270" y="54" width="226" height="150" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.8"/>
<circle cx="290" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="290" y="80.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="390" y="81" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Transmissive list</text>
<text x="383" y="112" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">scene so far is copied to</text>
<text x="383" y="127" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">a render target, then used</text>
<text x="383" y="142" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">by the glass as refraction</text>
<line x1="498" y1="129" x2="514" y2="129" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-mat-order)"/>
<rect x="516" y="54" width="226" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
<circle cx="536" cy="76" r="11" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="536" y="80.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="636" y="81" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Transparent list</text>
<text x="629" y="112" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">sorted back to front by the</text>
<text x="629" y="127" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">bounding-sphere centre,</text>
<text x="629" y="142" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">blended over what exists</text>
<text x="380" y="232" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">One sort key per object: the same two overlapping quads, drawn in either order</text>
<text x="170" y="256" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">A first, then B: B covers A</text>
<rect x="70" y="266" width="120" height="60" rx="6" fill="#EEF2FF" fill-opacity="0.75" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84" y="286" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">A</text>
<rect x="120" y="284" width="120" height="60" rx="6" fill="#FEF3C7" fill-opacity="0.75" stroke="#B45309" stroke-width="1.5"/>
<text x="134" y="304" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">B</text>
<text x="170" y="356" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the centre of B is nearer the camera</text>
<text x="380" y="382" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">When sorting cannot decide, split the mesh, set renderOrder, or switch to alphaTest or alphaToCoverage</text>
<text x="530" y="256" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">B first, then A: A covers B</text>
<rect x="480" y="284" width="120" height="60" rx="6" fill="#FEF3C7" fill-opacity="0.75" stroke="#B45309" stroke-width="1.5"/>
<text x="494" y="304" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">B</text>
<rect x="430" y="266" width="120" height="60" rx="6" fill="#EEF2FF" fill-opacity="0.75" stroke="#4F46E5" stroke-width="1.5"/>
<text x="444" y="286" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">A</text>
<text x="530" y="356" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the centre of A is nearer: the order flips</text>
</svg>
