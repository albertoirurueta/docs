<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 255" width="1080" height="255" role="img" aria-labelledby="sap-general-guide-secure-a-cap-service-05-read-and-refuse-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-secure-a-cap-service-05-read-and-refuse-title">Terminal with three curl calls after the rules: a read without credentials answers HTTP/1.1 401 Unauthorized and a WWW-Authenticate header for Basic realm Users; a read as bob answers HTTP 200 with the claim Train ticket; a PATCH as bob answers the error Forbidden with code 403 and HTTP 403; callout 11 marks the first call, callout 12 the second and callout 13 the third</title>
<g><rect x="0" y="0" width="1080" height="255" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="223" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i &quot;$BASE&quot; | grep -iE '^(HTTP|www-authenticate)'</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP/1.1 401 Unauthorized</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">WWW-Authenticate: Basic realm=&quot;Users&quot;</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' -u bob: &quot;$BASE?\$top=1&amp;\$select=title&quot;</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims&quot;,&quot;value&quot;:[{&quot;title&quot;:&quot;Train ticket&quot;,&quot;ID&quot;:&quot;11111111-1111-1111-1111-111111111111&quot;}]}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' -u bob: -X PATCH -H 'Content-Type: application/json' -d '{&quot;amount&quot;:50}' &quot;$CLAIM&quot;</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;error&quot;:{&quot;message&quot;:&quot;Forbidden&quot;,&quot;code&quot;:&quot;403&quot;,&quot;@Common.numericSeverity&quot;:4}}</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 403</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">11</text></g>
<rect x="5" y="109" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="109" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="114" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">12</text></g>
<rect x="5" y="172" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="172" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="177" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">13</text></g></g>
</svg>
