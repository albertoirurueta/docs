<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Setting up single sign-on for the Bookshelf organization</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <!-- panel 1: settings tab -->
  <rect x="28" y="92" width="108" height="190" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="34" y="100" width="40" height="8" rx="2" fill="#9CA3AF"/><rect x="34" y="116" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="34" y="132" width="52" height="14" rx="3" fill="#FEF3C7" stroke="#B45309"/><rect x="34" y="156" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="84" y="100" width="46" height="60" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <!-- panel 2: domain + TXT -->
  <rect x="180" y="92" width="108" height="190" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="190" y="106" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="234" y="121" font-size="11" fill="#374151" text-anchor="middle">bookshelf.example</text>
  <rect x="190" y="140" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="234" y="156" font-size="11" fill="#374151" text-anchor="middle">TXT record</text><text x="234" y="170" font-size="11" fill="#374151" text-anchor="middle">token to copy</text>
  <rect x="200" y="196" width="68" height="20" rx="6" fill="#4F46E5"/>
  <text x="234" y="240" font-size="11" fill="#374151" text-anchor="middle">Add at DNS host</text>
  <!-- panel 3: IdP metadata -->
  <rect x="332" y="92" width="108" height="190" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="342" y="104" width="88" height="20" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="342" y="132" width="88" height="20" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="342" y="160" width="88" height="20" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <g font-size="10" fill="#374151"><text x="348" y="118">SSO URL</text><text x="348" y="146">Entity ID</text><text x="348" y="174">X.509 cert</text></g>
  <rect x="352" y="198" width="68" height="20" rx="6" fill="#4F46E5"/>
  <text x="386" y="240" font-size="11" fill="#374151" text-anchor="middle">Save metadata</text>
  <!-- panel 4: test + login option -->
  <rect x="484" y="92" width="108" height="190" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="494" y="104" width="88" height="22" rx="6" fill="#4F46E5"/><text x="538" y="119" font-size="11" fill="#FFFFFF" text-anchor="middle">Test SSO</text>
  <rect x="494" y="140" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="155" font-size="10" fill="#374151" text-anchor="middle">Optional for all</text>
  <rect x="494" y="170" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="185" font-size="10" fill="#374151" text-anchor="middle">Required: team</text>
  <rect x="494" y="200" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="215" font-size="10" fill="#374151" text-anchor="middle">Required: everyone</text>
  <!-- panel 5: result -->
  <rect x="636" y="92" width="96" height="190" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="646" y="108" width="76" height="22" rx="3" fill="#FFFFFF" stroke="#B45309"/><text x="684" y="123" font-size="10" fill="#92400E" text-anchor="middle">Log in with SSO</text>
  <path d="M668,160 L680,174 L706,146" stroke="#B45309" stroke-width="4" fill="none"/>
  <text x="684" y="212" font-size="11" fill="#92400E" text-anchor="middle">Finish setup</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="82" y="322">Open Settings,</text><text x="82" y="338">SSO and provisioning</text>
    <text x="234" y="322">Add and verify</text><text x="234" y="338">the login domain</text>
    <text x="386" y="322">Add Canva to the IdP,</text><text x="386" y="338">paste its metadata</text>
    <text x="538" y="322">Test, then choose</text><text x="538" y="338">the login rule</text>
    <text x="684" y="322">Users sign in</text><text x="684" y="338">through the IdP</text>
  </g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
