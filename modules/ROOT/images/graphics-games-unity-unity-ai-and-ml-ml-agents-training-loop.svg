<text x="101.0" y="104.0" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">CollectObservations</text>
<text x="101.0" y="118.0" text-anchor="middle" font-size="10" fill="#3730A3">AddObservation(...)</text>
<rect x="190" y="86" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="255.0" y="104.0" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">OnActionReceived</text>
<text x="255.0" y="118.0" text-anchor="middle" font-size="10" fill="#3730A3">forces, SetReward</text>
<rect x="36" y="160" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="101.0" y="178.0" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">Behavior Parameters</text>
<text x="101.0" y="192.0" text-anchor="middle" font-size="10" fill="#374151">name, spaces, actions</text>
<rect x="190" y="160" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="255.0" y="178.0" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">OnEpisodeBegin</text>
<text x="255.0" y="192.0" text-anchor="middle" font-size="10" fill="#3730A3">reset the scene</text>
<line x1="166" y1="108" x2="190" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<line x1="255" y1="130" x2="255" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<line x1="190" y1="182" x2="166" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<text x="175" y="230" text-anchor="middle" font-size="10" fill="#374151">Decision Requester asks every N steps</text>
<rect x="430" y="50" width="310" height="200" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="585" y="72" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Python: mlagents-learn</text>
<rect x="446" y="86" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="511.0" y="104.0" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">Trainer</text>
<text x="511.0" y="118.0" text-anchor="middle" font-size="10" fill="#3730A3">PPO, SAC or POCA</text>
<rect x="600" y="86" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="104.0" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">config.yaml</text>
<text x="665.0" y="118.0" text-anchor="middle" font-size="10" fill="#374151">hyperparameters</text>
<rect x="446" y="160" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="511.0" y="178.0" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">Policy network</text>
<text x="511.0" y="192.0" text-anchor="middle" font-size="10" fill="#3730A3">PyTorch</text>
<rect x="600" y="160" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="178.0" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">TensorBoard</text>
<text x="665.0" y="192.0" text-anchor="middle" font-size="10" fill="#374151">results/run-id</text>
<line x1="600" y1="108" x2="576" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<line x1="511" y1="130" x2="511" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<line x1="600" y1="182" x2="576" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<line x1="330" y1="100" x2="430" y2="100" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<text x="380" y="90" text-anchor="middle" font-size="10" fill="#3730A3">observations</text>
<text x="380" y="116" text-anchor="middle" font-size="10" fill="#3730A3">rewards</text>
<line x1="430" y1="150" x2="330" y2="150" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<text x="380" y="142" text-anchor="middle" font-size="10" fill="#3730A3">actions</text>
<rect x="430" y="280" width="310" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="585.0" y="304.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Result: RollerBall.onnx</text>
<text x="585.0" y="319.0" text-anchor="middle" font-size="11" fill="#1F2937">Behavior Type: Inference Only, run by Sentis</text>
<line x1="585" y1="250" x2="585" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-g)"/>
<rect x="20" y="280" width="360" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="304.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Heuristic Only: you drive the Agent from the keyboard</text>
<text x="200.0" y="319.0" text-anchor="middle" font-size="11" fill="#374151">Use it to test the scene before any training run.</text>
<text x="380" y="364" text-anchor="middle" font-size="11" fill="#374151">Episode = one try that ends on success, failure or time out. Reward = the only teaching signal.</text>
