<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-us-ai-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">ML-Agents: the loop between the Agent in Unity and the Python trainer</text>
<rect x="20" y="50" width="310" height="200" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="175" y="72" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Unity: environment and Agent</text>
