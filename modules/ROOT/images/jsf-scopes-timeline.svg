  <text x="734" y="81" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Request 6</text>
  <text x="734" y="95" font-size="10" fill="#444444" text-anchor="middle">tab 2</text>
  <text x="734" y="108" font-size="10" fill="#444444" text-anchor="middle">GET</text>
