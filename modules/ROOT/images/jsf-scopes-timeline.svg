  <rect x="612" y="66" width="68" height="50" rx="5" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="646" y="81" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Request 5</text>
  <text x="646" y="95" font-size="10" fill="#444444" text-anchor="middle">tab 1</text>
