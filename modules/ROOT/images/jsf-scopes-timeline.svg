<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lifetime of each Jakarta Faces and CDI scope along one session</title>
  <desc id="d">A timeline of eight requests in one HTTP session, six from the first browser tab and two from a second tab. The application scope lasts the whole deployment. The session scope lasts from the first request to the end of the session. A client window scoped bean lives as long as its browser tab: two bars, one per tab. A conversation is transient for each request except between begin and end, when it is long-running. A flow scoped bean lives from entering the flow to its return node. A view scoped bean lives across the postbacks of one view and is destroyed when navigation produces a new view; views left by a redirect or a new GET stay in memory until evicted or until the session ends. A request scoped bean lives for a single request. A dependent object lives and dies with the bean it is injected into.</desc>
  <defs>
    <pattern id="sc-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#a12622" stroke-width="1.2" opacity="0.55"/></pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How long each scope lives, along one HTTP session</text>
  <text x="500" y="48" font-size="12" fill="#666666" text-anchor="middle">Eight requests: the first browser tab makes six of them, a second tab makes two. Time runs left to right.</text>
