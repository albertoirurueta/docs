<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Hands-on lab topology: the load generator drives the Bookshelf stand-in, which feeds Alloy, Prometheus, Loki, Tempo and Grafana in the grafana profile, or the EDOT Collector, Elasticsearch and Kibana in the kibana profile; both alerting tools notify the webhook receiver</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One Compose file, two profiles</text>
<text x="480" y="44" font-size="10.5" fill="#555555" text-anchor="middle">Start one profile at a time: docker compose --profile grafana up -d, or docker compose --profile kibana up -d</text>

<rect x="15" y="70" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="90" y="96" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">loadgen</text>
<text x="90" y="113" font-size="10" fill="#555555" text-anchor="middle">modes on port 8090</text>

<rect x="15" y="250" width="150" height="70" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="90" y="276" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf</text>
<text x="90" y="293" font-size="10" fill="#555555" text-anchor="middle">/actuator/prometheus</text>
<text x="90" y="307" font-size="10" fill="#555555" text-anchor="middle">OTLP traces and logs, JSON log file</text>
<line x1="90" y1="130" x2="90" y2="248" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="98" y="190" font-size="10" fill="#555555">HTTP traffic</text>

<rect x="215" y="62" width="540" height="228" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
<text x="235" y="82" font-size="12" font-weight="bold" fill="#1b5e20">profile grafana</text>
<rect x="235" y="100" width="110" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
<text x="290" y="122" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">alloy</text>
<text x="290" y="138" font-size="10" fill="#555555" text-anchor="middle">otel-gateway:4318</text>
<rect x="395" y="100" width="110" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
<text x="450" y="122" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">tempo</text>
<text x="450" y="138" font-size="10" fill="#555555" text-anchor="middle">traces, span metrics</text>
<rect x="395" y="180" width="110" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
<text x="450" y="202" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">loki</text>
<text x="450" y="218" font-size="10" fill="#555555" text-anchor="middle">JSON logs</text>
<rect x="235" y="230" width="110" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
<text x="290" y="252" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">prometheus</text>
<text x="290" y="268" font-size="10" fill="#555555" text-anchor="middle">scrape, remote write</text>
<rect x="595" y="150" width="140" height="70" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
<text x="665" y="176" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">grafana 13.3</text>
<text x="665" y="192" font-size="10" fill="#555555" text-anchor="middle">dashboard and alerts</text>
<text x="665" y="206" font-size="10" fill="#555555" text-anchor="middle">port 3000</text>
<line x1="345" y1="126" x2="393" y2="126" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="290" y1="228" x2="290" y2="154" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="505" y1="126" x2="593" y2="165" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="505" y1="206" x2="593" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="345" y1="256" x2="593" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="240" y="170" font-size="9" fill="#555555">file tail to loki</text>
<line x1="290" y1="152" x2="290" y2="170" stroke="#37474f" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="290" y1="170" x2="393" y2="200" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="780" y="62" width="165" height="228" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="862" y="82" font-size="12" font-weight="bold" fill="#8d6e00" text-anchor="middle">both profiles</text>
<rect x="795" y="150" width="135" height="70" rx="8" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
<text x="862" y="176" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">webhook-receiver</text>
<text x="862" y="192" font-size="10" fill="#555555" text-anchor="middle">/grafana and /kibana</text>
<text x="862" y="206" font-size="10" fill="#555555" text-anchor="middle">host port 8081</text>
<line x1="735" y1="185" x2="793" y2="185" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="165" y1="270" x2="233" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="165" y1="285" x2="233" y2="256" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="130" y="236" font-size="9" fill="#555555" text-anchor="end">OTLP</text>
<text x="190" y="290" font-size="9" fill="#555555">scrape</text>

<rect x="215" y="320" width="730" height="200" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="235" y="340" font-size="12" font-weight="bold" fill="#0d47a1">profile kibana</text>
<rect x="235" y="370" width="130" height="60" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
<text x="300" y="394" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">edot-collector</text>
<text x="300" y="411" font-size="10" fill="#555555" text-anchor="middle">otel-gateway:4318</text>
<rect x="430" y="370" width="150" height="60" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
<text x="505" y="394" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">elasticsearch 9.5.6</text>
<text x="505" y="411" font-size="10" fill="#555555" text-anchor="middle">data streams, port 9200</text>
<rect x="645" y="370" width="130" height="60" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
<text x="710" y="394" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">kibana 9.5.6</text>
<text x="710" y="411" font-size="10" fill="#555555" text-anchor="middle">dashboard, rules, port 5601</text>
<line x1="365" y1="400" x2="428" y2="400" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="645" y1="400" x2="582" y2="400" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="165" y1="305" x2="233" y2="385" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 775 400 L 862 400 L 862 222" fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="480" y="470" font-size="10.5" fill="#555555" text-anchor="middle">Each profile also starts bookshelf, loadgen and webhook-receiver. The grafana profile adds postgres.</text>
<text x="480" y="486" font-size="10.5" fill="#555555" text-anchor="middle">The alias otel-gateway points at Alloy in one profile and at the EDOT Collector in the other.</text>
</svg>
