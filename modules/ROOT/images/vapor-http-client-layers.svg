<svg viewBox="0 0 940 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="430" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From a route handler to the upstream service</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">one pooled AsyncHTTPClient per application; req.client only adds the request's event loop, logger and allocator</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="70" width="190" height="130" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="115" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Route handler</text>
  <text x="115" y="116" font-size="11" fill="#222222" text-anchor="middle">try await req.client.get(url)</text>
  <text x="115" y="134" font-size="11" fill="#222222" text-anchor="middle">headers, beforeSend,</text>
  <text x="115" y="150" font-size="11" fill="#222222" text-anchor="middle">ClientRequest.timeout</text>
  <text x="115" y="176" font-size="11" fill="#222222" text-anchor="middle">decode ClientResponse</text>

  <rect x="250" y="70" width="190" height="130" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="345" y="94" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Client protocol</text>
  <text x="345" y="116" font-size="11" fill="#222222" text-anchor="middle">app.client, req.client</text>
  <text x="345" y="134" font-size="11" fill="#222222" text-anchor="middle">chosen by app.clients.use(...)</text>
  <text x="345" y="152" font-size="11" fill="#222222" text-anchor="middle">default provider: .http</text>
  <text x="345" y="176" font-size="11" fill="#222222" text-anchor="middle">swap in a stub for tests</text>

  <rect x="480" y="70" width="210" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="585" y="94" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">AsyncHTTPClient</text>
  <text x="585" y="116" font-size="11" fill="#222222" text-anchor="middle">app.http.client.shared</text>
  <text x="585" y="134" font-size="11" fill="#222222" text-anchor="middle">configuration: timeouts, redirects,</text>
  <text x="585" y="150" font-size="11" fill="#222222" text-anchor="middle">pool, proxy, TLS, HTTP version</text>
  <text x="585" y="176" font-size="11" fill="#222222" text-anchor="middle">shut down with the application</text>

  <rect x="730" y="70" width="190" height="130" rx="8" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="825" y="94" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Upstream service</text>
  <text x="825" y="116" font-size="11" fill="#222222" text-anchor="middle">connection from the pool</text>
  <text x="825" y="134" font-size="11" fill="#222222" text-anchor="middle">HTTP/1.1 or HTTP/2</text>
  <text x="825" y="176" font-size="11" fill="#222222" text-anchor="middle">any status is a response</text>

  <line x1="210" y1="120" x2="248" y2="120" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="120" x2="478" y2="120" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="690" y1="120" x2="728" y2="120" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="728" y1="160" x2="692" y2="160" stroke="#444444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="478" y1="160" x2="442" y2="160" stroke="#444444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="248" y1="160" x2="212" y2="160" stroke="#444444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <rect x="20" y="230" width="900" height="170" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1"/>
  <text x="36" y="254" font-size="13" font-weight="bold" fill="#222222">Three different failure shapes</text>
  <text x="36" y="278" font-size="12" fill="#222222">1. A response arrived, whatever its status (404, 500): ClientResponse is returned and nothing is thrown. Check response.status.</text>
  <text x="36" y="302" font-size="12" fill="#222222">2. No response in time: HTTPClientError.deadlineExceeded (ClientRequest.timeout), .readTimeout or .connectTimeout (configuration).</text>
  <text x="36" y="326" font-size="12" fill="#222222">3. No response at all: connection refused, reset, DNS or TLS failure, thrown as a SwiftNIO or NIOSSL error, not as HTTPClientError.</text>
  <text x="36" y="356" font-size="12" fill="#6a3d9a">Map 2 to 504 Gateway Timeout and 3 to 502 Bad Gateway; map an unwanted status from 1 to 502 or to the status your API promises.</text>
  <text x="36" y="380" font-size="12" fill="#6a3d9a">The body is buffered completely before the handler continues; use AsyncHTTPClient directly to stream a large one.</text>
</svg>
