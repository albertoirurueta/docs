<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Organization, teams and groups for the Bookshelf launch</text>
  <rect x="40" y="46" width="680" height="300" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="56" y="68" font-size="13" font-weight="bold" fill="#4F46E5">Organization: Bookshelf Co. (Enterprise)</text>
  <text x="704" y="68" font-size="12" fill="#374151" text-anchor="end">Roles here: organization admin, organization brand designer</text>
  <rect x="60" y="84" width="310" height="244" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="76" y="106" font-size="13" font-weight="bold" fill="#1F2937">Team: Marketing</text>
  <text x="76" y="124" font-size="12" fill="#374151">Roles: team owner, team admin, brand designer, member</text>
  <rect x="76" y="140" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="141" y="164" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Group</text>
  <text x="141" y="182" font-size="12" fill="#374151" text-anchor="middle">Social creators</text>
  <rect x="224" y="140" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="289" y="164" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Group</text>
  <text x="289" y="182" font-size="12" fill="#374151" text-anchor="middle">Approvers</text>
  <rect x="76" y="220" width="278" height="44" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="5 3"/>
  <text x="215" y="240" font-size="12" fill="#374151" text-anchor="middle">Auto-synced groups: one per role</text>
  <text x="215" y="256" font-size="11" fill="#6B7280" text-anchor="middle">managed by the product, cannot be edited</text>
  <rect x="76" y="276" width="278" height="38" rx="8" fill="#FEF3C7" stroke="#B45309"/>
  <text x="215" y="300" font-size="12" fill="#92400E" text-anchor="middle">Shared folder: Book of the week</text>
  <rect x="390" y="84" width="310" height="244" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="406" y="106" font-size="13" font-weight="bold" fill="#1F2937">Team: Editorial</text>
  <text x="406" y="124" font-size="12" fill="#374151">Its own members, brand kit and settings</text>
  <rect x="406" y="140" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="471" y="164" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Group</text>
  <text x="471" y="182" font-size="12" fill="#374151" text-anchor="middle">Reviewers</text>
  <rect x="554" y="140" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="619" y="164" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Group</text>
  <text x="619" y="182" font-size="12" fill="#374151" text-anchor="middle">Translators</text>
  <rect x="406" y="220" width="278" height="94" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="545" y="246" font-size="12" fill="#374151" text-anchor="middle">Collaboration between different teams is limited:</text>
  <text x="545" y="264" font-size="12" fill="#374151" text-anchor="middle">use groups inside one team for everyday work,</text>
  <text x="545" y="282" font-size="12" fill="#374151" text-anchor="middle">and a second team only for a separate</text>
  <text x="545" y="300" font-size="12" fill="#374151" text-anchor="middle">department, brand or region</text>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="50" cy="106" r="11" fill="#4F46E5"/><text x="50" y="110" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="66" cy="152" r="11" fill="#B45309"/><text x="66" y="156" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <g font-size="12" fill="#374151">
    <text x="60" y="372">1 Organization: the top layer, with security settings and organization roles (multi-team plans only)</text>
    <text x="60" y="390">2 Team: a workspace with its own members, roles and brand kit; one team on Business, several on Enterprise</text>
    <text x="60" y="408">3 Group: a set of people inside one team, used for sharing, permissions and approvals</text>
  </g>
  <text x="380" y="430" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic workspace structure, not a screenshot of any product.</text>
</svg>
