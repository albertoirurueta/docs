<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-first-triangle-webgl2-call-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What runs once and what runs every frame</text>
<rect x="20" y="48" width="350" height="320" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="72" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Once, at start-up</text>
<rect x="34" y="86" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="104.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">getContext('webgl2')</text>
<rect x="34" y="124" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="142.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">createShader + shaderSource + compileShader</text>
<rect x="34" y="162" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="180.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">createProgram + attachShader + linkProgram</text>
<rect x="34" y="200" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="218.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">createBuffer + bindBuffer + bufferData</text>
<rect x="34" y="238" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="256.9" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">createVertexArray + bindVertexArray</text>
<rect x="34" y="276" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="294.9" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">enableVertexAttribArray + vertexAttribPointer</text>
<rect x="34" y="314" width="322" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="332.9" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">getUniformLocation (if any)</text>
<rect x="390" y="48" width="350" height="320" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
<text x="565" y="72" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Every frame, in the loop</text>
<rect x="404" y="86" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="104.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">resize canvas if clientWidth changed</text>
<rect x="404" y="124" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="142.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">viewport(0, 0, width, height)</text>
<rect x="404" y="162" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="180.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">clearColor + clear(COLOR_BUFFER_BIT)</text>
<rect x="404" y="200" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="218.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">useProgram(program)</text>
<rect x="404" y="238" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="256.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">bindVertexArray(vao)</text>
<rect x="404" y="276" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="294.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">drawArrays(TRIANGLES, 0, 3)</text>
<rect x="404" y="314" width="322" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="332.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">requestAnimationFrame(frame)</text>
<text x="380" y="392" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The browser presents the canvas after the frame callback returns; there is no swapBuffers call.</text>
</svg>
