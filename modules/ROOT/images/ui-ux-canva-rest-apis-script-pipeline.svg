<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Book of the week script, step by step</text>
  <g fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5">
    <rect x="20" y="60" width="150" height="70" rx="8"/><rect x="305" y="60" width="150" height="70" rx="8"/><rect x="590" y="60" width="150" height="70" rx="8"/>
    <rect x="20" y="200" width="150" height="70" rx="8"/><rect x="305" y="200" width="150" height="70" rx="8"/><rect x="590" y="200" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="95" y="86">1 Token</text><text x="380" y="86">2 Dataset</text><text x="665" y="86">3 Upload cover</text>
    <text x="95" y="226">4 Autofill job</text><text x="380" y="226">5 Export job</text><text x="665" y="226">6 Download PNG</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="95" y="106">POST oauth/token</text><text x="95" y="120">from the environment</text>
    <text x="380" y="106">GET brand-templates/</text><text x="380" y="120">{id}/dataset</text>
    <text x="665" y="106">POST asset-uploads,</text><text x="665" y="120">poll to get asset id</text>
    <text x="95" y="246">POST autofills,</text><text x="95" y="260">poll for design id</text>
    <text x="380" y="246">POST exports (png),</text><text x="380" y="260">poll for urls</text>
    <text x="665" y="246">fetch each url within</text><text x="665" y="260">24 hours, save files</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <path d="M171,95 L304,95" marker-end="url(#ah)"/><path d="M456,95 L589,95" marker-end="url(#ah)"/>
    <path d="M665,131 C665,165 95,160 95,198" marker-end="url(#ah)"/>
    <path d="M171,235 L304,235" marker-end="url(#ah)"/><path d="M456,235 L589,235" marker-end="url(#ah)"/>
  </g>
  <rect x="20" y="302" width="720" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="380" y="321" font-size="12" fill="#374151" text-anchor="middle">Repeat steps 3 to 6 for each book in the list, pacing requests to stay under the rate limits.</text>
  <text x="380" y="362" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of the script flow, not a screenshot of any product.</text>
</svg>
