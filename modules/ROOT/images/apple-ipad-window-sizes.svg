<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One FieldNotes window, three sizes on iPad</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">The same ContentView (NavigationSplitView) adapts to the width of its window, not to the device</text>

  <!-- ===================== 1. Full screen, regular ===================== -->
  <text x="130" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Full screen</text>
  <text x="130" y="93" font-size="12" fill="#1c4b73" text-anchor="middle">horizontalSizeClass: .regular</text>

  <!-- iPad body -->
  <rect x="18" y="106" width="224" height="170" rx="12" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <rect x="26" y="114" width="208" height="154" rx="6" fill="#ffffff" stroke="#cccccc"/>
  <!-- sidebar -->
  <rect x="26" y="114" width="52" height="154" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.1"/>
  <text x="52" y="130" font-size="10" fill="#1c4b73" text-anchor="middle">Notebooks</text>
  <rect x="32" y="138" width="40" height="10" rx="2" fill="#ffffff" stroke="#b9cde0"/>
  <rect x="32" y="152" width="40" height="10" rx="2" fill="#ffffff" stroke="#b9cde0"/>
  <rect x="32" y="166" width="40" height="10" rx="2" fill="#ffffff" stroke="#b9cde0"/>
  <!-- note list -->
  <rect x="80" y="114" width="64" height="154" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="112" y="130" font-size="10" fill="#8a5a1c" text-anchor="middle">NoteList</text>
  <rect x="86" y="138" width="52" height="14" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="86" y="156" width="52" height="14" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="86" y="174" width="52" height="14" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <!-- detail -->
  <rect x="146" y="114" width="88" height="154" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.1"/>
  <text x="190" y="130" font-size="10" fill="#2d6a34" text-anchor="middle">NoteDetail</text>
  <line x1="154" y1="142" x2="226" y2="142" stroke="#9cc3a0" stroke-width="2"/>
  <line x1="154" y1="152" x2="220" y2="152" stroke="#9cc3a0" stroke-width="2"/>
  <line x1="154" y1="162" x2="224" y2="162" stroke="#9cc3a0" stroke-width="2"/>
  <line x1="154" y1="172" x2="210" y2="172" stroke="#9cc3a0" stroke-width="2"/>

  <text x="130" y="300" font-size="12" fill="#333333" text-anchor="middle">All three columns visible</text>
  <text x="130" y="317" font-size="12" fill="#333333" text-anchor="middle">Table and inspector fit beside</text>
  <text x="130" y="334" font-size="12" fill="#333333" text-anchor="middle">the note</text>

  <line x1="258" y1="70" x2="258" y2="350" stroke="#dddddd" stroke-width="1"/>

  <!-- ===================== 2. Resized window, regular ===================== -->
  <text x="380" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Resized window</text>
  <text x="380" y="93" font-size="12" fill="#1c4b73" text-anchor="middle">horizontalSizeClass: .regular</text>

  <!-- iPad body with wallpaper -->
  <rect x="268" y="106" width="224" height="170" rx="12" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <rect x="276" y="114" width="208" height="154" rx="6" fill="#dfe6ee" stroke="#cccccc"/>
  <!-- floating window -->
  <rect x="292" y="124" width="156" height="128" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <!-- window controls -->
  <circle cx="302" cy="133" r="3.2" fill="#e0443e"/>
  <circle cx="312" cy="133" r="3.2" fill="#dea123"/>
  <circle cx="322" cy="133" r="3.2" fill="#1aab29"/>
  <!-- note list -->
  <rect x="292" y="140" width="58" height="112" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="321" y="154" font-size="10" fill="#8a5a1c" text-anchor="middle">NoteList</text>
  <rect x="298" y="160" width="46" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="298" y="177" width="46" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="298" y="194" width="46" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <!-- detail -->
  <rect x="352" y="140" width="96" height="112" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.1"/>
  <text x="400" y="154" font-size="10" fill="#2d6a34" text-anchor="middle">NoteDetail</text>
  <line x1="360" y1="166" x2="440" y2="166" stroke="#9cc3a0" stroke-width="2"/>
  <line x1="360" y1="176" x2="432" y2="176" stroke="#9cc3a0" stroke-width="2"/>
  <line x1="360" y1="186" x2="438" y2="186" stroke="#9cc3a0" stroke-width="2"/>
  <!-- resize handle -->
  <path d="M440,248 L446,242 M436,248 L446,238" stroke="#555555" stroke-width="1.3"/>
  <text x="466" y="262" font-size="9.5" fill="#555555" text-anchor="middle">drag</text>

  <text x="380" y="300" font-size="12" fill="#333333" text-anchor="middle">Sidebar hides; toolbar button</text>
  <text x="380" y="317" font-size="12" fill="#333333" text-anchor="middle">brings it back. Window controls</text>
  <text x="380" y="334" font-size="12" fill="#333333" text-anchor="middle">sit at the leading toolbar edge</text>

  <line x1="508" y1="70" x2="508" y2="350" stroke="#dddddd" stroke-width="1"/>

  <!-- ===================== 3. Narrow window, compact ===================== -->
  <text x="630" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Narrow window</text>
  <text x="630" y="93" font-size="12" fill="#8a1c1c" text-anchor="middle">horizontalSizeClass: .compact</text>

  <rect x="518" y="106" width="224" height="170" rx="12" fill="#f4f4f4" stroke="#999999" stroke-width="1.4"/>
  <rect x="526" y="114" width="208" height="154" rx="6" fill="#dfe6ee" stroke="#cccccc"/>
  <!-- narrow floating window -->
  <rect x="592" y="120" width="76" height="142" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <circle cx="601" cy="129" r="3" fill="#e0443e"/>
  <circle cx="610" cy="129" r="3" fill="#dea123"/>
  <circle cx="619" cy="129" r="3" fill="#1aab29"/>
  <rect x="592" y="136" width="76" height="108" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.1"/>
  <text x="630" y="150" font-size="10" fill="#8a5a1c" text-anchor="middle">NoteList</text>
  <rect x="598" y="156" width="64" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="598" y="173" width="64" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <rect x="598" y="190" width="64" height="13" rx="2" fill="#ffffff" stroke="#d9c3a3"/>
  <!-- tab bar -->
  <rect x="600" y="246" width="60" height="12" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1"/>
  <circle cx="612" cy="252" r="2" fill="#1c4b73"/>
  <circle cx="624" cy="252" r="2" fill="#1c4b73"/>
  <circle cx="636" cy="252" r="2" fill="#1c4b73"/>
  <circle cx="648" cy="252" r="2" fill="#1c4b73"/>

  <text x="630" y="300" font-size="12" fill="#333333" text-anchor="middle">Columns collapse into one</text>
  <text x="630" y="317" font-size="12" fill="#333333" text-anchor="middle">stack; the tab bar returns;</text>
  <text x="630" y="334" font-size="12" fill="#333333" text-anchor="middle">Table shows one column</text>

  <!-- ===================== bottom band: what the code sees ===================== -->
  <rect x="18" y="362" width="724" height="92" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="380" y="384" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">What FieldNotes' code reacts to</text>
  <text x="34" y="406" font-size="12" fill="#333333">SwiftUI: horizontalSizeClass and the proposed size; ContentView never asks which iPad it runs on.</text>
  <text x="34" y="424" font-size="12" fill="#333333">UIKit: windowScene(_:didUpdateEffectiveGeometry:) and isInteractivelyResizing while a person drags.</text>
  <text x="34" y="442" font-size="12" fill="#333333">Minimum size: windowResizability(.contentMinSize) in SwiftUI, UISceneSizeRestrictions in UIKit.</text>
</svg>
