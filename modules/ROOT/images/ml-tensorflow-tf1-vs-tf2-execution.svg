<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">TensorFlow 1 graph and session versus TensorFlow 2 eager and tf.function</title>
  <desc id="d">Two rows of boxes. The TensorFlow 1 row builds a graph with placeholders, then runs it through a session with a feed dictionary. The TensorFlow 2 row calls Python functions eagerly with tensors and optionally wraps them in tf.function to trace a graph.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Two execution models</text>
  <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#BE123C">TensorFlow 1 (removed idiom)</text>
  <rect x="24" y="82" width="190" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="119" y="106" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">tf.placeholder</text>
  <text x="119" y="124" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">build the graph</text>
  <rect x="265" y="82" width="190" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="360" y="106" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">tf.Session()</text>
  <text x="360" y="124" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">global initializer</text>
  <rect x="506" y="82" width="190" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="601" y="106" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">sess.run(fetches,</text>
  <text x="601" y="124" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">feed_dict=...)</text>
  <line x1="214" y1="110" x2="263" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="455" y1="110" x2="504" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="24" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F766E">TensorFlow 2 (current)</text>
  <rect x="24" y="192" width="190" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="119" y="216" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">tf.constant / arrays</text>
  <text x="119" y="234" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">ordinary Python</text>
  <rect x="265" y="192" width="190" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="360" y="216" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">f(x) runs eagerly</text>
  <text x="360" y="234" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">values at once</text>
  <rect x="506" y="192" width="190" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="601" y="216" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">@tf.function</text>
  <text x="601" y="234" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">traced graph</text>
  <line x1="214" y1="220" x2="263" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="455" y1="220" x2="504" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="360" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Dashed: optional step added for speed and export</text>
</svg>
