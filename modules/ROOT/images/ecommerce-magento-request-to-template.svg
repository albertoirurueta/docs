<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From a storefront URL to a rendered template</title>
  <desc id="d">The request /roast/ passes the front controller, which asks the routers in sort order: robots and security.txt at 10, url rewrite at 20, the custom router at 25, the standard router at 30, cms at 60 and the default router at 100. The standard router matches the front name roast to route id pcroast and returns the action class Controller Index Index. The action returns a page result. The page result merges the layout handles default, pcroast_index_index and the page layout 1column from the module, theme and parent theme files. The layout builds blocks, which take a view model argument and render a phtml template that escapes every value.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">GET /roast/ : router, action, layout handles, blocks, template</text>

  <!-- request -->
  <rect x="30" y="56" width="170" height="64" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">HTTP request</text>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">GET /roast/</text>
  <line x1="200" y1="88" x2="236" y2="88" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- routers -->
  <rect x="240" y="56" width="330" height="190" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="405" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">FrontController: routers by sortOrder</text>
  <text x="256" y="100" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">10  robots, securitytxt</text>
  <text x="256" y="120" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">20  urlrewrite (url_rewrite table)</text>
  <text x="256" y="140" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">25  custom: /coffee-club</text>
  <rect x="250" y="148" width="310" height="24" rx="4" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="256" y="165" font-size="12" font-weight="bold" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">30  standard: frontName roast</text>
  <text x="256" y="190" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">60  cms</text>
  <text x="256" y="210" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">100 default (no-route handler)</text>
  <text x="256" y="234" font-size="11" fill="#f2f5f8">first router that returns an action wins</text>
  <line x1="570" y1="160" x2="606" y2="160" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- action -->
  <rect x="610" y="56" width="320" height="190" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="770" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">routes.xml and the action class</text>
  <text x="626" y="102" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">frontName roast -> route id pcroast</text>
  <text x="626" y="122" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">module PocketCoffee_RoastPage</text>
  <text x="626" y="146" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Controller/Index/Index.php</text>
  <text x="626" y="166" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">implements HttpGetActionInterface</text>
  <text x="626" y="190" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">execute(): Page result</text>
  <text x="626" y="218" font-size="11" fill="#f2f5f8">other verbs get 404 or the CSRF check</text>
  <line x1="770" y1="248" x2="770" y2="284" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- layout -->
  <rect x="470" y="288" width="460" height="132" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="700" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">Layout handles merged for the page</text>
  <text x="486" y="334" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">default.xml          (every page)</text>
  <text x="486" y="354" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">pcroast_index_index.xml  (route id, controller, action)</text>
  <text x="486" y="374" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">page layout 1column  (empty -> 1column)</text>
  <text x="486" y="400" font-size="11" fill="#f2f5f8">files come from every module, then the theme and its parents</text>
  <line x1="470" y1="354" x2="436" y2="354" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- blocks -->
  <rect x="30" y="288" width="400" height="132" rx="8" fill="#6b5b95" stroke="#f2f5f8"/>
  <text x="230" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">Blocks in containers</text>
  <text x="46" y="334" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">container  content</text>
  <text x="62" y="354" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">block RoastSummary  (class + template)</text>
  <text x="78" y="374" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">argument view_model = RoastList</text>
  <text x="78" y="394" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">child block subscribe (form + formkey)</text>
  <line x1="230" y1="422" x2="230" y2="458" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- template -->
  <rect x="30" y="462" width="900" height="100" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="480" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">.phtml template: print, never compute</text>
  <text x="46" y="508" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">$viewModel = $block->getViewModel();</text>
  <text x="46" y="528" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">&lt;?= $escaper->escapeHtml($product->getName()) ?></text>
  <text x="46" y="548" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">&lt;a href="&lt;?= $escaper->escapeUrl($url) ?>"></text>
  <text x="620" y="508" font-size="12" fill="#f2f5f8">escapeHtml: text nodes</text>
  <text x="620" y="528" font-size="12" fill="#f2f5f8">escapeHtmlAttr: attribute values</text>
  <text x="620" y="548" font-size="12" fill="#f2f5f8">escapeUrl, escapeJs: URLs and script strings</text>
</svg>
