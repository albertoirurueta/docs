<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <defs>
    <marker id="rodf-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="rodf-arrow-up" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One-way data flow</text>

  <!-- Parent -->
  <rect x="270" y="46" width="180" height="66" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="360" y="76" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;App&gt;</text>
  <text x="360" y="96" font-size="12" fill="#1c4b73" text-anchor="middle">owns the state</text>

  <!-- Child A -->
  <rect x="90" y="220" width="200" height="72" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="190" y="250" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;ProductList items={…} /&gt;</text>
  <text x="190" y="272" font-size="12" fill="#1c4b73" text-anchor="middle">reads props, renders</text>

  <!-- Child B -->
  <rect x="430" y="220" width="200" height="72" rx="6" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="530" y="250" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">&lt;AddButton onAdd={…} /&gt;</text>
  <text x="530" y="272" font-size="12" fill="#1c4b73" text-anchor="middle">calls the callback</text>

  <!-- props down arrows -->
  <line x1="300" y1="112" x2="200" y2="216" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#rodf-arrow)"/>
  <line x1="410" y1="112" x2="510" y2="216" stroke="#2f6fa8" stroke-width="2.5" marker-end="url(#rodf-arrow)"/>
  <text x="212" y="165" font-size="13" font-weight="bold" fill="#2f6fa8" text-anchor="middle" transform="rotate(-46 212 165)">props flow down</text>

  <!-- events up arrow -->
  <line x1="530" y1="216" x2="440" y2="114" stroke="#c25a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#rodf-arrow-up)"/>
  <text x="512" y="168" font-size="13" font-weight="bold" fill="#c25a1d" text-anchor="middle" transform="rotate(-48 512 168)">events flow up</text>

  <!-- caption -->
  <text x="360" y="336" font-size="12.5" fill="#444444" text-anchor="middle">Data always moves parent &#8594; child through props.</text>
  <text x="360" y="356" font-size="12.5" fill="#444444" text-anchor="middle">A child affects a parent only by calling a function the parent passed down.</text>
</svg>
