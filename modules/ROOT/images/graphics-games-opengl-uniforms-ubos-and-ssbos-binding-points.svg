<text x="20" y="370" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Each target (uniform, shader storage, atomic counter, transform feedback) has its own list of binding points.</text>
<text x="20" y="388" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Block index in a program is separate from the binding point: layout(binding = n) or glUniformBlockBinding joins them.</text>
