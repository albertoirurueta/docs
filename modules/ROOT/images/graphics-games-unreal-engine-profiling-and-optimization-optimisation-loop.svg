<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The optimisation loop and the tool for each step</text>
<rect x="18" y="64" width="160" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="98" y="92" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">1  Measure</text>
<text x="98" y="116" text-anchor="middle" font-size="11" fill="#374151">one repeatable scenario</text>
<rect x="30" y="132" width="136" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="98" y="152" text-anchor="middle" font-size="11" fill="#3730A3">stat fps, stat unit</text>
<rect x="206" y="64" width="160" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="286" y="92" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">2  Locate</text>
<text x="286" y="116" text-anchor="middle" font-size="11" fill="#374151">which thread or system</text>
<rect x="218" y="132" width="136" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="286" y="152" text-anchor="middle" font-size="11" fill="#3730A3">Insights, ProfileGPU</text>
<rect x="394" y="64" width="160" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="474" y="92" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">3  Change one thing</text>
<text x="474" y="116" text-anchor="middle" font-size="11" fill="#374151">scalability or code</text>
<rect x="406" y="132" width="136" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="474" y="152" text-anchor="middle" font-size="11" fill="#3730A3">CVars, device profile</text>
<rect x="582" y="64" width="160" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="662" y="92" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">4  Retest</text>
<text x="662" y="116" text-anchor="middle" font-size="11" fill="#374151">same scenario, device</text>
<rect x="594" y="132" width="136" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="662" y="152" text-anchor="middle" font-size="11" fill="#3730A3">CSV, Insights</text>
<line x1="178" y1="119" x2="206" y2="119" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b4)"/>
<line x1="366" y1="119" x2="394" y2="119" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b4)"/>
<line x1="554" y1="119" x2="582" y2="119" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b4)"/>
<path d="M662,176 L662,214 L98,214 L98,176" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b4)"/>
<text x="380" y="232" text-anchor="middle" font-size="12" fill="#374151">Repeat until the frame fits the budget</text>
<rect x="18" y="252" width="724" height="58" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="276" text-anchor="middle" font-size="12" fill="#92400E">Budgets: 33.3 ms for 30 fps, 16.7 ms for 60 fps, 8.3 ms for 120 fps</text>
<text x="380" y="296" text-anchor="middle" font-size="12" fill="#92400E">Hitches matter as much as the average: a single 50 ms frame is visible even at 60 fps on average</text>
</svg>
