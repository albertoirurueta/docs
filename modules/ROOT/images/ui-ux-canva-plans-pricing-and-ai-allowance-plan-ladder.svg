<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Plan ladder: from Free to Enterprise</text>
  <rect x="20" y="250" width="160" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="100" y="278" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Free</text>
  <text x="100" y="304" font-size="12" fill="#374151" text-anchor="middle">1 brand kit</text>
  <text x="100" y="322" font-size="12" fill="#374151" text-anchor="middle">5 GB storage</text>
  <text x="100" y="340" font-size="12" fill="#92400E" text-anchor="middle">limited AI</text>
  <path d="M181,310 L198,290" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="200" y="210" width="160" height="190" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="238" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Pro</text>
  <text x="280" y="264" font-size="12" fill="#374151" text-anchor="middle">5 brand kits</text>
  <text x="280" y="282" font-size="12" fill="#374151" text-anchor="middle">100 GB storage</text>
  <text x="280" y="300" font-size="12" fill="#92400E" text-anchor="middle">10x Free's AI</text>
  <path d="M361,270 L378,250" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="380" y="170" width="160" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="460" y="198" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Business</text>
  <text x="460" y="224" font-size="12" fill="#374151" text-anchor="middle">100 brand kits</text>
  <text x="460" y="242" font-size="12" fill="#374151" text-anchor="middle">500 GB storage</text>
  <text x="460" y="260" font-size="12" fill="#92400E" text-anchor="middle">20x Free's AI</text>
  <path d="M541,230 L558,210" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="560" y="130" width="160" height="270" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="640" y="158" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Enterprise</text>
  <text x="640" y="184" font-size="12" fill="#374151" text-anchor="middle">1000 brand kits</text>
  <text x="640" y="202" font-size="12" fill="#374151" text-anchor="middle">1 TB storage</text>
  <text x="640" y="220" font-size="12" fill="#92400E" text-anchor="middle">20x Free's AI</text>
  <text x="380" y="48" font-size="12" fill="#6B7280" text-anchor="middle">Each plan includes what the plan before it includes, and more</text>
  <rect x="20" y="64" width="350" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="195" y="86" font-size="12" fill="#374151" text-anchor="middle" font-weight="bold">Free programmes: Education (K-12), Nonprofits</text>
  <text x="195" y="106" font-size="12" fill="#374151" text-anchor="middle">Nonprofits: one team of up to 50; Campus is paid</text>
  <rect x="20" y="130" width="350" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="195" y="151" font-size="12" fill="#374151" text-anchor="middle">Legacy Teams: existing subscribers keep it,</text>
  <text x="195" y="167" font-size="12" fill="#374151" text-anchor="middle">closed to new sign-ups since 2025-10-30</text>
  <text x="380" y="430" font-size="11" fill="#6B7280" text-anchor="middle">Counts as listed on the pricing page on 2026-11-07; prices are not shown because they vary by region.</text>
  <text x="380" y="452" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
