<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bagging: bootstrap samples, trees, vote and out-of-bag rows</title>
<desc id="d">A training set of ten rows is resampled with replacement into three bootstrap samples. Each trains one tree. The trees vote or average. The rows left out of a tree's sample are its out-of-bag rows and are used to score that tree.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="458" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">Bagging and the out-of-bag rows</text>
<text x="24" y="86" font-size="14" font-weight="bold" fill="#0F172A">Training rows</text>
<g font-size="12" fill="#0F172A" text-anchor="middle" stroke="#0F766E" stroke-width="2">
<rect x="24" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="58" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="92" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="126" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="160" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="194" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="228" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="262" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="296" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/><rect x="330" y="96" width="30" height="28" rx="4" fill="#CCFBF1"/>
</g>
<g font-size="12" fill="#0F172A" text-anchor="middle">
<text x="39" y="114">1</text><text x="73" y="114">2</text><text x="107" y="114">3</text><text x="141" y="114">4</text><text x="175" y="114">5</text><text x="209" y="114">6</text><text x="243" y="114">7</text><text x="277" y="114">8</text><text x="311" y="114">9</text><text x="345" y="114">10</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="200" y1="126" x2="110" y2="164"/><line x1="200" y1="126" x2="280" y2="164"/><line x1="200" y1="126" x2="450" y2="164"/></g>
<text x="380" y="114" font-size="12" fill="#475569">each sample: n draws with replacement</text>
<g font-size="12" text-anchor="middle" fill="#0F172A">
<rect x="24" y="166" width="190" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="119" y="188" font-weight="bold">bootstrap sample 1</text><text x="119" y="206">1 1 3 4 4 6 7 7 9 10</text><text x="119" y="222" fill="#BE123C">out of bag: 2 5 8</text>
<rect x="260" y="166" width="190" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="355" y="188" font-weight="bold">bootstrap sample 2</text><text x="355" y="206">2 2 3 5 5 6 8 9 9 10</text><text x="355" y="222" fill="#BE123C">out of bag: 1 4 7</text>
<rect x="486" y="166" width="190" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="581" y="188" font-weight="bold">bootstrap sample 3</text><text x="581" y="206">1 2 4 4 5 7 8 8 9 9</text><text x="581" y="222" fill="#BE123C">out of bag: 3 6 10</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="119" y1="230" x2="119" y2="266"/><line x1="355" y1="230" x2="355" y2="266"/><line x1="581" y1="230" x2="581" y2="266"/></g>
<g font-size="14" text-anchor="middle" fill="#0F172A" font-weight="bold">
<rect x="49" y="268" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="119" y="296">tree 1</text>
<rect x="285" y="268" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="355" y="296">tree 2</text>
<rect x="511" y="268" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="581" y="296">tree 3</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="119" y1="314" x2="300" y2="346"/><line x1="355" y1="314" x2="355" y2="346"/><line x1="581" y1="314" x2="410" y2="346"/></g>
<rect x="250" y="348" width="210" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="355" y="375" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">vote or average</text>
<text x="24" y="412" font-size="12" fill="#475569">A row is left out of a bootstrap sample with probability (1 - 1/n)^n, about 0.368 for large n.</text>
<text x="24" y="428" font-size="12" fill="#475569">So each sample holds about 63.2 percent of the distinct rows; scoring each row only with the trees</text>
<text x="24" y="444" font-size="12" fill="#475569">that did not see it gives the out-of-bag estimate.</text>
</svg>
