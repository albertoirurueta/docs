<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">torchvision v2 transform pipeline</title>
<desc id="d">A PIL image or uint8 tensor is wrapped as a tv_tensors Image, passes through geometric and photometric transforms together with its bounding boxes and mask, is converted to float32 in the range 0 to 1, normalised and returned as pure tensors for the model.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One v2 pipeline, several kinds of data</text>
<rect x="20" y="60" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="80" y="86" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">PIL image or</text>
<text x="80" y="104" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">uint8 tensor</text>
<rect x="170" y="60" width="130" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="235" y="86" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">v2.ToImage()</text>
<text x="235" y="104" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">tv_tensors.Image</text>
<rect x="330" y="60" width="150" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="405" y="86" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">crop, flip, resize,</text>
<text x="405" y="104" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">colour jitter</text>
<rect x="510" y="60" width="190" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="605" y="86" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ToDtype(float32, scale)</text>
<text x="605" y="104" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">then Normalize</text>
<line x1="140" y1="90" x2="168" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="300" y1="90" x2="328" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="480" y1="90" x2="508" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="330" y="150" width="150" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="405" y="170" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">BoundingBoxes, Mask</text>
<text x="405" y="186" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">follow the same random draw</text>
<line x1="405" y1="150" x2="405" y2="122" stroke="#6D28D9" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="510" y="150" width="190" height="44" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="605" y="170" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">SanitizeBoundingBoxes</text>
<text x="605" y="186" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">drops empty boxes and labels</text>
<line x1="605" y1="122" x2="605" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="236" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Solid arrows: the image path. Dashed arrow: the boxes and masks are transformed in step with the image.</text>
<text x="20" y="258" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Classification needs only the image path; detection and segmentation add the violet and rose boxes.</text>
<text x="20" y="280" font-size="12" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Redrawn from the description in the torchvision transforms documentation.</text>
</svg>
