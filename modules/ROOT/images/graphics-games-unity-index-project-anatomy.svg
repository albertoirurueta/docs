<svg viewBox="0 0 760 392" width="760" height="392" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="392" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What a Unity project is made of</text>
<rect x="24" y="44" width="712" height="332" rx="14" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="44" y="66" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Bookshelf project</text>
<rect x="44" y="80" width="300" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="58" y="100" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Scene: Bookshelf</text>
<rect x="60" y="112" width="268" height="124" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="72" y="131" font-size="12" fill="#3730A3" text-anchor="start" font-weight="bold">GameObject: Book</text>
<text x="84" y="150" font-size="11" fill="#374151" text-anchor="start">Transform</text>
<text x="84" y="169" font-size="11" fill="#374151" text-anchor="start">Mesh Filter, Mesh Renderer</text>
<text x="84" y="188" font-size="11" fill="#374151" text-anchor="start">Box Collider, Rigidbody</text>
<text x="84" y="207" font-size="11" fill="#374151" text-anchor="start">BookSpinner (your MonoBehaviour)</text>
<rect x="364" y="80" width="352" height="170" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="378" y="100" font-size="13" fill="#047857" text-anchor="start" font-weight="bold">Assets folder</text>
<rect x="378" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="430" y="140" font-size="11" fill="#374151" text-anchor="middle">Book prefab</text>
<rect x="490" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="542" y="140" font-size="11" fill="#374151" text-anchor="middle">BookData assets</text>
<rect x="602" y="114" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="654" y="140" font-size="11" fill="#374151" text-anchor="middle">Materials</text>
<rect x="378" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="430" y="196" font-size="11" fill="#374151" text-anchor="middle">C# scripts</text>
<rect x="490" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="542" y="196" font-size="11" fill="#374151" text-anchor="middle">Input actions</text>
<rect x="602" y="170" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="654" y="196" font-size="11" fill="#374151" text-anchor="middle">Shelf model</text>
<text x="378" y="236" font-size="11" fill="#374151" text-anchor="start">Each asset has a .meta file with its GUID.</text>
<line x1="364" y1="136" x2="330" y2="160" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="347" y="132" font-size="11" fill="#374151" text-anchor="start"></text>
<rect x="44" y="264" width="300" height="96" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="284" font-size="13" fill="#92400E" text-anchor="start" font-weight="bold">Packages and ProjectSettings</text>
<text x="58" y="304" font-size="11" fill="#374151" text-anchor="start">manifest.json lists URP, Input System and the rest.</text>
<text x="58" y="320" font-size="11" fill="#374151" text-anchor="start">ProjectSettings holds tags, layers, physics, quality.</text>
<text x="58" y="336" font-size="11" fill="#374151" text-anchor="start">Library is rebuilt from these, so leave it out of Git.</text>
<rect x="364" y="264" width="352" height="96" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="378" y="284" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Build Profiles</text>
<text x="378" y="304" font-size="11" fill="#374151" text-anchor="start">One profile per target: Windows, macOS, Android, Web.</text>
<text x="378" y="320" font-size="11" fill="#374151" text-anchor="start">Each one selects scenes, scripting back end and settings,</text>
<text x="378" y="336" font-size="11" fill="#374151" text-anchor="start">and produces a Player that runs without the Editor.</text>
</svg>
