<svg viewBox="0 0 760 492" width="760" height="492" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="492" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From XAML markup to a live object tree</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Every element creates an object, every attribute sets a property, nesting fills a property or a collection</text>

  <defs>
    <marker id="xt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Markup panel -->
  <rect x="20" y="66" width="320" height="324" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <text x="180" y="88" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">MainWindow.xaml (markup)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#333333">
    <text x="34" y="116">&lt;Window x:Class="Bookshelf.MainWindow"&gt;</text>
    <text x="48" y="138">&lt;Grid&gt;</text>
    <text x="62" y="160">&lt;Grid.RowDefinitions&gt;</text>
    <text x="76" y="182">&lt;RowDefinition Height="Auto"/&gt;</text>
    <text x="76" y="204">&lt;RowDefinition Height="*"/&gt;</text>
    <text x="62" y="226">&lt;/Grid.RowDefinitions&gt;</text>
    <text x="62" y="248">&lt;TextBox Grid.Row="0"/&gt;</text>
    <text x="62" y="270">&lt;ListBox Grid.Row="1"/&gt;</text>
    <text x="48" y="292">&lt;/Grid&gt;</text>
    <text x="34" y="314">&lt;/Window&gt;</text>
  </g>
  <text x="180" y="342" font-size="12" fill="#666666" text-anchor="middle">Parsed at build time into BAML,</text>
  <text x="180" y="358" font-size="12" fill="#666666" text-anchor="middle">or at run time by XamlReader</text>

  <!-- Arrow -->
  <line x1="346" y1="216" x2="398" y2="216" stroke="#555555" stroke-width="2" marker-end="url(#xt-arrow)"/>
  <text x="372" y="204" font-size="11" fill="#444444" text-anchor="middle">XAML</text>
  <text x="372" y="236" font-size="11" fill="#444444" text-anchor="middle">loader</text>

  <!-- Tree panel -->
  <rect x="404" y="66" width="338" height="324" rx="10" fill="#ffffff" stroke="#d5dde8" stroke-width="1"/>
  <text x="573" y="88" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Object tree in memory</text>

  <!-- connectors -->
  <g stroke="#888888" stroke-width="1.2" fill="none">
    <path d="M430,126 V159 H446"/>
    <path d="M460,172 V223 H476"/>
    <path d="M460,172 V313 H476"/>
    <path d="M490,236 V250 H506"/>
    <path d="M490,236 V280 H506"/>
    <path d="M490,326 V341 H506"/>
    <path d="M490,326 V367 H506"/>
  </g>

  <rect x="414" y="100" width="150" height="26" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="489" y="118" font-size="12" fill="#1c4b73" text-anchor="middle" font-weight="bold">Window (x:Class)</text>

  <rect x="446" y="146" width="150" height="26" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="521" y="164" font-size="12" fill="#1c4b73" text-anchor="middle" font-weight="bold">Grid (Window.Content)</text>

  <rect x="476" y="210" width="190" height="26" rx="6" fill="#fdf1e6" stroke="#a15c1c" stroke-width="1.4"/>
  <text x="571" y="228" font-size="12" fill="#a15c1c" text-anchor="middle" font-weight="bold">RowDefinitions (collection)</text>

  <rect x="506" y="238" width="170" height="24" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="591" y="254" font-size="11.5" fill="#333333" text-anchor="middle">RowDefinition (Auto)</text>
  <rect x="506" y="268" width="170" height="24" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="591" y="284" font-size="11.5" fill="#333333" text-anchor="middle">RowDefinition (1*)</text>

  <rect x="476" y="300" width="190" height="26" rx="6" fill="#fdf1e6" stroke="#a15c1c" stroke-width="1.4"/>
  <text x="571" y="318" font-size="12" fill="#a15c1c" text-anchor="middle" font-weight="bold">Children (content property)</text>

  <rect x="506" y="330" width="226" height="22" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="619" y="345" font-size="11.5" fill="#333333" text-anchor="middle">TextBox + Grid.Row = 0</text>
  <rect x="506" y="356" width="226" height="22" rx="6" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="619" y="371" font-size="11.5" fill="#333333" text-anchor="middle">ListBox + Grid.Row = 1</text>

  <!-- Legend -->
  <rect x="20" y="408" width="722" height="70" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <rect x="36" y="422" width="16" height="12" rx="3" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="60" y="432" font-size="12" fill="#333333">Object element: a new instance of the named CLR type (public, parameterless constructor)</text>
  <rect x="36" y="442" width="16" height="12" rx="3" fill="#fdf1e6" stroke="#a15c1c" stroke-width="1.2"/>
  <text x="60" y="452" font-size="12" fill="#333333">Property that holds children: a collection filled with Add, or a single content value</text>
  <text x="36" y="470" font-size="12" fill="#333333">Attributes such as Height="Auto" are converted by a type converter; Grid.Row is an attached property set on the child</text>
</svg>
