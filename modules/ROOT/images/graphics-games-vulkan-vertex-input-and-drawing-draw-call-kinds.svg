<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Choosing a draw command</text>
<rect x="20" y="55" width="220" height="110" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Direct</text>
<text x="130" y="104" text-anchor="middle" font-size="11" fill="#374151">vkCmdDraw</text>
<text x="130" y="122" text-anchor="middle" font-size="11" fill="#374151">vkCmdDrawIndexed</text>
<text x="130" y="146" text-anchor="middle" font-size="11" fill="#6B7280">CPU knows every argument</text>
<rect x="270" y="55" width="220" height="110" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Indirect</text>
<text x="380" y="104" text-anchor="middle" font-size="11" fill="#374151">vkCmdDrawIndirect</text>
<text x="380" y="122" text-anchor="middle" font-size="11" fill="#374151">vkCmdDrawIndexedIndirect</text>
<text x="380" y="146" text-anchor="middle" font-size="11" fill="#6B7280">arguments live in a buffer</text>
<rect x="520" y="55" width="220" height="110" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Indirect count</text>
<text x="630" y="104" text-anchor="middle" font-size="11" fill="#374151">vkCmdDrawIndirectCount</text>
<text x="630" y="122" text-anchor="middle" font-size="11" fill="#374151">vkCmdDrawIndexedIndirectCount</text>
<text x="630" y="146" text-anchor="middle" font-size="11" fill="#6B7280">draw count also in a buffer</text>
<rect x="20" y="195" width="720" height="100" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">Instancing works with all of them</text>
<text x="380" y="244" text-anchor="middle" font-size="12" fill="#374151">instanceCount copies of the mesh; gl_InstanceIndex (SV_InstanceID in HLSL) selects per-instance data</text>
<text x="380" y="266" text-anchor="middle" font-size="12" fill="#374151">firstInstance offsets the index; per-instance vertex attributes use inputRate INSTANCE</text>
<text x="380" y="285" text-anchor="middle" font-size="11" fill="#6B7280">Bookshelf: 1 book mesh, many instances</text>
</svg>
