<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Struts 7.4.0 defaultStack</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">24 interceptors run in this order before the action; each regains control in reverse order after invoke() returns</text>
  <rect x="30" y="100" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="118" font-size="12" font-weight="bold" fill="#133a75">1. exception</text>
  <text x="282" y="118" font-size="10" fill="#1a4d9c" text-anchor="end">maps exceptions to results</text>
  <rect x="30" y="134" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="152" font-size="12" font-weight="bold" fill="#133a75">2. alias</text>
  <rect x="30" y="168" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="186" font-size="12" font-weight="bold" fill="#133a75">3. servletConfig</text>
  <rect x="30" y="202" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="220" font-size="12" font-weight="bold" fill="#133a75">4. httpMethod</text>
  <text x="282" y="220" font-size="10" fill="#1a4d9c" text-anchor="end">@HttpPost and friends</text>
  <rect x="30" y="236" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="254" font-size="12" font-weight="bold" fill="#133a75">5. i18n</text>
  <text x="282" y="254" font-size="10" fill="#1a4d9c" text-anchor="end">selects the locale</text>
  <rect x="30" y="270" width="260" height="28" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="40" y="288" font-size="12" font-weight="bold" fill="#133a75">6. csp</text>
  <text x="282" y="288" font-size="10" fill="#1a4d9c" text-anchor="end">CSP report-only</text>
  <rect x="30" y="304" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="40" y="322" font-size="12" font-weight="bold" fill="#14501f">7. prepare</text>
  <text x="282" y="322" font-size="10" fill="#1e6b34" text-anchor="end">Preparable.prepare()</text>
  <rect x="30" y="338" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="40" y="356" font-size="12" font-weight="bold" fill="#14501f">8. chain</text>
  <text x="282" y="356" font-size="10" fill="#1e6b34" text-anchor="end">copies chained props</text>
  <rect x="320" y="100" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="118" font-size="12" font-weight="bold" fill="#14501f">9. scopedModelDriven</text>
  <rect x="320" y="134" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="152" font-size="12" font-weight="bold" fill="#14501f">10. modelDriven</text>
  <text x="572" y="152" font-size="10" fill="#1e6b34" text-anchor="end">pushes getModel()</text>
  <rect x="320" y="168" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="186" font-size="12" font-weight="bold" fill="#14501f">11. actionFileUpload</text>
  <text x="572" y="186" font-size="10" fill="#1e6b34" text-anchor="end">UploadedFilesAware</text>
  <rect x="320" y="202" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="220" font-size="12" font-weight="bold" fill="#14501f">12. checkbox</text>
  <rect x="320" y="236" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="254" font-size="12" font-weight="bold" fill="#14501f">13. datetime</text>
  <rect x="320" y="270" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="288" font-size="12" font-weight="bold" fill="#14501f">14. multiselect</text>
  <rect x="320" y="304" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="322" font-size="12" font-weight="bold" fill="#14501f">15. staticParams</text>
  <rect x="320" y="338" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="330" y="356" font-size="12" font-weight="bold" fill="#14501f">16. actionMappingParams</text>
  <rect x="610" y="100" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="620" y="118" font-size="12" font-weight="bold" fill="#14501f">17. params</text>
  <text x="862" y="118" font-size="10" fill="#1e6b34" text-anchor="end">binds request parameters</text>
  <rect x="610" y="134" width="260" height="28" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="620" y="152" font-size="12" font-weight="bold" fill="#14501f">18. conversionError</text>
  <text x="862" y="152" font-size="10" fill="#1e6b34" text-anchor="end">to field errors</text>
  <rect x="610" y="168" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="186" font-size="12" font-weight="bold" fill="#5c4600">19. coep</text>
  <text x="862" y="186" font-size="10" fill="#8a6a00" text-anchor="end">COEP report-only</text>
  <rect x="610" y="202" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="220" font-size="12" font-weight="bold" fill="#5c4600">20. coop</text>
  <text x="862" y="220" font-size="10" fill="#8a6a00" text-anchor="end">COOP same-origin</text>
  <rect x="610" y="236" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="254" font-size="12" font-weight="bold" fill="#5c4600">21. fetchMetadata</text>
  <text x="862" y="254" font-size="10" fill="#8a6a00" text-anchor="end">isolation policy</text>
  <rect x="610" y="270" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="288" font-size="12" font-weight="bold" fill="#5c4600">22. validation</text>
  <text x="862" y="288" font-size="10" fill="#8a6a00" text-anchor="end">validate() and rules</text>
  <rect x="610" y="304" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="322" font-size="12" font-weight="bold" fill="#5c4600">23. workflow</text>
  <text x="862" y="322" font-size="10" fill="#8a6a00" text-anchor="end">input on errors</text>
  <rect x="610" y="338" width="260" height="28" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.4"/>
  <text x="620" y="356" font-size="12" font-weight="bold" fill="#5c4600">24. debugging</text>
  <text x="862" y="356" font-size="10" fill="#8a6a00" text-anchor="end">devMode only</text>
  <g stroke="#444444" stroke-width="1.6" fill="none">
    <path d="M160 366 V380 H305 V78 H450 V98"/>
    <path d="M450 366 V380 H595 V78 H740 V98"/>
  </g>
  <g fill="#444444"><polygon points="450,100 445,91 455,91"/><polygon points="740,100 735,91 745,91"/></g>
  <rect x="30" y="58" width="14" height="14" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.2"/>
  <text x="50" y="70" font-size="11" fill="#444444">1-6 environment and locale</text>
  <rect x="230" y="58" width="14" height="14" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="250" y="70" font-size="11" fill="#444444">7-18 populate the action</text>
  <rect x="430" y="58" width="14" height="14" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.2"/>
  <text x="450" y="70" font-size="11" fill="#444444">19-24 isolate and validate</text>
  <path d="M740 366 V380 H740" stroke="none"/>
  <rect x="610" y="406" width="260" height="54" fill="#f4f4f4" stroke="#444444" stroke-width="1.8"/>
  <text x="740" y="429" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Action method</text>
  <text x="740" y="447" font-size="10" fill="#666666" text-anchor="middle">execute(), save(), search()</text>
  <rect x="320" y="406" width="260" height="54" fill="#fbeaea" stroke="#7a2e2e" stroke-width="1.8"/>
  <text x="450" y="429" font-size="13" font-weight="bold" fill="#5c1e1e" text-anchor="middle">Result</text>
  <text x="450" y="447" font-size="10" fill="#7a2e2e" text-anchor="middle">PreResultListeners run just before it</text>
  <g stroke="#444444" stroke-width="1.6" fill="#444444"><line x1="740" y1="366" x2="740" y2="398"/><polygon points="740,405 735,396 745,396"/><line x1="610" y1="433" x2="588" y2="433"/><polygon points="581,433 591,428 591,438"/></g>
  <path d="M450 460 V480 H160 V374" stroke="#7a2e2e" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
  <polygon points="160,367 155,376 165,376" fill="#7a2e2e"/>
  <text x="305" y="496" font-size="11" fill="#7a2e2e" text-anchor="middle">unwinds in reverse: interceptor 24 resumes first, interceptor 1 last</text>
  <text x="30" y="524" font-size="12" font-weight="bold" fill="#222222">Reading the order</text>
  <text x="30" y="543" font-size="11" fill="#444444">Any interceptor may return a result code instead of calling invoke(); that skips every interceptor below it and the action (workflow returns input).</text>
  <text x="30" y="560" font-size="11" fill="#444444">prepare (7) runs before params (17), so prepare() cannot see request values; paramsPrepareParamsStack adds a params call before prepare to fix that.</text>
  <text x="30" y="577" font-size="11" fill="#444444">validation (22) and workflow (23) skip the methods input, back, cancel and browse; debugging (24) does nothing unless devMode is on.</text>
</svg>
