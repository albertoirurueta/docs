<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Variable scope of the include tag compared with the render tag</title>
  <desc>On the left, include runs the snippet in the caller's scope, so an assign inside the snippet changes the outer variable. On the right, render runs the snippet in an isolated scope: only named arguments go in, nothing comes back, and global objects stay visible.</desc>
  <defs>
    <marker id="lrs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">include shares the caller's scope, render isolates it</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">Same snippet, same starting value count = 1; only the tag changes what the template sees afterwards</text>

  <!-- include panel -->
  <rect x="20" y="66" width="440" height="330" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="20" y="66" width="440" height="38" rx="8" fill="#c0392b"/>
  <text x="240" y="91" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">include (deprecated): one shared scope</text>
  <rect x="40" y="120" width="400" height="190" rx="6" fill="#ffffff" fill-opacity="0.7" stroke="#c0392b" stroke-dasharray="5 4"/>
  <text x="54" y="141" font-size="12" font-weight="bold" fill="#1f2933">Template scope</text>
  <text x="54" y="164" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{% assign count = 1 %}</text>
  <rect x="60" y="178" width="360" height="86" rx="6" fill="#fadbd8" stroke="#c0392b"/>
  <text x="74" y="198" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{% include 'counter' %}</text>
  <text x="74" y="218" font-size="12" fill="#1f2933">snippets/counter.liquid reads count (1)</text>
  <text x="74" y="236" font-family="Courier New, monospace" font-size="12" fill="#1f2933">assign count = count | plus: 1</text>
  <text x="74" y="254" font-size="12" font-weight="bold" fill="#922b21">writes the caller's variable</text>
  <text x="54" y="290" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{{ count }}  prints 2</text>
  <text x="240" y="336" font-size="12.5" fill="#1f2933" text-anchor="middle">Any name the snippet assigns can overwrite one the caller uses.</text>
  <text x="240" y="356" font-size="12.5" fill="#1f2933" text-anchor="middle">Not allowed inside a snippet that was rendered with render.</text>
  <text x="240" y="380" font-size="12" fill="#922b21" text-anchor="middle" font-weight="bold">Theme Check: DeprecatedTag</text>

  <!-- render panel -->
  <rect x="500" y="66" width="440" height="330" rx="8" fill="#e3f4ea" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="500" y="66" width="440" height="38" rx="8" fill="#1e8449"/>
  <text x="720" y="91" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">render: isolated scope</text>
  <rect x="520" y="120" width="170" height="190" rx="6" fill="#ffffff" fill-opacity="0.7" stroke="#1e8449" stroke-dasharray="5 4"/>
  <text x="534" y="141" font-size="12" font-weight="bold" fill="#1f2933">Template scope</text>
  <text x="534" y="164" font-family="Courier New, monospace" font-size="11" fill="#1f2933">{% assign count = 1 %}</text>
  <text x="534" y="188" font-family="Courier New, monospace" font-size="11" fill="#1f2933">{% render 'counter',</text>
  <text x="534" y="204" font-family="Courier New, monospace" font-size="11" fill="#1f2933">   count: count %}</text>
  <text x="534" y="290" font-family="Courier New, monospace" font-size="11" fill="#1f2933">{{ count }}  prints 1</text>
  <rect x="770" y="120" width="150" height="190" rx="6" fill="#d5f0e0" stroke="#1e8449"/>
  <text x="784" y="141" font-size="12" font-weight="bold" fill="#1f2933">Snippet scope</text>
  <text x="784" y="164" font-size="11.5" fill="#1f2933">count = 1 (a copy)</text>
  <text x="784" y="188" font-family="Courier New, monospace" font-size="11" fill="#1f2933">assign count =</text>
  <text x="784" y="204" font-family="Courier New, monospace" font-size="11" fill="#1f2933">  count | plus: 1</text>
  <text x="784" y="228" font-size="11.5" fill="#1f2933">snippet sees 2</text>
  <text x="784" y="290" font-size="11.5" font-weight="bold" fill="#14653a">changes stay inside</text>
  <line x1="692" y1="196" x2="766" y2="196" stroke="#7b8794" stroke-width="2" marker-end="url(#lrs-arrow)"/>
  <text x="729" y="188" font-size="11" fill="#1f2933" text-anchor="middle">named</text>
  <text x="729" y="224" font-size="11" fill="#1f2933" text-anchor="middle">arguments</text>
  <text x="720" y="336" font-size="12.5" fill="#1f2933" text-anchor="middle">Global objects (shop, settings, routes, request) and the objects of the</text>
  <text x="720" y="356" font-size="12.5" fill="#1f2933" text-anchor="middle">current template or section (product, section) stay visible to the snippet.</text>
  <text x="720" y="380" font-size="12" fill="#14653a" text-anchor="middle" font-weight="bold">Variables created outside must be passed in</text>

  <text x="480" y="428" font-size="12" fill="#7b8794" text-anchor="middle">Values measured with the open-source Ruby Liquid gem 5.3.0, with the same behaviour documented for Shopify themes</text>
  <text x="480" y="448" font-size="12" fill="#7b8794" text-anchor="middle">Liquid reference: tags render and include on shopify.dev</text>
</svg>
