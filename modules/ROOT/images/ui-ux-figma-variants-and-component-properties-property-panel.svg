<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Properties section of a component set (schematic)</text>
  <rect x="40" y="50" width="270" height="320" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
  <text x="56" y="76" font-size="13" font-weight="bold" fill="#1F2937">Properties</text>
  <text x="270" y="76" font-size="16" fill="#4F46E5" font-weight="bold">+</text>
  <g stroke="#E5E7EB" fill="#FFFFFF"><rect x="56" y="90" width="238" height="32" rx="6"/><rect x="56" y="130" width="238" height="32" rx="6"/><rect x="56" y="170" width="238" height="32" rx="6"/><rect x="56" y="210" width="238" height="32" rx="6"/><rect x="56" y="250" width="238" height="32" rx="6"/></g>
  <g font-size="12" fill="#374151"><text x="68" y="111">Type</text><text x="150" y="111" fill="#3730A3">Primary, Secondary, Ghost</text><text x="68" y="151">State</text><text x="150" y="151" fill="#3730A3">Default, Hover, Pressed...</text><text x="68" y="191">Show icon</text><text x="150" y="191" fill="#3730A3">boolean, default on</text><text x="68" y="231">Label</text><text x="150" y="231" fill="#3730A3">text, "Add to shelf"</text><text x="68" y="271">Icon</text><text x="150" y="271" fill="#3730A3">instance swap</text></g>
  <rect x="56" y="296" width="238" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="68" y="316" font-size="12" fill="#3730A3">Expose properties from: Nested instances</text>
  <g fill="#4F46E5"><circle cx="350" cy="76" r="11"/><circle cx="350" cy="106" r="11"/><circle cx="350" cy="186" r="11"/><circle cx="350" cy="226" r="11"/><circle cx="350" cy="266" r="11"/></g><circle cx="350" cy="311" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="350" y="80">1</text><text x="350" y="110">2</text><text x="350" y="190">3</text><text x="350" y="230">4</text><text x="350" y="270">5</text><text x="350" y="315">6</text></g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M339,76 L296,76" marker-end="url(#ah)"/><path d="M339,106 L296,106" marker-end="url(#ah)"/><path d="M339,186 L296,186" marker-end="url(#ah)"/><path d="M339,226 L296,226" marker-end="url(#ah)"/><path d="M339,266 L296,266" marker-end="url(#ah)"/><path d="M339,311 L296,311" marker-end="url(#ah)"/></g>
  <g font-size="13" fill="#374151"><text x="380" y="81"><tspan font-weight="bold">1</tspan> Add property: choose a type</text><text x="380" y="111"><tspan font-weight="bold">2</tspan> Variant properties stay on top</text><text x="380" y="191"><tspan font-weight="bold">3</tspan> Boolean: shows or hides a layer</text><text x="380" y="231"><tspan font-weight="bold">4</tspan> Text: editable string</text><text x="380" y="271"><tspan font-weight="bold">5</tspan> Instance swap: nested instance</text><text x="380" y="316"><tspan font-weight="bold">6</tspan> Surface nested properties</text></g>
  <text x="380" y="352" font-size="12" fill="#374151">Double-click a name to rename; drag handles to reorder.</text>
  <text x="380" y="388" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, not a screenshot of the Figma interface.</text>
