<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">An ERP system: integrated modules over one shared database</title>
  <desc id="d">Seven modules (finance, controlling, procurement, sales, manufacturing, logistics and human resources) sit on top of one shared database. The database holds master data, which changes rarely and is shared by every module, and transactional data, which every business event adds. Arrows show that a posting in one module, such as a goods receipt in procurement, updates the data that finance reads.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="14" y="20" width="136" height="56" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="82" y="52" text-anchor="middle" font-size="13" font-weight="bold">Finance</text>
  <line x1="82" y1="76" x2="82" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="82" y1="150" x2="82" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="160" y="20" width="136" height="56" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="228" y="52" text-anchor="middle" font-size="13" font-weight="bold">Controlling</text>
  <line x1="228" y1="76" x2="228" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="228" y1="150" x2="228" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="306" y="20" width="136" height="56" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="374" y="52" text-anchor="middle" font-size="13" font-weight="bold">Procurement</text>
  <line x1="374" y1="76" x2="374" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="374" y1="150" x2="374" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="452" y="20" width="136" height="56" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="52" text-anchor="middle" font-size="13" font-weight="bold">Sales</text>
  <line x1="520" y1="76" x2="520" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="150" x2="520" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="598" y="20" width="136" height="56" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="666" y="52" text-anchor="middle" font-size="13" font-weight="bold">Manufacturing</text>
  <line x1="666" y1="76" x2="666" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="666" y1="150" x2="666" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="744" y="20" width="136" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="812" y="52" text-anchor="middle" font-size="13" font-weight="bold">Logistics</text>
  <line x1="812" y1="76" x2="812" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="812" y1="150" x2="812" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="890" y="20" width="136" height="56" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="958" y="52" text-anchor="middle" font-size="13" font-weight="bold">Human resources</text>
  <line x1="958" y1="76" x2="958" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="958" y1="150" x2="958" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="150" width="500" height="150" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="270" y="210" text-anchor="middle" font-size="15" font-weight="bold">Master data</text>
  <text x="270" y="230" text-anchor="middle" font-size="13">Customers, suppliers, products, employees, accounts.</text>
  <text x="270" y="250" text-anchor="middle" font-size="13">Created once, changed rarely, shared by every module.</text>
  <rect x="540" y="150" width="480" height="150" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="780" y="210" text-anchor="middle" font-size="15" font-weight="bold">Transactional data</text>
  <text x="780" y="230" text-anchor="middle" font-size="13">Orders, goods receipts, invoices, postings, payroll runs.</text>
  <text x="780" y="250" text-anchor="middle" font-size="13">Every business event adds a record that refers to master data.</text>
  <line x1="520" y1="300" x2="520" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="340" width="1000" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="370" text-anchor="middle" font-size="16" font-weight="bold">One shared database</text>
  <text x="520" y="391" text-anchor="middle" font-size="14">A single version of the truth: no copies to reconcile between departments.</text>
  <rect x="20" y="430" width="1000" height="70" rx="10" fill="#b76fe0" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="460" text-anchor="middle" font-size="14" font-weight="bold">Example: a goods receipt in procurement</text>
  <text x="520" y="479" text-anchor="middle" font-size="12">It raises the stock quantity (logistics) and books the value (finance) in one step, with no re-typing.</text>
</svg>
