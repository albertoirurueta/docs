<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gts-patch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A quad patch is subdivided by the tessellator</text>
<text x="120" y="58" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">1  Patch (4 control points)</text>
<rect x="50" y="80" width="140" height="140" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="50" cy="220" r="5" fill="#B45309"/><circle cx="190" cy="220" r="5" fill="#B45309"/><circle cx="190" cy="80" r="5" fill="#B45309"/><circle cx="50" cy="80" r="5" fill="#B45309"/>
<text x="38" y="238" font-size="11" fill="#92400E">P0</text><text x="192" y="238" font-size="11" fill="#92400E">P1</text><text x="194" y="76" font-size="11" fill="#92400E">P2</text><text x="34" y="76" font-size="11" fill="#92400E">P3</text>
<text x="120" y="250" font-size="10" fill="#374151" text-anchor="middle">GL_PATCHES, glPatchParameteri(GL_PATCH_VERTICES, 4)</text>
<text x="380" y="58" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">2  Tessellation levels</text>
<rect x="310" y="80" width="140" height="140" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="340" y="110" width="80" height="80" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="380" y="154" font-size="11" fill="#92400E" text-anchor="middle">inner</text>
<text x="380" y="168" font-size="11" fill="#92400E" text-anchor="middle">[0], [1]</text>
<text x="296" y="154" font-size="11" fill="#3730A3" text-anchor="end">outer[0]</text>
<text x="380" y="238" font-size="11" fill="#3730A3" text-anchor="middle">outer[1]</text>
<text x="464" y="154" font-size="11" fill="#3730A3">outer[2]</text>
<text x="380" y="72" font-size="11" fill="#3730A3" text-anchor="middle">outer[3]</text>
<text x="380" y="262" font-size="10" fill="#374151" text-anchor="middle">set in the control shader, or by glPatchParameterfv</text>
<text x="640" y="58" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">3  Generated vertices</text>
<line x1="570.0" y1="80" x2="570.0" y2="220" stroke="#047857" stroke-width="1"/>
<line x1="570" y1="80.0" x2="710" y2="80.0" stroke="#047857" stroke-width="1"/>
<line x1="605.0" y1="80" x2="605.0" y2="220" stroke="#047857" stroke-width="1"/>
<line x1="570" y1="115.0" x2="710" y2="115.0" stroke="#047857" stroke-width="1"/>
<line x1="640.0" y1="80" x2="640.0" y2="220" stroke="#047857" stroke-width="1"/>
<line x1="570" y1="150.0" x2="710" y2="150.0" stroke="#047857" stroke-width="1"/>
<line x1="675.0" y1="80" x2="675.0" y2="220" stroke="#047857" stroke-width="1"/>
<line x1="570" y1="185.0" x2="710" y2="185.0" stroke="#047857" stroke-width="1"/>
<line x1="710.0" y1="80" x2="710.0" y2="220" stroke="#047857" stroke-width="1"/>
<line x1="570" y1="220.0" x2="710" y2="220.0" stroke="#047857" stroke-width="1"/>
<circle cx="570.0" cy="80.0" r="2.5" fill="#4F46E5"/>
<circle cx="570.0" cy="115.0" r="2.5" fill="#4F46E5"/>
<circle cx="570.0" cy="150.0" r="2.5" fill="#4F46E5"/>
<circle cx="570.0" cy="185.0" r="2.5" fill="#4F46E5"/>
<circle cx="570.0" cy="220.0" r="2.5" fill="#4F46E5"/>
<circle cx="605.0" cy="80.0" r="2.5" fill="#4F46E5"/>
<circle cx="605.0" cy="115.0" r="2.5" fill="#4F46E5"/>
<circle cx="605.0" cy="150.0" r="2.5" fill="#4F46E5"/>
<circle cx="605.0" cy="185.0" r="2.5" fill="#4F46E5"/>
<circle cx="605.0" cy="220.0" r="2.5" fill="#4F46E5"/>
<circle cx="640.0" cy="80.0" r="2.5" fill="#4F46E5"/>
<circle cx="640.0" cy="115.0" r="2.5" fill="#4F46E5"/>
<circle cx="640.0" cy="150.0" r="2.5" fill="#4F46E5"/>
<circle cx="640.0" cy="185.0" r="2.5" fill="#4F46E5"/>
<circle cx="640.0" cy="220.0" r="2.5" fill="#4F46E5"/>
<circle cx="675.0" cy="80.0" r="2.5" fill="#4F46E5"/>
<circle cx="675.0" cy="115.0" r="2.5" fill="#4F46E5"/>
<circle cx="675.0" cy="150.0" r="2.5" fill="#4F46E5"/>
<circle cx="675.0" cy="185.0" r="2.5" fill="#4F46E5"/>
<circle cx="675.0" cy="220.0" r="2.5" fill="#4F46E5"/>
<circle cx="710.0" cy="80.0" r="2.5" fill="#4F46E5"/>
<circle cx="710.0" cy="115.0" r="2.5" fill="#4F46E5"/>
<circle cx="710.0" cy="150.0" r="2.5" fill="#4F46E5"/>
<circle cx="710.0" cy="185.0" r="2.5" fill="#4F46E5"/>
<circle cx="710.0" cy="220.0" r="2.5" fill="#4F46E5"/>
<text x="640" y="250" font-size="10" fill="#374151" text-anchor="middle">levels 4: each vertex gets (u, v) = gl_TessCoord.xy</text>
<path d="M190 150 L310 150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<path d="M450 150 L570 150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<text x="250" y="140" font-size="10" fill="#374151" text-anchor="middle">control shader</text>
<text x="510" y="140" font-size="10" fill="#374151" text-anchor="middle">tessellator + eval</text>
<text x="20" y="290" font-size="13" font-weight="bold" fill="#374151">Stage order</text>
<g font-size="12" text-anchor="middle" fill="#374151">
<rect x="20" y="302" width="100" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="70" y="327">Vertex shader</text>
<rect x="140" y="302" width="130" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="205" y="327">Tess. control (opt.)</text>
<rect x="290" y="302" width="110" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/><text x="345" y="327">Tessellator</text>
<rect x="420" y="302" width="130" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="485" y="327">Tess. evaluation</text>
<rect x="570" y="302" width="100" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="620" y="327">Geometry (opt.)</text>
<rect x="685" y="302" width="60" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/><text x="715" y="327">Raster</text>
</g>
<path d="M120 322 L140 322" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<path d="M270 322 L290 322" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<path d="M400 322 L420 322" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<path d="M550 322 L570 322" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<path d="M670 322 L685 322" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-patch)"/>
<rect x="20" y="365" width="720" height="80" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="388" font-size="12" fill="#374151" text-anchor="middle">Programmable: control shader (levels and per-patch data), evaluation shader (position of each new vertex).</text>
<text x="380" y="408" font-size="12" fill="#374151" text-anchor="middle">Fixed function: the tessellator, which turns the levels into (u, v) coordinates and triangles.</text>
<text x="380" y="428" font-size="12" fill="#374151" text-anchor="middle">Without a control shader, the levels come from glPatchParameterfv; edges shared by two patches must get equal outer levels.</text>
</svg>