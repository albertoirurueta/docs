<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-ty" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">GLSL 4.60 type families</text>
<text x="20" y="60" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">Family</text>
<text x="150" y="60" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">Types</text>
<text x="520" y="60" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">Notes</text>
<rect x="20" y="70" width="720" height="40" rx="6" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="95" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Scalars</text>
<text x="150" y="95" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">bool  int  uint  float  double</text>
<text x="520" y="95" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">double needs GL 4.0; absent in ES</text>
<rect x="20" y="114" width="720" height="40" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="139" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Vectors</text>
<text x="150" y="139" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">vec2 vec3 vec4, ivecN, uvecN, bvecN, dvecN</text>
<text x="520" y="139" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">float vec is the default family</text>
<rect x="20" y="158" width="720" height="40" rx="6" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="183" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Matrices</text>
<text x="150" y="183" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">mat2 mat3 mat4, matCxR (C columns, R rows), dmat</text>
<text x="520" y="183" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">column-major: m[column][row]</text>
<rect x="20" y="202" width="720" height="40" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="227" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Samplers</text>
<text x="150" y="227" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">sampler2D, sampler3D, samplerCube, sampler2DArray, isampler2D</text>
<text x="520" y="227" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">opaque: uniform only, plus shadow and u variants</text>
<rect x="20" y="246" width="720" height="40" rx="6" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="271" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Images</text>
<text x="150" y="271" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">image2D, iimage2D, uimage2D, imageBuffer</text>
<text x="520" y="271" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">load/store, GLSL 4.20 / ES 3.1</text>
<rect x="20" y="290" width="720" height="40" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="315" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Atomic counters</text>
<text x="150" y="315" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">atomic_uint</text>
<text x="520" y="315" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">GLSL 4.20 / ES 3.1</text>
<rect x="20" y="334" width="720" height="40" rx="6" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="359" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Arrays</text>
<text x="150" y="359" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">float w[4]; vec3 p[]; length() method</text>
<text x="520" y="359" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">unsized only in SSBOs and some interfaces</text>
<rect x="20" y="378" width="720" height="40" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="403" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Structs</text>
<text x="150" y="403" font-size="10.5" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">struct Light { vec3 pos; float r; };</text>
<text x="520" y="403" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">no pointers, no recursion, no classes</text>
<text x="20" y="438" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Constructors convert explicitly: float(i), vec3(v4), mat3(m4), vec4(rgb, 1.0).</text>
<text x="20" y="456" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Integer-to-float conversion also happens implicitly in expressions (GLSL 1.20 and later).</text>
</svg>
