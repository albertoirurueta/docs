<svg viewBox="0 0 760 540" width="760" height="540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-glsl-keyword-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="540" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The same shader in GLSL ES 1.00 and 3.00</text>
<rect x="20" y="52" width="720" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="30" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Concept</text>
<text x="180" y="72" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">GLSL ES 1.00 (WebGL 1)</text>
<text x="430" y="72" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">GLSL ES 3.00 (WebGL 2)</text>
<rect x="20" y="86" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="104" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Version line</text>
<text x="180" y="104" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">(none) or #version 100</text>
<text x="430" y="104" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">#version 300 es, first line</text>
<rect x="20" y="115" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="133" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Vertex input</text>
<text x="180" y="133" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">attribute vec3 aPos;</text>
<text x="430" y="133" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">in vec3 aPos;</text>
<rect x="20" y="144" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="162" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Vertex output</text>
<text x="180" y="162" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">varying vec2 vUv;</text>
<text x="430" y="162" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">out vec2 vUv;</text>
<rect x="20" y="173" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="191" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Fragment input</text>
<text x="180" y="191" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">varying vec2 vUv;</text>
<text x="430" y="191" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">in vec2 vUv;</text>
<rect x="20" y="202" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="220" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Fragment output</text>
<text x="180" y="220" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">gl_FragColor = c;</text>
<text x="430" y="220" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">out vec4 outColor;</text>
<rect x="20" y="231" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="249" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Several targets</text>
<text x="180" y="249" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">gl_FragData[i] (extension)</text>
<text x="430" y="249" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">layout(location = i) out</text>
<rect x="20" y="260" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="278" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Sample a 2D texture</text>
<text x="180" y="278" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">texture2D(s, uv)</text>
<text x="430" y="278" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">texture(s, uv)</text>
<rect x="20" y="289" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="307" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Sample a cube map</text>
<text x="180" y="307" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">textureCube(s, dir)</text>
<text x="430" y="307" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">texture(s, dir)</text>
<rect x="20" y="318" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="336" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Explicit LOD</text>
<text x="180" y="336" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">texture2DLodEXT (extension)</text>
<text x="430" y="336" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">textureLod(s, uv, l)</text>
<rect x="20" y="347" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="365" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Derivatives</text>
<text x="180" y="365" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">dFdx needs OES_standard_derivatives</text>
<text x="430" y="365" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">dFdx, dFdy, fwidth built in</text>
<rect x="20" y="376" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="394" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Attribute slot</text>
<text x="180" y="394" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">bindAttribLocation or query</text>
<text x="430" y="394" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">layout(location = 0) in</text>
<rect x="20" y="405" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="423" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Uniform blocks</text>
<text x="180" y="423" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">not available</text>
<text x="430" y="423" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">layout(std140) uniform B {}</text>
<rect x="20" y="434" width="720" height="27" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="452" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Loops and indexing</text>
<text x="180" y="452" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">Appendix A limits</text>
<text x="430" y="452" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">dynamic, plus switch</text>
<rect x="20" y="463" width="720" height="27" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="481" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="start">Integers</text>
<text x="180" y="481" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">int only, no bit ops</text>
<text x="430" y="481" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">int, uint, bit ops</text>
<line x1="170" y1="86" x2="170" y2="492" stroke="#E5E7EB" stroke-width="1"/>
<line x1="420" y1="86" x2="420" y2="492" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="514" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A program must use one version for both stages: a 100 vertex shader cannot link with a 300 es fragment shader.</text>
</svg>
