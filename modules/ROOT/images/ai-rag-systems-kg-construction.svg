<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif">
  <title>Knowledge graph construction pipeline</title>
  <desc>Documents are split into chunks, which are written as a lexical graph of Document and Chunk nodes with embeddings. An LLM extracts entities and relationships from each chunk, constrained by a schema of allowed node types, relationship types and patterns. Extracted entities are resolved against existing ones by exact and fuzzy matching and merged with MERGE on stable keys, with FROM_CHUNK edges back to the chunk that produced them. Change events from CDC update the graph incrementally: new or changed chunks are re-extracted and merged, deleted chunks are removed or tombstoned, and entities without any FROM_CHUNK edge are cleaned up. The result serves vector, graph-traversal and text-to-Cypher retrieval.</desc>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#f8fafc"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Knowledge graph construction for DocsAssistant</text>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="60" width="140" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="90" y="86" font-size="14" font-weight="bold" fill="#14532d">Documents</text>
    <text x="90" y="108" fill="#14532d">pages, PDFs</text>
    <text x="90" y="126" fill="#14532d">parsed + chunked</text>
    <text x="90" y="144" fill="#14532d">acl, source, hash</text>

    <rect x="200" y="60" width="170" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="285" y="86" font-size="14" font-weight="bold" fill="#14532d">Lexical graph</text>
    <text x="285" y="108" fill="#14532d">(:Chunk)-[:FROM_DOCUMENT]-&gt;</text>
    <text x="285" y="126" fill="#14532d">(:Document), embeddings</text>
    <text x="285" y="144" fill="#14532d">[:NEXT_CHUNK] between chunks</text>

    <rect x="410" y="60" width="180" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="500" y="86" font-size="14" font-weight="bold" fill="#4c1d95">LLM extraction</text>
    <text x="500" y="108" fill="#4c1d95">schema: node types,</text>
    <text x="500" y="126" fill="#4c1d95">relationship types, patterns</text>
    <text x="500" y="144" fill="#4c1d95">per chunk, JSON out</text>

    <rect x="630" y="60" width="150" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="705" y="86" font-size="14" font-weight="bold" fill="#4c1d95">Entity resolution</text>
    <text x="705" y="108" fill="#4c1d95">normalise names</text>
    <text x="705" y="126" fill="#4c1d95">exact + fuzzy match</text>
    <text x="705" y="144" fill="#4c1d95">merge duplicates</text>

    <rect x="820" y="60" width="120" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="880" y="86" font-size="14" font-weight="bold" fill="#78350f">MERGE</text>
    <text x="880" y="108" fill="#78350f">stable keys</text>
    <text x="880" y="126" fill="#78350f">(:Entity)-[:FROM_CHUNK]</text>
    <text x="880" y="144" fill="#78350f">-&gt;(:Chunk)</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#k)" fill="none">
    <line x1="160" y1="115" x2="198" y2="115"/>
    <line x1="370" y1="115" x2="408" y2="115"/>
    <line x1="590" y1="115" x2="628" y2="115"/>
    <line x1="780" y1="115" x2="818" y2="115"/>
    <line x1="880" y1="170" x2="880" y2="218"/>
  </g>

  <rect x="480" y="220" width="460" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <g font-size="12" fill="#78350f">
    <text x="710" y="246" text-anchor="middle" font-size="14" font-weight="bold">Neo4j knowledge graph</text>
    <text x="500" y="272">(:Component {name}) -[:DEPENDS_ON]-&gt; (:Component)</text>
    <text x="500" y="292">(:Page)-[:PART_OF]-&gt;(:Component)</text>
    <text x="500" y="312">(:Concept)-[:RELATED_TO]-&gt;(:Concept)</text>
    <text x="500" y="332">(:__Entity__)-[:FROM_CHUNK]-&gt;(:Chunk) provenance</text>
    <text x="500" y="352">vector index on Chunk.embedding, full-text index on names</text>
  </g>

  <rect x="20" y="220" width="420" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <g font-size="12" fill="#1e3a8a">
    <text x="230" y="246" text-anchor="middle" font-size="14" font-weight="bold">Incremental updates (CDC events)</text>
    <text x="40" y="272">created or changed chunk: re-extract, MERGE, replace FROM_CHUNK</text>
    <text x="40" y="292">deleted chunk: DETACH DELETE chunk, or tombstone (deletedAt)</text>
    <text x="40" y="312">orphan clean-up: entities with no FROM_CHUNK edge left</text>
    <text x="40" y="332">entity merge: move relationships, keep aliases</text>
    <text x="40" y="352">every write idempotent (MERGE on keys), per-document transaction</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#k)" fill="none">
    <line x1="440" y1="295" x2="478" y2="295"/>
    <line x1="710" y1="370" x2="710" y2="398"/>
  </g>

  <rect x="20" y="400" width="920" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g font-size="12" fill="#0c4a6e">
    <text x="36" y="424" font-size="14" font-weight="bold">Retrieval over the graph</text>
    <text x="36" y="446">vector search on chunks + graph expansion (VectorCypherRetriever) | hybrid vector + full-text | text-to-Cypher for counts and paths</text>
    <text x="36" y="466">local search: entities near the question | global search: community summaries (Microsoft GraphRAG)</text>
  </g>
</svg>
