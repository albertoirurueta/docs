<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Storyboard: an admin reviews a private team app</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Storyboard: an admin reviews a private team app</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g><text x="26" y="106" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Bookshelf team</text><rect x="26" y="116" width="112" height="34" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="34" y="137" font-size="11" fill="#374151" text-anchor="start">Profile menu</text><rect x="26" y="160" width="112" height="34" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="34" y="181" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Settings</text><text x="26" y="226" font-size="10" fill="#6B7280" text-anchor="start">Owner or admin</text><text x="26" y="239" font-size="10" fill="#6B7280" text-anchor="start">only</text></g>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="82.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Open the profile</text><text x="82.0" y="338" font-size="12" fill="#374151" text-anchor="middle">menu, Settings</text>
  <g><rect x="174" y="88" width="120" height="196" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><text x="180" y="106" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Settings</text><text x="180" y="128" font-size="10" fill="#6B7280" text-anchor="start">People</text><text x="180" y="146" font-size="10" fill="#6B7280" text-anchor="start">Brand</text><text x="180" y="164" font-size="10" fill="#6B7280" text-anchor="start">Billing</text><rect x="178" y="184" width="112" height="24" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="184" y="200" font-size="11" fill="#92400E" text-anchor="start" font-weight="bold">Private apps</text><text x="180" y="236" font-size="10" fill="#374151" text-anchor="start">Submitted app</text><text x="180" y="250" font-size="10" fill="#374151" text-anchor="start">waits here</text></g>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="234.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Go to the</text><text x="234.0" y="338" font-size="12" fill="#374151" text-anchor="middle">Private apps tab</text>
  <g><text x="330" y="106" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Private apps</text><rect x="330" y="116" width="112" height="40" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="338" y="134" font-size="11" fill="#374151" text-anchor="start">Cover Tool</text><text x="338" y="148" font-size="10" fill="#6B7280" text-anchor="start">Submitted</text><rect x="340" y="176" width="92" height="22" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="386.0" y="191" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Preview</text><text x="330" y="232" font-size="10" fill="#6B7280" text-anchor="start">Check each</text><text x="330" y="245" font-size="10" fill="#6B7280" text-anchor="start">extension</text></g>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="386.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Preview the</text><text x="386.0" y="338" font-size="12" fill="#374151" text-anchor="middle">submitted app</text>
  <g><rect x="478" y="88" width="120" height="196" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><text x="484" y="106" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Cover Tool</text><rect x="484" y="116" width="108" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="490" y="131" font-size="10" fill="#374151" text-anchor="start">Extension 1</text><rect x="484" y="144" width="108" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="490" y="159" font-size="10" fill="#374151" text-anchor="start">Extension 2</text><rect x="484" y="190" width="50.0" height="22" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="509.0" y="205" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Release</text><rect x="542.0" y="190" width="50.0" height="22" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/><text x="567.0" y="205" font-size="11" fill="#4B5563" text-anchor="middle" font-weight="bold">Reject</text></g>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="538.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Release or</text><text x="538.0" y="338" font-size="12" fill="#374151" text-anchor="middle">reject it</text>
  <g><rect x="634" y="92" width="100" height="150" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><text x="684.0" y="112" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold">Team members</text><rect x="642" y="124" width="84" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="684.0" y="139" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Apps tab</text><rect x="642" y="152" width="84" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="684.0" y="167" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Effects panel</text><rect x="642" y="180" width="84" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="684.0" y="195" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Publish menu</text><text x="684.0" y="262" font-size="10" fill="#374151" text-anchor="middle">Never in the</text><text x="684.0" y="275" font-size="10" fill="#374151" text-anchor="middle">public directory</text></g>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
  <text x="684.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Team members</text><text x="684.0" y="338" font-size="12" fill="#374151" text-anchor="middle">can use it</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of generic screens, not a screenshot of any product.</text>
</svg>
