<svg viewBox="0 0 900 480" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Auto Scaling group across two Availability Zones behind an Application Load Balancer</text>

  <!-- Users -->
  <rect x="30" y="200" width="110" height="50" rx="8" fill="#f1f3f4" stroke="#5c6b7a" stroke-width="1.6"/>
  <text x="85" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Clients</text>
  <text x="85" y="238" text-anchor="middle" font-size="10.5" fill="#3c4a58">HTTPS requests</text>
  <line x1="140" y1="225" x2="196" y2="225" stroke="#3c4a58" stroke-width="2"/>
  <polygon points="196,225 187,220 187,230" fill="#3c4a58"/>

  <!-- VPC -->
  <rect x="190" y="44" width="690" height="418" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="206" y="66" font-size="13" font-weight="700" fill="#3c4a58">VPC (Bookshelf)</text>

  <!-- ALB -->
  <rect x="210" y="190" width="150" height="70" rx="8" fill="#fff4e0" stroke="#e8710a" stroke-width="2"/>
  <text x="285" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4500">alb-bookshelf</text>
  <text x="285" y="234" text-anchor="middle" font-size="10.5" fill="#8a4500">listener + target group</text>
  <text x="285" y="249" text-anchor="middle" font-size="10.5" fill="#8a4500">health check /actuator/health</text>

  <!-- AZ A -->
  <rect x="410" y="84" width="230" height="260" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="525" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone A (private subnet)</text>
  <rect x="430" y="122" width="190" height="52" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="525" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">EC2 instance</text>
  <text x="525" y="161" text-anchor="middle" font-size="10" fill="#3c4a58">catalog-api, launch template v3</text>
  <rect x="430" y="186" width="190" height="52" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="525" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">EC2 instance</text>
  <text x="525" y="225" text-anchor="middle" font-size="10" fill="#3c4a58">catalog-api, launch template v3</text>
  <rect x="430" y="250" width="190" height="52" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="5,4"/>
  <text x="525" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a73e8">scale-out slot</text>
  <text x="525" y="289" text-anchor="middle" font-size="10" fill="#3c4a58">launched when a policy fires</text>

  <!-- AZ B -->
  <rect x="660" y="84" width="205" height="260" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="762" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a72">Availability Zone B (private subnet)</text>
  <rect x="678" y="122" width="170" height="52" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="763" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">EC2 instance</text>
  <text x="763" y="161" text-anchor="middle" font-size="10" fill="#3c4a58">catalog-api, launch template v3</text>
  <rect x="678" y="186" width="170" height="52" rx="6" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="763" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">EC2 instance</text>
  <text x="763" y="225" text-anchor="middle" font-size="10" fill="#3c4a58">catalog-api, launch template v3</text>
  <rect x="678" y="250" width="170" height="52" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="5,4"/>
  <text x="763" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a73e8">scale-out slot</text>
  <text x="763" y="289" text-anchor="middle" font-size="10" fill="#3c4a58">balanced across zones</text>

  <!-- ALB arrows -->
  <line x1="360" y1="215" x2="426" y2="148" stroke="#e8710a" stroke-width="1.8"/>
  <polygon points="426,148 417,150 422,157" fill="#e8710a"/>
  <line x1="360" y1="225" x2="426" y2="212" stroke="#e8710a" stroke-width="1.8"/>
  <polygon points="426,212 417,208 418,217" fill="#e8710a"/>
  <path d="M 285 190 C 285 100, 500 76, 676 100 C 700 104, 700 140, 676 146" fill="none" stroke="#e8710a" stroke-width="1.6"/>
  <polygon points="676,146 685,148 681,139" fill="#e8710a"/>
  <path d="M 285 260 C 285 380, 600 372, 676 214" fill="none" stroke="#e8710a" stroke-width="1.6"/>
  <polygon points="676,214 670,222 680,222" fill="#e8710a"/>

  <!-- ASG box -->
  <rect x="400" y="360" width="470" height="90" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="635" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d5a24">Auto Scaling group bookshelf-catalog-asg</text>
  <text x="635" y="401" text-anchor="middle" font-size="10.5" fill="#1e4620">min 2 / desired 4 / max 8 - launch template - health check type ELB</text>
  <text x="635" y="418" text-anchor="middle" font-size="10.5" fill="#1e4620">target tracking on ALBRequestCountPerTarget + scheduled actions</text>
  <text x="635" y="435" text-anchor="middle" font-size="10.5" fill="#1e4620">replaces unhealthy instances and rebalances across both zones</text>

  <!-- CloudWatch -->
  <rect x="210" y="360" width="170" height="90" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.6"/>
  <text x="295" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#8c1511">CloudWatch</text>
  <text x="295" y="405" text-anchor="middle" font-size="10.5" fill="#8c1511">metrics and alarms</text>
  <text x="295" y="421" text-anchor="middle" font-size="10.5" fill="#8c1511">drive the scaling policies</text>
  <line x1="380" y1="405" x2="396" y2="405" stroke="#8c1511" stroke-width="1.8"/>
  <polygon points="396,405 388,400 388,410" fill="#8c1511"/>
</svg>
