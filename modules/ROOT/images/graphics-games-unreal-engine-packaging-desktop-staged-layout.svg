<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A packaged Win64 build: where things land</text>
<rect x="14" y="50" width="400" height="350" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="30" y="80" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Staging directory (the folder you pick)</text>
<text x="52" y="114" text-anchor="start" font-size="11" fill="#374151">Bookshelf.exe   the executable, named after the project</text>
<text x="52" y="148" text-anchor="start" font-size="11" fill="#374151">Engine/   engine content, config and binaries it needs</text>
<text x="52" y="182" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Bookshelf/</text>
<text x="74" y="216" text-anchor="start" font-size="11" fill="#374151">Binaries/Win64/   the Shipping executable and DLLs</text>
<text x="74" y="250" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Content/Paks/   .pak or .utoc and .ucas containers</text>
<text x="74" y="284" text-anchor="start" font-size="11" fill="#374151">Config/   packaged ini files</text>
<text x="74" y="318" text-anchor="start" font-size="11" fill="#374151">Plugins/   plugin content that ships</text>
<text x="52" y="352" text-anchor="start" font-size="11" fill="#374151">Prerequisites installer, if Include Prerequisites is on</text>
<rect x="440" y="50" width="306" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="593" y="72" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Containers in Content/Paks</text>
<text x="593" y="96" text-anchor="middle" font-size="11" fill="#374151">.pak: an archive of cooked files</text>
<text x="593" y="114" text-anchor="middle" font-size="11" fill="#374151">.utoc: the table of contents</text>
<text x="593" y="132" text-anchor="middle" font-size="11" fill="#374151">.ucas: the compressed asset data</text>
<text x="593" y="150" text-anchor="middle" font-size="11" fill="#374151">Generate Chunks makes several</text>
<text x="593" y="168" text-anchor="middle" font-size="11" fill="#374151">containers for streaming installs</text>
<rect x="440" y="226" width="306" height="174" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="593" y="248" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Keep for patches and DLC</text>
<text x="593" y="272" text-anchor="middle" font-size="11" fill="#374151">Releases/&lt;version&gt;/Win64 holds the</text>
<text x="593" y="290" text-anchor="middle" font-size="11" fill="#374151">asset registry and the pak files of</text>
<text x="593" y="308" text-anchor="middle" font-size="11" fill="#374151">the release. A patch or DLC build is</text>
<text x="593" y="326" text-anchor="middle" font-size="11" fill="#374151">compared against them, so archive</text>
<text x="593" y="344" text-anchor="middle" font-size="11" fill="#374151">them with every shipped version.</text>
<text x="380" y="414" text-anchor="middle" font-size="11" fill="#374151">Exact file names depend on the options; the layout shows the usual Windows build.</text>
</svg>
