<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
<title id="t">How resample assigns five-minute samples to 15-minute bins</title>
<desc id="d">Twelve samples at five-minute spacing are grouped into 15-minute bins twice. With closed left and label left, bins are half open on the right and labelled by their left edge. With closed right and label right, bins are half open on the left and labelled by their right edge, so the sample at 00:00 falls alone in the bin ending at 00:00.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
<text x="360" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#0F172A" >resample(&quot;15min&quot;): which bin does each sample fall in?</text>
<text x="60" y="60" font-size="15" text-anchor="start" font-weight="bold" fill="#0F172A" >closed=&quot;left&quot;, label=&quot;left&quot;  (default for 15min)</text>
<rect x="150" y="90" width="105" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="202.5" y="82" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">[00:00, 00:15)</text>
<text x="202.5" y="170" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:00</text>
<text x="202.5" y="188" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 3</text>
<rect x="255" y="90" width="105" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="307.5" y="82" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">[00:15, 00:30)</text>
<text x="307.5" y="170" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:15</text>
<text x="307.5" y="188" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 12</text>
<rect x="360" y="90" width="105" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="412.5" y="82" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">[00:30, 00:45)</text>
<text x="412.5" y="170" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:30</text>
<text x="412.5" y="188" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 21</text>
<rect x="465" y="90" width="105" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="517.5" y="82" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">[00:45, 01:00)</text>
<text x="517.5" y="170" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:45</text>
<text x="517.5" y="188" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 30</text>
<text x="60" y="220" font-size="15" text-anchor="start" font-weight="bold" fill="#0F172A" >closed=&quot;right&quot;, label=&quot;right&quot;  (default for ME, W, QE, YE)</text>
<rect x="45" y="250" width="105" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="97.5" y="242" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">(23:45, 00:00]</text>
<text x="97.5" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:00</text>
<text x="97.5" y="348" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 0</text>
