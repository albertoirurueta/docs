<text x="412.5" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 00:45</text>
<text x="412.5" y="348" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 24</text>
<rect x="465" y="250" width="105" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="517.5" y="242" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" font-family="Menlo, Consolas, monospace">(00:45, 01:00]</text>
<text x="517.5" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F172A" font-family="Menlo, Consolas, monospace">label 01:00</text>
<text x="517.5" y="348" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 21</text>
