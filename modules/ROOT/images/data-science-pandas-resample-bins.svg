<text x="307.5" y="348" font-size="13" text-anchor="middle" font-weight="bold" fill="#B45309" font-family="Menlo, Consolas, monospace">sum = 15</text>
<rect x="360" y="250" width="105" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
