<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A render graph: passes read and write resources, and the graph is compiled before it runs</text>
<rect x="118.7" y="44" width="313.3" height="80" rx="10" fill="none" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="20.0" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="66.0" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Main light</text>
<text x="66.0" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">shadow map</text>
<rect x="124.7" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.7" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Draw</text>
<text x="170.7" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">opaques</text>
<rect x="229.3" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.3" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Draw</text>
<text x="275.3" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">skybox</text>
<rect x="334.0" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Draw</text>
<text x="380.0" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">transparents</text>
<rect x="438.7" y="56" width="92" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="484.7" y="75.8" text-anchor="middle" font-size="11" fill="#92400E">Warm tint</text>
<text x="484.7" y="89.8" text-anchor="middle" font-size="11" fill="#92400E">(custom blit)</text>
<rect x="543.3" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="589.3" y="75.8" text-anchor="middle" font-size="11" fill="#3730A3">Post-</text>
<text x="589.3" y="89.8" text-anchor="middle" font-size="11" fill="#3730A3">processing</text>
<rect x="648.0" y="56" width="92" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="694.0" y="82.8" text-anchor="middle" font-size="11" fill="#3730A3">Final blit</text>
<text x="275.4" y="118" text-anchor="middle" font-size="10" fill="#4B5563">merged into one native pass on tile-based GPUs</text>
<rect x="20" y="196" width="140" height="32" rx="16" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="90.0" y="216.2" text-anchor="middle" font-size="12" fill="#374151">ShadowMap</text>
<rect x="190" y="196" width="150" height="32" rx="16" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="265.0" y="216.2" text-anchor="middle" font-size="12" fill="#374151">CameraColor</text>
<rect x="370" y="196" width="140" height="32" rx="16" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="440.0" y="216.2" text-anchor="middle" font-size="12" fill="#374151">CameraDepth</text>
<rect x="540" y="196" width="200" height="32" rx="16" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="216.2" text-anchor="middle" font-size="12" fill="#92400E">_WarmTintTexture</text>
<line x1="66.0" y1="102" x2="90" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="160.7" y1="124" x2="250" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="370.0" y1="124" x2="300" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="283.3" y1="124" x2="430" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="280" y1="196" x2="468.7" y2="102" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="494.7" y1="102" x2="600" y2="196" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="660" y1="196" x2="585.3" y2="102" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="688.0" y1="102" x2="330" y2="196" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="20" y="250" width="350" height="118" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="277.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">What the compiler does</text>
<text x="195.0" y="291.9" text-anchor="middle" font-size="11" fill="#374151">Drops a pass nobody reads (culling).</text>
<text x="195.0" y="305.9" text-anchor="middle" font-size="11" fill="#374151">Allocates a resource just before its first</text>
<text x="195.0" y="319.9" text-anchor="middle" font-size="11" fill="#374151">writer and frees it after its last reader.</text>
<text x="195.0" y="333.9" text-anchor="middle" font-size="11" fill="#374151">Reuses memory of equal descriptors.</text>
<text x="195.0" y="347.9" text-anchor="middle" font-size="11" fill="#374151">Merges compatible passes (on-tile).</text>
<rect x="390" y="250" width="350" height="118" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="277.9" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">What you declare in RecordRenderGraph</text>
<text x="565.0" y="291.9" text-anchor="middle" font-size="11" fill="#3730A3">builder.UseTexture(handle) for reads.</text>
<text x="565.0" y="305.9" text-anchor="middle" font-size="11" fill="#3730A3">builder.SetRenderAttachment(handle, 0)</text>
<text x="565.0" y="319.9" text-anchor="middle" font-size="11" fill="#3730A3">for the colour target; depth likewise.</text>
<text x="565.0" y="333.9" text-anchor="middle" font-size="11" fill="#3730A3">builder.AllowPassCulling(false) only</text>
<text x="565.0" y="347.9" text-anchor="middle" font-size="11" fill="#3730A3">while debugging.</text>
<rect x="20" y="380" width="720" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="396.9" text-anchor="middle" font-size="11" fill="#92400E">Solid arrow: the pass writes the resource. Dashed arrow: the pass reads it. Amber: the custom pass and its temporary texture;</text>
<text x="380.0" y="410.9" text-anchor="middle" font-size="11" fill="#92400E">the graph then points CameraColor at the new texture.</text>
</svg>
