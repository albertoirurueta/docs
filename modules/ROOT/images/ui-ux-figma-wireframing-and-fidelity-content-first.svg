<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Content first: lorem ipsum versus real Bookshelf copy</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="30" y="50" width="320" height="230" rx="12"/><rect x="410" y="50" width="320" height="230" rx="12"/></g>
  <path d="M356,165 L404,165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- left -->
  <rect x="46" y="66" width="86" height="110" fill="#E5E7EB"/>
  <text x="146" y="86" font-size="12" fill="#6B7280">Lorem ipsum dolor sit</text><text x="146" y="104" font-size="12" fill="#6B7280">Consectetur elit</text>
  <rect x="146" y="116" width="80" height="22" rx="4" fill="none" stroke="#9CA3AF"/><text x="186" y="131" font-size="10" fill="#6B7280" text-anchor="middle">Button</text>
  <text x="46" y="200" font-size="12" fill="#6B7280">Sed do eiusmod tempor incididunt ut labore</text>
  <text x="46" y="218" font-size="12" fill="#6B7280">et dolore magna aliqua.</text>
  <text x="190" y="262" font-size="12" fill="#B91C1C" text-anchor="middle">Fits any layout, proves nothing</text>
  <!-- right -->
  <rect x="426" y="66" width="86" height="110" fill="#E5E7EB"/>
  <text x="526" y="86" font-size="12" font-weight="bold" fill="#1F2937">The Left Hand of Darkness</text><text x="526" y="104" font-size="12" fill="#374151">Ursula K. Le Guin</text>
  <rect x="526" y="116" width="86" height="22" rx="4" fill="none" stroke="#4F46E5"/><text x="569" y="131" font-size="10" fill="#3730A3" text-anchor="middle">Add to shelf</text>
  <text x="426" y="200" font-size="12" fill="#374151">4.3 stars, 212 reviews. Not yet read by anyone</text>
  <text x="426" y="218" font-size="12" fill="#374151">in your book club.</text>
  <text x="570" y="262" font-size="12" fill="#047857" text-anchor="middle">Long title and empty state exposed early</text>
  <circle cx="30" cy="50" r="11" fill="#4F46E5"/><circle cx="410" cy="50" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="54">1</text><text x="410" y="54">2</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="190" y="308">Filler text</text><text x="570" y="308">Realistic content</text></g>
  <text x="380" y="338" font-size="12" fill="#3730A3" text-anchor="middle">Real copy makes wraps, truncation and empty states visible at low fidelity.</text>
</svg>
