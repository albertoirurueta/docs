<title id="webalmanac-vitals-desktop-t">Web Almanac 2025 vitals, desktop</title>
<desc id="webalmanac-vitals-desktop-d">Share of desktop origins with a good Largest Contentful Paint, Interaction to Next Paint, Cumulative Layout Shift and all three together, per platform, from the Web Almanac 2025 e-commerce chapter. INP is good for almost every platform on desktop; LCP separates the platforms most, with Shopify at the top.</desc>
