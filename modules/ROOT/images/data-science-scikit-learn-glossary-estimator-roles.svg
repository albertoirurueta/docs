<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img">
<title>Estimator roles in scikit-learn</title>
<desc>A base estimator with fit, get_params and set_params, and five roles built on it: classifier, regressor, clusterer, transformer and outlier detector, each with its characteristic methods and an example class.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start">One base contract, several roles</text>
<rect x="210" y="56" width="300" height="62" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360.0" y="81.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Estimator (BaseEstimator)</text>
<text x="360.0" y="101.9" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">fit(X, y)   get_params   set_params</text>
<line x1="360" y1="118" x2="80.0" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="14" y="172" width="132" height="112" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="80.0" y="205.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Classifier</text>
<text x="80.0" y="223.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">predict</text>
<text x="80.0" y="241.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">predict_proba</text>
<text x="80.0" y="259.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">score = accuracy</text>
<text x="80.0" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">LogisticRegression</text>
<line x1="360" y1="118" x2="220.0" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="154" y="172" width="132" height="112" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="220.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Regressor</text>
<text x="220.0" y="232.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">predict</text>
<text x="220.0" y="250.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">score = R2</text>
<text x="220.0" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">Ridge</text>
<line x1="360" y1="118" x2="360.0" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="294" y="172" width="132" height="112" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Clusterer</text>
<text x="360.0" y="232.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">fit_predict</text>
<text x="360.0" y="250.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">labels_</text>
<text x="360.0" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">KMeans</text>
<line x1="360" y1="118" x2="500.0" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="434" y="172" width="132" height="112" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="500.0" y="205.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Transformer</text>
<text x="500.0" y="223.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">transform</text>
<text x="500.0" y="241.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">fit_transform</text>
<text x="500.0" y="259.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">inverse_transform</text>
<text x="500.0" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">StandardScaler</text>
<line x1="360" y1="118" x2="640.0" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="574" y="172" width="132" height="112" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="640.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Outlier detector</text>
<text x="640.0" y="232.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">predict: 1 or -1</text>
<text x="640.0" y="250.2" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">score_samples</text>
<text x="640.0" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">IsolationForest</text>
<text x="360" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">A Pipeline or GridSearchCV wraps another estimator and is itself an estimator (a meta-estimator).</text>
</svg>
