<text x="190" y="304" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">reversed: 1 at near, 0 at far</text>
<text x="220" y="94" font-size="1" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="190" y="120" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">standard: 0 at near, 1 at far</text>
<rect x="510" y="70" width="220" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="620.0" y="90.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Why it helps</text>
<text x="620.0" y="105.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">A float depth has its finest</text>
<text x="620.0" y="120.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">spacing near 0.</text>
<text x="620.0" y="135.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Reversed-Z puts far geometry</text>
<text x="620.0" y="150.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">there, balancing the 1 / z curve.</text>
<rect x="510" y="182" width="220" height="92" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="202.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">What changes</text>
<text x="620.0" y="217.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">clear depth to 0</text>
<text x="620.0" y="232.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">compare GREATER</text>
<text x="620.0" y="247.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">clip control 0..1 in GL</text>
<text x="620.0" y="262.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">D32_FLOAT or equal</text>
<rect x="510" y="294" width="220" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="313.0" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Bonus</text>
<text x="620.0" y="328.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">infinite far plane is easy:</text>
<text x="620.0" y="343.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">row 3 is (0, 0, 0, n)</text>
<text x="380" y="410" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Both curves are the 1 / z shape; the float format makes the reversed one far more precise at long range.</text>
</svg>
