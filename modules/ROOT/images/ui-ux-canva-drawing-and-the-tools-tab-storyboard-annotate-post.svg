  <text x="82" y="322" font-size="12" fill="#374151" text-anchor="middle">Open the post, select</text><text x="82" y="338" font-size="12" fill="#374151" text-anchor="middle">Tools in the side panel</text>
  <!-- 2 -->
  <rect x="182" y="100" width="104" height="140" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="190" y="108" width="88" height="22" rx="5" fill="#FFFFFF" stroke="#4F46E5"/><text x="198" y="123" font-size="11" fill="#374151">Pen  Marker  Hi..</text>
  <rect x="190" y="136" width="88" height="14" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="190" y="154" width="88" height="14" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
