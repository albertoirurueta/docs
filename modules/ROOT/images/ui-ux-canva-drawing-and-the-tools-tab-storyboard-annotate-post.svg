  <rect x="34" y="108" width="18" height="10" rx="2" fill="#9CA3AF"/><rect x="34" y="122" width="18" height="10" rx="2" fill="#9CA3AF"/><rect x="34" y="136" width="18" height="10" rx="2" fill="#4F46E5"/>
