<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The inverted index: documents &#8594; terms &#8594; postings lists</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">each term is stored once, with the list of documents it occurs in</text>

  <!-- three source documents -->
  <rect x="40" y="60" width="210" height="66" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="54" y="80" font-size="12" font-weight="bold" fill="#222222">Doc 0</text>
  <text x="54" y="102" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">The quick brown fox</text>

  <rect x="275" y="60" width="210" height="66" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="289" y="80" font-size="12" font-weight="bold" fill="#222222">Doc 1</text>
  <text x="289" y="102" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">A quick brown dog</text>

  <rect x="510" y="60" width="210" height="66" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="524" y="80" font-size="12" font-weight="bold" fill="#222222">Doc 2</text>
  <text x="524" y="102" font-family="'Courier New', monospace" font-size="12" fill="#1c4b73">Lazy brown foxes</text>

  <path d="M145,126 L145,146" stroke="#999999" stroke-width="1.4"/>
  <polygon points="139,144 151,144 145,152" fill="#999999"/>
  <path d="M380,126 L380,146" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,144 386,144 380,152" fill="#999999"/>
  <path d="M615,126 L615,146" stroke="#999999" stroke-width="1.4"/>
  <polygon points="609,144 621,144 615,152" fill="#999999"/>

  <!-- analysis band -->
  <rect x="40" y="154" width="680" height="44" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="54" y="172" font-size="12" font-weight="bold" fill="#2f5424">Analysis</text>
  <text x="54" y="190" font-size="11" fill="#666666">lowercase, split on word boundaries (positions kept: 0, 1, 2, &#8230;)</text>

  <path d="M380,198 L380,216" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,214 386,214 380,222" fill="#999999"/>

  <!-- term stream -->
  <rect x="40" y="224" width="680" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <g font-family="'Courier New', monospace" font-size="12" fill="#222222">
    <text x="54" y="244">Doc 0 &#8594; [the] [quick] [brown] [fox]</text>
    <text x="54" y="264">Doc 1 &#8594; [a] [quick] [brown] [dog]</text>
    <text x="54" y="284">Doc 2 &#8594; [lazy] [brown] [foxes]</text>
  </g>

  <path d="M380,296 L380,314" stroke="#999999" stroke-width="1.4"/>
  <polygon points="374,312 386,312 380,320" fill="#999999"/>

  <!-- inverted index -->
  <rect x="40" y="322" width="680" height="126" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="54" y="341" font-size="12" font-weight="bold" fill="#222222">Inverted index &#8212; term &#8594; postings list (docId, freq, positions)</text>
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#1c4b73">
    <text x="54" y="361">brown &#8594; (0, 1, [2])  (1, 1, [2])  (2, 1, [1])</text>
    <text x="54" y="379">quick &#8594; (0, 1, [1])  (1, 1, [1])</text>
    <text x="54" y="397">fox   &#8594; (0, 1, [3])</text>
    <text x="54" y="415">foxes &#8594; (2, 1, [2])</text>
    <text x="430" y="397" fill="#999999" font-size="10.5">dog &#8594; (1, 1, [3])</text>
    <text x="430" y="415" fill="#999999" font-size="10.5">lazy &#8594; (2, 1, [0])</text>
  </g>
  <text x="54" y="437" font-size="10.5" fill="#666666">terms are kept in sorted order; one postings list per term drives every query that mentions it</text>
</svg>
