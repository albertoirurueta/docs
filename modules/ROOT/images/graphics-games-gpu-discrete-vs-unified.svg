<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gpu-discrete-vs-unified" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Discrete GPU memory versus unified memory</text>
<rect x="20" y="50" width="350" height="320" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<rect x="390" y="50" width="350" height="320" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Discrete GPU (desktop)</text>
<text x="565" y="74" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Unified memory (phones, Apple silicon)</text>
<rect x="40" y="100" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="126.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU</text>
<rect x="220" y="100" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="126.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU</text>
<rect x="40" y="230" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="259.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">System RAM</text>
<rect x="220" y="230" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="259.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">VRAM</text>
<line x1="105" y1="144" x2="105" y2="230" stroke="#4B5563" stroke-width="1.5"/>
<line x1="285" y1="144" x2="285" y2="230" stroke="#4B5563" stroke-width="1.5"/>
<line x1="170" y1="255" x2="220" y2="255" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gpu-discrete-vs-unified)"/>
<line x1="220" y1="265" x2="170" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gpu-discrete-vs-unified)"/>
<text x="195" y="305" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">PCIe copy between pools</text>
<text x="195" y="330" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">upload via a staging buffer</text>
<rect x="410" y="100" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475.0" y="126.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU cores</text>
<rect x="590" y="100" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="655.0" y="126.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU cores</text>
<rect x="410" y="230" width="310" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="259.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">One memory pool</text>
<line x1="475" y1="144" x2="475" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gpu-discrete-vs-unified)"/>
<line x1="655" y1="144" x2="655" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gpu-discrete-vs-unified)"/>
<text x="565" y="305" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">both see the same bytes</text>
<text x="565" y="330" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">still synchronise and set cache policy</text>
</svg>
