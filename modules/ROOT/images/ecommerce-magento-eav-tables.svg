<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How an EAV attribute value is stored</title>
  <desc id="d">The product row in catalog_product_entity holds only fixed columns. The attribute definition in eav_attribute names the attribute and its backend type. The value is stored in one of the typed value tables (int, varchar, text, decimal, datetime), keyed by entity_id, attribute_id and store_id. For the Pocket Coffee origin attribute the int table holds option id 4, which eav_attribute_option_value maps to the label Ethiopia Yirgacheffe.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">One attribute value: from the entity row to the typed value table</text>

  <!-- entity table -->
  <rect x="30" y="60" width="270" height="150" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="165" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#f2f5f8">catalog_product_entity</text>
  <text x="46" y="110" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">entity_id = 2</text>
  <text x="46" y="130" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">attribute_set_id = 4</text>
  <text x="46" y="150" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">type_id = simple</text>
  <text x="46" y="170" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">sku = PC-ETH-WHL-250</text>
  <text x="46" y="196" font-size="11" fill="#f2f5f8">fixed (static) columns only</text>

  <!-- attribute definition -->
  <rect x="345" y="60" width="285" height="150" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="487" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#f2f5f8">eav_attribute</text>
  <text x="361" y="110" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">attribute_id = 147</text>
  <text x="361" y="130" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">entity_type_id = 4</text>
  <text x="361" y="150" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">attribute_code = pc_origin</text>
  <text x="361" y="170" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">backend_type = int</text>
  <text x="361" y="190" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">source_model = ...Source\Table</text>

  <!-- metadata extension -->
  <rect x="675" y="60" width="255" height="150" rx="8" fill="#6b5b95" stroke="#f2f5f8"/>
  <text x="802" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#f2f5f8">catalog_eav_attribute</text>
  <text x="691" y="110" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">attribute_id = 147</text>
  <text x="691" y="130" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">is_global = 1 (global)</text>
  <text x="691" y="150" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">is_filterable = 1</text>
  <text x="691" y="170" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">used_in_product_listing = 1</text>
  <text x="691" y="196" font-size="11" fill="#f2f5f8">catalog-only flags and scope</text>

  <line x1="487" y1="212" x2="487" y2="250" stroke="#f2f5f8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="236" font-size="11" fill="#f2f5f8">backend_type picks the value table</text>

  <!-- value tables -->
  <text x="480" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#f2f5f8">Typed value tables, one row per entity, attribute and store</text>
  <rect x="30" y="284" width="170" height="60" rx="6" fill="#34495e" stroke="#f2f5f8"/>
  <text x="115" y="308" text-anchor="middle" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">..._entity_varchar</text>
  <text x="115" y="328" text-anchor="middle" font-size="11" fill="#f2f5f8">strings, URL keys, names</text>
  <rect x="215" y="284" width="170" height="60" rx="6" fill="#3f6e9a" stroke="#f2f5f8" stroke-width="2.5"/>
  <text x="300" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">..._entity_int</text>
  <text x="300" y="328" text-anchor="middle" font-size="11" fill="#f2f5f8">flags, option ids, status</text>
  <rect x="400" y="284" width="170" height="60" rx="6" fill="#34495e" stroke="#f2f5f8"/>
  <text x="485" y="308" text-anchor="middle" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">..._entity_text</text>
  <text x="485" y="328" text-anchor="middle" font-size="11" fill="#f2f5f8">descriptions, long text</text>
  <rect x="585" y="284" width="170" height="60" rx="6" fill="#34495e" stroke="#f2f5f8"/>
  <text x="670" y="308" text-anchor="middle" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">..._entity_decimal</text>
  <text x="670" y="328" text-anchor="middle" font-size="11" fill="#f2f5f8">prices, weights</text>
  <rect x="770" y="284" width="160" height="60" rx="6" fill="#34495e" stroke="#f2f5f8"/>
  <text x="850" y="308" text-anchor="middle" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">..._entity_datetime</text>
  <text x="850" y="328" text-anchor="middle" font-size="11" fill="#f2f5f8">dates, roast date</text>

  <!-- row -->
  <rect x="150" y="380" width="360" height="110" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="330" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">catalog_product_entity_int row</text>
  <text x="166" y="428" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">entity_id = 2   attribute_id = 147</text>
  <text x="166" y="448" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">store_id = 0 (all store views)</text>
  <text x="166" y="468" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">value = 4</text>
  <line x1="300" y1="346" x2="300" y2="378" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- option -->
  <rect x="580" y="380" width="350" height="110" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="755" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">eav_attribute_option_value</text>
  <text x="596" y="428" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">option_id = 4   store_id = 0</text>
  <text x="596" y="448" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">value = Ethiopia Yirgacheffe</text>
  <text x="596" y="474" font-size="11" fill="#f2f5f8">the label shown by source_model Table</text>
  <line x1="512" y1="434" x2="578" y2="434" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="480" y="526" text-anchor="middle" font-size="12" fill="#f2f5f8">Reading a product with five EAV attributes joins up to five value tables unless an index or the flat table is used.</text>
</svg>
