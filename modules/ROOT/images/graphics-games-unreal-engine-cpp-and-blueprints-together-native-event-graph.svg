<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Overriding a BlueprintNativeEvent in BP_Book</text>
<rect x="15" y="46" width="235" height="270" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="132" y="68" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">ABookActor (C++)</text>
<text x="28" y="96" text-anchor="start" font-size="11" fill="#1F2937">UFUNCTION(BlueprintNativeEvent)</text>
<text x="28" y="114" text-anchor="start" font-size="11" fill="#1F2937">void OnPulled(AActor* Puller);</text>
<text x="28" y="132" text-anchor="start" font-size="11" fill="#1F2937"></text>
<text x="28" y="150" text-anchor="start" font-size="11" fill="#1F2937">void ABookActor::OnPulled_</text>
<text x="28" y="168" text-anchor="start" font-size="11" fill="#1F2937">  Implementation(AActor* Puller)</text>
<text x="28" y="186" text-anchor="start" font-size="11" fill="#1F2937">{</text>
<text x="28" y="204" text-anchor="start" font-size="11" fill="#1F2937">  // default behaviour</text>
<text x="28" y="222" text-anchor="start" font-size="11" fill="#1F2937">  SetBookState(Held);</text>
<text x="28" y="240" text-anchor="start" font-size="11" fill="#1F2937">}</text>
<rect x="270" y="46" width="475" height="270" rx="12" fill="#F9FAFB" stroke="#047857" stroke-width="2"/>
<text x="507" y="68" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">BP_Book (Blueprint override)</text>
<rect x="285" y="100" width="140" height="70" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<path d="M285,124 L285,106 Q285,100 291,100 L419,100 Q425,100 425,106 L425,124 Z" fill="#B45309"/>
<text x="355.0" y="116" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Event On Pulled</text>
<polygon points="410,132 417,132 422,138 417,144 410,144" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="403" y="142" text-anchor="end" font-size="11" fill="#374151"></text>
<circle cx="415" cy="158" r="5" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="403" y="162" text-anchor="end" font-size="11" fill="#374151">Puller</text>
<rect x="450" y="100" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<path d="M450,124 L450,106 Q450,100 456,100 L574,100 Q580,100 580,106 L580,124 Z" fill="#4F46E5"/>
<text x="515.0" y="116" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Parent: On Pulled</text>
<polygon points="455,132 462,132 467,138 462,144 455,144" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="472" y="142" text-anchor="start" font-size="11" fill="#374151"></text>
<circle cx="460" cy="158" r="5" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="472" y="162" text-anchor="start" font-size="11" fill="#374151">Puller</text>
<polygon points="565,132 572,132 577,138 572,144 565,144" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="558" y="142" text-anchor="end" font-size="11" fill="#374151"></text>
<rect x="600" y="100" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<path d="M600,124 L600,106 Q600,100 606,100 L724,100 Q730,100 730,106 L730,124 Z" fill="#4F46E5"/>
<text x="665.0" y="116" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Spawn Emitter</text>
<polygon points="605,132 612,132 617,138 612,144 605,144" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="622" y="142" text-anchor="start" font-size="11" fill="#374151"></text>
<polygon points="715,132 722,132 727,138 722,144 715,144" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<text x="708" y="142" text-anchor="end" font-size="11" fill="#374151"></text>
<path d="M422,138 C445,138 430,138 453,138" fill="none" stroke="#1F2937" stroke-width="2"/>
<path d="M422,158 C445,158 430,158 453,158" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
<path d="M577,138 C600,138 580,138 603,138" fill="none" stroke="#1F2937" stroke-width="2"/>
<text x="515" y="210" text-anchor="middle" font-size="11" fill="#374151">Add Call to Parent Function runs ABookActor::OnPulled_Implementation,</text>
<text x="515" y="226" text-anchor="middle" font-size="11" fill="#374151">then the Blueprint adds its own nodes. Without that node the</text>
<text x="515" y="242" text-anchor="middle" font-size="11" fill="#374151">default behaviour is replaced, not extended.</text>
<text x="515" y="280" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">No override at all: the engine calls OnPulled_Implementation.</text>
</svg>
