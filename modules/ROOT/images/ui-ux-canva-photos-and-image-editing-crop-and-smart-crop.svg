188" width="8" height="8" fill="#FFFFFF" stroke="#4F46E5"/><text x="380" y="228" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Smart Crop</text><text x="380" y="244" font-size="12"  fill="#374151" text-anchor="middle">one click: most interesting part</text><text x="380" y="260" font-size="12"  fill="#374151" text-anchor="middle">best on photos, not graphics</text><rect x="510" y="56" width="220" height="150" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/><text x="620" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Crop panel</text><rect x="526" y="90" width="188" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="536" y="104" font-size="11"  fill="#374151" text-anchor="start">Ratio presets</text><rect x="526" y="116" width="188" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="536" y="130" font-size="11"  fill="#374151" text-anchor="start">Smart Crop</text><rect x="526" y="142" width="188" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="536" y="156" font-size="11"  fill="#374151" text-anchor="start">Perspective sliders</text><rect x="526" y="168" width="188" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="536" y="182" font-size="11"  fill="#374151" text-anchor="start">Done</text><text x="620" y="230" font-size="12"  fill="#374151" text-anchor="middle">Frames, grids and page</text><text x="620" y="246" font-size="12"  fill="#374151" text-anchor="middle">backgrounds work too</text><text x="620" y="262" font-size="12"  fill="#374151" text-anchor="middle">(double-click to crop in a frame)</text>
  <text x="380" y="312" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
