<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Choosing the web graphics API at start-up</text>
<rect x="30" y="55" width="190" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="76.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Graphics API list</text>
<text x="125.0" y="90.8" text-anchor="middle" font-size="11" fill="#3730A3">(Auto Graphics API off)</text>
<text x="125.0" y="104.8" text-anchor="middle" font-size="11" fill="#3730A3">WebGPU, WebGL 2</text>
<line x1="220" y1="87" x2="262" y2="87" stroke="#4B5563" stroke-width="1.5" marker-end="url(#fb)"/>
<rect x="262" y="55" width="170" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="347.0" y="76.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">First API on the list</text>
<text x="347.0" y="90.8" text-anchor="middle" font-size="11" fill="#92400E">WebGPU</text>
<text x="347.0" y="104.8" text-anchor="middle" font-size="11" fill="#92400E">device filter allows it?</text>
<line x1="432" y1="87" x2="470" y2="87" stroke="#4B5563" stroke-width="1.5" marker-end="url(#fb)"/>
<text x="450" y="80" text-anchor="middle" font-size="10" fill="#065F46">yes</text>
<rect x="470" y="55" width="260" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="600.0" y="76.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Run with WebGPU</text>
<text x="600.0" y="90.8" text-anchor="middle" font-size="11" fill="#065F46">compute shaders, indirect rendering,</text>
<text x="600.0" y="104.8" text-anchor="middle" font-size="11" fill="#065F46">GPU skinning, VFX Graph</text>
<path d="M347,119 L347,150 L470,170" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#fb)"/>
<text x="372" y="140" text-anchor="start" font-size="10" fill="#92400E">no, or browser lacks WebGPU</text>
<rect x="470" y="145" width="260" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="600.0" y="166.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Fallback: WebGL 2</text>
<text x="600.0" y="180.8" text-anchor="middle" font-size="11" fill="#374151">the next API on the list</text>
<rect x="30" y="215" width="700" height="100" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="269.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="380" y="235" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">What changes between the two (Unity Web documentation)</text>
<text x="45" y="264" text-anchor="start" font-size="11" fill="#374151" font-weight="bold">Shader code</text>
<text x="185" y="264" text-anchor="start" font-size="11" fill="#374151">WebGL 2: GLSL precision qualifiers</text>
<text x="455" y="264" text-anchor="start" font-size="11" fill="#374151">WebGPU: strict uniformity analysis</text>
<text x="45" y="284" text-anchor="start" font-size="11" fill="#374151" font-weight="bold">Compute shaders</text>
<text x="185" y="284" text-anchor="start" font-size="11" fill="#374151">WebGL 2: not supported</text>
<text x="455" y="284" text-anchor="start" font-size="11" fill="#374151">WebGPU: yes, no RWBuffer, no async compute</text>
<text x="45" y="304" text-anchor="start" font-size="11" fill="#374151" font-weight="bold">GPU readback</text>
<text x="185" y="304" text-anchor="start" font-size="11" fill="#374151">WebGL 2: synchronous readback works</text>
<text x="455" y="304" text-anchor="start" font-size="11" fill="#374151">WebGPU: use AsyncGPUReadback</text>
</svg>
