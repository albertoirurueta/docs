<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Which Keras artifact to save</title>
<desc id="d">A Keras 3 model can be written as a .keras archive for full reload, as .weights.h5 for weights only, or exported with model.export to a SavedModel, ONNX, LiteRT or other inference artifact; training state goes to checkpoints.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Which artifact to write from a Keras 3 model</text>
<rect x="270" y="55" width="180" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="83" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">keras.Model</text>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">
<rect x="20" y="170" width="200" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="120" y="196">model.save(...)</text><text x="120" y="216">name.keras</text>
<rect x="260" y="170" width="200" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="196">save_weights(...)</text><text x="360" y="216">name.weights.h5</text>
<rect x="500" y="170" width="200" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="600" y="196">model.export(...)</text><text x="600" y="216">format=...</text></g>
<g stroke="#475569" stroke-width="2" fill="none"><path d="M330,101 L130,168" marker-end="url(#ar)"/><path d="M360,101 L360,168" marker-end="url(#ar)"/><path d="M390,101 L590,168" marker-end="url(#ar)"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
<text x="120" y="264">Reload the whole model in Keras</text><text x="120" y="282">config + weights + optimizer</text>
<text x="360" y="264">Weights only; rebuild the model</text><text x="360" y="282">in code, then load_weights</text>
<text x="600" y="264">Inference artifact for other runtimes</text><text x="600" y="282">SavedModel, ONNX, LiteRT, torch</text>
<text x="360" y="312">Training-state snapshots (optimizer, step) use checkpoints, a separate mechanism</text></g>
</svg>
