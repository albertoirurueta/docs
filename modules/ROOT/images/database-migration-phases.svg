<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The five phases of a CDC-driven migration and the source of truth in each</text>

  <!-- timeline arrow -->
  <line x1="135" y1="44" x2="748" y2="44" stroke="#555555" stroke-width="1.6"/>
  <polygon points="748,39 758,44 748,49" fill="#555555"/>
  <text x="132" y="48" font-size="12" fill="#555555" text-anchor="end">time</text>

  <!-- phase headers -->
  <g font-size="12" text-anchor="middle" fill="#222222">
    <rect x="135" y="56" width="119" height="60" rx="6" fill="#f2f2f2" stroke="#666666"/>
    <text x="194.5" y="74" font-weight="bold">Phase 1</text>
    <text x="194.5" y="90">Snapshot +</text>
    <text x="194.5" y="106">streaming</text>

    <rect x="260" y="56" width="119" height="60" rx="6" fill="#f2f2f2" stroke="#666666"/>
    <text x="319.5" y="74" font-weight="bold">Phase 2</text>
    <text x="319.5" y="90">Parallel run +</text>
    <text x="319.5" y="106">reconciliation</text>

    <rect x="385" y="56" width="119" height="60" rx="6" fill="#f2f2f2" stroke="#666666"/>
    <text x="444.5" y="74" font-weight="bold">Phase 3</text>
    <text x="444.5" y="90">Read</text>
    <text x="444.5" y="106">cut-over</text>

    <rect x="510" y="56" width="119" height="60" rx="6" fill="#f2f2f2" stroke="#666666"/>
    <text x="569.5" y="74" font-weight="bold">Phase 4</text>
    <text x="569.5" y="90">Write cut-over</text>
    <text x="569.5" y="106">+ reverse CDC</text>

    <rect x="635" y="56" width="119" height="60" rx="6" fill="#f2f2f2" stroke="#666666"/>
    <text x="694.5" y="74" font-weight="bold">Phase 5</text>
    <text x="694.5" y="90">Decommission</text>
    <text x="694.5" y="106">legacy</text>
  </g>

  <!-- the switch of the source of truth, drawn behind the boxes -->
  <line x1="507" y1="122" x2="507" y2="436" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- row labels -->
  <g font-size="12" font-weight="bold" fill="#333333">
    <text x="8" y="152">Source of truth</text>
    <text x="8" y="168">(writes)</text>
    <text x="8" y="240">Reads served by</text>
    <text x="8" y="322">Change stream</text>
    <text x="8" y="404">Rollback path</text>
  </g>

  <!-- row: source of truth -->
  <rect x="135" y="128" width="369" height="64" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="319.5" y="155" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Legacy Oracle (BOOKSHOP schema)</text>
  <text x="319.5" y="174" font-size="12" fill="#444444" text-anchor="middle">legacy app writes; new DB is a copy</text>

  <rect x="510" y="128" width="244" height="64" rx="6" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="632" y="155" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">PostgreSQL (bookshop)</text>
  <text x="632" y="174" font-size="12" fill="#444444" text-anchor="middle">new app writes; Oracle is a copy</text>

  <!-- row: reads -->
  <rect x="135" y="210" width="119" height="64" rx="6" fill="#fdf3ea" stroke="#b3541e"/>
  <text x="194.5" y="246" font-size="12" fill="#222222" text-anchor="middle">Legacy app</text>

  <rect x="260" y="210" width="119" height="64" rx="6" fill="#fdf3ea" stroke="#b3541e"/>
  <text x="319.5" y="232" font-size="12" fill="#222222" text-anchor="middle">Legacy app</text>
  <text x="319.5" y="248" font-size="12" fill="#444444" text-anchor="middle">(new app reads</text>
  <text x="319.5" y="264" font-size="12" fill="#444444" text-anchor="middle">in shadow)</text>

  <rect x="385" y="210" width="369" height="64" rx="6" fill="#eef7ef" stroke="#2d6a34"/>
  <text x="569.5" y="246" font-size="12" fill="#222222" text-anchor="middle">New bookshop app, routed by the strangler proxy</text>

  <!-- row: change stream -->
  <rect x="135" y="292" width="369" height="64" rx="6" fill="#eaf1fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="319.5" y="319" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Forward CDC</text>
  <text x="319.5" y="338" font-size="12" fill="#444444" text-anchor="middle">Oracle → Debezium → Kafka → PostgreSQL</text>

  <rect x="510" y="292" width="119" height="64" rx="6" fill="#eaf1fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="569.5" y="312" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Reverse CDC</text>
  <text x="569.5" y="328" font-size="12" fill="#444444" text-anchor="middle">PostgreSQL →</text>
  <text x="569.5" y="344" font-size="12" fill="#444444" text-anchor="middle">Kafka → Oracle</text>

  <rect x="635" y="292" width="119" height="64" rx="6" fill="#f2f2f2" stroke="#666666" stroke-dasharray="4 3"/>
  <text x="694.5" y="320" font-size="12" fill="#444444" text-anchor="middle">No stream:</text>
  <text x="694.5" y="336" font-size="12" fill="#444444" text-anchor="middle">connectors gone</text>

  <!-- row: rollback -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="135" y="374" width="119" height="56" rx="6" fill="#ffffff" stroke="#999999"/>
    <text x="194.5" y="398">Drop target,</text>
    <text x="194.5" y="414">snapshot again</text>

    <rect x="260" y="374" width="119" height="56" rx="6" fill="#ffffff" stroke="#999999"/>
    <text x="319.5" y="398">Fix translator,</text>
    <text x="319.5" y="414">re-snapshot table</text>

    <rect x="385" y="374" width="119" height="56" rx="6" fill="#ffffff" stroke="#999999"/>
    <text x="444.5" y="398">Route reads</text>
    <text x="444.5" y="414">back to legacy</text>

    <rect x="510" y="374" width="119" height="56" rx="6" fill="#ffffff" stroke="#999999"/>
    <text x="569.5" y="398">Route writes</text>
    <text x="569.5" y="414">back to legacy</text>

    <rect x="635" y="374" width="119" height="56" rx="6" fill="#fbeaea" stroke="#a33a3a"/>
    <text x="694.5" y="398">Restore from</text>
    <text x="694.5" y="414">archive only</text>
  </g>

  <!-- the switch of the source of truth -->
  <text x="507" y="456" font-size="12" font-weight="bold" fill="#a33a3a" text-anchor="middle">write cut-over: the source of truth switches</text>

  <text x="380" y="486" font-size="12" fill="#555555" text-anchor="middle">Phases run per capability: the catalogue (BOOK, AUTHOR) can be in phase 4 while orders are still in phase 2.</text>
</svg>
