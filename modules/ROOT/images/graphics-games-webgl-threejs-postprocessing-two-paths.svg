<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tpp-paths" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two post-processing paths in r187</text>
<rect x="30" y="50" width="330" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="74.9" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">WebGLRenderer path</text>
<rect x="400" y="50" width="330" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="74.9" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">WebGPURenderer path</text>
<rect x="30" y="105" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">import EffectComposer, RenderPass</text>
<rect x="400" y="105" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
