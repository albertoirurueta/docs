<rect x="30" y="145" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="164.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">add UnrealBloomPass, ShaderPass</text>
<rect x="400" y="145" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="164.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">build a node graph with TSL (pass, bloom)</text>
<rect x="30" y="185" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="204.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">add OutputPass last</text>
<rect x="400" y="185" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="204.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">set renderPipeline.outputNode</text>
<rect x="30" y="225" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="244.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">composer.render() each frame</text>
<rect x="400" y="225" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="244.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">renderPipeline.render() each frame</text>
<rect x="30" y="265" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="284.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GLSL fragment shaders in ShaderPass</text>
<rect x="400" y="265" width="330" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
