<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c4b73"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c26a00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Quartz metrics pipeline: listeners to Micrometer to Prometheus to Grafana</text>
  <text x="480" y="48" font-size="12" fill="#444444" text-anchor="middle">Spring Boot 4.1.1 registers no Quartz meters; everything on the left is application code, everything to the right is standard Boot and Prometheus</text>

  <!-- JVM frame -->
  <rect x="14" y="66" width="640" height="344" rx="10" fill="#fafafa" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="28" y="86" font-size="12" font-weight="bold" fill="#1c4b73">Each Bookshelf node (one JVM, one scheduler)</text>

  <!-- Quartz box -->
  <rect x="28" y="100" width="190" height="296" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="123" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Quartz 2.5.2</text>
  <text x="123" y="140" font-size="11" fill="#444444" text-anchor="middle">worker threads and the</text>
  <text x="123" y="154" font-size="11" fill="#444444" text-anchor="middle">scheduler thread</text>
  <rect x="40" y="168" width="166" height="40" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="123" y="186" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">JobListener</text>
  <text x="123" y="200" font-size="10" fill="#444444" text-anchor="middle">before and after each job</text>
  <rect x="40" y="216" width="166" height="40" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="123" y="234" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">TriggerListener</text>
  <text x="123" y="248" font-size="10" fill="#444444" text-anchor="middle">triggerMisfired, veto</text>
  <rect x="40" y="264" width="166" height="40" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="123" y="282" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">Scheduler</text>
  <text x="123" y="296" font-size="10" fill="#444444" text-anchor="middle">getMetaData(), state queries</text>
  <rect x="40" y="312" width="166" height="72" rx="5" fill="#ffffff" stroke="#c26a00" stroke-dasharray="4 3"/>
  <text x="123" y="330" font-size="11" font-family="Menlo, Consolas, monospace" fill="#c26a00" text-anchor="middle">QRTZ_* tables</text>
  <text x="123" y="345" font-size="10" fill="#444444" text-anchor="middle">JDBC store only: check-in</text>
  <text x="123" y="358" font-size="10" fill="#444444" text-anchor="middle">age and fired rows need a</text>
  <text x="123" y="371" font-size="10" fill="#444444" text-anchor="middle">query or a database exporter</text>

  <!-- Application code box -->
  <rect x="262" y="100" width="198" height="296" rx="8" fill="#eef5fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="361" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Application code</text>
  <text x="361" y="140" font-size="11" fill="#444444" text-anchor="middle">registered with one</text>
  <text x="361" y="154" font-size="11" fill="#444444" text-anchor="middle">SchedulerFactoryBeanCustomizer</text>
  <rect x="274" y="168" width="174" height="62" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="361" y="185" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">QuartzMetricsListener</text>
  <text x="361" y="200" font-size="10" fill="#444444" text-anchor="middle">Timer quartz.job.execution</text>
  <text x="361" y="213" font-size="10" fill="#444444" text-anchor="middle">Timer quartz.job.lag</text>
  <text x="361" y="226" font-size="10" fill="#444444" text-anchor="middle">Counter quartz.trigger.misfired</text>
  <rect x="274" y="238" width="174" height="62" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="361" y="255" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">QuartzSchedulerMeters</text>
  <text x="361" y="270" font-size="10" fill="#444444" text-anchor="middle">MeterBinder bean: gauges for</text>
  <text x="361" y="283" font-size="10" fill="#444444" text-anchor="middle">running jobs, jobs executed,</text>
  <text x="361" y="296" font-size="10" fill="#444444" text-anchor="middle">standby, triggers by state</text>
  <rect x="274" y="308" width="174" height="76" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
  <text x="361" y="325" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">QuartzObservationListener</text>
  <text x="361" y="340" font-size="10" fill="#444444" text-anchor="middle">optional: one Observation per</text>
  <text x="361" y="353" font-size="10" fill="#444444" text-anchor="middle">execution gives a timer, a</text>
  <text x="361" y="366" font-size="10" fill="#444444" text-anchor="middle">long task timer and a span;</text>
  <text x="361" y="379" font-size="10" fill="#444444" text-anchor="middle">use it instead of the Timer</text>

  <!-- Micrometer box -->
  <rect x="494" y="100" width="148" height="296" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="568" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Micrometer</text>
  <text x="568" y="140" font-size="11" fill="#444444" text-anchor="middle">MeterRegistry</text>
  <text x="568" y="154" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">PrometheusMeter</text>
  <text x="568" y="167" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">Registry</text>
  <line x1="506" y1="180" x2="630" y2="180" stroke="#cccccc"/>
  <text x="568" y="198" font-size="10" fill="#444444" text-anchor="middle">dots become</text>
  <text x="568" y="211" font-size="10" fill="#444444" text-anchor="middle">underscores and a</text>
  <text x="568" y="224" font-size="10" fill="#444444" text-anchor="middle">unit suffix:</text>
  <text x="568" y="246" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">quartz_job_execution</text>
  <text x="568" y="259" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">_seconds_count</text>
  <text x="568" y="272" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">_seconds_sum</text>
  <text x="568" y="285" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">_seconds_max</text>
  <line x1="506" y1="300" x2="630" y2="300" stroke="#cccccc"/>
  <text x="568" y="318" font-size="10" font-weight="bold" fill="#222222" text-anchor="middle">/actuator/prometheus</text>
  <text x="568" y="332" font-size="10" fill="#444444" text-anchor="middle">not exposed by</text>
  <text x="568" y="345" font-size="10" fill="#444444" text-anchor="middle">default: add it to</text>
  <text x="568" y="358" font-size="10" fill="#444444" text-anchor="middle">exposure.include and</text>
  <text x="568" y="371" font-size="10" fill="#444444" text-anchor="middle">secure the port</text>

  <!-- arrows inside the JVM -->
  <path d="M 206 188 L 270 198" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 206 236 L 270 214" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 206 284 L 270 272" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 448 200 L 494 200" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 448 268 L 494 268" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 448 346 L 494 346" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <!-- Prometheus -->
  <rect x="690" y="100" width="130" height="296" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="755" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Prometheus</text>
  <text x="755" y="142" font-size="10" fill="#444444" text-anchor="middle">scrapes every</text>
  <text x="755" y="155" font-size="10" fill="#444444" text-anchor="middle">node over HTTP,</text>
  <text x="755" y="168" font-size="10" fill="#444444" text-anchor="middle">adds instance and</text>
  <text x="755" y="181" font-size="10" fill="#444444" text-anchor="middle">job labels</text>
  <line x1="702" y1="194" x2="808" y2="194" stroke="#cccccc"/>
  <text x="755" y="212" font-size="10" fill="#444444" text-anchor="middle">rules evaluate:</text>
  <text x="755" y="228" font-size="9.5" fill="#222222" text-anchor="middle">failures per job</text>
  <text x="755" y="242" font-size="9.5" fill="#222222" text-anchor="middle">misfires</text>
  <text x="755" y="256" font-size="9.5" fill="#222222" text-anchor="middle">firing lag</text>
  <text x="755" y="270" font-size="9.5" fill="#222222" text-anchor="middle">job running too long</text>
  <text x="755" y="284" font-size="9.5" fill="#222222" text-anchor="middle">standby, ERROR triggers</text>
  <text x="755" y="298" font-size="9.5" fill="#222222" text-anchor="middle">job did not run</text>
  <line x1="702" y1="312" x2="808" y2="312" stroke="#cccccc"/>
  <text x="755" y="330" font-size="10" fill="#444444" text-anchor="middle">aggregate with</text>
  <text x="755" y="343" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">sum by (job_class)</text>
  <text x="755" y="360" font-size="10" fill="#444444" text-anchor="middle">because every value</text>
  <text x="755" y="373" font-size="10" fill="#444444" text-anchor="middle">is per node</text>
  <path d="M 642 250 L 690 250" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="666" y="241" font-size="9" fill="#444444" text-anchor="middle">scrape</text>

  <!-- Grafana and alertmanager -->
  <rect x="840" y="100" width="106" height="140" rx="8" fill="#eef5fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="893" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Grafana</text>
  <text x="893" y="142" font-size="10" fill="#444444" text-anchor="middle">PromQL panels:</text>
  <text x="893" y="158" font-size="9.5" fill="#222222" text-anchor="middle">runs and failures</text>
  <text x="893" y="172" font-size="9.5" fill="#222222" text-anchor="middle">mean duration</text>
  <text x="893" y="186" font-size="9.5" fill="#222222" text-anchor="middle">firing lag</text>
  <text x="893" y="200" font-size="9.5" fill="#222222" text-anchor="middle">misfires</text>
  <text x="893" y="214" font-size="9.5" fill="#222222" text-anchor="middle">triggers by state</text>
  <text x="893" y="228" font-size="9.5" fill="#222222" text-anchor="middle">running jobs</text>
  <rect x="840" y="256" width="106" height="140" rx="8" fill="#fdf3e6" stroke="#c26a00" stroke-width="1.5"/>
  <text x="893" y="278" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Alertmanager</text>
  <text x="893" y="298" font-size="10" fill="#444444" text-anchor="middle">routes the firing</text>
  <text x="893" y="311" font-size="10" fill="#444444" text-anchor="middle">alerts by severity:</text>
  <text x="893" y="331" font-size="9.5" fill="#222222" text-anchor="middle">page: nightly job</text>
  <text x="893" y="344" font-size="9.5" fill="#222222" text-anchor="middle">missing, ERROR trigger</text>
  <text x="893" y="360" font-size="9.5" fill="#222222" text-anchor="middle">ticket: failures,</text>
  <text x="893" y="373" font-size="9.5" fill="#222222" text-anchor="middle">misfires, lag</text>
  <path d="M 820 170 L 840 170" stroke="#1c4b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 820 330 L 840 330" stroke="#c26a00" stroke-width="1.8" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Rules strip -->
  <rect x="14" y="424" width="932" height="124" rx="8" fill="#f4f4f4" stroke="#999999"/>
  <text x="28" y="446" font-size="12" font-weight="bold" fill="#222222">Rules that keep the pipeline honest</text>
  <text x="28" y="466" font-size="11" fill="#222222">1. Tag with bounded values only: job.group, job.class and outcome. Never the job name or trigger name of a dynamic job such as loan-4711.</text>
  <text x="28" y="484" font-size="11" fill="#222222">2. Never use a tag named job: Prometheus reserves the label job for the scrape job and renames yours to exported_job.</text>
  <text x="28" y="502" font-size="11" fill="#222222">3. A counter only exists after its first event, so increase() cannot see that first event: pre-register counters for known groups.</text>
  <text x="28" y="520" font-size="11" fill="#222222">4. getCurrentlyExecutingJobs, SchedulerMetaData and the listeners describe this node only; cluster-wide facts live in the QRTZ_ tables.</text>
  <text x="28" y="538" font-size="11" fill="#222222">5. Alert on the absence of a success for jobs that must run, not only on failures: a stalled scheduler produces no failure at all.</text>
</svg>
