<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-biv-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Resources, memory and views</text>
<rect x="30" y="70" width="190" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="91.2" text-anchor="middle" font-size="12" fill="#3730A3">VkBuffer</text>
<text x="125.0" y="107.2" text-anchor="middle" font-size="12" fill="#3730A3">size, usage, sharing</text>
<rect x="30" y="160" width="190" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="181.2" text-anchor="middle" font-size="12" fill="#3730A3">VkImage</text>
<text x="125.0" y="197.2" text-anchor="middle" font-size="12" fill="#3730A3">format, extent, tiling</text>
<rect x="30" y="250" width="190" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="125.0" y="271.2" text-anchor="middle" font-size="12" fill="#92400E">VkDeviceMemory</text>
<text x="125.0" y="287.2" text-anchor="middle" font-size="12" fill="#92400E">heap and type (VMA)</text>
<line x1="100" y1="250" x2="100" y2="120" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-vk-biv-model)"/>
<line x1="150" y1="250" x2="150" y2="210" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-vk-biv-model)"/>
<text x="160" y="236" text-anchor="start" font-size="11" fill="#374151">bind</text>
<rect x="300" y="70" width="190" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="395.0" y="91.2" text-anchor="middle" font-size="12" fill="#065F46">VkBufferView</text>
<text x="395.0" y="107.2" text-anchor="middle" font-size="12" fill="#065F46">format, offset, range</text>
<rect x="300" y="160" width="190" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="395.0" y="181.2" text-anchor="middle" font-size="12" fill="#065F46">VkImageView</text>
<text x="395.0" y="197.2" text-anchor="middle" font-size="12" fill="#065F46">type, format, range</text>
<line x1="220" y1="95" x2="300" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-model)"/>
<line x1="220" y1="185" x2="300" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-model)"/>
<rect x="550" y="70" width="190" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="99.2" text-anchor="middle" font-size="12" fill="#374151">Texel buffer descriptor</text>
<rect x="550" y="160" width="190" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="189.2" text-anchor="middle" font-size="12" fill="#374151">Sampled or storage image</text>
<line x1="490" y1="95" x2="550" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-model)"/>
<line x1="490" y1="185" x2="550" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-model)"/>
<rect x="270" y="260" width="470" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="505.0" y="286.4" text-anchor="middle" font-size="11" fill="#374151">Uniform, storage, vertex, index and indirect uses need no view:</text>
<text x="505.0" y="301.4" text-anchor="middle" font-size="11" fill="#374151">the descriptor or bind command takes VkBuffer, offset, range</text>
<line x1="220" y1="110" x2="270" y2="270" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-vk-biv-model)"/>
<text x="380" y="355" text-anchor="middle" font-size="11" fill="#374151">A view never owns memory: destroy views before the image or buffer they refer to.</text>
</svg>
