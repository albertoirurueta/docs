<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica, Arial, sans-serif">
  <title>The Bookshelf architecture: shared, client and server modules, the GWT compiler and the browser talking to the server</title>
  <desc>The Bookshelf is three Maven modules. The client module and the shared module are compiled by the GWT compiler into JavaScript: bookshelf.nocache.js and one cache.js file per permutation. The shared module and the server module are compiled by javac and run on the JVM inside a servlet container. The browser loads the JavaScript from the server as static files and then talks to the server with GWT-RPC protected by an XSRF token and with REST and JSON through RequestBuilder.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">The Bookshelf: three modules, two compilers, one browser</text>

  <!-- modules -->
  <text x="24" y="58" font-size="12" font-weight="bold" fill="#64748b">SOURCE MODULES (MAVEN)</text>

  <rect x="24" y="68" width="280" height="112" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="164" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">bookshelf-client (gwt-app)</text>
  <text x="164" y="114" text-anchor="middle" font-size="12" fill="#1e3a8a">EntryPoint, widgets, UiBinder</text>
  <text x="164" y="132" text-anchor="middle" font-size="12" fill="#1e3a8a">Activities and Places, i18n</text>
  <text x="164" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">ClientBundle and GSS</text>
  <text x="164" y="168" text-anchor="middle" font-size="12" fill="#1e3a8a">Bookshelf.gwt.xml</text>

  <rect x="340" y="68" width="280" height="112" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">bookshelf-shared (jar)</text>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#14532d">Book, Author and Review DTOs</text>
  <text x="480" y="132" text-anchor="middle" font-size="12" fill="#14532d">CatalogService interfaces</text>
  <text x="480" y="150" text-anchor="middle" font-size="12" fill="#14532d">Bean Validation constraints</text>
  <text x="480" y="168" text-anchor="middle" font-size="12" fill="#14532d">compiled twice, once per side</text>

  <rect x="656" y="68" width="280" height="112" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="796" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">bookshelf-server (war)</text>
  <text x="796" y="114" text-anchor="middle" font-size="12" fill="#78350f">CatalogServiceImpl servlet</text>
  <text x="796" y="132" text-anchor="middle" font-size="12" fill="#78350f">XSRF token servlet, REST /api</text>
  <text x="796" y="150" text-anchor="middle" font-size="12" fill="#78350f">host page and web.xml</text>
  <text x="796" y="168" text-anchor="middle" font-size="12" fill="#78350f">Jetty or Spring Boot variant</text>

  <!-- compilers -->
  <line x1="24" y1="206" x2="936" y2="206" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="24" y="224" font-size="12" font-weight="bold" fill="#64748b">BUILD TIME</text>

  <line x1="164" y1="180" x2="164" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="180" x2="330" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="180" x2="630" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796" y1="180" x2="796" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="246" width="380" height="76" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="214" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">GWT compiler (gwt:compile)</text>
  <text x="214" y="290" text-anchor="middle" font-size="12" fill="#312e81">Java to JavaScript, one permutation</text>
  <text x="214" y="306" text-anchor="middle" font-size="12" fill="#312e81">per locale and user.agent</text>

  <rect x="556" y="246" width="380" height="76" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="746" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">javac and war packaging</text>
  <text x="746" y="290" text-anchor="middle" font-size="12" fill="#312e81">shared and server classes become</text>
  <text x="746" y="306" text-anchor="middle" font-size="12" fill="#312e81">ordinary bytecode for the JVM</text>

  <!-- outputs -->
  <line x1="214" y1="322" x2="214" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="746" y1="322" x2="746" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="370" width="380" height="68" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="214" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">Compiled JavaScript</text>
  <text x="214" y="414" text-anchor="middle" font-size="12" fill="#831843">bookshelf.nocache.js and one</text>
  <text x="214" y="430" text-anchor="middle" font-size="12" fill="#831843">cache.js file per permutation</text>

  <rect x="556" y="370" width="380" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="746" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Servlet container on the JVM</text>
  <text x="746" y="414" text-anchor="middle" font-size="12" fill="#78350f">serves the static files, runs the</text>
  <text x="746" y="430" text-anchor="middle" font-size="12" fill="#78350f">GWT-RPC servlet and the REST endpoint</text>

  <!-- run time -->
  <line x1="24" y1="458" x2="936" y2="458" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="936" y="476" text-anchor="end" font-size="12" font-weight="bold" fill="#64748b">RUN TIME</text>

  <path d="M214 438 L214 490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="226" y="470" font-size="11" fill="#334155">script tag in the host page</text>

  <rect x="24" y="492" width="912" height="40" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="480" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">Browser: selects one permutation, runs onModuleLoad(), updates the DOM</text>

  <path d="M640 490 L640 440" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="630" y="470" text-anchor="end" font-size="11" fill="#334155">GWT-RPC with an XSRF token</text>
  <path d="M860 490 L860 440" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="850" y="470" text-anchor="end" font-size="11" fill="#334155">REST and JSON (RequestBuilder)</text>
</svg>
