<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: get the launch post approved</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g fill="none" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 Share menu -->
  <rect x="30" y="92" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="92" y="97" width="36" height="16" rx="8" fill="#4F46E5"/><text x="110" y="109" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Share</text>
  <rect x="40" y="126" width="94" height="90" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="48" y="144" font-size="10" fill="#374151">Download</text><rect x="44" y="154" width="86" height="18" rx="3" fill="#FEF3C7"/><text x="48" y="167" font-size="10" fill="#92400E">Request approval</text><text x="48" y="190" font-size="10" fill="#9CA3AF">Publish (locked)</text>
  <text x="82" y="262" font-size="11" fill="#374151" text-anchor="middle">Publishing is locked</text><text x="82" y="278" font-size="11" fill="#374151" text-anchor="middle">until approved</text>
  <!-- 2 request form -->
  <rect x="182" y="92" width="104" height="140" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="190" y="108" font-size="10" font-weight="bold" fill="#1F2937">Request approval</text>
  <rect x="190" y="116" width="88" height="14" rx="2" fill="#E5E7EB"/><text x="194" y="126" font-size="9" fill="#374151">Reviewer: brand lead</text>
  <rect x="190" y="136" width="88" height="14" rx="2" fill="#E5E7EB"/><text x="194" y="146" font-size="9" fill="#374151">Due date (optional)</text>
  <rect x="190" y="156" width="88" height="30" rx="2" fill="#E5E7EB"/><text x="194" y="168" font-size="9" fill="#374151">Notes (optional)</text>
  <rect x="198" y="198" width="72" height="20" rx="10" fill="#4F46E5"/><text x="234" y="212" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Request</text>
  <text x="234" y="262" font-size="11" fill="#374151" text-anchor="middle">Pick a reviewer,</text><text x="234" y="278" font-size="11" fill="#374151" text-anchor="middle">add a note</text>
  <!-- 3 reviewer notified -->
  <rect x="334" y="92" width="104" height="70" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="342" y="108" font-size="10" font-weight="bold" fill="#1F2937">Approvals</text>
  <rect x="342" y="116" width="88" height="36" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="348" y="130" font-size="9" fill="#374151">Book of the week</text><text x="348" y="144" font-size="9" fill="#92400E">Awaiting review</text>
  <rect x="352" y="176" width="68" height="20" rx="10" fill="#4F46E5"/><text x="386" y="190" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Review</text>
  <text x="386" y="262" font-size="11" fill="#374151" text-anchor="middle">Reviewer gets an</text><text x="386" y="278" font-size="11" fill="#374151" text-anchor="middle">email and a notice</text>
  <!-- 4 decision -->
  <rect x="486" y="92" width="104" height="140" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="494" y="108" font-size="10" font-weight="bold" fill="#1F2937">Awaiting review</text>
  <rect x="494" y="116" width="88" height="30" rx="2" fill="#E5E7EB"/><text x="498" y="128" font-size="9" fill="#374151">Feedback notes</text>
  <rect x="494" y="156" width="88" height="20" rx="10" fill="#4F46E5"/><text x="538" y="170" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Approve</text>
  <rect x="494" y="184" width="88" height="20" rx="10" fill="#FFFFFF" stroke="#4F46E5"/><text x="538" y="198" font-size="10" fill="#4F46E5" text-anchor="middle">Request changes</text>
  <text x="538" y="262" font-size="11" fill="#374151" text-anchor="middle">Approve or send</text><text x="538" y="278" font-size="11" fill="#374151" text-anchor="middle">it back with notes</text>
  <!-- 5 approved -->
  <rect x="632" y="92" width="104" height="150" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="650" y="106" width="68" height="20" rx="10" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="120" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">Approved</text>
  <rect x="650" y="140" width="68" height="20" rx="10" fill="#4F46E5"/><text x="684" y="154" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Publish</text>
  <text x="684" y="190" font-size="9" fill="#374151" text-anchor="middle">Edits by the designer</text><text x="684" y="203" font-size="9" fill="#374151" text-anchor="middle">need a new approval</text>
  <text x="684" y="262" font-size="11" fill="#374151" text-anchor="middle">Publish options</text><text x="684" y="278" font-size="11" fill="#374151" text-anchor="middle">unlock</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Open Share on the</text><text x="82" y="338">finished post</text><text x="234" y="322">Submit it for</text><text x="234" y="338">review</text><text x="386" y="322">Reviewer opens</text><text x="386" y="338">the design</text><text x="538" y="322">Reviewer decides</text><text x="538" y="338">and leaves notes</text><text x="684" y="322">Result: the post</text><text x="684" y="338">can go live</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
