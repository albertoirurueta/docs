<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Self-attention data flow</title>
  <desc id="d">Input token vectors X are projected by three learned matrices into queries, keys and values. Queries times transposed keys, divided by the square root of the key dimension and passed through softmax, give a weight matrix. The weights multiply the values to give the output.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Self-attention</text>
  <rect x="30" y="120" width="70" height="60" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="65" y="156" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A" text-anchor="middle">X</text>
  <text x="65" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">tokens</text>
  <rect x="150" y="55" width="90" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="195" y="80" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">Q = X Wq</text>
  <rect x="150" y="130" width="90" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="195" y="155" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">K = X Wk</text>
  <rect x="150" y="205" width="90" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="195" y="230" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">V = X Wv</text>
  <line x1="100" y1="140" x2="148" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="100" y1="150" x2="148" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="100" y1="160" x2="148" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="300" y="85" width="150" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="375" y="112" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">softmax( Q Kt</text>
  <text x="375" y="130" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">/ sqrt(dk) + mask )</text>
  <text x="375" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">weights: n x n, rows sum to 1</text>
  <line x1="240" y1="75" x2="298" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="240" y1="150" x2="298" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="510" y="120" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="555" y="146" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">weights</text>
  <text x="555" y="164" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">x V</text>
  <line x1="450" y1="120" x2="508" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M240,225 L555,225 L555,182" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="630" y="125" width="60" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="660" y="155" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">out</text>
  <line x1="600" y1="150" x2="628" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="360" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Every token mixes the values of all tokens it is allowed to see.</text>
</svg>
