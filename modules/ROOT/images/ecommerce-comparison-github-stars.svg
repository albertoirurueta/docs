<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 362" width="860" height="362" role="img" aria-labelledby="github-stars-t github-stars-d">
<title id="github-stars-t">GitHub stars of the main repositories</title>
<desc id="github-stars-d">Stars of the main repository of each platform on 2026-10-27: magento/magento2 12,212, woocommerce/woocommerce 10,570, PrestaShop/PrestaShop 9,237, and for Shopify the CLI, Hydrogen and the Dawn theme (764, 2,159 and 3,104). Shopify itself is closed source, so its stars reflect only its open-source tools.</desc>
