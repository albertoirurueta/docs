<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Handedness and the upside-down Vulkan image</text>
<text x="100" y="62" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Right-handed</text>
<line x1="90" y1="190" x2="160" y2="190" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="170" y="194" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">x</text>
<line x1="90" y1="190" x2="90" y2="120" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="90" y="112" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">y</text>
<line x1="90" y1="190" x2="50" y2="230" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="40.0" y="245.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">z</text>
<text x="90" y="270" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">z toward you</text>
<text x="90" y="286" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">OpenGL view space, glTF</text>
<text x="270" y="62" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Left-handed</text>
<line x1="260" y1="190" x2="330" y2="190" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="340" y="194" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">x</text>
<line x1="260" y1="190" x2="260" y2="120" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="260" y="112" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">y</text>
<line x1="260" y1="190" x2="300" y2="150" stroke="#B45309" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="310.0" y="145.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">z</text>
<text x="260" y="270" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">z away from you</text>
<text x="260" y="286" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Direct3D convention, Unity</text>
<line x1="365" y1="50" x2="365" y2="330" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="560" y="62" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Y-flip</text>
<rect x="385" y="78" width="150" height="130" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="460" y="98" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">OpenGL-style P in Vulkan</text>
<text x="0" y="0" font-size="70" font-weight="bold" fill="#B45309" text-anchor="middle" transform="translate(460,122) scale(1,-1)">F</text>
<rect x="585" y="78" width="150" height="130" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="98" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">after the fix</text>
<text x="660" y="180" font-size="70" font-weight="bold" fill="#047857" text-anchor="middle">F</text>
<line x1="537" y1="143" x2="583" y2="143" stroke="#4B5563" stroke-width="1.5" marker-end="url(#hy)"/>
<text x="560" y="240" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fix 1: negative viewport height</text>
<text x="560" y="256" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(core in Vulkan 1.1)</text>
<text x="560" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fix 2: negate the y scale in P</text>
<text x="560" y="288" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fix 3: flip y in the vertex shader</text>
<text x="380" y="372" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Handedness is a convention of your maths; only the NDC and framebuffer rules are fixed by the API.</text>
</svg>
