<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-mt-ts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Timing a pass with timestamp queries in four steps</text>
<rect x="20" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/><text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="105" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Create and reset</text>
<text x="102" y="120" text-anchor="middle" font-size="11" fill="#374151">vkCreateQueryPool</text>
<text x="102" y="144" text-anchor="middle" font-size="11" fill="#374151">TIMESTAMP, count 2</text>
<text x="102" y="168" text-anchor="middle" font-size="11" fill="#374151">vkResetQueryPool (host)</text>
<text x="102" y="192" text-anchor="middle" font-size="11" fill="#374151">or vkCmdResetQueryPool</text>
<line x1="185" y1="145" x2="203" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-ts)"/>
<rect x="203" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="219" cy="76" r="11" fill="#4F46E5"/><text x="219" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="288" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Write start</text>
<text x="285" y="120" text-anchor="middle" font-size="11" fill="#374151">vkCmdWriteTimestamp2</text>
<text x="285" y="144" text-anchor="middle" font-size="11" fill="#374151">stage: TOP-like point</text>
<text x="285" y="168" text-anchor="middle" font-size="11" fill="#374151">before the pass</text>
<text x="285" y="192" text-anchor="middle" font-size="11" fill="#374151">query index 0</text>
<line x1="368" y1="145" x2="386" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-ts)"/>
<rect x="386" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="468.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="402" cy="76" r="11" fill="#4F46E5"/><text x="402" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="471" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Write end</text>
<text x="468" y="120" text-anchor="middle" font-size="11" fill="#374151">vkCmdWriteTimestamp2</text>
<text x="468" y="144" text-anchor="middle" font-size="11" fill="#374151">stage: ALL_COMMANDS</text>
<text x="468" y="168" text-anchor="middle" font-size="11" fill="#374151">after the pass</text>
<text x="468" y="192" text-anchor="middle" font-size="11" fill="#374151">query index 1</text>
<line x1="551" y1="145" x2="569" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-ts)"/>
<rect x="569" y="60" width="165" height="170" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="651.5" y="149.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="585" cy="76" r="11" fill="#B45309"/><text x="585" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="654" y="82" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Read and convert</text>
<text x="651" y="120" text-anchor="middle" font-size="11" fill="#374151">vkGetQueryPoolResults</text>
<text x="651" y="144" text-anchor="middle" font-size="11" fill="#374151">needs the frame finished</text>
<text x="651" y="168" text-anchor="middle" font-size="11" fill="#374151">ms = ticks times</text>
<text x="651" y="192" text-anchor="middle" font-size="11" fill="#374151">timestampPeriod / 1e6</text>
<text x="380" y="262" text-anchor="middle" font-size="11" fill="#374151">Mask the result with timestampValidBits of the queue family, and treat very short passes as noise.</text>
<text x="380" y="282" text-anchor="middle" font-size="11" fill="#374151">Differences between two timestamps of the same queue are meaningful; absolute values are not.</text>
</svg>
