<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Classifier chain</title>
<desc id="d">Three classifiers in a chain: the first sees only the features X, the second sees X plus the first label, the third sees X plus the first two labels; independent per-label models would each see X alone.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">A classifier chain feeds each label's prediction to the next classifier</text>

<rect x="40" y="70" width="640" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="360.0" y="100.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">features X</text>
<rect x="40" y="160" width="200" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="140.0" y="181.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">classifier 1</text><text x="140.0" y="199.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">input: X</text>
<line x1="140" y1="120" x2="140" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="80" y="250" width="120" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="140.0" y="275.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">label 1</text>
<line x1="140" y1="210" x2="140" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="260" y="160" width="200" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="360.0" y="181.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">classifier 2</text><text x="360.0" y="199.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">input: X + label 1</text>
<line x1="360" y1="120" x2="360" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="250" width="120" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="360.0" y="275.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">label 2</text>
<line x1="360" y1="210" x2="360" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="480" y="160" width="200" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="580.0" y="181.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">classifier 3</text><text x="580.0" y="199.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">input: X + labels 1, 2</text>
<line x1="580" y1="120" x2="580" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="250" width="120" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="580.0" y="275.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">label 3</text>
<line x1="580" y1="210" x2="580" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M200,270 C255,270 255,235 340,212" fill="none" stroke="#BE123C" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<path d="M420,270 C475,270 475,235 560,212" fill="none" stroke="#BE123C" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="360.0" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Dashed arrows: predictions passed on as extra features (chain_method) at prediction time; the order decides who sees whom.</text>
</svg>