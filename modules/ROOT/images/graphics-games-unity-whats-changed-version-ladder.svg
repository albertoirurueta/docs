<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What changed at each step from Unity 2020.3 to Unity 6.6</text>
<rect x="24" y="44" width="396" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="36" y="73" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">2020.3 LTS</text>
<text x="146" y="65" font-size="11" fill="#374151" text-anchor="start">Unity in Action</text>
<text x="146" y="81" font-size="11" fill="#374151" text-anchor="start">3rd edition targets it</text>
<rect x="78" y="98" width="396" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="90" y="127" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">2021.1+</text>
<text x="200" y="119" font-size="11" fill="#374151" text-anchor="start">Game Development</text>
<text x="200" y="135" font-size="11" fill="#374151" text-anchor="start">Patterns targets it</text>
<rect x="132" y="152" width="396" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="144" y="181" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">6.0 (2024)</text>
<text x="254" y="173" font-size="11" fill="#374151" text-anchor="start">Build Profiles, Web,</text>
<text x="254" y="189" font-size="11" fill="#374151" text-anchor="start">linearVelocity, Input default</text>
<rect x="186" y="206" width="396" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="198" y="235" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">6.3 LTS (2025)</text>
<text x="308" y="227" font-size="11" fill="#374151" text-anchor="start">GPU lightmapper default,</text>
<text x="308" y="243" font-size="11" fill="#374151" text-anchor="start">per-profile settings</text>
<rect x="240" y="260" width="396" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="252" y="289" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">6.4 (2026)</text>
<text x="362" y="281" font-size="11" fill="#374151" text-anchor="start">Compatibility Mode gone,</text>
<text x="362" y="297" font-size="11" fill="#374151" text-anchor="start">PVRTC removed</text>
<rect x="294" y="314" width="396" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="306" y="343" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">6.5 (2026)</text>
<text x="416" y="335" font-size="11" fill="#374151" text-anchor="start">Built-in deprecated, Wasm</text>
<text x="416" y="351" font-size="11" fill="#374151" text-anchor="start">2023, API 26, EntityId</text>
<rect x="348" y="368" width="396" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="360" y="397" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">6.6 (2026)</text>
<text x="470" y="389" font-size="11" fill="#374151" text-anchor="start">WebGPU, no domain reload,</text>
<text x="470" y="405" font-size="11" fill="#374151" text-anchor="start">ES 3.1, CPU baker deprecated</text>
<text x="24" y="430" font-size="11" fill="#374151" text-anchor="start">Each box starts further right because each release keeps the changes of the ones before it.</text>
</svg>
