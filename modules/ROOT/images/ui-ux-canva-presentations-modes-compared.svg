<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The four presentation modes side by side</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="46" width="176" height="250" rx="10"/><rect x="198" y="46" width="176" height="250" rx="10"/><rect x="384" y="46" width="176" height="250" rx="10"/><rect x="570" y="46" width="178" height="250" rx="10"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle"><text x="100" y="70">Present full screen</text><text x="286" y="70">Presenter view</text><text x="472" y="70">Present and record</text><text x="659" y="70">Autoplay</text></g>
  <!-- full screen -->
  <rect x="30" y="86" width="140" height="80" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="42" y="98" width="70" height="10" rx="3" fill="#4F46E5"/>
  <!-- presenter view -->
  <rect x="212" y="86" width="82" height="52" rx="3" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="298" y="86" width="62" height="52" rx="3" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="3 2"/><rect x="212" y="144" width="148" height="30" rx="3" fill="#FEF3C7" stroke="#B45309"/>
  <!-- record -->
  <rect x="398" y="86" width="148" height="80" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><circle cx="522" cy="142" r="14" fill="#E5E7EB" stroke="#4F46E5"/><circle cx="414" cy="100" r="6" fill="#B45309"/>
  <!-- autoplay -->
  <rect x="586" y="86" width="146" height="80" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><path d="M646,110 L674,126 L646,142 Z" fill="#4F46E5"/>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="100" y="196">Default mode.</text><text x="100" y="214">Arrow keys or on-screen</text><text x="100" y="232">arrows change slides.</text><text x="100" y="256">Canva Live: icon in</text><text x="100" y="272">the presentation bar.</text>
    <text x="286" y="196">Two windows: audience</text><text x="286" y="214">and presenter.</text><text x="286" y="232">Presenter sees notes</text><text x="286" y="250">and upcoming slides.</text><text x="286" y="272">Canva Live: from the</text><text x="286" y="288">presenter window.</text>
    <text x="472" y="196">Record camera and mic</text><text x="472" y="214">while you present.</text><text x="472" y="232">Gives a shareable link.</text><text x="472" y="256">Computer only; one</text><text x="472" y="272">recording per design.</text>
    <text x="659" y="196">Plays the deck with no</text><text x="659" y="214">clicks, using the slide</text><text x="659" y="232">durations you set.</text><text x="659" y="256">Start it from the More</text><text x="659" y="272">menu or the dropdown.</text>
  </g>
  <text x="380" y="322" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
