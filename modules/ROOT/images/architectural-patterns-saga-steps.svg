<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Place Order Saga -- compensatable, pivot, and retriable steps</text>

  <defs>
    <marker id="ss-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
    <marker id="ss-arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- forward saga flow arrows -->
  <line x1="252" y1="150" x2="298" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#ss-arrow-grey)"/>
  <line x1="522" y1="150" x2="568" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#ss-arrow-grey)"/>
  <text x="275" y="140" font-size="9.5" fill="#555555" text-anchor="middle">T1 commits</text>
  <text x="545" y="140" font-size="9.5" fill="#555555" text-anchor="middle">T2 commits</text>

  <!-- Inventory: compensatable -->
  <rect x="42" y="80" width="210" height="140" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="147" y="104" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Inventory</text>
  <text x="147" y="122" font-size="10.5" fill="#1c4b73" text-anchor="middle">compensatable -- T1</text>
  <text x="147" y="144" font-size="10" fill="#333333" text-anchor="middle">ReserveInventoryCommand</text>
  <text x="147" y="160" font-size="10" fill="#333333" text-anchor="middle">reserve() commits real state</text>
  <text x="147" y="182" font-size="10" fill="#1c4b73" text-anchor="middle">compensation: C1</text>
  <text x="147" y="198" font-size="10" fill="#333333" text-anchor="middle">ReleaseInventoryCommand</text>

  <!-- Payment: pivot -->
  <rect x="298" y="80" width="210" height="140" rx="8" fill="#fbecea" stroke="#a8412e" stroke-width="2.2"/>
  <text x="403" y="104" font-size="14" font-weight="bold" fill="#a8412e" text-anchor="middle">Payment</text>
  <text x="403" y="122" font-size="10.5" fill="#a8412e" text-anchor="middle">pivot -- point of no return</text>
  <text x="403" y="144" font-size="10" fill="#333333" text-anchor="middle">AuthorizePaymentCommand</text>
  <text x="403" y="160" font-size="10" fill="#333333" text-anchor="middle">authorize() commits real state</text>
  <text x="403" y="182" font-size="10" fill="#a8412e" text-anchor="middle">no compensation modeled</text>
  <text x="403" y="198" font-size="10" fill="#333333" text-anchor="middle">once committed, saga proceeds</text>

  <!-- Shipping: retriable -->
  <rect x="568" y="80" width="170" height="140" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2.2"/>
  <text x="653" y="104" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Shipping</text>
  <text x="653" y="122" font-size="10.5" fill="#2d6a34" text-anchor="middle">retriable -- T3</text>
  <text x="653" y="144" font-size="10" fill="#333333" text-anchor="middle">ScheduleShippingCommand</text>
  <text x="653" y="160" font-size="10" fill="#333333" text-anchor="middle">retried with backoff</text>
  <text x="653" y="182" font-size="10" fill="#2d6a34" text-anchor="middle">no compensation needed --</text>
  <text x="653" y="198" font-size="10" fill="#2d6a34" text-anchor="middle">guaranteed to eventually succeed</text>

  <!-- compensation path, drawn below, right to left -->
  <line x1="298" y1="252" x2="256" y2="252" stroke="#1c4b73" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ss-arrow-blue)"/>
  <text x="277" y="242" font-size="9.5" fill="#1c4b73" text-anchor="middle">Cn...C1</text>
  <text x="403" y="272" font-size="10.5" fill="#444444" text-anchor="middle">If a step after the pivot could fail, the saga would run compensations Cn...C1 in reverse order --</text>
  <text x="403" y="288" font-size="10.5" fill="#444444" text-anchor="middle">here, only a payment failure (before the pivot commits) triggers C1: ReleaseInventoryCommand.</text>

  <!-- legend -->
  <rect x="42" y="330" width="18" height="18" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="68" y="343" font-size="10.5" fill="#333333">Compensatable -- undone by an explicit compensating transaction</text>

  <rect x="42" y="358" width="18" height="18" rx="3" fill="#fbecea" stroke="#a8412e" stroke-width="1.6"/>
  <text x="68" y="371" font-size="10.5" fill="#333333">Pivot -- the point of no return; nothing before it needs compensating after it commits</text>

  <rect x="42" y="386" width="18" height="18" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="68" y="399" font-size="10.5" fill="#333333">Retriable -- idempotent, retried with backoff instead of compensated</text>

  <text x="390" y="432" font-size="10.5" fill="#444444" text-anchor="middle">Garcia-Molina and Salem's T1...Tn, Cn...C1 structure, mapped onto the Place Order Saga's three participants.</text>
</svg>
