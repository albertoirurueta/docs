<svg viewBox="0 0 760 404" width="760" height="404" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-cameras-and-projection-frustum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="404" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The view frustum: what a perspective camera sees (side view)</text>
<path d="M90,200 L600,90 L600,310 Z" fill="#EEF2FF" stroke="none" stroke-width="0"/>
<line x1="90" y1="200" x2="600" y2="90" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="90" y1="200" x2="600" y2="310" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="230" y1="160" x2="230" y2="240" stroke="#B45309" stroke-width="2.5"/>
<line x1="600" y1="90" x2="600" y2="310" stroke="#047857" stroke-width="2.5"/>
<line x1="70" y1="200" x2="640" y2="200" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ah-cameras-and-projection-frustum)"/>
<circle cx="90" cy="200" r="5" fill="#1F2937" stroke="none" stroke-width="1"/>
<text x="90" y="224" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">eye</text>
<text x="230" y="152" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">near plane</text>
<text x="600" y="82" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">far plane</text>
<path d="M148,185 A60,60 0 0 1 148,214" fill="none" stroke="#4B5563" stroke-width="1.2"/>
<text x="178" y="204" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">fovy</text>
<line x1="90" y1="290" x2="230" y2="290" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-cameras-and-projection-frustum)"/>
<text x="160.0" y="308" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">near = n</text>
<line x1="90" y1="340" x2="600" y2="340" stroke="#047857" stroke-width="1.2" marker-end="url(#ah-cameras-and-projection-frustum)"/>
<text x="345.0" y="358" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">far = f</text>
<text x="630" y="120" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">visible</text>
<text x="630" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">volume</text>
<text x="80" y="128" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">height at the near plane = 2 n tan(fovy / 2)</text>
<text x="380" y="394" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Only geometry between the near and far planes and inside the four side planes survives clipping.</text>
<text x="700" y="204" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">-Z</text>
</svg>
