<title id="monitoring-alerting-grafana-guide-g18-04-time-interval-form-title">New time interval form: the field Name holds guide-quiet-hours (callout 9), the Time range of the group Time intervals has the Start time 10:00 (callout 10) and the End time 12:00 (callout 11), the Location is UTC (callout 12), and the Save time interval button is marked by callout 13</title>
