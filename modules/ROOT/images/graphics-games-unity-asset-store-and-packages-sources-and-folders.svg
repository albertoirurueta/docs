<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-us-pk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where a package comes from and where it lands in the project</text>
<rect x="20" y="50" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="69.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Unity registry</text>
<text x="120.0" y="84.0" text-anchor="middle" font-size="11" fill="#3730A3">com.unity.* packages</text>
<line x1="220" y1="73" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="20" y="106" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="125.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Scoped registry</text>
<text x="120.0" y="140.0" text-anchor="middle" font-size="11" fill="#3730A3">npm-compatible server</text>
<line x1="220" y1="129" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="20" y="162" width="200" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120.0" y="181.0" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Asset Store</text>
<text x="120.0" y="196.0" text-anchor="middle" font-size="11" fill="#92400E">UPM or .unitypackage</text>
<line x1="220" y1="185" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="20" y="218" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="237.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Git URL</text>
<text x="120.0" y="252.0" text-anchor="middle" font-size="11" fill="#3730A3">repo#tag?path=/sub</text>
<line x1="220" y1="241" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="20" y="274" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="293.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Local folder or tarball</text>
<text x="120.0" y="308.0" text-anchor="middle" font-size="11" fill="#3730A3">file:../path</text>
<line x1="220" y1="297" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="20" y="330" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="349.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Embedded</text>
<text x="120.0" y="364.0" text-anchor="middle" font-size="11" fill="#3730A3">folder inside Packages/</text>
<line x1="220" y1="353" x2="300" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="300" y="150" width="170" height="130" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="385.0" y="187.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Package Manager</text>
<text x="385.0" y="203.0" text-anchor="middle" font-size="12" fill="#1F2937">reads manifest.json</text>
<text x="385.0" y="219.0" text-anchor="middle" font-size="12" fill="#1F2937">picks one version of</text>
<text x="385.0" y="235.0" text-anchor="middle" font-size="12" fill="#1F2937">every package</text>
<text x="385.0" y="251.0" text-anchor="middle" font-size="12" fill="#1F2937">writes the lock file</text>
<rect x="540" y="50" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="74.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Packages/manifest.json</text>
<text x="640.0" y="89.0" text-anchor="middle" font-size="11" fill="#374151">packages-lock.json</text>
<rect x="540" y="116" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="132.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Library/PackageCache</text>
<text x="640.0" y="147.5" text-anchor="middle" font-size="11" fill="#374151">immutable copies of registry</text>
<text x="640.0" y="162.5" text-anchor="middle" font-size="11" fill="#374151">and Git packages</text>
<rect x="540" y="182" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="198.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Packages/&lt;name&gt;/</text>
<text x="640.0" y="213.5" text-anchor="middle" font-size="11" fill="#374151">embedded or local package</text>
<text x="640.0" y="228.5" text-anchor="middle" font-size="11" fill="#374151">editable in place</text>
<rect x="540" y="248" width="200" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="264.5" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Assets/</text>
<text x="640.0" y="279.5" text-anchor="middle" font-size="11" fill="#92400E">files copied from a</text>
<text x="640.0" y="294.5" text-anchor="middle" font-size="11" fill="#92400E">.unitypackage, then your own</text>
<line x1="470" y1="190" x2="540" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<line x1="470" y1="205" x2="540" y2="144" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<line x1="470" y1="225" x2="540" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<line x1="470" y1="245" x2="540" y2="276" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<rect x="300" y="300" width="170" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="385.0" y="318.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Global cache</text>
<text x="385.0" y="333.5" text-anchor="middle" font-size="11" fill="#374151">shared by all projects</text>
<text x="385.0" y="348.5" text-anchor="middle" font-size="11" fill="#374151">(offline reinstall)</text>
<line x1="385" y1="280" x2="385" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-pk-a)"/>
<text x="380" y="392" text-anchor="middle" font-size="11" fill="#374151">A package added by name or Git URL is a dependency of the project; its own dependencies are resolved for you.</text>
<text x="380" y="408" text-anchor="middle" font-size="11" fill="#374151">A .unitypackage is just files copied into Assets/: no version, no dependencies, no lock file.</text>
</svg>
