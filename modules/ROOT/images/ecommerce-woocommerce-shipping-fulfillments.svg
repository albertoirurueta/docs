<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Order fulfillments and the computed fulfillment status of an order</title>
  <desc id="d">An order can have several fulfillment records. Each record lists items and quantities and may carry a tracking number, tracking URL and shipping provider; it is either unfulfilled (a draft) or fulfilled. WooCommerce computes the fulfillment status of the order from the records: no_fulfillments, unfulfilled, partially_fulfilled or fulfilled. The status is stored in the order meta key _fulfillment_status and it is independent of the order status. Records are stored in two tables.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="230" height="100" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="125.0" y="76.0" text-anchor="middle" font-weight="bold">Order 213</text>
  <text x="125.0" y="94.0" text-anchor="middle">status on-hold</text>
  <text x="125.0" y="112.0" text-anchor="middle">2 x Single-origin beans 1 kg</text>
  <rect x="320" y="30" width="260" height="56" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="53.0" text-anchor="middle" font-weight="bold">Fulfillment 1: unfulfilled</text>
  <text x="450.0" y="71.0" text-anchor="middle">1 item, tracking PCT-0001</text>
  <rect x="320" y="96" width="260" height="56" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="119.0" text-anchor="middle" font-weight="bold">Fulfillment 3: fulfilled</text>
  <text x="450.0" y="137.0" text-anchor="middle">1 item</text>
  <rect x="660" y="40" width="230" height="100" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="775.0" y="67.0" text-anchor="middle" font-weight="bold">Storage</text>
  <text x="775.0" y="85.0" text-anchor="middle">wc_order_fulfillments</text>
  <text x="775.0" y="103.0" text-anchor="middle">wc_order_fulfillment_meta</text>
  <text x="775.0" y="121.0" text-anchor="middle">_items, _tracking_number, ...</text>
  <line x1="240" y1="75" x2="318" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="105" x2="318" y2="124" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="90" x2="658" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="190" width="880" height="150" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="22" y="210" font-weight="bold">Computed order fulfillment status (meta key _fulfillment_status)</text>
  <rect x="30" y="225" width="190" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="125.0" y="265.0" text-anchor="middle" font-weight="bold">no_fulfillments</text>
  <text x="125.0" y="283.0" text-anchor="middle">no record</text>
  <line x1="220" y1="270" x2="250" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="225" width="190" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="345.0" y="265.0" text-anchor="middle" font-weight="bold">unfulfilled</text>
  <text x="345.0" y="283.0" text-anchor="middle">records, none fulfilled</text>
  <line x1="440" y1="270" x2="470" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="470" y="225" width="190" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="565.0" y="265.0" text-anchor="middle" font-weight="bold">partially_fulfilled</text>
  <text x="565.0" y="283.0" text-anchor="middle">some items fulfilled</text>
  <line x1="660" y1="270" x2="690" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="690" y="225" width="190" height="90" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="785.0" y="265.0" text-anchor="middle" font-weight="bold">fulfilled</text>
  <text x="785.0" y="283.0" text-anchor="middle">every item fulfilled</text>
  <text x="450" y="375" text-anchor="middle" font-size="11" opacity="0.85">The order status (processing, completed) is not changed by fulfillments. Hooks fire after create, update and delete of a record.</text>
</svg>
