<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="sap-general-guide-build-an-mta-archive-06-mbt-build-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-build-an-mta-archive-06-mbt-build-title">Terminal: mbt build -t gen --mtar claims-mta.mtar prints the build log, shortened to its main lines: the before-all build runs npm ci and npx cds build --production, then the modules claims-mta-srv and claims-mta-db-deployer are built, the metadata and the archive are generated and the last lines say that the MTA archive was generated at gen/claims-mta.mtar; callout 15 marks the command, callout 16 the before-all and module build lines and callout 17 the line that names the archive</title>
<g><rect x="0" y="0" width="1080" height="360" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="328" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ mbt build -t gen --mtar claims-mta.mtar</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">[2026-11-13 19:43:47]  INFO Cloud MTA Build Tool version 1.2.52</text>
