<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a PHP script runs</text>
  <text x="430" y="46" font-size="12" fill="#666666" text-anchor="middle">compile once per file (or once per deployment with OPcache), then execute opcodes on the Zend VM</text>

  <!-- compile pipeline -->
  <rect x="20" y="80" width="120" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="80" y="108" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Source</text>
  <text x="80" y="128" font-size="11" fill="#444444" text-anchor="middle">catalogue.php</text>

  <rect x="180" y="80" width="130" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="245" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Lexer</text>
  <text x="245" y="128" font-size="11" fill="#444444" text-anchor="middle">tokens (T_ECHO, …)</text>

  <rect x="350" y="80" width="130" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="415" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Parser</text>
  <text x="415" y="128" font-size="11" fill="#444444" text-anchor="middle">abstract syntax tree</text>

  <rect x="520" y="80" width="140" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="590" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Compiler</text>
  <text x="590" y="128" font-size="11" fill="#444444" text-anchor="middle">AST → opcode arrays</text>

  <rect x="700" y="80" width="140" height="70" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="770" y="108" font-size="14" font-weight="bold" fill="#a05a00" text-anchor="middle">Opcodes</text>
  <text x="770" y="128" font-size="11" fill="#444444" text-anchor="middle">ZEND_ADD, …</text>

  <g stroke="#444444" stroke-width="1.4">
    <line x1="140" y1="115" x2="172" y2="115"/>
    <line x1="310" y1="115" x2="342" y2="115"/>
    <line x1="480" y1="115" x2="512" y2="115"/>
    <line x1="660" y1="115" x2="692" y2="115"/>
  </g>
  <g fill="#444444">
    <polygon points="180,115 172,110 172,120"/>
    <polygon points="350,115 342,110 342,120"/>
    <polygon points="520,115 512,110 512,120"/>
    <polygon points="700,115 692,110 692,120"/>
  </g>
  <text x="430" y="172" font-size="11" fill="#666666" text-anchor="middle">compilation: done for every request and every included file unless OPcache already holds the result</text>

  <!-- OPcache -->
  <rect x="520" y="200" width="320" height="90" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="680" y="224" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">OPcache (shared memory)</text>
  <text x="680" y="244" font-size="11" fill="#444444" text-anchor="middle">stores compiled opcodes per file; later requests skip</text>
  <text x="680" y="260" font-size="11" fill="#444444" text-anchor="middle">lexer, parser and compiler entirely</text>
  <text x="680" y="278" font-size="10" fill="#666666" text-anchor="middle">optional: preloading at server start, file cache on disk</text>
  <line x1="770" y1="150" x2="770" y2="192" stroke="#2e7d32" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="770,200 765,192 775,192" fill="#2e7d32"/>

  <!-- VM -->
  <rect x="140" y="320" width="320" height="120" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="300" y="346" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Zend VM (executor)</text>
  <text x="300" y="368" font-size="11" fill="#444444" text-anchor="middle">runs one opcode handler after another</text>
  <text x="300" y="386" font-size="11" fill="#444444" text-anchor="middle">calls internal functions and extensions</text>
  <text x="300" y="404" font-size="11" fill="#444444" text-anchor="middle">(standard, pdo, mbstring, intl, …)</text>
  <text x="300" y="426" font-size="10" fill="#666666" text-anchor="middle">values live in zvals; memory freed by refcount + cycle GC</text>

  <rect x="520" y="320" width="320" height="120" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/>
  <text x="680" y="346" font-size="15" font-weight="bold" fill="#a05a00" text-anchor="middle">JIT (part of OPcache, PHP 8.0+)</text>
  <text x="680" y="368" font-size="11" fill="#444444" text-anchor="middle">compiles hot opcodes to native machine code</text>
  <text x="680" y="386" font-size="11" fill="#444444" text-anchor="middle">tracing or function mode (opcache.jit)</text>
  <text x="680" y="404" font-size="11" fill="#444444" text-anchor="middle">helps CPU-bound code; little gain for I/O-bound</text>
  <text x="680" y="426" font-size="10" fill="#666666" text-anchor="middle">off unless opcache.jit_buffer_size &gt; 0</text>

  <line x1="680" y1="290" x2="680" y2="312" stroke="#444444" stroke-width="1.4"/>
  <polygon points="680,320 675,312 685,312" fill="#444444"/>
  <path d="M 600 270 L 300 270 L 300 312" fill="none" stroke="#444444" stroke-width="1.4"/>
  <polygon points="300,320 295,312 305,312" fill="#444444"/>
  <text x="420" y="262" font-size="11" fill="#444444" text-anchor="middle">opcodes executed</text>
  <line x1="460" y1="380" x2="512" y2="380" stroke="#a05a00" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="520,380 512,375 512,385" fill="#a05a00"/>
  <text x="80" y="380" font-size="12" fill="#222222" text-anchor="middle">output /</text>
  <text x="80" y="396" font-size="12" fill="#222222" text-anchor="middle">response</text>
  <line x1="140" y1="386" x2="118" y2="386" stroke="#444444" stroke-width="1.4"/>
  <polygon points="110,386 118,381 118,391" fill="#444444"/>
</svg>
