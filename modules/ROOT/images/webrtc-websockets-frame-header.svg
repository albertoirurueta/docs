<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Bit layout of a WebSocket frame header in 32-bit rows: FIN, RSV1 to RSV3, a 4-bit opcode, MASK, a 7-bit payload length, the optional 16-bit or 64-bit extended payload length, the optional 32-bit masking key and then the payload data</title>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">WebSocket frame header (RFC 6455, section 5.2)</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">each row is 32 bits, network byte order; the first two bytes are always present</text>
  <text x="59.0" y="84" font-size="9" fill="#555555" text-anchor="middle">0</text>
  <text x="213.0" y="84" font-size="9" fill="#555555" text-anchor="middle">7</text>
  <text x="235.0" y="84" font-size="9" fill="#555555" text-anchor="middle">8</text>
  <text x="389.0" y="84" font-size="9" fill="#555555" text-anchor="middle">15</text>
  <text x="411.0" y="84" font-size="9" fill="#555555" text-anchor="middle">16</text>
  <text x="565.0" y="84" font-size="9" fill="#555555" text-anchor="middle">23</text>
  <text x="587.0" y="84" font-size="9" fill="#555555" text-anchor="middle">24</text>
  <text x="741.0" y="84" font-size="9" fill="#555555" text-anchor="middle">31</text>
  <rect x="48" y="92" width="22" height="56" fill="#e3f2fd" stroke="#37474f" stroke-width="1.2"/>
  <text x="59.0" y="118.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">FIN</text>
  <text x="59.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">1</text>
  <rect x="70" y="92" width="22" height="56" fill="#e3f2fd" stroke="#37474f" stroke-width="1.2"/>
  <text x="81.0" y="118.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">R1</text>
  <text x="81.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">1</text>
  <rect x="92" y="92" width="22" height="56" fill="#e3f2fd" stroke="#37474f" stroke-width="1.2"/>
  <text x="103.0" y="118.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">R2</text>
  <text x="103.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">1</text>
  <rect x="114" y="92" width="22" height="56" fill="#e3f2fd" stroke="#37474f" stroke-width="1.2"/>
  <text x="125.0" y="118.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">R3</text>
  <text x="125.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">1</text>
  <rect x="136" y="92" width="88" height="56" fill="#e3f2fd" stroke="#37474f" stroke-width="1.2"/>
  <text x="180.0" y="118.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">opcode</text>
  <text x="180.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">4 bits</text>
  <rect x="224" y="92" width="22" height="56" fill="#fff3e0" stroke="#37474f" stroke-width="1.2"/>
  <text x="235.0" y="118.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">M</text>
  <text x="235.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">1</text>
  <rect x="246" y="92" width="154" height="56" fill="#fff3e0" stroke="#37474f" stroke-width="1.2"/>
  <text x="323.0" y="118.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">payload len</text>
  <text x="323.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">7 bits</text>
  <rect x="400" y="92" width="352" height="56" fill="#e8f5e9" stroke="#37474f" stroke-width="1.2"/>
  <text x="576.0" y="118.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">extended payload length</text>
  <text x="576.0" y="132.0" font-size="8.5" fill="#37474f" text-anchor="middle">16 bits if len = 126, 64 bits if len = 127</text>
  <rect x="48" y="148" width="704" height="56" fill="#e8f5e9" stroke="#37474f" stroke-width="1.2"/>
  <text x="400.0" y="174.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">extended payload length (continued)</text>
  <text x="400.0" y="188.0" font-size="8.5" fill="#37474f" text-anchor="middle">only when payload len = 127</text>
  <rect x="48" y="204" width="352" height="56" fill="#e8f5e9" stroke="#37474f" stroke-width="1.2"/>
  <text x="224.0" y="230.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">extended payload length (continued)</text>
  <text x="224.0" y="244.0" font-size="8.5" fill="#37474f" text-anchor="middle">only when payload len = 127</text>
  <rect x="400" y="204" width="352" height="56" fill="#f3e5f5" stroke="#37474f" stroke-width="1.2"/>
  <text x="576.0" y="230.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">masking key</text>
  <text x="576.0" y="244.0" font-size="8.5" fill="#37474f" text-anchor="middle">32 bits, only when MASK = 1 (client frames)</text>
  <rect x="48" y="260" width="352" height="56" fill="#f3e5f5" stroke="#37474f" stroke-width="1.2"/>
  <text x="224.0" y="292.0" font-size="9" font-weight="bold" fill="#222222" text-anchor="middle">masking key (continued)</text>
  <rect x="400" y="260" width="352" height="56" fill="#eceff1" stroke="#37474f" stroke-width="1.2"/>
  <text x="576.0" y="286.0" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">payload data</text>
  <text x="576.0" y="300.0" font-size="8.5" fill="#37474f" text-anchor="middle">extension data, then application data; XOR-ed with the key when masked</text>
  <rect x="48" y="340" width="14" height="14" fill="#e3f2fd" stroke="#37474f"/>
  <text x="68" y="351" font-size="10" fill="#222222">FIN: last fragment of a message</text>
  <rect x="257.6" y="340" width="14" height="14" fill="#fff3e0" stroke="#37474f"/>
  <text x="277.6" y="351" font-size="10" fill="#222222">MASK: payload is masked</text>
  <rect x="422.4" y="340" width="14" height="14" fill="#e8f5e9" stroke="#37474f"/>
  <text x="442.4" y="351" font-size="10" fill="#222222">Length fields</text>
  <rect x="531.1999999999999" y="340" width="14" height="14" fill="#f3e5f5" stroke="#37474f"/>
  <text x="551.1999999999999" y="351" font-size="10" fill="#222222">Masking key</text>
  <rect x="628.8" y="340" width="14" height="14" fill="#eceff1" stroke="#37474f"/>
  <text x="648.8" y="351" font-size="10" fill="#222222">Payload</text>
  <text x="48" y="380" font-size="10.5" fill="#222222">R1, R2, R3 are RSV1 to RSV3: zero unless an extension defines them (permessage-deflate sets RSV1 on the first fragment of a compressed message).</text>
  <text x="48" y="398" font-size="10.5" fill="#222222">Opcodes: 0x0 continuation, 0x1 text, 0x2 binary, 0x8 close, 0x9 ping, 0xA pong. Control frames carry at most 125 bytes and are never fragmented.</text>
  <text x="48" y="416" font-size="10.5" fill="#222222">Header size: 2 bytes (len 0 to 125), 4 bytes (126 to 65535), 10 bytes (larger), plus 4 bytes when masked.</text>
</svg>
