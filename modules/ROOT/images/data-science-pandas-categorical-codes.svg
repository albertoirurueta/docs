<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">A categorical column stores integer codes and one list of categories</title>
<desc id="d">Six text values are stored as small integer codes that point into a categories index of small, medium and large. A missing value has code minus one.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Categorical: codes plus categories</text>
<text x="30" y="80" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">as shown</text>
<text x="30" y="150" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">stored codes</text>
<text x="30" y="164" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">(int8)</text>
<rect x="130" y="60" width="84" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="172.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">small</text>
<rect x="130" y="134" width="84" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="172.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
<line x1="172" y1="98" x2="172" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="222" y="60" width="84" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="264.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">large</text>
<rect x="222" y="134" width="84" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="264.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">2</text>
<line x1="264" y1="98" x2="264" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="314" y="60" width="84" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="356.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">medium</text>
<rect x="314" y="134" width="84" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="356.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">1</text>
<line x1="356" y1="98" x2="356" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="406" y="60" width="84" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="448.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">small</text>
<rect x="406" y="134" width="84" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="448.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
<line x1="448" y1="98" x2="448" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="498" y="60" width="84" height="36" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="540.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">NaN</text>
<rect x="498" y="134" width="84" height="36" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="540.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">-1</text>
<line x1="540" y1="98" x2="540" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="590" y="60" width="84" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="632.0" y="82.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">large</text>
<rect x="590" y="134" width="84" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="632.0" y="157.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">2</text>
<line x1="632" y1="98" x2="632" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="30" y="222" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">categories</text>
<text x="30" y="236" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">(the dtype)</text>
<text x="190" y="206" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0</text>
<rect x="130" y="212" width="120" height="36" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="190.0" y="234.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">small</text>
<text x="320" y="206" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>
<rect x="260" y="212" width="120" height="36" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="320.0" y="234.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">medium</text>
<text x="450" y="206" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text>
<rect x="390" y="212" width="120" height="36" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="450.0" y="234.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">large</text>
<text x="130" y="282" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Each value is stored once in the categories; the column holds only the codes.</text>
<text x="130" y="302" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Missing values get the code -1 and are never listed as a category.</text>
<circle cx="112" cy="152" r="11" fill="#0F172A"/>
<text x="112" y="156.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>
<circle cx="112" cy="230" r="11" fill="#0F172A"/>
<text x="112" y="234.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text>
</svg>
