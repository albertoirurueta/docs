<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-performance-and-debugging-pipeline-stall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A blocking readback versus a fence-based readback</text>
<text x="380" y="52" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Synchronous gl.readPixels into memory</text>
<text x="20" y="84" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">CPU</text>
<text x="20" y="124" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">GPU</text>
<rect x="70" y="70" width="120" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="87.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">draw calls</text>
<rect x="190" y="70" width="300" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="340.0" y="87.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">CPU waits: finish + round trip</text>
<rect x="490" y="70" width="120" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="550.0" y="87.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">next frame</text>
<rect x="130" y="110" width="360" height="28" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="310.0" y="127.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU works through everything queued before the read</text>
<text x="380" y="176" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Fence plus PIXEL_PACK_BUFFER (asynchronous)</text>
<text x="20" y="208" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">CPU</text>
<text x="20" y="248" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">GPU</text>
<rect x="70" y="194" width="100" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="211.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">draw + read</text>
<rect x="170" y="194" width="100" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="220.0" y="211.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">fenceSync</text>
<rect x="270" y="194" width="120" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="330.0" y="211.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">next frame</text>
<rect x="390" y="194" width="120" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="450.0" y="211.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">next frame</text>
<rect x="510" y="194" width="160" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="590.0" y="211.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">poll, then copy bytes</text>
<rect x="100" y="234" width="330" height="28" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="265.0" y="251.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU draws and copies pixels into the pack buffer</text>
<line x1="430" y1="248" x2="590" y2="222" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-webgl-performance-and-debugging-pipeline-stall)"/>
<text x="380" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The main thread never waits: the result arrives one or more frames later.</text>
<text x="380" y="320" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cost of the synchronous form grows with everything still queued, not with the size of the read.</text>
</svg>
