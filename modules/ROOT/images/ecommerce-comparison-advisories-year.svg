<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 522" width="860" height="522" role="img" aria-labelledby="advisories-year-t advisories-year-d">
<title id="advisories-year-t">Security advisories per year</title>
<desc id="advisories-year-d">Security advisories published per year: PrestaShop core (GitHub repository advisories), PrestaShop modules (Friends-of-Presta advisory posts, 141 in 2023) and Adobe Commerce security bulletins (APSB, between 4 and 7 a year). The three series count different things: a bulletin bundles many CVEs, a Friends-of-Presta post covers one module.</desc>
