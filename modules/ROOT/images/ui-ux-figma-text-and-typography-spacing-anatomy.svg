<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Line height, letter spacing and paragraph spacing</text>
  <rect x="30" y="50" width="330" height="220" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="50" y="90" font-size="18" fill="#1F2937">Every shelf tells</text>
  <text x="50" y="126" font-size="18" fill="#1F2937">a small story.</text>
  <text x="50" y="190" font-size="18" fill="#1F2937">Add the books you</text>
  <text x="50" y="226" font-size="18" fill="#1F2937">want to read next.</text>
  <line x1="340" y1="90" x2="340" y2="126" stroke="#B45309" stroke-width="2"/>
  <line x1="334" y1="90" x2="346" y2="90" stroke="#B45309" stroke-width="2"/><line x1="334" y1="126" x2="346" y2="126" stroke="#B45309" stroke-width="2"/>
  <line x1="320" y1="126" x2="320" y2="190" stroke="#4F46E5" stroke-width="2"/>
  <line x1="314" y1="126" x2="326" y2="126" stroke="#4F46E5" stroke-width="2"/><line x1="314" y1="190" x2="326" y2="190" stroke="#4F46E5" stroke-width="2"/>
  <circle cx="30" cy="50" r="11" fill="#B45309"/><text x="30" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="30" cy="268" r="11" fill="#4F46E5"/><text x="30" y="272" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="400" y="90" font-size="13" font-weight="bold" fill="#92400E">1 Line height</text>
  <text x="400" y="110" font-size="12" fill="#374151">Distance from one baseline to the next:</text>
  <text x="400" y="128" font-size="12" fill="#374151">Auto, pixels or a percentage of font size.</text>
  <text x="400" y="166" font-size="13" font-weight="bold" fill="#3730A3">2 Paragraph spacing</text>
  <text x="400" y="186" font-size="12" fill="#374151">Extra gap between paragraphs, in pixels.</text>
  <text x="400" y="226" font-size="13" font-weight="bold" fill="#3730A3">Letter spacing</text>
  <text x="400" y="246" font-size="12" fill="#374151">Space added between letters, in percent or pixels.</text>
  <text x="400" y="264" font-size="12" fill="#374151">Cursor between two letters: adjusts one pair.</text>
</svg>
