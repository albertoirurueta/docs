<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: generate, review and disclose an AI-made cover image</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <!-- 1 prompt -->
  <rect x="30" y="100" width="104" height="60" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="82" y="122" font-size="11" fill="#1F2937" text-anchor="middle">a cosy reading</text><text x="82" y="136" font-size="11" fill="#1F2937" text-anchor="middle">nook, warm light</text>
  <rect x="44" y="170" width="76" height="22" rx="11" fill="#4F46E5"/><text x="82" y="185" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Generate</text>
  <text x="82" y="216" font-size="11" fill="#374151" text-anchor="middle">Generic prompt,</text><text x="82" y="230" font-size="11" fill="#374151" text-anchor="middle">no brands or people</text>
  <!-- 2 results -->
  <rect x="182" y="100" width="48" height="48" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><rect x="236" y="100" width="48" height="48" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="182" y="154" width="48" height="48" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><rect x="236" y="154" width="48" height="48" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="236" y="154" width="48" height="48" rx="4" fill="none" stroke="#B45309" stroke-width="2"/>
  <text x="234" y="228" font-size="11" fill="#374151" text-anchor="middle">Several results,</text><text x="234" y="242" font-size="11" fill="#374151" text-anchor="middle">pick one</text>
  <!-- 3 review -->
  <rect x="334" y="100" width="104" height="80" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/>
  <circle cx="386" cy="140" r="26" fill="none" stroke="#4F46E5" stroke-width="2"/><path d="M405,159 L420,174" stroke="#4F46E5" stroke-width="3"/>
  <text x="386" y="204" font-size="11" fill="#374151" text-anchor="middle">Look for logos, text,</text><text x="386" y="218" font-size="11" fill="#374151" text-anchor="middle">faces, third-party</text><text x="386" y="232" font-size="11" fill="#374151" text-anchor="middle">material</text>
  <!-- 4 report or keep -->
  <rect x="490" y="100" width="96" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5"/><text x="538" y="119" font-size="11" fill="#1F2937" text-anchor="middle">Looks fine: keep</text>
  <rect x="490" y="140" width="96" height="30" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="538" y="159" font-size="11" fill="#92400E" text-anchor="middle">Unsafe: Report</text>
  <rect x="490" y="180" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="199" font-size="11" fill="#1F2937" text-anchor="middle">Wrong: regenerate</text>
  <text x="538" y="236" font-size="11" fill="#374151" text-anchor="middle">Reports help fix</text><text x="538" y="250" font-size="11" fill="#374151" text-anchor="middle">wrong flags too</text>
  <!-- 5 disclose -->
  <rect x="640" y="100" width="88" height="90" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="650" y="110" width="68" height="46" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="650" y="164" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#B45309"/><text x="684" y="177" font-size="10" fill="#92400E" text-anchor="middle">made with AI</text>
  <text x="684" y="216" font-size="11" fill="#374151" text-anchor="middle">Add a short</text><text x="684" y="230" font-size="11" fill="#374151" text-anchor="middle">disclosure line</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Write a generic</text><text x="82" y="338">prompt</text><text x="234" y="322">Compare the</text><text x="234" y="338">generated results</text><text x="386" y="322">Review the chosen</text><text x="386" y="338">image closely</text><text x="538" y="322">Keep, report or</text><text x="538" y="338">regenerate</text><text x="684" y="322">Disclose AI</text><text x="684" y="338">assistance</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic template, not a screenshot of any product.</text>
</svg>
