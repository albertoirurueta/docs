<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Four ways to wait for I/O: sync worker, async view in Flask, gevent and Quart</title>
  <defs>
    <marker id="fam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="24" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Three requests that each wait on I/O</text>
  <text x="360" y="42" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one worker process in every row; the horizontal axis is time</text>

  <!-- Row 1: sync worker -->
  <text x="20" y="74" font-size="13" font-weight="bold" fill="currentColor">1. Sync worker (WSGI)</text>
  <text x="20" y="91" font-size="11" fill="currentColor" opacity="0.85">one request at a time</text>
  <rect x="230" y="62" width="150" height="30" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/>
  <text x="305" y="82" font-size="11" fill="currentColor" text-anchor="middle">request A (waits)</text>
  <rect x="380" y="62" width="150" height="30" rx="4" fill="#808080" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
  <text x="455" y="82" font-size="11" fill="currentColor" text-anchor="middle">request B (waits)</text>
  <rect x="530" y="62" width="150" height="30" rx="4" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
  <text x="605" y="82" font-size="11" fill="currentColor" text-anchor="middle">request C (waits)</text>
  <line x1="215" y1="104" x2="700" y2="104" stroke="currentColor" stroke-width="1" marker-end="url(#fam-arrow)" opacity="0.6"/>

  <!-- Row 2: async view in Flask -->
  <text x="20" y="144" font-size="13" font-weight="bold" fill="currentColor">2. async def view in Flask</text>
  <text x="20" y="161" font-size="11" fill="currentColor" opacity="0.85">a short-lived event loop per request;</text>
  <text x="20" y="175" font-size="11" fill="currentColor" opacity="0.85">requests still queue up</text>
  <rect x="230" y="122" width="150" height="62" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="236" y="128" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.35"/>
  <rect x="236" y="145" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.35"/>
  <rect x="236" y="162" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.35"/>
  <text x="305" y="196" font-size="10" fill="currentColor" text-anchor="middle">A: awaits overlap</text>
  <rect x="380" y="122" width="150" height="62" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="386" y="128" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.2"/>
  <rect x="386" y="145" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.2"/>
  <rect x="386" y="162" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.2"/>
  <text x="455" y="196" font-size="10" fill="currentColor" text-anchor="middle">B starts after A returns</text>
  <rect x="530" y="122" width="150" height="62" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="536" y="128" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.12"/>
  <rect x="536" y="145" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.12"/>
  <rect x="536" y="162" width="138" height="14" rx="3" fill="#808080" fill-opacity="0.12"/>
  <text x="605" y="196" font-size="10" fill="currentColor" text-anchor="middle">C waits for B</text>
  <line x1="215" y1="208" x2="700" y2="208" stroke="currentColor" stroke-width="1" marker-end="url(#fam-arrow)" opacity="0.6"/>

  <!-- Row 3: gevent -->
  <text x="20" y="262" font-size="13" font-weight="bold" fill="currentColor">3. gevent greenlets</text>
  <text x="20" y="279" font-size="11" fill="currentColor" opacity="0.85">monkey patching; a greenlet per request,</text>
  <text x="20" y="293" font-size="11" fill="currentColor" opacity="0.85">plain def views, no await</text>
  <rect x="230" y="236" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <text x="238" y="248" font-size="10" fill="currentColor">greenlet A (waits)</text>
  <rect x="245" y="256" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/>
  <text x="253" y="268" font-size="10" fill="currentColor">greenlet B (waits)</text>
  <rect x="260" y="276" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <text x="268" y="288" font-size="10" fill="currentColor">greenlet C (waits)</text>
  <text x="440" y="262" font-size="11" fill="currentColor">waits overlap: the patched socket and sleep</text>
  <text x="440" y="277" font-size="11" fill="currentColor">calls switch to another greenlet</text>
  <line x1="215" y1="312" x2="700" y2="312" stroke="currentColor" stroke-width="1" marker-end="url(#fam-arrow)" opacity="0.6"/>

  <!-- Row 4: Quart -->
  <text x="20" y="366" font-size="13" font-weight="bold" fill="currentColor">4. Quart (ASGI)</text>
  <text x="20" y="383" font-size="11" fill="currentColor" opacity="0.85">one long-lived event loop;</text>
  <text x="20" y="397" font-size="11" fill="currentColor" opacity="0.85">tasks, websockets, background work</text>
  <rect x="230" y="340" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <text x="238" y="352" font-size="10" fill="currentColor">task A (await)</text>
  <rect x="245" y="360" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/>
  <text x="253" y="372" font-size="10" fill="currentColor">task B (await)</text>
  <rect x="260" y="380" width="150" height="16" rx="3" fill="#808080" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <text x="268" y="392" font-size="10" fill="currentColor">task C (await)</text>
  <rect x="300" y="400" width="380" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="308" y="412" font-size="10" fill="currentColor">websocket or background task outlives requests</text>
  <text x="440" y="352" font-size="11" fill="currentColor">awaits overlap; a blocking call</text>
  <text x="440" y="367" font-size="11" fill="currentColor">stalls every task on the loop</text>
  <line x1="215" y1="428" x2="700" y2="428" stroke="currentColor" stroke-width="1" marker-end="url(#fam-arrow)" opacity="0.6"/>

  <text x="360" y="462" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.9">Measured in this page's examples with ten or twenty requests that each wait 0.3 to 0.5 s:</text>
  <text x="360" y="479" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.9">sync or async view in Flask, one worker: about 3 s; gevent worker or Quart: about 0.3 to 0.5 s</text>
</svg>
