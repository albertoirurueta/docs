<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: autofill the template and export PNGs</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 -->
  <rect x="24" y="96" width="116" height="110" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="30" y="116">export CANVA_</text><text x="30" y="132">CLIENT_ID=...</text><text x="30" y="156">npm install</text><text x="30" y="172">node bookshelf.mjs</text></g>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="82" y="322" font-size="12" fill="#374151" text-anchor="middle">Set credentials in the</text><text x="82" y="338" font-size="12" fill="#374151" text-anchor="middle">environment, run it</text>
  <!-- 2 -->
  <rect x="176" y="96" width="116" height="110" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/>
  <g font-size="11" fill="#374151" font-family="Menlo, Consolas, monospace"><text x="182" y="116">{ "dataset": {</text><text x="182" y="134">  "title":</text><text x="182" y="150">   {text},</text><text x="182" y="168">  "cover":</text><text x="182" y="184">   {image} } }</text></g>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="234" y="322" font-size="12" fill="#374151" text-anchor="middle">Read the template's</text><text x="234" y="338" font-size="12" fill="#374151" text-anchor="middle">data fields</text>
  <!-- 3 -->
  <rect x="328" y="96" width="116" height="110" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="352" y="108" width="68" height="14" rx="3" fill="#4F46E5"/>
  <rect x="368" y="130" width="36" height="56" fill="#FFFFFF" stroke="#4F46E5"/>
  <rect x="352" y="192" width="68" height="8" rx="4" fill="#B45309"/>
  <rect x="328" y="214" width="116" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="386" y="231" font-size="11" fill="#92400E" text-anchor="middle">status: in_progress</text><text x="386" y="245" font-size="11" fill="#92400E" text-anchor="middle">then success</text>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="386" y="322" font-size="12" fill="#374151" text-anchor="middle">Autofill creates a new</text><text x="386" y="338" font-size="12" fill="#374151" text-anchor="middle">design per book</text>
  <!-- 4 -->
  <rect x="480" y="96" width="116" height="80" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="486" y="116">POST /exports</text><text x="486" y="136">type: png</text><text x="486" y="156" fill="#A7F3D0">width: 1080</text></g>
  <rect x="480" y="190" width="116" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="207" font-size="11" fill="#374151" text-anchor="middle">Poll until urls</text><text x="538" y="221" font-size="11" fill="#374151" text-anchor="middle">are returned</text>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="538" y="322" font-size="12" fill="#374151" text-anchor="middle">Export each new design</text><text x="538" y="338" font-size="12" fill="#374151" text-anchor="middle">as a PNG</text>
  <!-- 5 -->
  <rect x="630" y="96" width="108" height="110" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/>
  <g font-size="11" fill="#374151" font-family="Menlo, Consolas, monospace"><text x="636" y="116">out/</text><text x="642" y="136">book-1.png</text><text x="642" y="154">book-2.png</text><text x="642" y="172">book-3.png</text></g>
  <rect x="630" y="214" width="108" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="231" font-size="11" fill="#92400E" text-anchor="middle">Download within</text><text x="684" y="245" font-size="11" fill="#92400E" text-anchor="middle">24 hours</text>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="684" y="322" font-size="12" fill="#374151" text-anchor="middle">Save the PNG files</text><text x="684" y="338" font-size="12" fill="#374151" text-anchor="middle">to disk</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a script run, not a screenshot of any product.</text>
</svg>
