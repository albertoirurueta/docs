<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgl2-advanced-features-instancing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Instancing: one book mesh, many per-instance records</text>
<rect x="20" y="60" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="96.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Mesh buffer (divisor 0)</text>
<text x="120.0" y="111.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">position, normal, uv</text>
<text x="120.0" y="126.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">24 vertices + 36 indices</text>
<text x="120.0" y="141.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">shared by every instance</text>
<rect x="20" y="200" width="200" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120.0" y="236.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Instance buffer (divisor 1)</text>
<text x="120.0" y="251.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">mat4 model (4 x vec4)</text>
<text x="120.0" y="266.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">vec3 tint, float coverIndex</text>
<text x="120.0" y="281.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">one record per book</text>
<line x1="220" y1="115" x2="300" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-instancing)"/>
<line x1="220" y1="255" x2="300" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-instancing)"/>
<rect x="300" y="140" width="150" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="375.0" y="164.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vertex shader</text>
<text x="375.0" y="179.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl_InstanceID</text>
<text x="375.0" y="194.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">+ per-instance attributes</text>
<line x1="450" y1="175" x2="520" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-instancing)"/>
<rect x="530" y="100" width="40" height="50" rx="3" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="582" y="100" width="40" height="50" rx="3" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<rect x="634" y="100" width="40" height="50" rx="3" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<rect x="686" y="100" width="40" height="50" rx="3" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="530" y="160" width="40" height="50" rx="3" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<rect x="582" y="160" width="40" height="50" rx="3" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<rect x="634" y="160" width="40" height="50" rx="3" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="686" y="160" width="40" height="50" rx="3" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<rect x="530" y="220" width="40" height="50" rx="3" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<rect x="582" y="220" width="40" height="50" rx="3" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="634" y="220" width="40" height="50" rx="3" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<rect x="686" y="220" width="40" height="50" rx="3" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="80" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">12 books, one draw call</text>
<text x="630" y="300" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">drawElementsInstanced(TRIANGLES, 36,</text>
<text x="630" y="315" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">UNSIGNED_SHORT, 0, 12)</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertexAttribDivisor(loc, 1) advances the attribute once per instance instead of once per vertex.</text>
</svg>
