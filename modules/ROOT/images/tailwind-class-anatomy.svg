<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a utility class</text>

  <!-- the class string, segment by segment, monospace-ish via Courier -->
  <g font-family="'Courier New', monospace" font-size="30" font-weight="bold">
    <text x="60"  y="120" fill="#8a3d10">dark:</text>
    <text x="145" y="120" fill="#8a3d10">md:</text>
    <text x="205" y="120" fill="#8a3d10">hover:</text>
    <text x="310" y="120" fill="#1c4b73">bg-</text>
    <text x="365" y="120" fill="#2f5424">sky-</text>
    <text x="435" y="120" fill="#2f5424">500</text>
    <text x="490" y="120" fill="#7a2f6a">/75</text>
  </g>

  <!-- brackets + callouts -->
  <g stroke="#999999" stroke-width="1.4" fill="none">
    <path d="M60,132 L60,142 L128,142 L128,132"/>
    <path d="M145,132 L145,142 L192,142 L192,132"/>
    <path d="M205,132 L205,142 L297,142 L297,132"/>
    <path d="M310,132 L310,142 L358,142 L358,132"/>
    <path d="M365,132 L365,142 L428,142 L428,132"/>
    <path d="M435,132 L435,142 L483,142 L483,132"/>
    <path d="M490,132 L490,142 L540,142 L540,132"/>
  </g>

  <g font-size="12.5" fill="#444444">
    <text x="94"  y="170" text-anchor="middle" fill="#8a3d10" font-weight="bold">variant</text>
    <text x="94"  y="187" text-anchor="middle">dark mode</text>

    <text x="168" y="205" text-anchor="middle" fill="#8a3d10" font-weight="bold">variant</text>
    <text x="168" y="222" text-anchor="middle">breakpoint &#8805; 48rem</text>

    <text x="251" y="170" text-anchor="middle" fill="#8a3d10" font-weight="bold">variant</text>
    <text x="251" y="187" text-anchor="middle">:hover state</text>

    <text x="334" y="205" text-anchor="middle" fill="#1c4b73" font-weight="bold">property</text>
    <text x="334" y="222" text-anchor="middle">background-color</text>

    <text x="396" y="170" text-anchor="middle" fill="#2f5424" font-weight="bold">colour</text>
    <text x="396" y="187" text-anchor="middle">family</text>

    <text x="459" y="205" text-anchor="middle" fill="#2f5424" font-weight="bold">shade</text>
    <text x="459" y="222" text-anchor="middle">50 &#8230; 950</text>

    <text x="515" y="170" text-anchor="middle" fill="#7a2f6a" font-weight="bold">opacity</text>
    <text x="515" y="187" text-anchor="middle">75%</text>
  </g>

  <text x="360" y="270" font-size="13" fill="#222222" text-anchor="middle">Reads left to right: apply <tspan font-weight="bold">background-color: sky-500 at 75% opacity</tspan></text>
  <text x="360" y="292" font-size="13" fill="#222222" text-anchor="middle">only in dark mode, at the <tspan font-family="'Courier New', monospace">md</tspan> breakpoint and up, while hovered.</text>
  <text x="360" y="320" font-size="11.5" fill="#666666" text-anchor="middle">Stack any number of variants; the property/colour/shade utility always comes last. The <tspan font-family="'Courier New', monospace">/opacity</tspan> modifier is optional.</text>
</svg>
