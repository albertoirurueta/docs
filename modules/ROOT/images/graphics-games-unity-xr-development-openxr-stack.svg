<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="os" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The OpenXR stack from the Bookshelf scripts down to the headset</text>
<rect x="60" y="50" width="420" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="270.0" y="65.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Bookshelf scripts (C#)</text>
<text x="270.0" y="79.8" text-anchor="middle" font-size="11" fill="#065F46">XRGrabInteractable events, Input System actions</text>
<line x1="270" y1="88" x2="270" y2="94" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="60" y="94" width="420" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270.0" y="109.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">XR Interaction Toolkit 3.x  /  AR Foundation 6.x</text>
<text x="270.0" y="123.8" text-anchor="middle" font-size="11" fill="#3730A3">interactors, interactables, locomotion  /  planes, raycasts, anchors</text>
<line x1="270" y1="132" x2="270" y2="138" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="60" y="138" width="420" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270.0" y="153.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Unity XR subsystems + Input System</text>
<text x="270.0" y="167.8" text-anchor="middle" font-size="11" fill="#374151">tracking, input devices, display, XR Origin</text>
<line x1="270" y1="176" x2="270" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="60" y="182" width="420" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="270.0" y="197.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">XR Plug-in Management</text>
<text x="270.0" y="211.8" text-anchor="middle" font-size="11" fill="#92400E">enables provider plug-ins per build platform</text>
<line x1="270" y1="220" x2="270" y2="226" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="60" y="226" width="420" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270.0" y="241.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">OpenXR Plugin 1.x + vendor features</text>
<text x="270.0" y="255.8" text-anchor="middle" font-size="11" fill="#3730A3">interaction profiles, Meta Quest, Android XR features</text>
<line x1="270" y1="264" x2="270" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="60" y="270" width="420" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270.0" y="285.9" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">OpenXR loader (Khronos)</text>
<text x="270.0" y="299.9" text-anchor="middle" font-size="11" fill="#1F2937">finds the active runtime on the device</text>
<rect x="540" y="60" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="81.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Meta Quest runtime</text>
<text x="635.0" y="95.8" text-anchor="middle" font-size="11" fill="#374151">Android, Vulkan</text>
<line x1="480" y1="288" x2="540" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="540" y="122" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="143.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Android XR runtime</text>
<text x="635.0" y="157.8" text-anchor="middle" font-size="11" fill="#374151">Android, Vulkan</text>
<line x1="480" y1="288" x2="540" y2="147" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<rect x="540" y="184" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="205.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Other conformant runtimes</text>
<text x="635.0" y="219.8" text-anchor="middle" font-size="11" fill="#374151">Windows, DX12</text>
<line x1="480" y1="288" x2="540" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#os)" marker-start="url(#os)"/>
<text x="635" y="52" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Runtimes</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">The loader chooses the runtime at start-up, so one OpenXR build of the Bookshelf targets many devices.</text>
<text x="380" y="348" text-anchor="middle" font-size="11" fill="#374151">Device-specific extras come from vendor feature packages, not from a separate SDK per headset.</text>
<text x="380" y="372" text-anchor="middle" font-size="10" fill="#6B7280">Original schematic of the layers.</text>
</svg>
