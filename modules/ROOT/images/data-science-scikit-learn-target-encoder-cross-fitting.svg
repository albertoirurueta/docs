<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">TargetEncoder cross fitting</title>
  <desc id="d1">In fit_transform the training data is cut into five folds. Each fold is encoded with category means learned from the other four folds. A separate set of encodings learned from all training rows is stored in encodings_ and used by transform on new data.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">TargetEncoder: cross fitting in fit_transform</text>

  <text x="24" y="68" font-size="14" font-weight="bold" fill="#0F172A">A. fit_transform(X_train, y_train) builds the training features</text>
  <g font-size="12" fill="#475569"><text x="24" y="98">fold 1</text><text x="24" y="130">fold 2</text><text x="24" y="162">fold 3</text><text x="24" y="194">fold 4</text><text x="24" y="226">fold 5</text></g>
  <g stroke-width="2">
    <rect x="80" y="82" width="90" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/><rect x="170" y="82" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="260" y="82" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="350" y="82" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="440" y="82" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <rect x="80" y="114" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="170" y="114" width="90" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/><rect x="260" y="114" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="350" y="114" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="440" y="114" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <rect x="80" y="146" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="170" y="146" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="260" y="146" width="90" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/><rect x="350" y="146" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="440" y="146" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <rect x="80" y="178" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="170" y="178" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="260" y="178" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="350" y="178" width="90" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/><rect x="440" y="178" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <rect x="80" y="210" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="170" y="210" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="260" y="210" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="350" y="210" width="90" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E"/><rect x="440" y="210" width="90" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <circle cx="560" cy="158" r="11" fill="#0F172A"/><text x="560" y="163" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <g font-size="14" fill="#0F172A">
    <rect x="590" y="98" width="14" height="14" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="612" y="110">learn means</text>
    <rect x="590" y="122" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="612" y="134">encode this fold</text>
  </g>

  <text x="24" y="268" font-size="14" font-weight="bold" fill="#0F172A">B. The stored encodings come from all training rows</text>
  <rect x="80" y="282" width="450" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="305" y="299" font-size="12" fill="#0F172A" text-anchor="middle">all training rows, smoothed category means saved in encodings_</text>
  <path d="M530 294 L566 294" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="570" y="278" width="136" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="638" y="299" font-size="14" fill="#0F172A" text-anchor="middle">transform(X_test)</text>
  <circle cx="64" cy="294" r="11" fill="#0F172A"/><text x="64" y="299" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="24" y="346" font-size="12" fill="#475569">Each training row is encoded without its own target value, so the downstream model cannot memorise it.</text>
  <text x="24" y="366" font-size="12" fill="#475569">fit(X, y).transform(X) skips part A and encodes every row with a mean that includes its own target.</text>
</svg>
