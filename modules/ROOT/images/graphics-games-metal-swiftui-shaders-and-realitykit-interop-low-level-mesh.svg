<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">LowLevelMesh: vertex and index data you own</text>
<rect x="20" y="60" width="200" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="87.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Descriptor</text>
<text x="120.0" y="101.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">vertexAttributes</text>
<text x="120.0" y="115.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">vertexLayouts, indexType</text>
<text x="120.0" y="129.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">vertexCapacity, indexCapacity</text>
