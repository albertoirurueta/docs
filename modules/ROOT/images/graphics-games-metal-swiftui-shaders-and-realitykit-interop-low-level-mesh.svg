<text x="380.0" y="87.8" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">LowLevelMesh</text>
<text x="380.0" y="101.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">CPU: withUnsafeMutableBytes</text>
<text x="380.0" y="115.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">GPU: replace(bufferIndex:using:)</text>
<text x="380.0" y="129.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">parts.replaceAll([...])</text>
<rect x="540" y="60" width="200" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="87.8" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">MeshResource</text>
<text x="640.0" y="101.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">try MeshResource(from: mesh)</text>
<text x="640.0" y="115.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">ModelEntity(mesh:, materials:)</text>
<text x="640.0" y="129.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle"></text>
<line x1="222" y1="105" x2="278" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-mesh)"/>
<line x1="482" y1="105" x2="538" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-mesh)"/>
<rect x="20" y="190" width="350" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="214.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Vertex layout example</text>
<text x="195.0" y="228.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position: float3 at offset 0</text>
<text x="195.0" y="242.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">buffer 0, stride 12 bytes</text>
<rect x="400" y="190" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="214.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Update paths</text>
<text x="570.0" y="228.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU closure for small changes</text>
<text x="570.0" y="242.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU buffer for animated geometry</text>
<text x="380" y="295" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The resource keeps a reference to the mesh, so later changes show up without recreating the entity.</text>
