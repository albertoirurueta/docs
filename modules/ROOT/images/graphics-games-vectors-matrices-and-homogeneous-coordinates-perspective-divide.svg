<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Perspective divide: farther objects shrink</text>
<circle cx="60" cy="190" r="5" fill="#1F2937" stroke="none" stroke-width="1.5"/>
<text x="60" y="212" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">eye</text>
<line x1="180" y1="90" x2="180" y2="290" stroke="#4F46E5" stroke-width="3"/>
<text x="180" y="308" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">image plane</text>
<rect x="298" y="150" width="12" height="80" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
<text x="304" y="140" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book at z=2</text>
<rect x="418" y="150" width="12" height="80" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
<text x="424" y="140" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book at z=4</text>
<line x1="60" y1="190" x2="304" y2="150" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="60" y1="190" x2="304" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="60" y1="190" x2="424" y2="150" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="60" y1="190" x2="424" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="180" y1="170" x2="180" y2="210" stroke="#B45309" stroke-width="4"/>
<line x1="166" y1="180" x2="166" y2="200" stroke="#047857" stroke-width="4"/>
<text x="185" y="330" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">height on plane = h / z</text>
<rect x="500" y="70" width="230" height="72" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="615.0" y="95.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Clip coordinates</text>
<text x="615.0" y="110.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">(x, y, z, w) from the vertex shader</text>
<text x="615.0" y="125.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">w equals -z_view for a perspective P</text>
<rect x="500" y="176" width="230" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="615.0" y="195.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">NDC</text>
<text x="615.0" y="210.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(x / w, y / w, z / w)</text>
<text x="615.0" y="225.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">one divide per vertex</text>
<line x1="615" y1="142" x2="615" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pd)"/>
<rect x="500" y="270" width="230" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="615.0" y="289.0" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Rasteriser input</text>
<text x="615.0" y="304.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">w is kept: 1 / w drives</text>
<text x="615.0" y="319.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">perspective-correct interpolation</text>
<line x1="615" y1="236" x2="615" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pd)"/>
<text x="380" y="366" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Two identical books project to heights in the ratio 2 to 1 because the divisor is the distance.</text>
</svg>
