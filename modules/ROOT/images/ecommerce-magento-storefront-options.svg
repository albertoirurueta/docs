<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Four Magento storefront options compared</title>
  <desc id="d">Luma and Hyvä are rendered by the Magento PHP server from layout XML and phtml templates, Luma with RequireJS, Knockout and LESS and Hyvä with Tailwind CSS and Alpine.js. PWA Studio is a React single-page application served by an UPWARD server that reads GraphQL. The Commerce Storefront is authored documents turned into HTML by Edge Delivery Services, with drop-ins in the browser calling Commerce GraphQL directly. The last row shows the editions each option is documented for.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Where the page is built, by storefront option</text>

  <g fill="#f2f5f8" font-size="12">
    <!-- headers -->
    <rect x="20" y="52" width="215" height="46" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="127" y="80" text-anchor="middle" font-size="15" font-weight="bold">Luma (default theme)</text>
    <rect x="252" y="52" width="215" height="46" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="360" y="80" text-anchor="middle" font-size="15" font-weight="bold">Hyvä Theme</text>
    <rect x="485" y="52" width="215" height="46" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="592" y="80" text-anchor="middle" font-size="15" font-weight="bold">PWA Studio</text>
    <rect x="718" y="52" width="222" height="46" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="829" y="80" text-anchor="middle" font-size="15" font-weight="bold">Commerce Storefront</text>

    <!-- row 1: who builds the HTML -->
    <rect x="20" y="112" width="215" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="32" y="134" font-weight="bold">Magento PHP server</text>
    <text x="32" y="154">layout XML + .phtml</text>
    <text x="32" y="172">RequireJS, Knockout, LESS</text>
    <text x="32" y="190">static content deploy</text>
    <text x="32" y="208">full page cache (Varnish)</text>

    <rect x="252" y="112" width="215" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="264" y="134" font-weight="bold">Magento PHP server</text>
    <text x="264" y="154">same layout XML + .phtml</text>
    <text x="264" y="172">Tailwind CSS, Alpine.js</text>
    <text x="264" y="190">built with npm, no RequireJS</text>
    <text x="264" y="208">full page cache (Varnish)</text>

    <rect x="485" y="112" width="215" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="497" y="134" font-weight="bold">Browser (React SPA)</text>
    <text x="497" y="154">UPWARD server serves shell</text>
    <text x="497" y="172">Venia UI, Peregrine hooks</text>
    <text x="497" y="190">service worker, yarn build</text>
    <text x="497" y="208">separate Node deployment</text>

    <rect x="718" y="112" width="222" height="110" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="730" y="134" font-weight="bold">Edge Delivery Services</text>
    <text x="730" y="154">authored documents to HTML</text>
    <text x="730" y="172">blocks + drop-ins (npm)</text>
    <text x="730" y="190">GitHub repo, no PHP at all</text>
    <text x="730" y="208">served from the edge</text>

    <!-- row 2: data -->
    <rect x="20" y="236" width="215" height="76" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="32" y="258" font-weight="bold">Data</text>
    <text x="32" y="278">PHP models and blocks</text>
    <text x="32" y="296">in the same process</text>

    <rect x="252" y="236" width="215" height="76" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="264" y="258" font-weight="bold">Data</text>
    <text x="264" y="278">PHP models and blocks</text>
    <text x="264" y="296">in the same process</text>

    <rect x="485" y="236" width="215" height="76" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="497" y="258" font-weight="bold">Data</text>
    <text x="497" y="278">Magento GraphQL,</text>
    <text x="497" y="296">called from the browser</text>

    <rect x="718" y="236" width="222" height="76" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="730" y="258" font-weight="bold">Data</text>
    <text x="730" y="278">Commerce GraphQL (core,</text>
    <text x="730" y="296">Catalog Service), from browser</text>

    <!-- row 3: extension model -->
    <rect x="20" y="326" width="215" height="76" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="32" y="348" font-weight="bold">Extend with</text>
    <text x="32" y="368">PHP modules, layout XML,</text>
    <text x="32" y="386">templates, JS components</text>

    <rect x="252" y="326" width="215" height="76" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="264" y="348" font-weight="bold">Extend with</text>
    <text x="264" y="368">PHP modules plus a</text>
    <text x="264" y="386">compatibility module per extension</text>

    <rect x="485" y="326" width="215" height="76" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="497" y="348" font-weight="bold">Extend with</text>
    <text x="497" y="368">targetables, intercept files,</text>
    <text x="497" y="386">GraphQL schema additions</text>

    <rect x="718" y="326" width="222" height="76" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="730" y="348" font-weight="bold">Extend with</text>
    <text x="730" y="368">slots, containers, events,</text>
    <text x="730" y="386">your own blocks (JavaScript)</text>

    <!-- row 4: editions -->
    <rect x="20" y="416" width="215" height="92" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="32" y="438" font-weight="bold">Editions</text>
    <text x="32" y="458">Open Source, Adobe Commerce</text>
    <text x="32" y="476">(on-prem and Cloud); not on the</text>
    <text x="32" y="494">Cloud Service (SaaS)</text>

    <rect x="252" y="416" width="215" height="92" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="264" y="438" font-weight="bold">Editions</text>
    <text x="264" y="458">Open Source, Adobe Commerce</text>
    <text x="264" y="476">(PHP-based); Mage-OS</text>
    <text x="264" y="494">free OSL/AFL theme since Nov 2025</text>

    <rect x="485" y="416" width="215" height="92" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="497" y="438" font-weight="bold">Editions</text>
    <text x="497" y="458">Open Source and Adobe Commerce</text>
    <text x="497" y="476">PaaS; repository still active,</text>
    <text x="497" y="494">no support statement in docs</text>

    <rect x="718" y="416" width="222" height="92" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="730" y="438" font-weight="bold">Editions</text>
    <text x="730" y="458">Commerce as a Cloud Service,</text>
    <text x="730" y="476">Optimizer, PaaS + Optimizer;</text>
    <text x="730" y="494">Open Source not supported</text>
  </g>
  <text x="480" y="540" text-anchor="middle" font-size="11" fill="#c9d3dc">Checked 2026-10-27. Drop-ins need a license that covers them; Hyvä Checkout and Hyvä UI remain paid products.</text>
</svg>
