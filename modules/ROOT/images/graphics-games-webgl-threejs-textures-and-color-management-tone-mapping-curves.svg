<text x="540" y="100" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">NoToneMapping</text>
<text x="500" y="118" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">and LinearToneMapping at exposure 1:</text>
<text x="500" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">values above 1.0 clip to white</text>
<line x1="490" y1="180" x2="530" y2="180" stroke="#4F46E5" stroke-width="2.4"/>
<text x="540" y="184" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">ReinhardToneMapping</text>
<text x="500" y="202" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">smooth roll-off, shape of x / (1 + x),</text>
<text x="500" y="216" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">highlights stay a little grey</text>
<line x1="490" y1="264" x2="530" y2="264" stroke="#B45309" stroke-width="2.4"/>
<text x="540" y="268" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">ACESFilmicToneMapping</text>
<text x="500" y="286" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">S-shaped filmic curve: deeper darks,</text>
<text x="500" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">strong contrast, punchy highlights</text>
<text x="490" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">AgX and Neutral are also built in;</text>
<text x="490" y="364" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">curves here are schematic, not shader code.</text>
<text x="380" y="408" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">toneMapping applies when drawing to the screen; render targets stay linear until an output pass</text>
