<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="cves-core-other-t cves-core-other-d">
<title id="cves-core-other-t">CVEs per year, core of the other self-hosted CMSs</title>
<desc id="cves-core-other-d">CVEs published per year in the NVD for AEM, Umbraco, Strapi, Payload and Ghost (CPE-matched), 2015 to 2026 year to date. Adobe files every AEM and add-on component under one product, which inflates the AEM count. Hosted products (Webflow, Wix, Squarespace, Contentful, Sanity) fix their platform without CVEs and have no series; they are not comparable. Wagtail is only found by keyword and appears in the ecosystem chart.</desc>
