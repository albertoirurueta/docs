<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" role="img" aria-labelledby="w3techs-history-t w3techs-history-d">
<title id="w3techs-history-t">W3Techs share of all websites per year</title>
<desc id="w3techs-history-d">Share of all websites using each CMS on 1 January of each year from 2015 and on 2026-10-29 according to W3Techs, for WordPress, Wix, Squarespace, Shopify (market-share context only), Joomla, Drupal and Webflow. W3Techs publishes yearly history only for systems above 1% of all sites (Webflow from 2019), so the other CMSs have no series (n/a). Colours are assigned by position in this figure.</desc>
