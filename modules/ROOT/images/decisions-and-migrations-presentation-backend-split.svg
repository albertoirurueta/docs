<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Separating the presentation tier from the backend</text>

  <defs>
    <marker id="pbs-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Before -->
  <text x="175" y="60" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Before</text>
  <rect x="55" y="75" width="240" height="230" rx="10" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="175" y="98" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop-web.war</text>

  <rect x="75" y="115" width="200" height="55" rx="6" fill="#ffffff" stroke="#b3541e" stroke-width="1.4"/>
  <text x="175" y="138" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">Struts actions</text>
  <text x="175" y="155" font-size="9.5" fill="#666666" text-anchor="middle">controllers</text>

  <rect x="75" y="180" width="200" height="55" rx="6" fill="#ffffff" stroke="#b3541e" stroke-width="1.4"/>
  <text x="175" y="203" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">JSP views</text>
  <text x="175" y="220" font-size="9.5" fill="#666666" text-anchor="middle">server-rendered HTML + jQuery</text>

  <rect x="75" y="245" width="200" height="45" rx="6" fill="#ffffff" stroke="#b3541e" stroke-width="1.4"/>
  <text x="175" y="272" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">Business logic</text>

  <text x="175" y="318" font-size="10" fill="#666666" text-anchor="middle">UI and backend in one deployable</text>

  <!-- Arrow -->
  <path d="M310,190 L440,190" stroke="#1c4b73" stroke-width="2.4" marker-end="url(#pbs-arrow)" fill="none"/>
  <text x="375" y="178" font-size="10.5" fill="#1c4b73" text-anchor="middle">split</text>

  <!-- After -->
  <text x="605" y="60" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">After</text>

  <rect x="470" y="75" width="270" height="30" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="605" y="95" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop-web (React SPA)</text>

  <line x1="605" y1="105" x2="605" y2="130" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#pbs-arrow)"/>
  <text x="640" y="122" font-size="9.5" fill="#1c4b73" text-anchor="middle">REST API calls</text>

  <rect x="470" y="130" width="270" height="175" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="605" y="153" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop (API backend)</text>

  <rect x="490" y="170" width="230" height="45" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="605" y="197" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">REST facade</text>

  <rect x="490" y="225" width="230" height="60" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="605" y="252" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">Business logic</text>
  <text x="605" y="269" font-size="9.5" fill="#666666" text-anchor="middle">no view code left</text>

  <text x="605" y="330" font-size="10" fill="#666666" text-anchor="middle">UI and backend deployed and released independently</text>

  <text x="390" y="380" font-size="10.5" fill="#444444" text-anchor="middle">Once the backend exposes an API, extracting any one capability behind it later changes nothing the UI depends on.</text>
</svg>
