<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ssl-ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Layout of a SPIR-V module (logical sections, in order)</text>
<rect x="40" y="50" width="300" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="73.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Header</text>
<text x="360" y="73" text-anchor="start" font-size="11" fill="#374151">magic 0x07230203, version, generator, ID bound</text>
<rect x="40" y="96" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="119.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Capabilities, extensions, ext-inst imports</text>
<text x="360" y="119" text-anchor="start" font-size="11" fill="#374151">Shader, Int64, SPV_KHR_..., GLSL.std.450</text>
<rect x="40" y="142" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="165.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Memory model</text>
<text x="360" y="165" text-anchor="start" font-size="11" fill="#374151">Logical + VulkanKHR (or GLSL450)</text>
<rect x="40" y="188" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="211.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Entry points + execution modes</text>
<text x="360" y="211" text-anchor="start" font-size="11" fill="#374151">OpEntryPoint, LocalSize, OriginUpperLeft</text>
<rect x="40" y="234" width="300" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="257.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Debug info (optional)</text>
<text x="360" y="257" text-anchor="start" font-size="11" fill="#374151">names, source text, line info</text>
<rect x="40" y="280" width="300" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="303.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Annotations (decorations)</text>
<text x="360" y="303" text-anchor="start" font-size="11" fill="#374151">Location, Binding, DescriptorSet, Block, Offset</text>
<rect x="40" y="326" width="300" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="190.0" y="349.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Types, constants, global variables</text>
<text x="360" y="349" text-anchor="start" font-size="11" fill="#374151">OpTypeStruct, OpConstant, OpSpecConstant, OpVariable</text>
<rect x="40" y="372" width="300" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="395.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Function declarations and definitions</text>
<text x="360" y="395" text-anchor="start" font-size="11" fill="#374151">basic blocks, OpLoad / OpStore, OpAccessChain</text>
<text x="380" y="432" text-anchor="middle" font-size="11" fill="#374151">The validator checks this ordering; tools such as spirv-opt and spirv-cross rely on it.</text>
</svg>
