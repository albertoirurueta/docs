<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sv2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Life of a UnityWebRequest: send, wait, check the result, read, dispose</text>
<rect x="20" y="60" width="130" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="36" y="80.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="85" y="102" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Create</text>
<text x="85" y="124" text-anchor="middle" font-size="10.5" fill="#374151">UnityWebRequest.Get(url)</text>
<text x="85" y="142" text-anchor="middle" font-size="10.5" fill="#374151">inside a using block</text>
<line x1="150" y1="110" x2="167" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sv2)"/>
<rect x="167" y="60" width="130" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="183" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="183" y="80.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="232" y="102" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Send</text>
<text x="232" y="124" text-anchor="middle" font-size="10.5" fill="#374151">SendWebRequest()</text>
<text x="232" y="142" text-anchor="middle" font-size="10.5" fill="#374151">await or yield</text>
<line x1="297" y1="110" x2="314" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sv2)"/>
<rect x="314" y="60" width="130" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="330" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="330" y="80.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="379" y="102" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Wait</text>
<text x="379" y="124" text-anchor="middle" font-size="10.5" fill="#374151">frames keep running</text>
<text x="379" y="142" text-anchor="middle" font-size="10.5" fill="#374151">progress is polled</text>
<line x1="444" y1="110" x2="461" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sv2)"/>
<rect x="461" y="60" width="130" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="477" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="477" y="80.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="526" y="102" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Check</text>
<text x="526" y="124" text-anchor="middle" font-size="10.5" fill="#374151">request.result</text>
<text x="526" y="142" text-anchor="middle" font-size="10.5" fill="#374151">enum, not isError</text>
<line x1="591" y1="110" x2="608" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sv2)"/>
<rect x="608" y="60" width="130" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="624" cy="76" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="624" y="80.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="673" y="102" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Read</text>
<text x="673" y="124" text-anchor="middle" font-size="10.5" fill="#374151">downloadHandler.text</text>
<text x="673" y="142" text-anchor="middle" font-size="10.5" fill="#374151">then parse JSON</text>
<text x="380" y="200" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">request.result takes one of five values</text>
<rect x="20" y="215" width="130" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="85.0" y="241.85" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Success</text>
<text x="85.0" y="255.85" text-anchor="middle" font-size="11" fill="#1F2937">use the data</text>
<rect x="167" y="215" width="130" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="232.0" y="241.85" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">InProgress</text>
<text x="232.0" y="255.85" text-anchor="middle" font-size="11" fill="#374151">not finished yet</text>
<rect x="314" y="215" width="130" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="379.0" y="241.85" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">ConnectionError</text>
<text x="379.0" y="255.85" text-anchor="middle" font-size="11" fill="#92400E">no network or TLS</text>
<rect x="461" y="215" width="130" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="526.0" y="241.85" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">ProtocolError</text>
<text x="526.0" y="255.85" text-anchor="middle" font-size="11" fill="#92400E">HTTP 4xx or 5xx</text>
<rect x="608" y="215" width="130" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="673.0" y="241.85" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">DataProcessingError</text>
<text x="673.0" y="255.85" text-anchor="middle" font-size="11" fill="#92400E">bad or corrupt data</text>
<rect x="20" y="295" width="720" height="45" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="314" text-anchor="middle" font-size="11" fill="#374151">Dispose the request (a using block) so native buffers are released; retry only idempotent requests, with a back-off.</text>
<text x="380" y="331" text-anchor="middle" font-size="11" fill="#374151">ProtocolError still carries the response code and the body: read them before you dispose.</text>
</svg>
