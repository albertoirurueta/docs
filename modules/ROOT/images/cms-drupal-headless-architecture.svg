<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Headless architecture: Drupal back end, Next.js front end and the three data flows between them</title>
  <desc id="d">Editors work in the Drupal back end, which exposes JSON:API, the Decoupled Router, the menu linkset endpoint and OAuth. The Next.js front end fetches content from those endpoints on the server. Drupal pushes revalidation requests to the front end when content changes, and editors open draft previews through the front end. Visitors only talk to the Next.js site or its CDN.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>

  <!-- actors -->
  <rect x="20" y="20" width="170" height="60" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="105" y="46" text-anchor="middle" font-weight="bold" fill="#263238">Editors</text>
  <text x="105" y="65" text-anchor="middle" fill="#263238">edit and preview</text>
  <rect x="710" y="20" width="170" height="60" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="795" y="46" text-anchor="middle" font-weight="bold" fill="#263238">Visitors and kiosks</text>
  <text x="795" y="65" text-anchor="middle" fill="#263238">browsers on site visits</text>

  <!-- Drupal -->
  <rect x="20" y="130" width="360" height="300" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="154" text-anchor="middle" font-weight="bold" fill="#0d47a1">Drupal back end (cms.meridian.example)</text>
  <rect x="40" y="170" width="320" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="200" y="194" text-anchor="middle" fill="#0d47a1">Content, moderation, media, translations</text>
  <rect x="40" y="218" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="115" y="242" text-anchor="middle" fill="#0d47a1">JSON:API (core)</text>
  <rect x="210" y="218" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="285" y="242" text-anchor="middle" fill="#0d47a1">Decoupled Router</text>
  <rect x="40" y="266" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="115" y="290" text-anchor="middle" fill="#0d47a1">Menu linkset</text>
  <rect x="210" y="266" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="285" y="290" text-anchor="middle" fill="#0d47a1">Simple OAuth</text>
  <rect x="40" y="314" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="115" y="338" text-anchor="middle" fill="#0d47a1">Next module</text>
  <rect x="210" y="314" width="150" height="38" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="285" y="338" text-anchor="middle" fill="#0d47a1">Canvas headless</text>
  <text x="200" y="382" text-anchor="middle" fill="#0d47a1">Cache tags: node:12, taxonomy_term:3, config:system.menu.main</text>
  <text x="200" y="406" text-anchor="middle" fill="#0d47a1">CORS and OAuth scopes guard every endpoint</text>

  <!-- Next.js -->
  <rect x="520" y="130" width="360" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="700" y="154" text-anchor="middle" font-weight="bold" fill="#1b5e20">Next.js front end (www.meridian.example)</text>
  <rect x="540" y="170" width="320" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="700" y="194" text-anchor="middle" fill="#1b5e20">App Router pages: [...slug], /kiosk</text>
  <rect x="540" y="218" width="150" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="615" y="242" text-anchor="middle" fill="#1b5e20">Server Components</text>
  <rect x="710" y="218" width="150" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="785" y="242" text-anchor="middle" fill="#1b5e20">NextDrupal client</text>
  <rect x="540" y="266" width="150" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="615" y="290" text-anchor="middle" fill="#1b5e20">/api/draft</text>
  <rect x="710" y="266" width="150" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="785" y="290" text-anchor="middle" fill="#1b5e20">/api/revalidate</text>
  <rect x="540" y="314" width="320" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="700" y="338" text-anchor="middle" fill="#1b5e20">Data cache with tags, Full Route Cache</text>
  <text x="700" y="382" text-anchor="middle" fill="#1b5e20">Secrets only in server environment variables</text>
  <text x="700" y="406" text-anchor="middle" fill="#1b5e20">Served through a CDN</text>

  <!-- flows -->
  <line x1="105" y1="80" x2="105" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="795" y1="80" x2="795" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="200" x2="520" y2="200" stroke="#37474f" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="0"/>
  <text x="450" y="188" text-anchor="middle" fill="#263238">1 fetch</text>
  <line x1="380" y1="300" x2="520" y2="300" stroke="#c62828" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="288" text-anchor="middle" fill="#b71c1c">2 revalidate</text>
  <line x1="520" y1="260" x2="380" y2="260" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="450" y="250" text-anchor="middle" fill="#4a148c">3 draft</text>

  <!-- legend -->
  <text x="20" y="470" fill="#263238">1 The front end reads content on the server through JSON:API, the router and the linkset, authenticated with OAuth when needed.</text>
  <text x="20" y="492" fill="#263238">2 Drupal calls the front end when an entity changes so the cached pages for its tags are refreshed.</text>
  <text x="20" y="514" fill="#263238">3 Editors preview unpublished content: the front end enables draft mode and reads the latest revision.</text>
</svg>
