<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The vectors of one lighting calculation</text>
<rect x="20" y="50" width="520" height="310" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<line x1="110" y1="300" x2="520" y2="300" stroke="#1F2937" stroke-width="3"/>
<text x="130" y="322" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">surface</text>
<line x1="380" y1="300" x2="380" y2="145" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah1-a)"/>
<text x="392" y="142" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">N  normal</text>
<line x1="380" y1="300" x2="200" y2="200" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah1-w)"/>
<text x="190" y="172" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">L  to light</text>
<line x1="380" y1="300" x2="500" y2="183" stroke="#047857" stroke-width="2.5" marker-end="url(#ah1)"/>
<text x="520" y="156" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">V  to eye</text>
<line x1="380" y1="300" x2="348" y2="153" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ah1)"/>
<text x="318" y="148" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">H  half vector</text>
<line x1="380" y1="300" x2="514" y2="233" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah1)" stroke-dasharray="5 4"/>
<text x="528" y="236" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">R</text>
<circle cx="380" cy="300" r="11" fill="#374151"/>
<text x="380" y="304.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>
<text x="380" y="342" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shaded point P</text>
<circle cx="188" cy="194" r="9" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<ellipse cx="512" cy="176" rx="12" ry="7" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><circle cx="512" cy="176" r="3" fill="#047857"/>
<rect x="560" y="50" width="180" height="310" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Terms</text>
<text x="574" y="108" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">diffuse</text>
<text x="574" y="124" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">max(N·L, 0)</text>
<text x="574" y="146" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">specular (Phong)</text>
<text x="574" y="162" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">max(R·V, 0)^s</text>
<text x="574" y="184" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">specular (Blinn)</text>
<text x="574" y="200" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">max(N·H, 0)^s</text>
<text x="574" y="222" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">H</text>
<text x="574" y="238" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">normalize(L + V)</text>
<text x="574" y="260" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">R</text>
<text x="574" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">reflect(-L, N)</text>
<text x="574" y="298" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">all vectors</text>
<text x="574" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">unit length</text>
</svg>
