<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>Trust boundaries of the DocsAssistant</title>
  <desc>Architecture of the DocsAssistant with its trust boundaries. On the left, outside every boundary, are untrusted inputs: the user typing in a chat or voice channel, uploaded documents and web pages, and third-party MCP servers. In the middle, inside the application boundary, are the orchestrator with the model, which is treated as an untrusted but useful component, and the guardrail layer around it. Retrieved data from the vector store and tool results cross the model boundary as text and can carry instructions. On the right, inside the privileged boundary, are the tools search_docs and open_issue, internal services such as the ticketing API, and secrets, which the model must never see. Every arrow that crosses a dashed boundary needs a control: authentication, validation, authorisation, filtering or human approval.</desc>
  <rect x="0" y="0" width="1000" height="520" fill="#f8fafc"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Trust boundaries of the DocsAssistant</text>

  <rect x="20" y="55" width="230" height="430" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="135" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Untrusted</text>
  <rect x="35" y="95" width="200" height="60" rx="6" fill="#ffffff" stroke="#991b1b"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" fill="#1e293b">Users (web, Teams,</text>
  <text x="135" y="138" text-anchor="middle" font-size="12" fill="#1e293b">WhatsApp, voice)</text>
  <rect x="35" y="175" width="200" height="60" rx="6" fill="#ffffff" stroke="#991b1b"/>
  <text x="135" y="200" text-anchor="middle" font-size="12" fill="#1e293b">Uploaded documents,</text>
  <text x="135" y="218" text-anchor="middle" font-size="12" fill="#1e293b">web pages, e-mail</text>
  <rect x="35" y="255" width="200" height="60" rx="6" fill="#ffffff" stroke="#991b1b"/>
  <text x="135" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Third-party MCP servers</text>
  <text x="135" y="298" text-anchor="middle" font-size="12" fill="#1e293b">and other agents</text>
  <rect x="35" y="335" width="200" height="60" rx="6" fill="#ffffff" stroke="#991b1b"/>
  <text x="135" y="360" text-anchor="middle" font-size="12" fill="#1e293b">Training and fine-tuning</text>
  <text x="135" y="378" text-anchor="middle" font-size="12" fill="#1e293b">data, model weights</text>

  <rect x="300" y="55" width="330" height="430" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="465" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Application boundary</text>
  <rect x="320" y="95" width="290" height="50" rx="6" fill="#ffffff" stroke="#92400e"/>
  <text x="465" y="125" text-anchor="middle" font-size="12" fill="#1e293b">Input guardrails: auth, limits, filters</text>
  <rect x="320" y="165" width="290" height="110" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
  <text x="465" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Orchestrator + LLM</text>
  <text x="465" y="212" text-anchor="middle" font-size="12" fill="#1e293b">Persuadable: instructions and data</text>
  <text x="465" y="230" text-anchor="middle" font-size="12" fill="#1e293b">share one channel (text)</text>
  <text x="465" y="256" text-anchor="middle" font-size="12" fill="#991b1b">Treat as untrusted component</text>
  <rect x="320" y="295" width="290" height="50" rx="6" fill="#ffffff" stroke="#92400e"/>
  <text x="465" y="325" text-anchor="middle" font-size="12" fill="#1e293b">Vector store (retrieved text, memory)</text>
  <rect x="320" y="365" width="290" height="50" rx="6" fill="#ffffff" stroke="#92400e"/>
  <text x="465" y="395" text-anchor="middle" font-size="12" fill="#1e293b">Output guardrails: validate, encode, redact</text>
  <text x="465" y="445" text-anchor="middle" font-size="12" fill="#1e293b">Logging, budgets, monitoring</text>

  <rect x="690" y="55" width="290" height="430" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="835" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Privileged</text>
  <rect x="705" y="95" width="260" height="60" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="835" y="120" text-anchor="middle" font-size="12" fill="#1e293b">Tool search_docs (read)</text>
  <text x="835" y="138" text-anchor="middle" font-size="12" fill="#1e293b">per-user ACL filter</text>
  <rect x="705" y="175" width="260" height="60" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="835" y="200" text-anchor="middle" font-size="12" fill="#1e293b">Tool open_issue (write)</text>
  <text x="835" y="218" text-anchor="middle" font-size="12" fill="#1e293b">human approval</text>
  <rect x="705" y="255" width="260" height="60" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="835" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Internal services</text>
  <text x="835" y="298" text-anchor="middle" font-size="12" fill="#1e293b">(ticketing API, databases)</text>
  <rect x="705" y="335" width="260" height="60" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="835" y="360" text-anchor="middle" font-size="12" fill="#1e293b">Secrets and credentials</text>
  <text x="835" y="378" text-anchor="middle" font-size="12" fill="#991b1b">never in the prompt</text>

  <g stroke="#0f172a" stroke-width="1.8" fill="none">
    <path d="M235 125 H320"/><path d="M235 205 H280 V190 H320"/><path d="M235 285 H280 V240 H320"/>
    <path d="M465 275 V295"/><path d="M610 220 H705"/><path d="M610 390 H640 V300 H705" stroke-dasharray="4 3"/>
  </g>
  <text x="270" y="478" text-anchor="middle" font-size="11" fill="#1e293b">Boundary 1: input</text>
  <text x="660" y="478" text-anchor="middle" font-size="11" fill="#1e293b">Boundary 2: tool calls and results</text>
</svg>
