<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">TensorFlow Serving model layout and endpoints</title>
<desc id="d">A model base path holds numbered version directories, each a SavedModel. The model server loads the latest or the configured versions, maps version labels such as stable and canary to numbers, and exposes gRPC on port 8500 and REST on port 8501 to clients.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Model directory, server and clients</text>
<rect x="24" y="60" width="200" height="220" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="124" y="82" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">/models/my_model/</text>
<rect x="40" y="96" width="168" height="52" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="124" y="118" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">1/ saved_model.pb</text>
<text x="124" y="136" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">variables/</text>
<rect x="40" y="160" width="168" height="52" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="124" y="182" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">2/ saved_model.pb</text>
<text x="124" y="200" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569" text-anchor="middle">variables/</text>
<text x="124" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">one numeric folder</text>
<text x="124" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">per version</text>
<rect x="290" y="90" width="170" height="150" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="375" y="116" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">tensorflow_model_server</text>
<text x="375" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">version policy: latest</text>
<text x="375" y="164" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">or specific versions</text>
<text x="375" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">labels: stable = 1</text>
<text x="375" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">canary = 2</text>
<rect x="540" y="80" width="156" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="618" y="106" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">gRPC :8500</text>
<text x="618" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">PredictionService</text>
<rect x="540" y="190" width="156" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="618" y="216" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">REST :8501</text>
<text x="618" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">/v1/models/...:predict</text>
<line x1="224" y1="165" x2="288" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="140" x2="538" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="190" x2="538" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="256" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569" text-anchor="middle">polls</text>
<text x="360" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Redrawn from the concepts in the TensorFlow Serving documentation.</text>
</svg>
