<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sm-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the Bookshelf shelf gets its shadow</text>
<rect x="15" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="65" r="11" fill="#4F46E5"/><text x="30" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="35" y="90" width="130" height="100" fill="#F9FAFB" stroke="#4B5563"/>
<text x="100" y="146" font-size="11" fill="#374151" text-anchor="middle">view from the lamp</text>
<text x="100" y="215" font-size="11" fill="#374151" text-anchor="middle">bind depth FBO</text>
<text x="100" y="232" font-size="11" fill="#374151" text-anchor="middle">draw casters with</text>
<text x="100" y="249" font-size="11" fill="#374151" text-anchor="middle">the light matrix</text>
<rect x="195" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="210" cy="65" r="11" fill="#4F46E5"/><text x="210" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<defs><linearGradient id="sm-depth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9FAFB"/><stop offset="1" stop-color="#6B7280"/></linearGradient></defs>
<rect x="215" y="90" width="130" height="100" fill="url(#sm-depth)" stroke="#4B5563"/>
<rect x="250" y="115" width="30" height="50" fill="#374151"/>
<text x="280" y="215" font-size="11" fill="#374151" text-anchor="middle">depth texture</text>
<text x="280" y="232" font-size="11" fill="#374151" text-anchor="middle">dark = near the light</text>
<rect x="375" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="390" cy="65" r="11" fill="#4F46E5"/><text x="390" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="395" y="90" width="130" height="100" fill="#F9FAFB" stroke="#4B5563"/>
<rect x="395" y="150" width="130" height="40" fill="#D1FAE5"/>
<rect x="455" y="150" width="45" height="40" fill="#374151" opacity="0.6"/>
<text x="460" y="215" font-size="11" fill="#374151" text-anchor="middle">camera pass: each pixel</text>
<text x="460" y="232" font-size="11" fill="#374151" text-anchor="middle">is projected into light</text>
<text x="460" y="249" font-size="11" fill="#374151" text-anchor="middle">space and compared</text>
<rect x="555" y="50" width="190" height="240" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="570" cy="65" r="11" fill="#B45309"/><text x="570" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="585" y="90" width="130" height="100" fill="#FEF3C7" stroke="#4B5563"/>
<rect x="585" y="150" width="130" height="40" fill="#FDE68A"/>
<polygon points="650,150 715,150 715,190 625,190" fill="#92400E" opacity="0.45"/>
<text x="650" y="215" font-size="11" fill="#374151" text-anchor="middle">lit colour is multiplied by</text>
<text x="650" y="232" font-size="11" fill="#374151" text-anchor="middle">the shadow factor, with PCF</text>
<text x="650" y="249" font-size="11" fill="#374151" text-anchor="middle">softening the edge</text>
<path d="M185 170 L195 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sm-sb)"/>
<path d="M365 170 L375 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sm-sb)"/>
<path d="M545 170 L555 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sm-sb)"/>
<rect x="15" y="310" width="730" height="58" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="334" font-size="12" fill="#374151" text-anchor="middle">Panels 1 and 2 are the shadow pass (depth only). Panels 3 and 4 are the main pass with the depth texture bound.</text>
<text x="380" y="353" font-size="12" fill="#374151" text-anchor="middle">The shadow pass runs again every frame in which a caster or the light moves.</text>
</svg>
