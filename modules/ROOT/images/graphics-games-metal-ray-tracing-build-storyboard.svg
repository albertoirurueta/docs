<text x="380" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Steps 2 to 5 run on the GPU timeline; step 5 needs the compacted size read back after the build finishes.</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Compaction is optional for a handful of books, and recommended for large static scenes.</text>
