<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-tessellation-vs-mesh-shaders" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Tessellation or mesh shaders?</text>
<rect x="30" y="55" width="320" height="250" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="131.7" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Tessellation</text>
<text x="190.0" y="146.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Fixed-function tessellator</text>
<text x="190.0" y="161.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Patches in, regular triangle grid out</text>
<text x="190.0" y="176.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Works on Metal 3 encoders only</text>
<text x="190.0" y="191.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Factor buffer + post-tess vertex function</text>
<text x="190.0" y="206.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Good: smooth displaced surfaces</text>
<text x="190.0" y="221.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Limits: max factor 64, no culling</text>
<text x="190.0" y="236.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Limits: no per-meshlet culling stage</text>
<rect x="410" y="55" width="320" height="250" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="131.7" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Mesh shaders</text>
<text x="570.0" y="146.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Object stage amplifies and culls</text>
<text x="570.0" y="161.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Mesh stage emits vertices + primitives</text>
<text x="570.0" y="176.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Available on Metal 3 and Metal 4</text>
<text x="570.0" y="191.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">drawMeshThreadgroups, no vertex fetch</text>
<text x="570.0" y="206.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Good: LOD, culling, procedural geometry</text>
<text x="570.0" y="221.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Limits: you write the subdivision</text>
<text x="570.0" y="236.7" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">Limits: A14+ / Apple silicon GPUs</text>
<text x="380" y="325" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Rule of thumb: keep tessellation for existing content; build new amplification on mesh shaders.</text>
</svg>
