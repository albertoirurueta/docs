<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-rendering-pipeline-clip-ndc-window" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip space, normalised device coordinates, window coordinates</text>
<rect x="20" y="70" width="200" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="104.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Clip space</text>
<text x="120.0" y="119.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">gl_Position = (x, y, z, w)</text>
<text x="120.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">-w &lt;= x,y,z &lt;= w</text>
<rect x="280" y="70" width="200" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="104.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">NDC</text>
<text x="380.0" y="119.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(x/w, y/w, z/w)</text>
<text x="380.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">each in -1 .. 1</text>
<rect x="540" y="70" width="200" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="104.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Window space</text>
<text x="640.0" y="119.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">pixels from lower left</text>
<text x="640.0" y="134.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">depth in 0..1 (glDepthRange)</text>
<line x1="220" y1="115" x2="280" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-rendering-pipeline-clip-ndc-window)"/>
<line x1="480" y1="115" x2="540" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-rendering-pipeline-clip-ndc-window)"/>
<text x="250" y="100" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">clipping,</text>
<text x="250" y="112" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">divide by w</text>
<text x="510" y="100" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">viewport</text>
<text x="510" y="112" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">transform</text>
<rect x="20" y="200" width="720" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="226.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">x_w = (x_ndc + 1) * width / 2 + x0      y_w = (y_ndc + 1) * height / 2 + y0</text>
<text x="380.0" y="241.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">z_w = (f - n) / 2 * z_ndc + (n + f) / 2   with n = 0, f = 1 by default</text>
<rect x="20" y="285" width="350" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="307.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">OpenGL default NDC depth: -1 .. 1</text>
<text x="195.0" y="321.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">(glClipControl can switch to 0 .. 1, 4.5+)</text>
<rect x="390" y="285" width="350" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="307.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Window origin is the lower left,</text>
<text x="565.0" y="321.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">unlike Direct3D, Vulkan and Metal</text>
</svg>
