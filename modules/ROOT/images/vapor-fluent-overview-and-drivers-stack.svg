<text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Fluent stack from your handler down to the database server</text>
<text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">Fluent 4.13.0, FluentKit 1.57.0, SQLKit 3.36.0 and the four drivers pinned on this page</text>
<rect x="40" y="64" width="860" height="62" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
<text x="470.0" y="84" font-size="13" font-weight="bold" fill="#8a6a00" text-anchor="middle">Your Vapor app (Bookshelf)</text>
<text x="470.0" y="102" font-size="11" fill="#222222" text-anchor="middle">Author.query(on: req.db), book.save(on: req.db), app.databases.use(...), app.migrations.add(...)</text>
<line x1="470" y1="126" x2="470" y2="148" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="148" width="860" height="62" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
<text x="470.0" y="168" font-size="13" font-weight="bold" fill="#1f5f99" text-anchor="middle">Fluent (package vapor/fluent)</text>
<text x="470.0" y="186" font-size="11" fill="#222222" text-anchor="middle">Vapor glue: req.db and app.db, app.databases, app.migrations, the migrate command and --auto-migrate, sessions, paginate(for:)</text>
<line x1="470" y1="210" x2="470" y2="232" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
