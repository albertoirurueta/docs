<text x="470.0" y="252" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">FluentKit (database-agnostic core, no Vapor dependency)</text>
<text x="470.0" y="270" font-size="11" fill="#222222" text-anchor="middle">Model, @Field and relations, QueryBuilder, Database, DatabaseDriver, DatabaseID, Migration, SchemaBuilder</text>
<text x="470.0" y="285" font-size="11" fill="#222222" text-anchor="middle">Databases: the registry of configurations and the lazily created drivers</text>
