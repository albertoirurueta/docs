<rect x="20" y="282" width="720" height="46" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="301.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">On webglcontextrestored: registry.create() runs again, so every handle is replaced from its recipe.</text>
<text x="380.0" y="315.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Draw code looks handles up by name each frame, never caching them in closures.</text>
