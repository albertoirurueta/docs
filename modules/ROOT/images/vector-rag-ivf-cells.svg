<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <text x="350" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">IVF: vectors partitioned into nlist cells</text>
  <text x="350" y="46" font-size="12" fill="#666666" text-anchor="middle">A query only scans the nprobe = 2 cells closest to it, not the whole space</text>

  <rect x="40" y="65" width="620" height="340" fill="#fbfbfb" stroke="#dddddd" stroke-width="1"/>

  <!-- irregular cell boundaries approximating a Voronoi partition around 6 centroids -->
  <g stroke="#c9c9c9" stroke-width="1.3" fill="none">
    <line x1="230" y1="65" x2="200" y2="405"/>
    <line x1="230" y1="65" x2="420" y2="65"/>
    <path d="M 420 65 L 400 220 L 470 405"/>
    <path d="M 200 405 L 260 250 L 400 220"/>
    <line x1="470" y1="405" x2="660" y2="230"/>
    <path d="M 400 220 L 550 180 L 660 230"/>
    <line x1="550" y1="180" x2="420" y2="65"/>
  </g>

  <!-- centroids -->
  <g fill="#1c4b73">
    <circle cx="140" cy="150" r="6"/>
    <circle cx="320" cy="130" r="6"/>
    <circle cx="300" cy="330" r="6"/>
    <circle cx="470" cy="330" r="6"/>
    <circle cx="560" cy="260" r="6"/>
    <circle cx="500" cy="120" r="6"/>
  </g>
  <text x="140" y="140" font-size="10" fill="#1c4b73" text-anchor="middle">c1</text>
  <text x="320" y="120" font-size="10" fill="#1c4b73" text-anchor="middle">c2</text>
  <text x="300" y="350" font-size="10" fill="#1c4b73" text-anchor="middle">c3</text>
  <text x="470" y="350" font-size="10" fill="#1c4b73" text-anchor="middle">c4</text>
  <text x="560" y="250" font-size="10" fill="#1c4b73" text-anchor="middle">c5</text>
  <text x="500" y="110" font-size="10" fill="#1c4b73" text-anchor="middle">c6</text>

  <!-- scattered points, colored by which cell they belong to, matching centroid color family -->
  <g fill="#7a9cc0">
    <circle cx="110" cy="110" r="4"/><circle cx="170" cy="180" r="4"/><circle cx="90" cy="190" r="4"/>
    <circle cx="150" cy="100" r="4"/><circle cx="120" cy="220" r="4"/>
  </g>
  <g fill="#93b98f">
    <circle cx="280" cy="100" r="4"/><circle cx="350" cy="160" r="4"/><circle cx="300" cy="90" r="4"/>
    <circle cx="370" cy="100" r="4"/>
  </g>
  <g fill="#c9a26a">
    <circle cx="260" cy="300" r="4"/><circle cx="320" cy="360" r="4"/><circle cx="230" cy="350" r="4"/>
    <circle cx="290" cy="280" r="4"/>
  </g>
  <g fill="#d68a6a">
    <circle cx="430" cy="300" r="4"/><circle cx="500" cy="370" r="4"/><circle cx="450" cy="360" r="4"/>
    <circle cx="500" cy="290" r="4"/>
  </g>
  <g fill="#b98fc0">
    <circle cx="590" cy="210" r="4"/><circle cx="620" cy="260" r="4"/><circle cx="580" cy="290" r="4"/>
  </g>
  <g fill="#8fc0bb">
    <circle cx="480" cy="90" r="4"/><circle cx="530" cy="150" r="4"/><circle cx="450" cy="150" r="4"/>
  </g>

  <!-- query point -->
  <circle cx="440" cy="270" r="7" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="440" y="255" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">q</text>

  <!-- highlight the two nearest cells (c4 and c5) -->
  <rect x="400" y="220" width="260" height="185" fill="#c0392b" fill-opacity="0.06" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <line x1="440" y1="270" x2="470" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="440" y1="270" x2="560" y2="260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="350" y="430" font-size="11" fill="#555555" text-anchor="middle">nlist = 6 cells shown; the red-dashed region (cells c4 and c5) is the nprobe = 2 subset scanned for this query</text>
</svg>
