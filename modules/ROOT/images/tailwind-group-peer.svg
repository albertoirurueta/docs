<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">group-* styles a descendant from a parent's state; peer-* styles a later sibling</text>

  <!-- ================= group side ================= -->
  <text x="185" y="62" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">group-hover</text>

  <rect x="45" y="78" width="280" height="96" rx="8" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="185" y="108" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">parent element</text>
  <text x="185" y="130" font-size="12" fill="#2f5424" text-anchor="middle">class="group"</text>
  <text x="185" y="150" font-size="12" fill="#2f5424" text-anchor="middle">pointer hovers here &#8594; :hover</text>

  <line x1="185" y1="178" x2="185" y2="252" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="220" font-size="11.5" fill="#1c4b73" text-anchor="middle">parent state</text>
  <text x="330" y="236" font-size="11.5" fill="#1c4b73" text-anchor="middle">reaches child</text>

  <rect x="70" y="258" width="230" height="118" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="185" y="288" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">nested child</text>
  <text x="185" y="312" font-size="12" fill="#1c4b73" text-anchor="middle">class="opacity-0</text>
  <text x="185" y="330" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">group-hover:opacity-100"</text>
  <text x="185" y="356" font-size="11" fill="#1c4b73" text-anchor="middle">restyles while the parent is hovered</text>

  <!-- ================= peer side ================= -->
  <text x="535" y="62" font-size="14" font-weight="bold" fill="#8a3d10" text-anchor="middle">peer-checked</text>

  <rect x="430" y="78" width="210" height="96" rx="8" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="535" y="108" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">&lt;input type="checkbox"&gt;</text>
  <text x="535" y="130" font-size="12" fill="#8a3d10" text-anchor="middle">class="peer"</text>
  <text x="535" y="150" font-size="12" fill="#8a3d10" text-anchor="middle">user ticks it &#8594; :checked</text>

  <line x1="535" y1="178" x2="535" y2="252" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="648" y="212" font-size="11.5" fill="#1c4b73" text-anchor="middle">sibling</text>
  <text x="648" y="228" font-size="11.5" fill="#1c4b73" text-anchor="middle">state flows</text>
  <text x="648" y="244" font-size="11.5" fill="#1c4b73" text-anchor="middle">forward only</text>

  <rect x="420" y="258" width="235" height="118" rx="8" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="537" y="288" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">later sibling</text>
  <text x="537" y="312" font-size="12" fill="#1c4b73" text-anchor="middle">class="hidden</text>
  <text x="537" y="330" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">peer-checked:block"</text>
  <text x="537" y="356" font-size="11" fill="#1c4b73" text-anchor="middle">appears once the peer is checked</text>

  <text x="360" y="404" font-size="11.5" fill="#444444" text-anchor="middle">peer-* only matches a sibling that comes AFTER the .peer element in source order; group-* works at any depth below .group.</text>
</svg>
