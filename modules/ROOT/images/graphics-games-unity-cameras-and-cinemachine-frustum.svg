<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">The camera frustum: perspective and orthographic</text>
<text x="20" y="60" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Perspective</text>
<polygon points="70,150 190,128 190,172" fill="none" stroke="#E5E7EB" stroke-width="1"/>
<polygon points="190,128 600,80 600,220 190,172" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="70" y1="150" x2="190" y2="128" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="70" y1="150" x2="190" y2="172" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="190" y1="128" x2="190" y2="172" stroke="#3730A3" stroke-width="2"/>
<line x1="600" y1="80" x2="600" y2="220" stroke="#3730A3" stroke-width="2"/>
<rect x="48" y="138" width="24" height="24" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="60" y="154" text-anchor="middle" font-size="9" fill="#374151">Cam</text>
<text x="190" y="120" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">near plane</text>
<text x="600" y="72" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">far plane</text>
<line x1="70" y1="150" x2="620" y2="150" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M130,126 A62,62 0 0 1 130,174" fill="none" stroke="#B45309" stroke-width="1.5"/>
<text x="160" y="154" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">FOV</text>
<text x="195" y="190" text-anchor="start" font-size="10" fill="#4B5563">Near Clip Plane</text>
<text x="595" y="240" text-anchor="end" font-size="10" fill="#4B5563">Far Clip Plane</text>
<rect x="380" y="126" width="16" height="48" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="388" y="192" text-anchor="middle" font-size="10" fill="#047857">Book</text>
<rect x="632" y="124" width="118" height="52" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="640" y="142" text-anchor="start" font-size="10" fill="#374151">FOV is vertical;</text>
<text x="640" y="155" text-anchor="start" font-size="10" fill="#374151">width = height x</text>
<text x="640" y="168" text-anchor="start" font-size="10" fill="#374151">aspect ratio</text>
<text x="20" y="290" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Orthographic</text>
<rect x="80" y="330" width="520" height="80" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="80" y1="330" x2="80" y2="410" stroke="#3730A3" stroke-width="2"/>
<line x1="600" y1="330" x2="600" y2="410" stroke="#3730A3" stroke-width="2"/>
<rect x="48" y="358" width="24" height="24" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="60" y="374" text-anchor="middle" font-size="9" fill="#374151">Cam</text>
<line x1="70" y1="370" x2="80" y2="370" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="80" y1="330" x2="600" y2="330" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="80" y1="410" x2="600" y2="410" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="700" y1="330" x2="700" y2="410" stroke="#B45309" stroke-width="1.5" marker-end="url(#m-caw)"/>
<line x1="700" y1="410" x2="700" y2="330" stroke="#B45309" stroke-width="1.5" marker-end="url(#m-caw)"/>
<text x="712" y="374" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">Size</text>
<text x="200" y="432" text-anchor="start" font-size="11" fill="#4B5563">parallel edges: size does not change with distance; Size is half the visible height</text>
<text x="20" y="448" text-anchor="start" font-size="11" fill="#4B5563">Objects outside the frustum are culled. The clip planes bound the depth range, and a large far to near ratio costs depth precision.</text>
