<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-image-based-lighting-and-hdr-edr-output-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From linear HDR to an extended-range display</text>
<rect x="20" y="70" width="128" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84.0" y="104.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Scene colour</text>
<text x="84.0" y="118.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">rgba16Float,</text>
<text x="84.0" y="132.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">linear, values &gt; 1</text>
<line x1="148" y1="115" x2="168" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-edr-output-chain)"/>
<rect x="168" y="70" width="128" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="232.0" y="104.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Tone map</text>
<text x="232.0" y="118.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">exposure + curve</text>
<text x="232.0" y="132.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">to the target range</text>
<line x1="296" y1="115" x2="316" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-edr-output-chain)"/>
<rect x="316" y="70" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="104.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Encode</text>
<text x="380.0" y="118.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">extended linear</text>
<text x="380.0" y="132.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Display P3 layer</text>
<line x1="444" y1="115" x2="464" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-edr-output-chain)"/>
<rect x="464" y="70" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="528.0" y="104.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Compositor</text>
<text x="528.0" y="118.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">EDR headroom</text>
<text x="528.0" y="132.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">from the screen</text>
<line x1="592" y1="115" x2="612" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-image-based-lighting-and-hdr-edr-output-chain)"/>
<rect x="612" y="70" width="128" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="676.0" y="104.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Display</text>
<text x="676.0" y="118.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">SDR white at 1.0</text>
<text x="676.0" y="132.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">highlights above</text>
<text x="380" y="205" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Headroom: how far above SDR white the display can go right now</text>
<rect x="60" y="225" width="640" height="24" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="1"/>
<rect x="60" y="225" width="200" height="24" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="160" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">0 to 1.0: SDR range</text>
<rect x="260" y="225" width="260" height="24" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="390" y="242" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">1.0 to headroom: EDR highlights</text>
<text x="60" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">A tone-mapping curve shaped by the headroom keeps highlights.</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Read the headroom each frame instead of assuming a fixed peak brightness.</text>
</svg>
