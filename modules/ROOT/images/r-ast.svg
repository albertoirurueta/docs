<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="15">
<title id="t">Abstract syntax tree of y &lt;- a + b * 2 and how as.list() splits it level by level</title>
<desc id="d">Left panel: a tree with seven nodes. The root is a call to the function &lt;- (the assignment). Its second element is the symbol y and its third element is a call to the function +. That call has the symbol a as its second element and a call to the function * as its third element. The call to * has the symbol b as its second element and the constant 2 as its third element. Each edge is labelled with the index of the child in the parent call. Right panel: as.list(e) of the whole call gives the function &lt;-, the symbol y and the call a + b * 2; as.list(e[[3]]) gives the function +, the symbol a and the call b * 2; as.list(e[[3]][[3]]) gives the function *, the symbol b and the constant 2. Only calls can be split further; symbols and constants are the leaves.</desc>
<rect width="960" height="600" fill="#ffffff" stroke="#9aa3ad"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f2933">The syntax tree of y &lt;- a + b * 2</text>
<text x="20" y="48" font-size="13" fill="#3e4c59">e &lt;- quote(y &lt;- a + b * 2): every node is a symbol, a constant or a call whose first element is the function</text>
<rect x="20" y="60" width="600" height="520" fill="#fbfcfd" stroke="#9aa3ad"/>
<text x="40" y="84" font-weight="bold" fill="#1f2933">The tree</text>
<rect x="640" y="60" width="300" height="520" fill="#fbfcfd" stroke="#9aa3ad"/>
<text x="660" y="84" font-weight="bold" fill="#1f2933">as.list() at each level</text>
<line x1="250" y1="151" x2="105" y2="229" stroke="#52606d" stroke-width="2"/>
<line x1="250" y1="151" x2="370" y2="229" stroke="#52606d" stroke-width="2"/>
<line x1="370" y1="281" x2="280" y2="359" stroke="#52606d" stroke-width="2"/>
<line x1="370" y1="281" x2="470" y2="359" stroke="#52606d" stroke-width="2"/>
<line x1="470" y1="411" x2="390" y2="489" stroke="#52606d" stroke-width="2"/>
<line x1="470" y1="411" x2="550" y2="489" stroke="#52606d" stroke-width="2"/>
<text x="168" y="190" text-anchor="end" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="318" y="190" text-anchor="start" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<text x="317" y="320" text-anchor="end" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="428" y="320" text-anchor="start" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<text x="422" y="450" text-anchor="end" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="518" y="450" text-anchor="start" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<rect x="195" y="99" width="110" height="52" fill="#cfe3f7" stroke="#52606d" stroke-width="2"/>
<text x="250" y="119" text-anchor="middle" font-size="12" fill="#3e4c59">call</text>
<text x="250" y="141" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">`&lt;-`</text>
<rect x="50" y="229" width="110" height="52" rx="26" fill="#d9efd6" stroke="#52606d" stroke-width="2"/>
<text x="105" y="249" text-anchor="middle" font-size="12" fill="#3e4c59">symbol</text>
<text x="105" y="271" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">y</text>
<rect x="315" y="229" width="110" height="52" fill="#cfe3f7" stroke="#52606d" stroke-width="2"/>
<text x="370" y="249" text-anchor="middle" font-size="12" fill="#3e4c59">call</text>
<text x="370" y="271" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">`+`</text>
<rect x="225" y="359" width="110" height="52" rx="26" fill="#d9efd6" stroke="#52606d" stroke-width="2"/>
<text x="280" y="379" text-anchor="middle" font-size="12" fill="#3e4c59">symbol</text>
<text x="280" y="401" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">a</text>
<rect x="415" y="359" width="110" height="52" fill="#cfe3f7" stroke="#52606d" stroke-width="2"/>
<text x="470" y="379" text-anchor="middle" font-size="12" fill="#3e4c59">call</text>
<text x="470" y="401" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">`*`</text>
<rect x="335" y="489" width="110" height="52" rx="26" fill="#d9efd6" stroke="#52606d" stroke-width="2"/>
<text x="390" y="509" text-anchor="middle" font-size="12" fill="#3e4c59">symbol</text>
<text x="390" y="531" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">b</text>
<rect x="495" y="489" width="110" height="52" fill="#fbe7b5" stroke="#52606d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="550" y="509" text-anchor="middle" font-size="12" fill="#3e4c59">constant</text>
<text x="550" y="531" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">2</text>
<circle cx="195" cy="99" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="195" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">1</text>
<circle cx="315" cy="229" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="315" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">2</text>
<circle cx="415" cy="359" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="415" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">3</text>
<rect x="410" y="100" width="30" height="20" fill="#cfe3f7" stroke="#52606d" stroke-width="2"/>
<text x="450" y="115" font-size="13" fill="#1f2933">call (function first)</text>
<rect x="410" y="128" width="30" height="20" rx="10" fill="#d9efd6" stroke="#52606d" stroke-width="2"/>
<text x="450" y="143" font-size="13" fill="#1f2933">symbol (a name)</text>
<rect x="410" y="156" width="30" height="20" fill="#fbe7b5" stroke="#52606d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="450" y="171" font-size="13" fill="#1f2933">constant (a value)</text>
<text x="40" y="566" font-size="13" fill="#3e4c59">The shape is the precedence: * sits below + because it binds tighter.</text>
<rect x="652" y="94" width="276" height="112" fill="#ffffff" stroke="#9aa3ad"/>
<circle cx="672" cy="112" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="672" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">1</text>
<text x="692" y="117" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">as.list(e)</text>
<text x="668" y="142" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[1]]</text>
<text x="728" y="142" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">`&lt;-`</text>
<text x="668" y="164" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="728" y="164" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">y</text>
<text x="668" y="186" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<text x="728" y="186" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">a + b * 2</text>
<rect x="652" y="228" width="276" height="112" fill="#ffffff" stroke="#9aa3ad"/>
<circle cx="672" cy="246" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="672" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">2</text>
<text x="692" y="251" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">as.list(e[[3]])</text>
<text x="668" y="276" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[1]]</text>
<text x="728" y="276" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">`+`</text>
<text x="668" y="298" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="728" y="298" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">a</text>
<text x="668" y="320" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<text x="728" y="320" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">b * 2</text>
<rect x="652" y="362" width="276" height="112" fill="#ffffff" stroke="#9aa3ad"/>
<circle cx="672" cy="380" r="11" fill="#ffffff" stroke="#b34700" stroke-width="2"/>
<text x="672" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#b34700">3</text>
<text x="692" y="385" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f2933">as.list(e[[3]][[3]])</text>
<text x="668" y="410" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[1]]</text>
<text x="728" y="410" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">`*`</text>
<text x="668" y="432" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[2]]</text>
<text x="728" y="432" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">b</text>
<text x="668" y="454" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b34700">[[3]]</text>
<text x="728" y="454" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1f2933">2</text>
<text x="660" y="528" font-size="13" fill="#1f2933">e[[3]][[3]][[2]] is the symbol b.</text>
<text x="660" y="548" font-size="13" fill="#1f2933">e[[3]][[3]][[3]] is the constant 2.</text>
<text x="660" y="568" font-size="13" fill="#3e4c59">Only calls split further.</text>
</svg>
