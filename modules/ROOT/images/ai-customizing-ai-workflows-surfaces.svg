<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Customisation surfaces and where they load into context</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#444444">Claude Code / GitHub Copilot -- top row loads always, middle row loads on demand, bottom row runs outside the model's context</text>

  <!-- Column: main context window -->
  <rect x="30" y="76" width="900" height="150" rx="8" fill="#eaf1fb" stroke="#1c5c8a" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#123a5c">Always loaded into the main context window</text>

  <rect x="55" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="185" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Instructions &amp; memory</text>
  <text x="185" y="152" text-anchor="middle" font-size="10" fill="#123a5c">CLAUDE.md, AGENTS.md,</text>
  <text x="185" y="167" text-anchor="middle" font-size="10" fill="#123a5c">copilot-instructions.md</text>
  <text x="185" y="185" text-anchor="middle" font-size="10" fill="#123a5c">loaded every session start</text>

  <rect x="345" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="475" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Skill / prompt descriptions</text>
  <text x="475" y="152" text-anchor="middle" font-size="10" fill="#123a5c">every SKILL.md description</text>
  <text x="475" y="167" text-anchor="middle" font-size="10" fill="#123a5c">and prompt frontmatter is</text>
  <text x="475" y="185" text-anchor="middle" font-size="10" fill="#123a5c">always scanned for a match</text>

  <rect x="635" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="765" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Permissions &amp; settings</text>
  <text x="765" y="152" text-anchor="middle" font-size="10" fill="#123a5c">settings.json hierarchy,</text>
  <text x="765" y="167" text-anchor="middle" font-size="10" fill="#123a5c">allow / ask / deny rules</text>
  <text x="765" y="185" text-anchor="middle" font-size="10" fill="#123a5c">checked on every tool call</text>

  <!-- Column: loaded on demand -->
  <rect x="30" y="242" width="900" height="150" rx="8" fill="#eaf3ea" stroke="#1c6a3a" stroke-width="2"/>
  <text x="480" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#124a24">Loaded on demand, into the SAME context</text>

  <rect x="55" y="278" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c6a3a" stroke-width="1.5"/>
  <text x="185" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#124a24">Skill / prompt file body</text>
  <text x="185" y="318" text-anchor="middle" font-size="10" fill="#124a24">the full SKILL.md or</text>
  <text x="185" y="333" text-anchor="middle" font-size="10" fill="#124a24">.prompt.md loads only once</text>
  <text x="185" y="349" text-anchor="middle" font-size="10" fill="#124a24">its description/name matches</text>

  <rect x="345" y="278" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c6a3a" stroke-width="1.5"/>
  <text x="475" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#124a24">MCP tools</text>
  <text x="475" y="318" text-anchor="middle" font-size="10" fill="#124a24">an external server's tools,</text>
  <text x="475" y="333" text-anchor="middle" font-size="10" fill="#124a24">resources and prompts join</text>
  <text x="475" y="349" text-anchor="middle" font-size="10" fill="#124a24">the tool list once connected</text>

  <rect x="635" y="278" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c6a3a" stroke-width="1.5"/>
  <text x="765" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#124a24">Output style / statusline</text>
  <text x="765" y="318" text-anchor="middle" font-size="10" fill="#124a24">changes how turns are framed</text>
  <text x="765" y="333" text-anchor="middle" font-size="10" fill="#124a24">or what the CLI displays,</text>
  <text x="765" y="349" text-anchor="middle" font-size="10" fill="#124a24">not what tools are available</text>

  <!-- Column: isolated / outside context -->
  <rect x="30" y="408" width="900" height="150" rx="8" fill="#fbeaea" stroke="#8a1c1c" stroke-width="2"/>
  <text x="480" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c1414">Isolated from, or outside, the main context</text>

  <rect x="55" y="444" width="260" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="185" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Subagents</text>
  <text x="185" y="484" text-anchor="middle" font-size="10" fill="#5c1414">runs in its own fresh</text>
  <text x="185" y="499" text-anchor="middle" font-size="10" fill="#5c1414">context window, returns</text>
  <text x="185" y="515" text-anchor="middle" font-size="10" fill="#5c1414">only a summary to the caller</text>

  <rect x="345" y="444" width="260" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="475" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Hooks</text>
  <text x="475" y="484" text-anchor="middle" font-size="10" fill="#5c1414">a shell command runs</text>
  <text x="475" y="499" text-anchor="middle" font-size="10" fill="#5c1414">outside the model entirely,</text>
  <text x="475" y="515" text-anchor="middle" font-size="10" fill="#5c1414">deterministic, not requested</text>

  <rect x="635" y="444" width="260" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="765" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Plugins</text>
  <text x="765" y="484" text-anchor="middle" font-size="10" fill="#5c1414">a packaging boundary --</text>
  <text x="765" y="499" text-anchor="middle" font-size="10" fill="#5c1414">bundles skills, agents, hooks</text>
  <text x="765" y="515" text-anchor="middle" font-size="10" fill="#5c1414">and MCP servers as one unit</text>

  <text x="480" y="592" text-anchor="middle" font-size="11" fill="#444444">Every surface above still passes through the permissions layer before a tool call actually runs.</text>
</svg>
