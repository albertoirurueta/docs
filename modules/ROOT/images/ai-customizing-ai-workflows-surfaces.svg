<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Customisation surfaces and where they load into context</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#444444">Claude Code / GitHub Copilot -- top row loads always, middle row loads on demand, bottom row runs outside the model's context</text>

  <!-- Column: main context window -->
  <rect x="30" y="76" width="900" height="150" rx="8" fill="#eaf1fb" stroke="#1c5c8a" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#123a5c">Always loaded into the main context window</text>

  <rect x="55" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="185" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Instructions &amp; memory</text>
  <text x="185" y="152" text-anchor="middle" font-size="10" fill="#123a5c">CLAUDE.md, AGENTS.md,</text>
  <text x="185" y="167" text-anchor="middle" font-size="10" fill="#123a5c">copilot-instructions.md</text>
  <text x="185" y="185" text-anchor="middle" font-size="10" fill="#123a5c">loaded every session start</text>

  <rect x="345" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="475" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Skill / prompt descriptions</text>
  <text x="475" y="152" text-anchor="middle" font-size="10" fill="#123a5c">every SKILL.md description</text>
  <text x="475" y="167" text-anchor="middle" font-size="10" fill="#123a5c">and prompt frontmatter is</text>
  <text x="475" y="185" text-anchor="middle" font-size="10" fill="#123a5c">always scanned for a match</text>

  <rect x="635" y="112" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c5c8a" stroke-width="1.5"/>
  <text x="765" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">Output style</text>
  <text x="765" y="152" text-anchor="middle" font-size="10" fill="#123a5c">added to the system prompt</text>
  <text x="765" y="167" text-anchor="middle" font-size="10" fill="#123a5c">at session start; changes</text>
  <text x="765" y="183" text-anchor="middle" font-size="10" fill="#123a5c">how every turn is framed</text>

  <!-- Column: loaded on demand -->
  <rect x="30" y="242" width="900" height="150" rx="8" fill="#eaf3ea" stroke="#1c6a3a" stroke-width="2"/>
  <text x="480" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#124a24">Loaded on demand, into the SAME context</text>

  <rect x="195" y="278" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c6a3a" stroke-width="1.5"/>
  <text x="325" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#124a24">Skill / prompt file body</text>
  <text x="325" y="318" text-anchor="middle" font-size="10" fill="#124a24">the full SKILL.md or</text>
  <text x="325" y="333" text-anchor="middle" font-size="10" fill="#124a24">.prompt.md loads only once</text>
  <text x="325" y="349" text-anchor="middle" font-size="10" fill="#124a24">its description/name matches</text>

  <rect x="505" y="278" width="260" height="96" rx="6" fill="#ffffff" stroke="#1c6a3a" stroke-width="1.5"/>
  <text x="635" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#124a24">MCP tools</text>
  <text x="635" y="318" text-anchor="middle" font-size="10" fill="#124a24">an external server's tools,</text>
  <text x="635" y="333" text-anchor="middle" font-size="10" fill="#124a24">resources and prompts join</text>
  <text x="635" y="349" text-anchor="middle" font-size="10" fill="#124a24">the tool list once connected</text>

  <!-- Column: isolated / outside context -->
  <rect x="30" y="408" width="900" height="150" rx="8" fill="#fbeaea" stroke="#8a1c1c" stroke-width="2"/>
  <text x="480" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c1414">Isolated from, or outside, the main context</text>

  <rect x="36" y="444" width="168" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="120" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Subagents</text>
  <text x="120" y="484" text-anchor="middle" font-size="10" fill="#5c1414">own fresh context window;</text>
  <text x="120" y="499" text-anchor="middle" font-size="10" fill="#5c1414">returns only a summary</text>
  <text x="120" y="515" text-anchor="middle" font-size="10" fill="#5c1414">to the caller</text>

  <rect x="216" y="444" width="168" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="300" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Hooks</text>
  <text x="300" y="484" text-anchor="middle" font-size="10" fill="#5c1414">a shell command runs</text>
  <text x="300" y="499" text-anchor="middle" font-size="10" fill="#5c1414">outside the model;</text>
  <text x="300" y="515" text-anchor="middle" font-size="10" fill="#5c1414">deterministic, not asked</text>

  <rect x="396" y="444" width="168" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Plugins</text>
  <text x="480" y="484" text-anchor="middle" font-size="10" fill="#5c1414">a packaging boundary:</text>
  <text x="480" y="499" text-anchor="middle" font-size="10" fill="#5c1414">bundles skills, agents,</text>
  <text x="480" y="515" text-anchor="middle" font-size="10" fill="#5c1414">hooks and MCP servers</text>

  <rect x="576" y="444" width="168" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="660" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Permissions &amp; settings</text>
  <text x="660" y="484" text-anchor="middle" font-size="10" fill="#5c1414">settings.json hierarchy;</text>
  <text x="660" y="499" text-anchor="middle" font-size="10" fill="#5c1414">allow / ask / deny rules</text>
  <text x="660" y="515" text-anchor="middle" font-size="10" fill="#5c1414">enforced by the harness</text>

  <rect x="756" y="444" width="168" height="96" rx="6" fill="#ffffff" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="840" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Status line</text>
  <text x="840" y="484" text-anchor="middle" font-size="10" fill="#5c1414">a script prints a bar</text>
  <text x="840" y="499" text-anchor="middle" font-size="10" fill="#5c1414">in the CLI; never enters</text>
  <text x="840" y="515" text-anchor="middle" font-size="10" fill="#5c1414">the model's context</text>

  <text x="480" y="592" text-anchor="middle" font-size="11" fill="#444444">Whatever surface triggers it, every tool call is checked against the permission rules before it runs.</text>
</svg>
