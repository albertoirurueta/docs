<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Escalation ladder for choosing a framework</title>
<desc id="d">Four steps from simple to flexible. Step 1 scikit-learn pipelines and linear models. Step 2 gradient boosting libraries for tabular data. Step 3 Keras 3 or PyTorch for neural networks. Step 4 JAX or custom PyTorch for research and large scale. Each step is entered only when the previous step fails a measured requirement.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Start simple, escalate on evidence</text>
<rect x="20" y="190" width="150" height="100" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="95" y="216" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1. scikit-learn</text>
<text x="95" y="238" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pipelines, linear</text>
<text x="95" y="256" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">models, forests</text>
<text x="95" y="276" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">baseline always</text>
<rect x="195" y="150" width="150" height="140" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="270" y="176" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2. Boosting</text>
<text x="270" y="198" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">HistGradientBoosting,</text>
<text x="270" y="216" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">XGBoost, LightGBM,</text>
<text x="270" y="234" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CatBoost</text>
<text x="270" y="262" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">tabular default</text>
<rect x="370" y="110" width="150" height="180" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445" y="136" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3. Keras 3 / PyTorch</text>
<text x="445" y="160" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">images, text, audio,</text>
<text x="445" y="178" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">sequences, pretrained</text>
<text x="445" y="196" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">models, GPUs</text>
<text x="445" y="224" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Lightning, Hugging Face</text>
<text x="445" y="242" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ecosystems</text>
<rect x="545" y="70" width="155" height="220" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="622" y="96" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4. JAX / custom</text>
<text x="622" y="120" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">function transforms:</text>
<text x="622" y="138" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">grad jit vmap</text>
<text x="622" y="162" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">research, TPUs,</text>
<text x="622" y="180" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">large-scale training</text>
<text x="622" y="208" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Flax, Optax</text>
<line x1="172" y1="240" x2="193" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="347" y1="220" x2="368" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="522" y1="180" x2="543" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="60" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">More flexibility and more code to own, from left to right.</text>
</svg>
