<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the Bookshelf reading streak widget</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: prompt box -->
  <rect x="26" y="100" width="112" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="34" y="150" width="96" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="34" y="204" width="44" height="22" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="56" y="219" font-size="11" fill="#4F46E5" text-anchor="middle">Code</text>
  <rect x="84" y="204" width="46" height="22" rx="6" fill="#4F46E5"/><text x="107" y="219" font-size="11" fill="#FFFFFF" text-anchor="middle">Send</text>
  <text x="82" y="125" font-size="11" fill="#374151" text-anchor="middle">Canva AI prompt</text>
  <!-- panel 2: generated widget -->
  <rect x="178" y="100" width="112" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="190" y="118" width="88" height="70" rx="6" fill="#FFFFFF" stroke="#4F46E5"/>
  <text x="234" y="148" font-size="18" font-weight="bold" fill="#B45309" text-anchor="middle">7</text><text x="234" y="166" font-size="11" fill="#374151" text-anchor="middle">day streak</text>
  <rect x="198" y="200" width="72" height="24" rx="12" fill="#4F46E5"/><text x="234" y="216" font-size="11" fill="#FFFFFF" text-anchor="middle">Log today</text>
  <!-- panel 3: refine -->
  <rect x="330" y="100" width="112" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="340" y="112" width="92" height="40" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="386" y="136" font-size="11" fill="#374151" text-anchor="middle">Version 1</text>
  <rect x="340" y="160" width="92" height="40" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="386" y="184" font-size="11" fill="#92400E" text-anchor="middle">Version 2</text>
  <text x="386" y="224" font-size="11" fill="#374151" text-anchor="middle">Show code toggle</text>
  <!-- panel 4: use in design -->
  <rect x="482" y="100" width="112" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="494" y="116" width="88" height="56" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="502" y="126" width="72" height="36" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="494" y="190" width="88" height="26" rx="6" fill="#4F46E5"/><text x="538" y="207" font-size="11" fill="#FFFFFF" text-anchor="middle">Use in a design</text>
  <!-- panel 5: publish -->
  <rect x="634" y="100" width="100" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="644" y="116" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/><text x="684" y="131" font-size="10" fill="#374151" text-anchor="middle">site address</text>
  <rect x="644" y="148" width="80" height="26" rx="6" fill="#B45309"/><text x="684" y="165" font-size="11" fill="#FFFFFF" text-anchor="middle">Publish</text>
  <rect x="654" y="190" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#B45309"/><text x="674" y="203" font-size="10" fill="#92400E" text-anchor="middle">Live</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Describe the</text><text x="82" y="338">widget</text><text x="234" y="322">Review the</text><text x="234" y="338">generated result</text><text x="386" y="322">Refine by prompt,</text><text x="386" y="338">compare versions</text><text x="538" y="322">Add to the launch</text><text x="538" y="338">design or site</text><text x="684" y="322">Publish</text><text x="684" y="338">and share</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
