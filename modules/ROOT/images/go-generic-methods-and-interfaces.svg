<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Generic methods and interfaces (Go 1.27)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a concrete method may have its own type parameters, but it cannot satisfy an interface method, and interface methods cannot have any</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <line x1="470" y1="64" x2="470" y2="380" stroke="#dddddd"/>
  <text x="235" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Concrete type with a generic method</text>
  <text x="705" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Interface</text>
  <!-- left -->
  <rect x="50" y="100" width="370" height="88" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="62" y="122" font-size="13" font-weight="bold" fill="#222222">type List[E any]</text>
  <text x="62" y="146" font-size="12" font-family="Courier New, monospace" fill="#222222">func (List[E]) Map[R any](f func(E) R) List[R]</text>
  <text x="62" y="170" font-size="12" fill="#444444">E belongs to the type, R belongs to the method</text>
  <rect x="50" y="222" width="170" height="44" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="62" y="241" font-size="13" font-family="Courier New, monospace" fill="#222222">l.Map(f)</text>
  <text x="62" y="258" font-size="12" fill="#444444">R inferred from f</text>
  <rect x="250" y="222" width="170" height="44" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="262" y="241" font-size="13" font-family="Courier New, monospace" fill="#222222">l.Map[string](f)</text>
  <text x="262" y="258" font-size="12" fill="#444444">explicit</text>
  <line x1="135" y1="188" x2="135" y2="218" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="335" y1="188" x2="335" y2="218" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="50" y="296" width="370" height="64" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="62" y="316" font-size="13" font-family="Courier New, monospace" fill="#222222">f := List[int].Map[string]</text>
  <text x="62" y="338" font-size="12" fill="#444444">method expression: an ordinary function value,</text>
  <text x="62" y="352" font-size="12" fill="#444444">of type func(List[int], func(int) string) List[string]</text>
  <!-- right -->
  <rect x="520" y="100" width="370" height="88" fill="#fdecea" stroke="#c62828"/>
  <text x="532" y="122" font-size="13" font-weight="bold" fill="#222222">type Mapper interface</text>
  <text x="532" y="146" font-size="13" font-family="Courier New, monospace" fill="#222222">Map[R any](...)  // does not compile</text>
  <text x="532" y="170" font-size="12" fill="#c62828">interface method must have no type parameters</text>
  <rect x="520" y="222" width="370" height="44" fill="#f4f4f4" stroke="#bbbbbb"/>
  <text x="532" y="241" font-size="13" font-family="Courier New, monospace" fill="#222222">type Conv interface { Convert() int }</text>
  <text x="532" y="258" font-size="12" fill="#444444">ordinary method, no type parameters</text>
  <line x1="700" y1="266" x2="700" y2="290" stroke="#c62828" stroke-width="1.6" marker-end="url(#r)"/>
  <rect x="520" y="296" width="370" height="64" fill="#fdecea" stroke="#c62828"/>
  <text x="532" y="316" font-size="13" font-family="Courier New, monospace" fill="#222222">Box[int] does not implement Conv</text>
  <text x="532" y="338" font-size="12" fill="#444444">(wrong type for method Convert):</text>
  <text x="532" y="352" font-size="12" fill="#444444">wrap it in a non-generic method that fixes the type arguments</text>
</svg>
