<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which common types are Send and Sync</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">Send: ownership may move to another thread.  Sync: &amp;T may be shared between threads (T is Sync if &amp;T is Send)</text>
  <g font-size="13" font-weight="bold" fill="#222222">
    <text x="60" y="84">Type (assume T: Send + Sync)</text>
    <text x="470" y="84" text-anchor="middle">Send</text>
    <text x="570" y="84" text-anchor="middle">Sync</text>
    <text x="640" y="84">Why</text>
  </g>
  <line x1="40" y1="94" x2="870" y2="94" stroke="#999999"/>
  <g font-size="12" fill="#222222">
    <text x="60" y="118">i32, String, Vec&lt;T&gt;, Box&lt;T&gt;</text>
    <text x="60" y="148">&amp;T, &amp;mut T</text>
    <text x="60" y="178">Arc&lt;T&gt;</text>
    <text x="60" y="208">Mutex&lt;T&gt;, RwLock&lt;T&gt;, AtomicU64</text>
    <text x="60" y="238">MutexGuard&lt;'_, T&gt;</text>
    <text x="60" y="268">Cell&lt;T&gt;, RefCell&lt;T&gt;</text>
    <text x="60" y="298">Rc&lt;T&gt;, rc::Weak&lt;T&gt;</text>
    <text x="60" y="328">*const T, *mut T, NonNull&lt;T&gt;</text>
    <text x="60" y="358">mpsc::Sender&lt;T&gt; / Receiver&lt;T&gt;</text>
    <text x="60" y="388">std::thread::JoinHandle&lt;T&gt;</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <!-- row y centres: 114 144 174 204 234 264 294 324 354 384 -->
    <g fill="#2e7d32">
      <text x="470" y="119">yes</text><text x="570" y="119">yes</text>
      <text x="470" y="149">yes</text><text x="570" y="149">yes</text>
      <text x="470" y="179">yes</text><text x="570" y="179">yes</text>
      <text x="470" y="209">yes</text><text x="570" y="209">yes</text>
      <text x="570" y="239">yes</text>
      <text x="470" y="269">yes</text>
      <text x="470" y="359">yes</text><text x="550" y="359">yes</text>
      <text x="470" y="389">yes</text><text x="570" y="389">yes</text>
    </g>
    <g fill="#c62828">
      <text x="470" y="239">no</text>
      <text x="570" y="269">no</text>
      <text x="470" y="299">no</text><text x="570" y="299">no</text>
      <text x="470" y="329">no</text><text x="570" y="329">no</text>
      <text x="590" y="359">/ no</text>
    </g>
  </g>
  <g font-size="11" fill="#444444">
    <text x="640" y="118">own their data; no shared mutation</text>
    <text x="640" y="148">follow T (&amp;T Send needs T: Sync)</text>
    <text x="640" y="178">atomic reference count</text>
    <text x="640" y="208">synchronise every access</text>
    <text x="640" y="238">must unlock on the locking thread</text>
    <text x="640" y="268">unsynchronised interior mutation</text>
    <text x="640" y="298">non-atomic reference count</text>
    <text x="640" y="328">no guarantees; wrappers opt in</text>
    <text x="640" y="358">Sender is Sync (1.72); Receiver is not</text>
    <text x="640" y="388">join from any thread</text>
  </g>
  <g stroke="#eeeeee">
    <line x1="40" y1="128" x2="870" y2="128"/><line x1="40" y1="158" x2="870" y2="158"/><line x1="40" y1="188" x2="870" y2="188"/>
    <line x1="40" y1="218" x2="870" y2="218"/><line x1="40" y1="248" x2="870" y2="248"/><line x1="40" y1="278" x2="870" y2="278"/>
    <line x1="40" y1="308" x2="870" y2="308"/><line x1="40" y1="338" x2="870" y2="338"/><line x1="40" y1="368" x2="870" y2="368"/>
  </g>
  <text x="450" y="430" font-size="12" fill="#666666" text-anchor="middle">Send and Sync are auto traits: a struct is Send/Sync when all of its fields are; a non-Send field makes the whole type non-Send</text>
  <text x="450" y="450" font-size="12" fill="#666666" text-anchor="middle">thread::spawn and tokio::spawn require Send + 'static; sharing through Arc&lt;T&gt; requires T: Send + Sync</text>
</svg>
