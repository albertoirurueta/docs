<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The layers of the SAP Cloud Application Programming Model: models, services, generic providers, protocol adapters and databases</title>
  <desc id="d">Models written in CDS describe the domain and the services. Services expose entities and run generic providers and handlers; custom handlers add business logic. Protocol adapters publish services: the Node.js runtime provides OData V4 and REST, GraphQL needs a plugin, and the Java runtime documents OData V4 and V2. Queries written in CQL are turned into CQN and run against SQLite in development, SAP HANA in production or PostgreSQL. The Node.js and the Java runtime implement the same layers side by side.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="1000" height="70" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="50" text-anchor="middle" font-size="15" font-weight="bold">Models: CDS files (db/ and srv/)</text>
  <text x="520" y="70" text-anchor="middle" font-size="13">entities, services, annotations; compiled to CSN, a JSON form the runtimes read</text>
  <line x1="520" y1="90" x2="520" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="120" width="1000" height="100" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="155" text-anchor="middle" font-size="15" font-weight="bold">Services: stateless facades, every request is an event</text>
  <text x="520" y="175" text-anchor="middle" font-size="13">Generic providers handle reads, writes, drafts and validation without code.</text>
  <text x="520" y="195" text-anchor="middle" font-size="13">Custom handlers (before, on, after) add your business logic.</text>
  <line x1="520" y1="220" x2="520" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="250" width="1000" height="70" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="280" text-anchor="middle" font-size="15" font-weight="bold">Protocol adapters: OData V4 and REST, GraphQL with a plugin</text>
  <text x="520" y="300" text-anchor="middle" font-size="13">Node.js: the same service in several protocols. Java: OData V4 and V2.</text>
  <line x1="520" y1="320" x2="520" y2="350" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="350" width="1000" height="70" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="380" text-anchor="middle" font-size="15" font-weight="bold">Queries: CQL in your code becomes CQN, pushed down to the database</text>
  <text x="520" y="400" text-anchor="middle" font-size="13">no hand-written SQL for ordinary reads and writes</text>
  <line x1="520" y1="420" x2="520" y2="450" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="450" width="320" height="80" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="180" y="485" text-anchor="middle" font-size="14" font-weight="bold">SQLite</text>
  <text x="180" y="504" text-anchor="middle" font-size="12">development and tests</text>
  <rect x="360" y="450" width="320" height="80" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="485" text-anchor="middle" font-size="14" font-weight="bold">SAP HANA Cloud</text>
  <text x="520" y="504" text-anchor="middle" font-size="12">production</text>
  <rect x="700" y="450" width="320" height="80" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="860" y="485" text-anchor="middle" font-size="14" font-weight="bold">PostgreSQL</text>
  <text x="860" y="504" text-anchor="middle" font-size="12">a supported alternative</text>
</svg>
