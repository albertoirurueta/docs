<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Where Keras preprocessing layers run</title>
<desc id="d">Two pipelines compared. Option 1 puts preprocessing layers inside the model so they run on the accelerator with the network and are exported with it. Option 2 maps preprocessing layers over a tf.data pipeline so they run asynchronously on the CPU and prefetch overlaps them with training; an inference model can chain the layers and the trained model for export.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Where do preprocessing layers run?</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Option 1: inside the model</text>
<rect x="30" y="80" width="110" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="85" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">raw batch</text>
<rect x="190" y="80" width="200" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="290" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">Rescaling, Random*</text>
<rect x="440" y="80" width="150" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="515" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">Conv / Dense</text>
<line x1="140" y1="103" x2="188" y2="103" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="390" y1="103" x2="438" y2="103" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="190" y="72" width="400" height="62" rx="8" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="390" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">same device as the network, exported with model.save</text>
<text x="30" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Option 2: in the tf.data pipeline</text>
<rect x="30" y="208" width="110" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="85" y="236" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">Dataset</text>
<rect x="190" y="208" width="200" height="46" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="290" y="236" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">map(layer) + prefetch</text>
<rect x="440" y="208" width="150" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="515" y="236" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">Conv / Dense</text>
<line x1="140" y1="231" x2="188" y2="231" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="390" y1="231" x2="438" y2="231" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="290" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">asynchronous on the CPU, overlapped with training</text>
<path d="M290,256 L290,262" stroke="#475569" stroke-width="1.5"/>
<text x="360" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">For inference with option 2, build a model that chains the same layers and the trained network.</text>
</svg>
