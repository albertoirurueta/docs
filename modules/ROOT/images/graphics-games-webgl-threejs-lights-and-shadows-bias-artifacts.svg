<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-lights-and-shadows-bias-artifacts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="370" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Shadow acne and peter panning come from bias</text>
<rect x="20" y="50" width="230" height="290" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">bias too small</text>
<line x1="40" y1="230" x2="230" y2="230" stroke="#1F2937" stroke-width="2"/>
<text x="135" y="255" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Stripes on lit surfaces</text>
<text x="135" y="271" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth quantisation makes a</text>
<text x="135" y="287" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">surface shadow itself</text>
<line x1="50" y1="215" x2="58" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="68" y1="215" x2="76" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="86" y1="215" x2="94" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="104" y1="215" x2="112" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="122" y1="215" x2="130" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="140" y1="215" x2="148" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="158" y1="215" x2="166" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="176" y1="215" x2="184" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="194" y1="215" x2="202" y2="226" stroke="#B45309" stroke-width="3"/>
<line x1="212" y1="215" x2="220" y2="226" stroke="#B45309" stroke-width="3"/>
<rect x="265" y="50" width="230" height="290" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">bias about right</text>
<line x1="285" y1="230" x2="475" y2="230" stroke="#1F2937" stroke-width="2"/>
<text x="380" y="255" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Contact shadow is tight</text>
<text x="380" y="271" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">keep bias near zero and</text>
<text x="380" y="287" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">raise normalBias first</text>
<rect x="355" y="180" width="50" height="50" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<polygon points="405,225 455,225 455,232 405,232" fill="#6B7280" opacity="0.8"/>
<rect x="510" y="50" width="230" height="290" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">bias too large</text>
<line x1="530" y1="230" x2="720" y2="230" stroke="#1F2937" stroke-width="2"/>
<text x="625" y="255" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Shadow detaches from the</text>
<text x="625" y="271" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">object, which seems to</text>
<text x="625" y="287" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">float (peter panning)</text>
<rect x="570" y="180" width="50" height="50" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<polygon points="640,225 690,225 690,232 640,232" fill="#6B7280" opacity="0.8"/>
<line x1="620" y1="228" x2="640" y2="228" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="380" y="360" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tune mapSize and the shadow camera bounds first, then bias, then normalBias.</text>
</svg>
