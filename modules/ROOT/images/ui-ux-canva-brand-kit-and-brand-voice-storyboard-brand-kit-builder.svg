<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Seed a Brand Kit from a website or a PDF</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="170" height="250" rx="10"/><rect x="198" y="50" width="170" height="250" rx="10"/><rect x="384" y="50" width="170" height="250" rx="10"/><rect x="570" y="50" width="178" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M183,175 L197,175" marker-end="url(#ah)"/><path d="M369,175 L383,175" marker-end="url(#ah)"/><path d="M555,175 L569,175" marker-end="url(#ah)"/></g>
  <!-- panel 1 -->
  <rect x="24" y="90" width="146" height="40" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="34" y="115" font-size="11" fill="#92400E">Brand Kit Builder banner</text>
  <rect x="24" y="146" width="146" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="34" y="163" font-size="11" fill="#374151">Enter your website URL</text>
  <rect x="24" y="180" width="146" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="34" y="197" font-size="11" fill="#374151">Upload a PDF guide</text>
  <!-- panel 2 -->
  <rect x="210" y="100" width="146" height="28" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="218" y="118" font-size="11" fill="#1F2937">bookshelf.example</text>
  <rect x="330" y="104" width="20" height="20" rx="10" fill="#4F46E5"/><path d="M335,114 L345,114" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="210" y="150" width="146" height="10" rx="5" fill="#E5E7EB"/><rect x="210" y="150" width="90" height="10" rx="5" fill="#4F46E5"/>
  <text x="283" y="184" font-size="11" fill="#374151" text-anchor="middle">Analysing the source</text>
  <!-- panel 3 -->
  <text x="396" y="102" font-size="11" font-weight="bold" fill="#1F2937">Review what was found</text>
  <g stroke="#9CA3AF" fill="#EEF2FF"><rect x="396" y="112" width="68" height="30" rx="4"/><rect x="470" y="112" width="72" height="30" rx="4"/><rect x="396" y="150" width="68" height="30" rx="4"/><rect x="470" y="150" width="72" height="30" rx="4"/><rect x="396" y="188" width="146" height="30" rx="4"/></g>
  <g font-size="10" fill="#374151" text-anchor="middle"><text x="430" y="131">Logos</text><text x="506" y="131">Colors</text><text x="430" y="169">Fonts</text><text x="506" y="169">Voice</text><text x="469" y="207">Guidelines</text></g>
  <!-- panel 4 -->
  <rect x="582" y="92" width="154" height="26" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="592" y="109" font-size="11" fill="#92400E">Fix wrong font</text>
  <rect x="582" y="126" width="154" height="26" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="592" y="143" font-size="11" fill="#92400E">Remove stray colour</text>
  <rect x="582" y="160" width="154" height="26" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="592" y="177" font-size="11" fill="#92400E">Tighten the voice text</text>
  <rect x="610" y="206" width="98" height="26" rx="6" fill="#4F46E5"/><text x="659" y="223" font-size="12" fill="#FFFFFF" text-anchor="middle">Keep the kit</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="216" cy="68" r="11"/><circle cx="402" cy="68" r="11"/></g><circle cx="588" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="216" y="72">2</text><text x="402" y="72">3</text><text x="588" y="72">4</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="97" y="322">Open an empty or</text><text x="97" y="338">incomplete kit</text><text x="283" y="322">Give a public URL</text><text x="283" y="338">or a PDF</text><text x="469" y="322">Check each extracted</text><text x="469" y="338">element</text><text x="659" y="322">Correct, add what</text><text x="659" y="338">is missing, save</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
