<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: the Nest monorepo layout</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">two applications, two libraries, one set of root configuration files</text>

  <!-- Root config bar -->
  <rect x="30" y="62" width="700" height="50" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="380" y="82" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Workspace root</text>
  <text x="380" y="100" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">nest-cli.json (projects) | tsconfig.json (paths, @app/*) | package.json | vitest.config.ts</text>

  <!-- apps column -->
  <text x="190" y="144" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">apps/ (runnable, have main.ts)</text>

  <rect x="30" y="156" width="320" height="170" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="190" y="178" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">apps/bookshelf-api</text>
  <text x="190" y="194" font-size="11" fill="#666666" text-anchor="middle">default project: REST, GraphQL, SSE, WebSockets</text>
  <rect x="46" y="206" width="288" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="190" y="223" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/main.ts, src/app.module.ts</text>
  <rect x="46" y="238" width="288" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="190" y="256" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/books/  src/authors/  src/reviews/</text>
  <text x="190" y="274" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/users/  src/uploads/  src/chat/</text>
  <rect x="46" y="296" width="288" height="22" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="190" y="311" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">test/*.e2e-spec.ts, tsconfig.app.json</text>

  <rect x="30" y="346" width="320" height="110" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="190" y="368" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">apps/notifications</text>
  <text x="190" y="384" font-size="11" fill="#666666" text-anchor="middle">microservice: sends e-mail and push messages</text>
  <rect x="46" y="396" width="288" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="190" y="413" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/main.ts, src/notifications.module.ts</text>
  <rect x="46" y="428" width="288" height="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="190" y="442" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">tsconfig.app.json</text>

  <!-- libs column -->
  <text x="570" y="144" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">libs/ (shared, no main.ts)</text>

  <rect x="450" y="156" width="280" height="130" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="590" y="178" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">libs/common</text>
  <text x="590" y="194" font-size="11" fill="#666666" text-anchor="middle">alias @app/common</text>
  <rect x="466" y="206" width="248" height="68" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="590" y="224" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/index.ts (public API)</text>
  <text x="590" y="242" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">config, pagination, filters,</text>
  <text x="590" y="258" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">decorators, tsconfig.lib.json</text>

  <rect x="450" y="316" width="280" height="130" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="590" y="338" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">libs/database</text>
  <text x="590" y="354" font-size="11" fill="#666666" text-anchor="middle">alias @app/database</text>
  <rect x="466" y="366" width="248" height="68" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="590" y="384" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">src/index.ts (public API)</text>
  <text x="590" y="402" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">DatabaseModule, entities,</text>
  <text x="590" y="418" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">migrations, tsconfig.lib.json</text>

  <!-- arrows apps -> libs -->
  <line x1="350" y1="215" x2="448" y2="215" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="399" y="208" font-size="10" fill="#444444" text-anchor="middle">imports</text>
  <line x1="350" y1="300" x2="448" y2="372" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="365" x2="448" y2="255" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="380" y="482" font-size="11" fill="#666666" text-anchor="middle">arrows: import through the @app/* alias; the two applications talk to each other over the network, never by importing</text>
</svg>
