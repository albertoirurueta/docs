<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-whats-new-in-metal-4-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From Metal 3 to Metal 4 and MSL 4.1</text>
<line x1="50" y1="160" x2="710" y2="160" stroke="#4B5563" stroke-width="2"/>
<circle cx="90" cy="160" r="7" fill="#4B5563"/>
<rect x="24" y="70" width="132" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="90.0" y="94.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Metal 3</text>
<text x="90.0" y="109.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">2022</text>
<text x="90" y="64" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">MSL 3.0, MetalFX, mesh shaders</text>
<line x1="90" y1="126" x2="90" y2="153" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="230" cy="160" r="7" fill="#4B5563"/>
<rect x="164" y="186" width="132" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="230.0" y="210.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Residency sets</text>
<text x="230.0" y="225.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">2024</text>
<text x="230" y="258" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">iOS 18 and macOS 15</text>
<line x1="230" y1="186" x2="230" y2="167" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="370" cy="160" r="7" fill="#4F46E5"/>
<rect x="304" y="70" width="132" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="370.0" y="94.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Metal 4</text>
<text x="370.0" y="109.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">2025</text>
<text x="370" y="64" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">26 OSes, MSL 4.0</text>
<line x1="370" y1="126" x2="370" y2="153" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="510" cy="160" r="7" fill="#B45309"/>
<rect x="444" y="186" width="132" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="510.0" y="210.7" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">WWDC26</text>
<text x="510.0" y="225.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">2026-06</text>
<text x="510" y="258" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">tensor quantisation, GPTK 4</text>
<line x1="510" y1="186" x2="510" y2="167" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="650" cy="160" r="7" fill="#4F46E5"/>
<rect x="584" y="70" width="132" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="94.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">27 OSes</text>
<text x="650.0" y="109.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">2026</text>
<text x="650" y="64" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">MSL 4.1, Xcode 27</text>
<line x1="650" y1="126" x2="650" y2="153" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal 4 types are available from the 26 OSes and run next to the Metal 3 types.</text>
<text x="380" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MSL 4.1 (language version 4_1) needs the 27 OSes; MSL 4.0 is available from the 26 OSes.</text>
</svg>
