<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Coroutines and Awaitable side by side</text>
<rect x="40" y="48" width="320" height="32" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="68.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Coroutine (IEnumerator)</text>
<rect x="400" y="48" width="320" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="68.5" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Awaitable (async Awaitable)</text>
<rect x="40" y="94" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="119.8" text-anchor="middle" font-size="11" fill="#3730A3">StartCoroutine on a MonoBehaviour</text>
<rect x="400" y="94" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="119.8" text-anchor="middle" font-size="11" fill="#1F2937">called like any async method</text>
<rect x="280" y="98" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="109.5" text-anchor="middle" font-size="10" fill="#374151">Started by</text>
<rect x="40" y="146" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="171.8" text-anchor="middle" font-size="11" fill="#3730A3">yield return null / WaitForSeconds</text>
<rect x="400" y="146" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="171.8" text-anchor="middle" font-size="11" fill="#1F2937">await Awaitable.NextFrameAsync()</text>
<rect x="280" y="150" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="161.5" text-anchor="middle" font-size="10" fill="#374151">Suspended with</text>
<rect x="40" y="198" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="223.8" text-anchor="middle" font-size="11" fill="#3730A3">stops when the object is deactivated or destroyed</text>
<rect x="400" y="198" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="223.8" text-anchor="middle" font-size="11" fill="#1F2937">runs on until done: pass destroyCancellationToken</text>
<rect x="280" y="202" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="213.5" text-anchor="middle" font-size="10" fill="#374151">Lifetime</text>
<rect x="40" y="250" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="275.9" text-anchor="middle" font-size="11" fill="#3730A3">none (use a callback)</text>
<rect x="400" y="250" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="275.9" text-anchor="middle" font-size="11" fill="#1F2937">async Awaitable&lt;T&gt; returns a result</text>
<rect x="280" y="254" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="265.5" text-anchor="middle" font-size="10" fill="#374151">Return value</text>
<rect x="40" y="302" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="327.9" text-anchor="middle" font-size="11" fill="#3730A3">main thread only</text>
<rect x="400" y="302" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="327.9" text-anchor="middle" font-size="11" fill="#1F2937">BackgroundThreadAsync / MainThreadAsync switch</text>
<rect x="280" y="306" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="317.5" text-anchor="middle" font-size="10" fill="#374151">Thread</text>
<rect x="40" y="354" width="320" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="200.0" y="379.9" text-anchor="middle" font-size="11" fill="#3730A3">a coroutine can be waited by yielding it</text>
<rect x="400" y="354" width="320" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="379.9" text-anchor="middle" font-size="11" fill="#1F2937">never: instances are pooled</text>
<rect x="280" y="358" width="200" height="16" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="369.5" text-anchor="middle" font-size="10" fill="#374151">Await twice?</text>
<text x="380" y="414" text-anchor="middle" font-size="11" fill="#374151">Both run on the Unity main thread unless you switch explicitly; neither is a thread.</text>
</svg>
