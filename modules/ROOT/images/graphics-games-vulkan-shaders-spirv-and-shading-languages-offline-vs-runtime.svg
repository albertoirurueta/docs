<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ssl-ort" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where each step runs: build time, load time, pipeline time</text>
<rect x="40" y="55" width="200" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140.0" y="77.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Build time (CMake)</text>
<rect x="40" y="100" width="200" height="200" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="166.3" text-anchor="middle" font-size="11" fill="#374151">Compile: glslc, dxc, slangc</text>
<text x="140.0" y="181.3" text-anchor="middle" font-size="11" fill="#374151">Validate: spirv-val</text>
<text x="140.0" y="196.3" text-anchor="middle" font-size="11" fill="#374151">Optimise: spirv-opt (opt.)</text>
<text x="140.0" y="211.3" text-anchor="middle" font-size="11" fill="#374151">Reflect: spirv-reflect or</text>
<text x="140.0" y="226.3" text-anchor="middle" font-size="11" fill="#374151">slangc -reflection-json</text>
<text x="140.0" y="241.3" text-anchor="middle" font-size="11" fill="#374151">Package: .spv next to the exe</text>
<rect x="280" y="55" width="200" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="77.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Load time (C++)</text>
<rect x="280" y="100" width="200" height="200" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="166.3" text-anchor="middle" font-size="11" fill="#374151">Read .spv as 32-bit words</text>
<text x="380.0" y="181.3" text-anchor="middle" font-size="11" fill="#374151">Check size is a multiple of 4</text>
<text x="380.0" y="196.3" text-anchor="middle" font-size="11" fill="#374151">Create a VkShaderModule, or</text>
<text x="380.0" y="211.3" text-anchor="middle" font-size="11" fill="#374151">chain VkShaderModuleCreateInfo</text>
<text x="380.0" y="226.3" text-anchor="middle" font-size="11" fill="#374151">(maintenance5, core 1.4)</text>
<text x="380.0" y="241.3" text-anchor="middle" font-size="11" fill="#374151">Build specialization data</text>
<rect x="520" y="55" width="200" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="77.5" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Pipeline creation</text>
<rect x="520" y="100" width="200" height="200" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="166.3" text-anchor="middle" font-size="11" fill="#374151">Driver translates SPIR-V</text>
<text x="620.0" y="181.3" text-anchor="middle" font-size="11" fill="#374151">Specialization applied</text>
<text x="620.0" y="196.3" text-anchor="middle" font-size="11" fill="#374151">Pipeline cache consulted</text>
<text x="620.0" y="211.3" text-anchor="middle" font-size="11" fill="#374151">Problems appear as</text>
<text x="620.0" y="226.3" text-anchor="middle" font-size="11" fill="#374151">creation errors or</text>
<text x="620.0" y="241.3" text-anchor="middle" font-size="11" fill="#374151">validation messages</text>
<line x1="240" y1="195" x2="280" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-ort)"/>
<line x1="480" y1="195" x2="520" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-ort)"/>
<text x="380" y="335" text-anchor="middle" font-size="11" fill="#374151">Runtime compilation (shaderc, slang API) is possible, but shipping SPIR-V keeps start-up fast</text>
<text x="380" y="353" text-anchor="middle" font-size="11" fill="#374151">and avoids a compiler dependency in the game.</text>
</svg>
