<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The SAP landscape: the S/4HANA core, its lines of business and the cloud products around it</title>
  <desc id="d">SAP S/4HANA is the core ERP system in the centre. Its lines of business are finance, sourcing and procurement, sales, manufacturing, supply chain and asset management. Around it sit separate cloud products: SAP SuccessFactors for human resources, SAP Ariba for procurement networks, SAP Concur for travel and expense, and SAP Business Technology Platform for integration and extensions.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="260" y="60" width="520" height="330" rx="14" fill="#7873f5" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" font-size="16" font-weight="bold">SAP S/4HANA, the core ERP system</text>
  <text x="520" y="112" text-anchor="middle" font-size="12">lines of business that share one data model</text>
  <rect x="280" y="134" width="152" height="96" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="356" y="186.5" text-anchor="middle" font-size="14" font-weight="bold">Finance</text>
  <rect x="444" y="134" width="152" height="96" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="177" text-anchor="middle" font-size="14" font-weight="bold">Sourcing and</text>
  <text x="520" y="196" text-anchor="middle" font-size="14" font-weight="bold">procurement</text>
  <rect x="608" y="134" width="152" height="96" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="684" y="186.5" text-anchor="middle" font-size="14" font-weight="bold">Sales</text>
  <rect x="280" y="254" width="152" height="96" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="356" y="306.5" text-anchor="middle" font-size="14" font-weight="bold">Manufacturing</text>
  <rect x="444" y="254" width="152" height="96" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="306.5" text-anchor="middle" font-size="14" font-weight="bold">Supply chain</text>
  <rect x="608" y="254" width="152" height="96" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="684" y="306.5" text-anchor="middle" font-size="14" font-weight="bold">Asset management</text>
  <rect x="20" y="60" width="210" height="70" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="90" text-anchor="middle" font-size="14" font-weight="bold">SAP SuccessFactors</text>
  <text x="125" y="109" text-anchor="middle" font-size="12">human resources</text>
  <line x1="230" y1="95" x2="260" y2="95" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="20" y="200" width="210" height="70" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="230" text-anchor="middle" font-size="14" font-weight="bold">SAP Ariba</text>
  <text x="125" y="249" text-anchor="middle" font-size="12">procurement networks</text>
  <line x1="230" y1="235" x2="260" y2="235" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="20" y="330" width="210" height="70" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="360" text-anchor="middle" font-size="14" font-weight="bold">SAP Concur</text>
  <text x="125" y="379" text-anchor="middle" font-size="12">travel and expense</text>
  <line x1="230" y1="365" x2="260" y2="365" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="810" y="60" width="210" height="330" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="915" y="190" text-anchor="middle" font-size="15" font-weight="bold">SAP Business</text>
  <text x="915" y="210" text-anchor="middle" font-size="15" font-weight="bold">Technology Platform</text>
  <text x="915" y="230" text-anchor="middle" font-size="13">integration, extensions,</text>
  <text x="915" y="250" text-anchor="middle" font-size="13">data and analytics</text>
  <text x="915" y="270" text-anchor="middle" font-size="13">services</text>
  <line x1="780" y1="225" x2="810" y2="225" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="260" y="420" width="760" height="70" rx="10" fill="#ff6ec4" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="640" y="450" text-anchor="middle" font-size="14" font-weight="bold">Users reach all of it through SAP Fiori launchpad and SAP GUI</text>
  <text x="640" y="469" text-anchor="middle" font-size="12">Browser and desktop front ends in front of the core and the cloud products.</text>
