<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify admin data model</title>
  <desc id="d">How products, variants, inventory items, inventory levels, locations, collections, customers, segments, discounts, draft orders and orders reference each other in the Shopify admin and the Admin GraphQL API.</desc>
  <rect x="0" y="0" width="760" height="392" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g fill="#f2f5f8" font-size="14">
    <!-- row A: catalogue -->
    <rect x="20" y="40" width="140" height="66" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="90" y="64" text-anchor="middle" font-weight="bold">Collection</text>
    <text x="90" y="84" text-anchor="middle" font-size="12">sources: conditions</text>
    <text x="90" y="99" text-anchor="middle" font-size="12">or hand-picked</text>

    <rect x="210" y="40" width="140" height="66" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="280" y="64" text-anchor="middle" font-weight="bold">Product</text>
    <text x="280" y="84" text-anchor="middle" font-size="12">status, tags, vendor</text>
    <text x="280" y="99" text-anchor="middle" font-size="12">up to 3 options</text>

    <rect x="400" y="40" width="140" height="66" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="470" y="64" text-anchor="middle" font-weight="bold">Variant</text>
    <text x="470" y="84" text-anchor="middle" font-size="12">price, option values</text>
    <text x="470" y="99" text-anchor="middle" font-size="12">up to 2,048 per product</text>

    <rect x="590" y="40" width="150" height="66" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="665" y="64" text-anchor="middle" font-weight="bold">Inventory item</text>
    <text x="665" y="84" text-anchor="middle" font-size="12">SKU, cost, tracked</text>
    <text x="665" y="99" text-anchor="middle" font-size="12">one per variant</text>

    <!-- row B -->
    <rect x="20" y="160" width="140" height="66" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="90" y="184" text-anchor="middle" font-weight="bold">Segment</text>
    <text x="90" y="204" text-anchor="middle" font-size="12">saved customer</text>
    <text x="90" y="219" text-anchor="middle" font-size="12">query</text>

    <rect x="210" y="160" width="140" height="66" rx="10" fill="#b0743a" stroke="#f2f5f8"/>
    <text x="280" y="184" text-anchor="middle" font-weight="bold">Discount</text>
    <text x="280" y="204" text-anchor="middle" font-size="12">code or automatic</text>
    <text x="280" y="219" text-anchor="middle" font-size="12">product, order, shipping</text>

    <rect x="590" y="160" width="150" height="66" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="665" y="184" text-anchor="middle" font-weight="bold">Inventory level</text>
    <text x="665" y="204" text-anchor="middle" font-size="12">available, committed,</text>
    <text x="665" y="219" text-anchor="middle" font-size="12">on hand, incoming</text>

    <!-- row C -->
    <rect x="20" y="285" width="140" height="66" rx="10" fill="#8a5a8f" stroke="#f2f5f8"/>
    <text x="90" y="309" text-anchor="middle" font-weight="bold">Customer</text>
    <text x="90" y="329" text-anchor="middle" font-size="12">tags, consent,</text>
    <text x="90" y="344" text-anchor="middle" font-size="12">addresses</text>

    <rect x="210" y="285" width="140" height="66" rx="10" fill="#b0743a" stroke="#f2f5f8"/>
    <text x="280" y="309" text-anchor="middle" font-weight="bold">Order</text>
    <text x="280" y="329" text-anchor="middle" font-size="12">payment, fulfillment</text>
    <text x="280" y="344" text-anchor="middle" font-size="12">and return statuses</text>

    <rect x="400" y="285" width="140" height="66" rx="10" fill="#b0743a" stroke="#f2f5f8" stroke-dasharray="5 4"/>
    <text x="470" y="309" text-anchor="middle" font-weight="bold">Draft order</text>
    <text x="470" y="329" text-anchor="middle" font-size="12">invoice or manual</text>
    <text x="470" y="344" text-anchor="middle" font-size="12">payment</text>

    <rect x="590" y="285" width="150" height="66" rx="10" fill="#4f7f5b" stroke="#f2f5f8"/>
    <text x="665" y="309" text-anchor="middle" font-weight="bold">Location</text>
    <text x="665" y="329" text-anchor="middle" font-size="12">stock, fulfils online</text>
    <text x="665" y="344" text-anchor="middle" font-size="12">orders or not</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="162" y1="73" x2="206" y2="73"/>
    <line x1="352" y1="73" x2="396" y2="73"/>
    <line x1="542" y1="73" x2="586" y2="73"/>
    <line x1="665" y1="108" x2="665" y2="156"/>
    <line x1="665" y1="283" x2="665" y2="230"/>
    <line x1="208" y1="193" x2="164" y2="193"/>
    <line x1="238" y1="158" x2="156" y2="108"/>
    <line x1="90" y1="283" x2="90" y2="230"/>
    <line x1="208" y1="318" x2="164" y2="318"/>
    <line x1="398" y1="318" x2="354" y2="318"/>
    <line x1="330" y1="283" x2="430" y2="108"/>
  </g>
  <g fill="#f2f5f8" font-size="11">
    <text x="184" y="66" text-anchor="middle">contains</text>
    <text x="374" y="66" text-anchor="middle">has</text>
    <text x="564" y="66" text-anchor="middle">1:1</text>
    <text x="675" y="136">per location</text>
    <text x="675" y="262">stocks</text>
    <text x="186" y="186" text-anchor="middle">for</text>
    <text x="122" y="136" text-anchor="end">applies to</text>
    <text x="100" y="262">built from tags</text>
    <text x="186" y="311" text-anchor="middle">for</text>
    <text x="376" y="311" text-anchor="middle">becomes</text>
    <text x="400" y="204">line items</text>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <text x="20" y="378">An arrow reads as "references". Gift cards are separate records tied to a customer or to a gift card product.</text>
  </g>
</svg>
