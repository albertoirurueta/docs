<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">PrestaShop on one server compared with PrestaShop in tiers</title>
  <desc id="d">Two architectures side by side. On the left, a single server runs Apache or Nginx with PHP, MySQL, the PrestaShop folder with img, upload, download, var/cache and the modules, a local cron entry and the files of the back office, all on one disk. On the right, the tiered design for Pocket Coffee: a CDN and load balancer in front of at least two identical web pods in different availability zones, each with nginx and php-fpm built from one container image. The pods share a managed MySQL database with a standby in another zone, an EFS volume for the img, upload and download folders, an ElastiCache Valkey cluster for PHP sessions, an ElastiCache Memcached cluster for the SQL cache, and Secrets Manager for the keys. A CronJob and a migrate Job use the same image. The var/cache folder and the Smarty cache stay inside each pod.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One server, or tiers: where Pocket Coffee keeps its state</text>
  <line x1="300" y1="52" x2="300" y2="500" stroke="#6f8aa3" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- single server -->
  <text x="30" y="68" font-size="14" font-weight="bold" fill="#f4b860">Single server</text>
  <rect x="30" y="84" width="240" height="46" rx="9" fill="#3d5266"/>
  <text x="150" y="112" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper and staff</text>
  <line x1="150" y1="130" x2="150" y2="156" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="158" width="240" height="330" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="150" y="182" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">One virtual machine</text>
  <rect x="46" y="194" width="208" height="38" rx="8" fill="#3f6e9a"/>
  <text x="150" y="218" font-size="12" fill="#f2f5f8" text-anchor="middle">Apache or Nginx + PHP</text>
  <rect x="46" y="242" width="208" height="38" rx="8" fill="#4d7c5a"/>
  <text x="150" y="266" font-size="12" fill="#f2f5f8" text-anchor="middle">MySQL on the same disk</text>
  <rect x="46" y="290" width="208" height="62" rx="8" fill="#7a5c3a"/>
  <text x="150" y="312" font-size="12" fill="#f2f5f8" text-anchor="middle">img/ upload/ download/</text>
  <text x="150" y="332" font-size="12" fill="#f2f5f8" text-anchor="middle">modules/ themes/ translations/</text>
  <rect x="46" y="362" width="208" height="38" rx="8" fill="#2f4a44"/>
  <text x="150" y="386" font-size="12" fill="#f2f5f8" text-anchor="middle">var/cache, var/sessions, var/logs</text>
  <rect x="46" y="410" width="208" height="38" rx="8" fill="#34495e"/>
  <text x="150" y="434" font-size="12" fill="#f2f5f8" text-anchor="middle">parameters.php + system cron</text>
  <text x="150" y="472" font-size="11.5" fill="#9fd3c7" text-anchor="middle">one disk, one backup, one failure</text>

  <!-- tiered -->
  <text x="330" y="68" font-size="14" font-weight="bold" fill="#f4b860">Tiered on Kubernetes</text>
  <rect x="330" y="84" width="130" height="46" rx="9" fill="#3d5266"/>
  <text x="395" y="112" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper</text>
  <rect x="480" y="84" width="150" height="46" rx="9" fill="#3d5266"/>
  <text x="555" y="105" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">CDN + WAF</text>
  <text x="555" y="121" font-size="11" fill="#f2f5f8" text-anchor="middle">CloudFront</text>
  <rect x="650" y="84" width="140" height="46" rx="9" fill="#3d5266"/>
  <text x="720" y="105" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Load balancer</text>
  <text x="720" y="121" font-size="11" fill="#f2f5f8" text-anchor="middle">TLS, health checks</text>
  <line x1="460" y1="107" x2="478" y2="107" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="107" x2="648" y2="107" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="130" x2="720" y2="158" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="158" width="460" height="150" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="344" y="180" font-size="12.5" font-weight="bold" fill="#f2f5f8">Deployment pocketcoffee-web, one image, three zones</text>
  <rect x="346" y="194" width="130" height="100" rx="8" fill="#3f6e9a"/>
  <text x="411" y="214" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Pod, zone a</text>
  <text x="411" y="234" font-size="11.5" fill="#f2f5f8" text-anchor="middle">nginx + php-fpm</text>
  <text x="411" y="252" font-size="11.5" fill="#9fd3c7" text-anchor="middle">var/cache (own)</text>
  <text x="411" y="270" font-size="11.5" fill="#9fd3c7" text-anchor="middle">code in the image</text>
  <rect x="486" y="194" width="130" height="100" rx="8" fill="#3f6e9a"/>
  <text x="551" y="214" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Pod, zone b</text>
  <text x="551" y="234" font-size="11.5" fill="#f2f5f8" text-anchor="middle">nginx + php-fpm</text>
  <text x="551" y="252" font-size="11.5" fill="#9fd3c7" text-anchor="middle">var/cache (own)</text>
  <text x="551" y="270" font-size="11.5" fill="#9fd3c7" text-anchor="middle">code in the image</text>
  <rect x="626" y="194" width="148" height="100" rx="8" fill="#7a5c3a"/>
  <text x="700" y="214" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Jobs, same image</text>
  <text x="700" y="234" font-size="11.5" fill="#f2f5f8" text-anchor="middle">CronJob pocketcoffee-cron</text>
  <text x="700" y="252" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Job pocketcoffee-install</text>
  <text x="700" y="270" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Job pocketcoffee-migrate</text>

  <line x1="411" y1="308" x2="411" y2="344" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <line x1="551" y1="308" x2="551" y2="344" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <line x1="700" y1="308" x2="700" y2="344" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>

  <rect x="330" y="346" width="136" height="76" rx="9" fill="#4d7c5a"/>
  <text x="398" y="368" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">RDS MySQL 8.4</text>
  <text x="398" y="386" font-size="11" fill="#f2f5f8" text-anchor="middle">primary + standby</text>
  <text x="398" y="402" font-size="11" fill="#f2f5f8" text-anchor="middle">in another zone</text>
  <rect x="476" y="346" width="136" height="76" rx="9" fill="#7a5c3a"/>
  <text x="544" y="368" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">EFS volume</text>
  <text x="544" y="386" font-size="11" fill="#f2f5f8" text-anchor="middle">img/ upload/</text>
  <text x="544" y="402" font-size="11" fill="#f2f5f8" text-anchor="middle">download/ only</text>
  <rect x="622" y="346" width="160" height="76" rx="9" fill="#5a4a7a"/>
  <text x="702" y="368" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ElastiCache</text>
  <text x="702" y="386" font-size="11" fill="#f2f5f8" text-anchor="middle">Valkey: PHP sessions</text>
  <text x="702" y="402" font-size="11" fill="#f2f5f8" text-anchor="middle">Memcached: SQL cache</text>
  <rect x="800" y="346" width="130" height="76" rx="9" fill="#2f4a44"/>
  <text x="865" y="368" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Secrets Manager</text>
  <text x="865" y="386" font-size="11" fill="#f2f5f8" text-anchor="middle">DB passwords</text>
  <text x="865" y="402" font-size="11" fill="#f2f5f8" text-anchor="middle">cookie_key, secret</text>
  <line x1="865" y1="346" x2="780" y2="300" stroke="#f2f5f8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="330" y="452" font-size="12" fill="#f2f5f8">Pods are disposable. Anything that must survive a pod lives in the bottom row.</text>
  <text x="330" y="472" font-size="12" fill="#9fd3c7">Nothing in the pods is shared: each keeps its own var/cache and Smarty cache.</text>
  <text x="330" y="492" font-size="12" fill="#f4b860">Admin folder admin-pocketcoffee is reachable only through a restricted route.</text>
</svg>
