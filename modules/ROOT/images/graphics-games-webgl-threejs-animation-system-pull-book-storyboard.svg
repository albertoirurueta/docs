<text x="380" y="270" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">mixer.update( delta ) advances the action every frame; the clip slides the book node towards the viewer (drawn as a raised offset).</text>
<text x="380" y="292" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">A second click calls timeScale = -1 on the same action to slide the book back.</text>
<text x="380" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Bookshelf step 7: the same book picked by Raycaster, animated by AnimationMixer.</text>
