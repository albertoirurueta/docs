<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 530" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What happens between set_name() and the database row</title>
  <desc id="d">Seven steps of a CRUD save. Setters write to the changes array when the object was read. save() fires the before-save action and calls the data store: update() when the object has an ID, create() otherwise. The data store reads the values with the edit context and writes rows to the posts and postmeta tables, the order tables or a custom table. Afterwards apply_changes() merges the changes into the data, the meta data is saved, the after-save action fires and the ID is returned. A band explains the view context, which applies filters, and the edit context, which does not.</desc>
  <rect x="0" y="0" width="930" height="530" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">Life of a CRUD save: from set_*() to a database row</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Data::save() as implemented in WooCommerce 11.2.1; the object type names the hooks</text>
  <rect x="40" y="70" width="190" height="140" rx="8" fill="#3d5266"/>
  <text x="54" y="92" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">1. Set props</text>
  <text x="54" y="114" font-size="12.5" text-anchor="start" fill="#f2f5f8">$p-&gt;set_name( ... )</text>
  <text x="54" y="133" font-size="12.5" text-anchor="start" fill="#f2f5f8">$p-&gt;set_regular_price( ... )</text>
  <text x="54" y="152" font-size="12.5" text-anchor="start" fill="#f2f5f8">$p-&gt;update_meta_data( ... )</text>
  <text x="54" y="171" font-size="12.5" text-anchor="start" fill="#f2f5f8">nothing is written yet</text>
  <rect x="260" y="70" width="190" height="140" rx="8" fill="#3d5266"/>
  <text x="274" y="92" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">2. Changes tracked</text>
  <text x="274" y="114" font-size="12.5" text-anchor="start" fill="#f2f5f8">set_prop() stores the value</text>
  <text x="274" y="133" font-size="12.5" text-anchor="start" fill="#f2f5f8">in $changes, not in $data</text>
  <text x="274" y="152" font-size="12.5" text-anchor="start" fill="#f2f5f8">same value: no change</text>
  <text x="274" y="171" font-size="12.5" text-anchor="start" fill="#f2f5f8">get_changes() lists them</text>
  <rect x="480" y="70" width="190" height="140" rx="8" fill="#4d7c5a"/>
  <text x="494" y="92" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">3. save()</text>
  <text x="494" y="114" font-size="12.5" text-anchor="start" fill="#f2f5f8">woocommerce_before_{type}_</text>
  <text x="494" y="133" font-size="12.5" text-anchor="start" fill="#f2f5f8">object_save fires</text>
  <text x="494" y="152" font-size="12.5" text-anchor="start" fill="#f2f5f8">ID set: update()</text>
  <text x="494" y="171" font-size="12.5" text-anchor="start" fill="#f2f5f8">no ID: create()</text>
  <rect x="700" y="70" width="190" height="140" rx="8" fill="#4d7c5a"/>
  <text x="714" y="92" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">4. Data store</text>
  <text x="714" y="114" font-size="12.5" text-anchor="start" fill="#f2f5f8">WC_Data_Store::load( type )</text>
  <text x="714" y="133" font-size="12.5" text-anchor="start" fill="#f2f5f8">reads props, mostly with</text>
  <text x="714" y="152" font-size="12.5" text-anchor="start" fill="#f2f5f8">the edit context (raw</text>
  <text x="714" y="171" font-size="12.5" text-anchor="start" fill="#f2f5f8">values), writes the rows</text>
  <path d="M230,140 L260,140" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M450,140 L480,140" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M670,140 L700,140" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M795,210 L795,245 L135,245 L135,275" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="275" width="190" height="130" rx="8" fill="#6b5b95"/>
  <text x="54" y="297" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">5. Rows written</text>
  <text x="54" y="319" font-size="12.5" text-anchor="start" fill="#f2f5f8">posts + postmeta + lookup</text>
  <text x="54" y="338" font-size="12.5" text-anchor="start" fill="#f2f5f8">HPOS order tables</text>
  <text x="54" y="357" font-size="12.5" text-anchor="start" fill="#f2f5f8">or your own table</text>
  <rect x="260" y="275" width="190" height="130" rx="8" fill="#6b5b95"/>
  <text x="274" y="297" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">6. Bookkeeping</text>
  <text x="274" y="319" font-size="12.5" text-anchor="start" fill="#f2f5f8">apply_changes() moves</text>
  <text x="274" y="338" font-size="12.5" text-anchor="start" fill="#f2f5f8">$changes into $data</text>
  <text x="274" y="357" font-size="12.5" text-anchor="start" fill="#f2f5f8">save_meta_data() adds,</text>
  <text x="274" y="376" font-size="12.5" text-anchor="start" fill="#f2f5f8">updates, deletes meta</text>
  <rect x="480" y="275" width="190" height="130" rx="8" fill="#4d7c5a"/>
  <text x="494" y="297" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">7. After save</text>
  <text x="494" y="319" font-size="12.5" text-anchor="start" fill="#f2f5f8">woocommerce_after_{type}_</text>
  <text x="494" y="338" font-size="12.5" text-anchor="start" fill="#f2f5f8">object_save fires</text>
  <text x="494" y="357" font-size="12.5" text-anchor="start" fill="#f2f5f8">save() returns the ID</text>
  <path d="M230,340 L260,340" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M450,340 L480,340" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="275" width="190" height="130" rx="8" fill="#34495e" stroke="#9fd3c7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="714" y="297" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">delete()</text>
  <text x="714" y="319" font-size="12.5" text-anchor="start" fill="#f2f5f8">pre-delete filter first</text>
  <text x="714" y="338" font-size="12.5" text-anchor="start" fill="#f2f5f8">data store delete()</text>
  <text x="714" y="357" font-size="12.5" text-anchor="start" fill="#f2f5f8">trash or force delete</text>
  <text x="714" y="376" font-size="12.5" text-anchor="start" fill="#f2f5f8">ID becomes 0</text>
  <rect x="40" y="430" width="850" height="84" rx="8" fill="#3d5266"/>
  <text x="56" y="453" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Two contexts for every getter</text>
  <text x="56" y="474" font-size="12.5" text-anchor="start" fill="#f2f5f8">get_price() or get_price( 'view' ) applies the filter woocommerce_product_get_price: extensions may change the value shoppers see.</text>
  <text x="56" y="494" font-size="12.5" text-anchor="start" fill="#f2f5f8">get_price( 'edit' ) returns the stored value without filters; use it when you display a form or save.</text>
</svg>
