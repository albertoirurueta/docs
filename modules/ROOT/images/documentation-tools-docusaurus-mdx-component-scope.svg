<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How an MDX tag finds its component</title>
  <desc id="d">A tag in an MDX file is resolved from the imports and exports of the file first, then from the MDXComponents map, otherwise the build fails or an unknown element is rendered.</desc>
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#26323f"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Where a tag in an MDX file finds its component</text>
  <rect x="30" y="60" width="190" height="70" rx="8" fill="#3d6a99" stroke="#cfe3f7" stroke-width="2"/>
  <text x="125" y="90" text-anchor="middle" font-size="14" fill="#ffffff">converter.mdx</text>
  <text x="125" y="112" text-anchor="middle" font-size="13" fill="#e6f0fa">tag: Highlight, Converter, td</text>
  <rect x="290" y="45" width="200" height="60" rx="8" fill="#3b7d5a" stroke="#d3f0e0" stroke-width="2"/>
  <text x="390" y="70" text-anchor="middle" font-size="14" fill="#ffffff">1. The file itself</text>
  <text x="390" y="90" text-anchor="middle" font-size="12" fill="#e4f6ec">import and export statements</text>
  <rect x="290" y="130" width="200" height="60" rx="8" fill="#3b7d5a" stroke="#d3f0e0" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-size="14" fill="#ffffff">2. MDXComponents map</text>
  <text x="390" y="175" text-anchor="middle" font-size="12" fill="#e4f6ec">src/theme/MDXComponents.tsx</text>
  <rect x="290" y="212" width="200" height="66" rx="8" fill="#8a5a2b" stroke="#f6dcc0" stroke-width="2"/>
  <text x="390" y="236" text-anchor="middle" font-size="14" fill="#ffffff">3. Nothing found</text>
  <text x="390" y="258" text-anchor="middle" font-size="12" fill="#fbe9d6">upper case: build error</text>
  <text x="390" y="272" text-anchor="middle" font-size="12" fill="#fbe9d6">lower case: plain HTML element</text>
  <rect x="550" y="60" width="180" height="70" rx="8" fill="#5b4a8a" stroke="#ddd4f5" stroke-width="2"/>
  <text x="640" y="88" text-anchor="middle" font-size="14" fill="#ffffff">Rendered React</text>
  <text x="640" y="108" text-anchor="middle" font-size="14" fill="#ffffff">component</text>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M220 95 L290 75"/><path d="M220 100 L255 100 L255 160 L290 160"/><path d="M220 120 L240 120 L240 245 L290 245"/>
    <path d="M490 75 L550 85"/><path d="M490 160 L520 160 L520 100 L550 100"/>
  </g>
</svg>
