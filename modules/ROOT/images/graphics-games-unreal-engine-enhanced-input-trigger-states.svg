<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Trigger states over time for three triggers</text>
<text x="20" y="60" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Hold 0.5 s, key held 1 s</text>
<rect x="110" y="78" width="620" height="14" rx="2" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<rect x="150" y="78" width="450" height="14" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
<text x="105" y="90" text-anchor="end" font-size="11" fill="#374151">key</text>
<text x="105" y="120" text-anchor="end" font-size="11" fill="#374151">state</text>
<rect x="150" y="104" width="150" height="22" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="1"/>
<text x="225.0" y="119" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">Ongoing</text>
<rect x="300" y="104" width="300" height="22" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="450.0" y="119" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">Triggered</text>
<polygon points="145,136 155,136 150,128" fill="#4F46E5"/>
<text x="150" y="150" text-anchor="middle" font-size="10" fill="#374151">Started</text>
<polygon points="295,136 305,136 300,128" fill="#047857"/>
<text x="300" y="150" text-anchor="middle" font-size="10" fill="#374151">Triggered</text>
<polygon points="595,136 605,136 600,128" fill="#B45309"/>
<text x="600" y="150" text-anchor="middle" font-size="10" fill="#374151">Completed</text>
<text x="225" y="128" text-anchor="middle" font-size="10" fill="#374151"></text>
<text x="20" y="190" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Hold 0.5 s, key released after 0.3 s</text>
<rect x="110" y="208" width="620" height="14" rx="2" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<rect x="150" y="208" width="100" height="14" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
<text x="105" y="220" text-anchor="end" font-size="11" fill="#374151">key</text>
<text x="105" y="250" text-anchor="end" font-size="11" fill="#374151">state</text>
<rect x="150" y="234" width="100" height="22" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="1"/>
<text x="200.0" y="249" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">Ongoing</text>
<polygon points="145,266 155,266 150,258" fill="#4F46E5"/>
<text x="150" y="280" text-anchor="middle" font-size="10" fill="#374151">Started</text>
<polygon points="245,266 255,266 250,258" fill="#B91C1C"/>
<text x="250" y="280" text-anchor="middle" font-size="10" fill="#374151">Canceled</text>
<text x="20" y="320" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Pressed</text>
<rect x="110" y="338" width="620" height="14" rx="2" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<rect x="150" y="338" width="300" height="14" rx="2" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
<text x="105" y="350" text-anchor="end" font-size="11" fill="#374151">key</text>
<text x="105" y="380" text-anchor="end" font-size="11" fill="#374151">state</text>
<rect x="150" y="364" width="20" height="22" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
<polygon points="155,396 165,396 160,388" fill="#047857"/>
<text x="160" y="410" text-anchor="middle" font-size="10" fill="#374151">Triggered</text>
<text x="560" y="372" text-anchor="middle" font-size="11" fill="#374151">Triggered on the press frame only,</text>
<text x="560" y="388" text-anchor="middle" font-size="11" fill="#374151">even while the key stays down.</text>
<text x="380" y="432" text-anchor="middle" font-size="10" fill="#374151">Started always fires first; Completed means Triggered to None; Canceled means evaluation was abandoned.</text>
</svg>
