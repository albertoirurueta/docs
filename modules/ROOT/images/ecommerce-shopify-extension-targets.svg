<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where admin and POS UI extensions render</title>
  <desc id="d">Two panels. In the Shopify admin an extension can be a block card on a resource page, a modal opened from the More actions menu (with a separate should-render module that decides whether the menu item appears) or a print preview opened from the Print menu. In Shopify POS an extension can be a tile on the smart grid that opens a modal, a block on a native screen such as product details with a menu item that opens a modal, or a background target that runs for the whole session without a user interface. Both surfaces share Preact, Polaris web components, the shopify global object and the 64 KB compressed bundle limit.</desc>
  <rect x="0" y="0" width="760" height="430" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="15" fill="#f2f5f8" font-weight="bold">
    <text x="20" y="30">Shopify admin (admin UI extensions)</text>
    <text x="400" y="30">Shopify POS (POS UI extensions)</text>
  </g>
  <rect x="14" y="40" width="352" height="296" rx="10" fill="none" stroke="#f2f5f8" stroke-dasharray="5 4"/>
  <rect x="394" y="40" width="352" height="296" rx="10" fill="none" stroke="#f2f5f8" stroke-dasharray="5 4"/>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="28" y="54" width="324" height="70" rx="8"/>
    <rect x="28" y="140" width="324" height="84" rx="8"/>
    <rect x="28" y="240" width="324" height="84" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8">
    <text x="40" y="76" font-weight="bold">Block: a card on a resource page</text>
    <text x="40" y="95" font-size="12">admin.product-details.block.render</text>
    <text x="40" y="112" font-size="12">Merchant adds and pins it first</text>
    <text x="40" y="162" font-weight="bold">Action: More actions menu, then a modal</text>
    <text x="40" y="181" font-size="12">admin.product-details.action.render</text>
    <text x="40" y="198" font-size="12">admin.product-details.action.should-render</text>
    <text x="40" y="214" font-size="12">decides if the menu item is shown</text>
    <text x="40" y="262" font-weight="bold">Print action: Print menu, then a preview</text>
    <text x="40" y="281" font-size="12">admin.order-details.print-action.render</text>
    <text x="40" y="298" font-size="12">src: HTML, PDF or image from the app</text>
    <text x="40" y="314" font-size="12">Print button uses the browser print</text>
  </g>

  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="408" y="54" width="324" height="70" rx="8"/>
    <rect x="408" y="140" width="324" height="84" rx="8"/>
  </g>
  <g fill="#8a6a3a" stroke="#f2f5f8">
    <rect x="408" y="240" width="324" height="84" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8">
    <text x="420" y="76" font-weight="bold">Tile on the smart grid, then a modal</text>
    <text x="420" y="95" font-size="12">pos.home.tile.render</text>
    <text x="420" y="112" font-size="12">pos.home.modal.render</text>
    <text x="420" y="162" font-weight="bold">Block on a native screen</text>
    <text x="420" y="181" font-size="12">pos.product-details.block.render</text>
    <text x="420" y="198" font-size="12">menu item: pos.product-details.action.menu-item.render</text>
    <text x="420" y="214" font-size="12">modal: pos.product-details.action.render</text>
    <text x="420" y="262" font-weight="bold">Background: no user interface</text>
    <text x="420" y="281" font-size="12">pos.app.ready.data</text>
    <text x="420" y="298" font-size="12">Runs for the whole POS session and listens</text>
    <text x="420" y="314" font-size="12">for transactioncomplete and similar events</text>
  </g>

  <rect x="14" y="350" width="732" height="68" rx="10" fill="#34495c" stroke="#f2f5f8"/>
  <g font-size="13" fill="#f2f5f8">
    <text x="28" y="374" font-weight="bold">Shared by both surfaces</text>
    <text x="28" y="394" font-size="12">Preact and Polaris web components (s-* elements), the shopify global object, shopify.extension.toml with api_version 2026-10,</text>
    <text x="28" y="410" font-size="12">Direct API access with fetch to shopify:admin/api/graphql.json, app backend calls with an ID token, 64 KB compressed per extension.</text>
  </g>
</svg>
