<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-models-with-model-io-and-usd-import-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Importing a model with Model I/O and MetalKit</text>
<rect x="20" y="100" width="128" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84.0" y="136.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">USDZ file</text>
<text x="84.0" y="150.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">in the app bundle</text>
<circle cx="32" cy="92" r="11" fill="#4F46E5"/><text x="32" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="148" y1="140" x2="168" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-models-with-model-io-and-usd-import-flow)"/>
<rect x="168" y="100" width="128" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="232.0" y="129.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MDLAsset</text>
<text x="232.0" y="143.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">url, vertexDescriptor,</text>
<text x="232.0" y="157.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bufferAllocator</text>
<circle cx="180" cy="92" r="11" fill="#4F46E5"/><text x="180" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="296" y1="140" x2="316" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-models-with-model-io-and-usd-import-flow)"/>
<rect x="316" y="100" width="128" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="129.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MDLMesh</text>
<text x="380.0" y="143.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">normals, tangents</text>
<text x="380.0" y="157.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">added if missing</text>
<circle cx="328" cy="92" r="11" fill="#4F46E5"/><text x="328" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="444" y1="140" x2="464" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-models-with-model-io-and-usd-import-flow)"/>
<rect x="464" y="100" width="128" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="528.0" y="129.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTKMesh</text>
<text x="528.0" y="143.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal buffers and</text>
<text x="528.0" y="157.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTKSubmesh index buffers</text>
<circle cx="476" cy="92" r="11" fill="#4F46E5"/><text x="476" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<line x1="592" y1="140" x2="612" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-models-with-model-io-and-usd-import-flow)"/>
<rect x="612" y="100" width="128" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="676.0" y="129.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Draw</text>
<text x="676.0" y="143.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">per submesh: bind</text>
<text x="676.0" y="157.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">textures, drawIndexed</text>
<circle cx="624" cy="92" r="11" fill="#4F46E5"/><text x="624" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="20" y="230" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="261.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The MTLVertexDescriptor you use for the pipeline is converted with MTKModelIOVertexDescriptorFromMetal</text>
<text x="380.0" y="276.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">and passed to MDLAsset, so the buffers come out in exactly the layout the vertex function expects.</text>
</svg>
