<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vid-fetch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From an interleaved vertex buffer to shader inputs</text>
<text x="20" y="62" font-size="14" font-weight="bold" fill="#3730A3">Vertex buffer at binding 0 (stride 32 bytes)</text>
<rect x="20" y="75" width="220" height="44" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="102" text-anchor="middle" font-size="12" fill="#3730A3">position vec3 (12 B)</text>
<rect x="240" y="75" width="220" height="44" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="350" y="102" text-anchor="middle" font-size="12" fill="#065F46">normal vec3 (12 B)</text>
<rect x="460" y="75" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="535" y="102" text-anchor="middle" font-size="12" fill="#92400E">uv vec2 (8 B)</text>
<rect x="610" y="75" width="130" height="44" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="675" y="102" text-anchor="middle" font-size="12" fill="#374151">next vertex...</text>
<text x="20" y="138" font-size="11" fill="#374151">offset 0</text>
<text x="240" y="138" font-size="11" fill="#374151">offset 12</text>
<text x="460" y="138" font-size="11" fill="#374151">offset 24</text>
<text x="610" y="138" font-size="11" fill="#374151">offset 32 (= stride)</text>
<rect x="20" y="170" width="330" height="170" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="185" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">Pipeline vertex input state</text>
<text x="34" y="216" font-size="12" fill="#374151">VkVertexInputBindingDescription</text>
<text x="44" y="234" font-size="11" fill="#374151">binding 0, stride 32, inputRate VERTEX</text>
<text x="34" y="260" font-size="12" fill="#374151">VkVertexInputAttributeDescription</text>
<text x="44" y="278" font-size="11" fill="#374151">location 0, binding 0, R32G32B32_SFLOAT, offset 0</text>
<text x="44" y="296" font-size="11" fill="#374151">location 1, binding 0, R32G32B32_SFLOAT, offset 12</text>
<text x="44" y="314" font-size="11" fill="#374151">location 2, binding 0, R32G32_SFLOAT, offset 24</text>
<rect x="430" y="170" width="310" height="170" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="585" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Vertex shader inputs</text>
<text x="446" y="226" font-size="12" fill="#374151">layout(location = 0) in vec3 inPos;</text>
<text x="446" y="256" font-size="12" fill="#374151">layout(location = 1) in vec3 inNormal;</text>
<text x="446" y="286" font-size="12" fill="#374151">layout(location = 2) in vec2 inUv;</text>
<text x="446" y="320" font-size="11" fill="#6B7280">location, not binding, links the two sides</text>
<line x1="350" y1="255" x2="428" y2="255" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-fetch)"/>
<line x1="130" y1="120" x2="130" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-fetch)"/>
</svg>
