<svg viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="arrRpGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From application state to bytes on the terminal</text>
  <text x="450" y="46" font-size="13" fill="#666666" text-anchor="middle">One frame of an immediate-mode TUI: everything is rebuilt, only the difference is written.</text>

  <!-- stage 1: state -->
  <rect x="20" y="70" width="150" height="110" rx="8" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="95" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">1. State</text>
  <text x="95" y="114" font-size="11" fill="#333333" text-anchor="middle">cursor = 1</text>
  <text x="95" y="130" font-size="11" fill="#333333" text-anchor="middle">loans = {1}</text>
  <text x="95" y="146" font-size="11" fill="#333333" text-anchor="middle">query = "du"</text>
  <text x="95" y="166" font-size="11" fill="#1c4b73" text-anchor="middle">the only source of truth</text>

  <!-- stage 2: widgets -->
  <rect x="215" y="70" width="150" height="110" rx="8" fill="#dbe8f5" stroke="#1c4b73" stroke-width="2"/>
  <text x="290" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">2. Widgets</text>
  <text x="290" y="114" font-size="11" fill="#333333" text-anchor="middle">layout splits the area</text>
  <text x="290" y="130" font-size="11" fill="#333333" text-anchor="middle">List, Table, Paragraph</text>
  <text x="290" y="146" font-size="11" fill="#333333" text-anchor="middle">built again every frame</text>
  <text x="290" y="166" font-size="11" fill="#1c4b73" text-anchor="middle">view(state)</text>

  <!-- stage 3: buffer -->
  <rect x="410" y="70" width="150" height="110" rx="8" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="485" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">3. Cell buffer</text>
  <text x="485" y="114" font-size="11" fill="#333333" text-anchor="middle">grid of columns x rows</text>
  <text x="485" y="130" font-size="11" fill="#333333" text-anchor="middle">cell = symbol + colours</text>
  <text x="485" y="146" font-size="11" fill="#333333" text-anchor="middle">+ modifiers</text>
  <text x="485" y="166" font-size="11" fill="#7a5a10" text-anchor="middle">next frame, in memory</text>

  <!-- stage 4: diff -->
  <rect x="605" y="70" width="130" height="110" rx="8" fill="#f8e9c4" stroke="#a07820" stroke-width="2"/>
  <text x="670" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">4. Diff</text>
  <text x="670" y="114" font-size="11" fill="#333333" text-anchor="middle">next vs previous</text>
  <text x="670" y="130" font-size="11" fill="#333333" text-anchor="middle">only changed cells</text>
  <text x="670" y="166" font-size="11" fill="#7a5a10" text-anchor="middle">skip equal cells</text>

  <!-- stage 5: escape sequences -->
  <rect x="775" y="70" width="110" height="110" rx="8" fill="#e3f1e3" stroke="#2f6b2f" stroke-width="2"/>
  <text x="830" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">5. Bytes</text>
  <text x="830" y="114" font-size="11" fill="#333333" text-anchor="middle">cursor moves,</text>
  <text x="830" y="130" font-size="11" fill="#333333" text-anchor="middle">SGR colours,</text>
  <text x="830" y="146" font-size="11" fill="#333333" text-anchor="middle">text; one flush</text>
  <text x="830" y="166" font-size="11" fill="#2f6b2f" text-anchor="middle">to stdout</text>

  <line x1="170" y1="125" x2="213" y2="125" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrRp)"/>
  <line x1="365" y1="125" x2="408" y2="125" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrRp)"/>
  <line x1="560" y1="125" x2="603" y2="125" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrRp)"/>
  <line x1="735" y1="125" x2="773" y2="125" stroke="#1c4b73" stroke-width="2" marker-end="url(#arrRp)"/>

  <!-- previous buffer feedback -->
  <rect x="520" y="230" width="175" height="50" rx="8" fill="#ffffff" stroke="#666666" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="607" y="252" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Previous buffer</text>
  <text x="607" y="268" font-size="11" fill="#333333" text-anchor="middle">what the screen shows now</text>
  <line x1="640" y1="230" x2="670" y2="182" stroke="#666666" stroke-width="2" marker-end="url(#arrRpGray)"/>
  <path d="M 485 182 L 485 255 L 518 255" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrRpGray)"/>
  <text x="475" y="204" font-size="11" fill="#666666" text-anchor="end">swap after the flush:</text>
  <text x="475" y="219" font-size="11" fill="#666666" text-anchor="end">next becomes previous</text>

  <!-- input loop-back -->
  <rect x="20" y="230" width="360" height="110" rx="8" fill="#fdf8ee" stroke="#a02020" stroke-width="2"/>
  <text x="200" y="254" font-size="13" font-weight="bold" fill="#a02020" text-anchor="middle">Input closes the loop</text>
  <text x="200" y="276" font-size="11" fill="#333333" text-anchor="middle">key, mouse, paste and resize events arrive as bytes</text>
  <text x="200" y="292" font-size="11" fill="#333333" text-anchor="middle">the decoder turns them into messages</text>
  <text x="200" y="308" font-size="11" fill="#333333" text-anchor="middle">update(state, message) produces new state</text>
  <text x="200" y="326" font-size="11" fill="#a02020" text-anchor="middle">then the next frame starts at stage 1</text>
  <line x1="95" y1="230" x2="95" y2="182" stroke="#a02020" stroke-width="2" marker-end="url(#arrRp)"/>

  <text x="885" y="262" font-size="11" fill="#666666" text-anchor="end">Synchronized output (mode 2026)</text>
  <text x="885" y="278" font-size="11" fill="#666666" text-anchor="end">wraps stage 5 so the terminal</text>
  <text x="885" y="294" font-size="11" fill="#666666" text-anchor="end">shows the frame atomically</text>
  <text x="885" y="310" font-size="11" fill="#666666" text-anchor="end">where supported.</text>
</svg>
