<text x="20" y="184" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Highlights</text>
<text x="20" y="204" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">130: in / out replace attribute / varying; 150: geometry shaders, interface blocks; 330: layout(location) for inputs and outputs;</text>
<text x="20" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">400: tessellation, double; 420: layout(binding), image load/store; 430: compute, SSBO; 450: DSA era; 460: SPIR-V, gl_DrawID.</text>
<text x="20" y="252" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">OpenGL ES / GLSL ES</text>
