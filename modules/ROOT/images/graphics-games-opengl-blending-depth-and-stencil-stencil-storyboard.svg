<text x="88" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">0 0 0 0</text>
<text x="88" y="242" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Clear</text>
<text x="88" y="260" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">stencil = 0 everywhere</text>
