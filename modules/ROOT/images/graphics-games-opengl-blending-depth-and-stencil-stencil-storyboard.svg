<text x="235" y="242" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Mark</text>
<text x="235" y="260" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">draw the book, write 1</text>
<rect x="314" y="50" width="137" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
