<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-perf-demand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Continuous versus on-demand rendering</text>
<text x="20" y="60" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Continuous (setAnimationLoop)</text>
<rect x="40" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="98" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="156" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="214" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="272" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="330" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="388" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="446" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="504" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="562" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="620" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="678" y="72" width="46" height="26" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="380" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">a frame is drawn every display refresh, even when nothing moved</text>
<text x="20" y="160" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">On demand (render only after an invalidate)</text>
<rect x="40" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="98" y="172" width="46" height="26" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="156" y="172" width="46" height="26" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="214" y="172" width="46" height="26" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="272" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="330" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="388" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="446" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="504" y="172" width="46" height="26" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="562" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="620" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="678" y="172" width="46" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<text x="380" y="216" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">frames appear only after a control change event, a resize or a state change</text>
<rect x="20" y="250" width="210" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="270.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Triggers</text>
<text x="125.0" y="284.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">controls &#x27;change&#x27;, resize,</text>
<text x="125.0" y="298.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">texture load, game state</text>
<rect x="275" y="250" width="210" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="270.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">invalidate()</text>
<text x="380.0" y="284.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sets needsRender = true</text>
<text x="380.0" y="298.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">requests one animation frame</text>
<rect x="530" y="250" width="210" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="635.0" y="270.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">render()</text>
<text x="635.0" y="284.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">clears the flag</text>
<text x="635.0" y="298.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">(idle frames cost ~0)</text>
<line x1="230" y1="280" x2="275" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-demand)"/>
<line x1="485" y1="280" x2="530" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-demand)"/>
<text x="380" y="346" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The catch-the-falling-books game needs the continuous loop; the pulled-out-book viewer does not.</text>
<text x="380" y="364" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Damped OrbitControls keep emitting changes while they settle, so call controls.update() each frame there.</text>
</svg>
