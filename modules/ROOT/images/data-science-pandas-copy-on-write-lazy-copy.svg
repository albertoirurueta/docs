<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Copy-on-Write lazy copy</title>
  <desc id="d1">Left panel: a frame and its derived frame share the same column buffers. Right panel: after a write to column a through the derived frame, only column a is copied and column b stays shared.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">Lazy copies: the data is copied on the first write</text>
  <line x1="360" y1="56" x2="360" y2="336" stroke="#CBD5E1" stroke-width="1.5"/>

  <circle cx="34" cy="76" r="11" fill="#0F172A"/><text x="34" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="54" y="81" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">other = df.reset_index(drop=True)</text>
  <rect x="50" y="110" width="100" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="100" y="136" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">df</text>
  <rect x="210" y="110" width="100" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="260" y="136" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">other</text>
  <rect x="60" y="230" width="100" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="110" y="263" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">col a</text>
  <rect x="190" y="230" width="100" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="240" y="263" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">col b</text>
  <line x1="90" y1="150" x2="108" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="110" y1="150" x2="228" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="250" y1="150" x2="122" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="270" y1="150" x2="252" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="180" y="318" text-anchor="middle" font-size="12" fill="#475569">Two objects, one set of buffers, nothing copied yet</text>

  <circle cx="394" cy="76" r="11" fill="#0F172A"/><text x="394" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="414" y="81" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">other.loc[0, 'a'] = -1</text>
  <rect x="400" y="110" width="90" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="445" y="136" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">df</text>
  <rect x="600" y="110" width="100" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="650" y="136" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">other</text>
  <rect x="385" y="230" width="90" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="430" y="263" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">col a</text>
  <rect x="495" y="230" width="90" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="540" y="263" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">col b</text>
  <rect x="610" y="230" width="90" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="655" y="255" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">col a</text>
  <text x="655" y="275" text-anchor="middle" font-size="12" fill="#475569">private copy</text>
  <line x1="435" y1="150" x2="430" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="455" y1="150" x2="530" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="625" y1="150" x2="552" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="655" y1="150" x2="655" y2="228" stroke="#B45309" stroke-width="2" marker-end="url(#ahA)"/>
  <text x="540" y="318" text-anchor="middle" font-size="12" fill="#475569">Only the written column is copied; col b stays shared</text>
</svg>
