<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Go GC cycle against heap size, GOGC and GOMEMLIMIT</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">Three cycles of one program: the live heap grows, the heap goal follows it, then the memory limit takes over</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="440" x2="900" y2="440" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="80" y1="440" x2="80" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="896" y="458" font-size="12" fill="#555555" text-anchor="end">time (allocation)</text>
  <text x="74" y="96" font-size="12" fill="#555555" text-anchor="end">memory</text>
  <text x="74" y="110" font-size="12" fill="#555555" text-anchor="end">in use</text>

  <!-- memory limit -->
  <line x1="80" y1="190" x2="900" y2="190" stroke="#b3261e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="896" y="182" font-size="12" font-weight="bold" fill="#b3261e" text-anchor="end">GOMEMLIMIT (soft): Sys - HeapReleased</text>

  <!-- heap goals (dashed) -->
  <g stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="100" y1="300" x2="300" y2="300"/>
    <line x1="340" y1="250" x2="560" y2="250"/>
    <line x1="600" y1="212" x2="880" y2="212"/>
  </g>
  <g font-size="11" fill="#1c4b73">
    <text x="104" y="294">goal 1 = live + (live + roots) x GOGC/100</text>
    <text x="344" y="244">goal 2 (live heap is larger)</text>
    <text x="604" y="206">goal 3 (capped by the limit)</text>
  </g>
  <text x="604" y="124" font-size="11" fill="#555555">the dotted line is where GOGC alone would put goal 3</text>
  <line x1="600" y1="130" x2="880" y2="130" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- live heap markers -->
  <g stroke="#2e7d32" stroke-width="2">
    <line x1="100" y1="380" x2="140" y2="380"/>
    <line x1="340" y1="350" x2="380" y2="350"/>
    <line x1="600" y1="312" x2="640" y2="312"/>
  </g>
  <g font-size="11" fill="#2e7d32">
    <text x="144" y="384">live 1</text>
    <text x="384" y="354">live 2</text>
    <text x="644" y="316">live 3</text>
  </g>

  <!-- heap size curve -->
  <polyline points="100,380 250,316 300,302 330,350" fill="none" stroke="#222222" stroke-width="2.5"/>
  <polyline points="340,350 500,266 545,252 575,312" fill="none" stroke="#222222" stroke-width="2.5"/>
  <polyline points="600,312 730,228 770,212 800,298 870,276" fill="none" stroke="#222222" stroke-width="2.5"/>

  <!-- mark phase highlights on the curve -->
  <g fill="none" stroke="#1c4b73" stroke-width="7" stroke-opacity="0.35">
    <polyline points="250,316 300,302"/>
    <polyline points="500,266 545,252"/>
    <polyline points="730,228 770,212"/>
  </g>
  <g fill="none" stroke="#b34700" stroke-width="3">
    <polyline points="280,306 300,302"/>
    <polyline points="526,257 545,252"/>
    <polyline points="752,220 770,212"/>
  </g>

  <!-- trigger markers -->
  <g fill="#1c4b73">
    <circle cx="250" cy="316" r="4"/>
    <circle cx="500" cy="266" r="4"/>
    <circle cx="730" cy="228" r="4"/>
  </g>
  <text x="250" y="336" font-size="11" fill="#1c4b73" text-anchor="middle">trigger</text>
  <text x="500" y="286" font-size="11" fill="#1c4b73" text-anchor="middle">trigger</text>
  <text x="730" y="248" font-size="11" fill="#1c4b73" text-anchor="middle">trigger</text>

  <!-- phase strip -->
  <text x="74" y="478" font-size="12" fill="#555555" text-anchor="end">GC phase</text>
  <g stroke="#555555" stroke-width="0.8" font-size="11" text-anchor="middle">
    <rect x="100" y="462" width="150" height="26" fill="#e9f5e9"/>
    <rect x="250" y="462" width="50" height="26" fill="#dbe8f5"/>
    <rect x="300" y="462" width="40" height="26" fill="#e9f5e9"/>
    <rect x="340" y="462" width="160" height="26" fill="#f4f4f4"/>
    <rect x="500" y="462" width="45" height="26" fill="#dbe8f5"/>
    <rect x="545" y="462" width="55" height="26" fill="#e9f5e9"/>
    <rect x="600" y="462" width="130" height="26" fill="#f4f4f4"/>
    <rect x="730" y="462" width="40" height="26" fill="#dbe8f5"/>
    <rect x="770" y="462" width="60" height="26" fill="#e9f5e9"/>
    <rect x="830" y="462" width="70" height="26" fill="#f4f4f4"/>
  </g>
  <g font-size="11" fill="#222222" text-anchor="middle">
    <text x="175" y="479">sweep, then off</text>
    <text x="275" y="479">mark</text>
    <text x="320" y="479">sweep</text>
    <text x="420" y="479">off</text>
    <text x="522" y="479">mark</text>
    <text x="572" y="479">sweep</text>
    <text x="665" y="479">off</text>
    <text x="750" y="479">mark</text>
    <text x="800" y="479">sweep</text>
    <text x="865" y="479">off</text>
  </g>

  <!-- stop-the-world ticks -->
  <g stroke="#b3261e" stroke-width="3">
    <line x1="250" y1="458" x2="250" y2="492"/>
    <line x1="300" y1="458" x2="300" y2="492"/>
    <line x1="500" y1="458" x2="500" y2="492"/>
    <line x1="545" y1="458" x2="545" y2="492"/>
    <line x1="730" y1="458" x2="730" y2="492"/>
    <line x1="770" y1="458" x2="770" y2="492"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#222222">
    <line x1="100" y1="526" x2="130" y2="526" stroke="#222222" stroke-width="2.5"/>
    <text x="138" y="530">heap size: grows with allocation, falls when sweeping frees dead objects</text>
    <line x1="100" y1="548" x2="130" y2="548" stroke="#1c4b73" stroke-width="7" stroke-opacity="0.35"/>
    <text x="138" y="552">concurrent mark: dedicated and fractional workers aim at 25% of the CPUs, idle Ps join in</text>
    <line x1="100" y1="570" x2="130" y2="570" stroke="#b34700" stroke-width="3"/>
    <text x="138" y="574">mark assist: a fast-allocating goroutine pays for its allocations with scan work</text>
    <line x1="540" y1="526" x2="540" y2="536" stroke="#b3261e" stroke-width="3"/>
    <text x="548" y="534">stop-the-world: sweep termination and mark termination</text>
  </g>
  <text x="870" y="574" font-size="11" fill="#666666" text-anchor="end">sizes and times are schematic</text>
</svg>
