<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Ways an app can earn: three access models and one outside route</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="20" y="56" width="170" height="220" rx="10"/><rect x="205" y="56" width="170" height="220" rx="10"/><rect x="390" y="56" width="170" height="220" rx="10"/>
  </g>
  <rect x="575" y="56" width="165" height="220" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="105" y="84">Gated</text><text x="290" y="84">Freemium</text><text x="475" y="84">Credit-based</text><text x="657" y="84" fill="#92400E">External payment</text>
  </g>
  <text x="380" y="304" font-size="12" fill="#374151" text-anchor="middle">Premium Apps Program: Canva manages gating and upgrade flow</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="105" y="116">Every feature needs</text><text x="105" y="132">a paid Canva plan</text>
    <text x="290" y="116">Core features on Free,</text><text x="290" y="132">premium features on</text><text x="290" y="148">a paid plan</text>
    <text x="475" y="116">Starter credit quota,</text><text x="475" y="132">then upgrade to</text><text x="475" y="148">keep using premium</text>
    <text x="657" y="116">Link to your own site</text><text x="657" y="132">when the platform</text><text x="657" y="148">allows payment links</text>
  </g>
  <g fill="#FFFFFF" stroke="#9CA3AF">
    <rect x="40" y="180" width="130" height="70" rx="4"/><rect x="225" y="180" width="130" height="70" rx="4"/><rect x="410" y="180" width="130" height="70" rx="4"/><rect x="595" y="180" width="125" height="70" rx="4"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="105" y="210">All features</text><text x="105" y="226">locked until upgrade</text>
    <text x="290" y="210">Free tier + locked</text><text x="290" y="226">billable actions</text>
    <text x="475" y="210">Credits counter</text><text x="475" y="226">runs down</text>
    <text x="657" y="210">Button opens</text><text x="657" y="226">an external page</text>
  </g>
  <text x="380" y="328" font-size="12" fill="#374151" text-anchor="middle">No in-app purchases exist in the SDK. Payout details must be set up to be paid.</text>
  <text x="380" y="362" font-size="11" fill="#6B7280" text-anchor="middle">Schematic comparison, not a screenshot of any product.</text>
</svg>
