<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Common failures and their fixes</text>
<g font-size="13" font-weight="bold" fill="#3730A3"><text x="40" y="62">Symptom</text><text x="300" y="62">Likely cause</text><text x="520" y="62">Fix</text></g>
<g stroke="#E5E7EB"><path d="M20,70 L700,70"/><path d="M20,130 L700,130"/><path d="M20,190 L700,190"/><path d="M20,250 L700,250"/><path d="M20,310 L700,310"/></g>
<g font-size="12" fill="#374151">
<text x="30" y="96">Layer dissolves instead</text><text x="30" y="112">of moving</text>
<text x="300" y="96">Names differ between</text><text x="300" y="112">the two frames</text>
<text x="520" y="96">Rename layers to match,</text><text x="520" y="112">or duplicate the frame</text>
<text x="30" y="156">Layer slides to a wrong</text><text x="30" y="172">place</text>
<text x="300" y="156">Unintended match with a</text><text x="300" y="172">same-named layer</text>
<text x="520" y="156">Give the layers unique</text><text x="520" y="172">names or group them</text>
<text x="30" y="216">Shadow pops in at the end</text>
<text x="300" y="216">Shadows are not tweened</text>
<text x="520" y="216">Accept the dissolve or</text><text x="520" y="232">restyle the effect</text>
<text x="30" y="276">Nothing animates on an</text><text x="30" y="292">overlay</text>
<text x="300" y="276">Overlays count as new</text><text x="300" y="292">frames</text>
<text x="520" y="276">Use matching layers in an</text><text x="520" y="292">overlay swap, or a frame</text>
</g>
<text x="360" y="338" font-size="12" fill="#4B5563" text-anchor="middle">Raise the duration while debugging so you can watch which layers are paired.</text>
</svg>
