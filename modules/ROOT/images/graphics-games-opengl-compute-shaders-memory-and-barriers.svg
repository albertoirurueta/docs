<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where compute data lives and which barrier orders it</text>
<rect x="30" y="50" width="200" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="76.5" text-anchor="middle" font-size="12" fill="#374151">Invocation</text>
<text x="130.0" y="91.5" text-anchor="middle" font-size="12" fill="#374151">private variables</text>
<rect x="30" y="130" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="149.0" text-anchor="middle" font-size="12" fill="#3730A3">Work group</text>
<text x="130.0" y="164.0" text-anchor="middle" font-size="12" fill="#3730A3">shared variables</text>
<text x="130.0" y="179.0" text-anchor="middle" font-size="12" fill="#3730A3">(on-chip, fast)</text>
<rect x="30" y="210" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130.0" y="229.0" text-anchor="middle" font-size="12" fill="#92400E">Whole dispatch</text>
<text x="130.0" y="244.0" text-anchor="middle" font-size="12" fill="#92400E">SSBO, image, atomic counter</text>
<text x="130.0" y="259.0" text-anchor="middle" font-size="12" fill="#92400E">(video memory)</text>
<line x1="130" y1="110" x2="130" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="130" y1="190" x2="130" y2="208" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="270" y="50" width="460" height="310" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="500" y="74" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Which call orders what</text>
<text x="285" y="96" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">barrier()</text>
<text x="285" y="114" text-anchor="start" font-size="10" fill="#374151">Every invocation of the group arrives before any continues.</text>
<text x="285" y="140" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">memoryBarrierShared()</text>
<text x="285" y="158" text-anchor="start" font-size="10" fill="#374151">Shared-variable writes become visible to the group.</text>
<text x="285" y="184" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">memoryBarrier()</text>
<text x="285" y="202" text-anchor="start" font-size="10" fill="#374151">Orders this invocation's buffer, image and atomic writes.</text>
<text x="285" y="228" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">groupMemoryBarrier()</text>
<text x="285" y="246" text-anchor="start" font-size="10" fill="#374151">Same as memoryBarrier but only for the work group.</text>
<text x="285" y="272" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">glMemoryBarrier(bits)</text>
<text x="285" y="290" text-anchor="start" font-size="10" fill="#374151">Between dispatches and draws: later commands see earlier writes.</text>
<text x="285" y="316" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">glMemoryBarrierByRegion</text>
<text x="285" y="334" text-anchor="start" font-size="10" fill="#374151">Region-limited variant (GL 4.5, ES 3.1).</text>
<text x="380" y="385" text-anchor="middle" font-size="11" fill="#4B5563">Typical reduction: write shared, barrier(), read neighbour, barrier() again.</text>
</svg>
