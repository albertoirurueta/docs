<svg viewBox="0 0 720 330" width="720" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="330" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a microinteraction: the favourite toggle</text>
<g stroke-width="2" stroke="#4F46E5" fill="#EEF2FF">
<rect x="20" y="70" width="150" height="130" rx="12"/><rect x="200" y="70" width="150" height="130" rx="12" stroke="#B45309" fill="#FEF3C7"/><rect x="380" y="70" width="150" height="130" rx="12"/><rect x="560" y="70" width="140" height="130" rx="12" stroke="#047857" fill="#D1FAE5"/></g>
<g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M172,135 L198,135" marker-end="url(#ah)"/><path d="M352,135 L378,135" marker-end="url(#ah)"/><path d="M532,135 L558,135" marker-end="url(#ah)"/></g>
<g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><circle cx="34" cy="84" r="11" fill="#4F46E5"/><circle cx="214" cy="84" r="11" fill="#B45309"/><circle cx="394" cy="84" r="11" fill="#4F46E5"/><circle cx="574" cy="84" r="11" fill="#047857"/>
<text x="34" y="88">1</text><text x="214" y="88">2</text><text x="394" y="88">3</text><text x="574" y="88">4</text></g>
<g font-size="13" font-weight="bold" text-anchor="middle"><text x="95" y="112" fill="#3730A3">Trigger</text><text x="275" y="112" fill="#92400E">Rules</text><text x="455" y="112" fill="#3730A3">Feedback</text><text x="630" y="112" fill="#065F46">Loops and modes</text></g>
<g font-size="12" fill="#374151" text-anchor="middle"><text x="95" y="140">User taps the</text><text x="95" y="156">heart on a card</text><text x="275" y="140">Outline heart becomes</text><text x="275" y="156">filled; book is saved</text><text x="455" y="140">Heart scales and</text><text x="455" y="156">fills in 200 ms</text><text x="630" y="140">Tap again to undo;</text><text x="630" y="156">state is remembered</text></g>
<text x="95" y="226" font-size="12" fill="#4B5563" text-anchor="middle">On click, Mouse down</text><text x="275" y="226" font-size="12" fill="#4B5563" text-anchor="middle">Change to (variants)</text><text x="455" y="226" font-size="12" fill="#4B5563" text-anchor="middle">Smart animate, easing</text><text x="630" y="226" font-size="12" fill="#4B5563" text-anchor="middle">Second variant, Reset state</text>
<text x="360" y="230" font-size="1" fill="#FFFFFF"> </text>
<text x="360" y="280" font-size="12" fill="#374151" text-anchor="middle">Four parts of a microinteraction; below each, the Figma feature that prototypes it.</text>
<text x="360" y="300" font-size="12" fill="#374151" text-anchor="middle">Schematic generic diagram, not a Figma screenshot.</text>
