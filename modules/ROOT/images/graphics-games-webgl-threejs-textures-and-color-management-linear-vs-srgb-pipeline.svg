<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-tex-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where colour management converts values in three.js</text>
<rect x="20" y="56" width="100" height="84" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.8"/>
<text x="70" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Image file</text>
<text x="70" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">PNG or JPEG</text>
<text x="70" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stored as sRGB</text>
<line x1="121" y1="98" x2="143" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<rect x="144" y="56" width="100" height="84" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
<text x="194" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Texture</text>
<text x="194" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colorSpace =</text>
<text x="194" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">SRGBColorSpace</text>
<line x1="245" y1="98" x2="267" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<rect x="268" y="56" width="100" height="84" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.8"/>
<text x="318" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Working space</text>
<text x="318" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">linear sRGB</text>
<text x="318" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">lighting maths</text>
<line x1="369" y1="98" x2="391" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<rect x="392" y="56" width="100" height="84" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
<text x="442" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Tone mapping</text>
<text x="442" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">toneMapping</text>
<text x="442" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and exposure</text>
<line x1="493" y1="98" x2="515" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<rect x="516" y="56" width="100" height="84" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
<text x="566" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Output encode</text>
<text x="566" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sRGB transfer</text>
<text x="566" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">curve applied</text>
<line x1="617" y1="98" x2="639" y2="98" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<rect x="640" y="56" width="100" height="84" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.8"/>
<text x="690" y="78" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Display</text>
<text x="690" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">browser canvas</text>
<text x="690" y="117" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">expects sRGB</text>
<text x="70" y="158" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">set by you</text>
<text x="194" y="158" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">decoded by the GPU</text>
<text x="318" y="158" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">ColorManagement</text>
<text x="442" y="158" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">screen only</text>
<text x="566" y="158" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">outputColorSpace</text>
<text x="380" y="196" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">The same pixel, followed through the chain (value 0.5 in the image, a light that halves it)</text>
<rect x="10" y="212" width="740" height="86" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="26" y="232" font-size="12" font-weight="bold" fill="#047857" text-anchor="start">Colour-managed (default since r152)</text>
<rect x="18" y="244" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="70" y="262" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">0.50 sRGB</text>
<rect x="142" y="244" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="194" y="262" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">0.214 linear</text>
<rect x="266" y="244" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="318" y="262" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">x 0.5 = 0.107</text>
<rect x="514" y="244" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="566" y="262" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">0.36 sRGB</text>
<line x1="124" y1="257" x2="140" y2="257" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<line x1="248" y1="257" x2="264" y2="257" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<line x1="372" y1="257" x2="514" y2="257" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<text x="642" y="262" font-size="11" font-weight="normal" fill="#047857" text-anchor="start">looks half as bright</text>
<text x="380" y="288" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">decode, multiply in linear light, encode: physically plausible dimming</text>
<rect x="10" y="310" width="740" height="86" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="26" y="330" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">Colour spaces ignored (the pre-r152 habit)</text>
<rect x="18" y="342" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="70" y="360" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">0.50 sRGB</text>
<rect x="514" y="342" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="566" y="360" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">0.25 shown</text>
<line x1="124" y1="355" x2="512" y2="355" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-tjs-tex-pipeline)"/>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">x 0.5 on encoded values</text>
<text x="642" y="360" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">too dark, banding</text>
<text x="380" y="386" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">maths on encoded values gives wrong blends, dark falloff and washed-out or crushed colour</text>
</svg>
