<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Quick Flow: from one shape to a connected flow</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="48" width="236" height="180" rx="10"/><rect x="262" y="48" width="236" height="180" rx="10"/><rect x="512" y="48" width="236" height="180" rx="10"/></g>
  <!-- A -->
  <rect x="80" y="110" width="100" height="44" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="130" y="137" font-size="12" fill="#1F2937" text-anchor="middle">Pick a book</text>
  <g fill="#B45309"><path d="M130,96 L124,106 L136,106 Z"/><path d="M130,168 L124,158 L136,158 Z"/><path d="M66,132 L76,126 L76,138 Z"/><path d="M194,132 L184,126 L184,138 Z"/></g>
  <text x="130" y="206" font-size="12" fill="#374151" text-anchor="middle">Arrows appear around the shape</text>
  <!-- B -->
  <rect x="300" y="68" width="100" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="350" y="92" font-size="12" fill="#1F2937" text-anchor="middle">Pick a book</text>
  <path d="M350,108 L350,132" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="300" y="134" width="100" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="158" font-size="12" fill="#6B7280" text-anchor="middle">Preview</text>
  <text x="380" y="206" font-size="12" fill="#374151" text-anchor="middle">Click an arrow to add a next step</text>
  <!-- C -->
  <g fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"><rect x="530" y="66" width="80" height="34" rx="6"/><rect x="530" y="128" width="80" height="34" rx="6"/><rect x="650" y="128" width="80" height="34" rx="6"/></g>
  <g font-size="11" fill="#1F2937" text-anchor="middle"><text x="570" y="88">Pick a book</text><text x="570" y="150">Write post</text><text x="690" y="150">Schedule</text></g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M570,100 L570,127" marker-end="url(#ah)"/><path d="M610,145 L649,145" marker-end="url(#ah)"/></g>
  <text x="630" y="206" font-size="12" fill="#374151" text-anchor="middle">Shapes and lines stay connected</text>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M249,138 L261,138" marker-end="url(#ah)"/><path d="M499,138 L511,138" marker-end="url(#ah)"/></g>
  <g fill="#4F46E5"><circle cx="30" cy="66" r="11"/><circle cx="280" cy="66" r="11"/></g><circle cx="530" cy="40" r="0" fill="none"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="70">1</text><text x="280" y="70">2</text></g>
  <circle cx="730" cy="66" r="11" fill="#B45309"/><text x="730" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="380" y="282" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic whiteboard, not a screenshot of any product.</text>
</svg>
