<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Content categories: the most restrictive one wins</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <rect x="40" y="56" width="560" height="56" rx="10" fill="#FEF3C7" stroke="#B45309"/>
    <rect x="40" y="124" width="560" height="56" rx="10" fill="#FEF3C7" stroke="#B45309"/>
    <rect x="40" y="192" width="560" height="56" rx="10" fill="#EEF2FF"/>
    <rect x="40" y="260" width="560" height="56" rx="10" fill="#EEF2FF"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937">
    <text x="58" y="80">Education Content</text>
    <text x="58" y="148">Branded Content</text>
    <text x="58" y="216">Pro Content</text>
    <text x="58" y="284">Free Content</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="58" y="98">Educational, non-commercial use only</text>
    <text x="58" y="166">Personal use unless the source information says otherwise</text>
    <text x="58" y="234">One Design Use licence, no standalone download</text>
    <text x="58" y="302">Fewest limits, may be reused in more than one design</text>
  </g>
  <path d="M640,300 L640,72" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="652" y="190" font-size="12" fill="#374151">more</text>
  <text x="652" y="206" font-size="12" fill="#374151">restrictive</text>
  <rect x="40" y="328" width="560" height="26" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="320" y="346" font-size="12" fill="#1F2937" text-anchor="middle">A design mixing categories follows the strictest one it contains</text>
  <text x="380" y="372" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
