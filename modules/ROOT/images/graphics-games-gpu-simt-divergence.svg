<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gpu-simt-divergence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">SIMT: one instruction stream, many lanes, and branch divergence</text>
<text x="380" y="56" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="middle">Eight lanes shown; real hardware runs 32 or 64 lanes together (warp, wave, SIMD-group)</text>
