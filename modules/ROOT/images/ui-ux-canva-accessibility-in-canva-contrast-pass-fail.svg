<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Text and background pairs: fail and pass</text>
  <rect x="24" y="50" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="386" y="50" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="199" y="76" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Fails: ratio below 4.5 to 1</text>
  <text x="561" y="76" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">Passes: ratio of 4.5 to 1 or more</text>
  <rect x="44" y="92" width="310" height="70" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="130" font-size="22" font-weight="bold" fill="#9CA3AF">Book of the week</text>
  <text x="60" y="152" font-size="12" fill="#374151">Grey #9CA3AF on white: 2.54 to 1</text>
  <rect x="44" y="176" width="310" height="70" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="214" font-size="22" font-weight="bold" fill="#FBBF24">Read it this week</text>
  <text x="60" y="236" font-size="12" fill="#374151">Yellow #FBBF24 on white: 1.67 to 1</text>
  <rect x="44" y="260" width="310" height="70" rx="6" fill="#EEF2FF" stroke="#D1D5DB"/>
  <text x="60" y="298" font-size="22" font-weight="bold" fill="#A5B4FC">Join the club</text>
  <text x="60" y="320" font-size="12" fill="#374151">Pale indigo #A5B4FC on tint #EEF2FF: 1.78 to 1</text>
  <rect x="406" y="92" width="310" height="70" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="422" y="130" font-size="22" font-weight="bold" fill="#1F2937">Book of the week</text>
  <text x="422" y="152" font-size="12" fill="#374151">Ink #1F2937 on white: 14.68 to 1</text>
  <rect x="406" y="176" width="310" height="70" rx="6" fill="#4F46E5"/>
  <text x="422" y="214" font-size="22" font-weight="bold" fill="#FFFFFF">Read it this week</text>
  <text x="422" y="236" font-size="12" fill="#FFFFFF">White on indigo #4F46E5: 6.29 to 1</text>
  <rect x="406" y="260" width="310" height="70" rx="6" fill="#FEF3C7" stroke="#D1D5DB"/>
  <text x="422" y="298" font-size="22" font-weight="bold" fill="#92400E">Join the club</text>
  <text x="422" y="320" font-size="12" fill="#374151">Brown #92400E on amber tint #FEF3C7: 6.37 to 1</text>
  <text x="380" y="374" font-size="12" fill="#374151" text-anchor="middle">Ratios are computed with the WCAG relative luminance formula for these example colours.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of generic colour pairs, not a screenshot of any product.</text>
