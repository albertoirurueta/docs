<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="tfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="tfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="tfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Tangent frame at a vertex: tangent, bitangent and normal</text>
<polygon points="140,250 520,250 640,160 260,160" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="210" y="205" text-anchor="middle" font-size="12" fill="#3730A3">surface</text>
<path d="M 150 240 L 500 240" stroke="#E5E7EB" stroke-width="1"/>
<circle cx="390.0" cy="205.0" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<line x1="390.0" y1="205.0" x2="510.0" y2="205.0" stroke="#B45309" stroke-width="2.5" marker-end="url(#tfw)"/>
<text x="516" y="209" text-anchor="start" font-size="12" fill="#92400E">T (along +u)</text>
<line x1="390.0" y1="205.0" x2="440.0" y2="165.0" stroke="#047857" stroke-width="2.5" marker-end="url(#tfg)"/>
<text x="446" y="157" text-anchor="start" font-size="12" fill="#047857">B (along +v)</text>
<line x1="390.0" y1="205.0" x2="390.0" y2="95.0" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#tfa)"/>
<text x="382" y="89" text-anchor="end" font-size="12" fill="#3730A3">N (normal)</text>
<rect x="40" y="60" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="155" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">TBN matrix columns T, B, N</text>
<text x="155" y="102" text-anchor="middle" font-size="11" fill="#374151">tangent space to world space</text>
<text x="155" y="118" text-anchor="middle" font-size="11" fill="#374151">normalWS = TBN * (2 * texel - 1)</text>
<text x="380" y="302" text-anchor="middle" font-size="11" fill="#374151">Bitangent is stored as one sign (the w of a vec4 tangent): B = cross(N, T.xyz) * T.w; glTF defines it this way.</text>
</svg>
