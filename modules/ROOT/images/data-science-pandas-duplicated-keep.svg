<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="t d">
<title id="t">Which rows duplicated() flags for each keep value</title>
<desc id="d">Five rows with ids 7, 7, 9, 7, 9. With keep first the later repeats are flagged, with keep last the earlier ones are flagged, and with keep False every member of a repeated group is flagged.</desc>
