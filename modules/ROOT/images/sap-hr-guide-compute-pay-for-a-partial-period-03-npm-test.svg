<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 507" width="1080" height="507" role="img" aria-labelledby="sap-hr-guide-compute-pay-for-a-partial-period-03-npm-test-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-compute-pay-for-a-partial-period-03-npm-test-title">Terminal after npm test in the payroll-period project: the nine tests pass, among them the rounding rule, the working days, the full month of Ana, the three methods for Ben and the rejection of wrong input; the summary reads pass 9 and fail 0; callout 7 marks the command</title>
<g><rect x="0" y="0" width="1080" height="507" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="475" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm test</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&gt; payroll-period@1.0.0 test</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&gt; node --test</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ the rounding rule rounds half up to the cent (132.268041ms)</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ working days are Monday to Friday, public holidays ignored (0.214125ms)</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ a full month gives Ana the payslip of the reference pages (29.426834ms)</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ five unpaid days give three different gross amounts (7.583917ms)</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ gross to net for Ben with PWS and a voluntary deduction (2.413584ms)</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ the stored payslip lines add up from basic pay to payment (4.966209ms)</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ without absence the payment method pays above basic pay (2.132167ms)</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ a month split in two partial periods adds up only with PWS (11.136458ms)</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">✔ wrong input is rejected with a message (4.361667ms)</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ tests 9</text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ suites 0</text>
<text x="16" y="377" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ℹ pass 9</text>
<text x="16" y="398" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ fail 0</text>
<text x="16" y="419" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ cancelled 0</text>
<text x="16" y="440" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ skipped 0</text>
<text x="16" y="461" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ todo 0</text>
