<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metalkit-mtkview-and-swiftui-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From a SwiftUI view to pixels on the display</text>
<rect x="20" y="50" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="120.0" y="74.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TriangleView</text>
<text x="120.0" y="89.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">a SwiftUI value</text>
<rect x="280" y="50" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="74.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">UIViewRepresentable</text>
<text x="380.0" y="89.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">NSViewRepresentable</text>
<rect x="540" y="50" width="200" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="74.0" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Coordinator</text>
<text x="640.0" y="89.0" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">owns the renderer strongly</text>
<line x1="220" y1="78" x2="280" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="480" y1="78" x2="540" y2="78" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<rect x="20" y="160" width="300" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="200.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">MTKView</text>
<text x="170.0" y="214.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">device, colorPixelFormat, depth format</text>
<text x="170.0" y="228.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">clearColor, sampleCount, framebufferOnly</text>
<text x="170.0" y="242.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">preferredFramesPerSecond, isPaused</text>
<text x="170.0" y="256.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">delegate (weak)</text>
<rect x="380" y="160" width="170" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="465.0" y="179.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Renderer</text>
<text x="465.0" y="193.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">MTKViewDelegate</text>
<text x="465.0" y="207.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">draw(in:)</text>
<rect x="380" y="235" width="170" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="465.0" y="259.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTL4CommandQueue</text>
<text x="465.0" y="273.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">or MTLCommandQueue</text>
<rect x="590" y="160" width="150" height="131" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="207.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU</text>
<text x="665.0" y="221.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">runs the pass</text>
<text x="665.0" y="235.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">writes the</text>
<text x="665.0" y="249.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">drawable texture</text>
<line x1="320" y1="190" x2="380" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<text x="350" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">calls</text>
<line x1="550" y1="190" x2="590" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="465" y1="220" x2="465" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="550" y1="263" x2="590" y2="263" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="140" y1="106" x2="140" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<text x="150" y="135" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">makeView</text>
<line x1="640" y1="106" x2="520" y2="160" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<text x="560" y="128" font-size="10" font-weight="normal" fill="#047857" text-anchor="middle">retains</text>
<rect x="20" y="330" width="300" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="354.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">CAMetalLayer (the layer behind the view)</text>
<text x="170.0" y="368.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">pixelFormat, drawableSize, colorspace</text>
<text x="170.0" y="382.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">maximumDrawableCount 2 or 3</text>
<rect x="380" y="330" width="170" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="465.0" y="354.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Drawable pool</text>
<text x="465.0" y="368.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">nextDrawable() blocks</text>
<text x="465.0" y="382.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">if all are in use</text>
<rect x="590" y="330" width="150" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="354.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Display</text>
<text x="665.0" y="368.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shows the drawable</text>
<text x="665.0" y="382.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">at the next refresh</text>
<line x1="170" y1="290" x2="170" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="320" y1="365" x2="380" y2="365" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<line x1="550" y1="365" x2="590" y2="365" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-layers)"/>
<text x="380" y="425" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTKView.delegate is weak: if only the delegate property holds the renderer, it is freed and nothing draws.</text>
</svg>
