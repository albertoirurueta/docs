<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="t">Shopify B2B data model</title>
  <desc id="d">A company has many locations and many contacts. A contact is linked to a customer record. A role assignment joins one contact, one location and one role. A location holds addresses, tax settings, buyer experience settings with payment terms and a deposit, and the catalogs assigned to it. Orders and draft orders point to a purchasing company made of company, location and contact.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="700">B2B objects in the Admin GraphQL API</text>

  <!-- Company -->
  <rect x="270" y="48" width="220" height="62" rx="8" fill="#5b8def" fill-opacity="0.18" stroke="#5b8def" stroke-width="1.8"/>
  <text x="380" y="72" font-size="14" font-weight="700" text-anchor="middle">Company</text>
  <text x="380" y="92" font-size="11.5" text-anchor="middle" fill-opacity="0.85">name, externalId, note, mainContact</text>

  <!-- Contact -->
  <rect x="20" y="170" width="220" height="86" rx="8" fill="#5b8def" fill-opacity="0.18" stroke="#5b8def" stroke-width="1.8"/>
  <text x="130" y="194" font-size="14" font-weight="700" text-anchor="middle">CompanyContact</text>
  <text x="130" y="214" font-size="11.5" text-anchor="middle" fill-opacity="0.85">title, locale, isMainContact</text>
  <text x="130" y="234" font-size="11.5" text-anchor="middle" fill-opacity="0.85">belongs to one Customer record</text>

  <!-- Location -->
  <rect x="520" y="170" width="220" height="86" rx="8" fill="#5b8def" fill-opacity="0.18" stroke="#5b8def" stroke-width="1.8"/>
  <text x="630" y="194" font-size="14" font-weight="700" text-anchor="middle">CompanyLocation</text>
  <text x="630" y="214" font-size="11.5" text-anchor="middle" fill-opacity="0.85">billing and shipping address, currency</text>
  <text x="630" y="234" font-size="11.5" text-anchor="middle" fill-opacity="0.85">externalId, locale, note</text>

  <!-- Role assignment -->
  <rect x="270" y="170" width="220" height="86" rx="8" fill="#e0902f" fill-opacity="0.16" stroke="#e0902f" stroke-width="1.8"/>
  <text x="380" y="194" font-size="14" font-weight="700" text-anchor="middle">RoleAssignment</text>
  <text x="380" y="214" font-size="11.5" text-anchor="middle" fill-opacity="0.85">contact + location + role</text>
  <text x="380" y="234" font-size="11.5" text-anchor="middle" fill-opacity="0.85">required before the contact can order</text>

  <!-- Location details -->
  <rect x="520" y="300" width="220" height="64" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="630" y="322" font-size="13" font-weight="700" text-anchor="middle">taxSettings</text>
  <text x="630" y="342" font-size="11.5" text-anchor="middle" fill-opacity="0.85">taxExempt, exemptions, registration ID</text>

  <rect x="270" y="300" width="220" height="64" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="380" y="322" font-size="13" font-weight="700" text-anchor="middle">buyerExperienceConfiguration</text>
  <text x="380" y="342" font-size="11.5" text-anchor="middle" fill-opacity="0.85">payment terms, deposit, checkoutToDraft</text>

  <rect x="20" y="300" width="220" height="64" rx="8" fill="#3aa57a" fill-opacity="0.16" stroke="#3aa57a" stroke-width="1.8"/>
  <text x="130" y="322" font-size="13" font-weight="700" text-anchor="middle">CompanyLocationCatalog</text>
  <text x="130" y="342" font-size="11.5" text-anchor="middle" fill-opacity="0.85">price list + publication, many per location</text>

  <!-- Orders -->
  <rect x="20" y="404" width="720" height="48" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="426" font-size="13" font-weight="700" text-anchor="middle">Order and DraftOrder: purchasingEntity = PurchasingCompany</text>
  <text x="380" y="444" font-size="11.5" text-anchor="middle" fill-opacity="0.85">company + location + contact; catalogs attach to the location only</text>

  <!-- connectors -->
  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M330,110 L170,170"/>
    <path d="M430,110 L590,170"/>
    <path d="M380,110 L380,170"/>
    <path d="M240,213 L270,213"/>
    <path d="M490,213 L520,213"/>
    <path d="M630,256 L630,300"/>
    <path d="M560,256 L430,300"/>
    <path d="M590,256 L190,300"/>
  </g>
  <g font-size="11" fill-opacity="0.85">
    <text x="228" y="132" text-anchor="end">1..n contacts</text>
    <text x="540" y="132">1..n locations</text>
  </g>
</svg>
