<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Array API dispatch in scikit-learn</title>
<desc id="d">Arrays from NumPy, PyTorch or CuPy enter a scikit-learn estimator that has array API support. Two switches must be on: the SCIPY_ARRAY_API environment variable and the array_api_dispatch configuration. The fitted attributes and results come back in the namespace and on the device of X.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Array API dispatch: the data decides the namespace</text>

<rect x="20" y="62" width="170" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="88" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">numpy.ndarray</text>
<text x="105" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">CPU only</text>
<rect x="20" y="146" width="170" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="172" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">torch.Tensor</text>
<text x="105" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">CPU, CUDA, MPS, XPU</text>
<rect x="20" y="230" width="170" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="256" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">cupy.ndarray</text>
<text x="105" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">CUDA</text>

<rect x="250" y="62" width="220" height="232" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Two switches</text>
<text x="360" y="118" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">SCIPY_ARRAY_API=1</text>
<text x="360" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">before importing scipy</text>
<text x="360" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">or scikit-learn</text>
<line x1="270" y1="168" x2="450" y2="168" stroke="#94A3B8" stroke-width="1.5"/>
<text x="360" y="192" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">array_api_dispatch=True</text>
<text x="360" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">set_config or</text>
<text x="360" y="227" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">config_context</text>
<line x1="270" y1="242" x2="450" y2="242" stroke="#94A3B8" stroke-width="1.5"/>
<text x="360" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Off: arrays are converted</text>
<text x="360" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">with numpy.asarray</text>

<rect x="530" y="62" width="170" height="120" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="615" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Estimator with</text>
<text x="615" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">array API support</text>
<text x="615" y="132" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">Ridge(solver="svd")</text>
<text x="615" y="150" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">StandardScaler</text>
<text x="615" y="168" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">LogisticRegression</text>

<rect x="530" y="214" width="170" height="80" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="615" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Same namespace</text>
<text x="615" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">and device as X</text>
<text x="615" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">attributes and outputs</text>

<line x1="190" y1="94" x2="248" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="190" y1="178" x2="248" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="190" y1="262" x2="248" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="150" x2="528" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="615" y1="182" x2="615" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

<circle cx="20" cy="62" r="11" fill="#0F172A"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="250" cy="62" r="11" fill="#0F172A"/><text x="250" y="67" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="530" cy="62" r="11" fill="#0F172A"/><text x="530" y="67" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="530" cy="214" r="11" fill="#0F172A"/><text x="530" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
