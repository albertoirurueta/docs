<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
  <title id="t">Layers of spam protection in front of a Drupal form</title>
  <desc id="d">A visitor request passes Antibot, Honeypot and CAPTCHA checks before the Contact or Webform handler runs and a flood limit applies.</desc>
  <rect width="760" height="260" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <rect x="10" y="90" width="100" height="70" rx="8" fill="#eef2f7" stroke="#34495e" stroke-width="2"/>
    <text x="60" y="121" fill="#1b2a38">Visitor or</text><text x="60" y="140" fill="#1b2a38">bot</text>
    <rect x="150" y="90" width="110" height="70" rx="8" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="205" y="121" fill="#1b2a38">Antibot</text><text x="205" y="140" fill="#1b2a38">form key</text>
    <rect x="290" y="90" width="110" height="70" rx="8" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="345" y="121" fill="#1b2a38">Honeypot</text><text x="345" y="140" fill="#1b2a38">field + timer</text>
    <rect x="430" y="90" width="110" height="70" rx="8" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="485" y="121" fill="#1b2a38">CAPTCHA</text><text x="485" y="140" fill="#1b2a38">challenge</text>
    <rect x="570" y="90" width="170" height="70" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
    <text x="655" y="115" fill="#1b2a38">Contact message</text><text x="655" y="134" fill="#1b2a38">or Webform handlers</text><text x="655" y="152" fill="#1b2a38">(flood limit)</text>
    <g stroke="#34495e" stroke-width="2" fill="none"><path d="M110 125H146"/><path d="M260 125H286"/><path d="M400 125H426"/><path d="M540 125H566"/></g>
    <g fill="#34495e"><path d="M146 120l8 5-8 5z"/><path d="M286 120l8 5-8 5z"/><path d="M426 120l8 5-8 5z"/><path d="M566 120l8 5-8 5z"/></g>
    <text x="380" y="200" fill="#1b2a38">Each layer rejects requests early; combine cheap, invisible layers first.</text>
  </g>
</svg>
