<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 652" width="860" height="652" role="img" aria-labelledby="backend-downloads-other-t backend-downloads-other-d">
<title id="backend-downloads-other-t">Downloads on other registries (each panel has its own unit and axis)</title>
<desc id="backend-downloads-other-d">NuGet and RubyGems publish only totals; crates.io and Hex publish recent downloads. Registries are never compared on one axis.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="860" height="652" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Downloads on other registries (each panel has its own unit and axis)</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Downloads</text></g></g><text x="24" y="94" font-weight="600">NuGet: total downloads</text><text class="muted" x="24" y="109" text-anchor="start"><tspan x="24" dy="0">Packages related to ASP.NET; the ASP.NET Core runtime ships with the .NET SDK, so App.Ref is a proxy</tspan></text><line class="grid" x1="150" y1="125" x2="150" y2="245"/><text class="muted" x="150" y="260" text-anchor="middle" font-size="11">0</text><line class="grid" x1="363.33" y1="125" x2="363.33" y2="245"/><text class="muted" x="363.33" y="260" text-anchor="middle" font-size="11">200</text><line class="grid" x1="576.67" y1="125" x2="576.67" y2="245"/><text class="muted" x="576.67" y="260" text-anchor="middle" font-size="11">400</text><line class="grid" x1="790" y1="125" x2="790" y2="245"/><text class="muted" x="790" y="260" text-anchor="middle" font-size="11">600</text><path class="axis" d="M150 125V245H790"/><text x="142" y="141" text-anchor="end">ASP.NET Core (Microsoft.AspNetCore.App.Ref)</text><rect class="f0" x="150" y="129" width="632.52" height="16"/><text class="muted" x="787.52" y="141">593M</text><text x="142" y="165" text-anchor="end">ASP.NET Core (Microsoft.AspNetCore.Mvc.Testing)</text><rect class="f0" x="150" y="153" width="458.98" height="16"/><text class="muted" x="613.98" y="165">430.3M</text><text x="142" y="189" text-anchor="end">ASP.NET MVC 5 (Microsoft.AspNet.WebApi.Core)</text><rect class="f0" x="150" y="177" width="440.91" height="16"/><text class="muted" x="595.91" y="189">413.4M</text><text x="142" y="213" text-anchor="end">ASP.NET MVC 5 (Microsoft.AspNet.Mvc)</text><rect class="f0" x="150" y="201" width="336.73" height="16"/><text class="muted" x="491.73" y="213">315.7M</text><text x="142" y="237" text-anchor="end">ASP.NET Core (Microsoft.AspNetCore.OpenApi)</text><rect class="f0" x="150" y="225" width="289.05" height="16"/><text class="muted" x="444.05" y="237">271M</text><text x="24" y="289" font-weight="600">crates.io: downloads in the last 90 days</text><line class="grid" x1="150" y1="307" x2="150" y2="403"/><text class="muted" x="150" y="418" text-anchor="middle" font-size="11">0</text><line class="grid" x1="363.33" y1="307" x2="363.33" y2="403"/><text class="muted" x="363.33" y="418" text-anchor="middle" font-size="11">50</text><line class="grid" x1="576.67" y1="307" x2="576.67" y2="403"/><text class="muted" x="576.67" y="418" text-anchor="middle" font-size="11">100</text><line class="grid" x1="790" y1="307" x2="790" y2="403"/><text class="muted" x="790" y="418" text-anchor="middle" font-size="11">150</text><path class="axis" d="M150 307V403H790"/><text x="142" y="323" text-anchor="end">axum (axum)</text><rect class="f0" x="150" y="311" width="608.92" height="16"/><text class="muted" x="763.92" y="323">142.7M</text><text x="142" y="347" text-anchor="end">Actix Web (actix-web)</text><rect class="f0" x="150" y="335" width="53.11" height="16"/><text class="muted" x="208.11" y="347">12.4M</text><text x="142" y="371" text-anchor="end">Rocket (rocket)</text><rect class="f0" x="150" y="359" width="9.62" height="16"/><text class="muted" x="164.62" y="371">2.3M</text><text x="142" y="395" text-anchor="end">Loco (loco-rs)</text><rect class="f0" x="150" y="383" width="1" height="16"/><text class="muted" x="155.59" y="395">0.1M</text><text x="24" y="447" font-weight="600">Hex: downloads in the last 90 days</text><line class="grid" x1="150" y1="465" x2="150" y2="489"/><text class="muted" x="150" y="504" text-anchor="middle" font-size="11">0</text><line class="grid" x1="363.33" y1="465" x2="363.33" y2="489"/><text class="muted" x="363.33" y="504" text-anchor="middle" font-size="11">2</text><line class="grid" x1="576.67" y1="465" x2="576.67" y2="489"/><text class="muted" x="576.67" y="504" text-anchor="middle" font-size="11">4</text><line class="grid" x1="790" y1="465" x2="790" y2="489"/><text class="muted" x="790" y="504" text-anchor="middle" font-size="11">6</text><path class="axis" d="M150 465V489H790"/><text x="142" y="481" text-anchor="end">Phoenix (phoenix)</text><rect class="f0" x="150" y="469" width="628.22" height="16"/><text class="muted" x="783.22" y="481">5.9M</text><text x="24" y="533" font-weight="600">RubyGems: total downloads</text><line class="grid" x1="150" y1="551" x2="150" y2="575"/><text class="muted" x="150" y="590" text-anchor="middle" font-size="11">0</text><line class="grid" x1="278" y1="551" x2="278" y2="575"/><text class="muted" x="278" y="590" text-anchor="middle" font-size="11">200</text><line class="grid" x1="406" y1="551" x2="406" y2="575"/><text class="muted" x="406" y="590" text-anchor="middle" font-size="11">400</text><line class="grid" x1="534" y1="551" x2="534" y2="575"/><text class="muted" x="534" y="590" text-anchor="middle" font-size="11">600</text><line class="grid" x1="662" y1="551" x2="662" y2="575"/><text class="muted" x="662" y="590" text-anchor="middle" font-size="11">800</text><line class="grid" x1="790" y1="551" x2="790" y2="575"/><text class="muted" x="790" y="590" text-anchor="middle" font-size="11">1000</text><path class="axis" d="M150 551V575H790"/><text x="142" y="567" text-anchor="end">Ruby on Rails (rails)</text><rect class="f0" x="150" y="555" width="516.62" height="16"/><text class="muted" x="671.62" y="567">807.2M</text><text class="axis-label" x="470" y="607" text-anchor="middle">Downloads (millions)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="631" text-anchor="start"><tspan x="24" dy="0">Sources: crates-io, hex, nuget-search, rubygems (see the Bibliography). Data as of 2026-10-27.</tspan></text>
</svg>
