<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three ways to authenticate a REST API call</text>

<rect x="20" y="48" width="220" height="200" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="38" cy="66" r="11" fill="#4F46E5"/><text x="38" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="56" y="71" font-size="14" font-weight="bold" fill="#3730A3">Personal access token</text>
<text x="34" y="98" font-size="12" fill="#374151">Acts as the person who made it</text>
<text x="34" y="120" font-size="12" fill="#374151">Created in Settings, Security</text>
<text x="34" y="142" font-size="12" fill="#374151">Scopes and expiry chosen once</text>
<text x="34" y="164" font-size="12" fill="#374151">Shown only once: copy it</text>
<text x="34" y="190" font-size="12" font-weight="bold" fill="#3730A3">Header: X-Figma-Token</text>
<text x="34" y="228" font-size="12" fill="#374151">Best for: your own scripts</text>

<rect x="260" y="48" width="220" height="200" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<circle cx="278" cy="66" r="11" fill="#B45309"/><text x="278" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="296" y="71" font-size="14" font-weight="bold" fill="#92400E">OAuth app</text>
<text x="274" y="98" font-size="12" fill="#374151">Acts for each user who approves</text>
<text x="274" y="120" font-size="12" fill="#374151">Authorization code, then token</text>
<text x="274" y="142" font-size="12" fill="#374151">Refresh token renews access</text>
<text x="274" y="164" font-size="12" fill="#374151">Draft, private or public app</text>
<text x="274" y="190" font-size="12" font-weight="bold" fill="#92400E">Header: Authorization: Bearer</text>
<text x="274" y="228" font-size="12" fill="#374151">Best for: products for other people</text>

<rect x="500" y="48" width="220" height="200" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<circle cx="518" cy="66" r="11" fill="#047857"/><text x="518" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="536" y="71" font-size="14" font-weight="bold" fill="#065F46">Plan access token</text>
<text x="514" y="98" font-size="12" fill="#374151">Tied to the plan, not a person</text>
<text x="514" y="120" font-size="12" fill="#374151">Organization and Enterprise</text>
<text x="514" y="142" font-size="12" fill="#374151">Admin-managed, optional allowlist</text>
<text x="514" y="164" font-size="12" fill="#374151">Expires after up to 365 days</text>
<text x="514" y="190" font-size="12" font-weight="bold" fill="#065F46">Header: X-Figma-Token</text>
<text x="514" y="228" font-size="12" fill="#374151">Best for: shared automation</text>

<rect x="20" y="268" width="700" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="370" y="287" text-anchor="middle" font-size="12" fill="#374151">All three are limited by scopes such as file_content:read; keep the secret in the environment (FIGMA_TOKEN),</text>
<text x="370" y="304" text-anchor="middle" font-size="12" fill="#374151">never in the repository or in a design file.</text>
</svg>
