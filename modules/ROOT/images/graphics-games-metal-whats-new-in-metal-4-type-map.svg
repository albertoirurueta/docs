<svg viewBox="0 0 760 520" width="760" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-whats-new-in-metal-4-type-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal 3 types and their Metal 4 counterparts</text>
<text x="190" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal 3 and earlier (MTL...)</text>
<text x="570" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal 4 (MTL4..., 26 OSes)</text>
<rect x="30" y="72" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="97.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLCommandQueue</text>
<rect x="410" y="72" width="320" height="42" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="97.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4CommandQueue</text>
<line x1="350" y1="93.0" x2="410" y2="93.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="122" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="139.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLCommandBuffer</text>
<text x="190.0" y="154.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">one per frame, made by the queue</text>
<rect x="410" y="122" width="320" height="42" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="139.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4CommandBuffer</text>
<text x="570.0" y="154.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">reusable, made by the device</text>
<line x1="350" y1="143.0" x2="410" y2="143.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="172" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="197.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">implicit memory for commands</text>
<rect x="410" y="172" width="320" height="42" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="189.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">MTL4CommandAllocator</text>
<text x="570.0" y="204.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">you reset it once per frame</text>
<line x1="350" y1="193.0" x2="410" y2="193.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="222" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="247.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLRenderCommandEncoder</text>
<rect x="410" y="222" width="320" height="42" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="247.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4RenderCommandEncoder</text>
<line x1="350" y1="243.0" x2="410" y2="243.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="272" width="320" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="285.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLComputeCommandEncoder</text>
<text x="190.0" y="300.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLBlitCommandEncoder</text>
<text x="190.0" y="315.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLAccelerationStructure-</text>
<text x="190.0" y="330.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CommandEncoder</text>
<rect x="410" y="272" width="320" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="300.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">MTL4ComputeCommandEncoder</text>
<text x="570.0" y="315.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">one encoder for all three jobs</text>
<line x1="350" y1="304.0" x2="410" y2="304.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="344" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="361.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">setBuffer / setTexture on</text>
<text x="190.0" y="376.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">every encoder</text>
<rect x="410" y="344" width="320" height="42" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="361.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">MTL4ArgumentTable</text>
<text x="570.0" y="376.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">bound per stage</text>
<line x1="350" y1="365.0" x2="410" y2="365.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="394" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="411.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">library and pipeline calls on</text>
<text x="190.0" y="426.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLDevice</text>
<rect x="410" y="394" width="320" height="42" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="411.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4Compiler</text>
<text x="570.0" y="426.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">explicit compile contexts</text>
<line x1="350" y1="415.0" x2="410" y2="415.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<rect x="30" y="444" width="320" height="42" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="469.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Core ML outside Metal</text>
<rect x="410" y="444" width="320" height="42" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="461.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">MTL4MachineLearningCommandEncoder</text>
<text x="570.0" y="476.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">networks inside the frame</text>
<line x1="350" y1="465.0" x2="410" y2="465.0" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-whats-new-in-metal-4-type-map)"/>
<text x="380" y="508" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Both families can be used in one app: MTLDevice vends both, and shared resources work with either.</text>
</svg>
