<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Headless architecture of the Lumen Press reader app</title>
  <desc id="d">WordPress at lumenpress.example keeps the editors, the block editor, the REST API, the database and the uploads. The Next.js reader app at reader.lumenpress.example fetches published books server-side from the REST API anonymously and caches them under the lp_book tag; on save, the lumen-catalog plugin sends a signed webhook to the reader's revalidate route. Editors who press Preview in WordPress are redirected with a short-lived signed token to the reader's preview route, which enables Draft Mode and fetches the draft with an application password, uncached. Covers are optimised by next/image from the WordPress uploads directory only. Readers reach the app through a CDN; their browsers never hold WordPress credentials, and CORS allows only the reader origin.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8eef4"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="12" fill="#2b3a4a"/>

  <g font-size="14" font-weight="bold" fill="#e8eef4">
    <text x="20" y="30">WordPress: lumenpress.example</text>
    <text x="420" y="30">Next.js reader: reader.lumenpress.example</text>
  </g>

  <!-- WordPress column -->
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="44" width="320" height="76" rx="8" fill="#cfe3f7"/>
    <text x="32" y="66" font-weight="bold">REST API /wp-json/wp/v2/lp_book</text>
    <text x="32" y="86">_embed=wp:featuredmedia, _fields=...</text>
    <text x="32" y="104">/lp_book/&lt;id&gt;/autosaves for previews</text>

    <rect x="20" y="138" width="320" height="96" rx="8" fill="#d7ecd9"/>
    <text x="32" y="160" font-weight="bold">lumen-catalog: Lumen\Catalog\Headless</text>
    <text x="32" y="180">save_post_lp_book: queue, send on shutdown</text>
    <text x="32" y="198">template_redirect: preview hand-off</text>
    <text x="32" y="216">rest_pre_serve_request: CORS allow-list</text>

    <rect x="20" y="252" width="320" height="56" rx="8" fill="#fbe5c8"/>
    <text x="32" y="274" font-weight="bold">Editors in wp-admin and the block editor</text>
    <text x="32" y="294">write books, press Preview, publish</text>

    <rect x="20" y="326" width="152" height="56" rx="8" fill="#e5e0f5"/>
    <text x="32" y="348" font-weight="bold">MariaDB</text>
    <text x="32" y="368">posts, meta, users</text>
    <rect x="188" y="326" width="152" height="56" rx="8" fill="#e5e0f5"/>
    <text x="200" y="348" font-weight="bold">wp-content/uploads</text>
    <text x="200" y="368">book covers</text>
  </g>

  <!-- Next.js column -->
  <g font-size="12" fill="#1b2733">
    <rect x="420" y="44" width="320" height="76" rx="8" fill="#cfe3f7"/>
    <text x="432" y="66" font-weight="bold">/books, /books/[slug], sitemap.xml</text>
    <text x="432" y="86">pre-rendered, cached under tag lp_book</text>
    <text x="432" y="104">revalidate: 3600 as a fallback</text>

    <rect x="420" y="138" width="320" height="56" rx="8" fill="#d7ecd9"/>
    <text x="432" y="160" font-weight="bold">POST /api/revalidate</text>
    <text x="432" y="180">checks the HMAC, revalidateTag('lp_book')</text>

    <rect x="420" y="212" width="320" height="96" rx="8" fill="#fbe5c8"/>
    <text x="432" y="234" font-weight="bold">GET /api/preview (signed, 5 minutes)</text>
    <text x="432" y="254">draftMode().enable(), then</text>
    <text x="432" y="272">/preview/books/[id]: application password,</text>
    <text x="432" y="290">cache: 'no-store', noindex</text>

    <rect x="420" y="326" width="320" height="56" rx="8" fill="#e5e0f5"/>
    <text x="432" y="348" font-weight="bold">/_next/image (next/image)</text>
    <text x="432" y="368">remotePatterns: uploads directory only</text>
  </g>

  <!-- arrows between columns -->
  <g stroke="#e8eef4" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M418,70 L342,70"/>
    <path d="M342,166 L418,166"/>
    <path d="M342,280 L418,280"/>
    <path d="M418,240 L396,240 L396,104 L342,104"/>
    <path d="M418,354 L342,354"/>
  </g>
  <g font-size="11" fill="#e8eef4">
    <text x="350" y="62">1 GET</text>
    <text x="346" y="158">2 webhook</text>
    <text x="346" y="272">3 preview</text>
    <text x="400" y="126">4</text>
    <text x="350" y="346">5 covers</text>
  </g>

  <!-- readers -->
  <g font-size="12" fill="#1b2733">
    <rect x="420" y="420" width="320" height="56" rx="8" fill="#cfe3f7"/>
    <text x="432" y="442" font-weight="bold">CDN</text>
    <text x="432" y="462">caches HTML, JS and optimised images</text>
    <rect x="420" y="490" width="320" height="52" rx="8" fill="#fbe5c8"/>
    <text x="432" y="512" font-weight="bold">Readers' browsers</text>
    <text x="432" y="530">no WordPress credentials, ever</text>
  </g>
  <g stroke="#e8eef4" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M580,418 L580,384"/>
    <path d="M580,488 L580,478"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#e8eef4">
    <text x="20" y="414" font-weight="bold">Flows</text>
    <text x="20" y="434">1 Server-side, anonymous fetch of published books</text>
    <text x="20" y="452">2 Signed POST after a book is saved (body HMAC)</text>
    <text x="20" y="470">3 Editor's Preview: redirect with id, expiry, signature</text>
    <text x="20" y="488">4 Draft and autosave fetch, Basic auth, never cached</text>
    <text x="20" y="506">5 Cover images fetched and resized by the reader</text>
    <text x="20" y="530">Secrets: READER_SECRET on both sides,</text>
    <text x="20" y="546">the application password only on the reader server</text>
  </g>
</svg>
