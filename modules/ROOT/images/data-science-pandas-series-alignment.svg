<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
<title>Series arithmetic aligns on labels</title>
<desc>Two Series with indexes a, b, c and b, c, d are added. The result has the union index a, b, c, d; labels present in only one operand give NaN.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">Series arithmetic aligns on labels</text>
<text x="60" y="80" font-size="14" font-weight="bold" fill="#0F172A">a</text>
<text x="60" y="180" font-size="14" font-weight="bold" fill="#0F172A">b</text>
<rect x="120" y="55" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="155.0" y="76.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">a</text>
<rect x="120" y="87" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="155.0" y="108.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<rect x="210" y="55" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="245.0" y="76.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">b</text>
<rect x="210" y="87" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="245.0" y="108.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<rect x="300" y="55" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="335.0" y="76.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">c</text>
<rect x="300" y="87" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="335.0" y="108.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<rect x="390" y="55" width="70" height="32" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="425.0" y="76.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A"></text>
<rect x="390" y="87" width="70" height="32" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="425.0" y="108.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">missing</text>
<rect x="120" y="155" width="70" height="32" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="155.0" y="176.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A"></text>
<rect x="120" y="187" width="70" height="32" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="155.0" y="208.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">missing</text>
<rect x="210" y="155" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="245.0" y="176.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">b</text>
<rect x="210" y="187" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="245.0" y="208.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">10</text>
<rect x="300" y="155" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="335.0" y="176.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">c</text>
<rect x="300" y="187" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="335.0" y="208.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">20</text>
<rect x="390" y="155" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="425.0" y="176.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">d</text>
<rect x="390" y="187" width="70" height="32" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="425.0" y="208.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">30</text>
<text x="60" y="280" font-size="14" font-weight="bold" fill="#0F172A">a + b</text>
<line x1="300" y1="228" x2="300" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="246" font-size="14" fill="#475569">union of both indexes, then add label by label</text>
<rect x="120" y="258" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="155.0" y="279.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">a</text>
<rect x="120" y="290" width="70" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="155.0" y="311.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">NaN</text>
<rect x="210" y="258" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="245.0" y="279.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">b</text>
<rect x="210" y="290" width="70" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="245.0" y="311.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">12.0</text>
<rect x="300" y="258" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="335.0" y="279.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">c</text>
<rect x="300" y="290" width="70" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="335.0" y="311.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">23.0</text>
<rect x="390" y="258" width="70" height="32" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="425.0" y="279.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">d</text>
<rect x="390" y="290" width="70" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="425.0" y="311.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">NaN</text>
<text x="60" y="360" font-size="12" fill="#475569">Only b and c exist in both operands. a.add(b, fill_value=0) treats a missing side as 0 and gives 1, 12, 23, 30.</text>
<text x="60" y="380" font-size="12" fill="#475569">The result dtype becomes float64 because NaN has no integer representation in the NumPy int64 dtype.</text>
</svg>
