<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="500" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Focus order on the Bookshelf review form</text>
<rect x="40" y="50" width="280" height="420" rx="14" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="180" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Leave a review</text>
<rect x="56" y="90" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="91" y="109" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Back</text>
<rect x="70" y="140" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="160" y="161" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Rating: 1 to 5 stars</text>
<rect x="56" y="196" width="248" height="96" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="180" y="248" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Review text</text>
<rect x="56" y="312" width="248" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="180" y="333" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Contains spoilers (toggle)</text>
<rect x="56" y="400" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="111" y="424" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Cancel</text>
<rect x="186" y="400" width="118" height="40" rx="8" fill="#4F46E5"/><text x="245" y="425" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Submit</text>
<circle cx="138" cy="105" r="11" fill="#B45309"/><text x="138" y="109" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="60" cy="157" r="11" fill="#B45309"/><text x="60" y="161" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="44" cy="208" r="11" fill="#B45309"/><text x="44" y="212" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="44" cy="329" r="11" fill="#B45309"/><text x="44" y="333" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="60" cy="420" r="11" fill="#B45309"/><text x="60" y="424" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="298" cy="420" r="11" fill="#B45309"/><text x="298" y="424" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="181" y="395" width="128" height="50" rx="11" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="360" y="64" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">Reading and Tab order</text>
<text x="360" y="88" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">1  Back</text>
<text x="360" y="110" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">2  Rating (one stop, arrow keys inside)</text>
<text x="360" y="132" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">3  Review text</text>
<text x="360" y="154" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">4  Contains spoilers toggle</text>
<text x="360" y="176" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">5  Cancel</text>
<text x="360" y="198" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">6  Submit (focus ring shown)</text>
<rect x="350" y="236" width="390" height="140" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="366" y="260" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">Annotation (Accessibility category)</text>
<text x="366" y="284" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Tab order: 1 to 6, top to bottom, Cancel before Submit.</text>
<text x="366" y="306" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Focus ring: 2px, 3:1 against the card and the button.</text>
<text x="366" y="328" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Ring must not be hidden by sticky bars or overlays.</text>
<text x="366" y="350" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Rating is one stop; Left and Right change the value.</text>
<path d="M310,320 L346,320" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="360" y="410" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">Layer order in the Layers panel = reading order</text>
<text x="360" y="430" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="start">in accessible prototypes. Reorder layers, not positions.</text>
<circle cx="350" cy="470" r="11" fill="#B45309"/><text x="350" y="474" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">F</text>
<text x="368" y="474" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">= focus item (amber); the ring is drawn on the Submit button</text>
</svg>
