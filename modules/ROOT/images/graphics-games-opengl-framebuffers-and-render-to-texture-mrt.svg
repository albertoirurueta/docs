<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-fbo-mrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Multiple render targets: one draw call, several images</text>
<rect x="20" y="60" width="220" height="190" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="130" y="84" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Fragment shader</text>
<text x="130" y="116" font-size="11" fill="#374151" text-anchor="middle">layout(location = 0) out vec4 o0;</text>
<text x="130" y="146" font-size="11" fill="#374151" text-anchor="middle">layout(location = 1) out vec4 o1;</text>
<text x="130" y="176" font-size="11" fill="#374151" text-anchor="middle">layout(location = 2) out vec4 o2;</text>
<text x="130" y="220" font-size="10" fill="#374151" text-anchor="middle">locations are output slots, not attachments</text>
<rect x="290" y="60" width="150" height="190" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="365" y="84" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Draw buffers</text>
<text x="365" y="104" font-size="10" fill="#374151" text-anchor="middle">glNamedFramebufferDrawBuffers</text>
<text x="365" y="130" font-size="11" fill="#374151" text-anchor="middle">slot 0 : COLOR_ATTACHMENT0</text>
<text x="365" y="160" font-size="11" fill="#374151" text-anchor="middle">slot 1 : COLOR_ATTACHMENT1</text>
<text x="365" y="190" font-size="11" fill="#374151" text-anchor="middle">slot 2 : COLOR_ATTACHMENT2</text>
<text x="365" y="225" font-size="10" fill="#374151" text-anchor="middle">GL_NONE disables a slot</text>
<rect x="500" y="60" width="240" height="46" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620" y="80" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Attachment 0: albedo</text>
<text x="620" y="96" font-size="10" fill="#374151" text-anchor="middle">RGBA8 (sRGB colour + roughness)</text>
<rect x="500" y="116" width="240" height="46" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620" y="136" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Attachment 1: normal</text>
<text x="620" y="152" font-size="10" fill="#374151" text-anchor="middle">RGB10_A2 or RGBA16F</text>
<rect x="500" y="172" width="240" height="46" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620" y="192" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Attachment 2: emissive / material id</text>
<text x="620" y="208" font-size="10" fill="#374151" text-anchor="middle">RGBA16F or R8UI</text>
<rect x="500" y="228" width="240" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620" y="253" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Depth: DEPTH_COMPONENT32F texture</text>
<path d="M240 125 L290 125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-mrt)"/>
<path d="M440 130 L500 83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-mrt)"/>
<path d="M440 160 L500 139" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-mrt)"/>
<path d="M440 190 L500 195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-mrt)"/>
<rect x="20" y="290" width="720" height="86" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="313" font-size="12" fill="#374151" text-anchor="middle">All attachments of one FBO must have the same width and height (and layer count) to be complete.</text>
<text x="380" y="333" font-size="12" fill="#374151" text-anchor="middle">Formats may differ, but blending, write masks and clear values are per draw buffer.</text>
<text x="380" y="353" font-size="12" fill="#374151" text-anchor="middle">A later lighting pass reads the three textures and the depth texture to rebuild position and shade (deferred shading).</text>
</svg>
