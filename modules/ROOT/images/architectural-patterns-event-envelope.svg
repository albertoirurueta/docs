<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">DomainEventEnvelope&lt;T&gt; -- every metadata field labeled</text>

  <defs>
    <marker id="env-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- envelope outer box -->
  <rect x="230" y="55" width="320" height="360" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="390" y="80" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">DomainEventEnvelope&lt;T&gt;</text>

  <!-- fields inside envelope -->
  <rect x="252" y="95" width="276" height="34" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="116" font-size="12" fill="#222222" text-anchor="middle">eventId : String</text>

  <rect x="252" y="136" width="276" height="34" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="157" font-size="12" fill="#222222" text-anchor="middle">aggregateType : String</text>

  <rect x="252" y="177" width="276" height="34" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="198" font-size="12" fill="#222222" text-anchor="middle">aggregateId : String</text>

  <rect x="252" y="218" width="276" height="34" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="239" font-size="12" fill="#222222" text-anchor="middle">causationId : String</text>

  <rect x="252" y="259" width="276" height="34" rx="5" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="390" y="280" font-size="12" fill="#222222" text-anchor="middle">correlationId : String</text>

  <!-- payload event box -->
  <rect x="252" y="305" width="276" height="95" rx="6" fill="#fdf3e3" stroke="#a66a1e" stroke-width="1.8"/>
  <text x="390" y="325" font-size="12" font-weight="bold" fill="#a66a1e" text-anchor="middle">event : T (e.g. OrderPlaced)</text>
  <text x="390" y="344" font-size="10.5" fill="#333333" text-anchor="middle">orderId, customerId, lines, totalAmount</text>
  <text x="390" y="360" font-size="10.5" fill="#333333" text-anchor="middle">occurredOn : Instant</text>
  <text x="390" y="380" font-size="9.5" fill="#666666" text-anchor="middle">the past-tense business fact itself</text>

  <!-- callouts to the right explaining each field's purpose -->
  <line x1="528" y1="112" x2="600" y2="112" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="116" font-size="10" fill="#1c4b73">unique id -- deduplication key</text>

  <line x1="528" y1="153" x2="600" y2="153" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="150" font-size="10" fill="#1c4b73">routes without reading the</text>
  <text x="605" y="163" font-size="10" fill="#1c4b73">payload (e.g. "Order")</text>

  <line x1="528" y1="194" x2="600" y2="194" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="198" font-size="10" fill="#1c4b73">which aggregate instance</text>

  <line x1="528" y1="235" x2="600" y2="235" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="232" font-size="10" fill="#1c4b73">id of the one thing that</text>
  <text x="605" y="245" font-size="10" fill="#1c4b73">directly caused this event</text>

  <line x1="528" y1="276" x2="600" y2="276" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="273" font-size="10" fill="#1c4b73">id shared by every message</text>
  <text x="605" y="286" font-size="10" fill="#1c4b73">in the same saga instance</text>

  <line x1="528" y1="352" x2="600" y2="352" stroke="#a66a1e" stroke-width="1.4" marker-end="url(#env-arrow)"/>
  <text x="605" y="349" font-size="10" fill="#a66a1e">what actually happened,</text>
  <text x="605" y="362" font-size="10" fill="#a66a1e">shaped as a DomainEvent</text>

  <!-- left callout: on the wire -->
  <text x="30" y="112" font-size="10.5" fill="#555555" text-anchor="start">Metadata:</text>
  <text x="30" y="128" font-size="9.5" fill="#666666" text-anchor="start">how the event fits</text>
  <text x="30" y="141" font-size="9.5" fill="#666666" text-anchor="start">into the surrounding</text>
  <text x="30" y="154" font-size="9.5" fill="#666666" text-anchor="start">flow -- not the fact</text>
  <text x="30" y="167" font-size="9.5" fill="#666666" text-anchor="start">itself</text>

  <text x="30" y="330" font-size="10.5" fill="#555555" text-anchor="start">Payload:</text>
  <text x="30" y="346" font-size="9.5" fill="#666666" text-anchor="start">the causing</text>
  <text x="30" y="359" font-size="9.5" fill="#666666" text-anchor="start">command's data</text>
  <text x="30" y="372" font-size="9.5" fill="#666666" text-anchor="start">plus occurredOn</text>

  <text x="390" y="440" font-size="10" fill="#666666" text-anchor="middle">com.example.shared.event.DomainEventEnvelope&lt;T extends DomainEvent&gt;</text>
</svg>
