<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Draw submission with and without the GPU Resident Drawer</text>
<text x="380" y="54" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Without: the CPU walks the visible renderers every frame</text>
<rect x="20.0" y="66" width="165.0" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="102.5" y="87.7" text-anchor="middle" font-size="12" fill="#374151">Culling on CPU</text>
<text x="102.5" y="102.7" text-anchor="middle" font-size="12" fill="#374151">visible renderers</text>
<rect x="205.0" y="66" width="165.0" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="287.5" y="87.7" text-anchor="middle" font-size="12" fill="#374151">SRP Batcher</text>
<text x="287.5" y="102.7" text-anchor="middle" font-size="12" fill="#374151">groups by shader</text>
<rect x="390.0" y="66" width="165.0" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="472.5" y="87.7" text-anchor="middle" font-size="12" fill="#374151">Many draw calls</text>
<text x="472.5" y="102.7" text-anchor="middle" font-size="12" fill="#374151">one per batch/object</text>
<rect x="575.0" y="66" width="165.0" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="657.5" y="95.2" text-anchor="middle" font-size="12" fill="#374151">GPU draws</text>
<line x1="185.0" y1="91" x2="205.0" y2="91" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="370.0" y1="91" x2="390.0" y2="91" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="555.0" y1="91" x2="575.0" y2="91" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="148" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">With: renderers are registered once with BatchRendererGroup</text>
<rect x="20.0" y="160" width="165.0" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102.5" y="179.2" text-anchor="middle" font-size="12" fill="#3730A3">Register Mesh</text>
<text x="102.5" y="194.2" text-anchor="middle" font-size="12" fill="#3730A3">Renderers once</text>
<text x="102.5" y="209.2" text-anchor="middle" font-size="12" fill="#3730A3">(scene load, changes)</text>
<rect x="205.0" y="160" width="165.0" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="287.5" y="179.2" text-anchor="middle" font-size="12" fill="#3730A3">Culls and builds</text>
<text x="287.5" y="194.2" text-anchor="middle" font-size="12" fill="#3730A3">draw lists (LOD, small</text>
<text x="287.5" y="209.2" text-anchor="middle" font-size="12" fill="#3730A3">meshes, GPU occlusion)</text>
<rect x="390.0" y="160" width="165.0" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="472.5" y="186.7" text-anchor="middle" font-size="12" fill="#3730A3">Few instanced</text>
<text x="472.5" y="201.7" text-anchor="middle" font-size="12" fill="#3730A3">indirect draws</text>
<rect x="575.0" y="160" width="165.0" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="657.5" y="194.2" text-anchor="middle" font-size="12" fill="#3730A3">GPU draws</text>
<line x1="185.0" y1="190" x2="205.0" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="370.0" y1="190" x2="390.0" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="555.0" y1="190" x2="575.0" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="244" width="350" height="118" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="278.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Requirements</text>
<text x="195.0" y="292.9" text-anchor="middle" font-size="11" fill="#92400E">Forward+ rendering path</text>
<text x="195.0" y="306.9" text-anchor="middle" font-size="11" fill="#92400E">Compute shaders, not OpenGL ES</text>
<text x="195.0" y="320.9" text-anchor="middle" font-size="11" fill="#92400E">Mesh Renderer components only</text>
<text x="195.0" y="334.9" text-anchor="middle" font-size="11" fill="#92400E">SRP Batcher enabled in the URP asset</text>
<rect x="390" y="244" width="350" height="118" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="278.9" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Best for</text>
<text x="565.0" y="292.9" text-anchor="middle" font-size="11" fill="#1F2937">Large scenes (hundreds of books)</text>
<text x="565.0" y="306.9" text-anchor="middle" font-size="11" fill="#1F2937">Many renderers sharing a mesh</text>
<text x="565.0" y="320.9" text-anchor="middle" font-size="11" fill="#1F2937">Check it in the Frame Debugger:</text>
<text x="565.0" y="334.9" text-anchor="middle" font-size="11" fill="#1F2937">draw calls named Hybrid Batch Group</text>
<rect x="20" y="372" width="720" height="20" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="385.9" text-anchor="middle" font-size="11" fill="#374151">Cost: longer builds, because BatchRendererGroup shader variants are compiled in.</text>
</svg>
