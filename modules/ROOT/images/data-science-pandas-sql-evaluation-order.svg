<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
  <title id="t">Logical order of a SQL query and its pandas counterparts</title>
  <desc id="d">Seven steps in the order a database evaluates a query: FROM and JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY and LIMIT, each paired with the pandas call that does the same job: merge or concat, boolean mask or query, groupby and agg, a filter on the aggregate, assign and column selection, sort_values or nlargest, head or iloc slices.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="348" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">A SQL query, evaluated step by step</text>
  <text x="23" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8">SQL clause</text>
  <text x="23" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F766E">pandas call</text>
  <rect x="23" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="66.0" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">FROM /</text>
  <text x="66.0" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">JOIN</text>
  <line x1="66.0" y1="136" x2="66.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="66.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">merge</text>
  <text x="66.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">concat</text>
  <line x1="110" y1="106" x2="120" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="121" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="164.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">WHERE</text>
  <line x1="164.0" y1="136" x2="164.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="121" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="164.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">df[mask]</text>
  <text x="164.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">query</text>
  <line x1="208" y1="106" x2="218" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="219" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="262.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">GROUP BY</text>
  <line x1="262.0" y1="136" x2="262.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="219" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="262.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">groupby</text>
  <text x="262.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">agg</text>
  <line x1="306" y1="106" x2="316" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="317" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">HAVING</text>
  <line x1="360.0" y1="136" x2="360.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="317" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="360.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">filter the</text>
  <text x="360.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">aggregate</text>
  <line x1="404" y1="106" x2="414" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="415" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="458.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">SELECT</text>
  <line x1="458.0" y1="136" x2="458.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="415" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="458.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">assign</text>
  <text x="458.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">df[cols]</text>
  <line x1="502" y1="106" x2="512" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="513" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="556.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">ORDER BY</text>
  <line x1="556.0" y1="136" x2="556.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="513" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="556.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">sort_values</text>
  <text x="556.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">nlargest</text>
  <line x1="600" y1="106" x2="610" y2="106" stroke="#475569" stroke-width="2"/>
  <rect x="611" y="78" width="86" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="654.0" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">LIMIT</text>
  <line x1="654.0" y1="136" x2="654.0" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="611" y="208" width="86" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="654.0" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">head</text>
  <text x="654.0" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">iloc[a:b]</text>
  <text x="360" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">SELECT is written first but evaluated after HAVING: a column alias exists only from that point on.</text>
  <text x="360" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">In pandas the order is the order of your method calls, so a new column is available right after assign.</text>
</svg>
