<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" width="900" height="475" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Paid extensions around the WooCommerce core</title>
  <desc id="d">WooCommerce core provides products, orders stored with HPOS, customers, payment gateways and Action Scheduler. Woo extensions add recurring billing (Subscriptions), plans and restricted content (Memberships) and time slots and resources (Bookings). Each stores its own data, listens to order status hooks and exposes its own PHP functions and WP-CLI or abilities interfaces. Pocket Coffee uses a small custom plugin instead for the Coffee Club.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="30" y="25" width="840" height="95" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="58.5" text-anchor="middle" font-weight="bold">WooCommerce core</text>
  <text x="450.0" y="76.5" text-anchor="middle">products, orders (HPOS), customers, gateways, Action Scheduler, order status hooks</text>
  <text x="450.0" y="94.5" text-anchor="middle">woocommerce_order_status_processing, woocommerce_order_status_completed, woocommerce_payment_complete</text>
  <rect x="30" y="170" width="265" height="150" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="162.5" y="213.0" text-anchor="middle" font-weight="bold">Subscriptions</text>
  <text x="162.5" y="231.0" text-anchor="middle">shop_subscription (extends WC_Order)</text>
  <text x="162.5" y="249.0" text-anchor="middle">renewal orders, retries, switching</text>
  <text x="162.5" y="267.0" text-anchor="middle">woocommerce_subscription_status_*</text>
  <text x="162.5" y="285.0" text-anchor="middle">wcs_* functions</text>
  <rect x="318" y="170" width="265" height="150" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.5" y="213.0" text-anchor="middle" font-weight="bold">Memberships</text>
  <text x="450.5" y="231.0" text-anchor="middle">plans: wc_membership_plan</text>
  <text x="450.5" y="249.0" text-anchor="middle">members: wc_user_membership</text>
  <text x="450.5" y="267.0" text-anchor="middle">restriction rules, drip, discounts</text>
  <text x="450.5" y="285.0" text-anchor="middle">wc_memberships_* functions, CLI</text>
  <rect x="605" y="170" width="265" height="150" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="737.5" y="213.0" text-anchor="middle" font-weight="bold">Bookings</text>
  <text x="737.5" y="231.0" text-anchor="middle">wc_booking, bookable resources, persons</text>
  <text x="737.5" y="249.0" text-anchor="middle">availability, cost rules, deposits via</text>
  <text x="737.5" y="267.0" text-anchor="middle">a separate extension</text>
  <text x="737.5" y="285.0" text-anchor="middle">create_wc_booking(), booking hooks</text>
  <line x1="160" y1="120" x2="160" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="120" x2="450" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="737" y1="120" x2="737" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="365" width="840" height="85" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="393.5" text-anchor="middle" font-weight="bold">Pocket Coffee Club (custom plugin)</text>
  <text x="450.0" y="411.5" text-anchor="middle">role coffee_club + user meta _coffee_club_until, expiry through Action Scheduler,</text>
  <text x="450.0" y="429.5" text-anchor="middle">shortcode [coffee_club_only], club-only category, member price</text>
  <line x1="160" y1="320" x2="160" y2="365" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="320" x2="450" y2="365" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="737" y1="320" x2="737" y2="365" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
