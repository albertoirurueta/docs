<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Dot product and cross product</text>
<text x="190" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Dot product: how much a points along b</text>
<line x1="60" y1="250" x2="310" y2="250" stroke="#3730A3" stroke-width="1.5" marker-end="url(#dc)"/>
<text x="315" y="254" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">a</text>
<line x1="60" y1="250" x2="210" y2="130" stroke="#B45309" stroke-width="1.5" marker-end="url(#dc)"/>
<text x="215" y="126" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">b</text>
<line x1="210" y1="130" x2="210" y2="250" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="60" y1="262" x2="210" y2="262" stroke="#047857" stroke-width="4"/>
<text x="135" y="282" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">projection of b on a: |b| cos θ</text>
<path d="M 100,250 A 40 40 0 0 0 91,225" fill="none" stroke="#4B5563" stroke-width="1.5"/>
<text x="112" y="240" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">θ</text>
<text x="190" y="330" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">a · b = |a| |b| cos θ  (0 when perpendicular)</text>
<line x1="380" y1="50" x2="380" y2="340" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="570" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Cross product: a normal and an area</text>
<polygon points="450,270 600,270 660,220 510,220" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="450" y1="270" x2="600" y2="270" stroke="#3730A3" stroke-width="1.5" marker-end="url(#dc)"/>
<text x="525" y="288" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">a</text>
<line x1="450" y1="270" x2="510" y2="220" stroke="#B45309" stroke-width="1.5" marker-end="url(#dc)"/>
<text x="465" y="230" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">b</text>
<line x1="555" y1="245" x2="555" y2="120" stroke="#047857" stroke-width="1.5" marker-end="url(#dc)"/>
<text x="565" y="125" font-size="13" font-weight="bold" fill="#065F46" text-anchor="start">n = a × b</text>
<text x="570" y="316" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">|a × b| = |a| |b| sin θ = parallelogram area</text>
<text x="570" y="332" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">right-hand rule: a toward b gives the thumb</text>
</svg>
