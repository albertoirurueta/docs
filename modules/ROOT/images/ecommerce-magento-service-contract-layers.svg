<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Who talks to whom around a Magento service contract</title>
  <desc id="d">Four horizontal layers from top to bottom. Callers: the REST and SOAP web API, GraphQL resolvers, controllers, the pocketcoffee:lot:list command and other modules. Service contract in the Api folder: LotRepositoryInterface, LotInterface in Api slash Data and LotSearchResultsInterface. Implementation in the Model folder: LotRepository, Lot and the collection processor. Persistence: resource model, collection and the pocketcoffee_lot table. A side box shows the latest_lot extension attribute added to the product by a plugin on the product repository. Callers depend only on the second layer.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Callers depend on interfaces, never on the model</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="56" width="640" height="96" rx="8" fill="#3d5266"/>
    <text x="56" y="80" font-weight="bold" font-size="14">1  Callers</text>
    <rect x="56" y="94" width="130" height="44" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="121" y="113" text-anchor="middle">REST and SOAP</text><text x="121" y="129" text-anchor="middle">webapi.xml</text>
    <rect x="198" y="94" width="130" height="44" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="263" y="113" text-anchor="middle">GraphQL</text><text x="263" y="129" text-anchor="middle">resolvers</text>
    <rect x="340" y="94" width="130" height="44" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="405" y="113" text-anchor="middle">Controllers and</text><text x="405" y="129" text-anchor="middle">view models</text>
    <rect x="482" y="94" width="130" height="44" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="547" y="113" text-anchor="middle">CLI commands</text><text x="547" y="129" text-anchor="middle">other modules</text>

    <rect x="40" y="188" width="640" height="116" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="56" y="212" font-weight="bold" font-size="14" fill="#f4b860">2  Service contract: the Api folder</text>
    <rect x="56" y="226" width="190" height="62" rx="5" fill="#33485c" stroke="#f4b860"/>
    <text x="151" y="246" text-anchor="middle">Api/LotRepositoryInterface</text>
    <text x="151" y="262" text-anchor="middle">save, getById, getList,</text><text x="151" y="278" text-anchor="middle">delete, deleteById</text>
    <rect x="258" y="226" width="190" height="62" rx="5" fill="#33485c" stroke="#f4b860"/>
    <text x="353" y="246" text-anchor="middle">Api/Data/LotInterface</text>
    <text x="353" y="262" text-anchor="middle">getters and setters,</text><text x="353" y="278" text-anchor="middle">extension attributes</text>
    <rect x="460" y="226" width="206" height="62" rx="5" fill="#33485c" stroke="#f4b860"/>
    <text x="563" y="246" text-anchor="middle">Api/Data/LotSearchResults</text><text x="563" y="262" text-anchor="middle">Interface: items,</text><text x="563" y="278" text-anchor="middle">total count, criteria</text>

    <rect x="40" y="340" width="640" height="82" rx="8" fill="#3d5266"/>
    <text x="56" y="364" font-weight="bold" font-size="14">3  Implementation: the Model folder</text>
    <rect x="56" y="374" width="190" height="38" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="151" y="398" text-anchor="middle">LotRepository</text>
    <rect x="258" y="374" width="190" height="38" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="353" y="398" text-anchor="middle">Lot (extensible model)</text>
    <rect x="460" y="374" width="206" height="38" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="563" y="398" text-anchor="middle">CollectionProcessor</text>

    <rect x="40" y="458" width="640" height="76" rx="8" fill="#3d5266"/>
    <text x="56" y="482" font-weight="bold" font-size="14">4  Persistence</text>
    <rect x="56" y="492" width="190" height="30" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="151" y="512" text-anchor="middle">ResourceModel\Lot</text>
    <rect x="258" y="492" width="190" height="30" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="353" y="512" text-anchor="middle">Lot\Collection</text>
    <rect x="460" y="492" width="206" height="30" rx="5" fill="#33485c" stroke="#6f8aa3"/>
    <text x="563" y="512" text-anchor="middle">table pocketcoffee_lot</text>
  </g>

  <g stroke="#f4b860" stroke-width="2" fill="none">
    <path d="M360 152 L360 186" marker-end="url(#a)"/>
    <path d="M360 304 L360 338" marker-end="url(#a)"/>
    <path d="M360 422 L360 456" marker-end="url(#a)"/>
  </g>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="708" y="56" width="212" height="248" rx="8" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
    <text x="722" y="80" font-weight="bold" font-size="14" fill="#9fd3c7">Extending a contract</text>
    <text x="722" y="104">etc/extension_attributes.xml</text>
    <text x="722" y="122">adds latest_lot to</text>
    <text x="722" y="140">ProductInterface.</text>
    <text x="722" y="170">A plugin on the product</text>
    <text x="722" y="188">repository (after get,</text>
    <text x="722" y="206">getById, getList) fills it</text>
    <text x="722" y="224">from LotRepositoryInterface,</text>
    <text x="722" y="242">so REST shows it under</text>
    <text x="722" y="260">extension_attributes.</text>
    <text x="722" y="288" fill="#9fd3c7">Contract used, not model.</text>

    <rect x="708" y="330" width="212" height="204" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="722" y="354" font-weight="bold" font-size="14" fill="#f4b860">What breaks the contract</text>
    <text x="722" y="380">new Lot() or ObjectManager</text>
    <text x="722" y="398">in a caller</text>
    <text x="722" y="424">Collections in a controller</text>
    <text x="722" y="450">Reading table columns</text>
    <text x="722" y="468">with raw SQL</text>
    <text x="722" y="494">Returning the model from</text>
    <text x="722" y="512">a web API method</text>
  </g>
</svg>
