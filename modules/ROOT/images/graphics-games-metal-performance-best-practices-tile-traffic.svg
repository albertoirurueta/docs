<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-performance-best-practices-tile-traffic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where bandwidth goes: tile memory and system memory</text>
<rect x="40" y="60" width="220" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150.0" y="106.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Tile memory</text>
<text x="150.0" y="121.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">fast, on chip</text>
<text x="150.0" y="136.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">colour, depth, stencil</text>
<text x="150.0" y="151.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">for the current tile</text>
<rect x="500" y="60" width="220" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="610.0" y="106.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">System memory</text>
<text x="610.0" y="121.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">shared with the CPU</text>
<text x="610.0" y="136.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">textures, buffers,</text>
<text x="610.0" y="151.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">render target storage</text>
<line x1="262" y1="95" x2="498" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-performance-best-practices-tile-traffic)"/>
<text x="380" y="88" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">load action .load copies the old contents in</text>
<text x="380" y="110" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">.clear and .dontCare copy nothing</text>
<line x1="498" y1="160" x2="262" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-performance-best-practices-tile-traffic)"/>
<text x="380" y="153" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">store action .store writes the tile out</text>
<text x="380" y="178" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">.dontCare / memoryless skips this</text>
<rect x="40" y="210" width="185" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="132.5" y="226.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Attachment</text>
<rect x="230" y="210" width="165" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="312.5" y="226.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Typical load</text>
<rect x="400" y="210" width="165" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="482.5" y="226.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Typical store</text>
<rect x="570" y="210" width="150" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="645.0" y="226.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Why</text>
<rect x="40" y="238" width="185" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="132.5" y="254.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Colour shown on screen</text>
<rect x="230" y="238" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="312.5" y="254.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.clear or .dontCare</text>
<rect x="400" y="238" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="482.5" y="254.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.store</text>
<rect x="570" y="238" width="150" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="645.0" y="254.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">needed by the display</text>
<rect x="40" y="266" width="185" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="132.5" y="282.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Depth, used in this pass only</text>
<rect x="230" y="266" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="312.5" y="282.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.clear</text>
<rect x="400" y="266" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="482.5" y="282.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.dontCare</text>
<rect x="570" y="266" width="150" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="645.0" y="282.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">never read again</text>
<rect x="40" y="294" width="185" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="132.5" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">G-buffer inside a tile pass</text>
<rect x="230" y="294" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="312.5" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.dontCare</text>
<rect x="400" y="294" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="482.5" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">memoryless</text>
<rect x="570" y="294" width="150" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="645.0" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stays in tile memory</text>
<rect x="40" y="322" width="185" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="132.5" y="338.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MSAA colour before resolve</text>
<rect x="230" y="322" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="312.5" y="338.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.clear</text>
<rect x="400" y="322" width="165" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="482.5" y="338.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.multisampleResolve</text>
<rect x="570" y="322" width="150" height="26" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="645.0" y="338.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">only the resolve leaves</text>
</svg>
