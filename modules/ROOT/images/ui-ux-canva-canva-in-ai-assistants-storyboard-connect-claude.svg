<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Connecting Canva to an AI assistant, in five steps</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: settings menu -->
  <rect x="30" y="100" width="104" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <rect x="38" y="110" width="88" height="14" rx="3" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="38" y="130" width="88" height="14" rx="3" fill="#4F46E5"/><text x="82" y="141" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Settings</text>
  <rect x="38" y="150" width="88" height="14" rx="3" fill="#E5E7EB" stroke="#9CA3AF"/>
  <rect x="38" y="170" width="88" height="14" rx="3" fill="#E5E7EB" stroke="#9CA3AF"/>
  <!-- panel 2: connectors list -->
  <rect x="182" y="100" width="104" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="234" y="118" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Connectors</text>
  <rect x="190" y="126" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="190" y="154" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="234" y="169" font-size="11" fill="#92400E" text-anchor="middle">Canva</text>
  <rect x="190" y="182" width="88" height="22" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <!-- panel 3: authorize -->
  <rect x="334" y="100" width="104" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="386" y="120" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Sign in to Canva</text>
  <rect x="344" y="130" width="84" height="14" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="344" y="150" width="84" height="14" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="352" y="190" width="68" height="22" rx="6" fill="#4F46E5"/><text x="386" y="205" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Allow</text>
  <!-- panel 4: toggle -->
  <rect x="486" y="100" width="104" height="140" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="538" y="118" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">New chat</text>
  <text x="496" y="152" font-size="11" fill="#374151">Canva</text>
  <rect x="540" y="141" width="38" height="16" rx="8" fill="#4F46E5"/><circle cx="570" cy="149" r="6" fill="#FFFFFF"/>
  <rect x="496" y="200" width="84" height="26" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
  <!-- panel 5: result -->
  <rect x="636" y="100" width="96" height="140" rx="4" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="644" y="110" width="80" height="18" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="644" y="136" width="36" height="44" rx="3" fill="#EEF2FF" stroke="#4F46E5"/><rect x="688" y="136" width="36" height="44" rx="3" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="652" y="196" width="64" height="22" rx="6" fill="#B45309"/><text x="684" y="211" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Open in Canva</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Open the</text><text x="82" y="338">assistant settings</text><text x="234" y="322">Find Canva in</text><text x="234" y="338">the connectors</text><text x="386" y="322">Sign in and</text><text x="386" y="338">authorize</text><text x="538" y="322">Turn Canva on</text><text x="538" y="338">for the chat</text><text x="684" y="322">Ask, then open</text><text x="684" y="338">the design</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic assistant, not a screenshot of any product.</text>
</svg>
