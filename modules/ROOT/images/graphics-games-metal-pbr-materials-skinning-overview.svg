<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-pbr-materials-skinning-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Skinning: a vertex blended between joint transforms</text>
<line x1="80" y1="300" x2="150" y2="240" stroke="#4F46E5" stroke-width="5"/>
<line x1="150" y1="240" x2="240" y2="230" stroke="#4F46E5" stroke-width="5"/>
<line x1="240" y1="230" x2="320" y2="170" stroke="#4F46E5" stroke-width="5"/>
<circle cx="80" cy="300" r="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="150" cy="240" r="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="240" cy="230" r="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="320" cy="170" r="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="76" y="326" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">J0</text>
<text x="146" y="266" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">J1</text>
<text x="236" y="256" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">J2</text>
<text x="316" y="196" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">J3</text>
<circle cx="200" cy="222" r="6" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="200" y="206" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">vertex v</text>
<line x1="200" y1="222" x2="150" y2="240" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="200" y1="222" x2="240" y2="230" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="150" y="274" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">w = 0.4</text>
<text x="262" y="214" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">w = 0.6</text>
<text x="200" y="350" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Bind pose to current pose</text>
<rect x="400" y="52" width="340" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="80.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Per vertex: 4 joint indices and weights</text>
<text x="570.0" y="95.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(4 floats summing to 1), from the asset</text>
<rect x="400" y="128" width="340" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="156.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Per frame: one matrix per joint in</text>
<text x="570.0" y="171.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">a buffer: jointWorld * inverseBind</text>
<rect x="400" y="204" width="340" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="232.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Vertex function: blend the four matrices</text>
<text x="570.0" y="247.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">skin = sum of w[i] * palette[joints[i]]</text>
<rect x="400" y="280" width="340" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="308.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">pos = skin * float4(position, 1), then</text>
<text x="570.0" y="323.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">the usual MVP; skin the normals too</text>
<line x1="570" y1="116" x2="570" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-skinning-overview)"/>
<line x1="570" y1="192" x2="570" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-skinning-overview)"/>
<line x1="570" y1="268" x2="570" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-skinning-overview)"/>
</svg>
