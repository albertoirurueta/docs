<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Classic checkout and Checkout block call the same gateway methods</title>
  <desc id="d">On the left, the classic shortcode checkout renders payment_fields, posts the form to the wc-ajax checkout endpoint, creates the order, runs validate_fields and process_payment. On the right, the Checkout block renders a React content component, an onPaymentSetup observer returns payment data, the Store API checkout route builds a PaymentContext and fires the woocommerce_rest_checkout_process_payment_with_context action, and a legacy handler at priority 999 copies payment_data into POST, runs validate_fields and process_payment when no status was set. Both end with a success result and a redirect to the order received page.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="35" width="430" height="420" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="22" y="55" font-weight="bold">Classic checkout (shortcode)</text>
  <rect x="460" y="35" width="430" height="420" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="472" y="55" font-weight="bold">Checkout block (Store API)</text>
  <rect x="30" y="70" width="390" height="72" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="225.0" y="92.0" text-anchor="middle" font-weight="bold">payment_fields()</text>
  <text x="225.0" y="110.0" text-anchor="middle">markup inside the payment box</text>
  <text x="225.0" y="128.0" text-anchor="middle">saved cards, &quot;save to account&quot;</text>
  <line x1="225" y1="142" x2="225" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="160" width="390" height="72" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="225.0" y="182.0" text-anchor="middle" font-weight="bold">POST /?wc-ajax=checkout</text>
  <text x="225.0" y="200.0" text-anchor="middle">form fields incl. payment_method</text>
  <text x="225.0" y="218.0" text-anchor="middle">and gateway fields (POST)</text>
  <line x1="225" y1="232" x2="225" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="250" width="390" height="72" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="225.0" y="272.0" text-anchor="middle" font-weight="bold">WC_Checkout::process_checkout()</text>
  <text x="225.0" y="290.0" text-anchor="middle">validates, creates the order</text>
  <text x="225.0" y="308.0" text-anchor="middle">status pending</text>
  <line x1="225" y1="322" x2="225" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="340" width="390" height="72" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="225.0" y="362.0" text-anchor="middle" font-weight="bold">validate_fields()</text>
  <text x="225.0" y="380.0" text-anchor="middle">add notices with wc_add_notice</text>
  <text x="225.0" y="398.0" text-anchor="middle">to stop before payment</text>
  <rect x="480" y="70" width="390" height="72" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="92.0" text-anchor="middle" font-weight="bold">content component (JS)</text>
  <text x="675.0" y="110.0" text-anchor="middle">registerPaymentMethod: label,</text>
  <text x="675.0" y="128.0" text-anchor="middle">content, edit, canMakePayment</text>
  <line x1="675" y1="142" x2="675" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="160" width="390" height="72" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="182.0" text-anchor="middle" font-weight="bold">onPaymentSetup observer</text>
  <text x="675.0" y="200.0" text-anchor="middle">returns paymentMethodData</text>
  <text x="675.0" y="218.0" text-anchor="middle">(becomes payment_data)</text>
  <line x1="675" y1="232" x2="675" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="250" width="390" height="72" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="272.0" text-anchor="middle" font-weight="bold">POST /wc/store/v1/checkout</text>
  <text x="675.0" y="290.0" text-anchor="middle">payment_method, payment_data</text>
  <text x="675.0" y="308.0" text-anchor="middle">Nonce or Cart-Token header</text>
  <line x1="675" y1="322" x2="675" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="340" width="390" height="72" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="362.0" text-anchor="middle" font-weight="bold">..._process_payment_with_context</text>
  <text x="675.0" y="380.0" text-anchor="middle">PaymentContext in, PaymentResult</text>
  <text x="675.0" y="398.0" text-anchor="middle">out: status and redirect_url</text>
  <rect x="160" y="480" width="580" height="60" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="505.0" text-anchor="middle" font-weight="bold">process_payment( $order_id )</text>
  <text x="450.0" y="523.0" text-anchor="middle">same method on the same gateway object; returns result success or failure plus redirect</text>
  <line x1="225" y1="430" x2="225" y2="478" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="675" y1="430" x2="675" y2="478" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="553" text-anchor="middle" font-size="11" opacity="0.85">The Store API path runs validate_fields and process_payment through its legacy handler unless a hook has already set a status.</text>
</svg>
