<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Confusion matrix and the metrics derived from it</title>
  <desc id="d1">A two by two confusion matrix with 85 true negatives, 5 false positives, 6 false negatives and 4 true positives, and the accuracy, precision, recall, specificity and F1 values computed from those four counts.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">One confusion matrix, many metrics</text>

  <text x="196" y="72" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">predicted class</text>
  <text x="152" y="94" font-size="14" fill="#475569" text-anchor="middle">0 (negative)</text>
  <text x="256" y="94" font-size="14" fill="#475569" text-anchor="middle">1 (positive)</text>
  <text x="36" y="195" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" transform="rotate(-90 36 195)">true class</text>
  <text x="92" y="146" font-size="14" fill="#475569" text-anchor="end">0</text>
  <text x="92" y="250" font-size="14" fill="#475569" text-anchor="end">1</text>

  <rect x="100" y="104" width="104" height="94" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <rect x="204" y="104" width="104" height="94" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <rect x="100" y="198" width="104" height="94" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <rect x="204" y="198" width="104" height="94" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <g text-anchor="middle" fill="#0F172A">
    <text x="152" y="146" font-size="20" font-weight="bold">85</text><text x="152" y="168" font-size="14">TN</text>
    <text x="256" y="146" font-size="20" font-weight="bold">5</text><text x="256" y="168" font-size="14">FP</text>
    <text x="152" y="240" font-size="20" font-weight="bold">6</text><text x="152" y="262" font-size="14">FN</text>
    <text x="256" y="240" font-size="20" font-weight="bold">4</text><text x="256" y="262" font-size="14">TP</text>
  </g>
  <circle cx="324" cy="120" r="11" fill="#0F172A"/><text x="324" y="125" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="324" cy="214" r="11" fill="#0F172A"/><text x="324" y="219" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="100" y="322" font-size="12" fill="#475569">Rows are the true class, columns the prediction:</text>
  <text x="100" y="340" font-size="12" fill="#475569">the layout of confusion_matrix(y_true, y_pred).</text>
  <text x="100" y="358" font-size="12" fill="#475569">Positive class 1 is the rare one (10 of 100).</text>

  <path d="M350 200 L392 200" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="400" y="60" width="298" height="312" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="416" y="92">accuracy</text>
    <text x="416" y="150">precision</text>
    <text x="416" y="208">recall</text>
    <text x="416" y="266">specificity</text>
    <text x="416" y="324">f1</text>
  </g>
  <g font-size="14" fill="#0F172A">
    <text x="416" y="112">(TP + TN) / all = 89 / 100 = 0.89</text>
    <text x="416" y="170">TP / (TP + FP) = 4 / 9 = 0.44</text>
    <text x="416" y="228">TP / (TP + FN) = 4 / 10 = 0.40</text>
    <text x="416" y="286">TN / (TN + FP) = 85 / 90 = 0.94</text>
    <text x="416" y="344">2PR / (P + R) = 0.42</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="416" y="128">looks good, but a constant 0 scores 0.90</text>
    <text x="416" y="186">of the predicted positives, how many are real</text>
    <text x="416" y="244">of the real positives, how many are found</text>
    <text x="416" y="302">recall of the negative class</text>
    <text x="416" y="360">harmonic mean of precision and recall</text>
  </g>
</svg>
