<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-hello-triangle-metal4-m3-vs-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The same frame in Metal 3 and in Metal 4</text>
<rect x="20" y="45" width="350" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="64.0" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Metal 3 (MTL types, all supported OSes)</text>
<rect x="390" y="45" width="350" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="64.0" font-size="13" font-weight="normal" fill="#3730A3" text-anchor="middle">Metal 4 (MTL4 types, 26 OSes)</text>
<rect x="20" y="90" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="110.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">device.makeCommandQueue()</text>
<rect x="390" y="90" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="110.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">device.makeMTL4CommandQueue()</text>
<rect x="20" y="130" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="150.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">queue.makeCommandBuffer() every frame</text>
<rect x="390" y="130" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="150.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">device.makeCommandBuffer() once, begin each frame</text>
<rect x="20" y="170" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="190.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(memory owned by the command buffer)</text>
<rect x="390" y="170" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="190.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">makeCommandAllocator() x3, reset() per frame</text>
<rect x="20" y="210" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="230.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">makeRenderCommandEncoder(descriptor:)</text>
<rect x="390" y="210" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="230.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">makeRenderCommandEncoder(descriptor:options:)</text>
<rect x="20" y="250" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="270.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTLRenderPipelineDescriptor + device</text>
<rect x="390" y="250" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="270.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4RenderPipelineDescriptor + MTL4Compiler</text>
<rect x="20" y="290" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="310.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setVertexBuffer(_:offset:index:)</text>
<rect x="390" y="290" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="310.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">argumentTable.setAddress(gpuAddress, index:)</text>
<rect x="20" y="330" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="350.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(resources tracked per encoder call)</text>
<rect x="390" y="330" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="350.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLResidencySet added to the queue</text>
<rect x="20" y="370" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="390.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">commandBuffer.present(drawable); commit()</text>
<rect x="390" y="370" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="390.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">waitForDrawable, commit, signalDrawable, present</text>
<rect x="20" y="410" width="350" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="430.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">addCompletedHandler or semaphore</text>
<rect x="390" y="410" width="350" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="430.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">queue.signalEvent(sharedEvent, value:)</text>
<text x="380" y="464" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Both generations can coexist in one app; check device.supportsFamily(.metal4) to pick the path.</text>
</svg>
