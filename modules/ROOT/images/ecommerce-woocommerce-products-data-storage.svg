<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 634" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where the data of the Pocket Coffee products is stored</title>
  <desc id="d">A product save goes through WC_Product_Data_Store_CPT. Posts hold one row per product (post type product) and per variation (post type product_variation with the parent in post_parent). Postmeta holds the price, SKU, stock and attribute choices. Taxonomies hold the product type, categories, global attributes and visibility flags. Lookup tables hold copies for fast queries: wc_product_meta_lookup is written on save and wc_product_attributes_lookup is filled by Action Scheduler jobs. HPOS only moved orders; products stay in posts.</desc>
  <rect x="0" y="0" width="960" height="634" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">One product, four kinds of storage</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Rows observed on the test store after creating the Pocket Coffee catalogue; HPOS moved orders only, products are still posts</text>
  <rect x="40" y="76" width="880" height="40" rx="6" fill="#34495e" stroke="#f4b860" stroke-width="1.6"/>
  <text x="480.0" y="99.5" font-size="13" text-anchor="middle" fill="#f2f5f8">$product-&gt;save()  -&gt;  WC_Product_Data_Store_CPT (or the variable, grouped and variation store)</text>
  <rect x="40" y="134" width="430" height="176" rx="6" fill="#3d5266"/>
  <rect x="40" y="134" width="430" height="5" rx="2" fill="#f4b860"/>
  <text x="54" y="164" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wp_posts</text>
  <text x="54" y="190" font-size="11.5" text-anchor="start" fill="#f2f5f8">458  product              Single-origin beans (variable)</text>
  <text x="54" y="211" font-size="11.5" text-anchor="start" fill="#f2f5f8">459 to 476  product_variation, post_parent 458</text>
  <text x="54" y="232" font-size="11.5" text-anchor="start" fill="#f2f5f8">477  product  Starter kit        478  product  Brew at home</text>
  <text x="54" y="253" font-size="11.5" text-anchor="start" fill="#f2f5f8">479  product  Guest roaster box   480  product  Brewing guide</text>
  <text x="54" y="274" font-size="11.5" text-anchor="start" fill="#f2f5f8">481  product  Tasting flight</text>
  <text x="54" y="298" font-size="10.5" text-anchor="start" fill="#9fd3c7">one row per product and per variation; post_status publish</text>
  <rect x="490" y="134" width="430" height="176" rx="6" fill="#3d5266"/>
  <rect x="490" y="134" width="430" height="5" rx="2" fill="#9fd3c7"/>
  <text x="504" y="164" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wp_postmeta</text>
  <text x="504" y="190" font-size="11.5" text-anchor="start" fill="#f2f5f8">_sku  _regular_price  _price  _stock  _stock_status</text>
  <text x="504" y="211" font-size="11.5" text-anchor="start" fill="#f2f5f8">_manage_stock  _weight  _virtual  _downloadable</text>
  <text x="504" y="232" font-size="11.5" text-anchor="start" fill="#f2f5f8">attribute_pa_origin = ethiopia-yirgacheffe</text>
  <text x="504" y="253" font-size="11.5" text-anchor="start" fill="#f2f5f8">attribute_grind = Whole bean    attribute_size = 250 g</text>
  <text x="504" y="274" font-size="11.5" text-anchor="start" fill="#f2f5f8">roast_date = 2026-10-20  (custom field of the page)</text>
  <text x="504" y="298" font-size="10.5" text-anchor="start" fill="#9fd3c7">variations carry the attribute_ keys; parents carry _product_attributes</text>
  <rect x="40" y="322" width="430" height="176" rx="6" fill="#3d5266"/>
  <rect x="40" y="322" width="430" height="5" rx="2" fill="#a8d18d"/>
  <text x="54" y="352" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Taxonomies</text>
  <text x="54" y="378" font-size="11.5" text-anchor="start" fill="#f2f5f8">product_type: simple, variable, grouped, external, tasting_flight</text>
  <text x="54" y="399" font-size="11.5" text-anchor="start" fill="#f2f5f8">product_cat: Beans, Equipment</text>
  <text x="54" y="420" font-size="11.5" text-anchor="start" fill="#f2f5f8">pa_origin and pa_roast: global attributes (terms)</text>
  <text x="54" y="441" font-size="11.5" text-anchor="start" fill="#f2f5f8">product_visibility: featured, exclude-from-catalog</text>
  <text x="54" y="486" font-size="10.5" text-anchor="start" fill="#9fd3c7">terms live in wp_terms and wp_term_relationships</text>
  <rect x="490" y="322" width="430" height="176" rx="6" fill="#3d5266"/>
  <rect x="490" y="322" width="430" height="5" rx="2" fill="#e8908a"/>
  <text x="504" y="352" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Lookup tables</text>
  <text x="504" y="378" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_product_meta_lookup: sku, min_price, max_price, stock, onsale</text>
  <text x="504" y="399" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_product_attributes_lookup: filled by Action Scheduler jobs</text>
  <text x="504" y="420" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_product_download_directories: approved download folders</text>
  <text x="504" y="441" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_downloadable_product_permissions: per order</text>
  <text x="504" y="486" font-size="10.5" text-anchor="start" fill="#9fd3c7">copies for fast queries, filters and the downloads engine</text>
  <rect x="40" y="514" width="880" height="100" rx="6" fill="#34495e"/>
  <text x="52" y="538" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Consequences</text>
  <text x="52" y="560" font-size="11.5" text-anchor="start" fill="#f2f5f8">Read and write products with the CRUD classes; the meta keys above are an implementation detail.</text>
  <text x="52" y="578" font-size="11.5" text-anchor="start" fill="#f2f5f8">A direct update of postmeta skips the lookup tables, the product cache and the woocommerce_update_product hooks.</text>
  <text x="52" y="596" font-size="11.5" text-anchor="start" fill="#f2f5f8">Right after the seed command wc_product_attributes_lookup had 0 rows: its jobs were pending in Action Scheduler.</text>
</svg>
