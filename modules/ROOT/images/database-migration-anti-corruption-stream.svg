<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="acsArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">The anti-corruption layer as a stream translator</text>

  <!-- column titles -->
  <text x="100" y="66" text-anchor="middle" font-weight="bold" fill="#263238">Legacy Oracle</text>
  <text x="300" y="66" text-anchor="middle" font-weight="bold" fill="#263238">Kafka topics</text>
  <text x="560" y="66" text-anchor="middle" font-weight="bold" fill="#263238">Spring Boot bookshop</text>
  <text x="840" y="66" text-anchor="middle" font-weight="bold" fill="#263238">New PostgreSQL</text>

  <!-- legacy tables -->
  <rect x="20" y="80" width="160" height="300" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="100" y="104" text-anchor="middle" font-size="13" fill="#455a64">schema BOOKSHOP</text>
  <rect x="40" y="118" width="120" height="34" rx="4" fill="#ffffff" stroke="#c62828"/>
  <text x="100" y="140" text-anchor="middle" fill="#263238">BOOK</text>
  <rect x="40" y="168" width="120" height="34" rx="4" fill="#ffffff" stroke="#c62828"/>
  <text x="100" y="190" text-anchor="middle" fill="#263238">AUTHOR</text>
  <rect x="40" y="218" width="120" height="34" rx="4" fill="#ffffff" stroke="#c62828"/>
  <text x="100" y="240" text-anchor="middle" fill="#263238">CUSTOMER</text>
  <rect x="40" y="268" width="120" height="34" rx="4" fill="#ffffff" stroke="#c62828"/>
  <text x="100" y="290" text-anchor="middle" fill="#263238">ORDERS</text>
  <rect x="40" y="318" width="120" height="34" rx="4" fill="#ffffff" stroke="#c62828"/>
  <text x="100" y="340" text-anchor="middle" fill="#263238">ORDER_LINE</text>

  <!-- debezium -->
  <rect x="20" y="400" width="160" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="100" y="424" text-anchor="middle" fill="#263238">Debezium Oracle</text>
  <text x="100" y="443" text-anchor="middle" font-size="12" fill="#455a64">reads the redo log</text>
  <line x1="100" y1="380" x2="100" y2="398" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>

  <!-- topics -->
  <rect x="210" y="80" width="180" height="376" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="300" y="104" text-anchor="middle" font-size="13" fill="#455a64">prefix legacy.BOOKSHOP.</text>
  <rect x="225" y="118" width="150" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="300" y="140" text-anchor="middle" font-size="13" fill="#263238">BOOK</text>
  <rect x="225" y="168" width="150" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="300" y="190" text-anchor="middle" font-size="13" fill="#263238">AUTHOR</text>
  <rect x="225" y="218" width="150" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="300" y="240" text-anchor="middle" font-size="13" fill="#263238">CUSTOMER</text>
  <rect x="225" y="268" width="150" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="300" y="290" text-anchor="middle" font-size="13" fill="#263238">ORDERS</text>
  <rect x="225" y="318" width="150" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="300" y="340" text-anchor="middle" font-size="13" fill="#263238">ORDER_LINE</text>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#455a64">key = primary key columns</text>
  <text x="300" y="402" text-anchor="middle" font-size="12" fill="#455a64">value = before, after, source, op</text>
  <text x="300" y="420" text-anchor="middle" font-size="12" fill="#455a64">delete = event + tombstone</text>
  <path d="M180,428 L208,428" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#acsArr)"/>

  <!-- ACL -->
  <rect x="420" y="80" width="280" height="376" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="560" y="104" text-anchor="middle" font-size="13" fill="#455a64">anti-corruption layer</text>
  <rect x="440" y="118" width="240" height="84" rx="4" fill="#ffffff" stroke="#f9a825"/>
  <text x="560" y="140" text-anchor="middle" fill="#263238">LegacyBookTranslator</text>
  <text x="560" y="160" text-anchor="middle" font-size="12" fill="#455a64">ACTIVE_FLG Y/N to boolean</text>
  <text x="560" y="177" text-anchor="middle" font-size="12" fill="#455a64">one AUTHOR_ID to book_author</text>
  <text x="560" y="194" text-anchor="middle" font-size="12" fill="#455a64">older LAST_UPD never wins</text>
  <rect x="440" y="218" width="240" height="34" rx="4" fill="#ffffff" stroke="#f9a825"/>
  <text x="560" y="240" text-anchor="middle" fill="#263238">LegacyCustomerTranslator</text>
  <rect x="440" y="268" width="240" height="84" rx="4" fill="#ffffff" stroke="#f9a825"/>
  <text x="560" y="290" text-anchor="middle" fill="#263238">LegacyOrderProjector</text>
  <text x="560" y="310" text-anchor="middle" font-size="12" fill="#455a64">NW PD SH CN to NEW PAID ...</text>
  <text x="560" y="327" text-anchor="middle" font-size="12" fill="#455a64">NUMBER keys to uuid</text>
  <text x="560" y="344" text-anchor="middle" font-size="12" fill="#455a64">parent placeholders</text>
  <rect x="440" y="370" width="240" height="70" rx="4" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="560" y="392" text-anchor="middle" font-size="13" fill="#263238">one DB transaction per event</text>
  <text x="560" y="411" text-anchor="middle" font-size="12" fill="#455a64">processed_change (idempotency)</text>
  <text x="560" y="428" text-anchor="middle" font-size="12" fill="#455a64">+ ON CONFLICT upserts</text>

  <!-- topic to ACL arrows -->
  <line x1="375" y1="135" x2="438" y2="150" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="375" y1="185" x2="438" y2="170" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="375" y1="235" x2="438" y2="235" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="375" y1="285" x2="438" y2="300" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="375" y1="335" x2="438" y2="320" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>

  <!-- new tables -->
  <rect x="730" y="80" width="210" height="376" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="835" y="104" text-anchor="middle" font-size="13" fill="#455a64">database bookshop</text>
  <rect x="745" y="118" width="180" height="84" rx="4" fill="#ffffff" stroke="#2e7d32"/>
  <text x="835" y="140" text-anchor="middle" fill="#263238">book</text>
  <text x="835" y="164" text-anchor="middle" fill="#263238">author</text>
  <text x="835" y="188" text-anchor="middle" fill="#263238">book_author</text>
  <rect x="745" y="218" width="180" height="34" rx="4" fill="#ffffff" stroke="#2e7d32"/>
  <text x="835" y="240" text-anchor="middle" fill="#263238">customer</text>
  <rect x="745" y="268" width="180" height="84" rx="4" fill="#ffffff" stroke="#2e7d32"/>
  <text x="835" y="300" text-anchor="middle" fill="#263238">purchase_order</text>
  <text x="835" y="326" text-anchor="middle" fill="#263238">order_line</text>
  <rect x="745" y="370" width="180" height="70" rx="4" fill="#ffffff" stroke="#5e35b1"/>
  <text x="835" y="400" text-anchor="middle" fill="#263238">processed_change</text>
  <text x="835" y="420" text-anchor="middle" font-size="12" fill="#455a64">table + source position</text>

  <line x1="680" y1="160" x2="743" y2="160" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="680" y1="235" x2="743" y2="235" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="680" y1="310" x2="743" y2="310" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>
  <line x1="680" y1="405" x2="743" y2="405" stroke="#37474f" stroke-width="1.5" marker-end="url(#acsArr)"/>

  <!-- legend -->
  <rect x="20" y="480" width="920" height="60" rx="6" fill="#f5f5f5" stroke="#b0bec5"/>
  <text x="40" y="504" fill="#263238">Each table keeps its own topic and key, so ordering holds per row, not across tables.</text>
  <text x="40" y="526" fill="#263238">A line or an order that arrives before its parent creates a placeholder parent that the parent event completes.</text>
</svg>
