<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 423" width="1080" height="423" role="img" aria-labelledby="sap-hr-guide-query-effective-dated-employee-data-03-cds-watch-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-query-effective-dated-employee-data-03-cds-watch-title">Terminal after cds watch in the people-queries project: the log lists the model files, loads the four CSV files into an in-memory SQLite database, serves PeopleService at /odata/v4/people with the implementation srv/people-service.js and ends with server listening on http://localhost:4004; callout 6 marks the command</title>
<g><rect x="0" y="0" width="1080" height="423" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="391" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cds watch</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">[cds] - loaded model from 3 file(s):</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  app/annotations.cds</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  srv/people-service.cds</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  db/schema.cds</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">[cds] - connect to db &gt; sqlite { url: ':memory:' }</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  &gt; init from db/data/sap.guide.people-ParkingPermits.csv</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  &gt; init from db/data/sap.guide.people-OrganizationalAssignments.csv</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  &gt; init from db/data/sap.guide.people-Employees.csv</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  &gt; init from db/data/sap.guide.people-BasicPayRecords.csv</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">/&gt; successfully deployed to in-memory database.</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">[cds] - serving PeopleService {</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  at: [ '/odata/v4/people' ],</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  decl: 'srv/people-service.cds:6',</text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  impl: 'srv/people-service.js'</text>
<text x="16" y="377" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">}</text>
<text x="16" y="398" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">[cds] - server listening on { url: 'http://localhost:4004' }</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">6</text></g></g>
</svg>
