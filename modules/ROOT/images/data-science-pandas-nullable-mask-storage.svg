<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Nullable Int64 stores values and a mask, float64 stores NaN</title>
<desc id="d">The Int64 array [1, missing, 3] is stored as an int64 data array plus a Boolean mask. The float64 array is a single array in which NaN marks the missing slot and the integers become floats.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Missing slot: mask (Int64) versus NaN (float64)</text>
<text x="30" y="70" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">Int64</text>
<text x="30" y="90" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">two arrays</text>
<rect x="250" y="56" width="90" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="295.0" y="78.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">1</text>
<rect x="250" y="96" width="90" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="295.0" y="117.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">False</text>
<rect x="350" y="56" width="90" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="395.0" y="77.55" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">0 (ignored)</text>
<rect x="350" y="96" width="90" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="395.0" y="117.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">True</text>
<rect x="450" y="56" width="90" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="495.0" y="78.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">3</text>
<rect x="450" y="96" width="90" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="495.0" y="117.9" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">False</text>
<text x="240" y="78" font-size="12" font-weight="normal" fill="#475569" text-anchor="end" font-family="Arial, Helvetica, sans-serif">values</text>
<text x="240" y="118" font-size="12" font-weight="normal" fill="#475569" text-anchor="end" font-family="Arial, Helvetica, sans-serif">mask (True = missing)</text>
<text x="30" y="210" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">float64</text>
<text x="30" y="230" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">one array</text>
<rect x="250" y="196" width="90" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="295.0" y="218.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">1.0</text>
<rect x="350" y="196" width="90" height="34" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="395.0" y="218.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">NaN</text>
<rect x="450" y="196" width="90" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="495.0" y="218.25" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">3.0</text>
<text x="240" y="218" font-size="12" font-weight="normal" fill="#475569" text-anchor="end" font-family="Arial, Helvetica, sans-serif">values</text>
<line x1="30" y1="160" x2="690" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
<text x="30" y="276" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Int64 keeps 1 and 3 as integers and shows the gap as pd.NA.</text>
<text x="30" y="298" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">float64 can mark a gap only with NaN, so the integers become floats.</text>
<text x="30" y="320" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cost: one extra byte per element for the mask.</text>
<circle cx="558" cy="73" r="11" fill="#0F172A"/>
<text x="558" y="77.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>
<circle cx="558" cy="113" r="11" fill="#0F172A"/>
<text x="558" y="117.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text>
<circle cx="558" cy="213" r="11" fill="#0F172A"/>
<text x="558" y="217.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text>
</svg>
