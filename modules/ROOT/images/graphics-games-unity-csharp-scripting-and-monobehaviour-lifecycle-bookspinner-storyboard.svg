<svg viewBox="0 0 760 310" width="760" height="310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="310" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: write BookSpinner and see the book turn</text>
<rect x="30" y="52" width="164" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="48" cy="70" r="11" fill="#4F46E5"/>
<text x="48" y="74" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="124" y="74" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Create the script</text>
<rect x="44" y="92" width="136" height="22" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="112.0" y="106.5" text-anchor="middle" font-size="10" fill="#374151">Project window</text>
<rect x="44" y="120" width="136" height="22" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="112.0" y="134.5" text-anchor="middle" font-size="10" fill="#374151">Create &gt;</text>
<rect x="54" y="148" width="126" height="22" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="117.0" y="162.5" text-anchor="middle" font-size="10" fill="#3730A3">MonoBehaviour Script</text>
<rect x="44" y="180" width="136" height="24" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="112.0" y="195.5" text-anchor="middle" font-size="10" fill="#1F2937">BookSpinner.cs</text>
<text x="112" y="214" text-anchor="middle" font-size="10" fill="#374151">Assets &gt; Create &gt;</text>
<text x="112" y="228" text-anchor="middle" font-size="10" fill="#374151">Scripting &gt; MonoBehaviour</text>
<line x1="194" y1="150" x2="208" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="208" y="52" width="164" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="226" cy="70" r="11" fill="#4F46E5"/>
<text x="226" y="74" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="302" y="74" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Write the code</text>
<rect x="222" y="92" width="136" height="112" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="232" y="114" text-anchor="start" font-size="10" fill="#374151">class BookSpinner</text>
<text x="232" y="136" text-anchor="start" font-size="10" fill="#374151">  : MonoBehaviour</text>
<text x="232" y="158" text-anchor="start" font-size="10" fill="#374151">void Update()</text>
<text x="232" y="180" text-anchor="start" font-size="10" fill="#374151">  transform.Rotate(...)</text>
<text x="290" y="214" text-anchor="middle" font-size="10" fill="#374151">Open it in your IDE;</text>
<text x="290" y="228" text-anchor="middle" font-size="10" fill="#374151">the file name matches the class</text>
<line x1="372" y1="150" x2="386" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="386" y="52" width="164" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="70" r="11" fill="#4F46E5"/>
<text x="404" y="74" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="480" y="74" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Add the component</text>
<rect x="400" y="92" width="136" height="22" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="468.0" y="106.5" text-anchor="middle" font-size="10" fill="#374151">Inspector: Book</text>
<rect x="400" y="120" width="136" height="22" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<text x="468.0" y="134.5" text-anchor="middle" font-size="10" fill="#374151">Transform</text>
<rect x="400" y="148" width="136" height="22" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="468.0" y="162.5" text-anchor="middle" font-size="10" fill="#3730A3">Add Component</text>
<rect x="400" y="176" width="136" height="26" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="468.0" y="192.5" text-anchor="middle" font-size="10" fill="#1F2937">Book Spinner (Script)</text>
<text x="468" y="214" text-anchor="middle" font-size="10" fill="#374151">Select Book, then</text>
<text x="468" y="228" text-anchor="middle" font-size="10" fill="#374151">Add Component &gt; BookSpinner</text>
<line x1="550" y1="150" x2="564" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="564" y="52" width="164" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="582" cy="70" r="11" fill="#4F46E5"/>
<text x="582" y="74" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="658" y="74" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Press Play</text>
<rect x="578" y="92" width="136" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="646.0" y="118.5" text-anchor="middle" font-size="10" fill="#374151">Scene view</text>
<text x="646.0" y="132.5" text-anchor="middle" font-size="10" fill="#374151">book turning</text>
<rect x="578" y="162" width="136" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="646.0" y="178.5" text-anchor="middle" font-size="10" fill="#1F2937">Speed: 90</text>
<text x="646.0" y="192.5" text-anchor="middle" font-size="10" fill="#1F2937">Axis: 0, 1, 0</text>
<text x="646" y="214" text-anchor="middle" font-size="10" fill="#374151">The book turns; change</text>
<text x="646" y="228" text-anchor="middle" font-size="10" fill="#374151">Speed live in the Inspector</text>
<text x="380" y="274" text-anchor="middle" font-size="11" fill="#374151">Unity compiles the script when the Editor regains focus; the component is then available in Add Component.</text>
</svg>
