<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Wrapping and ejecting a theme component</title>
  <desc id="d">With a wrapper, the file in src/theme renders the original component through the theme-original alias. With an eject, the file in src/theme contains the full copied source and the original is no longer used.</desc>
  <rect x="0" y="0" width="760" height="340" rx="12" fill="#26323f"/>
  <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Wrap</text>
  <text x="570" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Eject</text>
  <line x1="380" y1="45" x2="380" y2="320" stroke="#9fb4c9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="50" y="55" width="280" height="50" rx="8" fill="#3d6a99" stroke="#cfe3f7" stroke-width="2"/>
  <text x="190" y="85" text-anchor="middle" font-size="13" fill="#ffffff">import Footer from '@theme/Footer'</text>
  <rect x="50" y="130" width="280" height="70" rx="8" fill="#8a5a2b" stroke="#f6dcc0" stroke-width="2"/>
  <text x="190" y="158" text-anchor="middle" font-size="14" fill="#ffffff">src/theme/Footer/index.tsx</text>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#fbe9d6">your wrapper: adds content, passes props</text>
  <rect x="50" y="225" width="280" height="70" rx="8" fill="#3b7d5a" stroke="#d3f0e0" stroke-width="2"/>
  <text x="190" y="253" text-anchor="middle" font-size="14" fill="#ffffff">@theme-original/Footer</text>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#e4f6ec">theme-classic version, still updated</text>
  <rect x="430" y="55" width="280" height="50" rx="8" fill="#3d6a99" stroke="#cfe3f7" stroke-width="2"/>
  <text x="570" y="85" text-anchor="middle" font-size="13" fill="#ffffff">import NotFound from '@theme/NotFound'</text>
  <rect x="430" y="130" width="280" height="70" rx="8" fill="#8a5a2b" stroke="#f6dcc0" stroke-width="2"/>
  <text x="570" y="158" text-anchor="middle" font-size="14" fill="#ffffff">src/theme/NotFound/index.tsx</text>
  <text x="570" y="180" text-anchor="middle" font-size="12" fill="#fbe9d6">full copy of the source, yours to maintain</text>
  <rect x="430" y="225" width="280" height="70" rx="8" fill="#5b4a8a" stroke="#ddd4f5" stroke-width="2"/>
  <text x="570" y="253" text-anchor="middle" font-size="14" fill="#ffffff">theme-classic original</text>
  <text x="570" y="275" text-anchor="middle" font-size="12" fill="#e6def8">not used for this component</text>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M190 105 L190 130"/><path d="M190 200 L190 225"/><path d="M570 105 L570 130"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4" fill="none"><path d="M570 200 L570 225"/></g>
</svg>
