<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
<title id="t">The WooCommerce release cycle</title>
<desc id="d">Five steps along a time line. Day 1 is feature freeze, which cuts the release branch and a dev build. One week later comes beta 1, one more week later beta 2, one more week later release candidate 1, and the final release follows one day after the candidate has been on a staging site for 24 hours. The cycle repeats about every five weeks, and patch releases with a non-zero third number ship between minor releases.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect x="24" y="70" width="156" height="150" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="#7f8c8d" stroke-width="1.8"></rect>
<text x="102.0" y="95" text-anchor="middle" font-size="13" opacity="0.9">Day 1</text>
<text x="102.0" y="122" text-anchor="middle" font-size="15" font-weight="bold">Feature freeze</text>
<text x="102.0" y="156" text-anchor="middle" font-size="12">release/x.y branch cut,</text>
<text x="102.0" y="176" text-anchor="middle" font-size="12">-dev build published</text>
<line x1="182" y1="145" x2="208" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="210" y="70" width="156" height="150" rx="12" fill="#3498db" fill-opacity="0.18" stroke="#3498db" stroke-width="1.8"></rect>
<text x="288.0" y="95" text-anchor="middle" font-size="13" opacity="0.9">+1 week</text>
<text x="288.0" y="122" text-anchor="middle" font-size="15" font-weight="bold">Beta 1</text>
<text x="288.0" y="156" text-anchor="middle" font-size="12">first public pre-release,</text>
<text x="288.0" y="176" text-anchor="middle" font-size="12">testing begins</text>
<line x1="368" y1="145" x2="394" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="396" y="70" width="156" height="150" rx="12" fill="#3498db" fill-opacity="0.18" stroke="#3498db" stroke-width="1.8"></rect>
<text x="474.0" y="95" text-anchor="middle" font-size="13" opacity="0.9">+2 weeks</text>
<text x="474.0" y="122" text-anchor="middle" font-size="15" font-weight="bold">Beta 2</text>
<text x="474.0" y="156" text-anchor="middle" font-size="12">fixes from beta 1,</text>
<text x="474.0" y="176" text-anchor="middle" font-size="12">Beta Tester plugin</text>
<line x1="554" y1="145" x2="580" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="582" y="70" width="156" height="150" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="#e67e22" stroke-width="1.8"></rect>
<text x="660.0" y="95" text-anchor="middle" font-size="13" opacity="0.9">+3 weeks</text>
<text x="660.0" y="122" text-anchor="middle" font-size="15" font-weight="bold">Release candidate 1</text>
<text x="660.0" y="156" text-anchor="middle" font-size="12">on staging for 24 hours</text>
<text x="660.0" y="176" text-anchor="middle" font-size="12">before the final</text>
<line x1="740" y1="145" x2="766" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="768" y="70" width="156" height="150" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="#2ecc71" stroke-width="1.8"></rect>
<text x="846.0" y="95" text-anchor="middle" font-size="13" opacity="0.9">+3 weeks, 1 day</text>
<text x="846.0" y="122" text-anchor="middle" font-size="15" font-weight="bold">Final x.y.0</text>
<text x="846.0" y="156" text-anchor="middle" font-size="12">tagged, zip published on</text>
<text x="846.0" y="176" text-anchor="middle" font-size="12">WordPress.org, announced</text>
<text x="480" y="36" text-anchor="middle" font-size="16" font-weight="bold">One minor release: about three weeks from freeze to final, a new freeze about every five weeks</text>
<line x1="24" y1="262" x2="936" y2="262" stroke="currentColor" stroke-width="1.5"/>
<text x="480" y="290" text-anchor="middle" font-size="13">Patch releases x.y.z (z above zero) ship between minors for regressions and security fixes; there is no distinction between major and minor numbers.</text>
<text x="480" y="312" text-anchor="middle" font-size="12" opacity="0.85">Observed gaps between x.y.0 releases from 9.0 to 11.2: 21 to 62 days, mean 38 days.</text>
</svg>
