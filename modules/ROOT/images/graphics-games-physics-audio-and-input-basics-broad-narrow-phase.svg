<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pbn-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="pbn-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="pbn-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="pbn-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Collision detection in three steps</text>
<rect x="15" y="48" width="230" height="300" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="37" cy="70" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="37" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="57" y="75" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Broad phase</text>
<rect x="265" y="48" width="230" height="300" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="287" cy="70" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="287" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="307" y="75" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Narrow phase</text>
<rect x="515" y="48" width="230" height="300" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="537" cy="70" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="537" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="557" y="75" text-anchor="start" font-size="14" fill="#1F2937" font-weight="bold">Resolve</text>
<circle cx="70" cy="150" r="22" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="48" y="128" width="44" height="44" rx="0" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="110" cy="170" r="22" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="88" y="148" width="44" height="44" rx="0" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="200" cy="130" r="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="182" y="112" width="36" height="36" rx="0" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="142" y="200" width="32" height="30" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="140" y="198" width="36" height="34" rx="0" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="35" y1="270" x2="225" y2="270" stroke="#4B5563" stroke-width="1.5"/>
<line x1="48" y1="254" x2="132" y2="254" stroke="#B45309" stroke-width="4"/>
<line x1="88" y1="264" x2="132" y2="264" stroke="#B45309" stroke-width="4"/>
<line x1="182" y1="244" x2="218" y2="244" stroke="#4B5563" stroke-width="4"/>
<line x1="140" y1="282" x2="176" y2="282" stroke="#4B5563" stroke-width="4"/>
<text x="130" y="300" text-anchor="middle" font-size="11" fill="#374151">sort interval starts on one axis;</text>
<text x="130" y="315" text-anchor="middle" font-size="11" fill="#374151">overlaps become candidate pairs</text>
<text x="130" y="336" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">cheap tests, many pairs dropped</text>
<path d="M300,160 L360,140 L385,190 L330,215 Z" fill="#EEF2FF" stroke="#EEF2FF" stroke-width="1.5"/>
<path d="M300,160 L360,140 L385,190 L330,215 Z" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
<path d="M365,175 L430,160 L450,215 L385,235 Z" fill="#FEF3C7" stroke="#FEF3C7" stroke-width="1.5"/>
<path d="M365,175 L430,160 L450,215 L385,235 Z" fill="none" stroke="#B45309" stroke-width="1.5"/>
<circle cx="378" cy="195" r="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<line x1="378" y1="195" x2="340" y2="225" stroke="#047857" stroke-width="2" marker-end="url(#pbn-ag)"/>
<text x="333" y="245" text-anchor="end" font-size="11" fill="#047857" font-weight="bold">normal n</text>
<text x="450" y="262" text-anchor="end" font-size="11" fill="#92400E" font-weight="bold">depth d</text>
<text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151">SAT or GJK plus EPA per pair</text>
<text x="380" y="316" text-anchor="middle" font-size="11" fill="#374151">give point, normal and depth</text>
<text x="380" y="336" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">exact tests, few pairs</text>
<rect x="540" y="175" width="70" height="50" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="640" y="175" width="70" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<line x1="540" y1="150" x2="575" y2="150" stroke="#047857" stroke-width="2" marker-end="url(#pbn-ag)"/>
<line x1="710" y1="150" x2="675" y2="150" stroke="#047857" stroke-width="2" marker-end="url(#pbn-ag)"/>
<text x="625" y="144" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">impulse j along n</text>
<line x1="575" y1="250" x2="540" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbn-ah)"/>
<line x1="675" y1="250" x2="710" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbn-ah)"/>
<text x="625" y="254" text-anchor="middle" font-size="11" fill="#374151">velocities after</text>
<text x="630" y="300" text-anchor="middle" font-size="11" fill="#374151">impulses with friction</text>
<text x="630" y="316" text-anchor="middle" font-size="11" fill="#374151">and restitution, then integrate</text>
<text x="630" y="336" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">x and v advance one fixed step</text>
<line x1="245" y1="198" x2="265" y2="198" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbn-ah)"/>
<line x1="495" y1="198" x2="515" y2="198" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbn-ah)"/>
<text x="380" y="380" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Each stage removes work for the next: N bodies have about N x N / 2 pairs, but few touch</text>
<text x="380" y="400" text-anchor="middle" font-size="11" fill="#4B5563">Triggers run the same detection but skip the resolve step and only report overlap events</text>
</svg>
