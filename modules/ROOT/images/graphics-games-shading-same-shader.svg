<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The same Lambert fragment shader in four languages</text>
<rect x="24" y="50" width="344" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.8"/>
<text x="38" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">GLSL 3.30 (OpenGL)</text>
<text x="38" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">#version 330 core</text>
<text x="38" y="111.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">in vec3 vNormal;</text>
<text x="38" y="127" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">uniform vec3 uLightDir;</text>
<text x="38" y="142.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">out vec4 oColor;</text>
<text x="38" y="158" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">void main() {</text>
<text x="38" y="173.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  vec3 n = normalize(vNormal);</text>
<text x="38" y="189" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float d = max(dot(n, uLightDir), 0.0);</text>
<text x="38" y="204.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  oColor = vec4(vec3(d), 1.0);</text>
<text x="38" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<rect x="388" y="50" width="344" height="190" rx="10" fill="#F9FAFB" stroke="#B45309" stroke-width="1.8"/>
<text x="402" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">HLSL (Direct3D 12, Vulkan via DXC)</text>
<text x="402" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">cbuffer Frame : register(b0) {</text>
<text x="402" y="111.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float3 uLightDir;</text>
<text x="402" y="127" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">};</text>
<text x="402" y="142.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">float4 main(float3 vNormal : NORMAL)</text>
<text x="402" y="158" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    : SV_Target {</text>
<text x="402" y="173.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float3 n = normalize(vNormal);</text>
<text x="402" y="189" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float d = max(dot(n, uLightDir), 0.0);</text>
<text x="402" y="204.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  return float4(d.xxx, 1.0);</text>
<text x="402" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<rect x="24" y="254" width="344" height="190" rx="10" fill="#F9FAFB" stroke="#047857" stroke-width="1.8"/>
<text x="38" y="276" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">MSL (Metal)</text>
<text x="38" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">#include &lt;metal_stdlib&gt;</text>
<text x="38" y="315.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">using namespace metal;</text>
<text x="38" y="331" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">struct In { float3 normal; };</text>
<text x="38" y="346.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">fragment float4 fs(In in [[stage_in]],</text>
<text x="38" y="362" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    constant float3 &amp;lightDir [[buffer(0)]]) {</text>
<text x="38" y="377.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float3 n = normalize(in.normal);</text>
<text x="38" y="393" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  float d = max(dot(n, lightDir), 0.0);</text>
<text x="38" y="408.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  return float4(float3(d), 1.0);</text>
<text x="38" y="424" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<rect x="388" y="254" width="344" height="190" rx="10" fill="#F9FAFB" stroke="#3730A3" stroke-width="1.8"/>
<text x="402" y="276" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">WGSL (WebGPU)</text>
<text x="402" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">@group(0) @binding(0)</text>
<text x="402" y="315.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">var&lt;uniform&gt; uLightDir: vec3f;</text>
<text x="402" y="331" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">@fragment</text>
<text x="402" y="346.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">fn fs(@location(0) vNormal: vec3f)</text>
<text x="402" y="362" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    -&gt; @location(0) vec4f {</text>
<text x="402" y="377.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  let n = normalize(vNormal);</text>
<text x="402" y="393" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  let d = max(dot(n, uLightDir), 0.0);</text>
<text x="402" y="408.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  return vec4f(vec3f(d), 1.0);</text>
<text x="402" y="424" font-size="11" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
<text x="380" y="462" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Same maths, different spelling: only types, bindings and entry-point syntax change.</text>
</svg>
