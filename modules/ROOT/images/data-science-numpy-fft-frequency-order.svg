<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<title>Frequency ordering of np.fft.fft output and fftshift</title>
<desc>Eight output bins of fft for n=8 and d=1 shown in raw order (zero frequency first, negative frequencies in the second half) and after fftshift (ascending frequency).</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Frequency order of an 8-point FFT (n=8, d=1)</text>
<text x="30" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">fft / fftfreq order</text>
<rect x="30" y="90" width="75" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="67.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">0</text>
<text x="67.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 0</text>
<rect x="113" y="90" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="150.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1/8</text>
<text x="150.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 1</text>
<rect x="196" y="90" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="233.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2/8</text>
<text x="233.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 2</text>
<rect x="279" y="90" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="316.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3/8</text>
<text x="316.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 3</text>
<rect x="362" y="90" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="399.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-4/8</text>
<text x="399.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 4</text>
<rect x="445" y="90" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="482.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-3/8</text>
<text x="482.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 5</text>
<rect x="528" y="90" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="565.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-2/8</text>
<text x="565.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 6</text>
<rect x="611" y="90" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="648.5" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-1/8</text>
<text x="648.5" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 7</text>
<text x="30" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Positive frequencies (teal) come first, the Nyquist bin is reported as negative (-4/8),</text>
<text x="30" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">then the rest of the negative frequencies (rose).</text>
<line x1="360" y1="182" x2="360" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="372" y="202" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">fftshift</text>
<text x="30" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">after fftshift</text>
<rect x="30" y="240" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="67.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-4/8</text>
<text x="67.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 4</text>
<rect x="113" y="240" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="150.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-3/8</text>
<text x="150.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 5</text>
<rect x="196" y="240" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="233.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-2/8</text>
<text x="233.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 6</text>
<rect x="279" y="240" width="75" height="56" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="316.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">-1/8</text>
<text x="316.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 7</text>
<rect x="362" y="240" width="75" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="399.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">0</text>
<text x="399.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 0</text>
<rect x="445" y="240" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="482.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1/8</text>
<text x="482.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 1</text>
<rect x="528" y="240" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="565.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2/8</text>
<text x="565.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 2</text>
<rect x="611" y="240" width="75" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="648.5" y="264" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3/8</text>
<text x="648.5" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">bin 3</text>
<text x="30" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Zero frequency (amber) moves to the centre; ifftshift undoes the shift.</text>
<text x="30" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Frequencies are in cycles per sample (multiply by 1/d).</text>
</svg>
