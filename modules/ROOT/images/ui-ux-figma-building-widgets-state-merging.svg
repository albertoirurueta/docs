<svg viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two readers write at the same time: what survives</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
<rect x="20" y="50" width="225" height="250" rx="10"/><rect x="267" y="50" width="225" height="250" rx="10"/><rect x="514" y="50" width="226" height="250" rx="10"/></g>
<g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">
<text x="132" y="76">One state object</text><text x="380" y="76">Separate states</text><text x="627" y="76">A synced map</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="132" y="100">useSyncedState with</text><text x="132" y="116">one object value</text>
<text x="380" y="100">One useSyncedState</text><text x="380" y="116">call per value</text>
<text x="627" y="100">useSyncedMap keyed</text><text x="627" y="116">by a reader id</text></g>
<g stroke="#E5E7EB" stroke-width="1"><line x1="35" y1="130" x2="230" y2="130"/><line x1="282" y1="130" x2="477" y2="130"/><line x1="529" y1="130" x2="724" y2="130"/></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="132" y="154">Lena sets the title</text><text x="132" y="172">Omar sets the page</text>
<text x="380" y="154">Lena sets the title</text><text x="380" y="172">Omar sets the page</text>
<text x="627" y="154">Lena saves page 40</text><text x="627" y="172">Omar saves page 75</text></g>
<rect x="40" y="195" width="185" height="50" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="132" y="217" font-size="12" fill="#B91C1C" text-anchor="middle">Whole object replaced:</text><text x="132" y="234" font-size="12" fill="#B91C1C" text-anchor="middle">one write wins</text>
<rect x="287" y="195" width="185" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="217" font-size="12" fill="#047857" text-anchor="middle">Different keys:</text><text x="380" y="234" font-size="12" fill="#047857" text-anchor="middle">both changes kept</text>
<rect x="534" y="195" width="186" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="627" y="217" font-size="12" fill="#047857" text-anchor="middle">Different keys:</text><text x="627" y="234" font-size="12" fill="#047857" text-anchor="middle">both entries kept</text>
<g font-size="12" fill="#4B5563" text-anchor="middle">
<text x="132" y="268" >Use when values must be</text><text x="132" y="284">valid only together</text>
<text x="380" y="268">Default for independent</text><text x="380" y="284">values</text>
<text x="627" y="268">Same key still resolves</text><text x="627" y="284">to the last writer</text></g>
<text x="380" y="324" font-size="12" fill="#4B5563" text-anchor="middle">Bookshelf reading-progress widget: the reader names are examples only.</text>
</svg>
