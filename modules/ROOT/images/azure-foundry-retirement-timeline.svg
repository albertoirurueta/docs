<svg viewBox="0 0 820 440" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Foundry Tools retirements and end-of-support dates, 2025 to 2029</text>

  <!-- year axis: 2025 at x=60, each year 150px -->
  <line x1="60" y1="220" x2="790" y2="220" stroke="#37474f" stroke-width="2"/>
  <g font-size="12" font-weight="700" fill="#37474f" text-anchor="middle">
    <line x1="60" y1="212" x2="60" y2="228" stroke="#37474f" stroke-width="2"/><text x="60" y="246">2025</text>
    <line x1="210" y1="212" x2="210" y2="228" stroke="#37474f" stroke-width="2"/><text x="210" y="246">2026</text>
    <line x1="360" y1="212" x2="360" y2="228" stroke="#37474f" stroke-width="2"/><text x="360" y="246">2027</text>
    <line x1="510" y1="212" x2="510" y2="228" stroke="#37474f" stroke-width="2"/><text x="510" y="246">2028</text>
    <line x1="660" y1="212" x2="660" y2="228" stroke="#37474f" stroke-width="2"/><text x="660" y="246">2029</text>
  </g>

  <!-- today marker 2026-10-06 ~ x=210+150*0.76=324 -->
  <line x1="324" y1="56" x2="324" y2="400" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="328" y="66" font-size="10" fill="#616161">baseline 2026-10-06</text>

  <!-- Legend -->
  <rect x="560" y="48" width="12" height="12" fill="#c62828"/>
  <text x="578" y="58" font-size="10.5" fill="#263238">retired (gone)</text>
  <rect x="660" y="48" width="12" height="12" fill="#ef6c00"/>
  <text x="678" y="58" font-size="10.5" fill="#263238">deprecated, end date ahead</text>

  <!-- Retired markers above axis -->
  <g font-size="10" fill="#263238">
    <!-- 2025-03-31 x=60+150*0.25=97 -->
    <circle cx="97" cy="220" r="5" fill="#c62828"/>
    <line x1="97" y1="215" x2="97" y2="98" stroke="#c62828" stroke-width="1"/>
    <text x="100" y="70">2025-03-31: QnA Maker,</text>
    <text x="100" y="82">background removal,</text>
    <text x="100" y="94">Product Recognition</text>

    <!-- 2025-07 / 09-30 / 10 x~ 60+150*0.75=172 -->
    <circle cx="172" cy="220" r="5" fill="#c62828"/>
    <line x1="172" y1="215" x2="172" y2="158" stroke="#c62828" stroke-width="1"/>
    <text x="110" y="130">Jul to Oct 2025: pronunciation</text>
    <text x="110" y="142">content assessment, Speaker</text>
    <text x="110" y="154">Recognition, intent recognition</text>

    <!-- 2026-03-31 x=210+37=247 -->
    <circle cx="247" cy="220" r="5" fill="#c62828"/>
    <line x1="247" y1="215" x2="247" y2="196" stroke="#c62828" stroke-width="1"/>
    <text x="214" y="190">2026-03-31: LUIS, STT v3.x</text>

    <!-- 2026-10-01 x=210+150*0.75=322 -->
    <circle cx="320" cy="220" r="5" fill="#c62828"/>
    <line x1="320" y1="215" x2="320" y2="120" stroke="#c62828" stroke-width="1"/>
    <text x="336" y="114">2026-10-01: Anomaly Detector,</text>
    <text x="336" y="126">Personalizer, Metrics Advisor</text>
  </g>

  <!-- Deprecated markers below axis -->
  <g font-size="10" fill="#263238">
    <!-- 2027-03-15/20/31 x=360+37=397 -->
    <circle cx="397" cy="220" r="5" fill="#ef6c00"/>
    <line x1="397" y1="225" x2="397" y2="276" stroke="#ef6c00" stroke-width="1"/>
    <text x="300" y="290">Mar 2027: Content Moderator (15),</text>
    <text x="300" y="302">Language Studio (20),</text>
    <text x="300" y="314">classic agents (31)</text>

    <!-- 2027-09-15 x=360+105=465 -->
    <circle cx="465" cy="220" r="5" fill="#ef6c00"/>
    <line x1="465" y1="225" x2="465" y2="336" stroke="#ef6c00" stroke-width="1"/>
    <text x="420" y="350">2027-09-15: Document</text>
    <text x="420" y="362">Intelligence v2.1</text>

    <!-- 2028-09-01/25 x=510+150*0.68=612 -->
    <circle cx="612" cy="220" r="5" fill="#ef6c00"/>
    <line x1="612" y1="225" x2="612" y2="270" stroke="#ef6c00" stroke-width="1"/>
    <text x="560" y="284">Sep 2028: entity linking (1),</text>
    <text x="560" y="296">Image Analysis 3.2/4.0,</text>
    <text x="560" y="308">Custom Vision (25)</text>

    <!-- 2029-03-30/31 x=660+37=697 -->
    <circle cx="697" cy="220" r="5" fill="#ef6c00"/>
    <line x1="697" y1="225" x2="697" y2="336" stroke="#ef6c00" stroke-width="1"/>
    <text x="600" y="350">Mar 2029: Document Intelligence</text>
    <text x="600" y="362">v3.0 (30), Language legacy</text>
    <text x="600" y="374">features (31)</text>
  </g>

  <text x="410" y="420" text-anchor="middle" font-size="10.5" fill="#455a64">Replacements: CLU, custom question answering, Content Safety, Foundry portal, Document Intelligence v4.0, Content Understanding, Foundry Models</text>
</svg>
