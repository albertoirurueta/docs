<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How an order reaches a WooCommerce Analytics report</title>
  <desc id="d">An order that is created, updated, refunded or trashed is copied into the Analytics lookup tables by Action Scheduler actions in the group wc-admin-data: either one wc-admin_import_orders action per order (immediate updates), or a recurring wc-admin_process_pending_orders_batch action every 12 hours (scheduled updates), or the batch actions of a historical import. The lookup tables are wc_order_stats, wc_order_product_lookup, wc_order_coupon_lookup, wc_order_tax_lookup and wc_customer_lookup. The wc-analytics REST controllers read them, cache the result and return it to the React reports. A CSV export is a second path: the export request queues batches of the action woocommerce_admin_report_export that write a file under uploads/woocommerce_uploads/reports and a download link.</desc>
  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">From an order to a report row, and from a report to a CSV file</text>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="56" width="170" height="250" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="80" font-size="14" font-weight="bold">Orders</text>
    <text x="32" y="106">shop_order and</text>
    <text x="32" y="122">shop_order_refund</text>
    <text x="32" y="152">created, updated,</text>
    <text x="32" y="168">refunded, trashed</text>
    <text x="32" y="198">in wc_orders (HPOS)</text>
    <text x="32" y="214">or wp_posts</text>
    <text x="32" y="250" fill="#f4b860">Hooks:</text>
    <text x="32" y="268" fill="#f4b860" font-size="11">woocommerce_update_order</text>
    <text x="32" y="284" fill="#f4b860" font-size="11">woocommerce_refund_created</text>

    <rect x="214" y="56" width="236" height="250" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="226" y="80" font-size="14" font-weight="bold">Action Scheduler</text>
    <text x="226" y="96" fill="#f4b860">group wc-admin-data</text>
    <text x="226" y="120" font-weight="bold">Immediately (Updates option)</text>
    <text x="226" y="136">wc-admin_import_orders,</text>
    <text x="226" y="152">one action per order</text>
    <text x="226" y="178" font-weight="bold">Scheduled (recommended)</text>
    <text x="226" y="194">wc-admin_process_pending_</text>
    <text x="226" y="210">orders_batch, every 12 hours,</text>
    <text x="226" y="226">100 orders per batch</text>
    <text x="226" y="252" font-weight="bold">Historical import</text>
    <text x="226" y="268">import_batch_init, then</text>
    <text x="226" y="284">import_batch, 25 per action</text>

    <rect x="474" y="56" width="190" height="250" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="486" y="80" font-size="14" font-weight="bold">Lookup tables</text>
    <text x="486" y="106">wc_order_stats</text>
    <text x="486" y="126">wc_order_product_lookup</text>
    <text x="486" y="146">wc_order_coupon_lookup</text>
    <text x="486" y="166">wc_order_tax_lookup</text>
    <text x="486" y="186">wc_customer_lookup</text>
    <text x="486" y="216">One row per order, line,</text>
    <text x="486" y="232">coupon or tax line, built</text>
    <text x="486" y="248">for fast SQL</text>
    <text x="486" y="284" fill="#f4b860">Reports never read orders</text>

    <rect x="688" y="56" width="160" height="250" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="700" y="80" font-size="14" font-weight="bold">REST wc-analytics</text>
    <text x="700" y="106">reports/orders</text>
    <text x="700" y="122">reports/orders/stats</text>
    <text x="700" y="138">reports/revenue/stats</text>
    <text x="700" y="154">reports/products ...</text>
    <text x="700" y="184">Data stores build the</text>
    <text x="700" y="200">SQL; PHP clause filters</text>
    <text x="700" y="216">hook in here</text>
    <text x="700" y="246">The result is cached;</text>
    <text x="700" y="262">the key holds the query</text>
    <text x="700" y="278">arguments</text>

    <rect x="872" y="56" width="110" height="250" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="882" y="80" font-size="14" font-weight="bold">Browser</text>
    <text x="882" y="106">React reports:</text>
    <text x="882" y="122">Overview,</text>
    <text x="882" y="138">Orders,</text>
    <text x="882" y="154">Revenue ...</text>
    <text x="882" y="184">JS filters add</text>
    <text x="882" y="200">dropdowns,</text>
    <text x="882" y="216">columns,</text>
    <text x="882" y="232">currency</text>
    <text x="882" y="262">Download starts</text>
    <text x="882" y="278">an export</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="190" y1="130" x2="212" y2="130" marker-end="url(#a)"/>
    <line x1="450" y1="130" x2="472" y2="130" marker-end="url(#a)"/>
    <line x1="664" y1="130" x2="686" y2="130" marker-end="url(#a)"/>
    <line x1="848" y1="130" x2="870" y2="130" marker-end="url(#a)"/>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <rect x="20" y="330" width="960" height="206" rx="10" fill="#34495e" stroke="#f2f5f8"/>
    <text x="34" y="354" font-size="14" font-weight="bold">CSV export: the same REST controllers, run in the background</text>
    <rect x="34" y="368" width="200" height="64" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="46" y="390">POST reports/{type}/export</text>
    <text x="46" y="408">report_args, email true or false</text>
    <rect x="270" y="368" width="220" height="64" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="282" y="390">Action Scheduler batches of</text>
    <text x="282" y="408">woocommerce_admin_report_export</text>
    <rect x="526" y="368" width="200" height="64" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="538" y="390">uploads/woocommerce_uploads/</text>
    <text x="538" y="408">reports/wc-orders-report-...csv</text>
    <rect x="762" y="368" width="200" height="64" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="774" y="390">Download link (admin_init),</text>
    <text x="774" y="408">kept for one week</text>
    <g stroke="#f2f5f8" stroke-width="2" fill="none">
      <line x1="234" y1="400" x2="268" y2="400" marker-end="url(#a)"/>
      <line x1="490" y1="400" x2="524" y2="400" marker-end="url(#a)"/>
      <line x1="726" y1="400" x2="760" y2="400" marker-end="url(#a)"/>
    </g>
    <text x="34" y="462">Export columns come from woocommerce_report_orders_export_columns and woocommerce_report_orders_prepare_export_item (orders report).</text>
    <text x="34" y="482">Batches run with no query string and no REST request, so arguments must travel in report_args and the scheduled action arguments.</text>
    <text x="34" y="502">Settings that change the numbers: excluded statuses, actionable statuses, date type (date_paid by default), Updates (scheduled or immediate).</text>
    <text x="34" y="522">Clear analytics cache and the import and delete controls live in WooCommerce > Status > Tools and Analytics > Settings.</text>
  </g>
</svg>
