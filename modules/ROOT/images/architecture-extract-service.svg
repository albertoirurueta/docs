<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Extracting a service: Orders leaves the monolith</text>

  <defs>
    <marker id="es-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="es-arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7a3b8f"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="320" y="46" width="140" height="34" rx="7" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="390" y="68" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Client request</text>

  <line x1="390" y1="80" x2="390" y2="104" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#es-arrow)"/>

  <!-- Gateway -->
  <rect x="270" y="106" width="240" height="38" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="390" y="130" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">API Gateway (routing)</text>

  <!-- Gateway to monolith -->
  <path d="M330,144 L215,196" stroke="#2d6a34" stroke-width="2" marker-end="url(#es-arrow)" fill="none"/>
  <text x="220" y="168" font-size="9.5" fill="#2d6a34" text-anchor="middle">everything else</text>

  <!-- Gateway to service -->
  <path d="M450,144 L590,196" stroke="#7a3b8f" stroke-width="2" marker-end="url(#es-arrow-purple)" fill="none"/>
  <text x="600" y="168" font-size="9.5" fill="#7a3b8f" text-anchor="middle">/api/orders/**</text>

  <!-- Monolith box -->
  <rect x="55" y="198" width="320" height="270" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="215" y="220" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop (monolith)</text>

  <rect x="75" y="232" width="130" height="42" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="140" y="257" font-size="10.5" fill="#222222" text-anchor="middle">Catalogue module</text>

  <rect x="215" y="232" width="140" height="42" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="285" y="257" font-size="10.5" fill="#222222" text-anchor="middle">Payments module</text>

  <rect x="75" y="284" width="130" height="42" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="140" y="309" font-size="10.5" fill="#222222" text-anchor="middle">Customers module</text>

  <rect x="215" y="284" width="140" height="42" rx="6" fill="#fafafa" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="285" y="303" font-size="10" fill="#777777" text-anchor="middle">Orders module</text>
  <text x="285" y="316" font-size="9" fill="#999999" text-anchor="middle">(extracted -- no longer here)</text>

  <rect x="75" y="344" width="280" height="38" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="215" y="367" font-size="10" fill="#222222" text-anchor="middle">bookshop database (Catalogue, Payments, Customers)</text>

  <text x="215" y="420" font-size="9.5" fill="#666666" text-anchor="middle">Domain logic already isolated behind a</text>
  <text x="215" y="434" font-size="9.5" fill="#666666" text-anchor="middle">module boundary before extraction</text>

  <!-- Service box: vertical slice -->
  <rect x="460" y="198" width="265" height="270" rx="10" fill="#f5eef8" stroke="#7a3b8f" stroke-width="2"/>
  <text x="592" y="220" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop-orders (service)</text>

  <rect x="480" y="232" width="225" height="36" rx="6" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.4"/>
  <text x="592" y="255" font-size="10.5" fill="#222222" text-anchor="middle">Inbound adapter (REST + listener)</text>

  <rect x="480" y="274" width="225" height="36" rx="6" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.4"/>
  <text x="592" y="297" font-size="10.5" fill="#222222" text-anchor="middle">Domain logic</text>

  <rect x="480" y="316" width="225" height="36" rx="6" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.4"/>
  <text x="592" y="339" font-size="10.5" fill="#222222" text-anchor="middle">Outbound adapter (repository, publisher)</text>

  <rect x="480" y="358" width="225" height="36" rx="6" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.4"/>
  <text x="592" y="381" font-size="10.5" fill="#222222" text-anchor="middle">orders database (own schema)</text>

  <text x="592" y="420" font-size="9.5" fill="#666666" text-anchor="middle">Same vertical slice for every</text>
  <text x="592" y="434" font-size="9.5" fill="#666666" text-anchor="middle">capability extracted this way</text>

  <!-- Integration glue: the extracted Orders service reaches the monolith's Payments and Catalogue through its ports -->
  <path d="M480,248 L355,255" stroke="#333333" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#es-arrow)" fill="none"/>
  <text x="418" y="238" font-size="9" fill="#333333" text-anchor="middle">PaymentsService</text>
  <text x="418" y="249" font-size="9" fill="#333333" text-anchor="middle">(commands)</text>

  <path d="M480,300 L355,290" stroke="#333333" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#es-arrow)" fill="none"/>
  <text x="418" y="312" font-size="9" fill="#333333" text-anchor="middle">CatalogueEntryRepository</text>
  <text x="418" y="323" font-size="9" fill="#333333" text-anchor="middle">(queries: REST or replica)</text>

  <text x="390" y="500" font-size="10.5" fill="#666666" text-anchor="middle">The gateway, the integration glue, and the vertical slice are the same three moving parts for every extraction.</text>
</svg>
