<svg viewBox="0 0 760 385" width="760" height="385" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Composing a YouTube thumbnail for a Bookshelf video</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="385" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Composing a YouTube thumbnail for a Bookshelf video</text>
<rect x="60" y="50" width="480" height="270" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<rect x="80" y="70" width="440" height="230" rx="2" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="110.0" y="166.8" width="19.200000000000003" height="83.2" fill="#4F46E5"/>
<rect x="132.4" y="147.6" width="19.200000000000003" height="102.4" fill="#B45309"/>
<rect x="154.8" y="179.6" width="19.200000000000003" height="70.4" fill="#4F46E5"/>
<rect x="177.2" y="157.2" width="19.200000000000003" height="92.80000000000001" fill="#1F2937"/>
<line x1="100.4" y1="250" x2="206.0" y2="250" stroke="#1F2937" stroke-width="4.800000000000001"/>
<rect x="250" y="95" width="240" height="22" rx="2" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<rect x="250" y="125" width="200" height="22" rx="2" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<rect x="250" y="165" width="150" height="12" rx="2" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="1"/>
<rect x="250" y="258" width="130" height="30" rx="15" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="315" y="278" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Read it free</text>
<rect x="470" y="292" width="58" height="22" rx="3" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="499" y="308" font-size="11" fill="#FFFFFF" text-anchor="middle">12:34</text>
<rect x="470" y="270" width="60" height="22" rx="3" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="572" cy="80" r="11" fill="#4F46E5"/><text x="572" y="84" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="590" y="84" font-size="11" fill="#374151" text-anchor="start">Three to five words,</text>
<text x="590" y="98" font-size="11" fill="#374151" text-anchor="start">large and high contrast</text>
<text x="590" y="112" font-size="11" fill="#374151" text-anchor="start"></text>
<circle cx="572" cy="138" r="11" fill="#4F46E5"/><text x="572" y="142" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="590" y="142" font-size="11" fill="#374151" text-anchor="start">One focal image, not</text>
<text x="590" y="156" font-size="11" fill="#374151" text-anchor="start">a collage</text>
<text x="590" y="170" font-size="11" fill="#374151" text-anchor="start"></text>
<circle cx="572" cy="196" r="11" fill="#4F46E5"/><text x="572" y="200" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="590" y="200" font-size="11" fill="#374151" text-anchor="start">Brand colours from the</text>
<text x="590" y="214" font-size="11" fill="#374151" text-anchor="start">kit</text>
<text x="590" y="228" font-size="11" fill="#374151" text-anchor="start"></text>
<circle cx="572" cy="254" r="11" fill="#B45309"/><text x="572" y="258" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="590" y="258" font-size="11" fill="#374151" text-anchor="start">Keep the corner free</text>
<text x="590" y="272" font-size="11" fill="#374151" text-anchor="start">for the duration badge</text>
<text x="590" y="286" font-size="11" fill="#374151" text-anchor="start"></text>
<circle cx="240" cy="106" r="9" fill="#4F46E5"/><text x="240" y="110" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<circle cx="150" cy="150" r="9" fill="#4F46E5"/><text x="150" y="154" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<circle cx="75" cy="65" r="9" fill="#4F46E5"/><text x="75" y="69" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<circle cx="460" cy="281" r="9" fill="#B45309"/><text x="460" y="285" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="300" y="342" font-size="11" fill="#6B7280" text-anchor="middle">16:9 frame. Dashed line = safe area for the title and the focal image.</text>
  <text x="380" y="367" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
