<svg viewBox="0 0 760 482" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="482" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a prompt</text>
  <text x="380" y="47" font-size="11.5" fill="#666666" text-anchor="middle">A DocsAssistant request to answer a question about this site's AsciiDoc pages</text>

  <!-- Role block -->
  <g>
    <rect x="40" y="66" width="680" height="52" rx="6" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="60" y="87" font-size="12.5" font-weight="bold" fill="#1c4b73">Role (system / developer)</text>
    <text x="60" y="105" font-size="11" fill="#333333">"You are DocsAssistant, an assistant that answers questions about the Irurueta Docs Antora site."</text>
  </g>

  <!-- Instructions block -->
  <g>
    <rect x="40" y="128" width="680" height="60" rx="6" fill="#eef7ee" stroke="#2f5424" stroke-width="1.4"/>
    <text x="60" y="149" font-size="12.5" font-weight="bold" fill="#2f5424">Instructions</text>
    <text x="60" y="167" font-size="11" fill="#333333">"Answer using only the &lt;context&gt; below. Cite the page title. If the context does not</text>
    <text x="60" y="182" font-size="11" fill="#333333">answer the question, say so instead of guessing."</text>
  </g>

  <!-- Context block -->
  <g>
    <rect x="40" y="198" width="680" height="86" rx="6" fill="#fdf6e8" stroke="#7a5b12" stroke-width="1.4"/>
    <text x="60" y="219" font-size="12.5" font-weight="bold" fill="#7a5b12">Context (retrieved / background material)</text>
    <rect x="60" y="230" width="640" height="46" rx="4" fill="#ffffff" stroke="#d9c68f" stroke-width="1"/>
    <text x="72" y="247" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#444444">&lt;context&gt;</text>
    <text x="72" y="261" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#444444">  [retrieved page excerpts go here]</text>
    <text x="72" y="271" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#444444">&lt;/context&gt;</text>
  </g>

  <!-- Input block -->
  <g>
    <rect x="40" y="292" width="680" height="72" rx="6" fill="#fbeeee" stroke="#8a2f2f" stroke-width="1.4"/>
    <text x="60" y="313" font-size="12.5" font-weight="bold" fill="#8a2f2f">Input (delimited user question)</text>
    <rect x="60" y="322" width="640" height="32" rx="4" fill="#ffffff" stroke="#e3b9b9" stroke-width="1"/>
    <text x="72" y="343" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#444444">&lt;question&gt;How do I add prompt caching on the Anthropic SDK?&lt;/question&gt;</text>
  </g>

  <!-- Output format block -->
  <g>
    <rect x="40" y="368" width="680" height="72" rx="6" fill="#f1ecf8" stroke="#4b2f73" stroke-width="1.4"/>
    <text x="60" y="389" font-size="12.5" font-weight="bold" fill="#4b2f73">Output format</text>
    <text x="60" y="407" font-size="11" fill="#333333">"Reply with a JSON object: {"answer": string, "source_page": string}. No extra text</text>
    <text x="60" y="422" font-size="11" fill="#333333">outside the JSON object."</text>
  </g>

  <text x="380" y="459" font-size="11" fill="#666666" text-anchor="middle">Each part narrows what the model can do next -- role sets the persona, instructions state the rules,</text>
  <text x="380" y="474" font-size="11" fill="#666666" text-anchor="middle">context and input supply the material, output format fixes the shape of the reply</text>
</svg>
