<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-general-guide-consume-an-sap-api-from-cap-06-queries-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-consume-an-sap-api-from-cap-06-queries-title">Terminal with three curl requests to the dashboard and their answers: the first three partners with ID, name and category, the companies only (category 2) with ID and name, and the count 6; callout 10 marks the first request, callout 11 the second and callout 12 the third</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/partner-dashboard/Partners?$top=3'</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Partners&quot;,&quot;value&quot;:[{&quot;ID&quot;:&quot;1000001&quot;,&quot;name&quot;:&quot;Example Trading Co.&quot;,&quot;category&quot;:&quot;2&quot;},{&quot;ID&quot;:&quot;10</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  00002&quot;,&quot;name&quot;:&quot;Northwind Retail GmbH&quot;,&quot;category&quot;:&quot;2&quot;},{&quot;ID&quot;:&quot;1000003&quot;,&quot;name&quot;:&quot;Ana Torres&quot;,&quot;category&quot;:&quot;1&quot;}]}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/partner-dashboard/Partners?$filter=category%20eq%20%272%27&amp;$select=ID,name'</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Partners&quot;,&quot;value&quot;:[{&quot;ID&quot;:&quot;1000001&quot;,&quot;name&quot;:&quot;Example Trading Co.&quot;},{&quot;ID&quot;:&quot;1000002&quot;,&quot;name&quot;:&quot;</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  Northwind Retail GmbH&quot;},{&quot;ID&quot;:&quot;1000006&quot;,&quot;name&quot;:&quot;Warehouse Supplies Ltd.&quot;}]}</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/partner-dashboard/Partners/$count'</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">6</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g>
<rect x="5" y="109" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="109" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="114" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">11</text></g>
<rect x="5" y="172" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="172" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="177" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">12</text></g></g>
</svg>
