<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ab-evo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three ways to hand resources to a shader</text>
<line x1="40" y1="120" x2="720" y2="120" stroke="#4B5563" stroke-width="2"/>
<circle cx="120" cy="120" r="8" fill="#4F46E5"/>
<text x="120" y="100" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">iOS 11 / macOS 10.13</text>
<rect x="5" y="145" width="230" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="188.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">MTLArgumentEncoder</text>
<text x="120.0" y="203.5" text-anchor="middle" font-size="11" fill="#3730A3">setBuffer, setTexture on an</text>
<text x="120.0" y="218.5" text-anchor="middle" font-size="11" fill="#3730A3">encoder, then setArgumentBuffer</text>
<circle cx="380" cy="120" r="8" fill="#047857"/>
<text x="380" y="100" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">iOS 16 / macOS 13</text>
<rect x="265" y="145" width="230" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="188.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">gpuResourceID, gpuAddress</text>
<text x="380.0" y="203.5" text-anchor="middle" font-size="11" fill="#065F46">Write 8-byte IDs yourself</text>
<text x="380.0" y="218.5" text-anchor="middle" font-size="11" fill="#065F46">with ordinary memory writes</text>
<circle cx="640" cy="120" r="8" fill="#B45309"/>
<text x="640" y="100" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">iOS 26 / macOS 26</text>
<rect x="525" y="145" width="230" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="188.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">MTL4ArgumentTable</text>
<text x="640.0" y="203.5" text-anchor="middle" font-size="11" fill="#92400E">Table of IDs and addresses</text>
<text x="640.0" y="218.5" text-anchor="middle" font-size="11" fill="#92400E">bound to a Metal 4 encoder</text>
<text x="380" y="290" text-anchor="middle" font-size="12" fill="#374151">All three can coexist in one app; the encoder is not deprecated.</text>
</svg>
