<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Components of a Timedelta versus its total duration</title>
<desc id="d">A Timedelta of 1 day 2 hours 3 minutes 4 seconds 5 milliseconds 6 microseconds 7 nanoseconds is drawn as seven boxes. The days attribute covers the first box, the seconds attribute covers hours minutes and seconds and equals 7384, the microseconds attribute covers milliseconds and microseconds and equals 5006, the nanoseconds attribute covers the last box, and total_seconds covers every box and equals 93784.005006007.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
<text x="360" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#0F172A" >Timedelta(&quot;1 days 02:03:04.005006007&quot;)</text>
<rect x="40" y="64" width="88" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="84.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >1</text>
<text x="84.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >days</text>
<rect x="132" y="64" width="88" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="176.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >2</text>
<text x="176.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >hours</text>
<rect x="224" y="64" width="88" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="268.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >3</text>
<text x="268.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >minutes</text>
<rect x="316" y="64" width="88" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="360.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >4</text>
<text x="360.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >seconds</text>
<rect x="408" y="64" width="88" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="452.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >5</text>
<text x="452.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >millisec.</text>
<rect x="500" y="64" width="88" height="62" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="544.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >6</text>
<text x="544.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >microseconds</text>
<rect x="592" y="64" width="88" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="636.0" y="94" font-size="22" text-anchor="middle" font-weight="bold" fill="#0F172A" >7</text>
<text x="636.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >nanoseconds</text>
<path d="M42,132 L42,142 L126,142 L126,132" fill="none" stroke="#0F766E" stroke-width="2"/>
<text x="84.0" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">.days</text>
<text x="84.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#0F766E" font-family="Menlo, Consolas, monospace">= 1</text>
<path d="M134,132 L134,142 L402,142 L402,132" fill="none" stroke="#1D4ED8" stroke-width="2"/>
<text x="268.0" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">.seconds</text>
<text x="268.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#1D4ED8" font-family="Menlo, Consolas, monospace">= 7384  (2*3600 + 3*60 + 4)</text>
<path d="M410,132 L410,142 L586,142 L586,132" fill="none" stroke="#B45309" stroke-width="2"/>
<text x="498.0" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">.microseconds</text>
<text x="498.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#B45309" font-family="Menlo, Consolas, monospace">= 5006</text>
<path d="M594,132 L594,142 L678,142 L678,132" fill="none" stroke="#6D28D9" stroke-width="2"/>
<text x="636.0" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">.nanoseconds</text>
<text x="636.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#6D28D9" font-family="Menlo, Consolas, monospace">= 7</text>
<rect x="40" y="216" width="640" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="242" font-size="16" text-anchor="middle" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">.total_seconds() = 93784.005006007</text>
<text x="360" y="266" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569" >every component, expressed in seconds (the nanoseconds count since pandas 3.1)</text>
</g>
</svg>
