<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">DI lifetimes across two consecutive HTTP requests</text>

  <!-- request lanes -->
  <rect x="40" y="55" width="330" height="330" rx="8" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <rect x="390" y="55" width="330" height="330" rx="8" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5"/>
  <text x="205" y="78" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Request 1</text>
  <text x="555" y="78" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Request 2</text>

  <!-- Singleton: one instance spanning both requests -->
  <rect x="70" y="95" width="620" height="70" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="380" y="123" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Singleton &#8212; AddSingleton&lt;IClock, SystemClock&gt;</text>
  <text x="380" y="145" font-size="11.5" fill="#2f5424" text-anchor="middle">one instance for the whole application; shared by every request (must be thread-safe)</text>

  <!-- Scoped: one per request -->
  <rect x="70" y="185" width="270" height="80" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="205" y="212" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Scoped instance A</text>
  <text x="205" y="232" font-size="11" fill="#1c4b73" text-anchor="middle">AddScoped&lt;IOrderService&gt;</text>
  <text x="205" y="250" font-size="10.5" fill="#1c4b73" text-anchor="middle">shared by all consumers in request 1</text>

  <rect x="420" y="185" width="270" height="80" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="555" y="212" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Scoped instance B</text>
  <text x="555" y="232" font-size="11" fill="#1c4b73" text-anchor="middle">AddScoped&lt;IOrderService&gt;</text>
  <text x="555" y="250" font-size="10.5" fill="#1c4b73" text-anchor="middle">a different instance for request 2</text>

  <!-- Transient: several per request -->
  <rect x="70" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="110" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="110" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t1</text>
  <rect x="165" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="205" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="205" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t2</text>
  <rect x="260" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="300" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="300" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t3</text>

  <rect x="420" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="460" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="460" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t4</text>
  <rect x="515" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="555" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="555" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t5</text>
  <rect x="610" y="285" width="80" height="85" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="650" y="322" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">Transient</text>
  <text x="650" y="340" font-size="11" font-weight="bold" fill="#8a3d10" text-anchor="middle">t6</text>

  <text x="380" y="410" font-size="12" fill="#8a3d10" text-anchor="middle">Transient &#8212; AddTransient&lt;IStamp&gt;: a brand-new instance at every injection point</text>
  <text x="380" y="440" font-size="12.5" fill="#444444" text-anchor="middle">A "scope" in ASP.NET Core is created per request by the framework; resolving a scoped</text>
  <text x="380" y="458" font-size="12.5" fill="#444444" text-anchor="middle">service inside a singleton is a captive-dependency bug caught by scope validation in Development.</text>
</svg>
