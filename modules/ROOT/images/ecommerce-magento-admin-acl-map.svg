<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">One ACL tree, four consumers</title>
  <desc id="d">The acl.xml tree of PocketCoffee_RoastAdmin has the resources root, batches, batches_save, batches_delete and config. The menu entries use root, batches and config. Controllers declare ADMIN_RESOURCE: index and edit use batches, save and new use batches_save, delete and massDelete use batches_delete. The listing and form UI components declare aclResource batches, and the system.xml section declares the config resource. A role named Roast viewer holds root and batches only, so it sees the grid and gets 403 for new and mass delete.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">One ACL tree in acl.xml, checked in four places</text>

  <!-- tree -->
  <rect x="30" y="52" width="300" height="320" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="180" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">etc/acl.xml resources</text>
  <text x="46" y="102" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Magento_Backend::admin</text>
  <rect x="58" y="112" width="260" height="26" rx="4" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="66" y="130" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">PocketCoffee_RoastAdmin::root</text>
  <rect x="78" y="148" width="240" height="26" rx="4" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="86" y="166" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">::batches</text>
  <rect x="98" y="184" width="220" height="26" rx="4" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="106" y="202" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">::batches_save</text>
  <rect x="98" y="220" width="220" height="26" rx="4" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="106" y="238" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">::batches_delete</text>
  <text x="46" y="272" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Magento_Backend::stores ...</text>
  <rect x="58" y="282" width="260" height="26" rx="4" fill="#6b5b95" stroke="#f2f5f8"/>
  <text x="66" y="300" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">PocketCoffee_RoastAdmin::config</text>
  <text x="46" y="334" font-size="11" fill="#f2f5f8">under Magento_Config::config, so it also</text>
  <text x="46" y="350" font-size="11" fill="#f2f5f8">appears in the Stores > Configuration role tree</text>

  <!-- consumers -->
  <rect x="370" y="52" width="560" height="320" rx="8" fill="#34495e" stroke="#f2f5f8"/>
  <text x="650" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">Where a resource is enforced</text>
  <text x="386" y="104" font-size="12" font-weight="bold" fill="#f2f5f8">menu.xml</text>
  <text x="386" y="122" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">root, batches, settings (resource=...::config)</text>
  <text x="386" y="140" font-size="11" fill="#f2f5f8">an entry is hidden when the role lacks its resource</text>
  <text x="386" y="168" font-size="12" font-weight="bold" fill="#f2f5f8">Controller ADMIN_RESOURCE</text>
  <text x="386" y="186" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Index, Edit            -> ::batches</text>
  <text x="386" y="204" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">NewAction, Save        -> ::batches_save</text>
  <text x="386" y="222" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">Delete, MassDelete     -> ::batches_delete</text>
  <text x="386" y="250" font-size="12" font-weight="bold" fill="#f2f5f8">UI component aclResource</text>
  <text x="386" y="268" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">listing and form data source -> ::batches</text>
  <text x="386" y="286" font-size="11" fill="#f2f5f8">guards mui/index/render, which renders a component without a controller</text>
  <text x="386" y="314" font-size="12" font-weight="bold" fill="#f2f5f8">system.xml</text>
  <text x="386" y="332" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">section pocketcoffee_roast -> ::config</text>
  <text x="386" y="350" font-size="11" fill="#f2f5f8">webapi.xml routes use resource refs in the same way</text>
  <line x1="332" y1="212" x2="368" y2="212" stroke="#f2f5f8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- roles -->
  <rect x="30" y="396" width="900" height="140" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#f2f5f8">Result for the role "Roast viewer" (resources: root and batches only), tested over HTTP</text>
  <text x="50" y="448" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">login                      -> redirected to the first allowed menu page, the batches grid</text>
  <text x="50" y="468" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">GET  batch/index           -> 200, menu shows Pocket Coffee > Roast batches only</text>
  <text x="50" y="488" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">GET  batch/new             -> 403 "Sorry, you need permissions to view this content."</text>
  <text x="50" y="508" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">POST batch/massDelete      -> 403      mui/index/render?namespace=customer_listing -> 403 JSON</text>
</svg>
