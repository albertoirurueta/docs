<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="mrt mrd" font-family="Arial, Helvetica, sans-serif">
<title id="mrt">Metadata routing</title>
<desc id="mrd">A router such as cross_validate receives sample_weight and groups. The estimator requests sample_weight for fit, the scorer requests sample_weight for score, the GroupKFold splitter requests groups by default, and a transformer that does not consume metadata receives nothing.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Metadata routing: consumers request, routers deliver</text>
<rect x="24" y="70" width="210" height="270" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="129" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Router</text>
<text x="129" y="118" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">cross_validate</text>
<text x="129" y="138" text-anchor="middle" font-size="12" fill="#475569">GridSearchCV, Pipeline, ...</text>
<rect x="44" y="160" width="170" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="129" y="182" text-anchor="middle" font-size="12" fill="#475569">params passed by you</text>
<text x="129" y="204" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">sample_weight</text>
<rect x="44" y="244" width="170" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="129" y="266" text-anchor="middle" font-size="12" fill="#475569">params passed by you</text>
<text x="129" y="288" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">groups</text>
<rect x="400" y="60" width="296" height="62" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="548" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Estimator, fit</text>
<text x="548" y="106" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">set_fit_request(sample_weight=True)</text>
<rect x="400" y="136" width="296" height="62" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="548" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Scorer, score</text>
<text x="548" y="182" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F172A">set_score_request(sample_weight=True)</text>
<rect x="400" y="212" width="296" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="548" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Splitter, split</text>
<text x="548" y="258" text-anchor="middle" font-size="12" fill="#0F172A">GroupKFold requests groups by default</text>
<rect x="400" y="288" width="296" height="62" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/>
<text x="548" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Transformer without metadata</text>
<text x="548" y="334" text-anchor="middle" font-size="12" fill="#475569">receives nothing (not a consumer)</text>
<line x1="216" y1="190" x2="396" y2="94" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="216" y1="196" x2="396" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="216" y1="276" x2="396" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="216" y1="300" x2="396" y2="318" stroke="#BE123C" stroke-width="2" stroke-dasharray="5 4"/>
<text x="300" y="334" font-size="12" fill="#BE123C">not forwarded</text>
<circle cx="300" cy="130" r="11" fill="#0F172A"/><text x="300" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="300" cy="238" r="11" fill="#0F172A"/><text x="300" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
</svg>
