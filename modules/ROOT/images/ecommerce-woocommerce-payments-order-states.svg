<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Order statuses during and after a payment</title>
  <desc id="d">A new order is pending payment. A successful synchronous payment calls payment_complete and the order becomes processing, or completed when nothing needs shipping. An asynchronous method sets the order on hold until a webhook calls payment_complete. A declined payment leaves the order pending or failed. A refund keeps the order status until the whole amount is refunded, then the order becomes refunded.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="160" height="70" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="100.0" y="70.0" text-anchor="middle" font-weight="bold">pending</text>
  <text x="100.0" y="88.0" text-anchor="middle">order created by checkout</text>
  <rect x="300" y="40" width="170" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="385.0" y="70.0" text-anchor="middle" font-weight="bold">processing</text>
  <text x="385.0" y="88.0" text-anchor="middle">paid, goods to ship</text>
  <rect x="590" y="40" width="170" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="70.0" text-anchor="middle" font-weight="bold">completed</text>
  <text x="675.0" y="88.0" text-anchor="middle">paid, nothing to ship</text>
  <rect x="230" y="170" width="170" height="70" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="315.0" y="200.0" text-anchor="middle" font-weight="bold">on-hold</text>
  <text x="315.0" y="218.0" text-anchor="middle">awaiting confirmation</text>
  <rect x="20" y="300" width="160" height="70" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="100.0" y="330.0" text-anchor="middle" font-weight="bold">failed</text>
  <text x="100.0" y="348.0" text-anchor="middle">payment declined</text>
  <rect x="590" y="300" width="170" height="70" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="675.0" y="330.0" text-anchor="middle" font-weight="bold">refunded</text>
  <text x="675.0" y="348.0" text-anchor="middle">fully refunded</text>
  <line x1="180" y1="65" x2="298" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="239" y="56" text-anchor="middle" font-size="11">payment_complete</text>
  <line x1="470" y1="65" x2="588" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="529" y="56" text-anchor="middle" font-size="11">shipped</text>
  <path d="M150,110 L150,205 L228,205" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="196" text-anchor="middle" font-size="11">async</text>
  <line x1="350" y1="170" x2="350" y2="112" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="343" y="150" text-anchor="end" font-size="11">webhook: payment_complete</text>
  <line x1="60" y1="110" x2="60" y2="298" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="98" y="250" text-anchor="middle" font-size="11">declined</text>
  <path d="M440,110 L440,335 L588,335" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="515" y="326" text-anchor="middle" font-size="11">full refund</text>
  <line x1="675" y1="110" x2="675" y2="298" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="720" y="210" text-anchor="middle" font-size="11">full refund</text>
  <text x="450" y="408" text-anchor="middle" font-size="11" opacity="0.85">A partial refund adds a refund record but keeps the order status. Webhooks must be idempotent: call payment_complete only when the order is not paid yet.</text>
</svg>
