<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Enabling HPOS on a live store in five phases</title>
  <desc id="d">Five phases for a large store. Phase 1: enable compatibility mode with posts still authoritative and run wp wc hpos sync, then verify. Phase 2: make the order tables authoritative while synchronisation stays on; going back is instant. Phase 3: disable sync on read with the woocommerce_hpos_enable_sync_on_read filter, which is already false by default since 10.7.0. Phase 4: after a quiet week turn compatibility mode off. Phase 5: optionally remove old data with wp wc hpos cleanup. A band under phases 1 to 3 marks that the switch back to posts is immediate.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">From posts storage to HPOS without downtime</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">The order recommended for high-volume stores by the HPOS guide, adapted to the behaviour of WooCommerce 11.2.1</text>
  <rect x="40" y="90" width="160" height="150" rx="8" fill="#3d5266"/>
  <text x="54" y="112" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">1. Mirror</text>
  <text x="54" y="134" font-size="12.5" text-anchor="start" fill="#f2f5f8">compatibility mode ON</text>
  <text x="54" y="153" font-size="12.5" text-anchor="start" fill="#f2f5f8">posts stay authoritative</text>
  <text x="54" y="172" font-size="12.5" text-anchor="start" fill="#f2f5f8">wp wc hpos sync</text>
  <text x="54" y="191" font-size="12.5" text-anchor="start" fill="#f2f5f8">wp wc hpos verify_data</text>
  <rect x="220" y="90" width="160" height="150" rx="8" fill="#3f6e9a"/>
  <text x="234" y="112" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">2. Flip</text>
  <text x="234" y="134" font-size="12.5" text-anchor="start" fill="#f2f5f8">order tables authoritative</text>
  <text x="234" y="153" font-size="12.5" text-anchor="start" fill="#f2f5f8">sync still ON</text>
  <text x="234" y="172" font-size="12.5" text-anchor="start" fill="#f2f5f8">test every checkout path</text>
  <text x="234" y="191" font-size="12.5" text-anchor="start" fill="#f2f5f8">watch support channels</text>
  <rect x="400" y="90" width="160" height="150" rx="8" fill="#4d7c5a"/>
  <text x="414" y="112" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">3. Sync off on read</text>
  <text x="414" y="134" font-size="12.5" text-anchor="start" fill="#f2f5f8">filter returns false</text>
  <text x="414" y="153" font-size="12.5" text-anchor="start" fill="#f2f5f8">(default since 10.7.0)</text>
  <text x="414" y="172" font-size="12.5" text-anchor="start" fill="#f2f5f8">less work per request</text>
  <text x="414" y="191" font-size="12.5" text-anchor="start" fill="#f2f5f8">keep writes synced</text>
  <rect x="580" y="90" width="160" height="150" rx="8" fill="#6b5b95"/>
  <text x="594" y="112" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">4. Sync off</text>
  <text x="594" y="134" font-size="12.5" text-anchor="start" fill="#f2f5f8">compatibility mode OFF</text>
  <text x="594" y="153" font-size="12.5" text-anchor="start" fill="#f2f5f8">after a quiet week</text>
  <text x="594" y="172" font-size="12.5" text-anchor="start" fill="#f2f5f8">schedule a manual sync</text>
  <text x="594" y="191" font-size="12.5" text-anchor="start" fill="#f2f5f8">if a fallback matters</text>
  <rect x="760" y="90" width="160" height="150" rx="8" fill="#b5651d"/>
  <text x="774" y="112" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">5. Clean up</text>
  <text x="774" y="134" font-size="12.5" text-anchor="start" fill="#f2f5f8">wp wc hpos cleanup</text>
  <text x="774" y="153" font-size="12.5" text-anchor="start" fill="#f2f5f8">removes old postmeta</text>
  <text x="774" y="172" font-size="12.5" text-anchor="start" fill="#f2f5f8">placeholders stay</text>
  <text x="774" y="191" font-size="12.5" text-anchor="start" fill="#f2f5f8">point of no return</text>
  <path d="M200,165 L220,165" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,165 L400,165" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560,165 L580,165" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M740,165 L760,165" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="262" width="520" height="26" rx="6" fill="#2e8b6a"/>
  <text x="300" y="280" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">Switching back to posts is immediate in phases 1 to 3</text>
  <rect x="580" y="262" width="160" height="26" rx="6" fill="#b5651d"/>
  <text x="660" y="280" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">needs a sync first</text>
  <rect x="760" y="262" width="160" height="26" rx="6" fill="#7a3b3b"/>
  <text x="840" y="280" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">cannot be undone</text>
  <rect x="40" y="316" width="880" height="200" rx="8" fill="#34495e"/>
  <text x="56" y="340" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Checks before moving to the next phase</text>
  <text x="56" y="364" font-size="12.5" text-anchor="start" fill="#f2f5f8">- wp wc hpos status: HPOS enabled, compatibility mode as planned, unsynced orders 0</text>
  <text x="56" y="388" font-size="12.5" text-anchor="start" fill="#f2f5f8">- wp wc hpos compatibility-info: no incompatible plugin, every uncertain plugin reviewed</text>
  <text x="56" y="412" font-size="12.5" text-anchor="start" fill="#f2f5f8">- wp wc hpos diff &lt;order-id&gt;: no differences for a sample of recent orders</text>
  <text x="56" y="436" font-size="12.5" text-anchor="start" fill="#f2f5f8">- Third-party systems (data warehouse, accounting, shipping labels) no longer read wp_posts or wp_postmeta for orders</text>
  <text x="56" y="460" font-size="12.5" text-anchor="start" fill="#f2f5f8">- Checkout, refund and subscription renewal tested with every payment method on a staging copy first</text>
  <text x="56" y="484" font-size="12.5" text-anchor="start" fill="#f2f5f8">- Rollback plan written down: which phase you are in and which command returns you to the previous one</text>
</svg>
