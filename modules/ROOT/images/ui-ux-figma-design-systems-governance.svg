<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="740" height="330" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Contribution and release workflow</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF"><rect x="14" y="70" width="108" height="70" rx="10"/><rect x="144" y="70" width="108" height="70" rx="10"/><rect x="274" y="70" width="108" height="70" rx="10"/><rect x="404" y="70" width="108" height="70" rx="10"/><rect x="534" y="70" width="108" height="70" rx="10"/></g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M123,105 L143,105" marker-end="url(#ah)"/><path d="M253,105 L273,105" marker-end="url(#ah)"/><path d="M383,105 L403,105" marker-end="url(#ah)"/><path d="M513,105 L533,105" marker-end="url(#ah)"/></g>
  <g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="68" y="110">Proposal</text><text x="198" y="110">Review</text><text x="328" y="110">Branch</text><text x="458" y="110">Publish</text><text x="588" y="110">Announce</text></g>
  <circle cx="660" cy="105" r="0" fill="none"/>
  <rect x="654" y="70" width="72" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="690" y="102" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Deprecate</text><text x="690" y="120" font-size="11" fill="#92400E" text-anchor="middle">later</text>
  <path d="M643,105 L653,105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="68" y="170">Request in a</text><text x="68" y="186">comment or form</text><text x="198" y="170">Maintainers check</text><text x="198" y="186">fit and a11y</text><text x="328" y="170">Change made in</text><text x="328" y="186">an isolated branch</text><text x="458" y="170">Merge, set version,</text><text x="458" y="186">write the notes</text><text x="588" y="170">Changelog and</text><text x="588" y="186">update message</text></g>
  <g fill="#4F46E5"><circle cx="30" cy="62" r="11"/><circle cx="160" cy="62" r="11"/><circle cx="290" cy="62" r="11"/><circle cx="420" cy="62" r="11"/><circle cx="550" cy="62" r="11"/></g><circle cx="670" cy="62" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="66">1</text><text x="160" y="66">2</text><text x="290" y="66">3</text><text x="420" y="66">4</text><text x="550" y="66">5</text><text x="670" y="66">6</text></g>
  <rect x="14" y="220" width="712" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="370" y="246" font-size="12" fill="#374151" text-anchor="middle">Version rule (semantic versioning): major = breaking, minor = compatible addition, patch = fix</text>
  <text x="370" y="266" font-size="12" fill="#374151" text-anchor="middle">Example: removing the old Button is 2.0.0, adding a Rating component is 1.4.0, fixing padding is 1.3.1</text>
  <text x="370" y="312" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked 2026-10-30. Branching needs an Organization or Enterprise plan.</text>
</svg>
