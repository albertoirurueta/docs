<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="24" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">State boundaries in Places</text>
  <text x="390" y="41" font-size="11" fill="#666666" text-anchor="middle">Local, global, and server state live in different places, change at different rates, and are read by the same screens</text>

  <defs>
    <marker id="sb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- submit arc: Local -> Server -->
  <path d="M140,92 C140,55 640,55 640,92" fill="none" stroke="#555555" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sb-arrow)"/>
  <text x="390" y="63" font-size="9.5" fill="#555555" text-anchor="middle">On submit: create mutation -&gt; POST /places</text>
  <text x="390" y="76" font-size="9" fill="#777777" text-anchor="middle">(invalidates the places query on success)</text>

  <!-- Local state zone -->
  <rect x="25" y="92" width="230" height="210" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="140" y="114" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Local state</text>
  <text x="140" y="130" font-size="9.5" fill="#1c4b73" text-anchor="middle">AddPlaceScreen's own useState</text>
  <text x="40" y="152" font-size="10" fill="#1a3a52">• name / notes / category draft</text>
  <text x="40" y="172" font-size="10" fill="#1a3a52">• photoUri (picked, not uploaded)</text>
  <text x="40" y="192" font-size="10" fill="#1a3a52">• inline validation errors</text>
  <text x="40" y="212" font-size="10" fill="#1a3a52">• discarded on unmount</text>
  <text x="140" y="280" font-size="9" fill="#1c4b73" text-anchor="middle" font-style="italic">scope: this screen instance only</text>

  <!-- Global state zone -->
  <rect x="275" y="92" width="230" height="210" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="390" y="114" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Global state</text>
  <text x="390" y="130" font-size="9.5" fill="#8a5a1c" text-anchor="middle">useFavouritesStore (Zustand + persist)</text>
  <text x="290" y="152" font-size="10" fill="#5f3f14">• favouriteIds: Record&lt;PlaceId, bool&gt;</text>
  <text x="290" y="172" font-size="10" fill="#5f3f14">• toggleFavourite(id) action</text>
  <text x="290" y="192" font-size="10" fill="#5f3f14">• persisted to MMKV storage</text>
  <text x="290" y="212" font-size="10" fill="#5f3f14">• rehydrated on cold start</text>
  <text x="390" y="280" font-size="9" fill="#8a5a1c" text-anchor="middle" font-style="italic">scope: whole app, survives relaunch</text>

  <!-- Server state zone -->
  <rect x="525" y="92" width="230" height="210" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="640" y="114" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Server state</text>
  <text x="640" y="130" font-size="9.5" fill="#2d6a34" text-anchor="middle">TanStack Query cache of Place[]</text>
  <text x="540" y="152" font-size="10" fill="#1f4a24">• Place[] from the REST API</text>
  <text x="540" y="172" font-size="10" fill="#1f4a24">• cached + background-refetched</text>
  <text x="540" y="192" font-size="10" fill="#1f4a24">• invalidated after mutations</text>
  <text x="540" y="212" font-size="10" fill="#1f4a24">• refetched on AppState 'active'</text>
  <text x="640" y="280" font-size="9" fill="#2d6a34" text-anchor="middle" font-style="italic">scope: shared cache, owned by the server</text>

  <!-- convergence arrows into the UI row -->
  <line x1="140" y1="304" x2="140" y2="328" stroke="#1c4b73" stroke-width="1.3" marker-end="url(#sb-arrow)"/>
  <text x="140" y="317" font-size="8.3" fill="#1c4b73" text-anchor="middle">draft (edit only)</text>

  <line x1="390" y1="304" x2="390" y2="328" stroke="#8a5a1c" stroke-width="1.3" marker-end="url(#sb-arrow)"/>
  <text x="390" y="317" font-size="8.3" fill="#8a5a1c" text-anchor="middle">favouriteIds (selector)</text>

  <line x1="640" y1="304" x2="640" y2="328" stroke="#2d6a34" stroke-width="1.3" marker-end="url(#sb-arrow)"/>
  <text x="640" y="317" font-size="8.3" fill="#2d6a34" text-anchor="middle">Place[] (cache)</text>

  <!-- UI row -->
  <rect x="140" y="330" width="500" height="66" rx="10" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>
  <text x="390" y="357" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">PlacesListScreen / PlaceCard</text>
  <text x="390" y="374" font-size="9.5" fill="#555555" text-anchor="middle">renders from all three: draft while editing, favourite flag from the store, place data from the cache</text>
  <text x="390" y="388" font-size="9.5" fill="#555555" text-anchor="middle">none of the three is duplicated into another -- each screen reads only the state it actually owns</text>

  <text x="390" y="424" font-size="10.5" fill="#666666" text-anchor="middle">Local state never leaves its screen; global state is shared and persisted; server state is a cache of data</text>
  <text x="390" y="439" font-size="10.5" fill="#666666" text-anchor="middle">the server still owns -- React Navigation's own internal state is a fourth, separate boundary (see below).</text>
</svg>
