<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Breakpoints: edits flow from the primary breakpoint unless overridden</text>
  <line x1="40" y1="64" x2="720" y2="64" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="40" y="56" font-size="12" fill="#374151">0 px</text>
  <line x1="300" y1="58" x2="300" y2="70" stroke="#4B5563" stroke-width="1.5"/><text x="300" y="52" font-size="12" fill="#374151" text-anchor="middle">800 px</text>
  <line x1="520" y1="58" x2="520" y2="70" stroke="#4B5563" stroke-width="1.5"/><text x="520" y="52" font-size="12" fill="#374151" text-anchor="middle">1280 px</text>
  <text x="170" y="86" font-size="12" fill="#374151" text-anchor="middle">below 800: mobile layout</text>
  <text x="410" y="86" font-size="12" fill="#374151" text-anchor="middle">800 to 1280: tablet layout</text>
  <text x="625" y="86" font-size="12" fill="#374151" text-anchor="middle">over 1280: desktop layout</text>
  <rect x="40" y="110" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="125" y="130" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Mobile 375</text>
  <rect x="55" y="142" width="140" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="125" y="158" font-size="12" fill="#92400E" text-anchor="middle">Banner: own fill</text>
  <rect x="55" y="172" width="140" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="125" y="195" font-size="12" fill="#3730A3" text-anchor="middle">Book card</text>
  <rect x="55" y="218" width="140" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="125" y="241" font-size="12" fill="#3730A3" text-anchor="middle">Book card</text>
  <text x="125" y="282" font-size="12" fill="#374151" text-anchor="middle">cards stack in one column</text>
  <rect x="285" y="110" width="250" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="410" y="130" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Tablet 800</text>
  <rect x="300" y="142" width="220" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="410" y="158" font-size="12" fill="#3730A3" text-anchor="middle">Banner: inherited fill</text>
  <rect x="300" y="172" width="105" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="352" y="195" font-size="12" fill="#3730A3" text-anchor="middle">Book card</text>
  <rect x="415" y="172" width="105" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="467" y="195" font-size="12" fill="#3730A3" text-anchor="middle">Book card</text>
  <text x="410" y="282" font-size="12" fill="#374151" text-anchor="middle">cards in two columns</text>
  <rect x="560" y="110" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="645" y="130" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Desktop 1280 (primary)</text>
  <rect x="572" y="142" width="146" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="645" y="158" font-size="12" fill="#3730A3" text-anchor="middle">Banner: you edit here</text>
  <rect x="572" y="172" width="44" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="622" y="172" width="44" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="672" y="172" width="46" height="38" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="645" y="282" font-size="12" fill="#374151" text-anchor="middle">cards in three columns</text>
  <path d="M560 205 L540 205" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M285 235 L215 235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <g fill="#4F46E5"><circle cx="645" cy="100" r="11"/><circle cx="410" cy="100" r="11"/></g>
  <circle cx="125" cy="100" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="645" y="104">1</text><text x="125" y="104">3</text></g>
  <text x="410" y="104" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="380" y="330" font-size="12" fill="#374151" text-anchor="middle">1 primary breakpoint: its edits cascade down  2 secondary: inherits untouched properties</text>
  <text x="380" y="350" font-size="12" fill="#374151" text-anchor="middle">3 a property changed here keeps its own value; later desktop edits skip that property</text>
</svg>
