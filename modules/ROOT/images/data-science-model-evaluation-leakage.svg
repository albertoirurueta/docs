<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
  <title id="t2">Data leakage: wrong and right order of preprocessing and splitting</title>
  <desc id="d2">Wrong: preprocessing is fitted on all data and then the data is split, so test information reaches the model. Right: the data is split first and preprocessing is fitted on the training part only, then applied to the test part.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Leakage: the order of operations decides</text>

  <text x="24" y="68" font-size="14" font-weight="bold" fill="#BE123C">Wrong</text>
  <rect x="24" y="80" width="130" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="89" y="110" font-size="14" text-anchor="middle" fill="#0F172A">all rows</text>
  <rect x="200" y="80" width="190" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="295" y="103" font-size="14" text-anchor="middle" fill="#0F172A">fit scaler / selector</text>
  <text x="295" y="121" font-size="12" text-anchor="middle" fill="#475569">sees the future test rows</text>
  <rect x="436" y="80" width="110" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="491" y="110" font-size="14" text-anchor="middle" fill="#0F172A">then split</text>
  <rect x="592" y="80" width="104" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="644" y="110" font-size="14" text-anchor="middle" fill="#0F172A">model</text>
  <path d="M154 105 H198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M390 105 H434" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M546 105 H590" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="24" y="156" font-size="12" fill="#475569">Result: an optimistic score that does not hold on new data.</text>

  <text x="24" y="204" font-size="14" font-weight="bold" fill="#0F766E">Right</text>
  <rect x="24" y="216" width="130" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="89" y="246" font-size="14" text-anchor="middle" fill="#0F172A">all rows</text>
  <rect x="200" y="216" width="110" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="255" y="246" font-size="14" text-anchor="middle" fill="#0F172A">split first</text>
  <rect x="356" y="216" width="190" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="451" y="239" font-size="14" text-anchor="middle" fill="#0F172A">fit scaler / selector</text>
  <text x="451" y="257" font-size="12" text-anchor="middle" fill="#475569">on the training part only</text>
  <rect x="592" y="216" width="104" height="50" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="644" y="246" font-size="14" text-anchor="middle" fill="#0F172A">model</text>
  <path d="M154 241 H198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M310 241 H354" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M546 241 H590" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="24" y="292" font-size="12" fill="#475569">A Pipeline repeats this order inside every cross-validation fold; test rows only pass through transform.</text>
</svg>
