<text x="610.0" y="274" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Level 7: 49 quads</text>
<text x="380" y="325" text-anchor="middle" font-size="12" fill="#374151">The orange dots are the 4 control points of the patch; the same patch yields more vertices as the levels rise.</text>
<text x="380" y="345" text-anchor="middle" font-size="12" fill="#374151">Outer levels set the edge subdivision (gl_TessLevelOuter[0..3]), inner levels the interior (gl_TessLevelInner[0..1]).</text>
</svg>
