<line x1="597.1428571428571" y1="70" x2="597.1428571428571" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="520" y1="147.14285714285714" x2="700" y2="147.14285714285714" stroke="#4F46E5" stroke-width="1"/>
<line x1="622.8571428571429" y1="70" x2="622.8571428571429" y2="250" stroke="#4F46E5" stroke-width="1"/>
