<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tess-patch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A quad patch subdivided at three tessellation levels</text>
<rect x="40" y="70" width="180" height="180" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<line x1="130.0" y1="70" x2="130.0" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="40" y1="160.0" x2="220" y2="160.0" stroke="#4F46E5" stroke-width="1"/>
<circle cx="40" cy="70" r="5" fill="#B45309"/>
<circle cx="220" cy="70" r="5" fill="#B45309"/>
<circle cx="40" cy="250" r="5" fill="#B45309"/>
<circle cx="220" cy="250" r="5" fill="#B45309"/>
<text x="130.0" y="274" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Level 2: 4 quads</text>
<rect x="280" y="70" width="180" height="180" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<line x1="325.0" y1="70" x2="325.0" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="280" y1="115.0" x2="460" y2="115.0" stroke="#4F46E5" stroke-width="1"/>
<line x1="370.0" y1="70" x2="370.0" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="280" y1="160.0" x2="460" y2="160.0" stroke="#4F46E5" stroke-width="1"/>
<line x1="415.0" y1="70" x2="415.0" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="280" y1="205.0" x2="460" y2="205.0" stroke="#4F46E5" stroke-width="1"/>
<circle cx="280" cy="70" r="5" fill="#B45309"/>
<circle cx="460" cy="70" r="5" fill="#B45309"/>
<circle cx="280" cy="250" r="5" fill="#B45309"/>
<circle cx="460" cy="250" r="5" fill="#B45309"/>
<text x="370.0" y="274" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Level 4: 16 quads</text>
