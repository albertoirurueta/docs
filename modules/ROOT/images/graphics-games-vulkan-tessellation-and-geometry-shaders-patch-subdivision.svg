<line x1="520" y1="198.57142857142858" x2="700" y2="198.57142857142858" stroke="#4F46E5" stroke-width="1"/>
<line x1="674.2857142857142" y1="70" x2="674.2857142857142" y2="250" stroke="#4F46E5" stroke-width="1"/>
<line x1="520" y1="224.28571428571428" x2="700" y2="224.28571428571428" stroke="#4F46E5" stroke-width="1"/>
