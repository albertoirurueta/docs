<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The four HPOS order tables and what stays outside them</title>
  <desc id="d">The table wp_wc_orders holds one row per order with status, currency, type, totals, customer, billing email, dates, payment method and transaction ID. Three tables point to it with order_id: wp_wc_order_addresses with one billing and one shipping row, wp_wc_order_operational_data with one row of internal fields such as order key, paid and completed dates and shipping and discount amounts, and wp_wc_orders_meta with the custom fields. Order items stay in woocommerce_order_items and woocommerce_order_itemmeta. In wp_posts a placeholder row of type shop_order_placehold reserves the order ID.</desc>
  <rect x="0" y="0" width="960" height="660" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">High-Performance Order Storage: four tables around one order ID</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Columns as created by WooCommerce 11.2.1 (wp_ prefix); the arrows read "order_id points to id"</text>
  <g transform="translate(0,20)">
  <rect x="40" y="80" width="300" height="300" rx="8" fill="#4d7c5a" stroke="#f2f5f8" stroke-width="1.5"/>
  <text x="54" y="104" font-size="15" font-weight="bold" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">wp_wc_orders</text>
  <text x="54" y="124" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">id  =  the order ID (primary key)</text>
  <text x="54" y="148" font-size="12" text-anchor="start" fill="#f2f5f8">status  (wc-processing, ...)</text>
  <text x="54" y="168" font-size="12" text-anchor="start" fill="#f2f5f8">currency</text>
  <text x="54" y="188" font-size="12" text-anchor="start" fill="#f2f5f8">type  (shop_order, shop_order_refund)</text>
  <text x="54" y="208" font-size="12" text-anchor="start" fill="#f2f5f8">tax_amount, total_amount</text>
  <text x="54" y="228" font-size="12" text-anchor="start" fill="#f2f5f8">customer_id, billing_email</text>
  <text x="54" y="248" font-size="12" text-anchor="start" fill="#f2f5f8">date_created_gmt, date_updated_gmt</text>
  <text x="54" y="268" font-size="12" text-anchor="start" fill="#f2f5f8">parent_order_id  (refunds)</text>
  <text x="54" y="288" font-size="12" text-anchor="start" fill="#f2f5f8">payment_method, payment_method_title</text>
  <text x="54" y="308" font-size="12" text-anchor="start" fill="#f2f5f8">transaction_id</text>
  <text x="54" y="328" font-size="12" text-anchor="start" fill="#f2f5f8">ip_address, user_agent</text>
  <text x="54" y="348" font-size="12" text-anchor="start" fill="#f2f5f8">customer_note</text>
  <text x="54" y="372" font-size="11" text-anchor="start" fill="#f2f5f8">indexes: status, type+status+date, customer, email</text>
  <rect x="420" y="80" width="270" height="130" rx="8" fill="#3f6e9a"/>
  <text x="434" y="102" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wp_wc_order_addresses</text>
  <text x="434" y="124" font-size="12.5" text-anchor="start" fill="#f2f5f8">order_id, address_type</text>
  <text x="434" y="143" font-size="12.5" text-anchor="start" fill="#f2f5f8">billing | shipping (2 rows)</text>
  <text x="434" y="162" font-size="12.5" text-anchor="start" fill="#f2f5f8">first_name ... country</text>
  <text x="434" y="181" font-size="12.5" text-anchor="start" fill="#f2f5f8">email, phone</text>
  <rect x="420" y="230" width="270" height="150" rx="8" fill="#6b5b95"/>
  <text x="434" y="252" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wp_wc_order_operational_data</text>
  <text x="434" y="274" font-size="12.5" text-anchor="start" fill="#f2f5f8">order_id (unique, 1 row)</text>
  <text x="434" y="293" font-size="12.5" text-anchor="start" fill="#f2f5f8">created_via, woocommerce_version</text>
  <text x="434" y="312" font-size="12.5" text-anchor="start" fill="#f2f5f8">order_key, cart_hash</text>
  <text x="434" y="331" font-size="12.5" text-anchor="start" fill="#f2f5f8">date_paid_gmt, date_completed_gmt</text>
  <text x="434" y="350" font-size="12.5" text-anchor="start" fill="#f2f5f8">shipping_*, discount_* amounts</text>
  <text x="434" y="369" font-size="12.5" text-anchor="start" fill="#f2f5f8">prices_include_tax, recorded_sales</text>
  <rect x="420" y="400" width="270" height="110" rx="8" fill="#b5651d"/>
  <text x="434" y="422" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wp_wc_orders_meta</text>
  <text x="434" y="444" font-size="12.5" text-anchor="start" fill="#f2f5f8">order_id, meta_key, meta_value</text>
  <text x="434" y="463" font-size="12.5" text-anchor="start" fill="#f2f5f8">custom fields, address indexes</text>
  <text x="434" y="482" font-size="12.5" text-anchor="start" fill="#f2f5f8">one row per key and value</text>
  <path d="M340,140 L420,140" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
  <path d="M340,300 L420,300" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
  <path d="M340,370 L380,370 L380,455 L420,455" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
  <rect x="730" y="80" width="190" height="130" rx="8" fill="#34495e" stroke="#f4b860" stroke-width="1.5"/>
  <text x="744" y="102" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">wp_posts</text>
  <text x="744" y="124" font-size="12.5" text-anchor="start" fill="#f2f5f8">one placeholder row</text>
  <text x="744" y="143" font-size="12.5" text-anchor="start" fill="#f2f5f8">post_type =</text>
  <text x="744" y="162" font-size="12.5" text-anchor="start" fill="#f2f5f8">shop_order_placehold</text>
  <text x="744" y="181" font-size="12.5" text-anchor="start" fill="#f2f5f8">ID = the order ID</text>
  <path d="M340,100 L380,100 L380,66 L790,66 L790,80" fill="none" stroke="#f4b860" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="62" font-size="11" text-anchor="middle" fill="#f4b860">same ID, placeholder row</text>
  <rect x="730" y="230" width="190" height="150" rx="8" fill="#34495e"/>
  <text x="744" y="252" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Order items</text>
  <text x="744" y="274" font-size="11" text-anchor="start" fill="#f2f5f8">woocommerce_order_items</text>
  <text x="744" y="293" font-size="11" text-anchor="start" fill="#f2f5f8">woocommerce_order_itemmeta</text>
  <text x="744" y="312" font-size="11" text-anchor="start" fill="#f2f5f8">order_id points to the</text>
  <text x="744" y="331" font-size="11" text-anchor="start" fill="#f2f5f8">order ID; unchanged</text>
  <rect x="40" y="420" width="300" height="90" rx="8" fill="#34495e"/>
  <text x="54" y="442" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Not on this picture</text>
  <text x="54" y="464" font-size="11.5" text-anchor="start" fill="#f2f5f8">lookup and analytics tables</text>
  <text x="54" y="483" font-size="11.5" text-anchor="start" fill="#f2f5f8">(wc_order_stats, wc_order_product_lookup)</text>
  <text x="54" y="502" font-size="11.5" text-anchor="start" fill="#f2f5f8">hold copies derived from orders</text>
  <rect x="40" y="540" width="880" height="70" rx="8" fill="#3d5266"/>
  <text x="56" y="563" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">Why a placeholder?</text>
  <text x="56" y="584" font-size="12.5" text-anchor="start" fill="#f2f5f8">Orders and ordinary posts share one ID space while the posts table is the backup. The placeholder keeps a post from taking the ID of an order</text>
  <text x="56" y="602" font-size="12.5" text-anchor="start" fill="#f2f5f8">that exists only in the new tables, so the two stores can be synchronised later (see the synchronisation section).</text>
  </g>
</svg>
