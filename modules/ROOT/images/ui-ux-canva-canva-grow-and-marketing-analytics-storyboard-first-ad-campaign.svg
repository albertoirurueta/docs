<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Storyboard: from a Bookshelf website address to a measured ad campaign</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the first Bookshelf ad campaign</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="none" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <!-- panel 1: connect -->
  <rect x="26" y="96" width="112" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="82" y="111" font-size="11" fill="#374151" text-anchor="middle">Grow in side menu</text>
  <rect x="26" y="130" width="112" height="28" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/><text x="82" y="148" font-size="11" fill="#374151" text-anchor="middle">Ad account A</text>
  <rect x="26" y="166" width="112" height="28" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/><text x="82" y="184" font-size="11" fill="#374151" text-anchor="middle">Ad account B</text>
  <rect x="26" y="202" width="112" height="28" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/><text x="82" y="220" font-size="11" fill="#374151" text-anchor="middle">Ad account C</text>
  <rect x="42" y="250" width="80" height="26" rx="6" fill="#4F46E5"/><text x="82" y="267" font-size="11" fill="#FFFFFF" text-anchor="middle">Connect</text>
  <!-- panel 2: create input -->
  <rect x="178" y="96" width="112" height="28" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="114" font-size="11" fill="#374151" text-anchor="middle">Website address</text>
  <rect x="178" y="132" width="112" height="44" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="158" font-size="11" fill="#374151" text-anchor="middle">Business text</text>
  <rect x="178" y="184" width="52" height="36" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><rect x="238" y="184" width="52" height="36" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="234" y="238" font-size="11" fill="#374151" text-anchor="middle">Photos and assets</text>
  <rect x="194" y="252" width="80" height="26" rx="6" fill="#4F46E5"/><text x="234" y="269" font-size="11" fill="#FFFFFF" text-anchor="middle">Continue</text>
  <!-- panel 3: concepts -->
  <rect x="330" y="96" width="34" height="86" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="369" y="96" width="34" height="86" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><rect x="408" y="96" width="34" height="86" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/>
  <text x="347" y="144" font-size="11" fill="#374151" text-anchor="middle">1</text><text x="386" y="144" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">2</text><text x="425" y="144" font-size="11" fill="#374151" text-anchor="middle">3</text>
  <text x="386" y="204" font-size="11" fill="#374151" text-anchor="middle">Three concepts</text>
  <rect x="346" y="252" width="80" height="26" rx="6" fill="#4F46E5"/><text x="386" y="269" font-size="11" fill="#FFFFFF" text-anchor="middle">Generate ads</text>
  <!-- panel 4: launch -->
  <rect x="482" y="96" width="112" height="22" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="111" font-size="11" fill="#374151" text-anchor="middle">Ads + ad copy</text>
  <rect x="482" y="126" width="112" height="22" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><text x="538" y="141" font-size="11" fill="#374151" text-anchor="middle">Campaign</text>
  <rect x="482" y="156" width="112" height="22" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><text x="538" y="171" font-size="11" fill="#374151" text-anchor="middle">Ad set</text>
  <rect x="482" y="190" width="112" height="22" rx="11" fill="#FEF3C7" stroke="#B45309"/><text x="538" y="205" font-size="11" fill="#92400E" text-anchor="middle">Paused by default</text>
  <rect x="498" y="252" width="80" height="26" rx="6" fill="#4F46E5"/><text x="538" y="269" font-size="11" fill="#FFFFFF" text-anchor="middle">Submit</text>
  <!-- panel 5: learn -->
  <rect x="634" y="96" width="100" height="40" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="684" y="120" font-size="11" fill="#374151" text-anchor="middle">Key metrics</text>
  <rect x="634" y="144" width="100" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="159" font-size="11" fill="#92400E" text-anchor="middle">Winner</text>
  <rect x="634" y="172" width="100" height="22" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><text x="684" y="187" font-size="11" fill="#374151" text-anchor="middle">Needs improvement</text>
  <rect x="634" y="204" width="100" height="40" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="684" y="228" font-size="11" fill="#374151" text-anchor="middle">Quick wins</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Open Grow and</text><text x="82" y="338">connect an ad account</text><text x="234" y="322">Describe the</text><text x="234" y="338">business</text><text x="386" y="322">Pick one of</text><text x="386" y="338">three concepts</text><text x="538" y="322">Launch the ads</text><text x="538" y="338">as a campaign</text><text x="684" y="322">Learn from the</text><text x="684" y="338">results</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
