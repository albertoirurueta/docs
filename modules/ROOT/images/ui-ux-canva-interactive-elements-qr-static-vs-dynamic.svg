<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Static and dynamic QR codes compared</text>
<rect x="20" y="46" width="340" height="270" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="400" y="46" width="340" height="270" rx="10" fill="#F9FAFB" stroke="#B45309" stroke-width="1.5"/>
<text x="190" y="70" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Static QR code</text>
<text x="570" y="70" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Dynamic QR code</text>
<rect x="150" y="84" width="80" height="80" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="158" y="92" width="20" height="20" fill="#1F2937"/><rect x="202" y="92" width="20" height="20" fill="#1F2937"/><rect x="158" y="136" width="20" height="20" fill="#1F2937"/><rect x="190" y="124" width="14" height="14" fill="#1F2937"/>
<rect x="530" y="84" width="80" height="80" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="538" y="92" width="20" height="20" fill="#1F2937"/><rect x="582" y="92" width="20" height="20" fill="#1F2937"/><rect x="538" y="136" width="20" height="20" fill="#1F2937"/><rect x="570" y="124" width="14" height="14" fill="#B45309"/>
<g font-size="12" fill="#374151">
<text x="36" y="192">Link is fixed after creation</text>
<text x="36" y="212">No scan analytics</text>
<text x="36" y="232">Colours and margin only</text>
<text x="36" y="252">No Canva logo on the code</text>
<text x="36" y="272">Same on every plan</text>
<text x="36" y="298" fill="#4F46E5">Best for a permanent poster link</text>
<text x="416" y="192">Destination can be updated, no reprint</text>
<text x="416" y="212">Insights: total and unique scans (Business,</text>
<text x="416" y="228">Enterprise, Nonprofit)</text>
<text x="416" y="248">Patterns and corners; Canva logo by default</text>
<text x="416" y="268">Expiry and collaborator editing (same plans)</text>
<text x="416" y="298" fill="#92400E">Best for printed material that may change</text></g>
<text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product. Neither type converts into the other.</text>
</svg>
