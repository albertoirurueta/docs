<svg viewBox="0 0 760 250" width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: add the BookActor class with the C++ Class Wizard</text>
<rect x="20.0" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36.0" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36.0" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="94.4" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Open wizard</text>
<text x="86.4" y="100" text-anchor="middle" font-size="11" fill="#374151">Tools menu</text>
<text x="86.4" y="120" text-anchor="middle" font-size="11" fill="#374151">New C++ Class</text>
<text x="86.4" y="140" text-anchor="middle" font-size="11" fill="#374151">the wizard opens</text>
<text x="86.4" y="212" text-anchor="middle" font-size="11" fill="#374151">Works in Blueprint</text>
<text x="86.4" y="226" text-anchor="middle" font-size="11" fill="#374151">projects too</text>
<rect x="166.8" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182.8" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="182.8" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="241.20000000000002" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Parent class</text>
<text x="233.20000000000002" y="100" text-anchor="middle" font-size="11" fill="#374151">Common classes:</text>
<text x="233.20000000000002" y="120" text-anchor="middle" font-size="11" fill="#374151">pick Actor</text>
<text x="233.20000000000002" y="140" text-anchor="middle" font-size="11" fill="#374151">Next</text>
<text x="233.20000000000002" y="212" text-anchor="middle" font-size="11" fill="#374151">All Classes shows</text>
<text x="233.20000000000002" y="226" text-anchor="middle" font-size="11" fill="#374151">the full hierarchy</text>
<rect x="313.6" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="329.6" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="329.6" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="388.0" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Name it</text>
<text x="380.0" y="100" text-anchor="middle" font-size="11" fill="#374151">Name: BookActor</text>
<text x="380.0" y="120" text-anchor="middle" font-size="11" fill="#374151">Public or Private</text>
<text x="380.0" y="140" text-anchor="middle" font-size="11" fill="#374151">module: Bookshelf</text>
<text x="380.0" y="212" text-anchor="middle" font-size="11" fill="#374151">Alphanumeric only,</text>
<text x="380.0" y="226" text-anchor="middle" font-size="11" fill="#374151">no spaces</text>
<rect x="460.40000000000003" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="476.40000000000003" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="476.40000000000003" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="534.8000000000001" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Create</text>
<text x="526.8000000000001" y="100" text-anchor="middle" font-size="11" fill="#374151">Create Class writes</text>
<text x="526.8000000000001" y="120" text-anchor="middle" font-size="11" fill="#374151">BookActor.h</text>
<text x="526.8000000000001" y="140" text-anchor="middle" font-size="11" fill="#374151">BookActor.cpp</text>
<text x="526.8000000000001" y="212" text-anchor="middle" font-size="11" fill="#374151">Files land in the</text>
<text x="526.8000000000001" y="226" text-anchor="middle" font-size="11" fill="#374151">module folders</text>
<rect x="607.2" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="623.2" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="623.2" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="681.6" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Compile</text>
<text x="673.6" y="100" text-anchor="middle" font-size="11" fill="#374151">Ctrl+Alt+F11</text>
<text x="673.6" y="120" text-anchor="middle" font-size="11" fill="#374151">Live Coding patches</text>
<text x="673.6" y="140" text-anchor="middle" font-size="11" fill="#374151">the running editor</text>
<text x="673.6" y="212" text-anchor="middle" font-size="11" fill="#374151">The class appears</text>
<text x="673.6" y="226" text-anchor="middle" font-size="11" fill="#374151">in Place Actors</text>
</svg>
