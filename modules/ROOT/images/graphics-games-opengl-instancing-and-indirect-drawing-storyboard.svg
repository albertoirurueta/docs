<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-inst-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from one book to a library of instanced books</text>
<rect x="15" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="65" r="11" fill="#4F46E5"/><text x="30" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="85" y="95" width="14" height="50" fill="#B45309"/>
<text x="100" y="185" font-size="11" fill="#374151" text-anchor="middle">one mesh, one draw call</text>
<text x="100" y="202" font-size="11" fill="#374151" text-anchor="middle">uModel set by uniform</text>
<text x="100" y="240" font-size="10" fill="#374151" text-anchor="middle">fine for a handful of books</text>
<rect x="195" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="210" cy="65" r="11" fill="#B45309"/><text x="210" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<g fill="#B45309"><rect x="215" y="95" width="10" height="40"/><rect x="229" y="100" width="10" height="35"/><rect x="243" y="95" width="10" height="40"/><rect x="257" y="98" width="10" height="37"/><rect x="271" y="95" width="10" height="40"/><rect x="285" y="102" width="10" height="33"/><rect x="299" y="95" width="10" height="40"/><rect x="313" y="99" width="10" height="36"/></g>
<rect x="215" y="135" width="130" height="5" fill="#92400E"/>
<text x="280" y="185" font-size="11" fill="#374151" text-anchor="middle">N books, N draw calls</text>
<text x="280" y="202" font-size="11" fill="#374151" text-anchor="middle">driver overhead on the CPU</text>
<text x="280" y="240" font-size="10" fill="#374151" text-anchor="middle">thousands of calls cost milliseconds</text>
<rect x="375" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="390" cy="65" r="11" fill="#4F46E5"/><text x="390" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<g fill="#4F46E5"><rect x="395" y="95" width="10" height="40"/><rect x="409" y="100" width="10" height="35"/><rect x="423" y="95" width="10" height="40"/><rect x="437" y="98" width="10" height="37"/><rect x="451" y="95" width="10" height="40"/><rect x="465" y="102" width="10" height="33"/><rect x="479" y="95" width="10" height="40"/><rect x="493" y="99" width="10" height="36"/></g>
<rect x="395" y="135" width="130" height="5" fill="#3730A3"/>
<text x="460" y="185" font-size="11" fill="#374151" text-anchor="middle">1 instanced draw call</text>
<text x="460" y="202" font-size="11" fill="#374151" text-anchor="middle">matrix and colour per instance</text>
<text x="460" y="240" font-size="10" fill="#374151" text-anchor="middle">glDrawElementsInstanced</text>
<rect x="555" y="50" width="190" height="240" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<circle cx="570" cy="65" r="11" fill="#047857"/><text x="570" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<g fill="#047857"><rect x="575" y="95" width="10" height="40"/><rect x="589" y="100" width="10" height="35"/><rect x="617" y="98" width="10" height="37"/><rect x="645" y="102" width="10" height="33"/><rect x="673" y="99" width="10" height="36"/></g>
<g fill="none" stroke="#9CA3AF" stroke-dasharray="3 2"><rect x="603" y="95" width="10" height="40"/><rect x="631" y="95" width="10" height="40"/><rect x="659" y="95" width="10" height="40"/></g>
<rect x="575" y="135" width="130" height="5" fill="#047857"/>
<text x="650" y="185" font-size="11" fill="#374151" text-anchor="middle">indirect: culling on the GPU</text>
<text x="650" y="202" font-size="11" fill="#374151" text-anchor="middle">a compute shader fills the</text>
<text x="650" y="219" font-size="11" fill="#374151" text-anchor="middle">instanceCount of each command</text>
<text x="650" y="250" font-size="10" fill="#374151" text-anchor="middle">dashed books are skipped</text>
<path d="M185 170 L195 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-inst-sb)"/>
<path d="M365 170 L375 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-inst-sb)"/>
<path d="M545 170 L555 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-inst-sb)"/>
<rect x="15" y="310" width="730" height="50" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="333" font-size="12" fill="#374151" text-anchor="middle">Same triangles on screen in panels 2 and 3: the saving is CPU and driver work, not GPU shading work.</text>
<text x="380" y="350" font-size="12" fill="#374151" text-anchor="middle">Panel 4 also saves GPU work, because skipped instances are never processed.</text>
</svg>
