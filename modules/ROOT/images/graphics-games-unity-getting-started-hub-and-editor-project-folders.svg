<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gs-folders" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="500" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A new project on disk: what to commit and what to ignore</text>
<rect x="20" y="44" width="330" height="440" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="34" y="68" text-anchor="start" font-size="12" fill="#374151" font-weight="bold">Bookshelf/</text>
<text x="56" y="94" text-anchor="start" font-size="12" fill="#065F46" font-weight="bold">Assets/</text>
<text x="78" y="120" text-anchor="start" font-size="12" fill="#374151">InputSystem_Actions</text>
<text x="78" y="146" text-anchor="start" font-size="12" fill="#374151">Scenes/  (SampleScene)</text>
<text x="78" y="172" text-anchor="start" font-size="12" fill="#374151">Settings/  (URP assets)</text>
<text x="78" y="198" text-anchor="start" font-size="12" fill="#065F46">Bookshelf/  (your folders)</text>
<text x="100" y="224" text-anchor="start" font-size="12" fill="#374151">Models  Materials  Prefabs</text>
<text x="100" y="250" text-anchor="start" font-size="12" fill="#374151">Scripts  ScriptableObjects</text>
<text x="56" y="276" text-anchor="start" font-size="12" fill="#065F46" font-weight="bold">Packages/  (manifest.json)</text>
<text x="56" y="302" text-anchor="start" font-size="12" fill="#065F46" font-weight="bold">ProjectSettings/</text>
<text x="56" y="328" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">Library/</text>
<text x="56" y="354" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">Logs/</text>
<text x="56" y="380" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">Temp/</text>
<text x="56" y="406" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">UserSettings/</text>
<text x="56" y="432" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">*.sln and *.csproj</text>
<rect x="380" y="44" width="360" height="200" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560" y="66" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Commit to version control</text>
<text x="560" y="92" text-anchor="middle" font-size="11" fill="#1F2937">Assets  (including every .meta file)</text>
<text x="560" y="114" text-anchor="middle" font-size="11" fill="#1F2937">Packages/manifest.json and packages-lock.json</text>
<text x="560" y="136" text-anchor="middle" font-size="11" fill="#1F2937">ProjectSettings</text>
<text x="560" y="158" text-anchor="middle" font-size="11" fill="#1F2937">Commit each asset with its .meta file:</text>
<text x="560" y="180" text-anchor="middle" font-size="11" fill="#1F2937">the .meta holds its GUID and import settings</text>
<rect x="380" y="256" width="360" height="228" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560" y="278" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Generated: ignore</text>
<text x="560" y="304" text-anchor="middle" font-size="11" fill="#1F2937">Library  (import cache, rebuilt on demand)</text>
<text x="560" y="326" text-anchor="middle" font-size="11" fill="#1F2937">Temp and Logs</text>
<text x="560" y="348" text-anchor="middle" font-size="11" fill="#1F2937">UserSettings  (per-user window layout)</text>
<text x="560" y="370" text-anchor="middle" font-size="11" fill="#1F2937">Generated IDE project files</text>
<text x="560" y="392" text-anchor="middle" font-size="11" fill="#1F2937">Use the Unity .gitignore template</text>
<text x="560" y="414" text-anchor="middle" font-size="11" fill="#1F2937">Do not keep the project in a synced cloud folder</text>
</svg>
