<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <mask id="mSub" maskUnits="userSpaceOnUse" x="0" y="0" width="130" height="110"><rect x="0" y="0" width="130" height="110" fill="#FFFFFF"/><circle cx="75" cy="62" r="38" fill="#000000"/></mask>
    <clipPath id="cInt"><rect x="10" y="10" width="70" height="70"/></clipPath>
  </defs>
  <rect x="0" y="0" width="720" height="340" fill="#FFFFFF"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The four boolean operations</text>
  <g transform="translate(20,50)"><rect x="0" y="0" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <g transform="translate(15,20)"><rect x="10" y="10" width="70" height="70" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4 3"/><circle cx="75" cy="62" r="38" fill="#FDE68A" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/></g>
    <text x="80" y="150" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Inputs</text><text x="80" y="170" font-size="12" fill="#374151" text-anchor="middle">rectangle (bottom)</text><text x="80" y="186" font-size="12" fill="#374151" text-anchor="middle">circle (top)</text></g>
  <g transform="translate(190,50)"><rect x="0" y="0" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <g transform="translate(15,20)"><rect x="10" y="10" width="70" height="70" fill="#4F46E5"/><circle cx="75" cy="62" r="38" fill="#4F46E5"/></g>
    <text x="80" y="150" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Union</text><text x="80" y="170" font-size="12" fill="#374151" text-anchor="middle">merge outer edges</text><text x="80" y="186" font-size="12" fill="#374151" text-anchor="middle">Opt+Shift+U / Alt+Shift+U</text></g>
  <g transform="translate(360,50)"><rect x="0" y="0" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <g transform="translate(15,20)"><g mask="url(#mSub)"><rect x="10" y="10" width="70" height="70" fill="#4F46E5"/></g></g>
    <text x="80" y="150" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Subtract</text><text x="80" y="170" font-size="12" fill="#374151" text-anchor="middle">top cuts the bottom</text><text x="80" y="186" font-size="12" fill="#374151" text-anchor="middle">Opt+Shift+S / Alt+Shift+S</text></g>
  <g transform="translate(530,50)"><rect x="0" y="0" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <g transform="translate(20,20)"><g clip-path="url(#cInt)"><circle cx="75" cy="62" r="38" fill="#4F46E5"/></g></g>
    <text x="85" y="150" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Intersect</text><text x="85" y="170" font-size="12" fill="#374151" text-anchor="middle">only the overlap</text><text x="85" y="186" font-size="12" fill="#374151" text-anchor="middle">Opt+Shift+I / Alt+Shift+I</text></g>
  <g transform="translate(20,262)"><rect x="0" y="0" width="680" height="52" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="16" y="22" font-size="13" font-weight="bold" fill="#92400E">Exclude (Opt+Shift+E / Alt+Shift+E): keeps everything except the overlap.</text>
    <text x="16" y="42" font-size="12" fill="#92400E">All four stay editable inside a boolean group; Flatten (Opt+Shift+F / Alt+Shift+F) makes the result permanent.</text></g>
  <text x="360" y="332" font-size="11" fill="#6B7280" text-anchor="middle">Schematic: the shapes are generic; Exclude is described in the strip above rather than drawn.</text>
</svg>
