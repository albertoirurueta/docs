<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-gpu-architecture-and-tbdr-unified-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Unified memory and separate video memory</text>
<text x="190" y="56" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Apple silicon</text>
<text x="570" y="56" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Discrete GPU (Intel Macs, other platforms)</text>
<rect x="30" y="75" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="104.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">CPU cores</text>
<rect x="200" y="75" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="104.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">GPU cores</text>
<rect x="30" y="160" width="320" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="190.0" y="186.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">One pool of system memory</text>
<text x="190.0" y="201.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">storageModeShared: both sides see the same bytes</text>
<line x1="105" y1="125" x2="105" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-unified-memory)"/>
<line x1="275" y1="125" x2="275" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-unified-memory)"/>
<rect x="410" y="75" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="475.0" y="104.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU</text>
<rect x="600" y="75" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="104.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU</text>
<rect x="410" y="160" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="475.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">System memory</text>
<rect x="600" y="160" width="130" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="189.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Video memory</text>
<line x1="475" y1="125" x2="475" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-unified-memory)"/>
<line x1="665" y1="125" x2="665" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-unified-memory)"/>
<line x1="540" y1="185" x2="600" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-unified-memory)"/>
<text x="570" y="176" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">copy</text>
<text x="190" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">No copy for shared buffers; private is for GPU-only data.</text>
<text x="570" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Managed storage kept two copies and needed explicit synchronisation.</text>
<text x="380" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MTLStorageMode.managed is deprecated in the 27 OSes because it has no effect on Apple silicon.</text>
</svg>
