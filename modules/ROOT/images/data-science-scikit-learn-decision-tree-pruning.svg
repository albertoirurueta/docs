<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cost-complexity pruning of a decision tree</title>
<desc id="d">Training accuracy falls from 1.000 to 0.932 as the tree is pruned from 16 leaves to 2 leaves, while test accuracy rises from 0.906 to 0.918 at 5 to 7 leaves and then falls to 0.889.</desc>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">Pruning trades training accuracy for a simpler tree</text>
<text x="24" y="58" font-size="12" fill="#475569">Breast cancer data, 398 training rows and 171 test rows; the vertical axis starts at 0.88</text>
<line x1="100" y1="300" x2="680" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="100" y1="70" x2="100" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="100" y1="300.0" x2="680" y2="300.0" stroke="#CBD5E1" stroke-width="1"/>
<text x="92" y="304.0" font-size="12" fill="#475569" text-anchor="end">0.88</text>
<line x1="100" y1="225.3" x2="680" y2="225.3" stroke="#CBD5E1" stroke-width="1"/>
<text x="92" y="229.3" font-size="12" fill="#475569" text-anchor="end">0.92</text>
<line x1="100" y1="150.7" x2="680" y2="150.7" stroke="#CBD5E1" stroke-width="1"/>
<text x="92" y="154.7" font-size="12" fill="#475569" text-anchor="end">0.96</text>
<line x1="100" y1="76.0" x2="680" y2="76.0" stroke="#CBD5E1" stroke-width="1"/>
<text x="92" y="80.0" font-size="12" fill="#475569" text-anchor="end">1.00</text>
<text x="100.0" y="320" font-size="12" fill="#475569" text-anchor="middle">2</text>
<text x="182.9" y="320" font-size="12" fill="#475569" text-anchor="middle">4</text>
<text x="265.7" y="320" font-size="12" fill="#475569" text-anchor="middle">6</text>
<text x="348.6" y="320" font-size="12" fill="#475569" text-anchor="middle">8</text>
<text x="431.4" y="320" font-size="12" fill="#475569" text-anchor="middle">10</text>
<text x="514.3" y="320" font-size="12" fill="#475569" text-anchor="middle">12</text>
