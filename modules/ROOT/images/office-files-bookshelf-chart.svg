<svg viewBox="0 0 900 460" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rendered Bookshelf chart: copies in stock by genre</title>
  <desc id="d">A clustered column chart on the Inventory sheet of books-inventory.xlsx. Five genres on the category axis and copies in stock on the value axis: Fiction 42, Fantasy 35, Science 28, Technology 24, History 19. The chart sits to the right of the data table in cells E2 to M19.</desc>
  <style>
    .t { fill: #1f1f1f; }
    .m { fill: #555555; }
    .box { fill: #888888; fill-opacity: 0.10; stroke: #777777; stroke-width: 1.4; }
    .grid { stroke: #888888; stroke-opacity: 0.35; stroke-width: 1; }
    .axis { stroke: #777777; stroke-width: 1.6; }
    .bar { fill: #2f6fb0; }
    .cell { fill: none; stroke: #777777; stroke-width: 1; }
    .head { fill: #888888; fill-opacity: 0.25; stroke: #777777; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececec; }
      .m { fill: #b5b5b5; }
      .box { stroke: #aaaaaa; }
      .axis, .cell, .head { stroke: #aaaaaa; }
      .bar { fill: #6aa6e6; }
    }
  </style>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" class="t">Result of the XDDF code: books-inventory.xlsx, sheet Inventory</text>

  <!-- worksheet cells A1:B6 -->
  <rect x="20" y="50" width="250" height="372" rx="8" class="box"/>
  <text x="145" y="74" text-anchor="middle" font-size="13" font-weight="700" class="t">Data in A1:B6</text>
  <rect x="40" y="90" width="120" height="30" class="head"/>
  <rect x="160" y="90" width="90" height="30" class="head"/>
  <text x="100" y="110" text-anchor="middle" font-size="13" font-weight="700" class="t">Genre</text>
  <text x="205" y="110" text-anchor="middle" font-size="13" font-weight="700" class="t">Copies</text>
  <g font-size="13" class="t">
    <rect x="40" y="120" width="120" height="30" class="cell"/><rect x="160" y="120" width="90" height="30" class="cell"/>
    <text x="50" y="140">Fiction</text><text x="240" y="140" text-anchor="end">42</text>
    <rect x="40" y="150" width="120" height="30" class="cell"/><rect x="160" y="150" width="90" height="30" class="cell"/>
    <text x="50" y="170">Fantasy</text><text x="240" y="170" text-anchor="end">35</text>
    <rect x="40" y="180" width="120" height="30" class="cell"/><rect x="160" y="180" width="90" height="30" class="cell"/>
    <text x="50" y="200">Science</text><text x="240" y="200" text-anchor="end">28</text>
    <rect x="40" y="210" width="120" height="30" class="cell"/><rect x="160" y="210" width="90" height="30" class="cell"/>
    <text x="50" y="230">Technology</text><text x="240" y="230" text-anchor="end">24</text>
    <rect x="40" y="240" width="120" height="30" class="cell"/><rect x="160" y="240" width="90" height="30" class="cell"/>
    <text x="50" y="260">History</text><text x="240" y="260" text-anchor="end">19</text>
  </g>
  <text x="145" y="300" text-anchor="middle" font-size="12" class="m">categories: A2:A6 (string range)</text>
  <text x="145" y="320" text-anchor="middle" font-size="12" class="m">values: B2:B6 (numeric range)</text>

  <!-- chart -->
  <rect x="290" y="50" width="590" height="372" rx="8" class="box"/>
  <text x="585" y="80" text-anchor="middle" font-size="16" font-weight="700" class="t">Copies in stock by genre</text>
  <text x="318" y="250" text-anchor="middle" font-size="12" class="m" transform="rotate(-90 318 250)">Copies</text>
  <!-- plot area x 370..860, y 100..360 ; max 50 -->
  <g class="grid">
    <line x1="370" y1="360" x2="860" y2="360"/>
    <line x1="370" y1="308" x2="860" y2="308"/>
    <line x1="370" y1="256" x2="860" y2="256"/>
    <line x1="370" y1="204" x2="860" y2="204"/>
    <line x1="370" y1="152" x2="860" y2="152"/>
    <line x1="370" y1="100" x2="860" y2="100"/>
  </g>
  <g font-size="12" class="m" text-anchor="end">
    <text x="362" y="364">0</text><text x="362" y="312">10</text><text x="362" y="260">20</text>
    <text x="362" y="208">30</text><text x="362" y="156">40</text><text x="362" y="104">50</text>
  </g>
  <line x1="370" y1="100" x2="370" y2="360" class="axis"/>
  <line x1="370" y1="360" x2="860" y2="360" class="axis"/>
  <!-- bars: scale 5.2px per copy; slot 98px, bar 58px -->
  <g class="bar">
    <rect x="390" y="141.6" width="58" height="218.4"/>
    <rect x="488" y="178" width="58" height="182"/>
    <rect x="586" y="214.4" width="58" height="145.6"/>
    <rect x="684" y="235.2" width="58" height="124.8"/>
    <rect x="782" y="261.2" width="58" height="98.8"/>
  </g>
  <g font-size="13" font-weight="700" class="t" text-anchor="middle">
    <text x="419" y="134">42</text><text x="517" y="170">35</text><text x="615" y="207">28</text>
    <text x="713" y="228">24</text><text x="811" y="254">19</text>
  </g>
  <g font-size="13" class="t" text-anchor="middle">
    <text x="419" y="380">Fiction</text><text x="517" y="380">Fantasy</text><text x="615" y="380">Science</text>
    <text x="713" y="380">Technology</text><text x="811" y="380">History</text>
  </g>
  <text x="615" y="404" text-anchor="middle" font-size="12" class="m">Genre</text>
  <rect x="724" y="62" width="12" height="12" class="bar"/>
  <text x="742" y="73" font-size="12" class="m">Copies</text>
  <text x="450" y="446" text-anchor="middle" font-size="12" class="m">Illustration of the expected rendering; Excel and LibreOffice apply their own theme colours and fonts.</text>
</svg>
