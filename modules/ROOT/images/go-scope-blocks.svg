<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Go blocks nest from the universe down to a single statement</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">an identifier is looked up from the innermost block outwards; the first declaration found wins</text>
  <!-- universe -->
  <rect x="30" y="62" width="880" height="390" rx="8" fill="#f3f6fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="46" y="84" font-size="14" font-weight="bold" fill="#1c4b73">Universe block</text>
  <text x="46" y="102" font-size="12" fill="#444444">int, string, error, any, true, false, nil, len, append, make, min, max ...</text>
  <!-- package -->
  <rect x="60" y="116" width="820" height="312" rx="8" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="76" y="138" font-size="14" font-weight="bold" fill="#1c4b73">Package block (all files of package main)</text>
  <text x="76" y="156" font-size="12" fill="#444444">var scope = "package"   func main   func show   type Book</text>
  <!-- file -->
  <rect x="90" y="170" width="760" height="244" rx="8" fill="#dbe7f3" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="106" y="192" font-size="14" font-weight="bold" fill="#1c4b73">File block (one per source file)</text>
  <text x="106" y="210" font-size="12" fill="#444444">import "fmt"   the package names of imports are file-scoped</text>
  <!-- function -->
  <rect x="120" y="224" width="700" height="176" rx="8" fill="#cddff0" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="136" y="246" font-size="14" font-weight="bold" fill="#1c4b73">Function block of main</text>
  <text x="136" y="264" font-size="12" fill="#444444">scope := "function"   (shadows the package variable)</text>
  <!-- if -->
  <rect x="150" y="278" width="640" height="108" rx="8" fill="#bcd3ea" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="166" y="300" font-size="14" font-weight="bold" fill="#1c4b73">Implicit block of the if statement</text>
  <text x="166" y="318" font-size="12" fill="#444444">if scope := "if"; len(scope) &gt; 0 { ... }   (scope visible in the condition and all branches)</text>
  <!-- inner -->
  <rect x="180" y="332" width="580" height="44" rx="8" fill="#a9c6e3" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="196" y="359" font-size="13" fill="#222222"><tspan font-weight="bold" fill="#1c4b73">Explicit block { }</tspan>   scope := "inner block"   prints inner block</text>
</svg>
