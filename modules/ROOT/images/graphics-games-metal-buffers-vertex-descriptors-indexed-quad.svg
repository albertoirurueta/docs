<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-buffers-vertex-descriptors-indexed-quad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">An index buffer reuses vertices</text>
<polygon points="90,100 240,100 240,250 90,250" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<line x1="90" y1="250" x2="240" y2="100" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="90" cy="100" r="5" fill="#4F46E5"/>
<text x="74" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v0</text>
<circle cx="240" cy="100" r="5" fill="#4F46E5"/>
<text x="256" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v1</text>
<circle cx="240" cy="250" r="5" fill="#4F46E5"/>
<text x="256" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v2</text>
<circle cx="90" cy="250" r="5" fill="#4F46E5"/>
<text x="74" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v3</text>
<text x="165" y="175" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">A</text>
<text x="165" y="215" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">B</text>
<text x="165" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">4 vertices x 32 bytes = 128 bytes</text>
<rect x="330" y="60" width="180" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="420.0" y="80.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Vertex buffer: v0 v1 v2 v3</text>
<rect x="330" y="120" width="180" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="420.0" y="133.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Index buffer (uint16):</text>
<text x="420.0" y="147.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">0 1 2   0 2 3</text>
<text x="330" y="185" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">triangle A = (v0, v1, v2)</text>
<text x="330" y="203" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">triangle B = (v0, v2, v3)</text>
<text x="330" y="225" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">6 indices x 2 bytes = 12 bytes</text>
<rect x="540" y="60" width="190" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="99.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Without indices:</text>
<text x="635.0" y="113.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">6 vertices x 32 B = 192 B</text>
<text x="635.0" y="127.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="635.0" y="141.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">With indices:</text>
<text x="635.0" y="155.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">128 B + 12 B = 140 B</text>
<text x="635.0" y="169.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="635.0" y="183.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">On real meshes each vertex</text>
<text x="635.0" y="197.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">is shared by about 6 triangles</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">drawIndexedPrimitives(primitiveType: .triangle, indexCount: 6, indexType: .uint16, ...)</text>
</svg>
