<svg viewBox="0 0 760 270" width="760" height="270" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="270" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Horizontal constraint options (layer inside a frame)</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
  <rect x="20" y="50" width="130" height="90" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="30" y="85" width="30" height="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="85" y="165" font-weight="bold" fill="#3730A3" font-size="13">Left</text><text x="85" y="182">Keeps gap to left edge</text>
  <rect x="160" y="50" width="130" height="90" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="250" y="85" width="30" height="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="225" y="165" font-weight="bold" fill="#3730A3" font-size="13">Right</text><text x="225" y="182">Keeps gap to right edge</text>
  <rect x="300" y="50" width="130" height="90" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="350" y="85" width="30" height="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="365" y="165" font-weight="bold" fill="#3730A3" font-size="13">Center</text><text x="365" y="182">Stays centred</text>
  <rect x="440" y="50" width="150" height="90" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="450" y="85" width="130" height="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="515" y="165" font-weight="bold" fill="#3730A3" font-size="13">Left and right</text><text x="515" y="182">Stretches, edge gaps fixed</text>
  <rect x="600" y="50" width="140" height="90" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="630" y="85" width="80" height="20" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="670" y="165" font-weight="bold" fill="#92400E" font-size="13">Scale</text><text x="670" y="182">Keeps its percentage</text>
  </g>
  <text x="380" y="225" font-size="12" fill="#374151" text-anchor="middle">Vertical options mirror these: Top, Bottom, Top and bottom, Center and Scale.</text>
  <text x="380" y="245" font-size="12" fill="#374151" text-anchor="middle">New layers start with Top and Left. Groups and layers in auto layout frames cannot take constraints.</text>
</svg>
