<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Constraints on resize: the Bookshelf catalogue screen</text>
  <rect x="20" y="50" width="160" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="200" y="50" width="160" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="380" y="50" width="160" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="560" y="50" width="180" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <!-- panel1 frame 120x160 -->
  <rect x="40" y="90" width="120" height="150" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="46" y="96" width="30" height="10" rx="3" fill="#C7D2FE"/>
  <rect x="84" y="96" width="70" height="10" rx="3" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="75" y="150" width="50" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="50" y="210" width="100" height="22" rx="11" fill="#4F46E5"/>
  <text x="100" y="225" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- panel2: wider frame -->
  <rect x="210" y="90" width="140" height="150" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="216" y="96" width="30" height="10" rx="3" fill="#C7D2FE"/>
  <rect x="254" y="96" width="90" height="10" rx="3" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="85" y="150" width="0" height="0"/>
  <rect x="255" y="150" width="50" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="220" y="210" width="120" height="22" rx="11" fill="#4F46E5"/>
  <text x="280" y="225" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- panel3: taller + wider -->
  <rect x="390" y="90" width="140" height="170" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="396" y="96" width="30" height="10" rx="3" fill="#C7D2FE"/>
  <rect x="434" y="96" width="90" height="10" rx="3" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="435" y="160" width="50" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="400" y="230" width="120" height="22" rx="11" fill="#4F46E5"/>
  <text x="460" y="245" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- panel4: scale -->
  <rect x="570" y="90" width="160" height="150" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="578" y="98" width="40" height="10" rx="3" fill="#C7D2FE"/>
  <rect x="628" y="98" width="94" height="10" rx="3" fill="#FEF3C7" stroke="#B45309"/>
  <rect x="610" y="150" width="70" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="580" y="210" width="140" height="22" rx="11" fill="#4F46E5"/>
  <text x="650" y="225" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <line x1="182" y1="165" x2="198" y2="165" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="362" y1="165" x2="378" y2="165" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="542" y1="165" x2="558" y2="165" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="30" cy="60" r="11" fill="#4F46E5"/><text x="30" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="210" cy="60" r="11" fill="#4F46E5"/><text x="210" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="390" cy="60" r="11" fill="#4F46E5"/><text x="390" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="570" cy="60" r="11" fill="#B45309"/><text x="570" y="64" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="100" y="298" font-size="12" fill="#374151" text-anchor="middle">Original frame</text>
  <text x="280" y="298" font-size="12" fill="#374151" text-anchor="middle">Wider: title Left+Right grows,</text>
  <text x="280" y="313" font-size="12" fill="#374151" text-anchor="middle">cover Center stays centred</text>
  <text x="460" y="298" font-size="12" fill="#374151" text-anchor="middle">Taller: button Bottom</text>
  <text x="460" y="313" font-size="12" fill="#374151" text-anchor="middle">keeps its gap to the edge</text>
  <text x="650" y="298" font-size="12" fill="#374151" text-anchor="middle">Scale: cover keeps its</text>
  <text x="650" y="313" font-size="12" fill="#374151" text-anchor="middle">percentage of the frame</text>
</svg>
