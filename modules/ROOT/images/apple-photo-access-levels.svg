<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Four levels of photo access</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Choose the leftmost column that does the job</text>

  <defs>
    <marker id="pal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a33333"/>
    </marker>
  </defs>

  <!-- Column 1: PhotosPicker -->
  <rect x="20" y="66" width="170" height="236" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="105" y="92" font-size="15" font-weight="bold" fill="#2d6a34" text-anchor="middle">PhotosPicker</text>
  <text x="105" y="110" font-size="13" fill="#333333" text-anchor="middle">PhotosUI</text>
  <rect x="34" y="122" width="142" height="30" rx="6" fill="#ffffff" stroke="#2d6a34"/>
  <text x="105" y="142" font-size="13" fill="#2d6a34" text-anchor="middle">No prompt</text>
  <text x="105" y="176" font-size="13" fill="#222222" text-anchor="middle">Runs out of process</text>
  <text x="105" y="196" font-size="13" fill="#222222" text-anchor="middle">App gets only the</text>
  <text x="105" y="214" font-size="13" fill="#222222" text-anchor="middle">items the user picks</text>
  <text x="105" y="248" font-size="13" fill="#555555" text-anchor="middle">No Info.plist key</text>
  <text x="105" y="282" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">NotePhotoPicker</text>

  <!-- Column 2: Add-only -->
  <rect x="205" y="66" width="170" height="236" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="290" y="92" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Add-only</text>
  <text x="290" y="110" font-size="13" fill="#333333" text-anchor="middle">PHAccessLevel.addOnly</text>
  <rect x="219" y="122" width="142" height="30" rx="6" fill="#ffffff" stroke="#1c4b73"/>
  <text x="290" y="142" font-size="13" fill="#1c4b73" text-anchor="middle">One prompt</text>
  <text x="290" y="176" font-size="13" fill="#222222" text-anchor="middle">Can save new assets</text>
  <text x="290" y="196" font-size="13" fill="#222222" text-anchor="middle">Cannot read</text>
  <text x="290" y="214" font-size="13" fill="#222222" text-anchor="middle">anything</text>
  <text x="290" y="248" font-size="13" fill="#555555" text-anchor="middle">NSPhotoLibrary-</text>
  <text x="290" y="264" font-size="13" fill="#555555" text-anchor="middle">AddUsageDescription</text>
  <text x="290" y="288" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">PhotoLibrarySaver</text>

  <!-- Column 3: Limited -->
  <rect x="390" y="66" width="170" height="236" rx="10" fill="#fdf5e6" stroke="#9a6200" stroke-width="1.6"/>
  <text x="475" y="92" font-size="15" font-weight="bold" fill="#9a6200" text-anchor="middle">Limited</text>
  <text x="475" y="110" font-size="13" fill="#333333" text-anchor="middle">.readWrite, answered</text>
  <rect x="404" y="122" width="142" height="30" rx="6" fill="#ffffff" stroke="#9a6200"/>
  <text x="475" y="142" font-size="13" fill="#9a6200" text-anchor="middle">"Limit access"</text>
  <text x="475" y="176" font-size="13" fill="#222222" text-anchor="middle">Reads a subset the</text>
  <text x="475" y="196" font-size="13" fill="#222222" text-anchor="middle">user selected; can</text>
  <text x="475" y="214" font-size="13" fill="#222222" text-anchor="middle">ask to select more</text>
  <text x="475" y="248" font-size="13" fill="#555555" text-anchor="middle">NSPhotoLibrary-</text>
  <text x="475" y="264" font-size="13" fill="#555555" text-anchor="middle">UsageDescription</text>
  <text x="475" y="288" font-size="13" font-weight="bold" fill="#9a6200" text-anchor="middle">status .limited</text>

  <!-- Column 4: Full -->
  <rect x="575" y="66" width="165" height="236" rx="10" fill="#fbecec" stroke="#a33333" stroke-width="1.6"/>
  <text x="657" y="92" font-size="15" font-weight="bold" fill="#a33333" text-anchor="middle">Full access</text>
  <text x="657" y="110" font-size="13" fill="#333333" text-anchor="middle">.readWrite, allowed</text>
  <rect x="589" y="122" width="137" height="30" rx="6" fill="#ffffff" stroke="#a33333"/>
  <text x="657" y="142" font-size="13" fill="#a33333" text-anchor="middle">"Allow full access"</text>
  <text x="657" y="176" font-size="13" fill="#222222" text-anchor="middle">Reads and changes</text>
  <text x="657" y="196" font-size="13" fill="#222222" text-anchor="middle">the whole library</text>
  <text x="657" y="214" font-size="13" fill="#222222" text-anchor="middle">and its albums</text>
  <text x="657" y="248" font-size="13" fill="#555555" text-anchor="middle">NSPhotoLibrary-</text>
  <text x="657" y="264" font-size="13" fill="#555555" text-anchor="middle">UsageDescription</text>
  <text x="657" y="288" font-size="13" font-weight="bold" fill="#a33333" text-anchor="middle">status .authorized</text>

  <!-- Friction arrow -->
  <line x1="40" y1="334" x2="716" y2="334" stroke="#a33333" stroke-width="2" marker-end="url(#pal-arrow)"/>
  <text x="380" y="360" font-size="13" fill="#a33333" text-anchor="middle">More access to the right: more user friction and more privacy cost</text>
</svg>
