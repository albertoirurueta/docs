<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Text box resizing modes</text>
  <!-- panel 1 -->
  <rect x="20" y="50" width="226" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="34" cy="64" r="11" fill="#4F46E5"/><text x="34" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="133" y="84" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Auto width</text>
  <rect x="40" y="110" width="150" height="26" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3"/>
  <text x="48" y="128" font-size="14" fill="#1F2937">The Hobbit</text>
  <rect x="40" y="154" width="186" height="26" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3"/>
  <text x="48" y="172" font-size="14" fill="#1F2937">The Hobbit, or There and Back</text>
  <text x="133" y="214" font-size="12" fill="#374151" text-anchor="middle">The box grows sideways</text>
  <text x="133" y="232" font-size="12" fill="#374151" text-anchor="middle">with the text. New lines</text>
  <text x="133" y="250" font-size="12" fill="#374151" text-anchor="middle">only after Enter.</text>
  <!-- panel 2 -->
  <rect x="267" y="50" width="226" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="281" cy="64" r="11" fill="#4F46E5"/><text x="281" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="380" y="84" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Auto height</text>
  <rect x="300" y="104" width="160" height="60" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3"/>
  <text x="308" y="124" font-size="14" fill="#1F2937">The Hobbit, or There</text>
  <text x="308" y="142" font-size="14" fill="#1F2937">and Back Again</text>
  <rect x="300" y="170" width="160" height="6" fill="#B45309"/>
  <text x="380" y="214" font-size="12" fill="#374151" text-anchor="middle">Width is fixed, text wraps,</text>
  <text x="380" y="232" font-size="12" fill="#374151" text-anchor="middle">and the height follows the</text>
  <text x="380" y="250" font-size="12" fill="#374151" text-anchor="middle">number of lines.</text>
  <!-- panel 3 -->
  <rect x="514" y="50" width="226" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="528" cy="64" r="11" fill="#B45309"/><text x="528" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="627" y="84" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Fixed size</text>
  <rect x="547" y="104" width="160" height="70" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3"/>
  <text x="555" y="124" font-size="14" fill="#1F2937">The Hobbit, or There</text>
  <text x="555" y="142" font-size="14" fill="#1F2937">and Back Again, a</text>
  <text x="555" y="160" font-size="14" fill="#B91C1C">long subtitle that...</text>
  <text x="627" y="214" font-size="12" fill="#374151" text-anchor="middle">Width and height stay put;</text>
  <text x="627" y="232" font-size="12" fill="#374151" text-anchor="middle">only this mode supports</text>
  <text x="627" y="250" font-size="12" fill="#374151" text-anchor="middle">vertical alignment.</text>
  <text x="627" y="280" font-size="11" fill="#B91C1C" text-anchor="middle">Overflow can hide or spill out</text>
</svg>
