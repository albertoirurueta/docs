<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Label slicing with loc versus position slicing with iloc</title>
<desc id="d">A Series with labels a to e at positions 0 to 4. The expression loc b to d selects labels b, c and d, so both ends are included. The expression iloc 1 to 3 selects positions 1 and 2, so the stop position is excluded.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="30" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Two ways to cut the same five rows</text>
<text x="36" y="56" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">s.loc selects by label; the stop label is included</text>
<text x="684" y="56" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="end" font-family="Menlo, Consolas, monospace">s.loc["b":"d"]</text>
<rect x="36" y="70" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="96.0" y="92.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">a : 10</text>
<text x="96" y="124" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label a</text>
<text x="96" y="142" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 0</text>
<rect x="166" y="70" width="120" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="226.0" y="92.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">b : 20</text>
<text x="226" y="124" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label b</text>
<text x="226" y="142" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 1</text>
<rect x="296" y="70" width="120" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="356.0" y="92.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">c : 30</text>
<text x="356" y="124" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label c</text>
<text x="356" y="142" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 2</text>
<rect x="426" y="70" width="120" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="486.0" y="92.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">d : 40</text>
<text x="486" y="124" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label d</text>
<text x="486" y="142" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 3</text>
<rect x="556" y="70" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="616.0" y="92.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">e : 50</text>
<text x="616" y="124" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label e</text>
<text x="616" y="142" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 4</text>
<text x="36" y="186" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">s.iloc selects by position; the stop position is excluded</text>
<text x="684" y="186" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="end" font-family="Menlo, Consolas, monospace">s.iloc[1:3]</text>
<rect x="36" y="200" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="96.0" y="222.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">a : 10</text>
<text x="96" y="254" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label a</text>
<text x="96" y="272" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 0</text>
<rect x="166" y="200" width="120" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="226.0" y="222.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">b : 20</text>
<text x="226" y="254" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label b</text>
<text x="226" y="272" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 1</text>
<rect x="296" y="200" width="120" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="356.0" y="222.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">c : 30</text>
<text x="356" y="254" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label c</text>
<text x="356" y="272" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 2</text>
<rect x="426" y="200" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="486.0" y="222.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">d : 40</text>
<text x="486" y="254" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label d</text>
<text x="486" y="272" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 3</text>
<rect x="556" y="200" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="616.0" y="222.0" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">e : 50</text>
<text x="616" y="254" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">label e</text>
<text x="616" y="272" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">position 4</text>
</svg>
