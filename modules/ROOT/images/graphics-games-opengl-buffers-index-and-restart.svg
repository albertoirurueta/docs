<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-buffers-index-and-restart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Index buffers and primitive restart</text>
<text x="190" y="56" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Vertex buffer (4 vertices)</text>
<rect x="40" y="70" width="70" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="75.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v0</text>
<rect x="115" y="70" width="70" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v1</text>
<rect x="190" y="70" width="70" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="225.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v2</text>
<rect x="265" y="70" width="70" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="300.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">v3</text>
<text x="570" y="56" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Index buffer (GL_UNSIGNED_SHORT)</text>
<rect x="400" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="425.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">0</text>
<rect x="455" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="480.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">1</text>
<rect x="510" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="535.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">2</text>
<rect x="565" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="590.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">2</text>
<rect x="620" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">1</text>
<rect x="675" y="70" width="50" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="700.0" y="92.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">3</text>
<text x="570" y="128" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">two triangles: (0,1,2) and (2,1,3)</text>
<polygon points="60,230 200,230 130,160" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><polygon points="200,230 130,160 270,160" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="60" y="248" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">v0</text>
<text x="130" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">v1</text>
<text x="200" y="248" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">v2</text>
<text x="270" y="152" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">v3</text>
<rect x="330" y="180" width="410" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="535.0" y="204.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glEnable(GL_PRIMITIVE_RESTART_FIXED_INDEX)</text>
<text x="535.0" y="218.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">restart index = 0xFFFF for 16-bit, 0xFFFFFFFF for 32-bit</text>
<rect x="330" y="254" width="410" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="535.0" y="278.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Strip: 0 1 2 3 0xFFFF 4 5 6 7</text>
<text x="535.0" y="293.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">one draw call, two separate strips</text>
<text x="190" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">4 vertices instead of 6 for the quad</text>
</svg>
