<svg viewBox="0 0 740 300" width="740" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs><rect width="740" height="300" fill="#FFFFFF"/>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Video triggers and actions in the Prototype tab</text>
<rect x="30" y="55" width="320" height="200" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="190" y="82" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Triggers that start from a video</text>
<rect x="55" y="105" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="190" y="124" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">When video hits</text><text x="190" y="140" font-size="12" fill="#374151" text-anchor="middle">fires at a chosen timestamp</text>
<rect x="55" y="170" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="190" y="189" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">When video ends</text><text x="190" y="205" font-size="12" fill="#374151" text-anchor="middle">fires when playback completes</text>
<rect x="390" y="55" width="320" height="200" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="550" y="82" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Actions that end on a video</text>
<g font-size="12.5" fill="#374151"><text x="415" y="112">- Play, Pause or Toggle play/pause</text><text x="415" y="136">- Mute, Unmute or Toggle mute</text><text x="415" y="160">- Jump to a set time</text><text x="415" y="184">- Jump forward or backward by seconds</text><text x="415" y="215">Any trigger can drive these actions.</text></g>
<path d="M350 155 H388" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="370" y="282" font-size="12" fill="#374151" text-anchor="middle">Simplified schematic; exact option names follow the current Figma interface.</text>
</svg>
