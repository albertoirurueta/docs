<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Three classes of AI credit cost (checked 2026-10-30)</text>
  <rect x="30" y="50" width="220" height="250" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="140" y="80" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Free</text>
  <text x="50" y="112" font-size="12" fill="#374151">AI search</text>
  <text x="50" y="134" font-size="12" fill="#374151">Rename layers</text>
  <text x="50" y="156" font-size="12" fill="#374151">Sort and summarize</text>
  <text x="50" y="174" font-size="12" fill="#374151">stickies (FigJam)</text>
  <text x="50" y="270" font-size="12" fill="#047857">Still needs the right plan.</text>
  <rect x="270" y="50" width="220" height="250" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="80" font-size="15" font-weight="bold" fill="#3730A3" text-anchor="middle">Fixed per use</text>
  <text x="290" y="112" font-size="12" fill="#374151">Remove background</text>
  <text x="290" y="134" font-size="12" fill="#374151">Vectorize, boost, expand</text>
  <text x="290" y="156" font-size="12" fill="#374151">Erase and isolate</text>
  <text x="290" y="178" font-size="12" fill="#374151">Make and edit image</text>
  <text x="290" y="200" font-size="12" fill="#374151">Add interactions</text>
  <text x="290" y="270" font-size="12" fill="#3730A3">Amount is on the credits page.</text>
  <rect x="510" y="50" width="220" height="250" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="620" y="80" font-size="15" font-weight="bold" fill="#92400E" text-anchor="middle">Variable</text>
  <text x="530" y="112" font-size="12" fill="#374151">Figma agent</text>
  <text x="530" y="134" font-size="12" fill="#374151">Figma Make</text>
  <text x="530" y="156" font-size="12" fill="#374151">Code layers</text>
  <text x="530" y="270" font-size="12" fill="#92400E">Depends on model, task and</text>
  <text x="530" y="288" font-size="12" fill="#92400E">context. Undo gives no refund.</text>
  <text x="380" y="334" font-size="12" fill="#4B5563" text-anchor="middle">Allowances are per seat and plan tier and reset monthly; see the credits page for current numbers.</text>
