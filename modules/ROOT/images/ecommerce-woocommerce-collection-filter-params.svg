<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From a Product Filters block to a filtered product list</title>
  <desc id="d">Left column: the Product Filters child blocks (price, rating, availability, attribute and taxonomy) and the URL parameter each one writes (min_price and max_price, rating_filter, filter_stock_status, filter_ followed by the attribute slug together with query_type_ and the slug, and categories, tags, brands or filter_ followed by the taxonomy). The middle shows the browser step: the Interactivity API store navigates to the new URL, using the router region or a full page reload when forcePageReload is true. The right shows the server step: the Product Collection query gets extra clauses from the parameters, the filter blocks read counts and price range from FilterData, which caches them, and two filters let a plugin replace or adjust that data.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Product Filters: the URL is the state</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Every filter block writes query parameters; the Product Collection and the filter counts read them back on the server</text>
  <text x="40" y="90" font-size="13" font-weight="bold" fill="#f4b860">Filter blocks inside woocommerce/product-filters</text>
  <rect x="40" y="104" width="300" height="52" rx="6" fill="#3d5266"/>
  <text x="54" y="126" font-size="12.5" font-weight="bold" fill="#f2f5f8">product-filter-price</text>
  <text x="54" y="146" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">min_price, max_price</text>
  <rect x="40" y="166" width="300" height="52" rx="6" fill="#3d5266"/>
  <text x="54" y="188" font-size="12.5" font-weight="bold" fill="#f2f5f8">product-filter-rating</text>
  <text x="54" y="208" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">rating_filter</text>
  <rect x="40" y="228" width="300" height="52" rx="6" fill="#3d5266"/>
  <text x="54" y="250" font-size="12.5" font-weight="bold" fill="#f2f5f8">product-filter-status</text>
  <text x="54" y="270" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">filter_stock_status</text>
  <rect x="40" y="290" width="300" height="52" rx="6" fill="#3d5266"/>
  <text x="54" y="312" font-size="12.5" font-weight="bold" fill="#f2f5f8">product-filter-attribute</text>
  <text x="54" y="332" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">filter_origin, query_type_origin</text>
  <rect x="40" y="352" width="300" height="52" rx="6" fill="#3d5266"/>
  <text x="54" y="374" font-size="12.5" font-weight="bold" fill="#f2f5f8">product-filter-taxonomy</text>
  <text x="54" y="394" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">categories, tags, brands, filter_&lt;taxonomy&gt;</text>
  <path d="M340 258 L378 258" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="380" y="90" font-size="13" font-weight="bold" fill="#f4b860">Browser</text>
  <rect x="380" y="104" width="230" height="154" rx="6" fill="#3d5266"/>
  <text x="495.0" y="158.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Interactivity API store</text>
  <text x="495.0" y="176.5" font-size="12" fill="#f2f5f8" text-anchor="middle">woocommerce/product-filters</text>
  <text x="495.0" y="194.5" font-size="12" fill="#f2f5f8" text-anchor="middle">actions.navigate()</text>
  <text x="495.0" y="212.5" font-size="12" fill="#f2f5f8" text-anchor="middle">writes the parameters into the URL</text>
  <rect x="380" y="272" width="230" height="142" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="495.0" y="311.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Client-side navigation</text>
  <text x="495.0" y="329.5" font-size="12" fill="#f2f5f8" text-anchor="middle">replaces the router region</text>
  <text x="495.0" y="347.5" font-size="12" fill="#f2f5f8" text-anchor="middle"></text>
  <text x="495.0" y="365.5" font-size="12" fill="#f2f5f8" text-anchor="middle">forcePageReload: true</text>
  <text x="495.0" y="383.5" font-size="12" fill="#f2f5f8" text-anchor="middle">does a full page load instead</text>
  <path d="M495 258 L495 270" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M610 258 L648 258" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="650" y="90" font-size="13" font-weight="bold" fill="#f4b860">Server</text>
  <rect x="650" y="104" width="270" height="98" rx="6" fill="#3d5266"/>
  <text x="785.0" y="130.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Product Collection</text>
  <text x="785.0" y="148.5" font-size="12" fill="#f2f5f8" text-anchor="middle">inherit or filterable: true</text>
  <text x="785.0" y="166.5" font-size="12" fill="#f2f5f8" text-anchor="middle">the Params list picks the known keys</text>
  <text x="785.0" y="184.5" font-size="12" fill="#f2f5f8" text-anchor="middle">and QueryClauses add the SQL clauses</text>
  <rect x="650" y="214" width="270" height="98" rx="6" fill="#3d5266"/>
  <text x="785.0" y="240.5" font-size="12" font-weight="bold" fill="#f2f5f8" text-anchor="middle">FilterData</text>
  <text x="785.0" y="258.5" font-size="12" fill="#f2f5f8" text-anchor="middle">price range, stock, rating, attribute</text>
  <text x="785.0" y="276.5" font-size="12" fill="#f2f5f8" text-anchor="middle">and taxonomy counts for the</text>
  <text x="785.0" y="294.5" font-size="12" fill="#f2f5f8" text-anchor="middle">current query, cached in transients</text>
  <rect x="650" y="324" width="270" height="90" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="785.0" y="346.5" font-size="11" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Your hooks</text>
  <text x="785.0" y="364.5" font-size="11" fill="#f2f5f8" text-anchor="middle">woocommerce_pre_product_filter_data</text>
  <text x="785.0" y="382.5" font-size="11" fill="#f2f5f8" text-anchor="middle">woocommerce_product_filter_data</text>
  <text x="785.0" y="400.5" font-size="11" fill="#f2f5f8" text-anchor="middle">woocommerce_product_filter_cache_max_entries</text>
  <rect x="40" y="440" width="880" height="96" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="464" font-size="12.5" fill="#f2f5f8">Legacy filter blocks (woocommerce/price-filter, attribute-filter, stock-filter, rating-filter, active-filters, filter-wrapper) still render in saved content</text>
  <text x="56" y="484" font-size="12.5" fill="#f2f5f8">but are hidden from the inserter in 11.2.1 (their supports.inserter is false).</text>
  <text x="56" y="504" font-size="12.5" fill="#f2f5f8">New pages use woocommerce/product-filters; the legacy blocks stay so that content saved earlier keeps working.</text>
</svg>
