<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t d">
<title id="t">Integer versus RandomState instance as random_state</title>
<desc id="d">Two rows of three cross-validation folds. With an integer seed each fit restarts from the same random stream, so all folds use identical randomness. With a RandomState instance each fit continues the same generator, so every fold gets a different part of the stream.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="388" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">What random_state does across folds</text>
<text x="24" y="62" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">random_state=123</text>
<text x="24" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">integer</text>
<rect x="70" y="92" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="160" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 1</text>
<rect x="90" y="126" width="140" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="160" y="149" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream A (reset)</text>
<line x1="252" y1="134" x2="278" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="280" y="92" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="370" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 2</text>
<rect x="300" y="126" width="140" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="370" y="149" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream A (reset)</text>
<line x1="462" y1="134" x2="488" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="490" y="92" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="580" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 3</text>
<rect x="510" y="126" width="140" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="580" y="149" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream A (reset)</text>
<text x="360" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Same randomness in every fold: the same random features, the same bootstrap draws</text>
<circle cx="52" cy="134" r="11" fill="#0F172A"/><text x="52" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="24" y="232" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">random_state=RandomState(0)</text>
<text x="24" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">instance</text>
<rect x="70" y="262" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="160" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 1</text>
<rect x="90" y="296" width="140" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="160" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream A</text>
<line x1="252" y1="304" x2="278" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="280" y="262" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="370" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 2</text>
<rect x="300" y="296" width="140" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="370" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream B</text>
<line x1="462" y1="304" x2="488" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="490" y="262" width="180" height="84" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="580" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">fit on fold 3</text>
<rect x="510" y="296" width="140" height="36" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="580" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">stream C</text>
<text x="360" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">The generator is consumed: each fold continues where the previous one stopped</text>
<circle cx="52" cy="304" r="11" fill="#0F172A"/><text x="52" y="309" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
</svg>
