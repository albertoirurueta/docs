<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Back office setup order</title>
  <desc id="d">Nine setup steps in the order that respects the dependencies between back office areas: shop identity, localization, taxes, catalog, shipping, payment, customers and discounts, traffic and performance, and launch.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="250" height="110" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="48" text-anchor="middle" font-weight="bold">1  Shop identity</text>
  <text x="145" y="74" text-anchor="middle" font-size="12">Shop Parameters > General,</text>
  <text x="145" y="94" text-anchor="middle" font-size="12">Contact; default country,</text>
  <text x="145" y="114" text-anchor="middle" font-size="12">time zone, logo</text>
  <rect x="305" y="20" width="250" height="110" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="430" y="48" text-anchor="middle" font-weight="bold">2  Localization</text>
  <text x="430" y="74" text-anchor="middle" font-size="12">International > Localization:</text>
  <text x="430" y="94" text-anchor="middle" font-size="12">languages, currencies,</text>
  <text x="430" y="114" text-anchor="middle" font-size="12">locations (zones, countries)</text>
  <rect x="590" y="20" width="250" height="110" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="715" y="48" text-anchor="middle" font-weight="bold">3  Taxes</text>
  <text x="715" y="74" text-anchor="middle" font-size="12">International > Taxes:</text>
  <text x="715" y="94" text-anchor="middle" font-size="12">taxes, tax rules groups,</text>
  <text x="715" y="114" text-anchor="middle" font-size="12">tax rules per country</text>
  <rect x="20" y="180" width="250" height="110" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="208" text-anchor="middle" font-weight="bold">4  Catalog</text>
  <text x="145" y="234" text-anchor="middle" font-size="12">Catalog: categories,</text>
  <text x="145" y="254" text-anchor="middle" font-size="12">attributes, features,</text>
  <text x="145" y="274" text-anchor="middle" font-size="12">products, stock</text>
  <rect x="305" y="180" width="250" height="110" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="430" y="208" text-anchor="middle" font-weight="bold">5  Shipping</text>
  <text x="430" y="234" text-anchor="middle" font-size="12">Shipping > Carriers:</text>
  <text x="430" y="254" text-anchor="middle" font-size="12">zones, ranges, tax group,</text>
  <text x="430" y="274" text-anchor="middle" font-size="12">Preferences: handling, free</text>
  <rect x="590" y="180" width="250" height="110" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="715" y="208" text-anchor="middle" font-weight="bold">6  Payment</text>
  <text x="715" y="234" text-anchor="middle" font-size="12">Payment > Payment Methods,</text>
  <text x="715" y="254" text-anchor="middle" font-size="12">Preferences: restrictions by</text>
  <text x="715" y="274" text-anchor="middle" font-size="12">currency, group, country, carrier</text>
  <rect x="20" y="340" width="250" height="110" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="368" text-anchor="middle" font-weight="bold">7  Customers and discounts</text>
  <text x="145" y="394" text-anchor="middle" font-size="12">Customers > groups,</text>
  <text x="145" y="414" text-anchor="middle" font-size="12">Catalog > Discounts:</text>
  <text x="145" y="434" text-anchor="middle" font-size="12">cart rules, catalog price rules</text>
  <rect x="305" y="340" width="250" height="110" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="430" y="368" text-anchor="middle" font-weight="bold">8  Traffic and performance</text>
  <text x="430" y="394" text-anchor="middle" font-size="12">Shop Parameters > Traffic &amp; SEO,</text>
  <text x="430" y="414" text-anchor="middle" font-size="12">Advanced Parameters ></text>
  <text x="430" y="434" text-anchor="middle" font-size="12">Performance, E-mail, Security</text>
  <rect x="590" y="340" width="250" height="110" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="715" y="368" text-anchor="middle" font-weight="bold">9  Launch</text>
  <text x="715" y="394" text-anchor="middle" font-size="12">Test orders, then maintenance</text>
  <text x="715" y="414" text-anchor="middle" font-size="12">mode off (Shop Parameters ></text>
  <text x="715" y="434" text-anchor="middle" font-size="12">General > Maintenance)</text>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M270 75 L303 75"/>
    <path d="M555 75 L588 75"/>
    <path d="M270 235 L303 235"/>
    <path d="M555 235 L588 235"/>
    <path d="M270 395 L303 395"/>
    <path d="M555 395 L588 395"/>
  </g>
</svg>
