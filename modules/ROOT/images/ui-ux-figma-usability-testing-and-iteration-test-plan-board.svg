<svg viewBox="0 0 720 400" width="720" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="400" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A one-page test plan board for the Bookshelf review flow</text>
<rect x="30" y="50" width="320" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="46" y="76" font-size="14" font-weight="bold" fill="#3730A3">Goal and question</text>
<text x="46" y="98" font-size="12" fill="#374151">Can a new reader find a book and leave</text>
<text x="46" y="114" font-size="12" fill="#374151">a review without help?</text>
<rect x="46" y="124" width="140" height="10" rx="5" fill="#E5E7EB"/>
<rect x="370" y="50" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="386" y="76" font-size="14" font-weight="bold" fill="#3730A3">Participants</text>
<text x="386" y="98" font-size="12" fill="#374151">5 readers who buy books online,</text>
<text x="386" y="114" font-size="12" fill="#374151">none involved in the design</text>
<rect x="386" y="124" width="100" height="10" rx="5" fill="#E5E7EB"/>
<rect x="30" y="170" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="46" y="196" font-size="14" font-weight="bold" fill="#3730A3">Tasks (scenario wording)</text>
<text x="46" y="218" font-size="12" fill="#374151">1. You want a mystery novel: find one.</text>
<text x="46" y="234" font-size="12" fill="#374151">2. Add it to your shelf.</text>
<text x="46" y="250" font-size="12" fill="#374151">3. You finished it: leave a review.</text>
<rect x="370" y="170" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="386" y="196" font-size="14" font-weight="bold" fill="#3730A3">Method and set-up</text>
<text x="386" y="218" font-size="12" fill="#374151">Moderated, think aloud, 20 minutes</text>
<text x="386" y="234" font-size="12" fill="#374151">Trimmed prototype link, hints off</text>
<text x="386" y="250" font-size="12" fill="#374151">Screen recorded with consent</text>
<rect x="30" y="290" width="320" height="90" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="46" y="316" font-size="14" font-weight="bold" fill="#92400E">Metrics</text>
<text x="46" y="338" font-size="12" fill="#374151">Task success, time on task, errors,</text>
<text x="46" y="354" font-size="12" fill="#374151">a 1 to 5 ease rating after each task</text>
<rect x="370" y="290" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="386" y="316" font-size="14" font-weight="bold" fill="#3730A3">Roles and schedule</text>
<text x="386" y="338" font-size="12" fill="#374151">Facilitator, note-taker, observer</text>
<text x="386" y="354" font-size="12" fill="#374151">Pilot first, then the five sessions</text>
<circle cx="30" cy="50" r="11" fill="#4F46E5"/><text x="30" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="370" cy="50" r="11" fill="#4F46E5"/><text x="370" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="30" cy="170" r="11" fill="#4F46E5"/><text x="30" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="370" cy="170" r="11" fill="#4F46E5"/><text x="370" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="30" cy="290" r="11" fill="#B45309"/><text x="30" y="294" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="370" cy="290" r="11" fill="#4F46E5"/><text x="370" y="294" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
</svg>
