<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The organizational units of Finance: company code, controlling area, profit center, cost center, segment and the legacy business area</title>
  <desc id="d">Inside a client, several company codes are assigned to one controlling area, each company code to exactly one. A controlling area holds many profit centers and many cost centers, and every one of them belongs to one controlling area. A profit center can carry a segment, and many profit centers can share one segment. A business area is optional and legacy; it can be derived from the cost center. Example Trading Co. has company code EX01 in controlling area EX00.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="1000" height="520" rx="14" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="46" text-anchor="start" font-size="15" font-weight="bold">Client: the units below are defined inside one client</text>
  <rect x="60" y="80" width="240" height="76" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="180" y="103.5" text-anchor="middle" font-size="14" font-weight="bold">Company code</text>
  <text x="180" y="122.5" text-anchor="middle" font-size="12">external accounting, own books</text>
  <text x="180" y="141.5" text-anchor="middle" font-size="12">example: EX01</text>
  <rect x="400" y="80" width="260" height="76" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="530" y="103.5" text-anchor="middle" font-size="14" font-weight="bold">Controlling area</text>
  <text x="530" y="122.5" text-anchor="middle" font-size="12">management accounting</text>
  <text x="530" y="141.5" text-anchor="middle" font-size="12">example: EX00</text>
  <line x1="300" y1="118" x2="400" y2="118" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="108" text-anchor="middle" font-size="12">n : 1</text>
  <rect x="760" y="80" width="240" height="76" rx="10" fill="#1e1b4b" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <text x="880" y="103.5" text-anchor="middle" font-size="14" font-weight="bold">Business area</text>
  <text x="880" y="122.5" text-anchor="middle" font-size="12">optional, legacy</text>
  <text x="880" y="141.5" text-anchor="middle" font-size="12">external segment view</text>
  <rect x="240" y="250" width="260" height="76" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="370" y="273.5" text-anchor="middle" font-size="14" font-weight="bold">Profit center</text>
  <text x="370" y="292.5" text-anchor="middle" font-size="12">area of responsibility for results</text>
  <text x="370" y="311.5" text-anchor="middle" font-size="12">belongs to one controlling area</text>
  <rect x="640" y="250" width="260" height="76" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="770" y="273.5" text-anchor="middle" font-size="14" font-weight="bold">Cost center</text>
  <text x="770" y="292.5" text-anchor="middle" font-size="12">place where costs occur</text>
  <text x="770" y="311.5" text-anchor="middle" font-size="12">belongs to one controlling area</text>
  <line x1="480" y1="156" x2="400" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="196" text-anchor="end" font-size="12">1 : n</text>
  <line x1="580" y1="156" x2="700" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="660" y="196" text-anchor="start" font-size="12">1 : n</text>
  <line x1="860" y1="250" x2="860" y2="156" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="872" y="210" text-anchor="start" font-size="12">can be derived from</text>
  <text x="872" y="226" text-anchor="start" font-size="12">the cost center</text>
  <rect x="240" y="410" width="260" height="76" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="370" y="433.5" text-anchor="middle" font-size="14" font-weight="bold">Segment</text>
  <text x="370" y="452.5" text-anchor="middle" font-size="12">division for external reporting</text>
  <text x="370" y="471.5" text-anchor="middle" font-size="12">set in the profit center</text>
  <line x1="370" y1="326" x2="370" y2="410" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="382" y="372" text-anchor="start" font-size="12">n : 1, optional</text>
  <rect x="640" y="410" width="360" height="76" rx="10" fill="#5b9bd5" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="820" y="433.5" text-anchor="middle" font-size="14" font-weight="bold">Example Trading Co.</text>
  <text x="820" y="452.5" text-anchor="middle" font-size="12">EX01 (EUR, group currency GBP) in EX00</text>
  <text x="820" y="471.5" text-anchor="middle" font-size="12">EX00 holds the profit and cost centers</text>
</svg>
