<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="stackoverflow-questions-hosted-t stackoverflow-questions-hosted-d">
<title id="stackoverflow-questions-hosted-t">Stack Overflow questions per year (hosted builders)</title>
<desc id="stackoverflow-questions-hosted-d">Questions asked each year on Stack Overflow with the tag of Webflow, Wix, Squarespace, 2018 to 2025. Every tag falls steeply from 2023, mirroring the decline of the whole site, so the trend says little about the popularity of a CMS. The partial year 2026 is omitted.</desc>
