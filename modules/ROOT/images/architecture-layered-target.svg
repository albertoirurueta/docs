<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="580" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Layered target architecture: browser SPA and native apps, gateway/BFF, API, services</text>

  <defs>
    <marker id="lt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Row 1: clients -->
  <rect x="60" y="60" width="260" height="70" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="190" y="88" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="190" y="106" font-size="10.5" fill="#444444" text-anchor="middle">bookshop-web (React SPA)</text>

  <rect x="460" y="60" width="260" height="70" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2"/>
  <text x="590" y="82" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Native mobile apps</text>
  <text x="590" y="100" font-size="10.5" fill="#444444" text-anchor="middle">bookshop-android (Kotlin)</text>
  <text x="590" y="115" font-size="10.5" fill="#444444" text-anchor="middle">iOS app (Swift)</text>

  <line x1="190" y1="130" x2="290" y2="185" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#lt-arrow)"/>
  <line x1="590" y1="130" x2="490" y2="185" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#lt-arrow)"/>

  <!-- Row 2: gateway / BFF -->
  <rect x="140" y="190" width="500" height="70" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="2"/>
  <text x="390" y="220" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Gateway / BFF</text>
  <text x="390" y="238" font-size="10.5" fill="#444444" text-anchor="middle">routing, TLS, rate limiting, token mediation for the browser client</text>

  <line x1="390" y1="260" x2="390" y2="315" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#lt-arrow)"/>

  <!-- Row 3: API -->
  <rect x="140" y="320" width="500" height="70" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="390" y="350" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshop-api</text>
  <text x="390" y="368" font-size="10.5" fill="#444444" text-anchor="middle">REST API only -- no views, no templates rendered here</text>

  <line x1="390" y1="390" x2="390" y2="445" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#lt-arrow)"/>

  <!-- Row 4: services + database -->
  <rect x="60" y="450" width="300" height="70" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="210" y="480" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Internal services</text>
  <text x="210" y="498" font-size="10.5" fill="#444444" text-anchor="middle">Catalogue, Orders, Payments, Shipping</text>

  <rect x="420" y="450" width="300" height="70" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="570" y="480" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Database</text>
  <text x="570" y="498" font-size="10.5" fill="#444444" text-anchor="middle">PostgreSQL</text>

  <line x1="290" y1="410" x2="230" y2="448" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#lt-arrow)"/>
  <line x1="490" y1="410" x2="550" y2="448" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#lt-arrow)"/>

  <text x="390" y="545" font-size="10.5" fill="#444444" text-anchor="middle">The browser and native apps never call services or the database directly -- every request crosses the</text>
  <text x="390" y="560" font-size="10.5" fill="#444444" text-anchor="middle">same gateway/BFF and API layers, regardless of which client made it.</text>
</svg>
