<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ip-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Post-processing chain for the Bookshelf frame</text>
<rect x="20" y="70" width="124" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="82.0" y="108.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Scene colour</text>
<text x="82.0" y="123.5" text-anchor="middle" font-size="11" fill="#3730A3">rgba16Float</text>
<text x="82.0" y="138.5" text-anchor="middle" font-size="11" fill="#3730A3">render pass</text>
<circle cx="30" cy="70" r="11" fill="#4F46E5"/><text x="30" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="144" y1="120" x2="169" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ip-chain)"/>
<rect x="169" y="70" width="124" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="231.0" y="108.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Threshold</text>
<text x="231.0" y="123.5" text-anchor="middle" font-size="11" fill="#92400E">keep bright pixels</text>
<text x="231.0" y="138.5" text-anchor="middle" font-size="11" fill="#92400E">compute kernel</text>
<circle cx="179" cy="70" r="11" fill="#4F46E5"/><text x="179" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="293" y1="120" x2="318" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ip-chain)"/>
<rect x="318" y="70" width="124" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="108.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Gaussian blur</text>
<text x="380.0" y="123.5" text-anchor="middle" font-size="11" fill="#065F46">sigma controls size</text>
<text x="380.0" y="138.5" text-anchor="middle" font-size="11" fill="#065F46">MPS kernel</text>
<circle cx="328" cy="70" r="11" fill="#4F46E5"/><text x="328" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="442" y1="120" x2="467" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ip-chain)"/>
<rect x="467" y="70" width="124" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="529.0" y="108.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Composite</text>
<text x="529.0" y="123.5" text-anchor="middle" font-size="11" fill="#92400E">scene + bloom</text>
<text x="529.0" y="138.5" text-anchor="middle" font-size="11" fill="#92400E">compute kernel</text>
<circle cx="477" cy="70" r="11" fill="#4F46E5"/><text x="477" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="591" y1="120" x2="616" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ip-chain)"/>
<rect x="616" y="70" width="124" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="678.0" y="108.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Tonemap</text>
<text x="678.0" y="123.5" text-anchor="middle" font-size="11" fill="#3730A3">drawable texture</text>
<text x="678.0" y="138.5" text-anchor="middle" font-size="11" fill="#3730A3">fragment pass</text>
<circle cx="626" cy="70" r="11" fill="#4F46E5"/><text x="626" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="380" y="205" text-anchor="middle" font-size="12" fill="#374151">Each arrow is a texture that stays on the GPU; nothing is copied to the CPU.</text>
<rect x="20" y="230" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="261.0" text-anchor="middle" font-size="11" fill="#374151">Intermediate textures are private, often rgba16Float, and can be reused between steps to save memory.</text>
<text x="380.0" y="276.0" text-anchor="middle" font-size="11" fill="#374151">On a tile-based GPU each arrow is a full-screen write to memory: keep the chain short, blur at low resolution.</text>
</svg>
