<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w &quot;\nHTTP %{http_code}\n&quot; --json @http/second-chief.json http://localhost:4004/odata/v4/org/Relationships</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">{&quot;error&quot;:{&quot;message&quot;:&quot;Unit 50000002 already has the chief position 51000001&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeverity&quot;:4}}</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">HTTP 400</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w &quot;\nHTTP %{http_code}\n&quot; --json @http/loop.json http://localhost:4004/odata/v4/org/Relationships</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">{&quot;error&quot;:{&quot;message&quot;:&quot;Unit 50000001 cannot report to 50000003, which is not above it&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeve</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">rity&quot;:4}}</text>
