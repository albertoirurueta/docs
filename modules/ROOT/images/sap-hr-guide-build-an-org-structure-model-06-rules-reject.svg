<title id="sap-hr-guide-build-an-org-structure-model-06-rules-reject-title">Terminal with two curl commands that post a relationship the model refuses: a second chief position for Sales is answered with the message Unit 50000002 already has the chief position 51000001 and HTTP 400 (callout 11), and a unit that would report to a unit below it is answered with the message Unit 50000001 cannot report to 50000003, which is not above it and HTTP 400 (callout 12)</title>
