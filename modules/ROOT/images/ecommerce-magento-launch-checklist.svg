<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 470" width="1018" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Launch checklist for a Magento store grouped by area</title>
  <desc id="d">Five columns of checks before go-live: configuration, sales and tax, content and SEO, security and platform, and operations. Each item names where to check it: the Admin, a command or the web server.</desc>
  <rect x="15" y="24" width="188" height="330" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="109.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Configuration</text>
  <line x1="33" y1="66" x2="185" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="109.0" y="96" text-anchor="middle" font-size="12.5">base URLs on live domain</text>
  <text x="109.0" y="136" text-anchor="middle" font-size="12.5">HTTPS certificate valid</text>
  <text x="109.0" y="176" text-anchor="middle" font-size="12.5">store and sales emails set</text>
  <text x="109.0" y="216" text-anchor="middle" font-size="12.5">locale, timezone, currency</text>
  <text x="109.0" y="256" text-anchor="middle" font-size="12.5">email templates branded</text>
  <text x="109.0" y="296" text-anchor="middle" font-size="12.5">default customer group</text>
  <rect x="215" y="24" width="188" height="330" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="309.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Sales and tax</text>
  <line x1="233" y1="66" x2="385" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="309.0" y="96" text-anchor="middle" font-size="12.5">tax classes, rates, rules</text>
  <text x="309.0" y="136" text-anchor="middle" font-size="12.5">price display with VAT</text>
  <text x="309.0" y="176" text-anchor="middle" font-size="12.5">carriers, origin address</text>
  <text x="309.0" y="216" text-anchor="middle" font-size="12.5">payments in live mode</text>
  <text x="309.0" y="256" text-anchor="middle" font-size="12.5">guest checkout, terms</text>
  <text x="309.0" y="296" text-anchor="middle" font-size="12.5">test orders in every zone</text>
  <rect x="415" y="24" width="188" height="330" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="509.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Content and SEO</text>
  <line x1="433" y1="66" x2="585" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="509.0" y="96" text-anchor="middle" font-size="12.5">home page, About, policies</text>
  <text x="509.0" y="136" text-anchor="middle" font-size="12.5">meta title and description</text>
  <text x="509.0" y="176" text-anchor="middle" font-size="12.5">URL suffix and rewrites</text>
  <text x="509.0" y="216" text-anchor="middle" font-size="12.5">canonical tags on</text>
  <text x="509.0" y="256" text-anchor="middle" font-size="12.5">sitemap and robots.txt</text>
  <text x="509.0" y="296" text-anchor="middle" font-size="12.5">analytics and tag manager</text>
  <rect x="615" y="24" width="188" height="330" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="709.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Security</text>
  <line x1="633" y1="66" x2="785" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="709.0" y="96" text-anchor="middle" font-size="12.5">production mode</text>
  <text x="709.0" y="136" text-anchor="middle" font-size="12.5">2FA for every admin</text>
  <text x="709.0" y="176" text-anchor="middle" font-size="12.5">random Admin URI</text>
  <text x="709.0" y="216" text-anchor="middle" font-size="12.5">security patches applied</text>
  <text x="709.0" y="256" text-anchor="middle" font-size="12.5">no write access to app/etc</text>
  <text x="709.0" y="296" text-anchor="middle" font-size="12.5">keys and passwords rotated</text>
  <rect x="815" y="24" width="188" height="330" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="909.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Operations</text>
  <line x1="833" y1="66" x2="985" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="909.0" y="96" text-anchor="middle" font-size="12.5">cron running every minute</text>
  <text x="909.0" y="136" text-anchor="middle" font-size="12.5">indexers on schedule</text>
  <text x="909.0" y="176" text-anchor="middle" font-size="12.5">services monitored</text>
  <text x="909.0" y="216" text-anchor="middle" font-size="12.5">backups restore-tested</text>
  <text x="909.0" y="256" text-anchor="middle" font-size="12.5">log rotation, disk space</text>
  <text x="909.0" y="296" text-anchor="middle" font-size="12.5">rollback plan written</text>
  <rect x="15" y="380" width="988" height="72" rx="10" fill="#7f8c8d" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="509" y="408" text-anchor="middle" font-size="13.5" font-weight="bold">Verify with commands, not only the Admin screens</text>
  <text x="509" y="432" text-anchor="middle" font-size="12.5">deploy:mode:show, cron:run then the cron_schedule table, indexer:status, config:show, security:tfa:providers, curl -I</text>
</svg>
