<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Shopify checkout UI extension targets on the checkout page</title>
<desc id="d">Schematic of the three-page checkout. Core checkout sections are grey boxes. Static targets are green slots that render at a fixed position next to a core section: header render-after, contact render-after, delivery-address render-before and render-after, shipping-option-list render-before and render-after, shipping-option-item render-after and details, payment-method-list render-before and render-after, actions render-before, footer render-after, and in the order summary cart-line-item render-after, cart-line-list render-after, reductions render-before and render-after. The block target purchase.checkout.block.render is a blue dashed slot the merchant places at one of the placement references WALLETS1, INFORMATION1 to 3, DELIVERY1 and 2, PAYMENT1 to 4 and ORDER_SUMMARY1 to 4.</desc>
<rect x="0" y="0" width="900" height="830" rx="14" fill="#2b3a4a"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#f2f5f8">Where checkout UI extension targets render</text>
<text x="20" y="46" font-size="12" fill="#f2f5f8">Grey: core checkout. Green: static targets (fixed position). Blue dashed: block target purchase.checkout.block.render placements.</text>
<rect x="20" y="60" width="560" height="28" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="76" font-size="12" font-weight="bold" fill="#f2f5f8">Header (store logo)</text>
<rect x="20" y="92" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="107" font-size="11" fill="#f2f5f8">purchase.checkout.header.render-after</text>
<rect x="20" y="120" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="134" font-size="11" fill="#f2f5f8">WALLETS1: above the express checkout buttons</text>
<rect x="20" y="144" width="560" height="28" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="160" font-size="12" font-weight="bold" fill="#f2f5f8">Express checkout (Shop Pay, Apple Pay, Google Pay)</text>
<rect x="20" y="176" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="190" font-size="11" fill="#f2f5f8">INFORMATION1: first element on the Information step</text>
<rect x="20" y="200" width="560" height="40" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="216" font-size="12" font-weight="bold" fill="#f2f5f8">Contact</text>
<text x="30" y="231" font-size="11" fill="#f2f5f8" fill-opacity="0.85">email, marketing opt-in</text>
<rect x="20" y="244" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="259" font-size="11" fill="#f2f5f8">purchase.checkout.contact.render-after</text>
<rect x="20" y="270" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="284" font-size="11" fill="#f2f5f8">INFORMATION2: below contact, above the address</text>
<rect x="20" y="294" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="309" font-size="11" fill="#f2f5f8">purchase.checkout.delivery-address.render-before</text>
<rect x="20" y="320" width="560" height="40" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="336" font-size="12" font-weight="bold" fill="#f2f5f8">Delivery address</text>
<text x="30" y="351" font-size="11" fill="#f2f5f8" fill-opacity="0.85">ship / pickup selector and address form</text>
<rect x="20" y="364" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="379" font-size="11" fill="#f2f5f8">purchase.checkout.delivery-address.render-after</text>
<rect x="20" y="390" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="404" font-size="11" fill="#f2f5f8">INFORMATION3: below the delivery method selector</text>
<rect x="20" y="416" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="430" font-size="11" fill="#f2f5f8">DELIVERY1: first element on the Shipping step</text>
<rect x="20" y="440" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="455" font-size="11" fill="#f2f5f8">purchase.checkout.shipping-option-list.render-before</text>
<rect x="20" y="466" width="560" height="56" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="482" font-size="12" font-weight="bold" fill="#f2f5f8">Shipping methods</text>
<text x="30" y="497" font-size="11" fill="#f2f5f8" fill-opacity="0.85">each option has two static slots:</text>
<rect x="270" y="496" width="300" height="20" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="278" y="511" font-size="11" fill="#f2f5f8">shipping-option-item.render-after</text>
<rect x="270" y="472" width="300" height="20" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="278" y="487" font-size="11" fill="#f2f5f8">shipping-option-item.details.render</text>
<rect x="20" y="526" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="541" font-size="11" fill="#f2f5f8">purchase.checkout.shipping-option-list.render-after</text>
<rect x="20" y="552" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="566" font-size="11" fill="#f2f5f8">DELIVERY2: below the shipping methods</text>
<rect x="20" y="578" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="592" font-size="11" fill="#f2f5f8">PAYMENT1: first element on the Payment step</text>
<rect x="20" y="602" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="617" font-size="11" fill="#f2f5f8">purchase.checkout.payment-method-list.render-before</text>
<rect x="20" y="628" width="560" height="40" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="644" font-size="12" font-weight="bold" fill="#f2f5f8">Payment methods</text>
<text x="30" y="659" font-size="11" fill="#f2f5f8" fill-opacity="0.85">cards, wallets, gift cards, billing address</text>
<rect x="20" y="672" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="687" font-size="11" fill="#f2f5f8">purchase.checkout.payment-method-list.render-after</text>
<rect x="20" y="698" width="560" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="28" y="712" font-size="11" fill="#f2f5f8">PAYMENT2 to PAYMENT4: tips, payment methods, billing address, Remember me</text>
<rect x="20" y="724" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="739" font-size="11" fill="#f2f5f8">purchase.checkout.actions.render-before</text>
<rect x="20" y="750" width="560" height="30" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="30" y="766" font-size="12" font-weight="bold" fill="#f2f5f8">Continue / Pay now buttons</text>
<rect x="20" y="784" width="560" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="28" y="799" font-size="11" fill="#f2f5f8">purchase.checkout.footer.render-after</text>
<rect x="600" y="60" width="280" height="746" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="610" y="76" font-size="12" font-weight="bold" fill="#f2f5f8">Order summary</text>
<rect x="610" y="100" width="260" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="618" y="114" font-size="11" fill="#f2f5f8">ORDER_SUMMARY1: above the line items</text>
<rect x="610" y="128" width="260" height="56" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="620" y="144" font-size="12" font-weight="bold" fill="#f2f5f8">Line item</text>
<text x="620" y="159" font-size="11" fill="#f2f5f8" fill-opacity="0.85">name, options, price</text>
<rect x="610" y="188" width="260" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="618" y="203" font-size="11" fill="#f2f5f8">cart-line-item.render-after (per line)</text>
<rect x="610" y="216" width="260" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="618" y="231" font-size="11" fill="#f2f5f8">cart-line-list.render-after</text>
<rect x="610" y="244" width="260" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="618" y="258" font-size="11" fill="#f2f5f8">ORDER_SUMMARY2: below the line items</text>
<rect x="610" y="278" width="260" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="618" y="293" font-size="11" fill="#f2f5f8">reductions.render-before</text>
<rect x="610" y="306" width="260" height="40" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="620" y="322" font-size="12" font-weight="bold" fill="#f2f5f8">Discount code form</text>
<rect x="610" y="350" width="260" height="22" rx="4" fill="#4f7f5b" stroke="#f2f5f8"/>
<text x="618" y="365" font-size="11" fill="#f2f5f8">reductions.render-after</text>
<rect x="610" y="384" width="260" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="618" y="398" font-size="11" fill="#f2f5f8">ORDER_SUMMARY3: above the money lines</text>
<rect x="610" y="412" width="260" height="70" rx="6" fill="#4a5a6b" stroke="#f2f5f8" stroke-opacity="0.6"/>
<text x="620" y="428" font-size="12" font-weight="bold" fill="#f2f5f8">Money lines</text>
<text x="620" y="443" font-size="11" fill="#f2f5f8" fill-opacity="0.85">subtotal, shipping, taxes, total</text>
<rect x="610" y="488" width="260" height="20" rx="4" fill="#3f6e9a" fill-opacity="0.55" stroke="#9cc4ea" stroke-dasharray="5 3"/>
<text x="618" y="502" font-size="11" fill="#f2f5f8">ORDER_SUMMARY4: below the money lines</text>
<text x="610" y="532" font-size="11" fill="#f2f5f8">Shortened target names start with</text>
<text x="610" y="548" font-size="11" fill="#f2f5f8">purchase.checkout. A core feature that is not</text>
<text x="610" y="564" font-size="11" fill="#f2f5f8">shown (for example shipping methods on pickup)</text>
<text x="610" y="580" font-size="11" fill="#f2f5f8">hides its static targets; block targets still render.</text>
</svg>
