<svg viewBox="0 0 960 640" width="960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Page X of Y: the total is written into a placeholder before the document closes</text>
  <rect x="25" y="42" width="170" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="110" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Your code</text>
  <line x1="110" y1="74" x2="110" y2="620" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="235" y="42" width="170" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Document + renderer</text>
  <line x1="320" y1="74" x2="320" y2="620" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="455" y="42" width="170" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="540" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">PdfDocument</text>
  <line x1="540" y1="74" x2="540" y2="620" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="705" y="42" width="170" height="32" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="790" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Handler + placeholder</text>
  <line x1="790" y1="74" x2="790" y2="620" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="110" y1="100" x2="540" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="325.0" y="94" text-anchor="middle" font-size="11" fill="#1a1a1a">1. addEventHandler(END_PAGE, handler)</text>
  <line x1="110" y1="128" x2="790" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="450.0" y="122" text-anchor="middle" font-size="11" fill="#1a1a1a">2. new PdfFormXObject(placeholder), empty</text>
  <line x1="110" y1="156" x2="320" y2="156" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="215.0" y="150" text-anchor="middle" font-size="11" fill="#1a1a1a">3. document.add(...) for all the content</text>
  <rect x="30" y="172" width="900" height="188" rx="8" fill="none" stroke="#1f5fa6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="40" y="190" font-size="12" font-weight="700" fill="#1f5fa6">for every page that fills up</text>
  <line x1="320" y1="216" x2="540" y2="216" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="430.0" y="210" text-anchor="middle" font-size="11" fill="#1a1a1a">4. page is full, next page added</text>
  <line x1="540" y1="244" x2="790" y2="244" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="665.0" y="238" text-anchor="middle" font-size="11" fill="#1a1a1a">5. END_PAGE event (page n)</text>
  <rect x="560" y="254" width="370" height="34" rx="5" fill="#fff3d6" stroke="#b36b00"/>
  <text x="745.0" y="270" text-anchor="middle" font-size="11" fill="#333">draws header and the text "Page n of"</text>
  <text x="745.0" y="285" text-anchor="middle" font-size="11" fill="#333">adds the placeholder with addXObjectAt</text>
  <line x1="790" y1="310" x2="540" y2="310" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#pe-arrow)"/>
  <text x="665.0" y="304" text-anchor="middle" font-size="11" fill="#1a1a1a">6. content written to the page stream</text>
  <rect x="110" y="322" width="350" height="34" rx="5" fill="#e3f4e3" stroke="#2f7a2f"/>
  <text x="285.0" y="338" text-anchor="middle" font-size="11" fill="#333">the same placeholder object is reused</text>
  <text x="285.0" y="353" text-anchor="middle" font-size="11" fill="#333">by every page: it is still empty</text>
  <line x1="110" y1="392" x2="790" y2="392" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="450.0" y="386" text-anchor="middle" font-size="11" fill="#1a1a1a">7. writeTotal(pdf): total = pdf.getNumberOfPages()</text>
  <rect x="560" y="402" width="370" height="34" rx="5" fill="#e3f4e3" stroke="#2f7a2f"/>
  <text x="745.0" y="418" text-anchor="middle" font-size="11" fill="#333">the placeholder content is drawn once:</text>
  <text x="745.0" y="433" text-anchor="middle" font-size="11" fill="#333">the digits of Y appear on every page</text>
  <line x1="110" y1="470" x2="320" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="215.0" y="464" text-anchor="middle" font-size="11" fill="#1a1a1a">8. document.close()</text>
  <line x1="320" y1="498" x2="540" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#pe-arrow)"/>
  <text x="430.0" y="492" text-anchor="middle" font-size="11" fill="#1a1a1a">9. pdf.close(): the last page ends, END_PAGE (page N)</text>
  <line x1="540" y1="526" x2="790" y2="526" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#pe-arrow)"/>
  <text x="665.0" y="520" text-anchor="middle" font-size="11" fill="#1a1a1a">10. same handler runs: "Page N of" and the placeholder</text>
  <text x="480" y="610" text-anchor="middle" font-size="11" fill="#555">Step 7 must happen after the last content is added and before close(): afterwards the placeholder is flushed.</text>
</svg>
