<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="330" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Actions run top to bottom, so order changes the result</text>
<rect x="20" y="48" width="340" height="262" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="190" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Set first, then check</text>
<rect x="44" y="92" width="292" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="44" cy="92" r="11" fill="#4F46E5"/><text x="44" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="60" y="113" font-size="12" fill="#374151">Set variable: cartCount = 1</text>
<text x="60" y="130" font-size="11" fill="#4B5563">(on a tap of Add to shelf)</text>
<line x1="190" y1="140" x2="190" y2="162" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="44" y="164" width="292" height="60" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="44" cy="164" r="11" fill="#4F46E5"/><text x="44" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="60" y="185" font-size="12" fill="#374151">Conditional: if cartCount == 1</text>
<text x="60" y="203" font-size="12" fill="#374151">then Set isEmpty = false</text>
<text x="190" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">Condition is true: the badge appears</text>
<text x="190" y="278" text-anchor="middle" font-size="12" fill="#374151">The check sees the new value.</text>
<rect x="380" y="48" width="340" height="262" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="550" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#B91C1C">Check first, then set</text>
<rect x="404" y="92" width="292" height="60" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="92" r="11" fill="#4F46E5"/><text x="404" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="420" y="113" font-size="12" fill="#374151">Conditional: if cartCount == 1</text>
<text x="420" y="131" font-size="12" fill="#374151">then Set isEmpty = false</text>
<line x1="550" y1="152" x2="550" y2="174" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="404" y="176" width="292" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="176" r="11" fill="#4F46E5"/><text x="404" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="420" y="205" font-size="12" fill="#374151">Set variable: cartCount = 1</text>
<text x="550" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#B91C1C">Condition is still false: nothing happens</text>
<text x="550" y="278" text-anchor="middle" font-size="12" fill="#374151">The check ran on the old value (0).</text>
</svg>
