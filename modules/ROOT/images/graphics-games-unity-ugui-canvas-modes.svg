<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-ugui-canvas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The three Canvas render modes</text>
<rect x="15" y="50" width="235" height="250" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="132" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Screen Space - Overlay</text>
<rect x="35" y="90" width="195" height="120" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="60" y="130" width="50" height="70" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="115" y="140" width="40" height="60" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="45" y="98" width="70" height="18" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="80" y="111" text-anchor="middle" font-size="9" fill="#1F2937">Score 120</text>
<rect x="170" y="98" width="50" height="18" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="195" y="111" text-anchor="middle" font-size="9" fill="#1F2937">Pause</text>
<text x="132" y="232" text-anchor="middle" font-size="10" fill="#374151">drawn on top of the scene</text>
<text x="132" y="248" text-anchor="middle" font-size="10" fill="#374151">sized to the screen automatically</text>
<text x="132" y="264" text-anchor="middle" font-size="10" fill="#374151">no camera involved</text>
<text x="132" y="284" text-anchor="middle" font-size="10" fill="#374151">use for HUD and menus</text>
<rect x="262" y="50" width="235" height="250" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="380" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Screen Space - Camera</text>
<rect x="285" y="150" width="40" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="305" y="196" text-anchor="middle" font-size="9" fill="#3730A3">camera</text>
<line x1="325" y1="165" x2="420" y2="115" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="325" y1="165" x2="420" y2="215" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="395" y="115" width="14" height="100" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="402" y="232" text-anchor="middle" font-size="9" fill="#1F2937">canvas at</text>
<text x="402" y="244" text-anchor="middle" font-size="9" fill="#1F2937">Plane Distance</text>
<rect x="430" y="145" width="40" height="40" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="266" text-anchor="middle" font-size="10" fill="#374151">rendered by a chosen camera</text>
<text x="380" y="282" text-anchor="middle" font-size="10" fill="#374151">perspective, post-processing apply</text>
<rect x="510" y="50" width="235" height="250" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="627" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">World Space</text>
<polygon points="535,235 720,235 735,255 520,255" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<rect x="545" y="170" width="45" height="65" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="595" y="180" width="38" height="55" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<polygon points="545,110 625,104 625,150 545,156" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="585" y="134" text-anchor="middle" font-size="9" fill="#1F2937">Dune, 12 left</text>
<polygon points="650,120 725,112 725,205 650,215" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="687" y="166" text-anchor="middle" font-size="9" fill="#1F2937">wall panel</text>
<text x="627" y="276" text-anchor="middle" font-size="10" fill="#374151">a rectangle in the scene,</text>
<text x="627" y="291" text-anchor="middle" font-size="10" fill="#374151">sized by its RectTransform</text>
<rect x="15" y="315" width="730" height="35" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="337" text-anchor="middle" font-size="11" fill="#3730A3">Elements draw in Hierarchy order: the later sibling is on top. Screen Space - Camera and World Space also need a camera or event camera.</text>
</svg>
