<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <title id="t">How the Admin GraphQL API charges query cost against a leaky bucket</title>
  <desc id="d">A request reserves its requested cost from the bucket before it runs. After it runs, the difference between the requested and the actual cost is refunded. The bucket refills continuously at the restore rate of the store plan. A request whose requested cost does not fit is answered with a THROTTLED error, and a single query above 1000 points is rejected.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- request box -->
  <rect x="20" y="40" width="190" height="96" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="115" y="68" text-anchor="middle" font-weight="bold">1. Request arrives</text>
  <text x="115" y="90" text-anchor="middle">Shopify prices the query</text>
  <text x="115" y="110" text-anchor="middle">from the fields it selects</text>
  <text x="115" y="128" text-anchor="middle" font-size="12" opacity="0.8">requestedQueryCost</text>

  <!-- bucket -->
  <path d="M330,40 L330,330 Q330,350 350,350 L510,350 Q530,350 530,330 L530,40" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="332" y="150" width="196" height="198" rx="0" fill="#2ecc71" fill-opacity="0.28"/>
  <line x1="330" y1="150" x2="530" y2="150" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="430" y="30" text-anchor="middle" font-weight="bold">Bucket (one per app and store)</text>
  <text x="430" y="140" text-anchor="middle" font-size="12">currentlyAvailable</text>
  <text x="430" y="250" text-anchor="middle" font-weight="bold">points left</text>
  <text x="430" y="272" text-anchor="middle" font-size="12" opacity="0.8">maximumAvailable is the rim</text>
  <text x="430" y="380" text-anchor="middle" font-size="12" opacity="0.8">no bucket sizes are published</text>

  <!-- reserve arrow -->
  <line x1="210" y1="88" x2="326" y2="120" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="150" font-size="12">reserve the</text>
  <text x="240" y="165" font-size="12">requested cost</text>

  <!-- refund arrow -->
  <line x1="326" y1="215" x2="214" y2="215" stroke="currentColor" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <rect x="20" y="190" width="190" height="96" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="115" y="218" text-anchor="middle" font-weight="bold">2. Query runs</text>
  <text x="115" y="240" text-anchor="middle">actual cost is measured</text>
  <text x="115" y="260" text-anchor="middle">refund = requested - actual</text>
  <text x="115" y="278" text-anchor="middle" font-size="12" opacity="0.8">actualQueryCost</text>

  <!-- leak -->
  <rect x="545" y="150" width="205" height="120" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="647" y="178" text-anchor="middle" font-weight="bold">Restore rate</text>
  <text x="647" y="200" text-anchor="middle">100 points/s Standard</text>
  <text x="647" y="218" text-anchor="middle">200 Advanced</text>
  <text x="647" y="236" text-anchor="middle">1000 Plus</text>
  <text x="647" y="254" text-anchor="middle">2000 enterprise</text>
  <line x1="545" y1="210" x2="534" y2="210" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>

  <!-- rejection -->
  <rect x="545" y="300" width="205" height="96" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="647" y="326" text-anchor="middle" font-weight="bold">Rejected</text>
  <text x="647" y="346" text-anchor="middle" font-size="12">THROTTLED: cost does not fit</text>
  <text x="647" y="364" text-anchor="middle" font-size="12">MAX_COST_EXCEEDED: over 1000</text>
  <text x="647" y="382" text-anchor="middle" font-size="12" opacity="0.8">HTTP status stays 200</text>
</svg>
