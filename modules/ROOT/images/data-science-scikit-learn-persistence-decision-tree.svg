<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="t d">
  <title id="t">Choosing a model persistence format</title>
  <desc id="d">A decision tree. If only predictions are needed, use ONNX. Otherwise, if the file source is not fully trusted, use skops.io. If it is trusted and fast loading or memory mapping matters, use joblib, else pickle with protocol 5. If pickle or joblib cannot save the model, use cloudpickle.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="498" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
    <text x="24" y="34" font-size="20" font-weight="bold">Which persistence format?</text>

    <!-- questions -->
    <g stroke="#1D4ED8" stroke-width="2" fill="#DBEAFE">
      <rect x="30" y="60" width="320" height="60" rx="6"/>
      <rect x="30" y="170" width="320" height="60" rx="6"/>
      <rect x="30" y="280" width="320" height="60" rx="6"/>
    </g>
    <g font-size="15" text-anchor="middle" stroke="none">
      <text x="190" y="86">Do you only need predictions,</text>
      <text x="190" y="106">not the Python object back?</text>
      <text x="190" y="196">Do you fully trust where the</text>
      <text x="190" y="216">file comes from?</text>
      <text x="190" y="306">Do you need fast loading or</text>
      <text x="190" y="326">memory mapping across processes?</text>
    </g>

    <!-- answers -->
    <g stroke="#0F766E" stroke-width="2" fill="#CCFBF1">
      <rect x="450" y="60" width="240" height="60" rx="6"/>
      <rect x="450" y="170" width="240" height="60" rx="6"/>
      <rect x="450" y="280" width="240" height="60" rx="6"/>
      <rect x="30" y="390" width="320" height="60" rx="6"/>
    </g>
    <g font-size="12" text-anchor="middle" stroke="none" fill="#475569">
      <text x="570" y="110">serving without a Python runtime</text>
      <text x="570" y="220">loads only trusted types</text>
      <text x="570" y="330">mmap_mode="r", compress=</text>
      <text x="190" y="440">built in, protocol=5 for large arrays</text>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" text-anchor="middle" stroke="none">
      <text x="570" y="92">ONNX</text>
      <text x="570" y="202">skops.io</text>
      <text x="570" y="312">joblib</text>
      <text x="190" y="422">pickle</text>
    </g>

    <!-- cloudpickle -->
    <rect x="450" y="390" width="240" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="570" y="420" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" text-anchor="middle">cloudpickle</text>
    <text x="570" y="440" font-size="12" text-anchor="middle" fill="#475569">lambdas, interactive code</text>

    <!-- arrows -->
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
      <line x1="350" y1="90" x2="446" y2="90"/>
      <line x1="190" y1="120" x2="190" y2="166"/>
      <line x1="350" y1="200" x2="446" y2="200"/>
      <line x1="190" y1="230" x2="190" y2="276"/>
      <line x1="350" y1="310" x2="446" y2="310"/>
      <line x1="190" y1="340" x2="190" y2="386"/>
      <line x1="350" y1="420" x2="446" y2="420" stroke-dasharray="6 4"/>
    </g>
    <g font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">
      <text x="398" y="82">yes</text>
      <text x="206" y="150" text-anchor="start">no</text>
      <text x="398" y="192">no</text>
      <text x="206" y="260" text-anchor="start">yes</text>
      <text x="398" y="302">yes</text>
      <text x="206" y="370" text-anchor="start">no</text>
      <text x="398" y="412">fails to save</text>
    </g>
    <text x="24" y="482" font-size="12" fill="#475569">Every format except ONNX needs the same package versions at load time as at training time.</text>
  </g>
</svg>
