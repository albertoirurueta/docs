<svg viewBox="0 0 760 468" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="468" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The BKD tree: 2-D points recursively split into sorted leaf blocks</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">Each internal node stores a split dimension and split value; a range query descends only the overlapping branches</text>

  <!-- ================= left: the point plane ================= -->
  <text x="60" y="72" font-size="12" font-weight="bold" fill="#222222">Indexed points (2 dimensions: x, y)</text>

  <!-- leaf block shading -->
  <rect x="60" y="82" width="160" height="150" fill="#f4f4f4" stroke="none"/>
  <rect x="60" y="232" width="160" height="170" fill="#ffffff" stroke="none"/>
  <rect x="220" y="82" width="160" height="110" fill="#ffffff" stroke="none"/>
  <rect x="220" y="192" width="160" height="210" fill="#f4f4f4" stroke="none"/>

  <!-- plot border -->
  <rect x="60" y="82" width="320" height="320" fill="none" stroke="#999999" stroke-width="1.2"/>

  <!-- split lines -->
  <line x1="220" y1="82" x2="220" y2="402" stroke="#1c4b73" stroke-width="1.6"/>
  <line x1="60" y1="232" x2="220" y2="232" stroke="#1c4b73" stroke-width="1.4"/>
  <line x1="220" y1="192" x2="380" y2="192" stroke="#1c4b73" stroke-width="1.4"/>

  <text x="226" y="96" font-size="9.5" fill="#1c4b73">split dim=x @ 128</text>
  <text x="64" y="246" font-size="9.5" fill="#1c4b73">split dim=y @ 110</text>
  <text x="300" y="206" font-size="9.5" fill="#1c4b73" text-anchor="middle">split dim=y @ 150</text>

  <!-- leaf labels -->
  <text x="70" y="98" font-size="11" font-weight="bold" fill="#666666">L1</text>
  <text x="70" y="392" font-size="11" font-weight="bold" fill="#666666">L2</text>
  <text x="366" y="98" font-size="11" font-weight="bold" fill="#666666" text-anchor="end">L3</text>
  <text x="366" y="392" font-size="11" font-weight="bold" fill="#666666" text-anchor="end">L4</text>

  <!-- points: L1 -->
  <g fill="#2f5424">
    <circle cx="92" cy="120" r="3.2"/><circle cx="140" cy="150" r="3.2"/><circle cx="182" cy="118" r="3.2"/>
    <circle cx="112" cy="200" r="3.2"/><circle cx="160" cy="210" r="3.2"/><circle cx="96" cy="165" r="3.2"/>
  </g>
  <!-- points: L2 -->
  <g fill="#2f5424">
    <circle cx="98" cy="272" r="3.2"/><circle cx="150" cy="300" r="3.2"/><circle cx="122" cy="360" r="3.2"/>
    <circle cx="190" cy="330" r="3.2"/><circle cx="104" cy="382" r="3.2"/><circle cx="176" cy="264" r="3.2"/>
  </g>
  <!-- points: L3 -->
  <g fill="#2f5424">
    <circle cx="250" cy="116" r="3.2"/><circle cx="300" cy="132" r="3.2"/><circle cx="350" cy="104" r="3.2"/>
    <circle cx="270" cy="172" r="3.2"/><circle cx="332" cy="160" r="3.2"/>
  </g>
  <!-- points: L4 -->
  <g fill="#2f5424">
    <circle cx="246" cy="242" r="3.2"/><circle cx="312" cy="262" r="3.2"/><circle cx="360" cy="300" r="3.2"/>
    <circle cx="282" cy="352" r="3.2"/><circle cx="340" cy="382" r="3.2"/><circle cx="248" cy="320" r="3.2"/>
  </g>

  <text x="60" y="420" font-size="10.5" fill="#999999">Each leaf block holds up to ~512 values, stored sorted and byte-packed on disk.</text>

  <!-- ================= right: the tree ================= -->
  <text x="430" y="72" font-size="12" font-weight="bold" fill="#222222">The same split structure as a tree</text>

  <!-- edges -->
  <g stroke="#999999" stroke-width="1.3" fill="none">
    <path d="M585,110 L510,150"/>
    <path d="M585,110 L660,150"/>
    <path d="M510,178 L474,224"/>
    <path d="M510,178 L552,224"/>
    <path d="M660,178 L622,224"/>
    <path d="M660,178 L700,224"/>
  </g>

  <!-- root -->
  <rect x="525" y="82" width="120" height="30" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="585" y="101" font-size="11" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">x &lt; 128 ?</text>

  <!-- level 2 -->
  <rect x="452" y="150" width="116" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="510" y="168" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">y &lt; 110 ?</text>
  <rect x="602" y="150" width="116" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="660" y="168" font-size="10.5" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">y &lt; 150 ?</text>

  <!-- leaves -->
  <g>
    <rect x="444" y="224" width="60" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="474" y="242" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">L1</text>
    <text x="474" y="256" font-size="9" fill="#666666" text-anchor="middle">leaf block</text>

    <rect x="522" y="224" width="60" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="552" y="242" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">L2</text>
    <text x="552" y="256" font-size="9" fill="#666666" text-anchor="middle">leaf block</text>

    <rect x="592" y="224" width="60" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="622" y="242" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">L3</text>
    <text x="622" y="256" font-size="9" fill="#666666" text-anchor="middle">leaf block</text>

    <rect x="670" y="224" width="60" height="40" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="700" y="242" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">L4</text>
    <text x="700" y="256" font-size="9" fill="#666666" text-anchor="middle">leaf block</text>
  </g>

  <!-- query box illustration -->
  <rect x="430" y="300" width="300" height="96" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="444" y="320" font-size="11" font-weight="bold" fill="#222222">Range query  x in [10..20] AND y in [30..40]</text>
  <text x="444" y="340" font-size="10.5" fill="#666666">&#8226; root: query x-range overlaps only x &lt; 128 &#8594; take left child</text>
  <text x="444" y="357" font-size="10.5" fill="#666666">&#8226; left child: y-range overlaps y &lt; 110 &#8594; visit L1 only</text>
  <text x="444" y="374" font-size="10.5" fill="#2f5424">&#8226; scan L1 linearly; L2, L3, L4 pruned without being read</text>
  <text x="444" y="391" font-size="9.5" fill="#999999">IndexOrDocValuesQuery may instead iterate doc-values when the range matches most docs.</text>

  <text x="380" y="438" font-size="10.5" fill="#444444" text-anchor="middle">Points live in their own part of the segment &#8212; separate from the inverted index and from doc-values.</text>
  <text x="380" y="456" font-size="10.5" fill="#444444" text-anchor="middle">IntField / LongField / FloatField / DoubleField add a point AND a doc-value (with a skip list) for the same value.</text>
</svg>
