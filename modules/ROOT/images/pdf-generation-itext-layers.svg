<svg viewBox="0 0 900 500" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="il-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">The three layers behind a Document: renderers lay out, PdfDocument models, PdfWriter serialises</text>

  <!-- Layout layer -->
  <rect x="30" y="50" width="840" height="130" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="46" y="72" font-size="13" font-weight="700" fill="#1f5fa6">Layout layer (itext-layout)</text>
  <rect x="50" y="90" width="170" height="70" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="135" y="118" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">Document</text>
  <text x="135" y="138" text-anchor="middle" font-size="11" fill="#1f5fa6">root element, margins</text>
  <rect x="270" y="90" width="260" height="70" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="400" y="116" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">Paragraph, Table, Image ...</text>
  <text x="400" y="138" text-anchor="middle" font-size="11" fill="#1f5fa6">elements: data and properties</text>
  <rect x="580" y="90" width="270" height="70" rx="5" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="715" y="116" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">DocumentRenderer</text>
  <text x="715" y="138" text-anchor="middle" font-size="11" fill="#1f5fa6">renderer tree: layout and draw</text>
  <line x1="220" y1="125" x2="268" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>
  <line x1="530" y1="125" x2="578" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>

  <!-- Kernel layer -->
  <rect x="30" y="210" width="840" height="130" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="46" y="232" font-size="13" font-weight="700" fill="#2b7a2b">Document model (itext-kernel)</text>
  <rect x="50" y="250" width="170" height="70" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="135" y="278" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">PdfDocument</text>
  <text x="135" y="298" text-anchor="middle" font-size="11" fill="#2b7a2b">catalog, page tree, info</text>
  <rect x="270" y="250" width="260" height="70" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="400" y="276" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">PdfPage, PdfCanvas</text>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#2b7a2b">pages and content streams</text>
  <rect x="580" y="250" width="270" height="70" rx="5" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="715" y="276" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">PdfDocumentInfo, XMP</text>
  <text x="715" y="298" text-anchor="middle" font-size="11" fill="#2b7a2b">metadata</text>

  <!-- IO layer -->
  <rect x="30" y="370" width="840" height="100" rx="8" fill="#fff1dc" stroke="#b36b00" stroke-width="1.6"/>
  <text x="46" y="392" font-size="13" font-weight="700" fill="#7a4800">Serialisation (itext-kernel, itext-io)</text>
  <rect x="50" y="404" width="370" height="52" rx="5" fill="#ffffff" stroke="#b36b00"/>
  <text x="235" y="428" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">PdfWriter + WriterProperties</text>
  <text x="235" y="445" text-anchor="middle" font-size="11" fill="#7a4800">version, compression, encryption, XMP</text>
  <rect x="480" y="404" width="370" height="52" rx="5" fill="#ffffff" stroke="#b36b00"/>
  <text x="665" y="428" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">PdfReader + ReaderProperties</text>
  <text x="665" y="445" text-anchor="middle" font-size="11" fill="#7a4800">parse, repair, decrypt</text>

  <!-- vertical arrows -->
  <line x1="135" y1="180" x2="135" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>
  <text x="145" y="205" font-size="11" fill="#333">new Document(pdf)</text>
  <line x1="715" y1="180" x2="715" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>
  <text x="725" y="205" font-size="11" fill="#333">draw onto pages</text>
  <line x1="235" y1="320" x2="235" y2="402" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>
  <text x="245" y="360" font-size="11" fill="#333">flush and close: objects out</text>
  <line x1="665" y1="402" x2="665" y2="322" stroke="#555" stroke-width="1.5" marker-end="url(#il-arrow)"/>
  <text x="675" y="360" font-size="11" fill="#333">open: objects in</text>
  <text x="450" y="490" text-anchor="middle" font-size="11" fill="#555">Closing the Document closes the PdfDocument, which finishes and closes the PdfWriter.</text>
</svg>
