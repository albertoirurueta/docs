<text x="364" y="722" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#0dbc79">✔ creates a claim with the status N (8.060917ms)</text>
<text x="364" y="741" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#0dbc79">✔ filters claims by status (4.961542ms)</text>
<text x="364" y="760" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#cccccc">ℹ pass 3</text>
