<text x="362" y="52" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#ffffff">claims.test.js</text>
<rect x="348" y="65" width="732" height="567" fill="#1f1f1f"/>
<g><rect x="356" y="73" width="716" height="524" rx="2" fill="#1f1f1f" stroke="#3c3c3c" stroke-width="1"/><text x="368" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">1</text><text x="392" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">import cds from '@sap/cds'</text><text x="368" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">2</text><text x="392" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">import { test, beforeEach } from 'node:test'</text><text x="368" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">3</text><text x="392" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">import assert from 'node:assert'</text><text x="368" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">4</text><text x="392" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text><text x="368" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">5</text><text x="392" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">const { GET, POST, data } = cds.test(import.meta.dirname + '/..')</text><text x="368" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">6</text><text x="392" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">beforeEach(() =&gt; data.reset())</text><text x="368" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">7</text><text x="392" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text><text x="368" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">8</text><text x="392" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('lists the two claims of the sample data', async () =&gt; {</text><text x="368" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">9</text><text x="392" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const { data } = await GET('/odata/v4/claim/Claims?$orderby=title')</text><text x="368" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">10</text><text x="392" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const titles = data.value.map(c =&gt; c.title)</text><text x="368" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">11</text><text x="392" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.deepEqual(titles, ['Hotel', 'Train ticket'])</text><text x="368" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">12</text><text x="392" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">13</text><text x="392" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text><text x="368" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">14</text><text x="392" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('creates a claim with the status N', async () =&gt; {</text><text x="368" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">15</text><text x="392" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const body = { title: 'Taxi', amount: 18 }</text><text x="368" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">16</text><text x="392" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const { status, data } = await POST('/odata/v4/claim/Claims', body)</text><text x="368" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">17</text><text x="392" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(status, 201)</text><text x="368" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">18</text><text x="392" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(data.status, 'N')</text><text x="368" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">19</text><text x="392" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">20</text><text x="392" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text><text x="368" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">21</text><text x="392" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">test('filters claims by status', async () =&gt; {</text><text x="368" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">22</text><text x="392" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const query = `$filter=status eq 'A'`</text><text x="368" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">23</text><text x="392" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const { data } = await GET(`/odata/v4/claim/Claims?${query}`)</text><text x="368" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">24</text><text x="392" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(data.value.length, 1)</text><text x="368" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">25</text><text x="392" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  assert.equal(data.value[0].title, 'Hotel')</text><text x="368" y="595" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">26</text><text x="392" y="595" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text></g>
<rect x="348" y="632" width="732" height="180" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="364" y="654" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600" fill="#cccccc">TERMINAL</text>
