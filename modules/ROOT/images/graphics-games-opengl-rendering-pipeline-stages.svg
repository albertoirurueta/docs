<text x="630.0" y="295.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">separate: glDispatchCompute</text>
<text x="520" y="326" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="20" y="350" width="720" height="130" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="380.0" y="419.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="40" y="374" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Legend and notes</text>
<rect x="40" y="388" width="22" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="72" y="400" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Programmable stage (you write GLSL)</text>
<rect x="40" y="410" width="22" height="14" rx="3" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="72" y="422" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Fixed-function stage (configured with state calls)</text>
<text x="40" y="448" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Mesh and task shaders (GL_EXT_mesh_shader) replace vertex, tessellation and geometry; compute runs outside the pipeline.</text>
<text x="40" y="466" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">A fragment shader that writes depth or discards disables the early depth test optimisation.</text>
