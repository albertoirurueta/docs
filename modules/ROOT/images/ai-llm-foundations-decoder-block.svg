<svg viewBox="0 0 720 850" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2a2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="850" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A pre-norm decoder block, stacked N times</text>
  <text x="360" y="48" font-size="12" fill="#666666" text-anchor="middle">Input embeddings + positional information flow up through N identical blocks to the output</text>

  <!-- input embeddings -->
  <rect x="210" y="66" width="300" height="46" rx="8" fill="#eef3fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="360" y="94" font-size="13" fill="#1c4b73" text-anchor="middle">Input embeddings + positional encoding</text>

  <line x1="360" y1="112" x2="360" y2="132" stroke="#333333" stroke-width="1.5"/>

  <!-- decoder block boundary -->
  <rect x="130" y="132" width="460" height="522" rx="10" fill="#fbfbfb" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="150" y="152" font-size="12" font-weight="bold" fill="#555555">Decoder block (repeated x N)</text>

  <!-- residual stream branch point 1 -->
  <line x1="360" y1="132" x2="360" y2="174" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="360" cy="162" r="3.5" fill="#8a2a2a"/>

  <!-- RMSNorm 1 -->
  <rect x="250" y="174" width="220" height="34" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="196" font-size="13" fill="#7a3b12" text-anchor="middle">RMSNorm</text>

  <line x1="360" y1="208" x2="360" y2="224" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- self-attention -->
  <rect x="210" y="224" width="300" height="52" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="246" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Masked self-attention</text>
  <text x="360" y="263" font-size="11" fill="#2f5424" text-anchor="middle">(multi-head / GQA / MQA)</text>

  <line x1="360" y1="276" x2="360" y2="292" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- add residual 1 -->
  <circle cx="360" cy="306" r="14" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.5"/>
  <text x="360" y="312" font-size="18" font-weight="bold" fill="#8a2a2a" text-anchor="middle">+</text>
  <text x="386" y="310" font-size="11" fill="#8a2a2a">add residual</text>

  <!-- residual path 1: block input skips past norm + attention -->
  <path d="M 360 162 L 170 162 L 170 306 L 344 306" fill="none" stroke="#8a2a2a" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="158" y="234" font-size="10.5" fill="#8a2a2a" text-anchor="middle" transform="rotate(-90 158 234)">residual</text>

  <!-- residual stream branch point 2 -->
  <line x1="360" y1="320" x2="360" y2="352" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="360" cy="336" r="3.5" fill="#8a2a2a"/>

  <!-- RMSNorm 2 -->
  <rect x="250" y="352" width="220" height="34" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="374" font-size="13" fill="#7a3b12" text-anchor="middle">RMSNorm</text>

  <line x1="360" y1="386" x2="360" y2="402" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FFN -->
  <rect x="210" y="402" width="300" height="52" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="424" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Feed-forward network</text>
  <text x="360" y="441" font-size="11" fill="#2f5424" text-anchor="middle">(SwiGLU gated MLP)</text>

  <line x1="360" y1="454" x2="360" y2="470" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- add residual 2 -->
  <circle cx="360" cy="484" r="14" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.5"/>
  <text x="360" y="490" font-size="18" font-weight="bold" fill="#8a2a2a" text-anchor="middle">+</text>
  <text x="386" y="488" font-size="11" fill="#8a2a2a">add residual</text>

  <!-- residual path 2: skips past norm + FFN -->
  <path d="M 360 336 L 170 336 L 170 484 L 344 484" fill="none" stroke="#8a2a2a" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="158" y="410" font-size="10.5" fill="#8a2a2a" text-anchor="middle" transform="rotate(-90 158 410)">residual</text>

  <!-- repeat indicator -->
  <line x1="360" y1="498" x2="360" y2="518" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="360" cy="528" r="3" fill="#555555"/>
  <circle cx="360" cy="540" r="3" fill="#555555"/>
  <circle cx="360" cy="552" r="3" fill="#555555"/>
  <text x="380" y="544" font-size="11" fill="#555555">repeated for block 2 .. N</text>
  <line x1="360" y1="562" x2="360" y2="584" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final block N labeled compactly -->
  <rect x="160" y="584" width="400" height="44" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="603" font-size="12" fill="#2f5424" text-anchor="middle">Block N: RMSNorm -&gt; attention -&gt; add residual</text>
  <text x="360" y="619" font-size="12" fill="#2f5424" text-anchor="middle">-&gt; RMSNorm -&gt; SwiGLU FFN -&gt; add residual</text>

  <line x1="360" y1="628" x2="360" y2="674" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final norm (outside the repeated block) -->
  <rect x="250" y="674" width="220" height="36" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="697" font-size="12.5" fill="#7a3b12" text-anchor="middle">Final RMSNorm</text>

  <line x1="360" y1="710" x2="360" y2="730" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="210" y="730" width="300" height="46" rx="8" fill="#eef3fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="360" y="758" font-size="13" fill="#1c4b73" text-anchor="middle">Output logits over the vocabulary</text>

  <text x="360" y="806" font-size="11" fill="#888888" text-anchor="middle">Each sub-layer normalizes its input first (pre-norm) and its output is added back onto the</text>
  <text x="360" y="822" font-size="11" fill="#888888" text-anchor="middle">un-normalized residual stream; a final RMSNorm follows the last block, before the output projection.</text>
</svg>
