<svg viewBox="0 0 720 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="760" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A decoder block, stacked N times</text>
  <text x="360" y="48" font-size="12" fill="#666666" text-anchor="middle">Input embeddings + positional information flow up through N identical blocks to the output</text>

  <!-- input embeddings -->
  <rect x="210" y="66" width="300" height="46" rx="8" fill="#eef3fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="360" y="94" font-size="13" fill="#1c4b73" text-anchor="middle">Input embeddings + positional encoding</text>

  <!-- arrow -->
  <line x1="360" y1="112" x2="360" y2="132" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decoder block boundary -->
  <rect x="150" y="132" width="420" height="470" rx="10" fill="#fbfbfb" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="170" y="152" font-size="12" font-weight="bold" fill="#555555">Decoder block (repeated x N)</text>

  <!-- self-attention -->
  <rect x="210" y="166" width="300" height="52" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="188" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Masked self-attention</text>
  <text x="360" y="205" font-size="11" fill="#2f5424" text-anchor="middle">(multi-head / GQA / MQA)</text>

  <line x1="360" y1="218" x2="360" y2="238" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- add & norm 1 -->
  <rect x="230" y="238" width="260" height="40" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="263" font-size="13" fill="#7a3b12" text-anchor="middle">Add &amp; Norm (residual + RMSNorm)</text>

  <!-- residual arc 1 -->
  <path d="M 200 192 C 130 192, 130 258, 220 258" fill="none" stroke="#8a2a2a" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="90" y="228" font-size="10.5" fill="#8a2a2a" text-anchor="middle" transform="rotate(-90 90 228)">residual</text>

  <line x1="360" y1="278" x2="360" y2="298" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FFN -->
  <rect x="210" y="298" width="300" height="52" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="320" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Feed-forward network</text>
  <text x="360" y="337" font-size="11" fill="#2f5424" text-anchor="middle">(SwiGLU gated MLP)</text>

  <line x1="360" y1="350" x2="360" y2="370" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- add & norm 2 -->
  <rect x="230" y="370" width="260" height="40" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="395" font-size="13" fill="#7a3b12" text-anchor="middle">Add &amp; Norm (residual + RMSNorm)</text>

  <!-- residual arc 2 -->
  <path d="M 200 324 C 130 324, 130 390, 220 390" fill="none" stroke="#8a2a2a" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- repeat indicator -->
  <line x1="360" y1="410" x2="360" y2="430" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="360" cy="440" r="3" fill="#555555"/>
  <circle cx="360" cy="452" r="3" fill="#555555"/>
  <circle cx="360" cy="464" r="3" fill="#555555"/>
  <text x="400" y="452" font-size="11" fill="#555555">repeated for block 2 .. N</text>
  <line x1="360" y1="474" x2="360" y2="494" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final block N labeled compactly -->
  <rect x="210" y="494" width="300" height="40" rx="8" fill="#e9f3ee" stroke="#2f5424" stroke-width="1.5"/>
  <text x="360" y="519" font-size="12" fill="#2f5424" text-anchor="middle">Block N: self-attention -&gt; add &amp; norm -&gt; FFN -&gt; add &amp; norm</text>

  <line x1="360" y1="534" x2="360" y2="554" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final norm -->
  <rect x="230" y="554" width="260" height="38" rx="8" fill="#fdf1e6" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="360" y="578" font-size="12.5" fill="#7a3b12" text-anchor="middle">Final RMSNorm</text>

  <line x1="360" y1="602" x2="360" y2="622" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="210" y="622" width="300" height="46" rx="8" fill="#eef3fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="360" y="650" font-size="13" fill="#1c4b73" text-anchor="middle">Output logits over the vocabulary</text>

  <text x="360" y="700" font-size="11" fill="#888888" text-anchor="middle">Each decoder block applies self-attention and a feed-forward network, each wrapped in a residual</text>
  <text x="360" y="716" font-size="11" fill="#888888" text-anchor="middle">connection and a normalization step, before the next block or the final output projection.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2a2a"/>
    </marker>
  </defs>
</svg>
