<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Input, output and ownership of AI-created work</text>
  <rect x="24" y="60" width="170" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="109" y="86" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Input</text>
  <text x="109" y="110" font-size="12" fill="#374151" text-anchor="middle">Your prompt</text>
  <text x="109" y="128" font-size="12" fill="#374151" text-anchor="middle">Your uploads</text>
  <text x="109" y="152" font-size="12" fill="#374151" text-anchor="middle">You need the rights</text>
  <text x="109" y="168" font-size="12" fill="#374151" text-anchor="middle">to use them</text>
  <rect x="250" y="60" width="170" height="130" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="335" y="86" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">AI product</text>
  <text x="335" y="112" font-size="12" fill="#374151" text-anchor="middle">Input and output</text>
  <text x="335" y="128" font-size="12" fill="#374151" text-anchor="middle">are reviewed</text>
  <text x="335" y="144" font-size="12" fill="#374151" text-anchor="middle">automatically</text>
  <text x="335" y="168" font-size="12" fill="#374151" text-anchor="middle">Usage limits apply</text>
  <rect x="476" y="60" width="170" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="561" y="86" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Output</text>
  <text x="561" y="112" font-size="12" fill="#374151" text-anchor="middle">Images, text, video,</text>
  <text x="561" y="128" font-size="12" fill="#374151" text-anchor="middle">audio, music</text>
  <text x="561" y="152" font-size="12" fill="#374151" text-anchor="middle">Similar prompts can</text>
  <text x="561" y="168" font-size="12" fill="#374151" text-anchor="middle">give similar results</text>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M195,125 L249,125" marker-end="url(#ah)"/><path d="M421,125 L475,125" marker-end="url(#ah)"/></g>
  <path d="M561,192 L561,222" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="140" y="226" width="270" height="88" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="275" y="250" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Generated by the AI alone</text>
  <text x="275" y="272" font-size="12" fill="#374151" text-anchor="middle">You own it as between you and Canva,</text>
  <text x="275" y="288" font-size="12" fill="#374151" text-anchor="middle">to the extent the law allows. Copyright</text>
  <text x="275" y="304" font-size="12" fill="#374151" text-anchor="middle">protection depends on your jurisdiction.</text>
  <rect x="430" y="226" width="300" height="88" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="250" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Incorporates library content</text>
  <text x="580" y="272" font-size="12" fill="#374151" text-anchor="middle">That part stays under the Content</text>
  <text x="580" y="288" font-size="12" fill="#374151" text-anchor="middle">License Agreement: you hold a licence,</text>
  <text x="580" y="304" font-size="12" fill="#374151" text-anchor="middle">not ownership</text>
  <text x="380" y="346" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
