<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">scikit-learn 1.6 to 1.10 release timeline</title>
<desc id="d">Five minor releases along a horizontal line with their release dates and headline changes. Version 1.10 is marked upcoming.</desc>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">scikit-learn timeline, 1.6 to 1.10</text>
<line x1="30" y1="165" x2="690" y2="165" stroke="#94A3B8" stroke-width="3"/>
<line x1="100" y1="132" x2="100" y2="165" stroke="#94A3B8" stroke-width="2"/>
<rect x="10" y="50" width="180" height="82" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="100" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1.6  (Dec 2024)</text>
<text x="100" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">FrozenEstimator,</text>
<text x="100" y="109" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">transform_input,</text>
<text x="100" y="125" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">free-threaded 3.13</text>
<circle cx="100" cy="165" r="8" fill="#6D28D9"/>
<line x1="230" y1="165" x2="230" y2="212" stroke="#94A3B8" stroke-width="2"/>
<rect x="140" y="212" width="180" height="82" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="230" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1.7  (Jun 2025)</text>
<text x="230" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">array-api-compat vendored,</text>
<text x="230" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">HGB X_val, multiclass Brier</text>
<circle cx="230" cy="165" r="8" fill="#6D28D9"/>
<line x1="360" y1="132" x2="360" y2="165" stroke="#94A3B8" stroke-width="2"/>
<rect x="270" y="50" width="180" height="82" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1.8  (2025-12-10)</text>
<text x="360" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">temperature scaling,</text>
<text x="360" y="109" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">ClassicalMDS, penalty</text>
<text x="360" y="125" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">deprecated</text>
<circle cx="360" cy="165" r="8" fill="#6D28D9"/>
<line x1="490" y1="165" x2="490" y2="212" stroke="#94A3B8" stroke-width="2"/>
<rect x="400" y="212" width="180" height="82" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="490" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1.9  (2026-06-02)</text>
<text x="490" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">callbacks, narwhals,</text>
<text x="490" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">metric_at_thresholds</text>
<circle cx="490" cy="165" r="8" fill="#6D28D9"/>
<line x1="620" y1="132" x2="620" y2="165" stroke="#94A3B8" stroke-width="2"/>
<rect x="530" y="50" width="180" height="82" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="620" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1.10  (upcoming)</text>
<text x="620" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">auto-requested metadata,</text>
<text x="620" y="109" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">IterativeImputer stable</text>
<circle cx="620" cy="165" r="8" fill="#B45309"/>
</svg>
