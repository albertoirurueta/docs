<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Failure and rollback in a Verse failure context</text>
<rect x="18" y="48" width="354" height="230" rx="12" fill="#F9FAFB" stroke="#047857" stroke-width="2"/>
<text x="195" y="72" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Every step succeeds</text>
<rect x="38" y="88" width="314" height="34" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="109.2" text-anchor="middle" font-size="12" fill="#1F2937">set Score += 100</text>
<line x1="195" y1="122" x2="195" y2="138" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d2)"/>
<rect x="38" y="138" width="314" height="34" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="159.2" text-anchor="middle" font-size="12" fill="#1F2937">Book := Books[1]</text>
<line x1="195" y1="172" x2="195" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d2)"/>
<rect x="38" y="188" width="314" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="209.2" text-anchor="middle" font-size="12" fill="#065F46">then: branch runs</text>
<text x="195" y="246" text-anchor="middle" font-size="13" fill="#047857" font-weight="bold">Score stays 100</text>
<text x="195" y="264" text-anchor="middle" font-size="11" fill="#374151">the change is kept</text>
<rect x="388" y="48" width="354" height="230" rx="12" fill="#F9FAFB" stroke="#B45309" stroke-width="2"/>
<text x="565" y="72" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">One step fails</text>
<rect x="408" y="88" width="314" height="34" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="109.2" text-anchor="middle" font-size="12" fill="#1F2937">set Score += 100</text>
<line x1="565" y1="122" x2="565" y2="138" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d2)"/>
<rect x="408" y="138" width="314" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="159.2" text-anchor="middle" font-size="12" fill="#92400E">Book := Books[7]  (no such index)</text>
<line x1="565" y1="172" x2="565" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#d2)"/>
<rect x="408" y="188" width="314" height="34" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="209.2" text-anchor="middle" font-size="12" fill="#1F2937">else: branch runs</text>
<text x="565" y="246" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Score is back to its old value</text>
<text x="565" y="264" text-anchor="middle" font-size="11" fill="#374151">the first step is rolled back as if it never ran</text>
<path d="M388,153 C370,153 370,105 388,105" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d2)"/>
<text x="380" y="306" text-anchor="middle" font-size="11" fill="#374151">Rollback needs the work to be transactional: failable functions carry the transacts effect together with decides</text>
</svg>
