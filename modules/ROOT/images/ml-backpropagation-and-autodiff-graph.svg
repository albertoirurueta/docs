<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img">
<title>Computational graph with forward values and backward gradients</title>
<desc>The graph of L equals the squared difference of w times x plus b minus y, with the forward value and the gradient of L stored at each node.</desc>
<rect x="1" y="1" width="718" height="348" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Computational graph: forward values and backward gradients</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<line x1="118.0" y1="114.6" x2="157.0" y2="130.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="118.0" y1="188.7" x2="157.0" y2="171.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="253.0" y1="171.3" x2="292.0" y2="188.7" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="253.0" y1="245.4" x2="292.0" y2="229.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="388.0" y1="188.7" x2="427.0" y2="171.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="388.0" y1="114.6" x2="427.0" y2="130.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="523.0" y1="150.0" x2="562.0" y2="150.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="22.0" y="64.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="70" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">x</text>
<text x="70" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 2</text>
<text x="70" y="115" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 12</text>
<rect x="22.0" y="179.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="70" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">w</text>
<text x="70" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 3</text>
<text x="70" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 8</text>
<rect x="157.0" y="119.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="205" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">mul</text>
<text x="205" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 6</text>
<text x="205" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 4</text>
<rect x="157.0" y="234.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="205" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">b</text>
<text x="205" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 1</text>
<text x="205" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 4</text>
<rect x="292.0" y="179.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="340" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">add</text>
<text x="340" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 7</text>
<text x="340" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 4</text>
<rect x="292.0" y="64.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="340" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">y (label)</text>
<text x="340" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 5</text>
<text x="340" y="115" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = const</text>
<rect x="427.0" y="119.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="475" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">sub</text>
<text x="475" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 2</text>
<text x="475" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 4</text>
<rect x="562.0" y="119.0" width="96" height="62" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="610" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">square = L</text>
<text x="610" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1D4ED8" text-anchor="middle">value = 4</text>
<text x="610" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#C2410C" text-anchor="middle">grad = 1</text>
<text x="24" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Blue: forward pass computes values left to right. Orange: backward pass multiplies local derivatives right to left.</text>
</svg>
