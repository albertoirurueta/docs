<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-lighting-in-shaders-tangent-space" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Normal map texels and the tangent frame T, B, N</text>
<rect x="30" y="60" width="60" height="50" rx="4" fill="rgb(128,128,255)" stroke="#4B5563" stroke-width="1.5" />
<text x="105" y="78" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">(128, 128, 255)</text>
<text x="105" y="94" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">n = (0, 0, 1)</text>
<text x="105" y="108" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">flat</text>
<rect x="30" y="140" width="60" height="50" rx="4" fill="rgb(200,128,230)" stroke="#4B5563" stroke-width="1.5" />
<text x="105" y="158" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">(200, 128, 230)</text>
<text x="105" y="174" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">n = (0.57, 0, 0.8)</text>
<text x="105" y="188" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">tilts toward +T</text>
<rect x="30" y="220" width="60" height="50" rx="4" fill="rgb(128,60,230)" stroke="#4B5563" stroke-width="1.5" />
<text x="105" y="238" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">(128, 60, 230)</text>
<text x="105" y="254" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">n = (0, -0.5, 0.8)</text>
<text x="105" y="268" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">tilts toward -B</text>
<text x="30" y="310" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">n = texel.rgb * 2.0 - 1.0</text>
<text x="30" y="330" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">8-bit data: store it in RGBA8, never SRGB8_ALPHA8.</text>
<polygon points="410,260 610,260 670,200 470,200" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="540" y1="230" x2="650" y2="230" stroke="#4F46E5" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-tangent-space)"/>
<text x="662" y="234" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">T (+u)</text>
<line x1="540" y1="230" x2="580" y2="170" stroke="#047857" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-tangent-space)"/>
<text x="586" y="170" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">B (+v)</text>
<line x1="540" y1="230" x2="540" y2="120" stroke="#B45309" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-tangent-space)"/>
<text x="548" y="118" font-size="13" font-weight="bold" fill="#92400E" text-anchor="start">N</text>
<text x="540" y="295" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">TBN = mat3(T, B, N): columns are the frame axes in world space</text>
<text x="540" y="313" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">normalWorld = TBN * normalTangent</text>
<text x="540" y="333" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">N from the normal matrix; T from the model matrix; B = cross(N, T)</text>
</svg>
