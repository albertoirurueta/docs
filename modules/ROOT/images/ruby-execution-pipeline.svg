<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>How Ruby runs a file</title>
  <desc>A Ruby source file is parsed by Prism into an abstract syntax tree, compiled to YARV instruction sequences and run by the YARV interpreter. YJIT or ZJIT compile hot methods to machine code, and the garbage collector manages the heap the interpreter allocates in.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="480" fill="#ffffff"/>
  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">How Ruby runs a file</text>
  <text x="470" y="50" font-size="12" fill="#666666" text-anchor="middle">CRuby 4.0: the whole file is parsed and compiled before the first line runs</text>

  <rect x="30" y="80" width="140" height="80" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="100" y="108" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Source</text>
  <text x="100" y="128" font-size="11" fill="#444444" text-anchor="middle">file.rb, -e, stdin,</text>
  <text x="100" y="144" font-size="11" fill="#444444" text-anchor="middle">required files</text>

  <rect x="210" y="80" width="140" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="280" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Prism parser</text>
  <text x="280" y="128" font-size="11" fill="#444444" text-anchor="middle">default since 3.4</text>
  <text x="280" y="144" font-size="11" fill="#444444" text-anchor="middle">--parser=parse.y</text>

  <rect x="390" y="80" width="140" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="460" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">AST</text>
  <text x="460" y="128" font-size="11" fill="#444444" text-anchor="middle">tree of nodes, such as</text>
  <text x="460" y="144" font-size="11" fill="#444444" text-anchor="middle">Prism::CallNode</text>

  <rect x="570" y="80" width="140" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="640" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Compiler</text>
  <text x="640" y="128" font-size="11" fill="#444444" text-anchor="middle">walks the tree and</text>
  <text x="640" y="144" font-size="11" fill="#444444" text-anchor="middle">emits instructions</text>

  <rect x="750" y="80" width="160" height="80" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="830" y="108" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">YARV instructions</text>
  <text x="830" y="128" font-size="11" fill="#444444" text-anchor="middle">one sequence per method,</text>
  <text x="830" y="144" font-size="11" fill="#444444" text-anchor="middle">block and class body</text>

  <line x1="170" y1="120" x2="208" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="120" x2="388" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="120" x2="568" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="120" x2="748" y2="120" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="830" y1="160" x2="830" y2="218" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="720" y="220" width="190" height="90" rx="6" fill="#e9f5ec" stroke="#1e6b3a" stroke-width="1.5"/>
  <text x="815" y="248" font-size="14" font-weight="bold" fill="#1e6b3a" text-anchor="middle">YARV interpreter</text>
  <text x="815" y="268" font-size="11" fill="#444444" text-anchor="middle">executes the instructions</text>
  <text x="815" y="284" font-size="11" fill="#444444" text-anchor="middle">on a stack machine,</text>
  <text x="815" y="300" font-size="11" fill="#444444" text-anchor="middle">method calls, blocks, exceptions</text>

  <rect x="400" y="220" width="250" height="90" rx="6" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
  <text x="525" y="248" font-size="14" font-weight="bold" fill="#7a4800" text-anchor="middle">YJIT or ZJIT (optional)</text>
  <text x="525" y="268" font-size="11" fill="#444444" text-anchor="middle">compile hot methods to machine code</text>
  <text x="525" y="284" font-size="11" fill="#444444" text-anchor="middle">YJIT: --yjit, production ready since 3.2</text>
  <text x="525" y="300" font-size="11" fill="#444444" text-anchor="middle">ZJIT: --zjit, experimental in 4.0</text>

  <line x1="720" y1="245" x2="652" y2="245" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="686" y="237" font-size="10" fill="#444444" text-anchor="middle">hot</text>
  <line x1="652" y1="287" x2="720" y2="287" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="686" y="304" font-size="10" fill="#444444" text-anchor="middle">native</text>

  <rect x="30" y="220" width="320" height="90" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="190" y="246" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Look inside each stage</text>
  <text x="190" y="266" font-size="11" fill="#444444" text-anchor="middle">Prism.parse(source) returns the parsed tree</text>
  <text x="190" y="282" font-size="11" fill="#444444" text-anchor="middle">RubyVM::InstructionSequence.compile</text>
  <text x="190" y="298" font-size="11" fill="#444444" text-anchor="middle">ruby --dump=insns file.rb</text>

  <line x1="815" y1="310" x2="815" y2="368" stroke="#444444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="525" y1="310" x2="525" y2="368" stroke="#444444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="30" y="370" width="880" height="80" rx="6" fill="#f6eef8" stroke="#6a2c7a" stroke-width="1.5"/>
  <text x="470" y="398" font-size="14" font-weight="bold" fill="#6a2c7a" text-anchor="middle">Heap and garbage collector</text>
  <text x="470" y="418" font-size="11" fill="#444444" text-anchor="middle">Every object lives on the heap. The default collector is generational and incremental mark-and-sweep,</text>
  <text x="470" y="434" font-size="11" fill="#444444" text-anchor="middle">and GC.compact can move objects. Interpreter and JIT-compiled code allocate; the collector frees.</text>

  <text x="470" y="470" font-size="11" fill="#666666" text-anchor="middle">A required file goes through the same stages when require loads it.</text>
</svg>
