<text x="570" y="230" text-anchor="middle" font-size="11" fill="#374151">IJobEntity reads both arrays sequentially,</text>
<text x="570" y="246" text-anchor="middle" font-size="11" fill="#374151">Burst vectorises the loop and chunks</text>
<text x="570" y="262" text-anchor="middle" font-size="11" fill="#374151">are split across worker threads</text>
<text x="570" y="322" text-anchor="middle" font-size="11" fill="#374151">Same 10,000 books: fewer cache misses</text>
<text x="570" y="338" text-anchor="middle" font-size="11" fill="#374151">and work that scales over cores</text>
