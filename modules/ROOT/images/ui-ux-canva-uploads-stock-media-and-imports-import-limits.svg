<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Import limits by file type, as documented on 2026-11-07</text>
  <rect x="20" y="48" width="720" height="30" fill="#4F46E5"/>
  <g font-size="13" font-weight="bold" fill="#FFFFFF"><text x="34" y="68">File type</text><text x="190" y="68">Becomes</text><text x="330" y="68">Documented limits</text></g>
  <g font-size="12" fill="#1F2937">
    <rect x="20" y="78" width="720" height="38" fill="#EEF2FF"/><text x="34" y="101" font-weight="bold">PDF</text><text x="190" y="101">editable design</text><text x="330" y="101">300 MB, 500 pages, 1,400 elements and images</text>
    <rect x="20" y="116" width="720" height="38" fill="#FFFFFF"/><text x="34" y="139" font-weight="bold">PowerPoint</text><text x="190" y="139">design (beta)</text><text x="330" y="139">100 MB (.ppt), 300 MB (.pptx), 300 slides</text>
    <rect x="20" y="154" width="720" height="38" fill="#EEF2FF"/><text x="34" y="177" font-weight="bold">Illustrator</text><text x="190" y="177">design (beta)</text><text x="330" y="177">100 MB, PDF-compatible .ai, 300 artboards</text>
    <rect x="20" y="192" width="720" height="38" fill="#FFFFFF"/><text x="34" y="215" font-weight="bold">Photoshop</text><text x="190" y="215">design (beta)</text><text x="330" y="215">300 MB, no artboard limit</text>
    <rect x="20" y="230" width="720" height="38" fill="#EEF2FF"/><text x="34" y="253" font-weight="bold">Markdown</text><text x="190" y="253">Canva Doc</text><text x="330" y="253">5 MB, .md, Docs only, no .md export</text>
    <rect x="20" y="268" width="720" height="38" fill="#FFFFFF"/><text x="34" y="291" font-weight="bold">Spreadsheet, CSV</text><text x="190" y="291">Canva Sheet</text><text x="330" y="291">100 MB, 500 rows and 52 columns for Sheets</text>
    <rect x="20" y="306" width="720" height="38" fill="#EEF2FF"/><text x="34" y="329" font-weight="bold">Lottie, SVG, images</text><text x="190" y="329">uploaded media</text><text x="330" y="329">Images under 50 MB; SVG under 3 MB</text>
  </g>
  <rect x="20" y="48" width="720" height="296" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="372" font-size="12" fill="#92400E" text-anchor="middle">Limits change; confirm them on the upload formats page before a large import.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
