<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tcs-chunks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Injecting code into a built-in material with onBeforeCompile</text>
<rect x="20" y="55" width="200" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="120.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">ShaderLib source</text>
<text x="120.0" y="126.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">meshstandard_vert.glsl</text>
<text x="120.0" y="141.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(string with</text>
<text x="120.0" y="156.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">#include lines)</text>
<rect x="280" y="55" width="200" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="111.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">ShaderChunk table</text>
<text x="380.0" y="126.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">begin_vertex</text>
<text x="380.0" y="141.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">project_vertex</text>
<text x="380.0" y="156.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">normal_fragment_begin</text>
<rect x="540" y="55" width="200" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="111.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Final GLSL</text>
<text x="640.0" y="126.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">chunks expanded</text>
<text x="640.0" y="141.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">plus your patched</text>
<text x="640.0" y="156.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">text</text>
<line x1="220" y1="130" x2="280" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tcs-chunks)"/>
<line x1="480" y1="130" x2="540" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tcs-chunks)"/>
<text x="250" y="120" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">resolve</text>
<text x="510" y="120" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">link</text>
<rect x="120" y="235" width="520" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="263.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">onBeforeCompile(shader): shader.vertexShader.replace( token, token + extra )</text>
<line x1="380" y1="235" x2="380" y2="206" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tcs-chunks)"/>
<text x="380" y="312" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The callback runs once per program, before compilation, and receives the uniforms object so you can add your own.</text>
<text x="380" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Patch text must match the chunk exactly; a wrong token silently changes nothing.</text>
<text x="380" y="358" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Give the material customProgramCacheKey when two patched variants must not share a program.</text>
</svg>
