<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How a module template is found: theme override first, module file last</title>
  <desc>The front controller calls setTemplate with the module: resource. Smarty looks for the file in the active theme modules folder, then in the parent theme modules folder, then in the module's own folder; the first file found is compiled once and the compiled copy is served until the compiled file is deleted, because the Docker image uses PS_SMARTY_FORCE_COMPILE 0. The compiled template extends page.tpl, which extends the layout, so the module only supplies the page title and page content blocks.</desc>
  <text x="480" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">module:pcfdfront/views/templates/front/roast.tpl, step by step</text>

  <rect x="20" y="50" width="920" height="46" rx="8" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="36" y="78" font-size="13" fill="#1f2933" font-family="Courier New, monospace">$this-&gt;setTemplate('module:pcfdfront/views/templates/front/roast.tpl');   // in initContent()</text>

  <text x="36" y="124" font-size="13" font-weight="bold" fill="#7b8794">Lookup order of the module: resource (first file that exists wins)</text>
  <rect x="20" y="136" width="290" height="96" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="34" y="158" font-size="13" font-weight="bold" fill="#1f2933">1. Active theme</text>
  <text x="34" y="178" font-size="11" fill="#1f2933" font-family="Courier New, monospace">themes/hummingbird/modules/</text>
  <text x="34" y="194" font-size="11" fill="#1f2933" font-family="Courier New, monospace">pcfdfront/views/templates/</text>
  <text x="34" y="210" font-size="11" fill="#1f2933" font-family="Courier New, monospace">front/roast.tpl</text>
  <rect x="335" y="136" width="290" height="96" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="349" y="158" font-size="13" font-weight="bold" fill="#1f2933">2. Parent theme (child themes)</text>
  <text x="349" y="178" font-size="11" fill="#1f2933" font-family="Courier New, monospace">themes/&lt;parent&gt;/modules/</text>
  <text x="349" y="194" font-size="11" fill="#1f2933" font-family="Courier New, monospace">pcfdfront/views/templates/</text>
  <text x="349" y="210" font-size="11" fill="#1f2933" font-family="Courier New, monospace">front/roast.tpl</text>
  <rect x="650" y="136" width="290" height="96" rx="8" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="664" y="158" font-size="13" font-weight="bold" fill="#1f2933">3. The module itself</text>
  <text x="664" y="178" font-size="11" fill="#1f2933" font-family="Courier New, monospace">modules/pcfdfront/views/</text>
  <text x="664" y="194" font-size="11" fill="#1f2933" font-family="Courier New, monospace">templates/front/roast.tpl</text>
  <text x="664" y="210" font-size="11" fill="#1f2933">the file the developer ships</text>
  <path d="M310 184 H335 M625 184 H650" stroke="#7b8794" stroke-width="2" fill="none"/>
  <text x="322" y="176" font-size="10.5" fill="#7b8794" text-anchor="middle">none</text>
  <text x="637" y="176" font-size="10.5" fill="#7b8794" text-anchor="middle">none</text>

  <path d="M480 236 V262" stroke="#7b8794" stroke-width="2" fill="none"/>
  <rect x="20" y="266" width="920" height="64" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="290" font-size="13" font-weight="bold" fill="#1f2933">Smarty compiles the file found, once</text>
  <text x="36" y="310" font-size="11.5" fill="#1f2933">var/cache/&lt;env&gt;/smarty/compile/... keeps the result. With PS_SMARTY_FORCE_COMPILE 0 (image default) the source is not checked again:</text>
  <text x="36" y="324" font-size="11.5" fill="#1f2933">a new theme override is ignored until the compiled file is removed (Clear cache in Advanced Parameters &gt; Performance).</text>

  <path d="M480 334 V360" stroke="#7b8794" stroke-width="2" fill="none"/>
  <rect x="20" y="364" width="290" height="116" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="34" y="386" font-size="13" font-weight="bold" fill="#1f2933">roast.tpl</text>
  <text x="34" y="406" font-size="11" fill="#1f2933" font-family="Courier New, monospace">{extends file='page.tpl'}</text>
  <text x="34" y="422" font-size="11" fill="#1f2933" font-family="Courier New, monospace">{block name='page_title'}</text>
  <text x="34" y="438" font-size="11" fill="#1f2933" font-family="Courier New, monospace">{block name='page_content'}</text>
  <text x="34" y="460" font-size="11.5" fill="#1f2933">only the two blocks of the page</text>
  <rect x="335" y="364" width="290" height="116" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="349" y="386" font-size="13" font-weight="bold" fill="#1f2933">page.tpl (theme)</text>
  <text x="349" y="406" font-size="11" fill="#1f2933" font-family="Courier New, monospace">{extends file=$layout}</text>
  <text x="349" y="426" font-size="11.5" fill="#1f2933">page header, content section,</text>
  <text x="349" y="442" font-size="11.5" fill="#1f2933">footer; title component</text>
  <rect x="650" y="364" width="290" height="116" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="664" y="386" font-size="13" font-weight="bold" fill="#1f2933">layout (layout-full-width.tpl)</text>
  <text x="664" y="406" font-size="11.5" fill="#1f2933">chosen by getLayout(): page name,</text>
  <text x="664" y="422" font-size="11.5" fill="#1f2933">theme.yml layouts, hook</text>
  <text x="664" y="438" font-size="11.5" fill="#1f2933">overrideLayoutTemplate; header,</text>
  <text x="664" y="454" font-size="11.5" fill="#1f2933">breadcrumb, notifications, footer</text>
  <path d="M310 422 H335 M625 422 H650" stroke="#7b8794" stroke-width="2" fill="none"/>
</svg>
