<line x1="190.0" y1="137.0" x2="190.0" y2="293.0" stroke="#1F2937" stroke-width="2"/><circle cx="190.0" cy="137.0" r="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><circle cx="190.0" cy="293.0" r="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="350" y="70" width="394" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="364" y="92" font-size="13" fill="#4F46E5" text-anchor="start" font-weight="bold">Complementary</text><text x="364" y="112" font-size="11" fill="#374151" text-anchor="start">two hues opposite each other: high energy, strong contrast</text><rect x="688" y="78" width="14" height="14" rx="3" fill="#4F46E5" stroke="#9CA3AF"/><rect x="704" y="78" width="14" height="14" rx="3" fill="#65A30D" stroke="#9CA3AF"/><rect x="350" y="136" width="394" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="364" y="158" font-size="13" fill="#4F46E5" text-anchor="start" font-weight="bold">Analogous</text><text x="364" y="178" font-size="11" fill="#374151" text-anchor="start">neighbours on the wheel: calm and cohesive</text><rect x="672" y="144" width="14" height="14" rx="3" fill="#4F46E5" stroke="#9CA3AF"/><rect x="688" y="144" width="14" height="14" rx="3" fill="#7C3AED" stroke="#9CA3AF"/><rect x="704" y="144" width="14" height="14" rx="3" fill="#C026D3" stroke="#9CA3AF"/><rect x="350" y="202" width="394" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="364" y="224" font-size="13" fill="#4F46E5" text-anchor="start" font-weight="bold">Triadic</text><text x="364" y="244" font-size="11" fill="#374151" text-anchor="start">three hues evenly spaced: lively but balanced</text><rect x="672" y="210" width="14" height="14" rx="3" fill="#4F46E5" stroke="#9CA3AF"/><rect x="688" y="210" width="14" height="14" rx="3" fill="#EA580C" stroke="#9CA3AF"/><rect x="704" y="210" width="14" height="14" rx="3" fill="#0891B2" stroke="#9CA3AF"/><rect x="350" y="268" width="394" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="364" y="290" font-size="13" fill="#4F46E5" text-anchor="start" font-weight="bold">Split complementary</text><text x="364" y="310" font-size="11" fill="#374151" text-anchor="start">one hue plus the two beside its opposite: contrast, less tension</text><rect x="672" y="276" width="14" height="14" rx="3" fill="#4F46E5" stroke="#9CA3AF"/><rect x="688" y="276" width="14" height="14" rx="3" fill="#B45309" stroke="#9CA3AF"/><rect x="704" y="276" width="14" height="14" rx="3" fill="#059669" stroke="#9CA3AF"/><rect x="350" y="334" width="394" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5"/><text x="364" y="356" font-size="13" fill="#4F46E5" text-anchor="start" font-weight="bold">Monochromatic</text><text x="364" y="376" font-size="11" fill="#374151" text-anchor="start">one hue in several tints and shades: safest, needs value contrast</text><rect x="656" y="342" width="14" height="14" rx="3" fill="#C7D2FE" stroke="#9CA3AF"/><rect x="672" y="342" width="14" height="14" rx="3" fill="#818CF8" stroke="#9CA3AF"/><rect x="688" y="342" width="14" height="14" rx="3" fill="#4F46E5" stroke="#9CA3AF"/><rect x="704" y="342" width="14" height="14" rx="3" fill="#3730A3" stroke="#9CA3AF"/><text x="190" y="345" font-size="11" fill="#6B7280" text-anchor="middle">Hues shown are illustrative, not Canva's palette</text>
  <text x="380" y="422" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
