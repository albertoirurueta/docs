<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">A supplier down payment and its clearing as T-accounts for company code EX01</title>
  <desc id="d">Seven T-accounts show the postings in euro. Step 2, the down payment of 11,900.00 including 1,900.00 tax, debits the special G/L account for down payments made and credits Bank, and posts 1,900.00 to Input tax (debit) and Input tax clearing (credit). Step 3, the final invoice of 35,700.00, debits Expense with 30,000.00 and Input tax with 5,700.00 and credits the supplier account with 35,700.00. Step 4, the transfer posting of the down payment, credits the special G/L account and debits the supplier account with 11,900.00 and corrects the tax: Input tax is credited and Input tax clearing is debited with 1,900.00. Step 5, payment of the balance, debits the supplier account and credits Bank with 23,800.00. At the end the special G/L account, the supplier account and Input tax clearing are zero.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="14" y="20" width="238" height="160" rx="10" fill="#5b9bd5" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="bold">Bank</text>
  <line x1="24" y1="52" x2="242" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="133" y1="52" x2="133" y2="146" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="141" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="141" y="88" text-anchor="start" font-size="12">(2) 11,900.00</text>
  <text x="141" y="106" text-anchor="start" font-size="12">(5) 23,800.00</text>
  <text x="133" y="168" text-anchor="middle" font-size="12" font-weight="bold">Balance 35,700.00 credit</text>
  <rect x="268" y="20" width="238" height="160" rx="10" fill="#7873f5" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="387" y="42" text-anchor="middle" font-size="13" font-weight="bold">Down payments made (A)</text>
  <line x1="278" y1="52" x2="496" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="387" y1="52" x2="387" y2="146" stroke="currentColor" stroke-width="1.5"/>
  <text x="379" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="395" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="379" y="88" text-anchor="end" font-size="12">(2) 11,900.00</text>
  <text x="395" y="88" text-anchor="start" font-size="12">(4) 11,900.00</text>
  <text x="387" y="168" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="522" y="20" width="238" height="160" rx="10" fill="#b76fe0" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="641" y="42" text-anchor="middle" font-size="13" font-weight="bold">Supplier account</text>
  <line x1="532" y1="52" x2="750" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="641" y1="52" x2="641" y2="146" stroke="currentColor" stroke-width="1.5"/>
  <text x="633" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="649" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="633" y="88" text-anchor="end" font-size="12">(4) 11,900.00</text>
  <text x="633" y="106" text-anchor="end" font-size="12">(5) 23,800.00</text>
  <text x="649" y="88" text-anchor="start" font-size="12">(3) 35,700.00</text>
  <text x="641" y="168" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="776" y="20" width="238" height="160" rx="10" fill="#2fbf71" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="895" y="42" text-anchor="middle" font-size="13" font-weight="bold">Expense</text>
  <line x1="786" y1="52" x2="1004" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="895" y1="52" x2="895" y2="146" stroke="currentColor" stroke-width="1.5"/>
  <text x="887" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="903" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="887" y="88" text-anchor="end" font-size="12">(3) 30,000.00</text>
  <text x="895" y="168" text-anchor="middle" font-size="12" font-weight="bold">Balance 30,000.00 debit</text>
  <rect x="14" y="200" width="238" height="160" rx="10" fill="#ff6ec4" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="133" y="222" text-anchor="middle" font-size="13" font-weight="bold">Input tax</text>
  <line x1="24" y1="232" x2="242" y2="232" stroke="currentColor" stroke-width="1.5"/>
  <line x1="133" y1="232" x2="133" y2="326" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="248" text-anchor="end" font-size="11">Debit</text>
  <text x="141" y="248" text-anchor="start" font-size="11">Credit</text>
  <text x="125" y="268" text-anchor="end" font-size="12">(2) 1,900.00</text>
  <text x="125" y="286" text-anchor="end" font-size="12">(3) 5,700.00</text>
  <text x="141" y="268" text-anchor="start" font-size="12">(4) 1,900.00</text>
  <text x="133" y="348" text-anchor="middle" font-size="12" font-weight="bold">Balance 5,700.00 debit</text>
  <rect x="268" y="200" width="238" height="160" rx="10" fill="#4fa3c8" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="387" y="222" text-anchor="middle" font-size="13" font-weight="bold">Input tax clearing</text>
  <line x1="278" y1="232" x2="496" y2="232" stroke="currentColor" stroke-width="1.5"/>
  <line x1="387" y1="232" x2="387" y2="326" stroke="currentColor" stroke-width="1.5"/>
  <text x="379" y="248" text-anchor="end" font-size="11">Debit</text>
  <text x="395" y="248" text-anchor="start" font-size="11">Credit</text>
  <text x="379" y="268" text-anchor="end" font-size="12">(4) 1,900.00</text>
  <text x="395" y="268" text-anchor="start" font-size="12">(2) 1,900.00</text>
  <text x="387" y="348" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="522" y="200" width="492" height="160" rx="10" fill="#7873f5" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="768" y="239" text-anchor="middle" font-size="13" font-weight="bold">The five steps</text>
  <text x="768" y="257" text-anchor="middle" font-size="11">(1) down payment request: noted item, no posting to the balances</text>
  <text x="768" y="275" text-anchor="middle" font-size="11">(2) down payment paid, gross display with 19 percent tax</text>
  <text x="768" y="293" text-anchor="middle" font-size="11">(3) final invoice, 30,000.00 net plus 5,700.00 tax</text>
  <text x="768" y="311" text-anchor="middle" font-size="11">(4) transfer posting of the down payment, tax corrected</text>
  <text x="768" y="329" text-anchor="middle" font-size="11">(5) payment of the balance, 35,700.00 - 11,900.00</text>
  <text x="540" y="392" text-anchor="middle" font-size="11">Each posting balances: step 2 11,900.00 + 1,900.00 = 11,900.00 + 1,900.00; step 3 30,000.00 + 5,700.00 = 35,700.00; step 4 11,900.00 + 1,900.00 = 11,900.00 + 1,900.00; step 5 23,800.00.</text>
  <text x="540" y="420" text-anchor="middle" font-size="12">All amounts and the tax rate are made up. Each line is written to ledgers 0L and 2L of company code EX01.</text>
</svg>
