<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tex-mipchain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A mip chain halves each side down to 1 by 1</text>
<rect x="30" y="40" width="160" height="160" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="110.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 0</text>
<text x="110.0" y="238" text-anchor="middle" font-size="11" fill="#374151">256x256</text>
<rect x="204" y="120" width="80" height="80" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="244.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 1</text>
<text x="244.0" y="238" text-anchor="middle" font-size="11" fill="#374151">128x128</text>
<rect x="298" y="160" width="40" height="40" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="336.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 2</text>
<text x="336.0" y="238" text-anchor="middle" font-size="11" fill="#374151">64x64</text>
<rect x="388" y="180" width="20" height="20" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="426.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 3</text>
<text x="426.0" y="238" text-anchor="middle" font-size="11" fill="#374151">32x32</text>
<rect x="478" y="190" width="10" height="10" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="516.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 4</text>
<text x="516.0" y="238" text-anchor="middle" font-size="11" fill="#374151">16x16</text>
<rect x="568" y="190" width="10" height="10" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="606.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 5</text>
<text x="606.0" y="238" text-anchor="middle" font-size="11" fill="#374151">8x8</text>
<rect x="658" y="194" width="6" height="6" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="696.0" y="222" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">level 6</text>
<text x="696.0" y="238" text-anchor="middle" font-size="11" fill="#374151">4x4</text>
<text x="380" y="275" text-anchor="middle" font-size="12" fill="#374151">Level n has size max(1, floor(w / 2^n)) by max(1, floor(h / 2^n)); the count is floor(log2(max(w, h))) + 1.</text>
<text x="380" y="297" text-anchor="middle" font-size="12" fill="#374151">All levels together cost about one third more memory than level 0 alone (1 + 1/4 + 1/16 + ... = 4/3).</text>
<text x="380" y="319" text-anchor="middle" font-size="11" fill="#6B7280">Drawn here at reduced scale: level 0 is 160 px, each level is half the previous one.</text>
</svg>
