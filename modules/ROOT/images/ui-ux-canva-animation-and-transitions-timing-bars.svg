<rect x="210.0" y="150" width="120.0" height="22" rx="5" fill="#4F46E5"/>
<text x="270.0" y="165" font-size="11" fill="#FFFFFF" text-anchor="middle">1.2 s</text>
<text x="50" y="196" font-size="12" fill="#374151" text-anchor="start">Title</text>
<rect x="270.0" y="180" width="120.0" height="22" rx="5" fill="#4F46E5"/>
<text x="330.0" y="195" font-size="11" fill="#FFFFFF" text-anchor="middle">1.2 s</text>
<text x="50" y="226" font-size="12" fill="#374151" text-anchor="start">Tagline</text>
<rect x="350.0" y="210" width="120.0" height="22" rx="5" fill="#4F46E5"/>
<text x="410.0" y="225" font-size="11" fill="#FFFFFF" text-anchor="middle">1.2 s</text>
