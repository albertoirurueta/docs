<text x="416" y="288" font-size="12" fill="#374151" text-anchor="start">Drag a handle to change duration</text>
<text x="380" y="330" font-size="12" fill="#374151" text-anchor="middle">Order of the tiles sets the order of appearance; the longest animation allowed is 10 seconds.</text>
  <text x="380" y="352" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
