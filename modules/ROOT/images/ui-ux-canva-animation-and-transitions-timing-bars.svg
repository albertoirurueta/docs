<circle cx="60" cy="284" r="11" fill="#4F46E5"/><text x="60" y="288" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="76" y="288" font-size="12" fill="#374151" text-anchor="start">Drag a bar sideways to start it earlier or later</text>
