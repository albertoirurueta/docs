<line x1="190" y1="92" x2="190" y2="260" stroke="#D1D5DB"/><text x="190" y="106" font-size="11" fill="#6B7280" text-anchor="middle">0 s</text>
<line x1="290" y1="92" x2="290" y2="260" stroke="#D1D5DB"/><text x="290" y="106" font-size="11" fill="#6B7280" text-anchor="middle">1 s</text>
<line x1="390" y1="92" x2="390" y2="260" stroke="#D1D5DB"/><text x="390" y="106" font-size="11" fill="#6B7280" text-anchor="middle">2 s</text>
<line x1="490" y1="92" x2="490" y2="260" stroke="#D1D5DB"/><text x="490" y="106" font-size="11" fill="#6B7280" text-anchor="middle">3 s</text>
<line x1="590" y1="92" x2="590" y2="260" stroke="#D1D5DB"/><text x="590" y="106" font-size="11" fill="#6B7280" text-anchor="middle">4 s</text>
<line x1="690" y1="92" x2="690" y2="260" stroke="#D1D5DB"/><text x="690" y="106" font-size="11" fill="#6B7280" text-anchor="middle">5 s</text>
