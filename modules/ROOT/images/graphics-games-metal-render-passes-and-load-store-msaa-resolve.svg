<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-passes-and-load-store-msaa-resolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">4x MSAA: sample, shade, resolve</text>
<text x="130" y="62" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">1. Rasterise</text>
<rect x="50" y="80" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="50" y="140" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="50" y="200" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="110" y="80" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="110" y="140" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="110" y="200" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="170" y="80" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="170" y="140" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="170" y="200" width="60" height="60" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<polygon points="50,260 230,80 230,260" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="128" cy="152" r="3.5" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<circle cx="152" cy="158" r="3.5" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<circle cx="124" cy="180" r="3.5" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<circle cx="148" cy="186" r="3.5" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="140" y="214" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">covered samples</text>
<text x="380" y="62" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">2. Shade and store samples</text>
<rect x="300" y="90" width="160" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="113.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Tile memory</text>
<text x="380.0" y="128.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">colour x4 per pixel</text>
<text x="380" y="164" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one fragment run per pixel</text>
<text x="380" y="180" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and triangle, not per sample</text>
<line x1="230" y1="170" x2="300" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-passes-and-load-store-msaa-resolve)"/>
<text x="630" y="62" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">3. Resolve</text>
<rect x="560" y="90" width="160" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="113.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">resolveTexture</text>
<text x="640.0" y="128.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">1 sample per pixel</text>
<line x1="460" y1="117" x2="560" y2="117" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-passes-and-load-store-msaa-resolve)"/>
<text x="510" y="108" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">average</text>
<rect x="240" y="200" width="480" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="480.0" y="237.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Configuration</text>
<text x="480.0" y="251.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colour: type2DMultisample, sampleCount 4, usage renderTarget</text>
<text x="480.0" y="265.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attachment.texture = msaa; attachment.resolveTexture = single</text>
<text x="480.0" y="279.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">storeAction = multisampleResolve (or storeAndMultisampleResolve)</text>
<text x="380" y="335" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pipeline rasterSampleCount must equal the texture sampleCount, or API validation reports an error.</text>
</svg>
