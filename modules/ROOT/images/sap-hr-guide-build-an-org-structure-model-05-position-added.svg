<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 171" width="1080" height="171" role="img" aria-labelledby="sap-hr-guide-build-an-org-structure-model-05-position-added-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-build-an-org-structure-model-05-position-added-title">Terminal with two curl commands: the first posts the new position 51000004 and is answered with HTTP/1.1 201 Created (callout 9), the second posts the relationship A003 from that position to Sales and is answered with HTTP/1.1 201 Created and an sap-messages header that says relationship A003 was stored with its inverse B003 (callout 10)</title>
<g><rect x="0" y="0" width="1080" height="171" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="139" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i --json @http/position.json http://localhost:4004/odata/v4/org/Objects | grep -E &quot;^(HTTP|sap-messages)&quot;</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP/1.1 201 Created</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i --json @http/sales.json http://localhost:4004/odata/v4/org/Relationships | grep -E &quot;^(HTTP|sap-messages)&quot;</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP/1.1 201 Created</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">sap-messages: [{&quot;code&quot;:&quot;&quot;,&quot;message&quot;:&quot;Relationship A003 was stored with its inverse B003&quot;,&quot;numericSeverity&quot;:2}]</text>
<rect x="5" y="67" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="67" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="72" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">9</text></g>
<rect x="5" y="109" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="109" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="114" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g></g>
</svg>
