<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Multi-stage Docker build with cargo-chef</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">dependencies are compiled in their own layer, rebuilt only when Cargo.toml or Cargo.lock change</text>

  <!-- stage boxes -->
  <g font-size="12">
    <rect x="20" y="80" width="200" height="190" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
    <text x="120" y="104" text-anchor="middle" font-weight="bold" fill="#b7410e">1. planner</text>
    <text x="120" y="122" text-anchor="middle" fill="#666666">FROM rust + cargo-chef</text>
    <text x="34" y="150" fill="#222222">COPY . .</text>
    <text x="34" y="170" fill="#222222">cargo chef prepare</text>
    <text x="34" y="200" fill="#222222">output: recipe.json</text>
    <text x="34" y="218" fill="#666666">(the dependency graph,</text>
    <text x="34" y="234" fill="#666666">no application code)</text>

    <rect x="250" y="80" width="200" height="190" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
    <text x="350" y="104" text-anchor="middle" font-weight="bold" fill="#b7410e">2. cook dependencies</text>
    <text x="350" y="122" text-anchor="middle" fill="#666666">FROM rust + cargo-chef</text>
    <text x="264" y="150" fill="#222222">COPY recipe.json</text>
    <text x="264" y="170" fill="#222222">cargo chef cook --release</text>
    <text x="264" y="200" fill="#222222">output: compiled crates</text>
    <text x="264" y="218" fill="#666666">(cached layer: reused while</text>
    <text x="264" y="234" fill="#666666">recipe.json is unchanged)</text>

    <rect x="480" y="80" width="200" height="190" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.5"/>
    <text x="580" y="104" text-anchor="middle" font-weight="bold" fill="#b7410e">3. build application</text>
    <text x="580" y="122" text-anchor="middle" fill="#666666">same stage, next layers</text>
    <text x="494" y="150" fill="#222222">COPY . .</text>
    <text x="494" y="170" fill="#222222">cargo build --release</text>
    <text x="494" y="200" fill="#222222">output: one binary</text>
    <text x="494" y="218" fill="#666666">(only the workspace crates</text>
    <text x="494" y="234" fill="#666666">recompile on a code change)</text>

    <rect x="710" y="80" width="210" height="190" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="815" y="104" text-anchor="middle" font-weight="bold" fill="#2e7d32">4. runtime</text>
    <text x="815" y="122" text-anchor="middle" fill="#666666">FROM distroless/cc (nonroot)</text>
    <text x="724" y="150" fill="#222222">COPY --from=builder binary</text>
    <text x="724" y="170" fill="#222222">USER nonroot, EXPOSE 3000</text>
    <text x="724" y="200" fill="#222222">no shell, no compiler,</text>
    <text x="724" y="218" fill="#222222">no source, no secrets</text>
    <text x="724" y="246" fill="#666666">tens of MB instead of GBs</text>
  </g>

  <g stroke="#444444" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="220" y1="175" x2="248" y2="175"/>
    <line x1="450" y1="175" x2="478" y2="175"/>
    <line x1="680" y1="175" x2="708" y2="175"/>
  </g>

  <!-- legend -->
  <rect x="20" y="300" width="900" height="80" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
  <g font-size="12" fill="#222222">
    <text x="36" y="324">Only stage 4 is shipped. Stages 1-3 live in the build cache (or a BuildKit cache mount / registry cache in CI).</text>
    <text x="36" y="346">A code change re-runs the quick prepare step and stage 3; only a dependency change re-runs stage 2. Secrets are</text>
    <text x="36" y="368">injected at runtime, never copied into any stage: every layer of a pushed image is readable by whoever can pull it.</text>
  </g>
</svg>
