<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah3-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Image-based lighting: three precomputed inputs</text>
<rect x="20" y="50" width="150" height="130" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95" y="74" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">HDR environment</text>
<text x="95" y="96" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">equirectangular .hdr</text>
<rect x="40" y="108" width="110" height="56" rx="6" fill="#BFDBFE" stroke="#4B5563"/><rect x="40" y="136" width="110" height="28" rx="6" fill="#D6C7A8" stroke="#4B5563"/>
<line x1="170" y1="115" x2="250" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<line x1="170" y1="115" x2="250" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<line x1="170" y1="115" x2="250" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<text x="210" y="100" font-size="9" font-weight="normal" fill="#374151" text-anchor="middle">to cubemap</text>
<rect x="250" y="50" width="250" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="375" y="72" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Irradiance cubemap</text>
<text x="375" y="92" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">32x32 per face, cosine convolution</text>
<text x="375" y="110" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">diffuse ambient: texture(uIrradiance, N)</text>
<line x1="500" y1="88" x2="550" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<rect x="250" y="150" width="250" height="76" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="375" y="172" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Prefiltered specular cubemap</text>
<text x="375" y="192" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">mip chain, mip level = roughness</text>
<text x="375" y="210" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">specular: textureLod(uPrefilter, R, rough*maxMip)</text>
<line x1="500" y1="188" x2="550" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<rect x="250" y="250" width="250" height="76" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="375" y="272" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">BRDF lookup table</text>
<text x="375" y="292" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">2D texture, (N.V, roughness) -&gt; (scale, bias)</text>
<text x="375" y="310" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">F0 * scale + bias</text>
<line x1="500" y1="288" x2="550" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<rect x="550" y="100" width="190" height="160" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="645" y="126" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Fragment shader</text>
<text x="645" y="152" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">kD * irradiance * albedo</text>
<text x="645" y="176" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">+ prefiltered * (F*scale+bias)</text>
<text x="645" y="200" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">* ambient occlusion</text>
<text x="645" y="224" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">+ direct lights</text>
<text x="380" y="344" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The three inputs are built once at load time (or offline); the per-pixel cost is three texture reads.</text>
</svg>
