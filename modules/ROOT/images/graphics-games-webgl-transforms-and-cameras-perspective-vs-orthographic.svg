<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-transforms-and-cameras-perspective-vs-orthographic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Perspective and orthographic projection</text>
<rect x="20" y="50" width="350" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195" y="72" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Perspective: mat4.perspective</text>
<rect x="390" y="50" width="350" height="250" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="565" y="72" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Orthographic: mat4.ortho</text>
<polygon points="45,190 345,125 345,255" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="150" y="163" width="18" height="54" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<rect x="260" y="178" width="10" height="28" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="158" y="230" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">A</text>
<text x="268" y="230" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">B</text>
<text x="195" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A and B are equal in size: B, farther away, looks smaller</text>
<text x="45" y="206" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">eye</text>
<polygon points="410,130 710,130 710,250 410,250" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<rect x="500" y="163" width="18" height="54" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="610" y="163" width="18" height="54" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="508" y="230" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">A</text>
<text x="618" y="230" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">B</text>
<text x="565" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">parallel rays: A and B keep their size</text>
<text x="565" y="118" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">left/right/bottom/top/near/far</text>
<text x="195" y="118" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">fovy, aspect, near, far</text>
</svg>
