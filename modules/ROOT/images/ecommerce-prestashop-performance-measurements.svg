<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Measured effect of PrestaShop performance settings on the warm home page</title>
  <desc id="d">Horizontal bars with the median response time in milliseconds of the Hummingbird home page of the Pocket Coffee test shop on a production-mode container, for the baseline and six variations, with the range of the three rounds as a thin line. Baseline 76 ms, Smarty cache off 81, forced Smarty compilation 133, OPcache disabled 202, validate_timestamps off 59, SQL cache in APCu 39, and the dev-mode container 63. The Admin API product list answered in about 25 ms in production mode and about 105 to 130 ms in dev mode.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Warm home page, median of 20 to 25 requests per round, three rounds (ms, lower is better)</text>
  <line x1="360.0" y1="56" x2="360.0" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="360.0" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">0</text>
  <line x1="461.9" y1="56" x2="461.9" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="461.9" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">50</text>
  <line x1="563.8" y1="56" x2="563.8" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="563.8" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">100</text>
  <line x1="665.8" y1="56" x2="665.8" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="665.8" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">150</text>
  <line x1="767.7" y1="56" x2="767.7" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="767.7" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">200</text>
  <line x1="869.6" y1="56" x2="869.6" y2="370" stroke="#f2f5f8" stroke-opacity="0.25"/>
  <text x="869.6" y="388" font-size="12" fill="#f2f5f8" text-anchor="middle">250</text>
  <text x="348" y="80" font-size="13" fill="#f2f5f8" text-anchor="end">Baseline: prod mode, OPcache, Smarty cache, CCC</text>
  <rect x="360" y="64" width="154.9" height="22" rx="3" fill="#7fb3d5"/>
  <line x1="498.6" y1="75" x2="598.5" y2="75" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="498.6" y1="69" x2="498.6" y2="81" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="598.5" y1="69" x2="598.5" y2="81" stroke="#f2f5f8" stroke-width="2"/>
  <text x="606.5" y="80" font-size="13" font-weight="bold" fill="#f2f5f8">76</text>
  <text x="348" y="124" font-size="13" fill="#f2f5f8" text-anchor="end">Smarty cache off</text>
  <rect x="360" y="108" width="165.1" height="22" rx="3" fill="#7fb3d5"/>
  <line x1="492.5" y1="119" x2="563.8" y2="119" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="492.5" y1="113" x2="492.5" y2="125" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="563.8" y1="113" x2="563.8" y2="125" stroke="#f2f5f8" stroke-width="2"/>
  <text x="571.8" y="124" font-size="13" font-weight="bold" fill="#f2f5f8">81</text>
  <text x="348" y="168" font-size="13" fill="#f2f5f8" text-anchor="end">Smarty compilation forced on every request</text>
  <rect x="360" y="152" width="271.1" height="22" rx="3" fill="#e59866"/>
  <line x1="557.7" y1="163" x2="663.7" y2="163" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="557.7" y1="157" x2="557.7" y2="169" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="663.7" y1="157" x2="663.7" y2="169" stroke="#f2f5f8" stroke-width="2"/>
  <text x="671.7" y="168" font-size="13" font-weight="bold" fill="#f2f5f8">133</text>
  <text x="348" y="212" font-size="13" fill="#f2f5f8" text-anchor="end">OPcache disabled</text>
  <rect x="360" y="196" width="411.8" height="22" rx="3" fill="#e59866"/>
  <line x1="749.3" y1="207" x2="863.5" y2="207" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="749.3" y1="201" x2="749.3" y2="213" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="863.5" y1="201" x2="863.5" y2="213" stroke="#f2f5f8" stroke-width="2"/>
  <text x="871.5" y="212" font-size="13" font-weight="bold" fill="#f2f5f8">202</text>
  <text x="348" y="256" font-size="13" fill="#f2f5f8" text-anchor="end">OPcache validate_timestamps=0</text>
  <rect x="360" y="240" width="120.3" height="22" rx="3" fill="#7fb3d5"/>
  <line x1="480.3" y1="251" x2="561.8" y2="251" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="480.3" y1="245" x2="480.3" y2="257" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="561.8" y1="245" x2="561.8" y2="257" stroke="#f2f5f8" stroke-width="2"/>
  <text x="569.8" y="256" font-size="13" font-weight="bold" fill="#f2f5f8">59</text>
  <text x="348" y="300" font-size="13" fill="#f2f5f8" text-anchor="end">SQL cache with APCu (Cache > Use cache)</text>
  <rect x="360" y="284" width="79.5" height="22" rx="3" fill="#82c99a"/>
  <line x1="435.4" y1="295" x2="461.9" y2="295" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="435.4" y1="289" x2="435.4" y2="301" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="461.9" y1="289" x2="461.9" y2="301" stroke="#f2f5f8" stroke-width="2"/>
  <text x="469.9" y="300" font-size="13" font-weight="bold" fill="#f2f5f8">39</text>
  <text x="348" y="344" font-size="13" fill="#f2f5f8" text-anchor="end">Dev-mode container (reference, same code)</text>
  <rect x="360" y="328" width="128.4" height="22" rx="3" fill="#b0b8c1"/>
  <line x1="482.3" y1="339" x2="572.0" y2="339" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="482.3" y1="333" x2="482.3" y2="345" stroke="#f2f5f8" stroke-width="2"/>
  <line x1="572.0" y1="333" x2="572.0" y2="345" stroke="#f2f5f8" stroke-width="2"/>
  <text x="580.0" y="344" font-size="13" font-weight="bold" fill="#f2f5f8">63</text>
  <rect x="40" y="418" width="880" height="62" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="54" y="440" font-size="13.5" font-weight="bold" fill="#f4b860">Where the debug mode matters: the Symfony kernels</text>
  <text x="54" y="462" font-size="12.5" fill="#f2f5f8">GET /admin-api/products?limit=20: about 105 to 130 ms in dev mode, about 25 ms in production mode. The front office barely changed.</text>
</svg>
