<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
<title id="t">Keras packages and backends</title>
<desc id="d">The standalone keras package (Keras 3) runs on the TensorFlow, JAX or PyTorch backend chosen by KERAS_BACKEND. In TensorFlow 2.16 and later tf.keras points to Keras 3, and setting TF_USE_LEGACY_KERAS=1 with the tf_keras package makes tf.keras point to Keras 2 instead.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Which Keras do you get?</text>
<rect x="40" y="60" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="135" y="86" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">import keras</text>
<text x="135" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">standalone package</text>
<rect x="40" y="150" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="135" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">tf.keras</text>
<text x="135" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">TensorFlow 2.16 and later</text>
<rect x="40" y="250" width="190" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="135" y="276" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">import tf_keras</text>
<text x="135" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Keras 2.15, maintenance</text>
<rect x="290" y="100" width="170" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="375" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Keras 3</text>
<text x="375" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">multi-backend</text>
<rect x="290" y="250" width="170" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="375" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Keras 2</text>
<text x="375" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">TensorFlow only</text>
<rect x="540" y="60" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="615" y="87" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">tensorflow</text>
<rect x="540" y="118" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="615" y="145" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">jax</text>
<rect x="540" y="176" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="615" y="203" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">torch</text>
<text x="615" y="240" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#475569">KERAS_BACKEND</text>
<line x1="230" y1="90" x2="288" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="170" x2="288" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="190" x2="288" y2="268" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="230" y1="280" x2="288" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="120" x2="538" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="135" x2="538" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="150" x2="538" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="262" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#B45309">TF_USE_LEGACY_KERAS=1</text>
</svg>
