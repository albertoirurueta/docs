<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity="1"/><stop offset="1" stop-color="#B45309" stop-opacity="1"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity="1"/><stop offset="0.25" stop-color="#EEF2FF" stop-opacity="1"/><stop offset="0.5" stop-color="#FEF3C7" stop-opacity="1"/><stop offset="0.75" stop-color="#B45309" stop-opacity="1"/><stop offset="1" stop-color="#1F2937" stop-opacity="1"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity="1"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></linearGradient><radialGradient id="g2" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#FEF3C7"/><stop offset="1" stop-color="#4F46E5"/></radialGradient><pattern id="chk" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFFFFF"/><rect width="6" height="6" fill="#E5E7EB"/><rect x="6" y="6" width="6" height="6" fill="#E5E7EB"/></pattern></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a gradient: colour stops and the styles built on them</text>
<rect x="60" y="56" width="640" height="104" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80" y="78" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Gradient colours (up to 10 stops)</text>
<rect x="90" y="92" width="580" height="26" rx="4" fill="url(#g3)" stroke="#9CA3AF"/>
<path d="M90,120 L83,132 L97,132 Z" fill="#4F46E5" stroke="#374151"/>
<path d="M235,120 L228,132 L242,132 Z" fill="#EEF2FF" stroke="#374151"/>
<path d="M380,120 L373,132 L387,132 Z" fill="#FEF3C7" stroke="#374151"/>
<path d="M525,120 L518,132 L532,132 Z" fill="#B45309" stroke="#374151"/>
<path d="M670,120 L663,132 L677,132 Z" fill="#1F2937" stroke="#374151"/>
<text x="380" y="152" font-size="12" fill="#374151" text-anchor="middle">Select a stop to change its colour or transparency; drag stops to rearrange them; Delete removes one</text>
<rect x="40" y="196" width="104" height="104" rx="8" fill="url(#g1)" stroke="#9CA3AF"/>
<text x="92" y="320" font-size="12" fill="#374151" text-anchor="middle">Two colours, one direction</text>
<rect x="232" y="196" width="104" height="104" rx="8" fill="url(#g2)" stroke="#9CA3AF"/>
<text x="284" y="320" font-size="12" fill="#374151" text-anchor="middle">Many stops or a centred blend</text>
<rect x="424" y="196" width="104" height="104" rx="8" fill="url(#g3)" stroke="#9CA3AF"/>
<text x="476" y="320" font-size="12" fill="#374151" text-anchor="middle">Five stops, a long blend</text>
<rect x="616" y="196" width="104" height="104" rx="8" fill="url(#chk)" stroke="#9CA3AF"/>
<rect x="616" y="196" width="104" height="104" rx="8" fill="url(#g4)" stroke="#9CA3AF"/>
<text x="668" y="320" font-size="12" fill="#374151" text-anchor="middle">Fade to transparent</text>
<text x="380" y="338" font-size="12" fill="#92400E" text-anchor="middle">Presets live under Styles; the same stops give different looks in different styles</text>
<text x="380" y="356" font-size="12" fill="#92400E" text-anchor="middle">Same base colour on the transparent stop keeps the fade clean</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
