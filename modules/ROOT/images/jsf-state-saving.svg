<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Server state saving, client state saving and stateless views in Jakarta Faces</title>
  <desc id="d">Three panels. With server state saving the browser holds only a short token in the hidden field jakarta.faces.ViewState and the server keeps the serialised view in the HTTP session, limited to a number of views, so evicted views and ended sessions cause a ViewExpiredException. With client state saving the whole view state is serialised, compressed, encrypted and authenticated by a message authentication code with a key taken from the environment or JNDI, sent to the browser in the hidden field, and the server keeps nothing; a state that fails decryption or authentication is rejected. With a stateless view the hidden field contains the word stateless and nothing is saved anywhere, so the component tree is rebuilt from the page on every request.</desc>
  <defs>
    <marker id="ar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a4f8b"/></marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a12622"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where the view state lives</text>
  <text x="500" y="48" font-size="12" fill="#666666" text-anchor="middle">The same page, saved three ways. The hidden field jakarta.faces.ViewState is what the browser sends back on a postback.</text>

  <!-- ===== Panel 1: server state ===== -->
  <rect x="20" y="64" width="470" height="344" rx="8" fill="#f7f9fc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="255" y="88" font-size="14" font-weight="bold" fill="#1a4f8b" text-anchor="middle">Server state saving (the default)</text>
  <text x="255" y="104" font-size="11" fill="#555555" text-anchor="middle">jakarta.faces.STATE_SAVING_METHOD = server</text>

  <rect x="40" y="124" width="170" height="128" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="125" y="144" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <rect x="52" y="156" width="146" height="40" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="125" y="172" font-size="10" fill="#333333" text-anchor="middle">jakarta.faces.ViewState</text>
  <text x="125" y="186" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">-3878..:6638..</text>
  <text x="125" y="216" font-size="10" fill="#444444" text-anchor="middle">a token of a few dozen bytes</text>
  <text x="125" y="230" font-size="10" fill="#444444" text-anchor="middle">that points at the view</text>
  <text x="125" y="244" font-size="10" fill="#444444" text-anchor="middle">(no state travels)</text>

  <rect x="290" y="124" width="180" height="128" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="380" y="144" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Server: HTTP session</text>
  <rect x="302" y="156" width="156" height="22" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="380" y="171" font-size="10" fill="#333333" text-anchor="middle">view A: state 1, state 2, ...</text>
  <rect x="302" y="182" width="156" height="22" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="380" y="197" font-size="10" fill="#333333" text-anchor="middle">view B: state 1, ...</text>
  <rect x="302" y="208" width="156" height="22" rx="3" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="380" y="223" font-size="10" fill="#555555" text-anchor="middle">oldest views are evicted</text>
  <text x="380" y="245" font-size="10" fill="#444444" text-anchor="middle">bounded per session</text>

  <line x1="212" y1="150" x2="288" y2="150" stroke="#1a4f8b" stroke-width="1.6" marker-end="url(#ar-b)"/>
  <text x="250" y="142" font-size="10" fill="#1a4f8b" text-anchor="middle">postback</text>
  <line x1="288" y1="230" x2="212" y2="230" stroke="#333333" stroke-width="1.6" marker-end="url(#ar-k)"/>
  <text x="250" y="246" font-size="10" fill="#333333" text-anchor="middle">render: token</text>

  <text x="40" y="282" font-size="11" font-weight="bold" fill="#222222">Costs and limits</text>
  <text x="40" y="299" font-size="11" fill="#333333">+ small responses, nothing sensitive reaches the browser</text>
  <text x="40" y="315" font-size="11" fill="#333333">+ fast: no serialisation unless jakarta.faces.SERIALIZE_SERVER_STATE</text>
  <text x="40" y="331" font-size="11" fill="#333333">- session memory grows with open views and tabs</text>
  <text x="40" y="347" font-size="11" fill="#333333">- clustering needs sticky sessions or session replication</text>
  <rect x="40" y="358" width="430" height="38" rx="4" fill="#fdecea" stroke="#a12622"/>
  <text x="255" y="374" font-size="11" fill="#a12622" text-anchor="middle" font-weight="bold">ViewExpiredException in Restore View when</text>
  <text x="255" y="389" font-size="11" fill="#a12622" text-anchor="middle">the session ended or the view was evicted from the session</text>

  <!-- ===== Panel 2: client state ===== -->
  <rect x="510" y="64" width="470" height="344" rx="8" fill="#fbf8f2" stroke="#b4530a" stroke-width="1.4"/>
  <text x="745" y="88" font-size="14" font-weight="bold" fill="#b4530a" text-anchor="middle">Client state saving</text>
  <text x="745" y="104" font-size="11" fill="#555555" text-anchor="middle">jakarta.faces.STATE_SAVING_METHOD = client</text>

  <rect x="530" y="124" width="190" height="128" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="625" y="144" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <rect x="542" y="156" width="166" height="40" rx="4" fill="#ffffff" stroke="#1a4f8b"/>
  <text x="625" y="172" font-size="10" fill="#333333" text-anchor="middle">jakarta.faces.ViewState</text>
  <text x="625" y="186" font-size="10" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">I0phbttbxIQf6OVx...</text>
  <text x="625" y="216" font-size="10" fill="#444444" text-anchor="middle">the whole state, about 1 KB</text>
  <text x="625" y="230" font-size="10" fill="#444444" text-anchor="middle">for a tiny form and growing</text>
  <text x="625" y="244" font-size="10" fill="#444444" text-anchor="middle">with the page</text>

  <rect x="780" y="124" width="180" height="128" rx="6" fill="#fff4e5" stroke="#b4530a" stroke-width="1.4"/>
  <text x="870" y="144" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Server: no view state</text>
  <rect x="792" y="156" width="156" height="22" rx="3" fill="#ffffff" stroke="#b4530a"/>
  <text x="870" y="171" font-size="10" fill="#333333" text-anchor="middle">serialise + compress</text>
  <rect x="792" y="182" width="156" height="22" rx="3" fill="#ffffff" stroke="#b4530a"/>
  <text x="870" y="197" font-size="10" fill="#333333" text-anchor="middle">encrypt + MAC (secret key)</text>
  <rect x="792" y="208" width="156" height="22" rx="3" fill="#ffffff" stroke="#b4530a" stroke-dasharray="4 3"/>
  <text x="870" y="223" font-size="10" fill="#555555" text-anchor="middle">key from environment / JNDI</text>
  <text x="870" y="245" font-size="10" fill="#444444" text-anchor="middle">same key on every node</text>

  <line x1="722" y1="150" x2="778" y2="150" stroke="#1a4f8b" stroke-width="1.6" marker-end="url(#ar-b)"/>
  <text x="750" y="142" font-size="10" fill="#1a4f8b" text-anchor="middle">postback</text>
  <line x1="778" y1="230" x2="722" y2="230" stroke="#333333" stroke-width="1.6" marker-end="url(#ar-k)"/>
  <text x="750" y="246" font-size="10" fill="#333333" text-anchor="middle">render</text>

  <text x="530" y="282" font-size="11" font-weight="bold" fill="#222222">Costs and limits</text>
  <text x="530" y="299" font-size="11" fill="#333333">+ no session memory, survives session timeout and failover</text>
  <text x="530" y="315" font-size="11" fill="#333333">+ any node can restore the view if the key is shared</text>
  <text x="530" y="331" font-size="11" fill="#333333">- bigger pages and requests, CPU for crypto on every request</text>
  <text x="530" y="347" font-size="11" fill="#333333">- never unencrypted: a forged state is attacker-controlled input</text>
  <rect x="530" y="358" width="430" height="38" rx="4" fill="#fdecea" stroke="#a12622"/>
  <text x="745" y="374" font-size="11" fill="#a12622" text-anchor="middle" font-weight="bold">A state that fails decryption or the MAC is rejected;</text>
  <text x="745" y="389" font-size="11" fill="#a12622" text-anchor="middle">a new key (restart without a fixed key) expires every open page</text>

  <!-- ===== Panel 3: stateless ===== -->
  <rect x="20" y="424" width="960" height="196" rx="8" fill="#f6f6f6" stroke="#666666" stroke-width="1.4"/>
  <text x="500" y="448" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Stateless view: f:view transient="true"</text>
  <text x="500" y="464" font-size="11" fill="#555555" text-anchor="middle">Nothing is saved anywhere. The tree is rebuilt from the Facelets page on every request, so the page carries no state to lose, to forge or to replicate.</text>

  <rect x="44" y="484" width="190" height="64" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="139" y="504" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="139" y="520" font-size="10" fill="#333333" text-anchor="middle">jakarta.faces.ViewState</text>
  <text x="139" y="536" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222" text-anchor="middle">stateless</text>

  <rect x="330" y="484" width="190" height="64" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="425" y="504" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Restore View</text>
  <text x="425" y="520" font-size="10" fill="#333333" text-anchor="middle">build the view again</text>
  <text x="425" y="536" font-size="10" fill="#333333" text-anchor="middle">from the XHTML page</text>

  <rect x="616" y="484" width="190" height="64" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <text x="711" y="504" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Rest of the lifecycle</text>
  <text x="711" y="520" font-size="10" fill="#333333" text-anchor="middle">decode, validate, update,</text>
  <text x="711" y="536" font-size="10" fill="#333333" text-anchor="middle">invoke, render</text>

  <line x1="236" y1="516" x2="328" y2="516" stroke="#333333" stroke-width="1.6" marker-end="url(#ar-k)"/>
  <line x1="522" y1="516" x2="614" y2="516" stroke="#333333" stroke-width="1.6" marker-end="url(#ar-k)"/>

  <text x="44" y="580" font-size="11" fill="#333333">+ no session is created by the page, nothing to evict, scales out freely</text>
  <text x="44" y="596" font-size="11" fill="#333333">- values set on components in code, dynamic tree changes and view-scoped beans do not survive to the next request</text>
  <text x="44" y="612" font-size="11" fill="#333333">- fits search, listing and simple forms; avoid it for wizards, editable tables and anything that edits the tree</text>
</svg>
