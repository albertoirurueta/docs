<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-lighting-in-shaders-normal-matrix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Why normals use the inverse transpose of the model matrix</text>
<text x="190" y="66" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Before scaling</text>
<line x1="190" y1="230" x2="250" y2="170" stroke="#4F46E5" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-normal-matrix)"/>
<text x="262" y="164" font-size="12" font-weight="bold" fill="#4F46E5" text-anchor="middle">t</text>
<line x1="190" y1="230" x2="130" y2="170" stroke="#B45309" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-normal-matrix)"/>
<text x="118" y="166" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">n</text>
<text x="190" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">n . t = 0 (perpendicular)</text>
<text x="570" y="66" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">After scale x by 2</text>
<line x1="570" y1="230" x2="690" y2="170" stroke="#4F46E5" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-normal-matrix)"/>
<text x="704" y="164" font-size="12" font-weight="bold" fill="#4F46E5" text-anchor="middle">t</text>
<line x1="570" y1="230" x2="450" y2="170" stroke="#B91C1C" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-normal-matrix)"/>
<text x="442" y="162" font-size="12" font-weight="bold" fill="#B91C1C" text-anchor="middle">M n</text>
<line x1="570" y1="230" x2="540.0" y2="170" stroke="#047857" stroke-width="3" marker-end="url(#ah-webgl-lighting-in-shaders-normal-matrix)"/>
<text x="530.0" y="158" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">(M^-1)^T n</text>
<text x="570" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">red: naive M n, not perpendicular (dot = -3)</text>
<text x="570" y="305" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">green: inverse transpose, dot = 0</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">uNormalMatrix = transpose(inverse(mat3(model))); gl-matrix: mat3.normalFromMat4(out, model).</text>
</svg>
