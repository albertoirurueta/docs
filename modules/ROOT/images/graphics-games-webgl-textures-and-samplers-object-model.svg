<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-textures-and-samplers-object-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From texture unit to the sampler2D in the shader</text>
<rect x="20" y="70" width="130" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" />
<text x="85.0" y="94.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">JavaScript</text>
<text x="85.0" y="109.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">activeTexture(</text>
<text x="85.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TEXTURE0 + i)</text>
<rect x="185" y="50" width="150" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
<text x="260.0" y="79.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Texture unit i</text>
<text x="260.0" y="94.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">binding points:</text>
<text x="260.0" y="109.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TEXTURE_2D</text>
<text x="260.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TEXTURE_CUBE_MAP</text>
<text x="260.0" y="139.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TEXTURE_3D, _2D_ARRAY</text>
<rect x="415" y="40" width="145" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
<text x="487.5" y="64.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Texture object</text>
<text x="487.5" y="79.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">levels, size, format</text>
<text x="487.5" y="94.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">min/mag/wrap params</text>
<rect x="415" y="130" width="145" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" />
<text x="487.5" y="149.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Sampler object</text>
<text x="487.5" y="164.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(optional, WebGL 2)</text>
<text x="487.5" y="179.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">overrides the params</text>
<rect x="600" y="70" width="140" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5" />
<text x="670.0" y="94.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GLSL</text>
<text x="670.0" y="109.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">uniform sampler2D</text>
<text x="670.0" y="124.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">uCover = i</text>
<line x1="150" y1="105" x2="185" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-textures-and-samplers-object-model)"/>
<line x1="335" y1="75" x2="415" y2="75" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-textures-and-samplers-object-model)"/>
<line x1="335" y1="140" x2="415" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-textures-and-samplers-object-model)"/>
<line x1="560" y1="75" x2="600" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-textures-and-samplers-object-model)"/>
<line x1="560" y1="160" x2="600" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-textures-and-samplers-object-model)"/>
<text x="167" y="98" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bind</text>
<text x="375" y="66" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bindTexture</text>
<text x="375" y="182" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bindSampler</text>
<text x="380" y="230" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The shader never names a texture: it names a unit number, and the unit holds the binding.</text>
<text x="380" y="252" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">If a sampler object is bound to the unit, its parameters win over the texture own parameters.</text>
<text x="380" y="274" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Texture parameters live in the texture; sampler parameters live in the sampler.</text>
<text x="380" y="304" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Immutable storage (texStorage2D) fixes size, format and level count; contents stay updatable.</text>
</svg>
