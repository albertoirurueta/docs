<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">One WordPress server with a bundled database compared with a tiered cloud architecture</title>
  <desc id="d">Left panel: one server runs the web server, PHP-FPM, WordPress code, plugins, uploads, a bundled MariaDB database, the cache and cron on a single disk. If the server or its disk is lost, the site is lost and must be restored from a backup. Right panel: visitors reach a CDN and a load balancer spread over two Availability Zones. Stateless WordPress pods, each running nginx and PHP-FPM from the same container image, run in both zones. They use a managed database with a standby in the second zone, a managed Valkey cache, an object store with a CDN path for media, optionally a shared file system, and a secret store. One scheduled job runs WordPress cron. Code and configuration come from the image and the secret store, so any pod can be replaced.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#2b3a4a"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="300" height="520" rx="10" fill="#33485c"/>
  <text x="36" y="48" font-size="16" font-weight="bold" fill="#f4b860">One server, bundled database</text>
  <text x="36" y="68" font-size="12" fill="#f2f5f8">Everything on one machine and one disk</text>

  <rect x="36" y="86" width="268" height="40" rx="8" fill="#3d5266"/>
  <text x="48" y="111" font-size="12" font-weight="bold" fill="#f2f5f8">Visitors, editors, bots</text>
  <line x1="170" y1="126" x2="170" y2="146" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="36" y="150" width="268" height="300" rx="10" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
  <text x="48" y="172" font-size="12" font-weight="bold" fill="#f4b860">Virtual machine or shared host</text>
  <rect x="50" y="184" width="240" height="38" rx="8" fill="#6f8aa3"/>
  <text x="62" y="208" font-size="12" fill="#f2f5f8">nginx or Apache + PHP-FPM</text>
  <rect x="50" y="230" width="240" height="38" rx="8" fill="#6f8aa3"/>
  <text x="62" y="254" font-size="12" fill="#f2f5f8">Code: core, plugins, themes</text>
  <rect x="50" y="276" width="240" height="38" rx="8" fill="#6f8aa3"/>
  <text x="62" y="300" font-size="12" fill="#f2f5f8">wp-content/uploads on local disk</text>
  <rect x="50" y="322" width="240" height="38" rx="8" fill="#7a5c3a"/>
  <text x="62" y="346" font-size="12" fill="#f2f5f8">MariaDB or MySQL on the same host</text>
  <rect x="50" y="368" width="240" height="30" rx="8" fill="#6f8aa3"/>
  <text x="62" y="388" font-size="12" fill="#f2f5f8">Page cache files, WP-Cron on visits</text>
  <rect x="50" y="406" width="240" height="30" rx="8" fill="#6f8aa3"/>
  <text x="62" y="426" font-size="12" fill="#f2f5f8">Logs and wp-config.php on disk</text>

  <text x="36" y="478" font-size="12" font-weight="bold" fill="#f4b860">Good for</text>
  <text x="36" y="496" font-size="12" fill="#f2f5f8">Most sites, one team, short outages</text>
  <text x="36" y="516" font-size="12" font-weight="bold" fill="#f4b860">Limit</text>
  <text x="36" y="534" font-size="12" fill="#f2f5f8">The host is the single point of failure</text>

  <!-- Right panel -->
  <rect x="340" y="20" width="600" height="520" rx="10" fill="#33485c"/>
  <text x="356" y="48" font-size="16" font-weight="bold" fill="#f4b860">Tiered: stateless pods, managed services</text>
  <text x="356" y="68" font-size="12" fill="#f2f5f8">State moves out of the pods into services that are replicated for you</text>

  <rect x="356" y="86" width="568" height="34" rx="8" fill="#4d7c5a"/>
  <text x="368" y="108" font-size="12" font-weight="bold" fill="#f2f5f8">DNS and CDN: www.lumenpress.example, media.lumenpress.example</text>
  <line x1="640" y1="120" x2="640" y2="136" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="356" y="138" width="568" height="34" rx="8" fill="#4d7c5a"/>
  <text x="368" y="160" font-size="12" font-weight="bold" fill="#f2f5f8">Application load balancer over two or more Availability Zones, TLS ends here</text>
  <line x1="500" y1="172" x2="500" y2="196" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="780" y1="172" x2="780" y2="196" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="356" y="198" width="276" height="150" rx="8" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="368" y="218" font-size="12" font-weight="bold" fill="#9fd3c7">Availability Zone a</text>
  <rect x="368" y="228" width="252" height="52" rx="8" fill="#6f8aa3"/>
  <text x="378" y="248" font-size="12" font-weight="bold" fill="#f2f5f8">Pod lumenpress-web</text>
  <text x="378" y="266" font-size="12" fill="#f2f5f8">nginx + php-fpm, same image</text>
  <rect x="368" y="288" width="252" height="48" rx="8" fill="#6f8aa3"/>
  <text x="378" y="308" font-size="12" font-weight="bold" fill="#f2f5f8">Pod lumenpress-web</text>
  <text x="378" y="326" font-size="12" fill="#f2f5f8">no local state</text>

  <rect x="648" y="198" width="276" height="150" rx="8" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="660" y="218" font-size="12" font-weight="bold" fill="#9fd3c7">Availability Zone b</text>
  <rect x="660" y="228" width="252" height="52" rx="8" fill="#6f8aa3"/>
  <text x="670" y="248" font-size="12" font-weight="bold" fill="#f2f5f8">Pod lumenpress-web</text>
  <text x="670" y="266" font-size="12" fill="#f2f5f8">nginx + php-fpm, same image</text>
  <rect x="660" y="288" width="252" height="48" rx="8" fill="#7a5c3a"/>
  <text x="670" y="308" font-size="12" font-weight="bold" fill="#f2f5f8">CronJob lumenpress-cron</text>
  <text x="670" y="326" font-size="12" fill="#f2f5f8">one scheduler, concurrency Forbid</text>

  <line x1="494" y1="348" x2="440" y2="384" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="348" x2="640" y2="384" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="786" y1="348" x2="840" y2="384" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="356" y="388" width="170" height="78" rx="8" fill="#c9b3e6"/>
  <text x="368" y="410" font-size="12" font-weight="bold" fill="#1b2733">Managed database</text>
  <text x="368" y="428" font-size="12" fill="#1b2733">primary + standby</text>
  <text x="368" y="444" font-size="12" fill="#1b2733">in another zone</text>
  <rect x="540" y="388" width="170" height="78" rx="8" fill="#c9b3e6"/>
  <text x="552" y="410" font-size="12" font-weight="bold" fill="#1b2733">Valkey object cache</text>
  <text x="552" y="428" font-size="12" fill="#1b2733">shared by all pods</text>
  <text x="552" y="444" font-size="12" fill="#1b2733">TLS, auth, key prefix</text>
  <rect x="724" y="388" width="200" height="78" rx="8" fill="#c9b3e6"/>
  <text x="736" y="410" font-size="12" font-weight="bold" fill="#1b2733">Object store (S3) for media</text>
  <text x="736" y="428" font-size="12" fill="#1b2733">or a shared file system</text>
  <text x="736" y="444" font-size="12" fill="#1b2733">served through the CDN</text>

  <rect x="356" y="478" width="568" height="46" rx="8" fill="#3f6e9a"/>
  <text x="368" y="498" font-size="12" font-weight="bold" fill="#f2f5f8">Secret store and image registry</text>
  <text x="368" y="515" font-size="12" fill="#f2f5f8">Keys, salts and DB credentials injected as environment; code and plugins ship inside the image</text>
</svg>
