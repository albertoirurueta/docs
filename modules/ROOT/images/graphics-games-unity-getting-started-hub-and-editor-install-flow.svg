<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gs-install" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From download to an open project</text>
<rect x="20" y="70" width="126" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="86" r="11" fill="#4F46E5"/>
<text x="36" y="90.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="83" y="112" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Install the Hub</text>
<text x="83" y="140" text-anchor="middle" font-size="11" fill="#374151">Download from unity.com</text>
<text x="83" y="155" text-anchor="middle" font-size="11" fill="#374151">Sign in with a Unity ID</text>
<line x1="146" y1="130" x2="166" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gs-install)"/>
<rect x="166" y="70" width="126" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="86" r="11" fill="#4F46E5"/>
<text x="182" y="90.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="229" y="112" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Activate a licence</text>
<text x="229" y="140" text-anchor="middle" font-size="11" fill="#374151">Personal, Pro or</text>
<text x="229" y="155" text-anchor="middle" font-size="11" fill="#374151">Enterprise seat</text>
<line x1="292" y1="130" x2="312" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gs-install)"/>
<rect x="312" y="70" width="126" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="86" r="11" fill="#4F46E5"/>
<text x="328" y="90.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="375" y="112" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Installs</text>
<text x="375" y="140" text-anchor="middle" font-size="11" fill="#374151">Install Editor:</text>
<text x="375" y="155" text-anchor="middle" font-size="11" fill="#374151">6.3 LTS (6000.3)</text>
<line x1="438" y1="130" x2="458" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gs-install)"/>
<rect x="458" y="70" width="126" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="86" r="11" fill="#4F46E5"/>
<text x="474" y="90.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="521" y="112" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Add modules</text>
<text x="521" y="140" text-anchor="middle" font-size="11" fill="#374151">Android, iOS, Web,</text>
<text x="521" y="155" text-anchor="middle" font-size="11" fill="#374151">documentation, IDE</text>
<line x1="584" y1="130" x2="604" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gs-install)"/>
<rect x="604" y="70" width="126" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="620" cy="86" r="11" fill="#4F46E5"/>
<text x="620" y="90.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="667" y="112" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Projects</text>
<text x="667" y="140" text-anchor="middle" font-size="11" fill="#374151">New project, pick a</text>
<text x="667" y="155" text-anchor="middle" font-size="11" fill="#374151">Universal 3D template</text>
<rect x="20" y="215" width="720" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="238" text-anchor="middle" font-size="11" fill="#374151">The Hub keeps several Editor versions side by side and opens each project with the version it was created in.</text>
<text x="380" y="256" text-anchor="middle" font-size="11" fill="#374151">A project is a folder on disk; the Hub only remembers where it is.</text>
</svg>
