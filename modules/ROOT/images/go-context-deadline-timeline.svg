<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Deadlines only get shorter down the tree</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a child's effective deadline is the earlier of its own request and its parent's, and a cancelled parent ends every child at once</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <!-- time axis -->
  <line x1="200" y1="370" x2="900" y2="370" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <line x1="200" y1="364" x2="200" y2="376" stroke="#555555"/><text x="200" y="392">t = 0</text>
    <line x1="360" y1="364" x2="360" y2="376" stroke="#555555"/><text x="360" y="392">100 ms</text>
    <line x1="520" y1="364" x2="520" y2="376" stroke="#555555"/><text x="520" y="392">200 ms</text>
    <line x1="680" y1="364" x2="680" y2="376" stroke="#555555"/><text x="680" y="392">300 ms</text>
    <line x1="840" y1="364" x2="840" y2="376" stroke="#555555"/><text x="840" y="392">400 ms</text>
  </g>
  <line x1="680" y1="64" x2="680" y2="364" stroke="#b3261e" stroke-dasharray="5,4"/>
  <line x1="360" y1="64" x2="360" y2="364" stroke="#2e7d32" stroke-dasharray="5,4"/>
  <!-- rows -->
  <g font-size="13" fill="#222222">
    <text x="20" y="104" font-weight="bold">parent</text>
    <text x="20" y="120" font-size="11" fill="#666666">WithTimeout(300ms)</text>
    <rect x="200" y="90" width="480" height="30" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="210" y="110">alive until the parent deadline</text>

    <text x="20" y="184" font-weight="bold">child A</text>
    <text x="20" y="200" font-size="11" fill="#666666">WithTimeout(1h)</text>
    <rect x="200" y="170" width="480" height="30" fill="#fdf1e3" stroke="#a5651a"/>
    <text x="210" y="190">asks for 1 h, gets 300 ms</text>

    <text x="20" y="264" font-weight="bold">child B</text>
    <text x="20" y="280" font-size="11" fill="#666666">WithTimeout(100ms)</text>
    <rect x="200" y="250" width="160" height="30" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="210" y="270">own deadline wins</text>

    <text x="20" y="324" font-weight="bold">child C</text>
    <text x="20" y="340" font-size="11" fill="#666666">WithCancel</text>
    <rect x="200" y="310" width="480" height="30" fill="#f3e8f8" stroke="#6a1b9a"/>
    <text x="210" y="330">no deadline of its own, inherits 300 ms</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="360" y="62" fill="#2e7d32">B: DeadlineExceeded</text>
    <text x="680" y="62" fill="#b3261e">parent, A and C: DeadlineExceeded</text>
  </g>
</svg>
