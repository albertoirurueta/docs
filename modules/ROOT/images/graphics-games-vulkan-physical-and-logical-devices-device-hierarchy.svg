<text x="350.0" y="286.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Queue family 2</text>
<text x="350.0" y="302.2" text-anchor="middle" font-size="12" fill="#374151">TRANSFER only, count 2</text>
