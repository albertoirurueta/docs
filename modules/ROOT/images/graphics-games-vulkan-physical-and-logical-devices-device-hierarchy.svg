<rect x="510" y="60" width="230" height="260" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="625.0" y="130.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">VkDevice</text>
<text x="625.0" y="146.2" text-anchor="middle" font-size="12" fill="#065F46">(logical device)</text>
<text x="625.0" y="162.2" text-anchor="middle" font-size="12" fill="#065F46"></text>
<text x="625.0" y="178.2" text-anchor="middle" font-size="12" fill="#065F46">extensions and features</text>
<text x="625.0" y="194.2" text-anchor="middle" font-size="12" fill="#065F46">you enabled</text>
<text x="625.0" y="210.2" text-anchor="middle" font-size="12" fill="#065F46"></text>
<text x="625.0" y="226.2" text-anchor="middle" font-size="12" fill="#065F46">VkQueue handles:</text>
<text x="625.0" y="242.2" text-anchor="middle" font-size="12" fill="#065F46">graphics, present,</text>
<text x="625.0" y="258.2" text-anchor="middle" font-size="12" fill="#065F46">compute, transfer</text>
<line x1="450" y1="115" x2="508" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-hier)"/>
<line x1="450" y1="215" x2="508" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-hier)"/>
<line x1="450" y1="290" x2="508" y2="290" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-hier)"/>
<text x="480" y="100" text-anchor="middle" font-size="10" fill="#374151">queueCount</text>
<text x="625" y="345" text-anchor="middle" font-size="11" fill="#374151">vkCreateDevice + vkGetDeviceQueue2</text>
<text x="380" y="395" text-anchor="middle" font-size="11" fill="#374151">The physical device is read-only information; the logical device is the object you create resources from.</text>
