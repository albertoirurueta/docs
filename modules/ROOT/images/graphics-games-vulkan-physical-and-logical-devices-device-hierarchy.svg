<text x="350.0" y="119.2" text-anchor="middle" font-size="12" fill="#374151">GRAPHICS COMPUTE</text>
<text x="350.0" y="135.2" text-anchor="middle" font-size="12" fill="#374151">TRANSFER, count 16</text>
<rect x="250" y="185" width="200" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="350.0" y="211.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Queue family 1</text>
