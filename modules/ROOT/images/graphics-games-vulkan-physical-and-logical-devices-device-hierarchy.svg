<text x="105.0" y="94.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">VkInstance</text>
<rect x="20" y="170" width="170" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="217.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">VkPhysicalDevice</text>
<text x="105.0" y="233.2" text-anchor="middle" font-size="12" fill="#3730A3">(one per GPU)</text>
<text x="105.0" y="249.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="105.0" y="265.2" text-anchor="middle" font-size="12" fill="#3730A3">properties, features,</text>
<text x="105.0" y="281.2" text-anchor="middle" font-size="12" fill="#3730A3">memory, queue families</text>
<line x1="105" y1="120" x2="105" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-hier)"/>
<text x="105" y="146" text-anchor="middle" font-size="11" fill="#4B5563">enumerate</text>
