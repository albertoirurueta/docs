<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">An event channel asset decouples publishers from listeners</text>
<rect x="30" y="100" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="125.0" y="123.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">BookPicker</text>
<text x="125.0" y="139.2" text-anchor="middle" font-size="12" fill="#3730A3">(scene object)</text>
<text x="125.0" y="155.2" text-anchor="middle" font-size="12" fill="#3730A3">channel.Raise(book)</text>
<rect x="285" y="90" width="190" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="115.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">BookEventChannel</text>
<text x="380.0" y="131.2" text-anchor="middle" font-size="12" fill="#1F2937">ScriptableObject asset</text>
<text x="380.0" y="147.2" text-anchor="middle" font-size="12" fill="#1F2937">event Action&lt;BookData&gt;</text>
<text x="380.0" y="163.2" text-anchor="middle" font-size="12" fill="#1F2937">Raise() / subscribe</text>
<line x1="220" y1="135" x2="285" y2="135" stroke="#047857" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="540" y="48" width="190" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="635.0" y="75.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">HudPanel</text>
<text x="635.0" y="91.2" text-anchor="middle" font-size="12" fill="#3730A3">shows the title</text>
<line x1="475" y1="135" x2="540" y2="79" stroke="#047857" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="540" y="132" width="190" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="635.0" y="159.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">AudioPlayer</text>
<text x="635.0" y="175.2" text-anchor="middle" font-size="12" fill="#3730A3">plays a page-turn sound</text>
<line x1="475" y1="135" x2="540" y2="163" stroke="#047857" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="540" y="216" width="190" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="635.0" y="243.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">ShelfHighlight</text>
<text x="635.0" y="259.2" text-anchor="middle" font-size="12" fill="#3730A3">lights the slot</text>
<line x1="475" y1="135" x2="540" y2="247" stroke="#047857" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="236" width="700" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="259.9" text-anchor="middle" font-size="11" fill="#374151">The three listeners and the picker never reference each other.</text>
<text x="380.0" y="274.9" text-anchor="middle" font-size="11" fill="#374151">Each holds only a serialized reference to the same channel asset, assigned in the Inspector,</text>
<text x="380.0" y="289.9" text-anchor="middle" font-size="11" fill="#374151">so a listener can be removed, replaced or tested alone.</text>
<rect x="30" y="320" width="700" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="346.4" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Costs</text>
<text x="380.0" y="361.4" text-anchor="middle" font-size="11" fill="#92400E">Balance subscribe and unsubscribe in OnEnable and OnDisable. Listener order is not guaranteed.</text>
</svg>
