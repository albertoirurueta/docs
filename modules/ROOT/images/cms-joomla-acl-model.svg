<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Joomla ACL model: groups to viewing access levels, and groups to actions on global, component and item assets</title>
  <desc id="d">Left, the user group tree. Top right, groups map to viewing access levels used for what a user may see. Bottom right, groups combined with actions on a chain of assets from global configuration to component, category and item, used for what a user may do.</desc>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}
    .h{font-size:16px;font-weight:bold}
    .s{font-size:12px;fill:#52606d}
    .g{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
    .l{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .a{fill:#fff3e0;stroke:#e65100;stroke-width:1.5}
    .w{fill:#f3e5f5;stroke:#6a1b9a;stroke-width:1.5}
    .p{fill:#fafafa;stroke:#9aa5b1;stroke-width:1.2}
    .e{fill:none;stroke:#52606d;stroke-width:1.6}
    .v{fill:none;stroke:#2e7d32;stroke-width:2}
    .x{fill:none;stroke:#e65100;stroke-width:2}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="20" y="28" class="h">User groups (a tree, children inherit from parents)</text>
  <rect x="20" y="40" width="250" height="500" rx="8" class="p"/>
  <rect x="60" y="56" width="170" height="30" rx="5" class="g"/><text x="145" y="76" text-anchor="middle">Public (1)</text>
  <rect x="40" y="110" width="110" height="30" rx="5" class="g"/><text x="95" y="130" text-anchor="middle">Guest (9)</text>
  <rect x="160" y="110" width="100" height="30" rx="5" class="g"/><text x="210" y="130" text-anchor="middle">Super Users (8)</text>
  <rect x="40" y="166" width="150" height="30" rx="5" class="g"/><text x="115" y="186" text-anchor="middle">Registered (2)</text>
  <rect x="60" y="214" width="150" height="30" rx="5" class="g"/><text x="135" y="234" text-anchor="middle">Author (3)</text>
  <rect x="60" y="262" width="150" height="30" rx="5" class="g"/><text x="135" y="282" text-anchor="middle">Editor (4)</text>
  <rect x="60" y="310" width="150" height="30" rx="5" class="g"/><text x="135" y="330" text-anchor="middle">Publisher (5)</text>
  <rect x="40" y="366" width="150" height="30" rx="5" class="g"/><text x="115" y="386" text-anchor="middle">Manager (6)</text>
  <rect x="60" y="414" width="150" height="30" rx="5" class="g"/><text x="135" y="434" text-anchor="middle">Administrator (7)</text>
  <rect x="40" y="476" width="210" height="44" rx="5" class="w"/><text x="145" y="496" text-anchor="middle">Trail Warden (custom)</text><text x="145" y="512" text-anchor="middle" class="s">child of Registered</text>
  <path class="e" d="M145 86 V98 M95 98 H210 M95 98 V110 M210 98 V110 M145 86 V150 M115 150 V166 M145 150 H115 M115 196 V204 M135 204 V214 M135 244 V262 M135 292 V310 M145 150 V356 M115 356 V366 M135 396 V414"/>
  <path class="e" d="M115 196 V470 M115 470 H145 V476" stroke-dasharray="4 3"/>

  <text x="320" y="28" class="h">1. What may the user SEE? (viewing access levels)</text>
  <rect x="320" y="40" width="620" height="230" rx="8" class="l" fill-opacity="0.35"/>
  <rect x="340" y="62" width="150" height="34" rx="5" class="g"/><text x="415" y="84" text-anchor="middle">Group set of the user</text>
  <rect x="580" y="56" width="170" height="30" rx="5" class="l"/><text x="665" y="76" text-anchor="middle">Public level</text>
  <rect x="580" y="92" width="170" height="30" rx="5" class="l"/><text x="665" y="112" text-anchor="middle">Registered level</text>
  <rect x="580" y="128" width="170" height="30" rx="5" class="l"/><text x="665" y="148" text-anchor="middle">Special level</text>
  <rect x="580" y="164" width="170" height="30" rx="5" class="l"/><text x="665" y="184" text-anchor="middle">Guest level</text>
  <rect x="580" y="200" width="170" height="30" rx="5" class="l"/><text x="665" y="220" text-anchor="middle">Trail Wardens level</text>
  <path class="v" marker-end="url(#ag)" d="M490 79 H580"/>
  <path class="v" marker-end="url(#ag)" d="M490 79 C530 100 540 107 580 107"/>
  <path class="v" marker-end="url(#ag)" d="M490 79 C530 120 540 143 580 143"/>
  <path class="v" marker-end="url(#ag)" d="M490 79 C520 150 540 215 580 215"/>
  <rect x="790" y="104" width="140" height="82" rx="5" class="a"/>
  <text x="860" y="126" text-anchor="middle">Article, module,</text><text x="860" y="144" text-anchor="middle">menu item, field:</text><text x="860" y="162" text-anchor="middle">Access = one level</text>
  <path class="v" marker-end="url(#ag)" d="M750 145 H790"/>
  <text x="340" y="124" class="s">A level lists groups (and may list single users).</text>
  <text x="340" y="142" class="s">The user sees the item when ANY of the</text>
  <text x="340" y="160" class="s">user's groups (own and parent groups)</text>
  <text x="340" y="178" class="s">is listed in the item's level.</text>
  <text x="340" y="196" class="s">Checked with getAuthorisedViewLevels().</text>
  <text x="340" y="258" class="s">Only reading is controlled here; Super Users see all levels.</text>

  <text x="320" y="300" class="h">2. What may the user DO? (action permissions on assets)</text>
  <rect x="320" y="312" width="620" height="228" rx="8" class="a" fill-opacity="0.25"/>
  <rect x="338" y="334" width="110" height="34" rx="5" class="g"/><text x="393" y="356" text-anchor="middle">Group set</text>
  <rect x="338" y="380" width="110" height="34" rx="5" class="w"/><text x="393" y="402" text-anchor="middle">Action</text>
  <text x="338" y="436" class="s">core.edit, core.create,</text><text x="338" y="452" class="s">core.edit.state, core.delete,</text><text x="338" y="468" class="s">core.manage, core.admin ...</text>
  <rect x="490" y="330" width="140" height="40" rx="5" class="a"/><text x="560" y="348" text-anchor="middle">Global (root.1)</text><text x="560" y="363" text-anchor="middle" class="s">Global Configuration</text>
  <rect x="490" y="388" width="140" height="40" rx="5" class="a"/><text x="560" y="406" text-anchor="middle">Component</text><text x="560" y="421" text-anchor="middle" class="s">com_tallpine</text>
  <rect x="490" y="446" width="140" height="40" rx="5" class="a"/><text x="560" y="464" text-anchor="middle">Category</text><text x="560" y="479" text-anchor="middle" class="s">Trails &gt; Alpine</text>
  <rect x="490" y="496" width="140" height="34" rx="5" class="a"/><text x="560" y="518" text-anchor="middle">Item (trail 22)</text>
  <path class="x" marker-end="url(#ao)" d="M560 370 V388"/>
  <path class="x" marker-end="url(#ao)" d="M560 428 V446"/>
  <path class="x" marker-end="url(#ao)" d="M560 486 V496"/>
  <text x="640" y="355" class="s">rules start here; children</text>
  <text x="640" y="371" class="s">inherit and may override</text>
  <rect x="740" y="400" width="190" height="106" rx="5" class="p"/>
  <text x="835" y="420" text-anchor="middle" class="h">Calculated result</text>
  <text x="835" y="441" text-anchor="middle" class="s">explicit Denied anywhere wins</text>
  <text x="835" y="458" text-anchor="middle" class="s">else Allowed anywhere wins</text>
  <text x="835" y="475" text-anchor="middle" class="s">else Not Allowed (implicit)</text>
  <text x="835" y="495" text-anchor="middle" class="s">Super User: always allowed</text>
  <path class="x" marker-end="url(#ao)" d="M630 508 C680 508 700 470 740 460"/>
  <path class="x" d="M448 351 H490 M448 397 H470 V408 H490"/>
</svg>
