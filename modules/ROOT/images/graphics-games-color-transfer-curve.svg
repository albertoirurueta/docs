<text x="480" y="118" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">pure gamma 2.2 approximation</text>
<line x1="430" y1="138" x2="470" y2="138" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/>
<text x="480" y="142" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">identity (no encoding)</text>
<rect x="430" y="170" width="310" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="444" y="194" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Encode (linear c to stored):</text>
<text x="444" y="214" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">c &lt;= 0.0031308:  12.92 * c</text>
<text x="444" y="232" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">otherwise:  1.055 * c^(1/2.4) - 0.055</text>
<text x="444" y="258" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Decode is the inverse. Mid grey in</text>
<text x="444" y="276" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">perceptual terms (0.5 stored) is only</text>
<text x="444" y="294" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">about 21% of the light energy.</text>
<text x="380" y="404" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Storing 8-bit values after the curve spends more codes on dark tones, where the eye is most sensitive</text>
</svg>
