<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Three ways to run Debezium</text>

  <!-- column headings -->
  <rect x="20" y="50" width="280" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="160" y="74" text-anchor="middle" font-weight="bold" fill="#263238">Kafka Connect</text>
  <text x="160" y="94" text-anchor="middle" font-size="12" fill="#455a64">source connectors in a Connect cluster</text>
  <rect x="310" y="50" width="280" height="56" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="450" y="74" text-anchor="middle" font-weight="bold" fill="#263238">Debezium Server</text>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#455a64">standalone application, pluggable sinks</text>
  <rect x="600" y="50" width="280" height="56" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="740" y="74" text-anchor="middle" font-weight="bold" fill="#263238">Debezium Engine</text>
  <text x="740" y="94" text-anchor="middle" font-size="12" fill="#455a64">library embedded in a Java application</text>

  <!-- source databases -->
  <rect x="60" y="125" width="200" height="44" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="160" y="152" text-anchor="middle" fill="#263238">Oracle BOOKSHOP (redo)</text>
  <rect x="350" y="125" width="200" height="44" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="450" y="152" text-anchor="middle" fill="#263238">Oracle BOOKSHOP (redo)</text>
  <rect x="640" y="125" width="200" height="44" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="740" y="152" text-anchor="middle" fill="#263238">Oracle BOOKSHOP (redo)</text>

  <!-- column 1: Kafka Connect -->
  <rect x="40" y="195" width="240" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="160" y="220" text-anchor="middle" fill="#263238">Connect workers</text>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#455a64">bookshop-oracle-source task</text>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#455a64">REST API on port 8083</text>
  <line x1="160" y1="169" x2="160" y2="193" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="290" width="240" height="96" rx="6" fill="#eceff1" stroke="#607d8b"/>
  <text x="160" y="313" text-anchor="middle" fill="#263238">Apache Kafka (KRaft)</text>
  <text x="160" y="333" text-anchor="middle" font-size="12" fill="#455a64">legacy.BOOKSHOP.BOOK, ...ORDERS</text>
  <text x="160" y="351" text-anchor="middle" font-size="12" fill="#455a64">legacy.schema-history</text>
  <text x="160" y="369" text-anchor="middle" font-size="12" fill="#455a64">offsets, configs, statuses</text>
  <line x1="160" y1="265" x2="160" y2="288" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="412" width="125" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="92" y="436" text-anchor="middle" font-size="13" fill="#263238">JDBC sink</text>
  <text x="92" y="455" text-anchor="middle" font-size="12" fill="#455a64">PostgreSQL</text>
  <rect x="165" y="412" width="125" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="227" y="436" text-anchor="middle" font-size="13" fill="#263238">Consumers</text>
  <text x="227" y="455" text-anchor="middle" font-size="12" fill="#455a64">Spring Boot ACL</text>
  <line x1="120" y1="386" x2="100" y2="410" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="386" x2="220" y2="410" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- column 2: Debezium Server -->
  <rect x="330" y="195" width="240" height="96" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="450" y="220" text-anchor="middle" fill="#263238">Debezium Server</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#455a64">debezium.source.* (one connector)</text>
  <text x="450" y="258" text-anchor="middle" font-size="12" fill="#455a64">debezium.sink.type=...</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#455a64">offsets in file, JDBC, Redis...</text>
  <line x1="450" y1="169" x2="450" y2="193" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="316" width="240" height="70" rx="6" fill="#eceff1" stroke="#607d8b"/>
  <text x="450" y="340" text-anchor="middle" fill="#263238">Sink without Kafka Connect</text>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#455a64">JDBC, Kinesis, Pub/Sub, Pulsar,</text>
  <text x="450" y="377" text-anchor="middle" font-size="12" fill="#455a64">Event Hubs, Redis, NATS, Kafka</text>
  <line x1="450" y1="291" x2="450" y2="314" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350" y="412" width="200" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="450" y="436" text-anchor="middle" font-size="13" fill="#263238">Target system</text>
  <text x="450" y="455" text-anchor="middle" font-size="12" fill="#455a64">e.g. PostgreSQL via JDBC</text>
  <line x1="450" y1="386" x2="450" y2="410" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- column 3: Debezium Engine -->
  <rect x="620" y="195" width="240" height="191" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="740" y="220" text-anchor="middle" fill="#263238">Java application (one JVM)</text>
  <rect x="640" y="236" width="200" height="56" rx="6" fill="#ffffff" stroke="#e65100"/>
  <text x="740" y="259" text-anchor="middle" font-size="13" fill="#263238">DebeziumEngine</text>
  <text x="740" y="278" text-anchor="middle" font-size="12" fill="#455a64">connector + offset store</text>
  <rect x="640" y="314" width="200" height="56" rx="6" fill="#ffffff" stroke="#e65100"/>
  <text x="740" y="337" text-anchor="middle" font-size="13" fill="#263238">Your handler code</text>
  <text x="740" y="356" text-anchor="middle" font-size="12" fill="#455a64">notifying(record -&gt; ...)</text>
  <line x1="740" y1="169" x2="740" y2="234" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="292" x2="740" y2="312" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="412" width="200" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="740" y="436" text-anchor="middle" font-size="13" fill="#263238">Any target</text>
  <text x="740" y="455" text-anchor="middle" font-size="12" fill="#455a64">written by your code</text>
  <line x1="740" y1="386" x2="740" y2="410" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- fit for migration -->
  <rect x="20" y="490" width="280" height="92" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="160" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Best for</text>
  <text x="160" y="532" text-anchor="middle" font-size="12" fill="#37474f">long strangler migrations with</text>
  <text x="160" y="550" text-anchor="middle" font-size="12" fill="#37474f">many consumers and replayable</text>
  <text x="160" y="568" text-anchor="middle" font-size="12" fill="#37474f">topics; exactly-once available</text>
  <rect x="310" y="490" width="280" height="92" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="450" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Best for</text>
  <text x="450" y="532" text-anchor="middle" font-size="12" fill="#37474f">point-to-point replication or a</text>
  <text x="450" y="550" text-anchor="middle" font-size="12" fill="#37474f">broker other than Kafka; one</text>
  <text x="450" y="568" text-anchor="middle" font-size="12" fill="#37474f">process per source connector</text>
  <rect x="600" y="490" width="280" height="92" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="740" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Best for</text>
  <text x="740" y="532" text-anchor="middle" font-size="12" fill="#37474f">in-process pipelines and tests;</text>
  <text x="740" y="550" text-anchor="middle" font-size="12" fill="#37474f">the application owns offsets,</text>
  <text x="740" y="568" text-anchor="middle" font-size="12" fill="#37474f">retries and fault tolerance</text>
</svg>
