<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 171" width="1080" height="171" role="img" aria-labelledby="sap-abap-guide-set-up-a-local-abap-playground-07-result-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
