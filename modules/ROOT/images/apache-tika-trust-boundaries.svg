<svg viewBox="0 0 1000 570" width="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
<text x="500.0" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Apache Tika trust boundaries: an upload on its way to the parser</text>
<text x="500.0" y="46" text-anchor="middle" font-size="12" fill="#444444">Dashed lines are trust boundaries. Tika itself is not one: every control in front of it is yours.</text>
<rect x="15" y="66" width="170" height="394" rx="10" fill="#fbe4e4" stroke="#b03a3a" stroke-width="1.2"/>
<text x="100.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a3a">Untrusted</text>
<rect x="200" y="66" width="200" height="394" rx="10" fill="#fdf1d8" stroke="#b7791f" stroke-width="1.2"/>
<text x="300.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#b7791f">Edge</text>
<rect x="415" y="66" width="200" height="394" rx="10" fill="#e1ecf8" stroke="#2b5c9a" stroke-width="1.2"/>
<text x="515.0" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2b5c9a">Application</text>
<rect x="630" y="66" width="355" height="394" rx="10" fill="#e0f0e0" stroke="#2b7a2b" stroke-width="1.2"/>
<text x="807.5" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">Trusted parsing network</text>
<line x1="192.5" y1="60" x2="192.5" y2="468" stroke="#7a1f1f" stroke-width="2" stroke-dasharray="7,5"/>
<text x="192.5" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">boundary 1</text>
<line x1="407.5" y1="60" x2="407.5" y2="468" stroke="#7a1f1f" stroke-width="2" stroke-dasharray="7,5"/>
<text x="407.5" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">boundary 2</text>
<line x1="622.5" y1="60" x2="622.5" y2="468" stroke="#7a1f1f" stroke-width="2" stroke-dasharray="7,5"/>
<text x="622.5" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">boundary 3</text>
<rect x="25" y="170" width="150" height="120" rx="8" fill="#ffffff" stroke="#b03a3a" stroke-width="1.6"/>
<text x="100.0" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Untrusted upload</text>
<text x="100.0" y="212" text-anchor="middle" font-size="11" fill="#333333">browser, partner API,</text>
<text x="100.0" y="228" text-anchor="middle" font-size="11" fill="#333333">e-mail gateway</text>
<text x="100.0" y="244" text-anchor="middle" font-size="11" fill="#333333">any bytes, any name,</text>
<text x="100.0" y="260" text-anchor="middle" font-size="11" fill="#333333">any size</text>
<rect x="210" y="150" width="180" height="160" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/>
<text x="300.0" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Gateway / proxy</text>
<text x="300.0" y="192" text-anchor="middle" font-size="11" fill="#333333">TLS termination</text>
<text x="300.0" y="208" text-anchor="middle" font-size="11" fill="#333333">authentication</text>
<text x="300.0" y="224" text-anchor="middle" font-size="11" fill="#333333">authorization</text>
<text x="300.0" y="240" text-anchor="middle" font-size="11" fill="#333333">body size + rate limits</text>
<text x="300.0" y="256" text-anchor="middle" font-size="11" fill="#333333">path allow-list</text>
<text x="300.0" y="272" text-anchor="middle" font-size="11" fill="#333333">(no /config, no /pipes)</text>
<rect x="425" y="150" width="180" height="160" rx="8" fill="#ffffff" stroke="#2b5c9a" stroke-width="1.6"/>
<text x="515.0" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Intake service</text>
<text x="515.0" y="192" text-anchor="middle" font-size="11" fill="#333333">OWASP upload checks:</text>
<text x="515.0" y="208" text-anchor="middle" font-size="11" fill="#333333">size, extension allow-list,</text>
<text x="515.0" y="224" text-anchor="middle" font-size="11" fill="#333333">type detected from bytes,</text>
<text x="515.0" y="240" text-anchor="middle" font-size="11" fill="#333333">random storage name,</text>
<text x="515.0" y="256" text-anchor="middle" font-size="11" fill="#333333">then call Tika</text>
<rect x="645" y="110" width="175" height="160" rx="8" fill="#ffffff" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="732.5" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">tika-server / tika-grpc</text>
<text x="732.5" y="152" text-anchor="middle" font-size="11" fill="#333333">binds 127.0.0.1 or a</text>
<text x="732.5" y="168" text-anchor="middle" font-size="11" fill="#333333">private address</text>
<text x="732.5" y="184" text-anchor="middle" font-size="11" fill="#333333">no authentication</text>
<text x="732.5" y="200" text-anchor="middle" font-size="11" fill="#333333">allowPipes = false</text>
<text x="732.5" y="216" text-anchor="middle" font-size="11" fill="#333333">allowPerRequestConfig</text>
<text x="732.5" y="232" text-anchor="middle" font-size="11" fill="#333333">= false</text>
<rect x="862" y="98" width="120" height="160" rx="8" fill="#f4faf4" stroke="#2b7a2b" stroke-width="1.2"/>
<rect x="856" y="104" width="120" height="160" rx="8" fill="#f4faf4" stroke="#2b7a2b" stroke-width="1.2"/>
<rect x="850" y="110" width="120" height="160" rx="8" fill="#ffffff" stroke="#2b7a2b" stroke-width="1.6"/>
<text x="910.0" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Forked JVMs</text>
<text x="910.0" y="152" text-anchor="middle" font-size="10.5" fill="#333333">one parse each</text>
<text x="910.0" y="168" text-anchor="middle" font-size="10.5" fill="#333333">-Xmx heap ceiling</text>
<text x="910.0" y="184" text-anchor="middle" font-size="10.5" fill="#333333">timeouts</text>
<text x="910.0" y="200" text-anchor="middle" font-size="10.5" fill="#333333">OOM, hang, crash</text>
<text x="910.0" y="216" text-anchor="middle" font-size="10.5" fill="#333333">kill the fork only</text>
<text x="910.0" y="232" text-anchor="middle" font-size="10.5" fill="#333333">(503, then restart)</text>
<rect x="645" y="320" width="175" height="115" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
<text x="732.5" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">tika-config.json</text>
<text x="732.5" y="362" text-anchor="middle" font-size="11" fill="#333333">operator input, trusted</text>
<text x="732.5" y="378" text-anchor="middle" font-size="11" fill="#333333">read-only mount</text>
<text x="732.5" y="394" text-anchor="middle" font-size="11" fill="#333333">secrets as ${env:NAME}</text>
<text x="732.5" y="410" text-anchor="middle" font-size="11" fill="#333333">not from requests</text>
<rect x="850" y="320" width="120" height="115" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
<text x="910.0" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">External tools</text>
<text x="910.0" y="362" text-anchor="middle" font-size="10.5" fill="#333333">tesseract, ffmpeg,</text>
<text x="910.0" y="378" text-anchor="middle" font-size="10.5" fill="#333333">exiftool, file</text>
<text x="910.0" y="394" text-anchor="middle" font-size="10.5" fill="#333333">absolute paths</text>
<text x="910.0" y="410" text-anchor="middle" font-size="10.5" fill="#333333">least privilege</text>
<line x1="175" y1="230" x2="208" y2="230" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="173.5" y="203" width="38" height="15" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="192.5" y="214" text-anchor="middle" font-size="10.5" fill="#333333">HTTPS</text>
<line x1="390" y1="230" x2="423" y2="230" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="605" y1="215" x2="643" y2="195" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="591.5" y="165" width="62" height="15" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="622.5" y="176" text-anchor="middle" font-size="10.5" fill="#333333">PUT /tika</text>
<line x1="820" y1="190" x2="848" y2="190" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="821.0" y="171" width="26" height="15" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="834" y="182" text-anchor="middle" font-size="10.5" fill="#333333">IPC</text>
<line x1="910" y1="270" x2="910" y2="318" stroke="#555555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="916.0" y="287" width="44" height="15" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="938" y="298" text-anchor="middle" font-size="10.5" fill="#333333">spawns</text>
<line x1="732" y1="320" x2="732" y2="272" stroke="#555555" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a)"/>
<rect x="737.0" y="289" width="38" height="15" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="756" y="300" text-anchor="middle" font-size="10.5" fill="#333333">loads</text>
<rect x="415" y="495" width="570" height="60" rx="8" fill="#fdebc8" stroke="#b7791f" stroke-width="1.6"/>
<text x="700" y="517" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Output is untrusted too</text>
<text x="700" y="537" text-anchor="middle" font-size="11" fill="#333333">text, links (javascript:, data:), formulas and markup from the file: sanitise before</text>
<text x="700" y="551" text-anchor="middle" font-size="11" fill="#333333">rendering, indexing, exporting or prompting; redact exception detail for callers</text>
<line x1="515" y1="310" x2="515" y2="493" stroke="#555555" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="522" y="420" font-size="10.5" fill="#333333">text + metadata</text>
<rect x="25" y="495" width="375" height="60" rx="8" fill="#ffffff" stroke="#7a1f1f" stroke-width="1.2"/>
<text x="212" y="517" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1f1f">Never: untrusted caller to Tika directly</text>
<text x="212" y="537" text-anchor="middle" font-size="11" fill="#333333">no public port and no route in that skips the gateway,</text>
<text x="212" y="551" text-anchor="middle" font-size="11" fill="#333333">no per-request config for callers you do not trust</text>
</svg>
