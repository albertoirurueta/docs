<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Moving work between Canva and Affinity</text>
  <rect x="30" y="60" width="260" height="250" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="160" y="86" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">Canva</text><rect x="50" y="100" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="160" y="130" font-size="12" fill="#374151" text-anchor="middle">Bookshelf launch design</text><rect x="50" y="230" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="160" y="254" font-size="12" fill="#374151" text-anchor="middle">Uploads or Projects folder</text><text x="160" y="274" font-size="11" fill="#92400E" text-anchor="middle">Cover art arrives as a static image</text>
  <rect x="470" y="60" width="260" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/><text x="600" y="86" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">Affinity</text><rect x="490" y="100" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="600" y="122" font-size="12" fill="#374151" text-anchor="middle">Open exported file</text><text x="600" y="140" font-size="11" fill="#6B7280" text-anchor="middle">SVG keeps vectors editable</text><rect x="490" y="230" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="600" y="254" font-size="12" fill="#374151" text-anchor="middle">Edit layers, set brand fonts</text><text x="600" y="274" font-size="11" fill="#92400E" text-anchor="middle">Quick Export, To Canva</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M292,125 L468,125" marker-end="url(#ah)"/><path d="M468,260 L292,260" marker-end="url(#ah)"/></g>
  <text x="380" y="112" font-size="12" fill="#374151" text-anchor="middle">Share, Download: SVG, PDF, PNG or JPG</text><text x="380" y="246" font-size="12" fill="#374151" text-anchor="middle">Export dialog or Quick Export</text>
  <rect x="250" y="170" width="260" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="380" y="195" font-size="12" fill="#92400E" text-anchor="middle">Canva files do not open directly in Affinity</text>
  <text x="380" y="362" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
