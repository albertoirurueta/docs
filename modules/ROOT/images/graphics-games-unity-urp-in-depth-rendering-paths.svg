<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Forward, Forward+ and Deferred: where the lights are handled</text>
<rect x="20" y="46" width="232" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="136.0" y="65.9" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Forward</text>
<rect x="20" y="84" width="232" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="136.0" y="137.8" text-anchor="middle" font-size="11" fill="#374151">Each object is lit while it is drawn.</text>
<text x="136.0" y="151.8" text-anchor="middle" font-size="11" fill="#374151">Lights per object: 9 (main + 8).</text>
<text x="136.0" y="165.8" text-anchor="middle" font-size="11" fill="#374151">Per-vertex lights allowed.</text>
<text x="136.0" y="179.8" text-anchor="middle" font-size="11" fill="#374151">MSAA: yes.</text>
<text x="136.0" y="193.8" text-anchor="middle" font-size="11" fill="#374151">Cost grows with objects x lights.</text>
<text x="136.0" y="207.8" text-anchor="middle" font-size="11" fill="#374151">Best for mobile and few lights.</text>
<rect x="266" y="46" width="232" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="382.0" y="65.9" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Forward+</text>
<rect x="266" y="84" width="232" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="137.8" text-anchor="middle" font-size="11" fill="#374151">Screen is split into tiles; lights are</text>
<text x="382.0" y="151.8" text-anchor="middle" font-size="11" fill="#374151">binned per tile before drawing.</text>
<text x="382.0" y="165.8" text-anchor="middle" font-size="11" fill="#374151">Lights per object: unlimited,</text>
<text x="382.0" y="179.8" text-anchor="middle" font-size="11" fill="#374151">per camera: up to 256 (platform).</text>
<text x="382.0" y="193.8" text-anchor="middle" font-size="11" fill="#374151">MSAA: yes. Needed for the GPU</text>
<text x="382.0" y="207.8" text-anchor="middle" font-size="11" fill="#374151">Resident Drawer. Good default.</text>
<rect x="512" y="46" width="232" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="628.0" y="65.9" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">Deferred / Deferred+</text>
<rect x="512" y="84" width="232" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="628.0" y="137.8" text-anchor="middle" font-size="11" fill="#374151">Pass 1 writes a GBuffer (albedo,</text>
<text x="628.0" y="151.8" text-anchor="middle" font-size="11" fill="#374151">normals, smoothness...).</text>
<text x="628.0" y="165.8" text-anchor="middle" font-size="11" fill="#374151">Pass 2 lights the screen pixels.</text>
<text x="628.0" y="179.8" text-anchor="middle" font-size="11" fill="#374151">Opaque lights: unlimited. MSAA: no.</text>
<text x="628.0" y="193.8" text-anchor="middle" font-size="11" fill="#374151">Extra passes cost mobile bandwidth.</text>
<text x="628.0" y="207.8" text-anchor="middle" font-size="11" fill="#374151">Needs shader model 4.5, no GLES.</text>
<text x="380" y="276" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Same scene, three costs</text>
<rect x="36" y="288" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="136.0" y="330.5" text-anchor="middle" font-size="10" fill="#374151"></text>
<rect x="48" y="298" width="52" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="74.0" y="312.5" text-anchor="middle" font-size="10" fill="#3730A3">object</text>
<line x1="74" y1="320" x2="74" y2="336" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="114" y="298" width="52" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="140.0" y="312.5" text-anchor="middle" font-size="10" fill="#3730A3">object</text>
<line x1="140" y1="320" x2="140" y2="336" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="180" y="298" width="52" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="206.0" y="312.5" text-anchor="middle" font-size="10" fill="#3730A3">object</text>
<line x1="206" y1="320" x2="206" y2="336" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="136.0" y="360" text-anchor="middle" font-size="10" fill="#374151">lights applied inside each object draw</text>
<rect x="282" y="288" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="382.0" y="330.5" text-anchor="middle" font-size="10" fill="#374151"></text>
<rect x="300" y="296" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="320.0" y="310.5" text-anchor="middle" font-size="10" fill="#3730A3">1</text>
<rect x="300" y="322" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="320.0" y="336.5" text-anchor="middle" font-size="10" fill="#3730A3">3</text>
<rect x="344" y="296" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="364.0" y="310.5" text-anchor="middle" font-size="10" fill="#3730A3">2</text>
<rect x="344" y="322" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="364.0" y="336.5" text-anchor="middle" font-size="10" fill="#3730A3">1</text>
<rect x="388" y="296" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="408.0" y="310.5" text-anchor="middle" font-size="10" fill="#3730A3">3</text>
<rect x="388" y="322" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="408.0" y="336.5" text-anchor="middle" font-size="10" fill="#3730A3">2</text>
<rect x="432" y="296" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="452.0" y="310.5" text-anchor="middle" font-size="10" fill="#3730A3">1</text>
<rect x="432" y="322" width="40" height="22" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="452.0" y="336.5" text-anchor="middle" font-size="10" fill="#3730A3">3</text>
<text x="382.0" y="360" text-anchor="middle" font-size="10" fill="#374151">light list per screen tile</text>
<rect x="528" y="288" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="628.0" y="330.5" text-anchor="middle" font-size="10" fill="#374151"></text>
<rect x="540" y="298" width="70" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="575.0" y="312.5" text-anchor="middle" font-size="10" fill="#92400E">GBuffer</text>
<line x1="610" y1="309" x2="638" y2="309" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="640" y="298" width="70" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="675.0" y="312.5" text-anchor="middle" font-size="10" fill="#92400E">light pass</text>
<text x="628.0" y="360" text-anchor="middle" font-size="10" fill="#374151">lights applied to screen pixels</text>
<rect x="20" y="382" width="720" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="405.9" text-anchor="middle" font-size="11" fill="#374151">Rendering Path is a setting of the Universal Renderer asset, not of the URP asset. Different renderers in one URP asset may use different paths.</text>
</svg>
