<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-in-rebind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Runtime rebinding of one binding, step by step</text>
<rect x="20" y="55" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="81.0" text-anchor="middle" font-size="12" fill="#3730A3">Player clicks</text>
<text x="95.0" y="97.0" text-anchor="middle" font-size="12" fill="#3730A3">the rebind button</text>
<rect x="205" y="55" width="150" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="280.0" y="81.0" text-anchor="middle" font-size="12" fill="#92400E">action.Disable()</text>
<text x="280.0" y="97.0" text-anchor="middle" font-size="12" fill="#92400E">(required)</text>
<rect x="390" y="55" width="170" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475.0" y="81.0" text-anchor="middle" font-size="11" fill="#3730A3">PerformInteractive-</text>
<text x="475.0" y="96.0" text-anchor="middle" font-size="11" fill="#3730A3">Rebinding(index).Start()</text>
<rect x="595" y="55" width="145" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="667.5" y="81.0" text-anchor="middle" font-size="12" fill="#374151">Waiting for a</text>
<text x="667.5" y="97.0" text-anchor="middle" font-size="12" fill="#374151">compatible control</text>
<line x1="170" y1="85" x2="205" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<line x1="355" y1="85" x2="390" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<line x1="560" y1="85" x2="595" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<line x1="667" y1="115" x2="667" y2="140" stroke="#4B5563" stroke-width="1.5"/>
<line x1="150" y1="140" x2="667" y2="140" stroke="#4B5563" stroke-width="1.5"/>
<line x1="150" y1="140" x2="150" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<line x1="400" y1="140" x2="400" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<line x1="667" y1="140" x2="667" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<rect x="30" y="160" width="240" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="150.0" y="184.0" text-anchor="middle" font-size="11" fill="#374151">Excluded control, such as mouse move:</text>
<text x="150.0" y="199.0" text-anchor="middle" font-size="11" fill="#374151">ignored, the wait continues</text>
<rect x="285" y="160" width="230" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="400.0" y="184.0" text-anchor="middle" font-size="11" fill="#1F2937">Valid control pressed</text>
<text x="400.0" y="199.0" text-anchor="middle" font-size="11" fill="#1F2937">OnComplete: override path is set</text>
<rect x="540" y="160" width="200" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="184.0" text-anchor="middle" font-size="11" fill="#92400E">Escape pressed</text>
<text x="640.0" y="199.0" text-anchor="middle" font-size="11" fill="#92400E">OnCancel: nothing changes</text>
<line x1="400" y1="216" x2="400" y2="236" stroke="#4B5563" stroke-width="1.5"/>
<line x1="640" y1="216" x2="640" y2="236" stroke="#4B5563" stroke-width="1.5"/>
<line x1="400" y1="236" x2="640" y2="236" stroke="#4B5563" stroke-width="1.5"/>
<line x1="520" y1="236" x2="520" y2="252" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-rebind)"/>
<rect x="190" y="252" width="470" height="60" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="270.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Always finish the same way</text>
<text x="425.0" y="285.5" text-anchor="middle" font-size="11" fill="#374151">operation.Dispose(), action.Enable(),</text>
<text x="425.0" y="300.5" text-anchor="middle" font-size="11" fill="#374151">SaveBindingOverridesAsJson() to PlayerPrefs or a file</text>
<text x="380" y="340" text-anchor="middle" font-size="11" fill="#374151">Overrides are stored apart from the asset; at start-up LoadBindingOverridesFromJson restores them.</text>
</svg>
