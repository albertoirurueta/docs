  <text x="14" y="128" font-size="12.5" font-weight="bold" fill="#1c4b73">SimpleTrigger</text>
  <text x="14" y="143" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">simpleSchedule()</text>
  <text x="14" y="155" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">  .withIntervalInHours(24)</text>
  <text x="14" y="167" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">  .repeatForever()</text>
  <text x="14" y="179" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">startAt Wed 02:30</text>
  <text x="14" y="194.5" font-size="9.8" fill="#222222">Elapsed time: 24 h after Sat 02:30</text>
  <text x="14" y="207.0" font-size="9.8" fill="#222222">is Sun 03:30, and it stays 03:30.</text>
