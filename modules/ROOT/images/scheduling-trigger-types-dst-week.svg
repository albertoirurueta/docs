  <text x="14" y="364" font-size="12.5" font-weight="bold" fill="#1c4b73">CalendarIntervalTrigger</text>
  <text x="14" y="379" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">calendarIntervalSchedule()</text>
  <text x="14" y="391" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">  .withIntervalInDays(1)</text>
  <text x="14" y="403" font-size="9.5" font-family="Menlo, Consolas, monospace" fill="#444444" xml:space="preserve">  .inTimeZone(Europe/Madrid)</text>
