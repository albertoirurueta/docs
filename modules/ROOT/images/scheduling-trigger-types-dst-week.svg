  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The four trigger types across the spring-forward week</text>
  <text x="450" y="46" font-size="12" fill="#444444" text-anchor="middle">Europe/Madrid, Wed 25 to Tue 31 March 2026: the clocks jump from 02:00 to 03:00 on Sunday 29 March. Every trigger starts on Wednesday.</text>
