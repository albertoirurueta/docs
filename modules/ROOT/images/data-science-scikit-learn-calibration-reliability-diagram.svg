<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Reliability diagram for two classifiers</title>
  <desc id="d1">A square plot of mean predicted probability against observed fraction of positives. The diagonal is perfect calibration. A naive Bayes curve is flatter than the diagonal, which means over-confident probabilities. A random forest curve is steeper than the diagonal in the middle, which means under-confident probabilities.</desc>
  <rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Reading a reliability diagram</text>
  <!-- plot area 300x300 at x=80..380, y=70..370 -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <rect x="80" y="70" width="300" height="300"/>
    <path d="M80 370 L380 70" stroke-dasharray="6 5" stroke="#475569" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="80" y="388">0.0</text><text x="155" y="388">0.25</text><text x="230" y="388">0.5</text><text x="305" y="388">0.75</text><text x="380" y="388">1.0</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="72" y="374">0.0</text><text x="72" y="299">0.25</text><text x="72" y="224">0.5</text><text x="72" y="149">0.75</text><text x="72" y="74">1.0</text>
  </g>
  <text x="230" y="414" font-size="14" fill="#0F172A" text-anchor="middle">mean predicted probability (bin)</text>
  <text x="26" y="220" font-size="14" fill="#0F172A" text-anchor="middle" transform="rotate(-90 26 220)">fraction of positives (bin)</text>
  <!-- naive Bayes: pred [0.02 .18 .31 .44 .56 .69 .82 .98], true [0.1 .37 .42 .48 .55 .6 .62 .88] -->
  <polyline fill="none" stroke="#BE123C" stroke-width="2" points="86,340 134,259 173,244 212,226 248,205 287,190 326,184 374,106"/>
  <g fill="#FFE4E6" stroke="#BE123C" stroke-width="2">
    <circle cx="86" cy="340" r="5"/><circle cx="134" cy="259" r="5"/><circle cx="173" cy="244" r="5"/><circle cx="212" cy="226" r="5"/><circle cx="248" cy="205" r="5"/><circle cx="287" cy="190" r="5"/><circle cx="326" cy="184" r="5"/><circle cx="374" cy="106" r="5"/>
  </g>
  <!-- random forest: pred [0.06 .18 .31 .44 .56 .69 .83 .95], true [0.04 .1 .23 .33 .49 .71 .91 .99] -->
  <polyline fill="none" stroke="#1D4ED8" stroke-width="2" points="98,358 134,340 173,301 212,271 248,223 287,157 329,97 365,73"/>
  <g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2">
    <circle cx="98" cy="358" r="5"/><circle cx="134" cy="340" r="5"/><circle cx="173" cy="301" r="5"/><circle cx="212" cy="271" r="5"/><circle cx="248" cy="223" r="5"/><circle cx="287" cy="157" r="5"/><circle cx="329" cy="97" r="5"/><circle cx="365" cy="73" r="5"/>
  </g>
  <!-- legend / explanation -->
  <g>
    <line x1="420" y1="96" x2="452" y2="96" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="462" y="101" font-size="14" fill="#0F172A">perfectly calibrated</text>
    <line x1="420" y1="132" x2="452" y2="132" stroke="#BE123C" stroke-width="2"/><circle cx="436" cy="132" r="5" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
    <text x="462" y="137" font-size="14" fill="#0F172A">Gaussian naive Bayes</text>
    <line x1="420" y1="168" x2="452" y2="168" stroke="#1D4ED8" stroke-width="2"/><circle cx="436" cy="168" r="5" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
    <text x="462" y="173" font-size="14" fill="#0F172A">random forest</text>
  </g>
  <circle cx="432" cy="222" r="11" fill="#0F172A"/><text x="432" y="227" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="452" y="220" font-size="14" fill="#0F172A">Curve below the diagonal on the right:</text>
  <text x="452" y="238" font-size="14" fill="#0F172A">predictions are too confident.</text>
  <circle cx="432" cy="282" r="11" fill="#0F172A"/><text x="432" y="287" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="452" y="280" font-size="14" fill="#0F172A">Curve steeper than the diagonal:</text>
  <text x="452" y="298" font-size="14" fill="#0F172A">predictions are too timid.</text>
  <text x="420" y="350" font-size="12" fill="#475569">Points computed with calibration_curve (8 uniform</text>
  <text x="420" y="368" font-size="12" fill="#475569">bins) on 15,200 test samples of a synthetic problem.</text>
</svg>
