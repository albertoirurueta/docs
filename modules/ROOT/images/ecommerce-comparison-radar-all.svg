<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 651" width="760" height="651" role="img" aria-labelledby="radar-all-t radar-all-d">
<title id="radar-all-t">Scores on ten axes, four platforms</title>
<desc id="radar-all-d">Scores from 0 to 10 on ten axes for Shopify, PrestaShop, Magento / Adobe Commerce, WooCommerce. Eight axes are editorial scores with a recorded basis and two (performance and ecosystem) are computed from the data of 2026-10-27; the rubric is in the data notes. Low maintenance effort and low cost are inverted so that a larger area is always better.</desc>
