<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-hd-vol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How HDRP blends a global and a local volume as the camera moves</text>
<text x="190" y="56" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Plan view of the Bookshelf room</text>
<rect x="20" y="66" width="340" height="250" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="190" y="84" text-anchor="middle" font-size="11" fill="#374151">Global volume: whole scene, weight 1</text>
<rect x="190" y="120" width="160" height="130" rx="8" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="270" y="114" text-anchor="middle" font-size="10" fill="#92400E">blend distance b</text>
<rect x="212" y="142" width="116" height="86" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="270" y="178" text-anchor="middle" font-size="12" fill="#92400E">Local volume</text>
<text x="270" y="194" text-anchor="middle" font-size="12" fill="#92400E">reading nook</text>
<text x="270" y="212" text-anchor="middle" font-size="9" fill="#92400E">Box Collider, Is Trigger</text>
<line x1="40" y1="290" x2="340" y2="290" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-hd-vol)"/>
<text x="190" y="308" text-anchor="middle" font-size="10" fill="#374151">camera moves left to right</text>
<line x1="70" y1="279" x2="70" y2="262" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="205" y1="279" x2="205" y2="262" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="270" y1="279" x2="270" y2="232" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 2"/>
<text x="70" y="256" text-anchor="middle" font-size="10" fill="#374151">outside</text>
<text x="205" y="256" text-anchor="middle" font-size="10" fill="#374151">in blend zone</text>
<circle cx="70" cy="290" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="70" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
<circle cx="205" cy="290" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="205" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">B</text>
<circle cx="270" cy="290" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="270" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">C</text>
<text x="560" y="56" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Local volume influence</text>
<line x1="420" y1="260" x2="730" y2="260" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-hd-vol)"/>
<line x1="420" y1="260" x2="420" y2="76" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-hd-vol)"/>
<text x="575" y="296" text-anchor="middle" font-size="11" fill="#374151">distance d from the collider</text>
<text x="414" y="94" text-anchor="end" font-size="11" fill="#374151">1</text>
<text x="414" y="264" text-anchor="end" font-size="11" fill="#374151">0</text>
<text x="398" y="175" text-anchor="end" font-size="12" fill="#1F2937">w</text>
<text x="620" y="278" text-anchor="middle" font-size="11" fill="#92400E">b</text>
<path d="M420.0,90.0 L425.0,90.1 L430.0,90.4 L435.0,91.0 L440.0,91.7 L445.0,92.7 L450.0,93.8 L455.0,95.2 L460.0,96.8 L465.0,98.6 L470.0,100.6 L475.0,102.9 L480.0,105.3 L485.0,108.0 L490.0,110.8 L495.0,113.9 L500.0,117.2 L505.0,120.7 L510.0,124.4 L515.0,128.4 L520.0,132.5 L525.0,136.9 L530.0,141.4 L535.0,146.2 L540.0,151.2 L545.0,156.4 L550.0,161.8 L555.0,167.5 L560.0,173.3 L565.0,179.4 L570.0,185.6 L575.0,192.1 L580.0,198.8 L585.0,205.7 L590.0,212.8 L595.0,220.2 L600.0,227.7 L605.0,235.5 L610.0,243.4 L615.0,251.6 L620.0,260.0" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
<line x1="620" y1="260" x2="710" y2="260" stroke="#047857" stroke-width="3"/>
<text x="640" y="278" text-anchor="start" font-size="10" fill="#374151">beyond b: weight 0</text>
<circle cx="420" cy="90" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="420" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">C</text>
<circle cx="520.0" cy="132.5" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="520.0" y="136.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">B</text>
<circle cx="680" cy="244" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="680" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
<text x="538.0" y="126.5" text-anchor="start" font-size="11" fill="#92400E">0.75</text>
<text x="438" y="94" text-anchor="start" font-size="10" fill="#374151">inside the collider: 1</text>
<rect x="20" y="330" width="720" height="126" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="354" text-anchor="middle" font-size="12" fill="#1F2937">weight = volume weight x ( 1 - d squared / b squared ) for d up to b, otherwise 0</text>
<text x="380" y="374" text-anchor="middle" font-size="12" fill="#1F2937">each overridden value = lerp( value from lower priority volumes, this volume's value, weight )</text>
<text x="380" y="398" text-anchor="middle" font-size="12" fill="#374151">Exposure example: global Fixed exposure 12 EV100, nook override 9 EV100</text>
<text x="380" y="416" text-anchor="middle" font-size="12" fill="#374151">A: 12 (weight 0)      B: 12 + 0.75 x (9 - 12) = 9.75      C: 9 (weight 1)</text>
<text x="380" y="438" text-anchor="middle" font-size="11" fill="#374151">Higher Priority volumes are applied later and win where both have influence.</text>
</svg>
