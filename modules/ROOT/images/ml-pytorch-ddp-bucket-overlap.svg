<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">DDP overlaps all-reduce with backward</title>
<desc id="d">A timeline with two lanes. The backward pass computes gradients for layers four, three, two and one in that order. As soon as all gradients of a bucket are ready its all-reduce starts on the communication lane while the backward pass continues, so only the last bucket is exposed.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One DDP backward pass on one rank</text>
<text x="20" y="92" font-size="13" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">Compute</text>
<text x="20" y="170" font-size="13" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">Comms</text>
<rect x="90" y="66" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="150" y="93" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">grad L4</text>
<rect x="210" y="66" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="270" y="93" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">grad L3</text>
<rect x="330" y="66" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="390" y="93" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">grad L2</text>
<rect x="450" y="66" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="510" y="93" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">grad L1</text>
<rect x="270" y="144" width="180" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="171" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">all-reduce bucket 0</text>
<rect x="570" y="144" width="130" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="635" y="171" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">all-reduce bkt 1</text>
<line x1="270" y1="112" x2="290" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="570" y1="112" x2="590" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="283" cy="127" r="11" fill="#0F766E"/><text x="283" y="132" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>
<circle cx="583" cy="127" r="11" fill="#B45309"/><text x="583" y="132" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text>
<line x1="90" y1="214" x2="700" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="232" font-size="12" fill="#475569" text-anchor="end" font-family="Arial, Helvetica, sans-serif">time</text>
<text x="360" y="256" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1: gradients of L4 and L3 fill bucket 0, so its all-reduce overlaps the backward compute of L2 and L1.</text>
<text x="360" y="276" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2: bucket 1 (L2, L1) can only start when the backward pass ends; this tail is the exposed communication.</text>
</svg>
