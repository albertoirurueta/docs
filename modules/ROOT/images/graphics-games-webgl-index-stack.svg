<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From JavaScript to the GPU</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="140" y="48" width="480" height="48" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="162" cy="72" r="11" fill="#4F46E5"/>
<text x="162" y="76.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="184" y="69" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">Your JavaScript</text>
<text x="184" y="86" font-size="11" fill="#374151" text-anchor="start">three.js, Babylon.js or raw calls to gl.drawArrays</text>
<line x1="380" y1="96" x2="380" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="108" width="480" height="48" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="162" cy="132" r="11" fill="#4F46E5"/>
<text x="162" y="136.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="184" y="129" font-size="13" fill="#3730A3" text-anchor="start" font-weight="bold">WebGL API in the page</text>
<text x="184" y="146" font-size="11" fill="#374151" text-anchor="start">WebGL2RenderingContext, GLSL ES 3.00 shader text, typed arrays</text>
<line x1="380" y1="156" x2="380" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="168" width="480" height="48" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="162" cy="192" r="11" fill="#4B5563"/>
<text x="162" y="196.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="184" y="189" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Browser GPU process</text>
<text x="184" y="206" font-size="11" fill="#374151" text-anchor="start">validates every call, isolates the page, owns the real context</text>
<line x1="380" y1="216" x2="380" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="228" width="480" height="48" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="162" cy="252" r="11" fill="#B45309"/>
<text x="162" y="256.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="184" y="249" font-size="13" fill="#92400E" text-anchor="start" font-weight="bold">ANGLE (Chrome, Firefox on Windows) or a native GL driver</text>
<text x="184" y="266" font-size="11" fill="#374151" text-anchor="start">translates OpenGL ES calls and GLSL ES to the native API</text>
<line x1="380" y1="276" x2="380" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="288" width="480" height="48" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="162" cy="312" r="11" fill="#4B5563"/>
<text x="162" y="316.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="184" y="309" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Native graphics API</text>
<text x="184" y="326" font-size="11" fill="#374151" text-anchor="start">Direct3D 11, Metal, Vulkan or OpenGL</text>
<line x1="380" y1="336" x2="380" y2="348" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="348" width="480" height="48" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<circle cx="162" cy="372" r="11" fill="#047857"/>
<text x="162" y="376.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="184" y="369" font-size="13" fill="#065F46" text-anchor="start" font-weight="bold">Driver and GPU</text>
<text x="184" y="386" font-size="11" fill="#374151" text-anchor="start">compiles the shaders and runs the draw calls</text>
<text x="380" y="412" font-size="11" fill="#374151" text-anchor="middle">WebGPU skips the OpenGL ES layer and talks to Direct3D 12, Metal or Vulkan through the same browser process</text>
</svg>
