<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How a Liquid filter chain is evaluated, and the t then money mistake</title>
  <desc>Each filter receives the output of the previous one. The first row applies money to the translated sentence and prints a wrong amount; the second row formats the number first and passes the text to the translation as an argument.</desc>
  <defs>
    <marker id="lfc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">A filter chain runs left to right on the previous result</text>
  <text x="480" y="48" font-size="12" fill="#7b8794" text-anchor="middle">Arguments cannot contain filters, so format the value first and pass the result in</text>

  <!-- wrong -->
  <rect x="20" y="66" width="920" height="140" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="90" font-size="13" font-weight="bold" fill="#922b21">Wrong: money formats the sentence, not the number</text>
  <text x="36" y="110" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{{ 'cart.free_shipping_missing' | t: amount: missing | money }}</text>
  <rect x="40" y="128" width="250" height="56" rx="6" fill="#fadbd8" stroke="#c0392b"/>
  <text x="165" y="150" font-size="11.5" fill="#1f2933" text-anchor="middle">1. t with amount = 810</text>
  <text x="165" y="168" font-size="10.5" fill="#1f2933" text-anchor="middle">"Add 810 more for free shipping to Spain"</text>
  <line x1="292" y1="156" x2="352" y2="156" stroke="#7b8794" stroke-width="2" marker-end="url(#lfc-arrow)"/>
  <rect x="356" y="128" width="250" height="56" rx="6" fill="#fadbd8" stroke="#c0392b"/>
  <text x="481" y="150" font-size="11.5" fill="#1f2933" text-anchor="middle">2. money of that sentence</text>
  <text x="481" y="168" font-size="11" fill="#1f2933" text-anchor="middle">the text is not a number: 0</text>
  <line x1="608" y1="156" x2="668" y2="156" stroke="#7b8794" stroke-width="2" marker-end="url(#lfc-arrow)"/>
  <rect x="672" y="128" width="248" height="56" rx="6" fill="#922b21"/>
  <text x="796" y="150" font-size="11.5" fill="#ffffff" text-anchor="middle">printed</text>
  <text x="796" y="168" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">€0.00</text>

  <!-- right -->
  <rect x="20" y="222" width="920" height="150" rx="8" fill="#e3f4ea" stroke="#1e8449" stroke-width="1.5"/>
  <text x="36" y="246" font-size="13" font-weight="bold" fill="#14653a">Right: assign the formatted value, then translate</text>
  <text x="36" y="266" font-family="Courier New, monospace" font-size="12" fill="#1f2933">{% assign missing_formatted = missing | money %}  {{ 'cart.free_shipping_missing' | t: amount: missing_formatted }}</text>
  <rect x="40" y="284" width="250" height="56" rx="6" fill="#d5f0e0" stroke="#1e8449"/>
  <text x="165" y="306" font-size="11.5" fill="#1f2933" text-anchor="middle">1. money of 810</text>
  <text x="165" y="324" font-size="11" fill="#1f2933" text-anchor="middle">"€8.10"</text>
  <line x1="292" y1="312" x2="352" y2="312" stroke="#7b8794" stroke-width="2" marker-end="url(#lfc-arrow)"/>
  <rect x="356" y="284" width="250" height="56" rx="6" fill="#d5f0e0" stroke="#1e8449"/>
  <text x="481" y="306" font-size="11.5" fill="#1f2933" text-anchor="middle">2. t with amount = "€8.10"</text>
  <text x="481" y="324" font-size="11" fill="#1f2933" text-anchor="middle">fills the placeholder</text>
  <line x1="608" y1="312" x2="668" y2="312" stroke="#7b8794" stroke-width="2" marker-end="url(#lfc-arrow)"/>
  <rect x="672" y="284" width="248" height="56" rx="6" fill="#14653a"/>
  <text x="796" y="306" font-size="11.5" fill="#ffffff" text-anchor="middle">printed</text>
  <text x="796" y="324" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Add €8.10 more for free shipping to Spain</text>

  <text x="480" y="392" font-size="12" fill="#7b8794" text-anchor="middle">Observed with the Pocket Coffee free-shipping snippet and stub filters; the evaluation order is the Liquid rule</text>
</svg>
