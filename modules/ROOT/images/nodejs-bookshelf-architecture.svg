<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf on Node.js: the components built in this section</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">mostly built-ins; third-party libraries only where a page needs them</text>

  <!-- clients -->
  <rect x="20" y="70" width="150" height="150" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="95" y="92" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="95" y="120" font-size="11" fill="#444444" text-anchor="middle">browser and curl</text>
  <text x="95" y="142" font-size="11" fill="#444444" text-anchor="middle">bookshelf CLI</text>
  <text x="95" y="164" font-size="11" fill="#444444" text-anchor="middle">SSE listeners</text>
  <text x="95" y="186" font-size="11" fill="#444444" text-anchor="middle">WebSocket clients</text>

  <!-- API -->
  <rect x="230" y="70" width="290" height="150" fill="#eef5ea" stroke="#2f5424" stroke-width="1.6"/>
  <text x="375" y="92" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">bookshelf-api (one Node.js process)</text>
  <text x="375" y="120" font-size="11" fill="#444444" text-anchor="middle">node:http + URLPattern routing</text>
  <text x="375" y="142" font-size="11" fill="#444444" text-anchor="middle">authentication and sessions</text>
  <text x="375" y="164" font-size="11" fill="#444444" text-anchor="middle">streaming CSV import (pipeline + zlib)</text>
  <text x="375" y="186" font-size="11" fill="#444444" text-anchor="middle">fetch for ISBN lookups, node:test suites</text>

  <!-- data -->
  <rect x="580" y="70" width="160" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="660" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">node:sqlite</text>
  <text x="660" y="118" font-size="11" fill="#444444" text-anchor="middle">or PostgreSQL, MongoDB</text>
  <rect x="580" y="150" width="160" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="660" y="174" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Redis / RabbitMQ</text>
  <text x="660" y="198" font-size="11" fill="#444444" text-anchor="middle">cache, BullMQ, queues</text>

  <!-- arrows -->
  <line x1="170" y1="145" x2="228" y2="145" stroke="#444444" stroke-width="1.6"/>
  <polygon points="228,145 218,140 218,150" fill="#444444"/>
  <line x1="520" y1="105" x2="578" y2="105" stroke="#444444" stroke-width="1.6"/>
  <polygon points="578,105 568,100 568,110" fill="#444444"/>
  <line x1="520" y1="185" x2="578" y2="185" stroke="#444444" stroke-width="1.6"/>
  <polygon points="578,185 568,180 568,190" fill="#444444"/>

  <!-- workers -->
  <rect x="230" y="260" width="290" height="70" fill="#fdf3e1" stroke="#a15c00" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="375" y="284" font-size="13" font-weight="bold" fill="#a15c00" text-anchor="middle">worker_threads pool, child processes</text>
  <text x="375" y="306" font-size="11" fill="#444444" text-anchor="middle">cover-image hashing, CPU-bound work off the main thread</text>
  <line x1="375" y1="220" x2="375" y2="258" stroke="#a15c00" stroke-width="1.6"/>
  <polygon points="375,258 370,248 380,248" fill="#a15c00"/>

  <!-- cluster -->
  <rect x="20" y="260" width="170" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="105" y="284" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">cluster</text>
  <text x="105" y="306" font-size="11" fill="#444444" text-anchor="middle">one process per CPU core</text>

  <!-- deployment -->
  <rect x="20" y="365" width="720" height="70" fill="#eaf1fb" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="380" y="389" font-size="13" font-weight="bold" fill="#1f4e8c" text-anchor="middle">Deployment</text>
  <text x="380" y="411" font-size="11" fill="#444444" text-anchor="middle">Docker image, single executable CLI, graceful shutdown on SIGTERM, health checks, logging and diagnostics</text>
  <line x1="375" y1="330" x2="375" y2="363" stroke="#1f4e8c" stroke-width="1.6"/>
  <polygon points="375,363 370,353 380,353" fill="#1f4e8c"/>
</svg>
