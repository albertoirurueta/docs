<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" aria-labelledby="backend-downloads-npm-t backend-downloads-npm-d">
<title id="backend-downloads-npm-t">npm downloads, 12 months to 2026-06</title>
<desc id="backend-downloads-npm-d">npm downloads, 12 months to 2026-06. Window ends 2026-06 because the npm API has no-data days in July to September 2026</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="362" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">npm downloads, 12 months to 2026-06</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Downloads (millions, npm only)</text></g></g><line class="grid" x1="104" y1="78" x2="104" y2="260"/><text class="muted" x="104" y="278" text-anchor="middle">0</text><line class="grid" x1="264" y1="78" x2="264" y2="260"/><text class="muted" x="264" y="278" text-anchor="middle">1000</text><line class="grid" x1="424" y1="78" x2="424" y2="260"/><text class="muted" x="424" y="278" text-anchor="middle">2000</text><line class="grid" x1="584" y1="78" x2="584" y2="260"/><text class="muted" x="584" y="278" text-anchor="middle">3000</text><line class="grid" x1="744" y1="78" x2="744" y2="260"/><text class="muted" x="744" y="278" text-anchor="middle">4000</text><path class="axis" d="M104 78V260H744"/><text x="96" y="95" text-anchor="end">Express</text><rect class="f0" x="104" y="82" width="562.06" height="18"/><text class="muted" x="671.06" y="95">3512.9M</text><text x="96" y="121" text-anchor="end">Hono</text><rect class="f0" x="104" y="108" width="134.53" height="18"/><text class="muted" x="243.53" y="121">840.8M</text><text x="96" y="147" text-anchor="end">NestJS</text><rect class="f0" x="104" y="134" width="57.96" height="18"/><text class="muted" x="166.96" y="147">362.3M</text><text x="96" y="173" text-anchor="end">Koa</text><rect class="f0" x="104" y="160" width="48.2" height="18"/><text class="muted" x="157.2" y="173">301.2M</text><text x="96" y="199" text-anchor="end">Fastify</text><rect class="f0" x="104" y="186" width="37.84" height="18"/><text class="muted" x="146.84" y="199">236.5M</text><text x="96" y="225" text-anchor="end">Elysia</text><rect class="f0" x="104" y="212" width="2.34" height="18"/><text class="muted" x="111.34" y="225">14.7M</text><text x="96" y="251" text-anchor="end">AdonisJS</text><rect class="f0" x="104" y="238" width="0.54" height="18"/><text class="muted" x="109.54" y="251">3.4M</text><text class="axis-label" x="424" y="300" text-anchor="middle">Downloads (millions, npm only)</text><text class="axis-label" transform="translate(16 169) rotate(-90)" text-anchor="middle">Framework (package)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="326" text-anchor="start"><tspan x="24" dy="0">Sources: npm-downloads (see the Bibliography). Data as of 2026-10-27. Window ends 2026-06 because the npm API has no-data days in July</tspan><tspan x="24" dy="15">to September 2026.</tspan></text>
</svg>
