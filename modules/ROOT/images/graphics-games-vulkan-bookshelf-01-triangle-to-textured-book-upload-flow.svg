<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-b01-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Getting the cover texture to the GPU</text>
<rect x="20" y="60" width="140" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="90.0" y="87.0" text-anchor="middle" font-size="11" fill="#374151">Image file</text>
<text x="90.0" y="102.0" text-anchor="middle" font-size="11" fill="#374151">PNG or KTX2</text>
<rect x="200" y="60" width="150" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="275.0" y="87.0" text-anchor="middle" font-size="11" fill="#92400E">Staging buffer</text>
<text x="275.0" y="102.0" text-anchor="middle" font-size="11" fill="#92400E">host visible, mapped</text>
<rect x="390" y="60" width="150" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="87.0" text-anchor="middle" font-size="11" fill="#065F46">VkImage</text>
<text x="465.0" y="102.0" text-anchor="middle" font-size="11" fill="#065F46">device local, all mips</text>
<rect x="580" y="60" width="160" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="660.0" y="87.0" text-anchor="middle" font-size="11" fill="#3730A3">ImageView + sampler</text>
<text x="660.0" y="102.0" text-anchor="middle" font-size="11" fill="#3730A3">sRGB, linear, aniso</text>
<line x1="160" y1="90" x2="198" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<line x1="350" y1="90" x2="388" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<line x1="540" y1="90" x2="578" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<text x="180" y="80" text-anchor="middle" font-size="10" fill="#374151">decode</text>
<text x="370" y="80" text-anchor="middle" font-size="10" fill="#374151">copy</text>
<text x="560" y="80" text-anchor="middle" font-size="10" fill="#374151">view</text>
<text x="380" y="160" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Layout of the image during the upload</text>
<rect x="20" y="185" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="214.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">UNDEFINED</text>
<line x1="180" y1="210" x2="200" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<rect x="200" y="185" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="207.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">TRANSFER_DST</text>
<text x="280.0" y="222.0" text-anchor="middle" font-size="11" fill="#3730A3">copy buffer to mip 0</text>
<line x1="360" y1="210" x2="380" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<rect x="380" y="185" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="460.0" y="207.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">TRANSFER_SRC/DST</text>
<text x="460.0" y="222.0" text-anchor="middle" font-size="11" fill="#3730A3">blit mip n to n+1</text>
<line x1="540" y1="210" x2="560" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-up)"/>
<rect x="560" y="185" width="160" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="207.0" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">SHADER_READ_ONLY</text>
<text x="640.0" y="222.0" text-anchor="middle" font-size="11" fill="#065F46">sampled by fragments</text>
<text x="100" y="262" text-anchor="middle" font-size="10" fill="#374151">barrier2 after each</text>
<text x="100" y="275" text-anchor="middle" font-size="10" fill="#374151">step</text>
<text x="280" y="262" text-anchor="middle" font-size="10" fill="#374151">copy region 0</text>
<text x="280" y="275" text-anchor="middle" font-size="10" fill="#374151">(vkCmdCopyBufferToImage2)</text>
<text x="460" y="262" text-anchor="middle" font-size="10" fill="#374151">one barrier per</text>
<text x="460" y="275" text-anchor="middle" font-size="10" fill="#374151">mip level</text>
<text x="640" y="262" text-anchor="middle" font-size="10" fill="#374151">fragment shader stage,</text>
<text x="640" y="275" text-anchor="middle" font-size="10" fill="#374151">shader sampled read</text>
<text x="380" y="310" text-anchor="middle" font-size="11" fill="#374151">Everything runs in one command buffer on the graphics queue, then a fence is waited once at load time</text>
</svg>
