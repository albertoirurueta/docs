<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 276" width="1080" height="276" role="img" aria-labelledby="sap-general-guide-query-odata-services-06-page-and-count-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-query-odata-services-06-page-and-count-title">Terminal with four curl commands: the first page of five claims with the count 12 (callout 10), the third page with the two claims Train Lisbon and Client dinner (callout 11), the count 7 of the claims above 50 with an empty value list (callout 12), and the path Claims/$count that answers 12; the long answers wrap onto a second line</title>
<g><rect x="0" y="0" width="1080" height="276" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="244" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/query/Claims?$top=5&amp;$orderby=ID&amp;$select=title&amp;$count=true'</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims&quot;,&quot;@odata.count&quot;:12,&quot;value&quot;:[{&quot;title&quot;:&quot;Train ticket&quot;,&quot;ID&quot;:1},{&quot;title&quot;:&quot;Hotel Madrid</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;,&quot;ID&quot;:2},{&quot;title&quot;:&quot;Taxi&quot;,&quot;ID&quot;:3},{&quot;title&quot;:&quot;Conference fee&quot;,&quot;ID&quot;:4},{&quot;title&quot;:&quot;Team lunch&quot;,&quot;ID&quot;:5}]}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/query/Claims?$top=5&amp;$skip=10&amp;$orderby=ID&amp;$select=title&amp;$count=true'</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims&quot;,&quot;@odata.count&quot;:12,&quot;value&quot;:[{&quot;title&quot;:&quot;Train Lisbon&quot;,&quot;ID&quot;:11},{&quot;title&quot;:&quot;Client dinn</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">er&quot;,&quot;ID&quot;:12}]}</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/query/Claims?$filter=amount%20gt%2050&amp;$count=true&amp;$top=0'</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims&quot;,&quot;@odata.count&quot;:7,&quot;value&quot;:[]}</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/query/Claims/$count'</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">12</text>
<rect x="5" y="46" width="1042" height="65" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g>
<rect x="5" y="109" width="1042" height="65" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="109" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="114" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">11</text></g>
<rect x="5" y="172" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="172" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="177" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">12</text></g></g>
</svg>
