<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Smart Object slot lifecycle</text>
<rect x="30" y="70" width="140" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="94.7" text-anchor="middle" font-size="12" fill="#3730A3">Smart Object</text>
<text x="100.0" y="109.7" text-anchor="middle" font-size="12" fill="#3730A3">Definition (asset)</text>
<text x="108" y="160" text-anchor="start" font-size="11" fill="#374151">slots, tags,</text>
<text x="108" y="174" text-anchor="start" font-size="11" fill="#374151">behaviors</text>
<rect x="30" y="200" width="140" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="224.7" text-anchor="middle" font-size="12" fill="#3730A3">Smart Object</text>
<text x="100.0" y="239.7" text-anchor="middle" font-size="12" fill="#3730A3">Component on an Actor</text>
<line x1="100" y1="126" x2="100" y2="200" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#s1)"/>
<rect x="210" y="90" width="150" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="285.0" y="117.2" text-anchor="middle" font-size="12" fill="#065F46">Free</text>
<text x="285.0" y="135.2" text-anchor="middle" font-size="12" fill="#065F46">slot is available</text>
<rect x="400" y="90" width="150" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="475.0" y="117.2" text-anchor="middle" font-size="12" fill="#92400E">Claimed</text>
<text x="475.0" y="135.2" text-anchor="middle" font-size="12" fill="#92400E">reserved by one agent</text>
<rect x="590" y="90" width="150" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="665.0" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3">Occupied</text>
<text x="665.0" y="135.2" text-anchor="middle" font-size="12" fill="#3730A3">agent is using it</text>
<line x1="360" y1="122" x2="398" y2="122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#s1)"/>
<line x1="550" y1="122" x2="588" y2="122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#s1)"/>
<text x="379" y="112" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Claim</text>
<text x="569" y="112" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Use</text>
<path d="M665,154 C665,205 285,205 285,156" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#s1)"/>
<text x="475" y="222" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Release (the agent must release its slot)</text>
<rect x="190" y="245" width="550" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="465.0" y="268.4" text-anchor="middle" font-size="11" fill="#1F2937">FindSmartObjects searches by tags, activity tags, behavior</text>
<text x="465.0" y="285.4" text-anchor="middle" font-size="11" fill="#1F2937">definition class and area, and returns the free slots.</text>
<text x="465.0" y="302.4" text-anchor="middle" font-size="11" fill="#1F2937">Claim returns a handle; Use returns the behavior definition.</text>
<text x="465.0" y="319.4" text-anchor="middle" font-size="11" fill="#1F2937">OnSlotInvalidatedDelegate tells an agent its slot was released.</text>
</svg>
