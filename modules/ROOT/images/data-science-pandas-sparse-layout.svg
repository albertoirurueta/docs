<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Dense and sparse storage of the same eight values</title>
  <desc id="d">A dense array stores eight cells, of which five equal the fill value zero. The SparseArray keeps only the three stored values 1, 2 and 3 together with their positions 2, 3 and 7, and the single fill value zero.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Same data, two layouts (fill_value = 0)</text>
  <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Dense: every position is stored</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#0F172A">
    <rect x="40" y="82" width="64" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="72" y="108">0</text>
    <rect x="114" y="82" width="64" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="146" y="108">0</text>
    <rect x="188" y="82" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="220" y="108">1</text>
    <rect x="262" y="82" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="294" y="108">2</text>
    <rect x="336" y="82" width="64" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="368" y="108">0</text>
    <rect x="410" y="82" width="64" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="442" y="108">0</text>
    <rect x="484" y="82" width="64" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="516" y="108">0</text>
    <rect x="558" y="82" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="590" y="108">3</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="72" y="140">0</text><text x="146" y="140">1</text><text x="220" y="140">2</text><text x="294" y="140">3</text>
    <text x="368" y="140">4</text><text x="442" y="140">5</text><text x="516" y="140">6</text><text x="590" y="140">7</text>
  </g>
  <line x1="330" y1="154" x2="330" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="344" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">drop everything equal to the fill value</text>
  <text x="24" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">SparseArray: values, positions, one fill value</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#0F172A">
    <text x="40" y="244" text-anchor="start" font-size="14">sp_values</text>
    <rect x="160" y="226" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="192" y="252">1</text>
    <rect x="234" y="226" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="266" y="252">2</text>
    <rect x="308" y="226" width="64" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="340" y="252">3</text>
    <text x="40" y="294" text-anchor="start" font-size="14">sp_index</text>
    <rect x="160" y="276" width="64" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="192" y="302">2</text>
    <rect x="234" y="276" width="64" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="266" y="302">3</text>
    <rect x="308" y="276" width="64" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="340" y="302">7</text>
    <text x="420" y="252" text-anchor="start" font-size="14">fill_value = 0</text>
    <text x="420" y="302" text-anchor="start" font-size="14">density = 3 / 8 = 0.375</text>
  </g>
</svg>
