<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="350" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What to keep from the books and what to replace</text>
<rect x="24" y="46" width="346" height="284" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="197" y="70" font-size="14" fill="#047857" text-anchor="middle" font-weight="bold">Keep: the ideas</text>
<text x="44" y="96" font-size="12" fill="#374151" text-anchor="start">Actors, components and the gameplay framework</text>
<text x="44" y="120" font-size="12" fill="#374151" text-anchor="start">The Blueprint graph and its flow control</text>
<text x="44" y="144" font-size="12" fill="#374151" text-anchor="start">Reflection macros and the UObject model</text>
<text x="44" y="168" font-size="12" fill="#374151" text-anchor="start">Collision channels, hit and overlap, traces</text>
<text x="44" y="192" font-size="12" fill="#374151" text-anchor="start">Materials as node graphs</text>
<text x="44" y="216" font-size="12" fill="#374151" text-anchor="start">Authority, replication and RPCs</text>
<text x="44" y="240" font-size="12" fill="#374151" text-anchor="start">Behaviour trees and the Blackboard</text>
<text x="44" y="282" font-size="12" fill="#047857" text-anchor="start" font-weight="bold">The book projects still teach well</text>
<text x="44" y="302" font-size="12" fill="#374151" text-anchor="start">when you rebuild them on current systems.</text>
<rect x="390" y="46" width="346" height="284" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="563" y="70" font-size="14" fill="#92400E" text-anchor="middle" font-weight="bold">Replace: what is typed and clicked</text>
<text x="410" y="96" font-size="12" fill="#374151" text-anchor="start">Input bindings and sensing components</text>
<text x="410" y="120" font-size="12" fill="#374151" text-anchor="start">Matinee, Cascade and World Composition</text>
<text x="410" y="144" font-size="12" fill="#374151" text-anchor="start">Static-first lighting workflows</text>
<text x="410" y="168" font-size="12" fill="#374151" text-anchor="start">Constructors with FObjectInitializer</text>
<text x="410" y="192" font-size="12" fill="#374151" text-anchor="start">Toolchains, NDK versions and upload formats</text>
<text x="410" y="216" font-size="12" fill="#374151" text-anchor="start">Royalty terms and licence advice</text>
<text x="410" y="240" font-size="12" fill="#374151" text-anchor="start">Links to retired community sites</text>
<text x="410" y="282" font-size="12" fill="#92400E" text-anchor="start" font-weight="bold">Check the version in every tutorial</text>
<text x="410" y="302" font-size="12" fill="#374151" text-anchor="start">before copying menu paths or code.</text>
</svg>
