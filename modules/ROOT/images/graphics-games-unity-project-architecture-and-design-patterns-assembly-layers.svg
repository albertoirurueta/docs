<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-arch-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Bookshelf assemblies: dependencies point downward only</text>
<rect x="20" y="50" width="720" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="80.0" text-anchor="middle" font-size="12" fill="#92400E">Bookshelf.Game  (Boot scene, composition root: wires services, loads scenes)</text>
<rect x="20" y="130" width="230" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="158.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Bookshelf.Gameplay</text>
<text x="135.0" y="174.0" text-anchor="middle" font-size="12" fill="#3730A3">Shelf, Book, Score,</text>
<text x="135.0" y="190.0" text-anchor="middle" font-size="12" fill="#3730A3">Timer, Spawner</text>
<rect x="265" y="130" width="230" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="158.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Bookshelf.Input</text>
<text x="380.0" y="174.0" text-anchor="middle" font-size="12" fill="#3730A3">Input actions wrapper,</text>
<text x="380.0" y="190.0" text-anchor="middle" font-size="12" fill="#3730A3">PlayerInput bridge</text>
<rect x="510" y="130" width="230" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="625.0" y="158.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Bookshelf.UI</text>
<text x="625.0" y="174.0" text-anchor="middle" font-size="12" fill="#3730A3">HUD views, presenters,</text>
<text x="625.0" y="190.0" text-anchor="middle" font-size="12" fill="#3730A3">UI Toolkit documents</text>
<rect x="20" y="245" width="350" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="268.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Bookshelf.Core  (no Unity scene types)</text>
<text x="195.0" y="284.0" text-anchor="middle" font-size="12" fill="#1F2937">Event channels, IGameServices, pools,</text>
<text x="195.0" y="300.0" text-anchor="middle" font-size="12" fill="#1F2937">state machine base, command interfaces</text>
<rect x="390" y="245" width="350" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="268.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Bookshelf.Editor</text>
<text x="565.0" y="284.0" text-anchor="middle" font-size="12" fill="#374151">Editor-only: custom inspectors, menu items,</text>
<text x="565.0" y="300.0" text-anchor="middle" font-size="12" fill="#374151">Include Platforms = Editor only</text>
<rect x="20" y="345" width="720" height="52" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="375.0" text-anchor="middle" font-size="12" fill="#374151">Bookshelf.Tests.EditMode / Bookshelf.Tests.PlayMode  (reference the assemblies they test)</text>
<line x1="135" y1="102" x2="135" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="380" y1="102" x2="380" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="625" y1="102" x2="625" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="135" y1="210" x2="135" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="380" y1="210" x2="340" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="625" y1="210" x2="340" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-arch-layers)"/>
<line x1="565" y1="210" x2="565" y2="245" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-arch-layers)"/>
<text x="380" y="333" text-anchor="middle" font-size="11" fill="#374151">Core never references Gameplay, Input or UI; the other assemblies reference Core.</text>
<text x="380" y="415" text-anchor="middle" font-size="11" fill="#92400E">An assembly definition (.asmdef) per folder: references are explicit, so a forbidden dependency is a compile error.</text>
</svg>
