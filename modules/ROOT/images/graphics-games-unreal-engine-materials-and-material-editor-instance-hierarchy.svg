<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Parent material, constant instance and dynamic instance</text>
<rect x="285" y="50" width="190" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="76.7" text-anchor="middle" font-size="12" fill="#3730A3">M_Book (UMaterial)</text>
<text x="380.0" y="91.7" text-anchor="middle" font-size="12" fill="#3730A3">graph, compiled shaders</text>
<rect x="285" y="150" width="190" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="176.7" text-anchor="middle" font-size="12" fill="#065F46">MI_Book_Leather</text>
<text x="380.0" y="191.7" text-anchor="middle" font-size="12" fill="#065F46">UMaterialInstanceConstant</text>
<rect x="285" y="250" width="190" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="276.7" text-anchor="middle" font-size="12" fill="#92400E">MID at runtime</text>
<text x="380.0" y="291.7" text-anchor="middle" font-size="12" fill="#92400E">UMaterialInstanceDynamic</text>
<line x1="380" y1="110" x2="380" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<line x1="380" y1="210" x2="380" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#c3)"/>
<text x="150" y="75" text-anchor="middle" font-size="11" fill="#3730A3">Defines the parameters:</text>
<text x="150" y="90" text-anchor="middle" font-size="11" fill="#3730A3">CoverColor, CoverTex,</text>
<text x="150" y="105" text-anchor="middle" font-size="11" fill="#3730A3">Roughness</text>
<text x="150" y="120" text-anchor="middle" font-size="11" fill="#3730A3">Edited in the Material Editor;</text>
<text x="150" y="135" text-anchor="middle" font-size="11" fill="#3730A3">a change recompiles shaders</text>
<text x="150" y="175" text-anchor="middle" font-size="11" fill="#065F46">Overrides parameter values</text>
<text x="150" y="190" text-anchor="middle" font-size="11" fill="#065F46">Set in the Instance editor,</text>
<text x="150" y="205" text-anchor="middle" font-size="11" fill="#065F46">no shader recompile for</text>
<text x="150" y="220" text-anchor="middle" font-size="11" fill="#065F46">scalar, vector, texture values</text>
<text x="610" y="270" text-anchor="middle" font-size="11" fill="#92400E">Created by CreateDynamicMaterialInstance</text>
<text x="610" y="285" text-anchor="middle" font-size="11" fill="#92400E">SetScalarParameterValue,</text>
<text x="610" y="300" text-anchor="middle" font-size="11" fill="#92400E">SetVectorParameterValue per book</text>
<text x="610" y="150" text-anchor="middle" font-size="11" fill="#374151">Static switch parameters</text>
<text x="610" y="165" text-anchor="middle" font-size="11" fill="#374151">are compile-time: each used</text>
<text x="610" y="180" text-anchor="middle" font-size="11" fill="#374151">combination is a permutation</text>
</svg>
