<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
<text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which pattern answers which failure mode</text>
<text x="327.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Timeout</text>
<text x="327.5" y="86" font-size="9" fill="#666666" text-anchor="middle">TimeLimiter</text>
<text x="402.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Retry</text>
<text x="402.5" y="86" font-size="9" fill="#666666" text-anchor="middle">Retry</text>
<text x="477.5" y="56" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Circuit</text>
<text x="477.5" y="70" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">breaker</text>
<text x="477.5" y="86" font-size="9" fill="#666666" text-anchor="middle">CircuitBreaker</text>
<text x="552.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Bulkhead</text>
<text x="552.5" y="86" font-size="9" fill="#666666" text-anchor="middle">Bulkhead</text>
<text x="627.5" y="56" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Rate</text>
<text x="627.5" y="70" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">limiter</text>
<text x="627.5" y="86" font-size="9" fill="#666666" text-anchor="middle">RateLimiter</text>
<text x="702.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Fallback</text>
<text x="702.5" y="86" font-size="9" fill="#666666" text-anchor="middle">(your code)</text>
<text x="777.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Cache</text>
<text x="777.5" y="86" font-size="9" fill="#666666" text-anchor="middle">Cache</text>
<text x="852.5" y="63" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Hedge</text>
<text x="852.5" y="86" font-size="9" fill="#666666" text-anchor="middle">Hedge</text>
<rect x="20" y="96" width="870" height="44" fill="#f4f4f4"/>
<text x="30" y="122.0" font-size="12.5" fill="#222222">Slow dependency (latency)</text>
<circle cx="327.5" cy="118.0" r="9" fill="#1c4b73"/>
<circle cx="477.5" cy="118.0" r="9" fill="#1c4b73"/>
<circle cx="552.5" cy="118.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="702.5" cy="118.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="777.5" cy="118.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="852.5" cy="118.0" r="9" fill="#1c4b73"/>
<rect x="20" y="140" width="870" height="44" fill="#ffffff"/>
<text x="30" y="166.0" font-size="12.5" fill="#222222">Transient error (partial failure)</text>
<circle cx="402.5" cy="162.0" r="9" fill="#1c4b73"/>
<circle cx="477.5" cy="162.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="702.5" cy="162.0" r="9" fill="#1c4b73"/>
<circle cx="852.5" cy="162.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<rect x="20" y="184" width="870" height="44" fill="#f4f4f4"/>
<text x="30" y="210.0" font-size="12.5" fill="#222222">Cascading failure</text>
<circle cx="327.5" cy="206.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="477.5" cy="206.0" r="9" fill="#1c4b73"/>
<circle cx="552.5" cy="206.0" r="9" fill="#1c4b73"/>
<circle cx="702.5" cy="206.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<rect x="20" y="228" width="870" height="44" fill="#ffffff"/>
<text x="30" y="254.0" font-size="12.5" fill="#222222">Retry storm / thundering herd</text>
<circle cx="402.5" cy="250.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="477.5" cy="250.0" r="9" fill="#1c4b73"/>
<circle cx="627.5" cy="250.0" r="9" fill="#1c4b73"/>
<circle cx="777.5" cy="250.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<rect x="20" y="272" width="870" height="44" fill="#f4f4f4"/>
<text x="30" y="298.0" font-size="12.5" fill="#222222">Resource exhaustion (threads, sockets)</text>
<circle cx="327.5" cy="294.0" r="9" fill="#1c4b73"/>
<circle cx="552.5" cy="294.0" r="9" fill="#1c4b73"/>
<circle cx="477.5" cy="294.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="627.5" cy="294.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<rect x="20" y="316" width="870" height="44" fill="#ffffff"/>
<text x="30" y="342.0" font-size="12.5" fill="#222222">Quota or overload (too many calls)</text>
<circle cx="627.5" cy="338.0" r="9" fill="#1c4b73"/>
<circle cx="552.5" cy="338.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="777.5" cy="338.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="702.5" cy="338.0" r="8" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<circle cx="40" cy="390" r="8" fill="#1c4b73"/><text x="56" y="394" font-size="11.5" fill="#444444">primary answer</text>
<circle cx="190" cy="390" r="7" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/><text x="205" y="394" font-size="11.5" fill="#444444">helps, or only when configured carefully (retry needs backoff, jitter and idempotency)</text>
<text x="450" y="420" font-size="11" fill="#444444" text-anchor="middle">Patterns are layered: no single one covers every row, which is why they are composed (see Fallbacks and Composition).</text>
</svg>
