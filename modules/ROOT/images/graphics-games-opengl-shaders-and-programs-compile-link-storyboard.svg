<svg viewBox="0 0 760 260" width="760" height="260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-cl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="260" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from GLSL text to a program you can draw with</text>
<rect x="20.0" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36.0" cy="66" r="11" fill="#4F46E5"/>
<text x="36.0" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="30.0" y="86" width="93" height="70" rx="6" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<text x="76.5" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glCreateShader</text>
<text x="76.5" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">make an empty shader</text>
<text x="76.5" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">object of a stage</text>
<text x="76.5" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">type, e.g. vertex</text>
<line x1="133.0" y1="120" x2="141.4" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-cl)"/>
<rect x="141.4" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="157.4" cy="66" r="11" fill="#4F46E5"/>
<text x="157.4" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="151.4" y="86" width="93" height="70" rx="6" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<text x="197.9" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glShaderSource</text>
<text x="197.9" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">hand over the text</text>
<text x="197.9" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">#version line</text>
<text x="197.9" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">must come first</text>
<line x1="254.4" y1="120" x2="262.8" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-cl)"/>
<rect x="262.8" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="278.8" cy="66" r="11" fill="#B45309"/>
<text x="278.8" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="272.8" y="86" width="93" height="70" rx="6" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<text x="319.3" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glCompileShader</text>
<text x="319.3" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">compile one stage</text>
<text x="319.3" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">check</text>
<text x="319.3" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">COMPILE_STATUS</text>
<line x1="375.8" y1="120" x2="384.2" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-cl)"/>
<rect x="384.20000000000005" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="400.20000000000005" cy="66" r="11" fill="#4F46E5"/>
<text x="400.20000000000005" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="394.20000000000005" y="86" width="93" height="70" rx="6" fill="#EEF2FF" stroke="#4B5563" stroke-width="1.2"/>
<text x="440.70000000000005" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glAttachShader</text>
<text x="440.70000000000005" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">attach vs and fs</text>
<text x="440.70000000000005" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">to a program from</text>
<text x="440.70000000000005" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glCreateProgram</text>
<line x1="497.20000000000005" y1="120" x2="505.6" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-cl)"/>
<rect x="505.6" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="521.6" cy="66" r="11" fill="#B45309"/>
<text x="521.6" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="515.6" y="86" width="93" height="70" rx="6" fill="#FEF3C7" stroke="#4B5563" stroke-width="1.2"/>
<text x="562.1" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glLinkProgram</text>
<text x="562.1" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">match interfaces</text>
<text x="562.1" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">check</text>
<text x="562.1" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">LINK_STATUS</text>
<line x1="618.6" y1="120" x2="627.0" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-cl)"/>
<rect x="627.0" y="50" width="113" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="643.0" cy="66" r="11" fill="#4F46E5"/>
<text x="643.0" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="637.0" y="86" width="93" height="70" rx="6" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.2"/>
<text x="683.5" y="116" font-size="9.5" font-weight="bold" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">glUseProgram</text>
<text x="683.5" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">make it current</text>
<text x="683.5" y="182" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">then draw</text>
<text x="683.5" y="197" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">(glDrawArrays)</text>
<text x="20" y="244" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">Amber steps can fail: read the info log with glGetShaderInfoLog / glGetProgramInfoLog before going on.</text>
</svg>
