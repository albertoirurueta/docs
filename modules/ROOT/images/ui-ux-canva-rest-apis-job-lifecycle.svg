<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Life of an asynchronous job</text>
  <g transform="translate(0,20)">
  <rect x="30" y="80" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="105" y="104" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">POST create job</text><text x="105" y="122" font-size="11" fill="#374151" text-anchor="middle">returns job id</text>
  <rect x="270" y="80" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="345" y="104" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">in_progress</text><text x="345" y="122" font-size="11" fill="#374151" text-anchor="middle">GET job, wait, repeat</text>
  <rect x="540" y="56" width="190" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="635" y="76" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">success</text><text x="635" y="94" font-size="11" fill="#92400E" text-anchor="middle">result, or urls for exports</text>
  <rect x="540" y="116" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="635" y="136" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">failed</text><text x="635" y="154" font-size="11" fill="#374151" text-anchor="middle">error code and message</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <path d="M181,108 L269,108" marker-end="url(#ah)"/><path d="M421,100 L539,82" marker-end="url(#ah)"/><path d="M421,116 L539,138" marker-end="url(#ah)"/>
    <path d="M370,81 C370,40 320,40 320,79" marker-end="url(#ah)"/>
  </g>
  <text x="345" y="36" font-size="11" fill="#374151" text-anchor="middle">poll again</text>
  <text x="30" y="204" font-size="13" font-weight="bold" fill="#1F2937">Exponential backoff between polls</text>
  <line x1="30" y1="270" x2="730" y2="270" stroke="#6B7280" stroke-width="1.5"/>
  <g fill="#4F46E5"><circle cx="50" cy="270" r="6"/><circle cx="100" cy="270" r="6"/><circle cx="190" cy="270" r="6"/><circle cx="350" cy="270" r="6"/><circle cx="640" cy="270" r="6"/></g>
  <g font-size="11" fill="#374151" text-anchor="middle"><text x="75" y="256">1 s</text><text x="145" y="256">2 s</text><text x="270" y="256">4 s</text><text x="495" y="256">8 s</text><text x="685" y="256">cap</text></g>
  <text x="380" y="300" font-size="12" fill="#374151" text-anchor="middle">Start short, double the wait each time, stop doubling at a cap, and stop after a deadline.</text>
  <text x="380" y="326" font-size="11" fill="#6B7280" text-anchor="middle">Illustrative intervals, not values mandated by the API.</text>
  </g>
</svg>
