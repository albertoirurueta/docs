<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-uitk-pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How runtime UI reaches the screen</text>
<rect x="20" y="60" width="190" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="115" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">UXML (Visual Tree Asset)</text>
<text x="115" y="101" text-anchor="middle" font-size="11" fill="#92400E">structure of the UI</text>
<text x="115" y="116" text-anchor="middle" font-size="11" fill="#92400E">references its USS files</text>
<rect x="20" y="150" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">UI Document component</text>
<text x="115" y="191" text-anchor="middle" font-size="11" fill="#3730A3">Source Asset, Sort Order</text>
<text x="115" y="206" text-anchor="middle" font-size="11" fill="#3730A3">on a GameObject</text>
<rect x="20" y="240" width="190" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="115" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Your MonoBehaviour</text>
<text x="115" y="281" text-anchor="middle" font-size="11" fill="#374151">OnEnable: Q, callbacks,</text>
<text x="115" y="296" text-anchor="middle" font-size="11" fill="#374151">data source</text>
<rect x="290" y="95" width="200" height="200" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="390" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Panel Settings asset</text>
<text x="390" y="142" text-anchor="middle" font-size="11" fill="#374151">Theme Style Sheet (TSS)</text>
<text x="390" y="160" text-anchor="middle" font-size="11" fill="#374151">Text Settings</text>
<text x="390" y="178" text-anchor="middle" font-size="11" fill="#374151">Render Mode: Screen Space</text>
<text x="390" y="193" text-anchor="middle" font-size="11" fill="#374151">Overlay or World Space</text>
<text x="390" y="211" text-anchor="middle" font-size="11" fill="#374151">Scale Mode and Reference</text>
<text x="390" y="226" text-anchor="middle" font-size="11" fill="#374151">Resolution</text>
<text x="390" y="244" text-anchor="middle" font-size="11" fill="#374151">Target Texture or Display</text>
<text x="390" y="262" text-anchor="middle" font-size="11" fill="#374151">Sort Order, Dynamic Atlas</text>
<text x="390" y="280" text-anchor="middle" font-size="11" fill="#374151">Binding log levels</text>
<rect x="570" y="60" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Game view overlay</text>
<text x="660" y="102" text-anchor="middle" font-size="11" fill="#374151">HUD, menus</text>
<rect x="570" y="140" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">World Space panel</text>
<text x="660" y="182" text-anchor="middle" font-size="11" fill="#374151">labels above books</text>
<rect x="570" y="220" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Render Texture</text>
<text x="660" y="262" text-anchor="middle" font-size="11" fill="#374151">a screen in the scene</text>
<line x1="115" y1="130" x2="115" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<line x1="210" y1="185" x2="290" y2="185" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<line x1="115" y1="240" x2="115" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<line x1="490" y1="150" x2="570" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<line x1="490" y1="190" x2="570" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<line x1="490" y1="235" x2="570" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-pipe)"/>
<rect x="20" y="330" width="720" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="351" text-anchor="middle" font-size="11" fill="#3730A3">Several UI Documents can share one Panel Settings asset and one panel; each has its own Sort Order.</text>
<text x="380" y="368" text-anchor="middle" font-size="11" fill="#3730A3">In Unity 6.5 and later a Panel Renderer component can take the place of the UI Document component.</text>
</svg>
