<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">CRISP-DM cycle</title>
  <desc id="d">Six phases arranged as a cycle: business understanding, data understanding, data preparation, modeling, evaluation and deployment, with back-and-forth arrows between the first two and between data preparation and modeling, and an arrow from evaluation back to business understanding.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">CRISP-DM: six phases, many loops</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0F172A" text-anchor="middle" stroke-width="2">
    <rect x="40" y="70" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="135" y="108">Business understanding</text>
    <rect x="265" y="70" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="360" y="108">Data understanding</text>
    <rect x="490" y="70" width="190" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="585" y="108">Data preparation</text>
    <rect x="490" y="290" width="190" height="64" rx="6" fill="#EDE9FE" stroke="#6D28D9"/><text x="585" y="328">Modeling</text>
    <rect x="265" y="290" width="190" height="64" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="360" y="328">Evaluation</text>
    <rect x="40" y="290" width="190" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="135" y="328">Deployment</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M232,102 L262,102" marker-start="url(#a)"/>
    <path d="M457,102 L487,102"/>
    <path d="M585,136 L585,286" marker-start="url(#a)"/>
    <path d="M488,322 L458,322"/>
    <path d="M263,322 L233,322"/>
    <path d="M135,288 L135,136" stroke-dasharray="6 4"/>
  </g>
  <ellipse cx="360" cy="215" rx="70" ry="34" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Data</text>
  <text x="360" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">at the centre</text>
  <text x="360" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Arrows show the typical order; real projects jump back whenever a later phase exposes a gap.</text>
  <text x="360" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Original drawing of the phases described in the CRISP-DM 1.0 guide.</text>
</svg>
