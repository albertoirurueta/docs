<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From the JDBC URL to the Quartz script on MySQL and MariaDB</text>
  <defs>
    <marker id="msr-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
    <marker id="msr-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a33a3a"/></marker>
  </defs>

  <text x="110" y="62" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">JDBC URL</text>
  <text x="410" y="62" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Spring Boot platform</text>
  <text x="760" y="62" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Script in the Quartz 2.5.2 jar</text>

  <rect x="20" y="80" width="180" height="62" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="110" y="104" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="Menlo, Consolas, monospace">jdbc:mysql://</text>
  <text x="110" y="124" font-size="11" fill="#333333" text-anchor="middle">Connector/J 9.7.0</text>

  <rect x="20" y="170" width="180" height="62" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="110" y="194" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle" font-family="Menlo, Consolas, monospace">jdbc:mariadb://</text>
  <text x="110" y="214" font-size="11" fill="#333333" text-anchor="middle">MariaDB Connector/J 3.5.10</text>

  <rect x="320" y="80" width="180" height="62" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="410" y="104" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">MYSQL</text>
  <text x="410" y="124" font-size="11" fill="#333333" text-anchor="middle">mapped to mysql_innodb</text>

  <rect x="320" y="170" width="180" height="62" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="410" y="194" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">MARIADB</text>
  <text x="410" y="214" font-size="11" fill="#333333" text-anchor="middle">mapped to mysql_innodb</text>

  <line x1="200" y1="111" x2="318" y2="111" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#msr-arrow)"/>
  <line x1="200" y1="201" x2="318" y2="201" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#msr-arrow)"/>

  <rect x="600" y="80" width="320" height="152" rx="8" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="615" y="104" font-size="12.5" font-weight="bold" fill="#2e7d4f" font-family="Menlo, Consolas, monospace">tables_mysql_innodb.sql</text>
  <text x="615" y="126" font-size="11.5" fill="#222222">ENGINE=InnoDB on all 11 tables</text>
  <text x="615" y="146" font-size="11.5" fill="#222222">name columns VARCHAR(190), SCHED_NAME 120</text>
  <text x="615" y="166" font-size="11.5" fill="#222222">20 CREATE INDEX statements (21 secondary</text>
  <text x="615" y="182" font-size="11.5" fill="#222222">indexes measured), foreign keys enforced</text>
  <text x="615" y="206" font-size="11.5" font-weight="bold" fill="#2e7d4f">the script Boot selects for both servers</text>

  <line x1="500" y1="111" x2="598" y2="140" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#msr-arrow)"/>
  <line x1="500" y1="201" x2="598" y2="172" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#msr-arrow)"/>

  <rect x="600" y="270" width="320" height="140" rx="8" fill="#fbeeee" stroke="#a33a3a" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="615" y="294" font-size="12.5" font-weight="bold" fill="#a33a3a" font-family="Menlo, Consolas, monospace">tables_mysql.sql (legacy)</text>
  <text x="615" y="316" font-size="11.5" fill="#222222">no ENGINE clause: the server default decides</text>
  <text x="615" y="336" font-size="11.5" fill="#222222">name columns VARCHAR(200)</text>
  <text x="615" y="356" font-size="11.5" fill="#222222">no CREATE INDEX at all (1 index measured,</text>
  <text x="615" y="372" font-size="11.5" fill="#222222">created by the foreign key)</text>
  <text x="615" y="396" font-size="11.5" font-weight="bold" fill="#a33a3a">never selected by Boot; do not choose it</text>

  <line x1="410" y1="232" x2="410" y2="340" stroke="#a33a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="410" y1="340" x2="598" y2="340" stroke="#a33a3a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#msr-arrow-red)"/>
  <text x="418" y="300" font-size="11" fill="#a33a3a">only if someone sets</text>
  <text x="418" y="316" font-size="11" fill="#a33a3a" font-family="Menlo, Consolas, monospace">spring.quartz.jdbc.schema</text>

  <rect x="20" y="270" width="370" height="140" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="35" y="294" font-size="12.5" font-weight="bold" fill="#1c4b73">What does not change between the two servers</text>
  <text x="35" y="318" font-size="11.5" fill="#222222">Delegate: StdJDBCDelegate (the default, nothing to set)</text>
  <text x="35" y="338" font-size="11.5" fill="#222222">Row lock: SELECT ... FROM QRTZ_LOCKS FOR UPDATE</text>
  <text x="35" y="358" font-size="11.5" fill="#222222">Isolation: server default, REPEATABLE-READ</text>
  <text x="35" y="378" font-size="11.5" fill="#222222">BLOB columns: 65,535 bytes (JOB_DATA, CALENDAR)</text>
  <text x="35" y="398" font-size="11.5" fill="#222222">All four driver and server pairs ran Bookshelf</text>

  <text x="470" y="448" font-size="11" fill="#666666" text-anchor="middle">Measured on mysql:9 (9.7.2) and mariadb:11 (11.8.9), 5 October 2026</text>
</svg>
