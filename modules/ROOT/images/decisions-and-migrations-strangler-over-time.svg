<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The strangler fig over time: the legacy system shrinks as the strangler application grows</text>

  <!-- column headers -->
  <text x="150" y="60" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">Start</text>
  <text x="390" y="60" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">Midway</text>
  <text x="630" y="60" font-size="12.5" font-weight="bold" fill="#444444" text-anchor="middle">End</text>

  <!-- Stage 1: start -->
  <rect x="70" y="80" width="160" height="220" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="150" y="100" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Legacy system</text>
  <text x="150" y="200" font-size="10" fill="#666666" text-anchor="middle">nearly all traffic</text>
  <text x="150" y="214" font-size="10" fill="#666666" text-anchor="middle">and capability</text>

  <rect x="70" y="310" width="160" height="40" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="150" y="335" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">Strangler app</text>

  <line x1="230" y1="150" x2="260" y2="150" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="245" y="140" font-size="9.5" fill="#1c4b73" text-anchor="middle">seam</text>

  <!-- Stage 2: midway -->
  <rect x="310" y="150" width="160" height="150" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="2"/>
  <text x="390" y="170" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Legacy system</text>
  <text x="390" y="230" font-size="10" fill="#666666" text-anchor="middle">shrinking</text>

  <rect x="310" y="80" width="160" height="60" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="390" y="105" font-size="10.5" font-weight="bold" fill="#222222" text-anchor="middle">Strangler app</text>
  <text x="390" y="122" font-size="9.5" fill="#666666" text-anchor="middle">growing -- one capability</text>

  <rect x="310" y="310" width="160" height="40" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="390" y="335" font-size="9.5" fill="#666666" text-anchor="middle">at a time</text>

  <line x1="470" y1="150" x2="500" y2="150" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="485" y="140" font-size="9.5" fill="#1c4b73" text-anchor="middle">seam</text>

  <!-- Stage 3: end -->
  <rect x="550" y="220" width="160" height="30" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="630" y="240" font-size="9.5" fill="#8a1c1c" text-anchor="middle">legacy system removed</text>

  <rect x="550" y="80" width="160" height="260" rx="8" fill="#eef7ef" stroke="#2d6a34" stroke-width="2"/>
  <text x="630" y="105" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Strangler app</text>
  <text x="630" y="200" font-size="10" fill="#666666" text-anchor="middle">handles all traffic</text>
  <text x="630" y="214" font-size="10" fill="#666666" text-anchor="middle">on its own</text>

  <!-- routing seam arrows across all requests -->
  <path d="M40,360 C200,390 580,390 740,360" fill="none" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="2,4"/>
  <text x="390" y="405" font-size="10.5" fill="#1c4b73" text-anchor="middle">every request is routed through the same seam -- the gateway -- at every stage</text>

  <text x="390" y="440" font-size="10.5" fill="#444444" text-anchor="middle">Capability moves from the legacy system into the strangler application piece by piece; the seam</text>
  <text x="390" y="454" font-size="10.5" fill="#444444" text-anchor="middle">keeps routing every request correctly throughout, until nothing legacy is left to route to.</text>
</svg>
