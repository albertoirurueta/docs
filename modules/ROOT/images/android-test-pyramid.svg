<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">TrailMate's test pyramid</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Many, fast checks at the base -- few, slow, high-confidence checks at the top</text>

  <defs>
    <marker id="atp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Tier 4 (bottom, widest): Static Analysis -->
  <polygon points="50,430 710,430 630,360 130,360" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="388" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Static Analysis</text>
  <text x="380" y="406" font-size="10.5" fill="#333333" text-anchor="middle">Android Lint, ktlint, detekt</text>
  <text x="380" y="421" font-size="9.5" fill="#555555" text-anchor="middle">every build, whole codebase -- no test code runs at all</text>

  <!-- Tier 3: Unit Tests (test/) -->
  <polygon points="130,360 630,360 552,288 208,288" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="380" y="316" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Unit Tests -- src/test/</text>
  <text x="380" y="334" font-size="10.5" fill="#333333" text-anchor="middle">JUnit 4/5, Mockito, mockito-kotlin, MockK, Turbine</text>
  <text x="380" y="349" font-size="9.5" fill="#555555" text-anchor="middle">plain JVM, milliseconds, TrailListViewModel / FakeTrailRepository</text>

  <!-- Tier 2: Robolectric -->
  <polygon points="208,288 552,288 478,216 282,216" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.6"/>
  <text x="380" y="244" font-size="13" font-weight="bold" fill="#a35d00" text-anchor="middle">Robolectric Tests -- src/test/</text>
  <text x="380" y="262" font-size="10.5" fill="#333333" text-anchor="middle">ActivityScenario, FragmentScenario, Compose, Room</text>
  <text x="380" y="277" font-size="9.5" fill="#555555" text-anchor="middle">JVM with a simulated Android framework -- seconds, no emulator</text>

  <!-- Tier 1 (top, narrowest): Instrumented / UI -->
  <polygon points="282,216 478,216 380,130" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="380" y="168" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">Instrumented / UI</text>
  <text x="380" y="185" font-size="9.5" fill="#333333" text-anchor="middle">Espresso, Compose</text>
  <text x="380" y="199" font-size="9.5" fill="#333333" text-anchor="middle">UI testing, UI Automator</text>

  <text x="380" y="112" font-size="10" fill="#a33" text-anchor="middle">real device or emulator -- covered separately</text>

  <!-- Speed / count annotation arrow on the right -->
  <line x1="700" y1="425" x2="700" y2="140" stroke="#666666" stroke-width="1.4" marker-end="url(#atp-arrow)"/>
  <text x="722" y="430" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(-90 722,430)">many, fast</text>
  <text x="722" y="160" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(-90 722,160)">few, slow</text>

  <text x="380" y="452" font-size="10.5" fill="#666666" text-anchor="middle">This page covers the bottom two tiers (unit and Robolectric); the top tier is covered separately.</text>
  <text x="380" y="467" font-size="9.5" fill="#888888" text-anchor="middle">Each tier is cheaper and faster to run than the one above it -- and should have more tests than it.</text>
</svg>
