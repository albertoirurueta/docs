<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Road network with the Dijkstra route Turin to Florence</text>

  <!-- roads (drawn under nodes) -->
  <g stroke-linecap="round" fill="none">
    <!-- alternative route via Genoa, second result of Yen's algorithm -->
    <line x1="110" y1="230" x2="280" y2="350" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="8 5"/>
    <line x1="280" y1="350" x2="490" y2="230" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="8 5"/>
    <!-- best route -->
    <line x1="110" y1="230" x2="280" y2="120" stroke="#e67e22" stroke-width="6"/>
    <line x1="280" y1="120" x2="490" y2="230" stroke="#e67e22" stroke-width="6"/>
    <line x1="490" y1="230" x2="640" y2="230" stroke="#e67e22" stroke-width="6"/>
  </g>

  <!-- road labels -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <text x="172" y="156" font-weight="bold" fill="#a04000">140 km</text>
    <text x="406" y="156" font-weight="bold" fill="#a04000">210 km</text>
    <text x="566" y="218" font-weight="bold" fill="#a04000">100 km</text>
    <text x="172" y="310" fill="#555555">170 km</text>
    <text x="406" y="318" fill="#555555">300 km</text>
  </g>

  <!-- nodes -->
  <g stroke-width="2.5" font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="90" cy="230" r="30" fill="#fdebd0" stroke="#e67e22"/>
    <text x="90" y="235" fill="#7e3b00">Turin</text>
    <circle cx="280" cy="120" r="30" fill="#fdebd0" stroke="#e67e22"/>
    <text x="280" y="125" fill="#7e3b00">Milan</text>
    <circle cx="490" cy="230" r="34" fill="#fdebd0" stroke="#e67e22"/>
    <text x="490" y="235" fill="#7e3b00">Bologna</text>
    <circle cx="660" cy="230" r="32" fill="#fdebd0" stroke="#e67e22"/>
    <text x="660" y="235" fill="#7e3b00">Florence</text>
    <circle cx="280" cy="350" r="30" fill="#eef1f4" stroke="#7f8c8d"/>
    <text x="280" y="355" fill="#444444">Genoa</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#222222">
    <line x1="60" y1="398" x2="110" y2="398" stroke="#e67e22" stroke-width="6" stroke-linecap="round"/>
    <text x="120" y="403">Best route: total 450 km (Dijkstra, Yen's rank 1)</text>
    <line x1="60" y1="420" x2="110" y2="420" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text x="120" y="425">Alternative: total 570 km via Genoa (Yen's rank 2)</text>
  </g>
</svg>
