<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">A transpose view shares storage</title>
  <desc id="d">A single storage of six numbers is read by a 2 by 3 tensor with strides 3 and 1 and by its transpose, a 3 by 2 view with strides 1 and 3, without copying data.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">One storage, two views</text>
  <text x="140" y="70" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">x: shape (2, 3)  stride (3, 1)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#0F172A" stroke="#1D4ED8" stroke-width="2">
    <rect x="50" y="85" width="50" height="40" fill="#DBEAFE"/><rect x="100" y="85" width="50" height="40" fill="#DBEAFE"/><rect x="150" y="85" width="50" height="40" fill="#DBEAFE"/>
    <rect x="50" y="125" width="50" height="40" fill="#DBEAFE"/><rect x="100" y="125" width="50" height="40" fill="#DBEAFE"/><rect x="150" y="125" width="50" height="40" fill="#DBEAFE"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#0F172A">
    <text x="75" y="111">0</text><text x="125" y="111">1</text><text x="175" y="111">2</text>
    <text x="75" y="151">3</text><text x="125" y="151">4</text><text x="175" y="151">5</text>
  </g>
  <text x="520" y="70" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">x.T: shape (3, 2)  stride (1, 3)</text>
  <g stroke="#B45309" stroke-width="2" fill="#FEF3C7">
    <rect x="470" y="85" width="50" height="30"/><rect x="520" y="85" width="50" height="30"/>
    <rect x="470" y="115" width="50" height="30"/><rect x="520" y="115" width="50" height="30"/>
    <rect x="470" y="145" width="50" height="30"/><rect x="520" y="145" width="50" height="30"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#0F172A">
    <text x="495" y="106">0</text><text x="545" y="106">3</text>
    <text x="495" y="136">1</text><text x="545" y="136">4</text>
    <text x="495" y="166">2</text><text x="545" y="166">5</text>
  </g>
  <text x="360" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Shared storage (flat, 6 elements)</text>
  <g stroke="#0F766E" stroke-width="2" fill="#CCFBF1" font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="180" y="225" width="60" height="40"/><rect x="240" y="225" width="60" height="40"/><rect x="300" y="225" width="60" height="40"/>
    <rect x="360" y="225" width="60" height="40"/><rect x="420" y="225" width="60" height="40"/><rect x="480" y="225" width="60" height="40"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#0F172A">
    <text x="210" y="251">0</text><text x="270" y="251">1</text><text x="330" y="251">2</text><text x="390" y="251">3</text><text x="450" y="251">4</text><text x="510" y="251">5</text>
  </g>
  <path d="M125 168 L215 222" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M520 178 L480 222" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="360" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">The view only changes shape and strides; no element is copied.</text>
</svg>
