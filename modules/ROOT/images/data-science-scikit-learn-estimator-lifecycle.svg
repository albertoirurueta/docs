<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
<title id="t1">Estimator lifecycle</title>
<desc id="d1">An estimator is created with parameters, fit learns attributes ending in an underscore, then predict, transform or score are applied to new data, and clone returns a fresh unfitted copy.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Estimator lifecycle</text>
<rect x="24" y="70" width="200" height="110" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="124" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Unfitted estimator</text>
<text x="124" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">Ridge(alpha=1.0)</text>
<text x="124" y="152" text-anchor="middle" font-size="12" fill="#475569">constructor parameters only</text>
<text x="124" y="168" text-anchor="middle" font-size="12" fill="#475569">no attribute ends in _</text>
<rect x="260" y="70" width="200" height="110" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Fitted estimator</text>
<text x="360" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">coef_  intercept_</text>
<text x="360" y="152" text-anchor="middle" font-size="12" fill="#475569">n_features_in_ and other</text>
<text x="360" y="168" text-anchor="middle" font-size="12" fill="#475569">attributes learned from data</text>
<rect x="496" y="70" width="200" height="110" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="596" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Output for new data</text>
<text x="596" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">predict  transform</text>
<text x="596" y="152" text-anchor="middle" font-size="12" fill="#475569">score, predict_proba,</text>
<text x="596" y="168" text-anchor="middle" font-size="12" fill="#475569">decision_function</text>
<line x1="226" y1="125" x2="256" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="462" y1="125" x2="492" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<circle cx="241" cy="104" r="11" fill="#0F172A"/><text x="241" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="477" cy="104" r="11" fill="#0F172A"/><text x="477" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
<path d="M360,184 L360,250 L124,250 L124,184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<circle cx="242" cy="250" r="11" fill="#0F172A"/><text x="242" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="400" y="215" width="296" height="80" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="548" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">fit again discards old state</text>
<text x="548" y="265" text-anchor="middle" font-size="12" fill="#475569">except with warm_start=True</text>
<text x="548" y="283" text-anchor="middle" font-size="12" fill="#475569">or partial_fit</text>
</svg>
