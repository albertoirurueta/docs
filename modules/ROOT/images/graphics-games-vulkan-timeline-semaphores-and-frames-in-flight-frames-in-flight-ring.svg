<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tl-fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Per-frame-slot data versus per-swapchain-image data</text>
<rect x="20" y="50" width="350" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="74" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Frame slots (2 frames in flight)</text>
<rect x="40" y="90" width="150" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="119.2" text-anchor="middle" font-size="11" fill="#3730A3">Slot 0</text>
<text x="115.0" y="134.2" text-anchor="middle" font-size="11" fill="#3730A3">pool, UBO, acquire</text>
<rect x="200" y="90" width="150" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="119.2" text-anchor="middle" font-size="11" fill="#3730A3">Slot 1</text>
<text x="275.0" y="134.2" text-anchor="middle" font-size="11" fill="#3730A3">pool, UBO, acquire</text>
<rect x="390" y="50" width="350" height="120" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="565" y="74" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">Swapchain images (3)</text>
<rect x="405" y="90" width="100" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="455.0" y="119.2" text-anchor="middle" font-size="11" fill="#92400E">Image 0</text>
<text x="455.0" y="134.2" text-anchor="middle" font-size="11" fill="#92400E">render sem</text>
<rect x="517" y="90" width="100" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="567.0" y="119.2" text-anchor="middle" font-size="11" fill="#92400E">Image 1</text>
<text x="567.0" y="134.2" text-anchor="middle" font-size="11" fill="#92400E">render sem</text>
<rect x="629" y="90" width="100" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="679.0" y="119.2" text-anchor="middle" font-size="11" fill="#92400E">Image 2</text>
<text x="679.0" y="134.2" text-anchor="middle" font-size="11" fill="#92400E">render sem</text>
<rect x="20" y="210" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="239.0" text-anchor="middle" font-size="12" fill="#374151">frame N uses slot N mod 2, and acquire returns an image index that has nothing to do with the slot</text>
<rect x="20" y="290" width="220" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="130.0" y="313.7" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Timeline value</text>
<text x="130.0" y="328.7" text-anchor="middle" font-size="11" fill="#065F46">one semaphore</text>
<text x="130.0" y="343.7" text-anchor="middle" font-size="11" fill="#065F46">slot waits for N - 2</text>
<rect x="270" y="290" width="220" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="313.7" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Acquire semaphore</text>
<text x="380.0" y="328.7" text-anchor="middle" font-size="11" fill="#3730A3">indexed by slot</text>
<text x="380.0" y="343.7" text-anchor="middle" font-size="11" fill="#3730A3">reuse: slot is done</text>
<rect x="520" y="290" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="313.7" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Render semaphore</text>
<text x="630.0" y="328.7" text-anchor="middle" font-size="11" fill="#92400E">indexed by image</text>
<text x="630.0" y="343.7" text-anchor="middle" font-size="11" fill="#92400E">reuse: image reacquired</text>
<line x1="115" y1="172" x2="115" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-fr)"/>
<line x1="380" y1="172" x2="380" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-fr)"/>
<line x1="630" y1="172" x2="630" y2="288" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-fr)"/>
<text x="380" y="410" text-anchor="middle" font-size="12" fill="#374151">The rule: whatever present waits on belongs to the image, whatever the CPU reuses belongs to the slot.</text>
</svg>
