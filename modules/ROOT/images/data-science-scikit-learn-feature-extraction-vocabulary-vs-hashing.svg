<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-labelledby="t d">
  <title id="t">Vocabulary counting versus the hashing trick</title>
  <desc id="d">Top lane: CountVectorizer splits the text of a document into tokens, learns a vocabulary that maps every token to a column, and produces a sparse count row. Bottom lane: FeatureHasher or HashingVectorizer maps each token to a column number with a hash function modulo the number of columns, so no vocabulary is stored, but two different tokens can land in the same column.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="454" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">From text to columns: two ways</text>
  <rect x="24" y="52" width="672" height="180" rx="6" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <circle cx="46" cy="76" r="11" fill="#0F172A"/>
  <text x="46" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="66" y="81" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F766E">CountVectorizer: learn a vocabulary, then count</text>
  <rect x="40" y="100" width="150" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="115.0" y="124.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Document</text>
  <text x="115.0" y="142.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">the cat sat on the mat</text>
  <rect x="222" y="100" width="150" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="297.0" y="124.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Vocabulary</text>
  <text x="297.0" y="142.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">(fitted)</text>
  <path d="M190 128 L218 128" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="404" y="116" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#475569">Sparse count row (13 columns)</text>
  <rect x="404" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="414.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="412.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 412.5 170)">am</text>
  <rect x="425" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="435.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="433.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 433.5 170)">and</text>
  <rect x="446" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="456.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="454.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 454.5 170)">are</text>
  <rect x="467" y="124" width="21" height="32" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="477.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1</text>
  <text x="475.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 475.5 170)">cat</text>
  <rect x="488" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="498.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="496.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 496.5 170)">cats</text>
  <rect x="509" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="519.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="517.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 517.5 170)">dog</text>
  <rect x="530" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="540.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="538.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 538.5 170)">dogs</text>
  <rect x="551" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="561.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="559.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 559.5 170)">log</text>
  <rect x="572" y="124" width="21" height="32" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="582.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1</text>
  <text x="580.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 580.5 170)">mat</text>
  <rect x="593" y="124" width="21" height="32" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="603.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1</text>
  <text x="601.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 601.5 170)">on</text>
  <rect x="614" y="124" width="21" height="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="624.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">0</text>
  <text x="622.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 622.5 170)">pets</text>
  <rect x="635" y="124" width="21" height="32" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="645.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1</text>
  <text x="643.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 643.5 170)">sat</text>
  <rect x="656" y="124" width="21" height="32" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="666.5" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">2</text>
  <text x="664.5" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" transform="rotate(-60 664.5 170)">the</text>
  <path d="M372 128 L400 128" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="40" y="204" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Needs a pass over the training text and keeps a dict of every token.</text>
  <text x="40" y="222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Readable columns; unseen words in new text are ignored.</text>
  <g transform="translate(0,14)">
  <rect x="24" y="236" width="672" height="188" rx="6" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <circle cx="46" cy="260" r="11" fill="#0F172A"/>
  <text x="46" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="66" y="265" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#6D28D9">FeatureHasher: hash each token to a column, no vocabulary</text>
  <rect x="40" y="280" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="88.0" y="296.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">apple</text>
  <path d="M136 291 L300 296" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="308" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="88.0" y="324.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">banana</text>
  <path d="M136 319 L300 330" stroke="#BE123C" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="336" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="88.0" y="352.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">cherry</text>
  <path d="M136 347 L300 364" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="364" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="88.0" y="380.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">date</text>
  <path d="M136 375 L300 398" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="392" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="88.0" y="408.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">elder</text>
  <path d="M136 403 L300 330" stroke="#BE123C" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="304" y="282" width="130" height="28" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="369" y="301" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">column 0: 1</text>
  <rect x="304" y="316" width="130" height="28" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="369" y="335" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">column 1: 2</text>
  <rect x="304" y="350" width="130" height="28" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="369" y="369" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">column 2: 1</text>
  <rect x="304" y="384" width="130" height="28" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="369" y="403" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">column 3: 1</text>
  <text x="470" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Column index = hash(token) mod 4</text>
  <text x="470" y="322" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Memory is fixed: no vocabulary is stored,</text>
  <text x="470" y="340" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">and the same token always lands in the</text>
  <text x="470" y="358" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">same column, even for unseen text.</text>
  <text x="470" y="386" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#BE123C">banana and elder collide</text>
  <text x="470" y="404" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">(real tables use 2**18 or more columns).</text>
  </g>
</svg>
