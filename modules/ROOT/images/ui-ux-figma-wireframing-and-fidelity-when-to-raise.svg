<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">When to raise fidelity: ask what you still need to learn</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF"><rect x="40" y="56" width="190" height="56" rx="10"/><rect x="40" y="148" width="190" height="56" rx="10"/><rect x="40" y="240" width="190" height="56" rx="10"/></g>
  <g font-size="12" fill="#3730A3" text-anchor="middle"><text x="135" y="80">Is the structure</text><text x="135" y="96">agreed?</text><text x="135" y="172">Is the content</text><text x="135" y="188">and flow clear?</text><text x="135" y="264">Do people need the</text><text x="135" y="280">look to decide?</text></g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M135,113 L135,146" marker-end="url(#ah)"/><path d="M135,205 L135,238" marker-end="url(#ah)"/><path d="M231,84 L350,84" marker-end="url(#ah)"/><path d="M231,176 L350,176" marker-end="url(#ah)"/><path d="M231,268 L350,268" marker-end="url(#ah)"/></g>
  <g font-size="11" fill="#047857" text-anchor="middle"><text x="135" y="132">yes</text><text x="135" y="224">yes</text></g>
  <g font-size="11" fill="#B91C1C" text-anchor="middle"><text x="290" y="78">no</text><text x="290" y="170">no</text><text x="290" y="262">yes</text></g>
  <g stroke-width="1.5"><rect x="352" y="56" width="340" height="56" rx="10" fill="#FEF3C7" stroke="#B45309"/><rect x="352" y="148" width="340" height="56" rx="10" fill="#FEF3C7" stroke="#B45309"/><rect x="352" y="240" width="340" height="56" rx="10" fill="#D1FAE5" stroke="#047857"/></g>
  <g font-size="12" fill="#92400E"><text x="364" y="80">Stay at lo-fi: move boxes, compare layouts</text><text x="364" y="98" font-size="11">Cheap to change, nobody argues about colour</text><text x="364" y="172">Move to mid-fi: real copy, states, flow</text><text x="364" y="190" font-size="11">Wire up an interactive wireframe and test it</text></g>
  <g font-size="12" fill="#065F46"><text x="364" y="264">Go hi-fi: type, colour, imagery, motion</text><text x="364" y="282" font-size="11">Reuse the design system, then hand off</text></g>
  <circle cx="40" cy="56" r="11" fill="#4F46E5"/><circle cx="40" cy="148" r="11" fill="#4F46E5"/><circle cx="40" cy="240" r="11" fill="#4F46E5"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="40" y="60">1</text><text x="40" y="152">2</text><text x="40" y="244">3</text></g>
  <text x="380" y="334" font-size="12" fill="#374151" text-anchor="middle">Raise fidelity one step at a time, only when the next question needs it.</text>
</svg>
