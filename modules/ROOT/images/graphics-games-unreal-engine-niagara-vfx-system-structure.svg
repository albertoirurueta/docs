<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Niagara: system, emitters, groups and what each may write</text>
<rect x="20" y="45" width="720" height="330" rx="14" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="40" y="68" text-anchor="start" font-size="14" fill="#3730A3" font-weight="bold">NS_BookDust (System)</text>
<rect x="40" y="85" width="680" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="107.7" text-anchor="middle" font-size="12" fill="#92400E">System Spawn / System Update</text>
<text x="380.0" y="122.7" text-anchor="middle" font-size="12" fill="#92400E">writes System.*; reads Engine.* and User.*</text>
<rect x="40" y="150" width="680" height="175" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="55" y="172" text-anchor="start" font-size="13" fill="#374151" font-weight="bold">Emitter: DustMotes</text>
<rect x="55" y="182" width="300" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="205.0" y="200.7" text-anchor="middle" font-size="12" fill="#065F46">Emitter Spawn / Emitter Update</text>
<text x="205.0" y="215.7" text-anchor="middle" font-size="12" fill="#065F46">writes Emitter.*</text>
<rect x="55" y="236" width="300" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="205.0" y="254.7" text-anchor="middle" font-size="12" fill="#3730A3">Particle Spawn: Initialize Particle,</text>
<text x="205.0" y="269.7" text-anchor="middle" font-size="12" fill="#3730A3">Shape Location, Add Velocity</text>
<rect x="55" y="286" width="300" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="205.0" y="304.9" text-anchor="middle" font-size="11" fill="#3730A3">Particle Update: Drag, Curl Noise Force, Scale Color</text>
<rect x="385" y="182" width="320" height="134" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="545.0" y="223.2" text-anchor="middle" font-size="12" fill="#1F2937">Render group</text>
<text x="545.0" y="238.2" text-anchor="middle" font-size="12" fill="#1F2937">Sprite Renderer (Material M_Dust)</text>
<text x="545.0" y="253.2" text-anchor="middle" font-size="12" fill="#1F2937">Mesh, Ribbon, Light renderers</text>
<text x="545.0" y="268.2" text-anchor="middle" font-size="12" fill="#1F2937">also possible</text>
<text x="545.0" y="283.2" text-anchor="middle" font-size="12" fill="#1F2937">reads Particles.* attributes</text>
<line x1="355" y1="258" x2="385" y2="258" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="355" text-anchor="middle" font-size="11" fill="#374151">Further emitters repeat the same shape; each one adds a fixed CPU cost for its System and Emitter scripts.</text>
<text x="380" y="400" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Group order per frame: System, then Emitter, then Particle, then Render.</text>
</svg>
