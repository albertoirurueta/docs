<svg viewBox="0 0 760 316" width="760" height="316" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="316" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Bloom as a chain of framebuffers</text>
<rect x="20" y="60" width="108" height="96" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="74" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">HDR scene</text>
<text x="74" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">full size</text>
<line x1="130" y1="108" x2="140.4" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bl)"/>
<rect x="142.4" y="68" width="108" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="196.4" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Bright pass</text>
<text x="196.4" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">threshold</text>
<line x1="252.4" y1="108" x2="262.8" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bl)"/>
<rect x="264.8" y="78" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="318.8" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Downsample</text>
<text x="318.8" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1/2 then 1/4 ...</text>
<line x1="374.8" y1="108" x2="385.2" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bl)"/>
<rect x="387.2" y="84" width="108" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="441.2" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Blur</text>
<text x="441.2" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">gaussian or dual</text>
<line x1="497.2" y1="108" x2="507.6" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bl)"/>
<rect x="509.6" y="78" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="563.6" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Upsample + add</text>
<text x="563.6" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">back to full</text>
<line x1="619.6" y1="108" x2="630" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bl)"/>
<rect x="632" y="60" width="108" height="96" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="686" y="106" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Composite</text>
<text x="686" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scene + bloom</text>
<rect x="20" y="190" width="720" height="106" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="36" y="216" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Each box is a render target; box height hints at its resolution.</text>
<text x="36" y="236" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Work on the HDR (linear) image so only truly bright pixels bloom.</text>
<text x="36" y="256" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Tone mapping and sRGB encoding come after the composite.</text>
<text x="36" y="276" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Typical pitfalls: flicker from single bright pixels (prefilter), and a blur radius that changes with the resolution.</text>
</svg>
