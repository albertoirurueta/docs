<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vpe-ladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Core versions: extensions promoted into core</text>
<rect x="20" y="250" width="170" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="268" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Vulkan 1.1</text>
<text x="105.0" y="286" text-anchor="middle" font-size="11" fill="#3730A3">Features2 and Properties2</text>
<text x="105.0" y="301" text-anchor="middle" font-size="11" fill="#3730A3">subgroups, multiview</text>
<text x="105.0" y="316" text-anchor="middle" font-size="11" fill="#3730A3">protected memory</text>
<text x="105.0" y="331" text-anchor="middle" font-size="11" fill="#3730A3">sampler YCbCr</text>
<text x="105" y="398" text-anchor="middle" font-size="11" fill="#6B7280">March 2018</text>
<rect x="200" y="195" width="170" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="213" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Vulkan 1.2</text>
<text x="285.0" y="231" text-anchor="middle" font-size="11" fill="#3730A3">timeline semaphores</text>
<text x="285.0" y="246" text-anchor="middle" font-size="11" fill="#3730A3">descriptor indexing</text>
<text x="285.0" y="261" text-anchor="middle" font-size="11" fill="#3730A3">buffer device address</text>
<text x="285.0" y="276" text-anchor="middle" font-size="11" fill="#3730A3">SPIR-V 1.5, memory model</text>
<text x="285" y="343" text-anchor="middle" font-size="11" fill="#6B7280">January 2020</text>
<rect x="380" y="140" width="170" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="158" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Vulkan 1.3</text>
<text x="465.0" y="176" text-anchor="middle" font-size="11" fill="#3730A3">dynamic rendering</text>
<text x="465.0" y="191" text-anchor="middle" font-size="11" fill="#3730A3">synchronization2</text>
<text x="465.0" y="206" text-anchor="middle" font-size="11" fill="#3730A3">copy_commands2, maintenance4</text>
<text x="465.0" y="221" text-anchor="middle" font-size="11" fill="#3730A3">extended dynamic state 1 and 2</text>
<text x="465" y="288" text-anchor="middle" font-size="11" fill="#6B7280">January 2022</text>
<rect x="560" y="85" width="170" height="130" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="103" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Vulkan 1.4</text>
<text x="645.0" y="121" text-anchor="middle" font-size="11" fill="#065F46">push descriptors</text>
<text x="645.0" y="136" text-anchor="middle" font-size="11" fill="#065F46">dynamic rendering local read</text>
<text x="645.0" y="151" text-anchor="middle" font-size="11" fill="#065F46">maintenance5 and 6</text>
<text x="645.0" y="166" text-anchor="middle" font-size="11" fill="#065F46">host image copy, map_memory2</text>
<text x="645" y="233" text-anchor="middle" font-size="11" fill="#6B7280">December 2024</text>
<line x1="190" y1="280" x2="200" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-ladder)"/>
<line x1="370" y1="225" x2="380" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-ladder)"/>
<line x1="550" y1="170" x2="560" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-ladder)"/>
<rect x="20" y="50" width="330" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="185.0" y="68" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Milestones on top of core</text>
<text x="185.0" y="86" text-anchor="middle" font-size="11" fill="#92400E">Roadmap 2022, 2024 and 2026 sit above 1.3 and 1.4:</text>
<text x="185.0" y="101" text-anchor="middle" font-size="11" fill="#92400E">features, limits and extensions expected on newer devices</text>
<text x="380" y="425" text-anchor="middle" font-size="11" fill="#6B7280">Each step makes optional features of the previous one a guaranteed part of the API</text>
</svg>
