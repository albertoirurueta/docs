<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The tangent-space basis of a triangle</text>
<rect x="20" y="50" width="470" height="320" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<polygon points="70,320 330,320 440,230 180,230" fill="#F3EFE8" stroke="#4B5563" stroke-width="1.5"/>
<text x="250" y="345" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">triangle surface in object space</text>
<line x1="255" y1="275" x2="385" y2="275" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah1-w)"/>
<text x="392" y="279" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">T  (du)</text>
<line x1="255" y1="275" x2="310" y2="240" stroke="#047857" stroke-width="2.5" marker-end="url(#ah1)"/>
<text x="318" y="238" font-size="12" font-weight="bold" fill="#047857" text-anchor="start">B  (dv)</text>
<line x1="255" y1="275" x2="255" y2="120" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah1-a)"/>
<text x="265" y="126" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">N  geometric normal</text>
<line x1="255" y1="275" x2="200" y2="200" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah1)" stroke-dasharray="5 4"/>
<text x="130" y="196" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">perturbed normal n'</text>
<circle cx="255" cy="275" r="4" fill="#1F2937"/>
<rect x="520" y="50" width="220" height="320" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Texture space</text>
<rect x="560" y="92" width="120" height="120" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<line x1="560" y1="212" x2="650" y2="212" stroke="#B45309" stroke-width="2" marker-end="url(#ah1-w)"/>
<text x="655" y="216" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">u</text>
<line x1="560" y1="212" x2="560" y2="122" stroke="#047857" stroke-width="2" marker-end="url(#ah1)"/>
<text x="556" y="116" font-size="12" font-weight="bold" fill="#047857" text-anchor="end">v</text>
<text x="630" y="236" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">(0,0) at the lower left</text>
<text x="630" y="266" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">T points where u grows</text>
<text x="630" y="284" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">B points where v grows</text>
<text x="630" y="302" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">N = cross(T, B), sign by handedness</text>
<text x="630" y="332" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Tangent-space normal</text>
<text x="630" y="350" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">n' = x*T + y*B + z*N</text>
</svg>
