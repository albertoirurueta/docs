<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-gpu-architecture-and-tbdr-tile-memory-lifecycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Life of a tile: load action, work, store action</text>
<rect x="30" y="70" width="140" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="100.0" y="94.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Video memory</text>
<text x="100.0" y="109.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">colour and depth</text>
<text x="100.0" y="124.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">attachments</text>
<rect x="250" y="70" width="260" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="94.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Tile memory (on chip)</text>
<text x="380.0" y="109.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">blend, depth test, tile shaders</text>
<text x="380.0" y="124.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">imageblock data</text>
<rect x="590" y="70" width="140" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="101.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Video memory</text>
<text x="660.0" y="116.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">final colour</text>
<line x1="170" y1="105" x2="250" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tile-memory-lifecycle)"/>
<line x1="510" y1="105" x2="590" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tile-memory-lifecycle)"/>
<text x="210" y="92" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">load action</text>
<text x="550" y="92" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">store action</text>
<text x="210" y="125" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">load, clear or dontCare</text>
<text x="550" y="125" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">store, dontCare, resolve</text>
<rect x="250" y="190" width="260" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="209.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Memoryless texture</text>
<text x="380.0" y="224.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">lives only in tile memory</text>
<text x="380.0" y="239.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(storageMode memoryless)</text>
<line x1="380" y1="190" x2="380" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tile-memory-lifecycle)"/>
<text x="380" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">dontCare on both ends and a memoryless target means the data never touches memory at all.</text>
</svg>
