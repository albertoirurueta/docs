<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ila-port" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Portability drivers stay hidden unless the application opts in</text>
<rect x="30" y="60" width="200" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="130.0" y="83.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Translation driver</text>
<text x="130.0" y="98.5" text-anchor="middle" font-size="11" fill="#065F46">manifest: is_portability_driver</text>
<text x="130.0" y="113.5" text-anchor="middle" font-size="11" fill="#065F46">exposes portability_subset</text>
<rect x="290" y="60" width="180" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="91.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Loader (default)</text>
<text x="380.0" y="106.0" text-anchor="middle" font-size="11" fill="#92400E">skips portability drivers</text>
<rect x="530" y="60" width="200" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630.0" y="91.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Physical devices</text>
<text x="630.0" y="106.0" text-anchor="middle" font-size="11" fill="#374151">no device from that driver</text>
<line x1="230" y1="95" x2="288" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-port)"/>
<line x1="470" y1="95" x2="528" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-port)"/>
<rect x="30" y="190" width="200" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="223.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Application opts in</text>
<text x="130.0" y="238.5" text-anchor="middle" font-size="11" fill="#3730A3">enable portability_enumeration</text>
<text x="130.0" y="253.5" text-anchor="middle" font-size="11" fill="#3730A3">set the ENUMERATE bit</text>
<rect x="290" y="190" width="180" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="231.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Loader (opt-in)</text>
<text x="380.0" y="246.0" text-anchor="middle" font-size="11" fill="#92400E">lists the portability driver</text>
<rect x="530" y="190" width="200" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="223.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Physical device</text>
<text x="630.0" y="238.5" text-anchor="middle" font-size="11" fill="#065F46">enable portability_subset</text>
<text x="630.0" y="253.5" text-anchor="middle" font-size="11" fill="#065F46">on the device when used</text>
<line x1="230" y1="235" x2="288" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-port)"/>
<line x1="470" y1="235" x2="528" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-port)"/>
<text x="380" y="312" text-anchor="middle" font-size="11" fill="#6B7280">Used by MoltenVK and KosmicKrisp on macOS</text>
</svg>
