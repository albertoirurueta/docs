<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The WebRTC protocol stack: JavaScript APIs on top, audio and video codecs over RTP and SRTP, data channels over SCTP, both secured by DTLS, then ICE with STUN and TURN, UDP and IP, with application-defined signalling exchanging SDP offers and answers beside the stack</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The WebRTC protocol stack</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">media and data travel peer to peer on the right; the application decides how the left side reaches the other peer</text>
  <line x1="262" y1="90" x2="316" y2="90" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="64" width="242" height="196" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="141.0" y="81" font-size="12.5" font-weight="bold" fill="#7a2e00" text-anchor="middle">Signalling (application-defined)</text>
  <text x="141" y="104" font-size="10.5" fill="#7a2e00" text-anchor="middle">WebSocket, HTTPS, XMPP or SIP</text>
  <text x="141" y="122" font-size="10.5" fill="#7a2e00" text-anchor="middle">JSEP offer and answer (RFC 9429)</text>
  <text x="141" y="140" font-size="10.5" fill="#7a2e00" text-anchor="middle">carrying SDP (RFC 8866)</text>
  <text x="141" y="158" font-size="10.5" fill="#7a2e00" text-anchor="middle">plus ICE candidates (RFC 8838)</text>
  <text x="141" y="176" font-size="10.5" fill="#7a2e00" text-anchor="middle">plus room, join and leave control</text>
  <text x="141" y="206" font-size="10" fill="#7a2e00" text-anchor="middle">setLocalDescription, setRemoteDescription,</text>
  <text x="141" y="220" font-size="10" fill="#7a2e00" text-anchor="middle">addIceCandidate on the peer connection</text>
  <text x="141" y="246" font-size="10" font-style="italic" fill="#7a2e00" text-anchor="middle">not specified by WebRTC</text>
  <rect x="320" y="64" width="460" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550" y="82" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">JavaScript APIs (W3C WebRTC 1.0)</text>
  <text x="550" y="96" font-size="10" fill="#0d3c75" text-anchor="middle">getUserMedia, RTCPeerConnection, RTCRtpSender, RTCDataChannel, getStats</text>
  <rect x="320" y="112" width="224" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="432.0" y="129" font-size="12.5" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Codecs</text>
  <text x="432.0" y="144" font-size="10" fill="#1b4d1f" text-anchor="middle">Opus, G.711, VP8, H.264 (RFC 7874, RFC 7742)</text>
  <rect x="552" y="112" width="228" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="666.0" y="129" font-size="12.5" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Data channels</text>
  <text x="666.0" y="144" font-size="10" fill="#1b4d1f" text-anchor="middle">DCEP (RFC 8832, RFC 8831)</text>
  <rect x="320" y="164" width="224" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="432.0" y="181" font-size="12.5" font-weight="bold" fill="#1b4d1f" text-anchor="middle">RTP and RTCP</text>
  <text x="432.0" y="196" font-size="10" fill="#1b4d1f" text-anchor="middle">RFC 3550, usage in RFC 8834</text>
  <rect x="552" y="164" width="228" height="96" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="666.0" y="181" font-size="12.5" font-weight="bold" fill="#1b4d1f" text-anchor="middle">SCTP</text>
  <text x="666.0" y="196" font-size="10" fill="#1b4d1f" text-anchor="middle">over DTLS (RFC 8261, RFC 8841)</text>
  <text x="666.0" y="209" font-size="10" fill="#1b4d1f" text-anchor="middle">reliable or partially reliable,</text>
  <text x="666.0" y="222" font-size="10" fill="#1b4d1f" text-anchor="middle">ordered or unordered messages</text>
  <rect x="320" y="216" width="224" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="432.0" y="233" font-size="12.5" font-weight="bold" fill="#1b4d1f" text-anchor="middle">SRTP and SRTCP</text>
  <text x="432.0" y="248" font-size="10" fill="#1b4d1f" text-anchor="middle">RFC 3711, encrypted and authenticated</text>
  <rect x="320" y="268" width="460" height="44" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="550.0" y="285" font-size="12.5" font-weight="bold" fill="#3d0f57" text-anchor="middle">DTLS</text>
  <text x="550.0" y="300" font-size="10" fill="#3d0f57" text-anchor="middle">handshake and fingerprint check (RFC 6347), SRTP keys from DTLS (RFC 5764)</text>
  <rect x="320" y="320" width="460" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550.0" y="337" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">ICE with STUN and TURN</text>
  <text x="550.0" y="352" font-size="10" fill="#0d3c75" text-anchor="middle">candidate gathering, connectivity checks, relay (RFC 8445, RFC 8489, RFC 8656)</text>
  <rect x="320" y="378" width="460" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550.0" y="395" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">UDP (TURN also over TCP and TLS)</text>
  <text x="550.0" y="410" font-size="10" fill="#0d3c75" text-anchor="middle">one port for all media and data, multiplexed (BUNDLE, RFC 9143)</text>
  <rect x="320" y="426" width="460" height="34" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550" y="440" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">IP: IPv4 and IPv6</text>
  <text x="550" y="453" font-size="9.5" fill="#0d3c75" text-anchor="middle">NATs and firewalls sit in between</text>
  <text x="141" y="284" font-size="10" fill="#555555" text-anchor="middle">travels over a separate connection</text>
  <text x="141" y="298" font-size="10" fill="#555555" text-anchor="middle">to the signalling server</text>
  <rect x="40" y="482" width="16" height="12" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="62" y="492" font-size="10" fill="#333333">API, ICE and transport</text>
  <rect x="230" y="482" width="16" height="12" rx="2" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="252" y="492" font-size="10" fill="#333333">media and data framing</text>
  <rect x="420" y="482" width="16" height="12" rx="2" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="442" y="492" font-size="10" fill="#333333">encryption</text>
  <rect x="610" y="482" width="16" height="12" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="632" y="492" font-size="10" fill="#333333">signalling</text>
</svg>
