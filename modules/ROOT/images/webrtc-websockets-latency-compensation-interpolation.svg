<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Timeline of entity interpolation: the server stamps snapshots every 50 ms, each arrives after the flight time, and the client draws a remote player at the render time, which is now minus the flight time minus 100 ms, so that the render time falls between two snapshots; if no newer snapshot exists the client must extrapolate or freeze</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Entity interpolation: drawing the past between two snapshots</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">server-stamped time of the snapshots on the axis; 50 ms flight time; 100 ms interpolation delay</text>

  <line x1="30" y1="150" x2="770" y2="150" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="770" y="170" font-size="10" fill="#555555" text-anchor="end">server time</text>

  <g text-anchor="middle" font-size="10" fill="#7a2e00">
    <circle cx="80" cy="150" r="7" fill="#e65100"/><text x="80" y="134">S1</text>
    <circle cx="180" cy="150" r="7" fill="#e65100"/><text x="180" y="134">S2</text>
    <circle cx="280" cy="150" r="7" fill="#e65100"/><text x="280" y="134">S3</text>
    <circle cx="380" cy="150" r="7" fill="#e65100"/><text x="380" y="134">S4</text>
    <circle cx="480" cy="150" r="7" fill="#e65100"/><text x="480" y="134">S5</text>
    <circle cx="580" cy="150" r="7" fill="#ffffff" stroke="#e65100" stroke-width="2"/><text x="580" y="134">S6 in flight</text>
  </g>
  <text x="130" y="118" font-size="10" fill="#555555" text-anchor="middle">50 ms</text>
  <line x1="82" y1="122" x2="178" y2="122" stroke="#555555" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="268" y="188" width="164" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="350" y="207" font-size="11" font-weight="bold" fill="#1b4d1f" text-anchor="middle">render time lies here</text>
  <line x1="350" y1="188" x2="350" y2="140" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4 3"/>

    <path d="M230,260 L330,260" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="230" cy="260" r="6" fill="#e65100"/>
  <circle cx="330" cy="260" r="6" fill="#e65100"/>
  <circle cx="300" cy="260" r="8" fill="#ef6c00" stroke="#7a2e00" stroke-width="1.5"/>
  <text x="230" y="284" font-size="10" fill="#7a2e00" text-anchor="middle">position at S3</text>
  <text x="330" y="284" font-size="10" fill="#7a2e00" text-anchor="middle">position at S4</text>
  <text x="300" y="244" font-size="10.5" fill="#1b4d1f" text-anchor="middle" font-weight="bold">drawn: lerp by 70 %</text>
  <line x1="340" y1="218" x2="304" y2="232" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#a)"/>

  <line x1="650" y1="108" x2="650" y2="164" stroke="#1565c0" stroke-width="2"/>
  <text x="650" y="100" font-size="11" font-weight="bold" fill="#0d3c75" text-anchor="middle">now</text>
  <line x1="550" y1="76" x2="650" y2="76" stroke="#555555" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="600" y="70" font-size="10" fill="#555555" text-anchor="middle">flight time 50 ms</text>

    <line x1="350" y1="316" x2="650" y2="316" stroke="#555555" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="500" y="334" font-size="11" fill="#222222" text-anchor="middle">flight time (RTT / 2) + interpolation delay = 50 + 100 = 150 ms behind the server</text>

  <rect x="498" y="196" width="272" height="86" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="510" y="216" font-size="12" font-weight="bold" fill="#7f1d1d">If render time passes the newest snapshot</text>
  <text x="510" y="234" font-size="10.5" fill="#7f1d1d">the buffer has run dry (loss or jitter): freeze,</text>
  <text x="510" y="250" font-size="10.5" fill="#7f1d1d">or extrapolate along the last velocity for at</text>
  <text x="510" y="266" font-size="10.5" fill="#7f1d1d">most 100 ms, then freeze</text>

  <text x="400" y="376" font-size="10.5" fill="#555555" text-anchor="middle">one lost snapshot is survivable because two snapshots always span the delay; two lost in a row are not</text>
</svg>
