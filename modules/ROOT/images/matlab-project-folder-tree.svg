<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="pf-t pf-d">
  <title id="pf-t">Folder layout of the heatflow project</title>
  <desc id="pf-d">A tree of folders and files. The project root contains the namespace folder +heatflow, which holds Plate.m, BoundaryKind.m, the inner namespace +util with clamp.m, and the class folder @Simulation with Simulation.m, step.m and a private folder with applyBoundary.m. A tests folder sits beside +heatflow. The right column gives the name each item has when called from code.</desc>
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">heatflow project layout</text>
  <text x="30" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">On disk</text>
  <text x="400" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">What it means</text>
  <rect x="30" y="70" width="163" height="24" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="40" y="87" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">heatflow-project/</text>
  <text x="400" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Project root, on the MATLAB path</text>
  <rect x="58" y="100" width="104" height="24" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="68" y="117" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">+heatflow/</text>
  <text x="400" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Namespace heatflow (the + is not part of the name)</text>
  <path d="M 44 112 H 58" stroke="#94a3b8" fill="none"/>
  <rect x="86" y="130" width="79" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="96" y="147" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">Plate.m</text>
  <text x="400" y="147" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">heatflow.Plate</text>
  <path d="M 72 142 H 86" stroke="#94a3b8" fill="none"/>
  <rect x="86" y="160" width="138" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="96" y="177" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">BoundaryKind.m</text>
  <text x="400" y="177" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">heatflow.BoundaryKind</text>
  <path d="M 72 172 H 86" stroke="#94a3b8" fill="none"/>
  <rect x="86" y="190" width="70" height="24" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="96" y="207" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">+util/</text>
  <text x="400" y="207" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Inner namespace heatflow.util</text>
  <path d="M 72 202 H 86" stroke="#94a3b8" fill="none"/>
  <rect x="114" y="220" width="79" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="124" y="237" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">clamp.m</text>
  <text x="400" y="237" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">heatflow.util.clamp</text>
  <path d="M 100 232 H 114" stroke="#94a3b8" fill="none"/>
  <rect x="86" y="250" width="121" height="24" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="96" y="267" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">@Simulation/</text>
  <text x="400" y="267" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Class folder: @Simulation is not in the name</text>
  <path d="M 72 262 H 86" stroke="#94a3b8" fill="none"/>
  <rect x="114" y="280" width="121" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="124" y="297" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">Simulation.m</text>
  <text x="400" y="297" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">heatflow.Simulation (classdef file)</text>
  <path d="M 100 292 H 114" stroke="#94a3b8" fill="none"/>
  <rect x="114" y="310" width="70" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="124" y="327" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">step.m</text>
  <text x="400" y="327" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Method step, one file per method</text>
  <path d="M 100 322 H 114" stroke="#94a3b8" fill="none"/>
  <rect x="114" y="340" width="87" height="24" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="124" y="357" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">private/</text>
  <text x="400" y="357" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Helpers callable only from this class</text>
  <path d="M 100 352 H 114" stroke="#94a3b8" fill="none"/>
  <rect x="142" y="370" width="146" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="152" y="387" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">applyBoundary.m</text>
  <text x="400" y="387" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Not a method, no object argument</text>
  <path d="M 128 382 H 142" stroke="#94a3b8" fill="none"/>
  <rect x="58" y="400" width="70" height="24" rx="5" fill="#f1f5f9" stroke="#64748b"/>
  <text x="68" y="417" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">tests/</text>
  <text x="400" y="417" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Ordinary folder, not part of any name</text>
  <path d="M 44 412 H 58" stroke="#94a3b8" fill="none"/>
  <rect x="86" y="430" width="112" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="96" y="447" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">PlateTest.m</text>
  <text x="400" y="447" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Test class, uses heatflow.Plate</text>
  <path d="M 72 442 H 86" stroke="#94a3b8" fill="none"/>
  <path d="M 44 94 V 112" stroke="#94a3b8" fill="none"/>
  <path d="M 72 124 V 142" stroke="#94a3b8" fill="none"/>
