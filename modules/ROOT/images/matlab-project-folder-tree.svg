  <path d="M 72 124 V 262" stroke="#94a3b8" fill="none"/>
  <path d="M 100 274 V 292" stroke="#94a3b8" fill="none"/>
  <path d="M 100 274 V 322" stroke="#94a3b8" fill="none"/>
  <path d="M 100 274 V 352" stroke="#94a3b8" fill="none"/>
  <path d="M 128 364 V 382" stroke="#94a3b8" fill="none"/>
  <path d="M 44 94 V 412" stroke="#94a3b8" fill="none"/>
  <path d="M 72 424 V 442" stroke="#94a3b8" fill="none"/>
</svg>
