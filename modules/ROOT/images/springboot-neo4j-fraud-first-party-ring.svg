<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">First-party ring: three customers sharing one device, phone and address</text>
  <rect x="180" y="72" width="140" height="296" rx="14" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="250" y="90" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">Shared-identifier ring</text>
  <g stroke="#888888" stroke-width="1.4" fill="none">
    <line x1="276" y1="130" x2="460" y2="120"/>
    <line x1="276" y1="130" x2="460" y2="220"/>
    <line x1="276" y1="130" x2="460" y2="320"/>
    <line x1="224" y1="130" x2="110" y2="130"/>
    <line x1="276" y1="220" x2="460" y2="120"/>
    <line x1="276" y1="220" x2="460" y2="220"/>
    <line x1="276" y1="220" x2="460" y2="320"/>
    <line x1="224" y1="220" x2="110" y2="220"/>
    <line x1="276" y1="310" x2="460" y2="120"/>
    <line x1="276" y1="310" x2="460" y2="220"/>
    <line x1="276" y1="310" x2="460" y2="320"/>
    <line x1="224" y1="310" x2="110" y2="310"/>
  </g>
  <circle cx="250" cy="130" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="135" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">C1</text>
  <rect x="30" y="110" width="80" height="40" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="70" y="135" font-size="12.5" fill="#333333" text-anchor="middle">Account A1</text>
  <circle cx="250" cy="220" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="225" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">C2</text>
  <rect x="30" y="200" width="80" height="40" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="70" y="225" font-size="12.5" fill="#333333" text-anchor="middle">Account A2</text>
  <circle cx="250" cy="310" r="26" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="315" font-size="14" font-weight="bold" fill="#7a1f1f" text-anchor="middle">C3</text>
  <rect x="30" y="290" width="80" height="40" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
  <text x="70" y="315" font-size="12.5" fill="#333333" text-anchor="middle">Account A3</text>
  <rect x="460" y="96" width="120" height="48" rx="10" fill="#fff2cc" stroke="#b8860b" stroke-width="3"/>
  <text x="520" y="125" font-size="13" font-weight="bold" fill="#5c4400" text-anchor="middle">Device D1</text>
  <rect x="460" y="196" width="120" height="48" rx="10" fill="#fff2cc" stroke="#b8860b" stroke-width="3"/>
  <text x="520" y="225" font-size="13" font-weight="bold" fill="#5c4400" text-anchor="middle">Phone P1</text>
  <rect x="460" y="296" width="120" height="48" rx="10" fill="#fff2cc" stroke="#b8860b" stroke-width="3"/>
  <text x="520" y="325" font-size="13" font-weight="bold" fill="#5c4400" text-anchor="middle">Address H1</text>
  <text x="130" y="360" font-size="11" fill="#666666" text-anchor="middle">OWNS</text>
  <text x="420" y="64" font-size="11" fill="#666666" text-anchor="middle">USES_DEVICE / HAS_PHONE / LIVES_AT</text>
  <text x="650" y="215" font-size="12" fill="#444444" text-anchor="middle">3 customers</text>
  <text x="650" y="233" font-size="12" fill="#444444" text-anchor="middle">per identifier</text>
  <g>
    <circle cx="34" cy="396" r="8" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="400" font-size="11.5" fill="#444444">Customer in the ring</text>
    <rect x="226" y="388" width="16" height="16" rx="4" fill="#fff2cc" stroke="#b8860b" stroke-width="2.5"/>
    <text x="250" y="400" font-size="11.5" fill="#444444">Shared identifier</text>
    <rect x="416" y="388" width="16" height="16" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
    <text x="440" y="400" font-size="11.5" fill="#444444">Account</text>
  </g>
  <text x="360" y="426" font-size="11.5" fill="#444444" text-anchor="middle">A group of customers behind a single device, phone and address is a ring even when no money moves between them.</text>
</svg>
