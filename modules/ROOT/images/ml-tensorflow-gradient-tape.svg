<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">GradientTape records forward, replays backward</title>
  <desc id="d">A forward pass records x, x squared, and the loss on a tape; tape.gradient then walks the recorded operations in reverse, multiplying local derivatives to produce dy/dx.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Record forward, replay backward</text>
  <text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">1. Forward pass inside the tape context</text>
  <rect x="40" y="78" width="110" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="95" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">x (Variable)</text>
  <rect x="305" y="78" width="110" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">u = x ** 2</text>
  <rect x="570" y="78" width="110" height="46" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="625" y="106" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">y = sin(u)</text>
  <line x1="150" y1="101" x2="303" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="415" y1="101" x2="568" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="227" y="93" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">pow</text>
  <text x="492" y="93" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">sin</text>
  <rect x="40" y="140" width="640" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">tape: [pow(x) -> u, sin(u) -> y] (inputs and intermediates kept)</text>
  <text x="40" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">2. tape.gradient(y, x) walks the tape in reverse</text>
  <rect x="570" y="218" width="110" height="46" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="625" y="246" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">dy/dy = 1</text>
  <rect x="305" y="218" width="110" height="46" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="360" y="246" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">cos(u)</text>
  <rect x="40" y="218" width="110" height="46" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="95" y="246" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">cos(u)*2x</text>
  <line x1="570" y1="241" x2="417" y2="241" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="305" y1="241" x2="152" y2="241" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
</svg>
