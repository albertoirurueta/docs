<svg viewBox="0 0 760 250" width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Blueprint equivalent: spawn the dust when a book is pulled</text>
<rect x="20" y="60" width="150" height="66" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="20" y="60" width="150" height="24" rx="6" fill="#B45309"/>
<text x="95.0" y="76" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Event Pull</text>
<text x="30" y="104" text-anchor="start" font-size="11" fill="#374151">exec</text>
<text x="30" y="122" text-anchor="start" font-size="11" fill="#374151">Book (self)</text>
<rect x="215" y="60" width="270" height="102" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="215" y="60" width="270" height="24" rx="6" fill="#4F46E5"/>
<text x="350.0" y="76" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Spawn System at Location</text>
<text x="225" y="104" text-anchor="start" font-size="11" fill="#374151">exec</text>
<text x="225" y="122" text-anchor="start" font-size="11" fill="#374151">System Template: NS_BookDust</text>
<text x="225" y="140" text-anchor="start" font-size="11" fill="#374151">Location: Get Actor Location</text>
<text x="225" y="158" text-anchor="start" font-size="11" fill="#374151">Auto Destroy: true</text>
<rect x="530" y="60" width="210" height="84" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<rect x="530" y="60" width="210" height="24" rx="6" fill="#047857"/>
<text x="635.0" y="76" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Set Niagara Variable (Float)</text>
<text x="540" y="104" text-anchor="start" font-size="11" fill="#374151">exec</text>
<text x="540" y="122" text-anchor="start" font-size="11" fill="#374151">In Value: 20.0</text>
<text x="540" y="140" text-anchor="start" font-size="11" fill="#374151">Variable Name: User.DustAmount</text>
<line x1="170" y1="82" x2="215" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="485" y1="82" x2="530" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="215" text-anchor="middle" font-size="11" fill="#374151">Return Value of the spawn node (a Niagara Component) feeds the Target pin of the variable node.</text>
<path d="M 485,142 C 510,170 510,150 530,128" fill="none" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
