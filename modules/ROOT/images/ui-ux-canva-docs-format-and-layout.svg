<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Page types and layout blocks in a doc</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#F9FAFB">
    <rect x="30" y="56" width="150" height="230" rx="8"/><rect x="200" y="56" width="150" height="230" rx="8"/><rect x="370" y="56" width="150" height="230" rx="8"/><rect x="540" y="56" width="190" height="230" rx="8"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle"><text x="105" y="78">Pageless</text><text x="275" y="78">Fixed pages</text><text x="445" y="78">Side by side</text><text x="635" y="78">Columns</text></g>
  <!-- pageless -->
  <rect x="44" y="92" width="122" height="178" fill="#FFFFFF" stroke="#9CA3AF"/>
  <g fill="#D1D5DB"><rect x="54" y="104" width="90" height="6" rx="3"/><rect x="54" y="118" width="100" height="6" rx="3"/><rect x="54" y="132" width="70" height="6" rx="3"/><rect x="54" y="168" width="100" height="6" rx="3"/><rect x="54" y="182" width="80" height="6" rx="3"/></g>
  <path d="M54,152 H156" stroke="#B45309" stroke-dasharray="5 3"/><text x="105" y="163" font-size="10" fill="#92400E" text-anchor="middle">page break</text>
  <!-- fixed -->
  <rect x="226" y="92" width="98" height="84" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="226" y="184" width="98" height="84" fill="#FFFFFF" stroke="#9CA3AF"/>
  <g fill="#D1D5DB"><rect x="234" y="104" width="70" height="6" rx="3"/><rect x="234" y="118" width="80" height="6" rx="3"/><rect x="234" y="196" width="60" height="6" rx="3"/></g>
  <!-- side by side -->
  <rect x="384" y="100" width="58" height="70" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="450" y="100" width="58" height="70" fill="#EEF2FF" stroke="#9CA3AF"/>
  <path d="M446,96 V174" stroke="#4F46E5" stroke-width="3"/>
  <text x="445" y="196" font-size="11" fill="#374151" text-anchor="middle">drag an element</text><text x="445" y="210" font-size="11" fill="#374151" text-anchor="middle">next to another</text>
  <text x="445" y="236" font-size="11" fill="#374151" text-anchor="middle">up to four elements</text>
  <!-- columns -->
  <rect x="554" y="100" width="40" height="150" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="600" y="100" width="40" height="150" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="646" y="100" width="70" height="150" fill="#FEF3C7" stroke="#B45309"/>
  <text x="681" y="178" font-size="11" fill="#92400E" text-anchor="middle">sidebar</text>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="105" y="308">Digital or Pageless:</text><text x="105" y="324">breaks size to content</text><text x="275" y="308">A4, Letter, Legal, A3:</text><text x="275" y="324">breaks move to a new page</text><text x="445" y="308">Drag to Columns</text><text x="635" y="308">Columns, 2, 3 or 4,</text><text x="635" y="324">plus sidebar layouts</text></g>
  <text x="380" y="348" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
