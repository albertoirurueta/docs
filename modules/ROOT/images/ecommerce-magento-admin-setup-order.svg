<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" width="1010" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Order in which to set up a Magento store from the Admin</title>
  <desc id="d">Nine steps in order: general settings and locale, stores and store views, attributes and attribute sets, categories and products, customer groups and account options, taxes, shipping and payment, CMS and SEO, and the pre-launch checklist. Each box names the Admin menu path and the command or API that does the same thing.</desc>
  <rect x="15" y="24" width="316" height="142" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="173.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">1. General settings</text>
  <text x="173.0" y="78" text-anchor="middle" font-size="12.5">Stores &gt; Configuration &gt; General</text>
  <text x="173.0" y="99" text-anchor="middle" font-size="12.5">country, locale, currency,</text>
  <text x="173.0" y="120" text-anchor="middle" font-size="12.5">store name, email addresses</text>
  <text x="173.0" y="141" text-anchor="middle" font-size="12.5">bin/magento config:set</text>
  <rect x="347" y="24" width="316" height="142" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">2. Stores and views</text>
  <text x="505.0" y="78" text-anchor="middle" font-size="12.5">Stores &gt; All Stores</text>
  <text x="505.0" y="99" text-anchor="middle" font-size="12.5">website, store, store view,</text>
  <text x="505.0" y="120" text-anchor="middle" font-size="12.5">root category, language</text>
  <text x="505.0" y="141" text-anchor="middle" font-size="12.5">no CLI: Admin or PHP script</text>
  <rect x="679" y="24" width="316" height="142" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="837.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">3. Attributes</text>
  <text x="837.0" y="78" text-anchor="middle" font-size="12.5">Stores &gt; Attributes</text>
  <text x="837.0" y="99" text-anchor="middle" font-size="12.5">origin, grind, bag size,</text>
  <text x="837.0" y="120" text-anchor="middle" font-size="12.5">attribute set Coffee</text>
  <text x="837.0" y="141" text-anchor="middle" font-size="12.5">REST /V1/products/attributes</text>
  <rect x="15" y="184" width="316" height="142" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="173.0" y="212" text-anchor="middle" font-size="15" font-weight="bold">4. Catalog</text>
  <text x="173.0" y="238" text-anchor="middle" font-size="12.5">Catalog &gt; Categories, Products</text>
  <text x="173.0" y="259" text-anchor="middle" font-size="12.5">Beans, Equipment,</text>
  <text x="173.0" y="280" text-anchor="middle" font-size="12.5">configurable and simple</text>
  <text x="173.0" y="301" text-anchor="middle" font-size="12.5">REST /V1/products</text>
  <rect x="347" y="184" width="316" height="142" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505.0" y="212" text-anchor="middle" font-size="15" font-weight="bold">5. Customers</text>
  <text x="505.0" y="238" text-anchor="middle" font-size="12.5">Customers &gt; Customer Groups</text>
  <text x="505.0" y="259" text-anchor="middle" font-size="12.5">Coffee Club group,</text>
  <text x="505.0" y="280" text-anchor="middle" font-size="12.5">account and address options</text>
  <text x="505.0" y="301" text-anchor="middle" font-size="12.5">REST /V1/customerGroups</text>
  <rect x="679" y="184" width="316" height="142" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="837.0" y="212" text-anchor="middle" font-size="15" font-weight="bold">6. Taxes</text>
  <text x="837.0" y="238" text-anchor="middle" font-size="12.5">Stores &gt; Tax Rules, Rates, Classes</text>
  <text x="837.0" y="259" text-anchor="middle" font-size="12.5">VAT rates, product tax</text>
  <text x="837.0" y="280" text-anchor="middle" font-size="12.5">classes, display settings</text>
  <text x="837.0" y="301" text-anchor="middle" font-size="12.5">REST /V1/taxRates, /taxRules</text>
  <rect x="15" y="344" width="316" height="142" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="173.0" y="372" text-anchor="middle" font-size="15" font-weight="bold">7. Shipping, payment</text>
  <text x="173.0" y="398" text-anchor="middle" font-size="12.5">Stores &gt; Configuration &gt; Sales</text>
  <text x="173.0" y="419" text-anchor="middle" font-size="12.5">origin, flat rate, free</text>
  <text x="173.0" y="440" text-anchor="middle" font-size="12.5">shipping, table rates, payment</text>
  <text x="173.0" y="461" text-anchor="middle" font-size="12.5">bin/magento config:set carriers/...</text>
  <rect x="347" y="344" width="316" height="142" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505.0" y="372" text-anchor="middle" font-size="15" font-weight="bold">8. CMS and SEO</text>
  <text x="505.0" y="398" text-anchor="middle" font-size="12.5">Content &gt; Pages, Blocks</text>
  <text x="505.0" y="419" text-anchor="middle" font-size="12.5">Marketing &gt; SEO and Search</text>
  <text x="505.0" y="440" text-anchor="middle" font-size="12.5">meta data, URL rewrites,</text>
  <text x="505.0" y="461" text-anchor="middle" font-size="12.5">sitemap, robots.txt</text>
  <rect x="679" y="344" width="316" height="142" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="837.0" y="372" text-anchor="middle" font-size="15" font-weight="bold">9. Pre-launch</text>
  <text x="837.0" y="398" text-anchor="middle" font-size="12.5">checklist before go-live</text>
  <text x="837.0" y="419" text-anchor="middle" font-size="12.5">URLs, TLS, emails, taxes,</text>
  <text x="837.0" y="440" text-anchor="middle" font-size="12.5">carriers, payments, cron,</text>
  <text x="837.0" y="461" text-anchor="middle" font-size="12.5">mode, 2FA, backups</text>
  <path d="M331 95.0 L345 95.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M663 95.0 L677 95.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M837.0 166 L837.0 175 L173.0 175 L173.0 182" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M331 255.0 L345 255.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M663 255.0 L677 255.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M837.0 326 L837.0 335 L173.0 335 L173.0 342" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M331 415.0 L345 415.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M663 415.0 L677 415.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
