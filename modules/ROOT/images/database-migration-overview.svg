<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrRev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Bookshop migration pipeline with Debezium</text>

  <!-- users and proxy -->
  <rect x="370" y="50" width="160" height="40" rx="6" fill="#eceff1" stroke="#607d8b"/>
  <text x="450" y="75" text-anchor="middle" fill="#263238">Users</text>
  <rect x="350" y="115" width="200" height="40" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="450" y="140" text-anchor="middle" fill="#263238">Strangler proxy</text>
  <line x1="450" y1="90" x2="450" y2="113" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- legacy side -->
  <rect x="40" y="180" width="220" height="50" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="150" y="202" text-anchor="middle" fill="#263238">Legacy app</text>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#455a64">Java EE / Struts</text>
  <rect x="40" y="270" width="220" height="60" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="150" y="295" text-anchor="middle" fill="#263238">Oracle BOOKSHOP schema</text>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="#455a64">redo / archive logs</text>
  <path d="M400,155 L150,178" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <line x1="150" y1="230" x2="150" y2="268" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- new side -->
  <rect x="640" y="180" width="220" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="202" text-anchor="middle" fill="#263238">New bookshop app</text>
  <text x="750" y="220" text-anchor="middle" font-size="12" fill="#455a64">Spring Boot 4.1</text>
  <rect x="640" y="400" width="220" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="425" text-anchor="middle" fill="#263238">PostgreSQL bookshop</text>
  <text x="750" y="445" text-anchor="middle" font-size="12" fill="#455a64">book, customer, purchase_order</text>
  <text x="750" y="463" text-anchor="middle" font-size="12" fill="#455a64">legacy_* mirror tables</text>
  <path d="M500,155 L750,178" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <line x1="800" y1="230" x2="800" y2="398" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- debezium and kafka -->
  <rect x="40" y="380" width="220" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="150" y="405" text-anchor="middle" fill="#263238">Debezium Oracle connector</text>
  <text x="150" y="424" text-anchor="middle" font-size="12" fill="#455a64">bookshop-oracle-source</text>
  <line x1="150" y1="330" x2="150" y2="378" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="358" font-size="12" fill="#455a64">LogMiner reads</text>

  <rect x="330" y="380" width="240" height="60" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="450" y="405" text-anchor="middle" fill="#263238">Kafka topics</text>
  <text x="450" y="424" text-anchor="middle" font-size="12" fill="#455a64">legacy.BOOKSHOP.BOOK, .ORDERS, ...</text>
  <line x1="260" y1="410" x2="328" y2="410" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="294" y="400" text-anchor="middle" font-size="12" fill="#455a64">events</text>

  <!-- sink + consumers -->
  <rect x="330" y="270" width="240" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="450" y="295" text-anchor="middle" fill="#263238">Consumers (anti-corruption layer)</text>
  <rect x="330" y="460" width="240" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="450" y="485" text-anchor="middle" fill="#263238">JDBC sink: bookshop-pg-mirror-sink</text>
  <line x1="420" y1="380" x2="420" y2="312" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="440" x2="450" y2="458" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M570,290 L700,290 L700,398" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M570,480 L638,470" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- reverse replication -->
  <path d="M750,480 L750,530 L20,530 L20,300 L38,300" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrRev)"/>
  <text x="385" y="550" text-anchor="middle" font-size="13" fill="#c62828">after cut-over: reverse replication (bookshop-pg-source to bookshop-oracle-reverse-sink)</text>
</svg>
