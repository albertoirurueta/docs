<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Go diagnostics: sources, artifacts and tools</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">each row is one signal path; collect one kind at a time because profilers can disturb each other</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker></defs>
  <g font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">
    <text x="170" y="82">In the program</text>
    <text x="480" y="82">Artifact</text>
    <text x="780" y="82">Tool</text>
  </g>
  <g font-size="13" fill="#222222">
    <!-- row 1: profiles -->
    <rect x="30" y="96" width="280" height="68" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="170" y="118" text-anchor="middle" font-weight="bold">runtime/pprof, net/http/pprof</text>
    <text x="170" y="136" text-anchor="middle" font-size="12">cpu, heap, allocs, goroutine, goroutineleak,</text>
    <text x="170" y="152" text-anchor="middle" font-size="12">block, mutex, threadcreate, custom</text>
    <rect x="370" y="96" width="220" height="68" rx="6" fill="#fff7e0" stroke="#b7791f"/>
    <text x="480" y="124" text-anchor="middle" font-weight="bold">profile (protobuf)</text>
    <text x="480" y="144" text-anchor="middle" font-size="12">file or /debug/pprof/ response</text>
    <rect x="650" y="96" width="260" height="68" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="780" y="118" text-anchor="middle" font-weight="bold">go tool pprof</text>
    <text x="780" y="136" text-anchor="middle" font-size="12">-top, -list, -peek, -diff_base,</text>
    <text x="780" y="152" text-anchor="middle" font-size="12">-http (flame graph by default)</text>
    <!-- row 2: traces -->
    <rect x="30" y="186" width="280" height="68" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="170" y="208" text-anchor="middle" font-weight="bold">runtime/trace</text>
    <text x="170" y="226" text-anchor="middle" font-size="12">Start/Stop, tasks, regions, logs,</text>
    <text x="170" y="242" text-anchor="middle" font-size="12">FlightRecorder ring buffer</text>
    <rect x="370" y="186" width="220" height="68" rx="6" fill="#fff7e0" stroke="#b7791f"/>
    <text x="480" y="214" text-anchor="middle" font-weight="bold">execution trace</text>
    <text x="480" y="234" text-anchor="middle" font-size="12">binary, timeline of events</text>
    <rect x="650" y="186" width="260" height="68" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="780" y="208" text-anchor="middle" font-weight="bold">go tool trace</text>
    <text x="780" y="226" text-anchor="middle" font-size="12">timeline UI, goroutine analysis,</text>
    <text x="780" y="242" text-anchor="middle" font-size="12">-pprof=net, sync, syscall, sched</text>
    <!-- row 3: metrics -->
    <rect x="30" y="276" width="280" height="68" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="170" y="298" text-anchor="middle" font-weight="bold">runtime/metrics, expvar</text>
    <text x="170" y="316" text-anchor="middle" font-size="12">ReadMemStats, NumGoroutine,</text>
    <text x="170" y="332" text-anchor="middle" font-size="12">debug.ReadGCStats</text>
    <rect x="370" y="276" width="220" height="68" rx="6" fill="#fff7e0" stroke="#b7791f"/>
    <text x="480" y="304" text-anchor="middle" font-weight="bold">time series samples</text>
    <text x="480" y="324" text-anchor="middle" font-size="12">scraped or pushed on a schedule</text>
    <rect x="650" y="276" width="260" height="68" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="780" y="298" text-anchor="middle" font-weight="bold">Prometheus and Grafana</text>
    <text x="780" y="316" text-anchor="middle" font-size="12">alerts and dashboards decide</text>
    <text x="780" y="332" text-anchor="middle" font-size="12">which profile to collect next</text>
    <!-- row 4: crash -->
    <rect x="30" y="366" width="280" height="68" rx="6" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="170" y="388" text-anchor="middle" font-weight="bold">GODEBUG, GOTRACEBACK, SIGQUIT</text>
    <text x="170" y="406" text-anchor="middle" font-size="12">gctrace, schedtrace, SetCrashOutput,</text>
    <text x="170" y="422" text-anchor="middle" font-size="12">panic and fatal error dumps</text>
    <rect x="370" y="366" width="220" height="68" rx="6" fill="#fff7e0" stroke="#b7791f"/>
    <text x="480" y="394" text-anchor="middle" font-weight="bold">text on stderr, core dump</text>
    <text x="480" y="414" text-anchor="middle" font-size="12">goroutine stacks, GC lines</text>
    <rect x="650" y="366" width="260" height="68" rx="6" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="780" y="388" text-anchor="middle" font-weight="bold">log pipeline, Delve, GDB</text>
    <text x="780" y="406" text-anchor="middle" font-size="12">read the dump, attach to the process,</text>
    <text x="780" y="422" text-anchor="middle" font-size="12">open the core file</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M310,130 L366,130"/>
    <path d="M590,130 L646,130"/>
    <path d="M310,220 L366,220"/>
    <path d="M590,220 L646,220"/>
    <path d="M310,310 L366,310"/>
    <path d="M590,310 L646,310"/>
    <path d="M310,400 L366,400"/>
    <path d="M590,400 L646,400"/>
  </g>
  <g stroke="#1c4b73" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M840,186 L840,168"/>
  </g>
  <text x="850" y="180" font-size="11" fill="#666666">trace to profile</text>
</svg>
