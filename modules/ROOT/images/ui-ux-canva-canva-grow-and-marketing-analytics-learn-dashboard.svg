    <rect x="160" y="94" width="96" height="58" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="208" y="118">CPM</text><rect x="178" y="128" width="60" height="8" rx="3" fill="#E5E7EB"/>
    <rect x="264" y="94" width="96" height="58" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="312" y="118">Impressions</text><rect x="282" y="128" width="60" height="8" rx="3" fill="#E5E7EB"/>
