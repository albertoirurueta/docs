<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where the store grows in the database: orders, sessions and Action Scheduler tables on RDS</title>
  <desc id="d">Diagram of where a WooCommerce store's data grows in the database tier of the Pocket Coffee cluster. On the left, three kinds of pod of the EKS cluster pocketcoffee-prod: the web Deployment, which writes orders, stock reservations and sessions during checkout; the worker Deployment, which runs Action Scheduler actions; and the weekly database-maintenance CronJob, which deletes old actions, expired sessions and expired transients. In the centre, the writer of the RDS for MariaDB 11.8 instance pocketcoffee-prod, Multi-AZ, holding four groups of tables. The order tables of High-Performance Order Storage (wc_orders, wc_order_addresses, wc_order_operational_data, wc_orders_meta, the order item tables and the analytics lookup tables) grow with the number of orders and are kept for accounting. The woocommerce_sessions table grows with visitors and bots and is swept every twelve hours once rows expire. The Action Scheduler tables (actions, logs, claims, groups) grow with every email, webhook and synchronisation and are cleaned daily by the library, after fourteen days for finished actions and ninety-three days for failed ones. A group of small hot tables (wc_reserved_stock, wc_rate_limits and wp_options with transients and locks) is where row locks happen at checkout. On the right, a synchronous standby in a second availability zone that serves no reads, an optional asynchronous read replica that serves only anonymous page views, chosen by LudicrousDB from the request, and a reminder to size the database from bytes per order.</desc>
  <rect x="0" y="0" width="960" height="596" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9b3e6"/></marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" text-anchor="start" fill="#f2f5f8">Where a store grows in the database tier</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Pocket Coffee on EKS pocketcoffee-prod and RDS pocketcoffee-prod (tables shown without the wp_ prefix)</text>
  <rect x="30" y="76" width="230" height="112" rx="10" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="44" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">pocketcoffee-web</text>
  <text x="44" y="118" font-size="11.5" text-anchor="start" fill="#f2f5f8">nginx + php-fpm, many pods</text>
  <text x="44" y="138" font-size="11.5" text-anchor="start" fill="#f2f5f8">Checkout writes the order,</text>
  <text x="44" y="154" font-size="11.5" text-anchor="start" fill="#f2f5f8">the stock reservation</text>
  <text x="44" y="170" font-size="11.5" text-anchor="start" fill="#f2f5f8">and the session row</text>
  <rect x="30" y="212" width="230" height="112" rx="10" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="44" y="234" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">pocketcoffee-worker</text>
  <text x="44" y="254" font-size="11.5" text-anchor="start" fill="#f2f5f8">WP-CLI Action Scheduler runner</text>
  <text x="44" y="274" font-size="11.5" text-anchor="start" fill="#f2f5f8">Writes actions, their logs</text>
  <text x="44" y="290" font-size="11.5" text-anchor="start" fill="#f2f5f8">and claims on every run</text>
  <rect x="30" y="348" width="230" height="112" rx="10" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="44" y="370" font-size="14" font-weight="bold" text-anchor="start" fill="#f4b860">pocketcoffee-db-maintenance</text>
  <text x="44" y="390" font-size="11.5" text-anchor="start" fill="#f2f5f8">Weekly CronJob</text>
  <text x="44" y="410" font-size="11.5" text-anchor="start" fill="#f2f5f8">Deletes old actions, expired</text>
  <text x="44" y="426" font-size="11.5" text-anchor="start" fill="#f2f5f8">sessions and transients</text>
  <rect x="300" y="70" width="440" height="498" rx="10" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="316" y="92" font-size="14" font-weight="bold" text-anchor="start" fill="#f2f5f8">RDS for MariaDB 11.8: writer of pocketcoffee-prod</text>
  <text x="316" y="110" font-size="11" text-anchor="start" fill="#f2f5f8">Multi-AZ, gp3 with a growth ceiling, group pocketcoffee-mariadb11-8</text>
  <rect x="316" y="124" width="408" height="120" rx="10" fill="#3f6e9a"/>
  <text x="330" y="146" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f4b860">Orders (HPOS)</text>
  <text x="330" y="166" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_orders, wc_order_addresses, wc_order_operational_data,</text>
  <text x="330" y="183" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_orders_meta, woocommerce_order_items, _order_itemmeta,</text>
  <text x="330" y="200" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_order_stats and the other wc_order_*_lookup tables</text>
  <text x="330" y="219" font-size="11.5" font-weight="bold" text-anchor="start" fill="#9fd3c7">Grows with orders. Kept: accounting and refunds need it</text>
  <rect x="316" y="256" width="408" height="92" rx="10" fill="#4d7c5a"/>
  <text x="330" y="278" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f4b860">Sessions</text>
  <text x="330" y="298" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_sessions: one row per visitor with a cart</text>
  <text x="330" y="315" font-size="11.5" text-anchor="start" fill="#f2f5f8">(guests, logged-in customers and bots alike)</text>
  <text x="330" y="334" font-size="11.5" font-weight="bold" text-anchor="start" fill="#9fd3c7">Grows with visitors. Deleted after expiry, sweep every 12 h</text>
  <rect x="316" y="360" width="408" height="112" rx="10" fill="#7a5c3a"/>
  <text x="330" y="382" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f4b860">Action Scheduler</text>
  <text x="330" y="402" font-size="11.5" text-anchor="start" fill="#f2f5f8">actionscheduler_actions, _logs, _claims, _groups</text>
  <text x="330" y="419" font-size="11.5" text-anchor="start" fill="#f2f5f8">One row per email, webhook, sync or renewal</text>
  <text x="330" y="438" font-size="11.5" font-weight="bold" text-anchor="start" fill="#9fd3c7">Finished rows deleted after 14 d, failed after 93 d</text>
  <rect x="316" y="484" width="408" height="72" rx="10" fill="#2f4a44"/>
  <text x="330" y="506" font-size="13.5" font-weight="bold" text-anchor="start" fill="#f4b860">Small and hot</text>
  <text x="330" y="526" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_reserved_stock, wc_rate_limits, options (locks, transients)</text>
  <text x="330" y="545" font-size="11.5" font-weight="bold" text-anchor="start" fill="#9fd3c7">Row locks at checkout</text>
  <rect x="770" y="124" width="160" height="132" rx="10" fill="#3d5266" stroke="#c9b3e6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="782" y="146" font-size="13.5" font-weight="bold" text-anchor="start" fill="#c9b3e6">Read replica</text>
  <text x="782" y="164" font-size="11" text-anchor="start" fill="#f2f5f8">optional, asynchronous</text>
  <text x="782" y="184" font-size="11.5" text-anchor="start" fill="#f2f5f8">Anonymous page views</text>
  <text x="782" y="200" font-size="11.5" text-anchor="start" fill="#f2f5f8">only. LudicrousDB picks</text>
  <text x="782" y="216" font-size="11.5" text-anchor="start" fill="#f2f5f8">it from the request</text>
  <text x="782" y="238" font-size="11" text-anchor="start" fill="#9fd3c7">Lag alarm at 5 s</text>
  <rect x="770" y="300" width="160" height="96" rx="10" fill="#3d5266" stroke="#9fd3c7" stroke-width="2"/>
  <text x="782" y="322" font-size="13.5" font-weight="bold" text-anchor="start" fill="#9fd3c7">Standby, zone b</text>
  <text x="782" y="342" font-size="11.5" text-anchor="start" fill="#f2f5f8">synchronous copy</text>
  <text x="782" y="358" font-size="11.5" text-anchor="start" fill="#f2f5f8">no reads, takes over</text>
  <text x="782" y="374" font-size="11.5" text-anchor="start" fill="#f2f5f8">on a failover</text>
  <rect x="770" y="430" width="160" height="114" rx="10" fill="#33485c" stroke="#f4b860" stroke-width="2"/>
  <text x="782" y="452" font-size="13" font-weight="bold" text-anchor="start" fill="#f4b860">Size it from</text>
  <text x="782" y="470" font-size="11.5" text-anchor="start" fill="#f2f5f8">bytes per order,</text>
  <text x="782" y="486" font-size="11.5" text-anchor="start" fill="#f2f5f8">orders per month</text>
  <text x="782" y="502" font-size="11.5" text-anchor="start" fill="#f2f5f8">and the working set,</text>
  <text x="782" y="518" font-size="11.5" text-anchor="start" fill="#f2f5f8">not from row counts</text>
  <path d="M260,132 L298,132" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M260,268 L298,268" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M260,404 L298,404" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <path d="M742,184 L768,184" fill="none" stroke="#c9b3e6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#c)"/>
  <path d="M742,348 L768,348" fill="none" stroke="#9fd3c7" stroke-width="2" marker-end="url(#b)"/>
</svg>
