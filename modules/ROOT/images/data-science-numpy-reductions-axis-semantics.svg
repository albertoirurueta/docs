<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Axis semantics of a reduction</title>
  <desc id="d1">A 2 by 3 matrix is summed along axis 0 to give a row of three column totals, and along axis 1 to give a column of two row totals. A table lists how the shape (2, 3, 4) changes for axis 0, 1, 2 and for keepdims.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">The axis you name is the one that disappears</text>
  <!-- matrix -->
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A" text-anchor="middle">
    <rect x="40" y="70" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="70" y="98">1</text>
    <rect x="104" y="70" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="134" y="98">2</text>
    <rect x="168" y="70" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="198" y="98">3</text>
    <rect x="40" y="118" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="70" y="146">4</text>
    <rect x="104" y="118" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="134" y="146">5</text>
    <rect x="168" y="118" width="60" height="44" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="198" y="146">6</text>
    <!-- axis 0 result -->
    <rect x="40" y="226" width="60" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="70" y="254">5</text>
    <rect x="104" y="226" width="60" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="134" y="254">7</text>
    <rect x="168" y="226" width="60" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="198" y="254">9</text>
    <!-- axis 1 result -->
    <rect x="272" y="70" width="60" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="302" y="98">6</text>
    <rect x="272" y="118" width="60" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="302" y="146">15</text>
  </g>
  <line x1="70" y1="172" x2="70" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="134" y1="172" x2="134" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="198" y1="172" x2="198" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="236" y1="92" x2="264" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="236" y1="140" x2="264" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <circle cx="24" cy="196" r="11" fill="#0F172A"/><text x="24" y="201" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="350" cy="116" r="11" fill="#0F172A"/><text x="350" y="121" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="40" y="292" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">sum(axis=0) = [5 7 9]</text>
  <text x="272" y="190" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">sum(axis=1)</text>
  <text x="272" y="208" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">= [6 15]</text>
  <text x="40" y="326" font-size="12" fill="#475569">Matrix shape (2, 3): axis 0 runs down the rows, axis 1 runs across the columns.</text>
  <!-- shape table -->
  <rect x="400" y="62" width="296" height="252" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="418" y="90" font-size="16" font-weight="bold" fill="#0F172A">Shape (2, 3, 4)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="418" y="126">axis=0</text><text x="548" y="126">(3, 4)</text>
    <text x="418" y="160">axis=1</text><text x="548" y="160">(2, 4)</text>
    <text x="418" y="194">axis=2</text><text x="548" y="194">(2, 3)</text>
    <text x="418" y="228">axis=(0, 2)</text><text x="548" y="228">(3,)</text>
    <text x="418" y="262">axis=None</text><text x="548" y="262">()</text>
    <text x="418" y="296">axis=1, keepdims</text><text x="598" y="296">(2, 1, 4)</text>
  </g>
  <line x1="410" y1="104" x2="686" y2="104" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
