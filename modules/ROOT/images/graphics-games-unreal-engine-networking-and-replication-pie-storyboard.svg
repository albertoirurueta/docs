<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: test two players in the editor</text>
<rect x="14" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="30" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="81.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Advanced Settings</text>
<text x="81.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">Multiplayer Options</text>
<text x="81.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">Number of Players: 2</text>
<text x="81.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Play settings</text>
<line x1="149" y1="140" x2="159" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="176" cy="76" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="176" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Play As Client</text>
<text x="227.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">a dedicated server</text>
<text x="227.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">starts in the</text>
<text x="227.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">background</text>
<text x="227.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Net mode</text>
<line x1="295" y1="140" x2="305" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="306" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="322" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="322" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="373.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">One Process: on</text>
<text x="373.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">loads faster, less</text>
<text x="373.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">like a real session</text>
<text x="373.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Run Under</text>
<line x1="441" y1="140" x2="451" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="452" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="468" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="468" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="519.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Add lag and loss</text>
<text x="519.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">in the Play</text>
<text x="519.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">settings, then</text>
<text x="519.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">press Play</text>
<text x="519.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Network emulation</text>
<line x1="587" y1="140" x2="597" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="598" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="614" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="614" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="665.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3">Window titles show</text>
<text x="665.0" y="142" text-anchor="middle" font-size="12" fill="#3730A3">Server or Client N</text>
<text x="665.0" y="164" text-anchor="middle" font-size="12" fill="#3730A3">type stat net in</text>
<text x="665.0" y="186" text-anchor="middle" font-size="12" fill="#3730A3">the console</text>
<text x="665.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Inspect</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#374151">Play As Client with one player gives one window that behaves like a client of a dedicated server.</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="#374151">With Play As Listen Server the editor window is both server and client.</text>
</svg>
