<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="te" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Tessellation turns one patch into many triangles</text>
<polygon points="40,260 240,260 140,87" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="140" y="285" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">input patch (3 control points)</text>
<polygon points="300,260 500,260 400,87" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<line x1="325.0" y1="216.75" x2="475.0" y2="216.75" stroke="#4F46E5" stroke-width="1"/>
<line x1="350.0" y1="173.5" x2="450.0" y2="173.5" stroke="#4F46E5" stroke-width="1"/>
<line x1="375.0" y1="130.25" x2="425.0" y2="130.25" stroke="#4F46E5" stroke-width="1"/>
<line x1="350.0" y1="260" x2="325.0" y2="216.75" stroke="#4F46E5" stroke-width="1"/>
<line x1="350.0" y1="260" x2="425.0" y2="130.25" stroke="#4F46E5" stroke-width="1"/>
<line x1="400.0" y1="260" x2="350.0" y2="173.5" stroke="#4F46E5" stroke-width="1"/>
<line x1="400.0" y1="260" x2="450.0" y2="173.5" stroke="#4F46E5" stroke-width="1"/>
<line x1="450.0" y1="260" x2="375.0" y2="130.25" stroke="#4F46E5" stroke-width="1"/>
<line x1="450.0" y1="260" x2="475.0" y2="216.75" stroke="#4F46E5" stroke-width="1"/>
<text x="400" y="285" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">level 4 tessellated</text>
<rect x="530" y="70" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="88.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Control stage</text>
<text x="630.0" y="103.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">sets inner and outer levels</text>
<rect x="530" y="134" width="200" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="152.5" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Tessellator</text>
<text x="630.0" y="167.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fixed function, barycentric uvw</text>
<rect x="530" y="198" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="216.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Evaluation stage</text>
<text x="630.0" y="231.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">places each new vertex</text>
<line x1="630" y1="114" x2="630" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#te)"/>
<line x1="630" y1="178" x2="630" y2="198" stroke="#4B5563" stroke-width="1.5" marker-end="url(#te)"/>
<text x="630" y="268" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">GL: TCS/TES; D3D: hull/domain; Metal: factors</text>
<text x="630" y="283" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">in a compute pass plus post-tessellation vertex</text>
</svg>
