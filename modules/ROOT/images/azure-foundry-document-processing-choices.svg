<svg viewBox="0 0 820 500" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Document processing: Document Intelligence vs Content Understanding vs an LLM</text>

  <!-- Columns -->
  <rect x="190" y="48" width="200" height="54" rx="6" fill="#1565c0"/>
  <text x="290" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Document Intelligence</text>
  <text x="290" y="88" text-anchor="middle" font-size="10.5" fill="#e3f2fd">prebuilt and custom models</text>

  <rect x="400" y="48" width="200" height="54" rx="6" fill="#2e7d32"/>
  <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Content Understanding</text>
  <text x="500" y="88" text-anchor="middle" font-size="10.5" fill="#e8f5e9">analyzers with a field schema</text>

  <rect x="610" y="48" width="190" height="54" rx="6" fill="#6a1b9a"/>
  <text x="705" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Foundry Model (LLM)</text>
  <text x="705" y="88" text-anchor="middle" font-size="10.5" fill="#f3e5f5">prompt + structured output</text>

  <g font-size="11" fill="#263238">
    <!-- Row: best for -->
    <rect x="20" y="110" width="780" height="62" fill="#f5f7fa"/>
    <text x="30" y="145" font-weight="700">Best for</text>
    <text x="290" y="132" text-anchor="middle">known document types:</text>
    <text x="290" y="148" text-anchor="middle">invoices, receipts, IDs, tax forms;</text>
    <text x="290" y="164" text-anchor="middle">your own fixed forms</text>
    <text x="500" y="132" text-anchor="middle">fields you describe in words;</text>
    <text x="500" y="148" text-anchor="middle">varied layouts; audio and</text>
    <text x="500" y="164" text-anchor="middle">video as well as documents</text>
    <text x="705" y="132" text-anchor="middle">one-off questions,</text>
    <text x="705" y="148" text-anchor="middle">prototypes, open-ended</text>
    <text x="705" y="164" text-anchor="middle">reasoning over text</text>

    <!-- Row: determinism -->
    <rect x="20" y="176" width="780" height="62" fill="#ffffff"/>
    <text x="30" y="211" font-weight="700">Determinism</text>
    <rect x="215" y="196" width="150" height="22" rx="11" fill="#c8e6c9"/>
    <text x="290" y="211" text-anchor="middle" font-weight="700" fill="#1b5e20">high</text>
    <rect x="425" y="196" width="150" height="22" rx="11" fill="#fff9c4"/>
    <text x="500" y="211" text-anchor="middle" font-weight="700" fill="#827717">medium (LLM inside)</text>
    <rect x="630" y="196" width="150" height="22" rx="11" fill="#ffcdd2"/>
    <text x="705" y="211" text-anchor="middle" font-weight="700" fill="#b71c1c">low unless constrained</text>

    <!-- Row: confidence/grounding -->
    <rect x="20" y="242" width="780" height="62" fill="#f5f7fa"/>
    <text x="30" y="270" font-weight="700">Confidence and</text>
    <text x="30" y="285" font-weight="700">grounding</text>
    <text x="290" y="270" text-anchor="middle">per-field confidence,</text>
    <text x="290" y="286" text-anchor="middle">bounding boxes per page</text>
    <text x="500" y="270" text-anchor="middle">per-field confidence and</text>
    <text x="500" y="286" text-anchor="middle">source grounding</text>
    <text x="705" y="270" text-anchor="middle">none built in:</text>
    <text x="705" y="286" text-anchor="middle">you validate the output</text>

    <!-- Row: setup -->
    <rect x="20" y="308" width="780" height="62" fill="#ffffff"/>
    <text x="30" y="343" font-weight="700">Setup effort</text>
    <text x="290" y="336" text-anchor="middle">none for prebuilt;</text>
    <text x="290" y="352" text-anchor="middle">label 5+ samples for custom</text>
    <text x="500" y="336" text-anchor="middle">write a field schema,</text>
    <text x="500" y="352" text-anchor="middle">deploy models, test</text>
    <text x="705" y="336" text-anchor="middle">write a prompt; build</text>
    <text x="705" y="352" text-anchor="middle">chunking and evaluation</text>

    <!-- Row: cost -->
    <rect x="20" y="374" width="780" height="62" fill="#f5f7fa"/>
    <text x="30" y="409" font-weight="700">Cost model</text>
    <text x="290" y="402" text-anchor="middle">per page,</text>
    <text x="290" y="418" text-anchor="middle">lowest at volume</text>
    <text x="500" y="402" text-anchor="middle">per page/minute for extraction</text>
    <text x="500" y="418" text-anchor="middle">+ model tokens for fields</text>
    <text x="705" y="402" text-anchor="middle">per token,</text>
    <text x="705" y="418" text-anchor="middle">grows with document length</text>
  </g>

  <!-- bottom arrow -->
  <line x1="200" y1="462" x2="790" y2="462" stroke="#78909c" stroke-width="2"/>
  <polygon points="790,456 802,462 790,468" fill="#78909c"/>
  <text x="30" y="466" font-size="11" font-weight="700" fill="#455a64">Flexibility</text>
  <text x="200" y="484" font-size="10" fill="#455a64">fixed schema, cheapest, most predictable</text>
  <text x="790" y="484" text-anchor="end" font-size="10" fill="#455a64">any question, most flexible, least predictable</text>
</svg>
