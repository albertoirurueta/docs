<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 400" width="1030" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Five ways to run Magento locally in Docker</title>
  <desc id="d">Five cards compare Cloud Docker for Commerce, which is the official tool, with the community tools Warden, DDEV and markshust docker-magento, and with a hand-written Docker Compose file. Each card lists who maintains it, the latest release checked on 2026-10-27, how it reaches the store and how Magento is installed.</desc>
  <rect x="15" y="24" width="188" height="328" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="109.0" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">Cloud Docker for Commerce</text>
  <text x="109.0" y="74" text-anchor="middle" font-size="12.5" opacity="0.85">official tool</text>
  <line x1="33" y1="88" x2="185" y2="88" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="109.0" y="116" text-anchor="middle" font-size="12.5">magento-cloud-docker</text>
  <text x="109.0" y="144" text-anchor="middle" font-size="12.5">latest 1.4.10 (2026-10-12)</text>
  <text x="109.0" y="172" text-anchor="middle" font-size="12.5">driven by ece-tools and</text>
  <text x="109.0" y="200" text-anchor="middle" font-size="12.5">.magento.docker.yml</text>
  <text x="109.0" y="228" text-anchor="middle" font-size="12.5">emulates Cloud; also on-prem</text>
  <text x="109.0" y="256" text-anchor="middle" font-size="12.5">needs Marketplace keys</text>
  <text x="109.0" y="284" text-anchor="middle" font-size="12.5">docs: 2 CPUs, 6 GB RAM</text>
  <rect x="217" y="24" width="188" height="328" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="311.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Warden</text>
  <text x="311.0" y="74" text-anchor="middle" font-size="12.5" opacity="0.85">community</text>
  <line x1="235" y1="88" x2="387" y2="88" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="311.0" y="116" text-anchor="middle" font-size="12.5">wardenenv/warden, MIT</text>
  <text x="311.0" y="144" text-anchor="middle" font-size="12.5">latest 0.16.1 (2026-04-14)</text>
  <text x="311.0" y="172" text-anchor="middle" font-size="12.5">Traefik TLS, *.test DNS</text>
  <text x="311.0" y="200" text-anchor="middle" font-size="12.5">env type magento2</text>
  <text x="311.0" y="228" text-anchor="middle" font-size="12.5">defaults: PHP 8.4,</text>
  <text x="311.0" y="256" text-anchor="middle" font-size="12.5">OpenSearch 3.3, Redis 7.2</text>
  <text x="311.0" y="284" text-anchor="middle" font-size="12.5">many projects side by side</text>
  <rect x="419" y="24" width="188" height="328" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="513.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">DDEV</text>
  <text x="513.0" y="74" text-anchor="middle" font-size="12.5" opacity="0.85">community</text>
  <line x1="437" y1="88" x2="589" y2="88" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="513.0" y="116" text-anchor="middle" font-size="12.5">ddev/ddev, Apache-2.0</text>
  <text x="513.0" y="144" text-anchor="middle" font-size="12.5">latest v1.25.5 (2026-10-26)</text>
  <text x="513.0" y="172" text-anchor="middle" font-size="12.5">project type magento2</text>
  <text x="513.0" y="200" text-anchor="middle" font-size="12.5">https://name.ddev.site</text>
  <text x="513.0" y="228" text-anchor="middle" font-size="12.5">add-on for OpenSearch</text>
  <text x="513.0" y="256" text-anchor="middle" font-size="12.5">docs install from</text>
  <text x="513.0" y="284" text-anchor="middle" font-size="12.5">repo.magento.com</text>
  <rect x="621" y="24" width="188" height="328" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="715.0" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">markshust/docker-magento</text>
  <text x="715.0" y="74" text-anchor="middle" font-size="12.5" opacity="0.85">community</text>
  <line x1="639" y1="88" x2="791" y2="88" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="715.0" y="116" text-anchor="middle" font-size="12.5">Mark Shust, MIT</text>
  <text x="715.0" y="144" text-anchor="middle" font-size="12.5">latest 53.1.0 (2026-09-21)</text>
  <text x="715.0" y="172" text-anchor="middle" font-size="12.5">bin/ helper scripts</text>
  <text x="715.0" y="200" text-anchor="middle" font-size="12.5">one-line setup script</text>
  <text x="715.0" y="228" text-anchor="middle" font-size="12.5">default edition: Mage-OS</text>
  <text x="715.0" y="256" text-anchor="middle" font-size="12.5">PHP 8.1 to 8.5 images</text>
  <text x="715.0" y="284" text-anchor="middle" font-size="12.5">Nginx, Varnish, RabbitMQ</text>
  <rect x="823" y="24" width="188" height="328" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="917.0" y="52" text-anchor="middle" font-size="15" font-weight="bold">Hand-written Compose</text>
  <text x="917.0" y="74" text-anchor="middle" font-size="12.5" opacity="0.85">this page</text>
  <line x1="841" y1="88" x2="993" y2="88" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="917.0" y="116" text-anchor="middle" font-size="12.5">4 services in one file</text>
  <text x="917.0" y="144" text-anchor="middle" font-size="12.5">web, db, search, cache</text>
  <text x="917.0" y="172" text-anchor="middle" font-size="12.5">http://localhost:8093</text>
  <text x="917.0" y="200" text-anchor="middle" font-size="12.5">no TLS, no DNS setup</text>
  <text x="917.0" y="228" text-anchor="middle" font-size="12.5">Mage-OS 3.6.0, no keys</text>
  <text x="917.0" y="256" text-anchor="middle" font-size="12.5">every step run and</text>
  <text x="917.0" y="284" text-anchor="middle" font-size="12.5">measured here</text>
  <text x="515" y="380" text-anchor="middle" font-size="12" opacity="0.85">Release data and star counts checked on GitHub on 2026-10-27</text>
</svg>
