<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How the iOS signing pieces fit together</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">A provisioning profile is the thing that binds a certificate, an App ID, and (for non-store builds) a device list</text>

  <defs>
    <marker id="isp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Signing certificate -->
  <rect x="20" y="70" width="225" height="92" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="132.5" y="95" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Signing certificate</text>
  <text x="132.5" y="114" font-size="10" fill="#333333" text-anchor="middle">Apple Distribution (or Development)</text>
  <text x="132.5" y="128" font-size="10" fill="#333333" text-anchor="middle">Issued by Apple; proves who signed</text>
  <text x="132.5" y="142" font-size="10" fill="#333333" text-anchor="middle">Private key stays in the Keychain</text>
  <text x="132.5" y="156" font-size="10" fill="#333333" text-anchor="middle">(or in EAS-managed credentials)</text>

  <!-- App ID -->
  <rect x="267" y="70" width="225" height="92" rx="8" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="379.5" y="95" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">App ID (identifier)</text>
  <text x="379.5" y="114" font-size="10" fill="#333333" text-anchor="middle">com.irurueta.places</text>
  <text x="379.5" y="128" font-size="10" fill="#333333" text-anchor="middle">Registered in the developer portal</text>
  <text x="379.5" y="142" font-size="10" fill="#333333" text-anchor="middle">Carries the capabilities the app uses</text>
  <text x="379.5" y="156" font-size="10" fill="#333333" text-anchor="middle">(push, App Groups, Sign in with Apple)</text>

  <!-- Devices -->
  <rect x="515" y="70" width="225" height="92" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="627.5" y="95" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Registered devices</text>
  <text x="627.5" y="114" font-size="10" fill="#333333" text-anchor="middle">UDIDs of the test iPhones/iPads</text>
  <text x="627.5" y="128" font-size="10" fill="#333333" text-anchor="middle">Development and ad hoc only</text>
  <text x="627.5" y="142" font-size="10" fill="#333333" text-anchor="middle">App Store profiles list no devices</text>
  <text x="627.5" y="156" font-size="10" fill="#333333" text-anchor="middle">at all</text>

  <!-- Converge into the profile -->
  <line x1="132.5" y1="162" x2="132.5" y2="182" stroke="#333333" stroke-width="1.4"/>
  <line x1="379.5" y1="162" x2="379.5" y2="182" stroke="#333333" stroke-width="1.4"/>
  <line x1="627.5" y1="162" x2="627.5" y2="182" stroke="#333333" stroke-width="1.4"/>
  <line x1="132.5" y1="182" x2="627.5" y2="182" stroke="#333333" stroke-width="1.4"/>
  <line x1="379.5" y1="182" x2="379.5" y2="204" stroke="#333333" stroke-width="1.4" marker-end="url(#isp-arrow)"/>

  <!-- Provisioning profile -->
  <rect x="190" y="208" width="380" height="80" rx="8" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="380" y="233" font-size="12.5" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Provisioning profile</text>
  <text x="380" y="252" font-size="10" fill="#333333" text-anchor="middle">Binds certificate + App ID + device list into one Apple-issued file</text>
  <text x="380" y="266" font-size="10" fill="#333333" text-anchor="middle">Also carries the entitlements the signed binary is allowed to claim</text>
  <text x="380" y="280" font-size="10" fill="#333333" text-anchor="middle">Embedded inside the app bundle at build time; expires and must be renewed</text>

  <!-- Elbow down to the archive -->
  <path d="M380,288 L380,308 L215,308 L215,326" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#isp-arrow)"/>

  <!-- Archive -->
  <rect x="90" y="330" width="250" height="80" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="215" y="355" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Archive -&gt; signed .ipa</text>
  <text x="215" y="374" font-size="10" fill="#333333" text-anchor="middle">Xcode Product -&gt; Archive, or EAS Build,</text>
  <text x="215" y="388" font-size="10" fill="#333333" text-anchor="middle">signs the binary with the certificate</text>
  <text x="215" y="402" font-size="10" fill="#333333" text-anchor="middle">and embeds the matching profile</text>

  <line x1="340" y1="370" x2="415" y2="370" stroke="#333333" stroke-width="1.4" marker-end="url(#isp-arrow)"/>

  <!-- App Store Connect -->
  <rect x="420" y="330" width="250" height="80" rx="8" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="545" y="355" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">App Store Connect</text>
  <text x="545" y="374" font-size="10" fill="#333333" text-anchor="middle">Rejects the upload if the signature,</text>
  <text x="545" y="388" font-size="10" fill="#333333" text-anchor="middle">bundle id, entitlements, or privacy</text>
  <text x="545" y="402" font-size="10" fill="#333333" text-anchor="middle">manifest do not line up</text>

  <text x="380" y="444" font-size="10.5" fill="#666666" text-anchor="middle">Almost every code-signing error is one of these five pieces disagreeing with another: a profile that</text>
  <text x="380" y="459" font-size="10.5" fill="#666666" text-anchor="middle">does not include the certificate used, a bundle id that does not match the App ID, or an unregistered device.</text>
</svg>
