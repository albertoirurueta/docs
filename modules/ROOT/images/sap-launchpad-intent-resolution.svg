<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">How the SAP Fiori launchpad turns a tile click into a running app: tile, intent, target mapping, deployed app, with the role, space and manifest inbound that support each step</title>
  <desc id="d">A tile carries a semantic object and an action, for example ExpenseClaim and display. Together they form the intent ExpenseClaim-display. The launchpad resolves the intent through a target mapping, which sits in a catalog assigned to the role of the user, to the URL of the deployed app. A space and a page place the tile for the user. The inbound in the manifest.json of the app declares which intent the app can serve.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="40" width="202" height="100" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="121" y="75" text-anchor="middle" font-size="15" font-weight="bold">Tile</text>
  <text x="121" y="95" text-anchor="middle" font-size="13">semantic object</text>
  <text x="121" y="115" text-anchor="middle" font-size="13">and action</text>
  <rect x="286" y="40" width="202" height="100" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="387" y="75" text-anchor="middle" font-size="15" font-weight="bold">Intent</text>
  <text x="387" y="95" text-anchor="middle" font-size="13">#ExpenseClaim-display</text>
  <text x="387" y="115" text-anchor="middle" font-size="13">plus parameters</text>
  <rect x="552" y="40" width="202" height="100" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="653" y="75" text-anchor="middle" font-size="15" font-weight="bold">Target mapping</text>
  <text x="653" y="95" text-anchor="middle" font-size="13">intent to app</text>
  <text x="653" y="115" text-anchor="middle" font-size="13">kept in a catalog</text>
  <rect x="818" y="40" width="202" height="100" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="919" y="75" text-anchor="middle" font-size="15" font-weight="bold">Deployed app</text>
  <text x="919" y="95" text-anchor="middle" font-size="13">ABAP repository or</text>
  <text x="919" y="115" text-anchor="middle" font-size="13">HTML5 repository</text>
  <line x1="222" y1="90" x2="286" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="488" y1="90" x2="552" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="754" y1="90" x2="818" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="28" text-anchor="middle" font-size="13" font-weight="bold">At run time: the launchpad resolves the intent</text>
  <rect x="20" y="250" width="202" height="100" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="121" y="285" text-anchor="middle" font-size="15" font-weight="bold">Space and page</text>
  <text x="121" y="305" text-anchor="middle" font-size="13">place the tile</text>
  <text x="121" y="325" text-anchor="middle" font-size="13">for the user</text>
  <rect x="552" y="250" width="202" height="100" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="653" y="285" text-anchor="middle" font-size="15" font-weight="bold">Business role</text>
  <text x="653" y="305" text-anchor="middle" font-size="13">receives the catalog</text>
  <text x="653" y="325" text-anchor="middle" font-size="13">that holds the mapping</text>
  <rect x="818" y="250" width="202" height="100" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="919" y="285.5" text-anchor="middle" font-size="14" font-weight="bold">Inbound in manifest.json</text>
  <text x="919" y="304.5" text-anchor="middle" font-size="12">the intent the app</text>
  <text x="919" y="323.5" text-anchor="middle" font-size="12">declares it can serve</text>
  <line x1="121" y1="250" x2="121" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="653" y1="250" x2="653" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="919" y1="250" x2="919" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="200" text-anchor="start" font-size="13" font-weight="bold">Set up by the administrator and the developer</text>
  <text x="520" y="400" text-anchor="middle" font-size="13">The same intent can resolve to a different app for a different role, because the mapping travels in a catalog.</text>
</svg>
