<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Hug contents, Fill container and Fixed</text>
  <g stroke-width="2">
    <rect x="20" y="50" width="226" height="230" rx="12" fill="#EEF2FF" stroke="#4F46E5"/>
    <rect x="267" y="50" width="226" height="230" rx="12" fill="#FFFFFF" stroke="#4B5563"/>
    <rect x="514" y="50" width="226" height="230" rx="12" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <text x="133" y="76" font-size="15" font-weight="bold" fill="#3730A3" text-anchor="middle">Hug contents</text>
  <text x="380" y="76" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Fill container</text>
  <text x="627" y="76" font-size="15" font-weight="bold" fill="#92400E" text-anchor="middle">Fixed</text>
  <!-- hug -->
  <rect x="60" y="100" width="146" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><rect x="72" y="112" width="122" height="16" rx="3" fill="#C7D2FE"/>
  <rect x="60" y="160" width="86" height="40" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><rect x="72" y="172" width="62" height="16" rx="3" fill="#C7D2FE"/>
  <text x="133" y="228" font-size="12" fill="#374151" text-anchor="middle">Frame shrinks or grows</text><text x="133" y="246" font-size="12" fill="#374151" text-anchor="middle">with its children + padding</text><text x="133" y="264" font-size="12" fill="#374151" text-anchor="middle">Double-click an edge</text>
  <!-- fill -->
  <rect x="283" y="96" width="194" height="108" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="291" y="104" width="50" height="92" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><rect x="349" y="104" width="120" height="92" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="380" y="228" font-size="12" fill="#374151" text-anchor="middle">Child stretches into the</text><text x="380" y="246" font-size="12" fill="#374151" text-anchor="middle">parent's free space</text><text x="380" y="264" font-size="12" fill="#374151" text-anchor="middle">Option/Alt + double-click an edge</text>
  <!-- fixed -->
  <rect x="540" y="100" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><rect x="552" y="112" width="40" height="16" rx="3" fill="#FDE68A"/>
  <rect x="540" y="160" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><rect x="552" y="172" width="76" height="16" rx="3" fill="#FDE68A"/>
  <text x="627" y="228" font-size="12" fill="#374151" text-anchor="middle">Size stays constant</text><text x="627" y="246" font-size="12" fill="#374151" text-anchor="middle">Typing a value or resizing</text><text x="627" y="264" font-size="12" fill="#374151" text-anchor="middle">by hand switches to Fixed</text>
  <g font-size="12" fill="#374151"><text x="20" y="312">Min and max width or height can be added next to any of the three.</text><text x="20" y="332">A Fill child inside a Hug parent turns the parent's axis into Fixed.</text></g>
  <text x="380" y="352" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked against the Figma Learn auto layout article on 2026-10-30.</text>
</svg>
