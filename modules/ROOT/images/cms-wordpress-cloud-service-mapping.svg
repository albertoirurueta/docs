<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">WordPress cloud service mapping: AWS, Google Cloud and Azure</title>
<desc id="d">A table with one row per role of the tiered WordPress deployment and one column each for Amazon Web Services, Google Cloud and Microsoft Azure. Kubernetes: EKS, GKE, AKS. Database: RDS or Aurora, Cloud SQL for MySQL, Azure Database for MySQL Flexible Server. Object cache: ElastiCache for Valkey, Memorystore for Valkey, Azure Managed Redis. Media: S3 with CloudFront, Cloud Storage with Cloud CDN, Blob Storage with Front Door. Shared files: EFS, Filestore, Azure Files over NFS. Secrets: Secrets Manager, Secret Manager, Key Vault. Images: ECR, Artifact Registry, Azure Container Registry. HTTP entry: ALB with WAF, Cloud Load Balancing with Cloud Armor, Application Gateway for Containers. DNS and certificates: Route 53 with ACM, Cloud DNS with Certificate Manager, Azure DNS. Pod identity: EKS Pod Identity, Workload Identity Federation for GKE, Microsoft Entra Workload ID.</desc>
<rect width="760" height="526" rx="12" fill="#2b3a4a"/>
<text x="380.0" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Lumen Press on three clouds: the same tiers, different services</text>
<rect x="20" y="52" width="130" height="26" rx="6" fill="#3d5266"/>
<text x="85.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">Role</text>
<rect x="160" y="52" width="190" height="26" rx="6" fill="#f4b860"/>
<text x="255.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">AWS</text>
<rect x="360" y="52" width="190" height="26" rx="6" fill="#9fd3c7"/>
<text x="455.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">Google Cloud</text>
<rect x="560" y="52" width="180" height="26" rx="6" fill="#c9b3e6"/>
<text x="650.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">Azure</text>
<rect x="20" y="86" width="720" height="34" rx="6" fill="#33485c"/>
<text x="28" y="107" font-size="12" font-weight="bold" fill="#f4b860">Kubernetes</text>
<text x="168" y="107" font-size="12" font-weight="normal" fill="#f2f5f8">Amazon EKS (Auto Mode)</text>
<text x="368" y="107" font-size="12" font-weight="normal" fill="#f2f5f8">GKE (Autopilot)</text>
<text x="568" y="107" font-size="12" font-weight="normal" fill="#f2f5f8">AKS (Standard)</text>
<rect x="20" y="124" width="720" height="34" rx="6" fill="#3d5266"/>
<text x="28" y="145" font-size="12" font-weight="bold" fill="#f4b860">MariaDB / MySQL</text>
<text x="168" y="145" font-size="12" font-weight="normal" fill="#f2f5f8">RDS (MariaDB 11.8, MySQL 8.4)</text>
<text x="368" y="145" font-size="12" font-weight="normal" fill="#f2f5f8">Cloud SQL for MySQL 8.4</text>
<text x="568" y="145" font-size="12" font-weight="normal" fill="#f2f5f8">Azure DB for MySQL Flexible</text>
<rect x="20" y="162" width="720" height="34" rx="6" fill="#33485c"/>
<text x="28" y="183" font-size="12" font-weight="bold" fill="#f4b860">Object cache</text>
<text x="168" y="183" font-size="12" font-weight="normal" fill="#f2f5f8">ElastiCache for Valkey</text>
<text x="368" y="183" font-size="12" font-weight="normal" fill="#f2f5f8">Memorystore for Valkey</text>
<text x="568" y="183" font-size="12" font-weight="normal" fill="#f2f5f8">Azure Managed Redis</text>
<rect x="20" y="200" width="720" height="34" rx="6" fill="#3d5266"/>
<text x="28" y="221" font-size="12" font-weight="bold" fill="#f4b860">Media objects</text>
<text x="168" y="221" font-size="12" font-weight="normal" fill="#f2f5f8">S3 + CloudFront</text>
<text x="368" y="221" font-size="12" font-weight="normal" fill="#f2f5f8">Cloud Storage + Cloud CDN</text>
<text x="568" y="221" font-size="12" font-weight="normal" fill="#f2f5f8">Blob Storage + Front Door</text>
<rect x="20" y="238" width="720" height="34" rx="6" fill="#33485c"/>
<text x="28" y="259" font-size="12" font-weight="bold" fill="#f4b860">Shared files</text>
<text x="168" y="259" font-size="12" font-weight="normal" fill="#f2f5f8">EFS</text>
<text x="368" y="259" font-size="12" font-weight="normal" fill="#f2f5f8">Filestore</text>
<text x="568" y="259" font-size="12" font-weight="normal" fill="#f2f5f8">Azure Files (NFS)</text>
<rect x="20" y="276" width="720" height="34" rx="6" fill="#3d5266"/>
<text x="28" y="297" font-size="12" font-weight="bold" fill="#f4b860">Secrets</text>
<text x="168" y="297" font-size="12" font-weight="normal" fill="#f2f5f8">Secrets Manager</text>
<text x="368" y="297" font-size="12" font-weight="normal" fill="#f2f5f8">Secret Manager</text>
<text x="568" y="297" font-size="12" font-weight="normal" fill="#f2f5f8">Key Vault</text>
<rect x="20" y="314" width="720" height="34" rx="6" fill="#33485c"/>
<text x="28" y="335" font-size="12" font-weight="bold" fill="#f4b860">Images</text>
<text x="168" y="335" font-size="12" font-weight="normal" fill="#f2f5f8">ECR</text>
<text x="368" y="335" font-size="12" font-weight="normal" fill="#f2f5f8">Artifact Registry</text>
<text x="568" y="335" font-size="12" font-weight="normal" fill="#f2f5f8">Container Registry</text>
<rect x="20" y="352" width="720" height="34" rx="6" fill="#3d5266"/>
<text x="28" y="373" font-size="12" font-weight="bold" fill="#f4b860">HTTP entry</text>
<text x="168" y="373" font-size="12" font-weight="normal" fill="#f2f5f8">ALB + WAF</text>
<text x="368" y="373" font-size="12" font-weight="normal" fill="#f2f5f8">Cloud Load Balancing + Armor</text>
<text x="568" y="373" font-size="12" font-weight="normal" fill="#f2f5f8">App Gateway for Containers</text>
<rect x="20" y="390" width="720" height="34" rx="6" fill="#33485c"/>
<text x="28" y="411" font-size="12" font-weight="bold" fill="#f4b860">DNS, TLS</text>
<text x="168" y="411" font-size="12" font-weight="normal" fill="#f2f5f8">Route 53 + ACM</text>
<text x="368" y="411" font-size="12" font-weight="normal" fill="#f2f5f8">Cloud DNS + Cert. Manager</text>
<text x="568" y="411" font-size="12" font-weight="normal" fill="#f2f5f8">Azure DNS + managed certs</text>
<rect x="20" y="428" width="720" height="34" rx="6" fill="#3d5266"/>
<text x="28" y="449" font-size="12" font-weight="bold" fill="#f4b860">Pod identity</text>
<text x="168" y="449" font-size="12" font-weight="normal" fill="#f2f5f8">EKS Pod Identity</text>
<text x="368" y="449" font-size="12" font-weight="normal" fill="#f2f5f8">Workload Identity Fed.</text>
<text x="568" y="449" font-size="12" font-weight="normal" fill="#f2f5f8">Entra Workload ID</text>
<text x="380.0" y="488" text-anchor="middle" font-size="12" fill="#f2f5f8">The Helm chart, the image and WP-CLI stay the same; the database, cache, media and secret wiring change.</text>
<text x="380.0" y="508" text-anchor="middle" font-size="12" fill="#9fd3c7">Azure Database for MariaDB is retired; Cloud SQL has no MariaDB engine.</text>
</svg>
