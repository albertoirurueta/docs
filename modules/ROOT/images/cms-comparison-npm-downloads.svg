<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" role="img" aria-labelledby="npm-downloads-t npm-downloads-d">
<title id="npm-downloads-t">npm downloads per year</title>
<desc id="npm-downloads-d">Yearly npm downloads of @strapi/strapi, payload, sanity, contentful and ghost, 2020 to 2026 year to date. Counts include CI and mirror traffic and compare only npm packages with each other: PHP, Python and .NET CMSs ship through other registries. Colours are assigned by position in this figure.</desc>
