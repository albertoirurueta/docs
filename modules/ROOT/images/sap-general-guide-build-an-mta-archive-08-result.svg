<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 612" width="1080" height="612" role="img" aria-labelledby="sap-general-guide-build-an-mta-archive-08-result-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-build-an-mta-archive-08-result-title">Terminal: unzip -p gen/claims-mta.mtar META-INF/mtad.yaml piped to head -n 25 prints the start of the deployment descriptor inside the archive, in which the modules claims-mta-srv and claims-mta-db-deployer have the resolved types javascript.nodejs and com.sap.xs.hdi and a path that names the packed module; callout 19 marks the module types</title>
<g><rect x="0" y="0" width="1080" height="612" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="580" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ unzip -p gen/claims-mta.mtar META-INF/mtad.yaml | head -n 25</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">_schema-version: 3.3.0</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ID: claims-mta</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">description: A simple CAP project.</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">version: 1.0.0</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">modules:</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">- name: claims-mta-srv</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  type: javascript.nodejs</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  path: claims-mta-srv</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  requires:</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  - name: claims-mta-auth</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  - name: claims-mta-db</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  provides:</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  - name: srv-api</text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    properties:</text>
<text x="16" y="377" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      srv-url: ${default-url}</text>
<text x="16" y="398" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  parameters:</text>
<text x="16" y="419" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    buildpack: nodejs_buildpack</text>
<text x="16" y="440" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    instances: 1</text>
<text x="16" y="461" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">- name: claims-mta-db-deployer</text>
<text x="16" y="482" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  type: com.sap.xs.hdi</text>
<text x="16" y="503" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  path: claims-mta-db-deployer</text>
<text x="16" y="524" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  requires:</text>
<text x="16" y="545" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  - name: claims-mta-db</text>
<text x="16" y="566" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  parameters:</text>
<text x="16" y="587" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    buildpack: nodejs_buildpack</text>
