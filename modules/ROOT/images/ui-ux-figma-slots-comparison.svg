<svg viewBox="0 0 720 330" width="720" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs><rect width="720" height="330" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Slots, instance swaps and variants compared</text>
<g font-size="13">
<rect x="20" y="50" width="220" height="260" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="130" y="76" font-weight="bold" fill="#3730A3" text-anchor="middle">Slot</text>
<rect x="40" y="92" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="52" y="104" width="70" height="12" rx="3" fill="#E5E7EB"/><rect x="52" y="124" width="150" height="12" rx="3" fill="#E5E7EB"/><rect x="52" y="144" width="110" height="12" rx="3" fill="#E5E7EB"/>
<text x="130" y="206" font-size="12" fill="#374151" text-anchor="middle">Free-form content in a</text><text x="130" y="222" font-size="12" fill="#374151" text-anchor="middle">consistent frame. Any layers,</text><text x="130" y="238" font-size="12" fill="#374151" text-anchor="middle">optional min/max guidance.</text>
<text x="130" y="272" font-size="12" fill="#3730A3" text-anchor="middle" font-weight="bold">Example: card body</text>
<rect x="250" y="50" width="220" height="260" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="76" font-weight="bold" fill="#92400E" text-anchor="middle">Instance swap</text>
<rect x="330" y="100" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><path d="M345,130 h30 M360,115 v30" stroke="#B45309" stroke-width="2"/>
<text x="360" y="206" font-size="12" fill="#374151" text-anchor="middle">Replaces one nested instance</text><text x="360" y="222" font-size="12" fill="#374151" text-anchor="middle">with another component.</text><text x="360" y="238" font-size="12" fill="#374151" text-anchor="middle">Tight guardrails.</text>
<text x="360" y="272" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">Example: tab icon</text>
<rect x="480" y="50" width="220" height="260" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="590" y="76" font-weight="bold" fill="#047857" text-anchor="middle">Variant</text>
<rect x="510" y="100" width="50" height="40" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><rect x="570" y="100" width="50" height="40" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><rect x="630" y="100" width="50" height="40" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="590" y="206" font-size="12" fill="#374151" text-anchor="middle">Predefined states, types or</text><text x="590" y="222" font-size="12" fill="#374151" text-anchor="middle">sizes of one component.</text><text x="590" y="238" font-size="12" fill="#374151" text-anchor="middle">Pick one of a fixed set.</text>
<text x="590" y="272" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold">Example: hover, disabled</text>
</g>
<text x="360" y="326" font-size="12" fill="#4B5563" text-anchor="middle">Freedom increases from variant to instance swap to slot.</text>
</svg>
