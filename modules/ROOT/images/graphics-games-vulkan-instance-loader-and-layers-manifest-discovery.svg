<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ila-disc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How the loader finds drivers and layers</text>
<rect x="30" y="50" width="330" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="98.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Driver manifests (ICD)</text>
<text x="195.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">Windows: registry keys under SOFTWARE\Khronos\Vulkan</text>
<text x="195.0" y="128.5" text-anchor="middle" font-size="11" fill="#3730A3">Linux: XDG config and data dirs + /vulkan/icd.d</text>
<text x="195.0" y="143.5" text-anchor="middle" font-size="11" fill="#3730A3">macOS: app bundle Contents/Resources first</text>
<text x="195.0" y="158.5" text-anchor="middle" font-size="11" fill="#3730A3">Android: loader built into the OS</text>
<rect x="400" y="50" width="330" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="98.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Layer manifests (JSON)</text>
<text x="565.0" y="113.5" text-anchor="middle" font-size="11" fill="#92400E">Windows: same registry keys, both kinds</text>
<text x="565.0" y="128.5" text-anchor="middle" font-size="11" fill="#92400E">Linux: /vulkan/explicit_layer.d and implicit_layer.d</text>
<text x="565.0" y="143.5" text-anchor="middle" font-size="11" fill="#92400E">macOS: bundle first, then the Linux order</text>
<text x="565.0" y="158.5" text-anchor="middle" font-size="11" fill="#92400E">Android: debug layers via /data/local/debug/vulkan</text>
<rect x="30" y="225" width="330" height="150" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="195.0" y="273.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Driver environment overrides</text>
<text x="195.0" y="288.5" text-anchor="middle" font-size="11" fill="#374151">VK_DRIVER_FILES replaces the search</text>
<text x="195.0" y="303.5" text-anchor="middle" font-size="11" fill="#374151">VK_ADD_DRIVER_FILES adds to it</text>
<text x="195.0" y="318.5" text-anchor="middle" font-size="11" fill="#374151">VK_LOADER_DRIVERS_SELECT / _DISABLE filter by name</text>
<text x="195.0" y="333.5" text-anchor="middle" font-size="11" fill="#374151">ignored when running with elevated privileges</text>
<rect x="400" y="225" width="330" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="273.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Layer environment overrides</text>
<text x="565.0" y="288.5" text-anchor="middle" font-size="11" fill="#065F46">VK_LAYER_PATH replaces explicit layer paths</text>
<text x="565.0" y="303.5" text-anchor="middle" font-size="11" fill="#065F46">VK_ADD_LAYER_PATH adds paths searched first</text>
<text x="565.0" y="318.5" text-anchor="middle" font-size="11" fill="#065F46">VK_LOADER_LAYERS_ENABLE / _DISABLE: globs of names</text>
<text x="565.0" y="333.5" text-anchor="middle" font-size="11" fill="#065F46">VK_LOADER_DEBUG=error,warn,info,all</text>
</svg>
