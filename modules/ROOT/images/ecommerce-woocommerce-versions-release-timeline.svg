<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
<title id="t">WooCommerce releases from 9.2 to 11.2 and the plan to 11.6, with the WordPress releases they track</title>
<desc id="d">A horizontal time axis from August 2024 to March 2027. Each WooCommerce minor release from 9.2.0 to 11.2.0 is a dot on the date it shipped, about every five weeks. A bracket marks the 21-release security backport window that starts at 9.2. Projected dots show 11.3 in the week of 9 November 2026 and 11.6 in February 2027, when PHP 8.1 becomes the minimum. A second lane shows WordPress 6.9, 7.0 and 7.1 with the L-1 window. A vertical dashed line marks the check date 2026-10-27.</desc>
