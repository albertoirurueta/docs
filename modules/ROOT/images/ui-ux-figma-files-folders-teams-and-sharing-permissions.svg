<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How access flows down, and what can only widen</text>
  <rect x="40" y="56" width="200" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="140" y="82" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Top-level folder</text>
  <text x="140" y="102" font-size="12" fill="#374151" text-anchor="middle">follows team access</text>
  <rect x="40" y="160" width="200" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="140" y="186" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Nested folder</text>
  <text x="140" y="206" font-size="12" fill="#374151" text-anchor="middle">Inherited (default)</text>
  <rect x="40" y="264" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="140" y="290" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">File</text>
  <text x="140" y="310" font-size="12" fill="#374151" text-anchor="middle">always gets folder roles</text>
  <path d="M140 118 L140 158" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M140 222 L140 262" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="300" y="160" width="200" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="186" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Limited</text>
  <text x="400" y="206" font-size="12" fill="#374151" text-anchor="middle">only people added</text>
  <path d="M242 190 L298 190" stroke="#4B5563" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="270" y="180" font-size="11" fill="#374151" text-anchor="middle">switch</text>
  <rect x="300" y="264" width="200" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="400" y="290" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Direct file access</text>
  <text x="400" y="310" font-size="12" fill="#374151" text-anchor="middle">can add, never remove</text>
  <path d="M242 294 L298 294" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="540" y="56" width="190" height="268" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="635" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Roles</text>
  <rect x="556" y="96" width="158" height="52" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="635" y="118" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Can view</text>
  <text x="635" y="136" font-size="11" fill="#374151" text-anchor="middle">inspect, comment</text>
  <rect x="556" y="160" width="158" height="52" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="635" y="182" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Can edit</text>
  <text x="635" y="200" font-size="11" fill="#374151" text-anchor="middle">change files, folders</text>
  <rect x="556" y="224" width="158" height="84" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <text x="635" y="246" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Plus a seat</text>
  <text x="635" y="266" font-size="11" fill="#374151" text-anchor="middle">editing needs can edit</text>
  <text x="635" y="282" font-size="11" fill="#374151" text-anchor="middle">and a seat that covers</text>
  <text x="635" y="298" font-size="11" fill="#374151" text-anchor="middle">the file's product</text>
  <circle cx="40" cy="56" r="11" fill="#4F46E5"/><text x="40" y="60" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="40" cy="160" r="11" fill="#4F46E5"/><text x="40" y="164" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="300" cy="160" r="11" fill="#B45309"/><text x="300" y="164" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="300" cy="264" r="11" fill="#047857"/><text x="300" y="268" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
