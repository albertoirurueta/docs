<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-nav2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: bake a NavMesh and send an agent across the Bookshelf floor</text>
<rect x="20" y="50" width="180" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="36" y="70.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="110" y="265" text-anchor="middle" font-size="11" fill="#374151">Select the Floor and add the</text>
<text x="110" y="280" text-anchor="middle" font-size="11" fill="#374151">NavMesh Surface component</text>
<rect x="200" y="50" width="180" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="216" cy="66" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="216" y="70.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="290" y="265" text-anchor="middle" font-size="11" fill="#374151">Choose Agent Type, Collect</text>
<text x="290" y="280" text-anchor="middle" font-size="11" fill="#374151">Objects and Use Geometry</text>
<rect x="380" y="50" width="180" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="396" cy="66" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="396" y="70.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="470" y="265" text-anchor="middle" font-size="11" fill="#374151">Click Bake: a blue overlay</text>
<text x="470" y="280" text-anchor="middle" font-size="11" fill="#374151">covers the walkable floor</text>
<rect x="560" y="50" width="180" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="576" cy="66" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="576" y="70.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="650" y="265" text-anchor="middle" font-size="11" fill="#374151">Add NavMesh Agent and a</text>
<text x="650" y="280" text-anchor="middle" font-size="11" fill="#374151">script, then press Play</text>
<rect x="40" y="85" width="140" height="140" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="110" y="102" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Inspector</text>
<rect x="48" y="112" width="124" height="22" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="110.0" y="126.85" text-anchor="middle" font-size="11" fill="#374151">Transform</text>
<rect x="48" y="140" width="124" height="22" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="110.0" y="154.85" text-anchor="middle" font-size="11" fill="#374151">Mesh Renderer</text>
<rect x="48" y="168" width="124" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="110.0" y="184.85" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">NavMesh Surface</text>
<text x="110.0" y="198.85" text-anchor="middle" font-size="11" fill="#3730A3">(Add Component)</text>
<rect x="220" y="85" width="140" height="140" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="228" y="108" text-anchor="start" font-size="10.5" fill="#3730A3">Agent Type: Humanoid</text>
<text x="228" y="128" text-anchor="start" font-size="10.5" fill="#3730A3">Default Area: Walkable</text>
<text x="228" y="148" text-anchor="start" font-size="10.5" fill="#3730A3">Generate Links: on</text>
<text x="228" y="168" text-anchor="start" font-size="10.5" fill="#3730A3">Use Geometry: Render</text>
<text x="228" y="188" text-anchor="start" font-size="10.5" fill="#3730A3">Collect Objects: All</text>
<text x="228" y="208" text-anchor="start" font-size="10.5" fill="#92400E" font-weight="bold">[ Bake ]   [ Clear ]</text>
<rect x="400" y="85" width="140" height="140" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<polygon points="412,200 528,200 522,120 418,120" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>
<polygon points="450,170 490,170 490,140 450,140" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="470" y="159" text-anchor="middle" font-size="10" fill="#374151">shelf</text>
<text x="470" y="214" text-anchor="middle" font-size="10" fill="#1D4ED8">walkable overlay</text>
<rect x="580" y="85" width="140" height="140" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<polygon points="592,200 708,200 702,120 598,120" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>
<circle cx="615" cy="185" r="8" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<circle cx="685" cy="140" r="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<polyline points="615,185 640,150 685,140" fill="none" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-nav2)"/>
<text x="660" y="214" text-anchor="middle" font-size="10" fill="#92400E">agent.SetDestination</text>
<line x1="182" y1="145" x2="198" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-nav2)"/>
<line x1="362" y1="145" x2="378" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-nav2)"/>
<line x1="542" y1="145" x2="558" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-nav2)"/>
<text x="380" y="315" text-anchor="middle" font-size="11" fill="#4B5563">The blue overlay shows only while the Navigation window is open.</text>
</svg>
