<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>Moving the decision threshold</title>
<desc>Score distributions of the negative and positive class overlap. A threshold at 0.5 predicts few positives; moving it left to 0.15 catches more positives (higher recall) at the cost of more false alarms (lower precision).</desc>
