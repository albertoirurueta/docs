  <rect x="610" y="72" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="154" font-size="14" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">rolling(3, center)</text>
  <text x="24" y="172" font-size="12" fill="#475569">labels at the centre</text>
  <rect x="190" y="136" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
