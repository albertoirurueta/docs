<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Which observations feed the value at one position</title>
  <desc id="d1">Four strips of eight observations show the value computed at position t5. A trailing rolling window of three uses t3 to t5, a centered window of three uses t4 to t6, an expanding window uses t0 to t5, and an exponentially weighted window uses t0 to t5 with weights that halve for each step back.</desc>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Window types at the same position (t5)</text>
  <text x="217.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t0</text>
  <text x="277.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t1</text>
  <text x="337.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t2</text>
  <text x="397.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t3</text>
  <text x="457.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t4</text>
  <text x="517.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t5</text>
  <text x="577.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t6</text>
  <text x="637.0" y="62" font-size="12" text-anchor="middle" fill="#475569" font-family="Menlo, Consolas, monospace">t7</text>
  <text x="24" y="90" font-size="14" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">rolling(3)</text>
  <text x="24" y="108" font-size="12" fill="#475569">trailing window, default</text>
  <rect x="190" y="72" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="250" y="72" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="310" y="72" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
