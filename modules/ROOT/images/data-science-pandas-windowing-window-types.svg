  <rect x="430" y="200" width="54" height="40" rx="6" fill="#CCFBF1" fill-opacity="1" stroke="#0F766E" stroke-width="2"/>
  <rect x="490" y="200" width="54" height="40" rx="6" fill="#FEF3C7" fill-opacity="1" stroke="#B45309" stroke-width="3"/>
