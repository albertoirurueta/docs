  <rect x="610" y="200" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="282" font-size="14" font-weight="bold" fill="#0F172A" font-family="Menlo, Consolas, monospace">ewm(alpha=0.5)</text>
  <text x="24" y="300" font-size="12" fill="#475569">weights 1, 1/2, 1/4, ...</text>
  <rect x="190" y="264" width="54" height="40" rx="6" fill="#EDE9FE" fill-opacity="0.18" stroke="#6D28D9" stroke-width="2"/>
  <text x="217.0" y="289" font-size="12" text-anchor="middle" fill="#0F172A">1/32</text>
