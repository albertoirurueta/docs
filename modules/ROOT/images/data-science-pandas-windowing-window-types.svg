  <rect x="610" y="264" width="54" height="40" rx="6" fill="#F1F5F9" fill-opacity="1" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="330" font-size="12" fill="#475569">Amber is the position being computed; grey cells are not used. Weights are shown before normalisation (adjust=True).</text>
</svg>
