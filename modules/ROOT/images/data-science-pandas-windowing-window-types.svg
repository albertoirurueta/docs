  <text x="397.0" y="289" font-size="12" text-anchor="middle" fill="#0F172A">1/4</text>
  <rect x="430" y="264" width="54" height="40" rx="6" fill="#EDE9FE" fill-opacity="0.5" stroke="#6D28D9" stroke-width="2"/>
  <text x="457.0" y="289" font-size="12" text-anchor="middle" fill="#0F172A">1/2</text>
