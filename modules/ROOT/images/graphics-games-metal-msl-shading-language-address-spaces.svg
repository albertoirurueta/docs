<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-address-spaces" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="500" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">MSL address spaces: where a variable lives and who can see it</text>
<rect x="20" y="45" width="720" height="330" rx="12" fill="#E5E7EB" stroke="#4B5563" stroke-width="2"/>
<text x="380.0" y="213.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="40" y="66" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">GPU</text>
<rect x="40" y="78" width="330" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="205.0" y="105.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">device</text>
<text x="205.0" y="119.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">read and write; buffers and textures</text>
<text x="205.0" y="133.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">visible to every thread of every threadgroup</text>
<text x="205.0" y="147.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">pointers in function arguments: device float4 *</text>
<rect x="390" y="78" width="330" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="555.0" y="105.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">constant</text>
<text x="555.0" y="119.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">read-only; uniforms and lookup tables</text>
<text x="555.0" y="133.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">program-scope constants must be constant</text>
<text x="555.0" y="147.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">pointers in arguments: constant Uniforms &amp;</text>
<rect x="40" y="184" width="690" height="170" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="385.0" y="272.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="56" y="204" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">One threadgroup</text>
<rect x="60" y="214" width="310" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="215.0" y="228.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">threadgroup</text>
<text x="215.0" y="242.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">shared by the threads of one threadgroup</text>
<text x="215.0" y="256.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">kernel, mesh, object: threadgroup float *</text>
<rect x="390" y="214" width="320" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="550.0" y="228.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">threadgroup_imageblock</text>
<text x="550.0" y="242.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">tile memory of a render pass</text>
<text x="550.0" y="256.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">used by tile and fragment kernels</text>
<rect x="60" y="278" width="150" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="299.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">thread 0</text>
<text x="135.0" y="312.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">private to the thread</text>
<text x="135.0" y="325.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">locals default to thread</text>
<rect x="225" y="278" width="150" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="300.0" y="299.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">thread 1</text>
<text x="300.0" y="312.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">private to the thread</text>
<text x="300.0" y="325.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">locals default to thread</text>
<rect x="390" y="278" width="150" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="465.0" y="299.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">thread 2</text>
<text x="465.0" y="312.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">private to the thread</text>
<text x="465.0" y="325.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">locals default to thread</text>
<rect x="555" y="278" width="150" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="299.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">thread 3</text>
<text x="630.0" y="312.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">private to the thread</text>
<text x="630.0" y="325.5" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">locals default to thread</text>
<rect x="20" y="390" width="350" height="92" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="418.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Specialised spaces</text>
<text x="195.0" y="432.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">ray_data: payload of ray tracing functions</text>
<text x="195.0" y="446.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">object_data: object to mesh function payload</text>
<text x="195.0" y="460.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Used only with those function types.</text>
<rect x="390" y="390" width="350" height="92" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="418.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Rules</text>
<text x="565.0" y="432.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Every pointer or reference argument needs an</text>
<text x="565.0" y="446.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">address space; a missing one is a compile error.</text>
<text x="565.0" y="460.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Graphics functions: device or constant only.</text>
</svg>
