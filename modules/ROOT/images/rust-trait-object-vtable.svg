<svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>
  <text x="460" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A trait object is a fat pointer: (data pointer, vtable pointer)</text>
  <text x="460" y="46" font-size="12" fill="#666666" text-anchor="middle">let item: &amp;dyn Describe = &amp;book;  -- one vtable per (concrete type, trait) pair, stored in the binary</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker>
  </defs>
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#555555">&amp;dyn Describe (16 bytes)</text>
  <rect x="40" y="104" width="130" height="34" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="105" y="126" font-size="13" text-anchor="middle" fill="#222222">data ptr</text>
  <rect x="40" y="138" width="130" height="34" fill="#fdf0e2" stroke="#a35a00"/>
  <text x="105" y="160" font-size="13" text-anchor="middle" fill="#222222">vtable ptr</text>

  <text x="330" y="92" font-size="12" font-weight="bold" fill="#555555">the value (struct Book)</text>
  <rect x="330" y="104" width="200" height="34" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="340" y="126" font-size="13" fill="#222222">title: String</text>
  <rect x="330" y="138" width="200" height="34" fill="#e9f5e9" stroke="#2e7d32"/>
  <text x="340" y="160" font-size="13" fill="#222222">year: u16 (+ padding)</text>

  <text x="330" y="222" font-size="12" font-weight="bold" fill="#555555">vtable for (Book, Describe), read-only data</text>
  <g font-size="13" fill="#222222">
    <rect x="330" y="234" width="260" height="28" fill="#fff6ea" stroke="#a35a00"/><text x="340" y="253">drop_in_place::&lt;Book&gt;</text>
    <rect x="330" y="262" width="260" height="28" fill="#fff6ea" stroke="#a35a00"/><text x="340" y="281">size = 32</text>
    <rect x="330" y="290" width="260" height="28" fill="#fff6ea" stroke="#a35a00"/><text x="340" y="309">align = 8</text>
    <rect x="330" y="318" width="260" height="28" fill="#fff6ea" stroke="#a35a00"/><text x="340" y="337">&lt;Book as Describe&gt;::title</text>
    <rect x="330" y="346" width="260" height="28" fill="#fff6ea" stroke="#a35a00"/><text x="340" y="365">&lt;Book as Describe&gt;::summary</text>
  </g>
  <path d="M170,121 L326,121" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M170,155 C250,155 250,248 326,248" fill="none" stroke="#a35a00" stroke-width="1.6" marker-end="url(#b)"/>
  <g font-size="12" fill="#333333">
    <text x="620" y="120">item.summary() compiles to:</text>
    <text x="620" y="142" font-family="Courier New, monospace">(vtable.summary)(data)</text>
    <text x="620" y="176">an indirect call: no inlining across it,</text>
    <text x="620" y="194">but one compiled copy of the caller</text>
    <text x="620" y="240">Box&lt;dyn T&gt;, Rc&lt;dyn T&gt;, Arc&lt;dyn T&gt;</text>
    <text x="620" y="258">use the same two-word layout;</text>
    <text x="620" y="276">dropping calls drop_in_place, then</text>
    <text x="620" y="294">frees size/align bytes</text>
  </g>
</svg>
