<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One SwiftData store, shared through the App Group</text>
  <text x="380" y="47" font-size="13" fill="#666666" text-anchor="middle">Every process calls ModelContainer.fieldNotes() with the same migration plan; only the app syncs</text>

  <defs>
    <marker id="sdag-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="sdag-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
    <marker id="sdag-arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b3a8c"/>
    </marker>
  </defs>

  <!-- iCloud -->
  <rect x="250" y="66" width="260" height="62" rx="28" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.6"/>
  <text x="380" y="92" font-size="14" font-weight="bold" fill="#5b3a8c" text-anchor="middle">CloudKit private database</text>
  <text x="380" y="112" font-size="13" fill="#333333" text-anchor="middle">iCloud.com.example.fieldnotes</text>

  <!-- iPhone device frame -->
  <rect x="16" y="150" width="560" height="334" rx="12" fill="#fafafa" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="30" y="172" font-size="13" font-weight="bold" fill="#555555">iPhone (the same on iPad, Mac and Vision Pro)</text>

  <!-- Main app -->
  <rect x="32" y="186" width="220" height="118" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="142" y="208" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">FieldNotes app</text>
  <text x="142" y="230" font-size="13" fill="#222222" text-anchor="middle">read-write</text>
  <text x="142" y="250" font-size="13" fill="#222222" text-anchor="middle">FieldNotesMigrationPlan</text>
  <text x="142" y="270" font-size="13" fill="#222222" text-anchor="middle">cloudKitDatabase: .private</text>
  <text x="142" y="290" font-size="13" fill="#222222" text-anchor="middle">NoteStore + model actor</text>

  <!-- Extensions -->
  <rect x="336" y="186" width="224" height="118" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="448" y="208" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Extensions</text>
  <text x="448" y="230" font-size="13" fill="#222222" text-anchor="middle">widgets, App Intents, share</text>
  <text x="448" y="250" font-size="13" fill="#222222" text-anchor="middle">same FieldNotesMigrationPlan</text>
  <text x="448" y="270" font-size="13" fill="#222222" text-anchor="middle">cloudKitDatabase: .none</text>
  <text x="448" y="290" font-size="13" fill="#222222" text-anchor="middle">launched on demand</text>

  <!-- App Group container -->
  <rect x="32" y="344" width="528" height="126" rx="10" fill="#fff8e8" stroke="#a0781e" stroke-width="1.6"/>
  <text x="296" y="366" font-size="14" font-weight="bold" fill="#7a5a12" text-anchor="middle">App Group container: group.com.example.fieldnotes</text>
  <rect x="52" y="380" width="232" height="74" rx="6" fill="#ffffff" stroke="#a0781e"/>
  <text x="168" y="402" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">"FieldNotes" store (SQLite)</text>
  <text x="168" y="422" font-size="13" fill="#333333" text-anchor="middle">NoteRecord, NotebookRecord,</text>
  <text x="168" y="440" font-size="13" fill="#333333" text-anchor="middle">PhotoRecord + history</text>
  <rect x="308" y="380" width="232" height="74" rx="6" fill="#ffffff" stroke="#a0781e"/>
  <text x="424" y="402" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">External storage</text>
  <text x="424" y="422" font-size="13" fill="#333333" text-anchor="middle">PhotoRecord.data files,</text>
  <text x="424" y="440" font-size="13" fill="#333333" text-anchor="middle">kept outside the rows</text>

  <!-- App/extension to store -->
  <line x1="142" y1="304" x2="142" y2="376" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#sdag-arrow)"/>
  <text x="150" y="330" font-size="13" fill="#1c4b73">opens, migrates</text>
  <line x1="448" y1="304" x2="448" y2="340" stroke="#2d6a34" stroke-width="1.6" marker-end="url(#sdag-arrow-green)"/>
  <text x="456" y="326" font-size="13" fill="#2d6a34">opens, migrates</text>

  <!-- App to CloudKit -->
  <line x1="200" y1="186" x2="286" y2="128" stroke="#5b3a8c" stroke-width="1.6" marker-end="url(#sdag-arrow-purple)"/>
  <line x1="276" y1="124" x2="190" y2="184" stroke="#5b3a8c" stroke-width="1.6" marker-end="url(#sdag-arrow-purple)"/>
  <text x="40" y="96" font-size="13" fill="#5b3a8c">export and import</text>
  <text x="40" y="114" font-size="13" fill="#5b3a8c">(silent push)</text>
  <!-- Extensions do not sync -->
  <line x1="448" y1="182" x2="448" y2="134" stroke="#a33333" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="456" y="162" font-size="16" font-weight="bold" fill="#a33333">&#215;</text>
  <text x="472" y="162" font-size="13" fill="#a33333">no sync</text>

  <!-- Apple Watch -->
  <rect x="596" y="186" width="148" height="284" rx="12" fill="#fafafa" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="606" y="208" font-size="13" font-weight="bold" fill="#555555">Apple Watch</text>
  <rect x="610" y="222" width="120" height="82" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="670" y="244" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Watch app</text>
  <text x="670" y="264" font-size="13" fill="#222222" text-anchor="middle">own store,</text>
  <text x="670" y="282" font-size="13" fill="#222222" text-anchor="middle">own App Group</text>
  <text x="670" y="336" font-size="13" fill="#333333" text-anchor="middle">An App Group</text>
  <text x="670" y="354" font-size="13" fill="#333333" text-anchor="middle">never spans</text>
  <text x="670" y="372" font-size="13" fill="#333333" text-anchor="middle">devices; the watch</text>
  <text x="670" y="390" font-size="13" fill="#333333" text-anchor="middle">gets the same notes</text>
  <text x="670" y="408" font-size="13" fill="#333333" text-anchor="middle">through CloudKit</text>
  <path d="M716,222 C716,140 620,100 514,100" fill="none" stroke="#5b3a8c" stroke-width="1.6" marker-end="url(#sdag-arrow-purple)"/>
</svg>
