<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtNgFlowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Where restore looks for a package, and what it writes</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">NuGet 7.9.0: Humanizer.Core 2.14.1 restored three times with empty, then partly filled, folders</text>
<rect x="20" y="80" width="520" height="78" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="36" y="104" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">1. Global-packages folder</text>
<text x="36" y="126" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">~/.nuget/packages/humanizer.core/2.14.1/</text>
<text x="36" y="146" font-size="11" fill="#555555" text-anchor="start" font-style="italic">found: use it, no source is contacted</text>
<line x1="280" y1="158" x2="280" y2="178" stroke="#444444" stroke-width="2" marker-end="url(#cbtNgFlowArrow)"/>
<text x="290" y="173" font-size="10" fill="#777777" text-anchor="start">not found</text>
<rect x="20" y="178" width="520" height="78" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="36" y="202" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">2. Local and file-share sources</text>
<text x="36" y="224" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">folders listed in nuget.config</text>
<text x="36" y="244" font-size="11" fill="#555555" text-anchor="start" font-style="italic">found: extract into global-packages</text>
<line x1="280" y1="256" x2="280" y2="276" stroke="#444444" stroke-width="2" marker-end="url(#cbtNgFlowArrow)"/>
<text x="290" y="271" font-size="10" fill="#777777" text-anchor="start">not found</text>
<rect x="20" y="276" width="520" height="78" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="36" y="300" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">3. HTTP cache (30 minutes)</text>
<text x="36" y="322" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">~/.local/share/NuGet/http-cache/</text>
<text x="36" y="342" font-size="11" fill="#555555" text-anchor="start" font-style="italic">fresh copy: "CACHE" in the log</text>
<line x1="280" y1="354" x2="280" y2="374" stroke="#444444" stroke-width="2" marker-end="url(#cbtNgFlowArrow)"/>
<text x="290" y="369" font-size="10" fill="#777777" text-anchor="start">not found</text>
<rect x="20" y="374" width="520" height="78" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="36" y="398" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">4. HTTP sources</text>
<text x="36" y="420" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">https://api.nuget.org/v3/index.json, ...</text>
<text x="36" y="440" font-size="11" fill="#555555" text-anchor="start" font-style="italic">download: "GET ... OK" in the log</text>
<rect x="580" y="80" width="400" height="170" rx="6" fill="#ffffff" stroke="#555555"/>
<text x="596" y="104" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Global-packages entry</text>
<text x="596" y="128" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">humanizer.core.2.14.1.nupkg</text>
<text x="596" y="148" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">humanizer.core.2.14.1.nupkg.sha512</text>
<text x="596" y="168" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">.nupkg.metadata (content hash, source)</text>
<text x="596" y="188" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">.signature.p7s</text>
<text x="596" y="208" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">humanizer.core.nuspec</text>
<text x="596" y="228" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">lib/net6.0/  lib/netstandard2.0/ ...</text>
<rect x="580" y="270" width="400" height="120" rx="6" fill="#ffffff" stroke="#555555"/>
<text x="596" y="294" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Project obj/ folder</text>
<text x="596" y="318" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">project.assets.json (selected assets)</text>
<text x="596" y="338" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">project.nuget.cache</text>
<text x="596" y="358" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.nuget.g.props / .g.targets</text>
<text x="596" y="378" font-size="10.5" fill="#333333" text-anchor="start" font-family="Courier New, monospace">*.nuget.dgspec.json</text>
<line x1="540" y1="165" x2="578" y2="165" stroke="#444444" stroke-width="2" marker-end="url(#cbtNgFlowArrow)"/>
<line x1="540" y1="400" x2="600" y2="392" stroke="#444444" stroke-width="2" marker-end="url(#cbtNgFlowArrow)"/>
<rect x="20" y="480" width="960" height="66" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
<text x="36" y="502" font-size="12" fill="#333333" text-anchor="start">Measured: first restore 1.61 s with GET requests; global-packages cleared 0.76 s with CACHE hits only;</text>
<text x="36" y="522" font-size="12" fill="#333333" text-anchor="start">both folders filled 0.36 s, with no package request at all (only the audit data came from the HTTP cache).</text>
</svg>
