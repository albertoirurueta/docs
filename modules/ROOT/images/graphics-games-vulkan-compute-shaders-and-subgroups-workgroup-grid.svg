<text x="570" y="238" text-anchor="middle" font-size="10" fill="#374151">(8 x 4 of the 64 invocations drawn)</text>
<text x="570" y="262" text-anchor="middle" font-size="11" fill="#374151">gl_LocalInvocationID = (5,2,0)</text>
<text x="570" y="280" text-anchor="middle" font-size="10" fill="#374151">gl_GlobalInvocationID = WorkGroupID * local_size + LocalInvocationID</text>
<text x="570" y="298" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">= (2*8+5, 1*8+2, 0) = (21, 10, 0)</text>
<text x="570" y="326" text-anchor="middle" font-size="11" fill="#374151">Invocations of one workgroup share shared memory</text>
<text x="570" y="342" text-anchor="middle" font-size="11" fill="#374151">and can use barrier(); different workgroups cannot.</text>
