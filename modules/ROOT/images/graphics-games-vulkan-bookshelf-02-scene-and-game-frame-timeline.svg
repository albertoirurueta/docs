<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-b02-ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">One game frame: fixed updates, render and the pick</text>
<line x1="40" y1="90" x2="720" y2="90" stroke="#4B5563" stroke-width="2"/>
<text x="30" y="70" text-anchor="start" font-size="12" fill="#4F46E5" font-weight="bold">CPU</text>
<rect x="60" y="100" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="125.0" y="126.0" text-anchor="middle" font-size="10" fill="#92400E">input + pick result</text>
<rect x="200" y="100" width="90" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="245.0" y="126.0" text-anchor="middle" font-size="10" fill="#3730A3">update 1/120</text>
<rect x="300" y="100" width="90" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="345.0" y="126.0" text-anchor="middle" font-size="10" fill="#3730A3">update 1/120</text>
<rect x="400" y="100" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="126.0" text-anchor="middle" font-size="10" fill="#3730A3">record + submit</text>
<rect x="540" y="100" width="80" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="580.0" y="126.0" text-anchor="middle" font-size="10" fill="#374151">present</text>
<text x="30" y="200" text-anchor="start" font-size="12" fill="#047857" font-weight="bold">GPU</text>
<line x1="40" y1="220" x2="720" y2="220" stroke="#4B5563" stroke-width="2"/>
<rect x="160" y="170" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="225.0" y="189.0" text-anchor="middle" font-size="10" fill="#92400E">pick (compute,</text>
<text x="225.0" y="203.0" text-anchor="middle" font-size="10" fill="#92400E">ray query)</text>
<rect x="300" y="170" width="150" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="375.0" y="196.5" text-anchor="middle" font-size="11" fill="#065F46">shadows + shelf</text>
<rect x="450" y="170" width="100" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="500.0" y="196.5" text-anchor="middle" font-size="11" fill="#065F46">HUD</text>
<line x1="465" y1="144" x2="375" y2="168" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-b02-ft)"/>
<line x1="225" y1="170" x2="120" y2="146" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-b02-ft)"/>
<text x="40" y="250" text-anchor="start" font-size="11" fill="#374151">The pick of frame N is read when its slot comes round</text>
<text x="40" y="266" text-anchor="start" font-size="11" fill="#374151">again, two frames later: latency instead of a stall</text>
<rect x="500" y="250" width="240" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="265.0" text-anchor="middle" font-size="10" fill="#374151">Accumulator drives the updates:</text>
<text x="620.0" y="279.0" text-anchor="middle" font-size="10" fill="#374151">time left over is carried</text>
<text x="620.0" y="293.0" text-anchor="middle" font-size="10" fill="#374151">to the next frame</text>
</svg>
