<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Choosing a download format by purpose</text>
<rect x="270" y="46" width="220" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="70" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">What will the file be used for?</text>
<path d="M380,85 L130,112" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="114" width="220" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="137" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Pictures on screen</text>
<text x="130" y="156" font-size="12" fill="#374151" text-anchor="middle">Photo, graphic or logo</text>
<path d="M130,171 L130,188" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="190" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130" y="214" font-size="12" fill="#374151" text-anchor="middle">JPG: photos, small file</text>
<rect x="20" y="236" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130" y="260" font-size="12" fill="#374151" text-anchor="middle">PNG: graphics, transparency</text>
<rect x="20" y="282" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130" y="306" font-size="12" fill="#374151" text-anchor="middle">WebP: websites, small files</text>
<rect x="20" y="328" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130" y="352" font-size="12" fill="#374151" text-anchor="middle">SVG: vector, any size</text>
<path d="M380,85 L380,112" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="270" y="114" width="220" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="137" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Documents and print</text>
<text x="380" y="156" font-size="12" fill="#374151" text-anchor="middle">Text, links, printing</text>
<path d="M380,171 L380,188" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="270" y="190" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380" y="214" font-size="12" fill="#374151" text-anchor="middle">PDF Standard: screen, 96 dpi</text>
<rect x="270" y="236" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380" y="260" font-size="12" fill="#374151" text-anchor="middle">PDF Print: 300 dpi, bleed</text>
<rect x="270" y="282" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380" y="306" font-size="12" fill="#374151" text-anchor="middle">PPTX: presentations only</text>
<rect x="270" y="328" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380" y="352" font-size="12" fill="#374151" text-anchor="middle">DOCX: Canva Docs only</text>
<path d="M380,85 L630,112" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="520" y="114" width="220" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630" y="137" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Motion and data</text>
<text x="630" y="156" font-size="12" fill="#374151" text-anchor="middle">Clips, loops, sheets</text>
<path d="M630,171 L630,188" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="520" y="190" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630" y="214" font-size="12" fill="#374151" text-anchor="middle">MP4: video with audio</text>
<rect x="520" y="236" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630" y="260" font-size="12" fill="#374151" text-anchor="middle">GIF: short looping clip</text>
<rect x="520" y="282" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630" y="306" font-size="12" fill="#374151" text-anchor="middle">CSV: raw Sheets data</text>
<rect x="520" y="328" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630" y="352" font-size="12" fill="#374151" text-anchor="middle">XLSX: Sheets, formulas</text>
<rect x="150" y="382" width="460" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="404" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">Bookshelf: post as PNG, flyer as PDF Print, promo as MP4</text>
  <text x="380" y="442" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
