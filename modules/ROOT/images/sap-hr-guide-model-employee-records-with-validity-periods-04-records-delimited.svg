<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-hr-guide-model-employee-records-with-validity-periods-04-records-delimited-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-model-employee-records-with-validity-periods-04-records-delimited-title">Terminal with two curl commands that post a new organizational assignment from 2026-07-01 and a new parking permit from 2025-06-01: each answers HTTP/1.1 201 Created and an sap-messages header that says the old record was delimited, to 2026-06-30 for the assignment (callout 7) and to 2025-05-31 for the permit (callout 8)</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i --json @http/new-assignment.json http://localhost:4004/odata/v4/people/OrganizationalAssignments | grep -</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">E &quot;^(HTTP|sap-messages)&quot;</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP/1.1 201 Created</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">sap-messages: [{&quot;code&quot;:&quot;&quot;,&quot;message&quot;:&quot;The record from 2024-03-01 was delimited to 2026-06-30&quot;,&quot;numericSeverity&quot;:2}]</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i --json @http/new-permit.json http://localhost:4004/odata/v4/people/ParkingPermits | grep -E &quot;^(HTTP|sap-m</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">essages)&quot;</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP/1.1 201 Created</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">sap-messages: [{&quot;code&quot;:&quot;&quot;,&quot;message&quot;:&quot;The record from 2025-01-01 was delimited to 2025-05-31&quot;,&quot;numericSeverity&quot;:2}]</text>
<rect x="5" y="109" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="109" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="114" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g>
<rect x="5" y="193" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="193" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="198" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">8</text></g></g>
</svg>
