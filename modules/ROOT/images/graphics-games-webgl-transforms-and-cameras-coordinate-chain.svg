<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-transforms-and-cameras-coordinate-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From model space to window pixels</text>
<rect x="22" y="70" width="100" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="72.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Model space</text>
<text x="72.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">book local</text>
<text x="72.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">origin = spine</text>
<text x="72.0" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">centre</text>
<line x1="124" y1="120" x2="142" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-coordinate-chain)"/>
<rect x="144" y="70" width="100" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="194.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">World space</text>
<text x="194.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the shelf and</text>
<text x="194.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the room</text>
<line x1="246" y1="120" x2="264" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-coordinate-chain)"/>
<rect x="266" y="70" width="100" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="316.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">View space</text>
<text x="316.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">camera at origin</text>
<text x="316.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">looks down -Z</text>
<line x1="368" y1="120" x2="386" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-coordinate-chain)"/>
<rect x="388" y="70" width="100" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="438.0" y="92" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Clip space</text>
<text x="438.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x y z w</text>
<text x="438.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">before divide</text>
<line x1="490" y1="120" x2="508" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-coordinate-chain)"/>
<rect x="510" y="70" width="100" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="92" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">NDC</text>
<text x="560.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cube -1 to 1</text>
<text x="560.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">after / w</text>
<line x1="612" y1="120" x2="630" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-coordinate-chain)"/>
<rect x="632" y="70" width="100" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="682.0" y="92" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Window</text>
<text x="682.0" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">pixels</text>
<text x="682.0" y="132" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">0..W, 0..H</text>
<text x="133.0" y="195" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Model matrix M</text>
<text x="133.0" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">your JS</text>
<text x="255.0" y="195" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">View matrix V</text>
<text x="255.0" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">your JS</text>
<text x="377.0" y="195" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Projection P</text>
<text x="377.0" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">your JS</text>
<text x="499.0" y="195" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">divide by w</text>
<text x="499.0" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU</text>
<text x="621.0" y="195" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">viewport</text>
<text x="621.0" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU: gl.viewport</text>
<rect x="22" y="235" width="330" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="187" y="258" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">gl_Position = P * V * M * vec4(aPos, 1.0)</text>
<text x="187" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(or uMVP * pos with the product built on the CPU)</text>
<rect x="380" y="235" width="358" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="559" y="258" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Fixed-function stage after the vertex shader:</text>
<text x="559" y="276" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">clipping, perspective divide, viewport transform</text>
<text x="380" y="318" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Matrices are applied right to left: the model matrix touches the vertex first.</text>
</svg>
