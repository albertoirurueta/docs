<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Customer groups and what depends on them</title>
  <desc id="d">A customer belongs to several groups through customer_group and has one default group. The group reduction and the price display method come from the default group. Category visibility, carriers, payment modules, cart rules and specific prices are restricted by group membership.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Customers, groups and the features that read the group</text>

  <!-- customer -->
  <rect x="30" y="70" width="230" height="170" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
  <text x="46" y="96" font-size="15" font-weight="bold" fill="#f2f5f8">ps_customer</text>
  <text x="46" y="120" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id_customer = 4</text>
  <text x="46" y="140" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">email, newsletter, optin</text>
  <text x="46" y="160" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">is_guest, active, deleted</text>
  <text x="46" y="180" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">id_default_group = 4</text>
  <text x="46" y="206" font-size="12" fill="#f2f5f8">B2B fields: company, siret,</text>
  <text x="46" y="224" font-size="12" fill="#f2f5f8">outstanding_allow_amount</text>

  <!-- membership -->
  <rect x="30" y="290" width="230" height="170" rx="10" fill="#34495e" stroke="#f2f5f8"/>
  <text x="46" y="316" font-size="15" font-weight="bold" fill="#f2f5f8">ps_customer_group</text>
  <text x="46" y="340" font-size="12" fill="#f2f5f8">many-to-many membership</text>
  <text x="46" y="364" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">(4, 3)  Customer</text>
  <text x="46" y="384" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">(4, 4)  Coffee Club</text>
  <text x="46" y="414" font-size="12" fill="#f2f5f8">Built-in groups: 1 Visitor,</text>
  <text x="46" y="432" font-size="12" fill="#f2f5f8">2 Guest, 3 Customer</text>
  <path d="M145 240 V 288" fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- group -->
  <rect x="330" y="150" width="250" height="230" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
  <text x="346" y="176" font-size="15" font-weight="bold" fill="#f2f5f8">ps_group  (Coffee Club)</text>
  <text x="346" y="200" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">reduction = 10.00</text>
  <text x="346" y="220" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">price_display_method = 0</text>
  <text x="346" y="240" font-size="12" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">show_prices = 1</text>
  <text x="346" y="264" font-size="12" fill="#f2f5f8">ps_group_lang: name per language</text>
  <text x="346" y="284" font-size="12" fill="#f2f5f8">ps_group_shop: shops using it</text>
  <text x="346" y="314" font-size="12" fill="#f2f5f8">ps_group_reduction: per-category</text>
  <text x="346" y="332" font-size="12" fill="#f2f5f8">reduction (replaces the global one</text>
  <text x="346" y="350" font-size="12" fill="#f2f5f8">for products of that category)</text>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M260 215 H 328"/>
    <path d="M260 374 C 300 374, 300 300, 328 300"/>
  </g>
  <text x="294" y="206" text-anchor="middle" font-size="11" fill="#f2f5f8">default</text>

  <!-- dependents -->
  <text x="780" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#f2f5f8">Features that read the group</text>
  <g fill="#34495e" stroke="#f2f5f8">
    <rect x="640" y="80" width="290" height="56" rx="8"/>
    <rect x="640" y="146" width="290" height="56" rx="8"/>
    <rect x="640" y="212" width="290" height="56" rx="8"/>
    <rect x="640" y="278" width="290" height="56" rx="8"/>
    <rect x="640" y="344" width="290" height="56" rx="8"/>
    <rect x="640" y="410" width="290" height="56" rx="8"/>
  </g>
  <g fill="#f2f5f8" font-size="12">
    <text x="654" y="102" font-weight="bold" font-size="13">Price reduction and tax display</text>
    <text x="654" y="122">default group only: Group::getReduction()</text>
    <text x="654" y="168" font-weight="bold" font-size="13">Category visibility</text>
    <text x="654" y="188">ps_category_group: who can browse a category</text>
    <text x="654" y="234" font-weight="bold" font-size="13">Carriers</text>
    <text x="654" y="254">ps_carrier_group: who can choose a carrier</text>
    <text x="654" y="300" font-weight="bold" font-size="13">Payment modules</text>
    <text x="654" y="320">ps_module_group: who sees a payment option</text>
    <text x="654" y="366" font-weight="bold" font-size="13">Cart rules</text>
    <text x="654" y="386">ps_cart_rule_group: vouchers limited to groups</text>
    <text x="654" y="432" font-weight="bold" font-size="13">Specific prices</text>
    <text x="654" y="452">ps_specific_price.id_group: price per group</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.4" marker-end="url(#a)">
    <path d="M580 230 C 610 230, 610 108, 638 108"/>
    <path d="M580 250 C 610 250, 610 174, 638 174"/>
    <path d="M580 270 C 610 270, 610 240, 638 240"/>
    <path d="M580 290 C 610 290, 610 306, 638 306"/>
    <path d="M580 310 C 610 310, 610 372, 638 372"/>
    <path d="M580 330 C 610 330, 610 438, 638 438"/>
  </g>
  <text x="480" y="516" text-anchor="middle" font-size="12" fill="#f2f5f8">Only the default group feeds the global reduction; membership in any group feeds the restriction tables.</text>
</svg>
