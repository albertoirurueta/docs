<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 631" width="760" height="631" role="img" aria-labelledby="radar-engines-t radar-engines-d">
<title id="radar-engines-t">Scores on ten axes, two game engines</title>
<desc id="radar-engines-d">Editorial scores from 0 to 10 on ten axes (productivity, control, platform reach, web reach, ease of learning, tooling, documentation, ecosystem, licensing openness and XR support) for Unity, Unreal Engine. Every score has a recorded basis and source in the data notes; APIs and engines are different kinds of product, so only axes that make sense across both are used.</desc>
