<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Terraform core reads the configuration and the state, talks to providers over the gRPC plugin protocol, and each provider calls the target API</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Terraform core, providers, state and the target APIs</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">core and each provider are separate processes that talk over a local gRPC connection</text>

  <!-- inputs -->
  <rect x="30" y="80" width="170" height="64" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="106" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Configuration</text>
  <text x="115" y="124" font-size="10.5" fill="#0d3c75" text-anchor="middle">*.tf files (HCL)</text>

  <rect x="30" y="250" width="170" height="64" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="115" y="276" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">State</text>
  <text x="115" y="294" font-size="10.5" fill="#5d4200" text-anchor="middle">resource map, backend, lock</text>

  <!-- core -->
  <rect x="270" y="130" width="190" height="150" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="365" y="158" font-size="15" font-weight="bold" fill="#2e1a63" text-anchor="middle">Terraform core</text>
  <text x="365" y="180" font-size="10.5" fill="#2e1a63" text-anchor="middle">parse and validate HCL</text>
  <text x="365" y="196" font-size="10.5" fill="#2e1a63" text-anchor="middle">build the dependency graph</text>
  <text x="365" y="212" font-size="10.5" fill="#2e1a63" text-anchor="middle">diff desired vs recorded</text>
  <text x="365" y="228" font-size="10.5" fill="#2e1a63" text-anchor="middle">plan, then apply in order</text>
  <text x="365" y="244" font-size="10.5" fill="#2e1a63" text-anchor="middle">install providers and modules</text>
  <text x="365" y="262" font-size="10.5" fill="#2e1a63" text-anchor="middle">the same for every provider</text>

  <!-- providers -->
  <rect x="540" y="70" width="230" height="64" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="655" y="96" font-size="13" font-weight="bold" fill="#14391a" text-anchor="middle">Provider plugin A</text>
  <text x="655" y="114" font-size="10.5" fill="#14391a" text-anchor="middle">e.g. kreuzwerker/docker</text>

  <rect x="540" y="156" width="230" height="64" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="655" y="182" font-size="13" font-weight="bold" fill="#14391a" text-anchor="middle">Provider plugin B</text>
  <text x="655" y="200" font-size="10.5" fill="#14391a" text-anchor="middle">e.g. hashicorp/aws</text>

  <rect x="540" y="242" width="230" height="64" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="655" y="268" font-size="13" font-weight="bold" fill="#14391a" text-anchor="middle">Provider plugin C</text>
  <text x="655" y="286" font-size="10.5" fill="#14391a" text-anchor="middle">e.g. hashicorp/random</text>

  <!-- APIs -->
  <rect x="540" y="340" width="230" height="52" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="655" y="363" font-size="13" font-weight="bold" fill="#1c2b33" text-anchor="middle">Target APIs</text>
  <text x="655" y="380" font-size="10.5" fill="#1c2b33" text-anchor="middle">Docker Engine, cloud REST APIs, SaaS</text>

  <!-- registry -->
  <rect x="270" y="326" width="190" height="52" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="365" y="349" font-size="13" font-weight="bold" fill="#5a0b2e" text-anchor="middle">Registry</text>
  <text x="365" y="366" font-size="10.5" fill="#5a0b2e" text-anchor="middle">downloads at terraform init</text>

  <!-- arrows -->
  <line x1="200" y1="112" x2="268" y2="160" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="200" y1="282" x2="268" y2="250" stroke="#37474f" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="460" y1="170" x2="538" y2="106" stroke="#37474f" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="460" y1="205" x2="538" y2="188" stroke="#37474f" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="460" y1="240" x2="538" y2="274" stroke="#37474f" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="655" y1="306" x2="655" y2="338" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="365" y1="324" x2="365" y2="282" stroke="#37474f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- labels -->
  <text x="236" y="118" font-size="10" fill="#37474f" text-anchor="middle">desired</text>
  <text x="228" y="276" font-size="10" fill="#37474f" text-anchor="middle">read / write</text>
  <text x="505" y="130" font-size="10" fill="#37474f" text-anchor="middle">gRPC</text>
  <text x="705" y="326" font-size="10" fill="#37474f" text-anchor="start">API calls</text>
  <text x="352" y="306" font-size="10" fill="#37474f" text-anchor="end">provider binaries</text>
</svg>
