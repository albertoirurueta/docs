<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where an admin sets team permissions in Settings</text>
  <rect x="30" y="50" width="200" height="270" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="130" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Settings</text>
  <g font-size="12" fill="#374151">
    <rect x="44" y="90" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="56" y="109">People</text>
    <rect x="44" y="126" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="56" y="145">Groups</text>
    <rect x="44" y="162" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="56" y="181">Permissions</text>
    <rect x="44" y="198" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="56" y="217">Controls</text>
    <rect x="44" y="234" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="56" y="253">Billing</text>
    <rect x="44" y="270" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="56" y="289">Apps and integrations</text>
  </g>
  <path d="M232,176 L262,176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="266" y="50" width="464" height="270" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="498" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Permissions</text>
  <g font-size="12" fill="#374151">
    <rect x="282" y="88" width="432" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="294" y="108" font-weight="bold">Share and publish</text><text x="294" y="126">Canva Print, downloads, scheduling in the Content Planner</text>
    <rect x="282" y="148" width="432" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="294" y="168" font-weight="bold">Controls</text><text x="294" y="186">Who uploads media, who can create groups, ownership transfer</text>
    <rect x="282" y="208" width="432" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="294" y="228" font-weight="bold">Magic and AI</text><text x="294" y="246">One switch per AI feature, for the whole team</text>
    <rect x="282" y="268" width="432" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/>
    <text x="294" y="293" fill="#92400E">Purchasing permission lives under Billing, not under Permissions</text>
  </g>
  <text x="380" y="346" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a settings area, not a screenshot of any product. Labels vary by plan and release.</text>
</svg>
