<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Ways to change PrestaShop behaviour, from least to most invasive</title>
  <desc id="d">Five rows from top to bottom. A hook listens to an event and changes nothing in the core. A Symfony service decoration wraps a core service or controller and keeps the original reachable. A service replacement swaps the service for another and only one module can do it. A legacy class override merges methods into a file under the override folder that all modules share. A copy of core code edited in place is . For each row the figure names the Pocket Coffee example and whether two modules can coexist.</desc>
  <rect x="0" y="0" width="960" height="480" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Start at the top, go down only when the row above cannot do the job</text>

  <g font-size="13" fill="#f2f5f8">
    <text x="70" y="70" font-weight="bold">Extension point</text>
    <text x="310" y="70" font-weight="bold">Pocket Coffee example</text>
    <text x="700" y="70" font-weight="bold">Two modules together</text>
  </g>

  <rect x="60" y="82" width="840" height="58" rx="6" fill="#3d5266"/>
  <text x="70" y="108" font-size="14" font-weight="bold" fill="#f2f5f8">1  Hook</text>
  <text x="70" y="128" font-size="12" fill="#f2f5f8">action and display hooks</text>
  <text x="310" y="108" font-size="12.5" fill="#f2f5f8">actionFrontControllerInitAfter sends X-Pcfe46-Hook</text>
  <text x="310" y="128" font-size="12.5" fill="#f2f5f8">displayProductAdditionalInfo prints the club discount</text>
  <text x="700" y="118" font-size="12.5" fill="#f2f5f8">Yes, all listeners run</text>

  <rect x="60" y="150" width="840" height="58" rx="6" fill="#3d5266"/>
  <text x="70" y="176" font-size="14" font-weight="bold" fill="#f2f5f8">2  Service decoration</text>
  <text x="70" y="196" font-size="12" fill="#f2f5f8">#[AsDecorator] or decorates:</text>
  <text x="310" y="176" font-size="12.5" fill="#f2f5f8">CountingB2bFeature wraps the B2B switch</text>
  <text x="310" y="196" font-size="12.5" fill="#f2f5f8">CmsPagesControllerDecorator adds a response header</text>
  <text x="700" y="186" font-size="12.5" fill="#f2f5f8">Yes, Symfony chains them</text>

  <rect x="60" y="218" width="840" height="58" rx="6" fill="#3d5266"/>
  <text x="70" y="244" font-size="14" font-weight="bold" fill="#f2f5f8">3  Service replacement</text>
  <text x="70" y="264" font-size="12" fill="#f2f5f8">same service id, new class</text>
  <text x="310" y="244" font-size="12.5" fill="#f2f5f8">Documented, not run: the original is gone, every</text>
  <text x="310" y="264" font-size="12.5" fill="#f2f5f8">consumer gets the new class</text>
  <text x="700" y="254" font-size="12.5" fill="#f2f5f8">No, one definition survives</text>

  <rect x="60" y="286" width="840" height="58" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="312" font-size="14" font-weight="bold" fill="#f4b860">4  Class override</text>
  <text x="70" y="332" font-size="12" fill="#f4b860">modules/x/override/ to /override/</text>
  <text x="310" y="312" font-size="12.5" fill="#f4b860">FrontController::initContent and initHeader merged</text>
  <text x="310" y="332" font-size="12.5" fill="#f4b860">into one file by two modules</text>
  <text x="700" y="322" font-size="12.5" fill="#f4b860">Only for different methods</text>

  <rect x="60" y="354" width="840" height="58" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="380" font-size="14" font-weight="bold" fill="#f4b860">5  Edit core files</text>
  <text x="70" y="400" font-size="12" fill="#f4b860">legacy 1.6 habit</text>
  <text x="310" y="380" font-size="12.5" fill="#f4b860">Never an option: replaced when an</text>
  <text x="310" y="400" font-size="12.5" fill="#f4b860">update copies the core files</text>
  <text x="700" y="390" font-size="12.5" fill="#f4b860">No</text>

  <path d="M30 100 L30 380" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="446" font-size="12.5" fill="#f2f5f8">Own table plus own ObjectModel (see Database and Entities) replaces most overrides that add fields to a core entity.</text>
  <text x="40" y="466" font-size="12.5" fill="#f2f5f8">Overrides are forbidden in Addons partner modules and discouraged for any module you distribute.</text>
</svg>
