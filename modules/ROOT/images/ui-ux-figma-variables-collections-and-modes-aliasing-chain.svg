<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Aliasing chain: primitive to semantic to a layer</text>
  <rect x="20" y="70" width="190" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="115" y="94" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Primitives (one mode)</text>
  <g font-size="12" fill="#374151"><text x="36" y="124">indigo/600  #4F46E5</text><text x="36" y="152">indigo/300  #A5B4FC</text><text x="36" y="180">gray/900  #111827</text><text x="36" y="208">white  #FFFFFF</text></g>
  <rect x="285" y="70" width="190" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="380" y="94" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Semantic (Light / Dark)</text>
  <g font-size="12" fill="#374151"><text x="301" y="124">color/accent</text><text x="301" y="144" fill="#6B7280">Light: indigo/600</text><text x="301" y="162" fill="#6B7280">Dark: indigo/300</text><text x="301" y="192">color/surface</text><text x="301" y="210" fill="#6B7280">Light: white, Dark: gray/900</text></g>
  <rect x="550" y="70" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="645" y="94" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Layer property</text>
  <rect x="580" y="112" width="130" height="40" rx="8" fill="#4F46E5"/><text x="645" y="137" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <text x="645" y="180" font-size="12" fill="#374151" text-anchor="middle">Fill bound to</text><text x="645" y="198" font-size="12" fill="#374151" text-anchor="middle">color/accent</text>
  <g stroke="#4B5563" stroke-width="2"><path d="M212,145 L283,145" marker-end="url(#ah)"/><path d="M477,145 L548,145" marker-end="url(#ah)"/></g>
  <text x="247" y="136" font-size="11" fill="#4B5563" text-anchor="middle">alias</text><text x="512" y="136" font-size="11" fill="#4B5563" text-anchor="middle">bound</text>
  <g fill="#4F46E5"><circle cx="30" cy="62" r="11"/><circle cx="295" cy="62" r="11"/></g><circle cx="560" cy="62" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="66">1</text><text x="295" y="66">2</text><text x="560" y="70" >3</text></g>
  <g font-size="12" fill="#374151"><text x="30" y="256">1 Raw values live once, with no theme logic.</text><text x="30" y="274">2 Each mode of a semantic variable points at a primitive of the same type.</text><text x="30" y="292">3 Layers use semantic names only, so switching mode recolours them.</text></g>
  <text x="380" y="318" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, names illustrative.</text>
</svg>
