<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
  <title id="t">Layers of the scientific Python stack</title>
  <desc id="d">Five stacked layers from bottom to top: CPython with compiled BLAS and LAPACK libraries; NumPy arrays; SciPy, pandas and PyArrow; Matplotlib, seaborn, scikit-learn and statsmodels; Jupyter, IPython and scripts as the working environment.</desc>
  <rect x="1" y="1" width="718" height="468" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Each layer builds on the one below</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A" stroke-width="2">
    <rect x="40" y="60" width="640" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="60" y="88" font-size="16" font-weight="bold">Working environment</text>
    <text x="60" y="110" font-size="14">Jupyter, IPython, scripts, pipelines</text>
    <rect x="40" y="136" width="640" height="64" rx="6" fill="#EDE9FE" stroke="#6D28D9"/>
    <text x="60" y="164" font-size="16" font-weight="bold">Plotting and modeling</text>
    <text x="60" y="186" font-size="14">Matplotlib, seaborn, scikit-learn, statsmodels</text>
    <rect x="40" y="212" width="640" height="64" rx="6" fill="#FEF3C7" stroke="#B45309"/>
    <text x="60" y="240" font-size="16" font-weight="bold">Algorithms and tabular data</text>
    <text x="60" y="262" font-size="14">SciPy, pandas, PyArrow</text>
    <rect x="40" y="288" width="640" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E"/>
    <text x="60" y="316" font-size="16" font-weight="bold">N-dimensional arrays</text>
    <text x="60" y="338" font-size="14">NumPy (ndarray, dtypes, ufuncs, broadcasting)</text>
    <rect x="40" y="364" width="640" height="64" rx="6" fill="#E2E8F0" stroke="#475569"/>
    <text x="60" y="392" font-size="16" font-weight="bold">Runtime and native code</text>
    <text x="60" y="414" font-size="14">CPython, C and Fortran libraries (BLAS, LAPACK), operating system</text>
  </g>
  <g fill="#0F172A"><circle cx="652" cy="92" r="11"/><circle cx="652" cy="168" r="11"/><circle cx="652" cy="244" r="11"/><circle cx="652" cy="320" r="11"/><circle cx="652" cy="396" r="11"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="652" y="97">5</text><text x="652" y="173">4</text><text x="652" y="249">3</text><text x="652" y="325">2</text><text x="652" y="401">1</text></g>
  <text x="360" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Original drawing; layer numbers are explained in the page text.</text>
</svg>
