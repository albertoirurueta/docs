<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude Code talks to Canva through one remote MCP endpoint</text>
  <rect x="30" y="80" width="170" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="115.0" y="113.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude Code</text>
  <text x="115.0" y="129.0" font-size="12" fill="#1F2937" text-anchor="middle">MCP client on your laptop</text>
  <text x="115.0" y="145.0" font-size="12" fill="#1F2937" text-anchor="middle">claude mcp add</text>
  <rect x="295" y="80" width="170" height="90" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="380.0" y="113.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Canva MCP server</text>
  <text x="380.0" y="129.0" font-size="12" fill="#1F2937" text-anchor="middle">remote, Streamable HTTP</text>
  <text x="380.0" y="145.0" font-size="12" fill="#1F2937" text-anchor="middle">api.canva.com/…/v1/mcp</text>
  <rect x="560" y="80" width="170" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="645.0" y="113.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Your Canva account</text>
  <text x="645.0" y="129.0" font-size="12" fill="#1F2937" text-anchor="middle">designs, assets, brand kits</text>
  <text x="645.0" y="145.0" font-size="12" fill="#1F2937" text-anchor="middle">permissions of that user</text>
  <path d="M200,125 L293,125" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M293,140 L200,140" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <path d="M465,125 L558,125" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M558,140 L465,140" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <text x="247" y="112" font-size="11" fill="#374151" text-anchor="middle">tool calls</text>
  <text x="247" y="158" font-size="11" fill="#374151" text-anchor="middle">results</text>
  <text x="512" y="112" font-size="11" fill="#374151" text-anchor="middle">as the user</text>
  <text x="512" y="158" font-size="11" fill="#374151" text-anchor="middle">designs</text>
  <circle cx="30" cy="215" r="11" fill="#4F46E5"/>
  <text x="30" y="219" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="50" y="219" font-size="12" fill="#374151" text-anchor="start">You register an app in the Developer Portal and turn on Canva MCP (client ID and secret).</text>
  <circle cx="30" cy="247" r="11" fill="#4F46E5"/>
  <text x="30" y="251" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="50" y="251" font-size="12" fill="#374151" text-anchor="start">You add the server URL to Claude Code; the secret stays in an environment variable.</text>
  <circle cx="30" cy="279" r="11" fill="#4F46E5"/>
  <text x="30" y="283" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="50" y="283" font-size="12" fill="#374151" text-anchor="start">On first tool use the browser opens and you sign in and allow access (OAuth, one login per user).</text>
  <circle cx="30" cy="311" r="11" fill="#4F46E5"/>
  <text x="30" y="315" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="50" y="315" font-size="12" fill="#374151" text-anchor="start">Claude Code calls tools such as search-designs or start-editing-transaction on your behalf.</text>
  <circle cx="30" cy="343" r="11" fill="#B45309"/>
  <text x="30" y="347" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="50" y="347" font-size="12" fill="#374151" text-anchor="start">Every response ends with an Open in Canva link so you review and refine the design yourself.</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
