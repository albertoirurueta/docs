<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: organise the Bookshelf campaign folder</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="none" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: new folder -->
  <rect x="30" y="100" width="104" height="26" rx="6" fill="#4F46E5"/><text x="82" y="118" font-size="12" fill="#FFFFFF" text-anchor="middle">Add new</text>
  <rect x="30" y="140" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="82" y="158" font-size="12" fill="#374151" text-anchor="middle">New Folder</text>
  <rect x="30" y="180" width="104" height="26" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="82" y="198" font-size="12" fill="#374151" text-anchor="middle">Bookshelf Launch</text>
  <rect x="50" y="222" width="64" height="22" rx="6" fill="#4F46E5"/><text x="82" y="237" font-size="11" fill="#FFFFFF" text-anchor="middle">Create</text>
  <!-- panel 2: subfolders -->
  <rect x="182" y="100" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="118" font-size="12" fill="#374151" text-anchor="middle">Social</text>
  <rect x="182" y="136" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="154" font-size="12" fill="#374151" text-anchor="middle">Brand templates</text>
  <rect x="182" y="172" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="190" font-size="12" fill="#374151" text-anchor="middle">Print</text>
  <text x="234" y="228" font-size="11" fill="#6B7280" text-anchor="middle">subfolders inside</text>
  <!-- panel 3: move -->
  <rect x="334" y="100" width="40" height="30" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="334" y="100" width="12" height="12" rx="2" fill="#4F46E5"/>
  <rect x="382" y="100" width="40" height="30" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="382" y="100" width="12" height="12" rx="2" fill="#4F46E5"/>
  <rect x="334" y="140" width="104" height="26" rx="6" fill="#4F46E5"/><text x="386" y="158" font-size="12" fill="#FFFFFF" text-anchor="middle">Move</text>
  <rect x="334" y="176" width="104" height="26" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="386" y="194" font-size="12" fill="#374151" text-anchor="middle">Recent | All</text>
  <text x="386" y="228" font-size="11" fill="#6B7280" text-anchor="middle">tick items, pick folder</text>
  <!-- panel 4: share -->
  <rect x="486" y="100" width="104" height="26" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="538" y="118" font-size="12" fill="#374151" text-anchor="middle">Only you can access</text>
  <rect x="486" y="136" width="104" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="154" font-size="12" fill="#374151" text-anchor="middle">Can edit / view</text>
  <circle cx="506" cy="196" r="10" fill="#9CA3AF"/><circle cx="526" cy="196" r="10" fill="#D1D5DB"/><circle cx="546" cy="196" r="10" fill="#9CA3AF"/>
  <rect x="486" y="218" width="104" height="24" rx="12" fill="#FFFFFF" stroke="#B45309"/><text x="538" y="234" font-size="11" fill="#92400E" text-anchor="middle">Copy link</text>
  <!-- panel 5: result -->
  <rect x="636" y="100" width="96" height="30" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="120" font-size="12" fill="#92400E" text-anchor="middle">Pinned (up to 12)</text>
  <rect x="636" y="140" width="96" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="684" y="158" font-size="12" fill="#374151" text-anchor="middle">Social</text>
  <rect x="636" y="172" width="96" height="26" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><text x="684" y="190" font-size="12" fill="#374151" text-anchor="middle">Print</text>
  <path d="M652,226 l7,7 l14,-14" fill="none" stroke="#B45309" stroke-width="3"/>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Create the</text><text x="82" y="338">folder</text><text x="234" y="322">Add three</text><text x="234" y="338">subfolders</text><text x="386" y="322">Move the</text><text x="386" y="338">designs in</text><text x="538" y="322">Share it with</text><text x="538" y="338">the team</text><text x="684" y="322">Pin the key</text><text x="684" y="338">items</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
