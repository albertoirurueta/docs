<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 411" width="638" height="411" role="img" aria-labelledby="region-footprint-t region-footprint-d">
<title id="region-footprint-t">Generally available public regions by continent</title>
<desc id="region-footprint-d">Number of generally available public cloud regions of AWS, Azure and Google Cloud in each continent as of 2026-10-26, from the provider region lists. A darker cell means more regions. Regions that are only announced or listed as coming soon, and the China, government and sovereign partitions, are not counted. One Google Cloud row without a continent is left out.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="638" height="411" fill="var(--bg)"/>
