<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Frame pacing: without and with Swappy</text>
<text x="30" y="94" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Render without pacing</text>
<text x="30" y="214" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Render with Swappy</text>
<line x1="120" y1="70" x2="120" y2="330" stroke="#E5E7EB" stroke-width="1"/>
<text x="120" y="62" text-anchor="middle" font-size="10" fill="#6B7280">vsync</text>
<line x1="210" y1="70" x2="210" y2="330" stroke="#E5E7EB" stroke-width="1"/>
<text x="210" y="62" text-anchor="middle" font-size="10" fill="#6B7280">vsync</text>
