<text x="480" y="62" text-anchor="middle" font-size="10" fill="#6B7280">vsync</text>
<line x1="570" y1="70" x2="570" y2="330" stroke="#E5E7EB" stroke-width="1"/>
<text x="570" y="62" text-anchor="middle" font-size="10" fill="#6B7280">vsync</text>
