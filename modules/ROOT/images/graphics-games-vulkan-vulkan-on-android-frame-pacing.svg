<text x="660" y="62" text-anchor="middle" font-size="10" fill="#6B7280">vsync</text>
<rect x="120" y="100" width="60" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150.0" y="120.8" text-anchor="middle" font-size="11" fill="#3730A3">frame</text>
<rect x="190" y="100" width="100" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
