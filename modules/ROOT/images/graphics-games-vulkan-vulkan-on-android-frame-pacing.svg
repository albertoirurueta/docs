<rect x="360" y="100" width="120" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="420.0" y="120.8" text-anchor="middle" font-size="11" fill="#92400E">frame</text>
<rect x="490" y="100" width="50" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="515.0" y="120.8" text-anchor="middle" font-size="11" fill="#3730A3">frame</text>
<text x="380" y="160" text-anchor="middle" font-size="11" fill="#92400E">Short frames are shown early, long frames cause a stall and a stuffed queue</text>
<rect x="120" y="220" width="80" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="160.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">frame</text>
<rect x="210" y="220" width="80" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="250.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">frame</text>
<rect x="300" y="220" width="80" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="340.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">frame</text>
<rect x="390" y="220" width="80" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="430.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">frame</text>
<rect x="480" y="220" width="80" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="520.0" y="240.8" text-anchor="middle" font-size="11" fill="#065F46">frame</text>
<text x="380" y="280" text-anchor="middle" font-size="11" fill="#065F46">Presentation timing and fences keep one frame per interval, no extra latency</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Swappy uses Choreographer ticks, VK_GOOGLE_display_timing and a VkFence</text>
<text x="380" y="350" text-anchor="middle" font-size="11" fill="#374151">Auto mode picks the swap interval from measured CPU and GPU time</text>
</svg>
