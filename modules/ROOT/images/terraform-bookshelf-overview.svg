<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Overview of the Bookshelf Terraform repository: developers and GitHub Actions run the dev and prod root modules, which call the network, database, service and covers modules; locally the resources land in Docker and LocalStack (S3 state with locking, Secrets Manager and the covers bucket), and a real AWS account is the dashed variant</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf infrastructure end to end</text>
  <text x="380" y="44" font-size="10.5" fill="#555555" text-anchor="middle">one repository, two environments, four modules, state in an S3 bucket with a lock</text>

  <line x1="190" y1="110" x2="215" y2="110" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="200" x2="215" y2="200" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="130" x2="575" y2="115" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="215" x2="575" y2="245" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="290" x2="575" y2="372" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="380" y1="320" x2="380" y2="345" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="75" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="98" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Developer</text>
  <text x="105" y="115" font-size="10" fill="#0d3c75" text-anchor="middle">terraform CLI, -chdir=envs/dev</text>
  <text x="105" y="130" font-size="10" fill="#0d3c75" text-anchor="middle">terraform test (mocks)</text>

  <rect x="20" y="165" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="188" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">GitHub Actions</text>
  <text x="105" y="205" font-size="10" fill="#0d3c75" text-anchor="middle">fmt, validate, TFLint, Checkov</text>
  <text x="105" y="220" font-size="10" fill="#0d3c75" text-anchor="middle">plan and apply with OIDC</text>

  <rect x="215" y="65" width="330" height="255" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="380" y="85" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">bookshelf-infra (Git)</text>

  <rect x="230" y="98" width="145" height="46" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="302" y="118" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">envs/dev</text>
  <text x="302" y="134" font-size="10" fill="#5d4200" text-anchor="middle">state key bookshelf/dev</text>
  <rect x="385" y="98" width="145" height="46" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="457" y="118" font-size="13" font-weight="bold" fill="#5d4200" text-anchor="middle">envs/prod</text>
  <text x="457" y="134" font-size="10" fill="#5d4200" text-anchor="middle">state key bookshelf/prod</text>

  <text x="380" y="168" font-size="10.5" fill="#555555" text-anchor="middle">both call the same modules</text>
  <rect x="228" y="178" width="72" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="264" y="204" font-size="12" font-weight="bold" fill="#2e1a63" text-anchor="middle">network</text>
  <rect x="308" y="178" width="72" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="344" y="204" font-size="12" font-weight="bold" fill="#2e1a63" text-anchor="middle">database</text>
  <rect x="388" y="178" width="72" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="424" y="204" font-size="12" font-weight="bold" fill="#2e1a63" text-anchor="middle">service</text>
  <rect x="468" y="178" width="72" height="44" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="504" y="204" font-size="12" font-weight="bold" fill="#2e1a63" text-anchor="middle">covers</text>

  <text x="380" y="248" font-size="10.5" fill="#555555" text-anchor="middle">checks, variable validation, moved and import blocks</text>
  <text x="380" y="266" font-size="10.5" fill="#555555" text-anchor="middle">ephemeral password + write-only secret version</text>
  <text x="380" y="284" font-size="10.5" fill="#555555" text-anchor="middle">modules/*/tests/*.tftest.hcl, .tflint.hcl</text>
  <text x="380" y="302" font-size="10.5" fill="#555555" text-anchor="middle">partial S3 backend: envs/*/dev.s3.tfbackend</text>

  <rect x="215" y="345" width="330" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="380" y="368" font-size="12" font-weight="bold" fill="#1b4d1f" text-anchor="middle">State bucket with native lock</text>
  <text x="380" y="385" font-size="10" fill="#1b4d1f" text-anchor="middle">use_lockfile = true: state object plus .tflock object</text>
  <text x="380" y="399" font-size="10" fill="#1b4d1f" text-anchor="middle">LocalStack S3 locally, real S3 in the variant</text>

  <rect x="580" y="75" width="165" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="662" y="97" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Docker engine</text>
  <text x="662" y="114" font-size="10" fill="#0d3c75" text-anchor="middle">frontend and backend networks</text>
  <text x="662" y="128" font-size="10" fill="#0d3c75" text-anchor="middle">postgres, redis</text>
  <text x="662" y="142" font-size="10" fill="#0d3c75" text-anchor="middle">catalog-api, reviews-api, web</text>

  <rect x="580" y="205" width="165" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="662" y="227" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">LocalStack</text>
  <text x="662" y="244" font-size="10" fill="#1b4d1f" text-anchor="middle">S3: state, lock, covers bucket</text>
  <text x="662" y="258" font-size="10" fill="#1b4d1f" text-anchor="middle">Secrets Manager: service token</text>
  <text x="662" y="272" font-size="10" fill="#1b4d1f" text-anchor="middle">fake credentials, port 4566</text>

  <rect x="580" y="335" width="165" height="80" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="662" y="357" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Real AWS (variant)</text>
  <text x="662" y="374" font-size="10" fill="#7f1d1d" text-anchor="middle">S3 state, RDS with password_wo</text>
  <text x="662" y="388" font-size="10" fill="#7f1d1d" text-anchor="middle">ECS, IAM role assumed</text>
  <text x="662" y="402" font-size="10" fill="#7f1d1d" text-anchor="middle">through GitHub OIDC</text>
</svg>
