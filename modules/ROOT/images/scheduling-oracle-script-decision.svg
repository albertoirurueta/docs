<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which Oracle script, driver and delegate for Quartz 2.5.2</text>
  <defs>
    <marker id="osd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- question 1 -->
  <rect x="270" y="48" width="360" height="52" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="450" y="70" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Does the schema live on Oracle Database 23ai or later?</text>
  <text x="450" y="88" font-size="11.5" fill="#333333" text-anchor="middle">(the SQL BOOLEAN column type exists from 23ai)</text>

  <line x1="360" y1="100" x2="230" y2="132" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#osd-arrow)"/>
  <line x1="540" y1="100" x2="670" y2="132" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#osd-arrow)"/>
  <text x="270" y="116" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="end">yes</text>
  <text x="630" y="116" font-size="12" font-weight="bold" fill="#1c4b73">no (19c, 21c)</text>

  <!-- left: question 2 -->
  <rect x="40" y="134" width="380" height="52" rx="8" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="230" y="156" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Which ojdbc and which script?</text>
  <text x="230" y="174" font-size="11.5" fill="#333333" text-anchor="middle">Boot 4.1.1 manages ojdbc11 23.26.3.0.0</text>

  <line x1="140" y1="186" x2="140" y2="226" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#osd-arrow)"/>
  <line x1="320" y1="186" x2="320" y2="226" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#osd-arrow)"/>

  <!-- left outcomes -->
  <rect x="40" y="228" width="190" height="124" rx="8" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="54" y="250" font-size="12.5" font-weight="bold" fill="#2e7d4f">ojdbc 23.x</text>
  <text x="54" y="268" font-size="11.5" fill="#333333">tables_oracle23.sql</text>
  <text x="54" y="284" font-size="11.5" fill="#333333">(BOOLEAN columns)</text>
  <text x="54" y="306" font-size="11.5" fill="#333333">StdJDBCDelegate or</text>
  <text x="54" y="322" font-size="11.5" fill="#333333">OracleDelegate: both</text>
  <text x="54" y="338" font-size="11.5" font-weight="bold" fill="#2e7d4f">work (measured)</text>

  <rect x="240" y="228" width="190" height="124" rx="8" fill="#fbeaea" stroke="#b03030" stroke-width="1.5"/>
  <text x="254" y="250" font-size="12.5" font-weight="bold" fill="#b03030">ojdbc 23.x</text>
  <text x="254" y="268" font-size="11.5" fill="#333333">tables_oracle.sql</text>
  <text x="254" y="284" font-size="11.5" fill="#333333">(VARCHAR2(1) flags)</text>
  <text x="254" y="306" font-size="11.5" fill="#333333">Std and Oracle delegate</text>
  <text x="254" y="322" font-size="11.5" fill="#333333">both fail on the first</text>
  <text x="254" y="338" font-size="11.5" font-weight="bold" fill="#b03030">job: ORA-12899</text>

  <rect x="40" y="366" width="390" height="70" rx="8" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="54" y="388" font-size="12.5" font-weight="bold" fill="#2e7d4f">ojdbc 21.9 pinned, tables_oracle.sql</text>
  <text x="54" y="406" font-size="11.5" fill="#333333">StdJDBCDelegate or OracleDelegate both work (measured on a</text>
  <text x="54" y="422" font-size="11.5" fill="#333333">23ai server); only the 23.x driver changed what setBoolean binds</text>

  <!-- right: no BOOLEAN -->
  <rect x="470" y="134" width="390" height="302" rx="8" fill="#fdf5e3" stroke="#a8730a" stroke-width="1.5"/>
  <text x="484" y="158" font-size="13" font-weight="bold" fill="#8a5d05">Pre-23ai server: not run on this machine</text>
  <text x="484" y="182" font-size="11.5" fill="#333333">tables_oracle23.sql cannot be created (no BOOLEAN</text>
  <text x="484" y="198" font-size="11.5" fill="#333333">column type before 23ai), so the flag columns stay</text>
  <text x="484" y="214" font-size="11.5" fill="#333333">VARCHAR2(1) as in tables_oracle.sql, and the driver</text>
  <text x="484" y="230" font-size="11.5" fill="#333333">must store them as text 1/0 instead of true/false:</text>
  <text x="484" y="256" font-size="11.5" font-weight="bold" fill="#333333">Option A: pin ojdbc 21.x (oracle-database.version)</text>
  <text x="484" y="272" font-size="11.5" fill="#333333">measured with tables_oracle.sql on a 23ai server</text>
  <text x="484" y="298" font-size="11.5" font-weight="bold" fill="#333333">Option B: keep ojdbc 23.x and subclass OracleDelegate,</text>
  <text x="484" y="314" font-size="11.5" fill="#333333">overriding setBoolean/getBoolean to use setString 1/0</text>
  <text x="484" y="330" font-size="11.5" fill="#333333">measured on 23ai with ojdbc 23.26.3.0.0</text>
  <text x="484" y="362" font-size="11.5" fill="#333333">Neither option was run against a 19c or 21c server;</text>
  <text x="484" y="378" font-size="11.5" fill="#333333">test the choice on the release you run in production.</text>

  <!-- bottom bar -->
  <rect x="40" y="458" width="820" height="78" rx="8" fill="#f4f4f4" stroke="#666666" stroke-width="1.5"/>
  <text x="54" y="482" font-size="12.5" font-weight="bold" fill="#222222">Every Oracle script starts with delete from and drop table statements</text>
  <text x="54" y="500" font-size="11.5" fill="#333333">They fail on an empty schema (ORA-00942). Boot hides that only while continue-on-error is true (the default).</text>
  <text x="54" y="518" font-size="11.5" fill="#333333">For Flyway, Liquibase or continue-on-error=false, delete those lines and keep the CREATE TABLE and CREATE INDEX statements.</text>
</svg>
