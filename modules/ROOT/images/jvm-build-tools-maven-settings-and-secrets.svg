<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<text x="480" y="28" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">settings.xml layers and how a server password reaches the repository (Maven 3.10.0 and Maven 4.0.0-rc-7)</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Left: three files merged into the effective settings. Right: a credential is read from settings.xml and decrypted with a master secret kept outside it.</text>
<text x="247" y="86" font-size="14" fill="#2f6db5" text-anchor="middle" font-weight="bold">Where settings come from</text>
<text x="713" y="86" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">What happens to a server password</text>
<rect x="24" y="102" width="446" height="62" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="247.0" y="128.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Installation: MAVEN_HOME/conf/settings.xml</text>
<text x="247.0" y="145.5" font-size="11" fill="#444444" text-anchor="middle">shared by all users of this Maven; -gs (Maven 3) or -is (Maven 4)</text>
<rect x="24" y="196" width="446" height="62" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="247.0" y="222.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">User: ~/.m2/settings.xml</text>
<text x="247.0" y="239.5" font-size="11" fill="#444444" text-anchor="middle">one developer or CI account; -s overrides the path</text>
<rect x="24" y="290" width="446" height="62" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="247.0" y="316.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Project: .mvn/settings.xml (Maven 4 only)</text>
<text x="247.0" y="333.5" font-size="11" fill="#444444" text-anchor="middle">committed with the code; -ps overrides the path</text>
<line x1="247" y1="164" x2="247" y2="194" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="247" y1="258" x2="247" y2="288" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="247" y1="352" x2="247" y2="382" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="24" y="382" width="446" height="62" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="247.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Effective settings</text>
<text x="247.0" y="425.5" font-size="11" fill="#444444" text-anchor="middle">the user file wins on conflicts; lists such as pluginGroups are merged</text>
<text x="247" y="470" font-size="11" fill="#666666" text-anchor="middle">Check with: mvn help:effective-settings (passwords are masked)</text>
<rect x="490" y="102" width="446" height="62" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="713.0" y="128.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">server entry in settings.xml</text>
<text x="713.0" y="145.5" font-size="11" fill="#444444" text-anchor="middle">password is plain, ${env.NAME} or an encrypted {...} value</text>
<rect x="490" y="196" width="216" height="110" rx="6" fill="#fff4e0" stroke="#c77d12" stroke-width="1.3"/>
<text x="598.0" y="229.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Maven 3</text>
<text x="598.0" y="246.5" font-size="11" fill="#444444" text-anchor="middle">settings-security.xml holds</text>
<text x="598.0" y="263.5" font-size="11" fill="#444444" text-anchor="middle">the encrypted master password;</text>
<text x="598.0" y="280.5" font-size="11" fill="#444444" text-anchor="middle">-Dsettings.security moves it</text>
<rect x="720" y="196" width="216" height="110" rx="6" fill="#fff4e0" stroke="#c77d12" stroke-width="1.3"/>
<text x="828.0" y="221.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Maven 4</text>
<text x="828.0" y="238.0" font-size="11" fill="#444444" text-anchor="middle">settings-security4.xml via mvnenc;</text>
<text x="828.0" y="255.0" font-size="11" fill="#444444" text-anchor="middle">dispatcher master or lookup;</text>
<text x="828.0" y="272.0" font-size="11" fill="#444444" text-anchor="middle">key from env, file, gpg-agent,</text>
<text x="828.0" y="289.0" font-size="11" fill="#444444" text-anchor="middle">pinentry or 1Password</text>
<line x1="640" y1="164" x2="598" y2="196" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="786" y1="164" x2="828" y2="196" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="598" y1="306" x2="598" y2="382" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="828" y1="306" x2="828" y2="382" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="490" y="382" width="446" height="62" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="713.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Decrypted in memory, sent to the repository</text>
<text x="713.0" y="425.5" font-size="11" fill="#444444" text-anchor="middle">HTTP basic auth or SSH key; bound to the repository origin since 3.10</text>
<line x1="478" y1="100" x2="478" y2="470" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
