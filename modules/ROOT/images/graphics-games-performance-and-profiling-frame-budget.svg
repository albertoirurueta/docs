<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pfb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Frame budget and CPU/GPU pipelining at 60 Hz</text>
<text x="20" y="62" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Budget per frame: 1000 / f milliseconds</text>
<text x="20" y="91" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">30 Hz</text>
<rect x="80" y="76" width="540" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="628" y="91" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">33.3 ms</text>
<text x="20" y="121" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">60 Hz</text>
<rect x="80" y="106" width="270" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="358" y="121" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">16.7 ms</text>
<text x="20" y="151" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">120 Hz</text>
<rect x="80" y="136" width="135" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="223" y="151" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">8.3 ms</text>
<text x="20" y="190" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Pipelined frames: the CPU prepares frame N+1 while the GPU draws frame N</text>
<text x="20" y="224" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">CPU</text>
<text x="20" y="262" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="start">GPU</text>
<rect x="80" y="206" width="200" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="180.0" y="224.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU frame 1</text>
<rect x="180" y="244" width="200" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="280.0" y="262.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU frame 1</text>
<rect x="300" y="206" width="200" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400.0" y="224.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU frame 2</text>
<rect x="400" y="244" width="200" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="500.0" y="262.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU frame 2</text>
<rect x="520" y="206" width="200" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="620.0" y="224.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU frame 3</text>
<rect x="620" y="244" width="200" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="720.0" y="262.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU frame 3</text>
<line x1="300" y1="198" x2="300" y2="290" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="520" y1="198" x2="520" y2="290" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="740" y1="198" x2="740" y2="290" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380" y="312" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="middle">Latency is about two frames, and the slower of the two sides sets the frame rate.</text>
<text x="380" y="334" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="middle">Presenting late (missing the display refresh) shows the previous image again: that is a dropped frame.</text>
</svg>
