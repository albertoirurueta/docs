<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One edge pixel: 1 sample versus 4 samples</text>
<text x="140" y="58" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">1 sample per pixel</text>
<rect x="60" y="70" width="160" height="160" rx="2" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<polygon points="60,110 180,230 60,230" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5" opacity="0.8"/>
<circle cx="140" cy="150" r="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
<text x="380" y="58" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">4 samples per pixel</text>
<rect x="300" y="70" width="160" height="160" rx="2" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<polygon points="300,110 420,230 300,230" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5" opacity="0.8"/>
<circle cx="330" cy="170" r="6" fill="#4F46E5" stroke="#374151" stroke-width="1.5"/>
<circle cx="360" cy="200" r="6" fill="#4F46E5" stroke="#374151" stroke-width="1.5"/>
<circle cx="400" cy="220" r="6" fill="#4F46E5" stroke="#374151" stroke-width="1.5"/>
<circle cx="410" cy="130" r="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
<text x="140" y="252" text-anchor="middle" font-size="11" fill="#374151">Centre is outside: pixel gets background</text>
<text x="140" y="267" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Hard stair-step edge</text>
<text x="380" y="252" text-anchor="middle" font-size="11" fill="#374151">3 of 4 samples covered: 75% triangle colour</text>
<text x="380" y="267" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">Softer edge, shader runs once</text>
<rect x="520" y="90" width="200" height="130" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="535" y="115" text-anchor="start" font-size="11" fill="#374151">Per pixel, MSAA stores:</text>
<text x="535" y="131" text-anchor="start" font-size="11" fill="#374151">- 4 colour values</text>
<text x="535" y="147" text-anchor="start" font-size="11" fill="#374151">- 4 depth values</text>
<text x="535" y="163" text-anchor="start" font-size="11" fill="#374151">- a coverage mask</text>
<text x="535" y="179" text-anchor="start" font-size="11" fill="#374151">The fragment shader runs once</text>
<text x="535" y="195" text-anchor="start" font-size="11" fill="#374151">per pixel and its colour is</text>
<text x="535" y="211" text-anchor="start" font-size="11" fill="#374151">copied to covered samples.</text>
<text x="380" y="320" text-anchor="middle" font-size="11" fill="#4B5563">At resolve time the covered and uncovered colours are averaged into one final colour.</text>
<text x="380" y="338" text-anchor="middle" font-size="10" fill="#6B7280">Sample positions shown are illustrative; real patterns are implementation defined.</text>
</svg>
