<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">FlatList virtualization: the full data array vs. the rendered window</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Only the window of items around the visible viewport is ever mounted as native views -- windowSize controls how large that window is.</text>

  <!-- Panel A: default windowSize -->
  <text x="195" y="66" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">windowSize: 21 (default) -- larger window</text>

  <!-- data array column, 14 items -->
  <g id="panelA">
    <!-- item boxes -->
    <!-- indices 0-13, y from 80 to 80+14*24=416 -->
  </g>

  <!-- Panel A items -->
  <rect x="70" y="80"  width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="70" y="104" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="70" y="128" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="152" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="176" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="200" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="70" y="224" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="70" y="248" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="70" y="272" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="296" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="320" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="70" y="344" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="70" y="368" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="70" y="392" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="130" y="94" font-size="8.5" fill="#999999" text-anchor="middle">item 1</text>
  <text x="130" y="118" font-size="8.5" fill="#999999" text-anchor="middle">item 2</text>
  <text x="130" y="142" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 3 (rendered)</text>
  <text x="130" y="166" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 4 (rendered)</text>
  <text x="130" y="190" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 5 (rendered)</text>
  <text x="130" y="214" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 6 (visible)</text>
  <text x="130" y="238" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 7 (visible)</text>
  <text x="130" y="262" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 8 (visible)</text>
  <text x="130" y="286" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 9 (rendered)</text>
  <text x="130" y="310" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 10 (rendered)</text>
  <text x="130" y="334" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 11 (rendered)</text>
  <text x="130" y="358" font-size="8.5" fill="#999999" text-anchor="middle">item 12</text>
  <text x="130" y="382" font-size="8.5" fill="#999999" text-anchor="middle">item 13</text>
  <text x="130" y="406" font-size="8.5" fill="#999999" text-anchor="middle">item 14</text>

  <!-- viewport bracket (visible screen) around items 6-8 -->
  <rect x="44" y="196" width="16" height="80" rx="3" fill="none" stroke="#a33333" stroke-width="1.6"/>
  <text x="36" y="240" font-size="8.5" fill="#a33333" text-anchor="end" transform="rotate(-90,36,240)">visible viewport</text>

  <!-- window bracket (rendered window) around items 3-11 -->
  <rect x="200" y="124" width="14" height="220" rx="3" fill="none" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="222" y="234" font-size="8.5" fill="#1c4b73" text-anchor="start" transform="rotate(-90,222,234)">rendered window (mounted native views)</text>

  <!-- Panel B: smaller windowSize -->
  <text x="610" y="66" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">windowSize: 5 -- smaller window</text>

  <rect x="485" y="80"  width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="104" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="128" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="152" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="176" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="485" y="200" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="485" y="224" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="485" y="248" width="120" height="20" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <rect x="485" y="272" width="120" height="20" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="485" y="296" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="320" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="344" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="368" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="485" y="392" width="120" height="20" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="545" y="94" font-size="8.5" fill="#999999" text-anchor="middle">item 1</text>
  <text x="545" y="118" font-size="8.5" fill="#999999" text-anchor="middle">item 2</text>
  <text x="545" y="142" font-size="8.5" fill="#999999" text-anchor="middle">item 3</text>
  <text x="545" y="166" font-size="8.5" fill="#999999" text-anchor="middle">item 4</text>
  <text x="545" y="190" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 5 (rendered)</text>
  <text x="545" y="214" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 6 (visible)</text>
  <text x="545" y="238" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 7 (visible)</text>
  <text x="545" y="262" font-size="8.5" fill="#8a5a1c" font-weight="bold" text-anchor="middle">item 8 (visible)</text>
  <text x="545" y="286" font-size="8.5" fill="#1c4b73" text-anchor="middle">item 9 (rendered)</text>
  <text x="545" y="310" font-size="8.5" fill="#999999" text-anchor="middle">item 10</text>
  <text x="545" y="334" font-size="8.5" fill="#999999" text-anchor="middle">item 11</text>
  <text x="545" y="358" font-size="8.5" fill="#999999" text-anchor="middle">item 12</text>
  <text x="545" y="382" font-size="8.5" fill="#999999" text-anchor="middle">item 13</text>
  <text x="545" y="406" font-size="8.5" fill="#999999" text-anchor="middle">item 14</text>

  <!-- viewport bracket -->
  <rect x="459" y="196" width="16" height="80" rx="3" fill="none" stroke="#a33333" stroke-width="1.6"/>
  <text x="451" y="240" font-size="8.5" fill="#a33333" text-anchor="end" transform="rotate(-90,451,240)">visible viewport</text>

  <!-- window bracket around items 5-9, narrower than panel A -->
  <rect x="615" y="172" width="14" height="124" rx="3" fill="none" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="637" y="234" font-size="8.5" fill="#1c4b73" text-anchor="start" transform="rotate(-90,637,234)">smaller rendered window</text>

  <!-- legend -->
  <rect x="70" y="424" width="14" height="14" rx="3" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="90" y="435" font-size="9.5" fill="#555555">not rendered (virtualized -- no native view mounted)</text>

  <rect x="380" y="424" width="14" height="14" rx="3" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="400" y="435" font-size="9.5" fill="#555555">rendered (mounted, outside the visible viewport)</text>

  <rect x="640" y="424" width="14" height="14" rx="3" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.8"/>
  <text x="660" y="435" font-size="9.5" fill="#555555">visible</text>
</svg>
