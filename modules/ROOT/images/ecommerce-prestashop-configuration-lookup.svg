<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How Configuration::get() and Configuration::updateValue() pick a row of ps_configuration</title>
  <desc>Left: the ps_configuration table with one row per scope for the key PCFDCONFIG_BEST_WITHIN_DAYS (global, shop group 1, shop 1). Centre: Configuration::get looks at the shop row, then the shop group row, then the global row, then returns the default. Right: Configuration::updateValue writes to the row of the selected back-office context; when the multistore feature is off, every write goes to the global row.</desc>
  <text x="480" y="26" font-size="18" font-weight="bold" fill="#7b8794" text-anchor="middle">One key, up to three rows: shop, shop group, global</text>
  <text x="480" y="46" font-size="12" fill="#7b8794" text-anchor="middle">Key PCFDCONFIG_BEST_WITHIN_DAYS in ps_configuration (values are strings)</text>

  <!-- table -->
  <rect x="20" y="70" width="330" height="30" rx="6" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="34" y="90" font-size="12" font-weight="bold" fill="#1f2933" font-family="Courier New, monospace">id_shop_group  id_shop  value</text>
  <rect x="20" y="110" width="330" height="44" rx="6" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="34" y="129" font-size="12" fill="#1f2933" font-family="Courier New, monospace">NULL           1        14</text>
  <text x="34" y="146" font-size="11.5" fill="#1f2933">shop row: only shop 1</text>
  <rect x="20" y="164" width="330" height="44" rx="6" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="34" y="183" font-size="12" fill="#1f2933" font-family="Courier New, monospace">1              NULL     7</text>
  <text x="34" y="200" font-size="11.5" fill="#1f2933">group row: every shop of group 1</text>
  <rect x="20" y="218" width="330" height="44" rx="6" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="34" y="237" font-size="12" fill="#1f2933" font-family="Courier New, monospace">NULL           NULL     30</text>
  <text x="34" y="254" font-size="11.5" fill="#1f2933">global row: all shops, written at install</text>

  <!-- read path -->
  <text x="480" y="304" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Read: Configuration::get($key)</text>
  <rect x="20" y="318" width="190" height="64" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="34" y="340" font-size="13" font-weight="bold" fill="#1f2933">1. shop row</text>
  <text x="34" y="358" font-size="11.5" fill="#1f2933">id_shop = current shop</text>
  <text x="34" y="374" font-size="11.5" fill="#1f2933">found: return 14</text>
  <rect x="260" y="318" width="190" height="64" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="274" y="340" font-size="13" font-weight="bold" fill="#1f2933">2. group row</text>
  <text x="274" y="358" font-size="11.5" fill="#1f2933">id_shop_group = its group</text>
  <text x="274" y="374" font-size="11.5" fill="#1f2933">found: return 7</text>
  <rect x="500" y="318" width="190" height="64" rx="8" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="514" y="340" font-size="13" font-weight="bold" fill="#1f2933">3. global row</text>
  <text x="514" y="358" font-size="11.5" fill="#1f2933">both ids NULL</text>
  <text x="514" y="374" font-size="11.5" fill="#1f2933">found: return 30</text>
  <rect x="740" y="318" width="200" height="64" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="754" y="340" font-size="13" font-weight="bold" fill="#1f2933">4. nothing found</text>
  <text x="754" y="358" font-size="11.5" fill="#1f2933">returns false (the $default</text>
  <text x="754" y="374" font-size="11.5" fill="#1f2933">argument, false by default)</text>
  <path d="M210 350 H260 M450 350 H500 M690 350 H740" stroke="#7b8794" stroke-width="2" fill="none"/>
  <text x="235" y="342" font-size="10.5" fill="#7b8794" text-anchor="middle">missing</text>
  <text x="475" y="342" font-size="10.5" fill="#7b8794" text-anchor="middle">missing</text>
  <text x="715" y="342" font-size="10.5" fill="#7b8794" text-anchor="middle">missing</text>

  <!-- write path -->
  <text x="480" y="418" font-size="14" font-weight="bold" fill="#7b8794" text-anchor="middle">Write: Configuration::updateValue($key, $value) uses the context selected in the back office</text>
  <rect x="20" y="432" width="290" height="70" rx="8" fill="#e1f5ec" stroke="#1f8a5b" stroke-width="1.5"/>
  <text x="34" y="454" font-size="13" font-weight="bold" fill="#1f2933">One shop selected</text>
  <text x="34" y="472" font-size="11.5" fill="#1f2933">writes the shop row (id_shop set)</text>
  <text x="34" y="488" font-size="11.5" fill="#1f2933">only when the multistore feature is on</text>
  <rect x="335" y="432" width="290" height="70" rx="8" fill="#e3effd" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="349" y="454" font-size="13" font-weight="bold" fill="#1f2933">Shop group selected</text>
  <text x="349" y="472" font-size="11.5" fill="#1f2933">writes the group row (id_shop_group set)</text>
  <text x="349" y="488" font-size="11.5" fill="#1f2933">only when the multistore feature is on</text>
  <rect x="650" y="432" width="290" height="70" rx="8" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="664" y="454" font-size="13" font-weight="bold" fill="#1f2933">All shops, or feature off</text>
  <text x="664" y="472" font-size="11.5" fill="#1f2933">writes the global row; shop and group</text>
  <text x="664" y="488" font-size="11.5" fill="#1f2933">arguments are ignored (checked on 9.2.0)</text>
</svg>
