<text x="685.0" y="206.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">vkQueueSubmit2</text>
<text x="685.0" y="221.3" text-anchor="middle" font-size="11" fill="#374151">one call</text>
<text x="380" y="375" text-anchor="middle" font-size="11" fill="#374151">Secondary buffers recorded inside a render pass use RENDER_PASS_CONTINUE_BIT and an inheritance</text>
<text x="380" y="393" text-anchor="middle" font-size="11" fill="#374151">info; with dynamic rendering, VkCommandBufferInheritanceRenderingInfo carries the attachment formats.</text>
<text x="380" y="415" text-anchor="middle" font-size="11" fill="#374151">Order of the secondaries in vkCmdExecuteCommands decides the draw order.</text>
