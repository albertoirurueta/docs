<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Shopify checkout sunset timeline 2024 to 2027</title>
<desc id="d">Timeline from 2024 to mid 2027 with one row per legacy checkout customization: checkout.liquid on the Information, Shipping and Payment steps unsupported since 2024; checkout.liquid and additional scripts on Thank you and Order status sunset on 2025-08-28; script tags on the Order status page ended 2025-08-28 for Plus and 2026-08-26 for other plans; Shopify Scripts could not be edited from 2026-04-15 and stopped on 2026-06-30; storefront script tags cannot be created from 2026-10-01 and stop running on 2027-03-01; checkout UI extension API changes in 2026 and 2027. A vertical line marks 2026-10-27.</desc>
<rect x="0" y="0" width="900" height="644" rx="14" fill="#2b3a4a"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#6b7785"/><rect width="3" height="8" fill="#8c97a4"/></pattern></defs>
<g fill="#f2f5f8"><text x="20" y="30" font-size="16" font-weight="bold">Legacy checkout customization: end of life</text><text x="20" y="50" font-size="12">Bars show when a mechanism still worked, diamonds show the dated change</text></g>
