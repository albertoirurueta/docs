</text><rect class="f0" x="150" y="284" width="13.01" height="16"/><text class="muted" x="168.01" y="296">30.5</text><text x="142" y="320" text-anchor="end">Ember.js</text><rect class="f0" x="150" y="308" width="16.38" height="16"/><text class="muted" x="171.38" y="320">38.4</text><text x="142" y="344" text-anchor="end">Angular</text><rect class="f0" x="150" y="332" width="19.07" height="16"/><text class="muted" x="174.07" y="344">44.7</text><text x="142" y="368" text-anchor="end">React</text><rect class="f0" x="150" y="356" width="21.93" height="16"/><text class="muted" x="176.93" y="368">51.4</text><text x="142" y="392" text-anchor="end">Blazor</text><rect class="f0" x="150" y="380" width="587.52" height="16"/><text class="muted" x="742.52" y="392">1377</text><text x="24" y="444" font-weight="600">Runtime package entry point, min+gzip (kB)</text><text class="muted" x="24" y="459" text-anchor="start"><tspan x="24" dy="0">React is n/a: the react-dom entry point excludes the client renderer</tspan></text><line class="grid" x1="150" y1="475" x2="150" y2="859"/><text class="muted" x="150" y="874" text-anchor="middle" font-size="11">0</text><line class="grid" x1="363.33" y1="475" x2="363.33" y2="859"/><text class="muted" x="363.33" y="874" text-anchor="middle" font-size="11">50</text><line class="grid" x1="576.67" y1="475" x2="576.67" y2="859"/><text class="muted" x="576.67" y="874" text-anchor="middle" font-size="11">100</text><line class="grid" x1="790" y1="475" x2="790" y2="859"/><text class="muted" x="790" y="874" text-anchor="middle" font-size="11">150</text><path class="axis" d="M150 475V859H790"/><text x="142" y="491" text-anchor="end">Preact</text><rect class="f0" x="150" y="479" width="21.03" height="16"/><text class="muted" x="176.03" y="491">4.9</text><text x="142" y="515" text-anchor="end">Lit</text><rect class="f0" x="150" y="503" width="25.09" height="16"/><text class="muted" x="180.09" y="515">5.9</text><text x="142" y="539" text-anchor="end">SolidJS</tex