<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Gameplay Ability System: who owns what</text>
<rect x="20" y="50" width="470" height="330" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="255" y="72" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Owner actor (ABookshelfPlayerState)</text>
<rect x="40" y="88" width="430" height="280" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="255" y="108" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Ability System Component</text>
<rect x="55" y="122" width="195" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="152.5" y="142.2" text-anchor="middle" font-size="12" fill="#3730A3">Granted abilities</text>
<text x="152.5" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">FGameplayAbilitySpec list</text>
<text x="152.5" y="172.2" text-anchor="middle" font-size="12" fill="#3730A3">(server grants)</text>
<rect x="260" y="122" width="195" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="357.5" y="142.2" text-anchor="middle" font-size="12" fill="#3730A3">Active Gameplay Effects</text>
<text x="357.5" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">container with timers</text>
<text x="357.5" y="172.2" text-anchor="middle" font-size="12" fill="#3730A3">and stacks</text>
<rect x="55" y="196" width="195" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="152.5" y="216.2" text-anchor="middle" font-size="12" fill="#3730A3">Attribute Sets</text>
<text x="152.5" y="231.2" text-anchor="middle" font-size="12" fill="#3730A3">UBookshelfAttributeSet</text>
<text x="152.5" y="246.2" text-anchor="middle" font-size="12" fill="#3730A3">Stamina, ReadSpeed</text>
<rect x="260" y="196" width="195" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="357.5" y="216.2" text-anchor="middle" font-size="12" fill="#92400E">Gameplay Tag counts</text>
<text x="357.5" y="231.2" text-anchor="middle" font-size="12" fill="#92400E">Ability.SpeedRead</text>
<text x="357.5" y="246.2" text-anchor="middle" font-size="12" fill="#92400E">State.Reading</text>
<rect x="55" y="272" width="400" height="80" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="255.0" y="299.2" text-anchor="middle" font-size="12" fill="#374151">Ability tasks, prediction keys, cue triggers</text>
<text x="255.0" y="316.2" text-anchor="middle" font-size="12" fill="#374151">Replication mode: Full, Mixed or Minimal</text>
<text x="255.0" y="333.2" text-anchor="middle" font-size="12" fill="#374151">Cost and cooldown are Gameplay Effects too</text>
<rect x="560" y="90" width="180" height="110" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="650" y="112" text-anchor="middle" font-size="14" fill="#047857" font-weight="bold">Avatar actor</text>
<text x="650" y="136" text-anchor="middle" font-size="12" fill="#374151">ABookshelfCharacter</text>
<text x="650" y="151" text-anchor="middle" font-size="12" fill="#374151">the body in the world</text>
<text x="650" y="166" text-anchor="middle" font-size="12" fill="#374151">receives input and</text>
<text x="650" y="181" text-anchor="middle" font-size="12" fill="#374151">plays montages</text>
<line x1="490" y1="145" x2="558" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="524" y="135" text-anchor="middle" font-size="11" fill="#4B5563">avatar</text>
<rect x="560" y="250" width="180" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650" y="272" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Gameplay Cues</text>
<text x="650" y="294" text-anchor="middle" font-size="12" fill="#374151">GameplayCue.Book.SpeedRead</text>
<text x="650" y="309" text-anchor="middle" font-size="12" fill="#374151">cosmetic only: dust</text>
<text x="650" y="324" text-anchor="middle" font-size="12" fill="#374151">VFX and a sound,</text>
<text x="650" y="339" text-anchor="middle" font-size="12" fill="#374151">unreliable replication</text>
<line x1="470" y1="310" x2="558" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="650" y1="200" x2="650" y2="248" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="700" y="228" text-anchor="middle" font-size="11" fill="#4B5563">plays</text>
<text x="380" y="410" text-anchor="middle" font-size="12" fill="#374151">Replication: attributes and tags reach clients; abilities go to the owning client;</text>
<text x="380" y="428" text-anchor="middle" font-size="12" fill="#374151">effects reach the owner (Mixed) or everyone (Full).</text>
</svg>
