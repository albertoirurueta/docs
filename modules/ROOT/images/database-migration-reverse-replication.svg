<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Reverse replication after the write cut-over, with the loop broken in both directions</text>

  <!-- PostgreSQL column -->
  <rect x="15" y="60" width="150" height="420" rx="8" fill="#e8f1fa" stroke="#1f5f99" stroke-width="1.6"/>
  <g font-size="15" fill="#1d2b3a" text-anchor="middle">
    <text x="90" y="86" font-weight="bold">PostgreSQL 18</text>
    <text x="90" y="106">database bookshop</text>
    <text x="90" y="140">book</text>
    <text x="90" y="160">book_author</text>
    <text x="90" y="180">author</text>
    <text x="90" y="214" font-weight="bold">source of truth</text>
    <text x="90" y="234">from phase 4</text>
    <text x="90" y="400">written by the</text>
    <text x="90" y="420">new application</text>
    <text x="90" y="440">bookshop</text>
  </g>

  <!-- Oracle column -->
  <rect x="735" y="60" width="150" height="420" rx="8" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.6"/>
  <g font-size="15" fill="#3a2414" text-anchor="middle">
    <text x="810" y="86" font-weight="bold">Oracle 26ai Free</text>
    <text x="810" y="106">FREEPDB1</text>
    <text x="810" y="126">schema BOOKSHOP</text>
    <text x="810" y="160">BOOK, AUTHOR</text>
    <text x="810" y="180">(follower copy)</text>
    <text x="810" y="214" font-weight="bold">kept current for</text>
    <text x="810" y="234" font-weight="bold">rollback</text>
    <text x="810" y="380">read by legacy</text>
    <text x="810" y="400">reports; legacy</text>
    <text x="810" y="420">writes switched off</text>
    <text x="810" y="440">for moved tables</text>
  </g>

  <!-- Kafka column -->
  <rect x="395" y="60" width="110" height="420" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
  <g font-size="15" fill="#222222" text-anchor="middle">
    <text x="450" y="86" font-weight="bold">Kafka</text>
    <text x="450" y="176">modern.*</text>
    <text x="450" y="196">topics</text>
    <text x="450" y="376">legacy.*</text>
    <text x="450" y="396">topics</text>
  </g>

  <!-- Lane labels -->
  <g font-size="15" font-weight="bold" fill="#1f5f99">
    <text x="185" y="128">Reverse CDC (main flow)</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#555555">
    <text x="185" y="318">Forward CDC (residual)</text>
  </g>

  <!-- Lane 1: reverse -->
  <rect x="185" y="140" width="190" height="130" rx="6" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
  <g font-size="15" fill="#1d2b3a">
    <text x="195" y="162" font-weight="bold">bookshop-pg-source</text>
    <text x="195" y="182">slot bookshop_reverse</text>
    <text x="195" y="202">origin=none</text>
    <text x="195" y="222">Filter SMT drops</text>
    <text x="195" y="242">changed_by =</text>
    <text x="195" y="262">'legacy-sync'</text>
  </g>

  <rect x="525" y="140" width="190" height="130" rx="6" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
  <g font-size="15" fill="#1d2b3a">
    <text x="535" y="162" font-weight="bold">bookshop-oracle-</text>
    <text x="535" y="182" font-weight="bold">reverse-sink</text>
    <text x="535" y="202">JDBC sink or a</text>
    <text x="535" y="222">translating consumer</text>
    <text x="535" y="242">writes as Oracle user</text>
    <text x="535" y="262">BOOKSHOP_SYNC</text>
  </g>

  <line x1="165" y1="205" x2="183" y2="205" stroke="#1f5f99" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="375" y1="205" x2="393" y2="205" stroke="#1f5f99" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="505" y1="205" x2="523" y2="205" stroke="#1f5f99" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="715" y1="205" x2="733" y2="205" stroke="#1f5f99" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Lane 2: forward -->
  <rect x="185" y="330" width="190" height="130" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <g font-size="15" fill="#222222">
    <text x="195" y="352" font-weight="bold">bookshop-legacy-sync</text>
    <text x="195" y="372">translators write</text>
    <text x="195" y="392">with replication</text>
    <text x="195" y="412">origin and</text>
    <text x="195" y="432">changed_by =</text>
    <text x="195" y="452">'legacy-sync'</text>
  </g>

  <rect x="525" y="330" width="190" height="130" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
  <g font-size="15" fill="#222222">
    <text x="535" y="352" font-weight="bold">bookshop-oracle-</text>
    <text x="535" y="372" font-weight="bold">source</text>
    <text x="535" y="392">log.mining.username.</text>
    <text x="535" y="412">exclude.list =</text>
    <text x="535" y="432">BOOKSHOP_SYNC</text>
  </g>

  <line x1="735" y1="395" x2="717" y2="395" stroke="#666666" stroke-width="2.2" marker-end="url(#arrowGrey)"/>
  <line x1="525" y1="395" x2="507" y2="395" stroke="#666666" stroke-width="2.2" marker-end="url(#arrowGrey)"/>
  <line x1="395" y1="395" x2="377" y2="395" stroke="#666666" stroke-width="2.2" marker-end="url(#arrowGrey)"/>
  <line x1="185" y1="395" x2="167" y2="395" stroke="#666666" stroke-width="2.2" marker-end="url(#arrowGrey)"/>

  <!-- Loop cut markers -->
  <g stroke="#a33a3a" stroke-width="2.4">
    <circle cx="358" cy="252" r="11" fill="#ffffff"/>
    <line x1="351" y1="245" x2="365" y2="259"/>
    <line x1="365" y1="245" x2="351" y2="259"/>
    <circle cx="698" cy="442" r="11" fill="#ffffff"/>
    <line x1="691" y1="435" x2="705" y2="449"/>
    <line x1="705" y1="435" x2="691" y2="449"/>
  </g>

  <!-- Legend -->
  <g font-size="15" fill="#a33a3a">
    <text x="15" y="512">X  Loop cut 1: the Oracle source skips every change made by BOOKSHOP_SYNC (the reverse writer).</text>
    <text x="15" y="536">X  Loop cut 2: the PostgreSQL source skips changes with a replication origin or the 'legacy-sync' marker.</text>
  </g>
  <text x="15" y="562" font-size="15" fill="#444444">Each table has one owner at a time; the residual forward lane exists only while legacy writers remain.</text>
</svg>
