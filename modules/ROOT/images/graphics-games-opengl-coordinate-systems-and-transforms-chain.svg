<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-coordinate-systems-and-transforms-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From object space to window pixels: the OpenGL coordinate chain</text>
<rect x="20" y="90" width="104" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="72.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Object</text>
<text x="72.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">model space</text>
<text x="72.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">book vertices</text>
<circle cx="34" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="34" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="124" y1="128" x2="138" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-coordinate-systems-and-transforms-chain)"/>
<rect x="140" y="90" width="104" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="192.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">World</text>
<text x="192.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shelf scene</text>
<text x="192.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">units: metres</text>
<circle cx="154" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="154" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="244" y1="128" x2="258" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-coordinate-systems-and-transforms-chain)"/>
<rect x="260" y="90" width="104" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="312.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">View</text>
<text x="312.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye space</text>
<text x="312.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">camera at origin</text>
<circle cx="274" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="274" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="364" y1="128" x2="378" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-coordinate-systems-and-transforms-chain)"/>
<rect x="380" y="90" width="104" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="432.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip</text>
<text x="432.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">homogeneous</text>
<text x="432.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">x y z w</text>
<circle cx="394" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="394" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<line x1="484" y1="128" x2="498" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-coordinate-systems-and-transforms-chain)"/>
<rect x="500" y="90" width="104" height="76" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="552.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">NDC</text>
<text x="552.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">after divide</text>
<text x="552.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">x y z in -1..1</text>
<circle cx="514" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="514" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<line x1="604" y1="128" x2="618" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-coordinate-systems-and-transforms-chain)"/>
<rect x="620" y="90" width="104" height="76" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="672.0" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Window</text>
<text x="672.0" y="131" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">pixels + depth</text>
<text x="672.0" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">origin lower left</text>
<circle cx="634" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="634" y="88.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="132.0" y="200" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Model matrix M</text>
<line x1="132.0" y1="190" x2="132.0" y2="170" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="252.0" y="228" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">View matrix V</text>
<line x1="252.0" y1="218" x2="252.0" y2="170" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="372.0" y="200" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Projection P</text>
<line x1="372.0" y1="190" x2="372.0" y2="170" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="492.0" y="228" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">divide by w</text>
<line x1="492.0" y1="218" x2="492.0" y2="170" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="612.0" y="200" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">glViewport + glDepthRange</text>
<line x1="612.0" y1="190" x2="612.0" y2="170" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="60" y="262" width="640" height="50" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="284" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">You write the first three (M, V, P) and the vertex shader multiplies: gl_Position = P * V * M * vec4(pos, 1.0).</text>
<text x="380" y="302" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Clipping, the divide by w and the viewport transform are fixed-function steps done by the GPU.</text>
</svg>
