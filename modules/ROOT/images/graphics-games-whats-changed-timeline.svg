<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From the older guides to 2026</text>
<line x1="40" y1="170" x2="720" y2="170" stroke="#4B5563" stroke-width="2"/>
<g font-size="11" fill="#374151" text-anchor="middle">
<circle cx="60" cy="170" r="7" fill="#B45309"/><text x="60" y="150" font-weight="bold" fill="#92400E">2002</text><text x="60" y="130">Selman: Java 3D</text><text x="60" y="116">Programming</text>
<circle cx="150" cy="170" r="7" fill="#B45309"/><text x="150" y="196" font-weight="bold" fill="#92400E">2008</text><text x="150" y="212">Sun's last Java 3D</text><text x="150" y="226">build, 1.5.2</text>
<circle cx="225" cy="170" r="7" fill="#B45309"/><text x="225" y="150" font-weight="bold" fill="#92400E">2012</text><text x="225" y="130">Sood: Pro Android</text><text x="225" y="116">Augmented Reality</text>
<circle cx="305" cy="170" r="7" fill="#4F46E5"/><text x="305" y="196" font-weight="bold" fill="#3730A3">2016</text><text x="305" y="212">Vulkan 1.0</text>
<circle cx="360" cy="170" r="7" fill="#4F46E5"/><text x="360" y="150" font-weight="bold" fill="#3730A3">2017</text><text x="360" y="130">Applets deprecated</text><text x="360" y="116">(JEP 289, JDK 9)</text>
<circle cx="425" cy="170" r="7" fill="#4F46E5"/><text x="425" y="196" font-weight="bold" fill="#3730A3">2018</text><text x="425" y="212">Plug-in removed</text><text x="425" y="226">in JDK 11</text>
<circle cx="500" cy="170" r="7" fill="#4F46E5"/><text x="500" y="150" font-weight="bold" fill="#3730A3">2021</text><text x="500" y="130">JEP 398: Applet API</text><text x="500" y="116">for removal</text>
<circle cx="590" cy="170" r="7" fill="#4F46E5"/><text x="590" y="196" font-weight="bold" fill="#3730A3">2024</text><text x="590" y="212">OpenXR 1.1; Java 3D</text><text x="590" y="226">1.7.2 (JogAmp)</text>
<circle cx="690" cy="170" r="7" fill="#047857"/><text x="690" y="150" font-weight="bold" fill="#047857">2026</text><text x="690" y="130">WebGPU candidate</text><text x="690" y="116">recommendation</text>
</g>
<text x="380" y="290" text-anchor="middle" font-size="12" fill="#374151">Amber marks the older guides, indigo the changes that followed, green the present state of the baseline.</text>
</svg>
