<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t3 d3" font-family="Arial, Helvetica, sans-serif">
  <title id="t3">Everything a result depends on</title>
  <desc id="d3">Five inputs feed one run: code, data, environment, parameters and random seeds. The run produces a model and metrics, and a run record stores the version of every input.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">A result is a function of five inputs</text>

  <rect x="24" y="60" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Code</text>
  <text x="124" y="97" font-size="12" text-anchor="middle" fill="#475569">Git commit</text>
  <rect x="24" y="116" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Data</text>
  <text x="124" y="153" font-size="12" text-anchor="middle" fill="#475569">content hash (DVC)</text>
  <rect x="24" y="172" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="192" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Environment</text>
  <text x="124" y="209" font-size="12" text-anchor="middle" fill="#475569">lock file, Python version</text>
  <rect x="24" y="228" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="248" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Parameters</text>
  <text x="124" y="265" font-size="12" text-anchor="middle" fill="#475569">params.yaml</text>
  <rect x="24" y="284" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="304" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Random seeds</text>
  <text x="124" y="321" font-size="12" text-anchor="middle" fill="#475569">seed, SeedSequence</text>

  <rect x="290" y="150" width="140" height="80" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="360" y="186" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Run</text>
  <text x="360" y="206" font-size="12" text-anchor="middle" fill="#475569">script or pipeline</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M224 83 C258 83 258 170 288 176"/>
    <path d="M224 139 C256 139 262 178 288 182"/>
    <path d="M224 195 H288"/>
    <path d="M224 251 C256 251 262 206 288 200"/>
    <path d="M224 307 C258 307 258 214 288 206"/>
    <path d="M430 175 H490"/>
    <path d="M430 205 C458 205 462 262 490 262"/>
  </g>

  <rect x="492" y="150" width="204" height="46" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="594" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Model and metrics</text>
  <text x="594" y="187" font-size="12" text-anchor="middle" fill="#475569">the result you report</text>
  <rect x="492" y="238" width="204" height="48" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="594" y="258" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">Run record</text>
  <text x="594" y="275" font-size="12" text-anchor="middle" fill="#475569">all five versions stored with it</text>
  <text x="290" y="356" font-size="12" fill="#475569">If any input is not recorded, the result cannot be explained or repeated later.</text>
</svg>
