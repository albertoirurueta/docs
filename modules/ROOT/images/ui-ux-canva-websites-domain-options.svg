<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Four ways to give the Bookshelf site an address</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four ways to give the Bookshelf site an address</text>
  <rect x="20" y="50" width="170" height="270" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="105" y="76" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="bold">Free domain</text>
  <line x1="34" y1="86" x2="176" y2="86" stroke="#4F46E5" stroke-width="1"/>
  <text x="105" y="116" font-size="11" fill="#374151" text-anchor="middle">my.canva.site address</text>
  <text x="105" y="146" font-size="11" fill="#374151" text-anchor="middle">Website template only</text>
  <text x="105" y="176" font-size="11" fill="#374151" text-anchor="middle">Free plan: 5 live sites</text>
  <text x="105" y="206" font-size="11" fill="#374151" text-anchor="middle">Free plan keeps the</text>
  <text x="105" y="236" font-size="11" fill="#374151" text-anchor="middle">Designed with Canva footer</text>
  <rect x="202" y="50" width="170" height="270" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="287" y="76" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="bold">canva.link</text>
  <line x1="216" y1="86" x2="358" y2="86" stroke="#9CA3AF" stroke-width="1"/>
  <text x="287" y="116" font-size="11" fill="#374151" text-anchor="middle">Mobile website and</text>
  <text x="287" y="146" font-size="11" fill="#374151" text-anchor="middle">Link in Bio templates</text>
  <text x="287" y="176" font-size="11" fill="#374151" text-anchor="middle">publish to canva.link only</text>
  <text x="287" y="206" font-size="11" fill="#374151" text-anchor="middle">No custom domain;</text>
  <text x="287" y="236" font-size="11" fill="#374151" text-anchor="middle">resize to Website to change</text>
  <rect x="384" y="50" width="170" height="270" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="469" y="76" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="bold">Bought in Canva</text>
  <line x1="398" y1="86" x2="540" y2="86" stroke="#B45309" stroke-width="1"/>
  <text x="469" y="116" font-size="11" fill="#374151" text-anchor="middle">Search, Claim domain,</text>
  <text x="469" y="146" font-size="11" fill="#374151" text-anchor="middle">Place order, Pay</text>
  <text x="469" y="176" font-size="11" fill="#374151" text-anchor="middle">Verify by email in 16 days</text>
  <text x="469" y="206" font-size="11" fill="#374151" text-anchor="middle">Live in 15 min to 72 h</text>
  <text x="469" y="236" font-size="11" fill="#374151" text-anchor="middle">Renews yearly</text>
  <rect x="566" y="50" width="170" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="651" y="76" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="bold">Your own domain</text>
  <line x1="580" y1="86" x2="722" y2="86" stroke="#4F46E5" stroke-width="1"/>
  <text x="651" y="116" font-size="11" fill="#374151" text-anchor="middle">Auto-connect or copy</text>
  <text x="651" y="146" font-size="11" fill="#374151" text-anchor="middle">DNS records to your host</text>
  <text x="651" y="176" font-size="11" fill="#374151" text-anchor="middle">Pending up to 72 hours</text>
  <text x="651" y="206" font-size="11" fill="#374151" text-anchor="middle">Paid plans, see the text;</text>
  <text x="651" y="236" font-size="11" fill="#374151" text-anchor="middle">up to 5 domains</text>
  <rect x="20" y="334" width="722" height="44" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="380" y="352" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">Available domain types and plan limits depend on the design type and on your plan.</text>
  <text x="380" y="368" font-size="11" fill="#374151" text-anchor="middle">Plan limits shown follow the Help Center articles; see the pricing page for the current grid.</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic website editor, not a screenshot of any product.</text>
</svg>
