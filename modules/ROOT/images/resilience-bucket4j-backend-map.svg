<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bucket4j 8.21.0 backends grouped by how the read-modify-write is made atomic</text>
<text x="500" y="48" font-size="12" fill="#444444" text-anchor="middle">every column is a ProxyManager flavour; the artifact is bucket4j_jdk17-&lt;name&gt;, Redis also needs bucket4j_jdk17-redis-common</text>

<rect x="15" y="65" width="225" height="505" rx="10" fill="#f4f8fc" stroke="#1c4b73" stroke-width="2"/>
<text x="127" y="90" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Compare-and-swap</text>
<text x="127" y="108" font-size="11" fill="#444444" text-anchor="middle">client reads, computes, swaps; retries</text>
<text x="127" y="122" font-size="11" fill="#444444" text-anchor="middle">on conflict (2 round trips)</text>
<g font-size="12" fill="#222222">
<rect x="30" y="135" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="153" text-anchor="middle">Redis: Lettuce (Lua EVAL)</text>
<rect x="30" y="166" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="184" text-anchor="middle">Redis: Redisson, Jedis</text>
<rect x="30" y="197" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="215" text-anchor="middle">Redis: Vert.x, GLIDE</text>
<rect x="30" y="228" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="246" text-anchor="middle">MongoDB sync / async</text>
<rect x="30" y="259" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="277" text-anchor="middle">Couchbase (document CAS)</text>
<rect x="30" y="290" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="308" text-anchor="middle">Memcached (gets / cas)</text>
<rect x="30" y="321" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="339" text-anchor="middle">Cassandra (lightweight tx)</text>
<rect x="30" y="352" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="370" text-anchor="middle">Geode (cache transaction)</text>
<rect x="30" y="383" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="401" text-anchor="middle">Hazelcast casBasedBuilder</text>
<rect x="30" y="414" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="432" text-anchor="middle">Ignite thin casBasedBuilder</text>
<rect x="30" y="445" width="195" height="26" rx="5" fill="#ffffff" stroke="#1c4b73"/><text x="127" y="463" text-anchor="middle">Caffeine (in-process)</text>
</g>
<text x="127" y="500" font-size="11" fill="#444444" text-anchor="middle">hot keys cost retries:</text>
<text x="127" y="516" font-size="11" fill="#444444" text-anchor="middle">set retryStrategy and a</text>
<text x="127" y="532" font-size="11" fill="#444444" text-anchor="middle">request timeout</text>

<rect x="255" y="65" width="225" height="505" rx="10" fill="#fdf6ee" stroke="#b34700" stroke-width="2"/>
<text x="367" y="90" font-size="14" font-weight="bold" fill="#b34700" text-anchor="middle">Entry processor</text>
<text x="367" y="108" font-size="11" fill="#444444" text-anchor="middle">code runs on the member that owns</text>
<text x="367" y="122" font-size="11" fill="#444444" text-anchor="middle">the key (1 round trip)</text>
<g font-size="12" fill="#222222">
<rect x="270" y="135" width="195" height="26" rx="5" fill="#ffffff" stroke="#b34700"/><text x="367" y="153" text-anchor="middle">JCache (any provider)</text>
<rect x="270" y="166" width="195" height="26" rx="5" fill="#ffffff" stroke="#b34700"/><text x="367" y="184" text-anchor="middle">Hazelcast entryProcessor</text>
<rect x="270" y="197" width="195" height="26" rx="5" fill="#ffffff" stroke="#b34700"/><text x="367" y="215" text-anchor="middle">Ignite 2 thick client</text>
<rect x="270" y="228" width="195" height="26" rx="5" fill="#ffffff" stroke="#b34700"/><text x="367" y="246" text-anchor="middle">Infinispan (ReadWriteMap)</text>
<rect x="270" y="259" width="195" height="26" rx="5" fill="#ffffff" stroke="#b34700"/><text x="367" y="277" text-anchor="middle">Coherence (and 21.x)</text>
</g>
<text x="367" y="320" font-size="11" fill="#444444" text-anchor="middle">Bucket4j classes must be on the</text>
<text x="367" y="336" font-size="11" fill="#444444" text-anchor="middle">classpath of the grid members</text>
<text x="367" y="352" font-size="11" fill="#444444" text-anchor="middle">that host the data</text>

<rect x="495" y="65" width="225" height="505" rx="10" fill="#f3faf4" stroke="#2a7d3f" stroke-width="2"/>
<text x="607" y="90" font-size="14" font-weight="bold" fill="#2a7d3f" text-anchor="middle">Server-side job or task</text>
<text x="607" y="108" font-size="11" fill="#444444" text-anchor="middle">a compute job, function or server</text>
<text x="607" y="122" font-size="11" fill="#444444" text-anchor="middle">task applies the command</text>
<g font-size="12" fill="#222222">
<rect x="510" y="135" width="195" height="26" rx="5" fill="#ffffff" stroke="#2a7d3f"/><text x="607" y="153" text-anchor="middle">Ignite 3 (compute job)</text>
<rect x="510" y="166" width="195" height="26" rx="5" fill="#ffffff" stroke="#2a7d3f"/><text x="607" y="184" text-anchor="middle">Ignite thin clientCompute</text>
<rect x="510" y="197" width="195" height="26" rx="5" fill="#ffffff" stroke="#2a7d3f"/><text x="607" y="215" text-anchor="middle">Infinispan Hot Rod (ServerTask)</text>
<rect x="510" y="228" width="195" height="26" rx="5" fill="#ffffff" stroke="#2a7d3f"/><text x="607" y="246" text-anchor="middle">Geode functionBasedBuilder</text>
</g>
<text x="607" y="290" font-size="11" fill="#444444" text-anchor="middle">server nodes need the Bucket4j jars</text>
<text x="607" y="306" font-size="11" fill="#444444" text-anchor="middle">(Hot Rod: the Bucket4j server task)</text>

<rect x="735" y="65" width="250" height="505" rx="10" fill="#f7f4fb" stroke="#6a3d9a" stroke-width="2"/>
<text x="860" y="90" font-size="14" font-weight="bold" fill="#6a3d9a" text-anchor="middle">Row or key locks</text>
<text x="860" y="108" font-size="11" fill="#444444" text-anchor="middle">lock, read, write and commit in one</text>
<text x="860" y="122" font-size="11" fill="#444444" text-anchor="middle">transaction; no async mode</text>
<g font-size="12" fill="#222222">
<rect x="750" y="135" width="220" height="26" rx="5" fill="#ffffff" stroke="#6a3d9a"/><text x="860" y="153" text-anchor="middle">PostgreSQL SELECT FOR UPDATE</text>
<rect x="750" y="166" width="220" height="26" rx="5" fill="#ffffff" stroke="#6a3d9a"/><text x="860" y="184" text-anchor="middle">PostgreSQL advisory lock</text>
<rect x="750" y="197" width="220" height="26" rx="5" fill="#ffffff" stroke="#6a3d9a"/><text x="860" y="215" text-anchor="middle">MySQL, MariaDB</text>
<rect x="750" y="228" width="220" height="26" rx="5" fill="#ffffff" stroke="#6a3d9a"/><text x="860" y="246" text-anchor="middle">Oracle, SQL Server, DB2</text>
<rect x="750" y="259" width="220" height="26" rx="5" fill="#ffffff" stroke="#6a3d9a"/><text x="860" y="277" text-anchor="middle">Hazelcast lockBasedBuilder</text>
</g>
<text x="860" y="320" font-size="11" fill="#444444" text-anchor="middle">expired rows are removed by you:</text>
<text x="860" y="336" font-size="11" fill="#444444" text-anchor="middle">removeExpired(n)</text>
<text x="860" y="372" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Legacy, not in 8.21.0</text>
<text x="860" y="390" font-size="11" fill="#444444" text-anchor="middle">DynamoDB SDK v1: artifacts</text>
<text x="860" y="406" font-size="11" fill="#444444" text-anchor="middle">stop at 8.6.0 (no jdk17 build)</text>
</svg>
