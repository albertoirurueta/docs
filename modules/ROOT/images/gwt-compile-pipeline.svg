<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Helvetica, Arial, sans-serif">
  <title>The GWT compile pipeline for the Bookshelf client: Java sources to one selection script and one JavaScript file per permutation</title>
  <desc>Java sources, module XML and the JRE emulation library are parsed into one typed syntax tree. For every permutation (one combination of locale and user.agent) the compiler resolves deferred binding, prunes dead code, optimises and writes JavaScript. The linker produces bookshelf.nocache.js and one cache.js file per permutation. In the browser the selection script computes the property values and loads exactly one of the cache.js files.</desc>
  <rect x="0" y="0" width="960" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">From Java source to a permutation in the browser</text>

  <!-- lane labels -->
  <text x="24" y="62" font-size="12" font-weight="bold" fill="#64748b">COMPILE TIME (JVM)</text>
  <text x="936" y="380" text-anchor="end" font-size="12" font-weight="bold" fill="#64748b">RUN TIME (BROWSER)</text>
  <line x1="24" y1="360" x2="936" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- stage 1: inputs -->
  <rect x="24" y="80" width="190" height="112" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="119" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">1. Inputs</text>
  <text x="119" y="126" text-anchor="middle" font-size="12" fill="#1e3a8a">client and shared .java</text>
  <text x="119" y="144" text-anchor="middle" font-size="12" fill="#1e3a8a">module .gwt.xml files</text>
  <text x="119" y="162" text-anchor="middle" font-size="12" fill="#1e3a8a">GWT library sources</text>
  <text x="119" y="180" text-anchor="middle" font-size="12" fill="#1e3a8a">JRE emulation</text>

  <!-- stage 2: AST -->
  <rect x="270" y="80" width="190" height="112" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="365" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">2. Parse and unify</text>
  <text x="365" y="126" text-anchor="middle" font-size="12" fill="#312e81">validate against the</text>
  <text x="365" y="144" text-anchor="middle" font-size="12" fill="#312e81">emulation library, start</text>
  <text x="365" y="162" text-anchor="middle" font-size="12" fill="#312e81">from the entry points,</text>
  <text x="365" y="180" text-anchor="middle" font-size="12" fill="#312e81">build one typed AST</text>

  <!-- stage 3: permutation fan-out -->
  <rect x="516" y="72" width="420" height="232" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="726" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">3. One compile per permutation</text>
  <text x="726" y="112" text-anchor="middle" font-size="12" fill="#334155">bind properties, rewrite GWT.create(), prune, optimise, emit JavaScript</text>

  <rect x="536" y="128" width="185" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="628" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Permutation A</text>
  <text x="628" y="170" text-anchor="middle" font-size="12" fill="#14532d">locale=default</text>
  <text x="628" y="188" text-anchor="middle" font-size="12" fill="#14532d">user.agent=gecko1_8</text>

  <rect x="731" y="128" width="185" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="823" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Permutation B</text>
  <text x="823" y="170" text-anchor="middle" font-size="12" fill="#14532d">locale=default</text>
  <text x="823" y="188" text-anchor="middle" font-size="12" fill="#14532d">user.agent=safari</text>

  <rect x="536" y="214" width="185" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="628" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Permutation C</text>
  <text x="628" y="256" text-anchor="middle" font-size="12" fill="#14532d">locale=es</text>
  <text x="628" y="274" text-anchor="middle" font-size="12" fill="#14532d">user.agent=gecko1_8</text>

  <rect x="731" y="214" width="185" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="823" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Permutation D</text>
  <text x="823" y="256" text-anchor="middle" font-size="12" fill="#14532d">locale=es</text>
  <text x="823" y="274" text-anchor="middle" font-size="12" fill="#14532d">user.agent=safari</text>

  <!-- stage 4: linker and output -->
  <rect x="24" y="238" width="436" height="104" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="242" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">4. Linker writes the output directory</text>
  <text x="242" y="284" text-anchor="middle" font-size="12" fill="#78350f">bookshelf.nocache.js (small selection script)</text>
  <text x="242" y="302" text-anchor="middle" font-size="12" fill="#78350f">one .cache.js per permutation (named by a content hash)</text>
  <text x="242" y="320" text-anchor="middle" font-size="12" fill="#78350f">compilation-mappings.txt (permutation to property values)</text>

  <!-- browser lane -->
  <rect x="24" y="394" width="250" height="68" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="149" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">5. Host page loads</text>
  <text x="149" y="438" text-anchor="middle" font-size="12" fill="#831843">bookshelf.nocache.js</text>
  <text x="149" y="454" text-anchor="middle" font-size="12" fill="#831843">via a script tag</text>

  <rect x="355" y="394" width="250" height="68" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="480" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">6. Select a permutation</text>
  <text x="480" y="438" text-anchor="middle" font-size="12" fill="#831843">compute locale and user.agent</text>
  <text x="480" y="454" text-anchor="middle" font-size="12" fill="#831843">in the browser</text>

  <rect x="686" y="394" width="250" height="68" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="811" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">7. Load one .cache.js</text>
  <text x="811" y="438" text-anchor="middle" font-size="12" fill="#831843">run the entry point's</text>
  <text x="811" y="454" text-anchor="middle" font-size="12" fill="#831843">onModuleLoad()</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M214 136 L268 136"/>
    <path d="M460 136 L514 136"/>
    <path d="M726 304 L726 322 L462 322"/>
    <path d="M274 428 L353 428"/>
    <path d="M605 428 L684 428"/>
    <path d="M149 342 L149 392"/>
  </g>
  <text x="165" y="355" font-size="11" fill="#475569">deploy the directory to a web server</text>
</svg>
