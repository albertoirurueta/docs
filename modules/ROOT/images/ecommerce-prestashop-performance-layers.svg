<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where a PrestaShop 9 request can be served from a cache</title>
  <desc id="d">Five layers from the browser to the database. Browser and CDN keep static files for the time set by the expiry headers. The web server compresses text responses and adds expiry headers when mod_expires is enabled. PHP keeps compiled scripts in OPcache and file paths in the realpath cache, and APCu can hold the SQL query results of PrestaShop. PrestaShop itself keeps compiled Smarty templates and cached module output, combined and compressed CSS and JavaScript files, and the compiled Symfony containers in var/cache. The database keeps data and indexes in the InnoDB buffer pool; MySQL 8 has no query cache.</desc>
  <rect x="0" y="0" width="960" height="436" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">A request meets five caches before it reaches the data</text>

  <g>
    <rect x="30" y="52" width="170" height="310" rx="10" fill="#3d5266"/>
    <rect x="212" y="52" width="170" height="310" rx="10" fill="#33485c"/>
    <rect x="394" y="52" width="170" height="310" rx="10" fill="#3d5266"/>
    <rect x="576" y="52" width="210" height="310" rx="10" fill="#33485c"/>
    <rect x="798" y="52" width="132" height="310" rx="10" fill="#3d5266"/>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="200" y1="100" x2="210" y2="100" marker-end="url(#a)"/>
    <line x1="382" y1="100" x2="392" y2="100" marker-end="url(#a)"/>
    <line x1="564" y1="100" x2="574" y2="100" marker-end="url(#a)"/>
    <line x1="786" y1="100" x2="796" y2="100" marker-end="url(#a)"/>
  </g>

  <g fill="#f2f5f8" font-size="14">
    <text x="42" y="78" font-weight="bold">Browser and CDN</text>
    <text x="42" y="106" font-size="12.5">Static files: CSS, JS,</text>
    <text x="42" y="123" font-size="12.5">images, fonts</text>
    <text x="42" y="150" font-size="12.5">Lifetime comes from</text>
    <text x="42" y="167" font-size="12.5">Cache-Control and</text>
    <text x="42" y="184" font-size="12.5">Expires headers</text>
    <text x="42" y="214" font-size="12.5">HTML pages of the</text>
    <text x="42" y="231" font-size="12.5">shop are sent with</text>
    <text x="42" y="248" font-size="12.5">no-store: not cached</text>
    <text x="42" y="278" font-size="12.5" fill="#f4b860">Switch</text>
    <text x="42" y="298" font-size="12.5" fill="#f4b860">CDN or media servers,</text>
    <text x="42" y="315" font-size="12.5" fill="#f4b860">mod_expires</text>

    <text x="224" y="78" font-weight="bold">Web server</text>
    <text x="224" y="106" font-size="12.5">Compresses HTML,</text>
    <text x="224" y="123" font-size="12.5">CSS and JS</text>
    <text x="224" y="140" font-size="12.5">(440 KB CSS: 84 KB)</text>
    <text x="224" y="167" font-size="12.5">Expiry headers for</text>
    <text x="224" y="184" font-size="12.5">static files, only if</text>
    <text x="224" y="201" font-size="12.5">mod_expires is loaded</text>
    <text x="224" y="231" font-size="12.5">Keep-alive, HTTP/2,</text>
    <text x="224" y="248" font-size="12.5">PHP-FPM workers</text>
    <text x="224" y="278" font-size="12.5" fill="#f4b860">Switch</text>
    <text x="224" y="298" font-size="12.5" fill="#f4b860">.htaccess block,</text>
    <text x="224" y="315" font-size="12.5" fill="#f4b860">Apache optimization</text>

    <text x="406" y="78" font-weight="bold">PHP</text>
    <text x="406" y="106" font-size="12.5">OPcache: compiled</text>
    <text x="406" y="123" font-size="12.5">scripts (1225 files</text>
    <text x="406" y="140" font-size="12.5">for the front office)</text>
    <text x="406" y="167" font-size="12.5">realpath cache: file</text>
    <text x="406" y="184" font-size="12.5">paths, fewer stat calls</text>
    <text x="406" y="214" font-size="12.5">APCu: shared memory</text>
    <text x="406" y="231" font-size="12.5">for the SQL cache</text>
    <text x="406" y="278" font-size="12.5" fill="#f4b860">Switch</text>
    <text x="406" y="298" font-size="12.5" fill="#f4b860">php.ini: opcache.*,</text>
    <text x="406" y="315" font-size="12.5" fill="#f4b860">realpath_cache_*, apcu</text>

    <text x="588" y="78" font-weight="bold">PrestaShop</text>
    <text x="588" y="106" font-size="12.5">Smarty: compiled templates;</text>
    <text x="588" y="123" font-size="12.5">module output cached by id</text>
    <text x="588" y="150" font-size="12.5">CCC: one combined CSS file</text>
    <text x="588" y="167" font-size="12.5">and two JS files instead of 28</text>
    <text x="588" y="194" font-size="12.5">SQL cache: SELECT results in</text>
    <text x="588" y="211" font-size="12.5">APCu or Memcached (325 queries</text>
    <text x="588" y="228" font-size="12.5">on the home page became 28)</text>
    <text x="588" y="255" font-size="12.5">var/cache/prod: compiled</text>
    <text x="588" y="272" font-size="12.5">containers, routes, Twig</text>
    <text x="588" y="298" font-size="12.5" fill="#f4b860">Switch: Advanced Parameters,</text>
    <text x="588" y="315" font-size="12.5" fill="#f4b860">Performance; _PS_MODE_DEV_</text>

    <text x="810" y="78" font-weight="bold">Database</text>
    <text x="810" y="106" font-size="12.5">InnoDB buffer</text>
    <text x="810" y="123" font-size="12.5">pool: data and</text>
    <text x="810" y="140" font-size="12.5">indexes in memory</text>
    <text x="810" y="167" font-size="12.5">MySQL 8 has no</text>
    <text x="810" y="184" font-size="12.5">query cache</text>
    <text x="810" y="278" font-size="12.5" fill="#f4b860">Switch</text>
    <text x="810" y="298" font-size="12.5" fill="#f4b860">my.cnf:</text>
    <text x="810" y="315" font-size="12.5" fill="#f4b860">innodb_buffer_</text>
    <text x="810" y="332" font-size="12.5" fill="#f4b860">pool_size</text>
  </g>

  <rect x="30" y="378" width="900" height="38" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
  <text x="44" y="402" font-size="13" fill="#f2f5f8">Measure first, change one thing, measure again: the same page was 202 ms without OPcache and 76 ms with it, 39 ms with the SQL cache.</text>
</svg>
