<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-lights-and-shadows-shadow-map-projection" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two passes: depth from the light, then a lookup from the camera</text>
<rect x="30" y="60" width="330" height="300" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="82" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Pass 1: render depth from the light</text>
<circle cx="70" cy="120" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="70" y="150" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">light</text>
<polygon points="82,120 300,200 300,290 82,120" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1" opacity="0.8"/>
<rect x="180" y="205" width="40" height="55" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="200" y="235" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">book</text>
<line x1="60" y1="300" x2="340" y2="300" stroke="#1F2937" stroke-width="2"/>
<text x="195" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shelf board (receiver)</text>
<rect x="222" y="296" width="78" height="8" fill="#6B7280" opacity="0.7"/>
<text x="260" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shadow region</text>
<line x1="222" y1="262" x2="300" y2="300" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="195" y="356" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shadow map = nearest depth per texel</text>
<line x1="365" y1="210" x2="395" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-lights-and-shadows-shadow-map-projection)"/>
<rect x="400" y="60" width="330" height="300" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="82" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Pass 2: render from the camera</text>
<rect x="420" y="100" width="290" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="120.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Transform fragment to light clip space</text>
<text x="565.0" y="135.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">using light.shadow.matrix</text>
<line x1="565" y1="148" x2="565" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-lights-and-shadows-shadow-map-projection)"/>
<rect x="420" y="170" width="290" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="190.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Compare fragment depth z with the</text>
<text x="565.0" y="205.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">stored shadow-map depth</text>
<line x1="565" y1="218" x2="565" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-lights-and-shadows-shadow-map-projection)"/>
<rect x="420" y="240" width="135" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="487.5" y="264.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">z greater than stored</text>
<text x="487.5" y="279.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">in shadow</text>
<rect x="575" y="240" width="135" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="642.5" y="264.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">z not greater</text>
<text x="642.5" y="279.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">lit</text>
<text x="565" y="324" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bias and normalBias are added before the compare</text>
<text x="565" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">to avoid false self-shadowing (acne)</text>
</svg>
