<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Push and pull through the OCI distribution API</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Push and pull through the OCI distribution API</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">blobs (config and layers) move once; the manifest ties them to a tag</text>
  <rect x="20" y="70" width="190" height="300" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="115.0" y="87.0" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">Client (docker / buildx)</text>
  <rect x="35" y="110" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="115.0" y="132.5" font-size="9" fill="#333333" text-anchor="middle">layer blobs sha256:...</text>
  <rect x="35" y="160" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="115.0" y="182.5" font-size="9" fill="#333333" text-anchor="middle">config blob sha256:...</text>
  <rect x="35" y="210" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="115.0" y="232.5" font-size="9" fill="#333333" text-anchor="middle">manifest (or index)</text>
  <rect x="550" y="70" width="190" height="300" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="645.0" y="87.0" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Registry</text>
  <rect x="565" y="110" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="645.0" y="132.5" font-size="9" fill="#333333" text-anchor="middle">/v2/&lt;name&gt;/blobs/&lt;digest&gt;</text>
  <rect x="565" y="160" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="645.0" y="182.5" font-size="9" fill="#333333" text-anchor="middle">/v2/&lt;name&gt;/manifests/&lt;ref&gt;</text>
  <rect x="565" y="210" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="645.0" y="232.5" font-size="9" fill="#333333" text-anchor="middle">tag 1.4.0 -&gt; sha256 of manifest</text>
  <line x1="210" y1="110" x2="550" y2="110" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="105.0" font-size="9.5" fill="#555555" text-anchor="middle">push 1: HEAD blob -&gt; 404 means missing</text>
  <line x1="210" y1="140" x2="550" y2="140" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="135.0" font-size="9.5" fill="#555555" text-anchor="middle">push 2: POST/PUT upload only missing blobs</text>
  <line x1="210" y1="170" x2="550" y2="170" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="165.0" font-size="9.5" fill="#555555" text-anchor="middle">push 3: PUT manifest under tag 1.4.0</text>
  <line x1="550" y1="220" x2="210" y2="220" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="215.0" font-size="9.5" fill="#555555" text-anchor="middle">pull 1: GET manifest by tag or @digest</text>
  <line x1="550" y1="250" x2="210" y2="250" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="245.0" font-size="9.5" fill="#555555" text-anchor="middle">pull 2: GET blobs not present locally</text>
  <line x1="550" y1="280" x2="210" y2="280" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380.0" y="275.0" font-size="9.5" fill="#555555" text-anchor="middle">pull 3: verify digests, unpack layers</text>
  <text x="380" y="400" font-size="10" fill="#555555" text-anchor="middle">Pulling by digest skips tag resolution and guarantees identical content; immutable tags prevent a tag from being moved.</text>
</svg>
