<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 802" width="1080" height="802" role="img" aria-labelledby="t" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">Map of the Grafana 13.3 New alert rule form: a single column of six numbered sections from the rule name to the notification message, and the Save and Cancel buttons at the bottom</title>
<g><rect x="0" y="0" width="1080" height="802" fill="#111217" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><g><rect x="0" y="0" width="1080" height="48" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><text x="16" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Alerting</text><text x="74.87" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">/</text><text x="88.87" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">Alert rules</text><text x="164.79" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(204,204,220,0.65)">/</text><text x="178.79" y="28.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#CCCCDC">New alert rule</text></g>
<rect x="16" y="60" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">1 Enter alert rule name</text>
<text x="64" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Name</text>
<g><circle cx="36" cy="82" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="87" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<rect x="16" y="136" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">2 Define query and alert condition</text>
<text x="64" y="188" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Data source, query editor, WHEN QUERY IS ABOVE, Preview alert rule condition</text>
<g><circle cx="36" cy="158" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="163" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<rect x="16" y="212" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">3 Add folder and labels</text>
<text x="64" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Folder, Labels</text>
<g><circle cx="36" cy="234" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="239" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g>
<rect x="16" y="288" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="316" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">4 Set evaluation behavior</text>
<text x="64" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Evaluation group, Pending period, Keep firing for</text>
<g><circle cx="36" cy="310" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="315" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">4</text></g>
<rect x="16" y="364" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">5 Configure notifications</text>
<text x="64" y="416" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Recipient, Contact point</text>
<g><circle cx="36" cy="386" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="391" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">5</text></g>
<rect x="16" y="440" width="1048" height="66" rx="6" fill="#181B1F" stroke="rgba(204,204,220,0.12)" stroke-width="1"/>
<text x="64" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CCCCDC">6 Configure notification message</text>
<text x="64" y="492" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(204,204,220,0.65)">Summary, Description, Runbook URL, Link dashboard and panel</text>
<g><circle cx="36" cy="462" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="36" y="467" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">6</text></g>
<g><rect x="16" y="524" width="76" height="32" rx="6" fill="#3D71D9"/><text x="37.09" y="544.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Save</text></g>
<g><rect x="100" y="524" width="84" height="32" rx="6" fill="#2C2F35" stroke="rgba(204,204,220,0.12)" stroke-width="1"/><text x="118.63" y="544.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#CCCCDC">Cancel</text></g>
<g><circle cx="104" cy="522" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="104" y="527" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g>
<g><circle cx="28" cy="604" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="609" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<text x="48" y="609" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Name of the rule</text>
<g><circle cx="28" cy="634" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<text x="48" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Query and condition: the same query editor as Explore, then Reduce and Threshold</text>
<g><circle cx="28" cy="664" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="669" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g>
<text x="48" y="669" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Folder and labels that route and group the alert</text>
<g><circle cx="28" cy="694" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="699" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">4</text></g>
<text x="48" y="699" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Evaluation group, Pending period and Keep firing for</text>
<g><circle cx="28" cy="724" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="729" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">5</text></g>
<text x="48" y="729" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Notifications: the contact point (or the notification policy with Advanced options)</text>
<g><circle cx="28" cy="754" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="759" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">6</text></g>
<text x="48" y="759" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Message: summary, description, runbook URL and the linked panel</text>
<g><circle cx="28" cy="784" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="789" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g>
<text x="48" y="789" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CCCCDC">Save and Cancel at the bottom</text></g>
</svg>
