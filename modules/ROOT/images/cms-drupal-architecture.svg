<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Drupal architecture: core subsystems, extensions, database and files</title>
  <desc id="d">Layered view of a Drupal site: clients and web server on top, the Symfony kernel with middleware, core subsystems, the extension layer of contrib modules, custom modules, themes, recipes and profiles, and below it the database and file storage.</desc>
  <rect width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>

  <!-- clients -->
  <rect x="20" y="15" width="860" height="50" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="40" y="45" font-weight="bold" fill="#263238">Clients</text>
  <text x="130" y="45" fill="#263238">Browsers, JSON:API consumers (Next.js kiosk), Drush and the CLI, AI agents over MCP</text>

  <!-- web server -->
  <rect x="20" y="85" width="860" height="42" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="40" y="111" font-weight="bold" fill="#263238">Web server</text>
  <text x="140" y="111" fill="#263238">Apache or nginx, PHP-FPM, optional reverse proxy (Varnish, CDN) in front</text>

  <!-- kernel -->
  <rect x="20" y="147" width="860" height="86" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="172" font-weight="bold" fill="#0d47a1">Front controller and kernel (Symfony HttpKernel)</text>
  <rect x="40" y="184" width="130" height="38" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="52" y="207" fill="#0d47a1">index.php</text>
  <rect x="190" y="184" width="150" height="38" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="202" y="207" fill="#0d47a1">DrupalKernel</text>
  <rect x="360" y="184" width="200" height="38" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="372" y="207" fill="#0d47a1">Middleware (page cache)</text>
  <rect x="580" y="184" width="130" height="38" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="592" y="207" fill="#0d47a1">Routing</text>
  <rect x="730" y="184" width="130" height="38" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="742" y="207" fill="#0d47a1">Controller</text>

  <!-- core -->
  <rect x="20" y="253" width="860" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="40" y="278" font-weight="bold" fill="#1b5e20">Drupal core subsystems (all provided as services by the container)</text>
  <g fill="#ffffff" stroke="#2e7d32">
    <rect x="40" y="290" width="190" height="52" rx="5"/><rect x="245" y="290" width="190" height="52" rx="5"/>
    <rect x="450" y="290" width="190" height="52" rx="5"/><rect x="655" y="290" width="205" height="52" rx="5"/>
    <rect x="40" y="355" width="190" height="52" rx="5"/><rect x="245" y="355" width="190" height="52" rx="5"/>
    <rect x="450" y="355" width="190" height="52" rx="5"/><rect x="655" y="355" width="205" height="52" rx="5"/>
  </g>
  <g fill="#1b5e20">
    <text x="52" y="313">Service container</text><text x="52" y="331" font-size="11">*.services.yml, autowiring</text>
    <text x="257" y="313">Entity and Field API</text><text x="257" y="331" font-size="11">nodes, users, terms, media</text>
    <text x="462" y="313">Config, State, Settings</text><text x="462" y="331" font-size="11">YAML, key/value, settings.php</text>
    <text x="667" y="313">Render and Cache API</text><text x="667" y="331" font-size="11">render arrays, tags, contexts</text>
    <text x="52" y="378">Plugin API</text><text x="52" y="396" font-size="11">blocks, fields, formatters</text>
    <text x="257" y="378">Hooks and events</text><text x="257" y="396" font-size="11">#[Hook], event subscribers</text>
    <text x="462" y="378">Form, Menu, Routing APIs</text><text x="462" y="396" font-size="11">forms, links, access checks</text>
    <text x="667" y="378">Theme layer (Twig)</text><text x="667" y="396" font-size="11">templates, libraries, SDC</text>
  </g>

  <!-- extensions -->
  <rect x="20" y="443" width="860" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="40" y="465" font-weight="bold" fill="#e65100">Extensions (code that plugs into core)</text>
  <g fill="#ffffff" stroke="#f9a825">
    <rect x="40" y="473" width="150" height="30" rx="5"/><rect x="205" y="473" width="190" height="30" rx="5"/>
    <rect x="410" y="473" width="150" height="30" rx="5"/><rect x="575" y="473" width="130" height="30" rx="5"/><rect x="720" y="473" width="140" height="30" rx="5"/>
  </g>
  <g fill="#e65100" font-size="12">
    <text x="50" y="493">Contrib modules</text><text x="215" y="493">meridian_collection</text>
    <text x="420" y="493">Theme: meridian</text><text x="585" y="493">Recipes</text><text x="730" y="493">Profiles, CMS</text>
  </g>

  <!-- storage -->
  <rect x="20" y="533" width="420" height="55" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="36" y="555" font-weight="bold" fill="#4a148c">Database</text>
  <text x="36" y="575" font-size="12" fill="#4a148c">content entities, active config, key_value state, cache bins</text>
  <rect x="460" y="533" width="420" height="55" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="476" y="555" font-weight="bold" fill="#4a148c">Files and codebase</text>
  <text x="476" y="575" font-size="12" fill="#4a148c">public:// and private://, config sync directory, settings.php, vendor</text>

  <!-- arrows -->
  <g stroke="#37474f" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <path d="M450 65V85"/><path d="M450 127V147"/><path d="M450 233V253"/><path d="M450 423V443"/>
    <path d="M230 513V533"/><path d="M670 513V533"/>
  </g>
</svg>
