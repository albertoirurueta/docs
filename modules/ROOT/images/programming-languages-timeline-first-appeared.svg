<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" width="900" height="980" role="img" aria-labelledby="timeline-first-appeared-t timeline-first-appeared-d">
<title id="timeline-first-appeared-t">When each language first appeared</title>
<desc id="timeline-first-appeared-d">Timeline of the year each of the 34 compared languages first appeared, one row per language from oldest to newest, coloured by editorial group. Year is the first one given in the Wikipedia Timeline of programming languages, retrieved 2026-10-26: a range such as 1954-1955 uses its first year, and a question mark marks a year the source calls uncertain. Left out because no single year exists: Assembly.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--axis:#9198a1;--s0:#56B4E9;--s1:#E69F00;--s2:#44C9A0;--s3:#E8A0CB;--s4:#F0E442;--s5:#7FB8F0;--s6:#D9C84A;--s7:#FFFFFF;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}.l4{stroke:var(--s4);stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linejoin:round}.m4{fill:var(--s4);stroke:var(--s4)}.f4{fill:var(--s4)}.a4{fill:var(--s4);fill-opacity:.12;stroke:var(--s4);stroke-width:2;stroke-dasharray:4 4;}.l5{stroke:var(--s5);stroke-width:2;fill:none;stroke-dasharray:10 3;stroke-linejoin:round}.m5{fill:var(--s5);stroke:var(--s5)}.f5{fill:var(--s5)}.a5{fill:var(--s5);fill-opacity:.12;stroke:var(--s5);stroke-width:2;stroke-dasharray:10 3;}.l6{stroke:var(--s6);stroke-width:2;fill:none;stroke-dasharray:1 3;stroke-linejoin:round}.m6{fill:var(--s6);stroke:var(--s6)}.f6{fill:var(--s6)}.a6{fill:var(--s6);fill-opacity:.12;stroke:var(--s6);stroke-width:2;stroke-dasharray:1 3;}</style>
