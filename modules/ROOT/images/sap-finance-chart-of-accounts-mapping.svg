  <text x="540" y="510.5" text-anchor="middle" font-size="12">assigned to YCOA (required) and YLOC (optional)</text>
  <line x1="540" y1="450" x2="540" y2="400" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
