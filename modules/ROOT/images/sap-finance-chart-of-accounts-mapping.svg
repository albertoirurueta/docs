  <rect x="10" y="20" width="300" height="66" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="160" y="38.5" text-anchor="middle" font-size="14" font-weight="bold">Country chart: YLOC</text>
  <text x="160" y="57.5" text-anchor="middle" font-size="12">optional, one per company code</text>
  <text x="160" y="76.5" text-anchor="middle" font-size="12">local legal reporting</text>
  <rect x="390" y="20" width="300" height="66" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="38.5" text-anchor="middle" font-size="14" font-weight="bold">Operating chart: YCOA</text>
  <text x="540" y="57.5" text-anchor="middle" font-size="12">required, daily postings</text>
  <text x="540" y="76.5" text-anchor="middle" font-size="12">used by Finance and Controlling</text>
  <rect x="770" y="20" width="300" height="66" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="920" y="38.5" text-anchor="middle" font-size="14" font-weight="bold">Group chart: YGRP</text>
  <text x="920" y="57.5" text-anchor="middle" font-size="12">optional, named on the operating chart</text>
  <text x="920" y="76.5" text-anchor="middle" font-size="12">group reporting and consolidation</text>
