<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" width="1080" height="590" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The three charts of accounts of Example Trading Co. and how their accounts map to each other</title>
  <desc id="d">Company code EX01 is assigned to one operating chart of accounts, YCOA, which is required, and optionally to one country chart of accounts, YLOC. The operating chart can optionally name a group chart of accounts, YGRP. Each operating account can carry an alternative account number from the country chart and a group account number from the group chart. In the example the two sales revenue accounts of the operating chart share one group account, Revenue. Controlling area EX00 uses the operating chart of its company codes. All account numbers are illustrative.</desc>
