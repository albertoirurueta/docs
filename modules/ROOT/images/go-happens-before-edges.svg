<svg viewBox="0 0 940 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Building a happens-before chain</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">happens before = transitive closure of sequenced before (inside one goroutine) and synchronized before (between goroutines)</text>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="r" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker>
  </defs>
  <text x="190" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">goroutine 1 (loader)</text>
  <text x="750" y="82" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">goroutine 2 (main)</text>
  <line x1="190" y1="92" x2="190" y2="330" stroke="#cccccc" stroke-dasharray="4 4"/>
  <line x1="750" y1="92" x2="750" y2="330" stroke="#cccccc" stroke-dasharray="4 4"/>
  <rect x="80" y="100" width="220" height="40" rx="6" fill="#f4f6f8" stroke="#555555" stroke-width="1.5"/>
  <text x="190.0" y="125.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">published = Book{...}</text>
  <rect x="80" y="200" width="220" height="40" rx="6" fill="#f4f6f8" stroke="#555555" stroke-width="1.5"/>
  <text x="190.0" y="225.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">close(ready)</text>
  <rect x="640" y="200" width="220" height="40" rx="6" fill="#f4f6f8" stroke="#555555" stroke-width="1.5"/>
  <text x="750.0" y="225.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">&lt;-ready</text>
  <rect x="640" y="290" width="220" height="40" rx="6" fill="#f4f6f8" stroke="#555555" stroke-width="1.5"/>
  <text x="750.0" y="315.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">fmt.Println(published)</text>
  <line x1="190" y1="140" x2="190" y2="198" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="174" font-size="12" fill="#555555">sequenced before</text>
  <line x1="750" y1="240" x2="750" y2="288" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>
  <text x="760" y="268" font-size="12" fill="#555555">sequenced before</text>
  <line x1="300" y1="220" x2="638" y2="220" stroke="#1c4b73" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="400" y="210" font-size="12" fill="#1c4b73" text-anchor="middle" font-weight="bold">synchronized before</text>
  <text x="410" y="238" font-size="11" fill="#1c4b73" text-anchor="middle">close, then a receive that sees it</text>
  <path d="M300 120 C 540 120, 540 306, 638 306" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="440" y="96" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">write happens before read</text>
  <text x="440" y="110" font-size="11" fill="#2e7d32" text-anchor="middle">(transitivity): no data race</text>
  <line x1="40" y1="360" x2="900" y2="360" stroke="#dddddd"/>
  <text x="470" y="384" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Without a synchronizing edge the two accesses are unordered: a data race</text>
  <rect x="80" y="400" width="220" height="36" rx="6" fill="#fbeeec" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="190.0" y="423.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">done = true</text>
  <rect x="640" y="400" width="220" height="36" rx="6" fill="#fbeeec" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="750.0" y="423.0" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">for !done {}</text>
  <line x1="300" y1="418" x2="638" y2="418" stroke="#b23a2a" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#r)"/>
  <text x="469" y="410" font-size="12" fill="#b23a2a" text-anchor="middle" font-weight="bold">no edge</text>
  <text x="469" y="438" font-size="11" fill="#b23a2a" text-anchor="middle">neither access happens before the other</text>
  <line x1="40" y1="460" x2="900" y2="460" stroke="#dddddd"/>
  <text x="470" y="482" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Synchronized-before edges provided by the language and the library</text>
  <rect x="40" y="496" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="135" y="510" font-size="11" fill="#222222" text-anchor="middle">go statement</text>
  <line x1="232" y1="506" x2="262" y2="506" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="264" y="496" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="359" y="510" font-size="11" fill="#222222" text-anchor="middle">start of the new goroutine</text>
  <rect x="480" y="496" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="575" y="510" font-size="11" fill="#222222" text-anchor="middle">channel send</text>
  <line x1="672" y1="506" x2="702" y2="506" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="704" y="496" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="799" y="510" font-size="11" fill="#222222" text-anchor="middle">completion of the matching receive</text>
  <rect x="40" y="522" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="135" y="536" font-size="11" fill="#222222" text-anchor="middle">close(ch)</text>
  <line x1="232" y1="532" x2="262" y2="532" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="264" y="522" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="359" y="536" font-size="11" fill="#222222" text-anchor="middle">receive that returns the zero value</text>
  <rect x="480" y="522" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="575" y="536" font-size="11" fill="#222222" text-anchor="middle">receive, unbuffered</text>
  <line x1="672" y1="532" x2="702" y2="532" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="704" y="522" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="799" y="536" font-size="11" fill="#222222" text-anchor="middle">completion of the matching send</text>
  <rect x="40" y="548" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="135" y="562" font-size="11" fill="#222222" text-anchor="middle">kth receive, capacity C</text>
  <line x1="232" y1="558" x2="262" y2="558" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="264" y="548" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="359" y="562" font-size="11" fill="#222222" text-anchor="middle">completion of the (k+C)th send</text>
  <rect x="480" y="548" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="575" y="562" font-size="11" fill="#222222" text-anchor="middle">Unlock number n</text>
  <line x1="672" y1="558" x2="702" y2="558" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="704" y="548" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="799" y="562" font-size="11" fill="#222222" text-anchor="middle">Lock number n+1 returns</text>
  <rect x="40" y="574" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="135" y="588" font-size="11" fill="#222222" text-anchor="middle">Once f returns</text>
  <line x1="232" y1="584" x2="262" y2="584" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="264" y="574" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="359" y="588" font-size="11" fill="#222222" text-anchor="middle">every Once.Do call returns</text>
  <rect x="480" y="574" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="575" y="588" font-size="11" fill="#222222" text-anchor="middle">atomic write</text>
  <line x1="672" y1="584" x2="702" y2="584" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="704" y="574" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="799" y="588" font-size="11" fill="#222222" text-anchor="middle">atomic read that observes it</text>
  <rect x="40" y="600" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="135" y="614" font-size="11" fill="#222222" text-anchor="middle">SetFinalizer(x, f)</text>
  <line x1="232" y1="610" x2="262" y2="610" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="264" y="600" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="359" y="614" font-size="11" fill="#222222" text-anchor="middle">finalizer call f(x)</text>
  <rect x="480" y="600" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="575" y="614" font-size="11" fill="#222222" text-anchor="middle">WaitGroup.Done</text>
  <line x1="672" y1="610" x2="702" y2="610" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="704" y="600" width="190" height="20" rx="4" fill="#eaf1f7" stroke="#1c4b73"/>
  <text x="799" y="614" font-size="11" fill="#222222" text-anchor="middle">Wait call it unblocks</text>
</svg>
