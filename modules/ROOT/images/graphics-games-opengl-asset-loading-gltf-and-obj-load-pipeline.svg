<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-asset-loading-gltf-and-obj-load-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From file to GPU: what each loader step produces</text>
<rect x="20" y="60" width="136" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/>
<text x="36" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="88" y="112" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Parse</text>
<text x="88" y="140" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">cgltf_parse_file</text>
<text x="88" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">JSON to C structs</text>
<line x1="156" y1="135" x2="166" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-load-pipeline)"/>
<rect x="166" y="60" width="136" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="76" r="11" fill="#4F46E5"/>
<text x="182" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="234" y="112" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Load buffers</text>
<text x="234" y="140" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">cgltf_load_buffers</text>
<text x="234" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bytes in memory</text>
<line x1="302" y1="135" x2="312" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-load-pipeline)"/>
<rect x="312" y="60" width="136" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="76" r="11" fill="#4F46E5"/>
<text x="328" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="380" y="112" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Unpack</text>
<text x="380" y="140" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">accessor to float/uint</text>
<text x="380" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">interleave vertices</text>
<line x1="448" y1="135" x2="458" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-load-pipeline)"/>
<rect x="458" y="60" width="136" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="76" r="11" fill="#4F46E5"/>
<text x="474" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="526" y="112" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Upload</text>
<text x="526" y="140" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glBufferData / DSA</text>
<text x="526" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">VBO + EBO + VAO</text>
<line x1="594" y1="135" x2="604" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-load-pipeline)"/>
<rect x="604" y="60" width="136" height="150" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<circle cx="620" cy="76" r="11" fill="#4F46E5"/>
<text x="620" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="672" y="112" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Textures</text>
<text x="672" y="140" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">stb_image decode</text>
<text x="672" y="170" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glTexImage2D + mips</text>
<rect x="20" y="236" width="720" height="72" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="258" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Do steps 1 to 3 on a worker thread (no GL context needed). Steps 4 and 5 need the context:</text>
<text x="380" y="274" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">upload on the render thread, or on a second shared context, and fence before use.</text>
</svg>
