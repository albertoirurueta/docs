<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="vh-t vh-d">
  <title id="vh-t">Assigning a value object and a handle object</title>
  <desc id="vh-d">On the left, a value object: q = p copies the Plate, so the variables p and q each own an independent object and changing q leaves p unchanged. On the right, a handle object: t = s copies only the reference, so the variables s and t point to one Simulation object and a change through t is seen through s.</desc>
  <rect x="0" y="0" width="900" height="360" rx="12" fill="#f8fafc"/>
  <line x1="450" y1="20" x2="450" y2="340" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <defs>
    <marker id="vh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#0f172a">
    <text x="225" y="34" text-anchor="middle" font-size="17" font-weight="bold">Value class: heatflow.Plate</text>
    <text x="225" y="56" text-anchor="middle" font-size="13">q = p  copies the object</text>
    <rect x="40" y="95" width="70" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="75" y="118" text-anchor="middle" font-size="15">p</text>
    <rect x="40" y="215" width="70" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="75" y="238" text-anchor="middle" font-size="15">q</text>
    <line x1="110" y1="113" x2="190" y2="113" stroke="#334155" stroke-width="2" marker-end="url(#vh-a)"/>
    <line x1="110" y1="233" x2="190" y2="233" stroke="#334155" stroke-width="2" marker-end="url(#vh-a)"/>
    <rect x="195" y="85" width="215" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="302" y="108" text-anchor="middle" font-size="14" font-weight="bold">Plate object 1</text>
    <text x="302" y="128" text-anchor="middle" font-size="13">T(1,1) = 20</text>
    <rect x="195" y="205" width="215" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="302" y="228" text-anchor="middle" font-size="14" font-weight="bold">Plate object 2 (copy)</text>
    <text x="302" y="248" text-anchor="middle" font-size="13">T(1,1) = 100 after q.T(1,1) = 100</text>
    <text x="225" y="310" text-anchor="middle" font-size="13">Two independent objects; p is unchanged.</text>
    <text x="675" y="34" text-anchor="middle" font-size="17" font-weight="bold">Handle class: heatflow.Simulation</text>
    <text x="675" y="56" text-anchor="middle" font-size="13">t = s  copies the reference</text>
    <rect x="490" y="95" width="70" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="525" y="118" text-anchor="middle" font-size="15">s</text>
    <rect x="490" y="215" width="70" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="525" y="238" text-anchor="middle" font-size="15">t</text>
    <line x1="560" y1="113" x2="685" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#vh-a)"/>
    <line x1="560" y1="233" x2="685" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#vh-a)"/>
    <rect x="690" y="135" width="190" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="785" y="163" text-anchor="middle" font-size="14" font-weight="bold">One Simulation object</text>
    <text x="785" y="185" text-anchor="middle" font-size="13">Time = 0.5 after t.step(5)</text>
    <text x="785" y="203" text-anchor="middle" font-size="13">seen through s and t</text>
    <text x="675" y="310" text-anchor="middle" font-size="13">delete(s) invalidates both s and t.</text>
  </g>
</svg>
