<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-icb-cmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Who decides what to draw</text>
<text x="190" y="62" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">CPU-driven</text>
<text x="570" y="62" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">GPU-driven</text>
<rect x="20" y="80" width="340" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="108.0" text-anchor="middle" font-size="12" fill="#92400E">CPU culls, 1 call per book</text>
<rect x="20" y="140" width="340" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="168.0" text-anchor="middle" font-size="12" fill="#92400E">Encode draws one by one</text>
<rect x="20" y="200" width="340" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="228.0" text-anchor="middle" font-size="12" fill="#3730A3">GPU renders</text>
<line x1="190" y1="128" x2="190" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-cmp)"/>
<line x1="190" y1="188" x2="190" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-cmp)"/>
<rect x="400" y="80" width="340" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="108.0" text-anchor="middle" font-size="12" fill="#065F46">Compute kernel culls</text>
<rect x="400" y="140" width="340" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="168.0" text-anchor="middle" font-size="12" fill="#065F46">Kernel writes the ICB</text>
<rect x="400" y="200" width="340" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="228.0" text-anchor="middle" font-size="12" fill="#3730A3">Render pass executes the ICB</text>
<line x1="570" y1="128" x2="570" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-cmp)"/>
<line x1="570" y1="188" x2="570" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-cmp)"/>
<rect x="20" y="270" width="720" height="45" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="296.5" text-anchor="middle" font-size="12" fill="#374151">The GPU-driven path moves the per-object loop to the GPU: CPU cost no longer grows with the object count.</text>
</svg>
