<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-machine-learning-in-metal-4-tensor-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">MTLTensor: dimensions, strides and element types</text>
<text x="20" y="60" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">A rank-3 tensor, dimensions [4, 3, 2] (innermost first)</text>
<rect x="40" y="80" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="62" y="100" text-anchor="middle" font-size="11" fill="#3730A3">0,0</text>
<rect x="86" y="80" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="108" y="100" text-anchor="middle" font-size="11" fill="#3730A3">1,0</text>
<rect x="132" y="80" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="154" y="100" text-anchor="middle" font-size="11" fill="#3730A3">2,0</text>
<rect x="178" y="80" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="200" y="100" text-anchor="middle" font-size="11" fill="#3730A3">3,0</text>
<rect x="40" y="112" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="62" y="132" text-anchor="middle" font-size="11" fill="#3730A3">0,1</text>
<rect x="86" y="112" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="108" y="132" text-anchor="middle" font-size="11" fill="#3730A3">1,1</text>
<rect x="132" y="112" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="154" y="132" text-anchor="middle" font-size="11" fill="#3730A3">2,1</text>
<rect x="178" y="112" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="200" y="132" text-anchor="middle" font-size="11" fill="#3730A3">3,1</text>
<rect x="40" y="144" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="62" y="164" text-anchor="middle" font-size="11" fill="#3730A3">0,2</text>
<rect x="86" y="144" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="108" y="164" text-anchor="middle" font-size="11" fill="#3730A3">1,2</text>
<rect x="132" y="144" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="154" y="164" text-anchor="middle" font-size="11" fill="#3730A3">2,2</text>
<rect x="178" y="144" width="44" height="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="200" y="164" text-anchor="middle" font-size="11" fill="#3730A3">3,2</text>
<text x="132" y="190" text-anchor="middle" font-size="11" fill="#374151">dimension 0: 4 (innermost, stride 1)</text>
<text x="132" y="206" text-anchor="middle" font-size="11" fill="#374151">dimension 1: 3 (stride 4)</text>
<text x="132" y="222" text-anchor="middle" font-size="11" fill="#374151">dimension 2: 2 (stride 12, second slice behind)</text>
<rect x="270" y="76" width="200" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="370.0" y="98.8" text-anchor="middle" font-size="11" fill="#3730A3">Standalone tensor</text>
<text x="370.0" y="112.8" text-anchor="middle" font-size="11" fill="#3730A3">device.makeTensor(descriptor:)</text>
<rect x="270" y="140" width="200" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="370.0" y="162.8" text-anchor="middle" font-size="11" fill="#92400E">Buffer-backed tensor</text>
<text x="370.0" y="176.8" text-anchor="middle" font-size="11" fill="#92400E">buffer.makeTensor(...)</text>
<rect x="270" y="204" width="200" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="370.0" y="220.8" text-anchor="middle" font-size="11" fill="#065F46">Bound by gpuResourceID</text>
<text x="370.0" y="234.8" text-anchor="middle" font-size="11" fill="#065F46">in an argument table</text>
<rect x="500" y="76" width="240" height="168" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="620" y="98" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Element types (MTLTensorDataType)</text>
<text x="620" y="122" text-anchor="middle" font-size="11" fill="#374151">float32, float16, bfloat16</text>
<text x="620" y="144" text-anchor="middle" font-size="11" fill="#374151">int32, int16, int8</text>
<text x="620" y="166" text-anchor="middle" font-size="11" fill="#374151">int4, int2 (packed)</text>
<text x="620" y="188" text-anchor="middle" font-size="11" fill="#374151">metalFloat8e4m3, e5m2</text>
<text x="620" y="210" text-anchor="middle" font-size="11" fill="#374151">metalFloat8ue8m0, metalFloat4e2m1</text>
<rect x="20" y="262" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">MTLTensorUsage options: compute, render, machineLearning. Choose the ones the tensor will really be used for.</text>
<text x="380.0" y="297.9" text-anchor="middle" font-size="11" fill="#374151">Mixing uses is allowed, but only declare what you need.</text>
</svg>
