<svg viewBox="0 0 1100 546" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Where Jakarta Faces events fire in the request processing lifecycle</title>
  <desc id="d">The six lifecycle phases as columns and three rows: phase events that wrap every phase, application events such as ActionEvent and ValueChangeEvent that are queued and broadcast at the end of a phase, and system events such as PreValidateEvent and PreRenderViewEvent that are published immediately.</desc>
  <rect x="0" y="0" width="1100" height="546" fill="#ffffff"/>
  <text x="550" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Phase events, application events and system events along one postback</text>
  <text x="550" y="48" font-size="12" fill="#666666" text-anchor="middle">Faces 4.1 standard events; an initial request runs only Restore View and Render Response</text>
  <text x="130" y="114" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">Phase</text>
  <text x="130" y="182" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">Phase events</text>
  <text x="130" y="275" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">Application events</text>
  <text x="130" y="415" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">System events</text>
  <rect x="140" y="78" width="154" height="64" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <circle cx="156" cy="94" r="10" fill="#1a4f8b"/>
  <text x="156" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="217" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Restore View</text>
  <rect x="140" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="217" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="217" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="140" y="212" width="154" height="118" rx="6" fill="#e3effc" fill-opacity="0.55" stroke="#1a4f8b" stroke-width="1.2"/>
  <text x="217" y="257" font-size="11" fill="#222222" text-anchor="middle">(none queued)</text>
  <rect x="140" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#1a4f8b" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="217" y="364" font-size="11" fill="#222222" text-anchor="middle">PostAddToViewEvent</text>
  <text x="217" y="382" font-size="11" fill="#222222" text-anchor="middle">(view rebuilt on a</text>
  <text x="217" y="400" font-size="11" fill="#222222" text-anchor="middle">postback)</text>
  <text x="217" y="418" font-size="11" fill="#222222" text-anchor="middle">PostRestoreStateEvent</text>
  <line x1="294" y1="110" x2="298" y2="110" stroke="#333333" stroke-width="2"/>
  <rect x="298" y="78" width="154" height="64" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <circle cx="314" cy="94" r="10" fill="#1e6b34"/>
  <text x="314" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="375" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Apply Request Values</text>
  <rect x="298" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="375" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="375" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="298" y="212" width="154" height="118" rx="6" fill="#e6f4ea" fill-opacity="0.55" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="375" y="236" font-size="11" fill="#222222" text-anchor="middle">ActionEvent and</text>
  <text x="375" y="253" font-size="11" fill="#222222" text-anchor="middle">ValueChangeEvent of</text>
  <text x="375" y="270" font-size="11" fill="#222222" text-anchor="middle">immediate=true</text>
  <text x="375" y="287" font-size="11" fill="#222222" text-anchor="middle">components</text>
  <rect x="298" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#1e6b34" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="375" y="382" font-size="11" fill="#222222" text-anchor="middle">(none standard)</text>
  <line x1="452" y1="110" x2="456" y2="110" stroke="#333333" stroke-width="2"/>
  <rect x="456" y="78" width="154" height="64" rx="6" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <circle cx="472" cy="94" r="10" fill="#8a6a00"/>
  <text x="472" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="533" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Process Validations</text>
  <rect x="456" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="533" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="533" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="456" y="212" width="154" height="118" rx="6" fill="#fff4d6" fill-opacity="0.55" stroke="#8a6a00" stroke-width="1.2"/>
  <text x="533" y="236" font-size="11" fill="#222222" text-anchor="middle">ValueChangeEvent</text>
  <text x="533" y="253" font-size="11" fill="#222222" text-anchor="middle">(non-immediate)</text>
  <text x="533" y="270" font-size="11" fill="#222222" text-anchor="middle">broadcast at the end</text>
  <text x="533" y="287" font-size="11" fill="#222222" text-anchor="middle">of the phase</text>
  <rect x="456" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#8a6a00" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="533" y="364" font-size="11" fill="#222222" text-anchor="middle">PreValidateEvent</text>
  <text x="533" y="382" font-size="11" fill="#222222" text-anchor="middle">PostValidateEvent</text>
  <text x="533" y="400" font-size="11" fill="#222222" text-anchor="middle">(per component,</text>
  <text x="533" y="418" font-size="11" fill="#222222" text-anchor="middle">children in between)</text>
  <line x1="610" y1="110" x2="614" y2="110" stroke="#333333" stroke-width="2"/>
  <rect x="614" y="78" width="154" height="64" rx="6" fill="#f3e5f5" stroke="#6a2c7a" stroke-width="1.6"/>
  <circle cx="630" cy="94" r="10" fill="#6a2c7a"/>
  <text x="630" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="691" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Update Model Values</text>
  <rect x="614" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="691" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="691" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="614" y="212" width="154" height="118" rx="6" fill="#f3e5f5" fill-opacity="0.55" stroke="#6a2c7a" stroke-width="1.2"/>
  <text x="691" y="240" font-size="11" fill="#222222" text-anchor="middle">(none queued)</text>
  <rect x="614" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#6a2c7a" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="691" y="364" font-size="11" fill="#222222" text-anchor="middle">(none standard)</text>
  <line x1="768" y1="110" x2="772" y2="110" stroke="#333333" stroke-width="2"/>
  <rect x="772" y="78" width="154" height="64" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <circle cx="788" cy="94" r="10" fill="#1a4f8b"/>
  <text x="788" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="849" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Invoke Application</text>
  <rect x="772" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="849" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="849" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="772" y="212" width="154" height="118" rx="6" fill="#e3effc" fill-opacity="0.55" stroke="#1a4f8b" stroke-width="1.2"/>
  <text x="849" y="236" font-size="11" fill="#222222" text-anchor="middle">ActionEvent,</text>
  <text x="849" y="253" font-size="11" fill="#222222" text-anchor="middle">AjaxBehaviorEvent:</text>
  <text x="849" y="270" font-size="11" fill="#222222" text-anchor="middle">actionListener, nested</text>
  <text x="849" y="287" font-size="11" fill="#222222" text-anchor="middle">listeners, then action</text>
  <rect x="772" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#1a4f8b" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="849" y="364" font-size="11" fill="#222222" text-anchor="middle">PreDestroyViewMapEvent</text>
  <text x="849" y="382" font-size="11" fill="#222222" text-anchor="middle">(when navigation</text>
  <text x="849" y="400" font-size="11" fill="#222222" text-anchor="middle">leaves a view)</text>
  <line x1="926" y1="110" x2="930" y2="110" stroke="#333333" stroke-width="2"/>
  <rect x="930" y="78" width="154" height="64" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <circle cx="946" cy="94" r="10" fill="#1e6b34"/>
  <text x="946" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1007" y="125" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Render Response</text>
  <rect x="930" y="150" width="154" height="56" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="1007" y="172" font-size="11" fill="#333333" text-anchor="middle">beforePhase()</text>
  <text x="1007" y="190" font-size="11" fill="#333333" text-anchor="middle">afterPhase()</text>
  <rect x="930" y="212" width="154" height="118" rx="6" fill="#e6f4ea" fill-opacity="0.55" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="1007" y="240" font-size="11" fill="#222222" text-anchor="middle">(none queued)</text>
  <rect x="930" y="336" width="154" height="150" rx="6" fill="#ffffff" stroke="#1e6b34" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="1007" y="364" font-size="11" fill="#222222" text-anchor="middle">PostAddToViewEvent</text>
  <text x="1007" y="382" font-size="11" fill="#222222" text-anchor="middle">(initial request)</text>
  <text x="1007" y="400" font-size="11" fill="#222222" text-anchor="middle">PreRenderViewEvent</text>
  <text x="1007" y="418" font-size="11" fill="#222222" text-anchor="middle">PreRenderComponentEvent</text>
  <text x="1007" y="436" font-size="11" fill="#222222" text-anchor="middle">PostRenderViewEvent</text>
  <text x="140" y="514" font-size="11" fill="#444444">Application events are queued and broadcast to listeners when the phase ends. System events are published at once with Application.publishEvent().</text>
  <text x="140" y="530" font-size="11" fill="#444444">PhaseListeners are called around every phase; a system event listener sees the phase through FacesContext.getCurrentPhaseId().</text>
</svg>
