<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-icb-struct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">An indirect command buffer filled by a compute kernel</text>
<rect x="20" y="55" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130.0" y="86.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">1  Compute pass</text>
<text x="130.0" y="101.0" text-anchor="middle" font-size="11" fill="#92400E">culls books and writes draw commands</text>
<rect x="270" y="55" width="220" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="86.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">2  Render pass</text>
<text x="380.0" y="101.0" text-anchor="middle" font-size="11" fill="#3730A3">executeCommands(buffer:range:)</text>
<rect x="520" y="55" width="220" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="86.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">3  Rasteriser</text>
<text x="630.0" y="101.0" text-anchor="middle" font-size="11" fill="#065F46">written commands draw</text>
<line x1="240" y1="90" x2="270" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-struct)"/>
<line x1="490" y1="90" x2="520" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-icb-struct)"/>
<text x="380" y="160" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MTLIndirectCommandBuffer: one slot per book</text>
<rect x="40" y="175" width="65" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="72.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 0</text>
<text x="72.5" y="221.0" text-anchor="middle" font-size="11" fill="#065F46">draw</text>
<rect x="115" y="175" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="147.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 1</text>
<text x="147.5" y="221.0" text-anchor="middle" font-size="11" fill="#6B7280">empty</text>
<rect x="190" y="175" width="65" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="222.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 2</text>
<text x="222.5" y="221.0" text-anchor="middle" font-size="11" fill="#065F46">draw</text>
<rect x="265" y="175" width="65" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="297.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 3</text>
<text x="297.5" y="221.0" text-anchor="middle" font-size="11" fill="#065F46">draw</text>
<rect x="340" y="175" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="372.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 4</text>
<text x="372.5" y="221.0" text-anchor="middle" font-size="11" fill="#6B7280">empty</text>
<rect x="415" y="175" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="447.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 5</text>
<text x="447.5" y="221.0" text-anchor="middle" font-size="11" fill="#6B7280">empty</text>
<rect x="490" y="175" width="65" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="522.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 6</text>
<text x="522.5" y="221.0" text-anchor="middle" font-size="11" fill="#065F46">draw</text>
<rect x="565" y="175" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="597.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 7</text>
<text x="597.5" y="221.0" text-anchor="middle" font-size="11" fill="#6B7280">empty</text>
<rect x="640" y="175" width="65" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="672.5" y="206.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">slot 8</text>
<text x="672.5" y="221.0" text-anchor="middle" font-size="11" fill="#065F46">draw</text>
<line x1="130" y1="125" x2="130" y2="170" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-icb-struct)"/>
<rect x="20" y="270" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="301.0" text-anchor="middle" font-size="11" fill="#374151">Each written slot holds: set buffers, then draw_indexed_primitives(...).</text>
<text x="380.0" y="316.0" text-anchor="middle" font-size="11" fill="#374151">Reset the range before the compute pass; optimizeCommands removes empty slots so the GPU does not skip them one by one.</text>
</svg>
