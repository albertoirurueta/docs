<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Distributed authority</text>
<rect x="250" y="60" width="260" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="90.0" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Central state service</text>
<text x="380.0" y="105.0" text-anchor="middle" font-size="11" fill="#92400E">routes messages, keeps minimal state</text>
<rect x="40" y="230" width="180" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="252.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Client A</text>
<text x="130.0" y="267.5" text-anchor="middle" font-size="11" fill="#3730A3">simulates what it owns</text>
<text x="130.0" y="282.5" text-anchor="middle" font-size="11" fill="#3730A3">owns Book 1, 2</text>
<line x1="122" y1="229" x2="292" y2="131" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-da)"/>
<line x1="308" y1="131" x2="138" y2="229" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-da)"/>
<rect x="290" y="230" width="180" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="252.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Client B</text>
<text x="380.0" y="267.5" text-anchor="middle" font-size="11" fill="#3730A3">simulates what it owns</text>
<text x="380.0" y="282.5" text-anchor="middle" font-size="11" fill="#3730A3">owns Book 3, session owner</text>
<line x1="372" y1="229" x2="372" y2="131" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-da)"/>
<line x1="388" y1="131" x2="388" y2="229" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-da)"/>
<rect x="540" y="230" width="180" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="252.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Client C</text>
<text x="630.0" y="267.5" text-anchor="middle" font-size="11" fill="#3730A3">simulates what it owns</text>
<text x="630.0" y="282.5" text-anchor="middle" font-size="11" fill="#3730A3">owns Book 4</text>
<line x1="622" y1="229" x2="452" y2="131" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-da)"/>
<line x1="468" y1="131" x2="638" y2="229" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-da)"/>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Each client has authority over the objects it owns; ownership can move between clients</text>
<text x="380" y="348" text-anchor="middle" font-size="11" fill="#374151">Cheaper to run, but every client must be trusted</text>
</svg>
