<line x1="496" y1="172" x2="510" y2="172" stroke="#047857" stroke-width="1.8" marker-end="url(#d4)"/>
<line x1="530" y1="160" x2="530" y2="130" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#d4)"/>
