<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-transforms-and-cameras-rotating-book-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the rotating book example</text>
<rect x="20" y="50" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="105.0" y="245" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Model matrix</text>
<text x="105.0" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">rotate the book about Y</text>
<rect x="204" y="50" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="220" cy="66" r="11" fill="#4F46E5"/>
<text x="220" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="289.0" y="245" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">View matrix</text>
<text x="289.0" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">camera orbits with the pointer</text>
<rect x="388" y="50" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="66" r="11" fill="#4F46E5"/>
<text x="404" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="473.0" y="245" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Projection</text>
<text x="473.0" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">P toggles the projection</text>
<rect x="572" y="50" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="588" cy="66" r="11" fill="#4F46E5"/>
<text x="588" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="657.0" y="245" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Viewport</text>
<text x="657.0" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">resize updates aspect</text>
<rect x="80.0" y="100" width="50" height="70" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="140" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">book</text>
<path d="M 55.0 95 A 55 22 0 0 1 155.0 95" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-webgl-transforms-and-cameras-rotating-book-storyboard)"/>
<text x="105.0" y="195" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">M = Ry(angle)</text>
<circle cx="289.0" cy="140" r="48" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="277.0" y="128" width="24" height="24" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<polygon points="323.0,92 341.0,100 329.0,114" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="327.0" y1="106" x2="303.0" y2="132" stroke="#4F46E5" stroke-width="1.2" marker-end="url(#ah-webgl-transforms-and-cameras-rotating-book-storyboard)"/>
<text x="289.0" y="205" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">lookAt(eye, target, up)</text>
<polygon points="403.0,125 463.0,105 463.0,165" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<rect x="483.0" y="105" width="58" height="60" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="438.0" y="185" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">persp.</text>
<text x="512.0" y="185" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">ortho</text>
<rect x="597.0" y="100" width="120" height="70" rx="3" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<line x1="597.0" y1="182" x2="717.0" y2="182" stroke="#4F46E5" stroke-width="1.2" marker-end="url(#ah-webgl-transforms-and-cameras-rotating-book-storyboard)"/>
<line x1="717.0" y1="182" x2="597.0" y2="182" stroke="#4F46E5" stroke-width="1.2" marker-end="url(#ah-webgl-transforms-and-cameras-rotating-book-storyboard)"/>
<text x="657.0" y="204" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">aspect = w / h</text>
<text x="380" y="300" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Panels 1 to 4 are the four parts of the matrix chain the next sections build one by one.</text>
</svg>
