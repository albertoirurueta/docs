<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two release paths: public app and private team app</text>
  <text x="20" y="66" font-size="13" font-weight="bold" fill="#4F46E5">Public app</text>
  <text x="20" y="226" font-size="13" font-weight="bold" fill="#4F46E5">Private app (Enterprise team)</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="20" y="80" width="118" height="60" rx="8"/><rect x="170" y="80" width="118" height="60" rx="8"/><rect x="320" y="80" width="118" height="60" rx="8"/><rect x="470" y="80" width="118" height="60" rx="8"/>
    <rect x="20" y="240" width="118" height="60" rx="8"/><rect x="170" y="240" width="118" height="60" rx="8"/><rect x="320" y="240" width="150" height="60" rx="8"/>
  </g>
  <rect x="620" y="80" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <rect x="510" y="240" width="140" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <text x="79" y="107">Upload bundle,</text><text x="79" y="123">listing, tests</text>
    <text x="229" y="107">Submit: queue</text><text x="229" y="123">and ticket</text>
    <text x="379" y="107">Canva review</text><text x="379" y="123">team decides</text>
    <text x="529" y="107">Approved:</text><text x="529" y="123">owner releases</text>
    <text x="680" y="107" fill="#92400E">Discoverable in</text><text x="680" y="123" fill="#92400E">the editor</text>
    <text x="79" y="267">Upload bundle,</text><text x="79" y="283">listing details</text>
    <text x="229" y="267">Submit to the</text><text x="229" y="283">team queue</text>
    <text x="395" y="267">Owner or admin</text><text x="395" y="283">approves or rejects</text>
    <text x="580" y="267" fill="#92400E">Available to team</text><text x="580" y="283" fill="#92400E">members at once</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M139,110 L168,110" marker-end="url(#ah)"/><path d="M289,110 L318,110" marker-end="url(#ah)"/><path d="M439,110 L468,110" marker-end="url(#ah)"/><path d="M589,110 L618,110" marker-end="url(#ah)"/>
  <path d="M139,270 L168,270" marker-end="url(#ah)"/><path d="M289,270 L318,270" marker-end="url(#ah)"/><path d="M471,270 L508,270" marker-end="url(#ah)"/></g>
  <text x="380" y="176" font-size="12" fill="#374151" text-anchor="middle">Rejected: create a new version, fix, resubmit (at most two versions per app)</text>
  <path d="M379,142 L379,162" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="380" y="196" font-size="12" fill="#374151" text-anchor="middle">Public apps reach the Apps Marketplace only after Canva adds them; private apps never do</text>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic release flow, not a screenshot of any product.</text>
</svg>
