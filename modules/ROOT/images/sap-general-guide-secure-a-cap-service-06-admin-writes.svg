<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 318" width="1080" height="318" role="img" aria-labelledby="sap-general-guide-secure-a-cap-service-06-admin-writes-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-secure-a-cap-service-06-admin-writes-title">Terminal with four curl calls: a PATCH as alice answers HTTP 200; an approve call as bob answers the error Forbidden with code 403 and HTTP 403; the same approve call as alice answers HTTP 204; a read as alice shows the claim Train ticket with the status A and the amount 50.00; callouts 14 to 17 mark the four calls in order</title>
<g><rect x="0" y="0" width="1080" height="318" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="286" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w 'HTTP %{http_code}\n' -u alice: -X PATCH -H 'Content-Type: application/json' -d '{&quot;amount&quot;:50}' &quot;$CLAIM&quot;</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 200</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' -u bob: -X POST -H 'Content-Type: application/json' -d '{}' \</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    &quot;$CLAIM/ClaimsService.approve&quot;</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;error&quot;:{&quot;message&quot;:&quot;Forbidden&quot;,&quot;code&quot;:&quot;403&quot;,&quot;@Common.numericSeverity&quot;:4}}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 403</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w 'HTTP %{http_code}\n' -u alice: -X POST -H 'Content-Type: application/json' -d '{}' \</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    &quot;$CLAIM/ClaimsService.approve&quot;</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">HTTP 204</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -u alice: &quot;$CLAIM?\$select=title,status,amount&quot;</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims/$entity&quot;,&quot;title&quot;:&quot;Train ticket&quot;,&quot;status&quot;:&quot;A&quot;,&quot;amount&quot;:&quot;50.00&quot;,</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;ID&quot;:&quot;11111111-1111-1111-1111-111111111111&quot;}</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">14</text></g>
<rect x="5" y="88" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="88" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="93" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">15</text></g>
<rect x="5" y="172" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="172" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="177" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">16</text></g>
<rect x="5" y="235" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="235" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="240" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">17</text></g></g>
</svg>
