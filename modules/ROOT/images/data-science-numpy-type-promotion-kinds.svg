<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">NumPy type promotion kinds</title>
<desc id="d">Booleans promote to integers, integers to floats and floats to complex numbers. Within a kind, the wider type wins. Python int, float and complex scalars are weak: they take the array dtype when their kind is not higher.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="30" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Promotion follows the kind, then the width</text>
<text x="20" y="87" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">bool</text>
<rect x="100" y="60" width="106" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="153" y="85" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">bool</text>
<text x="20" y="149" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">unsigned</text>
<rect x="100" y="122" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="153" y="147" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">uint8</text>
<rect x="218" y="122" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="271" y="147" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">uint16</text>
<line x1="206" y1="141" x2="218" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="336" y="122" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="389" y="147" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">uint32</text>
<line x1="324" y1="141" x2="336" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="454" y="122" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="507" y="147" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">uint64</text>
<line x1="442" y1="141" x2="454" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="211" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">signed</text>
<rect x="100" y="184" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="153" y="209" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">int8</text>
<rect x="218" y="184" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="271" y="209" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">int16</text>
<line x1="206" y1="203" x2="218" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="336" y="184" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="389" y="209" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">int32</text>
<line x1="324" y1="203" x2="336" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="454" y="184" width="106" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="507" y="209" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">int64</text>
<line x1="442" y1="203" x2="454" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="273" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">float</text>
<rect x="100" y="246" width="106" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="153" y="271" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">float16</text>
<rect x="218" y="246" width="106" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="271" y="271" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">float32</text>
<line x1="206" y1="265" x2="218" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="336" y="246" width="106" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="389" y="271" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">float64</text>
<line x1="324" y1="265" x2="336" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="335" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">complex</text>
<rect x="100" y="308" width="106" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="153" y="333" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">complex64</text>
<rect x="218" y="308" width="106" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="271" y="333" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">complex128</text>
<line x1="206" y1="327" x2="218" y2="327" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="153" y1="98" x2="153" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="153" y1="160" x2="153" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="153" y1="222" x2="153" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="153" y1="284" x2="153" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="590" y="60" width="116" height="290" rx="8" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
<text x="648" y="82" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">weak Python</text>
<text x="648" y="98" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">scalars</text>
<rect x="606" y="116" width="84" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 3"/>
<text x="648" y="141" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">int</text>
<rect x="606" y="176" width="84" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
<text x="648" y="201" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">float</text>
<rect x="606" y="236" width="84" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" stroke-dasharray="4 3"/>
<text x="648" y="261" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">complex</text>
<text x="360" y="380" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Mixed kinds meet in the next kind up that holds both, e.g. int64 + float32 = float64; uint64 + int64 = float64.</text>
</svg>
