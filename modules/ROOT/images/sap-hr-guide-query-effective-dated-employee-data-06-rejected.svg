<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 234" width="1080" height="234" role="img" aria-labelledby="sap-hr-guide-query-effective-dated-employee-data-06-rejected-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-query-effective-dated-employee-data-06-rejected-title">Terminal with two curl commands that the service rejects with HTTP 400: asOfDate together with fromDate and toDate is answered with the message Use asOfDate or fromDate with toDate, not both (callout 14), and asOfDate=30.06.2025 is answered with the message asOfDate must be a date written YYYY-MM-DD (callout 15)</title>
<g><rect x="0" y="0" width="1080" height="234" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="202" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' 'http://localhost:4004/odata/v4/people/OrganizationalAssignments?asOfDate=2025-06</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">-30&amp;fromDate=2025-01-01&amp;toDate=2025-12-31'</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">{&quot;error&quot;:{&quot;message&quot;:&quot;Use asOfDate or fromDate with toDate, not both&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeverity&quot;:4}}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">HTTP 400</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w '\nHTTP %{http_code}\n' 'http://localhost:4004/odata/v4/people/OrganizationalAssignments?asOfDate=30.06.2</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">025'</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">{&quot;error&quot;:{&quot;message&quot;:&quot;asOfDate must be a date written YYYY-MM-DD&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeverity&quot;:4}}</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">HTTP 400</text>
<rect x="5" y="46" width="1042" height="86" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">14</text></g>
<rect x="5" y="130" width="1042" height="86" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="130" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">15</text></g></g>
</svg>
