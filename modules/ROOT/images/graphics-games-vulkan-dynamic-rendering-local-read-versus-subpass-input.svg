<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dr-lr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Subpass input attachments become local reads</text>
<rect x="20" y="50" width="340" height="28" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="67.5" text-anchor="middle" font-size="13" fill="#374151">Render pass with two subpasses</text>
<rect x="400" y="50" width="340" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="570.0" y="67.5" text-anchor="middle" font-size="13" fill="#3730A3">One rendering instance, Vulkan 1.4</text>
<rect x="40" y="95" width="150" height="95" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="115.0" y="130.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Subpass 0</text>
<text x="115.0" y="145.0" text-anchor="middle" font-size="11" fill="#374151">writes albedo and</text>
<text x="115.0" y="160.0" text-anchor="middle" font-size="11" fill="#374151">normal attachments</text>
<rect x="210" y="95" width="150" height="95" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="130.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Subpass 1</text>
<text x="285.0" y="145.0" text-anchor="middle" font-size="11" fill="#374151">subpassLoad of the</text>
<text x="285.0" y="160.0" text-anchor="middle" font-size="11" fill="#374151">input attachments</text>
<line x1="190" y1="142" x2="208" y2="142" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-lr)"/>
<text x="200" y="212" text-anchor="middle" font-size="11" fill="#92400E">subpass dependency, BY_REGION</text>
<rect x="420" y="95" width="150" height="95" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="495.0" y="122.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Draw A</text>
<text x="495.0" y="137.5" text-anchor="middle" font-size="11" fill="#3730A3">fragment shader writes</text>
<text x="495.0" y="152.5" text-anchor="middle" font-size="11" fill="#3730A3">colour attachments 0</text>
<text x="495.0" y="167.5" text-anchor="middle" font-size="11" fill="#3730A3">and 1</text>
<rect x="590" y="95" width="150" height="95" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="665.0" y="122.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Draw B</text>
<text x="665.0" y="137.5" text-anchor="middle" font-size="11" fill="#3730A3">reads the same pixel</text>
<text x="665.0" y="152.5" text-anchor="middle" font-size="11" fill="#3730A3">through input</text>
<text x="665.0" y="167.5" text-anchor="middle" font-size="11" fill="#3730A3">attachments</text>
<line x1="570" y1="142" x2="588" y2="142" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-lr)"/>
<text x="580" y="212" text-anchor="middle" font-size="11" fill="#047857">barrier BY_REGION, no layout change</text>
<rect x="40" y="235" width="320" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="257.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Objects needed</text>
<text x="200.0" y="272.5" text-anchor="middle" font-size="11" fill="#374151">VkRenderPass, VkFramebuffer, subpass index in</text>
<text x="200.0" y="287.5" text-anchor="middle" font-size="11" fill="#374151">the pipeline</text>
<rect x="420" y="235" width="320" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580.0" y="265.0" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Layout needed</text>
<text x="580.0" y="280.0" text-anchor="middle" font-size="11" fill="#065F46">RENDERING_LOCAL_READ or GENERAL</text>
<rect x="40" y="320" width="700" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390.0" y="342.5" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Remapping commands (core 1.4)</text>
<text x="390.0" y="357.5" text-anchor="middle" font-size="11" fill="#92400E">vkCmdSetRenderingAttachmentLocations remaps colour outputs; vkCmdSetRenderingInputAttachmentIndices remaps</text>
<text x="390.0" y="372.5" text-anchor="middle" font-size="11" fill="#92400E">which attachment each input index reads</text>
</svg>
