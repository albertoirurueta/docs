<svg viewBox="0 0 1096 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Jakarta Faces request processing lifecycle with its short-circuit paths</title>
  <desc id="d">Six phases from Restore View to Render Response. An initial request jumps from Restore View to Render Response. Conversion or validation errors and renderResponse() jump to Render Response. responseComplete() ends the lifecycle without rendering.</desc>
  <defs>
    <marker id="ar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a4f8b"/></marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a12622"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4530a"/></marker>
  </defs>
  <rect x="0" y="0" width="1096" height="520" fill="#ffffff"/>
  <text x="548" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Request processing lifecycle of a postback and its short-circuit paths</text>
  <text x="548" y="48" font-size="12" fill="#666666" text-anchor="middle">PhaseListener.beforePhase() and afterPhase() fire around each of the six boxes</text>
  <rect x="40" y="130" width="156" height="104" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <circle cx="58" cy="148" r="11" fill="#1a4f8b"/>
  <text x="58" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="118" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Restore View</text>
  <text x="118" y="201" font-size="11" fill="#444444" text-anchor="middle">build or restore</text>
  <text x="118" y="216" font-size="11" fill="#444444" text-anchor="middle">the component tree</text>
  <text x="118" y="231" font-size="11" fill="#444444" text-anchor="middle">(initial: new view)</text>
  <line x1="196" y1="182" x2="210" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <rect x="212" y="130" width="156" height="104" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <circle cx="230" cy="148" r="11" fill="#1e6b34"/>
  <text x="230" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="290" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Apply Request Values</text>
  <text x="290" y="201" font-size="11" fill="#444444" text-anchor="middle">decode() stores the</text>
  <text x="290" y="216" font-size="11" fill="#444444" text-anchor="middle">submitted values;</text>
  <text x="290" y="231" font-size="11" fill="#444444" text-anchor="middle">immediate acts here</text>
  <line x1="368" y1="182" x2="382" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <rect x="384" y="130" width="156" height="104" rx="6" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <circle cx="402" cy="148" r="11" fill="#8a6a00"/>
  <text x="402" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="462" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Process Validations</text>
  <text x="462" y="201" font-size="11" fill="#444444" text-anchor="middle">convert, validate,</text>
  <text x="462" y="216" font-size="11" fill="#444444" text-anchor="middle">ValueChangeEvents</text>
  <text x="462" y="231" font-size="11" fill="#444444" text-anchor="middle">(non-immediate)</text>
  <line x1="540" y1="182" x2="554" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <rect x="556" y="130" width="156" height="104" rx="6" fill="#f3e5f5" stroke="#6a2c7a" stroke-width="1.6"/>
  <circle cx="574" cy="148" r="11" fill="#6a2c7a"/>
  <text x="574" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="634" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Update Model Values</text>
  <text x="634" y="201" font-size="11" fill="#444444" text-anchor="middle">write local values</text>
  <text x="634" y="216" font-size="11" fill="#444444" text-anchor="middle">to bean properties</text>
  <line x1="712" y1="182" x2="726" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <rect x="728" y="130" width="156" height="104" rx="6" fill="#e3effc" stroke="#1a4f8b" stroke-width="1.6"/>
  <circle cx="746" cy="148" r="11" fill="#1a4f8b"/>
  <text x="746" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="806" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Invoke Application</text>
  <text x="806" y="201" font-size="11" fill="#444444" text-anchor="middle">action listeners,</text>
  <text x="806" y="216" font-size="11" fill="#444444" text-anchor="middle">actions, navigation</text>
  <line x1="884" y1="182" x2="898" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <rect x="900" y="130" width="156" height="104" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <circle cx="918" cy="148" r="11" fill="#1e6b34"/>
  <text x="918" y="152.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="978" y="182" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Render Response</text>
  <text x="978" y="201" font-size="11" fill="#444444" text-anchor="middle">build view, encode,</text>
  <text x="978" y="216" font-size="11" fill="#444444" text-anchor="middle">save the state</text>
  <line x1="6" y1="182" x2="38" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#ar-k)"/>
  <text x="6" y="172" font-size="10" fill="#444444">request</text>
  <path d="M118,128 L118,100 L978,100 L978,126" fill="none" stroke="#1a4f8b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ar-b)"/>
  <rect x="313" y="85" width="470" height="18" fill="#ffffff"/>
  <text x="548" y="98" font-size="11.5" fill="#1a4f8b" text-anchor="middle">initial request: renderResponse() in phase 1, so only 1 and 6 run (a view with f:metadata runs all six)</text>
  <line x1="260" y1="234" x2="260" y2="270" stroke="#a12622" stroke-width="2"/>
  <line x1="432" y1="234" x2="432" y2="270" stroke="#a12622" stroke-width="2"/>
  <line x1="604" y1="234" x2="604" y2="270" stroke="#a12622" stroke-width="2"/>
  <path d="M260,270 L948,270 L948,238" fill="none" stroke="#a12622" stroke-width="2" marker-end="url(#ar-r)"/>
  <line x1="148" y1="234" x2="148" y2="330" stroke="#b4530a" stroke-width="2"/>
  <line x1="320" y1="234" x2="320" y2="330" stroke="#b4530a" stroke-width="2"/>
  <line x1="492" y1="234" x2="492" y2="330" stroke="#b4530a" stroke-width="2"/>
  <line x1="664" y1="234" x2="664" y2="330" stroke="#b4530a" stroke-width="2"/>
  <line x1="836" y1="234" x2="836" y2="330" stroke="#b4530a" stroke-width="2"/>
  <path d="M148,330 L836,330 L836,366" fill="none" stroke="#b4530a" stroke-width="2" marker-end="url(#ar-o)"/>
  <rect x="330" y="276" width="486" height="20" fill="#ffffff"/>
  <text x="573" y="291" font-size="12" font-weight="bold" fill="#a12622" text-anchor="middle">conversion, validation or update error, or renderResponse(): skip to 6</text>
  <rect x="158" y="336" width="330" height="20" fill="#ffffff"/>
  <text x="323" y="351" font-size="12" font-weight="bold" fill="#b4530a" text-anchor="middle">responseComplete(): stop, nothing is rendered</text>
  <rect x="656" y="368" width="420" height="58" rx="6" fill="#fff0e0" stroke="#b4530a" stroke-width="1.6"/>
  <text x="866" y="392" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Response already written</text>
  <text x="866" y="411" font-size="11" fill="#444444" text-anchor="middle">redirect, file download or any non-Faces response: no Render Response</text>
  <rect x="40" y="372" width="610" height="84" rx="6" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="56" y="394" font-size="13" font-weight="bold" fill="#222222">immediate="true" moves work to phase 2</text>
  <text x="56" y="414" font-size="12" fill="#333333">input: converted and validated there, and its ValueChangeEvent is delivered there</text>
  <text x="56" y="433" font-size="12" fill="#333333">command: its action runs at the end of phase 2, then phases 3, 4 and 5 are skipped</text>
  <text x="56" y="450" font-size="11" fill="#666666">the default ActionListener calls renderResponse(), which skips them</text>
  <line x1="40" y1="490" x2="74" y2="490" stroke="#333333" stroke-width="2.4"/>
  <text x="82" y="494" font-size="12" fill="#333333">normal flow of a postback</text>
  <line x1="281.0" y1="490" x2="315.0" y2="490" stroke="#1a4f8b" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="323.0" y="494" font-size="12" fill="#333333">initial request</text>
  <line x1="456.0" y1="490" x2="490.0" y2="490" stroke="#a12622" stroke-width="2.4"/>
  <text x="498.0" y="494" font-size="12" fill="#333333">failure or renderResponse()</text>
  <line x1="710.2" y1="490" x2="744.2" y2="490" stroke="#b4530a" stroke-width="2.4"/>
  <text x="752.2" y="494" font-size="12" fill="#333333">responseComplete()</text>
</svg>
