<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where Docusaurus search-engine information comes from and where it ends up in the build</title>
  <desc id="d">Four sources on the left feed the build in the middle: front matter and the Head component, site configuration such as themeConfig.metadata and headTags, the unlisted and noIndex switches, and the static directory. The build writes meta tags into each HTML page, a sitemap.xml generated from the routes, and copies robots.txt and other static files unchanged into the output.</desc>
  <rect width="760" height="360" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <text x="30" y="30">You write</text>
    <text x="320" y="30">docusaurus build</text>
    <text x="545" y="30">build/ contains</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="20" y="44" width="250" height="62" rx="8" fill="#cfe3f7"/>
    <text x="32" y="68" font-weight="bold">Front matter and Head</text>
    <text x="32" y="88">title, description, keywords, image</text>
    <rect x="20" y="118" width="250" height="62" rx="8" fill="#cfe3f7"/>
    <text x="32" y="142" font-weight="bold">Site configuration</text>
    <text x="32" y="162">url, baseUrl, metadata, headTags</text>
    <rect x="20" y="192" width="250" height="62" rx="8" fill="#f7e3b5"/>
    <text x="32" y="216" font-weight="bold">Visibility switches</text>
    <text x="32" y="236">unlisted, noIndex, robots meta tag</text>
    <rect x="20" y="266" width="250" height="62" rx="8" fill="#cfeacb"/>
    <text x="32" y="290" font-weight="bold">static/ directory</text>
    <text x="32" y="310">robots.txt, favicon, images, files</text>

    <rect x="300" y="44" width="190" height="284" rx="10" fill="#e6d3f0"/>
    <text x="316" y="80" font-weight="bold">Render every route</text>
    <text x="316" y="100">to static HTML</text>
    <text x="316" y="140" font-weight="bold">plugin-sitemap</text>
    <text x="316" y="160">lists routes, skips routes</text>
    <text x="316" y="178">with a noindex tag</text>
    <text x="316" y="218" font-weight="bold">Copy static files</text>
    <text x="316" y="238">as they are, no hashing</text>
    <text x="316" y="278" font-weight="bold">Bundle imported assets</text>
    <text x="316" y="298">with content hashes</text>

    <rect x="520" y="44" width="220" height="62" rx="8" fill="#cfe3f7"/>
    <text x="532" y="68" font-weight="bold">Meta tags in every page</text>
    <text x="532" y="88">description, og:*, robots, JSON-LD</text>
    <rect x="520" y="118" width="220" height="62" rx="8" fill="#cfe3f7"/>
    <text x="532" y="142" font-weight="bold">sitemap.xml</text>
    <text x="532" y="162">absolute URLs, optional lastmod</text>
    <rect x="520" y="192" width="220" height="62" rx="8" fill="#cfeacb"/>
    <text x="532" y="216" font-weight="bold">robots.txt, .nojekyll, files</text>
    <text x="532" y="236">at the root of the output</text>
    <rect x="520" y="266" width="220" height="62" rx="8" fill="#f7e3b5"/>
    <text x="532" y="290" font-weight="bold">assets/ folder</text>
    <text x="532" y="310">hashed images and downloads</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M272 75 L298 75"/><path d="M272 149 L298 149"/><path d="M272 223 L298 223"/><path d="M272 297 L298 297"/>
    <path d="M492 75 L518 75"/><path d="M492 149 L518 149"/><path d="M492 223 L518 223"/><path d="M492 297 L518 297"/>
  </g>
</svg>
