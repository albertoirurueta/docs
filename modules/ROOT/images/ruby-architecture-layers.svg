<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>The layers of the shelf gem in plain Ruby</title>
  <desc>Four layers of the shelf library catalogue. Presentation (the exe/shelf script, presenters, serializers, parsers and form objects) calls the application layer (service objects such as LendBook, query objects, filter objects and policy objects). The application layer depends on the domain layer (Isbn, Author, Book, Loan and Fine value objects) and on duck-typed ports. The infrastructure layer (store adapters, the in-memory loan repository and the settings read from ENV) implements those ports. A composition root, Shelf::Application, is the only place that builds concrete objects and passes them inward. All source dependencies point toward the domain, which requires nothing outside itself.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Layers of the shelf gem</text>
  <text x="480" y="47" font-size="12" fill="#666666" text-anchor="middle">Plain Ruby classes and modules: no framework, only a convention about who may call whom</text>

  <rect x="40" y="70" width="880" height="92" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="60" y="94" font-size="14" font-weight="bold" fill="#1c4b73">Presentation</text>
  <text x="60" y="114" font-size="12" fill="#444444">translates the outside world to method calls and back</text>
  <text x="60" y="140" font-size="12" font-family="Courier New, monospace" fill="#1c4b73">exe/shelf   BookPresenter   BookCard   BookSerializer   BookParser   NewBookForm</text>

  <rect x="40" y="196" width="540" height="100" rx="6" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="60" y="220" font-size="14" font-weight="bold" fill="#8a4a12">Application</text>
  <text x="60" y="240" font-size="12" fill="#444444">use cases: one callable object per question or command</text>
  <text x="60" y="266" font-size="12" font-family="Courier New, monospace" fill="#8a4a12">LendBook   BooksMatching   SearchFilter   LendingPolicy</text>
  <text x="60" y="284" font-size="12" font-family="Courier New, monospace" fill="#8a4a12">store and loans are injected: any object with the right methods</text>

  <rect x="40" y="330" width="540" height="100" rx="6" fill="#e7f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="60" y="354" font-size="14" font-weight="bold" fill="#1f5a37">Domain</text>
  <text x="60" y="374" font-size="12" fill="#444444">immutable values and rules; requires nothing else in the gem</text>
  <text x="60" y="400" font-size="12" font-family="Courier New, monospace" fill="#1f5a37">Isbn   Author   Book   Fine   Loan</text>
  <text x="60" y="418" font-size="12" font-family="Courier New, monospace" fill="#1f5a37">Data.define value objects, Comparable, no I/O</text>

  <rect x="660" y="196" width="260" height="234" rx="6" fill="#f3ecf8" stroke="#6b3f8f" stroke-width="1.4"/>
  <text x="680" y="220" font-size="14" font-weight="bold" fill="#53307a">Infrastructure</text>
  <text x="680" y="240" font-size="12" fill="#444444">adapters for the outside</text>
  <text x="680" y="272" font-size="12" font-family="Courier New, monospace" fill="#53307a">Store::Memory</text>
  <text x="680" y="292" font-size="12" font-family="Courier New, monospace" fill="#53307a">Store::Legacy</text>
  <text x="680" y="312" font-size="12" font-family="Courier New, monospace" fill="#53307a">Store::Counting</text>
  <text x="680" y="332" font-size="12" font-family="Courier New, monospace" fill="#53307a">Loans::Memory</text>
  <text x="680" y="352" font-size="12" font-family="Courier New, monospace" fill="#53307a">Settings.from_env</text>
  <text x="680" y="384" font-size="12" fill="#444444">implement the ports:</text>
  <text x="680" y="402" font-size="12" font-family="Courier New, monospace" fill="#53307a">all  add  lent?  due_at</text>

  <rect x="40" y="468" width="880" height="52" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="480" y="492" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Composition root: Shelf::Application</text>
  <text x="480" y="510" font-size="12" fill="#444444" text-anchor="middle">the only place that names concrete classes, reads ENV and builds the object graph</text>

  <path d="M310,166 L310,190" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M304,183 L310,191 L316,183" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M310,300 L310,324" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M304,317 L310,325 L316,317" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M655,246 L587,246" stroke="#777777" stroke-width="1.6" stroke-dasharray="5,4" fill="none"/>
  <path d="M595,240 L587,246 L595,252" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M655,380 L587,380" stroke="#777777" stroke-width="1.6" fill="none"/>
  <path d="M595,374 L587,380 L595,386" stroke="#777777" stroke-width="1.6" fill="none"/>

  <text x="320" y="182" font-size="11" fill="#666666">calls</text>
  <text x="320" y="316" font-size="11" fill="#666666">uses</text>
  <text x="621" y="236" font-size="11" fill="#666666" text-anchor="middle">implements</text>
  <text x="621" y="370" font-size="11" fill="#666666" text-anchor="middle">returns Books</text>

  <text x="480" y="552" font-size="12" fill="#666666" text-anchor="middle">Arrows are source dependencies and point inward. The domain requires nothing; the application knows only duck-typed ports.</text>
  <text x="480" y="572" font-size="12" fill="#666666" text-anchor="middle">Dashed arrow: the application never names an infrastructure class; the composition root hands it one.</text>
</svg>
