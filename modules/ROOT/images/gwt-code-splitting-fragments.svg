<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>The fragments GWT code splitting writes for the Bookshelf: initial download, leftovers and exclusive fragments in three configurations</title>
  <desc>Three bands show the same Bookshelf client compiled three ways. Band A, the default: an initial download of 248,679 bytes, then a leftovers fragment of 48,113 bytes that every exclusive fragment needs first, then the exclusive fragments for AdminActivity (6,778 bytes), ReportsModule (391 bytes) and ImportModule (9,930 bytes). Band B: naming AdminActivity in compiler.splitpoint.initial.sequence turns it into an initial fragment of 42,739 bytes that does not wait for the leftovers, which shrink to 12,113 bytes. Band C: with -XfragmentCount 2 the AdminActivity and ReportsModule split points share one merged fragment of 38,859 bytes and the leftovers shrink to 16,383 bytes.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">What the code splitter writes for the Bookshelf</text>
  <text x="24" y="60" text-anchor="start" font-size="12" font-weight="bold" fill="#64748b">A. DEFAULT: EVERY SPLIT POINT GETS AN EXCLUSIVE FRAGMENT</text>
  <rect x="24" y="72" width="200" height="84" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Initial download</text>
  <text x="124" y="114" text-anchor="middle" font-size="12" fill="#1e3a8a">primary .cache.js</text>
  <text x="124" y="131" text-anchor="middle" font-size="12" fill="#1e3a8a">248,679 bytes</text>
  <text x="124" y="148" text-anchor="middle" font-size="12" fill="#1e3a8a">starts the application</text>
  <rect x="272" y="72" width="170" height="84" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="357" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Leftovers (fragment 4)</text>
  <text x="357" y="114" text-anchor="middle" font-size="12" fill="#78350f">48,113 bytes</text>
  <text x="357" y="131" text-anchor="middle" font-size="12" fill="#78350f">code shared by split points</text>
  <rect x="490" y="72" width="140" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="560" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">1 AdminActivity</text>
  <text x="560" y="114" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="560" y="131" text-anchor="middle" font-size="12" fill="#14532d">6,778 bytes</text>
  <rect x="644" y="72" width="140" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="714" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">2 ReportsModule</text>
  <text x="714" y="114" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="714" y="131" text-anchor="middle" font-size="12" fill="#14532d">391 bytes</text>
  <rect x="798" y="72" width="138" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="867" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">3 ImportModule</text>
  <text x="867" y="114" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="867" y="131" text-anchor="middle" font-size="12" fill="#14532d">9,930 bytes</text>
  <line x1="224" y1="114" x2="272" y2="114" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="114" x2="490" y2="114" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="176" x2="936" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="170" x2="490" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <line x1="936" y1="170" x2="936" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <text x="713.0" y="192" text-anchor="middle" font-size="11" fill="#475569">any order, but only after the leftovers have loaded</text>
  <text x="24" y="210" text-anchor="start" font-size="12" font-weight="bold" fill="#64748b">B. INITIAL LOAD SEQUENCE: ADMINACTIVITY</text>
  <rect x="24" y="222" width="200" height="84" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Initial download</text>
  <text x="124" y="264" text-anchor="middle" font-size="12" fill="#1e3a8a">primary .cache.js</text>
  <text x="124" y="281" text-anchor="middle" font-size="12" fill="#1e3a8a">248,672 bytes</text>
  <text x="124" y="298" text-anchor="middle" font-size="12" fill="#1e3a8a">starts the application</text>
  <rect x="272" y="222" width="200" height="84" rx="8" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="372" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">1 AdminActivity</text>
  <text x="372" y="264" text-anchor="middle" font-size="12" fill="#312e81">initial fragment</text>
  <text x="372" y="281" text-anchor="middle" font-size="12" fill="#312e81">42,739 bytes</text>
  <text x="372" y="298" text-anchor="middle" font-size="12" fill="#312e81">needs no leftovers</text>
  <rect x="520" y="222" width="130" height="84" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="585" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Leftovers</text>
  <text x="585" y="264" text-anchor="middle" font-size="12" fill="#78350f">12,113 bytes</text>
  <text x="585" y="281" text-anchor="middle" font-size="12" fill="#78350f">shared code</text>
  <rect x="664" y="222" width="126" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="727" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">2 ReportsModule</text>
  <text x="727" y="264" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="727" y="281" text-anchor="middle" font-size="12" fill="#14532d">391 bytes</text>
  <rect x="804" y="222" width="132" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="870" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">3 ImportModule</text>
  <text x="870" y="264" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="870" y="281" text-anchor="middle" font-size="12" fill="#14532d">9,930 bytes</text>
  <line x1="224" y1="264" x2="272" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="264" x2="520" y2="264" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="664" y1="326" x2="936" y2="326" stroke="#94a3b8" stroke-width="2"/>
  <line x1="664" y1="320" x2="664" y2="326" stroke="#94a3b8" stroke-width="2"/>
  <line x1="936" y1="320" x2="936" y2="326" stroke="#94a3b8" stroke-width="2"/>
  <text x="800.0" y="342" text-anchor="middle" font-size="11" fill="#475569">after the leftovers</text>
  <text x="24" y="360" text-anchor="start" font-size="12" font-weight="bold" fill="#64748b">C. -XFRAGMENTCOUNT 2: SPLIT POINTS 1 AND 2 MERGED</text>
  <rect x="24" y="372" width="200" height="84" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Initial download</text>
  <text x="124" y="414" text-anchor="middle" font-size="12" fill="#1e3a8a">primary .cache.js</text>
  <text x="124" y="431" text-anchor="middle" font-size="12" fill="#1e3a8a">248,679 bytes</text>
  <text x="124" y="448" text-anchor="middle" font-size="12" fill="#1e3a8a">starts the application</text>
  <rect x="272" y="372" width="170" height="84" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="357" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Leftovers</text>
  <text x="357" y="414" text-anchor="middle" font-size="12" fill="#78350f">16,383 bytes</text>
  <text x="357" y="431" text-anchor="middle" font-size="12" fill="#78350f">shared code</text>
  <rect x="490" y="372" width="230" height="84" rx="8" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="605" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">1 AdminActivity + 2 ReportsModule</text>
  <text x="605" y="414" text-anchor="middle" font-size="12" fill="#581c87">one merged fragment</text>
  <text x="605" y="431" text-anchor="middle" font-size="12" fill="#581c87">38,859 bytes</text>
  <rect x="768" y="372" width="168" height="84" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="852" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">3 ImportModule</text>
  <text x="852" y="414" text-anchor="middle" font-size="12" fill="#14532d">exclusive</text>
  <text x="852" y="431" text-anchor="middle" font-size="12" fill="#14532d">9,930 bytes</text>
  <line x1="224" y1="414" x2="272" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="414" x2="490" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="476" x2="936" y2="476" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="470" x2="490" y2="476" stroke="#94a3b8" stroke-width="2"/>
  <line x1="936" y1="470" x2="936" y2="476" stroke="#94a3b8" stroke-width="2"/>
  <text x="713.0" y="492" text-anchor="middle" font-size="11" fill="#475569">one request serves either of the first two screens</text>
  <text x="24" y="506" text-anchor="start" font-size="12" font-weight="bold" fill="#64748b">Reading the figure</text>
  <text x="24" y="526" text-anchor="start" font-size="11" fill="#475569">Boxes are not drawn to scale. Arrows show load order. A dashed arrow means the leftovers are fetched later, once an exclusive fragment is requested.</text>
  <text x="24" y="544" text-anchor="start" font-size="11" fill="#475569">Sizes are the bytes the compile report lists for one permutation (locale en, user.agent safari): Full code size 313,891 bytes in A.</text>
  <text x="24" y="562" text-anchor="start" font-size="11" fill="#475569">Fragment 0 is the primary file; fragments 1 to 3 are the split points in the order the compiler numbered them; the leftovers take the next number.</text>
  <text x="24" y="580" text-anchor="start" font-size="11" fill="#475569">Deferred fragments are written to deferredjs/&lt;strong name&gt;/N.cache.js by the default xsiframe linker.</text>
</svg>
