<text x="660" y="209" text-anchor="middle" font-size="10" fill="#374151">Double-click to preview</text>
<text x="660" y="223" text-anchor="middle" font-size="10" fill="#374151">Export Selected Animations</text>
<text x="380" y="275" text-anchor="middle" font-size="11" fill="#374151">Chain names are matched fuzzily between the two rigs, so they need not be identical;</text>
<text x="380" y="291" text-anchor="middle" font-size="11" fill="#374151">the source and target characters must start from matching reference poses (for example T-pose against A-pose).</text>
