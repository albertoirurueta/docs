<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-rt-idx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How a hit finds its record in the hit region of the SBT</text>
<rect x="30" y="55" width="700" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="89.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">hitRecord = hitRegionStart + hitStride * ( instanceSbtOffset + geometryIndex * sbtRecordStride + sbtRecordOffset )</text>
<rect x="30" y="150" width="175" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="117.5" y="176.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">instanceSbtOffset</text>
<text x="117.5" y="191.8" text-anchor="middle" font-size="11" fill="#92400E">set per instance in the TLAS</text>
<text x="117.5" y="206.8" text-anchor="middle" font-size="11" fill="#92400E">(an instance field)</text>
<line x1="117" y1="150" x2="117" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-idx)"/>
<rect x="205" y="150" width="175" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="292.5" y="176.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">geometryIndex</text>
<text x="292.5" y="191.8" text-anchor="middle" font-size="11" fill="#92400E">position of the geometry</text>
<text x="292.5" y="206.8" text-anchor="middle" font-size="11" fill="#92400E">inside the BLAS</text>
<line x1="292" y1="150" x2="380" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-idx)"/>
<rect x="380" y="150" width="175" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="467.5" y="176.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">sbtRecordStride</text>
<text x="467.5" y="191.8" text-anchor="middle" font-size="11" fill="#92400E">argument of the ray call</text>
<text x="467.5" y="206.8" text-anchor="middle" font-size="11" fill="#92400E">(a trace-ray parameter)</text>
<line x1="467" y1="150" x2="380" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-idx)"/>
<rect x="555" y="150" width="175" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="642.5" y="176.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">sbtRecordOffset</text>
<text x="642.5" y="191.8" text-anchor="middle" font-size="11" fill="#92400E">argument of the ray call</text>
<text x="642.5" y="206.8" text-anchor="middle" font-size="11" fill="#92400E">(a trace-ray parameter)</text>
<line x1="642" y1="150" x2="380" y2="116" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-idx)"/>
<rect x="30" y="260" width="340" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="200.0" y="284.4" text-anchor="middle" font-size="11" fill="#065F46">Miss: missRegionStart + missStride * missIndex</text>
<text x="200.0" y="299.4" text-anchor="middle" font-size="11" fill="#065F46">missIndex is an argument of the ray call</text>
<rect x="390" y="260" width="340" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="560.0" y="284.4" text-anchor="middle" font-size="11" fill="#065F46">Typical Bookshelf setting: 2 ray types (primary, shadow)</text>
<text x="560.0" y="299.4" text-anchor="middle" font-size="11" fill="#065F46">sbtRecordStride = 2, shadow offset = 1</text>
<text x="380" y="342" text-anchor="middle" font-size="11" fill="#374151">Records of one instance are grouped, so the same shader group can serve many instances.</text>
</svg>
