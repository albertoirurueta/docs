<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-in-poll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Polling in Update compared with action callbacks</text>
<rect x="20" y="50" width="350" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="68.5" text-anchor="middle" font-size="13" fill="#3730A3">Polling (Update)</text>
<rect x="390" y="50" width="350" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="68.5" text-anchor="middle" font-size="13" fill="#92400E">Callbacks (started, performed, canceled)</text>
<rect x="40" y="100" width="64" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/>
<text x="72" y="117" text-anchor="middle" font-size="10" fill="#3730A3">frame 1</text>
<line x1="72" y1="126" x2="72" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-poll)"/>
<rect x="40" y="150" width="64" height="36" rx="5" fill="#FFFFFF" stroke="#4B5563"/>
<text x="72" y="165" text-anchor="middle" font-size="10" fill="#374151">ReadValue</text>
<text x="72" y="179" text-anchor="middle" font-size="9" fill="#374151">every frame</text>
<rect x="120" y="100" width="64" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/>
<text x="152" y="117" text-anchor="middle" font-size="10" fill="#3730A3">frame 2</text>
<line x1="152" y1="126" x2="152" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-poll)"/>
<rect x="120" y="150" width="64" height="36" rx="5" fill="#FFFFFF" stroke="#4B5563"/>
<text x="152" y="165" text-anchor="middle" font-size="10" fill="#374151">ReadValue</text>
<text x="152" y="179" text-anchor="middle" font-size="9" fill="#374151">every frame</text>
<rect x="200" y="100" width="64" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/>
<text x="232" y="117" text-anchor="middle" font-size="10" fill="#3730A3">frame 3</text>
<line x1="232" y1="126" x2="232" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-poll)"/>
<rect x="200" y="150" width="64" height="36" rx="5" fill="#FFFFFF" stroke="#4B5563"/>
<text x="232" y="165" text-anchor="middle" font-size="10" fill="#374151">ReadValue</text>
<text x="232" y="179" text-anchor="middle" font-size="9" fill="#374151">every frame</text>
<rect x="280" y="100" width="64" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5"/>
<text x="312" y="117" text-anchor="middle" font-size="10" fill="#3730A3">frame 4</text>
<line x1="312" y1="126" x2="312" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-poll)"/>
<rect x="280" y="150" width="64" height="36" rx="5" fill="#FFFFFF" stroke="#4B5563"/>
<text x="312" y="165" text-anchor="middle" font-size="10" fill="#374151">ReadValue</text>
<text x="312" y="179" text-anchor="middle" font-size="9" fill="#374151">every frame</text>
<text x="195" y="215" text-anchor="middle" font-size="11" fill="#374151">Best for continuous input: movement, look, held buttons.</text>
<text x="195" y="232" text-anchor="middle" font-size="11" fill="#374151">You decide where and when the value is read.</text>
<line x1="390" y1="90" x2="390" y2="330" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="410" y1="150" x2="720" y2="150" stroke="#4B5563" stroke-width="1.2"/>
<circle cx="440" cy="150" r="6" fill="#B45309"/>
<text x="440" y="132" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">started</text>
<circle cx="540" cy="150" r="6" fill="#B45309"/>
<text x="540" y="132" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">performed</text>
<circle cx="650" cy="150" r="6" fill="#B45309"/>
<text x="650" y="132" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">canceled</text>
<text x="550" y="172" text-anchor="middle" font-size="10" fill="#374151">Button down ... held ... released</text>
<rect x="410" y="190" width="310" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="214.0" text-anchor="middle" font-size="11" fill="#374151">Handler runs only when the phase changes;</text>
<text x="565.0" y="229.0" text-anchor="middle" font-size="11" fill="#374151">CallbackContext is valid only inside the handler.</text>
<text x="565" y="265" text-anchor="middle" font-size="11" fill="#374151">Best for discrete events: Grab, Pause, Hold to open the lamp.</text>
<text x="565" y="282" text-anchor="middle" font-size="11" fill="#374151">Unsubscribe in OnDisable to avoid leaks and duplicate calls.</text>
<rect x="20" y="310" width="720" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="333.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Same action, two styles</text>
<text x="380.0" y="348.5" text-anchor="middle" font-size="11" fill="#374151">Both read the same action. The phases follow its interaction: Press, Hold, Tap, SlowTap or MultiTap.</text>
<text x="380.0" y="363.5" text-anchor="middle" font-size="11" fill="#374151">Waiting -&gt; Started -&gt; Performed -&gt; Waiting;  Started -&gt; Canceled when the interaction fails.</text>
</svg>
