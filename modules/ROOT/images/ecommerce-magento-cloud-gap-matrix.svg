<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Which Magento services each cloud manages for you</title>
  <desc id="d">A matrix of seven Magento building blocks against AWS, Google Cloud and Azure. The database is managed on all three clouds. Valkey is managed on AWS and Google Cloud, while Azure offers only Azure Managed Redis, which is Redis Enterprise based and is not on Adobe's tested list. OpenSearch is managed on AWS only; on Google Cloud and Azure it is self-managed with an operator or bought from a marketplace partner. RabbitMQ is managed on AWS as Amazon MQ; on Google Cloud and Azure it is self-managed with the RabbitMQ Cluster Operator or bought from a partner, and the native Pub/Sub and Service Bus services cannot be used. Media uses the S3 driver on AWS, a Filestore or Azure Files shared volume elsewhere, and Google Cloud Storage through its S3 interoperability is untested by Adobe. Varnish and cron are self-run on every cloud.</desc>
  <rect width="960" height="470" rx="14" fill="#2b3a4a"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#f4b860">What each cloud manages for Magento</text>

  <text x="250" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">AWS</text>
  <text x="520" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Google Cloud</text>
  <text x="790" y="68" font-size="14" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Azure</text>

  <text x="24" y="104" font-size="13" font-weight="bold" fill="#9fd3c7">Database</text>
  <rect x="130" y="82" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="250" y="105" font-size="12" fill="#f2f5f8" text-anchor="middle">RDS, Aurora MySQL 3</text>
  <rect x="400" y="82" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="520" y="105" font-size="12" fill="#f2f5f8" text-anchor="middle">Cloud SQL for MySQL 8.4</text>
  <rect x="670" y="82" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="790" y="105" font-size="12" fill="#f2f5f8" text-anchor="middle">Flexible Server for MySQL 8.4</text>

  <text x="24" y="150" font-size="13" font-weight="bold" fill="#9fd3c7">Valkey 9</text>
  <rect x="130" y="128" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="250" y="151" font-size="12" fill="#f2f5f8" text-anchor="middle">ElastiCache for Valkey</text>
  <rect x="400" y="128" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="520" y="151" font-size="12" fill="#f2f5f8" text-anchor="middle">Memorystore for Valkey</text>
  <rect x="670" y="128" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="790" y="151" font-size="12" fill="#f2f5f8" text-anchor="middle">Managed Redis (not Valkey): test</text>

  <text x="24" y="196" font-size="13" font-weight="bold" fill="#9fd3c7">OpenSearch 3</text>
  <rect x="130" y="174" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="250" y="197" font-size="12" fill="#f2f5f8" text-anchor="middle">OpenSearch Service</text>
  <rect x="400" y="174" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="520" y="197" font-size="12" fill="#f2f5f8" text-anchor="middle">Operator or partner: verify</text>
  <rect x="670" y="174" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="790" y="197" font-size="12" fill="#f2f5f8" text-anchor="middle">Operator or partner: verify</text>

  <text x="24" y="242" font-size="13" font-weight="bold" fill="#9fd3c7">RabbitMQ 4.3</text>
  <rect x="130" y="220" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="250" y="243" font-size="12" fill="#f2f5f8" text-anchor="middle">Amazon MQ for RabbitMQ</text>
  <rect x="400" y="220" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="520" y="243" font-size="12" fill="#f2f5f8" text-anchor="middle">Operator or partner (no Pub/Sub)</text>
  <rect x="670" y="220" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="790" y="243" font-size="12" fill="#f2f5f8" text-anchor="middle">Operator or partner (no Service Bus)</text>

  <text x="24" y="288" font-size="13" font-weight="bold" fill="#9fd3c7">Media</text>
  <rect x="130" y="266" width="240" height="36" rx="8" fill="#4d7c5a"/><text x="250" y="289" font-size="12" fill="#f2f5f8" text-anchor="middle">S3 driver, or EFS</text>
  <rect x="400" y="266" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="520" y="289" font-size="12" fill="#f2f5f8" text-anchor="middle">Filestore NFS; GCS S3 interop: test</text>
  <rect x="670" y="266" width="240" height="36" rx="8" fill="#7a5c3a"/><text x="790" y="289" font-size="12" fill="#f2f5f8" text-anchor="middle">Azure Files NFS; no S3 API</text>

  <text x="24" y="334" font-size="13" font-weight="bold" fill="#9fd3c7">Varnish</text>
  <rect x="130" y="312" width="780" height="36" rx="8" fill="#6f8aa3"/><text x="520" y="335" font-size="12" fill="#f2f5f8" text-anchor="middle">You run it on every cloud: a StatefulSet, a task group or an instance group, plus the purge list</text>

  <text x="24" y="380" font-size="13" font-weight="bold" fill="#9fd3c7">Cron, workers</text>
  <rect x="130" y="358" width="780" height="36" rx="8" fill="#6f8aa3"/><text x="520" y="381" font-size="12" fill="#f2f5f8" text-anchor="middle">You run them on every cloud: one scheduler, consumer workers, no managed equivalent</text>

  <rect x="130" y="414" width="18" height="18" rx="4" fill="#4d7c5a"/><text x="156" y="428" font-size="12" fill="#f2f5f8">managed, on Adobe's tested list</text>
  <rect x="380" y="414" width="18" height="18" rx="4" fill="#7a5c3a"/><text x="406" y="428" font-size="12" fill="#f2f5f8">self-run, partner or untested: verify</text>
  <rect x="650" y="414" width="18" height="18" rx="4" fill="#6f8aa3"/><text x="676" y="428" font-size="12" fill="#f2f5f8">always your job</text>
</svg>
