<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Two ways to publish a Docusaurus site on GitHub Pages</title>
  <desc id="d">The top row shows the branch flow: the docusaurus deploy command builds the site, commits the output to the gh-pages branch and GitHub Pages serves that branch. The bottom row shows the artifact flow: a workflow builds the site, uploads the build folder as a Pages artifact and a deploy job publishes it.</desc>
  <rect width="760" height="300" rx="12" fill="#2b3a4a"/>
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <text x="24" y="30">Branch flow (docusaurus deploy)</text>
    <text x="24" y="170">Artifact flow (Actions)</text>
  </g>
  <g font-size="12" fill="#1b2733">
    <rect x="24" y="44" width="150" height="80" rx="8" fill="#cfe3f7"/>
    <text x="36" y="70" font-weight="bold">Source branch</text>
    <text x="36" y="90">main, with sources</text>
    <text x="36" y="108">and static/</text>
    <rect x="214" y="44" width="150" height="80" rx="8" fill="#f7e3b5"/>
    <text x="226" y="70" font-weight="bold">deploy command</text>
    <text x="226" y="90">build, clone, copy,</text>
    <text x="226" y="108">commit, force push</text>
    <rect x="404" y="44" width="150" height="80" rx="8" fill="#cfeacb"/>
    <text x="416" y="70" font-weight="bold">gh-pages branch</text>
    <text x="416" y="90">only the built files,</text>
    <text x="416" y="108">needs .nojekyll</text>
    <rect x="594" y="44" width="142" height="80" rx="8" fill="#e4d4f4"/>
    <text x="606" y="70" font-weight="bold">GitHub Pages</text>
    <text x="606" y="90">source: branch and</text>
    <text x="606" y="108">folder root</text>
    <rect x="24" y="184" width="150" height="80" rx="8" fill="#cfe3f7"/>
    <text x="36" y="210" font-weight="bold">Push to main</text>
    <text x="36" y="230">workflow starts,</text>
    <text x="36" y="248">no extra branch</text>
    <rect x="214" y="184" width="150" height="80" rx="8" fill="#f7e3b5"/>
    <text x="226" y="210" font-weight="bold">build job</text>
    <text x="226" y="230">npm ci, npm run build,</text>
    <text x="226" y="248">upload build folder</text>
    <rect x="404" y="184" width="150" height="80" rx="8" fill="#cfeacb"/>
    <text x="416" y="210" font-weight="bold">deploy job</text>
    <text x="416" y="230">pages: write and</text>
    <text x="416" y="248">id-token: write</text>
    <rect x="594" y="184" width="142" height="80" rx="8" fill="#e4d4f4"/>
    <text x="606" y="210" font-weight="bold">GitHub Pages</text>
    <text x="606" y="230">source: GitHub</text>
    <text x="606" y="248">Actions</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="#ffffff">
    <path d="M174 84 H206 M364 84 H396 M554 84 H586"/>
    <path d="M174 224 H206 M364 224 H396 M554 224 H586"/>
    <path d="M206 84 l-8 -5 v10 z M396 84 l-8 -5 v10 z M586 84 l-8 -5 v10 z"/>
    <path d="M206 224 l-8 -5 v10 z M396 224 l-8 -5 v10 z M586 224 l-8 -5 v10 z"/>
  </g>
</svg>
