<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Types of learning by feedback signal</title>
  <desc id="d">Four columns grouped by the signal the learner receives: supervised learning with labels, unsupervised learning with no labels, self-supervised learning with labels derived from the data itself, and reinforcement learning with rewards from an environment. Semi-supervised learning sits between supervised and unsupervised.</desc>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">What feedback does the learner get?</text>
  <rect x="16" y="52" width="160" height="196" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="96" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Supervised</text>
  <text x="96" y="104" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">(x, y) pairs</text>
  <text x="96" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">classification</text>
  <text x="96" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">regression</text>
  <text x="96" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">signal: the right answer</text>
  <rect x="196" y="52" width="160" height="196" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="276" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Unsupervised</text>
  <text x="276" y="104" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">x only</text>
  <text x="276" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">clustering</text>
  <text x="276" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">dimensionality reduction</text>
  <text x="276" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">density estimation</text>
  <text x="276" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">signal: structure in data</text>
  <rect x="376" y="52" width="160" height="196" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="456" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Self-supervised</text>
  <text x="456" y="104" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">labels from x</text>
  <text x="456" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">next-token prediction</text>
  <text x="456" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">masked modelling</text>
  <text x="456" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">contrastive learning</text>
  <text x="456" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">signal: a hidden part of x</text>
  <rect x="556" y="52" width="148" height="196" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Reinforcement</text>
  <text x="630" y="104" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">(s, a, r, s')</text>
  <text x="630" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">games, control</text>
  <text x="630" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">RLHF</text>
  <text x="630" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">signal: delayed reward</text>
  <rect x="16" y="266" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="186" y="291" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">Semi-supervised: a few labels plus many unlabelled examples</text>
  <rect x="376" y="266" width="328" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="540" y="291" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">Transfer and fine-tuning reuse a trained model</text>
</svg>
