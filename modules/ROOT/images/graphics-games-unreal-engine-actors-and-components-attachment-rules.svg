<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Attachment rules decide what happens to the child's transform</text>
<rect x="20" y="50" width="170" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105" y="72" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">KeepRelativeTransform</text>
<rect x="40" y="120" width="130" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="105" y="135" text-anchor="middle" font-size="11" fill="#92400E">new parent</text>
<rect x="80" y="185" width="40" height="22" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="100.0" y="200" text-anchor="middle" font-size="10" fill="#047857">child</text>
<text x="105" y="245" text-anchor="middle" font-size="11" fill="#374151">Offset to the parent is</text>
<text x="105" y="259" text-anchor="middle" font-size="11" fill="#374151">kept, so the child jumps</text>
<text x="105" y="273" text-anchor="middle" font-size="11" fill="#374151">with its new parent</text>
<rect x="205" y="50" width="170" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290" y="72" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">KeepWorldTransform</text>
<rect x="225" y="120" width="130" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="290" y="135" text-anchor="middle" font-size="11" fill="#92400E">new parent</text>
<rect x="225" y="185" width="40" height="22" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="245.0" y="200" text-anchor="middle" font-size="10" fill="#047857">child</text>
<text x="290" y="245" text-anchor="middle" font-size="11" fill="#374151">World pose is kept and</text>
<text x="290" y="259" text-anchor="middle" font-size="11" fill="#374151">the relative offset is</text>
<text x="290" y="273" text-anchor="middle" font-size="11" fill="#374151">recomputed</text>
<rect x="390" y="50" width="170" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475" y="72" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">SnapToTarget</text>
<rect x="410" y="120" width="130" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="475" y="135" text-anchor="middle" font-size="11" fill="#92400E">new parent</text>
<rect x="452" y="140" width="40" height="22" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="472.0" y="155" text-anchor="middle" font-size="10" fill="#047857">child</text>
<text x="475" y="245" text-anchor="middle" font-size="11" fill="#374151">Snaps onto the parent or</text>
<text x="475" y="259" text-anchor="middle" font-size="11" fill="#374151">socket, keeps the</text>
<text x="475" y="273" text-anchor="middle" font-size="11" fill="#374151">child's own scale</text>
<rect x="575" y="50" width="170" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="660" y="72" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">SnapToTargetIncludingScale</text>
<rect x="595" y="120" width="130" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="660" y="135" text-anchor="middle" font-size="11" fill="#92400E">new parent</text>
<rect x="627" y="140" width="66" height="26" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="660.0" y="157" text-anchor="middle" font-size="10" fill="#047857">child</text>
<text x="660" y="245" text-anchor="middle" font-size="11" fill="#374151">Snaps onto the parent or</text>
<text x="660" y="259" text-anchor="middle" font-size="11" fill="#374151">socket and takes its</text>
<text x="660" y="273" text-anchor="middle" font-size="11" fill="#374151">scale as well</text>
<text x="380" y="322" text-anchor="middle" font-size="11" fill="#374151">The first two keep something fixed; the snap rules place the child at the parent or at the named socket.</text>
</svg>
