<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-wsi-ring" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The life of one swapchain image</text>
<rect x="14" y="70" width="138" height="80" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="83.0" y="106.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Free</text>
<text x="83.0" y="121.3" text-anchor="middle" font-size="11" fill="#374151">owned by the engine</text>
<circle cx="26" cy="66" r="11" fill="#4F46E5"/>
<text x="26" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<line x1="152" y1="110" x2="163" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-ring)"/>
<rect x="163" y="70" width="138" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.0" y="106.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Acquired</text>
<text x="232.0" y="121.3" text-anchor="middle" font-size="11" fill="#3730A3">acquire returns it</text>
<circle cx="175" cy="66" r="11" fill="#4F46E5"/>
<text x="175" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<line x1="301" y1="110" x2="312" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-ring)"/>
<rect x="312" y="70" width="138" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="381.0" y="106.3" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Rendering</text>
<text x="381.0" y="121.3" text-anchor="middle" font-size="11" fill="#92400E">GPU writes pixels</text>
<circle cx="324" cy="66" r="11" fill="#4F46E5"/>
<text x="324" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<line x1="450" y1="110" x2="461" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-ring)"/>
<rect x="461" y="70" width="138" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="530.0" y="106.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Queued</text>
<text x="530.0" y="121.3" text-anchor="middle" font-size="11" fill="#3730A3">vkQueuePresentKHR</text>
<circle cx="473" cy="66" r="11" fill="#4F46E5"/>
<text x="473" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<line x1="599" y1="110" x2="610" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-ring)"/>
<rect x="610" y="70" width="138" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="679.0" y="106.3" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">On screen</text>
<text x="679.0" y="121.3" text-anchor="middle" font-size="11" fill="#065F46">held until replaced</text>
<circle cx="622" cy="66" r="11" fill="#4F46E5"/>
<text x="622" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<path d="M 83 152 L 83 200 L 677 200 L 677 152" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-wsi-ring)"/>
<text x="380" y="220" text-anchor="middle" font-size="11" fill="#374151">the image returns to Free when it is replaced on screen and later handed out again by acquire</text>
<text x="380" y="262" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Three images in a FIFO swapchain at one instant</text>
<rect x="60" y="280" width="200" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="160.0" y="306.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Image 0</text>
<text x="160.0" y="322.2" text-anchor="middle" font-size="12" fill="#065F46">on screen</text>
<rect x="280" y="280" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="306.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Image 1</text>
<text x="380.0" y="322.2" text-anchor="middle" font-size="12" fill="#3730A3">queued, waiting for vblank</text>
<rect x="500" y="280" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="600.0" y="306.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Image 2</text>
<text x="600.0" y="322.2" text-anchor="middle" font-size="12" fill="#92400E">being rendered by the GPU</text>
<text x="380" y="364" text-anchor="middle" font-size="11" fill="#374151">The application only touches the image whose index the last acquire returned.</text>
</svg>
