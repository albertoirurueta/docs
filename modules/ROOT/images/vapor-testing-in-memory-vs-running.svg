<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two ways app.testing().test(...) reaches your routes</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">the same beforeRequest and afterResponse closures; only the transport between them changes</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- shared test box -->
  <rect x="300" y="64" width="340" height="62" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="470" y="88" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">@Test function</text>
  <text x="470" y="108" font-size="11" fill="#222222" text-anchor="middle">beforeRequest builds a TestingHTTPRequest (method, URI, headers, body)</text>

  <!-- left lane -->
  <text x="40" y="160" font-size="14" font-weight="bold" fill="#1f5f99">.inMemory (default)</text>
  <rect x="40" y="170" width="360" height="62" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="220" y="194" font-size="13" font-weight="bold" fill="#1f5f99" text-anchor="middle">Request(application:method:url:headers:)</text>
  <text x="220" y="214" font-size="11" fill="#222222" text-anchor="middle">built directly, body already collected, no remote address</text>

  <rect x="40" y="262" width="360" height="62" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="220" y="286" font-size="13" font-weight="bold" fill="#1f5f99" text-anchor="middle">app.responder.respond(to:)</text>
  <text x="220" y="306" font-size="11" fill="#222222" text-anchor="middle">global middleware, router, group middleware, handler</text>

  <rect x="40" y="354" width="360" height="62" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="220" y="378" font-size="13" font-weight="bold" fill="#1f5f99" text-anchor="middle">Response collected into a TestingHTTPResponse</text>
  <text x="220" y="398" font-size="11" fill="#222222" text-anchor="middle">status, headers, body bytes; streamed bodies are read to the end</text>

  <!-- right lane -->
  <text x="540" y="160" font-size="14" font-weight="bold" fill="#2e7d32">.running(port:)</text>
  <rect x="540" y="170" width="360" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="194" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">app.server.start(address:) on the port</text>
  <text x="720" y="214" font-size="11" fill="#222222" text-anchor="middle">then AsyncHTTPClient sends a real request to http://localhost:port</text>

  <rect x="540" y="262" width="360" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="286" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">TCP socket, HTTP codecs, connection handling</text>
  <text x="720" y="306" font-size="11" fill="#222222" text-anchor="middle">then the same responder chain as in memory</text>

  <rect x="540" y="354" width="360" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="378" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Response read by the client, server stopped</text>
  <text x="720" y="398" font-size="11" fill="#222222" text-anchor="middle">up to 1 MB of body; the server shuts down after every test(...) call</text>

  <!-- arrows -->
  <path d="M380,126 L380,146 L220,146 L220,168" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M560,126 L560,146 L720,146 L720,168" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M220,232 L220,260" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M220,324 L220,352" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M720,232 L720,260" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M720,324 L720,352" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- footers -->
  <rect x="40" y="436" width="360" height="62" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="220" y="458" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Use for almost every test</text>
  <text x="220" y="476" font-size="11" fill="#222222" text-anchor="middle">fast, no port, safe to run in parallel,</text>
  <text x="220" y="490" font-size="11" fill="#222222" text-anchor="middle">no Date or Connection headers added</text>

  <rect x="540" y="436" width="360" height="62" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="720" y="458" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Use when the wire matters</text>
  <text x="720" y="476" font-size="11" fill="#222222" text-anchor="middle">server configuration, real headers, a fixed port</text>
  <text x="720" y="490" font-size="11" fill="#222222" text-anchor="middle">so run it serialized; WebSockets need app.startup()</text>
</svg>
