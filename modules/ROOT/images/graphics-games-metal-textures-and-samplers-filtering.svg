<text x="640" y="215" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mipFilter = .linear</text>
<text x="640" y="232" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blends two levels</text>
<rect x="20" y="260" width="720" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="294.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">magFilter applies when the texture is enlarged (a texel covers several pixels).</text>
<text x="380.0" y="309.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">minFilter applies when it is shrunk; mipFilter chooses how levels are combined (.notMipmapped, .nearest, .linear).</text>
<text x="380.0" y="324.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">maxAnisotropy up to 16 keeps textures sharp on surfaces seen at a grazing angle.</text>
