<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
<title id="t">melt and pivot round trip</title><desc id="d">A wide table with columns y2023 and y2024 is melted into a long table with a year column and a population column, and pivot returns it to the wide shape.</desc>
