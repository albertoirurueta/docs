<text x="570" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">long: one row per observation</text>
<line x1="280" y1="130" x2="440" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<text x="360" y="118" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" font-weight="bold">melt / wide_to_long</text>
<text x="360" y="150" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#475569">stack</text>
<line x1="440" y1="215" x2="280" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<text x="360" y="203" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">pivot</text>
<text x="360" y="235" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">unstack / pivot_table</text>
<text x="360" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">id_vars stay as columns; value_vars become var_name and value_name.</text>
<text x="360" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">stack and unstack do the same job on the index instead of on columns.</text>
<text x="360" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Pivoting back needs a unique key per cell.</text>
