<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One app, four possible intents</text>
  <rect x="270" y="50" width="220" height="64" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="380" y="78" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Your app bundle</text>
  <text x="380" y="98" font-size="12" fill="#374151" text-anchor="middle">src/index.tsx calls each prepare function</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <path d="M300,114 L120,170" marker-end="url(#ah)"/><path d="M345,114 L290,170" marker-end="url(#ah)"/><path d="M415,114 L470,170" marker-end="url(#ah)"/><path d="M460,114 L640,170" marker-end="url(#ah)"/>
  </g>
  <g fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5">
    <rect x="20" y="172" width="170" height="130" rx="10"/><rect x="200" y="172" width="170" height="130" rx="10"/><rect x="390" y="172" width="170" height="130" rx="10"/><rect x="570" y="172" width="170" height="130" rx="10"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="105" y="196">Design Editor</text><text x="285" y="196">Data Connector</text><text x="475" y="196">Content Publisher</text><text x="655" y="196">URL Expander</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="105" y="218">prepareDesignEditor</text><text x="285" y="218">prepareDataConnector</text><text x="475" y="218">prepareContentPublisher</text><text x="655" y="218">prepareUrlExpander</text>
    <text x="105" y="244">Tools in the editor</text><text x="105" y="260">side panel</text><text x="105" y="282">intent.design_editor</text>
    <text x="285" y="244">Pick and fetch tabular</text><text x="285" y="260">data for designs</text><text x="285" y="282">intent.data_connector</text>
    <text x="475" y="244">Publish designs to an</text><text x="475" y="260">external platform</text><text x="475" y="282">intent.content_publisher</text>
    <text x="655" y="244">Turn a pasted link into</text><text x="655" y="260">content in Canva AI</text><text x="655" y="282">intent.url_expander</text>
  </g>
  <rect x="570" y="310" width="170" height="24" rx="12" fill="#FEF3C7" stroke="#B45309"/>
  <text x="655" y="327" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">preview, beta package</text>
  <rect x="20" y="310" width="170" height="24" rx="12" fill="#FEF3C7" stroke="#B45309"/>
  <text x="105" y="327" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">default for older apps</text>
  <text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Each intent works independently; Canva decides where to surface the app.</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic app platform, not a screenshot of any product.</text>
</svg>
