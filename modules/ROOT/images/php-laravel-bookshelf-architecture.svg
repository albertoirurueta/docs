<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf application</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">the running example of this section, and the services it uses</text>

  <!-- clients -->
  <rect x="60" y="70" width="240" height="60" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="180" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">API clients</text>
  <text x="180" y="112" font-size="10" fill="#444444" text-anchor="middle">JSON API under /api/v1 and /api/v2, Sanctum</text>

  <rect x="330" y="70" width="240" height="60" fill="#ffffff" stroke="#888888" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="450" y="94" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">Bookshelf Lite</text>
  <text x="450" y="112" font-size="10" fill="#666666" text-anchor="middle">the same catalogue in plain PHP and PDO</text>

  <rect x="600" y="70" width="280" height="60" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="740" y="94" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="740" y="112" font-size="10" fill="#444444" text-anchor="middle">Blade pages, Livewire, Inertia with React, Echo</text>

  <line x1="180" y1="130" x2="180" y2="158" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="740" y1="130" x2="740" y2="158" stroke="#444444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- application -->
  <rect x="20" y="160" width="820" height="250" fill="#fafafa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="430" y="181" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Bookshelf: a Laravel 13 application</text>

  <rect x="40" y="195" width="250" height="200" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="165" y="215" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">HTTP layer</text>
  <text x="165" y="238" font-size="10" fill="#444444" text-anchor="middle">routes/web.php and routes/api.php</text>
  <text x="165" y="258" font-size="10" fill="#444444" text-anchor="middle">middleware: auth, request forgery,</text>
  <text x="165" y="272" font-size="10" fill="#444444" text-anchor="middle">throttle, locale</text>
  <text x="165" y="292" font-size="10" fill="#444444" text-anchor="middle">thin controllers</text>
  <text x="165" y="312" font-size="10" fill="#444444" text-anchor="middle">Form Requests</text>
  <text x="165" y="332" font-size="10" fill="#444444" text-anchor="middle">policies and gates</text>
  <text x="165" y="352" font-size="10" fill="#444444" text-anchor="middle">session login and Sanctum guards</text>

  <rect x="305" y="195" width="250" height="200" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="430" y="215" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Application and data</text>
  <text x="430" y="238" font-size="10" fill="#444444" text-anchor="middle">actions: AddBook, PostReview</text>
  <text x="430" y="258" font-size="10" fill="#444444" text-anchor="middle">Eloquent models: Book, Author,</text>
  <text x="430" y="272" font-size="10" fill="#444444" text-anchor="middle">Review, Loan, User</text>
  <text x="430" y="292" font-size="10" fill="#444444" text-anchor="middle">relationships, casts, scopes</text>
  <text x="430" y="312" font-size="10" fill="#444444" text-anchor="middle">events and listeners</text>
  <text x="430" y="332" font-size="10" fill="#444444" text-anchor="middle">queued jobs</text>
  <text x="430" y="352" font-size="10" fill="#444444" text-anchor="middle">HTTP client for the catalogue</text>

  <rect x="570" y="195" width="250" height="200" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="695" y="215" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Output</text>
  <text x="695" y="238" font-size="10" fill="#444444" text-anchor="middle">Blade components and layouts</text>
  <text x="695" y="258" font-size="10" fill="#444444" text-anchor="middle">Livewire components</text>
  <text x="695" y="278" font-size="10" fill="#444444" text-anchor="middle">Inertia pages in React</text>
  <text x="695" y="298" font-size="10" fill="#444444" text-anchor="middle">API resources and JSON:API</text>
  <text x="695" y="318" font-size="10" fill="#444444" text-anchor="middle">mail and notifications</text>
  <text x="695" y="338" font-size="10" fill="#444444" text-anchor="middle">broadcast events</text>
  <text x="695" y="358" font-size="10" fill="#444444" text-anchor="middle">translations: English and Spanish</text>

  <!-- services -->
  <g font-size="10" fill="#444444" text-anchor="middle">
    <rect x="20" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="67" y="472" font-size="12" font-weight="bold" fill="#2e6b30">Database</text>
    <text x="67" y="492">PostgreSQL 17</text>
    <text x="67" y="507">SQLite in tests</text>

    <rect x="123" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="170" y="472" font-size="12" font-weight="bold" fill="#2e6b30">Redis</text>
    <text x="170" y="492">cache, sessions,</text>
    <text x="170" y="507">queues, locks</text>

    <rect x="226" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="273" y="472" font-size="12" font-weight="bold" fill="#2e6b30">Workers</text>
    <text x="273" y="492">queue:work</text>
    <text x="273" y="507">or Horizon</text>

    <rect x="329" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="376" y="472" font-size="12" font-weight="bold" fill="#2e6b30">Scheduler</text>
    <text x="376" y="492">schedule:run</text>
    <text x="376" y="507">every minute</text>

    <rect x="432" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="479" y="472" font-size="12" font-weight="bold" fill="#2e6b30">S3 disk</text>
    <text x="479" y="492">cover images</text>
    <text x="479" y="507">S3-compatible</text>

    <rect x="535" y="450" width="95" height="80" fill="#eef6ee" stroke="#2e6b30" stroke-width="1.4"/>
    <text x="582" y="472" font-size="12" font-weight="bold" fill="#2e6b30">Mail</text>
    <text x="582" y="492">SMTP</text>
    <text x="582" y="507">Mailpit locally</text>

    <rect x="638" y="450" width="95" height="80" fill="#fff6e8" stroke="#b36b00" stroke-width="1.4"/>
    <text x="685" y="472" font-size="11" font-weight="bold" fill="#b36b00">Catalogue API</text>
    <text x="685" y="492">external service</text>
    <text x="685" y="507">with retries</text>

    <rect x="741" y="450" width="95" height="80" fill="#fff6e8" stroke="#b36b00" stroke-width="1.4"/>
    <text x="788" y="472" font-size="12" font-weight="bold" fill="#b36b00">Reverb</text>
    <text x="788" y="492">WebSockets</text>
    <text x="788" y="507">for broadcasts</text>
  </g>
  <g stroke="#444444" stroke-width="1.4" marker-end="url(#a)">
    <line x1="67" y1="410" x2="67" y2="448"/>
    <line x1="170" y1="410" x2="170" y2="448"/>
    <line x1="273" y1="410" x2="273" y2="448"/>
    <line x1="376" y1="410" x2="376" y2="448"/>
    <line x1="479" y1="410" x2="479" y2="448"/>
    <line x1="582" y1="410" x2="582" y2="448"/>
    <line x1="685" y1="410" x2="685" y2="448"/>
    <line x1="788" y1="410" x2="788" y2="448"/>
  </g>
  <!-- Reverb pushes to the browser over wss -->
  <polyline points="836,490 866,490 866,132" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="884" y="300" font-size="10" fill="#b36b00" transform="rotate(-90 884 300)" text-anchor="middle">wss:// to Echo</text>

  <text x="450" y="560" font-size="11" fill="#666666" text-anchor="middle">Workers, the scheduler and Reverb run the same code base as separate processes.</text>
</svg>
