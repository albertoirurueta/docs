<text x="335" y="185" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" font-weight="bold">pivot</text>
<text x="335" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">index=date</text>
<text x="335" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">columns=city</text>
<text x="335" y="261" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">values=temp</text>
