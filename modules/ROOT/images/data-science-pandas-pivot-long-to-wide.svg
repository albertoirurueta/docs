<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">pivot turns long data into wide data</title><desc id="d">A long table with date, city and temp columns on the left becomes a wide table with one row per date and one column per city on the right. Each city keeps its own colour.</desc>
