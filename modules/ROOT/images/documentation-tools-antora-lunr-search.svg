<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
<title id="t">Lunr search flow in an Antora site</title>
<desc id="d">At build time the Lunr extension writes search-index.js and adds the search-scripts partial. In the browser the search input loads the index and shows results.</desc>
<rect width="760" height="260" rx="12" fill="#263238"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">
<text x="190" y="30" font-size="15" font-weight="bold" fill="#ffcc80">Build time</text>
<text x="570" y="30" font-size="15" font-weight="bold" fill="#80cbc4">In the browser</text>
<rect x="20" y="46" width="150" height="56" rx="8" fill="#37474f" stroke="#90a4ae"/>
<text x="95" y="70">Converted pages</text><text x="95" y="90" font-size="12" fill="#cfd8dc">after documentsConverted</text>
<rect x="215" y="46" width="150" height="56" rx="8" fill="#37474f" stroke="#ffcc80"/>
<text x="290" y="70">Lunr extension</text><text x="290" y="90" font-size="12" fill="#cfd8dc">sets SITE_SEARCH_PROVIDER</text>
<rect x="215" y="150" width="150" height="56" rx="8" fill="#37474f" stroke="#ffcc80"/>
<text x="290" y="174">search-index.js</text><text x="290" y="194" font-size="12" fill="#cfd8dc">site root, with lunr.js</text>
<rect x="400" y="46" width="160" height="56" rx="8" fill="#37474f" stroke="#80cbc4"/>
<text x="480" y="70">UI: search-input</text><text x="480" y="90" font-size="12" fill="#cfd8dc">plus search-scripts partial</text>
<rect x="590" y="46" width="150" height="56" rx="8" fill="#37474f" stroke="#80cbc4"/>
<text x="665" y="70">Index download</text><text x="665" y="90" font-size="12" fill="#cfd8dc">event loadedindex</text>
<rect x="590" y="150" width="150" height="56" rx="8" fill="#37474f" stroke="#80cbc4"/>
<text x="665" y="174">Results list</text><text x="665" y="194" font-size="12" fill="#cfd8dc">exact, prefix, contains</text>
</g>
<g stroke="#eceff1" stroke-width="2" fill="none"><path d="M170 74H213"/><path d="M290 102V148"/><path d="M365 178H400Q480 178 480 104"/><path d="M560 74H588"/><path d="M665 102V148"/></g>
<g fill="#eceff1"><path d="M213 69l8 5-8 5z"/><path d="M285 148l5 8 5-8z"/><path d="M586 69l8 5-8 5z"/><path d="M660 148l5 8 5-8z"/></g>
</svg>
