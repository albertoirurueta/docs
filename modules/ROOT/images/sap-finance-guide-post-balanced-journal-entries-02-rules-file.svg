<title id="sap-finance-guide-post-balanced-journal-entries-02-rules-file-title">Visual Studio Code with the file srv/ledger-service.js: the excerpt shows rule 3, which counts at least two lines, adds the debits and the credits in cents and rejects the entry with the message Entry is not balanced when they differ; callout 5 marks the file in the explorer</title>
