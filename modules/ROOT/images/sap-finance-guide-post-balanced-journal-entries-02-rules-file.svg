<g><rect x="356" y="73" width="716" height="255" rx="2" fill="#1f1f1f" stroke="#3c3c3c" stroke-width="1"/><text x="368" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">1</text><text x="392" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  // Rule 3: an entry has at least two lines, and its debits equal its credits.</text><text x="368" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">2</text><text x="392" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  if (items.length &lt; 2) {</text><text x="368" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">3</text><text x="392" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    return req.error(400, 'A journal entry needs at least two lines', 'in/Items')</text><text x="368" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">4</text><text x="392" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  }</text><text x="368" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">5</text><text x="392" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const lines = items.map((i) =&gt; cents(i.AmountInCompanyCodeCurrency))</text><text x="368" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">6</text><text x="392" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const debit = lines.filter((c) =&gt; c &gt; 0).reduce((a, c) =&gt; a + c, 0)</text><text x="368" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">7</text><text x="392" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const credit = lines.filter((c) =&gt; c &lt; 0).reduce((a, c) =&gt; a - c, 0)</text><text x="368" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">8</text><text x="392" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  if (debit !== credit) {</text><text x="368" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">9</text><text x="392" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    const [dr, cr] = [debit, credit].map(money)</text><text x="368" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">10</text><text x="392" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    const message = `Entry is not balanced: debits ${dr}, credits ${cr}`</text><text x="368" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">11</text><text x="392" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    return req.error(400, message, 'in/Items')</text><text x="368" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">12</text><text x="392" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  }</text></g>
