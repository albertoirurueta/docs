<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Which program fits which organization</text>
<rect x="16" y="56" width="232" height="262" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="132" y="86" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Education</text><rect x="36" y="104" width="192" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="132" y="118" font-size="11" fill="#374151" text-anchor="middle">K-12 teachers, schools,</text><text x="132" y="132" font-size="11" fill="#374151" text-anchor="middle">districts; students by invitation</text><rect x="36" y="152" width="192" height="26" rx="13" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="132" y="169" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Free for eligible users</text><rect x="264" y="56" width="232" height="262" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/><text x="380" y="86" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Campus</text><rect x="284" y="104" width="192" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="380" y="118" font-size="11" fill="#374151" text-anchor="middle">Universities and colleges:</text><text x="380" y="132" font-size="11" fill="#374151" text-anchor="middle">staff and student teams</text><rect x="284" y="152" width="192" height="26" rx="13" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="380" y="169" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Paid; contact sales</text><rect x="512" y="56" width="232" height="262" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="628" y="86" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Nonprofits</text><rect x="532" y="104" width="192" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="628" y="118" font-size="11" fill="#374151" text-anchor="middle">Registered nonprofits and</text><text x="628" y="132" font-size="11" fill="#374151" text-anchor="middle">qualifying charities</text><rect x="532" y="152" width="192" height="26" rx="13" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="628" y="169" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Free for one team of 50</text><text x="128" y="206" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Classes, assignments, lessons</text><text x="128" y="224" font-size="12" fill="#374151" text-anchor="middle">Learn Grid, Magic Activities</text><text x="128" y="242" font-size="12" fill="#374151" text-anchor="middle">LMS integrations</text><text x="128" y="260" font-size="12" fill="#374151" text-anchor="middle">Affinity access</text><text x="376" y="206" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Separate staff and student teams</text><text x="376" y="224" font-size="12" fill="#374151" text-anchor="middle">SSO and admin reporting</text><text x="376" y="242" font-size="12" fill="#374151" text-anchor="middle">LMS integrations</text><text x="376" y="260" font-size="12" fill="#374151" text-anchor="middle">Starts from Business</text><text x="624" y="206" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Pro features at no cost</text><text x="624" y="224" font-size="12" fill="#374151" text-anchor="middle">Brand Kit, brand templates</text><text x="624" y="242" font-size="12" fill="#374151" text-anchor="middle">Team sharing</text><text x="624" y="260" font-size="12" fill="#374151" text-anchor="middle">Affinity access</text><text x="380" y="300" font-size="12" fill="#6B7280" text-anchor="middle">Eligibility is checked by Canva; the Help Center lists who does not qualify.</text><text x="380" y="352" font-size="12" fill="#374151" text-anchor="middle">Bookshelf Reading Club (school) and Bookshelf Readers Fund (charity) use different programs.</text>  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
