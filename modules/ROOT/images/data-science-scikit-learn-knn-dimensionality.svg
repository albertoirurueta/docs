<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Nearest neighbours stop being near as dimensions grow</title>
<desc id="d">Bars show the ratio of the mean nearest-neighbour distance to the largest distance in 500 uniform random points: 0.02 in 2 dimensions, 0.29 in 10, 0.68 in 100 and 0.90 in 1000.</desc>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0F172A">Nearest versus farthest distance as dimensions grow</text>
<text x="24" y="58" font-size="12" fill="#475569">500 uniform random points; bar = mean nearest distance / largest distance from one point</text>
<line x1="90" y1="300" x2="690" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="90" y1="80" x2="90" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<g font-size="12" fill="#475569" text-anchor="end">
<text x="82" y="304">0</text><text x="82" y="260">0.2</text><text x="82" y="216">0.4</text><text x="82" y="172">0.6</text><text x="82" y="128">0.8</text><text x="82" y="84">1.0</text>
</g>
<g stroke="#CBD5E1" stroke-width="1"><line x1="90" y1="256" x2="690" y2="256"/><line x1="90" y1="212" x2="690" y2="212"/><line x1="90" y1="168" x2="690" y2="168"/><line x1="90" y1="124" x2="690" y2="124"/></g>
<rect x="130" y="295.6" width="80" height="4.4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="270" y="236.2" width="80" height="63.8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<rect x="410" y="150.4" width="80" height="149.6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="550" y="102" width="80" height="198" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<g font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">
<text x="170" y="288">0.02</text><text x="310" y="228">0.29</text><text x="450" y="142">0.68</text><text x="590" y="94">0.90</text>
</g>
<g font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">
<text x="170" y="324">2 features</text><text x="310" y="324">10</text><text x="450" y="324">100</text><text x="590" y="324">1000</text>
</g>
</svg>
