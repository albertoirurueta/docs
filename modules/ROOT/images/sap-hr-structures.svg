<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The enterprise structure and the personnel structure of Example Trading Co. meet in infotype 0001</title>
  <desc id="d">The enterprise structure on the left: company code EX01 contains personnel area EX01, which is divided into personnel subareas 0001 Head office and 0002 Warehouse. The personnel structure on the right: employee group 1 Active is divided into employee subgroups AA Salaried staff and AB Hourly staff, and payroll area E1 Monthly EX01 is a separate grouping for payroll runs. Infotype 0001 Organizational Assignment of employee 00001234 Ana Torres stores one value from each: personnel area EX01, personnel subarea 0001, employee group 1, employee subgroup AA and payroll area E1. All codes are invented example values.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold">Enterprise structure: where the employee works</text>
  <text x="820" y="22" text-anchor="middle" font-size="14" font-weight="bold">Personnel structure: what kind of employee</text>
  <rect x="20" y="40" width="480" height="56" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="63" text-anchor="middle" font-size="14" font-weight="bold">Company code EX01</text>
  <text x="260" y="82" text-anchor="middle" font-size="12">the legal company, shared with Finance</text>
  <line x1="260" y1="96" x2="260" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="130" width="480" height="56" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="153" text-anchor="middle" font-size="14" font-weight="bold">Personnel area EX01 "Example Trading Co."</text>
  <text x="260" y="172" text-anchor="middle" font-size="12">one company code per personnel area (table T500P)</text>
  <line x1="140" y1="186" x2="132" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="186" x2="388" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="220" width="225" height="60" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="132.5" y="245" text-anchor="middle" font-size="13" font-weight="bold">Subarea 0001</text>
  <text x="132.5" y="263" text-anchor="middle" font-size="11">Head office</text>
  <rect x="275" y="220" width="225" height="60" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="387.5" y="245" text-anchor="middle" font-size="13" font-weight="bold">Subarea 0002</text>
  <text x="387.5" y="263" text-anchor="middle" font-size="11">Warehouse</text>
  <text x="260" y="304" text-anchor="middle" font-size="11">Personnel areas and subareas: table T001P</text>
  <rect x="580" y="40" width="480" height="56" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="820" y="63" text-anchor="middle" font-size="14" font-weight="bold">Employee group 1 "Active"</text>
  <text x="820" y="82" text-anchor="middle" font-size="12">one-character code</text>
  <line x1="700" y1="96" x2="692" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="940" y1="96" x2="948" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="580" y="130" width="225" height="60" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="692.5" y="155" text-anchor="middle" font-size="13" font-weight="bold">Subgroup AA</text>
  <text x="692.5" y="173" text-anchor="middle" font-size="11">Salaried staff</text>
  <rect x="835" y="130" width="225" height="60" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="947.5" y="155" text-anchor="middle" font-size="13" font-weight="bold">Subgroup AB</text>
  <text x="947.5" y="173" text-anchor="middle" font-size="11">Hourly staff</text>
  <text x="820" y="214" text-anchor="middle" font-size="11">Groups and subgroups: table T503</text>
  <rect x="835" y="230" width="225" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="947.5" y="253" text-anchor="middle" font-size="13" font-weight="bold">Payroll area E1</text>
  <text x="947.5" y="271" text-anchor="middle" font-size="11">Monthly EX01</text>
  <text x="620" y="250" text-anchor="start" font-size="11">A payroll area groups employees</text>
  <text x="620" y="266" text-anchor="start" font-size="11">who are paid together; it is not</text>
  <text x="620" y="282" text-anchor="start" font-size="11">a subdivision of the group</text>
  <line x1="132" y1="280" x2="132" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="190" x2="600" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="947" y1="286" x2="947" y2="340" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="340" width="1040" height="110" rx="10" fill="#7873f5" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="370" text-anchor="middle" font-size="15" font-weight="bold">Infotype 0001 Organizational Assignment of 00001234 Ana Torres</text>
  <text x="540" y="390" text-anchor="middle" font-size="13">Personnel area EX01  |  Personnel subarea 0001</text>
  <text x="540" y="410" text-anchor="middle" font-size="13">Employee group 1  |  Employee subgroup AA  |  Payroll area E1</text>
  <text x="540" y="430" text-anchor="middle" font-size="13">one valid record at all times during employment</text>
  <text x="540" y="480" text-anchor="middle" font-size="11">All codes and names are invented example values for Example Trading Co.; they are not SAP-delivered values.</text>
</svg>
