<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A request through a proxy chain</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">each hop appends the address of the peer it saw; Express decides how many of them to believe</text>

  <!-- boxes -->
  <rect x="14" y="70" width="150" height="84" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="89" y="96" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Client</text>
  <text x="89" y="116" font-size="11" fill="#666666" text-anchor="middle">203.0.113.7</text>
  <text x="89" y="134" font-size="10" fill="#666666" text-anchor="middle">sends https://books.example.com</text>

  <rect x="214" y="70" width="150" height="84" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="289" y="96" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">CDN / load balancer</text>
  <text x="289" y="116" font-size="11" fill="#666666" text-anchor="middle">198.51.100.20</text>
  <text x="289" y="134" font-size="10" fill="#666666" text-anchor="middle">terminates TLS (hop 2)</text>

  <rect x="414" y="70" width="150" height="84" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="489" y="96" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Nginx</text>
  <text x="489" y="116" font-size="11" fill="#666666" text-anchor="middle">10.0.0.5</text>
  <text x="489" y="134" font-size="10" fill="#666666" text-anchor="middle">reverse proxy (hop 1)</text>

  <rect x="614" y="70" width="132" height="84" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="680" y="96" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Express</text>
  <text x="680" y="116" font-size="11" fill="#666666" text-anchor="middle">10.0.0.8:3000</text>
  <text x="680" y="134" font-size="10" fill="#666666" text-anchor="middle">plain HTTP, socket peer 10.0.0.5</text>

  <!-- arrows -->
  <line x1="164" y1="112" x2="206" y2="112" stroke="#444444" stroke-width="1.6"/>
  <polygon points="212,112 204,107 204,117" fill="#444444"/>
  <line x1="364" y1="112" x2="406" y2="112" stroke="#444444" stroke-width="1.6"/>
  <polygon points="412,112 404,107 404,117" fill="#444444"/>
  <line x1="564" y1="112" x2="606" y2="112" stroke="#444444" stroke-width="1.6"/>
  <polygon points="612,112 604,107 604,117" fill="#444444"/>

  <!-- header panels -->
  <line x1="289" y1="154" x2="289" y2="178" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="190" y="178" width="200" height="86" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="200" y="196" font-size="11" font-weight="bold" fill="#1c4b73">Sent to Nginx</text>
  <text x="200" y="214" font-size="10" fill="#222222">X-Forwarded-For: 203.0.113.7</text>
  <text x="200" y="230" font-size="10" fill="#222222">X-Forwarded-Proto: https</text>
  <text x="200" y="246" font-size="10" fill="#222222">X-Forwarded-Host: books.example.com</text>

  <line x1="489" y1="154" x2="489" y2="178" stroke="#7a4a00" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="410" y="178" width="340" height="86" fill="#ffffff" stroke="#7a4a00" stroke-width="1.2"/>
  <text x="420" y="196" font-size="11" font-weight="bold" fill="#7a4a00">Received by Express (Nginx appended the peer it saw)</text>
  <text x="420" y="214" font-size="10" fill="#222222">X-Forwarded-For: 203.0.113.7, 198.51.100.20</text>
  <text x="420" y="230" font-size="10" fill="#222222">X-Forwarded-Proto: https</text>
  <text x="420" y="246" font-size="10" fill="#222222">X-Forwarded-Host: books.example.com</text>

  <!-- address list -->
  <text x="14" y="296" font-size="12" font-weight="bold" fill="#2f5424">Address list built by proxy-addr, nearest first</text>
  <rect x="14" y="306" width="150" height="34" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="89" y="327" font-size="11" fill="#222222" text-anchor="middle">0: 10.0.0.5 (socket)</text>
  <rect x="164" y="306" width="170" height="34" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="249" y="327" font-size="11" fill="#222222" text-anchor="middle">1: 198.51.100.20</text>
  <rect x="334" y="306" width="170" height="34" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="419" y="327" font-size="11" fill="#222222" text-anchor="middle">2: 203.0.113.7</text>

  <text x="14" y="366" font-size="11" fill="#222222">trust proxy = false: req.ip is 10.0.0.5, req.protocol is http, req.ips is empty</text>
  <text x="14" y="384" font-size="11" fill="#222222">trust proxy = 1: req.ip is 198.51.100.20 (only Nginx is believed)</text>
  <text x="14" y="402" font-size="11" fill="#222222">trust proxy = 2: req.ip is 203.0.113.7, req.ips is [203.0.113.7, 198.51.100.20], req.protocol is https</text>
</svg>
