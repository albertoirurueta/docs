<svg viewBox="0 0 760 424" width="760" height="424" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The Publish and Website panel, in one picture</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Publish and Website panel, in one picture</text>
  <rect x="40" y="46" width="420" height="340" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="40" y="46" width="420" height="34" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="66" y="68" font-size="12" fill="#374151" text-anchor="start">Preview</text>
  <text x="250" y="68" font-size="12" fill="#374151" text-anchor="middle">Share</text>
  <rect x="340" y="52" width="108" height="22" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
  <text x="380" y="67" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Publish</text>
  <rect x="424" y="52" width="24" height="22" rx="6" fill="#3730A3" stroke="#3730A3" stroke-width="1"/>
  <text x="436" y="67" font-size="12" fill="#FFFFFF" text-anchor="middle">v</text>
  <rect x="60" y="96" width="200" height="270" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="160" y="230" font-size="13" fill="#6B7280" text-anchor="middle">Website canvas</text>
  <rect x="280" y="92" width="170" height="282" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="365" y="112" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Website panel</text>
  <text x="292" y="134" font-size="11" fill="#6B7280" text-anchor="start">Site address (URL)</text>
  <rect x="292" y="140" width="146" height="24" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="365" y="156" font-size="11" fill="#374151" text-anchor="middle">bookshelf.example  v</text>
  <text x="292" y="184" font-size="11" fill="#6B7280" text-anchor="start">Subpath</text>
  <rect x="292" y="190" width="146" height="24" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="365" y="206" font-size="11" fill="#374151" text-anchor="middle">/launch</text>
  <rect x="292" y="226" width="68" height="66" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="326" y="262" font-size="11" fill="#374151" text-anchor="middle">QR code</text>
  <rect x="370" y="226" width="68" height="24" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="404" y="242" font-size="11" fill="#92400E" text-anchor="middle">Settings</text>
  <rect x="370" y="260" width="68" height="32" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="404" y="274" font-size="10" fill="#374151" text-anchor="middle">Google</text>
  <text x="404" y="286" font-size="10" fill="#374151" text-anchor="middle">Analytics</text>
  <rect x="292" y="306" width="146" height="26" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
  <text x="365" y="323" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Continue to publish</text>
  <text x="365" y="350" font-size="10" fill="#6B7280" text-anchor="middle">Cookie banner follows Analytics</text>
  <circle cx="490" cy="96" r="11" fill="#4F46E5"/>
  <text x="490" y="100" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="506" y="100" font-size="11" fill="#374151" text-anchor="start">Publish button; its dropdown opens Settings</text>
  <circle cx="490" cy="150" r="11" fill="#4F46E5"/>
  <text x="490" y="154" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="506" y="154" font-size="11" fill="#374151" text-anchor="start">Site address menu: free, bought or own domain</text>
  <circle cx="490" cy="200" r="11" fill="#4F46E5"/>
  <text x="490" y="204" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="506" y="204" font-size="11" fill="#374151" text-anchor="start">Subpath: optional path after the domain</text>
  <circle cx="490" cy="246" r="11" fill="#4F46E5"/>
  <text x="490" y="250" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="506" y="250" font-size="11" fill="#374151" text-anchor="start">QR code and Settings in the same panel</text>
  <circle cx="490" cy="292" r="11" fill="#4F46E5"/>
  <text x="490" y="296" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
  <text x="506" y="296" font-size="11" fill="#374151" text-anchor="start">Google Analytics and cookie banner (paid)</text>
  <circle cx="490" cy="330" r="11" fill="#B45309"/>
  <text x="490" y="334" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
  <text x="506" y="334" font-size="11" fill="#374151" text-anchor="start">Continue to publish, then Publish</text>
  <text x="380" y="406" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic website editor, not a screenshot of any product.</text>
</svg>
