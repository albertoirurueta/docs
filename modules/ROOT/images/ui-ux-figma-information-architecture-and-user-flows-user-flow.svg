<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">User flow: find a book and leave a review</text>
  <!-- start -->
  <rect x="20" y="150" width="90" height="44" rx="22" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="65" y="177" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Start</text>
  <!-- screens -->
  <rect x="150" y="146" width="110" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="205" y="170" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Catalogue</text>
  <text x="205" y="187" font-size="12" fill="#374151" text-anchor="middle">search or browse</text>
  <rect x="300" y="146" width="110" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="355" y="170" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Book detail</text>
  <text x="355" y="187" font-size="12" fill="#374151" text-anchor="middle">read summary</text>
  <!-- decision -->
  <polygon points="515,128 595,172 515,216 435,172" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="515" y="169" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Signed in?</text>
  <!-- sign in -->
  <rect x="460" y="270" width="110" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="515" y="294" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Sign in</text>
  <text x="515" y="311" font-size="12" fill="#374151" text-anchor="middle">email and password</text>
  <!-- review form -->
  <rect x="630" y="146" width="110" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="685" y="170" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Review form</text>
  <text x="685" y="187" font-size="12" fill="#374151" text-anchor="middle">stars and text</text>
  <!-- end -->
  <rect x="630" y="270" width="110" height="52" rx="26" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="685" y="293" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Review posted</text>
  <text x="685" y="310" font-size="12" fill="#374151" text-anchor="middle">end</text>
  <!-- error -->
  <rect x="300" y="270" width="110" height="52" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="355" y="294" font-size="13" font-weight="bold" fill="#B91C1C" text-anchor="middle">Sign-in error</text>
  <text x="355" y="311" font-size="12" fill="#374151" text-anchor="middle">retry</text>
  <!-- arrows -->
  <path d="M110,172 L148,172" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M260,172 L298,172" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M410,172 L433,172" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M595,172 L628,172" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="611" y="164" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Yes</text>
  <path d="M515,216 L515,268" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="527" y="244" font-size="12" font-weight="bold" fill="#B91C1C">No</text>
  <path d="M570,296 L600,296 L600,200 L630,185" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M685,198 L685,268" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M460,296 L412,296" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah)"/>
  <!-- callouts -->
  <circle cx="65" cy="130" r="11" fill="#4F46E5"/><text x="65" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="205" cy="126" r="11" fill="#4F46E5"/><text x="205" y="130" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="515" cy="108" r="11" fill="#B45309"/><text x="515" y="112" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="600" cy="320" r="11" fill="#4F46E5"/><text x="600" y="324" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="355" cy="350" r="11" fill="#4F46E5"/><text x="355" y="354" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <!-- legend -->
  <text x="30" y="270" font-size="12" font-weight="bold" fill="#374151">Shapes</text>
  <rect x="30" y="280" width="30" height="16" rx="8" fill="#D1FAE5" stroke="#047857"/><text x="68" y="293" font-size="12" fill="#374151">start / end</text>
  <rect x="30" y="304" width="30" height="16" rx="3" fill="#EEF2FF" stroke="#4F46E5"/><text x="68" y="317" font-size="12" fill="#374151">screen</text>
  <polygon points="45,328 60,336 45,344 30,336" fill="#FEF3C7" stroke="#B45309"/><text x="68" y="340" font-size="12" fill="#374151">decision</text>
  <text x="30" y="395" font-size="12" fill="#374151">Dashed red = error path. A solid path from start to end is the happy path.</text>
</svg>
