<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
  <title id="t">What a Pipeline calls during fit and predict</title>
  <desc id="d">Two rows. During fit the training data flows through the scaler with fit_transform, through PCA with fit_transform, and the classifier receives the result in fit together with the target. During predict new data flows through the already fitted scaler and PCA with transform only, and the classifier returns predictions.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">What a Pipeline calls on each step</text>
  <rect x="24" y="52" width="672" height="168" rx="6" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <circle cx="46" cy="76" r="11" fill="#0F172A"/>
  <text x="46" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="66" y="81" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F766E">Pipeline.fit(X_train, y_train)</text>
  <rect x="40" y="106" width="100" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90.0" y="137.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">X_train</text>
  <text x="90.0" y="155.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">and y_train</text>
  <rect x="176" y="106" width="130" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="241.0" y="128.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">scaler</text>
  <text x="241.0" y="146.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fit_transform</text>
  <text x="241.0" y="164.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">learns mean, std</text>
  <rect x="330" y="106" width="130" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="395.0" y="128.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">pca</text>
  <text x="395.0" y="146.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fit_transform</text>
  <text x="395.0" y="164.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">learns components</text>
  <rect x="484" y="106" width="130" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="549.0" y="128.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">clf</text>
  <text x="549.0" y="146.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fit</text>
  <text x="549.0" y="164.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">learns coef_</text>
  <path d="M140 141 L172 141" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M306 141 L326 141" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M460 141 L480 141" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M614 141 L636 141" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="638" y="106" width="46" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="661.0" y="146.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">fitted</text>
  <text x="40" y="202" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Each step learns from the training rows only and hands its output to the next step.</text>
  <rect x="24" y="236" width="672" height="168" rx="6" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <circle cx="46" cy="260" r="11" fill="#0F172A"/>
  <text x="46" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="66" y="265" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#6D28D9">Pipeline.predict(X_new)</text>
  <rect x="40" y="290" width="100" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="90.0" y="321.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">X_new</text>
  <text x="90.0" y="339.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">unseen rows</text>
  <rect x="176" y="290" width="130" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="241.0" y="312.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">scaler</text>
  <text x="241.0" y="330.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">transform</text>
  <text x="241.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">reuses mean, std</text>
  <rect x="330" y="290" width="130" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="395.0" y="312.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">pca</text>
  <text x="395.0" y="330.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">transform</text>
  <text x="395.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">reuses components</text>
  <rect x="484" y="290" width="130" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="549.0" y="312.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F172A">clf</text>
  <text x="549.0" y="330.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">predict</text>
  <text x="549.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">uses coef_</text>
  <path d="M140 325 L172 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M306 325 L326 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M460 325 L480 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M614 325 L636 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="638" y="290" width="46" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="661.0" y="330.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">y_pred</text>
  <text x="40" y="386" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Fitted steps only transform; nothing is learned from the new rows.</text>
</svg>
