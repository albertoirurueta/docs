<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-android-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="460" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From app code to the GPU on Android</text>
<rect x="130" y="52" width="500" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="79.2" text-anchor="middle" font-size="12" fill="#3730A3">Your app: C++ renderer, Vulkan-Hpp or C API, shaders as SPIR-V assets</text>
<line x1="380" y1="98" x2="380" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-stack)"/>
<rect x="130" y="114" width="500" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="141.2" text-anchor="middle" font-size="12" fill="#374151">Android NDK: vulkan/vulkan.h, libvulkan.so stub, android/native_window.h</text>
<line x1="380" y1="160" x2="380" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-stack)"/>
<rect x="130" y="176" width="500" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="203.2" text-anchor="middle" font-size="12" fill="#92400E">Vulkan loader in libvulkan.so (system); implements VK_KHR_android_surface</text>
<line x1="380" y1="222" x2="380" y2="238" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-stack)"/>
<rect x="130" y="238" width="500" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="265.2" text-anchor="middle" font-size="12" fill="#374151">Optional layers: VK_LAYER_KHRONOS_validation from jniLibs or adb, GPU debug layers</text>
<line x1="380" y1="284" x2="380" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-stack)"/>
<rect x="130" y="300" width="500" height="46" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="327.2" text-anchor="middle" font-size="12" fill="#065F46">Vendor ICD: Mali, Adreno, PowerVR, other (HAL path)</text>
<line x1="380" y1="346" x2="380" y2="362" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-stack)"/>
<rect x="130" y="362" width="500" height="46" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="389.2" text-anchor="middle" font-size="12" fill="#065F46">GPU: usually a tile-based architecture</text>
<rect x="650" y="114" width="100" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="700.0" y="133.8" text-anchor="middle" font-size="11" fill="#374151">ANativeWindow</text>
<text x="700.0" y="147.8" text-anchor="middle" font-size="11" fill="#374151">from the Activity</text>
<line x1="650" y1="137" x2="632" y2="137" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-android-stack)"/>
<text x="380" y="432" text-anchor="middle" font-size="11" fill="#374151">Android supplies the loader and the WSI. You do not ship your own loader.</text>
</svg>
