<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dbg-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which tool answers which question</text>
<rect x="20" y="45" width="720" height="28" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="63.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="40" y="64" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Symptom</text>
<text x="300" y="64" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">First tool to reach for</text>
<rect x="20" y="80" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="100.8" text-anchor="middle" font-size="11" fill="#3730A3">Wrong or black image</text>
<line x1="270" y1="97" x2="295" y2="97" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="80" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="100.8" text-anchor="middle" font-size="11" fill="#374151">RenderDoc frame capture: inspect draws, textures, state</text>
<rect x="20" y="121" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="141.8" text-anchor="middle" font-size="11" fill="#3730A3">Unclear validation message</text>
<line x1="270" y1="138" x2="295" y2="138" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="121" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="141.8" text-anchor="middle" font-size="11" fill="#374151">Khronos validation, then api_dump to see the call</text>
<rect x="20" y="162" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="182.8" text-anchor="middle" font-size="11" fill="#3730A3">Bug only on another machine</text>
<line x1="270" y1="179" x2="295" y2="179" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="162" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="182.8" text-anchor="middle" font-size="11" fill="#374151">GFXReconstruct capture, replay with gfxrecon-replay there</text>
<rect x="20" y="203" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="223.8" text-anchor="middle" font-size="11" fill="#3730A3">Bug reproduced in CI or a bug report</text>
<line x1="270" y1="220" x2="295" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="203" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="223.8" text-anchor="middle" font-size="11" fill="#374151">Attach a .gfxr file; gfxrecon-info, gfxrecon-convert</text>
<rect x="20" y="244" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="264.9" text-anchor="middle" font-size="11" fill="#3730A3">Race or missing barrier</text>
<line x1="270" y1="261" x2="295" y2="261" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="244" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="264.9" text-anchor="middle" font-size="11" fill="#374151">Synchronization validation, then GPU-assisted validation</text>
<rect x="20" y="285" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="305.9" text-anchor="middle" font-size="11" fill="#3730A3">Shader prints and out-of-bounds</text>
<line x1="270" y1="302" x2="295" y2="302" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="285" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="305.9" text-anchor="middle" font-size="11" fill="#374151">Debug printf, GPU-assisted validation, RenderDoc shader debug</text>
<rect x="20" y="326" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="346.9" text-anchor="middle" font-size="11" fill="#3730A3">VK_ERROR_DEVICE_LOST</text>
<line x1="270" y1="343" x2="295" y2="343" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="326" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="346.9" text-anchor="middle" font-size="11" fill="#374151">Checkpoints, VK_EXT_device_fault, vendor crash dump tools</text>
<rect x="20" y="367" width="250" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="387.9" text-anchor="middle" font-size="11" fill="#3730A3">Slow frame</text>
<line x1="270" y1="384" x2="295" y2="384" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dbg-tool)"/>
<rect x="295" y="367" width="445" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="517.5" y="387.9" text-anchor="middle" font-size="11" fill="#374151">Timestamps, then Nsight, RGP, AGI or vendor profiler</text>
</svg>
