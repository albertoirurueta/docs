    <rect x="150" y="264" width="100" height="34" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="200" y="285">Notifications</text>
    <rect x="94" y="306" width="100" height="34" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="144" y="327">Browse genres</text>
  </g>
  <path d="M274,200 L336,200" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="305" y="190" font-size="12" fill="#374151" text-anchor="middle">sort</text>
