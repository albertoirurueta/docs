    <rect x="364" y="246" width="150" height="26" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="439" y="263">Write a review</text>
    <rect x="364" y="280" width="150" height="26" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="439" y="297">Rate a book</text>
    <rect x="556" y="218" width="170" height="118" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
