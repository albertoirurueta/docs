  <circle cx="509" cy="104" r="11" fill="#B45309"/><text x="509" y="108" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="711" cy="234" r="11" fill="#4F46E5"/><text x="711" y="238" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="380" y="380" font-size="12" fill="#374151" text-anchor="middle">Illustrative data for the Bookshelf scenario, not a real study.</text>
