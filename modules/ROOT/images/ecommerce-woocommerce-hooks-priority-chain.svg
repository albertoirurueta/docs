<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">A filter chain by priority, and what remove_action needs to match</title>
  <desc id="d">The left side shows a filter called pocket_coffee_demo with six callbacks added in the order priority 20, 10 A, 5, 10 B, PHP_INT_MAX and minus 1. WordPress runs them in ascending priority: minus 1, 5, 10 A, 10 B, 20 and PHP_INT_MAX, and callbacks with the same priority keep the order in which they were added. Each callback appends its label to the value, so the final value is start followed by the six labels in that order. The right side lists what remove_action needs to find a callback: the hook name, the same priority and the same callback, and shows five results seen when removing the New Order email trigger: a wrong priority returns false, the class name instead of the object returns false, the exact object and priority returns true, a closure cannot be matched, and remove_all_actions empties the hook.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Ascending priority, then registration order</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">apply_filters( 'pocket_coffee_demo', 'start' ) with callbacks added as 20, 10 A, 5, 10 B, PHP_INT_MAX, -1</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="86" width="150" height="40" rx="8" fill="#3d5266"/>
    <text x="52" y="111" font-weight="bold">value: start</text>
    <rect x="40" y="148" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="173">priority -1  (added 6th)</text>
    <rect x="40" y="210" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="235">priority 5  (added 3rd)</text>
    <rect x="40" y="272" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="297">priority 10 A  (added 2nd)</text>
    <rect x="40" y="334" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="359">priority 10 B  (added 4th)</text>
    <rect x="40" y="396" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="421">priority 20  (added 1st)</text>
    <rect x="40" y="458" width="190" height="40" rx="8" fill="#3a5a52"/>
    <text x="52" y="483">PHP_INT_MAX  (added 5th)</text>
  </g>
  <g stroke="#f4b860" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M115 126 L115 146"/>
    <path d="M115 188 L115 208"/>
    <path d="M115 250 L115 270"/>
    <path d="M115 312 L115 332"/>
    <path d="M115 374 L115 394"/>
    <path d="M115 436 L115 456"/>
  </g>
  <g font-size="11.5" fill="#f2f5f8">
    <text x="250" y="173">start [prio -1]</text>
    <text x="250" y="235">start [prio -1] [prio 5]</text>
    <text x="250" y="297">... [prio 5] [prio 10 A]</text>
    <text x="250" y="359">... [prio 10 A] [prio 10 B]</text>
    <text x="250" y="421">... [prio 10 B] [prio 20]</text>
    <text x="250" y="483">... [prio 20] [prio PHP_INT_MAX]</text>
  </g>

  <!-- removal -->
  <rect x="520" y="86" width="400" height="448" rx="10" fill="#34495e" stroke="#6f8aa3" stroke-width="1.5"/>
  <g font-size="12.5" fill="#f2f5f8">
    <text x="536" y="110" font-size="14" font-weight="bold">remove_action() needs three things to match</text>
    <text x="536" y="134">1. the hook name</text>
    <text x="536" y="154">2. the same priority it was added with</text>
    <text x="536" y="174">3. the same callback: same function name, or the same</text>
    <text x="554" y="192">object plus method name, or the same Closure object</text>
    <text x="536" y="224" font-size="13" font-weight="bold">What was seen on the New Order email trigger</text>
    <text x="536" y="242" font-size="11.5">hook woocommerce_order_status_pending_to_processing_notification</text>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <rect x="536" y="254" width="368" height="40" rx="6" fill="#3d5266"/>
    <text x="548" y="271">priority 5 instead of 10</text>
    <text x="548" y="287" font-weight="bold">returns false, nothing removed</text>
    <rect x="536" y="302" width="368" height="40" rx="6" fill="#3d5266"/>
    <text x="548" y="319">class name string instead of the object</text>
    <text x="548" y="335" font-weight="bold">returns false, nothing removed</text>
    <rect x="536" y="350" width="368" height="40" rx="6" fill="#3a5a52"/>
    <text x="548" y="367">the object held by WC()-&gt;mailer(), priority 10</text>
    <text x="548" y="383" font-weight="bold">returns true, callback gone</text>
    <rect x="536" y="398" width="368" height="40" rx="6" fill="#3d5266"/>
    <text x="548" y="415">a second, identical-looking closure</text>
    <text x="548" y="431" font-weight="bold">returns false, nothing removed</text>
    <rect x="536" y="446" width="368" height="40" rx="6" fill="#3d5266"/>
    <text x="548" y="463">remove_all_actions( hook )</text>
    <text x="548" y="479" font-weight="bold">hook emptied, has_action() is false</text>
    <text x="536" y="512" font-size="11.5">Run on WooCommerce 11.2.1 with wp eval-file.</text>
  </g>
</svg>
