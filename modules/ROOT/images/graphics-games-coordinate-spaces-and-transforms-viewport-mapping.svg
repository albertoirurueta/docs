<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="vm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The viewport transform: NDC to window coordinates</text>
<rect x="60" y="70" width="160" height="160" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="140" y="46" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">NDC square (x, y)</text>
<text x="60" y="248" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">(-1, -1)</text>
<text x="220" y="66" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="end">(1, 1)</text>
<circle cx="140" cy="150" r="4" fill="#4F46E5" stroke="none" stroke-width="1.5"/>
<text x="146" y="143" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">book</text>
<line x1="235" y1="150" x2="395" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#vm)"/>
<text x="315" y="130" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x_w = (x + 1) / 2 * width + x0</text>
<text x="315" y="172" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">y_w = (y + 1) / 2 * height + y0 (GL)</text>
<text x="315" y="188" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">top-left origin: use (1 - y) / 2</text>
<rect x="410" y="70" width="300" height="160" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="560" y="46" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Window rectangle (pixels)</text>
<text x="410" y="248" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start">(x0, y0) GL origin</text>
<text x="710" y="66" font-size="11" font-weight="normal" fill="#065F46" text-anchor="end">(x0 + width, y0 + height)</text>
<circle cx="560" cy="150" r="4" fill="#047857" stroke="none" stroke-width="1.5"/>
<text x="380" y="276" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Depth: z_w = z * (maxDepth - minDepth) + minDepth</text>
<line x1="60" y1="310" x2="700" y2="310" stroke="#4B5563" stroke-width="2"/>
<text x="60" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">depth 0 (near)</text>
<text x="700" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">depth 1 (far)</text>
<text x="380" y="330" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">minDepth..maxDepth from the viewport</text>
</svg>
