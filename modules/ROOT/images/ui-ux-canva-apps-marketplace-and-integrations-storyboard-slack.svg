<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Storyboard: connect Slack for launch-week feedback</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Storyboard: connect Slack for launch-week feedback</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g><rect x="22" y="88" width="120" height="196" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><text x="30" y="108" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Workspace</text><text x="30" y="128" font-size="11" fill="#374151" text-anchor="start">Apps</text><rect x="30" y="138" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/><text x="38" y="153" font-size="11" fill="#4F46E5" text-anchor="start">Add apps</text><text x="30" y="184" font-size="11" fill="#6B7280" text-anchor="start">Directory:</text><rect x="30" y="192" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="38" y="207" font-size="10" fill="#6B7280" text-anchor="start">search: Canva</text></g>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="82.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Open the Slack</text><text x="82.0" y="338" font-size="12" fill="#374151" text-anchor="middle">app directory</text>
  <g><rect x="178" y="92" width="112" height="150" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="186" y="112" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Canva (listing)</text><text x="186" y="130" font-size="10" fill="#374151" text-anchor="start">Connects your designs</text><text x="186" y="143" font-size="10" fill="#374151" text-anchor="start">and notifications.</text><rect x="186" y="196" width="96" height="22" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="234.0" y="211" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Add to Slack</text><text x="234.0" y="262" font-size="10" fill="#92400E" text-anchor="middle">May need admin</text><text x="234.0" y="275" font-size="10" fill="#92400E" text-anchor="middle">approval</text></g>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="234.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Find and add</text><text x="234.0" y="338" font-size="12" fill="#374151" text-anchor="middle">the Canva app</text>
  <g><rect x="326" y="88" width="120" height="196" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><rect x="334" y="100" width="104" height="86" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="340" y="118" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Welcome message</text><rect x="340" y="132" width="92" height="22" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="386.0" y="147" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Connect account</text><text x="340" y="172" font-size="9" fill="#6B7280" text-anchor="start">or type: connect cmd</text><rect x="334" y="200" width="104" height="50" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="340" y="218" font-size="10" fill="#374151" text-anchor="start">Log in to Canva</text><text x="340" y="232" font-size="10" fill="#374151" text-anchor="start">and allow access</text></g>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="386.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Connect your</text><text x="386.0" y="338" font-size="12" fill="#374151" text-anchor="middle">Canva account</text>
  <g><text x="482" y="106" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Notifications</text><rect x="482" y="118" width="16" height="16" rx="3" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="504" y="131" font-size="10" fill="#374151" text-anchor="start">Shared with me</text><rect x="482" y="148" width="16" height="16" rx="3" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="504" y="161" font-size="10" fill="#374151" text-anchor="start">Comment mentions</text><rect x="482" y="178" width="16" height="16" rx="3" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="504" y="191" font-size="10" fill="#374151" text-anchor="start">Replies to me</text><rect x="482" y="208" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/><text x="504" y="221" font-size="10" fill="#374151" text-anchor="start">Task assigned (off)</text><text x="482" y="262" font-size="10" fill="#6B7280" text-anchor="start">Choose in the app</text><text x="482" y="275" font-size="10" fill="#6B7280" text-anchor="start">settings command</text></g>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="538.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Pick the</text><text x="538.0" y="338" font-size="12" fill="#374151" text-anchor="middle">notifications</text>
  <g><rect x="628" y="88" width="112" height="196" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/><text x="634" y="106" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">#launch-week</text><rect x="634" y="116" width="100" height="60" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="640" y="134" font-size="10" fill="#92400E" text-anchor="start" font-weight="bold">Canva app</text><text x="640" y="148" font-size="10" fill="#374151" text-anchor="start">Comment on</text><text x="640" y="161" font-size="10" fill="#374151" text-anchor="start">Book of the week</text><rect x="634" y="184" width="100" height="30" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="640" y="203" font-size="10" fill="#374151" text-anchor="start">Design preview</text><text x="684.0" y="254" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">Open Canva from</text><text x="684.0" y="268" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">the notification</text></g>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
  <text x="684.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Feedback arrives</text><text x="684.0" y="338" font-size="12" fill="#374151" text-anchor="middle">in the channel</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of generic screens, not a screenshot of any product.</text>
</svg>
