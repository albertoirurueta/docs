<svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1a1a1a">The ai-catalog orchestration pipeline: skill -&gt; skill -&gt; agent</text>

  <!-- Row 1: skill chain -->
  <g>
    <rect x="20" y="44" width="108" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="74" y="72" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-issue</text>

    <rect x="158" y="44" width="120" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="218" y="72" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-explore</text>

    <rect x="308" y="44" width="100" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="358" y="72" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-plan</text>

    <rect x="438" y="44" width="108" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
    <text x="492" y="72" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-code</text>

    <line x1="128" y1="67" x2="156" y2="67" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="278" y1="67" x2="306" y2="67" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="408" y1="67" x2="436" y2="67" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="142" y="60" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Skill()</text>
    <text x="292" y="60" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Skill()</text>
    <text x="422" y="60" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Agent()</text>
  </g>

  <!-- Row 2: iru-code-one-task-group -->
  <rect x="357" y="128" width="270" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
  <text x="492" y="156" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-code-one-task-group</text>
  <line x1="492" y1="90" x2="492" y2="126" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="558" y="112" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Agent(iru-isolated-skill-executor)</text>

  <!-- Row 3: iru-<key>-code-one-task-group -->
  <rect x="322" y="210" width="340" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
  <text x="492" y="238" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-&lt;key&gt;-code-one-task-group</text>
  <line x1="492" y1="174" x2="492" y2="208" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="196" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Skill(&quot;iru-&lt;key&gt;-...&quot;)</text>
  <text x="492" y="272" font-size="10.5" fill="#5a5a5a" text-anchor="middle">e.g. iru-java-code-one-task-group, iru-dotnet-code-one-task-group</text>

  <!-- Fan-out dashed boundary -->
  <rect x="70" y="300" width="900" height="120" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="90" y="318" font-size="10.5" fill="#5a5a5a">fan-out: one Agent() call per task, all issued in the same response</text>

  <!-- Fan-out target boxes -->
  <g>
    <rect x="120" y="335" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="235" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="235" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task 1</text>

    <rect x="382" y="335" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="497" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="497" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task 2</text>

    <rect x="644" y="335" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="759" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="759" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task N</text>
  </g>

  <line x1="440" y1="256" x2="240" y2="333" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="256" x2="497" y2="333" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="544" y1="256" x2="750" y2="333" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fan-in into gate-runner -->
  <rect x="392" y="470" width="220" height="50" rx="6" fill="#dcefdc" stroke="#175c22" stroke-width="1.5"/>
  <text x="502" y="500" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-gate-runner (agent)</text>

  <line x1="235" y1="395" x2="470" y2="470" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <line x1="497" y1="395" x2="500" y2="468" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <line x1="759" y1="395" x2="535" y2="470" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <text x="502" y="440" font-size="10.5" fill="#5a5a5a" text-anchor="middle">fan-in: each task reports back; gate-runner validates the bucket once</text>

  <text x="502" y="546" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Skill({skill: "iru-&lt;key&gt;-test" / "-coverage" / "-code-quality"}) -- runs isolated, reports a compact summary</text>

  <!-- Durable state box -->
  <rect x="70" y="570" width="900" height="54" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="589" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Durable state lives in files, not in context: implementation_plan.md checkboxes, its "Base branch:" line, and the archived plan under .archive/</text>
  <text x="520" y="608" font-size="11.5" fill="#1a1a1a" text-anchor="middle">-- a later session (or a resumed run) recovers where the pipeline left off by re-reading them, plus the session's own TaskCreate/TaskUpdate task list</text>
</svg>
