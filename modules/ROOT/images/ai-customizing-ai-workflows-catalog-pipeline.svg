<svg viewBox="0 0 1040 750" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="750" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1a1a1a">The ai-catalog orchestration pipeline: skill -&gt; skill -&gt; agent</text>

  <!-- Row 1: iru-issue calls all three directly -->
  <g>
    <rect x="250" y="44" width="120" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="310" y="72" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-issue</text>

    <rect x="40" y="150" width="130" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="105" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-explore</text>

    <rect x="250" y="150" width="120" height="46" rx="6" fill="#dbe7f7" stroke="#14315c" stroke-width="1.5"/>
    <text x="310" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-plan</text>

    <rect x="438" y="150" width="108" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
    <text x="492" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-code</text>

    <line x1="285" y1="90" x2="110" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="310" y1="90" x2="310" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="335" y1="90" x2="488" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="178" y="112" font-size="9.5" fill="#5a5a5a" text-anchor="end">Step 5, first: Skill()</text>
    <text x="302" y="130" font-size="9.5" fill="#5a5a5a" text-anchor="end">then: Skill()</text>
    <text x="420" y="106" font-size="9.5" fill="#5a5a5a" text-anchor="start">Step 6: Agent(iru-isolated-skill-executor)</text>
  </g>

  <!-- Row 2: iru-code-one-task-group -->
  <rect x="357" y="236" width="270" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
  <text x="492" y="264" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-code-one-task-group</text>
  <line x1="492" y1="196" x2="492" y2="234" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="220" font-size="9.5" fill="#5a5a5a" text-anchor="start">Agent(iru-isolated-skill-executor)</text>

  <!-- Row 3: iru-<key>-code-one-task-group -->
  <rect x="322" y="318" width="340" height="46" rx="6" fill="#c9dcf3" stroke="#14315c" stroke-width="1.5"/>
  <text x="492" y="346" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-&lt;key&gt;-code-one-task-group</text>
  <line x1="492" y1="282" x2="492" y2="316" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="302" font-size="9.5" fill="#5a5a5a" text-anchor="start">Skill(&quot;iru-&lt;key&gt;-...&quot;)</text>
  <text x="674" y="337" font-size="10.5" fill="#5a5a5a" text-anchor="start">e.g. iru-java-code-one-task-group,</text>
  <text x="674" y="352" font-size="10.5" fill="#5a5a5a" text-anchor="start">iru-dotnet-code-one-task-group</text>

  <!-- Fan-out dashed boundary -->
  <rect x="70" y="400" width="900" height="130" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="84" y="418" font-size="10.5" fill="#5a5a5a">fan-out: one Agent() call per task, all issued in the same response</text>

  <line x1="492" y1="364" x2="492" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="432" x2="754" y2="432" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="432" x2="230" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="754" y1="432" x2="754" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fan-out target boxes -->
  <g>
    <rect x="115" y="452" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="230" y="476" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="230" y="492" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task 1</text>

    <rect x="377" y="452" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="492" y="476" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="492" y="492" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task 2</text>

    <rect x="639" y="452" width="230" height="60" rx="6" fill="#f4e3c9" stroke="#7a4a12" stroke-width="1.5"/>
    <text x="754" y="476" font-size="12" fill="#1a1a1a" text-anchor="middle">Agent(iru-isolated-</text>
    <text x="754" y="492" font-size="12" fill="#1a1a1a" text-anchor="middle">skill-executor): task N</text>
  </g>

  <!-- Fan-in into gate-runner -->
  <line x1="230" y1="512" x2="230" y2="552" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="754" y1="512" x2="754" y2="552" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="230" y1="552" x2="754" y2="552" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="492" y1="512" x2="492" y2="582" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <text x="504" y="572" font-size="10.5" fill="#5a5a5a" text-anchor="start">fan-in: each task reports back; gate-runner validates the bucket once</text>

  <rect x="382" y="584" width="220" height="50" rx="6" fill="#dcefdc" stroke="#175c22" stroke-width="1.5"/>
  <text x="492" y="614" font-size="13" fill="#1a1a1a" text-anchor="middle">iru-gate-runner (agent)</text>

  <text x="492" y="660" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Skill({skill: "iru-&lt;key&gt;-test" / "-coverage" / "-code-quality"}) -- runs isolated, reports a compact summary</text>

  <!-- Durable state box -->
  <rect x="70" y="680" width="900" height="54" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="699" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Durable state lives in files, not in context: implementation_plan.md checkboxes, its "Base branch:" line, and the archived plan under .archive/</text>
  <text x="520" y="718" font-size="11.5" fill="#1a1a1a" text-anchor="middle">-- a later session (or a resumed run) recovers where the pipeline left off by re-reading them, plus the session's own TaskCreate/TaskUpdate task list</text>
</svg>
