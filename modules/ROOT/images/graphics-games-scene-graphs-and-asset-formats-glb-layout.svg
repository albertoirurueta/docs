<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sgl-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="sgl-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="sgl-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="sgl-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Layout of the 70,776-byte bookshelf.glb container</text>
<rect x="20" y="60" width="100" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="70" y="90" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Header</text>
<text x="70" y="106" text-anchor="middle" font-size="12" fill="#374151">12 bytes</text>
<rect x="120" y="60" width="90" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="165" y="90" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">JSON head</text>
<text x="165" y="106" text-anchor="middle" font-size="12" fill="#374151">8 bytes</text>
<rect x="210" y="60" width="230" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="325" y="82" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">JSON chunk</text>
<text x="325" y="98" text-anchor="middle" font-size="12" fill="#374151">8,104 bytes of UTF-8 JSON</text>
<text x="325" y="114" text-anchor="middle" font-size="12" fill="#374151">(space padded)</text>
<rect x="440" y="60" width="90" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="485" y="90" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">BIN head</text>
<text x="485" y="106" text-anchor="middle" font-size="12" fill="#374151">8 bytes</text>
<rect x="530" y="60" width="210" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="635" y="82" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">BIN chunk</text>
<text x="635" y="98" text-anchor="middle" font-size="12" fill="#374151">62,644 bytes of binary</text>
<text x="635" y="114" text-anchor="middle" font-size="12" fill="#374151">(zero padded)</text>
<text x="380" y="152" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">12 + (8 + 8,104) + (8 + 62,644) = 70,776 bytes</text>
<rect x="20" y="175" width="330" height="130" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="35" y="197" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Header fields (little endian)</text>
<text x="35" y="220" text-anchor="start" font-size="12" fill="#374151">uint32 magic = 0x46546C67 ("glTF")</text>
<text x="35" y="240" text-anchor="start" font-size="12" fill="#374151">uint32 version = 2</text>
<text x="35" y="260" text-anchor="start" font-size="12" fill="#374151">uint32 length = 70776 (whole file)</text>
<text x="35" y="285" text-anchor="start" font-size="11" fill="#4B5563">Chunk head: uint32 length, uint32 type</text>
<rect x="380" y="175" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="395" y="197" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Chunk types</text>
<text x="395" y="220" text-anchor="start" font-size="12" fill="#374151">0x4E4F534A = "JSON": must come first</text>
<text x="395" y="240" text-anchor="start" font-size="12" fill="#374151">0x004E4942 = "BIN": optional, one at most</text>
<text x="395" y="260" text-anchor="start" font-size="12" fill="#374151">buffers[0] has no uri, so it is this chunk</text>
<text x="395" y="285" text-anchor="start" font-size="11" fill="#4B5563">Chunks start on 4-byte boundaries</text>
</svg>
