<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Signing key lifecycle and the overlap that keeps old tokens verifiable</text>

  <defs>
    <marker id="rot-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="rot-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- row labels -->
  <text x="20" y="97" font-size="12" font-weight="bold" fill="#222222">Key A</text>
  <text x="20" y="112" font-size="9.5" fill="#666666">(first key)</text>
  <text x="20" y="167" font-size="12" font-weight="bold" fill="#222222">Key B</text>
  <text x="20" y="182" font-size="9.5" fill="#666666">(its successor)</text>
  <text x="20" y="242" font-size="12" font-weight="bold" fill="#222222">JWKS</text>
  <text x="20" y="257" font-size="9.5" fill="#666666">/oauth2/jwks</text>
  <text x="20" y="312" font-size="12" font-weight="bold" fill="#222222">Tokens</text>
  <text x="20" y="327" font-size="9.5" fill="#666666">signed by key A</text>

  <!-- key A states -->
  <rect x="120" y="80" width="140" height="42" rx="5" fill="#f4f4f4" stroke="#666666" stroke-width="1.6"/>
  <text x="190" y="99" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">NEXT</text>
  <text x="190" y="113" font-size="9.5" fill="#444444" text-anchor="middle">generated, published</text>

  <rect x="260" y="80" width="300" height="42" rx="5" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="410" y="99" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">ACTIVE</text>
  <text x="410" y="113" font-size="9.5" fill="#444444" text-anchor="middle">the only key that signs (at most one, by a unique index)</text>

  <rect x="560" y="80" width="260" height="42" rx="5" fill="#fdf3e0" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="690" y="99" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">RETIRED</text>
  <text x="690" y="113" font-size="9.5" fill="#444444" text-anchor="middle">no longer signs, still published, tokens still verify</text>

  <rect x="820" y="80" width="150" height="42" rx="5" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="99" font-size="11.5" font-weight="bold" fill="#666666" text-anchor="middle">removed</text>
  <text x="895" y="113" font-size="9.5" fill="#666666" text-anchor="middle">row deleted, not published</text>

  <!-- key B states -->
  <rect x="260" y="150" width="300" height="42" rx="5" fill="#f4f4f4" stroke="#666666" stroke-width="1.6"/>
  <text x="410" y="169" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">NEXT</text>
  <text x="410" y="183" font-size="9.5" fill="#444444" text-anchor="middle">generated when key A is activated, so it is published before it signs</text>

  <rect x="560" y="150" width="410" height="42" rx="5" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="765" y="169" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">ACTIVE</text>
  <text x="765" y="183" font-size="9.5" fill="#444444" text-anchor="middle">promoted when key A is retired; a new NEXT key is generated</text>

  <!-- JWKS bars -->
  <rect x="120" y="226" width="700" height="12" rx="3" fill="#cfe0f0" stroke="#1c4b73" stroke-width="1"/>
  <text x="125" y="250" font-size="9.5" fill="#444444">key A published from NEXT until the retention ends</text>
  <rect x="260" y="262" width="710" height="12" rx="3" fill="#cfe0f0" stroke="#1c4b73" stroke-width="1"/>
  <text x="265" y="286" font-size="9.5" fill="#444444">key B published from NEXT onward</text>

  <!-- rotation instant marker -->
  <line x1="560" y1="66" x2="560" y2="395" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="560" y="60" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">rotation: A retired, B active</text>

  <!-- token lane -->
  <line x1="260" y1="322" x2="560" y2="322" stroke="#1c4b73" stroke-width="2"/>
  <text x="410" y="315" font-size="9.5" fill="#444444" text-anchor="middle">tokens issued while A is active (header kid = A)</text>
  <!-- last token -->
  <circle cx="556" cy="322" r="4.5" fill="#1c4b73"/>
  <line x1="560" y1="322" x2="640" y2="322" stroke="#666666" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#rot-arrow-grey)"/>
  <text x="600" y="342" font-size="9.5" fill="#444444" text-anchor="middle">last token of A lives for its TTL</text>

  <!-- retention bracket -->
  <line x1="560" y1="372" x2="560" y2="384" stroke="#8a5a00" stroke-width="1.5"/>
  <line x1="820" y1="372" x2="820" y2="384" stroke="#8a5a00" stroke-width="1.5"/>
  <line x1="560" y1="378" x2="820" y2="378" stroke="#8a5a00" stroke-width="1.5"/>
  <text x="690" y="400" font-size="10.5" font-weight="bold" fill="#8a5a00" text-anchor="middle">retention window</text>
  <text x="690" y="414" font-size="9.5" fill="#444444" text-anchor="middle">longest of authserver.keys.retention and (longest signed-token lifetime + clock skew)</text>

  <!-- TTL tick on axis -->
  <line x1="640" y1="352" x2="640" y2="372" stroke="#666666" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- footer notes -->
  <text x="20" y="440" font-size="10" fill="#444444">Scheduled rotation (cron, hourly check) only retires a key older than authserver.keys.rotation-interval; POST /api/admin/keys/rotate forces it.</text>
  <text x="20" y="456" font-size="10" fill="#444444">Seeded clients issue 10-minute access tokens; ID tokens (30 min) and e-mail verification tokens (24 h) also count toward the longest lifetime.</text>
</svg>
