<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs><rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Video, GIF and Lottie: where each one fits</text>
<g stroke-width="2"><rect x="20" y="50" width="220" height="230" rx="12" fill="#EEF2FF" stroke="#4F46E5"/><rect x="260" y="50" width="220" height="230" rx="12" fill="#FEF3C7" stroke="#B45309"/><rect x="500" y="50" width="220" height="230" rx="12" fill="#D1FAE5" stroke="#047857"/></g>
<g font-size="14" font-weight="bold" text-anchor="middle"><text x="130" y="76" fill="#3730A3">Video fill (in a prototype)</text><text x="370" y="76" fill="#92400E">Animated GIF</text><text x="610" y="76" fill="#047857">Lottie / dotLottie</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="130" y="105">MP4 / MOV (H.264), WebM</text><text x="130" y="127">Up to 300 MB</text><text x="130" y="149">Autoplay, loop, sound</text><text x="130" y="171">Triggers and actions</text><text x="130" y="193">Not in the mobile app</text><text x="130" y="230" font-weight="bold">Use for: demos, trailers</text>
<text x="370" y="105">Plays in presentation view</text><text x="370" y="127">Static in the editor</text><text x="370" y="149">Up to 4096 px per side</text><text x="370" y="171">No play/pause actions documented</text><text x="370" y="193">Exported as a static image</text><text x="370" y="230" font-weight="bold">Use for: tiny loops</text>
<text x="610" y="105">Exported from Figma Motion</text><text x="610" y="127">JSON, vector, scalable</text><text x="610" y="149">dotLottie: compressed bundle</text><text x="610" y="171">Handed to developers</text><text x="610" y="193">Test in your target player</text><text x="610" y="230" font-weight="bold">Use for: product UI</text></g>
<text x="370" y="310" font-size="12" fill="#374151" text-anchor="middle">Based on the Figma Learn articles listed in References; Motion is in open beta, so check the current limits.</text>
</svg>
