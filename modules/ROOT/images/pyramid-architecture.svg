<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
<title>Bookshelf Shelves architecture</title>
<defs><marker id="pa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text x="360" y="24" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Bookshelf Shelves: one Pyramid application</text>
<text x="360" y="42" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">a synchronous WSGI app, from browsers and API clients down to the database</text>
<rect x="30" y="62" width="200" height="44" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="130.0" y="81.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Browser</text>
<text x="130.0" y="96.0" font-size="10" fill="currentColor" text-anchor="middle">HTML pages, forms, CSRF token</text>
<rect x="250" y="62" width="200" height="44" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="350.0" y="81.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">API client</text>
<text x="350.0" y="96.0" font-size="10" fill="currentColor" text-anchor="middle">JSON under /api/books/{id}</text>
<rect x="470" y="62" width="220" height="44" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="580.0" y="81.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Operator</text>
<text x="580.0" y="96.0" font-size="10" fill="currentColor" text-anchor="middle">pserve, p-scripts, Alembic</text>
<line x1="130" y1="106" x2="130" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<line x1="350" y1="106" x2="350" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="30" y="128" width="420" height="40" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="145.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">nginx reverse proxy</text>
<text x="240.0" y="160.0" font-size="10" fill="currentColor" text-anchor="middle">TLS, static files, X-Forwarded-* headers</text>
<line x1="240" y1="168" x2="240" y2="186" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="30" y="188" width="420" height="40" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="205.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Waitress or Gunicorn</text>
<text x="240.0" y="220.0" font-size="10" fill="currentColor" text-anchor="middle">WSGI server calling the router with environ and start_response</text>
<line x1="240" y1="228" x2="240" y2="246" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="20" y="246" width="680" height="228" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="34" y="264" font-size="11" font-weight="bold" fill="currentColor" text-anchor="start">Pyramid application: Configurator, scan and include</text>
<rect x="34" y="274" width="300" height="36" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="184.0" y="289.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Tweens</text>
<text x="184.0" y="304.0" font-size="10" fill="currentColor" text-anchor="middle">timing, pyramid_retry, pyramid_tm, excview</text>
<rect x="34" y="322" width="142" height="48" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="105.0" y="343.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">URL dispatch</text>
<text x="105.0" y="358.0" font-size="10" fill="currentColor" text-anchor="middle">/api/books/{id}</text>
<rect x="192" y="322" width="142" height="48" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="263.0" y="343.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Traversal</text>
<text x="263.0" y="358.0" font-size="10" fill="currentColor" text-anchor="middle">/shelves/{shelf}/{book}</text>
<line x1="105" y1="310" x2="105" y2="322" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<line x1="263" y1="310" x2="263" y2="322" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="34" y="382" width="300" height="40" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="184.0" y="399.0" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Security policy and ACLs</text>
<text x="184.0" y="414.0" font-size="10" fill="currentColor" text-anchor="middle">AuthTktCookieHelper, __acl__ inherited from the shelf</text>
<line x1="184" y1="370" x2="184" y2="382" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="34" y="430" width="300" height="36" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="184.0" y="445.0" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Views and renderers</text>
<text x="184.0" y="460.0" font-size="10" fill="currentColor" text-anchor="middle">json with __json__, Jinja2 via pyramid_jinja2</text>
<line x1="184" y1="422" x2="184" y2="430" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="354" y="274" width="150" height="92" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="429" y="306" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Forms and CSRF</text>
<text x="429" y="320" font-size="10" fill="currentColor" text-anchor="middle">Colander schemas</text>
<text x="429" y="334" font-size="10" fill="currentColor" text-anchor="middle">Deform widgets</text>
<text x="429" y="348" font-size="10" fill="currentColor" text-anchor="middle">CSRF checked per view</text>
<rect x="520" y="274" width="170" height="92" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="605.0" y="311" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">i18n and assets</text>
<text x="605.0" y="329" font-size="10" fill="currentColor" text-anchor="middle">English and Spanish</text>
<text x="605" y="347" font-size="10" fill="currentColor" text-anchor="middle">static view, cache busting</text>
<rect x="354" y="382" width="336" height="84" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="522.0" y="421.0" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Development extras</text>
<text x="522.0" y="436.0" font-size="10" fill="currentColor" text-anchor="middle">debug toolbar (never in production), WebTest</text>
<line x1="334" y1="448" x2="354" y2="448" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<line x1="184" y1="474" x2="184" y2="494" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="30" y="496" width="300" height="44" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
<text x="180.0" y="515.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">SQLAlchemy 2.0 session</text>
<text x="180.0" y="530.0" font-size="10" fill="currentColor" text-anchor="middle">zope.sqlalchemy joins the pyramid_tm transaction</text>
<line x1="330" y1="518" x2="360" y2="518" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
<rect x="360" y="496" width="150" height="44" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="435.0" y="515.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Database</text>
<text x="435.0" y="530.0" font-size="10" fill="currentColor" text-anchor="middle">users, shelves, books</text>
<rect x="530" y="496" width="160" height="44" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="610.0" y="515.0" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Alembic</text>
<text x="610.0" y="530.0" font-size="10" fill="currentColor" text-anchor="middle">revisions and upgrade head</text>
<line x1="530" y1="518" x2="510" y2="518" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
</svg>
