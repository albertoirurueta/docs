<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metal-cpp-and-game-porting-ownership" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">metal-cpp ownership: who must call release</text>
<rect x="30" y="55" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130.0" y="86.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">alloc, new, copy,</text>
<text x="130.0" y="101.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">mutableCopy, Create</text>
<rect x="280" y="55" width="200" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="86.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">you own it</text>
<text x="380.0" y="101.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">retain count 1</text>
<rect x="530" y="55" width="200" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="86.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">call release()</text>
<text x="630.0" y="101.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">when you are done</text>
<line x1="232" y1="90" x2="278" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-ownership)"/>
<line x1="482" y1="90" x2="528" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-ownership)"/>
<rect x="30" y="160" width="200" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="191.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">any other method</text>
<text x="130.0" y="205.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(commandBuffer, nextDrawable)</text>
<rect x="280" y="160" width="200" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="191.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">autoreleased</text>
<text x="380.0" y="206.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">not owned by you</text>
<rect x="530" y="160" width="200" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="191.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">drained with the</text>
<text x="630.0" y="206.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">NS::AutoreleasePool</text>
<line x1="232" y1="195" x2="278" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-ownership)"/>
<line x1="482" y1="195" x2="528" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-cpp-and-game-porting-ownership)"/>
<rect x="30" y="265" width="340" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="200.0" y="289.9" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">NS::SharedPtr (optional)</text>
<text x="200.0" y="303.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">TransferPtr takes ownership, RetainPtr shares it</text>
<rect x="400" y="265" width="330" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="289.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Extra threads need their own pool</text>
<text x="565.0" y="303.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">main thread: usually one pool per frame</text>
<text x="380" y="342" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">OBJC_DEBUG_MISSING_POOLS=YES warns about autoreleased objects with no pool.</text>
</svg>
