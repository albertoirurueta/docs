<svg viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Build the reading-progress widget in four steps</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
<rect x="20" y="50" width="160" height="200" rx="10"/><rect x="200" y="50" width="160" height="200" rx="10"/><rect x="380" y="50" width="160" height="200" rx="10"/><rect x="560" y="50" width="180" height="200" rx="10"/></g>
<g fill="#4F46E5"><circle cx="32" cy="62" r="11"/><circle cx="212" cy="62" r="11"/><circle cx="392" cy="62" r="11"/><circle cx="572" cy="62" r="11"/></g>
<g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="32" y="66">1</text><text x="212" y="66">2</text><text x="392" y="66">3</text><text x="572" y="66">4</text></g>
<!-- panel 1: new widget dialog -->
<rect x="40" y="85" width="120" height="90" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
<rect x="50" y="95" width="100" height="14" rx="3" fill="#E5E7EB"/>
<rect x="50" y="118" width="100" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5"/>
<rect x="50" y="141" width="100" height="14" rx="3" fill="#E5E7EB"/>
<text x="100" y="129" font-size="11" fill="#3730A3" text-anchor="middle">Simple widget</text>
<!-- panel 2: code -->
<rect x="215" y="85" width="130" height="90" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
<g fill="#9CA3AF"><rect x="225" y="95" width="60" height="6" rx="2"/><rect x="235" y="108" width="80" height="6" rx="2"/><rect x="235" y="121" width="50" height="6" rx="2"/><rect x="235" y="134" width="90" height="6" rx="2"/><rect x="225" y="147" width="40" height="6" rx="2"/></g>
<!-- panel 3: widget on board -->
<rect x="395" y="85" width="130" height="90" rx="6" fill="#FFFBEB" stroke="#E5E7EB"/>
<rect x="410" y="105" width="100" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
<text x="460" y="125" font-size="11" fill="#3730A3" text-anchor="middle">Dune</text>
<rect x="420" y="136" width="80" height="8" rx="4" fill="#E5E7EB"/><rect x="420" y="136" width="32" height="8" rx="4" fill="#4F46E5"/>
<!-- panel 4: property menu -->
<rect x="580" y="85" width="140" height="90" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
<rect x="590" y="95" width="120" height="16" rx="3" fill="#FFFFFF" stroke="#4F46E5"/><text x="650" y="107" font-size="11" fill="#3730A3" text-anchor="middle">Add 10 pages</text>
<line x1="590" y1="120" x2="710" y2="120" stroke="#E5E7EB"/>
<g><circle cx="605" cy="138" r="7" fill="#4F46E5"/><circle cx="627" cy="138" r="7" fill="#B45309"/><circle cx="649" cy="138" r="7" fill="#047857"/></g>
<rect x="590" y="152" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#E5E7EB"/>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="100" y="200">Create the widget</text><text x="100" y="216">in the desktop app</text>
<text x="280" y="200">Edit code.tsx and</text><text x="280" y="216">run the watch build</text>
<text x="460" y="200">Insert it on a</text><text x="460" y="216">FigJam board</text>
<text x="650" y="200">Add the property</text><text x="650" y="216">menu and iterate</text></g>
<g stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"><line x1="182" y1="150" x2="198" y2="150"/><line x1="362" y1="150" x2="378" y2="150"/><line x1="542" y1="150" x2="558" y2="150"/></g>
<text x="380" y="278" font-size="12" fill="#4B5563" text-anchor="middle">Widget development and testing happen in the Figma desktop app.</text>
