<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ip-choice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Choosing between MPS, MPSGraph and your own kernel</text>
<rect x="20" y="55" width="230" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="112.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MPS image kernel</text>
<text x="135.0" y="128.0" text-anchor="middle" font-size="12" fill="#3730A3">Tuned by Apple per GPU</text>
<text x="135.0" y="144.0" text-anchor="middle" font-size="12" fill="#3730A3">Blur, Sobel, scale, histogram</text>
<text x="135.0" y="160.0" text-anchor="middle" font-size="12" fill="#3730A3">Encodes into MTLCommandBuffer</text>
<text x="135.0" y="176.0" text-anchor="middle" font-size="12" fill="#3730A3">Fixed set of operations</text>
<rect x="263" y="55" width="230" height="170" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="378.0" y="112.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MPSGraph</text>
<text x="378.0" y="128.0" text-anchor="middle" font-size="12" fill="#065F46">Tensors and operators</text>
<text x="378.0" y="144.0" text-anchor="middle" font-size="12" fill="#065F46">Fuses and compiles a graph</text>
<text x="378.0" y="160.0" text-anchor="middle" font-size="12" fill="#065F46">Runs on Metal 3 or Metal 4 queues</text>
<text x="378.0" y="176.0" text-anchor="middle" font-size="12" fill="#065F46">Best for ML and math on arrays</text>
<rect x="506" y="55" width="230" height="170" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="621.0" y="112.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Custom compute kernel</text>
<text x="621.0" y="128.0" text-anchor="middle" font-size="12" fill="#92400E">Any effect you can write in MSL</text>
<text x="621.0" y="144.0" text-anchor="middle" font-size="12" fill="#92400E">Fuse several steps in one pass</text>
<text x="621.0" y="160.0" text-anchor="middle" font-size="12" fill="#92400E">Works with either encoder family</text>
<text x="621.0" y="176.0" text-anchor="middle" font-size="12" fill="#92400E">You own tuning and edge cases</text>
<rect x="20" y="245" width="710" height="95" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="375.0" y="281.0" text-anchor="middle" font-size="11" fill="#374151">Rule of thumb: start with an MPS kernel when one exists; move to a custom kernel when you need to fuse steps or</text>
<text x="375.0" y="296.0" text-anchor="middle" font-size="11" fill="#374151">sample unusual formats; reach for MPSGraph when the work is tensor math or a neural network.</text>
<text x="375.0" y="311.0" text-anchor="middle" font-size="11" fill="#374151">Mixing is normal: an MPS blur between two of your own kernels is a typical frame.</text>
</svg>
