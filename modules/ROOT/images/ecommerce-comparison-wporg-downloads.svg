<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 502" width="860" height="502" role="img" aria-labelledby="wporg-downloads-t wporg-downloads-d">
<title id="wporg-downloads-t">WooCommerce downloads per week on WordPress.org</title>
<desc id="wporg-downloads-d">Weekly downloads of the WooCommerce plugin from WordPress.org for the complete Monday-to-Sunday weeks of the last 180 days (the API returns no longer window), from early May to late October 2026. Downloads include automatic updates of existing installs, so peaks follow release days. Active installs are only published as the rounded band 7,000,000+.</desc>
