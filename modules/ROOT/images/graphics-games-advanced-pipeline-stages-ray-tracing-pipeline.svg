<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Ray tracing pipeline: shaders around the hardware traversal</text>
<rect x="30" y="60" width="170" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="81.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Ray generation</text>
<text x="115.0" y="96.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">calls traceRay</text>
<rect x="250" y="60" width="230" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="365.0" y="81.5" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Traversal</text>
<text x="365.0" y="96.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">TLAS then BLAS, hardware</text>
<line x1="200" y1="85" x2="250" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#rt)"/>
<rect x="520" y="50" width="210" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="72.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Intersection (custom shapes)</text>
<rect x="520" y="94" width="210" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="116.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Any-hit (alpha test, skip)</text>
<line x1="480" y1="76" x2="520" y2="68" stroke="#4B5563" stroke-width="1.5" marker-end="url(#rt)"/>
<line x1="480" y1="96" x2="520" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#rt)"/>
<rect x="250" y="170" width="230" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="365.0" y="191.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Closest-hit</text>
<text x="365.0" y="206.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">shade the nearest hit</text>
<rect x="520" y="170" width="210" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="625.0" y="191.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Miss</text>
<text x="625.0" y="206.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">sky colour, or visible</text>
<line x1="365" y1="110" x2="365" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#rt)"/>
<text x="372" y="143" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">hit</text>
<path d="M 440,110 L 440,150 L 625,150 L 625,170" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#rt)"/>
<text x="530" y="144" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">no hit</text>
<path d="M 365,220 L 365,245 L 115,245 L 115,110" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rt)"/>
<text x="240" y="262" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">payload returns to the ray generation shader</text>
<rect x="30" y="290" width="700" height="90" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="312" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Shader binding table (Vulkan), shader table (DXR): records the hardware looks up per hit</text>
<rect x="50" y="328" width="110" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="105.0" y="350" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">raygen record</text>
<rect x="175" y="328" width="110" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="230.0" y="350" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">miss records</text>
<rect x="300" y="328" width="300" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="450.0" y="350" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">hit group: closest-hit + any-hit + intersection</text>
<rect x="615" y="328" width="110" height="36" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="670.0" y="350" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">callable records</text>
</svg>
