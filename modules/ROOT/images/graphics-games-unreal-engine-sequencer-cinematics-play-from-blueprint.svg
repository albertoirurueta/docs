<text x="380" y="205" text-anchor="middle" font-size="11" fill="#374151">Set Disable Movement Input, Hide Player and Hide HUD in the Settings struct,</text>
<text x="380" y="221" text-anchor="middle" font-size="11" fill="#374151">and bind the Return Value event On Finished to hand control back to the player.</text>
<text x="380" y="255" text-anchor="middle" font-size="11" fill="#374151">The C++ version is ABookshelfCinematicTrigger below.</text>
</svg>
