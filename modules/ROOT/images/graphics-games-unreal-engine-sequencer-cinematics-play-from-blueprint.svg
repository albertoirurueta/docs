<text x="317.5" y="66" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Create Level Sequence Player</text>
<circle cx="205" cy="88" r="4" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="215" y="92" text-anchor="start" font-size="10" fill="#374151">Exec</text>
