<circle cx="205" cy="128" r="4" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="215" y="132" text-anchor="start" font-size="10" fill="#374151">Settings</text>
<circle cx="430" cy="148" r="4" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="420" y="152" text-anchor="end" font-size="10" fill="#374151">Return Value</text>
<rect x="465" y="50" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
