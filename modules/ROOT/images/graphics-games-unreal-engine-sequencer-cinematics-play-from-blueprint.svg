<circle cx="465" cy="108" r="4" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="475" y="112" text-anchor="start" font-size="10" fill="#374151">Exec</text>
<rect x="620" y="50" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<rect x="620" y="50" width="120" height="24" rx="8" fill="#047857" stroke="#047857" stroke-width="1.5"/>
