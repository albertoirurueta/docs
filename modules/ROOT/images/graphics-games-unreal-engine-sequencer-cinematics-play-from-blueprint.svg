<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Blueprint equivalent: play a Level Sequence from a trigger</text>
<rect x="20" y="50" width="150" height="90" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="20" y="50" width="150" height="24" rx="8" fill="#B45309" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="66" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">On Component Begin</text>
<circle cx="170" cy="88" r="4" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="160" y="92" text-anchor="end" font-size="10" fill="#374151">Exec</text>
<circle cx="170" cy="108" r="4" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="160" y="112" text-anchor="end" font-size="10" fill="#374151">Other Actor</text>
