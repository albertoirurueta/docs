<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: an Add to shelf button, then a book card</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/>
  </g>
  <g fill="#4B5563" stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- panel 1: text + rectangle -->
  <rect x="42" y="110" width="80" height="34" rx="6" fill="#4F46E5"/><text x="82" y="132" font-size="11" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- panel 2: auto layout added, padding handles -->
  <rect x="178" y="106" width="112" height="42" rx="6" fill="#4F46E5"/><rect x="194" y="114" width="80" height="26" rx="2" fill="none" stroke="#FEF3C7" stroke-dasharray="3 3"/><text x="234" y="131" font-size="11" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <text x="234" y="170" font-size="11" fill="#92400E" text-anchor="middle">padding 16 / 8</text>
  <!-- panel 3: card pieces -->
  <rect x="340" y="76" width="92" height="64" rx="6" fill="#E5E7EB"/><rect x="340" y="152" width="70" height="10" rx="3" fill="#9CA3AF"/><rect x="340" y="170" width="50" height="8" rx="3" fill="#D1D5DB"/><rect x="340" y="190" width="92" height="28" rx="6" fill="#4F46E5"/><text x="386" y="208" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <!-- panel 4: vertical auto layout, gap -->
  <rect x="484" y="70" width="108" height="170" rx="8" fill="#EEF2FF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="494" y="80" width="88" height="54" rx="6" fill="#E5E7EB"/><rect x="494" y="146" width="66" height="10" rx="3" fill="#9CA3AF"/><rect x="494" y="164" width="46" height="8" rx="3" fill="#D1D5DB"/><rect x="494" y="190" width="88" height="28" rx="6" fill="#4F46E5"/>
  <text x="538" y="232" font-size="10" fill="#92400E" text-anchor="middle">vertical, gap 8</text>
  <!-- panel 5: row of cards in horizontal flow -->
  <rect x="628" y="96" width="112" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <rect x="634" y="104" width="44" height="104" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="688" y="104" width="46" height="104" rx="4" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="684" y="232" font-size="10" fill="#92400E" text-anchor="middle">horizontal row</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Rectangle and</text><text x="82" y="338">text, no layout</text><text x="234" y="322">Shift A: button</text><text x="234" y="338">hugs its label</text><text x="386" y="322">Cover, title,</text><text x="386" y="338">author, button</text><text x="538" y="322">Shift A again:</text><text x="538" y="338">stack with a gap</text><text x="684" y="322">Cards nested in</text><text x="684" y="338">a parent row</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked against the Figma Learn auto layout article on 2026-10-30.</text>
</svg>
