<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-uan-blend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A 2D Freeform Directional blend tree</text>
<rect x="60" y="60" width="320" height="320" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<line x1="60" y1="284.0" x2="380" y2="284.0" stroke="#E5E7EB" stroke-width="1.2"/>
<line x1="220.0" y1="60" x2="220.0" y2="380" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="374" y="318.0" text-anchor="end" font-size="10" fill="#4B5563">velocityX (right)</text>
<text x="66" y="76" text-anchor="start" font-size="10" fill="#4B5563">velocityZ (up)</text>
<circle cx="220.0" cy="284.0" r="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<circle cx="220.0" cy="218.0" r="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<circle cx="220.0" cy="116.80000000000001" r="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<circle cx="120.0" cy="284.0" r="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<circle cx="320.0" cy="284.0" r="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<circle cx="220.0" cy="336.8" r="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<circle cx="220.0" cy="284.0" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="220.0" y="302.0" text-anchor="middle" font-size="10" fill="#3730A3">Idle</text>
<circle cx="220.0" cy="218.0" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="220.0" y="236.0" text-anchor="middle" font-size="10" fill="#3730A3">WalkFwd</text>
<circle cx="220.0" cy="116.80000000000001" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="220.0" y="106.80000000000001" text-anchor="middle" font-size="10" fill="#3730A3">RunFwd</text>
<circle cx="120.0" cy="284.0" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="120.0" y="302.0" text-anchor="middle" font-size="10" fill="#3730A3">StrafeL</text>
<circle cx="320.0" cy="284.0" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="320.0" y="302.0" text-anchor="middle" font-size="10" fill="#3730A3">StrafeR</text>
<circle cx="220.0" cy="336.8" r="5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="220.0" y="354.8" text-anchor="middle" font-size="10" fill="#3730A3">WalkBack</text>
<circle cx="270.0" cy="178.4" r="7" fill="#DC2626" stroke="#B91C1C" stroke-width="1.5"/>
<text x="282.0" y="182.4" text-anchor="start" font-size="10" fill="#B91C1C">parameters (1.0, 2.4)</text>
<line x1="270.0" y1="178.4" x2="220.0" y2="218.0" stroke="#B91C1C" stroke-width="1" marker-end="url(#ah-uan-blend)" stroke-dasharray="3 2"/>
<line x1="270.0" y1="178.4" x2="220.0" y2="116.80000000000001" stroke="#B91C1C" stroke-width="1" marker-end="url(#ah-uan-blend)" stroke-dasharray="3 2"/>
<line x1="270.0" y1="178.4" x2="320.0" y2="284.0" stroke="#B91C1C" stroke-width="1" marker-end="url(#ah-uan-blend)" stroke-dasharray="3 2"/>
<rect x="410" y="60" width="330" height="126" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575" y="82" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Blend Tree settings</text>
<text x="424" y="104" text-anchor="start" font-size="11" fill="#374151">Blend Type: 2D Freeform Directional</text>
<text x="424" y="122" text-anchor="start" font-size="11" fill="#374151">Parameters: velocityX, velocityZ</text>
<text x="424" y="140" text-anchor="start" font-size="11" fill="#374151">Motions and positions (Pos X, Pos Y):</text>
<text x="424" y="158" text-anchor="start" font-size="11" fill="#374151">Idle (0, 0), WalkFwd (0, 1.5), RunFwd (0, 3.8)</text>
<text x="424" y="176" text-anchor="start" font-size="11" fill="#374151">StrafeL (-2, 0), StrafeR (2, 0), WalkBack (0, -1.2)</text>
<rect x="410" y="200" width="330" height="116" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="575" y="222" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Reading the diagram</text>
<text x="424" y="244" text-anchor="start" font-size="11" fill="#374151">Each motion has an influence field that is full under</text>
<text x="424" y="260" text-anchor="start" font-size="11" fill="#374151">its own dot and fades towards the others. The red dot</text>
<text x="424" y="276" text-anchor="start" font-size="11" fill="#374151">is the current parameter pair; the weights of the</text>
<text x="424" y="292" text-anchor="start" font-size="11" fill="#374151">nearby motions sum to 1, so the pose is a mix of</text>
<text x="424" y="308" text-anchor="start" font-size="11" fill="#374151">WalkFwd, RunFwd and StrafeR.</text>
<rect x="410" y="330" width="330" height="56" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="425" y="350" text-anchor="start" font-size="11" fill="#92400E">Freeform needs an Idle at (0, 0). Use Simple Directional</text>
<text x="425" y="364" text-anchor="start" font-size="11" fill="#92400E">for one motion per direction, Freeform Cartesian when</text>
<text x="425" y="378" text-anchor="start" font-size="11" fill="#92400E">the axes are not directions (speed and turn).</text>
</svg>
