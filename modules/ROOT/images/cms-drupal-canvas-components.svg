<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Component sources feeding the Canvas editor</title>
  <desc id="d">Four component sources on the left (SDC components from themes and modules, block plugins, in-browser code components and code components pushed from a local codebase) flow into the Canvas component library, which the editor uses to compose pages and content templates. The result is rendered by Drupal when coupled, or by a decoupled front end when headless.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>

  <text x="20" y="28" font-weight="bold" fill="#263238" font-size="15">Component sources</text>
  <text x="350" y="28" font-weight="bold" fill="#263238" font-size="15">Canvas</text>
  <text x="680" y="28" font-weight="bold" fill="#263238" font-size="15">Rendering</text>

  <!-- sources -->
  <rect x="20" y="45" width="270" height="95" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="34" y="68" font-weight="bold" fill="#0d47a1">SDC components</text>
  <text x="34" y="88" fill="#263238">meridian theme: card, hero,</text>
  <text x="34" y="106" fill="#263238">exhibition-teaser, opening-hours</text>
  <text x="34" y="124" fill="#263238">*.component.yml + Twig, JSON Schema props</text>

  <rect x="20" y="155" width="270" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="34" y="178" font-weight="bold" fill="#1b5e20">Block plugins</text>
  <text x="34" y="198" fill="#263238">Blocks from modules, for example</text>
  <text x="34" y="216" fill="#263238">meridian_collection "On display now"</text>

  <rect x="20" y="250" width="270" height="105" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="34" y="273" font-weight="bold" fill="#8d6e00">Code components (in browser)</text>
  <text x="34" y="293" fill="#263238">JSX + CSS written in the Canvas</text>
  <text x="34" y="311" fill="#263238">code editor, stored as config</text>
  <text x="34" y="329" fill="#263238">entities, rendered with Preact</text>

  <rect x="20" y="370" width="270" height="105" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="34" y="393" font-weight="bold" fill="#8d6e00">Code components (local codebase)</text>
  <text x="34" y="413" fill="#263238">Git repository, npm packages,</text>
  <text x="34" y="431" fill="#263238">Workbench preview, then</text>
  <text x="34" y="449" fill="#263238">npx canvas push / pull</text>

  <!-- Canvas -->
  <rect x="340" y="95" width="230" height="330" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="455" y="122" text-anchor="middle" font-weight="bold" fill="#4a148c">Component library</text>
  <text x="455" y="142" text-anchor="middle" fill="#263238">enabled components only</text>
  <rect x="360" y="160" width="190" height="42" rx="5" fill="#ffffff" stroke="#6a1b9a"/>
  <text x="455" y="186" text-anchor="middle" fill="#4a148c">Editor: layers, props, slots</text>
  <rect x="360" y="215" width="190" height="42" rx="5" fill="#ffffff" stroke="#6a1b9a"/>
  <text x="455" y="241" text-anchor="middle" fill="#4a148c">Pages (Canvas Page entity)</text>
  <rect x="360" y="270" width="190" height="42" rx="5" fill="#ffffff" stroke="#6a1b9a"/>
  <text x="455" y="296" text-anchor="middle" fill="#4a148c">Content templates</text>
  <rect x="360" y="325" width="190" height="42" rx="5" fill="#ffffff" stroke="#6a1b9a"/>
  <text x="455" y="351" text-anchor="middle" fill="#4a148c">Patterns, page templates</text>
  <text x="455" y="398" text-anchor="middle" fill="#263238">optional AI assistant</text>
  <text x="455" y="414" text-anchor="middle" fill="#263238">(canvas_ai + AI module)</text>

  <!-- outputs -->
  <rect x="640" y="95" width="240" height="140" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="654" y="120" font-weight="bold" fill="#263238">Coupled</text>
  <text x="654" y="142" fill="#263238">Drupal renders the component</text>
  <text x="654" y="160" fill="#263238">tree with the active theme;</text>
  <text x="654" y="178" fill="#263238">SDCs through Twig, code</text>
  <text x="654" y="196" fill="#263238">components through Preact</text>
  <text x="654" y="214" fill="#263238">with server-side rendering</text>

  <rect x="640" y="285" width="240" height="140" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="654" y="310" font-weight="bold" fill="#263238">Headless</text>
  <text x="654" y="332" fill="#263238">canvas_headless embeds a front</text>
  <text x="654" y="350" fill="#263238">end app (Next.js, Astro, Nuxt)</text>
  <text x="654" y="368" fill="#263238">in the editor; the app fetches</text>
  <text x="654" y="386" fill="#263238">the component tree and renders</text>
  <text x="654" y="404" fill="#263238">its own components</text>

  <!-- arrows -->
  <path d="M290 92 L340 150" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M290 195 L340 200" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M290 302 L340 280" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M290 422 L340 340" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M570 200 L640 165" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M570 320 L640 350" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <text x="20" y="505" fill="#546e7a" font-size="12">Fictitious Meridian Museum examples. Original drawing.</text>
</svg>
