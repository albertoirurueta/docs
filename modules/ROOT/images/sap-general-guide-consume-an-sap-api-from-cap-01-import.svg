<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 444" width="1080" height="444" role="img" aria-labelledby="sap-general-guide-consume-an-sap-api-from-cap-01-import-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-consume-an-sap-api-from-cap-01-import-title">Terminal with the three commands of the first phase: cds init partners-s4 with the option nodejs and npm install, then curl that saves API_BUSINESS_PARTNER.edmx, whose size wc reports as 695017 bytes, then cds import with the option as cds, which reports that it updated package.json and imported the API to srv/external/API_BUSINESS_PARTNER; callout 1 marks cds init, callout 2 marks the curl download and callout 3 marks cds import</title>
<g><rect x="0" y="0" width="1080" height="444" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="412" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cds init partners-s4 --nodejs</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Adding facet: nodejs</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Successfully initialized CAP project</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Continue with: code partners-s4</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cd partners-s4 &amp;&amp; npm install</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">added 72 packages, and audited 73 packages in 473ms</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">found 0 vulnerabilities</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sSL -o API_BUSINESS_PARTNER.edmx \</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  https://raw.githubusercontent.com/capire/s4/main/srv/external/API_BUSINESS_PARTNER.edmx</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ wc -c API_BUSINESS_PARTNER.edmx</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  695017 API_BUSINESS_PARTNER.edmx</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cds import API_BUSINESS_PARTNER.edmx --as cds</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">[cds] - updated ./package.json</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">[cds] - imported API to srv/external/API_BUSINESS_PARTNER</text>
<text x="16" y="377" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&gt; use it in your CDS models through the likes of:</text>
<text x="16" y="398" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="419" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">using { API_BUSINESS_PARTNER as external } from './external/API_BUSINESS_PARTNER';</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<rect x="5" y="193" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="193" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="198" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<rect x="5" y="277" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="277" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="282" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g></g>
</svg>
