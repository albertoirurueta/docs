<text x="385" y="298" text-anchor="middle" font-size="13" fill="#047857" font-weight="bold">Collision on tilemaps</text>
<text x="385" y="318" text-anchor="middle" font-size="11" fill="#374151">Tilemap Collider 2D makes one shape per tile; with Composite Operation set to Merge and a Composite Collider 2D (on a Static Rigidbody 2D)</text>
<text x="385" y="333" text-anchor="middle" font-size="11" fill="#374151">the shapes merge into a few outlines, so there are fewer shapes to simulate and no seams for a character to catch on.</text>
