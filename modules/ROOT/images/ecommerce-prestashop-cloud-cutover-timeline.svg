<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Cutover timeline of the Pocket Coffee PrestaShop shop</title>
  <desc id="d">A timeline in three lanes. The top lane is the old single server of Pocket Coffee: it serves and takes orders until the freeze, then runs in maintenance mode (PS_SHOP_ENABLE set to 0, answering 503 with Retry-After) with its crontab removed, and it stays unchanged for seven days as the rollback. The middle lane is the new EKS stack: days before, the images of img, upload and download are pre-copied to the EFS volume and the DNS TTL is lowered; after the freeze the final dump is imported into RDS (or the AWS DMS task is stopped at lag zero), the files are synchronised again, parameters.php is rendered with the old cookie keys, the pods start and the checks and a smoke test through the load balancer run; then DNS is switched and the CronJob is resumed. The bottom lane is the payment provider: callbacks that reach the old server during the freeze receive a 503 and are retried by the provider until the new shop answers after the DNS switch, so that no paid order is lost and none is created on both sides.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">One side takes orders at any moment: freeze, copy, check, switch</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Cutover of www.pocketcoffee.example from one server to EKS and RDS; the order of the steps matters more than the clock</text>

  <!-- time axis -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <line x1="150" y1="92" x2="930" y2="92" stroke="#6f8aa3" stroke-width="2" marker-end="url(#b)"/>
    <text x="230" y="84">T-7 d to T-48 h</text>
    <text x="470" y="84">T-0 freeze</text>
    <text x="580" y="84">T+10 to 15 min</text>
    <text x="690" y="84">T+25 min</text>
    <text x="880" y="84">T+7 d</text>
  </g>

  <!-- lane labels -->
  <g font-size="13" font-weight="bold" fill="#f4b860">
    <text x="40" y="150">Old server</text>
    <text x="40" y="300">EKS and RDS</text>
    <text x="40" y="450">Provider</text>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <text x="40" y="168">Apache, PHP, local DB</text>
    <text x="40" y="318">pocketcoffee-*</text>
    <text x="40" y="468">payment callbacks</text>
  </g>

  <!-- old server lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="116" width="310" height="64" rx="9" fill="#4d7c5a"/>
    <text x="305" y="140" font-weight="bold">Serving and taking orders</text>
    <text x="305" y="158">DNS TTL lowered to 60 s at T-48 h</text>
    <text x="305" y="174">first copy of img, upload and download</text>
    <rect x="470" y="116" width="215" height="64" rx="9" fill="#7a5c3a"/>
    <text x="577" y="140" font-weight="bold">Frozen</text>
    <text x="577" y="158">PS_SHOP_ENABLE=0, 503 answers</text>
    <text x="577" y="174">crontab removed, final dump</text>
    <rect x="695" y="116" width="235" height="64" rx="9" fill="#3d5266"/>
    <text x="812" y="140" font-weight="bold">Unchanged rollback copy</text>
    <text x="812" y="158">nothing scheduled, nothing written</text>
    <text x="812" y="174">kept 7 days, then retired</text>
  </g>

  <!-- EKS lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="266" width="310" height="64" rx="9" fill="#3f6e9a"/>
    <text x="305" y="290" font-weight="bold">Rehearsed on a copy, then waiting</text>
    <text x="305" y="308">web at 0 replicas, CronJob suspended</text>
    <text x="305" y="324">keys of the old parameters.php in the secret</text>
    <rect x="470" y="266" width="215" height="64" rx="9" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
    <text x="577" y="290" font-weight="bold">Import, sync, start, check</text>
    <text x="577" y="308">counts, last order id, login</text>
    <text x="577" y="324">smoke test with curl --resolve</text>
    <rect x="695" y="266" width="235" height="64" rx="9" fill="#4d7c5a"/>
    <text x="812" y="290" font-weight="bold">Live: DNS, then the cron</text>
    <text x="812" y="308">shop opened, CronJob resumed</text>
    <text x="812" y="324">watch orders for one hour</text>
  </g>

  <!-- provider lane -->
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="150" y="416" width="310" height="64" rx="9" fill="#3d5266"/>
    <text x="305" y="440" font-weight="bold">Callbacks reach the old server</text>
    <text x="305" y="458">same URL, same domain</text>
    <text x="305" y="474">new egress IPs allowed beforehand</text>
    <rect x="470" y="416" width="215" height="64" rx="9" fill="#7a5c3a"/>
    <text x="577" y="440" font-weight="bold">503 from the old server</text>
    <text x="577" y="458">the provider keeps the event</text>
    <text x="577" y="474">and retries (check its policy)</text>
    <rect x="695" y="416" width="235" height="64" rx="9" fill="#4d7c5a"/>
    <text x="812" y="440" font-weight="bold">Retries land on the new shop</text>
    <text x="812" y="458">orders paid during the freeze</text>
    <text x="812" y="474">are created; reconcile with the provider</text>
  </g>

  <!-- arrows -->
  <path d="M577 180 L577 262" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M577 330 L577 412" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M685 298 L695 298" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="590" y="228" font-size="11.5" fill="#f2f5f8">final dump and files</text>
  <text x="590" y="378" font-size="11.5" fill="#f2f5f8">retry after the switch</text>
  <text x="150" y="518" font-size="12" fill="#9fd3c7">The old shop is frozen before the new one starts, and nothing on it changes until the rollback window ends.</text>
</svg>
