<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">NumPy 2.0 to 2.6 release timeline</title>
<desc id="d">Seven releases along a horizontal line with their release dates and headline changes. 2.6 is marked upcoming.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">NumPy 2.x timeline</text>
<line x1="30" y1="150" x2="690" y2="150" stroke="#94A3B8" stroke-width="3"/>
<line x1="102" y1="118" x2="102" y2="150" stroke="#94A3B8" stroke-width="2"/>
<rect x="20" y="48" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="102" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.0  (2024-06-16)</text>
<text x="102" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Aliases removed, NEP 50,</text>
<text x="102" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">StringDType, array API</text>
<circle cx="102" cy="150" r="8" fill="#0F766E"/>
<line x1="188" y1="150" x2="188" y2="182" stroke="#94A3B8" stroke-width="2"/>
<rect x="106" y="182" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="188" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.1  (2024-08-18)</text>
<text x="188" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">unstack, DLPack v1,</text>
<text x="188" y="237" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">free-threading preview</text>
<circle cx="188" cy="150" r="8" fill="#0F766E"/>
<line x1="274" y1="118" x2="274" y2="150" stroke="#94A3B8" stroke-width="2"/>
<rect x="192" y="48" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="274" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.2  (2024-12-08)</text>
<text x="274" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">matvec and vecmat,</text>
<text x="274" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">typing improvements</text>
<circle cx="274" cy="150" r="8" fill="#0F766E"/>
<line x1="360" y1="150" x2="360" y2="182" stroke="#94A3B8" stroke-width="2"/>
<rect x="278" y="182" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.3  (2025-06-07)</text>
<text x="360" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">strings.slice, OpenMP sort,</text>
<text x="360" y="237" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">array API 2024.12</text>
<circle cx="360" cy="150" r="8" fill="#0F766E"/>
<line x1="446" y1="118" x2="446" y2="150" stroke="#94A3B8" stroke-width="2"/>
<rect x="364" y="48" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="446" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.4  (2025-12-20)</text>
<text x="446" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">same_value casting, ndmax,</text>
<text x="446" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">trapz and in1d removed</text>
<circle cx="446" cy="150" r="8" fill="#0F766E"/>
<line x1="532" y1="150" x2="532" y2="182" stroke="#94A3B8" stroke-width="2"/>
<rect x="450" y="182" width="164" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="532" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.5  (2026-06-21)</text>
<text x="532" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">distutils removed,</text>
<text x="532" y="237" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">descending sorts</text>
<circle cx="532" cy="150" r="8" fill="#0F766E"/>
<line x1="618" y1="118" x2="618" y2="150" stroke="#94A3B8" stroke-width="2"/>
<rect x="536" y="48" width="164" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="618" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2.6  (upcoming)</text>
<text x="618" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">top_k and minmax,</text>
<text x="618" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">mypy plugin removed</text>
<circle cx="618" cy="150" r="8" fill="#B45309"/>
</svg>
