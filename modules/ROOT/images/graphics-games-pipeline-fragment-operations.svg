<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-pipeline-fragment-operations" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What happens to a fragment before it becomes a pixel</text>
<rect x="20" y="100" width="108" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Fragment</text>
<text x="74.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">from the</text>
<text x="74.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fragment shader</text>
<line x1="128" y1="135" x2="142" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)"/>
<circle cx="32" cy="92" r="11" fill="#4F46E5"/>
<text x="32" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="142" y="100" width="108" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="196.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Scissor</text>
<text x="196.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">inside the</text>
<text x="196.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">rectangle?</text>
<line x1="250" y1="135" x2="264" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)"/>
<circle cx="154" cy="92" r="11" fill="#4F46E5"/>
<text x="154" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="264" y="100" width="108" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="318.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Stencil</text>
<text x="318.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">mask test</text>
<text x="318.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and update</text>
<line x1="372" y1="135" x2="386" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)"/>
<circle cx="276" cy="92" r="11" fill="#4F46E5"/>
<text x="276" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="386" y="100" width="108" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="440.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Depth</text>
<text x="440.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">closer than</text>
<text x="440.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stored value?</text>
<line x1="494" y1="135" x2="508" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)"/>
<circle cx="398" cy="92" r="11" fill="#B45309"/>
<text x="398" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="508" y="100" width="108" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="562.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Blend</text>
<text x="562.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">combine with</text>
<text x="562.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">framebuffer</text>
<line x1="616" y1="135" x2="630" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)"/>
<circle cx="520" cy="92" r="11" fill="#4F46E5"/>
<text x="520" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="630" y="100" width="108" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="684.0" y="124.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Framebuffer</text>
<text x="684.0" y="138.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colour and</text>
<text x="684.0" y="152.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth written</text>
<circle cx="642" cy="92" r="11" fill="#4F46E5"/>
<text x="642" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<path d="M 74,170 L 74,194 L 440,194 L 440,172" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-pipeline-fragment-operations)" stroke-dasharray="5 4"/>
<text x="257" y="213" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">early depth test: reject before the fragment shader runs (when allowed)</text>
<rect x="20" y="235" width="720" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="40" y="258" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Failed a test: the fragment is discarded and the stored pixel is untouched.</text>
<text x="40" y="280" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Passed: depth may be written, then blending mixes source and destination colour.</text>
<text x="40" y="302" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Alpha-to-coverage, multisample masks and logic ops belong to the same stage.</text>
</svg>
