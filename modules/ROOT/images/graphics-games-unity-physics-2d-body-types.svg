<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="m-p2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="m-p2ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m-p2bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Rigidbody 2D body types at a glance</text>
<rect x="30" y="56" width="215" height="240" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="137" y="84" text-anchor="middle" font-size="15" fill="#3730A3" font-weight="bold">Dynamic</text>
<text x="137" y="114" text-anchor="middle" font-size="12" fill="#1F2937">Moved by forces,</text>
<text x="137" y="138" text-anchor="middle" font-size="12" fill="#1F2937">gravity and collisions</text>
<text x="137" y="162" text-anchor="middle" font-size="12" fill="#1F2937">Use for: falling book, ball</text>
<text x="137" y="186" text-anchor="middle" font-size="12" fill="#1F2937">Set linearVelocity or AddForce</text>
<text x="137" y="210" text-anchor="middle" font-size="12" fill="#1F2937">Costs the most</text>
<rect x="265" y="56" width="215" height="240" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="372" y="84" text-anchor="middle" font-size="15" fill="#92400E" font-weight="bold">Kinematic</text>
<text x="372" y="114" text-anchor="middle" font-size="12" fill="#1F2937">Moved only by your code</text>
<text x="372" y="138" text-anchor="middle" font-size="12" fill="#1F2937">(MovePosition, velocity)</text>
<text x="372" y="162" text-anchor="middle" font-size="12" fill="#1F2937">Not pushed by contacts</text>
<text x="372" y="186" text-anchor="middle" font-size="12" fill="#1F2937">Use for: moving platform, door</text>
<text x="372" y="210" text-anchor="middle" font-size="12" fill="#1F2937">Acts as infinite mass</text>
<rect x="500" y="56" width="215" height="240" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="607" y="84" text-anchor="middle" font-size="15" fill="#047857" font-weight="bold">Static</text>
<text x="607" y="114" text-anchor="middle" font-size="12" fill="#1F2937">Never moves</text>
<text x="607" y="138" text-anchor="middle" font-size="12" fill="#1F2937">Collider only, no simulation</text>
<text x="607" y="162" text-anchor="middle" font-size="12" fill="#1F2937">Use for: floor, shelf wall</text>
<text x="607" y="186" text-anchor="middle" font-size="12" fill="#1F2937">Cheapest</text>
<text x="607" y="210" text-anchor="middle" font-size="12" fill="#1F2937">A Collider 2D alone is static too</text>
<text x="380" y="318" text-anchor="middle" font-size="11" fill="#4B5563">A Collider 2D without a Rigidbody 2D is static; set the body type to Static to say so explicitly.</text>
</svg>
