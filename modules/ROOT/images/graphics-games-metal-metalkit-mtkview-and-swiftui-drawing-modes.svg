<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metalkit-mtkview-and-swiftui-drawing-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The three MTKView drawing modes</text>
<rect x="20" y="50" width="230" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="74.0" font-size="13" font-weight="normal" fill="#3730A3" text-anchor="middle">Timed updates</text>
<text x="135" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">default</text>
<rect x="20" y="120" width="230" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="152.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Properties</text>
<text x="135.0" y="166.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">isPaused = false</text>
<text x="135.0" y="180.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">enableSetNeedsDisplay = false</text>
<text x="135.0" y="194.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">preferredFramesPerSecond = 60</text>
<rect x="20" y="235" width="230" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="262.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Result</text>
<text x="135.0" y="276.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">draw(in:) called by the</text>
<text x="135.0" y="290.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">view on a display link</text>
<text x="135.0" y="304.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Games, animation</text>
<rect x="265" y="50" width="230" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="74.0" font-size="13" font-weight="normal" fill="#065F46" text-anchor="middle">Draw on demand</text>
<text x="380" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">event driven</text>
<rect x="265" y="120" width="230" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="152.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Properties</text>
<text x="380.0" y="166.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">isPaused = true</text>
<text x="380.0" y="180.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">enableSetNeedsDisplay = true</text>
<text x="380.0" y="194.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setNeedsDisplay() to redraw</text>
<rect x="265" y="235" width="230" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="262.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Result</text>
<text x="380.0" y="276.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">draw(in:) called when the</text>
<text x="380.0" y="290.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">view needs display</text>
<text x="380.0" y="304.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Editors, viewers, tools</text>
<rect x="510" y="50" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="74.0" font-size="13" font-weight="normal" fill="#92400E" text-anchor="middle">Explicit draw</text>
<text x="625" y="108" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you control timing</text>
<rect x="510" y="120" width="230" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="152.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Properties</text>
<text x="625.0" y="166.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">isPaused = true</text>
<text x="625.0" y="180.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">enableSetNeedsDisplay = false</text>
<text x="625.0" y="194.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">view.draw() from your loop</text>
<rect x="510" y="235" width="230" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="262.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Result</text>
<text x="625.0" y="276.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">draw(in:) called only</text>
<text x="625.0" y="290.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">when you call draw()</text>
<text x="625.0" y="304.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Own display link, capture</text>
<text x="380" y="348" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Use a delegate or subclass MTKView and override draw(_:), not both.</text>
</svg>
