<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">What @Canonical generates</title>
  <desc id="d">A Groovy class with two properties on the left. Three arrows lead to the members generated from it: the toString method from @ToString, the equals, hashCode and canEqual methods from @EqualsAndHashCode, and three constructors from @TupleConstructor.</desc>
  <rect width="960" height="400" fill="#ffffff"/>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #1f2933; }
    .h { font-weight: bold; font-size: 15px; fill: #ffffff; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 13px; }
    .s { font-size: 13px; fill: #52606d; }
    .a { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="300" height="32" rx="6" fill="#1d4e89"/>
  <text class="h" x="24" y="31">Source you write</text>
  <rect x="10" y="52" width="300" height="338" rx="6" fill="#eef3fa" stroke="#1d4e89"/>
  <text class="m" x="24" y="90">@Canonical</text>
  <text class="m" x="24" y="116">class Reading {</text>
  <text class="m" x="44" y="142">String sensor</text>
  <text class="m" x="44" y="168">double value = 0.0</text>
  <text class="m" x="24" y="194">}</text>
  <text class="s" x="24" y="240">Two properties, one default value,</text>
  <text class="s" x="24" y="260">no methods written by hand.</text>
  <text class="s" x="24" y="300">A hand-written toString(), equals()</text>
  <text class="s" x="24" y="320">or constructor is kept, and the</text>
  <text class="s" x="24" y="340">matching generated one is skipped.</text>
  <path class="a" d="M312,120 L380,70"/>
  <path class="a" d="M312,220 L380,220"/>
  <path class="a" d="M312,300 L380,340"/>
  <rect x="384" y="10" width="566" height="32" rx="6" fill="#1f7a3d"/>
  <text class="h" x="398" y="31">Members generated by the compiler</text>
  <rect x="384" y="52" width="566" height="100" rx="6" fill="#eef8f1" stroke="#1f7a3d"/>
  <text x="398" y="76" font-weight="bold">@ToString</text>
  <text class="m" x="398" y="104">String toString()</text>
  <text class="s" x="398" y="130">Reading(t1, 21.5): class name and values in order</text>
  <rect x="384" y="162" width="566" height="116" rx="6" fill="#eef8f1" stroke="#1f7a3d"/>
  <text x="398" y="186" font-weight="bold">@EqualsAndHashCode</text>
  <text class="m" x="398" y="214">boolean equals(Object)</text>
  <text class="m" x="398" y="236">int hashCode()</text>
  <text class="m" x="398" y="258">boolean canEqual(Object)</text>
  <text class="s" x="640" y="236">equal values mean equal objects</text>
  <rect x="384" y="288" width="566" height="102" rx="6" fill="#eef8f1" stroke="#1f7a3d"/>
  <text x="398" y="312" font-weight="bold">@TupleConstructor</text>
  <text class="m" x="398" y="338">Reading()</text>
  <text class="m" x="398" y="358">Reading(String sensor)</text>
  <text class="m" x="398" y="378">Reading(String sensor, double value)</text>
  <text class="s" x="680" y="358">one overload per default value</text>
</svg>
