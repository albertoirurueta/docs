<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Timeline of one interaction: a trigger fires, then actions on three targets run in sequence and in parallel along a time axis">
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">One interaction on a time axis</text>
<rect x="20" y="48" width="860" height="40" rx="6" fill="#E6F4F2" stroke="#0B4F6C"/>
<text x="34" y="73" font-size="14" fill="#0B4F6C"><tspan font-weight="700">Trigger:</tspan> click on the "Book a visit" button (trigger target)   |   plays the timeline once, from 0 s</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B4F6C"/></marker></defs>
<line x1="200" y1="88" x2="200" y2="130" stroke="#0B4F6C" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="118" font-size="13" fill="#0B4F6C">fires at 0 s</text>
<g font-size="13" fill="#333333">
<text x="20" y="160" font-weight="700" fill="#0B4F6C">Target</text>
<text x="200" y="160" font-weight="700" fill="#0B4F6C">0 s</text>
<text x="360" y="160" font-weight="700" fill="#0B4F6C">0.4 s</text>
<text x="520" y="160" font-weight="700" fill="#0B4F6C">0.8 s</text>
<text x="680" y="160" font-weight="700" fill="#0B4F6C">1.2 s</text>
<text x="840" y="160" font-weight="700" fill="#0B4F6C">1.6 s</text>
</g>
<g stroke="#BBBBBB" stroke-dasharray="3 4">
<line x1="200" y1="168" x2="200" y2="400"/><line x1="360" y1="168" x2="360" y2="400"/><line x1="520" y1="168" x2="520" y2="400"/><line x1="680" y1="168" x2="680" y2="400"/><line x1="840" y1="168" x2="840" y2="400"/>
</g>
<line x1="20" y1="168" x2="880" y2="168" stroke="#0B4F6C" stroke-width="2"/>
<text x="20" y="206" font-size="14" font-weight="700" fill="#333333">Overlay panel</text>
<text x="20" y="224" font-size="12" fill="#555555">Fade in (opacity)</text>
<rect x="200" y="190" width="240" height="38" rx="4" fill="#CDE6F5" stroke="#0B4F6C"/>
<text x="212" y="214" font-size="13" fill="#0B4F6C">opacity 0 to 1, 0.6 s</text>
<text x="20" y="276" font-size="14" font-weight="700" fill="#333333">Heading</text>
<text x="20" y="294" font-size="12" fill="#555555">Move, after the fade</text>
<rect x="440" y="260" width="240" height="38" rx="4" fill="#CFE8CF" stroke="#2F7D32"/>
<text x="452" y="284" font-size="13" fill="#1B5E20">move Y 40 px to 0, 0.6 s</text>
<text x="20" y="346" font-size="14" font-weight="700" fill="#333333">Card 1, 2, 3</text>
<text x="20" y="364" font-size="12" fill="#555555">Stagger, in parallel</text>
<rect x="440" y="330" width="200" height="22" rx="4" fill="#FAD7A0" stroke="#B26A00"/>
<rect x="500" y="356" width="200" height="22" rx="4" fill="#FAD7A0" stroke="#B26A00"/>
<rect x="560" y="382" width="200" height="22" rx="4" fill="#FAD7A0" stroke="#B26A00"/>
<text x="650" y="347" font-size="12" fill="#7A4800">card 1</text>
<text x="710" y="373" font-size="12" fill="#7A4800">card 2</text>
<text x="770" y="399" font-size="12" fill="#7A4800">card 3</text>
<line x1="440" y1="262" x2="440" y2="228" stroke="#0B4F6C" stroke-width="2" stroke-dasharray="2 3"/>
<text x="448" y="252" font-size="11" fill="#0B4F6C">starts when the fade ends</text>
<rect x="20" y="425" width="420" height="80" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="34" y="448" font-size="14" font-weight="700" fill="#333333">Sequence</text>
<text x="34" y="468" font-size="13" fill="#333333">A block starts after the previous one ends</text>
<text x="34" y="488" font-size="13" fill="#333333">(fade, then move).</text>
<rect x="460" y="425" width="420" height="80" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="474" y="448" font-size="14" font-weight="700" fill="#333333">Parallel</text>
<text x="474" y="468" font-size="13" fill="#333333">Blocks share a start time and overlap; a stagger</text>
<text x="474" y="488" font-size="13" fill="#333333">shifts each target by a fixed delay (0.15 s here).</text>
</svg>
