<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="webalmanac-vitals-mobile-t webalmanac-vitals-mobile-d">
<title id="webalmanac-vitals-mobile-t">Web Almanac 2025 vitals, mobile</title>
<desc id="webalmanac-vitals-mobile-d">Share of mobile origins with a good Largest Contentful Paint, Interaction to Next Paint, Cumulative Layout Shift and all three together, per platform, from the Web Almanac 2025 e-commerce chapter. INP is good for almost every platform on desktop; LCP separates the platforms most, with Shopify at the top.</desc>
