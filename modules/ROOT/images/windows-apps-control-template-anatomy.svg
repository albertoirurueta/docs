<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of a retemplated Button</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">The control keeps its properties, commands and states; the template only supplies the visual tree</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="20" y="66" width="220" height="290" rx="10" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="36" y="90" font-size="14" font-weight="bold" fill="#1c4b73">Button (the templated parent)</text>
  <text x="36" y="116" font-size="12" fill="#333333">Content = "Add book"</text>
  <text x="36" y="136" font-size="12" fill="#333333">Background, BorderBrush</text>
  <text x="36" y="156" font-size="12" fill="#333333">Padding, Tag, FontSize</text>
  <text x="36" y="176" font-size="12" fill="#333333">Command, IsEnabled</text>
  <text x="36" y="206" font-size="12" font-weight="bold" fill="#333333">Raises states:</text>
  <text x="36" y="226" font-size="12" fill="#333333">CommonStates: Normal, MouseOver,</text>
  <text x="36" y="244" font-size="12" fill="#333333">Pressed, Disabled</text>
  <text x="36" y="262" font-size="12" fill="#333333">FocusStates: Focused, Unfocused</text>
  <text x="36" y="292" font-size="12" font-weight="bold" fill="#333333">Raises property changes:</text>
  <text x="36" y="312" font-size="12" fill="#333333">IsMouseOver, IsPressed,</text>
  <text x="36" y="330" font-size="12" fill="#333333">IsKeyboardFocused, IsEnabled</text>
  <rect x="300" y="66" width="440" height="290" rx="10" fill="#fdf8ee" stroke="#a07820" stroke-width="2"/>
  <text x="316" y="90" font-size="14" font-weight="bold" fill="#7a5a10">ControlTemplate (TargetType Button)</text>
  <rect x="320" y="106" width="400" height="120" rx="8" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="336" y="128" font-size="13" font-weight="bold" fill="#2a6a2a">Visual tree</text>
  <text x="336" y="150" font-size="12" fill="#333333">Border x:Name="Chrome"   Background = TemplateBinding Background</text>
  <text x="356" y="170" font-size="12" fill="#333333">ContentPresenter   Content and ContentTemplate bound automatically</text>
  <text x="356" y="190" font-size="12" fill="#333333">margin = TemplateBinding Padding</text>
  <text x="336" y="214" font-size="12" fill="#333333">Named parts: Chrome (target of setters and animations)</text>
  <rect x="320" y="240" width="190" height="100" rx="8" fill="#eef3fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="332" y="262" font-size="13" font-weight="bold" fill="#1c4b73">Triggers</text>
  <text x="332" y="284" font-size="12" fill="#333333">Trigger IsMouseOver</text>
  <text x="332" y="302" font-size="12" fill="#333333">Trigger IsPressed</text>
  <text x="332" y="320" font-size="12" fill="#333333">Setter TargetName="Chrome"</text>
  <rect x="530" y="240" width="190" height="100" rx="8" fill="#f8eef3" stroke="#8a2a5a" stroke-width="1.5"/>
  <text x="542" y="262" font-size="13" font-weight="bold" fill="#8a2a5a">VisualStateManager</text>
  <text x="542" y="284" font-size="12" fill="#333333">VisualStateGroup CommonStates</text>
  <text x="542" y="302" font-size="12" fill="#333333">VisualState + Storyboard</text>
  <text x="542" y="320" font-size="12" fill="#333333">VisualTransition durations</text>
  <line x1="240" y1="146" x2="318" y2="146" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="279" y="138" font-size="11" fill="#555555" text-anchor="middle">TemplateBinding</text>
  <line x1="240" y1="262" x2="318" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="258" y="286" font-size="11" fill="#555555">drive</text>
</svg>
