<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-setup-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Setup storyboard: from nothing to a window and a validated instance</text>
<rect x="14" y="60" width="138" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5"/>
<text x="30" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="83" y="115" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Install SDK</text>
<text x="83" y="150" text-anchor="middle" font-size="10" fill="#374151">run installer or</text>
<text x="83" y="164" text-anchor="middle" font-size="10" fill="#374151">unpack tarball</text>
<line x1="153" y1="135" x2="161" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-sb)"/>
<rect x="162" y="60" width="138" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="178" cy="76" r="11" fill="#4F46E5"/>
<text x="178" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="231" y="115" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Check install</text>
<text x="231" y="150" text-anchor="middle" font-size="10" fill="#374151">vulkaninfo, vkcube</text>
<line x1="301" y1="135" x2="309" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-sb)"/>
<rect x="310" y="60" width="138" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="76" r="11" fill="#4F46E5"/>
<text x="326" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="379" y="115" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Configure</text>
<text x="379" y="150" text-anchor="middle" font-size="10" fill="#374151">CMake finds Vulkan,</text>
<text x="379" y="164" text-anchor="middle" font-size="10" fill="#374151">GLFW, glm</text>
<line x1="449" y1="135" x2="457" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-sb)"/>
<rect x="458" y="60" width="138" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="76" r="11" fill="#4F46E5"/>
<text x="474" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="527" y="115" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Compile shaders</text>
<text x="527" y="150" text-anchor="middle" font-size="10" fill="#374151">slangc to SPIR-V in</text>
<text x="527" y="164" text-anchor="middle" font-size="10" fill="#374151">the build</text>
<line x1="597" y1="135" x2="605" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-setup-sb)"/>
<rect x="606" y="60" width="138" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="622" cy="76" r="11" fill="#B45309"/>
<text x="622" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="675" y="115" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">First run</text>
<text x="675" y="150" text-anchor="middle" font-size="10" fill="#374151">window + instance +</text>
<text x="675" y="164" text-anchor="middle" font-size="10" fill="#374151">validation</text>
<text x="380" y="250" text-anchor="middle" font-size="12" fill="#374151">Step 2 is the quickest way to tell a driver problem from a project problem</text>
<text x="380" y="274" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">If vkcube does not run, no application will</text>
</svg>
