<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 864 392" width="860" height="392" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Magento system configuration sources</title>
  <desc id="d">Runtime system configuration is built from three sources merged in sort order, the later one overriding the earlier: module defaults from etc/config.xml (sort order 10), values saved in the core_config_data table (sort order 100) and the system node of app/etc/config.php and app/etc/env.php (sort order 1000, env.php last). Values locked with config:set --lock-env or --lock-config live in the third source and become read-only in the Admin. Environment variables named CONFIG__DEFAULT__ are an additional source for config:show.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="28" font-weight="bold">Runtime sources (ConfigSourceAggregated), merged from top to bottom, the last one wins</text>

  <rect x="20" y="44" width="560" height="80" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="70" font-weight="bold">1  Module defaults   (sort order 10)</text>
  <text x="40" y="92" font-size="12">etc/config.xml of every enabled module, such as pocketcoffee_skeleton/general/min_rest_days</text>
  <text x="40" y="110" font-size="12" opacity="0.8">Always present, read-only, the fallback when nothing else is set</text>

  <line x1="300" y1="124" x2="300" y2="148" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="20" y="150" width="560" height="80" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="176" font-weight="bold">2  Database   (sort order 100)</text>
  <text x="40" y="198" font-size="12">Table core_config_data: scope (default, websites, stores), scope_id, path, value</text>
  <text x="40" y="216" font-size="12" opacity="0.8">Written by Stores &gt; Configuration, config:set and setup patches</text>

  <line x1="300" y1="230" x2="300" y2="254" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="20" y="256" width="560" height="112" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="282" font-weight="bold">3  Deployment files   (sort order 1000)</text>
  <text x="40" y="304" font-size="12">The system node of app/etc/config.php (shared, versioned), then app/etc/env.php (per environment)</text>
  <text x="40" y="324" font-size="12" opacity="0.8">config:set --lock-config writes config.php, config:set --lock-env writes env.php;</text>
  <text x="40" y="342" font-size="12" opacity="0.8">a locked field is read-only in the Admin and beats any database value</text>

  <rect x="610" y="44" width="240" height="132" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="730" y="70" text-anchor="middle" font-weight="bold">Environment variables</text>
  <text x="730" y="92" text-anchor="middle" font-size="12">CONFIG__DEFAULT__GENERAL__</text>
  <text x="730" y="108" text-anchor="middle" font-size="12">STORE_INFORMATION__NAME</text>
  <text x="730" y="130" text-anchor="middle" font-size="11">merged by config:show only;</text>
  <text x="730" y="144" text-anchor="middle" font-size="11">a runtime read of a value in the</text>
  <text x="730" y="158" text-anchor="middle" font-size="11">checked install did not use them</text>

  <rect x="610" y="206" width="240" height="162" rx="12" fill="#e74c3c" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="232" text-anchor="middle" font-weight="bold">Not configuration values</text>
  <text x="730" y="256" text-anchor="middle" font-size="12">env.php: db, cache, session,</text>
  <text x="730" y="272" text-anchor="middle" font-size="12">queue, crypt, MAGE_MODE</text>
  <text x="730" y="294" text-anchor="middle" font-size="12">config.php: modules, scopes,</text>
  <text x="730" y="310" text-anchor="middle" font-size="12">themes, i18n</text>
  <text x="730" y="338" text-anchor="middle" font-size="11" opacity="0.85">read by DeploymentConfig,</text>
  <text x="730" y="352" text-anchor="middle" font-size="11" opacity="0.85">never from the database</text>
</svg>
