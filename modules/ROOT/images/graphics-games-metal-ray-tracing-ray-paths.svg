<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ray-tracing-ray-paths" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Primary, shadow and reflection rays over the shelf</text>
<rect x="30" y="260" width="700" height="60" rx="6" fill="#F3E8D0" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">glossy shelf board</text>
<rect x="300" y="150" width="36" height="110" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="345" y="170" width="36" height="90" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="390" y="140" width="36" height="120" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="435" y="160" width="36" height="100" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<circle cx="660" cy="70" r="16" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
<text x="660" y="48" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">desk lamp</text>
<rect x="60" y="185" width="40" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80" y="243" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">camera</text>
<line x1="100" y1="205" x2="330" y2="262" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah-metal-ray-tracing-ray-paths)"/>
<text x="180" y="215" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">primary</text>
<line x1="330" y1="262" x2="420" y2="200" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-ray-tracing-ray-paths)"/>
<text x="322" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">reflection ray: closest hit</text>
<line x1="330" y1="262" x2="655" y2="78" stroke="#B45309" stroke-width="1.8" marker-end="url(#ah-metal-ray-tracing-ray-paths)" stroke-dasharray="5 3"/>
<text x="500" y="170" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">shadow ray to lamp</text>
<circle cx="330" cy="262" r="5" fill="#4F46E5" stroke="none" stroke-width="1"/>
<rect x="24" y="330" width="712" height="24" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="346" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Shadow rays ask &#x27;is anything between here and the light?&#x27; (any hit). Reflection rays ask &#x27;what is the closest thing?&#x27;.</text>
</svg>
