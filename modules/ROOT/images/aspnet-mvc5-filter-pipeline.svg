<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">ASP.NET MVC 5 filter pipeline</text>
  <text x="430" y="48" font-size="11.5" fill="#555555" text-anchor="middle">Execution order for one request; each kind can be registered globally, on the controller, or on the action</text>

  <!-- authorization filters -->
  <rect x="30" y="80" width="180" height="90" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="120" y="112" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Authorization</text>
  <text x="120" y="130" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">filters</text>
  <text x="120" y="150" font-size="10.5" fill="#1c4b73" text-anchor="middle">IAuthorizationFilter</text>
  <text x="120" y="164" font-size="10.5" fill="#1c4b73" text-anchor="middle">[Authorize] / [AllowAnonymous]</text>

  <path d="M215 125 L245 125" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- action filters -->
  <rect x="250" y="80" width="180" height="90" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="340" y="112" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Action filters</text>
  <text x="340" y="132" font-size="10.5" fill="#2f5424" text-anchor="middle">IActionFilter</text>
  <text x="340" y="146" font-size="10.5" fill="#2f5424" text-anchor="middle">OnActionExecuting</text>
  <text x="340" y="160" font-size="10.5" fill="#2f5424" text-anchor="middle">-&gt; action runs -&gt;</text>
  <text x="340" y="174" font-size="10.5" fill="#2f5424" text-anchor="middle">OnActionExecuted</text>

  <path d="M435 125 L465 125" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result filters -->
  <rect x="470" y="80" width="180" height="90" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="560" y="112" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">Result filters</text>
  <text x="560" y="132" font-size="10.5" fill="#8a3d10" text-anchor="middle">IResultFilter</text>
  <text x="560" y="146" font-size="10.5" fill="#8a3d10" text-anchor="middle">OnResultExecuting</text>
  <text x="560" y="160" font-size="10.5" fill="#8a3d10" text-anchor="middle">-&gt; ActionResult renders -&gt;</text>
  <text x="560" y="174" font-size="10.5" fill="#8a3d10" text-anchor="middle">OnResultExecuted</text>

  <path d="M655 125 L685 125" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- response -->
  <rect x="690" y="95" width="140" height="60" rx="6" fill="#eeeeee" stroke="#888888" stroke-width="2"/>
  <text x="760" y="130" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">HTTP response</text>

  <!-- exception filters wrap around action+result -->
  <rect x="240" y="200" width="420" height="70" rx="8" fill="#fbeee0" stroke="#c25a1d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="228" font-size="12.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">Exception filters (IExceptionFilter)</text>
  <text x="450" y="246" font-size="10.5" fill="#8a3d10" text-anchor="middle">wrap action + result filters; [HandleError]; run on unhandled exceptions</text>

  <text x="120" y="255" font-size="10.5" fill="#555555" text-anchor="middle">Scope, applied in order:</text>
  <text x="120" y="270" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">global -&gt; controller -&gt; action</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888888"/>
    </marker>
  </defs>
</svg>
