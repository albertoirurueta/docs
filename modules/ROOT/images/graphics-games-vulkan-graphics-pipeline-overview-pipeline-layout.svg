<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-gpo-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">The pipeline layout is the contract with the shaders</text>
<rect x="20" y="60" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="86.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">VkDescriptorSetLayout</text>
<text x="120.0" y="102.2" text-anchor="middle" font-size="12" fill="#3730A3">set 0: frame data (UBO)</text>
<rect x="20" y="130" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="156.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">VkDescriptorSetLayout</text>
<text x="120.0" y="172.2" text-anchor="middle" font-size="12" fill="#3730A3">set 1: book textures</text>
<rect x="20" y="200" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120.0" y="218.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">VkPushConstantRange</text>
<text x="120.0" y="234.2" text-anchor="middle" font-size="12" fill="#92400E">model matrix, 64 bytes</text>
<text x="120.0" y="250.2" text-anchor="middle" font-size="12" fill="#92400E">stages: vertex</text>
<rect x="300" y="110" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="385.0" y="133.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkPipelineLayout</text>
<text x="385.0" y="148.8" text-anchor="middle" font-size="11" fill="#3730A3">setLayoutCount</text>
<text x="385.0" y="163.8" text-anchor="middle" font-size="11" fill="#3730A3">pSetLayouts</text>
<text x="385.0" y="178.8" text-anchor="middle" font-size="11" fill="#3730A3">pushConstantRangeCount</text>
<text x="385.0" y="193.8" text-anchor="middle" font-size="11" fill="#3730A3">pPushConstantRanges</text>
<line x1="220" y1="90" x2="300" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-layout)"/>
<line x1="220" y1="160" x2="300" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-layout)"/>
<line x1="220" y1="230" x2="300" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-layout)"/>
<rect x="550" y="60" width="190" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="78.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">VkPipeline</text>
<text x="645.0" y="94.2" text-anchor="middle" font-size="12" fill="#065F46">pipeline created with</text>
<text x="645.0" y="110.2" text-anchor="middle" font-size="12" fill="#065F46">this layout</text>
<rect x="550" y="150" width="190" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="645.0" y="168.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Command buffer</text>
<text x="645.0" y="183.8" text-anchor="middle" font-size="11" fill="#374151">vkCmdBindDescriptorSets</text>
<text x="645.0" y="198.8" text-anchor="middle" font-size="11" fill="#374151">vkCmdPushConstants</text>
<line x1="470" y1="150" x2="550" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-layout)"/>
<line x1="470" y1="175" x2="550" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-layout)"/>
<rect x="20" y="290" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="321.4" text-anchor="middle" font-size="11" fill="#374151">Sets stay bound across pipelines with a compatible layout, so keep rarely changing data in low set numbers.</text>
<text x="380.0" y="336.4" text-anchor="middle" font-size="11" fill="#374151">Every binding a shader uses needs a matching layout entry whose stage flags include that shader stage.</text>
</svg>
