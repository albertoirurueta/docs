<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Magento web API entry points and where they meet</title>
  <desc id="d">Clients call REST at /rest, SOAP at /soap, asynchronous REST at /rest/store/async and GraphQL at /graphql. REST and SOAP routes come from webapi.xml and resolve to service contract interfaces. Asynchronous calls are placed on a message queue, and the async.operations.all consumer later invokes the same service contract and records operation status. GraphQL resolvers declared in schema.graphqls also call the service contracts or repositories. Everything ends in the repository, the models and the database.</desc>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Four entry points, one set of service contracts</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="60" width="170" height="70" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="84" font-weight="bold" font-size="14">REST client</text>
    <text x="32" y="104">GET /rest/V1/...</text>
    <text x="32" y="120">Bearer or OAuth header</text>

    <rect x="20" y="150" width="170" height="70" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="174" font-weight="bold" font-size="14">Async REST client</text>
    <text x="32" y="194">POST /rest/default/</text>
    <text x="32" y="210">async/V1/... or async/bulk/...</text>

    <rect x="20" y="240" width="170" height="70" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="264" font-weight="bold" font-size="14">GraphQL client</text>
    <text x="32" y="284">POST /graphql</text>
    <text x="32" y="300">query, mutation, variables</text>

    <rect x="20" y="330" width="170" height="70" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="32" y="354" font-weight="bold" font-size="14">SOAP client</text>
    <text x="32" y="374">/soap/default?wsdl</text>
    <text x="32" y="390">same routes as REST</text>

    <rect x="250" y="60" width="210" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="84" font-weight="bold">webapi.xml route</text>
    <text x="262" y="104">url, method, service,</text>
    <text x="262" y="120">resources, data parameters</text>

    <rect x="250" y="150" width="210" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="174" font-weight="bold">Message queue (db or amqp)</text>
    <text x="262" y="194">topic async.pocketcoffee...</text>
    <text x="262" y="210">answer: 202 + bulk_uuid</text>

    <rect x="250" y="240" width="210" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="264" font-weight="bold">schema.graphqls + resolver</text>
    <text x="262" y="284">@resolver(class: ...)</text>
    <text x="262" y="300">argument validation, limits</text>

    <rect x="250" y="330" width="210" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="354" font-weight="bold">Same webapi.xml routes</text>
    <text x="262" y="374">operation names from the</text>
    <text x="262" y="390">interface or soapOperation</text>

    <rect x="520" y="150" width="190" height="70" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="532" y="174" font-weight="bold">Consumer</text>
    <text x="532" y="194">async.operations.all</text>
    <text x="532" y="210">(cron or queue:consumers:start)</text>


    <rect x="760" y="100" width="180" height="90" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="772" y="124" font-weight="bold" font-size="14">Service contract</text>
    <text x="772" y="144">Api\RoastBatchRepository</text>
    <text x="772" y="160">Interface::save()</text>
    <text x="772" y="176">Api\Data\...Interface</text>

    <rect x="760" y="230" width="180" height="70" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="772" y="254" font-weight="bold">Models and resource</text>
    <text x="772" y="274">business rules, events</text>
    <text x="772" y="290">plugins on the contract</text>

    <rect x="760" y="330" width="180" height="70" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="772" y="354" font-weight="bold">Database</text>
    <text x="772" y="374" font-size="11">pocketcoffee_api_roast_batch</text>
    <text x="772" y="390" font-size="11">magento_bulk, magento_operation</text>

    <rect x="250" y="440" width="460" height="64" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="462" font-weight="bold">Status of an async bulk</text>
    <text x="262" y="480">GET /rest/V1/bulk/{uuid}/status and /detailed-status</text>
    <text x="262" y="496">operation status: 1 complete, 2 retriable failure, 3 failed, 4 open</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M190 95 H 248"/>
    <path d="M190 185 H 248"/>
    <path d="M190 275 H 248"/>
    <path d="M190 365 H 248"/>
    <path d="M460 95 H 740 V 125 H 758"/>
    <path d="M460 185 H 518"/>
    <path d="M710 185 H 758"/>
    <path d="M460 275 H 730 V 150 H 758"/>
    <path d="M850 190 V 228"/>
    <path d="M850 300 V 328"/>
  </g>
</svg>
