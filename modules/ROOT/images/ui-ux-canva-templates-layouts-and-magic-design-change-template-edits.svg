<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Changing a template: when your edits are kept</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#F9FAFB"><rect x="12" y="46" width="356" height="300" rx="10"/><rect x="392" y="46" width="356" height="300" rx="10"/></g>
<text x="190" y="68" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Design type on the kept-edits list</text><text x="570" y="68" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Any other design type</text>
<text x="190" y="86" font-size="11" fill="#6B7280" text-anchor="middle">Instagram post, story, poster, logo, ...</text><text x="570" y="86" font-size="11" fill="#6B7280" text-anchor="middle">for example a presentation page</text><rect x="34" y="104" width="90" height="90" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="42" y="112" width="54" height="9" rx="2" fill="#4F46E5"/><rect x="90" y="130" width="10" height="30" fill="#4F46E5"/><rect x="102" y="134" width="10" height="26" fill="#B45309"/><rect x="42" y="172" width="38" height="13" rx="6" fill="#9CA3AF"/><text x="79" y="212" font-size="12" fill="#374151" text-anchor="middle">Your edited page</text><path d="M130,150 L170,150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="176" y="104" width="90" height="90" fill="#FEF3C7" stroke="#9CA3AF"/><rect x="184" y="112" width="54" height="9" rx="2" fill="#4F46E5"/><rect x="232" y="130" width="10" height="30" fill="#4F46E5"/><rect x="244" y="134" width="10" height="26" fill="#B45309"/><rect x="184" y="172" width="38" height="13" rx="6" fill="#B45309"/><text x="221" y="212" font-size="12" fill="#374151" text-anchor="middle">New template,</text><text x="221" y="228" font-size="12" fill="#374151" text-anchor="middle">your text kept</text><text x="190" y="270" font-size="12" fill="#374151" text-anchor="middle">Choose a template in the Templates tab.</text><text x="190" y="286" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Edits are carried over.</text><rect x="414" y="104" width="90" height="90" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="422" y="112" width="54" height="9" rx="2" fill="#4F46E5"/><rect x="470" y="130" width="10" height="30" fill="#4F46E5"/><rect x="482" y="134" width="10" height="26" fill="#B45309"/><rect x="422" y="172" width="38" height="13" rx="6" fill="#9CA3AF"/><text x="459" y="212" font-size="12" fill="#374151" text-anchor="middle">Your edited page</text><rect x="520" y="104" width="206" height="96" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="623" y="124" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">How to proceed?</text><rect x="532" y="136" width="182" height="24" rx="12" fill="#FFFFFF" stroke="#4F46E5"/><text x="623" y="152" font-size="11" fill="#374151" text-anchor="middle">Replace current page</text><rect x="532" y="166" width="182" height="24" rx="12" fill="#4F46E5"/><text x="623" y="182" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Add as new page</text><text x="570" y="246" font-size="12" fill="#374151" text-anchor="middle">Replace discards the edits on that page;</text><text x="570" y="262" font-size="12" fill="#374151" text-anchor="middle">Add as new page keeps the original.</text><text x="570" y="286" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Apply all pages replaces every page.</text><text x="380" y="368" font-size="12" fill="#92400E" text-anchor="middle">Undo restores the previous page right after a change.</text>  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
