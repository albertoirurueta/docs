<text x="59" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">framebuffer</text>
<line x1="98" y1="267" x2="166" y2="267" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bo)"/>
<rect x="170" y="240" width="70" height="54" rx="8" fill="#4F46E5" stroke="#4B5563" stroke-width="1.2"/>
<text x="205" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend near</text>
<line x1="244" y1="267" x2="312" y2="267" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bo)"/>
<rect x="316" y="240" width="70" height="54" rx="8" fill="#9A96E8" stroke="#4B5563" stroke-width="1.2"/>
<text x="351" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">result</text>
<line x1="390" y1="267" x2="458" y2="267" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bo)"/>
<rect x="462" y="240" width="70" height="54" rx="8" fill="#B45309" stroke="#4B5563" stroke-width="1.2"/>
<text x="497" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend far</text>
<line x1="536" y1="267" x2="604" y2="267" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bo)"/>
<rect x="608" y="240" width="70" height="54" rx="8" fill="#A77478" stroke="#B45309" stroke-width="2"/>
<text x="643" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">final</text>
<text x="24" y="336" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">result = source * 0.5 + destination * 0.5, applied once per layer</text>
<text x="380" y="382" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Both quads have 50% alpha. The two final colours differ, so draw order is part of the image.</text>
