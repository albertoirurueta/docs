<rect x="462" y="80" width="70" height="54" rx="8" fill="#4F46E5" stroke="#4B5563" stroke-width="1.2"/>
<text x="497" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend near</text>
<line x1="536" y1="107" x2="604" y2="107" stroke="#4B5563" stroke-width="1.5" marker-end="url(#bo)"/>
<rect x="608" y="80" width="70" height="54" rx="8" fill="#8E72B0" stroke="#047857" stroke-width="2"/>
<text x="643" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">final</text>
<text x="24" y="176" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">result = source * 0.5 + destination * 0.5, applied once per layer</text>
<text x="24" y="222" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Wrong order: near quad first, far quad second</text>
