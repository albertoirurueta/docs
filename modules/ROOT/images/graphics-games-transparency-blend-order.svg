<rect x="170" y="80" width="70" height="54" rx="8" fill="#B45309" stroke="#4B5563" stroke-width="1.2"/>
<text x="205" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend far</text>
