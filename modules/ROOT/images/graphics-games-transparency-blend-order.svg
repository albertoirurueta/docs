<rect x="316" y="80" width="70" height="54" rx="8" fill="#CC9D7A" stroke="#4B5563" stroke-width="1.2"/>
<text x="351" y="154" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">result</text>
