<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: web, service and data layers</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">each layer is a package; dependency injection wires them together at request time</text>

  <!-- DI wiring bar -->
  <rect x="30" y="62" width="700" height="48" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="380" y="82" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Dependency wiring</text>
  <text x="380" y="99" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">app/dependencies.py: Depends(get_unit_of_work) -> Depends(get_book_service)</text>

  <!-- DI connectors -->
  <line x1="130" y1="110" x2="130" y2="142" stroke="#7a4a00" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="130,146 125,138 135,138" fill="#7a4a00"/>
  <line x1="380" y1="110" x2="380" y2="142" stroke="#7a4a00" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="380,146 375,138 385,138" fill="#7a4a00"/>
  <line x1="630" y1="110" x2="630" y2="142" stroke="#7a4a00" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="630,146 625,138 635,138" fill="#7a4a00"/>
  <text x="138" y="132" font-size="10" fill="#666666">injects the service</text>
  <text x="388" y="132" font-size="10" fill="#666666">injects the unit of work</text>
  <text x="638" y="132" font-size="10" fill="#666666">picks the adapter</text>

  <!-- Web layer -->
  <rect x="30" y="148" width="200" height="132" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="172" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Web layer</text>
  <text x="130" y="190" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">app/routers/, main.py</text>
  <text x="130" y="212" font-size="11" fill="#444444" text-anchor="middle">APIRouter, path operations,</text>
  <text x="130" y="227" font-size="11" fill="#444444" text-anchor="middle">validation, status codes,</text>
  <text x="130" y="242" font-size="11" fill="#444444" text-anchor="middle">exception handlers</text>
  <text x="130" y="266" font-size="10" fill="#666666" text-anchor="middle">knows HTTP, not SQL</text>

  <!-- Service layer -->
  <rect x="280" y="148" width="200" height="132" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="380" y="172" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Service layer</text>
  <text x="380" y="190" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">app/services/</text>
  <text x="380" y="212" font-size="11" fill="#444444" text-anchor="middle">BookService use cases,</text>
  <text x="380" y="227" font-size="11" fill="#444444" text-anchor="middle">domain errors, and the ports</text>
  <text x="380" y="242" font-size="11" fill="#444444" text-anchor="middle">(UnitOfWork, repositories)</text>
  <text x="380" y="266" font-size="10" fill="#666666" text-anchor="middle">knows neither HTTP nor SQL</text>

  <!-- Data layer -->
  <rect x="530" y="148" width="200" height="132" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="630" y="172" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Data layer (adapters)</text>
  <text x="630" y="190" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">app/db.py, tests/fakes.py</text>
  <text x="630" y="212" font-size="11" fill="#444444" text-anchor="middle">SqliteUnitOfWork in production,</text>
  <text x="630" y="227" font-size="11" fill="#444444" text-anchor="middle">FakeUnitOfWork in tests,</text>
  <text x="630" y="242" font-size="11" fill="#444444" text-anchor="middle">both implement the port</text>
  <text x="630" y="266" font-size="10" fill="#666666" text-anchor="middle">knows SQL, not HTTP</text>

  <!-- layer arrows -->
  <line x1="230" y1="214" x2="274" y2="214" stroke="#444444" stroke-width="1.4"/>
  <polygon points="278,214 270,209 270,219" fill="#444444"/>
  <text x="255" y="204" font-size="10" fill="#666666" text-anchor="middle">calls</text>
  <line x1="480" y1="214" x2="524" y2="214" stroke="#444444" stroke-width="1.4"/>
  <polygon points="528,214 520,209 520,219" fill="#444444"/>
  <text x="505" y="204" font-size="10" fill="#666666" text-anchor="middle">calls</text>
  <text x="505" y="232" font-size="10" fill="#666666" text-anchor="middle">via port</text>

  <!-- Models strip -->
  <line x1="130" y1="280" x2="130" y2="306" stroke="#444444" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="380" y1="280" x2="380" y2="306" stroke="#444444" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="630" y1="280" x2="630" y2="306" stroke="#444444" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="30" y="308" width="700" height="52" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="380" y="330" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Models</text>
  <text x="380" y="348" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">app/models/: BookCreate, Book, ReviewCreate, Review (Pydantic)</text>

  <!-- Legend -->
  <text x="30" y="392" font-size="11" fill="#222222" font-weight="bold">Reading the figure</text>
  <text x="30" y="410" font-size="11" fill="#444444">Solid arrows are calls at run time: a request travels from left to right. Dashed lines are shared types and wiring, not calls.</text>
  <text x="30" y="426" font-size="11" fill="#444444">Services never import adapters; adapters satisfy the service's ports structurally (typing.Protocol) and only wiring imports both.</text>
</svg>
