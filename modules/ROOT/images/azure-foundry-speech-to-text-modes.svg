<svg viewBox="0 0 820 470" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Speech to text modes: latency vs file size vs features</text>

  <!-- header row -->
  <rect x="20" y="46" width="180" height="40" fill="#eceff1"/>
  <text x="30" y="71" font-size="12" font-weight="700" fill="#37474f">Property</text>

  <rect x="204" y="46" width="146" height="40" rx="4" fill="#1565c0"/>
  <text x="277" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Real-time</text>
  <text x="277" y="80" text-anchor="middle" font-size="10" fill="#e3f2fd">Speech SDK, WebSocket</text>

  <rect x="354" y="46" width="146" height="40" rx="4" fill="#2e7d32"/>
  <text x="427" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Fast transcription</text>
  <text x="427" y="80" text-anchor="middle" font-size="10" fill="#e8f5e9">sync REST</text>

  <rect x="504" y="46" width="146" height="40" rx="4" fill="#ef6c00"/>
  <text x="577" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Batch</text>
  <text x="577" y="80" text-anchor="middle" font-size="10" fill="#fff3e0">async REST + Blob</text>

  <rect x="654" y="46" width="146" height="40" rx="4" fill="#6a1b9a"/>
  <text x="727" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LLM speech</text>
  <text x="727" y="80" text-anchor="middle" font-size="10" fill="#f3e5f5">preview, prompt tuning</text>

  <!-- rows -->
  <g font-size="11" fill="#263238">
    <rect x="20" y="92" width="780" height="50" fill="#fafafa"/>
    <text x="30" y="121" font-weight="700">Latency</text>
    <text x="277" y="113" text-anchor="middle">partials in ~100s of ms</text>
    <text x="277" y="129" text-anchor="middle">as the user speaks</text>
    <text x="427" y="113" text-anchor="middle">seconds, faster than</text>
    <text x="427" y="129" text-anchor="middle">real time, one response</text>
    <text x="577" y="113" text-anchor="middle">minutes to hours,</text>
    <text x="577" y="129" text-anchor="middle">best-effort scheduling</text>
    <text x="727" y="113" text-anchor="middle">seconds,</text>
    <text x="727" y="129" text-anchor="middle">one response</text>

    <rect x="20" y="146" width="780" height="50" fill="#ffffff"/>
    <text x="30" y="175" font-weight="700">Input size</text>
    <text x="277" y="167" text-anchor="middle">live stream or file,</text>
    <text x="277" y="183" text-anchor="middle">no fixed length</text>
    <text x="427" y="167" text-anchor="middle">up to 500 MB</text>
    <text x="427" y="183" text-anchor="middle">and 5 hours per file</text>
    <text x="577" y="167" text-anchor="middle">many files or a whole</text>
    <text x="577" y="183" text-anchor="middle">Blob container per job</text>
    <text x="727" y="167" text-anchor="middle">file per request,</text>
    <text x="727" y="183" text-anchor="middle">check preview limits</text>

    <rect x="20" y="200" width="780" height="50" fill="#fafafa"/>
    <text x="30" y="229" font-weight="700">Diarization</text>
    <text x="277" y="221" text-anchor="middle">yes, with</text>
    <text x="277" y="237" text-anchor="middle">ConversationTranscriber</text>
    <text x="427" y="229" text-anchor="middle">yes, up to 35 speakers</text>
    <text x="577" y="229" text-anchor="middle">yes</text>
    <text x="727" y="229" text-anchor="middle">yes</text>

    <rect x="20" y="254" width="780" height="50" fill="#ffffff"/>
    <text x="30" y="283" font-weight="700">Translation</text>
    <text x="277" y="275" text-anchor="middle">yes, with the speech</text>
    <text x="277" y="291" text-anchor="middle">translation recognizer</text>
    <text x="427" y="283" text-anchor="middle">no (transcribe only)</text>
    <text x="577" y="283" text-anchor="middle">no (transcribe only)</text>
    <text x="727" y="275" text-anchor="middle">yes, transcribe and</text>
    <text x="727" y="291" text-anchor="middle">translate in one pass</text>

    <rect x="20" y="308" width="780" height="50" fill="#fafafa"/>
    <text x="30" y="337" font-weight="700">Customization</text>
    <text x="277" y="329" text-anchor="middle">phrase lists,</text>
    <text x="277" y="345" text-anchor="middle">custom speech models</text>
    <text x="427" y="329" text-anchor="middle">phrase lists,</text>
    <text x="427" y="345" text-anchor="middle">custom speech models</text>
    <text x="577" y="329" text-anchor="middle">custom speech,</text>
    <text x="577" y="345" text-anchor="middle">Whisper base models</text>
    <text x="727" y="329" text-anchor="middle">prompts</text>
    <text x="727" y="345" text-anchor="middle">(no training)</text>

    <rect x="20" y="362" width="780" height="50" fill="#ffffff"/>
    <text x="30" y="391" font-weight="700">Typical job</text>
    <text x="277" y="383" text-anchor="middle">captions, dictation,</text>
    <text x="277" y="399" text-anchor="middle">voice search</text>
    <text x="427" y="383" text-anchor="middle">voicemail, podcast</text>
    <text x="427" y="399" text-anchor="middle">episode, meeting clip</text>
    <text x="577" y="383" text-anchor="middle">call-center archive,</text>
    <text x="577" y="399" text-anchor="middle">nightly backlog</text>
    <text x="727" y="383" text-anchor="middle">jargon-heavy or</text>
    <text x="727" y="399" text-anchor="middle">accented audio</text>
  </g>

  <!-- latency arrow -->
  <line x1="210" y1="440" x2="790" y2="440" stroke="#78909c" stroke-width="2"/>
  <polygon points="790,434 802,440 790,446" fill="#78909c"/>
  <text x="30" y="444" font-size="11" font-weight="700" fill="#455a64">Wait you accept</text>
  <text x="214" y="460" font-size="10" fill="#455a64">interactive</text>
  <text x="740" y="460" font-size="10" fill="#455a64">offline</text>
</svg>
