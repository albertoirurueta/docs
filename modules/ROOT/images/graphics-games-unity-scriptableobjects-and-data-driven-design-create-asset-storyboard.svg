<text x="582" y="74" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="654" y="74" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Press Play</text>
<rect x="578" y="92" width="136" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="608" y="112" width="76" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="646.0" y="150.5" text-anchor="middle" font-size="10" fill="#92400E">Moby-Dick</text>
<text x="646" y="232" text-anchor="middle" font-size="10" fill="#374151">The book shows</text>
<text x="646" y="244" text-anchor="middle" font-size="10" fill="#374151">its title and colour</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#374151">Each panel is an Editor step on Unity 6.3 LTS; the asset is a single file that scenes and prefabs reference.</text>
<text x="380" y="310" text-anchor="middle" font-size="11" fill="#374151">The Create menu entry comes from the CreateAssetMenu attribute on the BookData class.</text>
