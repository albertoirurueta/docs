<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" width="1080" height="381" role="img" aria-labelledby="sap-finance-guide-compute-a-depreciation-schedule-09-result-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-compute-a-depreciation-schedule-09-result-title">Terminal after npm test in the depreciation project: every test is marked with a check, from the three examples of the SAP help pages to the rejected inputs, and the summary shows no failed test; the times in parentheses differ per run; callout 16 marks the command</title>
<g><rect x="0" y="0" width="1080" height="381" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="349" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm test</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ SAP example: APC 1,000 over 10 years is 100 a year (123.064167ms)</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ SAP example: net book value 500 over 5 remaining years is 100 (0.12725ms)</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ SAP example: net book value 700, life 10, factor 3 is 210 (0.045875ms)</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ straight-line schedule of the van (0.327125ms)</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ declining balance with changeover for the van (0.080959ms)</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ the group area of EX01 has an APC of 15,300.00: 3,060.00 a year (0.063542ms)</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ the sum of every schedule equals the base, whatever the rounding (0.083458ms)</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ the function answers the remaining-life example (21.916583ms)</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ the bound function reads the van from its master record (2.872791ms)</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ the bound function uses the method of the shelving (1.437625ms)</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ rejects an unknown method (2.45425ms)</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">✔ rejects declining balance without a factor and zero years (1.543708ms)</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ pass 12</text>
<text x="16" y="356" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ℹ fail 0</text>
