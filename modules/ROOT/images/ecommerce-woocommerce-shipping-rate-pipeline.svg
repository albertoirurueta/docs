<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">From the cart to the shipping line of the order</title>
  <desc id="d">The cart builds shipping packages and passes them through the woocommerce_cart_shipping_packages filter, where Pocket Coffee splits them into parcels. WooCommerce hashes each package and reuses the rates stored in the session when nothing changed. Otherwise it finds the zone, asks every method instance whether it is available, calls calculate_shipping, collects the rates added with add_rate and applies the woocommerce_package_rates filter. The shopper selects one rate per package through the Store API or the classic checkout, and the order stores it as a shipping line item.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="260" height="90" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140.0" y="71.0" text-anchor="middle" font-weight="bold">Cart</text>
  <text x="140.0" y="89.0" text-anchor="middle">items that need shipping</text>
  <text x="140.0" y="107.0" text-anchor="middle">customer shipping address</text>
  <rect x="320" y="40" width="260" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="71.0" text-anchor="middle" font-weight="bold">Packages filter</text>
  <text x="450.0" y="89.0" text-anchor="middle">woocommerce_cart_shipping_packages</text>
  <text x="450.0" y="107.0" text-anchor="middle">split into parcels of 5 kg</text>
  <rect x="630" y="40" width="260" height="90" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="760.0" y="71.0" text-anchor="middle" font-weight="bold">Package hash and session</text>
  <text x="760.0" y="89.0" text-anchor="middle">shipping_for_package_N</text>
  <text x="760.0" y="107.0" text-anchor="middle">same hash: reuse stored rates</text>
  <line x1="270" y1="85" x2="318" y2="85" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="85" x2="628" y2="85" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M760,130 L760,160 L140,160 L140,188" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="190" width="260" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140.0" y="221.0" text-anchor="middle" font-weight="bold">Zone match</text>
  <text x="140.0" y="239.0" text-anchor="middle">WC_Shipping_Zones::</text>
  <text x="140.0" y="257.0" text-anchor="middle">get_zone_matching_package</text>
  <rect x="320" y="190" width="260" height="90" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="221.0" text-anchor="middle" font-weight="bold">Each method instance</text>
  <text x="450.0" y="239.0" text-anchor="middle">is_available, calculate_shipping</text>
  <text x="450.0" y="257.0" text-anchor="middle">add_rate (cost, taxes, meta)</text>
  <rect x="630" y="190" width="260" height="90" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="760.0" y="221.0" text-anchor="middle" font-weight="bold">woocommerce_package_rates</text>
  <text x="760.0" y="239.0" text-anchor="middle">filter: hide, reorder or</text>
  <text x="760.0" y="257.0" text-anchor="middle">change the collected rates</text>
  <line x1="270" y1="235" x2="318" y2="235" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="235" x2="628" y2="235" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M760,280 L760,310 L140,310 L140,338" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="340" width="260" height="90" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="140.0" y="371.0" text-anchor="middle" font-weight="bold">Rates for the shopper</text>
  <text x="140.0" y="389.0" text-anchor="middle">Store API shipping_rates</text>
  <text x="140.0" y="407.0" text-anchor="middle">classic: shipping options</text>
  <rect x="320" y="340" width="260" height="90" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="371.0" text-anchor="middle" font-weight="bold">Selection</text>
  <text x="450.0" y="389.0" text-anchor="middle">POST cart/select-shipping-rate</text>
  <text x="450.0" y="407.0" text-anchor="middle">one rate per package</text>
  <rect x="630" y="340" width="260" height="90" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="760.0" y="371.0" text-anchor="middle" font-weight="bold">Order shipping line</text>
  <text x="760.0" y="389.0" text-anchor="middle">method_id, instance_id,</text>
  <text x="760.0" y="407.0" text-anchor="middle">total, taxes, meta_data</text>
  <line x1="270" y1="385" x2="318" y2="385" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="385" x2="628" y2="385" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="465" text-anchor="middle" font-size="11" opacity="0.85">Changing the address, the cart contents or the cart subtotal changes the hash, so rates are calculated again.</text>
</svg>
