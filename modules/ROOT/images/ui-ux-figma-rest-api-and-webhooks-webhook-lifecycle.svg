<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Webhook lifecycle for the Bookshelf library file</text>

<rect x="20" y="52" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="38" cy="70" r="11" fill="#4F46E5"/><text x="38" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="95" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Create</text>
<text x="95" y="120" text-anchor="middle" font-size="12" fill="#374151">POST /v2/webhooks</text>
<text x="95" y="138" text-anchor="middle" font-size="12" fill="#374151">context, event, passcode</text>

<rect x="200" y="52" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="218" cy="70" r="11" fill="#4F46E5"/><text x="218" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="275" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">PING</text>
<text x="275" y="120" text-anchor="middle" font-size="12" fill="#374151">Sent once on success</text>
<text x="275" y="138" text-anchor="middle" font-size="12" fill="#374151">proves the URL works</text>

<rect x="380" y="52" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="398" cy="70" r="11" fill="#B45309"/><text x="398" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="455" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Event</text>
<text x="455" y="120" text-anchor="middle" font-size="12" fill="#374151">LIBRARY_PUBLISH</text>
<text x="455" y="138" text-anchor="middle" font-size="12" fill="#374151">POST with JSON body</text>

<rect x="560" y="52" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<circle cx="578" cy="70" r="11" fill="#047857"/><text x="578" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="640" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Verify, reply</text>
<text x="640" y="120" text-anchor="middle" font-size="12" fill="#374151">Compare passcode,</text>
<text x="640" y="138" text-anchor="middle" font-size="12" fill="#374151">answer 200 OK fast</text>

<path d="M170,107 L198,107" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<path d="M350,107 L378,107" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<path d="M530,107 L558,107" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>

<rect x="20" y="190" width="700" height="124" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="36" y="214" font-size="14" font-weight="bold" fill="#92400E">If the reply is not 200 OK, or times out</text>
<line x1="60" y1="256" x2="680" y2="256" stroke="#E5E7EB" stroke-width="3"/>
<circle cx="80" cy="256" r="7" fill="#B91C1C"/><text x="80" y="282" text-anchor="middle" font-size="12" fill="#374151">fails</text>
<circle cx="250" cy="256" r="7" fill="#B45309"/><text x="250" y="282" text-anchor="middle" font-size="12" fill="#374151">retry 1 after 5 min</text>
<circle cx="440" cy="256" r="7" fill="#B45309"/><text x="440" y="282" text-anchor="middle" font-size="12" fill="#374151">retry 2 after 30 min</text>
<circle cx="640" cy="256" r="7" fill="#B45309"/><text x="640" y="282" text-anchor="middle" font-size="12" fill="#374151">retry 3 after 3 h</text>
<text x="370" y="240" text-anchor="middle" font-size="12" fill="#374151">Up to three retries with growing delay; the endpoint is not switched off automatically</text>
</svg>
