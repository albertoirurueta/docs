<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-uitk-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From UXML and USS to the visual tree and the screen</text>
<text x="130" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Hud.uxml (structure)</text>
<rect x="15" y="70" width="230" height="170" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="25" y="92" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;VisualElement name="hud"&gt;</text>
<text x="35" y="112" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;Label name="score"</text>
<text x="55" y="127" font-size="11" fill="#374151" font-family="Courier, monospace">class="stat"/&gt;</text>
<text x="35" y="147" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;Label name="timer"</text>
<text x="55" y="162" font-size="11" fill="#374151" font-family="Courier, monospace">class="stat"/&gt;</text>
<text x="35" y="182" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;Button name="pause"/&gt;</text>
<text x="35" y="202" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;ListView name="shelf"/&gt;</text>
<text x="25" y="222" font-size="11" fill="#374151" font-family="Courier, monospace">&lt;/VisualElement&gt;</text>
<text x="130" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Hud.uss (style)</text>
<rect x="15" y="282" width="230" height="130" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="25" y="304" font-size="11" fill="#92400E" font-family="Courier, monospace">#hud { flex-direction: row; }</text>
<text x="25" y="324" font-size="11" fill="#92400E" font-family="Courier, monospace">.stat { font-size: 28px;</text>
<text x="25" y="339" font-size="11" fill="#92400E" font-family="Courier, monospace">  color: #F5E6C8; }</text>
<text x="25" y="359" font-size="11" fill="#92400E" font-family="Courier, monospace">Button:hover { scale: 1.05; }</text>
<text x="25" y="379" font-size="11" fill="#92400E" font-family="Courier, monospace">#pause { transition-duration:</text>
<text x="25" y="394" font-size="11" fill="#92400E" font-family="Courier, monospace">  0.15s; }</text>
<text x="500" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Visual tree of one panel</text>
<rect x="290" y="70" width="460" height="342" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="410" y="85" width="220" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="520" y="102" text-anchor="middle" font-size="12" fill="#3730A3">panel root (rootVisualElement)</text>
<text x="520" y="117" text-anchor="middle" font-size="10" fill="#3730A3">owned by the UI Document</text>
<rect x="430" y="150" width="180" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="520" y="167" text-anchor="middle" font-size="12" fill="#3730A3">VisualElement #hud</text>
<text x="520" y="182" text-anchor="middle" font-size="10" fill="#3730A3">flex row container</text>
<rect x="305" y="240" width="130" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="370" y="260" text-anchor="middle" font-size="12" fill="#1F2937">Label #score</text>
<text x="370" y="276" text-anchor="middle" font-size="10" fill="#374151">class .stat</text>
<rect x="445" y="240" width="130" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="510" y="260" text-anchor="middle" font-size="12" fill="#1F2937">Label #timer</text>
<text x="510" y="276" text-anchor="middle" font-size="10" fill="#374151">class .stat</text>
<rect x="585" y="240" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="260" text-anchor="middle" font-size="12" fill="#1F2937">Button #pause</text>
<text x="660" y="276" text-anchor="middle" font-size="10" fill="#374151">ClickEvent callback</text>
<rect x="350" y="320" width="320" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="510" y="340" text-anchor="middle" font-size="12" fill="#1F2937">ListView #shelf (virtualized)</text>
<text x="510" y="356" text-anchor="middle" font-size="10" fill="#374151">makeItem and bindItem recycle a few rows</text>
<line x1="520" y1="125" x2="520" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-tree)"/>
<line x1="490" y1="190" x2="380" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-tree)"/>
<line x1="520" y1="190" x2="515" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-tree)"/>
<line x1="600" y1="190" x2="650" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-tree)"/>
<line x1="245" y1="150" x2="305" y2="262" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-unity-uitk-tree)"/>
<line x1="245" y1="335" x2="320" y2="290" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-unity-uitk-tree)"/>
<text x="520" y="395" text-anchor="middle" font-size="11" fill="#374151">The UI Document instantiates the UXML into this tree; USS rules are matched by type, name, class and pseudo-class.</text>
<text x="520" y="410" text-anchor="middle" font-size="11" fill="#374151">Your script finds elements with root.Q by name and registers callbacks.</text>
<text x="380" y="432" text-anchor="middle" font-size="10" fill="#374151">Solid arrows: parent to child. Dashed arrows: UXML instantiated into the tree, USS rules applied to it.</text>
</svg>
