<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Modifier keys on macOS and Windows</text>
  <rect x="40" y="50" width="330" height="270" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/><rect x="390" y="50" width="330" height="270" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="205" y="76" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">macOS</text>
  <text x="555" y="76" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">Windows</text>
  <text x="55" y="115" font-size="11" fill="#6B7280" text-anchor="start">Primary modifier</text>
  <rect x="55" y="122" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="130.0" y="140.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Command</text>
  <rect x="405" y="122" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="480.0" y="140.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Ctrl</text>
  <text x="55" y="159" font-size="11" fill="#6B7280" text-anchor="start">Secondary modifier</text>
  <rect x="55" y="166" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="130.0" y="184.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Option</text>
  <rect x="405" y="166" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="480.0" y="184.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Alt</text>
  <text x="55" y="203" font-size="11" fill="#6B7280" text-anchor="start">Shift</text>
  <rect x="55" y="210" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="130.0" y="228.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Shift</text>
  <rect x="405" y="210" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="480.0" y="228.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Shift</text>
  <text x="55" y="247" font-size="11" fill="#6B7280" text-anchor="start">Emoji (Docs, comments)</text>
  <rect x="55" y="254" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="130.0" y="272.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Shift + ;</text>
  <rect x="405" y="254" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="480.0" y="272.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Win + ;</text>
  <text x="55" y="291" font-size="11" fill="#6B7280" text-anchor="start">Quit the desktop app</text>
  <rect x="55" y="298" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="130.0" y="316.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Command + Q</text>
  <rect x="405" y="298" width="150" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="480.0" y="316.5" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Alt + F4</text>
  <text x="380" y="342" font-size="12" fill="#B45309" text-anchor="middle" font-weight="bold">Same letter, same action: Undo is Z on both, with the primary modifier.</text>
  <text x="380" y="362" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
