<text x="555.0" y="239.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">present N+1</text>
<rect x="660" y="215" width="70" height="40" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="695.0" y="239.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">N+2</text>
<line x1="150" y1="95" x2="210" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ff)"/>
<line x1="285" y1="95" x2="360" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ff)"/>
<line x1="425" y1="95" x2="510" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ff)"/>
<line x1="285" y1="175" x2="360" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ff)"/>
