<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two frames in flight: CPU recording overlaps GPU execution</text>
<text x="60" y="78" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">CPU</text>
<text x="60" y="158" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">GPU</text>
<text x="60" y="238" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">Display</text>
<rect x="80" y="55" width="130" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="79.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">record N</text>
<rect x="220" y="55" width="130" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="79.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">record N+1</text>
<rect x="360" y="55" width="130" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="425.0" y="79.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">fence wait, record N+2</text>
<rect x="520" y="55" width="130" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="585.0" y="79.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">record N+3</text>
<rect x="210" y="135" width="150" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="285.0" y="159.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">execute N</text>
<rect x="360" y="135" width="150" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="435.0" y="159.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">execute N+1</text>
<rect x="510" y="135" width="150" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="585.0" y="159.0" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">execute N+2</text>
