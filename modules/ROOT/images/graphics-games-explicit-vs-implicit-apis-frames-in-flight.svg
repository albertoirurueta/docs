<line x1="80" y1="292" x2="740" y2="292" stroke="#4B5563" stroke-width="1"/>
<text x="80" y="310" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start">time</text>
<text x="380" y="330" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Per-frame resources (command pool, uniform buffer) exist once per frame in flight, usually 2 or 3.</text>
</svg>
