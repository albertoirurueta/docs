<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-sc-budget" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Object reservation: limits are declared once at device creation</text>
<rect x="20" y="55" width="330" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="185.0" y="87.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">VkDeviceObjectReservationCreateInfo</text>
<text x="185.0" y="103.0" text-anchor="middle" font-size="12" fill="#3730A3">Counts of every object kind</text>
<text x="185.0" y="119.0" text-anchor="middle" font-size="12" fill="#3730A3">and sizes of pipeline pools</text>
<rect x="410" y="55" width="330" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="575.0" y="87.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">vkCreateDevice</text>
<text x="575.0" y="103.0" text-anchor="middle" font-size="12" fill="#92400E">Memory for each object is set aside</text>
<text x="575.0" y="119.0" text-anchor="middle" font-size="12" fill="#92400E">while the device is created</text>
<line x1="350" y1="100" x2="408" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-budget)"/>
<text x="20" y="199" text-anchor="start" font-size="12" fill="#3730A3">bufferRequestCount</text>
<rect x="250" y="185" width="256" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="514" y="199" text-anchor="start" font-size="11" fill="#374151">buffers alive at once</text>
<text x="20" y="233" text-anchor="start" font-size="12" fill="#3730A3">imageRequestCount</text>
<rect x="250" y="219" width="128" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="386" y="233" text-anchor="start" font-size="11" fill="#374151">images alive at once</text>
<text x="20" y="267" text-anchor="start" font-size="12" fill="#3730A3">imageViewRequestCount</text>
<rect x="250" y="253" width="256" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="514" y="267" text-anchor="start" font-size="11" fill="#374151">image views alive at once</text>
<text x="20" y="301" text-anchor="start" font-size="12" fill="#3730A3">graphicsPipelineRequestCount</text>
<rect x="250" y="287" width="32" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="290" y="301" text-anchor="start" font-size="11" fill="#374151">graphics pipelines alive at once</text>
<text x="20" y="335" text-anchor="start" font-size="12" fill="#3730A3">commandBufferRequestCount</text>
<rect x="250" y="321" width="48" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="306" y="335" text-anchor="start" font-size="11" fill="#374151">command buffers over all pools</text>
<text x="20" y="369" text-anchor="start" font-size="12" fill="#3730A3">descriptorSetRequestCount</text>
<rect x="250" y="355" width="64" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="322" y="369" text-anchor="start" font-size="11" fill="#374151">descriptor sets alive at once</text>
<text x="380" y="405" text-anchor="middle" font-size="11" fill="#374151">Bar lengths are illustrative; real limits depend on the application and are checked against the device limits.</text>
</svg>
