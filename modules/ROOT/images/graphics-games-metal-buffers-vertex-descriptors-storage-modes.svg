<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-buffers-vertex-descriptors-storage-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Choosing a storage mode for a buffer</text>
<rect x="300" y="50" width="160" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="76.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">New buffer</text>
<rect x="40" y="130" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="154.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Does the CPU write it</text>
<text x="140.0" y="169.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">every frame?</text>
<rect x="520" y="130" width="200" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="154.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Is it written once and</text>
<text x="620.0" y="169.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">read by the GPU only?</text>
<line x1="340" y1="94" x2="170" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-buffers-vertex-descriptors-storage-modes)"/>
<line x1="420" y1="94" x2="600" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-buffers-vertex-descriptors-storage-modes)"/>
<rect x="40" y="230" width="200" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="140.0" y="249.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">storageModeShared</text>
<text x="140.0" y="263.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU and GPU see the same</text>
<text x="140.0" y="277.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">memory (unified memory)</text>
<rect x="280" y="230" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="249.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">storageModePrivate</text>
<text x="380.0" y="263.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GPU only: fill it with a</text>
<text x="380.0" y="277.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blit copy from a staging buffer</text>
<rect x="520" y="230" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="249.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">storageModeManaged</text>
<text x="620.0" y="263.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Mac only, deprecated in the</text>
<text x="620.0" y="277.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">27 OSes: avoid in new code</text>
<line x1="140" y1="186" x2="140" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-buffers-vertex-descriptors-storage-modes)"/>
<text x="150" y="212" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">yes</text>
<line x1="600" y1="186" x2="400" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-buffers-vertex-descriptors-storage-modes)"/>
<text x="520" y="200" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">yes</text>
<line x1="640" y1="186" x2="620" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-buffers-vertex-descriptors-storage-modes)"/>
<text x="650" y="212" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Intel Mac legacy</text>
<text x="380" y="325" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Apple silicon has one memory pool, so shared is cheap and the default for small dynamic data.</text>
<text x="380" y="345" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Memoryless exists only for textures (render targets that live in tile memory), never for buffers.</text>
</svg>
