<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 564" width="780" height="564" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title id="t">The shelf package: its source directory and the five states of an R package</title>
<desc id="d">Two panels. The left panel is the directory tree of the shelf source package with a one-line role for each entry: DESCRIPTION holds the metadata and dependencies, NAMESPACE the exports and imports written by roxygen2, .Rbuildignore the files left out of the bundle, R holds the functions and sysdata.rda, man the Rd help pages written by roxygen2, data the exported datasets, data-raw the scripts that build them and is not shipped, inst is copied as it is and holds CITATION and extdata, tests/testthat holds the tests, and vignettes the long-form guides. The right panel is a vertical chain of the five states of a package. The source package is turned into a bundle, the file shelf_0.1.0.tar.gz, by R CMD build. The bundle is turned into a binary package by R CMD INSTALL with the option --build. The binary is turned into an installed package, a folder in a library, by install.packages or R CMD INSTALL. An installed package becomes a package in memory, with its namespace loaded and the package attached, through library or loadNamespace. A note below says that R CMD INSTALL on the directory or the bundle goes straight to the installed state, and that devtools load_all goes straight from the source directory to memory without building anything.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker></defs>
<rect width="780" height="564" fill="#ffffff" stroke="#9aa3ad"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f2933">The shelf package: what is in the directory, and what happens to it</text>

<rect x="14" y="44" width="372" height="448" fill="#f5f7fa" stroke="#52606d"/>
<text x="26" y="68" font-weight="bold" fill="#1f2933">Source package</text>
<text x="360" y="68" text-anchor="end" font-size="13" font-family="Menlo, Consolas, monospace" fill="#3e4c59">~/shelf</text>

<g font-size="13">
<rect x="22" y="80" width="356" height="30" fill="#fbe7b5" stroke="#52606d"/>
<text x="30" y="99" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">DESCRIPTION</text>
<text x="162" y="99" fill="#1f2933">metadata, dependencies, licence</text>

<rect x="22" y="114" width="356" height="30" fill="#fbe7b5" stroke="#52606d"/>
<text x="30" y="133" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">NAMESPACE</text>
<text x="162" y="133" fill="#1f2933">exports and imports (roxygen2)</text>

<rect x="22" y="148" width="356" height="30" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="6 4"/>
<text x="30" y="167" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">.Rbuildignore</text>
<text x="162" y="167" fill="#1f2933">files left out of the bundle</text>

<rect x="22" y="182" width="356" height="30" fill="#cfe3f7" stroke="#52606d"/>
<text x="30" y="201" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">R/</text>
<text x="162" y="201" fill="#1f2933">the functions, sysdata.rda</text>

<rect x="22" y="216" width="356" height="30" fill="#cfe3f7" stroke="#52606d"/>
<text x="30" y="235" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">man/</text>
<text x="162" y="235" fill="#1f2933">Rd help pages (roxygen2)</text>

<rect x="22" y="250" width="356" height="30" fill="#cfe3f7" stroke="#52606d"/>
<text x="30" y="269" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">data/</text>
<text x="162" y="269" fill="#1f2933">exported datasets (.rda)</text>

<rect x="22" y="284" width="356" height="30" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="6 4"/>
<text x="30" y="303" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">data-raw/</text>
<text x="162" y="303" fill="#1f2933">scripts that build data/ (not shipped)</text>

<rect x="22" y="318" width="356" height="30" fill="#d9efd6" stroke="#52606d"/>
<text x="30" y="337" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">inst/</text>
<text x="162" y="337" fill="#1f2933">copied as is: CITATION, extdata/</text>

<rect x="22" y="352" width="356" height="30" fill="#d9efd6" stroke="#52606d"/>
<text x="30" y="371" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">tests/testthat/</text>
<text x="162" y="371" fill="#1f2933">the tests</text>

<rect x="22" y="386" width="356" height="30" fill="#d9efd6" stroke="#52606d"/>
<text x="30" y="405" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2933">vignettes/</text>
<text x="162" y="405" fill="#1f2933">long-form guides (Rmd)</text>
</g>
<text x="26" y="440" font-size="13" fill="#3e4c59">Also optional: src/ (C, C++, Fortran), exec/, demo/, po/,</text>
<text x="26" y="458" font-size="13" fill="#3e4c59">NEWS.md and LICENSE sit next to DESCRIPTION.</text>
<text x="26" y="476" font-size="13" fill="#3e4c59">Dashed boxes are left out of the bundle.</text>

<text x="410" y="68" font-weight="bold" fill="#1f2933">The five states</text>

<rect x="410" y="80" width="230" height="56" fill="#fbe7b5" stroke="#52606d"/>
<text x="424" y="103" font-weight="bold" fill="#1f2933">1  source</text>
<text x="424" y="123" font-size="13" fill="#1f2933">the directory <tspan font-family="Menlo, Consolas, monospace">shelf/</tspan></text>

<line x1="525" y1="136" x2="525" y2="170" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="538" y="158" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">R CMD build shelf</text>

<rect x="410" y="172" width="230" height="56" fill="#cfe3f7" stroke="#52606d"/>
<text x="424" y="195" font-weight="bold" fill="#1f2933">2  bundle</text>
<text x="424" y="215" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">shelf_0.1.0.tar.gz</text>

<line x1="525" y1="228" x2="525" y2="262" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="538" y="250" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">R CMD INSTALL --build</text>

<rect x="410" y="264" width="230" height="56" fill="#cfe3f7" stroke="#52606d"/>
<text x="424" y="287" font-weight="bold" fill="#1f2933">3  binary</text>
<text x="424" y="307" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2933">shelf_0.1.0_R_&lt;platform&gt;.tar.gz</text>

<line x1="525" y1="320" x2="525" y2="372" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="538" y="343" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">install.packages()</text>
<text x="538" y="360" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">R CMD INSTALL</text>

<rect x="410" y="374" width="230" height="56" fill="#d9efd6" stroke="#52606d"/>
<text x="424" y="397" font-weight="bold" fill="#1f2933">4  installed</text>
<text x="424" y="417" font-size="13" fill="#1f2933">a folder inside a library</text>

<line x1="525" y1="430" x2="525" y2="474" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="538" y="447" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2933">library(shelf)</text>
<text x="538" y="464" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2933">loadNamespace("shelf")</text>

<rect x="410" y="476" width="230" height="56" fill="#fbe7b5" stroke="#52606d"/>
<text x="424" y="499" font-weight="bold" fill="#1f2933">5  in memory</text>
<text x="424" y="519" font-size="12" fill="#1f2933">namespace loaded, package attached</text>

<path d="M640 108 C 765 108, 765 504, 640 504" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text transform="translate(754 306) rotate(90)" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2933">devtools::load_all()</text>
<text x="410" y="554" font-size="12" fill="#3e4c59">R CMD INSTALL on shelf/ or on the bundle goes straight to state 4.</text>
</svg>
