<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How Flask-Login finds the current user</title>
  <defs>
    <marker id="flu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">How current_user is resolved on the first access in a request</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">steps run in this order; the request loader is consulted only when no remember cookie is sent</text>
  <rect x="10" y="70" width="150" height="90" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="85" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">1 Session guard</text>
  <text x="85" y="116" font-size="10.5" fill="currentColor" text-anchor="middle">SESSION_PROTECTION</text>
  <text x="85" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">compares the stored</text>
  <text x="85" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">client fingerprint</text>
  <line x1="160" y1="115" x2="190" y2="115" stroke="currentColor" stroke-width="1.5" marker-end="url(#flu-arrow)"/>
  <rect x="190" y="70" width="150" height="90" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="265" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">2 Session cookie</text>
  <text x="265" y="116" font-size="10.5" fill="currentColor" text-anchor="middle">_user_id in session</text>
  <text x="265" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">then user_loader(id)</text>
  <text x="265" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">session is fresh</text>
  <line x1="340" y1="115" x2="370" y2="115" stroke="currentColor" stroke-width="1.5" marker-end="url(#flu-arrow)"/>
  <rect x="370" y="70" width="150" height="90" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="445" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">3 Remember cookie</text>
  <text x="445" y="116" font-size="10.5" fill="currentColor" text-anchor="middle">remember_token</text>
  <text x="445" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">then user_loader(id)</text>
  <text x="445" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">session is not fresh</text>
  <line x1="520" y1="115" x2="550" y2="115" stroke="currentColor" stroke-width="1.5" marker-end="url(#flu-arrow)"/>
  <rect x="550" y="70" width="160" height="90" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="630" y="94" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">4 request_loader</text>
  <text x="630" y="116" font-size="10.5" fill="currentColor" text-anchor="middle">API tokens, Basic auth,</text>
  <text x="630" y="132" font-size="10.5" fill="currentColor" text-anchor="middle">any header you decode</text>
  <text x="630" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">no session involved</text>
  <line x1="630" y1="160" x2="630" y2="205" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#flu-arrow)"/>
  <line x1="85" y1="160" x2="85" y2="262" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="85" y1="262" x2="190" y2="262" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#flu-arrow)"/>
  <rect x="190" y="205" width="260" height="115" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="230" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Outcome stored in g</text>
  <text x="320" y="254" font-size="10.5" fill="currentColor" text-anchor="middle">user found: current_user is that object</text>
  <text x="320" y="272" font-size="10.5" fill="currentColor" text-anchor="middle">nothing found: AnonymousUserMixin instance</text>
  <text x="320" y="290" font-size="10.5" fill="currentColor" text-anchor="middle">login_required then calls unauthorized():</text>
  <text x="320" y="306" font-size="10.5" fill="currentColor" text-anchor="middle">redirect to login_view, or 401</text>
  <line x1="630" y1="205" x2="630" y2="262" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="630" y1="262" x2="450" y2="262" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#flu-arrow)"/>
  <text x="140" y="234" font-size="10.5" fill="currentColor" text-anchor="middle">strong mode: session</text>
  <text x="140" y="250" font-size="10.5" fill="currentColor" text-anchor="middle">cleared, anonymous</text>
  <text x="540" y="292" font-size="10.5" fill="currentColor" text-anchor="middle">dashed: no user found</text>
  <text x="360" y="346" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">the result is cached for the rest of the request, so user_loader runs at most once per request</text>
</svg>
