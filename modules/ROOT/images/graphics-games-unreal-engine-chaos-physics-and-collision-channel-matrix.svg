<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Collision responses: what each pair of settings produces</text>
<text x="300.0" y="64" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Response of the other component to this one</text>
<rect x="150" y="76" width="94" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197.0" y="93.2" text-anchor="middle" font-size="12" fill="#374151">Block</text>
<rect x="250" y="76" width="94" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="297.0" y="93.2" text-anchor="middle" font-size="12" fill="#374151">Overlap</text>
<rect x="350" y="76" width="94" height="26" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="397.0" y="93.2" text-anchor="middle" font-size="12" fill="#374151">Ignore</text>
<text x="75" y="100" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">This component</text>
<rect x="20" y="112" width="120" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="80.0" y="141.2" text-anchor="middle" font-size="12" fill="#374151">Block</text>
<rect x="150" y="112" width="94" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197.0" y="133.3" text-anchor="middle" font-size="11" fill="#3730A3">Block</text>
<text x="197.0" y="148.3" text-anchor="middle" font-size="11" fill="#3730A3">Hit possible</text>
<rect x="250" y="112" width="94" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="297.0" y="133.3" text-anchor="middle" font-size="11" fill="#047857">Overlap</text>
<text x="297.0" y="148.3" text-anchor="middle" font-size="11" fill="#047857">Overlap events</text>
<rect x="350" y="112" width="94" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="397.0" y="133.3" text-anchor="middle" font-size="11" fill="#374151">Ignore</text>
<text x="397.0" y="148.3" text-anchor="middle" font-size="11" fill="#374151">no interaction</text>
<rect x="20" y="168" width="120" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="80.0" y="197.2" text-anchor="middle" font-size="12" fill="#374151">Overlap</text>
<rect x="150" y="168" width="94" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="197.0" y="189.3" text-anchor="middle" font-size="11" fill="#047857">Overlap</text>
<text x="197.0" y="204.3" text-anchor="middle" font-size="11" fill="#047857">Overlap events</text>
<rect x="250" y="168" width="94" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="297.0" y="189.3" text-anchor="middle" font-size="11" fill="#047857">Overlap</text>
<text x="297.0" y="204.3" text-anchor="middle" font-size="11" fill="#047857">Overlap events</text>
<rect x="350" y="168" width="94" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="397.0" y="189.3" text-anchor="middle" font-size="11" fill="#374151">Ignore</text>
<text x="397.0" y="204.3" text-anchor="middle" font-size="11" fill="#374151">no interaction</text>
<rect x="20" y="224" width="120" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="80.0" y="253.2" text-anchor="middle" font-size="12" fill="#374151">Ignore</text>
<rect x="150" y="224" width="94" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197.0" y="245.3" text-anchor="middle" font-size="11" fill="#374151">Ignore</text>
<text x="197.0" y="260.4" text-anchor="middle" font-size="11" fill="#374151">no interaction</text>
<rect x="250" y="224" width="94" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="297.0" y="245.3" text-anchor="middle" font-size="11" fill="#374151">Ignore</text>
<text x="297.0" y="260.4" text-anchor="middle" font-size="11" fill="#374151">no interaction</text>
<rect x="350" y="224" width="94" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="397.0" y="245.3" text-anchor="middle" font-size="11" fill="#374151">Ignore</text>
<text x="397.0" y="260.4" text-anchor="middle" font-size="11" fill="#374151">no interaction</text>
<text x="300.0" y="290" text-anchor="middle" font-size="11" fill="#374151">The weaker of the two responses decides: Ignore beats Overlap beats Block.</text>
<rect x="480" y="60" width="265" height="230" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="612" y="80" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Events need flags as well</text>
<text x="492" y="102" text-anchor="start" font-size="11" fill="#1F2937">Hit event (OnComponentHit):</text>
<text x="492" y="119" text-anchor="start" font-size="11" fill="#374151">  blocking pair plus Simulation</text>
<text x="492" y="136" text-anchor="start" font-size="11" fill="#374151">  Generates Hit Events (or a sweep</text>
<text x="492" y="153" text-anchor="start" font-size="11" fill="#374151">  that stops at the blocker)</text>
<text x="492" y="170" text-anchor="start" font-size="11" fill="#1F2937">Overlap events (Begin and End):</text>
<text x="492" y="187" text-anchor="start" font-size="11" fill="#374151">  Generate Overlap Events on both</text>
<text x="492" y="204" text-anchor="start" font-size="11" fill="#374151">  components, plus Overlap or Block</text>
<text x="492" y="221" text-anchor="start" font-size="11" fill="#374151">  responses that allow overlap</text>
<rect x="15" y="312" width="730" height="120" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="332" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Collision Enabled gates everything (per component)</text>
<rect x="25" y="346" width="112" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="81.0" y="365.0" text-anchor="middle" font-size="10" fill="#374151">No Collision</text>
<text x="81.0" y="378.0" text-anchor="middle" font-size="10" fill="#374151">ignored by all</text>
<rect x="144" y="346" width="112" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="365.0" text-anchor="middle" font-size="10" fill="#374151">Query Only</text>
<text x="200.0" y="378.0" text-anchor="middle" font-size="10" fill="#374151">traces, overlaps</text>
<rect x="263" y="346" width="112" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="319.0" y="365.0" text-anchor="middle" font-size="10" fill="#374151">Physics Only</text>
<text x="319.0" y="378.0" text-anchor="middle" font-size="10" fill="#374151">simulation only</text>
<rect x="382" y="346" width="112" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="438.0" y="365.0" text-anchor="middle" font-size="10" fill="#3730A3">Collision Enabled</text>
<text x="438.0" y="378.0" text-anchor="middle" font-size="10" fill="#3730A3">query and physics</text>
<rect x="501" y="346" width="112" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="557.0" y="365.0" text-anchor="middle" font-size="10" fill="#374151">Probe Only</text>
<text x="557.0" y="378.0" text-anchor="middle" font-size="10" fill="#374151">probe queries</text>
<rect x="620" y="346" width="112" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="676.0" y="365.0" text-anchor="middle" font-size="10" fill="#374151">Query and Probe</text>
<text x="676.0" y="378.0" text-anchor="middle" font-size="10" fill="#374151">query plus probe</text>
<text x="380" y="416" text-anchor="middle" font-size="11" fill="#374151">With collision disabled every response behaves as Ignore.</text>
</svg>
