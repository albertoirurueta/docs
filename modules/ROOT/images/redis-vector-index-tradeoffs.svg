<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Query Engine vector index algorithms: FLAT vs. HNSW vs. SVS-VAMANA</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Relative recall, query latency, memory footprint, and index build cost at comparable dataset size</text>

  <!-- table grid -->
  <!-- columns: label | FLAT | HNSW | SVS-VAMANA -->
  <!-- header row -->
  <rect x="40" y="70" width="150" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
  <rect x="190" y="70" width="170" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
  <rect x="360" y="70" width="170" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
  <rect x="530" y="70" width="190" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>

  <text x="115" y="91" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Property</text>
  <text x="275" y="91" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">FLAT</text>
  <text x="445" y="91" font-size="12.5" font-weight="bold" fill="#7a3b12" text-anchor="middle">HNSW</text>
  <text x="625" y="91" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">SVS-VAMANA</text>

  <!-- row backgrounds -->
  <rect x="40" y="104" width="680" height="70" fill="#ffffff" stroke="#eeeeee" stroke-width="1"/>
  <rect x="40" y="174" width="680" height="70" fill="#fbfbfb" stroke="#eeeeee" stroke-width="1"/>
  <rect x="40" y="244" width="680" height="70" fill="#ffffff" stroke="#eeeeee" stroke-width="1"/>
  <rect x="40" y="314" width="680" height="70" fill="#fbfbfb" stroke="#eeeeee" stroke-width="1"/>

  <text x="50" y="144" font-size="12" fill="#444444">Recall</text>
  <text x="50" y="214" font-size="12" fill="#444444">Query latency</text>
  <text x="50" y="284" font-size="12" fill="#444444">Memory footprint</text>
  <text x="50" y="354" font-size="12" fill="#444444">Index build cost</text>

  <!-- bar helper: track from x=200 width=140, x=370 width=140, x=540 width=160 -->
  <!-- Recall row: FLAT=100%, HNSW=~95%, SVS-VAMANA=~93% -->
  <g>
    <rect x="200" y="118" width="140" height="12" fill="#eaeaea"/>
    <rect x="200" y="118" width="140" height="12" fill="#1c4b73"/>
    <text x="270" y="150" font-size="10.5" fill="#666666" text-anchor="middle">exact (100%)</text>

    <rect x="370" y="118" width="140" height="12" fill="#eaeaea"/>
    <rect x="370" y="118" width="130" height="12" fill="#7a3b12"/>
    <text x="440" y="150" font-size="10.5" fill="#666666" text-anchor="middle">approximate, tunable via EF_RUNTIME</text>

    <rect x="540" y="118" width="160" height="12" fill="#eaeaea"/>
    <rect x="540" y="118" width="145" height="12" fill="#2f5424"/>
    <text x="620" y="150" font-size="10.5" fill="#666666" text-anchor="middle">approximate; compression trades a little back</text>
  </g>

  <!-- Query latency row: FLAT slow (long bar = slow), HNSW fast, SVS fast -->
  <g>
    <rect x="200" y="188" width="140" height="12" fill="#eaeaea"/>
    <rect x="200" y="188" width="140" height="12" fill="#1c4b73"/>
    <text x="270" y="220" font-size="10.5" fill="#666666" text-anchor="middle">O(n) scan, slow at scale</text>

    <rect x="370" y="188" width="140" height="12" fill="#eaeaea"/>
    <rect x="370" y="188" width="35" height="12" fill="#7a3b12"/>
    <text x="440" y="220" font-size="10.5" fill="#666666" text-anchor="middle">sub-linear graph walk, fast</text>

    <rect x="540" y="188" width="160" height="12" fill="#eaeaea"/>
    <rect x="540" y="188" width="38" height="12" fill="#2f5424"/>
    <text x="620" y="220" font-size="10.5" fill="#666666" text-anchor="middle">sub-linear, fast, cache-friendlier</text>
  </g>

  <!-- Memory footprint row: FLAT low overhead, HNSW higher (graph edges), SVS lower via LVQ/LeanVec -->
  <g>
    <rect x="200" y="258" width="140" height="12" fill="#eaeaea"/>
    <rect x="200" y="258" width="60" height="12" fill="#1c4b73"/>
    <text x="270" y="290" font-size="10.5" fill="#666666" text-anchor="middle">raw vectors only</text>

    <rect x="370" y="258" width="140" height="12" fill="#eaeaea"/>
    <rect x="370" y="258" width="125" height="12" fill="#7a3b12"/>
    <text x="440" y="290" font-size="10.5" fill="#666666" text-anchor="middle">vectors + graph edges (M per node)</text>

    <rect x="540" y="258" width="160" height="12" fill="#eaeaea"/>
    <rect x="540" y="258" width="55" height="12" fill="#2f5424"/>
    <text x="620" y="290" font-size="10.5" fill="#666666" text-anchor="middle">reduced via LVQ / LeanVec compression</text>
  </g>

  <!-- Build cost row: FLAT trivial, HNSW higher (EF_CONSTRUCTION), SVS higher still -->
  <g>
    <rect x="200" y="328" width="140" height="12" fill="#eaeaea"/>
    <rect x="200" y="328" width="20" height="12" fill="#1c4b73"/>
    <text x="270" y="360" font-size="10.5" fill="#666666" text-anchor="middle">no index structure to build</text>

    <rect x="370" y="328" width="140" height="12" fill="#eaeaea"/>
    <rect x="370" y="328" width="105" height="12" fill="#7a3b12"/>
    <text x="440" y="360" font-size="10.5" fill="#666666" text-anchor="middle">graph wiring, cost set by EF_CONSTRUCTION</text>

    <rect x="540" y="328" width="160" height="12" fill="#eaeaea"/>
    <rect x="540" y="328" width="120" height="12" fill="#2f5424"/>
    <text x="620" y="360" font-size="10.5" fill="#666666" text-anchor="middle">graph build plus compression pass</text>
  </g>

  <!-- outer border -->
  <rect x="40" y="70" width="680" height="314" fill="none" stroke="#cccccc" stroke-width="1.2"/>
  <line x1="190" y1="70" x2="190" y2="384" stroke="#dddddd" stroke-width="1"/>
  <line x1="360" y1="70" x2="360" y2="384" stroke="#dddddd" stroke-width="1"/>
  <line x1="530" y1="70" x2="530" y2="384" stroke="#dddddd" stroke-width="1"/>

  <text x="380" y="410" font-size="11" fill="#444444" text-anchor="middle">FLAT is exact but scans every vector; HNSW trades a little recall for sub-linear search at a higher memory cost.</text>
  <text x="380" y="426" font-size="11" fill="#444444" text-anchor="middle">SVS-VAMANA keeps HNSW-like search speed while shrinking memory through LVQ/LeanVec vector compression.</text>
  <text x="380" y="442" font-size="11" fill="#444444" text-anchor="middle">Bar length is illustrative, not measured -- actual numbers depend on dataset size, dimensionality, and tuning.</text>
</svg>
