<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Three ways to share arrays between threads</title>
<desc id="d">Panel one: each thread owns its array, which is safe. Panel two: threads read one read-only array and write disjoint output slices, which is safe. Panel three: threads write the same array without a lock, which races. A bottom bar shows pool workers times BLAS threads causing oversubscription.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Sharing arrays between threads</text>
<rect x="20" y="50" width="220" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="56" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="start">Thread-owned</text>
<rect x="250" y="50" width="220" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="286" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="start">Shared read-only</text>
<rect x="480" y="50" width="220" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="516" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="start">Shared and mutated</text>
<rect x="34" y="92" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="69" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">thread 1</text>
<line x1="104" y1="112" x2="136" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="138" y="92" width="70" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="173" y="117" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">arr_1</text>
<rect x="34" y="152" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="69" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">thread 2</text>
<line x1="104" y1="172" x2="136" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="138" y="152" width="70" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="173" y="177" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">arr_2</text>
<rect x="34" y="212" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="69" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">thread 3</text>
<line x1="104" y1="232" x2="136" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="138" y="212" width="70" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="173" y="237" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">arr_3</text>
<rect x="262" y="150" width="80" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="302" y="170" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">data</text>
<text x="302" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">read-only</text>
<rect x="364" y="92" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="399" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">thread 1</text>
<line x1="364" y1="112" x2="344" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="364" y="152" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
