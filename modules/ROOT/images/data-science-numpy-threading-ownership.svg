<line x1="364" y1="172" x2="344" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="364" y="212" width="70" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="399" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">thread 3</text>
<line x1="364" y1="232" x2="344" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="360" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">each writes its own slice of out</text>
<rect x="560" y="150" width="80" height="44" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="600" y="170" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">shared</text>
<text x="600" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">no lock</text>
<rect x="492" y="92" width="56" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="520" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">t1</text>
<line x1="548" y1="112" x2="558" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="492" y="152" width="56" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="520" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">t2</text>
<line x1="548" y1="172" x2="558" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="492" y="212" width="56" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="520" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">t3</text>
<line x1="548" y1="232" x2="558" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="590" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C" text-anchor="middle">inconsistent, not reproducible</text>
<circle cx="36" cy="71" r="11" fill="#0F172A"/><text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="266" cy="71" r="11" fill="#0F172A"/><text x="266" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="496" cy="71" r="11" fill="#0F172A"/><text x="496" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="20" y="300" width="680" height="80" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="360" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Oversubscription</text>
<text x="360" y="350" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">pool workers  x  BLAS threads per call  >  CPU cores   =   contention</text>
<text x="360" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">limit BLAS to one thread inside a pool (threadpoolctl)</text>
<circle cx="40" cy="326" r="11" fill="#0F172A"/><text x="40" y="331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
