<rect x="492" y="234" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="542.0" y="258" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">no</text>
