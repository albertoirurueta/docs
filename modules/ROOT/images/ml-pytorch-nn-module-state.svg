<text x="318.0" y="108" font-size="13" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">yes</text>
<rect x="380" y="84" width="100" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="430.0" y="108" font-size="13" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">yes</text>
<rect x="492" y="84" width="100" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="542.0" y="108" font-size="13" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">yes</text>
