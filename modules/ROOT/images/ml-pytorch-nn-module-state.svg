<text x="654.0" y="258" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">no</text>
<text x="360" y="304" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A plain tensor or a plain Python list of modules is invisible to all four; use Parameter, a buffer or ModuleList.</text>
