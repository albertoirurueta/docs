<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Kinds of state in an nn.Module</title>
<desc id="d">A table of four kinds of module attribute (parameter, persistent buffer, non-persistent buffer, plain tensor attribute) against four behaviours: listed by parameters(), saved in state_dict, moved by to(), and updated by the optimizer.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Where each kind of module state shows up</text>
<text x="318.0" y="66" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">parameters()</text>
<text x="430.0" y="66" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">state_dict()</text>
<text x="542.0" y="66" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">moved by .to()</text>
<text x="654.0" y="66" font-size="11" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">in optimizer</text>
<text x="20" y="108" font-size="11" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">nn.Parameter</text>
