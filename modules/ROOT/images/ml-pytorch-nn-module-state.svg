<text x="654.0" y="108" font-size="13" fill="#0F172A" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">yes</text>
<text x="20" y="158" font-size="11" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">register_buffer(persistent=True)</text>
<rect x="268" y="134" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="318.0" y="158" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">no</text>
