<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">RED, USE and the Four Golden Signals mapped onto each other</title>
  <desc id="d">Three columns. RED for services: rate, errors, duration. Golden signals: traffic, errors, latency, saturation. USE for resources: utilization, saturation, errors. Arrows connect equivalent signals.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2933; }
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 11px; fill: #52606d; }
    .b { font-size: 13px; }
    .box { stroke-width: 1.5; }
    .red { fill: #fde8e8; stroke: #c0392b; }
    .gol { fill: #fff4d6; stroke: #b7791f; }
    .use { fill: #e3f0fb; stroke: #2b6cb0; }
    .ln { stroke: #52606d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="h">Which signal answers which question</text>

  <text x="100" y="62" text-anchor="middle" class="h">RED</text>
  <text x="100" y="78" text-anchor="middle" class="s">requests, per service</text>
  <text x="360" y="62" text-anchor="middle" class="h">Four Golden Signals</text>
  <text x="360" y="78" text-anchor="middle" class="s">user-facing system</text>
  <text x="620" y="62" text-anchor="middle" class="h">USE</text>
  <text x="620" y="78" text-anchor="middle" class="s">resources, per host or pool</text>

  <rect x="20" y="95" width="160" height="50" rx="6" class="box red"/>
  <text x="100" y="116" text-anchor="middle" class="b">Rate</text>
  <text x="100" y="133" text-anchor="middle" class="s">requests per second</text>
  <rect x="20" y="165" width="160" height="50" rx="6" class="box red"/>
  <text x="100" y="186" text-anchor="middle" class="b">Errors</text>
  <text x="100" y="203" text-anchor="middle" class="s">failed requests</text>
  <rect x="20" y="235" width="160" height="50" rx="6" class="box red"/>
  <text x="100" y="256" text-anchor="middle" class="b">Duration</text>
  <text x="100" y="273" text-anchor="middle" class="s">latency distribution</text>

  <rect x="260" y="95" width="200" height="40" rx="6" class="box gol"/>
  <text x="360" y="120" text-anchor="middle" class="b">Traffic</text>
  <rect x="260" y="155" width="200" height="40" rx="6" class="box gol"/>
  <text x="360" y="180" text-anchor="middle" class="b">Errors</text>
  <rect x="260" y="215" width="200" height="40" rx="6" class="box gol"/>
  <text x="360" y="240" text-anchor="middle" class="b">Latency</text>
  <rect x="260" y="275" width="200" height="40" rx="6" class="box gol"/>
  <text x="360" y="300" text-anchor="middle" class="b">Saturation</text>

  <rect x="540" y="95" width="160" height="50" rx="6" class="box use"/>
  <text x="620" y="116" text-anchor="middle" class="b">Utilization</text>
  <text x="620" y="133" text-anchor="middle" class="s">time busy, or share used</text>
  <rect x="540" y="165" width="160" height="50" rx="6" class="box use"/>
  <text x="620" y="186" text-anchor="middle" class="b">Saturation</text>
  <text x="620" y="203" text-anchor="middle" class="s">queued extra work</text>
  <rect x="540" y="235" width="160" height="50" rx="6" class="box use"/>
  <text x="620" y="256" text-anchor="middle" class="b">Errors</text>
  <text x="620" y="273" text-anchor="middle" class="s">error events</text>

  <path class="ln" d="M180 120 H260"/>
  <path class="ln" d="M180 190 H260"/>
  <path class="ln" d="M180 260 L260 235"/>
  <path class="ln" d="M460 295 L540 190"/>
  <path class="ln" d="M460 175 L540 260"/>
  <path class="ln" d="M460 295 L540 120"/>

  <text x="100" y="312" text-anchor="middle" class="s">Alert on these: they describe</text>
  <text x="100" y="326" text-anchor="middle" class="s">what users feel (symptoms)</text>
  <text x="620" y="312" text-anchor="middle" class="s">Debug with these: they point</text>
  <text x="620" y="326" text-anchor="middle" class="s">at resource causes</text>
  <text x="360" y="345" text-anchor="middle" class="s">Golden signals = RED plus saturation</text>
  <text x="360" y="375" text-anchor="middle" class="s">Dashed lines connect equivalent or related signals. Bookshelf example: Rate = http_server_requests_seconds_count</text>
</svg>
