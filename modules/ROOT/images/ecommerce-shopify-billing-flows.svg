<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify App Pricing and Manual Pricing billing flows</title>
  <desc id="d">Two lanes. Shopify App Pricing: plans are defined in the Partner Dashboard, Shopify hosts the plan selection page and creates the subscription, the merchant returns to the welcome link with plan_handle, and the app reads the Partner API activeSubscription query; usage events go to the App Events API. Manual Pricing: the app calls appSubscriptionCreate or appPurchaseOneTimeCreate, redirects the merchant to the confirmationUrl, Shopify redirects to the returnUrl, and the app reads currentAppInstallation and the APP_SUBSCRIPTIONS_UPDATE webhook.</desc>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="14" fill="#f2f5f8">
    <text x="20" y="30" font-weight="bold">Shopify App Pricing (default for new public apps): Shopify bills, the app only reads state</text>
    <text x="20" y="128" font-weight="bold">Usage reporting with App Pricing</text>
    <text x="20" y="226" font-weight="bold">Manual Pricing (Billing API, legacy): the app creates every charge</text>
  </g>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="20" y="40" width="130" height="62" rx="8"/>
    <rect x="166" y="40" width="130" height="62" rx="8"/>
    <rect x="312" y="40" width="130" height="62" rx="8"/>
    <rect x="458" y="40" width="130" height="62" rx="8"/>
    <rect x="604" y="40" width="130" height="62" rx="8"/>
  </g>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="62" font-weight="bold">Plans</text><text x="85" y="78">Partner Dashboard</text><text x="85" y="93">up to 8 public</text>
    <text x="231" y="62" font-weight="bold">Plan page</text><text x="231" y="78">hosted by Shopify</text><text x="231" y="93">merchant approves</text>
    <text x="377" y="62" font-weight="bold">Subscription</text><text x="377" y="78">created by Shopify</text><text x="377" y="93">on the invoice</text>
    <text x="523" y="62" font-weight="bold">Welcome link</text><text x="523" y="78">?plan_handle=pro</text><text x="523" y="93">in App Home</text>
    <text x="669" y="62" font-weight="bold">Partner API</text><text x="669" y="78">activeSubscription</text><text x="669" y="93">gate access</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 71 H162"/><path d="M296 71 H308"/><path d="M442 71 H454"/><path d="M588 71 H600"/>
  </g>

  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="20" y="138" width="130" height="62" rx="8"/>
    <rect x="166" y="138" width="130" height="62" rx="8"/>
    <rect x="312" y="138" width="130" height="62" rx="8"/>
    <rect x="458" y="138" width="130" height="62" rx="8"/>
  </g>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="160" font-weight="bold">Dev Dashboard</text><text x="85" y="176">client credentials</text><text x="85" y="191">JWT, 60 minutes</text>
    <text x="231" y="160" font-weight="bold">POST event</text><text x="231" y="176">api.shopify.com</text><text x="231" y="191">/app/2026-10/events</text>
    <text x="377" y="160" font-weight="bold">202 Accepted</text><text x="377" y="176">idempotency_key</text><text x="377" y="191">dedupes retries</text>
    <text x="523" y="160" font-weight="bold">Meter</text><text x="523" y="176">usage charge</text><text x="523" y="191">errors in the logs</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 169 H162"/><path d="M296 169 H308"/><path d="M442 169 H454"/>
  </g>

  <g fill="#8a5a8f" stroke="#f2f5f8">
    <rect x="20" y="236" width="130" height="62" rx="8"/>
    <rect x="166" y="236" width="130" height="62" rx="8"/>
    <rect x="312" y="236" width="130" height="62" rx="8"/>
    <rect x="458" y="236" width="130" height="62" rx="8"/>
    <rect x="604" y="236" width="130" height="62" rx="8"/>
  </g>
  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="258" font-weight="bold">Create charge</text><text x="85" y="274">appSubscriptionCreate</text><text x="85" y="289">or one-time create</text>
    <text x="231" y="258" font-weight="bold">confirmationUrl</text><text x="231" y="274">app redirects the</text><text x="231" y="289">merchant (top level)</text>
    <text x="377" y="258" font-weight="bold">Approve</text><text x="377" y="274">merchant accepts</text><text x="377" y="289">or declines</text>
    <text x="523" y="258" font-weight="bold">returnUrl</text><text x="523" y="274">back in the app</text><text x="523" y="289">verify, never trust</text>
    <text x="669" y="258" font-weight="bold">Read state</text><text x="669" y="274">currentAppInstallation</text><text x="669" y="289">plus a webhook</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 267 H162"/><path d="M296 267 H308"/><path d="M442 267 H454"/><path d="M588 267 H600"/>
  </g>

  <rect x="20" y="320" width="714" height="62" rx="8" fill="#55616d" stroke="#f2f5f8"/>
  <g font-size="12" fill="#f2f5f8">
    <text x="34" y="342" font-weight="bold">Both methods share the same payout rules</text>
    <text x="34" y="360">0% revenue share on the first USD 1,000,000 of lifetime gross app revenue earned since 2025-01-01, 15% above it.</text>
    <text x="34" y="375">A 2.9% processing fee applies to all billing. Off-platform billing is not allowed for App Store apps.</text>
  </g>
</svg>
