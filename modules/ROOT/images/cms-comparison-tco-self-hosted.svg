<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tco-self-hosted-t tco-self-hosted-d">
<title id="tco-self-hosted-t">3-year total cost of ownership, self-hosted</title>
<desc id="tco-self-hosted-d">Total cost of ownership over three years, in euros, of the four scenarios for a self-hosted free-software CMS: labour (maintenance hours at the editorial hourly rate), paid extensions, hosting (mean of AWS, Azure and Google Cloud, converted at USD 1.1133 per EUR, the ECB reference rate of 2026-10-28) and their total. Labour is the largest component in every scenario. Hosted builders and SaaS CMSs replace the hosting and most of the maintenance with their plan price.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}</style>
<rect width="1200" height="500" fill="var(--bg)"/>
<text class="title" x="600" y="24" text-anchor="middle">3-year total cost of ownership, self-hosted</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Labour</text><rect class="m1" x="340" y="-4" width="8" height="8"/><text x="362" y="4">Paid extensions</text><path class="m2" d="M606 -5L611 4L601 4Z"/><text x="624" y="4">Hosting (mean of three providers)</text><path class="m3" d="M868 -5L873 0L868 5L863 0Z"/><text x="886" y="4">Total</text></g></g><line class="grid" x1="70" y1="388" x2="1176" y2="388"/><text class="muted" x="62" y="392" text-anchor="end">0</text><line class="grid" x1="70" y1="288" x2="1176" y2="288"/><text class="muted" x="62" y="292" text-anchor="end">20k</text><line class="grid" x1="70" y1="188" x2="1176" y2="188"/><text class="muted" x="62" y="192" text-anchor="end">40k</text><line class="grid" x1="70" y1="88" x2="1176" y2="88"/><text class="muted" x="62" y="92" text-anchor="end">60k</text><path class="axis" d="M70 88V388H1176"/><g><title>Labour: 4.3k</title><rect class="f0" x="129.25" y="366.4" width="38" height="21.6"/><text class="muted" x="148.25" y="362.4" text-anchor="middle" font-size="10">4.3k</text></g><g><title>Paid extensions: 150</title><rect class="f1" x="169.25" y="387.25" width="38" height="1"/><text class="muted" x="188.25" y="383.25" text-anchor="middle" font-size="10">150</text></g><g><title>Hosting (mean of three providers): 1.7k</title><rect class="f2" x="209.25" y="379.49" width="38" height="8.51"/><text class="muted" x="228.25" y="375.49" text-anchor="middle" font-size="10">1.7k</text></g><g><title>Total: 6.2k</title><rect class="f3" x="249.25" y="357.14" width="38" height="30.86"/><text class="muted" x="268.25" y="353.14" text-anchor="middle" font-size="10">6.2k</text></g><text x="208.25" y="406" text-anchor="middle"><tspan x="208.25" dy="0">Small brochure site</tspan></text><g><title>Labour: 8.6k</title><rect class="f0" x="405.75" y="344.8" width="38" height="43.2"/><text class="muted" x="424.75" y="340.8" text-anchor="middle" font-size="10">8.6k</text></g><g><title>Paid extensions: 300</title><rect class="f1" x="445.75" y="386.5" width="38" height="1.5"/><text class="muted" x="464.75" y="382.5" text-anchor="middle" font-size="10">300</text></g><g><title>Hosting (mean of three providers): 5.2k</title><rect class="f2" x="485.75" y="362.23" width="38" height="25.77"/><text class="muted" x="504.75" y="358.23" text-anchor="middle" font-size="10">5.2k</text></g><g><title>Total: 14.1k</title><rect class="f3" x="525.75" y="317.53" width="38" height="70.47"/><text class="muted" x="544.75" y="313.53" text-anchor="middle" font-size="10">14.1k</text></g><text x="484.75" y="406" text-anchor="middle"><tspan x="484.75" dy="0">Blog or publication</tspan></text><g><title>Labour: 21.6k</title><rect class="f0" x="682.25" y="280" width="38" height="108"/><text class="muted" x="701.25" y="276" text-anchor="middle" font-size="10">21.6k</text></g><g><title>Paid extensions: 1.5k</title><rect class="f1" x="722.25" y="380.5" width="38" height="7.5"/><text class="muted" x="741.25" y="376.5" text-anchor="middle" font-size="10">1.5k</text></g><g><title>Hosting (mean of three providers): 5.2k</title><rect class="f2" x="762.25" y="362.23" width="38" height="25.77"/><text class="muted" x="781.25" y="358.23" text-anchor="middle" font-size="10">5.2k</text></g><g><title>Total: 28.3k</title><rect class="f3" x="802.25" y="246.73" width="38" height="141.27"/><text class="muted" x="821.25" y="242.73" text-anchor="middle" font-size="10">28.3k</text></g><text x="761.25" y="406" text-anchor="middle"><tspan x="761.25" dy="0">Multilingual corporate site</tspan></text><g><title>Labour: 43.2k</title><rect class="f0" x="958.75" y="172" width="38" height="216"/><text class="muted" x="977.75" y="168" text-anchor="middle" font-size="10">43.2k</text></g><g><title>Paid extensions: 0</title><rect class="f1" x="998.75" y="388" width="38" height="1"/><text class="muted" x="1017.75" y="384" text-anchor="middle" font-size="10">0</text></g><g><title>Hosting (mean of three providers): 6.9k</title><rect class="f2" x="1038.75" y="353.72" width="38" height="34.28"/><text class="muted" x="1057.75" y="349.72" text-anchor="middle" font-size="10">6.9k</text></g><g><title>Total: 50.1k</title><rect class="f3" x="1078.75" y="137.72" width="38" height="250.28"/><text class="muted" x="1097.75" y="133.72" text-anchor="middle" font-size="10">50.1k</text></g><text x="1037.75" y="406" text-anchor="middle"><tspan x="1037.75" dy="0">Headless multi-channel</tspan></text><text class="axis-label" x="623" y="448" text-anchor="middle">Scenario</text><text class="axis-label" transform="translate(16 238) rotate(-90)" text-anchor="middle">Cost over 3 years (EUR, k = thousand)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="464" text-anchor="start"><tspan x="24" dy="0">Source: editorial assumptions in cost.csv, hosting from cloud/comparing-cloud-providers.adoc, USD 1.1133 per EUR, the ECB reference rate of 2026-10-28; retrieved 2026-10-29. Labour and extensions are</tspan><tspan x="24" dy="15">editorial assumptions, not measurements. Raw data: scripts/cms-comparison-charts/data/cost.csv. See the Bibliography for the sources.</tspan></text>
</svg>
