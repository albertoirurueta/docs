<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a connector line between shapes</text>
  <rect x="30" y="46" width="470" height="330" rx="10" fill="#F9FAFB" stroke="#6B7280"/>
  <rect x="60" y="76" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="115" y="99" font-size="13" fill="#1F2937" text-anchor="middle">Pick a book</text>
  <polygon points="115,150 185,190 115,230 45,190" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="115" y="194" font-size="13" fill="#1F2937" text-anchor="middle">Finished?</text>
  <rect x="300" y="170" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="355" y="194" font-size="13" fill="#1F2937" text-anchor="middle">Write review</text>
  <rect x="60" y="290" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="115" y="314" font-size="13" fill="#1F2937" text-anchor="middle">Keep reading</text>
  <rect x="300" y="290" width="110" height="40" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="355" y="314" font-size="13" fill="#1F2937" text-anchor="middle">Share a quote</text>
  <path d="M115,112 L115,148" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M185,190 L298,190" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M115,230 L115,288" stroke="#4B5563" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <path d="M355,210 L355,288" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M170,310 L298,310" stroke="#4B5563" stroke-width="2" fill="none" stroke-dasharray="2 4"/>
  <path d="M410,94 L440,94 L440,190 L412,190" stroke="#B45309" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M170,94 Q355,94 355,168" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="228" y="176" width="30" height="16" fill="#F9FAFB"/><text x="243" y="188" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Yes</text>
  <rect x="122" y="248" width="24" height="16" fill="#F9FAFB"/><text x="134" y="260" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">No</text>
    <circle cx="292" cy="168" r="11" fill="#4F46E5"/><text x="292" y="172" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="135" cy="136" r="11" fill="#4F46E5"/><text x="135" y="140" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="243" cy="162" r="11" fill="#B45309"/><text x="243" y="166" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="440" cy="140" r="11" fill="#4F46E5"/><text x="440" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="235" cy="325" r="11" fill="#4F46E5"/><text x="235" y="329" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="300" cy="96" r="11" fill="#4F46E5"/><text x="300" y="100" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="520" y="66" font-size="13" font-weight="bold" fill="#1F2937">Callouts</text>
  <circle cx="532" cy="88" r="11" fill="#4F46E5"/><text x="532" y="92" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="552" y="78" font-size="12" fill="#374151">Endpoint snapped to a shape</text>
  <text x="552" y="93" font-size="12" fill="#374151">border: moving the shape keeps</text>
  <text x="552" y="108" font-size="12" fill="#374151">the line attached</text>
  <circle cx="532" cy="140" r="11" fill="#4F46E5"/><text x="532" y="144" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="552" y="130" font-size="12" fill="#374151">Line ending: arrow, circle,</text>
  <text x="552" y="145" font-size="12" fill="#374151">bar or none, set per end; Swap</text>
  <text x="552" y="160" font-size="12" fill="#374151">line ends</text>
  <circle cx="532" cy="192" r="11" fill="#B45309"/><text x="532" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="552" y="182" font-size="12" fill="#374151">Label: double-click the</text>
  <text x="552" y="197" font-size="12" fill="#374151">connector and type, for</text>
  <text x="552" y="212" font-size="12" fill="#374151">example Yes or No</text>
  <circle cx="532" cy="244" r="11" fill="#4F46E5"/><text x="532" y="248" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="552" y="234" font-size="12" fill="#374151">Elbow connector: right angles</text>
  <text x="552" y="249" font-size="12" fill="#374151">for structured diagrams</text>
  <text x="552" y="264" font-size="12" fill="#374151">(Command + \)</text>
  <circle cx="532" cy="296" r="11" fill="#4F46E5"/><text x="532" y="300" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="552" y="286" font-size="12" fill="#374151">Style and weight: solid,</text>
  <text x="552" y="301" font-size="12" fill="#374151">dashed or dotted, plus</text>
  <text x="552" y="316" font-size="12" fill="#374151">thickness and colour</text>
  <circle cx="532" cy="348" r="11" fill="#4F46E5"/><text x="532" y="352" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="552" y="345" font-size="12" fill="#374151">Curved connector: for loose</text>
  <text x="552" y="360" font-size="12" fill="#374151">links between ideas</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
