<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Shapes in a linear layer</title>
<desc id="d">A batch matrix X of shape B by D is multiplied by a weight matrix W of shape D by K, a bias vector of length K is broadcast over the rows, and the result has shape B by K.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Shapes in a linear layer: Y = X W + b</text>
<rect x="40" y="70" width="110" height="150" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="95.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">X</text>
<text x="95.0" y="240" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">(B, D)</text>
<text x="180" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0F172A">@</text>
<rect x="205" y="70" width="80" height="150" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="245.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">W</text>
<text x="245.0" y="240" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">(D, K)</text>
<text x="315" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0F172A">+</text>
<rect x="340" y="70" width="80" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="340" y="116" width="80" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="340" y="162" width="80" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
<text x="380" y="95" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">b</text>
<text x="380" y="238" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">(K,) broadcast</text>
<text x="455" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0F172A">=</text>
<rect x="480" y="70" width="110" height="150" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="535.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">Y</text>
<text x="535.0" y="240" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">(B, K)</text>
<text x="360" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">B = batch size, D = input features, K = outputs. The inner dimension D must match.</text>
</svg>
