<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-lp-models" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The three ways a Unity licence is delivered</text>
<rect x="30" y="50" width="220" height="250" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="140" y="78" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Named user</text>
<text x="140" y="98" text-anchor="middle" font-size="12" fill="#374151">Seat-based</text>
<line x1="50" y1="110" x2="230" y2="110" stroke="#4B5563" stroke-width="1"/>
<text x="140" y="134" text-anchor="middle" font-size="12" fill="#1F2937">Sign in to the Hub or Editor</text>
<text x="140" y="160" text-anchor="middle" font-size="12" fill="#1F2937">with a Unity ID</text>
<text x="140" y="186" text-anchor="middle" font-size="12" fill="#1F2937">Needs an internet connection</text>
<text x="140" y="212" text-anchor="middle" font-size="12" fill="#1F2937">Grace period for short outages</text>
<text x="140" y="238" text-anchor="middle" font-size="12" fill="#1F2937">Sign out to move computers</text>
<rect x="270" y="50" width="220" height="250" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="380" y="78" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">Serial-based</text>
<text x="380" y="98" text-anchor="middle" font-size="12" fill="#374151">Node-locked</text>
<line x1="290" y1="110" x2="470" y2="110" stroke="#4B5563" stroke-width="1"/>
<text x="380" y="134" text-anchor="middle" font-size="12" fill="#1F2937">Key sent by Unity</text>
<text x="380" y="160" text-anchor="middle" font-size="12" fill="#1F2937">Activated in the Hub</text>
<text x="380" y="186" text-anchor="middle" font-size="12" fill="#1F2937">or from the command line</text>
<text x="380" y="212" text-anchor="middle" font-size="12" fill="#1F2937">Works offline once activated</text>
<text x="380" y="238" text-anchor="middle" font-size="12" fill="#1F2937">Return the key to move it</text>
<rect x="510" y="50" width="220" height="250" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="620" y="78" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">Floating</text>
<text x="620" y="98" text-anchor="middle" font-size="12" fill="#374151">Concurrency-based</text>
<line x1="530" y1="110" x2="710" y2="110" stroke="#4B5563" stroke-width="1"/>
<text x="620" y="134" text-anchor="middle" font-size="12" fill="#1F2937">On-premises licensing server</text>
<text x="620" y="160" text-anchor="middle" font-size="12" fill="#1F2937">Pool of concurrent licences</text>
<text x="620" y="186" text-anchor="middle" font-size="12" fill="#1F2937">Taken when an Editor starts</text>
<text x="620" y="212" text-anchor="middle" font-size="12" fill="#1F2937">Returned when the last Editor closes</text>
<text x="620" y="238" text-anchor="middle" font-size="12" fill="#1F2937">For large organisations</text>
</svg>
