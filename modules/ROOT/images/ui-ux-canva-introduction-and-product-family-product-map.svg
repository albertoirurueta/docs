<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Canva product family at a glance</text>
  <rect x="16" y="46" width="728" height="240" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="32" y="68" font-size="13" font-weight="bold" fill="#4F46E5">Visual Suite: one account, one editor, one brand kit</text>
  <g fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5">
    <rect x="32" y="84" width="160" height="46" rx="8"/><rect x="204" y="84" width="160" height="46" rx="8"/><rect x="376" y="84" width="160" height="46" rx="8"/><rect x="548" y="84" width="180" height="46" rx="8"/>
    <rect x="32" y="144" width="160" height="46" rx="8"/><rect x="204" y="144" width="160" height="46" rx="8"/><rect x="376" y="144" width="160" height="46" rx="8"/><rect x="548" y="144" width="180" height="46" rx="8"/>
    <rect x="32" y="204" width="160" height="46" rx="8"/><rect x="204" y="204" width="160" height="46" rx="8"/><rect x="376" y="204" width="160" height="46" rx="8"/><rect x="548" y="204" width="180" height="46" rx="8"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="112" y="104">Designs and social</text><text x="284" y="104">Presentations</text><text x="456" y="104">Docs</text><text x="638" y="104">Whiteboards</text>
    <text x="112" y="164">Video</text><text x="284" y="164">Websites</text><text x="456" y="164">Sheets</text><text x="638" y="164">Code</text>
    <text x="112" y="224">Forms</text><text x="284" y="224">Email</text><text x="456" y="224">Grow</text><text x="638" y="224">Print</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="112" y="120">posts, flyers, logos</text><text x="284" y="120">slides, Live, recording</text><text x="456" y="120">long-form pages</text><text x="638" y="120">brainstorm, plan</text>
    <text x="112" y="180">clips, captions, audio</text><text x="284" y="180">publish on a domain</text><text x="456" y="180">formulas, charts, data</text><text x="638" y="180">interactive pages, widgets</text>
    <text x="112" y="240">collect responses</text><text x="284" y="240">campaigns to send</text><text x="456" y="240">ads, launch, analytics</text><text x="638" y="240">flyers, cards, shop</text>
  </g>
  <text x="380" y="272" font-size="11" fill="#6B7280" text-anchor="middle">Every tile opens in the same editor family and draws on the same Projects, Brand and Uploads libraries.</text>
  <rect x="16" y="298" width="728" height="46" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="380" y="318" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Canva AI 2.0 and the Magic tools, built on the Canva Design Model</text>
  <text x="380" y="335" font-size="11" fill="#92400E" text-anchor="middle">A layer across every tile above: chat in the editor, layered and editable output</text>
  <text x="32" y="368" font-size="12" font-weight="bold" fill="#374151">Related products from the same company:</text>
  <g fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 3">
    <rect x="32" y="378" width="160" height="34" rx="8"/><rect x="204" y="378" width="160" height="34" rx="8"/><rect x="376" y="378" width="160" height="34" rx="8"/><rect x="548" y="378" width="180" height="34" rx="8"/>
  </g>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <text x="112" y="400">Affinity (desktop app)</text><text x="284" y="400">Leonardo.Ai (web)</text><text x="456" y="400">Flourish (data stories)</text><text x="638" y="400">MagicBrief (ad insights)</text>
  </g>
  <text x="380" y="428" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
