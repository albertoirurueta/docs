<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-textures-and-samplers-upload-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from a PNG file to a mipmapped texture</text>
<rect x="18" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="34" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="83.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Decode</text>
<rect x="48" y="90" width="54" height="54" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="75" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">PNG</text>
<text x="75.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">stbi_load gives</text>
<text x="75.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">RGBA8 rows</text>
<line x1="132" y1="135" x2="139" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-upload-storyboard)"/>
<rect x="140" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="156" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="156" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="205.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Create</text>
<rect x="162" y="100" width="70" height="30" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="197" y="120" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">name = 7</text>
<text x="197.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glGenTextures</text>
<text x="197.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glBindTexture</text>
<line x1="254" y1="135" x2="261" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-upload-storyboard)"/>
<rect x="262" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="278" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="278" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="327.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Allocate</text>
<rect x="282" y="92" width="70" height="52" rx="2" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="317" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">empty</text>
<text x="319.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glTexStorage2D</text>
<text x="319.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">9 levels, sRGB</text>
<line x1="376" y1="135" x2="383" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-upload-storyboard)"/>
<rect x="384" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="400" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="400" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="449.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Upload</text>
<rect x="404" y="92" width="70" height="52" rx="2" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="414" y="102" width="50" height="32" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="439" y="123" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">L0</text>
<text x="441.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glTexSubImage2D</text>
<text x="441.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">level 0</text>
<line x1="498" y1="135" x2="505" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-upload-storyboard)"/>
<rect x="506" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="522" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="522" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="571.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Mipmaps</text>
<rect x="528" y="94" width="44" height="44" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="576" y="104" width="24" height="24" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<rect x="602" y="112" width="12" height="12" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="563.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glGenerateMipmap</text>
<text x="563.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">levels 1 to 8</text>
<line x1="620" y1="135" x2="627" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-upload-storyboard)"/>
<rect x="628" y="50" width="114" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="644" cy="64" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="644" y="68.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="693.0" y="68" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Sample</text>
<rect x="650" y="92" width="70" height="52" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="685" y="123" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">book</text>
<text x="685.0" y="172" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">sampler object</text>
<text x="685.0" y="187" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">then draw</text>
<text x="380" y="252" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Steps 2 to 5 run once at load time; step 6 runs every frame.</text>
<text x="380" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">On a 4.1 context without glTexStorage2D, step 3 and 4 become glTexImage2D.</text>
</svg>
