<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Life of a deleted design</text>
  <rect x="30" y="70" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="105" y="96" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">In Projects</text><text x="105" y="114" font-size="12" fill="#374151" text-anchor="middle">design is live</text>
  <rect x="250" y="70" width="190" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="345" y="96" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">In Trash</text><text x="345" y="114" font-size="12" fill="#374151" text-anchor="middle">up to 30 days, restorable</text>
  <rect x="510" y="70" width="220" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="620" y="96" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Removed from Trash</text><text x="620" y="114" font-size="12" fill="#92400E" text-anchor="middle">14 days: ask Support</text>
  <path d="M181,100 L249,100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M441,100 L509,100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="215" y="90" font-size="11" fill="#374151" text-anchor="middle">Move to Trash</text>
  <text x="475" y="90" font-size="11" fill="#374151" text-anchor="middle">30 days or Empty</text>
  <path d="M345,131 L345,170 L105,170 L105,132" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="225" y="188" font-size="12" fill="#374151" text-anchor="middle">Restore: designs return to Projects</text>
  <rect x="510" y="200" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="620" y="222" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Permanently deleted</text><text x="620" y="240" font-size="12" fill="#374151" text-anchor="middle">after the grace period</text>
  <path d="M620,131 L620,199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="30" y="230" width="420" height="52" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="240" y="252" font-size="12" fill="#374151" text-anchor="middle">Images and videos: no restore once deleted from Trash;</text>
  <text x="240" y="270" font-size="12" fill="#374151" text-anchor="middle">they stay in any design that still uses them.</text>
  <circle cx="30" cy="318" r="0" fill="none"/>
  <text x="380" y="322" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
