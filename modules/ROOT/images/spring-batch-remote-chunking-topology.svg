<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <defs>
    <marker id="rcarrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7a4a12"/>
    </marker>
  </defs>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Remote chunking topology</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">the manager reads; workers process and write; a durable queue carries the chunks</text>

  <!-- manager -->
  <rect x="30" y="120" width="190" height="130" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="44" y="144" font-size="13" font-weight="bold" fill="#1c4b73">Manager JVM</text>
  <text x="44" y="166" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">ItemReader</text>
  <text x="44" y="182" font-size="10.5" fill="#666666">reads every item (single point</text>
  <text x="44" y="197" font-size="10.5" fill="#666666">of read: the reader is NOT</text>
  <text x="44" y="212" font-size="10.5" fill="#666666">parallelised)</text>
  <text x="44" y="234" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">ChunkMessageChannelItemWriter</text>

  <!-- queue -->
  <rect x="280" y="100" width="180" height="60" fill="#fdf6ec" stroke="#7a4a12" stroke-width="1.6"/>
  <text x="294" y="124" font-size="12.5" font-weight="bold" fill="#7a4a12">requests queue</text>
  <text x="294" y="142" font-size="10.5" fill="#666666">durable middleware (JMS, AMQP, Kafka)</text>

  <rect x="280" y="212" width="180" height="60" fill="#fdf6ec" stroke="#7a4a12" stroke-width="1.6"/>
  <text x="294" y="236" font-size="12.5" font-weight="bold" fill="#7a4a12">replies queue</text>
  <text x="294" y="254" font-size="10.5" fill="#666666">per-chunk results aggregated by the manager</text>

  <line x1="220" y1="150" x2="280" y2="130" stroke="#7a4a12" stroke-width="1.4" marker-end="url(#rcarrow)"/>
  <line x1="280" y1="242" x2="220" y2="220" stroke="#7a4a12" stroke-width="1.4" marker-end="url(#rcarrow)"/>

  <line x1="460" y1="128" x2="530" y2="106" stroke="#7a4a12" stroke-width="1.4" marker-end="url(#rcarrow)"/>
  <line x1="460" y1="132" x2="530" y2="206" stroke="#7a4a12" stroke-width="1.4" marker-end="url(#rcarrow)"/>
  <line x1="460" y1="136" x2="530" y2="306" stroke="#7a4a12" stroke-width="1.4" marker-end="url(#rcarrow)"/>

  <line x1="530" y1="140" x2="460" y2="232" stroke="#7a4a12" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#rcarrow)"/>

  <!-- workers -->
  <rect x="530" y="76" width="200" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="542" y="98" font-size="12.5" font-weight="bold" fill="#2f5424">Worker JVM 1</text>
  <text x="542" y="116" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">ItemProcessor + ItemWriter</text>
  <text x="542" y="133" font-size="10.5" fill="#666666">ChunkProcessorChunkHandler</text>

  <rect x="530" y="176" width="200" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="542" y="198" font-size="12.5" font-weight="bold" fill="#2f5424">Worker JVM 2</text>
  <text x="542" y="216" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">ItemProcessor + ItemWriter</text>
  <text x="542" y="233" font-size="10.5" fill="#666666">scales independently of the manager</text>

  <rect x="530" y="276" width="200" height="66" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="542" y="298" font-size="12.5" font-weight="bold" fill="#2f5424">Worker JVM 3</text>
  <text x="542" y="316" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">ItemProcessor + ItemWriter</text>
  <text x="542" y="333" font-size="10.5" fill="#666666">no JobRepository access needed</text>

  <text x="380" y="378" font-size="11" fill="#666666" text-anchor="middle">Use when processing or writing dominates the cost and the middleware is durable.</text>
  <text x="380" y="398" font-size="11" fill="#666666" text-anchor="middle">Ordering across chunks is not guaranteed; a lost message loses a chunk unless the queue is transactional.</text>
  <text x="380" y="418" font-size="11" fill="#666666" text-anchor="middle">Contrast with remote partitioning, where each worker reads its own slice.</text>
</svg>
