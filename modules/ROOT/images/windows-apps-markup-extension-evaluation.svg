<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How the XAML reader evaluates a markup extension</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Example attribute: Background="{local:BookStatus Reading}" on a Border in the Bookshelf Desktop book list</text>
  <rect x="20" y="70" width="150" height="90" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <text x="95" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. Parse</text>
  <text x="95" y="114" font-size="12" fill="#333333" text-anchor="middle">Value starts with {</text>
  <text x="95" y="130" font-size="12" fill="#333333" text-anchor="middle">and is not {}</text>
  <text x="95" y="146" font-size="12" fill="#333333" text-anchor="middle">name + argument list</text>
  <rect x="200" y="70" width="150" height="90" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <text x="275" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">2. Construct</text>
  <text x="275" y="114" font-size="12" fill="#333333" text-anchor="middle">BookStatusExtension</text>
  <text x="275" y="130" font-size="12" fill="#333333" text-anchor="middle">positional args go to</text>
  <text x="275" y="146" font-size="12" fill="#333333" text-anchor="middle">the constructor</text>
  <rect x="380" y="70" width="150" height="90" rx="10" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <text x="455" y="94" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">3. Set properties</text>
  <text x="455" y="114" font-size="12" fill="#333333" text-anchor="middle">Name=Value pairs go</text>
  <text x="455" y="130" font-size="12" fill="#333333" text-anchor="middle">to public settable</text>
  <text x="455" y="146" font-size="12" fill="#333333" text-anchor="middle">properties</text>
  <rect x="560" y="70" width="180" height="90" rx="10" fill="#eef7ee" stroke="#b9d8b9" stroke-width="1"/>
  <text x="650" y="94" font-size="14" font-weight="bold" fill="#2a6a2a" text-anchor="middle">4. ProvideValue</text>
  <text x="650" y="114" font-size="12" fill="#333333" text-anchor="middle">Called with an</text>
  <text x="650" y="130" font-size="12" fill="#333333" text-anchor="middle">IServiceProvider; the</text>
  <text x="650" y="146" font-size="12" fill="#333333" text-anchor="middle">result is the value</text>
  <line x1="170" y1="115" x2="198" y2="115" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="115" x2="378" y2="115" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="115" x2="558" y2="115" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="200" width="720" height="110" rx="10" fill="#fdf8ee" stroke="#e6d6b0" stroke-width="1"/>
  <text x="380" y="224" font-size="14" font-weight="bold" fill="#7a5a10" text-anchor="middle">What ProvideValue can ask the service provider</text>
  <text x="40" y="248" font-size="12" fill="#333333">IProvideValueTarget: the target object and target property, so the extension can adapt to the property type.</text>
  <text x="40" y="268" font-size="12" fill="#333333">IUriContext: the base URI of the XAML being read (used for relative resource paths).</text>
  <text x="40" y="288" font-size="12" fill="#333333">IXamlTypeResolver and similar services: resolve prefixed type names from the current xmlns mapping.</text>
  <line x1="650" y1="160" x2="650" y2="198" stroke="#555555" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
</svg>
