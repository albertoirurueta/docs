<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-hello-triangle-clip-space" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The three vertices in normalised device coordinates</text>
<rect x="60" y="50" width="240" height="240" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<line x1="180" y1="290" x2="180" y2="50" stroke="#4B5563" stroke-width="1"/>
<line x1="60" y1="170" x2="300" y2="170" stroke="#4B5563" stroke-width="1"/>
<polygon points="120,230 240,230 180,110" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="110" y="252" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(-0.5, -0.5)</text>
<text x="250" y="252" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(0.5, -0.5)</text>
<text x="180" y="100" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(0.0, 0.5)</text>
<text x="180" y="312" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">NDC square: x and y from -1 to +1</text>
<text x="20" y="170" font-size="10" font-weight="normal" fill="#374151" text-anchor="start">-1</text>
<text x="300" y="186" font-size="10" font-weight="normal" fill="#374151" text-anchor="end">+1</text>
<rect x="350" y="70" width="380" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="540.0" y="96.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Viewport 800 x 600 maps x to 0..800 and y to 0..600</text>
<text x="540.0" y="111.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">x_win = (x_ndc + 1) / 2 * 800</text>
<rect x="350" y="150" width="380" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="540.0" y="176.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">w is 1.0 for these vertices</text>
<text x="540.0" y="191.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">so clip space equals NDC (divide by 1)</text>
<rect x="350" y="230" width="380" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="540.0" y="256.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Triangle winding is counter-clockwise</text>
<text x="540.0" y="271.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">= front face (default frontFace is GL_CCW)</text>
</svg>
