<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-hpp-handles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Handle styles in Vulkan-Hpp compared</text>
<rect x="20" y="55" width="200" height="34" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="75.0" text-anchor="middle" font-size="12" fill="#3730A3">Style</text>
<rect x="230" y="55" width="160" height="34" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="310.0" y="75.0" text-anchor="middle" font-size="12" fill="#3730A3">Owns the object</text>
<rect x="400" y="55" width="130" height="34" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="75.0" text-anchor="middle" font-size="12" fill="#3730A3">Copyable</text>
<rect x="540" y="55" width="200" height="34" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="75.0" text-anchor="middle" font-size="12" fill="#3730A3">Dispatcher</text>
<rect x="20" y="97" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="120.0" y="121.0" text-anchor="middle" font-size="12" fill="#374151">vk::Buffer</text>
<rect x="230" y="97" width="160" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="310.0" y="121.0" text-anchor="middle" font-size="12" fill="#374151">no</text>
<rect x="400" y="97" width="130" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="465.0" y="121.0" text-anchor="middle" font-size="12" fill="#374151">yes</text>
<rect x="540" y="97" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="640.0" y="121.0" text-anchor="middle" font-size="12" fill="#374151">global default</text>
<rect x="20" y="147" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="120.0" y="171.0" text-anchor="middle" font-size="12" fill="#374151">vk::UniqueBuffer</text>
<rect x="230" y="147" width="160" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="310.0" y="171.0" text-anchor="middle" font-size="12" fill="#374151">yes, unique</text>
<rect x="400" y="147" width="130" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="465.0" y="171.0" text-anchor="middle" font-size="12" fill="#374151">no, move</text>
<rect x="540" y="147" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="640.0" y="171.0" text-anchor="middle" font-size="12" fill="#374151">global default</text>
<rect x="20" y="197" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="120.0" y="221.0" text-anchor="middle" font-size="12" fill="#374151">vk::SharedBuffer</text>
<rect x="230" y="197" width="160" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="310.0" y="221.0" text-anchor="middle" font-size="12" fill="#374151">yes, shared</text>
<rect x="400" y="197" width="130" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="465.0" y="221.0" text-anchor="middle" font-size="12" fill="#374151">yes, counted</text>
<rect x="540" y="197" width="200" height="42" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="640.0" y="221.0" text-anchor="middle" font-size="12" fill="#374151">global default</text>
<rect x="20" y="247" width="200" height="42" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="120.0" y="271.0" text-anchor="middle" font-size="12" fill="#065F46">vk::raii::Buffer</text>
<rect x="230" y="247" width="160" height="42" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="310.0" y="271.0" text-anchor="middle" font-size="12" fill="#065F46">yes, unique</text>
<rect x="400" y="247" width="130" height="42" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="465.0" y="271.0" text-anchor="middle" font-size="12" fill="#065F46">no, move</text>
<rect x="540" y="247" width="200" height="42" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="640.0" y="271.0" text-anchor="middle" font-size="12" fill="#065F46">own per object</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">RAII objects keep their own function pointers, so they cannot be mixed with the global-dispatcher handles.</text>
</svg>
