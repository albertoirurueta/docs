<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 216" width="800" height="216" role="img" aria-labelledby="single-vs-multi-purpose-t single-vs-multi-purpose-d">
<title id="single-vs-multi-purpose-t">General-purpose vs specific-purpose languages</title>
<desc id="single-vs-multi-purpose-d">Number of compared languages whose listed purposes (the purposes column of languages.csv, from the Wikipedia lead, retrieved 2026-10-26) include &quot;general-purpose&quot; together with other uses, only &quot;general-purpose&quot;, or only specific purposes. General-purpose, with other uses listed: C, C++, Go, Groovy, Java, Kotlin, Objective-C, PHP, Python, Ruby, Rust, Swift, Perl, Zig, Elixir. General-purpose only: C#, Scala, Julia, Haskell. Specific purposes only: COBOL, Fortran, JavaScript, MATLAB, R, TypeScript, Visual Basic, Pascal/Delphi, Ada, Lisp, Assembly, Dart, Lua, Mojo, SQL, Bash.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--axis:#9198a1;--s0:#56B4E9;--s1:#E69F00;--s2:#44C9A0;--s3:#E8A0CB;--s4:#F0E442;--s5:#7FB8F0;--s6:#D9C84A;--s7:#FFFFFF;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="216" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">General-purpose vs specific-purpose languages</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Languages</text></g></g><line class="grid" x1="244" y1="78" x2="244" y2="156"/><text class="muted" x="244" y="174" text-anchor="middle">0</text><line class="grid" x1="369" y1="78" x2="369" y2="156"/><text class="muted" x="369" y="174" text-anchor="middle">5</text><line class="grid" x1="494" y1="78" x2="494" y2="156"/><text class="muted" x="494" y="174" text-anchor="middle">10</text><line class="grid" x1="619" y1="78" x2="619" y2="156"/><text class="muted" x="619" y="174" text-anchor="middle">15</text><line class="grid" x1="744" y1="78" x2="744" y2="156"/><text class="muted" x="744" y="174" text-anchor="middle">20</text><path class="axis" d="M244 78V156H744"/><text x="236" y="95" text-anchor="end">General-purpose, with other uses listed</text><rect class="f0" x="244" y="82" width="375" height="18"/><text class="muted" x="624" y="95">15</text><text x="236" y="121" text-anchor="end">General-purpose only</text><rect class="f0" x="244" y="108" width="100" height="18"/><text class="muted" x="349" y="121">4</text><text x="236" y="147" text-anchor="end">Specific purposes only</text><rect class="f0" x="244" y="134" width="400" height="18"/><text class="muted" x="649" y="147">16</text><text class="axis-label" x="494" y="196" text-anchor="middle">Languages (count)</text><text class="axis-label" transform="translate(16 117) rotate(-90)" text-anchor="middle">Kind of purposes listed</text>
</svg>
