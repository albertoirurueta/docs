<svg viewBox="0 0 720 628" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Tornado release timeline from 5.0 to 7.0</title>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Tornado releases that changed how you write code</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">solid markers are released; dashed markers are upcoming or announced</text>
  <line x1="150" y1="68" x2="150" y2="574" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="78" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="79" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">5.0</text>
  <text x="132" y="93" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Mar 2018</text>
  <rect x="172" y="61" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="82" font-size="12" fill="currentColor">IOLoop wraps asyncio; asyncio Future replaces Tornado's</text>
  <circle cx="150" cy="132" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="133" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.0</text>
  <text x="132" y="147" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Mar 2019</text>
  <rect x="172" y="115" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="136" font-size="12" fill="currentColor">Python 2 dropped; callbacks, stack_context, @asynchronous, gen.engine removed</text>
  <circle cx="150" cy="186" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="187" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.1</text>
  <text x="132" y="201" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Oct 2020</text>
  <rect x="172" y="169" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="190" font-size="12" fill="currentColor">Last Python 3.5 release; proactor loop support on Windows</text>
  <circle cx="150" cy="240" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="241" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.2</text>
  <text x="132" y="255" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Jul 2022</text>
  <rect x="172" y="223" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="244" font-size="12" fill="currentColor">asyncio.run(main()) recommended; Python 3.7+</text>
  <circle cx="150" cy="294" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="295" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.3</text>
  <text x="132" y="309" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Apr 2023</text>
  <rect x="172" y="277" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="298" font-size="12" fill="currentColor">*_signed_cookie names; xsrf_cookie_name; WSGIContainer executor</text>
  <circle cx="150" cy="348" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="349" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.4</text>
  <text x="132" y="363" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Nov 2023</text>
  <rect x="172" y="331" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="352" font-size="12" fill="currentColor">add_callback_from_signal, TwitterMixin deprecated; Python 3.12</text>
  <circle cx="150" cy="402" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="403" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.5</text>
  <text x="132" y="417" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">May 2025</text>
  <rect x="172" y="385" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="406" font-size="12" fill="currentColor">Python 3.9+, 3.14; stricter header and Host parsing</text>
  <circle cx="150" cy="456" r="8" fill="#808080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="457" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.5.3 - 6.5.10</text>
  <text x="132" y="471" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">Dec 2025 - Sep 2026</text>
  <rect x="172" y="439" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="184" y="460" font-size="12" fill="currentColor">Security patches: body limits, symlinks, redirects, max_body_size</text>
  <circle cx="150" cy="510" r="8" fill="#808080" fill-opacity="0.1" stroke="currentColor" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="132" y="511" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">6.6</text>
  <text x="132" y="525" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">upcoming</text>
  <rect x="172" y="493" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.05" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="184" y="514" font-size="12" fill="currentColor">Python 3.11+; cross_origin_protection; zero timeouts mean now</text>
  <circle cx="150" cy="564" r="8" fill="#808080" fill-opacity="0.1" stroke="currentColor" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="132" y="565" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">7.0</text>
  <text x="132" y="579" font-size="11" fill="currentColor" text-anchor="end" opacity="0.8">announced</text>
  <rect x="172" y="547" width="520" height="34" rx="6" fill="#808080" fill-opacity="0.05" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="184" y="568" font-size="12" fill="currentColor">Removal of the APIs deprecated in 6.x</text>
</svg>
