<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of an XSSF pivot table</title>
  <desc id="d">The source range on the Loans sheet feeds a pivot cache. The pivot table on the Summary sheet maps source columns to row labels, column labels, a report filter and value fields. Excel fills the values when the file is opened.</desc>
  <style>
    .t { fill: #1f1f1f; }
    .m { fill: #555555; }
    .box { fill: #888888; fill-opacity: 0.12; stroke: #777777; stroke-width: 1.4; }
    .hd { fill: #888888; fill-opacity: 0.30; stroke: #777777; stroke-width: 1.4; }
    .acc { fill: #2d7fd3; fill-opacity: 0.18; stroke: #2d7fd3; stroke-width: 1.8; }
    .ln { stroke: #777777; stroke-width: 1.6; fill: none; }
    .al { stroke: #2d7fd3; stroke-width: 1.8; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececec; }
      .m { fill: #b5b5b5; }
      .box { stroke: #aaaaaa; }
      .hd { stroke: #aaaaaa; }
      .acc { fill: #6aaeea; fill-opacity: 0.22; stroke: #6aaeea; }
      .ln { stroke: #aaaaaa; }
      .al { stroke: #6aaeea; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d7fd3"/>
    </marker>
  </defs>

  <text x="20" y="28" class="t" font-size="16" font-weight="bold">Source range (sheet Loans, A1:E7)</text>
  <rect x="20" y="42" width="290" height="30" class="hd"/>
  <text x="30" y="62" class="t" font-size="13">0 Genre</text>
  <text x="95" y="62" class="t" font-size="13">1 Branch</text>
  <text x="165" y="62" class="t" font-size="13">2 Month</text>
  <text x="235" y="62" class="t" font-size="13">3 Days</text>
  <text x="275" y="62" class="t" font-size="13"> 4 Fee</text>
  <rect x="20" y="72" width="290" height="150" class="box"/>
  <text x="30" y="96" class="m" font-size="13">Programming  Central  2026-01  14  0.0</text>
  <text x="30" y="120" class="m" font-size="13">Programming  North   2026-01  21  1.5</text>
  <text x="30" y="144" class="m" font-size="13">Architecture Central 2026-02  14  0.0</text>
  <text x="30" y="168" class="m" font-size="13">Databases    North   2026-02  28  3.0</text>
  <text x="30" y="192" class="m" font-size="13">...</text>

  <rect x="20" y="262" width="290" height="70" class="acc"/>
  <text x="30" y="286" class="t" font-size="14" font-weight="bold">Pivot cache definition</text>
  <text x="30" y="306" class="m" font-size="12">worksheetSource sheet="Loans" ref="A1:E7"</text>
  <text x="30" y="324" class="m" font-size="12">refreshOnLoad="true"  (no values written)</text>
  <path d="M165,222 L165,258" class="ln" marker-end="url(#ah)"/>

  <text x="380" y="28" class="t" font-size="16" font-weight="bold">Pivot table (sheet Summary, from A4)</text>
  <rect x="380" y="42" width="500" height="26" class="hd"/>
  <text x="392" y="60" class="t" font-size="13">Report filter: Branch (All)</text>
  <rect x="380" y="68" width="500" height="26" class="box"/>
  <text x="392" y="86" class="m" font-size="13">Column labels: Month  /  Values</text>
  <rect x="380" y="94" width="500" height="120" class="box"/>
  <text x="392" y="116" class="t" font-size="13" font-weight="bold">Row labels: Genre</text>
  <text x="392" y="142" class="m" font-size="13">Programming</text>
  <text x="392" y="164" class="m" font-size="13">Architecture</text>
  <text x="392" y="186" class="m" font-size="13">Databases</text>
  <text x="560" y="142" class="m" font-size="13">Loans, Fees collected per month</text>
  <text x="560" y="164" class="m" font-size="13">(calculated by Excel on open)</text>

  <rect x="380" y="262" width="500" height="150" class="box"/>
  <text x="392" y="286" class="t" font-size="14" font-weight="bold">What the Java code declares</text>
  <text x="392" y="312" class="m" font-size="13">addRowLabel(0)</text>
  <text x="392" y="334" class="m" font-size="13">addColLabel(2)</text>
  <text x="392" y="356" class="m" font-size="13">addReportFilter(1)</text>
  <text x="392" y="378" class="m" font-size="13">addColumnLabel(COUNT, 3, "Loans")</text>
  <text x="392" y="400" class="m" font-size="13">addColumnLabel(SUM, 4, "Fees collected", "#,##0.00")</text>

  <path d="M310,297 L376,297" class="al" marker-end="url(#aa)"/>
  <text x="318" y="288" class="m" font-size="12">feeds</text>
  <path d="M630,262 L630,218" class="al" marker-end="url(#aa)"/>
</svg>
