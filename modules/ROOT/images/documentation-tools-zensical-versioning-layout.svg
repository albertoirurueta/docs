<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Versioned site on a Git branch: each version in its own folder, aliases pointing to a version, a versions list read by the selector</title>
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#eef2f7"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1e293b">Publishing branch (for example gh-pages)</text>
  <rect x="20" y="42" width="330" height="236" rx="8" fill="#ffffff" stroke="#64748b"/>
  <rect x="35" y="56" width="300" height="34" rx="6" fill="#fde68a" stroke="#92400e"/>
  <text x="185" y="78" font-size="13" text-anchor="middle" fill="#0f172a">index.html (redirect to the default alias)</text>
  <rect x="35" y="102" width="300" height="34" rx="6" fill="#bfdbfe" stroke="#1e3a8a"/>
  <text x="185" y="124" font-size="13" text-anchor="middle" fill="#0f172a">0.1/  (built once, never touched again)</text>
  <rect x="35" y="148" width="300" height="34" rx="6" fill="#bfdbfe" stroke="#1e3a8a"/>
  <text x="185" y="170" font-size="13" text-anchor="middle" fill="#0f172a">0.2/  (current release)</text>
  <rect x="35" y="194" width="300" height="34" rx="6" fill="#bbf7d0" stroke="#166534"/>
  <text x="185" y="216" font-size="13" text-anchor="middle" fill="#0f172a">latest  (alias, points to 0.2)</text>
  <rect x="35" y="240" width="300" height="30" rx="6" fill="#e9d5ff" stroke="#6b21a8"/>
  <text x="185" y="260" font-size="13" text-anchor="middle" fill="#0f172a">versions.json (versions, titles, aliases)</text>
  <path d="M335 211 L400 211 L400 165 L338 165" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="90" width="260" height="70" rx="8" fill="#fde68a" stroke="#92400e"/>
  <text x="570" y="118" font-size="13" text-anchor="middle" fill="#0f172a">Reader opens a page</text>
  <text x="570" y="138" font-size="11" text-anchor="middle" fill="#0f172a">the theme script fetches versions.json</text>
  <rect x="440" y="190" width="260" height="70" rx="8" fill="#e9d5ff" stroke="#6b21a8"/>
  <text x="570" y="218" font-size="13" text-anchor="middle" fill="#0f172a">Version selector in the header</text>
  <text x="570" y="238" font-size="11" text-anchor="middle" fill="#0f172a">0.2 (latest), 0.1</text>
  <path d="M335 259 L400 259 L400 280 L570 280 L570 262" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M570 160 L570 188" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
