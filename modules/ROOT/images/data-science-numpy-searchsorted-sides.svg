<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
  <title id="t">searchsorted insertion points for a repeated value</title>
  <desc id="d">The sorted array 10, 20, 20, 30 with insertion indices 0 to 4 between and around the boxes. For the value 20, side left returns index 1 and side right returns index 3.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="268" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">np.searchsorted(a, 20) on a sorted array</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#0F172A" stroke-width="2">
    <rect x="110" y="110" width="100" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="160" y="141">10</text>
    <rect x="230" y="110" width="100" height="50" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="280" y="141">20</text>
    <rect x="350" y="110" width="100" height="50" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="400" y="141">20</text>
    <rect x="470" y="110" width="100" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="520" y="141">30</text>
  </g>
  <g stroke="#94A3B8" stroke-width="1.5">
    <line x1="100" y1="170" x2="100" y2="186"/><line x1="220" y1="170" x2="220" y2="186"/><line x1="340" y1="170" x2="340" y2="186"/><line x1="460" y1="170" x2="460" y2="186"/><line x1="580" y1="170" x2="580" y2="186"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#475569">
    <text x="100" y="206">0</text><text x="220" y="206">1</text><text x="340" y="206">2</text><text x="460" y="206">3</text><text x="580" y="206">4</text>
  </g>
  <text x="360" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">insertion index = number of elements placed before the new value</text>
  <path d="M250 96 L226 62" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M430 96 L454 62" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">
    <circle cx="150" cy="70" r="11" fill="#0F172A"/><text x="150" y="75" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="168" y="75" font-family="Menlo, Consolas, monospace">left: 1</text>
    <circle cx="520" cy="70" r="11" fill="#0F172A"/><text x="520" y="75" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="538" y="75" font-family="Menlo, Consolas, monospace">right: 3</text>
  </g>
</svg>
