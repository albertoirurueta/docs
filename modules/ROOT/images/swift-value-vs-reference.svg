<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Assigning a struct copies its value into a second independent variable; assigning a class instance shares one reference between two variables. Copy-on-write defers a struct's actual copy until the moment either variable is mutated.</title>
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>

  <text x="430" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Value Types vs. Reference Types, and Copy-on-Write</text>

  <defs>
    <marker id="vrArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Row 1: struct value semantics -->
  <text x="30" y="62" font-size="13" font-weight="bold" fill="#1d5236">1. Structs (and enums): value semantics</text>
  <text x="30" y="80" font-size="11" fill="#555555">var a = Size(width: 10); var b = a</text>

  <rect x="60" y="96" width="150" height="64" rx="8" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="135" y="118" font-size="12.5" font-weight="bold" fill="#1d5236" text-anchor="middle">a</text>
  <text x="135" y="138" font-size="11" fill="#1d5236" text-anchor="middle">Size(width: 10)</text>

  <rect x="330" y="96" width="150" height="64" rx="8" fill="#eefaf2" stroke="#2f7d51" stroke-width="1.6"/>
  <text x="405" y="118" font-size="12.5" font-weight="bold" fill="#1d5236" text-anchor="middle">b</text>
  <text x="405" y="138" font-size="11" fill="#1d5236" text-anchor="middle">Size(width: 10)</text>
  <text x="405" y="153" font-size="10" fill="#3a7a58" text-anchor="middle">an independent copy</text>

  <line x1="210" y1="128" x2="325" y2="128" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#vrArrow)"/>
  <text x="267" y="118" font-size="10" fill="#666666" text-anchor="middle">b = a</text>

  <text x="620" y="112" font-size="11" fill="#555555">b.width = 20  // only b changes</text>
  <text x="620" y="130" font-size="11" fill="#555555">a.width is still 10</text>

  <!-- Row 2: class reference semantics -->
  <text x="30" y="212" font-size="13" font-weight="bold" fill="#1f3b5c">2. Classes: reference semantics</text>
  <text x="30" y="230" font-size="11" fill="#555555">let c = Box(width: 10); let d = c</text>

  <rect x="60" y="246" width="130" height="56" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="125" y="278" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">c</text>

  <rect x="330" y="246" width="130" height="56" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.6"/>
  <text x="395" y="278" font-size="12.5" font-weight="bold" fill="#1f3b5c" text-anchor="middle">d</text>

  <line x1="190" y1="274" x2="325" y2="274" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#vrArrow)"/>
  <text x="257" y="264" font-size="10" fill="#666666" text-anchor="middle">d = c</text>

  <!-- shared heap box -->
  <rect x="230" y="320" width="150" height="70" rx="8" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.6"/>
  <text x="305" y="345" font-size="12.5" font-weight="bold" fill="#3c2a5c" text-anchor="middle">Box instance</text>
  <text x="305" y="364" font-size="11" fill="#3c2a5c" text-anchor="middle">width: 10 -&gt; 20</text>
  <text x="305" y="380" font-size="10" fill="#5c4a78" text-anchor="middle">one shared object on the heap</text>

  <line x1="125" y1="302" x2="270" y2="322" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#vrArrow)"/>
  <line x1="395" y1="302" x2="340" y2="322" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#vrArrow)"/>

  <text x="620" y="262" font-size="11" fill="#555555">d.width = 20  // c and d both</text>
  <text x="620" y="280" font-size="11" fill="#555555">see the same instance change</text>

  <!-- Row 3: copy-on-write -->
  <text x="30" y="432" font-size="13" font-weight="bold" fill="#7a5b1d">3. Copy-on-write: a struct wrapping a reference type</text>
  <text x="30" y="450" font-size="11" fill="#555555">var x = Buffer(); var y = x   // still share storage, until a mutation</text>

  <rect x="60" y="466" width="120" height="40" rx="8" fill="#fdf7e8" stroke="#a9821f" stroke-width="1.6"/>
  <text x="120" y="491" font-size="12" font-weight="bold" fill="#5c4713" text-anchor="middle">x</text>
  <rect x="220" y="466" width="120" height="40" rx="8" fill="#fdf7e8" stroke="#a9821f" stroke-width="1.6"/>
  <text x="280" y="491" font-size="12" font-weight="bold" fill="#5c4713" text-anchor="middle">y</text>
  <line x1="180" y1="486" x2="220" y2="486" stroke="#a9821f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="200" y="475" font-size="9" fill="#7a5b1d" text-anchor="middle">shared storage</text>

  <text x="500" y="480" font-size="11" fill="#555555">y.append(1) -&gt; isKnownUniquelyReferenced(&amp;storage)</text>
  <text x="500" y="498" font-size="11" fill="#555555">is false, so y copies storage first, then mutates its own copy</text>
</svg>
