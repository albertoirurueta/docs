<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to get a shader into the driver</text>
<text x="20" y="60" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">GLSL text path (all GL and ES versions)</text>
<rect x="20" y="72" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="93.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book.vert</text>
<text x="95.0" y="109.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">GLSL source</text>
<line x1="170" y1="97" x2="205" y2="97" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="205" y="72" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="93.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glShaderSource</text>
<text x="280.0" y="109.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glCompileShader</text>
<line x1="355" y1="97" x2="390" y2="97" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="390" y="72" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="93.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">shader object</text>
<text x="465.0" y="109.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">compiled by the driver</text>
<line x1="540" y1="97" x2="575" y2="97" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="575" y="72" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="93.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">glLinkProgram</text>
<text x="650.0" y="109.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">program</text>
<text x="20" y="162" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">SPIR-V path (OpenGL 4.6 or GL_ARB_gl_spirv, not in ES)</text>
<rect x="20" y="174" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="95.0" y="195.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">book.vert</text>
<text x="95.0" y="211.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">GLSL, glslang -G</text>
<line x1="170" y1="199" x2="205" y2="199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="205" y="174" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="280.0" y="195.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">book.vert.spv</text>
<text x="280.0" y="211.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">offline, in the build</text>
<line x1="355" y1="199" x2="390" y2="199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="390" y="174" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="195.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">glShaderBinary</text>
<text x="465.0" y="211.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">SPIR-V format token</text>
<line x1="540" y1="199" x2="575" y2="199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="575" y="174" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="195.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">glSpecializeShader</text>
<text x="650.0" y="211.0" font-size="10" font-weight="normal" fill="#065F46" text-anchor="middle">entry point + constants</text>
<line x1="657" y1="224" x2="657" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-sp)"/>
<rect x="560" y="262" width="180" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650.0" y="284.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glLinkProgram (same as text path)</text>
<text x="20" y="284" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Both paths end in the same program object.</text>
<text x="20" y="302" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">SPIR-V needs explicit locations and bindings; see the text for the restrictions.</text>
</svg>
