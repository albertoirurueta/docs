<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Getting tables_sqlServer.sql into a SQL Server database: three routes, one required edit, one required delegate</text>
  <defs>
    <marker id="ss-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- source script -->
  <rect x="14" y="70" width="240" height="330" rx="8" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.5"/>
  <text x="134" y="94" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">tables_sqlServer.sql</text>
  <text x="134" y="111" font-size="10.5" fill="#444444" text-anchor="middle">inside quartz-2.5.2.jar</text>
  <text x="28" y="144" font-size="11" fill="#222222">USE [enter_db_name_here]</text>
  <text x="28" y="161" font-size="10.5" fill="#444444">a placeholder: no such database</text>
  <text x="28" y="192" font-size="11" fill="#222222">GO   (47 lines)</text>
  <text x="28" y="209" font-size="10.5" fill="#444444">a client-tool batch separator,</text>
  <text x="28" y="223" font-size="10.5" fill="#444444">not a T-SQL statement</text>
  <text x="28" y="254" font-size="11" fill="#222222">IF EXISTS ... DROP TABLE</text>
  <text x="28" y="271" font-size="10.5" fill="#444444">drops every QRTZ table first</text>
  <text x="28" y="302" font-size="11" fill="#222222">CREATE TABLE [dbo].[QRTZ_...]</text>
  <text x="28" y="319" font-size="10.5" fill="#444444">11 tables, NVARCHAR names,</text>
  <text x="28" y="333" font-size="10.5" fill="#444444">VARBINARY(max) for the data,</text>
  <text x="28" y="347" font-size="10.5" fill="#444444">no semicolons outside comments</text>
  <text x="28" y="378" font-size="10.5" fill="#444444">no INSERT: lock rows are created</text>
  <text x="28" y="391" font-size="10.5" fill="#444444">by Quartz on first use</text>

  <!-- routes -->
  <rect x="300" y="60" width="330" height="96" rx="7" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="465" y="82" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Route 1: Flyway (production)</text>
  <text x="465" y="102" font-size="10.5" fill="#444444" text-anchor="middle">delete the USE line, keep every GO</text>
  <text x="465" y="117" font-size="10.5" fill="#444444" text-anchor="middle">db/migration/V1__quartz_tables.sql</text>
  <text x="465" y="136" font-size="10.5" fill="#1c4b73" text-anchor="middle">measured: Flyway 12.4.0 splits on GO itself</text>

  <rect x="300" y="174" width="330" height="116" rx="7" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="465" y="196" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Route 2: Liquibase (production)</text>
  <text x="465" y="216" font-size="10.5" fill="#444444" text-anchor="middle">delete the USE line, sqlFile with the GO lines kept</text>
  <text x="465" y="231" font-size="10.5" fill="#444444" text-anchor="middle">or the jar's own liquibase.quartz.init.xml</text>
  <text x="465" y="250" font-size="10.5" fill="#1c4b73" text-anchor="middle">measured: Liquibase 5.0.3 accepts both;</text>
  <text x="465" y="264" font-size="10.5" fill="#1c4b73" text-anchor="middle">the bundled file creates VARCHAR and BIT columns</text>

  <rect x="300" y="308" width="330" height="116" rx="7" fill="#f3f3f3" stroke="#777777" stroke-width="1.4"/>
  <text x="465" y="330" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Route 3: Boot's initializer (dev and test only)</text>
  <text x="465" y="350" font-size="10.5" fill="#444444" text-anchor="middle">sed: delete the USE line, turn every GO into ";"</text>
  <text x="465" y="365" font-size="10.5" fill="#444444" text-anchor="middle">spring.quartz.jdbc.schema + initialize-schema=always</text>
  <text x="465" y="384" font-size="10.5" fill="#1c4b73" text-anchor="middle">measured: works; but the script drops the tables</text>
  <text x="465" y="398" font-size="10.5" fill="#1c4b73" text-anchor="middle">on every start, so stored jobs are lost</text>

  <line x1="254" y1="108" x2="298" y2="108" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#ss-arrow)"/>
  <line x1="254" y1="232" x2="298" y2="232" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#ss-arrow)"/>
  <line x1="254" y1="366" x2="298" y2="366" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#ss-arrow)"/>

  <!-- database -->
  <rect x="690" y="130" width="250" height="150" rx="8" fill="#eaf4ea" stroke="#2f7a3a" stroke-width="1.5"/>
  <text x="815" y="156" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">SQL Server database</text>
  <text x="815" y="176" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_JOB_DETAILS, QRTZ_TRIGGERS,</text>
  <text x="815" y="191" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_CRON_TRIGGERS, QRTZ_LOCKS,</text>
  <text x="815" y="206" font-size="10.5" fill="#444444" text-anchor="middle">QRTZ_SCHEDULER_STATE, ... (11)</text>
  <text x="815" y="232" font-size="10.5" fill="#444444" text-anchor="middle">the database is chosen by the JDBC URL</text>
  <text x="815" y="247" font-size="10.5" fill="#444444" text-anchor="middle">(databaseName=...), not by a USE line</text>
  <line x1="630" y1="108" x2="688" y2="190" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ss-arrow)"/>
  <line x1="630" y1="232" x2="688" y2="215" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ss-arrow)"/>
  <line x1="630" y1="366" x2="688" y2="250" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#ss-arrow)"/>

  <!-- delegate -->
  <rect x="690" y="318" width="250" height="106" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  <text x="815" y="342" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">driverDelegateClass = MSSQLDelegate</text>
  <text x="815" y="362" font-size="10.5" fill="#444444" text-anchor="middle">on all three routes. Without it the lock</text>
  <text x="815" y="377" font-size="10.5" fill="#444444" text-anchor="middle">statement ends in FOR UPDATE and SQL Server</text>
  <text x="815" y="392" font-size="10.5" fill="#444444" text-anchor="middle">rejects it: the scheduler cannot start</text>
  <line x1="815" y1="318" x2="815" y2="282" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ss-arrow)"/>
</svg>
