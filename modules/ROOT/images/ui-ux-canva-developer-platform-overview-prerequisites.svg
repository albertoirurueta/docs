<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What each surface needs before you start</text>
  <rect x="30" y="46" width="700" height="34" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text y="68" text-anchor="start" x="44">Requirement</text><text x="400" y="68">Apps inside Canva</text><text x="540" y="68">Your platform</text><text x="670" y="68">AI assistants</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1" fill="none">
    <rect x="30" y="80" width="700" height="38"/><rect x="30" y="118" width="700" height="38"/><rect x="30" y="156" width="700" height="38"/><rect x="30" y="194" width="700" height="38"/><rect x="30" y="232" width="700" height="38"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="44" y="103">Canva account</text><text x="44" y="141">Node.js v24 with npm v11</text><text x="44" y="179">git</text><text x="44" y="217">Multi-factor authentication on the account</text><text x="44" y="255">MCP-capable AI tool</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#4F46E5">
    <text x="400" y="103">free account</text><text x="540" y="103">yes</text><text x="670" y="103" fill="#92400E">any plan</text>
    <text x="400" y="141">yes</text><text x="540" y="141">yes</text><text x="670" y="141" fill="#6B7280">not required</text>
    <text x="400" y="179">yes</text><text x="540" y="179">yes</text><text x="670" y="179" fill="#6B7280">not required</text>
    <text x="400" y="217" fill="#6B7280">not required</text><text x="540" y="217" fill="#92400E">required</text><text x="670" y="217" fill="#6B7280">not required</text>
    <text x="400" y="255" fill="#6B7280">not required</text><text x="540" y="255" fill="#6B7280">not required</text><text x="670" y="255">yes</text>
  </g>
  <text x="44" y="296" font-size="12" fill="#374151">Apps inside Canva also assumes a supported browser, a terminal, and working knowledge of React</text>
  <text x="44" y="312" font-size="12" fill="#374151">(required for the App UI Kit) and, optionally, TypeScript.</text>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic summary of the Prerequisites page, not a screenshot of any product.</text>
</svg>
