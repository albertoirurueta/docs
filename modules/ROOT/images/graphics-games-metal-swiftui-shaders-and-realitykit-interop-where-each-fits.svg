<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-swiftui-shaders-and-realitykit-interop-where-each-fits" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Three ways to use Metal from the Apple UI stacks</text>
<rect x="20" y="55" width="230" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="79.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">SwiftUI shader effects</text>
<rect x="20" y="100" width="230" height="120" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="135.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colorEffect, distortionEffect,</text>
<text x="135.0" y="149.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">layerEffect</text>
<text x="135.0" y="163.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="135.0" y="177.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">a stitchable function runs</text>
<text x="135.0" y="191.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">once per pixel of a view</text>
<rect x="20" y="228" width="230" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="247.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you write: MSL only</text>
<rect x="265" y="55" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="79.5" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">RealityKit low-level</text>
<rect x="265" y="100" width="230" height="120" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="135.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">LowLevelMesh,</text>
<text x="380.0" y="149.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">LowLevelTexture</text>
<text x="380.0" y="163.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="380.0" y="177.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you fill buffers and textures,</text>
<text x="380.0" y="191.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">RealityKit draws them</text>
<rect x="265" y="228" width="230" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="247.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you write: MSL and some Metal</text>
<rect x="510" y="55" width="230" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="625.0" y="79.5" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">MTKView or CompositorLayer</text>
<rect x="510" y="100" width="230" height="120" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="142.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">your own renderer</text>
<text x="625.0" y="156.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="625.0" y="170.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you encode every pass</text>
<text x="625.0" y="184.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">yourself</text>
<rect x="510" y="228" width="230" height="32" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="247.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">you write: the whole renderer</text>
<rect x="20" y="285" width="720" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="310.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">All three sit on the same GPU and the same Metal device; the choice is about how much of the frame you want to own.</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Start with the leftmost column that does the job: shader effects, then RealityKit interop, then a custom renderer.</text>
</svg>
