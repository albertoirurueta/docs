<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Two-block PLS</title>
<desc id="d">Two blocks of variables X and Y are each projected onto latent score vectors, chosen so that the scores of the two blocks have maximal covariance; PLSRegression predicts Y from the X scores while PLSCanonical, CCA and PLSSVD treat the blocks symmetrically.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Two blocks of variables projected onto latent scores</text>

<rect x="40" y="70" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="115.0" y="96.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">X</text><text x="115.0" y="114.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">n_samples x n_features</text>
<rect x="530" y="70" width="150" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="605.0" y="96.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">Y</text><text x="605.0" y="114.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">n_samples x n_targets</text>
<rect x="40" y="190" width="150" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="115.0" y="211.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">T = X x_rotations_</text><text x="115.0" y="229.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">x scores</text>
<rect x="530" y="190" width="150" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="605.0" y="211.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">U = Y y_rotations_</text><text x="605.0" y="229.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">y scores</text>
<line x1="115" y1="130" x2="115" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="605" y1="130" x2="605" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="190" y1="215" x2="528" y2="215" stroke="#BE123C" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="360" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#BE123C">maximise cov(T, U)</text>
<text x="360" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">then deflate X and Y and repeat</text>
<text x="360" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PLSRegression: predict Y from T. PLSCanonical, CCA and PLSSVD: symmetric treatment of the two blocks.</text>
<text x="360" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PLSSVD: one SVD of X^T Y, no deflation.</text>
</svg>