<title id="monitoring-alerting-grafana-guide-g16-09-message-and-save-title">New alert rule form, section 6 Configure notification message: the Summary field holds a template that prints the 5xx ratio (callout 20), the Runbook URL field holds a URL (callout 21), the Link dashboard and panel button is marked by callout 22 and the Save button at the bottom by callout 23</title>
