<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-tex-slots" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Which colorSpace each texture slot expects</text>
<rect x="20" y="48" width="226" height="370" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="20" y="48" width="226" height="56" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="133" y="70" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Colour data</text>
<text x="133" y="90" font-size="12" font-weight="normal" fill="#4F46E5" text-anchor="middle">SRGBColorSpace</text>
<rect x="36" y="116" width="194" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="133" y="132" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">map</text>
<rect x="36" y="146" width="194" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="133" y="162" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">emissiveMap</text>
<rect x="36" y="176" width="194" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="133" y="192" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">specularColorMap</text>
<rect x="36" y="206" width="194" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="133" y="222" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">sheenColorMap</text>
<rect x="263" y="48" width="226" height="370" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<rect x="263" y="48" width="226" height="56" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="376" y="70" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Non-colour data</text>
<text x="376" y="90" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">NoColorSpace (the default)</text>
<rect x="279" y="116" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="132" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">normalMap</text>
<rect x="279" y="146" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="162" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">roughnessMap</text>
<rect x="279" y="176" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="192" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">metalnessMap</text>
<rect x="279" y="206" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="222" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">aoMap</text>
<rect x="279" y="236" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="252" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">bumpMap</text>
<rect x="279" y="266" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="282" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">displacementMap</text>
<rect x="279" y="296" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="312" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">alphaMap</text>
<rect x="279" y="326" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="342" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">clearcoatMap</text>
<rect x="279" y="356" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="372" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">transmissionMap</text>
<rect x="279" y="386" width="194" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="376" y="402" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">thicknessMap</text>
<rect x="506" y="48" width="226" height="370" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
<rect x="506" y="48" width="226" height="56" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="619" y="70" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Linear radiance</text>
<text x="619" y="90" font-size="12" font-weight="normal" fill="#047857" text-anchor="middle">LinearSRGBColorSpace</text>
<rect x="522" y="116" width="194" height="24" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="619" y="132" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">envMap (HDR file)</text>
<rect x="522" y="146" width="194" height="24" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="619" y="162" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">lightMap (baked light)</text>
<text x="606" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">HDR files hold float radiance,</text>
<text x="606" y="205" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">so they stay linear.</text>
<text x="606" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">An LDR sky image used as</text>
<text x="606" y="235" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scene.background is colour data:</text>
<text x="606" y="250" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">give it SRGBColorSpace.</text>
<text x="380" y="432" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Never share one Texture object between a colour slot and a data slot</text>
</svg>
