<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to get an access token</text>
  <rect x="20" y="50" width="350" height="290" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="390" y="50" width="350" height="290" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="195" y="76" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Public or private app</text>
  <text x="565" y="76" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Service app (2026-11-06)</text>
  <g font-size="12" fill="#374151">
    <text x="36" y="104">Acts on behalf of a signed-in user</text>
    <text x="36" y="128">Authorization code flow with PKCE (S256)</text>
    <text x="36" y="152">Scopes such as design:content:read</text>
    <text x="36" y="176">Refresh token, each one usable once</text>
    <text x="36" y="200">Needs a redirect URL and a backend</text>
    <text x="36" y="224">Capabilities apply to the user plan</text>
    <text x="36" y="248">Credits: the user's allowances</text>
    <text x="406" y="104">Acts as the app itself, no user sign-in</text>
    <text x="406" y="128">Client credentials flow, no PKCE</text>
    <text x="406" y="152">Scopes prefixed with service:</text>
    <text x="406" y="176">No refresh token: request a new one</text>
    <text x="406" y="200">No redirect URL, a server-side secret</text>
    <text x="406" y="224">Capabilities do not apply</text>
    <text x="406" y="248">Credits: the team's API credit pool</text>
  </g>
  <rect x="36" y="268" width="318" height="56" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="195" y="290" font-size="12" fill="#1F2937" text-anchor="middle">Bookshelf marketing script that runs as a</text><text x="195" y="306" font-size="12" fill="#1F2937" text-anchor="middle">named teammate: use this flow</text>
  <rect x="406" y="268" width="318" height="56" rx="6" fill="#FEF3C7" stroke="#B45309"/>
  <text x="565" y="290" font-size="12" fill="#92400E" text-anchor="middle">Unattended nightly batch job that fills and</text><text x="565" y="306" font-size="12" fill="#92400E" text-anchor="middle">exports: use this flow</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic comparison, not a screenshot of any product.</text>
</svg>
