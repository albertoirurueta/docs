<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="cbtNupkgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<text x="500.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What is inside a .nupkg</text>
<text x="500.0" y="48" font-size="12" fill="#666666" text-anchor="middle">A ZIP file: the folders a consumer reads, and the packaging files NuGet adds (Ledgerline 1.0.0 lists 12 entries)</text>
<rect x="20" y="66" width="960" height="464" rx="6" fill="#ffffff" stroke="#555555"/>
<text x="36" y="90" font-size="15" fill="#222222" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">Ledgerline.1.0.0.nupkg</text>
<rect x="36" y="104" width="440" height="38" rx="6" fill="#e8f1fb" stroke="#2f6db5"/>
<text x="48" y="128" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">Ledgerline.nuspec</text>
<text x="490" y="128" font-size="12" fill="#333333" text-anchor="start">manifest: id, version, metadata, dependency groups</text>
<rect x="36" y="150" width="440" height="38" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="48" y="174" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">lib/&lt;tfm&gt;/</text>
<text x="490" y="174" font-size="12" fill="#333333" text-anchor="start">assemblies referenced at compile time and copied at run time</text>
<rect x="36" y="196" width="440" height="38" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="48" y="220" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">ref/&lt;tfm&gt;/</text>
<text x="490" y="220" font-size="12" fill="#333333" text-anchor="start">compile-only reference assemblies (optional)</text>
<rect x="36" y="242" width="440" height="38" rx="6" fill="#eaf6ec" stroke="#2e7d3b"/>
<text x="48" y="266" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">runtimes/&lt;rid&gt;/lib, /native</text>
<text x="490" y="266" font-size="12" fill="#333333" text-anchor="start">RID-specific managed and native files</text>
<rect x="36" y="288" width="440" height="38" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="48" y="312" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">build/, buildTransitive/, buildMultiTargeting/</text>
<text x="490" y="312" font-size="12" fill="#333333" text-anchor="start">&lt;id&gt;.props and &lt;id&gt;.targets imported into the consumer</text>
<rect x="36" y="334" width="440" height="38" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="48" y="358" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">contentFiles/&lt;lang&gt;/&lt;tfm&gt;/</text>
<text x="490" y="358" font-size="12" fill="#333333" text-anchor="start">source or content files added to the consumer project</text>
<rect x="36" y="380" width="440" height="38" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="48" y="404" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">analyzers/dotnet/cs/</text>
<text x="490" y="404" font-size="12" fill="#333333" text-anchor="start">Roslyn analyzers and source generators</text>
<rect x="36" y="426" width="440" height="38" rx="6" fill="#fdf2e3" stroke="#b26a00"/>
<text x="48" y="450" font-size="12" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">tools/</text>
<text x="490" y="450" font-size="12" fill="#333333" text-anchor="start">.NET tool payload, or scripts</text>
<rect x="36" y="476" width="280" height="44" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="48" y="503" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">README.md  icon.png  LICENSE.txt</text>
<rect x="330" y="476" width="300" height="44" rx="6" fill="#f5f5f5" stroke="#555555"/>
<text x="342" y="494" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">[Content_Types].xml  _rels/.rels</text>
<text x="342" y="512" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace">package/services/metadata/...</text>
<rect x="644" y="476" width="320" height="44" rx="6" fill="#f7ecf7" stroke="#8a3d8a"/>
<text x="656" y="494" font-size="11" fill="#333333" text-anchor="start" font-family="Courier New, monospace" font-weight="bold">.signature.p7s</text>
<text x="656" y="512" font-size="11" fill="#333333" text-anchor="start">author or repository signature</text>
<text x="36" y="556" font-size="12" fill="#444444" text-anchor="start">Blue: the manifest.  Green: assets selected per target framework or RID.  Orange: build and design-time assets.</text>
<text x="36" y="578" font-size="12" fill="#444444" text-anchor="start">Grey: files referenced from the manifest and OPC packaging files.  Purple: added by signing, never by dotnet pack.</text>
</svg>
