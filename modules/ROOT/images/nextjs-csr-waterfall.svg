<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Client-side data waterfall compared with server-fetched data</title>
  <desc id="d">A timeline from 0 to about 1100 milliseconds with three lanes. Lane 1, client-side fetching in effects: the HTML and JavaScript arrive first (about 80 ms), then three dependent requests (session, shelf, books) of 300 ms each run one after another, and the books appear at about 1000 ms. Lane 2, the same three dependent reads awaited in a Server Component next to the data: the shell is sent at about 45 ms and the books are streamed at about 120 ms. Lane 3, a promise started on the server and unwrapped with use() in a Client Component: the shell is sent at about 47 ms and the books appear at about 60 ms.</desc>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">When does the shelf appear? One screen, three data strategies</text>
  <text x="450" y="47" font-size="12" fill="#555555" text-anchor="middle">measured in a scratch app: 300 ms simulated browser-to-server latency, 30 ms server-to-data latency, production build on localhost</text>
  <line x1="190" y1="320" x2="860" y2="320" stroke="#555555" stroke-width="1.5"/>
  <line x1="190.0" y1="84" x2="190.0" y2="326" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="190.0" y="342" font-size="11" fill="#444444" text-anchor="middle">0 ms</text>
  <line x1="342.2" y1="84" x2="342.2" y2="326" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="342.2" y="342" font-size="11" fill="#444444" text-anchor="middle">250 ms</text>
  <line x1="494.5" y1="84" x2="494.5" y2="326" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="494.5" y="342" font-size="11" fill="#444444" text-anchor="middle">500 ms</text>
  <line x1="646.8" y1="84" x2="646.8" y2="326" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="646.8" y="342" font-size="11" fill="#444444" text-anchor="middle">750 ms</text>
  <line x1="799.0" y1="84" x2="799.0" y2="326" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="799.0" y="342" font-size="11" fill="#444444" text-anchor="middle">1000 ms</text>
  <text x="20" y="112" font-size="13" font-weight="bold" fill="#222222">Client fetching</text>
  <text x="20" y="129" font-size="11" fill="#555555">useEffect chain</text>
  <text x="20" y="192" font-size="13" font-weight="bold" fill="#222222">Server fetching</text>
  <text x="20" y="209" font-size="11" fill="#555555">await in Server Component</text>
  <text x="20" y="272" font-size="13" font-weight="bold" fill="#222222">Server promise</text>
  <text x="20" y="289" font-size="11" fill="#555555">use() in Client Component</text>
  <rect x="190.0" y="96" width="48.7" height="38" fill="#6b6b6b" stroke="#444444" stroke-width="1.4"/>
  <rect x="237.5" y="96" width="182.7" height="38" fill="#9a5b00" stroke="#5c3500" stroke-width="1.4"/>
  <text x="328.9" y="120" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">session</text>
  <rect x="425.1" y="96" width="182.7" height="38" fill="#9a5b00" stroke="#5c3500" stroke-width="1.4"/>
  <text x="516.5" y="120" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">shelf (needs user id)</text>
  <rect x="611.4" y="96" width="182.7" height="38" fill="#9a5b00" stroke="#5c3500" stroke-width="1.4"/>
  <text x="702.8" y="120" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">books (need shelf ids)</text>
  <text x="214.4" y="150" font-size="10" fill="#444444" text-anchor="middle">HTML + JS</text>
  <text x="214.4" y="162" font-size="10" fill="#444444" text-anchor="middle">+ hydrate</text>
  <polygon points="802.7,90 811.7,115 802.7,140 793.7,115" fill="#c0392b"/>
  <text x="818.7" y="119" font-size="12" font-weight="bold" fill="#c0392b">1006 ms</text>
  <rect x="190.0" y="176" width="27.4" height="38" fill="#6b6b6b" stroke="#444444" stroke-width="1.4"/>
  <rect x="217.4" y="176" width="44.5" height="38" fill="#1e6b36" stroke="#10431f" stroke-width="1.4"/>
  <polygon points="261.9,170 270.9,195 261.9,220 252.89999999999998,195" fill="#c0392b"/>
  <text x="277.9" y="199" font-size="12" font-weight="bold" fill="#c0392b">118 ms</text>
  <text x="277.9" y="230" font-size="10" fill="#444444">shell, then the three reads (3 x 30 ms), one streamed response</text>
  <rect x="190.0" y="256" width="28.6" height="38" fill="#6b6b6b" stroke="#444444" stroke-width="1.4"/>
  <rect x="218.6" y="256" width="6.7" height="38" fill="#1f5fa8" stroke="#123a69" stroke-width="1.4"/>
  <polygon points="225.3,250 234.3,275 225.3,300 216.3,275" fill="#c0392b"/>
  <text x="241.3" y="279" font-size="12" font-weight="bold" fill="#c0392b">58 ms</text>
  <text x="241.3" y="310" font-size="10" fill="#444444">promise started before render, resolved while streaming</text>
  <rect x="190" y="360" width="14" height="14" fill="#6b6b6b"/><text x="210" y="372" font-size="11" fill="#333333">document, scripts, hydration</text>
  <rect x="390" y="360" width="14" height="14" fill="#9a5b00"/><text x="410" y="372" font-size="11" fill="#333333">browser request (300 ms each)</text>
  <rect x="590" y="360" width="14" height="14" fill="#1e6b36"/><text x="610" y="372" font-size="11" fill="#333333">server work next to the data</text>
  <polygon points="195,388 202,396 195,404 188,396" fill="#c0392b"/><text x="210" y="400" font-size="11" fill="#333333">books visible</text>
  <text x="390" y="400" font-size="11" fill="#333333">CSR requests start only after the JavaScript runs, and each waits for the previous render.</text>
  <text x="450" y="424" font-size="11" fill="#555555" text-anchor="middle">Absolute numbers depend on latency; the shape does not: the more dependent requests, the longer the client chain.</text>
</svg>
