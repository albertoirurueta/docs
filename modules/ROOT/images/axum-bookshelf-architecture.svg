<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Bookshelf application</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">one axum service, the stores it uses, and the systems around it -- the running example of this section</text>

  <!-- clients -->
  <g font-size="12">
    <rect x="20" y="70" width="170" height="44" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.3"/>
    <text x="105" y="90" text-anchor="middle" font-weight="bold" fill="#6a3d9a">Browser</text>
    <text x="105" y="106" text-anchor="middle" fill="#222222">htmx pages, SPA, WebSocket</text>
    <rect x="20" y="126" width="170" height="44" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.3"/>
    <text x="105" y="146" text-anchor="middle" font-weight="bold" fill="#6a3d9a">API clients</text>
    <text x="105" y="162" text-anchor="middle" fill="#222222">JSON, GraphQL, gRPC</text>
  </g>

  <!-- proxy -->
  <rect x="230" y="92" width="130" height="56" rx="6" fill="#f5f5f5" stroke="#777777" stroke-width="1.3"/>
  <text x="295" y="115" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">Ingress / proxy</text>
  <text x="295" y="132" font-size="11" fill="#444444" text-anchor="middle">TLS, load balancing</text>

  <!-- the service -->
  <rect x="385" y="66" width="340" height="330" rx="10" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.8"/>
  <text x="555" y="90" font-size="14" font-weight="bold" fill="#b7410e" text-anchor="middle">bookshelf-web (axum 0.8)</text>
  <g font-size="12">
    <rect x="397" y="102" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="122" text-anchor="middle" font-weight="bold" fill="#222222">tower layers</text>
    <text x="555" y="140" text-anchor="middle" font-size="11" fill="#444444">trace, request id, timeout, CORS, compression, CSRF</text>
    <rect x="397" y="164" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="184" text-anchor="middle" font-weight="bold" fill="#222222">Router</text>
    <text x="555" y="202" text-anchor="middle" font-size="11" fill="#444444">/api/v1, pages, /ws, /events, /graphql, fallback</text>
    <rect x="397" y="226" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="246" text-anchor="middle" font-weight="bold" fill="#222222">extractors and handlers</text>
    <text x="555" y="264" text-anchor="middle" font-size="11" fill="#444444">State, Path, Json, auth user -- AppError responses</text>
    <rect x="397" y="288" width="316" height="52" rx="5" fill="#ffffff" stroke="#b7410e"/>
    <text x="555" y="308" text-anchor="middle" font-weight="bold" fill="#222222">services and repositories</text>
    <text x="555" y="326" text-anchor="middle" font-size="11" fill="#444444">catalogue, loans, reviews -- shelf-core domain types</text>
    <text x="555" y="368" text-anchor="middle" fill="#666666">AppState: PgPool, Redis pool, HTTP client, settings</text>
    <text x="555" y="384" text-anchor="middle" fill="#666666">internal port 9000: /metrics, /health, /ready</text>
  </g>
  <g stroke="#b7410e" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="555" y1="154" x2="555" y2="162"/>
    <line x1="555" y1="216" x2="555" y2="224"/>
    <line x1="555" y1="278" x2="555" y2="286"/>
  </g>

  <!-- stores and dependencies -->
  <g font-size="12">
    <rect x="765" y="70" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="91" text-anchor="middle" font-weight="bold" fill="#1c4b73">PostgreSQL</text>
    <text x="852" y="108" text-anchor="middle" fill="#222222">sqlx: books, loans, jobs</text>
    <rect x="765" y="134" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="155" text-anchor="middle" font-weight="bold" fill="#1c4b73">Redis</text>
    <text x="852" y="172" text-anchor="middle" fill="#222222">sessions, cache, rate limits</text>
    <rect x="765" y="198" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="219" text-anchor="middle" font-weight="bold" fill="#1c4b73">reviews service</text>
    <text x="852" y="236" text-anchor="middle" fill="#222222">reqwest, traceparent</text>
    <rect x="765" y="262" width="175" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.3"/>
    <text x="852" y="283" text-anchor="middle" font-weight="bold" fill="#1c4b73">identity provider</text>
    <text x="852" y="300" text-anchor="middle" fill="#222222">OAuth 2.0 / OpenID Connect</text>
    <rect x="765" y="326" width="175" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="852" y="347" text-anchor="middle" font-weight="bold" fill="#2e7d32">Collector, Prometheus</text>
    <text x="852" y="364" text-anchor="middle" fill="#222222">traces, metrics, logs</text>
  </g>
  <g stroke="#444444" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="92" x2="228" y2="112"/>
    <line x1="190" y1="148" x2="228" y2="128"/>
    <line x1="360" y1="120" x2="383" y2="128"/>
    <line x1="725" y1="300" x2="763" y2="95"/>
    <line x1="725" y1="306" x2="763" y2="159"/>
    <line x1="725" y1="312" x2="763" y2="223"/>
    <line x1="725" y1="250" x2="763" y2="287"/>
    <line x1="725" y1="376" x2="763" y2="351"/>
  </g>

  <!-- workers -->
  <rect x="385" y="430" width="340" height="56" rx="8" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.4"/>
  <text x="555" y="453" font-size="12" font-weight="bold" fill="#b7410e" text-anchor="middle">background workers</text>
  <text x="555" y="471" font-size="12" fill="#222222" text-anchor="middle">due-date reminders, imports, cache warming</text>
  
  <path d="M725,458 L952,458 L952,95 L943,95" fill="none" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="840" y="450" font-size="11" fill="#444444" text-anchor="middle">job queue in Postgres</text>

  <text x="480" y="526" font-size="12" fill="#222222" text-anchor="middle">Each page builds one part of this picture; the domain types come from the Rust Reference's shelf-core crate.</text>
</svg>
