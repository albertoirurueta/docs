<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The vector database landscape</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Five overlapping categories of tools that store and search dense vectors</text>

  <!-- Category 1: Libraries -->
  <rect x="30" y="70" width="220" height="90" rx="6" fill="#eef2f7" stroke="#4c6b8a" stroke-width="1.5"/>
  <text x="140" y="90" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">Libraries</text>
  <text x="140" y="107" font-size="11" fill="#444444" text-anchor="middle">In-process ANN, no server,</text>
  <text x="140" y="121" font-size="11" fill="#444444" text-anchor="middle">no metadata or persistence model</text>
  <text x="140" y="143" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">FAISS</text>

  <!-- Category 2: SQL extensions -->
  <rect x="270" y="70" width="220" height="110" rx="6" fill="#eef7ee" stroke="#4a7a4a" stroke-width="1.5"/>
  <text x="380" y="90" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">SQL extensions</text>
  <text x="380" y="107" font-size="11" fill="#444444" text-anchor="middle">A VECTOR type and operators added</text>
  <text x="380" y="121" font-size="11" fill="#444444" text-anchor="middle">to an existing relational engine</text>
  <text x="380" y="143" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">pgvector (PostgreSQL)</text>
  <text x="380" y="159" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">sqlite-vec &#183; Oracle AI Vector Search</text>

  <!-- Category 3: Purpose-built engines -->
  <rect x="510" y="70" width="220" height="150" rx="6" fill="#fdf1e6" stroke="#a06a2a" stroke-width="1.5"/>
  <text x="620" y="90" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">Purpose-built engines</text>
  <text x="620" y="107" font-size="11" fill="#444444" text-anchor="middle">Built around the vector index</text>
  <text x="620" y="121" font-size="11" fill="#444444" text-anchor="middle">as the primary access path</text>
  <text x="620" y="143" font-size="12" font-weight="bold" fill="#7a3b12" text-anchor="middle">Qdrant &#183; Milvus &#183; Weaviate</text>
  <text x="620" y="159" font-size="12" font-weight="bold" fill="#7a3b12" text-anchor="middle">Chroma &#183; LanceDB</text>
  <text x="620" y="180" font-size="11" fill="#8a5a2a" text-anchor="middle">Pinecone (managed-only)</text>

  <!-- Category 4: Search engines -->
  <rect x="30" y="200" width="330" height="120" rx="6" fill="#f5eef7" stroke="#7a4a8a" stroke-width="1.5"/>
  <text x="195" y="220" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">Search engines</text>
  <text x="195" y="237" font-size="11" fill="#444444" text-anchor="middle">Lexical (BM25) search engines that added dense-vector kNN</text>
  <text x="195" y="251" font-size="11" fill="#444444" text-anchor="middle">alongside their inverted index</text>
  <text x="195" y="275" font-size="12" font-weight="bold" fill="#5a3268" text-anchor="middle">Elasticsearch &#183; OpenSearch</text>
  <text x="195" y="292" font-size="12" font-weight="bold" fill="#5a3268" text-anchor="middle">Solr &#183; Lucene</text>

  <!-- Category 5: Multi-model / NoSQL -->
  <rect x="390" y="200" width="340" height="140" rx="6" fill="#fdecec" stroke="#a03a3a" stroke-width="1.5"/>
  <text x="560" y="220" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">Multi-model / NoSQL</text>
  <text x="560" y="237" font-size="11" fill="#444444" text-anchor="middle">Operational stores that added a vector index</text>
  <text x="560" y="251" font-size="11" fill="#444444" text-anchor="middle">next to documents, key-value data or a graph</text>
  <text x="560" y="275" font-size="12" font-weight="bold" fill="#8a2a2a" text-anchor="middle">Redis &#183; MongoDB</text>
  <text x="560" y="292" font-size="12" font-weight="bold" fill="#8a2a2a" text-anchor="middle">Couchbase &#183; Neo4j</text>
  <text x="560" y="309" font-size="12" font-weight="bold" fill="#8a2a2a" text-anchor="middle">Cassandra</text>

  <!-- Overlap note -->
  <line x1="30" y1="345" x2="730" y2="345" stroke="#dddddd" stroke-width="1"/>
  <text x="380" y="368" font-size="11.5" fill="#555555" text-anchor="middle">Categories overlap in practice: MongoDB and Redis both act as multi-model stores and purpose-built</text>
  <text x="380" y="384" font-size="11.5" fill="#555555" text-anchor="middle">vector search targets; OpenSearch and Elasticsearch compete directly with Qdrant/Milvus on RAG workloads;</text>
  <text x="380" y="400" font-size="11.5" fill="#555555" text-anchor="middle">and pgvector-backed Postgres is often the first choice precisely because it needs no new category at all.</text>

  <!-- deployment axis -->
  <rect x="30" y="420" width="700" height="120" rx="6" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
  <text x="380" y="440" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Deployment model, left to right</text>

  <line x1="60" y1="470" x2="700" y2="470" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999999"/>
    </marker>
  </defs>

  <circle cx="90" cy="470" r="4" fill="#1c4b73"/>
  <text x="90" y="492" font-size="10.5" fill="#444444" text-anchor="middle">Embedded library</text>
  <text x="90" y="505" font-size="10.5" fill="#666666" text-anchor="middle">FAISS, sqlite-vec</text>

  <circle cx="270" cy="470" r="4" fill="#2f5424"/>
  <text x="270" y="492" font-size="10.5" fill="#444444" text-anchor="middle">Self-hosted server</text>
  <text x="270" y="505" font-size="10.5" fill="#666666" text-anchor="middle">pgvector, Qdrant, Elasticsearch</text>

  <circle cx="470" cy="470" r="4" fill="#7a3b12"/>
  <text x="470" y="492" font-size="10.5" fill="#444444" text-anchor="middle">Vendor-managed cloud</text>
  <text x="470" y="505" font-size="10.5" fill="#666666" text-anchor="middle">Qdrant Cloud, Zilliz, MongoDB Atlas</text>

  <circle cx="670" cy="470" r="4" fill="#8a2a2a"/>
  <text x="670" y="492" font-size="10.5" fill="#444444" text-anchor="middle">Fully managed serverless</text>
  <text x="670" y="505" font-size="10.5" fill="#666666" text-anchor="middle">Pinecone</text>

  <text x="380" y="530" font-size="10.5" fill="#888888" text-anchor="middle">Most engines above span more than one point on this axis; see the comparison page for per-engine cloud availability.</text>
</svg>
