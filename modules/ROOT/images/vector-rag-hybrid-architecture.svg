<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The hybrid architecture of a vector-search system</text>
  <text x="380" y="48" font-size="12" fill="#666666" text-anchor="middle">A vector component, a metadata component, and an integration layer that queries both</text>

  <!-- Integration layer box (top) -->
  <rect x="200" y="70" width="360" height="60" rx="6" fill="#f0ede7" stroke="#8a7a5c" stroke-width="1.5"/>
  <text x="380" y="94" font-size="13" font-weight="bold" fill="#5b4d33" text-anchor="middle">Integration layer</text>
  <text x="380" y="112" font-size="11" fill="#5b4d33" text-anchor="middle">application code / VectorStore abstraction</text>
  <text x="380" y="124" font-size="10.5" fill="#7a6c4f" text-anchor="middle">merges vector hits with metadata rows into ranked results</text>

  <!-- Arrows down to the two components -->
  <line x1="320" y1="130" x2="230" y2="180" stroke="#8a7a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="130" x2="530" y2="180" stroke="#8a7a5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a7a5c"/>
    </marker>
  </defs>

  <!-- Vector component -->
  <rect x="60" y="180" width="300" height="150" rx="6" fill="#eaf1f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="210" y="204" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Vector component</text>
  <text x="210" y="222" font-size="11" fill="#333333" text-anchor="middle">stores embeddings, e.g. vector(768)</text>
  <text x="210" y="240" font-size="11" fill="#333333" text-anchor="middle">ANN index (HNSW / IVF)</text>
  <text x="210" y="258" font-size="11" fill="#333333" text-anchor="middle">answers: "k nearest to this vector"</text>
  <text x="210" y="276" font-size="10.5" fill="#5a7690" text-anchor="middle">pgvector chunk_embeddings.embedding,</text>
  <text x="210" y="291" font-size="10.5" fill="#5a7690" text-anchor="middle">Qdrant/Redis/FAISS index, etc.</text>
  <text x="210" y="312" font-size="10.5" fill="#8a8a8a" text-anchor="middle">returns: chunk_id, distance</text>

  <!-- Metadata component -->
  <rect x="400" y="180" width="300" height="150" rx="6" fill="#f4ece2" stroke="#7a3b12" stroke-width="1.5"/>
  <text x="550" y="204" font-size="13" font-weight="bold" fill="#7a3b12" text-anchor="middle">Metadata component</text>
  <text x="550" y="222" font-size="11" fill="#333333" text-anchor="middle">structured columns / payload fields</text>
  <text x="550" y="240" font-size="11" fill="#333333" text-anchor="middle">B-tree / GIN / tag indexes</text>
  <text x="550" y="258" font-size="11" fill="#333333" text-anchor="middle">answers: "which rows match this filter"</text>
  <text x="550" y="276" font-size="10.5" fill="#9c623a" text-anchor="middle">documents.component, chunks.section_path,</text>
  <text x="550" y="291" font-size="10.5" fill="#9c623a" text-anchor="middle">source_path, title, chunk_index</text>
  <text x="550" y="312" font-size="10.5" fill="#8a8a8a" text-anchor="middle">returns: chunk_id, title, section, source_path</text>

  <!-- Arrows converging back up to integration layer output -->
  <line x1="230" y1="180" x2="320" y2="130" stroke="#c9c2ae" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="180" x2="440" y2="130" stroke="#c9c2ae" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Result row -->
  <rect x="140" y="360" width="480" height="60" rx="6" fill="#eef7ec" stroke="#2f5424" stroke-width="1.5"/>
  <text x="380" y="384" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">Ranked, filtered results</text>
  <text x="380" y="402" font-size="10.5" fill="#3f6b31" text-anchor="middle">e.g. top-5 chunks from component = 'vector-rag', ordered by cosine distance</text>

  <line x1="380" y1="330" x2="380" y2="360" stroke="#2f5424" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <text x="380" y="446" font-size="10.5" fill="#888888" text-anchor="middle">Whether the two components live in one engine (pgvector, Qdrant payloads) or two (a vector library plus a separate database) is an implementation choice.</text>
</svg>
