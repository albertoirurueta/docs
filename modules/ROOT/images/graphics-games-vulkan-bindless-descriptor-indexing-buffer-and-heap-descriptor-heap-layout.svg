<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-bl-heap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Descriptor heap: shader bindings mapped onto heap slots</text>
<text x="150" y="60" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Resource heap (VkBuffer with DESCRIPTOR_HEAP usage)</text>
<rect x="30" y="75" width="240" height="40" rx="8" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
<text x="150.0" y="98.8" text-anchor="middle" font-size="11" fill="#374151">reserved range (driver)</text>
<rect x="30" y="125" width="240" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150.0" y="147.8" text-anchor="middle" font-size="11" fill="#3730A3">slot 0: camera UBO</text>
<rect x="30" y="169" width="240" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="150.0" y="191.8" text-anchor="middle" font-size="11" fill="#065F46">slot 1: cover image</text>
<rect x="30" y="213" width="240" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="150.0" y="235.8" text-anchor="middle" font-size="11" fill="#065F46">slot 2: spine image</text>
<rect x="30" y="257" width="240" height="38" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="150.0" y="279.9" text-anchor="middle" font-size="11" fill="#3730A3">slot 3: instances SSBO</text>
<rect x="30" y="310" width="240" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="150.0" y="331.9" text-anchor="middle" font-size="11" fill="#92400E">Sampler heap: slot 0 linear sampler</text>
<text x="520" y="60" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Pipeline mappings and push data</text>
<rect x="330" y="75" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="530.0" y="101.3" text-anchor="middle" font-size="11" fill="#3730A3">Mapping: set 0 binding 1 =</text>
<text x="530.0" y="116.3" text-anchor="middle" font-size="11" fill="#3730A3">HEAP_WITH_PUSH_INDEX (index read from push data)</text>
<rect x="330" y="150" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="530.0" y="176.3" text-anchor="middle" font-size="11" fill="#3730A3">Mapping: set 0 binding 0 =</text>
<text x="530.0" y="191.3" text-anchor="middle" font-size="11" fill="#3730A3">HEAP_WITH_CONSTANT_OFFSET (slot 0)</text>
<rect x="330" y="225" width="400" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="530.0" y="246.3" text-anchor="middle" font-size="11" fill="#92400E">vkCmdPushDataEXT: material index 1</text>
<text x="530.0" y="261.4" text-anchor="middle" font-size="11" fill="#92400E">(per draw, a few bytes)</text>
<line x1="330" y1="105" x2="272" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-bl-heap)"/>
<line x1="330" y1="180" x2="272" y2="144" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-bl-heap)"/>
<line x1="530" y1="225" x2="530" y2="137" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-bl-heap)"/>
<text x="530" y="306" text-anchor="middle" font-size="11" fill="#3730A3">vkCmdBindResourceHeapEXT and vkCmdBindSamplerHeapEXT</text>
<text x="530" y="324" text-anchor="middle" font-size="11" fill="#3730A3">pipelines created with a null pipeline layout</text>
</svg>
