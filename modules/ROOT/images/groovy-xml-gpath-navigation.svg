<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">GPath navigation over the seed catalogue</title>
  <desc id="d">The element tree of the seed catalogue down to the seed level. Seed elements are highlighted as the result of catalogue.section.seed, the direct children of the root are highlighted as the result of the star step, and every element carries its depth-first and breadth-first visiting index.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1f2933; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 12px; }
    .t { font-weight: bold; font-size: 14px; }
    .s { font-size: 11px; fill: #52606d; }
    .d { font-size: 11px; font-weight: bold; fill: #1d4f91; }
    .b { font-size: 11px; font-weight: bold; fill: #1f7a3d; }
    .e { stroke: #7b8794; stroke-width: 1.5; fill: none; }
  </style>
  <!-- edges -->
  <path class="e" d="M380 76 V96 H90 V108"/>
  <path class="e" d="M380 76 V96 H300 V108"/>
  <path class="e" d="M380 76 V96 H620 V108"/>
  <path class="e" d="M300 160 V180 H205 V192"/>
  <path class="e" d="M300 160 V180 H395 V192"/>
  <path class="e" d="M620 160 V192"/>
  <!-- root -->
  <rect x="300" y="26" width="160" height="50" rx="6" fill="#e4e7eb" stroke="#52606d"/>
  <text class="m t" x="380" y="46" text-anchor="middle">catalogue</text>
  <text class="s" x="380" y="60" text-anchor="middle">@season = spring</text>
  <text class="d" x="318" y="72">D1</text><text class="b" x="422" y="72">B1</text>
  <!-- level 1 -->
  <rect x="30" y="108" width="120" height="52" rx="6" fill="#d6e6fb" stroke="#1d4f91" stroke-width="2"/>
  <text class="m t" x="90" y="128" text-anchor="middle">supplier</text>
  <text class="s" x="90" y="142" text-anchor="middle">Green Seeds Ltd</text>
  <text class="d" x="38" y="155">D2</text><text class="b" x="122" y="155">B2</text>
  <rect x="220" y="108" width="160" height="52" rx="6" fill="#d6e6fb" stroke="#1d4f91" stroke-width="2"/>
  <text class="m t" x="300" y="128" text-anchor="middle">section</text>
  <text class="s" x="300" y="142" text-anchor="middle">@name = vegetables</text>
  <text class="d" x="228" y="155">D3</text><text class="b" x="352" y="155">B3</text>
  <rect x="540" y="108" width="160" height="52" rx="6" fill="#d6e6fb" stroke="#1d4f91" stroke-width="2"/>
  <text class="m t" x="620" y="128" text-anchor="middle">section</text>
  <text class="s" x="620" y="142" text-anchor="middle">@name = flowers</text>
  <text class="d" x="548" y="155">D6</text><text class="b" x="672" y="155">B4</text>
  <!-- seeds -->
  <rect x="120" y="192" width="170" height="68" rx="6" fill="#fde8cf" stroke="#b15a00" stroke-width="2"/>
  <text class="m t" x="205" y="212" text-anchor="middle">seed</text>
  <text class="s" x="205" y="226" text-anchor="middle">@id = s1, @stock = 120</text>
  <text class="s" x="205" y="240" text-anchor="middle">name price tags</text>
  <text class="d" x="128" y="255">D4</text><text class="b" x="262" y="255">B5</text>
  <rect x="310" y="192" width="170" height="68" rx="6" fill="#fde8cf" stroke="#b15a00" stroke-width="2"/>
  <text class="m t" x="395" y="212" text-anchor="middle">seed</text>
  <text class="s" x="395" y="226" text-anchor="middle">@id = s2, @stock = 0</text>
  <text class="s" x="395" y="240" text-anchor="middle">name price tags</text>
  <text class="d" x="318" y="255">D5</text><text class="b" x="452" y="255">B6</text>
  <rect x="535" y="192" width="170" height="68" rx="6" fill="#fde8cf" stroke="#b15a00" stroke-width="2"/>
  <text class="m t" x="620" y="212" text-anchor="middle">seed</text>
  <text class="s" x="620" y="226" text-anchor="middle">@id = s3, @stock = 45</text>
  <text class="s" x="620" y="240" text-anchor="middle">name price tags</text>
  <text class="d" x="543" y="255">D7</text><text class="b" x="677" y="255">B7</text>
  <!-- legend -->
  <line x1="20" y1="282" x2="740" y2="282" stroke="#cbd2d9"/>
  <rect x="24" y="294" width="22" height="16" rx="3" fill="#d6e6fb" stroke="#1d4f91" stroke-width="2"/>
  <text class="m" x="58" y="307">catalogue.'*'</text>
  <text x="240" y="307">is children(): the direct children only (supplier and both sections).</text>
  <rect x="24" y="320" width="22" height="16" rx="3" fill="#fde8cf" stroke="#b15a00" stroke-width="2"/>
  <text class="m" x="58" y="333">catalogue.section.seed</text>
  <text x="240" y="333">follows one name per step and returns every match, in document order.</text>
  <text class="d" x="24" y="359">D n</text>
  <text class="m" x="58" y="359">catalogue.'**'</text>
  <text x="240" y="359">is depthFirst(): a node, then all its descendants, then its next sibling.</text>
  <text class="b" x="24" y="385">B n</text>
  <text class="m" x="58" y="385">catalogue.breadthFirst()</text>
  <text x="240" y="385">visits a whole level before going one level down.</text>
  <text class="m" x="24" y="414">@id, ['@id']</text>
  <text x="130" y="414">read an attribute (a String); .text() reads the text content of an element.</text>
  <text class="s" x="24" y="442">The inner name, price and tags elements are not drawn, so the indexes count the seven elements shown. In the real tree each seed</text>
  <text class="s" x="24" y="456">also has three children, and both traversals include the root, so depthFirst() returns 21 elements.</text>
</svg>
