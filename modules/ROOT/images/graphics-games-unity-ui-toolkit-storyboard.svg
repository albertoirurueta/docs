<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-uitk-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Building the Bookshelf HUD in the Editor</text>
<rect x="10" y="48" width="230" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="27" cy="65" r="11" fill="#4F46E5"/><text x="27" y="69.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<rect x="30" y="90" width="190" height="28" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="125" y="108" text-anchor="middle" font-size="11" fill="#374151">UI Toolkit menu</text>
<rect x="30" y="126" width="190" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="125" y="144" text-anchor="middle" font-size="11" fill="#3730A3">UI Document</text>
<rect x="30" y="170" width="190" height="90" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="125" y="190" text-anchor="middle" font-size="10" fill="#374151">creates a UI Toolkit folder with</text>
<text x="125" y="205" text-anchor="middle" font-size="10" fill="#374151">a Panel Settings asset and a</text>
<text x="125" y="220" text-anchor="middle" font-size="10" fill="#374151">default runtime theme, plus a</text>
<text x="125" y="235" text-anchor="middle" font-size="10" fill="#374151">GameObject with the component</text>
<rect x="265" y="48" width="230" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="282" cy="65" r="11" fill="#4F46E5"/><text x="282" y="69.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<rect x="280" y="85" width="60" height="180" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="310" y="102" text-anchor="middle" font-size="10" fill="#374151">Library</text>
<rect x="286" y="110" width="48" height="16" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="310" y="122" text-anchor="middle" font-size="9" fill="#3730A3">Label</text>
<rect x="286" y="132" width="48" height="16" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="310" y="144" text-anchor="middle" font-size="9" fill="#3730A3">Button</text>
<rect x="286" y="154" width="48" height="16" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="310" y="166" text-anchor="middle" font-size="9" fill="#3730A3">ListView</text>
<rect x="345" y="85" width="140" height="180" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="355" y="95" width="120" height="22" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="415" y="110" text-anchor="middle" font-size="10" fill="#1F2937">Score  120</text>
<rect x="355" y="123" width="120" height="22" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="415" y="138" text-anchor="middle" font-size="10" fill="#1F2937">Time  0:42</text>
<rect x="355" y="151" width="120" height="22" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="415" y="166" text-anchor="middle" font-size="10" fill="#1F2937">Pause</text>
<text x="415" y="200" text-anchor="middle" font-size="10" fill="#374151">drag controls from the</text>
<text x="415" y="215" text-anchor="middle" font-size="10" fill="#374151">Library into the Hierarchy</text>
<text x="415" y="230" text-anchor="middle" font-size="10" fill="#374151">and set Name in the Inspector</text>
<rect x="520" y="48" width="230" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="537" cy="65" r="11" fill="#4F46E5"/><text x="537" y="69.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="540" y="90" width="190" height="28" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="635" y="108" text-anchor="middle" font-size="11" fill="#92400E">StyleSheets: Hud.uss</text>
<rect x="540" y="126" width="190" height="28" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="635" y="144" text-anchor="middle" font-size="11" fill="#374151">selector .stat</text>
<rect x="540" y="162" width="190" height="28" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="635" y="180" text-anchor="middle" font-size="11" fill="#374151">font size 28, colour, margin</text>
<text x="635" y="215" text-anchor="middle" font-size="10" fill="#374151">extract inline styles into a</text>
<text x="635" y="230" text-anchor="middle" font-size="10" fill="#374151">USS file and add the class</text>
<text x="635" y="245" text-anchor="middle" font-size="10" fill="#374151">to each element</text>
<rect x="10" y="288" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="27" cy="305" r="11" fill="#B45309"/><text x="27" y="309.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="215" y="312" text-anchor="middle" font-size="11" fill="#374151">Select the UIDocument object, drag Hud.uxml</text>
<text x="215" y="328" text-anchor="middle" font-size="11" fill="#374151">into Source Asset, then attach HudController</text>
<rect x="390" y="288" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="407" cy="305" r="11" fill="#B45309"/><text x="407" y="309.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="570" y="312" text-anchor="middle" font-size="11" fill="#374151">Enter Play mode: the Game view shows the HUD and</text>
<text x="570" y="328" text-anchor="middle" font-size="11" fill="#374151">the Console prints the button click messages</text>
<line x1="240" y1="163" x2="265" y2="163" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-story)"/>
<line x1="495" y1="163" x2="520" y2="163" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-story)"/>
<line x1="635" y1="278" x2="370" y2="300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-story)"/>
<line x1="370" y1="319" x2="390" y2="319" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-uitk-story)"/>
</svg>
