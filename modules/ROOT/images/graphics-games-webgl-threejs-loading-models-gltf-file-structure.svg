<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-loading-models-gltf-file-structure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What is inside a glTF 2.0 asset</text>
<rect x="20" y="50" width="350" height="175" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195" y="70" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">.gltf + .bin + images (separate files)</text>
<rect x="35" y="82" width="320" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="98.5" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bookshelf.gltf (JSON: scenes, nodes, meshes,</text>
<text x="195.0" y="113.5" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materials, textures, animations)</text>
<rect x="35" y="132" width="150" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="110.0" y="146.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bookshelf.bin</text>
<text x="110.0" y="161.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex and index data</text>
<rect x="205" y="132" width="150" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="280.0" y="146.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">wood.png, cover.png</text>
<text x="280.0" y="161.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">spine.png, pages.png</text>
<line x1="120" y1="122" x2="120" y2="132" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<line x1="280" y1="122" x2="280" y2="132" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<text x="195" y="200" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Several requests, easy to inspect and edit</text>
<rect x="390" y="50" width="350" height="175" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565" y="70" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">.glb (single binary container)</text>
<rect x="405" y="82" width="320" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="100.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">12-byte header: magic glTF, version 2, length</text>
<rect x="405" y="118" width="320" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="139.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">JSON chunk (same document as .gltf)</text>
<rect x="405" y="160" width="320" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="181.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">BIN chunk: buffers, optionally embedded images</text>
<text x="565" y="212" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">One request, the usual delivery format</text>
<text x="380" y="255" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Object graph inside the JSON</text>
<rect x="20" y="270" width="103" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="71.5" y="296.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">scene</text>
<line x1="123" y1="292" x2="143" y2="292" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<rect x="143" y="270" width="103" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="194.5" y="296.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">nodes</text>
<line x1="246" y1="292" x2="266" y2="292" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<rect x="266" y="270" width="103" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="317.5" y="296.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">mesh</text>
<line x1="369" y1="292" x2="389" y2="292" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<rect x="389" y="270" width="103" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="440.5" y="296.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">primitive</text>
<line x1="492" y1="292" x2="512" y2="292" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<rect x="512" y="270" width="103" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="563.5" y="296.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">material</text>
<line x1="615" y1="292" x2="635" y2="292" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-file-structure)"/>
<rect x="635" y="270" width="103" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="686.5" y="296.0" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">texture</text>
<text x="380" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">primitive also points to accessors, which read bufferViews of the BIN data</text>
<text x="380" y="358" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">node holds translation, rotation, scale and children; animations target nodes</text>
<text x="380" y="376" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">three.js maps: scene to Group, node to Object3D, primitive to Mesh, material to MeshStandardMaterial</text>
<text x="380" y="400" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(extensions such as clearcoat map to MeshPhysicalMaterial)</text>
</svg>
