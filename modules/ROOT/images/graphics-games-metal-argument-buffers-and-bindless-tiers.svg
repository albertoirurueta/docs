<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ab-tier" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Argument buffer tiers at a glance</text>
<rect x="20" y="55" width="350" height="230" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="134.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Tier 1</text>
<text x="195.0" y="150.0" text-anchor="middle" font-size="12" fill="#92400E">Functions can only read</text>
<text x="195.0" y="166.0" text-anchor="middle" font-size="12" fill="#92400E">data from an argument buffer</text>
<text x="195.0" y="182.0" text-anchor="middle" font-size="12" fill="#92400E">Smaller limits than tier 2</text>
<text x="195.0" y="198.0" text-anchor="middle" font-size="12" fill="#92400E">Fewer textures in one instanced draw</text>
<text x="195.0" y="214.0" text-anchor="middle" font-size="12" fill="#92400E">Exact counts: Feature Set Tables</text>
<rect x="390" y="55" width="350" height="230" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="126.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Tier 2</text>
<text x="565.0" y="142.0" text-anchor="middle" font-size="12" fill="#065F46">Graphics and compute functions can</text>
<text x="565.0" y="158.0" text-anchor="middle" font-size="12" fill="#065F46">also encode into argument buffers</text>
<text x="565.0" y="174.0" text-anchor="middle" font-size="12" fill="#065F46">Larger limits than tier 1</text>
<text x="565.0" y="190.0" text-anchor="middle" font-size="12" fill="#065F46">More textures in one instanced draw</text>
<text x="565.0" y="206.0" text-anchor="middle" font-size="12" fill="#065F46">Samplers need supportArgumentBuffers</text>
<text x="565.0" y="222.0" text-anchor="middle" font-size="12" fill="#065F46">The route to bindless designs</text>
<rect x="20" y="300" width="720" height="35" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="321.0" text-anchor="middle" font-size="11" fill="#374151">Query it with device.argumentBuffersSupport: the value is .tier1 or .tier2.</text>
</svg>
