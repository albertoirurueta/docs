<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Groovy toolchain</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">source is compiled to ordinary JVM bytecode, either ahead of time or on the fly, and runs on the same JVM as Java</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="80" width="150" height="70" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
    <text x="95" y="108" font-weight="bold" fill="#222222">Source</text>
    <text x="95" y="127" font-size="11" fill="#444444">.groovy scripts and classes</text>

    <rect x="240" y="60" width="170" height="52" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="325" y="83" font-weight="bold" fill="#1c4b73">groovyc</text>
    <text x="325" y="101" font-size="11" fill="#444444">ahead-of-time compiler</text>

    <rect x="240" y="118" width="170" height="52" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="325" y="141" font-weight="bold" fill="#1c4b73">groovy command</text>
    <text x="325" y="159" font-size="11" fill="#444444">compiles in memory, then runs</text>

    <rect x="480" y="80" width="170" height="70" rx="6" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
    <text x="565" y="108" font-weight="bold" fill="#a35a00">Bytecode</text>
    <text x="565" y="127" font-size="11" fill="#444444">.class files (Script or class)</text>

    <rect x="720" y="80" width="220" height="70" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="830" y="108" font-weight="bold" fill="#2e7d32">JVM (JDK 17+ for 6.0)</text>
    <text x="830" y="127" font-size="11" fill="#444444">runs java or groovy launchers</text>
  </g>
  <g stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M170,105 L240,86"/>
    <path d="M170,125 L240,144"/>
    <path d="M410,86 L480,105"/>
    <path d="M410,144 L480,125"/>
    <path d="M650,115 L720,115"/>
  </g>
  <text x="445" y="76" font-size="11" fill="#444444" text-anchor="middle">writes .class</text>
  <text x="445" y="168" font-size="11" fill="#444444" text-anchor="middle">class loader</text>

  <rect x="20" y="215" width="920" height="170" rx="8" fill="#f9f9f9" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="40" y="238" font-size="13" font-weight="bold" fill="#222222">Classpath at run time</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="255" width="190" height="110" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="135" y="280" font-weight="bold" fill="#1c4b73">Groovy core</text>
    <text x="135" y="300" font-size="11" fill="#444444">org.apache.groovy:groovy</text>
    <text x="135" y="318" font-size="11" fill="#444444">parser, runtime, MOP,</text>
    <text x="135" y="334" font-size="11" fill="#444444">and the GDK extension</text>
    <text x="135" y="350" font-size="11" fill="#444444">methods on JDK classes</text>

    <rect x="250" y="255" width="330" height="110" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="415" y="280" font-weight="bold" fill="#1c4b73">Optional modules</text>
    <text x="415" y="300" font-size="11" fill="#444444">groovy-json, groovy-xml, groovy-sql, groovy-templates,</text>
    <text x="415" y="318" font-size="11" fill="#444444">groovy-test, groovy-ginq, groovy-groovysh, ...</text>
    <text x="415" y="340" font-size="11" fill="#444444">same version as the core; groovy-bom keeps them aligned</text>
    <text x="415" y="356" font-size="11" fill="#444444">groovy-all is a pom that pulls in the standard set</text>

    <rect x="600" y="255" width="150" height="110" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
    <text x="675" y="280" font-weight="bold" fill="#222222">Your classes</text>
    <text x="675" y="305" font-size="11" fill="#444444">compiled output</text>
    <text x="675" y="323" font-size="11" fill="#444444">directory or jar</text>
    <text x="675" y="341" font-size="11" fill="#444444">(-cp / -d)</text>

    <rect x="770" y="255" width="150" height="110" rx="6" fill="#fdf0e2" stroke="#a35a00" stroke-width="1.4"/>
    <text x="845" y="280" font-weight="bold" fill="#a35a00">Third-party jars</text>
    <text x="845" y="305" font-size="11" fill="#444444">from Maven Central,</text>
    <text x="845" y="323" font-size="11" fill="#444444">or fetched by Grape</text>
    <text x="845" y="341" font-size="11" fill="#444444">(@Grab)</text>
  </g>
  <path d="M830,150 L830,215" stroke="#444444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="840" y="190" font-size="11" fill="#444444">loads</text>
</svg>
