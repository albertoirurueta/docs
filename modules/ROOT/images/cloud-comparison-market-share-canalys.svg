<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="market-share-canalys-t market-share-canalys-d">
<title id="market-share-canalys-t">Cloud infrastructure market share (Canalys, now part of Omdia)</title>
<desc id="market-share-canalys-d">Worldwide share of cloud infrastructure services spend of AWS, Azure and Google Cloud in the quarters where Canalys (Omdia) published a share per provider (data as of 2026-10-26). A bar labelled n/a means the share was not published, not zero. The definition differs from Synergy Research Group, so the two sources are never combined.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}</style>
<rect width="860" height="500" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Cloud infrastructure market share (Canalys, now part of Omdia)</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">AWS</text><rect class="m1" x="228" y="-4" width="8" height="8"/><text x="250" y="4">Azure</text><path class="m2" d="M382 -5L387 4L377 4Z"/><text x="400" y="4">Google Cloud</text></g></g><line class="grid" x1="70" y1="388" x2="836" y2="388"/><text class="muted" x="62" y="392" text-anchor="end">0</text><line class="grid" x1="70" y1="313" x2="836" y2="313"/><text class="muted" x="62" y="317" text-anchor="end">10</text><line class="grid" x1="70" y1="238" x2="836" y2="238"/><text class="muted" x="62" y="242" text-anchor="end">20</text><line class="grid" x1="70" y1="163" x2="836" y2="163"/><text class="muted" x="62" y="167" text-anchor="end">30</text><line class="grid" x1="70" y1="88" x2="836" y2="88"/><text class="muted" x="62" y="92" text-anchor="end">40</text><path class="axis" d="M70 88V388H836"/><g><title>AWS: 32%</title><rect class="f0" x="138.67" y="148" width="38" height="240"/><text class="muted" x="157.67" y="144" text-anchor="middle" font-size="10">32%</text></g><g><title>Azure: 23%</title><rect class="f1" x="178.67" y="215.5" width="38" height="172.5"/><text class="muted" x="197.67" y="211.5" text-anchor="middle" font-size="10">23%</text></g><g><title>Google Cloud: 10%</title><rect class="f2" x="218.67" y="313" width="38" height="75"/><text class="muted" x="237.67" y="309" text-anchor="middle" font-size="10">10%</text></g><text x="197.67" y="406" text-anchor="middle"><tspan x="197.67" dy="0">2025-Q1</tspan></text><g><title>AWS: 32%</title><rect class="f0" x="394" y="148" width="38" height="240"/><text class="muted" x="413" y="144" text-anchor="middle" font-size="10">32%</text></g><g><title>Azure: n/a</title><text class="na" x="453" y="382" text-anchor="middle" font-size="10">n/a</text></g><g><title>Google Cloud: n/a</title><text class="na" x="493" y="382" text-anchor="middle" font-size="10">n/a</text></g><text x="453" y="406" text-anchor="middle"><tspan x="453" dy="0">2025-Q3</tspan></text><g><title>AWS: 32%</title><rect class="f0" x="649.33" y="148" width="38" height="240"/><text class="muted" x="668.33" y="144" text-anchor="middle" font-size="10">32%</text></g><g><title>Azure: 22%</title><rect class="f1" x="689.33" y="223" width="38" height="165"/><text class="muted" x="708.33" y="219" text-anchor="middle" font-size="10">22%</text></g><g><title>Google Cloud: 12%</title><rect class="f2" x="729.33" y="298" width="38" height="90"/><text class="muted" x="748.33" y="294" text-anchor="middle" font-size="10">12%</text></g><text x="708.33" y="406" text-anchor="middle"><tspan x="708.33" dy="0">2025-Q4</tspan></text><text class="axis-label" x="453" y="448" text-anchor="middle">Quarter</text><text class="axis-label" transform="translate(16 238) rotate(-90)" text-anchor="middle">Share of worldwide spend (%)</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="464" text-anchor="start"><tspan x="24" dy="0">Sources: canalys-2024-q4, omdia-2025-q1, omdia-2025-q3, omdia-2025-q4. Data as of 2026-10-26. n/a: share not published. The Canalys (Omdia)</tspan><tspan x="24" dy="15">definition differs from Synergy, so the series are not combined.</tspan></text>
</svg>
