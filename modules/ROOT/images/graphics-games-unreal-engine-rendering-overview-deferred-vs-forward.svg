<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Deferred and forward shading compared</text>
<rect x="25" y="50" width="345" height="320" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<rect x="390" y="50" width="345" height="320" rx="12" fill="#F9FAFB" stroke="#B45309" stroke-width="2"/>
<text x="197" y="76" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Deferred (default on desktop)</text>
<text x="562" y="76" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">Forward (opt-in)</text>
<rect x="45" y="95" width="305" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197.5" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3">Pass 1: draw every mesh once, write GBuffer</text>
<rect x="45" y="150" width="305" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197.5" y="174.3" text-anchor="middle" font-size="11" fill="#374151">GBuffer: base color, world normal,</text>
<text x="197.5" y="189.3" text-anchor="middle" font-size="11" fill="#374151">metallic, roughness, specular, shading model</text>
<rect x="45" y="225" width="305" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197.5" y="247.2" text-anchor="middle" font-size="12" fill="#3730A3">Pass 2: light every pixel from the GBuffer</text>
<line x1="197" y1="131" x2="197" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="197" y1="206" x2="197" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<text x="197" y="295" text-anchor="middle" font-size="11" fill="#3730A3">Many lights are cheap per pixel; screen-space SSR, SSAO,</text>
<text x="197" y="310" text-anchor="middle" font-size="11" fill="#3730A3">contact shadows, Lumen and MegaLights work.</text>
<text x="197" y="325" text-anchor="middle" font-size="11" fill="#3730A3">No MSAA: temporal anti-aliasing (TSR) instead.</text>
<rect x="410" y="95" width="305" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="562.5" y="117.2" text-anchor="middle" font-size="12" fill="#92400E">Each mesh is lit while it is drawn</text>
<rect x="410" y="150" width="305" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="562.5" y="174.3" text-anchor="middle" font-size="11" fill="#374151">Per-pixel lights culled to a grid;</text>
<text x="562.5" y="189.3" text-anchor="middle" font-size="11" fill="#374151">materials carry the lighting cost</text>
<rect x="410" y="225" width="305" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="562.5" y="247.2" text-anchor="middle" font-size="12" fill="#92400E">MSAA is available (project setting)</text>
<line x1="562" y1="131" x2="562" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<line x1="562" y1="206" x2="562" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b2)"/>
<text x="562" y="295" text-anchor="middle" font-size="11" fill="#92400E">Fewer memory passes, good for VR and hardware limits.</text>
<text x="562" y="310" text-anchor="middle" font-size="11" fill="#92400E">No SSR, SSAO or contact shadows; MegaLights is</text>
<text x="562" y="325" text-anchor="middle" font-size="11" fill="#92400E">incompatible with the forward renderer.</text>
<text x="380" y="392" text-anchor="middle" font-size="12" fill="#374151">Mobile uses its own renderer: multi-pass deferred by default since 5.8, forward as opt-in.</text>
</svg>
