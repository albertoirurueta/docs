<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Request routing for a site-attached Webflow Cloud app: a visitor request to the site domain is checked against the app mount path, matching paths go to the Cloud app Worker, other paths go to the Webflow site pages, and a path that exists in both goes to the Cloud app">
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">One domain, two origins: where a request goes</text>
<rect x="20" y="170" width="150" height="90" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="95" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Visitor</text>
<text x="95" y="228" text-anchor="middle" font-size="13" fill="#0B4F6C">requests a URL on</text>
<text x="95" y="246" text-anchor="middle" font-size="13" fill="#0B4F6C">the site domain</text>
<line x1="170" y1="215" x2="250" y2="215" stroke="#0B4F6C" stroke-width="2"/>
<polygon points="250,209 262,215 250,221" fill="#0B4F6C"/>
<rect x="262" y="160" width="210" height="110" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="367" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F6C">Webflow routing layer</text>
<text x="367" y="219" text-anchor="middle" font-size="13" fill="#0B4F6C">compares the path with the</text>
<text x="367" y="237" text-anchor="middle" font-size="13" fill="#0B4F6C">environment mount path</text>
<text x="367" y="255" text-anchor="middle" font-size="13" fill="#0B4F6C">(for example /planner)</text>
<line x1="472" y1="195" x2="560" y2="110" stroke="#2F7D32" stroke-width="2"/>
<polygon points="552,104 566,104 560,116" fill="#2F7D32" transform="rotate(-5 560 110)"/>
<text x="500" y="135" font-size="13" font-weight="700" fill="#2F7D32">/planner and below</text>
<line x1="472" y1="235" x2="560" y2="340" stroke="#B26A00" stroke-width="2"/>
<polygon points="552,336 566,344 552,350" fill="#B26A00"/>
<text x="500" y="320" font-size="13" font-weight="700" fill="#7A4800">any other path</text>
<rect x="566" y="60" width="314" height="110" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="723" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">Visit Planner (Cloud app)</text>
<text x="723" y="116" text-anchor="middle" font-size="13" fill="#1B5E20">Worker running the Next.js build</text>
<text x="723" y="134" text-anchor="middle" font-size="13" fill="#1B5E20">static assets with the mount path prefix</text>
<text x="723" y="152" text-anchor="middle" font-size="13" fill="#1B5E20">SQLite, key-value and object bindings</text>
<rect x="566" y="300" width="314" height="110" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="723" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4800">Fernbrook Gardens site</text>
<text x="723" y="356" text-anchor="middle" font-size="13" fill="#7A4800">Home, Visit, Plants, Events, Journal</text>
<text x="723" y="374" text-anchor="middle" font-size="13" fill="#7A4800">published pages and CMS template pages</text>
<text x="723" y="392" text-anchor="middle" font-size="13" fill="#7A4800">hosted by Webflow</text>
<text x="450" y="445" text-anchor="middle" font-size="14" fill="#0B4F6C">If a Webflow page and a Cloud app route share a path, the Cloud app route wins.</text>
</svg>
