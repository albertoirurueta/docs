<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Upgrade path from Drupal 10 to Drupal 11</title>
  <desc id="d">Sites on 10.2 or earlier first move to 10.3 or later. A site on 10.3 to 10.5 can go straight to any 11.x. A site on 10.6 must go to 11.3 or later. Drupal 12 later requires 11.3 or later as the start point.</desc>
  <rect width="760" height="330" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1b1b1b; }
    .box { fill: #eef3fb; stroke: #2c4a7c; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e6b34; stroke-width: 1.5; }
    .warn { fill: #fff4e0; stroke: #9a5b00; stroke-width: 1.5; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#a); }
    .small { font-size: 12px; }
    .h { font-size: 14px; font-weight: bold; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="20" y="28" class="h">Where your site starts decides the first hop</text>

  <rect class="warn" x="20" y="50" width="170" height="64" rx="8"/>
  <text x="105" y="76" text-anchor="middle" class="h">10.2 or earlier</text>
  <text x="105" y="96" text-anchor="middle" class="small">core update first</text>

  <rect class="box" x="20" y="150" width="170" height="64" rx="8"/>
  <text x="105" y="176" text-anchor="middle" class="h">10.3 to 10.5</text>
  <text x="105" y="196" text-anchor="middle" class="small">minimum for 11.0 and later</text>

  <rect class="box" x="20" y="250" width="170" height="64" rx="8"/>
  <text x="105" y="276" text-anchor="middle" class="h">10.6 (last 10.x minor)</text>
  <text x="105" y="296" text-anchor="middle" class="small">security support to 2026-12-09</text>

  <rect class="ok" x="300" y="150" width="190" height="64" rx="8"/>
  <text x="395" y="176" text-anchor="middle" class="h">Any supported 11.x</text>
  <text x="395" y="196" text-anchor="middle" class="small">11.4 is the current minor</text>

  <rect class="ok" x="300" y="250" width="190" height="64" rx="8"/>
  <text x="395" y="276" text-anchor="middle" class="h">11.3 or later</text>
  <text x="395" y="296" text-anchor="middle" class="small">required from 10.6</text>

  <rect class="box" x="570" y="150" width="170" height="64" rx="8"/>
  <text x="655" y="176" text-anchor="middle" class="h">Drupal 12 (scheduled)</text>
  <text x="655" y="196" text-anchor="middle" class="small">start from 11.3 or later</text>

  <path class="arrow" d="M105,114 L105,148"/>
  <text x="115" y="136" class="small">update to 10.3+</text>
  <path class="arrow" d="M190,182 L298,182"/>
  <path class="arrow" d="M190,282 L298,282"/>
  <path class="arrow" d="M490,182 L568,182"/>
  <path class="arrow" d="M490,282 C530,282 530,230 600,216"/>
</svg>
