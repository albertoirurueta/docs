<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-getting-started-animation-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One frame of setAnimationLoop</text>
<rect x="20" y="60" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="84.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Display refresh</text>
<text x="95.0" y="99.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">about every 16.7 ms</text>
<rect x="210" y="60" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="84.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Browser calls</text>
<text x="285.0" y="99.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">your callback(time)</text>
<rect x="400" y="60" width="160" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="480.0" y="77.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">update state</text>
<text x="480.0" y="92.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">timer.update, rotate,</text>
<text x="480.0" y="107.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">resize check</text>
<rect x="600" y="60" width="140" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="670.0" y="84.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">renderer.render</text>
<text x="670.0" y="99.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">scene, camera</text>
<line x1="170" y1="88" x2="210" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-animation-loop)"/>
<line x1="360" y1="88" x2="400" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-animation-loop)"/>
<line x1="560" y1="88" x2="600" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-animation-loop)"/>
<line x1="670" y1="116" x2="670" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-animation-loop)"/>
<rect x="560" y="172" width="180" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="193.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">GPU draws the</text>
<text x="650.0" y="208.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">frame into the canvas</text>
<line x1="560" y1="197" x2="170" y2="197" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-webgl-threejs-getting-started-animation-loop)"/>
<rect x="20" y="172" width="150" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="193.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Next refresh</text>
<text x="95.0" y="208.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">the loop repeats</text>
<text x="380" y="260" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setAnimationLoop(null) stops the loop. It also drives WebXR sessions, where requestAnimationFrame is not used.</text>
<text x="380" y="278" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Heavy work inside the callback delays the next frame; keep per-frame code light.</text>
<text x="380" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pass the callback once; calling render outside the loop is fine for static scenes.</text>
</svg>
