<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Anatomy of an ACL SETUSER rule</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Each token narrows what the user can do: status, credentials, keys, channels, and commands</text>

  <!-- command line -->
  <rect x="30" y="66" width="700" height="52" fill="#f4f4f4" stroke="#dddddd" stroke-width="1"/>
  <text x="380" y="87" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">ACL SETUSER bookshop-app on &gt;strong-pass</text>
  <text x="380" y="106" font-size="13" fill="#222222" text-anchor="middle" font-family="Menlo, Consolas, monospace">~bookshop:* &amp;bookshop-events:* +@read +@search -@dangerous</text>

  <!-- token groups with callouts -->
  <!-- on -->
  <rect x="30" y="130" width="90" height="40" fill="#eef4fb" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="75" y="154" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">on</text>
  <line x1="60" y1="118" x2="75" y2="130" stroke="#1c4b73" stroke-width="1"/>
  <text x="75" y="188" font-size="10.5" fill="#444444" text-anchor="middle">Status: user</text>
  <text x="75" y="200" font-size="10.5" fill="#444444" text-anchor="middle">can authenticate</text>

  <!-- password -->
  <rect x="140" y="130" width="120" height="40" fill="#f8f0e6" stroke="#7a3b12" stroke-width="1.2"/>
  <text x="200" y="154" font-size="12" font-weight="bold" fill="#7a3b12" text-anchor="middle">&gt;strong-pass</text>
  <line x1="200" y1="118" x2="200" y2="130" stroke="#7a3b12" stroke-width="1"/>
  <text x="200" y="188" font-size="10.5" fill="#444444" text-anchor="middle">Password: added to</text>
  <text x="200" y="200" font-size="10.5" fill="#444444" text-anchor="middle">the valid password list</text>

  <!-- key pattern -->
  <rect x="280" y="130" width="130" height="40" fill="#eaf3ea" stroke="#2f5424" stroke-width="1.2"/>
  <text x="345" y="154" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">~bookshop:*</text>
  <line x1="330" y1="118" x2="345" y2="130" stroke="#2f5424" stroke-width="1"/>
  <text x="345" y="188" font-size="10.5" fill="#444444" text-anchor="middle">Key pattern: only</text>
  <text x="345" y="200" font-size="10.5" fill="#444444" text-anchor="middle">keys matching this glob</text>

  <!-- channel pattern -->
  <rect x="430" y="130" width="150" height="40" fill="#f3ecf7" stroke="#5b3a7a" stroke-width="1.2"/>
  <text x="505" y="154" font-size="12" font-weight="bold" fill="#5b3a7a" text-anchor="middle">&amp;bookshop-events:*</text>
  <line x1="470" y1="118" x2="505" y2="130" stroke="#5b3a7a" stroke-width="1"/>
  <text x="505" y="188" font-size="10.5" fill="#444444" text-anchor="middle">Channel pattern: Pub/Sub</text>
  <text x="505" y="200" font-size="10.5" fill="#444444" text-anchor="middle">channels this user may use</text>

  <!-- command rules -->
  <rect x="600" y="130" width="130" height="60" fill="#fbeaea" stroke="#8a2b2b" stroke-width="1.2"/>
  <text x="665" y="150" font-size="12" font-weight="bold" fill="#8a2b2b" text-anchor="middle">+@read +@search</text>
  <text x="665" y="166" font-size="12" font-weight="bold" fill="#8a2b2b" text-anchor="middle">-@dangerous</text>
  <line x1="640" y1="118" x2="665" y2="130" stroke="#8a2b2b" stroke-width="1"/>
  <text x="665" y="208" font-size="10.5" fill="#444444" text-anchor="middle">Command rules: +@category /</text>
  <text x="665" y="220" font-size="10.5" fill="#444444" text-anchor="middle">-command allow or deny access</text>

  <!-- legend box: rule reference -->
  <rect x="30" y="250" width="700" height="200" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="50" y="274" font-size="12.5" font-weight="bold" fill="#333333">Rule reference</text>

  <text x="50" y="298" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">on / off</text>
  <text x="220" y="298" font-size="11.5" fill="#444444">enable or disable authentication for this user</text>

  <text x="50" y="320" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">&gt;password / &lt;password</text>
  <text x="220" y="320" font-size="11.5" fill="#444444">add or remove a valid password (nopass accepts none)</text>

  <text x="50" y="342" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">~pattern</text>
  <text x="220" y="342" font-size="11.5" fill="#444444">glob key pattern this user may reference as a command argument</text>

  <text x="50" y="364" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">&amp;pattern</text>
  <text x="220" y="364" font-size="11.5" fill="#444444">glob Pub/Sub channel pattern this user may publish or subscribe to</text>

  <text x="50" y="386" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">+command / -command</text>
  <text x="220" y="386" font-size="11.5" fill="#444444">allow or deny one command (supports command|subcommand)</text>

  <text x="50" y="408" font-size="11.5" fill="#222222" font-family="Menlo, Consolas, monospace">+@category / -@category</text>
  <text x="220" y="408" font-size="11.5" fill="#444444">allow or deny every command in a category, e.g. @search, @json, @dangerous</text>

  <text x="50" y="430" font-size="11.5" fill="#444444">Rules apply left to right; a later rule can narrow or widen what an earlier rule granted.</text>
</svg>
