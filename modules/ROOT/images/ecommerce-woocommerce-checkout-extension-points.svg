<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How PHP and JavaScript talk to each other in a Cart and Checkout extension</title>
  <desc id="d">Two columns, PHP on the left and JavaScript on the right, with arrows between them. IntegrationInterface get_script_data sends static data that the script reads with getSetting and the integration name plus _data. register_endpoint_data on the cart endpoint adds data to every cart response, which the script receives as the extensions prop of filters and Slot Fill components. setExtensionData in an inner block sends values with the POST checkout request, where a PHP action reads request extensions. extensionCartUpdate posts to cart extensions, which runs the callback registered with register_update_callback, and the recalculated cart comes back. WordPress hooks on the Store API requests can add validation errors in the other direction.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">Two languages, four data paths</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Each arrow is one way data travels between the PHP of your plugin and the JavaScript that runs in the blocks</text>
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#f4b860">PHP (plugin)</text>
  <text x="600" y="92" font-size="13" font-weight="bold" fill="#9fd3c7">JavaScript (blocks)</text>
  <rect x="40" y="108" width="400" height="62" rx="6" fill="#3d5266"/>
  <text x="240.0" y="135.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">IntegrationInterface::get_script_data()</text>
  <text x="240.0" y="152.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">static, serialisable, per page load</text>
  <rect x="520" y="108" width="400" height="62" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="720.0" y="135.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">getSetting( "pocket-coffee-blocks_data" )</text>
  <text x="720.0" y="152.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">script handles come from get_script_handles()</text>
  <path d="M442 139.0 L518 139.0" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="188" width="400" height="62" rx="6" fill="#3d5266"/>
  <text x="240.0" y="215.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce_store_api_register_endpoint_data()</text>
  <text x="240.0" y="232.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">endpoint 'cart': data_callback + schema</text>
  <rect x="520" y="188" width="400" height="62" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="720.0" y="215.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">extensions["pocket-coffee-blocks"]</text>
  <text x="720.0" y="232.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">prop of filters and Slot Fill components</text>
  <path d="M442 219.0 L518 219.0" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="268" width="400" height="70" rx="6" fill="#3d5266"/>
  <text x="240.0" y="290.5" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Action on the checkout request</text>
  <text x="240.0" y="307.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">woocommerce_store_api_checkout_update_order_from_request</text>
  <text x="240.0" y="324.5" font-size="11.5" fill="#f2f5f8" text-anchor="middle">reads $request["extensions"]</text>
  <rect x="520" y="268" width="400" height="70" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="720.0" y="299.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">setExtensionData( namespace, key, value )</text>
  <text x="720.0" y="316.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">sent with POST /checkout in "extensions"</text>
  <path d="M518 303.0 L442 303.0" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="40" y="356" width="400" height="62" rx="6" fill="#3d5266"/>
  <text x="240.0" y="383.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce_store_api_register_update_callback()</text>
  <text x="240.0" y="400.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">runs on POST /cart/extensions; totals are recalculated</text>
  <rect x="520" y="356" width="400" height="62" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="720.0" y="383.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">extensionCartUpdate( { namespace, data } )</text>
  <text x="720.0" y="400.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">the new cart comes back and the block re-renders</text>
  <path d="M518 387.0 L442 387.0" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="40" y="436" width="400" height="62" rx="6" fill="#3d5266"/>
  <text x="240.0" y="463.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">woocommerce_store_api_cart_errors, RouteException</text>
  <text x="240.0" y="480.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">errors shown in the Cart and Checkout notices</text>
  <rect x="520" y="436" width="400" height="62" rx="6" fill="#3d5266" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="720.0" y="463.0" font-size="11.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">wc/store/validation, onCheckoutValidation</text>
  <text x="720.0" y="480.0" font-size="11.5" fill="#f2f5f8" text-anchor="middle">block the Place order button before the request</text>
  <path d="M442 461.0 L518 461.0" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M518 473.0 L442 473.0" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="40" y="518" width="880" height="70" rx="6" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="542" font-size="12.5" fill="#f2f5f8">Rule of thumb: the server is the source of truth for the cart, the customer and the order.</text>
  <text x="56" y="562" font-size="12.5" fill="#f2f5f8">Ephemeral interface state stays in the browser; everything that must survive a reload or end up on the order goes through one of these paths.</text>
</svg>
