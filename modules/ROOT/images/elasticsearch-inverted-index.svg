<svg viewBox="0 0 760 486" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="486" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The inverted index: terms point back to the documents that contain them</text>
  <text x="380" y="46" font-size="12" fill="#666666" text-anchor="middle">Each document is analyzed once into terms; every term keeps a sorted list of matching document ids (a postings list)</text>

  <!-- three source documents -->
  <g font-family="'Courier New', monospace">
    <rect x="30" y="64" width="220" height="96" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="44" y="84" font-size="11" fill="#666666" font-family="Helvetica, Arial, sans-serif">doc _id: 1</text>
    <text x="44" y="106" font-size="11.5" fill="#222222">"The quick brown fox"</text>
    <text x="44" y="132" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">analyzed &#8594;</text>
    <text x="44" y="150" font-size="11" fill="#1c4b73">[the, quick, brown, fox]</text>
  </g>
  <g font-family="'Courier New', monospace">
    <rect x="270" y="64" width="220" height="96" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="284" y="84" font-size="11" fill="#666666" font-family="Helvetica, Arial, sans-serif">doc _id: 2</text>
    <text x="284" y="106" font-size="11.5" fill="#222222">"Quick brown dogs"</text>
    <text x="284" y="132" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">analyzed &#8594;</text>
    <text x="284" y="150" font-size="11" fill="#1c4b73">[quick, brown, dogs]</text>
  </g>
  <g font-family="'Courier New', monospace">
    <rect x="510" y="64" width="220" height="96" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
    <text x="524" y="84" font-size="11" fill="#666666" font-family="Helvetica, Arial, sans-serif">doc _id: 3</text>
    <text x="524" y="106" font-size="11.5" fill="#222222">"The lazy fox"</text>
    <text x="524" y="132" font-size="10.5" fill="#666666" font-family="Helvetica, Arial, sans-serif">analyzed &#8594;</text>
    <text x="524" y="150" font-size="11" fill="#1c4b73">[the, lazy, fox]</text>
  </g>

  <!-- analyzer bar -->
  <g stroke="#999999" stroke-width="1.4" fill="none">
    <path d="M140,160 V184"/>
    <path d="M380,160 V184"/>
    <path d="M620,160 V184"/>
  </g>
  <polygon points="136,182 144,182 140,190" fill="#999999"/>
  <polygon points="376,182 384,182 380,190" fill="#999999"/>
  <polygon points="616,182 624,182 620,190" fill="#999999"/>

  <rect x="30" y="192" width="700" height="30" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="380" y="212" font-size="11.5" fill="#1c4b73" text-anchor="middle">standard analyzer &#8226; lowercase &#8594; tokenize &#8594; (optional) stop / stem</text>

  <line x1="380" y1="222" x2="380" y2="246" stroke="#999999" stroke-width="1.4"/>
  <polygon points="376,244 384,244 380,252" fill="#999999"/>

  <!-- inverted index -->
  <rect x="30" y="254" width="700" height="196" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="44" y="274" font-size="12" font-weight="bold" fill="#222222">Inverted index (per Lucene segment)</text>

  <text x="60" y="298" font-size="11" fill="#666666" font-family="'Courier New', monospace">term</text>
  <text x="260" y="298" font-size="11" fill="#666666" font-family="'Courier New', monospace">postings list &#8212; sorted doc ids</text>
  <line x1="44" y1="304" x2="716" y2="304" stroke="#cccccc" stroke-width="1"/>

  <g font-family="'Courier New', monospace" font-size="12" fill="#222222">
    <text x="60" y="324">brown</text><text x="260" y="324" fill="#2f5424">1 &#8594; 2</text>
    <text x="60" y="346">dogs</text><text x="260" y="346" fill="#2f5424">2</text>
    <text x="60" y="368">fox</text><text x="260" y="368" fill="#2f5424">1 &#8594; 3</text>
    <text x="60" y="390">lazy</text><text x="260" y="390" fill="#2f5424">3</text>
    <text x="60" y="412">quick</text><text x="260" y="412" fill="#2f5424">1 &#8594; 2</text>
    <text x="60" y="434">the</text><text x="260" y="434" fill="#2f5424">1 &#8594; 3</text>
  </g>

  <line x1="220" y1="308" x2="220" y2="442" stroke="#cccccc" stroke-width="1"/>

  <text x="380" y="472" font-size="10.5" fill="#444444" text-anchor="middle">Query "fox": look up one term, read its postings list &#8594; docs 1 and 3. No document is opened to test a substring.</text>
</svg>
