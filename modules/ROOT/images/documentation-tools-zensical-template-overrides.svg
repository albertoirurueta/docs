<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Zensical template override resolution</title>
  <desc id="d">A template request is looked up first in the custom_dir overrides folder and then in the built-in theme templates; blocks of base.html can be redefined from main.html.</desc>
  <rect width="720" height="300" rx="12" fill="#37474f"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Template lookup in a Zensical build</text>
  <rect x="30" y="60" width="150" height="60" rx="8" fill="#5c6bc0" stroke="#ffffff"/>
  <text x="105" y="86" text-anchor="middle" font-size="13" fill="#ffffff">Page to render</text>
  <text x="105" y="104" text-anchor="middle" font-size="11" fill="#ffffff">main.html or template: x</text>
  <rect x="250" y="50" width="200" height="80" rx="8" fill="#ffb300" stroke="#ffffff"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">1. custom_dir (overrides/)</text>
  <text x="350" y="98" text-anchor="middle" font-size="11" fill="#000000">main.html, 404.html,</text>
  <text x="350" y="114" text-anchor="middle" font-size="11" fill="#000000">partials/footer.html ...</text>
  <rect x="250" y="170" width="200" height="80" rx="8" fill="#26a69a" stroke="#ffffff"/>
  <text x="350" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">2. Built-in theme</text>
  <text x="350" y="218" text-anchor="middle" font-size="11" fill="#000000">base.html, main.html, 404.html,</text>
  <text x="350" y="234" text-anchor="middle" font-size="11" fill="#000000">partials/*.html</text>
  <rect x="520" y="60" width="170" height="60" rx="8" fill="#5c6bc0" stroke="#ffffff"/>
  <text x="605" y="86" text-anchor="middle" font-size="13" fill="#ffffff">MiniJinja render</text>
  <text x="605" y="104" text-anchor="middle" font-size="11" fill="#ffffff">no Python calls</text>
  <rect x="520" y="180" width="170" height="60" rx="8" fill="#78909c" stroke="#ffffff"/>
  <text x="605" y="206" text-anchor="middle" font-size="13" fill="#000000">HTML in site_dir</text>
  <text x="605" y="224" text-anchor="middle" font-size="11" fill="#000000">site/index.html</text>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M180 90 H250"/><path d="M450 90 H520"/><path d="M605 120 V180"/>
    <path d="M105 120 V210 H250" stroke-dasharray="6 4"/>
  </g>
  <text x="130" y="232" font-size="11" fill="#ffffff">not found in overrides</text>
  <text x="130" y="248" font-size="11" fill="#ffffff">falls back to the theme</text>
</svg>
