<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From one animated frame to many outputs</text>
<rect x="30" y="120" width="170" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="115" y="165" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Top-level frame</text><text x="115" y="185" font-size="12" fill="#374151" text-anchor="middle">with animated layers</text>
<line x1="200" y1="170" x2="258" y2="170" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="262" y="120" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="337" y="150" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Export, Animated</text><text x="337" y="170" font-size="12" fill="#374151" text-anchor="middle">size, frame rate,</text><text x="337" y="187" font-size="12" fill="#374151" text-anchor="middle">quality, loop</text>
