<line x1="412" y1="170" x2="468" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="472" y="184" width="258" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="486" y="205" font-size="13" font-weight="bold" fill="#1F2937">Lottie</text><text x="486" y="223" font-size="12" fill="#374151">Lottie (JSON), dotLottie</text>
