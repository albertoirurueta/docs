<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sga-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="sga-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="sga-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="sga-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From a mesh primitive to bytes: accessor, bufferView, buffer</text>
<rect x="20" y="55" width="200" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="28" y="76" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">meshes[1].primitives[0]</text>
<text x="28" y="92" text-anchor="start" font-size="12" fill="#374151">"POSITION": 24</text>
<text x="28" y="108" text-anchor="start" font-size="12" fill="#374151">"NORMAL": 25</text>
<text x="28" y="124" text-anchor="start" font-size="12" fill="#374151">"TEXCOORD_0": 26</text>
<text x="28" y="140" text-anchor="start" font-size="12" fill="#374151">"indices": 27, "material": 1</text>
<rect x="270" y="55" width="215" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="278" y="77.5" text-anchor="start" font-size="11" fill="#3730A3" font-weight="bold">accessors[24]</text>
<text x="278" y="92.5" text-anchor="start" font-size="11" fill="#374151">"bufferView": 24</text>
<text x="278" y="107.5" text-anchor="start" font-size="11" fill="#374151">"componentType": 5126 (FLOAT)</text>
<text x="278" y="122.5" text-anchor="start" font-size="11" fill="#374151">"count": 8, "type": "VEC3"</text>
<text x="278" y="137.5" text-anchor="start" font-size="11" fill="#374151">"min": [-0.02, 0, -0.08]</text>
<rect x="535" y="55" width="205" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="543" y="76" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">bufferViews[24]</text>
<text x="543" y="92" text-anchor="start" font-size="12" fill="#374151">"buffer": 0</text>
<text x="543" y="108" text-anchor="start" font-size="12" fill="#374151">"byteOffset": 5040</text>
<text x="543" y="124" text-anchor="start" font-size="12" fill="#374151">"byteLength": 96</text>
<text x="543" y="140" text-anchor="start" font-size="12" fill="#374151">"target": 34962</text>
<line x1="220" y1="105" x2="270" y2="105" stroke="#4F46E5" stroke-width="2" marker-end="url(#sga-ai)"/>
<line x1="485" y1="105" x2="535" y2="105" stroke="#B45309" stroke-width="2" marker-end="url(#sga-aa)"/>
<text x="245" y="98" text-anchor="middle" font-size="11" fill="#4B5563">index</text>
<text x="510" y="98" text-anchor="middle" font-size="11" fill="#4B5563">index</text>
<rect x="20" y="190" width="720" height="66" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="380" y="212" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">BIN chunk bytes 5040 .. 5135 hold the 8 vertices of the cover</text>
<rect x="60" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="98" y="240" text-anchor="middle" font-size="11" fill="#374151">v0: 3 floats</text>
<rect x="140" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="178" y="240" text-anchor="middle" font-size="11" fill="#374151">v1: 3 floats</text>
<rect x="220" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="258" y="240" text-anchor="middle" font-size="11" fill="#374151">v2: 3 floats</text>
<rect x="300" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="338" y="240" text-anchor="middle" font-size="11" fill="#374151">v3: 3 floats</text>
<rect x="380" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="418" y="240" text-anchor="middle" font-size="11" fill="#374151">v4: 3 floats</text>
<rect x="460" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="498" y="240" text-anchor="middle" font-size="11" fill="#374151">v5: 3 floats</text>
<rect x="540" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="578" y="240" text-anchor="middle" font-size="11" fill="#374151">v6: 3 floats</text>
<rect x="620" y="224" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="658" y="240" text-anchor="middle" font-size="11" fill="#374151">v7: 3 floats</text>
<text x="380" y="290" text-anchor="middle" font-size="12" fill="#1F2937">byte address of component c of vertex i = bufferView.byteOffset + accessor.byteOffset + i x stride + 4 x c</text>
<text x="380" y="310" text-anchor="middle" font-size="12" fill="#374151">Tightly packed VEC3 float: stride = 3 x 4 = 12 bytes, so 8 vertices occupy 8 x 12 = 96 bytes (byteLength).</text>
<text x="380" y="330" text-anchor="middle" font-size="12" fill="#374151">min and max on POSITION are required: they let a loader compute bounds without reading the vertices.</text>
</svg>
