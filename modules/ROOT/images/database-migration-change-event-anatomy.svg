<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">Anatomy of a Debezium change event (Oracle, BOOKSHOP.BOOK update)</text>

  <!-- Kafka record frame -->
  <rect x="16" y="44" width="372" height="526" rx="8" fill="#f5f7f8" stroke="#90a4ae"/>
  <text x="28" y="64" font-size="13" font-weight="bold" fill="#37474f">Kafka record on topic legacy.BOOKSHOP.BOOK</text>

  <!-- Key -->
  <rect x="28" y="76" width="348" height="58" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="40" y="98" font-weight="bold" fill="#0d47a1">Key</text>
  <text x="80" y="98" font-family="Menlo, Consolas, monospace" fill="#263238">{ "BOOK_ID": "1001" }</text>
  <text x="40" y="120" font-size="12" fill="#455a64">schema legacy.BOOKSHOP.BOOK.Key</text>

  <!-- Value envelope -->
  <rect x="28" y="146" width="348" height="414" rx="6" fill="#ffffff" stroke="#607d8b"/>
  <text x="40" y="166" font-weight="bold" fill="#37474f">Value (legacy.BOOKSHOP.BOOK.Envelope)</text>

  <rect x="40" y="176" width="324" height="50" rx="5" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="50" y="196" font-weight="bold" fill="#e65100">before</text>
  <text x="50" y="216" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">PRICE "24.99", LAST_UPD 10:15:42, ...</text>

  <rect x="40" y="234" width="324" height="50" rx="5" fill="#e8f5e9" stroke="#43a047"/>
  <text x="50" y="254" font-weight="bold" fill="#1b5e20">after</text>
  <text x="50" y="274" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">PRICE "22.50", LAST_UPD 10:42:07, ...</text>

  <rect x="40" y="292" width="324" height="116" rx="5" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="50" y="312" font-weight="bold" fill="#311b92">source</text>
  <text x="50" y="332" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">connector oracle, name legacy</text>
  <text x="50" y="350" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">db FREEPDB1, schema BOOKSHOP,</text>
  <text x="50" y="368" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">table BOOK, snapshot "false"</text>
  <text x="50" y="386" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">scn, commit_scn, txId, user_name</text>
  <text x="50" y="402" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">ts_ms = change time in Oracle</text>

  <rect x="40" y="416" width="156" height="40" rx="5" fill="#fce4ec" stroke="#d81b60"/>
  <text x="50" y="441" font-weight="bold" fill="#880e4f">op</text>
  <text x="80" y="441" font-family="Menlo, Consolas, monospace" fill="#263238">"u"</text>

  <rect x="208" y="416" width="156" height="40" rx="5" fill="#e0f7fa" stroke="#00838f"/>
  <text x="218" y="441" font-weight="bold" fill="#006064">ts_ms / us / ns</text>

  <rect x="40" y="464" width="324" height="40" rx="5" fill="#eceff1" stroke="#78909c" stroke-dasharray="5,3"/>
  <text x="50" y="489" font-weight="bold" fill="#37474f">transaction</text>
  <text x="140" y="489" font-size="12" fill="#455a64">null unless enabled</text>

  <rect x="40" y="512" width="324" height="40" rx="5" fill="#fffde7" stroke="#f9a825"/>
  <text x="50" y="530" font-size="12" fill="#263238">Converter: JSON with or without "schema",</text>
  <text x="50" y="546" font-size="12" fill="#263238">or Avro with an id in a schema registry</text>

  <!-- Annotations -->
  <g font-size="12" fill="#263238">
    <rect x="410" y="76" width="294" height="58" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="420" y="96">Primary key columns (or message.key.columns).</text>
    <text x="420" y="112">Chooses the partition, so all changes to one</text>
    <text x="420" y="128">row stay in order.</text>
    <line x1="378" y1="104" x2="408" y2="104" stroke="#546e7a" marker-end="url(#dot)"/>

    <rect x="410" y="176" width="294" height="108" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="420" y="196">Row state before and after the commit.</text>
    <text x="420" y="212">c and r: before is null. d: after is null.</text>
    <text x="420" y="228">Oracle fills before with all columns only</text>
    <text x="420" y="244">with supplemental logging (ALL) COLUMNS.</text>
    <text x="420" y="260">Unchanged LOBs carry the placeholder</text>
    <text x="420" y="276" font-family="Menlo, Consolas, monospace">__debezium_unavailable_value</text>
    <line x1="364" y1="230" x2="408" y2="230" stroke="#546e7a" marker-end="url(#dot)"/>

    <rect x="410" y="292" width="294" height="116" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="420" y="312">Where the change came from. The fields</text>
    <text x="420" y="328">differ per connector: Oracle has SCNs,</text>
    <text x="420" y="344">PostgreSQL has lsn and txId, MySQL has</text>
    <text x="420" y="360">file, pos and gtid. Use them for tracing,</text>
    <text x="420" y="376">idempotency keys and reconciliation.</text>
    <text x="420" y="396" font-weight="bold">Lag = ts_ms - source.ts_ms</text>
    <line x1="364" y1="350" x2="408" y2="350" stroke="#546e7a" marker-end="url(#dot)"/>

    <rect x="410" y="416" width="294" height="88" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="420" y="436">op: c create, u update, d delete,</text>
    <text x="420" y="452">r snapshot read, t truncate, m message.</text>
    <text x="420" y="468">ts_ms: when Debezium processed the event.</text>
    <text x="420" y="484">transaction: id, total_order and</text>
    <text x="420" y="500">data_collection_order.</text>
    <line x1="364" y1="436" x2="408" y2="436" stroke="#546e7a" marker-end="url(#dot)"/>
  </g>

  <!-- Delete and tombstone -->
  <text x="16" y="600" font-size="14" font-weight="bold" fill="#263238">A delete produces two records with the same key</text>
  <rect x="16" y="612" width="330" height="72" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="28" y="634" font-weight="bold" fill="#b71c1c">1. Delete event</text>
  <text x="28" y="654" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">key {BOOK_ID: "1002"}</text>
  <text x="28" y="672" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">op "d", before {...}, after null</text>

  <rect x="374" y="612" width="330" height="72" rx="6" fill="#eceff1" stroke="#455a64"/>
  <text x="386" y="634" font-weight="bold" fill="#263238">2. Tombstone (tombstones.on.delete)</text>
  <text x="386" y="654" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">key {BOOK_ID: "1002"}, value null</text>
  <text x="386" y="672" font-size="12" fill="#455a64">Lets log compaction drop the key</text>
  <line x1="346" y1="648" x2="372" y2="648" stroke="#546e7a" stroke-width="1.5" marker-end="url(#dot)"/>
</svg>
