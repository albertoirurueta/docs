<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-qcb-state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Lifecycle of a command buffer</text>
<rect x="30" y="60" width="130" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="94.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Initial</text>
<rect x="220" y="60" width="130" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="285.0" y="94.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Recording</text>
<rect x="410" y="60" width="130" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="475.0" y="94.5" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Executable</text>
<rect x="600" y="60" width="130" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="665.0" y="94.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Pending</text>
<line x1="160" y1="90" x2="218" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-state)"/>
<text x="189" y="82" text-anchor="middle" font-size="10" fill="#374151">begin</text>
<line x1="350" y1="90" x2="408" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-state)"/>
<text x="379" y="82" text-anchor="middle" font-size="10" fill="#374151">end</text>
<line x1="540" y1="90" x2="598" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-state)"/>
<text x="569" y="82" text-anchor="middle" font-size="10" fill="#374151">submit</text>
<rect x="370" y="200" width="130" height="60" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="435.0" y="234.6" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Invalid</text>
<line x1="430" y1="120" x2="430" y2="198" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-state)"/>
<text x="440" y="165" text-anchor="start" font-size="10" fill="#374151">resource destroyed</text>
<path d="M665,120 L665,175 L580,175 L580,122" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-state)"/>
<text x="622" y="192" text-anchor="middle" font-size="10" fill="#374151">execution finished</text>
<path d="M285,120 L285,300 L95,300 L95,122" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-state)"/>
<text x="290" y="318" text-anchor="middle" font-size="10" fill="#374151">reset: pool reset, vkResetCommandBuffer or implicit reset in vkBeginCommandBuffer</text>
<text x="30" y="210" text-anchor="start" font-size="10" fill="#374151">ONE_TIME_SUBMIT: reset and record again</text>
<text x="30" y="226" text-anchor="start" font-size="10" fill="#374151">before every further submission.</text>
<text x="380" y="370" text-anchor="middle" font-size="11" fill="#374151">Executable buffers may be submitted again; Pending buffers may not be reset or freed.</text>
</svg>
