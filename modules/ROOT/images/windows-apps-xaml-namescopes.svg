<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">XAML namescopes in the Bookshelf Desktop main window</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Each box is a separate namescope: an x:Name is visible only inside the scope that registered it</text>
  <rect x="20" y="64" width="720" height="282" rx="12" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <text x="36" y="86" font-size="14" font-weight="bold" fill="#1c4b73">Window namescope (XAML root, one per loaded XAML page)</text>
  <text x="36" y="108" font-size="12" fill="#333333">x:Name: SearchBox, BooksList, StatusBar</text>
  <rect x="40" y="124" width="320" height="200" rx="10" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="56" y="146" font-size="13" font-weight="bold" fill="#2a6a2a">DataTemplate namescope (per item)</text>
  <text x="56" y="168" font-size="12" fill="#333333">x:Name: TitleText, CoverImage</text>
  <text x="56" y="192" font-size="12" fill="#333333">ElementName=TitleText works inside</text>
  <text x="56" y="210" font-size="12" fill="#333333">ElementName=SearchBox resolves outward;</text>
  <text x="56" y="228" font-size="12" fill="#333333">fails only in ContextMenu, Popup, ToolTip.</text>
  <text x="56" y="256" font-size="12" fill="#333333">Names are registered when the template</text>
  <text x="56" y="272" font-size="12" fill="#333333">is applied: use Template.FindName(name,</text>
  <text x="56" y="288" font-size="12" fill="#333333">templatedParent) from code.</text>
  <rect x="390" y="124" width="330" height="200" rx="10" fill="#fdf8ee" stroke="#a07820" stroke-width="1.5"/>
  <text x="406" y="146" font-size="13" font-weight="bold" fill="#7a5a10">ControlTemplate namescope (BookCard)</text>
  <text x="406" y="168" font-size="12" fill="#333333">x:Name: PART_Cover, PART_Badge</text>
  <text x="406" y="192" font-size="12" fill="#333333">Control code finds parts with</text>
  <text x="406" y="210" font-size="12" fill="#333333">GetTemplateChild("PART_Cover") in</text>
  <text x="406" y="228" font-size="12" fill="#333333">OnApplyTemplate.</text>
  <text x="406" y="256" font-size="12" fill="#333333">Template triggers use TargetName</text>
  <text x="406" y="272" font-size="12" fill="#333333">to reach these names; a Style Setter</text>
  <text x="406" y="288" font-size="12" fill="#333333">cannot, because a Style has no parts.</text>
</svg>
