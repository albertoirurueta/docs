<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Which Visual Basic debugging and diagnostics tool answers which question</title>
  <desc id="d">Five questions on the left, each pointing to the tools that answer it for a Visual Basic program on .NET 10: stepping and inspecting with the Visual Studio debugger, tracing with Debug and Trace, structured logging with ILogger, live numbers with Meter and dotnet-counters, stuck or crashed processes with dotnet-stack and dotnet-dump, and timing with BenchmarkDotNet.</desc>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Which tool answers which question</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">Every tool below was run against a Visual Basic program on .NET 10 except the Visual Studio debugger, which needs Windows</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  </defs>

  <text x="24" y="78" font-size="13" font-weight="bold" fill="#1c4b73">Question</text>
  <text x="372" y="78" font-size="13" font-weight="bold" fill="#1c4b73">Tool</text>
  <text x="660" y="78" font-size="13" font-weight="bold" fill="#1c4b73">What it needs from your code</text>

  <g font-size="13" fill="#222222">
    <rect x="24" y="90" width="300" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="36" y="114" font-weight="bold">Why does this line do that?</text>
    <text x="36" y="134" font-size="11">step, inspect, change values</text>
    <text x="36" y="150" font-size="11">on one machine, at one moment</text>

    <rect x="372" y="90" width="260" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="384" y="114" font-weight="bold">Visual Studio debugger</text>
    <text x="384" y="134" font-size="11">breakpoints, Immediate, Watch, Locals,</text>
    <text x="384" y="150" font-size="11">Edit and Continue; Debug and Stop</text>

    <rect x="660" y="90" width="276" height="72" fill="#f4f4f4" stroke="#888888"/>
    <text x="672" y="114" font-weight="bold">A Debug build with a PDB</text>
    <text x="672" y="134" font-size="11">Optimize off, DebugType portable;</text>
    <text x="672" y="150" font-size="11">Debugger attributes shape the views</text>

    <rect x="24" y="180" width="300" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="36" y="204" font-weight="bold">What did it do before it failed?</text>
    <text x="36" y="224" font-size="11">a trail of events, written as it runs,</text>
    <text x="36" y="240" font-size="11">readable after the fact</text>

    <rect x="372" y="180" width="260" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="384" y="204" font-weight="bold">Debug, Trace, ILogger</text>
    <text x="384" y="224" font-size="11">listeners, TraceSource, scopes,</text>
    <text x="384" y="240" font-size="11">LoggerMessage.Define delegates</text>

    <rect x="660" y="180" width="276" height="72" fill="#f4f4f4" stroke="#888888"/>
    <text x="672" y="204" font-weight="bold">Calls you wrote in advance</text>
    <text x="672" y="224" font-size="11">Debug calls vanish in Release;</text>
    <text x="672" y="240" font-size="11">Trace and ILogger calls stay</text>

    <rect x="24" y="270" width="300" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="36" y="294" font-weight="bold">How is the running app doing?</text>
    <text x="36" y="314" font-size="11">rates and totals while it serves,</text>
    <text x="36" y="330" font-size="11">without stopping it</text>

    <rect x="372" y="270" width="260" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="384" y="294" font-weight="bold">Meter, ActivitySource,</text>
    <text x="384" y="310" font-weight="bold">dotnet-counters, dotnet-trace</text>
    <text x="384" y="330" font-size="11">attach by process id</text>

    <rect x="660" y="270" width="276" height="72" fill="#f4f4f4" stroke="#888888"/>
    <text x="672" y="294" font-weight="bold">Instruments declared in code</text>
    <text x="672" y="314" font-size="11">listeners that take a Span cannot be</text>
    <text x="672" y="330" font-size="11">written in VB; use the tools above</text>

    <rect x="24" y="360" width="300" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="36" y="384" font-weight="bold">Where is it stuck or dead?</text>
    <text x="36" y="404" font-size="11">a hung process or a crash,</text>
    <text x="36" y="420" font-size="11">often on a server with no IDE</text>

    <rect x="372" y="360" width="260" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="384" y="384" font-weight="bold">dotnet-stack, dotnet-dump,</text>
    <text x="384" y="400" font-weight="bold">FirstChanceException</text>
    <text x="384" y="420" font-size="11">managed stacks, dump analysis</text>

    <rect x="660" y="360" width="276" height="72" fill="#f4f4f4" stroke="#888888"/>
    <text x="672" y="384" font-weight="bold">Symbols next to the assembly</text>
    <text x="672" y="404" font-size="11">without a PDB the stack trace has</text>
    <text x="672" y="420" font-size="11">no file names or line numbers</text>

    <rect x="24" y="450" width="300" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="36" y="474" font-weight="bold">Is this version faster?</text>
    <text x="36" y="494" font-size="11">a measurement, not a guess,</text>
    <text x="36" y="510" font-size="11">of time and allocations</text>

    <rect x="372" y="450" width="260" height="72" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="384" y="474" font-weight="bold">BenchmarkDotNet</text>
    <text x="384" y="494" font-size="11">a console project with Benchmark</text>
    <text x="384" y="510" font-size="11">methods, run with -c Release</text>

    <rect x="660" y="450" width="276" height="72" fill="#f4f4f4" stroke="#888888"/>
    <text x="672" y="474" font-weight="bold">A Release build</text>
    <text x="672" y="494" font-size="11">Debug builds give meaningless</text>
    <text x="672" y="510" font-size="11">numbers; only ratios travel</text>
  </g>

  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="324" y1="126" x2="370" y2="126"/>
    <line x1="324" y1="216" x2="370" y2="216"/>
    <line x1="324" y1="306" x2="370" y2="306"/>
    <line x1="324" y1="396" x2="370" y2="396"/>
    <line x1="324" y1="486" x2="370" y2="486"/>
    <line x1="632" y1="126" x2="658" y2="126"/>
    <line x1="632" y1="216" x2="658" y2="216"/>
    <line x1="632" y1="306" x2="658" y2="306"/>
    <line x1="632" y1="396" x2="658" y2="396"/>
    <line x1="632" y1="486" x2="658" y2="486"/>
  </g>
</svg>
