<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Where generation lives: four entry points</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where generation lives: four entry points</text>
  <circle cx="30" cy="86" r="11" fill="#4F46E5"/><text x="30" y="90" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <rect x="52" y="56" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="137" y="92" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Homepage, More</text>
  <path d="M223,86 L253,86" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="256" y="56" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="331" y="92" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Dream Lab</text>
  <text x="424" y="82" font-size="12" fill="#374151" text-anchor="start">Images from a prompt, with edits and History</text><text x="424" y="102" font-size="11" fill="#6B7280" text-anchor="start">Not inside the editor; optional reference image</text>
  <circle cx="30" cy="166" r="11" fill="#4F46E5"/><text x="30" y="170" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <rect x="52" y="136" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="137" y="172" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Editor side panel</text>
  <path d="M223,166 L253,166" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="256" y="136" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="331" y="172" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Magic Media</text>
  <text x="424" y="162" font-size="12" fill="#374151" text-anchor="start">Images, Graphics, Videos and 3D tabs</text><text x="424" y="182" font-size="11" fill="#6B7280" text-anchor="start">Or Apps, then search for Magic Media</text>
  <circle cx="30" cy="246" r="11" fill="#4F46E5"/><text x="30" y="250" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <rect x="52" y="216" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="137" y="252" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Homepage, Canva AI</text>
  <path d="M223,246 L253,246" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="256" y="216" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="331" y="252" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Video clip</text>
  <text x="424" y="242" font-size="12" fill="#374151" text-anchor="start">Text prompt to an 8 s or 6 s clip</text><text x="424" y="262" font-size="11" fill="#6B7280" text-anchor="start">Audio only in the 8 s clip; edit in the video editor</text>
  <circle cx="30" cy="326" r="11" fill="#B45309"/><text x="30" y="330" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <rect x="52" y="296" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="137" y="332" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Brand Kit, Assets</text>
  <path d="M223,326 L253,326" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="256" y="296" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="331" y="332" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Generate from photo</text>
  <text x="424" y="322" font-size="12" fill="#374151" text-anchor="start">On-brand images from a Brand Kit photo</text><text x="424" y="342" font-size="11" fill="#6B7280" text-anchor="start">Owners, admins and brand designers; up to four images</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
