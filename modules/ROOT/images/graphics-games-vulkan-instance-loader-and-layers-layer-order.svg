<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ila-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Layer order in the call chain</text>
<rect x="20" y="70" width="165" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="102.5" y="111.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">1. implicit layers</text>
<text x="102.5" y="126.0" text-anchor="middle" font-size="11" fill="#92400E">enabled automatically</text>
<text x="102.5" y="141.0" text-anchor="middle" font-size="11" fill="#92400E">disable_environment</text>
<text x="102.5" y="156.0" text-anchor="middle" font-size="11" fill="#92400E">optional enable var</text>
<line x1="185" y1="130" x2="205" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-order)"/>
<rect x="205" y="70" width="165" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="287.5" y="118.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">2. LAYERS_ENABLE</text>
<text x="287.5" y="133.5" text-anchor="middle" font-size="11" fill="#3730A3">globs of layer names</text>
<text x="287.5" y="148.5" text-anchor="middle" font-size="11" fill="#3730A3">force-enabled layers</text>
<line x1="370" y1="130" x2="390" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-order)"/>
<rect x="390" y="70" width="165" height="120" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="472.5" y="118.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">3. explicit layers</text>
<text x="472.5" y="133.5" text-anchor="middle" font-size="11" fill="#065F46">the ppEnabledLayerNames</text>
<text x="472.5" y="148.5" text-anchor="middle" font-size="11" fill="#065F46">array, in your order</text>
<line x1="555" y1="130" x2="575" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ila-order)"/>
<rect x="575" y="70" width="165" height="120" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="657.5" y="126.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">terminator</text>
<text x="657.5" y="141.0" text-anchor="middle" font-size="11" fill="#374151">loader, then ICDs</text>
<text x="380" y="225" text-anchor="middle" font-size="12" fill="#374151">The first layer in the list sees every call first; each layer calls the next one</text>
<text x="380" y="250" text-anchor="middle" font-size="12" fill="#374151">Only the first manifest found for a layer name is used</text>
<text x="380" y="275" text-anchor="middle" font-size="12" fill="#374151">VK_LOADER_LAYERS_DISABLE is checked before VK_LOADER_LAYERS_ENABLE</text>
</svg>
