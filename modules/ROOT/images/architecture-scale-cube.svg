<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The scale cube: X, Y, Z axes of scaling, applied to Bookshop</text>

  <defs>
    <marker id="cube-arrow-x" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c4b73"/>
    </marker>
    <marker id="cube-arrow-y" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d6a34"/>
    </marker>
    <marker id="cube-arrow-z" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a3b8f"/>
    </marker>
  </defs>

  <!-- axes, all emanating from the origin -->
  <line x1="150" y1="380" x2="640" y2="380" stroke="#1c4b73" stroke-width="2.2" marker-end="url(#cube-arrow-x)"/>
  <line x1="150" y1="380" x2="150" y2="78" stroke="#2d6a34" stroke-width="2.2" marker-end="url(#cube-arrow-y)"/>
  <line x1="150" y1="380" x2="455" y2="168" stroke="#7a3b8f" stroke-width="2.2" marker-end="url(#cube-arrow-z)"/>

  <text x="600" y="400" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">X -- Cloning</text>
  <text x="150" y="65" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Y -- Functional decomposition</text>
  <text x="500" y="150" font-size="13" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Z -- Data partitioning</text>

  <!-- origin: today's Bookshop monolith -->
  <rect x="60" y="392" width="180" height="56" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="150" y="414" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Order (single instance)</text>
  <text x="150" y="430" font-size="9.5" fill="#666666" text-anchor="middle">starting point, no scaling yet</text>

  <!-- X end: cloning -->
  <rect x="480" y="230" width="230" height="62" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="595" y="252" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">3x Order instances</text>
  <text x="595" y="268" font-size="9.5" fill="#666666" text-anchor="middle">identical, behind a load balancer,</text>
  <text x="595" y="281" font-size="9.5" fill="#666666" text-anchor="middle">no code change</text>
  <line x1="595" y1="292" x2="620" y2="376" stroke="#1c4b73" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Y end: functional decomposition -->
  <rect x="35" y="90" width="230" height="62" rx="6" fill="#eef7ef" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="150" y="112" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Catalogue split out</text>
  <text x="150" y="128" font-size="9.5" fill="#666666" text-anchor="middle">bookshop-catalogue becomes its</text>
  <text x="150" y="141" font-size="9.5" fill="#666666" text-anchor="middle">own service, own database</text>

  <!-- Z end: partitioning -->
  <rect x="545" y="40" width="230" height="62" rx="6" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.8"/>
  <text x="660" y="62" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Order data sharded</text>
  <text x="660" y="78" font-size="9.5" fill="#666666" text-anchor="middle">partitioned by customer region,</text>
  <text x="660" y="91" font-size="9.5" fill="#666666" text-anchor="middle">each shard on its own database</text>
  <line x1="545" y1="80" x2="470" y2="160" stroke="#7a3b8f" stroke-width="1.4" stroke-dasharray="4,3"/>

  <text x="390" y="448" font-size="10.5" fill="#444444" text-anchor="middle">X clones a deployable, Y splits it by function into separate services (Order vs. Catalogue), Z</text>
  <text x="390" y="463" font-size="10.5" fill="#444444" text-anchor="middle">partitions one service's own data -- real systems combine more than one axis at once.</text>
</svg>
