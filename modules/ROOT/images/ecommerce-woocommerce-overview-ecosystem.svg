<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
<title id="t">The WooCommerce ecosystem</title>
<desc id="d">WooCommerce core, developed in the public woocommerce repository on GitHub and distributed from WordPress.org, sits in the middle. Around it are the WordPress.org plugin and theme directories, the Woo Marketplace on woocommerce.com with the QIT quality tests, WooPayments as the official payments extension, the developer documentation and blog, merchant documentation, and the HackerOne programme for vulnerability reports.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold">Who provides what around WooCommerce core</text>
<rect x="320" y="200" width="260" height="120" rx="14" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="2.2"></rect>
<text x="450" y="232" text-anchor="middle" font-size="16" font-weight="bold">WooCommerce core</text>
<text x="450" y="254" text-anchor="middle" font-size="12">plugin by Automattic, GPLv3</text>
<text x="450" y="274" text-anchor="middle" font-size="11.5">source: github.com/woocommerce/woocommerce</text>
<text x="450" y="294" text-anchor="middle" font-size="11.5">zip: WordPress.org plugin directory</text>
<rect x="30" y="60" width="260" height="100" rx="12" fill="#3498db" fill-opacity="0.16" stroke="#3498db" stroke-width="1.6"></rect>
<text x="160.0" y="86" text-anchor="middle" font-size="14" font-weight="bold">WordPress.org</text>
<text x="160.0" y="108" text-anchor="middle" font-size="12">plugin directory (10,039 plugins tagged</text>
<text x="160.0" y="126" text-anchor="middle" font-size="12">woocommerce) and theme directory</text>
<text x="160.0" y="144" text-anchor="middle" font-size="12">free, reviewed, installs from wp-admin</text>
<rect x="610" y="60" width="260" height="100" rx="12" fill="#9b59b6" fill-opacity="0.16" stroke="#9b59b6" stroke-width="1.6"></rect>
<text x="740.0" y="86" text-anchor="middle" font-size="14" font-weight="bold">Woo Marketplace</text>
<text x="740.0" y="108" text-anchor="middle" font-size="12">woocommerce.com extensions and themes</text>
<text x="740.0" y="126" text-anchor="middle" font-size="12">QIT tests, L-1 support policy</text>
<text x="740.0" y="144" text-anchor="middle" font-size="12">paid and free, vendor reviewed</text>
<rect x="30" y="360" width="260" height="100" rx="12" fill="#e67e22" fill-opacity="0.16" stroke="#e67e22" stroke-width="1.6"></rect>
<text x="160.0" y="386" text-anchor="middle" font-size="14" font-weight="bold">WooPayments</text>
<text x="160.0" y="408" text-anchor="middle" font-size="12">official payments extension</text>
<text x="160.0" y="426" text-anchor="middle" font-size="12">plugin woocommerce-payments</text>
<text x="160.0" y="444" text-anchor="middle" font-size="12">setup runs from wp-admin</text>
<rect x="610" y="360" width="260" height="100" rx="12" fill="#7f8c8d" fill-opacity="0.16" stroke="#7f8c8d" stroke-width="1.6"></rect>
<text x="740.0" y="386" text-anchor="middle" font-size="14" font-weight="bold">Documentation</text>
<text x="740.0" y="408" text-anchor="middle" font-size="12">developer.woocommerce.com (developers)</text>
<text x="740.0" y="426" text-anchor="middle" font-size="12">woocommerce.com/documentation (merchants)</text>
<text x="740.0" y="444" text-anchor="middle" font-size="12">release calendar and dev blog</text>
<rect x="330" y="380" width="240" height="100" rx="12" fill="#e74c3c" fill-opacity="0.16" stroke="#e74c3c" stroke-width="1.6"></rect>
<text x="450.0" y="406" text-anchor="middle" font-size="14" font-weight="bold">Security reports</text>
<text x="450.0" y="428" text-anchor="middle" font-size="12">HackerOne programme of Automattic</text>
<text x="450.0" y="446" text-anchor="middle" font-size="12">CVSS 9 or higher is backported</text>
<text x="450.0" y="464" text-anchor="middle" font-size="12">to the last 21 releases</text>
<line x1="290" y1="120" x2="322" y2="205" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="610" y1="120" x2="578" y2="205" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="290" y1="400" x2="322" y2="316" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="610" y1="400" x2="578" y2="316" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="450" y1="380" x2="450" y2="322" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
