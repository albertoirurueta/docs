<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-first-triangle-webgl2-object-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From a Float32Array to the fragment shader</text>
<rect x="20" y="56" width="150" height="76" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="76.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Float32Array</text>
<text x="95.0" y="90.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x y r g b per vertex</text>
<text x="95.0" y="104.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">15 floats, 60 bytes</text>
<text x="95.0" y="118.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(JavaScript memory)</text>
<rect x="205" y="56" width="140" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="76.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">WebGLBuffer</text>
<text x="275.0" y="90.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">ARRAY_BUFFER</text>
<text x="275.0" y="104.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bytes only</text>
<text x="275.0" y="118.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">(GPU side)</text>
<rect x="385" y="56" width="215" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="492.5" y="76.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">WebGLVertexArrayObject</text>
<text x="492.5" y="90.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">location 0: 2 floats, offset 0</text>
<text x="492.5" y="104.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">location 1: 3 floats, offset 8</text>
<text x="492.5" y="118.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">stride 20 bytes</text>
<rect x="640" y="56" width="100" height="76" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="690.0" y="76.8" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Vertex</text>
<text x="690.0" y="90.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">shader</text>
<text x="690.0" y="104.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">aPos, aColor</text>
<text x="690.0" y="118.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">out vColor</text>
<line x1="170" y1="94" x2="205" y2="94" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-first-triangle-webgl2-object-flow)"/>
<line x1="345" y1="94" x2="385" y2="94" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-first-triangle-webgl2-object-flow)"/>
<line x1="600" y1="94" x2="640" y2="94" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-first-triangle-webgl2-object-flow)"/>
<text x="187" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bufferData</text>
<text x="365" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">vertexAttribPointer</text>
<text x="620" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">drawArrays</text>
<text x="380" y="196" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Inside one interleaved vertex (20 bytes)</text>
<rect x="110" y="214" width="100" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="160.0" y="230.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">x (float32)</text>
<text x="160.0" y="244.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bytes 0-3</text>
<rect x="220" y="214" width="100" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270.0" y="230.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">y (float32)</text>
<text x="270.0" y="244.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">bytes 4-7</text>
<rect x="330" y="214" width="100" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="230.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">r (float32)</text>
<text x="380.0" y="244.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">bytes 8-11</text>
<rect x="440" y="214" width="100" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="490.0" y="230.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">g (float32)</text>
<text x="490.0" y="244.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">bytes 12-15</text>
<rect x="550" y="214" width="100" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="600.0" y="230.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">b (float32)</text>
<text x="600.0" y="244.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">bytes 16-19</text>
<text x="210" y="276" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">aPos: offset 0, 2 components</text>
<text x="540" y="276" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">aColor: offset 8, 3 components</text>
<line x1="110" y1="264" x2="310" y2="264" stroke="#4F46E5" stroke-width="2"/>
<line x1="330" y1="264" x2="650" y2="264" stroke="#B45309" stroke-width="2"/>
<text x="380" y="308" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Then the rasteriser interpolates vColor across the triangle for the fragment shader.</text>
</svg>
