<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metalfx-upscaling-and-frame-interpolation-choose-effect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Which MetalFX effect do you need?</text>
<rect x="30" y="60" width="210" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="91.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Spatial scaler</text>
<text x="135.0" y="105.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colour only, no motion data</text>
<rect x="275" y="60" width="210" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="91.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Temporal scaler</text>
<text x="380.0" y="105.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colour, depth, motion</text>
<rect x="520" y="60" width="210" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="91.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Denoised scaler</text>
<text x="625.0" y="105.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">noisy ray-traced input</text>
<rect x="30" y="170" width="210" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="194.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Frame interpolator</text>
<text x="135.0" y="208.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">one frame in the middle</text>
<text x="135.0" y="222.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">needs the scaler + UI</text>
<text x="135" y="157" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">+ cheapest</text>
<text x="380" y="157" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">+ best quality</text>
<text x="625" y="157" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">+ guide textures</text>
<rect x="275" y="170" width="455" height="70" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="502" y="195" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Combine them: the interpolator uses a temporal scaler</text>
<text x="502" y="213" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">as its input, and a denoised scaler replaces it in a ray-traced frame.</text>
<rect x="30" y="265" width="700" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="290" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Decide in this order: do I have motion vectors? then temporal.</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Is the image noisy from rays? then denoised. Do I need more frames per second? then interpolation.</text>
</svg>
