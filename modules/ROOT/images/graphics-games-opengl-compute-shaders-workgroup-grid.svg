<text x="515" y="272" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Derived built-ins for the highlighted invocation</text>
<text x="315" y="294" text-anchor="start" font-size="11" fill="#374151">gl_GlobalInvocationID = WorkGroupID * WorkGroupSize</text>
<text x="315" y="312" text-anchor="start" font-size="11" fill="#374151">  + LocalInvocationID = (2,1,0)*(8,4,1) + (5,2,0) = (21,6,0)</text>
<text x="315" y="330" text-anchor="start" font-size="11" fill="#374151">gl_LocalInvocationIndex = 2*8 + 5 = 21 (0..31)</text>
<text x="315" y="348" text-anchor="start" font-size="11" fill="#374151">gl_NumWorkGroups = (4, 3, 1)</text>
<text x="380" y="392" text-anchor="middle" font-size="11" fill="#4B5563">Work groups are independent and run in any order; only one group shares memory and barriers.</text>
