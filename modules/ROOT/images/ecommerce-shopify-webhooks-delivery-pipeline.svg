<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Shopify webhook and Events delivery pipeline</title>
  <desc id="d">Two lanes of gates that decide whether a delivery is sent, classic webhooks with topic, filter and include_fields and Events with topic, triggers, query and query_filter, followed by the delivery channel and the four receiver steps: verify the HMAC, deduplicate, answer 200 quickly and process later, plus a reconciliation job.</desc>
  <rect x="0" y="0" width="760" height="380" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <g font-size="14" fill="#f2f5f8">
    <text x="20" y="32" font-weight="bold">Classic webhooks: gates on the sender side</text>
    <text x="20" y="120" font-weight="bold">Events: gates on the sender side</text>
  </g>

  <g fill="#3f6e9a" stroke="#f2f5f8">
    <rect x="20" y="42" width="130" height="54" rx="8"/>
    <rect x="166" y="42" width="130" height="54" rx="8"/>
    <rect x="312" y="42" width="130" height="54" rx="8"/>
    <rect x="458" y="42" width="130" height="54" rx="8"/>
    <rect x="604" y="42" width="130" height="54" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="66">Change in</text><text x="85" y="84">the shop</text>
    <text x="231" y="66" font-weight="bold">Topic match</text><text x="231" y="84" font-size="12">orders/create</text>
    <text x="377" y="66" font-weight="bold">filter</text><text x="377" y="84" font-size="12">search syntax</text>
    <text x="523" y="66" font-weight="bold">include_fields</text><text x="523" y="84" font-size="12">trims the payload</text>
    <text x="669" y="66" font-weight="bold">POST to uri</text><text x="669" y="84" font-size="12">one delivery</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 69 H162"/><path d="M296 69 H308"/><path d="M442 69 H454"/><path d="M588 69 H600"/>
  </g>

  <g fill="#4f7f5b" stroke="#f2f5f8">
    <rect x="20" y="130" width="130" height="54" rx="8"/>
    <rect x="166" y="130" width="130" height="54" rx="8"/>
    <rect x="312" y="130" width="130" height="54" rx="8"/>
    <rect x="458" y="130" width="130" height="54" rx="8"/>
    <rect x="604" y="130" width="130" height="54" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="154">Change in</text><text x="85" y="172">the shop</text>
    <text x="231" y="154" font-weight="bold">Topic + actions</text><text x="231" y="172" font-size="12">Product, update</text>
    <text x="377" y="154" font-weight="bold">triggers</text><text x="377" y="172" font-size="12">field paths</text>
    <text x="523" y="154" font-weight="bold">query, then</text><text x="523" y="172" font-size="12">query_filter</text>
    <text x="669" y="154" font-weight="bold">POST to uri</text><text x="669" y="172" font-size="12">one delivery</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 157 H162"/><path d="M296 157 H308"/><path d="M442 157 H454"/><path d="M588 157 H600"/>
  </g>

  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <path d="M734 69 H748 V212 H738" marker-end="url(#a)"/>
    <path d="M734 157 H748"/>
  </g>
  <rect x="20" y="196" width="714" height="32" rx="8" fill="#55616d" stroke="#f2f5f8"/>
  <text x="377" y="217" font-size="13" fill="#f2f5f8" text-anchor="middle">HTTPS (HMAC header)  |  Google Cloud Pub/Sub  |  Amazon EventBridge (no HMAC)</text>

  <path d="M85 230 V248" stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <g fill="#8a5a8f" stroke="#f2f5f8">
    <rect x="20" y="250" width="130" height="54" rx="8"/>
    <rect x="166" y="250" width="130" height="54" rx="8"/>
    <rect x="312" y="250" width="130" height="54" rx="8"/>
    <rect x="458" y="250" width="130" height="54" rx="8"/>
    <rect x="604" y="250" width="130" height="54" rx="8"/>
  </g>
  <g font-size="13" fill="#f2f5f8" text-anchor="middle">
    <text x="85" y="274" font-weight="bold">Verify HMAC</text><text x="85" y="292" font-size="12">raw body + secret</text>
    <text x="231" y="274" font-weight="bold">Deduplicate</text><text x="231" y="292" font-size="12">webhook id</text>
    <text x="377" y="274" font-weight="bold">Answer 200</text><text x="377" y="292" font-size="12">within 5 seconds</text>
    <text x="523" y="274" font-weight="bold">Process later</text><text x="523" y="292" font-size="12">in a worker</text>
    <text x="669" y="274" font-weight="bold">Reconcile</text><text x="669" y="292" font-size="12">periodic job</text>
  </g>
  <g stroke="#f2f5f8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 277 H162"/><path d="M296 277 H308"/><path d="M442 277 H454"/><path d="M588 277 H600"/>
  </g>

  <g font-size="13" fill="#f2f5f8">
    <text x="20" y="334">No 2xx answer within 5 seconds: Shopify retries 8 times over about 4 hours.</text>
    <text x="20" y="356">Failing Admin API subscriptions are then deleted; failing app-specific ones are kept.</text>
  </g>
</svg>
