<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-utl-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: build the intro cutscene</text>
<rect x="20" y="46" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="60" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="34" y="64" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="88.0" y="232" text-anchor="middle" font-size="11" fill="#374151">Select IntroDirector,</text>
<text x="88.0" y="247" text-anchor="middle" font-size="11" fill="#374151">Window &gt; Sequencing &gt;</text>
<text x="88.0" y="262" text-anchor="middle" font-size="11" fill="#374151">Timeline, Create</text>
<rect x="166" y="46" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="180" cy="60" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="180" y="64" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="234.0" y="232" text-anchor="middle" font-size="11" fill="#374151">Drag the Lamp and</text>
<text x="234.0" y="247" text-anchor="middle" font-size="11" fill="#374151">Book in: add Activation</text>
<text x="234.0" y="262" text-anchor="middle" font-size="11" fill="#374151">and Animation tracks</text>
<rect x="312" y="46" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="60" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="326" y="64" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="380.0" y="232" text-anchor="middle" font-size="11" fill="#374151">Add a Cinemachine</text>
<text x="380.0" y="247" text-anchor="middle" font-size="11" fill="#374151">Track with two shot</text>
<text x="380.0" y="262" text-anchor="middle" font-size="11" fill="#374151">clips that overlap</text>
<rect x="458" y="46" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="472" cy="60" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="472" y="64" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<text x="526.0" y="232" text-anchor="middle" font-size="11" fill="#374151">Add a Signal Track,</text>
<text x="526.0" y="247" text-anchor="middle" font-size="11" fill="#374151">a marker and a Signal</text>
<text x="526.0" y="262" text-anchor="middle" font-size="11" fill="#374151">Receiver</text>
<rect x="604" y="46" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="618" cy="60" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="618" y="64" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="672.0" y="232" text-anchor="middle" font-size="11" fill="#374151">Play on Awake off;</text>
<text x="672.0" y="247" text-anchor="middle" font-size="11" fill="#374151">a script plays it and</text>
<text x="672.0" y="262" text-anchor="middle" font-size="11" fill="#374151">handles Skip</text>
<rect x="34" y="72" width="108" height="96" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="46" y="92" width="84" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="88" y="107" text-anchor="middle" font-size="10" fill="#3730A3">IntroDirector</text>
<rect x="58" y="126" width="60" height="24" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="88" y="142" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">Create</text>
<rect x="178" y="76" width="40" height="28" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="198" y="94" text-anchor="middle" font-size="10" fill="#374151">Lamp</text>
<rect x="224" y="76" width="64" height="28" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="178" y="118" width="40" height="28" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="198" y="136" text-anchor="middle" font-size="10" fill="#374151">Book</text>
<rect x="224" y="118" width="64" height="28" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<rect x="324" y="76" width="64" height="28" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<rect x="364" y="112" width="70" height="28" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<text x="356" y="94" text-anchor="middle" font-size="10" fill="#374151">A</text>
<text x="400" y="130" text-anchor="middle" font-size="10" fill="#374151">B</text>
<text x="380" y="160" text-anchor="middle" font-size="10" fill="#4B5563">overlap = blend</text>
<rect x="470" y="76" width="112" height="28" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<polygon points="498,80 505,90 498,100 491,90" fill="#B45309" stroke="#92400E" stroke-width="1"/>
<polygon points="556,80 563,90 556,100 549,90" fill="#B45309" stroke="#92400E" stroke-width="1"/>
<rect x="470" y="118" width="112" height="34" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<text x="526" y="132" text-anchor="middle" font-size="10" fill="#3730A3">Signal Receiver</text>
<text x="526" y="146" text-anchor="middle" font-size="10" fill="#374151">OpenDoor -&gt; event</text>
<rect x="614" y="72" width="116" height="96" rx="6" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="622" y="92" text-anchor="start" font-size="10" fill="#E5E7EB">director.Play();</text>
<text x="622" y="108" text-anchor="start" font-size="10" fill="#E5E7EB">if (skip)</text>
<text x="622" y="124" text-anchor="start" font-size="10" fill="#E5E7EB">  Finish();</text>
<text x="380" y="310" text-anchor="middle" font-size="11" fill="#374151">Asset, bindings, camera shots, signals and a small script are the five parts of the cutscene.</text>
</svg>
