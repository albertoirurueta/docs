<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-us-ai-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: asking the Assistant to fill the Bookshelf</text>
<rect x="14" y="60" width="138" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="83.0" y="78.0" text-anchor="middle" font-size="10" fill="#374151">Mode: Ask</text>
<text x="83.0" y="92.0" text-anchor="middle" font-size="10" fill="#374151">Tier: Default</text>
<text x="83.0" y="106.0" text-anchor="middle" font-size="10" fill="#374151">"How do I place</text>
<text x="83.0" y="120.0" text-anchor="middle" font-size="10" fill="#374151">nine books on a shelf?"</text>
<circle cx="26" cy="60" r="11" fill="#4F46E5"/><text x="26" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="83" y="190" text-anchor="middle" font-size="10" fill="#374151">Window &gt; AI &gt; Assistant</text>
<line x1="152" y1="115" x2="162" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-e)"/>
<rect x="162" y="60" width="138" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="231.0" y="78.0" text-anchor="middle" font-size="10" fill="#374151">Mode: Plan</text>
<text x="231.0" y="92.0" text-anchor="middle" font-size="10" fill="#374151">1 Make a Book prefab</text>
<text x="231.0" y="106.0" text-anchor="middle" font-size="10" fill="#374151">2 Lay out 9 copies</text>
<text x="231.0" y="120.0" text-anchor="middle" font-size="10" fill="#374151">3 Add BookSpinner</text>
<circle cx="174" cy="60" r="11" fill="#4F46E5"/><text x="174" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="231" y="190" text-anchor="middle" font-size="10" fill="#374151">Switch to Plan mode</text>
<line x1="300" y1="115" x2="310" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-e)"/>
<rect x="310" y="60" width="138" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="379.0" y="78.0" text-anchor="middle" font-size="10" fill="#374151">Plan saved in project</text>
<text x="379.0" y="92.0" text-anchor="middle" font-size="10" fill="#374151">[ Revise ]</text>
<text x="379.0" y="106.0" text-anchor="middle" font-size="10" fill="#374151">[ Approve ]</text>
<circle cx="322" cy="60" r="11" fill="#4F46E5"/><text x="322" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="379" y="190" text-anchor="middle" font-size="10" fill="#374151">Review and approve</text>
<line x1="448" y1="115" x2="458" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-e)"/>
<rect x="458" y="60" width="138" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="527.0" y="78.0" text-anchor="middle" font-size="10" fill="#92400E">Mode: Agent</text>
<text x="527.0" y="92.0" text-anchor="middle" font-size="10" fill="#92400E">Create GameObject x 9?</text>
<text x="527.0" y="106.0" text-anchor="middle" font-size="10" fill="#92400E">[ Allow ] [ Deny ]</text>
<circle cx="470" cy="60" r="11" fill="#B45309"/><text x="470" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="527" y="190" text-anchor="middle" font-size="10" fill="#374151">Agent asks permission</text>
<line x1="596" y1="115" x2="606" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-e)"/>
<rect x="606" y="60" width="138" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="675.0" y="78.0" text-anchor="middle" font-size="10" fill="#374151">Shelf with 9 books</text>
<text x="675.0" y="92.0" text-anchor="middle" font-size="10" fill="#374151">Console: no errors</text>
<text x="675.0" y="106.0" text-anchor="middle" font-size="10" fill="#374151">Review the diff</text>
<circle cx="618" cy="60" r="11" fill="#4F46E5"/><text x="618" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="675" y="190" text-anchor="middle" font-size="10" fill="#374151">Check the result</text>
<rect x="14" y="222" width="732" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="246.0" text-anchor="middle" font-size="11" fill="#374151">Ask never changes the project. Plan reads the project and saves a plan. Agent changes it only after you approve and per your permission settings.</text>
<text x="380.0" y="261.0" text-anchor="middle" font-size="11" fill="#374151">Treat the result like a colleague's pull request: read the generated scripts and keep them in version control.</text>
</svg>
