<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="cvmarrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- COPY row -->
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#333">Copy</text>
  <rect x="20" y="45" width="140" height="40" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="90" y="70" text-anchor="middle" font-size="12" fill="#1c4b73">a: ptr -&gt; [data]</text>
  <rect x="60" y="95" width="100" height="30" fill="#f6d9a4" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#6b4207">buffer (owned by a)</text>
  <line x1="90" y1="65" x2="110" y2="95" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#cvmarrow)"/>

  <rect x="300" y="45" width="140" height="40" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="370" y="70" text-anchor="middle" font-size="12" fill="#1c4b73">b: ptr -&gt; [data copy]</text>
  <rect x="340" y="95" width="100" height="30" fill="#f6d9a4" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="390" y="115" text-anchor="middle" font-size="11" fill="#6b4207">NEW buffer (owned by b)</text>
  <line x1="370" y1="65" x2="390" y2="95" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#cvmarrow)"/>

  <line x1="160" y1="65" x2="296" y2="65" stroke="#3a3a3a" stroke-width="2" marker-end="url(#cvmarrow)"/>
  <text x="228" y="55" text-anchor="middle" font-size="11" fill="#555">b = a (copy ctor)</text>
  <text x="228" y="130" text-anchor="middle" font-size="11" fill="#a83a3a">allocates + copies every element -- O(n)</text>

  <!-- MOVE row -->
  <text x="20" y="180" font-size="15" font-weight="bold" fill="#333">Move</text>
  <rect x="20" y="195" width="140" height="40" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="90" y="220" text-anchor="middle" font-size="12" fill="#555">a: ptr -&gt; nullptr</text>

  <rect x="300" y="195" width="140" height="40" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="370" y="220" text-anchor="middle" font-size="12" fill="#1c4b73">c: ptr -&gt; [data]</text>
  <rect x="340" y="245" width="100" height="30" fill="#d3ead6" stroke="#3f8f4f" stroke-width="1.5"/>
  <text x="390" y="265" text-anchor="middle" font-size="11" fill="#2a6636">SAME buffer, now owned by c</text>
  <line x1="370" y1="215" x2="390" y2="245" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#cvmarrow)"/>

  <line x1="160" y1="215" x2="296" y2="215" stroke="#3a3a3a" stroke-width="2" marker-end="url(#cvmarrow)"/>
  <text x="228" y="205" text-anchor="middle" font-size="11" fill="#555">c = std::move(a) (move ctor)</text>
  <text x="228" y="280" text-anchor="middle" font-size="11" fill="#2a6636">steals the pointer -- O(1), a is left empty</text>
</svg>
