<svg viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Four Kubernetes Service types compared: ClusterIP NodePort LoadBalancer and ExternalName</title>
  <rect x="0" y="0" width="780" height="640" fill="#ffffff"/>
  <text x="390" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Service types</text>
  <text x="390" y="42" font-size="10.5" fill="#666666" text-anchor="middle">how each type exposes the same three-Pod catalog-api backend</text>

  <!-- outside world -->
  <rect x="20" y="58" width="740" height="30" rx="6" fill="#fbeee0" stroke="#a05a1f" stroke-width="1.2"/>
  <text x="390" y="78" font-size="10.5" font-weight="bold" fill="#a05a1f" text-anchor="middle">outside the cluster (client, cloud load balancer)</text>

  <!-- ClusterIP box -->
  <rect x="20" y="102" width="360" height="150" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="200" y="122" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">ClusterIP (default)</text>
  <text x="200" y="138" font-size="9" fill="#333333" text-anchor="middle">a stable virtual IP, cluster-internal only</text>
  <rect x="45" y="150" width="310" height="34" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="200" y="171" font-size="9.5" fill="#333333" text-anchor="middle">Service/catalog-api  10.96.10.4:80</text>
  <line x1="200" y1="184" x2="200" y2="198" stroke="#1c4b73" stroke-width="1.3"/>
  <rect x="60" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="100" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 1</text>
  <rect x="160" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="200" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 2</text>
  <rect x="260" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="300" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 3</text>
  <text x="200" y="240" font-size="8.5" fill="#555555" text-anchor="middle">reached only from inside the cluster</text>

  <!-- NodePort box -->
  <rect x="400" y="102" width="360" height="150" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="580" y="122" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">NodePort</text>
  <text x="580" y="138" font-size="9" fill="#333333" text-anchor="middle">every node's IP on a fixed port, plus a ClusterIP</text>
  <rect x="425" y="150" width="150" height="30" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="500" y="169" font-size="8.5" fill="#333333" text-anchor="middle">node-a:30080</text>
  <rect x="585" y="150" width="150" height="30" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="660" y="169" font-size="8.5" fill="#333333" text-anchor="middle">node-b:30080</text>
  <line x1="500" y1="180" x2="580" y2="198" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="660" y1="180" x2="580" y2="198" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="440" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="480" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 1</text>
  <rect x="540" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="580" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 2</text>
  <rect x="640" y="198" width="80" height="30" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="680" y="217" font-size="8.5" fill="#2d6a34" text-anchor="middle">Pod 3</text>
  <text x="580" y="240" font-size="8.5" fill="#555555" text-anchor="middle">kube-proxy may forward cross-node to reach a Pod</text>

  <!-- LoadBalancer box -->
  <rect x="20" y="270" width="360" height="150" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="200" y="290" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">LoadBalancer</text>
  <text x="200" y="306" font-size="9" fill="#333333" text-anchor="middle">cloud LB provisioned in front of a NodePort</text>
  <rect x="140" y="318" width="120" height="26" rx="4" fill="#fbeee0" stroke="#a05a1f" stroke-width="1"/>
  <text x="200" y="336" font-size="9" fill="#a05a1f" text-anchor="middle">cloud load balancer</text>
  <line x1="200" y1="344" x2="200" y2="358" stroke="#1c4b73" stroke-width="1.3"/>
  <rect x="45" y="358" width="310" height="26" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="200" y="375" font-size="9" fill="#333333" text-anchor="middle">NodePort + ClusterIP underneath</text>
  <line x1="200" y1="384" x2="200" y2="396" stroke="#1c4b73" stroke-width="1.3"/>
  <rect x="60" y="396" width="80" height="14" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <rect x="160" y="396" width="80" height="14" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <rect x="260" y="396" width="80" height="14" rx="3" fill="#eef7ee" stroke="#2d6a34" stroke-width="1"/>
  <text x="200" y="416" font-size="8.5" fill="#555555" text-anchor="middle">the only type with a stable, externally routable address</text>

  <!-- ExternalName box -->
  <rect x="400" y="270" width="360" height="150" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="580" y="290" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">ExternalName</text>
  <text x="580" y="306" font-size="9" fill="#333333" text-anchor="middle">a CNAME alias, no proxying and no selector</text>
  <rect x="425" y="326" width="150" height="30" rx="4" fill="#ffffff" stroke="#1c4b73" stroke-width="1"/>
  <text x="500" y="345" font-size="8.5" fill="#333333" text-anchor="middle">Service/billing-legacy</text>
  <line x1="500" y1="356" x2="500" y2="374" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="500" y="368" font-size="8" fill="#555555" text-anchor="middle">CNAME</text>
  <rect x="595" y="326" width="145" height="30" rx="4" fill="#f4eefb" stroke="#5a3d8a" stroke-width="1"/>
  <text x="667" y="345" font-size="8.5" fill="#5a3d8a" text-anchor="middle">billing.example.com</text>
  <text x="580" y="400" font-size="8.5" fill="#555555" text-anchor="middle">no ClusterIP, no Endpoints, no health checks</text>
  <text x="580" y="412" font-size="8.5" fill="#555555" text-anchor="middle">resolved by CoreDNS on every lookup</text>

  <!-- legend / table -->
  <rect x="20" y="440" width="740" height="182" rx="8" fill="#f7f9fb" stroke="#888888" stroke-width="1"/>
  <text x="40" y="462" font-size="11" font-weight="bold" fill="#222222">Reachable from</text>
  <text x="330" y="462" font-size="11" font-weight="bold" fill="#222222">Stable address</text>
  <text x="560" y="462" font-size="11" font-weight="bold" fill="#222222">Typical use</text>

  <line x1="30" y1="472" x2="750" y2="472" stroke="#cccccc" stroke-width="1"/>

  <text x="40" y="492" font-size="9.5" fill="#333333">ClusterIP -- inside the cluster only</text>
  <text x="330" y="492" font-size="9.5" fill="#333333">virtual IP, cluster-internal</text>
  <text x="560" y="492" font-size="9.5" fill="#333333">Service-to-Service calls</text>

  <text x="40" y="516" font-size="9.5" fill="#333333">NodePort -- any node IP, cluster-internal too</text>
  <text x="330" y="516" font-size="9.5" fill="#333333">fixed port on every node</text>
  <text x="560" y="516" font-size="9.5" fill="#333333">on-prem, dev clusters, kind</text>

  <text x="40" y="540" font-size="9.5" fill="#333333">LoadBalancer -- public internet</text>
  <text x="330" y="540" font-size="9.5" fill="#333333">cloud-assigned external IP</text>
  <text x="560" y="540" font-size="9.5" fill="#333333">production external entry point</text>

  <text x="40" y="564" font-size="9.5" fill="#333333">ExternalName -- wherever the CNAME resolves</text>
  <text x="330" y="564" font-size="9.5" fill="#333333">none of its own -- an alias</text>
  <text x="560" y="564" font-size="9.5" fill="#333333">pointing in-cluster clients at an external host</text>

  <line x1="30" y1="576" x2="750" y2="576" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="596" font-size="9" fill="#555555">Headless (clusterIP: None) and selectorless Services are variants layered on ClusterIP, covered in the page text.</text>
  <text x="40" y="612" font-size="9" fill="#555555">NodePort and LoadBalancer both keep a ClusterIP; LoadBalancer additionally provisions a NodePort underneath it.</text>
</svg>
