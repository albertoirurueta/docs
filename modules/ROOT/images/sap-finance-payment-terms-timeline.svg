<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" width="1080" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Payment terms on a timeline: baseline date, two cash discount periods and the net due date</title>
  <desc id="d">A timeline that starts at the baseline date, 2026-05-04, day 0. From day 0 to day 10 (2026-05-14) a 3 percent cash discount applies, so a gross invoice of 5,950.00 is paid with 5,771.50. From day 10 to day 20 (2026-05-24) a 2 percent discount applies and the payment is 5,831.00. From day 20 to day 30 (2026-06-03) no discount applies and the payment is the full 5,950.00. After day 30 the item is overdue. All amounts and the dates are made up for company code EX01.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="540" y="28" text-anchor="middle" font-size="14" font-weight="bold">Terms 3 percent within 10 days, 2 percent within 20 days, net 30 days, counted from the baseline date</text>
  <rect x="60" y="70" width="300" height="90" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="210" y="101" text-anchor="middle" font-size="13" font-weight="bold">Discount period 1</text>
  <text x="210" y="119" text-anchor="middle" font-size="11">3 percent</text>
  <text x="210" y="137" text-anchor="middle" font-size="11">pay 5,771.50</text>
  <rect x="360" y="70" width="300" height="90" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="510" y="101" text-anchor="middle" font-size="13" font-weight="bold">Discount period 2</text>
  <text x="510" y="119" text-anchor="middle" font-size="11">2 percent</text>
  <text x="510" y="137" text-anchor="middle" font-size="11">pay 5,831.00</text>
  <rect x="660" y="70" width="300" height="90" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="810" y="101" text-anchor="middle" font-size="13" font-weight="bold">Net period</text>
  <text x="810" y="119" text-anchor="middle" font-size="11">no discount</text>
  <text x="810" y="137" text-anchor="middle" font-size="11">pay 5,950.00</text>
  <rect x="960" y="70" width="90" height="90" rx="10" fill="#ff6ec4" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="1005" y="101" text-anchor="middle" font-size="13" font-weight="bold">Overdue</text>
  <text x="1005" y="119" text-anchor="middle" font-size="11">days in</text>
  <text x="1005" y="137" text-anchor="middle" font-size="11">arrears</text>
  <line x1="60" y1="180" x2="1060" y2="180" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="60" y1="174" x2="60" y2="186" stroke="currentColor" stroke-width="1.5"/>
  <text x="60" y="206" text-anchor="middle" font-size="13" font-weight="bold">Day 0</text>
  <text x="60" y="224" text-anchor="middle" font-size="12">2026-05-04</text>
  <text x="60" y="242" text-anchor="middle" font-size="12">baseline date</text>
  <line x1="360" y1="174" x2="360" y2="186" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="206" text-anchor="middle" font-size="13" font-weight="bold">Day 10</text>
  <text x="360" y="224" text-anchor="middle" font-size="12">2026-05-14</text>
  <text x="360" y="242" text-anchor="middle" font-size="12">discount 1 ends</text>
  <line x1="660" y1="174" x2="660" y2="186" stroke="currentColor" stroke-width="1.5"/>
  <text x="660" y="206" text-anchor="middle" font-size="13" font-weight="bold">Day 20</text>
  <text x="660" y="224" text-anchor="middle" font-size="12">2026-05-24</text>
  <text x="660" y="242" text-anchor="middle" font-size="12">discount 2 ends</text>
  <line x1="960" y1="174" x2="960" y2="186" stroke="currentColor" stroke-width="1.5"/>
  <text x="960" y="206" text-anchor="middle" font-size="13" font-weight="bold">Day 30</text>
  <text x="960" y="224" text-anchor="middle" font-size="12">2026-06-03</text>
  <text x="960" y="242" text-anchor="middle" font-size="12">net due date</text>
  <text x="540" y="288" text-anchor="middle" font-size="12">Gross invoice 5,950.00 (net 5,000.00 plus 19 percent tax 950.00), discount base gross: 5,950.00 x 0.97 = 5,771.50 and 5,950.00 x 0.98 = 5,831.00.</text>
  <text x="540" y="310" text-anchor="middle" font-size="12">Which base the discount uses is a company code setting. All amounts and dates are made up.</text>
</svg>
