<text x="241.20000000000002" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Place</text>
<text x="233.20000000000002" y="100" text-anchor="middle" font-size="11" fill="#374151">Drag the asset</text>
<text x="233.20000000000002" y="120" text-anchor="middle" font-size="11" fill="#374151">into the viewport</text>
<text x="233.20000000000002" y="140" text-anchor="middle" font-size="11" fill="#374151">or Place Actors</text>
<text x="233.20000000000002" y="212" text-anchor="middle" font-size="11" fill="#374151">It becomes an actor</text>
<text x="233.20000000000002" y="226" text-anchor="middle" font-size="11" fill="#374151">in the Outliner</text>
<rect x="313.6" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="329.6" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="329.6" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="388.0" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Adjust</text>
<text x="380.0" y="100" text-anchor="middle" font-size="11" fill="#374151">Select the actor</text>
<text x="380.0" y="120" text-anchor="middle" font-size="11" fill="#374151">Details: Transform</text>
<text x="380.0" y="140" text-anchor="middle" font-size="11" fill="#374151">gizmo W, E, R</text>
<text x="380.0" y="212" text-anchor="middle" font-size="11" fill="#374151">Move it onto the</text>
<text x="380.0" y="226" text-anchor="middle" font-size="11" fill="#374151">floor of the level</text>
<rect x="460.40000000000003" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="476.40000000000003" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="476.40000000000003" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="534.8000000000001" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Play</text>
<text x="526.8000000000001" y="100" text-anchor="middle" font-size="11" fill="#374151">Press Play</text>
<text x="526.8000000000001" y="120" text-anchor="middle" font-size="11" fill="#374151">Selected Viewport</text>
<text x="526.8000000000001" y="140" text-anchor="middle" font-size="11" fill="#374151">or New Window</text>
<text x="526.8000000000001" y="212" text-anchor="middle" font-size="11" fill="#374151">Esc stops the game;</text>
<text x="526.8000000000001" y="226" text-anchor="middle" font-size="11" fill="#374151">Eject frees the mouse</text>
<rect x="607.2" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
