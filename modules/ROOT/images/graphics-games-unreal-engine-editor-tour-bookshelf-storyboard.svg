<text x="623.2" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="681.6" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Read log</text>
<text x="673.6" y="100" text-anchor="middle" font-size="11" fill="#374151">Open Output Log</text>
<text x="673.6" y="120" text-anchor="middle" font-size="11" fill="#374151">filter LogBookshelf</text>
<text x="673.6" y="140" text-anchor="middle" font-size="11" fill="#374151">check the message</text>
<text x="673.6" y="212" text-anchor="middle" font-size="11" fill="#374151">Messages appear</text>
<text x="673.6" y="226" text-anchor="middle" font-size="11" fill="#374151">in Play In Editor</text>
