<svg viewBox="0 0 760 250" width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: import the model, place it and press Play</text>
<rect x="20.0" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36.0" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36.0" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="94.4" y="71" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Import</text>
<text x="86.4" y="100" text-anchor="middle" font-size="11" fill="#374151">Content Drawer</text>
<text x="86.4" y="120" text-anchor="middle" font-size="11" fill="#374151">Import bookshelf.glb</text>
<text x="86.4" y="140" text-anchor="middle" font-size="11" fill="#374151">Interchange dialog</text>
<text x="86.4" y="212" text-anchor="middle" font-size="11" fill="#374151">Pick a pipeline stack</text>
<text x="86.4" y="226" text-anchor="middle" font-size="11" fill="#374151">and confirm</text>
<rect x="166.8" y="50" width="132.8" height="140" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182.8" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
