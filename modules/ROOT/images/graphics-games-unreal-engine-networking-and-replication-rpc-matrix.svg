<svg viewBox="0 0 760 366" width="760" height="366" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="366" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where an RPC runs, by who calls it</text>
<text x="80" y="76" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">RPC kind</text>
<rect x="142" y="56" width="196" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="240.0" y="78" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Called on the server</text>
<rect x="343" y="56" width="196" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="441.0" y="78" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Called on the owning client</text>
<rect x="544" y="56" width="196" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="642.0" y="78" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Called on a non-owning client</text>
<rect x="14" y="102" width="120" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74" y="137.0" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Server</text>
<rect x="142" y="102" width="196" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="240.0" y="137.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs on the server</text>
<rect x="343" y="102" width="196" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="441.0" y="137.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs on the server</text>
<rect x="544" y="102" width="196" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="642.0" y="137.0" text-anchor="middle" font-size="12" fill="#1F2937">Dropped</text>
<rect x="14" y="170" width="120" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74" y="205.0" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Client</text>
<rect x="142" y="170" width="196" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="240.0" y="205.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs on the owning client</text>
<rect x="343" y="170" width="196" height="62" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="441.0" y="205.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs locally on the caller</text>
<rect x="544" y="170" width="196" height="62" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="642.0" y="205.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs locally on the caller</text>
<rect x="14" y="238" width="120" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74" y="273.0" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">NetMulticast</text>
<rect x="142" y="238" width="196" height="62" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="240.0" y="273.0" text-anchor="middle" font-size="12" fill="#1F2937">Server and relevant clients</text>
<rect x="343" y="238" width="196" height="62" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="441.0" y="273.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs locally on the caller</text>
<rect x="544" y="238" width="196" height="62" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="642.0" y="273.0" text-anchor="middle" font-size="12" fill="#1F2937">Runs locally on the caller</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Assumes the actor replicates and its owning connection is the owning client; with another owner</text>
<text x="380" y="346" text-anchor="middle" font-size="11" fill="#374151">a Server RPC called by a client is dropped as well. Reliable RPCs are resent until acknowledged.</text>
</svg>
