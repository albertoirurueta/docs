<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Supplier / Function / Consumer beans over a binder</text>
  <text x="380" y="45" font-size="10.5" fill="#666666" text-anchor="middle">the functional programming model maps application beans to bindings; the binder maps bindings to broker destinations</text>

  <!-- Application box -->
  <rect x="20" y="70" width="720" height="150" fill="#f5f5f5" stroke="#555555" stroke-width="1.2"/>
  <text x="380" y="90" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Spring Boot application</text>

  <!-- Supplier (source) -->
  <rect x="45" y="108" width="180" height="88" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="135" y="130" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Supplier&lt;T&gt;</text>
  <text x="135" y="146" font-size="10" fill="#333333" text-anchor="middle">bean "produce"</text>
  <text x="135" y="162" font-size="9.5" fill="#666666" text-anchor="middle">binding: produce-out-0</text>
  <text x="135" y="177" font-size="9.5" fill="#777777" text-anchor="middle">(source)</text>

  <!-- Function (processor) -->
  <rect x="290" y="108" width="180" height="88" fill="#f4f0ec" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="380" y="130" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Function&lt;T,R&gt;</text>
  <text x="380" y="146" font-size="10" fill="#333333" text-anchor="middle">bean "transform"</text>
  <text x="380" y="162" font-size="9.5" fill="#666666" text-anchor="middle">transform-in-0 / transform-out-0</text>
  <text x="380" y="177" font-size="9.5" fill="#777777" text-anchor="middle">(processor)</text>

  <!-- Consumer (sink) -->
  <rect x="535" y="108" width="180" height="88" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="625" y="130" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Consumer&lt;T&gt;</text>
  <text x="625" y="146" font-size="10" fill="#333333" text-anchor="middle">bean "consume"</text>
  <text x="625" y="162" font-size="9.5" fill="#666666" text-anchor="middle">binding: consume-in-0</text>
  <text x="625" y="177" font-size="9.5" fill="#777777" text-anchor="middle">(sink)</text>

  <!-- arrows inside app -->
  <line x1="225" y1="152" x2="290" y2="152" stroke="#444444" stroke-width="1.4" marker-end="url(#arrowApp)"/>
  <line x1="470" y1="152" x2="535" y2="152" stroke="#444444" stroke-width="1.4" marker-end="url(#arrowApp)"/>

  <!-- Binder layer -->
  <rect x="20" y="250" width="720" height="60" fill="#fbecec" stroke="#a33333" stroke-width="1.4"/>
  <text x="380" y="285" font-size="13" font-weight="bold" fill="#a33333" text-anchor="middle">Binder (Kafka binder / RabbitMQ binder / Kafka Streams binder)</text>

  <!-- arrows app -> binder -->
  <line x1="135" y1="196" x2="135" y2="250" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#arrowDown)"/>
  <line x1="380" y1="196" x2="380" y2="250" stroke="#8a5a1c" stroke-width="1.4" marker-end="url(#arrowDown)"/>
  <line x1="625" y1="196" x2="625" y2="250" stroke="#2d6a34" stroke-width="1.4" marker-end="url(#arrowDown)"/>

  <!-- Broker destinations -->
  <rect x="45" y="330" width="180" height="36" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="135" y="353" font-size="10.5" fill="#333333" text-anchor="middle">destination: orders</text>

  <rect x="290" y="330" width="180" height="36" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="380" y="353" font-size="10.5" fill="#333333" text-anchor="middle">destination: orders-enriched</text>

  <rect x="535" y="330" width="180" height="36" fill="#ffffff" stroke="#a33333" stroke-width="1.2"/>
  <text x="625" y="353" font-size="10.5" fill="#333333" text-anchor="middle">destination: orders-archive</text>

  <line x1="135" y1="310" x2="135" y2="330" stroke="#a33333" stroke-width="1.2" marker-end="url(#arrowDown2)"/>
  <line x1="380" y1="310" x2="380" y2="330" stroke="#a33333" stroke-width="1.2" marker-end="url(#arrowDown2)"/>
  <line x1="625" y1="310" x2="625" y2="330" stroke="#a33333" stroke-width="1.2" marker-end="url(#arrowDown2)"/>

  <defs>
    <marker id="arrowApp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444444"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowDown2" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#a33333"/>
    </marker>
  </defs>

  <text x="30" y="20" font-size="0"> </text>
</svg>
