<svg viewBox="0 0 740 340" width="740" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="740" height="340" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How an embedded file reaches the Bookshelf site</text>
<rect x="20" y="56" width="250" height="190" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="145" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Bookshelf web page</text>
<rect x="40" y="96" width="210" height="28" rx="4" fill="#E5E7EB"/>
<rect x="40" y="134" width="210" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="145" y="168" text-anchor="middle" font-size="12" fill="#3730A3">iframe element</text>
<text x="145" y="186" text-anchor="middle" font-size="12" fill="#3730A3">src = embed URL</text>
<text x="145" y="204" text-anchor="middle" font-size="12" fill="#3730A3">browser tab only</text>
<rect x="330" y="96" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="415" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Embed viewer</text>
<text x="415" y="146" text-anchor="middle" font-size="12" fill="#374151">view-only canvas</text>
<text x="415" y="164" text-anchor="middle" font-size="12" fill="#374151">page selector</text>
<text x="415" y="182" text-anchor="middle" font-size="12" fill="#374151">full screen, theme</text>
<rect x="560" y="96" width="160" height="110" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="640" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Access check</text>
<text x="640" y="146" text-anchor="middle" font-size="12" fill="#374151">share settings</text>
<text x="640" y="164" text-anchor="middle" font-size="12" fill="#374151">organisation login</text>
<text x="640" y="182" text-anchor="middle" font-size="12" fill="#374151">link sharing</text>
<line x1="270" y1="150" x2="328" y2="150" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="500" y1="150" x2="558" y2="150" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
