<circle cx="529" cy="132" r="11" fill="#4F46E5"/><text x="529" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<path d="M640 206 L640 262 L415 262 L415 208" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="527" cy="262" r="11" fill="#B45309"/><text x="527" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="20" y="282" width="700" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="34" y="301" font-size="12" fill="#92400E">Embeds follow the file's Share settings. If the browser blocks embedded content or the Storage Access API,</text>
<text x="34" y="318" font-size="12" fill="#92400E">the viewer must allow it before the file appears.</text>
