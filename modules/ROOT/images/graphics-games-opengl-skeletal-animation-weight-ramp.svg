<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-graphics-games-opengl-skeletal-animation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Blend weights across the hinge decide how smooth the bend is</text>
<line x1="80" y1="260" x2="700" y2="260" stroke="#4B5563" stroke-width="1.5"/>
<line x1="80" y1="260" x2="80" y2="70" stroke="#4B5563" stroke-width="1.5"/>
<text x="390" y="290" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">x along the cover (0 = spine, 2 = open edge)</text>
<text x="40" y="70" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">weight</text>
<polyline points="80,240 220,240 360,90 700,90" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
<polyline points="80,90 220,90 360,240 700,240" fill="none" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="130" y="82" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">w(Root) = 1</text>
<text x="560" y="82" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">w(Hinge) = 1</text>
<text x="560" y="236" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">w(Root) = 0</text>
<text x="130" y="236" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">w(Hinge) = 0</text>
<text x="290" y="172" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">blend zone</text>
<line x1="220" y1="262" x2="220" y2="80" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="360" y1="262" x2="360" y2="80" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="220" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x = 0.3</text>
<text x="360" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x = 0.9</text>
<text x="550" y="312" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">A narrow zone gives a crisp fold; a wide zone a soft bend.</text>
</svg>
