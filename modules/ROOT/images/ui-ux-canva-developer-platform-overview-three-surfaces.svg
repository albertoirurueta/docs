<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One SDK, three surfaces</text>
  <rect x="30" y="46" width="700" height="44" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="380" y="73" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Developers SDK: every project is an "app" registered in the Developer Portal</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <path d="M140,92 L140,112" marker-end="url(#ah)"/><path d="M380,92 L380,112" marker-end="url(#ah)"/><path d="M620,92 L620,112" marker-end="url(#ah)"/>
  </g>
  <g fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5">
    <rect x="30" y="114" width="220" height="250" rx="10"/><rect x="270" y="114" width="220" height="250" rx="10"/><rect x="510" y="114" width="220" height="250" rx="10"/>
  </g>
  <g fill="#4F46E5"><circle cx="52" cy="136" r="11"/><circle cx="292" cy="136" r="11"/><circle cx="532" cy="136" r="11"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="52" y="140">1</text><text x="292" y="140">2</text><text x="532" y="140">3</text></g>
  <g font-size="13" font-weight="bold" fill="#1F2937">
    <text x="70" y="141">Apps inside Canva</text><text x="310" y="141">Canva for your platform</text><text x="550" y="141">Canva for AI assistants</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="46" y="170" font-weight="bold" fill="#92400E">Formerly: Apps SDK</text>
    <text x="46" y="192">Runs in an iframe in the editor</text><text x="46" y="208">(side panel or overlay), built</text><text x="46" y="224">with React and the App UI Kit</text>
    <text x="46" y="256">Bookshelf: the "Bookshelf</text><text x="46" y="272">Covers" app inserts covers</text><text x="46" y="288">into the open design</text>
    <text x="46" y="330" fill="#4F46E5" font-weight="bold">Docs: building-apps-inside-canva</text>
    <text x="286" y="170" font-weight="bold" fill="#92400E">Formerly: Connect APIs</text>
    <text x="286" y="192">Canva REST APIs called from your</text><text x="286" y="208">own backend or script: designs,</text><text x="286" y="224">autofill, exports, assets</text>
    <text x="286" y="256">Bookshelf: a script fills the</text><text x="286" y="272">"Book of the week" template</text><text x="286" y="288">and exports PNGs</text>
    <text x="286" y="330" fill="#4F46E5" font-weight="bold">Docs: rest-apis</text>
    <text x="526" y="170" font-weight="bold" fill="#92400E">Formerly: "Canva MCP"</text>
    <text x="526" y="192">The Canva MCP server lets an</text><text x="526" y="208">assistant search, create and</text><text x="526" y="224">edit designs for its user</text>
    <text x="526" y="256">Bookshelf: Claude Code drives</text><text x="526" y="272">the campaign designs through</text><text x="526" y="288">the MCP server</text>
    <text x="526" y="330" fill="#4F46E5" font-weight="bold">Docs: canva-mcp-server</text>
  </g>
  <rect x="30" y="380" width="700" height="14" rx="4" fill="#E5E7EB"/>
  <text x="380" y="391" font-size="11" fill="#374151" text-anchor="middle">Shared: Developer Portal, CLI, changelogs and a 6-month minimum deprecation notice</text>
  <text x="380" y="418" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of the developer platform, not a screenshot of any product.</text>
</svg>
