<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-resource-loading-and-streaming-io-queue-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">CPU, I/O queue and GPU: a load overlaps rendering</text>
<text x="20" y="104" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">CPU</text>
<line x1="100" y1="116" x2="740" y2="116" stroke="#9CA3AF" stroke-width="1"/>
<text x="20" y="164" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">I/O queue</text>
<line x1="100" y1="176" x2="740" y2="176" stroke="#9CA3AF" stroke-width="1"/>
<text x="20" y="224" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">GPU</text>
<line x1="100" y1="236" x2="740" y2="236" stroke="#9CA3AF" stroke-width="1"/>
<rect x="110" y="80" width="90" height="32" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="155.0" y="99.8" text-anchor="middle" font-size="11" fill="#374151">enqueue loads</text>
<rect x="210" y="80" width="110" height="32" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="265.0" y="99.8" text-anchor="middle" font-size="11" fill="#374151">commit I/O</text>
<rect x="330" y="80" width="100" height="32" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="99.8" text-anchor="middle" font-size="11" fill="#374151">frame N+1</text>
<rect x="240" y="140" width="200" height="32" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="340.0" y="159.8" text-anchor="middle" font-size="11" fill="#92400E">read + decompress to texture</text>
<rect x="110" y="200" width="120" height="32" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170.0" y="219.8" text-anchor="middle" font-size="11" fill="#3730A3">render frame N</text>
<rect x="240" y="200" width="120" height="32" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="300.0" y="219.8" text-anchor="middle" font-size="11" fill="#3730A3">render frame N+1</text>
<rect x="450" y="200" width="150" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="525.0" y="219.5" text-anchor="middle" font-size="10" fill="#065F46">frame N+2 samples it</text>
<rect x="450" y="140" width="110" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="505.0" y="159.8" text-anchor="middle" font-size="11" fill="#065F46">signalEvent</text>
<line x1="520" y1="172" x2="520" y2="198" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-resource-loading-and-streaming-io-queue-timeline)"/>
<text x="380" y="268" text-anchor="middle" font-size="12" fill="#374151">GPU work waits only on the shared event, not on the file read.</text>
<text x="380" y="288" text-anchor="middle" font-size="11" fill="#374151">Use a separate I/O queue so reads never block the render queue.</text>
</svg>
