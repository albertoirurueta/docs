<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah4-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where each lighting input is computed</text>
<rect x="20" y="50" width="230" height="300" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135" y="74" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Vertex shader</text>
<rect x="36" y="92" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="135" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">in aPos, aNormal, aUV</text>
<rect x="36" y="144" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="135" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">world pos = uModel * aPos</text>
<rect x="36" y="196" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="135" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">normal = uNormalMatrix * aNormal</text>
<rect x="36" y="248" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="135" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">gl_Position = uProj*uView*world</text>
<rect x="290" y="120" width="180" height="160" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="144" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Rasteriser</text>
<text x="380" y="176" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vWorldPos</text>
<text x="380" y="206" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vNormal (not unit length)</text>
<text x="380" y="236" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vUV</text>
<text x="380" y="266" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">interpolates per fragment</text>
<line x1="250" y1="200" x2="290" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah4)"/>
<rect x="510" y="50" width="230" height="300" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625" y="74" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Fragment shader</text>
<rect x="526" y="92" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="625" y="116" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">N = normalize(vNormal)</text>
<rect x="526" y="144" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="625" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">L = normalize(uLightPos - P)</text>
<rect x="526" y="196" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="625" y="220" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">V = normalize(uViewPos - P)</text>
<rect x="526" y="248" width="198" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="625" y="272" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">H = normalize(L + V)</text>
<line x1="470" y1="200" x2="510" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah4)"/>
<rect x="510" y="362" width="230" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="625" y="381" font-size="11" font-weight="normal" fill="#047857" text-anchor="middle">colour = ambient + diffuse + specular</text>
<line x1="625" y1="350" x2="625" y2="362" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah4)"/>
<text x="135" y="372" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uniforms: matrices, light, eye</text>
</svg>
