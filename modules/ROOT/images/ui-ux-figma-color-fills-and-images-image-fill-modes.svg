<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Image fill modes on a wide book-cover layer (schematic)</text>
  <rect x="40" y="50" width="152" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="56" cy="62" r="11" fill="#4F46E5"/><text x="56" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="56" y="90" width="120" height="70" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <clipPath id="f"><rect x="56" y="90" width="120" height="70"/></clipPath><g clip-path="url(#f)"><rect x="56" y="75" width="120" height="100" fill="#C7D2FE"/><rect x="74" y="100" width="50" height="8" fill="#4F46E5"/><rect x="74" y="116" width="70" height="6" fill="#818CF8"/></g>
  <text x="116" y="196" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Fill</text>
  <text x="116" y="218" font-size="12" fill="#374151" text-anchor="middle">Covers the layer; edges</text>
  <text x="116" y="235" font-size="12" fill="#374151" text-anchor="middle">may be clipped</text>
  <rect x="215" y="50" width="152" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="231" cy="62" r="11" fill="#4F46E5"/><text x="231" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="231" y="90" width="120" height="70" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="256" y="90" width="70" height="70" fill="#C7D2FE"/><rect x="265" y="102" width="40" height="8" fill="#4F46E5"/><rect x="265" y="118" width="50" height="6" fill="#818CF8"/>
  <text x="291" y="196" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Fit</text>
  <text x="291" y="218" font-size="12" fill="#374151" text-anchor="middle">Whole image shown; layer</text>
  <text x="291" y="235" font-size="12" fill="#374151" text-anchor="middle">may stay empty</text>
  <rect x="390" y="50" width="152" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="406" cy="62" r="11" fill="#4F46E5"/><text x="406" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="406" y="90" width="120" height="70" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <clipPath id="cr"><rect x="406" y="90" width="120" height="70"/></clipPath><g clip-path="url(#cr)"><rect x="406" y="90" width="120" height="70" fill="#FEF3C7"/><rect x="394" y="78" width="190" height="94" fill="#C7D2FE" opacity="0.5"/><rect x="406" y="90" width="120" height="70" fill="none" stroke="#B45309" stroke-width="2"/></g>
  <rect x="404" y="88" width="6" height="6" fill="#B45309"/><rect x="522" y="156" width="6" height="6" fill="#B45309"/>
  <text x="466" y="196" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Crop</text>
  <text x="466" y="218" font-size="12" fill="#374151" text-anchor="middle">Choose the visible part;</text>
  <text x="466" y="235" font-size="12" fill="#374151" text-anchor="middle">the rest is hidden, not</text>
  <text x="466" y="252" font-size="12" fill="#374151" text-anchor="middle">deleted</text>
  <rect x="565" y="50" width="152" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="581" cy="62" r="11" fill="#4F46E5"/><text x="581" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="581" y="90" width="120" height="70" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <clipPath id="t"><rect x="581" y="90" width="120" height="70"/></clipPath><g clip-path="url(#t)"><rect x="581" y="90" width="38" height="32" fill="#C7D2FE"/><rect x="587" y="98" width="18" height="5" fill="#4F46E5"/><rect x="623" y="90" width="38" height="32" fill="#C7D2FE"/><rect x="629" y="98" width="18" height="5" fill="#4F46E5"/><rect x="665" y="90" width="38" height="32" fill="#C7D2FE"/><rect x="671" y="98" width="18" height="5" fill="#4F46E5"/><rect x="581" y="126" width="38" height="32" fill="#C7D2FE"/><rect x="587" y="134" width="18" height="5" fill="#4F46E5"/><rect x="623" y="126" width="38" height="32" fill="#C7D2FE"/><rect x="629" y="134" width="18" height="5" fill="#4F46E5"/><rect x="665" y="126" width="38" height="32" fill="#C7D2FE"/><rect x="671" y="134" width="18" height="5" fill="#4F46E5"/></g>
  <text x="641" y="196" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Tile</text>
  <text x="641" y="218" font-size="12" fill="#374151" text-anchor="middle">Repeats the image; size</text>
  <text x="641" y="235" font-size="12" fill="#374151" text-anchor="middle">is a percentage</text>
  <text x="380" y="344" font-size="12" fill="#374151" text-anchor="middle">Dashed outline = the layer; the Image adjustment sliders work the same in every mode</text>
</svg>
