<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Post Process Volumes: bounds, blend radius, priority and weight</text>
<rect x="60" y="70" width="640" height="230" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="62" text-anchor="middle" font-size="11" fill="#374151">L_Library</text>
<rect x="70" y="80" width="620" height="210" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380" y="96" text-anchor="middle" font-size="11" fill="#92400E">PPV_Library (Priority 0, Blend Radius 500)</text>
<rect x="220" y="120" width="280" height="150" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="360" y="140" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">PPV_Lamp (Priority 1)</text>
<text x="360" y="158" text-anchor="middle" font-size="11" fill="#3730A3">Bloom, warm colour grade</text>
<rect x="300" y="185" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="360" y="208" text-anchor="middle" font-size="11" fill="#374151">camera inside</text>
<text x="360" y="224" text-anchor="middle" font-size="11" fill="#374151">weight 1.0</text>
<circle cx="360" cy="262" r="5" fill="#4B5563" stroke="none" stroke-width="1"/>
<text x="150" y="200" text-anchor="middle" font-size="11" fill="#374151">Outside every</text>
<text x="150" y="214" text-anchor="middle" font-size="11" fill="#374151">volume: project</text>
<text x="150" y="228" text-anchor="middle" font-size="11" fill="#374151">defaults</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">The higher Priority wins where bounds overlap; inside the Blend Radius the weight fades from 0 to Blend Weight.</text>
<text x="380" y="346" text-anchor="middle" font-size="11" fill="#374151">An Infinite Extent (Unbound) volume has no bounds and applies everywhere.</text>
</svg>
