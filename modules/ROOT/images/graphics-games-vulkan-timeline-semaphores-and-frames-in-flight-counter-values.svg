<text x="245.0" y="109.2" text-anchor="middle" font-size="11" fill="#3730A3">signal value 5</text>
<rect x="380" y="150" width="200" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="480.0" y="174.2" text-anchor="middle" font-size="11" fill="#92400E">Draw scene</text>
<text x="480.0" y="189.2" text-anchor="middle" font-size="11" fill="#92400E">wait 5, signal 6</text>
<rect x="620" y="230" width="110" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="675.0" y="254.2" text-anchor="middle" font-size="11" fill="#065F46">wait for 6</text>
<text x="675.0" y="269.2" text-anchor="middle" font-size="11" fill="#065F46">then read back</text>
<line x1="330" y1="98" x2="378" y2="178" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-cv)"/>
<line x1="580" y1="178" x2="660" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-cv)"/>
<text x="380" y="262" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Counter: 4 ... 5 ... 6</text>
<line x1="160" y1="300" x2="720" y2="300" stroke="#4B5563" stroke-width="2"/>
<circle cx="160" cy="300" r="6" fill="#4F46E5"/>
<text x="160" y="324" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">4</text>
