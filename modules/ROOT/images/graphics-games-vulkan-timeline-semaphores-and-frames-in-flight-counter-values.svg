<text x="75.0" y="102.0" text-anchor="middle" font-size="12" fill="#374151">Compute queue</text>
<line x1="140" y1="98" x2="740" y2="98" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="20" y="150" width="110" height="56" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="75.0" y="182.0" text-anchor="middle" font-size="12" fill="#374151">Graphics queue</text>
<line x1="140" y1="178" x2="740" y2="178" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="20" y="230" width="110" height="56" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="75.0" y="262.0" text-anchor="middle" font-size="12" fill="#374151">Host thread</text>
<line x1="140" y1="258" x2="740" y2="258" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="160" y="70" width="170" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
