<text x="330" y="324" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">5</text>
<circle cx="580" cy="300" r="6" fill="#4F46E5"/>
<text x="580" y="324" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">6</text>
<text x="380" y="356" text-anchor="middle" font-size="12" fill="#374151">No fence and no binary semaphore pair is needed between these three steps.</text>
