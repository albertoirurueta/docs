<svg viewBox="0 0 940 570" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Control passing between a caller and a fiber</title>
  <desc>A swim-lane diagram with two lanes, the caller on the left and the fiber on the right. Fiber.new creates the fiber in the created state without running it. The first resume(10) starts the block with first equal to 10. Fiber.yield(11) suspends the fiber and makes resume return 11. The second resume(20) makes Fiber.yield return 20. The block then ends with :finished, resume returns :finished and the fiber is terminated. A further resume raises FiberError.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="570" fill="#ffffff"/>
  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Control passing between a caller and a fiber</text>
  <text x="470" y="50" font-size="12" fill="#666666" text-anchor="middle">Only one of the two runs at any moment, and only the programmer decides when control moves</text>

  <rect x="90" y="70" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="210" y="95" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Caller (main fiber)</text>
  <rect x="610" y="70" width="240" height="40" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="730" y="95" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">fiber = Fiber.new { |first| ... }</text>
  <line x1="210" y1="110" x2="210" y2="540" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="730" y1="110" x2="730" y2="540" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4"/>

  <rect x="60" y="125" width="300" height="34" rx="4" fill="#f2f2f2" stroke="#555555"/>
  <text x="210" y="147" font-size="12" fill="#222222" text-anchor="middle">fiber = Fiber.new { ... }   (state: created, block not run)</text>

  <line x1="210" y1="190" x2="728" y2="190" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="182" font-size="12" fill="#222222" text-anchor="middle">fiber.resume(10)</text>
  <rect x="560" y="200" width="340" height="34" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="730" y="222" font-size="12" fill="#222222" text-anchor="middle">runs the block with first = 10, up to Fiber.yield(11)</text>

  <line x1="732" y1="262" x2="212" y2="262" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#arrowblue)"/>
  <text x="470" y="254" font-size="12" fill="#1c4b73" text-anchor="middle">Fiber.yield(11): the fiber is suspended, resume returns 11</text>
  <rect x="60" y="276" width="300" height="34" rx="4" fill="#f2f2f2" stroke="#555555"/>
  <text x="210" y="298" font-size="12" fill="#222222" text-anchor="middle">caller works with 11 (state: suspended)</text>

  <line x1="210" y1="342" x2="728" y2="342" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="334" font-size="12" fill="#222222" text-anchor="middle">fiber.resume(20): Fiber.yield now evaluates to 20</text>
  <rect x="560" y="352" width="340" height="34" rx="4" fill="#e8f0f8" stroke="#1c4b73"/>
  <text x="730" y="374" font-size="12" fill="#222222" text-anchor="middle">continues from the Fiber.yield, block ends with :finished</text>

  <line x1="732" y1="414" x2="212" y2="414" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#arrowblue)"/>
  <text x="470" y="406" font-size="12" fill="#1c4b73" text-anchor="middle">the block returns: resume returns :finished</text>
  <rect x="560" y="424" width="340" height="34" rx="4" fill="#e6e6e6" stroke="#777777"/>
  <text x="730" y="446" font-size="12" fill="#444444" text-anchor="middle">state: terminated (alive? is false)</text>

  <line x1="210" y1="490" x2="728" y2="490" stroke="#8a2b2b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="482" font-size="12" fill="#8a2b2b" text-anchor="middle">fiber.resume once more</text>
  <rect x="40" y="504" width="340" height="40" rx="4" fill="#fbeaea" stroke="#8a2b2b"/>
  <text x="210" y="520" font-size="12" fill="#8a2b2b" text-anchor="middle">raises FiberError:</text>
  <text x="210" y="536" font-size="12" fill="#8a2b2b" text-anchor="middle">attempt to resume a terminated fiber</text>
</svg>
