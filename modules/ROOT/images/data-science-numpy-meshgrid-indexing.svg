<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">meshgrid with indexing xy and ij</title>
  <desc id="d">Two small tables for the inputs x of length 3 and y of length 2. With indexing xy the output shape is 2 by 3, rows follow y and columns follow x. With indexing ij the output shape is 3 by 2, rows follow x and columns follow y.</desc>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">x = [1, 2, 3], y = [10, 20]</text>
  <text x="180" y="78" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">indexing="xy" (default)</text>
  <text x="540" y="78" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">indexing="ij"</text>
  <text x="180" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">shape (len(y), len(x)) = (2, 3)</text>
  <text x="540" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">shape (len(x), len(y)) = (3, 2)</text>
  <g stroke-width="2" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <g fill="#CCFBF1" stroke="#0F766E">
      <rect x="90" y="116" width="56" height="40" rx="6"/><rect x="152" y="116" width="56" height="40" rx="6"/><rect x="214" y="116" width="56" height="40" rx="6"/>
      <rect x="90" y="162" width="56" height="40" rx="6"/><rect x="152" y="162" width="56" height="40" rx="6"/><rect x="214" y="162" width="56" height="40" rx="6"/>
    </g>
    <text x="118" y="141">1</text><text x="180" y="141">2</text><text x="242" y="141">3</text>
    <text x="118" y="187">1</text><text x="180" y="187">2</text><text x="242" y="187">3</text>
    <g fill="#FEF3C7" stroke="#B45309">
      <rect x="90" y="226" width="56" height="40" rx="6"/><rect x="152" y="226" width="56" height="40" rx="6"/><rect x="214" y="226" width="56" height="40" rx="6"/>
      <rect x="90" y="272" width="56" height="40" rx="6"/><rect x="152" y="272" width="56" height="40" rx="6"/><rect x="214" y="272" width="56" height="40" rx="6"/>
    </g>
    <text x="118" y="251">10</text><text x="180" y="251">10</text><text x="242" y="251">10</text>
    <text x="118" y="297">20</text><text x="180" y="297">20</text><text x="242" y="297">20</text>
    <g fill="#CCFBF1" stroke="#0F766E">
      <rect x="450" y="116" width="56" height="40" rx="6"/><rect x="512" y="116" width="56" height="40" rx="6"/>
      <rect x="450" y="162" width="56" height="40" rx="6"/><rect x="512" y="162" width="56" height="40" rx="6"/>
      <rect x="450" y="208" width="56" height="40" rx="6"/><rect x="512" y="208" width="56" height="40" rx="6"/>
    </g>
    <text x="478" y="141">1</text><text x="540" y="141">1</text>
    <text x="478" y="187">2</text><text x="540" y="187">2</text>
    <text x="478" y="233">3</text><text x="540" y="233">3</text>
  </g>
  <text x="48" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">X</text>
  <text x="48" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Y</text>
  <text x="418" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Xi</text>
  <text x="540" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Yi also has shape (3, 2):</text>
  <text x="540" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">each row is [10, 20]</text>
</svg>
