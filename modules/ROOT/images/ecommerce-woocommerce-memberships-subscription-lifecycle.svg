<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Subscription status changes and the hooks they fire</title>
  <desc id="d">A subscription starts pending, becomes active after the first payment and renews on a schedule. A failed renewal puts it on hold; a successful retry returns it to active. A cancellation first moves it to pending-cancel until the end of the prepaid term and then to cancelled. A subscription with an end date becomes expired. Each change fires woocommerce_subscription_status_updated and a status specific hook.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="40" width="150" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="95.0" y="70.0" text-anchor="middle" font-weight="bold">pending</text>
  <text x="95.0" y="88.0" text-anchor="middle">created at checkout</text>
  <rect x="235" y="40" width="150" height="70" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="310.0" y="70.0" text-anchor="middle" font-weight="bold">active</text>
  <text x="310.0" y="88.0" text-anchor="middle">status_active hook</text>
  <rect x="450" y="40" width="150" height="70" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="525.0" y="61.0" text-anchor="middle" font-weight="bold">on-hold</text>
  <text x="525.0" y="79.0" text-anchor="middle">payment failed or</text>
  <text x="525.0" y="97.0" text-anchor="middle">suspended</text>
  <rect x="665" y="40" width="215" height="70" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="772.5" y="70.0" text-anchor="middle" font-weight="bold">pending-cancel</text>
  <text x="772.5" y="88.0" text-anchor="middle">cancelled, prepaid term runs</text>
  <line x1="170" y1="75" x2="235" y2="75" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="68" font-size="12">paid</text>
  <line x1="385" y1="65" x2="450" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="58" font-size="12">fails</text>
  <line x1="450" y1="95" x2="385" y2="95" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="392" y="112" font-size="12">retry ok</text>
  <line x1="310" y1="110" x2="310" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="75" x2="665" y2="75" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="235" y="200" width="150" height="70" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="310.0" y="230.0" text-anchor="middle" font-weight="bold">expired</text>
  <text x="310.0" y="248.0" text-anchor="middle">end date reached</text>
  <rect x="665" y="200" width="215" height="70" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="772.5" y="230.0" text-anchor="middle" font-weight="bold">cancelled</text>
  <text x="772.5" y="248.0" text-anchor="middle">end of prepaid term</text>
  <line x1="772" y1="110" x2="772" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="285" width="860" height="95" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="309.5" text-anchor="middle" font-weight="bold">Hooks</text>
  <text x="450.0" y="327.5" text-anchor="middle">every change: woocommerce_subscription_status_updated( subscription, new_status, old_status )</text>
  <text x="450.0" y="345.5" text-anchor="middle">payments: woocommerce_subscription_payment_complete, woocommerce_subscription_renewal_payment_complete,</text>
  <text x="450.0" y="363.5" text-anchor="middle">woocommerce_subscription_payment_failed, woocommerce_subscription_renewal_payment_failed</text>
</svg>
