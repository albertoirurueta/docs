<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The five scheduled jobs of bookshelf-service and the mechanism each one uses</text>
  <defs>
    <marker id="bm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="150" height="500" rx="10" fill="#e8f1f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="95" y="300" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-</text>
  <text x="95" y="318" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">service</text>
  <text x="95" y="340" font-size="10.5" fill="#555555" text-anchor="middle">Spring Boot 4.1</text>
  <text x="95" y="355" font-size="10.5" fill="#555555" text-anchor="middle">Java 21</text>

  <text x="215" y="52" font-size="12" font-weight="bold" fill="#222222">Job and cadence</text>
  <text x="520" y="52" font-size="12" font-weight="bold" fill="#222222">Mechanism</text>
  <text x="800" y="52" font-size="12" font-weight="bold" fill="#222222">Why it needs it</text>

  <!-- 1 -->
  <line x1="170" y1="110" x2="200" y2="110" stroke="#555555" stroke-width="1.4" marker-end="url(#bm-arrow)"/>
  <rect x="204" y="68" width="290" height="84" rx="7" fill="#f6f8fa" stroke="#9aa5b1"/>
  <text x="218" y="92" font-size="13" font-weight="bold" fill="#222222">1. Catalogue cache refresh</text>
  <text x="218" y="112" font-size="11" fill="#333333">every 5 minutes, any node may do it</text>
  <text x="218" y="130" font-size="10.5" fill="#666666">idempotent, cheap, nothing to remember</text>
  <rect x="506" y="68" width="270" height="84" rx="7" fill="#fdf3e3" stroke="#a8641a"/>
  <text x="520" y="92" font-size="12.5" font-weight="bold" fill="#222222">@Scheduled(fixedDelay)</text>
  <text x="520" y="112" font-size="11" fill="#333333">standard scheduling is enough</text>
  <text x="520" y="130" font-size="10.5" fill="#666666">each node refreshes its own cache</text>
  <text x="790" y="92" font-size="11" fill="#333333">No persistence, no</text>
  <text x="790" y="108" font-size="11" fill="#333333">coordination needed.</text>
  <text x="790" y="130" font-size="10.5" fill="#2e7d32">Stay with @Scheduled</text>

  <!-- 2 -->
  <line x1="170" y1="220" x2="200" y2="220" stroke="#555555" stroke-width="1.4" marker-end="url(#bm-arrow)"/>
  <rect x="204" y="162" width="290" height="96" rx="7" fill="#f6f8fa" stroke="#9aa5b1"/>
  <text x="218" y="186" font-size="13" font-weight="bold" fill="#222222">2. Nightly overdue-loan reminders</text>
  <text x="218" y="206" font-size="11" fill="#333333">02:00 Europe/Madrid, business days</text>
  <text x="218" y="224" font-size="10.5" fill="#666666">once per night across all instances</text>
  <text x="218" y="242" font-size="10.5" fill="#666666">no mail on public holidays</text>
  <rect x="506" y="162" width="270" height="96" rx="7" fill="#fdf3e3" stroke="#a8641a"/>
  <text x="520" y="186" font-size="12.5" font-weight="bold" fill="#222222">@Scheduled(cron) + ShedLock</text>
  <text x="520" y="206" font-size="11" fill="#333333">then a Quartz CronTrigger with</text>
  <text x="520" y="222" font-size="11" fill="#333333">a holiday Calendar and a</text>
  <text x="520" y="238" font-size="11" fill="#333333">misfire policy</text>
  <text x="790" y="186" font-size="11" fill="#333333">ShedLock skips, it does</text>
  <text x="790" y="202" font-size="11" fill="#333333">not catch up. Calendars</text>
  <text x="790" y="218" font-size="11" fill="#333333">and misfires are Quartz.</text>
  <text x="790" y="240" font-size="10.5" fill="#2e7d32">Calendars, misfires pages</text>

  <!-- 3 -->
  <line x1="170" y1="330" x2="200" y2="330" stroke="#555555" stroke-width="1.4" marker-end="url(#bm-arrow)"/>
  <rect x="204" y="270" width="290" height="96" rx="7" fill="#f6f8fa" stroke="#9aa5b1"/>
  <text x="218" y="294" font-size="13" font-weight="bold" fill="#222222">3. Per-member return reminders</text>
  <text x="218" y="314" font-size="11" fill="#333333">created when a loan is made,</text>
  <text x="218" y="330" font-size="11" fill="#333333">deleted when the book returns</text>
  <text x="218" y="350" font-size="10.5" fill="#666666">thousands, each at its own time</text>
  <rect x="506" y="270" width="270" height="96" rx="7" fill="#eaf5ea" stroke="#2e7d32"/>
  <text x="520" y="294" font-size="12.5" font-weight="bold" fill="#222222">Quartz, created at runtime</text>
  <text x="520" y="314" font-size="11" fill="#333333">one-shot SimpleTrigger per loan,</text>
  <text x="520" y="330" font-size="11" fill="#333333">JobDataMap with memberId and</text>
  <text x="520" y="346" font-size="11" fill="#333333">loanId, JDBC job store</text>
  <text x="790" y="294" font-size="11" fill="#333333">The schedule is data that</text>
  <text x="790" y="310" font-size="11" fill="#333333">changes while the service</text>
  <text x="790" y="326" font-size="11" fill="#333333">runs and survives restarts.</text>
  <text x="790" y="348" font-size="10.5" fill="#2e7d32">Only Quartz can do this</text>

  <!-- 4 -->
  <line x1="170" y1="440" x2="200" y2="440" stroke="#555555" stroke-width="1.4" marker-end="url(#bm-arrow)"/>
  <rect x="204" y="378" width="290" height="96" rx="7" fill="#f6f8fa" stroke="#9aa5b1"/>
  <text x="218" y="402" font-size="13" font-weight="bold" fill="#222222">4. Weekly statistics report</text>
  <text x="218" y="422" font-size="11" fill="#333333">Monday 06:00, runs for minutes,</text>
  <text x="218" y="438" font-size="11" fill="#333333">must never overlap itself</text>
  <text x="218" y="458" font-size="10.5" fill="#666666">has to finish after a node crash</text>
  <rect x="506" y="378" width="270" height="96" rx="7" fill="#eaf5ea" stroke="#2e7d32"/>
  <text x="520" y="402" font-size="12.5" font-weight="bold" fill="#222222">Quartz cluster of 3 nodes</text>
  <text x="520" y="422" font-size="11" fill="#333333">@DisallowConcurrentExecution,</text>
  <text x="520" y="438" font-size="11" fill="#333333">requestsRecovery, isClustered,</text>
  <text x="520" y="454" font-size="11" fill="#333333">an idempotent job</text>
  <text x="790" y="402" font-size="11" fill="#333333">Fail-over re-runs the job</text>
  <text x="790" y="418" font-size="11" fill="#333333">on a survivor; a lock</text>
  <text x="790" y="434" font-size="11" fill="#333333">library cannot do that.</text>
  <text x="790" y="456" font-size="10.5" fill="#2e7d32">Clustering, migration</text>

  <!-- 5 -->
  <line x1="170" y1="520" x2="200" y2="520" stroke="#555555" stroke-width="1.4" marker-end="url(#bm-arrow)"/>
  <rect x="204" y="486" width="290" height="84" rx="7" fill="#f6f8fa" stroke="#9aa5b1"/>
  <text x="218" y="508" font-size="13" font-weight="bold" fill="#222222">5. Monthly retention cleanup</text>
  <text x="218" y="528" font-size="11" fill="#333333">last business day of the month</text>
  <text x="218" y="546" font-size="10.5" fill="#666666">launches a Spring Batch job</text>
  <rect x="506" y="486" width="270" height="84" rx="7" fill="#eaf5ea" stroke="#2e7d32"/>
  <text x="520" y="508" font-size="12.5" font-weight="bold" fill="#222222">Quartz cron with L / LW</text>
  <text x="520" y="528" font-size="11" fill="#333333">and a Calendar of holidays;</text>
  <text x="520" y="546" font-size="11" fill="#333333">QuartzJobBean calls the JobLauncher</text>
  <text x="790" y="508" font-size="11" fill="#333333">Last-day rules are in the</text>
  <text x="790" y="524" font-size="11" fill="#333333">cron grammar; the heavy</text>
  <text x="790" y="540" font-size="11" fill="#333333">work belongs to Batch.</text>
</svg>
