<text x="640.0" y="133.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Per draw</text>
<text x="640.0" y="148.5" text-anchor="middle" font-size="11" fill="#92400E">Command encoding stays</text>
<text x="640.0" y="163.5" text-anchor="middle" font-size="11" fill="#92400E">one table slot:</text>
<text x="640.0" y="178.5" text-anchor="middle" font-size="11" fill="#92400E">setAddress(buffer.gpuAddress,</text>
<text x="640.0" y="193.5" text-anchor="middle" font-size="11" fill="#92400E">index: 2)</text>
<line x1="540" y1="160" x2="212" y2="160" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-ab-res)"/>
<rect x="540" y="250" width="200" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="281.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Do not forget</text>
<text x="640.0" y="296.0" text-anchor="middle" font-size="11" fill="#065F46">All referenced resources</text>
<text x="640.0" y="311.0" text-anchor="middle" font-size="11" fill="#065F46">must be resident:</text>
<text x="640.0" y="326.0" text-anchor="middle" font-size="11" fill="#065F46">residency set or useResource</text>
