<text x="52" y="155" text-anchor="middle" font-size="11" fill="#6B7280">8</text>
<text x="122" y="155" text-anchor="middle" font-size="11" fill="#374151">spine texture ID</text>
<rect x="32" y="175" width="166" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="52" y="195" text-anchor="middle" font-size="11" fill="#6B7280">16</text>
<text x="122" y="195" text-anchor="middle" font-size="11" fill="#374151">pages texture ID</text>
