<line x1="198" y1="151" x2="298" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ab-res)"/>
<line x1="198" y1="191" x2="298" y2="205" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ab-res)"/>
<line x1="198" y1="231" x2="298" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ab-res)"/>
<line x1="198" y1="311" x2="298" y2="325" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ab-res)"/>
