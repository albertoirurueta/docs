<text x="385.0" y="148.5" text-anchor="middle" font-size="11" fill="#065F46">texture: spine.ktx2</text>
<rect x="300" y="180" width="170" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="385.0" y="208.5" text-anchor="middle" font-size="11" fill="#065F46">texture: pages.ktx2</text>
