<text x="52" y="235" text-anchor="middle" font-size="11" fill="#6B7280">24</text>
<text x="122" y="235" text-anchor="middle" font-size="11" fill="#374151">sampler ID</text>
<rect x="32" y="255" width="166" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="52" y="275" text-anchor="middle" font-size="11" fill="#6B7280">32</text>
<text x="122" y="275" text-anchor="middle" font-size="11" fill="#374151">tint (float3)</text>
<rect x="32" y="295" width="166" height="32" rx="5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="52" y="315" text-anchor="middle" font-size="11" fill="#6B7280">48</text>
