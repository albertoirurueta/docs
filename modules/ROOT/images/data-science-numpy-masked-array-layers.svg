<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">A masked array is data plus a mask</title>
  <desc id="d">The data array 21.5, -999, 23.0, 19.5, -999 sits above a Boolean mask False, True, False, False, True. Combining them gives the masked view 21.5, masked, 23.0, 19.5, masked, whose mean uses only the three valid values.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Data layer, mask layer, masked view</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">
    <text x="24" y="86">data</text><text x="24" y="156">mask</text><text x="24" y="256">view</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#0F172A" stroke-width="2">
    <rect x="110" y="60" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="155" y="87">21.5</text>
    <rect x="215" y="60" width="90" height="42" rx="6" fill="#FFE4E6" stroke="#BE123C"/><text x="260" y="87">-999.0</text>
    <rect x="320" y="60" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="365" y="87">23.0</text>
    <rect x="425" y="60" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="470" y="87">19.5</text>
    <rect x="530" y="60" width="90" height="42" rx="6" fill="#FFE4E6" stroke="#BE123C"/><text x="575" y="87">-999.0</text>
    <rect x="110" y="130" width="90" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="155" y="157">False</text>
    <rect x="215" y="130" width="90" height="42" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="260" y="157">True</text>
    <rect x="320" y="130" width="90" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="365" y="157">False</text>
    <rect x="425" y="130" width="90" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="470" y="157">False</text>
    <rect x="530" y="130" width="90" height="42" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="575" y="157">True</text>
    <rect x="110" y="230" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="155" y="257">21.5</text>
    <rect x="215" y="230" width="90" height="42" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5 4"/><text x="260" y="257">--</text>
    <rect x="320" y="230" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="365" y="257">23.0</text>
    <rect x="425" y="230" width="90" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="470" y="257">19.5</text>
    <rect x="530" y="230" width="90" height="42" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5 4"/><text x="575" y="257">--</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="365" y1="108" x2="365" y2="124" marker-end="url(#ar)"/>
    <line x1="365" y1="178" x2="365" y2="224" marker-end="url(#ar)"/>
  </g>
  <circle cx="86" cy="81" r="11" fill="#0F172A"/><text x="86" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="86" cy="151" r="11" fill="#0F172A"/><text x="86" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="86" cy="251" r="11" fill="#0F172A"/><text x="86" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="110" y="304" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">view.mean() = (21.5 + 23.0 + 19.5) / 3 = 21.33</text>
</svg>
