<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-shader-compilation-and-pipeline-caching-cache-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where a compiled pipeline can come from</text>
<rect x="60" y="60" width="430" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="275.0" y="86.2" text-anchor="middle" font-size="12" fill="#065F46">Your archive (MTL4Archive / binary archive)</text>
<circle cx="40" cy="82" r="11" fill="#047857"/><text x="40" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="505" y="86" text-anchor="start" font-size="11" fill="#374151">best: shipped or built on first run</text>
<rect x="60" y="120" width="430" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="146.2" text-anchor="middle" font-size="12" fill="#3730A3">Metal system shader cache</text>
<circle cx="40" cy="142" r="11" fill="#4F46E5"/><text x="40" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="505" y="146" text-anchor="start" font-size="11" fill="#374151">automatic, per OS build</text>
<rect x="60" y="180" width="430" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="275.0" y="206.2" text-anchor="middle" font-size="12" fill="#92400E">Compile from metallib (AIR to GPU code)</text>
<circle cx="40" cy="202" r="11" fill="#B45309"/><text x="40" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="505" y="206" text-anchor="start" font-size="11" fill="#374151">slow: the cost you are avoiding</text>
<rect x="60" y="240" width="430" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="275.0" y="266.2" text-anchor="middle" font-size="12" fill="#92400E">Compile from source text at runtime</text>
<circle cx="40" cy="262" r="11" fill="#B45309"/><text x="40" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="505" y="266" text-anchor="start" font-size="11" fill="#374151">slowest: avoid in shipped builds</text>
<line x1="275" y1="104" x2="275" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-cache-layers)"/>
<line x1="275" y1="164" x2="275" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-cache-layers)"/>
<line x1="275" y1="224" x2="275" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-cache-layers)"/>
<text x="380" y="306" text-anchor="middle" font-size="11" fill="#374151">Lookups go top to bottom; the first layer that has the pipeline wins.</text>
</svg>
