<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img">
<title>Three learning-curve patterns</title>
<desc>Three small charts of score against training set size. High bias: both curves converge to a low score. High variance: a large gap between a high training curve and a lower validation curve that is still rising. Good fit: both curves converge close to a high score.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Reading a learning curve (illustrative shapes)</text>
<text x="130.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">High bias</text>
<line x1="30" y1="220" x2="230" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="30" y1="70" x2="30" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<polyline points="38.0,108.0 47.2,115.7 56.4,121.8 65.6,126.5 74.8,130.1 84.0,133.0 93.2,135.2 102.4,136.9 111.6,138.3 120.8,139.3 130.0,140.1 139.2,140.8 148.4,141.3 157.6,141.6 166.8,141.9 176.0,142.2 185.2,142.4 194.4,142.5 203.6,142.6 212.8,142.7 222.0,142.8" fill="none" stroke="#0F766E" stroke-width="3"/>
<polyline points="38.0,178.0 47.2,167.8 56.4,160.3 65.6,154.7 74.8,150.6 84.0,147.5 93.2,145.3 102.4,143.6 111.6,142.4 120.8,141.4 130.0,140.8 139.2,140.2 148.4,139.9 157.6,139.6 166.8,139.4 176.0,139.2 185.2,139.1 194.4,139.0 203.6,139.0 212.8,138.9 222.0,138.9" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="130.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">training set size</text>
<text x="130.0" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">both low, close together</text>
<text x="130.0" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">more data will not help</text>
<text x="360.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">High variance</text>
<line x1="260" y1="220" x2="460" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="260" y1="70" x2="260" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<polyline points="268.0,84.2 277.2,84.5 286.4,84.9 295.6,85.2 304.8,85.6 314.0,85.9 323.2,86.3 332.4,86.7 341.6,87.0 350.8,87.3 360.0,87.7 369.2,88.1 378.4,88.4 387.6,88.8 396.8,89.1 406.0,89.4 415.2,89.8 424.4,90.2 433.6,90.5 442.8,90.8 452.0,91.2" fill="none" stroke="#0F766E" stroke-width="3"/>
<polyline points="268.0,164.0 277.2,158.2 286.4,152.9 295.6,148.3 304.8,144.1 314.0,140.3 323.2,136.9 332.4,133.9 341.6,131.2 350.8,128.8 360.0,126.6 369.2,124.7 378.4,123.0 387.6,121.4 396.8,120.0 406.0,118.8 415.2,117.6 424.4,116.6 433.6,115.7 442.8,114.9 452.0,114.2" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="360.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">training set size</text>
<text x="360.0" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">big gap, validation rising</text>
<text x="360.0" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">more data or regularisation helps</text>
<text x="590.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Good fit</text>
<line x1="490" y1="220" x2="690" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="490" y1="70" x2="490" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
<polyline points="498.0,85.6 507.2,86.2 516.4,86.7 525.6,87.3 534.8,87.8 544.0,88.4 553.2,89.0 562.4,89.5 571.6,90.1 580.8,90.6 590.0,91.2 599.2,91.8 608.4,92.3 617.6,92.9 626.8,93.4 636.0,94.0 645.2,94.6 654.4,95.1 663.6,95.7 672.8,96.2 682.0,96.8" fill="none" stroke="#0F766E" stroke-width="3"/>
<polyline points="498.0,150.0 507.2,138.2 516.4,129.1 525.6,121.9 534.8,116.4 544.0,112.0 553.2,108.7 562.4,106.0 571.6,104.0 580.8,102.4 590.0,101.2 599.2,100.2 608.4,99.4 617.6,98.9 626.8,98.4 636.0,98.1 645.2,97.8 654.4,97.6 663.6,97.4 672.8,97.3 682.0,97.2" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="590.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">training set size</text>
<text x="590.0" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">both high, small gap</text>
<text x="590.0" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">good place to stop</text>
<rect x="60" y="300" width="20" height="8" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="88" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">training score</text>
<rect x="220" y="300" width="20" height="8" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="248" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">validation score</text>
</svg>
