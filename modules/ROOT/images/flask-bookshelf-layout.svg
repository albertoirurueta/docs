<svg viewBox="0 0 800 604" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="604" fill="#ffffff"/>
  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The final Bookshelf project layout</text>
  <text x="400" y="46" font-size="12" fill="#666666" text-anchor="middle">src layout: the package lives under src/, everything that is not code sits beside it</text>
  <rect x="30" y="66" width="250" height="24" rx="4" fill="#f5f5f5" stroke="#777777" stroke-width="1.2"/>
  <text x="38" y="82" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#777777">bookshelf/</text>
  <text x="300" y="82" font-size="12" fill="#222222">the repository root</text>
  <rect x="56" y="96" width="224" height="24" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="64" y="112" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#1c4b73">pyproject.toml</text>
  <text x="300" y="112" font-size="12" fill="#222222">project metadata, dependencies, build backend</text>
  <line x1="44" y1="108" x2="56" y2="108" stroke="#999999" stroke-width="1"/>
  <rect x="56" y="126" width="224" height="24" rx="4" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.2"/>
  <text x="64" y="142" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#b7410e">src/bookshelf/</text>
  <text x="300" y="142" font-size="12" fill="#222222">the installable package (import name bookshelf)</text>
  <line x1="44" y1="138" x2="56" y2="138" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="156" width="198" height="24" rx="4" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.2"/>
  <text x="90" y="172" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#b7410e">__init__.py</text>
  <text x="300" y="172" font-size="12" fill="#222222">create_app(): the application factory</text>
  <line x1="70" y1="168" x2="82" y2="168" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="186" width="198" height="24" rx="4" fill="#eaf3e6" stroke="#2f5424" stroke-width="1.2"/>
  <text x="90" y="202" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#2f5424">config.py</text>
  <text x="300" y="202" font-size="12" fill="#222222">Config, DevelopmentConfig, TestingConfig, ProductionConfig</text>
  <line x1="70" y1="198" x2="82" y2="198" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="216" width="198" height="24" rx="4" fill="#eaf3e6" stroke="#2f5424" stroke-width="1.2"/>
  <text x="90" y="232" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#2f5424">extensions.py</text>
  <text x="300" y="232" font-size="12" fill="#222222">db = SQLAlchemy() and friends, created unbound</text>
  <line x1="70" y1="228" x2="82" y2="228" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="246" width="198" height="24" rx="4" fill="#eaf3e6" stroke="#2f5424" stroke-width="1.2"/>
  <text x="90" y="262" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#2f5424">cli.py</text>
  <text x="300" y="262" font-size="12" fill="#222222">Click commands registered by the factory</text>
  <line x1="70" y1="258" x2="82" y2="258" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="276" width="198" height="24" rx="4" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="90" y="292" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#6a3d9a">models/</text>
  <text x="300" y="292" font-size="12" fill="#222222">SQLAlchemy models, one module per aggregate</text>
  <line x1="70" y1="288" x2="82" y2="288" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="306" width="198" height="24" rx="4" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="90" y="322" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#6a3d9a">catalog/</text>
  <text x="300" y="322" font-size="12" fill="#222222">blueprint: pages, repository, service layer</text>
  <line x1="70" y1="318" x2="82" y2="318" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="336" width="198" height="24" rx="4" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="90" y="352" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#6a3d9a">api/</text>
  <text x="300" y="352" font-size="12" fill="#222222">blueprint: JSON API under /api</text>
  <line x1="70" y1="348" x2="82" y2="348" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="366" width="198" height="24" rx="4" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="90" y="382" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#6a3d9a">auth/ and admin/</text>
  <text x="300" y="382" font-size="12" fill="#222222">blueprints added on later pages</text>
  <line x1="70" y1="378" x2="82" y2="378" stroke="#999999" stroke-width="1"/>
  <rect x="82" y="396" width="198" height="24" rx="4" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="90" y="412" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#6a3d9a">templates/ and static/</text>
  <text x="300" y="412" font-size="12" fill="#222222">application-wide templates and assets</text>
  <line x1="70" y1="408" x2="82" y2="408" stroke="#999999" stroke-width="1"/>
  <rect x="56" y="426" width="224" height="24" rx="4" fill="#eaf3e6" stroke="#2f5424" stroke-width="1.2"/>
  <text x="64" y="442" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#2f5424">migrations/</text>
  <text x="300" y="442" font-size="12" fill="#222222">Flask-Migrate scripts (added on the migrations page)</text>
  <line x1="44" y1="438" x2="56" y2="438" stroke="#999999" stroke-width="1"/>
  <rect x="56" y="456" width="224" height="24" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="64" y="472" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#1c4b73">tests/</text>
  <text x="300" y="472" font-size="12" fill="#222222">conftest.py with the app, client and runner fixtures</text>
  <line x1="44" y1="468" x2="56" y2="468" stroke="#999999" stroke-width="1"/>
  <rect x="56" y="486" width="224" height="24" rx="4" fill="#fbeaea" stroke="#8a1f1f" stroke-width="1.2"/>
  <text x="64" y="502" font-size="12" font-family="'Courier New', monospace" font-weight="bold" fill="#8a1f1f">instance/</text>
  <text x="300" y="502" font-size="12" fill="#222222">per-deployment config and the SQLite file, not in version control</text>
  <line x1="44" y1="498" x2="56" y2="498" stroke="#999999" stroke-width="1"/>
  <line x1="42" y1="90" x2="42" y2="498" stroke="#999999" stroke-width="1"/>
  <line x1="68" y1="150" x2="68" y2="408" stroke="#999999" stroke-width="1"/>
  <text x="30" y="548" font-size="11" fill="#222222" font-weight="bold">Reading the figure</text>
  <text x="30" y="565" font-size="11" fill="#444444">Orange is the factory, green is code shared by the whole app, purple is a feature package, blue is project plumbing, red is deployment data.</text>
  <text x="30" y="581" font-size="11" fill="#444444">Flask looks for templates and static files inside the package, so they stay under src/bookshelf; instance/ stays outside it.</text>
</svg>
