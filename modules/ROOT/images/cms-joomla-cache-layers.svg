<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="t d">
  <title id="t">Joomla cache layers between the visitor and the database</title>
  <desc id="d">A request from a visitor passes a CDN or reverse proxy, the System - Page Cache plugin, the view and module caches of the System Cache setting, and PHP with OPcache, before reaching the database. The cache handler (file, Redis, Memcached or APCu) stores the page, view and module entries, and a separate language file cache lives in the cache folder.</desc>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2933}
    .b{fill:#eef3f8;stroke:#3b5b7a;stroke-width:1.5}
    .i{fill:#fff4dc;stroke:#a8741a;stroke-width:1.5}
    .o{fill:#e6f4ea;stroke:#2f7d4a;stroke-width:1.5}
    .h{font-weight:bold}
    .a{stroke:#3b5b7a;stroke-width:1.5;fill:none;marker-end:url(#m)}
    .d{stroke:#a8741a;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .s{font-size:11px;fill:#52606d}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b7a"/></marker></defs>
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <text x="20" y="24" class="h">Request path (left to right); each layer can answer and stop the request</text>
  <rect class="b" x="20" y="50" width="100" height="70" rx="6"/><text x="70" y="82" text-anchor="middle" class="h">Visitor</text><text x="70" y="100" text-anchor="middle" class="s">browser cache</text>
  <rect class="b" x="150" y="50" width="110" height="70" rx="6"/><text x="205" y="78" text-anchor="middle" class="h">CDN or proxy</text><text x="205" y="96" text-anchor="middle" class="s">static files,</text><text x="205" y="110" text-anchor="middle" class="s">guest pages</text>
  <rect class="i" x="290" y="50" width="110" height="70" rx="6"/><text x="345" y="78" text-anchor="middle" class="h">Page Cache</text><text x="345" y="96" text-anchor="middle" class="s">system plugin,</text><text x="345" y="110" text-anchor="middle" class="s">guests, GET</text>
  <rect class="i" x="430" y="50" width="120" height="70" rx="6"/><text x="490" y="78" text-anchor="middle" class="h">View + module</text><text x="490" y="96" text-anchor="middle" class="s">conservative or</text><text x="490" y="110" text-anchor="middle" class="s">progressive</text>
  <rect class="b" x="580" y="50" width="90" height="70" rx="6"/><text x="625" y="78" text-anchor="middle" class="h">PHP</text><text x="625" y="96" text-anchor="middle" class="s">OPcache,</text><text x="625" y="110" text-anchor="middle" class="s">lazy plugins</text>
  <rect class="o" x="690" y="50" width="70" height="70" rx="6"/><text x="725" y="90" text-anchor="middle" class="h">Database</text>
  <path class="a" d="M120 85 L150 85"/><path class="a" d="M260 85 L290 85"/><path class="a" d="M400 85 L430 85"/><path class="a" d="M550 85 L580 85"/><path class="a" d="M670 85 L690 85"/>
  <text x="20" y="168" class="h">Cache handler (Global Configuration, System tab)</text>
  <rect class="o" x="190" y="190" width="400" height="70" rx="6"/>
  <text x="390" y="212" text-anchor="middle" class="h">Storage behind page, view and module entries</text>
  <rect class="b" x="205" y="224" width="80" height="28" rx="4"/><text x="245" y="243" text-anchor="middle">File</text>
  <rect class="b" x="295" y="224" width="80" height="28" rx="4"/><text x="335" y="243" text-anchor="middle">Redis</text>
  <rect class="b" x="385" y="224" width="100" height="28" rx="4"/><text x="435" y="243" text-anchor="middle">Memcached</text>
  <rect class="b" x="495" y="224" width="80" height="28" rx="4"/><text x="535" y="243" text-anchor="middle">APCu</text>
  <path class="d" d="M345 120 L345 190"/><path class="d" d="M490 120 L490 190"/>
  <rect class="i" x="20" y="290" width="330" height="50" rx="6"/><text x="185" y="312" text-anchor="middle" class="h">Language file cache (6.0)</text><text x="185" y="329" text-anchor="middle" class="s">PHP files in the cache folder, keyed by .ini modification time</text>
  <rect class="i" x="400" y="290" width="360" height="50" rx="6"/><text x="580" y="312" text-anchor="middle" class="h">Web Asset Manager versions</text><text x="580" y="329" text-anchor="middle" class="s">?version query string lets browsers and CDNs cache assets safely</text>
</svg>
