<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-sync-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A producer barrier between a compute pass and a render pass</text>
<line x1="30" y1="60" x2="730" y2="60" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-sync-stages)"/>
<text x="730" y="52" text-anchor="end" font-size="11" fill="#374151">GPU time</text>
<text x="20" y="112" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Shadow pass</text>
<text x="20" y="128" text-anchor="start" font-size="11" fill="#374151">(no dependency)</text>
<line x1="150" y1="156" x2="730" y2="156" stroke="#E5E7EB" stroke-width="1"/>
<text x="20" y="192" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Compute encoder</text>
<text x="20" y="208" text-anchor="start" font-size="11" fill="#374151">(update dust)</text>
<line x1="150" y1="236" x2="730" y2="236" stroke="#E5E7EB" stroke-width="1"/>
<text x="20" y="272" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Main pass</text>
<text x="20" y="288" text-anchor="start" font-size="11" fill="#374151">(draws the dust)</text>
<line x1="150" y1="316" x2="730" y2="316" stroke="#E5E7EB" stroke-width="1"/>
<rect x="170" y="92" width="110" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="225.0" y="119.0" text-anchor="middle" font-size="12" fill="#374151">vertex</text>
<rect x="282" y="92" width="170" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="367.0" y="119.0" text-anchor="middle" font-size="12" fill="#374151">fragment</text>
<rect x="170" y="172" width="150" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="245.0" y="191.5" text-anchor="middle" font-size="12" fill="#374151">dispatch</text>
<text x="245.0" y="206.5" text-anchor="middle" font-size="12" fill="#374151">update_particles</text>
<rect x="322" y="252" width="150" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="397.0" y="271.5" text-anchor="middle" font-size="12" fill="#92400E">vertex</text>
<text x="397.0" y="286.5" text-anchor="middle" font-size="12" fill="#92400E">(scene and dust)</text>
<rect x="474" y="252" width="150" height="46" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="549.0" y="279.0" text-anchor="middle" font-size="12" fill="#374151">fragment</text>
<line x1="321" y1="160" x2="321" y2="304" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="320" y1="218" x2="322" y2="250" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-sync-stages)"/>
<text x="330" y="152" text-anchor="start" font-size="11" fill="#92400E" font-weight="bold">barrier</text>
<text x="380" y="332" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">barrier(afterStages: .dispatch, beforeQueueStages: .vertex, visibilityOptions: .device)</text>
<rect x="30" y="350" width="700" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="372" text-anchor="middle" font-size="11" fill="#1F2937">The vertex stage of the later pass waits for the dispatch; its fragment stage is ordered after its own vertex stage.</text>
<text x="380" y="388" text-anchor="middle" font-size="11" fill="#1F2937">The shadow pass has no dependency and overlaps the compute work on the GPU.</text>
<text x="380" y="404" text-anchor="middle" font-size="11" fill="#92400E">Without the barrier the vertex shader could read particle positions that the dispatch is still writing.</text>
</svg>
