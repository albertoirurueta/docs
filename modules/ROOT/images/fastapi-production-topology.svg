<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A production topology for the Bookshelf API</text>
  <text x="380" y="44" font-size="12" fill="#666666" text-anchor="middle">replicate containers, not workers: one Uvicorn process per container</text>

  <!-- Clients -->
  <rect x="20" y="170" width="100" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="70" y="198" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Clients</text>
  <text x="70" y="216" font-size="11" fill="#444444" text-anchor="middle">browsers, apps,</text>
  <text x="70" y="230" font-size="11" fill="#444444" text-anchor="middle">other services</text>

  <!-- TLS proxy -->
  <rect x="170" y="150" width="150" height="110" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="245" y="176" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">TLS proxy</text>
  <text x="245" y="194" font-size="11" fill="#444444" text-anchor="middle">Traefik, Caddy, Nginx</text>
  <text x="245" y="210" font-size="11" fill="#444444" text-anchor="middle">certificates + renewal</text>
  <text x="245" y="226" font-size="11" fill="#444444" text-anchor="middle">X-Forwarded-* headers</text>
  <text x="245" y="246" font-size="10" fill="#666666" text-anchor="middle">only component on port 443</text>

  <!-- Containers -->
  <rect x="380" y="62" width="200" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="480" y="82" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container 1</text>
  <rect x="400" y="92" width="160" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="480" y="110" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">fastapi run</text>
  <text x="480" y="125" font-size="10" fill="#666666" text-anchor="middle">1 Uvicorn process</text>

  <rect x="380" y="172" width="200" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="480" y="192" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container 2</text>
  <rect x="400" y="202" width="160" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="480" y="220" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">fastapi run</text>
  <text x="480" y="235" font-size="10" fill="#666666" text-anchor="middle">1 Uvicorn process</text>

  <rect x="380" y="282" width="200" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="480" y="302" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Container N</text>
  <rect x="400" y="312" width="160" height="42" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="480" y="330" font-size="11" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">fastapi run</text>
  <text x="480" y="345" font-size="10" fill="#666666" text-anchor="middle">scaled up or down by the platform</text>

  <!-- Database -->
  <rect x="640" y="150" width="100" height="110" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="690" y="184" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Database</text>
  <text x="690" y="202" font-size="11" fill="#444444" text-anchor="middle">PostgreSQL</text>
  <text x="690" y="218" font-size="10" fill="#666666" text-anchor="middle">managed service</text>
  <text x="690" y="232" font-size="10" fill="#666666" text-anchor="middle">or its own</text>
  <text x="690" y="246" font-size="10" fill="#666666" text-anchor="middle">container</text>

  <!-- Arrows: clients -> proxy -->
  <line x1="120" y1="205" x2="164" y2="205" stroke="#444444" stroke-width="1.6"/>
  <polygon points="170,205 162,200 162,210" fill="#444444"/>
  <text x="145" y="196" font-size="10" fill="#666666" text-anchor="middle">HTTPS</text>

  <!-- proxy -> containers -->
  <line x1="320" y1="190" x2="374" y2="105" stroke="#444444" stroke-width="1.4"/>
  <polygon points="380,100 370,102 376,110" fill="#444444"/>
  <line x1="320" y1="205" x2="374" y2="215" stroke="#444444" stroke-width="1.4"/>
  <polygon points="380,216 372,210 371,220" fill="#444444"/>
  <line x1="320" y1="220" x2="374" y2="322" stroke="#444444" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="380,326 370,324 377,316" fill="#444444"/>
  <text x="322" y="288" font-size="10" fill="#666666" text-anchor="middle">plain HTTP,</text>
  <text x="322" y="301" font-size="10" fill="#666666" text-anchor="middle">balanced</text>

  <!-- containers -> database -->
  <line x1="580" y1="105" x2="634" y2="180" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="640,185 630,183 636,175" fill="#2f5424"/>
  <line x1="580" y1="215" x2="634" y2="212" stroke="#2f5424" stroke-width="1.4"/>
  <polygon points="640,212 632,207 632,217" fill="#2f5424"/>
  <line x1="580" y1="325" x2="634" y2="238" stroke="#2f5424" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="640,232 631,236 638,244" fill="#2f5424"/>
  <text x="610" y="164" font-size="10" fill="#666666" text-anchor="middle">SQL</text>

  <!-- Pre-start job -->
  <rect x="170" y="318" width="150" height="50" fill="#ffffff" stroke="#8a1f1f" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="245" y="338" font-size="12" font-weight="bold" fill="#8a1f1f" text-anchor="middle">Pre-start job</text>
  <text x="245" y="354" font-size="10" fill="#666666" text-anchor="middle">migrations, run once</text>
  <path d="M245,368 L245,400 L690,400 L690,266" fill="none" stroke="#8a1f1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="690,260 685,270 695,270" fill="#8a1f1f"/>
  <text x="470" y="414" font-size="10" fill="#666666" text-anchor="middle">before the containers start</text>
</svg>
