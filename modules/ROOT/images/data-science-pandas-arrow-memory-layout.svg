<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Three memory layouts for a column with a missing value</title>
  <desc id="d">The same column of three values, one of them missing, stored three ways: a NumPy float64 array with NaN, an object array of pointers to Python objects, and an Arrow array made of a validity bitmap and a packed values buffer.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">The column [1, 2, missing] in memory</text>
<text x="24" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">NumPy float64</text><text x="24" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">missing = NaN, a value inside the data</text>
<rect x="300" y="64" width="120" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="360.0" y="88" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1.0</text>
<rect x="430" y="64" width="120" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="490.0" y="88" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">2.0</text>
<rect x="560" y="64" width="120" height="38" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="620.0" y="88" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">NaN</text>
<text x="24" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">one buffer, 8 bytes per row</text>
<text x="24" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">NumPy object</text><text x="24" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">missing = a Python None or NaN object</text>
<rect x="300" y="176" width="120" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="360.0" y="200" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">ptr</text>
<rect x="430" y="176" width="120" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="490.0" y="200" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">ptr</text>
<rect x="560" y="176" width="120" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="620.0" y="200" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">ptr</text>
<line x1="360" y1="214" x2="360" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="240" width="120" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="360.0" y="264" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">int 1</text>
<line x1="490" y1="214" x2="490" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="430" y="240" width="120" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="490.0" y="264" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">int 2</text>
<line x1="620" y1="214" x2="620" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="560" y="240" width="120" height="38" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="620.0" y="264" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">None</text>
<text x="24" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">pointers to separate heap objects</text>
<text x="24" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Arrow int64</text><text x="24" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">missing = a cleared bit in the bitmap</text>
<rect x="300" y="296" width="36" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="318.0" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
<rect x="340" y="296" width="36" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="358.0" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
<rect x="380" y="296" width="36" height="38" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="398.0" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">0</text>
<text x="300" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">validity bitmap</text>
<rect x="440" y="296" width="72" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="476" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
<rect x="516" y="296" width="72" height="38" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="552" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">2</text>
<rect x="592" y="296" width="72" height="38" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="628" y="320" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">(unused)</text>
<text x="440" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">values buffer, packed integers</text>
<text x="24" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Integers stay integers: no cast to float64 and no per-row Python objects.</text>
</svg>