<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a Matplotlib figure</title>
  <desc id="d">A Figure rectangle contains one Axes. The Axes holds a title, an x axis with label and ticks, a y axis with label and ticks, a plotted line, scatter markers and a legend. Seven numbered markers point at these parts.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Anatomy of a Matplotlib figure</text>
  <!-- Figure -->
  <rect x="24" y="54" width="520" height="346" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="36" y="76" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">Figure</text>
  <!-- Axes -->
  <rect x="96" y="112" width="410" height="226" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="104" y="132" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">Axes</text>
  <!-- title -->
  <text x="301" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Explicit Figure and Axes</text>
  <!-- grid -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.5">
    <line x1="96" y1="168" x2="506" y2="168"/><line x1="96" y1="225" x2="506" y2="225"/><line x1="96" y1="282" x2="506" y2="282"/>
  </g>
  <!-- data -->
  <path d="M104 290 C170 120 230 130 300 225 S 430 330 498 160" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <g fill="#B45309" stroke="#B45309">
    <circle cx="140" cy="205" r="5"/><circle cx="215" cy="150" r="5"/><circle cx="300" cy="225" r="5"/><circle cx="385" cy="305" r="5"/><circle cx="465" cy="215" r="5"/>
  </g>
  <!-- legend -->
  <rect x="384" y="122" width="114" height="52" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="392" y1="140" x2="418" y2="140" stroke="#1D4ED8" stroke-width="3"/>
  <circle cx="405" cy="160" r="4" fill="#B45309"/>
  <text x="424" y="145" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">sin(x)</text>
  <text x="424" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">samples</text>
  <!-- ticks -->
  <g stroke="#0F172A" stroke-width="2">
    <line x1="96" y1="338" x2="96" y2="346"/><line x1="198" y1="338" x2="198" y2="346"/><line x1="301" y1="338" x2="301" y2="346"/><line x1="404" y1="338" x2="404" y2="346"/><line x1="506" y1="338" x2="506" y2="346"/>
    <line x1="88" y1="338" x2="96" y2="338"/><line x1="88" y1="282" x2="96" y2="282"/><line x1="88" y1="225" x2="96" y2="225"/><line x1="88" y1="168" x2="96" y2="168"/><line x1="88" y1="112" x2="96" y2="112"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="96" y="362">0</text><text x="198" y="362">2.5</text><text x="301" y="362">5</text><text x="404" y="362">7.5</text><text x="506" y="362">10</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="82" y="342">-1</text><text x="82" y="286">-0.5</text><text x="82" y="229">0</text><text x="82" y="172">0.5</text><text x="82" y="116">1</text>
  </g>
  <text x="301" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">x (radians)</text>
  <text transform="translate(40 225) rotate(-90)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">amplitude</text>
  <!-- callouts -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="570" cy="70" r="11" fill="#0F172A"/><text x="570" y="75">1</text>
    <circle cx="570" cy="130" r="11" fill="#0F172A"/><text x="570" y="135">2</text>
    <circle cx="570" cy="190" r="11" fill="#0F172A"/><text x="570" y="195">3</text>
    <circle cx="570" cy="250" r="11" fill="#0F172A"/><text x="570" y="255">4</text>
    <circle cx="570" cy="310" r="11" fill="#0F172A"/><text x="570" y="315">5</text>
    <circle cx="570" cy="370" r="11" fill="#0F172A"/><text x="570" y="375">6</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M558 70 L 548 70"/>
    <path d="M558 130 L 510 130 L 496 138"/>
    <path d="M558 190 L 520 190 L 478 200"/>
    <path d="M558 250 L 520 250 L 510 240"/>
    <path d="M558 310 L 534 310 L 520 350 L 508 350"/>
    <path d="M558 370 L 400 384"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">
    <text x="588" y="74">Figure</text>
    <text x="588" y="134">Legend</text>
    <text x="588" y="194">Line and markers</text>
    <text x="588" y="254">Axes</text>
    <text x="588" y="314">Ticks and labels</text>
    <text x="588" y="374">Axis labels</text>
  </g>
</svg>
