<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenType features: before and after</text>
  <rect x="20" y="50" width="330" height="200" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="185" y="74" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">Before (defaults)</text>
  <text x="40" y="112" font-size="13" fill="#374151">Price column:</text>
  <text x="180" y="112" font-size="16" fill="#1F2937">1 1 1 / 1.007</text>
  <text x="40" y="150" font-size="13" fill="#374151">Fraction:</text>
  <text x="180" y="150" font-size="16" fill="#1F2937">3/4 of the library</text>
  <text x="40" y="188" font-size="13" fill="#374151">Ligature:</text>
  <text x="180" y="188" font-size="16" fill="#1F2937">The first office flight</text>
  <text x="40" y="226" font-size="13" fill="#374151">Small caps:</text>
  <text x="180" y="226" font-size="16" fill="#1F2937">ISBN and PDF</text>
  <rect x="410" y="50" width="330" height="200" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
  <text x="575" y="74" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">After (features on)</text>
  <text x="430" y="112" font-size="13" fill="#374151">Tabular figures:</text>
  <text x="570" y="112" font-size="16" fill="#1F2937" letter-spacing="3.2">1111 / 1.007</text>
  <text x="430" y="150" font-size="13" fill="#374151">Fractions:</text>
  <text x="570" y="150" font-size="16" fill="#1F2937"><tspan>3</tspan><tspan font-size="10" dy="-6">/</tspan><tspan dy="6">4</tspan> of the library</text>
  <text x="430" y="188" font-size="13" fill="#374151">Ligatures:</text>
  <text x="570" y="188" font-size="16" fill="#1F2937">The first office flight</text>
  <text x="430" y="226" font-size="13" fill="#374151">Small caps:</text>
  <text x="570" y="226" font-size="13" font-weight="bold" fill="#1F2937" letter-spacing="1">ISBN AND PDF</text>
  <path d="M352,150 L408,150" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="380" y="276" font-size="12" fill="#374151" text-anchor="middle">Schematic only: what changes depends on which features the chosen font includes; unsupported ones are greyed out.</text>
</svg>
