<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Where three imputers place a missing value</title>
  <desc id="d">A scatter plot of a column y that grows with a column x. One point has a known x but a missing y. Mean imputation puts it on a horizontal line at the column mean, far from the trend. K-nearest-neighbours imputation averages the y of the two points with the closest x. Iterative imputation places it on a regression line fitted to the observed points.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Where three imputers place a missing value</text>
  <rect x="60" y="56" width="400" height="300" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="260.0" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">column x (observed)</text>
  <text x="22" y="206.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" transform="rotate(-90 22 206.0)">column y (one value missing)</text>
  <path d="M80.0 310.6 L440.0 69.4" stroke="#6D28D9" stroke-width="2" fill="none"/>
  <path d="M60 196.0 L460 196.0" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M340.0 56 L340.0 356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <circle cx="100.0" cy="290.0" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="124.0" cy="288.8" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="148.0" cy="259.1" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="176.0" cy="256.7" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="200.0" cy="228.5" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="224.0" cy="204.8" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="252.0" cy="203.9" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="276.0" cy="180.2" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="300.0" cy="155.0" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="328.0" cy="155.6" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="352.0" cy="122.9" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="380.0" cy="113.0" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="404.0" cy="89.3" r="5" fill="#0F766E" stroke="#0F172A" stroke-width="1"/>
  <circle cx="328.0" cy="155.6" r="9" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="352.0" cy="122.9" r="9" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <path d="M340.0 187.0 L349.0 203.0 L331.0 203.0 z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="332.0" y="131.2" width="16" height="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <path d="M340.0 127.5 L349.0 136.5 L340.0 145.5 L331.0 136.5 z" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <circle cx="340.0" cy="137.0" r="4" fill="none" stroke="#BE123C" stroke-width="2"/>
  <path d="M502.0 71.0 L511.0 87.0 L493.0 87.0 z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="524" y="78" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Mean: 5.33</text>
  <text x="524" y="98" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ignores x entirely</text>
  <rect x="494.0" y="138.0" width="16" height="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="524" y="144" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">KNN, 2 neighbours: 7.23</text>
  <text x="524" y="164" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">averages nearest rows</text>
  <path d="M502.0 203.0 L511.0 212.0 L502.0 221.0 L493.0 212.0 z" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="524" y="210" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Iterative: 7.32</text>
  <text x="524" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">uses the x to y trend</text>
  <circle cx="502" cy="278" r="4" fill="none" stroke="#BE123C" stroke-width="2"/>
  <text x="524" y="276" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">True value: 7.30</text>
  <text x="524" y="296" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">known only in this simulation</text>
  <circle cx="502" cy="344" r="9" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <text x="524" y="342" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">The two closest rows</text>
</svg>
