<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Preprocessing before the split leaks information; fitting it on the training part only does not</title>
  <desc id="d">Two rows of boxes. The wrong row fits a scaler or feature selector on all rows, then splits into train and test. The right row splits first, fits the preprocessing on the training rows only, and applies the fitted preprocessing to the test rows.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Where the preprocessing is fitted</text>
  <rect x="24" y="52" width="672" height="150" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/>
  <circle cx="46" cy="76" r="11" fill="#0F172A"/><text x="46" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="66" y="81" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#BE123C">Wrong: fit on all rows, then split</text>
  <rect x="40" y="108" width="110" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="95" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">All rows</text>
  <text x="95" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">X and y</text>
  <rect x="200" y="108" width="150" height="64" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="275" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Scaler or selector</text>
  <text x="275" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">fit on all rows</text>
  <rect x="400" y="108" width="110" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="455" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Split</text>
  <text x="455" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">train | test</text>
  <rect x="560" y="108" width="120" height="64" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="620" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Model score</text>
  <text x="620" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#BE123C">too optimistic</text>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 140 L196 140"/><path d="M350 140 L396 140"/><path d="M510 140 L556 140"/>
  </g>
  <rect x="24" y="218" width="672" height="168" rx="6" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <circle cx="46" cy="242" r="11" fill="#0F172A"/><text x="46" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="66" y="247" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F766E">Right: split first, fit on the training rows only</text>
  <rect x="40" y="274" width="110" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="95" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">All rows</text>
  <text x="95" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">X and y</text>
  <rect x="200" y="256" width="110" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="255" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Train rows</text>
  <rect x="200" y="320" width="110" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="255" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Test rows</text>
  <rect x="360" y="256" width="150" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="435" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Pipeline.fit</text>
  <rect x="360" y="320" width="150" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="435" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Fitted transform</text>
  <rect x="560" y="320" width="120" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="620" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Honest score</text>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 300 L175 300 L175 276 L196 276"/><path d="M150 312 L175 312 L175 340 L196 340"/>
    <path d="M310 276 L356 276"/><path d="M310 340 L356 340"/>
    <path d="M510 340 L556 340"/>
    <path d="M435 296 L435 316"/>
  </g>
</svg>
