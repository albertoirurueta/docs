<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="720" height="340" fill="#FFFFFF"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Non-destructive and destructive vector operations</text>
  <rect x="20" y="50" width="320" height="240" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <rect x="380" y="50" width="320" height="240" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="180" y="76" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">Reversible by ungrouping</text>
  <text x="540" y="76" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">Permanent: undo or version history</text>
  <g font-size="12" fill="#374151">
    <text x="40" y="108">Boolean operations (Union, Subtract,</text><text x="40" y="124">Intersect, Exclude): layers stay inside</text><text x="40" y="140">the group, right-click &gt; Ungroup restores them</text>
    <text x="40" y="176">Bend, add and move points in vector</text><text x="40" y="192">edit mode: ordinary edits, undo as usual</text>
    <text x="400" y="108">Flatten: merges layers into one path</text>
    <text x="400" y="132">Shape builder: merges, extracts, subtracts</text>
    <text x="400" y="156">Offset vector: grows or shrinks the path</text>
    <text x="400" y="180">Simplify vector: removes points</text>
    <text x="400" y="204">Outline stroke: turns a stroke into a shape</text>
  </g>
  <rect x="150" y="226" width="420" height="44" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="360" y="246" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Habit: duplicate the layer (or keep a version) before a permanent step</text>
  <text x="360" y="262" font-size="12" fill="#374151" text-anchor="middle">Cmd+Z / Ctrl+Z recovers right after; version history recovers later</text>
  <text x="360" y="322" font-size="11" fill="#6B7280" text-anchor="middle">Outline stroke is listed as permanent by analogy; the stroke article does not state it explicitly.</text>
</svg>
