<svg viewBox="0 0 800 384" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="384" fill="#ffffff"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Finding a word: row scan vs. inverted index</text>
  <text x="204" y="50" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">WHERE body LIKE '%latency%'</text>
  <text x="596" y="50" font-size="12" fill="#666666" text-anchor="middle" font-family="'Courier New', monospace">match: "latency"</text>

  <!-- ===================== LEFT LANE: relational row scan ===================== -->
  <rect x="14" y="66" width="376" height="264" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <rect x="14" y="66" width="376" height="24" fill="#2f5424"/>
  <text x="24" y="83" font-size="11" font-weight="bold" fill="#ffffff">RELATIONAL -- forward index</text>

  <!-- row boxes: the whole table body, read start to finish -->
  <g font-family="'Courier New', monospace" font-size="10.5">
    <rect x="72" y="100" width="308" height="28" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
    <text x="80" y="118" fill="#222222">1  "p99 latency spiked at 08:00"</text>

    <rect x="72" y="133" width="308" height="28" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="80" y="151" fill="#555555">2  "cache warm, all checks green"</text>

    <rect x="72" y="166" width="308" height="28" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="80" y="184" fill="#555555">3  "shard 7 rebalanced overnight"</text>

    <rect x="72" y="199" width="308" height="28" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
    <text x="80" y="217" fill="#222222">4  "latency budget exceeded"</text>

    <rect x="72" y="232" width="308" height="28" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="80" y="250" fill="#555555">5  "index build finished in 4m"</text>

    <rect x="72" y="265" width="308" height="28" fill="#ffffff" stroke="#2f5424" stroke-width="1.4"/>
    <text x="80" y="283" fill="#222222">6  "tail latency traced to GC"</text>
  </g>

  <!-- arrow sweeping top-to-bottom through every row -->
  <g stroke="#2f5424" stroke-width="1.8" fill="#2f5424">
    <line x1="48" y1="102" x2="48" y2="284"/>
    <polygon points="43,282 53,282 48,292" stroke="none"/>
  </g>
  <text x="34" y="98" font-size="9.5" fill="#2f5424" font-style="italic">read</text>

  <text x="24" y="308" font-size="10" fill="#666666">Every row is examined; cost grows linearly with</text>
  <text x="24" y="321" font-size="10" fill="#666666">table size, and matches come back unordered.</text>

  <!-- ===================== RIGHT LANE: search-engine inverted index ===================== -->
  <rect x="410" y="66" width="376" height="264" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <rect x="410" y="66" width="376" height="24" fill="#1c4b73"/>
  <text x="420" y="83" font-size="11" font-weight="bold" fill="#ffffff">SEARCH ENGINE -- inverted index</text>

  <!-- term dictionary -->
  <rect x="424" y="104" width="196" height="104" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="434" y="120" font-size="9.5" fill="#666666">term dictionary</text>
  <g font-family="'Courier New', monospace" font-size="11">
    <rect x="430" y="128" width="184" height="20" fill="#e4eef6"/>
    <text x="436" y="142" fill="#1c4b73" font-weight="bold">latency -&gt; [3, 7, 12]</text>
    <text x="436" y="166" fill="#222222">index   -&gt; [1, 3]</text>
    <text x="436" y="190" fill="#222222">shard   -&gt; [7]</text>
  </g>

  <!-- arrow from the single matched term straight to the doc IDs -->
  <g stroke="#1c4b73" stroke-width="1.8" fill="#1c4b73">
    <line x1="620" y1="138" x2="664" y2="138"/>
    <polygon points="662,133 662,143 670,138" stroke="none"/>
  </g>

  <!-- matching doc IDs -->
  <rect x="672" y="118" width="102" height="40" fill="#ffffff" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="723" y="143" font-size="12" fill="#222222" text-anchor="middle" font-family="'Courier New', monospace">[3, 7, 12]</text>

  <text x="424" y="240" font-size="10" fill="#666666">One dictionary lookup returns the posting list,</text>
  <text x="424" y="253" font-size="10" fill="#666666">independent of corpus size; hits are then</text>
  <text x="424" y="266" font-size="10" fill="#666666">ordered by BM25 relevance before they are returned.</text>

  <!-- ===================== bottom strip: takeaway ===================== -->
  <line x1="14" y1="348" x2="786" y2="348" stroke="#cccccc" stroke-width="1"/>
  <text x="400" y="368" font-size="11" fill="#666666" text-anchor="middle">The inverted index trades write-time analysis and extra storage for near-constant query cost and ranked results.</text>
</svg>
