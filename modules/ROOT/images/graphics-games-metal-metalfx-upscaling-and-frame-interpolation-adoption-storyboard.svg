<text x="380" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Steps 1 and 2 run at load or when the resolution changes; steps 3 to 5 run every frame.</text>
<text x="380" y="305" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">On a resize or a quality change, create a new scaler: its sizes are fixed at creation.</text>
