<svg viewBox="0 0 860 460" width="860" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>

  <text x="430" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">The Cosmos DB consistency spectrum</text>
  <text x="430" y="44" text-anchor="middle" font-size="11.5" fill="#5f6368">Five levels between strict correctness and lowest latency/highest availability</text>

  <!-- gradient bar -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5fb4"/>
      <stop offset="25%" stop-color="#3b82c4"/>
      <stop offset="50%" stop-color="#7a8fae"/>
      <stop offset="75%" stop-color="#c99a4a"/>
      <stop offset="100%" stop-color="#f29900"/>
    </linearGradient>
  </defs>
  <rect x="40" y="64" width="780" height="10" rx="5" fill="url(#spectrum)"/>

  <text x="40" y="92" font-size="11" font-weight="700" fill="#123a70">Strongest consistency</text>
  <text x="820" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#7a4a00">Lowest latency / highest availability</text>

  <!-- 5 columns -->
  <!-- centers at 118, 274, 430, 586, 742 spaced across 40-820 -->
  <g font-size="10" text-anchor="middle">
    <!-- Strong -->
    <line x1="118" y1="74" x2="118" y2="110" stroke="#1a5fb4" stroke-width="2"/>
    <rect x="48" y="110" width="140" height="26" rx="4" fill="#e8eef7" stroke="#1a5fb4" stroke-width="1.4"/>
    <text x="118" y="127" font-weight="700" fill="#123a70">Strong</text>

    <!-- Bounded staleness -->
    <line x1="274" y1="74" x2="274" y2="110" stroke="#3b82c4" stroke-width="2"/>
    <rect x="204" y="110" width="140" height="26" rx="4" fill="#eaf1fb" stroke="#3b82c4" stroke-width="1.4"/>
    <text x="274" y="127" font-weight="700" fill="#1a4a80">Bounded Staleness</text>

    <!-- Session -->
    <line x1="430" y1="74" x2="430" y2="110" stroke="#7a8fae" stroke-width="2"/>
    <rect x="360" y="110" width="140" height="26" rx="4" fill="#eef0f3" stroke="#7a8fae" stroke-width="1.4"/>
    <text x="430" y="127" font-weight="700" fill="#3d4a5c">Session</text>

    <!-- Consistent Prefix -->
    <line x1="586" y1="74" x2="586" y2="110" stroke="#c99a4a" stroke-width="2"/>
    <rect x="516" y="110" width="140" height="26" rx="4" fill="#faf1de" stroke="#c99a4a" stroke-width="1.4"/>
    <text x="586" y="127" font-weight="700" fill="#7a5a1a">Consistent Prefix</text>

    <!-- Eventual -->
    <line x1="742" y1="74" x2="742" y2="110" stroke="#f29900" stroke-width="2"/>
    <rect x="672" y="110" width="140" height="26" rx="4" fill="#fbe8cf" stroke="#f29900" stroke-width="1.4"/>
    <text x="742" y="127" font-weight="700" fill="#7a4a00">Eventual</text>
  </g>

  <!-- Detail cards -->
  <g font-size="9.3">
    <!-- Strong -->
    <rect x="48" y="150" width="140" height="270" rx="6" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.2"/>
    <text x="118" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#123a70">Guarantee</text>
    <text x="60" y="184" fill="#1a1a1a">Reads always see</text>
    <text x="60" y="196" fill="#1a1a1a">the most recent</text>
    <text x="60" y="208" fill="#1a1a1a">committed write.</text>
    <text x="118" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#123a70">Latency</text>
    <text x="60" y="246" fill="#1a1a1a">Highest read</text>
    <text x="60" y="258" fill="#1a1a1a">latency (quorum</text>
    <text x="60" y="270" fill="#1a1a1a">reads).</text>
    <text x="118" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#123a70">Availability</text>
    <text x="60" y="308" fill="#1a1a1a">Not available for</text>
    <text x="60" y="320" fill="#1a1a1a">multi-region</text>
    <text x="60" y="332" fill="#1a1a1a">writes.</text>
    <text x="118" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#123a70">Typical use</text>
    <text x="60" y="370" fill="#1a1a1a">Financial ledgers,</text>
    <text x="60" y="382" fill="#1a1a1a">inventory counts.</text>

    <!-- Bounded staleness -->
    <rect x="204" y="150" width="140" height="270" rx="6" fill="#ffffff" stroke="#3b82c4" stroke-width="1.2"/>
    <text x="274" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a80">Guarantee</text>
    <text x="216" y="184" fill="#1a1a1a">Reads lag writes by</text>
    <text x="216" y="196" fill="#1a1a1a">at most K versions</text>
    <text x="216" y="208" fill="#1a1a1a">or T time.</text>
    <text x="274" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a80">Latency</text>
    <text x="216" y="246" fill="#1a1a1a">Lower than Strong;</text>
    <text x="216" y="258" fill="#1a1a1a">configurable K/T.</text>
    <text x="274" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a80">Availability</text>
    <text x="216" y="308" fill="#1a1a1a">Supports multi-</text>
    <text x="216" y="320" fill="#1a1a1a">region, single-</text>
    <text x="216" y="332" fill="#1a1a1a">write-region.</text>
    <text x="274" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a80">Typical use</text>
    <text x="216" y="370" fill="#1a1a1a">Leaderboards with</text>
    <text x="216" y="382" fill="#1a1a1a">a bounded lag SLA.</text>

    <!-- Session -->
    <rect x="360" y="150" width="140" height="270" rx="6" fill="#ffffff" stroke="#7a8fae" stroke-width="1.2"/>
    <text x="430" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4a5c">Guarantee</text>
    <text x="372" y="184" fill="#1a1a1a">A single client's</text>
    <text x="372" y="196" fill="#1a1a1a">own writes are seen</text>
    <text x="372" y="208" fill="#1a1a1a">by its own reads.</text>
    <text x="430" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4a5c">Latency</text>
    <text x="372" y="246" fill="#1a1a1a">Low -- single-</text>
    <text x="372" y="258" fill="#1a1a1a">replica reads.</text>
    <text x="430" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4a5c">Availability</text>
    <text x="372" y="308" fill="#1a1a1a">Full multi-region</text>
    <text x="372" y="320" fill="#1a1a1a">read/write.</text>
    <text x="430" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4a5c">Typical use</text>
    <text x="372" y="370" fill="#1a1a1a">Default choice --</text>
    <text x="372" y="382" fill="#1a1a1a">most apps (Bookshelf).</text>

    <!-- Consistent Prefix -->
    <rect x="516" y="150" width="140" height="270" rx="6" fill="#ffffff" stroke="#c99a4a" stroke-width="1.2"/>
    <text x="586" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#7a5a1a">Guarantee</text>
    <text x="528" y="184" fill="#1a1a1a">Reads never see</text>
    <text x="528" y="196" fill="#1a1a1a">writes out of order</text>
    <text x="528" y="208" fill="#1a1a1a">(no gaps).</text>
    <text x="586" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#7a5a1a">Latency</text>
    <text x="528" y="246" fill="#1a1a1a">Low -- single-</text>
    <text x="528" y="258" fill="#1a1a1a">replica reads.</text>
    <text x="586" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#7a5a1a">Availability</text>
    <text x="528" y="308" fill="#1a1a1a">Full multi-region</text>
    <text x="528" y="320" fill="#1a1a1a">read/write.</text>
    <text x="586" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#7a5a1a">Typical use</text>
    <text x="528" y="370" fill="#1a1a1a">Order-status feeds,</text>
    <text x="528" y="382" fill="#1a1a1a">social timelines.</text>

    <!-- Eventual -->
    <rect x="672" y="150" width="140" height="270" rx="6" fill="#ffffff" stroke="#f29900" stroke-width="1.2"/>
    <text x="742" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Guarantee</text>
    <text x="684" y="184" fill="#1a1a1a">Replicas converge</text>
    <text x="684" y="196" fill="#1a1a1a">eventually; no</text>
    <text x="684" y="208" fill="#1a1a1a">ordering guarantee.</text>
    <text x="742" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Latency</text>
    <text x="684" y="246" fill="#1a1a1a">Lowest -- any</text>
    <text x="684" y="258" fill="#1a1a1a">replica, any order.</text>
    <text x="742" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Availability</text>
    <text x="684" y="308" fill="#1a1a1a">Highest; best</text>
    <text x="684" y="320" fill="#1a1a1a">multi-region fit.</text>
    <text x="742" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a00">Typical use</text>
    <text x="684" y="370" fill="#1a1a1a">View/like counters,</text>
    <text x="684" y="382" fill="#1a1a1a">non-critical caches.</text>
  </g>

  <text x="430" y="440" text-anchor="middle" font-size="9.5" fill="#5f6368">Strong and Bounded Staleness read from a quorum of replicas (higher RU cost per read); Session, Consistent
    Prefix and Eventual read a single replica.</text>
</svg>
