<svg viewBox="0 0 880 510" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="510" fill="#ffffff"/>
  <text x="440" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">PHP's type lattice</text>
  <text x="440" y="46" font-size="12" fill="#666666" text-anchor="middle">from the top type mixed down to the bottom type never; a line means "is a subtype of"</text>

  <!-- top -->
  <rect x="370" y="66" width="140" height="40" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="440" y="92" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">mixed</text>

  <!-- level 2 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="150" width="300" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="180" y="168" font-weight="bold" fill="#1c4b73">scalar</text>
    <text x="180" y="183" font-size="10" fill="#444444">(not a declarable type: int|float|string|bool)</text>

    <rect x="350" y="150" width="100" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="400" y="175" font-weight="bold" fill="#1c4b73">array</text>

    <rect x="470" y="150" width="190" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="565" y="175" font-weight="bold" fill="#1c4b73">object</text>

    <rect x="680" y="150" width="80" height="40" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
    <text x="720" y="168" fill="#222222">resource</text>
    <text x="720" y="183" font-size="10" fill="#666666">not declarable</text>

    <rect x="780" y="150" width="70" height="40" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="815" y="175" font-weight="bold" fill="#1c4b73">null</text>
  </g>
  <g stroke="#444444" stroke-width="1.3">
    <line x1="440" y1="106" x2="180" y2="150"/>
    <line x1="440" y1="106" x2="400" y2="150"/>
    <line x1="440" y1="106" x2="565" y2="150"/>
    <line x1="440" y1="106" x2="720" y2="150"/>
    <line x1="440" y1="106" x2="815" y2="150"/>
  </g>

  <!-- level 3 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="240" width="60" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="60" y="263" fill="#1c4b73">int</text>
    <rect x="100" y="240" width="60" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="130" y="263" fill="#1c4b73">float</text>
    <rect x="170" y="240" width="70" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="205" y="263" fill="#1c4b73">string</text>
    <rect x="250" y="240" width="80" height="36" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="290" y="263" fill="#1c4b73">bool</text>

    <rect x="470" y="240" width="190" height="56" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="565" y="260" fill="#1c4b73">class-types</text>
    <text x="565" y="276" font-size="10" fill="#444444">classes, interfaces, enums</text>
    <text x="565" y="289" font-size="10" fill="#444444">self, parent, static</text>
  </g>
  <g stroke="#444444" stroke-width="1.3">
    <line x1="180" y1="190" x2="60" y2="240"/>
    <line x1="180" y1="190" x2="130" y2="240"/>
    <line x1="180" y1="190" x2="205" y2="240"/>
    <line x1="180" y1="190" x2="290" y2="240"/>
    <line x1="565" y1="190" x2="565" y2="240"/>
  </g>

  <!-- level 4: singletons -->
  <g font-size="13" text-anchor="middle">
    <rect x="248" y="320" width="40" height="32" fill="#fff4e0" stroke="#a05a00" stroke-width="1.4"/>
    <text x="268" y="341" fill="#a05a00">true</text>
    <rect x="294" y="320" width="44" height="32" fill="#fff4e0" stroke="#a05a00" stroke-width="1.4"/>
    <text x="316" y="341" fill="#a05a00">false</text>
  </g>
  <g stroke="#444444" stroke-width="1.3">
    <line x1="290" y1="276" x2="268" y2="320"/>
    <line x1="290" y1="276" x2="316" y2="320"/>
  </g>

  <!-- aliases -->
  <rect x="680" y="230" width="170" height="120" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="765" y="250" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">Aliases and pseudo-types</text>
  <text x="694" y="272" font-size="11" fill="#222222">iterable = array|Traversable</text>
  <text x="694" y="290" font-size="11" fill="#222222">callable = Closure, invokable</text>
  <text x="694" y="304" font-size="11" fill="#222222">  objects, 'strlen',</text>
  <text x="694" y="318" font-size="11" fill="#222222">  [$obj, 'method'], …</text>
  <text x="694" y="338" font-size="10" fill="#666666">callable: not for properties</text>
  <!-- bottom -->
  <rect x="370" y="420" width="140" height="40" fill="#5a1c1c" stroke="#5a1c1c" stroke-width="1.6"/>
  <text x="440" y="446" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">never</text>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="3,3">
    <line x1="440" y1="420" x2="60" y2="276"/>
    <line x1="440" y1="420" x2="130" y2="276"/>
    <line x1="440" y1="420" x2="205" y2="276"/>
    <line x1="440" y1="420" x2="268" y2="352"/>
    <line x1="440" y1="420" x2="316" y2="352"/>
    <line x1="440" y1="420" x2="400" y2="190"/>
    <line x1="440" y1="420" x2="565" y2="296"/>
    <line x1="440" y1="420" x2="815" y2="190"/>
  </g>
  <text x="440" y="476" font-size="10" fill="#666666" text-anchor="middle">never: a function that never</text>
  <text x="440" y="489" font-size="10" fill="#666666" text-anchor="middle">returns; subtype of every type</text>

  <!-- void -->
  <rect x="660" y="390" width="190" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="755" y="412" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">void</text>
  <text x="755" y="430" font-size="10" fill="#444444" text-anchor="middle">return-only: "returns no value"</text>
  <text x="755" y="444" font-size="10" fill="#444444" text-anchor="middle">outside the lattice; cannot be</text>
  <text x="755" y="456" font-size="10" fill="#444444" text-anchor="middle">part of a union</text>

  <!-- composition legend -->
  <rect x="30" y="390" width="300" height="100" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="44" y="410" font-size="12" font-weight="bold" fill="#222222">Composing types</text>
  <text x="44" y="430" font-size="11" fill="#444444">union:  int|string        nullable:  ?Book = Book|null</text>
  <text x="44" y="448" font-size="11" fill="#444444">intersection (class-types only):  Countable&amp;Traversable</text>
  <text x="44" y="466" font-size="11" fill="#444444">DNF (8.2):  (Countable&amp;Traversable)|null</text>
  <text x="44" y="484" font-size="11" fill="#444444">no user-defined type aliases (use PHPDoc)</text>
</svg>
