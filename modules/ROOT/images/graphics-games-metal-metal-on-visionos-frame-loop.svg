<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-metal-on-visionos-frame-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One frame of the Compositor Services render loop</text>
<rect x="20" y="70" width="112" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="76.0" y="96.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">queryNextFrame</text>
<text x="76.0" y="110.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">frame handle</text>
<circle cx="30" cy="64" r="11" fill="#4F46E5"/>
<text x="30" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="134" y1="100" x2="140" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-on-visionos-frame-loop)"/>
<rect x="142" y="70" width="112" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="198.0" y="96.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">predictTiming</text>
<text x="198.0" y="110.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">deadlines</text>
<circle cx="152" cy="64" r="11" fill="#4F46E5"/>
<text x="152" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="256" y1="100" x2="262" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-on-visionos-frame-loop)"/>
<rect x="264" y="70" width="112" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="96.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">startUpdate</text>
<text x="320.0" y="110.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">endUpdate</text>
<circle cx="274" cy="64" r="11" fill="#4F46E5"/>
<text x="274" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="378" y1="100" x2="384" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-on-visionos-frame-loop)"/>
<rect x="386" y="70" width="112" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="442.0" y="96.8" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">wait until</text>
<text x="442.0" y="110.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">optimalInputTime</text>
<circle cx="396" cy="64" r="11" fill="#B45309"/>
<text x="396" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<line x1="500" y1="100" x2="506" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-on-visionos-frame-loop)"/>
<rect x="508" y="70" width="112" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="564.0" y="96.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">startSubmission</text>
<text x="564.0" y="110.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">queryDrawables</text>
<circle cx="518" cy="64" r="11" fill="#4F46E5"/>
<text x="518" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<line x1="622" y1="100" x2="628" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-metal-on-visionos-frame-loop)"/>
<rect x="630" y="70" width="112" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="686.0" y="96.8" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">encode + present</text>
<text x="686.0" y="110.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">endSubmission</text>
<circle cx="640" cy="64" r="11" fill="#4F46E5"/>
<text x="640" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<line x1="20" y1="170" x2="740" y2="170" stroke="#4B5563" stroke-width="1.5"/>
<text x="160" y="162" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">update phase: input, animation, physics</text>
<text x="560" y="162" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">submission phase: needs the pose</text>
<line x1="446" y1="160" x2="446" y2="180" stroke="#B45309" stroke-width="1.5"/>
<text x="446" y="196" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">optimalInputTime</text>
<text x="380" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pose-independent CPU work goes before the wait; the device anchor is queried after it, as late as possible,</text>
<text x="380" y="246" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">so the predicted head pose is close to the pose at display time.</text>
<text x="380" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Run this loop on a dedicated thread, never the main thread. Stop when the renderer state is invalidated.</text>
</svg>
