<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">OpenTofu layout of the Pocket Coffee PrestaShop platform</title>
  <desc id="d">One root module in the infra directory with an S3 state backend and two workspaces, staging and production. Inside the VPC in eu-west-1 across three Availability Zones: public subnets with the load balancer and NAT gateways, private subnets with the EKS cluster pocketcoffee-prod running the web pods and the Jobs, database subnets with the RDS for MySQL 8.4 instance pocketcoffee-prod, and ElastiCache subnets with the Valkey replication group for sessions and the Memcached cluster for the SQL cache. The EFS file system with its mount targets and one access point for the shared img, upload and download folders is reached from the private subnets. Outside the VPC: ECR with the repository pocketcoffee/prestashop, Secrets Manager with the shop and Valkey secrets, a KMS key, an ACM certificate and a regional WAF web ACL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2f5f8"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">infra/: one root module, one environment per workspace</text>
  <rect x="30" y="50" width="900" height="34" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="2"/>
  <text x="480" y="72" font-size="13" fill="#f2f5f8" text-anchor="middle">S3 state backend (use_lockfile)  |  workspace staging: pocketcoffee-staging  |  workspace production: pocketcoffee-prod</text>

  <rect x="30" y="100" width="640" height="440" rx="12" fill="#34495e" stroke="#9fd3c7" stroke-width="2"/>
  <text x="46" y="122" font-size="14" font-weight="bold" fill="#9fd3c7">VPC, eu-west-1, three Availability Zones</text>

  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="50" y="136" width="600" height="62" rx="8" fill="#3d5266"/>
    <text x="350" y="158" font-weight="bold">Public subnets</text>
    <text x="350" y="178">Application load balancer, NAT gateways, S3 gateway endpoint</text>

    <rect x="50" y="208" width="600" height="100" rx="8" fill="#3f6e9a"/>
    <text x="350" y="230" font-weight="bold">Private subnets (/20 each)</text>
    <rect x="70" y="242" width="270" height="52" rx="6" fill="#2f4a44"/>
    <text x="205" y="264" font-weight="bold">EKS Auto Mode: pocketcoffee-prod</text>
    <text x="205" y="282">web pods, cron, install and migrate Jobs</text>
    <rect x="360" y="242" width="270" height="52" rx="6" fill="#4d7c5a"/>
    <text x="495" y="264" font-weight="bold">EFS: mount target per zone</text>
    <text x="495" y="282">access point /shared, UID and GID 33</text>

    <rect x="50" y="318" width="290" height="80" rx="8" fill="#7a5c3a"/>
    <text x="195" y="342" font-weight="bold">Database subnets</text>
    <text x="195" y="362">RDS for MySQL 8.4, Multi-AZ</text>
    <text x="195" y="380">users ps_app and ps_migrate</text>

    <rect x="360" y="318" width="290" height="80" rx="8" fill="#3d5266"/>
    <text x="505" y="342" font-weight="bold">ElastiCache subnets</text>
    <text x="505" y="362">Valkey: PHP sessions (TLS, AUTH)</text>
    <text x="505" y="380">Memcached: SQL cache</text>

    <rect x="50" y="410" width="600" height="116" rx="8" fill="#33485c"/>
    <text x="350" y="432" font-weight="bold" fill="#f4b860">Security groups: only the cluster reaches the data tier</text>
    <text x="350" y="454">3306 to RDS  |  2049 to EFS  |  6379 to Valkey  |  11211 to Memcached</text>
    <text x="350" y="476">Pod Identity roles: EFS CSI driver and External Secrets Operator</text>
    <text x="350" y="498">Source of every rule: the cluster primary security group</text>
  </g>

  <g font-size="12" fill="#f2f5f8" text-anchor="middle">
    <rect x="700" y="100" width="230" height="64" rx="8" fill="#3d5266"/>
    <text x="815" y="124" font-weight="bold">ECR</text><text x="815" y="144">pocketcoffee/prestashop</text>
    <rect x="700" y="176" width="230" height="64" rx="8" fill="#7a5c3a"/>
    <text x="815" y="200" font-weight="bold">Secrets Manager</text><text x="815" y="220">prestashop, install, valkey</text>
    <rect x="700" y="252" width="230" height="64" rx="8" fill="#3f6e9a"/>
    <text x="815" y="276" font-weight="bold">KMS key</text><text x="815" y="296">RDS, EFS, cache, secrets</text>
    <rect x="700" y="328" width="230" height="64" rx="8" fill="#4d7c5a"/>
    <text x="815" y="352" font-weight="bold">ACM certificate</text><text x="815" y="372">www and apex, DNS validated</text>
    <rect x="700" y="404" width="230" height="64" rx="8" fill="#2f4a44"/>
    <text x="815" y="428" font-weight="bold">WAF web ACL</text><text x="815" y="448">admin allow-list, rate limit</text>
    <text x="815" y="496" fill="#f4b860" font-weight="bold">Outside the VPC</text>
  </g>
</svg>
