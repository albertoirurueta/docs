<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From animated design to shared file, and where Reduce motion applies</text>
<rect x="30" y="56" width="170" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="115" y="86" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Animated design</text><text x="115" y="106" font-size="12" fill="#374151" text-anchor="middle">element animations</text><text x="115" y="124" font-size="12" fill="#374151" text-anchor="middle">page transitions</text>
<rect x="290" y="56" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="390" y="81" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Share, then Download</text>
<rect x="290" y="106" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="390" y="131" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Share directly or schedule</text>
<path d="M201,90 L289,76" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M201,112 L289,126" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="560" y="50" width="170" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="645" y="72" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">MP4 video</text><text x="645" y="90" font-size="11" fill="#92400E" text-anchor="middle">480p to 4K (4K on desktop)</text>
<rect x="560" y="110" width="170" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="645" y="132" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">GIF</text><text x="645" y="150" font-size="11" fill="#92400E" text-anchor="middle">size 0.2x to 1x, transparent option</text>
<path d="M491,76 L559,75" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M491,86 L559,135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="196" width="700" height="120" rx="10" fill="#F9FAFB" stroke="#9CA3AF"/>
<text x="50" y="222" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Reduce motion is a playback setting, not an export setting</text>
<text x="50" y="246" font-size="12" fill="#374151" text-anchor="start">On: element animations are reduced; transitions, background animations, masks and overlays</text>
<text x="50" y="266" font-size="12" fill="#374151" text-anchor="start">are removed while viewing or presenting.</text>
<text x="50" y="286" font-size="12" fill="#374151" text-anchor="start">It applies per account (or per editor session, or per public view link); it does not edit the design.</text>
<text x="50" y="306" font-size="12" fill="#374151" text-anchor="start">Animations may still appear in the downloaded video file.</text>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
