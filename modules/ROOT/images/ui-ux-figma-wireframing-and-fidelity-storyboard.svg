<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: wireframe the catalogue</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="12" y="50" width="140" height="270" rx="10"/><rect x="164" y="50" width="140" height="270" rx="10"/><rect x="316" y="50" width="140" height="270" rx="10"/><rect x="468" y="50" width="140" height="270" rx="10"/><rect x="620" y="50" width="128" height="270" rx="10"/>
  </g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M153,185 L163,185" marker-end="url(#ah)"/><path d="M305,185 L315,185" marker-end="url(#ah)"/><path d="M457,185 L467,185" marker-end="url(#ah)"/><path d="M609,185 L619,185" marker-end="url(#ah)"/></g>
  <!-- p1 content list -->
  <g font-size="10" fill="#374151"><text x="24" y="100">Content list</text><text x="24" y="120">- Title, author</text><text x="24" y="136">- Cover</text><text x="24" y="152">- Rating</text><text x="24" y="168">- Add to shelf</text><text x="24" y="184">- Search, filter</text></g>
  <!-- p2 frame 390x844 with plain boxes -->
  <rect x="190" y="78" width="88" height="200" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="196" y="86" width="76" height="14" rx="3" fill="#E5E7EB"/><rect x="196" y="108" width="76" height="12" rx="3" fill="none" stroke="#9CA3AF"/><rect x="196" y="128" width="36" height="50" fill="#E5E7EB"/><rect x="236" y="128" width="36" height="50" fill="#E5E7EB"/>
  <text x="234" y="298" font-size="10" fill="#92400E" text-anchor="middle">frame 390 x 844</text>
  <!-- p3 auto layout card -->
  <rect x="340" y="76" width="92" height="140" rx="8" fill="#EEF2FF" stroke="#B45309"/><rect x="348" y="84" width="76" height="60" fill="#E5E7EB"/><rect x="348" y="152" width="56" height="8" rx="3" fill="#9CA3AF"/><rect x="348" y="168" width="40" height="6" rx="3" fill="#D1D5DB"/><rect x="348" y="184" width="76" height="22" rx="4" fill="none" stroke="#6B7280"/>
  <text x="386" y="240" font-size="10" fill="#92400E" text-anchor="middle">card = component</text>
  <!-- p4 grid -->
  <rect x="480" y="76" width="116" height="200" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><g fill="#E5E7EB" stroke="#4F46E5" stroke-dasharray="3 3"><rect x="486" y="84" width="50" height="60"/><rect x="540" y="84" width="50" height="60"/><rect x="486" y="152" width="50" height="60"/><rect x="540" y="152" width="50" height="60"/></g>
  <text x="538" y="298" font-size="10" fill="#92400E" text-anchor="middle">grid, 2 columns, gap 8</text>
  <!-- p5 states -->
  <rect x="632" y="76" width="104" height="60" rx="6" fill="#E5E7EB"/><text x="684" y="110" font-size="10" fill="#374151" text-anchor="middle">Loading</text>
  <rect x="632" y="148" width="104" height="60" rx="6" fill="#E5E7EB"/><text x="684" y="182" font-size="10" fill="#374151" text-anchor="middle">Empty: no books</text>
  <rect x="632" y="220" width="104" height="60" rx="6" fill="#FEE2E2" stroke="#B91C1C"/><text x="684" y="254" font-size="10" fill="#B91C1C" text-anchor="middle">Error: retry</text>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="344">List content</text><text x="234" y="344">Add a frame</text><text x="386" y="344">Build one card</text><text x="538" y="344">Lay out the grid</text><text x="684" y="344">Add states</text></g>
  <text x="380" y="388" font-size="12" fill="#3730A3" text-anchor="middle">Content first, structure second, states last: each panel adds one decision.</text>
</svg>
