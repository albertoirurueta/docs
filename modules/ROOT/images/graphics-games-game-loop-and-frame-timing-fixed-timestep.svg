<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="glf-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="glf-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="glf-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="glf-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Fixed timestep with an accumulator</text>
<text x="40" y="56" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Real time: each rendered frame lasts a different time</text>
<rect x="40" y="66" width="79.2" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="79.6" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">12 ms</text>
<rect x="119.2" y="66" width="132" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="185.2" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">20 ms</text>
<rect x="251.2" y="66" width="99" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="300.7" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">15 ms</text>
<rect x="350.2" y="66" width="184.8" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="442.6" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">28 ms</text>
<rect x="535" y="66" width="92.4" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="581.2" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">14 ms</text>
<rect x="627.4" y="66" width="112.2" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="683.5" y="85.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">17 ms</text>
<text x="40" y="126" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Simulation time: steps of exactly 16.7 ms, consumed from the accumulator</text>
<rect x="40" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="93.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 1</text>
<rect x="150" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="203.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 2</text>
<rect x="260" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="313.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 3</text>
<rect x="370" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="423.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 4</text>
<rect x="480" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="533.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 5</text>
<rect x="590" y="136" width="107" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="643.5" y="155.5" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">step 6</text>
<line x1="119.2" y1="60" x2="119.2" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="119.2" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="119.2" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="251.2" y1="60" x2="251.2" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="251.2" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="251.2" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="350.2" y1="60" x2="350.2" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="350.2" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="350.2" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="535" y1="60" x2="535" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="535" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="535" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="627.4" y1="60" x2="627.4" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="627.4" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="627.4" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<line x1="739.6" y1="60" x2="739.6" y2="176" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="739.6" cy="194" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="739.6" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<line x1="700" y1="136" x2="700" y2="176" stroke="#047857" stroke-width="2"/>
<text x="40" y="232" text-anchor="start" font-size="12" fill="#374151">Per frame: add the frame time to the accumulator, run one step per 16.7 ms it holds, keep the remainder</text>
<rect x="40" y="248" width="680" height="118" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<circle cx="96.6667" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="96.6667" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="96.6667" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 12 ms</text>
<text x="96.6667" y="312" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">0 steps</text>
<text x="96.6667" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 12.0 ms</text>
<circle cx="210" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="210" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="210" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 20 ms</text>
<text x="210" y="312" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">1 step</text>
<text x="210" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 15.3 ms</text>
<circle cx="323.333" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="323.333" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="323.333" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 15 ms</text>
<text x="323.333" y="312" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">1 step</text>
<text x="323.333" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 13.7 ms</text>
<circle cx="436.667" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="436.667" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="436.667" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 28 ms</text>
<text x="436.667" y="312" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">2 steps</text>
<text x="436.667" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 8.3 ms</text>
<circle cx="550" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="550" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="550" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 14 ms</text>
<text x="550" y="312" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">1 step</text>
<text x="550" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 5.7 ms</text>
<circle cx="663.333" cy="268" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="663.333" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<text x="663.333" y="294" text-anchor="middle" font-size="11" fill="#374151">frame 17 ms</text>
<text x="663.333" y="312" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">1 step</text>
<text x="663.333" y="330" text-anchor="middle" font-size="11" fill="#4B5563">left 6.0 ms</text>
<text x="380" y="356" text-anchor="middle" font-size="11" fill="#4B5563">Frame 1 runs no step (12 ms is below 16.7 ms); frame 4 runs two steps to catch up</text>
<text x="380" y="392" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">alpha = remainder / step = left / 16.7 is the blend factor handed to the renderer (next figure)</text>
</svg>
