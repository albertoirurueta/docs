<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">How cacheability metadata bubbles up a Drupal render tree</title>
  <desc id="d">Two collection objects and a configuration object are leaves of the On display now block. Their cache tags are merged by union, their cache contexts are merged and optimised, and their max-age is the minimum of all values. The merged metadata passes through the region and the page to the response headers. A lazy-built Saved objects counter with the user context and max-age 0 is replaced by a placeholder, so the page skeleton stays cacheable.</desc>
  <rect width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>

  <text x="20" y="26" font-weight="bold" font-size="15" fill="#263238">Metadata flows up (bubbles) from every leaf to the response</text>

  <!-- Response -->
  <rect x="20" y="42" width="600" height="74" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="36" y="64" font-weight="bold" fill="#263238">HTML response (headers with debug_cacheability_headers)</text>
  <text x="36" y="84" font-size="12" fill="#263238">Tags: collection_object:12 collection_object:15 config:meridian_collection.settings</text>
  <text x="36" y="102" font-size="12" fill="#263238">Contexts: languages:language_interface theme user.permissions; Max-Age: 3600</text>

  <!-- Region -->
  <rect x="20" y="146" width="600" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="36" y="168" font-weight="bold" fill="#263238">Region "content" and page render array</text>
  <text x="36" y="188" fill="#263238">Receives the merged metadata of every block and the main content</text>

  <!-- Block -->
  <rect x="20" y="232" width="600" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="36" y="254" font-weight="bold" fill="#263238">Block "On display now" (meridian_on_display_now)</text>
  <text x="36" y="274" fill="#263238">Own #cache: tag collection_object_list, context languages:language_interface</text>

  <!-- Leaves -->
  <rect x="20" y="340" width="190" height="86" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="32" y="362" font-weight="bold" fill="#263238">collection_object 12</text>
  <text x="32" y="382" fill="#263238">tag collection_object:12</text>
  <text x="32" y="400" fill="#263238">context languages:content</text>
  <text x="32" y="418" fill="#263238">max-age permanent</text>

  <rect x="225" y="340" width="190" height="86" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="237" y="362" font-weight="bold" fill="#263238">collection_object 15</text>
  <text x="237" y="382" fill="#263238">tag collection_object:15</text>
  <text x="237" y="400" fill="#263238">context languages:content</text>
  <text x="237" y="418" fill="#263238">max-age permanent</text>

  <rect x="430" y="340" width="190" height="86" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="442" y="362" font-weight="bold" fill="#263238">Opening-hours setting</text>
  <text x="442" y="382" fill="#263238">tag config:meridian_</text>
  <text x="442" y="398" fill="#263238">collection.settings</text>
  <text x="442" y="418" fill="#263238">max-age 3600 (clock)</text>

  <g stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M115 340V312Q115 300 127 300H300V290"/>
    <path d="M320 340V290"/>
    <path d="M525 340V312Q525 300 513 300H340V290"/>
    <path d="M320 232V204"/>
    <path d="M320 146V118"/>
  </g>

  <!-- Merge rules -->
  <rect x="650" y="42" width="232" height="246" rx="8" fill="#f5f5f5" stroke="#78909c"/>
  <text x="664" y="66" font-weight="bold" fill="#263238">Merge rules</text>
  <text x="664" y="92" font-weight="bold" fill="#263238">Tags</text>
  <text x="664" y="110" fill="#263238">union of all tags</text>
  <text x="664" y="140" font-weight="bold" fill="#263238">Contexts</text>
  <text x="664" y="158" fill="#263238">union, then optimised:</text>
  <text x="664" y="176" fill="#263238">user + user.roles = user</text>
  <text x="664" y="206" font-weight="bold" fill="#263238">Max-age</text>
  <text x="664" y="224" fill="#263238">the minimum wins; 0 makes</text>
  <text x="664" y="242" fill="#263238">the whole ancestor chain</text>
  <text x="664" y="260" fill="#263238">uncacheable</text>
  <text x="664" y="278" fill="#263238">Attachments are merged too</text>

  <!-- Placeholder branch -->
  <rect x="20" y="452" width="600" height="72" rx="8" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="36" y="474" font-weight="bold" fill="#263238">Saved objects counter (#lazy_builder, context user, tags per member)</text>
  <text x="36" y="494" fill="#263238">Replaced by a placeholder: the skeleton above keeps its metadata, the counter is</text>
  <text x="36" y="512" fill="#263238">rendered later by the placeholder strategy (single flush or BigPipe)</text>
  <path d="M320 452V432" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#b)"/>
  <text x="332" y="446" fill="#c62828">not bubbled</text>

  <rect x="650" y="320" width="232" height="204" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="664" y="344" font-weight="bold" fill="#263238">Where you act</text>
  <text x="664" y="368" fill="#263238">Leaf: getCacheTags() or</text>
  <text x="664" y="386" fill="#263238">addCacheableDependency()</text>
  <text x="664" y="412" fill="#263238">Branch: #cache in build()</text>
  <text x="664" y="438" fill="#263238">Never: render() in a</text>
  <text x="664" y="456" fill="#263238">controller to get a string</text>
  <text x="664" y="476" fill="#263238">(the metadata is lost)</text>
  <text x="664" y="504" fill="#263238">Debug: response headers</text>
</svg>
