<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="hs-t hs-d">
  <title id="hs-t">The heatflow grid and its five-point stencil</title>
  <desc id="hs-d">A grid of 6 columns and 5 rows of nodes. The outer ring of nodes is the boundary, set by the boundary condition. The inner nodes are interior points, where the Laplacian is computed. One interior node is highlighted with its four neighbours above, below, left and right; the centre has weight minus 4 and each neighbour weight plus 1, all divided by dx squared.</desc>
  <rect width="760" height="490" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">T is ny-by-nx: row i runs down (y), column j runs across (x)</text>
  <g transform="translate(0 20)">
  <text x="90" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 1</text>
  <text x="170" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 2</text>
  <text x="250" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 3</text>
  <text x="330" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 4</text>
  <text x="410" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 5</text>
  <text x="490" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">j = 6</text>
  <text x="68" y="75" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 1</text>
  <text x="68" y="155" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 2</text>
  <text x="68" y="235" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 3</text>
  <text x="68" y="315" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 4</text>
  <text x="68" y="395" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">i = 5</text>
  <line x1="90" y1="70" x2="490" y2="70" stroke="#cbd5e1"/>
  <line x1="90" y1="150" x2="490" y2="150" stroke="#cbd5e1"/>
  <line x1="90" y1="230" x2="490" y2="230" stroke="#cbd5e1"/>
  <line x1="90" y1="310" x2="490" y2="310" stroke="#cbd5e1"/>
  <line x1="90" y1="390" x2="490" y2="390" stroke="#cbd5e1"/>
  <line x1="90" y1="70" x2="90" y2="390" stroke="#cbd5e1"/>
  <line x1="170" y1="70" x2="170" y2="390" stroke="#cbd5e1"/>
  <line x1="250" y1="70" x2="250" y2="390" stroke="#cbd5e1"/>
  <line x1="330" y1="70" x2="330" y2="390" stroke="#cbd5e1"/>
  <line x1="410" y1="70" x2="410" y2="390" stroke="#cbd5e1"/>
  <line x1="490" y1="70" x2="490" y2="390" stroke="#cbd5e1"/>
  <circle cx="90" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="170" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="250" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="330" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="410" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="490" cy="70" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="150" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="170" cy="150" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="250" cy="150" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="330" cy="150" r="17" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="330" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">+1</text>
  <circle cx="410" cy="150" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="490" cy="150" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="230" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="170" cy="230" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="250" cy="230" r="17" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="250" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">+1</text>
  <circle cx="330" cy="230" r="17" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <text x="330" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">-4</text>
  <circle cx="410" cy="230" r="17" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="410" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">+1</text>
  <circle cx="490" cy="230" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="310" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="170" cy="310" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="250" cy="310" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="330" cy="310" r="17" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="330" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">+1</text>
  <circle cx="410" cy="310" r="17" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="490" cy="310" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="170" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="250" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="330" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="410" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="490" cy="390" r="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="590" cy="100" r="9" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="608" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">boundary node</text>
  <text x="608" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">set by BoundaryKind</text>
  <circle cx="590" cy="150" r="9" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="608" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">interior node</text>
  <text x="608" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">result L is (ny-2)-by-(nx-2)</text>
  <circle cx="590" cy="200" r="9" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <text x="608" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">centre T(i,j)</text>
  <circle cx="590" cy="240" r="9" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="608" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">four neighbours</text>
  <text x="580" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">L(i,j) = (T(i-1,j) + T(i+1,j)</text>
  <text x="610" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">+ T(i,j-1) + T(i,j+1)</text>
  <text x="610" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">- 4*T(i,j)) / dx^2</text>
  <text x="290.0" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Five-point stencil: weights +1 on the four neighbours and -4 on the centre.</text>
  </g>
</svg>
