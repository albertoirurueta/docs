<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Elastic Stack architecture for monitoring: Bookshelf telemetry flows through the EDOT Collector, Elastic Agent, Beats or Logstash into Elasticsearch data streams; Kibana is a stateless server that reads data and stores saved objects and Task Manager tasks in Elasticsearch; Task Manager runs rules and reports and calls connectors; spaces partition saved objects and the Observability apps sit on top</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Elastic Stack for monitoring: ingest, store, explore and alert</text>
<text x="480" y="44" font-size="10.5" fill="#555555" text-anchor="middle">Kibana holds no data of its own: telemetry, saved objects and background tasks all live in Elasticsearch</text>

<text x="120" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Sources and ingest</text>
<text x="480" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Elasticsearch</text>
<text x="830" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Kibana (one or more instances)</text>

<rect x="15" y="90" width="210" height="110" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="120" y="112" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf and hosts</text>
<text x="120" y="132" font-size="10.5" fill="#222222" text-anchor="middle">OTLP metrics, traces, logs</text>
<text x="120" y="150" font-size="10.5" fill="#222222" text-anchor="middle">JSON logs, host metrics</text>
<text x="120" y="168" font-size="10.5" fill="#222222" text-anchor="middle">Prometheus remote write</text>
<text x="120" y="188" font-size="10" fill="#555555" text-anchor="middle">load generator drives traffic</text>

<rect x="15" y="230" width="210" height="190" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
<text x="120" y="252" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Collectors</text>
<rect x="30" y="266" width="180" height="30" rx="6" fill="#ffffff" stroke="#388e3c"/><text x="120" y="286" font-size="10.5" fill="#222222" text-anchor="middle">EDOT Collector (default)</text>
<rect x="30" y="302" width="180" height="30" rx="6" fill="#ffffff" stroke="#388e3c"/><text x="120" y="322" font-size="10.5" fill="#222222" text-anchor="middle">Elastic Agent + Fleet</text>
<rect x="30" y="338" width="180" height="30" rx="6" fill="#ffffff" stroke="#388e3c"/><text x="120" y="358" font-size="10.5" fill="#222222" text-anchor="middle">Beats (largely replaced)</text>
<rect x="30" y="374" width="180" height="30" rx="6" fill="#ffffff" stroke="#388e3c"/><text x="120" y="394" font-size="10.5" fill="#222222" text-anchor="middle">Logstash (complex pipelines)</text>

<rect x="270" y="90" width="420" height="430" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
<rect x="290" y="106" width="380" height="150" rx="8" fill="#ffffff" stroke="#1976d2"/>
<text x="480" y="127" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Telemetry data streams</text>
<text x="480" y="148" font-size="10.5" fill="#222222" text-anchor="middle">logs-*  metrics-* (time series data streams)  traces-*</text>
<text x="480" y="166" font-size="10.5" fill="#222222" text-anchor="middle">index and component templates, lifecycle, downsampling</text>
<text x="480" y="184" font-size="10.5" fill="#222222" text-anchor="middle">queried with ES|QL, KQL, Query DSL and PromQL</text>
<text x="480" y="206" font-size="10" fill="#555555" text-anchor="middle">hot, warm, cold tiers; alert documents in .alerts-* indices</text>
<text x="480" y="240" font-size="10" fill="#555555" text-anchor="middle">security: users, roles, API keys, service accounts</text>

<rect x="290" y="276" width="380" height="104" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="480" y="298" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Kibana system indices</text>
<text x="480" y="320" font-size="10.5" fill="#222222" text-anchor="middle">Saved objects: dashboards, data views, rules, connectors, cases</text>
<text x="480" y="338" font-size="10.5" fill="#222222" text-anchor="middle">Task Manager queue (.kibana_task_manager)</text>
<text x="480" y="356" font-size="10.5" fill="#222222" text-anchor="middle">Spaces partition saved objects (default space plus others)</text>

<rect x="290" y="400" width="380" height="100" rx="8" fill="#ffffff" stroke="#1976d2"/>
<text x="480" y="422" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Elasticsearch REST API (port 9200)</text>
<text x="480" y="444" font-size="10.5" fill="#222222" text-anchor="middle">Kibana connects as the elastic/kibana service account or kibana_system</text>
<text x="480" y="462" font-size="10.5" fill="#222222" text-anchor="middle">Rules run with the API key of the user who last saved them</text>
<text x="480" y="484" font-size="10" fill="#555555" text-anchor="middle">same version for Elasticsearch and Kibana (9.5.6 in the lab)</text>

<rect x="725" y="90" width="225" height="250" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="837" y="112" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Kibana server</text>
<rect x="740" y="124" width="195" height="30" rx="6" fill="#ffffff" stroke="#7b1fa2"/><text x="837" y="144" font-size="10.5" fill="#222222" text-anchor="middle">UI on port 5601, HTTP APIs</text>
<rect x="740" y="160" width="195" height="30" rx="6" fill="#ffffff" stroke="#7b1fa2"/><text x="837" y="180" font-size="10.5" fill="#222222" text-anchor="middle">Discover, Lens, dashboards</text>
<rect x="740" y="196" width="195" height="30" rx="6" fill="#ffffff" stroke="#7b1fa2"/><text x="837" y="216" font-size="10.5" fill="#222222" text-anchor="middle">Observability apps, SLOs</text>
<rect x="740" y="232" width="195" height="30" rx="6" fill="#ffffff" stroke="#7b1fa2"/><text x="837" y="252" font-size="10.5" fill="#222222" text-anchor="middle">Task Manager: rules, reports</text>
<text x="837" y="288" font-size="10" fill="#555555" text-anchor="middle">stateless: add instances to scale,</text>
<text x="837" y="304" font-size="10" fill="#555555" text-anchor="middle">same encryption keys on all of them</text>
<text x="837" y="326" font-size="10" fill="#555555" text-anchor="middle">settings in kibana.yml or env vars</text>

<rect x="725" y="365" width="225" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="837" y="390" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Connectors</text>
<text x="837" y="408" font-size="10" fill="#555555" text-anchor="middle">webhook receiver, e-mail, chat, paging</text>
<rect x="725" y="450" width="225" height="62" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="837" y="475" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Browser and API clients</text>
<text x="837" y="493" font-size="10" fill="#555555" text-anchor="middle">operators, Terraform, CI (use the Kibana URL)</text>

<line x1="225" y1="325" x2="288" y2="200" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="120" y1="200" x2="120" y2="228" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="725" y1="215" x2="672" y2="215" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="725" y1="300" x2="672" y2="335" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="725" y1="260" x2="672" y2="440" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="837" y1="340" x2="837" y2="363" stroke="#37474f" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
