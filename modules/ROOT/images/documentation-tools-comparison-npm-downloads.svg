<title id="npm-downloads-t">npm downloads per month</title>
<desc id="npm-downloads-d">Monthly npm downloads of @docusaurus/core and @antora/cli from the first publication to the last complete month before 2026-10-26, from the npm downloads range API. Counts include CI and mirror traffic.</desc>
