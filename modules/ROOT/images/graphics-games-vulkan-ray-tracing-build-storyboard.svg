<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-rt-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Building the Bookshelf acceleration structures, step by step</text>
<rect x="20" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="75.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="75.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="75.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/><text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="75" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Describe</text>
<text x="75" y="140" text-anchor="middle" font-size="10" fill="#374151">vertex and index</text>
<text x="75" y="154" text-anchor="middle" font-size="10" fill="#374151">buffer addresses</text>
<line x1="131" y1="135" x2="141" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-story)"/>
<rect x="141" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="196.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="196.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="196.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="157" cy="76" r="11" fill="#4F46E5"/><text x="157" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="196" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Query sizes</text>
<text x="196" y="140" text-anchor="middle" font-size="10" fill="#374151">get build sizes</text>
<text x="196" y="154" text-anchor="middle" font-size="10" fill="#374151">for each geometry</text>
<line x1="252" y1="135" x2="262" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-story)"/>
<rect x="262" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="317.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="317.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="317.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="278" cy="76" r="11" fill="#4F46E5"/><text x="278" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="317" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Allocate</text>
<text x="317" y="140" text-anchor="middle" font-size="10" fill="#374151">AS buffer, scratch,</text>
<text x="317" y="154" text-anchor="middle" font-size="10" fill="#374151">then create the AS</text>
<line x1="373" y1="135" x2="383" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-story)"/>
<rect x="383" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="438.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="438.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="438.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="399" cy="76" r="11" fill="#4F46E5"/><text x="399" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="438" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Build BLAS</text>
<text x="438" y="140" text-anchor="middle" font-size="10" fill="#374151">record the build</text>
<text x="438" y="154" text-anchor="middle" font-size="10" fill="#374151">on a queue</text>
<line x1="494" y1="135" x2="504" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-story)"/>
<rect x="504" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="559.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="559.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="559.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="520" cy="76" r="11" fill="#B45309"/><text x="520" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="559" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Barrier</text>
<text x="559" y="140" text-anchor="middle" font-size="10" fill="#374151">sync2: AS write</text>
<text x="559" y="154" text-anchor="middle" font-size="10" fill="#374151">then AS read</text>
<line x1="615" y1="135" x2="625" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-rt-story)"/>
<rect x="625" y="60" width="111" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="680.5" y="123.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="680.5" y="139.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="680.5" y="155.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<circle cx="641" cy="76" r="11" fill="#4F46E5"/><text x="641" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<text x="680" y="115" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Build TLAS</text>
<text x="680" y="140" text-anchor="middle" font-size="10" fill="#374151">instance buffer,</text>
<text x="680" y="154" text-anchor="middle" font-size="10" fill="#374151">one TLAS build</text>
<rect x="32" y="165" width="87" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="75.5" y="185.5" text-anchor="middle" font-size="10" fill="#065F46">vertex+index</text>
<rect x="153" y="165" width="87" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="196.5" y="185.5" text-anchor="middle" font-size="10" fill="#065F46">sizes in bytes</text>
<rect x="274" y="165" width="87" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="317.5" y="185.5" text-anchor="middle" font-size="10" fill="#065F46">scratch + AS</text>
<rect x="395" y="165" width="87" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="438.5" y="185.5" text-anchor="middle" font-size="10" fill="#065F46">BLAS shelf, book</text>
<rect x="516" y="165" width="87" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="559.5" y="185.5" text-anchor="middle" font-size="10" fill="#92400E">wait for writes</text>
<rect x="637" y="165" width="87" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="680.5" y="185.5" text-anchor="middle" font-size="10" fill="#065F46">TLAS ready</text>
<text x="380" y="245" text-anchor="middle" font-size="11" fill="#374151">Optional between steps 4 and 5: query the compacted size, allocate a smaller AS and copy with compaction.</text>
<text x="380" y="265" text-anchor="middle" font-size="11" fill="#374151">Rebuild or update (mode UPDATE) the TLAS every frame when instance transforms change.</text>
<text x="380" y="285" text-anchor="middle" font-size="11" fill="#374151">Each build needs a scratch buffer aligned to minAccelerationStructureScratchOffsetAlignment.</text>
<text x="380" y="305" text-anchor="middle" font-size="11" fill="#374151">Geometry buffers need the acceleration-structure build-input usage flag and a device address.</text>
</svg>
