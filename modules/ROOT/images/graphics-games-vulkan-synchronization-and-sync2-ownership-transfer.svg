<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-syn-own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Queue family ownership transfer</text>
<text x="20" y="62" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Transfer queue (family 1)</text>
<text x="20" y="222" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Graphics queue (family 0)</text>
<line x1="20" y1="70" x2="740" y2="70" stroke="#9CA3AF" stroke-width="1"/>
<line x1="20" y1="230" x2="740" y2="230" stroke="#9CA3AF" stroke-width="1"/>
<rect x="30" y="90" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="113.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Copy staging</text>
<text x="105.0" y="128.8" text-anchor="middle" font-size="11" fill="#92400E">to image</text>
<text x="105.0" y="143.8" text-anchor="middle" font-size="11" fill="#92400E">TRANSFER_DST</text>
<rect x="220" y="90" width="170" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="305.0" y="113.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Release barrier</text>
<text x="305.0" y="128.8" text-anchor="middle" font-size="11" fill="#3730A3">src family 1, dst family 0</text>
<text x="305.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3">srcStage: COPY</text>
<rect x="430" y="250" width="170" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="515.0" y="273.9" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Acquire barrier</text>
<text x="515.0" y="288.9" text-anchor="middle" font-size="11" fill="#3730A3">src family 1, dst family 0</text>
<text x="515.0" y="303.9" text-anchor="middle" font-size="11" fill="#3730A3">dstStage: FRAGMENT</text>
<rect x="630" y="250" width="110" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="685.0" y="281.4" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Sample</text>
<text x="685.0" y="296.4" text-anchor="middle" font-size="11" fill="#065F46">the image</text>
<line x1="180" y1="125" x2="218" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-own)"/>
<line x1="390" y1="125" x2="500" y2="248" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-syn-own)"/>
<text x="520" y="180" text-anchor="start" font-size="11" fill="#92400E">semaphore signal then wait</text>
<line x1="600" y1="285" x2="628" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-syn-own)"/>
<text x="380" y="346" text-anchor="middle" font-size="10" fill="#374151">Both barriers carry identical layouts and family indices; with exclusive sharing, the stage and access masks of the other side are ignored.</text>
</svg>
