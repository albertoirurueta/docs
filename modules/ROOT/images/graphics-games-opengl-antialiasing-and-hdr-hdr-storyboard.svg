<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Bookshelf GL: the lamp-lit cover in four stages</text>
<rect x="20" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/><text x="36" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="115" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">8-bit clamp</text>
<rect x="40" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<defs><radialGradient id="g0" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7F1D1D"/></radialGradient></defs>
<rect x="60" y="100" width="90" height="94" fill="#7F1D1D" stroke="#4B5563"/><circle cx="105" cy="140" r="30" fill="#FFFFFF" opacity="0.95"/>
<text x="105" y="230" text-anchor="middle" font-size="10" fill="#374151">Lamp glare saturates</text>
<text x="105" y="246" text-anchor="middle" font-size="10" fill="#374151">to flat white</text>
<rect x="203" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="219" cy="66" r="11" fill="#4F46E5"/><text x="219" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="298" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Float buffer</text>
<rect x="223" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<defs><radialGradient id="g1" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#9CA3AF"/><stop offset="0.5" stop-color="#374151"/><stop offset="1" stop-color="#111827"/></radialGradient></defs>
<rect x="243" y="100" width="90" height="94" fill="url(#g1)" stroke="#4B5563"/>
<text x="288" y="215" text-anchor="middle" font-size="10" fill="#6B7280">(displayed raw: dark)</text>
<text x="288" y="232" text-anchor="middle" font-size="10" fill="#374151">RGBA16F keeps values</text>
<text x="288" y="248" text-anchor="middle" font-size="10" fill="#374151">up to 8.0</text>
<rect x="386" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="66" r="11" fill="#4F46E5"/><text x="402" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="481" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Tone map</text>
<rect x="406" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<defs><radialGradient id="g2" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#B45309"/><stop offset="1" stop-color="#6B7280"/></radialGradient></defs>
<rect x="426" y="100" width="90" height="94" fill="url(#g2)" stroke="#4B5563"/>
<text x="471" y="230" text-anchor="middle" font-size="10" fill="#374151">Curve compresses 0..8</text>
<text x="471" y="246" text-anchor="middle" font-size="10" fill="#374151">into 0..1</text>
<rect x="569" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="585" cy="66" r="11" fill="#4F46E5"/><text x="585" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="664" y="72" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">sRGB encode</text>
<rect x="589" y="92" width="130" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
<defs><radialGradient id="g3" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#FEF3C7"/><stop offset="0.5" stop-color="#D97706"/><stop offset="1" stop-color="#9CA3AF"/></radialGradient></defs>
<rect x="609" y="100" width="90" height="94" fill="url(#g3)" stroke="#4B5563"/>
<text x="654" y="230" text-anchor="middle" font-size="10" fill="#374151">Gamma curve for the</text>
<text x="654" y="246" text-anchor="middle" font-size="10" fill="#374151">8-bit display</text>
<text x="380" y="324" text-anchor="middle" font-size="11" fill="#4B5563">Illustration only: the panels approximate the stages and are not measured renders.</text>
</svg>
