<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">An edit is a transaction: draft changes are saved only on commit</text>
  <rect x="40" y="80" width="150" height="80" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="115.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">start</text>
  <text x="115.0" y="132.0" font-size="12" fill="#1F2937" text-anchor="middle">status: open</text>
  <text x="115" y="182" font-size="11" fill="#374151" text-anchor="middle">transaction_id and element_id values</text>
  <rect x="230" y="80" width="150" height="80" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="305.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">perform</text>
  <text x="305.0" y="132.0" font-size="12" fill="#1F2937" text-anchor="middle">draft operations</text>
  <text x="305" y="182" font-size="11" fill="#374151" text-anchor="middle">replace text, replace fills</text>
  <rect x="420" y="80" width="150" height="80" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="495.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">commit</text>
  <text x="495.0" y="132.0" font-size="12" fill="#1F2937" text-anchor="middle">committed</text>
  <text x="495" y="182" font-size="11" fill="#374151" text-anchor="middle">edits saved to the design</text>
  <path d="M190,120 L228,120" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M380,120 L418,120" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="590" y="80" width="140" height="80" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="660.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">cancel</text>
  <text x="660.0" y="132.0" font-size="12" fill="#1F2937" text-anchor="middle">discard the draft</text>
  <path d="M380,80 L590,100" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <text x="380" y="236" font-size="12" fill="#374151" text-anchor="middle">Take element IDs from start-editing-transaction, never from get-design-content.</text>
  <text x="380" y="256" font-size="12" fill="#374151" text-anchor="middle">Tell the user an edit is saved only after commit returns a committed status.</text>
  <text x="380" y="282" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
