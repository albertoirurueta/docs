<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgl2-advanced-features-transform-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Transform feedback: a GPU-only particle loop (dust)</text>
<rect x="20" y="70" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="96.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Buffer A</text>
<text x="95.0" y="111.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">positions, velocities</text>
<rect x="20" y="220" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="246.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Buffer B</text>
<text x="95.0" y="261.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">positions, velocities</text>
<rect x="300" y="120" width="170" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="385.0" y="156.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Update program</text>
<text x="385.0" y="171.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">vertex shader only</text>
<text x="385.0" y="186.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">RASTERIZER_DISCARD</text>
<text x="385.0" y="201.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">out vPos, vVel</text>
<line x1="170" y1="100" x2="300" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-transform-feedback)"/>
<line x1="470" y1="200" x2="170" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-transform-feedback)"/>
<text x="215" y="115" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">read as attributes</text>
<text x="330" y="260" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">captured by transformFeedback</text>
<rect x="560" y="70" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="89.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Draw program</text>
<text x="650.0" y="104.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">POINTS from the buffer</text>
<text x="650.0" y="119.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">just written</text>
<line x1="470" y1="150" x2="560" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgl2-advanced-features-transform-feedback)"/>
<text x="380" y="320" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each frame swap A and B (ping-pong): never read and capture the same buffer in one pass.</text>
<text x="380" y="338" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">beginTransformFeedback(POINTS) ... endTransformFeedback(), then draw the output with a second program.</text>
</svg>
