<text x="625.0" y="198.8" text-anchor="middle" font-size="11" fill="#92400E">VkPipelineDynamicStateCreateInfo</text>
<text x="625.0" y="213.8" text-anchor="middle" font-size="11" fill="#92400E">states set at record time</text>
