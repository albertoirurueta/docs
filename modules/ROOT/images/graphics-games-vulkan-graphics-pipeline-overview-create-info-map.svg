<text x="135.0" y="303.9" text-anchor="middle" font-size="11" fill="#374151">cull, front face, depth bias</text>
<text x="135.0" y="318.9" text-anchor="middle" font-size="11" fill="#374151">samples, alpha to coverage</text>
