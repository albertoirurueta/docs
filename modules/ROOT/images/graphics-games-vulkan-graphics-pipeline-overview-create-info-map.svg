<text x="380.0" y="208.8" text-anchor="middle" font-size="11" fill="#3730A3">pXxxState pointers</text>
<text x="380.0" y="223.8" text-anchor="middle" font-size="11" fill="#3730A3">layout, renderPass</text>
<text x="380.0" y="238.8" text-anchor="middle" font-size="11" fill="#3730A3">pNext chain</text>
