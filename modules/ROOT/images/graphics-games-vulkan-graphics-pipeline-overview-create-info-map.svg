<text x="380.0" y="330.2" text-anchor="middle" font-size="12" fill="#065F46">VkPipelineLayout</text>
<line x1="380" y1="300" x2="380" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-gpo-map)"/>
<text x="380" y="372" text-anchor="middle" font-size="12" fill="#374151">Output: one VkPipeline, immutable once created.</text>
<text x="380" y="392" text-anchor="middle" font-size="11" fill="#6B7280">Cache and creation feedback chains are optional.</text>
