<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Compilation order of heatflow, and what an edit to the Jacobi code recompiles</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">arrows point from a unit to the unit that needs its module file first; orange units are recompiled after the edit</text>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="l" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999999"/></marker>
  </defs>

  <!-- left panel -->
  <rect x="20" y="64" width="430" height="520" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="235" y="90" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Without submodules</text>
  <text x="235" y="107" font-size="11.5" fill="#666666" text-anchor="middle">heatflow_solver holds interfaces and bodies in one module</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="100" y="130" width="270" height="48" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="235" y="150" font-family="Courier New, monospace" font-weight="bold">heatflow_kinds</text><text x="235" y="167" font-size="11" fill="#555555">unchanged: not recompiled</text>
    <rect x="100" y="222" width="270" height="48" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="235" y="242" font-family="Courier New, monospace" font-weight="bold">heatflow_grid</text><text x="235" y="259" font-size="11" fill="#555555">unchanged: not recompiled</text>
    <rect x="100" y="314" width="270" height="62" rx="6" fill="#fde9d3" stroke="#d9772b" stroke-width="2"/>
    <text x="235" y="334" font-family="Courier New, monospace" font-weight="bold">heatflow_solver</text><text x="235" y="351" font-size="11" fill="#555555">interfaces + Jacobi and FTCS bodies</text><text x="235" y="367" font-size="11" fill="#a04a00" font-weight="bold">edited: recompiled</text>
    <rect x="100" y="420" width="270" height="62" rx="6" fill="#fde9d3" stroke="#d9772b" stroke-width="2"/>
    <text x="235" y="440" font-family="Courier New, monospace" font-weight="bold">app/main.f90</text><text x="235" y="457" font-size="11" fill="#555555">only calls the public interface</text><text x="235" y="473" font-size="11" fill="#a04a00" font-weight="bold">recompiled for nothing</text>
  </g>
  <line x1="235" y1="178" x2="235" y2="218" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="235" y1="270" x2="235" y2="310" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="235" y1="376" x2="235" y2="416" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="248" y="204" font-size="10.5" fill="#1c4b73">.mod</text>
  <text x="248" y="296" font-size="10.5" fill="#1c4b73">.mod</text>
  <text x="248" y="402" font-size="10.5" fill="#1c4b73">.mod</text>
  <text x="235" y="516" font-size="12" fill="#444444" text-anchor="middle">Any change to the module file, or to its object file when the</text>
  <text x="235" y="533" font-size="12" fill="#444444" text-anchor="middle">Makefile depends on that, forces every user to compile again.</text>
  <text x="235" y="560" font-size="12" font-weight="bold" fill="#a04a00" text-anchor="middle">2 of 4 units recompiled</text>

  <!-- right panel -->
  <rect x="490" y="64" width="430" height="520" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="705" y="90" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">With submodules</text>
  <text x="705" y="107" font-size="11.5" fill="#666666" text-anchor="middle">heatflow_solver keeps interfaces, bodies live in submodules</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="570" y="130" width="270" height="40" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="705" y="148" font-family="Courier New, monospace" font-weight="bold">heatflow_kinds</text><text x="705" y="163" font-size="11" fill="#555555">not recompiled</text>
    <rect x="570" y="200" width="270" height="40" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="705" y="218" font-family="Courier New, monospace" font-weight="bold">heatflow_grid</text><text x="705" y="233" font-size="11" fill="#555555">not recompiled</text>
    <rect x="570" y="270" width="270" height="48" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="705" y="290" font-family="Courier New, monospace" font-weight="bold">heatflow_solver</text><text x="705" y="307" font-size="11" fill="#555555">interfaces only: not recompiled</text>
    <rect x="510" y="368" width="190" height="62" rx="6" fill="#fde9d3" stroke="#d9772b" stroke-width="2"/>
    <text x="605" y="388" font-family="Courier New, monospace" font-weight="bold" font-size="12">heatflow_jacobi</text><text x="605" y="405" font-size="11" fill="#555555">submodule, edited</text><text x="605" y="421" font-size="11" fill="#a04a00" font-weight="bold">recompiled</text>
    <rect x="730" y="368" width="170" height="62" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="815" y="388" font-family="Courier New, monospace" font-weight="bold" font-size="12">heatflow_ftcs</text><text x="815" y="405" font-size="11" fill="#555555">submodule</text><text x="815" y="421" font-size="11" fill="#555555">not recompiled</text>
    <rect x="570" y="462" width="270" height="40" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="705" y="480" font-family="Courier New, monospace" font-weight="bold">app/main.f90</text><text x="705" y="495" font-size="11" fill="#555555">not recompiled</text>
  </g>
  <line x1="705" y1="170" x2="705" y2="196" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="705" y1="240" x2="705" y2="266" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="640" y1="318" x2="610" y2="364" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <line x1="770" y1="318" x2="810" y2="364" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <path d="M 850 294 C 912 330 912 440 845 478" fill="none" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="605" y1="430" x2="640" y2="458" stroke="#999999" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#l)"/>
  <line x1="815" y1="430" x2="780" y2="458" stroke="#999999" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#l)"/>
  <text x="590" y="344" font-size="10.5" fill="#1c4b73" text-anchor="end">.smod</text>
  <text x="824" y="344" font-size="10.5" fill="#1c4b73">.smod</text>
  <text x="716" y="190" font-size="10.5" fill="#1c4b73">.mod</text>
  <text x="716" y="260" font-size="10.5" fill="#1c4b73">.mod</text>
  <text x="906" y="352" font-size="10.5" fill="#1c4b73" text-anchor="end">.mod</text>
  <text x="705" y="522" font-size="12" fill="#444444" text-anchor="middle">Solid arrows: needed to compile. Dashed: submodule needs the parent.</text>
  <text x="705" y="539" font-size="12" fill="#444444" text-anchor="middle">Dotted grey: object code, needed only when the program is linked.</text>
  <text x="705" y="560" font-size="12" font-weight="bold" fill="#a04a00" text-anchor="middle">1 of 6 units recompiled, then relink</text>
</svg>
