<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 464" width="720" height="464" role="img" aria-labelledby="t d">
  <title id="t">Filter, wrapper and embedded feature selection</title>
  <desc id="d">Three columns. Filter methods score each feature with a statistic and keep the best, without a model. Wrapper methods repeatedly fit a model on candidate feature subsets and keep the subset that scores best. Embedded methods read the importance or coefficient of each feature from one fitted model.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="462" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Three ways to choose features</text>
  <rect x="24" y="56" width="208" height="364" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <rect x="24" y="56" width="208" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="128" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Filter</text>
  <text x="128" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">no model involved</text>
  <rect x="38" y="128" width="180" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="128.0" y="154.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Score every feature</text>
  <path d="M128 170 L128 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="38" y="190" width="180" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="128.0" y="216.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Rank the scores</text>
  <path d="M128 232 L128 252" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="38" y="252" width="180" height="42" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="128.0" y="278.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Keep k best</text>
  <text x="128" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569">Classes</text>
  <text x="128" y="356" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">VarianceThreshold</text>
  <text x="128" y="373" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SelectKBest</text>
  <text x="128" y="390" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SelectPercentile</text>
  <text x="128" y="407" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SelectFpr, Fdr, Fwe</text>
  <rect x="256" y="56" width="208" height="364" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="256" y="56" width="208" height="56" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Wrapper</text>
  <text x="360" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">model is refitted many times</text>
  <rect x="270" y="128" width="180" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360.0" y="154.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Choose a subset</text>
  <path d="M360 170 L360 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="270" y="190" width="180" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360.0" y="216.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Fit and cross-validate</text>
  <path d="M360 232 L360 252" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="270" y="252" width="180" height="42" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360.0" y="278.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Add or remove one</text>
  <path d="M450 273 L460 273 L460 149 L452 149" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="360" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569">Classes</text>
  <text x="360" y="356" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">RFE, RFECV</text>
  <text x="360" y="373" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SequentialFeatureSelector</text>
  <rect x="488" y="56" width="208" height="364" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <rect x="488" y="56" width="208" height="56" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="592" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Embedded</text>
  <text x="592" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">model is fitted once</text>
  <rect x="502" y="128" width="180" height="42" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="592.0" y="154.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Fit one estimator</text>
  <path d="M592 170 L592 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="502" y="190" width="180" height="42" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="592.0" y="216.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Read coef_ or importances</text>
  <path d="M592 232 L592 252" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="502" y="252" width="180" height="42" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="592.0" y="278.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Keep the largest</text>
  <text x="592" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569">Classes</text>
  <text x="592" y="356" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SelectFromModel</text>
  <text x="592" y="373" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">with L1, Lasso, trees</text>
  <text x="24" y="446" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Every method must be fitted on the training fold only, for example as a Pipeline step.</text>
</svg>
