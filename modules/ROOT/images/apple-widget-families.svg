<svg viewBox="0 0 760 520" width="760" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">PinnedNotesWidget in every family</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">One widget declaration; the family decides the layout, the surface decides the rendering</text>

  <!-- Section label: system families -->
  <text x="24" y="80" font-size="14" font-weight="bold" fill="#1c4b73">System families</text>
  <text x="170" y="80" font-size="12" fill="#666666">Home Screen, desktop, StandBy, CarPlay, visionOS surfaces</text>

  <!-- systemSmall -->
  <rect x="24" y="94" width="120" height="120" rx="22" fill="#f3efe4" stroke="#8a7a52" stroke-width="1.6"/>
  <text x="38" y="118" font-size="12" fill="#1c4b73" font-weight="bold">📌 birds</text>
  <text x="38" y="140" font-size="13" fill="#222222" font-weight="bold">Heron nest,</text>
  <text x="38" y="157" font-size="13" fill="#222222" font-weight="bold">north bank</text>
  <text x="38" y="196" font-size="11" fill="#666666">2 h ago</text>
  <text x="84" y="234" font-size="12" fill="#333333" text-anchor="middle">systemSmall</text>
  <text x="84" y="250" font-size="11" fill="#666666" text-anchor="middle">widgetURL; StandBy, CarPlay</text>

  <!-- systemMedium -->
  <rect x="164" y="94" width="254" height="120" rx="22" fill="#f3efe4" stroke="#8a7a52" stroke-width="1.6"/>
  <text x="180" y="118" font-size="12" fill="#1c4b73" font-weight="bold">📌 Pinned</text>
  <line x1="180" y1="128" x2="402" y2="128" stroke="#d8ccae" stroke-width="1"/>
  <text x="180" y="147" font-size="13" fill="#222222">Heron nest, north bank</text>
  <circle cx="392" cy="143" r="9" fill="#ffffff" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="180" y="171" font-size="13" fill="#222222">Water sample B-3</text>
  <circle cx="392" cy="167" r="9" fill="#ffffff" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="180" y="195" font-size="13" fill="#222222">Oak gall survey</text>
  <circle cx="392" cy="191" r="9" fill="#ffffff" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="291" y="234" font-size="12" fill="#333333" text-anchor="middle">systemMedium</text>
  <text x="291" y="250" font-size="11" fill="#666666" text-anchor="middle">Link per row + Button(intent: TogglePinIntent)</text>

  <!-- systemLarge / extra large portrait on a wall -->
  <rect x="440" y="70" width="296" height="196" rx="6" fill="#eef2f5" stroke="#9fb7cf" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="452" y="88" font-size="11" fill="#555555">visionOS wall (recessed, paper texture)</text>
  <rect x="470" y="98" width="110" height="150" rx="16" fill="#fbf8ef" stroke="#8a7a52" stroke-width="1.6"/>
  <text x="482" y="120" font-size="11" fill="#1c4b73" font-weight="bold">📌 6 pinned</text>
  <rect x="482" y="130" width="86" height="8" rx="3" fill="#d8ccae"/>
  <rect x="482" y="146" width="70" height="8" rx="3" fill="#d8ccae"/>
  <rect x="482" y="162" width="80" height="8" rx="3" fill="#d8ccae"/>
  <rect x="482" y="178" width="60" height="8" rx="3" fill="#d8ccae"/>
  <rect x="482" y="194" width="76" height="8" rx="3" fill="#d8ccae"/>
  <rect x="482" y="210" width="66" height="8" rx="3" fill="#d8ccae"/>
  <rect x="610" y="120" width="104" height="104" rx="16" fill="#fbf8ef" stroke="#8a7a52" stroke-width="1.6"/>
  <text x="662" y="170" font-size="28" fill="#1c4b73" text-anchor="middle" font-weight="bold">📌 6</text>
  <text x="662" y="196" font-size="11" fill="#666666" text-anchor="middle">simplified</text>
  <text x="525" y="262" font-size="11" fill="#333333" text-anchor="middle">systemExtraLargePortrait</text>
  <text x="662" y="240" font-size="11" fill="#333333" text-anchor="middle">far away: LevelOfDetail</text>

  <!-- Section label: accessory families -->
  <text x="24" y="296" font-size="14" font-weight="bold" fill="#1c4b73">Accessory families</text>
  <text x="182" y="296" font-size="12" fill="#666666">Lock Screen and Apple Watch: accented, monochrome or tinted</text>

  <!-- accessoryCircular -->
  <circle cx="84" cy="360" r="44" fill="#2b2b2b"/>
  <path d="M 56 388 A 40 40 0 1 1 112 388" fill="none" stroke="#9fd0ff" stroke-width="5" stroke-linecap="round"/>
  <text x="84" y="366" font-size="16" fill="#ffffff" text-anchor="middle">📌</text>
  <text x="84" y="424" font-size="12" fill="#333333" text-anchor="middle">accessoryCircular</text>
  <text x="84" y="440" font-size="11" fill="#666666" text-anchor="middle">pin-count gauge</text>

  <!-- accessoryRectangular -->
  <rect x="160" y="324" width="190" height="72" rx="12" fill="#2b2b2b"/>
  <text x="174" y="346" font-size="11" fill="#9fd0ff" font-weight="bold">📌 birds  (accent group)</text>
  <text x="174" y="366" font-size="13" fill="#ffffff" font-weight="bold">Heron nest, north bank</text>
  <text x="174" y="384" font-size="11" fill="#bbbbbb">2 h ago</text>
  <text x="255" y="424" font-size="12" fill="#333333" text-anchor="middle">accessoryRectangular</text>
  <text x="255" y="440" font-size="11" fill="#666666" text-anchor="middle">widgetAccentable() header</text>

  <!-- accessoryInline -->
  <rect x="372" y="346" width="170" height="26" rx="13" fill="#2b2b2b"/>
  <text x="457" y="364" font-size="12" fill="#ffffff" text-anchor="middle">Heron nest, north bank</text>
  <text x="457" y="424" font-size="12" fill="#333333" text-anchor="middle">accessoryInline</text>
  <text x="457" y="440" font-size="11" fill="#666666" text-anchor="middle">one line above the clock</text>

  <!-- accessoryCorner on a watch dial -->
  <circle cx="640" cy="360" r="52" fill="#1a1a1a" stroke="#555555" stroke-width="2"/>
  <text x="640" y="366" font-size="16" fill="#ffffff" text-anchor="middle">10:09</text>
  <circle cx="602" cy="322" r="11" fill="#2b2b2b" stroke="#9fd0ff" stroke-width="1.5"/>
  <text x="602" y="327" font-size="11" fill="#ffffff" text-anchor="middle">📌</text>
  <path id="wf-curve" d="M 594 392 A 52 52 0 0 1 588 356" fill="none"/>
  <path d="M 592 345 A 56 56 0 0 1 620 311" fill="none" stroke="#9fd0ff" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="640" y="424" font-size="12" fill="#333333" text-anchor="middle">accessoryCorner (watchOS)</text>
  <text x="640" y="440" font-size="11" fill="#666666" text-anchor="middle">widgetLabel curves along the dial</text>

  <!-- Controls panel -->
  <rect x="24" y="460" width="712" height="48" rx="8" fill="#f5f2fa" stroke="#c9b3d6" stroke-width="1"/>
  <circle cx="60" cy="484" r="16" fill="#ffffff" stroke="#6b4a86" stroke-width="1.6"/>
  <text x="60" y="489" font-size="13" fill="#6b4a86" text-anchor="middle">✎</text>
  <text x="88" y="480" font-size="13" fill="#222222" font-weight="bold">Controls are not a family:</text>
  <text x="88" y="498" font-size="12" fill="#444444">QuickCaptureControl appears in Control Center, on the Lock Screen and on the Action button (iOS 18+, macOS and watchOS 26+).</text>
</svg>
