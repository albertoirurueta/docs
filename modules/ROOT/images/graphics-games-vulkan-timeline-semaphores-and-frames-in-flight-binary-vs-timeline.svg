<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tl-bt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Binary and timeline semaphores</text>
<rect x="20" y="50" width="350" height="330" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="195" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Binary semaphore (VkSemaphore, core 1.0)</text>
<rect x="50" y="95" width="110" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="121.0" text-anchor="middle" font-size="12" fill="#374151">unsignaled</text>
<rect x="230" y="95" width="110" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="285.0" y="121.0" text-anchor="middle" font-size="12" fill="#065F46">signaled</text>
<line x1="160" y1="108" x2="228" y2="108" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-bt)"/>
<line x1="228" y1="128" x2="162" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tl-bt)"/>
<text x="195" y="100" text-anchor="middle" font-size="11" fill="#374151">signal</text>
<text x="195" y="148" text-anchor="middle" font-size="11" fill="#374151">wait</text>
<text x="45" y="185" text-anchor="start" font-size="12" fill="#374151">- Device to device only</text>
<text x="45" y="211" text-anchor="start" font-size="12" fill="#374151">- One signal pairs with one wait</text>
<text x="45" y="237" text-anchor="start" font-size="12" fill="#374151">- The wait resets it to unsignaled</text>
<text x="45" y="263" text-anchor="start" font-size="12" fill="#374151">- Signal must be pending before a wait</text>
<text x="45" y="289" text-anchor="start" font-size="12" fill="#374151">- Cannot be read or waited on by the host</text>
<text x="45" y="315" text-anchor="start" font-size="12" fill="#374151">- Needed for acquire and present</text>
<rect x="390" y="50" width="350" height="330" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="565" y="76" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Timeline semaphore (core 1.2)</text>
<rect x="420" y="95" width="60" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="450.0" y="121.0" text-anchor="middle" font-size="12" fill="#3730A3">3</text>
<rect x="490" y="95" width="60" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="520.0" y="121.0" text-anchor="middle" font-size="12" fill="#3730A3">4</text>
<rect x="560" y="95" width="60" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="590.0" y="121.0" text-anchor="middle" font-size="12" fill="#3730A3">5</text>
<rect x="630" y="95" width="60" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="660.0" y="121.0" text-anchor="middle" font-size="12" fill="#92400E">6</text>
<text x="565" y="160" text-anchor="middle" font-size="11" fill="#374151">one 64-bit counter that only increases</text>
<text x="415" y="195" text-anchor="start" font-size="12" fill="#374151">- Signal a value, wait for value at least N</text>
<text x="415" y="221" text-anchor="start" font-size="12" fill="#374151">- Many waiters on the same value, any order</text>
<text x="415" y="247" text-anchor="start" font-size="12" fill="#374151">- Host can wait, signal and read the value</text>
<text x="415" y="273" text-anchor="start" font-size="12" fill="#374151">- Replaces many fences and binary ones</text>
<text x="415" y="299" text-anchor="start" font-size="12" fill="#374151">- Waits may be submitted before signals</text>
<text x="415" y="325" text-anchor="start" font-size="12" fill="#374151">- Not usable for acquire or present</text>
</svg>
