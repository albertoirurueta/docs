  <text x="380" y="372" font-size="11" fill="#374151" text-anchor="middle">Wide, touching or full-width elements can stack badly: break them up, group related elements, keep inside safe margins.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic website editor, not a screenshot of any product.</text>
