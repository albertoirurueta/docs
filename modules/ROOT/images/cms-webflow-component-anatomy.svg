<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Anatomy of a Webflow component: the main component with its structure, props, a slot and style variants, and the instances that override props and fill the slot">
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">Anatomy of a component: Fernbrook Plant card</text>
<rect x="20" y="50" width="400" height="450" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="36" y="76" font-size="16" font-weight="700" fill="#0B4F6C">Main component (edited on the Component Canvas)</text>
<rect x="40" y="94" width="360" height="240" rx="6" fill="#FFFFFF" stroke="#0B4F6C" stroke-width="2"/>
<text x="52" y="116" font-size="13" font-weight="700" fill="#0B4F6C">Structure: shared by every instance and variant</text>
<rect x="60" y="128" width="320" height="60" rx="4" fill="#CDE6F5" stroke="#0B4F6C"/>
<text x="72" y="150" font-size="13" fill="#0B4F6C">Image  (prop: Image)</text>
<text x="72" y="170" font-size="12" fill="#0B4F6C">alt text exposed as a prop</text>
<rect x="60" y="196" width="320" height="34" rx="4" fill="#CDE6F5" stroke="#0B4F6C"/>
<text x="72" y="218" font-size="13" fill="#0B4F6C">Heading  (prop: Text, group Content)</text>
<rect x="60" y="238" width="320" height="34" rx="4" fill="#CDE6F5" stroke="#0B4F6C"/>
<text x="72" y="260" font-size="13" fill="#0B4F6C">Link  (prop: Link, group Action)</text>
<rect x="60" y="280" width="320" height="44" rx="4" fill="#FDEBD3" stroke="#B26A00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="72" y="299" font-size="13" font-weight="700" fill="#7A4800">Slot  (drop other components here)</text>
<text x="72" y="316" font-size="12" fill="#7A4800">empty by default; filled per instance</text>
<rect x="40" y="346" width="360" height="140" rx="6" fill="#F4F4F4" stroke="#555555"/>
<text x="52" y="368" font-size="13" font-weight="700" fill="#333333">Style variants (one variant property)</text>
<rect x="60" y="380" width="320" height="28" rx="4" fill="#FFFFFF" stroke="#555555"/>
<text x="72" y="399" font-size="13" fill="#333333">Base: white card, 1 px border (edits inherited)</text>
<rect x="60" y="414" width="320" height="28" rx="4" fill="#FFFFFF" stroke="#555555"/>
<text x="72" y="433" font-size="13" fill="#333333">Featured: green border (this variant only)</text>
<rect x="60" y="448" width="320" height="28" rx="4" fill="#FFFFFF" stroke="#555555"/>
<text x="72" y="467" font-size="13" fill="#333333">Compact: smaller padding (this variant only)</text>
<text x="450" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4F6C">instances</text>
<path d="M424 270 L476 270" stroke="#0B4F6C" stroke-width="3" fill="none"/>
<path d="M476 270 L466 263 M476 270 L466 277" stroke="#0B4F6C" stroke-width="3" fill="none"/>
<text x="450" y="290" text-anchor="middle" font-size="11" fill="#333333">structure +</text>
<text x="450" y="304" text-anchor="middle" font-size="11" fill="#333333">style flow</text>
<text x="450" y="318" text-anchor="middle" font-size="11" fill="#333333">down</text>
<rect x="480" y="50" width="400" height="140" rx="8" fill="#FFFFFF" stroke="#2F7D32" stroke-width="2"/>
<text x="496" y="76" font-size="14" font-weight="700" fill="#1B5E20">Instance 1: Monstera (Base variant)</text>
<text x="496" y="100" font-size="13" fill="#333333">Image: monstera.webp   Heading: Monstera deliciosa</text>
<text x="496" y="120" font-size="13" fill="#333333">Link: /plants/monstera-deliciosa</text>
<text x="496" y="140" font-size="13" fill="#333333">Slot: empty</text>
<text x="496" y="166" font-size="12" fill="#1B5E20">Overrides: image, heading, link</text>
<rect x="480" y="204" width="400" height="140" rx="8" fill="#FFFFFF" stroke="#2F7D32" stroke-width="2"/>
<text x="496" y="230" font-size="14" font-weight="700" fill="#1B5E20">Instance 2: Fern (Featured variant)</text>
<text x="496" y="254" font-size="13" fill="#333333">Image: fern.webp   Heading: Boston fern</text>
<text x="496" y="274" font-size="13" fill="#333333">Link: /plants/boston-fern</text>
<text x="496" y="294" font-size="13" fill="#333333">Slot: Badge component (New arrival)</text>
<text x="496" y="320" font-size="12" fill="#1B5E20">Overrides: props, variant, slot content</text>
<rect x="480" y="358" width="400" height="142" rx="8" fill="#F4F4F4" stroke="#555555" stroke-dasharray="6 4" stroke-width="2"/>
<text x="496" y="384" font-size="14" font-weight="700" fill="#333333">Unlinked copy (plain elements)</text>
<text x="496" y="408" font-size="13" fill="#333333">No longer follows the main component.</text>
<text x="496" y="428" font-size="13" fill="#333333">Structure and styles can now be edited</text>
<text x="496" y="448" font-size="13" fill="#333333">freely, and later changes to the main</text>
<text x="496" y="468" font-size="13" fill="#333333">component do not reach it.</text>
</svg>
