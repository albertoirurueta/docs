<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
<title>Views share memory, copies do not</title>
<desc>A slice a[:, ::2] is a view onto the same 12 element buffer, while a[[0, 2]] is a copy stored in a new buffer.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0F172A" text-anchor="start" font-weight="bold">One buffer, two results</text>
<text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="start" font-weight="bold">Buffer owned by a (12 int64 values)</text>
<rect x="24" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="50" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">0</text>
<rect x="80" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="106" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
<rect x="136" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="162" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">2</text>
<rect x="192" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="218" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">3</text>
<rect x="248" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="274" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">4</text>
<rect x="304" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="330" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">5</text>
<rect x="360" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="386" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">6</text>
<rect x="416" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="442" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">7</text>
<rect x="472" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="498" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">8</text>
<rect x="528" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="554" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">9</text>
<rect x="584" y="76" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="610" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">10</text>
<rect x="640" y="76" width="52" height="32" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="666" y="97" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">11</text>
<text x="24" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="start" font-weight="bold">View: v = a[:, ::2]</text>
<text x="24" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">v.base is a, shares_memory is True, no data copied</text>
<rect x="24" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="50" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">0</text>
<rect x="80" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="106" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">2</text>
<rect x="136" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="162" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">4</text>
<rect x="192" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="218" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">6</text>
<rect x="248" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="274" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">8</text>
<rect x="304" y="166" width="52" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="330" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">10</text>
<text x="380" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">same bytes, other strides</text>
<text x="24" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="start" font-weight="bold">Copy: c = a[[0, 2]] (advanced indexing)</text>
<text x="24" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">c.base is None, shares_memory is False, new buffer of rows 0 and 2</text>
<rect x="24" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="50" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">0</text>
<rect x="80" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="106" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
<rect x="136" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="162" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">2</text>
<rect x="192" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="218" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">3</text>
<rect x="248" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="274" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">8</text>
<rect x="304" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="330" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">9</text>
<rect x="360" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="386" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">10</text>
<rect x="416" y="270" width="52" height="32" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="442" y="291" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">11</text>
<text x="24" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="start">Writing through v changes a; writing to c never does.</text>
</svg>
