<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Selenium Grid topology: tests use RemoteWebDriver to send commands to the Router. A new session request goes into the New Session Queue, the Distributor polls the queue, picks a free slot on a Node, creates the session there and records the session id and Node in the Session Map. Later commands go from the Router to the Node that owns the session, found through the Session Map. Nodes, the Distributor, the Session Map and the queue exchange registration and heartbeat events over the Event Bus. Standalone mode runs everything in one process and Hub mode runs the Router, Distributor, Session Map, queue and Event Bus together.</title>
<style>
:root { --bg:#ffffff; --fg:#1f2933; --muted:#52606d; --line:#37474f;
  --test-f:#e3f2fd; --test-s:#1565c0; --comp-f:#e8f5e9; --comp-s:#2e7d32; --bus-f:#fff8e1; --bus-s:#b26a00;
  --node-f:#f3e5f5; --node-s:#6a1b9a; --frame:#78909c; --badge:#37474f; --badge-t:#ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1b1f23; --fg:#e6edf3; --muted:#a8b3bf; --line:#b0bec5;
    --test-f:#14304f; --test-s:#64b5f6; --comp-f:#173a21; --comp-s:#66bb6a; --bus-f:#43330c; --bus-s:#ffca28;
    --node-f:#33203d; --node-s:#ce93d8; --frame:#90a4ae; --badge:#e6edf3; --badge-t:#1b1f23; }
}
.bg { fill:var(--bg); }
.t { fill:var(--fg); font-size:12px; }
.tb { fill:var(--fg); font-size:13px; font-weight:bold; }
.m { fill:var(--muted); font-size:10.5px; }
.h { fill:var(--fg); font-size:16px; font-weight:bold; }
.test { fill:var(--test-f); stroke:var(--test-s); stroke-width:1.5; }
.comp { fill:var(--comp-f); stroke:var(--comp-s); stroke-width:1.5; }
.bus { fill:var(--bus-f); stroke:var(--bus-s); stroke-width:1.5; }
.node { fill:var(--node-f); stroke:var(--node-s); stroke-width:1.5; }
.frame { fill:none; stroke:var(--frame); stroke-width:1.2; stroke-dasharray:6 4; }
.ln { stroke:var(--line); stroke-width:1.6; fill:none; }
.dash { stroke:var(--line); stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
.badge { fill:var(--badge); }
.bt { fill:var(--badge-t); font-size:11px; font-weight:bold; }
.ah { fill:var(--line); }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="820" height="560"/>
<text x="410" y="26" class="h" text-anchor="middle">Selenium Grid: who talks to whom</text>

<rect class="frame" x="190" y="48" width="420" height="408" rx="10"/>
<text class="m" x="400" y="446" text-anchor="middle">Hub: these five components in one process. Standalone: the same, plus a Node.</text>
<rect class="test" x="20" y="70" width="140" height="90" rx="7"/>
<text class="tb" x="90.0" y="92" text-anchor="middle">Tests</text>
<text class="m" x="90.0" y="110" text-anchor="middle">RemoteWebDriver</text>
<text class="m" x="90.0" y="125" text-anchor="middle">Java, Python, C#, ...</text>
<rect class="comp" x="210" y="90" width="160" height="50" rx="7"/>
<text class="tb" x="290.0" y="120.0" text-anchor="middle">Router</text>
<rect class="comp" x="430" y="90" width="160" height="50" rx="7"/>
<text class="tb" x="510.0" y="120.0" text-anchor="middle">New Session Queue</text>
<rect class="comp" x="430" y="200" width="160" height="50" rx="7"/>
<text class="tb" x="510.0" y="230.0" text-anchor="middle">Distributor</text>
<rect class="comp" x="210" y="200" width="160" height="50" rx="7"/>
<text class="tb" x="290.0" y="230.0" text-anchor="middle">Session Map</text>
<rect class="bus" x="210" y="340" width="380" height="50" rx="7"/>
<text class="tb" x="400.0" y="370.0" text-anchor="middle">Event Bus</text>
<rect class="node" x="650" y="92" width="150" height="100" rx="7"/>
<text class="tb" x="725.0" y="114" text-anchor="middle">Node (Chrome)</text>
<text class="m" x="725.0" y="132" text-anchor="middle">2 slots, driver + browser</text>
<text class="m" x="725.0" y="147" text-anchor="middle">noVNC on 7900, video</text>
<rect class="node" x="650" y="212" width="150" height="100" rx="7"/>
<text class="tb" x="725.0" y="234" text-anchor="middle">Node (Firefox)</text>
<text class="m" x="725.0" y="252" text-anchor="middle">2 slots, geckodriver</text>
<text class="m" x="725.0" y="267" text-anchor="middle">+ Firefox</text>
<rect class="node" x="650" y="340" width="150" height="100" rx="7"/>
<text class="tb" x="725.0" y="362" text-anchor="middle">Node (Docker)</text>
<text class="m" x="725.0" y="380" text-anchor="middle">one container per session</text>
<text class="m" x="725.0" y="395" text-anchor="middle">(Dynamic Grid)</text>
<path class="ln" d="M160,115 L210,115" marker-end="url(#ar)"/>
<circle class="badge" cx="185" cy="103" r="9"/><text class="bt" x="185" y="107" text-anchor="middle">1</text>
<path class="ln" d="M370,115 L430,115" marker-end="url(#ar)"/>
<circle class="badge" cx="400" cy="103" r="9"/><text class="bt" x="400" y="107" text-anchor="middle">2</text>
<path class="dash" d="M510,200 L510,140" marker-start="url(#ar)" marker-end="url(#ar)"/>
<circle class="badge" cx="524" cy="170" r="9"/><text class="bt" x="524" y="174" text-anchor="middle">3</text>
<path class="ln" d="M430,225 L370,225" marker-end="url(#ar)"/>
<circle class="badge" cx="400" cy="213" r="9"/><text class="bt" x="400" y="217" text-anchor="middle">4</text>
<path class="ln" d="M590,215 L650,160" marker-end="url(#ar)"/>
<path class="ln" d="M590,235 L650,260" marker-end="url(#ar)"/>
<circle class="badge" cx="622" cy="200" r="9"/><text class="bt" x="622" y="204" text-anchor="middle">5</text>
<path class="dash" d="M290,140 L290,200" marker-end="url(#ar)"/>
<circle class="badge" cx="276" cy="170" r="9"/><text class="bt" x="276" y="174" text-anchor="middle">6</text>
<path class="ln" d="M250,90 L250,68 L725,68 L725,92" marker-end="url(#ar)"/>
<circle class="badge" cx="470" cy="68" r="9"/><text class="bt" x="470" y="72" text-anchor="middle">7</text>
<path class="dash" d="M290,250 L290,340" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path class="dash" d="M510,250 L510,340" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path class="dash" d="M650,390 L590,390" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="m" x="305" y="300">events</text><text class="m" x="525" y="300">events</text>


<text class="t" x="20" y="478" style="font-size:11.5px">1  Tests send the new session request to the Router.   2  The Router adds it to the New Session Queue.</text>
<text class="t" x="20" y="495" style="font-size:11.5px">3  The Distributor polls the queue and matches the request to a free slot.   4  It records session id and Node in the Session Map.</text>
<text class="t" x="20" y="512" style="font-size:11.5px">5  It asks the Node to create the session (HTTP).   6  Later commands: the Router looks up the owning Node in the Session Map,</text>
<text class="t" x="20" y="529" style="font-size:11.5px">7  and then forwards them straight to that Node. Dashed lines are lookups and Event Bus messages (including Node heartbeats).</text>
</svg>