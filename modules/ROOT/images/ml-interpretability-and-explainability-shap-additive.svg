<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">SHAP values add up to the prediction</title>
<desc id="d">A horizontal waterfall starts at the base value 0.30, which is the average prediction. Income adds 0.25, age adds 0.10, debt subtracts 0.20 and the remaining features add 0.05, ending at the prediction 0.50 for this one row.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One row: base value + sum of SHAP values = prediction</text>
<line x1="150" y1="60" x2="150" y2="262" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="150" y="278" font-size="12" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">0.30</text>
<text x="20" y="90" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">base value</text>
<rect x="148" y="72" width="4" height="26" rx="2" fill="#94A3B8"/>
<text x="20" y="130" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">income</text>
<rect x="150" y="112" width="125" height="26" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="285" y="130" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">+0.25</text>
<text x="20" y="170" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">age</text>
<rect x="275" y="152" width="50" height="26" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="335" y="170" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">+0.10</text>
<text x="20" y="210" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">debt</text>
<rect x="225" y="192" width="100" height="26" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="180" y="210" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">-0.20</text>
<text x="20" y="250" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">others</text>
<rect x="225" y="232" width="25" height="26" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="260" y="250" font-size="13" fill="#0F172A" font-family="Menlo, Consolas, monospace">+0.05</text>
<line x1="250" y1="62" x2="250" y2="262" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="250" y="56" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="Menlo, Consolas, monospace">prediction 0.50</text>
<text x="520" y="150" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">Teal bars push the prediction up,</text>
<text x="520" y="170" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">the rose bar pushes it down. The</text>
<text x="520" y="190" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">signed bars sum exactly to the gap</text>
<text x="520" y="210" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">between 0.30 and 0.50.</text>
</svg>
