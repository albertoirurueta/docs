<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Drupal cache layers from the visitor to the database</title>
  <desc id="d">A request travels from the browser through a CDN, a reverse proxy such as Varnish, the Internal Page Cache for anonymous visitors, the Dynamic Page Cache, BigPipe placeholders, the render cache and cache bins backed by the database or Redis. Cache tags invalidate every layer.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>

  <text x="20" y="28" font-weight="bold" font-size="15" fill="#263238">Request path (top to bottom) and where a hit stops the request</text>

  <rect x="20" y="45" width="560" height="42" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="40" y="70" fill="#263238"><tspan font-weight="bold">Browser</tspan> -- Cache-Control max-age from the Performance page</text>
  <rect x="20" y="105" width="560" height="42" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="40" y="130" fill="#263238"><tspan font-weight="bold">CDN</tspan> -- edge copy, needs Purge or short s-maxage (contrib)</text>
  <rect x="20" y="165" width="560" height="42" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="40" y="190" fill="#263238"><tspan font-weight="bold">Varnish or other reverse proxy</tspan> -- BAN by tag via Purge (contrib)</text>
  <rect x="20" y="225" width="560" height="42" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="250" fill="#263238"><tspan font-weight="bold">Internal Page Cache</tspan> -- whole page, anonymous only (cache bin: page)</text>
  <rect x="20" y="285" width="560" height="42" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="310" fill="#263238"><tspan font-weight="bold">Dynamic Page Cache</tspan> -- page skeleton, every user (bin: dynamic_page_cache)</text>
  <rect x="20" y="345" width="560" height="42" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="370" fill="#263238"><tspan font-weight="bold">BigPipe</tspan> -- streams personalised placeholders after the skeleton</text>
  <rect x="20" y="405" width="560" height="42" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="430" fill="#263238"><tspan font-weight="bold">Render cache</tspan> -- blocks, entities, fields per context (bin: render)</text>
  <rect x="20" y="465" width="560" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="490" fill="#263238"><tspan font-weight="bold">Cache bins</tspan> -- database tables cache_*, or Redis / Memcache (contrib)</text>
  <text x="40" y="510" fill="#263238">Rebuilt from entities, config and the database on a miss</text>

  <g stroke="#37474f" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M300 87V105"/><path d="M300 147V165"/><path d="M300 207V225"/><path d="M300 267V285"/><path d="M300 327V345"/><path d="M300 387V405"/><path d="M300 447V465"/>
  </g>

  <rect x="620" y="45" width="260" height="140" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="635" y="68" font-weight="bold" fill="#263238">Cacheability metadata</text>
  <text x="635" y="90" fill="#263238">tags: what invalidates it</text>
  <text x="635" y="110" fill="#263238">contexts: what it varies by</text>
  <text x="635" y="130" fill="#263238">max-age: how long it lives</text>
  <text x="635" y="155" fill="#263238">Bubbles up from every element</text>
  <text x="635" y="173" fill="#263238">to the response headers.</text>

  <rect x="620" y="215" width="260" height="110" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="635" y="238" font-weight="bold" fill="#263238">Invalidation by tag</text>
  <text x="635" y="260" fill="#263238">Saving node 5 invalidates the</text>
  <text x="635" y="278" fill="#263238">tags node:5 and node_list in</text>
  <text x="635" y="296" fill="#263238">every bin, and (via Purge)</text>
  <text x="635" y="314" fill="#263238">in the proxy and the CDN.</text>
  <path d="M620 270H585V425H582" stroke="#c62828" stroke-width="1.6" fill="none" marker-end="url(#b)" stroke-dasharray="5 4"/>

  <rect x="620" y="355" width="260" height="110" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="635" y="378" font-weight="bold" fill="#263238">Always uncached</text>
  <text x="635" y="400" fill="#263238">Requests with a session cookie</text>
  <text x="635" y="418" fill="#263238">skip the Internal Page Cache.</text>
  <text x="635" y="436" fill="#263238">POST requests and max-age 0</text>
  <text x="635" y="454" fill="#263238">content are never stored.</text>
</svg>
