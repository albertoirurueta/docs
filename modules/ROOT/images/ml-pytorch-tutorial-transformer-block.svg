<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Pre-norm decoder block built from PyTorch primitives</title>
<desc id="d">An input of shape N by L by E goes through LayerNorm, one packed linear layer producing query, key and value, a split into heads giving N by H by L by E over H, scaled_dot_product_attention with is_causal, a merge of heads and an output projection, then a residual addition. A second LayerNorm, a two-layer MLP with GELU and another residual addition follow.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One block, with the tensor shape after each step</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">
<rect x="30" y="60" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="105" y="84" text-anchor="middle">x</text>
<rect x="30" y="120" width="150" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="105" y="144" text-anchor="middle">LayerNorm</text>
<rect x="30" y="180" width="150" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="204" text-anchor="middle">Linear E to 3E, chunk</text>
<rect x="30" y="240" width="150" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="264" text-anchor="middle">split heads, transpose</text>
<rect x="260" y="240" width="170" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="345" y="258" text-anchor="middle">scaled_dot_product</text>
<text x="345" y="272" text-anchor="middle">_attention(is_causal=True)</text>
<rect x="260" y="180" width="170" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="345" y="204" text-anchor="middle">merge heads, out proj</text>
<rect x="260" y="120" width="170" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="345" y="144" text-anchor="middle">x = x + attention(...)</text>
<rect x="510" y="120" width="170" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="595" y="144" text-anchor="middle">LayerNorm</text>
<rect x="510" y="180" width="170" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="595" y="204" text-anchor="middle">Linear E to 4E, GELU, Linear</text>
<rect x="510" y="240" width="170" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="595" y="264" text-anchor="middle">x = x + mlp(...)</text>
</g>
<line x1="105" y1="100" x2="105" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="105" y1="160" x2="105" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="105" y1="220" x2="105" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="180" y1="260" x2="258" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="345" y1="240" x2="345" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="345" y1="180" x2="345" y2="162" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="140" x2="508" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="595" y1="160" x2="595" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="595" y1="220" x2="595" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M180,80 L230,80 L230,140 L258,140" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<g font-family="Menlo, Consolas, monospace" font-size="11" fill="#475569">
<text x="190" y="152">(N, L, E)</text>
<text x="190" y="212">(N, L, 3E)</text>
<text x="190" y="232">q, k, v</text>
<text x="190" y="292">(N, H, L, E/H)</text>
<text x="436" y="214">(N, L, E)</text>
</g>
<text x="20" y="318" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">N: batch, L: sequence length, E: embedding size, H: number of heads. Dashed amber: the residual connection around attention (the same pattern wraps the MLP).</text>
<text x="20" y="338" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Original drawing based on the primitives used in the PyTorch transformer building blocks tutorial.</text>
</svg>
