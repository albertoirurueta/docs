<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">A scikit-learn pipeline as one ONNX graph</title>
<desc id="d">A fitted pipeline with a column transformer for numeric and categorical columns followed by a classifier is converted by skl2onnx into one ONNX file whose graph has one named input per column and outputs for the label and the probabilities, which ONNX Runtime executes without scikit-learn.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">The whole pipeline becomes one graph</text>
<rect x="24" y="60" width="250" height="240" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="149" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#475569">Python: fitted Pipeline</text>
<rect x="40" y="96" width="218" height="62" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="149" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">ColumnTransformer</text>
<text x="149" y="140" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0F172A">imputer, scaler, one-hot</text>
<rect x="40" y="176" width="218" height="46" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="149" y="204" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">LogisticRegression</text>
<line x1="149" y1="158" x2="149" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="149" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">needs scikit-learn, NumPy,</text>
<text x="149" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">pandas and the pickle's versions</text>
<line x1="274" y1="180" x2="326" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="300" y="168" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#475569">skl2onnx</text>
<rect x="328" y="60" width="368" height="240" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="512" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#475569">pipeline.onnx run by ONNX Runtime</text>
<rect x="344" y="96" width="100" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="394" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">age [N,1]</text>
<rect x="344" y="132" width="100" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="394" y="150" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">income [N,1]</text>
<rect x="344" y="168" width="100" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="394" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">plan [N,1]</text>
<rect x="476" y="96" width="100" height="98" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="526" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">ai.onnx and</text>
<text x="526" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">ai.onnx.ml nodes</text>
<rect x="598" y="96" width="82" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="639" y="121" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">label</text>
<rect x="598" y="150" width="82" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="639" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0F172A">probabili-</text>
<text x="639" y="184" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0F172A">ties [N,2]</text>
<line x1="444" y1="109" x2="474" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="444" y1="145" x2="474" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="444" y1="181" x2="474" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="576" y1="125" x2="596" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="576" y1="165" x2="596" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="512" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">one input per column, element types fixed at conversion,</text>
<text x="512" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">batch dimension left open (None)</text>
<text x="512" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">needs only the runtime, no scikit-learn</text>
</svg>
