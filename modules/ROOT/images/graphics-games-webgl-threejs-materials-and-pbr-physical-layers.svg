<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tjs-mat-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="410" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The layers a MeshPhysicalMaterial can stack on a surface</text>
<rect x="30" y="60" width="380" height="44" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
<text x="46" y="80.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">clearcoat</text>
<text x="46" y="96.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">thin glossy lacquer, own roughness and normal map</text>
<rect x="30" y="110" width="380" height="44" rx="6" fill="#FCE7F3" stroke="#9D174D" stroke-width="1.6"/>
<text x="46" y="130.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">sheen</text>
<text x="46" y="146.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">soft rim of fibres seen at grazing angles</text>
<rect x="30" y="160" width="380" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/>
<text x="46" y="180.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">iridescence</text>
<text x="46" y="196.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">thin film that shifts colour with the view angle</text>
<rect x="30" y="210" width="380" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.6"/>
<text x="46" y="243.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">base: metal or dielectric</text>
<text x="46" y="259.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">color, metalness, roughness, specular, anisotropy</text>
<rect x="30" y="286" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.6"/>
<text x="46" y="319.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">transmission and volume</text>
<text x="46" y="335.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">light continues inside: ior, thickness, attenuation</text>
<line x1="520" y1="70" x2="600" y2="150" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah-webgl-tjs-mat-layers)"/>
<text x="520" y="62" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">incoming light</text>
<line x1="600" y1="150" x2="690" y2="70" stroke="#4F46E5" stroke-width="1.6" marker-end="url(#ah-webgl-tjs-mat-layers)"/>
<text x="695" y="62" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">reflected</text>
<line x1="600" y1="150" x2="640" y2="250" stroke="#047857" stroke-width="1.6" marker-end="url(#ah-webgl-tjs-mat-layers)"/>
<text x="645" y="262" font-size="11" font-weight="normal" fill="#047857" text-anchor="start">refracted through</text>
<line x1="440" y1="150" x2="730" y2="150" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="590" y="175" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">surface</text>
<text x="380" y="384" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each layer is off at zero and adds shader work only when its value is above zero.</text>
<text x="380" y="400" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">GLTFLoader builds this material when a file uses the matching KHR_materials extension.</text>
</svg>
