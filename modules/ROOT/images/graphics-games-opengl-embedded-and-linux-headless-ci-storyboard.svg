<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-embedded-and-linux-headless-ci-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Headless OpenGL in CI with Mesa software rendering</text>
<rect x="20" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="30" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">apt-get install</text>
<text x="30" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  libegl1-mesa-dev</text>
<text x="30" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  libgles2-mesa-dev</text>
<text x="30" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  libgbm-dev</text>
<text x="101" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Install Mesa and EGL</text>
<rect x="206" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="222" cy="66" r="11" fill="#4F46E5"/>
<text x="222" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="216" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">export</text>
<text x="216" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  LIBGL_ALWAYS_SOFTWARE=1</text>
<text x="216" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">export</text>
<text x="216" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  GALLIUM_DRIVER=llvmpipe</text>
<text x="287" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Force the software driver</text>
<rect x="392" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="408" cy="66" r="11" fill="#4F46E5"/>
<text x="408" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="402" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">EGL_PLATFORM_</text>
<text x="402" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  SURFACELESS_MESA</text>
<text x="402" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">eglCreateContext</text>
<text x="402" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">glBindFramebuffer</text>
<text x="473" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Render to an FBO</text>
<rect x="578" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="594" cy="66" r="11" fill="#4F46E5"/>
<text x="594" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="588" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">glReadPixels(...)</text>
<text x="588" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">write book.ppm</text>
<text x="588" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">diff against the</text>
<text x="588" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  golden image</text>
<text x="659" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Read pixels, compare</text>
</svg>
