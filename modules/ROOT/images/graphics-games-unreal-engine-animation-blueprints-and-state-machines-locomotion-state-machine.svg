<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Locomotion state machine of the Librarian</text>
<rect x="300" y="50" width="160" height="36" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="72.2" text-anchor="middle" font-size="12" fill="#1F2937">Entry</text>
<rect x="300" y="120" width="160" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="146.7" text-anchor="middle" font-size="12" fill="#3730A3">Idle / Walk / Run</text>
<text x="380.0" y="161.7" text-anchor="middle" font-size="12" fill="#3730A3">Blend Space 1D on Speed</text>
<rect x="40" y="250" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="276.7" text-anchor="middle" font-size="12" fill="#3730A3">Jump Start</text>
<text x="115.0" y="291.7" text-anchor="middle" font-size="12" fill="#3730A3">plays once</text>
<rect x="305" y="250" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="276.7" text-anchor="middle" font-size="12" fill="#3730A3">Falling Loop</text>
<text x="380.0" y="291.7" text-anchor="middle" font-size="12" fill="#3730A3">looping sequence</text>
<rect x="570" y="250" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="276.7" text-anchor="middle" font-size="12" fill="#3730A3">Land</text>
<text x="645.0" y="291.7" text-anchor="middle" font-size="12" fill="#3730A3">plays once</text>
<line x1="380" y1="86" x2="380" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="300" y1="160" x2="190" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="190" y1="285" x2="305" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="455" y1="285" x2="570" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="645" y1="250" x2="460" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="215" y="195" text-anchor="end" font-size="11" fill="#92400E">IsFalling</text>
<text x="248" y="277" text-anchor="middle" font-size="10" fill="#374151">Time Remaining &lt; 0.1</text>
<text x="512" y="277" text-anchor="middle" font-size="11" fill="#374151">not IsFalling</text>
<text x="590" y="195" text-anchor="start" font-size="11" fill="#374151">Land finished</text>
<rect x="40" y="350" width="680" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="380" y="370" text-anchor="middle" font-size="11" fill="#374151">Each state has its own Anim Graph ending in an Output Pose; each arrow is a transition rule that returns true or false.</text>
<text x="380" y="388" text-anchor="middle" font-size="11" fill="#374151">Blend Logic per transition: Standard Blend, Inertialization or Custom; Priority Order breaks ties.</text>
</svg>
