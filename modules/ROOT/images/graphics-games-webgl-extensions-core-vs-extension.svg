<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ext-core-vs-extension" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where a capability lives in WebGL 1 and WebGL 2</text>
<rect x="20" y="48" width="720" height="26" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="30" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Capability</text>
<text x="210" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">WebGL 1 context</text>
<text x="430" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">WebGL 2 context</text>
<text x="640" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">Rule</text>
<rect x="20" y="82" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="102" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Vertex array objects</text>
<text x="210" y="102" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">OES_vertex_array_object</text>
<text x="430" y="102" font-size="11" font-weight="bold" fill="#065F46" text-anchor="start">core</text>
<text x="640" y="102" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start">core: no call</text>
<rect x="20" y="120" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="140" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Instanced drawing</text>
<text x="210" y="140" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">ANGLE_instanced_arrays</text>
<text x="430" y="140" font-size="11" font-weight="bold" fill="#065F46" text-anchor="start">core</text>
<text x="640" y="140" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start">core: no call</text>
<rect x="20" y="158" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="178" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">32-bit indices</text>
<text x="210" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">OES_element_index_uint</text>
<text x="430" y="178" font-size="11" font-weight="bold" fill="#065F46" text-anchor="start">core</text>
<text x="640" y="178" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start">core: no call</text>
<rect x="20" y="196" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="216" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Depth textures</text>
<text x="210" y="216" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">WEBGL_depth_texture</text>
<text x="430" y="216" font-size="11" font-weight="bold" fill="#065F46" text-anchor="start">core</text>
<text x="640" y="216" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start">core: no call</text>
<rect x="20" y="234" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="254" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Float render targets</text>
<text x="210" y="254" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">WEBGL_color_buffer_float</text>
<text x="430" y="254" font-size="11" font-weight="bold" fill="#92400E" text-anchor="start">EXT_color_buffer_float</text>
<text x="640" y="254" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">still an extension</text>
<rect x="20" y="272" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="292" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Linear filter on float32</text>
<text x="210" y="292" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">OES_texture_float_linear</text>
<text x="430" y="292" font-size="11" font-weight="bold" fill="#92400E" text-anchor="start">OES_texture_float_linear</text>
<text x="640" y="292" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">still an extension</text>
<rect x="20" y="310" width="720" height="32" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="30" y="330" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Anisotropic filtering</text>
<text x="210" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">EXT_texture_filter_anisotropic</text>
<text x="430" y="330" font-size="11" font-weight="bold" fill="#92400E" text-anchor="start">EXT_texture_filter_anisotropic</text>
<text x="640" y="330" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">still an extension</text>
<text x="380" y="360" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Extensions that WebGL 2 made core are always on in a WebGL 2 context. Names in the table are examples,</text>
<text x="380" y="376" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">not a complete list; the registry marks each promoted extension.</text>
</svg>
