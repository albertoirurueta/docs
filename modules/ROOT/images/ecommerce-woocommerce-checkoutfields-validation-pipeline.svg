<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Life of an additional checkout field value: sanitize, validate, persist</title>
  <desc id="d">Seven steps. 1 register the field on woocommerce_init. 2 the Store API request carries the value. 3 sanitize with the field sanitize_callback and the woocommerce_sanitize_additional_field filter. 4 resolve the required and hidden JSON Schema rules against the document object. 5 validate each field with its type checks, validation schema, validate_callback and the woocommerce_validate_additional_field action. 6 validate each location with the woocommerce_blocks_validate_location_address_fields, contact and order actions. 7 persist the values with the woocommerce_set_additional_field_value action. Any error added to the WP_Error object stops the request with HTTP 400 rest_invalid_param and nothing is placed.</desc>
  <rect x="0" y="0" width="980" height="610" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">What happens to a value between the browser and the order</text>
  <g fill="#f2f5f8" font-size="12">
    <rect x="20" y="52" width="250" height="54" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="76" font-weight="bold" font-size="14">1  Register</text>
    <text x="34" y="94" font-size="11">on woocommerce_init</text>
    <rect x="290" y="52" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="74" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_register_additional_checkout_field( $options )</text>
    <text x="304" y="92" font-family="Menlo, Consolas, monospace" font-size="11">Invalid options: _doing_it_wrong notice, the field is skipped</text>
    <rect x="20" y="120" width="250" height="54" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="34" y="144" font-weight="bold" font-size="14">2  Submit</text>
    <text x="34" y="162" font-size="11">Store API request</text>
    <rect x="290" y="120" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="142" font-family="Menlo, Consolas, monospace" font-size="11">POST, PUT or PATCH /wc/store/v1/checkout, or a My Account form</text>
    <text x="304" y="160" font-family="Menlo, Consolas, monospace" font-size="11">contact and order values in additional_fields, address values inside the two addresses</text>
    <rect x="20" y="188" width="250" height="54" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="212" font-weight="bold" font-size="14">3  Sanitize</text>
    <text x="34" y="230" font-size="11">value cleaned, not judged</text>
    <rect x="290" y="188" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="210" font-family="Menlo, Consolas, monospace" font-size="11">sanitize_callback of the field, then the filter</text>
    <text x="304" y="228" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_sanitize_additional_field( $value, $field_id )</text>
    <rect x="20" y="256" width="250" height="54" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="280" font-weight="bold" font-size="14">4  Resolve rules</text>
    <text x="34" y="298" font-size="11">required and hidden</text>
    <rect x="290" y="256" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="278" font-family="Menlo, Consolas, monospace" font-size="11">JSON Schema evaluated on the server against the document object</text>
    <text x="304" y="296" font-family="Menlo, Consolas, monospace" font-size="11">(cart, checkout, customer); hidden fields are skipped</text>
    <rect x="20" y="324" width="250" height="54" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="348" font-weight="bold" font-size="14">5  Validate field</text>
    <text x="34" y="366" font-size="11">one field at a time</text>
    <rect x="290" y="324" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="346" font-family="Menlo, Consolas, monospace" font-size="11">type checks (select enum, date min and max), the validation schema, validate_callback</text>
    <text x="304" y="364" font-family="Menlo, Consolas, monospace" font-size="11">action woocommerce_validate_additional_field( $errors, $field_id, $value )</text>
    <rect x="20" y="392" width="250" height="54" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="34" y="416" font-weight="bold" font-size="14">6  Validate location</text>
    <text x="34" y="434" font-size="11">fields that depend on each other</text>
    <rect x="290" y="392" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="414" font-family="Menlo, Consolas, monospace" font-size="11">action woocommerce_blocks_validate_location_{location}_fields(</text>
    <text x="304" y="432" font-family="Menlo, Consolas, monospace" font-size="11">$errors, $fields, $group ); address runs twice: billing, then shipping</text>
    <rect x="20" y="460" width="250" height="54" rx="8" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="34" y="484" font-weight="bold" font-size="14">7  Persist</text>
    <text x="34" y="502" font-size="11">the order is placed</text>
    <rect x="290" y="460" width="670" height="54" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="304" y="482" font-family="Menlo, Consolas, monospace" font-size="11">action woocommerce_set_additional_field_value( $key, $value, $group, $wc_object )</text>
    <text x="304" y="500" font-family="Menlo, Consolas, monospace" font-size="11">meta keys _wc_billing/, _wc_shipping/ and _wc_other/ on the order and customer</text>
    <rect x="20" y="528" width="940" height="54" rx="8" fill="#8a3b3b" stroke="#f2f5f8"/>
    <text x="34" y="550" font-weight="bold" font-size="14">Any error added to the WP_Error object in steps 5 and 6</text>
    <text x="34" y="570" font-size="12">stops the request with HTTP 400 and the code rest_invalid_param. Nothing is placed and the Checkout block shows the messages next to the fields.</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M145 106 V 120"/>
    <path d="M145 174 V 188"/>
    <path d="M145 242 V 256"/>
    <path d="M145 310 V 324"/>
    <path d="M145 378 V 392"/>
    <path d="M145 446 V 460"/>
  </g>
</svg>
