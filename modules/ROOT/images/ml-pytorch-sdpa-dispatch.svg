<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">SDPA backend dispatch</title>
<desc id="d">Query, key, value and an optional mask enter scaled_dot_product_attention, which picks one of four backends (FlashAttention, memory-efficient, cuDNN or the C++ math path) that you can restrict with the sdpa_kernel context manager.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">F.scaled_dot_product_attention picks a backend</text>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">
<rect x="24" y="64" width="110" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="79" y="86">query (B,H,L,E)</text>
<rect x="24" y="108" width="110" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="79" y="130">key (B,H,S,E)</text>
<rect x="24" y="152" width="110" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="79" y="174">value (B,H,S,Ev)</text>
<rect x="24" y="196" width="110" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/><text x="79" y="218">attn_mask / causal</text>
<rect x="200" y="100" width="150" height="90" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="275" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14">scaled_dot_product</text><text x="275" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14">_attention</text>
<rect x="430" y="56" width="170" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="515" y="80">FLASH_ATTENTION</text>
<rect x="430" y="106" width="170" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="515" y="130">EFFICIENT_ATTENTION</text>
<rect x="430" y="156" width="170" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="515" y="180">CUDNN_ATTENTION</text>
<rect x="430" y="206" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="515" y="230">MATH (C++)</text>
</g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M134,81 L200,130"/><path d="M134,125 L200,140"/><path d="M134,169 L200,155"/><path d="M134,213 L200,170"/>
<path d="M350,130 L430,76"/><path d="M350,140 L430,126"/><path d="M350,150 L430,176"/><path d="M350,160 L430,226"/>
</g>
<circle cx="275" cy="212" r="11" fill="#B45309"/><text x="275" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="640" cy="130" r="11" fill="#0F766E"/><text x="640" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">
<text x="24" y="272">1  Inputs decide eligibility: dtype, mask type, head size and device can rule a backend out.</text>
<text x="24" y="294">2  sdpa_kernel(...) restricts the allowed set; fused kernels run on CUDA, other devices use the C++ path.</text>
</g>
</svg>
