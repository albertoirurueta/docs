<rect x="45" y="211" width="306" height="30" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="351" cy="211" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="351" y="216" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">5</text></g></g>
</svg>
