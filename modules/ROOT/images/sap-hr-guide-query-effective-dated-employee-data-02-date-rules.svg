<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 870" width="1080" height="870" role="img" aria-labelledby="sap-hr-guide-query-effective-dated-employee-data-02-date-rules-title" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
<title id="sap-hr-guide-query-effective-dated-employee-data-02-date-rules-title">Visual Studio Code with the file srv/people-service.js: the excerpt reads asOfDate, fromDate and toDate from the query, rejects a value that is not a date written YYYY-MM-DD, rejects asOfDate together with a range, and adds a where condition that keeps the records whose begin date is on or before the date and whose end date is on or after it; callout 5 marks the file in the explorer</title>
<g><rect x="0" y="0" width="1080" height="870" fill="#1f1f1f" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="30" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
