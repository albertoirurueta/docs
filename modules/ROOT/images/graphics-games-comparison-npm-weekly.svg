<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 517" width="860" height="517" role="img" aria-labelledby="npm-weekly-t npm-weekly-d">
<title id="npm-weekly-t">npm weekly downloads per quarter</title>
<desc id="npm-weekly-d">Average npm downloads per week in each quarter, 2020-Q1 to 2026-Q4 to date, for three, @babylonjs/core and @webgpu/types. three is the most downloaded of the three by a wide margin; the counts include continuous integration and mirror traffic. The last point is the quarter to date. A quarter before a package existed shows n/a, not zero.</desc>
