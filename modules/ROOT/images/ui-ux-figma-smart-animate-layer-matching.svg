<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How Smart Animate pairs layers across two frames</text>
<g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF"><rect x="20" y="50" width="250" height="230" rx="10"/><rect x="450" y="50" width="250" height="230" rx="10"/></g>
<text x="145" y="72" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Frame: Book card (start)</text>
<text x="575" y="72" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Frame: Book card (end)</text>
<g font-size="12" fill="#374151">
<rect x="35" y="90" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="45" y="110">Card</text>
<rect x="55" y="130" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="65" y="150">Cover</text>
<rect x="55" y="170" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="65" y="190">Title</text>
<rect x="55" y="210" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="65" y="230">Rating</text>
<rect x="465" y="90" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="475" y="110">Card</text>
<rect x="485" y="130" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="495" y="150">Cover</text>
<rect x="485" y="170" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="495" y="190">Title</text>
<rect x="485" y="210" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4F46E5"/><text x="495" y="230">Rating</text>
<rect x="485" y="250" width="200" height="24" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="495" y="266" fill="#92400E">Review note (new)</text>
</g>
<g stroke="#047857" stroke-width="2"><path d="M258,105 L462,105" marker-end="url(#ah)"/><path d="M258,145 L482,145" marker-end="url(#ah)"/><path d="M258,185 L482,185" marker-end="url(#ah)"/><path d="M258,225 L482,225" marker-end="url(#ah)"/></g>
<g fill="#4F46E5"><circle cx="360" cy="95" r="11"/><circle cx="360" cy="262" r="11" fill="#B45309"/></g>
