<g font-size="12" fill="#374151" text-anchor="middle"><text x="360" y="125">same name + same place in hierarchy</text><text x="360" y="150" fill="#047857">paired, differences animate</text><text x="360" y="290" fill="#92400E">no partner: dissolves into view</text></g>
<text x="360" y="322" font-size="12" fill="#4B5563" text-anchor="middle">Unchanged properties are not animated at all.</text>
</svg>
