<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img">
<title>Histogram bin edges are half-open except the last</title>
<desc>Bins [0,1), [1,2) and [2,3] for the edges 0,1,2,3; the value 2 falls in the second-to-last bin start and the value 3 is included in the last bin.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="310" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">np.histogram with bins=[0, 1, 2, 3]</text>
<line x1="60" y1="130" x2="690" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="64" y="62" width="192" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="160.0" y="102" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">[0, 1)</text>
<rect x="264" y="62" width="192" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="360.0" y="102" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">[1, 2)</text>
<rect x="464" y="62" width="192" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="560.0" y="102" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">[2, 3]</text>
<line x1="60" y1="124" x2="60" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="158" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">0</text>
<line x1="260" y1="124" x2="260" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
<text x="260" y="158" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<line x1="460" y1="124" x2="460" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
<text x="460" y="158" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<line x1="660" y1="124" x2="660" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
<text x="660" y="158" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<text x="30" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Sample values:</text>
<circle cx="140.0" cy="230" r="7" fill="#6D28D9" stroke="#0F172A" stroke-width="1.5"/>
<text x="140.0" y="256" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">0.4</text>
<circle cx="260.0" cy="230" r="7" fill="#6D28D9" stroke="#0F172A" stroke-width="1.5"/>
<text x="260.0" y="256" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">1</text>
<circle cx="460.0" cy="230" r="7" fill="#6D28D9" stroke="#0F172A" stroke-width="1.5"/>
<text x="460.0" y="256" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<circle cx="460.0" cy="230" r="7" fill="#6D28D9" stroke="#0F172A" stroke-width="1.5"/>
<text x="460.0" y="256" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">2</text>
<circle cx="660.0" cy="230" r="7" fill="#6D28D9" stroke="#0F172A" stroke-width="1.5"/>
<text x="660.0" y="256" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">3</text>
<text x="30" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Counts are [1, 1, 3]: 1.0 opens the second bin and the two 2.0 values open the third,</text>
<text x="30" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">while 3.0 is still counted because the last bin is closed on both sides.</text>
</svg>
