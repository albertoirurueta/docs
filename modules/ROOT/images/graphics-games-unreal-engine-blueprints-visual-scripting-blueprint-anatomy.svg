<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What a Blueprint class contains</text>
<rect x="20" y="50" width="480" height="380" rx="12" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<text x="260" y="74" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">BP_Book (Blueprint Class, parent class ABookActor)</text>
<rect x="36" y="90" width="220" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="146" y="110" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">Components</text>
<text x="146" y="128" text-anchor="middle" font-size="11" fill="#374151">Mesh, RotatingMovement</text>
<text x="146" y="142" text-anchor="middle" font-size="11" fill="#374151">(inherited) plus new ones</text>
<rect x="262" y="90" width="220" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="372" y="110" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Variables</text>
<text x="372" y="128" text-anchor="middle" font-size="11" fill="#374151">SpinSpeed, bSpinning</text>
<text x="372" y="142" text-anchor="middle" font-size="11" fill="#374151">types, defaults, replication</text>
<rect x="36" y="170" width="220" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="146" y="190" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Construction Script</text>
<text x="146" y="208" text-anchor="middle" font-size="11" fill="#374151">runs on spawn and when</text>
<text x="146" y="222" text-anchor="middle" font-size="11" fill="#374151">properties change in editor</text>
<rect x="262" y="170" width="220" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="372" y="190" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Event Graph</text>
<text x="372" y="208" text-anchor="middle" font-size="11" fill="#374151">Event BeginPlay, Event Tick,</text>
<text x="372" y="222" text-anchor="middle" font-size="11" fill="#374151">overlap events, custom events</text>
<rect x="36" y="250" width="220" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="146" y="270" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Functions</text>
<text x="146" y="288" text-anchor="middle" font-size="11" fill="#374151">one entry, return values,</text>
<text x="146" y="302" text-anchor="middle" font-size="11" fill="#374151">callable from other Blueprints</text>
<rect x="262" y="250" width="220" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="372" y="270" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Macros</text>
<text x="372" y="288" text-anchor="middle" font-size="11" fill="#374151">expand inline, several</text>
<text x="372" y="302" text-anchor="middle" font-size="11" fill="#374151">exec outputs, latent nodes</text>
<rect x="36" y="330" width="220" height="66" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="146" y="350" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Event Dispatchers</text>
<text x="146" y="368" text-anchor="middle" font-size="11" fill="#374151">broadcast to bound events,</text>
<text x="146" y="382" text-anchor="middle" font-size="11" fill="#374151">for loose coupling</text>
<rect x="262" y="330" width="220" height="66" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="372" y="350" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Class Defaults</text>
<text x="372" y="368" text-anchor="middle" font-size="11" fill="#374151">default values of every</text>
<text x="372" y="382" text-anchor="middle" font-size="11" fill="#374151">variable and inherited member</text>
<text x="260" y="416" text-anchor="middle" font-size="11" fill="#374151">Compiling turns these graphs into a generated class, BP_Book_C.</text>
<text x="630" y="74" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Other Blueprint assets</text>
<rect x="520" y="90" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="112" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Level Blueprint</text>
<text x="630" y="130" text-anchor="middle" font-size="11" fill="#374151">one per level, level-wide events</text>
<rect x="520" y="156" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="178" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Blueprint Interface</text>
<text x="630" y="196" text-anchor="middle" font-size="11" fill="#374151">function signatures only</text>
<rect x="520" y="222" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="244" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Function Library</text>
<text x="630" y="262" text-anchor="middle" font-size="11" fill="#374151">static project-wide functions</text>
<rect x="520" y="288" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="310" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Macro Library</text>
<text x="630" y="328" text-anchor="middle" font-size="11" fill="#374151">shared macros</text>
<rect x="520" y="354" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="630" y="376" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Editor Utility Blueprint</text>
<text x="630" y="394" text-anchor="middle" font-size="11" fill="#374151">tools that run in the editor</text>
</svg>
