<text x="630.0" y="87.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTL4ArgumentTable.setAddress</text>
<text x="630.0" y="100.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">index 1, or setVertexBuffer</text>
<rect x="270" y="160" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="184.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex or fragment function</text>
<text x="380.0" y="198.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">constant Uniforms &amp;u</text>
<text x="380.0" y="212.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">[[buffer(1)]]</text>
<line x1="520" y1="125" x2="490" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="20" y="160" width="220" height="70" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="184.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Built-in inputs</text>
<text x="130.0" y="198.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uint vid [[vertex_id]]</text>
<text x="130.0" y="212.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uint iid [[instance_id]]</text>
<line x1="240" y1="195" x2="270" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="270" y="270" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="294.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex output / fragment input</text>
<text x="380.0" y="308.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">float4 position [[position]]</text>
<text x="380.0" y="322.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">float3 normal  (varying)</text>
<line x1="380" y1="230" x2="380" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="20" y="270" width="220" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="294.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Hardware</text>
<text x="130.0" y="307.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">rasteriser interpolates</text>
<text x="130.0" y="320.5" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">[[flat]], [[center_no_perspective]]</text>
<line x1="270" y1="305" x2="240" y2="305" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="520" y="270" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="294.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Fragment output</text>
<text x="630.0" y="308.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">float4 color [[color(0)]]</text>
<text x="630.0" y="322.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">float depth [[depth(any)]]</text>
<line x1="490" y1="305" x2="520" y2="305" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="520" y="160" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="184.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Fragment function</text>
<text x="630.0" y="197.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">texture2d&lt;float&gt; tex [[texture(0)]]</text>
<text x="630.0" y="210.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">sampler s [[sampler(0)]]</text>
<line x1="630" y1="230" x2="630" y2="270" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="20" y="370" width="720" height="70" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="394.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Binding indices</text>
<text x="380.0" y="408.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Slot numbers are the contract: Swift binds buffer 1 and the shader reads [[buffer(1)]].</text>
<text x="380.0" y="422.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Put the numbers in the shared header as enums. Textures and samplers number separately.</text>
</svg>
