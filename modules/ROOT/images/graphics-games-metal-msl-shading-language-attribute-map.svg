<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-attribute-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How MSL attributes connect the shader to the rest of the app</text>
<rect x="20" y="50" width="220" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="74.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Swift</text>
<text x="130.0" y="88.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLVertexDescriptor</text>
<text x="130.0" y="102.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">attributes[n], layouts[i]</text>
<rect x="270" y="50" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="74.5" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex function</text>
<text x="380.0" y="87.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">float3 position</text>
<text x="380.0" y="100.5" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">[[attribute(0)]] in stage_in</text>
<line x1="240" y1="85" x2="270" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-attribute-map)"/>
<rect x="520" y="50" width="220" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
