<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Six design principles as small compositions</text>
<rect x="12" y="46" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(12,46)"><rect x="14" y="36" width="96" height="86" fill="#E5E7EB"/><rect x="22" y="48" width="60" height="8" rx="2" fill="#D1D5DB"/><rect x="22" y="64" width="44" height="6" rx="2" fill="#D1D5DB"/><rect x="118" y="36" width="96" height="86" fill="#1F2937"/><rect x="126" y="48" width="60" height="8" rx="2" fill="#FEF3C7"/><rect x="126" y="64" width="44" height="6" rx="2" fill="#EEF2FF"/><text x="62" y="136" font-size="11" fill="#6B7280" text-anchor="middle">weak</text><text x="166" y="136" font-size="11" fill="#92400E" text-anchor="middle">strong</text></g><text x="126" y="200" font-size="11" fill="#374151" text-anchor="middle">Difference makes it readable</text><text x="126" y="68" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Contrast</text>
<rect x="266" y="46" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(266,46)"><rect x="14" y="36" width="200" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><line x1="114" y1="36" x2="114" y2="122" stroke="#9CA3AF" stroke-dasharray="4 3"/><rect x="28" y="52" width="60" height="54" fill="#4F46E5"/><rect x="140" y="52" width="60" height="54" fill="#B45309"/><text x="114" y="136" font-size="11" fill="#6B7280" text-anchor="middle">equal weight each side</text></g><text x="380" y="200" font-size="11" fill="#374151" text-anchor="middle">Visual weight spread evenly</text><text x="380" y="68" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Balance</text>
<rect x="520" y="46" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(520,46)"><rect x="14" y="36" width="96" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="22" y="46" width="50" height="8" fill="#4F46E5"/><rect x="34" y="62" width="62" height="6" fill="#9CA3AF"/><rect x="26" y="76" width="44" height="6" fill="#9CA3AF"/><rect x="118" y="36" width="96" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><line x1="130" y1="40" x2="130" y2="118" stroke="#B45309" stroke-dasharray="4 3"/><rect x="130" y="46" width="50" height="8" fill="#4F46E5"/><rect x="130" y="62" width="62" height="6" fill="#9CA3AF"/><rect x="130" y="76" width="44" height="6" fill="#9CA3AF"/><text x="62" y="136" font-size="11" fill="#6B7280" text-anchor="middle">ragged</text><text x="166" y="136" font-size="11" fill="#92400E" text-anchor="middle">shared edge</text></g><text x="634" y="200" font-size="11" fill="#374151" text-anchor="middle">Shared edges create order</text><text x="634" y="68" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Alignment</text>
<rect x="12" y="226" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(12,226)"><rect x="14" y="36" width="96" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="24" y="46" width="60" height="6" fill="#9CA3AF"/><rect x="24" y="62" width="70" height="6" fill="#9CA3AF"/><rect x="24" y="78" width="50" height="6" fill="#9CA3AF"/><rect x="24" y="94" width="66" height="6" fill="#9CA3AF"/><rect x="24" y="108" width="40" height="6" fill="#9CA3AF"/><rect x="118" y="36" width="96" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="128" y="46" width="60" height="8" fill="#4F46E5"/><rect x="128" y="58" width="70" height="6" fill="#9CA3AF"/><rect x="128" y="68" width="50" height="6" fill="#9CA3AF"/><rect x="128" y="94" width="66" height="8" fill="#4F46E5"/><rect x="128" y="106" width="40" height="6" fill="#9CA3AF"/><text x="62" y="136" font-size="11" fill="#6B7280" text-anchor="middle">even gaps</text><text x="166" y="136" font-size="11" fill="#92400E" text-anchor="middle">grouped</text></g><text x="126" y="380" font-size="11" fill="#374151" text-anchor="middle">Related items sit together</text><text x="126" y="248" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Proximity</text>
<rect x="266" y="226" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(266,226)"><rect x="14" y="36" width="200" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="26" y="48" width="48" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="32" y="54" width="24" height="6" fill="#4F46E5"/><rect x="32" y="100" width="36" height="5" fill="#9CA3AF"/><rect x="88" y="48" width="48" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="94" y="54" width="24" height="6" fill="#4F46E5"/><rect x="94" y="100" width="36" height="5" fill="#9CA3AF"/><rect x="150" y="48" width="48" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><rect x="156" y="54" width="24" height="6" fill="#4F46E5"/><rect x="156" y="100" width="36" height="5" fill="#9CA3AF"/><text x="114" y="136" font-size="11" fill="#6B7280" text-anchor="middle">same card, colour and type</text></g><text x="380" y="380" font-size="11" fill="#374151" text-anchor="middle">Repeat styles for rhythm</text><text x="380" y="248" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Repetition</text>
<rect x="520" y="226" width="228" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><g transform="translate(520,226)"><rect x="14" y="36" width="200" height="86" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="26" y="46" width="120" height="16" fill="#1F2937"/><rect x="26" y="70" width="90" height="8" fill="#6B7280"/><rect x="26" y="84" width="150" height="5" fill="#9CA3AF"/><rect x="26" y="94" width="130" height="5" fill="#9CA3AF"/><rect x="150" y="104" width="52" height="14" rx="7" fill="#B45309"/><text x="114" y="136" font-size="11" fill="#6B7280" text-anchor="middle">1 title, 2 subtitle, 3 body, 4 action</text></g><text x="634" y="380" font-size="11" fill="#374151" text-anchor="middle">Size and weight set the order</text><text x="634" y="248" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold">Hierarchy</text>
  <text x="380" y="412" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
