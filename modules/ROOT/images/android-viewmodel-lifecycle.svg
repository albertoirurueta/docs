<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img">
  <title>The ViewModel lifecycle against the Activity lifecycle, across a configuration change</title>
  <defs>
    <marker id="arrVm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">ViewModel lifespan vs. the Activity lifecycle</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">one ViewModel instance survives a rotation that destroys and recreates two Activity instances</text>

  <!-- Instance A timeline -->
  <text x="40" y="76" font-size="11" font-weight="bold" fill="#1c4b73">MainActivity instance A</text>
  <line x1="40" y1="86" x2="330" y2="86" stroke="#1c4b73" stroke-width="2"/>
  <circle cx="40" cy="86" r="3.5" fill="#1c4b73"/>
  <circle cx="330" cy="86" r="3.5" fill="#1c4b73"/>

  <text x="40" y="100" font-size="9" fill="#1c4b73" text-anchor="start">onCreate</text>
  <text x="120" y="100" font-size="9" fill="#1c4b73" text-anchor="middle">onStart</text>
  <text x="200" y="100" font-size="9" fill="#1c4b73" text-anchor="middle">onResume</text>
  <text x="330" y="100" font-size="9" fill="#1c4b73" text-anchor="end">onPause -&gt; onStop -&gt; onDestroy</text>

  <line x1="120" y1="82" x2="120" y2="90" stroke="#1c4b73" stroke-width="1.5"/>
  <line x1="200" y1="82" x2="200" y2="90" stroke="#1c4b73" stroke-width="1.5"/>

  <!-- rotation marker -->
  <line x1="330" y1="60" x2="330" y2="410" stroke="#8a5b12" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="336" y="66" font-size="9.5" fill="#8a5b12">device rotated (configuration change)</text>

  <!-- Instance B timeline -->
  <text x="380" y="76" font-size="11" font-weight="bold" fill="#1c4b73">MainActivity instance B (new object)</text>
  <line x1="380" y1="86" x2="700" y2="86" stroke="#1c4b73" stroke-width="2"/>
  <circle cx="380" cy="86" r="3.5" fill="#1c4b73"/>
  <circle cx="700" cy="86" r="3.5" fill="#1c4b73"/>

  <text x="380" y="100" font-size="9" fill="#1c4b73" text-anchor="start">onCreate</text>
  <text x="460" y="100" font-size="9" fill="#1c4b73" text-anchor="middle">onStart</text>
  <text x="540" y="100" font-size="9" fill="#1c4b73" text-anchor="middle">onResume</text>
  <text x="700" y="100" font-size="9" fill="#1c4b73" text-anchor="end">running (foreground)</text>

  <line x1="460" y1="82" x2="460" y2="90" stroke="#1c4b73" stroke-width="1.5"/>
  <line x1="540" y1="82" x2="540" y2="90" stroke="#1c4b73" stroke-width="1.5"/>

  <!-- ViewModel band spanning both instances -->
  <rect x="40" y="150" width="660" height="46" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.8"/>
  <text x="370" y="169" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">One TrailListViewModel instance</text>
  <text x="370" y="184" font-size="9.5" fill="#2d6a34" text-anchor="middle">held by the ViewModelStore, retained across instance A's destruction and instance B's creation</text>

  <line x1="40" y1="150" x2="40" y2="120" stroke="#2d6a34" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="700" y1="150" x2="700" y2="120" stroke="#2d6a34" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="40" y="114" font-size="9" fill="#2d6a34" text-anchor="middle">created lazily by</text>
  <text x="40" y="125" font-size="9" fill="#2d6a34" text-anchor="middle">viewModels()</text>
  <text x="700" y="114" font-size="9" fill="#2d6a34" text-anchor="middle">reused, not</text>
  <text x="700" y="125" font-size="9" fill="#2d6a34" text-anchor="middle">re-created</text>

  <!-- second rotation and eventual finish -->
  <line x1="700" y1="60" x2="700" y2="410" stroke="#8a5b12" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="706" y="66" font-size="9.5" fill="#8a5b12">Back pressed / finish() (real destroy, not a config change)</text>

  <!-- onCleared marker -->
  <line x1="700" y1="196" x2="700" y2="220" stroke="#a4373a" stroke-width="1.6" marker-end="url(#arrVm)"/>
  <rect x="600" y="222" width="200" height="30" rx="6" fill="#fbeceb" stroke="#a4373a" stroke-width="1.4"/>
  <text x="700" y="241" font-size="10.5" font-weight="bold" fill="#a4373a" text-anchor="middle">onCleared() runs once</text>

  <!-- Explanation blocks -->
  <rect x="40" y="270" width="330" height="150" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
  <text x="55" y="292" font-size="11" font-weight="bold" fill="#333333">Survives</text>
  <text x="55" y="310" font-size="9.5" fill="#333333">- rotation and other configuration</text>
  <text x="65" y="323" font-size="9.5" fill="#333333">changes (font scale, dark mode,</text>
  <text x="65" y="336" font-size="9.5" fill="#333333">folding, multi-window resize)</text>
  <text x="55" y="354" font-size="9.5" fill="#333333">- Activity/Fragment view being</text>
  <text x="65" y="367" font-size="9.5" fill="#333333">recreated while the process stays up</text>
  <text x="55" y="385" font-size="9.5" fill="#333333">- onCleared() called only when the</text>
  <text x="65" y="398" font-size="9.5" fill="#333333">owning scope is really finishing</text>

  <rect x="390" y="270" width="330" height="150" rx="8" fill="#fbeceb" stroke="#a4373a" stroke-width="1.2"/>
  <text x="405" y="292" font-size="11" font-weight="bold" fill="#a4373a">Does NOT survive</text>
  <text x="405" y="310" font-size="9.5" fill="#a4373a">- process death (the OS reclaiming</text>
  <text x="415" y="323" font-size="9.5" fill="#a4373a">memory while the app is stopped)</text>
  <text x="405" y="341" font-size="9.5" fill="#a4373a">- explicit finish() / Back out of the</text>
  <text x="415" y="354" font-size="9.5" fill="#a4373a">last screen that owns it</text>
  <text x="405" y="372" font-size="9.5" fill="#a4373a">- in-memory fields are lost either way;</text>
  <text x="415" y="385" font-size="9.5" fill="#a4373a">only SavedStateHandle-backed state</text>
  <text x="415" y="398" font-size="9.5" fill="#a4373a">bridges a real process death</text>

  <text x="380" y="446" font-size="9" fill="#666666" text-anchor="middle">Time flows left to right. The green band's width -- not its exact position -- is what matters: it outlives every Activity instance it is scoped to.</text>
</svg>
