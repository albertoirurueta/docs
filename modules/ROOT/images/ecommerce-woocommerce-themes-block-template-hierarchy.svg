<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Block theme template resolution for WooCommerce pages</title>
  <desc id="d">Four front-end requests are listed on the left: a single product page, a product category page, the shop page and a product search. For each one the slugs that WordPress tries are shown in order from most specific to least specific. A single product tries single-product-themes-test-kit then single-product. A category tries taxonomy-product_cat-themes-test-beans, then taxonomy-product_cat, then archive-product. The shop tries archive-product and the search tries product-search-results. On the right, every slug is looked up in four places in this order: a template edited in the Site Editor and stored in the database, the child theme templates folder, the parent theme templates folder and finally the template shipped by WooCommerce.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">Which template renders the page (block theme)</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Observed with the Pocket Coffee Roast child theme on WooCommerce 11.2.1; each slug is a file in templates/ ending in .html</text>

  <text x="40" y="96" font-size="13" font-weight="bold" fill="#f4b860">Request</text>
  <text x="250" y="96" font-size="13" font-weight="bold" fill="#f4b860">Slugs tried, most specific first</text>
  <text x="640" y="96" font-size="13" font-weight="bold" fill="#f4b860">Where each slug is looked up</text>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="110" width="220" height="64" rx="6" fill="#3d5266"/>
    <text x="52" y="134" font-weight="bold">Single product</text>
    <text x="52" y="154">/product/themes-test-kit/</text>

    <rect x="40" y="210" width="220" height="64" rx="6" fill="#3d5266"/>
    <text x="52" y="234" font-weight="bold">Product category</text>
    <text x="52" y="254" font-size="11.5">/product-category/themes-test-beans/</text>

    <rect x="40" y="310" width="220" height="64" rx="6" fill="#3d5266"/>
    <text x="52" y="334" font-weight="bold">Shop page</text>
    <text x="52" y="354">/shop/</text>

    <rect x="40" y="410" width="220" height="64" rx="6" fill="#3d5266"/>
    <text x="52" y="434" font-weight="bold">Product search</text>
    <text x="52" y="454">/?s=kit&amp;post_type=product</text>
  </g>

  <g font-size="12" fill="#f2f5f8">
    <rect x="290" y="116" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="133">1  single-product-themes-test-kit</text>
    <rect x="290" y="146" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="163">2  single-product</text>

    <rect x="290" y="206" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="223">1  taxonomy-product_cat-themes-test-beans</text>
    <rect x="290" y="236" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="253">2  taxonomy-product_cat</text>
    <rect x="290" y="266" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="283">3  archive-product (fallback)</text>

    <rect x="290" y="322" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="339">1  archive-product</text>

    <rect x="290" y="422" width="270" height="24" rx="4" fill="#3d5266"/>
    <text x="300" y="439">1  product-search-results</text>
  </g>
  <g stroke="#f4b860" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M260 142 L286 130"/>
    <path d="M260 242 L286 236"/>
    <path d="M260 342 L286 334"/>
    <path d="M260 442 L286 434"/>
  </g>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="620" y="110" width="300" height="56" rx="6" fill="#3d5266" stroke="#f4b860" stroke-width="1.5"/>
    <text x="634" y="132" font-weight="bold">1  Site Editor edit (database)</text>
    <text x="634" y="152" font-size="11.5">wp_template post, source "custom"</text>

    <rect x="620" y="186" width="300" height="56" rx="6" fill="#3d5266"/>
    <text x="634" y="208" font-weight="bold">2  Child theme</text>
    <text x="634" y="228" font-size="11.5">templates/&lt;slug&gt;.html</text>

    <rect x="620" y="262" width="300" height="56" rx="6" fill="#3d5266"/>
    <text x="634" y="284" font-weight="bold">3  Parent theme</text>
    <text x="634" y="304" font-size="11.5">templates/&lt;slug&gt;.html</text>

    <rect x="620" y="338" width="300" height="56" rx="6" fill="#3d5266"/>
    <text x="634" y="360" font-weight="bold">4  WooCommerce</text>
    <text x="634" y="380" font-size="11.5">plugins/woocommerce/templates/templates/</text>
  </g>
  <g stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M770 166 L770 184"/>
    <path d="M770 242 L770 260"/>
    <path d="M770 318 L770 336"/>
  </g>
  <path d="M560 158 C590 158 590 138 616 138" stroke="#f4b860" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  

  <g font-size="12.5" fill="#f2f5f8">
    <text x="40" y="510" font-weight="bold" fill="#f4b860">Reading the figure</text>
    <text x="40" y="532">The first slug that exists in any of the four places is used; a more specific slug always beats a general one.</text>
    <text x="40" y="552">A Site Editor edit hides the theme file with the same slug until the customisation is cleared in the editor.</text>
    <text x="40" y="572">Category and tag templates fall back to archive-product; attributes use taxonomy-product_attribute.</text>
  </g>
</svg>
