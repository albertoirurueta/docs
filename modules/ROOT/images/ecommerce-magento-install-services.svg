<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" width="1010" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Services around a Magento 2.4.9 installation</title>
  <desc id="d">A request travels from the browser through an optional CDN and Varnish to Nginx or Apache and then to PHP running the Magento application. The application uses MariaDB or MySQL, OpenSearch, Valkey with three databases for cache, page cache and sessions, and optionally RabbitMQ. A system crontab starts cron:run every minute. Dashed boxes were documented but not executed in the test environment.</desc>
  <rect x="20" y="24" width="230" height="54" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="135" y="57" text-anchor="middle" font-weight="bold">Browser</text>
  <path d="M135 78 L135 108" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="108" width="230" height="54" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="135" y="141" text-anchor="middle" font-weight="bold">CDN (optional)</text>
  <path d="M135 162 L135 192" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="192" width="230" height="54" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="135" y="225" text-anchor="middle" font-weight="bold">Varnish 8 (optional)</text>
  <path d="M135 246 L135 276" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="276" width="230" height="54" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="135" y="309" text-anchor="middle" font-weight="bold">Apache 2.4 or Nginx 1.30</text>
  <text x="135" y="366" text-anchor="middle" font-size="12" opacity="0.9">document root: pub/</text>
  <text x="135" y="384" text-anchor="middle" font-size="11.5" opacity="0.9">Apache ran; Nginx checked with nginx -t</text>
  <path d="M250 279 L330 279" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="330" y="150" width="250" height="258" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="455" y="176" text-anchor="middle" font-weight="bold">PHP 8.5 (php-fpm or mod_php)</text>
  <text x="455" y="198" text-anchor="middle" font-size="12.5">memory_limit 1G to 2G</text>
  <rect x="350" y="214" width="210" height="82" rx="8" fill="#2ecc71" fill-opacity="0.25" stroke="currentColor" stroke-opacity="1" stroke-width="1"/>
  <text x="455" y="238" text-anchor="middle" font-size="13" font-weight="bold">Magento application</text>
  <text x="455" y="258" text-anchor="middle" font-size="12">app/etc/env.php, config.php</text>
  <text x="455" y="275" text-anchor="middle" font-size="12">bin/magento, var/, generated/</text>
  <rect x="350" y="310" width="210" height="78" rx="8" fill="#2ecc71" fill-opacity="0.12" stroke="currentColor" stroke-opacity="1" stroke-width="1"/>
  <text x="455" y="332" text-anchor="middle" font-size="13" font-weight="bold">File system</text>
  <text x="455" y="352" text-anchor="middle" font-size="12">pub/media, pub/static</text>
  <text x="455" y="369" text-anchor="middle" font-size="12">one owner for every file</text>
  <rect x="330" y="438" width="250" height="64" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="455" y="462" text-anchor="middle" font-size="13" font-weight="bold">System crontab, every minute</text>
  <text x="455" y="482" text-anchor="middle" font-size="12.5" font-family="Menlo, Consolas, monospace">bin/magento cron:run</text>
  <path d="M455 438 L455 408" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="670" y="24" width="320" height="74" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="830" y="52" text-anchor="middle" font-weight="bold">MariaDB 12.3 or MySQL 8.4</text>
  <text x="830" y="76" text-anchor="middle" font-size="12">port 3306: catalog, sales, config, queue fallback</text>
  <rect x="670" y="112" width="320" height="74" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="830" y="140" text-anchor="middle" font-weight="bold">OpenSearch 3</text>
  <text x="830" y="164" text-anchor="middle" font-size="12">port 9200: catalog search index</text>
  <rect x="670" y="200" width="320" height="74" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="830" y="228" text-anchor="middle" font-weight="bold">Valkey 9</text>
  <text x="830" y="252" text-anchor="middle" font-size="12">port 6379: db 0 cache, db 1 page cache, db 2 sessions</text>
  <rect x="670" y="288" width="320" height="74" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="830" y="316" text-anchor="middle" font-weight="bold">RabbitMQ 4.3 (optional)</text>
  <text x="830" y="340" text-anchor="middle" font-size="12">port 5672: async operations, exports, bulk</text>
  <path d="M580 250 L668 61" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M580 262 L668 149" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M580 280 L668 237" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M580 298 L668 325" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="670" y="386" width="320" height="116" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="830" y="410" text-anchor="middle" font-size="13" font-weight="bold">Legend</text>
  <rect x="686" y="424" width="28" height="14" rx="3" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.2"/>
  <text x="726" y="436" font-size="12">ran in the test stack</text>
  <rect x="686" y="448" width="28" height="14" rx="3" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.2" stroke-dasharray="6 6"/>
  <text x="726" y="460" font-size="12">documented, not run here</text>
  <text x="830" y="486" text-anchor="middle" font-size="11.5" opacity="0.85">RabbitMQ ran in a separate throwaway install</text>
</svg>
