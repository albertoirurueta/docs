<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-shader-compilation-and-pipeline-caching-function-linking" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Linking shader functions: static, dynamic and stitched</text>
<rect x="20" y="60" width="220" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="79.8" text-anchor="middle" font-size="11" fill="#3730A3">Static linking</text>
<text x="130.0" y="93.8" text-anchor="middle" font-size="11" fill="#3730A3">binary functions linked into</text>
<text x="130.0" y="107.8" text-anchor="middle" font-size="11" fill="#3730A3">the pipeline at build time</text>
<rect x="270" y="60" width="220" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="79.8" text-anchor="middle" font-size="11" fill="#92400E">Dynamic linking</text>
<text x="380.0" y="93.8" text-anchor="middle" font-size="11" fill="#92400E">MTLDynamicLibrary loaded</text>
<text x="380.0" y="107.8" text-anchor="middle" font-size="11" fill="#92400E">at pipeline creation</text>
<rect x="520" y="60" width="220" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="79.8" text-anchor="middle" font-size="11" fill="#065F46">Stitching</text>
<text x="630.0" y="93.8" text-anchor="middle" font-size="11" fill="#065F46">function graph builds a</text>
<text x="630.0" y="107.8" text-anchor="middle" font-size="11" fill="#065F46">new visible function</text>
<line x1="130" y1="120" x2="130" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-function-linking)"/>
<line x1="380" y1="120" x2="380" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-function-linking)"/>
<line x1="630" y1="120" x2="630" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-function-linking)"/>
<rect x="20" y="150" width="720" height="60" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="184.6" text-anchor="middle" font-size="13" fill="#374151">Render or compute pipeline state</text>
<rect x="20" y="236" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="190.0" y="267.9" text-anchor="middle" font-size="11" fill="#374151">Entry function [[visible]] or [[stitchable]]</text>
<text x="190.0" y="281.9" text-anchor="middle" font-size="11" fill="#374151">callable through visible function tables</text>
<rect x="400" y="236" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="570.0" y="267.9" text-anchor="middle" font-size="11" fill="#374151">Trade-off: calls through tables cost registers</text>
<text x="570.0" y="281.9" text-anchor="middle" font-size="11" fill="#374151">and block some optimisations; keep hot paths static</text>
<line x1="190" y1="236" x2="190" y2="212" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-function-linking)"/>
<line x1="570" y1="236" x2="570" y2="212" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-metal-shader-compilation-and-pipeline-caching-function-linking)"/>
</svg>
