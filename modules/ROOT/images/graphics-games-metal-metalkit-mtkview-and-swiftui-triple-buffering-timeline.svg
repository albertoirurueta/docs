<text x="474.0" y="316.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Frame 4 reuses slot 1:</text>
<text x="474.0" y="330.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">CPU waits for the signal of frame 1</text>
<line x1="390.0" y1="296" x2="390.0" y2="126" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-metalkit-mtkview-and-swiftui-triple-buffering-timeline)"/>
<text x="380" y="380" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">slot = frame number modulo 3: each slot owns one command allocator and one vertex buffer.</text>
<text x="380" y="398" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">At most three frames exist at once; a fourth waits on the shared event (Metal 4) or semaphore (Metal 3).</text>
<text x="380" y="416" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">More frames in flight hides CPU spikes but adds one frame of input latency each.</text>
