<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Where state lives in a custom estimator</title>
<desc id="d">The constructor only stores hyperparameters; get_params and set_params read and write them; fit validates, learns attributes ending in an underscore and returns self; predict and transform call check_is_fitted and validate with reset false.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Constructor parameters versus learned attributes</text>
<rect x="24" y="56" width="200" height="120" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="124" y="80" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">__init__(period=24)</text>
<text x="124" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">self.period = period</text>
<text x="124" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">no validation, no copies,</text>
<text x="124" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">no computation</text>
<text x="124" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1D4ED8">hyperparameters</text>
<rect x="260" y="56" width="200" height="120" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="80" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">fit(X, y)</text>
<text x="360" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">validate_data(self, X, y)</text>
<text x="360" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">check the hyperparameters</text>
<text x="360" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">learn centroids_, classes_ ...</text>
<text x="360" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F766E">return self</text>
<rect x="496" y="56" width="200" height="120" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="596" y="80" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F172A">predict / transform</text>
<text x="596" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">check_is_fitted(self)</text>
<text x="596" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">validate_data(self, X,</text>
<text x="596" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">reset=False)</text>
<text x="596" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B45309">read-only on state</text>
<line x1="224" y1="116" x2="256" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="460" y1="116" x2="492" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="204" width="320" height="86" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="184" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">get_params / set_params / clone</text>
<text x="184" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">see only the constructor arguments, so</text>
<text x="184" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">searches can change them without __init__</text>
<rect x="376" y="204" width="320" height="86" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="536" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Learned state ends in an underscore</text>
<text x="536" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">n_features_in_, feature_names_in_, classes_;</text>
<text x="536" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">clone drops it, check_is_fitted tests for it</text>
</svg>
