<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Performance ladder for row-wise computation in pandas</title>
  <desc id="d">Horizontal bars on a logarithmic time axis comparing iterrows, apply with axis equal to 1, itertuples, Series arithmetic and NumPy arrays on 100,000 rows. iterrows takes about 584 milliseconds and vectorised arithmetic about 0.1 milliseconds.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Row-wise work: how much each style costs</text>
  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">100,000 rows, f(a, b, n, x) = a * (b + n) + x, best of a few runs, bar length is logarithmic (90 px per tenfold)</text>
  <line x1="230" y1="84" x2="230" y2="290" stroke="#94A3B8" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">
    <text x="214" y="108" text-anchor="end">iterrows</text>
    <text x="214" y="152" text-anchor="end">apply(axis=1)</text>
    <text x="214" y="196" text-anchor="end">itertuples</text>
    <text x="214" y="240" text-anchor="end">Series arithmetic</text>
    <text x="214" y="284" text-anchor="end">NumPy arrays</text>
  </g>
  <rect x="230" y="90" width="429" height="26" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <rect x="230" y="134" width="398" height="26" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <rect x="230" y="178" width="304" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="230" y="222" width="90" height="26" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <rect x="230" y="266" width="90" height="26" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="649" y="108" text-anchor="end" fill="#0F172A">584 ms</text>
    <text x="618" y="152" text-anchor="end">264 ms</text>
    <text x="544" y="196">24 ms</text>
    <text x="334" y="240">0.1 ms</text>
    <text x="334" y="284">0.1 ms</text>
  </g>
  <line x1="40" y1="330" x2="680" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="40" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">slower per row</text>
  <text x="680" y="350" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">prefer: vectorise, then numba or Cython only for what is left</text>
</svg>
