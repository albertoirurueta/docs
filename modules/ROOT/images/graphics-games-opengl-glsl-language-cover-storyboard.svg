<svg viewBox="0 0 760 290" width="760" height="290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="290" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: the book cover fragment shader grows in four steps</text>
<rect x="20" y="50" width="168" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="204" y="50" width="168" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="220" cy="66" r="11" fill="#4F46E5"/>
<text x="220" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="388" y="50" width="168" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="66" r="11" fill="#4F46E5"/>
<text x="404" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="572" y="50" width="168" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="588" cy="66" r="11" fill="#4F46E5"/>
<text x="588" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="104" y="92" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Constant colour</text>
<rect x="54" y="106" width="100" height="90" rx="4" fill="#8B1A1A" stroke="#4B5563" stroke-width="1.2"/>
<text x="104" y="222" font-size="9" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">oColor = vec4(c, 1.0);</text>
<text x="104" y="240" font-size="10" font-weight="normal" fill="#6B7280" text-anchor="middle">const vec3 c in the shader</text>
<text x="288" y="92" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Interpolated varying</text>
<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#8B1A1A"/><stop offset="1" stop-color="#1A4F8B"/></linearGradient></defs>
<rect x="238" y="106" width="100" height="90" rx="4" fill="url(#g1)" stroke="#4B5563" stroke-width="1.2"/>
<text x="288" y="222" font-size="9" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">oColor = vec4(vColor, 1.0);</text>
<text x="288" y="240" font-size="10" font-weight="normal" fill="#6B7280" text-anchor="middle">out of the vertex shader</text>
<text x="472" y="92" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Texture sample</text>
<rect x="422" y="106" width="100" height="90" rx="4" fill="#7A2E2E" stroke="#4B5563" stroke-width="1.2"/>
<rect x="432" y="116" width="80" height="14" rx="2" fill="#E5D3A3" stroke="#4B5563" stroke-width="0.8"/>
<rect x="432" y="140" width="80" height="40" rx="2" fill="#F3E9C9" stroke="#4B5563" stroke-width="0.8"/>
<text x="472" y="164" font-size="11" font-weight="bold" fill="#7A2E2E" text-anchor="middle">BOOK</text>
<text x="472" y="222" font-size="9" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">oColor = texture(uCover, vUV);</text>
<text x="472" y="240" font-size="10" font-weight="normal" fill="#6B7280" text-anchor="middle">sampler2D on texture unit 0</text>
<text x="656" y="92" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Tint by uniform</text>
<rect x="606" y="106" width="100" height="90" rx="4" fill="#9A6A1E" stroke="#4B5563" stroke-width="1.2"/>
<rect x="616" y="116" width="80" height="14" rx="2" fill="#E5D3A3" stroke="#4B5563" stroke-width="0.8"/>
<rect x="616" y="140" width="80" height="40" rx="2" fill="#F3E9C9" stroke="#4B5563" stroke-width="0.8"/>
<text x="656" y="164" font-size="11" font-weight="bold" fill="#7A2E2E" text-anchor="middle">BOOK</text>
<text x="656" y="222" font-size="9" font-weight="normal" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">oColor = tex * uTint;</text>
<text x="656" y="240" font-size="10" font-weight="normal" fill="#6B7280" text-anchor="middle">uniform vec4 set per draw</text>
</svg>
