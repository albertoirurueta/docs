<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">How WooCommerce sits on WordPress</title>
  <desc id="d">Four kinds of client (the shopper's browser, wp-admin, REST and Store API clients, and WP-CLI) call WordPress core, which provides hooks, post types and taxonomies, users and roles, options, the REST server, the block editor and WP-Cron. The WooCommerce plugin runs inside WordPress and is split into the includes directory with the legacy WC classes and the global WC function, the src directory with the namespaced classes and the dependency injection container, the packages directory with Action Scheduler, the admin package and the email editor, and the templates and built assets. WooCommerce reads and writes the WordPress tables, its own HPOS order tables, lookup tables and session tables. Extensions and themes attach to WooCommerce through hooks, the Store API schema extension, the block registry and payment gateway classes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="660" rx="14" fill="#2b3a4a"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#f2f5f8">WooCommerce is a plugin: one PHP process, WordPress underneath</text>
  <text x="40" y="58" font-size="12.5" fill="#f2f5f8">Layers of a WooCommerce 11.2.1 store on WordPress 7.1.3, with the directories of the plugin that implement each part</text>

  <!-- clients -->
  <g font-size="12.5" fill="#f2f5f8" text-anchor="middle">
    <rect x="40" y="78" width="200" height="54" rx="8" fill="#3d5266"/>
    <text x="140" y="100" font-weight="bold">Shopper's browser</text>
    <text x="140" y="118">blocks, Interactivity API</text>
    <rect x="260" y="78" width="200" height="54" rx="8" fill="#3d5266"/>
    <text x="360" y="100" font-weight="bold">wp-admin</text>
    <text x="360" y="118">PHP screens + React pages</text>
    <rect x="480" y="78" width="200" height="54" rx="8" fill="#3d5266"/>
    <text x="580" y="100" font-weight="bold">REST and Store API clients</text>
    <text x="580" y="118">apps, headless front ends</text>
    <rect x="700" y="78" width="220" height="54" rx="8" fill="#3d5266"/>
    <text x="810" y="100" font-weight="bold">WP-CLI</text>
    <text x="810" y="118">wp wc ... runs the same PHP</text>
  </g>
  <g stroke="#f4b860" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M140 132 L140 160"/>
    <path d="M360 132 L360 160"/>
    <path d="M580 132 L580 160"/>
    <path d="M810 132 L810 160"/>
  </g>

  <!-- WordPress core -->
  <rect x="40" y="162" width="880" height="84" rx="10" fill="#34495e" stroke="#6f8aa3" stroke-width="1.5"/>
  <text x="56" y="184" font-size="14" font-weight="bold" fill="#f2f5f8">WordPress core</text>
  <g font-size="12" fill="#f2f5f8">
    <text x="56" y="206">hooks: add_action, add_filter</text>
    <text x="56" y="224">users, roles, capabilities</text>
    <text x="270" y="206">post types and taxonomies</text>
    <text x="270" y="224">options and transients</text>
    <text x="490" y="206">REST server and rewrite rules</text>
    <text x="490" y="224">WP-Cron and the plugin loader</text>
    <text x="710" y="206">block editor, Site Editor, theme.json</text>
    <text x="710" y="224">template loader and block templates</text>
  </g>

  <!-- WooCommerce plugin -->
  <rect x="40" y="262" width="640" height="276" rx="10" fill="#3a5a52" stroke="#9fd3c7" stroke-width="1.5"/>
  <text x="56" y="284" font-size="14" font-weight="bold" fill="#f2f5f8">wp-content/plugins/woocommerce  (woocommerce.php)</text>
  <g font-size="12" fill="#f2f5f8">
    <rect x="56" y="298" width="150" height="98" rx="8" fill="#2f4a44"/>
    <text x="66" y="318" font-weight="bold">includes/</text>
    <text x="66" y="337">WC_* classes, 629 files</text>
    <text x="66" y="355">global WC(), WC_Cart,</text>
    <text x="66" y="373">WC_Order, data stores,</text>
    <text x="66" y="391">WC_AJAX, emails</text>

    <rect x="216" y="298" width="170" height="98" rx="8" fill="#2f4a44"/>
    <text x="226" y="318" font-weight="bold">src/</text>
    <text x="226" y="337">Automattic\WooCommerce\,</text>
    <text x="226" y="355">1,448 files: Internal, Blocks,</text>
    <text x="226" y="373">StoreApi, Admin, Utilities,</text>
    <text x="226" y="391">Enums, Proxies, Container</text>

    <rect x="396" y="298" width="130" height="98" rx="8" fill="#2f4a44"/>
    <text x="406" y="318" font-weight="bold">packages/</text>
    <text x="406" y="337">action-scheduler</text>
    <text x="406" y="355">woocommerce-admin</text>
    <text x="406" y="373">email-editor</text>
    <text x="406" y="391">blueprint</text>

    <rect x="536" y="298" width="130" height="98" rx="8" fill="#2f4a44"/>
    <text x="546" y="318" font-weight="bold">templates/</text>
    <text x="546" y="337">classic PHP templates</text>
    <text x="546" y="355">and block templates</text>
    <text x="546" y="378" font-weight="bold">assets/, patterns/</text>
    <text x="546" y="396">built JS and CSS</text>
  </g>
  <g font-size="12" fill="#f2f5f8">
    <rect x="56" y="410" width="610" height="54" rx="8" fill="#2f4a44"/>
    <text x="66" y="430" font-weight="bold">Bootstrap (woocommerce.php)</text>
    <text x="66" y="450">Autoloader, Packages::init(), include includes/class-woocommerce.php, new Container(), WC()</text>
    <rect x="56" y="474" width="610" height="52" rx="8" fill="#2f4a44"/>
    <text x="66" y="494" font-weight="bold">vendor/ and lib/</text>
    <text x="66" y="514">Jetpack autoloader, Composer packages, namespaced third-party code under Automattic\WooCommerce\Vendor</text>
  </g>

  <!-- extensions column -->
  <rect x="700" y="262" width="220" height="276" rx="10" fill="#4a3d5c" stroke="#c9b3e6" stroke-width="1.5"/>
  <text x="716" y="284" font-size="14" font-weight="bold" fill="#f2f5f8">Your code</text>
  <g font-size="12" fill="#f2f5f8">
    <text x="716" y="308">Extensions (plugins)</text>
    <text x="716" y="326">Themes, block or classic</text>
    <text x="716" y="354" font-weight="bold">They attach through</text>
    <text x="716" y="374">actions and filters</text>
    <text x="716" y="392">Store API ExtendSchema</text>
    <text x="716" y="410">block registry and Slot/Fill</text>
    <text x="716" y="428">gateway and shipping classes</text>
    <text x="716" y="446">Additional Checkout Fields</text>
    <text x="716" y="474" font-weight="bold">They should not reach</text>
    <text x="716" y="494">Automattic\WooCommerce\</text>
    <text x="716" y="512">Internal\ classes</text>
  </g>
  <path d="M700 400 L682 400" stroke="#c9b3e6" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- storage -->
  <g stroke="#9fd3c7" stroke-width="1.8" fill="none" marker-end="url(#b)">
    <path d="M360 538 L360 562"/>
  </g>
  <rect x="40" y="564" width="880" height="72" rx="10" fill="#34495e" stroke="#6f8aa3" stroke-width="1.5"/>
  <text x="56" y="586" font-size="14" font-weight="bold" fill="#f2f5f8">One MariaDB or MySQL database</text>
  <g font-size="12" fill="#f2f5f8">
    <text x="56" y="608">wp_posts and wp_postmeta: products, variations, coupons, order placeholders</text>
    <text x="56" y="626">wp_options: 185 woocommerce_* rows on the test store</text>
    <text x="520" y="608">wp_wc_orders and three sibling tables (HPOS), wc_*_lookup tables</text>
    <text x="520" y="626">woocommerce_sessions, tax_rates, shipping_zones, actionscheduler_* ...</text>
  </g>
</svg>
