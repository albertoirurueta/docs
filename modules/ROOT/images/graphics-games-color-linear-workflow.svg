<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="lw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A linear workflow from texture to display</text>
<rect x="20" y="70" width="108" height="96" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="34" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="34" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="74" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Albedo texture</text>
<text x="74" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">8-bit sRGB</text>
<text x="74" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">rgba8unorm-srgb</text>
<line x1="130" y1="118" x2="140.4" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#lw)"/>
<rect x="142.4" y="70" width="108" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="156.4" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="156.4" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="196.4" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Sampler</text>
<text x="196.4" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">decodes to linear</text>
<text x="196.4" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">(hardware, free)</text>
<line x1="252.4" y1="118" x2="262.8" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#lw)"/>
<rect x="264.8" y="70" width="108" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="278.8" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="278.8" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="318.8" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Lighting</text>
<text x="318.8" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">linear float math</text>
<text x="318.8" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">rgba16float target</text>
<line x1="374.8" y1="118" x2="385.2" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#lw)"/>
<rect x="387.2" y="70" width="108" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="401.2" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="401.2" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="441.2" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Tone mapping</text>
<text x="441.2" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">HDR to [0,1]</text>
<text x="441.2" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">exposure + curve</text>
<line x1="497.2" y1="118" x2="507.6" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#lw)"/>
<rect x="509.6" y="70" width="108" height="96" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="523.6" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="523.6" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="563.6" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Encode</text>
<text x="563.6" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">linear to sRGB</text>
<text x="563.6" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">sRGB format or pow</text>
<line x1="619.6" y1="118" x2="630" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#lw)"/>
<rect x="632" y="70" width="108" height="96" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="646" cy="82" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="646" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="686" y="114" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Display</text>
<text x="686" y="134" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">8 or 10-bit</text>
<text x="686" y="150" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">SDR panel</text>
<text x="380" y="196" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Math in the blue stages is only correct on linear values: adding, multiplying and filtering light</text>
<rect x="20" y="224" width="720" height="80" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="40" y="248" font-size="12" font-weight="bold" fill="#92400E" text-anchor="start">Common mistake: sample the albedo as plain rgba8unorm and shade the stored values directly.</text>
<text x="40" y="268" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Mid tones come out too dark after the final encode, specular looks harsh, bilinear filtering darkens edges,</text>
<text x="40" y="286" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">and blended layers look wrong. Mark colour textures as sRGB; keep normal and data maps linear.</text>
</svg>
