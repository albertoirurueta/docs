<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: a short cinematic of a book sliding off the shelf</text>
<rect x="20" y="52" width="170" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="68" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="115" y="73" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create the sequence</text>
<rect x="40" y="92" width="130" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="105" y="132" text-anchor="middle" font-size="11" fill="#374151">LS_BookIntro</text>
<rect x="60" y="100" width="90" height="14" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="105" y="195" text-anchor="middle" font-size="11" fill="#374151">Cinematics &gt; Add Level</text>
<text x="105" y="209" text-anchor="middle" font-size="11" fill="#374151">Sequence, name it</text>
<text x="105" y="223" text-anchor="middle" font-size="11" fill="#374151">LS_BookIntro</text>
<line x1="190" y1="160" x2="205" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="205" y="52" width="170" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="221" cy="68" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="221" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="300" y="73" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Add a camera</text>
<rect x="225" y="92" width="130" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="260" y="112" width="60" height="30" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="290" y="131" text-anchor="middle" font-size="10" fill="#92400E">Camera</text>
<path d="M320 127 L345 112 L345 142 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="290" y="195" text-anchor="middle" font-size="11" fill="#374151">Create Camera adds a Cine</text>
<text x="290" y="209" text-anchor="middle" font-size="11" fill="#374151">Camera and a Camera</text>
<text x="290" y="223" text-anchor="middle" font-size="11" fill="#374151">Cut track</text>
<line x1="375" y1="160" x2="390" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="390" y="52" width="170" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="406" cy="68" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="406" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="485" y="73" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Bind and key</text>
<rect x="410" y="92" width="130" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="420" y="112" width="22" height="30" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<rect x="490" y="112" width="22" height="30" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="445" y1="127" x2="488" y2="127" stroke="#047857" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="475" y="154" text-anchor="middle" font-size="10" fill="#047857">0s to 4s</text>
<text x="475" y="195" text-anchor="middle" font-size="11" fill="#374151">Add ABookActor to the</text>
<text x="475" y="209" text-anchor="middle" font-size="11" fill="#374151">sequence, turn on Auto</text>
<text x="475" y="223" text-anchor="middle" font-size="11" fill="#374151">Key, move it at 0s and 4s</text>
<line x1="560" y1="160" x2="575" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="575" y="52" width="170" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="591" cy="68" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="591" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="670" y="73" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Render</text>
<rect x="595" y="92" width="130" height="70" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="605" y="108" width="30" height="40" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="643" y="108" width="30" height="40" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<rect x="681" y="108" width="30" height="40" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="660" y="128" text-anchor="middle" font-size="10" fill="#3730A3">...</text>
<text x="660" y="195" text-anchor="middle" font-size="11" fill="#374151">Render button opens the</text>
<text x="660" y="209" text-anchor="middle" font-size="11" fill="#374151">Movie Render Queue or</text>
<text x="660" y="223" text-anchor="middle" font-size="11" fill="#374151">Render Movie Settings</text>
<text x="380" y="302" text-anchor="middle" font-size="11" fill="#374151">Sequencer saves the shots and subsequences with the master sequence;</text>
<text x="380" y="318" text-anchor="middle" font-size="11" fill="#374151">opening the asset from the Content Browser needs a level that references it, or the contents are unbound.</text>
</svg>
