<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t4 d4" font-family="Arial, Helvetica, sans-serif">
  <title id="t4">Where bias enters a data science system</title>
  <desc id="d4">A loop with four stages: the world with its history, the collected data, the trained model and the decisions it supports. Numbered markers show where historical, sampling, label, proxy, evaluation and feedback-loop bias enter. Decisions change the world and so change future data.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Where bias enters the loop</text>

  <rect x="24" y="80" width="140" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="94" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">World</text>
  <text x="94" y="130" font-size="12" text-anchor="middle" fill="#475569">people, history, practice</text>
  <rect x="210" y="80" width="140" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="280" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Data</text>
  <text x="280" y="130" font-size="12" text-anchor="middle" fill="#475569">sample, labels, features</text>
  <rect x="396" y="80" width="140" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="466" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Model</text>
  <text x="466" y="130" font-size="12" text-anchor="middle" fill="#475569">fit and evaluation</text>
  <rect x="582" y="80" width="114" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="639" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Decision</text>
  <text x="639" y="130" font-size="12" text-anchor="middle" fill="#475569">use in practice</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M164 115 H208"/><path d="M350 115 H394"/><path d="M536 115 H580"/>
    <path d="M639 150 V250 H94 V152"/>
  </g>
  <text x="366" y="274" font-size="12" text-anchor="middle" fill="#475569">decisions change the world, and with it the next data set</text>

  <g fill="#0F172A"><circle cx="94" cy="64" r="11"/><circle cx="280" cy="64" r="11"/><circle cx="326" cy="64" r="11"/><circle cx="466" cy="64" r="11"/><circle cx="512" cy="64" r="11"/><circle cx="639" cy="64" r="11"/><circle cx="366" cy="232" r="11"/></g>
  <g fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="94" y="69">1</text><text x="280" y="69">2</text><text x="326" y="69">3</text><text x="466" y="69">4</text><text x="512" y="69">5</text><text x="639" y="69">6</text><text x="366" y="237">7</text>
  </g>
</svg>
