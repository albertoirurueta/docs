<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dr-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One Bookshelf frame with dynamic rendering</text>
<rect x="20" y="50" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/><text x="36" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="96" y="70" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Barrier in</text>
<rect x="38" y="90" width="100" height="70" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<text x="88" y="130" text-anchor="middle" font-size="11" fill="#374151">undefined</text>
<text x="88" y="185" text-anchor="middle" font-size="11" fill="#374151">UNDEFINED to</text>
<text x="88" y="203" text-anchor="middle" font-size="11" fill="#374151">COLOR_ATTACHMENT</text>
<text x="88" y="221" text-anchor="middle" font-size="11" fill="#374151">_OPTIMAL</text>
<line x1="156" y1="165" x2="166" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-story)"/>
<rect x="166" y="50" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="66" r="11" fill="#4F46E5"/><text x="182" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="242" y="70" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Begin</text>
<rect x="184" y="90" width="100" height="70" rx="4" fill="#1E3A8A" stroke="#4B5563"/>
<text x="234" y="185" text-anchor="middle" font-size="11" fill="#374151">vkCmdBegin</text>
<text x="234" y="203" text-anchor="middle" font-size="11" fill="#374151">Rendering, clear</text>
<text x="234" y="221" text-anchor="middle" font-size="11" fill="#374151">to dark blue</text>
<line x1="302" y1="165" x2="312" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-story)"/>
<rect x="312" y="50" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="66" r="11" fill="#4F46E5"/><text x="328" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="388" y="70" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Draw</text>
<rect x="330" y="90" width="100" height="70" rx="4" fill="#1E3A8A" stroke="#4B5563"/>
<rect x="360" y="105" width="40" height="40" fill="#B45309" stroke="#92400E"/>
<text x="380" y="185" text-anchor="middle" font-size="11" fill="#374151">bind pipeline</text>
<text x="380" y="203" text-anchor="middle" font-size="11" fill="#374151">draw book box</text>
<text x="380" y="221" text-anchor="middle" font-size="11" fill="#374151">viewport dynamic</text>
<line x1="448" y1="165" x2="458" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-story)"/>
<rect x="458" y="50" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#4F46E5"/><text x="474" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="534" y="70" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">End</text>
<rect x="476" y="90" width="100" height="70" rx="4" fill="#1E3A8A" stroke="#4B5563"/>
<rect x="506" y="105" width="40" height="40" fill="#B45309" stroke="#92400E"/>
<text x="526" y="185" text-anchor="middle" font-size="11" fill="#374151">vkCmdEnd</text>
<text x="526" y="203" text-anchor="middle" font-size="11" fill="#374151">Rendering</text>
<text x="526" y="221" text-anchor="middle" font-size="11" fill="#374151">(store colour)</text>
<line x1="594" y1="165" x2="604" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-story)"/>
<rect x="604" y="50" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="620" cy="66" r="11" fill="#4F46E5"/><text x="620" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="680" y="70" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Barrier out</text>
<rect x="622" y="90" width="100" height="70" rx="4" fill="#1E3A8A" stroke="#4B5563"/>
<rect x="652" y="105" width="40" height="40" fill="#B45309" stroke="#92400E"/>
<text x="672" y="185" text-anchor="middle" font-size="11" fill="#374151">COLOR to</text>
<text x="672" y="203" text-anchor="middle" font-size="11" fill="#374151">PRESENT_SRC_KHR</text>
<text x="672" y="221" text-anchor="middle" font-size="11" fill="#374151">then present</text>
<text x="380" y="305" text-anchor="middle" font-size="12" fill="#374151">Steps 1 and 5 are pipeline barriers (synchronization2); steps 2 to 4 are the rendering instance</text>
</svg>
