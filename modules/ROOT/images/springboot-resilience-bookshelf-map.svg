<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Bookshelf dependency map: a client reaches Spring Cloud Gateway, which forwards to bookshelf-service; the service calls four downstream dependencies, each guarded by a different set of Resilience4j patterns.">
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: which pattern guards which call</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="20" y="190" width="90" height="60" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/><text x="65" y="217" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Client</text><text x="65" y="234" font-size="10" fill="#666666" text-anchor="middle">browser / app</text>
<rect x="150" y="175" width="120" height="90" rx="6" fill="#e8eef5" stroke="#1c4b73" stroke-width="1.5"/><text x="210" y="200" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Spring Cloud</text><text x="210" y="216" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Gateway</text><text x="210" y="238" font-size="10" fill="#1c4b73" text-anchor="middle">CircuitBreaker filter</text><text x="210" y="252" font-size="10" fill="#666666" text-anchor="middle">fallbackUri: forward:</text>
<rect x="310" y="105" width="150" height="250" rx="8" fill="#f4f4f4" stroke="#222222" stroke-width="2"/><text x="385" y="135" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-service</text><text x="385" y="153" font-size="10" fill="#666666" text-anchor="middle">Spring Boot 4.1, Java 21</text><text x="385" y="168" font-size="10" fill="#666666" text-anchor="middle">virtual threads</text>
<rect x="325" y="188" width="120" height="44" rx="4" fill="#ffffff" stroke="#8a4b08" stroke-width="1.2"/><text x="385" y="206" font-size="10.5" fill="#222222" text-anchor="middle">search endpoint</text><text x="385" y="222" font-size="10" fill="#8a4b08" text-anchor="middle">RateLimiter, 429</text>
<text x="385" y="262" font-size="10" fill="#666666" text-anchor="middle">Actuator, Micrometer,</text><text x="385" y="276" font-size="10" fill="#666666" text-anchor="middle">health indicators</text><text x="385" y="300" font-size="10" fill="#666666" text-anchor="middle">resilience4j.* keys in</text><text x="385" y="314" font-size="10" fill="#666666" text-anchor="middle">application.yml</text>
<line x1="110" y1="220" x2="148" y2="220" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/><line x1="270" y1="220" x2="308" y2="220" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="460" y1="230" x2="520" y2="95" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="522" y="55" width="360" height="80" rx="6" fill="#ffffff" stroke="#1c4b73" stroke-width="2"/>
<rect x="522" y="55" width="8" height="80" fill="#1c4b73"/>
<text x="544" y="77" font-size="13" font-weight="bold" fill="#222222">pricing-service</text>
<text x="544" y="93" font-size="10" fill="#666666">slow and flaky</text>
<text x="544" y="113" font-size="11.5" font-weight="bold" fill="#1c4b73">CircuitBreaker + TimeLimiter + Retry</text>
<text x="544" y="128" font-size="10" fill="#444444">fallback: last known price</text>
<line x1="460" y1="230" x2="520" y2="195" stroke="#8a4b08" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="522" y="155" width="360" height="80" rx="6" fill="#ffffff" stroke="#8a4b08" stroke-width="2"/>
<rect x="522" y="155" width="8" height="80" fill="#8a4b08"/>
<text x="544" y="177" font-size="13" font-weight="bold" fill="#222222">ISBN-metadata API (third party)</text>
<text x="544" y="193" font-size="10" fill="#666666">429 / 503, request quota</text>
<text x="544" y="213" font-size="11.5" font-weight="bold" fill="#8a4b08">RateLimiter + Retry (backoff, jitter)</text>
<text x="544" y="228" font-size="10" fill="#444444">+ Bulkhead, honour Retry-After</text>
<line x1="460" y1="230" x2="520" y2="295" stroke="#2e6b3a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="522" y="255" width="360" height="80" rx="6" fill="#ffffff" stroke="#2e6b3a" stroke-width="2"/>
<rect x="522" y="255" width="8" height="80" fill="#2e6b3a"/>
<text x="544" y="277" font-size="13" font-weight="bold" fill="#222222">recommendations-service</text>
<text x="544" y="293" font-size="10" fill="#666666">expensive, optional</text>
<text x="544" y="313" font-size="11.5" font-weight="bold" fill="#2e6b3a">ThreadPoolBulkhead + CircuitBreaker + TimeLimiter</text>
<text x="544" y="328" font-size="10" fill="#444444">fallback: empty list</text>
<line x1="460" y1="230" x2="520" y2="395" stroke="#6b2e6b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="522" y="355" width="360" height="80" rx="6" fill="#ffffff" stroke="#6b2e6b" stroke-width="2"/>
<rect x="522" y="355" width="8" height="80" fill="#6b2e6b"/>
<text x="544" y="377" font-size="13" font-weight="bold" fill="#222222">reviews-service</text>
<text x="544" y="393" font-size="10" fill="#666666">reactive, WebClient</text>
<text x="544" y="413" font-size="11.5" font-weight="bold" fill="#6b2e6b">Reactor operators: CircuitBreaker, TimeLimiter</text>
<text x="544" y="428" font-size="10" fill="#444444">transformDeferred, 300 ms limit</text>
<text x="450" y="458" font-size="10" fill="#666666" text-anchor="middle">Colour = the dependency that motivates the patterns. Retry is the outermost aspect, Bulkhead the innermost.</text>
</svg>
