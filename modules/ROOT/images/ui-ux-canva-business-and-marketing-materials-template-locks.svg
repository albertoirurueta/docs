<text x="360" y="176" font-size="12" fill="#374151" text-anchor="start" font-weight="bold">Locked (solid frame, padlock):</text>
<text x="360" y="194" font-size="12" fill="#374151" text-anchor="start">logo, brand strip, footer</text>
<text x="360" y="212" font-size="12" fill="#374151" text-anchor="start"></text>
