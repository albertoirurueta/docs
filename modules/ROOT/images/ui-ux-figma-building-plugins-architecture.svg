<svg viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Plugin architecture: sandbox and UI iframe</text>
<rect x="20" y="50" width="300" height="230" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="170" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Main thread sandbox (code.js)</text>
<g fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5">
<rect x="40" y="94" width="260" height="34" rx="6"/><rect x="40" y="136" width="260" height="34" rx="6"/><rect x="40" y="178" width="260" height="34" rx="6"/></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="170" y="116">Reads and edits the Bookshelf layers</text>
<text x="170" y="158">Calls the figma global API</text>
<text x="170" y="200">No DOM and no fetch of its own UI</text></g>
<text x="170" y="240" font-size="12" fill="#3730A3" text-anchor="middle">figma.ui.postMessage and figma.ui.onmessage</text>
<text x="170" y="262" font-size="12" fill="#3730A3" text-anchor="middle">figma.closePlugin() when finished</text>
<rect x="440" y="50" width="300" height="230" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="590" y="76" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">UI iframe (ui.html)</text>
<g fill="#FFFFFF" stroke="#B45309" stroke-width="1.5">
<rect x="460" y="94" width="260" height="34" rx="6"/><rect x="460" y="136" width="260" height="34" rx="6"/><rect x="460" y="178" width="260" height="34" rx="6"/></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="590" y="116">HTML, CSS and browser APIs</text>
<text x="590" y="158">Panel opened with figma.showUI</text>
<text x="590" y="200">Cannot see the Figma layers</text></g>
<text x="590" y="240" font-size="12" fill="#92400E" text-anchor="middle">parent.postMessage with pluginMessage</text>
<text x="590" y="262" font-size="12" fill="#92400E" text-anchor="middle">window.onmessage event.data.pluginMessage</text>
<g stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)">
<line x1="322" y1="140" x2="438" y2="140"/><line x1="438" y1="200" x2="322" y2="200"/></g>
<g font-size="12" fill="#4B5563" text-anchor="middle"><text x="380" y="132">audit result</text><text x="380" y="222">run request</text></g>
<rect x="140" y="298" width="480" height="30" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="380" y="318" font-size="12" fill="#374151" text-anchor="middle">manifest.json points main to code.js and ui to ui.html</text>
</svg>
