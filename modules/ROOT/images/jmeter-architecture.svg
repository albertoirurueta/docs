<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="14">
  <title id="t">JMeter architecture</title>
  <desc id="d">A test plan designed in GUI mode or run in CLI mode is executed by the engine, which starts thread groups; their threads run samplers against the system under test; results flow to listeners, the JTL file, the HTML dashboard and the Backend Listener.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.6" color="#8a8f98">
    <text x="20" y="24" fill="currentColor" stroke="none" font-weight="bold">1. Design and start</text>
    <!-- row 1 -->
    <rect x="20" y="44" width="170" height="54" rx="8" fill="#4a90d9" fill-opacity="0.25"/>
    <text x="105" y="67" text-anchor="middle" fill="currentColor" stroke="none">GUI mode</text>
    <text x="105" y="85" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">design, debug</text>
    <rect x="20" y="118" width="170" height="54" rx="8" fill="#4a90d9" fill-opacity="0.25"/>
    <text x="105" y="141" text-anchor="middle" fill="currentColor" stroke="none">CLI mode</text>
    <text x="105" y="159" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">jmeter -n -t plan.jmx</text>
    <rect x="250" y="70" width="140" height="60" rx="8" fill="#9b7fd4" fill-opacity="0.25"/>
    <text x="320" y="96" text-anchor="middle" fill="currentColor" stroke="none">Test plan</text>
    <text x="320" y="114" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">.jmx (XML tree)</text>
    <rect x="450" y="70" width="150" height="60" rx="8" fill="#3fa77a" fill-opacity="0.25"/>
    <text x="525" y="96" text-anchor="middle" fill="currentColor" stroke="none">Engine</text>
    <text x="525" y="114" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">one JVM</text>
    <rect x="660" y="60" width="240" height="80" rx="8" fill="#3fa77a" fill-opacity="0.25"/>
    <text x="780" y="86" text-anchor="middle" fill="currentColor" stroke="none">Thread groups</text>
    <text x="780" y="106" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">1 Java thread = 1 virtual user</text>
    <text x="780" y="124" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">users x loops, ramp-up</text>
    <path d="M190,71 L250,92" marker-end="url(#a)"/>
    <path d="M190,145 L250,108" marker-end="url(#a)"/>
    <path d="M390,100 L450,100" marker-end="url(#a)"/>
    <path d="M600,100 L660,100" marker-end="url(#a)"/>
    <!-- row 2 -->
    <text x="20" y="214" fill="currentColor" stroke="none" font-weight="bold">2. Execute and measure</text>
    <rect x="725" y="234" width="175" height="64" rx="8" fill="#e0a030" fill-opacity="0.28"/>
    <text x="812" y="260" text-anchor="middle" fill="currentColor" stroke="none">Samplers</text>
    <text x="812" y="280" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">HTTP, JDBC, JMS, ...</text>
    <rect x="490" y="234" width="175" height="64" rx="8" fill="#e0a030" fill-opacity="0.28"/>
    <text x="577" y="260" text-anchor="middle" fill="currentColor" stroke="none">SampleResult</text>
    <text x="577" y="280" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">time, status, bytes</text>
    <rect x="255" y="234" width="175" height="64" rx="8" fill="#d9605a" fill-opacity="0.25"/>
    <text x="342" y="260" text-anchor="middle" fill="currentColor" stroke="none">Listeners</text>
    <text x="342" y="280" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">consume results</text>
    <path d="M780,140 L800,234" marker-end="url(#a)"/>
    <path d="M725,266 L665,266" marker-end="url(#a)"/>
    <path d="M490,266 L430,266" marker-end="url(#a)"/>
    <!-- row 3 -->
    <text x="20" y="336" fill="currentColor" stroke="none" font-weight="bold">3. Store and report</text>
    <rect x="20" y="370" width="150" height="60" rx="8" fill="#d9605a" fill-opacity="0.25"/>
    <text x="95" y="396" text-anchor="middle" fill="currentColor" stroke="none">JTL file</text>
    <text x="95" y="414" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">CSV or XML</text>
    <rect x="215" y="370" width="170" height="60" rx="8" fill="#d9605a" fill-opacity="0.25"/>
    <text x="300" y="396" text-anchor="middle" fill="currentColor" stroke="none">HTML dashboard</text>
    <text x="300" y="414" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">-e -o or -g</text>
    <rect x="430" y="370" width="190" height="60" rx="8" fill="#d9605a" fill-opacity="0.25"/>
    <text x="525" y="396" text-anchor="middle" fill="currentColor" stroke="none">Backend Listener</text>
    <text x="525" y="414" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">InfluxDB, Graphite</text>
    <rect x="725" y="370" width="175" height="60" rx="8" stroke-dasharray="6 4"/>
    <text x="812" y="396" text-anchor="middle" fill="currentColor" stroke="none">System under test</text>
    <text x="812" y="414" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">for example localhost</text>
    <path d="M300,298 L110,370" marker-end="url(#a)"/>
    <path d="M342,298 L330,370" marker-end="url(#a)"/>
    <path d="M370,298 L500,370" marker-end="url(#a)"/>
    <path d="M812,298 L812,370" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="822" y="338" fill="currentColor" stroke="none" font-size="12">requests / responses</text>
  </g>
  <text x="20" y="460" fill="currentColor" font-size="12">Dashboard: generated from the JTL file after the run (-e) or later (-g).</text>
</svg>
