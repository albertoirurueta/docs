<svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Imperative View-tree mutation compared with Compose's UI = f(state), and the three composition phases</title>
  <defs>
    <marker id="arrCv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="660" fill="#ffffff"/>
  <text x="380" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Two ways to put pixels on screen</text>
  <text x="380" y="41" font-size="10.5" fill="#666666" text-anchor="middle">the View system mutates a persistent tree of objects; Compose derives UI from state each time</text>

  <!-- Divider -->
  <line x1="380" y1="54" x2="380" y2="468" stroke="#cccccc" stroke-width="1"/>

  <!-- LEFT COLUMN: imperative -->
  <g>
    <rect x="20" y="60" width="330" height="24" rx="4" fill="#faeeee" stroke="#8a3b3b" stroke-width="1.2"/>
    <text x="185" y="76" font-size="12" font-weight="bold" fill="#8a3b3b" text-anchor="middle">Imperative: mutating the View tree</text>

    <rect x="60" y="104" width="250" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="185" y="125" font-size="10.5" fill="#333333" text-anchor="middle">Persistent View tree (inflated once)</text>

    <line x1="185" y1="138" x2="185" y2="160" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>
    <text x="270" y="152" font-size="8.5" fill="#666666" text-anchor="middle">tap favorite</text>

    <rect x="60" y="164" width="250" height="34" rx="4" fill="#faeeee" stroke="#8a3b3b" stroke-width="1.2"/>
    <text x="185" y="185" font-size="10.5" fill="#8a3b3b" text-anchor="middle">onClickListener runs</text>

    <line x1="185" y1="198" x2="185" y2="220" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>

    <rect x="60" y="224" width="250" height="46" rx="4" fill="#faeeee" stroke="#8a3b3b" stroke-width="1.6"/>
    <text x="185" y="243" font-size="10.5" font-weight="bold" fill="#8a3b3b" text-anchor="middle">binding.favoriteToggle.setImageResource(...)</text>
    <text x="185" y="258" font-size="9.5" fill="#8a3b3b" text-anchor="middle">this exact ImageView object is mutated in place</text>

    <line x1="185" y1="270" x2="185" y2="292" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>

    <rect x="60" y="296" width="250" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="185" y="317" font-size="10.5" fill="#333333" text-anchor="middle">Same tree, now carrying new state</text>

    <path d="M310,313 C 345,313 345,120 310,120" fill="none" stroke="#999999" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrCv)"/>
    <text x="356" y="220" font-size="8.5" fill="#777777" text-anchor="middle" transform="rotate(90 356 220)">tree keeps state across events</text>

    <text x="185" y="352" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="185" dy="0">Every screen change is a direct call on a</tspan>
      <tspan x="185" dy="12">specific `View` object. The tree itself is</tspan>
      <tspan x="185" dy="12">the source of truth: to know the current</tspan>
      <tspan x="185" dy="12">UI you must inspect the live objects, and</tspan>
      <tspan x="185" dy="12">a missed update site leaves the screen</tspan>
      <tspan x="185" dy="12">and the underlying data out of sync.</tspan>
    </text>
  </g>

  <!-- RIGHT COLUMN: declarative -->
  <g>
    <rect x="410" y="60" width="330" height="24" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
    <text x="575" y="76" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Declarative: UI = f(state)</text>

    <rect x="450" y="104" width="250" height="34" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
    <text x="575" y="125" font-size="10.5" fill="#2d6a34" text-anchor="middle">State: isFavorite = false</text>

    <line x1="575" y1="138" x2="575" y2="160" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>
    <text x="660" y="152" font-size="8.5" fill="#666666" text-anchor="middle">tap favorite</text>

    <rect x="450" y="164" width="250" height="34" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
    <text x="575" y="185" font-size="10.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">isFavorite = true (new state value)</text>

    <line x1="575" y1="198" x2="575" y2="220" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>
    <text x="660" y="212" font-size="8.5" fill="#666666" text-anchor="middle">recompose</text>

    <rect x="450" y="224" width="250" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
    <text x="575" y="243" font-size="10.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">TrailCard(trail) runs again</text>
    <text x="575" y="258" font-size="9.5" fill="#1c4b73" text-anchor="middle">the function re-emits a UI description</text>

    <line x1="575" y1="270" x2="575" y2="292" stroke="#444444" stroke-width="1.2" marker-end="url(#arrCv)"/>

    <rect x="450" y="296" width="250" height="34" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.2"/>
    <text x="575" y="317" font-size="10.5" fill="#333333" text-anchor="middle">Compose updates only what changed</text>

    <text x="575" y="352" font-size="9" fill="#333333" text-anchor="middle">
      <tspan x="575" dy="0">The composable function is the single</tspan>
      <tspan x="575" dy="12">source of truth for what the UI should</tspan>
      <tspan x="575" dy="12">look like, given the current state. There</tspan>
      <tspan x="575" dy="12">is no persistent tree for app code to</tspan>
      <tspan x="575" dy="12">mutate; the runtime diffs the new emitted</tspan>
      <tspan x="575" dy="12">description and patches the screen.</tspan>
    </text>
  </g>

  <!-- Bottom: three phases -->
  <line x1="20" y1="428" x2="740" y2="428" stroke="#cccccc" stroke-width="1"/>
  <text x="380" y="450" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Every recomposition runs (up to) three phases, in order</text>
  <text x="380" y="465" font-size="9.5" fill="#666666" text-anchor="middle">a phase only re-runs for the parts of the tree its inputs actually changed</text>

  <rect x="40" y="484" width="200" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="140" y="506" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">1. Composition</text>
  <text x="140" y="522" font-size="9" fill="#1c4b73" text-anchor="middle">
    <tspan x="140" dy="0">Composable functions run and</tspan>
    <tspan x="140" dy="12">emit a tree describing the UI</tspan>
  </text>

  <line x1="240" y1="519" x2="280" y2="519" stroke="#444444" stroke-width="1.4" marker-end="url(#arrCv)"/>

  <rect x="280" y="484" width="200" height="70" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="380" y="506" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">2. Layout</text>
  <text x="380" y="522" font-size="9" fill="#2d6a34" text-anchor="middle">
    <tspan x="380" dy="0">Each node measures itself and</tspan>
    <tspan x="380" dy="12">its children, then places them</tspan>
  </text>

  <line x1="480" y1="519" x2="520" y2="519" stroke="#444444" stroke-width="1.4" marker-end="url(#arrCv)"/>

  <rect x="520" y="484" width="200" height="70" rx="6" fill="#f6f0e6" stroke="#8a6a1c" stroke-width="1.4"/>
  <text x="620" y="506" font-size="12" font-weight="bold" fill="#8a6a1c" text-anchor="middle">3. Drawing</text>
  <text x="620" y="522" font-size="9" fill="#8a6a1c" text-anchor="middle">
    <tspan x="620" dy="0">Each node renders its content</tspan>
    <tspan x="620" dy="12">to the screen's Canvas</tspan>
  </text>

  <text x="380" y="580" font-size="9.5" fill="#333333" text-anchor="middle">
    <tspan x="380" dy="0">Composable functions are expected to be idempotent: calling one again with the same</tspan>
    <tspan x="380" dy="14">inputs must emit the same UI description, with no side effects outside the returned tree --</tspan>
    <tspan x="380" dy="14">so the runtime is free to run, skip, or reorder phases for only the parts that changed.</tspan>
  </text>
</svg>
