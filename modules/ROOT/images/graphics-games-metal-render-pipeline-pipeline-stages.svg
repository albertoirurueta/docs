<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-pipeline-pipeline-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="500" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The stages of a Metal render pipeline and what configures each one</text>
<rect x="20" y="48" width="12" height="12" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="26.0" y="57.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle"></text>
<text x="38" y="58" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Programmable (your MSL)</text>
<rect x="210" y="48" width="12" height="12" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="216.0" y="57.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle"></text>
<text x="228" y="58" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Fixed function, configured by state</text>
<rect x="470" y="48" width="12" height="12" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="476.0" y="57.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="488" y="58" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">Optional stage (not used by this page)</text>
<rect x="20" y="80" width="165" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102.5" y="105.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex fetch</text>
<text x="102.5" y="119.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">reads vertex data</text>
<text x="102.5" y="133.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">per vertex_id or</text>
<text x="102.5" y="147.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">via stage_in</text>
<circle cx="34" cy="94" r="11" fill="#4F46E5"/>
<text x="34" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="102.5" y="184" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLVertexDescriptor</text>
<rect x="215" y="80" width="165" height="86" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="297.5" y="112.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Vertex function</text>
<text x="297.5" y="126.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">float4 position</text>
<text x="297.5" y="140.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">and varyings</text>
<circle cx="229" cy="94" r="11" fill="#4F46E5"/>
<text x="229" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="297.5" y="184" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">vertex function in the pipeline</text>
<rect x="410" y="80" width="165" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="492.5" y="112.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Clip and cull</text>
<text x="492.5" y="126.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">clip volume x y -1..1</text>
<text x="492.5" y="140.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">z 0..1; back faces</text>
<circle cx="424" cy="94" r="11" fill="#4F46E5"/>
<text x="424" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="492.5" y="184" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">cull mode, winding, viewport</text>
<rect x="605" y="80" width="165" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="687.5" y="112.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Rasteriser</text>
<text x="687.5" y="126.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">covers pixels,</text>
<text x="687.5" y="140.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">interpolates varyings</text>
<circle cx="619" cy="94" r="11" fill="#4F46E5"/>
<text x="619" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="687.5" y="184" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">sample count, MSAA</text>
<rect x="215" y="200" width="165" height="34" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="297.5" y="220.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tessellation or mesh</text>
<line x1="297" y1="166" x2="297" y2="200" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="185" y1="123" x2="215" y2="123" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="380" y1="123" x2="410" y2="123" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="575" y1="123" x2="605" y2="123" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="687" y1="184" x2="687" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<rect x="605" y="250" width="165" height="86" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="687.5" y="282.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Fragment function</text>
<text x="687.5" y="296.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">colour, optional</text>
<text x="687.5" y="310.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">depth and mask</text>
<circle cx="619" cy="264" r="11" fill="#4F46E5"/>
<text x="619" y="268" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="687.5" y="354" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">fragment function in pipeline</text>
<rect x="410" y="250" width="165" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="492.5" y="282.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Depth and stencil</text>
<text x="492.5" y="296.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">compare with the</text>
<text x="492.5" y="310.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">stored depth</text>
<circle cx="424" cy="264" r="11" fill="#4F46E5"/>
<text x="424" y="268" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="492.5" y="354" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">MTLDepthStencilState</text>
<rect x="215" y="250" width="165" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="297.5" y="282.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Blend</text>
<text x="297.5" y="296.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">mix with the</text>
<text x="297.5" y="310.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">attachment colour</text>
<circle cx="229" cy="264" r="11" fill="#4F46E5"/>
<text x="229" y="268" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="297.5" y="354" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">blend factors in the pipeline</text>
<rect x="20" y="250" width="165" height="86" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="102.5" y="282.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Attachment</text>
<text x="102.5" y="296.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">store to the</text>
<text x="102.5" y="310.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">drawable texture</text>
<circle cx="34" cy="264" r="11" fill="#4F46E5"/>
<text x="34" y="268" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="102.5" y="354" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">load and store actions</text>
<line x1="605" y1="293" x2="575" y2="293" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="410" y1="293" x2="380" y2="293" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<line x1="215" y1="293" x2="185" y2="293" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-pipeline-pipeline-stages)"/>
<rect x="20" y="400" width="720" height="70" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="424.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">What stays outside the shaders</text>
<text x="380.0" y="438.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Per draw the encoder supplies the pipeline, depth-stencil state, argument table, viewport,</text>
<text x="380.0" y="452.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">scissor, cull mode, winding, fill mode, depth bias, stencil reference and blend colour.</text>
</svg>
