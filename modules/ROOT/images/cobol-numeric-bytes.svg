<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>The bytes of +1234.5 stored as PIC S9(5)V9 in zoned decimal (EBCDIC and ASCII), packed decimal COMP-3, big-endian binary COMP and little-endian native COMP-5</title>
<rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
<text x="430.0" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One value, five storage formats: +1234.5 in PIC S9(5)V9</text>
<text x="430.0" y="48" font-size="12" fill="#555555" text-anchor="middle">each box is one byte shown in hexadecimal; the decimal point (V) is never stored, the digits are 0 1 2 3 4 5</text>
<text x="24" y="94" font-size="14" font-weight="bold" fill="#222222">DISPLAY, EBCDIC</text>
<text x="24" y="112" font-size="11" fill="#555555">z/OS: 6 bytes, one digit per byte</text>
<rect x="250" y="78" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="285.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">F0</text>
<text x="285.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">0</text>
<rect x="326" y="78" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="361.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">F1</text>
<text x="361.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">1</text>
<rect x="402" y="78" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="437.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">F2</text>
<text x="437.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">2</text>
<rect x="478" y="78" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="513.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">F3</text>
<text x="513.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">3</text>
<rect x="554" y="78" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="589.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">F4</text>
<text x="589.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">4</text>
<rect x="630" y="78" width="70" height="34" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<text x="665.0" y="100" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">C5</text>
<text x="665.0" y="126" font-size="10.5" fill="#444444" text-anchor="middle">5 + sign C</text>
<text x="24" y="170" font-size="14" font-weight="bold" fill="#222222">DISPLAY, ASCII</text>
<text x="24" y="188" font-size="11" fill="#555555">GnuCOBOL default: 6 bytes</text>
<rect x="250" y="154" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="285.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">30</text>
<text x="285.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'0'</text>
<rect x="326" y="154" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="361.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">31</text>
<text x="361.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'1'</text>
<rect x="402" y="154" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="437.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">32</text>
<text x="437.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'2'</text>
<rect x="478" y="154" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="513.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">33</text>
<text x="513.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'3'</text>
<rect x="554" y="154" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="589.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">34</text>
<text x="589.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'4'</text>
<rect x="630" y="154" width="70" height="34" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<text x="665.0" y="176" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">35</text>
<text x="665.0" y="202" font-size="10.5" fill="#444444" text-anchor="middle">'5' positive</text>
<text x="24" y="246" font-size="14" font-weight="bold" fill="#222222">COMP-3 (packed)</text>
<text x="24" y="264" font-size="11" fill="#555555">4 bytes: 2 digits per byte, last nibble = sign</text>
<rect x="250" y="230" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<line x1="285.0" y1="230" x2="285.0" y2="264" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3 2"/>
<text x="267.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">0</text>
<text x="302.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">0</text>
<text x="285.0" y="278" font-size="10.5" fill="#444444" text-anchor="middle">digits 0 0</text>
<rect x="326" y="230" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<line x1="361.0" y1="230" x2="361.0" y2="264" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3 2"/>
<text x="343.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">1</text>
<text x="378.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">2</text>
<text x="361.0" y="278" font-size="10.5" fill="#444444" text-anchor="middle">digits 1 2</text>
<rect x="402" y="230" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<line x1="437.0" y1="230" x2="437.0" y2="264" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3 2"/>
<text x="419.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">3</text>
<text x="454.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">4</text>
<text x="437.0" y="278" font-size="10.5" fill="#444444" text-anchor="middle">digits 3 4</text>
<rect x="478" y="230" width="70" height="34" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<line x1="513.0" y1="230" x2="513.0" y2="264" stroke="#a15c00" stroke-width="1" stroke-dasharray="3 2"/>
<text x="495.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">5</text>
<text x="530.5" y="252" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">C</text>
<text x="513.0" y="278" font-size="10.5" fill="#444444" text-anchor="middle">digit 5, sign C</text>
<text x="24" y="322" font-size="14" font-weight="bold" fill="#222222">COMP (binary)</text>
<text x="24" y="340" font-size="11" fill="#555555">4 bytes, big-endian: 12345 = X'3039'</text>
<rect x="250" y="306" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="285.0" y="328" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">00</text>
<rect x="326" y="306" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="361.0" y="328" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">00</text>
<rect x="402" y="306" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="437.0" y="328" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">30</text>
<rect x="478" y="306" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="513.0" y="328" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">39</text>
<text x="24" y="398" font-size="14" font-weight="bold" fill="#222222">COMP-5 (native)</text>
<text x="24" y="416" font-size="11" fill="#555555">4 bytes, little-endian host: reversed</text>
<rect x="250" y="382" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="285.0" y="404" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">39</text>
<rect x="326" y="382" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="361.0" y="404" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">30</text>
<rect x="402" y="382" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="437.0" y="404" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">00</text>
<rect x="478" y="382" width="70" height="34" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="513.0" y="404" font-size="16" fill="#222222" text-anchor="middle" font-family="Courier New, monospace">00</text>
<text x="562" y="328" font-size="11" fill="#444444">12345 = X'00003039'</text>
<text x="562" y="404" font-size="11" fill="#444444">12345 = X'3039', low byte first</text>
<rect x="24" y="464" width="16" height="16" fill="#fde7a8" stroke="#a15c00" stroke-width="2"/>
<text x="48" y="477" font-size="12" fill="#222222">byte that carries the sign (zone nibble C = +, D = -, F = unsigned; packed: last nibble)</text>
<rect x="24" y="488" width="16" height="16" fill="#d9e8f5" stroke="#1c4b73" stroke-width="2"/>
<text x="48" y="501" font-size="12" fill="#222222">other bytes. With -1234.5: EBCDIC D5, ASCII 75 (GnuCOBOL), packed 5D, binary FFFFCFC7</text>
</svg>
