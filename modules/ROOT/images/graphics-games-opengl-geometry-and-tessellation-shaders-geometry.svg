<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gts-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Geometry shader: one primitive in, zero or more primitives out</text>
<rect x="20" y="55" width="340" height="170" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190" y="78" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Example A: points to billboards (dust)</text>
<circle cx="90" cy="150" r="5" fill="#B45309"/>
<text x="90" y="175" font-size="10" fill="#374151" text-anchor="middle">in: points</text>
<path d="M120 150 L200 150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-geo)"/>
<polygon points="240,120 290,120 290,170 240,170" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<line x1="240" y1="170" x2="290" y2="120" stroke="#B45309" stroke-width="1"/>
<text x="265" y="195" font-size="10" fill="#374151" text-anchor="middle">out: triangle_strip, 4 vertices</text>
<text x="190" y="214" font-size="10" fill="#374151" text-anchor="middle">max_vertices = 4, expand in view space</text>
<rect x="400" y="55" width="340" height="170" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570" y="78" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Example B: triangles to normal lines</text>
<polygon points="440,170 520,170 480,110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="480" y="190" font-size="10" fill="#374151" text-anchor="middle">in: triangles</text>
<path d="M545 145 L590 145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-geo)"/>
<polygon points="620,170 700,170 660,110" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<line x1="660" y1="150" x2="660" y2="115" stroke="#B45309" stroke-width="2"/>
<text x="660" y="190" font-size="10" fill="#374151" text-anchor="middle">out: line_strip, 2 vertices</text>
<text x="570" y="214" font-size="10" fill="#374151" text-anchor="middle">the triangle itself is not emitted</text>
<rect x="20" y="245" width="720" height="150" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="268" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Layout qualifiers and built-ins</text>
<text x="380" y="292" font-size="12" fill="#374151" text-anchor="middle">input: points | lines | lines_adjacency | triangles | triangles_adjacency, array gl_in[]</text>
<text x="380" y="312" font-size="12" fill="#374151" text-anchor="middle">output: points | line_strip | triangle_strip, with max_vertices = N</text>
<text x="380" y="332" font-size="12" fill="#374151" text-anchor="middle">EmitVertex() appends a vertex; EndPrimitive() ends the strip so the next vertex starts a new one</text>
<text x="380" y="352" font-size="12" fill="#374151" text-anchor="middle">invocations = N runs the shader N times per input primitive, gl_InvocationID tells which</text>
<text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">gl_Layer and gl_ViewportIndex route a primitive to a layer or viewport of the framebuffer</text>
</svg>
