<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ab-heap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Heaps suballocate; residency sets keep memory available</text>
<rect x="20" y="55" width="330" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="185" y="76" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">MTLHeap (type: .placement)</text>
<rect x="35" y="95" width="85" height="60" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="77.5" y="128.5" text-anchor="middle" font-size="11" fill="#065F46">tex A</text>
<rect x="130" y="95" width="65" height="60" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="162.5" y="128.5" text-anchor="middle" font-size="11" fill="#065F46">tex B</text>
<rect x="205" y="95" width="55" height="60" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.5" y="128.5" text-anchor="middle" font-size="11" fill="#3730A3">buffer</text>
<rect x="270" y="95" width="65" height="60" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="302.5" y="128.5" text-anchor="middle" font-size="11" fill="#6B7280">free</text>
<text x="185" y="180" text-anchor="middle" font-size="11" fill="#374151">Placement heap: you choose offsets</text>
<text x="185" y="198" text-anchor="middle" font-size="11" fill="#374151">(makeAliasable() before reusing the same bytes)</text>
<text x="185" y="226" text-anchor="middle" font-size="11" fill="#3730A3">heap, textures and buffers are all MTLAllocation</text>
<rect x="410" y="55" width="330" height="200" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="575" y="76" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">MTLResidencySet</text>
<rect x="440" y="90" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="575" y="110" text-anchor="middle" font-size="11" fill="#374151">addAllocation(heap)</text>
<rect x="440" y="128" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="575" y="148" text-anchor="middle" font-size="11" fill="#374151">addAllocation(argumentBuffer)</text>
<rect x="440" y="166" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="575" y="186" text-anchor="middle" font-size="11" fill="#374151">commit()</text>
<rect x="440" y="204" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="575" y="224" text-anchor="middle" font-size="11" fill="#374151">requestResidency()</text>
<line x1="350" y1="155" x2="410" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ab-heap)"/>
<rect x="20" y="280" width="720" height="80" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="308.5" text-anchor="middle" font-size="11" fill="#374151">Attach the set to the queue (addResidencySet) when it lives for the whole app, or to one command buffer (useResidencySet).</text>
<text x="380.0" y="323.5" text-anchor="middle" font-size="11" fill="#374151">The GPU can then follow any gpuResourceID or gpuAddress stored in your argument buffers to resources inside the set.</text>
<text x="380.0" y="338.5" text-anchor="middle" font-size="11" fill="#374151">Changes (add, remove) take effect only after commit().</text>
</svg>
