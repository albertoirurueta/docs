<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From canvas to live site</text>
  <g stroke-width="1.5">
    <rect x="30" y="70" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5"/>
    <rect x="230" y="70" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5"/>
    <rect x="430" y="70" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5"/>
    <rect x="610" y="70" width="120" height="110" rx="10" fill="#FEF3C7" stroke="#B45309"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">
    <text x="105" y="100">Canvas</text><text x="305" y="100">Preview</text><text x="505" y="100">Publish</text>
  </g>
  <text x="670" y="100" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Custom domain</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="105" y="124">webpages and</text><text x="105" y="140">breakpoints</text><text x="105" y="156">edits stay private</text>
    <text x="305" y="124">preview icon or</text><text x="305" y="140">Shift Space</text><text x="305" y="156">no publishing</text>
    <text x="505" y="124">File, then Publish</text><text x="505" y="140">random figma.site</text><text x="505" y="156">subdomain</text>
    <text x="670" y="124">optional</text><text x="670" y="140">paid plans</text><text x="670" y="156">one per site</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M180 125 L226 125" marker-end="url(#ah)"/><path d="M380 125 L426 125" marker-end="url(#ah)"/><path d="M580 125 L606 125" marker-end="url(#ah)"/></g>
  <path d="M505 70 C505 30 105 30 105 66" stroke="#4B5563" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)" transform="translate(0,6)"/>
  <rect x="330" y="212" width="190" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/><text x="425" y="230" font-size="12" fill="#374151" text-anchor="middle">Edit again, then republish</text>
  <rect x="30" y="250" width="700" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="46" y="272" font-size="12" fill="#3730A3">Canvas changes (even a deleted page) do not go live until you publish again.</text>
  <text x="46" y="292" font-size="12" fill="#3730A3">Unpublish from Site settings, General; republishing later reuses the same domain.</text>
  <g fill="#4F46E5"><circle cx="30" cy="70" r="11"/><circle cx="230" cy="70" r="11"/><circle cx="430" cy="70" r="11"/></g>
  <circle cx="610" cy="70" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="74">1</text><text x="230" y="74">2</text><text x="430" y="74">3</text><text x="610" y="74">4</text></g>
</svg>
