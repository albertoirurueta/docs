<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-framebuffers-and-render-to-texture-fbo-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A framebuffer object is a table of attachment points</text>
<rect x="20" y="60" width="190" height="250" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="115.0" y="136.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">WebGLFramebuffer</text>
<text x="115.0" y="151.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">(FBO)</text>
<text x="115.0" y="166.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle"></text>
<text x="115.0" y="181.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">COLOR_ATTACHMENT0</text>
<text x="115.0" y="196.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">COLOR_ATTACHMENT1 ... 15</text>
<text x="115.0" y="211.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">DEPTH_ATTACHMENT</text>
<text x="115.0" y="226.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">STENCIL_ATTACHMENT</text>
<text x="115.0" y="241.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">DEPTH_STENCIL_ATTACHMENT</text>
<line x1="210" y1="105" x2="400" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-fbo-model)"/>
<rect x="400" y="85" width="230" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="515.0" y="109.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Texture (2D, layer, cube face)</text>
<text x="305" y="99" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">framebufferTexture2D</text>
<line x1="210" y1="150" x2="400" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-fbo-model)"/>
<rect x="400" y="130" width="230" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="515.0" y="154.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Texture level of a 3D or array</text>
<text x="305" y="144" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">framebufferTextureLayer</text>
<line x1="210" y1="195" x2="400" y2="195" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-fbo-model)"/>
<rect x="400" y="175" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="515.0" y="199.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Renderbuffer (colour)</text>
<text x="305" y="189" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">framebufferRenderbuffer</text>
<line x1="210" y1="240" x2="400" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-fbo-model)"/>
<rect x="400" y="220" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="515.0" y="244.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Renderbuffer (depth)</text>
<text x="305" y="234" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">DEPTH_COMPONENT24 / 32F</text>
<line x1="210" y1="285" x2="400" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-framebuffers-and-render-to-texture-fbo-model)"/>
<rect x="400" y="265" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="515.0" y="289.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Renderbuffer (depth+stencil)</text>
<text x="305" y="279" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">DEPTH24_STENCIL8</text>
<text x="645" y="109" font-size="11" font-weight="normal" fill="#047857" text-anchor="start">sampled later</text>
<text x="645" y="199" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">write only</text>
<text x="645" y="244" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">write only</text>
<text x="380" y="340" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Texture attachments can be sampled afterwards; renderbuffers cannot, but can be multisampled and blitted.</text>
</svg>
