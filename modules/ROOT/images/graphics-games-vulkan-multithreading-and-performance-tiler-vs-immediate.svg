<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-mt-tile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Immediate-mode versus tile-based GPUs</text>
<rect x="20" y="50" width="350" height="370" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="195.0" y="239.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<rect x="390" y="50" width="350" height="370" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="565.0" y="239.2" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="195" y="76" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Immediate-mode (typical desktop)</text>
<text x="565" y="76" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Tile-based (typical mobile)</text>
<rect x="40" y="95" width="310" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="118.8" text-anchor="middle" font-size="11" fill="#374151">Draw 1: vertices, raster, fragments</text>
<rect x="40" y="151" width="310" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="174.8" text-anchor="middle" font-size="11" fill="#374151">Draw 2: vertices, raster, fragments</text>
<rect x="40" y="207" width="310" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="230.8" text-anchor="middle" font-size="11" fill="#374151">Draw 3: vertices, raster, fragments</text>
<rect x="40" y="270" width="310" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="291.9" text-anchor="middle" font-size="11" fill="#92400E">Framebuffer in video memory</text>
<text x="195.0" y="305.9" text-anchor="middle" font-size="11" fill="#92400E">read and written for every draw</text>
<line x1="195" y1="247" x2="195" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-tile)"/>
<text x="195" y="345" text-anchor="middle" font-size="11" fill="#374151">Overdraw costs memory bandwidth.</text>
<text x="195" y="362" text-anchor="middle" font-size="11" fill="#374151">Barriers and load/store ops matter less.</text>
<rect x="410" y="95" width="310" height="40" rx="8" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="118.8" text-anchor="middle" font-size="11" fill="#374151">Pass 1: vertex work, binned by tile</text>
<rect x="410" y="150" width="310" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="174.8" text-anchor="middle" font-size="11" fill="#1F2937">Pass 2: per tile, on chip</text>
<text x="565.0" y="188.8" text-anchor="middle" font-size="11" fill="#1F2937">tile memory holds colour, depth, MSAA</text>
<text x="565.0" y="202.8" text-anchor="middle" font-size="11" fill="#1F2937">fragments of every draw are shaded here</text>
<line x1="565" y1="135" x2="565" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-tile)"/>
<line x1="565" y1="220" x2="565" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-tile)"/>
<rect x="410" y="245" width="310" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="266.9" text-anchor="middle" font-size="11" fill="#92400E">Store once per tile</text>
<text x="565.0" y="280.9" text-anchor="middle" font-size="11" fill="#92400E">only if storeOp is STORE</text>
<text x="565" y="322" text-anchor="middle" font-size="11" fill="#374151">loadOp CLEAR or DONT_CARE avoids a read.</text>
<text x="565" y="339" text-anchor="middle" font-size="11" fill="#374151">storeOp DONT_CARE avoids a write.</text>
<text x="565" y="361" text-anchor="middle" font-size="11" fill="#374151">Transient attachments can stay on chip.</text>
<text x="565" y="378" text-anchor="middle" font-size="11" fill="#374151">Splitting a pass flushes the tile early.</text>
</svg>
