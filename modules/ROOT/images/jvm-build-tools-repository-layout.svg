<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="layoutArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From coordinates to files: the Maven repository layout shared by Ant, Maven and Gradle</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Every directory below was produced by the tidepool build; the same paths are written and read by all three tools</text>

<text x="40" y="86" font-size="13" font-weight="bold" fill="#1c4b73">1. Coordinates</text>
<rect x="40" y="96" width="150" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="115" y="116" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">io.tidepool</text>
<text x="115" y="132" font-size="11" fill="#555555" text-anchor="middle">groupId</text>
<rect x="200" y="96" width="170" height="44" fill="#fff4e0" stroke="#a65e00"/>
<text x="285" y="116" font-size="13" font-weight="bold" fill="#7a4500" text-anchor="middle">tidepool-model</text>
<text x="285" y="132" font-size="11" fill="#555555" text-anchor="middle">artifactId</text>
<rect x="380" y="96" width="110" height="44" fill="#e9f5e9" stroke="#2e7d32"/>
<text x="435" y="116" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">1.0.0</text>
<text x="435" y="132" font-size="11" fill="#555555" text-anchor="middle">version</text>
<rect x="500" y="96" width="130" height="44" fill="#f3e8f8" stroke="#6a1b9a"/>
<text x="565" y="116" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">sources</text>
<text x="565" y="132" font-size="11" fill="#555555" text-anchor="middle">classifier (optional)</text>
<rect x="640" y="96" width="110" height="44" fill="#eeeeee" stroke="#555555"/>
<text x="695" y="116" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">jar</text>
<text x="695" y="132" font-size="11" fill="#555555" text-anchor="middle">extension</text>

<text x="40" y="176" font-size="13" font-weight="bold" fill="#1c4b73">2. Path in the repository</text>
<line x1="395" y1="142" x2="395" y2="184" stroke="#444444" stroke-width="1.6" marker-end="url(#layoutArrow)"/>
<rect x="40" y="188" width="150" height="40" fill="#e8f0f8" stroke="#1c4b73"/>
<text x="115" y="213" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1c4b73" text-anchor="middle">io/tidepool/</text>
<rect x="190" y="188" width="150" height="40" fill="#fff4e0" stroke="#a65e00"/>
<text x="265" y="213" font-size="14" font-family="Menlo, Consolas, monospace" fill="#7a4500" text-anchor="middle">tidepool-model/</text>
<rect x="340" y="188" width="70" height="40" fill="#e9f5e9" stroke="#2e7d32"/>
<text x="375" y="213" font-size="14" font-family="Menlo, Consolas, monospace" fill="#1b5e20" text-anchor="middle">1.0.0/</text>
<rect x="410" y="188" width="510" height="40" fill="#f3e8f8" stroke="#6a1b9a"/>
<text x="665" y="213" font-size="14" font-family="Menlo, Consolas, monospace" fill="#4a148c" text-anchor="middle">tidepool-model-1.0.0-sources.jar</text>
<text x="115" y="246" font-size="11" fill="#555555" text-anchor="middle">dots become slashes</text>
<text x="265" y="246" font-size="11" fill="#555555" text-anchor="middle">one directory per artifact</text>
<text x="375" y="246" font-size="11" fill="#555555" text-anchor="middle">one per version</text>
<text x="665" y="246" font-size="11" fill="#555555" text-anchor="middle">artifactId-version[-classifier].extension</text>

<text x="40" y="286" font-size="13" font-weight="bold" fill="#1c4b73">3. What a published module contains</text>
<rect x="40" y="296" width="560" height="244" fill="#f7f7f7" stroke="#999999"/>
<g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#222222">
<text x="54" y="318">io/tidepool/tidepool-model/</text>
<text x="74" y="340" fill="#b3261e">maven-metadata.xml  (+ .md5 .sha1 [.sha256 .sha512])</text>
<text x="74" y="362">1.0.0/</text>
<text x="94" y="384">tidepool-model-1.0.0.pom</text>
<text x="94" y="404">tidepool-model-1.0.0.jar</text>
<text x="94" y="424">tidepool-model-1.0.0-sources.jar</text>
<text x="94" y="444">tidepool-model-1.0.0-javadoc.jar</text>
<text x="94" y="464" fill="#6a1b9a">each file + .asc (signature)</text>
<text x="94" y="484" fill="#2e7d32">each file + .md5 .sha1 [.sha256 .sha512]</text>
<text x="74" y="508">1.2.0-SNAPSHOT/</text>
<text x="94" y="528" fill="#b3261e">maven-metadata.xml, tidepool-model-1.2.0-20261016.091504-2.jar ...</text>
</g>

<rect x="630" y="296" width="290" height="70" fill="#fdecea" stroke="#b3261e"/>
<text x="642" y="316" font-size="12" font-weight="bold" fill="#8c1d18">A-level metadata</text>
<text x="642" y="334" font-size="11" fill="#444444">versions, release, latest, lastUpdated:</text>
<text x="642" y="350" font-size="11" fill="#444444">how Maven and Gradle list versions</text>
<rect x="630" y="376" width="290" height="70" fill="#fdecea" stroke="#b3261e"/>
<text x="642" y="396" font-size="12" font-weight="bold" fill="#8c1d18">V-level metadata (snapshots only)</text>
<text x="642" y="414" font-size="11" fill="#444444">maps 1.2.0-SNAPSHOT to the newest</text>
<text x="642" y="430" font-size="11" fill="#444444">timestamped build and its build number</text>
<rect x="630" y="456" width="290" height="84" fill="#e9f5e9" stroke="#2e7d32"/>
<text x="642" y="476" font-size="12" font-weight="bold" fill="#1b5e20">Checksums and signatures</text>
<text x="642" y="494" font-size="11" fill="#444444">.md5 and .sha1 are required by Central;</text>
<text x="642" y="510" font-size="11" fill="#444444">.sha256 and .sha512 are optional; .asc files</text>
<text x="642" y="526" font-size="11" fill="#444444">need no checksums of their own</text>
</svg>
