<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Architecture of a headless Shopify storefront</title>
  <desc id="d">Three layers. The storefront you build, made of a website, a mobile app or a shopping agent, calls a server layer that holds the private Storefront API token and the Customer Account API client. That layer calls the Storefront API and the Customer Account API, which Shopify exposes through the Headless channel or the Hydrogen channel, and customers are handed to Shopify-hosted checkout through the checkout URL of the cart.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="820" height="130" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="46" font-weight="bold">Your storefront (any stack, any host)</text>
  <rect x="40" y="62" width="230" height="70" rx="8" fill="none" stroke="currentColor"/>
  <text x="155" y="86" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="155" y="106" text-anchor="middle" font-size="12">HTML, cart store, forms</text>
  <text x="155" y="122" text-anchor="middle" font-size="11" opacity="0.8">public token or none</text>
  <rect x="315" y="62" width="230" height="70" rx="8" fill="none" stroke="currentColor"/>
  <text x="430" y="86" text-anchor="middle" font-weight="bold">Mobile app</text>
  <text x="430" y="106" text-anchor="middle" font-size="12">Checkout Kit, native UI</text>
  <text x="430" y="122" text-anchor="middle" font-size="11" opacity="0.8">public token</text>
  <rect x="590" y="62" width="230" height="70" rx="8" fill="none" stroke="currentColor"/>
  <text x="705" y="86" text-anchor="middle" font-weight="bold">Server (SSR, BFF, agent)</text>
  <text x="705" y="106" text-anchor="middle" font-size="12">Hydrogen request handlers</text>
  <text x="705" y="122" text-anchor="middle" font-size="11" opacity="0.8">private token + buyer IP</text>

  <rect x="20" y="200" width="820" height="150" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="226" font-weight="bold">Shopify headless APIs</text>
  <rect x="40" y="242" width="250" height="90" rx="8" fill="none" stroke="currentColor"/>
  <text x="165" y="266" text-anchor="middle" font-weight="bold">Storefront API</text>
  <text x="165" y="286" text-anchor="middle" font-size="12">products, search, markets, cart</text>
  <text x="165" y="304" text-anchor="middle" font-size="11" opacity="0.8">POST /api/2026-10/graphql.json</text>
  <text x="165" y="320" text-anchor="middle" font-size="11" opacity="0.8">tokenless, public or private</text>
  <rect x="320" y="242" width="250" height="90" rx="8" fill="none" stroke="currentColor"/>
  <text x="445" y="266" text-anchor="middle" font-weight="bold">Customer Account API</text>
  <text x="445" y="286" text-anchor="middle" font-size="12">profile, orders, addresses</text>
  <text x="445" y="304" text-anchor="middle" font-size="11" opacity="0.8">OAuth 2.0 authorization code</text>
  <text x="445" y="320" text-anchor="middle" font-size="11" opacity="0.8">PKCE for public clients</text>
  <rect x="600" y="242" width="220" height="90" rx="8" fill="none" stroke="currentColor"/>
  <text x="710" y="266" text-anchor="middle" font-weight="bold">Checkout</text>
  <text x="710" y="286" text-anchor="middle" font-size="12">hosted by Shopify</text>
  <text x="710" y="304" text-anchor="middle" font-size="11" opacity="0.8">cart.checkoutUrl</text>
  <text x="710" y="320" text-anchor="middle" font-size="11" opacity="0.8">extensions and Functions run here</text>

  <rect x="20" y="400" width="820" height="100" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="426" font-weight="bold">Sales channels that issue the credentials</text>
  <rect x="40" y="440" width="380" height="46" rx="8" fill="none" stroke="currentColor"/>
  <text x="230" y="460" text-anchor="middle" font-weight="bold">Headless channel</text>
  <text x="230" y="476" text-anchor="middle" font-size="12">host anywhere: Vercel, Node, mobile</text>
  <rect x="440" y="440" width="380" height="46" rx="8" fill="none" stroke="currentColor"/>
  <text x="630" y="460" text-anchor="middle" font-weight="bold">Hydrogen channel</text>
  <text x="630" y="476" text-anchor="middle" font-size="12">Oxygen hosting, environments, deployments</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M155 132 L155 240"/>
    <path d="M430 132 L430 240"/>
    <path d="M705 132 L705 240"/>
    <path d="M165 400 L165 334"/>
    <path d="M445 400 L445 334"/>
  </g>
  <text x="163" y="190" font-size="11">GraphQL</text>
  <text x="438" y="190" font-size="11">GraphQL</text>
  <text x="713" y="190" font-size="11">redirect</text>
  <text x="173" y="372" font-size="11">Storefront API tokens</text>
  <text x="453" y="372" font-size="11">Customer Account API client ID and secret</text>
</svg>
