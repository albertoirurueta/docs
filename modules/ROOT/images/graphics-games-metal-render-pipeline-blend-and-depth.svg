<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-pipeline-blend-and-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Blend factors and the depth test</text>
<rect x="20" y="50" width="170" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="40" y="66" width="70" height="70" fill="#2563EB"/>
<rect x="70" y="90" width="70" height="70" fill="#DC2626" fill-opacity="0.5"/>
<rect x="70" y="90" width="70" height="70" fill="none" stroke="#1F2937" stroke-width="1"/>
<text x="105" y="178" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Alpha blend</text>
<text x="105" y="194" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">src alpha, 1 - src alpha</text>
<rect x="200" y="50" width="170" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="220" y="66" width="70" height="70" fill="#2563EB"/>
<rect x="250" y="90" width="70" height="70" fill="#DC2626" fill-opacity="0.5"/>
<rect x="250" y="90" width="70" height="70" fill="none" stroke="#1F2937" stroke-width="1"/>
<text x="285" y="178" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Premultiplied</text>
<text x="285" y="194" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">one, 1 - src alpha</text>
<rect x="380" y="50" width="170" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="465.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="400" y="66" width="70" height="70" fill="#2563EB"/><rect x="430" y="90" width="70" height="70" fill="#9333EA"/>
<text x="465" y="178" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Additive</text>
<text x="465" y="194" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">one, one (glow, fire)</text>
<rect x="560" y="50" width="180" height="150" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="650.0" y="128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="580" y="66" width="70" height="70" fill="#F59E0B"/><rect x="610" y="90" width="70" height="70" fill="#92400E"/>
<text x="650" y="178" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Multiply</text>
<text x="650" y="194" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">dest colour, zero (tint)</text>
<rect x="20" y="220" width="720" height="180" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="313.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="380" y="242" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Depth test (.less, depth write on): the nearest fragment wins in any order</text>
<rect x="60" y="262" width="110" height="80" fill="#34D399" stroke="#047857"/>
<rect x="110" y="290" width="110" height="80" fill="#FCD34D" stroke="#B45309"/>
<text x="140" y="392" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Without depth: last drawn wins</text>
<text x="400" y="392" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">With depth: nearest wins</text>
<text x="262" y="322" font-size="22" fill="#4B5563">&#8594;</text>
<rect x="320" y="262" width="110" height="80" fill="#FCD34D" stroke="#B45309"/><rect x="370" y="290" width="110" height="80" fill="#FCD34D" stroke="#B45309"/><rect x="320" y="262" width="110" height="80" fill="#34D399" stroke="#047857"/>
<rect x="370" y="290" width="60" height="52" fill="#34D399"/>
<rect x="520" y="262" width="200" height="108" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="291.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal depth range</text>
<text x="620.0" y="305.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth 0 = near plane</text>
<text x="620.0" y="319.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth 1 = far plane</text>
<text x="620.0" y="333.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.less keeps the smaller depth</text>
<text x="620.0" y="347.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.always never rejects</text>
</svg>
