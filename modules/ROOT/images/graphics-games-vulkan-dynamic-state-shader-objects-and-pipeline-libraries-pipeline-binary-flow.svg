<text x="464.0" y="111.5" text-anchor="middle" font-size="11" fill="#3730A3">KHR</text>
<line x1="544" y1="94" x2="566" y2="94" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-bin)"/>
