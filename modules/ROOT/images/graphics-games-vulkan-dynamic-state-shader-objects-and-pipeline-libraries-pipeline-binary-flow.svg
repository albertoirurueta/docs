<text x="282.0" y="214.0" text-anchor="middle" font-size="11" fill="#065F46">from keys and data</text>
<line x1="362" y1="204" x2="384" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ds-bin)"/>
