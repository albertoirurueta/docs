<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-mt-rec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Parallel recording: one pool per thread, one submission</text>
<rect x="20" y="60" width="110" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="75.0" y="84.7" text-anchor="middle" font-size="12" fill="#3730A3">Worker thread 1</text>
<text x="75.0" y="99.7" text-anchor="middle" font-size="12" fill="#3730A3">(frame job)</text>
<rect x="165" y="60" width="130" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="230.0" y="84.8" text-anchor="middle" font-size="11" fill="#92400E">VkCommandPool 1</text>
<text x="230.0" y="98.8" text-anchor="middle" font-size="11" fill="#92400E">owned by thread 1</text>
<rect x="330" y="60" width="130" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="395.0" y="84.8" text-anchor="middle" font-size="11" fill="#374151">Command buffer 1</text>
<text x="395.0" y="98.8" text-anchor="middle" font-size="11" fill="#374151">vkCmd* recording</text>
<line x1="130" y1="88" x2="165" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="295" y1="88" x2="330" y2="88" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="460" y1="88" x2="520" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<rect x="20" y="140" width="110" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="75.0" y="164.7" text-anchor="middle" font-size="12" fill="#3730A3">Worker thread 2</text>
<text x="75.0" y="179.7" text-anchor="middle" font-size="12" fill="#3730A3">(frame job)</text>
<rect x="165" y="140" width="130" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="230.0" y="164.8" text-anchor="middle" font-size="11" fill="#92400E">VkCommandPool 2</text>
<text x="230.0" y="178.8" text-anchor="middle" font-size="11" fill="#92400E">owned by thread 2</text>
<rect x="330" y="140" width="130" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="395.0" y="164.8" text-anchor="middle" font-size="11" fill="#374151">Command buffer 2</text>
<text x="395.0" y="178.8" text-anchor="middle" font-size="11" fill="#374151">vkCmd* recording</text>
<line x1="130" y1="168" x2="165" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="295" y1="168" x2="330" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="460" y1="168" x2="520" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<rect x="20" y="220" width="110" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="75.0" y="244.7" text-anchor="middle" font-size="12" fill="#3730A3">Worker thread 3</text>
<text x="75.0" y="259.7" text-anchor="middle" font-size="12" fill="#3730A3">(frame job)</text>
<rect x="165" y="220" width="130" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="230.0" y="244.8" text-anchor="middle" font-size="11" fill="#92400E">VkCommandPool 3</text>
<text x="230.0" y="258.9" text-anchor="middle" font-size="11" fill="#92400E">owned by thread 3</text>
<rect x="330" y="220" width="130" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="395.0" y="244.8" text-anchor="middle" font-size="11" fill="#374151">Command buffer 3</text>
<text x="395.0" y="258.9" text-anchor="middle" font-size="11" fill="#374151">vkCmd* recording</text>
<line x1="130" y1="248" x2="165" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="295" y1="248" x2="330" y2="248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<line x1="460" y1="248" x2="520" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<rect x="520" y="100" width="220" height="140" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="152.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Submit thread</text>
<text x="630.0" y="166.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">collects the buffers in order</text>
<text x="630.0" y="180.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">vkQueueSubmit2 (one thread</text>
<text x="630.0" y="194.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">at a time per VkQueue)</text>
<line x1="630" y1="240" x2="630" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-mt-rec)"/>
<rect x="520" y="285" width="220" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="314.2" text-anchor="middle" font-size="12" fill="#1F2937">VkQueue  then  GPU</text>
<rect x="20" y="310" width="440" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240.0" y="334.9" text-anchor="middle" font-size="11" fill="#374151">Shared and safe to call from many threads:</text>
<text x="240.0" y="348.9" text-anchor="middle" font-size="11" fill="#374151">VkPipelineCache (internally synchronized by default),</text>
<text x="240.0" y="362.9" text-anchor="middle" font-size="11" fill="#374151">creating distinct objects, read-only use of objects</text>
<text x="380" y="410" text-anchor="middle" font-size="11" fill="#374151">A pool, and every buffer allocated from it, must never be used by two threads at the same time.</text>
</svg>
