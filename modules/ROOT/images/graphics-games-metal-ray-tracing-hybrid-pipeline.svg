<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ray-tracing-hybrid-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A hybrid frame: raster for primary visibility, rays for the rest</text>
<rect x="20" y="90" width="128" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Raster pass</text>
<text x="84.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">G-buffer: depth,</text>
<text x="84.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">normal, albedo</text>
<line x1="148" y1="135" x2="168" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)"/>
<rect x="168" y="90" width="128" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="232.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Ray pass</text>
<text x="232.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">compute kernel:</text>
<text x="232.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">shadow + reflection</text>
<line x1="296" y1="135" x2="316" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)"/>
<rect x="316" y="90" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Denoise</text>
<text x="380.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">temporal / MetalFX</text>
<text x="380.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">denoiser or blur</text>
<line x1="444" y1="135" x2="464" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)"/>
<rect x="464" y="90" width="128" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="528.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Composite</text>
<text x="528.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">lighting + rays</text>
<text x="528.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">to HDR target</text>
<line x1="592" y1="135" x2="612" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)"/>
<rect x="612" y="90" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="676.0" y="131.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Tone map</text>
<text x="676.0" y="145.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and present</text>
<rect x="20" y="220" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="251.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Acceleration structure rebuilt or refit each frame;</text>
<text x="190.0" y="265.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the ray pass binds it through the argument table</text>
<rect x="400" y="220" width="340" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="251.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Half-resolution rays plus an upscaling or denoising</text>
<text x="570.0" y="265.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">step keep the cost within a frame budget</text>
<line x1="190" y1="220" x2="190" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)" stroke-dasharray="4 3"/>
<line x1="570" y1="220" x2="445" y2="182" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-ray-tracing-hybrid-pipeline)" stroke-dasharray="4 3"/>
<text x="380" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The ray pass can read depth and normals from the raster pass, so primary rays are never traced.</text>
</svg>
